lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la construction narrative avec היה se rend naturellement en français avec « fut adressée », qui exprime la venue de la parole tout en évitant le calque pesant « il arriva que ».
- source_word: דְבַר
  choice: La parole
  rationale: דָּבָר désigne ici la parole ou le message divin. « La parole » conserve la formule prophétique consacrée et le lien construit avec le nom divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante « Yahvé », qui représente le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend avec naturel la direction indiquée par אֵלַי, « à moi ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours divin qui suit. « En ces termes : » est une formulation française naturelle et concise qui signale explicitement la citation à venir.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. La traduction conserve donc le nom personnel sous sa forme française usuelle, sans le remplacer par un titre.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve l’idiome prophétique tout en restant naturelle; les deux-points annoncent la parole rapportée au verset suivant.
