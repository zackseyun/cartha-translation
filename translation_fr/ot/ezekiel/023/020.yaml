  text: וַֽ/תַּעְגְּבָ֔/ה עַ֖ל פִּֽלַגְשֵׁי/הֶ֑ם אֲשֶׁ֤ר בְּשַׂר חֲמוֹרִים֙ בְּשָׂרָ֔/ם וְ/זִרְמַ֥ת סוּסִ֖ים זִרְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
translation:
  language: fr
  text: Elle brûla de désir pour leurs amants[a], dont la chair était comme celle des ânes[b], et dont l’émission était comme celle des chevaux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs concubines ». Dans ce contexte, le terme est généralement compris au sens métaphorique de partenaires sexuels ou d’amants.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « chair » est probablement un euphémisme sexuel désignant les organes génitaux.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus explicitement : « sperme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: Elle brûla de désir pour
  rationale: Le verbe עגב avec עַל exprime ici un désir sexuel intense. « Brûla de désir pour » restitue cette force dans un français naturel et digne.
- source_word: פִּלַגְשֵׁיהֶם
  choice: leurs amants
  rationale: Le mot désigne littéralement des « concubines », mais il est employé dans cette métaphore sexuelle pour les partenaires masculins recherchés par la femme personnifiée. La difficulté lexicale est signalée en note.
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: dont la chair était comme celle des ânes
  rationale: La formulation conserve « chair », sens premier de בָּשָׂר, et préserve ainsi l’euphémisme cru du texte hébreu sans expliciter silencieusement son référent sexuel.
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: et dont l’émission était comme celle des chevaux
  rationale: זִרְמָה désigne ici un écoulement, vraisemblablement l’émission séminale. « Émission » maintient le caractère concret mais quelque peu euphémistique de l’hébreu.
