  text: clothed in blue[a], governors and officials, all of them desirable young men[c][b], horsemen riding horses.
translation:
  language: fr
  text: vêtus de bleu[a], gouverneurs et hauts fonctionnaires[b], tous, de séduisants jeunes hommes[c], cavaliers montés sur des chevaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtus de bleu-violet » ; תְכֵלֶת peut désigner une étoffe teinte d’un bleu tirant sur le violet.
    reason: lexical_alternative
  - marker: b
    text: Le second titre peut aussi être rendu par « préfets » ou « délégués » ; l’équivalent exact de ce titre administratif est incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « de beaux jeunes hommes » ou « de jeunes hommes de choix » ; l’hébreu souligne leur jeunesse et leur pouvoir d’attraction.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשֵׁי
  choice: vêtus de
  rationale: Le participe passif de לבשׁ décrit leur tenue; « vêtus de » en conserve la valeur descriptive dans un français naturel et digne.
- source_word: תְכֵלֶת
  choice: bleu
  rationale: Le terme désigne une étoffe ou une teinte bleue pouvant tirer sur le violet. « Bleu » est la formulation la plus claire, tandis qu’une note préserve l’incertitude chromatique.
- source_word: פַּחוֹת
  choice: gouverneurs
  rationale: Le mot désigne des responsables de rang élevé dans l’administration impériale. « Gouverneurs » est clair sans imposer un titre institutionnel trop précis.
- source_word: וּסְגָנִים
  choice: hauts fonctionnaires
  rationale: Le terme désigne des autorités subordonnées de haut rang. « Hauts fonctionnaires » le distingue de « gouverneurs » tout en évitant la fausse précision de titres modernes.
- source_word: בַּחוּרֵי חֶמֶד
  choice: de séduisants jeunes hommes
  rationale: בַּחוּרֵי évoque des hommes jeunes, dans la force de l’âge, et חֶמֶד leur caractère désirable. « Séduisants » rend naturellement la nuance d’attirance dans le contexte érotique du chapitre.
- source_word: כֻּלָּם
  choice: tous
  rationale: « Tous » reprend explicitement l’ensemble des hommes décrits et s’intègre sans lourdeur à la syntaxe française.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le terme courant « cavaliers » désigne naturellement des hommes montés, sans la coloration militaire plus technique de « soldats de cavalerie ».
- source_word: רֹכְבֵי סוּסִים
  choice: montés sur des chevaux
  rationale: Cette formulation maintient la précision appositionnelle du texte hébreu, malgré la légère redondance avec « cavaliers ».
