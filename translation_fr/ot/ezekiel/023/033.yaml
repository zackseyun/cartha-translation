  text: שִׁכָּר֥וֹן וְ/יָג֖וֹן תִּמָּלֵ֑אִי כּ֚וֹס שַׁמָּ֣ה וּ/שְׁמָמָ֔ה כּ֖וֹס אֲחוֹתֵ֥/ךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/033.yaml
  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: fr
  text: Tu seras remplie d’ivresse et de chagrin, d’une coupe d’horreur et de dévastation, la coupe de ta sœur Samarie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּרוֹן
  choice: ivresse
  rationale: Rend directement l’état d’enivrement évoqué par la coupe du jugement.
- source_word: יָגוֹן
  choice: chagrin
  rationale: Exprime la peine profonde du terme hébreu dans un français courant et digne.
- source_word: שַׁמָּה
  choice: horreur
  rationale: Le mot peut désigner la stupeur ou l’épouvante causée par un désastre; « horreur » convient ici à la métaphore du jugement.
- source_word: שְׁמָמָה
  choice: dévastation
  rationale: Conserve l’idée de ruine et de désolation produite par le jugement.
- source_word: כּוֹס
  choice: coupe
  rationale: Préserve l’image biblique centrale de la coupe bue comme expérience du jugement.
theological_decisions:
- issue: Rapport syntaxique entre le remplissage et la coupe
  choice: « remplie… par une coupe »
  alternative: « remplie… d’une coupe » ou « avec une coupe »
  rationale: Le texte hébreu juxtapose les expressions sans expliciter précisément leur rapport; « par » produit un français naturel tout en présentant la coupe comme le moyen de l’ivresse et du chagrin.
- issue: Nature de la coupe
  choice: Conserver la métaphore sans expliciter « jugement »
  alternative: « la coupe du jugement »
  rationale: L’explicitation serait contextuellement plausible, mais elle ajouterait un terme absent du verset et réduirait la force ouverte de l’image.
translation_notes:
  register: Français moderne international, sobre et solennel. Le féminin de « remplie » correspond à la destinataire féminine du discours; « Samarie » est traité comme nom propre sans article, usage naturel en français biblique.
