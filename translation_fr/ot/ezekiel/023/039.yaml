source:
  edition: WLC
  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: fr
  text: Après avoir égorgé leurs fils pour leurs idoles, elles sont entrées le même jour dans mon sanctuaire pour le profaner. Voilà ce qu’elles ont fait au sein même de ma maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחֲטָם
  choice: avoir égorgé
  rationale: Le verbe שׁחט désigne concrètement l’égorgement, notamment sacrificiel; « égorger » conserve ici la violence et le cadre cultuel du geste.
- source_word: גִלּוּלֵיהֶם
  choice: leurs idoles
  rationale: גִּלּוּלִים est un terme dépréciatif pour les idoles; « idoles » est naturel et clair en français, sans introduire une image étymologique incertaine.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: « Sanctuaire » rend le lieu consacré appartenant à Dieu et maintient le vocabulaire cultuel.
- source_word: וְהִנֵּה
  choice: Voilà
  rationale: Dans cette conclusion accusatrice, « Voilà » attire l’attention avec naturel et dignité, tout en conservant la force présentative de הִנֵּה.
- source_word: בְּתוֹךְ בֵּיתִי
  choice: au sein même de ma maison
  rationale: Cette formulation rend la localisation intérieure et souligne le scandale d’un acte commis jusque dans la maison de Dieu.
theological_decisions:
- issue: Rapport temporel entre le sacrifice des fils et l’entrée dans le sanctuaire
  choice: Après avoir égorgé… elles sont entrées le même jour
  alternative: Quand elles égorgeaient… elles entraient
  rationale: La construction בְּשַׁחֲטָם suivie de וַיָּבֹאוּ situe naturellement l’entrée après l’égorgement, tandis que « le même jour » souligne la proximité temporelle sans préciser davantage la séquence.
- issue: Sujet féminin implicite
  choice: elles
  alternative: ils
  rationale: Le contexte immédiat d’Ézéchiel 23 présente les deux femmes figuratives comme sujet; le français exige un pronom genré là où l’hébreu verbal permet de suivre le référent contextuel.
translation_notes:
  register: Français moderne, international et digne. La phrase reste directe et accusatrice; « égorgé » préserve la brutalité cultuelle du texte, tandis que « Voilà » évite un archaïsme inutile.
