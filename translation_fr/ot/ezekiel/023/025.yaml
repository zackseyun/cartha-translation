base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: fr
  text: Je dirigerai ma jalousie contre toi, et ils te traiteront avec fureur. Ils t’enlèveront le nez et les oreilles[a], et ceux qui resteront de toi[b] tomberont par l’épée. Ils prendront tes fils et tes filles, et ce qui restera de toi[b] sera dévoré par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils te couperont le nez et les oreilles ». Le verbe hébreu signifie plus littéralement « enlever » ou « ôter », mais le contexte peut évoquer une mutilation.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut aussi signifier « ta fin », « ton avenir » ou « ce qui subsiste de toi ». Dans ce contexte, elle paraît désigner ce qui reste après les premiers ravages.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: Je dirigerai contre toi ma jalousie
  rationale: נתן signifie littéralement « donner, placer » ; avec קנאה et la préposition ב, « diriger contre » exprime naturellement l’orientation hostile de la jalousie sans effacer l’image relationnelle.
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: ils te traiteront avec fureur
  rationale: Cette formulation rend idiomatiquement l’action exercée contre la destinataire sous l’effet d’une colère intense.
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: Ils t’enlèveront le nez et les oreilles
  rationale: Le hifil de סור signifie « enlever, ôter ». Le contexte peut évoquer une mutilation, mais le texte ne précise pas explicitement le procédé.
- source_word: וְאַחֲרִיתֵךְ
  choice: ceux qui resteront de toi / ce qui restera de toi
  rationale: אַחֲרִית peut désigner la fin, l’avenir ou ce qui reste. Ici, les deux occurrences renvoient probablement aux personnes puis à l’ensemble de ce qui subsiste après la dévastation.
- source_word: בַּחֶרֶב תִּפּוֹל
  choice: tomberont par l’épée
  rationale: Expression française courante qui conserve l’image guerrière et la valeur résultative de l’hébreu.
- source_word: הֵמָּה בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ
  choice: Ils prendront tes fils et tes filles
  rationale: לקח signifie largement « prendre ». Le contexte permet d’entendre la capture ou la déportation sans qu’il soit nécessaire de la préciser dans le texte.
- source_word: תֵּאָכֵל בָּאֵשׁ
  choice: sera dévoré par le feu
  rationale: Le nifal de אכל est passif et conserve l’image forte de quelque chose que le feu dévore.
theological_decisions:
- issue: Sens de קִנְאָה dans le cadre du jugement
  choice: ma jalousie
  alternative: mon zèle
  rationale: Dans l’image conjugale et l’accusation d’infidélité qui structurent le chapitre, « jalousie » préserve la dimension relationnelle et la tension théologique du terme.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement féminin est imposé par l’adresse hébraïque à la femme symbolique. Les images violentes sont conservées sans atténuation ni précision ajoutée.
