  variant: modern international French
source:
  edition: WLC
  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: fr
  text: les fils de Babylone et tous les Chaldéens[a], Peqod, Shoa et Qoa, ainsi que tous les fils d’Assyrie avec eux — de séduisants jeunes hommes, tous gouverneurs et hauts fonctionnaires, officiers et hommes de renom[b], tous montés sur des chevaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peqod, Shoa et Qoa sont probablement les noms de peuples ou de régions alliés à Babylone; certains comprennent plutôt ces termes comme des désignations telles que « fonctionnaires, nobles et guerriers ».
    reason: alternative_reading
  - marker: b
    text: Ou « hommes distingués »; plus littéralement, « hommes appelés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  choice: les fils de Babylone
  rationale: Conserve l’expression hébraïque et son parallélisme avec « les fils d’Assyrie »; cette tournure reste intelligible en français biblique moderne.
- source_word: כַּשְׂדִּים
  choice: les Chaldéens
  rationale: Maintient la désignation ethnique traditionnelle, distincte de Babylone dans l’énumération.
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: Peqod, Shoa et Qoa
  rationale: Les termes sont pris comme des noms propres de peuples ou de régions, conformément à la structure de la liste; l’autre interprétation est signalée en note.
- source_word: כָּל בְּנֵי אַשּׁוּר אוֹתָם
  choice: ainsi que tous les fils d’Assyrie avec eux
  rationale: Reproduit l’expression ethnique hébraïque et comprend אוֹתָם comme marquant l’accompagnement.
- source_word: בַּחוּרֵי חֶמֶד
  choice: de séduisants jeunes hommes
  rationale: « Séduisants » exprime l’attrait et la désirabilité évoqués par חֶמֶד, en accord avec l’imagerie érotique du chapitre.
- source_word: פַּחוֹת
  choice: gouverneurs
  rationale: Équivalent clair du titre administratif impérial, sans précision bureaucratique incertaine.
- source_word: סְגָנִים
  choice: hauts fonctionnaires
  rationale: Rend un rang administratif associé aux gouverneurs et distingue naturellement les deux titres en français.
- source_word: שָׁלִשִׁים
  choice: officiers
  rationale: Communique le rang militaire sans imposer une fonction technique incertaine telle que « écuyers » ou « officiers de chars ».
- source_word: קְרוּאִים
  choice: hommes de renom
  rationale: Dans cette liste honorifique, désigne vraisemblablement des hommes reconnus ou distingués; le sens littéral est conservé en note.
- source_word: רֹכְבֵי סוּסִים
  choice: montés sur des chevaux
  rationale: Rend naturellement le participe descriptif et maintient l’image explicite des chevaux.
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: tous ... tous ... tous
  rationale: Préserve l’insistance cumulative produite par la triple répétition hébraïque.
theological_decisions: []
