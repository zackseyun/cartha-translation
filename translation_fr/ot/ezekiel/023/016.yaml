reference: Ezekiel 23:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ו/תעגב עֲלֵי/הֶ֖ם לְ/מַרְאֵ֣ה עֵינֶ֑י/הָ וַ/תִּשְׁלַ֧ח מַלְאָכִ֛ים אֲלֵי/הֶ֖ם כַּשְׂדִּֽימָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/016.yaml
  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
translation:
  language: fr
  text: À leur vue[a], elle éprouva pour eux un désir ardent et leur envoya des messagers en Chaldée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la vue de ses yeux »; autre traduction possible : « quand ses yeux les virent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vers la Chaldée » ou « chez les Chaldéens ». La forme hébraïque comporte une terminaison indiquant la direction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: elle éprouva pour eux un désir ardent
  rationale: Le verbe עגב exprime ici un désir intense à connotation érotique. Cette formulation française conserve la force sexuelle de la métaphore prophétique sans employer une tournure archaïque.
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: À leur vue
  rationale: Littéralement, l’expression évoque « la vue de ses yeux ». « À leur vue » en restitue naturellement le sens causal en français, tandis que la formulation concrète de l’hébreu est signalée en note.
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: et leur envoya des messagers
  rationale: מַלְאָכִים désigne des messagers et peut ici inclure des émissaires diplomatiques. Le terme général « messagers » évite de préciser indûment leur statut officiel.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: Le pronom indirect français rend naturellement la direction des messagers vers les hommes désirés.
- source_word: כַּשְׂדִּימָה
  choice: en Chaldée
  rationale: La terminaison directionnelle indique un mouvement vers la Chaldée ou vers les Chaldéens. Avec « envoya », « en Chaldée » exprime idiomatiquement la destination en français; les autres analyses possibles sont conservées en note.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité politique et religieuse
  choice: Conserver explicitement l’intensité érotique par « un désir ardent »
  alternative: elle les admira / elle s’attacha à eux
  rationale: Ézéchiel 23 emploie délibérément une image sexuelle choquante pour dénoncer l’infidélité. Une formulation atténuée affaiblirait la portée rhétorique et théologique du texte.
translation_notes:
  register: Français international actuel, clair et digne. La formulation garde la vigueur de l’image érotique tout en restant naturelle; les deux notes préservent les particularités et l’ambiguïté de l’expression hébraïque.
