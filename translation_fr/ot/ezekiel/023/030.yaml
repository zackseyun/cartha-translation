source:
  edition: WLC
  text: עָשֹׂ֥ה אֵ֖לֶּה לָ֑/ךְ בִּ/זְנוֹתֵ/ךְ֙ אַחֲרֵ֣י גוֹיִ֔ם עַ֥ל אֲשֶׁר נִטְמֵ֖את בְּ/גִלּוּלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
translation:
  language: fr
  text: Tout cela t’est fait parce que tu t’es prostituée en courant après les nations, parce que tu t’es rendue impure par leurs idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est un terme méprisant, que l’on peut aussi rendre par « idoles immondes » ou « idoles-ordures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: Tout cela t’est fait
  rationale: Cette tournure passive et impersonnelle rend l’expression hébraïque sans ajouter un sujet qui n’est pas nommé dans la proposition. « Tout cela » renvoie naturellement aux jugements décrits auparavant.
- source_word: בִּזְנוֹתֵךְ
  choice: parce que tu t’es prostituée
  rationale: Le préfixe ב est compris dans un sens causal. Le verbe conserve l’image sexuelle volontairement forte par laquelle Ézéchiel dépeint l’infidélité idolâtre.
- source_word: אַחֲרֵי גוֹיִם
  choice: en courant après les nations
  rationale: La locution signifie littéralement aller « après » quelqu’un. « Courir après » exprime en français actuel la poursuite empressée suggérée par l’hébreu, tandis que « les nations » conserve la désignation politique et ethnique du texte.
- source_word: נִטְמֵאת
  choice: tu t’es rendue impure
  rationale: Le nifal peut décrire l’entrée dans un état d’impureté ou avoir une nuance réflexive. Cette formulation conserve l’idée d’impureté tout en faisant ressortir la responsabilité du sujet dans le contexte.
- source_word: בְּגִלּוּלֵיהֶם
  choice: par leurs idoles
  rationale: La préposition est comprise comme indiquant le moyen. « Idoles » est clair dans le texte principal; la nuance méprisante propre au terme hébreu est signalée en note.
theological_decisions:
- issue: Maintien de la métaphore sexuelle de l’infidélité
  choice: tu t’es prostituée
  alternative: tu as été infidèle / tu as pratiqué l’idolâtrie
  rationale: Le texte associe intentionnellement prostitution, poursuite des nations et idolâtrie. Remplacer la métaphore par son interprétation en atténuerait la force.
- issue: Valeur péjorative de גִּלּוּלִים
  choice: idoles dans le texte, avec une note
  alternative: ordures idolâtriques / idoles immondes
  rationale: Le terme hébreu est délibérément méprisant, mais une traduction littérale de cette nuance serait peu naturelle et risquerait de figer une étymologie discutée. La note préserve la force du mot sans alourdir le verset.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin singulier est conservé, puisque Jérusalem est interpellée sous les traits d’une femme. La répétition de « parce que » reflète les deux formulations causales du texte hébreu.
