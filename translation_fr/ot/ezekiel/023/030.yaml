  verdict: approve
  source_fidelity: 'Le verset rend correctement la construction causale : les conséquences annoncées sont liées à la prostitution avec/poursuite des nations et à la souillure par leurs idoles. « Tout cela t’est fait » conserve utilement l’impersonnel du texte source sans introduire un agent. « Par leurs idoles » est défendable pour בְּ, compris ici comme marquant le moyen ; il ne force pas davantage le sens que « avec ».

    '
  naturalness: Le français est moderne, clair et d’un registre sobre. « En courant après les nations » est une expression idiomatique qui communique la dynamique de poursuite contenue dans אַחֲרֵי, sans effacer la métaphore sexuelle conservée par « tu t’es prostituée ». La répétition de « parce que » est fluide et reflète les deux justifications du texte.
  terminology: « Se prostituer » maintient la métaphore volontairement sexualisée d’Ézéchiel sans la réduire à une explication doctrinale. « Idoles » est le terme français courant ; la note signale à juste titre la portée méprisante de גִּלּוּלִים sans imposer comme traduction principale une étymologie ou une paraphrase incertaine.
