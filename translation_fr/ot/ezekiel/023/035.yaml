base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : parce que tu m’as oublié et que tu m’as relégué derrière ton dos[a], toi aussi, tu devras répondre de ta conduite infâme et de tes actes de prostitution.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu m’as jeté derrière ton dos ». Cette expression hébraïque traduit un rejet ou un mépris délibéré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve les deux éléments du titre hébreu et rend explicitement le nom divin, sans la répétition peu naturelle « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit clairement, en français moderne, le motif du jugement qui suit.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: tu m’as oublié
  rationale: Le passé composé exprime naturellement en français une action accomplie dont les conséquences demeurent présentes.
- source_word: וַתַּשְׁלִיכִי אוֹתִי אַחֲרֵי גַוֵּךְ
  choice: tu m’as rejeté derrière ton dos
  rationale: « Rejeter » communique le mépris délibéré impliqué par l’image, tandis que « derrière ton dos » en conserve la formulation concrète.
- source_word: וְגַם אַתְּ
  choice: toi aussi
  rationale: La tournure détachée préserve l’insistance portée par le pronom hébreu.
- source_word: שְׂאִי
  choice: tu porteras le poids de
  rationale: L’impératif fonctionne ici comme une sentence judiciaire inéluctable; le futur français le rend naturellement, et « le poids de » explicite l’idée de subir les conséquences sans réduire le verbe à une simple souffrance.
- source_word: זִמָּתֵךְ
  choice: ta conduite infâme
  rationale: Dans ce contexte sexualisé, le terme désigne une conduite honteuse et moralement perverse; cette formulation est forte, actuelle et intelligible.
- source_word: תַּזְנוּתָיִךְ
  choice: tes prostitutions
  rationale: Le pluriel concret préserve directement les actes répétés de prostitution, employés dans le chapitre comme image de l’infidélité.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte directement le nom divin avec le titre אֲדֹנָי; « le Seigneur Yahweh » préserve cette distinction et évite d’effacer le nom propre.
- issue: Portée judiciaire de שְׂאִי
  choice: tu porteras le poids de
  alternative: porte
  rationale: Dans cet oracle de jugement, l’impératif énonce une conséquence imposée. Le futur conserve la force de la sentence sans la présenter comme une simple invitation à agir.
- issue: Sens de la prostitution dans le contexte
  choice: maintien du vocabulaire concret « prostitutions »
  alternative: infidélités
  rationale: Le chapitre exploite délibérément une métaphore sexuelle dure pour dénoncer l’infidélité; la remplacer par son seul référent théologique atténuerait l’image et résoudrait le langage du texte.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin singulier de l’hébreu est conservé dans l’adresse (« tu »), dont le référent ressort du contexte du chapitre. La dureté du langage judiciaire et sexuel est maintenue sans archaïsme.
