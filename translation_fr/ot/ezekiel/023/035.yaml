  source_fidelity: Le titre אֲדֹנָי יְהוִה est correctement conservé par « le Seigneur Yahweh ». Le motif causal, l’adresse féminine singulière et la portée judiciaire de l’impératif sont bien rendus. Toutefois, « rejeté derrière ton dos » n’est pas une collocation française naturelle et affaiblit l’image concrète de jeter Dieu derrière soi. « Le poids de » introduit également un élément absent du texte source.
  naturalness: Le registre est globalement moderne et digne. « Tu m’as jeté derrière ton dos » est plus proche de l’image hébraïque, mais reste peu idiomatique en français contemporain; « tu m’as relégué derrière ton dos » conserve l’image tout en exprimant naturellement le rejet délibéré. « Tu devras répondre de » rend clairement en français la sentence judiciaire impliquée par « porte ».
  terminology: « Conduite infâme » rend convenablement זִמָּה sans imposer une interprétation doctrinale. « Actes de prostitution » est plus naturel et plus précis que « prostitutions » pour le pluriel concret תַּזְנוּתָיִךְ, tout en maintenant la métaphore sexuelle dure du texte.
