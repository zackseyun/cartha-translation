  text: וְ/עָשׂ֨וּ אוֹתָ֜/ךְ בְּ/שִׂנְאָ֗ה וְ/לָקְחוּ֙ כָּל יְגִיעֵ֔/ךְ וַ/עֲזָב֖וּ/ךְ עֵירֹ֣ם וְ/עֶרְיָ֑ה וְ/נִגְלָה֙ עֶרְוַ֣ת זְנוּנַ֔יִ/ךְ וְ/זִמָּתֵ֖/ךְ וְ/תַזְנוּתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: fr
  text: 'Ils te traiteront avec haine, prendront tout le fruit de ton travail[a] et te laisseront nue et dépouillée. La nudité de tes prostitutions sera dévoilée[b] : ta débauche et tes actes de prostitution[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce que tu as acquis par ton travail ». Le mot hébreu peut désigner le travail lui-même ou ce qu’il rapporte.
    reason: lexical_alternative
  - marker: b
    text: Ou « la honte de tes prostitutions sera exposée ». Ici, la « nudité » évoque aussi une exposition honteuse.
    reason: lexical_alternative
  - marker: c
    text: 'Autre compréhension : « sera dévoilée, ainsi que ta débauche et tes actes de prostitution ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: Ils te traiteront avec haine
  rationale: L’expression עשה + complément + בְּ indique ici la manière dont la personne sera traitée. Cette formulation française reste proche de l’hébreu tout en étant naturelle.
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: prendront tout le fruit de ton travail
  rationale: יְגִיעַ désigne l’effort ou le travail, et par extension ce qu’il produit. « Le fruit de ton travail » exprime clairement dans ce contexte les biens acquis par le labeur sans réduire le terme à la seule richesse.
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: te laisseront nue et dénudée
  rationale: Le doublet hébreu accentue à la fois la nudité, l’exposition et le dénuement. Le doublet français conserve cette insistance.
- source_word: וְנִגְלָה עֶרְוַת זְנוּנַיִךְ
  choice: La nudité de tes prostitutions sera mise à découvert
  rationale: Le passif « sera mise à découvert » prolonge naturellement la série d’actions futures. « Nudité » maintient l’image concrète de l’exposition honteuse, et « prostitutions » conserve la métaphore volontairement explicite d’Ézéchiel.
- source_word: וְזִמָּתֵךְ
  choice: ta conduite infâme
  rationale: Dans ce contexte sexuel et accusateur, זִמָּה évoque une conduite honteuse et dépravée. « Conduite infâme » garde la condamnation morale sans limiter artificiellement le mot à un projet prémédité.
- source_word: וְתַזְנוּתָיִךְ
  choice: tes actes de prostitution
  rationale: Cette expression conserve la répétition rhétorique des termes hébreux apparentés tout en distinguant légèrement תַּזְנוּת du pluriel זְנוּנִים rendu plus tôt par « prostitutions ».
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité de Jérusalem
  choice: Conserver explicitement le langage de la prostitution
  alternative: Employer des termes atténués comme « infidélité » ou « immoralité »
  rationale: La violence de cette image appartient à la rhétorique prophétique du passage. L’atténuer ferait disparaître une dimension intentionnelle du texte et résoudrait son caractère choquant au lieu de le transmettre.
- issue: Rapport syntaxique des deux derniers groupes nominaux avec « la nudité de tes prostitutions »
  choice: Les présenter après deux-points comme une explicitation en apposition
  alternative: 'Les coordonner comme des éléments distincts : « ainsi que ta conduite infâme et tes actes de prostitution »'
  rationale: Le verbe singulier וְנִגְלָה s’accorde directement avec le sujet singulier עֶרְוַת. Les groupes suivants peuvent donc préciser ce qui est dévoilé. Une note conserve toutefois la possibilité d’une simple coordination.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin suit l’adresse allégorique du contexte. Le vocabulaire sexuel explicite est conservé, sans archaïsme ni euphémisation. Les deux-points rendent lisible l’apposition probable tout en laissant l’autre analyse syntaxique en note.
