source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: fr
  text: Ainsi, j’ôterai de toi ta conduite obscène et ta prostitution venue du pays d’Égypte. Tu ne lèveras pas les yeux vers eux[a], et tu ne te souviendras plus de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne te tourneras pas vers eux ». L’expression hébraïque « lever les yeux vers » peut évoquer le désir, l’attention ou le recours à quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: je ferai cesser
  rationale: 'Le hiphil de שׁבת exprime ici la causation : Dieu fera cesser cette conduite. Cette formulation française conserve cette valeur causative.'
- source_word: זִמָּתֵךְ
  choice: ta conduite obscène
  rationale: Dans le contexte sexuel et judiciaire d’Ézéchiel 23, זִמָּה désigne une conduite honteuse et sexuellement dépravée plutôt qu’une méchanceté générique.
- source_word: מִמֵּךְ
  choice: en toi
  rationale: La préposition indique que cette conduite sera supprimée de la femme personnifiant la ville. « En toi » produit une tournure française naturelle avec « faire cesser ».
- source_word: וְאֶת זְנוּתֵךְ מֵאֶרֶץ מִצְרָיִם
  choice: ta prostitution commencée au pays d’Égypte
  rationale: Le second objet dépend lui aussi de « je ferai cesser ». La provenance égyptienne qualifie naturellement cette prostitution; « commencée » explicite sobrement l’origine indiquée par מִן et évite de suggérer que l’acte sera supprimé du territoire égyptien.
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: tu ne lèveras plus les yeux vers eux
  rationale: La traduction garde l’image hébraïque, qui peut évoquer le désir, l’attention ou le recours, sans choisir arbitrairement une seule nuance.
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: et tu ne te souviendras plus de l’Égypte
  rationale: Cette formulation moderne rend clairement la cessation exprimée par לֹא…עוֹד, tout en conservant l’Égypte comme objet explicite du souvenir.
theological_decisions:
- issue: Nature du langage sexuel dans le discours prophétique
  choice: Conserver directement la métaphore sexuelle avec « conduite obscène » et « prostitution ».
  alternative: Employer des termes généraux tels que « immoralité » ou « infidélité ».
  rationale: Le texte hébreu emploie volontairement une image sexuelle forte pour décrire l’infidélité religieuse et politico-religieuse de Jérusalem. L’atténuer ferait perdre la force de l’oracle de jugement.
- issue: Portée de l’expression « lever les yeux vers eux »
  choice: Préserver l’image sans la réduire à une interprétation précise.
  alternative: Traduire « chercher leur aide » ou « les désirer ».
  rationale: L’expression peut suggérer le désir, l’attention ou la dépendance. Le contexte n’impose pas une seule de ces nuances.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin singulier est maintenu parce que le discours s’adresse à la femme qui personnifie Jérusalem. La métaphore sexuelle reste explicite sans recourir à un vocabulaire archaïque.
