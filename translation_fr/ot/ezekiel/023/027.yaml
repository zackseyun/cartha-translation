review_pass:
  verdict: revise
  source_fidelity: La préposition מִמֵּךְ signifie « de toi / loin de toi » et exprime le retrait de la conduite; « en toi » inverse cette relation. « commencée » ajoute l’idée d’un début que le texte hébreu n’énonce pas explicitement. La seconde négation ne contient pas עוֹד (« plus »), lequel appartient à la dernière proposition; il convient de ne pas étendre inutilement « plus » à « lever les yeux ».
  naturalness: Le texte révisé reste fluide et digne en français international moderne. « Ôter de toi » rend naturellement l’idée de retrait, tandis que « venue du pays d’Égypte » indique la provenance sans introduire l’idée explicite d’un commencement.
  terminology: « Conduite obscène » et « prostitution » rendent de manière appropriée le langage sexuel marqué de זִמָּה et זְנוּת. « Lever les yeux vers eux » conserve l’image ambiguë du texte; la note en explicite les nuances possibles sans les imposer.
  issues:
  - severity: medium
    issue: « en toi » pour מִמֵּךְ
    rationale: Le texte dit que YHWH fera cesser/ôtera cette conduite « de toi », non qu’il la fera cesser « en toi ». La formulation actuelle modifie l’image de retrait portée par la préposition.
  - severity: medium
    issue: Ajout de « commencée »
    rationale: « Commencée au pays d’Égypte » interprète מֵאֶרֶץ מִצְרָיִם comme le début explicite de la prostitution. L’hébreu indique une provenance ou un lien avec l’Égypte, sans employer de verbe de commencement.
  - severity: low
    issue: Extension de « plus » à la proposition sur les yeux
    rationale: L’adverbe עוֹד figure dans la proposition finale sur le souvenir de l’Égypte. Le français peut garder la cessation implicite dans la première négation et réserver « plus » à la dernière proposition.
  revised_text: Ainsi, j’ôterai de toi ta conduite obscène et ta prostitution venue du pays d’Égypte. Tu ne lèveras pas les yeux vers eux[a], et tu ne te souviendras plus de l’Égypte.
