revisions:
- from: Ainsi, je ferai cesser en toi ta conduite obscène et ta prostitution commencée au pays d’Égypte. Tu ne lèveras plus les yeux vers eux[a] et tu ne te souviendras plus de l’Égypte.
  to: Ainsi, j’ôterai de toi ta conduite obscène et ta prostitution venue du pays d’Égypte. Tu ne lèveras pas les yeux vers eux[a], et tu ne te souviendras plus de l’Égypte.
  rationale: La révision corrige la direction de « de toi », évite d’ajouter un commencement à la prostitution associée à l’Égypte, et respecte la position de « plus » dans l’hébreu. Elle conserve l’ambiguïté de l’expression relative aux yeux et le registre direct du passage.
