revisions:
- from: Elle se livra à la prostitution avec eux[a], tous appartenant à l’élite des fils d’Assyrie. Auprès de tous ceux qu’elle désirait ardemment[b], elle se souilla avec toutes leurs idoles[c].
  to: Elle se prostitua avec eux, tous les fils d’Assyrie les plus distingués[a] ; et avec tous ceux qu’elle convoitait[b], elle se souilla avec toutes leurs idoles[c].
  rationale: La révision conserve la force et l’ambiguïté de la métaphore d’Ézéchiel, sans l’interpréter doctrinalement. Elle corrige le rattachement de l’ancre a, intègre plus naturellement l’apposition décrivant les Assyriens d’élite et rétablit la double construction « avec ... avec ... » du texte source.
