  text: וַ/תִּתֵּ֤ן תַּזְנוּתֶ֨י/הָ֙ עֲלֵי/הֶ֔ם מִבְחַ֥ר בְּנֵֽי אַשּׁ֖וּר כֻּלָּ֑/ם וּ/בְ/כֹ֧ל אֲשֶׁר עָֽגְבָ֛ה בְּ/כָל גִּלּוּלֵי/הֶ֖ם נִטְמָֽאָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: fr
  text: Elle se prostitua avec eux, tous les fils d’Assyrie les plus distingués[a] ; et avec tous ceux qu’elle convoitait[b], elle se souilla avec toutes leurs idoles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les meilleurs hommes d’Assyrie » ou « tous les meilleurs des Assyriens ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici des images sexuelles explicites — la prostitution et le désir passionné — comme métaphore prophétique de l’infidélité politique et religieuse ainsi que de l’idolâtrie.
    reason: cultural_note
  - marker: c
    text: Le mot hébreu traduit par « idoles » est un terme particulièrement méprisant qu’Ézéchiel emploie pour les idoles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: Elle se livra à la prostitution avec eux
  rationale: Littéralement, elle « donna ses prostitutions sur eux ». La formulation française retenue exprime naturellement le fait qu’elle s’offre activement à eux, tout en conservant l’image explicite de la prostitution.
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: tous appartenant à l’élite des fils d’Assyrie
  rationale: מִבְחַר désigne ce qui est choisi, excellent ou d’élite. « Fils d’Assyrie » conserve le masculin concret de בְּנֵי אַשּׁוּר, pertinent dans cette métaphore sexuelle.
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  choice: Auprès de tous ceux qu’elle désirait ardemment
  rationale: עָגְבָה exprime un désir passionné à nette connotation érotique. « désirait ardemment » garde cette intensité sans employer une tournure française vulgaire ou artificielle.
- source_word: בְּכָל גִּלּוּלֵיהֶם
  choice: avec toutes leurs idoles
  rationale: גִּלּוּלִים est le terme fortement méprisant qu’Ézéchiel emploie pour les idoles. « Idoles » transmet clairement le référent; une note signale la nuance péjorative difficile à reproduire sans surtraduire.
- source_word: נִטְמָאָה
  choice: elle se souilla
  rationale: Le niphal de טמא indique ici qu’elle devint impure ou souillée du fait de sa participation. La tournure pronominale française rend bien cette implication personnelle et la dimension cultuelle et morale.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité politique et cultuelle
  choice: Conserver dans le texte l’image explicite de la prostitution et du désir passionné.
  alternative: Atténuer en parlant seulement d’infidélité ou de déloyauté.
  rationale: La violence de l’image appartient à la rhétorique prophétique d’Ézéchiel. L’atténuer effacerait une tension voulue du texte et remplacerait l’image par son interprétation.
- issue: Valeur masculine de בְּנֵי אַשּׁוּר
  choice: fils d’Assyrie
  alternative: Assyriens ou hommes d’Assyrie
  rationale: Dans ce contexte sexuel, les référents sont bien des hommes. La traduction conserve donc le terme de parenté masculin du texte hébreu, tandis que la note donne des formulations françaises plus idiomatiques.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La syntaxe a été légèrement réorganisée pour rester claire en français tout en conservant les répétitions de « tous/toutes » et la vigueur de la métaphore hébraïque.
