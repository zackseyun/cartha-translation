  text: הֶ/חָמָ֥ס קָ֖ם לְ/מַטֵּה רֶ֑שַׁע לֹא מֵ/הֶ֞ם וְ/לֹ֧א מֵ/הֲמוֹנָ֛/ם וְ/לֹ֥א מֶ/הֱמֵ/הֶ֖ם וְ/לֹא נֹ֥הַּ בָּ/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: fr
  text: La violence s’est dressée en bâton de méchanceté. Il ne reste rien d’eux, ni de leur multitude, ni de leur abondance[a], et il n’y a parmi eux aucune prééminence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de cette série est elliptique et difficile. « Multitude » peut aussi signifier « abondance » ou « foule tumultueuse », et le mot rendu par « abondance » peut également évoquer les richesses ou le tumulte.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu est rare et de sens incertain. On peut aussi comprendre « prestige » ou « éminence »; selon une autre analyse, la proposition évoquerait l’absence de lamentation.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: La violence
  rationale: חָמָס désigne la violence, le tort ou l’injustice violente. L’article défini du texte hébreu est rendu, et le nom placé en tête conserve sa force presque personnifiée.
- source_word: קָם
  choice: s’est dressée
  rationale: Le parfait qal de קום exprime ici le fait de se lever ou de surgir. « S’est dressée » est naturel en français et maintient l’image menaçante.
- source_word: לְמַטֵּה רֶשַׁע
  choice: pour devenir un bâton de méchanceté
  rationale: מַטֶּה signifie « bâton », « verge » ou parfois « tribu ». Dans cet oracle de jugement, « bâton » évoque un instrument de domination ou de châtiment. La tournure avec « pour devenir » rend intelligible la valeur résultative possible de לְ sans réduire la métaphore à une simple comparaison.
- source_word: לֹא מֵהֶם
  choice: Il ne reste rien d’eux
  rationale: L’hébreu présente une série elliptique de groupes prépositionnels niés. Le verbe « reste » est suppléé d’après le contexte de destruction totale afin d’obtenir une phrase française compréhensible.
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: ni de leur multitude
  rationale: הָמוֹן peut évoquer une multitude, une abondance ou une foule tumultueuse. « Multitude » convient ici aux personnes emportées par le jugement tout en laissant les autres nuances à la note.
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: ni de leur abondance
  rationale: La forme est difficile et son sens discuté. « Abondance » reste assez large pour couvrir les idées de biens, de richesse ou de profusion sans préciser abusivement la nature de ce qui disparaît.
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: et il n’y a parmi eux aucune distinction
  rationale: נֹהַּ est un terme rare et obscur. « Distinction » exprime la prééminence ou le prestige que plusieurs analyses reconnaissent ici, tandis que l’incertitude lexicale est explicitement signalée en note.
theological_decisions:
- issue: Sens des expressions elliptiques et obscures dans l’annonce du jugement
  choice: Comprendre la suite comme l’affirmation que rien ne subsiste du peuple, de sa multitude ou de son abondance, et qu’aucune distinction ne demeure parmi eux.
  alternative: 'Conserver une formulation strictement littérale et opaque : « pas d’eux, pas de leur multitude, pas de leur tumulte, et pas de… parmi eux », ou comprendre la fin comme une absence de lamentation.'
  rationale: Le contexte immédiat d’Ézéchiel 7 favorise l’idée d’une disparition sous le jugement, mais plusieurs mots demeurent incertains. La traduction supplée seulement ce qu’exige un français intelligible et place les autres lectures plausibles en notes, sans tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore du bâton et la répétition négative sont conservées; les ellipses sont légèrement explicitées pour rester accessibles, tandis que les incertitudes réelles du texte hébreu sont signalées en notes.
