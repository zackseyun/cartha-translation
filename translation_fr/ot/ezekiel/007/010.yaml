source:
  edition: WLC
  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
translation:
  language: fr
  text: Voici le jour ! Voici, il arrive ! Le désastre[a] s’est mis en marche ; le bâton a bourgeonné, l’arrogance a fleuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le matin s’est levé ». Le terme hébreu est difficile : il peut désigner littéralement le matin ou, au sens figuré, le tournant décisif qui est arrivé.'
    reason: Lecture alternative d’un terme hébreu rare et débattu.
lexical_decisions:
- source_word: הִנֵּה
  choice: voici
  rationale: Cette particule déictique attire vivement l’attention. « Voici » convient au registre prophétique sans être archaïque, et sa répétition conserve l’insistance de l’hébreu.
- source_word: הַיּוֹם
  choice: le jour
  rationale: La formulation concrète de l’hébreu est conservée sans ajouter dans le texte principal une précision interprétative telle que « du jugement ».
- source_word: בָאָה
  choice: il arrive
  rationale: Bien que la forme hébraïque soit un accompli, elle exprime ici la certitude vive d’un événement imminent. Le présent français rend naturellement cette force prophétique.
- source_word: יָצְאָה
  choice: s’est mis en marche
  rationale: Le verbe signifie littéralement « sortir ». Avec « désastre », cette tournure française exprime naturellement qu’il s’est déclenché et avance désormais, tout en gardant la valeur résultative de l’accompli.
- source_word: הַצְּפִרָה
  choice: le désastre
  rationale: Ce terme rare et difficile semble désigner ici le sort funeste qui survient dans un oracle de jugement. « Désastre » communique ce sens contextuel, tandis que l’interprétation littérale possible « matin » est conservée en note.
- source_word: צָץ
  choice: a bourgeonné
  rationale: Le choix maintient l’image végétale et forme un parallélisme net avec « a fleuri ».
- source_word: הַמַּטֶּה
  choice: le bâton
  rationale: « Bâton » conserve l’image concrète d’un instrument qui peut frapper, sans préciser indûment s’il s’agit d’un sceptre royal ou d’une autre sorte de verge.
- source_word: פָּרַח
  choice: a fleuri
  rationale: Cette traduction naturelle préserve la métaphore de la croissance rapide en parallèle avec « a bourgeonné ».
- source_word: הַזָּדוֹן
  choice: l’arrogance
  rationale: Le nom évoque l’orgueil insolent et présomptueux. « Arrogance » en exprime clairement la portée morale en français contemporain.
theological_decisions:
- issue: Interprétation de הַצְּפִרָה dans un oracle de jugement
  choice: « le désastre » dans le texte principal
  alternative: « le matin » ou « le tournant décisif »
  rationale: Le contexte immédiat annonce un jugement imminent, ce qui favorise le sens d’un sort funeste désormais déclenché. Comme le terme hébreu est rare et discuté, la note conserve la lecture concrète « matin » et signale l’incertitude au lieu de la supprimer.
translation_notes:
  register: Français international moderne, clair et digne. Les exclamations et la répétition de « voici » gardent l’urgence de l’oracle ; les images végétales sont maintenues. La tournure « s’est mis en marche » privilégie une expression française naturelle plutôt qu’un calque peu idiomatique de « est sorti ».
