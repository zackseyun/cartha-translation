  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: fr
  text: Je ferai venir les pires des nations[a], et ils prendront possession de leurs maisons[b]. Je mettrai fin à l’orgueil des puissants, et leurs sanctuaires seront profanés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plus méchants des nations ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils hériteront de leurs maisons » ; selon le contexte, le verbe hébreu peut signifier hériter, posséder ou déposséder.
    reason: lexical_alternative
  - marker: c
    text: Ou « leurs lieux saints seront souillés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Je ferai venir
  rationale: Le hiphil de בוא exprime ici l’action de faire venir. Cette formulation française conserve le sujet divin et laisse implicite, comme l’hébreu, la destination ou la cible des envahisseurs.
- source_word: רָעֵי גוֹיִם
  choice: les pires des nations
  rationale: 'רָעֵי, construit pluriel de רע, prend dans ce contexte une valeur superlative : les plus mauvais ou les plus méchants parmi les nations. « Les pires des nations » est naturel et vigoureux en français.'
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: et ils prendront possession de leurs maisons
  rationale: ירשׁ peut signifier hériter, posséder ou déposséder. Dans ce contexte d’invasion, « prendre possession de » rend l’occupation effective sans introduire l’idée d’un héritage légitime.
- source_word: וְהִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: Le hiphil de שׁבת signifie faire cesser. « Mettre fin à » en restitue naturellement la valeur causative.
- source_word: גְּאוֹן עַזִּים
  choice: l’orgueil des puissants
  rationale: גאון peut désigner l’orgueil, l’élévation ou la majesté, tandis que עזים désigne des êtres forts ou puissants. Dans cet oracle de jugement, « orgueil » convient au mouvement d’abaissement, et « puissants » est idiomatique en français.
- source_word: וְנִחֲלוּ
  choice: seront profanés
  rationale: 'Le niphal de חלל a ici un sens passif cultuel : être profané. Le choix s’accorde directement avec les sanctuaires et préserve le thème de la désacralisation.'
- source_word: מְקַדְשֵׁיהֶם
  choice: leurs sanctuaires
  rationale: Le pluriel de מקדש désigne des sanctuaires ou lieux saints. « Sanctuaires » est précis, concis et adapté au contexte cultuel.
theological_decisions:
- issue: Nuance de גְּאוֹן dans un oracle de jugement
  choice: l’orgueil
  alternative: la majesté ou l’élévation
  rationale: Le contexte annonce l’humiliation opérée par Dieu, ce qui favorise la nuance négative « orgueil ». La traduction n’ajoute toutefois aucune identification doctrinale des « puissants ».
- issue: Sens de נִחֲלוּ מְקַדְשֵׁיהֶם
  choice: leurs sanctuaires seront profanés
  alternative: leurs lieux saints seront souillés
  rationale: La forme passive et le complément cultuel favorisent « profanés ». Cette formulation conserve la portée religieuse du jugement sans préciser quels sanctuaires sont visés.
translation_notes:
  register: Français international moderne, digne et direct. Le futur prophétique est conservé. Les termes cultuels « sanctuaires » et « profanés » restent accessibles tout en maintenant la précision du texte. Les appels de notes sont placés immédiatement après les expressions concernées.
