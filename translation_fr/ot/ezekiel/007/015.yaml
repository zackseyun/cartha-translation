base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: fr
  text: L’épée est à l’extérieur, et la peste et la famine sont à l’intérieur. Celui qui est aux champs mourra par l’épée ; celui qui est dans la ville, la famine et la peste le dévoreront.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la famine et la peste le mangeront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Conserve l’image concrète de l’hébreu et son emploi métonymique courant pour la mort violente causée par la guerre.
- source_word: בַּחוּץ / מִבָּיִת
  choice: au-dehors / au-dedans
  rationale: Rend l’opposition spatiale de manière concise et naturelle, sans ajouter « maison », qui n’est pas explicitement exprimé comme lieu déterminé.
- source_word: הַדֶּבֶר
  choice: la peste
  rationale: Terme français courant et précis pour une épidémie meurtrière dans les formules prophétiques de jugement.
- source_word: הָרָעָב
  choice: la famine
  rationale: Désigne ici une pénurie collective mortelle plutôt que la simple sensation de faim.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: celui qui est dans les champs
  rationale: Préserve le singulier distributif tout en rendant שָׂדֶה comme l’espace rural ou découvert opposé à la ville.
- source_word: בַּחֶרֶב יָמוּת
  choice: mourra par l’épée
  rationale: Suit directement l’expression hébraïque sans préciser davantage l’agent.
- source_word: יֹאכֲלֶנּוּ
  choice: le dévoreront
  rationale: Préserve la personnification vigoureuse du verbe אָכַל, littéralement « manger », tout en restant idiomatique en français.
- source_word: רָעָב וָדֶבֶר
  choice: la famine et la peste
  rationale: Respecte l’ordre des mots dans la seconde moitié du verset, différent de celui de la première.
theological_decisions:
- issue: La triade du jugement
  choice: Conserver les images concrètes « épée, peste, famine ».
  alternative: Les généraliser en « guerre, maladie et privations ».
  rationale: La formulation concrète appartient au langage prophétique du jugement et ne doit pas être diluée ni développée par une interprétation ajoutée.
- issue: Le singulier distributif
  choice: Employer « celui qui… le ».
  alternative: Employer le pluriel inclusif « ceux qui… les ».
  rationale: L’hébreu présente deux relatives distributives au singulier et un suffixe masculin singulier ; le français peut les conserver naturellement sans limiter le référent aux seuls hommes.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme champ/ville et la reprise de l’ordre hébreu des fléaux sont conservés. Le point-virgule clarifie les deux propositions distributives ; la note explicite la métaphore hébraïque rendue par « dévoreront ».
