  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre translittération possible : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Le waw consécutif avec היה introduit ici une nouvelle unité prophétique. En français naturel, son effet s’intègre à la formule « la parole… me fut adressée » plutôt que par un calque tel que « et il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans la formule prophétique דְבַר־יְהוָה, « la parole » conserve le lien formel avec les autres récits de révélation et reste transparent en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle translittère le nom divin exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement la préposition אֶל et le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours qui suit. « En ces termes : » remplit cette fonction idiomatiquement en français et évite le participe lourd « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahvé » préserve ici le caractère de nom propre, tandis que la note signale le rendu traditionnel par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La tournure prophétique consacrée « La parole de… me fut adressée » conserve la solennité de la formule hébraïque sans archaïsme excessif.
