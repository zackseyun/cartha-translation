  text: An end has come; the end has come. It has awakened against you; look, it is coming.
translation:
  language: fr
  text: Une fin est venue ; la fin est venue. Elle s’est réveillée contre toi ; la voici qui vient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ / הַקֵּץ
  choice: une fin / la fin
  rationale: Le passage de l’indéfini au défini dans l’hébreu est conservé, malgré la tournure volontairement saisissante en français.
- source_word: הֵקִיץ
  choice: elle s’est réveillée
  rationale: Cette formulation garde l’image forte du verbe hébreu, qui présente la fin comme s’éveillant pour agir.
- source_word: הִנֵּה בָּאָה
  choice: la voici qui vient
  rationale: « La voici » rend naturellement הִנֵּה et l’accord féminin renvoie à « la fin ».
theological_decisions:
- issue: Référent implicite des verbes féminins
  choice: Faire de « la fin » le sujet repris par « elle » et « la voici »
  alternative: Comprendre le dernier verbe comme annonçant plus largement la venue du désastre
  rationale: Le féminin singulier et la répétition de « la fin » soutiennent cette reprise, sans préciser au-delà du texte la nature du jugement annoncé.
translation_notes:
  register: Français moderne, solennel et direct. La répétition inhabituelle est maintenue pour reproduire l’insistance et l’urgence de l’hébreu.
