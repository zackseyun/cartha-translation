id: EZK.7.21
reference: Ezekiel 7:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: fr
  text: Je le livrerai aux mains des étrangers pour qu’ils le pillent, et aux méchants de la terre[a] pour qu’ils en fassent leur butin. Ils le profaneront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot hébreu peut désigner soit la terre, soit un pays, selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « le souilleront » ou « le désacraliseront ». Le verbe évoque la profanation de ce qui est saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: Je le livrerai
  rationale: Dans cette déclaration prophétique, נתן exprime la remise de l’objet au pouvoir d’autrui. « Livrer » rend naturellement cette idée en français, tandis que le pronom « le » conserve la référence contextuelle sans l’expliciter.
- source_word: בְּיַד הַזָּרִים
  choice: aux mains des étrangers
  rationale: L’expression hébraïque désigne le fait de tomber sous le pouvoir de quelqu’un. Le pluriel idiomatique « aux mains de » est naturel en français et conserve l’image de la main.
- source_word: לָבַז
  choice: pour qu’ils le pillent
  rationale: בַּז désigne ce qui est pris de force. La tournure verbale est plus naturelle en français courant que « pour pillage » et exprime clairement le résultat de la remise aux étrangers.
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: et aux méchants de la terre
  rationale: רִשְׁעֵי désigne des personnes méchantes ou coupables. הָאָרֶץ peut signifier « terre » au sens large ou « pays »; le texte principal conserve ici le sens large, et l’autre possibilité est signalée en note.
- source_word: לְשָׁלָל
  choice: pour qu’ils en fassent leur butin
  rationale: שָׁלָל désigne le butin emporté après une attaque. Cette formulation garde la distinction avec בַּז tout en évitant une construction nominale peu naturelle en français.
- source_word: וְחִלְּלוּהָ
  choice: Ils le profaneront
  rationale: Au piel, חלל signifie traiter comme profane ce qui est saint. « Profaner » conserve cette portée sacrée plus précisément que le terme général « souiller ».
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le nom hébreu permet les deux lectures. « La terre » évite de limiter sans certitude le groupe à un territoire précis, tandis qu’une note maintient l’ambiguïté réelle.
- issue: Sens de חלל dans un contexte de sainteté
  choice: profaner
  alternative: souiller ou désacraliser
  rationale: Le verbe évoque le traitement de ce qui est saint comme chose commune. « Profaner » préserve cette portée théologique sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle du verset est conservée, mais les deux expressions de pillage sont formulées de manière idiomatique. Les marqueurs de notes sont placés directement après les mots auxquels ils se rapportent.
