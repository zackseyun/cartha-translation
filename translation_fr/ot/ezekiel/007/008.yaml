  to: À présent[a], dans peu de temps, je déverserai ma fureur sur toi et j’irai jusqu’au bout de ma colère contre toi[b]. Je te jugerai selon ta conduite et je ferai retomber sur toi toutes tes abominations.
  rationale: La révision améliore l’idiomaticité de l’ouverture tout en conservant les deux adverbes temporels, maintient la distinction entre « fureur » et « colère », restitue « abominations » sans explicitation restrictive, et replace la note b sur l’expression hébraïque qu’elle doit éclairer. « Je ferai retomber sur toi » demeure une traduction naturelle de l’idiome de jugement נתן על dans ce contexte.
