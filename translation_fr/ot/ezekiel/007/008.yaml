  text: עַתָּ֣ה מִ/קָּר֗וֹב אֶשְׁפּ֤וֹךְ חֲמָתִ/י֙ עָלַ֔יִ/ךְ וְ/כִלֵּיתִ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: fr
  text: À présent[a], dans peu de temps, je déverserai ma fureur sur toi et j’irai jusqu’au bout de ma colère contre toi[b]. Je te jugerai selon ta conduite et je ferai retomber sur toi toutes tes abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maintenant, sous peu ». L’expression hébraïque souligne l’imminence du jugement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « j’achèverai ma colère contre toi ». L’expression indique que la colère ira jusqu’à son plein accomplissement.
    reason: source_idiom
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: Maintenant, sous peu
  rationale: Les deux expressions temporelles marquent l’imminence. « Maintenant, sous peu » conserve leur juxtaposition et l’urgence de l’annonce sans ajouter l’intensité de « très bientôt ».
- source_word: אֶשְׁפֹּךְ חֲמָתִי עָלַיִךְ
  choice: je déverserai ma fureur sur toi
  rationale: « Déverser » maintient la métaphore de שׁפך. « Fureur » exprime la vive colère indiquée par חֵמָה dans un français actuel et digne.
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: j’irai jusqu’au bout de ma colère contre toi
  rationale: כלה avec אַף décrit une colère menée à son terme. Cette formulation naturelle préserve l’idée d’accomplissement total plutôt que celle d’un simple apaisement.
- source_word: וּשְׁפַטְתִּיךְ
  choice: Je te jugerai
  rationale: Le verbe conserve ici sa portée judiciaire fondamentale; le contexte indique que ce jugement entraîne un châtiment.
- source_word: כִּדְרָכָיִךְ
  choice: selon ta conduite
  rationale: Le pluriel de דֶּרֶךְ désigne ici les manières d’agir. « Conduite » rend clairement ce sens moral en français moderne.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: je ferai retomber sur toi toutes tes pratiques abominables
  rationale: נתן על exprime ici le fait de faire subir à la ville les conséquences de ses actes. « Pratiques abominables » rend le poids moral et religieux de תּוֹעֵבוֹת sans suggérer que des objets seraient matériellement posés sur elle.
theological_decisions:
- issue: Distinction entre חֲמָה et אַף
  choice: « fureur » puis « colère »
  alternative: Employer « colère » pour les deux termes
  rationale: Deux mots français distincts reproduisent le parallélisme lexical hébreu sans leur attribuer une différence doctrinale technique.
- issue: Portée de וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: Les pratiques abominables retombent sur la ville, c’est-à-dire que leur jugement l’atteint
  alternative: « je mettrai sur toi toutes tes abominations », formulation plus littérale
  rationale: La traduction garde la tension entre les actes et leurs conséquences, tout en rendant naturellement l’idiome de jugement en français.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le féminin singulier (« toi », sous-entendu) correspond à l’adresse à la terre ou à la ville dans le contexte. Les termes de colère divine restent distincts, et les métaphores judiciaires sont conservées dans une formulation naturelle.
