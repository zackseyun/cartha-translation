  source_fidelity: 'Le sens général est fidèlement rendu : l’imminence, l’effusion de la fureur, l’achèvement de la colère, le jugement selon la conduite et l’imposition des abominations sont tous conservés. Toutefois, « pratiques abominables » explicite et restreint légèrement תּוֹעֵבוֹת (« abominations »), tandis que « faire retomber » développe l’idée de conséquences. Une formulation plus proche du texte est préférable.'
  naturalness: Le français est moderne, clair et d’un registre prophétique convenable. « Maintenant, sous peu » reproduit la juxtaposition hébraïque, mais « À présent, dans peu de temps » est plus idiomatique sans perdre l’insistance temporelle. « J’irai jusqu’au bout de ma colère » est naturel, mais appelle la note explicative prévue pour l’idiome.
  terminology: La distinction « fureur » / « colère » rend bien les deux termes hébreux parallèles sans leur attribuer une valeur doctrinale technique. « Abominations » maintient la force morale et religieuse de תּוֹעֵבוֹת et évite l’interprétation plus étroite de « pratiques ».
