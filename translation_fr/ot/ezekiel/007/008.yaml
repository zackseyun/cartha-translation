  - severity: low
    issue: « Toutes tes pratiques abominables » est plus interprétatif que « toutes tes abominations ».
    rationale: Le terme hébreu peut désigner les actes abominables dans ce contexte, mais il conserve une portée plus large et plus chargée. « Abominations » préserve le lexique prophétique et l’ambiguïté du texte source.
