source:
  edition: WLC
  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: fr
  text: Le temps est venu ; le jour est arrivé. Que l’acheteur ne se réjouisse pas et que le vendeur ne se lamente pas, car la colère ardente est dirigée contre toute sa multitude[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes ses richesses » : הֲמוֹנָהּ peut désigner sa multitude, mais aussi son abondance ou ses biens.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « toute sa multitude », avec un suffixe féminin qui renvoie probablement à la ville, au pays ou à la communauté personnifiée.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: Le temps est venu
  rationale: Le parfait annonce que le moment décisif est désormais arrivé ; le passé composé convient naturellement en français et conserve la force prophétique.
- source_word: הִגִּיעַ הַיּוֹם
  choice: le jour est arrivé
  rationale: Cette formulation maintient le parallélisme emphatique avec la proposition précédente et le sens d’un jour décisif qui a atteint son terme.
- source_word: הַקּוֹנֶה
  choice: l’acheteur
  rationale: Le participe substantivé désigne de façon générale celui qui achète ; « l’acheteur » est direct et idiomatique.
- source_word: אַל יִשְׂמָח
  choice: Que… ne se réjouisse pas
  rationale: La construction avec אַל exprime une défense ou une injonction négative ; cette tournure française en garde la solennité.
- source_word: הַמּוֹכֵר
  choice: le vendeur
  rationale: Le participe substantivé répond à « l’acheteur » et se rend naturellement par « le vendeur ».
- source_word: אַל יִתְאַבָּל
  choice: ne prenne pas le deuil
  rationale: Le verbe exprime le fait de mener deuil ou de se lamenter. « Prendre le deuil » garde ici le caractère concret et marqué de la réaction à une perte, sans réduire le sens au simple regret commercial.
- source_word: חָרוֹן
  choice: la colère ardente
  rationale: Le nom évoque une colère brûlante. Cette traduction restitue cette intensité mieux que le seul mot « colère », tout en restant naturelle.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: est dirigée contre toute sa population
  rationale: Dans ce contexte de jugement, אֶל marque l’orientation hostile. « Population » rend le collectif הָמוֹן comme l’ensemble des habitants, tandis que « sa » conserve sans l’expliciter le suffixe possessif féminin.
theological_decisions:
- issue: Référent du suffixe féminin dans הֲמוֹנָהּ
  choice: Conserver « sa population » sans identifier explicitement le possesseur.
  alternative: « toute la population du pays/de la ville » ou « toutes ses richesses »
  rationale: Le suffixe hébreu est féminin singulier et peut renvoyer à la ville, au pays ou à la communauté personnifiée. Le texte principal ne tranche donc pas entre ces référents. Une note signale à la fois cette personnification et l’autre valeur lexicale possible de הָמוֹן.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme bref de l’annonce est conservé. « Prendre le deuil » rend l’action de se lamenter avec davantage de précision que « être triste ». Les notes maintiennent l’ambiguïté lexicale de הָמוֹן et celle du référent féminin sans les résoudre dans le texte principal.
