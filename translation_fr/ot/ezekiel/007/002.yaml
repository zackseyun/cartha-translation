  rationale: 'La révision améliore deux choix de style sans introduire d’interprétation nouvelle : « au pays d’Israël » est plus naturel pour l’adresse à la terre d’Israël, et « arrivée aux quatre coins » remplace un calque syntaxique par une expression française idiomatique qui conserve l’idée d’un jugement atteignant l’ensemble du pays. La note demeure ancrée sur l’expression finale et préserve l’alternative « terre ».'
