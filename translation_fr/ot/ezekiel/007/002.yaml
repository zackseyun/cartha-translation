  - severity: low
    issue: « au territoire d’Israël »
    rationale: « Territoire » est possible, mais « pays » est plus usuel et plus fluide pour une adresse prophétique visant la terre d’Israël. La répétition avec la clause finale souligne aussi la cohérence du référent.
