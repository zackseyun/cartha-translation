  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: fr
  text: 'Et toi, fils d’homme, voici ce que dit le Seigneur Yahweh au pays d’Israël : Une fin ! La fin est arrivée aux quatre coins du pays.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les quatre coins de la terre ». L’expression hébraïque peut désigner les extrémités d’un pays ou, dans un sens plus large, toute la terre.
    reason: Alternative lexicale et préservation de l’ambiguïté de הָאָרֶץ.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique d’Ézéchiel, rendue de manière transparente et traditionnelle tout en restant intelligible en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve les deux éléments du titre hébreu et rend explicitement le nom divin יהוה par « Yahweh », sans produire l’expression redondante « le Seigneur, le SEIGNEUR ».
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: au territoire d’Israël
  rationale: אַדְמָה désigne ici le sol ou le territoire d’Israël. « Territoire » évite la répétition immédiate de « pays » dans la dernière proposition et exprime naturellement la cible de l’oracle.
- source_word: קֵץ
  choice: Une fin !
  rationale: Le nom isolé a une force exclamative. L’article indéfini respecte son caractère non déterminé, avant la reprise définie « la fin ».
- source_word: בָּא הַקֵּץ
  choice: La fin est venue
  rationale: Le parfait hébreu présente l’arrivée de la fin comme accomplie ou certaine; le passé composé français en conserve la vigueur prophétique.
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: les quatre coins du pays
  rationale: « Quatre coins » conserve l’image idiomatique de כָּנָף, tandis que « pays » renvoie le plus naturellement, dans le contexte immédiat, à l’ensemble du territoire d’Israël.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / YHWH
  rationale: La translittération « Yahweh » préserve le nom propre dans le titre composé אֲדֹנָי יְהוִה et distingue les deux termes.
- issue: Portée de הָאָרֶץ dans la proposition finale
  choice: le pays
  alternative: la terre
  rationale: L’adresse explicite au territoire d’Israël favorise une portée locale, mais l’autre sens possible de הָאָרֶץ est signalé en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. L’exclamation abrupte et la répétition de « fin » reproduisent la force de l’oracle. Le marqueur [a] est placé après l’expression concernée.
