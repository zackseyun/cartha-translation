  source_fidelity: 'La traduction rend correctement la structure d’annonce imminente et les principaux termes : l’adresse au singulier (« habitant du pays »), l’arrivée du temps et du jour, ainsi que le contraste entre מְהוּמָה (« panique ») et la clameur non festive. Cependant, « fond sur toi » ajoute l’image d’une attaque soudaine et plongeante, absente du verbe hébreu בוא (« venir, arriver »). Il convient de conserver le mouvement d’arrivée sans cette précision supplémentaire.'
