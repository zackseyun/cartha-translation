source:
  edition: WLC
  text: בָּ֧אָה הַ/צְּפִירָ֛ה אֵלֶ֖י/ךָ יוֹשֵׁ֣ב הָ/אָ֑רֶץ בָּ֣א הָ/עֵ֗ת קָר֛וֹב הַ/יּ֥וֹם מְהוּמָ֖ה וְ/לֹא הֵ֥ד הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: fr
  text: 'Le désastre est venu sur toi[a], habitant du pays. Le temps est venu, le jour est proche : c’est la panique[b], et non des cris de joie sur les montagnes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le tournant est venu sur toi » ou « Ton destin est arrivé ». Le terme hébreu est rare et difficile.
    reason: lexical_alternative
  - marker: b
    text: Ou « c’est le tumulte, et non l’écho sur les montagnes ». La fin du verset est difficile ; beaucoup y voient une opposition entre la panique et les cris de joie habituellement entendus sur les montagnes, peut-être au moment des récoltes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: le désastre
  rationale: Ce nom rare et difficile semble désigner ici le tournant fatal ou le sort qui arrive dans un contexte de jugement. « Le désastre » en exprime naturellement la portée sans masquer les autres possibilités, signalées en note.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: habitant du pays
  rationale: Le participe singulier fonctionne naturellement comme une apostrophe. « Pays » convient mieux au destinataire immédiat que le plus général « terre ».
- source_word: הָעֵת
  choice: le temps
  rationale: Rendu direct qui conserve l’annonce temporelle sans ajouter explicitement l’idée d’un temps fixé.
- source_word: קָרוֹב הַיּוֹם
  choice: le jour est proche
  rationale: Formulation française naturelle qui maintient l’accent sur l’imminence.
- source_word: מְהוּמָה
  choice: la panique
  rationale: Dans ce contexte de jugement, le mot évoque le trouble, la confusion et la terreur; « panique » en restitue clairement la force vécue.
- source_word: הֵד
  choice: des cris de joie
  rationale: Le mot et la proposition finale sont difficiles. Ce choix exprime le contraste probable entre la panique du jugement et les clameurs festives habituellement entendues sur les montagnes, tout en conservant « écho » comme possibilité en note.
- source_word: הָרִים
  choice: les montagnes
  rationale: Équivalent français courant du pluriel hébreu, sans réduire arbitrairement le relief à des collines.
