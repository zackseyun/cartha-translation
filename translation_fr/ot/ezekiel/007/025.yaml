id: EZK.7.25
reference: Ezekiel 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְפָ֖דָה בָ֑א וּ/בִקְשׁ֥וּ שָׁל֖וֹם וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
translation:
  language: fr
  text: L’angoisse arrive[a]. Ils chercheront la paix, mais il n’y en aura pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La terreur arrive », « Le malheur arrive » ou « L’horreur arrive ». Le nom hébreu est rare et peut mettre l’accent soit sur l’effroi lui-même, soit sur la situation désastreuse produite par le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  choice: angoisse
  rationale: Ce nom hébreu rare évoque, dans ce contexte de jugement, une détresse extrême. « Angoisse » en exprime naturellement l’aspect vécu sans préciser à tort s’il s’agit surtout de terreur ou de calamité.
- source_word: בָא
  choice: arrive
  rationale: Le qatal peut présenter prophétiquement le jugement comme déjà survenu ou comme imminent et certain. Le présent « arrive » conserve cette force d’actualité en français naturel.
- source_word: וּבִקְשׁוּ
  choice: ils chercheront
  rationale: Dans la séquence prophétique, la forme décrit naturellement la réaction qui suivra l’arrivée du jugement.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est le rendu usuel de שָׁלוֹם et comprend ici la sécurité et le bien-être, non seulement le calme intérieur.
- source_word: וָאָיִן
  choice: mais il n’y en aura pas
  rationale: La proposition nie l’existence future de la paix recherchée. « Mais » rend clairement la valeur adversative de la conjonction.
theological_decisions: []
