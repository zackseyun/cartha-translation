  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: fr
  text: Toutes les mains faibliront, et tous les genoux ruisselleront d’eau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’hébreu présente tous les genoux comme allant ou coulant en eau. Cette expression évoque probablement les genoux qui cèdent sous l’effet de la terreur et peut aussi suggérer une perte de contrôle du corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיָּדַיִם
  choice: toutes les mains
  rationale: Rend littéralement le quantificateur et l’image corporelle hébraïque, qui évoque la perte de force sans la rendre explicite.
- source_word: תִּרְפֶּינָה
  choice: faibliront
  rationale: Le verbe רפה exprime ici le relâchement ou l’affaiblissement; « faibliront » est naturel et concis en français.
- source_word: וְכָל בִּרְכַּיִם
  choice: et tous les genoux
  rationale: Conserve le terme anatomique et le parallélisme du texte hébreu.
- source_word: תֵּלַכְנָה מָּיִם
  choice: ruisselleront d’eau
  rationale: La formulation hébraïque associe littéralement les genoux au mouvement de l’eau. « Ruisselleront d’eau » préserve cette image inhabituelle sans préciser abusivement s’il s’agit d’urine, de transpiration ou d’une autre représentation de la terreur.
