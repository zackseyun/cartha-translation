  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : refus de toute compassion, rétribution selon la conduite, présence des abominations, reconnaissance de Yahweh comme celui qui frappe. Toutefois, « Je ferai retomber sur toi ta conduite » est moins clair en français et ne rend pas explicitement la valeur de כִּדְרָכַיִךְ (« selon tes voies / ta conduite »). La note a qualifie en outre de littérale une formulation qui omet « selon » et met « voies » au pluriel.'
  naturalness: Le registre est moderne et solennel. « Mon regard ne t’épargnera pas » est plus direct et idiomatique que « Mon regard sera sans pitié », tout en conservant l’image hébraïque de l’œil. « Je te traiterai selon ta conduite » exprime naturellement la rétribution visée.
  terminology: « Abominations », « Yahweh » et « celui qui frappe » conviennent au contexte prophétique et au nom divin. Le passage du singulier personnifié (« toi ») au pluriel (« vous saurez ») doit être conservé, car il est présent dans l’hébreu.
  issues:
