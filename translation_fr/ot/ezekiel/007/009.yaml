source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: fr
  text: Mon regard ne t’épargnera pas, et je n’aurai aucune compassion. Je te traiterai selon ta conduite[a], et tes abominations seront au milieu de toi. Alors vous saurez que moi, je suis Yahweh[b], celui qui frappe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Selon tes voies, je mettrai sur toi » (c’est-à-dire : je ferai venir sur toi un jugement correspondant à ta conduite).'
    reason: lexical_alternative
  - marker: b
    text: Yahweh transcrit le nom divin hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Mon regard sera sans pitié
  rationale: L’expression hébraïque associe littéralement « mon œil » au verbe « épargner / avoir pitié ». « Mon regard sera sans pitié » conserve l’image du regard tout en étant idiomatique en français moderne.
- source_word: אֶחְמוֹל
  choice: je n’aurai aucune compassion
  rationale: Le choix distingue ce verbe du premier membre parallèle et en exprime clairement la nuance de compassion, sans atténuer le jugement.
- source_word: כִדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: Je ferai retomber sur toi ta conduite
  rationale: « Conduite » rend דרך au sens moral, tandis que « faire retomber sur toi » garde l’image concrète et la rétribution exprimées par l’hébreu.
- source_word: וְתוֹעֲבוֹתַיִךְ בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: tes abominations seront au milieu de toi
  rationale: « Abominations » conserve la forte portée prophétique et cultuelle du terme; « au milieu de toi » reproduit l’expression spatiale sans préciser abusivement ce que signifie leur présence.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: « Alors » explicite naturellement la conséquence. Le pluriel « vous » est conservé malgré les formes féminines singulières qui précèdent, afin de respecter le changement de nombre du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מַכֶּה
  choice: celui qui frappe
  rationale: Le participe identifie Yahweh comme l’auteur actif du jugement. Cette formulation est actuelle et conserve la force verbale sans archaïsme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre tout en signalant son identité dans une note.
- issue: Portée de la formule finale מַכֶּה
  choice: celui qui frappe
  alternative: qui suis en train de frapper
  rationale: Le participe peut caractériser l’auteur du jugement sans qu’il soit nécessaire d’imposer une valeur progressive. « Celui qui frappe » maintient la tension entre identité et action.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le passage du singulier féminin (« toi », visant la collectivité personnifiée) au pluriel « vous saurez » est maintenu comme dans l’hébreu. Le parallélisme entre absence de pitié et absence de compassion est préservé avec une variation lexicale naturelle.
