    rationale: La préposition כְ signifie « selon / conformément à ». « Je ferai retomber sur toi ta conduite » peut se comprendre, mais est moins naturel et ne marque pas clairement la mesure rétributive. La note dite littérale omet également cet élément et ne reproduit pas le pluriel « tes voies ».
