  to: Mon regard ne t’épargnera pas, et je n’aurai aucune compassion. Je te traiterai selon ta conduite[a], et tes abominations seront au milieu de toi. Alors vous saurez que moi, je suis Yahweh[b], celui qui frappe.
  rationale: La révision conserve le parallélisme des deux verbes hébreux de refus de compassion, rend explicitement la relation « selon ta conduite » et corrige la note pour qu’elle signale la formulation hébraïque sans la présenter de façon inexacte. Elle ne précise pas la nature des abominations ni n’ajoute d’interprétation doctrinale.
