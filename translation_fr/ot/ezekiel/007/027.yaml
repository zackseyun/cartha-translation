source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: fr
  text: Le roi prendra le deuil, le prince se revêtira de désolation[a], et les mains du peuple du pays trembleront[b]. Je les traiterai selon leur conduite et je les jugerai selon leurs propres jugements[c]. Alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se revêtira d’épouvante ». Le mot hébreu peut désigner la désolation, la stupeur ou l’horreur causée par la ruine.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « peuple du pays » désigne ici la population. L’hébreu peut aussi se rendre : « les mains des gens du pays seront paralysées par la peur ».'
    reason: idiom_and_lexical_alternative
  - marker: c
    text: 'Ou : « je les jugerai selon leurs jugements ». Il peut s’agir des normes ou des pratiques judiciaires qu’ils ont eux-mêmes appliquées.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: Le roi prendra le deuil
  rationale: Le verbe exprime le fait de mener deuil ou de se lamenter. « Prendre le deuil » est naturel en français et conserve la solennité du contexte.
- source_word: וְנָשִׂיא
  choice: le prince
  rationale: נָשִׂיא désigne ici un dirigeant de haut rang. « Prince » préserve la distinction avec « le roi » sans réduire le terme à un générique.
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: se revêtira de désolation
  rationale: La formulation conserve la métaphore vestimentaire de l’hébreu. שְׁמָמָה peut évoquer la désolation, l’épouvante ou un état de ruine qui frappe de stupeur.
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: les mains du peuple du pays trembleront
  rationale: La traduction maintient l’image concrète des mains frappées de peur. « Peuple du pays » reproduit l’expression hébraïque, qui peut désigner l’ensemble de la population.
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: Je les traiterai selon leur conduite
  rationale: דֶּרֶךְ signifie littéralement « chemin », mais désigne ici la manière de vivre ou d’agir. « Conduite » transmet clairement ce sens moral sans perdre la réciprocité du jugement.
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: je les jugerai selon leurs propres jugements
  rationale: La répétition de la racine משפט est conservée par « jugements / juger ». « Propres » explicite la valeur du suffixe possessif et la possible idée qu’ils seront mesurés d’après leurs pratiques judiciaires.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Alors ils sauront que je suis Yahweh
  rationale: « Alors » exprime naturellement la conséquence dans ce contexte. Le nom divin est translittéré « Yahweh » conformément à la politique du projet.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre et suit la politique terminologique du projet.
- issue: Portée de la formule de reconnaissance וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Alors ils sauront que je suis Yahweh
  alternative: Et ils sauront que je suis Yahweh
  rationale: Dans ce contexte, la connaissance de Yahweh apparaît comme le résultat du jugement annoncé. « Alors » rend cette relation sans imposer une interprétation doctrinale supplémentaire.
- issue: Sens de בְמִשְׁפְּטֵיהֶם
  choice: selon leurs propres jugements
  alternative: selon leurs règles de justice ; par leurs jugements
  rationale: L’hébreu permet d’entendre soit les décisions judiciaires des destinataires, soit les normes qu’ils ont eux-mêmes appliquées. La traduction garde le terme « jugements » et signale cette ambiguïté en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les images fortes de l’hébreu — se revêtir de désolation et les mains qui tremblent — sont conservées, tandis que « conduite » rend clairement le sens figuré de « chemin ». Les notes préservent les principales ambiguïtés lexicales et judiciaires.
