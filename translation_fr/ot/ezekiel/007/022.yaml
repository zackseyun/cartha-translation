base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: fr
  text: Je détournerai mon visage loin d’eux, et ils profaneront mon lieu précieux[a] ; des hommes violents[b] y entreront et le profaneront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon trésor », « mon lieu secret » ou « ce que j’ai de précieux ». L’hébreu désigne probablement quelque chose de précieux et de protégé, sans doute en rapport avec le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « des hommes sans scrupules », « des hommes brutaux » ou « des pillards ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: Je détournerai
  rationale: Le hiphil de סבב, dans cette suite prophétique de jugements, a ici une valeur future. « Détourner » exprime naturellement le mouvement d’éloignement indiqué par מֵהֶם.
- source_word: פָנַי מֵהֶם
  choice: d’eux mon visage
  rationale: 'L’image hébraïque du visage est conservée : elle évoque le retrait de la faveur et de l’attention divines tout en restant compréhensible en français.'
- source_word: וְחִלְּלוּ
  choice: ils profaneront
  rationale: Au piel, חלל désigne ici l’atteinte portée à ce qui est saint. « Profaner » maintient explicitement le contraste avec la sainteté.
- source_word: צְפוּנִי
  choice: mon lieu précieux
  rationale: Le terme peut désigner ce qui est caché, mis en réserve ou précieux. Le contexte et les suffixes féminins qui suivent favorisent un lieu protégé lié au sanctuaire, sans permettre de l’identifier plus précisément.
- source_word: וּבָאוּ בָהּ
  choice: y entreront
  rationale: Cette formulation française rend idiomatiquement l’entrée dans le lieu évoqué, tout en évitant une répétition lourde.
- source_word: פָּרִיצִים
  choice: des hommes violents
  rationale: Le mot désigne des individus violents, brutaux ou sans scrupules. Cette traduction ne réduit pas leur action au seul pillage.
- source_word: וְחִלְּלוּהָ
  choice: et le profaneront
  rationale: La répétition de חלל est conservée afin de maintenir l’insistance du texte sur la profanation.
theological_decisions:
- issue: Référent de צְפוּנִי et des suffixes féminins dans בָהּ et חִלְּלוּהָ
  choice: Un lieu précieux et protégé appartenant à Dieu, probablement associé au sanctuaire
  alternative: « mon trésor », « mon lieu secret » ou « ce que j’ai de précieux », éventuellement les trésors ou l’enceinte sacrée du temple
  rationale: L’hébreu est concis et ambigu. L’entrée d’hommes violents et la double mention de la profanation orientent vers un lieu saint, mais le texte ne précise pas s’il s’agit du sanctuaire lui-même, de sa partie la plus secrète ou d’un bien précieux qui s’y trouve. La traduction reste donc générale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « profaneront » reproduit l’insistance de l’hébreu. Les marqueurs de notes sont placés directement après les expressions auxquelles ils se rapportent.
