source:
  edition: WLC
  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: fr
  text: Ils jetteront leur argent dans les rues, et leur or deviendra une chose impure[a]. Leur argent et leur or ne pourront pas les délivrer au jour de la fureur de Yahweh, ni rassasier leur appétit ni remplir leur ventre, car il a été la pierre d’achoppement de leur faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « leur or sera pour l’impureté ». Le terme hébreu peut évoquer l’impureté menstruelle et, par extension, quelque chose de rituellement impur et repoussant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car il était la pierre d’achoppement de leur faute ». Le pronom peut renvoyer plus précisément à l’or, mais le contexte vise leur richesse, l’argent comme l’or.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: כַּסְפָּם
  choice: leur argent
  rationale: כֶּסֶף désigne l’argent, à la fois métal précieux et richesse monétaire. En français courant, « argent » conserve naturellement ces deux valeurs et reste parallèle à « or ».
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: ils jetteront … dans les rues
  rationale: חוּצוֹת désigne les rues ou espaces ouverts de la ville, et le hiphil de שלך exprime l’action énergique de jeter ou rejeter.
- source_word: לְנִדָּה יִהְיֶה
  choice: deviendra une chose impure
  rationale: נִדָּה peut désigner l’impureté, notamment menstruelle, et évoque ici métaphoriquement une chose repoussante et rituellement impure. La note conserve la nuance plus précise.
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: ne pourront pas les délivrer
  rationale: Le verbe au singulier avec le sujet composé peut être compris collectivement; le français exige ici le pluriel. « Délivrer » convient au contexte du jugement sans réduire le sens à une notion doctrinale particulière du salut.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: au jour de la fureur de Yahweh
  rationale: עֶבְרָה exprime une colère intense, rendue ici par « fureur ». Le nom divin est translittéré « Yahweh ».
- source_word: נַפְשָׁם לֹא יְשַׂבֵּעוּ
  choice: ils ne pourront … rassasier leur appétit
  rationale: Dans le parallélisme avec le ventre rempli, נֶפֶשׁ désigne l’appétit ou le désir vital plutôt qu’une âme immatérielle. L’ajout modal « pourront » rend naturellement la portée de l’incapacité énoncée dans le contexte.
- source_word: וּמֵעֵיהֶם לֹא יְמַלֵּאוּ
  choice: ni remplir leur ventre
  rationale: מֵעֶה désigne les entrailles ou le ventre; dans ce contexte alimentaire, « ventre » est concret, naturel et digne.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: une pierre d’achoppement qui les a fait tomber dans la faute
  rationale: מִכְשׁוֹל est ce qui fait trébucher, tandis que עָוֹן peut désigner la faute ou ses conséquences. Cette formulation explicite l’image tout en conservant son lien avec leur faute.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Degré de précision de נִדָּה
  choice: une chose impure
  alternative: une souillure menstruelle
  rationale: Le sens métaphorique général d’impureté convient au corps du texte, tandis que la note signale l’association possible avec l’impureté menstruelle sans imposer cette précision.
- issue: Sens contextuel de נַפְשָׁם
  choice: leur appétit
  alternative: leur âme
  rationale: Le parallélisme avec le remplissage du ventre oriente vers la faim ou l’appétit, non vers une affirmation sur la constitution de la personne.
- issue: Référent implicite de « il » dans הָיָה
  choice: leur richesse
  alternative: leur or
  rationale: Le dernier verbe est au masculin singulier, ce qui permet un rattachement grammatical à l’or, mais l’ensemble du verset vise l’argent et l’or. « Leur richesse » rend ce référent collectif sans limiter la conclusion au seul or.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le rythme prophétique et les parallélismes du texte hébreu, tout en explicitant avec prudence le référent final ambigu.
