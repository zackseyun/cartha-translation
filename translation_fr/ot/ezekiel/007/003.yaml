base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: fr
  text: Maintenant, la fin est sur toi. J’enverrai ma colère contre toi, je te jugerai selon ta conduite et je mettrai sur toi toutes tes abominations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je mettrai sur toi toutes tes abominations ». Cette expression peut désigner le fait de faire subir à quelqu’un les conséquences de ses actes abominables.'
    reason: Précise l’expression idiomatique hébraïque tout en préservant dans le texte principal la référence aux « abominations » elles-mêmes.
lexical_decisions:
- source_word: עַתָּה הַקֵּץ עָלַיִךְ
  choice: Maintenant, la fin s’abat sur toi
  rationale: La proposition hébraïque, sans verbe exprimé, annonce avec brusquerie l’imminence de la fin. « S’abat sur toi » rend naturellement en français l’image menaçante portée par עַל, sans donner à « la fin » un sens eschatologique technique.
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: Je déverserai ma colère contre toi
  rationale: אַף désigne ici la colère, et non littéralement le nez. Le verbe français « déverser » exprime idiomatiquement la colère envoyée dans une direction hostile, tandis que « contre toi » conserve cette orientation.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: je te jugerai d’après ta conduite
  rationale: Le verbe שׁפט garde son sens judiciaire direct. Dans ce contexte moral, les « voies » désignent la manière de vivre; « conduite » est plus naturel en français moderne tout en conservant le rapport entre jugement et actes.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: je ferai retomber sur toi toutes tes abominations
  rationale: נתן avec עַל signifie littéralement mettre ou placer sur quelqu’un. « Faire retomber sur toi » rend en français l’idée de faire porter à la destinataire les conséquences de ses actes, tout en maintenant « abominations », terme fort du vocabulaire prophétique, souvent associé à l’idolâtrie.
theological_decisions:
- issue: Nature de « la fin »
  choice: Une annonce prophétique directe de la fin qui s’abat sur la destinataire
  alternative: Comprendre « la fin » comme la fin cosmique et eschatologique au sens technique
  rationale: Le contexte immédiat annonce le jugement imminent du pays et de Jérusalem. La traduction conserve la gravité et l’indétermination de l’expression sans lui imposer une catégorie doctrinale ultérieure.
- issue: Rapport entre les abominations et leur châtiment
  choice: Rendre l’expression par « faire retomber sur toi toutes tes abominations »
  alternative: Traduire strictement « mettre sur toi toutes tes abominations » ou expliciter « les conséquences de toutes tes abominations »
  rationale: L’hébreu nomme les abominations elles-mêmes tout en suggérant que leurs conséquences atteindront leur auteure. Le texte principal garde cette tension, et la note signale l’expression littérale sans remplacer le péché par son seul châtiment.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement correspond à l’adresse prophétique au féminin singulier, visant ici le pays ou Jérusalem. La formulation évite aussi bien l’archaïsme de « selon tes voies » que l’affaiblissement des termes judiciaires et prophétiques.
