  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: fr
  text: Ils ont fait de la beauté de sa parure un sujet d’orgueil et, avec elle[a], ils ont fabriqué les images de leurs abominations, leurs objets répugnants. C’est pourquoi j’en ai fait pour eux une chose impure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en elle ». La préposition hébraïque peut indiquer le lieu où les images ont été fabriquées ou le moyen, voire la matière, employé pour les fabriquer.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne ce qui est impur, notamment sur le plan rituel; elle peut aussi signifier « une chose à rejeter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: la beauté de sa parure
  rationale: צְבִי exprime ici la beauté ou la splendeur, et עֲדִי une parure précieuse. La formulation conserve le singulier et le référent pronominal sans préciser indûment s’il s’agit de bijoux, de richesses ou de l’ornement du sanctuaire.
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: ils ont fait de… un motif d’orgueil
  rationale: גָּאוֹן peut désigner la majesté ou l’orgueil. Dans ce contexte d’accusation, « orgueil » convient, tandis que « un motif d’orgueil » rend naturellement en français la valeur résultative de שׂים avec ל.
- source_word: וְצַלְמֵי תוֹעֲבֹתָם
  choice: les images de leurs abominations
  rationale: La construction nominale hébraïque est conservée afin de ne pas réduire explicitement les « abominations » aux seules idoles, même si le contexte est idolâtre.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets répugnants
  rationale: שִׁקּוּץ désigne une chose détestable, fréquemment une idole. « Objets répugnants » maintient la distinction avec תּוֹעֵבָה et laisse perceptible leur caractère concret.
- source_word: עָשׂוּ בוֹ
  choice: avec elle, ils ont fabriqué
  rationale: La préposition ב peut exprimer le lieu ou le moyen/la matière. « Avec elle » donne ici le sens probable d’une parure précieuse utilisée pour fabriquer des images; l’autre possibilité est signalée en note.
- source_word: נְתַתִּיו לָהֶם לְנִדָּה
  choice: j’en ai fait pour eux une chose impure
  rationale: Dans cette construction, נָתַן a le sens de rendre ou faire devenir. נִדָּה évoque l’impureté rituelle et, par extension, une chose repoussante ou rejetée; « chose impure » en conserve la portée cultuelle et morale.
theological_decisions:
- issue: Nature de l’impureté exprimée par לְנִדָּה
  choice: une chose impure
  alternative: une chose à rejeter
  rationale: La traduction retenue préserve la dimension rituelle et morale de נִדָּה dans un contexte d’idolâtrie, sans expliciter excessivement son arrière-plan corporel.
- issue: Référent et emploi de la parure
  choice: la parure sert probablement de matière ou de moyen pour fabriquer les images
  alternative: les images sont fabriquées dans la parure ou dans le lieu paré
  rationale: La préposition ב autorise les deux analyses. Le texte principal adopte la lecture instrumentale, naturelle dans le contexte, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Parure », « motif d’orgueil » et « chose impure » gardent la densité poétique et cultuelle du texte. Le pronom féminin renvoie clairement à « parure »; la lecture instrumentale de ב est adoptée dans le texte, avec conservation de l’alternative dans l’appareil de décision.
