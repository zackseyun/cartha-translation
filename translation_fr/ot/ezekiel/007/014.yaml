source:
  edition: WLC
  text: תָּקְע֤וּ בַ/תָּק֨וֹעַ֙ וְ/הָכִ֣ין הַ/כֹּ֔ל וְ/אֵ֥ין הֹלֵ֖ךְ לַ/מִּלְחָמָ֑ה כִּ֥י חֲרוֹנִ֖/י אֶל כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: fr
  text: Ils ont sonné de la trompette[a] et tout préparé, mais personne ne va au combat, car ma colère ardente est dirigée contre toute sa multitude[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cor » ou « de la corne de bélier ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toute son abondance » ou « toutes ses richesses », si הֲמוֹנָהּ désigne les biens plutôt que la population.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  choice: Sonnez de la trompette
  rationale: Le verbe תָּקְעוּ est une forme impérative plurielle et, avec le nom de l’instrument, signifie « sonner » ou « souffler ». « Sonnez de la trompette » convient naturellement à un signal de mobilisation militaire.
- source_word: וְהָכִין הַכֹּל
  choice: et préparez tout
  rationale: Le hifil de כון exprime ici la préparation ou la mise en état de tout ce qui est nécessaire. La coordination avec l’impératif précédent est rendue par un second impératif en français.
- source_word: וְאֵין הֹלֵךְ
  choice: Mais personne ne va
  rationale: La construction existentielle אֵין suivie du participe indique l’absence de quiconque se mette en route. « Mais » fait ressortir le contraste entre les préparatifs et l’inaction.
- source_word: לַמִּלְחָמָה
  choice: au combat
  rationale: מִלְחָמָה peut désigner la guerre ou un combat. Dans ce contexte de mobilisation immédiate, « au combat » est le choix le plus naturel.
- source_word: חֲרוֹנִי
  choice: ma colère ardente
  rationale: חָרוֹן désigne une colère brûlante ou intense. « Colère ardente » conserve cette image avec une expression française claire et digne.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: est dirigée contre toute sa multitude
  rationale: Avec la colère pour sujet logique, אֶל prend ici le sens contextuel de « contre ». הָמוֹן désigne le plus probablement la masse de la population, tout en pouvant aussi évoquer l’abondance ou les richesses. Le suffixe féminin est conservé sans expliciter son antécédent.
theological_decisions:
- issue: Antécédent du suffixe féminin dans הֲמוֹנָהּ
  choice: sa multitude
  alternative: la multitude de la ville ou du pays
  rationale: Le suffixe féminin singulier est explicite, mais son antécédent immédiat ne l’est pas assez pour introduire « Jérusalem », « la ville » ou « le pays » dans le texte principal. Le possessif « sa » préserve cette indétermination.
- issue: Sens de הֲמוֹנָהּ
  choice: sa multitude
  alternative: son abondance ou toutes ses richesses
  rationale: Le contexte de mobilisation et de jugement favorise le sens collectif de population nombreuse, mais le sens matériel d’abondance ou de richesse demeure lexicalement possible et est signalé en note.
translation_notes:
  register: Français international moderne, clair et solennel. Les impératifs rendent la forme et l’élan du texte hébreu; l’exclamation marque l’appel pressant à la mobilisation, tandis que « Mais » souligne l’échec paradoxal de celle-ci.
