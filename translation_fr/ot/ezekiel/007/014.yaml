review_pass:
  verdict: revise
  source_fidelity: La forme תָּקְעוּ est un parfait pluriel (« ils ont sonné / soufflé »), non un impératif. De même, וְהָכִין הַכֹּל décrit la préparation accomplie. Le projet transforme donc à tort la première proposition en appel direct. La révision rétablit le constat narratif, conserve « au combat », le possessif ambigu « sa », et le sens de jugement de אֶל avec « contre ».
  naturalness: « Ils ont sonné de la trompette et tout préparé » est idiomatique en français moderne et rend naturellement la succession des actions achevées. « Toute sa multitude » reste un peu soutenu, mais convient au registre prophétique et préserve sans interprétation le terme collectif ambigu.
  terminology: « Trompette » est approprié pour בַּתָּקוֹעַ, avec les alternatives en note. « Ma colère ardente » rend de manière recevable l'intensité de חֲרוֹנִי sans imposer une lecture doctrinale. « Multitude » maintient l'ambiguïté de הֲמוֹנָהּ entre masse humaine et abondance matérielle, explicitée en note.
  issues:
  - severity: high
    issue: Les deux premiers verbes sont rendus comme des impératifs (« Sonnez… préparez »).
    rationale: Le texte massorétique porte תָּקְעוּ, parfait 3e personne pluriel, et présente les préparatifs comme accomplis; il ne donne pas ici un ordre direct. Cette modification affecte la voix et le sens du verset.
  - severity: low
    issue: Le point d’exclamation dépend de la lecture impérative.
    rationale: Une fois la proposition rendue au parfait narratif, cette ponctuation exhortative n’est plus justifiée.
  revised_text: Ils ont sonné de la trompette[a] et tout préparé, mais personne ne va au combat, car ma colère ardente est dirigée contre toute sa multitude[b].
