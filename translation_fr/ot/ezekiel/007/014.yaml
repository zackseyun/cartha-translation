revisions:
- from: Sonnez de la trompette[a] et préparez tout ! Mais personne ne va au combat, car ma colère ardente est dirigée contre toute sa multitude[b].
  to: Ils ont sonné de la trompette[a] et tout préparé, mais personne ne va au combat, car ma colère ardente est dirigée contre toute sa multitude[b].
  rationale: La révision nécessaire consiste à remplacer les impératifs français par des parfaits correspondant aux formes verbales hébraïques. Elle conserve les ancres de note sur les mots auxquels les alternatives se rapportent, ainsi que l’ambiguïté du suffixe féminin et du nom הֲמוֹנָהּ.
