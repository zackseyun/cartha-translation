source:
  edition: WLC
  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: fr
  text: Désastre sur désastre surviendra, et rumeur après rumeur se produira[a]. Ils chercheront une vision auprès d’un prophète, mais l’enseignement disparaîtra chez le prêtre[b], et le conseil chez les anciens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nouvelle après nouvelle ». Le terme hébreu peut désigner une rumeur, une nouvelle ou une information rapportée; ici, il évoque probablement la succession de nouvelles alarmantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « la loi disparaîtra chez le prêtre ». Le mot hébreu torah peut signifier « enseignement », « instruction » ou « loi »; dans ce contexte, il désigne probablement l’enseignement donné par les prêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה
  choice: désastre
  rationale: Le nom désigne ici une calamité destructrice dans un contexte de jugement. « Désastre » est actuel, clair et suffisamment grave; sa répétition conserve l’effet d’accumulation de l’hébreu.
- source_word: עַל
  choice: sur
  rationale: Dans הֹוָה עַל הֹוָה, « sur » reproduit l’image de catastrophes qui s’accumulent les unes sur les autres.
- source_word: תָּבוֹא
  choice: surviendra
  rationale: Le verbe בוא signifie littéralement « venir ». Avec « désastre » comme sujet, « surviendra » est naturel en français tout en gardant l’idée d’irruption.
- source_word: שְׁמֻעָה / שְׁמוּעָה
  choice: rumeur
  rationale: Le terme peut désigner une nouvelle, un bruit ou une rumeur. Dans ce contexte de panique et d’effondrement, « rumeur » rend bien la circulation répétée d’informations alarmantes, sans exclure le sens de « nouvelle » signalé en note.
- source_word: אֶל
  choice: après
  rationale: Littéralement « vers/à », la préposition exprime ici l’enchaînement. « Rumeur après rumeur » est idiomatique en français et conserve le parallélisme cumulatif.
- source_word: תִּהְיֶה
  choice: se répandra
  rationale: היה signifie fondamentalement « être, se produire ». Avec « rumeur », « se répandra » exprime naturellement l’apparition et la circulation de nouvelles successives dans ce contexte.
- source_word: וּבִקְשׁוּ
  choice: ils chercheront
  rationale: בקשׁ exprime une recherche active. La formulation directe préserve la tentative d’obtenir une orientation divine.
- source_word: חָזוֹן
  choice: une vision
  rationale: Dans la littérature prophétique, חָזוֹן désigne une vision révélatrice. « Une vision » est le correspondant français direct et usuel.
- source_word: מִנָּבִיא
  choice: auprès d’un prophète
  rationale: L’absence d’article favorise un sens indéfini. « Auprès de » exprime naturellement en français la recherche d’une révélation obtenue par l’intermédiaire d’un prophète.
- source_word: תּוֹרָה
  choice: enseignement
  rationale: Dans la triade prophète-prêtre-anciens, תּוֹרָה renvoie vraisemblablement à l’enseignement sacerdotal. « Enseignement » garde ce sens large sans réduire le terme à une loi codifiée.
- source_word: תֹּאבַד
  choice: fera défaut
  rationale: אבד indique la disparition ou la perte. L’expression « faire défaut à » rend naturellement en français la disparition de l’enseignement normalement fourni par le prêtre et permet l’ellipse parallèle avec les anciens.
- source_word: מִכֹּהֵן
  choice: au prêtre
  rationale: Le singulier a ici une valeur représentative de la fonction sacerdotale. « Au prêtre » s’accorde avec l’expression française « faire défaut à » et préserve cette portée institutionnelle.
- source_word: עֵצָה מִזְּקֵנִים
  choice: le conseil aux anciens
  rationale: La proposition reprend par ellipse « fera défaut ». Elle préserve la troisième composante de l’effondrement des sources reconnues de direction.
theological_decisions:
- issue: Sens de תּוֹרָה dans un contexte sacerdotal
  choice: enseignement
  alternative: loi
  rationale: 'Le verset décrit la défaillance des sources reconnues de direction : vision prophétique, enseignement sacerdotal et conseil des anciens. « Enseignement » rend la fonction du prêtre sans limiter indûment תּוֹרָה à un corpus légal abstrait.'
- issue: Portée institutionnelle ou individuelle des titres de responsables
  choice: auprès d’un prophète… au prêtre… aux anciens
  alternative: auprès du prophète… auprès d’un prêtre… auprès des anciens
  rationale: Le prophète et le prêtre sont au singulier en hébreu, tandis que les anciens sont au pluriel. L’article indéfini pour le prophète respecte l’absence d’article; « le prêtre » a une valeur générique et institutionnelle en français.
- issue: Valeur de la conjonction avant la perte de l’enseignement
  choice: mais
  alternative: et
  rationale: L’hébreu emploie une conjonction ordinaire pouvant prendre une nuance contrastive selon le contexte. « Mais » explicite sobrement le contraste entre la recherche d’une vision et l’absence simultanée des sources habituelles de direction, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « désastre sur désastre » et le parallélisme « rumeur après rumeur » conservent l’intensification poétique. L’ellipse finale (« et le conseil aux anciens ») maintient la concision de l’hébreu tout en restant naturelle.
