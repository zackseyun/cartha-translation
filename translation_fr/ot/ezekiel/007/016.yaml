source:
  edition: WLC
  text: וּ/פָֽלְטוּ֙ פְּלִ֣יטֵי/הֶ֔ם וְ/הָי֣וּ אֶל הֶ/הָרִ֗ים כְּ/יוֹנֵ֧י הַ/גֵּאָי֛וֹת כֻּלָּ֖/ם הֹמ֑וֹת אִ֖ישׁ בַּ/עֲוֺנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: fr
  text: Leurs rescapés s’échapperont et seront sur les montagnes, pareils aux colombes des vallées[a]. Tous gémiront[b], chacun dans son iniquité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ravins ». Le terme hébreu peut désigner des vallées, des gorges ou des ravins.
    reason: lexical_alternative
  - marker: b
    text: Ou « murmureront » ou « roucouleront ». Le verbe hébreu évoque un son sourd et continu qui, dans ce contexte, exprime la douleur.
    reason: lexical_alternative
  - marker: c
    text: Ou « chacun à cause de sa faute », « de sa culpabilité » ou « de son châtiment ». Le mot hébreu peut désigner l’iniquité, la culpabilité ou la conséquence de la faute.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: s’échapperont
  rationale: Le verbe פלט exprime le fait d’échapper à un danger. Le futur convient au contexte prophétique sans préciser indûment la manière de la fuite.
- source_word: פְּלִיטֵיהֶם
  choice: leurs rescapés
  rationale: Le nom désigne ceux qui ont échappé au désastre. « Rescapés » est naturel en français et met l’accent sur leur survie.
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: seront sur les montagnes
  rationale: La construction indique ici la localisation des rescapés après leur fuite. Cette formulation évite d’ajouter un verbe de mouvement absent de l’hébreu.
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: pareils aux colombes des vallées
  rationale: L’image associe les rescapés aux colombes des vallées ou des ravins, probablement à la fois par leur refuge vulnérable et par leur plainte. « Vallées » demeure accessible, tandis que l’autre nuance est signalée en note.
- source_word: כֻּלָּם הֹמוֹת
  choice: Tous gémiront
  rationale: Le verbe המה évoque un son sourd et continu, qui peut être un murmure, un roucoulement ou un gémissement. Dans ce contexte de jugement, « gémiront » exprime naturellement la douleur tout en maintenant le lien avec le cri des colombes.
- source_word: אִישׁ
  choice: chacun
  rationale: 'Le terme est employé distributivement : chaque personne parmi les rescapés est concernée.'
- source_word: בַּעֲוֺנוֹ
  choice: dans son iniquité
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences pénales de la faute. La tournure formellement proche de l’hébreu conserve cette amplitude au lieu de choisir un seul rapport causal.
theological_decisions:
- issue: Nuance de עָוֹן dans un contexte de jugement
  choice: « dans son iniquité », en laissant ouvertes les notions de faute, de culpabilité et de conséquence
  alternative: « à cause de sa faute », « à cause de sa culpabilité » ou « à cause de son châtiment »
  rationale: Le mot hébreu peut renvoyer aussi bien au péché qu’à la culpabilité ou à sa conséquence pénale. Le texte principal préserve cette tension, et la note rend explicites les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. « Rescapés » et « gémiront » assurent une lecture naturelle; « iniquité », plus soutenu, est conservé afin de ne pas réduire l’ambiguïté morale et pénale du terme hébreu.
