  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: fr
  text: Car celui qui vend ne retournera pas à ce qu’il a vendu[a], même s’ils sont encore en vie[b]. En effet, la vision qui concerne toute sa multitude[c] ne reviendra pas en arrière[d], et personne n’affermira sa vie dans sa faute[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la vente », c’est-à-dire au bien ou à la propriété qui a été vendu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur vie étant encore parmi les vivants ». L’expression condensée indique que, même si les personnes concernées restent en vie, le vendeur ne récupérera pas ce qu’il a vendu.'
    reason: lexical_alternative
  - marker: c
    text: Ou « dirigée contre toute sa multitude ». La préposition peut présenter l’ensemble de la population comme la cible du jugement annoncé.
    reason: alternative_reading
  - marker: d
    text: Ou « ne sera pas révoquée ». Autrement dit, le jugement annoncé ne sera pas annulé.
    reason: alternative_reading
  - marker: e
    text: 'La syntaxe hébraïque de cette dernière proposition est difficile. Elle signifie probablement que personne ne pourra préserver sa vie au moyen de sa faute. On pourrait aussi comprendre : « personne n’affermira sa vie dans sa faute ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: celui qui vend
  rationale: Le participe actif substantivé désigne concrètement le vendeur; cette formulation est naturelle en français et conserve l’action verbale.
- source_word: אֶל הַמִּמְכָּר
  choice: à ce qu’il a vendu
  rationale: Le nom peut désigner la vente ou le bien vendu. La formulation garde cette relative indétermination sans préciser qu’il s’agit nécessairement d’un terrain.
- source_word: לֹא יָשׁוּב
  choice: ne retournera pas / ne reviendra pas en arrière
  rationale: Les deux occurrences de שׁוב sont rendues par des expressions apparentées afin de préserver la répétition, tout en restant idiomatiques avec leurs sujets respectifs.
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: même s’ils sont encore en vie
  rationale: Cette expression hébraïque très condensée signifie que le retour n’aura pas lieu même si les personnes concernées vivent encore.
- source_word: חָזוֹן
  choice: la vision
  rationale: Terme courant pour une révélation prophétique, conservant ici le registre du texte source.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: qui concerne toute sa multitude
  rationale: אֶל peut marquer ici l’orientation ou l’objet de la vision. « Concerne » évite d’imposer dans le texte principal la nuance possible « contre ».
- source_word: בַּעֲוֺנוֹ
  choice: par sa faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. La préposition ב peut exprimer ici le moyen; « par sa faute » fait ressortir l’idée qu’elle ne permettra pas de préserver la vie, sans masquer la difficulté du passage.
- source_word: חַיָּתוֹ לֹא יִתְחַזָּקוּ
  choice: personne n’affermira sa vie
  rationale: « Affermir » conserve l’image de force portée par le hitpael de חזק. Le singulier distributif français après « personne » rend le sens probable malgré le verbe pluriel de l’hébreu.
theological_decisions:
- issue: Sens de la dernière proposition sur la faute et la vie
  choice: Personne ne réussira à affermir ou à préserver sa vie au moyen de sa faute.
  alternative: 'Personne, vivant dans sa faute, ne s’affermira; ou: ils n’affermiront pas leur vie dans leur faute.'
  rationale: La syntaxe hébraïque est difficile, notamment à cause du passage du singulier אִישׁ au verbe pluriel. Le texte principal retient le sens contextuellement cohérent selon lequel la faute ne protégera personne du jugement, tandis que la note signale l’incertitude sans lui imposer un cadre doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme verbal autour de שׁוב est conservé. Les formulations trop techniques ou confessionnelles sont évitées, et les ambiguïtés réelles sont exposées en notes.
