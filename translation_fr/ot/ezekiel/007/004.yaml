  text: וְ/לֹא תָח֥וֹס עֵינִ֛/י עָלַ֖יִ/ךְ וְ/לֹ֣א אֶחְמ֑וֹל כִּ֣י דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Mon œil ne t’épargnera pas[a], et je n’aurai pas de pitié. Car je ferai retomber sur toi ta conduite, et tes abominations seront au milieu de toi[b]. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon œil n’aura pas de compassion pour toi ». L’hébreu emploie avec le mot « œil » une expression qui évoque le fait d’épargner ou de regarder avec compassion.
    reason: lexical_alternative
  - marker: b
    text: Ou « seront en toi ». L’expression hébraïque peut désigner ce qui se trouve en son sein ou au milieu d’elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Mon œil ne t’épargnera pas
  rationale: Conserve l’image idiomatique hébraïque de l’œil qui épargne, tout en restant compréhensible en français prophétique.
- source_word: אֶחְמֹל
  choice: je n’aurai pas de pitié
  rationale: Distingue חמל de חוס et préserve le redoublement rhétorique entre l’absence d’épargne et l’absence de pitié.
- source_word: דְרָכַיִךְ
  choice: ta conduite
  rationale: Dans cette formule de jugement, דרך désigne la manière de vivre et les actes. « Ta conduite » est naturel en français et évite l’opacité possible de « tes voies ».
- source_word: עָלַיִךְ אֶתֵּן
  choice: je ferai retomber sur toi
  rationale: Rend naturellement la formule de rétribution exprimée littéralement par « mettre/donner sur toi », sans ajouter explicitement le verbe « punir ».
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: tes abominations
  rationale: Préserve la forte portée cultuelle, morale et prophétique de תועבות, sans l’atténuer en « actes détestables ».
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: seront au milieu de toi
  rationale: Suit de près la formulation spatiale du texte et conserve son caractère concis et quelque peu ambigu.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le passage du féminin singulier dans les menaces au pluriel dans ce verbe est conservé. « Alors » explicite sobrement le rapport de conséquence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Formule de jugement et de rétribution
  choice: je ferai retomber sur toi ta conduite
  alternative: je te punirai à cause de ta conduite
  rationale: L’hébreu présente la conduite de Jérusalem comme retombant sur elle, sans employer explicitement le verbe « punir ». La traduction conserve cette image judiciaire.
- issue: Alternance du singulier et du pluriel
  choice: « toi » au féminin singulier, puis « vous saurez » au pluriel
  alternative: uniformiser tout le verset au singulier ou au pluriel
  rationale: Le texte hébreu s’adresse d’abord à Jérusalem au féminin singulier, puis passe au pluriel pour la reconnaissance finale. Cette tension grammaticale est maintenue plutôt que résolue.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image de l’œil, la force de « abominations », le nom Yahweh et l’alternance intentionnelle entre l’adresse à Jérusalem au singulier et la conclusion au pluriel.
