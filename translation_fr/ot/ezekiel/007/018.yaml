lexical_decisions:
- source_word: וְחָגְרוּ שַׂקִּים
  choice: Ils se ceindront de sacs
  rationale: « Se ceindre de sacs » conserve l’image concrète du vêtement de deuil et de détresse, dans un français biblique encore intelligible.
- source_word: פַּלָּצוּת
  choice: l’épouvante
  rationale: Le terme désigne une terreur intense ou un effroi paralysant; « épouvante » restitue cette force mieux que « tremblement ».
- source_word: בּוּשָׁה
  choice: la honte
  rationale: Équivalent direct et naturel du nom hébreu, sans en préciser indûment la cause.
- source_word: קָרְחָה
  choice: seront rasées
  rationale: Dans ce contexte de deuil, la calvitie sur toutes les têtes renvoie au rasage rituel; la formulation française exprime naturellement l’état résultant tout en gardant l’image.
