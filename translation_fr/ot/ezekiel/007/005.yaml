source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רָעָ֛ה אַחַ֥ת רָעָ֖ה הִנֵּ֥ה בָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Un désastre[a], un désastre unique — le voici qui vient ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un désastre, un seul désastre ». L’hébreu répète « désastre » pour insister, et le mot « un » peut souligner soit l’unicité, soit le caractère singulier de ce désastre.'
    reason: alternative lexicale et ambiguïté de l’hébreu
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, à la fois naturelle en français et fidèle au ton solennel de l’annonce divine.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente explicitement le nom divin יהוה sans produire la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: רָעָה
  choice: désastre
  rationale: Dans ce contexte de jugement, le mot désigne un malheur destructeur plutôt que le mal moral. « Désastre » est clair, actuel et conserve la gravité de l’annonce.
- source_word: אַחַת
  choice: unique
  rationale: Le féminin du numéral « un » s’accorde avec רָעָה et peut souligner qu’il s’agit d’un désastre singulier, sans pareil. La note conserve la possibilité d’une lecture plus strictement numérique.
- source_word: רָעָה אַחַת רָעָה
  choice: Un désastre, un désastre unique
  rationale: La répétition abrupte du nom est maintenue pour restituer l’insistance de l’hébreu, tandis que « unique » donne une formulation française intelligible.
- source_word: הִנֵּה בָאָה
  choice: le voici qui vient
  rationale: Cette tournure rend à la fois l’interpellation urgente de הִנֵּה et l’imminence exprimée par בָאָה.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme après אֲדֹנָי. Employer « Yahweh » préserve le nom divin et distingue les deux éléments du titre composé.
- issue: Sens de רָעָה dans une annonce de jugement divin
  choice: désastre
  alternative: mal
  rationale: Le contexte décrit la catastrophe qui survient, non une qualification morale de Dieu. « Désastre » transmet ce sens sans effacer la dimension judiciaire du passage.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule « Ainsi parle » conserve le registre prophétique traditionnel; l’ordre abrupt et la répétition gardent la force de l’original.
