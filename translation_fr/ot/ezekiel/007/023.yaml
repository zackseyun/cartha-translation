source:
  edition: WLC
  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: fr
  text: Fabrique la chaîne[a], car le pays est rempli de crimes sanglants[b], et la ville est remplie de violence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’entrave » ou « les liens ». Le terme hébreu évoque probablement la contrainte, l’emprisonnement ou la captivité sous le jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jugement de sangs ». Expression difficile, pouvant évoquer la culpabilité liée au sang versé, des jugements impliquant l’effusion de sang ou des crimes de sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: Fabrique
  rationale: Impératif qal masculin singulier de עשה. « Fabrique » exprime naturellement l’ordre de produire l’objet concret qui suit.
- source_word: הָרַתּוֹק
  choice: la chaîne
  rationale: Le nom rare désigne vraisemblablement une chaîne ou une entrave. « La chaîne » conserve l’image concrète de la captivité et le déterminant hébreu.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’ordre précédent dans un registre prophétique naturel et digne.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de jugement visant Juda, le terme a vraisemblablement un sens territorial plutôt que cosmique.
- source_word: מָלְאָה
  choice: est rempli de
  rationale: Cette formulation rend naturellement en français la valeur résultative ou stative de la forme accomplie.
- source_word: מִשְׁפַּט דָּמִים
  choice: crimes sanglants
  rationale: Littéralement « jugement de sangs », expression difficile qui associe le domaine judiciaire à la culpabilité liée au sang et aux actes meurtriers. « Crimes sanglants » communique ces dimensions sans reproduire une tournure française obscure.
- source_word: וְהָעִיר
  choice: et la ville
  rationale: Rend directement la conjonction et le nom défini; dans le contexte, la ville désigne vraisemblablement Jérusalem sans qu’il soit nécessaire de l’expliciter.
- source_word: חָמָס
  choice: violence
  rationale: Équivalent courant qui couvre ici la brutalité, l’oppression et l’injustice sociale.
theological_decisions:
- issue: Interprétation de l’image הָרַתּוֹק
  choice: Une chaîne concrète ou symbolique associée au jugement et à la captivité imminents
  alternative: Une entrave destinée au siège, ou une « liaison » plus abstraite
  rationale: Le contexte d’Ézéchiel 7 annonce l’invasion, le châtiment et la fin de la sécurité. « Chaîne » préserve l’image prophétique sans préciser outre mesure son usage exact.
- issue: Sens de מִשְׁפַּט דָּמִים
  choice: Des crimes liés au sang versé et à une justice meurtrière
  alternative: Le jugement relatif au sang versé, la culpabilité de sang, ou simplement le meurtre
  rationale: Le syntagme hébreu demeure dense et ambigu. Le texte principal en donne une expression intelligible, tandis que la note conserve sa forme littérale et son éventail forensic et violent.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « est rempli… est remplie » reproduit le parallélisme hébreu. « Fabrique » est retenu plutôt que « fais » afin que l’ordre portant sur un objet concret soit immédiatement intelligible.
