revisions:
- from: Tu donneras aux prêtres lévitiques qui sont de la descendance de Tsadok, ceux qui s’approchent de moi pour assurer mon service — déclaration du Seigneur Yahweh —, un jeune taureau en sacrifice pour le péché.[a]
  to: Tu donneras aux prêtres lévitiques qui sont de la descendance de Tsadok, ceux qui s’approchent de moi pour être à mon service — déclaration du Seigneur Yahweh —, un jeune taureau comme sacrifice pour le péché.[a]
  rationale: 'La seule correction nécessaire concerne le complément de « servir » : « pour être à mon service » restitue exactement l’orientation vers Dieu de לְשָׁרְתֵנִי, tout en restant naturel dans un français international moderne. La légère adaptation « comme sacrifice » clarifie la relation syntaxique sans ajouter d’interprétation. La note est conservée, avec une ponctuation française normalisée.'
