  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: fr
  text: Tu donneras aux prêtres lévitiques qui sont de la descendance de Tsadok, ceux qui s’approchent de moi pour être à mon service — déclaration du Seigneur Yahweh —, un jeune taureau comme sacrifice pour le péché.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un taureau, fils du gros bétail » ; on peut aussi traduire : « un taureau pris dans le troupeau ».'
    reason: La note rend visible la forme idiomatique de l’hébreu פַּר בֶּן בָּקָר derrière la traduction naturelle « un jeune taureau ».
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu donneras
  rationale: Le parfait qal avec waw, dans ce contexte prescriptif, exprime une directive. Le futur français rend naturellement cette valeur.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: aux prêtres lévitiques
  rationale: Cette formulation désigne les prêtres appartenant à l’ordre lévitique sans assimiler tous les lévites aux prêtres.
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: qui sont de la descendance de Tsadok
  rationale: « Descendance » exprime clairement le rapport généalogique de זֶרַע dans un français moderne.
- source_word: הַקְּרֹבִים אֵלַי
  choice: ceux qui s’approchent de moi
  rationale: Le verbe קרב garde ici son image d’approche et sa portée cultuelle liée au service sacerdotal.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » restitue la formule prophétique נְאֻם; « Yahweh » représente explicitement le nom divin יהוה, tandis que אֲדֹנָי est rendu par « Seigneur ».
- source_word: לְשָׁרְתֵנִי
  choice: pour assurer mon service
  rationale: Dans ce contexte sacerdotal, שׁרת désigne un service cultuel officiel; cette tournure est naturelle et conserve cette spécialisation.
- source_word: פַּר בֶּן בָּקָר
  choice: un jeune taureau
  rationale: L’expression littérale « un taureau, fils du gros bétail » désigne idiomatiquement un jeune taureau; la note conserve la forme hébraïque et une autre traduction possible.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans le vocabulaire sacrificiel, חַטָּאת désigne l’offrande rituelle liée au péché, non le péché abstrait.
theological_decisions:
- issue: Rendu de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le rendu choisi distingue le titre אֲדֹנָי du nom propre divin יהוה et évite de masquer ce dernier sous un titre, sans développer d’interprétation confessionnelle.
- issue: Valeur de חַטָּאת dans le contexte sacrificiel
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: « Sacrifice pour le péché » maintient le lien lexical traditionnel avec le péché. « Sacrifice de purification » mettrait davantage en avant la fonction rituelle possible, mais préciserait une nuance que le terme hébreu seul ne tranche pas entièrement ici.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en relief la formule prophétique au moyen de tirets. Le vocabulaire sacerdotal reste explicite sans archaïsme inutile.
