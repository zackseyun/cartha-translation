  revised_text: Tu donneras aux prêtres lévitiques qui sont de la descendance de Tsadok, ceux qui s’approchent de moi pour être à mon service — déclaration du Seigneur Yahweh —, un jeune taureau comme sacrifice pour le péché.[a]
