  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: fr
  text: Et la gloire de Yahweh entra dans le temple[a] par la porte qui fait face à l’est[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison » ; dans cette vision, il s’agit de l’édifice du Temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par la porte orientée vers l’est ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּכְבוֹד
  choice: Et la gloire
  rationale: כָּבוֹד désigne ici la gloire manifestée, c’est-à-dire la présence majestueuse de Dieu. Le ו conjonctif est rendu simplement par « Et ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh », conformément à sa forme hébraïque et à la décision terminologique fournie.
- source_word: בָּא
  choice: entra
  rationale: Dans ce contexte de mouvement vers l’intérieur du bâtiment, בוא a naturellement le sens d’« entrer ».
- source_word: אֶל הַבָּיִת
  choice: dans la Maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici l’édifice du Temple. La majuscule signale cet emploi particulier sans remplacer le terme imagé d’Ézéchiel.
- source_word: דֶּרֶךְ שַׁעַר
  choice: par la porte
  rationale: דֶּרֶךְ indique l’itinéraire ou le passage emprunté ; en français actuel, « par la porte » exprime cela avec naturel.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: qui fait face à l’est
  rationale: L’expression avec פָּנִים décrit l’orientation de la porte ; « faire face à l’est » restitue clairement l’image hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Identification de הַבַּיִת
  choice: la Maison, avec une note explicative
  alternative: le Temple
  rationale: Dans cette vision, le mot désigne bien le bâtiment du Temple, mais garder « Maison » préserve l’idiome théologique et architectural d’Ézéchiel sans rendre implicite le terme source.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle ; « Maison » est conservé comme désignation contextuelle du Temple et expliqué en note.
