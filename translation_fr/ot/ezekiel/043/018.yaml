  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, ainsi parle le Seigneur Yahweh : Voici les prescriptions concernant l’autel, le jour où il sera fait[a], afin d’y offrir des holocaustes[b] et d’y projeter du sang[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au jour de sa confection » ; l’expression peut aussi avoir le sens plus général de « lorsqu’il sera fait ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un holocauste » ; le singulier hébreu peut avoir ici une valeur collective.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’asperger de sang » ; le verbe hébreu peut évoquer une application rituelle plus énergique que ne le suggère parfois « asperger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique et répétée dans Ézéchiel ; cette traduction conserve l’image et sa force littéraire.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans créer la répétition française « Seigneur SEIGNEUR ».
- source_word: חֻקּוֹת הַמִּזְבֵּחַ
  choice: les prescriptions relatives à l’autel
  rationale: « Prescriptions » convient au cadre rituel et juridique ; « relatives à » exprime naturellement le génitif hébreu en français.
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: le jour où il sera construit
  rationale: Conserve la formulation temporelle littérale tout en rendant explicitement en français que le suffixe renvoie à l’autel.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה
  choice: on y offrira des holocaustes
  rationale: Dans le langage sacrificiel, le hiphil de עלה signifie faire monter ou offrir ; « offrir des holocaustes » est clair et idiomatique. Le singulier hébreu peut avoir une valeur collective.
- source_word: וְלִזְרֹק עָלָיו דָּם
  choice: on l’aspergera de sang
  rationale: זרק désigne ici l’application rituelle du sang sur l’autel. « Asperger » est le terme cultuel français le plus immédiatement compréhensible, tandis qu’une note signale la nuance potentiellement plus énergique du verbe.
theological_decisions:
- issue: Traduction du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction maintient à la fois le titre אֲדֹנָי et le nom propre divin יהוה, au lieu de remplacer ce dernier par un titre ; elle évite aussi une répétition maladroite en français.
- issue: Nombre grammatical de עוֹלָה
  choice: des holocaustes
  alternative: un holocauste
  rationale: Le singulier hébreu peut être collectif dans cette prescription générale. La note conserve toutefois la possibilité d’une lecture strictement singulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le ton solennel de l’oracle et le vocabulaire rituel, sans archaïsmes inutiles.
