revisions:
- from: 'Il me dit : « Fils d’homme, ainsi parle le Seigneur Yahweh : Voici les prescriptions relatives à l’autel, le jour où il sera construit[a] : on y offrira des holocaustes[b] et on l’aspergera de sang[c]. »'
  to: 'Il me dit : « Fils d’homme, ainsi parle le Seigneur Yahweh : Voici les prescriptions concernant l’autel, le jour où il sera fait[a], afin d’y offrir des holocaustes[b] et d’y projeter du sang[c]. »'
  rationale: La révision rétablit la valeur finale des infinitifs hébreux, emploie « fait » plutôt que l’interprétation plus précise « construit », et rend זרק par « projeter » sans exclure l’alternative cultuelle traditionnelle « asperger ». Les marqueurs de notes sont conservés et correctement ancrés.
