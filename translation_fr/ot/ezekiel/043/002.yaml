source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: fr
  text: 'Et voici : la gloire du Dieu d’Israël venait du côté de l’est[a]. Sa voix était comme le bruit des eaux abondantes[b], et la terre fut éclairée par sa gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du chemin de l’est » ; on peut aussi traduire : « de la direction de l’est ».'
    reason: La tournure hébraïque associe « chemin » et « est » pour indiquer la provenance ou la direction.
  - marker: b
    text: 'Ou : « comme le grondement de nombreuses eaux ».'
    reason: קוֹל peut désigner une voix ou un bruit ; « grondement » explicite l’intensité sonore, tandis que רַבִּים peut exprimer le nombre ou l’abondance.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la force déictique et la soudaineté de la scène visionnaire dans une formulation française biblique, mais encore compréhensible aujourd’hui.
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: la gloire du Dieu d’Israël
  rationale: « Gloire » garde la portée théophanique de כָּבוֹד, et « le Dieu d’Israël » rend directement la relation construite hébraïque.
- source_word: בָּא
  choice: venait
  rationale: L’imparfait présente l’arrivée comme une action en cours dans la vision, conformément au contexte narratif.
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: du côté de l’est
  rationale: Rend naturellement l’idée de provenance ou de direction exprimée littéralement par « du chemin de l’est », sans suggérer nécessairement une route précise.
- source_word: וְקוֹלוֹ
  choice: Sa voix
  rationale: Le suffixe renvoie grammaticalement à la gloire manifestée, mais le contexte présente la présence personnelle du Dieu d’Israël ; « sa voix » conserve cette personnification textuelle.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: comme le bruit des grandes eaux
  rationale: « Bruit » évite la répétition peu naturelle de « voix » tout en restant proche de קוֹל ; « grandes eaux » préserve l’image traditionnelle et l’ampleur suggérée par רַבִּים.
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: Dans cette scène théophanique de vaste illumination, « terre » convient mieux que le sens local possible « pays ».
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: resplendissait de sa gloire
  rationale: Formulation française naturelle qui exprime la lumière provenant de la gloire divine, tout en maintenant l’aspect descriptif de la vision.
theological_decisions:
- issue: Référence personnelle des suffixes liés à la voix et à la gloire
  choice: Employer les possessifs personnels « sa voix » et « sa gloire ».
  alternative: « son bruit » et « la gloire de celle-ci », en prenant grammaticalement « la gloire » comme antécédent impersonnel.
  rationale: La gloire est ici la manifestation du Dieu d’Israël et se voit attribuer une voix. Le français personnel reflète cette présentation théophanique sans préciser davantage la nature de la manifestation.
- issue: Portée de אֶרֶץ
  choice: « la terre »
  alternative: « le pays »
  rationale: Le texte peut lexicalement désigner le pays, mais l’image de la gloire qui répand sa lumière favorise ici la portée plus vaste de « terre », sans imposer une localisation absente du verset.
translation_notes:
  register: Français international moderne, digne et fluide. « Et voici » conserve la vivacité prophétique ; « du côté de l’est » évite le calque raide « du chemin de l’est ». La seconde phrase allège l’enchaînement des coordinations hébraïques sans modifier les relations de sens.
