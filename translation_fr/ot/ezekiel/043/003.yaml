  to: L’aspect de ce que je vis était semblable à l’aspect de ce que j’avais vu quand je suis venu détruire la ville[a]. Et les visions étaient semblables à l’aspect de ce que j’avais vu près du canal du Kebar[b]. Et je suis tombé face contre terre.
