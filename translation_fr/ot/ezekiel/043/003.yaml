source:
  edition: WLC
  text: וּ/כְ/מַרְאֵ֨ה הַ/מַּרְאֶ֜ה אֲשֶׁ֣ר רָאִ֗יתִי כַּ/מַּרְאֶ֤ה אֲשֶׁר רָאִ֨יתִי֙ בְּ/בֹאִ/י֙ לְ/שַׁחֵ֣ת אֶת הָ/עִ֔יר וּ/מַרְא֕וֹת כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי אֶל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: fr
  text: L’aspect de ce que je vis était semblable à l’aspect de ce que j’avais vu quand je suis venu détruire la ville[a]. Et les visions étaient semblables à l’aspect de ce que j’avais vu près du canal du Kebar[b]. Et je suis tombé face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand il est venu détruire la ville ». Le texte hébreu porte « quand je suis venu » ; cette formulation peut évoquer la participation d’Ézékiel, dans la vision, à la destruction de Jérusalem plutôt qu’une action qu’il aurait lui-même accomplie concrètement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « le fleuve Kebar » ; il s’agissait vraisemblablement d’un grand canal de Babylonie plutôt que d’un fleuve naturel.'
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֶה / מַרְאוֹת
  choice: aspect / visions
  rationale: « Aspect » rend naturellement les emplois au singulier et permet de préserver leur répétition, tandis que « visions » respecte le passage au pluriel de מַרְאוֹת.
- source_word: רָאִיתִי
  choice: je vis / j’avais vu
  rationale: Le premier verbe introduit ce qu’Ézékiel contempla, tandis que le plus-que-parfait dans les comparaisons clarifie en français que celles-ci renvoient à des visions antérieures.
- source_word: בְּבֹאִי
  choice: quand je suis venu
  rationale: La construction infinitive munie du suffixe de première personne a ici une valeur temporelle. La traduction conserve explicitement cette première personne difficile.
- source_word: לְשַׁחֵת
  choice: détruire
  rationale: Le verbe שׁחת exprime ici l’action destructrice de façon directe.
- source_word: הָעִיר
  choice: la ville
  rationale: Le référent contextuel est Jérusalem, mais le texte hébreu dit seulement « la ville ».
- source_word: אֶל נְהַר כְּבָר
  choice: près du canal du Kebar
  rationale: La préposition situe la vision auprès du cours d’eau. Celui-ci était vraisemblablement un grand canal de Babylonie plutôt qu’un fleuve naturel.
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: je suis tombé face contre terre
  rationale: Cette formulation française naturelle conserve l’image corporelle de révérence et d’accablement portée par l’expression hébraïque.
theological_decisions:
- issue: Agent de la destruction dans « quand je suis venu détruire la ville »
  choice: Conserver la première personne du texte massorétique.
  alternative: « quand il est venu détruire la ville »
  rationale: L’hébreu porte un suffixe de première personne et peut associer Ézékiel, sur le plan visionnaire, au jugement annoncé contre Jérusalem. La traduction ne réattribue donc pas silencieusement l’action, mais signale l’autre compréhension en note.
translation_notes:
  register: Français international actuel, clair et digne. Le passé composé domine la narration pour rester accessible, tandis que « je vis » évite la lourdeur de « l’aspect de ce que j’ai vu » et donne à l’ouverture une tenue littéraire mesurée. La répétition d’« aspect » maintient l’insistance visuelle de l’hébreu sans rendre la phrase obscure.
