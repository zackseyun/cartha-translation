source:
  edition: WLC
  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: fr
  text: Quand ils ont placé leur seuil à côté de mon seuil[a] et leurs montants de porte à côté de mes montants[b], le mur étant entre moi et eux, ils ont profané mon saint nom par les abominations qu’ils ont commises ; alors je les ai consumés dans ma colère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur appui à côté de mon appui ». Le terme hébreu peut désigner un seuil ou un appui.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs encadrements de porte à côté des miens ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « je les ai mangés » ; ici, cette expression hébraïque signifie que Dieu les a consumés ou dévorés en les jugeant.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: Quand ils ont placé
  rationale: La préposition בְּ avec l’infinitif construit de נתן introduit une circonstance temporelle. Cette formulation est naturelle en français et conserve cette valeur.
- source_word: סִפָּם / סִפִּי
  choice: leur seuil / mon seuil
  rationale: סַף peut désigner un seuil ou un appui. « Seuil » convient le mieux au contexte architectural du sanctuaire.
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: leurs montants de porte / mes montants
  rationale: מְזוּזָה désigne le montant ou jambage d’une porte. « Montants de porte » rend clairement l’image architecturale, puis « mes montants » évite une répétition pesante sans ambiguïté.
- source_word: אֵצֶל
  choice: à côté de
  rationale: La préposition exprime une proximité immédiate. « À côté de » est courant et précis.
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: le mur étant entre moi et eux
  rationale: La proposition hébraïque est sans verbe. Cette tournure circonstancielle préserve sa structure et n’ajoute pas l’idée de « seulement », absente du texte explicite.
- source_word: וְטִמְּאוּ
  choice: ils ont profané
  rationale: Au piel, טמא signifie rendre impur ou souiller. Devant « mon saint nom », « profaner » est idiomatique en français et exprime adéquatement l’atteinte à la sainteté.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: La formulation française naturelle conserve fidèlement l’expression hébraïque relative au nom saint de Dieu.
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: par les abominations qu’ils ont commises
  rationale: Le בְּ indique ici le moyen ou la cause. « Commettre des abominations » est naturel en français tout en maintenant la forte portée cultuelle et morale de תּוֹעֵבָה.
- source_word: וָאֲכַל אֹתָם
  choice: alors je les ai consumés
  rationale: אכל signifie littéralement « manger », mais prend ici le sens métaphorique de consumer ou dévorer dans le jugement. « Alors » rend le lien conséquentiel du récit sans atténuer le jugement.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: אַף désigne littéralement le nez, mais signifie idiomatiquement la colère. La traduction retient le sens contextuel clair.
theological_decisions:
- issue: Langage anthropomorphique du jugement dans וָאֲכַל אֹתָם
  choice: je les ai consumés
  alternative: je les ai dévorés ; je les ai détruits
  rationale: « Consumés » conserve la métaphore sévère du texte sans suggérer une action littérale de manger ni la réduire au terme plus général « détruits ».
- issue: Portée de la séparation exprimée par le mur
  choice: le mur étant entre moi et eux
  alternative: avec seulement le mur entre moi et eux
  rationale: L’hébreu affirme qu’un mur se trouvait entre Dieu et eux, sans terme lexical correspondant explicitement à « seulement ». La traduction préserve cette sobriété et laisse au lecteur l’implication de proximité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’image architecturale et la progression vers la profanation puis le jugement. Les termes cultuels « profané », « saint nom » et « abominations » sont maintenus en raison de leur importance contextuelle.
