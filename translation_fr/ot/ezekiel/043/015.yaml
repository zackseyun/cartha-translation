- source_word: אַרְבַּע אַמּוֹת
  choice: quatre coudées
  rationale: La formulation conserve l’unité de mesure ancienne, sans lui substituer une conversion moderne approximative.
- source_word: וּלְמַעְלָה הַקְּרָנוֹת אַרְבַּע
  choice: quatre cornes s’élèveront
  rationale: Cette tournure française naturelle rend le mouvement vers le haut et désigne les quatre saillies en forme de corne de l’autel.
