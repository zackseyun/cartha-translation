  text: וְ/לָקַחְתָּ֣ מִ/דָּמ֗/וֹ וְ/נָ֨תַתָּ֜ה עַל אַרְבַּ֤ע קַרְנֹתָי/ו֙ וְ/אֶל אַרְבַּע֙ פִּנּ֣וֹת הָ/עֲזָרָ֔ה וְ/אֶֽל הַ/גְּב֖וּל סָבִ֑יב וְ/חִטֵּאתָ֥ אוֹת֖/וֹ וְ/כִפַּרְתָּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: fr
  text: Tu prendras de son sang et tu en mettras sur ses quatre cornes, sur les quatre coins de la plateforme[a] et sur la bordure tout autour. Ainsi, tu le purifieras et tu feras l’expiation pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saillie » ou « soubassement ». Dans la vision d’Ézéchiel, le terme hébreu rare désigne apparemment une structure qui entoure l’autel.
    reason: alternative lexicale et incertitude architecturale
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: de son sang… tu en mettras
  rationale: 'La préposition מִן a ici une valeur partitive : seule une partie du sang est prise. La reprise par « en » rend cette valeur naturellement en français.'
- source_word: קַרְנֹתָיו
  choice: ses quatre cornes
  rationale: Dans le contexte d’un autel, קֶרֶן désigne les saillies en forme de corne situées aux angles. « Cornes » est le terme cultuel usuel et précis.
- source_word: פִּנּוֹת
  choice: coins
  rationale: Le nom désigne les angles ou extrémités angulaires d’une structure. « Coins » convient à cette description architecturale.
- source_word: הָעֲזָרָה
  choice: la plateforme
  rationale: Dans la description de l’autel d’Ézéchiel, le mot semble désigner une structure ou plateforme qui l’entoure. « Plateforme » est clair en français actuel, tandis que le terme hébreu demeure rare et discuté.
- source_word: הַגְּבוּל סָבִיב
  choice: la bordure tout autour
  rationale: גְּבוּל désigne ici la limite ou bordure de la structure, et סָבִיב indique qu’elle en fait le tour.
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: tu le purifieras
  rationale: Au piel et dans ce contexte rituel, חטא signifie débarrasser de l’impureté ou du péché, non faire pécher. « Purifier » exprime clairement cette fonction rituelle.
- source_word: וְכִפַּרְתָּהוּ
  choice: tu accompliras pour lui le rite d’expiation
  rationale: כפר appartient au vocabulaire sacrificiel de l’expiation. Cette formulation conserve sa portée cultuelle sans imposer une théorie particulière de l’expiation.
theological_decisions:
- issue: Distinction entre les verbes rituels חטא au piel et כפר
  choice: tu le purifieras et tu accompliras pour lui le rite d’expiation
  alternative: tu le purifieras et tu feras l’expiation pour lui
  rationale: Les deux verbes décrivent des actes liés mais distincts. Les traduire séparément préserve leur succession et évite de réduire l’un à l’autre.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive (« tu prendras », « tu mettras ») conserve la forme des instructions rituelles. Les pronoms masculins renvoient à l’autel mentionné dans le contexte immédiat.
