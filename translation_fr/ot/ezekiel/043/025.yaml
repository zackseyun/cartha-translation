  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: fr
  text: Pendant sept jours, tu offriras chaque jour un bouc en sacrifice pour le péché. Ils offriront[a] un jeune taureau[b] et un bélier pris dans le petit bétail, sans défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe ici du singulier (« tu offriras ») au pluriel (« ils offriront »).
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « un taureau, fils du gros bétail ». Il s’agit d’une formule sacrificielle courante, souvent rendue par « un jeune taureau » ou « un taureau pris dans le gros bétail ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: La tournure exprime une durée; « pendant sept jours » est naturelle et exacte en français.
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Dans ce contexte sacrificiel, עשה signifie accomplir ou présenter un sacrifice; « offrir » rend clairement ce sens cultuel.
- source_word: שְׂעִיר חַטָּאת
  choice: un bouc en sacrifice pour le péché
  rationale: שְׂעִיר désigne ici un bouc, et חַטָּאת le sacrifice rituel pour le péché plutôt que le péché au sens abstrait.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: L’expression indique la répétition quotidienne pendant les sept jours.
- source_word: וּפַר בֶּן בָּקָר
  choice: un jeune taureau
  rationale: Littéralement, le groupe appositionnel signifie « un taureau, fils du gros bétail ». « Un jeune taureau » rend naturellement en français cette formule sacrificielle consacrée, tandis qu’une note conserve la forme hébraïque.
- source_word: וְאַיִל מִן הַצֹּאן
  choice: et un bélier pris dans le petit bétail
  rationale: אַיִל est un bélier; מִן הַצֹּאן en indique la provenance ou la catégorie. « Petit bétail » englobe traditionnellement ovins et caprins.
- source_word: תְּמִימִים
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, תמים qualifie des animaux exempts de tare. La forme française reste concise et laisse la portée grammaticale attachée au taureau et au bélier.
- source_word: יַעֲשׂוּ
  choice: ils offriront
  rationale: Le sens sacrificiel du verbe est rendu par « offrir », et la troisième personne du pluriel est conservée.
theological_decisions:
- issue: Changement de sujet grammatical dans les instructions sacrificielles
  choice: Conserver le passage de « tu offriras » à « ils offriront » dans le texte principal.
  alternative: Harmoniser les deux verbes au singulier (« tu offriras ») ou au pluriel (« ils offriront »).
  rationale: L’hébreu emploie distinctement une deuxième personne du singulier puis une troisième personne du pluriel. Le changement peut suggérer une répartition implicite des rôles, mais le texte ne l’explique pas; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel reste précis sans archaïsme inutile. La rupture de personne de l’hébreu est maintenue et signalée; la formule littérale בֶּן בָּקָר est rendue idiomatiquement dans le texte et documentée en note.
