  yaml_path: translation/ot/ezekiel/043/016.yaml
  text: And the altar hearth was twelve cubits long by twelve wide[b][a], square on its four sides.
translation:
  language: fr
  text: Le foyer de l’autel avait douze coudées de long sur douze de large[b] ; il était carré sur ses quatre côtés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers ses quatre quartiers » ; on peut aussi comprendre : « à ses quatre angles ».'
    reason: lexical_alternative
  - marker: b
    text: L’unité « coudées » est sous-entendue d’après le contexte immédiat des mesures de l’autel.
    reason: cross_reference
lexical_decisions:
- source_word: הָאֲרִיאֵל
  choice: le foyer de l’autel
  rationale: Dans la description architecturale de l’autel, le terme désigne sa partie supérieure où brûle le sacrifice, et non l’autel entier. Cette formulation française est claire sans recourir à une translittération opaque.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: douze
  rationale: Rendu direct du nombre cardinal.
- source_word: אֹרֶךְ
  choice: de long
  rationale: Formulation française naturelle pour exprimer une dimension.
- source_word: בִּשְׁתֵּים עֶשְׂרֵה רֹחַב
  choice: sur douze de large
  rationale: La préposition introduit ici la largeur correspondante ; « de long sur… de large » est la tournure métrique usuelle en français.
- source_word: רָבוּעַ
  choice: carré
  rationale: Le mot décrit directement la forme du foyer.
- source_word: אֶל אַרְבַּעַת רְבָעָיו
  choice: sur ses quatre côtés
  rationale: Cette formulation rend naturellement la référence aux quatre parties ou côtés, tout en conservant en note l’autre interprétation possible par les angles.
- source_word: coudées (implicite dans le contexte)
  choice: coudées
  rationale: L’unité n’est pas répétée dans ce verset hébreu, mais elle est fournie par le contexte immédiat des mesures de l’autel et doit être explicitée pour que les dimensions soient intelligibles en français.
