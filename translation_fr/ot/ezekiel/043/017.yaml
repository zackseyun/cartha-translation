base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/017.yaml
  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: fr
  text: La plate-forme mesurait quatorze coudées de long sur quatorze coudées de large, sur ses quatre côtés. Le rebord qui l’entourait mesurait une demi-coudée, et son socle, une coudée tout autour. Ses marches étaient tournées vers l’est.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: la plate-forme
  rationale: Dans la description architecturale de l’autel, le terme désigne vraisemblablement la plate-forme ou le ressaut supérieur; «plate-forme» est naturel en français et convient à la surface carrée mesurée.
- source_word: הַגְּבוּל
  choice: le rebord
  rationale: Le mot désigne ici la bordure périphérique de la plate-forme; «rebord» rend cette fonction architecturale sans suggérer une frontière territoriale.
- source_word: הַחֵיק
  choice: son socle
  rationale: Dans ce contexte architectural, le terme paraît désigner la partie inférieure ou l’assise entourant l’autel; «socle» suit le sens contextuel tout en restant lisible.
- source_word: מַעֲלֹתֵהוּ
  choice: ses marches
  rationale: Le pluriel désigne les degrés permettant de monter à l’autel; «marches» est le terme français courant et précis.
- source_word: פְּנוֹת קָדִים
  choice: étaient tournées vers l’est
  rationale: Rend directement l’orientation des marches vers l’orient.
