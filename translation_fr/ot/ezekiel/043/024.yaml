  text: וְ/הִקְרַבְתָּ֖/ם לִ/פְנֵ֣י יְהוָ֑ה וְ/הִשְׁלִ֨יכוּ הַ/כֹּהֲנִ֤ים עֲלֵי/הֶם֙ מֶ֔לַח וְ/הֶעֱל֥וּ אוֹתָ֛/ם עֹלָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: fr
  text: Tu les présenteras devant Yahweh, puis les prêtres jetteront du sel sur eux[a] et les offriront en holocauste à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lanceront du sel sur eux ». Le verbe hébreu signifie « jeter, lancer », et non, plus précisément, « saupoudrer ».'
    reason: 'Précision lexicale : le verbe hébreu désigne le fait de jeter ou de lancer ; il ne précise pas un geste de saupoudrage.'
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: Tu les présenteras
  rationale: Le hiphil de קרב signifie « faire approcher, présenter ». « Présenter » convient au contexte sacrificiel sans anticiper le verbe distinct qui exprime ensuite l’offrande.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: 'לִפְנֵי exprime ici la position ou la présence : « devant, en présence de ». La formulation retenue est concise et naturelle dans ce contexte cultuel.'
- source_word: וְהִשְׁלִיכוּ
  choice: jetteront
  rationale: Le verbe שלך signifie normalement « jeter, lancer ». Ce choix conserve la force concrète du terme hébreu sans lui substituer le geste rituel plus précis de « saupoudrer ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant de כֹּהֵן dans le contexte du temple et des sacrifices.
- source_word: עֲלֵיהֶם מֶלַח
  choice: du sel sur eux
  rationale: La préposition עַל avec suffixe indique que le sel est jeté sur les animaux déjà mentionnés. Le pronom est conservé afin de ne pas ajouter au texte.
- source_word: וְהֶעֱלוּ אוֹתָם
  choice: les offriront
  rationale: Au hiphil, עלה possède en contexte sacrificiel le sens de « faire monter », donc « offrir ». Le complément « en holocauste » rend explicite la catégorie sacrificielle sans nécessiter l’ajout français « offriront en les faisant monter ».
- source_word: עֹלָה
  choice: en holocauste
  rationale: עֹלָה est le terme technique désignant l’offrande entièrement consumée. « Holocauste » demeure le terme biblique français usuel pour cette catégorie de sacrifice.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: 'Le ל marque ici la destination ou la consécration de l’offrande : elle est offerte à Yahweh.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » conserve le nom personnel divin plutôt que de lui substituer un titre, sans introduire d’interprétation confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. Le futur simple reproduit les formes verbales prescriptives du passage. « Puis » articule naturellement les étapes successives du rite. Le terme technique « holocauste » est conservé en raison de son emploi biblique établi.
