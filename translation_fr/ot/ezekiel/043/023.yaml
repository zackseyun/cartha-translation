source:
  edition: WLC
  text: בְּ/כַלּוֹתְ/ךָ֖ מֵֽ/חַטֵּ֑א תַּקְרִיב֙ פַּ֣ר בֶּן בָּקָ֣ר תָּמִ֔ים וְ/אַ֥יִל מִן הַ/צֹּ֖אן תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: fr
  text: Quand tu auras fini de purifier[a], tu présenteras un jeune taureau[b] sans défaut et un bélier sans défaut pris dans le petit bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’accomplir l’expiation » ou « d’ôter le péché ». Dans ce contexte sacrificiel, le verbe hébreu peut désigner l’action de purifier en enlevant la souillure ou le péché.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un taureau, fils du gros bétail ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: Quand tu auras fini
  rationale: La préposition ב avec l’infinitif construit de כלה et le suffixe de 2e personne du masculin singulier introduit une proposition temporelle; le futur antérieur exprime naturellement l’achèvement préalable de l’action.
- source_word: מֵחַטֵּא
  choice: de purifier
  rationale: Dans ce contexte rituel, la forme intensive de חטא signifie enlever la souillure ou le péché, donc purifier. Cette formulation reste précise sans réduire le terme à une seule théorie de l’expiation.
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Le hiphil de קרב désigne ici l’action de présenter une victime sacrificielle; « présenteras » conserve la nuance rituelle tout en restant naturel.
- source_word: פַּר בֶּן בָּקָר
  choice: un jeune taureau
  rationale: Cette expression désigne un bovin mâle destiné au sacrifice; « jeune taureau » rend idiomatiquement la construction hébraïque.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Appliqué à une victime sacrificielle, תמים indique l’absence de tare. « Sans défaut » est clair, digne et convient aux deux occurrences.
- source_word: וְאַיִל
  choice: et un bélier
  rationale: אַיִל est le terme courant pour un bélier.
- source_word: מִן הַצֹּאן
  choice: pris dans le petit bétail
  rationale: צאן est un collectif qui peut englober ovins et caprins. « Petit bétail » préserve cette étendue lexicale, tandis que « pris dans » rend naturellement מן.
theological_decisions:
- issue: Sens rituel de חטא dans la consécration de l’autel
  choice: purifier
  alternative: faire l’expiation; ôter le péché
  rationale: Le verbe décrit ici l’élimination rituelle de la souillure ou du péché. « Purifier » garde le sens cultuel immédiat et laisse en note les autres nuances possibles sans imposer une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à la deuxième personne du singulier du texte hébreu. La répétition de « sans défaut » reproduit celle de תמים. L’expression « petit bétail » conserve la portée collective de צאן.
