  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: fr
  text: 'Voici la loi de la Maison : au sommet de la montagne, tout son territoire alentour est très saint[a]. Voici la loi de la Maison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute sa limite, tout autour, est saint des saints »; autre traduction possible : « toute l’étendue délimitée autour d’elle est très sainte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: la loi de la Maison
  rationale: תּוֹרָה peut désigner une loi ou une instruction. Ici, le terme énonce la règle fondamentale qui régit le temple et son enceinte. « Maison » conserve l’image hébraïque de בַּיִת tout en désignant clairement, dans le contexte, la demeure sacrée de Dieu.
- source_word: עַל רֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne naturellement ici le sommet d’une montagne.
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: tout son territoire alentour
  rationale: גְּבוּל peut désigner une limite ou le territoire qu’elle délimite. Le contexte porte sur toute l’aire entourant la Maison; « alentour » restitue de manière concise la portée globale du redoublement סָבִיב סָבִיב.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: La construction « saint des saints » exprime ici le degré suprême de sainteté et qualifie toute l’aire mentionnée, non nécessairement le sanctuaire intérieur appelé traditionnellement « Saint des saints ».
- source_word: הִנֵּה
  choice: Oui
  rationale: הִנֵּה attire l’attention sur la reprise solennelle qui conclut le verset. Dans ce contexte récapitulatif, « Oui » en restitue naturellement la force affirmative en français moderne.
- source_word: זֹאת ... זֹאת
  choice: Voici ... telle
  rationale: La formulation conserve l’encadrement démonstratif et l’insistance de la répétition hébraïque, tout en évitant une répétition française pesante.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La majuscule à « Maison » signale son emploi contextuel comme désignation du temple. La syntaxe conserve le cadrage et la solennité de l’hébreu sans recourir à l’archaïsme « voici que » ou « voici » pour הִנֵּה en milieu de phrase.
