  text: וּ/בַ/יּוֹם֙ הַ/שֵּׁנִ֔י תַּקְרִ֛יב שְׂעִיר עִזִּ֥ים תָּמִ֖ים לְ/חַטָּ֑את וְ/חִטְּאוּ֙ אֶת הַ/מִּזְבֵּ֔חַ כַּ/אֲשֶׁ֥ר חִטְּא֖וּ בַּ/פָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: fr
  text: Le deuxième jour, tu présenteras un bouc sans défaut en sacrifice pour le péché[a]. Ils purifieront l’autel comme ils l’ont purifié avec le taureau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le mot hébreu חַטָּאת peut désigner le sacrifice servant à ôter l’impureté aussi bien que le « sacrifice pour le péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: La formule temporelle marque la suite des instructions. En français, le lien séquentiel est clair sans qu’il soit nécessaire d’ajouter « Et ».
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Le hiphil de קרב désigne ici l’action cultuelle d’amener et de présenter une victime. « Présenter » conserve ce sens sans anticiper le terme précis du sacrifice.
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Cette expression sacrificielle désigne un caprin mâle ; « bouc » est précis et naturel en français moderne.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, תמים qualifie une victime exempte de tare physique. « Sans défaut » est clair et idiomatique.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: חטאת désigne ici l’offrande rituelle. La formulation traditionnelle reste compréhensible, tandis qu’une note signale la valeur possible de sacrifice de purification.
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: Ils purifieront l’autel
  rationale: Le piel de חטא appliqué à l’autel exprime une purification rituelle, non l’expiation d’une faute morale commise par l’autel.
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: comme ils l’auront purifié avec le taureau
  rationale: La comparaison renvoie au rite précédent ; ב est compris comme instrumental. Le futur antérieur exprime naturellement en français l’action antérieure servant de modèle.
theological_decisions:
- issue: Valeur de חטאת et de חטא dans un contexte de purification sacrificielle
  choice: Traduire le nom par « sacrifice pour le péché » et le verbe par « purifier »
  alternative: Traduire le nom par « sacrifice de purification » afin d’aligner plus explicitement le nom et le verbe
  rationale: L’hébreu associe le sacrifice et l’action rituelle par une même racine. La traduction retenue conserve la terminologie sacrificielle courante tout en indiquant clairement que l’autel est rituellement purifié. La note maintient l’ambiguïté fonctionnelle du nom.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement singulier rend תַּקְרִיב, tandis que le pluriel « ils » respecte le changement explicite de sujet dans וְחִטְּאוּ. Terminologie cultuelle conservée sans lourdeur archaïque.
