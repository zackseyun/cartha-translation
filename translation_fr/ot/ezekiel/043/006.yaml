  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: fr
  text: Alors j’entendis quelqu’un me parler depuis la maison[a][b], tandis qu’un homme se tenait près de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison » désigne ici l’édifice du Temple dans la vision d’Ézéchiel.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « j’entendis une voix me parler depuis la maison ». L’hébreu n’emploie pas explicitement le mot « voix » et n’identifie pas le locuteur dans ce verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Alors j’entendis
  rationale: Le wayyiqtol de שׁמע fait progresser le récit. « Alors j’entendis » exprime naturellement la succession narrative en français.
- source_word: מִדַּבֵּר
  choice: quelqu’un me parler
  rationale: La tournure hébraïque présente une parole entendue en cours, sans nommer explicitement le locuteur ni employer le nom « voix ». L’indéfini « quelqu’un » évite de préciser son identité.
- source_word: אֵלַי
  choice: me parler
  rationale: אֶל indique ici que la parole est adressée au prophète ; le pronom objet dans « me parler » rend cette direction idiomatiquement.
- source_word: מֵהַבָּיִת
  choice: depuis la Maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici l’édifice du Temple dans la vision. « Depuis » marque clairement l’origine intérieure de la parole ; la majuscule contextuelle signale cet emploi particulier sans substituer « Temple » au mot hébreu.
- source_word: וְאִישׁ
  choice: tandis qu’un homme
  rationale: אִישׁ est indéfini. « Tandis que » rend naturellement la circonstance simultanée introduite par la conjonction.
- source_word: הָיָה עֹמֵד
  choice: se tenait
  rationale: La construction היה + participe exprime une posture continue dans le passé. « Se tenait » est naturel et dignifié en français.
- source_word: אֶצְלִי
  choice: près de moi
  rationale: אֵצֶל exprime la proximité ; « près de moi » conserve ce sens sans imposer un positionnement plus précis.
theological_decisions:
- issue: Identité du locuteur qui parle depuis l’édifice du Temple
  choice: 'Ne pas identifier le locuteur : « quelqu’un me parler »'
  alternative: « je l’entendis me parler » ou « j’entendis une voix me parler »
  rationale: Le verset hébreu ne nomme pas explicitement le locuteur et ne contient pas le substantif « voix ». Même si le contexte plus large peut suggérer un locuteur divin, la traduction préserve l’indétermination du texte.
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Maison » maintient le terme hébreu tout en l’éclairant par une note.
