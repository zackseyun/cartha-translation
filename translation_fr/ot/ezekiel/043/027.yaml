  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: fr
  text: Quand ces jours seront achevés, à partir du huitième jour, les prêtres offriront sur l’autel vos holocaustes et vos sacrifices de paix[a], et je vous serai favorable — oracle du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ».
    reason: Alternative lexicale possible pour שְׁלָמִים, qui désigne des sacrifices associés à la paix, au bien-être et à la communion.
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: Quand ces jours seront achevés
  rationale: Le verbe כלה exprime ici l’achèvement de la période rituelle prescrite précédemment. « Ces jours » explicite naturellement en français la valeur contextuelle de l’article défini hébreu.
- source_word: בַּיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: à partir du huitième jour
  rationale: Cette formulation inclut le huitième jour et indique que la pratique se poursuivra ensuite.
- source_word: יַעֲשׂוּ
  choice: offriront
  rationale: Bien que le verbe signifie littéralement « faire », son emploi avec des sacrifices placés sur l’autel appelle en français le verbe cultuel idiomatique « offrir ».
- source_word: עוֹלֹתֵיכֶם
  choice: vos holocaustes
  rationale: « Holocauste » est le terme français traditionnel et précis pour l’offrande entièrement consumée sur l’autel.
- source_word: שַׁלְמֵיכֶם
  choice: vos sacrifices de paix
  rationale: Cette traduction conserve le lien lexical avec la paix et évite de réduire la portée du terme à une seule interprétation; « sacrifices de communion » reste une possibilité signalée en note.
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: Alors je vous accueillerai favorablement
  rationale: Le pronom désigne le peuple lui-même, et non seulement ses offrandes. Cette formulation rend la faveur et l’acceptation exprimées par רצה sans les confondre avec un simple accueil matériel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: La formule prophétique נְאֻם est rendue par « déclaration », tandis que le titre אֲדֹנָי et le nom divin יהוה demeurent distincts.
theological_decisions:
- issue: Portée de l’acceptation divine
  choice: je vous accueillerai favorablement
  alternative: j’accepterai vos offrandes
  rationale: Le complément direct hébreu est « vous »; la traduction préserve donc la dimension relationnelle et collective de la promesse sans déplacer l’objet vers les sacrifices.
- issue: Rendu de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le rendu choisi distingue le titre « Seigneur » du nom divin personnel Yahweh et suit l’indication doctrinale fournie pour le tétragramme.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le terme peut évoquer la paix, le bien-être et la communion liée au repas sacrificiel. Le texte principal conserve la forme traditionnelle sans éliminer l’autre nuance, donnée en note.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe suit la progression du rite: achèvement des jours de consécration, commencement du service régulier, puis promesse d’acceptation divine. Le marqueur [a] est placé après le terme auquel la variante se rapporte.'
