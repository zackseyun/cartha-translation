  - severity: low
    issue: Formule נְאֻם אֲדֹנָי יְהוִה
    rationale: « Oracle du Seigneur Yahweh » est une formule française biblique courante et idiomatique pour le sceau prophétique, sans modifier le titre ni le nom divin.
