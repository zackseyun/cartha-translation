source:
  edition: WLC
  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: fr
  text: 'Voici les dimensions de l’autel, en coudées — chaque coudée valant une coudée et une largeur de main[a] : le renfoncement[b] aura une coudée, et une coudée de largeur ; une bordure d’un empan entourera son rebord. C’est là la base[c] de l’autel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il s’agit de la coudée longue : une coudée ordinaire augmentée d’une largeur de main.'
    reason: cultural_note
  - marker: b
    text: 'Le mot hébreu désigne une partie basse ou creuse dont la forme exacte est incertaine ; autres traductions possibles : « rigole » ou « socle ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi désigner le « dos », une saillie ou la hauteur de la structure de l’autel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: dimensions
  rationale: Dans ce contexte architectural, « dimensions » désigne naturellement l’ensemble des mesures prescrites.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: en coudées — chaque coudée valant une coudée et une largeur de main
  rationale: La formulation explicite que l’unité employée est la coudée longue, supérieure d’une largeur de main à la coudée ordinaire, tout en conservant la répétition explicative de l’hébreu.
- source_word: חֵיק
  choice: renfoncement
  rationale: Le mot désigne ici une partie basse ou creuse de l’autel, mais son référent architectural exact demeure incertain. « Renfoncement » garde l’idée d’un espace en retrait sans imposer la forme précise d’une rigole ou d’un socle.
- source_word: רֹחַב
  choice: largeur
  rationale: Équivalent dimensionnel courant et précis.
- source_word: גְּבוּלָהּ
  choice: bordure
  rationale: Le terme désigne une limite ou bande périphérique ; « bordure » convient au cadre architectural.
- source_word: שְׂפָתָהּ
  choice: rebord
  rationale: Littéralement « lèvre » ; « rebord » est l’expression architecturale naturelle en français.
- source_word: זֶרֶת
  choice: empan
  rationale: Terme français traditionnel et exact pour la mesure correspondant à l’écartement de la main.
- source_word: גַּב
  choice: base
  rationale: Dans la description de la partie inférieure de l’autel, « base » donne un sens architectural cohérent, mais le mot hébreu rare peut aussi évoquer le dos ou une structure en saillie ; l’incertitude est signalée en note.
- source_word: הַמִּזְבֵּחַ
  choice: autel
  rationale: Équivalent français usuel de la structure sacrificielle décrite.
theological_decisions:
- issue: Identification de termes architecturaux rares dans la vision du temple
  choice: Employer « renfoncement » et « base » dans le texte, avec des notes signalant l’incertitude
  alternative: Comprendre חֵיק comme « rigole » ou « socle », et גַּב comme « dos », « saillie » ou « hauteur »
  rationale: Le passage fournit des données architecturales sans permettre de reconstruire avec certitude chaque élément. Le texte principal reste lisible et concret, tandis que les notes préservent l’ambiguïté lexicale sans lui donner une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe technique clarifiée sans gommer les incertitudes de la terminologie architecturale. Les unités anciennes sont conservées et expliquées.
