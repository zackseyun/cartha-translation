  text: וַ/יּוֹלִכֵ֖/נִי אֶל הַ/שָּׁ֑עַר שַׁ֕עַר אֲשֶׁ֥ר פֹּנֶ֖ה דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/001.yaml
  text: Then he brought me to the gate[a], the gate that faces east.
translation:
  language: fr
  text: Puis il me conduisit à la porte[a], la porte qui fait face à l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « porte » : « à la porte, la porte qui fait face à l’est ». Cette répétition précise la porte en question et la met en relief.'
    reason: La note signale une répétition marquée de l’original, conservée dans la traduction.
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Puis il me conduisit
  rationale: Le hifil de הלך signifie ici « faire aller », donc « conduire » ou « amener ». « Conduisit » convient au déplacement guidé dans cette vision, et « Puis » marque naturellement la progression du récit portée par le waw consécutif.
- source_word: אֶל הַשָּׁעַר
  choice: à la porte
  rationale: אֶל exprime la direction ou le point d’arrivée. Après « conduire », « à la porte » est une formulation française naturelle et précise.
- source_word: שַׁעַר אֲשֶׁר
  choice: la porte qui
  rationale: Le second שַׁעַר est en apposition et précise le premier. Sa répétition est conservée afin de respecter la structure emphatique de l’hébreu.
- source_word: פֹּנֶה דֶּרֶךְ הַקָּדִים
  choice: fait face à l’est
  rationale: Le participe פֹּנֶה décrit l’orientation de la porte, tandis que דֶּרֶךְ הַקָּדִים indique la direction orientale. « Fait face à l’est » est idiomatique et fidèle.
