source:
  edition: WLC
  text: וּ/מֵ/חֵ֨יק הָ/אָ֜רֶץ עַד הָ/עֲזָרָ֤ה הַ/תַּחְתּוֹנָה֙ שְׁתַּ֣יִם אַמּ֔וֹת וְ/רֹ֖חַב אַמָּ֣ה אֶחָ֑ת וּ/מֵ/הֳ/עֲזָרָ֨ה הַ/קְּטַנָּ֜ה עַד הָ/עֲזָרָ֤ה הַ/גְּדוֹלָה֙ אַרְבַּ֣ע אַמּ֔וֹת וְ/רֹ֖חַב הָ/אַמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: fr
  text: Depuis le socle au niveau du sol[a] jusqu’à la plate-forme inférieure, il y aura deux coudées, avec une largeur d’une coudée ; depuis la petite plate-forme jusqu’à la grande plate-forme[b], il y aura quatre coudées, avec une largeur d’une coudée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « le sein de la terre » et peut désigner ici la base, un retrait ou un rebord de l’autel au niveau du sol.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « plate-forme » désigne ici les niveaux en retrait de l’autel ; on pourrait aussi traduire par « palier » ou « rebord ».
    reason: lexical_alternative
  - marker: c
    text: La fin du verset dit littéralement « et la largeur de la coudée » ; elle signifie probablement que la largeur était d’une coudée, comme dans la première mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: le socle au niveau du sol
  rationale: Littéralement « le sein de la terre » ; dans cette description architecturale, l’expression désigne vraisemblablement la base ou le retrait inférieur de l’autel. « Socle au niveau du sol » exprime clairement cette fonction sans conserver une image obscure en français.
- source_word: עֲזָרָה
  choice: plate-forme
  rationale: Dans Ézéchiel 43.13-17, le terme paraît désigner les niveaux ou retraits successifs de l’autel. « Plate-forme » est compréhensible en français moderne tout en laissant ouverte la forme architecturale précise.
- source_word: הַתַּחְתּוֹנָה
  choice: inférieure
  rationale: L’adjectif situe cette plate-forme sous l’autre niveau sans imposer le sens superlatif « la plus basse ».
- source_word: שְׁתַּיִם אַמּוֹת
  choice: deux coudées
  rationale: L’hébreu donne directement la mesure ; sa dimension verticale ressort de la construction « depuis… jusqu’à… » et n’exige pas l’ajout de « de haut ».
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: avec une largeur d’une coudée
  rationale: Cette formulation naturelle rend explicitement רֹחַב, « largeur », et conserve exactement la mesure.
- source_word: הֳעֲזָרָה הַקְּטַנָּה
  choice: la petite plate-forme
  rationale: « Petite » rend directement קְטַנָּה et marque son contraste avec la grande plate-forme.
- source_word: הָעֲזָרָה הַגְּדוֹלָה
  choice: la grande plate-forme
  rationale: « Grande » rend directement גְּדוֹלָה dans son opposition architecturale à la petite plate-forme.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatre coudées
  rationale: Comme dans la première mesure, la dimension verticale est impliquée par « depuis… jusqu’à… ».
- source_word: וְרֹחַב הָאַמָּה
  choice: avec une largeur d’une coudée
  rationale: Littéralement « et la largeur de la coudée » ; le contexte parallèle indique vraisemblablement une largeur d’une coudée. La note conserve la particularité de la formulation hébraïque.
theological_decisions: []
