source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הַ/פָּ֣ר הַֽ/חַטָּ֑את וּ/שְׂרָפ/וֹ֙ בְּ/מִפְקַ֣ד הַ/בַּ֔יִת מִ/ח֖וּץ לַ/מִּקְדָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: fr
  text: Puis tu prendras le taureau du sacrifice pour le péché[a], et on le brûlera à l’endroit assigné au Temple[b], en dehors du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le taureau destiné au sacrifice pour le péché »; autre traduction possible : « le taureau du sacrifice de purification ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à l’endroit assigné de la Maison ». Ici, « la Maison » désigne le Temple ou son ensemble architectural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Puis tu prendras
  rationale: Le waw suivi de l’accompli poursuit ici une série d’instructions rituelles. « Puis » explicite naturellement la succession, et le futur français conserve la valeur directive.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, parfois envisagé comme jeune, mais le contexte n’exige pas que cette nuance d’âge soit exprimée.
- source_word: הַחַטָּאת
  choice: du sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חַטָּאת désigne l’offrande liée au péché. Cette formulation est claire en français courant tout en conservant l’association lexicale avec le péché.
- source_word: וּשְׂרָפוֹ
  choice: et on le brûlera
  rationale: La forme hébraïque passe réellement à la troisième personne du singulier avec un suffixe objet masculin singulier. Le pronom indéfini « on » préserve ce changement sans introduire artificiellement un agent précis.
- source_word: בְּמִפְקַד הַבַּיִת
  choice: à l’endroit assigné au Temple
  rationale: מִפְקָד exprime ici un lieu assigné ou désigné. הַבַּיִת, littéralement « la Maison », renvoie dans cette vision au Temple; la majuscule signale cet emploi institutionnel.
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: en dehors du sanctuaire
  rationale: La formulation rend directement l’idée spatiale de מִחוּץ et le caractère sacré exprimé par מִקְדָּשׁ.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut être compris selon sa fonction liée au péché ou selon son effet purificateur. Le texte principal retient la formulation traditionnelle et transparente, tandis que l’autre analyse légitime est conservée en note.
- issue: Changement de personne dans וּשְׂרָפוֹ
  choice: préserver la troisième personne par « on le brûlera »
  alternative: 'harmoniser à la deuxième personne : « tu le brûleras »'
  rationale: L’hébreu passe de « tu prendras » à « il le brûlera ». Employer « on » garde l’agent non identifié et évite de résoudre silencieusement cette variation textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque. « Temple » clarifie le référent de « la Maison », tandis que la note conserve la forme littérale. La variation de personne du texte source est maintenue plutôt que nivelée.
