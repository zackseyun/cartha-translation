source:
  edition: WLC
  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: fr
  text: Maintenant, qu’ils éloignent de moi leur prostitution[a] et les cadavres de leurs rois[b], et j’habiterai au milieu d’eux pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs prostitutions ». Dans les livres prophétiques, cette image désigne souvent l’infidélité envers Dieu, notamment par l’idolâtrie.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner littéralement les dépouilles de leurs rois ou, plus largement, des tombeaux, installations funéraires ou monuments royaux qui souillaient les abords du sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque la transition vers le changement désormais exigé, avec une formulation française simple et directe.
- source_word: יְרַחֲקוּ
  choice: qu’ils éloignent
  rationale: Le hiphil de רחק a un sens causatif, « rendre éloigné, éloigner ». Dans ce contexte, la tournure exprime une exhortation plutôt qu’une simple prédiction.
- source_word: זְנוּתָם
  choice: leur prostitution
  rationale: Ce terme conserve l’image prophétique forte de la prostitution, qui évoque ici l’infidélité envers Dieu, notamment par l’idolâtrie, sans remplacer la métaphore par son interprétation.
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: les cadavres de leurs rois
  rationale: Traduction concrète et digne de פגרי מלכיהם. Le référent historique exact restant incertain, le texte ne l’explicite pas.
- source_word: מִמֶּנִּי
  choice: de moi
  rationale: La préposition exprime l’éloignement par rapport à Dieu et s’intègre naturellement à « éloignent de moi ».
- source_word: וְשָׁכַנְתִּי
  choice: et j’habiterai
  rationale: « Habiter » rend naturellement שכן tout en conservant sa portée liée à la présence durable de Dieu.
- source_word: בְתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression maintient la dimension spatiale et relationnelle de la présence divine au sein du peuple.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte de restauration, l’expression indique une permanence durable; « pour toujours » est naturel en français moderne.
theological_decisions:
- issue: Sens de זְנוּתָם dans le contexte prophétique
  choice: Conserver la métaphore par « leur prostitution »
  alternative: « leur idolâtrie » ou « leur immoralité sexuelle »
  rationale: Le mot évoque l’infidélité du peuple envers Dieu, souvent manifestée par l’idolâtrie. Une traduction interprétative ferait disparaître l’image hébraïque ou en réduirait la portée.
- issue: Valeur de יְרַחֲקוּ
  choice: 'Exhortation : « qu’ils éloignent »'
  alternative: 'Futur prédictif : « ils éloigneront »'
  rationale: Après עתה et dans le contexte immédiat, la forme énonce le changement requis du peuple plutôt qu’une simple prédiction.
- issue: Référent des « cadavres de leurs rois »
  choice: Maintenir la formulation concrète sans l’interpréter dans le corps du texte
  alternative: « monuments funéraires de leurs rois » ou « vestiges royaux idolâtres »
  rationale: L’hébreu parle concrètement de cadavres, mais il peut viser des dépouilles royales ou, plus largement, des installations funéraires ou commémoratives qui souillaient les abords du sanctuaire. L’ambiguïté doit être préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exhortative et les images concrètes de l’hébreu sont conservées, tandis que les ambiguïtés historiques et métaphoriques sont signalées en notes.
