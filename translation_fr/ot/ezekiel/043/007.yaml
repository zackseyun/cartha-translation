source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ אֶת מְק֣וֹם כִּסְאִ֗/י וְ/אֶת מְקוֹם֙ כַּפּ֣וֹת רַגְלַ֔/י אֲשֶׁ֧ר אֶשְׁכָּן שָׁ֛ם בְּ/ת֥וֹךְ בְּנֵֽי יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם וְ/לֹ֣א יְטַמְּא֣וּ ע֣וֹד בֵּֽית יִ֠שְׂרָאֵל שֵׁ֣ם קָדְשִׁ֞/י הֵ֤מָּה וּ/מַלְכֵי/הֶם֙ בִּ/זְנוּתָ֔/ם וּ/בְ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם בָּמוֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, voici le lieu de mon trône et le lieu où reposent les plantes de mes pieds. C’est là que j’habiterai pour toujours au milieu des fils d’Israël. La maison d’Israël ne souillera plus mon saint nom, ni eux ni leurs rois, par leur prostitution et par les cadavres de leurs rois sur leurs hauts lieux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « et par les cadavres de leurs rois dans leur mort ». Selon la lecture traditionnelle du texte hébreu, le dernier mot signifie « leurs hauts lieux », ce qui correspond au contexte de souillure cultuelle ; certains le comprennent toutefois en rapport avec « leur mort ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique d’Ézéchiel. Elle conserve l’image et l’expression hébraïques dans une formulation française consacrée et intelligible.
- source_word: מְקוֹם כִּסְאִי
  choice: le lieu de mon trône
  rationale: Traduction directe du groupe construit, naturelle en français.
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: le lieu où reposent la plante de mes pieds
  rationale: כַּפּוֹת désigne ici la plante des pieds. Cette formulation conserve l’image corporelle sans introduire l’interprétation « marchepied ».
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: C’est là que j’habiterai
  rationale: Le relatif et שָׁם renvoient au lieu qui vient d’être décrit. Le futur convient au cadre visionnaire et la tournure est idiomatique en français.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des fils d’Israël
  rationale: Conserve à la fois la valeur spatiale de בְּתוֹךְ et l’expression familiale et covenantale בְּנֵי יִשְׂרָאֵל.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française actuelle qui rend naturellement la durée indéfinie et permanente indiquée ici.
- source_word: יְטַמְּאוּ
  choice: ne souillera plus
  rationale: Le verbe טמא relève du champ de l’impureté. « Souiller » convient à l’objet « mon saint nom » tout en préservant cette image.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Formulation française naturelle et fidèle à la construction hébraïque.
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: ni eux ni leurs rois
  rationale: Après la négation, la corrélation « ni… ni… » restitue clairement la coordination hébraïque.
- source_word: בִּזְנוּתָם
  choice: par leur prostitution
  rationale: Le terme garde la force de l’image prophétique et permet d’entendre à la fois la conduite sexuelle et l’infidélité cultuelle ou covenantale, sans réduire le sens à l’une d’elles.
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: et par les cadavres de leurs rois
  rationale: פֶּגֶר désigne un cadavre; ce choix direct maintient le lien avec l’impureté rituelle.
- source_word: בָּמוֹתָם
  choice: sur leurs hauts lieux
  rationale: Suit la vocalisation massorétique בָּמוֹתָם, qui désigne leurs hauts lieux cultuels. La préposition « sur » restitue simplement בְּ et convient à ces installations élevées.
theological_decisions:
- issue: Nature de la souillure évoquée dans la dernière proposition
  choice: Le texte évoque la souillure cultuelle et covenantale causée par la prostitution d’Israël et par les cadavres de ses rois sur leurs hauts lieux.
  alternative: 'Le dernier terme peut être compris comme « dans leur mort », donnant : « par les cadavres de leurs rois dans leur mort ».'
  rationale: La vocalisation massorétique et le contexte de sainteté du sanctuaire soutiennent la lecture « leurs hauts lieux ». Toutefois, puisque les consonnes permettent une compréhension liée à la mort, l’alternative est signalée en note sans effacer l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve les images concrètes de l’hébreu (« plante de mes pieds », « prostitution », « cadavres ») ainsi que l’expression « fils d’Israël ». La ponctuation sépare la désignation du lieu de la promesse d’y habiter afin d’éviter une phrase excessivement lourde.
