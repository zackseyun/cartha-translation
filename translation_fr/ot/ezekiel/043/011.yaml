  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: fr
  text: Et s’ils ont honte de tout ce qu’ils ont fait, fais-leur connaître la forme du Temple, son agencement, ses sorties et ses entrées, toutes ses formes, toutes ses prescriptions, toute sa forme[a] et toutes ses instructions[b]. Écris cela sous leurs yeux, afin qu’ils observent toute sa forme et toutes ses prescriptions, et les mettent en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu répète le vocabulaire de la « forme » : d’abord au pluriel (« toutes ses formes »), puis au singulier (« toute sa forme »). Cette répétition met en relief la configuration du Temple.'
    reason: lexical_and_textual_clarification
  - marker: b
    text: Ou « toutes ses lois » ; le mot hébreu peut désigner des instructions, des enseignements ou des lois.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: ont honte
  rationale: Le nifal exprime ici la honte éprouvée devant les fautes commises; « ont honte » est direct, naturel et conserve la portée conditionnelle.
- source_word: צוּרַת הַבַּיִת
  choice: la forme du Temple
  rationale: צוּרָה désigne ici la forme ou configuration architecturale. Dans cette vision, הַבַּיִת renvoie clairement au Temple; la majuscule signale cet emploi particulier.
- source_word: תְכוּנָתוֹ
  choice: sa disposition
  rationale: Le terme évoque l’agencement ordonné ou la configuration mesurée de l’édifice; « disposition » convient au contexte architectural.
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: ses sorties et ses entrées
  rationale: Ces deux termes appariés désignent naturellement les accès de sortie et d’entrée du complexe.
- source_word: כָל צוּרֹתָיו / כָל צוּרָתוֹ
  choice: toutes ses formes architecturales / toute sa forme
  rationale: La répétition du vocabulaire de la forme est conservée, y compris dans la liste, tandis que « architecturales » clarifie le sens concret en français.
- source_word: חֻקֹּתָיו
  choice: ses décrets
  rationale: חֻקּוֹת désigne des prescriptions établies et normatives; « décrets » en maintient la force sans les confondre avec les תּוֹרוֹת.
- source_word: תּוֹרֹתָיו
  choice: ses instructions
  rationale: Le pluriel de תּוֹרָה peut désigner des enseignements ou directives. « Instructions » préserve cette amplitude dans une liste à la fois architecturale et normative.
- source_word: הוֹדַע אוֹתָם
  choice: fais-leur connaître
  rationale: Le hifil de ידע signifie « faire connaître »; la tournure française garde la force causative de l’impératif.
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: Consigne tout cela par écrit sous leurs yeux
  rationale: Cette formulation française rend l’acte d’écrire et l’image d’une présentation publique et visible, sans imposer un support absent du texte.
- source_word: וְיִשְׁמְרוּ ... וְעָשׂוּ אוֹתָם
  choice: afin qu’ils respectent ... et qu’ils les mettent en pratique
  rationale: « Respecter » rend l’observance attentive exprimée par שׁמר, et « mettre en pratique » rend idiomatiquement עשׂה avec ces prescriptions.
theological_decisions:
- issue: Portée architecturale ou symbolique de la vision du Temple
  choice: Employer un vocabulaire architectural concret tout en conservant les termes normatifs.
  alternative: Réduire l’ensemble soit à un plan de construction littéral, soit à une représentation purement symbolique.
  rationale: Le verset associe lui-même formes architecturales, décrets et instructions. La traduction ne tranche pas le débat sur la réalisation ou la portée théologique de la vision.
- issue: Répétition du vocabulaire de צוּרָה
  choice: Conserver la répétition « toutes ses formes architecturales » présente dans le texte massorétique.
  alternative: Supprimer la seconde occurrence comme répétition stylistiquement superflue ou varier librement les termes.
  rationale: La répétition appartient au texte hébreu transmis et peut avoir une valeur emphatique ou structurante; elle ne doit pas être effacée silencieusement.
- issue: Sens de תּוֹרֹתָיו
  choice: Traduire par « ses instructions ».
  alternative: Traduire par « ses lois ».
  rationale: « Instructions » rend le champ sémantique de תּוֹרָה sans exclure sa force normative et sans assimiler automatiquement le terme à un code juridique au sens moderne.
translation_notes:
  register: Français international moderne, digne et lisible. L’impératif singulier s’adresse au prophète. « Temple » explicite le référent contextuel de « la maison », tandis que la répétition inhabituelle du texte hébreu est maintenue et documentée.
