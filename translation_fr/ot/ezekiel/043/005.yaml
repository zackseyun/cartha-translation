source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: fr
  text: Alors l’Esprit[a] me souleva et m’amena dans la cour intérieure. Et voici que la Maison[b] était pleine de la gloire de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit » ou « le vent » ; le mot hébreu רוּחַ peut avoir ces sens, bien que, dans le contexte des visions d’Ézéchiel, il désigne probablement l’Esprit divin.
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire le Temple ; l’hébreu dit littéralement « la Maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: me souleva
  rationale: Le verbe נשׂא exprime ici l’élévation et le transport du prophète dans la vision. « Me souleva » conserve le mouvement ascendant sans le réduire au simple fait de porter.
- source_word: רוּחַ
  choice: l’Esprit
  rationale: רוּחַ peut désigner le vent, un esprit ou l’Esprit. Dans les scènes de transport visionnaire d’Ézéchiel, l’agent divin est le sens contextuel le plus probable; la note maintient toutefois l’ambiguïté lexicale réelle.
- source_word: וַתְּבִיאֵנִי
  choice: m’amena
  rationale: La forme causative de בוא signifie « faire venir/entrer » ou « amener ». « M’amena dans » rend naturellement en français le déplacement jusqu’à la cour intérieure.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: la cour intérieure
  rationale: Dans l’architecture du sanctuaire, חָצֵר désigne une cour; « cour intérieure » est précis, naturel et conforme au contexte.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette formule attire brusquement l’attention sur ce que le prophète découvre. « Et voici que » garde la force du marqueur tout en restant idiomatique en français actuel.
- source_word: מָלֵא
  choice: remplissait
  rationale: Le prédicat hébreu décrit la Maison pleine de la gloire de Yahweh. La formulation verbale française « la gloire… remplissait la Maison » exprime naturellement cet état résultant.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne ici la gloire divine manifestée. Le complément conserve explicitement le nom personnel יְהוָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin du texte hébreu au lieu de lui substituer un titre.
- source_word: הַבָּיִת
  choice: la Maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici l’édifice du temple. La majuscule signale cet emploi cultuel sans remplacer le terme hébreu par son interprétation contextuelle.
theological_decisions:
- issue: Référent de רוּחַ dans le transport visionnaire
  choice: l’Esprit, compris comme agent divin
  alternative: un esprit ou le vent
  rationale: Le contexte récurrent des visions d’Ézéchiel favorise l’action de l’Esprit divin, mais l’absence d’article et la polysémie de רוּחַ justifient de conserver les autres possibilités en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le restitue comme nom personnel sans introduire la substitution traditionnelle par un titre.
- issue: Identification de הַבָּיִת
  choice: la Maison
  alternative: le Temple
  rationale: Le référent est bien le temple dans la vision, mais « la Maison » préserve l’expression hébraïque et son caractère cultuel; la note fournit l’explicitation contextuelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure fluide pour un lecteur ordinaire, tandis que « Et voici que » conserve le relief prophétique. « Maison » prend une majuscule pour indiquer son emploi comme désignation du sanctuaire.
