  text: שִׁבְעַ֣ת יָמִ֗ים יְכַפְּרוּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/טִֽהֲר֖וּ אֹת֑/וֹ וּ/מִלְא֖וּ יד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: fr
  text: Pendant sept jours, ils feront l’expiation pour l’autel et le purifieront, et ils le consacreront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ils rempliront sa main », expression cultuelle signifiant installer ou consacrer pour le service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: L’accusatif de durée indique la période au cours de laquelle se déroulent les actions. Cette formulation est naturelle en français moderne.
- source_word: יְכַפְּרוּ אֶת הַמִּזְבֵּחַ
  choice: ils feront l’expiation pour l’autel
  rationale: Dans ce contexte rituel, כפר désigne l’accomplissement de rites d’expiation ou de purification. La formulation retenue conserve le vocabulaire cultuel et le fait que l’autel en est l’objet.
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: et le purifieront
  rationale: טהר exprime ici la purification rituelle. « Purifier » est clair, digne et adapté à un autel.
- source_word: וּמִלְאוּ יָדוֹ
  choice: puis ils le consacreront
  rationale: L’expression signifie littéralement « remplir sa main » et fonctionne comme un idiome d’installation ou de consécration cultuelle. Appliqué à un autel, « consacrer » est plus naturel que « ordonner » en français.
theological_decisions:
- issue: Sens de l’idiome cultuel וּמִלְאוּ יָדוֹ lorsqu’il se rapporte à l’autel
  choice: puis ils le consacreront
  alternative: et ils rempliront sa main
  rationale: La traduction littérale serait incompréhensible pour la plupart des lecteurs français. « Consacrer » communique la mise en service sacrée de l’autel sans attribuer au texte une précision doctrinale supplémentaire; le sens littéral est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel « expiation », « purifier » et « consacrer » est conservé. « Puis » distingue naturellement la consécration finale des actes précédents sans imposer une séparation absolue.
