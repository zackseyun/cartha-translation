reference: Ezekiel 43:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: fr
  text: Quant à toi, fils d’homme, fais connaître le Temple[a] à la maison d’Israël, afin qu’ils aient honte de leurs fautes, et qu’ils en mesurent le plan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison » ; ici, le sanctuaire ou Temple de la vision d’Ézéchiel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la configuration » ou « le modèle » de l’édifice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן־אָדָם
  choice: fils d’homme
  rationale: Cette formule d’adresse récurrente dans Ézéchiel conserve l’image hébraïque et assure la continuité littéraire du livre, sans l’interpréter par « mortel ».
- source_word: הַגֵּד
  choice: fais connaître
  rationale: L’impératif demande au prophète de présenter ou d’annoncer clairement ce qu’il a vu. « Fais connaître » est naturel, solennel et moins susceptible que « déclare » de suggérer une simple proclamation verbale.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La traduction conserve cette désignation collective traditionnelle du peuple dans le discours prophétique.
- source_word: הַבַּיִת
  choice: le Temple
  rationale: Le mot signifie littéralement « la maison », mais il désigne ici sans ambiguïté l’édifice sacré de la vision d’Ézéchiel.
- source_word: וְיִכָּלְמוּ
  choice: afin qu’ils aient honte
  rationale: Après l’impératif, la forme verbale exprime naturellement le but ou le résultat recherché, tout en laissant ouverte la nuance exacte entre finalité et conséquence.
- source_word: מֵעֲוֺנוֹתֵיהֶם
  choice: de leurs fautes
  rationale: « Fautes » rend de façon actuelle les actes moralement coupables désignés par עָוֹן, sans réduire le terme à une erreur involontaire.
- source_word: וּמָדְדוּ
  choice: et qu’ils en mesurent
  rationale: La coordination avec la proposition finale donne naturellement en français une seconde réaction attendue. Le pronom « en » rattache explicitement le plan au Temple.
- source_word: תָּכְנִית
  choice: le plan
  rationale: Dans ce contexte architectural, le terme désigne la configuration ou la disposition de l’édifice ; « plan » est précis et courant en français moderne.
theological_decisions:
- issue: Référent de « la maison » dans la vision
  choice: Temple
  alternative: maison
  rationale: Le contexte d’Ézéchiel 40–43 identifie l’édifice comme le sanctuaire montré au prophète. « Temple » clarifie le référent sans ajouter de contenu doctrinal.
- issue: Valeur des verbes qui suivent l’impératif
  choice: 'Finalité suivie d’une réaction attendue : « afin qu’ils aient honte… et qu’ils… mesurent »'
  alternative: 'Coordination prédictive : « ils auront honte… et ils mesureront »'
  rationale: La construction se lit naturellement comme le but ou l’effet visé par l’ordre donné au prophète. La formulation française ne transforme pas ces verbes en prédictions catégoriques.
- issue: Objet de la honte
  choice: leurs fautes
  alternative: leurs iniquités / leur culpabilité
  rationale: Le choix garde la dimension morale de עָוֹן tout en restant compréhensible en français courant et sans préciser indûment si l’accent porte sur les actes ou sur la culpabilité qui en découle.
translation_notes:
  register: Français international moderne, digne et prophétique. La formule « fils d’homme » et l’expression « maison d’Israël » sont maintenues pour leur valeur littéraire récurrente, tandis que « Temple », « fautes » et « plan » assurent une compréhension immédiate.
