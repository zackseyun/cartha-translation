source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Parce que les Philistins ont agi par vengeance et se sont vengés avec un profond mépris[a], afin de détruire avec une hostilité de toujours[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « avec mépris, dans l’âme ». L’expression présente le mépris comme une disposition intérieure, engageant toute la personne.'
    reason: lexical_alternative
  - marker: b
    text: Ou « avec une hostilité perpétuelle ». Le mot hébreu peut désigner une hostilité de longue date ou une hostilité qui dure indéfiniment.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend le titre אֲדֹנָי par « le Seigneur » et représente explicitement le nom divin יהוה par « Yahweh », sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit directement le motif du jugement annoncé et conserve la valeur causale de l’hébreu.
- source_word: עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: les Philistins ont agi par vengeance
  rationale: Expression française naturelle qui maintient le substantif « vengeance » et le caractère intentionnel de leur conduite.
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: se sont vengés
  rationale: Rend naturellement la construction intensive verbe-substantif, dont la répétition serait lourde en français.
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: avec un profond mépris
  rationale: Exprime le mépris hostile comme disposition intérieure de toute la personne; « profond » communique cette dimension sans calquer maladroitement « dans l’âme ».
- source_word: לְמַשְׁחִית
  choice: afin de détruire
  rationale: Marque clairement la visée de leur vengeance tout en conservant le verbe fort « détruire ».
- source_word: אֵיבַת עוֹלָם
  choice: dans une hostilité séculaire
  rationale: « Hostilité » rend אֵיבָה; « séculaire » retient ici le sens d’une inimitié ancienne et durable, tout en signalant en note l’autre valeur possible de עוֹלָם.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au tétragramme יהוה. « Le Seigneur Yahweh » distingue les deux éléments et conserve le nom divin sans imposer une formulation confessionnelle supplémentaire.
- issue: Valeur temporelle de עוֹלָם dans אֵיבַת עוֹלָם
  choice: hostilité séculaire
  alternative: hostilité perpétuelle
  rationale: Le contexte peut viser l’inimitié ancienne des Philistins aussi bien que son caractère persistant. Le texte principal retient la dimension ancienne et durable, tandis que la note préserve explicitement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la forme d’un oracle prophétique et la phrase demeure ouverte, comme dans le verset hébreu, en attente de la conséquence formulée au verset suivant.
