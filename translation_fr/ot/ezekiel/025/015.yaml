  rationale: La révision remplace une tournure française maladroite et potentiellement ambiguë (« dans une hostilité séculaire ») par une expression naturelle qui respecte l’ambiguïté contextuelle de עוֹלָם. Elle conserve le caractère ouvert de l’oracle, le nom divin Yahweh et le sens vigoureux de la vengeance hostile. La note a est reformulée pour décrire plus exactement le rapport entre la forme hébraïque et son explication française.
