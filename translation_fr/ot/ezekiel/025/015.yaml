    issue: Lien et formulation de « dans une hostilité séculaire »
    rationale: Le syntagme français est peu idiomatique après « détruire » et « dans » ne rend pas clairement la relation de l’hostilité au projet destructeur. Le texte hébreu permet une hostilité ancienne ou persistante; « avec une hostilité de toujours » maintient cette indétermination.
  - severity: low
    issue: Note a présentée comme littérale
    rationale: « Avec mépris, dans l’âme » reproduit des mots isolés mais n’est pas une traduction littérale pleinement exacte de la construction. Une explication directe est plus juste et plus claire.
