  text: וְ/עָשִׂ֤יתִי בָ/ם֙ נְקָמ֣וֹת גְּדֹל֔וֹת בְּ/תוֹכְח֖וֹת חֵמָ֑ה וְ/יָֽדְעוּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/תִתִּ֥/י אֶת נִקְמָתִ֖/י בָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: fr
  text: J’accomplirai contre eux de grands actes de vengeance, par des châtiments pleins de fureur[a]. Ils sauront que je suis Yahweh quand j’exercerai ma vengeance contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par des réprimandes pleines de fureur » ou « par des corrections dictées par la colère ». L’expression hébraïque associe les réprimandes ou corrections à la fureur ; elle peut évoquer à la fois le blâme et le châtiment.
    reason: 'Alternative lexicale : תּוֹכֵחָה peut désigner une réprimande, une correction ou, dans un contexte judiciaire, un châtiment.'
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: J’accomplirai contre eux de grands actes de vengeance
  rationale: Le verbe עשה signifie largement « faire, accomplir » et, avec le pluriel נְקָמוֹת, désigne ici l’exécution d’actes de vengeance. Cette formulation conserve le pluriel et la force judiciaire de l’expression.
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: par des châtiments pleins de fureur
  rationale: תּוֹכֵחָה peut désigner une réprimande ou une correction et, dans ce contexte de jugement, un châtiment. חֵמָה exprime une colère ardente, rendue ici par « fureur » sans effacer l’ambivalence lexicale signalée en note.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Ils sauront que je suis Yahweh
  rationale: Cette formule de reconnaissance, fréquente dans Ézéchiel, est rendue directement. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: בְּתִתִּי אֶת־נִקְמָתִי בָּם
  choice: quand j’exercerai ma vengeance contre eux
  rationale: Littéralement, נתן signifie ici « mettre/donner » la vengeance contre quelqu’un. « Exercer ma vengeance contre eux » restitue naturellement en français l’idée de l’infliger.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- issue: Portée de בְּתוֹכְחוֹת חֵמָה
  choice: des châtiments pleins de fureur
  alternative: des réprimandes pleines de fureur
  rationale: Le contexte annonce une vengeance infligée aux Philistins, ce qui favorise le sens punitif, mais la note maintient le sens verbal ou correctif également possible de תּוֹכֵחָה.
translation_notes:
  register: Français international moderne, solennel et accessible. La répétition de « vengeance » est conservée parce qu’elle structure le verset hébreu. « De grands actes de vengeance » représente explicitement le pluriel נְקָמוֹת.
