  text: לִ/בְנֵי קֶ֨דֶם֙ עַל בְּנֵ֣י עַמּ֔וֹן וּ/נְתַתִּ֖י/הָ לְ/מֽוֹרָשָׁ֑ה לְמַ֛עַן לֹֽא תִזָּכֵ֥ר בְּנֵֽי עַמּ֖וֹן בַּ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: fr
  text: aux peuples de l’Orient[a], contre les Ammonites ; je donnerai ce pays comme possession[b], afin que les Ammonites ne soient plus rappelés parmi les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de l’Orient » ; l’expression hébraïque désigne les peuples ou tribus de l’est.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en héritage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: aux peuples de l’Orient
  rationale: L’expression idiomatique désigne les populations ou tribus vivant à l’est. « Peuples de l’Orient » en restitue naturellement la portée ethnogéographique.
- source_word: עַל בְּנֵי עַמּוֹן
  choice: contre les Ammonites
  rationale: Dans cet oracle de jugement et de transfert territorial, עַל reçoit une valeur hostile. « Ammonites » est la désignation ethnique française usuelle de בְּנֵי עַמּוֹן.
- source_word: וּנְתַתִּיהָ
  choice: Je donnerai ce pays
  rationale: Le suffixe féminin renvoie contextuellement au territoire dont il est question. L’explicitation « ce pays » évite en français un pronom sans antécédent clair tout en conservant l’idée simple de donner.
- source_word: לְמוֹרָשָׁה
  choice: en possession
  rationale: מוֹרָשָׁה désigne un bien acquis, possédé ou hérité. « En possession » convient au contexte de prise territoriale sans imposer une nuance familiale.
- source_word: לְמַעַן לֹא
  choice: afin que … ne … plus
  rationale: La tournure exprime ici le but ou le résultat du jugement. « Ne… plus » rend naturellement la disparition future de la mémoire ou de la mention nationale.
- source_word: תִזָּכֵר
  choice: soient … mentionnés
  rationale: Le nifal de זכר peut signifier « être rappelé, être mentionné ». Dans la formule « parmi les nations », « être mentionnés » exprime naturellement la disparition d’Ammon comme peuple reconnu, tout en laissant ouverte la nuance de souvenir.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations environnants, sans la connotation théologique ultérieure que pourrait porter « païens ».
theological_decisions:
- issue: Portée de la disparition d’Ammon parmi les nations
  choice: Exprimer la cessation de sa mention ou de sa reconnaissance parmi les nations
  alternative: Formuler une annihilation absolue, ou seulement une perte de renommée
  rationale: L’hébreu annonce qu’Ammon ne sera plus rappelé ou mentionné parmi les nations. La formulation conserve la force du jugement sur son existence nationale sans extrapoler vers une disparition métaphysique totale.
translation_notes:
  register: Français international actuel, clair et digne. Le verset étant syntaxiquement lié au contexte précédent, « ce pays » explicite sobrement le référent territorial du pronom hébreu. La ponctuation française présente la seconde proposition comme une nouvelle phrase pour une lecture naturelle.
