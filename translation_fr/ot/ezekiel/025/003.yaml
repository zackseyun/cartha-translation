  to: 'Tu diras aux Ammonites[a] : « Écoutez la parole du Seigneur Yahweh. Voici ce que dit le Seigneur Yahweh : Puisque tu as dit : “Ah !”[b] contre mon sanctuaire lorsqu’il a été profané[c], contre la terre d’Israël lorsqu’elle a été dévastée, et contre la maison de Juda lorsque ceux de la maison de Juda sont partis en exil, »'
