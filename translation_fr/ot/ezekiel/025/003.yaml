source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: fr
  text: 'Tu diras aux Ammonites[a] : « Écoutez la parole du Seigneur Yahweh. Voici ce que dit le Seigneur Yahweh : Puisque tu as dit : “Ah !”[b] contre mon sanctuaire lorsqu’il a été profané[c], contre la terre d’Israël lorsqu’elle a été dévastée, et contre la maison de Juda lorsque ceux de la maison de Juda sont partis en exil, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Ammon ».'
    reason: literal_form
  - marker: b
    text: 'Interjection de satisfaction malveillante ou de triomphe moqueur ; on pourrait aussi traduire : « Ha ! »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « désacralisé » ; autre traduction possible : « souillé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Littéralement « les fils d’Ammon ». Le nom ethnique « les Ammonites » est plus naturel en français moderne tout en désignant exactement le même peuple.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: la parole du Seigneur Yahweh
  rationale: Le composé associe le titre אֲדֹנָי, « Seigneur », au nom divin יהוה. « Seigneur Yahweh » conserve les deux éléments sans produire l’inélégant « Seigneur SEIGNEUR ».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formule prophétique rendue dans un français actuel et digne, sans archaïsme inutile.
- source_word: יַעַן אָמְרֵךְ
  choice: Parce que tu as lancé
  rationale: יַעַן introduit le motif du jugement. Le verbe « lancer » convient en français à une exclamation hostile et permet de conserver la vigueur de l’interjection, sans ajouter l’idée explicite de jubilation au corps du texte.
- source_word: הֶאָח
  choice: Ah !
  rationale: Interjection exprimant ici une satisfaction malveillante ou un triomphe moqueur. « Ah ! » est idiomatique en français ; la note explicite sa valeur contextuelle.
- source_word: אֶל
  choice: contre
  rationale: Dans ce contexte hostile, la préposition désigne les réalités visées par la joie malveillante d’Ammon. « Contre » restitue cette orientation adversative.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: Le terme désigne un lieu saint, ici le sanctuaire de Jérusalem. « Sanctuaire » préserve le registre cultuel sans préciser davantage que l’hébreu.
- source_word: נִחָל
  choice: a été profané
  rationale: Le niphal de חלל exprime la profanation ou la désacralisation. « Profané » convient particulièrement à un sanctuaire.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: la terre d’Israël
  rationale: אַדְמָה désigne le sol ou la terre ; dans ce cadre national, « la terre d’Israël » est naturel et fidèle.
- source_word: נָשַׁמָּה
  choice: a été dévastée
  rationale: Le verbe décrit un état de désolation résultant d’une destruction. « Dévastée » est clair et idiomatique.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Cette désignation collective traditionnelle est conservée. « Les siens » rend ensuite le pluriel הָלְכוּ en renvoyant naturellement aux membres de cette maison.
- source_word: הָלְכוּ בַגּוֹלָה
  choice: les siens sont partis en exil
  rationale: L’hébreu emploie un pluriel pour les membres de la maison de Juda. Cette formulation conserve à la fois l’expression collective et le mouvement vers l’exil.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Souverain Seigneur
  rationale: La traduction conserve à la fois le titre אֲדֹנָי et le nom propre יהוה, sans remplacer silencieusement le nom d’alliance par un autre titre.
- issue: Passage du pluriel au singulier dans l’adresse à Ammon
  choice: « Écoutez » puis « tu as lancé »
  alternative: 'Uniformiser au pluriel : « vous avez lancé »'
  rationale: Le texte massorétique porte un impératif pluriel שִׁמְעוּ, puis une forme avec suffixe féminin singulier אָמְרֵךְ, qui peut personnifier Ammon comme une entité collective. La traduction préserve ce changement au lieu de l’effacer.
- issue: Valeur des trois occurrences de כִּי
  choice: lorsque
  alternative: parce que
  rationale: Après l’exclamation hostile, כִּי peut présenter les circonstances qui ont suscité la jubilation d’Ammon. « Lorsque » garde le lien temporel naturel sans exclure que ces événements soient aussi la cause de sa réaction.
translation_notes:
  register: Français international moderne, avec une cadence prophétique digne mais non archaïque. « Les Ammonites » privilégie la lisibilité, tandis que « maison de Juda », « sanctuaire » et « exil » maintiennent le registre biblique. Le changement du pluriel au singulier dans l’adresse est volontairement conservé d’après le texte massorétique.
