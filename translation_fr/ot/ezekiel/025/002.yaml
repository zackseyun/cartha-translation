  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל בְּנֵ֣י עַמּ֑וֹן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/002.yaml
  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: fr
  text: Fils d’homme, tourne ton visage vers les Ammonites[a] et prophétise contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les fils d’Ammon »; c’est-à-dire le peuple d’Ammon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve l’expression hébraïque caractéristique par laquelle Dieu s’adresse à Ézéchiel, tout en restant consacrée et intelligible en français biblique moderne.
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: Rend naturellement en français l’expression prophétique littérale « placer son visage », en préservant l’image du visage délibérément orienté vers une cible.
- source_word: אֶל
  choice: vers
  rationale: Garde le sens directionnel fondamental de la préposition sans anticiper la valeur hostile, explicitée ensuite par « contre eux ».
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Désigne clairement et naturellement en français le peuple d’Ammon; la forme hébraïque littérale est signalée en note.
- source_word: וְהִנָּבֵא
  choice: et prophétise
  rationale: Équivalent direct et usuel du verbe hébreu employé pour la proclamation prophétique.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Dans ce contexte d’oracle de jugement, la préposition exprime l’orientation hostile de la prophétie.
theological_decisions:
- issue: Rendu de l’ethnonyme בְּנֵי עַמּוֹן
  choice: les Ammonites
  alternative: les fils d’Ammon
  rationale: « Les Ammonites » est l’appellation française courante et ne limite pas artificiellement le peuple aux hommes; la note conserve la transparence de l’expression hébraïque.
translation_notes:
  register: Français moderne, digne et direct. L’image prophétique du visage orienté est conservée sous une forme idiomatique; le tutoiement correspond à l’adresse divine singulière.
