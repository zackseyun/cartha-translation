source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : J’étendrai ma main contre Édom, et j’en retrancherai les êtres humains et les bêtes. Je ferai d’elle une désolation ; de Témân jusqu’à Dedân[a], ils tomberont par l’épée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme « vers Dedân » exprime l’étendue géographique : de Témân jusqu’à Dedân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui préserve à la fois le titre et le nom propre sans produire l’expression ambiguë « le Seigneur SEIGNEUR ».
- source_word: וְנָטִתִי יָדִי
  choice: J’étendrai ma main
  rationale: Cette formulation conserve l’image hébraïque d’une intervention active de Dieu dans le jugement et reste naturelle en français.
- source_word: וְהִכְרַתִּי
  choice: j’en retrancherai
  rationale: « Retrancher » conserve la force et la texture de כרת, plutôt que de la généraliser par « détruire ».
- source_word: אָדָם וּבְהֵמָה
  choice: êtres humains et bêtes
  rationale: Le couple oppose les habitants humains aux animaux. « Êtres humains » exprime la portée collective de אָדָם, tandis que « bêtes » maintient le registre solennel de la formule.
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: Je la réduirai en un lieu dévasté
  rationale: La traduction garde la valeur résultative de la construction et la force nominale de חָרְבָּה, dans un français clair.
- source_word: מִתֵּימָן
  choice: de Témân
  rationale: תֵּימָן désigne ici le lieu édomite de Témân, et non simplement le sud.
- source_word: וּדְדָנֶה
  choice: jusqu’à Dedân
  rationale: La terminaison directive de דְּדָנֶה et le contexte géographique indiquent l’étendue de la dévastation en direction de Dedân.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: ils tomberont par l’épée
  rationale: Cette expression préserve l’idiome hébreu traditionnel du jugement guerrier sans expliciter davantage que le texte.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה. « Yahweh » le traite comme un nom propre, tandis que « le Seigneur » rend אֲדֹנָי ; cette solution maintient la distinction présente dans l’hébreu.
- issue: Portée du jugement contre Édom
  choice: êtres humains et bêtes sont retranchés, et le pays est dévasté
  alternative: paraphraser globalement par la destruction totale d’Édom
  rationale: Le texte distingue les habitants, les animaux et le territoire. La traduction conserve ces éléments sans définir au-delà du verset la nature ou la durée du jugement.
translation_notes:
  register: 'Français international moderne, solennel mais accessible. La syntaxe prophétique et les images du texte hébreu sont conservées sans archaïsmes inutiles. Les noms géographiques suivent une translittération française avec accents : Édom, Témân, Dedân.'
