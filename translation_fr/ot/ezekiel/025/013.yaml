- from: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : J’étendrai ma main contre Édom, et j’en retrancherai êtres humains et bêtes. Je la réduirai en un lieu dévasté ; de Témân jusqu’à Dedân[a], ils tomberont par l’épée.'
  to: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : J’étendrai ma main contre Édom, et j’en retrancherai les êtres humains et les bêtes. Je ferai d’elle une désolation ; de Témân jusqu’à Dedân[a], ils tomberont par l’épée.'
  rationale: La révision restitue la valeur nominale de « désolation », rend la coordination française plus naturelle et corrige la présentation de l’alternative géographique dans la note. Elle ne tranche pas davantage que l’hébreu l’antécédent du pluriel « ils » dans la dernière proposition.
