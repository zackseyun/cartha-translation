  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן עֲשׂ֥וֹת אֱד֛וֹם בִּ/נְקֹ֥ם נָקָ֖ם לְ/בֵ֣ית יְהוּדָ֑ה וַ/יֶּאְשְׁמ֥וּ אָשׁ֖וֹם וְ/נִקְּמ֥וּ בָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/012.yaml
  text: 'Thus says the Lord GOD: Because Edom acted in vengeance against the house of Judah[a], and became very guilty, and took vengeance on them[b],'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Parce qu’Édom a exercé une vengeance contre la maison de Juda[a], s’est rendu gravement coupable[b] et s’est vengé d’elle,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement une construction « en vengeant une vengeance », qui souligne fortement l’action de se venger.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une expression intensive formée du verbe « être coupable » et d’un mot de même racine, soulignant fortement la culpabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, conformément à la valeur propre de chacun, sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit directement le motif du jugement annoncé et conserve la force causale de l’hébreu.
- source_word: בִּנְקֹם נָקָם
  choice: s’est livré à une vengeance implacable
  rationale: L’infinitif accompagné d’un nom de même racine produit une forte insistance. Cette formulation française exprime une vengeance pleinement exercée sans calquer lourdement l’hébreu.
- source_word: לְבֵית יְהוּדָה
  choice: contre la maison de Juda
  rationale: Dans ce contexte hostile, לְ a une orientation défavorable; « maison de Juda » conserve la désignation collective et historique.
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: se rendant ainsi gravement coupable
  rationale: Le verbe אשם renforcé par une forme de même racine souligne fortement la culpabilité. Le participe relie naturellement cette culpabilité à l’acte de vengeance.
- source_word: וְנִקְּמוּ בָהֶם
  choice: lorsqu’il s’est vengé d’elle
  rationale: Le niphal exprime ici l’action réflexive de se venger. Les pronoms collectifs renvoient à Édom et à la maison de Juda, respectivement.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu associe le titre אֲדֹנָי au nom propre יהוה. « Le Seigneur Yahweh » préserve cette distinction et rend explicitement le nom divin.
- issue: Rapport entre la culpabilité d’Édom et sa vengeance
  choice: se rendant ainsi gravement coupable lorsqu’il s’est vengé d’elle
  alternative: ils se sont rendus très coupables et se sont vengés d’eux
  rationale: La formulation retenue restitue l’enchaînement des propositions et clarifie leurs référents grammaticaux sans atténuer l’insistance hébraïque sur la culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque tout en évitant les calques opaques; « maison de Juda » est conservé comme désignation collective. Le verset se termine par une virgule parce que la sentence se poursuit au verset suivant.
