  verdict: revise
  source_fidelity: 'Le projet rend correctement le titre divin, Édom, la maison de Juda et le motif de la vengeance. Toutefois, « implacable » ajoute une nuance non explicitée par l’hébreu, et la subordination par « lorsqu’il » modifie la succession de trois propositions coordonnées : action vengeresse, culpabilité emphatique, puis vengeance exercée.'
  naturalness: Le français est globalement fluide, mais « se rendant ainsi gravement coupable lorsqu’il s’est vengé d’elle » relie artificiellement les deux dernières propositions et réduit leur parallélisme. Une coordination simple est à la fois plus naturelle et plus proche du texte source.
  terminology: « le Seigneur Yahweh » distingue adéquatement אֲדֹנָי et יהוה. « maison de Juda » conserve utilement la désignation collective. « exercer une vengeance » rend l’intensif sans introduire l’idée interprétative d’une vengeance « implacable ».
