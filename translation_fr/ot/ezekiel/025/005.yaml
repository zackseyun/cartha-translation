base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: fr
  text: Je ferai de Rabbah un pâturage pour les chameaux[a], et des Ammonites[b] un gîte pour les troupeaux[c]. Alors vous saurez que Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une demeure pour les chameaux ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Ammon ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « un lieu où les troupeaux se couchent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai de
  rationale: Dans cette construction indiquant le nouvel usage d’un lieu, le verbe « donner » prend naturellement le sens de « faire de ».
- source_word: רַבָּה
  choice: Rabba
  rationale: Nom propre de la capitale ammonite, transcrit selon l’usage français.
- source_word: לִנְוֵה
  choice: un pâturage pour
  rationale: Le nom peut désigner une demeure ou un pâturage; la présence des chameaux favorise ici le sens pastoral.
- source_word: גְמַלִּים
  choice: les chameaux
  rationale: Équivalent direct du pluriel hébreu.
- source_word: בְּנֵי עַמּוֹן
  choice: le territoire des Ammonites
  rationale: L’expression désigne littéralement les « fils d’Ammon », c’est-à-dire les Ammonites. Puisque le parallèle annonce qu’un lieu deviendra un endroit où reposent des troupeaux, le territoire est implicitement visé; cette explicitation produit un français cohérent sans identifier le peuple lui-même à un lieu.
- source_word: לְמִרְבַּץ
  choice: un lieu de repos
  rationale: Le terme désigne un endroit où les animaux se couchent ou se reposent, sans impliquer nécessairement un enclos.
- source_word: צֹאן
  choice: les troupeaux
  rationale: Terme collectif pour le petit bétail, notamment les moutons et les chèvres.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le contexte prophétique permet de rendre la conjonction avec une nuance de conséquence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin plutôt que substitution par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin; sa transcription préserve sa fonction de nom propre.
- issue: Référent de בְּנֵי עַמּוֹן dans le parallélisme géographique
  choice: le territoire des Ammonites
  alternative: les Ammonites
  rationale: La construction parallèle décrit des terres transformées en lieux pour les animaux. L’ajout de « territoire » rend explicite la métonymie probable tout en signalant par une note la formulation hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme pastoral est conservé; « territoire » explicite sobrement la métonymie nécessaire en français.
