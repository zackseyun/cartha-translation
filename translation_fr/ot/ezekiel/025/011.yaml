  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
translation:
  language: fr
  text: Et j’exercerai des jugements en Moab, et ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְמוֹאָב
  choice: Et … en Moab
  rationale: La préposition ב marque directement le lieu ou la sphère où s’exerce l’action judiciaire. « En Moab » préserve ce sens sans expliciter davantage « contre Moab », bien que l’hostilité soit claire dans le contexte.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: j’exécuterai des jugements
  rationale: Littéralement « je ferai des jugements » ; en français, « exécuter des jugements » rend naturellement l’expression judiciaire tout en conservant le pluriel hébreu.
- source_word: וְיָדְעוּ
  choice: et ils sauront
  rationale: Le waw est conservé par « et » ; la forme verbale prend ici une valeur future dans la suite de l’annonce.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de la connaissance.
- source_word: אֲנִי יְהוָה
  choice: je suis Yahweh
  rationale: Le pronom explicite אֲנִי est conservé, ainsi que le nom divin personnel יהוה sous la forme « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, rendu par sa forme usuelle « Yahweh » afin de préserver le caractère de nom propre dans la formule de reconnaissance fréquente chez Ézéchiel.
translation_notes:
  register: Français moderne, digne et direct. La formulation conserve le parallélisme sobre de l’hébreu et sa terminologie judiciaire, sans ajouter de lien causal ou temporel explicite.
