review_pass:
  verdict: revise
  source_fidelity: La structure et le sens général sont bien rendus. Toutefois, לְמוֹרָשָׁה qualifie directement le don («comme possession / en possession») plutôt que d'exprimer explicitement le but «pour qu’ils prennent possession». Une formulation plus directe préserve mieux la syntaxe et l'image de dépossession du texte hébreu.
  naturalness: Le français est globalement clair et soutenu. «Chez toi» est naturel, mais «sur ton territoire» explicite de façon idiomatique le sens territorial de בָּךְ sans affaiblir l'image. La ponctuation après «voici» rend l'énoncé plus fluide en français moderne.
  terminology: «Les fils de l’Orient» conserve volontairement la désignation traditionnelle de בְּנֵי־קֶדֶם, sans identifier indûment ces groupes. «Campements», «demeures», «fruits» et «lait» correspondent bien aux termes hébreux et à leur registre figuré agricole.
  issues:
  - severity: low
    issue: Rendu de לְמוֹרָשָׁה
    rationale: «Pour qu’ils prennent possession de toi» transforme le complément de destination («comme possession») en proposition finale. «Comme possession» est plus proche du texte et reste naturel.
  - severity: low
    issue: Localisation de l’installation
    rationale: «Chez toi» est acceptable, mais «sur ton territoire» rend plus explicitement la portée territoriale de בָּךְ dans l'oracle contre Ammon.
