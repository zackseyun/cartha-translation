  text: לָ/כֵ֡ן הִנְ/נִי֩ נֹתְנָ֨/ךְ לִ/בְנֵי קֶ֜דֶם לְ/מֽוֹרָשָׁ֗ה וְ/יִשְּׁב֤וּ טִירֽוֹתֵי/הֶם֙ בָּ֔/ךְ וְ/נָ֥תְנוּ בָ֖/ךְ מִשְׁכְּנֵי/הֶ֑ם הֵ֚מָּה יֹאכְל֣וּ פִרְיֵ֔/ךְ וְ/הֵ֖מָּה יִשְׁתּ֥וּ חֲלָבֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: fr
  text: 'C’est pourquoi, voici : je te donne aux fils de l’Orient comme possession. Ils établiront leurs campements sur ton territoire et y placeront leurs demeures. Ce sont eux qui mangeront tes fruits et qui boiront ton lait.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: les fils de l’Orient
  rationale: Expression hébraïque désignant les peuples établis à l’est; la traduction conserve l’image familiale et la désignation géographique du texte source.
- source_word: לְמוֹרָשָׁה
  choice: pour qu’ils prennent possession de toi
  rationale: Rend l’idée d’une remise destinée à la possession, tout en produisant une formulation française naturelle.
- source_word: טִירוֹתֵיהֶם
  choice: leurs campements
  rationale: Dans ce contexte nomade ou tribal, le terme évoque des enceintes ou campements; «campements» convient mieux que «palais».
- source_word: מִשְׁכְּנֵיהֶם
  choice: leurs habitations
  rationale: Terme général désignant les lieux où ils demeureront, distingué de leurs campements.
- source_word: חֲלָבֵךְ
  choice: ton lait
  rationale: Traduction directe de la métaphore agricole, sans la réduire à une interprétation telle que «tes richesses».
theological_decisions:
- issue: Nature de l’action divine exprimée par נֹתְנָךְ
  choice: je te livre
  alternative: je te donne
  rationale: «Livrer» exprime naturellement en français le fait de remettre Ammon au pouvoir d’un autre peuple, sans ajouter de motif théologique absent du verset.
- issue: Valeur de הִנְנִי
  choice: voici
  alternative: regarde
  rationale: «Voici» est une formule française actuelle et digne qui marque solennellement l’imminence de l’action divine; «regarde» serait ici plus littéraliste et moins idiomatique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le féminin des pronoms possessifs et du complément renvoie à la collectivité apostrophée dans le contexte. La répétition emphatique de הֵמָּה est rendue par «Ce sont eux» dans la dernière phrase.
