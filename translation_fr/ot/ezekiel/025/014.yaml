source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: fr
  text: J’exercerai ma vengeance sur Édom par l’intermédiaire de mon peuple Israël[a]. Ils agiront contre Édom[b] selon ma colère et selon ma fureur, et ils connaîtront ma vengeance, déclare le Seigneur Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de mon peuple Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est général : « faire, agir ». On pourrait aussi rendre : « ils agiront envers Édom » ou, plus littéralement, « ils agiront en Édom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־נִקְמָתִי בֶּאֱדוֹם
  choice: J’exercerai ma vengeance sur Édom
  rationale: Le verbe נתן signifie littéralement « donner, mettre, placer », mais, associé à נִקְמָה, le français idiomatique demande ici « exercer sa vengeance ». « Sur Édom » conserve la portée hostile possible de la préposition ב sans ajouter une idée absente du texte.
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: par l’intermédiaire de mon peuple Israël
  rationale: L’expression signifie littéralement « par la main de mon peuple Israël ». La formulation retenue exprime clairement l’instrument humain de l’action divine tout en restant naturelle en français moderne.
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: Ils agiront contre Édom
  rationale: עשה est un verbe large, « faire, agir ». « Agir contre » conserve cette généralité et la valeur hostile de ב, sans préciser indûment qu’il s’agit d’« exécuter un jugement ».
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: selon ma colère et selon ma fureur
  rationale: La répétition de « selon » reflète les deux constructions en כ. « Colère » et « fureur » maintiennent la distinction et l’intensification entre אַף et חֵמָה.
- source_word: וְיָדְעוּ אֶת־נִקְמָתִי
  choice: et ils connaîtront ma vengeance
  rationale: La traduction conserve le verbe ידע, qui peut ici évoquer une connaissance acquise par l’expérience, sans expliciter dans le corps du texte ce que l’hébreu laisse implicite.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahvé
  rationale: נְאֻם introduit une déclaration prophétique. « Yahvé » représente le nom divin יהוה, tandis que אֲדֹנָי est rendu par « le Seigneur ».
theological_decisions:
- issue: Articulation entre la vengeance divine et l’action d’Israël
  choice: Dieu exerce sa propre vengeance par l’intermédiaire de son peuple Israël
  alternative: Attribuer l’action soit à Dieu seul sans intermédiaire humain, soit à Israël de manière indépendante
  rationale: La première personne (« ma vengeance ») affirme l’initiative divine, tandis que בְּיַד présente explicitement Israël comme l’instrument. La traduction maintient les deux niveaux d’action.
- issue: Sens de la connaissance de la vengeance divine
  choice: Conserver « ils connaîtront ma vengeance » sans identifier explicitement le référent du pluriel
  alternative: Préciser qu’Édom fera l’expérience de la vengeance de Dieu
  rationale: La forme verbale plurielle ne nomme pas expressément son sujet dans cette proposition. Le contexte suggère les Édomites, mais la traduction préserve la formulation concise et sa légère ambiguïté.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU / le Souverain Seigneur
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre יהוה et évite de masquer le nom divin sous un second titre.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu, mais les tours non idiomatiques sont rendus naturellement. Les termes forts « vengeance », « colère » et « fureur » sont maintenus sans atténuation.
