  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Voici que j’étends la main contre les Philistins, je retrancherai les Kerétiens[a] et j’anéantirai le reste du littoral.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « les Crétois ». Le terme hébreu peut désigner un peuple associé à la Crète, mais son identification demeure incertaine.'
    reason: Variante lexicale et identification historique incertaine.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre associe אֲדֹנָי au nom divin YHWH. « Le Seigneur Yahweh » distingue les deux éléments et évite le redoublement « le Seigneur, le SEIGNEUR ».
- source_word: הִנְנִי נוֹטֶה יָדִי
  choice: Voici que j’étends la main
  rationale: הִנְנִי attire l’attention sur une action divine imminente, tandis que le participe נוֹטֶה lui donne une présence vive. Cette tournure conserve le registre prophétique dans un français naturel.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple.
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le verbe כרת signifie ici « couper, retrancher » dans un contexte de jugement. « Retrancher » garde cette image sans la confondre avec le verbe suivant.
- source_word: כְּרֵתִים
  choice: les Kerétiens
  rationale: Le texte présente un ethnonyme. Sa translittération dans le texte principal préserve l’incertitude sur l’identification éventuelle de ce groupe aux Crétois.
- source_word: וְהַאֲבַדְתִּי
  choice: j’anéantirai
  rationale: À la forme causative, אבד exprime ici le fait de faire périr ou de détruire. « Anéantir » rend clairement la force du jugement annoncé.
- source_word: שְׁאֵרִית חוֹף הַיָּם
  choice: ce qui reste du littoral
  rationale: Cette formulation rend naturellement « le reste de la côte de la mer » sans attribuer au mot « reste » une valeur théologique positive absente du contexte.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu contient le nom divin YHWH. Le conserver sous la forme « Yahweh » manifeste la distinction entre le titre אֲדֹנָי et le nom propre, sans imposer une interprétation confessionnelle supplémentaire.
- issue: Identification des כְּרֵתִים
  choice: les Kerétiens dans le texte, avec « Crétois » en note
  alternative: les Crétois
  rationale: Le lien avec la Crète est plausible, mais non certain. La translittération maintient l’ambiguïté historique du terme.
translation_notes:
  register: Français international moderne, clair et solennel. La formule « Voici que » conserve la force d’interpellation prophétique sans archaïsme excessif; les deux verbes de jugement restent distincts.
