  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur DIEU : Parce que Moab et Séir disent : « Voici, la maison de Juda est comme toutes les nations »,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française traditionnelle, naturelle et proche de l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה, représenté selon la convention typographique par DIEU en petites capitales.
- source_word: הִנֵּה
  choice: Regardez !
  rationale: Rend la particule d’attention dans les paroles de Moab et de Séir avec une interjection française actuelle.
- source_word: כְּכָל הַגּוֹיִם
  choice: comme toutes les autres nations
  rationale: « autres » explicite naturellement en français la comparaison avec l’ensemble des nations sans modifier son sens.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Conserve l’expression collective et dynastique hébraïque plutôt que de la réduire au seul territoire.
theological_decisions:
- issue: Portée de l’affirmation concernant Juda
  choice: Conserver « comme toutes les autres nations »
  alternative: 'Paraphraser : « Juda n’a rien de particulier »'
  rationale: La formulation littérale préserve la tension théologique implicite entre le statut de Juda et le jugement méprisant des peuples voisins, sans l’interpréter dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief l’interjection הִנֵּה. Aucun marqueur de note n’est requis.
