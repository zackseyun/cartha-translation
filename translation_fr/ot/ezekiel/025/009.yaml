  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: fr
  text: 'C’est pourquoi, voici que je vais ouvrir le flanc de Moab[a], depuis ses villes, depuis les villes à son extrémité, l’ornement du pays[b] : Beth-Yeshimoth, Baal-Meôn et Qiryataïm[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le côté de Moab » ; littéralement « l’épaule de Moab ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la splendeur du pays » ou « la beauté du pays ».
    reason: lexical_alternative
  - marker: c
    text: Le texte hébreu présente ici une forme orthographique du nom de la ville moabite connue sous le nom de Qiryataïm.
    reason: textual_variant
lexical_decisions:
- source_word: הִנְנִי פֹתֵחַ
  choice: 'me voici : je vais ouvrir'
  rationale: 'La construction הִנְנִי suivie du participe exprime avec vivacité une action imminente. « Me voici : je vais ouvrir » conserve cette immédiateté prophétique dans un français naturel.'
- source_word: כֶּתֶף מוֹאָב
  choice: le flanc de Moab
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne ici le côté d’un territoire, considéré comme exposé ou vulnérable. « Flanc » maintient la métaphore géographique et militaire.
- source_word: מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ
  choice: en commençant par ses villes, ses villes situées à sa frontière
  rationale: Les groupes introduits par מִן indiquent le point à partir duquel le flanc est ouvert; מִקָּצֵהוּ précise que ces villes sont à l’extrémité ou à la frontière du territoire. La légère explicitation rend la relation syntaxique intelligible sans supprimer la répétition hébraïque.
- source_word: צְבִי אֶרֶץ
  choice: joyaux du pays
  rationale: צְבִי peut exprimer la beauté, la splendeur ou ce qui fait l’ornement d’un pays. Le pluriel « joyaux » rattache naturellement l’expression appositionnelle aux trois villes nommées.
- source_word: בֵּית הַיְשִׁימֹת
  choice: Beth-Yeshimoth
  rationale: Le toponyme est translittéré plutôt que traduit, avec une graphie adaptée au français.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meôn
  rationale: Le toponyme est translittéré; l’accent circonflexe aide à distinguer les voyelles dans la graphie française.
- source_word: וקריתמה
  choice: et Qiryataïm
  rationale: La forme écrite renvoie à la ville moabite connue sous le nom de Qiryataïm; la graphie choisie représente le nom hébreu en français.
