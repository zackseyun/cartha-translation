source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן מַחְאֲ/ךָ֣ יָ֔ד וְ/רַקְעֲ/ךָ֖ בְּ/רָ֑גֶל וַ/תִּשְׂמַ֤ח בְּ/כָל שָֽׁאטְ/ךָ֙ בְּ/נֶ֔פֶשׁ אֶל אַדְמַ֖ת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : Parce que tu as battu des mains et tapé du pied, et que tu t’es réjoui avec tout le mépris que tu avais dans ton âme envers la terre d’Israël,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue clairement le titre du nom propre révélé.
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit directement le motif du jugement annoncé; cette tournure conserve la force causale de l’hébreu.
- source_word: מַחְאֲךָ יָד
  choice: tu as battu des mains
  rationale: Expression française naturelle pour le geste de frapper les mains l’une contre l’autre, ici signe de joie malveillante.
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: et frappé du pied
  rationale: Conserve le singulier hébreu et exprime naturellement en français le geste énergique décrit.
- source_word: וַתִּשְׂמַח
  choice: et que tu t’es réjoui
  rationale: Rend le sens courant du verbe tout en faisant ressortir la joie prise au malheur d’Israël.
- source_word: בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  choice: de toute ton âme, avec mépris
  rationale: La syntaxe hébraïque est resserrée et peut rattacher נֶפֶשׁ à la joie ou au mépris. Le texte principal donne un français naturel sans effacer le mépris profond; la note conserve une autre analyse possible.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: aux dépens de la terre d’Israël
  rationale: Dans ce contexte hostile, אֶל dépasse la simple direction. « Aux dépens de » indique que la joie est provoquée par le malheur du pays d’Israël, sans suggérer une attaque physique directe.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » préserve le nom divin présent dans le texte hébreu, tandis que « le Seigneur » rend le titre אֲדֹנָי; cette solution évite de confondre les deux éléments.
- issue: Nature de la joie d’Ammon envers Israël
  choice: une joie accompagnée d’un mépris profond
  alternative: une simple joie au sujet de la terre d’Israël
  rationale: שָׁאט exprime explicitement le dédain ou le mépris; il faut donc préserver la portée morale de cette joie sans lui ajouter un motif doctrinal absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Battu des mains » et « frappé du pied » rendent naturellement les gestes hébreux. La phrase reste ouverte, comme dans le texte source, puisque la conséquence du motif annoncé vient au verset suivant.
