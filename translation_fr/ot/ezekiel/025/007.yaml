  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: fr
  text: 'C’est pourquoi, me voici : j’ai étendu ma main contre toi, et je te livrerai comme butin aux nations[a]. Je te retrancherai du milieu des peuples et je te ferai disparaître d’entre les pays. Je t’anéantirai, et tu sauras que je suis Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « butin » est rare ; on peut aussi comprendre : « pour être pillé par les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du grief formulé dans le contexte précédent.
- source_word: הִנְנִי
  choice: me voici
  rationale: Conserve la formule prophétique solennelle qui attire l’attention sur l’intervention imminente de Dieu.
- source_word: נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: j’étends ma main contre toi
  rationale: Préserve la métaphore hébraïque de l’intervention divine hostile; le présent français convient à l’annonce solennelle introduite par « me voici ».
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: je te livre en butin aux nations
  rationale: « Livrer en butin » exprime clairement et naturellement l’idée de remise aux conquérants portée par le terme rare בַג.
- source_word: גּוֹיִם
  choice: nations
  rationale: Désigne ici les nations étrangères au sens large.
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: Je te retrancherai du milieu des peuples
  rationale: Rend le sens d’exclusion ou d’élimination de כרת au hiphil tout en conservant la distinction entre עַמִּים et גּוֹיִם.
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: je te ferai disparaître des pays
  rationale: Exprime le causatif du hiphil et la disparition d’entre les territoires ou entités politiques, sans réduire אבד à une simple perte.
- source_word: אַשְׁמִידְךָ
  choice: Je t’anéantirai
  rationale: Conserve la forte intensification finale du jugement après les deux verbes précédents.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: et tu sauras que je suis Yahweh
  rationale: Préserve la formule de reconnaissance caractéristique d’Ézéchiel ainsi que le nom divin personnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le caractère personnel et distinctif du nom sans importer une lecture confessionnelle particulière.
- issue: Portée de l’anéantissement annoncé
  choice: Formulation directe adressée collectivement au peuple visé
  alternative: Expliciter la destruction individuelle absolue de chaque habitant
  rationale: Le singulier désigne collectivement Ammon dans le contexte. La traduction conserve la force du jugement sans préciser au-delà du texte sa portée individuelle ou métaphysique.
translation_notes:
  register: Français international moderne, soutenu mais immédiatement compréhensible. La répétition des verbes de jugement et le parallélisme « nations / peuples / pays » sont conservés. « Me voici » maintient la solennité prophétique sans recourir à l’archaïque « voici que ».
