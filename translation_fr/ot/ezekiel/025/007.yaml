  source_fidelity: 'Le jugement adressé collectivement à Ammon est correctement rendu, de même que la progression « nations / peuples / pays » et la formule finale de reconnaissance. Une légère révision des temps et de la construction rend toutefois plus explicitement la séquence du texte hébreu : l’action de tendre la main est présentée comme accomplie, suivie des conséquences annoncées.'
