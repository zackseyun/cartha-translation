  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: fr
  text: 'Et voici[a] : quand le mur s’effondrera, ne vous dira-t-on pas : « Où est l’enduit dont vous l’avez recouvert ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « regardez ». Pour « enduit », on pourrait aussi traduire « badigeon »; le mot désigne un revêtement appliqué sur un mur et, dans ce chapitre, l’image évoque un traitement de surface trompeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Cette formule attire vivement l’attention sur la scène annoncée. « Et voici » conserve cette fonction déictique dans un registre biblique digne mais encore courant.
- source_word: נָפַל
  choice: quand le mur s’effondrera
  rationale: Bien que le verbe hébreu soit morphologiquement à l’accompli, le contexte présente une situation future conduisant à la question rhétorique. Le futur français après « quand » rend naturellement cette valeur prédictive; « s’effondrer » convient à la chute d’un mur.
- source_word: הַקִּיר
  choice: le mur
  rationale: « Mur » est le sens simple et naturel de קִיר dans cette image prophétique.
- source_word: הֲלוֹא יֵאָמֵר אֲלֵיכֶם
  choice: ne vous dira-t-on pas
  rationale: La tournure interrogative négative conserve la question rhétorique qui attend une réponse affirmative. Le pronom indéfini « on » rend naturellement le passif impersonnel hébreu sans ajouter d’acteur précis.
- source_word: אַיֵּה
  choice: Où est
  rationale: Cette interrogation directe demande ce qu’est devenu l’enduit après l’effondrement du mur.
- source_word: הַטִּיחַ
  choice: l’enduit
  rationale: Le terme désigne une matière appliquée à la surface d’un mur. « Enduit » est précis et naturel en français; « badigeon » reste une possibilité interprétative dans le contexte de dissimulation.
- source_word: אֲשֶׁר טַחְתֶּם
  choice: dont vous l’avez recouvert
  rationale: Cette formulation française exprime naturellement l’application de l’enduit au mur. Le pronom « l’ » reprend le mur, objet implicite mais clair dans l’hébreu.
