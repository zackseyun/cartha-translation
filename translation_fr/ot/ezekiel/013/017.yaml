source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: fr
  text: Et toi, fils d’homme, tourne ton visage contre les filles de ton peuple qui prophétisent selon leur propre cœur[a], et prophétise contre elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression indique que leur message prophétique vient d’elles-mêmes plutôt que du SEIGNEUR.
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Expression d’adresse caractéristique du livre d’Ézéchiel; cette formulation conserve l’image hébraïque et sa force répétitive.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: tourne ton visage contre
  rationale: Rend l’image corporelle de l’hébreu dans un français naturel, tandis que « contre » exprime l’opposition propre au contexte de jugement.
- source_word: בְּנוֹת עַמְּךָ
  choice: les filles de ton peuple
  rationale: Conserve le terme familial précis de l’hébreu plutôt que de le généraliser en « femmes ».
- source_word: הַמִּתְנַבְּאוֹת
  choice: qui prophétisent
  rationale: Le participe décrit une activité en cours ou habituelle, sans ajouter explicitement qu’elle est fausse.
- source_word: מִלִּבְּהֶן
  choice: selon leur propre cœur
  rationale: « Cœur » préserve l’anthropologie hébraïque de l’intériorité, de la pensée et de l’intention; « propre » souligne que le message vient d’elles-mêmes.
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: et prophétise contre elles
  rationale: Rend directement l’impératif et la valeur hostile de עַל dans ce contexte.
theological_decisions:
- issue: Nature de l’activité prophétique de ces femmes
  choice: « qui prophétisent » sans ajouter « faussement »
  alternative: « qui prophétisent faussement » ou « qui prétendent prophétiser »
  rationale: Le contexte condamne leur activité, mais le verset la caractérise lui-même comme provenant de leur propre cœur. Ne pas ajouter « faussement » préserve la formulation et la tension du texte source.
translation_notes:
  register: Français moderne, digne et accessible. « Fils d’homme » et « filles de ton peuple » maintiennent les formulations concrètes de l’hébreu; « tourne ton visage contre » conserve l’image tout en restant compréhensible.
