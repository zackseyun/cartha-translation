base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: fr
  text: 'Parce que, oui, parce qu’ils ont égaré mon peuple en disant : « Paix ! », alors qu’il n’y a pas de paix. Quelqu’un construit un mur, et les voilà qui l’enduisent d’un enduit sans consistance[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est difficile. Il désigne un enduit défectueux ou sans cohésion ; on le rend aussi par « badigeon », « plâtre non préparé » ou « mortier non préparé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן וּבְיַעַן
  choice: Oui, parce que
  rationale: La formule causale redoublée est emphatique. « Oui, parce que » en restitue l’insistance en français naturel sans reproduire lourdement « parce que, parce que ».
- source_word: הִטְעוּ
  choice: ont égaré
  rationale: Le causatif exprime le fait de faire errer ou de détourner du bon chemin. « Ont égaré » conserve cette image et sa portée morale.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rendu direct de l’expression d’alliance, sans explicitation ajoutée.
- source_word: לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם
  choice: 'en disant : « Paix ! », alors qu’il n’y a pas de paix'
  rationale: « Paix » garde l’étendue de שָׁלוֹם dans ce contexte d’assurance mensongère, et « alors que » marque clairement le contraste circonstanciel.
- source_word: וְהוּא בֹּנֶה
  choice: Quelqu’un construit
  rationale: Le pronom singulier accompagné du participe a ici une valeur représentative ou indéfinie. « Quelqu’un » la rend naturellement.
- source_word: חַיִץ
  choice: un mur
  rationale: Le terme désigne un mur ou une cloison. Le mot général « mur » évite d’ajouter l’idée interprétative de fragilité.
- source_word: וְהִנָּם
  choice: et les voilà qui
  rationale: Cette tournure française conserve la vivacité déictique et la mise en relief de הִנֵּה avec son suffixe pluriel.
- source_word: טָחִים אֹתוֹ
  choice: l’enduisent
  rationale: Le verbe décrit l’application d’un enduit sur le mur. « Enduire » est concret, précis et idiomatique.
- source_word: תָּפֵל
  choice: d’un mauvais mortier
  rationale: Dans cette image de construction, le terme qualifie une matière impropre, sans cohésion ou mal préparée. « Mauvais mortier » reste compréhensible et préserve l’idée d’un revêtement défectueux sans imposer la lecture plus spécifique du badigeon.
theological_decisions:
- issue: Portée métaphorique du mur et de son enduit dans la dénonciation prophétique
  choice: Conserver l’image concrète du mur enduit d’un mauvais mortier sans l’expliquer dans le corps du verset.
  alternative: Expliciter le sens par « un mur fragile » ou « ils cachent ses défauts sous des mensonges ».
  rationale: L’hébreu donne d’abord l’image de construction; l’interpréter directement dans la traduction atténuerait sa force rhétorique et résoudrait ce que le texte laisse à l’auditeur.
translation_notes:
  register: Français moderne, courant et digne. « Paix ! » conserve la brièveté solennelle de l’annonce mensongère; « les voilà qui » rend l’effet vif du déictique hébreu. La ponctuation répartit les deux images tout en maintenant leur enchaînement.
