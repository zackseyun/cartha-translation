  source_fidelity: La formule causale redoublée יַעַן וּבְיַעַן demande que les deux éléments soient audibles. « Oui, parce que » conserve l’insistance, mais inverse l’enchaînement du texte. Le substantif תָּפֵל est lexicalement difficile et ne permet pas d’affirmer sans réserve « mauvais mortier » ; il désigne un enduit/plâtre défectueux ou sans cohésion, avec des rendus traditionnels tels que « badigeon » ou « mortier non préparé ».
  naturalness: « Parce que, oui, parce que » est soutenu mais naturel dans une diction prophétique et rend la reprise emphatique. « Les voilà qui l’enduisent » est vivant et idiomatique en français moderne.
  terminology: « Égaré mon peuple », « paix », « mur » et « enduisent » sont justes et conservent l’image prophétique sans la paraphraser. « Enduit sans consistance » est plus prudent que « mauvais mortier » pour le terme hébreu disputé.
  issues:
