source:
  edition: WLC
  text: לֹ֤א עֲלִיתֶם֙ בַּ/פְּרָצ֔וֹת וַ/תִּגְדְּר֥וּ גָדֵ֖ר עַל בֵּ֣ית יִשְׂרָאֵ֑ל לַ/עֲמֹ֥ד בַּ/מִּלְחָמָ֖ה בְּ/י֥וֹם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: fr
  text: Vous n’êtes pas montés dans les brèches[a] et vous n’avez pas élevé une muraille pour la maison d’Israël, afin qu’elle tienne ferme dans le combat au jour de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les trouées ». L’hébreu désigne des ouvertures dans une muraille et prolonge ainsi l’image défensive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: êtes montés
  rationale: Le verbe עלה signifie concrètement « monter ». Cette formulation conserve l’image de personnes qui gagnent les points exposés des défenses, sans la remplacer par une paraphrase abstraite.
- source_word: בַּפְּרָצוֹת
  choice: dans les brèches
  rationale: פרצות désigne des ouvertures pratiquées dans une muraille. « Brèches » maintient clairement l’imagerie militaire et défensive du verset.
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: élevé de muraille
  rationale: La construction associant un verbe et un nom de même racine souligne l’action de fortifier. « Élever une muraille » est naturel en français et rend mieux le contexte défensif que « faire une clôture ».
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: La préposition על peut ici exprimer l’intérêt ou la protection. « Pour » préserve cette portée sans imposer que la muraille soit littéralement construite tout autour d’Israël.
- source_word: לַעֲמֹד
  choice: afin qu’elle tienne ferme
  rationale: L’infinitif exprime le but. Le féminin singulier reprend collectivement « la maison d’Israël », et « tenir ferme » explicite naturellement la résistance suggérée dans le contexte du combat.
- source_word: בַּמִּלְחָמָה
  choice: dans le combat
  rationale: « Combat » convient à la confrontation envisagée et conserve la valeur définie de l’expression hébraïque sans élargir inutilement le sens à une guerre prolongée.
- source_word: בְּיוֹם יְהוָה
  choice: au jour de Yahweh
  rationale: Cette formulation conserve l’expression prophétique consacrée qui désigne le temps de l’intervention et du jugement divins.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Imagerie militaire appliquée à la responsabilité prophétique
  choice: Conserver les images concrètes des brèches, de la muraille et du combat.
  alternative: 'Paraphraser : « Vous n’avez pas protégé Israël pour qu’il survive au jugement. »'
  rationale: Le texte formule le reproche au moyen d’une métaphore de fortification. La conserver laisse au lecteur la tension entre l’image militaire et sa portée prophétique, sans intégrer une interprétation abstraite au corps du verset.
- issue: Rapport de la muraille à la maison d’Israël
  choice: « pour la maison d’Israël »
  alternative: « autour de la maison d’Israël »
  rationale: על peut évoquer une construction protectrice en faveur d’Israël sans préciser sans ambiguïté sa disposition spatiale. « Pour » évite de résoudre la préposition plus fortement que ne le fait l’hébreu.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: « le Seigneur » ou « Jéhovah »
  rationale: « Yahweh » représente directement le nom propre du texte source et le distingue d’un titre divin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe demeure concrète et solennelle; « maison d’Israël » est conservé comme désignation collective traditionnelle, tandis que « tenir ferme » rend naturellement la résistance attendue dans le combat.
