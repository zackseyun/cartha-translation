  text: וְ/כִלֵּיתִ֤י אֶת חֲמָתִ/י֙ בַּ/קִּ֔יר וּ/בַ/טָּחִ֥ים אֹת֖/וֹ תָּפֵ֑ל וְ/אֹמַ֤ר לָ/כֶם֙ אֵ֣ין הַ/קִּ֔יר וְ/אֵ֖ין הַ/טָּחִ֥ים אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: fr
  text: 'Ainsi, j’assouvirai ma fureur contre le mur et contre ceux qui l’ont enduit de badigeon[a]. Je vous dirai : « Le mur n’est plus, et ceux qui l’ont enduit ne sont plus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mortier non préparé ». Le terme hébreu peut désigner un revêtement superficiel ou de mauvaise qualité ; « badigeon » convient bien à l’image dans ce contexte.
    reason: Alternative lexicale ; elle préserve une interprétation traditionnelle sans lever l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: וְכִלֵּיתִי אֶת־חֲמָתִי
  choice: j’irai jusqu’au bout de ma fureur
  rationale: Le piel de כלה avec חמה exprime l’accomplissement complet de la fureur. Cette tournure française naturelle conserve l’idée que le jugement sera mené à son terme sans suggérer que la fureur serait littéralement détruite.
- source_word: בַּקִּיר
  choice: contre le mur
  rationale: Dans ce contexte de jugement, ב introduit la cible contre laquelle s’exerce la fureur divine ; « contre » rend clairement cette relation.
- source_word: וּבַטָּחִים אֹתוֹ
  choice: et contre ceux qui l’ont enduit
  rationale: טוח signifie enduire, crépir ou recouvrir. « Enduire » convient à la pose d’un revêtement et permet de conserver le parallélisme avec la reprise finale.
- source_word: תָּפֵל
  choice: de badigeon
  rationale: Le terme désigne ici un revêtement trompeur, superficiel ou sans valeur. « Badigeon » restitue concrètement cette image, tandis que l’autre interprétation ancienne est signalée en note.
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: Le mur n’est plus, et ceux qui l’ont enduit ne sont plus
  rationale: אֵין marque la non-existence. La répétition de « ne sont/n’est plus » préserve le parallélisme solennel entre la disparition du mur et celle de ses enduiseurs.
theological_decisions:
- issue: Portée métaphorique du mur et de son revêtement
  choice: Conserver dans le texte l’image concrète du mur enduit, sans en expliciter directement les référents.
  alternative: Remplacer ou développer l’image par une mention explicite des faux prophètes et de leurs assurances trompeuses.
  rationale: Le contexte explique la métaphore, mais ce verset formule le jugement au moyen de l’image elle-même. La conserver respecte la progression du texte et évite d’ajouter une interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Fureur » maintient la vigueur prophétique de חמה ; « j’irai jusqu’au bout de » rend idiomatiquement l’idée d’un jugement pleinement accompli. Le parallélisme de la dernière déclaration est conservé.
