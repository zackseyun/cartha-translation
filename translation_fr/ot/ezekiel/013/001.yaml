  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה précédé du waw narratif introduit l’événement de parole. En français, « la parole… fut adressée » rend naturellement la formule sans recourir à l’archaïsme « il advint ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans la formule דְבַר יְהוָה, « la parole » conserve le caractère concret de la communication divine et correspond à l’usage biblique français courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin personnel indiqué par le tétragramme, sans lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet indirect dans « me fut adressée » exprime clairement et naturellement la direction vers le prophète.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit la parole directe qui suit. « En ces termes : » remplit cette fonction idiomatiquement en français, sans transformer explicitement la forme en un verbe fini.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin YHWH. « Yahweh » le reproduit comme nom propre, tandis que « le SEIGNEUR » relève de la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure prophétique traditionnelle est conservée sous une forme naturelle; les deux-points annoncent le discours du verset suivant.
