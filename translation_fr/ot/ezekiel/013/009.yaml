revisions:
- from: Ma main se dressera contre les prophètes qui ont des visions trompeuses et prononcent des divinations mensongères. Ils ne feront pas partie du conseil de mon peuple[a], ils ne seront pas inscrits dans le registre de la maison d’Israël[b] et ils n’entreront pas sur la terre d’Israël. Alors vous saurez que je suis le Seigneur Yahweh[c].
  to: Ma main sera contre les prophètes qui voient des visions mensongères et qui pratiquent la divination mensongère. Ils ne seront pas admis au conseil de mon peuple[a], ils ne seront pas inscrits dans le registre de la maison d’Israël[b], et ils n’entreront pas dans le pays d’Israël. Alors vous saurez que je suis le Seigneur Yahweh[c].
  rationale: La révision conserve le sens et les ambiguïtés du texte hébreu, tout en améliorant l’idiome français. « Ma main sera contre » maintient l’image et l’opposition judiciaire ; « voient des visions mensongères » reflète l’activité visionnaire ; « pratiquent la divination mensongère » correspond à l’activité exprimée par קֹסְמִים. Les trois clauses d’exclusion demeurent parallèles et les notes sont ancrées aux termes auxquels elles se rapportent.
