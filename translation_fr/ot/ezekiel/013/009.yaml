  source_fidelity: 'Le sens général est fidèle : la main divine est dirigée contre les faux prophètes, et la triple exclusion est conservée. Toutefois, « se dressera contre » explicite et modifie légèrement l’image hébraïque, tandis que « prononcent des divinations » est moins exact et moins naturel que « pratiquent la divination ». « Entrer sur la terre » n’est pas idiomatique en français pour l’entrée dans un territoire.'
  naturalness: La révision emploie un français international moderne et soutenu. Elle préserve le rythme ternaire de la sentence et rend plus naturellement les formules visionnaires, divinatoires et territoriales.
  terminology: « Conseil », « registre de la maison d’Israël » et « le Seigneur Yahweh » rendent adéquatement les termes clés sans imposer une interprétation institutionnelle ou théologique. Les notes maintiennent les possibilités sémantiques réelles de סוֹד et de כְּתָב.
  issues:
  - severity: low
    issue: « Ma main se dressera contre »
    rationale: Cette expression est compréhensible, mais elle n’est pas la formulation française la plus naturelle pour l’idiome hébreu « ma main sera contre » et introduit l’image supplémentaire de se lever.
  - severity: medium
    issue: « prononcent des divinations mensongères »
    rationale: Le participe קֹסְמִים désigne l’exercice de la divination, pas principalement l’énonciation de paroles. « Pratiquent la divination mensongère » est plus exact et plus idiomatique.
  - severity: low
    issue: « n’entreront pas sur la terre d’Israël »
    rationale: En français, on entre dans un pays ou dans une terre au sens de territoire ; « dans le pays d’Israël » rend naturellement le mouvement tout en conservant le sens territorial de אַדְמָה.
