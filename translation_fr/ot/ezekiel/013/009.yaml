source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: fr
  text: Ma main sera contre les prophètes qui voient des visions mensongères et qui pratiquent la divination mensongère. Ils ne seront pas admis au conseil de mon peuple[a], ils ne seront pas inscrits dans le registre de la maison d’Israël[b], et ils n’entreront pas dans le pays d’Israël. Alors vous saurez que je suis le Seigneur Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’assemblée de mon peuple » ou « dans le cercle confidentiel de mon peuple ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le document écrit de la maison d’Israël » ou « dans les archives de la maison d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « Adonaï Yahweh », titre rendu ici par « le Seigneur Yahweh ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: Ma main se dressera contre
  rationale: L’expression hébraïque annonce l’intervention hostile et judiciaire de Dieu. Cette formulation française conserve l’image de la main tout en exprimant clairement l’opposition.
- source_word: הַחֹזִים שָׁוְא
  choice: qui ont des visions trompeuses
  rationale: Le participe חֹזִים renvoie à l’activité visionnaire, tandis que שָׁוְא désigne ici ce qui est faux, vain ou trompeur. La formulation reste naturelle en français sans réduire l’expression à un simple mensonge verbal.
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: et prononcent des divinations mensongères
  rationale: קֹסְמִים désigne ceux qui pratiquent la divination, et כָּזָב en caractérise le contenu comme mensonger. « Prononcent » convient à l’énoncé d’oracles divinatoires.
- source_word: בְּסוֹד עַמִּי
  choice: du conseil de mon peuple
  rationale: סוֹד peut désigner un cercle confidentiel, un conseil ou une assemblée intime. « Conseil » préserve l’idée d’appartenance au cercle reconnu du peuple sans imposer le sens de « secret ».
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: ils ne seront pas inscrits dans le registre de la maison d’Israël
  rationale: Le passif יִכָּתֵבוּ est rendu par « seront inscrits », et כְּתָב est compris dans son sens administratif probable de document ou registre officiel.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: ils n’entreront pas sur la terre d’Israël
  rationale: אַדְמָה signifie littéralement terre ou sol. « Sur la terre d’Israël » conserve cette nuance territoriale concrète, tandis que « entreront » exprime idiomatiquement le mouvement vers le pays.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: « Alors » rend la conséquence du jugement annoncé. Le pluriel de la forme verbale est conservé par « vous ».
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: je suis le Seigneur Yahweh
  rationale: אֲדֹנָי est rendu par « le Seigneur » et le nom divin יְהוִה par « Yahweh », ce qui distingue les deux éléments du titre composé.
theological_decisions:
- issue: Sens de l’exclusion du סוֹד du peuple
  choice: conseil de mon peuple
  alternative: assemblée de mon peuple / cercle confidentiel de mon peuple
  rationale: Le texte peut évoquer soit le conseil reconnu, soit le cercle communautaire intime. Le choix « conseil » préserve cette tension sans préciser indûment une institution particulière.
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le rendu choisi représente distinctement le titre אֲדֹנָי et le nom propre יְהוִה, sans les confondre ni produire la répétition peu naturelle « Seigneur Seigneur ».
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des trois exclusions est conservé. Les images hébraïques importantes — la main divine, le conseil, le registre et la terre — restent visibles, avec des notes pour les termes réellement ambigus.
