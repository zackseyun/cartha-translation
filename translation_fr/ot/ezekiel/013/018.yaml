  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הוֹי֩ לִֽ/מְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל כָּל אַצִּילֵ֣י יָדַ֗/י וְ/עֹשׂ֧וֹת הַ/מִּסְפָּח֛וֹת עַל רֹ֥אשׁ כָּל קוֹמָ֖ה לְ/צוֹדֵ֣ד נְפָשׁ֑וֹת הַ/נְּפָשׁוֹת֙ תְּצוֹדֵ֣דְנָה לְ/עַמִּ֔/י וּ/נְפָשׁ֖וֹת לָ/כֶ֥נָה תְחַיֶּֽינָה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: fr
  text: 'Tu diras : « Voici ce que dit le Seigneur DIEU : Malheur à celles qui cousent des bandelettes magiques à chaque poignet et qui fabriquent des voiles sur la tête de toute personne, quelle que soit sa taille, afin de prendre des vies au piège ! Prendrez-vous au piège les vies de mon peuple et préserverez-vous vos propres vies ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: bandelettes magiques
  rationale: Le terme, rare et de sens incertain, désigne ici des objets cousus liés aux pratiques occultes dénoncées dans le contexte. « Bandelettes » convient à des objets fixés aux articulations, tandis que « magiques » explicite leur fonction contextuelle sans les identifier à un objet moderne précis.
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: pour tous les poignets
  rationale: L’expression renvoie littéralement aux articulations des mains ou des bras. « Poignets » donne en français une image naturelle et cohérente avec des bandelettes cousues, tout en suivant l’interprétation traditionnelle du membre visé.
- source_word: הַמִּסְפָּחוֹת
  choice: des voiles
  rationale: Ce substantif rare désigne apparemment des pièces d’étoffe destinées à la tête. « Voiles » préserve cette image sans préciser une forme que l’hébreu ne permet pas d’établir.
- source_word: כָּל קוֹמָה
  choice: des personnes de toute taille
  rationale: Littéralement « toute hauteur/taille ». La formulation indique que les voiles sont adaptés à des personnes de différentes statures, plutôt que placés à diverses hauteurs.
- source_word: לְצוֹדֵד נְפָשׁוֹת
  choice: afin de prendre des vies au piège
  rationale: Le verbe évoque la chasse ou la capture. נֶפֶשׁ peut désigner la vie, la personne ou l’être vivant ; « vies » convient au contraste avec le fait de préserver sa propre vie et évite une lecture exclusivement immatérielle de « âmes ».
- source_word: וּנְפָשׁוֹת לָכֶנָה תְחַיֶּינָה
  choice: tout en préservant les vôtres
  rationale: Littéralement, la proposition demande si ces femmes feront vivre ou garderont en vie des vies pour elles-mêmes. La tournure française restitue le contraste entre les victimes prises au piège et leur propre sauvegarde.
theological_decisions:
- issue: Nature des objets cousus
  choice: Les qualifier de « magiques » d’après le contexte de pratiques rituelles condamnées.
  alternative: Traduire simplement « bandelettes » ou « coussinets », sans qualification.
  rationale: Le contexte immédiat présente ces objets comme des instruments servant à capturer des vies. La qualification fonctionnelle aide le lecteur moderne, sans affirmer un mécanisme occulte précis.
- issue: Sens de נְפָשׁוֹת
  choice: « vies »
  alternative: « âmes » ou « personnes »
  rationale: « Vies » maintient la polysémie concrète de נֶפֶשׁ et le jeu entre la capture des victimes et la préservation de celles qui accomplissent ces rites, sans imposer une anthropologie dualiste.
- issue: Identification des femmes visées
  choice: « celles qui » sans ajouter « prophétesses » ou « sorcières »
  alternative: « les femmes » ou « les prophétesses »
  rationale: Le féminin pluriel est explicite, mais le verset ne fournit ici aucun titre. La traduction évite donc d’introduire une catégorie doctrinale ou sociale absente de la proposition.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « le Seigneur DIEU » distingue אֲדֹנָי de יהוה selon une convention biblique lisible. Le vocabulaire conserve l’étrangeté rituelle du passage tout en évitant des termes archaïques ou une précision artificielle.
