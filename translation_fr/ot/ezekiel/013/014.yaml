    issue: « au milieu de ses décombres »
    rationale: Le texte hébreu dit littéralement « en son milieu » avec un suffixe féminin renvoyant au mur. La mention des « décombres » est une explicitation narrative non exprimée et réduit l’ambiguïté de l’image.
  - severity: low
    issue: Note b interprétative
    rationale: La note explique le texte par « au milieu du mur lorsqu’il s’écroulera » et soutient l’ajout de « décombres » plutôt que de signaler sobrement la formulation hébraïque. Elle devient inutile une fois l’expression source préservée dans le texte.
