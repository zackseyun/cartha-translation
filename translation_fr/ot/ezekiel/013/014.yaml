source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Je démolirai le mur que vous avez enduit de badigeon[a], et je le ferai tomber à terre, de sorte que ses fondations seront mises à nu. Il s’écroulera, et vous périrez en son sein. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un enduit de mauvaise qualité ». Le terme hébreu peut désigner un revêtement trompeur ou sans consistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: Je démolirai
  rationale: Le verbe הרס désigne la destruction ou la démolition d’un ouvrage. « Démolirai » convient naturellement à un mur et exprime clairement l’action annoncée.
- source_word: אֶת הַקִּיר
  choice: le mur
  rationale: קִיר désigne concrètement un mur. L’image matérielle est conservée sans en expliciter dans le verset la portée symbolique.
- source_word: אֲשֶׁר טַחְתֶּם תָּפֵל
  choice: que vous avez enduit de badigeon[a]
  rationale: טח décrit l’application d’un enduit, tandis que תָּפֵל évoque ici un revêtement sans valeur ou trompeur. « Badigeon » rend bien l’idée d’une couche superficielle, tout en signalant en note l’autre compréhension possible.
- source_word: וְהִגַּעְתִּיהוּ אֶל הָאָרֶץ
  choice: et je le ferai tomber à terre
  rationale: Le hiphil de נגע avec אֶל הָאָרֶץ exprime le fait de faire parvenir le mur jusqu’au sol. Cette formulation française transmet naturellement sa destruction complète.
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: de sorte que ses fondations seront mises à nu
  rationale: Le nifal de גלה exprime ici la mise au jour. Le singulier collectif hébreu « sa fondation » est rendu naturellement en français par « ses fondations ».
- source_word: וְנָפְלָה
  choice: Il s’écroulera
  rationale: Le verbe féminin singulier renvoie au mur. « S’écroulera » est plus précis et idiomatique que « tombera » dans le contexte de l’effondrement d’un mur.
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: et vous périrez au milieu de ses décombres[b]
  rationale: כלה exprime ici la disparition sous le jugement. Le suffixe féminin de בְּתוֹכָהּ renvoie grammaticalement au mur, mais « en son milieu » serait obscur en français après son effondrement; « au milieu de ses décombres » explicite sobrement la scène, avec une note indiquant la formulation littérale.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Alors vous saurez que je suis Yahweh
  rationale: La formule de reconnaissance récurrente d’Ézéchiel est conservée. « Alors » exprime la conséquence contextuelle, et le tétragramme est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Référent de בְּתוֹכָהּ
  choice: au milieu de ses décombres
  alternative: en son milieu / à l’intérieur de lui
  rationale: Le suffixe renvoie grammaticalement au mur, sans préciser expressément les décombres. Le français choisi rend intelligible la mort causée par son effondrement, tandis que la note préserve la forme plus littérale et l’ambiguïté de l’image.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe suit la progression du texte hébreu tout en évitant des tournures artificielles. Les notes préservent l’alternative lexicale de תָּפֵל et la formulation spatiale de בְּתוֹכָהּ.
