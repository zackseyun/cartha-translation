  to: Je démolirai le mur que vous avez enduit de badigeon[a], et je le ferai tomber à terre, de sorte que ses fondations seront mises à nu. Il s’écroulera, et vous périrez en son sein. Alors vous saurez que je suis Yahweh.
  rationale: La révision remplace l’ajout interprétatif « au milieu de ses décombres » par « en son sein », qui maintient le référent féminin du mur et la force spatiale de l’hébreu sans préciser un scénario non formulé. La note b est retirée, car elle n’est plus nécessaire et risquait de surinterpréter l’image.
