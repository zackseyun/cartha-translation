source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : Parce que vous avez dit des paroles mensongères et eu des visions trompeuses, c’est pourquoi, me voici contre vous — déclaration du Seigneur Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi / à cause de cela
  rationale: Les deux occurrences structurent l’oracle en marquant d’abord l’introduction de la sentence, puis sa conséquence. La variation française évite une répétition pesante sans effacer le lien causal.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule naturelle et actuelle qui conserve la fonction solennelle de la formule prophétique de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et évite l’expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit clairement le motif de la sentence divine.
- source_word: דַּבֶּרְכֶם שָׁוְא
  choice: vous avez proféré des paroles vaines
  rationale: Le verbe « proférer » convient à une parole solennelle mais coupable; « paroles vaines » conserve la portée de שָׁוְא, qui peut évoquer le vide, la fausseté ou l’inanité, sans la réduire au seul mensonge.
- source_word: וַחֲזִיתֶם כָּזָב
  choice: vos visions étaient mensongères
  rationale: Rend explicitement le contexte visionnaire de חזה tout en présentant כָּזָב comme la qualité trompeuse du contenu vu, sans remplacer le langage de vision par « prophétiser ».
- source_word: הִנְנִי אֲלֵיכֶם
  choice: me voici contre vous
  rationale: Préserve la formule emphatique de présence et d’opposition divine, dans un français digne et intelligible.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Reproduit la formule prophétique d’authentification et son autorité sans l’alourdir par « oracle ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom divin. « Yahweh » maintient cette distinction et représente directement le tétragramme, tandis que « DIEU » suivrait une convention typographique traditionnelle plutôt que la forme du texte source.
- issue: Portée de שָׁוְא
  choice: paroles vaines
  alternative: mensonge / fausseté
  rationale: Le terme peut désigner le vide, l’inanité, la fausseté ou ce qui ne vaut rien. Le choix retenu conserve cette amplitude, tandis que la proposition parallèle qualifie déjà les visions de mensongères.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes. La répétition causale de לָכֵן est maintenue sous deux formulations idiomatiques. Le tiret met en relief la formule finale d’authentification.
