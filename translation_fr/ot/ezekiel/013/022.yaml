  variant: modern international French
source:
  edition: WLC
  text: יַ֣עַן הַכְא֤וֹת לֵב צַדִּיק֙ שֶׁ֔קֶר וַ/אֲנִ֖י לֹ֣א הִכְאַבְתִּ֑י/ו וּ/לְ/חַזֵּק֙ יְדֵ֣י רָשָׁ֔ע לְ/בִלְתִּי שׁ֛וּב מִ/דַּרְכּ֥/וֹ הָ/רָ֖ע לְ/הַחֲיֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: fr
  text: Parce que vous avez attristé le cœur du juste par des mensonges[a], alors que moi, je ne lui avais pas causé de peine, et parce que vous avez fortifié les mains du méchant, de sorte qu’il ne se détourne pas de sa mauvaise voie pour vivre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la fausseté ». Le nom hébreu peut désigner la fausseté ou, plus concrètement, des mensonges.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour préserver sa vie ». Littéralement, « pour le faire vivre »; on peut aussi rendre « afin qu’il vive ».
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit la cause du jugement annoncé dans le contexte et conserve clairement la valeur causale de l’hébreu.
- source_word: הַכְאוֹת לֵב צַדִּיק
  choice: vous avez… découragé le juste
  rationale: Le hiphil de כאב exprime le fait de causer de la peine. En français naturel, « décourager le juste » restitue l’atteinte intérieure portée à son cœur sans la tournure peu idiomatique « décourager le cœur ».
- source_word: שֶׁקֶר
  choice: par des mensonges
  rationale: Le nom peut désigner le mensonge ou la fausseté. Le pluriel français convient à l’activité trompeuse des fausses prophétesses et la note conserve l’autre possibilité.
- source_word: וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: alors que moi, je ne lui avais pas causé de peine
  rationale: Préserve le contraste marqué par le pronom « moi » ainsi que la valeur causative du verbe et son suffixe masculin singulier.
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: et parce que vous avez fortifié les mains du méchant
  rationale: Conserve l’image hébraïque transparente de mains rendues fortes, c’est-à-dire d’un méchant encouragé ou enhardi, ainsi que le singulier collectif ou représentatif.
- source_word: לְבִלְתִּי שׁוּב מִדַּרְכּוֹ הָרָע
  choice: l’empêchant ainsi de se détourner de sa mauvaise voie
  rationale: Rend clairement le résultat de l’encouragement donné au méchant tout en conservant l’image prophétique du retour hors d’une mauvaise voie.
- source_word: לְהַחֲיֹתוֹ
  choice: pour qu’il vive
  rationale: Rend littéralement la finalité ou le résultat lié au fait de se détourner, sans préciser indûment s’il s’agit de sauver, de préserver ou de rendre la vie.
theological_decisions:
- issue: Portée de לְהַחֲיֹתוֹ
  choice: pour qu’il vive
  alternative: pour préserver sa vie
  rationale: La formulation littérale laisse ouverte la portée de la vie promise dans ce contexte de jugement et de repentance, sans imposer une lecture exclusivement temporelle ou éternelle.
- issue: Relation syntaxique de לְבִלְתִּי שׁוּב
  choice: l’empêchant ainsi de se détourner
  alternative: de sorte qu’il ne se détourne pas
  rationale: Les deux lectures expriment que l’affermissement du méchant contribue à son absence de repentance. La formulation retenue est naturelle en français sans nier sa responsabilité morale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « parce que » maintient la structure causale parallèle. L’image « fortifié les mains » est volontairement conservée; elle reste compréhensible dans le contexte. Le verset demeure syntaxiquement ouvert, puisqu’il se poursuit avec l’annonce du jugement au verset suivant.
