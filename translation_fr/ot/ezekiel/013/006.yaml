source:
  edition: WLC
  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: fr
  text: 'Ils ont eu de fausses visions et des divinations mensongères, eux qui disent : « Déclaration de Yahweh[a] ! » alors que Yahweh ne les a pas envoyés. Pourtant, ils espèrent que la parole se réalisera[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oracle de Yahweh » ou « Parole de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils attendent que la parole soit confirmée » ou « ils espèrent voir la parole s’accomplir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ
  choice: ont eu des visions
  rationale: Le verbe חזה désigne ici l’activité visionnaire des prophètes. Cette formulation française exprime naturellement l’idée d’une vision prophétique plutôt qu’une simple perception visuelle.
- source_word: שָׁוְא
  choice: fausses
  rationale: Dans cette dénonciation prophétique, le nom qualifie des visions sans vérité ni validité. « Fausses » transmet clairement cette valeur contextuelle.
- source_word: קֶסֶם כָּזָב
  choice: divinations mensongères
  rationale: קֶסֶם désigne la divination, tandis que כָּזָב en souligne le caractère faux et trompeur. Le pluriel s’accorde naturellement en français avec les actes répétés des faux prophètes.
- source_word: הָאֹמְרִים
  choice: eux qui disent
  rationale: Le participe substantivé caractérise les personnes dénoncées. « Eux qui disent » rattache clairement cette proposition au sujet tout en conservant son relief accusateur.
- source_word: נְאֻם יְהוָה
  choice: Déclaration de Yahweh
  rationale: 'La formule prophétique solennelle est conservée afin de faire ressortir l’ironie : ces prophètes revendiquent l’autorité divine sans avoir été envoyés.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: לֹא שְׁלָחָם
  choice: ne les a pas envoyés
  rationale: Cette traduction directe du parfait négatif souligne l’absence de mandat divin dont leur prétention reste actuellement entachée.
- source_word: וְיִחֲלוּ
  choice: pourtant, ils espèrent
  rationale: Le verbe יחל peut exprimer l’attente ou l’espérance. « Pourtant » rend la relation adversative suggérée par le contexte, bien que le waw hébreu soit formellement simple.
- source_word: לְקַיֵּם דָּבָר
  choice: que la parole se réalisera
  rationale: L’expression signifie littéralement faire tenir ou établir une parole, d’où l’idée contextuelle de sa confirmation ou de son accomplissement. « Se réalisera » est naturel en français et garde la référence à une parole prophétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Formule prophétique נְאֻם יְהוָה dans la bouche des faux prophètes
  choice: Déclaration de Yahweh
  alternative: Oracle de Yahweh
  rationale: 'La formule est conservée sans paraphrase pour préserver la tension du passage : ils emploient le langage d’une révélation authentique alors que Yahweh ne les a pas mandatés.'
- issue: Référent de דָּבָר
  choice: la parole
  alternative: leur parole
  rationale: L’hébreu ne porte pas de possessif explicite. « La parole » préserve cette indétermination, tandis que le contexte permet de comprendre qu’il s’agit du message qu’ils ont prononcé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le ton accusateur du passage sans archaïsme. Les deux occurrences du nom divin sont rendues de manière uniforme, et les variantes en note préservent l’étendue sémantique de la formule prophétique et de la dernière proposition.
