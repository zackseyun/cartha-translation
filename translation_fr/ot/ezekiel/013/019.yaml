source:
  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: fr
  text: 'Vous me profanez parmi mon peuple pour quelques poignées d’orge et quelques morceaux de pain[a] : vous faites mourir des personnes[b] qui ne devraient pas mourir et vous maintenez en vie des personnes qui ne devraient pas vivre, en mentant à mon peuple, qui écoute le mensonge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques bouchées de pain ». L’hébreu évoque des morceaux ou de petites portions, soulignant le caractère dérisoire de la rétribution.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des âmes » ou « des vies » dans les deux propositions. Le terme hébreu désigne ici des personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: Vous me profanez
  rationale: Le piel de חלל exprime ici la profanation de Dieu, c’est-à-dire le fait de traiter sa sainteté comme chose commune. Le présent français rend naturellement l’accusation dans ce discours prophétique, sans exclure la continuité des actes dénoncés.
- source_word: אֹתִי אֶל־עַמִּי
  choice: me profanez parmi mon peuple
  rationale: Dans ce contexte, אֶל décrit la sphère relationnelle et publique où Dieu est profané. « Parmi mon peuple » est naturel en français et conserve cette dimension communautaire.
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: pour quelques poignées d’orge
  rationale: שַׁעֲלֵי désigne de petites poignées ou quantités. « Quelques » souligne sans exagération la faiblesse dérisoire de la rétribution.
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: et quelques morceaux de pain
  rationale: פְּתֹתֵי désigne des morceaux détachés ou de petites portions. « Morceaux de pain » est clair et courant; la variante « bouchées » est signalée en note.
- source_word: לְהָמִית נְפָשׁוֹת
  choice: vous faites mourir des personnes
  rationale: Le hifil de מות a un sens causatif. נְפָשׁוֹת désigne ici des êtres humains, et non nécessairement des âmes distinguées du corps.
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: qui ne devraient pas mourir
  rationale: Le conditionnel avec « devoir » conserve la portée normative ou judiciaire de la proposition sans la réduire à une simple prédiction ni préciser indûment la question de la destinée.
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: et vous maintenez en vie des personnes
  rationale: Le piel de חיה contraste directement avec « faire mourir » et exprime ici le fait de conserver ou déclarer en vie.
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: qui ne devraient pas vivre
  rationale: Cette formulation maintient le parallélisme judiciaire avec « qui ne devraient pas mourir ».
- source_word: בְּכַזֶּבְכֶם לְעַמִּי
  choice: en mentant à mon peuple
  rationale: Le בְּ marque le moyen, tandis que לְעַמִּי indique les destinataires du mensonge. La tournure verbale française restitue clairement l’action.
- source_word: שֹׁמְעֵי כָזָב
  choice: qui écoute le mensonge
  rationale: Le participe décrit le peuple comme réceptif à la fausseté. Le singulier collectif « le mensonge » correspond au nom hébreu singulier et produit une formulation naturelle.
theological_decisions:
- issue: Sens de נְפָשׁוֹת dans ce contexte de jugement
  choice: des personnes
  alternative: des âmes; des vies
  rationale: Le mot hébreu désigne ici les êtres humains concernés par les verdicts mensongers. « Âmes » risquerait d’introduire une opposition entre corps et âme qui n’est pas exigée par le texte; « vies » serait possible, mais moins naturel comme objet direct des deux verbes parallèles.
- issue: Portée des propositions relatives sur la mort et la vie
  choice: qui ne devraient pas mourir / qui ne devraient pas vivre
  alternative: qui ne mourront pas / qui ne vivront pas; qui ne devaient pas mourir / vivre
  rationale: Le contexte dénonce des verdicts prophétiques qui inversent l’issue juste. « Devraient » préserve la tension morale et judiciaire sans transformer les propositions en simples prédictions ni imposer une doctrine précise de la prédestination.
- issue: Nature de l’action attribuée aux prophétesses
  choice: faire mourir et maintenir en vie
  alternative: annoncer la mort et la vie; condamner et absoudre
  rationale: La traduction conserve les verbes causatifs concrets du texte. Elle n’explicite pas si l’effet est physique, social, judiciaire ou produit par les oracles, ambiguïté que le contexte laisse subsister.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement pluriel « vous » correspond aux prophétesses apostrophées collectivement. Le parallélisme mort/vie est maintenu, ainsi que l’ambiguïté sur le mécanisme exact par lequel leurs mensonges produisent ces effets.
