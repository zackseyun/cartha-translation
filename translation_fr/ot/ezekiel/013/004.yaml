source:
  edition: WLC
  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: fr
  text: Tes prophètes, Israël, ont été comme des renards[a] au milieu des ruines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacals ». Le terme hébreu peut désigner plus largement un canidé sauvage semblable au renard.
    reason: Alternative lexicale liée à l’identification de l’animal.
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: comme des renards
  rationale: Le terme hébreu désigne des renards ou, plus largement, des canidés sauvages semblables; « renards » est le rendu français courant, tandis que l’autre identification possible est signalée en note.
- source_word: בָּחֳרָבוֹת
  choice: au milieu des ruines
  rationale: Le nom pluriel évoque des lieux ruinés ou dévastés. Cette formulation française rend naturellement le cadre dans lequel rôdent les animaux.
- source_word: נְבִיאֶיךָ
  choice: tes prophètes
  rationale: Le pluriel construit avec suffixe masculin singulier de deuxième personne est rendu directement, sans ajouter « faux », absent de l’hébreu.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom est conservé comme interpellation directe, encadrée de virgules en français.
- source_word: הָיוּ
  choice: ont été
  rationale: Le parfait présente cette comparaison comme un constat établi; le passé composé convient à l’accusation directement adressée à Israël.
theological_decisions:
- issue: Faut-il expliciter que les prophètes condamnés sont de faux prophètes ?
  choice: Conserver « tes prophètes » sans ajouter « faux ».
  alternative: tes faux prophètes
  rationale: Le contexte les condamne clairement, mais ce verset dit simplement « tes prophètes ». Ajouter « faux » introduirait dans le texte une précision interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. L’interpellation « Israël » conserve la force prophétique sans recourir à l’archaïsant « ô Israël ». Le passé composé suit le parfait hébreu tout en restant idiomatique.
