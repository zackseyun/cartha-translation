source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
translation:
  language: fr
  text: 'N’avez-vous pas eu une vision trompeuse et prononcé une divination mensongère[a], vous qui dites : « Oracle de Yahweh », alors que moi, je n’ai pas parlé ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vision vaine » et « une divination fausse ». Les termes hébreux évoquent à la fois le vide et la fausseté des révélations que ces prophètes prétendent avoir reçues.
    reason: Alternative lexicale préservant l’étendue sémantique de שָׁוְא et כָּזָב.
lexical_decisions:
- source_word: הֲלֹוא
  choice: N’avez-vous pas
  rationale: Conserve la force de la question rhétorique, qui appelle une réponse affirmative, dans un français naturel.
- source_word: מַחֲזֵה שָׁוְא
  choice: une vision trompeuse
  rationale: מַחֲזֶה désigne une vision, tandis que שָׁוְא peut exprimer la fausseté, le vide ou la vanité. « Trompeuse » convient au contexte de révélations prophétiques mensongères sans effacer entièrement l’idée d’illusion.
- source_word: חֲזִיתֶם
  choice: eu
  rationale: Avec « vision », le français idiomatique dit naturellement « avoir une vision ». Le parfait à la deuxième personne du pluriel est conservé.
- source_word: וּמִקְסַם כָּזָב
  choice: et prononcé une divination mensongère
  rationale: מִקְסָם désigne une divination ou un oracle divinatoire, et כָּזָב le mensonge ou la fausseté. « Prononcé » rend אֲמַרְתֶּם de façon naturelle avec ce complément.
- source_word: וְאֹמְרִים
  choice: vous qui dites
  rationale: Le participe décrit leur affirmation concomitante ou habituelle et permet de relier clairement la formule citée à ses auteurs.
- source_word: נְאֻם יְהוָה
  choice: Déclaration de Yahweh
  rationale: Rend la formule prophétique comme une assertion solennelle attribuée à Dieu, tout en évitant de la transformer en parole authentique du narrateur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin tétragrammatique plutôt que de le remplacer par un titre.
- source_word: וַאֲנִי לֹא דִבַּרְתִּי
  choice: alors que moi, je n’ai pas parlé
  rationale: Le tour adversatif et le pronom explicite marquent fortement le contraste entre leur prétention et le démenti divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans introduire un titre à sa place.
- issue: Statut de la révélation revendiquée par les prophètes
  choice: La formule « Déclaration de Yahweh » est placée dans leurs paroles, puis explicitement démentie par Dieu.
  alternative: Reformuler la citation comme une véritable déclaration divine
  rationale: La syntaxe oppose leur revendication à « moi, je n’ai pas parlé »; la traduction doit préserver cette tension polémique sans authentifier leur oracle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique et le contraste emphatique final sont conservés; « divination » maintient le vocabulaire religieux précis du texte source.
