  to: 'Dis à ceux qui le recouvrent d’un enduit fragile : « Il tombera. Il y aura une pluie torrentielle ; et vous, grêlons, vous tomberez[a], et un vent de tempête le fendra. »'
  rationale: La révision améliore l’idiome français, rend la succession des propositions sans nuance ajoutée et maintient l’ambiguïté lexicale de תָפֵל. Elle conserve l’apostrophe inhabituelle mais intentionnelle aux grêlons ainsi que le mur implicite du contexte.
