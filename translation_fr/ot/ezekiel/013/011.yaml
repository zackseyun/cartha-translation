  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: fr
  text: 'Dis à ceux qui le recouvrent d’un enduit fragile : « Il tombera. Il y aura une pluie torrentielle ; et vous, grêlons, vous tomberez[a], et un vent de tempête le fendra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu interpelle directement les grêlons : « et vous, grêlons, vous tomberez ».'
    reason: preservation_of_source_emphasis
lexical_decisions:
- source_word: טָחֵי תָפֵל
  choice: ceux qui l’enduisent d’un crépi sans consistance
  rationale: טוח désigne l’action d’enduire ou de crépir, tandis que תָפֵל qualifie ici un revêtement inadéquat, trompeur ou dépourvu de solidité. « Crépi sans consistance » convient au mur fragile du contexte sans réduire nécessairement l’image à un simple blanchiment.
- source_word: וְיִפֹּל
  choice: Il tombera
  rationale: Le sujet implicite est le mur mentionné dans le contexte. La phrase brève conserve la force de l’annonce hébraïque.
- source_word: גֶּשֶׁם שׁוֹטֵף
  choice: une pluie torrentielle
  rationale: שׁוֹטֵף évoque une eau qui déborde, déferle et emporte. « Pluie torrentielle » exprime naturellement en français son intensité et sa puissance destructrice.
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  choice: et vous, grêlons, vous tomberez
  rationale: Le pronom féminin pluriel indépendant interpelle directement les grêlons. La reprise « vous… vous » restitue cette apostrophe emphatique et vive.
- source_word: אַבְנֵי אֶלְגָּבִישׁ
  choice: grêlons
  rationale: L’expression, littéralement proche de « pierres de grêle », désigne naturellement de gros éléments de grêle dans cette scène de jugement météorologique.
- source_word: רוּחַ סְעָרוֹת
  choice: un vent de tempête
  rationale: La formulation garde explicitement les deux éléments de l’hébreu, le vent et la tempête, dans un français courant et digne.
- source_word: תְּבַקֵּעַ
  choice: le fendra
  rationale: Le piel de בקע exprime l’action de fendre ou d’ouvrir par rupture. Le pronom explicite renvoie au mur sous-entendu par le contexte.
- source_word: הָיָה
  choice: surviendra
  rationale: Dans cette annonce prophétique, le verbe introduit la venue effective de la pluie. « Surviendra » rend l’irruption annoncée plus naturellement qu’un calque de « être ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et solennel. L’apostrophe aux grêlons est conservée malgré son caractère inhabituel, car elle appartient à la vigueur poétique de l’hébreu. « Crépi sans consistance » privilégie l’image structurelle du contexte ; « badigeon » ou « enduit trompeur » restent des possibilités lexicales.
