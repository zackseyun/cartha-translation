id: EZK.13.23
reference: Ezekiel 13:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: fr
  text: C’est pourquoi vous ne verrez plus de visions illusoires et vous ne pratiquerez plus la divination. J’arracherai mon peuple à votre pouvoir, et vous saurez que je suis le SEIGNEUR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: visions illusoires
  rationale: Le nom désigne ici ce qui est vain, mensonger ou sans réalité; avec le verbe «voir», «visions illusoires» rend naturellement l’idée sans réduire nécessairement le terme à un mensonge conscient.
- source_word: קֶסֶם / תִקְסַמְנָה
  choice: pratiquerez … la divination
  rationale: Rend le nom et le verbe apparentés par une expression française idiomatique qui désigne la recherche occulte de présages ou de révélations.
- source_word: מִיַּדְכֶן
  choice: à votre pouvoir
  rationale: Littéralement «de votre main»; dans ce contexte, la main exprime l’emprise exercée sur le peuple.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme, avec les petites capitales signalées ici par les capitales.
theological_decisions:
- issue: Nature des visions condamnées
  choice: visions illusoires
  alternative: fausses visions
  rationale: L’hébreu שָׁוְא peut évoquer la fausseté, mais aussi la vanité ou l’irréalité. «Illusoires» préserve mieux cette amplitude sans innocenter les prophétesses dans le contexte.
- issue: Formule de reconnaissance divine
  choice: vous saurez que je suis le SEIGNEUR
  alternative: vous reconnaîtrez que moi, je suis YHWH
  rationale: La formulation retenue reste naturelle et solennelle tout en conservant la formule théologique récurrente d’Ézéchiel.
translation_notes:
  register: Français moderne, direct et digne. Les formes verbales hébraïques sont au féminin pluriel; le français «vous» conserve cette référence par le contexte sans alourdir le verset. «J’arracherai» communique la force du hiphil de נצל, tandis que «à votre pouvoir» explicite l’idiome de la main.
