  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur DIEU : Voici, je suis contre vos bandelettes magiques[a], avec lesquelles vous prenez là des personnes au piège pour les faire s’envoler[b]. Je les arracherai de vos bras et je libérerai les personnes[c] que vous prenez au piège pour les faire s’envoler[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coussins », « amulettes » ou « bracelets ». Le terme hébreu est rare, et l’objet rituel précis qu’il désigne est incertain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, une forme liée à « s’envoler » ; on peut aussi comprendre « celles qui s’envolent ». L’hébreu semble employer une image de chasse aux oiseaux, mais sa formulation est difficile.
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « âmes » ou « vies » ; il s’agit ici de personnes considérées comme des êtres vivants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Cette forme française distingue le titre אֲדֹנָי du nom divin יהוה, rendu ici par « DIEU » en capitales afin d’éviter la répétition « Seigneur SEIGNEUR ».
- source_word: הִנְנִי אֶל
  choice: Je m’en prends à
  rationale: L’expression annonce l’intervention hostile de Dieu. Cette formulation française actuelle exprime clairement l’opposition, sans ajouter de contenu.
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: vos bandelettes magiques
  rationale: Le nom est rare et son référent exact demeure incertain. Le contexte évoque des objets rituels portés aux bras ; « bandelettes magiques » communique leur fonction probable tout en signalant les autres possibilités en note.
- source_word: מְצֹדְדוֹת
  choice: vous prenez au piège
  rationale: Le verbe appartient au champ de la chasse et de la capture. « Prendre au piège » convient à la fois aux personnes visées et à l’image d’oiseaux capturés.
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: des vies / ces vies
  rationale: נֶפֶשׁ désigne ici des personnes en tant qu’êtres vivants menacés. « Vies » conserve la dimension concrète du terme sans imposer la notion plus étroite d’une âme immatérielle.
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: comme des oiseaux
  rationale: Les formes de פרח évoquent l’envol, mais leur syntaxe est difficile. Dans ce contexte de chasse, « comme des oiseaux » rend intelligible l’image aviaire sans prétendre lever entièrement l’obscurité du texte.
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: Je les arracherai de vos bras
  rationale: La formulation garde la violence du verbe קרע et identifie naturellement les objets rituels comme le complément repris par « les ».
- source_word: וְשִׁלַּחְתִּי
  choice: je libérerai
  rationale: Dans ce contexte de capture, le verbe exprime la remise en liberté des personnes prises au piège.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe est conservé malgré l’incertitude de son rattachement précis ; il peut renvoyer aux objets ou au cadre de l’activité rituelle.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans une scène de prédation rituelle
  choice: vies
  alternative: âmes ; personnes
  rationale: « Vies » présente les victimes comme des êtres vivants menacés et délivrés, sans introduire une définition doctrinale de l’âme que le passage n’énonce pas.
- issue: Nature des objets désignés par כִּסְּתוֹת
  choice: bandelettes magiques
  alternative: coussins ; amulettes ; bracelets
  rationale: Le contexte condamne l’usage rituel de ces objets, mais leur forme exacte reste inconnue. Le texte principal indique leur fonction probable et la note préserve l’incertitude lexicale.
translation_notes:
  register: Français international actuel, sobre et solennel. Le verset conserve la répétition de l’image de la capture et de l’envol ainsi que l’adverbe « là ». Les notes rendent visibles les principales incertitudes lexicales sans alourdir le texte principal.
