revisions:
- from: 'Voilà pourquoi, voici ce que dit le Seigneur DIEU : Je m’en prends à vos bandelettes magiques[a], avec lesquelles vous prenez là des vies au piège comme des oiseaux[b]. Je les arracherai de vos bras et je libérerai ces vies[c], celles que vous prenez au piège comme des oiseaux.'
  to: 'C’est pourquoi, voici ce que dit le Seigneur DIEU : Voici, je suis contre vos bandelettes magiques[a], avec lesquelles vous prenez là des personnes au piège pour les faire s’envoler[b]. Je les arracherai de vos bras et je libérerai les personnes[c] que vous prenez au piège pour les faire s’envoler[b].'
  rationale: La révision améliore le registre de l’oracle et rend plus directement l’opposition divine. Elle remplace la comparaison interprétative « comme des oiseaux » par une expression d’envol plus proche de פרח, tout en préservant l’ambiguïté syntaxique en note. « Personnes » apporte une formulation française naturelle pour נפש sans imposer le sens théologique d’« âmes » ; la note maintient les possibilités lexicales.
