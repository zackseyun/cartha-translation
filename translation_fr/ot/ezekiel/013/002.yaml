  source_fidelity: Le texte rend correctement l’adresse « Fils d’homme », la mission prophétique hostile (« contre »), la répétition prophètes/prophétisent, et l’appel final à entendre la parole de Yahweh. La formulation « de leur propre cœur » est compréhensible, mais « selon leur propre cœur » exprime plus naturellement en français l’idée hébraïque d’une prophétie tirant son origine de leur for intérieur.
