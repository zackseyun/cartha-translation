  text: בֶּן אָדָ֕ם הִנָּבֵ֛א אֶל נְבִיאֵ֥י יִשְׂרָאֵ֖ל הַ/נִּבָּאִ֑ים וְ/אָֽמַרְתָּ֙ לִ/נְבִיאֵ֣י מִ/לִּבָּ֔/ם שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: fr
  text: 'Fils d’homme, prophétise contre les prophètes d’Israël qui prophétisent, et dis à ceux qui prophétisent selon leur propre cœur[a] : « Écoutez la parole de Yahweh ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « aux prophètes de leur propre cœur ». L’expression hébraïque désigne des prophètes qui parlent selon leurs propres pensées plutôt que de la part de Yahweh.'
    reason: Précise la formulation littérale sans lui attribuer une syntaxe française inexacte et explique l’idiome hébreu.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule traditionnelle et intelligible conserve l’adresse divine caractéristique du livre d’Ézéchiel ainsi que l’image littérale de l’hébreu.
- source_word: הִנָּבֵא אֶל
  choice: prophétise contre
  rationale: Dans ce contexte de dénonciation, la préposition אֶל introduit les personnes visées par un oracle hostile ; « contre » en rend naturellement la force.
- source_word: נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים
  choice: les prophètes d’Israël qui prophétisent
  rationale: La répétition de la même racine en hébreu est conservée, et le participe exprime leur activité en cours ou caractéristique.
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: à ceux qui prophétisent de leur propre cœur
  rationale: Cette formulation française rend explicite l’activité prophétique sous-entendue tout en conservant le cœur comme source métaphorique de leur message.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif demande une attention active ; « Écoutez » est plus naturel en français actuel que le littéral « Entendez ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » préserve la formule prophétique et sa continuité biblique ; « Yahweh » transcrit le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Valeur de אֶל dans l’ordre prophétique
  choice: contre
  alternative: à
  rationale: La suite condamne les faux prophètes ; « contre » exprime la portée adversative de la mission sans ajouter un jugement étranger au contexte.
- issue: Origine du message des prophètes
  choice: ceux qui prophétisent de leur propre cœur
  alternative: les prophètes de leur cœur
  rationale: Le choix retenu communique clairement que leur message vient d’eux-mêmes et non de Yahweh, tout en gardant la métaphore hébraïque du cœur.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « prophètes… prophétisent » est volontaire afin de préserver l’insistance de l’hébreu. Le vouvoiement pluriel de « Écoutez » correspond aux prophètes interpellés.
