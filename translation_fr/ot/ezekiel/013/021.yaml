id: EZK.13.21
reference: Ezekiel 13:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: fr
  text: Je déchirerai vos bandelettes magiques[a], je délivrerai mon peuple de votre main, et ils ne seront plus entre vos mains pour servir de proie[b]. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bandelettes », « amulettes », voire « voiles » ; le terme hébreu est rare, et l’objet précis qu’il désigne reste incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour la chasse » ou « pour être capturés » ; l’expression hébraïque évoque probablement des personnes livrées à une saisie prédatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: Je déchirerai
  rationale: Le verbe קרע signifie couramment « déchirer » ou « mettre en pièces ». Le contexte suggère la destruction ou l’arrachement des objets employés par les femmes interpellées.
- source_word: מִסְפְּחֹתֵיכֶם
  choice: vos bandelettes magiques
  rationale: Le nom est rare et son référent matériel demeure incertain. « Bandelettes » évoque des objets attachés au corps, tandis que « magiques » explicite prudemment leur fonction dans le contexte des pratiques condamnées en Ézéchiel 13.18-21.
- source_word: הִצַּלְתִּי
  choice: je délivrerai
  rationale: Le verbe נצל exprime ici le fait d’arracher quelqu’un au pouvoir d’autrui. « Délivrer » convient au registre prophétique tout en restant naturel.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Traduction directe de l’expression d’appartenance עַמִּי, qui conserve sa portée relationnelle et communautaire.
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: de votre main / entre vos mains
  rationale: La « main » représente le pouvoir ou l’emprise. Le maintien de cette image et de sa répétition respecte l’hébreu; « entre vos mains » est idiomatique en français pour la seconde occurrence.
- source_word: לִמְצוּדָה
  choice: comme une proie
  rationale: Le terme מצודה peut relever du filet, de la chasse ou de la capture. Dans cette phrase, « comme une proie » exprime clairement la situation de personnes livrées à une emprise prédatrice, sans imposer un objet précis.
- source_word: וִידַעְתֶּן
  choice: Alors vous saurez
  rationale: Le waw suivi du parfait peut marquer ici la conséquence de l’intervention annoncée. « Alors » rend naturellement ce rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement et le distingue d’un simple titre.
- issue: Caractérisation des objets employés par les femmes
  choice: bandelettes magiques
  alternative: bandelettes; amulettes; voiles
  rationale: Le contexte associe ces objets à des pratiques de manipulation et de divination, mais le nom hébreu rare ne permet pas d’en déterminer exactement la forme. Le texte principal indique leur fonction probable, tandis que la note maintient l’incertitude matérielle.
- issue: Image de la capture en לִמְצוּדָה
  choice: comme une proie
  alternative: pour la chasse; pour être capturés; comme dans un filet
  rationale: Cette formulation rend l’emprise prédatrice dénoncée par le passage sans trancher abusivement entre les diverses nuances possibles du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et les images concrètes de l’hébreu. Le pronom « ils » reprend collectivement « mon peuple », conformément à l’usage français qui vise les membres du peuple; les formes hébraïques de la seconde personne s’adressent à des femmes, distinction que le français pluriel « vous » ne marque pas.
