  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Je déchaînerai un vent de tempête dans ma fureur[a] ; une pluie torrentielle tombera dans ma colère, et des grêlons s’abattront dans ma fureur, pour une destruction totale.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je fendrai un vent de tempêtes » ; l’expression signifie que Dieu fait éclater un vent violent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui évite la répétition artificielle « Seigneur SEIGNEUR » tout en conservant le nom propre.
- source_word: וּבִקַּעְתִּי רוּחַ סְעָרוֹת
  choice: Je déchaînerai un vent de tempête
  rationale: בקע signifie littéralement fendre ou ouvrir par rupture. Avec le vent pour objet, « déchaîner » exprime naturellement le fait que Dieu le fait éclater avec violence, tandis que « vent de tempête » rend l’intensité de la construction hébraïque.
- source_word: בַּחֲמָתִי
  choice: dans ma fureur
  rationale: חֵמָה évoque une colère ardente et intense ; « fureur » convient au registre prophétique du jugement.
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: une pluie torrentielle
  rationale: שֹׁטֵף désigne ce qui déborde ou emporte tout. « Pluie torrentielle » restitue clairement la violence destructrice de l’image.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: אַף signifie littéralement « nez » mais désigne idiomatiquement la colère ; la formulation française en donne le sens naturel.
- source_word: אַבְנֵי אֶלְגָּבִישׁ
  choice: des grêlons
  rationale: La locution désigne des pierres de grêle ; « grêlons » est l’équivalent français courant et direct.
- source_word: בְּחֵמָה לְכָלָה
  choice: avec fureur pour tout détruire
  rationale: La préposition לְ marque ici la finalité ou le résultat, et כָּלָה l’anéantissement complet. « Pour tout détruire » rend cette visée de façon concise et idiomatique.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom divin, tandis que « le Seigneur » rend אֲדֹנָי et maintient la distinction des deux éléments.
- issue: Portée de לְכָלָה
  choice: pour tout détruire
  alternative: jusqu’à l’anéantissement
  rationale: La traduction conserve la force totale du terme sans préciser au-delà du texte l’objet exact de la destruction, fourni par le contexte immédiat.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme ternaire de la tempête, de la pluie et de la grêle est conservé, ainsi que l’accumulation des termes exprimant la colère divine.
