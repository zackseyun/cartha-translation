    issue: Portée de la dernière expression « avec fureur pour tout détruire »
    rationale: בְּחֵמָה est ici, comme la première occurrence apparentée, la fureur divine ; « avec fureur » peut laisser entendre que les grêlons agissent eux-mêmes avec fureur. De plus, לְכָלָה exprime la finalité de destruction complète plutôt que nécessairement « détruire tout ».
