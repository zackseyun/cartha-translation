  terminology: « le Seigneur Yahweh » rend correctement le couple אַדֹנָי יְהוִה en distinguant le titre et le nom divin. « Fureur », « colère », « pluie torrentielle » et « grêlons » conviennent au registre prophétique et au vocabulaire français contemporain.
  issues:
