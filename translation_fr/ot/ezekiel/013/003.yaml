source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ה֖וֹי עַל הַ/נְּבִיאִ֣ים הַ/נְּבָלִ֑ים אֲשֶׁ֥ר הֹלְכִ֛ים אַחַ֥ר רוּחָ֖/ם וּ/לְ/בִלְתִּ֥י רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Malheur aux prophètes insensés, qui suivent leur propre esprit sans avoir rien vu !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule solennelle et naturelle en français pour introduire un oracle prophétique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente le nom divin יהוה et maintient la distinction entre le titre et le nom.
- source_word: הוֹי עַל
  choice: Malheur à
  rationale: Rend la force de dénonciation et de jugement de l’interjection prophétique הוֹי suivie de עַל.
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: les prophètes insensés
  rationale: נָבָל désigne ici une folie morale et spirituelle, non un simple manque d’intelligence ; « insensés » convient au registre prophétique.
- source_word: הֹלְכִים אַחַר רוּחָם
  choice: qui suivent leur propre esprit
  rationale: L’expression « aller derrière » signifie « suivre ». « Leur propre esprit » conserve la polysémie de רוּחַ tout en évoquant une impulsion ou inspiration qui vient d’eux-mêmes.
- source_word: וּלְבִלְתִּי רָאוּ
  choice: sans avoir rien vu
  rationale: Cette tournure exprime naturellement qu’ils prétendent prophétiser alors qu’ils n’ont reçu aucune vision ; elle conserve le verbe de perception « voir ».
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La translittération « Yahweh » rend explicitement le nom divin et préserve la construction hébraïque titre plus nom, sans confondre יהוה avec un second titre.
- issue: Nature de l’« esprit » suivi par les prophètes
  choice: leur propre esprit
  alternative: leur propre inspiration
  rationale: Le choix littéral préserve la portée de רוּחַ et l’ambiguïté entre disposition intérieure, impulsion et prétendue inspiration, sans surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique reste solennelle ; « insensés » marque la faute morale et spirituelle. Aucun appel de note n’est nécessaire.
