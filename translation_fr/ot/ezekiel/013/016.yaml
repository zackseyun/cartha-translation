source:
  edition: WLC
  text: נְבִיאֵ֣י יִשְׂרָאֵ֗ל הַֽ/נִבְּאִים֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַ/חֹזִ֥ים לָ֖/הּ חֲז֣וֹן שָׁלֹ֑ם וְ/אֵ֣ין שָׁלֹ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: fr
  text: les prophètes d’Israël qui prophétisent au sujet de Jérusalem et qui ont pour elle une vision de paix[a], alors qu’il n’y a pas de paix, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vision de bien-être » ; le mot hébreu shalom peut englober la paix, l’intégrité et le bien-être.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: les prophètes d’Israël
  rationale: Le groupe construit désigne naturellement les prophètes associés à Israël; l’article défini convient en français.
- source_word: הַנִּבְּאִים אֶל יְרוּשָׁלַםִ
  choice: qui prophétisent au sujet de Jérusalem
  rationale: Le participe décrit leur activité caractéristique et continue. Avec le verbe « prophétiser », « au sujet de » exprime ici naturellement la portée de אֶל sans imposer l’idée hostile de « contre ».
- source_word: וְהַחֹזִים לָהּ
  choice: et qui voient pour elle
  rationale: Le verbe חזה appartient au vocabulaire de la vision prophétique; « pour elle » conserve le pronom féminin renvoyant à Jérusalem et la nuance du datif.
- source_word: חֲזוֹן שָׁלוֹם
  choice: une vision de paix
  rationale: Cette formulation conserve le terme « vision » et la répétition rhétorique de « paix » dans la proposition suivante.
- source_word: וְאֵין שָׁלוֹם
  choice: alors qu’il n’y a pas de paix
  rationale: La tournure marque clairement le contraste entre la vision annoncée et la réalité, tout en restant proche de la construction hébraïque.
- source_word: נְאֻם
  choice: déclare
  rationale: Équivalent français courant et digne de la formule prophétique introduisant l’autorité de la parole divine.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה, sans produire la répétition « Seigneur Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin après אֲדֹנָי. « Le Seigneur Yahweh » distingue le titre du nom propre et préserve cette donnée du texte source.
- issue: Étendue sémantique de שָׁלוֹם
  choice: paix, avec une note signalant le bien-être
  alternative: bien-être
  rationale: « Paix » maintient la répétition et le contraste voulus par le verset, tandis que la note préserve l’étendue sémantique plus large de שָׁלוֹם.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure fragmentaire du verset, qui clôt la dénonciation commencée dans le contexte précédent, ainsi que la personnification féminine de Jérusalem dans « pour elle ».
