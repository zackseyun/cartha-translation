source:
  edition: WLC
  text: וְ/נָתַתָּ֨ה עָלֶ֜י/הָ מָצ֗וֹר וּ/בָנִ֤יתָ עָלֶ֨י/הָ֙ דָּיֵ֔ק וְ/שָׁפַכְתָּ֥ עָלֶ֖י/הָ סֹֽלְלָ֑ה וְ/נָתַתָּ֨ה עָלֶ֧י/הָ מַחֲנ֛וֹת וְ/שִׂים עָלֶ֥י/הָ כָּרִ֖ים סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: fr
  text: Assiège-la, construis contre elle un ouvrage de siège[a], élève contre elle une rampe, établis des camps contre elle et dispose tout autour d’elle des béliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une tour de siège »; le terme hébreu désigne une construction de siège, mais sa forme exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצוֹר
  choice: le siège
  rationale: Le nom désigne ici l’opération d’encerclement militaire; « mettre le siège devant » restitue naturellement l’instruction symbolique et distingue le siège des ouvrages énumérés ensuite.
- source_word: דָּיֵק
  choice: un ouvrage de siège
  rationale: Le terme désigne une construction militaire élevée contre une ville, sans permettre d’en préciser sûrement la forme; cette formulation conserve cette généralité.
- source_word: סֹלְלָה
  choice: une rampe
  rationale: Il s’agit d’un remblai accumulé pour approcher ou attaquer la muraille; « rampe » est précis et courant dans ce contexte.
- source_word: מַחֲנוֹת
  choice: des camps
  rationale: Le pluriel renvoie aux campements militaires disposés contre la ville représentée.
- source_word: כָּרִים
  choice: des béliers
  rationale: Dans ce contexte de siège, le mot désigne nécessairement des béliers servant à battre les fortifications.
- source_word: עָלֶיהָ
  choice: devant elle / contre elle / autour d’elle
  rationale: La préposition répétée indique que chaque action est dirigée vers la ville; le français exige une légère variation idiomatique selon le verbe, sans modifier la relation hostile.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend explicitement l’idée d’encerclement complet.
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְשִׂים
  choice: mets / construis / élève / établis / dispose
  rationale: La série d’impératifs est conservée par des verbes concrets et naturels en français; « élève » rend idiomatiquement l’accumulation du remblai exprimée par שׁפך.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La succession des impératifs et la répétition de « contre elle » préservent le rythme concret des préparatifs du siège, tandis que « ouvrage de siège » maintient l’incertitude lexicale de דָּיֵק.
