  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ הִנְ/נִ֨י שֹׁבֵ֤ר מַטֵּה לֶ֨חֶם֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/אָכְלוּ לֶ֥חֶם בְּ/מִשְׁקָ֖ל וּ/בִ/דְאָגָ֑ה וּ/מַ֕יִם בִּ/מְשׂוּרָ֥ה וּ/בְ/שִׁמָּמ֖וֹן יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, voici que je vais briser le bâton du pain[a] à Jérusalem. Ils mangeront du pain au poids, dans l’inquiétude, et ils boiront de l’eau en quantité mesurée, dans l’effroi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « le bâton du pain » désigne ce qui assure la subsistance, notamment l’approvisionnement en pain ou en nourriture.
    reason: Explication d’un idiome hébraïque conservé dans le texte.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Expression caractéristique par laquelle Dieu s’adresse à Ézéchiel. Elle conserve l’image hébraïque et sa force solennelle sans lui attribuer ici une portée christologique.
- source_word: הִנְנִי שֹׁבֵר
  choice: voici que je vais briser
  rationale: « Voici que » rend l’insistance déictique de הִנְנִי, tandis que « je vais briser » exprime naturellement en français l’action imminente ou certaine portée par le participe.
- source_word: מַטֵּה לֶחֶם
  choice: le bâton du pain
  rationale: La métaphore hébraïque est conservée afin de présenter le pain comme un soutien vital que Dieu brise; une note en explicite le sens idiomatique.
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: Ils mangeront du pain au poids
  rationale: Cette formulation garde l’image concrète du pain pesé et rationné en période de pénurie.
- source_word: וּבִדְאָגָה
  choice: dans l’inquiétude
  rationale: דְאָגָה désigne l’anxiété ou le souci; « dans l’inquiétude » exprime clairement l’état dans lequel le pain sera consommé.
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: ils boiront de l’eau en quantité mesurée
  rationale: La formulation rend explicitement l’idée d’une eau strictement mesurée tout en restant naturelle en français moderne.
- source_word: וּבְשִׁמָּמוֹן
  choice: dans l’effroi
  rationale: שִׁמָּמוֹן peut évoquer la consternation, la stupeur ou l’horreur devant la désolation. « Dans l’effroi » préserve cette forte réaction émotionnelle sans préciser excessivement sa nuance.
theological_decisions:
- issue: Maintien de la métaphore מַטֵּה לֶחֶם
  choice: Conserver « le bâton du pain » dans le texte et expliquer l’expression en note.
  alternative: Traduire directement par « les réserves de pain », « l’approvisionnement en pain » ou « le soutien alimentaire ».
  rationale: Le maintien de l’image rend visible le jugement divin comme rupture de ce qui soutient la vie. La note permet au lecteur de comprendre l’idiome sans effacer la métaphore prophétique.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle du verset est conservé, avec un vocabulaire accessible. « Fils d’homme » et « le bâton du pain » maintiennent les images propres au livre d’Ézéchiel; l’expression la plus opaque est expliquée en note.
