  text: וּ/מַאֲכָֽלְ/ךָ֙ אֲשֶׁ֣ר תֹּאכֲלֶ֔/נּוּ בְּ/מִשְׁק֕וֹל עֶשְׂרִ֥ים שֶׁ֖קֶל לַ/יּ֑וֹם מֵ/עֵ֥ת עַד עֵ֖ת תֹּאכֲלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: fr
  text: 'La nourriture que tu mangeras sera pesée : vingt sicles par jour[a]. Tu la mangeras de temps à autre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sicle est ici une unité de poids, et non nécessairement une pièce de monnaie.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « d’un temps à un autre » ; l’expression peut aussi désigner des temps fixés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: La nourriture que tu mangeras
  rationale: « Nourriture » rend naturellement מַאֲכָל, tandis que la proposition relative conserve la formulation et la force directive de l’hébreu.
- source_word: בְּמִשְׁקוֹל
  choice: sera pesée
  rationale: Cette formulation française naturelle exprime concrètement que la ration doit être déterminée au poids.
- source_word: עֶשְׂרִים שֶׁקֶל לַיּוֹם
  choice: vingt sicles par jour
  rationale: Le terme historique « sicle » est conservé, et « par jour » rend clairement la valeur distributive de לַיּוֹם.
- source_word: מֵעֵת עַד עֵת
  choice: à heures fixes
  rationale: Dans ce contexte de rationnement, l’expression indique vraisemblablement des moments déterminés ou des intervalles réglés; cette traduction est plus claire en français que le calque « de temps en temps ».
- source_word: תֹּאכֲלֶנּוּ
  choice: Tu la mangeras
  rationale: La reprise du verbe est maintenue afin de préserver l’insistance et le ton directif du texte hébreu.
