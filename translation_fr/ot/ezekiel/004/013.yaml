  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: fr
  text: 'Et Yahweh dit : « C’est ainsi que les Israélites mangeront leur pain impur[a], parmi les nations où je les chasserai[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souillé ». Le terme évoque particulièrement l’impureté rituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « bannirai » ; le verbe peut aussi évoquer la dispersion forcée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin de l’alliance au lieu de le remplacer par un titre.
- source_word: כָּכָה
  choice: C’est ainsi que
  rationale: Rend naturellement en français la valeur démonstrative de manière et de conséquence.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Expression collective française naturelle pour les membres du peuple d’Israël; le calque « fils d’Israël » serait ici moins idiomatique.
- source_word: לַחְמָם
  choice: leur pain
  rationale: Conserve l’image concrète du pain, essentielle au geste symbolique du contexte.
- source_word: טָמֵא
  choice: rendu impur
  rationale: Préserve la portée rituelle du terme tout en indiquant que les conditions décrites souillent le pain.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Désigne les peuples étrangers du lieu d’exil sans importer les connotations plus tardives de « païens ».
- source_word: אַדִּיחֵם
  choice: je les chasserai
  rationale: 'Exprime la force causative du verbe: Dieu les fera partir de force et les bannira.'
- source_word: שָׁם
  choice: où
  rationale: Adaptation syntaxique idiomatique de « là » après « les nations », sans modification du sens.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom propre de l’alliance.
- issue: Portée de טָמֵא
  choice: rendu impur
  alternative: souillé / impur
  rationale: Le contexte associe le pain aux catégories d’impureté rituelle et à l’exil; « rendu impur » conserve cette dimension sans la réduire à une saleté matérielle.
- issue: Expression collective בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël / le peuple d’Israël
  rationale: Le référent est l’ensemble de la nation. « Les Israélites » rend cette valeur collective en français courant sans exclure les femmes.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « C’est ainsi que » garde le lien démonstratif avec le geste symbolique précédent; « parmi les nations » maintient le cadre de l’exil.
