  source_fidelity: 'La formulation « rendu impur » introduit indûment l’idée que le pain est rendu impur à ce moment-là. טָמֵא est ici un prédicat : le pain que les Israélites mangeront sera impur au sens rituel. « Impur » rend directement cette valeur, sans expliciter un mécanisme absent du texte. Le reste rend fidèlement כָּכָה, לַחְמָם, בַּגּוֹיִם et אַדִּיחֵם. « Les Israélites » est une équivalence collective française naturelle de בְנֵי יִשְׂרָאֵל.'
