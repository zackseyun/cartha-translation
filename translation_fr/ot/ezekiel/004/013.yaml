  terminology: « Yahweh » préserve le tétragramme. « Impur » conserve la terminologie rituelle de טָמֵא; la note offre justement « souillé » comme possibilité contextuelle. « Nations » évite les connotations confessionnelles ou néotestamentaires de « païens » ou « Gentils ».
