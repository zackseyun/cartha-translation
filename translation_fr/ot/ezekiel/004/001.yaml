source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: fr
  text: 'Et toi, fils d’homme, prends une brique, place-la devant toi et grave[a] sur elle une ville : Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « inscris-y » ou « dessine-y ». Le verbe hébreu peut désigner le fait de graver ou d’inscrire ; ici, il s’agit de représenter Jérusalem sur la brique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Expression littérale et récurrente par laquelle Dieu s’adresse au prophète dans Ézéchiel; elle conserve la forme hébraïque sans la réduire à une interprétation comme « mortel ».
- source_word: לְבֵנָה
  choice: une brique
  rationale: Le nom hébreu désigne simplement une brique; « tablette d’argile » préciserait davantage que le texte source.
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: place-la devant toi
  rationale: Rend naturellement l’action de mettre l’objet en face de soi.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: grave dessus
  rationale: Le verbe חקק évoque l’action de graver ou d’inscrire; « graver » préserve son caractère concret dans le contexte d’une brique.
- source_word: עִיר אֶת יְרוּשָׁלָם
  choice: 'une ville : Jérusalem'
  rationale: Les deux éléments sont en apposition; les deux-points expriment clairement en français que la ville représentée est Jérusalem, sans transformer l’indéfini hébreu en défini.
- source_word: יְרוּשָׁלָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. L’impératif reste direct; « fils d’homme » conserve l’adresse caractéristique du livre d’Ézéchiel. Le pronom disjoint initial « toi » rend l’emphase de וְאַתָּה.
