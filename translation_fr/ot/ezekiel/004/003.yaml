base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: fr
  text: 'Et toi, prends une poêle en fer[a] et place-la comme un mur de fer entre toi et la ville. Tourne ton visage vers elle : elle sera assiégée, et toi, tu l’assiégeras. Ce sera un signe pour la maison d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaque en fer » ou « gril en fer ». Le terme hébreu désigne un ustensile métallique de cuisson, utilisé ici symboliquement comme une séparation.
    reason: Alternative lexicale
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: une poêle en fer
  rationale: מַחֲבַת désigne un ustensile de cuisson plat, probablement une poêle ou une plaque. « Poêle » est courant en français et conserve le sens culinaire avant son emploi symbolique comme obstacle.
- source_word: קִיר בַּרְזֶל
  choice: un mur de fer
  rationale: קִיר signifie normalement « mur ». Cette image concrète est maintenue plutôt que remplacée par l’explicitation « barrière ».
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: Tourne résolument ton visage vers elle
  rationale: L’expression hébraïque décrit une orientation délibérée du visage, avec une nuance de détermination. Cette formulation reste intelligible tout en conservant l’image corporelle.
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: elle sera assiégée
  rationale: מָצוֹר désigne l’état de siège. Le passif français exprime naturellement la situation de la ville.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: tu l’assiégeras
  rationale: Le verbe צור signifie ici « assiéger ». La répétition avec « assiégée » reflète le jeu verbal du texte hébreu.
- source_word: אוֹת הִיא
  choice: Ce sera un signe
  rationale: אוֹת désigne un signe symbolique. « Ce » renvoie naturellement à l’ensemble de l’action prophétique mise en scène.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: La préposition ל indique ici le destinataire ou le référent du signe. « Maison d’Israël » conserve l’expression collective et traditionnelle du texte.
theological_decisions:
- issue: Imagerie de l’action prophétique symbolique
  choice: Conserver les images concrètes du « mur de fer » et de la « maison d’Israël » sans en expliquer le sens dans le corps du verset.
  alternative: Paraphraser par « barrière de fer » et « peuple d’Israël ».
  rationale: La portée théologique dépend de l’action symbolique elle-même. Une traduction concrète laisse au contexte le soin d’en déployer le sens sans résoudre prématurément le symbole.
- issue: Agent et objet du siège
  choice: Conserver la tension entre la ville « assiégée » et l’ordre adressé au prophète de l’assiéger.
  alternative: Fusionner les deux propositions en une seule description du siège.
  rationale: La répétition hébraïque articule à la fois l’état symbolisé de la ville et la participation gestuelle du prophète; il convient de ne pas effacer cette tension.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond à l’adresse divine singulière au prophète. L’expression « tourne résolument ton visage » conserve l’idiome hébraïque tout en explicitant légèrement sa valeur de détermination.
