  text: וְ/הִנֵּ֛ה נָתַ֥תִּי עָלֶ֖י/ךָ עֲבוֹתִ֑ים וְ/לֹֽא תֵהָפֵ֤ךְ מִֽ/צִּדְּ/ךָ֙ אֶל צִדֶּ֔/ךָ עַד כַּלּוֹתְ/ךָ֖ יְמֵ֥י מְצוּרֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: fr
  text: 'Et voici : j’ai mis sur toi des cordes[a], et tu ne te retourneras pas d’un côté à l’autre jusqu’à ce que tu aies achevé les jours de ton siège.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des liens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: « Voici » conserve la fonction présentative et solennelle de l’hébreu tout en restant naturel en français biblique moderne.
- source_word: נָתַתִּי עָלֶיךָ
  choice: je mets sur toi
  rationale: Le parfait hébreu présente l’action divine comme établie ou certaine. Le présent français convient au caractère performatif de la déclaration et s’enchaîne naturellement avec l’action annoncée.
- source_word: עֲבוֹתִים
  choice: des cordes
  rationale: Le terme désigne des liens épais servant à attacher. « Cordes » est concret et courant ; « liens » serait possible mais moins matériel.
- source_word: וְלֹא תֵהָפֵךְ
  choice: et tu ne te retourneras pas
  rationale: Le niphal de הפך décrit ici le fait de changer soi-même de position. La formulation garde l’énoncé négatif direct sans ajouter explicitement une idée d’incapacité que le contexte des cordes laisse comprendre.
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: d’un côté sur l’autre
  rationale: Cette tournure française idiomatique exprime le passage d’un flanc à l’autre sans reproduire maladroitement la répétition littérale « de ton côté à ton côté ».
- source_word: עַד כַּלּוֹתְךָ יְמֵי
  choice: jusqu’à ce que tu aies achevé les jours
  rationale: La construction marque le terme de la période assignée. « Aies achevé » préserve l’idée d’accomplir entièrement le nombre de jours fixé.
- source_word: מְצוּרֶךָ
  choice: ton siège
  rationale: Le suffixe de deuxième personne est conservé. Dans le contexte, il s’agit du siège symboliquement représenté par Ézéchiel, sans que la traduction explicite davantage le référent.
theological_decisions:
- issue: Référent de « ton siège »
  choice: Conserver « ton siège », qui renvoie dans le contexte au siège qu’Ézéchiel met symboliquement en scène.
  alternative: Expliciter « le siège que tu représentes » ou comprendre un siège dirigé personnellement contre Ézéchiel.
  rationale: Le texte hébreu garde le référent implicite et emploie le suffixe « ton ». La traduction respecte cette forme sans imposer une explication interprétative dans le corps du verset.
- issue: Contrainte physique exprimée par וְלֹא תֵהָפֵךְ
  choice: 'Employer le futur négatif direct : « tu ne te retourneras pas ».'
  alternative: « Tu ne pourras pas te retourner », qui explicite l’incapacité produite par les cordes.
  rationale: La présence des cordes implique bien une contrainte, mais le verbe hébreu formule directement l’action qui n’aura pas lieu. Le français retenu préserve cette tension sans ajouter un modal absent.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la solennité prophétique tout en évitant les calques peu naturels. Le marqueur de note [a] figure immédiatement après le mot concerné.
