  to: 'Alors je dis : « Ah ! Seigneur Yahweh ! Vois : je ne me suis pas rendu impur[a]. Depuis ma jeunesse jusqu’à maintenant, je n’ai mangé ni la chair d’une bête morte[b] ni celle d’une bête mise en pièces[c], et aucune viande souillée[d] n’est entrée dans ma bouche. »'
