id: EZK.4.14
reference: Ezekiel 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: fr
  text: 'Alors je dis : « Ah ! Seigneur Yahweh ! Vois : je ne me suis pas rendu impur[a]. Depuis ma jeunesse jusqu’à maintenant, je n’ai mangé ni la chair d’une bête morte[b] ni celle d’une bête mise en pièces[c], et aucune viande souillée[d] n’est entrée dans ma bouche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ma personne n’est pas souillée » ; l’expression signifie qu’Ézéchiel ne s’est pas rendu rituellement impur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’une carcasse » ; il s’agit d’un animal mort sans avoir été convenablement abattu, notamment d’une bête morte d’elle-même.'
    reason: cultural_note
  - marker: c
    text: C’est-à-dire la chair d’un animal mis en pièces ou attaqué par une bête sauvage, interdite comme nourriture par la loi d’Israël.
    reason: cultural_note
  - marker: d
    text: 'Ou : « viande abominable » ; le mot hébreu désigne une viande devenue rituellement inadmissible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime ici la détresse et la vive protestation d’Ézéchiel. « Ah ! » reste naturel en français actuel.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה et conserve explicitement le nom d’alliance.
- source_word: הִנֵּה
  choice: Vois
  rationale: Dans cette supplication adressée à Dieu, le marqueur attire vivement l’attention sur l’affirmation qui suit. « Vois » en préserve la force sans archaïsme.
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: je ne me suis jamais rendu impur
  rationale: Littéralement, « ma personne n’est pas souillée ». נֶפֶשׁ désigne ici Ézéchiel lui-même, et la formulation française exprime son affirmation de pureté rituelle tout au long de sa vie.
- source_word: נְבֵלָה
  choice: la chair d’une bête morte
  rationale: Le nom désigne la carcasse d’un animal mort sans abattage conforme, souvent une bête morte d’elle-même. La formulation est compréhensible et convient au contexte alimentaire.
- source_word: טְרֵפָה
  choice: la chair d’une bête déchiquetée
  rationale: Le terme désigne un animal mis en pièces ou mortellement attaqué, notamment par une bête sauvage. « Déchiquetée » maintient la distinction avec une bête simplement trouvée morte.
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: Depuis ma jeunesse jusqu’à maintenant
  rationale: La formulation naturelle conserve l’insistance hébraïque sur une pratique observée durant toute la vie.
- source_word: וְלֹא בָא בְּפִי
  choice: et aucune … n’est entrée dans ma bouche
  rationale: Cette tournure garde l’image concrète de l’hébreu tout en étant claire en français.
- source_word: בְּשַׂר פִּגּוּל
  choice: viande répugnante
  rationale: פִּגּוּל qualifie une viande devenue rituellement inadmissible et, par conséquent, repoussante. Le choix conserve la force évaluative du terme sans le réduire au terme technique טָמֵא, « impur ».
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte porte le nom divin יהוה après le titre אֲדֹנָי. « Seigneur Yahweh » rend les deux éléments sans confondre le nom propre avec un simple titre.
- issue: Nature de la souillure revendiquée par Ézéchiel
  choice: Formulation centrée sur la pureté rituelle personnelle
  alternative: 'Interprétation morale générale : « je ne me suis jamais corrompu »'
  rationale: Le contexte et les aliments énumérés montrent qu’il s’agit de pureté rituelle et alimentaire, non d’une prétention générale à l’absence de péché.
- issue: Sens de פִּגּוּל
  choice: viande répugnante, avec précision en note sur son caractère rituellement inadmissible
  alternative: viande impure
  rationale: « Viande impure » serait possible, mais pourrait effacer la nuance propre de פִּגּוּל et le confondre avec le vocabulaire ordinaire de l’impureté. La note préserve l’enjeu cultuel sans imposer une définition trop étroite.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le ton de protestation respectueuse d’Ézéchiel. Les termes alimentaires sont explicités avec mesure dans le texte et les nuances juridiques ou cultuelles sont réservées aux notes.
