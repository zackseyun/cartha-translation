  - severity: medium
    issue: « viande répugnante » pour בְּשַׂר פִּגּוּל
    rationale: Le terme désigne de la viande rituellement devenue inacceptable ; « répugnante » met au premier plan le dégoût plutôt que le statut cultuel. « Viande souillée » est plus fidèle et naturel.
