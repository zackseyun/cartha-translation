  text: וַ/יֹּ֣אמֶר אֵלַ֔/י רְאֵ֗ה נָתַ֤תִּֽי לְ/ךָ֙ אֶת צפועי הַ/בָּקָ֔ר תַּ֖חַת גֶּלְלֵ֣י הָֽ/אָדָ֑ם וְ/עָשִׂ֥יתָ אֶֽת לַחְמְ/ךָ֖ עֲלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: fr
  text: 'Puis il me dit : « Vois, je te donne de la bouse de bovins à la place des excréments humains, et tu prépareras ton pain dessus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » marque naturellement la succession, et le sujet implicite renvoie à Dieu dans le contexte précédent.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif sert à attirer l’attention. « Vois » reste direct, actuel et plus proche de l’hébreu que des formulations explicatives.
- source_word: נָתַתִּי לְךָ
  choice: je te donne
  rationale: Le parfait présente ici l’octroi désormais accordé. Le présent français exprime naturellement la décision effective sans imposer une nuance temporelle trop rigide.
- source_word: צפועי הַבָּקָר
  choice: de la bouse de bovins
  rationale: L’expression désigne les déjections de bétail employées comme combustible. « Bouse » est concret et idiomatique; « de bovins » conserve la portée collective de הַבָּקָר sans la réduire aux seules vaches.
- source_word: תַּחַת
  choice: à la place de
  rationale: La préposition indique ici une substitution accordée à Ézéchiel, non une position spatiale.
- source_word: גֶּלְלֵי הָאָדָם
  choice: les excréments humains
  rationale: גֶּלְלֵי désigne des excréments, tandis que הָאָדָם renvoie ici aux êtres humains en général, par contraste avec les bovins.
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: et tu prépareras ton pain
  rationale: עשה est un verbe général, « faire » ou « préparer ». Dans ce contexte culinaire, « prépareras » demeure naturel sans préciser indûment l’étape exacte de cuisson.
- source_word: עֲלֵיהֶם
  choice: dessus
  rationale: Le suffixe hébreu est pluriel et renvoie aux déjections, mais « bouse » fonctionne comme un nom massif en français. « Dessus » rend naturellement leur emploi comme combustible sous le pain.
theological_decisions:
- issue: Portée de הָאָדָם
  choice: humains
  alternative: de l’homme
  rationale: Le mot désigne ici l’humanité ou les êtres humains en général, non un homme particulier. « Humains » préserve clairement le contraste avec les bovins.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire concret du texte est conservé sans euphémisme excessif; la syntaxe reste fluide et accessible.
