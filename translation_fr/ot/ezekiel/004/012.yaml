  text: וְ/עֻגַ֥ת שְׂעֹרִ֖ים תֹּֽאכֲלֶ֑/נָּה וְ/הִ֗יא בְּ/גֶֽלְלֵי֙ צֵאַ֣ת הָֽ/אָדָ֔ם תְּעֻגֶ֖/נָה לְ/עֵינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/012.yaml
  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: fr
  text: Tu mangeras une galette d’orge et tu la feras cuire sur des excréments humains, sous leurs yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: galette d’orge
  rationale: עֻגָּה désigne un pain plat ou une galette; « galette d’orge » est naturel en français et conserve la précision de la céréale.
- source_word: תְּעֻגֶנָּה
  choice: tu la feras cuire
  rationale: Le verbe dénominatif, dérivé de עֻגָּה, décrit la préparation ou la cuisson en galette. Cette formulation française exprime naturellement l’action sans introduire un mode de cuisson absent du texte.
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: sur des excréments humains
  rationale: La préposition בְּ peut ici marquer le moyen ou le combustible; « sur » rend la cuisson au-dessus du combustible sans suggérer que les excréments sont incorporés à la nourriture. « Excréments humains » restitue explicitement צֵאַת הָאָדָם dans un registre digne.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression idiomatique française fidèle au sens littéral « devant leurs yeux », soulignant le caractère public du geste.
theological_decisions:
- issue: Relation entre les excréments et la galette
  choice: Les excréments sont présentés comme combustible ou support de cuisson, non comme ingrédient.
  alternative: « avec des excréments humains »
  rationale: Le contexte immédiat de la cuisson et la préposition permettent de comprendre qu’il s’agit du feu alimenté par les excréments. « Sur » préserve cette lecture sans surinterpréter le contact exact.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse divine singulière à Ézéchiel. La construction « sous forme de » évite l’ambiguïté d’un pronom féminin directement repris par un nom masculin.
