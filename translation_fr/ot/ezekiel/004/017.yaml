id: EZK.4.17
reference: Ezekiel 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַ֥עַן יַחְסְר֖וּ לֶ֣חֶם וָ/מָ֑יִם וְ/נָשַׁ֨מּוּ֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/נָמַ֖קּוּ בַּ/עֲוֺנָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
translation:
  language: fr
  text: afin qu’ils manquent de pain et d’eau, que chacun et son frère soient frappés de stupeur[a] et qu’ils dépérissent dans leur iniquité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient dévastés », « soient horrifiés » ou « restent interdits ». Le verbe hébreu peut exprimer soit la désolation, soit l’état de choc qu’elle provoque.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans leur culpabilité » ou « sous le châtiment de leur iniquité ». Le mot hébreu peut désigner l’iniquité, la culpabilité ou le châtiment qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat des instructions précédentes et conserve la valeur finale de la locution hébraïque.
- source_word: יַחְסְרוּ
  choice: ils manquent
  rationale: Le verbe חסר signifie « manquer, être dépourvu ». Le présent après « afin que » exprime naturellement en français la conséquence projetée.
- source_word: לֶחֶם וָמָיִם
  choice: de pain et d’eau
  rationale: Conserve les deux éléments concrets désignant les moyens de subsistance essentiels, sans généraliser « pain » en « nourriture ».
- source_word: וְנָשַׁמּוּ
  choice: soient frappés de stupeur
  rationale: Le niphal de שמם peut décrire la désolation ou l’effarement qu’elle provoque. Avec des personnes pour sujet, cette tournure française exprime clairement leur état de choc tout en gardant la gravité du terme.
- source_word: אִישׁ וְאָחִיו
  choice: chacun et son frère
  rationale: Rend la construction distributive et conserve le langage masculin ainsi que le sens précis de « frère », sans le remplacer par « prochain ».
- source_word: וְנָמַקּוּ
  choice: qu’ils dépérissent
  rationale: מקק évoque le fait de se consumer, se décomposer ou dépérir. « Dépérir » est naturel, grave et adapté à des personnes.
- source_word: בַּעֲוֺנָם
  choice: dans leur iniquité
  rationale: Préserve la construction compacte avec ב et le champ moral de עָוֹן, sans trancher dans le texte principal entre iniquité, culpabilité et peine qui en résulte.
theological_decisions:
- issue: Langage masculin représentatif dans אִישׁ וְאָחִיו
  choice: chacun et son frère
  alternative: chacun avec son prochain
  rationale: Le texte source emploie des noms masculins singuliers dans une tournure distributive. La traduction retenue respecte cette forme et ne remplace pas « frère » par un terme plus large.
- issue: Étendue sémantique de עָוֹן
  choice: dans leur iniquité
  alternative: à cause de leur faute / sous le poids de leur culpabilité / du fait du châtiment de leur iniquité
  rationale: Le mot peut désigner la faute, la culpabilité ou les conséquences pénales de la faute. La formulation principale maintient cette tension au lieu de fixer une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La structure coordonnée et la paire concrète « pain et eau » gardent le rythme du texte hébreu. « Iniquité » appartient à un registre biblique soutenu mais demeure compréhensible; il permet surtout de préserver l’ambiguïté théologique du terme source.
