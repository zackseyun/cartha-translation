  source_fidelity: 'Le texte rend fidèlement la chaîne finale de לְמַעַן et les trois conséquences : manque de pain et d’eau, stupeur des personnes désignées de manière distributive (« chacun et son frère »), puis dépérissement. « Dans leur iniquité » conserve de façon appropriée l’ambiguïté de בַּעֲוֺנָם, sans imposer le sens de culpabilité ou de châtiment.'
