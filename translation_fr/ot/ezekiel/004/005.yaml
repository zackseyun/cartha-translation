  text: וַ/אֲנִ֗י נָתַ֤תִּֽי לְ/ךָ֙ אֶת שְׁנֵ֣י עֲוֺנָ֔/ם לְ/מִסְפַּ֣ר יָמִ֔ים שְׁלֹשׁ מֵא֥וֹת וְ/תִשְׁעִ֖ים י֑וֹם וְ/נָשָׂ֖אתָ עֲוֺ֥ן בֵּֽית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: fr
  text: 'Et moi, je t’ai assigné les années de leur faute selon le nombre des jours[a] : trois cent quatre-vingt-dix jours ; tu porteras la faute de la maison d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les années de leur culpabilité selon le nombre des jours ». Le terme hébreu traduit par « faute » peut aussi désigner la culpabilité ou le châtiment qui en résulte.
    reason: Alternative lexicale préservant l’étendue sémantique de עָוֹן et la formulation proche de l’hébreu.
lexical_decisions:
- source_word: נָתַתִּי
  choice: je t’impose
  rationale: Le verbe signifie littéralement « j’ai donné », mais il désigne ici l’attribution à Ézéchiel d’une durée contraignante dans le cadre d’un geste prophétique. « Je t’impose » exprime naturellement cette charge sans ajouter l’idée d’une simple permission.
- source_word: שְׁנֵי עֲוֺנָם
  choice: les années de leur faute
  rationale: La construction signifie littéralement « les années de leur faute ». « Faute » conserve la dimension morale de עָוֹן tout en laissant ouvertes les nuances de culpabilité et de conséquence pénale.
- source_word: לְמִסְפַּר יָמִים
  choice: en un nombre égal de jours
  rationale: La formule exprime ici la correspondance symbolique entre les années et les jours. Cette tournure rend clairement le rapport numérique indiqué par le contexte sans expliciter au-delà de l’hébreu la règle « un jour pour une année », formulée au verset suivant.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: trois cent quatre-vingt-dix jours
  rationale: Rendu direct et idiomatique du nombre cardinal suivi de « jours ».
- source_word: וְנָשָׂאתָ עֲוֺן
  choice: tu porteras la faute
  rationale: נשא avec עָוֹן forme une expression où « porter » peut concerner la faute, la culpabilité ou ses conséquences. Le rendu conserve l’image et l’ambiguïté théologique de l’hébreu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette expression traditionnelle conserve la désignation collective et nationale de l’hébreu.
theological_decisions:
- issue: Sens de עָוֹן dans le geste prophétique
  choice: « faute » dans les deux occurrences
  alternative: « culpabilité » ou « châtiment de la faute »
  rationale: עָוֹן peut désigner la faute, la culpabilité qui en découle ou sa conséquence punitive. « Faute » préserve la dimension morale sans décider si Ézéchiel porte principalement le péché, la culpabilité ou le châtiment associé.
- issue: Nature de la correspondance entre années et jours
  choice: « en un nombre égal de jours »
  alternative: « selon le nombre des jours »
  rationale: Le contexte établit une représentation des années par un nombre correspondant de jours. Le choix rend cette relation intelligible tout en laissant au verset suivant l’explication explicite du principe symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement formelle afin de conserver le ton prophétique. « Maison d’Israël » et « porter la faute » maintiennent les images bibliques sans archaïsme excessif.
