source:
  edition: WLC
  text: וְ/כִלִּיתָ֣ אֶת אֵ֗לֶּה וְ/שָׁ֨כַבְתָּ֜ עַל צִדְּ/ךָ֤ ה/ימיני שֵׁנִ֔ית וְ/נָשָׂ֖אתָ אֶת עֲוֺ֣ן בֵּית יְהוּדָ֑ה אַרְבָּעִ֣ים י֔וֹם י֧וֹם לַ/שָּׁנָ֛ה י֥וֹם לַ/שָּׁנָ֖ה נְתַתִּ֥י/ו לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: fr
  text: Quand tu auras achevé cela, tu te coucheras une deuxième fois sur le côté droit et tu porteras la faute de la maison de Juda pendant quarante jours. Je t’ai attribué un jour pour chaque année.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un jour pour une année, un jour pour une année ». La répétition souligne la correspondance symbolique entre les jours pendant lesquels Ézéchiel reste couché et les années qu’ils représentent.'
    reason: La formulation idiomatique du texte principal condense une répétition emphatique de l’hébreu.
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: Quand tu auras achevé cela
  rationale: Dans le contexte, la forme verbale introduit temporellement la seconde action symbolique, une fois la première achevée. Le singulier français « cela » renvoie naturellement à l’ensemble de ce qui précède.
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: tu te coucheras une deuxième fois sur le côté droit
  rationale: « Une deuxième fois » rend explicitement שֵׁנִית et « se coucher sur le côté droit » décrit naturellement la posture prescrite.
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: tu porteras la faute
  rationale: « Porter la faute » conserve la largeur de l’expression hébraïque, qui peut viser à la fois la faute, la culpabilité et les conséquences qui s’y attachent, sans réduire le signe à la seule punition.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Cette traduction formelle conserve la désignation prophétique collective du peuple ou royaume de Juda.
- source_word: אַרְבָּעִים יוֹם
  choice: pendant quarante jours
  rationale: La préposition « pendant » exprime naturellement en français la durée indiquée par l’hébreu.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: un jour pour chaque année
  rationale: Cette formulation française claire exprime la correspondance symbolique entre chaque jour vécu par Ézéchiel et une année représentée; la répétition hébraïque est signalée en note.
- source_word: נְתַתִּיו לָךְ
  choice: Je t’ai attribué
  rationale: Le verbe נתן signifie littéralement « donner »; « attribuer » convient ici à une mesure symbolique fixée par Dieu, tout en évitant de surcharger le texte avec l’idée plus forte d’une contrainte.
theological_decisions:
- issue: Portée de עָוֺן dans l’action symbolique
  choice: Conserver « faute » dans l’expression « porter la faute »
  alternative: « culpabilité » ou « châtiment de la faute »
  rationale: Le terme peut englober l’acte mauvais, la culpabilité et ses conséquences. « Faute » préserve cette tension mieux qu’une traduction limitée exclusivement à la culpabilité ou au châtiment.
- issue: Nature de la correspondance entre jours et années
  choice: Présenter chaque jour comme représentant une année dans cette action symbolique
  alternative: Formuler une règle prophétique universelle selon laquelle tout jour équivaut toujours à une année
  rationale: Le verset définit la mesure propre au signe accompli par Ézéchiel; il ne formule pas explicitement une règle générale d’interprétation pour tous les textes prophétiques.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur et le futur antérieur structurent clairement la succession des deux actions symboliques. « Maison de Juda » conserve la tournure prophétique traditionnelle, tandis que le reste de la phrase privilégie une syntaxe française naturelle.
