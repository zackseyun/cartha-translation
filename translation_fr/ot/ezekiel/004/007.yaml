  text: וְ/אֶל מְצ֤וֹר יְרוּשָׁלִַ֨ם֙ תָּכִ֣ין פָּנֶ֔י/ךָ וּֽ/זְרֹעֲ/ךָ֖ חֲשׂוּפָ֑ה וְ/נִבֵּאתָ֖ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: fr
  text: Dirige ton visage vers le siège de Jérusalem[a], ton bras découvert, et prophétise contre elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers Jérusalem assiégée ». L’hébreu peut désigner soit le siège comme événement, soit la situation de la ville assiégée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prophétise à son sujet ». Dans ce contexte de jugement, « contre elle » paraît être le sens principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: siège
  rationale: Le nom désigne le siège ou l’état d’une ville assiégée. « Le siège de Jérusalem » convient au geste symbolique décrit dans le contexte sans préciser indûment des ouvrages de siège.
- source_word: תָּכִין פָּנֶיךָ
  choice: Tourne ton visage
  rationale: Le hifil de כון avec « visage » exprime le fait de diriger résolument son visage vers quelque chose. Cette formulation reste naturelle en français tout en conservant l’image hébraïque et sa solennité.
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: le bras découvert
  rationale: La proposition nominale signifie littéralement « ton bras [étant] découvert ». La tournure française conserve l’image de disponibilité pour l’action sans en expliciter symboliquement le sens.
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: prophétise contre elle
  rationale: Dans ce contexte de siège et de jugement, נבא avec עַל a vraisemblablement une valeur adversative. Le pronom féminin renvoie naturellement à Jérusalem, d’où « elle » en français.
theological_decisions:
- issue: Orientation de la parole prophétique envers Jérusalem
  choice: « contre elle », selon la portée judiciaire dominante du contexte
  alternative: « à son sujet » ou « sur elle », avec une valeur plus neutre
  rationale: La préposition עַל possède une gamme de sens plus large que « contre », mais le geste prophétique annonce ici le siège et le jugement de Jérusalem. La note maintient l’ambiguïté lexicale authentique.
translation_notes:
  register: Français moderne, international et digne. L’impératif français rend naturellement les formes verbales hébraïques à valeur injonctive dans la suite des ordres divins. L’image du visage dirigé et celle du bras découvert sont conservées sans interprétation ajoutée.
