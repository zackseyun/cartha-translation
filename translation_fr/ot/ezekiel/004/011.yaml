source:
  edition: WLC
  text: וּ/מַ֛יִם בִּ/מְשׂוּרָ֥ה תִשְׁתֶּ֖ה שִׁשִּׁ֣ית הַ/הִ֑ין מֵ/עֵ֥ת עַד עֵ֖ת תִּשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/011.yaml
  text: And you shall drink water by measure[a], a sixth of a hin; from time to time you shall drink.
translation:
  language: fr
  text: 'Tu boiras aussi de l’eau en quantité mesurée : un sixième de hin ; tu en boiras de temps à autre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à des moments déterminés ».'
    reason: L’expression hébraïque peut être comprise soit comme une indication périodique générale (« de temps à autre »), soit comme des moments fixés.
lexical_decisions:
- source_word: וּמַיִם
  choice: Tu boiras de l’eau
  rationale: מַיִם signifie « eau ». La conjonction ו relie cette prescription aux précédentes; en français, cet enchaînement reste naturel sans rendre ו séparément par « et ».
- source_word: בִּמְשׂוּרָה
  choice: en quantité mesurée
  rationale: מְשׂוּרָה désigne une mesure ou une quantité déterminée; cette formulation exprime clairement le rationnement.
- source_word: תִשְׁתֶּה
  choice: tu boiras
  rationale: L’imparfait qal à la 2e personne du masculin singulier a ici une valeur injonctive. Le futur français convient au ton prescriptif du passage.
- source_word: שִׁשִּׁית הַהִין
  choice: un sixième de hin
  rationale: La traduction conserve l’unité ancienne et la quantité précise du texte hébreu, sans conversion conjecturale.
- source_word: מֵעֵת עַד עֵת
  choice: à intervalles réguliers
  rationale: L’expression signifie littéralement « d’un moment à un autre » et indique ici que la ration doit être bue périodiquement, à des moments déterminés.
- source_word: תִּשְׁתֶּה
  choice: tu en boiras
  rationale: La répétition du verbe hébreu est conservée afin de souligner le caractère réglementé de la consommation; « en » reprend naturellement l’eau en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier reflète l’adresse directe à Ézéchiel. La répétition verbale de l’hébreu est maintenue, tandis que la coordination initiale est intégrée naturellement à la phrase française.
