source:
  edition: WLC
  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: fr
  text: Et toi, couche-toi sur ton côté gauche et mets sur ce côté la faute[a] de la maison d’Israël. Tu porteras leur faute pendant le nombre de jours où tu seras couché sur ce côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « culpabilité » ou « peine due à la faute », ici et à la fin du verset. Le mot hébreu peut désigner la faute elle-même, la culpabilité qu’elle entraîne ou la peine qui en résulte.
    reason: alternative lexicale
lexical_decisions:
- source_word: שְׁכַב
  choice: couche-toi
  rationale: L’impératif décrit une posture physique. « Couche-toi » est direct et naturel en français.
- source_word: צִדְּךָ הַשְּׂמָאלִי
  choice: sur le côté gauche
  rationale: Cette formulation idiomatique rend précisément la posture commandée.
- source_word: וְשַׂמְתָּ
  choice: mets
  rationale: Le verbe שׂים signifie mettre, placer ou poser. « Mets » convient au geste symbolique sans alourdir la phrase.
- source_word: עֲוֺן / עֲוֺנָם
  choice: la faute / leur faute
  rationale: עָוֹן peut désigner la faute elle-même, la culpabilité qu’elle entraîne ou ses conséquences. « Faute » est actuel et conserve la dimension morale; la note maintient l’étendue sémantique du terme.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La traduction conserve la désignation collective et son caractère corporatif plutôt que de la réduire au simple nom « Israël ».
- source_word: עָלָיו
  choice: sur ce côté
  rationale: Le pronom renvoie le plus naturellement au côté gauche. La reprise explicite de « ce côté » évite en français l’ambiguïté ou la maladresse de « sur lui ».
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר
  choice: durant le nombre de jours où
  rationale: Cette formulation conserve l’idée d’une durée déterminée par un nombre précis de jours tout en restant naturelle.
- source_word: תִּשָּׂא
  choice: tu porteras
  rationale: נשא avec עָוֹן exprime le fait de porter une faute, une culpabilité ou son poids. « Porter » maintient l’image du fardeau moral.
theological_decisions:
- issue: Sens du fait qu’Ézéchiel porte le עָוֹן d’Israël dans ce geste symbolique
  choice: « tu porteras leur faute », comme description ouverte du geste prophétique symbolique
  alternative: « tu porteras leur culpabilité » ou « tu subiras la peine due à leur faute »
  rationale: Le texte peut évoquer la faute, la culpabilité ou ses conséquences, sans préciser ici un mécanisme expiatoire. La traduction conserve donc cette tension et n’introduit pas un langage d’expiation substitutive absent du verset.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « ce côté » explicite le référent du pronom hébreu; « maison d’Israël » conserve la formulation collective traditionnelle du texte source.
