    rationale: Le verbe hébreu répété signifie « être couché / se coucher » dans cette posture; « tu seras couché » évite l’ajout discret impliqué par « resteras ».
  - severity: low
    issue: Note lexicale sur la portée punitive possible
    rationale: « Conséquences » peut inclure des effets non punitifs. « Peine due à la faute » exprime plus nettement l’alternative « punishment for iniquity », tout en restant présentée comme une possibilité.
