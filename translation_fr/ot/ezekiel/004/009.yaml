  text: וְ/אַתָּ֣ה קַח לְ/ךָ֡ חִטִּ֡ין וּ֠/שְׂעֹרִים וּ/פ֨וֹל וַ/עֲדָשִׁ֜ים וְ/דֹ֣חַן וְ/כֻסְּמִ֗ים וְ/נָתַתָּ֤ה אוֹתָ/ם֙ בִּ/כְלִ֣י אֶחָ֔ד וְ/עָשִׂ֧יתָ אוֹתָ֛/ם לְ/ךָ֖ לְ/לָ֑חֶם מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר אַתָּ֣ה שׁוֹכֵ֣ב עַֽל צִדְּ/ךָ֗ שְׁלֹשׁ מֵא֧וֹת וְ/תִשְׁעִ֛ים י֖וֹם תֹּאכֲלֶֽ/נּוּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: fr
  text: Et toi, prends du blé, de l’orge, des fèves, des lentilles, du millet et de l’épeautre[a]. Mets-les dans un même récipient et fais-en du pain pour toi. Pendant les trois cent quatre-vingt-dix jours où tu seras couché sur ton côté, tu en mangeras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « amidonnier » ou « une sorte de blé » ; l’identification exacte de la céréale ancienne כֻסְּמִים est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: prends
  rationale: Le datif bénéficiaire est exprimé naturellement par le contexte et par « pour toi » dans la proposition suivante; « prends » évite une lourdeur en français.
- source_word: חִטִּין וּשְׂעֹרִים
  choice: du blé, de l’orge
  rationale: Équivalents français usuels des deux céréales.
- source_word: פּוֹל וַעֲדָשִׁים
  choice: des fèves, des lentilles
  rationale: « Fèves » rend probablement le type de légumineuse désigné par פּוֹל sans imposer une identification botanique plus étroite.
- source_word: דֹחַן
  choice: millet
  rationale: Identification courante et intelligible de cette céréale.
- source_word: כֻסְּמִים
  choice: épeautre
  rationale: Rendu traditionnel et plausible en français; l’incertitude sur l’espèce ancienne est signalée en note.
- source_word: בִּכְלִי אֶחָד
  choice: dans un même récipient
  rationale: « Récipient » est naturel et assez général pour כְּלִי; « un même » souligne que tous les ingrédients sont réunis ensemble.
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: fais-en du pain pour toi
  rationale: Formulation française idiomatique qui conserve la transformation des ingrédients et la valeur bénéficiaire.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר אַתָּה שׁוֹכֵב עַל צִדְּךָ
  choice: pendant les jours où tu seras couché sur le côté
  rationale: Exprime clairement la durée déterminée par la période du geste symbolique, sans calquer lourdement « le nombre des jours ».
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם תֹּאכֲלֶנּוּ
  choice: soit trois cent quatre-vingt-dix jours
  rationale: Rattache explicitement le nombre à la durée pendant laquelle Ézéchiel doit manger ce pain; l’antéposition française « Tu en mangeras » reflète le verbe hébreu final.
theological_decisions: []
