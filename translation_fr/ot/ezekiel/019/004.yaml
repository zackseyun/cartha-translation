id: EZK.19.4
reference: Ezekiel 19:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ אֵלָ֛י/ו גּוֹיִ֖ם בְּ/שַׁחְתָּ֣/ם נִתְפָּ֑שׂ וַ/יְבִאֻ֥/הוּ בַֽ/חַחִ֖ים אֶל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: fr
  text: Les nations entendirent parler de lui[a] ; il fut pris dans leur fosse[b], et elles l’emmenèrent avec des crochets[c] au pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’entendirent ». L’expression hébraïque peut désigner le fait d’entendre parler de lui plutôt que de l’entendre directement.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur piège ». Il s’agit probablement d’une fosse utilisée pour capturer des animaux.
    reason: lexical_alternative
  - marker: c
    text: Ces crochets, ou anneaux, servaient à maîtriser des animaux capturés ou des prisonniers.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: entendirent parler de lui
  rationale: Dans ce contexte, l’expression indique vraisemblablement que les nations reçurent des nouvelles à son sujet, plutôt qu’elles ne l’entendirent directement.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les peuples étrangers ; « les nations » convient au contexte sans introduire les connotations plus tardives de « païens ».
- source_word: בְּשַׁחְתָּם
  choice: dans leur fosse
  rationale: Le mot désigne une fosse, ici dans l’image d’une chasse au lion ; le concret de la métaphore hébraïque est ainsi conservé.
- source_word: נִתְפָּשׂ
  choice: il fut pris
  rationale: La forme passive exprime la capture et s’accorde naturellement avec l’image de la fosse.
- source_word: וַיְבִאֻהוּ
  choice: elles l’emmenèrent
  rationale: Le verbe signifie littéralement « faire venir, amener » ; dans ce contexte de captivité et de déplacement vers l’Égypte, « emmener » est naturel en français.
- source_word: בַחַחִים
  choice: avec des crochets
  rationale: Le terme peut désigner des crochets ou anneaux servant à maîtriser des animaux ou des prisonniers ; « crochets » conserve l’image sans préciser indûment leur emplacement.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: au pays d’Égypte
  rationale: Cette formulation restitue l’expression géographique formelle de l’hébreu tout en restant idiomatique en français.
