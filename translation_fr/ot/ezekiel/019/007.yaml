  text: וַ/יֵּ֨דַע֙ אַלְמְנוֹתָ֔י/ו וְ/עָרֵי/הֶ֖ם הֶחֱרִ֑יב וַ/תֵּ֤שַׁם אֶ֨רֶץ֙ וּ/מְלֹאָ֔/הּ מִ/קּ֖וֹל שַׁאֲגָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: fr
  text: Il connut ses veuves[a] et ravagea leurs villes ; le pays, avec tout ce qu’il contenait, fut désolé par le bruit de son rugissement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « il connut ses veuves ». Dans ce contexte, le verbe « connut » peut avoir une nuance hostile ou sexuelle ; certains y voient donc une allusion à des mauvais traitements ou à un viol. D’autres, suivant une autre lecture du texte hébreu, traduisent : « il détruisit leurs palais ».'
    reason: Signaler l’expression hébraïque très difficile et une lecture textuelle importante, sans lever artificiellement l’ambiguïté dans le texte.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Il connut
  rationale: Le verbe signifie normalement « connaître », mais peut aussi, selon le contexte, évoquer des rapports sexuels. La traduction littérale maintient ici l’ambiguïté d’une expression hébraïque difficile, tandis que la note signale sa possible nuance violente ou sexuelle.
- source_word: אַלְמְנוֹתָיו
  choice: ses veuves
  rationale: Le texte massorétique porte le suffixe masculin singulier « ses » et le nom « veuves ». Cette formulation énigmatique est conservée dans le texte; la note présente les principales autres compréhensions sans substituer silencieusement une conjecture au texte reçu.
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: et dévasta leurs villes
  rationale: Le verbe החריב exprime l’action de ravager ou de réduire en ruines. « Dévasta » convient au style poétique de la complainte et distingue clairement le suffixe pluriel « leurs ».
- source_word: וַתֵּשַׁם
  choice: fut dévasté
  rationale: Le verbe singulier décrit le pays devenu désolé. « Fut dévasté » rend le résultat de l’action avec une formulation française naturelle.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: Le pays… avec tout ce qu’il contenait
  rationale: L’expression désigne le pays et ce qui le remplit. Cette tournure actuelle restitue l’idiome sans le calque peu naturel « sa plénitude ».
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: au bruit de son rugissement
  rationale: La préposition מן peut marquer ici la cause. « Au bruit de » exprime naturellement en français l’effet dévastateur du rugissement tout en conservant l’image du lion.
theological_decisions:
- issue: Interprétation de l’expression difficile וַיֵּדַע אַלְמְנוֹתָיו dans une métaphore de jugement
  choice: Conserver dans le texte le sens massorétique « Il connut ses veuves », avec une note exposant les ambiguïtés lexicales et textuelles.
  alternative: « Il maltraita leurs veuves » ou, d’après une autre lecture du texte, « Il détruisit leurs palais ».
  rationale: La difficulté est lexicale et textuelle, non doctrinale. Le maintien de la formulation massorétique préserve son ambiguïté et sa tension, sans imposer dans le corps du texte une interprétation sexuelle, violente ou conjecturale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la rudesse poétique de la première proposition, tandis que « avec tout ce qu’il contenait » rend l’idiome hébreu de façon immédiatement compréhensible.
