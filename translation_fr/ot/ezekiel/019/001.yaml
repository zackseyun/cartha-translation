source:
  edition: WLC
  text: וְ/אַתָּה֙ שָׂ֣א קִינָ֔ה אֶל נְשִׂיאֵ֖י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
translation:
  language: fr
  text: Et toi, prononce une complainte[a] sur les princes[b] d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entonne une lamentation » ou « élève un chant funèbre ».
    reason: lexical_alternative
  - marker: b
    text: Ici, les « princes » peuvent désigner plus précisément les souverains de la maison royale de Juda et d’Israël, et non simplement des dirigeants en général.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Et toi,
  rationale: La conjonction suivie du pronom indépendant assure la continuité du discours tout en mettant Ézéchiel en relief. « Et toi » reproduit naturellement cette adresse directe en français.
- source_word: שָׂא
  choice: prononce
  rationale: Avec קִינָה, le verbe « lever/porter » forme un idiome signifiant entonner ou proférer une complainte. « Prononce » rend clairement l’action demandée sans suggérer nécessairement un chant.
- source_word: קִינָה
  choice: une complainte
  rationale: Le nom désigne une lamentation funèbre ou un chant de deuil. « Complainte » conserve le caractère formel, poétique et funèbre du passage.
- source_word: אֶל
  choice: sur
  rationale: Dans le contexte d’une lamentation, la préposition introduit ceux qui en sont le sujet ou l’objet. « Sur » est l’expression française idiomatique correspondante.
- source_word: נְשִׂיאֵי
  choice: les princes
  rationale: Le terme désigne des personnages élevés, chefs ou gouvernants. Dans le contexte dynastique d’Ézéchiel 19, « princes » garde la nuance politique et royale sans le préciser indûment en « rois ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre biblique.
theological_decisions:
- issue: Référent des « princes d’Israël »
  choice: Conserver dans le texte le terme général et dynastique « princes d’Israël ».
  alternative: « rois d’Israël » ou « chefs d’Israël »
  rationale: L’hébreu emploie נְשִׂיאֵי et non le terme spécifique signifiant « rois ». Le contexte évoque des souverains de la maison royale, mais la traduction ne doit pas éliminer l’amplitude du mot source.
translation_notes:
  register: Français moderne, digne et accessible. « Complainte » maintient la tonalité poétique et funèbre; « prononce » rend l’idiome hébreu de façon naturelle. Tous les marqueurs de notes figurent dans le texte.
