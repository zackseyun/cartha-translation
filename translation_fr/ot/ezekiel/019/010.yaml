  variant: modern international French
source:
  edition: WLC
  text: אִמְּ/ךָ֥ כַ/גֶּ֛פֶן בְּ/דָמְ/ךָ֖ עַל מַ֣יִם שְׁתוּלָ֑ה פֹּֽרִיָּה֙ וַֽ/עֲנֵפָ֔ה הָיְתָ֖ה מִ/מַּ֥יִם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: fr
  text: Ta mère était comme une vigne dans ton sang[a], plantée près des eaux ; elle était féconde et riche en branches grâce à l’abondance des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ton sang », expression hébraïque difficile. Certains comprennent ou corrigent le texte en « à ta ressemblance » ou « dans ton vignoble ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: ta mère
  rationale: Le nom avec suffixe possessif est rendu littéralement. Dans le contexte, la mère représente poétiquement la maison royale ou la nation, mais cette identification n’est pas introduite dans le texte.
- source_word: כַגֶּפֶן
  choice: comme une vigne
  rationale: La préposition כ marque une comparaison, et גֶּפֶן désigne la vigne. Cette formulation française préserve clairement la comparaison.
- source_word: בְּדָמְךָ
  choice: dans ton sang
  rationale: Le texte massorétique porte littéralement « dans ton sang ». Malgré l’obscurité de l’expression, cette lecture est conservée dans le texte, tandis que les principales solutions proposées sont signalées en note.
- source_word: עַל מַיִם
  choice: près des eaux
  rationale: Dans cette image végétale, la préposition situe la vigne à proximité d’une source d’eau. Le pluriel poétique de מַיִם est conservé.
- source_word: שְׁתוּלָה
  choice: plantée
  rationale: Le participe passif féminin de שׁתל signifie ici « plantée » et s’accorde avec la vigne.
- source_word: פֹּרִיָּה
  choice: féconde
  rationale: L’adjectif exprime la capacité à porter beaucoup de fruit. « Féconde » est naturel en français et convient à la double image de la mère et de la vigne.
- source_word: וַעֲנֵפָה
  choice: riche en branches
  rationale: L’adjectif dérivé de ענף décrit une vigne pourvue de nombreuses branches. Cette locution rend le sens avec naturel.
- source_word: הָיְתָה
  choice: elle était
  rationale: Le verbe est au féminin singulier et renvoie à la mère comparée à une vigne ; le pronom féminin maintient cette continuité poétique.
- source_word: מִמַּיִם רַבִּים
  choice: grâce à l’abondance des eaux
  rationale: La préposition מן indique ici la source ou la cause de la fécondité. La formulation rend naturellement le lien causal et le sens de « nombreuses eaux ».
theological_decisions:
- issue: Traitement de l’expression obscure בְּדָמְךָ
  choice: Conserver « dans ton sang » dans le texte principal et indiquer les autres lectures en note.
  alternative: Adopter dans le texte « à ta ressemblance » ou « dans ton vignoble ».
  rationale: La difficulté est textuelle et lexicale plutôt que doctrinale. La lecture consonantique et massorétique est maintenue sans correction silencieuse, afin de préserver l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme de la lamentation est préservé, tout en employant une syntaxe accessible. L’expression volontairement obscure « dans ton sang » est maintenue par fidélité au texte massorétique et explicitée en note.
