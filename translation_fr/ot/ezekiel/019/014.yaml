  text: וַ/תֵּצֵ֨א אֵ֜שׁ מִ/מַּטֵּ֤ה בַדֶּ֨י/הָ֙ פִּרְיָ֣/הּ אָכָ֔לָה וְ/לֹא הָ֥יָה בָ֛/הּ מַטֵּה עֹ֖ז שֵׁ֣בֶט לִ/מְשׁ֑וֹל קִ֥ינָה הִ֖יא וַ/תְּהִ֥י לְ/קִינָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: fr
  text: Un feu est sorti d’un rameau parmi ses branches[a] ; il a dévoré son fruit. Il n’y avait en elle aucun rameau vigoureux, aucun sceptre pour gouverner[b]. C’est une complainte, et elle est devenue une complainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une verge parmi ses branches ». Le mot hébreu מַטֶּה peut désigner un rameau, une verge ou un bâton. Ici, « rameau » suit l’image de la vigne, tandis que la suite du verset fait ressortir le sens royal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « aucune verge puissante, aucun sceptre pour gouverner ». L’hébreu mêle volontairement l’image de la vigne à celle de la royauté : le rameau ou la verge est aussi présenté comme un sceptre propre à gouverner.'
    reason: metaphorical_ambiguity
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: Un feu est sorti
  rationale: Le wayyiqtol fait progresser vivement le récit. L’article indéfini est naturel en français lors de la première mention du feu.
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: d’un rameau parmi ses branches
  rationale: מַטֶּה peut désigner un rameau, une verge ou un bâton, tandis que בַּד désigne une branche. Dans l’allégorie de la vigne, « rameau » maintient l’image végétale et « parmi ses branches » exprime naturellement la relation interne.
- source_word: פִּרְיָהּ אָכָלָה
  choice: il a dévoré son fruit
  rationale: Le pronom français renvoie au feu, masculin, et « dévorer » rend avec force אָכַל tout en restant idiomatique pour un incendie.
- source_word: וְלֹא הָיָה בָהּ מַטֵּה עֹז
  choice: Il ne lui est resté aucun rameau vigoureux
  rationale: Cette formulation française rend l’absence résultant de la destruction. « Rameau vigoureux » conserve l’image de la vigne sans effacer la possible nuance de verge royale.
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: aucun sceptre pour gouverner
  rationale: שֵׁבֶט prend ici une valeur nettement royale ; « sceptre » exprime l’autorité, tandis que « pour gouverner » conserve la fonction indiquée par l’infinitif.
- source_word: קִינָה הִיא וַתְּהִי לְקִינָה
  choice: C’est une complainte, et elle est devenue une complainte
  rationale: « Complainte » convient au genre funèbre de קִינָה. La répétition du texte hébreu est gardée, ainsi que le passage à un état résultant marqué par וַתְּהִי לְ.
theological_decisions:
- issue: Entrelacement des images végétale et royale
  choice: Employer « rameau » pour מַטֶּה dans l’image de la vigne, puis « sceptre » pour שֵׁבֶט.
  alternative: Traduire les deux termes par « verge » ou « bâton » afin de mettre davantage l’accent sur la royauté.
  rationale: Le verset superpose délibérément la vigne et le pouvoir royal. La traduction conserve cette tension au lieu de réduire le passage à une seule des deux images.
- issue: Référent final de « elle »
  choice: Laisser le féminin « elle » reprendre naturellement « complainte », sans préciser davantage.
  alternative: Expliciter « cette lamentation est devenue une complainte » ou comprendre que la situation décrite est devenue matière à complainte.
  rationale: L’hébreu permet une certaine ambiguïté entre le chant lui-même et ce qui est devenu objet de lamentation ; une formulation non explicative évite de trancher artificiellement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Complainte » restitue le caractère formel et funèbre du genre ; la répétition finale, marquée en français, est conservée parce qu’elle appartient à la conclusion emphatique de l’hébreu.
