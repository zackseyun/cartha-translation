source:
  edition: WLC
  text: וַ/תֵּ֨רֶא֙ כִּ֣י נֽוֹחֲלָ֔ה אָבְדָ֖ה תִּקְוָתָ֑/הּ וַ/תִּקַּ֛ח אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֥יר שָׂמָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: fr
  text: Quand elle vit qu’elle avait attendu en vain[a], que son espoir était perdu, elle prit l’un de ses petits et en fit un jeune lion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle était affaiblie » ou « qu’elle était déçue ». Le terme hébreu est difficile; le texte principal suit le sens contextuel d’une attente frustrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quand elle vit
  rationale: Le wayyiqtol fait progresser le récit, tandis que « quand » exprime naturellement en français le rapport temporel avec ce qui suit.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que la lionne constate.
- source_word: נוֹחֲלָה
  choice: elle avait attendu en vain
  rationale: Le terme hébreu est difficile. En parallèle avec la perte de son espoir, cette formulation rend naturellement l’idée contextuelle d’une attente déçue sans masquer les autres analyses possibles, signalées en note.
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: son espoir était perdu
  rationale: Cette traduction conserve le vocabulaire de l’espoir et la force de la constatation, dans un français naturel.
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: elle prit l’un de ses petits
  rationale: Dans la métaphore de la lionne, גּוּר désigne l’un de ses petits; le contexte rend inutile l’ajout explicatif « lionceaux ».
- source_word: כְּפִיר
  choice: un jeune lion
  rationale: Le mot désigne spécifiquement un lion jeune et maintient la progression de l’image.
- source_word: שָׂמָתְהוּ
  choice: en fit
  rationale: Le verbe « placer/établir » prend ici le sens idiomatique de faire de ce petit un jeune lion; « en fit » est concis et naturel.
