  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: fr
  text: Il rôda parmi les lions ; il devint un jeune lion. Il apprit à déchirer des proies ; il dévora des hommes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres humains » ou « des gens » ; ici, le mot hébreu traduit par « hommes » peut avoir un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: Il rôdait
  rationale: Le hitpael de הלך exprime ici un déplacement répété au sein de la métaphore du lion. « Rôdait » restitue naturellement le mouvement prédateur.
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: parmi les lions
  rationale: בְּתוֹךְ signifie « au milieu de, parmi » ; cette formulation française est naturelle et conserve l’image.
- source_word: כְּפִיר הָיָה
  choice: il devint un jeune lion
  rationale: כְּפִיר désigne un lion jeune et vigoureux plutôt qu’un tout petit lionceau, et הָיָה marque ici la progression du récit allégorique.
- source_word: וַיִּלְמַד
  choice: Il apprit
  rationale: Le verbe signifie simplement « apprendre » ; rien dans le texte n’impose l’idée d’un dressage par un agent extérieur.
- source_word: לִטְרָף טֶרֶף
  choice: à déchirer ses proies
  rationale: La construction avec infinitif et nom apparenté intensifie l’action prédatrice. Le pluriel idiomatique français évite la répétition artificielle tout en gardant la violence de l’image.
- source_word: אָדָם אָכָל
  choice: il dévora des hommes
  rationale: אָדָם a ici une valeur collective et אָכָל, dans l’image animale, se rend avec force et naturel par « dévora ».
theological_decisions:
- issue: Valeur collective de אָדָם dans la métaphore prédatrice
  choice: des hommes
  alternative: des êtres humains / des gens
  rationale: Le passage emploie une image allégorique, non une définition doctrinale de l’humanité. « Des hommes » conserve la vigueur concrète de l’hébreu, tandis que la note signale explicitement la portée collective possible.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme bref et parallèle de la poésie prophétique est conservé ; « rôdait » et « dévora » maintiennent la vigueur de la métaphore animale.
