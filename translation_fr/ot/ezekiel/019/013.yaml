  yaml_path: translation/ot/ezekiel/019/013.yaml
  text: And now she is planted in the wilderness[a], in a dry and thirsty land.
translation:
  language: fr
  text: Et maintenant, elle est plantée dans le désert[a], dans une terre aride et assoiffée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transplantée dans le désert ». Dans ce contexte, le participe hébreu peut suggérer qu’elle a été arrachée puis replantée, mais sa forme signifie plus directement « plantée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction suivie de l’adverbe temporel marque le passage à la situation présente tout en maintenant le lien avec ce qui précède.
- source_word: שְׁתוּלָה
  choice: elle est plantée
  rationale: Le participe passif décrit l’état de la vigne dans son nouveau lieu. « Plantée » rend directement la forme hébraïque, tandis que le contexte peut suggérer une transplantation.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici un espace inculte et désolé. « Désert » est naturel en français moderne et convient à l’image de l’exil sans imposer l’idée d’un désert exclusivement sablonneux.
- source_word: בְּאֶרֶץ
  choice: dans une terre
  rationale: Le nom sans article, précisé par les termes suivants, introduit une caractérisation du lieu; l’indéfini français convient donc.
- source_word: צִיָּה
  choice: aride
  rationale: Le terme évoque la sécheresse et l’absence d’humidité. « Aride » est précis, courant et s’accorde naturellement avec « terre ».
- source_word: וְצָמָא
  choice: et assoiffée
  rationale: Le substantif « soif » qualifie métaphoriquement la terre. « Assoiffée » préserve cette personnification et la formulation compacte de l’hébreu.
