  to: Elle avait de fortes branches, propres à faire des sceptres de souverains. Sa haute taille s’éleva au-dessus de l’épais feuillage[a] ; on la remarquait à sa hauteur et à l’abondance de ses rameaux.
  rationale: La révision restitue plus précisément la relation spatiale exprimée par עַל tout en préservant l’ambiguïté poétique de la construction. Elle remplace la note sur les « nuages », insuffisamment étayée dans ce contexte, par une alternative directement liée au feuillage dense. Les autres choix essentiels, notamment l’image de branches pouvant fournir des sceptres royaux, sont maintenus.
