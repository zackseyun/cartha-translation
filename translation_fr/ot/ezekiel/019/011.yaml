  text: וַ/יִּֽהְיוּ לָ֞/הּ מַטּ֣וֹת עֹ֗ז אֶל שִׁבְטֵי֙ מֹֽשְׁלִ֔ים וַ/תִּגְבַּ֥הּ קֽוֹמָת֖/וֹ עַל בֵּ֣ין עֲבֹתִ֑ים וַ/יֵּרָ֣א בְ/גָבְה֔/וֹ בְּ/רֹ֖ב דָּלִיֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: fr
  text: Elle avait de fortes branches, propres à faire des sceptres de souverains. Sa haute taille s’éleva au-dessus de l’épais feuillage[a] ; on la remarquait à sa hauteur et à l’abondance de ses rameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les épais rameaux ». L’hébreu évoque une végétation dense ; la construction peut souligner soit que la vigne s’élève au-dessus du feuillage, soit sa position parmi les rameaux épais.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: de fortes branches
  rationale: מַטּוֹת peut désigner des bâtons, des verges ou des branches. Dans l’allégorie de la vigne, « branches » maintient l’image végétale, tandis que עֹז exprime leur vigueur.
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: propres à devenir des sceptres de souverains
  rationale: שֵׁבֶט prend ici naturellement le sens royal de « sceptre », en relation avec מֹשְׁלִים, ceux qui gouvernent. La formulation rend l’orientation ou l’aptitude exprimée poétiquement par אֶל sans réduire les branches à des sceptres déjà façonnés.
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: Sa haute taille s’éleva
  rationale: Cette formulation restitue l’idée d’une croissance majestueuse tout en conservant le terme général « taille », sans imposer « tronc » au texte.
- source_word: עַל בֵּין עֲבֹתִים
  choice: au milieu des épaisses frondaisons
  rationale: עֲבֹתִים peut évoquer une végétation dense, des branches épaisses, voire, selon une lecture traditionnelle, les nuages. Dans cette allégorie végétale, « épaisses frondaisons » est contextuellement naturel, tandis que l’alternative est signalée en note.
- source_word: וַיֵּרָא
  choice: elle se faisait remarquer
  rationale: Le niphal indique qu’elle était visible ou apparaissait nettement. « Se faisait remarquer » exprime en français naturel cette visibilité manifeste sans lui attribuer une action volontaire.
- source_word: בְגָבְהוֹ
  choice: par sa hauteur
  rationale: Le בְּ peut ici exprimer le trait ou le moyen par lequel la vigne était visible ; « par sa hauteur » rend clairement le rapport.
- source_word: בְּרֹב דָּלִיֹּתָיו
  choice: par l’abondance de ses rameaux
  rationale: דָּלִיּוֹת désigne les rameaux ou branches étendues de la vigne. « Rameaux » évite une répétition lourde et conserve précisément l’imagerie végétale ; רֹב est rendu par « abondance ».
