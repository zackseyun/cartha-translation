    text: Ou « sa puissante verge » ou « son puissant sceptre ». Le terme hébreu peut désigner une branche, une verge ou un sceptre ; dans l’image de la vigne, il évoque aussi le pouvoir royal. Les verbes hébreux qui précèdent sont au pluriel, bien que ce nom et le pronom final soient au singulier.
    reason: Préserver l’ambiguïté botanique et royale, tout en signalant la discordance singulier/pluriel du texte hébreu sans la résoudre par une régularisation.
  revision_rationale: La révision garde la métaphore de la vigne et la nuance royale, mais rend au singulier le nom et le pronom final, conformément à leur forme hébraïque. La note informe le lecteur des verbes pluriels, ce qui préserve l’ambiguïté ou la difficulté textuelle. « Brisée » traduit plus justement le second acte destructeur et évite la répétition de « arrachée ».
