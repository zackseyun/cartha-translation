  text: וַ/תֻּתַּ֤שׁ בְּ/חֵמָה֙ לָ/אָ֣רֶץ הֻשְׁלָ֔כָה וְ/ר֥וּחַ הַ/קָּדִ֖ים הוֹבִ֣ישׁ פִּרְיָ֑/הּ הִתְפָּרְק֧וּ וְ/יָבֵ֛שׁוּ מַטֵּ֥ה עֻזָּ֖/הּ אֵ֥שׁ אֲכָלָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: fr
  text: Mais elle fut arrachée avec fureur et jetée à terre. Le vent d’est dessécha son fruit. Sa branche puissante[a] fut brisée et se dessécha ; le feu la dévora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa puissante verge » ou « son puissant sceptre ». Le terme hébreu peut désigner une branche, une verge ou un sceptre ; dans l’image de la vigne, il évoque aussi le pouvoir royal. Les verbes hébreux qui précèdent sont au pluriel, bien que ce nom et le pronom final soient au singulier.
    reason: Préserver l’ambiguïté botanique et royale, tout en signalant la discordance singulier/pluriel du texte hébreu sans la résoudre par une régularisation.
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: elle fut arrachée
  rationale: Le passif de נתשׁ, dans l’image de la vigne, évoque son arrachement du sol, probablement avec ses racines. « Arrachée » est naturel et conserve la violence de l’action.
- source_word: בְּחֵמָה
  choice: avec fureur
  rationale: חֵמָה désigne une colère ardente. « Avec fureur » exprime clairement la manière violente de l’arrachement sans préciser explicitement qui éprouve cette fureur.
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: jetée à terre
  rationale: Cette formulation rend le mouvement violent vers le sol et l’abaissement exprimés par le passif hébreu.
- source_word: רוּחַ הַקָּדִים
  choice: le vent d’est
  rationale: Expression française courante pour le vent destructeur venant de l’est.
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: dessécha son fruit
  rationale: 'Le hiphil de יבשׁ est causatif : le vent fait sécher le fruit. « Dessécha » conserve cette causalité et le registre poétique.'
- source_word: הִתְפָּרְקוּ וְיָבֵשׁוּ
  choice: furent arrachées et se desséchèrent
  rationale: Les deux verbes hébreux sont au pluriel. Cette traduction maintient leur nombre et rend la séparation violente suivie du dessèchement.
- source_word: מַטֵּה עֻזָּהּ
  choice: ses puissantes branches
  rationale: מַטֶּה peut désigner une branche, une verge ou un sceptre. Le pluriel verbal hébreu favorise ici un pluriel français, tandis que « branches » maintient l’image immédiate de la vigne et « puissantes » préserve l’idée de force.
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: le feu les dévora
  rationale: « Dévora » traduit vivement le sens littéral de אכל et convient au feu. Le suffixe objet est singulier en hébreu, mais son référent peut être collectif; le français reprend naturellement les branches au pluriel.
theological_decisions:
- issue: Valeur botanique et royale de מַטֵּה עֻזָּהּ
  choice: Conserver l’image de la vigne dans le texte par « ses puissantes branches », avec une note signalant la possible évocation de sceptres royaux.
  alternative: « son puissant sceptre » ou « la verge de sa puissance »
  rationale: Le contexte immédiat est celui d’une vigne, mais le chant funèbre concerne la royauté et מַטֶּה peut désigner un sceptre. La traduction principale garde donc l’image végétale sans effacer le sous-entendu royal.
- issue: Discordance entre les verbes pluriels et le groupe nominal מַטֵּה עֻזָּהּ
  choice: Employer le pluriel français « branches » conformément aux verbes הִתְפָּרְקוּ וְיָבֵשׁוּ.
  alternative: Employer le singulier collectif « sa branche puissante fut arrachée et se dessécha ».
  rationale: Le texte massorétique présente deux verbes pluriels, même si מַטֵּה paraît morphologiquement singulier. Le pluriel français préserve cette donnée textuelle plutôt que de la régulariser silencieusement.
translation_notes:
  register: Français moderne, international et digne. Les phrases relativement brèves reproduisent la progression vigoureuse du vers. Le pluriel de « branches » suit les verbes pluriels du texte massorétique; la note conserve la dimension royale de la métaphore.
