  verdict: revise
  source_fidelity: 'La première moitié est fidèle. Toutefois, le texte massorétique présente une tension formelle qu’il convient de ne pas effacer : les verbes « furent brisés » et « se desséchèrent » sont au pluriel, tandis que le nom מַטֵּה (« branche/verge/sceptre ») et le suffixe final (« la/le ») sont au singulier. Le brouillon régularise entièrement cette tension au pluriel, y compris dans « le feu les dévora », alors que le suffixe hébreu final est singulier. Une traduction française au singulier, assortie d’une note signalant les verbes pluriels, préserve mieux les données du texte sans imposer une résolution textuelle incertaine.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Branches ... furent arrachées » répète cependant inutilement « arrachée » au début du verset et rend moins précisément הִתְפָּרְקוּ, qui évoque plutôt le fait d’être brisé ou rompu. « Branche puissante » et « fut brisée » sont naturels dans l’image poétique de la vigne.
  terminology: « Vent d’est », « fruit », « feu » et « dévora » conviennent. « Branche puissante » maintient l’image végétale tout en laissant apparaître, par note, les résonances de verge ou de sceptre et donc de pouvoir royal. La note doit également documenter l’alternance singulier/pluriel du texte hébreu.
  issues:
  - severity: medium
    issue: Régularisation au pluriel de מַטֵּה et du suffixe final
    rationale: Le brouillon traduit « ses puissantes branches » et « le feu les dévora », mais le nom מַטֵּה et le suffixe objet final sont singuliers en hébreu. Les deux verbes intermédiaires sont bien pluriels ; cette discordance doit être préservée ou explicitement signalée, non résolue silencieusement.
  - severity: low
    issue: « furent arrachées » pour הִתְפָּרְקוּ
    rationale: La répétition de « arrachée/arrachées » affaiblit la progression et ne rend pas aussi précisément l’idée de rupture ou de bris. « Fut brisée » convient mieux ici.
  revised_text: Mais elle fut arrachée avec fureur et jetée à terre. Le vent d’est dessécha son fruit. Sa branche puissante[a] fut brisée et se dessécha ; le feu la dévora.
  revised_footnotes:
