  text: וַֽ/יִּתְּנֻ֤/הוּ בַ/סּוּגַר֙ בַּֽ/חַחִ֔ים וַ/יְבִאֻ֖/הוּ אֶל מֶ֣לֶךְ בָּבֶ֑ל יְבִאֻ֨/הוּ֙ בַּ/מְּצֹד֔וֹת לְמַ֗עַן לֹא יִשָּׁמַ֥ע קוֹל֛/וֹ ע֖וֹד אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: fr
  text: Ils le mirent dans une cage avec des crochets[a], et l’amenèrent au roi de Babylone. Ils le conduisirent dans des forteresses[b], afin que sa voix ne soit plus entendue sur les montagnes d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des anneaux ». Il s’agit d’instruments servant à maîtriser un animal capturé ou un prisonnier.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans des lieux fortifiés », « dans une prison », ou peut-être « dans des ouvrages de siège » ; le terme hébreu peut désigner des forteresses ou des lieux liés à la capture et à la détention.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: Ils le mirent dans une cage
  rationale: Le verbe נתן signifie ici « mettre », et סוּגַר désigne un espace fermé. « Cage » conserve l’image du lion capturé qui structure la lamentation.
- source_word: בַּחַחִים
  choice: avec des crocs
  rationale: חַחִים désigne des crochets ou anneaux servant à maîtriser un animal capturé ou un prisonnier. « Crocs » exprime naturellement en français l’instrument de capture sans préciser son emplacement, que l’hébreu ne donne pas.
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: et l’amenèrent au roi de Babylone
  rationale: Le hiphil de בוא signifie couramment « amener ». La construction אֶל marque la destination auprès du roi de Babylone.
- source_word: יְבִאֻהוּ בַּמְּצֹדוֹת
  choice: Ils le conduisirent dans des forteresses
  rationale: מְצֹדוֹת peut désigner des forteresses, des lieux de détention ou éventuellement des ouvrages de siège. « Forteresses » préserve le sens concret et l’ambiguïté relative du terme.
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: afin que sa voix ne soit plus entendue
  rationale: קוֹל signifie littéralement « voix » ou « son ». « Voix » maintient à la fois l’image animale et le référent humain, tandis que « rugissement » expliciterait davantage la métaphore.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: sur les montagnes d’Israël
  rationale: Dans cette construction, אֶל peut indiquer la sphère où la voix porte. « Sur les montagnes d’Israël » est naturel et correspond à une expression fréquente chez Ézéchiel.
theological_decisions:
- issue: Registre métaphorique du lion capturé représentant un prince de Juda
  choice: Conserver l’image de la capture et de la suppression de sa voix sans nommer le souverain historique.
  alternative: Identifier explicitement le personnage comme Joachin ou un autre roi de Juda.
  rationale: Le verset ne nomme pas le prince. Une identification historique dans le corps du texte résoudrait une question que l’hébreu laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la métaphore du lion et la répétition du verbe « amener/conduire », tout en évitant une identification historique absente du verset.
