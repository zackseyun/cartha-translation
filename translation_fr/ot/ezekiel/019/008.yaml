id: EZK.19.8
reference: Ezekiel 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ עָלָ֥י/ו גּוֹיִ֛ם סָבִ֖יב מִ/מְּדִינ֑וֹת וַֽ/יִּפְרְשׂ֥וּ עָלָ֛י/ו רִשְׁתָּ֖/ם בְּ/שַׁחְתָּ֥/ם נִתְפָּֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: fr
  text: Alors des nations venues des provinces se dressèrent contre lui de tous côtés[a]. Elles déployèrent sur lui leur filet, et il fut pris dans leur fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Alors des nations se dressèrent contre lui de tous côtés, venues des provinces. » La construction hébraïque permet plusieurs rattachements de « des provinces ».'
    reason: syntactic_alternative
  - marker: b
    text: La « fosse » désigne probablement ici une fosse-piège utilisée pour la chasse.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: se dressèrent contre lui
  rationale: L’expression idiomatique נתן על décrit ici une action hostile dirigée contre quelqu’un. « Se dresser contre » est naturel en français et convient à l’action concertée de la chasse et du jugement.
- source_word: גּוֹיִם
  choice: des nations
  rationale: גּוֹיִם désigne ici des puissances nationales étrangères. « Nations » préserve ce sens sans introduire artificiellement l’opposition théologique évoquée par « païens ».
- source_word: סָבִיב
  choice: de tous côtés
  rationale: Cette expression rend clairement l’idée d’encerclement portée par l’adverbe hébreu.
- source_word: מִמְּדִינוֹת
  choice: venues des provinces
  rationale: מְדִינוֹת peut désigner des districts administratifs ou des provinces. L’ajout naturel de « venues » rattache explicitement ce complément aux nations sans résoudre de façon rigide l’ordre syntaxique hébreu.
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: Elles déployèrent sur lui leur filet
  rationale: פרשׂ signifie étendre ou déployer, et רֶשֶׁת désigne un filet. Cette formulation conserve l’image de la chasse au lion.
- source_word: בְּשַׁחְתָּם
  choice: dans leur fosse
  rationale: שַׁחַת désigne une fosse et peut, dans ce contexte, évoquer une fosse-piège utilisée pour la chasse.
- source_word: נִתְפָּשׂ
  choice: il fut pris
  rationale: Le passif exprime le fait d’être pris ou capturé. « Fut pris » maintient directement la métaphore cynégétique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme poétique est conservé en deux phrases, avec le vocabulaire concret de l’encerclement et de la chasse.
