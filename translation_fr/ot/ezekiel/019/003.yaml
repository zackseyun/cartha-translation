source:
  edition: WLC
  text: וַ/תַּ֛עַל אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: fr
  text: Elle éleva l’un de ses petits ; il devint un jeune lion. Il apprit à déchirer sa proie ; il dévora des êtres humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il dévora un être humain » ou « il dévora l’homme ». Le mot hébreu אָדָם est au singulier et peut avoir ici un sens collectif ou générique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: Elle éleva
  rationale: Dans ce contexte maternel, le causatif de עלה décrit la lionne qui fait grandir ou élève son petit ; « éleva » rend naturellement cette progression.
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: l’un de ses petits
  rationale: גּוּר désigne le petit d’un animal, ici un lionceau. « L’un de ses petits » conserve la construction partitive et évite de répéter prématurément « lion ».
- source_word: כְּפִיר הָיָה
  choice: il devint un jeune lion
  rationale: כְּפִיר désigne un jeune lion déjà apte à chasser, tandis que « devint » exprime la progression narrative du petit au prédateur.
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: Il apprit à déchirer sa proie
  rationale: La construction apparentée verbe-nom souligne l’action prédatrice. « Déchirer sa proie » en restitue la violence avec un français naturel.
- source_word: אָדָם אָכָל
  choice: il dévora des êtres humains
  rationale: אָדָם, morphologiquement singulier mais générique ici, désigne des humains comme victimes ; le pluriel indéfini est idiomatique en français et « dévora » convient au contexte du lion.
theological_decisions:
- issue: Valeur du singulier générique אָדָם
  choice: des êtres humains
  alternative: un homme / l’homme
  rationale: Le contexte décrit le jeune lion qui s’attaque aux humains, sans identifier nécessairement un homme précis. La formulation retenue transmet la portée générique tout en signalant en note la forme singulière de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et poétique. Les phrases brèves préservent le rythme de la complainte et la progression du petit devenu jeune lion, puis prédateur d’êtres humains.
