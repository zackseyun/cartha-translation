source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ מָ֤ה אִמְּ/ךָ֙ לְבִיָּ֔א בֵּ֥ין אֲרָי֖וֹת רָבָ֑צָה בְּ/ת֥וֹךְ כְּפִרִ֖ים רִבְּתָ֥ה גוּרֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
translation:
  language: fr
  text: 'et dis : « Qu’était ta mère ? Une lionne. Parmi les lions, elle se couchait ; au milieu des jeunes lions, elle élevait ses petits.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle multipliait ses petits ». Le verbe hébreu peut exprimer l’idée d’accroissement ; dans ce contexte, il désigne probablement le fait de les élever.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Qu’était
  rationale: Conserve la force interrogative et rhétorique de l’hébreu sans transformer l’image en simple comparaison.
- source_word: אִמְּךָ
  choice: ta mère
  rationale: Maintient explicitement la deuxième personne du singulier et la figure maternelle.
- source_word: לְבִיָּא
  choice: une lionne
  rationale: Le nom hébreu est féminin et désigne précisément une lionne.
- source_word: בֵּין אֲרָיוֹת
  choice: parmi les lions
  rationale: Rend directement le pluriel hébreu général, sans le restreindre à des lionnes.
- source_word: רָבָצָה
  choice: elle se couchait
  rationale: Exprime la posture animale indiquée par le verbe tout en restant naturel en français.
- source_word: בְּתוֹךְ כְּפִרִים
  choice: au milieu des jeunes lions
  rationale: Préserve l’image spatiale et distingue les jeunes lions vigoureux des petits encore dépendants.
- source_word: רִבְּתָה
  choice: elle élevait
  rationale: Dans ce contexte maternel, le verbe désigne vraisemblablement l’action de faire grandir les petits, tout en pouvant aussi évoquer leur multiplication.
- source_word: גּוּרֶיהָ
  choice: ses petits
  rationale: Expression française naturelle pour les petits d’une lionne, sans archaïsme.
theological_decisions: []
