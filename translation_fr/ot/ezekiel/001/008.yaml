  text: ו/יד/ו אָדָ֗ם מִ/תַּ֨חַת֙ כַּנְפֵי/הֶ֔ם עַ֖ל אַרְבַּ֣עַת רִבְעֵי/הֶ֑ם וּ/פְנֵי/הֶ֥ם וְ/כַנְפֵי/הֶ֖ם לְ/אַרְבַּעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/008.yaml
  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
translation:
  language: fr
  text: Sous leurs ailes, sur leurs quatre côtés[a], ils avaient des mains humaines[b]. Tous les quatre avaient leurs visages et leurs ailes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : littéralement, « et des mains humaines, de dessous leurs ailes, sur leurs quatre côtés; et leurs visages et leurs ailes, à eux quatre ». La traduction explicite les rapports sous-entendus.'
    reason: lexical_alternative
  - marker: b
    text: Ou « des mains d’homme ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  choice: ils avaient des mains humaines
  rationale: La proposition nominale hébraïque, sans verbe exprimé, indique ici la possession; le français naturel demande « ils avaient ». אָדָם précise que ces mains sont de nature humaine.
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: sous leurs ailes
  rationale: Rend directement la position indiquée par מִתַּחַת dans une formulation française courante.
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: sur leurs quatre côtés
  rationale: רִבְעֵיהֶם désigne ici leurs côtés ou quartiers; « côtés » convient au cadre spatial de la vision.
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם לְאַרְבַּעְתָּם
  choice: Tous les quatre avaient leurs visages et leurs ailes
  rationale: La syntaxe hébraïque est elliptique. Cette formulation rattache לְאַרְבַּעְתָּם aux quatre êtres tout en conservant la mention distincte de leurs visages et de leurs ailes.
theological_decisions: []
