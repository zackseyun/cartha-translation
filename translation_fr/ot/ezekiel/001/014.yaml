  text: And the living creatures were running back and forth[a], like the appearance of lightning.
translation:
  language: fr
  text: Les êtres vivants couraient d’un côté à l’autre[a], comme à l’aspect de l’éclair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Les êtres vivants couraient et revenaient, comme à l’aspect de l’éclair. »'
    reason: Alternative lexicale et formulation plus formelle du mouvement exprimé par רָצוֹא וָשׁוֹב et de כְּמַרְאֵה.
lexical_decisions:
- source_word: וְהַחַיּוֹת
  choice: Les êtres vivants
  rationale: חַיּוֹת désigne littéralement des êtres vivants. Cette formulation convient aux êtres animés de la vision sans anticiper leur identification en Ézéchiel 10.20. La conjonction initiale n’est pas rendue, car le français moderne n’exige pas ici « et » hors contexte immédiat.
- source_word: רָצוֹא וָשׁוֹב
  choice: couraient çà et là
  rationale: Les deux infinitifs absolus de רוץ (« courir ») et שוב (« revenir ») évoquent un mouvement rapide et répété d’aller-retour. « Couraient çà et là » est naturel en français et conserve à la fois la course et l’itération.
- source_word: כְּמַרְאֵה
  choice: comme … qui jaillit
  rationale: מַרְאֶה signifie « apparence, aspect, vision ». En français, « comme l’apparence de l’éclair » serait lourd et peu naturel; la comparaison visuelle est exprimée idiomatiquement par « comme l’éclair qui jaillit », tandis que la note donne la forme plus littérale.
- source_word: הַבָּזָק
  choice: l’éclair
  rationale: בָּזָק désigne l’éclair ou son éclat fulgurant. Le singulier défini « l’éclair » rend naturellement l’image en français.
