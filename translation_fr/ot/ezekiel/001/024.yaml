id: EZK.1.24
reference: Ezekiel 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: fr
  text: J’entendis le bruit de leurs ailes, semblable au grondement de grandes eaux, au bruit du Tout-Puissant[a] lorsqu’ils avançaient, à un bruit tumultueux, comme le bruit d’un camp[b]. Lorsqu’ils s’arrêtaient, ils laissaient retomber leurs ailes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bruit de Shaddaï ». L’hébreu emploie le titre divin שַׁדַּי, traditionnellement rendu par « le Tout-Puissant ».
    reason: Autre manière de rendre le titre divin שַׁדַּי.
  - marker: b
    text: Ou « comme le bruit d’un camp » ; le terme hébreu désigne souvent un camp militaire.
    reason: Le contexte militaire de מַחֲנֶה est probable, mais n’est pas explicitement marqué par un adjectif dans l’hébreu.
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: J’entendis
  rationale: Le wayyiqtol poursuit le récit de la vision. Le passé simple convient au registre narratif soutenu sans alourdir la phrase d’un connecteur.
- source_word: קוֹל
  choice: bruit / grondement / voix
  rationale: קוֹל désigne selon le contexte un son, un bruit ou une voix. La variation française rend naturellement les différentes comparaisons tout en conservant leur dimension auditive.
- source_word: כַּנְפֵיהֶם
  choice: leurs ailes
  rationale: Traduction directe du pluriel construit avec suffixe de troisième personne du pluriel, renvoyant aux êtres vivants.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: pareil au grondement des eaux abondantes
  rationale: « Grondement » exprime la puissance sonore de l’image, tandis que « eaux abondantes » conserve l’idée hébraïque de מַיִם רַבִּים sans préciser indûment qu’il s’agit de vagues ou de torrents.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Ce titre divin est traduit selon son équivalent français traditionnel et intelligible; la translittération « Shaddaï » est signalée en note.
- source_word: בְּלֶכְתָּם
  choice: lorsqu’ils avançaient
  rationale: L’infinitif construit avec בְּ exprime ici la circonstance temporelle. « Avançaient » décrit naturellement le déplacement des êtres dans la vision.
- source_word: הֲמֻלָּה
  choice: un bruit tumultueux
  rationale: Le nom évoque un vacarme collectif et agité. Cette formulation garde sa force sans introduire une source précise absente du texte.
- source_word: כְּקוֹל מַחֲנֶה
  choice: comme celui d’un camp militaire
  rationale: מַחֲנֶה signifie littéralement « camp » et désigne fréquemment un camp de troupes; « militaire » explicite ce sens probable, tandis que la note conserve le sens plus général.
- source_word: בְּעָמְדָם
  choice: Lorsqu’ils s’arrêtaient
  rationale: La formulation met clairement en contraste leur déplacement et leur immobilité.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: ils laissaient retomber leurs ailes
  rationale: Le hiphil de רפה indique qu’ils relâchaient ou laissaient descendre leurs ailes. « Laissaient retomber » rend ce mouvement avec naturel.
theological_decisions:
- issue: Sens et forme du titre שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Traduire le titre le rend immédiatement compréhensible et suit l’usage biblique français courant, sans transformer cette occurrence en nom propre certain. La note préserve la forme hébraïque.
- issue: Valeur de קוֹל devant שַׁדַּי
  choice: la voix du Tout-Puissant
  alternative: le bruit du Tout-Puissant
  rationale: קוֹל peut désigner aussi bien une voix qu’un son. Avec le titre divin, « voix » est naturel, mais la note maintient l’autre possibilité afin de ne pas imposer l’idée d’un discours articulé.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase conserve l’accumulation sonore et l’intensité de la vision, avec une ponctuation qui rend la longue construction hébraïque lisible.
