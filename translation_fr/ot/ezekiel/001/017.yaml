  source_fidelity: Le texte hébreu dit littéralement que, « sur/vers leurs quatre côtés (ou quartiers), elles allaient » et qu’« elles ne se tournaient pas en allant ». La traduction principale rend bien l’idée générale, mais « dans l’une ou l’autre de leurs quatre directions » introduit une distributivité (« l’une ou l’autre ») qui n’est pas explicitement formulée et atténue l’image spatiale des « côtés/quartiers ».
