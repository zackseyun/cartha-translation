  terminology: Le féminin pluriel convient aux roues (אופנים, sous-entendues dans le contexte, et « roues » en français). « Tournaient » rend sobrement le nifal de סבב sans imposer l’idée plus technique de pivotement. « Côtés » conserve l’ambiguïté spatiale de רבעים; la note signale de façon appropriée l’alternative « directions ».
