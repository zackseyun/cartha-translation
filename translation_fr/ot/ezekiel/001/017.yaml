  yaml_path: translation/ot/ezekiel/001/017.yaml
  text: As they went[a], they went in any of their four directions; they did not turn as they went.
translation:
  language: fr
  text: Quand elles se déplaçaient[a], elles allaient sur l’un quelconque de leurs quatre côtés ; elles ne tournaient pas en avançant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elles avançaient dans l’une quelconque de leurs quatre directions ; elles ne tournaient pas en avançant. » L’expression hébraïque peut désigner leurs quatre côtés ou les quatre directions dans lesquelles elles pouvaient aller.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶן
  choice: dans l’une ou l’autre de leurs quatre directions
  rationale: L’expression désigne littéralement leurs « quatre côtés » ou « quatre quartiers ». Dans ce contexte de déplacement, « quatre directions » exprime naturellement l’orientation possible du mouvement sans imposer une direction particulière.
- source_word: בְּלֶכְתָּם
  choice: quand elles se déplaçaient
  rationale: L’infinitif construit précédé de ב indique une action contemporaine. Cette formulation française rend clairement la valeur temporelle et évite une répétition trop lourde.
- source_word: יֵלֵכוּ
  choice: elles allaient
  rationale: L’imparfait hébreu décrit ici le comportement caractéristique des roues dans la vision. L’imparfait français convient au récit descriptif.
- source_word: לֹא יִסַּבּוּ
  choice: elles ne tournaient pas
  rationale: Le verbe סבב au nifal indique qu’elles ne pivotaient pas ou ne changeaient pas leur orientation pour avancer. « Ne tournaient pas » reste simple et proche de l’hébreu.
- source_word: בְּלֶכְתָּן
  choice: en avançant
  rationale: Cette seconde construction temporelle est rendue de manière idiomatique tout en conservant l’idée qu’aucune rotation n’accompagnait leur mouvement.
