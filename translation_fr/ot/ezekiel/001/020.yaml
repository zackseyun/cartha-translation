source:
  edition: WLC
  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: fr
  text: Partout où l’esprit devait aller[a][b], ils y allaient ; et les roues étaient soulevées à côté d’eux[c], car l’esprit de l’être vivant était dans les roues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent » ou « le souffle » ; le mot hébreu peut avoir l’un ou l’autre de ces sens. Ici, il désigne ce qui anime ou dirige le mouvement dans la vision.
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent ici « l’Esprit », en référence à l’Esprit de Dieu ; l’hébreu ne formule pas explicitement cette identification.
    reason: alternative_reading
  - marker: c
    text: Ou « en face d’eux » ou « en correspondance avec eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: l’esprit
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Dans cette vision, « l’esprit » exprime naturellement le principe qui anime et dirige le mouvement, sans l’identifier explicitement à l’Esprit de Dieu.
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: Partout où
  rationale: Cette tournure rend naturellement la proposition relative indéfinie de lieu et son sens distributif.
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: devait aller… ils y allaient
  rationale: « Devait aller » exprime l’orientation ou la destination indiquée par la construction, sans attribuer trop explicitement une volonté personnelle à l’esprit ; « ils y allaient » rend simplement le mouvement correspondant.
- source_word: שָׁמָּה
  choice: y
  rationale: Le pronom adverbial français « y » rend avec naturel l’adverbe directionnel « là / dans cette direction » après un verbe de mouvement.
- source_word: הָאוֹפַנִּים
  choice: les roues
  rationale: Le terme désigne clairement les roues de la vision.
- source_word: יִנָּשְׂאוּ
  choice: s’élevaient
  rationale: Le verbe français garde l’idée d’un mouvement vers le haut tout en produisant une phrase naturelle ; le niphal hébreu peut ici décrire le fait que les roues sont soulevées ou s’élèvent.
- source_word: לְעֻמָּתָם
  choice: à côté d’eux
  rationale: Dans ce contexte de mouvement coordonné, cette expression rend clairement la position correspondante des roues par rapport aux êtres vivants.
- source_word: הַחַיָּה
  choice: l’être vivant
  rationale: Le singulier français préserve le nombre grammatical de l’hébreu, même si le contexte plus large présente plusieurs êtres vivants.
theological_decisions:
- issue: Faut-il comprendre רוּחַ comme une désignation explicite de l’Esprit de Dieu ?
  choice: « l’esprit », avec une minuscule
  alternative: « l’Esprit »
  rationale: Le texte présente l’esprit comme ce qui anime ou dirige les êtres vivants et les roues, mais ne l’identifie pas explicitement à l’Esprit de Dieu. La minuscule préserve cette réserve et la tension théologique du passage.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste concise et conserve le caractère visionnaire du passage. « Devait aller » évite de résoudre la construction en volonté personnelle trop explicite, tandis que les notes maintiennent l’ambiguïté de רוּחַ et de לְעֻמָּתָם.
