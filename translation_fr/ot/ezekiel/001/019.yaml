source:
  edition: WLC
  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: fr
  text: Quand les êtres vivants avançaient[a], les roues avançaient à côté d’eux ; et quand les êtres vivants étaient soulevés de terre[b], les roues étaient elles aussi soulevées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se déplaçaient » ; l’hébreu emploie le même verbe pour le mouvement coordonné des êtres vivants et des roues.
    reason: lexical_alternative
  - marker: b
    text: Ézéchiel identifie plus loin ces « êtres vivants » comme des chérubins (voir Ézéchiel 10.20).
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת / יֵלְכוּ
  choice: Quand … avançaient
  rationale: La préposition ב avec l’infinitif construit introduit une circonstance temporelle. « Avançaient » exprime naturellement le déplacement coordonné des êtres et des roues tout en rendant le même verbe hébreu par le même verbe français.
- source_word: הַחַיּוֹת
  choice: les êtres vivants
  rationale: Le terme désigne ici les êtres animés de la vision, non des animaux ordinaires. Cette formulation reste générique et n’anticipe pas leur identification ultérieure comme chérubins.
- source_word: הָאוֹפַנִּים
  choice: les roues
  rationale: אופן désigne directement une roue ; le pluriel convient aux roues associées aux êtres de la vision.
- source_word: אֶצְלָם
  choice: à côté d’eux
  rationale: אצל exprime la proximité. Cette formulation courante conserve l’association spatiale étroite entre les roues et les êtres.
- source_word: וּבְהִנָּשֵׂא / יִנָּשְׂאוּ
  choice: quand … s’élevaient / s’élevaient aussi
  rationale: Le pronominal français rend naturellement la forme niphal de נשׂא et la répétition préserve le parallélisme du texte. « Aussi » explicite en français la coordination étroite indiquée par ו sans modifier le rapport entre les mouvements.
- source_word: מֵעַל הָאָרֶץ
  choice: au-dessus de la terre
  rationale: La construction מֵעַל peut évoquer l’éloignement à partir de la surface terrestre ou le mouvement vers une position au-dessus d’elle. Cette formulation conserve mieux cette nuance spatiale que « de la terre », potentiellement ambigu en français.
theological_decisions:
- issue: Identité de הַחַיּוֹת dans la vision d’Ézéchiel
  choice: Conserver « les êtres vivants » dans le texte principal
  alternative: les chérubins
  rationale: Même si Ézéchiel 10.20 identifie plus tard ces êtres comme des chérubins, le présent verset emploie le terme plus général חַיּוֹת. La traduction respecte cette progression de la révélation.
- issue: Agent de l’élévation
  choice: Employer la tournure pronominale « s’élevaient »
  alternative: étaient soulevés
  rationale: Le niphal peut être rendu passivement ou comme un mouvement subi sans agent exprimé. Le français naturel « s’élevaient » laisse l’agent indéterminé et n’affirme pas que le mouvement est autonome.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme et les répétitions verbales du texte hébreu sont maintenus sans lourdeur excessive ; le point-virgule marque les deux mouvements coordonnés.
