  text: וַ/יְהִי ק֕וֹל מֵ/עַ֕ל לָ/רָקִ֖יעַ אֲשֶׁ֣ר עַל רֹאשָׁ֑/ם בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/025.yaml
  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: fr
  text: Alors, il y eut un son[a] venant d’au-dessus de l’étendue qui était au-dessus de leurs têtes. Lorsqu’ils s’arrêtèrent, ils laissèrent retomber leurs ailes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une voix ». Le mot hébreu peut désigner aussi bien un son qu’une voix ; ici, rien n’indique encore explicitement qu’il s’agit de paroles articulées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors, … vint
  rationale: La forme narrative introduit la survenue d’un phénomène. Cette tournure française actuelle marque naturellement la progression du récit sans employer l’archaïque « il advint ».
- source_word: קוֹל
  choice: un son
  rationale: Le nom peut désigner un son, un bruit ou une voix. « Son » conserve ici l’indétermination, puisque cette proposition ne présente pas encore explicitement une parole articulée.
- source_word: מֵעַל לָרָקִיעַ
  choice: d’au-dessus de l’étendue
  rationale: La préposition indique que le son provient d’en haut. « Étendue » restitue l’image spatiale de רָקִיעַ dans un français moderne, sans la connotation cosmologique particulière que peut prendre « firmament ».
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: qui se trouvait au-dessus de leurs têtes
  rationale: La proposition relative qualifie l’étendue et exprime clairement sa position par rapport aux êtres vivants.
- source_word: בְּעָמְדָם
  choice: quand ils s’immobilisaient
  rationale: L’infinitif construit exprime une circonstance temporelle. Dans le contexte alternant mouvement et arrêt, « s’immobilisaient » rend explicitement l’arrêt sans lourdeur.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: ils laissaient retomber leurs ailes
  rationale: Le verbe à la forme causative évoque le relâchement ou l’abaissement des ailes. « Laissaient retomber » exprime naturellement qu’elles n’étaient plus maintenues déployées.
theological_decisions:
- issue: Le phénomène désigné par קוֹל est-il un simple son ou une voix ?
  choice: un son, avec une note signalant « une voix »
  alternative: une voix
  rationale: Le contexte immédiat ne précise pas encore qu’il s’agit d’une parole articulée. Le texte principal maintient donc l’ambiguïté, tandis que la note conserve l’autre sens lexical possible.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et lisible, évite les archaïsmes et conserve l’indétermination du terme hébreu קוֹל.
