  - severity: medium
    issue: Valeur aspectuelle des verbes finaux
    rationale: « Quand ils s’immobilisaient, ils laissaient retomber leurs ailes » présente les actions comme répétées ou en cours. Les formes verbales hébraïques s’inscrivent dans la séquence narrative et se rendent plus fidèlement par « Lorsqu’ils s’arrêtèrent, ils laissèrent retomber leurs ailes ».
  - severity: low
    issue: Rendu de וַיְהִי
    rationale: « Alors, un son vint » est compréhensible, mais « Alors, il y eut un son » reflète plus naturellement la construction existentielle hébraïque et évite de personnifier légèrement le son.
