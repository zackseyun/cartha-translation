  rationale: La révision conserve tous les choix lexicaux substantiels du projet, y compris l’ambiguïté de קוֹל. Elle corrige uniquement la présentation temporelle et aspectuelle afin de rendre la succession narrative du texte hébreu, et elle emploie une tournure française plus naturelle pour l’introduction du phénomène.
