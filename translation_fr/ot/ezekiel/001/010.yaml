source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶם֮ פְּנֵ֣י אָדָם֒ וּ/פְנֵ֨י אַרְיֵ֤ה אֶל הַ/יָּמִין֙ לְ/אַרְבַּעְתָּ֔/ם וּ/פְנֵי שׁ֥וֹר מֵֽ/הַ/שְּׂמֹ֖אול לְ/אַרְבַּעְתָּ֑/ן וּ/פְנֵי נֶ֖שֶׁר לְ/אַרְבַּעְתָּֽ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: fr
  text: Quant à l’aspect de leurs faces, chacun avait une face humaine ; tous les quatre avaient une face de lion du côté droit, une face de taureau du côté gauche et une face d’aigle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vautour » ; le mot hébreu peut désigner plus largement un grand oiseau de proie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: Quant à l’aspect de leurs faces
  rationale: דְּמוּת exprime ici l’apparence ou la forme visible. « Quant à » introduit naturellement la description, tandis que « aspect » évite la lourdeur de « ressemblance de leurs faces ».
- source_word: פְּנֵי אָדָם
  choice: une face humaine
  rationale: אָדָם désigne ici l’être humain par contraste avec les animaux ; « humaine » préserve cette opposition sans introduire une précision masculine absente du contexte.
- source_word: אֶל הַיָּמִין
  choice: du côté droit
  rationale: La locution situe la face de lion à droite. Cette formulation française est naturelle et spatialement claire.
- source_word: לְאַרְבַּעְתָּם / לְאַרְבַּעְתָּן
  choice: tous les quatre avaient
  rationale: Ces formes indiquent que chaque caractéristique s’applique aux quatre êtres. Une seule proposition coordonnée suffit en français à faire porter cette valeur distributive sur les trois faces animales.
- source_word: שׁוֹר
  choice: taureau
  rationale: שׁוֹר désigne un bovin mâle et peut se traduire par « bœuf » ou « taureau ». « Taureau » est précis et naturel dans cette description anatomique, sans supposer un animal châtré.
- source_word: מֵהַשְּׂמֹאול
  choice: du côté gauche
  rationale: Bien que la préposition soit littéralement « depuis », elle a ici une valeur spatiale dans la description de l’orientation des faces.
- source_word: נֶשֶׁר
  choice: aigle
  rationale: נֶשֶׁר désigne un grand rapace et est traditionnellement rendu par « aigle ». Comme il peut aussi renvoyer à un vautour, l’alternative est signalée en note.
theological_decisions:
- issue: Sens de אָדָם dans la description des êtres vivants
  choice: face humaine
  alternative: face d’homme
  rationale: Le contraste porte sur l’espèce humaine face aux espèces animales, non sur le sexe masculin ; « humaine » rend donc le sens sans ajouter de spécificité.
- issue: Identification du grand rapace נֶשֶׁר
  choice: aigle
  alternative: vautour
  rationale: Le terme hébreu ne permet pas toujours de distinguer précisément ces grands rapaces. Le texte principal conserve la traduction courante, tandis que la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque est légèrement resserrée sans perdre le fait que chacun des quatre êtres possède les quatre types de faces.
