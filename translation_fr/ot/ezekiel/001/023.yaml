  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: fr
  text: Et sous l’étendue, leurs ailes étaient droites, l’une vers l’autre[a]. Chacun avait deux ailes qui les couvraient, et chacun avait deux ailes qui couvraient leur corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme vers sa sœur »; l’hébreu emploie des formes féminines parce que le mot « aile » est de genre féminin. Le sens est que les ailes étaient orientées l’une vers l’autre ou se correspondaient. Dans la proposition suivante, le pronom hébreu est également féminin pluriel; sa référence exacte est difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: Sous l’étendue
  rationale: Exprime naturellement la relation spatiale. « Étendue » rend רָקִיעַ dans un français actuel tout en conservant l’image de la voûte déployée.
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  choice: leurs ailes étaient droites
  rationale: Rend directement l’adjectif יְשָׁרוֹת, qui décrit leur rectitude ou leur alignement, sans préciser davantage une orientation que le texte laisse au membre suivant.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: l’une en face de l’autre
  rationale: Cette tournure française naturelle restitue la relation réciproque entre les ailes. L’hébreu dit littéralement « une femme vers sa sœur », selon le genre grammatical féminin de « aile ».
- source_word: לְאִישׁ שְׁתַּיִם
  choice: Chacun en avait deux
  rationale: Le distributif לְאִישׁ signifie ici « pour chacun ». L’ajout idiomatique du verbe « avait » rend en français la proposition nominale hébraïque.
- source_word: מְכַסּוֹת לָהֵנָּה
  choice: qui le couvraient
  rationale: Le participe exprime l’action de couvrir; le pronom distributif singulier français renvoie naturellement à chaque être vivant.
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: son corps
  rationale: Dans le contexte d’êtres vivants, גְּוִיָּה désigne le corps et non un cadavre. Le singulier distributif s’accorde avec « chacun ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « chacun en avait deux » conserve la structure distributive insistante de l’hébreu. « Étendue » est préféré à « firmament », plus traditionnel mais moins courant.
