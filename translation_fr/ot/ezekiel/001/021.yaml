id: EZK.1.21
reference: Ezekiel 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: fr
  text: Quand ils avançaient, les roues avançaient ; quand ils restaient immobiles, elles restaient immobiles ; et quand ils étaient soulevés au-dessus de la terre, les roues étaient soulevées à côté d’eux[b], car l’esprit[a] des êtres vivants[c] était dans les roues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle » ou « le vent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en face d’eux » ou « en correspondance avec eux ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « l’être vivant » au singulier, peut-être avec un sens collectif désignant les êtres vivants comme une réalité unifiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: Quand ils avançaient, les roues avançaient
  rationale: La construction ב avec l’infinitif construit a une valeur temporelle. « Avançaient » exprime naturellement le déplacement dans cette vision, et la mention explicite des roues évite en français une succession de pronoms ambigus.
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: quand ils restaient immobiles, elles restaient immobiles
  rationale: עמד signifie se tenir debout ou demeurer en place. « Rester immobile » convient aux êtres et aux roues tout en conservant le parallélisme et sans réduire le sens au seul fait de s’arrêter.
- source_word: וּבְהִנָּשְׂאָם ... יִנָּשְׂאוּ
  choice: quand ils étaient soulevés ... les roues étaient soulevées
  rationale: Le nifal de נשׂא est rendu par une forme passive répétée, conformément à la structure hébraïque et à l’imagerie de la vision.
- source_word: מֵעַל הָאָרֶץ
  choice: au-dessus de la terre
  rationale: Cette expression conserve l’idée d’une élévation par rapport à la surface terrestre sans la formulation peu naturelle « de dessus la terre ».
- source_word: לְעֻמָּתָם
  choice: à côté d’eux
  rationale: Dans ce contexte de mouvement coordonné, cette formulation française indique la position correspondante des roues. Les sens plus strictement spatiaux sont signalés en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication du mouvement synchronisé.
- source_word: רוּחַ
  choice: l’esprit
  rationale: רוּחַ peut désigner l’esprit, le souffle ou le vent. Ici, « esprit » rend au mieux le principe qui anime les êtres et les roues, sans l’identifier explicitement à l’Esprit saint.
- source_word: הַחַיָּה
  choice: des êtres vivants
  rationale: Le nom hébreu est morphologiquement singulier, mais il paraît avoir ici une valeur collective renvoyant aux êtres vivants de la vision. Le pluriel est naturel en français, tandis que la forme source est conservée en note.
- source_word: בָּאוֹפַנִּים
  choice: était dans les roues
  rationale: La préposition ב indique directement la présence à l’intérieur ou au sein des roues.
theological_decisions:
- issue: Sens de רוּחַ dans la vision
  choice: l’esprit
  alternative: le souffle ; le vent
  rationale: « Esprit » convient au rôle d’animation décrit par le contexte, mais la polyvalence du terme hébreu est maintenue dans une note afin d’éviter une identification doctrinale plus précise que le texte.
- issue: Nombre de הַחַיָּה
  choice: des êtres vivants
  alternative: de l’être vivant
  rationale: Le pluriel traduit le référent collectif vraisemblable et s’intègre naturellement au récit. Une note signale toutefois que l’hébreu porte le singulier, ce qui préserve l’éventuelle représentation des êtres comme une réalité unifiée.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme du texte hébreu est maintenu, avec des reprises nominales et l’accord des pronoms (« ils » pour les êtres, « elles » pour les roues) afin d’éviter l’ambiguïté en français. Les formes passives répétées préservent la cohésion de l’image visionnaire.
