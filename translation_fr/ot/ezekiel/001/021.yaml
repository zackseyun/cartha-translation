  verdict: approve
  source_fidelity: 'Le texte rend fidèlement le parallélisme de l’hébreu : le mouvement et l’arrêt synchronisés des êtres vivants et des roues, puis leur élévation commune. « Étaient soulevés » préserve utilement la forme passive répétée de נָשָׂא. « Au-dessus de la terre » exprime de façon naturelle la position indiquée par מֵעַל הָאָרֶץ, sans prétendre résoudre plus précisément la nuance spatiale. L’explicitation de « les roues » dans la première proposition est justifiée par le contexte immédiat et évite une ambiguïté française.'
  naturalness: Le français est moderne, clair et de registre approprié. La répétition structurée de « avançaient », « restaient immobiles » et « étaient soulevées » restitue bien l’effet parallèle du texte source. Les accords pronominaux distinguent nettement les êtres vivants (« ils ») des roues (« elles »).
  terminology: « Esprit » rend correctement רוּחַ sans identification doctrinale indue, et la note préserve les possibilités « souffle » et « vent ». « Êtres vivants » est idiomatique dans ce contexte visionnaire ; la note indique correctement que l’hébreu emploie le singulier collectif הַחַיָּה. « À côté d’eux » est une contextualisation recevable de לְעֻמָּתָם, dont les autres nuances spatiales sont signalées en note.
