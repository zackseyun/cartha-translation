  naturalness: Le français est globalement naturel, lisible et d’un registre biblique moderne approprié. « Nuage » est plus courant et international que « nuée » tout en gardant ici le même sens.
  terminology: « Arc-en-ciel », « éclat », « gloire » et « Yahweh » conviennent. La formulation qualifiée de la manifestation divine est correctement conservée, sans surinterprétation théologique.
