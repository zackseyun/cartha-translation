  text: כְּ/מַרְאֵ֣ה הַ/קֶּ֡שֶׁת אֲשֶׁר֩ יִֽהְיֶ֨ה בֶ/עָנָ֜ן בְּ/י֣וֹם הַ/גֶּ֗שֶׁם כֵּ֣ן מַרְאֵ֤ה הַ/נֹּ֨גַהּ֙ סָבִ֔יב ה֕וּא מַרְאֵ֖ה דְּמ֣וּת כְּבוֹד יְהוָ֑ה וָֽ/אֶרְאֶה֙ וָ/אֶפֹּ֣ל עַל פָּנַ֔/י וָ/אֶשְׁמַ֖ע ק֥וֹל מְדַבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: fr
  text: Comme l’aspect de l’arc-en-ciel[a] qui apparaît dans le nuage un jour de pluie, tel était l’aspect de l’éclat tout autour. C’était l’aspect de la ressemblance de la gloire de Yahweh[b]. À cette vue, je tombai face contre terre et j’entendis une voix parler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’arc » ; dans ce contexte de nuage et de pluie, il s’agit de l’arc-en-ciel.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit bien : « l’aspect de la ressemblance de la gloire de Yahweh », en maintenant plusieurs degrés de qualification dans le récit de la vision.'
    reason: cultural_note
  - marker: c
    text: 'Autre traduction possible : « j’entendis la voix de quelqu’un qui parlait ». L’hébreu n’identifie pas explicitement le locuteur dans cette proposition.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה
  choice: Comme l’aspect de
  rationale: « Aspect » rend le caractère visible de מַרְאֶה et permet de conserver la répétition caractéristique du récit de vision d’Ézéchiel.
- source_word: הַקֶּשֶׁת
  choice: l’arc-en-ciel
  rationale: Le nom signifie littéralement « arc », mais la mention de la nuée et de la pluie désigne clairement ici l’arc-en-ciel en français moderne.
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: qui se forme dans la nuée un jour de pluie
  rationale: Cette formulation française naturelle décrit l’apparition de l’arc-en-ciel sans ajouter de cause étrangère au contexte. « Nuée » garde le registre élevé et la référence au nuage singulier.
- source_word: כֵּן מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: tel était l’aspect de l’éclat tout autour
  rationale: « Éclat » exprime la lumière brillante de נֹגַהּ, tandis que « tout autour » rend סָבִיב et la disposition enveloppante de la lumière.
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: l’aspect de la ressemblance de la gloire de Yahweh
  rationale: La succession volontaire des termes « aspect », « ressemblance » et « gloire » est conservée afin de respecter les degrés de qualification du texte visionnaire.
- source_word: וָאֶפֹּל עַל פָּנַי
  choice: je tombai face contre terre
  rationale: Cette expression française rend naturellement l’action de se prosterner exprimée littéralement par « tomber sur son visage ».
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: j’entendis une voix parler
  rationale: La construction reste concise et ne précise pas l’identité de celui qui parle, laquelle n’est pas explicitée dans ce membre de phrase hébreu.
theological_decisions:
- issue: Description à plusieurs niveaux de la manifestation divine
  choice: l’aspect de la ressemblance de la gloire de Yahweh
  alternative: la ressemblance de la gloire de Yahweh
  rationale: Le texte hébreu accumule מַרְאֵה, דְּמוּת et כָּבוֹד. Conserver les trois notions maintient la retenue théologique du récit, qui ne présente pas la vision comme une saisie directe de l’essence divine.
- issue: Identification de celui qui parle
  choice: une voix parler
  alternative: la voix de celui qui parlait
  rationale: Le participe מְדַבֵּר ne nomme pas explicitement le locuteur dans cette proposition. La traduction choisie préserve cette indétermination.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. Les répétitions d’« aspect » et l’expression fortement qualifiée concernant la gloire divine sont intentionnellement conservées.
