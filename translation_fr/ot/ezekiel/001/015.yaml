id: EZK.1.15
reference: Ezekiel 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֵ֖רֶא הַ/חַיּ֑וֹת וְ/הִנֵּה֩ אוֹפַ֨ן אֶחָ֥ד בָּ/אָ֛רֶץ אֵ֥צֶל הַ/חַיּ֖וֹת לְ/אַרְבַּ֥עַת פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: fr
  text: 'Je regardai les êtres vivants : voici qu’une roue se trouvait sur la terre, à côté des êtres vivants, pour chacune de leurs quatre faces[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « correspondant à ses quatre faces ». L’expression hébraïque est concise et peut décrire la position de la roue par rapport aux quatre faces de chaque être vivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Je regardai
  rationale: Le verbe fait progresser le récit visionnaire tout en conservant le témoignage visuel à la première personne.
- source_word: הַחַיּוֹת
  choice: les êtres vivants
  rationale: Cette expression rend le caractère animé de ces figures sans préciser leur identité au-delà de ce qu’affirme le passage.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: La formule attire brusquement l’attention sur un nouvel élément de la vision et garde sa vivacité en français moderne.
- source_word: אוֹפַן אֶחָד
  choice: une roue
  rationale: Dans ce contexte, אֶחָד individualise la roue; le français idiomatique exprime cette valeur par l’article indéfini, tandis que la relation distributive apparaît à la fin du verset.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: La traduction conserve le sens spatial direct du nom אֶרֶץ et situe la roue au niveau terrestre dans la vision.
- source_word: אֵצֶל
  choice: à côté de
  rationale: Cette locution exprime clairement la proximité indiquée par la préposition hébraïque.
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: pour chacune de leurs quatre faces
  rationale: 'Le suffixe singulier après le pluriel « êtres vivants » peut avoir une valeur distributive: chaque être vivant possède quatre faces. La formulation française explicite cette relation tout en signalant en note la concision et l’ambiguïté de l’hébreu.'
theological_decisions:
- issue: Référent et nombre dans לְאַרְבַּעַת פָּנָיו
  choice: 'Compréhension distributive: « pour chacune de leurs quatre faces »'
  alternative: « correspondant à ses quatre faces » ou « du côté de ses quatre faces »
  rationale: Le suffixe singulier peut renvoyer distributivement à chaque être vivant mentionné au pluriel. Le contexte immédiat attribue quatre faces à chacun, mais la construction hébraïque reste compacte; la note conserve donc les autres rapports possibles sans imposer une structure plus précise à la vision.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » conserve la force visionnaire sans archaïsme excessif; « êtres vivants » évite de surinterpréter leur identité. La ponctuation met en relief l’apparition soudaine de la roue.
