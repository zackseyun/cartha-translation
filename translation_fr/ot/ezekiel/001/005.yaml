source:
  edition: WLC
  text: וּ/מִ֨/תּוֹכָ֔/הּ דְּמ֖וּת אַרְבַּ֣ע חַיּ֑וֹת וְ/זֶה֙ מַרְאֵֽי/הֶ֔ן דְּמ֥וּת אָדָ֖ם לָ/הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: fr
  text: 'Du milieu d’elle apparut une ressemblance de quatre êtres vivants[a]. Voici quel était leur aspect : ils avaient une ressemblance humaine[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quatre créatures vivantes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la ressemblance d’un être humain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: Du milieu de celle-ci
  rationale: Cette formulation conserve le sens spatial de « depuis son milieu ». Le pronom féminin renvoie au phénomène décrit au verset précédent, sans le nommer de façon plus précise que l’hébreu.
- source_word: דְּמוּת
  choice: quelque chose qui ressemblait à / une apparence
  rationale: דְּמוּת exprime une ressemblance plutôt qu’une identification directe. Ces formulations françaises naturelles maintiennent la réserve caractéristique du langage visionnaire d’Ézéchiel.
- source_word: אַרְבַּע חַיּוֹת
  choice: quatre êtres vivants
  rationale: חַיּוֹת désigne ici des êtres animés vus dans la vision. « Êtres vivants » évite de les réduire à des animaux ou de les identifier d’emblée à une catégorie angélique.
- source_word: וְזֶה מַרְאֵיהֶן
  choice: Voici quel était leur aspect
  rationale: מַרְאֶה désigne ce qui est visible, l’aspect ou l’apparence. La tournure choisie est claire, actuelle et digne.
- source_word: דְּמוּת אָדָם
  choice: une apparence humaine
  rationale: אָדָם renvoie ici à la forme humaine en général, non nécessairement à un individu masculin. « Apparence humaine » restitue le sens sans surinterpréter le genre.
- source_word: לָהֵנָּה
  choice: ils avaient
  rationale: La construction signifie littéralement « était à eux ». Le français exprime naturellement cette possession prédicative par « ils avaient ».
theological_decisions:
- issue: Définition ontologique des figures de la vision
  choice: Conserver le langage de ressemblance et traduire חַיּוֹת par « êtres vivants »
  alternative: Identifier explicitement ces figures comme des anges ou employer simplement « créatures »
  rationale: Le verset décrit ce qui apparaît au prophète sans définir pleinement la nature de ces êtres. La traduction maintient cette retenue et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque de דְּמוּת est rendue par deux expressions apparentées plutôt que par une répétition lourde de « ressemblance », tout en conservant l’idée centrale d’analogie visuelle.
