  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
translation:
  language: fr
  text: Leurs faces et leurs ailes étaient séparées vers le haut[a] ; chacun avait deux ailes jointes à celles d’un autre[b], et deux qui couvraient son corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient déployées vers le haut ». Le verbe hébreu signifie d’abord « être séparé, divisé », mais le contexte peut évoquer des ailes étendues vers le haut.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la formulation est très concise : « pour chacun, deux jointes, chacun, et deux couvrant leurs corps ». La répétition de « chacun » et le rapport exact entre les ailes jointes sont difficiles à rendre avec certitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְנֵיהֶם
  choice: leurs faces
  rationale: Le nom פָּנִים est de forme plurielle et le contexte décrit les faces multiples des quatre êtres vivants. « Faces » conserve cette pluralité sans l’aplanir.
- source_word: וְכַנְפֵיהֶם
  choice: leurs ailes
  rationale: Traduction courante de כָּנָף dans la description de ces êtres visionnaires.
- source_word: פְּרֻדוֹת
  choice: étaient séparées
  rationale: Le participe issu de פרד exprime d’abord l’idée d’être séparé ou divisé. Cette formulation en conserve le noyau lexical, tout en laissant en note la possibilité contextuelle d’ailes déployées.
- source_word: מִלְמָעְלָה
  choice: vers le haut
  rationale: La locution indique ici la position ou l’orientation supérieure de la séparation. « Vers le haut » est idiomatique dans cette description spatiale.
- source_word: לְאִישׁ
  choice: chacun avait
  rationale: אִישׁ a ici une valeur distributive. L’ajout de « avait » explicite naturellement en français la proposition descriptive sans modifier son sens.
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  choice: deux ailes qui se rejoignaient à celles d’un autre
  rationale: חבר signifie joindre ou relier. La formulation rend le rapport réciproque entre les ailes des êtres et explicite « ailes », sous-entendu en hébreu.
- source_word: וּשְׁתַּיִם מְכַסּוֹת
  choice: et deux qui couvraient
  rationale: Le participe décrit une action continue dans la scène. L’imparfait français convient à cette description visionnaire.
- source_word: אֵת גְּוִיֹתֵיהֶנָה
  choice: son corps
  rationale: גְּוִיָּה désigne ici le corps. Le singulier distributif français s’accorde naturellement avec « chacun », tandis que l’hébreu emploie le pluriel référant à l’ensemble des êtres.
