source:
  edition: WLC
  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: fr
  text: Leurs jambes étaient droites ; la plante de leurs pieds était comme celle du pied d’un veau[a] ; ces jambes étincelaient comme du bronze poli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus idiomatiquement, « comme un sabot de veau ». L’hébreu dit plus littéralement « comme la plante du pied d’un veau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du bronze lustré » ; le terme peut aussi désigner du cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: leurs jambes
  rationale: רֶגֶל peut désigner le pied ou la jambe. Comme la proposition suivante mentionne distinctement la plante de leurs pieds, « jambes » préserve ici cette distinction.
- source_word: רֶגֶל יְשָׁרָה
  choice: étaient droites
  rationale: Le singulier hébreu a une valeur distributive ou collective. « Droites » rend simplement יְשָׁרָה sans préciser indûment s’il s’agit de posture ou de forme.
- source_word: כַּף רַגְלֵיהֶם
  choice: la plante de leurs pieds
  rationale: Dans ce contexte anatomique, כַּף désigne la plante du pied. Le singulier collectif français reflète naturellement la formulation hébraïque.
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: ressemblait à celle du pied d’un veau
  rationale: Cette formulation conserve la comparaison anatomique explicite de l’hébreu entre la plante de leurs pieds et celle du pied d’un veau, sans la réduire directement au sabot.
- source_word: וְנֹצְצִים
  choice: elles étincelaient
  rationale: Le participe évoque un éclat vif ou scintillant. Le féminin pluriel reprend naturellement « jambes », antécédent syntaxique le plus proche dans la description.
- source_word: כְּעֵין
  choice: comme
  rationale: Dans cette comparaison visuelle, le français naturel « comme » exprime suffisamment le sens d’apparence porté par עֵין, sans lourdeur.
- source_word: נְחֹשֶׁת קָלָל
  choice: du bronze poli
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze, tandis que קָלָל évoque ici un métal poli ou rendu brillant. « Bronze poli » est clair, digne et traditionnel sans être archaïque.
