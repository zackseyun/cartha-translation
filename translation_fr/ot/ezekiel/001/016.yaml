base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: fr
  text: L’aspect des roues et la façon dont elles étaient faites étaient comme l’éclat d’une pierre précieuse de tarshish[a]. Toutes les quatre avaient la même forme. Leur aspect et la façon dont elles étaient faites étaient comme lorsqu’une roue est à l’intérieur d’une autre roue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : tarshish, pierre précieuse dont l’identification exacte est incertaine ; traditionnellement aussi traduit par « béryl » ou « chrysolithe ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: L’aspect des roues
  rationale: מַרְאֶה désigne ici ce qui est visible, l’apparence. « Aspect » convient au registre visionnaire et reste naturel en français.
- source_word: וּמַעֲשֵׂיהֶם
  choice: et leur structure
  rationale: מַעֲשֶׂה peut désigner l’ouvrage, la fabrication ou la manière dont une chose est construite. « Structure » décrit clairement la configuration visible des roues sans supposer un artisan explicitement mentionné.
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: comme l’éclat d’une pierre de Tarsis
  rationale: עֵין exprime ici l’aspect visuel, notamment la couleur ou l’éclat. L’identification minéralogique de תַּרְשִׁישׁ étant incertaine, la translittération géographique traditionnelle évite une précision injustifiée, avec une note explicative.
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: Toutes les quatre avaient la même forme
  rationale: La formulation hébraïque, littéralement « une seule ressemblance pour les quatre », souligne que les quatre roues étaient semblables. Cette formulation française en restitue clairement le sens.
- source_word: וּמַרְאֵיהֶם וּמַעֲשֵׂיהֶם
  choice: Leur aspect et leur structure
  rationale: La répétition des mêmes termes hébreux est conservée afin de préserver le parallélisme descriptif.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: comme si une roue se trouvait au milieu d’une autre roue
  rationale: La tournure conserve la comparaison et l’ambiguïté spatiale du texte, sans imposer une reconstruction mécanique précise.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le rythme descriptif et la répétition de « leur aspect et leur structure » sont maintenus. « Pierre de Tarsis » préserve l’incertitude du nom de la gemme, explicitée en note.
