  source_fidelity: La traduction rend fidèlement la formule de date, la situation d’Ézéchiel parmi les exilés, le toponyme Kebar et l’ambiguïté de « visions de Dieu ». Toutefois, « les cieux s’ouvrirent » exprime en français une ouverture intransitive/spontanée, alors que נִפְתְּחוּ est au passif (« furent ouverts »).
