language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: fr
  text: Il arriva, la trentième année, au quatrième mois, le cinquième jour du mois, alors que j’étais parmi les exilés près du fleuve Kebar[a], que les cieux furent ouverts et que je vis des visions de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du canal Kebar ». L’hébreu dit « fleuve Kebar », mais ce cours d’eau était peut-être un grand canal de Babylonie.
    reason: cultural_note
  - marker: b
    text: Ou « des visions divines » ou « des visions venant de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva
  rationale: Cette formule narrative introduit le récit. « Il arriva » en conserve la fonction sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: la trentième année
  rationale: La tournure constitue une indication de date. L’ordinal français rend naturellement cet emploi idiomatique.
- source_word: בָּרְבִיעִי
  choice: au quatrième mois
  rationale: Le mot « mois » est sous-entendu dans la formule hébraïque et doit être explicité en français pour que la date soit claire.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: le cinquième jour du mois
  rationale: Il s’agit de la formule hébraïque habituelle pour indiquer le jour du mois; « jour » est implicite dans la source.
- source_word: וַאֲנִי
  choice: alors que j’étais
  rationale: Le pronom introduit ici la situation dans laquelle se trouve le narrateur. Cette formulation restitue naturellement la valeur circonstancielle de la proposition.
- source_word: בְתוֹךְ הַגּוֹלָה
  choice: parmi les exilés
  rationale: L’expression situe Ézéchiel au milieu de la communauté déportée. « Exilés » est clair, courant et adapté au registre du passage.
- source_word: עַל נְהַר כְּבָר
  choice: près du fleuve Kebar
  rationale: La préposition indique la proximité du cours d’eau. « Fleuve » traduit directement נְהַר, tandis qu’une note conserve l’identification possible comme canal babylonien.
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: les cieux s’ouvrirent
  rationale: Cette formulation française conserve le pluriel et le registre visionnaire de l’hébreu tout en rendant naturellement la forme passive.
- source_word: וָאֶרְאֶה
  choice: et que je vis
  rationale: La coordination poursuit simplement la séquence narrative entre l’ouverture des cieux et la perception du prophète.
- source_word: מַרְאוֹת אֱלֹהִים
  choice: des visions de Dieu
  rationale: Ce calque naturel préserve l’ambiguïté du groupe construit hébreu quant au contenu, à la qualité ou à la provenance des visions.
theological_decisions:
- issue: Valeur du génitif dans מַרְאוֹת אֱלֹהִים
  choice: des visions de Dieu
  alternative: des visions divines; des visions venant de Dieu
  rationale: La construction hébraïque permet plusieurs rapports entre Dieu et les visions. Le texte principal conserve cette ambiguïté au lieu de préciser qu’elles viennent de Dieu ou qu’elles sont simplement de nature divine.
translation_notes:
  register: Français international moderne, digne et lisible. La structure « Il arriva… que… » maintient la solennité narrative sans archaïsme marqué. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
