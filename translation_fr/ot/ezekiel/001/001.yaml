    issue: La voix passive de נִפְתְּחוּ n’est pas explicitement rendue.
    rationale: « Les cieux s’ouvrirent » est une tournure française idiomatique, mais elle atténue le passif hébreu. « Les cieux furent ouverts » rend la forme source sans imposer d’agent.
