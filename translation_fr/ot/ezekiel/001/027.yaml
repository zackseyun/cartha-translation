  text: וָ/אֵ֣רֶא כְּ/עֵ֣ין חַשְׁמַ֗ל כְּ/מַרְאֵה אֵ֤שׁ בֵּֽית לָ/הּ֙ סָבִ֔יב מִ/מַּרְאֵ֥ה מָתְנָ֖י/ו וּ/לְ/מָ֑עְלָ/ה וּ/מִ/מַּרְאֵ֤ה מָתְנָי/ו֙ וּ/לְ/מַ֔טָּה רָאִ֨יתִי֙ כְּ/מַרְאֵה אֵ֔שׁ וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִֽיב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: fr
  text: Et je vis quelque chose comme l’éclat d’un métal incandescent[a], comme l’aspect d’un feu à l’intérieur, tout autour[b], à partir de ce qui semblait être sa taille, vers le haut ; et à partir de ce qui semblait être sa taille, vers le bas, je vis quelque chose comme l’aspect d’un feu, et une lumière éclatante tout autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu חַשְׁמַל (hashmal) est rare et son sens demeure incertain. On peut aussi le traduire par « ambre » ou « électrum », un alliage métallique brillant.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque rendue par « à l’intérieur, tout autour » est difficile. Elle peut évoquer un feu présent à l’intérieur, ou un feu entouré d’une sorte d’enveloppe lumineuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵין חַשְׁמַל
  choice: comme l’éclat d’un métal incandescent
  rationale: La comparaison préserve la réserve propre au langage visionnaire. Le terme rare חַשְׁמַל est incertain; cette formulation évoque une matière métallique lumineuse sans imposer «ambre» ou le terme technique «électrum».
- source_word: כְּמַרְאֵה
  choice: comme l’aspect de / ce qui paraissait être
  rationale: Le mot décrit une apparence perçue, non une identification directe. Une légère variation en français évite une répétition pesante tout en maintenant cette distance phénoménologique.
- source_word: אֵשׁ
  choice: feu
  rationale: Équivalent courant et direct dans ce contexte visionnaire.
- source_word: בֵּית לָהּ סָבִיב
  choice: qui l’enveloppait de toutes parts
  rationale: L’expression hébraïque est difficile et évoque littéralement un intérieur ou une enveloppe tout autour. Cette traduction reste lisible tout en signalant un feu entourant ou enveloppant la figure; l’incertitude est explicitée en note.
- source_word: מָתְנָיו
  choice: sa taille
  rationale: «Taille» est naturel en français moderne et convient à la description corporelle, contrairement à «reins», plus traditionnel mais ambigu aujourd’hui.
- source_word: וּלְמָעְלָה / וּלְמַטָּה
  choice: jusqu’en haut / jusqu’en bas
  rationale: Cette paire rend clairement la symétrie spatiale du texte hébreu dans un français naturel.
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: avec une clarté tout autour de lui
  rationale: נֹגַהּ désigne une lumière éclatante ou une clarté. Le masculin «lui» reflète le suffixe hébreu et renvoie à la figure d’apparence humaine.
theological_decisions:
- issue: Référent de la description anthropomorphique
  choice: Employer «sa taille» et «autour de lui» conformément aux suffixes masculins singuliers.
  alternative: Employer des formulations impersonnelles telles que «sa partie médiane» et «autour de cela».
  rationale: Le contexte immédiat présente une forme d’apparence humaine et l’hébreu emploie le masculin singulier. La traduction conserve donc l’imagerie anthropomorphique sans identifier davantage la figure.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les comparaisons répétées et la réserve du récit visionnaire, tout en allégeant les répétitions qui seraient artificielles en français.
