    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque rendue par « à l’intérieur, tout autour » est difficile. Elle peut évoquer un feu présent à l’intérieur, ou un feu entouré d’une sorte d’enveloppe lumineuse.
    reason: lexical_alternative
  revision_rationale: La révision évite de présenter comme certaine une relation spatiale que l’hébreu formule de manière obscure, tout en conservant le caractère comparatif et hésitant de la vision. Elle rapproche aussi l’appel de note de l’expression qu’il explique et renforce légèrement le rendu de la radiance finale.
