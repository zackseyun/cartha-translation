  text: בַּ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ הִ֚יא הַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֔ית לְ/גָל֖וּת הַ/מֶּ֥לֶךְ יוֹיָכִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/002.yaml
  text: On the fifth day of the month—it was the fifth year of the exile of King Jehoiachin—[a]
translation:
  language: fr
  text: Le cinquième jour du mois — c’était la cinquième année de l’exil du roi Joïakin —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la déportation du roi Joïakin ». Le mot hébreu גָּלוּת peut désigner l’exil ou la déportation ; « exil » a été retenu comme terme plus large et plus naturel dans ce repère chronologique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה
  choice: Le cinquième jour
  rationale: Dans cette formule de datation, la préposition ב suivie du cardinal « cinq » signifie idiomatiquement « le cinquième jour » ; « jour » est explicité en français.
- source_word: לַ/חֹדֶשׁ
  choice: du mois
  rationale: Dans les formules calendaires hébraïques, ל + חֹדֶשׁ complète naturellement l’expression « le cinquième jour du mois ».
- source_word: הִיא
  choice: c’était
  rationale: Le pronom indépendant a ici une fonction de reprise explicative ou emphatique ; « c’était » en restitue la valeur dans un français naturel.
- source_word: הַ/שָּׁנָה הַ/חֲמִישִׁית
  choice: la cinquième année
  rationale: Traduction directe et claire de l’expression ordinale de datation.
- source_word: לְ/גָלוּת
  choice: de l’exil
  rationale: גָלוּת peut désigner l’exil ou la déportation. « Exil » conserve le sens plus large de l’état d’éloignement et convient naturellement comme repère chronologique.
- source_word: הַ/מֶּלֶךְ
  choice: du roi
  rationale: Devant le nom propre, le titre royal s’intègre naturellement en français sous la forme « du roi Joïakin ».
- source_word: יוֹיָכִין
  choice: Joïakin
  rationale: Forme française biblique courante du nom propre, avec tréma pour signaler la prononciation distincte des voyelles.
