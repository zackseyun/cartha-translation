base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: fr
  text: Quant à leurs jantes, elles étaient hautes et redoutables[a] ; les jantes des quatre roues étaient pleines d’yeux tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrifiantes » ; le terme hébreu désigne ce qui inspire la crainte ou l’effroi.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: leurs jantes / les jantes
  rationale: Dans le contexte des roues, le terme désigne leur partie extérieure. « Jantes » est clair et actuel, tandis que « dos » ou « côtés » rendraient moins nettement l’image.
- source_word: גֹבַהּ
  choice: hautes
  rationale: Le nom hébreu exprime la hauteur ; une tournure prédicative est naturelle en français et conserve le parallélisme descriptif.
- source_word: יִרְאָה
  choice: redoutables
  rationale: Le terme évoque ce qui inspire la crainte ou l’effroi. « Redoutables » garde cette force sans suggérer nécessairement la terreur absolue ni le sens affaibli que peut prendre « impressionnantes ».
- source_word: לָהֶם
  choice: elles étaient
  rationale: La construction hébraïque avec ל est rendue idiomatiquement en français par une proposition attributive.
- source_word: מְלֵאֹת עֵינַיִם
  choice: couvertes d’yeux
  rationale: Bien que la formulation soit littéralement « pleines d’yeux », « couvertes d’yeux » décrit naturellement en français des yeux répartis sur la surface tout en conservant l’étrangeté de la vision.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression française courante restitue la disposition circulaire et complète.
- source_word: לְאַרְבַּעְתָּן
  choice: des quatre roues
  rationale: Le féminin pluriel renvoie aux quatre roues du contexte. L’explicitation de « roues » évite en français une référence flottante et conserve le sens distributif.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme centré sur les jantes est conservé, de même que l’image saisissante des yeux répartis tout autour.
