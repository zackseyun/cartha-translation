source:
  edition: WLC
  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: fr
  text: Quant à la forme des êtres vivants, leur aspect était celui de braises ardentes[a], semblable à celui de torches. Cela[b] se déplaçait parmi les êtres vivants. Le feu rayonnait[c], et du feu jaillissait un éclair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des braises de feu brûlantes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom hébreu est féminin singulier. Il peut renvoyer à l’apparence qui vient d’être décrite ou au phénomène de feu; on peut aussi traduire : « Cela allait et venait parmi les êtres vivants. »'
    reason: textual_ambiguity
  - marker: c
    text: 'Littéralement : « et une clarté était au feu »; autrement dit, le feu diffusait une vive lumière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת מַרְאֵיהֶם
  choice: Quant à la forme des êtres vivants, leur aspect était
  rationale: Cette formulation conserve les deux termes descriptifs דְמוּת (« forme, ressemblance ») et מַרְאֶה (« aspect, apparence »), tout en restant naturelle en français.
- source_word: כְּגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: comme des braises ardentes
  rationale: « Braises ardentes » exprime naturellement à la fois les braises de feu et leur combustion active; la tournure plus littérale est signalée en note.
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: semblable à celui de torches
  rationale: Le pronom « celui » reprend « aspect » et conserve la seconde comparaison introduite par מַרְאֵה.
- source_word: מִתְהַלֶּכֶת בֵּין הַחַיּוֹת
  choice: circulait parmi les êtres vivants
  rationale: Le hitpael de הלך évoque un mouvement continu ou répété; « circulait parmi » est idiomatique sans imposer une trajectoire précise.
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: Le feu rayonnait
  rationale: Cette formulation française exprime de façon concise la relation prédicative littérale, « une clarté était au feu ».
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: du feu jaillissaient des éclairs
  rationale: « Jaillissaient » rend le mouvement continu et vif du participe יוֹצֵא. Le pluriel français exprime naturellement le phénomène collectif désigné par le singulier בָרָק.
theological_decisions:
- issue: Référent du pronom féminin singulier הִיא
  choice: « Cela » conserve un référent volontairement indéterminé.
  alternative: « Le feu circulait » ou « l’apparence circulait »
  rationale: Le contexte suggère le phénomène de feu ou l’apparence décrite, mais ne permet pas de préciser absolument l’antécédent. Le neutre français « cela » préserve cette ambiguïté sans personnifier le phénomène.
translation_notes:
  register: Français international moderne, clair et digne. La répétition descriptive du texte hébreu est maintenue sans lourdeur excessive. Les termes traditionnels mais accessibles « êtres vivants », « braises », « torches » et « éclairs » conviennent au registre visionnaire.
