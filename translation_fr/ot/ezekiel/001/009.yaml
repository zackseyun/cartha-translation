  text: חֹֽבְרֹ֛ת אִשָּׁ֥ה אֶל אֲחוֹתָ֖/הּ כַּנְפֵי/הֶ֑ם לֹא יִסַּ֣בּוּ בְ/לֶכְתָּ֔/ן אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: fr
  text: Leurs ailes étaient jointes l’une à l’autre[a]. Quand ils avançaient, ils ne se détournaient pas ; chacun allait droit devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une femme vers sa sœur », tournure qui désigne ici des ailes correspondantes jointes les unes aux autres.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chacun allait dans la direction de son visage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבְרֹת
  choice: étaient jointes
  rationale: Le participe passif de חבר exprime ici l’état d’éléments joints ou reliés. « Étaient jointes » est naturel en français et conserve cette valeur stative.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: l’une à l’autre
  rationale: L’expression signifie littéralement « une femme vers sa sœur » et décrit idiomatiquement des éléments féminins correspondants ; « l’une à l’autre » s’accorde naturellement avec « ailes ».
- source_word: כַּנְפֵיהֶם
  choice: leurs ailes
  rationale: Traduction directe du nom avec son suffixe possessif ; le groupe est placé en tête comme sujet pour produire une phrase française naturelle.
- source_word: לֹא יִסַּבּוּ
  choice: ils ne se détournaient pas
  rationale: Dans le contexte du déplacement, סבב indique qu’ils ne tournaient ni ne changeaient de direction. L’imparfait convient à la description continue de la vision.
- source_word: בְּלֶכְתָּן
  choice: quand ils avançaient
  rationale: L’infinitif construit précédé de ב indique une action contemporaine. « Quand ils avançaient » restitue clairement cette relation temporelle.
- source_word: אִישׁ
  choice: chacun
  rationale: Le terme a ici une fonction distributive et renvoie à chacun des êtres vivants, sans qu’il soit nécessaire d’insister sur le sexe masculin.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: droit devant lui
  rationale: L’expression désigne la direction vers laquelle fait face chacun des êtres. « Droit devant lui » exprime naturellement ce mouvement sans changement de direction.
- source_word: יֵלֵכוּ
  choice: allait
  rationale: Le verbe courant הלך signifie « aller, marcher ». L’imparfait s’intègre à la description habituelle du mouvement dans la vision.
