  - severity: low
    issue: « tout en haut » pour מִלְמָעְלָה
    rationale: L’expression est plus vague et idiomatique que le repère spatial source. « Dans les hauteurs » maintient l’insistance sur la position au-dessus des têtes.
  - severity: low
