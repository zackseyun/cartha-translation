  text: וּ/דְמ֞וּת עַל רָאשֵׁ֤י הַ/חַיָּה֙ רָקִ֔יעַ כְּ/עֵ֖ין הַ/קֶּ֣רַח הַ/נּוֹרָ֑א נָט֥וּי עַל רָאשֵׁי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
translation:
  language: fr
  text: Au-dessus des têtes des êtres vivants[a] se trouvait la forme d’une étendue, pareille à l’aspect d’une glace qui inspirait la crainte[b], déployée au-dessus de leurs têtes, dans les hauteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un singulier collectif, littéralement « l’être vivant », puis parle de « leurs têtes ».
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « cristal ». Le mot hébreu signifie plus couramment « glace ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: se trouvait l’apparence de
  rationale: דְּמוּת désigne une ressemblance, une forme ou une apparence. « L’apparence de » maintient le caractère analogique de la vision sans identifier directement ce qui est vu.
- source_word: הַחַיָּה
  choice: les êtres vivants
  rationale: Le nom hébreu est au singulier collectif, mais les suffixes pluriels qui suivent renvoient aux quatre êtres. Le pluriel français assure une lecture naturelle tout en conservant le sens collectif.
- source_word: רָקִיעַ
  choice: une étendue
  rationale: רָקִיעַ évoque quelque chose d’étendu ou de déployé au-dessus des êtres. « Étendue » est moderne et moins interprétatif que « voûte ».
- source_word: כְּעֵין
  choice: pareille à l’aspect de
  rationale: Cette formulation préserve le marqueur explicite de ressemblance visuelle et l’indirection propre au récit visionnaire.
- source_word: הַקֶּרַח
  choice: glace
  rationale: Le nom hébreu désigne normalement la glace. La traduction traditionnelle « cristal » relève davantage d’une interprétation visuelle du contexte.
- source_word: הַנּוֹרָא
  choice: redoutable
  rationale: Le terme exprime ce qui suscite crainte, saisissement ou révérence. « Redoutable » conserve cette force sans employer le familier « impressionnant » ni réduire le sens à la terreur.
- source_word: נָטוּי
  choice: déployée
  rationale: Le participe passif décrit quelque chose d’étendu au-dessus des êtres. « Déployée » rend clairement cette disposition spatiale.
- source_word: מִלְמָעְלָה
  choice: tout en haut
  rationale: Cette expression restitue l’insistance verticale de l’hébreu tout en évitant en français la tournure maladroite « au-dessus… d’en haut ».
theological_decisions:
- issue: Langage analogique de la vision
  choice: Conserver la succession « apparence », « pareille » et « aspect »
  alternative: 'Formuler directement : « une étendue de glace redoutable se trouvait au-dessus de leurs têtes »'
  rationale: Ézéchiel décrit prudemment une vision au moyen de comparaisons imbriquées. Les maintenir évite de transformer une ressemblance perçue en identification certaine.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase garde les répétitions et les comparaisons du langage visionnaire, tout en adoptant un ordre syntaxique naturel en français.
