source:
  edition: WLC
  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: fr
  text: Chacun allait droit devant soi[a]. Là où l’esprit[b] devait aller, ils allaient ; ils ne se détournaient pas en chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la direction de sa face ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le vent » ; peut-être « l’Esprit ». Le mot hébreu רוּחַ peut signifier « esprit », « vent » ou « souffle », et le verset ne précise pas de quoi il s’agit.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ
  choice: Chacun
  rationale: Le nom אִישׁ a ici une valeur distributive et renvoie à chacun des quatre êtres vivants, sans affirmer qu’ils sont humains.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: droit devant soi
  rationale: L’expression signifie littéralement « dans la direction de sa face ». Cette formulation française naturelle exprime le mouvement vers l’avant tout en tenant compte des faces de chaque être.
- source_word: יֵלֵכוּ
  choice: allait / allaient
  rationale: Dans cette description visionnaire, l’imparfait hébreu décrit une action répétée ou caractéristique ; l’imparfait français convient à cette valeur.
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: Là où l’esprit devait aller
  rationale: La tournure rend naturellement la direction indiquée par la construction avec לָלֶכֶת, sans attribuer explicitement à l’esprit une volonté personnelle.
- source_word: הָרוּחַ
  choice: l’esprit
  rationale: רוּחַ peut désigner l’esprit, le vent ou le souffle. La minuscule évite d’identifier sans preuve le référent à l’Esprit saint, tandis qu’une note conserve l’ambiguïté.
- source_word: לֹא יִסַּבּוּ
  choice: ils ne se détournaient pas
  rationale: Le nifal de סבב exprime ici le fait de tourner ou de changer de direction. « Se détourner » souligne qu’ils poursuivaient leur mouvement sans dévier.
- source_word: בְּלֶכְתָּן
  choice: en chemin
  rationale: L’infinitif construit avec בְּ marque la simultanéité. « En chemin » en donne une expression concise et idiomatique en français.
theological_decisions:
- issue: Faut-il comprendre רוּחַ comme une référence explicite à l’Esprit saint ?
  choice: l’esprit
  alternative: le vent ; l’Esprit
  rationale: Le texte hébreu ne précise pas l’identité du référent. La minuscule et la note préservent l’ambiguïté lexicale et théologique au lieu de la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait présente les mouvements comme caractéristiques de la scène visionnaire. Les marqueurs de notes ont été placés auprès des expressions auxquelles leurs notes se rapportent.
