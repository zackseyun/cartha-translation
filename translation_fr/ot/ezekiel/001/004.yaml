  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: fr
  text: 'Je regardai, et voici qu’un vent de tempête[a] venait du nord : un grand nuage, avec un feu qui flamboyait sans cesse[b], et une clarté tout autour de lui ; et, du milieu du nuage, quelque chose comme l’apparence d’un métal incandescent[c], du milieu du feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tourbillon ». L’expression hébraïque peut désigner une violente tempête de vent.
    reason: lexical_alternative
  - marker: b
    text: Ou, selon une traduction traditionnelle, « un feu qui s’enroulait sur lui-même ». L’expression hébraïque est difficile et peut décrire un feu en mouvement continuel, qui se ravive ou s’intensifie.
    reason: lexical_alternative
  - marker: c
    text: Hébreu hashmal, terme rare dont le sens est incertain ; peut-être de l’électrum ou une matière à l’éclat ambré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Je regardai
  rationale: Le verbe ראה signifie couramment « voir », mais devant וְהִנֵּה, « je regardai » évite une répétition peu naturelle et rend l’attention visuelle du prophète.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure française conserve la fonction de הִנֵּה, qui attire soudain l’attention sur la scène visionnaire.
- source_word: רוּחַ סְעָרָה
  choice: un vent de tempête
  rationale: La locution désigne un vent violent et orageux sans imposer l’image plus précise d’un mouvement tournoyant.
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: venait du nord
  rationale: L’imparfait présente la scène en train de se déployer sous les yeux d’Ézéchiel.
- source_word: עָנָן גָּדוֹל
  choice: un grand nuage
  rationale: Rendu direct qui conserve la grandeur de l’image et le registre élevé du récit.
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: un feu qui jaillissait sans cesse
  rationale: La forme hébraïque difficile suggère un feu animé d’un mouvement continu ou qui se ravive lui-même. « Jaillissait sans cesse » rend cette activité sans reprendre littéralement l’expression traditionnelle obscure.
- source_word: נֹגַהּ לוֹ סָבִיב
  choice: une clarté rayonnait tout autour
  rationale: נֹגַהּ désigne une clarté ou un éclat. La formulation évite d’attribuer trop précisément le pronom hébreu à un seul élément de la scène.
- source_word: וּמִתּוֹכָהּ
  choice: Du milieu du nuage
  rationale: Le suffixe féminin renvoie naturellement au nuage dans la représentation d’ensemble; la formulation maintient l’organisation concentrique de la vision.
- source_word: כְּעֵין
  choice: quelque chose qui avait l’apparence de
  rationale: L’expression garde le caractère analogique et prudent de la description visionnaire.
- source_word: הַחַשְׁמַל
  choice: un métal incandescent
  rationale: חַשְׁמַל est un terme rare et incertain, souvent compris comme une substance métallique brillante, peut-être de l’électrum. Ce choix transmet l’effet visuel sans identifier trop précisément la matière.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: La répétition de « du milieu » reproduit la structure hébraïque et l’impression d’une réalité qui émerge au cœur de la manifestation.
theological_decisions:
- issue: Description de l’imagerie visionnaire sans identification excessive de la substance
  choice: quelque chose qui avait l’apparence d’un métal incandescent
  alternative: de l’ambre ou de l’électrum
  rationale: Le texte décrit une théophanie au moyen d’une comparaison et d’un terme rare. La traduction conserve cette approximation visuelle au lieu de transformer une image incertaine en identification matérielle assurée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple ouvre solennellement le récit visionnaire, tandis que l’imparfait décrit le phénomène en cours. Les répétitions structurantes de « du milieu » sont conservées, et les termes techniques incertains sont expliqués en notes.
