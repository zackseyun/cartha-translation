revisions:
- from: 'Je regardai, et voici qu’un vent de tempête[a] venait du nord : un grand nuage, un feu qui jaillissait sans cesse[b], et une clarté rayonnait tout autour. Du milieu du nuage, du milieu du feu, se dégageait quelque chose qui avait l’apparence d’un métal incandescent[c].'
  to: 'Je regardai, et voici qu’un vent de tempête[a] venait du nord : un grand nuage, avec un feu qui flamboyait sans cesse[b], et une clarté tout autour de lui ; et, du milieu du nuage, quelque chose comme l’apparence d’un métal incandescent[c], du milieu du feu.'
  rationale: La révision évite de surinterpréter le mouvement du feu, rétablit plus nettement la répétition structurante de « du milieu » et conserve l’imagerie comparative ainsi que l’incertitude de hashmal. « Du milieu du nuage » identifie l’antécédent féminin le plus naturel de « son milieu », sans présenter cette identification comme une précision lexicale certaine dans la note.
