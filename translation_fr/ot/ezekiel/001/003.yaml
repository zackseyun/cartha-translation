  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: fr
  text: La parole de Yahweh parvint bel et bien[a] à Ézéchiel, fils de Bouzi, le prêtre[b], au pays des Chaldéens, près du fleuve Kebar[c] ; là, la main de Yahweh fut sur lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète le verbe pour marquer fortement que la parole parvint effectivement à Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: La construction hébraïque peut grammaticalement désigner Ézéchiel ou Bouzi comme étant « le prêtre » ; elle est généralement comprise comme désignant Ézéchiel.
    reason: ambiguity
  - marker: c
    text: Le Kebar est généralement identifié à un canal de Babylonie, bien que le texte hébreu l’appelle un fleuve.
    reason: historical_geographical_clarification
  - marker: d
    text: Ou « la main de Yahweh vint sur lui ». L’expression évoque l’action puissante de Dieu sur le prophète.
    reason: alternative_reading
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: fut bel et bien adressée
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » restitue naturellement cette insistance en français, tandis que « fut adressée » convient à la formule prophétique.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formulation prophétique et sa portée théologique, sans réduire le terme à la seule notion de message. Le nom divin est translittéré « Yahweh ».
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי הַכֹּהֵן
  choice: Ézéchiel, fils de Bouzi, le prêtre
  rationale: Les noms suivent leur forme française usuelle. La construction appositionnelle est gardée au plus près afin de ne pas masquer entièrement l’ambiguïté grammaticale sur l’identité du prêtre.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: au pays des Chaldéens
  rationale: « Chaldéens » traduit directement כַּשְׂדִּים, plutôt que l’interprétation géographique plus large « Babyloniens ».
- source_word: עַל נְהַר כְּבָר
  choice: près du fleuve Kebar
  rationale: עַל est ici locatif. « Près de » est naturel en français ; « fleuve Kebar » conserve le rendu traditionnel tout en signalant en note qu’il pouvait s’agir d’un canal.
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: là, la main de Yahweh vint sur lui
  rationale: La métaphore de la « main » est conservée sans être réduite à « puissance » ou « inspiration ». « Vint sur lui » rend la forme verbale וַתְּהִי et l’irruption de l’action divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Identité de « le prêtre »
  choice: Conserver une formulation proche de l’apposition hébraïque et expliciter l’ambiguïté en note
  alternative: Ézéchiel le prêtre, fils de Bouzi
  rationale: La syntaxe peut formellement rattacher le titre à Ézéchiel ou à Bouzi. Le texte principal ne doit pas trancher silencieusement une ambiguïté réelle.
- issue: Expression prophétique « la main de Yahweh »
  choice: la main de Yahweh vint sur lui
  alternative: la puissance de Yahweh le saisit
  rationale: Le maintien de l’image laisse ouvertes ses nuances d’action, de puissance, de saisie et d’impulsion prophétique, sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la progression de l’hébreu tout en restant idiomatique ; les images prophétiques et les ambiguïtés pertinentes sont préservées.
