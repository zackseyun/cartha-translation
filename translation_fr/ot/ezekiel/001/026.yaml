source:
  edition: WLC
  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: fr
  text: Au-dessus de l’étendue qui était au-dessus de leurs têtes se trouvait une forme de trône ayant l’apparence d’une pierre de saphir[a]. Au-dessus de cette forme de trône se trouvait une forme ayant l’apparence d’un homme, au-dessus de celle-ci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être « pierre de lapis-lazuli » : l’identification précise de la pierre antique appelée sappir en hébreu est incertaine.'
    reason: Alternative lexicale due à l’incertitude concernant la gemme antique.
lexical_decisions:
- source_word: רָקִיעַ
  choice: étendue
  rationale: « Étendue » rend l’idée d’une surface déployée et convient à la structure semblable à une plateforme dans cette vision, sans l’archaïsme de « firmament ».
- source_word: כְּמַרְאֵה
  choice: dont l’aspect ressemblait à / qui avait l’aspect de
  rationale: Ces formulations naturelles en français maintiennent le langage phénoménologique de la vision et expriment la ressemblance plutôt qu’une identification directe.
- source_word: אֶבֶן סַפִּיר
  choice: pierre de saphir
  rationale: Cette traduction traditionnelle désigne clairement une pierre précieuse, tout en laissant en note l’incertitude sur son identification antique exacte.
- source_word: דְּמוּת
  choice: forme
  rationale: « Forme » est naturel en français et conserve le caractère analogique de la description, surtout lorsqu’il est associé aux expressions relatives à l’aspect.
- source_word: כִּסֵּא
  choice: trône
  rationale: Le contexte royal et visionnaire appelle nettement le sens de « trône » plutôt que celui, plus général, de « siège ».
- source_word: אָדָם
  choice: homme
  rationale: Le terme désigne ici une figure humaine individuelle; « homme » conserve aussi la formulation anthropomorphique explicite du texte.
- source_word: עָלָיו מִלְמָעְלָה
  choice: au-dessus de cette forme de trône
  rationale: Cette formulation explicite naturellement en français le référent spatial probable sans ajouter l’idée qu’une personne serait assise, notion absente de l’hébreu.
theological_decisions:
- issue: Description anthropomorphique de la figure au-dessus du trône
  choice: « une forme qui avait l’aspect d’un homme »
  alternative: « quelqu’un qui ressemblait à un homme »
  rationale: 'La formulation retenue préserve la succession de דְּמוּת et כְּמַרְאֵה : le prophète rapporte une manifestation d’apparence humaine sans identifier simplement l’être divin à un corps humain.'
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « au-dessus » et de « forme » est conservée afin de refléter la structure spatiale et le langage prudent de l’hébreu. Aucun ajout tel que « assis » n’a été introduit.
