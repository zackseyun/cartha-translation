revisions:
- from: Au-dessus de l’étendue qui était au-dessus de leurs têtes se trouvait une forme de trône, dont l’aspect ressemblait à une pierre de saphir[a]. Et, au-dessus de cette forme de trône, se trouvait une forme qui avait l’aspect d’un homme.
  to: Au-dessus de l’étendue qui était au-dessus de leurs têtes se trouvait une forme de trône ayant l’apparence d’une pierre de saphir[a]. Au-dessus de cette forme de trône se trouvait une forme ayant l’apparence d’un homme, au-dessus de celle-ci.
  rationale: La révision améliore l’idiomaticité de la première comparaison et, surtout, restitue la dernière indication spatiale du texte hébreu. Elle conserve les répétitions de « au-dessus » et de « forme », qui reflètent la présentation graduée et prudente de la vision, sans résoudre son langage anthropomorphique ni introduire « assis ».
