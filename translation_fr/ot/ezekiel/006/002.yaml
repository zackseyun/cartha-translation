  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: fr
  text: Fils d’homme, tourne ton visage vers les montagnes d’Israël et prophétise-leur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prophétise contre elles ». La préposition hébraïque peut désigner les destinataires de la prophétie; dans ce contexte de jugement, elle peut aussi avoir un sens adversatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette adresse récurrente d’Ézéchiel reprend directement l’idiome hébreu et conserve sa force prophétique.
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: Cette formulation française naturelle préserve l’image concrète du visage orienté délibérément vers une cible.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: vers les montagnes d’Israël
  rationale: La préposition est ici directionnelle avec l’expression « tourner son visage », et le groupe nominal concret est conservé.
- source_word: וְהִנָּבֵא
  choice: et prophétise
  rationale: Le verbe français rend directement l’impératif hébreu et maintient le registre prophétique.
- source_word: אֲלֵיהֶם
  choice: contre elles
  rationale: La préposition peut introduire les destinataires d’une parole, mais le contexte immédiat d’annonce du jugement donne ici à l’acte prophétique une orientation hostile. Une note conserve la lecture plus neutre.
theological_decisions:
- issue: Sens de אֲלֵיהֶם après « prophétise »
  choice: contre elles
  alternative: prophétise-leur
  rationale: Le jugement annoncé dans la suite favorise le sens adversatif, sans exclure grammaticalement l’idée d’une parole adressée aux montagnes; l’ambiguïté est donc signalée en note.
- issue: Traduction de l’adresse בֶּן אָדָם
  choice: Fils d’homme
  alternative: être humain; mortel
  rationale: La traduction littérale respecte la formule caractéristique par laquelle Dieu s’adresse à Ézéchiel, sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au prophète. « Tourne ton visage » reste naturel tout en conservant l’image hébraïque; « montagnes d’Israël » n’est pas remplacé par une interprétation métonymique.
