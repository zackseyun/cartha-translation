source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: fr
  text: 'Tu diras : « Montagnes d’Israël, écoutez la parole du Seigneur Yahweh ! Voici ce que dit le Seigneur Yahweh aux montagnes et aux collines, aux ravins[a] et aux vallées : Voici que moi-même, je fais venir contre vous l’épée, et je détruirai vos hauts lieux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux chenaux », « aux lits des torrents » ou « aux oueds ».
    reason: lexical_alternative
  - marker: b
    text: Les « hauts lieux » étaient des lieux de culte, généralement situés sur des hauteurs. Dans les textes prophétiques, ils sont souvent associés à des cultes idolâtres ou non autorisés.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: Montagnes d’Israël
  rationale: Cette construction désigne les régions montagneuses du pays, personnifiées et directement interpellées.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel introduit une sommation prophétique. « Écoutez » est plus naturel en français actuel que le littéral « entendez ».
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: la parole du Seigneur Yahweh
  rationale: « Parole » rend le singulier דְּבַר. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יהוה sans produire l’expression redondante « Seigneur SEIGNEUR ».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formulation française naturelle qui conserve la solennité de la formule prophétique de messager.
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: aux montagnes et aux collines
  rationale: Le parallélisme topographique est conservé dans une tournure française fluide.
- source_word: לָאֲפִיקִים
  choice: aux ravins
  rationale: Le mot peut désigner des chenaux, des lits de torrents ou des ravins. Dans cette énumération de reliefs, « ravins » convient au contexte tout en laissant les autres possibilités en note.
- source_word: וְלַגֵּאָיוֹת
  choice: et aux vallées
  rationale: « Vallées » est l’équivalent français général et naturel pour ces dépressions du terrain.
- source_word: הִנְנִי אֲנִי
  choice: Voici que moi-même
  rationale: Cette formulation conserve à la fois le présentatif הִנֵּה et l’insistance produite par le pronom אֲנִי, sans recourir à une répétition artificielle en français.
- source_word: מֵבִיא
  choice: je fais venir
  rationale: Le participe associé à הִנְנִי présente l’action comme engagée ou imminente. « Je fais venir » conserve aussi l’idée causative de l’arrivée de l’épée.
- source_word: חֶרֶב
  choice: l’épée
  rationale: En français biblique courant, l’article défini convient à l’épée envisagée comme instrument de guerre et de jugement.
- source_word: וְאִבַּדְתִּי
  choice: et je détruirai
  rationale: Le verbe exprime ici l’action de faire disparaître ou de détruire; le futur français marque clairement la suite annoncée du jugement.
- source_word: בָּמוֹתֵיכֶם
  choice: vos hauts lieux
  rationale: « Hauts lieux » est l’expression biblique française habituelle pour les lieux de culte situés sur des hauteurs ou désignés comme tels, souvent associés dans les prophètes à un culte condamné.
theological_decisions:
- issue: Traduction du nom divin יהוה dans le titre composé אֲדֹנָי יהוה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le titre אֲדֹנָי est rendu par « Seigneur » et le nom propre יהוה par « Yahweh ». Cela évite de confondre le nom divin avec un second titre et préserve sa présence explicite dans le texte hébreu.
- issue: Nature des בָּמוֹת
  choice: hauts lieux, avec une note explicative cultuelle
  alternative: sanctuaires des hauteurs
  rationale: Le terme désigne des sites cultuels, mais la traduction principale conserve l’expression traditionnelle et concise sans préciser davantage que le texte; la note fournit le contexte nécessaire.
translation_notes:
  register: Français international actuel, solennel mais accessible. L’adresse directe et le rythme de l’oracle prophétique sont conservés. Les répétitions utiles du texte source demeurent, tandis que l’emphase de הִנְנִי אֲנִי est rendue de manière idiomatique.
