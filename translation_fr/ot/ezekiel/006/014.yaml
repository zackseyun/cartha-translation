revisions:
- from: Alors j’étendrai ma main contre eux et je ferai du pays un lieu dévasté et désolé, depuis le désert jusqu’à Diblath[a], partout où ils habitent[b]. Alors ils sauront que je suis Yahweh.
  to: J’étendrai ma main contre eux et je réduirai le pays à la désolation et à la dévastation, du désert en direction de Diblath[a], dans tous les lieux où ils habitent[b]. Ils sauront alors que je suis Yahweh.
  rationale: La révision aligne le rendu de la formule géographique sur l’incertitude réelle du texte massorétique et sur l’audit anglais, tout en conservant Diblath dans le texte et les options pertinentes en note. Elle améliore également la restitution française du doublet de désolation sans ajouter d’interprétation théologique.
