  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: fr
  text: J’étendrai ma main contre eux et je réduirai le pays à la désolation et à la dévastation, du désert en direction de Diblath[a], dans tous les lieux où ils habitent[b]. Ils sauront alors que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : « du désert vers Diblath ». Le nom de lieu et l’étendue géographique exacte sont incertains. On peut aussi comprendre « du désert jusqu’à Diblath » ; certaines corrections proposées du texte y voient une référence à Ribla.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « dans toutes leurs habitations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי אֶת יָדִי עֲלֵיהֶם
  choice: j’étendrai ma main contre eux
  rationale: L’expression désigne une intervention divine hostile, ici un acte de jugement. Cette formulation conserve l’image hébraïque tout en rendant clairement la valeur adversative de עַל.
- source_word: וְנָתַתִּי אֶת הָאָרֶץ
  choice: je ferai du pays
  rationale: Avec un attribut, נתן exprime ici le fait de rendre le pays tel qu’il est ensuite décrit. La tournure française restitue naturellement ce sens causatif.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: un lieu dévasté et désolé
  rationale: Les deux termes forment un doublet intensif évoquant la ruine et la désolation. La traduction maintient les deux éléments sans imposer au second le sens plus interprétatif d’« objet d’épouvante ».
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: depuis le désert jusqu’à Diblath
  rationale: La lecture consonantique la plus directe comprend une formule d’étendue géographique allant du désert vers un lieu nommé Diblath. « Jusqu’à » traduit la direction exprimée par le ה local, tandis qu’une note signale l’incertitude textuelle et géographique.
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: partout où ils habitent
  rationale: מוֹשָׁב désigne un lieu d’habitation ou un établissement. Cette formulation courante en français garde la référence à l’ensemble de leurs lieux habités.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Alors ils sauront que je suis Yahweh
  rationale: « Alors » fait ressortir la conséquence du jugement dans cette formule récurrente d’Ézéchiel. Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération conserve le nom personnel de Dieu dans la formule de reconnaissance, sans le remplacer par un titre.
- issue: Interprétation de מִמִּדְבַּר דִּבְלָתָה
  choice: 'une étendue géographique : « depuis le désert jusqu’à Diblath »'
  alternative: « depuis le désert en direction de Diblath » ; correction conjecturale en « Ribla » ; lecture comme formule d’extrême désolation
  rationale: Le texte massorétique paraît désigner une limite géographique, mais l’identification du lieu reste incertaine. Le texte principal suit la lecture reçue et la note préserve les autres possibilités pertinentes.
translation_notes:
  register: Français international moderne, naturel et digne. L’image prophétique de la main étendue et le doublet de désolation sont conservés. Les notes rendent visibles l’incertitude du nom géographique et la formulation plus littérale du dernier complément.
