id: EZK.6.10
reference: Ezekiel 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: fr
  text: Alors ils sauront que je suis Yahweh. Ce n’est pas en vain[a] que j’ai parlé de leur infliger ce malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pas pour rien » ou « pas sans raison ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ce mal » ; ici, le mot désigne une calamité ou un malheur servant de jugement, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le parfait avec waw prend ici, dans le discours prophétique, une valeur future et résultative. « Alors » explicite naturellement la conséquence du jugement annoncé.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Conserve la formule de reconnaissance caractéristique d’Ézéchiel et rend directement le nom divin יהוה par « Yahweh ».
- source_word: לֹא אֶל חִנָּם
  choice: Ce n’est pas en vain
  rationale: L’expression indique que la parole divine n’est ni vide ni sans effet. « En vain » en préserve la concision et laisse ouverte la nuance « sans raison ».
- source_word: דִּבַּרְתִּי
  choice: que j’ai parlé
  rationale: Le passé composé est naturel en français actuel et maintient l’accent du texte sur l’acte de parler.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: de leur infliger
  rationale: Littéralement « de faire à eux » ; avec le complément désignant une calamité, « infliger » exprime idiomatiquement l’action dirigée contre eux sans ajouter une causalité absente du texte.
- source_word: הָרָעָה הַזֹּאת
  choice: ce malheur
  rationale: Dans ce contexte, רָעָה désigne la calamité du jugement et non le mal moral. « Malheur » est naturel, grave et proche de l’étendue sémantique de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération « Yahweh » préserve le nom propre et suit le choix éditorial fourni, sans le remplacer par un titre.
- issue: Sens de רָעָה appliqué au jugement divin
  choice: malheur
  alternative: mal / désastre / calamité
  rationale: Le contexte parle d’une calamité infligée comme jugement, non d’un mal moral attribué à Dieu. « Malheur » maintient la gravité et une part de l’amplitude lexicale du terme.
- issue: Portée de לֹא אֶל חִנָּם
  choice: pas en vain
  alternative: pas pour rien / pas sans raison
  rationale: « Pas en vain » met en avant l’efficacité et la réalisation de la parole, tout en signalant en note les autres nuances possibles plutôt que de trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en évitant le tour peu naturel « faire ce malheur à eux ». Les deux marqueurs de note figurent dans le texte principal et suivent les expressions qu’ils expliquent.
