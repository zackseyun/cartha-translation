  text: וְ/הוֹתַרְתִּ֗י בִּ/הְי֥וֹת לָ/כֶ֛ם פְּלִ֥יטֵי חֶ֖רֶב בַּ/גּוֹיִ֑ם בְּ/הִזָּרֽוֹתֵי/כֶ֖ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: fr
  text: 'Mais je laisserai subsister un reste[a] : des rescapés d’entre vous seront parmi les nations lorsque vous serez dispersés dans les pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des survivants de l’épée » ou « ceux qui ont échappé à l’épée ».
    reason: Alternative lexicale pour l’expression « un reste » / « rescapés de l’épée ».
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: Mais je laisserai un reste
  rationale: Le hifil de יתר signifie « laisser subsister, épargner ». « Mais » fait ressortir le contraste avec le jugement annoncé, tandis que « un reste » exprime naturellement ceux qui subsisteront, sans exclure le sens concret de survivants.
- source_word: בִּהְיוֹת לָכֶם פְּלִיטֵי חֶרֶב
  choice: certains d’entre vous échapperont à l’épée
  rationale: La construction existentielle, littéralement « quand il y aura pour vous des rescapés de l’épée », désigne des membres du peuple qui survivront à la guerre. Cette formulation française est claire et conserve l’idée dynamique de fuite ou d’évasion portée par פְּלִיטֵי.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples étrangers au milieu desquels les Israélites seront dispersés.
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: quand vous serez dispersés
  rationale: L’infinitif construit de זרה avec suffixe de deuxième personne introduit une circonstance temporelle. Le passif respecte la forme du syntagme sans préciser davantage l’agent dans cette proposition.
- source_word: בָּאֲרָצוֹת
  choice: dans différents pays
  rationale: Le pluriel אֲרָצוֹת renvoie aux multiples territoires de la dispersion. « Différents pays » est naturel en français moderne et évite la nuance abstraite que pourrait prendre « les terres ».
theological_decisions:
- issue: La notion de reste au cœur d’un oracle de jugement
  choice: Mais je laisserai un reste
  alternative: Mais je laisserai des survivants
  rationale: Le texte maintient ensemble le jugement et la préservation d’une partie du peuple. « Un reste » rend cette tension et la valeur de « laisser subsister », sans développer une doctrine au-delà du verset; la note conserve les formulations plus concrètes.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation avec deux-points explicite le rapport entre le reste laissé en vie et ceux qui échappent à l’épée, tout en préservant la progression de l’hébreu.
