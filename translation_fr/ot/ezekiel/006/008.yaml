revisions:
- from: 'Mais je laisserai un reste[a] : certains d’entre vous échapperont à l’épée parmi les nations, quand vous serez dispersés dans différents pays.'
  to: 'Mais je laisserai subsister un reste[a] : des rescapés d’entre vous seront parmi les nations lorsque vous serez dispersés dans les pays.'
  rationale: La révision conserve « reste » pour le hifil de יתר, mais exprime plus clairement que les membres du peuple qui ont survécu à l’épée se trouveront parmi les nations lors de leur dispersion. Elle évite de faire de « parmi les nations » le lieu grammatical de l’action d’échapper à l’épée et retire l’explicitation superflue « différents ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:20Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « certains d’entre vous échapperont à l’épée parmi les nations » peut laisser entendre que l’évasion se produira parmi les nations. L’hébreu décrit plutôt l’existence, parmi les nations, de rescapés de l’épée au moment de la dispersion. La révision rend cette relation plus nettement tout en conservant le caractère temporel et la partitive implicite de לָכֶם.
  naturalness: « Je laisserai subsister un reste » et « des rescapés d’entre vous seront parmi les nations » sont naturels dans un français biblique moderne, sobre et international. « Dans les pays » rend le pluriel de אֲרָצוֹת sans l’ajout interprétatif de « différents ».
  terminology: « Reste » conserve le sens de ce qui est laissé subsister et la tension entre jugement et préservation. « Rescapés de l’épée » rend concrètement פְּלִיטֵי חֶרֶב; la note offre des équivalents français légitimes sans confondre le reste avec une doctrine ultérieure.
  issues:
  - severity: medium
    issue: Portée de « parmi les nations »
    rationale: Dans le projet, ce complément suit immédiatement « échapperont à l’épée » et peut donc qualifier le lieu de l’évasion. Dans le texte source, il qualifie les rescapés qui se trouvent parmi les nations au cours de la dispersion.
  - severity: low
    issue: « différents pays » ajoute une nuance
    rationale: Le pluriel hébreu indique plusieurs terres ou pays, mais « différents » est une explicitation non nécessaire. « Les pays » conserve simplement le pluriel.
  - severity: low
    issue: Note lexicale incomplètement contextualisée
    rationale: L’alternative « des survivants » ne précise pas qu’il s’agit de survivants de l’épée. La note révisée rattache explicitement les deux alternatives à l’expression hébraïque complète.
  revised_text: 'Mais je laisserai subsister un reste[a] : des rescapés d’entre vous seront parmi les nations lorsque vous serez dispersés dans les pays.'
