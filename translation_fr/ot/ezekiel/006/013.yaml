source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: fr
  text: Alors vous saurez que je suis Yahweh, quand leurs victimes seront au milieu de leurs idoles[a], tout autour de leurs autels, sur toute haute colline, sur tous les sommets des montagnes, sous tout arbre verdoyant et sous tout térébinthe au feuillage épais, là où ils ont offert un parfum agréable à toutes leurs idoles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement méprisant; il peut évoquer des « idoles immondes » ou des « idoles de fumier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait qal précédé de la conjonction prend ici, dans le discours prophétique, une valeur future et consécutive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin et le distingue d’un titre tel que « Seigneur ».
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: quand leurs morts joncheront le sol
  rationale: L’infinitif construit avec ב introduit la circonstance temporelle. חַלְלֵיהֶם désigne des personnes tuées violemment; la formulation française rend naturellement l’image de leurs corps répartis dans les lieux de culte.
- source_word: בְּתוֹךְ גִּלּוּלֵיהֶם
  choice: au milieu de leurs idoles
  rationale: Conserve nettement la relation spatiale entre les morts et les objets cultuels.
- source_word: גִּלּוּלֵיהֶם
  choice: leurs idoles
  rationale: Terme français courant et compréhensible; la nuance fortement méprisante de l’hébreu est signalée en note.
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: tout autour de leurs autels
  rationale: Rend la localisation environnante et l’ampleur distributive de la scène.
- source_word: אֶל כָּל גִּבְעָה רָמָה
  choice: sur toute haute colline
  rationale: Dans cette énumération de lieux cultuels, אֶל a une valeur locative que « sur » exprime naturellement.
- source_word: בְּכֹל רָאשֵׁי הֶהָרִים
  choice: sur tous les sommets des montagnes
  rationale: « Têtes des montagnes » est un idiome hébreu désignant leurs sommets.
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: sous tout arbre verdoyant
  rationale: Préserve l’image prophétique traditionnelle d’un arbre vert et luxuriant sans archaïsme.
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: sous tout térébinthe au feuillage épais
  rationale: אֵלָה désigne probablement le térébinthe, tandis que עֲבֻתָּה évoque une végétation dense.
- source_word: מְקוֹם אֲשֶׁר
  choice: partout où
  rationale: Le singulier hébreu reprend collectivement la série de lieux; « partout où » rend cette portée distributive en français idiomatique.
- source_word: רֵיחַ נִיחֹחַ
  choice: un parfum apaisant
  rationale: Rend la formule cultuelle sans la transformer en jugement selon lequel l’offrande aurait réellement plu à Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nuance péjorative de גִּלּוּלִים
  choice: « idoles » dans le texte, avec une note
  alternative: « idoles immondes » ou « idoles de fumier »
  rationale: Le terme hébreu est volontairement insultant, mais son calque dans le corps du texte serait lourd et risquerait de déplacer l’attention; la note conserve sa force rhétorique.
- issue: Sens de רֵיחַ נִיחֹחַ dans un culte idolâtre
  choice: « parfum apaisant »
  alternative: « parfum agréable »
  rationale: La formule décrit ce que les adorateurs offraient à leurs idoles et fait écho au langage sacrificiel; elle ne doit pas laisser entendre que Yahweh agréait ces offrandes.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation solennelle des lieux de culte tout en privilégiant une syntaxe naturelle. « Joncheront le sol » explicite sobrement la disposition des morts impliquée par l’énumération locative.
