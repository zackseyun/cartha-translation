  source_fidelity: 'Révision nécessaire : « leurs morts joncheront le sol » ajoute « le sol », absent de l’hébreu, et atténue le sens plus précis de חֲלָלִים, des personnes tuées. Le reste de l’énumération locative et cultuelle est fidèle. « parfum apaisant » est possible mais moins naturel ici que « parfum agréable », formule cultuelle qui peut être présentée comme l’offrande faite aux idoles sans suggérer l’approbation de Yahweh.'
  naturalness: Le français est globalement fluide et de registre biblique moderne. « Leurs victimes » est plus net et naturel que « leurs morts » dans ce contexte de jugement; supprimer « joncheront le sol » évite une image ajoutée.
  terminology: « Yahweh », « idoles », « autels », « térébinthe » et « parfum agréable » conviennent. La note conserve adéquatement la charge péjorative de גִּלּוּלִים. L’ancre [a] est correctement placée à la première occurrence de « idoles » et la répétition finale reflète l’hébreu.
