revisions:
- from: Alors vous saurez que je suis Yahweh, quand leurs morts joncheront le sol au milieu de leurs idoles[a], tout autour de leurs autels, sur toute haute colline, sur tous les sommets des montagnes, sous tout arbre verdoyant et sous tout térébinthe au feuillage épais, partout où ils ont offert un parfum apaisant à toutes leurs idoles.
  to: Alors vous saurez que je suis Yahweh, quand leurs victimes seront au milieu de leurs idoles[a], tout autour de leurs autels, sur toute haute colline, sur tous les sommets des montagnes, sous tout arbre verdoyant et sous tout térébinthe au feuillage épais, là où ils ont offert un parfum agréable à toutes leurs idoles.
  rationale: La révision retire l’ajout « joncheront le sol » et rend חַלְלֵיהֶם par « leurs victimes », qui préserve l’idée de morts violentes. « Là où » traduit sobrement le singulier collectif מְקוֹם אֲשֶׁר après l’énumération des sites. « Parfum agréable » est une formulation française plus usuelle pour רֵיחַ נִיחֹחַ, sans trancher la question de l’agrément divin.
