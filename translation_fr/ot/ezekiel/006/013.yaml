    rationale: חַלְלֵיהֶם désigne leurs tués/victimes, et le texte les situe « au milieu de leurs idoles »; il ne dit pas qu’ils « joncheront le sol ». Cette expression ajoute une modalité imagée non explicitée.
  - severity: low
    issue: « parfum apaisant » est moins idiomatique pour רֵיחַ נִיחֹחַ
    rationale: « Parfum agréable » rend plus naturellement en français la formule sacrificielle. Dans ce contexte, la subordonnée indique ce qu’ils offraient à leurs idoles, non une évaluation divine de l’offrande.
  revised_text: Alors vous saurez que je suis Yahweh, quand leurs victimes seront au milieu de leurs idoles[a], tout autour de leurs autels, sur toute haute colline, sur tous les sommets des montagnes, sous tout arbre verdoyant et sous tout térébinthe au feuillage épais, là où ils ont offert un parfum agréable à toutes leurs idoles.
