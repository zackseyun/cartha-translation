  yaml_path: translation/ot/ezekiel/006/005.yaml
  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
translation:
  language: fr
  text: Je déposerai les cadavres des fils d’Israël devant leurs idoles[a], et je disperserai vos ossements autour de vos autels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu גִּלּוּלִים est un terme méprisant qu’Ézéchiel emploie pour parler des idoles ; il peut évoquer des « idoles immondes », voire des « idoles de fumier ».
    reason: alternative lexicale
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je déposerai
  rationale: נתן a un sens large (« donner, mettre, placer »). Avec des cadavres comme complément et la précision « devant », « déposer » exprime naturellement l’action concrète et sinistre.
- source_word: פִּגְרֵי
  choice: les cadavres
  rationale: פגר désigne un cadavre ou une carcasse. « Cadavres » convient clairement à des corps humains et conserve la force macabre du passage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: La formulation rend littéralement l’expression hébraïque traditionnelle, ici employée comme désignation collective et historique d’Israël.
- source_word: לִפְנֵי
  choice: devant
  rationale: לִפְנֵי signifie couramment « devant, en présence de ». « Devant » préserve la scène ironique de cadavres étendus face aux idoles.
- source_word: גִּלּוּלֵיהֶם
  choice: leurs idoles
  rationale: גִּלּוּלִים est un terme méprisant caractéristique d’Ézéchiel. « Idoles » indique clairement le référent dans le texte principal, tandis qu’une note signale sa nuance dépréciative.
- source_word: וְזֵרִיתִי
  choice: et je disperserai
  rationale: זרה peut signifier « disperser » ou « vanner ». Avec les ossements comme objet, « disperser » est le sens contextuel clair.
- source_word: עַצְמוֹתֵיכֶם
  choice: vos ossements
  rationale: עֶצֶם signifie « os ». Au pluriel dans ce contexte funéraire, « ossements » est idiomatique en français et conserve l’adresse directe marquée par le suffixe de deuxième personne du pluriel.
- source_word: סְבִיבוֹת
  choice: autour de
  rationale: Le terme désigne ce qui entoure ou se trouve aux alentours. « Autour de » s’intègre naturellement avec les autels.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: vos autels
  rationale: מִזְבֵּחַ signifie « autel » ; le possessif de deuxième personne du pluriel est conservé, car ces autels appartiennent aux destinataires et sont liés à leur culte idolâtre.
theological_decisions:
- issue: Maintien de l’expression ethnique et historique בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites ; peuple d’Israël
  rationale: L’expression est une désignation collective consacrée dans l’hébreu biblique. « Fils d’Israël » en conserve la texture sans limiter nécessairement le référent aux seuls hommes.
- issue: Traduction du terme polémique גִּלּוּלִים propre à Ézéchiel
  choice: idoles
  alternative: idoles immondes ; idoles de fumier
  rationale: « Idoles » rend clairement le référent sans imposer dans le texte principal une étymologie ou une intensité discutée. La nuance méprisante réelle est conservée explicitement en note.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concrète et solennelle, avec « cadavres » et « ossements » pour préserver la violence judiciaire de l’image. Le passage de « leurs idoles » à « vos ossements » et « vos autels » reproduit le changement de personne du texte hébreu.
