source:
  edition: WLC
  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: fr
  text: Celui qui est loin mourra de la peste ; celui qui est près tombera par l’épée ; celui qui restera et sera assiégé[a] mourra de faim ; j’assouvirai ma colère contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui restera et sera épargné ». Le mot hébreu peut aussi être compris comme désignant une personne préservée ; dans ce contexte, le sens « assiégé, enfermé » s’accorde mieux avec la mort de faim.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’épuiserai ma colère contre eux ». Le verbe hébreu exprime l’idée de mener la colère à son plein effet dans le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  choice: celui qui est loin
  rationale: L’adjectif substantivé désigne distributivement la personne éloignée et forme un contraste spatial naturel avec « celui qui est près ».
- source_word: בַּדֶּבֶר
  choice: de la peste
  rationale: דֶּבֶר désigne une peste ou épidémie meurtrière comme fléau de jugement; « mourir de la peste » est l’expression française idiomatique.
- source_word: הַקָּרוֹב
  choice: celui qui est près
  rationale: Cette formulation conserve le parallélisme avec הָרָחוֹק et son contraste spatial.
- source_word: בַּחֶרֶב יִפּוֹל
  choice: tombera par l’épée
  rationale: La traduction garde l’image hébraïque conventionnelle de tomber sous l’effet de l’épée, sans l’abstraire en mort violente.
- source_word: הַנִּשְׁאָר
  choice: celui qui restera
  rationale: Le participe passif désigne celui qui demeure ou qui est laissé; le singulier distributif est maintenu.
- source_word: הַנָּצוּר
  choice: assiégé
  rationale: Dans ce contexte de jugement et de famine, le terme s’entend naturellement de quelqu’un enfermé ou cerné par un siège, tout en admettant une autre analyse lexicale signalée en note.
- source_word: בָּרָעָב יָמוּת
  choice: mourra de faim
  rationale: « Mourir de faim » est plus naturel en français moderne que « mourir par la famine », tout en exprimant le même moyen de jugement.
- source_word: וְכִלֵּיתִי חֲמָתִי בָּם
  choice: Ainsi, j’irai jusqu’au bout de ma colère contre eux
  rationale: Le piel de כלה exprime l’accomplissement total ou l’épuisement de la colère en jugement. Cette formulation française conserve l’idée d’une colère menée à son terme.
theological_decisions:
- issue: Expression de la pleine exécution du jugement divin
  choice: j’irai jusqu’au bout de ma colère contre eux
  alternative: j’épuiserai ma colère sur eux
  rationale: Le choix préserve la force du jugement et l’idée que la colère est menée à son plein terme, sans suggérer que Dieu perdrait la maîtrise de lui-même ni importer une construction doctrinale extérieure au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme ternaire est conservé; « peste », « épée » et « faim » maintiennent les images concrètes du texte prophétique. Les deux marqueurs de notes figurent dans le texte principal.
