revisions:
- from: Celui qui est loin mourra de la peste, celui qui est près tombera par l’épée, et celui qui restera, assiégé[a], mourra de faim. Ainsi, j’irai jusqu’au bout de ma colère contre eux[b].
  to: Celui qui est loin mourra de la peste ; celui qui est près tombera par l’épée ; celui qui restera et sera assiégé[a] mourra de faim ; j’assouvirai ma colère contre eux[b].
  rationale: La révision supprime l’inférence ajoutée par « Ainsi », explicite la coordination des deux participes (« restera et sera assiégé »), et adopte une expression française idiomatique qui préserve l’idée hébraïque d’une colère pleinement exécutée. Les deux ancres de notes restent placées sur les expressions qu’elles expliquent.
