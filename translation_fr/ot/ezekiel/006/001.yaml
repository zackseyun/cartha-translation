  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה avec waw consécutif introduit la venue de la parole divine. « Fut adressée » rend naturellement en français l’ensemble de la tournure sans reproduire littéralement « il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: « La parole » conserve l’expression prophétique traditionnelle et reste plus proche de l’hébreu que l’interprétation « le message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, conformément au texte hébreu, plutôt que par un titre de substitution.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet dans « me fut adressée » exprime idiomatiquement la direction indiquée par la préposition אֶל et son suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent et rendent la fonction de l’infinitif hébreu « en disant », sans la formulation lourde « en ces termes ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le préserve, tandis que « le SEIGNEUR » lui substituerait un titre.
translation_notes:
  register: Français moderne, digne et naturel. La formule « La parole de Yahweh me fut adressée » est courante dans le registre prophétique biblique; les deux-points annoncent directement le discours du verset suivant.
