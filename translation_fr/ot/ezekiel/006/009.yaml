revisions:
- from: Alors vos rescapés se souviendront de moi parmi les nations où ils auront été emmenés captifs, lorsque j’aurai brisé[a] leur cœur qui se prostituait en se détournant de moi, ainsi que leurs yeux qui se prostituaient[b] en suivant leurs idoles[c]. Ils se prendront eux-mêmes en dégoût à cause du mal qu’ils ont fait par toutes leurs pratiques abominables.
  to: Alors vos rescapés se souviendront de moi parmi les nations où ils auront été emmenés captifs, lorsque j’aurai brisé[a] leur cœur qui se prostituait en se détournant de moi, ainsi que leurs yeux qui se prostituaient[b] en suivant leurs idoles[c]. Ils se prendront eux-mêmes en dégoût à cause de tous les maux qu’ils ont commis, de toutes leurs pratiques abominables.
  rationale: La révision ne modifie ni la lecture principale de נשברתי ni la métaphore de la prostitution. Elle corrige uniquement le dernier membre afin de conserver le pluriel « maux » et de faire de « toutes leurs pratiques abominables » l’apposition explicative de ces actes, plutôt qu’un moyen instrumental.
  reviewer_model: gpt-5.6-terra
