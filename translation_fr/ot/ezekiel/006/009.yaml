review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la séquence de l’hébreu : les survivants en captivité se souviendront de Dieu, après que celui-ci aura brisé leur cœur infidèle, et éprouveront du dégoût d’eux-mêmes. La note a préserve à juste titre l’autre analyse possible de נשברתי. Une correction est toutefois nécessaire dans le dernier membre : « par toutes leurs pratiques abominables » fait des abominations le moyen par lequel le mal a été commis, alors que l’hébreu les présente comme l’ensemble des actes mauvais qui suscitent leur dégoût.'
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Se prostituait » conserve correctement l’image volontairement rude du texte. « Se prendront eux-mêmes en dégoût » est naturel, quoique « auront horreur d’eux-mêmes » serait également possible. La révision proposée conserve la formulation existante, en rétablissant le parallélisme final.
  terminology: « Rescapés », « nations », « idoles » et « pratiques abominables » sont appropriés. La note sur גלולים restitue adéquatement la nuance dépréciative sans surcharger le texte principal. La terminologie de l’infidélité figurée est cohérente entre le cœur et les yeux.
  issues:
  - severity: medium
    issue: Le dernier groupe « à cause du mal qu’ils ont fait par toutes leurs pratiques abominables » ne reproduit pas exactement le rapport syntaxique de l’hébreu.
    rationale: À cause de/au sujet de (אל) porte sur « les maux qu’ils ont commis », et « toutes leurs abominations » désigne ces actes dans leur totalité. « Par » introduit en français une relation instrumentale absente du texte et le singulier collectif « le mal » atténue le pluriel הרעות.
  revised_text: Alors vos rescapés se souviendront de moi parmi les nations où ils auront été emmenés captifs, lorsque j’aurai brisé[a] leur cœur qui se prostituait en se détournant de moi, ainsi que leurs yeux qui se prostituaient[b] en suivant leurs idoles[c]. Ils se prendront eux-mêmes en dégoût à cause de tous les maux qu’ils ont commis, de toutes leurs pratiques abominables.
