source:
  edition: WLC
  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: fr
  text: Alors vos rescapés se souviendront de moi parmi les nations où ils auront été emmenés captifs, lorsque j’aurai brisé[a] leur cœur qui se prostituait en se détournant de moi, ainsi que leurs yeux qui se prostituaient[b] en suivant leurs idoles[c]. Ils se prendront eux-mêmes en dégoût à cause de tous les maux qu’ils ont commis, de toutes leurs pratiques abominables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque j’ai été brisé par leur cœur qui se prostituait en se détournant de moi ». Certains comprennent ainsi le verbe hébreu, comme une expression de la douleur du Seigneur devant leur infidélité.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu emploie ici l’image de la prostitution — pour le cœur comme pour les yeux — afin d’évoquer l’infidélité envers Dieu et l’idolâtrie.
    reason: cultural_note
  - marker: c
    text: Le mot hébreu traduit par « idoles » est un terme méprisant qu’Ézéchiel emploie souvent pour les faux dieux ; il peut suggérer l’idée d’« idoles répugnantes » ou d’« idoles immondes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  choice: Alors … se souviendront
  rationale: Dans ce discours prophétique, le waw fait progresser la séquence et peut marquer le résultat. « Alors » exprime naturellement cette conséquence tout en conservant le sens fondamental de « se souvenir ».
- source_word: פְלִיטֵיכֶם
  choice: vos rescapés
  rationale: Le nom désigne ceux qui ont échappé à la destruction. « Rescapés » est clair et actuel dans ce contexte de jugement.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Il s’agit des peuples et territoires étrangers de la captivité. Cette formulation évite d’introduire une nuance propre à l’emploi néotestamentaire de « païens ».
- source_word: אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: où ils auront été emmenés captifs
  rationale: Le niphal de שבה indique qu’ils ont été capturés. Le futur antérieur s’accorde naturellement avec la perspective prophétique française.
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי
  choice: lorsque j’aurai brisé
  rationale: La vocalisation massorétique et la présence du marqueur d’objet direct devant « leur cœur » favorisent une lecture active où Dieu est le sujet. La possibilité d’une lecture exprimant la douleur de Dieu est signalée en note.
- source_word: לִבָּם הַזּוֹנֶה
  choice: leur cœur qui se prostituait
  rationale: Le participe de זנה emploie l’image de la prostitution pour l’infidélité envers Dieu. La proposition relative rend cette image forte de façon compréhensible et naturelle en français.
- source_word: אֲשֶׁר סָר מֵעָלַי
  choice: en se détournant de moi
  rationale: סר exprime l’action de s’écarter ou de se détourner. La tournure française conserve ici la dimension relationnelle de l’apostasie.
- source_word: עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: leurs yeux qui se prostituaient en suivant leurs idoles
  rationale: La formulation maintient la même métaphore de prostitution appliquée aux yeux, organes du désir, sans la réduire au seul fait de convoiter.
- source_word: גִּלּוּלֵיהֶם
  choice: leurs idoles
  rationale: « Idoles » donne clairement le sens référentiel. La nuance méprisante propre au terme favori d’Ézéchiel est précisée en note.
- source_word: וְנָקֹטּוּ בִפְנֵיהֶם
  choice: Ils se prendront eux-mêmes en dégoût
  rationale: L’expression idiomatique indique une profonde répulsion envers soi-même. Cette tournure française en restitue la force réflexive.
- source_word: אֶל הָרָעוֹת
  choice: à cause du mal
  rationale: La préposition introduit ici le motif de leur dégoût. Le singulier collectif « le mal » est idiomatique en français et couvre leurs actes mauvais.
- source_word: לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: par toutes leurs pratiques abominables
  rationale: Le terme désigne des actes religieusement et moralement répugnants, notamment idolâtres. « Pratiques abominables » conserve son poids tout en évitant l’opacité possible du substantif isolé « abominations ».
theological_decisions:
- issue: Sens de « j’aurai brisé leur cœur qui se prostituait »
  choice: Dieu est le sujet qui brise leur cœur infidèle dans le jugement, ce qui conduit au souvenir et au dégoût de leurs fautes.
  alternative: Dieu déclare avoir été lui-même brisé ou profondément affligé par leur cœur qui se prostituait.
  rationale: La vocalisation massorétique et le marqueur d’objet direct favorisent la lecture active « j’ai brisé leur cœur ». La lecture exprimant la douleur divine demeure ancienne et significative; elle est donc conservée en note sans être imposée au texte principal.
- issue: Métaphore sexuelle de l’infidélité
  choice: Conserver explicitement le verbe « se prostituer » pour le cœur et pour les yeux.
  alternative: Employer des termes interprétatifs plus atténués comme « être infidèle » ou « convoiter ».
  rationale: Ézéchiel recourt volontairement à une image choquante pour décrire l’infidélité envers Dieu et l’idolâtrie. La conserver maintient la tension rhétorique et théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du texte hébreu tout en évitant les calques opaques. L’image répétée de la prostitution est maintenue en raison de sa fonction rhétorique, avec une note explicative.
