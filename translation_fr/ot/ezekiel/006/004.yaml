source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ מִזְבְּח֣וֹתֵי/כֶ֔ם וְ/נִשְׁבְּר֖וּ חַמָּֽנֵי/כֶ֑ם וְ/הִפַּלְתִּי֙ חַלְלֵי/כֶ֔ם לִ/פְנֵ֖י גִּלּוּלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: fr
  text: Vos autels seront dévastés, et vos autels à encens[a] seront brisés. Je ferai tomber vos victimes devant vos idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos piliers solaires » ; le terme hébreu désigne des objets cultuels liés à un culte illicite, dont la nature exacte est discutée.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu employé par Ézéchiel est fortement méprisant ; on pourrait aussi traduire « vos idoles immondes », voire « vos idoles-excréments ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: seront dévastés
  rationale: Le niphal de שׁמם exprime ici l’état de désolation résultant du jugement. « Seront dévastés » conserve la force passive et s’intègre naturellement à l’oracle.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: vos autels
  rationale: Traduction directe et usuelle de מִזְבֵּחַ, sans précision supplémentaire imposée par le contexte.
- source_word: נִשְׁבְּרוּ
  choice: seront brisés
  rationale: Le niphal de שׁבר signifie « être brisé ». Cette formulation directe garde la violence du jugement sans l’intensifier arbitrairement.
- source_word: חַמָּנֵיכֶם
  choice: vos autels à encens
  rationale: Le terme désigne des objets cultuels liés au culte illicite, mais leur nature exacte demeure discutée. « Autels à encens » fournit une désignation française claire, tandis que l’interprétation solaire est conservée en note.
- source_word: הִפַּלְתִּי
  choice: je ferai tomber
  rationale: 'Le hiphil de נפל est causatif : « faire tomber ». La traduction maintient l’action divine délibérée et évite de préciser un mode de mise à mort absent du texte.'
- source_word: חַלְלֵיכֶם
  choice: ceux d’entre vous qui seront tués
  rationale: חָלָל désigne les personnes transpercées ou tuées. Cette formulation est plus explicite en français moderne que « vos tués » et plus précise que le simple « vos morts ».
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition conserve son sens spatial et l’ironie judiciaire de personnes abattues devant les objets qu’elles adoraient.
- source_word: גִּלּוּלֵיכֶם
  choice: vos idoles
  rationale: « Idoles » est clair et idiomatique. La nuance fortement méprisante propre au terme d’Ézéchiel est signalée en note afin de ne pas disparaître.
theological_decisions:
- issue: Force péjorative du terme גִּלּוּלִים appliqué aux idoles
  choice: Employer « idoles » dans le texte et expliciter la nuance méprisante en note
  alternative: « idoles immondes » ou, littéralement et plus crûment, « idoles-excréments »
  rationale: Le terme hébreu condamne délibérément ces objets de culte par une désignation dégradante. Le texte principal reste naturel en français, tandis que la note préserve la violence rhétorique sans imposer une expression française insolite.
- issue: Identification des חַמָּנִים
  choice: « autels à encens » dans le texte principal
  alternative: « piliers solaires »
  rationale: La nature précise de ces installations cultuelles est incertaine et peut être comprise en lien avec l’encens ou avec le culte solaire. La traduction principale suit une désignation cultuelle intelligible, sans supprimer l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la progression hébraïque tout en plaçant le complément « devant vos idoles » avant le groupe long « ceux d’entre vous qui seront tués » pour une lecture naturelle. Les deux notes rendent visibles les principales tensions lexicales du verset.
