source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Frappe dans tes mains[a], tape du pied et dis : “Hélas !” à cause de toutes les abominations mauvaises de la maison d’Israël[b] ; ils tomberont par l’épée, par la famine et par la peste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Frappe ta paume. » L’hébreu décrit un geste où l’on frappe la paume, sans en préciser entièrement la forme.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « au sujet de toutes les abominations mauvaises de la maison d’Israël ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend le titre אֲדֹנָי par « le Seigneur » et le nom divin יְהוָה par « Yahweh », tout en évitant la répétition française « le Seigneur Seigneur ».
- source_word: הַכֵּה בְכַפְּךָ
  choice: Frappe dans ta main
  rationale: Conserve le geste concret exprimé par נכה et כף. En français, « frapper dans sa main » évoque un coup porté dans la paume sans imposer l’interprétation plus précise d’applaudir.
- source_word: וּרְקַע בְרַגְלְךָ
  choice: tape du pied
  rationale: Expression française naturelle pour le geste énergique indiqué par רקע, sans préciser au-delà de l’hébreu l’émotion associée.
- source_word: וֶאֱמָר אָח
  choice: 'et dis : « Hélas ! »'
  rationale: Dans ce contexte de jugement, אָח exprime vraisemblablement la lamentation plutôt que le triomphe ; « Hélas ! » restitue clairement cette valeur.
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: à cause de toutes les abominations mauvaises
  rationale: אֶל introduit ici vraisemblablement le motif ou l’objet de la lamentation. « Abominations » garde la forte portée cultuelle et morale de תּוֹעֵבָה, tandis que « mauvaises » conserve רָעוֹת.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Maintient l’expression collective et covenantale du texte source plutôt que de la réduire à « Israël ».
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: qui tombera
  rationale: Le pronom relatif reprend grammaticalement le collectif singulier « maison d’Israël » ; le singulier français préserve cet accord tout en exprimant le destin collectif.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: par l’épée, par la famine et par la peste
  rationale: Restitue la triade prophétique traditionnelle des moyens de jugement avec des termes français clairs et dignes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin ; « Yahweh » le conserve, tandis que « le Seigneur » rend le titre אֲדֹנָי. Cette solution évite de masquer le nom sous un titre.
- issue: Valeur de l’interjection אָח
  choice: Hélas !
  alternative: Ah !
  rationale: Le contexte annonce la chute d’Israël par l’épée, la famine et la peste ; la lamentation convient mieux que l’exultation, sans enlever au geste prophétique sa possible dimension de dénonciation.
- issue: Référent de la proposition אֲשֶׁר ... יִפֹּלוּ
  choice: la maison d’Israël, qui tombera
  alternative: les abominations mauvaises ... à cause desquelles ils tomberont
  rationale: La lecture la plus directe rattache le relatif à « maison d’Israël » et comprend le collectif comme sujet de « tomber ». Une certaine rugosité syntaxique demeure dans l’hébreu, mais le français exige un raccord explicite.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tutoiement singulier correspond aux impératifs adressés au prophète. La formulation conserve les images concrètes, l’expression « maison d’Israël » et la triade judiciaire, sans ajouter une interprétation émotionnelle aux gestes eux-mêmes.
