  to: 'Ainsi parle le Seigneur Yahweh : « Frappe dans tes mains[a], tape du pied et dis : “Hélas !” à cause de toutes les abominations mauvaises de la maison d’Israël[b] ; ils tomberont par l’épée, par la famine et par la peste. »'
