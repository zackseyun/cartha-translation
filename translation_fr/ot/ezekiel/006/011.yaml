  source_fidelity: 'Révision nécessaire : יִפֹּלוּ est au pluriel. Le relatif vise collectivement la maison d’Israël, c’est-à-dire ses membres, et non les abominations. « qui tombera » impose à tort un singulier et laisse une syntaxe française ambiguë. « Ils tomberont » restitue le pluriel sans identifier les abominations comme sujet.'
  naturalness: « Frappe dans ta main » est peu naturel et peu clair en français moderne. « Frappe dans tes mains » est l’expression idiomatique pour ce geste, tout en laissant une note signaler que l’hébreu parle de la paume au singulier. La coordination finale en deux propositions rend clairement le référent collectif.
  terminology: « le Seigneur Yahweh », « maison d’Israël », « abominations », « épée », « famine » et « peste » conviennent au registre prophétique et au rendu du nom divin retenu. « Hélas ! » rend de manière juste l’interjection אָח dans ce contexte.
