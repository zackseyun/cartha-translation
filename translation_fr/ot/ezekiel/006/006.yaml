  source_fidelity: Le sens général et la succession des actes de jugement sont bien rendus. Toutefois, לְמַעַן introduit ici plus explicitement le but (« afin que ») que ne le fait « ainsi ». Le remplacement de « laissés à l’abandon / abandonnés » par « désolés » rend plus directement le lexique répété de שמם et préserve le parallélisme du verset.
  naturalness: La formulation révisée reste naturelle en français international moderne. « Dans tous vos lieux d’habitation » explicite le pluriel distributif de מוֹשְׁבֹתֵיכֶם, et la série avec « afin que » se lit de façon fluide sans perdre le rythme accumulatif.
  terminology: « Hauts lieux », « autels », « idoles », « autels à encens » et « œuvres » conviennent. Les notes conservent de manière adéquate, sans la trancher, l’incertitude concernant חַמָּנִים et la nuance péjorative de גִּלּוּלִים.
