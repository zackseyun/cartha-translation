source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: fr
  text: Dans tous vos lieux d’habitation, les villes seront dévastées et les hauts lieux seront désolés, afin que vos autels soient dévastés et désolés, que vos idoles[a] soient brisées et supprimées, que vos autels à encens[b] soient abattus et que vos œuvres soient effacées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est fortement méprisant; il pourrait évoquer des idoles répugnantes ou souillées.
    reason: lexical_alternative
  - marker: b
    text: Ou « piliers solaires » ou « représentations du soleil ». Le terme hébreu désigne un type d’objet cultuel dont l’identification est discutée, peut-être lié au culte solaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habitez
  rationale: Cette formulation naturelle en français rend les lieux d’habitation visés par le pluriel hébreu sans leur donner un sens administratif trop étroit.
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: les villes seront dévastées
  rationale: « Dévastées » exprime clairement la ruine produite par le jugement et convient au passif hébreu.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: « Hauts lieux » est le terme français établi pour ces sites cultuels, sans réduire nécessairement leur sens à de simples sanctuaires situés sur une colline.
- source_word: תִּישָׁמְנָה
  choice: seront laissés à l’abandon
  rationale: La formulation exprime l’état de désolation indiqué par le verbe et évite une répétition française pesante de « dévastés ».
- source_word: לְמַעַן
  choice: ainsi
  rationale: Dans ce contexte, le connecteur peut exprimer le résultat aussi bien que le but. « Ainsi » conserve cette ouverture sans imposer une finalité stricte.
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: vos autels seront dévastés et abandonnés
  rationale: 'Les deux verbes sont rendus afin de conserver l’intensification : destruction matérielle et état de désolation.'
- source_word: גִּלּוּלֵיכֶם
  choice: vos idoles
  rationale: « Idoles » est clair dans le texte principal; la valeur fortement méprisante du mot hébreu est signalée en note.
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: seront brisées et supprimées
  rationale: « Brisées » rend la destruction physique, tandis que « supprimées » conserve l’idée distincte de cessation ou de disparition.
- source_word: חַמָּנֵיכֶם
  choice: vos autels à encens
  rationale: Ce choix plausible convient au contexte cultuel, mais l’identification précise de ces objets reste débattue; l’autre possibilité majeure est donc conservée en note.
- source_word: וְנִגְדְּעוּ
  choice: seront abattus
  rationale: Le verbe évoque l’action de couper ou d’abattre, formulation naturelle pour la destruction de ces objets cultuels.
- source_word: מַעֲשֵׂיכֶם
  choice: vos œuvres
  rationale: « Œuvres » préserve l’ambiguïté entre les actes accomplis et les objets fabriqués, probablement cultuels dans ce contexte.
- source_word: וְנִמְחוּ
  choice: seront effacées
  rationale: « Effacées » rend directement l’idée d’oblitération sans affaiblir la portée du jugement.
theological_decisions:
- issue: Force polémique du terme גִּלּוּלִים
  choice: Employer « idoles » dans le texte et indiquer en note la nuance méprisante.
  alternative: Employer « idoles répugnantes » ou « idoles immondes » dans le texte principal.
  rationale: Le texte condamne fortement l’idolâtrie, mais le terme français courant assure la clarté; la note permet de ne pas perdre la connotation dépréciative de l’hébreu sans surinterpréter son image exacte.
- issue: Valeur de לְמַעַן
  choice: Rendre par « ainsi », compatible avec une conséquence ou un résultat visé.
  alternative: Rendre par « afin que », qui marque explicitement le but.
  rationale: Le lien logique peut se lire comme final ou consécutif. La traduction choisie préserve cette tension plutôt que de la trancher silencieusement.
- issue: Identification de חַמָּנִים
  choice: « autels à encens » dans le texte, avec l’interprétation solaire en note.
  alternative: « piliers solaires » ou « représentations du soleil » dans le texte.
  rationale: Le référent cultuel précis demeure incertain. Le texte principal adopte une identification plausible et intelligible, tandis que la note maintient l’autre lecture importante.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme accumulatif du jugement est conservé, tout en variant légèrement le vocabulaire pour produire une phrase française naturelle. Les deux notes sont placées immédiatement après les termes qu’elles expliquent.
