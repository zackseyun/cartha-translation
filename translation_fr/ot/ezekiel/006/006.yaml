  - severity: low
    issue: « Laissés à l’abandon » et « abandonnés » sont moins précis que le vocabulaire de désolation répété dans l’hébreu.
    rationale: Le verbe שמם décrit l’état de désolation. « Désolés » restitue la répétition voulue entre les hauts lieux et les autels, sans ajouter l’idée d’un abandon par un agent.
