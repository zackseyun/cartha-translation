  text: וְ/נָפַ֥ל חָלָ֖ל בְּ/תֽוֹכְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/007.yaml
  text: The slain will fall in your midst[a], and you will know that I am Yahweh.
translation:
  language: fr
  text: Des morts tomberont au milieu de vous, et vous saurez que je suis Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom hébreu est YHWH, généralement transcrit « Yahweh »; traduction traditionnelle : « le SEIGNEUR ».'
    reason: Précision sur le nom divin et indication du rendu traditionnel.
lexical_decisions:
- source_word: וְנָפַל
  choice: tomberont
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction exprime naturellement en français un événement futur. Le pluriel s’accorde avec la valeur collective de חָלָל.
- source_word: חָלָל
  choice: des morts
  rationale: Dans ce contexte de jugement, le nom désigne des personnes tuées plutôt que de simples blessés. Le pluriel français rend naturellement le singulier collectif hébreu.
- source_word: בְּתוֹכְכֶם
  choice: au milieu de vous
  rationale: Cette expression situe les morts parmi les destinataires et conserve le ton solennel de l’oracle.
- source_word: וִידַעְתֶּם
  choice: vous saurez
  rationale: Le futur rend la formule de reconnaissance caractéristique d’Ézéchiel et son sens résultatif.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Le texte emploie directement le nom divin יהוה; « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le maintien du nom propre correspond directement au texte hébreu et préserve la formule de reconnaissance propre à Ézéchiel. La forme française traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Des morts tomberont » garde l’image verbale hébraïque et rend le singulier collectif sans lourdeur.
