  text: אֳנִיּ֣וֹת תַּרְשִׁ֔ישׁ שָׁרוֹתַ֖יִ/ךְ מַעֲרָבֵ֑/ךְ וַ/תִּמָּלְאִ֧י וַֽ/תִּכְבְּדִ֛י מְאֹ֖ד בְּ/לֵ֥ב יַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: fr
  text: Les navires de Tarsis étaient à ton service pour transporter tes marchandises[a]. Tu fus remplie et devins très lourde au cœur des mers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu est difficile. Littéralement, peut-être : « étaient tes caravanes »; ou : « étaient à ton service pour transporter tes marchandises ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « au cœur des mers » désigne le milieu des mers, en pleine mer.
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: les navires de Tarsis
  rationale: Le syntagme construit désigne naturellement des navires associés à Tarsis. Cette formulation conserve l’expression hébraïque et sa portée commerciale, sans la réduire à « navires marchands ».
- source_word: שָׁרוֹתַיִךְ
  choice: étaient tes caravanes
  rationale: Dans cette lamentation consacrée au commerce de Tyr, « caravanes » exprime métaphoriquement le rôle de ces navires dans le transport des marchandises. La note signale une autre compréhension possible du terme difficile.
- source_word: מַעֲרָבֵךְ
  choice: pour tes marchandises
  rationale: Dans ce chapitre, le nom renvoie aux biens faisant l’objet d’échanges commerciaux. « Marchandises » est clair et convient au registre du passage.
- source_word: וַתִּמָּלְאִי
  choice: tu as été remplie
  rationale: Cette traduction garde la nuance passive ou résultative du verbe et personnifie Tyr comme dans l’hébreu.
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: tu es devenue très lourde
  rationale: Le contexte maritime et commercial favorise l’image concrète du poids produit par un chargement abondant, plutôt que le sens abstrait d’honneur ou de prestige.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: La traduction conserve la métaphore hébraïque vive, tandis que la note en explicite le sens spatial.
