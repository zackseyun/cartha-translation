  text: הוֹנֵ/ךְ֙ וְ/עִזְבוֹנַ֔יִ/ךְ מַעֲרָבֵ֕/ךְ מַלָּחַ֖יִ/ךְ וְ/חֹבְלָ֑יִ/ךְ מַחֲזִיקֵ֣י בִדְקֵ֣/ך וְֽ/עֹרְבֵ֣י מַ֠עֲרָבֵ/ךְ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתֵּ֜/ךְ אֲשֶׁר בָּ֗/ךְ וּ/בְ/כָל קְהָלֵ/ךְ֙ אֲשֶׁ֣ר בְּ/תוֹכֵ֔/ךְ יִפְּלוּ֙ בְּ/לֵ֣ב יַמִּ֔ים בְּ/י֖וֹם מַפַּלְתֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: fr
  text: Tes richesses, tes cargaisons, tes marchandises, tes marins et tes pilotes, ceux qui réparent tes brèches[a], ceux qui négocient tes marchandises, tous tes hommes de guerre qui sont en toi, ainsi que toute ton assemblée qui se trouve au milieu de toi, tomberont au cœur des mers[b], le jour de ta chute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui calfatent tes jointures » ou « ceux qui réparent tes fissures ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au cœur des mers », c’est-à-dire en pleine mer ou dans les profondeurs des mers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: tes richesses
  rationale: Le nom désigne les richesses ou la fortune; « richesses » est naturel dans cette lamentation commerciale.
- source_word: עִזְבוֹנַיִךְ
  choice: tes marchandises
  rationale: Dans le contexte commercial d’Ézéchiel 27, le terme désigne les biens destinés au commerce.
- source_word: מַעֲרָבֵךְ
  choice: les biens dont tu faisais commerce
  rationale: Cette formulation distingue autant que possible ce terme du précédent tout en conservant son sens commercial.
- source_word: מַלָּחַיִךְ
  choice: tes marins
  rationale: Équivalent moderne, clair et précis pour les membres ordinaires de l’équipage.
- source_word: חֹבְלָיִךְ
  choice: tes pilotes
  rationale: Dans le contexte maritime, le terme désigne ceux qui dirigent ou gouvernent le navire.
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: ceux qui réparaient tes brèches
  rationale: L’expression évoque littéralement ceux qui consolident une fissure ou une brèche; elle s’applique ici aux réparateurs du navire figurant Tyr.
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: ceux qui négociaient tes marchandises
  rationale: Le participe a ici un sens commercial et désigne les négociants associés aux biens de Tyr.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: tes hommes de guerre
  rationale: Cette expression formelle conserve le caractère militaire et la formulation genrée de l’hébreu.
- source_word: קְהָלֵךְ
  choice: ta multitude
  rationale: Dans ce contexte, קהל paraît désigner l’ensemble nombreux des personnes réunies dans Tyr ou à bord du navire métaphorique; « multitude » est plus naturel ici qu’« assemblée ».
- source_word: יִפְּלוּ
  choice: tomberont
  rationale: Le verbe signifie fondamentalement « tomber »; ce choix préserve l’image hébraïque, même si le contexte implique l’engloutissement.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: La traduction conserve la métaphore vive de l’hébreu, qui désigne le milieu ou les profondeurs des mers.
- source_word: מַפַּלְתֵּךְ
  choice: ta chute
  rationale: Le nom désigne l’effondrement ou la chute; « chute » reprend directement le motif verbal de la phrase.
theological_decisions: []
