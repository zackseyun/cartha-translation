  text: יְהוּדָה֙ וְ/אֶ֣רֶץ יִשְׂרָאֵ֔ל הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/חִטֵּ֣י מִ֠נִּית וּ/פַנַּ֨ג וּ/דְבַ֤שׁ וָ/שֶׁ֨מֶן֙ וָ/צֹ֔רִי נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: fr
  text: Juda et le pays d’Israël étaient tes marchands ; ils faisaient commerce avec toi, t’apportant du blé de Minnith, du pannag[a], du miel, de l’huile et du baume en échange de tes marchandises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot « pannag » est incertain. On a notamment proposé une confiserie, une épice ou une pâtisserie.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלָיִךְ
  choice: tes marchands
  rationale: Le nom désigne des personnes qui pratiquent le commerce ; « marchands » convient au contexte de la complainte commerciale sur Tyr.
- source_word: בְּחִטֵּי מִנִּית
  choice: contre du blé de Minnith
  rationale: La préposition introduit ici la marchandise donnée dans l’échange ; « blé de Minnith » conserve le rapport avec le nom de lieu sans préciser au-delà de l’hébreu.
- source_word: פַנַּג
  choice: pannag
  rationale: Ce mot très rare est de sens incertain. Sa translittération évite de retenir avec trop d’assurance une identification conjecturale.
- source_word: דְבַשׁ
  choice: miel
  rationale: C’est le sens lexical courant du terme.
- source_word: שֶׁמֶן
  choice: huile
  rationale: Le terme signifie généralement « huile » ; ne pas ajouter « d’olive » préserve le degré de précision de l’hébreu.
- source_word: צֹרִי
  choice: baume
  rationale: Le mot désigne une substance résineuse aromatique précieuse ; « baume » est une traduction française claire et traditionnelle.
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: ils échangeaient tes marchandises contre
  rationale: Littéralement, ils « donnaient » les produits énumérés comme objet d’échange pour les marchandises de Tyr. Cette formulation rend naturellement la relation commerciale en français.
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: Juda et le pays d’Israël
  rationale: La traduction conserve la mention explicite du « pays d’Israël » au lieu de la réduire simplement à « Israël ».
theological_decisions: []
