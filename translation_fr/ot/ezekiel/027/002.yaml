  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם שָׂ֥א עַל צֹ֖ר קִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/002.yaml
  text: And you[a], son of man, raise a lamentation over Tyre,
translation:
  language: fr
  text: 'Et toi, fils d’homme, prononce une lamentation sur Tyr :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Et toi,
  rationale: La conjonction jointe au pronom indépendant marque à la fois la transition et l’adresse directe. « Et toi » conserve ce mouvement du discours sans préciser davantage la nuance.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel. Cette traduction établie reste proche de l’hébreu et convient au registre prophétique.
- source_word: שָׂא
  choice: entonne
  rationale: Le verbe signifie littéralement « lever, porter », mais, avec קִינָה, forme une expression consacrée pour commencer ou prononcer une lamentation. « Entonne » rend naturellement cet acte de parole tout en gardant le caractère formel et poétique.
- source_word: עַל
  choice: sur
  rationale: Avec le vocabulaire de la lamentation, la préposition indique celui qui en est l’objet ou le sujet. « Sur » est idiomatique en français et n’introduit pas l’idée d’hostilité que pourrait suggérer « contre ».
- source_word: צֹר
  choice: Tyr
  rationale: Forme française usuelle du nom de la ville phénicienne.
- source_word: קִינָה
  choice: une lamentation
  rationale: Le nom désigne une plainte funèbre ou poétique de forme établie. « Lamentation » conserve le registre prophétique élevé sans le restreindre nécessairement à un chant funèbre.
