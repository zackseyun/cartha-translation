  text: וְ/נָשְׂא֨וּ אֵלַ֤יִ/ךְ בְּ/נִי/הֶם֙ קִינָ֔ה וְ/קוֹנְנ֖וּ עָלָ֑יִ/ךְ מִ֣י כְ/צ֔וֹר כְּ/דֻמָ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/032.yaml
  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
translation:
  language: fr
  text: 'Avec leurs fils[a], ils entonneront pour toi une complainte et se lamenteront sur toi : « Qui est comme Tyr, réduite au silence au milieu de la mer[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « avec leurs fils ». Cette expression est difficile dans le contexte ; certaines interprétations ou traditions textuelles proposent un sens lié aux cris de lamentation.
    reason: textual_variant
  - marker: b
    text: Ou « rendue immobile » ou « détruite au milieu de la mer ». Le terme hébreu peut évoquer le silence, l’immobilité ou la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: ils entonneront ... une complainte
  rationale: L’association de נשׂא avec קינה signifie commencer ou prononcer un chant funèbre. « Entonner une complainte » restitue naturellement l’expression idiomatique et son caractère poétique.
- source_word: אֵלַיִךְ / עָלָיִךְ
  choice: sur toi
  rationale: Dans le contexte du deuil, la complainte porte sur Tyr ; « sur toi » convient aux deux prépositions tout en conservant l’adresse directe au féminin.
- source_word: בְּנִיהֶם
  choice: dans leurs lamentations
  rationale: La forme massorétique est difficile et pourrait littéralement évoquer « leurs fils ». Le parallélisme avec קינה et קוננו favorise toutefois un sens lié aux cris ou chants de deuil ; l’incertitude est signalée en note.
- source_word: וְקוֹנְנוּ
  choice: et se lamenteront
  rationale: Le verbe קונן désigne l’action de prononcer une lamentation. Cette formulation française est claire et maintient le lien lexical avec le contexte funèbre.
- source_word: מִי כְצוֹר
  choice: Qui était comme Tyr
  rationale: L’interrogation compare implicitement la grandeur passée de Tyr à son état présent. L’imparfait est naturel dans une complainte après sa chute, sans supprimer la portée rhétorique de l’hébreu nominal.
- source_word: כְּדֻמָה
  choice: réduite au silence
  rationale: La forme peut exprimer l’état de ce qui est rendu silencieux, immobile ou dévasté. « Réduite au silence » préserve l’image sans imposer explicitement l’idée d’une destruction totale.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: Traduction directe et poétique qui conserve le cadre maritime de Tyr.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. « Complainte » rend le caractère formel du chant funèbre, tandis que « se lamenteront » reste immédiatement compréhensible. Les deux difficultés lexicales réelles du verset sont conservées dans les notes plutôt que résolues silencieusement.
