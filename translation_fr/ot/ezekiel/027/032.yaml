  terminology: « Complainte » et « se lamenteront » rendent bien le couple קִינָה / קוֹנְנוּ. « Tyr » est la forme française usuelle. Les notes distinguent la difficulté de « avec leurs fils » de la plage sémantique de כְּדֻמָה.
