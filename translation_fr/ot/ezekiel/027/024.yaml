  source_fidelity: 'Le sens commercial de רֹכְלַיִךְ, מַכְלֻלִים et מַרְכֻלְתֵּךְ est bien rendu. La traduction distingue toutefois insuffisamment les deux groupes textiles de גְלוֹמֵי תְכֵלֶת וְרִקְמָה : le texte hébreu évoque des rouleaux ou ballots de tissu bleu-pourpre et de tissu brodé, plutôt qu’une seule étoffe simultanément bleu-pourpre et brodée. Les deux termes très difficiles, גִנְזֵי בְּרֹמִים et אֲרֻזִים, demeurent accompagnés de notes qui préservent les lectures possibles.'
