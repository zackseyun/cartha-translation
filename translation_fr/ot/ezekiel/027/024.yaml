  terminology: « Marchands », « articles de choix » et « marchandises » conviennent au registre commercial d’Ézéchiel 27. « Bleu-pourpre » exprime sobrement la nuance généralement associée à תכלת, sans prétendre identifier exactement la teinte antique. Les notes restent ancrées aux expressions effectivement incertaines.
