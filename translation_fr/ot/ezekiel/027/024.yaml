base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: fr
  text: 'Ils étaient tes marchands en articles de choix : des rouleaux de tissu bleu-pourpre et de tissu brodé, des coffres de tissus multicolores[a], ficelés avec des cordes et bien arrimés[b], parmi tes marchandises.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est incertaine ; elle peut aussi évoquer des réserves, des trésors ou des ballots d’étoffes richement colorées.
    reason: lexical_alternative
  - marker: b
    text: Ou « en cèdre » ou « garnis de cèdre ». Le mot hébreu est difficile ; certains le rattachent au terme désignant le cèdre plutôt qu’à l’emballage ou à l’arrimage des marchandises.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: tes marchands
  rationale: Dans Ézéchiel 27, le terme désigne les commerçants intégrés au réseau commercial de Tyr. « Marchands » convient au contexte et reste naturel en français.
- source_word: מַכְלֻלִים
  choice: articles de choix
  rationale: Le nom évoque ici des objets achevés, précieux ou de qualité supérieure. « Articles de choix » garde cette valeur commerciale sans surinterpréter leur nature.
- source_word: גְלוֹמֵי תְכֵלֶת וְרִקְמָה
  choice: pièces d’étoffe bleu pourpre et brodée
  rationale: גְלוֹמֵי semble désigner des pièces textiles enveloppées ou roulées plutôt que nécessairement des vêtements finis. תְכֵלֶת est une matière teinte d’un bleu tirant vers le pourpre, et רִקְמָה désigne un travail brodé.
- source_word: גִנְזֵי בְּרֹמִים
  choice: coffres de tissus multicolores
  rationale: L’expression est obscure. גִנְזֵי peut désigner des réserves, des trésors ou leurs contenants, tandis que בְּרֹמִים est souvent compris comme des textiles variés ou multicolores. La formulation retenue donne un sens commercial concret tout en signalant l’incertitude en note.
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: liés avec des cordes
  rationale: Les deux mots décrivent naturellement des colis ou coffres attachés au moyen de cordes.
- source_word: אֲרֻזִים
  choice: solidement emballés
  rationale: Après « liés avec des cordes », le mot peut vraisemblablement décrire des marchandises soigneusement emballées ou assujetties. Son interprétation demeure toutefois incertaine.
- source_word: מַרְכֻלְתֵּךְ
  choice: tes marchandises
  rationale: Dans l’inventaire commercial du chapitre, le nom renvoie concrètement aux biens négociés par Tyr.
