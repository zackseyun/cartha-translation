  - severity: low
    issue: Formulation française des conditionnements
    rationale: « Pièces d’étoffe » et « solidement emballés » sont moins naturels dans cette énumération. « Rouleaux » et « bien arrimés » rendent plus clairement des articles de commerce liés par des cordes, sans supprimer l’incertitude signalée en note.
