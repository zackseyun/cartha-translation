source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: fr
  text: 'Tu diras à Tyr : « Toi qui habites aux entrées de la mer, qui fais commerce avec les peuples jusque dans de nombreuses terres côtières[a], ainsi parle le Seigneur Yahweh : Tyr, tu as dit : “Je suis d’une beauté parfaite.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à de nombreuses îles ». Le terme hébreu peut désigner des îles ou, plus largement, des territoires côtiers maritimes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הישבתי
  choice: toi qui habites
  rationale: Le participe qal féminin singulier décrit Tyr comme établie en ce lieu. L’apostrophe à la deuxième personne est naturelle en français et maintient la personnification de la ville.
- source_word: מְבוֹאֹת יָם
  choice: aux entrées de la mer
  rationale: Cette traduction conserve l’image concrète et le pluriel de l’hébreu, qui évoquent les accès maritimes stratégiques de Tyr.
- source_word: רֹכֶלֶת הָעַמִּים
  choice: qui fais commerce avec les peuples
  rationale: Le participe féminin présente Tyr comme une cité marchande. La tournure verbale est plus naturelle en français que « marchande des peuples », qui pourrait suggérer à tort que les peuples eux-mêmes sont vendus.
- source_word: אֶל אִיִּים רַבִּים
  choice: jusque dans de nombreuses terres côtières
  rationale: La préposition marque l’extension du commerce vers de nombreux territoires maritimes. « Terres côtières » garde ici la portée géographique large de אִיִּים, sans exclure le sens plus précis d’« îles » signalé en note.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue les deux éléments du composé.
- source_word: כְּלִילַת יֹפִי
  choice: d’une beauté parfaite
  rationale: La formulation française exprime naturellement la prétention de Tyr à une beauté complète et sans défaut, tout en restant proche de l’expression hébraïque.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente explicitement le nom divin יהוה, tandis que « Seigneur » traduit אֲדֹנָי; la distinction présente dans l’hébreu est ainsi préservée.
- issue: Portée de l’affirmation כְּלִילַת יֹפִי
  choice: Je suis d’une beauté parfaite
  alternative: Je suis la perfection de la beauté
  rationale: Le texte rapporte la propre prétention orgueilleuse de Tyr sans la valider ni l’atténuer. La solution retenue conserve cette tension tout en étant idiomatique.
translation_notes:
  register: Français international actuel, digne et accessible. La ville de Tyr est personnifiée et directement interpellée; les relatives à la deuxième personne rendent naturellement les participes féminins hébreux. L’image maritime des « entrées de la mer » est volontairement conservée.
