  text: וְ/הִקְרִ֤יחוּ אֵלַ֨יִ/ךְ֙ קָרְחָ֔ה וְ/חָגְר֖וּ שַׂקִּ֑ים וּ/בָכ֥וּ אֵלַ֛יִ/ךְ בְּ/מַר נֶ֖פֶשׁ מִסְפֵּ֥ד מָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/031.yaml
  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: fr
  text: Ils se raseront la tête pour toi, se ceindront de toile de sac et pleureront sur toi dans l’amertume de leur âme, en une amère lamentation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: Ils se raseront la tête pour toi
  rationale: Le hiphil de קרח avec le nom קָרְחָה décrit le fait de se rendre chauve, ici comme geste de deuil. « Se raseront la tête » exprime clairement cette pratique en français moderne, tandis que « pour toi » rend le deuil motivé par le sort de Tyr.
- source_word: וְחָגְרוּ שַׂקִּים
  choice: se ceindront de toile de sac
  rationale: La formulation conserve l’image hébraïque consistant à attacher autour de soi une étoffe grossière portée en signe de deuil, tout en restant intelligible en français.
- source_word: וּבָכוּ אֵלַיִךְ
  choice: pleureront sur toi
  rationale: Avec בכה, « pleurer » est le verbe français naturel dans ce contexte funèbre; « sur toi » exprime la lamentation dont Tyr est l’objet.
- source_word: בְּמַר נֶפֶשׁ
  choice: dans l’amertume de leur âme
  rationale: Cette traduction proche de la structure hébraïque préserve נֶפֶשׁ (« âme, être, vie ») et l’image d’une profonde détresse intérieure sans la réduire à une simple émotion générique.
- source_word: מִסְפֵּד מָר
  choice: en une amère lamentation
  rationale: מִסְפֵּד désigne les manifestations de deuil ou la lamentation funèbre; la tournure maintient la répétition insistante de la racine exprimant l’amertume.
theological_decisions: []
