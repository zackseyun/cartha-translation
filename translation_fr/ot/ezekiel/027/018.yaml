  text: דַּמֶּ֧שֶׂק סֹחַרְתֵּ֛/ךְ בְּ/רֹ֥ב מַעֲשַׂ֖יִ/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/יֵ֥ין חֶלְבּ֖וֹן וְ/צֶ֥מֶר צָֽחַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: fr
  text: Damas commerçait avec toi en raison de la multitude de tes produits et de l’abondance de toutes sortes de richesses, avec du vin de Helbôn et de la laine blanche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Damas était ton partenaire commercial, en raison de la multitude de tes produits et de l’abondance de toutes sortes de richesses, avec du vin de Helbôn et de la laine éclatante. »'
    reason: La forme commerciale peut se rendre par un nom (« partenaire commercial »), et צָחַר peut désigner une laine éclatante ou claire plutôt que strictement blanche.
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: Damas
  rationale: Forme française usuelle du nom de la ville.
- source_word: סֹחַרְתֵּךְ
  choice: faisait du commerce avec toi
  rationale: Rend naturellement le rapport commercial exprimé par סחר et conserve l’adresse directe à Tyr au féminin.
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: à cause de la multitude de tes produits
  rationale: Dans le catalogue commercial d’Ézéchiel 27, מַעֲשֶׂה désigne ici les objets fabriqués ou produits; la préposition est comprise dans un sens causal.
- source_word: מֵרֹב כָּל הוֹן
  choice: de l’abondance de toutes sortes de richesses
  rationale: Conserve l’intensification de רֹב et la portée de כָּל sans produire la tournure peu naturelle «toute richesse».
- source_word: בְּיֵין חֶלְבּוֹן
  choice: du vin de Helbôn
  rationale: La préposition introduit la marchandise échangée; «de Helbôn» indique naturellement en français l’origine du vin.
- source_word: וְצֶמֶר צָחַר
  choice: et de la laine blanche
  rationale: צָחַר qualifie vraisemblablement une laine claire, blanche ou éclatante; «blanche» est précis et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le féminin des pronoms renvoie à la ville de Tyr. La reprise par « elle te fournissait » explicite seulement la relation commerciale implicite dans la liste des marchandises; la note conserve une construction plus formelle et l’ambiguïté lexicale.
