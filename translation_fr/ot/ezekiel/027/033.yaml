id: EZK.27.33
reference: Ezekiel 27:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/צֵ֤את עִזְבוֹנַ֨יִ/ךְ֙ מִ/יַּמִּ֔ים הִשְׂבַּ֖עַתְּ עַמִּ֣ים רַבִּ֑ים בְּ/רֹ֤ב הוֹנַ֨יִ/ךְ֙ וּ/מַ֣עֲרָבַ֔יִ/ךְ הֶעֱשַׁ֖רְתְּ מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: fr
  text: Quand tes cargaisons[a] sortaient des mers, tu satisfaisais de nombreux peuples ; par l’abondance de tes richesses et de tes marchandises, tu enrichissais les rois de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes biens ». Le terme hébreu désigne ici les biens commerciaux transportés par Tyr.
    reason: lexical_alternative
  - marker: b
    text: Ou « les rois du pays ». Le mot hébreu peut désigner la terre au sens large ou un territoire particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת
  choice: Quand ... sortaient
  rationale: La préposition בְּ avec l’infinitif construit de יצא introduit ici une proposition temporelle. L’imparfait français convient à l’activité commerciale habituelle évoquée dans la lamentation.
- source_word: עִזְבוֹנַיִךְ
  choice: tes cargaisons
  rationale: Ce nom rare désigne ici les biens commerciaux transportés par Tyr. « Cargaisons » rend naturellement le contexte maritime tout en évitant de répéter « marchandises » plus loin.
- source_word: מִיַּמִּים
  choice: des mers
  rationale: Le pluriel hébreu est conservé et maintient l’ampleur de l’imagerie maritime.
- source_word: הִשְׂבַּעַתְּ
  choice: tu satisfaisais
  rationale: Le hifil de שבע signifie « rassasier, satisfaire ». « Satisfaisais » convient aux besoins comblés par le commerce sans limiter l’image à la nourriture.
- source_word: עַמִּים רַבִּים
  choice: de nombreux peuples
  rationale: « Peuples » correspond directement à עַמִּים et évite d’assimiler ceux-ci aux États-nations modernes.
- source_word: בְּרֹב הוֹנַיִךְ
  choice: par l’abondance de tes richesses
  rationale: « Par » exprime la valeur instrumentale de בְּ, tandis que « abondance » et « richesses » rendent l’ampleur économique de l’expression.
- source_word: וּמַעֲרָבַיִךְ
  choice: et de tes marchandises
  rationale: Dans Ézéchiel 27, le terme relève du vocabulaire de l’échange commercial. « Marchandises » est clair et naturel en français moderne.
- source_word: הֶעֱשַׁרְתְּ
  choice: tu enrichissais
  rationale: Le hifil de עשר signifie directement « rendre riche, enrichir ».
- source_word: מַלְכֵי אָרֶץ
  choice: les rois de la terre
  rationale: Dans cette lamentation consacrée au commerce international de Tyr, « terre » exprime bien la portée étendue de son influence, tout en conservant le registre élevé.
theological_decisions:
- issue: Portée de אֶרֶץ dans מַלְכֵי אָרֶץ
  choice: la terre
  alternative: le pays
  rationale: אֶרֶץ peut désigner soit la terre au sens large, soit un territoire particulier. Le contexte international favorise « terre », mais l’autre lecture reste lexicalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, fluide et digne. Le vocabulaire commercial et l’imagerie maritime sont conservés, avec l’imparfait pour présenter l’activité habituelle de Tyr dans la lamentation.
