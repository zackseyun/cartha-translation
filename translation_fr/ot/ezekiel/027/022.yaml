  verdict: revise
  source_fidelity: La version rend correctement les partenaires commerciaux, les aromates de première qualité, les pierres précieuses et l’or. Cependant, « faisaient du commerce avec toi » atténue la répétition emphatique « ils étaient tes marchands » (הֵמָּה רֹכְלָיִךְ). La formulation révisée la rétablit. La relation commerciale exprimée par נתנו עזבוניך est rendue de manière idiomatique tout en étant signalée en note.
  naturalness: La révision demeure naturelle en français international moderne. « Étaient tes marchands » est simple et correspond au style solennel de l’oracle; « donnaient … en échange de » rend clairement la transaction sans imposer un mécanisme commercial plus précis que le texte.
  terminology: « Marchands », « aromates », « pierres précieuses », « or » et « marchandises » conviennent au contexte commercial d’Ézéchiel 27. Les formes Saba et Raema sont conservées. Aucun terme théologique particulier n’est en jeu.
