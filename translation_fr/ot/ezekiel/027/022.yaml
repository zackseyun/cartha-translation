base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: fr
  text: Les marchands de Saba et de Raema étaient tes marchands. Ils donnaient, en échange de tes marchandises, les meilleurs aromates de toutes sortes, toutes sortes de pierres précieuses et de l’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ils donnaient tes marchandises ». Dans ce contexte commercial, l’expression peut désigner ce qu’ils donnaient en paiement ou en échange de tes marchandises.'
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: רֹכְלֵי שְׁבָא וְרַעְמָה
  choice: Les marchands de Saba et de Raema
  rationale: רכל désigne ici des commerçants. Les noms propres sont rendus selon leurs formes françaises bibliques usuelles.
- source_word: הֵמָּה רֹכְלָיִךְ
  choice: faisaient du commerce avec toi
  rationale: Cette formulation française naturelle exprime la relation commerciale avec Tyr, marquée par le suffixe de deuxième personne, sans répéter lourdement « marchands ».
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  choice: les meilleurs aromates de toutes sortes
  rationale: רֹאשׁ a ici le sens idiomatique de « meilleur, plus précieux », tandis que בֹּשֶׂם désigne des substances aromatiques; « de toutes sortes » rend naturellement la valeur distributive de כָּל.
- source_word: וּבְכָל אֶבֶן יְקָרָה
  choice: toutes sortes de pierres précieuses
  rationale: Le singulier collectif hébreu se rend naturellement en français par un pluriel générique.
- source_word: וְזָהָב
  choice: et de l’or
  rationale: Équivalent direct du produit commercial énuméré.
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  choice: En échange de tes marchandises, ils donnaient
  rationale: נָתְנוּ signifie littéralement « ils donnaient »; le contexte commercial indique que ces produits étaient remis en échange des marchandises de Tyr. La formulation conserve le verbe hébreu tout en explicitant la relation commerciale.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement conserve l’adresse directe à Tyr. La répétition hébraïque de « marchands » est allégée dans le corps du texte, tandis que la note préserve l’ambiguïté de la construction commerciale finale.
