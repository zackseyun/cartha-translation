source:
  edition: WLC
  text: בְּ/מַ֤יִם רַבִּים֙ הֱבִיא֔וּ/ךְ הַ/שָּׁטִ֖ים אֹתָ֑/ךְ ר֚וּחַ הַ/קָּדִ֔ים שְׁבָרֵ֖/ךְ בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
translation:
  language: fr
  text: Tes rameurs t’ont conduite dans les grandes eaux[a] ; le vent d’est t’a brisée au cœur des mers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu des grandes eaux » ou « sur les eaux abondantes ». La préposition hébraïque peut avoir plusieurs sens, mais le mouvement exprimé par « t’ont conduite » favorise ici « dans les grandes eaux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au milieu des mers ». En hébreu, « le cœur des mers » désigne leur partie intérieure ou leur milieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: dans les grandes eaux
  rationale: Avec le verbe de mouvement « conduire », la préposition בְּ peut marquer l’entrée dans un espace. « Les grandes eaux » exprime naturellement l’immensité des eaux et conserve l’image poétique.
- source_word: הֱבִיאוּךְ
  choice: t’ont conduite
  rationale: Le hiphil de בוא signifie ici « amener, conduire ». Le féminin singulier respecte le suffixe hébreu adressé à Tyr, représentée comme un navire.
- source_word: הַשָּׁטִים
  choice: tes rameurs
  rationale: Dans ce contexte nautique, le participe désigne ceux qui manient les rames. Le possessif explicite en français leur rapport au navire personnifié.
- source_word: רוּחַ הַקָּדִים
  choice: le vent d’est
  rationale: La formulation définie rend l’expression hébraïque et évoque le vent oriental destructeur bien connu dans l’imagerie biblique.
- source_word: שְׁבָרֵךְ
  choice: t’a brisée
  rationale: Le verbe שׁבר exprime une rupture violente. « Brisée » conserve cette force tout en s’accordant avec la destinataire féminine.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: La traduction littérale de לֵב préserve l’image poétique du lieu intérieur ou central, et le pluriel « des mers » reflète יַמִּים.
