source:
  edition: WLC
  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: fr
  text: 'L’Arabie et tous les princes de Qédar : ils étaient tes partenaires commerciaux[a] ; en agneaux, en béliers et en boucs, ils commerçaient avec toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient les marchands de ta main » ; cette expression désigne ceux qui faisaient du commerce avec toi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרַב
  choice: l’Arabie
  rationale: Dans cette liste de partenaires commerciaux, le nom peut désigner la région ou ses habitants. « L’Arabie » est naturel en français tout en laissant entendre ses marchands.
- source_word: נְשִׂיאֵי
  choice: princes
  rationale: Le terme désigne des chefs ou dirigeants tribaux; « princes » en conserve la dignité politique.
- source_word: קֵדָר
  choice: Qédar
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: סֹחֲרֵי יָדֵךְ
  choice: faisaient du commerce avec toi
  rationale: Littéralement « marchands de ta main », expression indiquant une relation commerciale avec Tyr. La formulation choisie est claire et idiomatique.
- source_word: כָרִים
  choice: agneaux
  rationale: Le mot désigne de jeunes ovins et doit être distingué des béliers mentionnés ensuite.
- source_word: אֵילִים
  choice: béliers
  rationale: Sens lexical courant, distinct des agneaux et des boucs.
- source_word: עַתּוּדִים
  choice: boucs
  rationale: Le terme désigne spécifiquement des chèvres mâles; « boucs » est précis et naturel.
- source_word: בָּם סֹחֲרָיִךְ
  choice: ils te fournissaient
  rationale: La reprise du vocabulaire commercial signifie qu’ils commerçaient avec Tyr au moyen des animaux énumérés. « Fournissaient » rend naturellement leur rôle sans répétition lourde.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le féminin « toi » renvoie à la ville de Tyr, personnifiée. La répétition hébraïque de la racine commerciale est allégée pour obtenir une phrase française naturelle.
