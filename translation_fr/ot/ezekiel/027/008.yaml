  text: יֹשְׁבֵ֤י צִידוֹן֙ וְ/אַרְוַ֔ד הָי֥וּ שָׁטִ֖ים לָ֑/ךְ חֲכָמַ֤יִ/ךְ צוֹר֙ הָ֣יוּ בָ֔/ךְ הֵ֖מָּה חֹבְלָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/008.yaml
  text: The inhabitants of Sidon and Arvad were your rowers; your wise men[a], O Tyre, were within you; they were your pilots.
translation:
  language: fr
  text: Les habitants de Sidon et d’Arvad étaient tes rameurs. Tes hommes habiles[a], ô Tyr, étaient en toi ; ils étaient tes pilotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes sages ». Le mot hébreu peut désigner la sagesse aussi bien que la compétence technique.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe construit de ישׁב désigne ceux qui habitent un lieu ; « les habitants de » est naturel en français moderne.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Forme française traditionnelle et courante du nom de la cité phénicienne.
- source_word: וְאַרְוַד
  choice: et Arvad
  rationale: Transcription française usuelle du nom de lieu, associé ici à Sidon comme fournisseur de personnel maritime.
- source_word: שָׁטִים
  choice: rameurs
  rationale: Dans la métaphore du navire, le participe désigne ceux qui propulsent l’embarcation à la rame.
- source_word: לָךְ
  choice: tes
  rationale: Le complément avec suffixe féminin singulier exprime ici naturellement l’appartenance au service de Tyr.
- source_word: חֲכָמַיִךְ
  choice: tes hommes habiles
  rationale: חכם peut exprimer aussi bien la sagesse que la compétence technique. Le contexte nautique favorise l’idée de spécialistes compétents, sans imposer une fonction plus précise.
- source_word: צוֹר
  choice: ô Tyr
  rationale: « Tyr » est la forme française traditionnelle ; « ô » marque clairement l’apostrophe du texte hébreu dans un registre dignifié.
- source_word: בָךְ
  choice: chez toi
  rationale: Tyr étant personnifiée et figurée comme un navire, « chez toi » rend naturellement la présence en son sein sans lourdeur.
- source_word: הֵמָּה
  choice: c’étaient eux
  rationale: La tournure détachée restitue l’emphase du pronom indépendant hébreu.
- source_word: חֹבְלָיִךְ
  choice: tes pilotes
  rationale: Dans ce contexte maritime, le terme désigne ceux qui manœuvrent ou dirigent le navire ; « pilotes » le distingue clairement des rameurs déjà mentionnés.
