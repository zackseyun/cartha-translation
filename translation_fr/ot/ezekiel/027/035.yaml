  text: כֹּ֚ל יֹשְׁבֵ֣י הָ/אִיִּ֔ים שָׁמְמ֖וּ עָלָ֑יִ/ךְ וּ/מַלְכֵי/הֶם֙ שָׂ֣עֲרוּ שַׂ֔עַר רָעֲמ֖וּ פָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/035.yaml
  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
translation:
  language: fr
  text: Tous les habitants des régions côtières sont consternés à ton sujet[a]. Leurs rois frémissent d’épouvante[b] ; leurs visages se crispent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des îles ». Le mot hébreu peut désigner des îles ou, plus largement, des territoires maritimes.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « frémissent d’un frémissement », tournure intensive exprimant une agitation extrême.
    reason: lexical_alternative
  - marker: c
    text: 'La dernière expression hébraïque est difficile. Autres traductions possibles : « leurs visages tremblent » ou « leurs visages sont bouleversés ».'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: Tous les habitants des régions côtières
  rationale: Le participe construit יֹשְׁבֵי désigne les habitants, et אִיִּים peut évoquer aussi bien des îles que, plus largement, des territoires maritimes. « Régions côtières » convient au contexte maritime de l’oracle contre Tyr.
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: sont consternés à cause de toi
  rationale: Le verbe exprime ici le saisissement et la stupeur devant le sort de Tyr. Avec עַל, « à cause de toi » indique naturellement en français ce qui provoque cette réaction.
- source_word: וּמַלְכֵיהֶם
  choice: Leurs rois
  rationale: Le suffixe renvoie aux habitants des régions côtières mentionnés dans la proposition précédente.
- source_word: שָׂעֲרוּ שַׂעַר
  choice: frémissent d’épouvante
  rationale: La répétition d’un verbe et d’un nom de même racine forme une expression intensive évoquant une violente agitation. Cette formulation française en restitue à la fois l’intensité et la dimension physique.
- source_word: רָעֲמוּ פָּנִים
  choice: leurs visages se crispent
  rationale: L’expression difficile décrit vraisemblablement une agitation ou une déformation visible du visage. « Se crispent » conserve cette image physique sans la développer excessivement.
