  yaml_path: translation/ot/ezekiel/027/004.yaml
  text: Your borders are in the heart of the seas[b][a]; your builders perfected your beauty.
translation:
  language: fr
  text: Tes frontières sont au cœur des mers[a] ; ceux qui t’ont bâtie ont porté ta beauté à la perfection[b].
  philosophy: optimal-equivalence
  footnotes:
