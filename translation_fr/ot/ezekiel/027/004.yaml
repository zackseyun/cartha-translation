lexical_decisions:
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: Cette formulation conserve la métaphore spatiale de לֵב (« cœur ») et le pluriel יַמִּים (« mers »), tout en restant naturelle en français.
- source_word: גְּבוּלָיִךְ
  choice: tes frontières
  rationale: Le terme désigne les limites ou le territoire. « Tes frontières » est direct et préserve la personnification de Tyr.
- source_word: בֹּנַיִךְ
  choice: ceux qui t’ont bâtie
  rationale: Cette tournure rend clairement le participe « tes bâtisseurs » et accorde le participe passé avec la ville personnifiée, sans réduire explicitement l’image à des constructeurs de navires.
- source_word: כָּלְלוּ
  choice: ont porté … à la perfection
  rationale: Le verbe exprime l’idée d’achever ou de rendre parfait. Cette tournure française transmet l’aboutissement qualitatif sans suggérer que la beauté elle-même serait simplement terminée.
- source_word: יָפְיֵךְ
  choice: ta beauté
  rationale: Traduction directe qui maintient le langage poétique et la personnification.
