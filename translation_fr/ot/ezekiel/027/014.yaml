  text: מִ/בֵּ֖ית תּוֹגַרְמָ֑ה סוּסִ֤ים וּ/פָֽרָשִׁים֙ וּ/פְרָדִ֔ים נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: fr
  text: Ceux de Beth-Togarma[a] ont échangé avec toi des chevaux, des cavaliers[b] et des mulets contre tes marchandises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de la maison de Togarma ». L’expression peut désigner le peuple ou la région associés à Togarma.
    reason: lexical_alternative
  - marker: b
    text: Ou « des chevaux de cavalerie ». Le terme hébreu désigne habituellement des cavaliers, mais le contexte d’une liste de marchandises peut favoriser un sens équin.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: Ceux de Beth-Togarma
  rationale: Dans cette liste de partenaires commerciaux, l’expression désigne naturellement les gens ou le territoire associés à Togarma, plutôt qu’une maison au sens strict. « Beth-Togarma » conserve la forme traditionnelle du nom propre.
- source_word: סוּסִים
  choice: chevaux
  rationale: Équivalent français direct du nom hébreu au pluriel.
- source_word: וּפָרָשִׁים
  choice: des cavaliers
  rationale: Le sens courant du terme est « cavaliers » ou « hommes à cheval ». Le contexte commercial pourrait toutefois suggérer des chevaux de cavalerie; l’ambiguïté est signalée en note.
- source_word: וּפְרָדִים
  choice: des mulets
  rationale: Traduction usuelle et précise du terme désignant ces animaux.
- source_word: נָתְנוּ
  choice: ont échangé avec toi ... contre
  rationale: Littéralement « ont donné »; dans le cadre commercial d’Ézéchiel 27, la formulation française exprime naturellement un échange de marchandises.
- source_word: עִזְבוֹנָיִךְ
  choice: tes marchandises
  rationale: Le terme désigne ici les biens commerciaux de Tyr; « marchandises » est clair, actuel et adapté au contexte.
