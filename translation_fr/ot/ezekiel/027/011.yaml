base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: fr
  text: Les hommes d’Arvad, avec ton armée, se tenaient sur tes murailles, tout autour, et les Gammadites[a] étaient dans tes tours. Ils suspendaient leurs boucliers sur tes murailles, tout autour ; ils achevaient ta beauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « Gammadites » est obscur. Il pourrait désigner un peuple (on trouve aussi l’orthographe « Gamadites »), mais certains le comprennent plus généralement au sens de « guerriers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: Les hommes d’Arvad
  rationale: Littéralement « les fils d’Arvad », expression ethnogéographique hébraïque désignant les habitants, ici les hommes mobilisés. « Les hommes d’Arvad » est naturel en français et convient au contexte militaire.
- source_word: וְחֵילֵךְ
  choice: avec ton armée
  rationale: חַיִל désigne ici la force militaire de Tyr. « Armée » exprime clairement ce sens dans le contexte des défenseurs postés sur les murailles.
- source_word: עַל חוֹמוֹתַיִךְ סָבִיב
  choice: tout autour sur tes murailles
  rationale: La formulation conserve à la fois la position sur les murailles et l’idée qu’elles sont garnies sur tout leur pourtour.
- source_word: גַמָּדִים
  choice: les Gammadites[a]
  rationale: Ce terme obscur est probablement un gentilé. La translittération préserve l’incertitude plutôt que d’imposer une interprétation telle que « guerriers ».
- source_word: בְּמִגְדְּלוֹתַיִךְ הָיוּ
  choice: occupaient tes tours
  rationale: Littéralement « étaient dans tes tours ». « Occupaient tes tours » rend naturellement en français leur présence à un poste défensif sans surinterpréter leur fonction.
- source_word: שִׁלְטֵיהֶם תִּלּוּ
  choice: Ils suspendaient leurs boucliers
  rationale: שִׁלְטֵיהֶם désigne leurs boucliers et תִּלּוּ l’action de les accrocher ou suspendre. L’imparfait s’accorde au tableau descriptif du verset.
- source_word: הֵמָּה כָּלְלוּ יָפְיֵךְ
  choice: ainsi, ils rendaient ta beauté parfaite
  rationale: כָּלְלוּ exprime l’idée d’achever, de compléter ou de porter à la perfection. La traduction garde la force poétique et le rôle des défenseurs dans la splendeur de Tyr.
