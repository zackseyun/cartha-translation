base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: fr
  text: La Perse, Loud et Pout étaient dans ton armée en tant qu’hommes de guerre. Ils suspendaient chez toi boucliers et casques[a] ; ce sont eux qui te donnaient de la splendeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suspendaient sur toi boucliers et casques », l’image pouvant évoquer du matériel militaire exposé sur les murailles de Tyr ou à l’intérieur de la ville.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils donnaient ta splendeur » ; on peut aussi comprendre : « ils contribuaient à ta gloire » ou « ils te conféraient de la majesté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: la Perse
  rationale: Nom géographique usuel en français pour l’empire ou le peuple perse.
- source_word: לוּד
  choice: Loud
  rationale: Translittération française qui préserve le nom hébreu sans l’identifier de manière certaine à la Lydie.
- source_word: פוּט
  choice: Pout
  rationale: Translittération française directe de cet ethnonyme ou nom de territoire.
- source_word: בְחֵילֵךְ
  choice: dans ton armée
  rationale: Le contexte militaire immédiat impose ici le sens de force armée plutôt que celui de richesse ou de puissance au sens large.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: comme hommes de guerre
  rationale: Rend la construction hébraïque et son registre martial tout en s’intégrant naturellement à la phrase française.
- source_word: מָגֵן וְכוֹבַע
  choice: boucliers et casques
  rationale: Termes français courants correspondant aux deux pièces d’équipement militaire ; le pluriel distributif est naturel en français.
- source_word: תִּלּוּ בָךְ
  choice: ils suspendaient chez toi
  rationale: Le verbe signifie « suspendre » ; « chez toi » conserve l’adresse personnifiée à Tyr et l’idée d’un déploiement dans la ville sans imposer exclusivement « sur tes murs ».
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: ce sont eux qui faisaient ta splendeur
  rationale: Cette tournure française exprime que leur présence et leur équipement constituaient ou rehaussaient la magnificence de Tyr, tout en conservant l’insistance portée par הֵמָּה.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement féminin implicite de l’hébreu est maintenu dans l’adresse personnifiée à Tyr. Les noms Loud et Pout sont translittérés afin d’éviter des identifications géographiques trop affirmatives.
