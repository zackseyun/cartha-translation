  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
translation:
  language: fr
  text: Ils feront entendre leur voix à ton sujet et pousseront des cris amers ; ils jetteront de la poussière sur leur tête et se rouleront dans la cendre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ
  choice: ils feront entendre
  rationale: Le hifil de שׁמע exprime ici le fait de faire entendre. Cette formulation française conserve directement la valeur causative tout en restant naturelle.
- source_word: עָלַיִךְ
  choice: sur toi
  rationale: Dans ce contexte de lamentation sur Tyr, עַל désigne la personne ou la ville sur laquelle porte le deuil, plutôt qu’une parole hostile dirigée contre elle.
- source_word: בְּקוֹלָם
  choice: leur voix
  rationale: Le nom hébreu est au singulier avec un suffixe pluriel. Le collectif singulier « leur voix » reproduit cette forme et convient à l’action commune des endeuillés.
- source_word: וְיִזְעֲקוּ מָרָה
  choice: et pousseront des cris amers
  rationale: זעק évoque un cri puissant, tandis que מָרָה en caractérise l’amertume. « Pousser des cris amers » est idiomatique et garde l’image concrète du texte.
- source_word: וְיַעֲלוּ עָפָר
  choice: ils jetteront de la poussière
  rationale: עלה signifie littéralement faire monter, mais, avec la poussière placée sur la tête, décrit le geste rituel de la lancer sur soi en signe de deuil.
- source_word: עַל רָאשֵׁיהֶם
  choice: sur leur tête
  rationale: Le singulier distributif français indique naturellement que chacun met de la poussière sur sa propre tête.
- source_word: בָּאֵפֶר
  choice: dans la cendre
  rationale: La préposition ב indique ici la matière ou le milieu dans lequel ils se roulent. Le singulier collectif « la cendre » est naturel en français.
- source_word: יִתְפַּלָּשׁוּ
  choice: se rouleront
  rationale: La forme réfléchie décrit vraisemblablement le fait de se rouler ou de se vautrer dans la cendre comme geste de deuil. « Se rouler » est précis sans la nuance péjorative possible de « se vautrer ».
