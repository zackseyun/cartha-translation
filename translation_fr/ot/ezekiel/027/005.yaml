  text: בְּרוֹשִׁ֤ים מִ/שְּׂנִיר֙ בָּ֣נוּ לָ֔/ךְ אֵ֖ת כָּל לֻֽחֹתָ֑יִם אֶ֤רֶז מִ/לְּבָנוֹן֙ לָקָ֔חוּ לַ/עֲשׂ֥וֹת תֹּ֖רֶן עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: fr
  text: Avec des cyprès du Senir[a][b], ils ont construit tout ton bordage[c] ; ils ont pris un cèdre du Liban pour te faire un mât.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « genévriers » ou « sapins » ; l’espèce exacte désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le Senir est un nom régional associé au mont Hermon (voir Deutéronome 3.9).
    reason: cross_reference
  - marker: c
    text: Ou « toutes tes planches ». Le « bordage » est l’ensemble des planches qui revêtent la charpente d’un navire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: cyprès
  rationale: Le terme désigne vraisemblablement des conifères, mais l’espèce exacte reste incertaine. « Cyprès » est une traduction française courante qui convient au contexte de construction navale ; l’incertitude est signalée en note.
- source_word: מִשְּׂנִיר
  choice: du Senir
  rationale: Nom géographique associé au mont Hermon. L’article défini est naturel en français avec ce nom régional.
- source_word: בָּנוּ לָךְ
  choice: ils ont construit
  rationale: Le verbe בנה signifie normalement « construire ». Le possessif de la proposition suivante exprime naturellement en français que le travail est fait pour la destinataire.
- source_word: אֵת כָּל לֻחֹתָיִם
  choice: tout ton bordage
  rationale: Dans le contexte naval, לוּחַ désigne les planches constituant la coque. « Bordage » est le terme collectif français précis et conserve la deuxième personne féminine par « ton ».
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: un cèdre du Liban
  rationale: Le singulier concret « un cèdre » correspond au texte et convient à l’emploi de l’arbre pour fabriquer un seul mât.
- source_word: לָקָחוּ
  choice: ils ont pris
  rationale: Traduction directe de לקח, sans expliciter davantage l’acquisition ou le transport du bois.
- source_word: לַעֲשׂוֹת תֹּרֶן
  choice: pour te faire un mât
  rationale: תֹּרֶן signifie « mât ». Cette formulation française naturelle maintient le lien avec la destinataire personnifiée.
- source_word: עָלָיִךְ
  choice: te
  rationale: Littéralement « sur toi », mais dans ce contexte l’expression indique que le mât est destiné au navire personnifié. « Te faire » rend idiomatiquement cette relation sans ajouter l’idée d’un bénéficiaire distinct.
