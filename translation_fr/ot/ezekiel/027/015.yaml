  rationale: La révision limite l’interprétation de l’expression commerciale difficile סְחֹרַת יָדֵךְ. Elle remplace une formulation qui présente les régions comme des partenaires humains par une formulation de marché, conforme au contexte et à la piste d’audit anglaise, tout en maintenant explicitement l’incertitude en note. Les autres choix sont sûrs et sont conservés.
