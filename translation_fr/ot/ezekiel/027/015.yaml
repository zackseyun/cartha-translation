  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: fr
  text: Les gens de Dedân[a] étaient tes marchands. De nombreuses contrées maritimes étaient le marché de ton commerce[b] ; elles te remettaient en paiement des défenses d’ivoire[c] et de l’ébène[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils de Dedân ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le commerce de ta main » ; le sens précis de l’expression hébraïque est incertain. « Contrées maritimes » peut aussi se traduire par « îles ».
    reason: textual_or_semantic_ambiguity
  - marker: c
    text: Littéralement « des cornes d’ivoire ».
    reason: lexical_alternative
  - marker: d
    text: Ou « du bois d’ébène ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: les gens de Dedân
  rationale: L’expression hébraïque signifie littéralement « les fils de Dedân », mais désigne naturellement la population ou les ressortissants de Dedân. « Les gens de Dedân » garde le nom propre et évite une formulation généalogique trompeuse en français courant.
- source_word: רֹכְלַיִךְ
  choice: tes marchands
  rationale: Le nom désigne des commerçants itinérants ou des négociants. « Marchands » convient au registre commercial de tout le chapitre.
- source_word: אִיִּים רַבִּים
  choice: de nombreuses contrées maritimes
  rationale: אִיִּים peut désigner des îles aussi bien que des territoires côtiers. « Contrées maritimes » conserve cette portée géographique sans limiter le sens aux seules îles.
- source_word: סְחֹרַת יָדֵךְ
  choice: tes partenaires commerciaux
  rationale: Littéralement, l’expression est proche de « le commerce de ta main ». Dans ce contexte, elle présente ces régions comme engagées dans les échanges commerciaux de Tyr. La formulation choisie rend ce rapport clairement tout en signalant l’image hébraïque en note.
- source_word: קַרְנוֹת שֵׁן
  choice: des défenses d’ivoire
  rationale: Littéralement « des cornes d’ivoire », l’expression désigne des défenses utilisées comme marchandise. « Défenses d’ivoire » est précis et naturel.
- source_word: וְהוֹבְנִים
  choice: de l’ébène
  rationale: Le terme est traditionnellement compris comme désignant l’ébène, produit de luxe cohérent avec l’inventaire commercial du passage.
- source_word: הֵשִׁיבוּ אֶשְׁכָּרֵךְ
  choice: elles te remettaient en paiement
  rationale: Le hiphil de שׁוב exprime ici l’idée de rendre ou d’apporter en retour, tandis que אֶשְׁכָּר désigne une rétribution. La traduction exprime naturellement un paiement en nature sans réduire l’échange à un simple don.
