  rationale: Nom de lieu rare et incertain; la transcription est la solution la plus transparente.
- source_word: רֹכַלְתֵּךְ
  choice: commerçaient avec toi
  rationale: Rend naturellement en français le sens commercial du verbe avec le suffixe féminin singulier renvoyant à Tyr; le sujet composé appelle le pluriel en français.
