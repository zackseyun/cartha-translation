id: EZK.27.34
reference: Ezekiel 27:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵ֛ת נִשְׁבֶּ֥רֶת מִ/יַּמִּ֖ים בְּ/מַֽעֲמַקֵּי מָ֑יִם מַעֲרָבֵ֥/ךְ וְ/כָל קְהָלֵ֖/ךְ בְּ/תוֹכֵ֥/ךְ נָפָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: fr
  text: Au moment où tu as été brisée par les mers dans les profondeurs des eaux[a], tes marchandises et toute ton assemblée[b], au milieu de toi, sont tombées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand tu as été brisée par les mers dans les profondeurs des eaux. »'
    reason: lexical_alternative
  - marker: b
    text: '« Ton assemblée » peut désigner au sens large toutes les personnes réunies dans Tyr : ses habitants, ses commerçants et ses gens de mer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: Au moment où
  rationale: Le nom temporel est conservé par une tournure française naturelle, plutôt que d’être simplement réduit à « quand ».
- source_word: נִשְׁבֶּרֶת
  choice: tu as été brisée
  rationale: Le passif féminin singulier correspond à Tyr, apostrophée comme une figure féminine, et maintient l’image de sa destruction sans la limiter explicitement à un naufrage.
- source_word: מִיַּמִּים
  choice: par les mers
  rationale: La préposition peut ici exprimer l’agent ou la cause avec le passif; le pluriel « mers » reflète la forme hébraïque.
- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: dans les profondeurs des eaux
  rationale: Cette formulation restitue la construction littérale et son image maritime sans remplacer « eaux » par « mer ».
- source_word: מַעֲרָבֵךְ
  choice: tes marchandises
  rationale: Dans le contexte commercial d’Ézéchiel 27, le terme désigne les biens échangés ou transportés; « marchandises » est clair, large et idiomatique.
- source_word: וְכָל קְהָלֵךְ
  choice: et toute ton assemblée
  rationale: « Assemblée » garde le sens collectif de קהל sans le restreindre aux seuls marins, négociants ou habitants.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: Cette expression française naturelle préserve la localisation à l’intérieur de Tyr, représentée à la fois comme ville et comme navire.
- source_word: נָפָלוּ
  choice: sont tombées
  rationale: Le sens fondamental de נפל est maintenu; le contexte maritime laisse entendre la perte ou l’engloutissement sans l’expliciter à la place du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin de l’adresse à Tyr est conservé, ainsi que la tension entre l’image de la ville et celle du navire. Les formulations littérales « par les mers » et « profondeurs des eaux » préservent l’imagerie et le nombre du texte hébreu.
