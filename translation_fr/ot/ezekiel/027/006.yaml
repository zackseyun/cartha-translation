  text: אַלּוֹנִים֙ מִ/בָּ֔שָׁן עָשׂ֖וּ מִשּׁוֹטָ֑יִ/ךְ קַרְשֵׁ֤/ךְ עָֽשׂוּ שֵׁן֙ בַּת אֲשֻׁרִ֔ים מֵ/אִיֵּ֖י כתים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: fr
  text: Ils ont fait tes rames avec des chênes du Bashân ; ils ont fait ton pont[a] d’ivoire incrusté dans du buis[b] provenant des îles de Kittim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes planches » ou « ton bordage ». Le terme hébreu désigne des planches et peut viser plus précisément une partie du revêtement du navire.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu difficile : littéralement « ivoire, fille des Ashourim ». Beaucoup y voient le nom d’un bois, souvent le buis ou le cyprès, et comprennent l’expression comme de l’ivoire incrusté dans ce bois.'
    reason: alternative_reading
  - marker: c
    text: « Kittim » désigne probablement Chypre ou, plus largement, des régions maritimes situées à l’ouest.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: chênes
  rationale: Le terme désigne de grands arbres au bois dur et peut aussi être compris comme « térébinthes ». Dans ce contexte de construction navale et en lien avec les forêts du Bashân, « chênes » est le rendu français le plus naturel.
- source_word: מִבָּשָׁן
  choice: du Bashân
  rationale: Le préfixe indique l’origine géographique du bois. La translittération traditionnelle « Bashân » reste claire en français biblique moderne.
- source_word: מִשּׁוֹטָיִךְ
  choice: tes rames
  rationale: Dans la métaphore maritime du chapitre, le mot désigne les instruments servant à faire avancer le navire à la rame.
- source_word: קַרְשֵׁךְ
  choice: ton pont
  rationale: Le nom désigne une planche ou un assemblage de planches. « Pont » exprime naturellement en français sa fonction probable dans le navire, tandis que l’incertitude précise est signalée en note.
- source_word: שֵׁן
  choice: ivoire
  rationale: Littéralement « dent », le mot désigne couramment l’ivoire lorsqu’il s’agit d’un matériau travaillé.
- source_word: בַּת אֲשֻׁרִים
  choice: incrusté dans du buis
  rationale: L’expression hébraïque est obscure. Dans cette liste de matériaux navals luxueux, elle est souvent comprise comme la mention d’un bois, probablement du buis, associé à l’ivoire dans un travail d’incrustation. La difficulté et la forme littérale sont conservées en note.
- source_word: מֵאִיֵּי כִתִּים
  choice: venu des îles de Kittim
  rationale: אִיִּים peut désigner des îles ou des régions côtières. « Îles de Kittim » conserve directement l’expression géographique hébraïque sans la réduire avec certitude à Chypre.
