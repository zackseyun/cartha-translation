  text: At the sound of the cry of your pilots[b][a], the pasturelands will quake.
translation:
  language: fr
  text: Au bruit du cri de tes marins[a], les espaces ouverts[b] trembleront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pilotes »; le terme hébreu peut désigner plus précisément ceux qui manœuvrent ou dirigent un navire.
    reason: lexical_alternative
  - marker: b
    text: Ou « pâturages » ou « terrains communaux »; il s’agit d’espaces ouverts autour d’une agglomération, et non de banlieues au sens moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל
  choice: Au bruit de
  rationale: קוֹל peut désigner une voix, un son ou un bruit. Avec לְ, « Au bruit de » exprime naturellement ici la circonstance qui provoque le tremblement.
- source_word: זַעֲקַת
  choice: du cri de
  rationale: Le nom issu de זעק désigne un cri, souvent poussé dans la détresse. Le singulier hébreu est conservé.
- source_word: חֹבְלָיִךְ
  choice: tes marins
  rationale: Dans ce contexte maritime, le terme désigne les hommes qui manœuvrent ou dirigent le navire. « Marins » garde une portée assez large; « pilotes » demeure une possibilité plus précise.
- source_word: יִרְעֲשׁוּ
  choice: trembleront
  rationale: רעש évoque une violente secousse ou un tremblement. « Trembleront » convient au langage poétique de la lamentation.
- source_word: מִגְרֹשׁוֹת
  choice: les terrains découverts
  rationale: מִגְרָשׁ désigne normalement les espaces ouverts situés autour d’une agglomération, notamment des pâturages ou terrains communaux. Cette formulation évite le sens résidentiel moderne de « banlieues ».
