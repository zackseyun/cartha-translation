  text: שֵׁשׁ בְּ/רִקְמָ֤ה מִ/מִּצְרַ֨יִם֙ הָיָ֣ה מִפְרָשֵׂ֔/ךְ לִ/הְי֥וֹת לָ֖/ךְ לְ/נֵ֑ס תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן מֵ/אִיֵּ֥י אֱלִישָׁ֖ה הָיָ֥ה מְכַסֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: fr
  text: Du fin lin brodé d’Égypte était ta voile, te servant d’étendard[a] ; des étoffes bleues et pourpres venues des îles d’Élisha[b] formaient ta couverture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bannière » ou « de signal ». Le terme hébreu désigne quelque chose de visible de loin, comme un étendard, une bannière ou un signal.
    reason: lexical_alternative
  - marker: b
    text: Ou « des côtes d’Élisha ». Le terme hébreu peut désigner des îles ou des régions côtières.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: le fin lin brodé
  rationale: L’expression désigne un lin de qualité travaillé en broderie; cette formulation naturelle conserve le caractère luxueux du textile.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Marque simplement la provenance du textile.
- source_word: מִפְרָשֵׂךְ
  choice: te servait de voile
  rationale: Dans la métaphore maritime qui présente Tyr comme un navire, מִפְרָשׂ désigne la voile.
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: et d’étendard
  rationale: נֵס peut désigner un étendard, une bannière ou un signal visible de loin. « Étendard » convient à la fonction emblématique de la voile.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: les étoffes bleu-violet et pourpres
  rationale: Les deux termes désignent des matières teintes autant que des couleurs; « étoffes » est explicité d’après le contexte, et « bleu-violet » garde la nuance chromatique possible de תְּכֵלֶת.
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: venues des îles d’Élisha
  rationale: אִיִּים peut désigner des îles ou des régions côtières. « Îles » est retenu dans le texte, avec l’autre possibilité en note.
- source_word: מְכַסֵּךְ
  choice: formaient ta couverture
  rationale: Le mot désigne ce qui couvre le navire; « couverture » préserve l’image sans imposer le sens technique plus précis de « auvent ».
theological_decisions: []
