  text: וְֽ/יָרְד֞וּ מֵ/אָנִיּֽוֹתֵי/הֶ֗ם כֹּ֚ל תֹּפְשֵׂ֣י מָשׁ֔וֹט מַלָּחִ֕ים כֹּ֖ל חֹבְלֵ֣י הַ/יָּ֑ם אֶל הָ/אָ֖רֶץ יַעֲמֹֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/029.yaml
  text: And all who handle the oar will come down from their ships[a]; the sailors, all the mariners of the sea[b], will stand on the land.
translation:
  language: fr
  text: Tous ceux qui manient la rame descendront de leurs navires ; les marins, tous les gens de mer[a], se tiendront sur la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « tous les marins de la mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: descendront
  rationale: Le verbe ירד décrit le mouvement depuis les navires vers la terre. Dans le contexte prophétique de la lamentation, le futur français restitue naturellement la progression de la scène.
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: de leurs navires
  rationale: אֳנִיָּה désigne ici un bâtiment de mer ; « navires » convient au registre maritime et מן marque le point de départ.
- source_word: כֹּל תֹּפְשֵׂי מָשׁוֹט
  choice: tous ceux qui manient la rame
  rationale: Cette formulation conserve l’image concrète de תפשׂ, « saisir, manier », et de מָשׁוֹט, « rame », sans réduire d’emblée le groupe au terme fonctionnel « rameurs ».
- source_word: מַלָּחִים
  choice: les marins
  rationale: « Marins » est le terme français moderne, clair et usuel correspondant à מַלָּחִים.
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: tous les gens de mer
  rationale: חֹבְלֵי הַיָּם désigne ceux qui exercent la navigation en mer. « Gens de mer » préserve la portée collective et le parallélisme avec « les marins » sans produire une répétition maladroite.
- source_word: אֶל הָאָרֶץ יַעֲמֹדוּ
  choice: se tiendront sur la terre ferme
  rationale: Dans ce contraste maritime, הָאָרֶץ désigne la terre par opposition aux navires et à la mer. « Se tiendront » rend simplement עמד, tandis que « sur la terre ferme » exprime naturellement en français la situation après le débarquement.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et concret. Le parallélisme maritime de l’hébreu est conservé, avec une légère variation idiomatique entre « marins » et « gens de mer ».
