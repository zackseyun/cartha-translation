base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: fr
  text: Les anciens de Guébal[a] et ses hommes expérimentés étaient chez toi pour réparer tes brèches[b]. Tous les navires de la mer et leurs marins étaient chez toi pour faire le commerce de tes marchandises[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Guébal est la ville phénicienne appelée plus tard Byblos en grec.
    reason: alternative_reading
  - marker: b
    text: Ou « tes fissures »; le terme hébreu peut désigner des dégâts structurels, des brèches ou des jointures à réparer.
    reason: lexical_alternative
  - marker: c
    text: Ou « troquer tes marchandises ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: les anciens
  rationale: Dans cette liste de peuples et de fonctions, le terme désigne vraisemblablement les anciens ou dirigeants civiques, tout en conservant sa connotation d’âge et de statut.
- source_word: גְבַל
  choice: Guébal
  rationale: Le nom hébreu du lieu est translittéré en français; la forme grecque plus connue, Byblos, est signalée en note.
- source_word: חֲכָמֶיהָ
  choice: ses hommes expérimentés
  rationale: Dans ce contexte maritime et technique, le mot évoque un savoir-faire pratique plutôt qu’une sagesse abstraite. Cette formulation préserve aussi la référence masculine du pluriel hébreu.
- source_word: הָיוּ בָךְ
  choice: étaient chez toi
  rationale: L’expression s’adresse à Tyr personnifiée. « Chez toi » rend naturellement la présence en son sein sans imposer une lecture exclusivement urbaine ou exclusivement navale.
- source_word: מַחֲזִיקֵי בִּדְקֵךְ
  choice: pour réparer tes brèches
  rationale: Le participe de חזק associé à בדק décrit l’action de consolider ou de réparer une détérioration structurelle. « Brèches » reste proche du terme hébreu sans préciser indûment des coutures ou des fuites.
- source_word: כָּל אֳנִיּוֹת הַיָּם
  choice: tous les navires de la mer
  rationale: Traduction directe qui conserve l’ampleur universelle et l’image maritime.
- source_word: מַלָּחֵיהֶם
  choice: leurs marins
  rationale: Équivalent français moderne et usuel des hommes d’équipage.
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  choice: pour échanger tes marchandises
  rationale: Les deux mots apparentés expriment l’échange commercial. La formulation est claire en français moderne tout en conservant l’idée de troc ou de commerce.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Étaient chez toi » est répété pour refléter la structure hébraïque, tandis que « hommes expérimentés » exprime le savoir-faire technique requis par le contexte maritime.
