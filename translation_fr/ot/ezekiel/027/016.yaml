base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: fr
  text: Aram faisait du commerce avec toi en raison de l’abondance de tes produits et te fournissait, en échange de tes marchandises, de la turquoise[a], de la pourpre, des étoffes brodées, du fin lin, du corail[b] et des rubis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « émeraude » ou « escarboucle »; l’identification exacte de cette pierre précieuse hébraïque est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Peut-être une autre matière de luxe, comme la nacre; le sens du terme hébreu rendu par « corail » est incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « agate », « grenat » ou une autre pierre précieuse; l’identification exacte du terme hébreu rendu par « rubis » est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram
  rationale: La translittération conserve le nom hébreu de la région et évite de l’assimiler sans nuance à un État moderne.
- source_word: סֹחַרְתֵּךְ
  choice: faisait du commerce avec toi
  rationale: Cette tournure française naturelle exprime l’activité commerciale indiquée par la forme issue de סחר.
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: en raison de l’abondance de tes produits
  rationale: Dans cette liste commerciale, les « œuvres » ou objets fabriqués désignent vraisemblablement la production abondante de Tyr; la valeur causale de מִן est conservée.
- source_word: נֹפֶךְ
  choice: turquoise
  rationale: Cette identification convient à la liste de produits de luxe, mais le nom exact de la pierre demeure incertain et fait donc l’objet d’une note.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le terme désigne une matière ou une teinture pourpre de luxe; « pourpre » garde cette légère indétermination.
- source_word: רִקְמָה
  choice: étoffes brodées
  rationale: Le nom évoque un ouvrage textile brodé; le pluriel s’intègre naturellement à l’énumération des marchandises.
- source_word: בוּץ
  choice: fin lin
  rationale: Cette expression claire et courante rend le textile fin sans recourir au terme technique « byssus ».
- source_word: רָאמֹת
  choice: corail
  rationale: Dans ce contexte, le mot rare paraît désigner une matière précieuse telle que le corail, mais son sens exact reste incertain.
- source_word: כַדְכֹּד
  choice: rubis
  rationale: Le contexte appelle une pierre précieuse; « rubis » est plausible, tandis que la note préserve l’incertitude de l’identification.
- source_word: נָתְנוּ
  choice: on donnait
  rationale: Le sujet pluriel implicite renvoie naturellement aux gens ou marchands d’Aram. Le pronom indéfini français évite d’ajouter explicitement un référent absent de l’hébreu.
- source_word: בְּעִזְבוֹנָיִךְ
  choice: en échange de tes marchandises
  rationale: La tournure explicite naturellement la relation d’échange commercial exprimée dans le contexte.
