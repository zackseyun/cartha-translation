  text: תַּרְשִׁ֥ישׁ סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/כֶ֤סֶף בַּרְזֶל֙ בְּדִ֣יל וְ/עוֹפֶ֔רֶת נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: fr
  text: Tarsis[a] était ta partenaire commerciale, en raison de l’abondance de tes richesses. En échange de tes marchandises, ils donnaient de l’argent, du fer, de l’étain et du plomb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On identifie parfois Tarsis à Tartessos, dans le sud de l’Espagne, mais sa localisation reste incertaine.
    reason: 'Note culturelle : le texte donne le nom de Tarsis sans en préciser l’identification géographique.'
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Forme française traditionnelle du nom propre hébreu; le texte nomme le lieu sans l’identifier explicitement à Tartessos.
- source_word: סֹחַרְתֵּךְ
  choice: commerçait avec toi
  rationale: Rend naturellement en français le rapport commercial exprimé par le substantif «ton commerçant/partenaire commercial», tout en conservant le singulier grammatical de Tarsis.
- source_word: מֵרֹב כָּל הוֹן
  choice: à cause de l’abondance de toutes sortes de richesses
  rationale: Préserve la valeur causale probable de מִן, l’idée d’abondance et la portée de כָּל sans réduire הוֹן à une seule sorte de richesse.
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: de l’argent, du fer, de l’étain et du plomb
  rationale: Liste directe des métaux fournis dans l’échange; les articles partitifs sont idiomatiques en français.
- source_word: נָתְנוּ
  choice: ses gens donnaient
  rationale: Conserve le sens fondamental de «donner» plutôt que d’imposer «payer»; le sujet pluriel implicite est explicité sobrement comme les gens de Tarsis.
- source_word: עִזְבוֹנָיִךְ
  choice: tes marchandises
  rationale: Terme commercial clair et courant; dans la construction, il désigne les biens de Tyr contre lesquels les métaux sont donnés.
