lexical_decisions:
- source_word: דְּדָן
  choice: Dedân
  rationale: Nom propre de lieu, translittéré selon l’usage français biblique moderne.
- source_word: רֹכַלְתֵּךְ
  choice: faisait du commerce avec toi
  rationale: Le terme désigne ici l’activité marchande; cette formulation naturelle conserve l’adresse directe à Tyr portée par le suffixe féminin singulier.
- source_word: בְּבִגְדֵי חֹפֶשׁ
  choice: en couvertures de selle
  rationale: בגד désigne un vêtement ou une étoffe, tandis que חֹפֶשׁ semble être ici un terme textile spécialisé. Le contexte de לְרִכְבָּה favorise des pièces d’équipement destinées à la monte, sans que le sens exact soit assuré.
- source_word: לְרִכְבָּה
  choice: de selle
  rationale: Le mot se rapporte à l’action de monter ou à l’équipement de monte. Intégré à « couvertures de selle », il rend idiomatiquement la destination de ces textiles sans préciser indûment l’animal ou un char.
