revisions:
- from: Dan[a] et Yavân d’Ouzal[b] commerçaient avec toi ; ils échangeaient contre tes marchandises du fer travaillé, de la casse[c] et du roseau aromatique.
  to: Dan[a] et Yavân, venant d’Ouzal[b], faisaient du commerce avec toi ; ils y fournissaient du fer ouvré, de la casse[c] et du calame.
  rationale: 'La révision conserve la lecture massorétique « Dan », la translittération des noms et l’incertitude concernant le rapport entre Yavân et Ouzal. Elle rend le verbe commercial par « fournissaient » et le dernier complément par « y », sans introduire explicitement un troc qui n’est qu’implicite. Les ancres sont désormais informatives : b correspond à la difficulté syntaxique, c à l’alternative pour קִדָּה.'
