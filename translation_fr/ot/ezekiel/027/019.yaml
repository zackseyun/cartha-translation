base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: fr
  text: Dan[a] et Yavân, venant d’Ouzal[b], faisaient du commerce avec toi ; ils y fournissaient du fer ouvré, de la casse[c] et du calame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Dan » ; certains lisent « Vedân » ou proposent une autre correction, car le texte est difficile.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Yavân d’Ouzal ». Le lien syntaxique entre « Yavân » et « Ouzal » est difficile en hébreu.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « cassia » ou « cannelle-casse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: Dan
  rationale: Le texte massorétique porte « Dan ». Le nom est conservé malgré la difficulté textuelle, signalée en note.
- source_word: וְיָוָן
  choice: Yavân
  rationale: La translittération du nom propre hébreu convient à cette liste de partenaires commerciaux et évite de préciser abusivement « Grèce » ou « Ioniens ».
- source_word: מְאוּזָּל
  choice: d’Ouzal
  rationale: Le terme est compris comme le toponyme Ouzal précédé de la préposition « de ». Son lien syntaxique avec Yavân demeure toutefois difficile.
- source_word: בְּעִזְבוֹנַיִךְ נָתָנּוּ
  choice: commerçaient avec toi ; ils échangeaient
  rationale: Dans ce catalogue commercial, le sens contextuel est celui d’une transaction plutôt que du simple fait de « donner ».
- source_word: בַּרְזֶל עָשׁוֹת
  choice: du fer travaillé
  rationale: L’expression désigne vraisemblablement du fer ouvré ou manufacturé, et non du minerai brut.
- source_word: קִדָּה
  choice: de la casse
  rationale: Le mot désigne généralement la casse, produit aromatique entrant naturellement dans un inventaire commercial.
- source_word: וְקָנֶה
  choice: du roseau aromatique
  rationale: Le contexte commercial et la proximité d’un aromate favorisent le sens de roseau odorant, tout en restant plus accessible que le terme technique « calamus ».
- source_word: בְּמַעֲרָבֵךְ
  choice: contre tes marchandises
  rationale: Cette formulation française exprime naturellement la valeur commerciale du terme et le rapport d’échange.
