id: EZK.27.13
reference: Ezekiel 27:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָוָ֤ן תֻּבַל֙ וָ/מֶ֔שֶׁךְ הֵ֖מָּה רֹֽכְלָ֑יִ/ךְ בְּ/נֶ֤פֶשׁ אָדָם֙ וּ/כְלֵ֣י נְחֹ֔שֶׁת נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: fr
  text: Yavân, Toubal et Méchek faisaient du commerce avec toi ; ils échangeaient des êtres humains[a] et des objets de bronze contre tes marchandises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des vies humaines » ou « des personnes » ; dans ce contexte, il s’agit vraisemblablement de personnes vendues comme esclaves.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָוָן
  choice: Yavân
  rationale: Transcription française usuelle du nom hébreu de ce peuple ou territoire, sans le remplacer par son identification contextuelle possible, « Grèce ».
- source_word: תֻּבַל
  choice: Toubal
  rationale: Transcription française usuelle du nom propre désignant un peuple ou une région.
- source_word: מֶשֶׁךְ
  choice: Méchek
  rationale: Transcription française claire du nom propre hébreu désignant un peuple ou une région.
- source_word: רֹכְלָיִךְ
  choice: faisaient du commerce avec toi
  rationale: Rend naturellement en français la relation commerciale exprimée par le nom « commerçants/négociants », tout en conservant l’adresse directe à Tyr.
- source_word: בְּנֶפֶשׁ אָדָם
  choice: des êtres humains
  rationale: L’expression signifie littéralement « vie/personne humaine » et, dans ce contexte commercial, présente des humains comme objets d’échange. Cette formulation reste nette sans préciser au-delà du texte leur statut juridique.
- source_word: כְלֵי נְחֹשֶׁת
  choice: des objets de bronze
  rationale: Expression générale qui couvre divers articles manufacturés en bronze ; « récipients » serait trop restrictif.
- source_word: נָתְנוּ
  choice: ils échangeaient
  rationale: Le verbe signifie littéralement « donner », mais prend ici une valeur commerciale en relation avec les marchandises reçues en contrepartie.
- source_word: מַעֲרָבֵךְ
  choice: tes marchandises
  rationale: Dans le contexte commercial d’Ézéchiel 27, le terme désigne les biens faisant l’objet de l’échange ; « marchandises » est naturel et précis en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase évite le tour nominal plus lourd « étaient tes commerçants » et emploie une syntaxe commerciale naturelle, sans atténuer le caractère choquant du commerce d’êtres humains.
