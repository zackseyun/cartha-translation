source:
  edition: WLC
  text: סֹֽחֲרִים֙ בָּ֣/עַמִּ֔ים שָׁרְק֖וּ עָלָ֑יִ/ךְ בַּלָּה֣וֹת הָיִ֔ית וְ/אֵינֵ֖/ךְ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/036.yaml
  text: Merchants among the peoples hiss at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: fr
  text: Les marchands parmi les peuples sifflent contre toi[a]. Tu es devenue un objet d’épouvante[b], et tu ne seras plus jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sifflent à ton sujet ». Le verbe hébreu peut évoquer un sifflement exprimant la stupéfaction ou la dérision.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « des épouvantes » ; le pluriel peut avoir ici un sens collectif : « une chose épouvantable » ou « un objet d’épouvante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹחֲרִים
  choice: les marchands
  rationale: Le participe de סחר désigne ceux qui pratiquent le commerce. « Marchands » est naturel en français et convient au contexte commercial de la complainte sur Tyr.
- source_word: בָּעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel עַמִּים désigne les divers peuples; cette formulation conserve la portée internationale sans imposer la notion politique moderne de nations.
- source_word: שָׁרְקוּ
  choice: sifflent
  rationale: Le verbe שׁרק peut évoquer un sifflement hostile ou stupéfait. « Sifflent » conserve l’image sonore et laisse au contexte le soin d’en préciser la nuance.
- source_word: עָלָיִךְ
  choice: à ton sujet
  rationale: Avec שׁרק, עַל peut présenter la personne qui provoque ou subit cette réaction. « À ton sujet » est idiomatique et préserve une certaine latitude entre réaction dirigée contre Tyr et réaction suscitée par son sort.
- source_word: בַּלָּהוֹת
  choice: un objet d’épouvante
  rationale: Le nom pluriel peut désigner des terreurs ou, collectivement, quelque chose qui inspire l’effroi. Cette tournure française rend naturellement le prédicat sans effacer la forme plurielle signalée en note.
- source_word: הָיִית
  choice: tu es devenue
  rationale: Le qatal présente l’état atteint par Tyr à l’issue du jugement; le passé composé exprime naturellement ce résultat actuel en français.
- source_word: וְאֵינֵךְ
  choice: tu ne seras plus
  rationale: La construction existentielle négative, éclairée par עַד עוֹלָם, annonce la disparition définitive de Tyr dans le cadre de l’oracle.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Après « ne seras plus », « jamais » rend avec naturel et force la permanence exprimée par l’idiome hébreu.
theological_decisions:
- issue: Portée de la clause finale dans l’oracle de jugement
  choice: « tu ne seras plus jamais »
  alternative: « tu n’es plus, pour toujours »
  rationale: L’expression existentielle négative suivie de עַד עוֹלָם marque une fin irréversible. La traduction en conserve la gravité sans en tirer une affirmation métaphysique dépassant la portée de l’oracle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’accord au féminin (« devenue ») correspond à Tyr, ville personnifiée. Le rythme en deux phrases restitue la réaction des marchands puis l’issue irréversible du jugement.
