  yaml_path: translation/ot/ezekiel/027/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit un nouvel épisode. En français, il s’intègre naturellement à la tournure « la parole… fut adressée », sans calquer « et il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans דְבַר יְהוָה, « la parole » conserve la formule prophétique consacrée et sa portée théologique, tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de le remplacer par le titre « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français la direction indiquée par la préposition אֶל et le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit le discours direct qui suit. « En ces termes : » remplit cette fonction avec naturel et dignité en français moderne.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la valeur de nom personnel, tandis que « le Seigneur » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français moderne, sobre et digne. La formule passive idiomatique « la parole… me fut adressée » restitue naturellement l’introduction prophétique hébraïque; les deux-points annoncent le discours du verset suivant.
