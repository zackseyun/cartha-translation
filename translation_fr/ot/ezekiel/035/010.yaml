source:
  edition: WLC
  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: fr
  text: 'Parce que tu as dit : « Les deux nations et les deux pays seront à moi, et nous en prendrons possession », bien que Yahvé fût là[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et Yahvé était là » ou « tandis que Yahvé était là ». La conjonction hébraïque peut être comprise de plusieurs façons ; le texte principal lui donne ici une valeur concessive.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: Parce que tu as dit
  rationale: La tournure introduit la cause du jugement. Une proposition verbale est naturelle en français et conserve l’adresse au singulier.
- source_word: שְׁנֵי הַגּוֹיִם
  choice: les deux nations
  rationale: L’article hébreu est rendu directement par l’article défini français. Le référent précis reste implicite comme dans le texte source.
- source_word: שְׁתֵּי הָאֲרָצוֹת
  choice: les deux pays
  rationale: Dans ce contexte territorial et politique, « pays » est plus naturel que « terres » en français moderne, sans préciser les territoires au-delà de l’hébreu.
- source_word: לִי תִהְיֶינָה
  choice: seront à moi
  rationale: Rend avec concision la revendication de possession.
- source_word: וִירַשְׁנוּהָ
  choice: nous en prendrons possession
  rationale: ירשׁ exprime ici l’acquisition effective du territoire. Le pronom français « en » renvoie naturellement aux deux pays, tandis que le suffixe hébreu féminin singulier envisage vraisemblablement l’ensemble territorial collectivement.
- source_word: וַיהוָה
  choice: Yahvé
  rationale: Translittération française traditionnelle du nom divin, qui conserve le caractère personnel du tétragramme.
- source_word: שָׁם הָיָה
  choice: alors que Yahvé était là
  rationale: La locution concessive fait ressortir la présomption d’Édom tout en laissant une note signaler que la conjonction hébraïque peut aussi être simplement coordonnante.
theological_decisions:
- issue: Valeur de la proposition finale וַיהוָה שָׁם הָיָה
  choice: alors que Yahvé était là
  alternative: et Yahvé était là ; tandis que Yahvé était là
  rationale: 'Le contexte donne probablement à la coordination une portée concessive : la revendication est formulée malgré la présence et la souveraineté de Yahvé. La note conserve toutefois l’ambiguïté syntaxique réelle.'
- issue: Référent des deux nations et des deux pays
  choice: Référent laissé implicite
  alternative: Israël et Juda, avec leurs territoires
  rationale: Le verset ne les nomme pas. La traduction n’introduit donc pas cette identification dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. L’adresse reste au singulier. L’article défini de l’hébreu est rendu directement, sans ajouter le démonstratif « ces ». Le tiret final maintient le caractère suspendu de la phrase, qui se poursuit au verset suivant.
