  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: fr
  text: Je ferai de toi une désolation perpétuelle[a], et tes villes ne seront pas habitées. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une désolation éternelle » ou « des désolations perpétuelles ». Le nom hébreu est au pluriel, probablement pour renforcer l’idée de dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת עוֹלָם
  choice: une désolation perpétuelle
  rationale: Le pluriel hébreu שִׁמְמוֹת peut donner au jugement une force intensive. Le français naturel privilégie ici le singulier collectif « désolation », tandis que « perpétuelle » exprime la durée indéfiniment prolongée de עוֹלָם dans ce contexte.
- source_word: אֶתֶּנְךָ
  choice: Je ferai de toi
  rationale: Littéralement « je te donnerai/établirai », le verbe signifie ici placer quelqu’un dans un état; « faire de toi » rend naturellement cette construction prédicative.
- source_word: וְעָרֶיךָ
  choice: Tes villes
  rationale: עִיר désigne couramment une ville ou une cité; « villes » convient au registre et au contexte.
- source_word: לֹא תישבנה
  choice: ne seront plus habitées
  rationale: Avec les villes pour sujet, le verbe signifie qu’elles ne seront pas habitées. « Plus » explicite la cessation durable impliquée par le jugement sans modifier son contenu essentiel.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: La conjonction introduit ici le résultat du jugement. Le passage du singulier « toi » au pluriel « vous » est conservé conformément à l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Portée temporelle de עוֹלָם dans l’annonce du jugement
  choice: perpétuelle
  alternative: éternelle / pour toujours
  rationale: « Perpétuelle » conserve la force d’une désolation durable et indéfinie sans trancher au-delà de ce que le terme hébreu impose dans ce contexte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Alternance du singulier et du pluriel dans les destinataires
  choice: « toi » puis « vous »
  alternative: uniformiser au singulier ou au pluriel
  rationale: L’hébreu passe du suffixe masculin singulier dans « de toi/tes villes » au verbe masculin pluriel « vous saurez ». Cette tension grammaticale est maintenue plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et solennel. La ponctuation en trois phrases clarifie la progression jugement–conséquence–reconnaissance. L’alternance hébraïque entre le singulier et le pluriel est volontairement préservée.
