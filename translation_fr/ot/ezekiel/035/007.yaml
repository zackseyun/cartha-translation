reference: Ezekiel 35:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת הַ֣ר שֵׂעִ֔יר לְ/שִֽׁמְמָ֖ה וּ/שְׁמָמָ֑ה וְ/הִכְרַתִּ֥י מִמֶּ֖/נּוּ עֹבֵ֥ר וָ/שָֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/007.yaml
  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
translation:
  language: fr
  text: Je ferai du mont Séir un lieu désolé et dévasté, et j’en retrancherai tous ceux qui passent et reviennent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ceux qui vont et viennent ». Les participes hébreux peuvent désigner, par leur association, toute circulation à travers le pays.'
    reason: alternative lexicale et préservation de l’ambiguïté de l’expression hébraïque
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai de
  rationale: Dans cette construction, נָתַן signifie établir ou rendre dans un certain état. « Je ferai de » exprime naturellement en français cette valeur résultative.
- source_word: הַר שֵׂעִיר
  choice: le mont Séir
  rationale: Le nom propre est conservé selon sa forme française usuelle, et הַר est rendu directement par « mont ».
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  choice: un lieu désolé et dévasté
  rationale: Les deux termes hébreux très proches renforcent l’image de ruine. Deux adjectifs distincts en gardent l’intensité sans produire en français la formulation peu naturelle « une désolation et une dévastation ».
- source_word: וְהִכְרַתִּי
  choice: j’en retrancherai
  rationale: Le hiphil de כרת signifie ici supprimer ou faire disparaître. « Retrancher » conserve l’image du verbe hébreu et le ton solennel du jugement.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom renvoie au mont Séir considéré comme territoire ; « en » rend naturellement en français l’idée de retrait hors de ce lieu.
- source_word: עֹבֵר וָשָׁב
  choice: tous ceux qui passent et reviennent
  rationale: Les deux participes sont rendus sans réduire leur possible portée mérismatique. « Tous ceux » explicite la valeur collective probable dans ce contexte de dépeuplement.
theological_decisions:
- issue: Intensification du jugement par deux termes voisins désignant la dévastation
  choice: 'Conserver deux éléments distincts : « désolé et dévasté »'
  alternative: Réunir les deux termes dans une expression comme « entièrement dévasté »
  rationale: La répétition sémantique appartient à la rhétorique de l’oracle de jugement ; la conserver transmet son intensité sans ajouter de précision doctrinale.
- issue: Portée de עֹבֵר וָשָׁב
  choice: « tous ceux qui passent et reviennent »
  alternative: « tous ceux qui vont et viennent »
  rationale: La traduction principale reste proche des participes hébreux, tandis que la note signale qu’ils peuvent former un mérisme désignant toute circulation dans le territoire.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure « faire de… un lieu » est naturelle, tandis que « retrancher » maintient la force judiciaire du passage. Le marqueur [a] est placé après l’expression qu’il explique.
