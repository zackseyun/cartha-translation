  to: C’est pourquoi, aussi vrai que je suis vivant — oracle du Seigneur Yahweh —, je te traiterai selon ta colère et selon ta jalousie, que tu as manifestées à cause de la haine que tu leur portais. Je me ferai connaître parmi eux[a] lorsque je te jugerai.
