  - severity: low
    issue: Verbe de jugement
    rationale: « J’agirai envers toi » est compréhensible, mais reste vague en français. Dans ce contexte, « Je te traiterai selon… » rend plus directement l’emploi contextuel de עשה avec le destinataire implicite.
