source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ וְ/עָשִׂ֗יתִי כְּ/אַפְּ/ךָ֙ וּ/כְ/קִנְאָ֣תְ/ךָ֔ אֲשֶׁ֣ר עָשִׂ֔יתָה מִ/שִּׂנְאָתֶ֖י/ךָ בָּ֑/ם וְ/נוֹדַ֥עְתִּי בָ֖/ם כַּ/אֲשֶׁ֥ר אֶשְׁפְּטֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: fr
  text: C’est pourquoi, aussi vrai que je suis vivant — oracle du Seigneur Yahweh —, je te traiterai selon ta colère et selon ta jalousie, que tu as manifestées à cause de la haine que tu leur portais. Je me ferai connaître parmi eux[a] lorsque je te jugerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je serai connu parmi eux » ; autre possibilité : « je me ferai connaître par leur intermédiaire ».'
    reason: Le niphal de ידע et la préposition ב permettent une nuance passive, réflexive ou éventuellement instrumentale.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence du réquisitoire précédent.
- source_word: חַי אָנִי
  choice: aussi vrai que je suis vivant
  rationale: Rend la formule solennelle du serment divin dans un français actuel et idiomatique.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: Préserve la formule prophétique ainsi que le nom divin explicite, sans produire l’expression maladroite « Seigneur SEIGNEUR ».
- source_word: וְעָשִׂיתִי
  choice: j’agirai envers toi
  rationale: Le verbe a ici un emploi absolu dans un contexte de jugement; le complément « envers toi » est explicité à partir des suffixes de deuxième personne et de la proposition finale.
- source_word: כְּאַפְּךָ וּכְקִנְאָתְךָ
  choice: selon ta colère et selon ta jalousie
  rationale: La préposition exprime la correspondance ou la mesure de la rétribution; « jalousie » convient au contexte d’hostilité.
- source_word: אֲשֶׁר עָשִׂיתָה
  choice: que tu as manifestées
  rationale: Rend idiomatiquement l’action d’exprimer concrètement ces passions, sans ajouter le registre psychologique de « donner libre cours ».
- source_word: מִשִּׂנְאָתֶיךָ בָּם
  choice: dans ta haine contre eux
  rationale: Exprime la source ou le cadre haineux de l’action et la valeur hostile de בָּם.
- source_word: וְנוֹדַעְתִּי בָם
  choice: Je me ferai connaître parmi eux
  rationale: Le niphal peut exprimer ici la manifestation de soi; « parmi eux » conserve la valeur locative naturelle de ב sans imposer un moyen instrumental.
- source_word: כַּאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: lorsque je te jugerai
  rationale: 'La lecture temporelle s’accorde au contexte: Dieu se fera connaître au moment où il jugera Édom.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte le nom divin; « Yahweh » le distingue du titre אֲדֹנָי et évite une répétition artificielle de « Seigneur ».
- issue: Portée de וְנוֹדַעְתִּי בָם
  choice: Je me ferai connaître parmi eux
  alternative: Je serai connu parmi eux / Je me ferai connaître par leur intermédiaire
  rationale: Le choix retient l’idée de manifestation divine sans trancher excessivement son mécanisme; la note préserve les autres nuances grammaticalement possibles.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation détache la formule prophétique sans alourdir la phrase. Le féminin pluriel « manifestées » reprend explicitement « colère » et « jalousie ».
