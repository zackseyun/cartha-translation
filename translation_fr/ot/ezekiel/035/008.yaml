  naturalness: Le verset est globalement naturel et conserve une solennité sobre. La note, en revanche, présente « tomberont en eux » comme un français prétendument littéral, formulation peu idiomatique et dont le pronom masculin peut sembler ne viser que « ravins ». Il est préférable de signaler explicitement l’ajout locatif hébreu et sa reprise de l’ensemble de la liste.
  terminology: « Montagnes », « collines », « vallées » et « ravins » sont appropriés dans ce contexte. « Victimes » évite l’effet périphrastique et temporel de « ceux qui auront été tués », tout en conservant la violence inhérente à חָלָל. Aucun enjeu théologique particulier n’est en cause.
