  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: fr
  text: Et je remplirai ses montagnes de ses victimes ; sur tes collines, dans tes vallées et dans tous tes ravins tomberont les victimes de l’épée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ajoute « en eux », renvoyant aux collines, aux vallées et aux ravins qui viennent d’être mentionnés.
    reason: Précision sur la reprise locative explicite בָהֶם, allégée dans le texte principal pour obtenir un français naturel.
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: Et je remplirai
  rationale: Le parfait qal précédé de וּ exprime ici, dans l’annonce prophétique, une action future certaine. « Et » rend explicitement la conjonction initiale.
- source_word: הָרָיו
  choice: ses montagnes
  rationale: Le suffixe de troisième personne renvoie au mont Séir, envisagé comme territoire, tandis que la suite passe à l’adresse directe à la deuxième personne.
- source_word: חֲלָלָיו
  choice: ceux qui auront été tués
  rationale: חָלָל désigne des personnes tuées, notamment dans un contexte guerrier. Cette formulation conserve le caractère violent de leur mort sans employer un substantif français archaïque.
- source_word: גִּבְעוֹתֶיךָ
  choice: tes collines
  rationale: Le sens topographique ordinaire est « collines » ; « hauts lieux » introduirait ici une connotation cultuelle injustifiée.
- source_word: גֵאוֹתֶיךָ
  choice: tes vallées
  rationale: Dans cette énumération topographique avec les collines et les ravins, le mot désigne au mieux les vallées ou dépressions du terrain.
- source_word: אֲפִיקֶיךָ
  choice: tes ravins
  rationale: Le terme peut désigner des lits, chenaux ou ravins. « Ravins » convient au paysage décrit sans suggérer nécessairement un cours d’eau.
- source_word: חַלְלֵי חֶרֶב
  choice: les victimes de l’épée
  rationale: Cette expression française naturelle conserve l’idée de personnes tuées par l’épée, instrument du jugement guerrier.
- source_word: יִפְּלוּ בָהֶם
  choice: tomberont
  rationale: Les compléments « sur tes collines, dans tes vallées et dans tous tes ravins » rendent déjà le lieu exprimé par בָהֶם. La reprise pronominale littérale est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et solennel. Le changement voulu entre « ses montagnes » et « tes collines » est conservé. La structure en deux propositions et le vocabulaire topographique maintiennent la force de l’oracle.
