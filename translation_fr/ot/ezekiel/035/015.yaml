  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: fr
  text: '« De même que tu t’es réjoui de l’héritage de la maison d’Israël parce qu’il était dévasté, je te traiterai de même : tu deviendras une désolation, mont Séir, et tout Édom, tout entier[b]. Alors ils sauront que je suis Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'L’hébreu dit : « tout Édom, tout entier », formulation qui insiste sur la totalité d’Édom.'
    reason: La note explique la reprise emphatique de l’hébreu.
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: Comme tu t’es réjoui
  rationale: La préposition comparative כְּ et le nom שִׂמְחָה avec suffixe de deuxième personne sont rendus par une proposition verbale naturelle en français, sans perdre le rapport de correspondance.
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל עַל אֲשֶׁר שָׁמֵמָה
  choice: de voir l’héritage de la maison d’Israël dévasté
  rationale: La tournure française exprime naturellement l’objet et le motif de la joie d’Édom. « Héritage » conserve נַחֲלָה, tandis que « dévasté » rend l’état de désolation désigné par שָׁמֵמָה.
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: je te traiterai de même
  rationale: Cette formulation idiomatique conserve la rétribution correspondante marquée par כֵּן et la valeur de עשה avec לְ.
- source_word: שְׁמָמָה תִהְיֶה
  choice: tu seras dévasté[a]
  rationale: Le français courant préfère l’adjectif au prédicat nominal littéral « tu seras une désolation ». La note conserve la force nominale de l’hébreu.
- source_word: הַר שֵׂעִיר
  choice: mont Séir
  rationale: Forme géographique française usuelle du nom propre.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: ainsi que tout Édom, tout entier[b]
  rationale: La reprise emphatique de כָּל par כֻּלָּהּ est maintenue, malgré sa légère redondance, afin de rendre l’idée de totalité.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: « Alors » exprime naturellement la conséquence du jugement introduite par la conjonction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël ; sa translittération préserve cette distinction.
- issue: Nature de la rétribution contre Édom
  choice: je te traiterai de même
  alternative: je ferai ainsi envers toi
  rationale: Le rendu conserve la correspondance judiciaire entre la joie d’Édom devant la dévastation d’Israël et la dévastation qui atteindra Édom, sans préciser davantage l’agent ou les modalités.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement singulier est conservé parce que Yahweh s’adresse à Édom personnifié, puis nommé comme le mont Séir. La formulation évite un littéralisme maladroit tout en signalant en note la force nominale de « désolation ».
