  to: '« De même que tu t’es réjoui de l’héritage de la maison d’Israël parce qu’il était dévasté, je te traiterai de même : tu deviendras une désolation, mont Séir, et tout Édom, tout entier[b]. Alors ils sauront que je suis Yahweh. »'
