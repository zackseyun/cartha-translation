review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « tu seras dévasté » atténue et déplace légèrement le prédicat nominal שְׁמָמָה תִהְיֶה (« tu deviendras une désolation »). Une formulation nominale française est ici suffisamment naturelle et préserve mieux le motif de la désolation.
  naturalness: Le français du projet est fluide. La révision proposée conserve un registre biblique actuel et accessible, tout en évitant que « dévasté » puisse évoquer seulement l’action subie plutôt que l’état de désolation annoncé.
  terminology: « Héritage », « maison d’Israël », « mont Séir », « Édom » et « Yahweh » sont appropriés. « Désolation » rend directement et de façon cohérente le terme hébreu שְׁמָמָה.
  issues:
  - severity: medium
    issue: Le prédicat « tu seras dévasté[a] » ne rend pas pleinement le nom hébreu שְׁמָמָה.
    rationale: שְׁמָמָה est un nom employé comme prédicat et désigne une désolation. « Tu seras dévasté » peut se comprendre comme le fait d’être frappé de dévastation; « tu deviendras une désolation » conserve plus exactement l’état judiciaire proclamé.
  - severity: low
    issue: La note a devient inutile si le texte principal reprend directement le prédicat nominal.
    rationale: Lorsque « tu deviendras une désolation » est placé dans le texte, la note n’apporte plus d’alternative ou d’information lexicale nécessaire.
