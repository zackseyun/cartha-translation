source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: fr
  text: 'Alors tu sauras que je suis Yahweh. J’ai entendu toutes les paroles méprisantes[a] que tu as prononcées contre les montagnes d’Israël en disant : « Elles sont dévastées ; elles nous ont été livrées en pâture. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les insultes » ou « toutes les paroles outrageantes ».'
    reason: Alternative lexicale pour נָאָצוֹתֶיךָ, qui peut désigner diverses formes de discours méprisant ou injurieux.
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Alors tu sauras
  rationale: Le parfait qal avec waw prend ici, dans le discours prophétique, une valeur future et consécutive ; « Alors » exprime naturellement le résultat annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: 'Le passé composé rend le parfait hébreu avec sa pertinence présente : Yahweh a entendu ces propos et va agir.'
- source_word: נָאָצוֹתֶיךָ
  choice: paroles méprisantes
  rationale: Le terme désigne des propos exprimant le mépris ou l’outrage. Cette formulation évite de préciser indûment « blasphèmes », puisque les paroles visent explicitement les montagnes d’Israël.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: contre les montagnes d’Israël
  rationale: Dans ce contexte de propos hostiles, עַל a naturellement le sens de « contre ».
- source_word: שָׁמֵמָה
  choice: Elles sont dévastées
  rationale: Bien que la forme hébraïque soit au féminin singulier, elle renvoie collectivement aux montagnes ou au territoire d’Israël ; le pluriel français reprend le référent explicite.
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: elles nous ont été livrées en pâture
  rationale: Cette expression française conserve l’image de ce qui est donné pour être mangé tout en communiquant idiomatiquement l’idée d’une proie offerte à l’appropriation.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; « Yahweh » le conserve et évite de le remplacer par un titre.
- issue: Portée de נָאָצוֹתֶיךָ
  choice: paroles méprisantes
  alternative: blasphèmes
  rationale: Le mot décrit un discours outrageant, mais son objet grammatical est ici les montagnes d’Israël. La traduction retenue préserve la gravité sans affirmer explicitement que le nom qualifie directement une offense verbale contre Dieu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Édom personnifié. « Livrées en pâture » conserve l’image prédatrice du texte sans lourdeur littérale.
