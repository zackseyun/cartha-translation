  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: fr
  text: 'Tu lui diras : « Ainsi parle le Seigneur Yahweh : Me voici contre toi, mont Séir ! J’étendrai ma main contre toi et je ferai de toi une désolation et une dévastation[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour le second terme : « un objet d’effroi ou de stupeur ». Le mot peut désigner une dévastation qui suscite l’effroi ou l’étonnement.'
    reason: Alternative lexicale pour מְשַׁמָּה, dont le sens peut inclure l’effet d’horreur ou de stupeur produit par la dévastation.
lexical_decisions:
- source_word: וְאָמַרְתָּ לּוֹ
  choice: Tu lui diras
  rationale: Le suffixe masculin singulier renvoie au mont Séir personnifié. En français, « lui » convient grammaticalement à « mont » et maintient cette personnification.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי, tandis que « Yahweh » représente explicitement le nom divin יהוה, sans produire le redoublement peu naturel « Seigneur SEIGNEUR ».
- source_word: הִנְנִי אֵלֶיךָ
  choice: Me voici contre toi
  rationale: Cette formulation conserve à la fois la force solennelle de הִנְנִי et le sens d’opposition hostile que prend אֶל dans cette annonce de jugement.
- source_word: הַר שֵׂעִיר
  choice: mont Séir
  rationale: La désignation géographique traditionnelle est conservée et employée ici comme apostrophe personnifiée.
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: J’étendrai ma main contre toi
  rationale: La traduction garde l’image hébraïque de la main étendue et sa portée punitive dans ce contexte.
- source_word: וּנְתַתִּיךָ
  choice: je ferai de toi
  rationale: Avec les substantifs qui suivent, le verbe exprime le fait de réduire le mont Séir à un état de ruine.
- source_word: שְׁמָמָה
  choice: une désolation
  rationale: Le terme désigne un état de ruine et d’abandon. « Une désolation » conserve sa forme nominale et son intensité.
- source_word: וּמְשַׁמָּה
  choice: un lieu dévasté
  rationale: La formulation française distingue ce second terme du premier tout en gardant leur parallélisme intensificateur. Une autre nuance possible, celle d’un spectacle qui suscite l’effroi ou la stupeur, est signalée en note.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La solution retenue représente distinctement le titre אֲדֹנָי et le nom יהוה. Elle évite de masquer le nom propre derrière un second titre, tout en conservant la solennité de la formule prophétique.
- issue: Portée de הִנְנִי אֵלֶיךָ
  choice: Me voici contre toi
  alternative: Je viens contre toi
  rationale: L’hébreu affirme directement l’opposition divine sans préciser explicitement un déplacement. La traduction préserve donc cette tension sans ajouter l’idée d’une venue.
translation_notes:
  register: Français moderne, solennel et direct. L’apostrophe « mont Séir » maintient la personnification du territoire. Les deux termes finaux sont distingués sans alourdir excessivement la phrase.
