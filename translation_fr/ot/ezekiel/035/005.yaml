source:
  edition: WLC
  text: יַ֗עַן הֱי֤וֹת לְ/ךָ֙ אֵיבַ֣ת עוֹלָ֔ם וַ/תַּגֵּ֥ר אֶת בְּנֵֽי יִשְׂרָאֵ֖ל עַל יְדֵי חָ֑רֶב בְּ/עֵ֣ת אֵידָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: fr
  text: Parce que tu avais une inimitié perpétuelle et que tu as livré les fils d’Israël au pouvoir de l’épée au temps de leur désastre[a], au temps du châtiment final[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites » ou « le peuple d’Israël ». Hébreu : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « au temps de la faute finale » ou « au temps où la culpabilité est parvenue à son terme ». L’expression hébraïque est difficile et peut renvoyer soit à la faute ou à la culpabilité, soit au châtiment qui en résulte.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit naturellement en français la cause du jugement annoncé dans le contexte.
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: tu nourrissais une hostilité perpétuelle
  rationale: Rend l’état durable attribué à Édom/Séïr. « Nourrir une hostilité » est idiomatique en français, tandis que « perpétuelle » conserve la portée temporelle de עוֹלָם.
- source_word: וַתַּגֵּר
  choice: tu as livré
  rationale: Dans ce contexte, le hiphil de נגר exprime vraisemblablement l’action de livrer les Israélites à la violence meurtrière; cette formulation évite le littéralisme obscur « déverser ».
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale et collective explicite de l’hébreu; « les Israélites » ou « le peuple d’Israël » sont des équivalents plus idiomatiques.
- source_word: עַל יְדֵי חָרֶב
  choice: au pouvoir de l’épée
  rationale: Transpose clairement l’image littérale des « mains de l’épée » et exprime l’abandon à une puissance meurtrière.
- source_word: בְּעֵת אֵידָם
  choice: au temps de leur désastre
  rationale: אֵיד désigne une calamité ou un désastre; le choix est clair et adapté au registre prophétique.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: au temps du châtiment final
  rationale: La formule hébraïque est condensée et difficile. עָוֹן peut désigner la faute, la culpabilité ou le châtiment qui en découle; dans ce contexte de jugement, « châtiment final » donne un sens cohérent sans masquer les autres lectures possibles, signalées en note.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le texte hébreu emploie une expression explicitement filiale et collective. Le texte principal en conserve la forme, tandis que la note indique ses équivalents collectifs naturels.
- issue: Sens de עֲוֺן dans בְּעֵת עֲוֺן קֵץ
  choice: châtiment
  alternative: faute; culpabilité
  rationale: Dans ce contexte de calamité et d’épée, le sens conséquent de « châtiment » est plausible. La polysémie de עָוֹן et la difficulté de la construction interdisent toutefois d’exclure une référence à la faute ou à la culpabilité; l’ambiguïté est donc préservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’adresse directe à Édom/Séïr, le parallélisme temporel et la virgule finale correspondant à la continuation syntaxique du passage.
