base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Quand toute la terre se réjouira[a][b], je ferai de toi une désolation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De même que toute la terre se réjouira, je ferai de toi une désolation. » La construction hébraïque peut exprimer une comparaison ou une circonstance temporelle.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu peut aussi désigner ici « tout le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français ; le présent rend la valeur déclarative de la formule malgré la forme accomplie du verbe hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression ambiguë « le Seigneur SEIGNEUR ».
- source_word: כִּשְׂמֹחַ
  choice: Quand … se réjouira
  rationale: Le כ préfixé à l’infinitif construit peut introduire une circonstance temporelle. Le futur français s’accorde naturellement avec la principale au futur tout en laissant en note la nuance comparative possible.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: Préserve la portée large la plus immédiate de l’expression hébraïque ; « tout le pays » reste possible selon le cadre référentiel.
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: je te réduirai en désolation
  rationale: Expression française idiomatique qui conserve le substantif hébreu « désolation » et la valeur résultative de עשה avec ל.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » distingue le nom divin du titre אֲדֹנָי sans imposer une lecture confessionnelle supplémentaire.
- issue: Rapport temporel ou comparatif de כִּשְׂמֹחַ
  choice: Quand toute la terre se réjouira
  alternative: De même que toute la terre se réjouira
  rationale: La construction admet une lecture temporelle aussi bien qu’une nuance comparative. Le texte principal retient une formulation temporelle naturelle, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule « Ainsi parle » maintient le ton prophétique ; « réduire en désolation » reste claire tout en reflétant de près la construction hébraïque.
