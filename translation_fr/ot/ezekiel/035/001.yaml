  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Le wayyiqtol de היה introduit ici la séquence narrative. En français, il s’intègre naturellement à la formule prophétique « la parole… fut adressée », sans reproduire littéralement « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans la formule prophétique דְבַר יְהוָה, « la parole » désigne une communication divine précise et conserve le lien formel avec la formule hébraïque récurrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant le discours direct qui suit, les deux-points rendent idiomatiquement la fonction introductive de לֵאמֹר en français moderne, sans l’expression plus lourde « en ces termes ».
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: La parole de Yahweh me fut adressée
  rationale: Cette formulation française consacrée et naturelle restitue la formule prophétique comme événement de révélation, tout en gardant « la parole » et le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « me fut adressée » garde la cadence prophétique sans archaïsme excessif; les deux-points introduisent naturellement l’oracle du verset suivant.
