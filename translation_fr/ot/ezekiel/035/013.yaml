  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
translation:
  language: fr
  text: Par votre bouche, vous vous êtes glorifiés contre moi[a] et vous avez multiplié vos paroles contre moi[b]. Moi, j’ai entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous vous êtes vantés contre moi » ; l’hébreu parle littéralement de se faire grand contre moi.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous avez accumulé vos paroles contre moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: vous vous êtes élevés
  rationale: Le hiphil de גדל exprime ici le fait de se faire grand par une parole arrogante. « Vous vous êtes élevés » conserve l’image hébraïque tout en restant intelligible en français.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte de propos hostiles, עַל marque l’opposition, et non le simple thème du discours.
- source_word: בְּפִיכֶם
  choice: de votre bouche
  rationale: Cette formulation conserve l’image concrète de la bouche employée comme instrument de la parole.
- source_word: וְהַעְתַּרְתֶּם
  choice: vous avez multiplié
  rationale: Le hiphil de עתר signifie ici rendre abondant ou multiplier; ce choix préserve la répétition accusatrice des propos hostiles sans imposer une métaphore supplémentaire.
- source_word: דִּבְרֵיכֶם
  choice: vos paroles
  rationale: « Paroles » rend naturellement דבר dans ce contexte oral et s’accorde avec la mention de la bouche.
- source_word: אֲנִי
  choice: moi, j’
  rationale: Le pronom indépendant est emphatique; la dislocation « Moi, j’ai entendu » restitue cette insistance en français courant et digne.
- source_word: שָׁמָעְתִּי
  choice: ai entendu
  rationale: 'Le passé composé exprime naturellement l’acte accompli dont la portée demeure: Dieu a effectivement entendu leurs propos.'
theological_decisions:
- issue: Nature des paroles dirigées vers Dieu
  choice: Des propos arrogants et hostiles prononcés contre Dieu
  alternative: Des propos orgueilleux prononcés simplement à son sujet
  rationale: La répétition de עָלַי, jointe à l’idée de se grandir et de multiplier ses paroles, indique une opposition dirigée contre Dieu. La traduction garde cette gravité sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « vous vous êtes élevés contre moi » conserve l’image hébraïque, tandis que les notes donnent des équivalents plus idiomatiques. L’emphase finale du pronom divin est maintenue par « Moi, j’ai entendu ».
