  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ עַל הַ֣ר שֵׂעִ֑יר וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/002.yaml
  text: Son of man[a], set your face against Mount Seir and prophesy against it.
translation:
  language: fr
  text: Fils d’homme[a], tourne ton visage contre le mont Séir et prophétise contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mortel, tourne ton visage contre le mont Séir et prophétise contre lui. »
    reason: Alternative lexicale qui explicite la condition humaine évoquée par l’expression hébraïque.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse divine caractéristique du livre d’Ézéchiel. Cette traduction conserve l’image hébraïque et sa récurrence, tandis que « Mortel » en explicite davantage le sens.
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: Littéralement « place ton visage ». En français actuel, « tourne ton visage » préserve l’image concrète tout en rendant naturellement l’idée d’une orientation résolue.
- source_word: עַל
  choice: contre
  rationale: Dans les deux occurrences, le contexte d’oracle hostile donne à la préposition une valeur adversative.
- source_word: הַר שֵׂעִיר
  choice: le mont Séir
  rationale: Rendu géographique traditionnel et précis du syntagme hébreu singulier.
- source_word: וְהִנָּבֵא
  choice: et prophétise
  rationale: L’impératif du verbe נבא désigne ici la proclamation prophétique; « prophétise » est direct, courant et fidèle.
- source_word: עָלָיו
  choice: contre lui
  rationale: Le pronom hébreu est masculin singulier et reprend « le mont Séir »; le masculin est également naturel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement reflète les impératifs hébreux singuliers adressés personnellement au prophète. L’image du visage est conservée sans recourir au calque peu naturel « place ton visage ».
