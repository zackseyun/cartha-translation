id: EZK.35.4
reference: Ezekiel 35:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: fr
  text: Je réduirai tes villes en ruines, et toi, tu deviendras un lieu dévasté. Alors tu sauras que je suis Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרֶיךָ
  choice: tes villes
  rationale: Le pluriel de עִיר avec suffixe masculin singulier désigne les centres habités appartenant au destinataire; « villes » est naturel dans ce contexte de jugement prophétique.
- source_word: חָרְבָּה אָשִׂים
  choice: Je réduirai … en ruines
  rationale: La combinaison de שׂוּם avec חָרְבָּה exprime le fait de mettre les villes dans un état de ruine; cette tournure française est idiomatique et conserve la force causative.
- source_word: וְאַתָּה
  choice: et toi
  rationale: Le pronom indépendant est emphatique; « et toi » marque clairement le contraste entre les villes et le destinataire.
- source_word: שְׁמָמָה תִהְיֶה
  choice: tu deviendras un lieu dévasté
  rationale: שְׁמָמָה est un nom désignant un état ou un lieu de désolation, tandis que היה peut ici indiquer l'entrée dans cet état. « Un lieu dévasté » est plus naturel en français que « une désolation » tout en préservant la valeur nominale.
- source_word: וְיָדַעְתָּ
  choice: Alors tu sauras
  rationale: Le waw introduit ici la conséquence du jugement; « alors » rend naturellement cette relation en français.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahvé
  rationale: La formule de reconnaissance caractéristique d’Ézéchiel est conservée, avec translittération française traditionnelle du nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » représente le nom propre en français moderne et maintient la force de la formule de reconnaissance sans le remplacer par un titre.
- issue: Référent de « toi »
  choice: Conserver le masculin singulier sans explicitation
  alternative: Expliciter « montagne de Séir » ou « Édom »
  rationale: Le verset s’adresse grammaticalement à un destinataire masculin singulier identifié par le contexte. Ne pas l’ajouter dans le verset préserve la formulation et l’effet rhétorique de l’hébreu.
translation_notes:
  register: Français international moderne, direct et solennel. La structure en deux jugements suivis de la formule de reconnaissance est maintenue. Aucun marqueur de note n’est requis.
