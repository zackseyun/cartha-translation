  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי לְ/דָ֥ם אֶעֶשְׂ/ךָ֖ וְ/דָ֣ם יִרְדֲּפֶ֑/ךָ אִם לֹ֥א דָ֛ם שָׂנֵ֖אתָ וְ/דָ֥ם יִרְדֲּפֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: fr
  text: C’est pourquoi, aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, je te vouerai au sang[a], et le sang te poursuivra. Puisque tu n’as pas haï le sang[b], le sang te poursuivra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ferai de toi du sang ». L’hébreu, volontairement abrupt, peut évoquer à la fois le sang versé, le bain de sang et la culpabilité liée au sang.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « le sang » peut désigner le sang versé, le massacre ou la violence meurtrière.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la sentence comme conséquence de l’accusation précédente.
- source_word: חַי אָנִי
  choice: aussi vrai que je suis vivant
  rationale: Rend clairement la formule solennelle de serment divin, sans la réduire à une simple affirmation d’existence.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » conserve la formule prophétique נְאֻם, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה.
- source_word: לְדָם אֶעֶשְׂךָ
  choice: je te mettrai à sang
  rationale: Expression française forte et concise qui évoque une destruction sanglante tout en conservant « sang » et le jeu de répétition du texte hébreu; la formulation littérale est signalée en note.
- source_word: דָם
  choice: sang
  rationale: Le mot répété peut évoquer à la fois le sang versé, le massacre et la culpabilité liée au sang. Le conserver dans le texte maintient la force rhétorique et l’ambivalence de l’hébreu.
- source_word: יִרְדֲּפֶךָ
  choice: te poursuivra
  rationale: Correspond au sens courant de רדף et préserve la personnification menaçante du sang.
- source_word: אִם לֹא
  choice: Puisque… n’as pas
  rationale: Dans ce contexte, la tournure introduit le motif du jugement plutôt qu’une éventualité encore ouverte; « puisque » rend ce rapport causal en français naturel.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Souverain Seigneur
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יְהוִה. Les rendre distinctement évite de masquer le nom divin et ne dépend d’aucune lecture confessionnelle particulière.
- issue: Sens moral et judiciaire de דָם
  choice: maintenir « sang » dans le texte avec explication en note
  alternative: « sang versé », « massacre » ou « crime de sang »
  rationale: La répétition de דָם structure le jugement et laisse résonner simultanément la violence commise, le sang versé et ses conséquences. Une explicitation unique dans le corps du texte réduirait cette tension.
translation_notes:
  register: Français international actuel, solennel et accessible. La formule de serment est développée idiomatiquement; la répétition insistante de « sang » et la personnification du sang sont conservées.
