  text: וְ/כֹל֩ אֲשֶׁ֨ר סְבִיבֹתָ֥י/ו עזר/ה וְ/כָל אֲגַפָּ֖י/ו אֱזָרֶ֣ה לְ/כָל ר֑וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: fr
  text: Tous ceux qui l’entourent — ceux qui lui prêtent main-forte et toutes ses troupes —, je les disperserai à tous les vents[a], et je dégainerai l’épée à leur poursuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à tout vent », c’est-à-dire dans toutes les directions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  choice: ceux qui l’entourent
  rationale: Cette formulation naturelle conserve l’idée relationnelle des personnes qui se trouvent autour du dirigeant.
- source_word: עֶזְרָה
  choice: ceux qui lui prêtent main-forte
  rationale: L’expression hébraïque a ici un sens collectif et désigne les personnes qui lui apportent leur aide; cette tournure évite de suggérer une aide abstraite.
- source_word: אֲגַפָּיו
  choice: ses troupes
  rationale: Dans ce contexte politique et militaire, le terme désigne les unités ou compagnies rattachées au dirigeant plutôt que des « ailes » au sens littéral.
- source_word: אֱזָרֶה
  choice: je les disperserai
  rationale: Le piel de זרה signifie « disperser » ou « vanner »; avec des personnes pour objet, « disperser » convient naturellement.
- source_word: לְכָל רוּחַ
  choice: à tous les vents
  rationale: La traduction garde l’image hébraïque, intelligible en français, tout en laissant la note en expliciter le sens directionnel.
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: je tirerai l’épée pour les poursuivre
  rationale: « Tirer l’épée » rend l’expression idiomatique avec ריק, tandis que « pour les poursuivre » exprime la valeur de poursuite portée par אַחֲרֵיהֶם.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image prophétique des vents et rend explicitement le caractère collectif de עֶזְרָה. Les tirets structurent l’apposition sans alourdir le verset.
