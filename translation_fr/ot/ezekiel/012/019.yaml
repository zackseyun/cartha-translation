source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: fr
  text: 'Tu diras au peuple du pays[a] : « Voici ce que dit le Seigneur Yahweh au sujet des habitants de Jérusalem, sur la terre d’Israël : Ils mangeront leur pain dans l’angoisse et boiront leur eau dans l’effroi[b], afin que sa terre soit dévastée et dépouillée de tout ce qui la remplit, à cause de la violence de tous ceux qui l’habitent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux gens du pays ». L’expression hébraïque ne désigne pas nécessairement ici une classe sociale particulière.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la désolation » ou « dans la stupeur ». Le terme hébreu peut évoquer à la fois l’effroi et la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Rend l’expression hébraïque de près sans en faire une classe sociale technique; dans ce contexte, elle désigne vraisemblablement la population restée dans le pays.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve le double titre divin et rend explicitement le nom propre יהוה, tout en évitant l’expression française artificielle « le Seigneur SEIGNEUR ».
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: au sujet des habitants de Jérusalem, sur la terre d’Israël
  rationale: Le message est adressé au peuple du pays et porte sur les habitants de Jérusalem; « au sujet de » exprime naturellement cette relation. « Sur la terre d’Israël » garde la valeur spatiale et distingue אדמה de la référence précédente au pays.
- source_word: לַחְמָם בִּדְאָגָה
  choice: leur pain dans l’angoisse
  rationale: « Pain » préserve l’image concrète du geste prophétique, et « angoisse » restitue la crainte profonde exprimée par דאגה.
- source_word: וּמֵימֵיהֶם בְּשִׁמָּמוֹן
  choice: leur eau dans l’effroi
  rationale: Le français emploie naturellement « eau » au singulier collectif. שִׁמָּמוֹן peut désigner l’effroi ou l’état de désolation; « effroi » convient au parallèle émotionnel avec « angoisse », tandis qu’une note conserve l’autre nuance.
- source_word: לְמַעַן
  choice: afin que
  rationale: Marque sans la trancher excessivement la relation de but ou de résultat introduite par la préposition.
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: leur terre soit dévastée et dépouillée de tout ce qui la remplit
  rationale: Exprime idiomatiquement en français la dévastation de la terre et la privation de sa « plénitude ». Le possessif pluriel reprend naturellement les habitants, là où l’hébreu emploie un suffixe féminin singulier renvoyant à la terre ou à Jérusalem.
- source_word: מֵחֲמַס כָּל הַיֹּשְׁבִים בָּהּ
  choice: à cause de la violence de tous ceux qui l’habitent
  rationale: « À cause de » rend ici la force causale de מן; « violence » conserve le sens principal de חמס dans ce contexte de jugement.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte contient le nom divin distinct du titre אֲדֹנָי. « Yahweh » maintient cette distinction et évite de remplacer silencieusement le nom propre par un titre.
- issue: Valeur de לְמַעַן dans l’annonce du jugement
  choice: afin que
  alternative: de sorte que
  rationale: La tournure hébraïque peut exprimer le but ou le résultat. « Afin que » en garde la formulation intentionnelle sans préciser davantage l’articulation théologique de la causalité.
- issue: Référent du suffixe féminin dans אַרְצָהּ
  choice: leur terre
  alternative: sa terre
  rationale: Le suffixe féminin peut être rattaché à la terre ou à Jérusalem personnifiée. Le français « leur terre » est plus naturel et rattache le territoire aux habitants sans supprimer entièrement le lien contextuel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est conservée sans archaïsmes; les parallèles « pain/eau » et « angoisse/effroi » restent perceptibles. Tous les marqueurs de notes figurent dans le texte.
