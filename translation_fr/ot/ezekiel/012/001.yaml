  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre forme : « Yahweh ».'
    reason: Signaler la forme hébraïque du nom divin et les principales conventions françaises de traduction ou de translittération.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה introduit la venue de la parole divine. La tournure française « la parole… me fut adressée » rend naturellement cette formule sans calquer « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans דְבַר יְהוָה, « parole » conserve la dimension verbale et révélatrice du terme, tandis que « message » serait légèrement plus interprétatif.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » translittère le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime idiomatiquement en français la direction indiquée par אֵלַי, « vers moi/à moi ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit les paroles directes qui suivent. « En ces termes : » remplit cette fonction dans un français naturel et soutenu, sans le calque peu idiomatique « disant ».'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahvé » préserve ici le caractère de nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « me fut adressée en ces termes » garde la solennité prophétique tout en évitant un calque hébraïque maladroit. Le deux-points annonce la parole divine au verset suivant.
