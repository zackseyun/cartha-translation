source:
  edition: WLC
  text: אֱמֹ֖ר אֲנִ֣י מֽוֹפֶתְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשִׂ֗יתִי כֵּ֚ן יֵעָשֶׂ֣ה לָ/הֶ֔ם בַּ/גּוֹלָ֥ה בַ/שְּׁבִ֖י יֵלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: fr
  text: 'Dis : « Je suis pour vous un signe[a] : de même que j’ai fait, de même il leur sera fait ; ils iront en exil, en captivité[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre signe » ou « pour vous un présage ». Le mot hébreu peut désigner un signe, un présage ou un acte symbolique extraordinaire.
    reason: lexical_alternative
  - marker: b
    text: Les deux expressions, « en exil » et « en captivité », sont maintenues pour rendre le redoublement emphatique de l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Dis
  rationale: Impératif masculin singulier de אמר. « Dis » introduit naturellement la déclaration prophétique adressée au peuple.
- source_word: מוֹפֶתְכֶם
  choice: pour vous un signe
  rationale: מוֹפֵת désigne ici un signe symbolique ou un présage. La tournure « pour vous » rend la valeur relationnelle du suffixe sans réduire celui-ci à une simple possession.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן יֵעָשֶׂה לָהֶם
  choice: Ce que j’ai fait, c’est ce qui leur sera fait
  rationale: Cette formulation française conserve la correspondance exacte entre le geste accompli par Ézéchiel et ce qui arrivera aux personnes visées, tout en maintenant le passif hébreu et son agent implicite.
- source_word: בַּגּוֹלָה
  choice: en exil
  rationale: גּוֹלָה évoque l’exil ou la condition d’exilé. Avec le verbe de mouvement, « partir en exil » est idiomatique en français.
- source_word: בַשְּׁבִי
  choice: en captivité
  rationale: שְׁבִי désigne la captivité. Le terme est conservé à côté d’« exil » afin de reproduire le redoublement emphatique de l’hébreu.
- source_word: יֵלֵכוּ
  choice: ils partiront
  rationale: L’imparfait hébreu exprime ici le résultat futur annoncé. « Partiront » s’accorde naturellement avec « en exil, en captivité » et garde l’idée de déplacement.
theological_decisions:
- issue: Nature du rôle symbolique d’Ézéchiel
  choice: Je suis pour vous un signe
  alternative: Je suis pour vous un présage
  rationale: « Signe » exprime l’acte prophétique symbolique sans ajouter les connotations superstitieuses que « présage » peut prendre en français.
- issue: Agent du jugement annoncé
  choice: ce qui leur sera fait
  alternative: ce que Dieu leur fera
  rationale: Le passif conserve l’absence d’agent explicite dans l’hébreu et évite d’expliciter dans la traduction ce que le verset laisse implicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est fluide sans effacer le parallélisme prophétique ni le redoublement « exil / captivité ».
