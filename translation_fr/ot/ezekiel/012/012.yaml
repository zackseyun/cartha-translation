id: EZK.12.12
reference: Ezekiel 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: fr
  text: Le prince qui est au milieu d’eux portera ses bagages[b] sur son épaule dans l’obscurité[a], puis il sortira. Ils perceront le mur pour le faire sortir par là. Il se couvrira le visage, car il ne verra pas le pays de ses propres yeux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la pénombre ». Le terme hébreu peut désigner l’obscurité, une lumière faible ou une atmosphère de dissimulation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « portera sur l’épaule ». « Ses bagages » est sous-entendu d’après le signe du départ en exil décrit dans les versets précédents.
    reason: supplied_context
  - marker: c
    text: Ou « afin qu’il ne voie pas le pays de ses propres yeux ». La conjonction hébraïque est normalement causale (« car/parce que »), mais elle est aussi comprise par certains, dans ce contexte, comme exprimant le but ou le résultat.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: נָשִׂיא désigne ici le chef politique présent au milieu du peuple. « Le prince » conserve le titre employé par Ézéchiel sans le remplacer par « le roi », plus précis que l’hébreu.
- source_word: בְּתוֹכָם
  choice: qui est au milieu d’eux
  rationale: Rend directement l’idée spatiale et relationnelle de « dans leur milieu », dans un français naturel.
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: mettra ses bagages sur son épaule
  rationale: L’expression signifie littéralement « portera/lèvera vers l’épaule ». L’objet n’est pas exprimé dans ce verset, mais les bagages d’exilé sont explicitement présents dans le contexte immédiat; leur ajout est donc signalé en note.
- source_word: בָּעֲלָטָה
  choice: dans l’obscurité
  rationale: Le terme évoque l’obscurité ou une faible lumière propice à la dissimulation. « Dans l’obscurité » convient au départ clandestin décrit ici.
- source_word: וְיֵצֵא
  choice: puis il sortira
  rationale: יצא exprime simplement le fait de sortir. « Puis » rend naturellement la succession des actions marquée par la conjonction.
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: On percera le mur
  rationale: חתר décrit l’action de creuser ou de pratiquer une brèche dans un mur. Le pronom indéfini « on » conserve le sujet humain pluriel non identifié sans alourdir la phrase.
- source_word: לְהוֹצִיא בוֹ
  choice: pour le faire sortir par là
  rationale: La forme causative de יצא signifie « faire sortir ». בוֹ renvoie au passage pratiqué dans le mur; « par là » est idiomatique en français et garde cette valeur locative.
- source_word: פָּנָיו יְכַסֶּה
  choice: Il se couvrira le visage
  rationale: Traduction directe et idiomatique de l’action physique décrite.
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: afin de ne pas voir
  rationale: Dans l’enchaînement des actions, la proposition peut exprimer le but ou le résultat du visage couvert. La valeur causale possible de la conjonction est conservée en note.
- source_word: לַעַיִן הוּא
  choice: de ses propres yeux
  rationale: Cette formulation française rend l’expression liée à l’œil ainsi que l’insistance portée par le pronom הוּא, sans produire un calque maladroit.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ désigne ici le territoire qu’il quitte plutôt que le sol matériel. « Le pays » est clair et naturel dans ce contexte.
theological_decisions:
- issue: Objet implicite de אֶל כָּתֵף יִשָּׂא
  choice: Ajout de « ses bagages » dans le texte, avec note
  alternative: « portera sur son épaule », sans objet explicite
  rationale: L’hébreu de ce verset ne nomme pas l’objet, mais le signe prophétique des versets voisins porte explicitement sur les bagages d’exilé. L’ajout contrôlé rend la phrase intelligible tout en signalant ce qui est implicite.
- issue: Valeur de יַעַן אֲשֶׁר dans la dernière proposition
  choice: 'Lecture finale ou intentionnelle : « afin de ne pas voir »'
  alternative: 'Lecture causale : « parce qu’il ne verra pas »'
  rationale: Le geste de se couvrir le visage se comprend naturellement comme visant à empêcher la vue du pays. Toutefois, la conjonction peut avoir une valeur causale; la note maintient donc l’ambiguïté réelle sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concrète et narrative, évite les archaïsmes, conserve le titre politique « prince » et signale en notes l’objet fourni par le contexte ainsi que les deux ambiguïtés lexicales et syntaxiques.
