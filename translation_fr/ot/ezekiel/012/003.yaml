revisions:
- from: Quant à toi, fils d’homme, prépare-toi un bagage d’exilé et pars en exil en plein jour, sous leurs yeux. Tu partiras de l’endroit où tu es pour aller ailleurs, sous leurs yeux. Peut-être verront-ils, bien qu’ils soient une communauté rebelle.
  to: Quant à toi, fils d’homme, prépare-toi un bagage pour l’exil et pars en exil en plein jour, sous leurs yeux. Tu iras en exil, en quittant ton lieu pour un autre, sous leurs yeux. Peut-être verront-ils, bien qu’ils soient une communauté rebelle.
  rationale: La révision restaure, dans la seconde instruction, l’idée explicite d’exil présente dans le verbe hébreu répété, et remplace une paraphrase de « ton lieu » par une expression plus proche du texte. La concession finale est conservée, conformément à la piste d’audit anglaise, tout en laissant « verront-ils » au sens non interprété de יִרְאוּ.
