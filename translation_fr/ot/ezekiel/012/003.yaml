  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: fr
  text: Quant à toi, fils d’homme, prépare-toi un bagage pour l’exil et pars en exil en plein jour, sous leurs yeux. Tu iras en exil, en quittant ton lieu pour un autre, sous leurs yeux. Peut-être verront-ils, bien qu’ils soient une communauté rebelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: un bagage d’exilé
  rationale: L’expression désigne les objets ou provisions qu’un déporté emporte avec lui. « Bagage d’exilé » reste concret, naturel et fidèle au contexte de l’action symbolique.
- source_word: וּגְלֵה / וְגָלִיתָ
  choice: pars en exil / tu partiras
  rationale: Le même verbe hébreu est d’abord à l’impératif, puis à la forme accomplie employée comme instruction certaine. La variation française évite une répétition pesante tout en conservant l’idée de départ en exil.
- source_word: יוֹמָם
  choice: en plein jour
  rationale: Le terme signifie « de jour »; « en plein jour » souligne ici le caractère public de l’action.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression idiomatique française qui conserve l’insistance hébraïque sur une action accomplie ouvertement devant eux.
- source_word: בֵּית מְרִי
  choice: une communauté rebelle
  rationale: Littéralement « maison de rébellion ». Dans ce contexte collectif, « communauté rebelle » communique le sens sans suggérer un bâtiment ni réduire nécessairement le groupe à une seule famille.
theological_decisions:
- issue: Rapport logique de כִּי dans la dernière proposition
  choice: bien qu’ils soient une communauté rebelle
  alternative: car ils sont une communauté rebelle
  rationale: כִּי peut introduire une cause, mais la rébellion paraît ici constituer un obstacle à la perception plutôt que sa raison. La traduction concessive préserve la tension du contexte et suit la lecture retenue dans la couche de consultation anglaise.
- issue: Sens de יִרְאוּ
  choice: verront-ils
  alternative: comprendront-ils
  rationale: Le verbe signifie d’abord « voir ». Le sens de prise de conscience reste possible en contexte, mais il n’est pas explicité afin de préserver l’ambiguïté du texte.
translation_notes:
  register: Français moderne, international et digne. La répétition « sous leurs yeux » est conservée parce qu’elle structure l’action symbolique. « Quant à toi » rend la mise en relief initiale de וְאַתָּה.
