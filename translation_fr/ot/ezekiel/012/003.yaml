review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien l’adresse emphatique, l’équipement d’exil, le caractère diurne et public de l’action, ainsi que la finale concessive possible. Toutefois, la seconde occurrence de וְגָלִיתָ n’est rendue que par « Tu partiras », ce qui efface le motif explicite de l’exil répété dans l’hébreu et dans la piste d’audit anglaise. « L’endroit où tu es » est aussi plus interprétatif que « ton lieu ».
  naturalness: Le français est globalement naturel, moderne et d’un registre approprié. « Sous leurs yeux » reproduit heureusement la répétition voulue. La formulation révisée conserve cette fluidité tout en restaurant « en exil ».
  terminology: « Fils d’homme », « bagage pour l’exil », « en exil » et « communauté rebelle » sont adaptés au contexte. « Bagage pour l’exil » exprime plus directement la fonction de כְּלֵי גוֹלָה que « bagage d’exilé », sans imposer une nuance supplémentaire.
  issues:
  - severity: medium
    issue: La seconde mention de l’exil est omise.
    rationale: וְגָלִיתָ reprend le verbe גלה employé dans l’impératif précédent. « Tu partiras de l’endroit où tu es » rend le déplacement, mais non l’action d’aller en exil; il faut maintenir ce motif répété.
  - severity: low
    issue: « L’endroit où tu es » interprète מִמְּקוֹמְךָ.
    rationale: Le texte dit littéralement « de ton lieu ». La formulation « en quittant ton lieu pour un autre » est naturelle en français et plus proche du possessif hébreu.
  revised_text: Quant à toi, fils d’homme, prépare-toi un bagage pour l’exil et pars en exil en plein jour, sous leurs yeux. Tu iras en exil, en quittant ton lieu pour un autre, sous leurs yeux. Peut-être verront-ils, bien qu’ils soient une communauté rebelle.
  revised_footnotes: []
  revision_rationale: La révision restaure, dans la seconde instruction, l’idée explicite d’exil présente dans le verbe hébreu répété, et remplace une paraphrase de « ton lieu » par une expression plus proche du texte. La concession finale est conservée, conformément à la piste d’audit anglaise, tout en laissant « verront-ils » au sens non interprété de יִרְאוּ.
