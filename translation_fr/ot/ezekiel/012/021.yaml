  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la forme narrative de היה s’exprime naturellement en français avec la locution « la parole … fut adressée », sans ajouter le littéral mais redondant « il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: דָּבָר désigne ici la parole ou le message divin reçu par le prophète. « La parole » conserve la formulation prophétique traditionnelle et le caractère concret de l’énoncé reçu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le complément hébreu « vers moi » est rendu idiomatiquement dans la tournure française « me fut adressée ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, traité ici comme le nom personnel divin plutôt que remplacé par un titre.
translation_notes:
  register: Français moderne, courant et digne. La formule « La parole de Yahweh me fut adressée » est naturelle dans le registre prophétique; les deux-points annoncent l’oracle du verset suivant.
