  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit la nouvelle révélation. En français naturel, « la parole… me fut adressée » exprime idiomatiquement la venue de cette parole.
- source_word: דְבַר
  choice: la parole
  rationale: « La parole » conserve la formule prophétique récurrente דְבַר יְהוָה et désigne ici une communication divine précise.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin YHWH plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la direction vers Ézéchiel, destinataire de la révélation.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit le discours direct qui suit. « En ces termes : » est idiomatique en français et évite le calque lourd « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve le caractère de nom propre, tandis que « le SEIGNEUR » représente la lecture traditionnelle de substitution.
translation_notes:
  register: Français moderne, digne et fluide. La tournure prophétique traditionnelle est conservée sans archaïsme excessif; les deux-points annoncent la parole du verset suivant.
