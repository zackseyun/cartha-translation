  text: בֶּן אָדָ֕ם לַחְמְ/ךָ֖ בְּ/רַ֣עַשׁ תֹּאכֵ֑ל וּ/מֵימֶ֕י/ךָ בְּ/רָגְזָ֥ה וּ/בִ/דְאָגָ֖ה תִּשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: fr
  text: Fils d’homme, tu mangeras ton pain en tremblant[a], et tu boiras ton eau dans l’agitation et l’angoisse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le tremblement »; le nom hébreu peut désigner une secousse ou un tremblement.
    reason: lexical_alternative
  - marker: b
    text: Ou « en tremblant et dans l’inquiétude »; les deux noms hébreux évoquent des formes proches d’agitation, de peur et de détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse récurrente d’Ézéchiel. Cette traduction littérale, naturelle dans le registre biblique français, conserve le lien lexical avec אָדָם sans ajouter l’idée interprétative de mortalité.
- source_word: לַחְמְךָ
  choice: ton pain
  rationale: לֶחֶם désigne littéralement le pain et, par extension, la nourriture. Le sens concret convient ici au geste prophétique.
- source_word: בְּרַעַשׁ
  choice: en tremblant
  rationale: רַעַשׁ évoque une secousse ou un tremblement. La tournure française exprime naturellement la manifestation corporelle qui accompagne le fait de manger.
- source_word: תֹּאכֵל
  choice: tu mangeras
  rationale: L’imparfait hébreu prend ici une valeur prescriptive. Le futur français conserve cette forme d’injonction solennelle sans modifier le sens du commandement.
- source_word: וּמֵימֶיךָ
  choice: et ton eau
  rationale: Le pluriel hébreu « tes eaux » désigne ici l’eau destinée à être bue; le singulier est idiomatique en français.
- source_word: בְּרָגְזָה
  choice: dans l’agitation
  rationale: רָגְזָה peut exprimer le tremblement, l’agitation ou l’effroi. « Agitation » maintient sa proximité avec רַעַשׁ tout en évitant de confondre entièrement les deux termes.
- source_word: וּבִדְאָגָה
  choice: et l’angoisse
  rationale: דְאָגָה désigne l’inquiétude, le souci anxieux ou l’angoisse. « Angoisse » rend clairement la détresse intérieure associée à l’agitation physique.
- source_word: תִּשְׁתֶּה
  choice: tu boiras
  rationale: Comme תֹּאכֵל, cette forme verbale a dans le contexte une valeur prescriptive, rendue par le futur français.
