  terminology: « Seigneur Yahweh » distingue convenablement אַדֹנָי de יהוה, conformément à la décision fournie de rendre le nom divin par « Yahweh ». « Prince », « maison d’Israël » et « oracle » sont appropriés. La note présente loyalement « fardeau/charge » comme possibilité lexicale de מַשָּׂא sans prétendre trancher une question que l’hébreu laisse condensée.
