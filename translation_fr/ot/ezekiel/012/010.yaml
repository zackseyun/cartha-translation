source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: fr
  text: 'Dis-leur : « Voici ce que dit le Seigneur Yahweh : Cet oracle concerne le prince qui est à Jérusalem et toute la maison d’Israël qui se trouve au milieu d’eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « Ce fardeau concerne le prince à Jérusalem et toute la maison d’Israël qui se trouve parmi eux. » Le mot rendu par « oracle » signifie aussi « charge » ou « fardeau », et le référent de « eux » n’est pas précisé.'
    reason: Signale à la fois l’éventail lexical de מַשָּׂא et l’ambiguïté syntaxique du suffixe pluriel dans בְתוֹכָם.
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: Dis-leur
  rationale: L’impératif de אמר suivi de אֶל introduit ce que le prophète doit communiquer. « Dis-leur » est direct et naturel en français.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française rend naturellement la formule solennelle du messager prophétique sans l’alourdir par un calque.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, tout en évitant la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans Ézéchiel, נָשִׂיא désigne souvent le chef politique et fonctionne comme un titre. « Prince » conserve cette nuance mieux que le terme plus général « chef ».
- source_word: הַמַּשָּׂא הַזֶּה
  choice: Cet oracle concerne
  rationale: מַשָּׂא peut désigner une charge ou un fardeau, puis une déclaration prophétique. Ici, « oracle » est intelligible dans le contexte, tandis que « concerne » explicite sobrement le rapport exprimé par la proposition nominale très condensée.
- source_word: בִּירוּשָׁלִַם
  choice: qui est à Jérusalem
  rationale: La préposition בְּ a ici sa valeur locative. La relative française rattache clairement ce complément au prince sans lui donner le sens interprétatif « contre Jérusalem ».
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: et toute la maison d’Israël
  rationale: « Maison d’Israël » maintient l’expression collective et historique de l’hébreu au lieu de la réduire à « Israël ».
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: qui se trouve au milieu d’eux
  rationale: Le singulier collectif français « toute la maison » convient au pluriel sémantique הֵמָּה. « Au milieu d’eux » conserve le suffixe masculin pluriel de l’hébreu et son référent peu explicite, sans le remplacer silencieusement par « à Jérusalem ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. La traduction les distingue et garde visible le nom d’alliance sans produire une répétition française trompeuse.
- issue: Sens de מַשָּׂא
  choice: oracle
  alternative: fardeau
  rationale: Le terme conserve en hébreu une possible résonance de « charge, fardeau », particulièrement suggestive après le geste symbolique d’Ézéchiel. Dans cette proposition, il désigne toutefois le message prophétique ou sa portée; « oracle » donne ce sens en français, tandis que la note signale l’image lexicale sous-jacente.
- issue: Référent du suffixe pluriel dans בְתוֹכָם
  choice: au milieu d’eux
  alternative: qui s’y trouve
  rationale: Le suffixe hébreu est pluriel et son antécédent n’est pas exprimé sans ambiguïté. Le maintenir évite de décider qu’il renvoie nécessairement à Jérusalem ou à ses habitants.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle, les titres bibliques sont conservés, et la syntaxe française clarifie seulement ce qui est nécessaire tout en maintenant l’ambiguïté réelle de la dernière expression.
