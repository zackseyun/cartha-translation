source:
  edition: WLC
  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: fr
  text: Les villes habitées seront dévastées, et le pays deviendra une désolation. Alors vous saurez que je suis Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque et l’usage traditionnel sans remplacer le nom dans le texte principal.
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  choice: les villes habitées
  rationale: עִיר désigne une ville ou une localité, et le participe de ישׁב précise qu’elles sont peuplées; « villes habitées » rend directement les deux éléments.
- source_word: תֶּחֱרַבְנָה
  choice: seront dévastées
  rationale: La forme exprime l’état de ruine à venir. « Seront dévastées » est naturel en français et convient au registre prophétique sans préciser indûment l’agent.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, associé aux villes, אֶרֶץ désigne vraisemblablement le pays plutôt que la terre entière.
- source_word: שְׁמָמָה תִהְיֶה
  choice: deviendra un désert
  rationale: Le nom שְׁמָמָה évoque un lieu dévasté et désert. « Deviendra un désert » conserve la transition exprimée par היה et produit une formulation française idiomatique.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le waw introduit ici la conséquence de la dévastation annoncée; « alors » rend clairement cet enchaînement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH; « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre, tandis que « le Seigneur » reflète une tradition de substitution.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste concise et prophétique. « Le pays » privilégie le cadre territorial immédiat; « un désert » exprime la dévastation sans lourdeur nominale.
