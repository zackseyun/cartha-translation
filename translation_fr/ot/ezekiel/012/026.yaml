  text: 'Et la parole de Yahweh me fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule narrative et prophétique, le waw consécutif avec היה introduit la venue de la parole divine. La tournure française « la parole… me fut adressée » rend naturellement l’ensemble de la formule.
- source_word: דְבַר
  choice: La parole
  rationale: Dans l’expression construite דְבַר יְהוָה, « la parole » conserve la formulation prophétique traditionnelle et sa portée, sans l’interpréter comme un simple « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre substitutif.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément de « fut adressée » exprime idiomatiquement en français le sens de « vers moi / à moi ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles divines qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans la tournure lourde « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » en préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et courant. La formule « La parole de Yahweh me fut adressée » est idiomatique dans le registre prophétique; les deux-points annoncent directement le discours du verset suivant.
