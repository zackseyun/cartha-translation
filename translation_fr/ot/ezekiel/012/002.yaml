  variant: modern international French
source:
  edition: WLC
  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: fr
  text: Fils d’homme, tu habites au milieu d’une maison rebelle[a]. Ils ont des yeux pour voir, mais ils ne voient pas ; ils ont des oreilles pour entendre, mais ils n’entendent pas[b], car ils sont une maison rebelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maison de rébellion » ou « un peuple rebelle ». En hébreu, « maison » est ici un terme collectif qui désigne le peuple dans son ensemble.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des yeux sont à eux pour voir, et ils n’ont pas vu ; des oreilles sont à eux pour entendre, et ils n’ont pas entendu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse caractéristique d’Ézéchiel et sa résonance intertextuelle, tout en restant intelligible en français biblique moderne.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Rend directement l’idée d’être situé au sein d’un groupe et maintient le ton prophétique.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: une maison rebelle
  rationale: Préserve la métaphore collective de la « maison » ainsi que sa répétition dans le verset ; le groupe humain est qualifié par sa rébellion.
- source_word: יֹשֵׁב
  choice: tu habites
  rationale: Dans ce contexte, le participe de ישׁב désigne le fait de résider parmi ce peuple plutôt que la posture physique de s’asseoir.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: Ils ont des yeux pour voir, mais ils ne voient pas
  rationale: Expression française naturelle qui conserve le contraste hébreu entre la capacité de voir et le refus ou l’incapacité effective de voir.
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: ils ont des oreilles pour entendre, mais ils n’entendent pas
  rationale: Maintient le parallélisme avec les yeux et garde le verbe concret « entendre » sans expliciter dans le texte la notion d’obéissance.
- source_word: כִּי
  choice: car
  rationale: Exprime naturellement la valeur explicative ou causale de la conjonction.
- source_word: הֵם
  choice: ils sont
  rationale: Le pronom indépendant souligne l’identité collective du groupe ; le pluriel français correspond à la collectivité désignée par « maison ».
theological_decisions:
- issue: Métaphore collective de la « maison » pour désigner Israël
  choice: Conserver « maison rebelle » dans le texte principal
  alternative: « peuple rebelle » ou « communauté rebelle »
  rationale: La métaphore est récurrente et significative dans Ézéchiel. La conserver maintient l’imagerie prophétique et la répétition du texte source sans ajouter une précision confessionnelle.
- issue: Portée d’« entendre » dans le discours prophétique
  choice: Garder le sens lexical « entendre »
  alternative: Expliciter par « écouter », « comprendre » ou « obéir »
  rationale: Le contexte peut impliquer une écoute réceptive et obéissante, mais le verbe hébreu conserve ici une tension entre perception physique et réponse intérieure qu’il ne faut pas résoudre dans la traduction.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation scinde la longue phrase hébraïque pour rendre clairement le passage du singulier collectif « maison » au pluriel « ils », tout en conservant le parallélisme et la répétition du texte source.
