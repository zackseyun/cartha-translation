lexical_decisions:
- source_word: וַיְהִי
  choice: m’est parvenue
  rationale: Dans cette formule prophétique, la forme narrative de היה s’intègre naturellement en français à « la parole … m’est parvenue » ; la succession du récit est suffisamment portée par le contexte.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve le sens lexical de דָּבָר et l’écho de la formule prophétique traditionnelle, sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter directement le tétragramme hébreu.
- source_word: אֵלַי
  choice: m’
  rationale: Le pronom indirect intégré à « m’est parvenue » rend naturellement la préposition et le suffixe de première personne.
- source_word: בַּבֹּקֶר
  choice: Le matin
  rationale: Expression temporelle simple et idiomatique en français moderne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français les paroles directes qui suivent, tout en remplissant la fonction discursive de לֵאמֹר.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » préserve la présence explicite du nom divin dans le texte hébreu ; la note signale le rendu traditionnel sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « la parole … m’est parvenue » conserve la formule prophétique tout en restant naturelle ; les deux-points évitent le calque pesant « en disant ».
