  naturalness: Le français est moderne, clair et d’un registre approprié. La formulation révisée améliore la précision et la fluidité de la description du percement du mur.
  terminology: « Affaires » convient ici pour כֵּלַי, des biens transportables. « Exilé » et « exil » conservent le champ sémantique de גּוֹלָה sans imposer une interprétation supplémentaire. « Sous leurs yeux » rend bien לְעֵינֵיהֶם.
