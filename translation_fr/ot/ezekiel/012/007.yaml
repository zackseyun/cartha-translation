  text: וָ/אַ֣עַשׂ כֵּן֮ כַּ/אֲשֶׁ֣ר צֻוֵּיתִי֒ כֵּ֠לַ/י הוֹצֵ֜אתִי כִּ/כְלֵ֤י גוֹלָה֙ יוֹמָ֔ם וּ/בָ/עֶ֛רֶב חָתַֽרְתִּי לִ֥/י בַ/קִּ֖יר בְּ/יָ֑ד בָּ/עֲלָטָ֥ה הוֹצֵ֛אתִי עַל כָּתֵ֥ף נָשָׂ֖אתִי לְ/עֵינֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: fr
  text: 'J’ai donc fait ce qui m’avait été ordonné : pendant la journée, j’ai sorti mes affaires, comme les affaires d’un exilé[a]. Le soir, je me suis fait une ouverture dans le mur, à la main. Dans l’obscurité, j’ai sorti mes affaires[b] et je les ai portées sur mon épaule sous leurs yeux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le bagage d’un déporté ». L’expression hébraïque désigne des biens préparés pour un départ en exil.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la pénombre » ou « au crépuscule ». Le terme hébreu désigne l’obscurité et peut aussi suggérer la dissimulation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן כַּאֲשֶׁר צֻוֵּיתִי
  choice: J’ai donc fait ce qui m’avait été ordonné
  rationale: « Donc » exprime naturellement la mise à exécution, tandis que le plus-que-parfait situe l’ordre avant son accomplissement et conserve la tournure passive.
- source_word: כֵּלַי ... כִּכְלֵי גוֹלָה
  choice: mes affaires, comme les affaires d’un exilé
  rationale: כְּלִי désigne ici les effets transportables. « Affaires » est courant et concret; « d’un exilé » explicite naturellement la relation exprimée par גוֹלָה sans réduire l’exil à un voyage volontaire.
- source_word: יוֹמָם וּבָעֶרֶב
  choice: pendant la journée ... Le soir
  rationale: Cette formulation conserve clairement la progression temporelle entre l’exposition publique des affaires et le percement du mur.
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: j’ai percé le mur de mes propres mains
  rationale: חתר décrit l’action de creuser ou pratiquer une ouverture à travers le mur. « De mes propres mains » rend idiomatiquement l’insistance de לִי et בְּיָד sur l’action personnelle et manuelle, sans traduire mécaniquement לִי.
- source_word: בָּעֲלָטָה
  choice: Dans l’obscurité
  rationale: Le terme désigne l’obscurité ou la pénombre. Cette traduction garde le sens concret sans imposer l’idée interprétative d’une action secrète.
- source_word: הוֹצֵאתִי עַל כָּתֵף נָשָׂאתִי
  choice: j’ai sorti mes affaires et je les ai portées sur mon épaule
  rationale: La répétition explicite de « mes affaires » évite en français une référence pronominale incertaine et conserve l’image concrète du départ en exil.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression française naturelle qui préserve le caractère public et délibérément visible du geste prophétique.
theological_decisions:
- issue: Nature du geste prophétique d’Ézéchiel
  choice: Décrire les actes de manière concrète et publique sans en donner ici une interprétation allégorique.
  alternative: Insérer dans la traduction une explication explicite du symbole de la déportation.
  rationale: Le contexte explique la portée du geste. Ce verset doit conserver la succession matérielle des actions et laisser l’interprétation se déployer dans les versets environnants.
- issue: Valeur de בָּעֲלָטָה
  choice: Conserver l’image de l’obscurité.
  alternative: Traduire par « en secret », ce qui mettrait au premier plan la dissimulation.
  rationale: La dissimulation peut être suggérée par le contexte, mais le mot désigne d’abord une faible lumière ou l’obscurité; il convient de ne pas résoudre cette nuance par une interprétation unique.
translation_notes:
  register: Français international moderne, clair et digne. « Affaires » est plus naturel que « effets » ou « bagage » dans le corps du texte; la note conserve l’autre formulation possible. Les phrases relativement courtes rendent lisible la succession des gestes.
