source:
  edition: WLC
  text: בֶּן אָדָ֗ם הִנֵּ֤ה בֵֽית יִשְׂרָאֵל֙ אֹֽמְרִ֔ים הֶ/חָז֛וֹן אֲשֶׁר ה֥וּא חֹזֶ֖ה לְ/יָמִ֣ים רַבִּ֑ים וּ/לְ/עִתִּ֥ים רְחוֹק֖וֹת ה֥וּא נִבָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: fr
  text: 'Fils d’homme, voici ce que dit la maison d’Israël : « La vision qu’il a concerne un avenir lointain, et il prophétise au sujet de temps éloignés. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse traditionnelle et naturelle en français biblique, correspondant littéralement à l’hébreu.
- source_word: הִנֵּה
  choice: voici
  rationale: Marque l’attention portée aux paroles rapportées sans alourdir la phrase.
- source_word: בֵית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’image collective de l’hébreu et son registre prophétique.
- source_word: הֶחָזוֹן אֲשֶׁר הוּא חֹזֶה
  choice: La vision qu’il reçoit
  rationale: Évite en français la répétition maladroite « la vision qu’il voit » tout en exprimant l’expérience visionnaire du prophète.
- source_word: לְיָמִים רַבִּים
  choice: concerne un avenir lointain
  rationale: Dans ce contexte, l’expression indique que l’accomplissement est tenu pour très éloigné, plutôt qu’une simple durée de nombreux jours.
- source_word: וּלְעִתִּים רְחוֹקוֹת הוּא נִבָּא
  choice: et il prophétise sur des temps éloignés
  rationale: Reproduit le parallélisme et rend la préposition par « sur », au sens du sujet de la prophétie.
theological_decisions:
- issue: Portée temporelle des paroles rapportées
  choice: Présenter l’avenir comme lointain selon ce que dit Israël
  alternative: Affirmer directement que la vision ne s’accomplira que longtemps après
  rationale: Les guillemets maintiennent clairement qu’il s’agit de l’opinion de la maison d’Israël, opinion que le contexte divin contestera, sans la valider narrativement.
translation_notes:
  register: Français moderne, digne et lisible, avec maintien de « Fils d’homme » et « maison d’Israël » pour préserver le registre prophétique. Le parallélisme des deux propositions temporelles est conservé sans calque artificiel.
