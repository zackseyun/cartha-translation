    issue: « La vision qu’il reçoit »
    rationale: Le texte hébreu dit littéralement « la vision qu’il voit ». « Reçoit » est une explicitation acceptable, mais « qu’il a » rend plus directement et plus naturellement l’idée d’une vision sans préciser indûment son mode de réception.
  - severity: low
    issue: « il prophétise sur des temps éloignés »
    rationale: La tournure est compréhensible, mais « prophétiser au sujet de » est plus idiomatique en français moderne et rend clairement la préposition hébraïque indiquant le sujet de la prophétie.
  revised_text: 'Fils d’homme, voici ce que dit la maison d’Israël : « La vision qu’il a concerne un avenir lointain, et il prophétise au sujet de temps éloignés. »'
