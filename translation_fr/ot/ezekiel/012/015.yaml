  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: fr
  text: Ils sauront que je suis Yahweh lorsque je les disperserai parmi les nations et que je les disséminerai à travers les pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le parfait qal avec la conjonction, dans ce discours prophétique, exprime ici le résultat futur des actes annoncés. « Alors » rend naturellement la relation résultative avec le contexte.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Cette formule de reconnaissance caractéristique d’Ézéchiel est conservée directement, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: בַּהֲפִיצִי
  choice: quand je les disperserai
  rationale: La préposition ב avec l’infinitif construit hiphil et le suffixe de première personne a ici une valeur temporelle. Le hiphil de פוץ indique que Dieu provoque leur dispersion.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne les peuples étrangers au milieu desquels ils seront dispersés; « nations » est clair et n’importe pas une coloration propre au Nouveau Testament.
- source_word: וְזֵרִיתִי
  choice: et les disséminerai
  rationale: זרה signifie répandre ou disperser, avec parfois une image de vannage. « Disséminer » préserve le parallélisme tout en distinguant ce verbe de פוץ.
- source_word: בָּאֲרָצוֹת
  choice: dans différents pays
  rationale: Le pluriel אֲרָצוֹת désigne plusieurs terres ou pays. « Dans différents pays » exprime clairement l’étendue géographique de la dispersion sans évoquer nécessairement des États modernes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre; « Jéhovah » repose sur une vocalisation hybride plus tardive.
translation_notes:
  register: Français international moderne, digne et accessible. La structure temporelle et la formule de reconnaissance propres à Ézéchiel sont conservées, avec une légère variation lexicale entre les deux verbes de dispersion.
