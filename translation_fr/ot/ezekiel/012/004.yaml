revisions:
- from: Tu sortiras pendant la journée tes affaires, comme les affaires d’un déporté[a], sous leurs yeux. Puis, toi-même, tu sortiras le soir sous leurs yeux, comme partent ceux qu’on déporte[b].
  to: Tu sortiras, durant le jour et sous leurs yeux, tes bagages, comme des bagages d’exil[a]. Puis toi-même, tu sortiras le soir, sous leurs yeux, à la manière de ceux qui partent en exil[b].
  rationale: La révision maintient l’action symbolique, la répétition de « sous leurs yeux » et l’emphase de « toi-même ». Elle rend plus naturellement la comparaison finale et préserve dans le texte comme dans les notes les ambiguïtés de גּוֹלָה, sans introduire une précision passive ou historique qui n’est pas explicitement formulée par l’hébreu.
