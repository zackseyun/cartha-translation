  text: וְ/הוֹצֵאתָ֨ כֵלֶ֜י/ךָ כִּ/כְלֵ֥י גוֹלָ֛ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/אַתָּ֗ה תֵּצֵ֤א בָ/עֶ֨רֶב֙ לְ/עֵ֣ינֵי/הֶ֔ם כְּ/מוֹצָאֵ֖י גּוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: fr
  text: Tu sortiras, durant le jour et sous leurs yeux, tes bagages, comme des bagages d’exil[a]. Puis toi-même, tu sortiras le soir, sous leurs yeux, à la manière de ceux qui partent en exil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme les bagages d’un exilé ». L’expression hébraïque peut désigner collectivement des bagages liés à l’exil ou les bagages d’un exilé.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « comme des exilés qui partent » ou « comme partent les exilés ». L’hébreu dit littéralement « comme les départs de l’exil/des exilés », une expression qui évoque la manière de partir en exil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: Tu sortiras
  rationale: Le hiphil de יצא signifie faire sortir. En français, « sortir tes affaires » exprime naturellement cette valeur causative sans alourdir la phrase.
- source_word: כֵלֶיךָ
  choice: tes affaires
  rationale: כְּלִי désigne ici les objets et effets emportés lors d’un départ forcé. « Affaires » est courant, clair et adapté au contexte.
- source_word: כִּכְלֵי גוֹלָה
  choice: comme les affaires d’un déporté
  rationale: Cette formulation rend concrètement les effets liés à la déportation tout en signalant en note que l’hébreu peut aussi avoir un sens collectif.
- source_word: גּוֹלָה
  choice: déporté / déportation
  rationale: Dans le geste symbolique d’Ézéchiel, le terme évoque le déplacement forcé vers l’exil. Le champ lexical de la déportation rend clairement cette dimension en français moderne.
- source_word: יוֹמָם
  choice: pendant la journée
  rationale: L’expression marque nettement le contraste temporel avec « le soir ».
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression française conserve l’image concrète et l’insistance répétée de l’hébreu sur le caractère public du geste.
- source_word: וְאַתָּה
  choice: Puis, toi-même
  rationale: Le pronom indépendant est emphatique. « Toi-même » garde cette mise en relief, tandis que « Puis » rend naturellement la progression des actions.
- source_word: תֵּצֵא
  choice: tu sortiras
  rationale: Le qal de יצא décrit le déplacement personnel du prophète. « Sortir » est direct et maintient l’écho lexical avec la première proposition.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Formulation naturelle en français moderne, en contraste avec l’action accomplie pendant la journée.
- source_word: כְּמוֹצָאֵי גּוֹלָה
  choice: comme partent ceux qu’on déporte
  rationale: Le pluriel construit évoque la manière dont partent les personnes emmenées en exil. La tournure française conserve l’idée de départ et explicite naturellement la contrainte inhérente à la déportation.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « sous leurs yeux » et l’accent porté par « toi-même » sont conservés. « Déporté » et « déporte » rendent le départ forcé plus concrètement que le seul terme abstrait « exil », tandis que les notes préservent l’ambiguïté collective ou individuelle de גּוֹלָה.
