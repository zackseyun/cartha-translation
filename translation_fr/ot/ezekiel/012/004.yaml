review_pass:
  verdict: revise
  source_fidelity: La première action doit exprimer que le prophète fait sortir ses effets; « sortir ses affaires » le permet en français. La comparaison כִּכְלֵי גוֹלָה reste ambiguë entre un sens collectif (« bagages d’exil ») et individualisé. Pour כְּמוֹצָאֵי גוֹלָה, le français doit rendre une comparaison de manière liée au départ en exil sans affirmer inutilement une formulation passive (« ceux qu’on déporte ») absente de l’hébreu.
  naturalness: « Comme partent ceux qu’on déporte » est peu naturel après « tu sortiras » et donne une tournure syntaxiquement heurtée. « À la manière de ceux qui partent en exil » est idiomatique et conserve la fonction comparative. « Bagages » est plus précis que le très large « affaires » dans ce contexte de départ.
  terminology: « Exil » traduit de façon sobre et cohérente גּוֹלָה, dont la portée peut être l’exil, les exilés ou la déportation. Il évite de fixer le texte à « déporté », terme plus étroit et qui peut suggérer que le départ est déjà achevé.
