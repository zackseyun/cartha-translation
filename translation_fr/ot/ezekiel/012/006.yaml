source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: fr
  text: Sous leurs yeux, tu le porteras sur ton épaule ; tu le sortiras dans l’obscurité[a]. Tu couvriras ton visage et tu ne verras pas le pays, car j’ai fait de toi un signe[b] pour la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la pénombre ». Le terme hébreu peut désigner l’obscurité ou une lumière très faible.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un présage ». Le terme hébreu peut désigner un signe symbolique ayant aussi une portée inquiétante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: Sous leurs yeux
  rationale: Cette expression française naturelle conserve l’image vive d’une action accomplie en leur présence et à leur vue.
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: tu le porteras sur ton épaule
  rationale: Le verbe נשׂא associé à « épaule » décrit le transport d’une charge. Le pronom « le », implicite en hébreu, reprend l’équipement d’exilé mentionné dans le contexte.
- source_word: בָּעֲלָטָה
  choice: dans l’obscurité
  rationale: Le nom עלטה désigne l’obscurité ou une profonde pénombre. « Dans l’obscurité » en rend directement le sens sans imposer précisément le crépuscule.
- source_word: תוֹצִיא
  choice: tu le feras sortir
  rationale: La forme causative de יצא signifie ici « faire sortir ». Le pronom reprend, comme dans la proposition précédente, l’objet implicite fourni par le contexte.
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: Tu te couvriras le visage
  rationale: Traduction directe et naturelle de l’action symbolique, sans préciser indûment la nature de ce qui couvre le visage.
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: afin de ne pas voir le pays
  rationale: La coordination hébraïque exprime ici naturellement le but ou le résultat de l’action précédente. « Afin de » rend clairement ce rapport en français.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte d’exil, הָאָרֶץ renvoie vraisemblablement au pays natal. « Le pays » préserve toutefois l’absence de précision explicite dans le texte hébreu.
- source_word: מוֹפֵת
  choice: un signe
  rationale: מופת désigne ici un signe symbolique incarné par Ézéchiel. « Signe » est clair et accessible, tandis que « présage » souligne davantage la portée inquiétante possible.
- source_word: נְתַתִּיךָ
  choice: j’ai fait de toi
  rationale: Littéralement « je t’ai donné », la construction signifie idiomatiquement que Dieu a établi Ézéchiel comme signe.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: « Maison d’Israël » conserve la désignation collective caractéristique du langage prophétique, et « pour » indique les destinataires du signe.
theological_decisions:
- issue: Référent de « le pays » dans l’action symbolique
  choice: Conserver « le pays » sans ajouter « d’Israël »
  alternative: le pays d’Israël ; la terre ; le sol
  rationale: Le contexte suggère fortement la patrie dont les habitants seront exilés, mais l’hébreu dit seulement « le pays/la terre ». La formulation retenue maintient cette sobriété sans explicitation interprétative.
- issue: Portée de מוֹפֵת
  choice: un signe
  alternative: un présage
  rationale: Ézéchiel sert de signe symbolique à Israël. Le terme peut aussi avoir une portée inquiétante, signalée en note, mais le texte ne requiert pas que cette nuance soit imposée dans la traduction principale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse divine directe au prophète. La structure de l’action symbolique demeure proche de l’hébreu, avec seulement les pronoms nécessaires à la fluidité française.
