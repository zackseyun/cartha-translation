source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: fr
  text: Je déploierai mon filet sur lui[a], et il sera pris dans mon piège. Puis je l’emmènerai à Babylone, au pays des Chaldéens ; pourtant, il ne la verra pas[b], et c’est là qu’il mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon rets ». Les deux mots hébreux traduits par « filet » et « piège » appartiennent au vocabulaire de la chasse et de la capture.
    reason: lexical_alternative
  - marker: b
    text: Le fait qu’il soit emmené à Babylone sans la voir s’éclaire à la lumière de 2 Rois 25.7 ; Jérémie 39.7 ; 52.11.
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Je déploierai
  rationale: Le verbe פָּרַשׂ signifie étendre ou déployer. « Déployer » exprime naturellement l’action d’étendre un filet tout en conservant l’image hébraïque.
- source_word: רִשְׁתִּי
  choice: mon filet
  rationale: רֶשֶׁת désigne couramment un filet employé pour capturer une proie.
- source_word: עָלָיו
  choice: sur lui
  rationale: La préposition עַל a ici un sens spatial et s’intègre à l’image du filet déployé sur quelqu’un.
- source_word: וְנִתְפַּשׂ
  choice: il sera pris
  rationale: La forme niphal exprime ici le passif. « Être pris » maintient directement l’image de la capture.
- source_word: בִּמְצוּדָתִי
  choice: dans mon piège
  rationale: מְצוּדָה peut désigner un filet, un piège ou un dispositif de capture. « Piège » évite une répétition maladroite tout en préservant l’imagerie de chasse.
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: Puis je l’emmènerai
  rationale: Le hiphil de בוא signifie « amener ». Avec une destination géographique, « emmener » est idiomatique en français ; « puis » rend naturellement la succession des actions.
- source_word: בָבֶלָה
  choice: à Babylone
  rationale: La terminaison directionnelle indique un mouvement vers Babylone.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: au pays des Chaldéens
  rationale: Cette expression appositive identifie la région. « Chaldéens » conserve la désignation historique et ethnique du texte hébreu.
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: pourtant, il ne la verra pas
  rationale: Le pronom féminin renvoie naturellement au « pays », nom masculin en français dans la proposition précédente, mais peut reprendre Babylone, ville grammaticalement féminine ; « la » conserve donc la référence à Babylone et la tension du texte. « Pourtant » fait ressortir le contraste sans en expliquer la cause.
- source_word: וְשָׁם יָמוּת
  choice: et c’est là qu’il mourra
  rationale: Cette formulation française conserve l’accent porté par שָׁם sur le lieu où il mourra.
theological_decisions:
- issue: Ironie historique implicite dans « il ne la verra pas »
  choice: Conserver l’affirmation littérale sans préciser dans le corps du texte pourquoi il ne verra pas Babylone.
  alternative: 'Développer explicitement : « mais il ne la verra pas, car il aura été aveuglé »'
  rationale: Le verset affirme qu’il sera conduit à Babylone sans la voir, mais n’en donne pas ici la cause. L’explication historique est donc placée en note afin de préserver la tension propre au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur prophétique et l’imagerie de capture sont conservés. La ponctuation fait ressortir le contraste sans résoudre l’ironie historique dans le texte principal.
