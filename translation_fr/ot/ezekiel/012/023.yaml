  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִשְׁבַּ֨תִּי֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה וְ/לֹֽא יִמְשְׁל֥וּ אֹת֛/וֹ ע֖וֹד בְּ/יִשְׂרָאֵ֑ל כִּ֚י אִם דַּבֵּ֣ר אֲלֵי/הֶ֔ם קָֽרְבוּ֙ הַ/יָּמִ֔ים וּ/דְבַ֖ר כָּל חָזֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: fr
  text: 'C’est pourquoi, dis-leur : « Voici ce que dit le Seigneur Yahweh : Je mettrai fin à ce proverbe, et on ne le citera plus en Israël. Mais dis-leur : “Les jours approchent, ainsi que l’accomplissement de chaque vision[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la parole de chaque vision »; dans ce contexte, il s’agit de sa réalisation effective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement le lien logique avec ce qui précède.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: dis-leur
  rationale: Conserve la force de l’ordre prophétique dans un français courant.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formule prophétique naturelle en français; « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה.
- source_word: הִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: Le hiphil de שבת signifie faire cesser; le parfait a ici, dans la déclaration prophétique, une portée performative et future.
- source_word: הַמָּשָׁל הַזֶּה
  choice: ce proverbe
  rationale: מָשָׁל désigne ici la formule populaire citée au verset précédent.
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: et on ne le citera plus en Israël
  rationale: Le verbe signifie ici employer ou énoncer un proverbe; « citer » exprime ce sens avec naturel sans le confondre avec « dominer ».
- source_word: כִּי אִם
  choice: Mais
  rationale: Marque le contraste entre le proverbe supprimé et le message qui doit le remplacer.
- source_word: קָרְבוּ הַיָּמִים
  choice: Les jours approchent
  rationale: Exprime clairement l’imminence signalée par le parfait hébreu, sans lourdeur en français.
- source_word: וּדְבַר כָּל חָזוֹן
  choice: ainsi que l’accomplissement de chaque vision
  rationale: דָּבָר signifie littéralement « parole, chose, affaire »; dans ce contexte de délai prophétique, il vise la réalisation effective des visions. Une note conserve la formulation plus littérale.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre יהוה et évite de masquer le nom divin.
- issue: Portée de וּדְבַר כָּל חָזוֹן
  choice: l’accomplissement de chaque vision
  alternative: la parole de chaque vision
  rationale: Le contexte oppose l’annonce d’un délai à la réalisation imminente des visions. « Accomplissement » explicite ce sens contextuel, tandis que la note préserve l’ambiguïté lexicale de דָּבָר.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Voici ce que dit » est idiomatique tout en conservant le caractère solennel de l’oracle. Le singulier indéfini « on » rend naturellement le sujet pluriel non précisé de l’hébreu.
