  text: Before their eyes[a], dig through the wall, and bring out through it.
translation:
  language: fr
  text: Sous leurs yeux[a], creuse-toi une ouverture dans le mur et fais-y sortir tes affaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Devant leurs yeux ». L’hébreu n’exprime pas ici l’objet de « fais sortir » ; le contexte immédiat l’identifie aux affaires préparées pour l’exil.'
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: Sous leurs yeux
  rationale: Cette expression idiomatique conserve l’image concrète de l’action accomplie ouvertement en leur présence.
- source_word: חֲתָר
  choice: perce
  rationale: Le verbe désigne l’action de creuser ou de pratiquer un passage dans un mur. « Perce » exprime naturellement en français le résultat visé.
- source_word: לְךָ
  choice: pour toi
  rationale: Le pronom datif rattache personnellement l’action au destinataire; la formulation conserve cette nuance sans la transformer en pronom réfléchi.
- source_word: בַקִּיר
  choice: le mur
  rationale: L’article hébreu désigne le mur présent dans la scène; l’article défini français convient donc.
- source_word: וְהוֹצֵאתָ
  choice: fais passer tes affaires
  rationale: 'La forme causative signifie « faire sortir ». L’objet, non exprimé dans ce verset, est fourni par le contexte immédiat: les affaires préparées pour l’exil au verset précédent.'
- source_word: בּוֹ
  choice: par cette ouverture
  rationale: Le pronom renvoie au passage pratiqué dans le mur. Cette formulation explicite naturellement en français le chemin emprunté, sans suggérer qu’on passe à travers la matière du mur.
