  text: בֶּן אָדָ֕ם הֲ/לֹ֨א אָמְר֥וּ אֵלֶ֛י/ךָ בֵּ֥ית יִשְׂרָאֵ֖ל בֵּ֣ית הַ/מֶּ֑רִי מָ֖ה אַתָּ֥ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: fr
  text: 'Fils d’homme, la maison d’Israël, cette maison rebelle, ne t’a-t-elle pas dit : « Que fais-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse caractéristique d’Ézéchiel et sa continuité littéraire, tout en restant intelligible en français biblique moderne.
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: Rend la question rhétorique qui appelle une réponse affirmative, au moyen de la tournure interrogative française naturelle « ne t’a-t-elle pas… ? ».
- source_word: אָמְרוּ אֵלֶיךָ
  choice: ne t’a-t-elle pas demandé
  rationale: Le verbe signifie littéralement « dire », mais puisque les paroles rapportées constituent une question, « demander » exprime naturellement en français l’acte de parole sans modifier son contenu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Maintient l’expression collective et covenantale propre au langage prophétique plutôt que de l’aplanir en « le peuple d’Israël ».
- source_word: בֵּית הַמֶּרִי
  choice: cette communauté rebelle
  rationale: L’expression est en apposition à « la maison d’Israël ». Répéter « maison » serait lourd et ambigu en français; « communauté » conserve le sens collectif, tandis que « cette » marque clairement l’apposition caractérisante.
- source_word: מָה אַתָּה עֹשֶׂה
  choice: Que fais-tu ?
  rationale: Le participe avec le pronom désigne l’action en cours; le présent français rend celle-ci naturellement.
