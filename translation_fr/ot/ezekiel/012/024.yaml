source:
  edition: WLC
  text: כִּ֠י לֹ֣א יִֽהְיֶ֥ה ע֛וֹד כָּל חֲז֥וֹן שָׁ֖וְא וּ/מִקְסַ֣ם חָלָ֑ק בְּ/ת֖וֹךְ בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/024.yaml
  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
translation:
  language: fr
  text: Car il n’y aura plus aucune vision mensongère ni aucune divination flatteuse au sein de la maison d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « divination aux paroles doucereuses ». L’adjectif hébreu signifie littéralement « lisse » et désigne probablement ici une parole flatteuse ou faussement rassurante.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement la valeur causale du terme hébreu.
- source_word: לֹא ... עוֹד
  choice: il n’y aura plus
  rationale: Exprime clairement la cessation à partir de ce moment, dans un français moderne et idiomatique.
- source_word: כָּל
  choice: aucune
  rationale: Sous la négation, כָּל prend ici le sens de « aucune »; la répétition devant les deux noms rend la portée totale de la négation sans ambiguïté en français.
- source_word: חֲזוֹן שָׁוְא
  choice: vision mensongère
  rationale: שָׁוְא peut évoquer la fausseté, la vanité ou le caractère trompeur. « Mensongère » exprime nettement la fausse prétention prophétique dans ce contexte.
- source_word: מִקְסַם
  choice: divination
  rationale: Terme courant et précis pour une pratique mantique condamnée dans le discours prophétique.
- source_word: חָלָק
  choice: flatteuse
  rationale: L’adjectif signifie littéralement « lisse » et qualifie ici vraisemblablement une parole séduisante, complaisante ou faussement rassurante.
- source_word: בְּתוֹךְ
  choice: au sein de
  rationale: Rend la localisation interne de manière naturelle tout en s’accordant avec l’expression collective « maison d’Israël ».
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’image et la désignation collective caractéristiques du registre prophétique.
theological_decisions:
- issue: Nature des paroles prophétiques condamnées
  choice: Le verset condamne à la fois les visions mensongères et les divinations séduisantes ou complaisantes en Israël.
  alternative: Comprendre plus littéralement la seconde expression comme « divination lisse » ou « divination aux paroles doucereuses ».
  rationale: « Flatteuse » transmet l’effet idiomatique probable de חָלָק sans effacer son sens littéral, lequel est signalé en note. Le texte maintient ainsi la distinction entre deux formes de révélation illégitime.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le tour prophétique « maison d’Israël » et emploie « mensongère » plutôt que « vaine » afin de rendre clairement la dénonciation de visions fausses.
