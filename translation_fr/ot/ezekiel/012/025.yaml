  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: fr
  text: 'Car c’est moi, Yahweh, qui parlerai : toute parole que je prononcerai s’accomplira. Elle ne sera plus différée. Oui, de votre temps, communauté rebelle, je prononcerai une parole et je l’accomplirai — déclaration du Seigneur Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel, plutôt que de le remplacer par un titre.
- source_word: אֵת אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: toute parole que je prononcerai
  rationale: Cette formulation française garde l’emphase de la construction hébraïque et le substantif « parole », tout en restant naturelle.
- source_word: וְיֵעָשֶׂה
  choice: s’accomplira
  rationale: Le passif hébreu exprime la réalisation certaine de la parole divine ; « s’accomplira » rend naturellement le lien entre annonce et réalisation.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: Elle ne sera plus différée
  rationale: Le féminin renvoie vraisemblablement à la parole ou à sa réalisation ; « différée » conserve l’idée d’un délai prolongé.
- source_word: בֵּית הַמֶּרִי
  choice: communauté rebelle
  rationale: Littéralement « maison de rébellion » ; « communauté rebelle » transmet le sens collectif de בית sans imposer en français une métaphore potentiellement obscure.
- source_word: וַעֲשִׂיתִיו
  choice: je l’accomplirai
  rationale: Le parfait avec waw porte ici une valeur future certaine et reprend le thème de l’efficacité de la parole divine.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה.
theological_decisions:
- issue: Traduction des noms et titres divins
  choice: Yahweh au début et « le Seigneur Yahweh » dans la formule finale
  alternative: « le SEIGNEUR » au début et « le Seigneur DIEU » à la fin
  rationale: Cette solution rend explicitement le tétragramme dans les deux occurrences tout en préservant la présence du titre אֲדֹנָי dans la formule finale.
- issue: Rapport entre parole divine et accomplissement
  choice: Conserver le parallèle « prononcerai / s’accomplira / accomplirai »
  alternative: Paraphraser par « ce que j’annonce arrivera »
  rationale: 'Le parallèle maintient la tension et la force du texte hébreu : la parole prononcée est suivie de sa réalisation certaine.'
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de l’oracle est conservé, avec une ponctuation qui fait ressortir l’affirmation initiale et l’imminence de l’accomplissement.
