- from: '« Fils d’homme, quel est donc ce proverbe qui circule parmi vous sur la terre d’Israël ? Vous dites : “Les jours se prolongent, et toute vision reste sans effet[a].” »'
  to: '« Fils d’homme, quel est donc ce proverbe qui circule parmi vous, en terre d’Israël, et qui dit : “Les jours se prolongent, et toute vision périt[a].” »'
  rationale: La révision rattache explicitement la citation au proverbe, conformément à לֵאמֹר, et rend אָבַד par « périt », qui est plus proche du sens lexical tout en restant compréhensible dans le contexte prophétique. La note propose l’alternative française plus courante « disparaît ».
