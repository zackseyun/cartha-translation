  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: fr
  text: '« Fils d’homme, quel est donc ce proverbe qui circule parmi vous, en terre d’Israël, et qui dit : “Les jours se prolongent, et toute vision périt[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute vision disparaît » ; littéralement, « toute vision périt ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse récurrente propre au livre d’Ézéchiel. Ici, elle souligne la condition humaine du prophète sans imposer une interprétation christologique ultérieure.
- source_word: מָה הַמָּשָׁל הַזֶּה לָכֶם
  choice: quel est donc ce proverbe qui circule parmi vous
  rationale: מָשָׁל désigne ici une maxime populaire, non une parabole narrative. « Qui circule parmi vous » exprime naturellement en français l’idée idiomatique portée par לָכֶם, celle d’un dicton en usage dans le peuple.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: sur la terre d’Israël
  rationale: אַדְמָה évoque proprement le sol ou la terre. Cette formulation reste proche de l’image hébraïque tout en désignant clairement le territoire d’Israël.
- source_word: לֵאמֹר
  choice: Vous dites
  rationale: Rend clairement la formule qui introduit les paroles du proverbe et produit une transition naturelle en français.
- source_word: יַאַרְכוּ הַיָּמִים
  choice: Les jours se prolongent
  rationale: Reflète directement l’idée de jours qui deviennent longs et donc d’un délai qui se prolonge, sans accentuer excessivement le ton sceptique.
- source_word: וְאָבַד כָּל חָזוֹן
  choice: et toute vision reste sans effet
  rationale: Dans ce contexte, אָבַד présente les visions prophétiques comme vouées à disparaître ou à ne pas s’accomplir. « Reste sans effet » communique naturellement cette portée, tandis que la note conserve le sens lexical plus concret.
theological_decisions:
- issue: Portée de בֶּן אָדָם dans l’adresse au prophète
  choice: Fils d’homme
  alternative: être humain / mortel
  rationale: Il s’agit de la formule d’adresse divine caractéristique d’Ézéchiel. La traduction retenue maintient sa cohérence littéraire et ses résonances intertextuelles sans en faire ici un titre messianique.
- issue: Nature de l’échec attribué à la vision
  choice: toute vision reste sans effet
  alternative: toute vision disparaît / périt
  rationale: Le proverbe met en doute l’accomplissement des visions prophétiques. La formulation choisie rend cette implication contextuelle sans préciser si la vision est fausse, annulée ou simplement non accomplie; la note signale la valeur lexicale plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure proverbiale demeure concise, et la ponctuation distingue clairement la question divine du dicton cité.
