id: EZK.12.16
reference: Ezekiel 12:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: fr
  text: Mais je laisserai subsister parmi eux quelques hommes qui échapperont à l’épée, à la famine et à la peste, afin qu’ils racontent toutes leurs abominations parmi les nations où ils iront[a]. Alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « où ils sont allés » ou « où ils sont arrivés ». Le verbe hébreu est au parfait, mais, dans ce contexte tourné vers l’avenir, il peut désigner leur destination future.'
    reason: alternative lexicale et valeur temporelle du verbe
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: je laisserai subsister
  rationale: Le hifil de יתר signifie ici laisser subsister un reste. Cette formulation garde l’idée de survivants laissés en vie sans atténuer l’action divine.
- source_word: מֵהֶם
  choice: parmi eux
  rationale: La préposition exprime le prélèvement d’un petit groupe au sein de l’ensemble.
- source_word: אַנְשֵׁי מִסְפָּר
  choice: quelques hommes
  rationale: L’expression désigne un nombre restreint et dénombrable d’hommes; « quelques hommes » est naturel en français et conserve la référence masculine du texte.
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: qui échapperont à l’épée, à la famine et à la peste
  rationale: La construction française explicite naturellement que ces survivants sont préservés des trois fléaux, tout en conservant la triade prophétique et l’image de l’épée.
- source_word: לְמַעַן יְסַפְּרוּ
  choice: afin qu’ils racontent
  rationale: לְמַעַן introduit un but, et le piel de ספר désigne l’action de raconter ou d’exposer les faits.
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: toutes leurs abominations
  rationale: « Abominations » conserve la forte portée morale et cultuelle de תּוֹעֵבָה dans Ézéchiel.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples étrangers au milieu desquels les survivants seront dispersés.
- source_word: אֲשֶׁר בָּאוּ שָׁם
  choice: où ils iront
  rationale: Bien que בָּאוּ soit formellement un parfait, le contexte prospectif permet une formulation française orientée vers l’avenir; la note signale la forme hébraïque.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: La formule de reconnaissance récurrente chez Ézéchiel est conservée; « alors » rend naturellement l’enchaînement sans surinterpréter sa portée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter directement le tétragramme du texte hébreu.
theological_decisions:
- issue: Expression masculine אַנְשֵׁי מִסְפָּר
  choice: quelques hommes
  alternative: quelques personnes
  rationale: Le nom hébreu est explicitement masculin; la traduction conserve cette donnée plutôt que de la neutraliser.
- issue: Sujet de וְיָדְעוּ
  choice: ils, c’est-à-dire les survivants
  alternative: les nations sauront
  rationale: Le sujet grammatical le plus immédiat demeure les quelques hommes qui raconteront leurs actes. La traduction garde toutefois le simple pronom du texte sans ajouter d’explication interprétative.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La transcription maintient le nom propre d’alliance présent dans le texte source au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la triade prophétique « l’épée, la famine et la peste », ainsi que le terme fort « abominations ». Le marqueur [a] est placé après la proposition qu’il explique.
