language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: fr
  text: 'C’est pourquoi, dis-leur : « Voici ce que dit le Seigneur Yahweh : Aucune de mes paroles ne sera désormais retardée[a]. La parole que je prononcerai s’accomplira », déclare le Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sera plus prolongée » ou « ne traînera plus » ; le verbe hébreu évoque ce qui est étiré dans le temps.'
    reason: alternative lexicale
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’oracle précédent.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: dis-leur
  rationale: Rend directement l’impératif et son complément dans un français courant.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique claire et naturelle en français moderne, équivalente à la tournure hébraïque solennelle.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « le Seigneur, le SEIGNEUR ».
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: ne sera désormais retardée
  rationale: Le nifal de משׁך exprime ici une prolongation ou un report; dans le contexte de l’accomplissement prophétique, « retardée » communique clairement ce sens.
- source_word: כָּל דְּבָרָי
  choice: Aucune de mes paroles
  rationale: Sous la négation, l’hébreu « toutes mes paroles » possède une portée distributive que le français exprime naturellement par « aucune de mes paroles ».
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: La parole que je prononcerai
  rationale: Conserve le nom singulier דָּבָר et la nuance future possible de l’imparfait אֲדַבֵּר, tout en évitant une répétition maladroite en français.
- source_word: וְיֵעָשֶׂה
  choice: s’accomplira
  rationale: Exprime la réalisation effective de la parole annoncée; le verbe pronominal français rend idiomatiquement la valeur passive du nifal.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: Rend la formule solennelle d’attestation prophétique dans un français actuel et digne.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Le texte porte explicitement le nom divin après אֲדֹנָי. « Yahweh » préserve cette distinction sans substituer un second titre au nom propre.
- issue: Certitude de l’accomplissement de la parole divine
  choice: s’accomplira
  alternative: sera exécutée / arrivera
  rationale: Cette formulation maintient l’affirmation forte du texte selon laquelle la parole prononcée devient effectivement réalité, sans préciser artificiellement le mode de son accomplissement.
translation_notes:
  register: Français international moderne, clair et solennel. La formule prophétique reste reconnaissable sans archaïsme; « désormais » exprime la cessation immédiate du délai indiquée par עוֹד.
