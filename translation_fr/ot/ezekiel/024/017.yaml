revisions:
- from: Gémis en silence ; ne célèbre pas le deuil des morts. Attache ton turban sur ta tête et mets tes sandales à tes pieds. Ne te couvre pas la moustache[a] et ne mange pas le pain des autres[b].
  to: Gémis en silence ; ne prends pas le deuil pour les morts. Attache ton turban et mets tes sandales à tes pieds. Ne couvre pas ta moustache[a] et ne mange pas le pain des gens[b].
  rationale: La révision remplace une expression française à connotation inadaptée par l’idiome « prendre le deuil pour », plus fidèle à l’interdiction de faire le deuil. Elle rétablit aussi dans le texte principal le caractère plus littéral et ambigu de « pain des gens », en réservant l’explication coutumière à la note. Les ancres de notes restent attachées aux expressions qu’elles éclairent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les impératifs concernant la retenue du deuil, la coiffure, les sandales, la couverture de la lèvre et le pain sont conservés. Toutefois, « célébrer le deuil » n’est pas approprié ici : en français moderne, « célébrer » suggère facilement une commémoration ou une célébration positive, plutôt que l’accomplissement de rites de deuil. « Le pain des autres » interprète davantage l’expression לֶחֶם אֲנָשִׁים que ne le fait le texte hébreu ; « le pain des gens » conserve mieux sa concision et son ambiguïté.'
  naturalness: « Gémis en silence » est naturel et préserve volontairement la tension de l’hébreu. « Ne te couvre pas la moustache » est moins idiomatique et peut prêter à confusion quant à ce qui est couvert ; « Ne couvre pas ta moustache » est plus clair. Le reste est sobre et adapté au français moderne.
  terminology: « Turban » et « sandales » conviennent. « Lèvre supérieure » doit rester en note comme possibilité lexicale de שָׂפָם. La note sur le pain doit présenter la fourniture de nourriture aux endeuillés comme probable, non comme certaine.
  issues:
  - severity: medium
    issue: « ne célèbre pas le deuil des morts »
    rationale: Le verbe « célébrer » véhicule en français moderne des connotations de fête, d’hommage ou de commémoration qui ne correspondent pas bien à l’interdiction d’accomplir des pratiques de deuil (עשה אבל). « Ne prends pas le deuil pour les morts » est idiomatique et conserve l’idée de deuil observé.
  - severity: medium
    issue: « le pain des autres »
    rationale: Cette formulation intègre dans le texte l’interprétation selon laquelle la nourriture est apportée par autrui. Le syntagme hébreu « pain des gens/des hommes » reste compact et quelque peu ambigu ; l’explication doit demeurer en note.
  - severity: low
    issue: « Ne te couvre pas la moustache »
    rationale: La construction pronominale est moins naturelle et peut obscurcir le geste. « Ne couvre pas ta moustache » exprime directement l’action tout en laissant la note signaler l’alternative « lèvre supérieure ».
  revised_text: Gémis en silence ; ne prends pas le deuil pour les morts. Attache ton turban et mets tes sandales à tes pieds. Ne couvre pas ta moustache[a] et ne mange pas le pain des gens[b].
  revised_footnotes:
