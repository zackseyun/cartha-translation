  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: fr
  text: Gémis en silence ; ne prends pas le deuil pour les morts. Attache ton turban et mets tes sandales à tes pieds. Ne couvre pas ta moustache[a] et ne mange pas le pain des gens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lèvre supérieure ». Le terme hébreu peut désigner cette partie du visage plutôt que la moustache elle-même.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le pain des hommes » ou « le pain des gens ». Il s’agit probablement de nourriture apportée par d’autres aux personnes en deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: Gémis en silence
  rationale: הֵאָנֵק exprime un gémissement de douleur, tandis que דֹּם impose le silence ou la retenue. La formulation conserve la tension voulue entre le gémissement et son caractère silencieux.
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: ne célèbre pas le deuil des morts
  rationale: L’expression עשה אבל désigne l’accomplissement des pratiques de deuil. « Célébrer le deuil » rend l’action rituelle sans suggérer qu’Ézéchiel ne ressent aucune douleur.
- source_word: פְאֵרְךָ
  choice: ton turban
  rationale: פְאֵר désigne ici une coiffure portée avec dignité, par contraste avec les usages de deuil. « Turban » est concret et naturel dans ce contexte ancien.
- source_word: חֲבוֹשׁ עָלֶיךָ
  choice: Attache ... sur ta tête
  rationale: חבש évoque l’action d’attacher ou d’enrouler une coiffure. La mention explicite de la tête, implicite en hébreu, rend l’instruction naturelle en français.
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: mets tes sandales à tes pieds
  rationale: Traduction directe de l’ordre, qui maintient l’allusion concrète au fait de ne pas aller pieds nus pendant le deuil.
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: Ne te couvre pas la moustache
  rationale: שָׂפָם peut désigner la moustache ou la région de la lèvre supérieure. Le texte principal retient la formulation traditionnelle et concrète, tandis que la note conserve l’autre possibilité lexicale.
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: ne mange pas le pain des autres
  rationale: Littéralement, l’expression signifie « le pain des hommes » ou « des gens ». « Le pain des autres » reste concise en français et suggère, sans l’imposer dans le texte, une nourriture fournie par autrui.
theological_decisions:
- issue: Portée des interdictions relatives au deuil
  choice: Présenter les gestes comme des pratiques de deuil interdites à Ézéchiel, sans leur attribuer une signification doctrinale particulière.
  alternative: Les définir précisément comme des prescriptions sacerdotales ou comme des rites exclusivement liés à l’impureté.
  rationale: Le verset énumère des gestes concrets dans le cadre d’une action symbolique prophétique, mais n’explique pas séparément la valeur théologique de chacun.
- issue: Tension entre le gémissement et le silence
  choice: Conserver « Gémis en silence ».
  alternative: Réduire la tension en traduisant seulement « Soupire » ou « Reste silencieux ».
  rationale: La juxtaposition hébraïque הֵאָנֵק דֹּם associe une expression réelle de douleur à une retenue silencieuse ; la traduction ne doit pas éliminer cette tension.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement suit l’adresse directe à Ézéchiel. Les gestes restent concrets, tandis que les notes signalent les ambiguïtés lexicales sans surcharger le texte principal.
