base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: fr
  text: 'Prononce une parabole[a] à la maison rebelle et dis-leur : « Voici ce que dit le Seigneur Yahweh : Pose la marmite, pose-la, et verse-y aussi de l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un proverbe » ou « une parole imagée ». Le mot hébreu peut désigner diverses formes de comparaison ou de langage figuré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: Prononce une parabole
  rationale: Le verbe et le nom apparentés expriment l’action de formuler un mashal. « Prononce une parabole » est naturel en français et convient à l’image développée de la marmite, tout en signalant en note l’autre valeur possible.
- source_word: בֵּית הַמֶּרִי
  choice: la communauté rebelle
  rationale: Dans cette formule prophétique fréquente, בֵּית désigne collectivement le peuple. « Communauté » transmet ce sens en français courant sans donner l’impression d’un bâtiment ou d’une famille particulière.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation distingue אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: Pose la marmite sur le feu, pose-la
  rationale: Le verbe signifie ici installer le récipient pour la cuisson. Le complément « sur le feu », implicite dans la situation, rend l’expression idiomatique, tandis que la répétition de l’impératif hébreu est conservée.
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  choice: et verses-y aussi de l’eau
  rationale: « Verser » correspond directement à יצק; « y » rend la direction vers l’intérieur de la marmite, et « aussi » conserve la valeur additive de גם.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme après אֲדֹנָי. Le rendre par « Yahweh » préserve le nom propre et distingue les deux éléments du titre, sans résoudre autrement une question théologique.
- issue: Identification de בֵּית הַמֶּרִי
  choice: la communauté rebelle
  alternative: la maison rebelle
  rationale: L’expression vise collectivement le peuple auquel s’adresse le prophète. Le rendu choisi communique cette portée sans ajouter ici le nom d’Israël ou de Juda.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition expressive de l’impératif est maintenue; « marmite » est plus courant et précis ici que « chaudron ».
