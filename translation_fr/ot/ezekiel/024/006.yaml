    reason: cultural_note
  revision_rationale: La révision évite l’ajout implicite de « couverte » et remplace « n’est pas parti » par une expression française plus naturelle pour un dépôt adhérent. Elle maintient l’ambiguïté lexicale du terme hébreu, le registre prophétique, le nom divin et le sens distributif de la répétition « morceau par morceau ».
