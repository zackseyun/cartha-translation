revisions:
- from: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Malheur à la ville sanguinaire, à la marmite couverte d’un dépôt impur[a], dont le dépôt impur n’est pas parti ! Retire les morceaux un à un[b], sans tirer au sort.'
  to: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Malheur à la ville sanguinaire, à la marmite où se trouve un dépôt impur[a], et dont ce dépôt impur ne s’est pas détaché ! Retire les morceaux un à un[b], sans tirer au sort.'
  rationale: La révision évite l’ajout implicite de « couverte » et remplace « n’est pas parti » par une expression française plus naturelle pour un dépôt adhérent. Elle maintient l’ambiguïté lexicale du terme hébreu, le registre prophétique, le nom divin et le sens distributif de la répétition « morceau par morceau ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : l’oracle vise la « ville sanguinaire » sous l’image de la marmite, le dépôt souillé/corrosif persiste, puis les morceaux sont retirés successivement sans sélection par le sort. Toutefois, « couvert[e] d’un dépôt » ajoute légèrement l’idée d’un recouvrement complet, tandis que l’hébreu dit plus sobrement que le dépôt est « en elle ».'
  naturalness: 'Le français est globalement soutenu et naturel. « Dont le dépôt impur n’est pas parti » est cependant moins idiomatique et un peu imprécis en français moderne : un dépôt adhérent « ne s’est pas détaché ».'
  terminology: « Le Seigneur Yahweh », « ville sanguinaire » et « marmite » conviennent. « Dépôt impur » conserve utilement l’ambiguïté de חֶלְאָה entre crasse/écume et corrosion. L’explicitation du tirage au sort est justifiée par l’image et est encadrée par la note.
  issues:
  - severity: low
    issue: Image du dépôt et formulation française
    rationale: « Marmite couverte d’un dépôt impur » peut suggérer que tout le récipient est recouvert, ce que le texte ne dit pas explicitement; « n’est pas parti » est moins naturel pour un dépôt adhérent. Une formulation indiquant que le dépôt est dans la marmite et ne s’en est pas détaché rend mieux l’image sans la surinterpréter.
  revised_text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Malheur à la ville sanguinaire, à la marmite où se trouve un dépôt impur[a], et dont ce dépôt impur ne s’est pas détaché ! Retire les morceaux un à un[b], sans tirer au sort.'
