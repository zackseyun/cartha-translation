  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Malheur à la ville sanguinaire, à la marmite où se trouve un dépôt impur[a], et dont ce dépôt impur ne s’est pas détaché ! Retire les morceaux un à un[b], sans tirer au sort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner la crasse, l’écume ou la corrosion qui adhère à la marmite.
    reason: lexical_alternative
  - marker: b
    text: Les morceaux doivent être retirés successivement, sans qu’aucun soit sélectionné par tirage au sort.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire tirée du signe prophétique précédent.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule prophétique consacrée, digne et naturelle en français.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Préserve les deux éléments du titre hébreu et rend explicitement le nom divin.
- source_word: אוֹי
  choice: Malheur à
  rationale: Conserve la force de lamentation et de condamnation de l’interjection prophétique.
- source_word: עִיר הַדָּמִים
  choice: la ville sanguinaire
  rationale: Expression française idiomatique qui communique à la fois les effusions de sang et la culpabilité meurtrière.
- source_word: סִיר
  choice: la marmite
  rationale: Terme concret et courant qui maintient l’image du récipient de cuisson établie dans le contexte.
- source_word: חֶלְאָה
  choice: dépôt impur
  rationale: Le mot désigne une matière souillée ou corrosive adhérant au récipient; ce choix évite de limiter indûment le sens à la rouille.
- source_word: לֹא יָצְאָה מִמֶּנָּה
  choice: n’est pas parti
  rationale: Conserve l’image verbale du dépôt qui ne sort pas du récipient, sans expliciter artificiellement un agent.
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  choice: Retire les morceaux un à un
  rationale: La répétition hébraïque exprime une distribution successive; « un à un » la rend naturellement.
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: sans tirer au sort
  rationale: 'Rend idiomatiquement la scène: aucun morceau ne doit être choisi ou attribué par le sort.'
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה; cette formulation les distingue et préserve le nom d’alliance.
- issue: Portée morale de עִיר הַדָּמִים
  choice: ville sanguinaire
  alternative: ville du sang versé
  rationale: « Sanguinaire » conserve l’accusation de violence meurtrière sans réduire l’expression au seul sang matériel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le ton solennel de l’oracle et l’image concrète de la marmite, tout en rendant idiomatiquement l’ordre final.
