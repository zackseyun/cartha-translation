  yaml_path: translation/ot/ezekiel/024/019.yaml
  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: fr
  text: 'Le peuple me dit : « Ne nous expliqueras-tu pas ce que signifie pour nous ce que tu fais ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלַי הָעָם
  choice: Le peuple me dit
  rationale: Le collectif הָעָם est naturellement rendu au singulier en français ; le passé simple convient à la narration biblique soutenue.
- source_word: הֲלֹא תַגִּיד לָנוּ
  choice: Ne nous expliqueras-tu pas
  rationale: La question avec הֲלֹא attend une réponse affirmative. Dans ce contexte de geste symbolique, נָגַד implique faire connaître ou expliquer, plutôt que simplement raconter.
- source_word: מָה אֵלֶּה לָנוּ
  choice: ce que signifie pour nous
  rationale: 'La tournure hébraïque est elliptique : littéralement, « ce que sont ces choses pour nous ». Le français explicite naturellement l’idée de portée ou de signification sans en préciser davantage la nature.'
- source_word: כִּי אַתָּה עֹשֶׂה
  choice: ce que tu fais
  rationale: כִּי relie ici les « choses » aux actes accomplis par Ézéchiel. Cette formulation française restitue le sens sans imposer une nuance strictement causale.
theological_decisions:
- issue: Portée des actes symboliques du prophète
  choice: « ce que signifie pour nous ce que tu fais »
  alternative: « ce que ces choses ont à voir avec nous, puisque tu les fais »
  rationale: Le texte indique que les gestes concernent le peuple, mais ne précise pas encore leur interprétation. La traduction préserve cette attente sans anticiper l’explication des versets suivants.
translation_notes:
  register: Français moderne, clair et digne. La formulation évite le calque maladroit « ce que sont ces choses pour nous » tout en conservant l’interrogation du peuple sur la portée des actes prophétiques.
