  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: fr
  text: Prends la meilleure bête du troupeau. Entasse aussi les os sous la marmite[a]. Fais-la bien bouillir à gros bouillons[b], et que ses os cuisent aussi dans la marmite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « entasse » est rare, et sa nuance exacte est incertaine. Il peut évoquer le fait de disposer les os en tas sous la marmite.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « fais bouillir ses bouillonnements », une expression intensive qui signifie qu’il faut la faire bouillir vigoureusement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר הַצֹּאן
  choice: les meilleures bêtes du troupeau
  rationale: מִבְחַר désigne ce qui est choisi ou de première qualité. Cette formulation naturelle conserve l’idée d’une sélection des meilleurs animaux du troupeau.
- source_word: לָקֹוחַ
  choice: Prends
  rationale: Dans cette suite d’ordres, la forme verbale a une valeur impérative. « Prends » est direct et idiomatique.
- source_word: וְגַם דּוּר הָעֲצָמִים תַּחְתֶּיהָ
  choice: Entasse aussi les os sous la marmite
  rationale: דּוּר est rare et décrit vraisemblablement l’action de disposer ou d’amasser les os sous le récipient. Le nom « marmite » explicite le référent du pronom en français sans modifier l’image.
- source_word: רַתַּח רְתָחֶיהָ
  choice: Fais-la bouillir, fais-la bouillir à gros bouillons
  rationale: La construction associant le verbe à un nom de même racine intensifie l’ébullition. La répétition française, complétée par « à gros bouillons », en restitue la vigueur.
- source_word: גַּם בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ
  choice: et que ses os aussi cuisent dedans
  rationale: La tournure garde la coordination et la valeur injonctive probable de la séquence, sans introduire un lien de but ou de conséquence absent de l’hébreu. « Ses os » préserve le suffixe possessif du texte.
