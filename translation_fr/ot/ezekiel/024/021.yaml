source:
  edition: WLC
  text: אֱמֹ֣ר לְ/בֵ֣ית יִשְׂרָאֵ֗ל כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מְחַלֵּ֤ל אֶת מִקְדָּשִׁ/י֙ גְּא֣וֹן עֻזְּ/כֶ֔ם מַחְמַ֥ד עֵֽינֵי/כֶ֖ם וּ/מַחְמַ֣ל נַפְשְׁ/כֶ֑ם וּ/בְנֵי/כֶ֧ם וּ/בְנֽוֹתֵי/כֶ֛ם אֲשֶׁ֥ר עֲזַבְתֶּ֖ם בַּ/חֶ֥רֶב יִפֹּֽלוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: fr
  text: 'Dis à la maison d’Israël : « Voici ce que dit le Seigneur Yahweh : Voici, je vais profaner mon sanctuaire, la fierté de votre puissance, le délice de vos yeux et ce que votre âme chérit[a]. Vos fils et vos filles, que vous avez laissés derrière vous, tomberont par l’épée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque rare peut aussi se comprendre ainsi : « ce pour quoi votre âme éprouve de la compassion » ou « ce que votre âme veut épargner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: Dis à la maison d’Israël
  rationale: Conserve l’impératif singulier adressé à Ézéchiel et l’expression collective et covenantale « maison d’Israël ».
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formulation prophétique naturelle en français moderne; « Yahweh » représente explicitement le tétragramme, tandis que « Seigneur » rend אֲדֹנָי.
- source_word: הִנְנִי מְחַלֵּל
  choice: Je vais profaner
  rationale: Rend l’annonce solennelle d’une action imminente; « profaner » conserve la portée cultuelle de חלל au piel.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: Terme exact et suffisamment large pour le lieu saint, ici le temple de Jérusalem.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: l’orgueil de votre force
  rationale: Rendu proche de la chaîne construite hébraïque, qui présente le sanctuaire comme le motif de leur fierté et de leur assurance.
- source_word: מַחְמַד עֵינֵיכֶם
  choice: le délice de vos yeux
  rationale: Expression poétique intelligible qui garde la valeur affective de l’hébreu et son écho à Ézéchiel 24.16.
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: ce que vous chérissez de toute votre âme
  rationale: Le nom rare est lié à l’idée d’épargner ou d’avoir compassion; dans ce parallélisme, il désigne vraisemblablement ce à quoi l’être intérieur est profondément attaché. La note conserve l’autre nuance possible.
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: Maintient la paire explicitement genrée du texte hébreu.
- source_word: אֲשֶׁר עֲזַבְתֶּם
  choice: que vous avez laissés derrière vous
  rationale: Exprime naturellement que ces proches sont restés sur place après le départ ou l’exil des destinataires, sans imposer la nuance plus forte d’« abandonner ».
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: tomberont par l’épée
  rationale: Préserve l’idiome hébreu de la mort violente et le registre prophétique.
theological_decisions:
- issue: Rendu de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Distingue אֲדֹנָי (« Seigneur ») du nom divin יהוה (« Yahweh ») et évite de dissimuler le nom propre sous un titre, sans ajouter d’interprétation confessionnelle.
- issue: Agent de la profanation du sanctuaire
  choice: Je vais profaner mon sanctuaire
  alternative: Je vais laisser profaner mon sanctuaire
  rationale: Le texte attribue grammaticalement l’action à Yahweh lui-même. Le rendu conserve cette tension théologique au lieu de la résoudre en causalité seulement permissive.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique et les images fortes de l’hébreu sont conservées, avec une légère explicitation idiomatique pour מַחְמַל נַפְשְׁכֶם. Le marqueur [a] figure bien dans le texte principal.
