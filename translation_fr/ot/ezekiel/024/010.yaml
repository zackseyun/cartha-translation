  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
translation:
  language: fr
  text: Entasse le bois[a], allume le feu, fais bien cuire la chair, prépare le mélange[b], et que les os soient brûlés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Multiplie les morceaux de bois. »'
    reason: L’hébreu exprime littéralement l’augmentation de la quantité de bois ; « entasse » en donne le sens idiomatique.
  - marker: b
    text: 'Ou : « fais cuire le mélange » ou « prépare le ragoût ». Le sens précis du verbe et du nom hébreux apparentés est incertain.'
    reason: Le verbe et le nom apparentés peuvent désigner la préparation ou la composition d’un mélange ; le contexte culinaire permet plusieurs interprétations sans justifier l’idée précise de « réduire ».
  - marker: c
    text: 'Ou : « calcinés » ou « roussis ».'
    reason: Le verbe hébreu décrit l’effet d’une chaleur intense, mais le degré exact de combustion n’est pas certain.
lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  choice: Entasse le bois
  rationale: Le causatif impératif de רבה demande d’augmenter la quantité de bois. « Entasse » exprime naturellement cette action en français, tandis que le collectif « le bois » convient mieux que le pluriel littéral.
- source_word: הַדְלֵק הָאֵשׁ
  choice: attise le feu
  rationale: Dans cette scène où le bois et le feu sont déjà envisagés, « attise » rend idiomatiquement l’intensification du feu demandée par l’impératif causatif, sans la formulation moins naturelle « fais brûler ».
- source_word: הָתֵם הַבָּשָׂר
  choice: cuis la chair à fond
  rationale: הָתֵם exprime l’achèvement complet de l’action; « à fond » le rend naturellement dans le contexte culinaire. « Chair » conserve la rudesse de בשר et la portée de l’image prophétique.
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: fais réduire la préparation
  rationale: רקח et מֶרְקָחָה évoquent la confection d’un mélange. Dans le contexte de la marmite, « fais réduire la préparation » préserve l’idée d’une préparation travaillée par la cuisson, tout en évitant de préciser indûment qu’il s’agit d’un bouillon ou d’un ragoût.
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: et que les os soient calcinés
  rationale: Le niphal de חרר indique que les os sont brûlés ou desséchés par une chaleur intense. « Calcinés » rend avec force le résultat extrême de cette cuisson.
