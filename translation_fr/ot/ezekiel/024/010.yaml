    issue: « Attise le feu »
    rationale: Le verbe הַדְלֵק est un impératif causatif de דלק, « allumer / embraser ». « Attiser » peut être compatible avec le contexte, mais ajoute l’idée que le feu brûle déjà et qu’il faut l’intensifier.
  - severity: medium
    issue: « Fais réduire la préparation »
    rationale: La réduction est une opération culinaire spécifique non indiquée par le verbe רקח ni par le nom apparenté מֶרְקָחָה. Une traduction plus générale doit préserver l’incertitude lexicale.
  - severity: low
    issue: « Calcinés »
    rationale: Le terme français peut suggérer une combustion ou une transformation très complète. « Brûlés » rend le résultat de la chaleur intense sans préciser au-delà de l’hébreu.
