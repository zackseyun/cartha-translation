  source_fidelity: La suite d’impératifs et l’image culinaire violente sont bien perçues. Toutefois, « attise le feu » suppose un feu déjà allumé et intensifié, tandis que הַדְלֵק demande plus directement de l’allumer / l’embraser. « Fais réduire » introduit l’idée spécifique d’une réduction par évaporation, qui n’est pas exprimée par רקח / מֶרְקָחָה; le texte parle plus largement de préparer ou de composer un mélange.
  naturalness: Le français révisé reste direct, moderne et vigoureux. « Allume le feu » est plus naturel et exact dans cette succession d’ordres; « prépare le mélange » conserve une formulation compréhensible sans imposer une technique culinaire précise.
  terminology: « Chair » conserve la rudesse de בָּשָׂר dans l’image prophétique. « Mélange » rend prudemment מֶרְקָחָה, terme dont la nuance culinaire précise demeure discutée. « Brûlés » est moins interprétatif que « calcinés », qui peut évoquer une combustion complète et un résultat plus précis que ne l’exige יֵחָרוּ.
  issues:
