source:
  edition: WLC
  text: בֶּן אָדָ֗ם כתוב לְ/ךָ֙ אֶת שֵׁ֣ם הַ/יּ֔וֹם אֶת עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה סָמַ֤ךְ מֶֽלֶךְ בָּבֶל֙ אֶל יְר֣וּשָׁלִַ֔ם בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: fr
  text: 'Fils d’homme[a], mets par écrit, pour toi, la date[b], ce jour même[c] : le roi de Babylone a mis le siège devant Jérusalem[d] en ce jour même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils d’homme » ou « fils d’être humain » ; on pourrait aussi traduire ici « mortel » ou « être humain ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le nom du jour », c’est-à-dire sa date.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu insiste sur le jour exact et reprend la même expression à la fin du verset.
    reason: literary_emphasis
  - marker: d
    text: Ou, de manière moins explicite, « s’est avancé contre Jérusalem ». Dans le contexte, le verbe désigne le début du siège babylonien.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse habituelle à Ézéchiel, qui conserve l’image hébraïque et sa portée humaine représentative.
- source_word: כתוב לְךָ
  choice: mets par écrit, pour toi
  rationale: Rend à la fois l’impératif « écris » et la nuance personnelle de לְךָ, tout en restant compréhensible en français courant.
- source_word: אֶת שֵׁם הַיּוֹם
  choice: la date
  rationale: Littéralement « le nom du jour » ; dans ce contexte, l’expression désigne naturellement la date à consigner.
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה / בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour même / en ce jour même
  rationale: L’expression avec עֶצֶם insiste sur l’identité exacte du jour. Sa répétition est maintenue pour préserver l’emphase du texte.
- source_word: סָמַךְ
  choice: a mis le siège devant
  rationale: Dans ce contexte militaire, le verbe décrit l’action du roi de Babylone contre Jérusalem, comprise comme le commencement du siège.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe et usuelle du groupe construit hébreu.
- source_word: אֶל יְרוּשָׁלִַם
  choice: devant Jérusalem
  rationale: Avec « mettre le siège », cette tournure française exprime naturellement le mouvement hostile dirigé vers la ville sans effacer la préposition hébraïque.
theological_decisions:
- issue: Portée de l’appellation בֶּן אָדָם
  choice: Fils d’homme
  alternative: Mortel / être humain
  rationale: La traduction traditionnelle conserve l’idiome biblique sans imposer ici une interprétation christologique étrangère au contexte d’Ézéchiel.
- issue: Valeur militaire de סָמַךְ
  choice: a mis le siège devant Jérusalem
  alternative: s’est avancé contre Jérusalem
  rationale: Le contexte historique favorise le sens de commencement du siège, mais une note conserve la possibilité d’une formulation moins explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la répétition emphatique de « ce jour même » et maintient, par les notes, le sens littéral des expressions hébraïques ainsi que l’amplitude du verbe militaire.
