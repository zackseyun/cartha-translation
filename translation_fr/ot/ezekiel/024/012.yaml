source:
  edition: WLC
  text: תְּאֻנִ֖ים הֶלְאָ֑ת וְ/לֹֽא תֵצֵ֤א מִמֶּ֨/נָּה֙ רַבַּ֣ת חֶלְאָתָ֔/הּ בְּ/אֵ֖שׁ חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/012.yaml
  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: fr
  text: À force d’efforts, elle s’est épuisée, mais son abondante corrosion ne sortira pas d’elle ; sa corrosion, au feu !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּאֻנִים הֶלְאָת
  choice: Elle s’est épuisée en vains efforts
  rationale: Le nom pluriel évoque des efforts pénibles, et le verbe féminin signifie « se fatiguer, s’épuiser ». Dans le contexte, ces efforts n’aboutissent pas ; « vains » explicite sobrement cette valeur contextuelle tout en gardant la personnification féminine de la marmite, qui représente la ville.
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: mais ... ne s’est pas détachée d’elle
  rationale: Le sens littéral est « n’est pas sortie d’elle ». En français, « se détacher d’elle » rend naturellement l’image d’une incrustation qui refuse de quitter la marmite sans réduire le texte à une simple explication.
- source_word: רַבַּת חֶלְאָתָהּ
  choice: l’épaisse couche de corrosion
  rationale: רַבַּת marque ici l’importance ou l’abondance de l’impureté incrustée. « Épaisse couche » donne une image concrète et idiomatique ; « corrosion » conserve le lien avec le récipient métallique sans restreindre indûment le terme à la seule rouille.
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: au feu, sa corrosion !
  rationale: L’hébreu est elliptique et répète « sa corrosion » sans verbe. La formulation française garde cette brusque ellipse et permet à בְּאֵשׁ d’évoquer soit la mise au feu, soit l’action du feu, plutôt que d’ajouter silencieusement un verbe comme « reste ».
theological_decisions:
- issue: La fonction exacte de la proposition finale elliptique
  choice: 'Conserver une exclamation nominale : « au feu, sa corrosion ! »'
  alternative: « sa corrosion reste dans le feu » ou « que sa corrosion soit consumée par le feu »
  rationale: Le texte hébreu ne précise pas verbalement si la corrosion demeure malgré le feu ou si elle doit être livrée au feu. Préserver l’ellipse évite de trancher une ambiguïté réelle qui influe sur l’image du jugement et de la purification.
translation_notes:
  register: Français moderne, courant et digne. Le féminin « elle » maintient la personnification de la marmite et de Jérusalem. L’exclamation finale reproduit autant que possible la formulation abrupte et ambiguë de l’hébreu.
