revisions:
- from: Elle s’est épuisée en vains efforts[a], mais l’épaisse couche de corrosion ne s’est pas détachée d’elle ; au feu, sa corrosion[b] !
  to: À force d’efforts, elle s’est épuisée, mais son abondante corrosion ne sortira pas d’elle ; sa corrosion, au feu !
  rationale: La révision supprime l’ajout « vains », restitue la valeur non accomplie de « ne sortira pas », rend רַבַּת par « abondante » sans concrétisation supplémentaire, et maintient la clausule finale sans verbe afin de ne pas résoudre son ellipse. Le déplacement de « au feu » après le nom améliore la lisibilité française tout en gardant la formulation nominale abrupte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend bien l’image féminine de la marmite et l’idée centrale : malgré les efforts, l’incrustation ne quitte pas le récipient. Toutefois, « vains » ajoute un jugement qui n’est pas exprimé par תְּאֻנִים (« efforts, labeurs »), et le parfait français « ne s’est pas détachée » affaiblit la valeur non accomplie de תֵצֵא (« ne sortira/ne sort pas »). La clausule finale est réellement elliptique ; il convient de la conserver sans lui attribuer dans la note une interprétation verbale déterminée.'
  naturalness: « Au feu, sa corrosion ! » reproduit l’ordre abrupt de l’hébreu, mais demeure très heurté en français. « Sa corrosion, au feu ! » permet de maintenir une ellipse nominale et l’ambiguïté de la clausule tout en étant plus intelligible et idiomatique dans un style prophétique. « Corrosion abondante » reste légèrement technique, mais est recevable dans cette métaphore de récipient et évite de restreindre חֶלְאָה à la seule rouille.
  terminology: « Corrosion » est un choix défendable pour חֶלְאָה, terme qui désigne l’incrustation/impureté du chaudron. « Son abondante corrosion » rend רַבַּת sans introduire l’idée plus spécifique d’une « épaisse couche ».
  issues:
  - severity: medium
    issue: Ajout de « vains »
    rationale: Le substantif hébreu désigne les efforts ou labeurs ; leur échec est suggéré par la suite, mais « vains » l’anticipe et l’explicite dans la première proposition.
  - severity: medium
    issue: Temps de « ne s’est pas détachée »
    rationale: Le yiqtol תֵצֵא présente la non-sortie comme non accomplie/continue ou à venir. « Ne sortira pas » préserve mieux cette valeur que le passé composé.
  - severity: low
    issue: Note b trop interprétative
    rationale: Les deux développements proposés (« reste » et « soit consumée ») ne sont pas également imposés par la forme elliptique. La note devrait signaler l’ellipse sans faire de l’une de ces lectures un contenu traduit.
  revised_text: À force d’efforts, elle s’est épuisée, mais son abondante corrosion ne sortira pas d’elle ; sa corrosion, au feu !
