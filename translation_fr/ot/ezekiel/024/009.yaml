source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה א֖וֹי עִ֣יר הַ/דָּמִ֑ים גַּם אֲנִ֖י אַגְדִּ֥יל הַ/מְּדוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh :


    « Malheur à la ville sanguinaire[a] !


    Moi aussi, j’agrandirai le tas de bois[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ville des sangs », expression désignant une ville marquée par le sang versé ou coupable de meurtres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’agrandirai le bûcher » ; le mot hébreu désigne un amas de combustible destiné au feu.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime clairement le lien logique entre cette sentence et ce qui précède.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule prophétique consacrée, fidèle et naturelle dans un registre biblique français actuel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans les fondre en un seul titre.
- source_word: אוֹי
  choice: Malheur à
  rationale: Conserve la force de lamentation et de condamnation de l’interjection prophétique.
- source_word: עִיר הַדָּמִים
  choice: la ville sanguinaire
  rationale: Rend idiomatiquement l’accusation portée contre une ville caractérisée par les meurtres et la culpabilité liée au sang versé.
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: La dislocation avec le pronom tonique préserve l’insistance du texte hébreu.
- source_word: אַגְדִּיל
  choice: j’augmenterai
  rationale: Rend le hiphil de גדל, « rendre plus grand, accroître », sans préciser davantage la manière d’accroître le combustible.
- source_word: הַמְּדוּרָה
  choice: le tas de bois
  rationale: Dans l’image de la marmite chauffée, désigne vraisemblablement le combustible amassé pour le feu; cette expression reste concrète et évite la connotation principalement funéraire de « bûcher ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom divin; « le Seigneur Yahweh » maintient cette distinction et rend explicitement le tétragramme.
- issue: Portée de גַּם אֲנִי
  choice: Moi aussi, j’augmenterai
  alternative: Même moi, j’augmenterai
  rationale: « Moi aussi » conserve l’emphase et l’idée que Yahweh répond à l’action criminelle de la ville, sans développer implicitement cette relation.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme bref et solennel de l’oracle, tout en employant « tas de bois », immédiatement compréhensible dans l’image contextuelle du feu sous la marmite.
