  naturalness: Le français est globalement naturel et soutenu. «La joie de leur splendeur» est à la fois plus proche du texte et idiomatique dans ce registre. La phrase inachevée et les tirets sont justifiés, la construction se poursuivant au verset suivant.
  terminology: «Fils d’homme», «place forte», «délice de leurs yeux» et «leurs fils et leurs filles» conviennent. Pour מַשָּׂא נַפְשָׁם, «ce vers quoi aspire leur âme» maintient l’orientation désirante sans imposer une analyse lexicale unique; la note conserve l’alternative plus directe.
