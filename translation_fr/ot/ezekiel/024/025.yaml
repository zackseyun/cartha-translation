source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: fr
  text: Quant à toi, fils d’homme, n’est-ce pas que, le jour où je leur enlèverai leur place forte, la joie de leur splendeur, le délice de leurs yeux[a] et ce vers quoi aspire leur âme[b] — leurs fils et leurs filles —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ce qui est précieux à leurs yeux».
    reason: lexical_alternative
  - marker: b
    text: Ou «le désir de leur âme».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule consacrée et formellement fidèle pour l’adresse divine répétée à Ézéchiel; elle préserve sa fonction de titre prophétique.
- source_word: הֲלוֹא
  choice: n’est-ce pas que
  rationale: Conserve la force de la question rhétorique attendant une réponse affirmative, tout en permettant à la proposition temporelle de se poursuivre au verset suivant.
- source_word: בְּיוֹם קַחְתִּי מֵהֶם
  choice: le jour où je leur enlèverai
  rationale: Le parfait hébreu se rapporte ici à l’action future annoncée par Dieu; «enlever» exprime naturellement לקח מן, prendre à quelqu’un.
- source_word: מָעוּזָּם
  choice: leur place forte
  rationale: מָעוֹז désigne ce qui procure force, protection ou refuge. «Place forte» garde ici les dimensions concrète et symbolique, sans expliciter prématurément le temple ou Jérusalem.
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: la joie qui fait leur fierté
  rationale: Cette formulation française naturelle maintient le lien compact entre joie et splendeur/fierté, sans réduire les deux termes à une seule idée.
- source_word: מַחְמַד עֵינֵיהֶם
  choice: le délice de leurs yeux
  rationale: Rend l’expression idiomatique désignant ce qui est précieux, désiré et contemplé avec plaisir.
- source_word: מַשָּׂא נַפְשָׁם
  choice: ce vers quoi tend leur âme
  rationale: La tournure préserve l’image d’une âme portée ou tendue vers ce qu’elle désire. Elle évite de trancher trop fortement entre «désir», «aspiration» et l’idée littérale d’élévation.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: Reproduit les deux catégories explicitement nommées dans l’hébreu plutôt que de les généraliser en «enfants».
theological_decisions:
- issue: Identification de la «place forte» et des biens précieux
  choice: Ne pas identifier explicitement la place forte au temple ou à Jérusalem dans le corps du texte.
  alternative: Paraphraser par «leur sanctuaire» ou «Jérusalem».
  rationale: Le contexte oriente vers le sanctuaire et la ville, mais le verset emploie des expressions figurées plus larges. Les conserver respecte la polyvalence du texte et évite d’insérer une interprétation dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste volontairement suspendue, comme en hébreu, car sa construction se poursuit au verset 26. Les tirets signalent que «leurs fils et leurs filles» précise les réalités chéries qui vont leur être enlevées.
