  text: On that day the fugitive will come to you to make your ears hear[a].
translation:
  language: fr
  text: Ce jour-là, le rescapé viendra vers toi pour que tu entendes la nouvelle de tes propres oreilles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression évoque le fait de « faire entendre aux oreilles ». Elle peut aussi se rendre par « pour porter la nouvelle à tes oreilles » ou « pour t’informer ». Elle souligne que le rapport parviendra directement à Ézéchiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français, qui conserve la référence démonstrative à un jour futur précis.
- source_word: יָבֹוא
  choice: viendra
  rationale: L’imparfait qal a ici une valeur future dans ce contexte prophétique.
- source_word: הַפָּלִיט
  choice: le rescapé
  rationale: Le terme désigne celui qui s’est échappé et a survécu. « Rescapé » convient au survivant qui vient annoncer la chute de Jérusalem, sans suggérer principalement un criminel en fuite comme pourrait le faire « fugitif ».
- source_word: אֵלֶיךָ
  choice: jusqu’à toi
  rationale: Rend naturellement en français le mouvement dirigé vers Ézéchiel, destinataire masculin singulier.
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: pour te faire entendre la nouvelle de tes propres oreilles
  rationale: La formulation conserve l’image auditive et la valeur causative de l’expression hébraïque, tout en explicitant sobrement la nouvelle sous-entendue. « De tes propres oreilles » exprime l’insistance sur l’audition directe.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Rescapé » est préféré à « fugitif » dans ce contexte de survivant venu apporter une nouvelle. La tournure finale maintient l’image concrète des oreilles tout en restant intelligible.
