source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵי/הֶ֑ם דְּבַ֨ר יְהוָ֔ה הָיָ֥ה אֵלַ֖/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/020.yaml
  text: So I said to them[a], “The word of Yahweh came to me, saying,”
translation:
  language: fr
  text: 'Alors je leur dis[a] : « La parole de Yahweh m’est parvenue en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et je leur dis ».'
    reason: Le וַ־ narratif peut être rendu formellement par « Et », bien que « Alors » exprime plus naturellement la progression du récit en français.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors je leur dis
  rationale: Le wayyiqtol poursuit la séquence narrative et introduit la réponse d’Ézéchiel. « Alors » rend cette progression naturellement en français, tandis que le passé simple maintient un registre narratif digne.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: La préposition אֶל avec le suffixe de troisième personne du pluriel désigne les personnes auxquelles Ézéchiel répond.
- source_word: דְּבַר יְהוָה
  choice: La parole de Yahweh
  rationale: « La parole » conserve la formule prophétique et ses liens intertextuels; « Yahweh » représente directement le nom divin יְהוָה.
- source_word: הָיָה אֵלַי
  choice: m’est parvenue
  rationale: Dans cette formule prophétique, le verbe « être » accompagné de אֵלַי exprime idiomatiquement la venue de la parole au prophète. « M’est parvenue » est naturel en français sans ajouter de contenu.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit les paroles qui suivent. « En ces termes » remplit cette fonction de manière idiomatique et annonce clairement la citation divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit; « en ces termes » évite le calque peu naturel « disant » tout en conservant la fonction introductive de לֵאמֹר. Le guillemet reste ouvert puisque le discours se poursuit au verset suivant.
