  text: 'La parole de Yahweh me fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, le verbe indique idiomatiquement que la parole divine parvient au prophète. « Me fut adressée » est naturel en français et exprime clairement cette communication.
- source_word: דְבַר
  choice: La parole
  rationale: דבר désigne ici une communication divine. « La parole » conserve le vocabulaire prophétique traditionnel sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la direction vers Ézéchiel exprimée par אֵלַי.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif לֵאמֹר introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans la lourdeur de « en ces termes ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le nom divin. « Yahweh » en préserve la valeur de nom propre, tandis que « le Seigneur » lui substituerait un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule prophétique hébraïque est conservée dans son sens, tandis que לֵאמֹר est rendu typographiquement par les deux-points, usage naturel avant le discours du verset suivant.
