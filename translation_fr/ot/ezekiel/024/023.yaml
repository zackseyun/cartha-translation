base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: fr
  text: Vos turbans seront sur vos têtes et vos sandales à vos pieds[a]. Vous ne vous lamenterez pas et vous ne pleurerez pas. Vous dépérirez dans vos fautes[b] et vous gémirez chacun auprès de son frère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos coiffures d’apparat »; le terme hébreu désigne une coiffure ornementale, probablement un turban dans ce contexte de deuil.
    reason: lexical_alternative
  - marker: b
    text: « Dans vos fautes » peut aussi se comprendre comme « à cause de vos fautes », « dans votre culpabilité » ou « sous le poids de vos fautes ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « un homme vers son frère ».'
    reason: literal_rendering
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: vos turbans
  rationale: Le nom פְּאֵר désigne ici une coiffure ornementale portée sur la tête. Dans ce contexte de rites funéraires interdits, « turbans » est concret, historiquement approprié et naturel en français.
- source_word: נַעֲלֵיכֶם
  choice: vos sandales
  rationale: נַעַל désigne une chaussure; « sandales » convient au cadre culturel de l’ancien Israël.
- source_word: תִסְפְּדוּ
  choice: vous ne vous lamenterez pas
  rationale: ספד évoque la lamentation funèbre ou les manifestations formelles du deuil; « se lamenter » distingue clairement cet acte du fait de pleurer exprimé ensuite.
- source_word: תִבְכּוּ
  choice: vous ne pleurerez pas
  rationale: Rendu direct de בכה, dans un registre courant et digne.
- source_word: נְמַקֹּתֶם
  choice: vous dépérirez
  rationale: Le verbe מקק exprime le fait de se consumer, se dégrader ou dépérir. « Dépérir » restitue naturellement l’idée d’un lent déclin sous le jugement.
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: dans vos fautes
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Dans vos fautes » conserve la préposition hébraïque et l’ambivalence de l’expression sans imposer une causalité explicite.
- source_word: נְהַמְתֶּם
  choice: vous gémirez
  rationale: נהם désigne un son sourd produit dans la détresse. « Gémir » est idiomatique en français et convient à l’angoisse contenue du contexte.
- source_word: אִישׁ אֶל אָחִיו
  choice: chacun auprès de son frère
  rationale: Cette formulation garde le singulier distributif et le terme masculin de parenté du texte hébreu, tout en restant naturelle en français.
theological_decisions:
- issue: Valeur de עָוֹן dans un contexte de jugement
  choice: dans vos fautes
  alternative: à cause de vos fautes / dans votre culpabilité / sous le poids de vos fautes
  rationale: Le terme peut réunir l’acte fautif, la culpabilité et ses conséquences. Le texte principal préserve la formulation compacte et son ambiguïté; la note signale les autres lectures possibles.
- issue: Expression relationnelle masculine אִישׁ אֶל אָחִיו
  choice: chacun auprès de son frère
  alternative: les uns auprès des autres
  rationale: L’hébreu emploie explicitement « homme » de manière distributive et « son frère ». Le rendu choisi conserve cette forme marquée sans la neutraliser, tandis que « chacun » évite une lourdeur peu naturelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur français rend les formes verbales hébraïques dans leur fonction prophétique contextuelle. La répétition « vous ne… pas » et la distinction entre lamentation rituelle, pleurs et gémissement ont été maintenues.
