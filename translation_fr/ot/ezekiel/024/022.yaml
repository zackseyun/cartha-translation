  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: fr
  text: 'Vous ferez comme j’ai fait : vous ne vous couvrirez pas la lèvre supérieure[a] et vous ne mangerez pas le pain des gens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Se couvrir la lèvre supérieure, ou la moustache, était un geste traditionnel de deuil ou un signe d’impureté.
    reason: cultural_note
  - marker: b
    text: 'Ou peut-être : « le pain des personnes en deuil », c’est-à-dire la nourriture apportée par d’autres pour réconforter ceux qui étaient en deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Vous ferez
  rationale: Le yiqtol précédé du waw poursuit ici l’annonce prophétique et se rend naturellement par le futur en français.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: comme j’ai fait
  rationale: Le passé composé relie naturellement l’acte symbolique déjà accompli par Ézéchiel au comportement futur du peuple.
- source_word: עַל שָׂפָם לֹא תַעְטוּ
  choice: vous ne vous couvrirez pas la moustache
  rationale: שָׂפָם désigne la région de la lèvre supérieure ou de la moustache, et עטה exprime l’action de se couvrir. La tournure pronominale est naturelle en français tout en conservant le geste de deuil évoqué.
- source_word: לֶחֶם אֲנָשִׁים
  choice: le pain des gens
  rationale: Cette traduction maintient l’expression hébraïque volontairement peu explicite, littéralement « pain des gens », sans imposer dans le texte l’interprétation probable d’une nourriture apportée aux personnes en deuil.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: Le futur convient à la valeur prédictive du passage et maintient le parallélisme avec la proposition précédente.
