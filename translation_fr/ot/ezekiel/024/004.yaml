  text: אֱסֹ֤ף נְתָחֶ֨י/הָ֙ אֵלֶ֔י/הָ כָּל נֵ֥תַח ט֖וֹב יָרֵ֣ךְ וְ/כָתֵ֑ף מִבְחַ֥ר עֲצָמִ֖ים מַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/004.yaml
  text: Gather its pieces into it[a], every good piece—the thigh and the shoulder[b]; fill it with choice bones.
translation:
  language: fr
  text: Rassemble-y ses morceaux de viande[a], tous les bons morceaux — la cuisse et l’épaule[b] —, et remplis-la d’os de choix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses morceaux » ; le terme hébreu désigne des portions découpées, notamment des morceaux de viande.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les morceaux de choix » ; ici, « bons » signifie désirables ou sélectionnés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹף
  choice: Rassemble
  rationale: L’impératif exprime l’ordre de réunir et de placer les morceaux dans la marmite; « rassemble » en conserve la force directive.
- source_word: נְתָחֶיהָ
  choice: les morceaux de viande
  rationale: Le nom נתח désigne ici des portions découpées, dans une image de boucherie et de cuisson. L’explicitation « de viande » rend cette image immédiatement claire en français.
- source_word: אֵלֶיהָ
  choice: dedans
  rationale: Le pronom féminin renvoie à la marmite mentionnée dans le contexte. « Dedans » exprime naturellement le mouvement vers l’intérieur tout en évitant une répétition lourde.
- source_word: כָּל נֵתַח טוֹב
  choice: tous les bons morceaux
  rationale: Cette formulation conserve la totalité exprimée par כָּל et la qualification טוֹב sans transformer celle-ci en superlatif.
- source_word: יָרֵךְ וְכָתֵף
  choice: la cuisse et l’épaule
  rationale: Traduction directe et naturelle des deux parties précises de l’animal.
- source_word: מִבְחַר עֲצָמִים
  choice: d’os de choix
  rationale: Le syntagme signifie littéralement une sélection ou un choix d’os. « Os de choix » rend leur qualité sans ajouter le superlatif « les meilleurs ».
- source_word: מַלֵּא
  choice: remplis-la
  rationale: L’impératif est conservé; le pronom féminin renvoie naturellement à la marmite en français.
