id: EZK.24.1
reference: Ezekiel 24:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֩ דְבַר יְהוָ֨ה אֵלַ֜/י בַּ/שָּׁנָ֤ה הַ/תְּשִׁיעִית֙ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י בֶּ/עָשׂ֥וֹר לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée la neuvième année[a], le dixième mois, le dixième jour du mois :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « la neuvième année ». Dans Ézéchiel, les dates sont généralement comptées à partir de l’exil du roi Joïakîn.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: La parole de Yahweh me fut adressée
  rationale: Cette formulation française naturelle rend la formule prophétique hébraïque sans le calque lourd « il arriva que ». « Parole » conserve le poids formel de דָּבָר, et « me fut adressée » exprime clairement la venue de cette parole au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: la neuvième année
  rationale: L’hébreu ne précise pas ici le point de départ du décompte; celui-ci n’est donc pas ajouté au texte principal.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: le dixième mois
  rationale: Dans cette formule de datation, חֹדֶשׁ désigne naturellement le mois.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième jour du mois
  rationale: Cette expression précise le jour à l’intérieur du mois et se rend clairement ainsi en français moderne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Puisque les paroles introduites commencent au verset suivant, les deux-points rendent naturellement en français la fonction introductive de l’infinitif hébreu « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Référent de « la neuvième année »
  choice: Ne pas expliciter dans le texte principal
  alternative: la neuvième année de l’exil du roi Joïakîn
  rationale: Le système de datation du livre permet vraisemblablement cette identification, mais le verset hébreu dit seulement « la neuvième année »; l’explication appartient donc à une note.
translation_notes:
  register: Français moderne, digne et accessible. La formule prophétique est idiomatisée sans perdre sa solennité; les deux-points évitent le tour peu naturel « disant » tout en indiquant que le discours divin suit.
