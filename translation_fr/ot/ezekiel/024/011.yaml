  terminology: « Impureté » convient pour טֻמְאָה et préserve la portée rituelle et morale sans l’expliciter doctrinalement. « Corrosion » est préférable à « rouille » pour חֶלְאָה dans une image liée au bronze, tout en laissant les autres possibilités lexicales dans la note.
