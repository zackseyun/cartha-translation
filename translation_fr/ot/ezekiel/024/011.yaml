  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: fr
  text: Puis pose-la, vide, sur ses braises, afin qu’elle devienne brûlante, que son bronze rougisse, que l’impureté qui est en elle soit fondue et que sa corrosion[a] soit consumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rouille », « crasse » ou « écume ». Le terme hébreu peut désigner l’altération d’un métal et, par extension dans ce contexte, le dépôt répugnant qui représente l’impureté morale de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: Puis pose-la
  rationale: L’impératif causatif de עמד, avec le suffixe féminin renvoyant à la marmite, demande une action directe. « Puis » rend la progression indiquée par le waw dans le contexte.
- source_word: עַל גֶּחָלֶיהָ רֵקָה
  choice: vide sur ses braises
  rationale: « Vide » décrit le récipient après le retrait de son contenu. « Braises » rend concrètement גחלים, tandis que le possessif conserve le suffixe hébreu.
- source_word: לְמַעַן תֵּחַם
  choice: afin qu’elle chauffe
  rationale: 'La proposition exprime le but recherché : porter le récipient à une forte chaleur. La formulation est naturelle et garde l’idée de processus.'
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: que son bronze devienne brûlant
  rationale: חרה évoque ici une chaleur ardente. « Devienne brûlant » convient au métal sans suggérer à tort que le bronze prend littéralement feu.
- source_word: וְנִתְּכָה בְתוֹכָהּ טֻמְאָתָהּ
  choice: que l’impureté qui est en elle fonde
  rationale: נתך porte l’image de la fonte ou de la liquéfaction sous l’effet de la chaleur. « Impureté » maintient les dimensions matérielle, morale et rituelle de טֻמְאָה.
- source_word: תִּתֻּם חֶלְאָתָהּ
  choice: que sa rouille soit consumée
  rationale: תם indique l’achèvement ou la disparition complète. « Rouille » conserve l’image concrète de l’altération du métal, tout en laissant perceptible son emploi figuré.
theological_decisions:
- issue: Préserver à la fois l’image matérielle du récipient et sa portée symbolique sur l’impureté de Jérusalem
  choice: Associer le vocabulaire concret du métal et de la chaleur à « impureté »
  alternative: Remplacer l’ensemble de l’image par des termes abstraits tels que « péché » ou « culpabilité »
  rationale: Le texte présente une action symbolique dont la réalité matérielle porte un jugement moral. La traduction ne doit réduire ni l’image du récipient chauffé ni sa portée prophétique.
- issue: Ambiguïté de חֶלְאָה entre corrosion, rouille, crasse et écume
  choice: Employer « rouille » dans le texte et signaler les autres nuances en note
  alternative: Employer « crasse » ou « écume » directement dans le texte
  rationale: Dans ce verset, la chaleur du bronze favorise une lecture métallurgique, mais le terme peut aussi désigner un dépôt répugnant. La note préserve cette polysémie sans trancher excessivement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe en série reproduit le mouvement final du texte hébreu sans alourdir la phrase; le vocabulaire conserve la tension entre purification matérielle et jugement moral.
