  text: כִּ֤י דָמָ/הּ֙ בְּ/תוֹכָ֣/הּ הָיָ֔ה עַל צְחִ֥יחַ סֶ֖לַע שָׂמָ֑תְ/הוּ לֹ֤א שְׁפָכַ֨תְ/הוּ֙ עַל הָ/אָ֔רֶץ לְ/כַסּ֥וֹת עָלָ֖י/ו עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: fr
  text: Car son sang est au milieu d’elle[a] ; elle l’a placé sur un rocher nu[b]. Elle ne l’a pas répandu sur le sol pour le couvrir de poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa culpabilité pour le sang versé » ; l’hébreu dit littéralement « son sang » et emploie cette image concrète pour évoquer la culpabilité liée à la violence.
    reason: lexical_alternative
  - marker: b
    text: Recouvrir de terre le sang répandu rappelle le devoir de ne pas le laisser exposé ; ici, il reste ouvertement visible sur la roche nue.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’image de jugement qui précède et rend naturellement la valeur causale du terme hébreu.
- source_word: דָמָהּ
  choice: son sang
  rationale: Conserve le sens concret du nom hébreu et l’image centrale du sang exposé, tout en laissant le contexte évoquer la culpabilité liée au sang versé.
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Préserve l’image de Jérusalem personnifiée et la valeur locative de l’expression hébraïque.
- source_word: הָיָה
  choice: est
  rationale: Le parfait a ici une valeur stative dans le discours prophétique ; le présent français exprime clairement cet état actuel et saisissant.
- source_word: עַל צְחִיחַ סֶלַע
  choice: sur un rocher nu
  rationale: Rend l’idée d’une surface rocheuse dénudée et exposée, sur laquelle le sang demeure visible au lieu d’être absorbé.
- source_word: שָׂמָתְהוּ
  choice: elle l’a placé
  rationale: Traduction directe et naturelle du verbe שׂים avec son suffixe objet.
- source_word: לֹא שְׁפָכַתְהוּ
  choice: Elle ne l’a pas répandu
  rationale: Le verbe שׁפך signifie verser ou répandre ; « répandu » convient au sang tout en maintenant l’attention sur l’endroit où il a été laissé.
- source_word: עַל הָאָרֶץ
  choice: sur le sol
  rationale: Dans cette scène concrète, « le sol » rend plus naturellement le lieu physique que « la terre ».
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: pour le couvrir de poussière
  rationale: Suit étroitement l’hébreu et conserve l’image frappante du sang que l’on aurait dû recouvrir.
theological_decisions:
- issue: Interprétation de l’image du sang exposé
  choice: Maintenir dans le texte l’image concrète du sang laissé à découvert, signe d’une culpabilité publique et d’une souillure.
  alternative: Traduire explicitement דָמָהּ par « sa culpabilité pour le sang versé » ou « ses meurtres ».
  rationale: Le texte communique sa portée morale par l’image même. Une traduction concrète préserve à la fois sa force poétique et l’ambiguïté entre le sang versé et la culpabilité qu’il entraîne, sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu sans devenir artificielle ; « son sang » et « un rocher nu » conservent la vigueur de l’image prophétique.
