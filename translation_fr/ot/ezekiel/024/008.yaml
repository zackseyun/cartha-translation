base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: fr
  text: Pour provoquer la fureur, pour exercer la vengeance, j’ai placé son sang[a] sur un rocher nu, afin qu’il ne soit pas recouvert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Son sang » peut aussi désigner ici le sang qu’elle a versé ou la culpabilité qui en résulte ; l’hébreu dit littéralement « son sang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת חֵמָה
  choice: Pour faire monter la fureur
  rationale: 'Le hiphil de עלה conserve ici son sens causatif avec חֵמָה : il s’agit de faire surgir ou monter une colère intense. Cette formulation reste proche de l’image hébraïque tout en étant naturelle en français.'
- source_word: לִנְקֹם נָקָם
  choice: pour exercer la vengeance
  rationale: L’infinitif suivi d’un nom de même racine renforce l’idée de vengeance. « Exercer la vengeance » exprime cette action judiciaire avec dignité, sans paraphrase confessionnelle.
- source_word: נָתַתִּי
  choice: j’ai placé
  rationale: Avec le complément de lieu « sur la roche nue », נתן signifie mettre ou placer plutôt que simplement donner.
- source_word: דָּמָהּ
  choice: son sang
  rationale: Le singulier concret de l’hébreu est conservé. Dans le contexte, il peut évoquer le sang versé ou la culpabilité liée au sang, mais l’image littérale demeure première.
- source_word: צְחִיחַ סָלַע
  choice: la roche nue
  rationale: L’expression désigne une surface rocheuse découverte, où le sang reste exposé au lieu d’être absorbé ou dissimulé.
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: afin qu’il ne soit pas recouvert
  rationale: 'La construction marque le but : le sang est délibérément laissé visible. Le pronom renvoie naturellement à « sang ».'
theological_decisions:
- issue: L’action et la finalité judiciaires de l’exposition du sang
  choice: Le locuteur déclare avoir intentionnellement exposé le sang afin de faire monter la fureur et d’exercer la vengeance.
  alternative: Comprendre le verset comme une simple description du sang laissé à découvert, en atténuant l’intention du locuteur.
  rationale: La première personne נָתַתִּי et les infinitifs exprimant le but indiquent une action délibérée. La traduction maintient cette tension judiciaire sans préciser davantage l’identité ou la nature de la fureur au-delà du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition étymologique hébraïque de לִנְקֹם נָקָם n’est pas reproduite littéralement, car « venger une vengeance » serait peu naturel ; sa force est rendue par « exercer la vengeance ». Le parallélisme des deux propositions finales est conservé.
