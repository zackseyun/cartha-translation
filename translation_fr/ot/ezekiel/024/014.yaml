  to: Moi, Yahvé, j’ai parlé. Cela va arriver[a], et je le ferai. Je ne reculerai pas[b], je n’épargnerai pas et je ne me raviserai pas[c]. Selon tes voies et selon tes actes, ils te jugeront[d] — déclaration du Seigneur Yahvé.
