  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: fr
  text: Moi, Yahvé, j’ai parlé. Cela va arriver[a], et je le ferai. Je ne reculerai pas[b], je n’épargnerai pas et je ne me raviserai pas[c]. Selon tes voies et selon tes actes, ils te jugeront[d] — déclaration du Seigneur Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cela est arrivé » / « cela vient ». Le sujet du verbe n’est pas exprimé en hébreu.'
    reason: ambiguïté du temps verbal et du sujet implicite
  - marker: b
    text: 'Ou : « je ne me retirerai pas » / « je ne renoncerai pas ».'
    reason: alternative lexicale
  - marker: c
    text: 'Ou : « je ne changerai pas d’avis ».'
    reason: alternative lexicale
  - marker: d
    text: 'L’hébreu dit littéralement : « ils te jugeront » ; ceux qui exécutent le jugement ne sont pas nommés.'
    reason: préservation du pluriel indéterminé
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin en suivant sa forme française courante, plutôt que de lui substituer le titre « le Seigneur ».
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le parfait présente la parole divine comme prononcée et désormais en voie d’accomplissement.
- source_word: בָּאָה
  choice: cela arrive
  rationale: Le verbe féminin a un sujet implicite, vraisemblablement le jugement ou la catastrophe annoncée. « Cela arrive » reste naturel sans préciser ce que l’hébreu laisse sous-entendu.
- source_word: וְעָשִׂיתִי
  choice: et j’agirai
  rationale: Dans cette suite prophétique, le parfait coordonné exprime l’action certaine et imminente de Yahvé.
- source_word: אֶפְרַע
  choice: je ne reculerai pas
  rationale: Le verbe évoque ici le fait de se retirer ou de renoncer à exécuter le jugement annoncé.
- source_word: אָחוּס
  choice: je n’épargnerai pas
  rationale: Dans un contexte de jugement, le verbe signifie ne pas retenir le châtiment par pitié.
- source_word: אֶנָּחֵם
  choice: je ne me raviserai pas
  rationale: Cette formulation exprime l’absence de revirement concernant le jugement annoncé, tout en conservant la tension propre au verbe hébreu.
- source_word: כִּדְרָכַיִךְ
  choice: selon ta conduite
  rationale: Le sens éthique de « tes voies » est rendu en français courant par « ta conduite ».
- source_word: וְכַעֲלִילוֹתַיִךְ
  choice: selon tes actes
  rationale: Le terme désigne les actions accomplies, ici considérées sous l’angle moral et judiciaire.
- source_word: שְׁפָטוּךְ
  choice: on te jugera
  rationale: Le sujet pluriel reste indéterminé en hébreu. Le pronom français « on » transmet naturellement cette indétermination, signalée en note.
- source_word: אֲדֹנָי יְהֹוִה
  choice: le Seigneur Yahvé
  rationale: Distingue le titre אֲדֹנָי du nom personnel יְהוָה sans remplacer ce dernier par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: Jéhovah
  rationale: « Yahvé » est la transcription française courante du tétragramme et préserve le caractère personnel du nom divin.
- issue: Sens du verbe divin נָחַם
  choice: je ne me raviserai pas
  alternative: je ne changerai pas d’avis
  rationale: « Se raviser » exprime un changement de décision sans faire disparaître la tension théologique du verbe ni introduire explicitement l’idée de repentance morale.
- issue: Sujet non exprimé de שְׁפָטוּךְ
  choice: on te jugera
  alternative: ils te jugeront
  rationale: L’hébreu emploie un pluriel indéterminé. Le français idiomatique emploie volontiers « on », tandis qu’une note conserve l’information grammaticale du pluriel.
translation_notes:
  register: Français international moderne, solennel et direct. Le tutoiement féminin singulier de l’hébreu est conservé, l’interlocutrice étant la ville personnifiée. Les propositions brèves maintiennent le rythme catégorique de l’oracle.
