revisions:
- from: Ton impureté est marquée par l’infamie. Parce que je t’ai purifiée, mais que tu n’es pas devenue pure[a] de ton impureté, tu ne seras plus purifiée jusqu’à ce que j’aie assouvi ma fureur contre toi[b].
  to: Dans ton impureté, il y a de la débauche. Parce que je t’ai purifiée[a], mais que tu n’as pas été purifiée de ton impureté, tu ne seras plus purifiée jusqu’à ce que j’aie assouvi ma fureur contre toi[b].
  rationale: La révision remplace un rendu trop général de זִמָּה et corrige le temps et la voix de la seconde mention de purification. Elle maintient la tension textuelle entre l’action divine exprimée au parfait et le résultat nié, sans imposer la lecture conative ; celle-ci demeure signalée en note. L’idiome relatif à la fureur est conservé avec sa note explicative.
