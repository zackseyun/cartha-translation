  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: fr
  text: Dans ton impureté, il y a de la débauche. Parce que je t’ai purifiée[a], mais que tu n’as pas été purifiée de ton impureté, tu ne seras plus purifiée jusqu’à ce que j’aie assouvi ma fureur contre toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Bien que je t’aie purifiée » ou, selon une interprétation du contexte, « Parce que j’ai cherché à te purifier ». L’hébreu dit formellement : « Parce que je t’ai purifiée », tout en niant aussitôt le résultat.'
    reason: ambiguïté discursive
  - marker: b
    text: 'Littéralement : « jusqu’à ce que j’aie fait reposer ma fureur sur toi », expression qui évoque une fureur pleinement exercée et ainsi menée à son terme.'
    reason: idiome hébreu
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: Ton impureté est marquée par
  rationale: Cette formulation rend la construction ב + nom tout en donnant en français une phrase naturelle. « Impureté » conserve le chevauchement moral et rituel du terme dans Ézéchiel.
- source_word: זִמָּה
  choice: l’infamie
  rationale: Dans Ézéchiel, le mot désigne une conduite honteuse, souvent avec une dimension sexuelle. « Infamie » garde la gravité de l’accusation sans la réduire à la seule immoralité sexuelle.
- source_word: יַעַן
  choice: Parce que
  rationale: Le terme introduit explicitement le motif du jugement.
- source_word: טִהַרְתִּיךְ
  choice: je t’ai purifiée
  rationale: Le parfait factitif est rendu au plus près, sans transformer silencieusement l’action en simple tentative. La tension avec la proposition suivante est conservée et signalée en note.
- source_word: וְלֹא טָהַרְתְּ
  choice: mais que tu n’es pas devenue pure
  rationale: Le français distingue ainsi l’action divine exprimée par le factitif du résultat qui ne s’est pas produit chez Jérusalem.
- source_word: מִטֻּמְאָתֵךְ
  choice: de ton impureté
  rationale: La préposition marque l’éloignement ou la délivrance hors de l’état d’impureté; la répétition maintient la cohérence lexicale.
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: tu ne seras plus purifiée
  rationale: Le passif futur exprime la cessation annoncée de toute purification.
- source_word: עַד הֲנִיחִי
  choice: jusqu’à ce que j’aie assouvi
  rationale: Le hifil de נוח appliqué à la fureur évoque celle-ci amenée au repos après avoir été pleinement exercée.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: « Fureur » restitue l’intensité du terme dans ce contexte de jugement prophétique.
- source_word: בָּךְ
  choice: contre toi
  rationale: La préposition indique ici la personne visée par la fureur; « contre toi » est idiomatique en français.
theological_decisions:
- issue: L’action de purifier est-elle accomplie ou seulement entreprise ?
  choice: je t’ai purifiée
  alternative: j’ai cherché à te purifier / j’ai voulu te purifier
  rationale: La forme hébraïque énonce directement « je t’ai purifiée », tandis que la suite nie l’obtention du résultat. Le texte principal préserve cette tension plutôt que d’y introduire sans indication une tentative ou une offre; la note fournit l’interprétation conative possible.
- issue: Comment exprimer l’accomplissement de la fureur divine ?
  choice: jusqu’à ce que j’aie assouvi ma fureur contre toi
  alternative: jusqu’à ce que j’aie fait reposer ma fureur sur toi
  rationale: La traduction principale communique l’idée idiomatique d’une fureur menée à son terme. La note conserve l’image hébraïque littérale sans lui donner un sens sacrificiel technique.
translation_notes:
  register: Français international moderne, digne et accessible. Jérusalem étant personnifiée au féminin, les formes « purifiée » et « pure » sont féminines. La répétition de « impureté » et de « purifiée » reflète délibérément la reprise lexicale insistante de l’hébreu.
