  text: וָ/אֲדַבֵּ֤ר אֶל הָ/עָם֙ בַּ/בֹּ֔קֶר וַ/תָּ֥מָת אִשְׁתִּ֖/י בָּ/עָ֑רֶב וָ/אַ֥עַשׂ בַּ/בֹּ֖קֶר כַּ/אֲשֶׁ֥ר צֻוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: fr
  text: Le matin, je parlai au peuple; le soir, ma femme mourut. Le lendemain matin, je fis ce qui m’avait été ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Je parlai donc
  rationale: Le verbe relié par waw fait progresser le récit. « donc » rend ici l’enchaînement logique et narratif sans reproduire mécaniquement « et ».
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: עָם désigne collectivement le peuple; avec אֶל, « au peuple » est la formulation française naturelle.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Le syntagme temporel indique le moment de la prise de parole, puis celui de l’obéissance; sa répétition est conservée.
- source_word: וַתָּמָת
  choice: mourut
  rationale: מות est le verbe ordinaire signifiant « mourir »; la traduction directe ne cherche pas à l’atténuer.
- source_word: אִשְׁתִּי
  choice: ma femme
  rationale: Dans ce contexte conjugal, אִשָּׁה avec le suffixe de première personne signifie clairement « ma femme ».
- source_word: בָּעָרֶב
  choice: le soir
  rationale: Cette indication temporelle, parallèle à « le matin », situe clairement le décès.
- source_word: וָאַעַשׂ
  choice: Puis […] je fis
  rationale: Le verbe עשה exprime l’accomplissement de l’action commandée. « Puis » marque la progression narrative, tandis que « je fis » préserve la généralité de l’objet.
- source_word: כַּאֲשֶׁר
  choice: ce qui
  rationale: Dans la tournure française « faire ce qui a été ordonné », cette formulation exprime naturellement la conformité à l’ordre, sans en préciser davantage le contenu.
- source_word: צֻוֵּיתִי
  choice: m’avait été ordonné
  rationale: La forme passive présente Ézéchiel comme destinataire d’un ordre; le plus-que-parfait indique que cet ordre précédait son exécution.
