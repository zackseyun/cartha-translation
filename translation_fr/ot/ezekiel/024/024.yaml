source:
  edition: WLC
  text: וְ/הָיָ֨ה יְחֶזְקֵ֤אל לָ/כֶם֙ לְ/מוֹפֵ֔ת כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה תַּעֲשׂ֑וּ בְּ/בֹאָ֕/הּ וִֽ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: fr
  text: 'Ézéchiel sera pour vous un signe : vous ferez tout ce qu’il a fait. Quand cela arrivera, vous saurez que je suis le Seigneur DIEU.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹפֵת
  choice: signe
  rationale: Rend naturellement le signe visible et porteur de sens que constitue la conduite d’Ézéchiel.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: exactement ce qu’il a fait
  rationale: Exprime avec naturel la totalité et la conformité indiquées par כְּכֹל.
- source_word: בְּבֹאָהּ
  choice: Quand cela arrivera
  rationale: Le suffixe féminin renvoie vraisemblablement à la réalité annoncée dans le contexte; «cela» préserve en français l’absence de référent explicite dans ce verset.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Distingue les deux éléments du titre divin traditionnellement rendus en français par «Seigneur» et «Éternel».
theological_decisions:
- issue: Nature du signe prophétique
  choice: Ézéchiel lui-même «sera pour vous un signe»
  alternative: Ézéchiel servira seulement d’exemple
  rationale: Le texte identifie directement le prophète comme מוֹפֵת, sans réduire sa fonction à un simple exemple moral.
- issue: Référent de בְּבֹאָהּ
  choice: «cela», sans préciser davantage
  alternative: «la catastrophe» ou «la nouvelle»
  rationale: Le référent est contextuellement accessible mais non nommé dans le verset; la traduction conserve cette relative ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale hébraïque est omise pour une ouverture française naturelle; les deux propositions sont reliées par deux-points afin de montrer que les actes à reproduire explicitent le signe.
