source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: fr
  text: Ce jour-là, ta bouche s’ouvrira à l’arrivée du rescapé[a] ; tu parleras et tu ne seras plus muet. Tu seras pour eux un signe, et ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec le rescapé ». La construction hébraïque est difficile et peut désigner le moment où le rescapé arrive avec la nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle prophétique courante, rendue dans un français naturel et direct.
- source_word: יִפָּתַח פִּיךָ
  choice: ta bouche s’ouvrira
  rationale: Conserve l’image hébraïque et le lien avec la fin du mutisme imposé à Ézéchiel, tout en restant idiomatique en français.
- source_word: אֶת הַפָּלִיט
  choice: à l’arrivée du rescapé
  rationale: La construction avec אֶת est difficile. Le contexte de 24.26 et 33.21-22 indique vraisemblablement le moment où l’échappé arrive avec la nouvelle. « Rescapé » exprime naturellement celui qui a échappé au désastre.
- source_word: וּתְדַבֵּר
  choice: tu parleras
  rationale: Rend simplement la reprise effective de la parole.
- source_word: וְלֹא תֵאָלֵם עוֹד
  choice: tu ne seras plus muet
  rationale: Le verbe désigne ici le fait d’être muet, et non une simple décision de garder le silence.
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: Tu seras pour eux un signe
  rationale: « Signe » restitue clairement מוֹפֵת dans le cadre des actes symboliques d’Ézéchiel, sans imposer la nuance plus étroite de « prodige » ou de « présage ».
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: ils sauront que je suis Yahweh
  rationale: Préserve la formule de reconnaissance récurrente d’Ézéchiel et rend le tétragramme comme nom divin personnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Nature de la reprise de parole d’Ézéchiel
  choice: Fin réelle de son mutisme prophétique, liée à l’arrivée du rescapé
  alternative: Simple fin d’une période de silence ou habilitation purement métaphorique à parler
  rationale: Le verset achève le signe annoncé du mutisme d’Ézéchiel et rattache sa fin à l’arrivée de celui qui apporte la nouvelle, sans préciser davantage le mécanisme.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’image de la bouche qui s’ouvre, évite un archaïsme tel que « en ce jour-là » et signale en note l’ambiguïté syntaxique réelle de l’hébreu.
