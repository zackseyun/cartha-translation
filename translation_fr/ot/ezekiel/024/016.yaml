  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: fr
  text: Fils d’homme, voici que je vais t’enlever ce qui fait les délices de tes yeux[a], par une atteinte soudaine[b]. Pourtant, tu ne porteras pas le deuil, tu ne pleureras pas, et tes larmes ne viendront pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le délice de tes yeux ». Dans le contexte, cette expression désigne la femme d’Ézéchiel, ce qu’il a de plus précieux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par un coup » ou « par un fléau ». Le mot hébreu peut désigner un coup frappant ou un fléau.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ta larme ne viendra pas ».'
    reason: literal_rendering
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse constante à Ézéchiel. Cette traduction consacrée préserve l’image et la forme masculine singulière de l’hébreu.
- source_word: הִנְנִי לֹקֵחַ
  choice: voici que je vais t’enlever
  rationale: הִנְנִי attire solennellement l’attention, et le participe לֹקֵחַ présente une action imminente. « Je vais t’enlever » est naturel en français tout en gardant cette imminence.
- source_word: מַחְמַד עֵינֶיךָ
  choice: ce qui fait la joie de tes yeux
  rationale: La formulation conserve l’image hébraïque tout en étant compréhensible en français. Dans le contexte, elle désigne la personne la plus précieuse à Ézéchiel, sa femme, sans l’expliciter dans le corps du verset.
- source_word: בְּמַגֵּפָה
  choice: par un coup
  rationale: מַגֵּפָה peut désigner un coup frappant, un fléau ou une atteinte mortelle. « Par un coup » maintient l’indétermination de la cause sans imposer l’idée précise de maladie.
- source_word: תִסְפֹּד
  choice: tu ne porteras pas le deuil
  rationale: Le verbe peut viser les manifestations formelles et sociales du deuil. Cette expression française les évoque plus précisément que le simple verbe « t’attrister ».
- source_word: תִבְכֶּה
  choice: tu ne pleureras pas
  rationale: Cette traduction distingue clairement les pleurs personnels des rites de deuil exprimés par תִסְפֹּד.
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: et tes larmes ne viendront pas
  rationale: La formulation garde l’image littérale et inhabituelle de l’hébreu, où « ta larme » est le sujet du verbe « venir », sans la lisser en « tu ne verseras pas de larmes ».
theological_decisions:
- issue: Faut-il préciser dans le verset que « ce qui fait la joie de tes yeux » est la femme d’Ézéchiel ?
  choice: Conserver l’expression imagée sans nommer sa femme dans le texte principal.
  alternative: « ta femme bien-aimée » ou « ce qui fait la joie de tes yeux, ta femme »
  rationale: Le contexte immédiat permet d’identifier la personne visée, mais ce verset emploie délibérément une périphrase. La conserver évite d’ajouter au texte tout en maintenant sa force affective.
- issue: Nature exacte de מַגֵּפָה
  choice: « par un coup »
  alternative: « par un fléau » ou « par une atteinte mortelle »
  rationale: Le terme peut évoquer un coup, un fléau ou une affection frappant la personne. Le français ne doit pas décider sans preuve qu’il s’agit d’une épidémie, d’une maladie précise ou d’un accident vasculaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine au prophète. La syntaxe conserve la gravité prophétique ainsi que l’image inhabituelle de la dernière proposition.
