  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: fr
  text: Sur la haute montagne d’Israël, je le planterai[a], et il produira des branches, portera du fruit et deviendra un cèdre majestueux. Sous lui habiteront tout oiseau, de toute espèce[b] ; ils habiteront à l’ombre de ses rameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je le transplanterai ». Le verbe hébreu peut désigner la mise en terre d’une pousse dans un nouvel endroit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout oiseau, toute aile », expression poétique désignant les oiseaux de toute espèce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  choice: Sur la haute montagne d’Israël
  rationale: מְרוֹם exprime la hauteur ou l’élévation. Cette formulation française conserve l’image géographique et exaltée tout en restant naturelle.
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: je le planterai
  rationale: Le verbe שתל signifie planter ou mettre en terre. « Planter » exprime directement l’établissement de la pousse ; « transplanter » demeure possible selon le contexte.
- source_word: וְנָשָׂא עָנָף
  choice: Il produira des branches
  rationale: Littéralement, l’arbre « portera une branche ». Le singulier peut avoir une valeur collective ; le pluriel français rend naturellement la croissance de l’arbre.
- source_word: וְעָשָׂה פֶרִי
  choice: portera du fruit
  rationale: Expression française courante correspondant à la collocation hébraïque « faire/produire du fruit » et conservant sa portée imagée.
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: deviendra un cèdre majestueux
  rationale: אַדִּיר peut évoquer la puissance, la noblesse et la majesté. « Majestueux » convient à l’image élevée du cèdre.
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: Sous lui habiteront
  rationale: שׁכן signifie habiter ou demeurer. L’inversion est naturelle dans ce contexte poétique et garde un registre digne.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: tous les oiseaux, quelle que soit leur espèce
  rationale: La tournure hébraïque est littéralement « tout oiseau, toute aile ». La formulation retenue communique en français moderne l’idée d’oiseaux de toute sorte sans obscurité.
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: à l’ombre de ses grandes branches
  rationale: דָּלִיּוֹת désigne les rameaux étendus ou les grosses branches d’un arbre. « Grandes branches » est clair en français courant et distingue ce terme du premier עָנָף.
- source_word: תִּשְׁכֹּנָּה
  choice: ils habiteront
  rationale: La forme s’accorde avec le sujet collectif désignant les oiseaux. Le pluriel français rend clairement la valeur distributive.
theological_decisions:
- issue: Portée symbolique des oiseaux
  choice: Conserver l’image générale de toutes les espèces d’oiseaux sans identifier explicitement les oiseaux à des nations ou à des peuples.
  alternative: Interpréter directement les oiseaux comme les nations abritées sous le royaume restauré.
  rationale: Le contexte plus large peut inviter à cette interprétation, mais le verset présente ici l’image sans en donner explicitement l’explication. La traduction préserve donc la métaphore et sa tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le mouvement poétique de l’hébreu sans reproduire des tours qui seraient opaques en français. Les répétitions structurantes de « habiteront » sont conservées.
