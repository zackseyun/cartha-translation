  to: Sur la haute montagne d’Israël, je le planterai[a], et il produira des branches, portera du fruit et deviendra un cèdre majestueux. Sous lui habiteront tout oiseau, de toute espèce[b] ; ils habiteront à l’ombre de ses rameaux.
