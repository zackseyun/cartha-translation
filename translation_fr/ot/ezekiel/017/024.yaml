  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: fr
  text: 'Alors tous les arbres de la campagne sauront que je suis Yahweh : j’ai abaissé l’arbre haut et élevé l’arbre bas ; j’ai desséché l’arbre plein de sève[a] et fait fleurir l’arbre sec[b]. Moi, Yahweh, j’ai parlé et je l’ai fait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arbre vert », « l’arbre frais » ou « l’arbre humide ». Le mot hébreu évoque littéralement la fraîcheur ou l’humidité.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai fait germer l’arbre sec » ou « j’ai fait bourgeonner l’arbre sec ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors … sauront
  rationale: Le parfait avec waw exprime ici le résultat futur et certain de l’action annoncée. « Sauront » est naturel en français prophétique, et « alors » fait ressortir la conséquence.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: tous les arbres des champs
  rationale: Cette formulation conserve l’image végétale et sa portée symbolique sans identifier explicitement les arbres aux rois ou aux nations.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, plutôt que substitution par un titre.
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: j’ai abaissé l’arbre élevé
  rationale: « Abaissé » rend la valeur causative du verbe et forme une antithèse nette avec « élevé ». L’adjectif « élevé » préserve à la fois l’image physique et sa possible portée politique.
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: élevé l’arbre abaissé
  rationale: Le verbe causatif est rendu par « élevé ». « Abaissé » maintient le parallélisme de renversement sans imposer la nuance morale que pourrait suggérer « humble ».
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: j’ai desséché l’arbre plein de sève
  rationale: « Desséché » rend directement l’action causative. לָח désigne ce qui est humide, frais ou vigoureux ; appliqué à un arbre, « plein de sève » communique naturellement cette vitalité en français.
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: fait fleurir l’arbre sec
  rationale: La forme causative de פרח signifie faire germer, bourgeonner ou fleurir. « Fait fleurir » exprime clairement le retour à la vie tout en gardant l’image.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: j’ai parlé et j’ai agi
  rationale: Les deux parfaits sont conservés. « Agi » évite d’ajouter un objet absent du texte et souligne l’efficacité de la parole divine.
theological_decisions:
- issue: Portée métaphorique des arbres
  choice: Conserver l’image des arbres sans en expliciter les référents dans le verset.
  alternative: Traduire ou gloser les arbres comme des rois, des dirigeants ou des nations.
  rationale: Le contexte suggère des réalités politiques, mais le texte hébreu maintient ici la métaphore. L’expliciter dans le corps du verset réduirait sa portée et résoudrait une tension que le texte conserve.
- issue: Valeur temporelle des déclarations divines au parfait
  choice: 'Employer le passé composé : « j’ai abaissé… j’ai élevé… j’ai parlé et j’ai agi ».'
  alternative: Employer le futur ou le présent d’accomplissement.
  rationale: Les parfaits hébreux présentent les actes de Yahweh comme certains ou accomplis. Le passé composé français préserve cette forme solennelle sans transformer toutes les propositions en prédictions explicites.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ou Yahvé
  rationale: Le texte porte le nom propre divin. Sa transcription conserve cette distinction au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est resserré pour rendre le rythme des quatre renversements. Les marqueurs de notes ont été placés sur les expressions qu’ils expliquent, conformément à l’hébreu.
