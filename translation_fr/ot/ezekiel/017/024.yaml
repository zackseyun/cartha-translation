- from: 'Alors tous les arbres des champs sauront que je suis Yahweh : j’ai abaissé l’arbre élevé et élevé l’arbre abaissé ; j’ai desséché l’arbre plein de sève[a] et fait fleurir l’arbre sec[b]. Moi, Yahweh, j’ai parlé et j’ai agi.'
  to: 'Alors tous les arbres de la campagne sauront que je suis Yahweh : j’ai abaissé l’arbre haut et élevé l’arbre bas ; j’ai desséché l’arbre plein de sève[a] et fait fleurir l’arbre sec[b]. Moi, Yahweh, j’ai parlé et je l’ai fait.'
