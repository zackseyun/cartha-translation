base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: fr
  text: La semence germa et devint une vigne étalée[a], de faible hauteur, afin que ses rameaux se tournent vers lui et que ses racines soient sous lui[c]. Elle devint alors une vigne[b], produisit des rameaux et étendit ses branches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vigne luxuriante » ou « une vigne aux branches étendues ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu répète « devint une vigne » ; cette répétition est conservée pour respecter l’insistance et la progression du texte.
    reason: lexical_alternative
  - marker: c
    text: Les pronoms « lui » renvoient probablement au grand aigle de l’allégorie (voir Ézékiel 17.3-4), bien qu’on puisse les rendre de façon plus impersonnelle.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּצְמַח
  choice: Il poussa
  rationale: Le verbe צמח décrit ici la croissance initiale de ce qui a été planté. « Poussa » est naturel et conserve l’image végétale.
- source_word: וַיְהִי לְגֶפֶן
  choice: devint une vigne
  rationale: La construction indique un résultat ou une transformation, plutôt qu’une simple comparaison.
- source_word: סֹרַחַת
  choice: étalée
  rationale: Le participe évoque une vigne qui s’étend latéralement. « Étalée » rend cette extension sans introduire nécessairement l’idée d’une végétation luxuriante.
- source_word: שִׁפְלַת קוֹמָה
  choice: de faible hauteur
  rationale: Cette formulation rend directement l’expression littérale « basse de taille/hauteur » dans un français clair.
- source_word: לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו
  choice: Ses branches se tournaient vers lui
  rationale: La construction à l’infinitif exprime l’orientation résultante ou voulue des branches vers l’aigle. La formulation française préserve cette dépendance directionnelle.
- source_word: וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ
  choice: tandis que ses racines restaient sous lui
  rationale: L’imparfait et « restaient » rendent la position durable exprimée par יִהְיוּ, tandis que « sous lui » conserve le suffixe masculin singulier.
- source_word: וַתְּהִי לְגֶפֶן
  choice: Elle devint donc une vigne
  rationale: La répétition de « devint une vigne » est maintenue, car elle appartient à la progression emphatique de l’hébreu.
- source_word: וַתַּעַשׂ בַּדִּים
  choice: produisit des rameaux
  rationale: בַּדִּים désigne des branches ou rameaux. « Rameaux » permet de le distinguer du terme final tout en restant naturel dans l’image végétale.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  choice: étendit ses branches
  rationale: שׁלח exprime l’action d’envoyer ou de déployer, et פֹּארוֹת désigne des branchages. « Étendit ses branches » traduit naturellement la croissance vers l’extérieur sans les réduire à de jeunes pousses.
- source_word: אֵלָיו / תַּחְתָּיו
  choice: lui
  rationale: Les suffixes hébreux sont masculins singuliers. Dans l’allégorie, leur antécédent saillant est le grand aigle; « lui » conserve cette personnification et l’ambiguïté référentielle est signalée en note.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans l’allégorie de la vigne
  choice: Les rendre par « lui », avec pour référent probable le grand aigle.
  alternative: Employer un pronom impersonnel renvoyant plus généralement à l’aigle comme image ou au lieu de plantation.
  rationale: L’hébreu emploie des suffixes masculins singuliers, et le grand aigle est l’antécédent littéraire le plus saillant. « Lui » préserve la personnification et la dépendance politique suggérée par l’allégorie sans identifier davantage le personnage dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif et la répétition de l’hébreu sont conservés. Les termes végétaux « rameaux » et « branches » rendent la variation lexicale de l’original sans archaïsme marqué.
