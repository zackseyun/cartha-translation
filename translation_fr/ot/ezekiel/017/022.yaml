- from: 'Ainsi parle le Seigneur Yahweh : « Moi-même, je prendrai quelque chose à la cime du cèdre majestueux et je le placerai[a]. À l’extrémité de ses jeunes pousses, j’en cueillerai une qui est tendre[b] ; moi-même, je la planterai sur une montagne haute et élevée. »'
  to: 'Ainsi parle le Seigneur Yahweh : « Moi-même, je prendrai à la cime du cèdre élevé et je le placerai[a]. À l’extrémité de ses jeunes pousses, je cueillerai un tendre rejet[b] ; moi-même, je le planterai sur une montagne haute et imposante. »'
  rationale: La révision rend plus directement les termes de hauteur, supprime une indétermination inutile, et adapte l’adjectif substantivé hébreu à la syntaxe française. Les notes conservent l’ellipse de וְנָתַתִּי et le caractère elliptique de רַךְ, sans imposer de lecture théologique.
