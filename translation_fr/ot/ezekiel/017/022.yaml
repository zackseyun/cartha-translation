  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Moi-même, je prendrai à la cime du cèdre élevé et je le placerai[a]. À l’extrémité de ses jeunes pousses, je cueillerai un tendre rejet[b] ; moi-même, je le planterai sur une montagne haute et imposante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « je placerai » ; le complément d’objet n’est pas exprimé.
    reason: ambiguïté grammaticale
  - marker: b
    text: L’hébreu dit littéralement « un tendre » ; le terme désigne, dans cette image, un rejet, une pousse ou une petite branche tendre.
    reason: précision lexicale
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue clairement les deux éléments du titre composé.
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: à la cime du cèdre majestueux
  rationale: צַמֶּרֶת désigne la cime ou la couronne de l’arbre. הָרָמָה exprime sa hauteur et son caractère imposant ; « majestueux » rend naturellement cette image en français.
- source_word: וְנָתַתִּי
  choice: et je le placerai
  rationale: Le verbe signifie couramment « mettre, placer ». Le complément n’étant pas exprimé ici en hébreu, la traduction garde une formulation générale plutôt que d’anticiper explicitement l’acte de planter.
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: à l’extrémité de ses jeunes pousses
  rationale: רֹאשׁ désigne ici le bout ou l’extrémité, tandis que יֹנְקוֹתָיו évoque les jeunes pousses du cèdre.
- source_word: רַךְ אֶקְטֹף
  choice: j’en cueillerai une qui est tendre
  rationale: רַךְ est un adjectif substantivé, littéralement « une tendre ». La formulation française explicite seulement le genre suggéré par « pousses » sans ajouter une espèce végétale absente du texte.
- source_word: וְשָׁתַלְתִּי
  choice: je la planterai
  rationale: שׁתל est le verbe ordinaire pour planter. Le pronom féminin reprend naturellement la jeune pousse en français.
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: sur une montagne haute et élevée
  rationale: Les deux adjectifs décrivent la hauteur et la position dominante de la montagne. La légère redondance conserve le parallélisme appuyé de l’hébreu.
- source_word: אָנִי ... אָנִי
  choice: Moi-même ... moi-même
  rationale: Les pronoms personnels, superflus grammaticalement à côté des verbes conjugués, sont emphatiques ; leur répétition est donc conservée.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » rend directement le nom divin, tandis que « le Seigneur » traduit le titre אֲדֹנָי. Cette solution évite aussi la répétition artificielle « le Seigneur SEIGNEUR ».
- issue: Identification messianique possible de la pousse tendre
  choice: conserver uniquement l’image botanique dans le verset
  alternative: expliciter la pousse comme une figure messianique
  rationale: Le contexte littéraire peut inviter à une lecture royale ou messianique, mais le verset lui-même parle métaphoriquement d’une pousse sans identifier explicitement son référent. La traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition emphatique de « moi-même » et la légère redondance de « haute et élevée » préservent les traits saillants de l’hébreu, tandis que les notes signalent les ellipses sans les résoudre abusivement.
