  text: אֱמָר נָא֙ לְ/בֵ֣ית הַ/מֶּ֔רִי הֲ/לֹ֥א יְדַעְתֶּ֖ם מָה אֵ֑לֶּה אֱמֹ֗ר הִנֵּה בָ֨א מֶֽלֶךְ בָּבֶ֤ל יְרוּשָׁלִַ֨ם֙ וַ/יִּקַּ֤ח אֶת מַלְכָּ/הּ֙ וְ/אֶת שָׂרֶ֔י/הָ וַ/יָּבֵ֥א אוֹתָ֛/ם אֵלָ֖י/ו בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: fr
  text: 'Dis à la maison rebelle : « Ne savez-vous pas ce que ces choses signifient ? » Dis : « Voici que le roi de Babylone est venu à Jérusalem ; il en a pris le roi et les hauts responsables[a], puis les a emmenés auprès de lui à Babylone[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes ». Le terme hébreu peut désigner des princes ou, plus largement, des dirigeants investis d’autorité.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu indique explicitement un mouvement « vers Babylone ».
    reason: source_clarification
lexical_decisions:
- source_word: בֵּית הַמֶּרִי
  choice: la communauté rebelle
  rationale: Littéralement « la maison de rébellion ». Dans cette formule récurrente d’Ézéchiel, « communauté » exprime naturellement en français le groupe humain désigné par « maison », tandis que « rebelle » conserve sa caractérisation centrale.
- source_word: הֲלֹא יְדַעְתֶּם מָה אֵלֶּה
  choice: Ne savez-vous pas ce que cela signifie ?
  rationale: ידע peut signifier savoir ou comprendre. Le contexte appelle l’interprétation de l’allégorie précédente ; « ce que cela signifie » rend explicite cette portée sans détailler l’interprétation.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marqueur présentatif qui attire l’attention sur l’explication à venir ; « Voici que » convient à un registre biblique digne sans être archaïque.
- source_word: בָּא מֶלֶךְ בָּבֶל יְרוּשָׁלַםִ
  choice: le roi de Babylone est venu à Jérusalem
  rationale: Le parfait בָּא rapporte ici l’événement historique ; le passé composé est naturel en français narratif moderne.
- source_word: וַיִּקַּח אֶת מַלְכָּהּ
  choice: il en a pris le roi
  rationale: Le pronom adverbial « en » reprend Jérusalem et restitue avec naturel le suffixe féminin hébreu de מַלְכָּהּ.
- source_word: שָׂרֶיהָ
  choice: les hauts responsables
  rationale: שׂרים désigne des personnages investis d’autorité, princes ou dirigeants. « Hauts responsables » exprime leur rang politique sans les identifier nécessairement à des membres de la famille royale.
- source_word: וַיְבֵא אוֹתָם אֵלָיו בָּבֶלָה
  choice: puis les a emmenés avec lui à Babylone
  rationale: Le mouvement vers Babylone est explicité par le ה directionnel de בָּבֶלָה. « Avec lui » rend idiomatiquement אֵלָיו dans le contexte du déplacement et évite l’étrangeté de « les amena à lui à Babylone ».
