  verdict: revise
  source_fidelity: La formulation « avec lui » ne rend pas exactement אֵלָיו (« auprès de lui / à lui ») et peut introduire l’idée que le roi les accompagnait personnellement. Le pluriel de מָה אֵלֶּה est aussi mieux conservé par « ces choses ». « Maison rebelle » maintient l’expression imagée récurrente d’Ézéchiel, là où « communauté » l’interprète.
  naturalness: Le texte révisé reste clair et naturel dans un français international moderne et conserve un registre biblique sobre. « Dis donc » est évité, car son ton conversationnel est moins homogène avec le reste du verset.
  terminology: « Maison rebelle » préserve le terme collectif et métaphorique בית. « Hauts responsables » est une option recevable pour שרים; la note conserve correctement l’alternative « princes ».
  issues:
  - severity: medium
    issue: « avec lui » pour אֵלָיו
    rationale: Le complément hébreu exprime la destination ou la remise auprès du roi de Babylone, non nécessairement un accompagnement durant le trajet. « Auprès de lui » rend cette relation sans ajout.
  - severity: low
    issue: « communauté rebelle » pour בֵּית הַמֶּרִי
    rationale: La traduction est interprétative et efface « maison », métaphore corporative récurrente dans Ézéchiel. « Maison rebelle » est compréhensible en français biblique moderne et plus fidèle.
  - severity: low
    issue: Singulier « cela » pour מָה אֵלֶּה
    rationale: Le démonstratif hébreu est pluriel. « Ce que ces choses signifient » conserve la référence aux éléments de l’allégorie.
