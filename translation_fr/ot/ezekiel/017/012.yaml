  to: 'Dis à la maison rebelle : « Ne savez-vous pas ce que ces choses signifient ? » Dis : « Voici que le roi de Babylone est venu à Jérusalem ; il en a pris le roi et les hauts responsables[a], puis les a emmenés auprès de lui à Babylone[b]. »'
  rationale: La révision rétablit l’image de la « maison », respecte le pluriel du démonstratif et traduit אֵלָיו par « auprès de lui » plutôt que par un accompagnement implicite. Les termes politiques et les ancres de notes sont conservés.
