  text: וַ/יִּקַּח֙ מִ/זֶּ֣רַע הָ/אָ֔רֶץ וַֽ/יִּתְּנֵ֖/הוּ בִּ/שְׂדֵה זָ֑רַע קָ֚ח עַל מַ֣יִם רַבִּ֔ים צַפְצָפָ֖ה שָׂמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/005.yaml
  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
translation:
  language: fr
  text: Puis il prit une partie de la semence du pays et la planta dans une terre fertile. Il la plaça près d’eaux abondantes, comme un saule[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peuplier »; l’identification de l’hébreu צַפְצָפָה est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  choice: une partie de la semence du pays
  rationale: Le מִן a une valeur partitive, et זֶרַע conserve ici son sens agricole concret dans l’allégorie.
- source_word: וַיִּתְּנֵהוּ
  choice: la planta
  rationale: Même si נתן signifie littéralement « mettre » ou « placer », le contexte explicite des semailles appelle naturellement « planter » en français.
- source_word: בִּשְׂדֵה זָרַע קָח
  choice: dans une terre fertile
  rationale: L’expression rare désigne vraisemblablement un terrain choisi ou propre aux semailles; cette formulation naturelle en restitue le sens sans imposer un calque obscur.
- source_word: עַל מַיִם רַבִּים
  choice: près d’eaux abondantes
  rationale: Dans ce contexte de localisation, עַל peut signifier « près de »; מַיִם רַבִּים évoque une eau disponible en abondance.
- source_word: צַפְצָפָה
  choice: saule
  rationale: « Saule » convient au contexte d’un arbre associé à l’eau, mais l’identification botanique du terme hébreu demeure incertaine; « peuplier » est donc signalé en note.
- source_word: שָׂמוֹ
  choice: la plaça
  rationale: שׂים signifie « mettre, placer ». Le pronom féminin reprend naturellement « semence » dans la formulation française.
