lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Avec דְבַר יְהוָה, la formule narrative hébraïque introduit naturellement en français la réception d’une parole divine. « Fut adressée » exprime idiomatiquement cette venue sans alourdir la phrase par « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message divin. « La parole » conserve l’expression biblique établie et sa portée révélatrice.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend directement la préposition suivie du suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours direct qui suit. « En ces termes : » est naturel en français moderne et annonce clairement son contenu.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin; le conserver sous la forme « Yahweh » évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule prophétique est rendue idiomatiquement, avec une tournure littéraire encore courante. Aucun marqueur de note n’est nécessaire.
