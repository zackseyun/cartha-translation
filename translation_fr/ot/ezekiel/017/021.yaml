source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: fr
  text: Tous ses fugitifs[a], parmi toutes ses troupes[b], tomberont par l’épée, et ceux qui resteront seront dispersés à tous les vents. Alors vous saurez que moi, Yahweh, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « ses fugitifs » ; certaines versions anciennes et traductions comprennent plutôt « ses hommes d’élite » ou une expression semblable.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ses ailes », image militaire hébraïque désignant des divisions ou des troupes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: ses fugitifs
  rationale: La forme hébraïque se rattache le plus naturellement à ברח, « fuir », et désigne ceux qui fuient ou cherchent à s’échapper. La note signale l’autre compréhension ancienne, « hommes d’élite ».
- source_word: אֲגַפָּיו
  choice: ses troupes
  rationale: Le mot signifie littéralement « ses ailes », image militaire désignant ici les divisions, les flancs ou les corps de troupes. « Troupes » communique clairement ce sens en français moderne.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Cette tournure française conserve l’image biblique et exprime naturellement une mort violente au combat ou par exécution.
- source_word: הַנִּשְׁאָרִים
  choice: ceux qui resteront
  rationale: L’expression désigne simplement ceux qui subsisteront après la chute; elle évite le terme théologiquement plus chargé « reste ».
- source_word: לְכָל רוּחַ
  choice: à tous les vents
  rationale: Cette expression idiomatique conserve l’image vive d’une dispersion dans toutes les directions et reste naturelle en français.
- source_word: יִפָּרֵשׂוּ
  choice: seront dispersés
  rationale: Le nifal exprime ici une dispersion subie dans le cadre du jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Cette formulation préserve la solennité de la déclaration prophétique divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens de הַנִּשְׁאָרִים
  choice: ceux qui resteront
  alternative: le reste; les survivants
  rationale: Dans ce contexte de jugement, il s’agit des personnes encore en vie qui seront ensuite dispersées; le texte n’impose pas ici la notion théologique d’un reste fidèle.
- issue: Lecture de מברחו
  choice: ses fugitifs
  alternative: ses hommes d’élite
  rationale: La forme hébraïque favorise le sens de personnes en fuite, tandis que certaines versions anciennes soutiennent une lecture proche de « hommes d’élite »; l’ambiguïté textuelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression du jugement et la formule solennelle finale. Les marqueurs de notes sont placés immédiatement après les termes concernés.
