  rationale: La seule révision remplace « dans » par « parmi » afin de rendre avec plus de précision et de naturel la relation entre les fugitifs et les divisions militaires. Le reste du texte et les deux notes sont conservés quant au sens ; une normalisation mineure de l’espacement avant le point-virgule de la note a été appliquée.
