  to: 'Dis : « Voici ce que dit le Seigneur Yahweh : Réussira-t-elle ? Ne va-t-il pas arracher ses racines[a] et couper son fruit, si bien qu’elle se desséchera ? Toutes les feuilles de sa jeune pousse se flétriront. Elle ne sera pas soulevée de ses racines par un bras puissant[b] ni par un peuple nombreux. »'
