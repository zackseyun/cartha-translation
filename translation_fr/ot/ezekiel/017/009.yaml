    rationale: וְלֹא ... לְמַשְׂאוֹת indique que son enlèvement depuis ses racines ne se fera pas au moyen d’une grande force et de beaucoup de gens. « Il ne faudra » est interprétatif et déplace le point de vue. « Elle ne sera pas soulevée... » préserve la voix passive et l’instrumental du texte.
