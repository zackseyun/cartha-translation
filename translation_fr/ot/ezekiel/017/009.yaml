source:
  edition: WLC
  text: אֱמֹ֗ר כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהֹוִ֖ה תִּצְלָ֑ח הֲ/לוֹא֩ אֶת שָׁרָשֶׁ֨י/הָ יְנַתֵּ֜ק וְ/אֶת פִּרְיָ֣/הּ יְקוֹסֵ֣ס וְ/יָבֵ֗שׁ כָּל טַרְפֵּ֤י צִמְחָ/הּ֙ תִּיבָ֔שׁ וְ/לֹֽא בִ/זְרֹ֤עַ גְּדוֹלָה֙ וּ/בְ/עַם רָ֔ב לְ/מַשְׂא֥וֹת אוֹתָ֖/הּ מִ/שָּׁרָשֶֽׁי/הָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: fr
  text: 'Dis : « Voici ce que dit le Seigneur Yahweh : Réussira-t-elle ? Ne va-t-il pas arracher ses racines[a] et couper son fruit, si bien qu’elle se desséchera ? Toutes les feuilles de sa jeune pousse se flétriront. Elle ne sera pas soulevée de ses racines par un bras puissant[b] ni par un peuple nombreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « détacher violemment ses racines » ; le verbe hébreu souligne l’action de tirer ou d’arracher.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un grand bras » ; le bras représente ici la force ou la puissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Dis
  rationale: Impératif singulier introduisant la proclamation prophétique ; « Dis » est direct et naturel en français.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Rend naturellement la formule de messager tout en conservant le titre אֲדֹנָי et le nom divin יהוה.
- source_word: תִּצְלָח
  choice: Réussira-t-elle ?
  rationale: Le verbe peut exprimer la réussite ou la prospérité ; le féminin renvoie à la vigne de l’allégorie.
- source_word: יְנַתֵּק
  choice: arracher
  rationale: Exprime l’action de détacher violemment ou de tirer hors de terre, en gardant l’image végétale.
- source_word: יְקוֹסֵס
  choice: couper
  rationale: Le verbe désigne l’action de retrancher ou couper ; formulation claire sans préciser davantage le procédé.
- source_word: וְיָבֵשׁ
  choice: si bien qu’elle se desséchera
  rationale: Présente naturellement en français la conséquence de l’arrachement des racines et de la coupe du fruit.
- source_word: כָּל טַרְפֵּי צִמְחָהּ
  choice: Toutes les feuilles de sa jeune pousse
  rationale: 'Conserve les éléments concrets de l’image botanique : le feuillage frais et la croissance de la vigne.'
- source_word: תִּיבָשׁ
  choice: se flétriront
  rationale: Terme idiomatique pour le dépérissement du feuillage, tout en restant dans le même champ sémantique que « se desséchera ».
- source_word: וְלֹא בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב
  choice: Il ne faudra ni un bras puissant ni un peuple nombreux
  rationale: Conserve « bras » et « peuple » plutôt que d’expliciter respectivement « puissance » et « armée » ; la tournure indique qu’une grande force ne sera pas nécessaire.
- source_word: לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: pour la soulever de ses racines
  rationale: Rend au plus près l’image inhabituelle de la lever ou l’enlever depuis ses racines, sans la réduire silencieusement à un simple arrachement.
theological_decisions:
- issue: Traduction du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » conserve le nom divin distinct après le titre אֲדֹנָי et évite de fondre les deux termes en un seul titre.
- issue: Référent du sujet implicite de יְנַתֵּק et יְקוֹסֵס
  choice: Ne va-t-il pas…
  alternative: Ses racines ne seront-elles pas arrachées…
  rationale: Le masculin singulier implicite renvoie vraisemblablement au grand aigle de l’allégorie ; la traduction conserve ce sujet sans le nommer ni résoudre davantage l’identification historique dans le verset.
translation_notes:
  register: Français international actuel, digne et accessible. Les questions rhétoriques, l’image végétale et le « bras » métaphorique sont conservés. Les marqueurs de notes ont été placés sur les expressions auxquelles leurs explications se rapportent.
