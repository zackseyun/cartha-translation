  text: וְ/לֹא֩ בְ/חַ֨יִל גָּד֜וֹל וּ/בְ/קָהָ֣ל רָ֗ב יַעֲשֶׂ֨ה אוֹת֤/וֹ פַרְעֹה֙ בַּ/מִּלְחָמָ֔ה בִּ/שְׁפֹּ֥ךְ סֹלְלָ֖ה וּ/בִ/בְנ֣וֹת דָּיֵ֑ק לְ/הַכְרִ֖ית נְפָשׁ֥וֹת רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: fr
  text: Pharaon n’interviendra pas en sa faveur dans la guerre avec une grande armée et un vaste rassemblement[a], quand on élèvera un remblai de siège et construira un ouvrage de siège[b] pour faire périr beaucoup de personnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une grande armée et une grande multitude ».'
    reason: lexical_alternative
  - marker: b
    text: Les deux termes de siège peuvent aussi être rendus par « rampe de siège » et « mur de siège » ou « tour de siège ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: avec une grande armée
  rationale: Dans ce contexte militaire, חַיִל désigne une force armée plutôt que la force au sens abstrait. « Grande armée » est clair et naturel en français moderne.
- source_word: וּבְקָהָל רָב
  choice: et une grande multitude
  rationale: קָהָל désigne un rassemblement nombreux. « Grande multitude » conserve cette idée sans préciser indûment qu’il s’agit d’une unité militaire organisée.
- source_word: יַעֲשֶׂה אוֹתוֹ
  choice: n’interviendra pas en sa faveur
  rationale: L’expression hébraïque est condensée et signifie ici que Pharaon ne prendra pas de mesures efficaces pour lui. « Intervenir en sa faveur » reste assez large tout en étant naturel en français.
- source_word: בַּמִּלְחָמָה
  choice: dans la guerre
  rationale: Le nom singulier défini est rendu directement; le contexte peut viser plus précisément la campagne militaire en cours.
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: quand on élèvera un remblai de siège
  rationale: שׁפך signifie littéralement « verser », mais décrit avec סֹלְלָה l’amoncellement de terre servant aux opérations de siège. La tournure impersonnelle préserve l’absence de sujet explicite.
- source_word: וּבִבְנוֹת דָּיֵק
  choice: et construira un ouvrage de siège
  rationale: דָּיֵק désigne une structure de siège dont la forme exacte est discutée. « Ouvrage de siège » évite une précision injustifiée.
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: pour faire périr beaucoup de personnes
  rationale: נְפָשׁוֹת peut désigner des vies ou des personnes, et הכרית implique leur suppression violente. Cette formulation transmet naturellement le sens en français sans atténuer la gravité.
