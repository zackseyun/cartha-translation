source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: fr
  text: 'Il a méprisé le serment[a] en rompant l’alliance. Voici : il s’était engagé[b], et il a fait tout cela. Il n’échappera pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la malédiction » : le terme hébreu peut désigner un serment assorti d’une malédiction en cas de violation.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il avait donné sa main », geste exprimant un engagement ou un accord.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: Il a méprisé
  rationale: Le verbe בזה exprime le mépris ou le fait de traiter avec dédain. « Méprisé » conserve avec concision la force morale de l’accusation.
- source_word: אָלָה
  choice: le serment
  rationale: Dans un contexte d’alliance, אָלָה désigne un serment pouvant comporter une malédiction en cas de violation. « Serment » convient au parallélisme avec « alliance », tandis que la nuance de malédiction est signalée en note.
- source_word: לְהָפֵר בְּרִית
  choice: en rompant l’alliance
  rationale: L’infinitif avec לְ précise ici la manière dont le serment a été méprisé. Cette formulation française restitue naturellement ce rapport.
- source_word: בְּרִית
  choice: l’alliance
  rationale: Même si le contexte immédiat est celui d’un traité politique, « alliance » préserve la portée biblique, morale et relationnelle de בְּרִית.
- source_word: וְהִנֵּה
  choice: Or voici
  rationale: הִנֵּה attire fortement l’attention sur ce qui suit. « Or voici » en maintient la valeur rhétorique dans un français digne et actuel.
- source_word: נָתַן יָדוֹ
  choice: il s’était engagé
  rationale: L’expression signifie littéralement « donner sa main » comme signe d’engagement. La traduction idiomatique évite en français une image potentiellement obscure, tout en l’expliquant en note.
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: mais il a pourtant fait tout cela
  rationale: Le contexte implique un contraste entre l’engagement donné et les actes commis. « Mais… pourtant » rend explicitement ce contraste sans modifier le contenu de l’accusation.
- source_word: לֹא יִמָּלֵט
  choice: Il n’échappera pas
  rationale: Le niphal de מלט exprime ici l’impossibilité d’échapper au jugement. Cette traduction est directe et naturelle.
theological_decisions:
- issue: Terminologie politique et alliance
  choice: Conserver « serment » et « alliance »
  alternative: Employer « malédiction » et/ou « traité »
  rationale: Le passage condamne une trahison politique dans un vocabulaire qui porte également une dimension morale et religieuse devant Dieu. « Serment » et « alliance » maintiennent cette portée sans réduire le texte à un simple accord diplomatique.
translation_notes:
  register: 'Français international moderne, clair et digne. La traduction privilégie une équivalence optimale : elle conserve le relief rhétorique de הִנֵּה et le vocabulaire d’alliance, tout en rendant idiomatiquement l’expression « donner sa main ».'
