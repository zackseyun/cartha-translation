  source_fidelity: 'Le sens fondamental est bien rendu : mépriser le serment en rompant l’alliance, s’être engagé, accomplir ces actes et ne pas échapper au jugement. Toutefois, « mais il a pourtant fait » cumule deux marqueurs adversatifs alors que le וְ de וְכָל־אֵלֶּה עָשָׂה est simplement coordinatif; le contraste est déjà suffisamment porté par le contexte.'
  naturalness: « Il s’était engagé » est une bonne restitution idiomatique de l’expression « donner sa main », avec la note littérale. « Voici » rend naturellement la mise en relief de וְהִנֵּה; la suppression de « Or » évite une articulation française légèrement artificielle. La coordination simple donne une phrase plus sobre et plus naturelle.
  terminology: « Serment » pour אָלָה et « alliance » pour בְּרִית préservent correctement le vocabulaire du texte et sa portée morale dans le contexte politique. La note sur la possible nuance de malédiction est appropriée. Les ancres de notes sont correctement placées.
