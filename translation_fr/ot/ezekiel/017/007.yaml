source:
  edition: WLC
  text: וַ/יְהִ֤י נֶֽשֶׁר אֶחָד֙ גָּד֔וֹל גְּד֥וֹל כְּנָפַ֖יִם וְ/רַב נוֹצָ֑ה וְ/הִנֵּה֩ הַ/גֶּ֨פֶן הַ/זֹּ֜את כָּֽפְנָ֧ה שָׁרֳשֶׁ֣י/הָ עָלָ֗י/ו וְ/דָֽלִיּוֹתָי/ו֙ שִׁלְחָה לּ֔/וֹ לְ/הַשְׁק֣וֹת אוֹתָ֔/הּ מֵ/עֲרֻג֖וֹת מַטָּעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: fr
  text: Il y avait un autre grand aigle, aux grandes ailes et au plumage abondant[a]. Et voici que cette vigne dirigea vers lui ses racines et étendit vers lui ses branches, afin qu’il l’arrose depuis les plates-bandes où elle avait été plantée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vautour »; le mot hébreu peut désigner plus largement un grand rapace.
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset peut aussi se comprendre ainsi : « étendit vers lui ses branches depuis les plates-bandes où elle avait été plantée, afin qu’il l’arrose ». Selon cette analyse, les plates-bandes indiquent le lieu dont la vigne se détourne plutôt que la provenance de l’eau.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶשֶׁר
  choice: aigle
  rationale: « Aigle » est le terme traditionnel et convient à l’image royale et impériale de l’allégorie; le mot hébreu peut toutefois désigner plus largement un grand rapace.
- source_word: גָּדוֹל גְּדֹל כְּנָפַיִם
  choice: un grand aigle, aux grandes ailes
  rationale: La répétition de גָּדוֹל est conservée sous une forme française naturelle, en décrivant d’abord l’oiseau puis l’envergure de ses ailes.
- source_word: רַב נוֹצָה
  choice: au plumage abondant
  rationale: נוֹצָה désigne les plumes ou le plumage; cette formulation restitue l’abondance sans lourdeur.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure marque avec vivacité le changement de scène dans l’allégorie.
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: dirigea vers lui ses racines
  rationale: Le verbe exprime l’idée de se courber ou de se tourner; « dirigea » rend clairement l’orientation des racines vers le second aigle.
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: étendit vers lui ses branches
  rationale: La vigne est personnifiée et déploie sa croissance vers l’aigle. Le suffixe masculin irrégulier de דָלִיּוֹתָיו est compris contextuellement comme renvoyant aux branches de la vigne.
- source_word: לְהַשְׁקוֹת אֹתָהּ
  choice: afin qu’il l’arrose
  rationale: L’infinitif marque le but; l’aigle demeure le sujet implicite de l’arrosage.
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: depuis les plates-bandes où elle avait été plantée
  rationale: עֲרֻגוֹת évoque des plates-bandes ou parcelles cultivées, et מַטָּעָהּ le lieu ou l’acte de sa plantation. La formulation garde l’image agricole et l’attachement syntaxique traditionnel au verbe « arroser », tout en signalant l’autre analyse possible en note.
