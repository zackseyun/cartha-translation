  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּמְרָד בּ֗/וֹ לִ/שְׁלֹ֤חַ מַלְאָכָי/ו֙ מִצְרַ֔יִם לָֽ/תֶת ל֥/וֹ סוּסִ֖ים וְ/עַם רָ֑ב הֲ/יִצְלָ֤ח הֲ/יִמָּלֵט֙ הָ/עֹשֵׂ֣ה אֵ֔לֶּה וְ/הֵפֵ֥ר בְּרִ֖ית וְ/נִמְלָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: fr
  text: Mais il s’est révolté contre lui en envoyant ses messagers en Égypte, pour qu’on lui fournisse des chevaux et des hommes en grand nombre[a]. Réussira-t-il ? Celui qui agit ainsi échappera-t-il ? Peut-il rompre une alliance[b] et néanmoins échapper ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des chevaux et un peuple nombreux » ; dans ce contexte, il s’agit d’un soutien militaire, donc probablement de nombreux soldats.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « violer une alliance ». Dans ce contexte politique, le mot peut aussi désigner un traité, mais il souligne la force de l’engagement pris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: il s’est révolté contre lui
  rationale: Le verbe מרד désigne une révolte contre un suzerain. La tournure française conserve le pronom masculin et le rapport politique exprimé par le contexte.
- source_word: לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם
  choice: en envoyant ses messagers en Égypte
  rationale: מַלְאָכִים peut désigner des messagers ou des envoyés. « Messagers » garde le sens large, tandis que la mission diplomatique ressort du contexte.
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: pour qu’on lui fournisse des chevaux et des hommes en grand nombre
  rationale: L’infinitif indique le but de la mission. Le sujet de « fournir » n’étant pas exprimé, le pronom indéfini « on » évite de l’identifier artificiellement. « Des hommes en grand nombre » reste proche de l’expression littérale tout en faisant comprendre l’aide humaine, vraisemblablement militaire.
- source_word: הֲיִצְלָח
  choice: Réussira-t-il ?
  rationale: Dans ce contexte, צלח concerne l’aboutissement de la révolte. « Réussir » est direct et idiomatique en français moderne.
- source_word: הֲיִמָּלֵט
  choice: échappera-t-il ?
  rationale: נמלט exprime le fait d’échapper au danger ou à ses conséquences. L’emploi absolu d’« échapper » conserve l’absence de complément dans l’hébreu.
- source_word: הָעֹשֵׂה אֵלֶּה
  choice: Celui qui agit ainsi
  rationale: Cette formulation rend naturellement le participe substantivé et résume « faire ces choses » sans en modifier la portée.
- source_word: וְהֵפֵר בְּרִית
  choice: Peut-il rompre une alliance
  rationale: הפר ברית signifie rompre ou violer une alliance. L’article indéfini reflète l’absence d’article en hébreu, même si le contexte renvoie à une alliance précise.
- source_word: וְנִמְלָט
  choice: et néanmoins échapper
  rationale: La répétition d’« échapper » reproduit celle du verbe hébreu; « néanmoins » explicite avec mesure l’incrédulité portée par la question rhétorique.
theological_decisions:
- issue: Portée de בְּרִית dans un contexte politique
  choice: alliance
  alternative: traité; engagement
  rationale: « Alliance » convient à un accord entre souverains tout en conservant la gravité morale et théologique attachée à בְּרִית chez Ézéchiel. « Traité » risquerait d’en réduire la portée à sa seule dimension diplomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques sont conservées, de même que la répétition du verbe « échapper ». La formulation évite de préciser le châtiment ou d’identifier explicitement le fournisseur de l’aide, éléments que l’hébreu laisse implicites.
