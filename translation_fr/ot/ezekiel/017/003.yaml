base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: fr
  text: 'et tu diras : « Ainsi parle le Seigneur Yahweh : Le grand aigle, aux grandes ailes, aux longues rémiges, au plumage abondant et aux couleurs variées[a], vint au Liban et prit la cime du cèdre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui avait de la broderie (ou de la bigarrure) »; l’expression évoque probablement un plumage aux motifs ou aux couleurs variés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יְהוִה, sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: le grand aigle
  rationale: נֶשֶׁר désigne ici un grand rapace, traditionnellement identifié à l’aigle; « grand » conserve à la fois l’idée de taille et de majesté.
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: aux grandes ailes
  rationale: Expression française naturelle qui reste proche de l’hébreu « grand quant aux ailes » et évoque leur ampleur.
- source_word: אֶרֶךְ הָאֵבֶר
  choice: aux longues rémiges
  rationale: Dans ce contexte aviaire, אֵבֶר renvoie aux grandes plumes servant au vol; « rémiges » est précis et maintient la distinction avec les ailes du membre précédent.
- source_word: מָלֵא הַנּוֹצָה
  choice: au plumage abondant
  rationale: Reproduit l’image d’un aigle « plein de plumage » dans un français fluide et digne.
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: aux couleurs variées
  rationale: רִקְמָה désigne littéralement une broderie ou une bigarrure; appliqué à l’oiseau, le syntagme décrit vraisemblablement un plumage richement coloré ou moucheté, sans que le mot « plumes » soit explicitement répété en hébreu.
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: vint au Liban
  rationale: Traduction directe du déplacement vers le Liban, avec le temps narratif français approprié.
- source_word: צַמֶּרֶת הָאָרֶז
  choice: la cime du cèdre
  rationale: צַמֶּרֶת est la partie la plus haute ou la couronne de l’arbre; « cime » restitue précisément et naturellement l’image.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente explicitement le tétragramme, tandis que « Seigneur » rend אֲדֹנָי; cette solution préserve les deux éléments du titre hébreu sans les confondre.
- issue: Identification symbolique de l’aigle et du cèdre
  choice: conserver les images sans explicitation dans le verset
  alternative: nommer directement les puissances et dirigeants représentés
  rationale: Le texte se présente ici comme une énigme allégorique dont l’explication vient ensuite; expliciter dès ce verset supprimerait la tension narrative voulue.
translation_notes:
  register: Français moderne, soutenu mais accessible. La série descriptive de l’hébreu est conservée sous forme de groupes parallèles introduits par « aux » et « au ». « Rémiges » apporte une précision aviaire; la note préserve l’image textile et l’ambiguïté de רִקְמָה.
