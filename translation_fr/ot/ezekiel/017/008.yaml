  text: אֶל שָׂ֥דֶה טּ֛וֹב אֶל מַ֥יִם רַבִּ֖ים הִ֣יא שְׁתוּלָ֑ה לַ/עֲשׂ֤וֹת עָנָף֙ וְ/לָ/שֵׂ֣את פֶּ֔רִי לִ/הְי֖וֹת לְ/גֶ֥פֶן אַדָּֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/008.yaml
  text: It was planted in a good field by abundant waters[a], to produce branches and bear fruit[b], to become a majestic vine.
translation:
  language: fr
  text: Elle était plantée dans un bon champ, près de grandes eaux, pour produire des branches et porter du fruit, pour devenir une vigne majestueuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: un bon champ
  rationale: שָׂדֶה désigne normalement un champ. Cette traduction conserve l’image agricole concrète sans expliciter la fertilité au-delà du texte.
- source_word: אֶל מַיִם רַבִּים
  choice: près d’eaux abondantes
  rationale: Avec l’image de la plantation, אֶל indique ici la proximité; « eaux abondantes » rend naturellement l’idée d’une ample ressource en eau.
- source_word: שְׁתוּלָה
  choice: avait été plantée
  rationale: Le participe passif indique l’état résultant de la plantation. Le plus-que-parfait s’intègre naturellement au récit de la vigne, sans imposer le sens plus précis de « transplantée ».
- source_word: לַעֲשׂוֹת עָנָף
  choice: pour produire des branches
  rationale: L’infinitif exprime le but ou le résultat attendu; « produire des branches » est actuel, clair et fidèle à l’image botanique.
- source_word: וְלָשֵׂאת פֶּרִי
  choice: et porter du fruit
  rationale: נשא avec פֶּרִי forme l’expression courante correspondant à « porter du fruit » en français.
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: pour devenir une vigne majestueuse
  rationale: אַדָּרֶת évoque la grandeur ou la magnificence. « majestueuse » maintient ce registre élevé sans introduire l’idée de rang social.
