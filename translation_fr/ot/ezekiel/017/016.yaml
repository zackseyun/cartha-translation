source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: fr
  text: « Aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, il mourra avec lui, au cœur de Babylone, au lieu où se trouve le roi qui l’a établi roi, dont il a méprisé le serment[a] et rompu l’alliance[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le serment assorti d’une malédiction » : le mot hébreu peut désigner un serment accompagné d’une malédiction contre celui qui le violerait.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le traité » : le mot hébreu traduit par « alliance » peut aussi désigner un pacte politique entre rois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formulation française naturelle conserve la solennité de la formule hébraïque par laquelle Dieu jure par sa propre vie.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם introduit solennellement une parole prophétique. « Seigneur » rend אֲדֹנָי et « Yahweh » représente directement le nom divin יהוה.
- source_word: אִם לֹא
  choice: c’est… que
  rationale: Dans cette formule de serment, אִם לֹא marque une forte affirmation. La tournure clivée française exprime cette certitude sans reproduire littéralement une condition devenue obscure.
- source_word: בִּמְקוֹם הַמֶּלֶךְ
  choice: là où se trouve le roi
  rationale: בִּמְקוֹם désigne le lieu associé au roi. Cette tournure rend clairement en français que la mort surviendra au lieu où réside ce roi.
- source_word: הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: le roi qui l’a établi roi
  rationale: Le hiphil de מלך signifie « faire régner, établir comme roi ». La répétition de « roi » conserve le jeu lexical et souligne la dépendance politique du vassal.
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: celui dont il a méprisé le serment
  rationale: אָלָה désigne un serment pouvant comporter une malédiction contre celui qui le viole. « Serment » convient au texte principal, avec la nuance indiquée en note.
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
  choice: et rompu l’alliance
  rationale: בְּרִית peut désigner une alliance ou un traité. « Alliance » conserve la portée solennelle du terme hébreu, tandis que la note signale son sens politique possible.
- source_word: אִתּוֹ
  choice: auprès de lui
  rationale: Le pronom renvoie au roi qui l’avait établi. « Auprès de lui » exprime la proximité locale impliquée ici tout en maintenant la référence pronominale.
- source_word: בְּתוֹךְ בָּבֶל
  choice: au cœur de Babylone
  rationale: Cette expression française actuelle restitue la force spatiale de « au milieu de Babylone » et souligne qu’il mourra sur place.
- source_word: יָמוּת
  choice: il mourra
  rationale: L’imparfait hébreu a ici une valeur future dans une déclaration prophétique certaine.
theological_decisions:
- issue: Traduction du nom divin יהוה dans la formule prophétique
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom personnel divin sans le remplacer par un titre.
- issue: Valeur de בְּרִית dans ce contexte politique
  choice: alliance
  alternative: traité
  rationale: Le contexte concerne bien un accord entre rois, mais « alliance » préserve la portée relationnelle et solennelle du terme hébreu sans réduire d’avance son sens à une catégorie diplomatique moderne.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La phrase conserve la structure solennelle du serment divin, la répétition de « roi » et l’insistance géographique sur Babylone. Les tirets isolent la formule prophétique sans archaïsme.
