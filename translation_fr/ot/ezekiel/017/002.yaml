  text: Son of man[b][a], pose a riddle and speak a parable to the house of Israel.
translation:
  language: fr
  text: Fils d’homme[a], propose une énigme et prononce une parabole[b] à la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mortel » ou « être humain ». L’expression hébraïque « fils d’homme » est conservée ici, car elle revient constamment comme formule par laquelle Dieu s’adresse à Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: Ou « proverbe » ou « discours figuré ». Le mot hébreu peut désigner un proverbe, une parabole ou une parole imagée ; ici, le développement figuré qui suit favorise « parabole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule vocative récurrente dans Ézéchiel est conservée afin de préserver l’idiome hébreu et la cohérence littéraire du livre. Ici, elle désigne le prophète comme être humain, sans fonctionner comme un titre christologique.
- source_word: חוּד חִידָה
  choice: propose une énigme
  rationale: L’expression associe un impératif signifiant « présenter, énoncer » au nom « énigme ». « Propose une énigme » est naturel en français moderne et garde la force de l’ordre.
- source_word: וּמְשֹׁל מָשָׁל
  choice: et raconte une parabole
  rationale: La tournure hébraïque repose sur un verbe et un nom de même racine. Le français ne peut reproduire naturellement cet effet; « raconte une parabole » exprime clairement l’action demandée. Le discours figuré développé qui suit favorise « parabole ».
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: La préposition désigne ici les destinataires. « Maison d’Israël » conserve l’expression collective et nationale de l’hébreu.
theological_decisions:
- issue: Sens de l’appellation בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: Mortel ; être humain
  rationale: L’expression est l’appellation divine habituelle du prophète et souligne son humanité. Sa forme traditionnelle est retenue pour préserver le motif récurrent, tout en signalant une autre traduction possible afin d’éviter de lui imposer ici un sens christologique.
- issue: Portée de מָשָׁל
  choice: parabole
  alternative: proverbe ; discours figuré
  rationale: Le terme hébreu possède une gamme de sens qui comprend le proverbe et la comparaison figurée. Dans ce contexte, le développement symbolique des versets suivants justifie « parabole » sans aller jusqu’au terme plus interprétatif « allégorie ».
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « propose » convient naturellement à « énigme », tandis que « raconte » évite un calque maladroit de la construction hébraïque. Les expressions récurrentes « Fils d’homme » et « maison d’Israël » sont maintenues pour leur portée littéraire.
