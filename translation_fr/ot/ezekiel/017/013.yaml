    issue: « emmena » pour לָקָח
    rationale: Le verbe hébreu signifie ici simplement « prit ». Le contexte peut impliquer qu’ils furent emmenés, mais le verset ne l’explicite pas; « prit » préserve donc mieux le degré d’énoncé de la source.
  - severity: low
    issue: « l’engagea par un serment »
    rationale: La formulation est compréhensible, mais elle est moins explicite sur l’acte de faire prêter serment. « Lui fit prêter serment » correspond plus directement à la construction hébraïque et reste naturel en français.
