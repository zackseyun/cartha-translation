  text: וַ/יִּקַּח֙ מִ/זֶּ֣רַע הַ/מְּלוּכָ֔ה וַ/יִּכְרֹ֥ת אִתּ֖/וֹ בְּרִ֑ית וַ/יָּבֵ֤א אֹת/וֹ֙ בְּ/אָלָ֔ה וְ/אֶת אֵילֵ֥י הָ/אָ֖רֶץ לָקָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: fr
  text: Il prit un membre de la descendance royale, conclut une alliance avec lui et lui fit prêter serment[a] ; il prit aussi les puissants du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le soumit à un serment assorti d’une malédiction » : le terme hébreu peut désigner un serment accompagné d’une malédiction en cas de violation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: un membre de la descendance royale
  rationale: זֶרַע désigne ici la descendance, et le préfixe מִן a une valeur partitive. Cette formulation naturelle conserve la nuance dynastique.
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: conclut une alliance avec lui
  rationale: כרת ברית est l’expression habituelle pour conclure une alliance. « Alliance » conserve la portée solennelle du terme sans la réduire à un simple accord politique.
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: l’engagea par un serment
  rationale: L’expression indique qu’il le plaça sous l’obligation d’un serment. אָלָה peut également comporter l’idée d’une malédiction sanctionnant sa violation, nuance signalée en note.
- source_word: אֵילֵי הָאָרֶץ
  choice: les puissants du pays
  rationale: אֵילִים, littéralement « béliers », désigne figurément des hommes puissants ou éminents. « Les puissants » préserve l’idée de force et de rang sans imposer une fonction officielle précise.
- source_word: לָקָח
  choice: emmena
  rationale: Le verbe signifie littéralement « prit ». Dans ce contexte, il s’agit de retirer du pays ses hommes puissants; « emmena » explicite naturellement ce déplacement sans ajouter l’idée plus forte de saisie violente.
theological_decisions:
- issue: Terminologie politico-covenantale
  choice: « conclut une alliance »
  alternative: « conclut un traité »
  rationale: בְּרִית est le terme hébreu ordinaire pour une alliance. Même politique, l’engagement est présenté comme solennel et lié à un serment; « alliance » en conserve donc mieux la portée.
- issue: Nuance de אָלָה
  choice: « l’engagea par un serment » dans le texte, avec la sanction de malédiction en note
  alternative: « le plaça sous une malédiction » ou « sous un serment assorti d’une malédiction »
  rationale: Le mot peut réunir les dimensions de serment et de malédiction. Le texte principal reste clair et naturel, tandis que la note préserve cette ambiguïté juridique et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Les enchaînements verbaux restent narratifs et directs; « les puissants du pays » conserve l’image de statut et de force sans archaïsme.
