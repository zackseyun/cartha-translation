reference: Ezekiel 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנֵּ֥ה שְׁתוּלָ֖ה הֲ/תִצְלָ֑ח הֲ/לוֹא֩ כְ/גַ֨עַת בָּ֜/הּ ר֤וּחַ הַ/קָּדִים֙ תִּיבַ֣שׁ יָבֹ֔שׁ עַל עֲרֻגֹ֥ת צִמְחָ֖/הּ תִּיבָֽשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: fr
  text: Et la voilà plantée ! Prospérera-t-elle ? Ne se desséchera-t-elle pas complètement[a] lorsque le vent d’est[b] la touchera ? Elle se desséchera sur les plates-bandes où elle a poussé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ne se desséchera-t-elle pas à coup sûr ? » L’hébreu associe un infinitif absolu au verbe conjugué pour intensifier l’affirmation.'
    reason: lexical_alternative
  - marker: b
    text: Le « vent d’est » est le vent chaud et destructeur venant du désert oriental ; dans les textes bibliques, il évoque souvent le dépérissement et le jugement.
    reason: cultural_note
  - marker: c
    text: 'Ou : « sur les parcelles où elle s’est développée ». L’expression hébraïque désigne les espaces cultivés dans lesquels la plante avait poussé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה שְׁתוּלָה
  choice: Et la voilà plantée !
  rationale: « La voilà » restitue de façon naturelle la valeur déictique de וְהִנֵּה, tandis que « plantée » rend le participe passif שְׁתוּלָה sans ajouter une concession absente de l’hébreu.
- source_word: הֲתִצְלָח
  choice: Prospérera-t-elle ?
  rationale: Le verbe צלח exprime ici la réussite ou la prospérité. « Prospérer » convient à la fois à l’image végétale et à la portée politique de la parabole.
- source_word: כְגַעַת בָּהּ
  choice: lorsque … la touchera
  rationale: Cette formulation française exprime naturellement la circonstance temporelle liée au contact, sans renforcer le verbe en « frapper ».
- source_word: רוּחַ הַקָּדִים
  choice: le vent d’est
  rationale: Expression française claire et habituelle pour le vent chaud et destructeur venant du désert oriental.
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: se desséchera … complètement
  rationale: Le verbe conjugué accompagné de l’infinitif absolu intensifie l’action. « Complètement » rend cette insistance, et « se dessécher » conserve l’image végétale.
- source_word: עַל עֲרֻגֹת צִמְחָהּ
  choice: sur les plates-bandes où elle a poussé
  rationale: עֲרֻגוֹת désigne des planches ou parcelles cultivées, et צִמְחָהּ évoque sa croissance. La formulation indique clairement que la plante se dessèche à l’endroit même où elle a grandi.
- source_word: תִּיבָשׁ
  choice: Elle se desséchera
  rationale: La répétition finale réaffirme l’issue certaine tout en maintenant le vocabulaire de la plante.
theological_decisions:
- issue: Portée de la question rhétorique
  choice: 'Maintien de la forme interrogative : « Ne se desséchera-t-elle pas… ? »'
  alternative: 'Formulation déclarative : « Elle se desséchera certainement… »'
  rationale: La question négative de l’hébreu affirme fortement l’issue attendue sans supprimer la tension rhétorique de la parabole.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve les questions brèves et la répétition de « se dessécher », essentielles à la force rhétorique du verset. Aucun « bien que » n’a été ajouté, car la concession n’est pas explicitement marquée dans l’hébreu.
