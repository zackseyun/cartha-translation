  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique, le verbe indique que la parole divine parvient au prophète. « Me fut adressée » est une tournure française naturelle et digne qui rend cette idée sans calquer lourdement « et il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: « Parole » conserve le sens lexical et la formule prophétique récurrente « la parole de Yahweh », là où « message » serait possible mais moins formellement proche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom français dans « me fut adressée » exprime naturellement le complément hébreu « à moi ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, « en ces termes » annonce idiomatiquement en français le discours qui suit, sans imposer le participe plus lourd « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la cadence prophétique traditionnelle tout en évitant l’archaïsme « il advint » et le calque « disant ».
