source:
  edition: WLC
  text: אֵ֛ת רֹ֥אשׁ יְנִֽיקוֹתָ֖י/ו קָטָ֑ף וַ/יְבִיאֵ֨/הוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן בְּ/עִ֥יר רֹכְלִ֖ים שָׂמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
translation:
  language: fr
  text: Il arracha la cime de ses jeunes pousses et l’emporta dans le pays de Canaan[a] ; il la déposa dans une ville de marchands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un pays de marchands ». Le nom « Canaan » peut avoir ici une connotation commerciale, surtout en parallèle avec l’expression « ville de marchands ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: la cime de ses jeunes pousses
  rationale: רֹאשׁ désigne ici la partie la plus haute, tandis que יְנִיקוֹתָיו évoque les jeunes pousses du cèdre. « La cime de ses jeunes pousses » conserve l’image végétale et reste naturelle en français.
- source_word: קָטָף
  choice: arracha
  rationale: Le verbe exprime l’action de détacher en cueillant ou en rompant. « Arracha » rend la vigueur de l’acte sans sortir de la métaphore végétale.
- source_word: וַיְבִיאֵהוּ
  choice: l’emporta
  rationale: Le suffixe renvoie à la cime ou à la jeune pousse détachée. « L’emporta » exprime naturellement son déplacement vers un autre pays.
- source_word: אֶרֶץ כְּנַעַן
  choice: le pays de Canaan
  rationale: Cette traduction conserve le nom propre traditionnel, tout en signalant en note le sens commercial possible de כְּנַעַן dans ce contexte.
- source_word: בְּעִיר רֹכְלִים
  choice: dans une ville de marchands
  rationale: רֹכְלִים désigne des commerçants itinérants ou des marchands. La formulation garde la structure concrète de l’hébreu et fait ressortir le thème commercial.
- source_word: שָׂמוֹ
  choice: il la déposa
  rationale: Le verbe signifie placer ou mettre. « Déposa » convient au mouvement d’un objet transporté puis installé, avec le pronom féminin renvoyant à « la cime ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le verset conserve l’image concrète de la pousse arrachée et l’ambiguïté lexicale de « Canaan » grâce à une note, sans expliciter prématurément la portée politique de l’allégorie.
