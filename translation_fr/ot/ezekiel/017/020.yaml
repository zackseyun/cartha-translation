source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י עָלָי/ו֙ רִשְׁתִּ֔/י וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וַ/הֲבִיאוֹתִ֣י/הוּ בָבֶ֗לָ/ה וְ/נִשְׁפַּטְתִּ֤י אִתּ/וֹ֙ שָׁ֔ם מַעֲל֖/וֹ אֲשֶׁ֥ר מָֽעַל בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: fr
  text: Je déploierai mon filet sur lui, et il sera pris dans mon piège. Puis je l’amènerai à Babylone et, là, j’entrerai en jugement avec lui[a] à cause de la perfidie dont il s’est rendu coupable envers moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je le jugerai là ». La formulation retenue conserve la nuance d’une confrontation judiciaire présente dans l’expression hébraïque.
    reason: lexical_alternative
  - marker: b
    text: « Perfidie » peut aussi se traduire par « infidélité » ou « manquement à la foi jurée ». Le terme hébreu souligne une rupture grave de loyauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי עָלָיו רִשְׁתִּי
  choice: Je déploierai mon filet sur lui
  rationale: פָרַשׂ signifie étendre ou déployer. « Déployer » restitue naturellement l’action d’étendre un filet au-dessus de quelqu’un, tout en conservant la métaphore de la chasse.
- source_word: וְנִתְפַּשׂ בִּמְצוּדָתִי
  choice: il sera pris dans mon piège
  rationale: Le nifal de תפשׂ exprime ici le fait d’être pris. Dans ce parallélisme avec « mon filet », מְצוּדָה désigne un dispositif de capture plutôt qu’une forteresse ; « piège » est clair et idiomatique.
- source_word: וַהֲבִיאוֹתִיהוּ בָבֶלָה
  choice: Puis je l’amènerai à Babylone
  rationale: La forme causative indique que Dieu le fera venir à Babylone, et le hé directionnel marque le mouvement vers cette ville. « Puis » rend clairement la progression des actions.
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: là, j’entrerai en jugement avec lui
  rationale: La construction réciproque ou judiciaire avec אִתּוֹ évoque l’engagement d’une procédure ou d’un débat judiciaire, et non seulement le prononcé d’une sentence. Cette formulation conserve cette nuance juridique.
- source_word: מַעֲלוֹ אֲשֶׁר מָעַל בִּי
  choice: à cause de la perfidie dont il s’est rendu coupable envers moi
  rationale: מַעַל et le verbe apparenté désignent un grave manquement à la loyauté ou à la foi jurée. « Perfidie » garde à la fois la gravité politique et la dimension d’infidélité envers Dieu ; la tournure française évite une répétition artificielle tout en maintenant le lien entre l’acte et la culpabilité.
theological_decisions:
- issue: Nature de la faute exprimée par מַעַל / מָעַל
  choice: perfidie dont il s’est rendu coupable envers moi
  alternative: infidélité envers moi ; manquement à la foi jurée envers moi
  rationale: Dans le contexte, la violation par Sédécias d’un serment et d’une alliance est présentée comme une offense envers Dieu. « Perfidie » conserve les dimensions politique, relationnelle et liée à la foi jurée sans réduire la faute à une catégorie exclusivement rituelle.
- issue: Portée judiciaire de וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: j’entrerai en jugement avec lui
  alternative: je le jugerai ; je plaiderai contre lui
  rationale: L’hébreu peut évoquer une confrontation judiciaire, pas seulement un verdict. Le choix retenu préserve cette tension et la tonalité juridique de la déclaration.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image du filet et du piège, puis le passage au registre judiciaire. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
