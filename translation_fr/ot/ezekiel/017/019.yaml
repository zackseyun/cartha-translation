  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : Aussi vrai que je suis vivant, mon serment[a] qu’il a méprisé et mon alliance qu’il a rompue, je le ferai retomber sur sa tête.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ma malédiction » : le terme hébreu peut désigner un serment assorti d’une malédiction en cas de violation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire tirée de l’accusation précédente.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve à la fois le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition « Seigneur SEIGNEUR ».
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Formule française idiomatique qui garde la solennité du serment divin fondé sur la vie de Dieu.
- source_word: אִם לֹא
  choice: '[force affirmative portée par la formulation de la déclaration]'
  rationale: Dans un serment, l’expression hébraïque marque une affirmation solennelle; la syntaxe française après « Aussi vrai que je suis vivant » en communique la force sans calque conditionnel.
- source_word: אָלָתִי
  choice: mon serment
  rationale: Le contexte met au premier plan l’engagement juré et méprisé, tout en laissant en note la nuance de malédiction sanctionnant sa violation.
- source_word: בָּזָה
  choice: qu’il a méprisé
  rationale: Exprime clairement le rejet empreint de mépris.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Équivalent français habituel de בְּרִית; Dieu revendique ici comme sienne l’alliance conclue sous sa sanction.
- source_word: הֵפִיר
  choice: qu’il a rompue
  rationale: Expression française courante et précise pour la violation d’une alliance.
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  choice: je les ferai retomber sur sa tête
  rationale: Rend naturellement l’image de la responsabilité et de ses conséquences revenant sur le coupable; le pronom pluriel reprend les deux réalités coordonnées, le serment et l’alliance.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le titre אֲדֹנָי suivi du nom divin; « Yahweh » préserve cette distinction.
- issue: Sens de אָלָה
  choice: mon serment
  alternative: ma malédiction
  rationale: Le contexte souligne l’obligation jurée que le roi a méprisée. Le terme peut toutefois désigner un serment assorti d’une malédiction, nuance conservée en note.
- issue: Objet de וּנְתַתִּיו
  choice: je les ferai retomber
  alternative: je le ferai retomber
  rationale: Le suffixe hébreu est singulier, mais son référent peut résumer l’ensemble constitué par le serment méprisé et l’alliance rompue. Le pluriel français reprend explicitement les deux éléments sans trancher la nature précise du châtiment.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule prophétique reste reconnaissable; l’image judiciaire « retomber sur sa tête » est idiomatique et conserve la force concrète de l’hébreu.
