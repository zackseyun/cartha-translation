  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
translation:
  language: fr
  text: afin qu’il devienne un royaume de rang inférieur, qu’il ne s’élève pas et qu’il observe l’alliance conclue avec le roi de Babylone[a], afin qu’il subsiste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « traité »; le terme hébreu peut désigner ici un accord politique contraignant.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: afin qu’il devienne
  rationale: L’infinitif précédé de ל exprime ici le but; « devienne » rend l’entrée dans une nouvelle condition politique.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: un royaume de faible importance
  rationale: Cette expression rend l’abaissement du royaume sur le plan politique, sans suggérer la vertu morale que pourrait évoquer « humble ».
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: sans s’élever
  rationale: 'La tournure conserve la valeur négative et le sens réfléchi du hitpael: le royaume ne doit pas chercher à accroître son rang.'
- source_word: לִשְׁמֹר
  choice: qu’il respecte
  rationale: Avec une alliance politique, שמר signifie en observer les obligations; « respecter une alliance » est naturel en français moderne.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » conserve le terme biblique tout en convenant à l’accord politique solennel conclu avec le roi de Babylone.
- source_word: לְעָמְדָהּ
  choice: pour pouvoir subsister
  rationale: « Subsister » exprime naturellement l’image hébraïque de se maintenir ou de rester établi; le sujet implicite est compris comme le royaume.
theological_decisions:
- issue: Sens de בְּרִית dans un contexte politique
  choice: alliance
  alternative: traité
  rationale: Le contexte décrit un accord politique contraignant, mais « alliance » préserve la portée et les liens lexicaux du terme hébreu; « traité » est signalé en note comme équivalent contextuel possible.
- issue: Référent du suffixe féminin dans לְעָמְדָהּ
  choice: le royaume peut subsister
  alternative: l’alliance peut rester en vigueur
  rationale: Le royaume féminin est le sujet principal de la proposition et constitue le référent le plus naturel; la forme hébraïque permet néanmoins grammaticalement de penser à l’alliance, elle aussi féminine.
translation_notes:
  register: Français international moderne, courant et digne. « De faible importance » marque le statut politique réduit sans connotation de vertu morale; la syntaxe reste concise et suit la progression finale du texte hébreu.
