base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: fr
  text: En ce jour-là, je ferai pousser une corne pour la maison d’Israël[a], et je te donnerai l’occasion de prendre la parole parmi eux[b], et ils sauront que je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « je ferai grandir une corne » : l’image de la corne évoque ici la force, l’honneur ou le relèvement accordé à la maison d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « une ouverture de bouche ». Cette expression hébraïque indique que quelqu’un reçoit la possibilité de parler; elle fait probablement écho aux périodes antérieures durant lesquelles la parole d’Ézéchiel avait été restreinte.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression temporelle prophétique courante, rendue dans un français moderne et digne.
- source_word: אַצְמִיחַ
  choice: je ferai pousser
  rationale: Le hifil de צמח est causatif. « Faire pousser » conserve l’image végétale tout en restant naturel en français.
- source_word: קֶרֶן
  choice: une corne
  rationale: Le sens concret est conservé afin de préserver la métaphore biblique de la force, de la dignité ou de l’élévation sans l’interpréter trop étroitement.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: Cette formulation maintient l’expression collective et historique du texte hébreu.
- source_word: וּלְךָ אֶתֵּן פִּתְחוֹן פֶּה
  choice: et je t’accorderai d’ouvrir la bouche
  rationale: La tournure française exprime naturellement le don ou l’autorisation de parler, tout en conservant l’image de l’ouverture de la bouche.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Rendu direct de l’expression hébraïque, qui situe la parole du prophète au sein du peuple.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: « Alors » fait ressortir la conséquence implicite de l’enchaînement hébreu sans modifier le sens.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, préférable ici à la substitution par un titre.
theological_decisions:
- issue: Portée métaphorique de « corne »
  choice: Conserver « corne » comme image de force, d’honneur ou de relèvement accordé à Israël.
  alternative: Traduire directement par « force » ou identifier explicitement la corne à une figure messianique.
  rationale: Le verset ne précise pas à lui seul une identification personnelle. Garder l’image préserve l’ambiguïté et les résonances théologiques du texte.
- issue: Sens de פִּתְחוֹן פֶּה appliqué à Ézéchiel
  choice: Exprimer l’autorisation ou la capacité reçue d’ouvrir la bouche et de parler.
  alternative: Préciser qu’il s’agit d’une délivrance permanente du mutisme ou d’une assurance particulière dans la parole.
  rationale: L’expression évoque probablement les restrictions antérieures imposées à la parole d’Ézéchiel, mais le texte ne définit ici ni la modalité ni la durée exactes de ce changement.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les images concrètes de la « corne » et de l’« ouverture de la bouche », avec des notes qui en éclairent le sens sans imposer une interprétation confessionnelle.
