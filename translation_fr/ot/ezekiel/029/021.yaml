revisions:
- from: En ce jour-là, je ferai pousser une corne pour la maison d’Israël[a], et je t’accorderai d’ouvrir la bouche au milieu d’eux[b]. Alors ils sauront que je suis Yahvé.
  to: En ce jour-là, je ferai pousser une corne pour la maison d’Israël[a], et je te donnerai l’occasion de prendre la parole parmi eux[b], et ils sauront que je suis Yahvé.
  rationale: La révision améliore l’idiomaticité française et rend plus précisément le syntagme hébreu « ouverture de bouche », tout en évitant de trancher entre permission, capacité restaurée et occasion de parler. Elle conserve les images de la corne et de la maison d’Israël ainsi que les deux ancres de notes.
