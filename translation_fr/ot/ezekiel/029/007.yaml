base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: fr
  text: Quand ils t’ont tenu en main[a], tu as cédé et tu leur as fendu chaque épaule. Quand ils se sont appuyés sur toi, tu t’es brisé et tu as fait vaciller tous leurs reins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le texte hébreu consonantique porte « dans ta main » ou « dans ta paume » ; le contexte appelle probablement « dans leur main ».
    reason: textual_or_grammatical_difficulty
  - marker: b
    text: Littéralement, « tu as fait tenir debout tous leurs reins ». Le sens exact de cette expression est incertain ; elle évoque ici ceux que la rupture de leur appui fait vaciller.
    reason: idiom_and_lexical_ambiguity
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: Quand ils t’ont saisi
  rationale: L’infinitif construit précédé de ב introduit une proposition temporelle. « Saisir » conserve l’image concrète de personnes empoignant le roseau qui devait leur servir d’appui.
- source_word: בכפך
  choice: dans leur main
  rationale: Dans le contexte de la métaphore du roseau, il s’agit naturellement de la main de ceux qui saisissent l’Égypte. Le texte consonantique porte toutefois un suffixe de deuxième personne, difficulté signalée en note.
- source_word: תֵּרוֹץ
  choice: tu t’es écrasé
  rationale: Le nifal de רצץ exprime l’idée d’être écrasé ou broyé. « T’es écrasé » le distingue de שבר dans la seconde moitié du verset.
- source_word: וּבָקַעְתָּ לָהֶם כָּל כָּתֵף
  choice: et tu leur as fendu toute l’épaule
  rationale: בקע signifie fendre ou ouvrir en fendant; « toute l’épaule » rend directement כָּל כָּתֵף et maintient l’image corporelle du roseau brisé qui blesse celui qui s’en sert.
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: Quand ils se sont appuyés sur toi
  rationale: La formulation garde le geste physique suggéré par le bâton de roseau, sans remplacer l’image par son interprétation politique (« compter sur toi »).
- source_word: תִּשָּׁבֵר
  choice: tu t’es brisé
  rationale: Le nifal de שבר décrit le roseau qui se brise. Le choix préserve le parallèle tout en distinguant ce verbe de רצץ.
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנָיִם
  choice: et tu as fait vaciller tous leurs reins
  rationale: מָתְנַיִם désigne les reins ou la région des hanches. Dans le contexte de l’appui qui cède, « faire vaciller » exprime l’effet déstabilisateur, tandis qu’une note conserve le sens plus littéral du verbe עמד.
theological_decisions:
- issue: Métaphore physique ou explicitation de la dépendance envers l’Égypte
  choice: Conserver l’image physique du roseau saisi et de ceux qui s’appuient sur lui.
  alternative: Rendre l’image par « quand ils comptaient sur toi » ou une autre formulation politique explicite.
  rationale: Le verset poursuit la métaphore du bâton de roseau du verset précédent. La conserver permet au lecteur de percevoir lui-même la portée politique et théologique de cette confiance trompée.
- issue: Sens de la dernière proposition
  choice: Exprimer la déstabilisation corporelle par « faire vaciller tous leurs reins ».
  alternative: Traduire formellement « faire tenir debout tous leurs reins » ou comprendre que leurs reins deviennent immobiles.
  rationale: Le sens exact de l’expression est difficile, mais le contexte indique que la rupture de l’appui déstabilise ceux qui s’y fiaient. La note préserve la formulation littérale sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et imagé. Le tutoiement convient à l’adresse prophétique directe à l’Égypte. « Reins » conserve le terme corporel biblique tout en restant compréhensible; les verbes distincts rendent autant que possible les trois racines hébraïques רצץ, בקע et שבר.
