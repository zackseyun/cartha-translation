  - severity: low
    issue: « t’ont saisi dans leur main »
    rationale: La construction est peu naturelle et ambiguë. « T’ont tenu en main » exprime idiomatiquement l’action physique tout en laissant la note présenter l’anomalie du suffixe de deuxième personne dans le texte consonantique.
