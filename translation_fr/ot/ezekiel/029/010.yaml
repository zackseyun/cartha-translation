  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: fr
  text: C’est pourquoi, me voici contre toi et contre les bras de ton Nil[a]. Je ferai du pays d’Égypte des ruines, une terre dévastée et désolée, de Migdol à Syène[b], et jusqu’à la frontière de Koush[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes fleuves » ou « tes canaux ». Dans les textes concernant l’Égypte, le terme hébreu désigne souvent le Nil, ses bras ou ses canaux.
    reason: lexical_alternative
  - marker: b
    text: Syène était une ville ancienne située près de l’actuelle Assouan et marquait la limite méridionale de l’Égypte.
    reason: cultural_note
  - marker: c
    text: Koush désigne la région au sud de l’Égypte, souvent associée à la Nubie, et non précisément le territoire de l’État moderne d’Éthiopie.
    reason: cultural_note
lexical_decisions:
- source_word: יְאֹרֶיךָ
  choice: les bras de ton Nil
  rationale: Dans un contexte égyptien, יְאֹר désigne habituellement le Nil, ses bras ou ses canaux. Le pluriel est rendu par « les bras », tandis que « ton Nil » conserve l’adresse directe au pharaon.
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: un champ de ruines, une terre dévastée et désolée
  rationale: L’hébreu accumule des termes proches pour intensifier l’image de destruction. Cette formulation française conserve cette force cumulative sans devenir obscure.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: de Migdol à Syène
  rationale: Les deux toponymes sont conservés sous leurs formes françaises usuelles; ils délimitent ici l’étendue de l’Égypte du nord au sud.
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: et jusqu’à la frontière de Koush
  rationale: « Koush » évite l’assimilation trompeuse au seul État moderne d’Éthiopie et désigne la région située au sud de l’Égypte, souvent associée à la Nubie.
- source_word: הִנְנִי אֵלֶיךָ
  choice: me voici contre toi
  rationale: Cette formule prophétique solennelle exprime clairement l’opposition divine tout en restant naturelle en français moderne.
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: Je ferai du pays d’Égypte
  rationale: Avec son complément de résultat, נתן a ici le sens de rendre ou transformer en un état donné; « je ferai de » restitue naturellement cet emploi.
