  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: fr
  text: 'Fils d’homme[a], Nabuchodonosor, roi de Babylone, a imposé à son armée un dur labeur contre Tyr : chaque tête était devenue chauve et chaque épaule était écorchée[b]. Pourtant, ni lui ni son armée n’ont reçu de salaire de Tyr pour le travail qu’il avait accompli contre elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mortel » ou « être humain ». L’hébreu dit littéralement « fils d’homme » ; c’est une manière courante de s’adresser à Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: L’image des têtes devenues chauves et des épaules écorchées évoque probablement les efforts physiques imposés par les travaux du siège.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule d’adresse récurrente dans Ézéchiel reproduit l’expression hébraïque tout en restant familière aux lecteurs francophones; une note signale son sens idiomatique possible.
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabuchodonosor, roi de Babylone
  rationale: La forme française traditionnelle et largement reconnue du nom est retenue, avec le titre rendu directement.
- source_word: הֶעֱבִיד אֶת חֵילוֹ עֲבֹדָה גְדֹלָה
  choice: a imposé à son armée un dur labeur
  rationale: Le causatif de עבד est exprimé par « a imposé », tandis que « un dur labeur » restitue l’intensité de עֲבֹדָה גְדֹלָה dans un français naturel et soutenu.
- source_word: אֶל צֹר
  choice: contre Tyr
  rationale: Dans ce contexte militaire, la préposition indique la direction hostile de l’effort de siège.
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: toutes les têtes en sont devenues chauves
  rationale: La formulation exprime l’état résultant du travail pénible sans préciser abusivement le mécanisme physique.
- source_word: וְכָל כָּתֵף מְרוּטָה
  choice: et toutes les épaules, écorchées
  rationale: « Écorchées » rend l’idée d’épaules mises à nu ou abrasées et conserve l’image concrète de l’hébreu.
- source_word: שָׂכָר
  choice: salaire
  rationale: Le mot désigne ici la rétribution attendue en contrepartie du travail militaire accompli.
- source_word: מִצֹּר
  choice: de Tyr
  rationale: La préposition indique la provenance du butin ou de la rétribution qui n’a finalement pas été obtenue.
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: pour le travail qu’il avait accompli contre elle
  rationale: La proposition explicite le travail non rétribué; « contre elle » garde la valeur militaire probable du suffixe renvoyant à Tyr.
theological_decisions:
- issue: Portée de l’appellation בֶּן אָדָם
  choice: Conserver « Fils d’homme » dans le texte
  alternative: « Mortel » ou « être humain »
  rationale: La traduction préserve la formule littéraire propre à Ézéchiel sans lui imposer ici une lecture christologique; la note donne le sens idiomatique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression de l’hébreu, tandis que « a imposé à son armée un dur labeur » évite un calque maladroit. Les images corporelles restent concrètes sans ajouter de cause absente du texte.
