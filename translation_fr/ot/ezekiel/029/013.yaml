    issue: Explicitation « ses habitants »
    rationale: Le pluriel du verbe hébreu renvoie vraisemblablement aux Égyptiens, mais « ses habitants » introduit une formulation possessive qui n’est pas dans le texte. « les Égyptiens » est plus direct et plus transparent.
  - severity: medium
    issue: Note a présentant une paraphrase comme littérale
    rationale: La note dit littéralement « parmi lesquels ils ont été dispersés », alors que la construction hébraïque est plus exactement « les peuples où/vers lesquels ils ont été dispersés là-bas ». La note doit être ajustée afin de ne pas suraffirmer l’équivalence formelle.
  revised_text: 'Car voici ce que dit le Seigneur Yahweh : Au terme de quarante ans, je rassemblerai l’Égypte du milieu des peuples parmi lesquels les Égyptiens ont été dispersés[a].'
