  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : Au terme de quarante ans, je rassemblerai l’Égypte du milieu des peuples parmi lesquels les Égyptiens ont été dispersés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des peuples où ils ont été dispersés là-bas ». Le pluriel renvoie vraisemblablement aux Égyptiens, désignés collectivement par « l’Égypte ».'
    reason: Clarifie le passage du nom collectif « l’Égypte » au pluriel du verbe hébreu, sans présenter comme strictement littérale une formulation française interprétative.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative du lien avec l’annonce précédente.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique naturelle et digne en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Au terme de quarante ans
  rationale: Exprime précisément l’achèvement de la période indiquée.
- source_word: אֲקַבֵּץ אֶת מִצְרַיִם
  choice: je rassemblerai l’Égypte
  rationale: Préserve l’Égypte comme entité collective et le sens de regroupement de קבץ.
- source_word: מִן הָעַמִּים
  choice: du milieu des peuples
  rationale: Rend le pluriel עַמִּים au plus près, sans imposer la notion politique de nations.
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: parmi lesquels ses habitants ont été dispersés
  rationale: Le sujet pluriel implicite du verbe renvoie aux membres du collectif « Égypte »; l’explicitation évite en français une rupture d’accord tout en conservant le sens.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La formulation choisie distingue le titre « Seigneur » du nom propre divin, conformément à la présence explicite du tétragramme dans l’hébreu.
- issue: Référent du pluriel נָפֹצוּ après le collectif מִצְרַיִם
  choice: ses habitants ont été dispersés
  alternative: ils ont été dispersés
  rationale: L’hébreu passe du nom collectif singulier « Égypte » à un verbe pluriel visant les Égyptiens. Le français explicite légèrement le référent afin de préserver cette relation sans ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule prophétique reste reconnaissable, et la légère explicitation « ses habitants » assure une lecture naturelle du collectif hébreu.
