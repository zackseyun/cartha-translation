source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: fr
  text: Je te jetterai dans le désert, toi et tous les poissons de tes canaux[a]. Tu tomberas en rase campagne ; tu ne seras ni ramassé ni recueilli[b]. Je t’ai livré en pâture[c] aux animaux sauvages et aux oiseaux du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner les bras du Nil ou les canaux qui en dépendent dans un contexte égyptien.
    reason: cultural_note
  - marker: b
    text: L’hébreu emploie deux verbes presque synonymes pour insister sur le fait que le corps ne sera pas récupéré ni enseveli.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « je t’ai donné comme nourriture ». Le passé présente ici le jugement à venir comme certain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Je te jetterai
  rationale: Dans ce contexte de jugement, נטשׁ évoque l’action de rejeter ou d’abandonner. « Jeter » rend ici la mise au rebut forcée du pharaon représenté comme un monstre aquatique, sans exclure l’idée qu’il sera ensuite délaissé.
- source_word: הַמִּדְבָּרָה
  choice: dans le désert
  rationale: La terminaison directionnelle exprime un mouvement vers ce lieu désolé. En français courant, « dans le désert » rend naturellement cette direction.
- source_word: דְּגַת יְאֹרֶיךָ
  choice: tous les poissons de tes canaux
  rationale: דְּגַת est un collectif. Dans un contexte égyptien, יְאֹר désigne souvent le Nil ou ses bras et canaux ; « canaux » convient au pluriel tout en restant naturel.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: en rase campagne
  rationale: L’expression décrit une chute à découvert, à la surface des terres. « En rase campagne » communique clairement l’exposition du corps sans calquer lourdement l’hébreu.
- source_word: תִּפּוֹל
  choice: Tu tomberas
  rationale: Le futur simple rend directement l’imparfait hébreu dans cette annonce de jugement.
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: tu ne seras ni ramassé ni recueilli
  rationale: Les deux verbes presque synonymes soulignent que le corps ne sera pas récupéré, notamment en vue d’une sépulture. Deux verbes distincts conservent cette insistance sans rendre l’implication explicite dans le texte.
- source_word: לְחַיַּת הָאָרֶץ
  choice: aux animaux sauvages
  rationale: Dans cette scène de cadavre exposé, חַיַּת désigne naturellement les bêtes sauvages ; cette formulation est claire et actuelle.
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: et aux oiseaux du ciel
  rationale: « Oiseaux du ciel » est une expression française naturelle qui conserve l’image biblique.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Je t’ai livré en pâture
  rationale: Le parfait hébreu présente le jugement futur comme certain. « Livré en pâture » rend avec dignité l’idée de donner quelqu’un comme nourriture.
theological_decisions:
- issue: Valeur du parfait prophétique dans la dernière proposition
  choice: Je t’ai livré en pâture
  alternative: Je te livrerai en pâture
  rationale: Le parfait נְתַתִּיךָ est conservé en français afin de présenter le jugement annoncé comme déjà arrêté et donc certain, sans le réduire à un simple futur.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme solennel de l’oracle est préservé, avec un vocabulaire concret. « En rase campagne » exprime l’exposition publique du corps, et « livré en pâture » maintient la gravité de l’image prophétique.
