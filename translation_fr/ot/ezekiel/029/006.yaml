reference: Ezekiel 29:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: fr
  text: Alors tous les habitants de l’Égypte sauront que je suis Yahweh, parce qu’ils ont été pour la maison d’Israël un bâton de roseau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un appui de roseau ». L’image hébraïque évoque ce qui sert de soutien, mais qui est trop fragile pour porter le poids qu’on lui confie.
    reason: Précision lexicale et explicitation de l’image.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors … sauront
  rationale: Dans ce discours prophétique, la conjonction fait avancer la conséquence annoncée. « Alors » exprime naturellement cette progression, et le futur convient à la formule de reconnaissance fréquente chez Ézéchiel.
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: tous les habitants de l’Égypte
  rationale: Rend clairement le sens collectif de « tous ceux qui habitent en Égypte » dans un français moderne et naturel.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Préserve la formule de reconnaissance d’Ézéchiel et rend directement le nom divin יהוה par « Yahweh ».
- source_word: יַעַן הֱיוֹתָם
  choice: parce qu’ils ont été
  rationale: יַעַן introduit le motif, tandis que l’infinitif construit avec suffixe se transpose naturellement en proposition verbale française. Le passé composé exprime l’état historique pertinent pour le jugement annoncé.
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: un bâton de roseau
  rationale: Conserve l’image concrète d’un appui fragile sur lequel on cherche à s’appuyer; « bâton de roseau » reste intelligible et prépare l’image développée au verset suivant.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: La préposition marque ici la relation avec Israël. « Pour » est plus idiomatique en français que « à » tout en conservant l’expression collective et historique « maison d’Israël ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » le présente comme un nom propre et suit la décision fournie, sans le remplacer par un titre.
- issue: Nature du soutien apporté par l’Égypte à Israël
  choice: Conserver la métaphore du « bâton de roseau »
  alternative: un soutien peu fiable
  rationale: Le texte ne formule pas seulement un jugement abstrait sur la fiabilité de l’Égypte; il emploie une image dont la portée est développée au verset suivant. La traduction préserve donc cette tension imagée sans l’expliciter dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche de l’hébreu sans être artificielle; la métaphore et l’expression « maison d’Israël » sont conservées.
