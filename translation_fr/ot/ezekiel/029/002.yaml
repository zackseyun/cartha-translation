source:
  edition: WLC
  text: בֶּן אָדָ֕ם שִׂ֣ים פָּנֶ֔י/ךָ עַל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וְ/הִנָּבֵ֣א עָלָ֔י/ו וְ/עַל מִצְרַ֖יִם כֻּלָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/002.yaml
  text: Son of man[a], set your face against Pharaoh king of Egypt, and prophesy against him and against all Egypt.
translation:
  language: fr
  text: Fils d’homme[a], tourne ton visage contre le pharaon, roi d’Égypte, et prophétise contre lui et contre l’Égypte tout entière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mortel, tourne ton visage contre le pharaon… » L’expression hébraïque בֶּן אָדָם est un titre récurrent donné à Ézéchiel; elle peut aussi se traduire par « être humain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse récurrente donnée à Ézéchiel. Cette traduction conventionnelle conserve l’image hébraïque et le masculin singulier, sans réduire l’expression au seul sens interprétatif de « mortel ».
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: L’expression décrit une orientation volontaire et résolue. En français actuel, « tourne ton visage » conserve l’image corporelle plus naturellement que « fixe ton visage »; « contre » explicite ici l’orientation hostile.
- source_word: עַל
  choice: contre
  rationale: Dans cet oracle de jugement, la préposition a une valeur adversative aussi bien avec l’orientation du visage qu’avec l’acte de prophétiser.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal établi en français; l’article défini est idiomatique lorsque le titre est employé seul et précisé par l’apposition « roi d’Égypte ».
- source_word: מֶלֶךְ מִצְרַיִם
  choice: roi d’Égypte
  rationale: La construction hébraïque identifie le pharaon par une apposition, rendue directement et naturellement en français.
- source_word: וְהִנָּבֵא
  choice: et prophétise
  rationale: Rend directement l’impératif niphal de נבא et préserve le vocabulaire formel de la mission prophétique.
- source_word: עָלָיו
  choice: contre lui
  rationale: Le contexte de jugement favorise le sens adversatif plutôt que le sens simplement thématique « à son sujet ».
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: l’Égypte tout entière
  rationale: Cette formulation naturelle exprime clairement que l’oracle vise l’ensemble du pays ou de la nation.
theological_decisions: []
