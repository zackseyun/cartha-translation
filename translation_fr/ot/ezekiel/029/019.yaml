source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : « Voici, je donne le pays d’Égypte à Nabuchodonosor, roi de Babylone. Il en emportera les richesses[a], en prendra les dépouilles et en saisira le butin ; ce sera le salaire de son armée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « sa multitude » ou « son abondance ». Dans ce contexte de dépouilles et de butin, il désigne probablement les richesses de l’Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence de l’oracle précédent dans un français naturel et soutenu.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager de façon actuelle, claire et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue אֲדֹנָי, « Seigneur », du nom divin יהוה, transcrit « Yahweh », sans produire la tournure ambiguë « le Seigneur, l’Éternel ».
- source_word: הִנְנִי נֹתֵן
  choice: Voici, je donne
  rationale: Le présent, introduit par « Voici », exprime l’action annoncée comme imminente et certaine, conformément à la construction hébraïque.
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: Conserve le sens territorial de אֶרֶץ tout en employant une formulation française idiomatique.
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: Il en emportera les richesses
  rationale: הָמוֹן peut désigner une multitude ou une abondance ; dans ce contexte de dépouilles, de butin et de rémunération militaire, « richesses » exprime probablement le sens visé sans masquer l’alternative.
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: en prendra les dépouilles
  rationale: Rend le couple verbal et nominal apparenté par une expression militaire française naturelle.
- source_word: וּבָזַז בִּזָּהּ
  choice: en saisira le butin
  rationale: Préserve le parallélisme avec la proposition précédente tout en évitant en français une répétition artificielle du type « pillera son pillage ».
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: ce sera le salaire de son armée
  rationale: שָׂכָר désigne une rémunération et חַיִל, dans ce contexte, la force militaire du roi.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: La transcription « Yahweh » conserve explicitement le nom divin présent dans l’hébreu et distingue les deux éléments du titre, sans ajouter une interprétation confessionnelle.
- issue: Nature du don de l’Égypte à Nabuchodonosor
  choice: je donne le pays d’Égypte à Nabuchodonosor
  alternative: je vais donner le pays d’Égypte à Nabuchodonosor
  rationale: Le présent conserve la vigueur de l’annonce divine et sa certitude, sans préciser davantage que l’hébreu le rapport temporel exact.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue sans archaïsme excessif. Les termes « dépouilles », « butin » et « salaire » maintiennent le registre militaire et économique du passage.
