source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: fr
  text: Je ferai du pays d’Égypte une désolation parmi des pays dévastés[a], et ses villes seront une désolation parmi des villes en ruine pendant quarante ans ; je disperserai l’Égypte parmi les nations et je les disséminerai à travers les pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu de pays dévastés ». Les termes hébreux employés dans les deux propositions parallèles évoquent étroitement la dévastation et la ruine.
    reason: lexical_alternative
  - marker: b
    text: 'Il s’agit des habitants de l’Égypte : l’hébreu passe du nom de lieu « Égypte » au pronom pluriel « les ».'
    reason: referent_clarification
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai de
  rationale: Dans cette construction, נתן avec un complément d’état signifie rendre ou faire devenir; cette tournure française en restitue naturellement la valeur causative.
- source_word: אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: Le texte nomme explicitement le pays d’Égypte; « pays » conserve l’accent territorial du jugement.
- source_word: שְׁמָמָה
  choice: un lieu dévasté / des lieux dévastés
  rationale: Le substantif exprime un état de désolation complète. Cette formulation nominale est naturelle en français et préserve l’image concrète.
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: parmi des pays dévastés
  rationale: בְּתוֹךְ situe ici l’Égypte au nombre des territoires déjà dévastés; « parmi » est idiomatique et fidèle au rapport locatif.
- source_word: וְעָרֶיהָ
  choice: et ses villes
  rationale: Le possessif français renvoie naturellement au pays d’Égypte, sans reproduire artificiellement le genre grammatical hébreu.
- source_word: בְּתוֹךְ עָרִים מָחֳרָבוֹת
  choice: parmi des villes en ruine
  rationale: מָחֳרָבוֹת désigne des villes ruinées ou dévastées. « En ruine » préserve le parallélisme tout en évitant une répétition lourde.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Rend directement la durée indiquée par l’hébreu.
- source_word: וַהֲפִצֹתִי אֶת מִצְרַיִם
  choice: Je disperserai l’Égypte
  rationale: Le texte conserve le nom géographique מִצְרַיִם, employé par métonymie pour ses habitants; la formulation française maintient ce glissement prophétique.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Traduction usuelle et contextuellement appropriée de גּוֹיִם dans un oracle de jugement.
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: et je les disséminerai dans différents pays
  rationale: זרה exprime l’action d’éparpiller ou de disséminer. « Différents pays » communique ici la répartition à travers plusieurs territoires sans alourdir le français.
theological_decisions:
- issue: Référent de « l’Égypte » dans la clause de dispersion
  choice: Conserver « l’Égypte », puis le pronom pluriel « les »
  alternative: Expliciter « les Égyptiens » dans les deux propositions
  rationale: L’hébreu passe du nom de lieu מִצְרַיִם à un suffixe objet pluriel. La traduction conserve cette métonymie et son léger changement de référence, tandis que la note précise que les habitants sont visés.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme prophétique est conservé, avec une légère variation lexicale naturelle entre « dévastés » et « en ruine ». Tous les marqueurs de notes figurent dans le texte.
