revisions:
- from: Je ferai du pays d’Égypte un lieu dévasté parmi des pays dévastés[a], et ses villes seront des lieux dévastés parmi des villes en ruine pendant quarante ans. Je disperserai l’Égypte parmi les nations et je les disséminerai dans différents pays[b].
  to: Je ferai du pays d’Égypte une désolation parmi des pays dévastés[a], et ses villes seront une désolation parmi des villes en ruine pendant quarante ans ; je disperserai l’Égypte parmi les nations et je les disséminerai à travers les pays[b].
  rationale: La révision remplace l’ajout interprétatif « différents pays » par « à travers les pays » et rend שְׁמָמָה par « désolation », en conservant le parallélisme, la métonymie « Égypte » et les deux ancres de note.
