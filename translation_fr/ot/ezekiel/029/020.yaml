source:
  edition: WLC
  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Comme salaire pour le travail qu’il a accompli contre elle[a], je lui ai donné le pays d’Égypte, parce qu’ils ont travaillé pour moi[b]. Déclaration du Seigneur, l’Éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En rémunération du travail qu’il a accompli contre elle. » Le nom hébreu peut désigner le travail, l’acte accompli ou la rémunération. « Elle » renvoie probablement à Tyr (voir 29.18).'
    reason: Alternative lexicale et précision du référent pronominal.
  - marker: b
    text: 'Ou : « parce qu’ils ont agi pour moi » ou « parce qu’ils ont fait cela pour moi ».'
    reason: Le verbe hébreu a le sens large de faire ou d’agir.
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: Comme salaire
  rationale: Le nom peut désigner le travail, l’acte accompli ou sa rétribution. Ici, le don de l’Égypte à Nabuchodonosor en contrepartie de sa campagne favorise le sens de « salaire », tout en laissant l’autre possibilité en note.
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: pour le travail qu’il a accompli contre elle
  rationale: עבד signifie travailler ou servir. Dans le contexte militaire précédent, le suffixe féminin renvoie très probablement à Tyr et la préposition prend naturellement le sens contextuel de « contre ».
- source_word: נָתַתִּי לוֹ
  choice: je lui ai donné
  rationale: Le parfait hébreu présente le don comme décidé ou accompli. Le passé composé est naturel en français et conserve cette valeur.
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: Cette formulation rend explicitement אֶרֶץ et souligne le territoire donné.
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: parce qu’ils ont travaillé pour moi
  rationale: Le verbe עשה signifie largement « faire » ou « agir ». Le contexte de travail et de rémunération justifie « travaillé », sans effacer l’ambiguïté, signalée en note.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Déclaration du Seigneur, de l’Éternel
  rationale: « Déclaration » restitue la formule prophétique נְאֻם. « Le Seigneur, l’Éternel » distingue אֲדֹנָי du nom divin יהוה selon une convention française claire et digne.
theological_decisions:
- issue: Référent du suffixe féminin dans בָּהּ
  choice: Le pronom « elle » renvoie à Tyr, mentionnée dans le contexte immédiat.
  alternative: Le suffixe pourrait se rapporter plus généralement à la tâche ou au service militaire.
  rationale: Ézéchiel 29.18 décrit le dur service de Nabuchodonosor contre Tyr; ce référent explique le don de l’Égypte comme salaire. La note maintient le lien contextuel sans remplacer le pronom dans le texte.
- issue: Portée de « ils ont travaillé pour moi »
  choice: Nabuchodonosor et ses troupes ont servi d’instruments à l’action judiciaire de Dieu.
  alternative: Ils auraient agi uniquement en fonction de leurs objectifs impériaux, sans être décrits comme travaillant pour Dieu.
  rationale: Le texte affirme explicitement qu’ils ont agi ou travaillé « pour moi ». La traduction conserve cette tension sans suggérer que Dieu approuve toutes leurs motivations ou leurs actions.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe a été légèrement réorganisée pour éviter l’expression peu idiomatique « son salaire pour lequel il a travaillé ». Les pronoms singulier puis pluriel sont conservés : le premier vise Nabuchodonosor, le second inclut vraisemblablement ses forces.'
