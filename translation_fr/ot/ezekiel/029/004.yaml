source:
  edition: WLC
  text: וְ/נָתַתִּ֤י חחיים בִּ/לְחָיֶ֔י/ךָ וְ/הִדְבַּקְתִּ֥י דְגַת יְאֹרֶ֖י/ךָ בְּ/קַשְׂקְשֹׂתֶ֑י/ךָ וְ/הַעֲלִיתִ֨י/ךָ֙ מִ/תּ֣וֹךְ יְאֹרֶ֔י/ךָ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ בְּ/קַשְׂקְשֹׂתֶ֖י/ךָ תִּדְבָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: fr
  text: Je mettrai des crochets dans tes mâchoires[a] et je ferai adhérer à tes écailles les poissons de tes cours d’eau du Nil[b]. Je te ferai remonter du milieu de tes cours d’eau du Nil, et tous les poissons de tes cours d’eau du Nil adhéreront à tes écailles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes joues ». Le mot hébreu peut désigner la mâchoire ou la joue.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes fleuves » ou « tes canaux ». Dans les textes concernant l’Égypte, le terme hébreu désigne le Nil et les voies d’eau qui en dépendent.
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: des crochets
  rationale: Le terme désigne ici des instruments servant à saisir ou à tirer un animal par les mâchoires. « Crochets » convient naturellement à l’image du grand animal fluvial capturé.
- source_word: בִּלְחָיֶיךָ
  choice: dans tes mâchoires
  rationale: לְחִי peut désigner la mâchoire ou la joue. Avec des crochets placés dans un grand animal fluvial, « mâchoires » rend le mieux l’image sans effacer l’autre sens possible, signalé en note.
- source_word: וְהִדְבַּקְתִּי
  choice: je ferai adhérer
  rationale: La forme causative de דבק indique que Dieu fera en sorte que les poissons restent attachés aux écailles. « Faire adhérer » conserve clairement cette valeur causative.
- source_word: דְגַת
  choice: les poissons de
  rationale: Le nom collectif à l’état construit est rendu naturellement en français par le pluriel « les poissons de ».
- source_word: יְאֹרֶיךָ
  choice: tes bras du Nil
  rationale: Dans les oracles concernant l’Égypte, יְאֹר désigne le Nil et son réseau de cours d’eau. « Bras du Nil » maintient l’ancrage égyptien et le pluriel, sans réduire le terme à des rivières génériques.
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: à tes écailles
  rationale: Avec דבק, la préposition exprime l’attachement. « Adhérer à tes écailles » est idiomatique et fidèle à l’image.
- source_word: וְהַעֲלִיתִיךָ
  choice: je te tirerai
  rationale: La forme causative de עלה signifie faire monter ou faire sortir. Dans la scène d’un animal pris au moyen de crochets, « tirer » exprime naturellement son extraction de l’eau sans ajouter de détail étranger au texte.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Cette expression souligne que l’animal est retiré de l’intérieur même des eaux du Nil.
- source_word: תִּדְבָּק
  choice: adhéreront
  rationale: Le verbe décrit les poissons restant attachés aux écailles. Le pluriel français s’accorde naturellement avec « tous les poissons ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « tes bras du Nil » est conservée pour refléter l’insistance du texte hébreu; la dernière proposition est intégrée avec « avec » afin d’exprimer naturellement que tous les poissons sont remontés avec le grand animal.
