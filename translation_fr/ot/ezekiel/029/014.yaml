  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: fr
  text: Je rétablirai la situation de l’Égypte[a] et je les ramènerai au pays de Patros, leur terre d’origine[b]. Là, ils seront un royaume abaissé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ramènerai les captifs de l’Égypte » ou « je restaurerai la captivité de l’Égypte ». L’expression hébraïque peut être rendue plus littéralement, mais elle désigne probablement ici, de façon plus large, le rétablissement de la situation de l’Égypte.'
    reason: lexical_alternative
  - marker: b
    text: Patros était une région de la Haute-Égypte, présentée ici comme la terre d’origine des Égyptiens.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת מִצְרַיִם
  choice: Je rétablirai la situation de l’Égypte
  rationale: L’expression idiomatique שׁוּב שְׁבוּת désigne souvent le rétablissement de la condition ou du sort d’un peuple. Le retour physique étant exprimé dans la proposition suivante, cette formulation naturelle évite une répétition tout en préservant l’idée de restauration.
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: et je les ramènerai
  rationale: 'Le hifil de שׁוּב a ici une valeur causative : Dieu fait revenir les Égyptiens. « Je les ramènerai » exprime clairement ce sens en français courant.'
- source_word: אֶרֶץ פַּתְרוֹס
  choice: au pays de Patros
  rationale: Le nom propre est translittéré, et אֶרֶץ est rendu par « pays », terme naturel pour désigner cette région.
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: leur terre d’origine
  rationale: מְכוּרָה désigne le lieu d’origine ou de naissance. La proposition est comprise comme une apposition précisant Patros; « leur terre d’origine » est clair et concis.
- source_word: וְהָיוּ שָׁם
  choice: Là, ils formeront
  rationale: La mise en tête de « Là » conserve l’accent porté sur le lieu. « Formeront » convient naturellement en français à ce qu’un peuple constitue un royaume.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: un royaume de peu d’importance
  rationale: שָׁפָל signifie bas, abaissé ou humble. Dans ce contexte politique, la formule indique un royaume de rang et de puissance réduits, sans suggérer une vertu morale d’humilité.
theological_decisions:
- issue: Sens de l’expression de restauration שׁוּב שְׁבוּת
  choice: rétablir la situation de l’Égypte
  alternative: ramener les captifs de l’Égypte / mettre fin à la captivité de l’Égypte
  rationale: L’hébreu permet une lecture plus concrète liée aux captifs ou à la captivité, mais l’expression fonctionne souvent comme un idiome de renversement de situation. La mention immédiate du retour à Patros favorise ici le sens plus large, tout en signalant l’autre possibilité en note.
- issue: Valeur de עַל dans עַל אֶרֶץ מְכוּרָתָם
  choice: 'apposition : « leur terre d’origine »'
  alternative: sur la terre de leur origine
  rationale: Même si עַל signifie souvent « sur », le contexte de déplacement et le parallélisme avec « au pays de Patros » permettent une valeur directionnelle ou appositionnelle. La formulation choisie préserve le sens sans lourdeur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, tout en employant des formulations naturelles. « Royaume de peu d’importance » rend l’abaissement politique impliqué par שְׁפָלָה sans connotation morale indue.
