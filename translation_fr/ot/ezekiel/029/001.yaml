source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָ/עֲשִׂירִ֔ית בָּ/עֲשִׂרִ֕י בִּ/שְׁנֵ֥ים עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La dixième année, le dixième mois, le douzième jour du mois, la parole de Yahvé me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: La dixième année
  rationale: L’hébreu ne précise pas ici le point de départ de cette datation; la traduction n’ajoute donc ni exil ni règne.
- source_word: בָּעֲשִׂרִי
  choice: le dixième mois
  rationale: Le mot « mois » est sous-entendu dans la formule de datation hébraïque et doit être explicité en français.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: le douzième jour du mois
  rationale: Le mot « jour » est implicite en hébreu; son ajout donne en français la formulation normale d’une date.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahvé me fut adressée
  rationale: Cette formulation française naturelle rend la formule prophétique indiquant que la parole divine parvient au prophète.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du tétragramme conserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit le contenu du discours qui suit; cette tournure est naturelle et digne en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » en conserve la fonction de nom propre, tandis que « le SEIGNEUR » serait une substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La cadence de la formule chronologique est conservée, sans ajouter de repère historique absent de l’hébreu.
