  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: fr
  text: L’Égypte ne sera plus pour la maison d’Israël un appui[a], rappelant leur faute[b] lorsqu’ils se tourneront vers eux. Alors ils sauront que je suis le Seigneur Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet de confiance » ou « une sécurité ». Le terme hébreu désigne ce sur quoi l’on compte pour être en sécurité.
    reason: lexical_alternative
  - marker: b
    text: Ou « rappelant leur culpabilité ». Le mot hébreu peut désigner la faute commise ou la culpabilité qui en résulte.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte Adonaï YHWH, littéralement « Seigneur YHWH » ; le nom YHWH est rendu ici par « Yahweh ».
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: ne sera plus
  rationale: Exprime naturellement en français la cessation durable et la portée future de la négation avec עוֹד.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: Conserve l’expression collective et théologique « maison d’Israël », tout en rendant la préposition ל selon la construction prédicative.
- source_word: לְמִבְטָח
  choice: un objet de confiance
  rationale: Désigne ce sur quoi l’on compte pour être en sécurité. Cette formulation souligne qu’Israël plaçait sa confiance en l’Égypte sans présenter celle-ci comme réellement sûre.
- source_word: מַזְכִּיר עָוֺן
  choice: qui rappellerait sa faute
  rationale: Rend le participe causatif de זכר et garde à עָוֺן son sens moral de faute, sans exclure la nuance de culpabilité.
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: lorsqu’elle se tournera vers les Égyptiens
  rationale: Le singulier collectif « elle » reprend la maison d’Israël; « les Égyptiens » explicite le référent contextuel du suffixe masculin pluriel, tout en conservant l’image du mouvement vers eux pour chercher leur soutien.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le passage du collectif singulier au pluriel reflète l’hébreu et « alors » fait ressortir la conséquence contextuelle.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement אֲדֹנָי par « Seigneur » et le nom divin יהוה par « Yahweh », sans confondre les deux éléments du titre.
theological_decisions:
- issue: Nature de la confiance d’Israël en l’Égypte
  choice: un objet de confiance
  alternative: une sécurité; un appui
  rationale: Le texte critique l’Égypte comme puissance en laquelle Israël se confiait; il ne dit pas qu’elle procurait objectivement une sécurité véritable.
- issue: Sens de עָוֺן
  choice: faute
  alternative: culpabilité; iniquité
  rationale: « Faute » conserve l’idée de conduite coupable tout en laissant ouverte la gamme sémantique entre l’acte fautif et la culpabilité qui en résulte.
- issue: Rendu du titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur YHWH; le Seigneur DIEU
  rationale: Ce rendu distingue le titre אֲדֹנָי du nom propre divin יהוה et préserve explicitement le nom de l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom « Égypte » est repris au début pour rendre explicite le sujet fourni par le contexte immédiat. L’alternance entre « elle » (la maison, collectif singulier) et « ils » suit le passage hébreu du singulier collectif au verbe pluriel.
