source:
  edition: WLC
  text: וְ/הָיְתָ֤ה אֶֽרֶץ מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה וְ/חָרְבָּ֔ה וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה יַ֧עַן אָמַ֛ר יְאֹ֥ר לִ֖/י וַ/אֲנִ֥י עָשִֽׂיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: fr
  text: 'Le pays d’Égypte deviendra une désolation et une ruine. Alors ils sauront que je suis Yahvé, parce qu’il a dit : « Le Nil[a] est à moi ; c’est moi qui l’ai fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le fleuve » ; dans le contexte de l’Égypte, il s’agit du Nil.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction exprime le résultat futur du jugement. « Deviendra » rend clairement le passage à cet état.
- source_word: אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: Cette formulation conserve la dimension territoriale de אֶרֶץ tout en étant naturelle en français moderne.
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: un lieu dévasté et en ruine
  rationale: Les deux termes associés décrivent un état de désolation et de destruction. Cette tournure garde leur effet cumulatif sans produire une formulation française artificielle.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le pluriel indéterminé de l’hébreu est maintenu. « Alors » exprime naturellement la conséquence dans la formule de reconnaissance fréquente chez Ézéchiel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription française usuelle « Yahvé » rend directement le nom divin plutôt que de le remplacer par un titre.
- source_word: יַעַן אָמַר
  choice: parce qu’il a dit
  rationale: יַעַן introduit le motif du jugement, tandis que le sujet masculin singulier implicite du verbe est conservé sans être explicité au-delà du texte.
- source_word: יְאֹר
  choice: le Nil
  rationale: En contexte égyptien, יְאֹר désigne le Nil. Une note conserve toutefois le sens lexical plus littéral, « le fleuve ».
- source_word: לִי
  choice: est à moi
  rationale: Cette construction possessive concise rend la revendication arrogante du locuteur.
- source_word: וַאֲנִי עָשִׂיתִי
  choice: c’est moi qui l’ai fait
  rationale: La tournure clivée française restitue l’insistance portée par le pronom indépendant אֲנִי, tout en gardant le sens courant de עשה, « faire ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahvé », forme française courante, préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de la prétention « c’est moi qui l’ai fait »
  choice: Conserver l’affirmation sans l’expliquer
  alternative: Préciser qu’il s’agit d’une prétention du pharaon à avoir créé ou aménagé le Nil
  rationale: Le texte laisse subsister la tension de cette parole orgueilleuse. La traduction ne tranche pas entre une prétention à la création et une revendication liée à la maîtrise du fleuve.
translation_notes:
  register: Français international moderne, clair et digne. La phrase directe conserve la force de l’oracle et l’emphase du locuteur. Le marqueur de note [a] est placé après « Nil », le mot auquel la note se rapporte.
