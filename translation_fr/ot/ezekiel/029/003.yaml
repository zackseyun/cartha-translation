    issue: Article défini et rendu du participe descriptif
    rationale: L’hébreu porte « le grand monstre » et le participe הָרֹבֵץ décrit une bête couchée/gisant. Ajouter « le » et employer « couché » reproduit plus précisément l’image sans la surinterpréter.
  - severity: low
    issue: Expression de l’opposition divine
    rationale: « Me voici contre toi » est compréhensible, mais « Voici, je suis contre toi » restitue plus naturellement en français l’emphase de הִנְנִי suivie de « contre toi ».
  - severity: low
    issue: Pluriel des voies du Nil
    rationale: « Bras de ton Nil » est possible, mais « tes canaux du Nil » rend de façon plus explicite et moins interprétative le pluriel יְאֹרָיו dans ce contexte égyptien.
