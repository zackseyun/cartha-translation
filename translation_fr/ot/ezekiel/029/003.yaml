  to: 'Parle et dis : « Ainsi parle le Seigneur Yahweh : Voici, je suis contre toi, pharaon, roi d’Égypte, le grand monstre[a] couché au milieu de tes canaux du Nil, qui dis : “Mon Nil est à moi, et je me suis fait moi-même[b].” »'
