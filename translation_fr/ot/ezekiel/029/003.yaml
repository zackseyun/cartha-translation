base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: fr
  text: 'Parle et dis : « Ainsi parle le Seigneur Yahweh : Voici, je suis contre toi, pharaon, roi d’Égypte, le grand monstre[a] couché au milieu de tes canaux du Nil, qui dis : “Mon Nil est à moi, et je me suis fait moi-même[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand dragon » ; dans ce contexte, l’image peut aussi évoquer un monstre du Nil ressemblant à un crocodile.
    reason: lexical_alternative
  - marker: b
    text: 'Autre interprétation : « Mon fleuve est à moi, et je l’ai fait pour moi. » L’hébreu peut être compris comme une prétention du pharaon soit à s’être fait lui-même, soit à avoir fait le Nil pour son propre usage.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, tout en évitant la formulation artificielle « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי עָלֶיךָ
  choice: Me voici contre toi
  rationale: « Me voici » conserve la force emphatique de הִנְנִי, tandis que « contre toi » exprime le sens hostile de עַל dans ce contexte.
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: grand monstre
  rationale: תַּנִּים désigne ici une immense créature reptilienne ou monstrueuse. « Monstre » préserve la puissance symbolique de l’image sans la réduire avec certitude à un crocodile.
- source_word: הָרֹבֵץ
  choice: étendu
  rationale: Le participe de רבץ évoque une créature couchée, tapie ou étendue. « Étendu » convient naturellement à l’image du monstre installé dans les eaux du Nil.
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: au milieu des bras de ton Nil
  rationale: Dans le cadre égyptien, יְאֹר désigne le Nil ou ses canaux. Le pluriel est rendu par « bras », et la troisième personne hébraïque est naturellement adaptée à l’apostrophe directe adressée au pharaon.
- source_word: לִי יְאֹרִי
  choice: Mon Nil est à moi
  rationale: La formulation volontairement insistante reproduit la revendication de possession exprimée par le pronom indépendant et le suffixe possessif.
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: et je me suis fait moi-même
  rationale: Le suffixe de première personne sur le verbe soutient la lecture réflexive. « Moi-même » rend explicite en français la prétention frappante du pharaon à s’être fait lui-même.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix maintient à la fois le titre souverain et le nom personnel divin présent dans l’hébreu, sans les fondre en un titre générique.
- issue: Sens de la vantardise וַאֲנִי עֲשִׂיתִנִי
  choice: le pharaon affirme s’être fait lui-même
  alternative: le pharaon affirme avoir fait le Nil pour lui-même
  rationale: La forme massorétique favorise l’objet de première personne, d’où la lecture réflexive. L’autre interprétation, possible dans le contexte de la revendication sur le Nil, est conservée en note afin de ne pas supprimer l’ambiguïté traditionnelle.
translation_notes:
  register: Français international moderne, solennel et accessible. La structure prophétique « Parle et dis » est conservée, ainsi que l’emphase de « Me voici contre toi ». L’adresse directe au pharaon motive « ton Nil », plus naturel en français que le passage soudain à « son Nil ».
