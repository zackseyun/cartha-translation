  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: fr
  text: Elle sera le plus abaissé des royaumes[a] et ne s’élèvera plus au-dessus des nations. Je les rendrai peu nombreux[b], afin qu’ils ne dominent pas sur les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les royaumes ». Le terme hébreu évoque une condition basse et abaissée; la construction établit une comparaison avec les autres royaumes.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je les rendrai peu nombreux ». Le pronom pluriel désigne collectivement les habitants ou les forces de l’Égypte; la suite peut se comprendre : « afin qu’ils ne dominent pas sur les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: Elle sera la plus humble des monarchies
  rationale: 'Avec מִן, l’adjectif שְׁפָלָה prend ici une valeur comparative ou superlative : l’Égypte sera abaissée par rapport aux autres royaumes. « La plus humble » exprime cet abaissement de manière naturelle, tandis que « monarchies » évite la répétition avec le verbe « dominer ».'
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד עַל הַגּוֹיִם
  choice: et ne s’élèvera plus au-dessus des nations
  rationale: La forme verbale peut évoquer le fait de s’élever ou de s’exalter. « S’élèvera » conserve l’image verticale et l’ambiguïté entre élévation et auto-exaltation; עַל est naturellement rendu par « au-dessus de ».
- source_word: וְהִמְעַטְתִּים
  choice: Je réduirai sa population
  rationale: Le hiphil de מעט signifie rendre peu nombreux ou diminuer. Le suffixe masculin pluriel renvoie collectivement aux habitants ou aux forces de l’Égypte; l’explicitation « sa population » rend ce référent clair en français.
- source_word: לְבִלְתִּי רְדוֹת בַּגּוֹיִם
  choice: afin qu’elle ne domine plus sur les nations
  rationale: לְבִלְתִּי exprime ici le but ou le résultat empêché. רדה désigne l’exercice de la domination, et « dominer sur » restitue idiomatiquement la relation de pouvoir exprimée par בַּגּוֹיִם.
theological_decisions:
- issue: Sujet grammatical de la proposition finale
  choice: « elle », renvoyant à l’Égypte comme entité politique
  alternative: « ils », renvoyant à ses habitants ou à ses forces
  rationale: L’hébreu emploie un infinitif sans sujet exprimé après un suffixe pluriel. Le contexte général maintient l’Égypte comme sujet politique; la note signale toutefois l’autre rattachement possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image de l’abaissement et de l’élévation, tout en explicitant avec prudence le référent collectif du suffixe pluriel.
