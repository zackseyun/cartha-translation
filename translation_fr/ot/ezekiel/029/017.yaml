source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La vingt-septième année, le premier jour du premier mois, la parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: La vingt-septième année…
  rationale: Dans cette formule de datation, le verbe introductif peut rester implicite en français naturel; la proposition principale « la parole… me fut adressée » porte l’événement.
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: La vingt-septième année
  rationale: Le cardinal hébreu employé dans une formule calendaire se rend naturellement par l’ordinal français.
- source_word: בָּרִאשׁוֹן
  choice: le premier mois
  rationale: Le mot « mois », sous-entendu en hébreu, est explicité conformément au sens clair de la formule de datation.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Littéralement « le un du mois »; l’expression désigne sans ambiguïté le premier jour du mois.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Formulation prophétique française courante qui exprime naturellement la réception de la révélation sans suggérer un simple déplacement matériel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du tétragramme, qui conserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit naturellement en français le discours direct qui commence au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom propre divin; « Yahweh » le représente directement, sans remplacer le nom par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La syntaxe suit la formule française habituelle de datation prophétique; aucune note n’est nécessaire, puisque « le premier jour du mois » explicite fidèlement l’idiome hébreu.
