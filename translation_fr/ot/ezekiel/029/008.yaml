  source_fidelity: 'Le sens global est fidèle : la formule prophétique, le titre divin, l''annonce imminente, l''hostilité de l''épée et le jugement sur les humains et les bêtes sont tous bien rendus. Toutefois, חָרֶב est indéfini dans le texte hébreu (« une épée »). Le défini français « l’épée » est possible comme image collective, mais il réduit légèrement l''indétermination du singulier source, tandis que la note a présente précisément « une épée » comme variante.'
  naturalness: Le français est clair, moderne et d'un registre prophétique approprié. « Voici que je fais venir » et « j’éliminerai de chez toi » sont naturels dans ce contexte d'adresse à l'Égypte personnifiée. Le changement à « une épée » demeure tout aussi idiomatique.
