source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Voici que je fais venir contre toi une épée[a], et j’éliminerai de chez toi les êtres humains et les bêtes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une épée ». Le singulier peut aussi représenter collectivement la guerre et le jugement.
    reason: lexical_alternative
  - marker: b
    text: L’expression « êtres humains et bêtes » est une formule de jugement qui englobe la population humaine et les animaux.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence judiciaire découlant de l’accusation précédente et conserve l’enchaînement logique de l’oracle.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule consacrée du messager prophétique, naturelle en français biblique moderne et digne sans être archaïque.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Rend les deux éléments du titre composé : אֲדֹנָי par « le Seigneur » et le nom divin יהוה par « Yahweh ».'
- source_word: הִנְנִי מֵבִיא
  choice: Voici que je fais venir
  rationale: הִנְנִי met solennellement en relief l’action divine, tandis que le participe מֵבִיא présente celle-ci comme imminente.
- source_word: עָלַיִךְ חָרֶב
  choice: contre toi l’épée
  rationale: La préposition exprime ici l’hostilité, et « l’épée » fonctionne naturellement en français comme image collective de la guerre et du jugement.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: et j’éliminerai de chez toi
  rationale: Exprime la suppression radicale indiquée par le hiphil de כרת, tout en rendant מִמֵּךְ de façon naturelle puisque l’Égypte est directement interpellée.
- source_word: אָדָם וּבְהֵמָה
  choice: les êtres humains et les bêtes
  rationale: Préserve l’opposition collective entre population humaine et population animale sans employer « hommes » dans un sens susceptible d’être compris comme exclusivement masculin.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom יהוה après אֲדֹנָי. « Le Seigneur Yahweh » maintient les deux composantes et distingue le nom divin du titre.
- issue: Portée de l’épée annoncée
  choice: l’épée comme image collective de la guerre et du jugement
  alternative: une épée particulière
  rationale: Le singulier sans article en hébreu peut désigner l’instrument guerrier au sens collectif; le français emploie naturellement l’article défini dans cet usage sans préciser davantage l’agent historique.
translation_notes:
  register: Français international moderne, clair et solennel. La formule prophétique « ainsi parle » conserve sa force traditionnelle; « Voici que » marque l’imminence sans recourir à une tournure archaïque. Le féminin singulier de l’adresse vise l’Égypte personnifiée, mais il n’est pas morphologiquement visible dans le pronom français « toi ».
