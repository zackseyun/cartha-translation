  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: fr
  text: Aucun pied humain n’y passera, aucun pied d’animal n’y passera non plus, et le pays ne sera pas habité pendant quarante ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: n’y passera
  rationale: Le verbe עבר construit avec ב exprime ici le passage à travers un territoire. « N’y passera » est naturel en français et conserve l’idée de traverser le pays.
- source_word: רֶגֶל אָדָם
  choice: aucun être humain
  rationale: 'Littéralement « pied d’humain » : le pied représente ici la personne qui circule. La formulation française explicite cet emploi métonymique et rend אָדָם dans son sens générique.'
- source_word: רֶגֶל בְּהֵמָה
  choice: aucun animal
  rationale: Littéralement « pied d’animal ». En parallèle avec רֶגֶל אָדָם, l’expression désigne tout animal qui pourrait parcourir le territoire.
- source_word: לֹא תֵשֵׁב
  choice: le pays restera inhabité
  rationale: Avec un territoire pour sujet, ישב signifie être habité ou peuplé. Le contexte identifie l’antécédent comme le pays d’Égypte; le nom « le pays » évite l’ambiguïté du pronom féminin français.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Expression temporelle indiquant clairement une durée.
theological_decisions:
- issue: Sens générique de אָדָם
  choice: être humain
  alternative: homme
  rationale: Le propos concerne toute personne susceptible de traverser le pays, et non spécifiquement un individu masculin.
translation_notes:
  register: Français international moderne, sobre et digne. La métonymie hébraïque du « pied » est rendue selon son sens afin d’éviter une tournure peu naturelle en français. La répétition de « passera » préserve le parallélisme et l’insistance du texte source.
