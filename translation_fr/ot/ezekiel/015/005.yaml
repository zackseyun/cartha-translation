revisions:
- from: 'Voici[a] : quand ce bois était intact, on n’en faisait aucun ouvrage. À combien moins forte raison, une fois que le feu l’a consumé et qu’il est carbonisé[b], pourra-t-on encore en faire un ouvrage ?'
  to: 'Voici[a] : quand ce bois était intact, on ne pouvait en faire aucun objet utile. À plus forte raison, une fois que le feu l’a consumé et qu’il est brûlé[b], pourra-t-on encore en faire un objet utile ?'
  rationale: La révision améliore l’idiomaticité française et la précision fonctionnelle, tout en conservant l’image, la progression rhétorique et les alternatives lexicales. « À plus forte raison » porte ici sur l’impossibilité formulée dans la question finale et transmet donc correctement l’argument a fortiori.
