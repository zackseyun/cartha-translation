source:
  edition: WLC
  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: fr
  text: 'Voici[a] : quand ce bois était intact, on ne pouvait en faire aucun objet utile. À plus forte raison, une fois que le feu l’a consumé et qu’il est brûlé[b], pourra-t-on encore en faire un objet utile ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regarde » ; l’hébreu attire l’attention sur le constat qui suit.
    reason: lexical_alternative
  - marker: b
    text: Ou « carbonisé » ou « roussi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force présentative et l’appel à l’attention de l’hébreu dans un français digne et naturel.
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: quand ce bois était intact
  rationale: La construction est temporelle. « Intact » décrit ici l’état physique du bois avant le feu, sans connotation morale; « ce bois » explicite naturellement le référent fourni par le contexte immédiat.
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: on n’en faisait aucun ouvrage
  rationale: Le nifal de עשה exprime ici le façonnage du bois en vue d’un usage. Cette formulation française respecte l’idée qu’il ne servait déjà à fabriquer aucun objet utile.
- source_word: אַף כִּי
  choice: À combien moins forte raison
  rationale: 'Rend explicitement le raisonnement a fortiori : si le bois intact était impropre à cet usage, il l’est davantage après avoir brûlé.'
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: le feu l’a consumé
  rationale: « Consumer » est l’équivalent français idiomatique de l’action dévorante du feu et garde la force de l’image.
- source_word: וַיֵּחָר
  choice: il est carbonisé
  rationale: Le verbe décrit le bois endommagé et noirci par la chaleur. « Carbonisé » convient au contexte, tandis que « brûlé » ou « roussi » restent possibles.
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: pourra-t-on encore en faire un ouvrage ?
  rationale: La question rhétorique fait ressortir l’impossibilité pratique; « encore » rend עוֹד et la répétition d’« ouvrage » reflète celle de מְלָאכָה.
theological_decisions:
- issue: Nature de l’image
  choice: Maintenir l’image du bois de vigne devenu inutilisable sans identifier son référent dans le verset.
  alternative: Nommer explicitement Jérusalem ou Juda dans le texte principal.
  rationale: Le contexte élargi donne la portée de la métaphore, mais ce verset reste formulé comme une observation sur le bois. La traduction ne doit pas incorporer prématurément l’interprétation.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La tournure impersonnelle « on » rend naturellement le passif hébreu, et la question finale préserve la force rhétorique du raisonnement.
