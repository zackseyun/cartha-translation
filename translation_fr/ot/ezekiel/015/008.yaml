  text: וְ/נָתַתִּ֥י אֶת הָ/אָ֖רֶץ שְׁמָמָ֑ה יַ֚עַן מָ֣עֲלוּ מַ֔עַל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
translation:
  language: fr
  text: Je ferai du pays une désolation, parce qu’ils ont commis une grave infidélité — déclaration du Seigneur Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai
  rationale: Dans cette construction avec « le pays » et l’état qui en résulte, נתן a le sens idiomatique de rendre ou faire devenir.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Dans le contexte du jugement annoncé par Ézéchiel, אֶרֶץ désigne le territoire concerné plutôt que la terre entière.
- source_word: שְׁמָמָה
  choice: un lieu dévasté
  rationale: Cette formulation naturelle conserve la valeur nominale de שְׁמָמָה et exprime un état de ruine et d’abandon.
- source_word: יַעַן
  choice: parce que
  rationale: Le terme introduit explicitement le motif du jugement.
- source_word: מָעֲלוּ מַעַל
  choice: ils ont été infidèles
  rationale: La construction verbe-nom souligne une grave rupture de fidélité; le français retenu en restitue le sens sans lourdeur.
- source_word: נְאֻם
  choice: déclaration de
  rationale: La formule marque un oracle divin solennel; « déclaration de » en conserve la force nominale.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  rationale: « Seigneur » traduit אֲדֹנָי et « Yahvé » représente distinctement le nom divin יהוה, sans produire le redoublement « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du titre divin composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: Le choix distingue le titre אֲדֹנָי du nom propre divin יהוה et préserve ainsi les deux éléments présents dans l’hébreu.
- issue: Portée de מָעֲלוּ מַעַל
  choice: ils ont été infidèles
  alternative: ils ont commis une grave infidélité
  rationale: Le texte exprime une rupture de confiance susceptible d’avoir une portée d’alliance, sans préciser ici davantage sa nature; la traduction conserve cette tension sans ajouter une qualification doctrinale.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve l’enchaînement jugement–motif–formule prophétique de l’hébreu, avec une ponctuation naturelle.
