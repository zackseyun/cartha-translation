lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, cette tournure est idiomatique en français et exprime naturellement la venue d’une communication divine.
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule, דָּבָר désigne une communication divine. « La parole » conserve l’expression prophétique récurrente et sa portée théologique, sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif לֵאמֹר introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent cette fonction plus naturellement que le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel tout en signalant en note la convention traditionnelle.
translation_notes:
  register: Français international moderne, digne et naturel. La formule « La parole de Yahweh me fut adressée » conserve le caractère solennel de l’introduction prophétique ; les deux-points rendent idiomatiquement לֵאמֹר et annoncent la parole du verset suivant.
