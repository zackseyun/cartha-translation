source:
  edition: WLC
  text: הִנֵּ֥ה לָ/אֵ֖שׁ נִתַּ֣ן לְ/אָכְלָ֑ה אֵת֩ שְׁנֵ֨י קְצוֹתָ֜י/ו אָכְלָ֤ה הָ/אֵשׁ֙ וְ/תוֹכ֣/וֹ נָחָ֔ר הֲ/יִצְלַ֖ח לִ/מְלָאכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: fr
  text: Le voici livré au feu pour être consumé[a]. Le feu a dévoré ses deux extrémités, et son milieu est carbonisé. Peut-il encore servir à quelque ouvrage[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour être mangé » ou « pour la consommation » ; le feu est présenté comme dévorant le bois.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Peut-il être utile à un travail ? » ou « Est-il propre à la fabrication de quoi que ce soit ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Le voici
  rationale: Cette tournure française conserve la force déictique et attire l’attention sur le bois évoqué, sans recourir à l’archaïque « voici que ».
- source_word: לָאֵשׁ נִתַּן
  choice: livré au feu
  rationale: Le passif de נתן et la destination marquée par ל sont maintenus. « Livré » exprime naturellement le fait que le bois est remis au pouvoir du feu sans préciser l’agent.
- source_word: לְאָכְלָה
  choice: pour être consumé
  rationale: L’expression signifie littéralement « pour être mangé » ou « pour la consommation ». Avec le feu comme sujet implicite, « être consumé » rend clairement l’image en français tout en conservant la personnification dans la phrase suivante.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: ses deux extrémités
  rationale: Cette formulation reproduit explicitement les deux bouts du morceau de bois et convient au registre descriptif.
- source_word: אָכְלָה הָאֵשׁ
  choice: Le feu a dévoré
  rationale: Le verbe אכל signifie « manger » et s’emploie du feu qui consume. « Dévoré » est naturel en français et préserve cette personnification.
- source_word: וְתוֹכוֹ
  choice: et son milieu
  rationale: תוך désigne ici la partie centrale ou intérieure du morceau de bois; « milieu » correspond précisément à l’opposition avec ses deux extrémités.
- source_word: נָחָר
  choice: est carbonisé
  rationale: Le terme décrit l’état du milieu atteint et noirci par le feu. « Carbonisé » exprime nettement ce dommage, sans laisser entendre nécessairement qu’il a été entièrement consumé.
- source_word: הֲיִצְלַח
  choice: Peut-il encore servir
  rationale: Dans ce contexte, צלח porte sur l’aptitude ou l’utilité du bois. La question française restitue la force rhétorique; « encore » explicite naturellement l’état résultant après le passage du feu.
- source_word: לִמְלָאכָה
  choice: à quelque ouvrage
  rationale: מלאכה désigne un travail, une tâche ou une fabrication. « Quelque ouvrage » évoque ici l’emploi artisanal du bois tout en gardant la portée générale de la question.
