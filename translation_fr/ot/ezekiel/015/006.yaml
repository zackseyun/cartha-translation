source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : « De même que, parmi les arbres de la forêt, j’ai livré le bois de la vigne au feu pour qu’il le consume[a], de même j’ai livré les habitants de Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au feu pour être mangé » ; c’est-à-dire pour être entièrement brûlé.'
    reason: La formulation hébraïque emploie le verbe « manger » pour décrire l’action consumante du feu.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien de conclusion avec la comparaison développée dans les versets précédents.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend clairement la formule prophétique consacrée tout en employant un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי, « Seigneur », du nom divin יהוה, translittéré « Yahweh », sans les confondre en « Seigneur Seigneur ».
- source_word: עֵץ הַגֶּפֶן
  choice: le bois de la vigne
  rationale: Dans ce contexte, עֵץ désigne le matériau ligneux destiné au feu, non simplement la vigne en tant que plante.
- source_word: בְּעֵץ הַיַּעַר
  choice: parmi les arbres de la forêt
  rationale: 'Le ב est compris dans un sens locatif et comparatif : le bois de la vigne est considéré au milieu des arbres de la forêt.'
- source_word: נְתַתִּיו
  choice: j’ai livré
  rationale: « Livrer » exprime ici la remise décisive du bois au feu et prépare le parallèle judiciaire avec les habitants de Jérusalem.
- source_word: לָאֵשׁ לְאָכְלָה
  choice: au feu pour qu’il le consume
  rationale: Conserve l’image de la consommation par le feu portée par le verbe אכל, tout en restant idiomatique en français.
- source_word: כֵּן
  choice: de même
  rationale: Marque explicitement et naturellement le second membre de la comparaison.
- source_word: נָתַתִּי
  choice: j’ai livré
  rationale: Maintient le parallélisme verbal avec le sort du bois de vigne et fait entendre le caractère arrêté du jugement.
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: les habitants de Jérusalem
  rationale: Formulation française courante qui garde le sens collectif du participe hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La translittération « Yahweh » maintient la distinction entre le titre אֲדֹנָי et le nom propre divin יהוה, présent explicitement dans le texte hébreu.
- issue: Portée judiciaire du double emploi de נתן
  choice: j’ai livré … j’ai livré
  alternative: j’ai donné … j’ai donné
  rationale: « Livrer » rend la remise au feu puis au jugement sans préciser au-delà du texte l’agent ou les modalités de l’exécution.
translation_notes:
  register: Français international moderne, clair et solennel. La structure comparative « de même que… de même… » est conservée, ainsi que le parallélisme entre le bois de la vigne et les habitants de Jérusalem.
