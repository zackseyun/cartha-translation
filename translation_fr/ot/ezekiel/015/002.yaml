  text: בֶּן אָדָ֕ם מַה יִּֽהְיֶ֥ה עֵץ הַ/גֶּ֖פֶן מִ/כָּל עֵ֑ץ הַ/זְּמוֹרָ֕ה אֲשֶׁ֥ר הָיָ֖ה בַּ/עֲצֵ֥י הַ/יָּֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/002.yaml
  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
translation:
  language: fr
  text: Fils d’homme[a], en quoi le bois de la vigne vaut-il mieux que n’importe quel autre bois, le sarment qui se trouve parmi les arbres de la forêt ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Fils d’homme, qu’est le bois de la vigne de plus que tout autre bois, le sarment qui se trouve parmi les arbres de la forêt ? » L’hébreu est elliptique et comparatif.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse récurrente adressée au prophète dans Ézéchiel. Elle conserve l’image hébraïque consacrée sans en faire ici un titre messianique.
- source_word: מַה יִּהְיֶה
  choice: en quoi … vaut-il mieux
  rationale: L’hébreu est elliptique et exprime ici une comparaison. Cette formulation française naturelle explicite l’idée d’un éventuel avantage sans supprimer la force rhétorique de la question.
- source_word: עֵץ הַגֶּפֶן
  choice: le bois de la vigne
  rationale: La traduction garde l’accent sur le bois comme matériau, essentiel à l’image développée dans les versets suivants.
- source_word: מִכָּל עֵץ
  choice: que n’importe quel autre bois
  rationale: La préposition מִן marque la comparaison. « N’importe quel autre bois » rend clairement la comparaison avec les autres essences tout en restant idiomatique.
- source_word: הַזְּמוֹרָה
  choice: le sarment
  rationale: « Sarment » désigne précisément une branche de vigne et évite de perdre l’association viticole déjà présente.
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: qui se trouve parmi les arbres de la forêt
  rationale: Le présent convient à la portée générale de la comparaison. « Parmi les arbres de la forêt » restitue naturellement la situation décrite.
