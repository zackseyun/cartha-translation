source:
  edition: WLC
  text: הֲ/יֻקַּ֤ח מִמֶּ֨/נּוּ֙ עֵ֔ץ לַ/עֲשׂ֖וֹת לִ/מְלָאכָ֑ה אִם יִקְח֤וּ מִמֶּ֨/נּוּ֙ יָתֵ֔ד לִ/תְל֥וֹת עָלָ֖י/ו כָּל כֶּֽלִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: fr
  text: Prend-on de ce bois pour en faire un objet utile ? Ou en tire-t-on une cheville à laquelle suspendre toutes sortes d’objets ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « pour fabriquer quelque chose destiné à un travail ». L’expression hébraïque souligne l’utilité pratique.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « cheville » peut aussi désigner un piquet ou un clou; il s’agit ici d’un support fixe auquel on suspend des objets.
    reason: lexical_alternative
  - marker: c
    text: 'Le terme hébreu traduit par « objets » a un sens large : récipient, ustensile, instrument ou article de toute sorte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח מִמֶּנּוּ עֵץ
  choice: Prend-on de ce bois
  rationale: La tournure interrogative passive de l’hébreu devient une construction impersonnelle active, plus naturelle en français, tout en conservant la question rhétorique. « De ce bois » reprend sans surinterprétation le référent du contexte.
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: pour en faire un objet utile
  rationale: מְלָאכָה exprime ici l’idée de travail, d’usage ou de fonction pratique. « Un objet utile » restitue cette valeur sans alourdir la phrase.
- source_word: אִם יִקְחוּ מִמֶּנּוּ
  choice: Ou en tire-t-on
  rationale: אִם introduit la seconde question rhétorique parallèle. « Ou » marque clairement l’alternative, et « en tirer » exprime naturellement le prélèvement dans ce bois.
- source_word: יָתֵד
  choice: une cheville
  rationale: Dans un contexte où l’on suspend des objets, « cheville » désigne clairement une pièce fixée servant de support; « piquet » conviendrait moins à cet usage domestique.
- source_word: לִתְלוֹת עָלָיו
  choice: à laquelle suspendre
  rationale: La formulation conserve l’idée concrète de suspendre quelque chose au support tout en évitant une répétition maladroite du pronom en français.
- source_word: כָּל כֶּלִי
  choice: toutes sortes d’objets
  rationale: כְּלִי est un terme large pouvant désigner un récipient, un ustensile, un instrument ou tout autre article. Cette traduction communique cette ampleur dans un français courant.
theological_decisions: []
