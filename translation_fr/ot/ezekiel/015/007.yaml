  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: fr
  text: Je tournerai ma face contre eux[a]. Ils sont sortis du feu, mais le feu les dévorera[b]. Alors vous saurez que je suis Yahweh, lorsque je tournerai ma face contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque : « mettre sa face contre quelqu’un » signifie s’opposer résolument à lui pour le juger.'
    reason: cultural_note
  - marker: b
    text: L’hébreu dit qu’ils sont sortis du feu, sans nécessairement suggérer qu’ils lui ont définitivement échappé ; malgré cela, le feu les dévorera.
    reason: lexical_note
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  choice: Je tournerai ma face contre eux
  rationale: L’expression française conserve l’image hébraïque de la face tout en exprimant clairement l’opposition résolue et le jugement. Le complément בָּהֶם prend ici le sens contextuel de « contre eux ».
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: Ils sont sortis du feu
  rationale: Le verbe יָצָא signifie « sortir ». Cette traduction n’ajoute pas l’idée d’une délivrance définitive, démentie par la proposition suivante.
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: mais le feu les dévorera
  rationale: 'Avec le feu pour sujet, אָכַל signifie « dévorer, consumer ». « Mais » rend explicite le contraste contextuel porté par le waw : être sorti du feu n’empêchera pas le jugement à venir.'
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Dans ce discours prophétique, la connaissance résulte de l’accomplissement du jugement ; « alors » restitue naturellement cette conséquence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: lorsque je tournerai ma face contre eux
  rationale: La préposition בְּ devant l’infinitif construit a ici une valeur temporelle. La répétition de l’expression conserve l’encadrement rhétorique du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. La translittération maintient le nom divin sans lui substituer un titre.
- issue: Portée de l’expression « mettre sa face contre »
  choice: Conserver l’image dans « tourner ma face contre eux »
  alternative: je m’opposerai à eux
  rationale: L’image prophétique exprime une opposition délibérée et judiciaire. La conserver maintient sa force littéraire et théologique sans la réduire à une paraphrase générale.
- issue: Rapport entre les deux mentions du feu
  choice: Exprimer le contraste sans préciser s’il s’agit du même feu ou d’un autre
  alternative: Ils ont échappé à un premier feu, mais un autre les consumera
  rationale: L’hébreu oppose la sortie du feu au fait d’être néanmoins dévoré par le feu, sans préciser explicitement le nombre de feux. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et solennel. L’image hébraïque de la face et la répétition qui structure le verset sont conservées ; « dévorera » maintient la personnification vigoureuse du feu.
