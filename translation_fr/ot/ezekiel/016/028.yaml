source:
  edition: WLC
  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: fr
  text: Tu t’es prostituée avec les fils d’Assyrie[a], sans être rassasiée ; tu t’es prostituée avec eux[b], et malgré cela, tu n’étais pas rassasiée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Assyrie » ; cette expression désigne les Assyriens.'
    reason: lexical_alternative
  - marker: b
    text: La prostitution est ici une métaphore répétée de l’infidélité de Jérusalem, notamment dans ses alliances étrangères et son idolâtrie.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: tu t’es prostituée
  rationale: Le verbe זנה porte ici la métaphore explicite et volontairement choquante de la prostitution pour décrire l’infidélité de Jérusalem. Cette formulation en conserve la force en français moderne.
- source_word: אֶל
  choice: avec
  rationale: Avec זנה, la préposition désigne ici ceux avec qui la relation illicite est recherchée ; « avec » est l’équivalent français naturel.
- source_word: בְּנֵי אַשּׁוּר
  choice: les fils d’Assyrie
  rationale: Cette traduction conserve l’expression hébraïque et sa texture, tout en laissant entendre qu’elle désigne collectivement les Assyriens.
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: parce que tu n’étais pas rassasiée
  rationale: La tournure rend la nuance causale ou circonstancielle du manque de satiété. « Rassasiée » conserve mieux que « satisfaite » l’image de l’appétit insatiable portée par שׂבע.
- source_word: וַתִּזְנִים
  choice: tu t’es prostituée avec eux
  rationale: Le suffixe masculin pluriel renvoie aux fils d’Assyrie ; le pronom explicite en français préserve ce détail grammatical.
- source_word: וְגַם
  choice: et même alors
  rationale: 'Dans le contexte, l’expression accentue l’ironie : malgré cette nouvelle prostitution, Jérusalem ne connaît toujours pas la satiété.'
- source_word: לֹא שָׂבָעַתְּ
  choice: tu n’as pas été rassasiée
  rationale: Le choix reprend le même champ lexical que dans la première proposition et préserve la répétition rhétorique de l’hébreu.
theological_decisions:
- issue: Maintien de la métaphore de la prostitution pour l’infidélité politique et religieuse de Jérusalem
  choice: Conserver explicitement « tu t’es prostituée » dans le texte principal
  alternative: Atténuer en « tu as été infidèle » ou expliciter en « tu as recherché des alliances »
  rationale: Ézéchiel emploie délibérément une imagerie sexuelle brutale pour représenter l’idolâtrie et les alliances étrangères de Jérusalem. L’atténuer affaiblirait la rhétorique prophétique et la portée de l’infidélité envers Dieu.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin est maintenu parce que Jérusalem est personnifiée comme une femme. La formulation conserve la métaphore sexuelle explicite, la répétition de זנה et celle de שׂבע. Les deux appels de note figurent dans le texte principal.
