  naturalness: Le français révisé est direct et naturel dans un registre prophétique moderne. « Malgré cela » marque bien l’intensification de וְגַם dans le contexte, sans ajouter de contenu.
  terminology: « Se prostituer » restitue avec force זנה sans archaïsme. « Rassasiée » préserve le champ imagé de שׂבע et sa répétition. « Fils d’Assyrie » maintient l’expression hébraïque; la note indique son sens collectif probable.
