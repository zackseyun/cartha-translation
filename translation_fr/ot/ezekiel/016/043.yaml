source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: fr
  text: Parce que tu ne t’es pas souvenue des jours de ta jeunesse, mais que tu m’as irrité par toutes ces choses, voici que moi aussi, j’ai fait retomber ta conduite sur ta propre tête — déclaration du Seigneur Yahweh —, et tu n’as pas commis cette conduite infâme en plus de toutes tes abominations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est difficile en hébreu. Elle peut aussi être comprise comme une question rhétorique : « N’as-tu pas commis cette conduite infâme en plus de toutes tes abominations ? » Le texte consonantique porte aussi une forme qui peut se comprendre à la première personne : « et je n’ai pas commis cette conduite infâme en plus de toutes tes abominations » ; la traduction suit la lecture contextuelle qui poursuit l’adresse à Jérusalem.'
    reason: Ambiguïté textuelle, grammaticale et syntaxique concernant la personne du verbe et la force déclarative ou interrogative de la négation.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Introduit clairement, en français moderne, la cause du jugement qui suit.
- source_word: 'לֹא זכרתי (lecture contextuelle : « tu ne t’es pas souvenue »)'
  choice: tu ne t’es pas souvenue
  rationale: Le contexte poursuit l’adresse à Jérusalem au féminin singulier. La tournure pronominale est idiomatique en français et conserve la portée morale et mémorielle de זכר.
- source_word: יְמֵי נְעוּרַיִךְ
  choice: les jours de ta jeunesse
  rationale: Rend directement l’expression hébraïque tout en restant naturelle et compréhensible.
- source_word: וַתִּרְגְּזִי לִי
  choice: mais que tu m’as mis en fureur
  rationale: רגז exprime ici une vive agitation provoquée chez Dieu. « Mis en fureur » garde cette intensité sans affaiblir le verbe en simple « irrité ».
- source_word: בְּכָל אֵלֶּה
  choice: par toutes ces choses
  rationale: Le ב est compris comme instrumental et renvoie aux actes décrits dans le contexte précédent.
- source_word: וְגַם אֲנִי הֵא
  choice: voici que moi aussi
  rationale: Conserve à la fois l’interjection הֵא et l’insistance de אֲנִי avec גַם, marquant la réponse correspondante de Dieu.
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: j’ai fait retomber ta conduite sur ta propre tête
  rationale: Rend le sens judiciaire de l’idiome, selon lequel les conséquences de la conduite de Jérusalem reviennent sur elle, tout en conservant l’image de la tête.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם. « Yahweh » représente explicitement le nom divin, tandis que « Seigneur » traduit אֲדֹנָי.
- source_word: הַזִּמָּה
  choice: l’infamie
  rationale: Dans ce contexte sexuel et moral, זִמָּה désigne une conduite honteuse et dépravée. « Infamie » est digne, fort et moins archaïque que certaines solutions littérales.
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: à toutes tes abominations
  rationale: עַל est pris dans un sens additif, « en plus de », exprimé naturellement par le verbe « ajouter ».
theological_decisions:
- issue: Formule divine אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre divin יְהוִה et préserve le caractère personnel du nom révélé.
- issue: Sujet, négation et force de la dernière proposition
  choice: 'énoncé négatif adressé à Jérusalem : « tu n’as pas ajouté… »'
  alternative: 'question rhétorique positive : « N’as-tu pas ajouté… ? » ; ou lecture à la première personne : « je n’ai pas… »'
  rationale: Le texte transmis et sa tradition de lecture présentent une difficulté réelle. Le corps du texte maintient la négation et l’adresse féminine suivies par la couche de consultation, sans transformer silencieusement לֹא en question rhétorique. La note expose les autres analyses plausibles.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’adresse féminine à Jérusalem est conservée. La métaphore judiciaire de la conduite retombant sur la tête est maintenue, tandis que la difficulté de la proposition finale est signalée plutôt que résolue sans indication.
