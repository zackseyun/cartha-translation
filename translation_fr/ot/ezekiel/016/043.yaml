revisions:
- from: Parce que tu ne t’es pas souvenue des jours de ta jeunesse, mais que tu m’as mis en fureur par toutes ces choses, voici que moi aussi, j’ai fait retomber ta conduite sur ta propre tête — déclaration du Seigneur Yahweh —, et tu n’as pas ajouté l’infamie à toutes tes abominations[a].
  to: Parce que tu ne t’es pas souvenue des jours de ta jeunesse, mais que tu m’as irrité par toutes ces choses, voici que moi aussi, j’ai fait retomber ta conduite sur ta propre tête — déclaration du Seigneur Yahweh —, et tu n’as pas commis cette conduite infâme en plus de toutes tes abominations[a].
  rationale: La révision conserve les options interprétatives du projet et l’ambiguïté signalée, tout en rétablissant dans le texte principal la relation entre « commettre » et « conduite infâme », ainsi que la valeur additive de « en plus de toutes tes abominations ». Elle améliore aussi légèrement l’idiome français sans atténuer le reproche divin.
