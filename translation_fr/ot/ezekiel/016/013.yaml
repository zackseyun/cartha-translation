base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: fr
  text: Tu t’es parée d’or et d’argent, et tes vêtements étaient de fin lin, d’une étoffe précieuse[a] et de tissu brodé. Tu as mangé de la farine fine, du miel et de l’huile. Tu es devenue extrêmement belle et tu as accédé à la royauté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte du textile hébreu est incertaine ; il s’agit d’une étoffe luxueuse, traditionnellement rendue par « soie ».
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « tu es devenue un royaume » ou « tu es parvenue à la dignité de reine ». L’expression hébraïque décrit une progression réussie vers un statut royal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: Tu t’es parée
  rationale: Le verbe עדה exprime ici l’action de se parer d’ornements; la tournure pronominale convient aux objets « d’or et d’argent » et à l’image nuptiale du contexte.
- source_word: ששי
  choice: fin lin
  rationale: שֵׁשׁ désigne couramment un lin de qualité, particulièrement dans les contextes luxueux ou cultuels.
- source_word: מֶשִׁי
  choice: une étoffe précieuse
  rationale: L’identification exacte de cette matière textile est incertaine. Une désignation générique maintient l’idée certaine d’un tissu luxueux sans imposer « soie ».
- source_word: רִקְמָה
  choice: tissu brodé
  rationale: Le terme désigne un ouvrage ou une matière textile brodée; cette formulation s’intègre naturellement à l’énumération des vêtements.
- source_word: סֹלֶת
  choice: farine fine
  rationale: Le mot désigne une farine raffinée de qualité supérieure.
- source_word: אכלתי
  choice: Tu mangeais
  rationale: Le texte massorétique porte un qal accompli à la deuxième personne du féminin singulier. L’imparfait français décrit naturellement l’alimentation somptueuse dans ce récit rétrospectif.
- source_word: בִּמְאֹד מְאֹד
  choice: extrêmement
  rationale: Cette formulation rend l’intensification hébraïque littéralement redoublée, « très, très ».
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: tu as accédé à la royauté
  rationale: La construction évoque une progression réussie jusqu’au statut royal. « Accéder à la royauté » est idiomatique en français et conserve l’élévation politique de la métaphore féminine.
theological_decisions:
- issue: Élévation métaphorique de Jérusalem dans l’image conjugale et royale
  choice: tu as accédé à la royauté
  alternative: tu es devenue un royaume; tu es parvenue à la dignité de reine
  rationale: Le contexte personnifie Jérusalem comme une femme. La traduction retenue préserve l’accession au statut royal sans transformer explicitement la femme en territoire ni préciser plus que l’hébreu le titre de reine.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le féminin singulier est maintenu dans toute l’adresse à Jérusalem. Le rythme conserve les trois étapes du verset : parure, nourriture abondante, puis beauté et élévation royale.'
