  text: וְ/שַׁבְתִּי֙ אֶת שְׁבִ֣יתְ/הֶ֔ן אֶת שבית סְדֹם֙ וּ/בְנוֹתֶ֔י/הָ וְ/אֶת שבית שֹׁמְר֖וֹן וּ/בְנוֹתֶ֑י/הָ ו/שבית שְׁבִיתַ֖יִ/ךְ בְּ/תוֹכָֽ/הְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: fr
  text: Je rétablirai[b] la situation de Sodome et de ses filles[a], celle de Samarie et de ses filles, ainsi que ta situation parmi elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « filles » de Sodome et de Samarie sont les localités qui leur sont rattachées ou qui dépendent d’elles.
    reason: cultural_note
  - marker: b
    text: L’expression hébraïque traduite par « Je rétablirai la situation » peut aussi se comprendre comme « je mettrai fin à leur captivité » ou « je ramènerai leurs captifs ». Elle désigne souvent, plus largement, le renversement de la condition d’un peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Je rétablirai
  rationale: Le verbe שׁוב, employé ici avec שְׁבִית, exprime la restauration ou le renversement d’une situation. « Je rétablirai » rend naturellement cette valeur causative en français.
- source_word: שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  choice: leur situation / celle de… / la tienne
  rationale: Dans la formule idiomatique שׁוב שְׁבוּת/שְׁבִית, le nom peut désigner la captivité, les captifs ou, plus largement, la condition renversée par une restauration. « Rétablir la situation » convient au contexte, notamment parce que Sodome est incluse, sans limiter le sens à un retour géographique de captifs.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: וּבְנוֹתֶיהָ
  choice: et de ses filles
  rationale: Le sens littéral « filles » conserve l’image familiale et géographique du texte prophétique; il s’agit de localités dépendantes ou associées, précision donnée en note.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de lieu.
- source_word: בְּתוֹכָהְנָה
  choice: au milieu d’elles
  rationale: Cette expression rend directement l’idée d’une restauration de Jérusalem au milieu de Sodome, de Samarie et de leurs communautés associées, tout en conservant le pronom féminin pluriel de l’hébreu.
theological_decisions:
- issue: Sens de la formule de restauration dans un oracle de jugement et de rétablissement
  choice: Exprimer un rétablissement de la situation sans préciser davantage son mécanisme.
  alternative: « ramener les captifs » ou « mettre fin à la captivité »
  rationale: La formule hébraïque peut évoquer la captivité, mais elle fonctionne souvent comme une expression générale du renversement d’une condition. La présence de Sodome déconseille de réduire le propos à un rapatriement historique précis.
- issue: Référent des « filles » de Sodome et de Samarie
  choice: Conserver la métaphore familiale dans le texte principal.
  alternative: « villes dépendantes », « localités » ou « villages »
  rationale: « Filles » préserve l’image structurante du chapitre et le parallélisme entre les villes; une note en explique le sens géographique.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est maintenu, avec des reprises pronominales naturelles pour éviter une lourde répétition. La métaphore des « filles » est conservée et expliquée en note.
