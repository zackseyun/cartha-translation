  text: וְ/אֵ֤ת כָּל תּוֹעֲבֹתַ֨יִ/ךְ֙ וְ/תַזְנֻתַ֔יִ/ךְ לֹ֥א זכרתי אֶת יְמֵ֣י נְעוּרָ֑יִ/ךְ בִּֽ/הְיוֹתֵ/ךְ֙ עֵרֹ֣ם וְ/עֶרְיָ֔ה מִתְבּוֹסֶ֥סֶת בְּ/דָמֵ֖/ךְ הָיִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: fr
  text: Au milieu de toutes tes abominations et de tes prostitutions[a], tu ne t’es pas souvenue des jours de ta jeunesse, lorsque tu étais nue et dénudée[b], te débattant dans ton sang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes actes de prostitution ». Dans ce contexte, l’image de la prostitution exprime l’infidélité de Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: Ou « nue et exposée ». Les deux termes soulignent l’exposition et la vulnérabilité.
    reason: lexical_alternative
  - marker: c
    text: Ou « te tortillant dans ton sang » ou « t’agitant dans ton sang »; le verbe hébreu évoque les mouvements d’un être impuissant et couvert de sang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: tes abominations
  rationale: « Abominations » conserve la forte réprobation cultuelle et morale du terme prophétique, sans en atténuer la gravité.
- source_word: תַזְנֻתַיִךְ
  choice: tes prostitutions
  rationale: Le pluriel concret maintient l’image sexuelle volontairement choquante employée pour l’infidélité idolâtre et liée à l’alliance.
- source_word: לֹא זכרתי
  choice: tu ne t’es pas souvenue
  rationale: Le parfait qal à la deuxième personne féminine du singulier désigne directement Jérusalem; le passé composé est naturel en français dans cette accusation rétrospective.
- source_word: יְמֵי נְעוּרָיִךְ
  choice: les jours de ta jeunesse
  rationale: Cette formulation française naturelle suit de près le groupe construit hébreu.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nue, entièrement découverte
  rationale: La seconde expression intensifie la première. « Entièrement découverte » préserve l’idée d’exposition totale sans produire un doublet français artificiel.
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: te débattant dans ton sang
  rationale: Le participe décrit un mouvement répété dans le sang et une situation d’impuissance; « te débattant » restitue cette image tout en restant idiomatique.
- source_word: וְאֵת כָּל ... וְ...
  choice: Dans toutes ... et ...
  rationale: La construction d’ouverture est elliptique et difficile. « Dans toutes » exprime les circonstances au milieu desquelles Jérusalem a oublié sa jeunesse, sans imposer une valeur concessive certaine.
theological_decisions:
- issue: Image de la prostitution appliquée à l’infidélité de Jérusalem
  choice: Conserver le terme concret « prostitutions ».
  alternative: « infidélités » ou « idolâtrie »
  rationale: Le texte prophétique formule son accusation au moyen d’une métaphore sexuelle explicite. La remplacer par une abstraction théologique en réduirait la force et résoudrait l’image à la place du lecteur.
- issue: Rapport syntaxique de la proposition initiale
  choice: 'Rendre l’expression comme une circonstance: « Dans toutes… »'
  alternative: « Malgré toutes… » ou « Avec toutes… »
  rationale: L’hébreu est elliptique. Une traduction concessive comme « malgré » serait possible dans le contexte, mais expliciterait une relation logique qui n’est pas grammaticalement certaine.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement féminin correspond à Jérusalem personnifiée. La violence des images prophétiques est conservée, tandis que les notes signalent les principales possibilités lexicales et l’ambiguïté de la syntaxe initiale.
