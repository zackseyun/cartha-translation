  source_fidelity: La traduction restitue avec fidélité les termes principaux et l’image de vulnérabilité sanglante. Toutefois, « Dans toutes tes abominations et tes prostitutions » est peu naturel en français et ne rend pas clairement l’ellipse circonstancielle de וְאֵת כָּל. « Au milieu de toutes… » est plus idiomatique sans transformer la relation en concession. « nue et dénudée » conserve mieux le redoublement hébreu que « entièrement découverte ».
  naturalness: Le registre est moderne, direct et approprié. « Tu ne t’es pas souvenue » convient bien à Jérusalem personnifiée. « Te débattant dans ton sang » est idiomatique, mais le participe hébreu peut évoquer aussi le fait de se tordre ou de s’agiter; une note conserve utilement cette nuance.
  terminology: « Abominations » et « prostitutions » maintiennent la vigueur du lexique prophétique et le pluriel. Il convient de ne pas réduire « prostitutions » à une explication théologique dans le texte. La note peut signaler l’usage métaphorique dans ce contexte sans présenter cette explication comme un remplacement du sens figuratif concret.
