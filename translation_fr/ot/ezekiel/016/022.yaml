    rationale: « Dans toutes tes abominations et tes prostitutions » sonne calqué en français. L’hébreu ouvre par une construction elliptique; « Au milieu de toutes tes abominations et de tes prostitutions » rend une circonstance possible, comme l’anglais « in all », sans imposer « malgré ».
