  text: וַ/תִּקְחִ֞י אֶת בָּנַ֤יִ/ךְ וְ/אֶת בְּנוֹתַ֨יִ/ךְ֙ אֲשֶׁ֣ר יָלַ֣דְתְּ לִ֔/י וַ/תִּזְבָּחִ֥י/ם לָ/הֶ֖ם לֶ/אֱכ֑וֹל הַ/מְעַ֖ט מ/תזנת/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: fr
  text: Tu as pris tes fils et tes filles, que tu avais mis au monde pour moi, et tu les leur as sacrifiés pour leur servir de nourriture. Tes prostitutions étaient-elles trop peu de chose ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנַיִךְ וּבְנוֹתַיִךְ
  choice: tes fils et tes filles
  rationale: Rend directement les deux termes de parenté et conserve l’adresse à Jérusalem au féminin singulier.
- source_word: אֲשֶׁר יָלַדְתְּ לִי
  choice: que tu avais mis au monde pour moi
  rationale: Préserve le datif לִי, qui présente ces enfants comme nés « pour moi », sans expliciter davantage la relation théologique.
- source_word: וַתִּזְבָּחִים לָהֶם
  choice: tu les leur as sacrifiés
  rationale: « Sacrifier » exprime la mise à mort cultuelle portée par זבח; « leur » renvoie aux idoles ou amants évoqués dans le contexte.
- source_word: לֶאֱכוֹל
  choice: pour leur servir de nourriture
  rationale: Rend l’idée littérale « pour manger / comme nourriture » de façon naturelle en français, sans ajouter explicitement qui dévore.
- source_word: תַזְנוּתָיִךְ
  choice: tes prostitutions
  rationale: Conserve l’image sexuelle forte et répétée du chapitre, avec sa portée métaphorique d’infidélité religieuse.
theological_decisions:
- issue: Portée de « pour moi » concernant les enfants
  choice: Conserver « pour moi »
  alternative: « que tu m’avais donnés » ou « qui m’appartenaient »
  rationale: Le texte dit simplement לִי. La traduction garde cette formulation relationnelle sans imposer une explication particulière de l’appartenance divine.
- issue: Agent implicite de l’action de manger
  choice: « pour leur servir de nourriture »
  alternative: « afin qu’ils les dévorent »
  rationale: L’infinitif לֶאֱכוֹל ne précise pas grammaticalement son sujet; la formulation choisie préserve cette relative indétermination.
- issue: Question finale elliptique
  choice: « Tes prostitutions étaient-elles donc trop peu de chose ? »
  alternative: « Ne te suffisait-il pas de te prostituer ? »
  rationale: La formulation retenue reproduit l’ellipse et la force rhétorique de l’hébreu sans ajouter explicitement l’idée de satisfaction personnelle.
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement correspond à l’adresse prophétique au féminin singulier. La violence et l’accusation du texte sont conservées sans euphémisme, tandis que la syntaxe reste accessible.
