base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: fr
  text: afin que tu te souviennes, que tu aies honte et que tu n’oses plus ouvrir la bouche à cause de ton déshonneur, lorsque je ferai expiation pour toi, pour tout ce que tu as fait[a], déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « lorsque j’aurai fait expiation pour toi ». Le verbe hébreu appartient au langage de l’expiation et de la réconciliation, et non seulement à celui du pardon général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּזְכְּרִי
  choice: afin que tu te souviennes
  rationale: La construction introduit le but ou le résultat. Le féminin singulier s’adresse à Jérusalem personnifiée.
- source_word: וָבֹשְׁתְּ
  choice: que tu aies honte
  rationale: Cette formulation naturelle conserve le sens intérieur de honte sans imposer la nuance plus passive d’« être couverte de honte ».
- source_word: פִּתְחוֹן פֶּה
  choice: tu n’oses plus ouvrir la bouche
  rationale: L’expression hébraïque signifie littéralement « ouverture de bouche » et désigne ici la possibilité ou l’assurance de prendre la parole. La traduction française restitue naturellement l’idiome.
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: à cause de ton humiliation
  rationale: מִפְּנֵי a ici une valeur causale. « Humiliation » rend la honte déshonorante et évite de répéter immédiatement « honte ».
- source_word: בְּכַפְּרִי לָךְ
  choice: lorsque je ferai l’expiation pour toi
  rationale: Le préfixe ב est compris temporellement. « Faire l’expiation » préserve la portée cultuelle et relationnelle de כפר sans la réduire au simple pardon.
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: pour tout ce que tu as fait
  rationale: La formulation conserve l’étendue totale des actes de Jérusalem et le rapport syntaxique avec l’expiation.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, tandis que « Yahweh » représente directement le nom divin dans le titre composé.
theological_decisions:
- issue: Sens de כפר dans la restauration de Jérusalem
  choice: je ferai l’expiation pour toi
  alternative: je te pardonnerai
  rationale: Le verbe porte un langage d’expiation ou de réconciliation. Le rendre seulement par « pardonner » supprimerait cette dimension, alors que le verset n’en précise pas le mécanisme.
- issue: Traduction de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom personnel יהוה et évite de masquer ce dernier, sans ajouter une interprétation confessionnelle.
- issue: Rapport entre l’expiation divine et la honte de Jérusalem
  choice: conserver ensemble la grâce divine et l’humiliation humaine
  alternative: présenter l’expiation comme supprimant immédiatement tout sentiment de honte
  rationale: Le texte maintient la tension entre la restauration accordée par Dieu, le souvenir des fautes et la perte de toute prétention à parler. La traduction ne résout pas cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement féminin singulier est maintenu parce que Jérusalem est personnifiée. L’idiome « ouverture de bouche » est rendu naturellement dans le texte, tandis que le vocabulaire théologique d’« expiation » est conservé.
