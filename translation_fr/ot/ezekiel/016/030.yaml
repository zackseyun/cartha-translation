  text: מָ֤ה אֲמֻלָה֙ לִבָּתֵ֔/ךְ נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה בַּ/עֲשׂוֹתֵ/ךְ֙ אֶת כָּל אֵ֔לֶּה מַעֲשֵׂ֥ה אִשָּֽׁה זוֹנָ֖ה שַׁלָּֽטֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
translation:
  language: fr
  text: Comme ton cœur est faible, déclare le Seigneur Yahweh, quand tu fais toutes ces choses, agissant comme une prostituée effrontée[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dominatrice » ; le mot hébreu peut évoquer une attitude hardie, autoritaire ou éhontée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲמֻלָה לִבָּתֵךְ
  choice: Comme ton cœur est faible
  rationale: מָה introduit ici une exclamation de degré. אֲמֻלָה évoque ce qui est faible, languissant ou défaillant, et « cœur » conserve l’image hébraïque de la personne intérieure, de sa volonté et de ses désirs.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם est la formule d’affirmation prophétique. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה et conserve explicitement le nom d’alliance.
- source_word: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה
  choice: quand tu fais toutes ces choses
  rationale: L’infinitif précédé de בְּ exprime ici naturellement la circonstance ou le temps ; cette formulation française reste claire et proche de la syntaxe source.
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה
  choice: agissant comme une prostituée
  rationale: Littéralement « l’action d’une femme prostituée ». La tournure verbale française relie clairement cette caractérisation à l’ensemble des actes reprochés, sans atténuer la métaphore.
- source_word: שַׁלָּטֶת
  choice: effrontée
  rationale: Le terme qualifie une conduite hardie, autoritaire ou éhontée. « Effrontée » exprime naturellement dans ce contexte l’audace sans honte, tandis que la valeur « dominatrice » est conservée en note.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Souverain Seigneur
  rationale: Le texte juxtapose le titre אֲדֹנָי et le nom propre יְהוִה. Le rendu choisi préserve cette distinction et ne remplace pas silencieusement le nom divin par un titre.
- issue: Nature de la faiblesse du cœur
  choice: est faible
  alternative: languit / est défaillant
  rationale: Le texte condamne l’état intérieur de Jérusalem sans préciser explicitement s’il s’agit de faiblesse morale, d’épuisement ou d’un désir maladif. « Faible » conserve cette relative ouverture.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation initiale et finale restitue la vigueur du reproche prophétique. « Prostituée » est contemporain et précis, sans archaïsme ni grossièreté ajoutée.
