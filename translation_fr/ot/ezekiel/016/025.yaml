  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: fr
  text: À chaque carrefour, tu t’es construit un haut lieu[a] et tu as rendu ta beauté abominable. Tu as écarté les jambes pour tous les passants et multiplié tes actes de prostitution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une hauteur » ; le terme peut désigner une construction élevée, ici vraisemblablement liée au culte idolâtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: carrefour
  rationale: L’expression signifie littéralement « tête du chemin » et désigne ici un point visible où des voies se rejoignent. « Carrefour » est naturel en français et conserve le caractère public de la scène.
- source_word: רָמָה
  choice: haut lieu
  rationale: Le terme désigne une hauteur aménagée, ici avec une portée cultuelle dans la métaphore de l’idolâtrie. « Haut lieu » conserve ce sens sans réduire le mot à un simple sanctuaire.
- source_word: תְּתַעֲבִי אֶת יָפְיֵךְ
  choice: tu as rendu ta beauté abominable
  rationale: La construction présente la beauté comme devenue abominable par l’action de Jérusalem. Cette formulation garde la force morale du verbe תעב.
- source_word: תְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: tu as écarté les jambes
  rationale: L’hébreu emploie une image sexuelle explicite. La traduction directe en préserve la rudesse intentionnelle sans l’atténuer par un euphémisme.
- source_word: לְכָל עוֹבֵר
  choice: devant chaque passant
  rationale: Le participe désigne toute personne qui passe. « Devant chaque passant » exprime naturellement en français l’exposition publique évoquée.
- source_word: תַּרְבִּי אֶת תַּזְנוּתֵךְ
  choice: multiplié tes actes de prostitution
  rationale: Le verbe exprime l’accroissement ou la multiplication, et le nom désigne la prostitution au sens propre dans l’image prophétique de l’infidélité idolâtre. L’ajout idiomatique de « actes de » rend la multiplication naturelle en français.
theological_decisions:
- issue: Degré d’explicitation de la métaphore sexuelle de l’idolâtrie
  choice: Conserver les formulations directes « écarté les jambes » et « actes de prostitution »
  alternative: Employer des euphémismes tels que « tu t’es offerte » ou « tu as été infidèle »
  rationale: Le texte hébreu décrit délibérément l’idolâtrie de Jérusalem au moyen d’une image sexuelle choquante et publique. L’atténuer ferait perdre une part importante de la portée prophétique, tandis que la traduction retenue ne tranche pas au-delà de la métaphore du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin suit l’adresse à Jérusalem personnifiée. La syntaxe reste fluide tout en conservant la répétition accusatrice et la crudité intentionnelle de l’hébreu.
