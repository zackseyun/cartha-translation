  yaml_path: translation/ot/ezekiel/016/058.yaml
  text: You have borne your lewdness and your abominations[a], declares Yahweh.
translation:
  language: fr
  text: Tu as porté[a] ta débauche et tes abominations, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as porté ta culpabilité » ou « tu as subi ton châtiment ». Dans ce contexte, le verbe hébreu traduit par « porter » peut avoir une portée judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: ta conduite infâme
  rationale: Dans Ézéchiel 16, זִמָּה désigne une conduite moralement honteuse, avec une forte dimension sexuelle liée à l’image prolongée de la prostitution et de l’adultère. « Conduite infâme » en garde la gravité sans employer un terme vieilli.
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: tes actes abominables
  rationale: תּוֹעֵבָה désigne ce qui est odieux ou abominable sur le plan moral ou cultuel. La formulation concrète « actes abominables » est naturelle en français et conserve la force du pluriel.
- source_word: אַתְּ
  choice: tu
  rationale: Le pronom indépendant souligne la destinataire féminine, Jérusalem. En français, « tu » suffit ici à exprimer l’interpellation directe sans ajouter un lourd « toi-même ».
- source_word: נְשָׂאתִם
  choice: as porté
  rationale: Le verbe נשׂא signifie porter ou supporter et peut, dans un contexte judiciaire, évoquer la culpabilité ou les conséquences du péché. « As porté » maintient cette formulation compacte et son ambiguïté.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם, tandis que « Yahweh » représente directement le nom divin יְהוָה.
theological_decisions:
- issue: Traduction du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens judiciaire possible de נשׂא
  choice: as porté
  alternative: as subi le châtiment de / as porté la culpabilité de
  rationale: Le contexte permet de comprendre que Jérusalem porte sa culpabilité ou les conséquences de ses actes, mais le texte hébreu ne précise pas laquelle de ces nuances domine. La traduction principale préserve cette tension, et la note expose les lectures possibles.
translation_notes:
  register: Français moderne, direct et solennel. Le féminin grammatical de l’hébreu vise Jérusalem personnifiée, mais il n’est pas marqué sur le pronom français « tu ». « Conduite infâme » et « actes abominables » conservent la vigueur morale du passage tout en restant immédiatement compréhensibles.
