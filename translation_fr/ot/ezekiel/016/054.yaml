  text: so that you may bear your disgrace and be ashamed because of all that you have done[a], becoming a comfort to them.
translation:
  language: fr
  text: afin que tu portes ton déshonneur et que tu sois honteuse à cause de tout ce que tu as fait[a], en les consolant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand tu les consoleras » ou « en devenant pour elles une consolation ». L’expression hébraïque peut être comprise selon des nuances circonstancielles, temporelles ou instrumentales proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat; « afin que » restitue clairement cette valeur en français courant et soutenu.
- source_word: תִּשְׂאִי כְלִמָּתֵךְ
  choice: tu portes ta honte
  rationale: L’expression associe נשׂא, « porter », à כְּלִמָּה, la honte ou l’opprobre. La traduction conserve l’image hébraïque sans lourdeur.
- source_word: וְנִכְלַמְתְּ
  choice: et que tu sois couverte de honte
  rationale: Le nifal de כלם exprime le fait d’être honteuse ou humiliée. Cette formulation distingue l’état éprouvé de la « honte » portée dans le membre précédent.
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: à cause de tout ce que tu as fait
  rationale: Après un verbe de honte, מִן peut indiquer la cause. « À cause de » rend explicitement cette relation naturelle en français.
- source_word: בְּנַחֲמֵךְ אֹתָן
  choice: en devenant pour elles une consolation
  rationale: La construction avec בְּ et la forme de נחם admet une valeur circonstancielle, temporelle ou instrumentale. Cette formulation exprime la circonstance future envisagée dans le contexte sans exclure entièrement les nuances voisines.
theological_decisions:
- issue: Rapport entre la honte de Jérusalem et la consolation des autres villes dans le contexte du rétablissement
  choice: La honte de Jérusalem accompagne le fait qu’elle devient une consolation pour elles.
  alternative: La proposition peut aussi se comprendre « quand tu les consoleras » ou « en les consolant ».
  rationale: Ézéchiel 16.53-55 envisage le rétablissement conjoint de Jérusalem, Sodome et Samarie. La formulation principale maintient ce cadre prospectif, tandis que la note préserve l’ambiguïté syntaxique réelle de בְּנַחֲמֵךְ.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier est conservé puisque Jérusalem est directement interpellée; « elles » renvoie aux villes-sœurs féminines du contexte.
