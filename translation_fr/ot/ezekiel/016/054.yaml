review_pass:
  verdict: revise
  source_fidelity: La proposition rend correctement la finalité de לְמַעַן, l’idée de porter la disgrâce, la honte liée à ce qui a été fait, et le référent féminin pluriel d’אֹתָן. Toutefois, « en devenant pour elles une consolation » transforme le verbe actif נחם (« consoler [elles] ») en une tournure nominale plus interprétative. La construction hébraïque reste ambiguë quant à la nuance circonstancielle, temporelle ou instrumentale, mais son objet direct doit être conservé dans le texte principal.
  naturalness: « Tu sois couverte de honte » est compréhensible, mais alourdit la répétition de « honte » avec le premier membre et suggère davantage une honte imposée de l’extérieur. « Tu sois honteuse » est plus direct, naturel et proche du nifal de כלם. « Porter ton déshonneur » préserve utilement la distinction entre כְּלִמָּה et le verbe « être honteuse ».
  terminology: « Déshonneur » convient bien à כְּלִמָּה, qui comporte une dimension de disgrâce publique; « honteuse » rend naturellement נִכְלַמְתְּ. « Consoler » rend le piel de נחם sans introduire la reformulation nominale « une consolation ».
  issues:
  - severity: medium
    issue: Le rendu principal de בְּנַחֲמֵךְ אֹתָן change l’action verbale en état nominal.
    rationale: « En devenant pour elles une consolation » ne traduit pas directement « en/quant à les consolant » et atténue le fait qu’« elles » est l’objet direct du verbe hébreu. Une formulation verbale conserve mieux la syntaxe et la portée de l’ambiguïté.
  - severity: low
    issue: « Couverte de honte » est moins précis et crée une répétition stylistiquement pesante.
    rationale: Le nifal de כלם signifie ici être honteuse / être humiliée. « Sois honteuse » est plus idiomatique et distingue mieux ce prédicat de « porter ton déshonneur ».
  revised_text: afin que tu portes ton déshonneur et que tu sois honteuse à cause de tout ce que tu as fait[a], en les consolant.
