source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: fr
  text: Toi aussi, porte ton déshonneur, toi qui as plaidé en faveur de tes sœurs[a] par tes péchés, en te conduisant de façon plus abominable qu’elles. Elles se sont montrées plus justes que toi[b]. Toi aussi donc, aie honte et porte ton déshonneur, puisque tu as fait paraître tes sœurs justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « jugé en faveur de tes sœurs » ou « intercédé pour tes sœurs ». L’hébreu est ironique : par ses péchés, Jérusalem a fourni à ses sœurs une défense par comparaison.'
    reason: lexical_alternative
  - marker: b
    text: Ou « elles ont été reconnues plus justes que toi ». Il s’agit d’une comparaison, non de l’affirmation qu’elles étaient justes au sens absolu.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי
  choice: porte
  rationale: L’impératif de נשׂא signifie ici assumer ou supporter son déshonneur. « Porte » conserve l’image hébraïque tout en restant naturel en français.
- source_word: כְלִמָּתֵךְ
  choice: ton déshonneur
  rationale: כְּלִמָּה désigne la honte publique, l’opprobre ou le déshonneur. Ce choix permet de distinguer ce terme de בּוֹשִׁי, rendu par « aie honte ».
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: tu as plaidé en faveur de tes sœurs
  rationale: 'Le piel de פלל avec ל porte ici un sens judiciaire ou d’intervention en faveur de quelqu’un. La formulation préserve l’ironie : par sa conduite, Jérusalem a fourni une défense à ses sœurs, sans imposer l’idée d’une déclaration judiciaire formelle.'
- source_word: בְּחַטֹּאתַיִךְ
  choice: par tes péchés
  rationale: 'La préposition ב est comprise dans un sens instrumental : les péchés de Jérusalem sont le moyen par lequel ses sœurs se trouvent défendues ou réhabilitées par comparaison.'
- source_word: הִתְעַבְתְּ מֵהֵן
  choice: en te conduisant de façon plus abominable qu’elles
  rationale: La forme hitpael de תעב et la construction comparative indiquent que Jérusalem s’est comportée d’une manière plus abominable que ses sœurs.
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: elles se sont montrées plus justes que toi
  rationale: Le verbe צדק est explicitement comparatif ici. « Se sont montrées » exprime la reconnaissance ou l’apparence de justice produite par la comparaison, sans attribuer aux sœurs une justice morale absolue.
- source_word: בּוֹשִׁי
  choice: aie honte
  rationale: L’impératif de בוש appelle Jérusalem à éprouver la honte. « Aie honte » est direct et distingue l’émotion du « déshonneur » qu’elle doit porter.
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: puisque tu as fait paraître tes sœurs justes
  rationale: La construction exprime le fait que Jérusalem a justifié ou fait paraître justes ses sœurs par contraste. Cette formulation française rend le résultat comparatif sans suggérer une innocence absolue.
theological_decisions:
- issue: La justice comparative attribuée à Sodome et à Samarie face à Jérusalem
  choice: 'Exprimer une justice relative révélée par la comparaison : « plus justes que toi » et « fait paraître… justes ».'
  alternative: Comprendre le texte comme l’affirmation d’une justice morale absolue des sœurs, ou uniquement comme leur acquittement juridique formel.
  rationale: Le comparatif מִמֵּךְ et le contexte des abominations de Jérusalem indiquent que ses sœurs sont dites plus justes relativement à elle. La traduction conserve la force provocatrice du propos sans effacer son caractère comparatif.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement féminin singulier reflète l’adresse personnifiée à Jérusalem. La répétition de « porte ton déshonneur » est maintenue, tout comme le contraste entre le déshonneur public et l’appel à éprouver de la honte.
