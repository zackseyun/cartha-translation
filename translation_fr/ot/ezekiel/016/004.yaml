  text: וּ/מוֹלְדוֹתַ֗יִ/ךְ בְּ/י֨וֹם הוּלֶּ֤דֶת אֹתָ/ךְ֙ לֹֽא כָרַּ֣ת שָׁרֵּ֔/ךְ וּ/בְ/מַ֥יִם לֹֽא רֻחַ֖צְתְּ לְ/מִשְׁעִ֑י וְ/הָמְלֵ֨חַ֙ לֹ֣א הֻמְלַ֔חַתְּ וְ/הָחְתֵּ֖ל לֹ֥א חֻתָּֽלְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: fr
  text: Quant à ta naissance, le jour où tu es née, on n’a pas coupé ton cordon ombilical, on ne t’a pas lavée avec de l’eau pour te nettoyer[a], on ne t’a pas frottée de sel[b] et on ne t’a pas emmaillotée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour te frotter » ou « pour lisser ta peau ». Le terme hébreu est rare, et son sens exact est discuté.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’une ancienne pratique de soin qui consistait à frotter le nouveau-né avec du sel.
    reason: cultural_note
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: ta naissance
  rationale: Le pluriel hébreu désigne ici idiomatiquement les circonstances de la naissance. « Ta naissance » est naturel en français et correspond à l’image obstétricale développée dans la suite du verset.
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: le jour où tu es née
  rationale: Cette formulation temporelle rend directement l’hébreu dans un français courant. Le féminin correspond à la destinataire personnifiée du passage, Jérusalem.
- source_word: שָׁרֵךְ
  choice: ton cordon ombilical
  rationale: Le terme désigne le cordon du nouveau-né. L’explicitation « ombilical » évite toute ambiguïté en français sans modifier le référent.
- source_word: לֹא כָרַּת
  choice: on n’a pas coupé
  rationale: La tournure impersonnelle française restitue naturellement l’action non accomplie sur le cordon, sans introduire d’agent absent de l’hébreu.
- source_word: רֻחַצְתְּ בְמַיִם
  choice: on ne t’a pas lavée avec de l’eau
  rationale: Rendu proche de la formulation hébraïque, adapté aux soins donnés à un nouveau-né.
- source_word: לְמִשְׁעִי
  choice: pour te nettoyer
  rationale: Le mot est rare et son sens exact demeure discuté. « Pour te nettoyer » exprime le sens probable dans le contexte tout en signalant en note les autres analyses lexicales.
- source_word: הָמְלֵחַ לֹא הֻמְלַחַתְּ
  choice: on ne t’a pas frottée de sel
  rationale: L’hébreu emploie une construction intensive autour du verbe « saler ». Cette formulation française fait comprendre qu’il s’agit d’un soin ancien appliqué au nouveau-né, plutôt que d’un usage culinaire.
- source_word: הָחְתֵּל לֹא חֻתָּלְתְּ
  choice: on ne t’a pas emmaillotée
  rationale: « Emmailloter » est le terme français précis et encore compréhensible pour envelopper étroitement un nouveau-né dans des langes.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Les formes féminines sont employées parce que le discours s’adresse à Jérusalem personnifiée comme une femme. La répétition hébraïque intensive des verbes « saler » et « emmailloter » est rendue par des formulations françaises naturelles, sans lourdeur artificielle.
