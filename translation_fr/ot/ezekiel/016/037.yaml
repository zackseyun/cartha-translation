source:
  edition: WLC
  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: fr
  text: C’est pourquoi, voici que je vais rassembler tous tes amants, en qui tu as trouvé ton plaisir, tous ceux que tu as aimés, ainsi que tous ceux que tu as détestés. Je les rassemblerai de tous côtés contre toi, je dévoilerai ta nudité devant eux[c], et ils verront toute ta nudité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: « Dévoiler ta nudité » est une image prophétique d’exposition publique et d’humiliation.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire de l’accusation précédente, tout en conservant la force logique de l’hébreu.
- source_word: הִנְנִי מְקַבֵּץ
  choice: 'me voici : je rassemble'
  rationale: « Me voici » garde la solennité et l’immédiateté de l’annonce prophétique; le présent « je rassemble » reflète le participe exprimant une action imminente et certaine.
- source_word: מְאַהֲבַיִךְ
  choice: tes amants
  rationale: Le contexte développe explicitement une métaphore sexuelle et conjugale; « amants » en préserve la portée accusatrice sans la réduire à des alliances politiques.
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: avec lesquels tu as pris plaisir
  rationale: Le verbe ערב peut ici exprimer le plaisir ou les délices. Cette formulation reste relationnelle et conserve l’ambiguïté quant à la nuance exacte du plaisir.
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: tous ceux que tu as aimés, ainsi que tous ceux que tu as détestés
  rationale: Rend l’inclusion des deux catégories opposées — aimés et détestés — dans le rassemblement en vue du jugement.
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: Je les rassemblerai de toutes parts contre toi
  rationale: Dans ce contexte judiciaire, עָלַיִךְ a une valeur hostile, « contre toi »; « de toutes parts » restitue מִסָּבִיב de façon idiomatique.
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: je dévoilerai ta nudité devant eux
  rationale: « Dévoiler » conserve l’image concrète d’exposition; « devant eux » exprime naturellement en français l’exposition à leur vue.
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: ils verront toute ta nudité
  rationale: Préserve la répétition rhétorique de עֶרְוָה et l’intensité de l’humiliation publique.
theological_decisions:
- issue: Métaphore prophétique sexuelle et honte publique dans le jugement de Jérusalem
  choice: Conserver les termes concrets « amants » et « nudité ».
  alternative: Remplacer la métaphore par des termes abstraits comme « alliés » et « honte ».
  rationale: Le chapitre représente volontairement l’infidélité à l’alliance sous une image conjugale et sexuelle. Garder cette image respecte la force rhétorique et théologique du texte sans imposer une interprétation confessionnelle supplémentaire.
- issue: Valeur de עָלַיִךְ dans le rassemblement
  choice: « contre toi »
  alternative: « auprès de toi » ou « vers toi »
  rationale: Le cadre de jugement indique que les personnes rassemblées deviennent les agents ou témoins hostiles de l’exposition; la valeur adversative convient donc le mieux tout en restant proche de l’hébreu.
translation_notes:
  register: Français international moderne, digne et direct. La structure solennelle « me voici » maintient le ton prophétique, tandis que la ponctuation rend la phrase longue lisible. Le féminin singulier adressé à Jérusalem demeure perceptible par le contexte et les possessifs, sans ajout explicatif dans le verset.
