revisions:
- from: 'C’est pourquoi, me voici : je rassemble tous tes amants avec lesquels tu as pris plaisir[a], tous ceux que tu as aimés, ainsi que tous ceux que tu as détestés. Je les rassemblerai de toutes parts contre toi[b], je dévoilerai ta nudité devant eux[c], et ils verront toute ta nudité.'
  to: C’est pourquoi, voici que je vais rassembler tous tes amants, en qui tu as trouvé ton plaisir, tous ceux que tu as aimés, ainsi que tous ceux que tu as détestés. Je les rassemblerai de tous côtés contre toi, je dévoilerai ta nudité devant eux[c], et ils verront toute ta nudité.
  rationale: La révision remplace une expression française maladroite par une formulation idiomatique qui rend la nuance de plaisir/délice du verbe hébreu, et harmonise l’annonce initiale avec les futurs de jugement qui suivent. L’ancre [a] est supprimée, car la formulation retenue correspond à l’alternative qui constituait sa note ; l’ancre [b] est supprimée car cette note interprétative ne porte pas sur un mot précis du texte et n’est pas nécessaire à la compréhension du verset. La note [c], directement ancrée à l’image de la nudité dévoilée, est conservée.
