  text: וָ/אֶעֱבֹ֨ר עָלַ֜יִ/ךְ וָ/אֶרְאֵ֗/ךְ וְ/הִנֵּ֤ה עִתֵּ/ךְ֙ עֵ֣ת דֹּדִ֔ים וָ/אֶפְרֹ֤שׂ כְּנָפִ/י֙ עָלַ֔יִ/ךְ וָ/אֲכַסֶּ֖ה עֶרְוָתֵ֑/ךְ וָ/אֶשָּׁ֣בַֽע לָ֠/ךְ וָ/אָב֨וֹא בִ/בְרִ֜ית אֹתָ֗/ךְ נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה וַ/תִּ֥הְיִי לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: fr
  text: Je suis passé près de toi et je t’ai vue. Voici que ton temps était le temps des amours[a]. Alors j’ai étendu sur toi le pan de mon vêtement[b] et j’ai couvert ta nudité. Je t’ai prêté serment et je suis entré en alliance avec toi — déclaration du Seigneur Yahweh —, et tu es devenue mienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « le temps de l’amour », « le temps des caresses » ou « le temps de l’union amoureuse »; elle comporte ici des nuances romantiques et érotiques dans le cadre de l’image nuptiale.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « j’ai étendu mon aile sur toi ». Le mot hébreu peut aussi désigner le bord ou le pan d’un vêtement; le geste évoque ici la protection et l’engagement nuptial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ
  choice: Je suis passé près de toi et je t’ai vue
  rationale: Le verbe עבר avec על exprime le fait de passer près de quelqu’un. Aucun équivalent de « de nouveau » n’est ajouté, puisqu’il n’est pas explicite dans l’hébreu. Le féminin de « vue » correspond à Jérusalem personnifiée.
- source_word: וְהִנֵּה
  choice: Voici que
  rationale: Cette tournure conserve la fonction de mise en relief de הִנֵּה dans un français soutenu mais actuel.
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: ton temps était venu, le temps de l’amour
  rationale: La formulation rend la répétition de עֵת tout en restant naturelle. דֹּדִים peut désigner l’amour, les caresses ou l’amour érotique; « le temps de l’amour » préserve l’étendue de sens et le cadre nuptial sans le surinterpréter.
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: j’ai étendu sur toi le pan de mon vêtement
  rationale: כָּנָף signifie littéralement « aile », mais peut aussi désigner le bord ou le pan d’un vêtement. Dans cette scène d’alliance nuptiale, « le pan de mon vêtement » rend clairement le geste concret; le sens littéral est signalé en note.
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: j’ai couvert ta nudité
  rationale: « Nudité » traduit directement עֶרְוָה et maintient les connotations d’exposition corporelle et de pudeur.
- source_word: וָאֶשָּׁבַע לָךְ
  choice: Je t’ai prêté serment
  rationale: Cette expression française rend naturellement l’acte de jurer envers quelqu’un sans ajouter un contenu absent du texte.
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: je suis entré en alliance avec toi
  rationale: La traduction suit de près l’idiome hébreu « entrer dans une alliance » et conserve la solennité de l’engagement.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם est une formule prophétique d’attestation. « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה.
- source_word: וַתִּהְיִי לִי
  choice: tu es devenue mienne
  rationale: La formule signifie littéralement « tu es devenue à moi ». Le féminin convient à Jérusalem et exprime l’appartenance d’alliance sans ajouter explicitement « épouse ».
theological_decisions:
- issue: Image nuptiale de l’alliance et portée érotique
  choice: Conserver ensemble « le temps de l’amour », la nudité couverte, le serment et l’entrée en alliance.
  alternative: Atténuer toute portée érotique, ou expliciter « le temps des relations sexuelles ».
  rationale: Le texte présente l’alliance entre Yahweh et Jérusalem sous la forme d’une union nuptiale. La traduction maintient cette tension entre amour, sexualité, protection et engagement d’alliance sans l’affaiblir ni l’accentuer au-delà de l’hébreu.
- issue: Sens de כָּנָף dans le geste nuptial
  choice: Employer « le pan de mon vêtement » dans le texte et conserver « aile » en note.
  alternative: Traduire directement « mon aile ».
  rationale: Les deux sens sont lexicalement fondés. Le texte principal rend l’idiome compréhensible en français, tandis que la note préserve l’image littérale et son ambiguïté suggestive.
- issue: Titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Cette forme distingue le titre אֲדֹנָי du nom propre יהוה et évite de masquer le nom divin derrière un second titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé soutient un récit vivant; « Voici que » et « déclaration du Seigneur Yahweh » conservent la solennité prophétique. Les accords féminins rendent explicite que le discours s’adresse à Jérusalem personnifiée.
