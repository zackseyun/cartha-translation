source:
  edition: WLC
  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Et mon pain[a] que je t’ai donné — la fleur de farine, l’huile et le miel dont je t’ai nourrie — tu l’as placé devant eux comme un parfum agréable[b]. Et il en fut ainsi, déclare le Seigneur Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma nourriture ». En hébreu, le mot rendu par « pain » peut désigner plus largement la nourriture.
    reason: lexical_alternative
  - marker: b
    text: « Un parfum agréable » appartient au langage habituel des sacrifices ; l’expression est ici employée avec ironie pour ce qui est présenté aux idoles.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu porte « Seigneur Yahweh » : « Seigneur » est un titre, tandis que « Yahweh » représente le nom divin יהוה (YHWH).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמִי
  choice: mon pain
  rationale: Le sens concret de « pain » est conservé; le mot peut aussi désigner plus largement la nourriture, possibilité signalée en note.
- source_word: סֹלֶת
  choice: la fleur de farine
  rationale: Expression française courante pour une farine fine et de qualité; elle conserve aussi la résonance cultuelle du terme.
- source_word: שֶׁמֶן
  choice: l’huile
  rationale: L’hébreu dit simplement « huile »; préciser qu’il s’agit d’huile d’olive ajouterait une information implicite mais non exprimée.
- source_word: דְבַשׁ
  choice: le miel
  rationale: Traduction usuelle du terme, sans trancher en faveur d’un éventuel sirop de fruits.
- source_word: הֶאֱכַלְתִּיךְ
  choice: dont je te nourrissais
  rationale: Rend naturellement la forme causative, littéralement « avec lesquels je te faisais manger », et relie clairement l’action aux aliments énumérés.
- source_word: וּנְתַתִּיהוּ
  choice: tu l’as placé
  rationale: 'Le contexte accusatoire exige que Jérusalem soit le sujet: elle a présenté aux idoles ce que Dieu lui avait donné. « Placer » convient à la présentation d’une offrande.'
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Le pronom reste implicite comme en hébreu et renvoie aux idoles évoquées dans le contexte.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  rationale: Conserve la formule sacrificielle, ici appliquée ironiquement à une offrande faite aux idoles.
- source_word: וַיֶּהִי
  choice: Et il en fut ainsi
  rationale: Formulation française digne qui maintient la confirmation emphatique et lapidaire de l’accusation.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend la formule prophétique; « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוָה.
theological_decisions:
- issue: Formule cultuelle appliquée à l’idolâtrie
  choice: comme un parfum agréable
  alternative: comme une odeur apaisante
  rationale: La formulation sacrificielle est conservée sans expliciter dans le texte principal l’ironie accusatrice.
- issue: Traduction du nom divin יְהוָה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette solution représente distinctement le titre « Seigneur » et le nom divin, sans produire l’expression confuse « le Seigneur SEIGNEUR ».
- issue: Sujet de וּנְתַתִּיהוּ
  choice: tu l’as placé
  alternative: je l’ai placé
  rationale: 'Malgré une forme graphiquement susceptible d’être rapprochée de la première personne, la syntaxe et le contexte immédiat poursuivent l’accusation adressée à Jérusalem: elle présente aux idoles les dons reçus de Dieu.'
translation_notes:
  register: Français international moderne, clair et digne. Les tirets isolent l’énumération explicative sans alourdir la phrase. Le tutoiement conserve l’adresse directe à Jérusalem personnifiée; le vocabulaire sacrificiel et la confirmation finale restent volontairement sobres.
