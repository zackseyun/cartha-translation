  yaml_path: translation/ot/ezekiel/016/050.yaml
  text: They became haughty and committed abomination before me[b][a], so I removed them when I saw it.
translation:
  language: fr
  text: Elles devinrent orgueilleuses et commirent une abomination devant moi. Alors je les ôtai quand je vis cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand » ou « comme je vis » ; le complément « cela » est sous-entendu en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: Elles devinrent orgueilleuses
  rationale: Le verbe גבהּ exprime ici l’élévation de soi au sens moral, donc l’orgueil. Cette formulation est naturelle en français et conserve l’idée d’un changement d’attitude.
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: commirent une abomination
  rationale: Le verbe עשה signifie largement « faire », mais avec תוֹעֵבָה, « commettre une abomination » est l’expression française idiomatique qui garde toute la force morale et religieuse du terme.
- source_word: לְפָנָי
  choice: devant moi
  rationale: Traduction directe qui exprime que leur conduite a eu lieu sous le regard de Dieu, sans ajouter d’interprétation.
- source_word: וָאָסִיר אֶתְהֶן
  choice: Alors je les fis disparaître
  rationale: La forme causative de סור indique que Dieu les a ôtées ou éliminées de leur place. « Faire disparaître » convient au contexte de jugement et reste naturel en français.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: quand je vis cela
  rationale: כַּאֲשֶׁר peut marquer le temps ou la circonstance. Le complément « cela », absent mais implicite en hébreu, reprend naturellement la conduite abominable mentionnée juste avant.
theological_decisions:
- issue: Formulation du jugement divin
  choice: Alors je les fis disparaître
  alternative: et je les écartai
  rationale: Le texte attribue directement à Dieu une action de jugement. La traduction en conserve la netteté sans préciser au-delà du texte la forme exacte de cette disparition.
- issue: Lien entre la constatation et le jugement
  choice: quand je vis cela
  alternative: comme je le vis
  rationale: La valeur temporelle et circonstancielle est la plus naturelle ici, tout en laissant ouverte la portée exacte du lien exprimé par כַּאֲשֶׁר.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit prophétique écrit. « Abomination » est maintenu pour préserver la forte portée morale et cultuelle du terme hébreu.
