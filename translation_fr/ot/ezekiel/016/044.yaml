  text: הִנֵּה֙ כָּל הַ/מֹּשֵׁ֔ל עָלַ֥יִ/ךְ יִמְשֹׁ֖ל לֵ/אמֹ֑ר כְּ/אִמָּ֖/ה בִּתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/044.yaml
  text: Look[a], everyone who uses proverbs about you will use this proverb, saying, ‘Like mother, like daughter.’
translation:
  language: fr
  text: 'Voici, quiconque dit des proverbes à ton sujet dira ce proverbe : « Telle mère, telle fille ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec dignité l’appel à l’attention du texte hébreu, tout en restant courant en français biblique moderne.
- source_word: כָּל הַמֹּשֵׁל
  choice: quiconque dit des proverbes
  rationale: Le participe substantivé précédé de כָּל a une valeur distributive. « Quiconque » rend cette généralité, et « dit des proverbes » exprime le sens proverbial de משל.
- source_word: עָלַיִךְ
  choice: à ton sujet
  rationale: Rend naturellement le thème visé par le proverbe sans imposer à la préposition une nuance hostile, même si le contexte peut être accusateur.
- source_word: יִמְשֹׁל
  choice: dira ce proverbe
  rationale: Le verbe reprend la racine משל au sens d’énoncer un proverbe, non de gouverner. « Ce proverbe » annonce naturellement la formule qui suit.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent directement et sans lourdeur les paroles citées; traduire aussi par « en disant » serait redondant.
- source_word: כְּאִמָּה בִּתָּהּ
  choice: Telle mère, telle fille !
  rationale: Proverbe français établi qui conserve le parallélisme compact, la force et le sens de la formule hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve l’adresse féminine singulière (« ton ») et la concision proverbiale de la clausule. Aucun marqueur de note n’est requis, car le sens non régalien de משל est explicité sans ambiguïté par « proverbes ».
