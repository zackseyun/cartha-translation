source:
  edition: WLC
  text: הָ/אִשָּׁ֖ה הַ/מְּנָאָ֑פֶת תַּ֣חַת אִישָׁ֔/הּ תִּקַּ֖ח אֶת זָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: fr
  text: L’épouse adultère prend des étrangers à la place de son mari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La femme qui commet l’adultère prend d’autres hommes à la place de son mari. »'
    reason: Variante lexicale explicitant le participe et la référence masculine implicite dans le contexte.
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le nom peut désigner une femme ou une épouse. En français, « la femme » conserve cette forme tout en prenant naturellement le sens d’« épouse » grâce à la mention de « son mari ».
- source_word: הַמְּנָאָפֶת
  choice: adultère
  rationale: Le participe caractérise la femme par son adultère. L’adjectif « adultère » est concis, naturel et digne en français moderne.
- source_word: תַּחַת
  choice: à la place de
  rationale: La préposition exprime ici la substitution plutôt qu’une position spatiale.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte conjugal, אִישׁ avec le suffixe féminin singulier désigne naturellement le mari.
- source_word: תִּקַּח
  choice: prend
  rationale: Le verbe לקח signifie couramment « prendre » ; le présent garde la vigueur de la dénonciation prophétique.
- source_word: אֶת
  choice: '[marqueur d’objet direct non traduit]'
  rationale: אֶת est un marqueur grammatical de l’objet direct et ne reçoit pas d’équivalent lexical distinct en français.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des hommes extérieurs au lien conjugal. « Des étrangers » préserve la formulation du texte sans lui donner nécessairement un sens ethnique.
theological_decisions:
- issue: Représentation métaphorique de l’infidélité de Jérusalem sous la forme de l’adultère conjugal
  choice: 'Conserver directement l’image matrimoniale : « La femme adultère prend des étrangers à la place de son mari. »'
  alternative: « La femme qui commet l’adultère prend d’autres hommes au lieu de son mari. »
  rationale: Le verset appartient à la métaphore développée de l’infidélité à l’alliance. La traduction maintient la force de l’accusation sans réduire l’image sexuelle à une simple paraphrase spirituelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe hébraïque tout en étant naturelle ; elle préserve l’ambiguïté relative de זָרִים grâce au nom « étrangers », avec une explicitation possible en note.
