  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: fr
  text: Je t’ai rendue aussi nombreuse que la végétation des champs[a]. Tu t’es multipliée, tu as grandi et tu es parvenue à la pleine parure[b]. Tes seins se sont formés[c] et tes poils ont poussé ; pourtant, tu étais nue, entièrement dénudée[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme les plantes des champs » ou « comme ce qui pousse dans les champs ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, selon une compréhension possible de l’hébreu : « à la parure des parures ». L’expression obscure peut évoquer la pleine beauté ou l’âge où l’on porte des parures.'
    reason: alternative_reading
  - marker: c
    text: Ou « tes seins se sont développés ».
    reason: lexical_alternative
  - marker: d
    text: Les deux mots hébreux rapprochés renforcent l’image d’un dénuement et d’une exposition complets.
    reason: translation_explanation
lexical_decisions:
- source_word: רְבָבָה
  choice: aussi nombreuse
  rationale: Le nom évoque une multitude immense. Avec נְתַתִּיךְ, le français « je t’ai rendue aussi nombreuse » exprime naturellement l’idée causative sans imposer la valeur numérique précise de « dix mille ».
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: comme la végétation des champs
  rationale: צֶמַח désigne ce qui pousse, la croissance ou la végétation. Cette formulation conserve l’image végétale et convient à l’idée de multiplication.
- source_word: וַתִּרְבִּי וַתִּגְדְּלִי
  choice: tu t’es multipliée, tu as grandi
  rationale: Les deux verbes sont maintenus afin de préserver le mouvement du texte, qui passe de l’accroissement à la croissance et à la maturité.
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: tu es parvenue à la pleine parure
  rationale: L’expression hébraïque, difficile, associe l’arrivée à maturité au langage de la parure. « Pleine parure » en conserve l’image sans préciser indûment qu’il s’agirait du mariage ou d’un phénomène physiologique déterminé.
- source_word: שָׁדַיִם נָכֹנוּ
  choice: tes seins se sont formés
  rationale: Le nifal de כון peut signifier être établi, préparé ou formé. Dans cette description de la puberté, « se sont formés » est clair et fidèle.
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: tes poils ont poussé
  rationale: שֵׂעָר peut désigner les cheveux ou les poils. Dans la séquence corporelle liée à la maturation sexuelle, « poils » rend le sens contextuel probable tout en restant sobre.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nue, entièrement dénudée
  rationale: Les deux termes proches forment une expression intensive. Cette traduction préserve le redoublement sémantique dans un français naturel.
theological_decisions:
- issue: Sens de בַּעֲדִי עֲדָיִים dans la métaphore de la maturation
  choice: Conserver dans le texte principal l’image d’une parure pleinement atteinte.
  alternative: « à l’âge des parures », « à la beauté parfaite » ou une référence plus explicite à la puberté ou à la condition nuptiale
  rationale: Le contexte personnifie Jérusalem sous les traits d’une jeune fille arrivant à maturité, mais l’expression hébraïque demeure obscure. La traduction garde donc le vocabulaire de la parure et signale l’incertitude sans imposer une interprétation sexuelle, matrimoniale ou rituelle précise.
translation_notes:
  register: Français international moderne, clair et digne. Les accords féminins maintiennent la personnification de Jérusalem. La formulation reste explicite comme l’hébreu, sans être clinique ni euphémisante.
