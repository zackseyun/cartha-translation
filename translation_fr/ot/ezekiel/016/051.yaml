  text: וְ/שֹׁ֣מְר֔וֹן כַּ/חֲצִ֥י חַטֹּאתַ֖יִ/ךְ לֹ֣א חָטָ֑אָה וַ/תַּרְבִּ֤י אֶת תּוֹעֲבוֹתַ֨יִ/ךְ֙ מֵ/הֵ֔נָּה וַ/תְּצַדְּקִי֙ אֶת אחות/ך בְּ/כָל תּוֹעֲבוֹתַ֖יִ/ךְ אֲשֶׁ֥ר עשיתי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
translation:
  language: fr
  text: Samarie n’a pas péché ne serait-ce que la moitié autant que toi ; toi, tu as multiplié tes abominations plus qu’elles ne l’ont fait et, par toutes les abominations que tu as commises, tu as fait paraître tes sœurs justes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as justifié tes sœurs ». La formulation hébraïque peut se traduire plus littéralement ainsi ; dans le contexte, les abominations plus nombreuses de Jérusalem font paraître ses sœurs justes par comparaison.
    reason: Alternative lexicale et préservation de la formulation plus littérale de l’hébreu.
lexical_decisions:
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Nom français traditionnel de la ville personnifiée, qui représente ici le royaume du Nord.
- source_word: כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה
  choice: n’a pas commis la moitié de tes péchés
  rationale: Rend directement la comparaison hébraïque et maintient le substantif explicite « tes péchés » dans un français naturel.
- source_word: וַתַּרְבִּי אֶת תּוֹעֲבוֹתַיִךְ
  choice: tu as multiplié tes abominations
  rationale: « Multiplier » exprime l’augmentation quantitative, tandis qu’« abominations » conserve la vigueur morale et cultuelle du vocabulaire d’Ézéchiel.
- source_word: מֵהֵנָּה
  choice: plus qu’elles ne l’ont fait
  rationale: Le pronom féminin pluriel renvoie, dans le contexte, aux villes-sœurs Samarie et Sodome; la formulation explicite naturellement la comparaison en français.
- source_word: וַתְּצַדְּקִי אֶת אֲחוֹתַיִךְ
  choice: tu as fait paraître tes sœurs justes
  rationale: 'Le contexte présente une justice comparative et apparente : les crimes plus grands de Jérusalem font paraître ses sœurs justes par contraste.'
- source_word: בְּכָל תּוֹעֲבוֹתַיִךְ אֲשֶׁר עָשִׂית
  choice: par toutes les abominations que tu as commises
  rationale: La préposition est prise au sens instrumental; « commettre » convient naturellement à des actes moralement condamnables.
theological_decisions:
- issue: Portée de « tu as justifié tes sœurs »
  choice: une apparence de justice produite par comparaison
  alternative: une justification ou déclaration réelle de justice
  rationale: La rhétorique comparative du passage ne présente pas Samarie et Sodome comme moralement acquittées; la conduite de Jérusalem les fait seulement paraître justes en comparaison. Une note conserve toutefois la formulation hébraïque plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement féminin singulier correspond à Jérusalem personnifiée. « Abominations » conserve la force du registre prophétique.
