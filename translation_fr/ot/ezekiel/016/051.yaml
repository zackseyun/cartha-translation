  to: Samarie n’a pas péché ne serait-ce que la moitié autant que toi ; toi, tu as multiplié tes abominations plus qu’elles ne l’ont fait et, par toutes les abominations que tu as commises, tu as fait paraître tes sœurs justes[a].
  rationale: La révision rend explicitement la force comparative de « pas même la moitié » dans l’hébreu, sans modifier le sens. Elle conserve l’image rhétorique selon laquelle la perversité supérieure de Jérusalem fait paraître Samarie et Sodome justes par comparaison, plutôt que de leur attribuer une justification effective.
