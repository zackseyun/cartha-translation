  text: וָ/אֶעֱבֹ֤ר עָלַ֨יִ/ךְ֙ וָֽ/אֶרְאֵ֔/ךְ מִתְבּוֹסֶ֖סֶת בְּ/דָמָ֑יִ/ךְ וָ/אֹ֤מַר לָ/ךְ֙ בְּ/דָמַ֣יִ/ךְ חֲיִ֔י וָ/אֹ֥מַר לָ֖/ךְ בְּ/דָמַ֥יִ/ךְ חֲיִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: fr
  text: 'Je suis passé près de toi et je t’ai vue te débattre dans ton sang. Je t’ai dit : « Dans ton sang, vis ! » Je t’ai dit : « Dans ton sang, vis ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase « Dans ton sang, vis ! » est répétée en hébreu pour insister. La préposition peut aussi prendre ici une nuance concessive : « Bien que tu sois dans ton sang, vis ! »'
    reason: Répétition emphatique et autre compréhension possible de la préposition hébraïque.
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: Je suis passé près de toi
  rationale: Dans ce contexte narratif, עבר avec על décrit le passage à proximité de la personne. Cette formulation française est naturelle et conserve le mouvement de la scène.
- source_word: וָאֶרְאֵךְ
  choice: et je t’ai vue
  rationale: ראה signifie simplement « voir ». L’accord au féminin rend explicite le genre grammatical de la destinataire en hébreu.
- source_word: מִתְבּוֹסֶסֶת
  choice: te débattre
  rationale: Le participe dépeint le nouveau-né remuant péniblement dans son sang. « Te débattre » exprime la détresse et le mouvement sans suggérer une action volontaire ou une indignité morale.
- source_word: בְּדָמָיִךְ
  choice: dans ton sang
  rationale: Le pluriel hébreu se rend idiomatiquement par le singulier collectif en français. La préposition « dans » préserve l’image abrupte et évite de préciser s’il s’agit du sang de l’accouchement ou d’un autre sang versé.
- source_word: וָאֹמַר לָךְ
  choice: Alors je t’ai dit
  rationale: La conjonction narrative est rendue naturellement par « alors », tandis que « je t’ai dit » traduit directement אמר avec son complément indirect.
- source_word: בְּדָמַיִךְ חֲיִי
  choice: Dans ton sang, vis !
  rationale: 'La formulation conserve l’ordre, la brièveté et la force de l’hébreu : groupe prépositionnel suivi d’un impératif féminin singulier. Elle n’impose pas une interprétation concessive.'
- source_word: וָאֹמַר לָךְ ... חֲיִי (répété)
  choice: 'Oui, je t’ai dit : « Dans ton sang, vis ! »'
  rationale: « Oui » fait ressortir l’insistance de la répétition hébraïque tout en maintenant une tournure française lisible.
theological_decisions:
- issue: Valeur de ב dans בְּדָמַיִךְ חֲיִי
  choice: Conserver la formulation locative « Dans ton sang, vis ! »
  alternative: « Bien que tu sois dans ton sang, vis ! » ou « Même dans ton sang, vis ! »
  rationale: La construction hébraïque est condensée et peut recevoir une nuance concessive. Le texte principal en préserve la tension au lieu de trancher par une paraphrase explicative.
- issue: Nature du sang
  choice: Ne pas préciser s’il s’agit du sang de la naissance ou de sang versé
  alternative: « couverte du sang de ta naissance »
  rationale: Le contexte évoque un nouveau-né abandonné, mais le mot hébreu lui-même reste simplement « ton sang ». La traduction ne doit pas ajouter une précision absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé donne au récit une fluidité actuelle. Le tutoiement respecte l’adresse directe au féminin singulier. L’expression volontairement saisissante « Dans ton sang, vis ! » conserve la tension et la concision de l’original.
