source:
  edition: WLC
  text: בַּת אִמֵּ֣/ךְ אַ֔תְּ גֹּעֶ֥לֶת אִישָׁ֖/הּ וּ/בָנֶ֑י/הָ וַ/אֲח֨וֹת אֲחוֹתֵ֜/ךְ אַ֗תְּ אֲשֶׁ֤ר גָּֽעֲ֨לוּ֙ אַנְשֵׁי/הֶ֣ן וּ/בְנֵי/הֶ֔ן אִמְּ/כֶ֣ן חִתִּ֔ית וַ/אֲבִי/כֶ֖ן אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: fr
  text: Tu es la fille de ta mère, qui avait en horreur[a] son mari et ses enfants, et tu es la sœur de tes sœurs, qui avaient en horreur leurs maris et leurs enfants. Votre mère était une Hittite, et votre père était un Amoréen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejetait avec dégoût » ; le verbe hébreu exprime une forte répulsion.
    reason: lexical_alternative
  - marker: b
    text: 'Dans cette dernière phrase, l’hébreu emploie le pluriel : la mère et le père sont ceux de Jérusalem et de ses sœurs.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: la fille de ta mère
  rationale: Cette formulation conserve directement l’expression filiale hébraïque, qui souligne ici la ressemblance morale présentée comme un lien de parenté.
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: avait en horreur / avaient en horreur
  rationale: Le verbe געל exprime une forte répulsion ou un rejet profond. « Avoir en horreur » restitue cette intensité dans un français actuel et digne, tout en permettant une traduction cohérente des deux occurrences.
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: son mari / leurs maris
  rationale: Dans ce cadre familial et conjugal, אִישׁ désigne naturellement le mari plutôt que simplement l’homme.
- source_word: וּבָנֶיהָ / וּבְנֵיהֶן
  choice: ses enfants / leurs enfants
  rationale: בנים peut désigner collectivement la descendance; « enfants » évite de limiter indûment le propos aux seuls fils.
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: et tu es la sœur de tes sœurs
  rationale: Le tour garde la répétition généalogique marquée de l’hébreu et l’idée de ressemblance entre Jérusalem et les villes symboliquement présentées comme ses sœurs.
- source_word: אִמְּכֶן חִתִּית
  choice: Votre mère était une Hittite
  rationale: Le prédicat nominal est rendu naturellement en français par l’ajout de « était ». Le passage du singulier au pluriel dans le suffixe hébreu est conservé par « votre » et explicité en note.
- source_word: וַאֲבִיכֶן אֱמֹרִי
  choice: et votre père un Amoréen
  rationale: La formulation nominale et resserrée conserve le parallélisme accusateur de l’hébreu.
theological_decisions:
- issue: La parenté hittite et amoréenne attribuée à Jérusalem
  choice: Conserver sans l’expliquer dans le corps du texte le langage littéral de la filiation employé par l’accusation prophétique.
  alternative: Présenter explicitement cette parenté comme une généalogie ethnique et biologique de Jérusalem.
  rationale: Dans Ézéchiel 16, la filiation appartient à une vaste représentation familiale et conjugale. La traduction doit préserver la force de l’image sans convertir celle-ci en affirmation historique plus précise que le texte.
- issue: Passage de l’adresse au singulier à des suffixes pluriels dans la dernière proposition
  choice: Employer « votre mère » et « votre père », puis signaler en note que l’hébreu vise plusieurs femmes.
  alternative: Uniformiser entièrement au singulier (« ta mère », « ton père ») comme si seule Jérusalem restait visée.
  rationale: Le changement grammatical rattache vraisemblablement Jérusalem à ses sœurs dans la même filiation symbolique. Le conserver évite d’effacer un détail réel du texte source.
translation_notes:
  register: Français moderne, direct et solennel. « Avoir en horreur » conserve la violence de l’accusation sans archaïsme excessif. La répétition « fille de ta mère » / « sœur de tes sœurs » est volontairement maintenue pour refléter la rhétorique généalogique du texte.
