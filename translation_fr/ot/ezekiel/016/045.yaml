  naturalness: « Avoir en horreur » est idiomatique, soutenu mais encore naturel en français moderne, et convient au ton véhément du passage. Le passage de « ta » à « votre » est nécessaire pour refléter le changement d’adresse du texte hébreu; la note le clarifie utilement.
  terminology: « Hittite » et « Amoréen » sont les ethnonymes français usuels. « Mari(s) » et « enfants » rendent bien le contexte et la valeur collective des termes hébreux. La note sur געל préserve une alternative lexicale appropriée.
