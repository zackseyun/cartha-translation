  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: fr
  text: 'Quand tu construisais ton tertre[a] au début de chaque chemin[b] et que tu aménageais ton haut lieu dans chaque place publique, tu n’étais pas comme une prostituée[c] : tu méprisais le paiement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta chambre voûtée » ou « ta plateforme-sanctuaire » ; le terme hébreu désigne une structure élevée associée, dans ce chapitre, à l’image de la prostitution.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « à chaque carrefour ». Littéralement : « à la tête de chaque chemin ».'
    reason: lexical_alternative
  - marker: c
    text: 'À la différence d’une prostituée ordinaire, Jérusalem n’agissait pas pour être payée : les versets suivants précisent qu’elle donnait des présents au lieu d’en recevoir.'
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: Quand tu construisais
  rationale: La préposition ב avec l’infinitif construit de בנה introduit une circonstance temporelle. L’imparfait français convient à la série d’actes répétés décrite dans le contexte.
- source_word: גַּבֵּךְ
  choice: ton tertre
  rationale: Le nom désigne ici une structure surélevée liée à l’imagerie prostitutionnelle et cultuelle. « Tertre » conserve l’idée d’élévation sans préciser indûment son architecture.
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: au début de chaque chemin
  rationale: Cette formulation conserve le sens spatial de רֹאשׁ, « tête, commencement », tout en restant compréhensible en français. Une localisation plus idiomatique est signalée en note.
- source_word: וְרָמָתֵךְ
  choice: ton haut lieu
  rationale: Dans ce contexte, רָמָה évoque vraisemblablement une installation cultuelle élevée. « Haut lieu » maintient l’allusion idolâtre sans effacer l’ambiguïté du terme.
- source_word: עשיתי
  choice: tu aménageais
  rationale: Le ketiv consonantique correspond à « tu faisais ». « Aménageais » exprime naturellement en français la mise en place d’un lieu, sans surcharger le texte.
- source_word: בְּכָל רְחוֹב
  choice: sur chaque place publique
  rationale: רְחוֹב désigne souvent un espace urbain large et ouvert, donc une place publique plutôt qu’une rue étroite.
- source_word: וְלֹא הָיִית כַּזּוֹנָה
  choice: tu n’étais pas comme une prostituée
  rationale: La comparaison explicite et volontairement choquante doit être conservée. La suite précise en quel sens Jérusalem différait d’une prostituée ordinaire.
- source_word: לְקַלֵּס
  choice: tu méprisais
  rationale: L’infinitif exprime ici le trait distinctif de la comparaison et porte l’idée de dédaigner ou de tenir pour négligeable.
- source_word: אֶתְנָן
  choice: toute rémunération
  rationale: Le terme désigne le paiement reçu pour la prostitution. « Rémunération » est clair et digne; « toute » rend naturellement en français la portée générique du nom sans article.
theological_decisions:
- issue: Métaphore de la prostitution appliquée à l’infidélité de Jérusalem
  choice: Conserver directement « prostituée » et « rémunération ».
  alternative: Employer « femme infidèle » ou expliciter uniquement l’idolâtrie.
  rationale: Le langage sexuel appartient à la rhétorique prophétique du passage. Le neutraliser affaiblirait l’accusation et anticiperait son interprétation théologique.
- issue: Sens de la proposition finale
  choice: Présenter le mépris de la rémunération comme le point précis sur lequel Jérusalem ne ressemble pas à une prostituée ordinaire.
  alternative: Traduire comme si elle refusait simplement de solliciter ou d’accepter un paiement.
  rationale: 'Les versets suivants expliquent l’ironie : Jérusalem donne elle-même des présents au lieu d’être payée. Les deux-points préservent le lien explicatif sans imposer une causalité plus forte que l’hébreu.'
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe conserve le parallélisme de l’hébreu et son ironie, tandis que les notes rendent visibles les principales incertitudes spatiales et architecturales.
