id: EZK.16.62
reference: Ezekiel 16:62
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: fr
  text: Moi, j’établirai mon alliance avec toi, et tu sauras que je suis Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: j’établirai
  rationale: Le hiphil de קום exprime ici l’action de faire tenir ou d’établir l’alliance. Le futur convient au discours prophétique et « établir » est naturel dans ce contexte.
- source_word: אֲנִי
  choice: Moi, je
  rationale: Le pronom indépendant, superflu sur le plan grammatical, met en relief l’initiative personnelle de Dieu. La dislocation « Moi, je » restitue cette insistance en français courant.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: בְּרִית est le terme biblique habituel pour une relation d’alliance, notamment entre Dieu et son peuple. « Alliance » en conserve la portée littéraire et théologique.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La préposition exprime la relation d’alliance. Le pronom hébreu est féminin singulier parce qu’il s’adresse à Jérusalem, distinction que le français ne marque pas ici.
- source_word: וְיָדַעַתְּ
  choice: et tu sauras
  rationale: Dans ce discours prophétique, la forme parfaite coordonnée prend une valeur future ou résultative. « Tu sauras » est clair et conserve la coordination sans ajouter un « alors » interprétatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », ce qui préserve le nom propre divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » maintient le nom personnel dans le corps du texte sans le remplacer par un titre.
- issue: Insistance portée par le pronom explicite אֲנִי
  choice: Moi, j’établirai
  alternative: J’établirai ; c’est moi qui établirai
  rationale: « Moi, je » reproduit l’emphase de l’hébreu avec naturel, tout en évitant de préciser davantage que le texte la nature de cette insistance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en étant idiomatique. Aucun marqueur de note n’est requis.
