  text: וָ/אֶרְחָצֵ֣/ךְ בַּ/מַּ֔יִם וָ/אֶשְׁטֹ֥ף דָּמַ֖יִ/ךְ מֵֽ/עָלָ֑יִ/ךְ וָ/אֲסֻכֵ֖/ךְ בַּ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/009.yaml
  text: Then I washed you with water[a], rinsed your blood off you[b], and anointed you with oil.
translation:
  language: fr
  text: Puis je t’ai lavée avec de l’eau[a], j’ai lavé le sang qui te couvrait[b] et je t’ai enduite d’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’ai baignée dans l’eau ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai rincé ton sang de sur toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: je t’ai lavée
  rationale: רחץ signifie laver ou baigner. « Lavée » est direct, naturel en français et convient à la forme féminine de l’allégorie.
- source_word: בַּמַּיִם
  choice: avec de l’eau
  rationale: La préposition ב indique ici naturellement le moyen employé; « avec de l’eau » est idiomatique en français.
- source_word: וָאֶשְׁטֹף
  choice: j’ai rincé
  rationale: שטף peut exprimer l’action de rincer ou d’emporter par lavage. « Rincé » garde l’image concrète des soins corporels sans la renforcer excessivement.
- source_word: דָּמַיִךְ מֵעָלַיִךְ
  choice: le sang qui te couvrait
  rationale: Littéralement, le sang est ôté « de dessus toi ». Cette formulation française rend naturellement le sang présent sur le corps tout en évitant l’interprétation plus précise de « taches de sang ».
- source_word: וָאֲסֻכֵךְ
  choice: je t’ai enduite
  rationale: סוך désigne le fait d’appliquer ou d’étendre de l’huile sur le corps. « Enduite » exprime clairement le geste concret; « ointe » pourrait suggérer en français un acte rituel que le contexte immédiat n’impose pas.
- source_word: בַּשָּׁמֶן
  choice: d’huile
  rationale: שמן signifie simplement « huile »; préciser qu’il s’agit d’huile d’olive ajouterait une information absente du texte.
theological_decisions:
- issue: Nature de la purification et de l’application d’huile dans l’allégorie
  choice: Présenter ces gestes comme des soins corporels concrets à l’intérieur de l’allégorie.
  alternative: Employer un vocabulaire plus explicitement rituel ou cultuel, notamment « je t’ai ointe d’huile ».
  rationale: Le verset décrit le lavage, l’enlèvement du sang et l’application d’huile. La traduction laisse au contexte de l’allégorie de Jérusalem le soin de faire ressortir les implications théologiques, sans introduire une lecture sacramentelle ou rituelle dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Les accords féminins suivent la destinataire féminine de l’allégorie. « Enduite d’huile » privilégie ici le soin corporel concret et évite la possible surinterprétation rituelle de « ointe ».
