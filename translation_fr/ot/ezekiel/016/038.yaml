source:
  edition: WLC
  text: וּ/שְׁפַטְתִּי/ךְ֙ מִשְׁפְּטֵ֣י נֹאֲפ֔וֹת וְ/שֹׁפְכֹ֖ת דָּ֑ם וּ/נְתַתִּ֕י/ךְ דַּ֥ם חֵמָ֖ה וְ/קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: fr
  text: Je te jugerai selon le jugement réservé aux femmes adultères[a] et à celles qui répandent le sang ; je te livrerai au sang, dans ma fureur et ma jalousie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux femmes qui commettent l’adultère ». L’hébreu emploie un participe féminin pluriel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je te donnerai [en] sang de fureur et de jalousie ». L’expression peut évoquer un châtiment sanglant, une effusion de sang ou une mort violente, infligés dans la fureur et la jalousie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ מִשְׁפְּטֵי
  choice: Je te jugerai comme on juge
  rationale: Cette formulation conserve l’action judiciaire exprimée par שׁפט ainsi que le lien avec מִשְׁפְּטֵי, tout en rendant naturellement en français l’idée de juger selon le traitement judiciaire réservé à une catégorie de coupables.
- source_word: נֹאֲפוֹת
  choice: les femmes adultères
  rationale: Le participe féminin pluriel désigne explicitement des femmes qui commettent l’adultère. Cette formulation actuelle maintient l’imagerie conjugale de l’allégorie.
- source_word: וְשֹׁפְכֹת דָּם
  choice: et celles qui répandent le sang
  rationale: Le second participe féminin pluriel est parallèle au premier. « Répandre le sang » conserve l’expression biblique tout en désignant clairement l’homicide.
- source_word: וּנְתַתִּיךְ דַּם
  choice: je te livrerai au sang
  rationale: La tournure garde l’expression hébraïque dense et violente sans préciser indûment s’il s’agit d’une peine sanglante, d’une mort sanglante ou du sang versé. « Livrer » exprime ici l’action judiciaire impliquée par נתן dans cette construction.
- source_word: חֵמָה
  choice: fureur
  rationale: חֵמָה évoque une colère intense et brûlante. « Fureur » est naturel dans le registre prophétique et restitue sa force.
- source_word: וְקִנְאָה
  choice: et ma jalousie
  rationale: Dans l’allégorie conjugale du chapitre, קִנְאָה évoque la jalousie indignée provoquée par l’infidélité. « Jalousie » maintient cette dimension d’alliance, là où « zèle » l’atténuerait.
theological_decisions:
- issue: Articulation de l’imagerie judiciaire et conjugale dans le jugement divin
  choice: dans ma fureur et ma jalousie
  alternative: dans ma fureur et mon zèle
  rationale: « Jalousie » préserve la métaphore de l’époux offensé qui structure le chapitre, sans réduire le passage à une abstraction doctrinale ni atténuer la gravité du jugement.
- issue: Nature exacte du châtiment exprimé par דַּם
  choice: je te livrerai au sang
  alternative: je te vouerai à une mort sanglante
  rationale: L’hébreu reste compact et peut évoquer une peine sanglante, l’effusion de sang ou une mort violente. Le texte principal conserve cette tension, tandis que la note en explicite les principales possibilités.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste accessible, tandis que « répandre le sang » et « livrer au sang » maintiennent la densité juridique et prophétique de l’hébreu. Les pronoms possessifs ajoutés devant « fureur » et « jalousie » rendent explicite en français que ces sentiments sont ceux du locuteur divin, ce que le contexte établit.
