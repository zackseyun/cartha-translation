  text: וַ/יֵּ֨צֵא לָ֥/ךְ שֵׁ֛ם בַּ/גּוֹיִ֖ם בְּ/יָפְיֵ֑/ךְ כִּ֣י כָּלִ֣יל ה֗וּא בַּֽ/הֲדָרִ/י֙ אֲשֶׁר שַׂ֣מְתִּי עָלַ֔יִ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: fr
  text: Ta renommée[a] se répandit parmi les nations à cause de ta beauté, car elle était parfaite par ma splendeur dont je t’avais parée, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ton nom sortit parmi les nations » ; autrement dit, ta réputation se répandit au loin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: Ta renommée se répandit
  rationale: Littéralement, « un nom sortit pour toi ». Dans cet idiome, le « nom » désigne la réputation ou la renommée, et le verbe exprime sa diffusion au loin.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Le terme désigne ici les peuples ou nations environnants, sans le sens technique plus tardif de « païens ».
- source_word: בְּיָפְיֵךְ
  choice: à cause de ta beauté
  rationale: 'La préposition ב est comprise dans son sens causal : la beauté de Jérusalem est la raison de sa renommée.'
- source_word: כָּלִיל
  choice: parfaite
  rationale: Le mot exprime ce qui est complet, accompli ou parfait. L’accord féminin renvoie naturellement en français à « beauté ».
- source_word: בַּהֲדָרִי
  choice: grâce à la splendeur
  rationale: הָדָר peut désigner la splendeur, la majesté ou la magnificence. « Grâce à » exprime ici que cette beauté avait sa source dans ce que Dieu avait accordé.
- source_word: אֲשֶׁר שַׂמְתִּי עָלַיִךְ
  choice: dont je t’avais parée
  rationale: Littéralement, « que j’avais mise sur toi ». Dans l’image développée du vêtement et des ornements, « parer » rend naturellement l’action de placer cette splendeur sur Jérusalem.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit une déclaration prophétique solennelle. « Yahweh » rend explicitement le nom divin יהוה, tandis que אֲדֹנָי est rendu par « le Seigneur ».
theological_decisions:
- issue: Référent de כָּלִיל הוּא (« il/elle était parfait[e] »)
  choice: celle-ci était parfaite, en référence à la beauté
  alternative: il était parfait, en référence au nom ou au renom
  rationale: Dans le contexte immédiat, la perfection qualifie le plus naturellement la beauté produite par la splendeur divine. Le pronom hébreu est toutefois masculin, ce qui crée une légère tension grammaticale que le français ne peut reproduire naturellement sans obscurcir le sens.
- issue: Traduction de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue אֲדֹנָי (« le Seigneur ») du nom propre divin יהוה (« Yahweh ») et évite de remplacer le nom par un titre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le féminin « parée » maintient l’allégorie de Jérusalem comme femme et s’accorde avec le contexte des vêtements et bijoux des versets précédents.
