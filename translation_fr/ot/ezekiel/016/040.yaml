source:
  edition: WLC
  text: וְ/הֶעֱל֤וּ עָלַ֨יִ/ךְ֙ קָהָ֔ל וְ/רָגְמ֥וּ אוֹתָ֖/ךְ בָּ/אָ֑בֶן וּ/בִתְּק֖וּ/ךְ בְּ/חַרְבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: fr
  text: Ils feront venir contre toi une assemblée[a] ; ils te lapideront et te tailleront en pièces avec leurs épées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une foule ». Le terme hébreu désigne un groupe rassemblé et peut avoir ici une nuance publique ou judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « te découperont avec leurs épées ». Le verbe hébreu évoque une découpe violente, voire un démembrement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: Ils feront venir contre toi une assemblée
  rationale: Le hifil de עלה, suivi de עַל dans un contexte hostile, décrit le fait d’amener ou de mobiliser un groupe contre quelqu’un. « Faire venir contre toi » est naturel en français tout en conservant le mouvement causatif ; « assemblée » garde le caractère collectif et possiblement judiciaire de קָהָל.
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: ils te lapideront
  rationale: רגם désigne la lapidation. Le complément instrumental singulier בָּאָבֶן est idiomatiquement inclus dans le verbe français « lapider » ; ajouter « à coups de pierres » serait possible, mais redondant.
- source_word: וּבִתְּקוּךְ
  choice: te tailleront en pièces
  rationale: בתק exprime ici une action violente de couper ou de démembrer. « Tailler en pièces » restitue cette force plus précisément que le simple « abattre ».
- source_word: בְּחַרְבוֹתָם
  choice: avec leurs épées
  rationale: La préposition בְּ marque l’instrument, et le pluriel possessif est conservé directement.
theological_decisions:
- issue: Nature des images de châtiment
  choice: Conserver à la fois la dimension publique de l’assemblée, la lapidation et la violence des épées.
  alternative: Présenter la scène uniquement comme une exécution judiciaire ou uniquement comme une attaque militaire.
  rationale: La succession de l’assemblée, de la lapidation et des épées peut évoquer aussi bien un châtiment communautaire qu’une violence de guerre. La traduction ne tranche pas artificiellement entre ces deux dimensions.
translation_notes:
  register: Français international moderne, digne et direct. Le futur maintient l’annonce prophétique. Le tutoiement correspond à Jérusalem personnifiée comme une femme dans le contexte.
