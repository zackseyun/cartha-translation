  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : mobilisation d’un qahal contre Jérusalem personnifiée, lapidation, puis mise en pièces par leurs épées. « Ils feront venir contre toi une assemblée » exprime naturellement le causatif de הֶעֱלוּ avec la valeur hostile de עָלַיִךְ. « Lapideront » inclut idiomatiquement l’instrumental « avec des pierres », et « te tailleront en pièces » restitue de manière appropriée la violence de בִּתְּקוּךְ sans réduire l’image à une simple mise à mort.'
