source:
  edition: WLC
  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: fr
  text: Tu as pris tes magnifiques bijoux faits de mon or et de mon argent[a], que je t’avais donnés, et tu t’es fabriqué des figures masculines[b] avec lesquelles tu t’es prostituée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes objets splendides faits de mon or et de mon argent ». Le terme hébreu peut désigner divers objets ou articles; dans ce contexte, il s’agit vraisemblablement d’ornements en métaux précieux.
    reason: lexical_alternative
  - marker: b
    text: Ou « des idoles masculines » ou « des représentations de mâles ».
    reason: alternative_reading
  - marker: c
    text: L’expression « tu t’es prostituée » reprend une métaphore prophétique récurrente qui décrit l’infidélité à l’alliance, ici manifestée par l’idolâtrie.
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: tes magnifiques bijoux
  rationale: כְּלִי désigne largement un objet, un article ou un récipient, tandis que תִפְאַרְתֵּךְ évoque la beauté et la splendeur. Dans ce contexte d’or, d’argent et de parure, « magnifiques bijoux » exprime naturellement les deux éléments sans imposer l’idée étroite de récipients.
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  choice: faits de mon or et de mon argent
  rationale: 'La préposition מִן présente ici l’or et l’argent comme la matière dont les objets ont été faits. Le possessif « mon » conserve l’accusation centrale : Jérusalem détourne les biens qui appartenaient au locuteur et qu’il lui avait donnés.'
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que je t’avais donnés
  rationale: Le plus-que-parfait situe clairement le don avant son détournement. L’accord au masculin pluriel rattache naturellement le relatif à « mon or et mon argent », conformément au sens immédiat de l’hébreu.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: tu t’es fabriqué
  rationale: 'La tournure pronominale restitue la valeur intéressée de לָךְ : Jérusalem fabrique ces figures pour elle-même. « Fabriqué » est courant tout en restant digne.'
- source_word: צַלְמֵי זָכָר
  choice: des figures masculines
  rationale: צֶלֶם signifie « image, représentation, figure » et זָכָר précise explicitement le sexe masculin. « Figures masculines » est idiomatique en français et maintient l’imagerie à la fois cultuelle et sexuelle sans remplacer le mot « images » par l’interprétation « idoles ».
- source_word: וַתִּזְנִי בָם
  choice: avec lesquelles tu t’es prostituée
  rationale: זנה porte une métaphore sexuelle volontairement forte pour l’infidélité de Jérusalem, notamment dans l’idolâtrie. « Se prostituer » en conserve la vigueur prophétique; « avec lesquelles » rend בָם et s’accorde naturellement avec « figures ».
theological_decisions:
- issue: Métaphore sexuelle prophétique appliquée à l’idolâtrie
  choice: Conserver l’expression explicite « tu t’es prostituée »
  alternative: « tu as été infidèle » ou « tu as pratiqué l’idolâtrie »
  rationale: Le texte hébreu présente délibérément la rupture de l’alliance sous une image sexuelle choquante. Une formulation générale sur l’infidélité ou l’idolâtrie en atténuerait la force et résoudrait la métaphore au lieu de la transmettre.
- issue: Nature des צַלְמֵי זָכָר
  choice: « figures masculines »
  alternative: « idoles masculines » ou « représentations d’hommes »
  rationale: Le contexte est idolâtre, mais צֶלֶם désigne directement une image ou une figure. La traduction retenue laisse le contexte établir la fonction idolâtre et préserve la dimension sexuelle sans préciser indûment que chaque représentation était nécessairement celle d’un homme humain.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement féminin suit l’adresse à Jérusalem personnifiée. La formulation conserve la violence de l’accusation et la métaphore sexuelle du texte sans archaïsme ni atténuation confessionnelle.
