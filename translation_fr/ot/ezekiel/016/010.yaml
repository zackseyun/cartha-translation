base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: fr
  text: Je t’ai revêtue d’une étoffe brodée, je t’ai chaussée de sandales en cuir fin[a], je t’ai enveloppée de lin fin et je t’ai couverte de soie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne une matière employée pour des chaussures de qualité, mais son origine animale exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une étoffe précieuse »; l’identification précise du terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: une étoffe brodée
  rationale: Le nom désigne un ouvrage ou un tissu brodé. « Étoffe brodée » conserve l’image textile sans préciser indûment le type de vêtement.
- source_word: תָּחַשׁ
  choice: cuir fin
  rationale: L’animal ou la matière exacte désignée par תחש demeure incertain. Dans ce contexte de chaussures luxueuses, « cuir fin » rend la fonction et la qualité sans identification zoologique conjecturale.
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: je t’ai chaussée de sandales en cuir fin
  rationale: Le hiphil de נעל exprime l’action de chausser. La mention de sandales, naturellement impliquée dans le contexte ancien, donne en français une formulation claire.
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: שש désigne couramment un lin de grande qualité, notamment dans des contextes prestigieux ou cultuels.
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: je t’ai enveloppée de fin lin
  rationale: חבש peut signifier attacher, ceindre ou envelopper. Dans cette succession d’actes d’habillement, « enveloppée » est naturel et évite une connotation médicale.
- source_word: מֶשִׁי
  choice: une étoffe précieuse
  rationale: L’identification exacte de משי est discutée. « Étoffe précieuse » préserve l’idée d’un textile luxueux sans affirmer avec une certitude excessive qu’il s’agit de soie.
- source_word: וָאֲכַסֵּךְ
  choice: je t’ai couverte
  rationale: Le verbe כסה signifie directement couvrir ou dissimuler; « couverte » convient à la superposition de textiles luxueux.
