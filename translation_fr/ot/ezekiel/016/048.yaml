id: EZK.16.48
reference: Ezekiel 16:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם עָֽשְׂתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
translation:
  language: fr
  text: Aussi vrai que je suis vivant[a], déclare le Seigneur Yahweh, ta sœur Sodome, elle et ses filles[b], n’ont pas agi comme toi et tes filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule hébraïque de serment; littéralement : « Je suis vivant… si ta sœur Sodome a agi… » La construction exprime ici une forte négation.'
    reason: lexical_alternative
  - marker: b
    text: Les « filles » désignent les villes ou communautés rattachées respectivement à Sodome et à Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Rend naturellement en français la formule solennelle du serment divin tout en conservant son image fondamentale.
- source_word: נְאֻם
  choice: déclare
  rationale: Formule prophétique courante, claire et digne en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et préserve explicitement ce dernier.
- source_word: אִם
  choice: n’ont pas
  rationale: Après la formule de serment, אִם appartient à une construction elliptique exprimant ici une négation catégorique.
- source_word: עָשְׂתָה / עָשִׂית
  choice: ont agi / comme ...
  rationale: « Agir » exprime ici naturellement la conduite comparée de Sodome et de Jérusalem; l’accord pluriel tient compte de « elle et ses filles ».
- source_word: סְדֹם אֲחוֹתֵךְ
  choice: ta sœur Sodome
  rationale: Conserve la métaphore familiale centrale du chapitre dans un ordre naturel en français.
- source_word: הִיא וּבְנוֹתֶיהָ
  choice: elle et ses filles
  rationale: Maintient le pronom emphatique et la désignation métaphorique des localités rattachées à Sodome.
- source_word: אַתְּ וּבְנוֹתָיִךְ
  choice: toi et tes filles
  rationale: Préserve l’adresse féminine singulière à Jérusalem ainsi que la métaphore de ses communautés associées.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה; les distinguer évite de masquer le nom divin.
- issue: Interprétation de la construction de serment חַי־אני ... אִם
  choice: 'affirmation solennelle négative : « Aussi vrai que je suis vivant… n’ont pas agi »'
  alternative: 'calque conditionnel : « Je suis vivant… si Sodome a agi »'
  rationale: Dans cette formule de serment elliptique, אִם introduit une dénégation énergique; une traduction conditionnelle brute serait opaque et risquerait de fausser le sens.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La formule « Aussi vrai que je suis vivant » reste idiomatique; « Yahweh » conserve le nom divin. Les métaphores familiales du chapitre sont maintenues.
