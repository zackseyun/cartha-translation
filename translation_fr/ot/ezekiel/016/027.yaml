source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: fr
  text: Et voici, j’ai étendu ma main contre toi, j’ai diminué la part qui t’était attribuée[a] et je t’ai livrée à la volonté[b] de celles qui te haïssent, les filles des Philistins[c], qui ont honte de ta conduite obscène.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « ce qui t’était dû », « ton allocation » ou « ta part ». Le terme hébreu peut désigner ce qui est fixé, prescrit ou attribué.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au désir ». L’expression hébraïque contient littéralement le mot « âme », qui désigne ici le désir, l’appétit ou la volonté.'
    reason: lexical_alternative
  - marker: c
    text: L’expression « les filles des Philistins » conserve la personnification prophétique de peuples ou de villes sous les traits de filles.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Cette formule attire vivement l’attention. « Et voici » en conserve la force déictique dans un registre français digne et courant.
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: j’ai étendu la main contre toi
  rationale: La traduction conserve l’image hébraïque d’une intervention décisive et hostile, sans préciser au-delà du texte la forme du jugement.
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: j’ai diminué la part qui t’était attribuée
  rationale: Le verbe exprime une diminution, tandis que חֹק peut désigner ce qui est fixé, prescrit ou attribué. Cette formulation reste naturelle sans réduire le sens aux vivres ou au territoire.
- source_word: וָאֶתְּנֵךְ
  choice: je t’ai livrée
  rationale: Dans ce contexte de jugement, « livrée » exprime clairement la remise de Jérusalem à ses ennemies. Le féminin correspond à la ville personnifiée.
- source_word: בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: au désir de celles qui te haïssaient
  rationale: נֶפֶשׁ désigne ici le désir, l’appétit ou la volonté. « Au désir » préserve cette expression inhabituelle sans la transformer en une simple mention de pouvoir.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: les filles des Philistins
  rationale: La traduction littérale maintient la personnification prophétique de peuples ou de villes sous la figure de filles.
- source_word: הַנִּכְלָמוֹת
  choice: qui avaient honte
  rationale: Le participe exprime leur honte ou leur confusion devant la conduite de Jérusalem. L’imparfait rend naturellement cette réaction dans la séquence au passé.
- source_word: מִדַּרְכֵּךְ זִמָּה
  choice: de ta conduite obscène
  rationale: דֶּרֶךְ désigne ici une manière de vivre, et זִמָּה porte une forte accusation sexuelle et morale. « Conduite obscène » en garde la vigueur sans développer la métaphore.
theological_decisions:
- issue: Imagerie du jugement dans l’allégorie prophétique
  choice: Conserver le langage divin à la première personne ainsi que l’accusation à caractère sexuel et moral.
  alternative: Reformuler le verset en termes abstraits de punition et d’impiété générale.
  rationale: Le verset appartient à une longue allégorie de l’infidélité de Jérusalem. Maintenir ses images préserve à la fois la force du jugement et la tension théologique du texte, sans y ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement et les accords féminins suivent l’adresse à Jérusalem personnifiée. Les images de la main étendue, de la livraison aux ennemies et des « filles » sont conservées plutôt qu’explicitées dans le corps du texte.
