  to: Et voici, j’ai étendu ma main contre toi, j’ai diminué la part qui t’était attribuée[a] et je t’ai livrée à la volonté[b] de celles qui te haïssent, les filles des Philistins[c], qui ont honte de ta conduite obscène.
