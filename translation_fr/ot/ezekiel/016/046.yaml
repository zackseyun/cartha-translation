  text: וַ/אֲחוֹתֵ֨/ךְ הַ/גְּדוֹלָ֤ה שֹֽׁמְרוֹן֙ הִ֣יא וּ/בְנוֹתֶ֔י/הָ הַ/יּוֹשֶׁ֖בֶת עַל שְׂמֹאולֵ֑/ךְ וַ/אֲחוֹתֵ֞/ךְ הַ/קְּטַנָּ֣ה מִמֵּ֗/ךְ הַ/יּוֹשֶׁ֨בֶת֙ מִֽ/ימִינֵ֔/ךְ סְדֹ֖ם וּ/בְנוֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: fr
  text: Ta sœur aînée, c’est Samarie[a], qui habite à ta gauche avec ses filles; ta sœur cadette, qui habite à ta droite, c’est Sodome avec ses filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Du point de vue de Jérusalem, Samarie se trouve au nord et Sodome au sud.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: ta sœur
  rationale: Le terme de parenté est employé métaphoriquement pour des villes apparentées dans l’allégorie; « sœur » conserve l’image familiale structurante du chapitre.
- source_word: הַגְּדוֹלָה
  choice: aînée
  rationale: L’adjectif signifie littéralement « grande »; appliqué à une sœur et mis en parallèle avec הַקְּטַנָּה, « aînée » est naturel en français tout en préservant la métaphore familiale.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de lieu.
- source_word: וּבְנוֹתֶיהָ
  choice: avec ses filles
  rationale: « Filles » conserve la métaphore urbaine et familiale; il s’agit vraisemblablement des localités dépendantes. « Avec » rend naturellement l’association de la ville principale et de ses filles.
- source_word: הַיּוֹשֶׁבֶת
  choice: qui habite
  rationale: Le participe de ישׁב signifie couramment « habiter ». Le singulier grammatical est conservé, le sujet immédiat étant la sœur-ville, accompagnée de ses filles.
- source_word: עַל שְׂמֹאולֵךְ
  choice: à ta gauche
  rationale: Rend directement l’expression corporelle et spatiale hébraïque sans la remplacer dans le texte par son interprétation géographique.
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: ta sœur cadette
  rationale: Littéralement « la petite par rapport à toi ». Dans le cadre familial, « cadette » exprime naturellement la comparaison avec Jérusalem sans la tournure française lourde « plus jeune que toi ».
- source_word: מִימִינֵךְ
  choice: à ta droite
  rationale: Traduction naturelle de l’orientation corporelle hébraïque, distincte d’une explicitation géographique.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Sens géographique de la gauche et de la droite par rapport à Jérusalem
  choice: Conserver « à ta gauche » et « à ta droite » dans le texte principal.
  alternative: Traduire explicitement « au nord de toi » et « au sud de toi ».
  rationale: L’hébreu emploie des indications spatiales fondées sur le corps, non les points cardinaux. Les conserver respecte l’image du texte; leur portée géographique est expliquée en note.
- issue: Portée de « filles »
  choice: Conserver la métaphore « ses filles ».
  alternative: Expliciter « les villes qui en dépendent ».
  rationale: Le sens probable est celui de localités dépendantes, mais la formulation imagée appartient à l’allégorie familiale du chapitre et ne doit pas être effacée.
translation_notes:
  register: Français international moderne, digne et accessible. La construction disloquée « c’est… » clarifie l’identification des deux sœurs-villes. Le singulier « qui habite » suit la sœur-ville comme noyau grammatical, tandis que « avec ses filles » inclut les localités qui lui sont rattachées.
