  - severity: low
    issue: La note donne une littéralité imprécise.
    rationale: La clause hébraïque dit littéralement qu’« après/à ta suite, personne ne se prostituait »; « aucun client » relève de l’explication contextuelle et doit rester dans l’explication, non dans la prétendue citation littérale.
