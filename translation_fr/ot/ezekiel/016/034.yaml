  verdict: revise
  source_fidelity: 'La dernière proposition, « Tu as donc fait le contraire », traduit un acte (« faire »), alors que וַתְּהִי exprime l’état résultant : « tu es devenue ». Le premier encadrement doit également présenter Jérusalem comme étant « l’opposé » des autres femmes, plutôt que comme ayant simplement accompli l’action de faire le contraire. Le sens contextuel de « personne ne te recherchait » est adéquat, avec une note pour la formulation hébraïque inhabituelle.'
  naturalness: Le texte est globalement clair et de registre moderne. « Tu es devenue le contraire » est une formulation rhétoriquement marquée, mais elle est intelligible en français et préserve volontairement la répétition et l’étrangeté emphatique du texte source. « Salaire » est naturel dans ce contexte et sa répétition rend celle d’אֶתְנָן.
  terminology: « Prostitutions » préserve la métaphore sexuelle au pluriel. « Salaire » rend convenablement אֶתְנָן sans introduire une interprétation doctrinale. La note est ajustée afin de ne pas présenter comme une citation littérale une paraphrase qui explicite indûment le sujet.
