source:
  edition: WLC
  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: fr
  text: 'Dans tes prostitutions, tu es devenue le contraire des autres femmes : personne ne te recherchait[a], mais c’est toi qui donnais un salaire, et aucun salaire ne t’était donné. Tu es donc devenue le contraire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après toi, personne ne se prostituait » ; le sens semble être que, contrairement aux prostituées ordinaires, tu n’étais recherchée par aucun client.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: le contraire / le contraire
  rationale: Le nom exprime un renversement. La répétition encadre le verset et souligne l’inversion ironique des pratiques habituelles de la prostitution.
- source_word: תַזְנוּתַיִךְ
  choice: tes prostitutions
  rationale: Le pluriel rend la forme hébraïque et conserve sans l’atténuer l’image sexuelle choquante employée pour l’infidélité de Jérusalem.
- source_word: וְאַחֲרַיִךְ לֹא זוּנָה
  choice: personne ne te recherchait
  rationale: Littéralement, la tournure évoque le fait de se prostituer à la suite de quelqu’un. Dans le contexte, elle signifie que personne ne poursuivait Jérusalem comme cliente d’une prostituée; « rechercher » exprime naturellement cette idée tout en laissant la note signaler la formulation inhabituelle.
- source_word: אֶתְנָן
  choice: salaire
  rationale: Le terme désigne spécifiquement la rémunération liée à la prostitution. « Salaire » est courant, digne et permet de conserver sa répétition dans les deux propositions.
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: mais c’est toi qui donnais un salaire
  rationale: La construction infinitive indique la circonstance qui constitue le renversement. La tournure emphatique française met en relief le fait que Jérusalem paie au lieu d’être payée.
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: et aucun salaire ne t’était donné
  rationale: Le passif suit de près l’hébreu et maintient la répétition explicite du mot désignant la rémunération.
- source_word: וַתְּהִי לְהֶפֶךְ
  choice: Tu as donc fait le contraire
  rationale: « Donc » rend la conclusion résultative, tandis que « faire le contraire » est plus naturel en français que « devenir le contraire » dans ce contexte.
theological_decisions:
- issue: Langage sexuel métaphorique décrivant l’infidélité de Jérusalem
  choice: Conserver directement la métaphore de la prostitution
  alternative: Atténuer par « infidélité » ou « idolâtrie » dans le texte principal
  rationale: Ézéchiel recourt délibérément à une image sexuelle provocante pour dénoncer l’infidélité de Jérusalem. La traduction en préserve la force au lieu de l’interpréter ou de l’adoucir.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « le contraire » et de « salaire » reproduit la structure rhétorique de l’hébreu. Le tutoiement féminin correspond à Jérusalem personnifiée.
