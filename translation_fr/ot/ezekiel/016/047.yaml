  naturalness: Le français est globalement fluide et de registre prophétique approprié. « Suivre leurs voies » est naturel dans un contexte biblique moderne et maintient le motif répété de דרך. « Dans toutes tes voies » est plus cohérent avec ce motif et avec le pluriel hébreu que « dans toute ta conduite ».
  terminology: « Abominations » est le terme juste pour תועבות dans Ézéchiel. « Corrompue » et l’accord féminin conviennent à Jérusalem personnifiée. La formulation idiomatique « comme si cela ne suffisait pas » exprime bien la fonction rhétorique de כמעט קט sans prétendre résoudre davantage l’ellipse hébraïque.
