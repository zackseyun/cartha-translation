base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: fr
  text: Pourtant, tu n’as pas suivi leurs voies ni commis leurs abominations[a]. Comme si cela ne suffisait pas[b], tu t’es corrompue plus qu’elles dans toutes tes voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme écrite hébraïque peut se lire : « j’ai fait »; la lecture suivie dans le contexte est : « tu as commis leurs abominations ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « comme une toute petite chose »; tournure hébraïque indiquant ici que reproduire leurs péchés ne suffisait pas à Jérusalem : elle est allée plus loin qu’elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: tu n’as pas suivi leur conduite
  rationale: L’expression signifie adopter une manière de vivre. « Suivre leur conduite » est naturel en français moderne tout en conservant le sens éthique de דרך.
- source_word: וּבְתוֹעֲבוֹתֵיהֶן עָשִׂיתִי
  choice: ni agi selon leurs abominations
  rationale: Dans le contexte, la forme se comprend à la deuxième personne du féminin singulier. Cette formulation restitue עשה avec תועבות sans la lourdeur de « faire leurs abominations »; l’expression plus littérale figure en note.
- source_word: תּוֹעֵבָה
  choice: abominations
  rationale: Ce terme garde la force de la dénonciation cultuelle et morale caractéristique d’Ézéchiel et demeure intelligible en français biblique moderne.
- source_word: כִּמְעַט קָט
  choice: Comme si cela ne suffisait pas
  rationale: La locution elliptique présente les fautes déjà évoquées comme une chose insuffisante pour Jérusalem et introduit ainsi une aggravation rhétorique.
- source_word: וַתַּשְׁחִתִי
  choice: tu t’es corrompue
  rationale: Le verbe exprime ici la dégradation morale avec une nuance réfléchie ou intransitive. Le féminin correspond à Jérusalem personnifiée.
- source_word: מֵהֵן
  choice: plus qu’elles
  rationale: La préposition מן marque la comparaison avec les villes-sœurs féminines mentionnées dans le contexte.
- source_word: בְּכָל דְּרָכָיִךְ
  choice: dans toute ta conduite
  rationale: Le singulier collectif français exprime l’ensemble des comportements de Jérusalem et fait écho à la première proposition sans sonner artificiel.
theological_decisions:
- issue: Degré de culpabilité de Jérusalem par rapport à Samarie et Sodome
  choice: Jérusalem est présentée comme s’étant corrompue davantage qu’elles.
  alternative: Jérusalem ne les aurait pas imitées exactement, mais se serait corrompue d’une autre manière sans comparaison de degré nettement affirmée.
  rationale: 'La séquence כִּמְעַט קָט suivie de וַתַּשְׁחִתִי מֵהֵן marque le plus naturellement une escalade : leurs pratiques ne lui ont pour ainsi dire pas suffi, et elle les a dépassées. La traduction conserve néanmoins la tension créée par l’ouverture négative du verset.'
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement féminin rend l’adresse prophétique à Jérusalem personnifiée. « Abominations » conserve la forte charge du vocabulaire d’Ézéchiel; « conduite » évite une répétition peu naturelle de « voies » tout en maintenant le motif comportemental.
