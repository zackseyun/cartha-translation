source:
  edition: WLC
  text: וַ/תִּבְנִי לָ֖/ךְ גֶּ֑ב וַ/תַּעֲשִׂי לָ֥/ךְ רָמָ֖ה בְּ/כָל רְחֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/024.yaml
  text: You built for yourself a mound and made for yourself a high place in every square[a].
translation:
  language: fr
  text: Tu t’es bâti une construction surélevée[a] et tu t’es fait un haut lieu sur chaque place publique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tertre », « chambre voûtée » ou « estrade » ; il pourrait aussi s’agir d’une installation liée à la prostitution. Le terme hébreu est rare et son sens incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: construction surélevée
  rationale: Le nom est rare et son sens architectural exact demeure incertain. « Construction surélevée » conserve l’idée concrète d’un ouvrage bâti et élevé sans préciser indûment qu’il s’agit d’un tertre, d’une chambre voûtée ou d’un lieu de prostitution.
- source_word: רָמָה
  choice: haut lieu
  rationale: Dans ce contexte prophétique et cultuel, le terme désigne vraisemblablement un lieu élevé associé au culte, plutôt qu’une simple hauteur topographique.
- source_word: רְחֹוב
  choice: place publique
  rationale: Le mot désigne couramment un espace ouvert de la ville. « Place publique » rend clairement le cadre urbain et la visibilité des installations.
- source_word: וַתִּבְנִי לָךְ
  choice: Tu t’es bâti
  rationale: Cette tournure française naturelle exprime la valeur bénéficiaire ou réflexive de לָךְ tout en conservant le verbe « bâtir ».
- source_word: וַתַּעֲשִׂי לָךְ
  choice: tu t’es fait
  rationale: La formulation garde le parallélisme avec la première proposition et représente la valeur bénéficiaire de לָךְ.
- source_word: בְּכָל
  choice: sur chaque
  rationale: « Chaque » restitue la portée distributive, tandis que « sur » est idiomatique avec l’aménagement d’un lieu dans une place publique.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal une structure liée à la prostitution ou à l’idolâtrie ?
  choice: Employer un vocabulaire architectural relativement concret et signaler l’incertitude de גֶּב en note.
  alternative: Traduire גֶּב par « maison de prostitution », « lieu de prostitution » ou « sanctuaire ».
  rationale: Le chapitre présente Jérusalem sous l’image de la prostitution et de l’infidélité religieuse, mais גֶּב est lexicalement rare et incertain. Une désignation explicitement sexuelle ou cultuelle résoudrait une ambiguïté que l’hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, direct et digne. Le féminin du texte hébreu, qui s’adresse à Jérusalem personnifiée, n’est pas morphologiquement visible dans ces formes verbales françaises. La répétition de « tu t’es » conserve l’insistance de l’original.
