  source_fidelity: Le texte rend fidèlement les deux verbes à l’imparfait narratif, la valeur bénéficiaire de לָךְ (« tu t’es bâti / tu t’es fait »), le caractère distributif de בְּכָל et le sens urbain de רְחֹוב. « Construction surélevée » est une solution prudente pour גֶּב, terme rare dont le référent architectural reste incertain; elle ne force pas l’interprétation sexuelle ou cultuelle. « Haut lieu » convient à רָמָה dans ce contexte.
  naturalness: Le français est moderne, clair et d’un registre approprié au discours prophétique. « Sur chaque place publique » est recevable pour des structures érigées dans l’espace de la place; la phrase conserve efficacement le parallélisme hébreu.
