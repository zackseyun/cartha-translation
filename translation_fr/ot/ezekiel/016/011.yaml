  source_fidelity: 'Le texte rend fidèlement les deux actions coordonnées de l’hébreu : Dieu pare la femme de parures, puis place des bracelets et un ornement de cou. « Je t’ai parée de bijoux » restitue naturellement וָאֶעְדֵּךְ עֶדִי, et le féminin maintient la personnification présente dans le contexte. « À tes poignets » est une explicitation idiomatique raisonnable de עַל יָדַיִךְ avec צְמִידִים, explicitement documentée par la note.'
  naturalness: Le français est moderne, international, fluide et d’un registre approprié au texte prophétique. « Parée de bijoux », « bracelets à tes poignets » et « un collier autour de ton cou » sont naturels. Les deux-points introduisent sans lourdeur les éléments concrets de la parure.
  terminology: '« Bijoux », « bracelets » et « collier » correspondent bien au champ lexical des ornements. Les notes conservent les principales possibilités lexicales : « ornements/parures » pour עֶדִי, la portée de יָד, et « chaîne » pour רָבִיד. Elles ne surinterprètent pas l’allégorie ni n’imposent de lecture confessionnelle.'
