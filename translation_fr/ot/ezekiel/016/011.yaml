id: EZK.16.11
reference: Ezekiel 16:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶעְדֵּ֖/ךְ עֶ֑דִי וָ/אֶתְּנָ֤/ה צְמִידִים֙ עַל יָדַ֔יִ/ךְ וְ/רָבִ֖יד עַל גְּרוֹנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/011.yaml
  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: fr
  text: 'Je t’ai parée de bijoux[a] : j’ai mis des bracelets à tes poignets[b] et un collier[c] autour de ton cou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’ornements » ou « de parures ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur tes mains » ; le mot hébreu peut aussi englober les poignets ou les bras.
    reason: lexical_alternative
  - marker: c
    text: Ou « une chaîne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ
  choice: Je t’ai parée
  rationale: Le verbe עדה exprime ici l’action d’orner ou de parer. « Parer » convient au registre imagé et digne du passage, tout en restant courant.
- source_word: עֶדִי
  choice: de bijoux
  rationale: Le nom désigne une parure ou des ornements. Dans ce contexte, où sont ensuite nommés bracelets et collier, « bijoux » rend naturellement le sens concret.
- source_word: צְמִידִים
  choice: des bracelets
  rationale: Le terme désigne des anneaux ornementaux portés aux bras ou aux poignets ; « bracelets » est l’équivalent français moderne le plus clair.
- source_word: עַל יָדַיִךְ
  choice: à tes poignets
  rationale: יָד peut désigner la main ou, plus largement, le bras. Puisqu’il s’agit de bracelets, « à tes poignets » exprime naturellement en français l’emplacement visé, tandis qu’une note signale la formulation hébraïque.
- source_word: רָבִיד
  choice: un collier
  rationale: Le nom désigne une parure portée au cou, éventuellement une chaîne. « Collier » est le terme générique et naturel en français.
- source_word: עַל גְּרוֹנֵךְ
  choice: autour de ton cou
  rationale: גָּרוֹן peut désigner la gorge ou le cou. Pour un collier, le français idiomatique dit « autour du cou ».
theological_decisions:
- issue: Représentation métaphorique de Jérusalem comme une femme parée par Dieu
  choice: Conserver sans développement interprétatif l’image concrète de la parure.
  alternative: Expliciter dans le texte principal une bénédiction d’alliance ou une préparation nuptiale.
  rationale: Le verset appartient à l’allégorie développée du chapitre, mais la traduction ne doit pas imposer dans sa formulation une interprétation théologique que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin de « parée » préserve la personnification de Jérusalem. La ponctuation met en évidence que les bracelets et le collier détaillent les bijoux évoqués au début du verset.
