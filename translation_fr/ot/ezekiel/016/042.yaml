  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: fr
  text: Ainsi, j’assouvirai ma fureur contre toi[a], et ma jalousie se détournera de toi[b] ; puis je serai calme et je ne serai plus en colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ferai reposer ma fureur en toi ». L’expression indique ici que la fureur arrive à son terme ou s’épuise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon zèle s’éloignera de toi ». Le mot hébreu peut signifier « jalousie » ou « zèle » ; « jalousie » convient particulièrement à l’image conjugale de ce chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי חֲמָתִי בָּךְ
  choice: j’assouvirai ma fureur contre toi
  rationale: Le hiphil de נוח présente la fureur comme amenée au repos, donc menée à son terme ou épuisée. « Assouvir » exprime naturellement en français cette idée sans donner à entendre que la colère s’évanouit sans jugement. La préposition ב est rendue selon sa valeur contextuelle hostile par « contre toi ».
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה désigne une colère ardente. « Fureur » conserve ici l’intensité du terme hébreu et convient au cadre judiciaire du passage.
- source_word: וְסָרָה קִנְאָתִי מִמֵּךְ
  choice: et ma jalousie se détournera de toi
  rationale: סור exprime l’éloignement ou le détournement. La tournure française conserve l’image de la jalousie qui cesse de se porter sur la destinataire.
- source_word: קִנְאָתִי
  choice: ma jalousie
  rationale: קִנְאָה peut signifier « jalousie » ou « zèle ». Dans la métaphore conjugale d’Ézéchiel 16, « jalousie » correspond le mieux au contexte tout en laissant l’autre sens en note.
- source_word: וְשָׁקַטְתִּי
  choice: puis je serai calme
  rationale: שקט évoque le calme et la tranquillité après l’agitation. « Je serai calme » est direct, actuel et ne surinterprète pas la nature de cet apaisement.
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: et je ne serai plus en colère
  rationale: La formulation rend clairement כעס, « être en colère », et עוֹד, « encore, désormais », dans un français naturel.
theological_decisions:
- issue: Langage de la colère et de la jalousie divines dans un cadre conjugal et judiciaire
  choice: Conserver les termes forts « fureur » et « jalousie »
  alternative: Atténuer en « mécontentement » et rendre קִנְאָה par « zèle »
  rationale: Le chapitre décrit l’infidélité à l’alliance sous l’image d’une infidélité conjugale, tout en annonçant un jugement. Les termes choisis préservent cette tension et la force morale du texte sans transformer la colère en passion incontrôlée.
- issue: Sens de l’apaisement de la fureur
  choice: « j’assouvirai ma fureur contre toi »
  alternative: « je ferai reposer ma fureur en toi »
  rationale: La traduction principale communique que la fureur arrive à son terme par le jugement. Une note conserve toutefois la construction hébraïque inhabituelle afin de ne pas masquer son image.
translation_notes:
  register: 'Français international moderne, digne et accessible. La ponctuation marque les trois étapes du verset : fin de la fureur, éloignement de la jalousie, puis retour au calme. Les pronoms féminins implicites de l’hébreu sont naturellement rendus par « toi », sans indication de genre en français.'
