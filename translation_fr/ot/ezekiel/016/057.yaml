id: EZK.16.57
reference: Ezekiel 16:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/טֶרֶם֮ תִּגָּלֶ֣ה רָעָתֵ/ךְ֒ כְּמ֗וֹ עֵ֚ת חֶרְפַּ֣ת בְּנוֹת אֲרָ֔ם וְ/כָל סְבִיבוֹתֶ֖י/הָ בְּנ֣וֹת פְּלִשְׁתִּ֑ים הַ/שָּׁאט֥וֹת אוֹתָ֖/ךְ מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: fr
  text: avant que ta méchanceté ne soit dévoilée[a], comme au temps où tu subissais les outrages des filles d’Aram[b] et de toutes celles qui l’entouraient, les filles des Philistins[c], qui te méprisent de tous côtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « révélée » ou « mise au jour ».
    reason: lexical_alternative
  - marker: b
    text: « Aram » est traditionnellement rendu par « Syrie ». L’hébreu dit littéralement « les filles d’Aram ».
    reason: alternative_reading
  - marker: c
    text: « Les filles des Philistins » est une expression hébraïque qui désigne collectivement les populations ou les villes philistines.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Introduit naturellement en français l’événement antérieur à la révélation publique du mal de Jérusalem.
- source_word: תִּגָּלֶה
  choice: ne soit dévoilée
  rationale: Le nifal de גלה indique ici que la méchanceté devient manifeste; « dévoilée » conserve l’image de ce qui était caché puis exposé.
- source_word: רָעָתֵךְ
  choice: ta méchanceté
  rationale: Dans cette accusation prophétique, רעה désigne un mal moral imputable, et non un simple malheur.
- source_word: כְּמוֹ עֵת
  choice: comme au temps où
  rationale: Rend à la fois la comparaison et la valeur temporelle de l’expression hébraïque dans un français naturel.
- source_word: חֶרְפַּת
  choice: tu subissais les outrages
  rationale: חרפה évoque la honte publique, le mépris et les insultes. La tournure verbale explicite naturellement en français que Jérusalem en est la cible, conformément au contexte, sans réduire le terme à de simples moqueries.
- source_word: בְּנוֹת אֲרָם
  choice: les filles d’Aram
  rationale: Conserve le nom Aram et l’expression collective imagée « filles de », qui peut désigner les populations ou les villes araméennes.
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: et de toutes celles qui l’entouraient
  rationale: Le suffixe féminin singulier renvoie le plus naturellement à Aram; « celles » maintient l’accord avec l’image des filles et rend lisible l’idée des populations ou villes voisines.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: les filles des Philistins
  rationale: Préserve l’idiome hébraïque collectif au lieu de l’aplatir en simple désignation géopolitique.
- source_word: הַשָּׁאטוֹת אוֹתָךְ
  choice: qui te méprisent
  rationale: Le participe exprime un mépris hostile et continu; « méprisent » en restitue directement la force.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Expression française idiomatique qui garde l’idée d’un mépris venant de tout autour.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement abrupt du verset, qui dépend du contexte précédent, tout en explicitant sobrement que Jérusalem subit les outrages. Les images collectives « filles d’Aram » et « filles des Philistins » sont maintenues et expliquées en note.
