source:
  edition: WLC
  text: וַ/תִּקְחִ֛י אֶת בִּגְדֵ֥י רִקְמָתֵ֖/ךְ וַ/תְּכַסִּ֑י/ם וְ/שַׁמְנִ/י֙ וּ/קְטָרְתִּ֔/י נתתי לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
translation:
  language: fr
  text: Tu as pris tes vêtements brodés et tu les as couverts de tes vêtements brodés[a] ; tu as placé devant eux mon huile et mon encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu les as vêtus de ces vêtements ». Le verbe hébreu signifie littéralement « couvrir », mais le contexte peut évoquer le fait d’habiller les idoles avec ces vêtements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: tes vêtements brodés
  rationale: בִּגְדֵי désigne des vêtements et רִקְמָה un tissu brodé ou richement ouvragé. Cette formulation naturelle conserve l’idée de luxe.
- source_word: וַתְּכַסִּים
  choice: tu les en as couverts
  rationale: Le verbe כסה signifie ordinairement « couvrir ». Le pronom masculin pluriel renvoie, dans le contexte, aux idoles ou images, tandis que « en » reprend les vêtements.
- source_word: וְשַׁמְנִי
  choice: mon huile
  rationale: שֶׁמֶן signifie « huile », probablement de l’huile d’olive dans ce contexte, sans que le type soit explicitement précisé.
- source_word: וּקְטָרְתִּי
  choice: mon encens
  rationale: קְטֹרֶת désigne l’encens offert dans un cadre cultuel. Le possessif souligne que cet encens appartenait à Dieu.
- source_word: נתתי לִפְנֵיהֶם
  choice: tu as placé devant eux
  rationale: Dans le contexte d’une offrande, « placer devant » rend naturellement l’action exprimée par נתן avec לִפְנֵי, tout en conservant la relation spatiale du texte hébreu.
theological_decisions:
- issue: Référent des suffixes masculins pluriels
  choice: Conserver le pronom « eux », dont le contexte identifie le référent comme les idoles ou images.
  alternative: Nommer explicitement « les idoles » ou laisser les objets plus indéterminés.
  rationale: Le contexte immédiat permet d’identifier le référent, mais le maintien du pronom respecte la formulation hébraïque sans ajouter une explicitation dans le corps du texte.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement féminin singulier est imposé par les formes verbales hébraïques et par l’adresse à Jérusalem personnifiée. La tournure « les en as couverts » évite l’ambiguïté française sur ce qui sert à couvrir, tout en restant proche de l’hébreu.
