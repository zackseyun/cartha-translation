id: EZK.16.60
reference: Ezekiel 16:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: fr
  text: Mais moi, je me souviendrai de mon alliance avec toi au temps de ta jeunesse[a], et j’établirai pour toi une alliance perpétuelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « mon alliance avec toi aux jours de ta jeunesse »; il rappelle ainsi la relation d’alliance antérieure sans préciser ici de quelle forme d’alliance il s’agit.
    reason: cross_reference
  - marker: b
    text: Ou « une alliance éternelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זָכַרְתִּי
  choice: Mais ... je me souviendrai
  rationale: Dans le contexte, le qatal précédé de la conjonction a une valeur future. « Mais » marque naturellement le contraste entre la honte évoquée auparavant et l’action bienveillante de Dieu.
- source_word: אֲנִי
  choice: moi, je
  rationale: Le pronom indépendant renforce le sujet déjà indiqué par le verbe; la dislocation « moi, je » restitue cette insistance en français naturel.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Rend directement le nom בְּרִית et son suffixe possessif.
- source_word: אֶת ... אוֹתָךְ
  choice: avec toi
  rationale: La construction exprime ici la relation entre l’alliance et sa destinataire; « avec toi » est l’équivalent idiomatique français.
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: au temps de ta jeunesse
  rationale: Conserve l’expression temporelle hébraïque tout en restant fluide en français moderne.
- source_word: וַהֲקִמוֹתִי
  choice: et j’établirai
  rationale: Le hiphil de קום employé avec « alliance » peut signifier établir ou confirmer; « établir » conserve la formulation sans trancher davantage.
- source_word: לָךְ
  choice: pour toi
  rationale: Préserve la valeur dative de la préposition ל plutôt que de l’assimiler à la formule « avec toi ».
- source_word: בְּרִית עוֹלָם
  choice: une alliance perpétuelle
  rationale: Expression française naturelle qui communique la permanence durable de עוֹלָם sans archaïsme.
theological_decisions:
- issue: Identification de l’alliance dans le contexte du rétablissement
  choice: Conserver « mon alliance » et « une alliance perpétuelle » sans identifier cette dernière à un système théologique précis.
  alternative: Préciser qu’il s’agit soit de l’alliance mosaïque, soit de la nouvelle alliance.
  rationale: Le verset rappelle l’alliance liée à la jeunesse de Jérusalem et annonce une alliance perpétuelle, mais ne précise pas à lui seul quelle administration de l’alliance est visée; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, je » garde l’emphase du pronom hébreu; « au temps de ta jeunesse » évite une tournure trop littérale tout en conservant l’image temporelle.
