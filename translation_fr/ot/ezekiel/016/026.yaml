source:
  edition: WLC
  text: וַ/תִּזְנִ֧י אֶל בְּנֵֽי מִצְרַ֛יִם שְׁכֵנַ֖יִ/ךְ גִּדְלֵ֣י בָשָׂ֑ר וַ/תַּרְבִּ֥י אֶת תַּזְנֻתֵ֖/ךְ לְ/הַכְעִיסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: fr
  text: Tu t’es prostituée avec les Égyptiens[a], tes voisins au sexe imposant[b], et tu as multiplié ta prostitution pour provoquer ma colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’Égypte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « grands de chair » ; expression crue désignant vraisemblablement leurs organes sexuels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: Tu t’es prostituée
  rationale: Le verbe זנה porte ici la métaphore sexuelle explicite de l’infidélité de Jérusalem. La forme pronominale est naturelle en français moderne et conserve la force de l’image.
- source_word: אֶל
  choice: avec
  rationale: Bien que la préposition signifie littéralement « vers » ou « à », « avec » exprime naturellement en français la relation sexuelle impliquée par זנה.
- source_word: בְּנֵי מִצְרַיִם
  choice: les Égyptiens[a]
  rationale: Littéralement « les fils de l’Égypte ». « Les Égyptiens » transmet clairement le référent en français courant, tandis que la tournure hébraïque est signalée en note.
- source_word: שְׁכֵנַיִךְ
  choice: tes voisins
  rationale: Rendu direct du terme désignant ceux qui habitent à proximité, avec ici une portée également géopolitique.
- source_word: גִּדְלֵי בָשָׂר
  choice: dotés d’un sexe imposant[b]
  rationale: L’expression signifie littéralement « grands de chair » et constitue dans ce contexte une description sexuelle crue. Cette formulation rend son sens probable sans employer un calque français obscur.
- source_word: וַתַּרְבִּי
  choice: et tu as multiplié
  rationale: Le hiphil de רבה exprime l’accroissement ou la multiplication. Le choix conserve également le parallélisme avec le nom qui suit.
- source_word: תַּזְנֻתֵךְ
  choice: tes prostitutions
  rationale: Ce nom apparenté à זנה désigne ici les actes répétés de prostitution métaphorique. Le pluriel français rend naturellement cette répétition et maintient le lien lexical avec le premier verbe.
- source_word: לְהַכְעִיסֵנִי
  choice: pour provoquer ma colère
  rationale: Le hiphil de כעס exprime le fait de provoquer quelqu’un à la colère. Cette formulation française en conserve la causalité et le résultat émotionnel.
theological_decisions:
- issue: Métaphore prophétique sexuelle de l’idolâtrie et des alliances étrangères
  choice: Conserver explicitement l’image de la prostitution
  alternative: Atténuer en « tu as été infidèle » ou « tu as commis l’adultère »
  rationale: Le discours du chapitre emploie délibérément un langage sexuel choquant pour représenter l’infidélité de Jérusalem. L’atténuer réduirait la force rhétorique du texte.
- issue: Sens de גִּדְלֵי בָשָׂר
  choice: Comprendre l’expression comme une allusion explicite aux organes sexuels masculins
  alternative: Rendre plus vaguement par « vigoureux » ou « pleins de convoitise »
  rationale: Dans le contexte de la métaphore sexuelle, « chair » fonctionne vraisemblablement comme un euphémisme corporel. Le rendu retenu préserve cette crudité sans transformer l’expression en jugement psychologique sur la convoitise.
translation_notes:
  register: Français moderne, direct et digne, tout en conservant la crudité intentionnelle de la métaphore prophétique. Le tutoiement féminin correspond à Jérusalem personnifiée dans le contexte.
