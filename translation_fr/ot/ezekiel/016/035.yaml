  text: לָ/כֵ֣ן זוֹנָ֔ה שִׁמְעִ֖י דְּבַר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/035.yaml
  text: Therefore[a], prostitute, hear the word of Yahweh.
translation:
  language: fr
  text: C’est pourquoi, prostituée, écoute la parole de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence des accusations précédentes et conserve la valeur conclusive de l’hébreu.
- source_word: זוֹנָה
  choice: prostituée
  rationale: Le nom désigne littéralement une prostituée et maintient ici la métaphore directe et sévère de l’infidélité de Jérusalem, sans recourir à un terme archaïque.
- source_word: שִׁמְעִי
  choice: écoute
  rationale: Impératif féminin singulier adressé à Jérusalem; « écoute » est l’expression française naturelle pour appeler à prêter attention à une parole divine.
- source_word: דְּבַר
  choice: la parole
  rationale: Conserve la formulation prophétique consacrée דְּבַר יְהוָה tout en restant claire en français contemporain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » en conserve la fonction de nom propre.
- issue: Métaphore sexuelle appliquée à Jérusalem
  choice: prostituée
  alternative: courtisane; putain
  rationale: « Prostituée » préserve la dureté de l’accusation et son sens littéral, dans un registre moderne et digne, sans archaïsme ni grossièreté supplémentaire.
translation_notes:
  register: Adresse prophétique brève, directe et sévère. Le féminin singulier de « prostituée » et de l’impératif vise Jérusalem personnifiée. La ponctuation isole le vocatif conformément à l’usage naturel du français.
