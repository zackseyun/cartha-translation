source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: fr
  text: Tu as multiplié ta prostitution vers le pays de Canaan[a], vers la Chaldée ; mais même ainsi, tu n’as pas été rassasiée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers le pays de Canaan, chez les Chaldéens », ou : « au pays de Canaan — la Chaldée ». La syntaxe hébraïque est condensée : l’expression peut assimiler figurativement Canaan à la Chaldée (la Babylonie), ou décrire une extension de Canaan jusqu’en Chaldée.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: Tu as multiplié
  rationale: Le hiphil de רבה exprime ici l’accroissement intensif de la conduite figurée de Jérusalem ; « multiplier » conserve la vigueur et la transitivité de l’hébreu.
- source_word: תַּזְנוּתֵךְ
  choice: ta prostitution
  rationale: Le nom issu de זנה maintient la métaphore sexuelle explicite par laquelle Ézéchiel dénonce l’infidélité religieuse et politique de Jérusalem.
- source_word: אֶל אֶרֶץ כְּנַעַן כַּשְׂדִּימָה
  choice: jusqu’au pays de Canaan, jusqu’en Chaldée
  rationale: « Jusqu’à/jusqu’en » rend naturellement l’idée d’extension directionnelle portée par אֶל et par le suffixe directionnel de כַּשְׂדִּימָה, tout en laissant la relation exacte entre Canaan et la Chaldée à la note.
- source_word: וְגַם בְּזֹאת
  choice: mais même ainsi
  rationale: Cette formulation française exprime la progression emphatique et la valeur concessive du contexte sans alourdir la phrase.
- source_word: לֹא שָׂבָעַתְּ
  choice: tu n’as pas été rassasiée
  rationale: שׂבע signifie être rassasié ou repu. « Rassasiée » conserve l’image d’un désir insatiable et l’accord féminin avec Jérusalem.
theological_decisions:
- issue: Métaphore prophétique sexuelle de l’infidélité à l’alliance
  choice: Conserver « prostitution »
  alternative: « infidélité » ou « immoralité sexuelle »
  rationale: Le langage volontairement choquant d’Ézéchiel doit rester explicite ; une généralisation morale atténuerait la métaphore et expliciterait indûment son interprétation.
- issue: Relation syntaxique entre Canaan et la Chaldée
  choice: Conserver dans le texte une progression géographique, avec une note signalant l’ambiguïté
  alternative: Identifier directement le pays de Canaan à la Chaldée, ou comprendre une adresse aux Chaldéens
  rationale: La syntaxe hébraïque est condensée et permet plusieurs analyses ; la traduction ne doit pas en imposer silencieusement une seule.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin correspond à Jérusalem personnifiée. La métaphore explicite et la notion d’insatiabilité sont préservées.
