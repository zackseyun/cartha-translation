revisions:
- from: Tu as multiplié ta prostitution jusqu’au pays de Canaan[a], jusqu’en Chaldée ; mais même ainsi, tu n’as pas été rassasiée.
  to: Tu as multiplié ta prostitution vers le pays de Canaan[a], vers la Chaldée ; mais même ainsi, tu n’as pas été rassasiée.
  rationale: La révision remplace « jusqu’au …, jusqu’en … » par « vers …, vers … ». Elle conserve la force directionnelle des formes hébraïques sans présenter comme certaine une extension géographique graduelle de Canaan à la Chaldée. La note continue de présenter les principales analyses possibles. Aucun changement n’est apporté à la métaphore, au registre ou à l’image d’insatiabilité.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:44Z'
review_pass:
  verdict: revise
  source_fidelity: Le verbe causatif « tu as multiplié » et la métaphore explicite de « prostitution » rendent correctement וַתַּרְבִּי אֶת־תַּזְנוּתֵךְ. Toutefois, « jusqu’au pays de Canaan, jusqu’en Chaldée » transforme plus nettement les deux expressions directionnelles en une progression avec terminus. L’hébreu comprimé permet aussi une apposition (« Canaan, la Chaldée ») ou une destination liée aux Chaldéens; la formulation française doit éviter de fixer cette relation dans le texte principal.
  naturalness: « Tu n’as pas été rassasiée » est naturel dans un registre biblique moderne et conserve l’image de satiété. « Mais même ainsi » est également idiomatique. La révision proposée est fluide, tout en étant moins interprétative pour la relation entre les lieux.
  terminology: « Prostitution » préserve la force de la métaphore prophétique sans la réduire à une abstraction théologique. « Chaldée » est le nom géographique français approprié; « les Chaldéens » est maintenu comme possibilité en note. Le féminin de « rassasiée » correspond à Jérusalem personnifiée.
  issues:
  - severity: medium
    issue: La double formulation « jusqu’au …, jusqu’en … » impose une lecture séquentielle et terminale de la syntaxe géographique.
    rationale: אֶל et le suffixe directionnel de כַּשְׂדִּימָה signalent une direction, mais leur relation précise avec « le pays de Canaan » demeure disputée. Une traduction principale moins marquée, accompagnée d’une note complète, préserve mieux l’ambiguïté du texte.
  revised_text: Tu as multiplié ta prostitution vers le pays de Canaan[a], vers la Chaldée ; mais même ainsi, tu n’as pas été rassasiée.
