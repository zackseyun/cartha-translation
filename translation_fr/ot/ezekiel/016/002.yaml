  text: בֶּן אָדָ֕ם הוֹדַ֥ע אֶת יְרוּשָׁלִַ֖ם אֶת תּוֹעֲבֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/002.yaml
  text: Son of man[a], make known to Jerusalem her abominations.
translation:
  language: fr
  text: Fils d’homme, fais connaître à Jérusalem ses abominations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette expression traduit littéralement l’apostrophe hébraïque récurrente adressée au prophète dans Ézéchiel. Elle conserve la forme du texte source et l’usage biblique français établi, sans adopter l’interprétation plus explicative « mortel ».
- source_word: הוֹדַע
  choice: fais connaître à
  rationale: 'L’impératif au hiphil de ידע a un sens causatif : « faire savoir » ou « faire connaître ». « Fais connaître à Jérusalem » restitue naturellement cette valeur ainsi que la construction à double complément.'
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu biblique.
- source_word: תּוֹעֲבֹתֶיהָ
  choice: ses pratiques abominables
  rationale: תּוֹעֵבָה désigne ce qui est odieux ou abominable, avec ici une forte portée morale et cultuelle. « Pratiques abominables » rend le pluriel de manière naturelle et concrète, tandis que le possessif « ses » renvoie sans ambiguïté à Jérusalem.
theological_decisions:
- issue: Personnification féminine de Jérusalem
  choice: Employer « ses » en maintenant Jérusalem comme référent personnel dans le contexte
  alternative: « ses abominations » ou une formulation explicitement féminine telle que « les pratiques abominables qu’elle a commises »
  rationale: Le suffixe hébreu est féminin singulier et prépare la personnification de Jérusalem comme femme dans la suite du chapitre. En français, « ses » ne marque pas le genre du possesseur, mais conserve naturellement la référence sans ajouter au verset un pronom absent du texte source.
translation_notes:
  register: Français international moderne, digne et direct. « Fils d’homme » maintient l’idiome biblique établi; « pratiques abominables » évite le caractère plus abstrait et moins courant de « abominations » tout en conservant la force accusatrice du terme hébreu.
