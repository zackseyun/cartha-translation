  text: וְ/שָׂרְפ֤וּ בָתַּ֨יִ/ךְ֙ בָּ/אֵ֔שׁ וְ/עָשׂוּ בָ֣/ךְ שְׁפָטִ֔ים לְ/עֵינֵ֖י נָשִׁ֣ים רַבּ֑וֹת וְ/הִשְׁבַּתִּי/ךְ֙ מִ/זּוֹנָ֔ה וְ/גַם אֶתְנַ֖ן לֹ֥א תִתְּנִי עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: fr
  text: Ils mettront le feu à tes maisons et te feront subir des châtiments sous les yeux de nombreuses femmes. Je te ferai cesser de te prostituer, et tu ne donneras plus de paiement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salaire de prostituée » ; le terme hébreu désigne un paiement associé à la prostitution.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: Ils brûleront tes maisons
  rationale: Le futur convient à la suite de l’annonce prophétique. En français, « brûler » exprime déjà normalement l’action du feu, ce qui évite le pléonasme peu naturel « brûler par le feu » sans perdre le sens.
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: te feront subir des châtiments
  rationale: L’expression désigne l’exécution de sanctions judiciaires. Cette formulation française actuelle conserve la dimension punitive et judiciaire sans le calque peu naturel « faire des jugements contre toi ».
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: sous les yeux de nombreuses femmes
  rationale: Rend directement l’image hébraïque et souligne le caractère public de l’humiliation.
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: Je te ferai cesser de te prostituer
  rationale: Le hifil de שׁבת exprime ici la causation de la cessation, tandis que זנה maintient explicitement la métaphore de la prostitution. La tournure est naturelle en français moderne.
- source_word: אֶתְנַן
  choice: salaire
  rationale: Le mot désigne une rétribution liée à la prostitution. « Salaire » reste concis dans le texte, tandis que la note en précise le sens particulier.
- source_word: לֹא תִתְּנִי עוֹד
  choice: tu ne donneras plus
  rationale: L’imparfait hébreu négatif avec עוֹד indique la cessation future. La traduction conserve le fait inhabituel mais intentionnel que Jérusalem donne elle-même cette rétribution.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité de Jérusalem
  choice: Conserver explicitement « te prostituer »
  alternative: Remplacer la métaphore par « être infidèle » ou « pratiquer l’idolâtrie »
  rationale: Le texte d’Ézéchiel emploie délibérément une image sexuelle forte pour l’infidélité de Jérusalem. La rendre explicitement préserve sa force rhétorique et évite d’en imposer une interprétation abstraite.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin correspond à Jérusalem personnifiée. La formulation conserve la violence judiciaire et la métaphore sexuelle du passage sans archaïsme ni atténuation doctrinale.
