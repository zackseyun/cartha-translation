base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: fr
  text: 'Mais tu as mis ta confiance dans ta beauté, tu t’es prostituée à cause de ta renommée[a] et tu as répandu tes prostitutions sur chaque passant[b] : ce fut pour lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à cause de ton nom » ; ici, le « nom » désigne la renommée ou la réputation.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est très concise en hébreu : « à lui, ce sera » ou « ce fut pour lui ». Elle indique que ce qui était offert était donné à chaque passant, sans préciser davantage le référent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: tu as mis ta confiance dans ta beauté
  rationale: בטח avec ב exprime le fait de placer sa confiance en quelque chose. Cette formulation française conserve l’accusation de confiance mal placée et rend naturellement יֹפִי par « beauté ».
- source_word: וַתִּזְנִי
  choice: tu t’es prostituée
  rationale: זנה porte ici l’image explicite de la prostitution pour représenter l’infidélité de Jérusalem. Le français moderne conserve cette image sans recourir à une tournure archaïque.
- source_word: עַל שְׁמֵךְ
  choice: à cause de ta renommée
  rationale: Dans ce contexte, שֵׁם désigne le nom au sens de renom ou de réputation, comme l’indique le verset précédent. « Renommée » communique ce sens naturel sans rendre littéralement « nom », formulation qui serait obscure en français.
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: tu as répandu tes prostitutions
  rationale: שׁפך signifie concrètement « verser, répandre » et maintient le style saisissant d’Ézéchiel. Le pluriel « prostitutions » reflète תַּזְנוּתַיִךְ et suggère des actes répétés.
- source_word: עַל כָּל עוֹבֵר
  choice: sur chaque passant
  rationale: La formulation garde la préposition עַל et l’image volontairement crue d’une disponibilité offerte indistinctement à quiconque passe.
- source_word: לוֹ יֶהִי
  choice: elles étaient pour lui
  rationale: La proposition hébraïque est très elliptique, littéralement « à lui que ce soit ». Le féminin pluriel renvoie en français aux « prostitutions » tout en conservant l’idée que celles-ci étaient livrées à chaque passant.
theological_decisions:
- issue: Métaphore sexuelle prophétique de l’infidélité de Jérusalem envers l’alliance
  choice: Conserver explicitement le vocabulaire de la prostitution dans le texte principal
  alternative: Employer une formulation atténuée telle que « tu as été infidèle »
  rationale: Le texte hébreu choisit délibérément une image sexuelle choquante pour dépeindre l’idolâtrie et les alliances infidèles de Jérusalem. La rendre explicitement préserve la force prophétique sans réduire la métaphore à son interprétation théologique.
- issue: Sens de la proposition finale לוֹ יֶהִי
  choice: Préserver son caractère elliptique par « elles étaient pour lui »
  alternative: 'Expliciter : « tu te donnais à lui » ou « elles lui appartenaient »'
  rationale: L’hébreu ne précise pas entièrement la relation exprimée. La traduction choisie indique le don au passant sans trancher davantage entre disponibilité, attribution et possession.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin est maintenu parce que Jérusalem est personnifiée comme une femme. Le vocabulaire sexuel explicite et l’image concrète de l’effusion sont conservés, tandis que les notes signalent les deux expressions hébraïques particulièrement elliptiques ou idiomatiques.
