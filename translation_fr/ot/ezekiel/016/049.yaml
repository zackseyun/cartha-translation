revisions:
- from: 'Voici quelle fut la faute de Sodome, ta sœur : elle et les villes qui dépendaient d’elle[a] vivaient dans l’orgueil, avec du pain en abondance et une insouciante tranquillité, mais elle ne venait pas en aide au pauvre et au nécessiteux[b].'
  to: 'Voici quelle fut la faute de Sodome, ta sœur : l’orgueil, l’abondance de pain et une prospérité tranquille étaient son lot, ainsi que celui de ses filles[a] ; mais elle n’a pas soutenu le pauvre et le nécessiteux[b].'
  rationale: La révision rétablit dans le texte principal « ses filles », image présente dans l’hébreu, tout en conservant son explication géographique en note. Elle remplace la nuance ajoutée d’« insouciante » par « prospérité tranquille », qui rend les deux éléments de l’expression hébraïque, et aligne la dernière proposition sur l’aspect du verbe hébreu. Aucun enjeu doctrinal supplémentaire n’est introduit.
