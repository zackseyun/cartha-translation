source:
  edition: WLC
  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: fr
  text: 'Voici quelle fut la faute de Sodome, ta sœur : l’orgueil, l’abondance de pain et une prospérité tranquille étaient son lot, ainsi que celui de ses filles[a] ; mais elle n’a pas soutenu le pauvre et le nécessiteux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ses filles » : les villes ou localités associées à Sodome et dépendant d’elle.'
    reason: cultural_note
  - marker: b
    text: Littéralement « elle n’a pas fortifié la main du pauvre et du nécessiteux », expression qui signifie qu’elle ne les soutenait pas et ne leur venait pas en aide.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה הָיָה
  choice: Voici quelle fut
  rationale: Cette tournure française actuelle conserve la force présentative et explicative de l’hébreu sans l’archaïsme de « Voici, ce fut ».
- source_word: עֲוֺן
  choice: faute
  rationale: Le terme peut désigner l’iniquité, la faute ou la culpabilité. Ici, il introduit les actes et attitudes condamnables de Sodome ; « faute » garde cette amplitude en français naturel.
- source_word: אֲחוֹתֵךְ
  choice: ta sœur
  rationale: La métaphore familiale explicite, structurante dans le contexte d’Ézéchiel 16, est conservée.
- source_word: גָּאוֹן
  choice: orgueil
  rationale: Dans ce contexte moral négatif, le mot désigne l’arrogance ou l’orgueil.
- source_word: שִׂבְעַת לֶחֶם
  choice: du pain en abondance
  rationale: Cette formulation reste proche de l’expression littérale « satiété de pain » tout en étant claire en français moderne.
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: une insouciante tranquillité
  rationale: La formule rend à la fois le bien-être paisible, l’absence de trouble et la nuance de confort complaisant suggérée par le contexte.
- source_word: הָיָה לָהּ וְלִבְנוֹתֶיהָ
  choice: elle et les villes qui dépendaient d’elle vivaient dans
  rationale: Le sens possessif ou caractérisant est rendu idiomatiquement. « Les villes qui dépendaient d’elle » explicite le référent de l’image hébraïque « ses filles ».
- source_word: יָד ... לֹא הֶחֱזִיקָה
  choice: elle ne venait pas en aide
  rationale: L’expression signifie littéralement « elle ne fortifiait pas la main ». La traduction communique directement l’idée de soutien concret, tandis qu’une note conserve l’image source.
- source_word: עָנִי וְאֶבְיוֹן
  choice: au pauvre et au nécessiteux
  rationale: Le singulier collectif de l’hébreu est conservé et désigne les personnes matériellement vulnérables et sans ressources.
theological_decisions:
- issue: Nature de la faute de Sodome dans ce verset
  choice: 'Présenter les fautes sociales et morales expressément nommées : orgueil, abondance, tranquillité insouciante et refus d’aider les pauvres.'
  alternative: Faire allusion en priorité à une faute sexuelle ou importer dans ce verset l’ensemble des débats interprétatifs ultérieurs.
  rationale: Le texte hébreu de ce verset énumère précisément ces attitudes et ce manquement social. La traduction ne doit ni réduire ni élargir doctrinalement son propos.
- issue: Portée de « ses filles »
  choice: Rendre dans le texte le référent géopolitique par « les villes qui dépendaient d’elle », avec une note sur l’image hébraïque.
  alternative: Conserver seulement « ses filles », au risque que le lecteur moderne comprenne des descendantes humaines.
  rationale: Dans le langage prophétique appliqué aux villes, les « filles » sont les localités associées ou dépendantes. L’explicitation transmet le sens sans effacer l’image, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite les calques lourds tout en conservant la métaphore de « ta sœur », la mention concrète du pain et la tension morale entre prospérité et abandon des personnes vulnérables.
