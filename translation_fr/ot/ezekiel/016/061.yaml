    rationale: Cette tournure, possible dans un registre biblique ancien, est moins naturelle en français international actuel. « Comme filles » est clair et fidèle à la valeur relationnelle de לְבָנוֹת.
  - severity: low
    issue: Note a trop expansive
    rationale: « Accueilleras » interprète le contexte relationnel, tandis que la véritable alternative lexicale au choix « recevras » est « prendras ». La note doit distinguer l’alternative textuelle d’une paraphrase interprétative.
