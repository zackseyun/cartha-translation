  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: fr
  text: Alors tu te souviendras de ta conduite et tu auras honte lorsque tu recevras tes sœurs[a], celles qui sont plus âgées que toi avec celles qui sont plus jeunes que toi. Je te les donnerai comme filles, mais non en vertu de ton alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque tu prendras tes sœurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais non de ton alliance ». Le rapport précis à cette alliance reste condensé dans l’hébreu.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְזָכַרְתְּ אֶת־דְּרָכַיִךְ
  choice: Alors tu te souviendras de ta conduite
  rationale: Le parfait précédé de וְ prend ici une valeur future et consécutive dans le discours prophétique. « Ta conduite » exprime naturellement le sens moral du pluriel métaphorique « tes voies ».
- source_word: וְנִכְלַמְתְּ
  choice: et tu auras honte
  rationale: נכלם désigne la honte ou l'humiliation; cette formulation française conserve ici la réaction morale intérieure.
- source_word: בְּקַחְתֵּךְ אֶת־אֲחוֹתַיִךְ
  choice: lorsque tu recevras tes sœurs
  rationale: L'infinitif construit avec בְּ a une valeur temporelle. « Recevoir » convient à l'incorporation relationnelle décrite, tandis que la note conserve le sens plus littéral « prendre ».
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל־הַקְּטַנּוֹת מִמֵּךְ
  choice: celles qui sont plus âgées que toi avec celles qui sont plus jeunes que toi
  rationale: Dans la métaphore familiale, « grandes » et « petites » désignent naturellement des sœurs plus âgées et plus jeunes. « Avec » réunit les deux groupes sans effacer la construction hébraïque.
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: Je te les donnerai pour filles
  rationale: « Donner pour filles » reproduit avec naturel l'image d'une nouvelle relation familiale et d'une incorporation sous l'autorité de Jérusalem.
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: mais non en vertu de ton alliance
  rationale: La préposition מִן indique ici la provenance ou le fondement. « En vertu de » préserve la concision et l'ambiguïté de la formule sans préciser indûment la nature exacte de l'alliance.
theological_decisions:
- issue: Sens de « ton alliance » dans la proposition finale
  choice: Le don des sœurs comme filles ne se fait pas en vertu de l'alliance de Jérusalem.
  alternative: Ce don ne provient pas de l'alliance de Jérusalem ou ne repose pas sur elle.
  rationale: La traduction maintient la négation d'un fondement dans « ton alliance », sans ajouter explicitement les notions de mérite, de droit ou de statut qui ne figurent pas dans la proposition hébraïque.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement féminin singulier est conservé puisque Jérusalem est personnifiée comme une femme. La première phrase garde l'enchaînement prophétique, tandis que la seconde évite une coordination trop lourde.
