base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: fr
  text: Tu as pris certains de tes vêtements et tu t’en es fait des hauts lieux multicolores[a], sur lesquels tu t’es prostituée. De telles choses ne devraient pas arriver, et cela ne devrait pas être[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hauts lieux en pièces rapportées », « hauts lieux bigarrés » ou « sanctuaires multicolores ». L’adjectif hébreu est difficile et désigne probablement l’aspect décoré obtenu au moyen des vêtements.
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset est difficile en hébreu. Elle peut signifier : « De telles choses ne devraient pas se produire », ou, plus littéralement : « elles ne viennent pas, et cela ne sera pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּגָדַיִךְ
  choice: certains de tes vêtements
  rationale: 'Le מִן a ici une valeur partitive : Jérusalem prend une partie de ses vêtements.'
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Terme usuel pour les lieux de culte, souvent illégitimes, visés par la polémique prophétique.
- source_word: טְלֻאוֹת
  choice: multicolores
  rationale: L’adjectif rare évoque vraisemblablement un aspect fait de pièces, bigarré ou varié, produit au moyen des vêtements ; « multicolores » restitue naturellement cette image sans exclure l’idée d’assemblage.
- source_word: וַתִּזְנִי
  choice: tu t’es prostituée
  rationale: La formulation explicite conserve la métaphore sexuelle volontairement choquante employée par Ézéchiel pour l’infidélité idolâtre.
- source_word: עֲלֵיהֶם
  choice: sur lesquels
  rationale: Le pronom masculin pluriel renvoie naturellement aux hauts lieux ; la préposition עַל est conservée par « sur ».
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: De telles choses ne devraient pas arriver et ne devraient pas exister
  rationale: La clause est obscure et elliptique. Cette formulation exprime la dénonciation d’un fait anormal ou inadmissible tout en signalant en note une traduction plus littérale.
theological_decisions:
- issue: Métaphore prophétique de la prostitution appliquée à l’idolâtrie
  choice: Conserver « tu t’es prostituée »
  alternative: « tu as été infidèle »
  rationale: Le texte choisit une image sexuelle explicite ; la remplacer par son interprétation atténuerait la force de la rhétorique prophétique.
- issue: Sens de la clause finale obscure
  choice: 'La comprendre comme un jugement d’inadmissibilité : ces actes ne devraient ni arriver ni exister'
  alternative: 'Traduire formellement : « elles ne viennent pas et cela ne sera pas »'
  rationale: La syntaxe hébraïque est difficile et probablement elliptique. Le texte principal reste intelligible, tandis que la note préserve l’incertitude et la forme plus littérale.
translation_notes:
  register: Français international moderne, direct et digne. Le féminin est maintenu puisque le discours s’adresse à Jérusalem personnifiée comme une femme. « Hauts lieux » conserve le vocabulaire cultuel traditionnel tout en restant compréhensible dans le contexte.
