source:
  edition: WLC
  text: וְ/ל֤וֹא הָֽיְתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ לִ/שְׁמוּעָ֖ה בְּ/פִ֑י/ךְ בְּ/י֖וֹם גְּאוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/056.yaml
  text: Was not Sodom your sister a byword in your mouth in the day of your pride?[a]
translation:
  language: fr
  text: Sodome, ta sœur, n’était-elle pas un sujet de conversation dans ta bouche, au temps de ton orgueil ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «une nouvelle», «ce dont on parle» ou «un objet de propos». Le mot hébreu désigne ce qui est entendu ou rapporté; dans ce contexte, Sodome peut être évoquée comme un exemple notoire, peut-être avec mépris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: n’était-elle pas
  rationale: La conjonction suivie de la négation introduit ici naturellement une question rhétorique, qui conserve la vigueur du reproche prophétique.
- source_word: הָיְתָה
  choice: était
  rationale: Le qatal de היה exprime ici un état passé.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française conventionnelle du nom propre.
- source_word: אֲחוֹתֵךְ
  choice: ta sœur
  rationale: Le terme de parenté est conservé, car la métaphore des villes-sœurs structure le chapitre.
- source_word: לִשְׁמוּעָה
  choice: un objet de mépris
  rationale: שְׁמוּעָה désigne littéralement ce qui est entendu ou rapporté; avec «dans ta bouche» et dans ce contexte, il s’agit vraisemblablement de Sodome comme objet de propos dédaigneux. Une note conserve les autres valeurs possibles.
- source_word: בְּפִיךְ
  choice: dans ta bouche
  rationale: Le calque compréhensible préserve l’image hébraïque plutôt que de la remplacer par «sur tes lèvres».
- source_word: בְּיוֹם
  choice: au temps de
  rationale: Cette formulation française naturelle rend la valeur temporelle de l’expression hébraïque sans archaïsme.
- source_word: גְּאוֹנָיִךְ
  choice: ton orgueil
  rationale: Dans ce contexte, גאון exprime l’élévation arrogante; «orgueil» est précis, courant et concis.
theological_decisions:
- issue: Force rhétorique de l’énoncé concernant Sodome
  choice: 'Question rhétorique : «Sodome, ta sœur, n’était-elle pas…?»'
  alternative: 'Déclaration négative : «Sodome, ta sœur, n’était pas…»'
  rationale: L’enchaînement hébreu, dans ce reproche prophétique, se prête à une question rhétorique en français. Cette lecture conserve la force polémique sans ajouter d’interprétation doctrinale.
- issue: Nature des propos de Jérusalem au sujet de Sodome
  choice: «un objet de mépris»
  alternative: «un sujet de conversation», «une nouvelle» ou «ce dont on parle»
  rationale: Le contexte suggère des propos méprisants tenus avec orgueil, mais le nom hébreu reste plus large; l’ambiguïté lexicale est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. Tutoiement féminin maintenu, puisque Jérusalem est personnifiée comme une femme. Ponctuation française et espace fine insécable avant le point d’interrogation.
