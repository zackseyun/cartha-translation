  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: fr
  text: 'Tu diras : « Voici ce que dit le Seigneur Yahweh à Jérusalem : Tes origines et ta naissance viennent du pays du Cananéen[a] ; ton père était un Amoréen, et ta mère une Hittite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait traduire plus couramment : « du pays de Canaan ». L’hébreu dit plus littéralement : « du pays du Cananéen », ce qui maintient l’accent ethnique.'
    reason: Alternative lexicale et précision sur la forme hébraïque.
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: 'Tu diras : « Voici ce que dit'
  rationale: Le futur français rend naturellement l’instruction prophétique, tandis que la formule au présent conserve la force de l’énoncé du messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה, sans produire le redoublement « Seigneur SEIGNEUR ».
- source_word: לִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ל marque ici la destinataire du message.
- source_word: מְכֹרֹתַיִךְ וּמוֹלְדֹתַיִךְ
  choice: Tes origines et ta naissance
  rationale: Cette formulation française claire maintient le parallélisme entre la provenance de Jérusalem et sa naissance figurée.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: viennent du pays du Cananéen
  rationale: Le gentilé hébreu singulier est conservé afin de maintenir l’accent ethnique qui prépare les mentions de l’Amoréen et de la Hittite.
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: ton père était amoréen
  rationale: L’imparfait explicite naturellement la proposition nominale hébraïque dans cette généalogie figurée.
- source_word: וְאִמֵּךְ חִתִּית
  choice: et ta mère hittite
  rationale: L’ellipse du verbe, aisément compris à partir de la proposition précédente, reproduit la concision et le parallélisme de l’hébreu.
theological_decisions:
- issue: Ascendance figurée de Jérusalem
  choice: Conserver sans l’expliquer dans le corps du texte la généalogie qui rattache Jérusalem aux peuples préisraélites du pays.
  alternative: Expliciter une ressemblance morale ou spirituelle avec les Cananéens.
  rationale: Le texte formule directement cette accusation au moyen d’une ascendance choquante. Une explicitation interprétative réduirait la tension de l’image et irait au-delà du verset.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Ce choix distingue le titre אֲדֹנָי du nom propre יהוה et préserve explicitement le nom divin.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond à Jérusalem personnifiée comme une femme. Les gentilés « amoréen » et « hittite » sont employés comme attributs, avec une minuscule selon l’usage français.
