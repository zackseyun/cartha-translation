    issue: Ethnonymes finaux rendus sans article et en minuscules
    rationale: 'Dans la construction hébraïque, « l’Amoréen » et « une Hittite » désignent des membres de peuples. En français, les substantifs de nationalité ou de peuple prennent normalement une majuscule et l’article indéfini rend plus naturellement l’attribution : « un Amoréen », « une Hittite ». Cela évite de les lire comme de simples adjectifs.'
