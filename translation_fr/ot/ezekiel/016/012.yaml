  text: וָ/אֶתֵּ֥ן נֶ֨זֶם֙ עַל אַפֵּ֔/ךְ וַ/עֲגִילִ֖ים עַל אָזְנָ֑יִ/ךְ וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/רֹאשֵֽׁ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/012.yaml
  text: And I put a ring on your nose[a], earrings on your ears[b], and a splendid crown on your head.
translation:
  language: fr
  text: Je t’ai mis un anneau au nez[a], des boucles aux oreilles et une couronne magnifique[b] sur ta tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un anneau sur le nez ». Le mot hébreu désigne souvent, dans ce contexte, un anneau porté au nez.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une couronne de splendeur » ou « de beauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Je t’ai mis
  rationale: נתן peut signifier « donner », « mettre » ou « placer ». Dans cette scène où Dieu pare la femme, « mettre » exprime naturellement l’action concrète.
- source_word: נֶזֶם עַל אַפֵּךְ
  choice: un anneau au nez
  rationale: נֶזֶם désigne un anneau ornemental, ici explicitement associé au nez. « Au nez » est idiomatique en français tout en conservant clairement l’emplacement.
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  choice: des boucles aux oreilles
  rationale: עֲגִילִים désigne ici des ornements d’oreilles. Cette formulation est naturelle et garde le parallélisme avec l’anneau au nez.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: une couronne magnifique
  rationale: La construction signifie littéralement « une couronne de splendeur/beauté ». « Magnifique » rend de façon concise et digne la beauté éclatante exprimée par תִּפְאֶרֶת.
- source_word: בְּרֹאשֵׁךְ
  choice: sur la tête
  rationale: Avec une couronne, la préposition בְּ exprime ici la position sur la tête; « sur » est l’équivalent français naturel.
