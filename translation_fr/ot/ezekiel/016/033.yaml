source:
  edition: WLC
  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: fr
  text: On donne un paiement à toute prostituée. Mais toi, tu as donné tes cadeaux à tous tes amants et tu les as soudoyés pour qu’ils viennent à toi de tous côtés, pour tes actes de prostitution.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵדֶה
  choice: un paiement
  rationale: Dans ce contexte, le don remis à une prostituée désigne sa rétribution; « paiement » exprime clairement cette fonction en français moderne.
- source_word: נְדָנַיִךְ
  choice: tes cadeaux
  rationale: Le terme désigne ce que Jérusalem donne elle-même à ses amants; « cadeaux » maintient le contraste inversé avec le paiement normalement reçu.
- source_word: מְאַהֲבַיִךְ
  choice: tes amants
  rationale: Le mot désigne ici les partenaires recherchés dans la métaphore conjugale et sexuelle.
- source_word: וַתִּשְׁחֳדִי
  choice: tu les as soudoyés
  rationale: Le verbe évoque le fait de gagner quelqu’un par un présent corrupteur; « soudoyer » conserve la force accusatrice du texte.
- source_word: בְּתַזְנוּתָיִךְ
  choice: pour tes actes de prostitution
  rationale: Le pluriel hébreu désigne les comportements répétés de prostitution; cette formulation est plus naturelle que le pluriel abstrait « prostitutions » tout en gardant l'idée de répétition.
theological_decisions:
- issue: Métaphore de l’infidélité de Jérusalem
  choice: Conserver explicitement le vocabulaire de la prostitution, des amants et de la corruption.
  alternative: Atténuer en parlant seulement d’infidélité ou d’alliances.
  rationale: Le texte prophétique formule délibérément l’accusation au moyen d’une métaphore sexuelle choquante; l’atténuer effacerait sa force et son lien avec le contexte.
translation_notes:
  register: 'Français moderne, direct et digne. La structure antithétique est conservée: ce que reçoit normalement une prostituée, Jérusalem le donne au contraire à ses amants. Le tutoiement maintient l’adresse féminine singulière du texte hébreu.'
