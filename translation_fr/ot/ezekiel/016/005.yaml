revisions:
- from: Aucun regard ne s’est posé sur toi avec pitié pour te faire ne serait-ce qu’une seule de ces choses, par compassion pour toi. Au contraire, tu as été jetée en plein champ, tant ta vie inspirait le dégoût[a], le jour où tu es née.
