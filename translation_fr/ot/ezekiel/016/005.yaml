  rationale: La révision conserve tous les éléments du texte source et améliore l’idiome français. Elle rétablit l’image de l’« œil » qui éprouve ou non de la pitié, rend le renvoi aux soins antérieurs de façon naturelle, et remplace une paraphrase causalement déterminée du dernier membre par une formulation qui respecte mieux l’ambiguïté de l’hébreu. La note conserve l’alternative sans trancher indûment entre les analyses possibles.
