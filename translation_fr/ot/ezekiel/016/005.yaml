base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: fr
  text: Aucun œil n’a eu pitié de toi, au point de te prodiguer ne serait-ce qu’un seul de ces soins, par compassion pour toi ; au contraire, tu as été jetée en plein champ, par dégoût pour toi[a], le jour où tu es née.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que ta vie était en horreur ». L’expression hébraïque est concise et peut aussi exprimer plus directement l’aversion éprouvée envers le nouveau-né lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: Aucun regard ne s’est posé sur toi avec pitié
  rationale: Préserve l’image hébraïque de l’œil tout en l’exprimant dans un français naturel. Le contexte est celui de soins refusés, non d’une personne épargnée lors d’un jugement.
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: pour te faire ne serait-ce qu’une seule de ces choses
  rationale: Renvoie aux soins énumérés au verset précédent et fait ressortir qu’aucun, pas même un seul, n’a été accompli.
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: par compassion pour toi
  rationale: Rend clairement le motif exprimé par חֻמְלָה, sans ajouter de connotation théologique étrangère au contexte.
- source_word: וַתֻּשְׁלְכִי
  choice: tu as été jetée
  rationale: Respecte la forme passive du hophal et la violence concrète de l’abandon.
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: en plein champ
  rationale: Expression française naturelle qui communique l’exposition du nouveau-né dans un espace découvert.
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: tant ta vie inspirait le dégoût
  rationale: Rend גֹעַל par « dégoût » et comprend נֶפֶשׁ comme la vie ou la personne vivante du nouveau-né. La formulation conserve l’idée que l’aversion motive l’abandon, tout en signalant en note l’ambiguïté syntaxique de l’expression compacte.
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: le jour où tu es née
  rationale: Formulation directe et idiomatique qui garde l’immédiateté temporelle de l’hébreu et l’accord féminin de l’adresse.
theological_decisions: []
