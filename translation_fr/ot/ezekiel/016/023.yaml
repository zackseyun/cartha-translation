  text: וַ/יְהִ֕י אַחֲרֵ֖י כָּל רָעָתֵ֑/ךְ א֣וֹי א֣וֹי לָ֔/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/023.yaml
  text: And it came about[a], after all your wickedness—woe[b], woe to you! declares the Lord GOD—
translation:
  language: fr
  text: Et il arriva, après toute ta méchanceté — malheur, malheur à toi ! — déclare le Seigneur Yahweh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Puis
  rationale: La forme narrative marque ici une nouvelle étape du discours. « Puis » rend cette transition avec naturel en français moderne, tandis que la phrase reste suspendue vers la suite.
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  choice: après toute ta méchanceté
  rationale: « Après » conserve la valeur temporelle de אַחֲרֵי, « toute » la portée globale de כָּל, et « méchanceté » exprime ici le mal moral visé par רָעָה.
- source_word: אוֹי אוֹי לָךְ
  choice: malheur, malheur à toi !
  rationale: La répétition est conservée afin de rendre l'intensité de cette exclamation prophétique, qui associe lamentation et jugement.
- source_word: נְאֻם
  choice: déclare
  rationale: Dans la formule prophétique, « déclare » rend idiomatiquement l'annonce solennelle d'une parole divine.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, tout en évitant l'enchaînement artificiel « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au tétragramme יהוה. Le rendu retenu distingue le titre du nom propre et préserve directement le nom divin sans introduire une interprétation confessionnelle supplémentaire.
- issue: Valeur de la double exclamation אוֹי אוֹי
  choice: malheur, malheur à toi !
  alternative: hélas, hélas pour toi !
  rationale: « Malheur » maintient la tension entre lamentation et annonce de jugement; « hélas » ferait davantage pencher le propos vers la seule plainte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe volontairement inachevée et la virgule finale reflètent le fait que le verset hébreu ouvre une parenthèse prophétique avant la poursuite de la phrase aux versets suivants.
