source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur, l’Éternel : Parce que ton bronze a été répandu[a], parce que ta nudité a été dévoilée dans tes prostitutions avec tes amants, à cause de toutes tes idoles abominables[b] et du sang de tes enfants que tu leur as donnés[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « puisque tes richesses ont été prodiguées ». Littéralement : « puisque ton bronze a été répandu ». L’image peut évoquer des biens dilapidés au profit des amants idolâtres; certains y voient plus largement une évocation obscène de la débauche.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « idoles » est une désignation particulièrement méprisante; littéralement, l’expression signifie « les idoles de tes abominations ».
    reason: lexical_alternative
  - marker: c
    text: Tu les leur as donnés, c’est-à-dire que tu as livré tes enfants en sacrifice aux idoles.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Cette formule française distingue le titre אֲדֹנָי du nom divin יהוה tout en évitant l’enchaînement peu naturel « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit naturellement en français les motifs du jugement annoncé dans la suite de la phrase.
- source_word: הִשָּׁפֵךְ נְחֻשְׁתֵּךְ
  choice: ton bronze a été répandu
  rationale: Conserve le sens lexical ordinaire de נְחֹשֶׁת et la forme passive de שפך sans trancher une image exceptionnellement difficile; une note présente les principales interprétations contextuelles.
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: ta nudité a été dévoilée
  rationale: Préserve l’image concrète de l’exposition sexuelle et honteuse exprimée par l’hébreu.
- source_word: בְּתַזְנוּתַיִךְ
  choice: dans tes prostitutions
  rationale: Le pluriel rend la multiplicité des actes et maintient la métaphore sexuelle de l’infidélité idolâtre.
- source_word: עַל מְאַהֲבָיִךְ
  choice: avec tes amants
  rationale: Dans ce contexte sexuel, « avec » exprime idiomatiquement la relation visée par עַל sans imposer le sens spatial habituel de la préposition.
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: tes idoles abominables
  rationale: Formulation française naturelle qui conserve à la fois le référent idolâtre et le jugement fortement péjoratif des deux noms hébreux.
- source_word: וְכִדְמֵי בָנַיִךְ
  choice: et du sang de tes enfants
  rationale: La construction est comprise comme un motif supplémentaire de jugement dans l’accumulation des accusations, plutôt que comme une comparaison littérale.
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  choice: que tu leur as donnés
  rationale: Le pronom relatif renvoie naturellement aux enfants et le verbe « donner » respecte la formulation directe de נתן sans expliciter le sacrifice dans le texte principal.
theological_decisions:
- issue: Valeur métaphorique de נְחֻשְׁתֵּךְ dans le contexte de prostitution et d’idolâtrie
  choice: Conserver « ton bronze » dans le texte principal.
  alternative: « tes richesses » ou une image de débauche et d’exposition sexuelle
  rationale: Le nom désigne normalement le cuivre ou le bronze, mais sa portée exacte ici est débattue. La traduction maintient donc l’image hébraïque et signale les interprétations possibles en note au lieu d’en imposer une.
- issue: Allusion au sacrifice d’enfants
  choice: Traduire littéralement « tes enfants que tu leur as donnés ».
  alternative: « tes enfants que tu leur as sacrifiés »
  rationale: Le contexte indique un sacrifice offert aux idoles, mais le verbe hébreu signifie simplement « donner ». Le texte principal en conserve la sobriété terrible, tandis que la note explicite le contexte culturel.
translation_notes:
  register: Français international actuel, digne et direct. La structure cumulative et la virgule finale sont conservées parce que le verset introduit les motifs d’une sentence qui se poursuit au verset suivant. Le féminin singulier des formes adressées à Jérusalem est rendu par « ton/ta/tes » sans ajout explicatif.
