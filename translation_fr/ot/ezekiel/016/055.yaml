  text: וַ/אֲחוֹתַ֗יִ/ךְ סְדֹ֤ם וּ/בְנוֹתֶ֨י/הָ֙ תָּשֹׁ֣בְןָ לְ/קַדְמָתָ֔/ן וְ/שֹֽׁמְרוֹן֙ וּ/בְנוֹתֶ֔י/הָ תָּשֹׁ֖בְןָ לְ/קַדְמָתָ֑/ן וְ/אַתְּ֙ וּ/בְנוֹתַ֔יִ/ךְ תְּשֻׁבֶ֖ינָה לְ/קַדְמַתְ/כֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: fr
  text: Tes sœurs, Sodome et ses filles, reviendront à leur état d’autrefois[a] ; Samarie et ses filles reviendront à leur état d’autrefois ; et toi et tes filles, vous reviendrez à votre état d’autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront rétablies dans leur état d’autrefois ». L’hébreu dit plus littéralement « reviendront à leur état d’autrefois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: tes sœurs
  rationale: Conserve la métaphore familiale et la personnification des villes qui structurent Ézéchiel 16.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: ses filles / tes filles
  rationale: L’hébreu dit littéralement « filles ». Même si le terme peut désigner des localités dépendantes, sa traduction littérale préserve l’image familiale du chapitre.
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: reviendront / vous reviendrez
  rationale: Le verbe שׁוב signifie fondamentalement « revenir ». Cette formulation maintient sa répétition dans les trois propositions sans expliciter le mécanisme du rétablissement.
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: à leur état d’autrefois / à votre état d’autrefois
  rationale: La formule désigne ici une condition antérieure. « État d’autrefois » est à la fois fidèle et naturel en français moderne.
- source_word: וְ
  choice: et
  rationale: La coordination simple respecte l’enchaînement hébreu sans lui ajouter une nuance temporelle.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française standard du nom de lieu.
theological_decisions:
- issue: Nature du retour annoncé pour Sodome, Samarie et Jérusalem
  choice: Traduire par un retour à l’état d’autrefois sans préciser le mécanisme ni la portée théologique de ce retour.
  alternative: Traduire de façon plus interprétative par « seront rétablies dans leur état d’autrefois ».
  rationale: Le texte associe le verbe « revenir » à l’idée d’une condition antérieure. La traduction conserve cette formulation et la tension théologique du passage au lieu de définir la nature exacte du rétablissement.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement rend l’adresse féminine singulière à Jérusalem ; le passage à « vous reviendrez » inclut naturellement Jérusalem et ses filles. Les trois propositions parallèles et la métaphore familiale sont conservées.
