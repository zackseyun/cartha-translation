lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, cette tournure française exprime naturellement la venue d’une parole divine au prophète, sans calquer lourdement l’hébreu.
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message communiqué par Dieu. « La parole » conserve la formulation biblique reconnue et son lien avec la révélation directe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, « Yahweh », plutôt que remplacé par le titre traditionnel « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend avec exactitude la direction vers le prophète exprimée par אֵלַי.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit la parole divine qui suit. « En ces termes » est une formulation française naturelle et digne, équivalente à « disant » dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Le conserver sous la forme « Yahweh » fait apparaître le nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure prophétique traditionnelle tout en évitant le calque peu idiomatique « la parole vint à moi, disant ».
