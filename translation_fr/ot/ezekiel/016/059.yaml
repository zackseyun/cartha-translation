source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ו/עשית אוֹתָ֖/ךְ כַּ/אֲשֶׁ֣ר עָשִׂ֑ית אֲשֶׁר בָּזִ֥ית אָלָ֖ה לְ/הָפֵ֥ר בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : J’agirai envers toi comme tu as agi, puisque tu as méprisé le serment[a] en rompant l’alliance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la malédiction » ; le terme hébreu peut désigner un serment, notamment un serment assorti de malédictions en cas de violation de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend à la fois le titre אֲדֹנָי et le nom divin יְהוִה, sans produire l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: וְעָשִׂית אוֹתָךְ
  choice: Je te traiterai
  rationale: L’expression avec עשה et un complément de personne signifie ici « faire à » ou « traiter »; ce choix est naturel en français et conserve la portée judiciaire du contexte.
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: comme tu as agi
  rationale: Conserve la comparaison et renvoie directement à la conduite antérieure de Jérusalem, tout en évitant la répétition maladroite de « faire » en français.
- source_word: בָּזִית
  choice: tu as méprisé
  rationale: Exprime directement l’idée de tenir en mépris ou de traiter avec dédain.
- source_word: אָלָה
  choice: le serment[a]
  rationale: Dans ce contexte d’alliance, le terme désigne le serment contraignant, tout en pouvant inclure la malédiction sanctionnant sa violation; cette nuance est indiquée en note.
- source_word: לְהָפֵר בְּרִית
  choice: en rompant l’alliance
  rationale: הפר ברית est une expression courante pour la violation d’une alliance; « en rompant » exprime naturellement en français le rapport entre le mépris du serment et la rupture de l’alliance.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom divin. « Le Seigneur Yahweh » préserve les deux éléments et rend explicitement le nom d’alliance.
- issue: Sens de אָלָה dans le contexte de l’alliance
  choice: le serment
  alternative: la malédiction
  rationale: Le contexte porte sur l’engagement juré qui lie l’alliance, mais le mot peut aussi désigner la malédiction attachée au serment. La note préserve cette tension lexicale sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement féminin singulier suit l’adresse personnifiée à Jérusalem dans le contexte. La formulation conserve la structure accusatoire et judiciaire du verset.
