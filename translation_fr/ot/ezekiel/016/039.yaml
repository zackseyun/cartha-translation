  text: וְ/נָתַתִּ֨י אוֹתָ֜/ךְ בְּ/יָדָ֗/ם וְ/הָרְס֤וּ גַבֵּ/ךְ֙ וְ/נִתְּצ֣וּ רָמֹתַ֔יִ/ךְ וְ/הִפְשִׁ֤יטוּ אוֹתָ/ךְ֙ בְּגָדַ֔יִ/ךְ וְ/לָקְח֖וּ כְּלֵ֣י תִפְאַרְתֵּ֑/ךְ וְ/הִנִּיח֖וּ/ךְ עֵירֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: fr
  text: Je te livrerai entre leurs mains, et ils démoliront ton édifice voûté[a] et détruiront tes hauts lieux. Ils te dépouilleront de tes vêtements, prendront tes parures splendides[b] et te laisseront entièrement nue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton tertre », « ton sanctuaire » ou « ton arche » ; le mot hébreu est rare et semble désigner ici une construction liée au culte illicite évoqué dans ce chapitre.
    reason: lexical_alternative
  - marker: b
    text: Ou « les objets de ta splendeur » ou « tes magnifiques ornements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: Je te livrerai entre leurs mains
  rationale: La tournure française exprime naturellement la remise au pouvoir d’autrui tout en conservant l’image hébraïque des « mains ».
- source_word: וְהָרְסוּ גַבֵּךְ
  choice: ils démoliront ton édifice voûté
  rationale: הרס désigne la démolition d’une construction. Le rare גַּב est rendu prudemment comme une structure voûtée, sans en fixer davantage la fonction.
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: et détruiront tes hauts lieux
  rationale: נתץ exprime une destruction violente, tandis que רָמוֹת désigne ici les lieux de culte élevés liés à l’idolâtrie.
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדָיִךְ
  choice: Ils te dépouilleront de tes vêtements
  rationale: Cette formulation française restitue l’action de retirer les vêtements et la dimension d’humiliation publique.
- source_word: וְלָקְחוּ כְּלֵי תִפְאַרְתֵּךְ
  choice: prendront tes parures splendides
  rationale: כְּלֵי désigne des objets ou articles et תִּפְאֶרֶת leur splendeur. Dans le contexte de l’ornementation de la femme, « parures » est précis sans limiter nécessairement le référent aux seuls bijoux.
- source_word: וְהִנִּיחוּךְ עֵירֹם וְעֶרְיָה
  choice: et te laisseront entièrement nue
  rationale: Le français évite le doublon peu naturel « nue et dénudée »; « entièrement » rend l’intensification produite par les deux termes hébreux.
theological_decisions:
- issue: Langage métaphorique et cultuel présentant Jérusalem comme une femme infidèle
  choice: Conserver les images concrètes de destruction, de dépouillement et de nudité.
  alternative: Paraphraser en termes généraux de jugement, de ruine et de honte.
  rationale: La violence de l’image appartient à la rhétorique prophétique et relie l’infidélité cultuelle de Jérusalem à son humiliation; l’abstraire atténuerait le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prophétique, l’enchaînement des actions et la métaphore féminine sont maintenus. « Entièrement nue » restitue idiomatiquement le doublet hébreu final.
