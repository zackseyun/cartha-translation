  text: וַֽ/תִּשְׁחֲטִ֖י אֶת בָּנָ֑/י וַֽ/תִּתְּנִ֔י/ם בְּ/הַעֲבִ֥יר אוֹתָ֖/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/021.yaml
  text: You slaughtered my sons and gave them up to them by making them pass through the fire[a].
translation:
  language: fr
  text: Tu as égorgé mes fils et tu les leur as livrés en les faisant passer par le feu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en les faisant passer à eux ». Dans ce contexte, l’expression désigne le fait de faire passer des enfants par le feu en sacrifice aux idoles ; le mot « feu » n’apparaît pas dans cette proposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: tu as égorgé
  rationale: Le verbe שׁחט désigne couramment l’égorgement ou l’abattage, notamment dans un cadre sacrificiel. « Égorgé » conserve ici la violence et la portée cultuelle du terme.
- source_word: בָּנָי
  choice: mes fils
  rationale: L’hébreu dit explicitement « mes fils » et exprime ainsi à la fois leur sexe grammatical et la revendication divine marquée par le possessif.
- source_word: וַתִּתְּנִים
  choice: tu les leur as livrés
  rationale: נתן suivi du suffixe objet exprime ici la remise des fils aux idoles. « Livrés » rend plus naturellement en français l’idée de les abandonner à leur pouvoir que le simple « donnés ».
- source_word: בְּהַעֲבִיר אוֹתָם
  choice: en les faisant passer par le feu
  rationale: Le hiphil de עבר appliqué aux enfants constitue, dans ce contexte cultuel, une expression désignant leur passage par le feu dans un acte sacrificiel. Le feu est implicite plutôt qu’exprimé dans cette proposition, d’où la note.
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom renvoie aux idoles mentionnées dans le contexte. Le pronom français « leur » conserve ce renvoi avec une formulation naturelle.
theological_decisions:
- issue: Faut-il expliciter le feu dans l’expression « faire passer » ?
  choice: 'Le feu est explicité dans le texte principal : « en les faisant passer par le feu »'
  alternative: « en les faisant passer pour elles » ou « en les faisant passer »
  rationale: Dans Ézéchiel et les textes prophétiques apparentés, cette expression, lorsqu’elle concerne des enfants et des idoles, évoque un rite sacrificiel lié au feu. L’explicitation permet au lecteur moderne de comprendre l’accusation, tandis que la note signale honnêtement que le mot « feu » n’apparaît pas dans cette proposition.
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement féminin singulier de l’adresse à Jérusalem est rendu par « tu ». « Égorgé » maintient la brutalité et la coloration sacrificielle de l’hébreu sans recourir à un vocabulaire archaïque.
