  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: fr
  text: Ils ne prendront pour femmes ni une veuve ni une femme divorcée, mais seulement des vierges issues de la descendance de la maison d’Israël. Toutefois, ils pourront prendre pour femme une veuve dont le mari était prêtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « une veuve qui est devenue veuve d’un prêtre ».'
    reason: La formule hébraïque emploie littéralement « d’un prêtre » et est moins idiomatique que l’explicitation française « dont le mari était prêtre ».
lexical_decisions:
- source_word: אַלְמָנָה
  choice: veuve
  rationale: C’est le sens courant et précis du terme hébreu; il est conservé dans les deux parties du verset.
- source_word: גְרוּשָׁה
  choice: femme divorcée
  rationale: Le participe passif désigne une femme qui a été renvoyée par divorce. « Femme divorcée » est clair et naturel en français moderne.
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: prendre pour femmes / prendre pour femme
  rationale: Cette formulation conserve l’expression juridique hébraïque fondée sur le verbe « prendre », tout en restant compréhensible en français.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: La tournure marque une restriction et introduit la catégorie autorisée.
- source_word: בְּתוּלוֹת
  choice: vierges
  rationale: Le terme désigne spécifiquement des vierges et non simplement de jeunes femmes célibataires.
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: issues de la descendance de la maison d’Israël
  rationale: « Descendance » rend naturellement l’idée de זֶרַע, tandis que « maison d’Israël » préserve l’expression nationale et communautaire du texte.
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: Toutefois, ils pourront prendre pour femme la veuve d’un prêtre
  rationale: Le sens contextuel est qu’une veuve dont le mari défunt était prêtre constitue l’exception permise. « Pourront » explicite la valeur permissive de l’exception sans transformer la disposition en obligation.
- source_word: מִן dans מִכֹּהֵן
  choice: d’un prêtre
  rationale: La préposition signifie littéralement « de/depuis »; ici, elle indique la relation à l’époux prêtre dont la femme est devenue veuve. Le français l’exprime naturellement par « la veuve d’un prêtre ».
theological_decisions:
- issue: Portée de la règle matrimoniale dans la vision du temple
  choice: Présenter le verset comme une disposition concernant les prêtres dans ce contexte, sans lui ajouter de conclusion doctrinale ou morale ultérieure.
  alternative: En faire une règle matrimoniale universelle et intemporelle, ou atténuer l’interdiction en simple préférence.
  rationale: Le passage appartient aux prescriptions sacerdotales de la vision d’Ézéchiel. La traduction conserve donc l’interdiction et l’exception telles qu’elles sont formulées, sans en élargir ni en réduire la portée.
- issue: Valeur de la dernière proposition
  choice: 'La rendre comme une permission: « ils pourront prendre pour femme ».'
  alternative: 'La rendre comme une obligation littérale: « ils prendront » ou « ils doivent prendre ».'
  rationale: Dans la structure restrictive du verset, la dernière proposition énonce une catégorie autorisée. Le futur hébreu prend ici naturellement une valeur permissive dans le cadre législatif.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton juridique du passage grâce à « prendre pour femme », tout en évitant les archaïsmes. Le marqueur de note est placé sur la proposition qu’il explique.
