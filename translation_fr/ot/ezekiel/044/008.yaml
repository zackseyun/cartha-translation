revisions:
- from: Vous n’avez pas veillé sur ce qui m’est consacré, mais vous avez désigné des gens pour assurer à votre place[a] le service de mon sanctuaire.
  to: Vous n’avez pas assumé la charge de ce qui m’est consacré, mais vous avez désigné des personnes pour assumer ma charge dans mon sanctuaire, pour vous[a].
  rationale: La révision maintient la portée large de « ce qui m’est consacré », rend les deux emplois de מִשְׁמֶרֶת par « charge », et restitue la relation « ma charge dans mon sanctuaire ». Elle évite d’imposer dans le texte la lecture substitutionnelle de לָכֶם, tout en la conservant en note comme interprétation contextuellement plausible.
