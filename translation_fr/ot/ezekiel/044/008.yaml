source:
  edition: WLC
  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: fr
  text: Vous n’avez pas assumé la charge de ce qui m’est consacré, mais vous avez désigné des personnes pour assumer ma charge dans mon sanctuaire, pour vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à votre place », c’est-à-dire en assumant la charge que vous aviez délaissée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: vous n’avez pas veillé sur
  rationale: L’association de שׁמר et מִשְׁמֶרֶת exprime l’accomplissement fidèle d’une responsabilité confiée. « Veiller sur » restitue cette idée dans un français naturel sans la réduire à une garde physique.
- source_word: קָדָשָׁי
  choice: ce qui m’est consacré
  rationale: Le pluriel hébreu peut englober les objets, les rites et les responsabilités sacrés. Cette formulation française conserve cette portée large sans la limiter aux seuls objets saints.
- source_word: וַתְּשִׂימוּן
  choice: vous avez désigné
  rationale: Le verbe שׂים signifie littéralement « placer » ou « établir » ; dans ce contexte d’attribution d’une fonction cultuelle, « désigner » exprime naturellement son sens fonctionnel.
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: des gens pour assurer […] le service
  rationale: Le participe et le nom apparentés décrivent des personnes chargées d’une responsabilité dans le sanctuaire. « Assurer le service » évite une répétition lourde en français tout en gardant le sens cultuel et administratif.
- source_word: בְּמִקְדָּשִׁי
  choice: de mon sanctuaire
  rationale: מִקְדָּשׁ désigne ici le lieu saint et ses dépendances cultuelles. « Sanctuaire » est plus précis que « temple » dans ce contexte.
- source_word: לָכֶם
  choice: à votre place
  rationale: Dans le contexte du reproche, la préposition indique vraisemblablement que les personnes désignées accomplissaient le service à la place des destinataires. La note conserve la traduction plus littérale et ambiguë « pour vous ».
theological_decisions:
- issue: Portée de « ce qui m’est consacré »
  choice: Référence large aux réalités, rites et responsabilités sacrés du sanctuaire
  alternative: Référence limitée aux objets saints, ou au seul office sacré
  rationale: L’expression hébraïque est large. La traduction ne précise pas davantage afin de préserver l’étendue possible du reproche.
- issue: Valeur de לָכֶם
  choice: à votre place
  alternative: pour vous, en votre faveur ou pour votre compte
  rationale: Le contexte souligne que d’autres ont assumé la charge délaissée par les destinataires, mais la construction hébraïque reste concise et peut littéralement se rendre par « pour vous » ; cette possibilité est signalée en note.
translation_notes:
  register: 'Français moderne, international et digne. La formulation privilégie une équivalence optimale : elle conserve la portée générale du vocabulaire sacré et la nuance de responsabilité cultuelle, tout en évitant les calques peu naturels comme « garder la garde ».'
