source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: fr
  text: Ils ne s’approcheront d’aucun mort et ne se rendront pas impurs. Toutefois, ils pourront se rendre impurs pour leur père ou leur mère, leur fils ou leur fille, leur frère ou leur sœur qui n’a pas été mariée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’a pas été à un homme » ; c’est-à-dire qui n’a pas eu de mari.'
    reason: La note préserve la forme relationnelle de l’hébreu tout en explicitant son sens idiomatique.
lexical_decisions:
- source_word: מֵת אָדָם
  choice: aucun mort
  rationale: L’expression désigne ici une personne morte, dans le contexte de l’impureté rituelle liée à un décès. « Mort » est naturel en français et n’impose pas que la personne décédée soit de sexe masculin.
- source_word: יָבֹוא אֶל
  choice: s’approcher de
  rationale: Dans ce contexte sacerdotal, l’expression vise le fait de s’approcher d’un mort et de contracter ainsi une impureté, plutôt que le simple fait d’arriver en un lieu.
- source_word: לְטָמְאָה
  choice: afin de ne pas se rendre impurs
  rationale: L’infinitif indique le résultat ou la finalité de l’approche interdite. La négation de la proposition principale est exprimée naturellement en français dans la subordonnée finale.
- source_word: כִּי אִם
  choice: toutefois
  rationale: Le syntagme introduit les exceptions à l’interdiction. « Toutefois » marque clairement ce contraste en français courant et soutenu.
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: pour leur père ou leur mère, leur fils ou leur fille, leur frère ou leur sœur
  rationale: Le לְ introduit les proches à l’occasion de la mort desquels l’impureté est permise. Les possessifs, implicites en hébreu, sont nécessaires à une formulation française naturelle et claire.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: qui n’a pas été mariée
  rationale: L’expression hébraïque signifie littéralement qu’elle « n’a pas été à/pour un homme » et désigne naturellement une sœur qui n’a pas été rattachée à un mari. La note conserve le tour plus littéral.
- source_word: יִטַּמָּאוּ
  choice: ils pourront se rendre impurs
  rationale: Dans cette règle juridique, l’imparfait exprime une permission accordée dans les cas d’exception, et non une obligation.
theological_decisions:
- issue: Valeur juridique de יִטַּמָּאוּ
  choice: permission (« ils pourront se rendre impurs »)
  alternative: injonction (« ils se rendront impurs ») ou simple futur
  rationale: La proposition énumère des exceptions à une interdiction. Le sens permissif respecte cette structure sans transformer l’autorisation en commandement.
- issue: Sens de la proposition concernant la sœur אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: une sœur qui n’a pas été mariée
  alternative: une sœur vierge ; une sœur qui n’a pas appartenu à un homme
  rationale: Le tour hébraïque renvoie le plus naturellement à l’absence de lien matrimonial. « Vierge » serait plus précis que le texte, tandis qu’« appartenir » pourrait suggérer en français une conception de propriété étrangère à la visée immédiate du passage.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le vocabulaire rituel de l’impureté, rend explicitement la portée permissive de la dernière forme verbale et évite une traduction inutilement masculine de אָדָם.
