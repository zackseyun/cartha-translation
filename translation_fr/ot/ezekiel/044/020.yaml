source:
  edition: WLC
  text: וְ/רֹאשָׁ/ם֙ לֹ֣א יְגַלֵּ֔חוּ וּ/פֶ֖רַע לֹ֣א יְשַׁלֵּ֑חוּ כָּס֥וֹם יִכְסְמ֖וּ אֶת רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/020.yaml
  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
translation:
  language: fr
  text: Ils ne se raseront pas la tête et ne laisseront pas pousser leurs cheveux ; ils tailleront soigneusement les cheveux de leur tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils garderont les cheveux de leur tête bien taillés ». L’expression hébraïque de la dernière proposition est concise et peut être rendue de plusieurs manières proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: se raseront
  rationale: Le piel de גלח désigne ici le fait de raser la tête. « Se raser la tête » est naturel en français et exprime l'interdiction de la raser entièrement.
- source_word: פֶרַע ... יְשַׁלֵּחוּ
  choice: ne laisseront pas pousser librement leurs cheveux
  rationale: L'expression évoque une chevelure laissée sans contrainte, longue ou non entretenue. « Pousser librement » conserve cette nuance sans limiter indûment le sens à la seule longueur.
- source_word: כָּסוֹם יִכְסְמוּ
  choice: devront les tailler régulièrement
  rationale: L'infinitif absolu suivi du verbe conjugué souligne l'obligation de tailler la chevelure. « Devraient » serait trop faible ; « devront » rend la force de la construction, tandis que « régulièrement » explicite l'idée d'une coupe entretenue suggérée par le contexte.
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: la tête / les [cheveux]
  rationale: Le français dit naturellement « se raser la tête ». Dans la dernière proposition, le pronom « les » reprend clairement « leurs cheveux » et évite l'expression impropre « tailler leurs têtes ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et réglementaire, tout en évitant un calque peu naturel de l'hébreu. Le marqueur de note est placé après la proposition qu'il éclaire.
