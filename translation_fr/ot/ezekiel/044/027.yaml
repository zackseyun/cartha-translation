id: EZK.44.27
reference: Ezekiel 44:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/יוֹם֩ בֹּא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ אֶל הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ יַקְרִ֖יב חַטָּאת֑/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: fr
  text: Et le jour où il entrera dans le sanctuaire, dans la cour intérieure, pour accomplir son service dans le sanctuaire, il présentera son sacrifice pour le péché[a] — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son sacrifice de purification ». Dans les contextes sacrificiels, le mot hébreu חַטָּאת peut désigner le sacrifice lié au péché et à la purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם בֹּאוֹ
  choice: Et le jour où il entrera
  rationale: La construction avec l’infinitif et son suffixe a une valeur temporelle. Le futur convient au contexte prescriptif, tandis que « Et » maintient le lien avec les dispositions précédentes.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: קֹדֶשׁ désigne ici l’espace sacré. « Sanctuaire » est naturel en français et n’impose pas une délimitation architecturale plus précise que l’hébreu.
- source_word: אֶל־הֶחָצֵר הַפְּנִימִית
  choice: dans la cour intérieure
  rationale: Le second אֶל précise vraisemblablement la destination mentionnée juste avant. La répétition de « dans » conserve cette apposition sans la résoudre explicitement.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: pour accomplir son service dans le sanctuaire
  rationale: Dans ce contexte sacerdotal, שׁרת désigne un service cultuel. Cette formulation est claire et digne, sans introduire un vocabulaire confessionnel particulier.
- source_word: יַקְרִיב
  choice: il présentera
  rationale: Le hiphil de קרב signifie ici présenter une offrande. « Présentera » restitue bien le geste cultuel et évite la répétition contenue dans « offrir son offrande ».
- source_word: חַטָּאתוֹ
  choice: son sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חַטָּאת désigne nécessairement un sacrifice associé au péché ou à la purification. La traduction principale retient la désignation française traditionnelle, et l’autre nuance est signalée en note.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם introduit une formule divine solennelle. « Yahweh » représente directement le nom divin יהוה, tandis que « Seigneur » rend אֲדֹנָי.
theological_decisions:
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en avant soit le rapport au péché, soit la fonction purificatrice du rite. Le texte principal emploie la formulation la plus immédiatement reconnaissable, sans exclure l’autre analyse, conservée en note.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La combinaison hébraïque contient à la fois le titre אֲדֹנָי et le nom propre יהוה. Les rendre distinctement préserve cette structure et évite de masquer le nom divin.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe conserve la répétition de « sanctuaire » et l’enchaînement appositionnel avec « la cour intérieure », afin de ne pas éliminer une possible ambiguïté spatiale du texte hébreu.
