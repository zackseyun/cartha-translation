source:
  edition: WLC
  text: וְ/רֵאשִׁית֩ כָּל בִּכּ֨וּרֵי כֹ֜ל וְ/כָל תְּר֣וּמַת כֹּ֗ל מִ/כֹּל֙ תְּרוּמ֣וֹתֵי/כֶ֔ם לַ/כֹּהֲנִ֖ים יִֽהְיֶ֑ה וְ/רֵאשִׁ֤ית עֲרִסֽוֹתֵי/כֶם֙ תִּתְּנ֣וּ לַ/כֹּהֵ֔ן לְ/הָנִ֥יחַ בְּרָכָ֖ה אֶל בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: fr
  text: La première part de toutes les prémices, quelles qu’elles soient, ainsi que toute contribution parmi toutes vos contributions[a], appartiendra aux prêtres. Vous donnerez au prêtre la première part de votre pâte[b], afin qu’une bénédiction repose sur votre maison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute offrande parmi toutes vos offrandes ». Le terme hébreu désigne une part prélevée et consacrée à un usage sacré.
    reason: lexical_alternative
  - marker: b
    text: Ou « la première part de votre pâte pétrie » ; le terme hébreu peut désigner la pâte ou, par extension, la quantité en cours de pétrissage.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire afin que la bénédiction repose sur votre foyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית / בִּכּוּרֵי
  choice: la première part / les prémices
  rationale: רֵאשִׁית désigne ici la première part, tandis que בִּכּוּרֵי est le terme cultuel pour les prémices. La formulation conserve la superposition des deux termes hébreux sans la réduire à un seul.
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: contribution / vos contributions
  rationale: תְּרוּמָה désigne une part prélevée et consacrée. « Contribution » rend cette idée en français actuel, tout en conservant la relation entre le singulier et le pluriel du texte hébreu.
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: appartiendra aux prêtres
  rationale: Cette formulation exprime naturellement en français l’attribution légale indiquée par l’hébreu.
- source_word: עֲרִסוֹתֵיכֶם
  choice: votre pâte
  rationale: Dans ce contexte d’offrande, le mot renvoie à la pâte, ou par extension à la fournée en cours de pétrissage, plutôt qu’au récipient lui-même.
- source_word: תִּתְּנוּ לַכֹּהֵן
  choice: vous donnerez au prêtre
  rationale: Le verbe est à la deuxième personne du pluriel et le bénéficiaire est au singulier collectif, distinction que la traduction préserve.
- source_word: לְהָנִיחַ בְּרָכָה אֶל בֵּיתֶךָ
  choice: afin qu’une bénédiction repose sur votre maison
  rationale: Le causatif de נוח exprime le fait de faire reposer ou demeurer la bénédiction. « Maison » conserve l’image concrète de l’hébreu tout en pouvant désigner le foyer.
theological_decisions:
- issue: Nature de la bénédiction promise au foyer
  choice: Conserver le terme général « bénédiction » sans en préciser la forme
  alternative: Interpréter explicitement la bénédiction comme une prospérité matérielle ou comme une faveur exclusivement spirituelle
  rationale: L’hébreu ne précise pas la nature de la bénédiction. La traduction maintient cette ampleur théologique et le lien exprimé entre le don et la bénédiction, sans le systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. La structure cultuelle et juridique du verset est conservée, tout en évitant des termes techniques ou archaïques comme « offrande élevée ». Le futur rend l’instruction normative de manière naturelle.
