  text: וְ/יַ֥יִן לֹֽא יִשְׁתּ֖וּ כָּל כֹּהֵ֑ן בְּ/בוֹאָ֖/ם אֶל הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/021.yaml
  text: No priest shall drink wine when entering the inner court[a].
translation:
  language: fr
  text: Aucun prêtre ne boira de vin lorsqu’il entrera dans la cour intérieure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: de vin
  rationale: יַיִן désigne directement le vin. La conjonction initiale וְ n’est pas rendue séparément, car le verset formule naturellement une interdiction autonome en français.
- source_word: לֹא יִשְׁתּוּ
  choice: ne boira
  rationale: Dans ce contexte légal, la négation avec l’imparfait exprime une interdiction. Le futur négatif français en restitue clairement la portée normative.
- source_word: כָּל כֹּהֵן
  choice: Aucun prêtre
  rationale: Littéralement « tout prêtre », mais sous la négation la tournure française « aucun prêtre » exprime naturellement la portée universelle de l’interdiction.
- source_word: בְּ/בוֹאָ/ם
  choice: lorsqu’il entrera
  rationale: La préposition avec l’infinitif construit et le suffixe pluriel signifie « lors de leur entrée » ou « quand ils entreront ». Le singulier français s’accorde avec « aucun prêtre » tout en conservant le sens collectif de la règle.
- source_word: אֶל הֶ/חָצֵר הַ/פְּנִימִית
  choice: dans la cour intérieure
  rationale: אֶל marque ici le mouvement vers l’intérieur, rendu idiomatiquement par « entrer dans ». חָצֵר désigne la cour, et הַפְּנִימִית la qualifie d’intérieure.
