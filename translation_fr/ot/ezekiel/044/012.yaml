source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: fr
  text: Parce qu’ils les[a] ont servis devant leurs idoles et sont devenus, pour la maison d’Israël, une pierre d’achoppement, source de faute, c’est pourquoi j’ai levé ma main contre eux[b] — déclaration du Seigneur Yahweh —, et ils porteront leur faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « les » est condensé en hébreu : il peut désigner les personnes associées aux idoles ou, selon le sens, les idoles elles-mêmes.'
    reason: alternative_reading
  - marker: b
    text: 'Expression hébraïque : « lever ma main contre eux ». Le geste peut marquer un serment solennel ou une action judiciaire ; ici, le contexte exprime une déclaration de jugement contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Introduit explicitement la cause du jugement et s’intègre naturellement à la reprise « j’ai donc ».
- source_word: יְשָׁרְתוּ אוֹתָם
  choice: ils les ont servis
  rationale: Préserve le sens cultuel de שׁרת ainsi que le pronom objet, dont le référent reste condensé et quelque peu ambigu en hébreu.
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: devant leurs idoles
  rationale: Rend le sens spatial de לִפְנֵי et le référent clair de גִּלּוּלִים. Le caractère péjoratif propre au terme d’Ézéchiel n’est pas reproduit par une expression française artificielle telle que « idoles excrémentielles ».
- source_word: וְהָיוּ לְבֵית יִשְׂרָאֵל לְמִכְשׁוֹל עָוֺן
  choice: ils sont devenus pour la maison d’Israël une cause de chute dans la faute
  rationale: Conserve la métaphore de la chute tout en exprimant naturellement en français le rôle joué auprès de la collectivité appelée « maison d’Israël ».
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: j’ai levé la main contre eux
  rationale: Préserve le geste idiomatique hébreu et sa force hostile ou judiciaire sans trancher entièrement entre serment solennel et action de jugement.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: Rend la formule prophétique נְאֻם et conserve le nom divin Yahweh, tout en distinguant אֲדֹנָי par « Seigneur ».
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: ils porteront le poids de leur faute
  rationale: Exprime l’idée de porter sa culpabilité et ses conséquences, sans réduire עָוֺן à la seule peine judiciaire.
theological_decisions:
- issue: Référent de אוֹתָם dans le contexte du service idolâtre
  choice: Conserver le pronom « les » et signaler son ambiguïté en note.
  alternative: Expliciter « ils ont servi les adorateurs » ou « ils ont servi les idoles ».
  rationale: L’hébreu ne désigne pas ici le référent avec assez de précision pour imposer l’une de ces deux interprétations.
- issue: Sens de לְמִכְשׁוֹל עָוֺן
  choice: une cause de chute dans la faute
  alternative: une pierre d’achoppement d’iniquité
  rationale: La formulation retenue garde la métaphore et la portée morale sans produire un calque obscur ou artificiel en français moderne.
- issue: Portée de נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: j’ai levé la main contre eux
  alternative: j’ai juré contre eux
  rationale: Le geste peut accompagner un serment solennel ou exprimer une intervention judiciaire hostile. Le texte principal préserve l’image, et la note maintient les deux nuances.
- issue: Rendu du nom divin יְהוָה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue les deux appellations du texte hébreu et conserve explicitement le nom divin.
- issue: Portée de עָוֺן dans la formule finale
  choice: le poids de leur faute
  alternative: leur culpabilité ; le châtiment de leur faute
  rationale: עָוֺן peut englober la faute, la culpabilité et les conséquences qui en découlent. « Le poids de leur faute » maintient cette ampleur sémantique.
translation_notes:
  register: Français international moderne, digne et lisible. La structure causale du verset est conservée par « Parce que… j’ai donc… ». Les métaphores hébraïques de la chute, de la main levée et du poids de la faute sont maintenues sous une forme idiomatique.
