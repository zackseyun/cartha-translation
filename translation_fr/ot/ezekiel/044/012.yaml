revisions:
- from: Parce qu’ils les ont servis devant leurs idoles[a] et qu’ils sont devenus pour la maison d’Israël une cause de chute dans la faute, j’ai donc levé la main contre eux[b] — déclaration du Seigneur Yahweh —, et ils porteront le poids de leur faute.
  to: Parce qu’ils les[a] ont servis devant leurs idoles et sont devenus, pour la maison d’Israël, une pierre d’achoppement, source de faute, c’est pourquoi j’ai levé ma main contre eux[b] — déclaration du Seigneur Yahweh —, et ils porteront leur faute.
  rationale: La révision supprime la redondance causale, restitue explicitement le possessif de « ma main », remplace une expression française moins idiomatique par une métaphore intelligible et plus proche du texte, et évite d’ajouter « poids » à l’expression finale. Les deux ambiguïtés pertinentes — le référent de « les » et la portée du geste de la main levée — restent signalées en notes.
