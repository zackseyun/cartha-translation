review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la structure causale, le service idolâtre, la formule de jugement et la conséquence finale. Cependant, « le poids de leur faute » ajoute l’image du poids, absente de נָשְׂאוּ עֲוֺנָם, et « j’ai levé la main » omet utilement évitable le possessif explicite « ma » du texte hébreu.
  naturalness: Le français est globalement lisible, mais « Parce que …, j’ai donc … » est redondant et « une cause de chute dans la faute » est moins net que la métaphore française établie de la pierre d’achoppement. « C’est pourquoi » restitue naturellement עַל־כֵּן.
  terminology: « Maison d’Israël », « idoles », « Seigneur Yahweh » et « porter leur faute » sont appropriés. « Porter leur faute » conserve l’ambivalence de עָוֺן — faute, culpabilité et conséquences — sans imposer l’image supplémentaire d’un poids. La note conserve à juste titre l’ambiguïté du pronom objet.
  issues:
  - severity: medium
    issue: Redondance causale dans « Parce que …, j’ai donc … ».
    rationale: יַל־כֵּן introduit la conséquence (« c’est pourquoi »). En français, l’ajout de « donc » après « parce que » est lourd et moins idiomatique.
  - severity: medium
    issue: « le poids de leur faute » ajoute une image non exprimée.
    rationale: Le verbe נשׂא signifie « porter », mais le substantif « poids » ne figure pas dans le texte. « Ils porteront leur faute » maintient l’expression et son ampleur sémantique.
  - severity: low
    issue: « cause de chute dans la faute » affaiblit et explicite de façon peu idiomatique la métaphore.
    rationale: מִכְשׁוֹל conserve l’image d’un obstacle ou d’une pierre d’achoppement; « pierre d’achoppement, source de faute » est à la fois clair et plus proche du tour hébreu.
  - severity: low
    issue: Le possessif de « main » n’est pas exprimé dans le texte français.
    rationale: Le suffixe de première personne dans נָשָׂאתִי יָדִי justifie « j’ai levé ma main »; cette formulation demeure naturelle dans un registre biblique moderne.
  revised_text: Parce qu’ils les[a] ont servis devant leurs idoles et sont devenus, pour la maison d’Israël, une pierre d’achoppement, source de faute, c’est pourquoi j’ai levé ma main contre eux[b] — déclaration du Seigneur Yahweh —, et ils porteront leur faute.
