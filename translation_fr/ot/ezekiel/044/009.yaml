source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Aucun étranger[a], incirconcis de cœur et de chair, n’entrera dans mon sanctuaire — aucun étranger qui se trouve parmi les Israélites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils d’un pays étranger » ; cette expression hébraïque désigne un étranger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée en français, naturelle et digne, qui conserve le ton déclaratif et autoritatif de l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יְהוִה et évite la répétition « le Seigneur, le SEIGNEUR ».
- source_word: כָּל בֶּן נֵכָר
  choice: Aucun étranger
  rationale: Sous la portée de la négation, כָּל prend ici le sens de « aucun ». L’expression idiomatique בֶּן נֵכָר désigne un étranger plutôt qu’un fils au sens littéral.
- source_word: עֶרֶל לֵב
  choice: incirconcis de cœur
  rationale: Conserve la métaphore hébraïque de l’absence de circoncision intérieure sans en expliciter théologiquement le sens.
- source_word: וְעֶרֶל בָּשָׂר
  choice: et incirconcis dans sa chair
  rationale: Maintient le parallélisme avec le cœur et la référence corporelle concrète de בָּשָׂר.
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: n’entrera dans mon sanctuaire
  rationale: Rend naturellement en français la prohibition déclarative et le mouvement vers l’intérieur du lieu saint.
- source_word: לְכָל בֶּן נֵכָר
  choice: — aucun étranger
  rationale: Le tiret et la reprise nominale rendent la construction récapitulative et emphatique de l’hébreu sans tenter de corriger sa tension syntaxique.
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: qui se trouve au milieu des Israélites
  rationale: « Israélites » exprime naturellement la valeur collective de « fils d’Israël » dans ce contexte, tandis que « au milieu de » préserve la nuance spatiale et communautaire de בְּתוֹךְ.
theological_decisions:
- issue: Portée de l’exclusion visant l’étranger
  choice: La traduction rattache « incirconcis de cœur et incirconcis dans sa chair » à « étranger », conformément à la syntaxe.
  alternative: Comprendre le verset comme excluant sans qualification tout étranger.
  rationale: Le texte caractérise explicitement l’étranger par une double incirconcision. La traduction conserve cette qualification sans généraliser l’interdiction au-delà de la formulation du verset.
- issue: Rendu du nom divin יְהוִה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix reproduit à la fois le titre et le nom propre divin, sans les fusionner ni produire une répétition artificielle en français.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition finale, inhabituelle en français, est conservée sous une forme ponctuée par un tiret afin de respecter l’insistance et la tension syntaxique de l’hébreu.
