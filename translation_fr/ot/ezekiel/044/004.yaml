  variant: modern international French
source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: fr
  text: 'Il me conduisit par la porte nord, devant la Maison[a]. Je regardai : voici que la gloire de Yahweh remplissait la Maison de Yahweh[b]. Et je tombai face contre terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le chemin de la porte nord ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le Temple. Le texte hébreu dit littéralement « la Maison de Yahweh » ; la traduction conserve « Maison » pour refléter le vocabulaire d’Ézéchiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me conduisit
  rationale: Le hiphil de בוא signifie littéralement « il me fit venir / m’amena ». Dans cette scène de déplacement guidé, « me conduisit » est naturel en français, tandis que « Puis » rend la progression narrative du waw.
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: par le chemin de la porte nord
  rationale: דֶּרֶךְ désigne ici l’itinéraire emprunté. Cette formulation reste proche de l’image hébraïque et préserve la possibilité contextuelle d’un passage par la porte.
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: jusqu’à la façade de la Maison
  rationale: פְּנֵי, littéralement « face de », désigne ici l’avant ou la façade. La majuscule à « Maison » signale naturellement qu’il s’agit du sanctuaire sans remplacer le terme hébreu par « Temple ».
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'Je regardai : voici que'
  rationale: 'ראה suivi de הִנֵּה introduit une perception visuelle saisissante. « Je regardai : voici que » conserve à la fois l’acte de regarder et la mise en relief solennelle.'
- source_word: מָלֵא
  choice: remplissait
  rationale: La forme prédicative exprime que la gloire occupait pleinement la Maison. L’imparfait convient à la scène constatée au moment du regard.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « Gloire » est l’équivalent établi de כָּבוֹד dans le contexte des manifestations divines; le nom propre est conservé.
- source_word: בֵּית יְהוָה
  choice: la Maison de Yahweh
  rationale: La traduction maintient le vocabulaire de בַּיִת, « maison », caractéristique de la vision d’Ézéchiel, tout en identifiant le référent par une note.
- source_word: וָאֶפֹּל אֶל פָּנַי
  choice: Alors je tombai face contre terre
  rationale: Cette expression française naturelle rend l’idiome hébreu de prosternation sans l’étrangeté possible de « tomber sur mon visage ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le rend directement plutôt que de lui substituer un titre.
- issue: Rendu de הַבַּיִת / בֵּית יְהוָה dans la vision du sanctuaire
  choice: la Maison / la Maison de Yahweh
  alternative: le Temple / le Temple de Yahweh
  rationale: « Maison » préserve le lexique concret et répété d’Ézéchiel. Une note précise qu’il s’agit du Temple, sans effacer le choix lexical de l’hébreu.
- issue: Valeur de la prosternation finale
  choice: je tombai face contre terre
  alternative: je me prosternai
  rationale: La traduction garde l’action corporelle explicitement décrite et ne précise pas davantage son interprétation intérieure.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit; « voici que » garde la solennité de הִנֵּה sans archaïsme excessif. « Face contre terre » est idiomatique et clair.
