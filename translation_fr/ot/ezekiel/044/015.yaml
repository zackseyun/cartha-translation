    rationale: Le verbe שׁמר, avec מִשׁמרת, exprime l’observance fidèle d’une charge ou responsabilité assignée. « Assurer le service » décrit l’activité sacerdotale, mais omet l’idée explicite de garder cette charge.
  - severity: low
    issue: La séparation en deux phrases affaiblit la coordination des actions sacerdotales.
    rationale: L’hébreu enchaîne l’approche, le service, la station devant Dieu et l’offrande. Les conserver dans une même phrase rend plus clairement leur unité.
