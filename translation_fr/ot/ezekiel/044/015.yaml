source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Mais les prêtres lévites[a], fils de Tsadok, qui ont gardé la charge de mon sanctuaire lorsque les fils d’Israël[b] se sont détournés de moi, eux s’approcheront de moi pour me servir et se tiendront devant moi pour m’offrir la graisse et le sang — déclaration du Seigneur Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prêtres, les lévites ». L’hébreu peut être compris comme une apposition.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire « les Israélites » ou « le peuple d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « le Seigneur YHWH » ; « Yahweh » transcrit ici le nom divin.
    reason: divine_name
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: Mais les prêtres lévites
  rationale: « Mais » marque naturellement le contraste avec les lévites infidèles évoqués auparavant. « Prêtres lévites » est fluide en français tout en conservant l’identification cultuelle; la lecture appositionnelle est signalée en note.
- source_word: בְּנֵי צָדוֹק
  choice: fils de Tsadok
  rationale: La formulation garde l’expression généalogique de l’hébreu; dans ce contexte, elle désigne la lignée sacerdotale issue de Tsadok.
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: ont assuré le service de mon sanctuaire
  rationale: מִשְׁמֶרֶת désigne ici une charge ou une responsabilité sacerdotale. « Assurer le service » exprime cette fidélité à la fonction plus naturellement que le calque « garder la garde ».
- source_word: בִּתְעוֹת ... מֵעָלַי
  choice: lorsque ... se sont détournés de moi
  rationale: La construction infinitive situe les circonstances. « Se détourner de moi » rend clairement la déviation religieuse et relationnelle exprimée par תעה avec מֵעַל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le rendu formel préserve l’expression collective et généalogique du texte; des équivalents français plus idiomatiques figurent en note.
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: eux s’approcheront de moi
  rationale: Le pronom autonome הֵמָּה est rendu par « eux » pour préserver son emphase contrastive. « S’approcher » conserve la résonance cultuelle de קרב.
- source_word: לְשָׁרְתֵנִי
  choice: pour me servir
  rationale: Dans le contexte sacerdotal, שׁרת désigne le service cultuel. « Me servir » est actuel, clair et digne, sans limiter artificiellement le sens au seul ministère liturgique.
- source_word: וְעָמְדוּ לְפָנַי
  choice: Ils se tiendront devant moi
  rationale: La traduction conserve la posture de présence et de disponibilité sacerdotale devant Dieu.
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: pour m’offrir la graisse et le sang
  rationale: Le hiphil de קרב signifie ici présenter en offrande. Les articles sont naturels en français et désignent les éléments sacrificiels concernés.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יהוה et évite l’expression artificielle « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Identification des prêtres comme lévites
  choice: les prêtres lévites
  alternative: les prêtres, les lévites
  rationale: La syntaxe hébraïque permet une lecture appositionnelle. Le texte principal adopte l’expression française la plus naturelle sans exclure l’autre analyse, conservée en note.
- issue: Portée collective de « fils d’Israël »
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le choix préserve l’imagerie de filiation du texte source. La note indique que l’expression fonctionne collectivement et ne vise pas seulement les hommes.
- issue: Rendu du titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix rend séparément le titre « Seigneur » et le nom divin Yahweh. Il évite de masquer le tétragramme tout en préservant le caractère composé du titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire sacerdotal, l’emphase de הֵמָּה et les expressions de filiation, tout en évitant les calques hébraïques peu naturels.
