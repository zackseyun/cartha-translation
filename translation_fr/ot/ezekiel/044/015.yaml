review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris le contraste introduit par « Mais », l’emphase de « eux », la fonction sacerdotale de l’approche et l’offrande de la graisse et du sang. Toutefois, « ont assuré le service de mon sanctuaire » atténue la notion de garder/observer une charge confiée (מִשְׁמֶרֶת).
  naturalness: Le français est globalement naturel et de registre biblique moderne. Une seule phrase pour les actions coordonnées (« s’approcheront ... et se tiendront ») reflète plus directement la syntaxe et le mouvement du texte hébreu.
  terminology: « Prêtres lévites », « fils de Tsadok », « sanctuaire », « graisse et sang » et « Seigneur Yahweh » conviennent. « Gardé la charge de mon sanctuaire » est plus précis pour le vocabulaire cultuel que « assuré le service ».
