- from: Mais les prêtres lévites[a], fils de Tsadok, qui ont assuré le service de mon sanctuaire lorsque les fils d’Israël[b] se sont détournés de moi, eux s’approcheront de moi pour me servir. Ils se tiendront devant moi pour m’offrir la graisse et le sang — déclaration du Seigneur Yahweh[c].
  to: Mais les prêtres lévites[a], fils de Tsadok, qui ont gardé la charge de mon sanctuaire lorsque les fils d’Israël[b] se sont détournés de moi, eux s’approcheront de moi pour me servir et se tiendront devant moi pour m’offrir la graisse et le sang — déclaration du Seigneur Yahweh[c].
  rationale: La révision rétablit la notion de charge gardée/observée, propre au vocabulaire sacerdotal hébreu, et conserve dans une même phrase la succession coordonnée des fonctions sacerdotales. Les notes et leurs ancres restent cohérentes avec le texte révisé.
