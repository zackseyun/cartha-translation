  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: fr
  text: Cependant, je les affecterai à la garde de la Maison[a], pour tout son service et pour tout ce qui s’y fera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Temple ». L’hébreu dit « la Maison », désignation courante du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם
  choice: Cependant, je les chargerai
  rationale: Le verbe נתן signifie littéralement « donner, placer », mais avec la fonction qui suit, il exprime ici l’affectation à une responsabilité. « Cependant » rend la valeur adversative de la conjonction dans le contexte du jugement précédent.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת
  choice: de veiller au service de la Maison
  rationale: La construction associant le participe שׁמר au nom apparenté משמרת désigne une responsabilité confiée et surveillée. Cette formulation française conserve l’idée de garde et de charge sans calquer lourdement l’hébreu.
- source_word: הַבָּיִת
  choice: la Maison
  rationale: בית signifie littéralement « maison » et désigne ici le temple. La majuscule signale naturellement en français ce référent cultuel, tandis que la note explicite le sens.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: pour tout le travail qui s’y fait
  rationale: עֲבֹדָה peut désigner le travail ou le service, y compris cultuel. La formulation reste large et rattache clairement le suffixe au temple.
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בּוֹ
  choice: et pour tout ce qui doit y être accompli
  rationale: La construction passive à l’imparfait englobe tout ce qui est ou doit être fait dans la Maison; « doit y être accompli » rend ici la portée fonctionnelle prospective sans préciser indûment les tâches.
theological_decisions:
- issue: Référent de « la Maison »
  choice: Le temple de la vision d’Ézéchiel, rendu littéralement par « la Maison »
  alternative: « le Temple »
  rationale: Le contexte porte sur les fonctions lévitiques dans le temple visionnaire. Garder « Maison » préserve l’expression hébraïque et sa résonance, tandis qu’une note indique clairement le référent.
translation_notes:
  register: Français moderne, international et digne. La phrase privilégie une équivalence optimale, avec une syntaxe fluide et un vocabulaire accessible, tout en conservant l’appellation hébraïque « la Maison ».
