revisions:
- from: Cependant, je les chargerai de veiller au service de la Maison[a], pour tout le travail qui s’y fait et pour tout ce qui doit y être accompli.
  to: Cependant, je les affecterai à la garde de la Maison[a], pour tout son service et pour tout ce qui s’y fera.
  rationale: La révision remplace la périphrase « veiller au service » par « affecter à la garde », qui rend plus directement l’affectation à une charge de garde. Elle restitue עֲבֹדָתוֹ par « son service » et rend le passif imparfait sans la nuance non textuelle d’obligation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:00Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « tout ce qui doit y être accompli » introduit une nuance d’obligation (« doit ») qui n’est pas exprimée par l’imparfait passif hébreu יֵעָשֶׂה (« se fera / est fait »). Le texte révisé rend la fonction de garde confiée aux lévites, le service de la Maison et l’ensemble des activités qui s’y déroulent, sans ajout modal.
  naturalness: « Je les affecterai à la garde de la Maison » est naturel en français moderne et exprime clairement une désignation à une responsabilité. La coordination « pour tout son service et pour tout ce qui s’y fera » est fluide et évite la répétition lourde ainsi que l’ambiguïté de « le travail qui s’y fait ».
  terminology: « Maison » conserve le terme hébreu בַּיִת dans son emploi cultuel; la note indique correctement l’alternative « Temple ». « Garde » rend de façon idiomatique la construction שֹׁמְרֵי מִשְׁמֶרֶת sans surinterprétation cultuelle ou doctrinale.
  issues:
  - severity: medium
    issue: Ajout de modalité dans « doit y être accompli »
    rationale: יִֵעָשֶׂה est un imparfait passif qui décrit ce qui se fait ou se fera dans la Maison; il n’exprime pas en lui-même une nécessité ou une obligation.
  - severity: low
    issue: Rendu imprécis et redondant des deux compléments finaux
    rationale: « pour tout le travail qui s’y fait et pour tout ce qui doit y être accompli » rapproche excessivement עֲבֹדָתוֹ (« son service ») et « tout ce qui se fera en elle », tout en ajoutant la modalité de « doit ». La révision conserve leur distinction.
  revised_text: Cependant, je les affecterai à la garde de la Maison[a], pour tout son service et pour tout ce qui s’y fera.
  revised_footnotes:
  - marker: a
    text: Ou « du Temple ». L’hébreu dit « la Maison », désignation courante du temple.
    reason: lexical_alternative
  revision_rationale: La révision remplace la périphrase « veiller au service » par « affecter à la garde », qui rend plus directement l’affectation à une charge de garde. Elle restitue עֲבֹדָתוֹ par « son service » et rend le passif imparfait sans la nuance non textuelle d’obligation.
