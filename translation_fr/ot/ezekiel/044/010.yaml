  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: fr
  text: Mais les Lévites qui se sont éloignés de moi quand Israël s’est égaré, ceux qui se sont égarés loin de moi en suivant leurs idoles, porteront leur faute[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « porteront leur culpabilité » ou « subiront la peine de leur faute » ; elle peut désigner à la fois la culpabilité et les conséquences qui en découlent.
    reason: ambiguïté lexicale de l’expression נשׂא עון
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans le contexte, l’expression introduit un contraste avec les dispositions précédentes. « Mais » le rend naturellement en français.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: L’hébreu désigne précisément les Lévites, distingués dans le contexte des prêtres descendants de Tsadok.
- source_word: רָחֲקוּ מֵעָלַי
  choice: se sont éloignés de moi
  rationale: Cette formulation conserve l’image d’un éloignement tout en exprimant naturellement la rupture de fidélité.
- source_word: בִּתְעוֹת יִשְׂרָאֵל
  choice: quand Israël s’est égaré
  rationale: La préposition avec l’infinitif indique ici la circonstance temporelle. La formulation est idiomatique et garde le sens moral et religieux du verbe.
- source_word: תָּעוּ מֵעָלַי
  choice: se sont égarés loin de moi
  rationale: La répétition de « se sont égarés » reproduit celle de la racine hébraïque, tandis que « loin de moi » maintient l’idée de séparation exprimée par מֵעָלַי.
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: en suivant leurs idoles
  rationale: « En suivant » rend clairement le sens de אַחֲרֵי dans un contexte d’allégeance religieuse. « Idoles » est le terme français courant, même si le mot hébreu est fortement méprisant.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: porteront le poids de leur faute
  rationale: Cette formulation conserve la métaphore de « porter » et laisse entendre à la fois la culpabilité et ses conséquences, sans réduire l’expression à la seule peine.
theological_decisions:
- issue: Sens de l’expression de jugement וְנָשְׂאוּ עֲוֺנָם
  choice: porteront le poids de leur faute
  alternative: subiront la peine de leur faute ; porteront leur culpabilité
  rationale: L’expression hébraïque peut englober la faute, la culpabilité et la sanction qui en résulte. Le texte principal conserve cette tension, et la note l’explicite sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français moderne, international et digne. La répétition de « se sont égarés » reflète volontairement celle de l’hébreu. « Le poids de leur faute » reste accessible tout en préservant l’image et l’ambiguïté de l’expression source.
