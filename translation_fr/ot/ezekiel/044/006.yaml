  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: fr
  text: 'Tu diras à la maison rebelle[a], à la maison d’Israël : « Ainsi parle le Seigneur Yahweh : Assez de toutes vos abominations, maison d’Israël ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « à la rébellion » ; le nom peut être compris abstraitement, ou par métonymie comme désignant collectivement « la maison rebelle » ou « le peuple rebelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  choice: la rebelle
  rationale: Le nom singulier peut désigner la rébellion ou, par métonymie, une entité rebelle. Ici, l’apposition « à la maison d’Israël » indique que celle-ci est interpellée collectivement comme « la rebelle ». Le féminin s’accorde naturellement avec « maison » en français, sans ajouter au texte hébreu le mot « maison » dans la première expression.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette désignation nationale et communautaire traditionnelle est conservée pour sa portée biblique et son lien formel avec l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente directement le nom divin יהוה et évite la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: רַב לָכֶם
  choice: Assez
  rationale: Dans cette tournure idiomatique, l’expression signifie que les destinataires sont allés assez loin. « Assez » en restitue avec concision la force d’arrêt et de réprimande.
- source_word: מִכָּל תּוֹעֲבוֹתֵיכֶם
  choice: de toutes vos abominations
  rationale: La préposition s’intègre naturellement à l’expression française « Assez de… », et « abominations » maintient la forte réprobation cultuelle et morale du terme dans le contexte du temple.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme. Employer « Yahweh » préserve le nom propre divin, tandis que « le Seigneur » rend distinctement אֲדֹנָי.
- issue: Identification de מֶרִי comme adresse collective
  choice: la rebelle
  alternative: la rébellion / le peuple rebelle
  rationale: Le singulier hébreu est conservé autant que le permet le français, et l’apposition suivante identifie sans ambiguïté la maison d’Israël. La note maintient les autres analyses lexicales possibles.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’apposition et la vigueur de la réprimande prophétique ; le vocatif final est rendu sans « ô », devenu marqué dans l’usage courant.
