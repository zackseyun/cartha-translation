source:
  edition: WLC
  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: fr
  text: Eux-mêmes entreront dans mon sanctuaire, et eux-mêmes s’approcheront de ma table[a] pour me servir ; ils veilleront à observer ma charge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mon autel » ou « ma table-autel » : ici, le mot « table » est employé dans le contexte du service du sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: eux-mêmes
  rationale: Le pronom indépendant, répété dans le verset, est emphatique. « Eux-mêmes » conserve l’insistance sur ceux qui ont le privilège d’entrer et de s’approcher.
- source_word: יָבֹאוּ אֶל־מִקְדָּשִׁי
  choice: entreront dans mon sanctuaire
  rationale: Avec le complément désignant le sanctuaire, le verbe exprime ici l’entrée dans ce lieu. Cette formulation est naturelle en français et garde la valeur future.
- source_word: יִקְרְבוּ
  choice: s’approcheront
  rationale: Le verbe désigne l’approche, avec ici une portée cultuelle liée au service sacerdotal. « S’approcheront » conserve cette nuance sans la surinterpréter.
- source_word: שֻׁלְחָנִי
  choice: ma table
  rationale: Le nom hébreu signifie littéralement « table ». Même si, dans ce contexte cultuel, il peut désigner une table associée aux offrandes ou être compris comme l’autel, le texte principal conserve le terme explicite.
- source_word: לְשָׁרְתֵנִי
  choice: pour me servir
  rationale: Le verbe désigne le service accompli auprès de Dieu, spécialement dans un cadre sacerdotal. « Pour me servir » est clair, digne et naturel en français actuel.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: ils veilleront à accomplir la charge que je leur confie
  rationale: L’expression idiomatique évoque l’observation fidèle d’une responsabilité assignée. Cette formulation française rend l’idée de vigilance et de charge sans employer le calque peu naturel « garder ma garde ».
theological_decisions:
- issue: Sens cultuel de שֻׁלְחָנִי dans le contexte du service du sanctuaire
  choice: ma table
  alternative: mon autel ; ma table servant d’autel
  rationale: Le contexte permet une compréhension cultuelle plus précise, mais le lexème hébreu signifie directement « table ». Le texte principal ne tranche donc pas en faveur d’une identification plus spécifique que l’original ; les autres compréhensions sont signalées en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition emphatique « eux-mêmes » est maintenue. Le vocabulaire cultuel reste accessible, et la tournure finale privilégie une équivalence naturelle plutôt qu’un calque de l’expression hébraïque.
