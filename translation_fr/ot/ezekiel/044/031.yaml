- from: Les prêtres ne mangeront aucune bête morte ni déchiquetée[a], qu’il s’agisse d’un oiseau ou d’un animal domestique.
  to: Les prêtres ne mangeront aucun animal mort ni aucun animal déchiré[a], qu’il s’agisse d’oiseaux ou d’animaux domestiques.
  rationale: La révision remplace « déchiquetée » par « déchiré », rendu plus directement fidèle à טְרֵפָה, et rend les catégories animales au pluriel générique. La note conserve explicitement les nuances usuelles de נְבֵלָה et de טְרֵפָה sans les imposer au texte principal.
