  text: כָּל נְבֵלָה֙ וּ/טְרֵפָ֔ה מִן הָ/ע֖וֹף וּ/מִן הַ/בְּהֵמָ֑ה לֹ֥א יֹאכְל֖וּ הַ/כֹּהֲנִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: fr
  text: Les prêtres ne mangeront aucun animal mort ni aucun animal déchiré[a], qu’il s’agisse d’oiseaux ou d’animaux domestiques.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun animal mort de mort naturelle ou déchiré par des bêtes sauvages ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: aucune
  rationale: Dans cette interdiction avec des noms singuliers, la négation française « aucune » exprime naturellement la portée générale de כָּל.
- source_word: נְבֵלָה
  choice: bête morte
  rationale: Le terme désigne la dépouille d’un animal mort sans abattage rituel; « bête morte » reste clair, concret et adapté au contexte alimentaire.
- source_word: טְרֵפָה
  choice: déchiquetée
  rationale: Le mot désigne une bête mise en pièces, normalement par un prédateur. Le participe conserve l’image sans ajouter dans le texte un agent qui n’est pas explicitement nommé.
- source_word: מִן הָעוֹף
  choice: qu’il s’agisse d’un oiseau
  rationale: עוֹף désigne ici les oiseaux; cette tournure française rend naturellement la construction distributive avec מִן.
- source_word: וּמִן הַבְּהֵמָה
  choice: ou d’un animal domestique
  rationale: בְּהֵמָה, opposé aux oiseaux, renvoie ici aux animaux terrestres domestiques; cette formulation est plus précise que le simple « animal » et plus large que « bovin ».
- source_word: לֹא יֹאכְלוּ
  choice: ne mangeront
  rationale: L’imparfait hébreu précédé de לֹא a ici une valeur prohibitive dans un cadre légal; le futur français conserve ce ton normatif.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Le groupe nominal défini désigne la classe sacerdotale dans le contexte des prescriptions du sanctuaire.
