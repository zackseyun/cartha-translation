source:
  edition: WLC
  text: וְ/אַחֲרֵ֖י טָֽהֳרָת֑/וֹ שִׁבְעַ֥ת יָמִ֖ים יִסְפְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/026.yaml
  text: And after his cleansing[a], they shall count seven days for him.
translation:
  language: fr
  text: Après sa purification[a], on comptera pour lui sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après qu’il aura été purifié ». Il s’agit ici d’une purification rituelle dans le contexte sacerdotal.
    reason: Alternative syntaxique et précision du sens cultuel.
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Après
  rationale: אַחֲרֵי marque la succession temporelle. En français, « Après » assure naturellement la continuité avec la prescription précédente sans qu’il soit nécessaire de rendre וְ par « Et ».
- source_word: טָהֳרָתוֹ
  choice: sa purification
  rationale: Le nom טָהֳרָה désigne ici la purification rituelle du prêtre. « Purification » est précis, digne et naturel dans ce contexte cultuel.
- source_word: שִׁבְעַת יָמִים
  choice: sept jours
  rationale: Traduction directe de la construction numérale.
- source_word: יִסְפְּרוּ
  choice: on comptera
  rationale: Le qal de ספר signifie « compter ». Le pronom indéfini « on » rend naturellement en français le pluriel hébreu dont l’agent n’est pas précisé.
- source_word: לוֹ
  choice: pour lui
  rationale: La préposition ל marque ici la personne concernée par le décompte de la période prescrite.
theological_decisions:
- issue: Nature de la purification
  choice: sa purification
  alternative: après qu’il aura été purifié
  rationale: Le rendu conserve le sens rituel et juridique du contexte sacerdotal, sans transformer cette purification en affirmation morale ou spirituelle.
- issue: Sujet de יִסְפְּרוּ
  choice: on comptera
  alternative: ils compteront
  rationale: L’hébreu emploie un pluriel sans antécédent explicite dans ce verset. « On » préserve en français l’indétermination de l’agent, tandis que « ils » pourrait suggérer un groupe précisément identifié.
translation_notes:
  register: Français international moderne, sobre et juridique. La phrase reste concise et suit l’ordre logique de l’hébreu, tout en employant « on » pour rendre naturellement le sujet pluriel non précisé.
