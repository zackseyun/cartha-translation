  to: Lorsqu’ils sortiront pour aller au parvis extérieur, vers le peuple[a], ils ôteront les vêtements dans lesquels ils accomplissent leur service et les déposeront dans les chambres saintes. Puis ils mettront d’autres vêtements, afin de ne pas rendre le peuple saint par leurs vêtements[b].
