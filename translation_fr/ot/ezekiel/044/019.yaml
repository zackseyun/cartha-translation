source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: fr
  text: Lorsqu’ils sortiront pour aller au parvis extérieur, vers le peuple[a], ils ôteront les vêtements dans lesquels ils accomplissent leur service et les déposeront dans les chambres saintes. Puis ils mettront d’autres vêtements, afin de ne pas rendre le peuple saint par leurs vêtements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « vers le parvis extérieur » : « vers le parvis extérieur, vers le peuple ». Cette répétition souligne le passage de l’espace sacerdotal à l’espace accessible au peuple.'
    reason: cultural_note
  - marker: b
    text: Ou « afin de ne pas sanctifier le peuple » ou « consacrer le peuple par leurs vêtements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: Quand ils sortiront
  rationale: La conjonction suivie de l’infinitif construit avec suffixe introduit une proposition temporelle. Le futur convient aux prescriptions qui entourent ce verset.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: le parvis extérieur
  rationale: Dans le contexte du temple, « parvis » désigne naturellement la cour délimitée autour du sanctuaire; « extérieur » traduit הַחִיצוֹנָה.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: dans le parvis extérieur où se trouve le peuple
  rationale: La formulation rend le mouvement vers l’espace extérieur et comprend « vers le peuple » comme une précision sur la zone accessible au peuple, sans effacer la répétition hébraïque du parvis extérieur.
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: ils enlèveront les vêtements
  rationale: פשט signifie ici retirer des vêtements. Le suffixe possessif est ensuite explicitement conservé par le contexte et par « leurs vêtements » dans la dernière proposition.
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: dans lesquels ils assurent le service
  rationale: שרת désigne le service cultuel. Cette formulation reste claire en français courant tout en préservant sa portée sacerdotale; « dans lesquels » convient à des vêtements portés pendant ce service.
- source_word: וְהִנִּיחוּ אוֹתָם
  choice: et les déposeront
  rationale: Le verbe signifie poser ou laisser. « Déposer » exprime naturellement le placement prévu des vêtements dans les salles réservées.
- source_word: בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: dans les salles saintes
  rationale: לשכה désigne une salle ou une pièce du complexe du temple, et הַקֹּדֶשׁ en indique le caractère saint.
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: Puis ils mettront d’autres vêtements
  rationale: לבש signifie mettre ou porter un vêtement. « Puis » rend clairement la succession des gestes sans ajouter de contenu.
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם
  choice: afin de ne pas rendre le peuple saint
  rationale: Le piel de קדש signifie rendre saint ou consacrer. La formulation française garde le sens causatif concret et évite de réduire le passage à une sanctification morale.
- source_word: בְּבִגְדֵיהֶם
  choice: par leurs vêtements
  rationale: La préposition ב est ici instrumentale. « Par » exprime le moyen tout en laissant le mécanisme précis implicite, comme en hébreu.
theological_decisions:
- issue: Sens de la transmission de la sainteté cultuelle dans la dernière proposition
  choice: La prescription empêche que les prêtres rendent le peuple saint au moyen de leurs vêtements consacrés au service.
  alternative: La proposition pourrait être comprise comme une simple règle de convenance rituelle, sans transmission effective de sainteté, ou comme l’interdiction de traiter le peuple comme saint au contact de ces vêtements.
  rationale: Le piel de קדש prend « le peuple » comme objet direct et les vêtements comme moyen. Dans la vision du temple d’Ézéchiel, la sainteté est aussi régie spatialement et matériellement. La traduction conserve cette tension cultuelle sans l’assimiler à une transformation morale ni imposer une explication doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Parvis », « service » et « salles saintes » maintiennent le cadre du temple sans archaïsme excessif. La répétition du parvis extérieur est conservée dans le texte, tandis qu’une note en explicite la fonction. La dernière proposition demeure volontairement concrète et théologiquement ouverte.
