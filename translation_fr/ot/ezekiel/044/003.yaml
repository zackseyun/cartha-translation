id: EZK.44.3
reference: Ezekiel 44:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: fr
  text: Quant au prince, puisqu’il est prince, il pourra s’y asseoir pour manger du pain devant Yahweh. Il entrera par le vestibule de la porte et ressortira par le même chemin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il sortira par son chemin », ce qui signifie probablement qu’il ressortira par le chemin qu’il a emprunté pour entrer.'
    reason: La formulation hébraïque est elliptique et permet de rendre visible l’alternative lexicale sans alourdir le texte principal.
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: Quant au prince
  rationale: Le syntagme détaché en tête de phrase marque le prince comme thème avec emphase; « Quant au » reproduit naturellement cette dislocation en français.
- source_word: נָשִׂיא הוּא
  choice: puisqu’il est prince
  rationale: La répétition du titre suivie du pronom est emphatique et motive l’exception accordée au prince. « Puisqu’il » exprime cette valeur causale sans ajouter d’identification théologique.
- source_word: יֵשֶׁב בּוֹ
  choice: il pourra s’y asseoir
  rationale: Dans ce contexte réglementaire, l’imparfait exprime une permission. Le pronom « y » renvoie naturellement à l’espace de la porte mentionné dans le contexte.
- source_word: לֶאֱכָול לֶחֶם
  choice: pour manger du pain
  rationale: La formulation conserve l’expression hébraïque concrète, qui peut aussi désigner la prise d’un repas, tout en restant intelligible en français.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » maintient les dimensions spatiale et cultuelle de l’expression; le nom divin est translittéré conformément à la couche anglaise fournie et sans le remplacer par un titre.
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: par le vestibule de la porte
  rationale: אֻלָם désigne le vestibule ou porche architectural. Cette tournure est précise et naturelle dans une description de sanctuaire.
- source_word: יָבֹוא
  choice: Il entrera
  rationale: Le futur français rend sobrement la valeur prescriptive de l’imparfait dans ce passage réglementaire.
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: et ressortira par le même chemin
  rationale: Le suffixe de « chemin » renvoie vraisemblablement à l’itinéraire qui vient d’être indiqué. Le texte hébreu demeure toutefois moins explicite que cette formulation, d’où la note.
theological_decisions:
- issue: Identité du נָשִׂיא dans la vision du temple
  choice: Traduire de façon neutre par « le prince »
  alternative: Identifier explicitement le prince au Messie, ou à un dirigeant civil non messianique
  rationale: Ce verset attribue un privilège particulier au prince, mais ne tranche pas lui-même son identité précise. La traduction conserve donc le titre sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure thématique initiale et le vocabulaire architectural sont conservés, tandis que les valeurs permissive et prescriptive des imparfaits sont rendues naturellement.
