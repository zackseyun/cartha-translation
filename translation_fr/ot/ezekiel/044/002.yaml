  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: fr
  text: 'Yahweh me dit : « Cette porte restera fermée ; elle ne sera pas ouverte, et personne[a] n’entrera par elle, car Yahweh, le Dieu d’Israël, est entré par elle. Elle restera donc fermée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucun homme » ; le masculin singulier hébreu a ici une portée générique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי יְהוָה
  choice: Yahweh me dit
  rationale: Rend directement le verbe narratif et le complément אֵלַי dans un français naturel, tout en conservant le nom divin.
- source_word: הַשַּׁעַר הַזֶּה
  choice: cette porte
  rationale: Le démonstratif est proche (« cette ») et שַׁעַר désigne ici une porte du complexe du temple.
- source_word: סָגוּר יִהְיֶה
  choice: restera fermée
  rationale: La construction exprime un état continu ; « restera fermée » en restitue clairement la durée.
- source_word: לֹא יִפָּתֵחַ
  choice: elle ne sera pas ouverte
  rationale: Le niphal de פתח a ici une valeur passive, conservée en français.
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: et personne[a] n’entrera par elle
  rationale: אִישׁ, masculin singulier, a une portée générique dans cette négation. « Personne » exprime naturellement cette portée en français ; « par elle » convient au passage à travers une porte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la fermeture. « Car » convient au registre biblique moderne et soutenu sans obscurcir le lien causal.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, le Dieu d’Israël
  rationale: La formulation appositive préserve le nom propre divin et le titre qui l’identifie comme Dieu d’Israël.
- source_word: בָּא בוֹ
  choice: est entré par elle
  rationale: Le qatal présente l’entrée comme accomplie ; le passé composé est naturel en français et garde sa pertinence pour l’état actuel de la porte.
- source_word: וְהָיָה סָגוּר
  choice: Elle restera donc fermée
  rationale: « Donc » rend la conséquence contextuelle, tandis que la répétition de « restera fermée » conserve l’insistance du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: « Yahweh » translittère le nom divin au lieu de lui substituer un titre, sans ajouter d’interprétation théologique.
- issue: Portée du masculin אִישׁ
  choice: personne[a]
  alternative: aucun homme
  rationale: Dans la proposition négative, le masculin singulier a une portée générique. « Personne » transmet exactement l’interdiction universelle en français moderne ; la forme masculine littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tout en employant une ponctuation et des enchaînements naturels. La répétition finale est maintenue pour préserver l’insistance du verset.
