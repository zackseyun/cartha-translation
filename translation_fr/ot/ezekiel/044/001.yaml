    issue: Formulation « par le chemin de la porte »
    rationale: Bien qu’elle cherche à reproduire דֶּרֶךְ, cette expression est maladroite en français et peut évoquer un chemin appartenant à la porte. « Vers la porte » exprime clairement la direction ou le retour vers ce lieu sans prétendre à un passage à travers une porte fermée.
  - severity: low
    issue: Ancre de la note lexicale
    rationale: La note explique le verbe « ramena » (וַיָּשֶׁב), mais l’ancre est placée après « sanctuaire ». Elle doit être attachée au verbe concerné.
