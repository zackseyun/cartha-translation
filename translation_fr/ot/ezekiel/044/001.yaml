- from: Puis il me ramena par le chemin de la porte extérieure du sanctuaire[a], celle qui fait face à l’est, et elle était fermée.
  to: Puis il me ramena[a] vers la porte extérieure du sanctuaire, celle qui fait face à l’est, et elle était fermée.
  rationale: La révision remplace une tournure française pesante par « vers la porte », qui conserve le sens directionnel de la construction avec דֶּרֶךְ et n’implique pas le franchissement de la porte. Elle déplace aussi l’ancre de note sur « ramena », le mot que la note documente.
