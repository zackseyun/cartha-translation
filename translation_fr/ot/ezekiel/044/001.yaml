  text: וַ/יָּ֣שֶׁב אֹתִ֗/י דֶּ֣רֶךְ שַׁ֤עַר הַ/מִּקְדָּשׁ֙ הַֽ/חִיצ֔וֹן הַ/פֹּנֶ֖ה קָדִ֑ים וְ/ה֖וּא סָגֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/001.yaml
  text: Then he brought me back by way of the outer gate of the sanctuary[a], the one facing east, and it was shut.
translation:
  language: fr
  text: Puis il me ramena[a] vers la porte extérieure du sanctuaire, celle qui fait face à l’est, et elle était fermée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puis il me fit revenir vers la porte extérieure du sanctuaire. » Le verbe hébreu signifie plus littéralement « faire revenir » ; ici, le guide conduit Ézéchiel de nouveau vers cette porte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: il me ramena
  rationale: Le hifil de שוב exprime ici l’idée de faire revenir quelqu’un. « Il me ramena » est naturel en français et conserve cette valeur causative.
- source_word: דֶּרֶךְ
  choice: par le chemin de
  rationale: Le nom désigne ici l’itinéraire emprunté. Cette formulation n’implique pas qu’Ézéchiel soit passé à travers la porte, qui est décrite comme fermée.
- source_word: שַׁעַר
  choice: porte
  rationale: Équivalent français courant dans un contexte architectural, notamment pour les accès monumentaux du complexe sacré.
- source_word: הַמִּקְדָּשׁ
  choice: du sanctuaire
  rationale: « Sanctuaire » désigne naturellement le complexe sacré sans restreindre le terme au seul espace intérieur.
- source_word: הַחִיצוֹן
  choice: extérieure
  rationale: L’adjectif distingue cette porte des portes intérieures dans la vision du temple.
- source_word: הַפֹּנֶה קָדִים
  choice: celle qui fait face à l’est
  rationale: La proposition rend clairement le participe exprimant l’orientation de cette porte précise.
- source_word: וְהוּא סָגוּר
  choice: et elle était fermée
  rationale: Le participe passif indique l’état fermé de la porte. La coordination simple « et » respecte l’hébreu sans lui ajouter une nuance adversative.
