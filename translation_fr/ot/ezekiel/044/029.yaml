base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: fr
  text: Ils mangeront l’offrande de céréales, le sacrifice pour le péché[a] et le sacrifice de réparation. Tout ce qui est voué[b] en Israël leur appartiendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice de purification ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne ce qui est irrévocablement voué à Dieu ; dans d’autres contextes, il peut aussi désigner ce qui est voué à la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le contexte sacerdotal, מִנְחָה désigne l’offrande végétale ou céréalière plutôt qu’une offrande générique. Cette formulation française est claire et la distingue des sacrifices mentionnés ensuite.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans cette énumération cultuelle, חַטָּאת désigne le sacrifice lié au péché et à la purification. « Sacrifice pour le péché » est transparent et traditionnel, tandis que l’autre nuance possible est signalée en note.
- source_word: הָאָשָׁם
  choice: le sacrifice de réparation
  rationale: אָשָׁם désigne ici le sacrifice offert en raison d’une culpabilité engageant une responsabilité, souvent avec réparation. « Sacrifice de réparation » exprime naturellement en français cette catégorie cultuelle distincte.
- source_word: הֵמָּה יֹאכְלוּם
  choice: Ils mangeront
  rationale: Le pronom hébreu met les prêtres en relief et le suffixe verbal renvoie aux offrandes énumérées. En français, l’objet peut rester implicite après la liste sans perte de sens.
- source_word: חֵרֶם
  choice: tout ce qui est voué
  rationale: חֵרֶם désigne ce qui est irrévocablement mis à part. Dans ce contexte de biens revenant aux prêtres, « voué » conserve le sens cultuel sans introduire à tort l’idée de destruction propre à d’autres contextes.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La formule indique le cadre au sein duquel ces biens sont voués; « en Israël » est naturel et précis.
- source_word: לָהֶם יִהְיֶה
  choice: leur appartiendra
  rationale: L’expression hébraïque indique la possession ou le droit d’attribution. « Leur appartiendra » convient au registre juridique du passage.
theological_decisions:
- issue: Terminologie des sacrifices dans le cadre des droits sacerdotaux
  choice: 'Conserver des désignations cultuelles distinctes : « offrande de céréales », « sacrifice pour le péché » et « sacrifice de réparation ».'
  alternative: Employer des termes plus génériques, ou traduire חַטָּאת par « sacrifice de purification » et אָשָׁם par « sacrifice de culpabilité ».
  rationale: Le verset énumère des catégories précises du système sacrificiel. Les distinguer préserve la structure juridique et théologique du texte sans lui imposer une interprétation doctrinale ultérieure.
- issue: Sens de חֵרֶם dans ce contexte
  choice: Traduire par « tout ce qui est voué ».
  alternative: « tout ce qui est consacré » ou « tout ce qui est voué à la destruction »
  rationale: Le contexte porte sur les biens attribués aux prêtres, non sur leur destruction. La traduction retient l’idée d’une mise à part irrévocable tout en laissant la note exposer l’étendue sémantique du terme.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase hébraïque a été divisée en deux pour rendre clairement l’énumération puis la règle d’attribution. Les termes cultuels restent précis sans devenir inutilement techniques.
