revisions:
- from: 'Pourtant, ils assureront le service dans mon sanctuaire : ils seront chargés de veiller aux portes du temple et d’y accomplir leur service. Ce sont eux qui égorgeront pour le peuple l’holocauste et les autres sacrifices[a], et ils se tiendront devant lui pour le servir.'
  to: 'Pourtant, ils exerceront leur ministère dans mon sanctuaire : ils seront chargés de veiller aux portes du temple et y exerceront leur service. Ce sont eux qui égorgeront pour le peuple l’holocauste et le sacrifice[a], et ils se tiendront devant eux pour les servir.'
  rationale: La révision supprime l’ajout interprétatif « autres » devant « sacrifices » et rétablit au terme final le pluriel correspondant aux suffixes hébreux. Elle conserve le contraste contextuel, le caractère cultuel du service et les termes techniques établis. La note demeure correctement ancrée après l’expression qu’elle éclaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les fonctions cultuelles sont bien rendues : contraste contextuel, service dans le sanctuaire, responsabilité aux portes, égorgement des offrandes et service devant le peuple. Cependant, « les autres sacrifices » ajoute l’idée d’autres catégories sacrificielles, absente de זֶבַח, qui est ici un singulier défini et générique (« le sacrifice »). La reprise finale par le singulier « lui / le » peut être grammaticalement motivée par « le peuple », mais elle affaiblit inutilement les suffixes pluriels hébreux, qui renvoient aux membres du peuple.'
  naturalness: Le français est globalement naturel et de registre approprié. « Accomplir leur service » est clair, mais la répétition de « service » avec la proposition initiale est un peu lourde ; « y exercer leur ministère » maintient mieux le registre cultuel sans redondance excessive. « Se tiendront devant eux pour les servir » est à la fois idiomatique dans un style biblique moderne et plus proche du texte.
  terminology: « Sanctuaire », « temple » et « holocauste » sont exacts dans ce contexte. « Sacrifice » rend convenablement זֶבַח sans le restreindre à un type particulier ni lui ajouter « autres ». « Ministère » exprime utilement le service cultuel de שׁרת, sans conférer le statut sacerdotal que le contexte refuse à ces Lévites.
  issues:
  - severity: medium
    issue: « les autres sacrifices » traduit הַזֶּבַח
    rationale: L’hébreu porte « le sacrifice », au singulier défini. « Autres » n’est pas exprimé et introduit une opposition catégorielle supplémentaire. Il convient de conserver « le sacrifice », avec une note littérale si souhaité.
  - severity: low
    issue: « devant lui pour le servir » pour לִפְנֵיהֶם לְשָׁרְתָם
    rationale: Le collectif français « peuple » autorise le singulier, mais les deux suffixes hébreux sont pluriels. « Devant eux pour les servir » préserve plus explicitement le référent sans nuire à la fluidité.
  revised_text: 'Pourtant, ils exerceront leur ministère dans mon sanctuaire : ils seront chargés de veiller aux portes du temple et y exerceront leur service. Ce sont eux qui égorgeront pour le peuple l’holocauste et le sacrifice[a], et ils se tiendront devant eux pour les servir.'
  revised_footnotes:
