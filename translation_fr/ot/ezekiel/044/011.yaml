source:
  edition: WLC
  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: fr
  text: 'Pourtant, ils exerceront leur ministère dans mon sanctuaire : ils seront chargés de veiller aux portes du temple et y exerceront leur service. Ce sont eux qui égorgeront pour le peuple l’holocauste et le sacrifice[a], et ils se tiendront devant eux pour les servir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’holocauste et le sacrifice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: assureront / accomplir leur service
  rationale: Le participe de שׁרת désigne ici le service cultuel. Cette formulation française est naturelle tout en maintenant le caractère officiel de leur fonction dans le sanctuaire.
- source_word: פְּקֻדּוֹת אֶל שַׁעֲרֵי הַבַּיִת
  choice: chargés de veiller aux portes du temple
  rationale: פְּקֻדּוֹת exprime une charge ou responsabilité assignée. Dans le contexte des portes, « veiller » rend vraisemblablement la fonction de surveillance sans transformer le terme en règlement abstrait.
- source_word: הַבַּיִת
  choice: le temple / y
  rationale: Dans cette vision cultuelle, « la maison » désigne le temple. La reprise pronominale « y » évite une répétition lourde en français.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français établi pour l’offrande entièrement consumée désignée par עֹלָה.
- source_word: הַזֶּבַח
  choice: les autres sacrifices
  rationale: זֶבַח demeure générique et ne doit pas être limité au sacrifice de paix. « Les autres » explicite en français que l’holocauste vient d’être nommé comme une catégorie sacrificielle distincte.
- source_word: לָעָם
  choice: pour le peuple
  rationale: La préposition ל marque ici le bénéficiaire ou la personne au nom de laquelle l’acte est accompli. « Pour » conserve cette légère ambiguïté.
- source_word: יַעַמְדוּ לִפְנֵיהֶם לְשָׁרְתָם
  choice: ils se tiendront devant lui pour le servir
  rationale: La tournure conserve l’image hébraïque de se tenir devant quelqu’un en disponibilité pour le service. Le collectif « peuple » appelle naturellement le singulier en français.
- source_word: וְהָיוּ
  choice: Pourtant, ils assureront
  rationale: Le contexte précédent établit un contraste entre l’interdiction d’exercer le sacerdoce auprès de YHWH et les tâches subalternes qui leur restent confiées. « Pourtant » rend ce rapport discursif.
theological_decisions:
- issue: Fonction des Lévites sanctionnés dans le sanctuaire
  choice: Ils conservent des tâches cultuelles subalternes, sans retrouver l’accès sacerdotal auprès de YHWH.
  alternative: Ils continuent d’exercer pleinement le ministère sacerdotal.
  rationale: Le contexte immédiat distingue leur service aux portes, l’égorgement des sacrifices et le service rendu au peuple de la fonction des prêtres autorisés à s’approcher de YHWH.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel traditionnel est conservé lorsque sa précision le justifie (« sanctuaire », « holocauste »), tandis que les fonctions sont exprimées dans une syntaxe courante. Le marqueur [a] est placé immédiatement après l’expression concernée.
