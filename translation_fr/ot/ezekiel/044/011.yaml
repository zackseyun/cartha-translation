    text: 'Littéralement : « l’holocauste et le sacrifice ».'
    reason: lexical_alternative
  revision_rationale: La révision supprime l’ajout interprétatif « autres » devant « sacrifices » et rétablit au terme final le pluriel correspondant aux suffixes hébreux. Elle conserve le contraste contextuel, le caractère cultuel du service et les termes techniques établis. La note demeure correctement ancrée après l’expression qu’elle éclaire.
