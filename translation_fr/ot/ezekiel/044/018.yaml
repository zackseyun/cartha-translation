source:
  edition: WLC
  text: פַּאֲרֵ֤י פִשְׁתִּים֙ יִהְי֣וּ עַל רֹאשָׁ֔/ם וּ/מִכְנְסֵ֣י פִשְׁתִּ֔ים יִהְי֖וּ עַל מָתְנֵי/הֶ֑ם לֹ֥א יַחְגְּר֖וּ בַּ/יָּֽזַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: fr
  text: Ils auront des turbans de lin sur la tête et des sous-vêtements de lin autour des reins. Ils ne se ceindront de rien qui les fasse transpirer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ils ne se ceindront pas dans la sueur » ou « avec la sueur ». L’hébreu est elliptique ; il s’agit probablement de ne rien porter ni attacher autour du corps qui provoque la transpiration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: turbans
  rationale: Dans ce contexte cultuel, le nom désigne une coiffure sacerdotale. « Turbans » est précis, naturel et convient à l’expression « sur la tête ».
- source_word: פִשְׁתִּים
  choice: lin
  rationale: Pour un vêtement, le terme désigne le textile de lin plutôt que la plante brute. La répétition de l’hébreu est conservée.
- source_word: מִכְנְסֵי
  choice: sous-vêtements
  rationale: Le mot désigne un vêtement couvrant le bas du corps et porté à même la peau. « Sous-vêtements » est moderne et clair sans préciser indûment sa coupe.
- source_word: מָתְנֵיהֶם
  choice: autour des reins
  rationale: « Reins » conserve le terme anatomique et vestimentaire de l’hébreu, tandis que « autour de » exprime naturellement en français la manière dont le vêtement couvre cette partie du corps.
- source_word: יַחְגְּרוּ
  choice: se ceindront
  rationale: Le verbe évoque l’action d’attacher ou de serrer un vêtement autour du corps. « Se ceindre » restitue ce sens vestimentaire dans un registre digne.
- source_word: בַּיָּזַע
  choice: de rien qui les fasse transpirer
  rationale: L’expression hébraïque, littéralement proche de « dans/avec la sueur », est elliptique. Cette formulation française en communique le sens probable sans identifier un tissu particulier que le texte ne nomme pas.
theological_decisions:
- issue: Règle vestimentaire sacerdotale et sens de l’expression finale
  choice: Comprendre la dernière proposition comme l’interdiction de se ceindre de quelque chose qui provoque la transpiration.
  alternative: 'Traduire plus littéralement : « ils ne se ceindront pas dans la sueur » ou « avec la sueur » ; ou y voir une interdiction précise de la laine.'
  rationale: L’hébreu est concis et elliptique. Le contexte immédiat impose le lin pour le service sacerdotal, mais le verset ne nomme pas explicitement la laine. La traduction exprime donc l’effet pratique probable tout en signalant la formulation littérale en note.
translation_notes:
  register: Français international moderne, clair et digne. « Se ceindre » maintient la précision vestimentaire et la solennité de l’instruction, tandis que « sous-vêtements » évite les termes archaïques. Le marqueur de note est placé sur la proposition qu’il explique.
