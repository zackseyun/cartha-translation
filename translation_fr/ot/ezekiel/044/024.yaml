source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: fr
  text: Lors d’un litige[a], ils se tiendront pour juger ; ils le jugeront selon mes décisions. Ils observeront mes lois et mes prescriptions à tous mes temps fixés[b], et ils sanctifieront mes sabbats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « différend », « affaire » ou « procès ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « à toutes mes fêtes fixées » ou « à tous mes temps déterminés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: litige
  rationale: Le terme désigne ici un différend porté en justice. « Litige » est naturel en français moderne et convient au contexte judiciaire sans limiter le sens à une procédure particulière.
- source_word: יַעַמְדוּ
  choice: ils se tiendront là
  rationale: Cette formulation conserve l’image concrète du verbe « se tenir debout/prendre place » tout en rendant explicite en français qu’ils prennent leur place pour exercer le jugement.
- source_word: לשפט
  choice: pour juger
  rationale: L’infinitif exprime le but ; « pour juger » est direct et préserve le verbe judiciaire.
- source_word: בְּמִשְׁפָּטַי
  choice: selon mes décisions
  rationale: Dans ce contexte d’arbitrage, מִשְׁפָּט désigne les décisions ou normes judiciaires de Dieu. « Décisions » maintient le champ légal sans la lourdeur de « jugements » répété comme nom après le verbe juger.
- source_word: וּשְׁפָטֻהוּ
  choice: ils le jugeront
  rationale: Le pronom renvoie au litige. La traduction conserve la répétition du radical שפט présente dans l’hébreu.
- source_word: תּוֹרֹתַי
  choice: mes lois
  rationale: Le pluriel de תּוֹרָה peut signifier enseignements ou lois ; dans cette instruction sacerdotale, en parallèle avec les prescriptions, « lois » rend clairement sa portée normative.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקּוֹת désigne des règles établies ou des dispositions prescrites. « Prescriptions » distingue ce terme de « lois » tout en restant actuel et intelligible.
- source_word: בְּכָל־מוֹעֲדַי
  choice: à toutes les dates que j’ai fixées
  rationale: מוֹעֵד peut désigner un temps fixé ou une fête fixée. Cette formulation française naturelle garde le sens large d’occasions déterminées par Dieu sans réduire le mot aux seules fêtes.
- source_word: יִשְׁמֹרוּ
  choice: ils observeront
  rationale: Dans un contexte légal et cultuel, שמר signifie respecter ou observer. « Observer » s’emploie naturellement avec des lois et des prescriptions.
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: La traduction conserve le pluriel explicite et le possessif de l’hébreu.
- source_word: יְקַדֵּשׁוּ
  choice: ils sanctifieront
  rationale: Le piel de קדש signifie sanctifier ou traiter comme saint. « Sanctifieront » conserve l’action explicite et le registre cultuel du texte.
theological_decisions:
- issue: Rendu des termes juridiques de l’instruction sacerdotale
  choice: 'Maintenir des termes distincts : « décisions », « lois » et « prescriptions ».'
  alternative: Uniformiser ces termes sous « règles » ou « commandements ».
  rationale: L’hébreu juxtapose intentionnellement plusieurs vocables juridiques apparentés. Les distinguer préserve la texture du texte sans leur attribuer artificiellement des définitions doctrinales rigides.
- issue: Portée de מוֹעֵד
  choice: Employer dans le texte « les dates que j’ai fixées », avec une note signalant le sens possible de fêtes ou temps fixés.
  alternative: Traduire directement par « fêtes fixées » ou « fêtes prescrites ».
  rationale: Le mot peut viser les rendez-vous cultuels et les fêtes, mais son champ lexical est plus large. Le texte principal conserve cette amplitude et la note rend la nuance cultuelle accessible.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le parallélisme et les répétitions judiciaires de l’hébreu. « Sabbats » prend ici une minuscule selon l’usage courant français pour le nom commun.
