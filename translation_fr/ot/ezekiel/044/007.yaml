  naturalness: Le français est globalement clair et de registre convenable, mais « lui, ma maison » est très peu naturel et gêne la lecture. « Incirconcis de chair » est l’expression biblique française usuelle et conserve mieux le parallélisme concis avec « incirconcis de cœur ».
  terminology: « Sanctuaire », « profaner », « alliance », « abominations », « graisse et sang » et « ma nourriture » conviennent. La note sur « mon pain » est utile. Les marqueurs de notes sont correctement ancrés et les notes rendent les alternatives pertinentes.
