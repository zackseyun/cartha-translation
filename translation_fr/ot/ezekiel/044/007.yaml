source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: fr
  text: quand vous avez fait entrer des étrangers[a], incirconcis de cœur et incirconcis de chair, pour être dans mon sanctuaire et profaner ma maison, quand vous avez présenté ma nourriture[b], la graisse et le sang, et qu’ils ont rompu mon alliance[c], avec toutes vos abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de l’étranger » ou « des fils de l’étrangeté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mon pain » ; dans ce contexte sacrificiel, l’expression désigne la nourriture offerte à Dieu.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe ici à « ils ont rompu mon alliance », ce qui renvoie probablement aux étrangers qui viennent d’être mentionnés ; certains comprennent toutefois que l’accusation continue de viser globalement « vous ».
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: quand vous avez fait entrer
  rationale: La préposition ב devant l’infinitif construit a ici une valeur temporelle. « Faire entrer » conserve le sens causatif du hiphil de בוא.
- source_word: בְּנֵי נֵכָר
  choice: des étrangers
  rationale: L’expression signifie littéralement « fils de l’étranger/de l’étrangeté », mais désigne idiomatiquement des personnes étrangères.
- source_word: עַרְלֵי לֵב וְעַרְלֵי בָשָׂר
  choice: incirconcis de cœur et incirconcis dans leur chair
  rationale: La formulation maintient le parallélisme entre l’état intérieur figuré et l’incirconcision corporelle littérale.
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: pour qu’ils soient dans mon sanctuaire
  rationale: Cette formulation conserve le verbe « être » et met l’accent sur leur présence dans le sanctuaire plutôt que de paraphraser par une simple entrée.
- source_word: לְחַלְּלוֹ אֶת בֵּיתִי
  choice: et le profanent — lui, ma maison —
  rationale: Le pronom renvoie naturellement au sanctuaire, tandis que « ma maison » reprend le même lieu en apposition emphatique. La tournure française conserve cette structure inhabituelle au lieu de l’aplanir.
- source_word: בְּהַקְרִיבְכֶם
  choice: quand vous avez présenté
  rationale: Le hiphil de קרב désigne ici la présentation cultuelle d’une offrande.
- source_word: לַחְמִי
  choice: ma nourriture
  rationale: Le mot signifie littéralement « mon pain », mais désigne dans ce contexte la nourriture offerte à Dieu dans le sacrifice.
- source_word: חֵלֶב וָדָם
  choice: la graisse et le sang
  rationale: Il s’agit des éléments sacrificiels nommés dans le texte.
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  choice: et qu’ils ont rompu mon alliance
  rationale: Le verbe est à la troisième personne du pluriel; les étrangers mentionnés sont son sujet grammatical le plus proche. « Rompre une alliance » rend l’expression hébraïque usuelle הפר ברית.
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  choice: avec toutes vos abominations
  rationale: « Avec » garde le lien assez ouvert entre la rupture de l’alliance et l’ensemble des abominations, sans imposer une relation logique plus précise que l’hébreu.
theological_decisions:
- issue: Référent du suffixe dans « le profaner »
  choice: Le pronom « le » renvoie au sanctuaire, et « ma maison » en est une reprise appositionnelle.
  alternative: Traduire directement « profaner ma maison » sans représenter séparément le suffixe et l’apposition.
  rationale: L’antécédent immédiat du suffixe masculin singulier est « mon sanctuaire ». La reprise « ma maison » désigne ensuite le même espace sacré et produit une insistance que la traduction conserve.
- issue: Sujet de « ils ont rompu mon alliance »
  choice: Le sujet est constitué par les étrangers qui viennent d’être mentionnés.
  alternative: Comprendre l’accusation comme visant encore globalement « vous », malgré le passage de la deuxième à la troisième personne du pluriel.
  rationale: La forme וַיָּפֵרוּ est explicitement à la troisième personne du pluriel, et les étrangers en sont l’antécédent le plus proche. La note signale néanmoins la tension référentielle.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset commence par une subordonnée temporelle, conformément à sa dépendance syntaxique envers le contexte précédent. Les métaphores d’alliance et le changement de personne grammaticale sont conservés.
