  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהֹוָ֗ה בֶּן אָדָ֡ם שִׂ֣ים לִבְּ/ךָ֩ וּ/רְאֵ֨ה בְ/עֵינֶ֜י/ךָ וּ/בְ/אָזְנֶ֣י/ךָ שְּׁמָ֗ע אֵ֣ת כָּל אֲשֶׁ֤ר אֲנִי֙ מְדַבֵּ֣ר אֹתָ֔/ךְ לְ/כָל חֻקּ֥וֹת בֵּית יְהוָ֖ה וּ/לְ/כָל תורת/ו וְ/שַׂמְתָּ֤ לִבְּ/ךָ֙ לִ/מְב֣וֹא הַ/בַּ֔יִת בְּ/כֹ֖ל מוֹצָאֵ֥י הַ/מִּקְדָּֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: fr
  text: 'Yahvé me dit : « Fils d’homme, sois bien attentif[a] : regarde de tes yeux et écoute de tes oreilles tout ce que je te dis au sujet de toutes les prescriptions de la maison de Yahvé et de toutes ses instructions[b]. Sois bien attentif à l’entrée du Temple et à toutes les sorties du sanctuaire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « place ton cœur ». Cette expression hébraïque signifie qu’il faut prêter une attention soutenue et prendre la chose à cœur.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « toutes ses lois » ou « toutes ses directives ». Le terme hébreu désigne ici des enseignements ou règles prescrites pour le Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue du titre « Seigneur » et suit ici la politique signalée pour ce terme contesté.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve l’adresse divine récurrente propre au livre d’Ézéchiel sans lui imposer une interprétation christologique ultérieure.
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: sois bien attentif
  rationale: Rend naturellement en français l’expression hébraïque littérale « place ton cœur », qui appelle une attention intérieure soutenue; la répétition est conservée.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: regarde de tes yeux
  rationale: Préserve l’expression sensorielle concrète et son parallélisme avec l’écoute des oreilles.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: écoute de tes oreilles
  rationale: Conserve l’insistance corporelle de l’hébreu ainsi que le parallélisme rhétorique.
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: au sujet de toutes les prescriptions de la maison de Yahvé
  rationale: Le ל est compris comme indiquant le sujet des paroles; « prescriptions » convient au cadre cultuel et « maison de Yahvé » préserve l’expression hébraïque.
- source_word: תורתו
  choice: ses instructions
  rationale: Le texte massorétique affiché porte une forme singulière non vocalisée, mais la tradition de lecture et le contexte soutiennent le pluriel תּוֹרֹתָיו; « instructions » garde une portée plus large que la seule législation.
- source_word: לִמְבוֹא הַבַּיִת
  choice: à l’entrée du Temple
  rationale: Dans ce contexte architectural et cultuel, « Temple » identifie naturellement la maison visée, tandis que מְבוֹא désigne son accès.
- source_word: בְּכָל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: à toutes les sorties du sanctuaire
  rationale: מוֹצָאִים désigne les lieux par lesquels on sort; « sanctuaire » est le terme cultuel naturel pour מִקְדָּשׁ.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le nom propre est rendu explicitement plutôt que remplacé par un titre; la forme « Yahvé » est établie en français, tout en reconnaissant que la vocalisation ancienne exacte reste discutée.
- issue: Portée de בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: être humain / mortel
  rationale: La formule est conservée comme adresse prophétique récurrente et souligne l’humanité d’Ézéchiel, sans importer dans ce passage un sens christologique ultérieur.
- issue: Référent du suffixe dans תּוֹרֹתָיו
  choice: ses instructions, celles de la maison de Yahvé
  alternative: ses lois, comprises comme celles de Yahvé
  rationale: Grammaticalement, le suffixe masculin singulier se rattache naturellement à « maison »; dans le contexte, ces instructions cultuelles ont néanmoins leur autorité en Yahvé. La formulation française conserve le rattachement immédiat sans opposer artificiellement les deux notions.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme sensoriel de l’hébreu est conservé, tandis que l’idiome du cœur est rendu par une expression française naturelle et expliqué en note. La distinction contextuelle entre « maison », « Temple » et « sanctuaire » est maintenue.
