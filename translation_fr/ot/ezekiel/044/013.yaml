  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: fr
  text: Ils ne s’approcheront pas de moi pour me servir comme prêtres, ni ne s’approcheront d’aucune de mes choses saintes, ni des choses très saintes[a] ; mais ils porteront leur honte et les abominations qu’ils ont faites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Saint des saints ». L’expression hébraïque peut désigner soit les choses les plus saintes, soit le lieu le plus saint du sanctuaire ; ici, le contexte favorise le premier sens.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: ils ne s’approcheront pas de moi
  rationale: Dans le contexte sacerdotal, נגשׁ désigne l’accès à la proximité sacrée. « S’approcher de moi » reste naturel tout en conservant cette portée cultuelle.
- source_word: לְכַהֵן לִי
  choice: pour me servir comme prêtres
  rationale: Le verbe כהן signifie exercer la fonction de prêtre. Cette formulation moderne exprime clairement à la fois le service rendu à Dieu et la fonction sacerdotale.
- source_word: וְלָגֶשֶׁת
  choice: ni ne s’approcheront
  rationale: La reprise du verbe « s’approcher » conserve la répétition de la racine נגשׁ et la force de l’interdiction.
- source_word: עַל כָּל קָדָשַׁי
  choice: d’aucune de mes choses saintes
  rationale: Le pluriel substantivé désigne ce qui appartient au domaine consacré. Avec la négation, כָּל reçoit naturellement en français le sens distributif « aucune ».
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: des choses très saintes
  rationale: L’expression peut désigner les objets ou offrandes les plus saints, ou le lieu appelé « Saint des saints ». La mention précédente des « choses saintes » favorise ici l’apposition désignant leur catégorie la plus sacrée.
- source_word: וְנָשְׂאוּ כְּלִמָּתָם
  choice: ils porteront leur honte
  rationale: נשא associé à la honte exprime le fait d’en porter le poids ou les conséquences. La traduction littérale conserve cette nuance sans l’expliciter excessivement.
- source_word: וְתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: les abominations qu’ils ont commises
  rationale: « Abominations » préserve la force morale et cultuelle de תועבות. En français, « commettre des abominations » rend idiomatiquement עשה sans ajouter de précision doctrinale.
theological_decisions:
- issue: Sens de קָדְשֵׁי הַקְּדָשִׁים dans ce contexte
  choice: 'Référence aux choses les plus saintes : « des choses très saintes »'
  alternative: 'Référence spatiale au sanctuaire intérieur : « au Saint des saints »'
  rationale: Comme l’expression suit immédiatement « aucune de mes choses saintes », le contexte favorise une référence aux objets ou offrandes sacrés. Une note conserve toutefois l’autre lecture possible sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « s’approcher » maintient la structure juridique et cultuelle du texte hébreu. « Choses saintes » reste volontairement général afin de ne pas limiter le référent à une catégorie précise d’objets ou d’offrandes.
