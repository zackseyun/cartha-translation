revisions:
- from: Ils ne s’approcheront pas de moi pour me servir comme prêtres, ni ne s’approcheront d’aucune de mes choses saintes, des choses très saintes[a] ; mais ils porteront leur honte et les abominations qu’ils ont commises.
  to: Ils ne s’approcheront pas de moi pour me servir comme prêtres, ni ne s’approcheront d’aucune de mes choses saintes, ni des choses très saintes[a] ; mais ils porteront leur honte et les abominations qu’ils ont faites.
  rationale: La révision remplace « commises » par « faites » afin de refléter le verbe hébreu non marqué עשה, et explicite par « ni » le lien entre les choses saintes et les choses très saintes. Elle maintient la répétition de « s’approcher », le registre moderne et solennel, ainsi que l’ambiguïté signalée en note quant à la référence possible au Saint des saints.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:05Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet restitue correctement l’exclusion de l’accès sacerdotal, la répétition de נגשׁ (« s’approcher »), le port de la honte et les abominations. Toutefois, « qu’ils ont commises » interprète le verbe hébreu très général עָשׂוּ (« qu’ils ont faites ») avec un verbe français plus juridiquement et moralement chargé. La relation entre « toutes mes choses saintes » et « les choses très saintes » doit aussi être formulée plus clairement sans forcer l’alternative spatiale.
  naturalness: 'Le français est globalement fluide et de registre convenable. La séquence « d’aucune de mes choses saintes, des choses très saintes » est cependant syntaxiquement ambiguë : elle peut sembler une apposition mal raccordée. Une coordination explicite rend la restriction intelligible tout en restant proche du texte.'
  terminology: « S’approcher », « servir comme prêtres », « choses saintes », « choses très saintes », « honte » et « abominations » sont appropriés au registre cultuel et prophétique. La note conserve à juste titre la possibilité, contestée contextuellement, d’une référence au Saint des saints.
  issues:
  - severity: medium
    issue: « qu’ils ont commises » pour אֲשֶׁר עָשׂוּ
    rationale: עשה signifie simplement « faire ». Puisque « abominations » porte déjà l’évaluation du texte, « qu’ils ont faites » préserve mieux la neutralité lexicale et évite d’ajouter la nuance de faute juridiquement « commise ».
  - severity: low
    issue: Raccord de « des choses très saintes »
    rationale: Après « d’aucune de mes choses saintes », l’apposition sans lien explicite est peu nette en français. « Ni des choses très saintes » rend clairement l’extension maximale de l’interdiction, sans identifier l’expression au lieu intérieur.
  revised_text: Ils ne s’approcheront pas de moi pour me servir comme prêtres, ni ne s’approcheront d’aucune de mes choses saintes, ni des choses très saintes[a] ; mais ils porteront leur honte et les abominations qu’ils ont faites.
  revised_footnotes:
  - marker: a
    text: Ou « du Saint des saints ». L’expression hébraïque peut désigner soit les choses les plus saintes, soit le lieu le plus saint du sanctuaire ; ici, le contexte favorise le premier sens.
    reason: alternative_reading
  revision_rationale: La révision remplace « commises » par « faites » afin de refléter le verbe hébreu non marqué עשה, et explicite par « ni » le lien entre les choses saintes et les choses très saintes. Elle maintient la répétition de « s’approcher », le registre moderne et solennel, ainsi que l’ambiguïté signalée en note quant à la référence possible au Saint des saints.
