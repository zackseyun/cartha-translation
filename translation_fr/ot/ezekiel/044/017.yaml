  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: fr
  text: Quand ils entreront par les portes de la cour intérieure, ils porteront des vêtements de lin ; aucune laine ne sera sur eux[a] lorsqu’ils officieront aux portes de la cour intérieure et dans le Temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne porteront rien en laine ». Littéralement, l’hébreu dit : « aucune laine ne montera sur eux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la Maison » ; ici, ce terme désigne l’édifice du temple.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: Quand ils entreront
  rationale: La formule וְהָיָה suivie de בְּ et de l’infinitif construit introduit une circonstance temporelle. En français moderne, « Quand ils entreront » en exprime naturellement la valeur sans reproduire lourdement « il arrivera que ».
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: les portes de la cour intérieure
  rationale: Le syntagme désigne les accès à la cour intérieure ; « portes » est précis, courant et conforme au vocabulaire architectural du passage.
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: des vêtements de lin
  rationale: פִשְׁתִּים désigne ici le lin, issu du flax. « Vêtements de lin » rend clairement la matière prescrite.
- source_word: יִלְבָּשׁוּ
  choice: ils porteront
  rationale: Dans cette réglementation sur la tenue sacerdotale, לבשׁ indique le fait de porter des vêtements ; le futur français convient à la prescription.
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: aucune laine ne sera sur eux
  rationale: Cette formulation conserve l’image hébraïque inhabituelle selon laquelle la laine ne doit pas « monter sur eux », sans ajouter explicitement le mot « vêtement ». La note donne la formulation française plus idiomatique.
- source_word: בְּשָׁרְתָם
  choice: lorsqu’ils officieront
  rationale: שרת désigne ici le service cultuel des prêtres. « Officier » conserve cette nuance sacrée sans préciser davantage la nature des actes accomplis.
- source_word: וָבָיְתָה
  choice: et dans le Temple
  rationale: Le ה directionnel peut prendre ici une valeur locale liée au service, et הַבַּיִת désigne, dans ce contexte, l’édifice du temple. « Dans le Temple » exprime clairement le référent spatial.
theological_decisions:
- issue: Terminologie du service sacerdotal
  choice: officier
  alternative: servir
  rationale: « Officier » signale naturellement en français le cadre cultuel de l’activité, tandis que « servir » serait plus général. Le choix n’ajoute aucune fonction doctrinale non exprimée par le texte.
- issue: Référent de הַבַּיִת (« la maison »)
  choice: le Temple
  alternative: la maison
  rationale: Dans la vision d’Ézéchiel, « la maison » désigne l’édifice du temple. La traduction explicite ce référent pour le lecteur moderne, avec une note qui signale l’expression hébraïque.
- issue: Interdiction concernant la laine
  choice: aucune laine ne sera sur eux
  alternative: ils ne porteront rien en laine
  rationale: Le choix principal préserve la tournure concrète et légèrement singulière de l’hébreu au lieu de réduire d’emblée l’interdiction au seul verbe « porter ». L’alternative idiomatique est fournie en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime la prescription. La majuscule à « Temple » aide à identifier l’édifice particulier de la vision, tandis que la note conserve l’image hébraïque de « la Maison ». Tous les marqueurs de notes figurent dans le texte.
