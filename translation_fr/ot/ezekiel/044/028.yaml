  text: וְ/הָיְתָ֤ה לָ/הֶם֙ לְֽ/נַחֲלָ֔ה אֲנִ֖י נַֽחֲלָתָ֑/ם וַ/אֲחֻזָּ֗ה לֹֽא תִתְּנ֤וּ לָ/הֶם֙ בְּ/יִשְׂרָאֵ֔ל אֲנִ֖י אֲחֻזָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
translation:
  language: fr
  text: 'Voici ce qui leur servira d’héritage : c’est moi qui suis leur héritage[a]. Vous ne leur donnerez aucune propriété en Israël[b] : c’est moi qui suis leur propriété.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela leur tiendra lieu d’héritage : c’est moi qui suis leur héritage. » Le début de la phrase est elliptique en hébreu.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « propriété » peut aussi désigner un domaine ou une possession foncière permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: Voici ce qui leur servira d’héritage
  rationale: 'La tournure hébraïque est elliptique : le verbe féminin singulier n’a pas de sujet explicite. Cette formulation française rend naturellement la déclaration juridique prospective sans préciser indûment le référent implicite.'
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: héritage / leur héritage
  rationale: « Héritage » conserve le sens juridique et alliancenel d’une part attribuée, tout en maintenant la répétition du terme hébreu.
- source_word: אֲנִי נַחֲלָתָם
  choice: c’est moi qui suis leur héritage
  rationale: La construction emphatique met Dieu lui-même à la place de la part héréditaire des prêtres. « C’est moi qui » restitue cette insistance en français naturel.
- source_word: אֲחֻזָּה / אֲחֻזָּתָם
  choice: propriété / leur propriété
  rationale: Le mot désigne souvent un bien foncier détenu durablement. « Propriété » préserve sa distinction avec נַחֲלָה et fonctionne dans les deux occurrences du verset.
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: Vous ne leur donnerez aucune propriété en Israël
  rationale: Le futur français exprime ici naturellement la prescription adressée au pluriel, sans identifier plus précisément ses destinataires que ne le fait l’hébreu.
theological_decisions:
- issue: Rapport entre l’héritage et la propriété dans la part attribuée aux prêtres
  choice: Conserver la distinction entre נַחֲלָה (« héritage ») et אֲחֻזָּה (« propriété »).
  alternative: Traduire les deux termes par « héritage » ou par « possession » afin de lisser le parallélisme.
  rationale: L’hébreu emploie intentionnellement deux termes apparentés mais distincts du vocabulaire foncier. Leur distinction maintient l’idée que les prêtres ne reçoivent pas de propriété territoriale ordinaire parce que Dieu lui-même constitue à la fois leur héritage et leur bien propre.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur de prescription convient au contexte juridique. La répétition emphatique « c’est moi qui suis » rend le relief des deux propositions nominales hébraïques, tandis que « héritage » et « propriété » préservent la variation lexicale de l’original.
