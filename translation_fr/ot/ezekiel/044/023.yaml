id: EZK.44.23
reference: Ezekiel 44:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת עַמִּ֣/י יוֹר֔וּ בֵּ֥ין קֹ֖דֶשׁ לְ/חֹ֑ל וּ/בֵין טָמֵ֥א לְ/טָה֖וֹר יוֹדִעֻֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: fr
  text: Ils enseigneront à mon peuple à distinguer ce qui est saint de ce qui est ordinaire[a], et ils lui feront connaître la différence entre ce qui est impur et ce qui est pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est saint de ce qui est profane »; ici, « profane » signifie non consacré.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils lui apprendront à discerner ce qui est impur de ce qui est pur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרוּ
  choice: enseigneront
  rationale: Le hiphil de ירה désigne ici l’instruction donnée par les prêtres. « Enseigneront » est naturel et conserve leur rôle didactique.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: à distinguer ce qui est saint de ce qui est ordinaire
  rationale: La tournure exprime une distinction de statut cultuel. « Ordinaire » désigne ce qui n’est pas consacré sans lui attribuer nécessairement une faute morale.
- source_word: טָמֵא
  choice: impur
  rationale: Dans ce contexte sacerdotal, « impur » exprime le statut rituel associé à טָמֵא.
- source_word: טָהוֹר
  choice: pur
  rationale: « Pur » forme avec « impur » la paire terminologique française naturelle pour les catégories rituelles.
- source_word: יוֹדִעֻם
  choice: ils lui feront connaître
  rationale: Cette formulation conserve la valeur causative du hiphil de ידע. Le pronom singulier collectif « lui » reprend « mon peuple ».
- source_word: וְאֶת עַמִּי
  choice: à mon peuple
  rationale: Le groupe est l’objet indirect requis en français par « enseigner » dans cette construction; la conjonction initiale n’a pas besoin d’être rendue séparément.
theological_decisions:
- issue: Sens cultuel de חֹל opposé à קֹדֶשׁ
  choice: ordinaire
  alternative: profane
  rationale: « Ordinaire » préserve l’opposition entre consacré et non consacré sans laisser entendre une profanation active ou une culpabilité morale. « Profane » reste une traduction technique possible.
- issue: Rendu de la paire טָמֵא / טָהוֹר
  choice: impur / pur
  alternative: non pur / pur; souillé / pur
  rationale: « Impur / pur » conserve les catégories rituelles et évite de réduire le contraste à la saleté physique ou à une appréciation morale.
- issue: Valeur causative de יוֹדִעֻם
  choice: feront connaître la différence
  alternative: apprendront à discerner
  rationale: Le choix retenu garde explicitement la causalité du hiphil, tandis que l’alternative met davantage en avant le discernement produit.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation maintient le parallélisme des deux distinctions sacerdotales tout en évitant que « ordinaire » ou « impur » soient automatiquement compris comme des jugements moraux.
