- from: Eux aussi sont descendus avec lui au séjour des morts, auprès de ceux qui ont été transpercés par l’épée. Son bras[a] habitait sous son ombre, au milieu des nations.
  to: Eux aussi sont descendus avec lui au séjour des morts, vers ceux qui ont été tués par l’épée, eux qui formaient son bras[a] et habitaient sous son ombre, au milieu des nations.
  rationale: La révision rend le pluriel de « habitaient » et explicite seulement la relation grammaticale implicite entre les descendants et « son bras », sans trancher en faveur exclusive de « puissance » ou d’« alliés ». Elle remplace aussi « transpercés » par « tués », terme plus exactement proportionné au lexique hébreu.
