review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement גַּם הֵם, אִתּוֹ, la descente au séjour des morts et les victimes de l’épée. Toutefois, « Son bras habitait » neutralise le pluriel de יָשָׁבוּ. Dans ce contexte, זְרֹעוֹ est très probablement une désignation collective des dépendants/soutiens d’Assur; la formulation française doit permettre l’accord pluriel sans effacer l’image du « bras ». « Transpercés » est plus étroit que חַלְלֵי, qui désigne les tués ou victimes de l’épée sans préciser la manière exacte de la blessure.
  naturalness: « Eux aussi sont descendus » et « le séjour des morts » sont naturels dans un registre biblique moderne. La révision proposée améliore surtout la cohérence grammaticale et évite le singulier discordant de « Son bras habitait ».
  terminology: « Séjour des morts » transmet שְׁאוֹל sans l’identifier dogmatiquement à l’enfer ni le réduire à une tombe. « Tués par l’épée » correspond au sens usuel de חַלְלֵי חָרֶב. La note maintient les possibilités lexicales de « bras », tout en signalant que le pluriel verbal peut viser collectivement les soutiens ou alliés.
  issues:
  - severity: medium
    issue: Accord singulier de « Son bras habitait » malgré le pluriel hébreu יָשָׁבוּ.
    rationale: Le texte hébreu associe le singulier « son bras » à un verbe pluriel, ce qui appelle vraisemblablement un sens collectif. En français, le singulier verbal fait disparaître cet indice syntaxique et produit une lecture moins fidèle.
  - severity: low
    issue: « Transpercés par l’épée » est trop spécifique.
    rationale: חָלָל désigne une personne tuée, notamment au combat; le terme ne requiert pas l’idée précise d’être transpercé.
  revised_text: Eux aussi sont descendus avec lui au séjour des morts, vers ceux qui ont été tués par l’épée, eux qui formaient son bras[a] et habitaient sous son ombre, au milieu des nations.
