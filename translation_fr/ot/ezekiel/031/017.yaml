  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: fr
  text: Eux aussi sont descendus avec lui au séjour des morts, vers ceux qui ont été tués par l’épée, eux qui formaient son bras[a] et habitaient sous son ombre, au milieu des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sa puissance» ou «ses alliés»; littéralement «son bras». Le verbe hébreu est au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הֵם
  choice: Eux aussi
  rationale: Exprime naturellement l’ajout de ces autres êtres au jugement déjà décrit.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Le suffixe hébreu est masculin; le français reprend naturellement le cèdre personnifié, image d’Assur dans le contexte.
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: sont descendus… au séjour des morts
  rationale: «Descendre» conserve le mouvement spatial de l’expression hébraïque; «séjour des morts» rend le shéol sans le réduire à la simple tombe ni l’assimiler à l’enfer.
- source_word: אֶל חַלְלֵי חָרֶב
  choice: auprès de ceux qui ont été transpercés par l’épée
  rationale: Rend le sens violent de חָלָל et la cause de la mort tout en restant naturel en français.
- source_word: זְרֹעוֹ
  choice: Son bras
  rationale: Conserve l’image littérale, dont le référent métaphorique peut être sa puissance ou ses alliés; l’ambiguïté est signalée en note.
- source_word: יָשְׁבוּ
  choice: habitait
  rationale: Le pluriel hébreu suggère que «bras» peut désigner collectivement les soutiens ou alliés. Le singulier français s’accorde avec l’image littérale «son bras», sans ajouter un plus-que-parfait absent du texte.
- source_word: בְצִלּוֹ
  choice: sous son ombre
  rationale: Préserve l’image de l’arbre et sa nuance de protection.
- source_word: בְתוֹךְ גּוֹיִם
  choice: au milieu des nations
  rationale: Rendu idiomatique qui conserve le cadre international du passage.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol; la tombe
  rationale: «Séjour des morts» communique le domaine des morts sans le limiter à une tombe individuelle ni lui imposer la notion plus tardive d’enfer.
- issue: Référent de זְרֹעוֹ
  choice: image littérale «son bras», avec variantes en note
  alternative: sa puissance; ses alliés
  rationale: Le texte peut évoquer la force d’Assur ou les peuples qui le soutenaient. Garder l’image dans le corps du texte préserve cette tension interprétative.
translation_notes:
  register: Français moderne, international et digne. La métaphore arboricole est maintenue par «sous son ombre». La ponctuation en deux phrases clarifie les deux propositions sans résoudre l’ambiguïté du «bras».
