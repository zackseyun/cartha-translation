source:
  edition: WLC
  text: אֲרָזִ֣ים לֹֽא עֲמָמֻ/הוּ֮ בְּ/גַן אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל סְעַפֹּתָ֔י/ו וְ/עַרְמֹנִ֥ים לֹֽא הָי֖וּ כְּ/פֹֽארֹתָ֑י/ו כָּל עֵץ֙ בְּ/גַן אֱלֹהִ֔ים לֹא דָמָ֥ה אֵלָ֖י/ו בְּ/יָפְיֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: fr
  text: Dans le jardin de Dieu[a], les cèdres ne lui faisaient pas d’ombre ; les cyprès n’égalaient pas ses branches maîtresses, et les platanes n’étaient pas comparables à ses rameaux[b]. Aucun arbre du jardin de Dieu ne l’égalait en beauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans le jardin de Dieu ». L’expression évoque l’Éden sans l’identifier explicitement.
    reason: note_explication
  - marker: b
    text: « Platanes » est le sens probable ; les traductions traditionnelles ont souvent « châtaigniers ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: les cèdres
  rationale: Équivalent français courant et précis du pluriel אֲרָזִים, adapté au parallélisme poétique.
- source_word: עֲמָמֻהוּ
  choice: ne lui faisaient pas d’ombre
  rationale: Le verbe évoque l’obscurcissement ou le fait de couvrir d’ombre. Cette formulation conserve l’image arborée sans la réduire à l’idée abstraite de rivalité.
- source_word: בְּגַן אֱלֹהִים
  choice: dans le jardin de Dieu
  rationale: Rendu formellement transparent qui préserve l’évocation édénique sans identifier explicitement le lieu à l’Éden.
- source_word: בְּרוֹשִׁים
  choice: les cyprès
  rationale: Identification moderne courante, bien que l’espèce exacte demeure incertaine.
- source_word: דָמוּ / דָמָה אֵלָיו
  choice: n’égalaient pas / ne l’égalait
  rationale: Dans ce contexte comparatif, « égaler » exprime naturellement que les autres arbres ne soutenaient pas la comparaison, tout en convenant au sommet du verset.
- source_word: סְעַפֹּתָיו
  choice: ses grandes branches
  rationale: Le terme désigne vraisemblablement les branches maîtresses; l’adjectif « grandes » permet de le distinguer naturellement de פֹארֹתָיו.
- source_word: עַרְמֹנִים
  choice: les platanes
  rationale: « Platanes » correspond à l’identification privilégiée par la lexicographie moderne; « châtaigniers » est traditionnel mais moins probable.
- source_word: פֹארֹתָיו
  choice: ses rameaux
  rationale: « Rameaux » restitue les branches ou la ramure et maintient en français la distinction avec סְעַפֹּתָיו.
- source_word: כָּל עֵץ ... לֹא
  choice: Aucun arbre
  rationale: Cette restructuration idiomatique restitue clairement la négation universelle hébraïque.
- source_word: בְּיָפְיוֹ
  choice: en beauté
  rationale: Le complément indique le domaine dans lequel aucun arbre ne lui était comparable.
theological_decisions:
- issue: Sens de « jardin de Dieu »
  choice: Conserver « jardin de Dieu » dans le texte
  alternative: « Éden » ou « paradis de Dieu »
  rationale: L’expression évoque fortement l’Éden, mais le texte hébreu dit « jardin de Dieu ». La traduction maintient donc l’image et son ouverture interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocabulaire arboricole distingue les grandes branches des rameaux sans archaïsme marqué. La répétition de « jardin de Dieu » est conservée pour respecter la structure emphatique du verset.
