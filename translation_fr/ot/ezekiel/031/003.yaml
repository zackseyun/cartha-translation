revisions:
- from: 'Voici : l’Assyrie était un cèdre du Liban[a], aux branches magnifiques, semblable à un bois qui donne de l’ombre, d’une taille imposante ; sa cime était parmi les nuages[b].'
  to: 'Voici : l’Assyrie était un cèdre au Liban[a], aux belles branches et au feuillage dense et ombreux, de haute taille ; sa cime était au milieu d’un feuillage dense[b].'
  rationale: La révision retire la comparaison ajoutée « semblable à » et rend la luxuriance ombreuse de חֹרֶשׁ מֵצַל comme une qualité du cèdre. Elle place également le sens arboricole, contextuellement premier, de עֲבֹתִים dans le texte, tout en conservant la lecture poétique « nuages » en note.
  reviewer_model: gpt-5.6-terra
