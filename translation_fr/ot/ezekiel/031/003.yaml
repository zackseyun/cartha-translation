  text: הִנֵּ֨ה אַשּׁ֜וּר אֶ֣רֶז בַּ/לְּבָנ֗וֹן יְפֵ֥ה עָנָ֛ף וְ/חֹ֥רֶשׁ מֵצַ֖ל וּ/גְבַ֣הּ קוֹמָ֑ה וּ/בֵ֣ין עֲבֹתִ֔ים הָיְתָ֖ה צַמַּרְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/003.yaml
  text: Behold[a], Assyria was a cedar in Lebanon, beautiful in branches and a forest giving shade, and lofty in height[b]; its top was among the clouds.
translation:
  language: fr
  text: 'Voici : l’Assyrie était un cèdre au Liban[a], aux belles branches et au feuillage dense et ombreux, de haute taille ; sa cime était au milieu d’un feuillage dense[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cèdre du Liban ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les nuages ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique et la vivacité prophétique de la particule, dans un registre français digne et naturel.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Désigne ici la puissance impériale comparée métaphoriquement à un arbre ; « l’Assyrie » est la forme française usuelle.
- source_word: אֶרֶז בַּלְּבָנוֹן
  choice: un cèdre du Liban
  rationale: Formulation idiomatique en français, compatible avec l’idée d’un cèdre situé au Liban ou caractéristique de celui-ci ; l’autre lecture est signalée en note.
- source_word: יְפֵה עָנָף
  choice: aux branches magnifiques
  rationale: Rend naturellement le singulier collectif עָנָף et souligne l’aspect impressionnant de la ramure.
- source_word: וְחֹרֶשׁ מֵצַל
  choice: semblable à un bois qui donne de l’ombre
  rationale: חֹרֶשׁ évoque un bois, un bosquet ou une végétation dense, tandis que מֵצַל exprime l’ombre procurée. « Semblable à » explicite avec mesure la description métaphorique, afin d’éviter d’identifier littéralement un arbre unique à une forêt.
- source_word: וּגְבַהּ קוֹמָה
  choice: d’une taille imposante
  rationale: Rend l’idée de hauteur élevée dans un français courant et digne, tout en maintenant l’image de stature impressionnante.
- source_word: וּבֵין עֲבֹתִים
  choice: parmi les nuages
  rationale: Cette compréhension convient au point culminant de l’image de hauteur, mais le terme peut aussi désigner des branches épaisses ou un feuillage dense ; l’ambiguïté est conservée en note.
- source_word: צַמַּרְתּוֹ
  choice: sa cime
  rationale: Terme français précis et naturel pour la partie la plus haute de l’arbre.
theological_decisions: []
