source:
  edition: WLC
  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: fr
  text: Au bruit de sa chute, j’ai fait trembler les nations lorsque je l’ai fait descendre au séjour des morts[a], avec ceux qui descendent dans la fosse. Tous les arbres d’Éden — les plus beaux et les meilleurs du Liban, tous ceux qui s’abreuvent d’eau — ont été consolés dans la terre d’en bas[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « vers le Shéol » ; autres traductions possibles : « dans la tombe » ou « dans le monde souterrain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ont trouvé du réconfort ». Il peut s’agir de la sombre consolation que les autres puissances déchues éprouvent en voyant ce grand arbre les rejoindre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans la terre inférieure » ou « dans la terre d’en bas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: Au bruit de sa chute
  rationale: « Bruit » convient à l’effondrement du grand arbre, tandis que « chute » conserve à la fois l’image de l’arbre abattu et celle de la ruine politique.
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: j’ai fait trembler les nations
  rationale: Cette formulation restitue la valeur causative du hifil et rend גוֹיִם par le terme général « nations ».
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: lorsque je l’ai fait descendre
  rationale: L’infinitif prépositionnel reçoit ici une valeur temporelle, et « fait descendre » préserve la forme causative.
- source_word: שְׁאוֹלָה
  choice: au séjour des morts
  rationale: Cette expression française courante désigne le domaine des morts sans le réduire à une tombe individuelle ni lui imposer une conception doctrinale ultérieure.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: Dans ce contexte, אֶת est compris dans un sens associatif. « La fosse » maintient l’image poétique de la mort.
- source_word: וַיִּנָּחֲמוּ
  choice: ont alors été consolés
  rationale: Le passif conserve la valeur du nifal et laisse subsister l’ironie sombre de la consolation éprouvée par les autres puissances déchues.
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: dans les profondeurs de la terre
  rationale: La formulation reste proche de l’expression spatiale hébraïque tout en étant naturelle en français moderne.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: Tous les arbres d’Éden
  rationale: Le rendu littéral préserve l’image arboricole qui structure tout le passage et son évocation d’Éden.
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: les arbres de choix, les meilleurs du Liban
  rationale: La tournure appositionnelle identifie ces arbres comme la sélection la plus excellente du Liban sans effacer la métaphore.
- source_word: כָּל שֹׁתֵי מָיִם
  choice: tous ceux qui s’abreuvent d’eau
  rationale: « S’abreuver » exprime naturellement l’action des arbres qui puisent l’eau tout en restant assez proche de l’hébreu « boire de l’eau ».
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: séjour des morts
  alternative: Shéol ; tombe ; monde souterrain
  rationale: « Séjour des morts » communique le concept hébraïque au lecteur francophone sans le limiter au lieu d’inhumation et sans définir plus précisément l’état des morts que ne le fait le verset.
- issue: Consolation des arbres dans le domaine des morts
  choice: Les arbres représentant les puissances déchues « ont été consolés » par la descente de ce grand arbre.
  alternative: Comprendre la consolation comme une personnification purement poétique, sans implication concernant une expérience consciente après la mort.
  rationale: La traduction conserve la personnification et sa tension théologique, sans transformer l’image en affirmation doctrinale sur l’état intermédiaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase est divisée en deux pour faciliter la lecture, et des tirets encadrent l’apposition décrivant les arbres d’Éden. Les images de la chute, de la fosse, des arbres et de l’eau sont conservées.
