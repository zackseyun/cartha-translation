revisions:
- from: Au bruit de sa chute, j’ai fait trembler les nations lorsque je l’ai fait descendre au séjour des morts[a], avec ceux qui descendent dans la fosse. Tous les arbres d’Éden — les arbres de choix, les meilleurs du Liban, tous ceux qui s’abreuvent d’eau — ont alors été consolés[b] dans les profondeurs de la terre[c].
  to: Au bruit de sa chute, j’ai fait trembler les nations lorsque je l’ai fait descendre au séjour des morts[a], avec ceux qui descendent dans la fosse. Tous les arbres d’Éden — les plus beaux et les meilleurs du Liban, tous ceux qui s’abreuvent d’eau — ont été consolés dans la terre d’en bas[c][b].
  rationale: La révision conserve la structure, les images et l’ambiguïté théologique du texte hébreu. Elle améliore l’idiomaticité de l’apposition concernant les arbres du Liban, retire un adverbe ajouté et ajuste la précision de la note sur la forme directionnelle de Shéol. Les ancres de notes sont placées sur les expressions qu’elles éclairent.
