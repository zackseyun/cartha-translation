  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: fr
  text: Les eaux l’ont fait grandir, l’abîme l’a élevé. Ses fleuves coulaient tout autour du lieu où il était planté, et il envoyait ses canaux vers tous les arbres des champs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם גִּדְּלוּהוּ
  choice: Les eaux l’ont fait grandir
  rationale: Le pluriel hébreu מַיִם désigne ici l’eau abondante; « les eaux » conserve le registre poétique. Le causatif de גדל est rendu dans le cadre immédiat de la métaphore de l’arbre.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Désigne les eaux profondes qui nourrissent l’arbre. « L’abîme » est une formulation biblique concise et intelligible en français moderne.
- source_word: רֹמְמָתְהוּ
  choice: l’a élevé
  rationale: Le causatif de רום peut signifier élever, exalter ou faire monter en hauteur. « Élevé » maintient l’ambiguïté entre croissance verticale et grandeur symbolique.
- source_word: נַהֲרֹתֶיהָ הֹלֵךְ סְבִיבוֹת
  choice: Ses fleuves coulaient tout autour
  rationale: Les suffixes féminins renvoient grammaticalement à תְּהוֹם. Avec des cours d’eau pour sujet, « coulaient » rend naturellement le participe « allant »; « tout autour » restitue סְבִיבוֹת.
- source_word: מַטָּעָהּ
  choice: du lieu où il était planté
  rationale: Le nom désigne la plantation ou le lieu planté. Cette tournure évite l’ambiguïté française de « sa plantation » tout en gardant l’image agricole.
- source_word: תְּעָלֹתֶיהָ
  choice: ses canaux
  rationale: Le terme désigne des conduits ou canaux d’irrigation issus des eaux profondes. « Canaux » est concret et naturel dans ce contexte.
- source_word: שִׁלְחָה
  choice: il envoyait
  rationale: Le sujet grammatical est l’abîme, masculin en français; l’imparfait s’accorde à la description continue du réseau d’eaux.
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: vers tous les arbres des champs
  rationale: Rendu direct de l’expression collective; « des champs » conserve l’image biblique du paysage ouvert.
theological_decisions:
- issue: Référents des pronoms dans une métaphore mêlant arbre et eaux profondes
  choice: Employer « l’ » pour l’arbre et « ses/il » pour l’abîme selon la syntaxe française
  alternative: Uniformiser tous les pronoms autour de l’arbre ou expliciter le royaume représenté
  rationale: Les suffixes féminins hébreux se rapportent à תְּהוֹם, tandis que le suffixe masculin désigne l’arbre. Le français exige un masculin pour « abîme ». La traduction respecte ces référents grammaticaux sans réduire prématurément l’arbre à son référent politique.
- issue: Portée de רֹמְמָתְהוּ
  choice: « l’a élevé »
  alternative: « l’a fait monter très haut » ou « l’a exalté »
  rationale: « Élevé » préserve la tension entre la hauteur physique de l’arbre et la grandeur politique symbolisée, sans imposer une lecture exclusivement matérielle ou théologique.
translation_notes:
  register: Français international moderne, poétique mais accessible. La structure parallèle de l’hébreu est conservée, avec des verbes idiomatiques et une distinction claire entre l’arbre et l’abîme.
