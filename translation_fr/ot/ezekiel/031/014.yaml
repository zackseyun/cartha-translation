  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: fr
  text: afin qu’aucun des arbres abreuvés par les eaux ne s’élève par sa taille, ne place sa cime parmi les nuages[a], et qu’aucun de ceux qui boivent l’eau ne se dresse aussi haut qu’eux[b]. Car ils sont tous livrés à la mort, au pays d’en bas, parmi les humains, avec ceux qui descendent dans la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu des branches épaisses » ou « parmi le feuillage touffu ». Le mot hébreu peut désigner une masse dense plutôt que les nuages.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette proposition est difficile. On peut aussi comprendre : « ne se dresse au-dessus d’eux par sa hauteur » ou « ne se tienne à leurs côtés dans sa hauteur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: afin que
  rationale: Cette tournure française naturelle conserve la valeur de but ou de résultat de l’expression hébraïque.
- source_word: כָּל עֲצֵי מַיִם
  choice: aucun des arbres nourris par les eaux
  rationale: Avec la négation, כָּל se rend naturellement par « aucun ». « Nourris par les eaux » exprime l’idée d’arbres abondamment alimentés en eau sans suggérer qu’ils poussent nécessairement sur la rive.
- source_word: יִגְבְּהוּ בְקוֹמָתָם
  choice: ne s’élève par sa haute taille
  rationale: Le verbe évoque à la fois la hauteur physique et l’élévation orgueilleuse. La formulation française maintient l’image des arbres sans réduire sa portée métaphorique.
- source_word: יִתְּנוּ אֶת צַמַּרְתָּם
  choice: ne placent pas leur cime
  rationale: צַמֶּרֶת désigne la partie la plus haute ou la couronne d’un arbre. « Cime » est précis, courant et adapté à l’image.
- source_word: אֶל בֵּין עֲבֹתִים
  choice: parmi les nuages
  rationale: עֲבֹתִים peut désigner des masses épaisses, notamment les nuages. Ce sens correspond à l’image d’une cime qui atteint les hauteurs, tandis que l’autre lecture possible est signalée en note.
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם כָּל שֹׁתֵי מָיִם
  choice: et qu’aucun de ceux qui boivent l’eau ne se dresse aussi haut qu’eux
  rationale: La syntaxe hébraïque est difficile. Cette formulation française conserve la comparaison de hauteur et la métaphore des êtres abreuvés, tout en signalant les autres analyses possibles dans une note.
- source_word: שֹׁתֵי מָיִם
  choice: ceux qui boivent l’eau
  rationale: Ce rendu proche de l’hébreu préserve la métaphore sans décider prématurément si elle vise les arbres, les souverains ou les nations.
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: car ils sont tous livrés à la mort
  rationale: Le passif de נתן exprime ici le fait d’être voué ou livré à la mort. La traduction reste solennelle sans préciser l’agent implicite.
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: au pays d’en bas
  rationale: Cette expression garde l’image spatiale du domaine inférieur sans lui imposer un terme doctrinal technique relatif à l’au-delà.
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: parmi les humains
  rationale: בְּנֵי אָדָם est une expression collective désignant l’humanité mortelle. « Les humains » en restitue naturellement le sens représentatif en français moderne.
- source_word: אֶל יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: « La fosse » conserve la métaphore funéraire et les échos bibliques de בּוֹר sans l’aplatir en « tombe ».
theological_decisions:
- issue: Portée de בְּנֵי אָדָם
  choice: parmi les humains
  alternative: parmi les fils d’Adam / parmi les mortels
  rationale: L’expression désigne collectivement les êtres humains soumis à la mort. Le choix retenu est naturel et inclusif en français, sans effacer le contraste entre l’orgueil des arbres-nations et la condition humaine.
- issue: Sens du pays inférieur et de la fosse
  choice: au pays d’en bas… dans la fosse
  alternative: dans le monde souterrain… dans la tombe
  rationale: Le texte emploie des images de descente et de mort. Les conserver évite de transformer ces expressions en une définition doctrinale plus précise de l’état des morts.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve la longue progression de la phrase hébraïque. Les images des arbres abreuvés, de la hauteur, du pays d’en bas et de la fosse sont maintenues, tandis que les deux difficultés lexicales et syntaxiques principales sont signalées en notes.
