source:
  edition: WLC
  text: בֶּן אָדָ֕ם אֱמֹ֛ר אֶל פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/אֶל הֲמוֹנ֑/וֹ אֶל מִ֖י דָּמִ֥יתָ בְ/גָדְלֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/002.yaml
  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: fr
  text: 'Fils d’homme, dis au pharaon, roi d’Égypte, et à sa multitude : « À qui ressembles-tu dans ta grandeur ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Fils d’homme
  rationale: Expression d’adresse récurrente dans Ézéchiel, rendue littéralement et naturellement en français biblique moderne.
- source_word: הֲמוֹנוֹ
  choice: toute sa multitude
  rationale: Le terme peut évoquer une foule, une masse de gens ou l’ensemble nombreux qui relève du pharaon. « Multitude » préserve cette ampleur et l’ambiguïté du référent; « toute » explicite ici la valeur collective naturelle en français.
- source_word: דָּמִיתָ
  choice: ressembles-tu
  rationale: Le verbe דמה exprime ici la ressemblance ou la comparaison; la question prépare la comparaison développée dans la suite du chapitre.
- source_word: בְגָדְלֶךָ
  choice: dans ta grandeur
  rationale: Rendu formel qui conserve la notion de grandeur, sans la réduire à la taille, à la puissance ou à la majesté seules.
theological_decisions:
- issue: Référent du pronom singulier dans la question
  choice: Conserver le singulier « tu », adressé au pharaon
  alternative: Employer un pluriel incluant le pharaon et sa multitude
  rationale: Les formes hébraïques דָּמִיתָ et גָדְלֶךָ sont au masculin singulier; la multitude est associée à l’ordre d’annoncer, tandis que la question vise grammaticalement le pharaon.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Fils d’homme » est conservée en raison de son rôle littéraire caractéristique dans Ézéchiel. La ponctuation présente la question comme le contenu du message à transmettre.
