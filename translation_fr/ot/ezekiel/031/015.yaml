id: EZK.31.15
reference: Ezekiel 31:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur DIEU : Le jour où il est descendu au shéol[a], j’ai provoqué le deuil. À cause de lui, j’ai couvert l’abîme[b], j’ai retenu ses fleuves, et les eaux abondantes ont été contenues. À cause de lui, j’ai assombri le Liban, et tous les arbres des champs ont défailli[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « shéol » désigne en hébreu le domaine des morts. On pourrait aussi traduire : « le séjour des morts » ou, selon une compréhension plus étroite, « la tombe ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « j’ai couvert l’abîme au-dessus de lui ». Le rapport exact exprimé par l’hébreu est difficile.'
    reason: textual_ambiguity
  - marker: c
    text: 'Ou : « ont langui » ; le terme hébreu évoque la faiblesse, la défaillance ou l’évanouissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Cette formulation conserve les deux éléments du titre divin tout en évitant la répétition « Seigneur SEIGNEUR » ; les petites capitales représentées ici par « DIEU » signalent le nom divin.
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: Le jour où il est descendu au shéol
  rationale: La proposition temporelle reste explicite. « Shéol » préserve le référent hébreu, le domaine des morts, sans le réduire à la tombe physique ni lui imposer la notion ultérieure d’enfer.
- source_word: הֶאֱבַלְתִּי
  choice: j’ai provoqué le deuil
  rationale: Le hifil est causatif. Cette expression française naturelle conserve cette valeur sans ajouter un objet absent de l’hébreu.
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: À cause de lui, j’ai couvert l’abîme
  rationale: « Couvrir » rend le sens ordinaire de כסה, tandis que עָלָיו est compris causalement dans cette scène de deuil cosmique. La formulation garde l’image difficile au lieu de l’expliquer.
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: j’ai retenu ses fleuves
  rationale: מנע exprime l’action de retenir ou d’empêcher. Le possessif renvoie à l’abîme, conformément au suffixe féminin hébreu renvoyant à תְּהוֹם.
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: les eaux abondantes ont été contenues
  rationale: Le passif restitue la forme hébraïque et « eaux abondantes » rend naturellement מַיִם רַבִּים.
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: À cause de lui, j’ai assombri le Liban
  rationale: Le hifil de קדר exprime ici l’obscurcissement ou l’affliction sombre. « Assombri » conserve à la fois l’image visuelle et la tonalité de deuil.
- source_word: עָלָיו עֻלְפֶּה
  choice: ont défailli
  rationale: Le nom עֻלְפֶּה évoque la défaillance, la langueur ou l’évanouissement. La verbalisation française rend naturellement la proposition nominale tout en maintenant la personnification des arbres.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: shéol
  alternative: le séjour des morts ; la tombe ; l’enfer
  rationale: La translittération garde l’étendue sémantique du terme hébreu et évite aussi bien une réduction à la sépulture qu’une identification avec des conceptions théologiques plus tardives de l’enfer.
- issue: Deuil cosmique
  choice: Maintenir la personnification poétique de l’abîme, du Liban et des arbres
  alternative: Transformer l’image en catastrophe écologique littérale ou en explication politique explicite
  rationale: Le contexte présente la création comme participant au deuil causé par la chute du grand arbre. La traduction conserve cette tension imagée sans décoder l’allégorie dans le corps du texte.
- issue: Rapport exprimé par עָלָיו
  choice: à cause de lui
  alternative: sur lui ; pour lui
  rationale: Le sens causal convient à la répétition et au contexte de lamentation, mais la note sur l’abîme reconnaît que la préposition hébraïque peut aussi être comprise spatialement.
translation_notes:
  register: Français international actuel, sobre et digne. Les passés composés donnent à la déclaration divine une narration naturelle, tandis que « abîme », « shéol » et la personnification des arbres conservent la densité poétique du texte. La répétition de « À cause de lui » reproduit le motif hébreu sans alourdir excessivement la phrase.
