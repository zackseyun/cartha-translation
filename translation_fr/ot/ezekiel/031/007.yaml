  text: וַ/יְּיִ֣ף בְּ/גָדְל֔/וֹ בְּ/אֹ֖רֶךְ דָּֽלִיּוֹתָ֑י/ו כִּֽי הָיָ֥ה שָׁרְשׁ֖/וֹ אֶל מַ֥יִם רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/007.yaml
  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
translation:
  language: fr
  text: Il était beau par sa grandeur et par la longueur de ses branches, car sa racine se trouvait près d’eaux abondantes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreuses eaux ».
    reason: Alternative lexicale plus littérale pour מַיִם רַבִּים.
lexical_decisions:
- source_word: וַיְּיִף
  choice: il était magnifique
  rationale: Le verbe יפה au qal décrit la beauté et l’aspect imposant de l’arbre. « Magnifique » est naturel et digne dans ce contexte, sans imposer l’idée d’un changement d’état.
- source_word: בְּגָדְלוֹ
  choice: par sa grandeur
  rationale: גדל exprime ici la grandeur ou l’ampleur. La préposition ב est rendue comme indiquant ce en quoi ou par quoi l’arbre apparaît magnifique.
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: par la longueur de ses branches
  rationale: La formulation conserve le parallélisme avec « par sa grandeur » tout en employant le terme courant « branches » pour דָּלִיּוֹת.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de la croissance et de la beauté décrites; « car » convient au registre narratif et poétique.
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: sa racine se trouvait près de
  rationale: Littéralement, la racine « était vers/auprès de » l’eau. Cette traduction exprime la proximité sans transformer explicitement la racine en sujet d’un mouvement.
- source_word: מַיִם רַבִּים
  choice: eaux abondantes
  rationale: L’expression désigne une grande quantité d’eau. « Eaux abondantes » communique naturellement cette abondance, tandis que la formulation plus littérale est signalée en note.
