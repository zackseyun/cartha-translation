  text: יָפֶ֣ה עֲשִׂיתִ֔י/ו בְּ/רֹ֖ב דָּֽלִיּוֹתָ֑י/ו וַ/יְקַנְאֻ֨/הוּ֙ כָּל עֲצֵי עֵ֔דֶן אֲשֶׁ֖ר בְּ/גַ֥ן הָ/אֱלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: fr
  text: Je l’ai rendu beau par l’abondance de ses branches[a], et tous les arbres d’Éden qui étaient dans le jardin de Dieu l’enviaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom masculin peut renvoyer à l’arbre de l’image ou au référent humain et politique qu’il représente.
    reason: alternative_reading
lexical_decisions:
- source_word: יָפֶה
  choice: magnifique
  rationale: L’adjectif prédicatif décrit la beauté et la splendeur de l’arbre. « Magnifique » convient au registre poétique et exprime davantage que la simple beauté physique.
- source_word: עֲשִׂיתִיו
  choice: Je l’avais rendu
  rationale: Le qal accompli à la première personne avec suffixe masculin singulier présente Dieu comme celui qui a donné cette beauté à l’arbre. Le plus-que-parfait s’insère naturellement dans le discours rétrospectif du contexte.
- source_word: בְּרֹב דָּלִיּוֹתָיו
  choice: par l’abondance de ses branches
  rationale: « Par » rend le rapport entre la beauté et la profusion des branches sans trancher excessivement entre moyen et caractéristique. « Abondance » conserve l’idée de רֹב, et « branches » est clair en français actuel.
- source_word: וַיְקַנְאֻהוּ
  choice: le jalousaient
  rationale: Le verbe קנא exprime ici la jalousie ou l’envie. « Jalousaient » conserve la force affective de l’hébreu et permet au pronom masculin de maintenir à la fois l’image de l’arbre et son référent politique.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: tous les arbres d’Éden
  rationale: Cette formulation naturelle conserve l’expression collective et l’imagerie édénique.
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: qui étaient dans le jardin de Dieu
  rationale: La traduction reproduit simplement la proposition relative et garde l’expression biblique élevée « jardin de Dieu ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans la métaphore
  choice: Employer « le » et « ses », compatibles en français avec « l’arbre » sous-entendu et avec le référent politique masculin.
  alternative: Expliciter uniquement l’arbre ou, à l’inverse, Assur/le roi.
  rationale: L’hébreu maintient l’image de l’arbre tout en visant Assur derrière elle. Le genre masculin du mot français « arbre » permet de préserver cette superposition sans la résoudre.
- issue: Valeur de la beauté produite par Dieu
  choice: « rendu magnifique par l’abondance de ses branches »
  alternative: « fait beau avec ses nombreuses branches »
  rationale: La formulation choisie attribue clairement à Dieu la splendeur de l’arbre sans préciser au-delà du texte si les branches sont l’instrument, la cause ou la manifestation de cette beauté.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’imagerie poétique du cèdre et la double référence rendue possible par le masculin français.
