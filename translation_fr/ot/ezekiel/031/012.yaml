revisions:
- from: Des étrangers, hommes impitoyables parmi les nations, l’ont abattu et abandonné[a]. Ses branches sont tombées sur les montagnes et dans toutes les vallées ; ses rameaux se sont brisés dans tous les lits de cours d’eau du pays[b]. Tous les peuples de la terre sont alors descendus de son ombre et l’ont abandonné[c].
  to: Des étrangers, des hommes impitoyables issus des nations, l’ont abattu et abandonné[a]. Ses branches sont tombées sur les montagnes et dans toutes les vallées ; ses rameaux ont été brisés dans tous les lits des cours d’eau du pays[b]. Alors tous les peuples de la terre sont descendus de son ombre et l’ont abandonné[c].
  rationale: Les corrections resserrent le lien syntaxique entre « étrangers » et « hommes impitoyables issus des nations », rendent explicitement le passif hébreu pour les rameaux, et améliorent légèrement l’idiome français. La note c évite d’identifier plus précisément un dirigeant que le verset lui-même ne le fait, tout en conservant la portée politique de l’image.
