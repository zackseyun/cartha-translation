  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: fr
  text: Des étrangers, des hommes impitoyables issus des nations, l’ont abattu et abandonné[a]. Ses branches sont tombées sur les montagnes et dans toutes les vallées ; ses rameaux ont été brisés dans tous les lits des cours d’eau du pays[b]. Alors tous les peuples de la terre sont descendus de son ombre et l’ont abandonné[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi être rendu par « délaissé » ou « laissé là ». Il est répété à la fin du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « dans tous les ravins du pays » ou « dans tous les lits de torrents du pays ».'
    reason: lexical_alternative
  - marker: c
    text: Dans l’image développée par le chapitre, l’arbre évoque l’Assyrie ; le texte continue néanmoins à le désigner comme un arbre.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: l’ont abattu
  rationale: Dans la métaphore de l’arbre, כרת désigne naturellement l’action d’abattre ou de couper un arbre. « Abattre » est précis et idiomatique en français.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le mot désigne ici des personnes étrangères, dans un contexte de puissances venues d’autres nations.
- source_word: עָרִיצֵי גוֹיִם
  choice: hommes impitoyables parmi les nations
  rationale: עָרִיץ évoque des êtres violents, redoutables ou impitoyables. Cette formulation reste naturelle sans introduire le superlatif que l’hébreu n’exprime pas explicitement.
- source_word: וַיִּטְּשֻׁהוּ
  choice: abandonné
  rationale: נטש signifie laisser, délaisser ou abandonner. « Abandonner » convient aux deux occurrences et rend clairement leur répétition.
- source_word: אֶל הֶהָרִים וּבְכָל גֵּאָיוֹת
  choice: sur les montagnes et dans toutes les vallées
  rationale: Avec la chute des branches, אֶל indique ici leur point d’arrivée sur les montagnes ; גֵּאָיוֹת désigne des vallées ou dépressions.
- source_word: דָלִיּוֹתָיו
  choice: ses branches
  rationale: Le terme désigne les branches étendues ou pendantes de l’arbre. « Branches » est clair et courant.
- source_word: פֹארֹתָיו
  choice: ses rameaux
  rationale: Le mot désigne des branches ou rameaux feuillus. « Rameaux » maintient une distinction lexicale avec דָלִיּוֹתָיו sans obscurcir le texte.
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: tous les lits de cours d’eau du pays
  rationale: אֲפִיקִים peut désigner des chenaux, des lits de torrents ou des cours d’eau. La formulation choisie rend concrètement le relief évoqué ; הָאָרֶץ est ici compris dans son sens topographique de « pays ».
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: sont alors descendus de son ombre
  rationale: La traduction conserve le verbe spatial ירד, « descendre », et l’image des peuples quittant l’ombre protectrice de l’arbre tombé.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: עַמִּים signifie « peuples » ; dans le contexte international de l’oracle, « la terre » exprime mieux l’ampleur du tableau que « le pays ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans la métaphore de l’arbre
  choice: Maintenir au premier plan l’arbre abattu par les pronoms et possessifs français
  alternative: Expliciter le souverain ou l’Assyrie représentés par l’arbre
  rationale: Le verset poursuit directement l’image du grand arbre, tandis que le contexte du chapitre en donne le référent politique. Le français emploie naturellement le masculin pour « arbre » ou « cèdre », ce qui permet de conserver ensemble l’image et son possible référent sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique reste perceptible, mais les termes techniques ou archaïques sont évités. La répétition d’« abandonné » est conservée parce qu’elle correspond à la répétition intentionnelle du verbe hébreu.
