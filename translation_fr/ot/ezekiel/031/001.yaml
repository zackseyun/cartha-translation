source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בַּ/שְּׁלִישִׁ֖י בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/001.yaml
  text: And it happened in the eleventh year[a], in the third month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La onzième année, le troisième mois, le premier jour du mois, la parole de Yahweh[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH. Traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahvé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: La onzième année… la parole… me fut adressée
  rationale: La formule narrative hébraïque est intégrée à une phrase française naturelle, sans l’archaïsme « il arriva que ».
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: La onzième année
  rationale: Rendu idiomatique de la formule de datation hébraïque.
- source_word: בַּשְּׁלִישִׁי
  choice: le troisième mois
  rationale: Le mot « mois », sous-entendu en hébreu, est explicité pour la clarté.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Expression calendaire française claire et précise.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Formule prophétique française naturelle qui conserve l’idée d’une parole divine parvenant au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin YHWH, avec une note signalant la traduction traditionnelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le discours direct qui suit, sans imposer le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin YHWH. « Yahweh » le représente directement, tandis que la note conserve l’usage traditionnel français.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve la précision de la date et la formule prophétique, tout en évitant le calque peu naturel « disant ».
