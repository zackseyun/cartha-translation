source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur DIEU : Parce que tu as grandi en hauteur, et qu’il a placé sa cime parmi les frondaisons épaisses[a], et que son cœur s’est élevé à cause de sa hauteur[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les branches touffues ».'
    reason: Le terme hébreu désigne une végétation dense, des frondaisons ou des branches épaisses.
  - marker: b
    text: L’hébreu passe ici de « tu » à « il » et « son ».
    reason: La note rend transparent le changement de personne grammaticale conservé dans la traduction.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Cette forme française conventionnelle représente les deux éléments du titre divin et évite la répétition « Seigneur SEIGNEUR ».
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: tu es devenu grand par la taille
  rationale: Le verbe exprime l’élévation ou la croissance en hauteur, et קוֹמָה désigne la taille. La formulation conserve l’image concrète de l’arbre sans anticiper explicitement l’orgueil évoqué ensuite.
- source_word: וַיִּתֵּן צַמַּרְתּוֹ
  choice: qu’il a placé sa cime
  rationale: Dans cette construction, נתן signifie « placer »; צַמֶּרֶת désigne la partie supérieure ou la cime d’un arbre. Les formes hébraïques sont à la troisième personne du masculin singulier.
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: parmi les frondaisons épaisses
  rationale: עֲבוֹתִים peut désigner une végétation dense, des branches touffues ou d’épaisses frondaisons. Cette traduction retient le sens végétal direct tout en signalant en note l’autre interprétation contextuelle, « les nuages ».
- source_word: וְרָם לְבָבוֹ
  choice: et que son cœur s’est élevé
  rationale: La formulation conserve l’image hébraïque du cœur qui s’élève, expression qui évoque ici l’orgueil sans remplacer la métaphore par une explication.
- source_word: בְּגָבְהוֹ
  choice: à cause de sa hauteur
  rationale: La préposition ב peut ici marquer la cause ou la circonstance. « À cause de » rend clairement le lien entre la hauteur du personnage-arbre et l’élévation de son cœur.
theological_decisions:
- issue: Changement de personne grammaticale dans le verset
  choice: Conserver le passage de la deuxième personne (« tu ») à la troisième personne (« il », « son »).
  alternative: Uniformiser tout le verset à la deuxième personne ou à la troisième personne.
  rationale: Le texte hébreu passe réellement de גָּבַהְתָּ, à la deuxième personne, à וַיִּתֵּן, צַמַּרְתּוֹ et לְבָבוֹ, à la troisième personne. Le conserver respecte la forme du texte et n’efface pas sa tension entre interpellation directe et description.
- issue: Rapport entre la hauteur et l’orgueil
  choice: Garder l’image « son cœur s’est élevé » et rendre בְּגָבְהוֹ par « à cause de sa hauteur ».
  alternative: 'Expliciter entièrement : « il s’est enorgueilli de sa grandeur ».'
  rationale: La traduction retenue permet de percevoir l’orgueil tout en maintenant le jeu littéraire entre l’élévation physique de l’arbre et l’élévation intérieure du cœur.
translation_notes:
  register: Français international actuel, digne et accessible. La construction causale reste ouverte, puisque la conséquence du « parce que » se poursuit au verset suivant. Le changement abrupt de personne est volontairement conservé et expliqué en note.
