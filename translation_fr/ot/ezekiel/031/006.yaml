  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: fr
  text: Dans ses branches, tous les oiseaux du ciel faisaient leur nid ; sous ses rameaux, tous les animaux sauvages des champs mettaient bas ; et à son ombre habitaient toutes les nombreuses nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: Dans ses branches
  rationale: סְעַפּוֹת désigne les ramifications ou les grosses branches de l’arbre. « Dans ses branches » est naturel en français et convient à l’image des oiseaux qui y nichent.
- source_word: קִנְנוּ
  choice: faisaient leur nid
  rationale: Le verbe קנן évoque précisément l’action de nicher. La tournure française explicite et naturelle conserve cette image.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: tous les oiseaux du ciel
  rationale: עוֹף est ici un collectif désignant les oiseaux ou créatures volantes. « Les oiseaux du ciel » rend naturellement l’expression hébraïque.
- source_word: וְתַחַת פֹּארֹתָיו
  choice: sous ses rameaux
  rationale: פֹּארוֹת désigne des branches étendues ou feuillues. « Rameaux » maintient une légère distinction lexicale avec סְעַפּוֹת sans alourdir la phrase.
- source_word: יָלְדוּ
  choice: mettaient bas
  rationale: ילד signifie enfanter ou donner naissance. Pour des animaux, « mettre bas » est l’expression française précise et idiomatique.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: tous les animaux sauvages
  rationale: חַיַּת הַשָּׂדֶה désigne couramment les animaux vivant à l’état sauvage. Cette formulation est claire en français moderne.
- source_word: וּבְצִלּוֹ
  choice: à son ombre
  rationale: צֵל peut désigner l’ombre ou l’abri ombragé. « À son ombre » conserve à la fois l’image de l’arbre et sa nuance protectrice.
- source_word: יֵשְׁבוּ
  choice: habitaient
  rationale: ישב signifie ici demeurer ou habiter, plutôt que simplement s’asseoir. « Habitaient » convient au registre soutenu du passage.
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: toutes ces nombreuses nations
  rationale: La combinaison כֹּל avec גּוֹיִם רַבִּים souligne la totalité d’un grand nombre de nations. « Toutes ces nombreuses nations » conserve les deux éléments tout en restant idiomatique.
theological_decisions:
- issue: Métaphore de l’arbre offrant un abri impérial
  choice: Conserver directement l’image de l’arbre et des nations habitant à son ombre.
  alternative: Identifier explicitement l’arbre à l’Assyrie ou à un empire dans le corps du verset.
  rationale: Le contexte développe cette identification, mais le verset lui-même poursuit la métaphore. La traduction ne doit pas remplacer l’image par son interprétation.
translation_notes:
  register: Français moderne, digne et accessible. L’imparfait rend naturellement la description continue de la grandeur passée de l’arbre. Le parallélisme ternaire de l’hébreu est préservé au moyen de points-virgules.
