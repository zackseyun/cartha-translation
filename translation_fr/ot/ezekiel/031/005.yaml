  text: עַל כֵּן֙ גָּבְהָ֣א קֹמָת֔/וֹ מִ/כֹּ֖ל עֲצֵ֣י הַ/שָּׂדֶ֑ה וַ/תִּרְבֶּ֨ינָה סַֽרְעַפֹּתָ֜י/ו וַ/תֶּאֱרַ֧כְנָה פארת/ו מִ/מַּ֥יִם רַבִּ֖ים בְּ/שַׁלְּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
translation:
  language: fr
  text: C’est pourquoi sa hauteur dépassa celle de tous les arbres de la campagne ; ses grandes branches se multiplièrent et ses rameaux s’allongèrent grâce aux eaux abondantes, à mesure qu’il se déployait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans son envoi » ou « dans son extension » ; l’objet du verbe n’est pas exprimé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ מִכֹּל
  choice: sa hauteur dépassa celle de tous
  rationale: La construction comparative avec מִן indique que sa hauteur excédait celle des autres arbres ; « dépassa » rend naturellement cette élévation comparative.
- source_word: עֲצֵי הַשָּׂדֶה
  choice: les arbres des champs
  rationale: Expression française claire qui conserve l’image littérale du domaine ouvert ou cultivé.
- source_word: סַרְעַפֹּתָיו
  choice: ses grandes branches
  rationale: Le terme désigne les ramifications principales ; « grandes branches » le distingue du terme suivant sans recourir au mot plus littéraire « ramures ».
- source_word: וַתִּרְבֶּינָה
  choice: se multiplièrent
  rationale: Conserve le sens d’accroissement numérique exprimé par רבה.
- source_word: פארתו
  choice: ses rameaux
  rationale: « Rameaux » convient aux branches plus fines ou feuillues et maintient la distinction avec סַרְעַפֹּתָיו.
- source_word: וַתֶּאֱרַכְנָה
  choice: s’allongèrent
  rationale: Rend directement le sens de devenir long et demeure naturel pour des rameaux.
- source_word: מִמַּיִם רַבִּים
  choice: grâce aux eaux abondantes
  rationale: Le מִן exprime ici la source ou la cause de la croissance ; « grâce à » restitue cette causalité dans un français fluide.
- source_word: בְּשַׁלְּחוֹ
  choice: lorsqu’il les déploya
  rationale: Le verbe signifie littéralement « dans son action d’envoyer/étendre » et son objet reste implicite. Le pronom « les » renvoie naturellement aux rameaux, tandis que la note préserve l’ellipse hébraïque.
