revisions:
- from: Je l’ai livré au pouvoir d’un puissant parmi les nations ; il agira certainement contre lui.[a] Je l’ai chassé à cause de sa méchanceté.
  to: Je l’ai livré au pouvoir d’un puissant parmi les nations[a] ; il agira assurément contre lui. Je l’ai chassé selon sa méchanceté.
  rationale: La révision rétablit la nuance proportionnelle de כְּרִשְׁעוֹ et replace la note sur l’expression אֵיל גּוֹיִם, dont elle explicite l’alternative sans nommer un souverain historique absent du verset. L’action hostile reste formulée avec retenue tout en rendant l’emphase verbale.
