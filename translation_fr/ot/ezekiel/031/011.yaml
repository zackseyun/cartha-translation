source:
  edition: WLC
  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
translation:
  language: fr
  text: Je l’ai livré au pouvoir d’un puissant parmi les nations[a] ; il agira assurément contre lui. Je l’ai chassé selon sa méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souverain des nations ». L’expression hébraïque peut désigner un dirigeant puissant parmi les nations.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: Je l’ai livré
  rationale: 'Le verbe נתן, avec Dieu pour sujet et l’arbre représentant l’Assyrie pour objet, exprime ici naturellement une action passée : Dieu l’a remis au pouvoir d’un autre. « Livré » convient au contexte judiciaire sans ajouter d’idée étrangère.'
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: L’expression hébraïque signifie littéralement « dans la main de » et désigne le fait de placer quelqu’un sous l’autorité ou le contrôle d’un autre. « Au pouvoir de » rend clairement cet idiome en français moderne.
- source_word: אֵיל גּוֹיִם
  choice: un puissant parmi les nations
  rationale: אֵיל désigne ici un être puissant, vraisemblablement un souverain, sans que celui-ci soit explicitement nommé. Cette formulation conserve la portée générique et l’ambiguïté du texte.
- source_word: עָשׂוֹ יַעֲשֶׂה לֹו
  choice: il agira certainement contre lui
  rationale: L’infinitif absolu suivi de l’imparfait du même verbe renforce la certitude de l’action. « Certainement » restitue cette insistance, tandis que « contre lui » explicite sobrement la valeur hostile indiquée par le contexte.
- source_word: כְּרִשְׁעוֹ
  choice: à cause de sa méchanceté
  rationale: La préposition כ peut marquer la correspondance entre la faute et le jugement. En français courant, « à cause de » exprime clairement le motif du bannissement, même si « selon sa méchanceté » serait plus formellement proche.
- source_word: גֵּרַשְׁתִּהוּ
  choice: Je l’ai chassé
  rationale: גרש signifie chasser ou expulser. « Chassé » est naturel, vigoureux et préserve l’image d’une exclusion de sa place et de son rang.
theological_decisions:
- issue: Identification de l’agent appelé אֵיל גּוֹיִם
  choice: « un puissant parmi les nations », sans identification historique explicite
  alternative: « le souverain des nations » ou une identification directe au roi de Babylone
  rationale: Le contexte peut viser le roi de Babylone, mais ce verset ne le nomme pas. La traduction conserve donc la désignation générique du texte hébreu.
- issue: Rapport entre la méchanceté et l’expulsion
  choice: « à cause de sa méchanceté »
  alternative: « selon sa méchanceté » ou « comme sa méchanceté le méritait »
  rationale: Le texte établit un rapport entre la faute et le jugement. La formulation choisie transmet clairement la causalité sans développer explicitement une théorie de rétribution que le verset laisse implicite.
translation_notes:
  register: Français moderne, international et digne. L’idiome « dans la main de » est rendu par « au pouvoir de » pour être immédiatement compréhensible. La formulation reste proche de l’image judiciaire et évite de nommer le roi de Babylone, que le verset ne désigne pas explicitement.
