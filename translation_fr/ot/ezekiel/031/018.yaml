  variant: modern international French
source:
  edition: WLC
  text: אֶל מִ֨י דָמִ֥יתָ כָּ֛כָה בְּ/כָב֥וֹד וּ/בְ/גֹ֖דֶל בַּ/עֲצֵי עֵ֑דֶן וְ/הוּרַדְתָּ֨ אֶת עֲצֵי עֵ֜דֶן אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֨וֹךְ עֲרֵלִ֤ים תִּשְׁכַּב֙ אֶת חַלְלֵי חֶ֔רֶב ה֤וּא פַרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: fr
  text: À qui ressemblais-tu donc par ta gloire et ta grandeur, parmi les arbres d’Éden ? Pourtant, on te fera descendre avec les arbres d’Éden dans le pays d’en bas[a]. Tu giseras parmi les incirconcis, avec ceux que l’épée a transpercés. Voilà Pharaon et toute sa multitude — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre inférieure » ou « le séjour des morts ». L’hébreu désigne le domaine situé en bas, le lieu des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָמִיתָ כָּכָה
  choice: ressemblais-tu donc
  rationale: Le verbe exprime une comparaison rhétorique. « Donc » rend sobrement la nuance emphatique de כָּכָה sans produire le tour lourd « ressemblais-tu ainsi ».
- source_word: כָבוֹד וּבְגֹדֶל
  choice: par ta gloire et ta grandeur
  rationale: Ces termes évoquent à la fois la splendeur royale, l’importance et les proportions majestueuses de l’arbre figurant la puissance impériale.
- source_word: עֲצֵי עֵדֶן
  choice: les arbres d’Éden
  rationale: La formulation littérale conserve la métaphore des arbres développée dans tout le chapitre.
- source_word: וְהוּרַדְתָּ
  choice: on te fera descendre
  rationale: Cette tournure française naturelle rend la forme causative passive et la perspective prophétique du jugement à venir.
- source_word: אֶרֶץ תַּחְתִּית
  choice: le pays d’en bas
  rationale: L’expression désigne le domaine inférieur, associé ici au séjour des morts, sans en préciser excessivement la géographie théologique.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: parmi les incirconcis
  rationale: La traduction conserve la valeur identitaire et déshonorante de l’expression dans les oracles de jugement d’Ézéchiel.
- source_word: תִּשְׁכַּב
  choice: tu giseras
  rationale: « Gésir » exprime clairement la position d’un mort dans ce contexte, sans ajouter une idée de repos paisible.
- source_word: חַלְלֵי חֶרֶב
  choice: ceux que l’épée a transpercés
  rationale: Cette formulation garde l’image concrète de morts frappés ou transpercés par l’épée.
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: Voilà Pharaon et toute sa multitude
  rationale: « Voilà » donne à la formule récapitulative une force démonstrative naturelle en français; « multitude » rend le vaste ensemble associé à Pharaon.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » préserve le nom divin יהוה et évite le redoublement « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Sens de אֶרֶץ תַּחְתִּית
  choice: le pays d’en bas
  alternative: le séjour des morts / la terre inférieure
  rationale: Le contexte renvoie au domaine des morts, mais la traduction principale maintient l’image spatiale et l’indétermination de l’hébreu; la note explicite la référence sans imposer une géographie doctrinale plus précise.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Le choix distingue le titre אֲדֹנָי du nom personnel יהוה et préserve ce dernier sous la forme « Yahweh ».
- issue: Portée de « parmi les incirconcis »
  choice: conserver l’expression sans l’expliciter dans le texte
  alternative: parmi ceux qui meurent dans la honte
  rationale: L’expression porte ici une connotation de honte et d’exclusion, mais la paraphraser effacerait son langage historique et son lien avec le contexte d’Ézéchiel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve l’adresse directe et le mouvement descendant de l’oracle. « Giseras » est légèrement littéraire, mais précis et courant dans un contexte de mort. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
