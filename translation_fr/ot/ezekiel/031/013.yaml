  text: עַל מַפַּלְתּ֥/וֹ יִשְׁכְּנ֖וּ כָּל ע֣וֹף הַ/שָּׁמָ֑יִם וְ/אֶל פֹּארֹתָ֣י/ו הָי֔וּ כֹּ֖ל חַיַּ֥ת הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
translation:
  language: fr
  text: Sur son tronc abattu[a] habiteront tous les oiseaux du ciel, et sur ses branches[b] seront tous les animaux des champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur sa chute ». Le nom hébreu peut désigner la chute elle-même ou ce qui est tombé ; l’image de l’arbre dans le contexte favorise ici le sens concret « tronc abattu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses grandes branches » ou « ses ramures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: son tronc abattu
  rationale: Le nom dérivé de נפל peut désigner la chute ou ce qui est tombé. Dans l’image du cèdre abattu, « tronc abattu » conserve concrètement la métaphore arboricole, sans effacer la possibilité plus abstraite signalée en note.
- source_word: יִשְׁכְּנוּ
  choice: habiteront
  rationale: שׁכן exprime l’idée de demeurer ou de s’installer. « Habiteront » est naturel, digne et évoque les oiseaux qui prennent demeure sur l’arbre tombé.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Cette expression française courante restitue fidèlement le syntagme hébreu et convient au registre prophétique.
- source_word: פֹּארֹתָיו
  choice: ses branches
  rationale: Le terme désigne les grandes branches étendues d’un arbre. « Branches » est clair en français moderne; « ramures » demeure une possibilité plus littéraire.
- source_word: הָיוּ
  choice: se tiendront
  rationale: Le qatal est compris avec une valeur future dans cette description prophétique, parallèlement à יִשְׁכְּנוּ. « Se tiendront » rend idiomatiquement la présence des animaux sur les branches.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux des champs
  rationale: Cette formulation garde la tournure biblique tout en restant immédiatement compréhensible; le contexte suggère des animaux sauvages sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: עַל ... וְאֶל
  choice: Sur ... et sur
  rationale: Le second terme signifie formellement « vers/à », mais, avec le verbe être et l’image d’animaux occupant les branches, « sur » exprime naturellement la relation spatiale en français.
theological_decisions: []
translation_notes:
