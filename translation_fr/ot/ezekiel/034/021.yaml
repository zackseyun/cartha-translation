  yaml_path: translation/ot/ezekiel/034/021.yaml
  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: fr
  text: Parce que vous poussez avec le flanc et l’épaule, et que vous encornez de vos cornes toutes les faibles, jusqu’à ce que vous les ayez dispersées au-dehors,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד וּבְכָתֵף
  choice: du flanc et de l’épaule
  rationale: Conserve l’imagerie pastorale concrète et le parallélisme des deux parties du corps employées pour bousculer.
- source_word: תְּנַגְּחוּ
  choice: vous avez frappé de vos cornes
  rationale: Exprime clairement l’action de donner des coups de corne sans introduire le sens moderne figuré de « charger ».
- source_word: הַנַּחְלוֹת
  choice: celles qui étaient faibles
  rationale: Le participe désigne les bêtes faibles ou malades; « faibles » convient au contexte et reste naturel en français.
- source_word: אֶל־הַחוּצָה
  choice: au-dehors
  rationale: Rend la direction vers l’extérieur et fait écho à la dispersion hors du troupeau.
theological_decisions:
- issue: Référent des pronoms féminins
  choice: les / celles
  alternative: omettre le complément après « pousser » et employer « tous les faibles »
  rationale: Le féminin hébreu renvoie aux brebis du troupeau; le français maintient ce référent sans transformer prématurément la métaphore en désignation humaine.
- issue: Valeur temporelle des verbes
  choice: passé composé
  alternative: présent
  rationale: Les formes hébraïques décrivent ici les actes ayant conduit à la dispersion; le passé composé s’accorde naturellement avec « jusqu’à » et la conséquence accomplie.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve sa dépendance syntaxique introduite par « Parce que », comme dans le texte source, en vue de la suite du discours divin.
