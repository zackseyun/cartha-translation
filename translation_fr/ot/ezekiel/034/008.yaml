source:
  edition: WLC
  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: fr
  text: Aussi vrai que je suis vivant — déclare le Seigneur Yahweh —, puisque mon troupeau est devenu une proie et qu’il est devenu la nourriture de toutes les bêtes sauvages, faute de berger, et que mes bergers n’ont pas recherché mon troupeau, mais se sont nourris eux-mêmes[a] et n’ont pas nourri mon troupeau…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les bergers se sont fait paître eux-mêmes ». L’expression signifie qu’ils ont veillé à leurs propres intérêts plutôt qu’à ceux du troupeau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֜נִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formule française naturelle conserve la force solennelle du serment divin.
- source_word: נְאֻ֣ם אֲדֹנָ֣י יְהוִ֗ה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, tandis que « Yahweh » représente explicitement le nom divin dans le titre composé.
- source_word: אִם לֹ֣א
  choice: '[force d’assertion intégrée à la phrase introduite par « parce que »]'
  rationale: Après la formule de serment, אִם לֹא renforce l’affirmation. En français, la solennité de « Aussi vrai que je suis vivant » et la construction suspendue rendent cette valeur sans introduire un conditionnel trompeur.
- source_word: יַעַן הֱיוֹת
  choice: parce que … est devenu
  rationale: La tournure exprime la cause du jugement annoncé et l’infinitif הֱיוֹת est naturellement rendu par « est devenu ».
- source_word: צֹאנִי
  choice: mon troupeau
  rationale: Le collectif « troupeau » convient à la métaphore pastorale et permet de conserver la répétition du texte hébreu.
- source_word: לָבַז
  choice: une proie
  rationale: Dans le contexte des bêtes sauvages qui dévorent le troupeau, « proie » exprime directement ce qui est livré à la prédation; « butin » reste lexicalement possible mais convient moins bien à l’image immédiate.
- source_word: לְאָכְלָה לְכָל חַיַּת הַשָּׂדֶה
  choice: a servi de nourriture à toutes les bêtes sauvages
  rationale: Cette formulation française claire rend l’idée d’être livré comme nourriture aux animaux sauvages; le pluriel collectif est plus naturel que « chaque bête des champs ».
- source_word: מֵאֵין רֹעֶה
  choice: faute de berger
  rationale: Expression concise qui conserve à la fois la circonstance et la portée causale de l’absence d’un berger.
- source_word: וְלֹא דָרְשׁוּ רֹעַי אֶת צֹאנִי
  choice: mes bergers n’ont pas recherché mon troupeau
  rationale: « Rechercher » garde le sens concret de דרשׁ sans élargir silencieusement le verbe au sens général de « prendre soin de ».
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: les bergers se sont nourris eux-mêmes
  rationale: La tournure rend le sens réflexif contextuel et maintient le jeu de contraste entre les bergers qui pourvoient à leurs intérêts et le troupeau qu’ils ne nourrissent pas.
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: au lieu de nourrir mon troupeau
  rationale: Cette formulation idiomatique fait ressortir l’opposition explicite entre l’intérêt personnel des bergers et leur devoir négligé, tout en gardant le champ lexical de la nourriture.
theological_decisions:
- issue: Représentation du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente le nom propre présent dans le texte source et évite de le remplacer par un titre; « Seigneur » rend אֲדֹנָי.
- issue: Référent des « bergers »
  choice: Conserver l’image sans expliciter leur identité politique ou religieuse
  alternative: les dirigeants d’Israël
  rationale: Le contexte peut viser les responsables du peuple, mais le verset les désigne métaphoriquement comme des bergers; l’explicitation réduirait la portée et résoudrait ce que le texte laisse à son contexte.
- issue: Sens réflexif de וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: se sont nourris eux-mêmes
  alternative: se sont fait paître eux-mêmes
  rationale: Le contexte oppose leur avantage personnel au soin du troupeau. La traduction choisie exprime l’accusation sans lui ajouter une doctrine particulière.
translation_notes:
  register: Français moderne, international et digne, avec une cadence prophétique soutenue. La longue phrase reste suspendue par les points de suspension, puisque le serment et son accusation se poursuivent au verset suivant. Le marqueur [a] figure dans le texte principal.
