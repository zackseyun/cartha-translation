revisions:
- from: Aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, parce que mon troupeau est devenu une proie et qu’il a servi de nourriture à toutes les bêtes sauvages, faute de berger, parce que mes bergers n’ont pas recherché mon troupeau, mais se sont nourris eux-mêmes[a] au lieu de nourrir mon troupeau…
  to: Aussi vrai que je suis vivant — déclare le Seigneur Yahweh —, puisque mon troupeau est devenu une proie et qu’il est devenu la nourriture de toutes les bêtes sauvages, faute de berger, et que mes bergers n’ont pas recherché mon troupeau, mais se sont nourris eux-mêmes[a] et n’ont pas nourri mon troupeau…
  rationale: La révision conserve la construction suspendue du serment, qui se poursuit au verset suivant. Elle rend plus explicitement le parallélisme verbal hébreu (« est devenu ... est devenu »), maintient la coordination accusatrice finale, et ajuste l’incise ainsi que la note pour un français moderne et une description philologiquement prudente.
