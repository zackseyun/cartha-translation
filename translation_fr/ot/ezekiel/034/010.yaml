source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Me voici contre les bergers. Je leur redemanderai mon troupeau[a] et je les empêcherai de le faire paître. Ces bergers ne le feront plus paître. J’arracherai mon troupeau de leur bouche[b], et il ne leur servira plus de nourriture.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je réclamerai mon troupeau de leur main ». L’expression évoque à la fois la reprise du troupeau et l’obligation, pour les bergers, d’en rendre compte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de leur bouche ». Cette image présente les bergers comme ceux qui dévorent le troupeau au lieu de le protéger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי אֶל
  choice: Me voici contre
  rationale: Conserve la formule prophétique solennelle et exprime clairement l’opposition divine.
- source_word: הָרֹעִים
  choice: les bergers
  rationale: Maintient la métaphore directrice du chapitre au lieu de l’expliciter par « dirigeants » ou « responsables ».
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: Je leur redemanderai mon troupeau
  rationale: « Redemander » exprime à la fois la réclamation de ce qui appartient à Dieu et la responsabilité des bergers; la note conserve l’image hébraïque de la main.
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: je les empêcherai de le faire paître
  rationale: Rend la valeur causative de הִשְׁבִּית et le sens pastoral de רעה dans un français naturel.
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: Ces bergers ne le feront plus paître
  rationale: Préserve la répétition de la racine רעה tout en adaptant l’accord au nom collectif français « troupeau ».
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: J’arracherai mon troupeau à leur bouche
  rationale: « Arracher » communique la délivrance énergique, tandis que « à leur bouche » conserve l’image choquante de bergers devenus dévoreurs.
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: il ne leur servira plus de nourriture
  rationale: Rend directement לְאָכְלָה et maintient le lien avec l’image de la bouche; le singulier français reprend le collectif « troupeau ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve à la fois le titre « Seigneur » et le nom propre divin, sans réduire יהוה à un titre générique.
- issue: Nature de la faute des bergers
  choice: Conserver les images du troupeau, de la bouche et de la nourriture
  alternative: Expliciter directement l’exploitation politique ou spirituelle du peuple
  rationale: Le texte présente les responsables comme des bergers prédateurs, mais ne réduit pas ici la métaphore à une seule forme précise d’abus.
- issue: Portée de דָּרַשׁ avec מִיַּד
  choice: Dieu leur redemandera son troupeau
  alternative: Dieu leur demandera compte de son troupeau
  rationale: Le verbe peut associer récupération et reddition de comptes. Le texte principal privilégie la réclamation du troupeau, et la note signale explicitement la nuance judiciaire.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tandis que « Me voici contre » garde la force solennelle de l’annonce prophétique. La répétition liée à l’action de faire paître et l’image prédatrice finale sont volontairement conservées.
