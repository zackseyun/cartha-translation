revisions:
- from: Je ferai pousser pour eux une plantation renommée[a]. Ils ne seront plus emportés par la famine dans le pays[b] et ils n’auront plus à subir les insultes des nations.
  to: Je susciterai pour eux une plantation de renom[a] ; ils ne seront plus emportés par la famine dans le pays[b], et ils ne porteront plus l’opprobre des nations.
  rationale: 'La révision corrige deux restrictions de sens : le verbe divin est rendu comme une action de susciter plutôt que seulement de faire croître, et la honte publique portée devant les nations est rendue par « opprobre » plutôt que par « insultes ». L’expression obscure relative à la famine demeure interprétée avec retenue dans le texte et son ambiguïté est conservée dans une note plus exacte.'
