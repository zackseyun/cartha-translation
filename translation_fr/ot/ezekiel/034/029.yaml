  naturalness: La phrase révisée est fluide en français international moderne tout en gardant un ton prophétique digne. « Porter l’opprobre » est une collocation française établie et plus proche du verbe נשא que « avoir à subir les insultes ».
  terminology: « Opprobre des nations » rend le singulier collectif כְּלִמַּת הַגּוֹיִם et préserve la notion de honte ou de déshonneur public, plus large que de simples insultes. Les notes conservent l’incertitude lexicale sans imposer d’interprétation messianique ou agricole.
