  text: וַ/הֲקִמֹתִ֥י לָ/הֶ֛ם מַטָּ֖ע לְ/שֵׁ֑ם וְ/לֹֽא יִהְי֨וּ ע֜וֹד אֲסֻפֵ֤י רָעָב֙ בָּ/אָ֔רֶץ וְ/לֹֽא יִשְׂא֥וּ ע֖וֹד כְּלִמַּ֥ת הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: fr
  text: Je susciterai pour eux une plantation de renom[a] ; ils ne seront plus emportés par la famine dans le pays[b], et ils ne porteront plus l’opprobre des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une plantation pour un nom », c’est-à-dire une plantation célèbre ou renommée.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est difficile. Littéralement : « rassemblés de famine » ; elle peut désigner les victimes de la famine ou ceux qu’elle emporte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Je ferai pousser
  rationale: Le hiphil de קום exprime l’action de faire surgir ou d’établir. Avec מַטָּע, « faire pousser » rend naturellement l’initiative divine tout en maintenant l’image végétale.
- source_word: מַטָּע
  choice: une plantation
  rationale: Le nom désigne ce qui est planté ou un lieu planté. « Plantation » conserve l’image agricole sans l’identifier à une personne ni en préciser indûment la nature.
- source_word: לְשֵׁם
  choice: renommée
  rationale: Littéralement « pour un nom » ; l’expression indique ici la réputation ou la célébrité. « Renommée » est idiomatique en français.
- source_word: אֲסֻפֵי רָעָב
  choice: emportés par la famine
  rationale: La forme passive de אסף signifie littéralement « rassemblés/recueillis », mais l’expression difficile paraît désigner les victimes que la famine fait disparaître. « Emportés » préserve la valeur passive et résultative sans produire un français opaque.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte de restauration, אֶרֶץ renvoie probablement au pays d’Israël. « Le pays » garde cette portée sans explicitation ajoutée.
- source_word: יִשְׂאוּ
  choice: subir
  rationale: נשא signifie porter ou supporter. Avec les insultes pour objet, « subir » constitue une formulation française naturelle.
- source_word: כְּלִמַּת
  choice: les insultes
  rationale: Le nom peut évoquer la honte, l’opprobre ou l’outrage. Dans la relation avec les nations, « les insultes » exprime bien l’humiliation publique infligée par autrui.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Dans le langage prophétique, גוים désigne généralement les peuples ou nations environnants. « Les nations » est ici le terme le plus neutre.
theological_decisions:
- issue: Nature de la « plantation renommée » promise
  choice: Conserver l’image agricole sans identifier explicitement la plantation.
  alternative: Y voir directement une figure messianique, ou exclusivement la fertilité agricole restaurée.
  rationale: L’hébreu ne précise pas sans ambiguïté s’il s’agit d’un dirigeant figuré, du peuple restauré ou de la fécondité renouvelée du pays. La traduction maintient cette ouverture interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’imagerie prophétique et l’ambiguïté du texte hébreu, tout en évitant un calque obscur pour אֲסֻפֵי רָעָב.
