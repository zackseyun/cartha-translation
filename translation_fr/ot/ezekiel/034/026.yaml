source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אוֹתָ֛/ם וּ/סְבִיב֥וֹת גִּבְעָתִ֖/י בְּרָכָ֑ה וְ/הוֹרַדְתִּ֤י הַ/גֶּ֨שֶׁם֙ בְּ/עִתּ֔/וֹ גִּשְׁמֵ֥י בְרָכָ֖ה יִֽהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: fr
  text: 'Je ferai d’eux et des alentours de ma colline une bénédiction[a]. Je ferai tomber la pluie en son temps : ce seront des averses de bénédiction.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ma colline » évoque probablement la colline sainte de Dieu, souvent comprise comme Sion, mais le texte ne la nomme pas explicitement.
    reason: Précision sur un référent géographique et théologique laissé implicite dans l’hébreu.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai de…
  rationale: 'Dans cette construction avec un complément d’objet suivi de בְּרָכָה comme attribut, נתן a un sens résultatif : Dieu fera d’eux et des alentours de sa colline une bénédiction.'
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: d’eux et des alentours de ma colline
  rationale: סְבִיבוֹת désigne les alentours ou les environs. La formulation française conserve le pronom pluriel et la référence spatiale sans identifier explicitement la colline.
- source_word: בְּרָכָה
  choice: une bénédiction
  rationale: Le singulier est conservé et rendu comme attribut résultatif des deux éléments coordonnés.
- source_word: וְהוֹרַדְתִּי
  choice: Je ferai tomber
  rationale: Le hifil de ירד exprime la causation. « Faire tomber la pluie » est naturel en français et maintient clairement l’action divine.
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: la pluie en son temps
  rationale: La tournure garde l’idée du moment ou de la saison appropriée, tout en restant proche de la formulation hébraïque.
- source_word: גִּשְׁמֵי בְרָכָה
  choice: des averses de bénédiction
  rationale: Le pluriel construit est naturellement rendu par « averses » et le lien lexical avec la bénédiction est préservé.
- source_word: יִהְיוּ
  choice: ce seront
  rationale: Cette formulation reprend explicitement la pluie annoncée et introduit naturellement le prédicat pluriel « des averses de bénédiction ».
theological_decisions:
- issue: Référent de « ma colline »
  choice: Conserver « ma colline » dans le texte principal
  alternative: Identifier la colline à Sion, à Jérusalem ou au lieu du sanctuaire restauré
  rationale: L’hébreu ne précise pas le référent dans ce verset. Le contexte peut évoquer la colline sainte de Dieu, souvent comprise comme Sion, mais la traduction ne doit pas imposer cette identification.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en employant des expressions françaises naturelles comme « faire de… une bénédiction » et « faire tomber la pluie ».
