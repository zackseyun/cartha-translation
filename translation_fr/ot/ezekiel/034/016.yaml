source:
  edition: WLC
  text: אֶת הָ/אֹבֶ֤דֶת אֲבַקֵּשׁ֙ וְ/אֶת הַ/נִּדַּ֣חַת אָשִׁ֔יב וְ/לַ/נִּשְׁבֶּ֣רֶת אֶחֱבֹ֔שׁ וְ/אֶת הַ/חוֹלָ֖ה אֲחַזֵּ֑ק וְ/אֶת הַ/שְּׁמֵנָ֧ה וְ/אֶת הַ/חֲזָקָ֛ה אַשְׁמִ֖יד אֶרְעֶ֥/נָּה בְ/מִשְׁפָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: fr
  text: Je chercherai celle qui est perdue, je ramènerai celle qui a été chassée, je panserai celle qui est blessée et je fortifierai celle qui est malade. Mais celle qui est grasse et celle qui est forte, je les détruirai. Je les ferai paître[a] avec justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je les nourrirai avec justice » ou « je les conduirai comme un berger avec justice ». Le verbe hébreu peut signifier nourrir, faire paître ou conduire comme berger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: celle qui est perdue
  rationale: Le participe féminin singulier désigne une brebis de manière représentative. Cette formulation conserve cette individualisation sans devoir ajouter explicitement « brebis ».
- source_word: אֲבַקֵּשׁ
  choice: je chercherai
  rationale: בקש signifie chercher ou rechercher. « Chercher » est direct, naturel et adapté à l’image du berger.
- source_word: הַנִּדַּחַת
  choice: celle qui a été chassée
  rationale: Le participe de נדח peut désigner celle qui a été repoussée, chassée ou dispersée. Le passif « a été chassée » préserve mieux l’idée d’une action subie que « s’est égarée ».
- source_word: אָשִׁיב
  choice: je ramènerai
  rationale: La forme causative de שוב signifie ici faire revenir ou ramener, ce qui convient précisément à l’action du berger.
- source_word: לַנִּשְׁבֶּרֶת
  choice: celle qui est blessée
  rationale: Le mot signifie littéralement « brisée ». Dans le contexte des soins donnés à une brebis, « blessée » exprime naturellement l’atteinte corporelle sans suggérer nécessairement une fracture.
- source_word: אֶחֱבֹשׁ
  choice: je panserai
  rationale: חבש désigne ici le fait de bander ou de soigner une blessure. « Panser » est précis et idiomatique en français.
- source_word: הַחוֹלָה
  choice: celle qui est malade
  rationale: חלה exprime la maladie ou l’affaiblissement dû à la maladie. « Malade » maintient la distinction avec la brebis blessée.
- source_word: אֲחַזֵּק
  choice: je fortifierai
  rationale: La forme intensive de חזק signifie rendre fort ou affermir. « Fortifier » conserve le contraste avec l’état de faiblesse.
- source_word: הַשְּׁמֵנָה
  choice: celle qui est grasse
  rationale: Le sens concret est « grasse ». Le conserver maintient l’image incisive de bêtes favorisées ou suralimentées dans le contexte du chapitre.
- source_word: הַחֲזָקָה
  choice: celle qui est forte
  rationale: L’adjectif signifie « forte » et forme avec « grasse » un contraste délibéré avec les brebis vulnérables.
- source_word: אַשְׁמִיד
  choice: je les détruirai
  rationale: La forme causative de שמד a le sens fort de détruire ou supprimer. « Détruire » restitue cette sévérité sans amplification.
- source_word: אֶרְעֶנָּה
  choice: je les ferai paître
  rationale: רעה peut signifier faire paître, nourrir ou conduire comme berger. « Faire paître » est naturel en français et conserve explicitement l’image pastorale, tandis que la note signale l’étendue sémantique du verbe.
- source_word: בְמִשְׁפָּט
  choice: avec justice
  rationale: משפט peut désigner le droit, la justice ou le jugement. « Avec justice » exprime ici la manière dont Dieu gouvernera le troupeau sans réduire la proposition au seul châtiment.
theological_decisions:
- issue: Articulation entre les soins accordés aux brebis vulnérables et le jugement des grasses et des fortes
  choice: « Je les détruirai. Je les ferai paître avec justice. »
  alternative: « Je les détruirai. Je les nourrirai dans le jugement. »
  rationale: Le texte juxtapose restauration compatissante et action judiciaire. « Faire paître avec justice » garde ensemble le gouvernement pastoral de Dieu et sa justice, sans limiter la dernière proposition à l’alimentation ni au châtiment.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « celle qui… » reproduit la série hébraïque et individualise les différentes brebis. Le passif « a été chassée » préserve la possibilité qu’elle ait subi l’action d’autrui. Le marqueur [a] est placé sur le verbe concerné par la variante lexicale.
