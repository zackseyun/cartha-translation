id: EZK.34.24
reference: Ezekiel 34:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֣י יְהוָ֗ה אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/עַבְדִּ֥/י דָוִ֖ד נָשִׂ֣יא בְ/תוֹכָ֑/ם אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: fr
  text: Moi, Yahweh, je serai leur Dieu, et mon serviteur David[a] sera prince au milieu d’eux. Moi, Yahweh, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon serviteur David » peut désigner, de manière typologique ou prophétique, le souverain davidique à venir, c’est-à-dire le Messie ; le texte hébreu lui-même porte « David ».
    reason: Signaler une interprétation messianique possible sans remplacer ni préciser abusivement le nom donné par le texte hébreu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: je serai leur Dieu
  rationale: Cette tournure française naturelle rend l’expression hébraïque de relation d’alliance, littéralement « je serai pour eux comme Dieu ».
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal et davidique, « serviteur » conserve la valeur honorifique du terme sans suggérer avant tout la condition sociale d’un esclave.
- source_word: דָוִד
  choice: David
  rationale: Le nom propre est conservé tel quel, sans introduire dans le corps du texte une identification interprétative.
- source_word: נָשִׂיא
  choice: prince
  rationale: « Prince » préserve le terme particulier employé par Ézéchiel et évite de le confondre avec le mot hébreu habituellement traduit par « roi ».
- source_word: בְתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression rend directement la localisation et la présence au sein de la communauté.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le passé composé convient à la formule solennelle de déclaration divine et conserve l’aspect accompli de l’hébreu.
theological_decisions:
- issue: Identité de « David » dans « mon serviteur David »
  choice: Conserver « David » dans le texte principal.
  alternative: Comprendre ce nom comme désignant David revenu à la vie, un souverain davidique à venir ou le Messie, fils de David.
  rationale: L’hébreu dit explicitement « David ». La traduction ne tranche donc pas l’identité du personnage, tandis que la note signale la portée typologique ou prophétique reconnue de l’expression.
translation_notes:
  register: Français moderne, clair et digne. La reprise de « Moi, Yahweh » suit la structure emphatique de l’hébreu. « Au milieu d’eux » conserve une légère solennité biblique tout en restant immédiatement compréhensible.
