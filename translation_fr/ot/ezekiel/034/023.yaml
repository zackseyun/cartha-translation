source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י עֲלֵי/הֶ֜ם רֹעֶ֤ה אֶחָד֙ וְ/רָעָ֣ה אֶתְ/הֶ֔ן אֵ֖ת עַבְדִּ֣/י דָוִ֑יד ה֚וּא יִרְעֶ֣ה אֹתָ֔/ם וְ/הֽוּא יִהְיֶ֥ה לָ/הֶ֖ן לְ/רֹעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: fr
  text: Je susciterai[a] sur eux un seul berger, mon serviteur David[b], et il les fera paître ; c’est lui qui les fera paître[c], et c’est lui qui sera leur berger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’établirai sur eux un seul berger. »'
    reason: lexical_alternative
  - marker: b
    text: « David » peut désigner David comme figure royale idéale ou, plus largement, un futur roi de sa lignée.
    reason: alternative_reading
  - marker: c
    text: Le même verbe hébreu lié au travail du berger est répété ; il peut aussi signifier « nourrir » ou « prendre soin de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Je susciterai
  rationale: Le hifil de קום peut signifier susciter, établir ou instituer. « Susciter » exprime ici l’action divine faisant paraître un dirigeant, sans préciser outre mesure la manière de son établissement.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל situe le berger au-dessus du peuple dans une fonction de conduite. La formulation française conserve directement cette relation.
- source_word: רֹעֶה אֶחָד
  choice: un seul berger
  rationale: « Un seul » rend clairement l’accent porté par אֶחָד sur l’unicité du berger.
- source_word: וְרָעָה / יִרְעֶה
  choice: il les fera paître
  rationale: Le verbe רעה désigne l’action de faire paître, de nourrir et de prendre soin d’un troupeau. « Faire paître » maintient la métaphore pastorale ainsi que la répétition du verbe hébreu.
- source_word: אֵת עַבְדִּי דָוִד
  choice: mon serviteur David
  rationale: La traduction conserve le titre relationnel « mon serviteur » et le nom propre David sans ajout interprétatif.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Le pronom indépendant est emphatique. La tournure clivée française rend cette insistance plus naturellement que « lui-même » dans les deux propositions.
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: il sera leur berger
  rationale: Cette formulation idiomatique exprime fidèlement la fonction et la relation indiquées par la construction hébraïque.
theological_decisions:
- issue: Identité de « David » dans le contexte prophétique
  choice: Conserver « David » dans le texte sans explicitation interprétative.
  alternative: Un futur roi davidique, ou le Messie.
  rationale: Le texte hébreu nomme David. Traduire directement ce nom préserve l’ambiguïté quant à son référent prophétique et évite d’imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition marquée de « faire paître » est volontaire afin de refléter la structure hébraïque ; les tournures « c’est lui qui » rendent l’emphase des pronoms indépendants sans lourdeur excessive.
