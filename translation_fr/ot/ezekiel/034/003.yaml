source:
  edition: WLC
  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: fr
  text: Vous mangez la graisse[a], vous vous habillez de la laine, vous abattez les bêtes grasses[b], mais vous ne faites pas paître le troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lait ». Certaines traductions suivent ici une ancienne tradition d’interprétation ou le texte de versions anciennes, mais le mot hébreu signifie normalement « graisse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la bête grasse » ; on peut aussi comprendre « la bête bien nourrie » ou « la bête de choix ». Le singulier hébreu semble avoir ici une valeur représentative ou collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: חֵלֶב désigne normalement la graisse ou la partie grasse. Cette traduction conserve l’image concrète de dirigeants qui tirent profit du troupeau, tout en signalant en note l’autre lecture traditionnelle.
- source_word: הַצֶּמֶר
  choice: la laine
  rationale: צֶמֶר désigne la laine. Le terme est courant, précis et naturel en français moderne.
- source_word: תִּלְבָּשׁוּ
  choice: vous vous habillez de
  rationale: לבש signifie mettre un vêtement, porter ou s’habiller. La tournure pronominale exprime naturellement en français le fait que les bergers utilisent la laine à leur propre avantage.
- source_word: הַבְּרִיאָה
  choice: les bêtes grasses
  rationale: L’adjectif substantivé בריאה désigne ici l’animal gras, bien nourri ou de choix. Le pluriel français rend naturellement sa valeur représentative ou collective dans le contexte du troupeau.
- source_word: תִּזְבָּחוּ
  choice: vous abattez
  rationale: זבח peut signifier sacrifier ou égorger. Ici, le contexte porte sur l’exploitation du troupeau plutôt que sur un acte cultuel; «abattre» convient donc mieux.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. «Le troupeau» maintient clairement la métaphore pastorale.
- source_word: תִרְעוּ
  choice: vous ne prenez pas soin
  rationale: רעה couvre l’action de faire paître, conduire et soigner un troupeau. En français moderne, «prendre soin du troupeau» exprime l’ensemble de cette responsabilité sans réduire le reproche à la seule alimentation.
theological_decisions:
- issue: Force métaphorique du langage pastoral appliqué aux dirigeants d’Israël
  choice: Conserver le troupeau et exprimer la responsabilité globale des bergers par «vous ne prenez pas soin du troupeau».
  alternative: vous ne faites pas paître le troupeau
  rationale: Le chapitre dénonce des dirigeants qui profitent du peuple sans remplir leur devoir de bergers. La formulation retenue garde la métaphore du troupeau et l’étendue du verbe hébreu, sans limiter leur faute au seul pâturage ni introduire une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme accusateur est conservé par la répétition de «vous». «Prendre soin du troupeau» évite le tour littéraire ou ambigu «paître le troupeau» tout en rendant la responsabilité pastorale dans son ensemble.
