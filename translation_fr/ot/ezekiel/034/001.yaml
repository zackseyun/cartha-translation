  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la construction narrative avec היה se rend naturellement en français par « fut adressée », qui exprime la venue de la parole sans calquer lourdement « il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: « La parole » conserve la formule prophétique récurrente et désigne ici une communication divine précise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel exprimé par le tétragramme plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend directement et idiomatiquement l’hébreu « à moi ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule française introduit naturellement le discours direct annoncé par l’infinitif hébreu, tout en évitant le calque peu idiomatique « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » en préserve le caractère de nom propre, tandis que « le SEIGNEUR » reflète la substitution traditionnelle à la lecture.
translation_notes:
  register: 'Français international moderne, digne et naturel. La tournure consacrée « La parole de Yahweh me fut adressée » conserve le caractère prophétique de la formule; « en ces termes : » introduit clairement la parole directe qui suit.'
