  source_fidelity: 'Le sens fondamental est bien rendu : l’inférence, le titre divin, l’emphase divine, le jugement discriminant et l’opposition entre les deux types de bétail sont préservés. Toutefois, « ainsi leur parle » emploie un présent (« parle ») là où la formule prophétique כֹּה אָמַר se rend plus fidèlement et naturellement par « ainsi parle » / « voici ce que ... déclare » sans l’intégrer de façon ambiguë à « leur ».'
