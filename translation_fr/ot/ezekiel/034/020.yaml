  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה אֲלֵי/הֶ֑ם הִנְ/נִי אָ֕נִי וְ/שָֽׁפַטְתִּי֙ בֵּֽין שֶׂ֣ה בִרְיָ֔ה וּ/בֵ֥ין שֶׂ֖ה רָזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi le Seigneur Yahweh leur déclare : « Me voici, moi-même, je jugerai entre la brebis grasse et la brebis maigre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « entre une brebis grasse et une brebis maigre » ; les singuliers représentent vraisemblablement deux catégories au sein du troupeau.
    reason: Préciser la valeur collective probable des noms singuliers sans l’imposer dans le corps du texte.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation précédente tout en conservant la logique prophétique.
- source_word: כֹּה אָמַר ... אֲלֵיהֶם
  choice: ainsi leur parle
  rationale: Conserve la formule solennelle du messager prophétique et intègre idiomatiquement les destinataires indiqués par אֲלֵיהֶם.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre divin sans confondre אֲדֹנָי avec le nom propre יהוה.
- source_word: הִנְנִי אָנִי
  choice: Me voici ! Moi-même
  rationale: La formulation garde à la fois la force présentative de הִנְנִי et l’insistance exceptionnelle du second pronom אָנִי.
- source_word: וְשָׁפַטְתִּי
  choice: je jugerai
  rationale: Exprime le sens judiciaire et discriminant du verbe dans ce contexte, où Dieu tranche entre deux catégories du troupeau.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et ...
  rationale: Reproduit le contraste hébreu dans la tournure française normale.
- source_word: שֶׂה בִרְיָה ... שֶׂה רָזָה
  choice: la brebis grasse ... la brebis maigre
  rationale: Le singulier représentatif de l’hébreu est conservé; « brebis » convient au troupeau métaphorique, et « grasse/maigre » maintient l’opposition concrète.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » distingue explicitement le nom divin יהוה du titre אֲדֹנָי, tout en préservant les deux termes présents dans le texte.
- issue: Portée du jugement entre les brebis
  choice: maintien du singulier représentatif
  alternative: les brebis grasses et les brebis maigres
  rationale: Le texte hébreu emploie deux noms singuliers qui peuvent représenter des catégories. La traduction conserve cette forme sans réduire le jugement à deux individus précis; la note explicite la portée possible.
translation_notes:
  register: Français moderne, digne et accessible. La formule prophétique reste solennelle; la ponctuation détache « Me voici ! Moi-même » afin de rendre l’emphase inhabituelle de l’hébreu.
