source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: fr
  text: Et vous, mon troupeau, troupeau de mon pâturage, vous êtes des êtres humains[a], et moi, je suis votre Dieu — déclaration du Seigneur, l’Éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’humanité ». Le mot hébreu ’adam désigne ici les humains en général, par contraste avec l’image du troupeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: Et vous
  rationale: Le pronom féminin pluriel placé en tête, avec la conjonction, marque l’adresse directe et met les destinataires en relief. « Et vous » conserve cette forme sans préciser excessivement la relation logique.
- source_word: צֹאנִי
  choice: mon troupeau
  rationale: Le nom collectif désigne les brebis comme un troupeau et prolonge naturellement en français la métaphore pastorale du chapitre.
- source_word: צֹאן מַרְעִיתִי
  choice: troupeau de mon pâturage
  rationale: Cette formulation garde la reprise en apposition ainsi que l’image du pâturage, sans comprimer le texte.
- source_word: אָדָם
  choice: des êtres humains
  rationale: Dans la proposition nominale אָדָם אַתֶּם, le nom collectif désigne l’humanité et révèle la réalité humaine du troupeau métaphorique. « Des êtres humains » est naturel, exact et inclusif en français moderne.
- source_word: אַתֶּם
  choice: vous êtes
  rationale: Le français exige ici l’ajout de la copule sous-entendue en hébreu. Le passage du féminin וְאַתֵּן au masculin pluriel אַתֶּם est reflété par la forme française non genrée « vous ».
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: et moi, je suis votre Dieu
  rationale: La dislocation « et moi, je » rend l’emphase du pronom אֲנִי et conserve la formule relationnelle exprimée par le suffixe possessif.
- source_word: נְאֻם
  choice: déclaration de
  rationale: « Déclaration de » rend avec dignité la formule prophétique nominale sans la transformer en proposition verbale ordinaire.
- source_word: אֲדֹנָי יְהוִה
  choice: du Seigneur, l’Éternel
  rationale: Cette convention française distingue אֲדֹנָי du nom divin יהוה et évite l’expression peu naturelle « Seigneur Seigneur ».
theological_decisions:
- issue: Sens de אָדָם à la clôture de la métaphore pastorale
  choice: des êtres humains
  alternative: des hommes / l’humanité
  rationale: Le terme identifie le troupeau métaphorique comme humain. « Des êtres humains » préserve ce contraste et le sens générique de אָדָם sans suggérer que seuls les hommes de sexe masculin sont visés. La note signale la possibilité plus collective « l’humanité ».
- issue: Relation entre Dieu et le troupeau
  choice: et moi, je suis votre Dieu
  alternative: moi, je suis votre Dieu
  rationale: La coordination préserve le parallélisme contrastif entre l’identité humaine du peuple et l’identité de Dieu, sans ajouter d’explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. La structure appositionnelle et l’emphase des pronoms sont conservées, tout en employant « êtres humains », plus naturel et moins ambigu que le générique traditionnel « hommes ».
