id: EZK.34.28
reference: Ezekiel 34:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יִהְי֨וּ ע֥וֹד בַּז֙ לַ/גּוֹיִ֔ם וְ/חַיַּ֥ת הָ/אָ֖רֶץ לֹ֣א תֹאכְלֵ֑/ם וְ/יָשְׁב֥וּ לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: fr
  text: Ils ne seront plus un butin pour les nations[a], et les bêtes sauvages du pays[b] ne les dévoreront pas. Ils habiteront en sécurité[c], sans que personne les effraie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une proie pour les nations » ou « livrés au pillage des nations ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les animaux sauvages de la terre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « Ils vivront en sûreté, et personne ne les terrifiera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: un butin
  rationale: Le nom désigne ce qui est pris de force ou livré au pillage. « Un butin » conserve ici le sens politique de l’exploitation d’Israël par les nations, sans anticiper l’image animale de la proposition suivante.
- source_word: לַגּוֹיִם
  choice: pour les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations environnants. « Pour les nations » s’accorde naturellement avec « un butin » et évite le sens technique plus tardif que pourrait suggérer « païens ».
- source_word: חַיַּת הָאָרֶץ
  choice: les bêtes sauvages du pays
  rationale: L’expression désigne les animaux sauvages vivant sur le territoire. « Du pays » rend הָאָרֶץ dans ce contexte de restauration territoriale, tout en laissant possible le sens plus général de « terre ».
- source_word: תֹאכְלֵם
  choice: ne les dévoreront pas
  rationale: Le verbe signifie littéralement « manger », mais, avec des bêtes sauvages pour sujet et des personnes pour objet, « dévorer » est l’équivalent français naturel et expressif.
- source_word: וְיָשְׁבוּ
  choice: Ils habiteront
  rationale: ישׁב peut signifier s’asseoir, demeurer ou habiter. « Habiteront » exprime ici une installation stable sans ajouter d’interprétation théologique.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: L’expression indique une situation de sûreté ou de confiance. « En sécurité » est claire, actuelle et convient au contexte concret de délivrance.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne les effraie
  rationale: Le participe causatif de חרד évoque quelqu’un qui provoque la peur ou la terreur. Cette formulation française conserve l’agent personnel indéfini et reste naturelle.
- source_word: עוֹד
  choice: ne… plus
  rationale: Associé à la négation, עוֹד marque la fin d’une situation antérieure. La tournure française « ne seront plus » le rend directement.
theological_decisions:
- issue: Nature de la sécurité promise
  choice: Présenter la déclaration comme une promesse concrète de délivrance et de sécurité, sans décider si les nations et les bêtes doivent aussi être comprises symboliquement ni si son accomplissement est exclusivement eschatologique.
  alternative: Interpréter entièrement les nations et les bêtes comme des symboles d’ennemis politiques, ou limiter la promesse à un scénario eschatologique précis.
  rationale: L’hébreu juxtapose simplement la spoliation par les nations et la menace des bêtes sauvages. La traduction conserve ces deux images et leur tension sans imposer un cadre doctrinal absent du verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit de près les deux menaces puis la promesse de sécurité. « Butin » maintient la dimension politico-militaire de la première proposition, tandis que « dévorer » préserve l’image concrète de la seconde.
