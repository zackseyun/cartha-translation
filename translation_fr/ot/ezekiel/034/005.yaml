  text: וַ/תְּפוּצֶ֖ינָה מִ/בְּלִ֣י רֹעֶ֑ה וַ/תִּהְיֶ֧ינָה לְ/אָכְלָ֛ה לְ/כָל חַיַּ֥ת הַ/שָּׂדֶ֖ה וַ/תְּפוּצֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: fr
  text: Elles se dispersèrent faute de berger, devinrent la nourriture de toutes les bêtes sauvages des champs, et se dispersèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: elles se dispersèrent
  rationale: Le verbe פוץ décrit ici la dispersion du troupeau. « Se dispersèrent » rend naturellement en français sa valeur intransitive, et sa répétition finale est conservée.
- source_word: מִבְּלִי רֹעֶה
  choice: faute de berger
  rationale: מִבְּלִי exprime l'absence ou la privation, avec ici une nuance causale. « Faute de berger » est idiomatique et préserve la métaphore directrice du chapitre.
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: devinrent la nourriture
  rationale: היה marque l'entrée dans un nouvel état, tandis que אָכְלָה désigne ce qui est mangé. Cette formulation rend à la fois la transition et le résultat.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: de tous les animaux sauvages
  rationale: L'expression désigne collectivement les animaux vivant hors du domaine domestique. « Animaux sauvages » est clair et actuel; « de tous » s'accorde naturellement avec « la nourriture ».
theological_decisions:
- issue: L'image du berger appliquée aux dirigeants d'Israël
  choice: Conserver « berger »
  alternative: dirigeant
  rationale: Ézéchiel 34 développe l'image des dirigeants comme bergers et du peuple comme troupeau. La remplacer par une explication ferait disparaître une dimension essentielle de la prophétie.
translation_notes:
  register: Français moderne, sobre et digne. La répétition finale, stylistiquement marquée, est maintenue parce qu'elle appartient au texte hébreu.
