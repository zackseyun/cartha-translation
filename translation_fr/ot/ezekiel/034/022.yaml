base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/022.yaml
  text: I will save my flock[a], and they will no longer be prey[b], and I will judge between sheep and sheep.
translation:
  language: fr
  text: Je sauverai mon troupeau, et il ne sera plus livré au pillage[a]. Je jugerai entre brebis et brebis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne sera plus destiné au pillage » ou « il ne sera plus livré comme butin ».'
    reason: lexical_alternative
  - marker: b
    text: 'L''hébreu répète un terme désignant une bête du petit bétail : « entre une bête et une autre », c''est-à-dire entre les membres du troupeau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Je sauverai
  rationale: Le hifil de ישׁע exprime ici l’intervention de Dieu qui délivre son troupeau du danger et de l’oppression. « Sauver » est naturel en français et conserve la portée théologique du terme.
- source_word: לְצֹאנִי
  choice: mon troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. Dans cette image pastorale, « mon troupeau » est la formulation française la plus naturelle.
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: et il ne sera plus livré au pillage
  rationale: La locution indique littéralement que le troupeau ne sera plus destiné au butin ou au pillage. « Livré au pillage » rend clairement sa vulnérabilité aux oppresseurs tout en restant proche de la construction hébraïque.
- source_word: וְשָׁפַטְתִּי
  choice: Je jugerai
  rationale: שׁפט désigne ici l’action judiciaire de Dieu, qui distingue les membres du troupeau et tranche entre eux. « Juger » en conserve la force juridique et morale.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: entre brebis et brebis
  rationale: L’expression hébraïque distributive est littéralement « entre animal du petit bétail et animal du petit bétail ». Dans le contexte, « entre brebis et brebis » préserve la répétition et l’idée d’un jugement exercé au sein même du troupeau.
theological_decisions:
- issue: Le langage de la délivrance divine dans la métaphore du berger
  choice: Je sauverai mon troupeau
  alternative: Je délivrerai mon troupeau ; Je secourrai mon troupeau
  rationale: « Sauver » conserve à la fois le sens concret d’une délivrance face au danger et la portée théologique de l’action divine, sans introduire de précision doctrinale étrangère au verset.
- issue: La nature du jugement de Dieu au sein du troupeau
  choice: Je jugerai entre brebis et brebis
  alternative: Je jugerai entre une brebis et une autre
  rationale: 'Le texte ne parle pas seulement de protection contre des ennemis extérieurs : Dieu exerce aussi son jugement parmi les membres du troupeau. La formulation retenue préserve cette tension ainsi que la répétition de l’hébreu.'
translation_notes:
  register: Français international moderne, digne et accessible. La répétition inhabituelle « entre brebis et brebis » est maintenue pour refléter la formulation hébraïque; une note en explicite la valeur distributive.
