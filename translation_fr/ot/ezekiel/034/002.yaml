source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: fr
  text: 'Fils d’homme, prophétise contre les bergers d’Israël. Prophétise et dis-leur, à ces bergers : « Ainsi parle le Seigneur Yahweh : Malheur aux bergers d’Israël qui se nourrissent eux-mêmes[a] ! Les bergers ne devraient-ils pas faire paître le troupeau[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se paissent eux-mêmes ». Le même verbe hébreu, relatif au travail du berger, revient dans tout le verset. Il exprime ici que les dirigeants d’Israël pourvoyaient à leurs propres besoins au lieu de prendre soin du troupeau.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les moutons » ou « le petit bétail » ; le singulier collectif désigne ici le troupeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel. La traduction conserve l’image et le vocatif singulier hébreux sans les réduire à une désignation générique.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: Équivalent français direct de l’impératif. La répétition est maintenue parce que l’hébreu répète le commandement pour lui donner du relief.
- source_word: עַל
  choice: contre
  rationale: Dans cet oracle de jugement, la préposition a une valeur adversative, confirmée par la déclaration de malheur qui suit.
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: les bergers d’Israël / ces bergers / les bergers
  rationale: La métaphore pastorale est conservée plutôt que remplacée par « dirigeants », puisque tout le verset la développe au moyen du troupeau et de l’action de faire paître.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Ainsi parle le Seigneur Yahweh
  rationale: Formule prophétique française naturelle qui distingue אֲדֹנָי, « Seigneur », du nom divin יהוה, transcrit « Yahweh ».
- source_word: הוֹי
  choice: Malheur
  rationale: Introduit ici une dénonciation prophétique et annonce le jugement, plutôt qu’une simple lamentation.
- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: qui se faisaient paître eux-mêmes
  rationale: Le pronom objet renvoie aux bergers eux-mêmes. Cette formulation conserve le verbe pastoral répété dans le verset et fait ressortir l’ironie de dirigeants qui prennent soin d’eux-mêmes plutôt que du troupeau.
- source_word: הֲלוֹא
  choice: ne devraient-ils pas
  rationale: Rend la question rhétorique qui attend une réponse affirmative et porte une forte valeur de reproche.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: Le nom hébreu désigne collectivement les moutons ou le petit bétail. « Le troupeau » exprime naturellement ce sens collectif en français.
- source_word: יִרְעוּ
  choice: faire paître
  rationale: Le verbe רעה peut signifier nourrir, mener au pâturage ou exercer la fonction de berger. « Faire paître » reste naturel en français tout en maintenant le réseau d’images pastorales.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette solution rend séparément le titre אֲדֹנָי et le nom personnel יהוה, sans confondre les deux éléments de la formule.
- issue: Interprétation des « bergers » comme dirigeants d’Israël
  choice: Conserver la métaphore des bergers dans le texte principal
  alternative: les dirigeants d’Israël
  rationale: Le texte source construit tout le reproche autour de l’image du berger et du troupeau. Nommer directement les dirigeants supprimerait une part importante de sa force littéraire et théologique.
- issue: Valeur réflexive de רֹעִים אוֹתָם
  choice: qui se faisaient paître eux-mêmes
  alternative: qui se nourrissaient eux-mêmes
  rationale: Le contexte oppose le soin que les bergers s’accordent à eux-mêmes au soin dû au troupeau. La traduction retenue préserve aussi la répétition intentionnelle du même verbe pastoral.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « prophétise » et la métaphore pastorale sont volontairement conservées. « À ces bergers » explicite avec naturel la reprise hébraïque « à eux, aux bergers » sans supprimer son insistance.
