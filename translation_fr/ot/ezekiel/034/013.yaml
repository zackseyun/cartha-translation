- from: Je les ferai sortir du milieu des peuples, je les rassemblerai des différents pays et je les ramènerai sur leur terre. Je les ferai paître sur les montagnes d’Israël, le long des cours d’eau[a] et dans tous les lieux habités du pays.
  to: Je les ferai sortir du milieu des peuples, je les rassemblerai des pays et je les ramènerai dans leur pays. Je les ferai paître sur les montagnes d’Israël, le long des cours d’eau[a] et dans tous les lieux habités du pays.
  rationale: La révision supprime une explicitation (« différents ») et rend plus exactement le mouvement vers la terre par « dans leur pays ». Elle conserve l’image pastorale, la distinction entre peuples et pays, ainsi que l’ambiguïté lexicale signalée par la note.
