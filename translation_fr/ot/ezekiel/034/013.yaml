  text: וְ/הוֹצֵאתִ֣י/ם מִן הָ/עַמִּ֗ים וְ/קִבַּצְתִּי/ם֙ מִן הָ֣/אֲרָצ֔וֹת וַ/הֲבִיאֹתִ֖י/ם אֶל אַדְמָתָ֑/ם וּ/רְעִיתִי/ם֙ אֶל הָרֵ֣י יִשְׂרָאֵ֔ל בָּ/אֲפִיקִ֕ים וּ/בְ/כֹ֖ל מוֹשְׁבֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: fr
  text: Je les ferai sortir du milieu des peuples, je les rassemblerai des pays et je les ramènerai dans leur pays. Je les ferai paître sur les montagnes d’Israël, le long des cours d’eau[a] et dans tous les lieux habités du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les ravins », « près des torrents » ou « dans les chenaux ». Le terme hébreu peut désigner des cours d’eau, des lits de torrents ou des ravins.
    reason: 'Alternative lexicale : le sens topographique précis de אֲפִיקִים demeure ouvert.'
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: Je les ferai sortir
  rationale: Le hiphil de יצא exprime ici l’action causative de Dieu, qui fait sortir son troupeau du milieu des peuples. Cette formulation française est naturelle et conserve l’écho d’un nouvel exode.
- source_word: מִן הָעַמִּים
  choice: du milieu des peuples
  rationale: Le pluriel עַמִּים désigne les différents peuples parmi lesquels les Israélites ont été dispersés. « Du milieu de » rend clairement la séparation exprimée par מִן.
- source_word: וְקִבַּצְתִּים
  choice: je les rassemblerai
  rationale: קבץ est le verbe courant pour le rassemblement de personnes dispersées, notamment dans les annonces de restauration.
- source_word: מִן הָאֲרָצוֹת
  choice: des différents pays
  rationale: Le pluriel אֲרָצוֹת renvoie aux territoires ou pays de dispersion. « Différents » explicite naturellement la valeur distributive du pluriel sans modifier le sens.
- source_word: וַהֲבִיאֹתִים אֶל אַדְמָתָם
  choice: je les ramènerai sur leur terre
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans ce contexte de retour après dispersion, « ramener » est idiomatique. אַדְמָה désigne ici leur terre ou leur sol, et « sur leur terre » conserve le possessif sans ajouter « propre ».
- source_word: וּרְעִיתִים
  choice: Je les ferai paître
  rationale: רעה évoque l’action de nourrir ou conduire au pâturage. La traduction garde explicitement l’image pastorale qui structure le passage.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: sur les montagnes d’Israël
  rationale: Après le verbe « faire paître », אֶל introduit la zone vers laquelle le troupeau est conduit et où il pâture. « Sur » convient naturellement au relief évoqué.
- source_word: בָּאֲפִיקִים
  choice: le long des cours d’eau
  rationale: אֲפִיקִים peut désigner des chenaux, lits de torrents ou ravins. Dans ce cadre pastoral, « cours d’eau » est clair et naturel, tandis que la note conserve l’ambiguïté topographique.
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: dans tous les lieux habités du pays
  rationale: מוֹשְׁבֵי הָאָרֶץ désigne les endroits du pays où l’on demeure. « Lieux habités » reste suffisamment large pour inclure les localités et autres zones d’habitation.
theological_decisions:
- issue: La restauration et le possessif dans אַדְמָתָם
  choice: sur leur terre
  alternative: dans leur propre pays
  rationale: Le suffixe possessif indique que cette terre est la leur. La formulation retenue exprime clairement le retour sans renforcer le texte par « propre » ni préciser davantage la portée théologique de cette appartenance.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « je les » maintient l’insistance sur l’action divine, et le vocabulaire pastoral reste concret. Le marqueur de note est placé après « cours d’eau », le terme auquel la note se rapporte.
