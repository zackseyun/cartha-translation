  text: לָ/כֵן֙ הָֽ/רֹעִ֔ים שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/009.yaml
  text: 'Therefore, shepherds, hear the word of Yahweh:'
translation:
  language: fr
  text: 'C’est pourquoi, bergers, écoutez la parole de Yahweh :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence directe de l’accusation précédente avec un lien logique clair et naturel en français moderne.
- source_word: הָרֹעִים
  choice: bergers
  rationale: Conserve la métaphore structurante du chapitre pour les dirigeants d’Israël, sans l’interpréter dans le corps du texte par « dirigeants » ni lui donner une coloration ecclésiastique avec « pasteurs ».
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: Rend l’impératif masculin pluriel par la formulation idiomatique française de l’appel prophétique, tout en gardant sa force solennelle.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » est la formulation française traditionnelle, transparente et porteuse du poids requis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme au lieu de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Interprétation éventuelle de הָרֹעִים comme désignation des dirigeants
  choice: bergers
  alternative: dirigeants ; chefs ; pasteurs
  rationale: L’image des bergers se prolonge dans tout le chapitre et porte son argument théologique; la conserver évite d’insérer une explication dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « C’est pourquoi » marque nettement la conséquence; « écoutez la parole » maintient le ton solennel de la convocation prophétique. Aucun marqueur de note n’est requis.
