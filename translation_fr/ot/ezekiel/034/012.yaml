  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: fr
  text: Comme un berger prend soin[a] de son troupeau lorsqu’il se trouve au milieu de ses brebis dispersées, ainsi je prendrai soin de mes brebis et je les délivrerai de tous les lieux où elles ont été dispersées lors d’un jour de nuages et d’obscurité profonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « recherche attentivement » ou « passe en revue » ; le verbe hébreu évoque à la fois la recherche, l’examen et les soins vigilants du berger.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת ... כֵּן אֲבַקֵּר
  choice: Comme un berger prend soin… ainsi je prendrai soin
  rationale: La répétition de la racine בקר relie étroitement l’action du berger à celle de Dieu. « Prendre soin » exprime ici la surveillance attentive et la recherche sans réduire le sens à une simple inspection.
- source_word: רֹעֶה עֶדְרוֹ
  choice: un berger prend soin de son troupeau
  rationale: « Berger » et « troupeau » rendent naturellement l’image pastorale; la formulation française transforme l’expression nominale hébraïque en proposition verbale claire.
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: lorsqu’il se trouve au milieu de ses brebis dispersées
  rationale: Dans ce contexte, בְּיוֹם a une valeur temporelle générale (« lorsque »). Le féminin pluriel נִפְרָשׁוֹת se rapporte aux bêtes du petit bétail et décrit leur état dispersé.
- source_word: צֹאנִי
  choice: mes brebis
  rationale: « Mes brebis » maintient l’image concrète et personnelle, bien que צאן puisse inclure plus largement le petit bétail.
- source_word: וְהִצַּלְתִּי
  choice: je les délivrerai
  rationale: Le hiphil de נצל exprime l’action d’arracher à un danger ou de délivrer. « Délivrer » convient au registre prophétique tout en restant courant.
- source_word: אֲשֶׁר נָפֹצוּ שָׁם
  choice: où elles ont été dispersées
  rationale: La relative locative est rendue directement; « dispersées » conserve le motif de l’éparpillement du troupeau.
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: en un jour de nuages et d’obscurité profonde
  rationale: « Nuages » rend עָנָן dans son sens concret, et « obscurité profonde » communique la densité menaçante de עֲרָפֶל. L’absence d’article favorise « un jour ».
theological_decisions:
- issue: Image de Dieu comme berger
  choice: Conserver l’image de Dieu prenant personnellement soin de ses brebis et les délivrant.
  alternative: Introduire explicitement une lecture messianique ou christologique.
  rationale: Le verset présente directement YHWH sous les traits du berger. La traduction laisse les prolongements canoniques à l’interprétation.
- issue: Portée de בקר
  choice: Employer « prendre soin » dans les deux occurrences.
  alternative: Employer « chercher », « examiner » ou « passer en revue ».
  rationale: La racine peut évoquer l’examen attentif, la surveillance pastorale ou la recherche. « Prendre soin » préserve cette largeur sémantique et la reprise rhétorique, tandis que la note signale les autres nuances.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « prend soin / prendrai soin » reproduit le lien lexical de l’hébreu. Le rythme demeure proche de la comparaison pastorale de l’original sans calquer lourdement la tournure nominale initiale.
