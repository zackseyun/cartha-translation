revisions:
- from: Comme un berger prend soin de son troupeau lorsqu’il se trouve au milieu de ses brebis dispersées[a], ainsi je prendrai soin de mes brebis et je les délivrerai de tous les lieux où elles ont été dispersées, en un jour de nuages et d’obscurité profonde.
  to: Comme un berger prend soin[a] de son troupeau lorsqu’il se trouve au milieu de ses brebis dispersées, ainsi je prendrai soin de mes brebis et je les délivrerai de tous les lieux où elles ont été dispersées lors d’un jour de nuages et d’obscurité profonde.
  rationale: La révision conserve les choix lexicaux et l’équivalence rhétorique du projet, mais déplace l’appel de note auprès de בקר et reformule le complément final afin qu’il qualifie clairement la dispersion des brebis. Aucun développement doctrinal n’est ajouté.
