source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: fr
  text: Je conclurai avec eux une alliance de paix[a] et je ferai disparaître du pays les animaux sauvages dangereux[b]. Ils habiteront en sécurité dans le désert et dormiront dans les forêts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « paix » peut aussi évoquer l’intégrité, le bien-être et la sécurité, et non seulement l’absence de conflit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je ferai cesser du pays les animaux sauvages dangereux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: je conclurai
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». En français actuel, « conclure une alliance » rend naturellement cet idiome sans en perdre la portée formelle.
- source_word: בְּרִית שָׁלוֹם
  choice: une alliance de paix
  rationale: Cette formulation conserve l’expression d’alliance et la richesse de שָׁלוֹם, qui peut évoquer la paix, l’intégrité, le bien-être et la sécurité.
- source_word: הִשְׁבַּתִּי
  choice: je ferai disparaître
  rationale: Le hifil de שבת signifie « faire cesser ». Avec des animaux dangereux et la préposition « du pays », « faire disparaître » exprime clairement leur retrait sans affirmer nécessairement leur extermination.
- source_word: חַיָּה רָעָה
  choice: les animaux sauvages dangereux
  rationale: חַיָּה désigne ici des animaux sauvages, tandis que רָעָה les caractérise comme nuisibles ou dangereux, non comme moralement mauvais.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial et lié à l’alliance, « le pays » convient mieux que « la terre » au sens du globe.
- source_word: יָשְׁבוּ
  choice: ils pourront ainsi habiter
  rationale: Le verbe signifie habiter ou demeurer. La tournure avec « pourront ainsi » explicite naturellement en français la conséquence recherchée par la construction hébraïque coordonnée, sans transformer la promesse en simple possibilité incertaine.
- source_word: בַמִּדְבָּר
  choice: dans les régions sauvages
  rationale: מִדְבָּר peut désigner une étendue inculte ou une steppe servant de pâturage, et pas seulement un désert aride. « Régions sauvages » préserve ici cette amplitude.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Cette expression adverbiale indique l’absence de danger et la sûreté; « habiter en sécurité » est idiomatique en français.
- source_word: יָשְׁנוּ
  choice: dormir
  rationale: Le sens direct est « dormir »; ce choix conserve l’image concrète d’une sécurité complète.
- source_word: בַּיְּעָרִים
  choice: dans les forêts
  rationale: Le pluriel désigne des espaces boisés. « Forêts » est le terme français courant et maintient l’image frappante d’un sommeil sans crainte dans de tels lieux.
theological_decisions:
- issue: Portée de la paix promise dans « alliance de paix »
  choice: Conserver la formule d’alliance sans réduire la paix à la seule absence de guerre ni l’expliciter comme un système doctrinal ultérieur.
  alternative: Traduire « paix » uniquement comme paix politique, ou développer dans le texte principal l’idée d’un salut total.
  rationale: L’expression hébraïque est riche sur les plans relationnel, communautaire et sécuritaire. La traduction doit préserver cette ampleur sans lui imposer une formulation doctrinale plus tardive.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les calques (« couper une alliance », « bêtes mauvaises »). Les notes sont placées sur les expressions auxquelles elles se rapportent; leur attribution corrige l’inversion apparente présente dans la couche anglaise fournie.
