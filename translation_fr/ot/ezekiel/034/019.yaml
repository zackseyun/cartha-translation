  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: fr
  text: Et mon troupeau doit brouter ce que vos pieds ont piétiné[a] et boire l’eau que vos pieds ont troublée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « brouter du piétinement de vos pieds … et boire du remuement de vos pieds ». Il s’agit du pâturage piétiné et de l’eau rendue trouble par les pieds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצֹאנִי
  choice: Et mon troupeau
  rationale: צֹאן désigne collectivement le petit bétail, surtout les brebis et les chèvres. « Mon troupeau » est naturel en français et conserve l’image pastorale.
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: ce que vos pieds ont piétiné
  rationale: מִרְמַס évoque ce qui a été foulé ou piétiné. Cette formulation idiomatique préserve l’image du pâturage abîmé par les pieds.
- source_word: תִּרְעֶינָה
  choice: doit brouter
  rationale: L’imparfait hébreu signifie littéralement « broutera » ou « paîtra ». Dans le contexte, « doit brouter » exprime naturellement la situation imposée au troupeau, sans transformer l’énoncé en commandement.
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: ce que vos pieds ont troublé
  rationale: מִרְפַּשׂ désigne ce que les pieds ont remué, rendu trouble ou boueux. Avec « boire », l’eau est implicitement comprise; « troublé » garde la portée de l’image sans ajout explicatif dans le texte.
- source_word: תִּשְׁתֶּינָה
  choice: et boire
  rationale: Le verbe שׁתה signifie « boire ». L’infinitif coordonné dépend naturellement de « doit » et évite une répétition lourde.
