  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: fr
  text: L’arbre des champs donnera son fruit, et la terre donnera ses récoltes. Ils seront en sécurité sur leur terre. Alors ils sauront que je suis Yahweh, lorsque je briserai les barres de leur joug et que je les délivrerai de la main de ceux qui les asservissent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui les font travailler » ou « ceux qui se servent d’eux ». Le participe hébreu peut être rendu plus littéralement, mais l’image du joug brisé appuie ici le sens plus fort « ceux qui les asservissent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן עֵץ הַשָּׂדֶה אֶת פִּרְיוֹ
  choice: L’arbre des champs donnera son fruit
  rationale: Le singulier collectif hébreu est conservé dans une formulation française naturelle. « Des champs » rend l’expression idiomatiquement sans transformer le collectif en pluriel explicite.
- source_word: וְהָאָרֶץ תִּתֵּן יְבוּלָהּ
  choice: et la terre donnera ses récoltes
  rationale: יְבוּל désigne le produit ou rendement agricole. Le pluriel « récoltes » est courant en français et le possessif reprend le suffixe hébreu.
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: Ils seront en sécurité sur leur terre
  rationale: La traduction suit de près la construction hébraïque sans ajouter le verbe « habiter », absent du texte. לָבֶטַח exprime la sécurité.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Alors ils sauront que je suis Yahweh
  rationale: « Alors » exprime naturellement la progression résultative du contexte. Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּשִׁבְרִי אֶת מֹטוֹת עֻלָּם
  choice: quand je briserai les barres de leur joug
  rationale: La préposition avec l’infinitif construit a ici une valeur temporelle. « Barres » préserve l’image concrète des pièces du joug et la métaphore de l’oppression.
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: et que je les délivrerai de
  rationale: נצל signifie délivrer ou arracher au danger. L’idiome « de la main de » est rendu par un français direct, puisque la notion de pouvoir est déjà portée par le contexte.
- source_word: הָעֹבְדִים בָּהֶם
  choice: ceux qui les asservissent
  rationale: Le participe de עבד avec ב peut désigner ceux qui imposent un service. L’image du joug justifie « asservissent », tout en laissant en note les rendus plus littéraux possibles.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Degré d’oppression exprimé par הָעֹבְדִים בָּהֶם
  choice: ceux qui les asservissent
  alternative: ceux qui les font travailler ; ceux qui se servent d’eux
  rationale: Le joug brisé et la délivrance indiquent une domination oppressive. La note maintient l’étendue sémantique du participe hébreu sans réduire son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique au futur est conservée. Les images agricoles et celle du joug restent concrètes; aucun vocabulaire confessionnel particulier n’est ajouté.
