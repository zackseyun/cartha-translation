  text: לָ/כֵ֣ן רֹעִ֔ים שִׁמְע֖וּ אֶת דְּבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/007.yaml
  text: 'Therefore[a], shepherds, hear the word of Yahweh:'
translation:
  language: fr
  text: 'C’est pourquoi, bergers, écoutez la parole de Yahvé[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le Seigneur » dans de nombreuses traductions françaises.'
    reason: Signaler la forme du texte source et l’usage traditionnel alternatif.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur exprime naturellement en français la conséquence logique tirée de l’accusation précédente.
- source_word: רֹעִים
  choice: bergers
  rationale: Le sens littéral est « bergers ». La métaphore visant les dirigeants d’Israël structure tout le chapitre et doit être conservée.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » rend en français moderne l’appel prophétique à prêter attention et à obéir, sans l’étrangeté que pourrait produire ici « entendez ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: דְּבַר
  choice: la parole de
  rationale: La forme construite de דָּבָר appartient à la formule prophétique consacrée. « La parole de » en conserve le sens et le registre biblique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme YHWH; elle préserve le nom propre plutôt que de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le tétragramme. La traduction conserve donc le nom divin sous sa forme française usuelle, sans le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, clair et digne. La métaphore pastorale et la formule prophétique sont maintenues. La ponctuation finale introduit la déclaration qui suit.
