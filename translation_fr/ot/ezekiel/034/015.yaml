  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: fr
  text: C’est moi qui ferai paître mon troupeau, et c’est moi qui le ferai reposer, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי / וַאֲנִי
  choice: C’est moi qui… et c’est moi qui
  rationale: Le pronom indépendant, répété devant chaque verbe, est emphatique. Cette tournure française naturelle conserve l’insistance et le parallélisme.
- source_word: אֶרְעֶה
  choice: prendrai soin de
  rationale: Le verbe רעה désigne ici toute l’activité du berger — conduire, nourrir et veiller sur le troupeau — plutôt que la seule action de le nourrir.
- source_word: צֹאנִי
  choice: mon troupeau
  rationale: צֹאן est un nom collectif désignant le petit bétail; « mon troupeau » rend naturellement ce sens collectif dans le contexte pastoral.
- source_word: אַרְבִּיצֵם
  choice: le ferai reposer
  rationale: Le hiphil de רבץ signifie faire se coucher ou s’étendre. « Le ferai reposer » préserve l’action du berger tout en exprimant naturellement le repos sûr du troupeau.
- source_word: נְאֻם
  choice: déclare
  rationale: Cette formule prophétique introduit avec autorité la parole divine; « déclare » est clair et actuel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente directement le nom divin יְהוִה, sans confondre les deux éléments du titre.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu associe un titre, אֲדֹנָי, au nom propre divin, יְהוִה. Le rendu choisi distingue les deux et représente explicitement le nom sans ajouter d’interprétation confessionnelle.
- issue: Portée de l’action pastorale exprimée par רעה
  choice: prendrai soin de mon troupeau
  alternative: ferai paître mon troupeau
  rationale: Dans ce discours sur les bergers, le verbe peut couvrir l’ensemble des soins pastoraux. Le choix principal maintient cette amplitude plutôt que de limiter le sens au pâturage ou à l’alimentation.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « C’est moi qui » restitue la double insistance de l’hébreu. Le singulier collectif « le » reprend naturellement « mon troupeau » malgré le suffixe pluriel du verbe hébreu, qui renvoie aux bêtes composant le troupeau.
