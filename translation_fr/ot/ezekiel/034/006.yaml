source:
  edition: WLC
  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: fr
  text: 'Mes brebis s’égarent sur toutes les montagnes et sur chaque haute colline[a] ; mes brebis ont été dispersées sur toute la terre[b] : personne pour les rechercher, personne pour les chercher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « errent » au lieu de « s’égarent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur toute la face de la terre » ; le mot hébreu peut aussi signifier « le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: se sont égarées
  rationale: Le verbe שׁגה exprime le fait de s’écarter du bon chemin. « Se sont égarées » est naturel en français et conserve à la fois l’image pastorale et l’idée d’erreur.
- source_word: צֹאנִי
  choice: mes brebis
  rationale: Le terme peut désigner les brebis ou le troupeau. « Mes brebis » maintient la métaphore concrète et l’accord féminin naturel en français.
- source_word: בְּכָל הֶהָרִים
  choice: sur toutes les montagnes
  rationale: La préposition est rendue selon le terrain parcouru par les brebis ; cette formulation conserve l’étendue distributive de כָּל.
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: et sur chaque haute colline
  rationale: « Chaque » restitue la valeur distributive de כָּל avec le nom singulier, tandis que « haute colline » rend directement גִּבְעָה רָמָה.
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: L’expression hébraïque signifie littéralement « sur toute la face de la terre/du pays ». « Surface » donne en français courant une image équivalente, tandis qu’une note préserve l’ambiguïté de אֶרֶץ.
- source_word: נָפֹצוּ
  choice: ont été dispersées
  rationale: Le niphal de פוץ indique que les brebis ont été dispersées. La tournure passive française en conserve clairement le sens.
- source_word: וְאֵין דּוֹרֵשׁ
  choice: sans que personne parte à leur recherche
  rationale: דרשׁ évoque ici une démarche active pour retrouver les brebis. Cette formulation idiomatique distingue ce premier verbe du second sans effacer leur parallélisme.
- source_word: וְאֵין מְבַקֵּשׁ
  choice: ni les cherche
  rationale: בקשׁ signifie « chercher ». Le maintien d’un second verbe de recherche respecte les deux quasi-synonymes hébreux et leur effet d’insistance.
theological_decisions:
- issue: Référent de « mes brebis »
  choice: Conserver sans explication dans le verset la parole de Dieu désignant métaphoriquement son peuple.
  alternative: Transformer explicitement la métaphore en « mon peuple » ou n’y voir qu’une scène pastorale générique.
  rationale: Dans Ézéchiel 34, Dieu dénonce les bergers défaillants d’Israël et revendique le troupeau comme le sien. La traduction préserve la métaphore et laisse le contexte en établir le référent.
- issue: Portée de הָאָרֶץ
  choice: « la terre » dans le texte, avec une note signalant « le pays ».
  alternative: « le pays » dans le texte, compris plus localement comme le territoire d’Israël ou les pays de la dispersion.
  rationale: אֶרֶץ permet les deux lectures. Le contexte de dispersion autorise une portée large, mais la note conserve l’ambiguïté géographique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé par la répétition de « mes brebis » et par deux formulations distinctes de la recherche. Les marqueurs [a] et [b] figurent dans le texte principal.
