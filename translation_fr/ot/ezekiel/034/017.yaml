source:
  edition: WLC
  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: fr
  text: 'Quant à vous, mon troupeau, ainsi parle le Seigneur Yahweh : Me voici, je juge entre un animal du troupeau et un autre[a], entre les béliers et les boucs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre une bête du petit bétail et une autre »; c’est-à-dire entre les différents membres du troupeau.'
    reason: La note signale la répétition distributive de l’hébreu et la valeur générique de שֶׂה dans le contexte pastoral.
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: Quant à vous
  rationale: Le pronom indépendant féminin pluriel, placé en tête avec la conjonction, marque un changement d’interlocuteur et une adresse appuyée au troupeau.
- source_word: צֹאנִי
  choice: mon troupeau
  rationale: Le nom collectif muni du suffixe de première personne désigne ici l’ensemble du petit bétail sous l’image pastorale.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule française consacrée, naturelle et solennelle pour la formule hébraïque du messager prophétique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente distinctement le nom divin יהוה et évite le redoublement « Seigneur SEIGNEUR ».
- source_word: הִנְנִי
  choice: Me voici
  rationale: Cette formule conserve l’emphase de la présentation personnelle et s’intègre naturellement à la proposition qui suit.
- source_word: שֹׁפֵט
  choice: je juge
  rationale: Le participe présente l’action comme actuelle ou imminente; le présent français préserve cette portée sans la réduire à un futur catégorique.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: entre une bête du troupeau et une autre
  rationale: שֶׂה désigne génériquement un individu du petit bétail, sans imposer le sexe ni même exclusivement l’espèce ovine. Cette formulation rend naturellement la construction distributive française.
- source_word: לָאֵילִים
  choice: les béliers
  rationale: Le terme désigne littéralement les mâles adultes des ovins; l’image animale reste explicite dans le contexte.
- source_word: וְלָעַתּוּדִים
  choice: les boucs
  rationale: Le mot désigne des caprins mâles; « boucs » est le terme français courant et précis.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue le titre אֲדֹנָי du nom propre יהוה et conserve explicitement ce dernier, sans confondre les deux éléments.
- issue: Portée du jugement au sein du troupeau
  choice: entre une bête du troupeau et une autre
  alternative: entre brebis et brebis
  rationale: Le texte annonce un discernement interne au troupeau. La traduction maintient cette portée tout en évitant de donner à שֶׂה un sens féminin que l’hébreu n’impose pas.
translation_notes:
  register: Français international actuel, sobre et digne. La formule prophétique « ainsi parle » et « Me voici » conserve la solennité du passage, tandis que « une bête du troupeau et une autre » rend l’expression hébraïque compréhensible sans en préciser indûment le sexe.
