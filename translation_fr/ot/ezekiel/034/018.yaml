  text: הַ/מְעַ֣ט מִ/כֶּ֗ם הַ/מִּרְעֶ֤ה הַ/טּוֹב֙ תִּרְע֔וּ וְ/יֶ֨תֶר֙ מִרְעֵי/כֶ֔ם תִּרְמְס֖וּ בְּ/רַגְלֵי/כֶ֑ם וּ/מִשְׁקַע מַ֣יִם תִּשְׁתּ֔וּ וְ/אֵת֙ הַ/נּ֣וֹתָרִ֔ים בְּ/רַגְלֵי/כֶ֖ם תִּרְפֹּשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: fr
  text: Ne vous suffit-il pas de paître dans le bon pâturage, sans en plus piétiner le reste de vos pâturages avec vos pieds ? Et de boire une eau claire[a], sans troubler avec vos pieds ce qui reste[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une eau reposée », c’est-à-dire une eau laissée sans être remuée et, par conséquent, claire.
    reason: lexical_alternative
  - marker: b
    text: Ou « rendiez boueuse celle qui reste » ; le verbe hébreu désigne le fait de remuer l’eau avec les pieds et de la rendre trouble.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: N’est-ce pas assez pour vous
  rationale: 'Rend naturellement la question rhétorique de reproche : ce dont ils jouissent devrait leur suffire.'
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: le bon pâturage
  rationale: Conserve l’image pastorale et le sens de מִרְעֶה comme lieu où paître.
- source_word: תִּרְעוּ
  choice: paître dans
  rationale: Le verbe רעה désigne ici l’action des brebis qui paissent; cette formulation est idiomatique en français.
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: le reste de vos pâturages
  rationale: Préserve à la fois l’idée du reste exprimée par יֶתֶר et le pluriel suffixé de מִרְעֵיכֶם.
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: vous piétiniez de vos pieds
  rationale: Conserve le sens de רמס et la mention explicite des pieds, répétée dans le verset pour renforcer l’accusation.
- source_word: וּמִשְׁקַע מַיִם
  choice: une eau claire
  rationale: מִשְׁקַע évoque vraisemblablement une eau reposée, donc non remuée et claire; le sens concret est privilégié dans le texte.
- source_word: הַנּוֹתָרִים
  choice: celle qui reste
  rationale: Le pluriel hébreu s’accorde avec מַיִם, morphologiquement pluriel; en français, le référent naturel « eau » appelle le féminin singulier.
- source_word: תִּרְפֹּשׂוּן
  choice: vous troubliez
  rationale: Le verbe décrit l’action de remuer l’eau avec les pieds et de la rendre trouble; « troubler » maintient ce lien concret sans ajouter l’idée plus générale de pollution.
