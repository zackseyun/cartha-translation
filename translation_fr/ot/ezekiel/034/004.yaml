source:
  edition: WLC
  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: fr
  text: Vous n’avez pas fortifié celles qui étaient faibles[a], vous n’avez pas guéri celle qui était malade, vous n’avez pas pansé celle qui était blessée, vous n’avez pas ramené celle qui s’était égarée[b] et vous n’avez pas cherché celle qui était perdue. Au contraire, vous les avez gouvernées par la force et avec dureté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celles qui étaient malades ». Le terme hébreu peut désigner la maladie ou l’affaiblissement; « faibles » permet ici de le distinguer de « celle qui était malade » dans la proposition suivante.
    reason: lexical_alternative
  - marker: b
    text: Ou « celle qui avait été chassée » ou « repoussée au loin ». Le terme hébreu peut souligner qu’elle a été éloignée plutôt que simplement égarée.
    reason: lexical_alternative
  - marker: c
    text: Ou « avec brutalité ». Le terme hébreu évoque une dureté écrasante et impitoyable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: celles qui étaient faibles
  rationale: Le terme issu de חלה peut désigner l’affaiblissement ou la maladie. « Faibles » le distingue de הַחוֹלָה dans la proposition suivante et s’accorde naturellement avec « fortifier ».
- source_word: חִזַּקְתֶּם
  choice: avez fortifié
  rationale: Le piel de חזק signifie « fortifier, rendre fort ». Cette formulation conserve le lien verbal avec la faiblesse, sans effacer l’image pastorale.
- source_word: הַחוֹלָה
  choice: celle qui était malade
  rationale: Cette forme de חלה désigne naturellement une bête malade et reste distincte de la catégorie précédente, plus générale.
- source_word: רִפֵּאתֶם
  choice: avez guéri
  rationale: רפא est le verbe ordinaire pour guérir. « Guérir » en garde le sens direct dans la métaphore du troupeau.
- source_word: לַנִּשְׁבֶּרֶת
  choice: celle qui était blessée
  rationale: Le participe de שבר signifie littéralement « celle qui est brisée ». Dans le contexte pastoral, « blessée » exprime clairement l’état physique visé tout en évitant une tournure française artificielle.
- source_word: חֲבַשְׁתֶּם
  choice: avez pansé
  rationale: חבש désigne l’action de bander ou panser une blessure. « Panser » est précis, idiomatique et convient au soin d’une bête blessée.
- source_word: הַנִּדַּחַת
  choice: celle qui s’était égarée
  rationale: נדח peut indiquer qu’un être a été chassé, dispersé ou s’est retrouvé écarté. Dans l’image du troupeau, « égarée » rend naturellement le résultat sans trancher sur sa cause.
- source_word: הֲשֵׁבֹתֶם
  choice: avez ramené
  rationale: Le hiphil de שוב signifie « faire revenir, ramener ». « Ramener » convient directement à une brebis éloignée du troupeau.
- source_word: הָאֹבֶדֶת
  choice: celle qui était perdue
  rationale: Dans ce contexte pastoral, אבדת désigne au mieux la bête perdue, tout en pouvant ailleurs évoquer la perdition ou la disparition.
- source_word: בִקַּשְׁתֶּם
  choice: avez cherché
  rationale: בקש signifie « chercher ». La formulation française est simple et directe avec « celle qui était perdue ».
- source_word: וּבְחָזְקָה
  choice: par la force
  rationale: La locution indique une domination coercitive. « Par la force » garde cette valeur sans préciser indûment qu’il s’agit nécessairement de violence physique.
- source_word: רְדִיתֶם
  choice: avez gouvernées
  rationale: רדה signifie exercer la domination ou gouverner. Le verbe reste relativement neutre, tandis que les compléments de manière portent la condamnation explicite.
- source_word: וּבְפָרֶךְ
  choice: avec dureté
  rationale: פֶּרֶךְ évoque une sévérité écrasante et impitoyable. « Avec dureté » est naturel et digne; une note signale l’intensité possible de « brutalité ».
theological_decisions:
- issue: Maintien de la métaphore pastorale
  choice: Conserver les catégories de bêtes faibles, malade, blessée, égarée et perdue sans les remplacer par une désignation explicite du peuple.
  alternative: Reformuler directement en termes politiques ou sociaux pour désigner les personnes mal gouvernées.
  rationale: Le contexte identifie les dirigeants à des bergers, mais le verset développe son accusation au moyen du troupeau. Le maintien de cette image préserve sa force prophétique et ses liens avec le reste du chapitre.
- issue: Cause de l’éloignement de הַנִּדַּחַת
  choice: Employer « celle qui s’était égarée » dans le texte et signaler en note la possibilité « celle qui avait été chassée » ou « repoussée au loin ».
  alternative: Choisir directement une formulation passive qui impute l’éloignement à une force extérieure.
  rationale: La racine נדח peut mettre l’accent sur le fait d’être chassé ou dispersé, tandis que le contexte du troupeau permet aussi de décrire l’état d’égarement. La note conserve cette ambiguïté pertinente.
- issue: Force négative de la proposition finale
  choice: Garder un verbe de gouvernement relativement neutre, qualifié par « par la force et avec dureté ».
  alternative: Employer un verbe déjà fortement interprétatif tel que « tyranniser » ou « opprimer brutalement ».
  rationale: Dans l’hébreu, la condamnation est surtout portée par les deux compléments de manière. La structure retenue rend l’oppression clairement sans surcharger le verbe.
translation_notes:
  register: Français international moderne, courant et digne. La répétition de « vous n’avez pas » reproduit l’accumulation accusatrice de l’hébreu. Les formes féminines maintiennent implicitement l’image des brebis, et l’alternance entre pluriel initial et singuliers suivants suit le relief du texte massorétique sans alourdir la phrase.
