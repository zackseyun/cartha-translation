id: EZK.34.30
reference: Ezekiel 34:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֧י יְהוָ֛ה אֱלֹהֵי/הֶ֖ם אִתָּ֑/ם וְ/הֵ֗מָּה עַמִּ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: fr
  text: Et ils sauront que moi, Yahweh leur Dieu, je suis avec eux[a], et qu’eux, la maison d’Israël, sont mon peuple, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis au milieu d’eux ».
    reason: Alternative lexicale possible pour אִתָּם, qui peut exprimer la présence avec le peuple ou en son sein.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Et ils sauront
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future et résultative. Cette formulation reste directe et naturelle en français moderne.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’ils sauront, et non une proposition causale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom personnel divin présent dans le texte hébreu.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Cette tournure rend naturellement en français le nom construit accompagné du suffixe possessif.
- source_word: אִתָּם
  choice: je suis avec eux
  rationale: « Avec eux » rend directement la préposition hébraïque et conserve le langage de la présence dans la relation d’alliance. « Au milieu d’eux » demeure possible et figure en note.
- source_word: וְהֵמָּה
  choice: et qu’eux
  rationale: Le pronom explicite est emphatique. Le pronom disjoint « eux » en restitue l’insistance en français.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Traduction directe de la formule d’alliance.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette expression prophétique traditionnelle conserve la nuance collective et dynastique de l’hébreu.
- source_word: נְאֻם
  choice: déclare
  rationale: Dans la formule prophétique, « déclare » exprime clairement et solennellement l’autorité de l’énoncé.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Cette traduction préserve les deux éléments du titre hébreu : אֲדֹנָי comme titre et יְהוִה comme nom personnel.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie le tétragramme. « Yahweh » en préserve le caractère de nom personnel sans le remplacer par un titre.
- issue: Langage de la présence d’alliance dans אִתָּם
  choice: je suis avec eux
  alternative: je suis au milieu d’eux
  rationale: « Avec eux » suit au plus près la formulation hébraïque et maintient son lien avec « ils sont mon peuple », tandis que l’autre lecture possible est signalée en note.
- issue: Rendu du titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix retenu distingue le titre אֲדֹנָי du nom יְהוִה et évite de masquer le tétragramme sous un second titre.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « moi… je » et le pronom disjoint « eux » conservent l’emphase des pronoms hébreux sans alourdir excessivement la phrase.
