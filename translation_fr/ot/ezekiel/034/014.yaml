  naturalness: Le français est globalement clair et moderne. « Lieu de séjour » offre un rendu neutre, naturel dans ce registre, qui convient au lieu attribué au troupeau comme au lieu où il se couche, sans transformer le nom en une notion abstraite de repos.
  terminology: « Je les ferai paître », « pâturage », « elles se coucheront » et « elles paîtront » préservent adéquatement l’image du berger et du troupeau. « Pâturage fertile » rend naturellement מִרְעֶה שָׁמֵן sans le littéralisme peu idiomatique « pâturage gras ». La note doit signaler que נָוֶה peut aussi renvoyer à une demeure ou à un pâturage.
