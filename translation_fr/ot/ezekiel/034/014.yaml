base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: fr
  text: Je les ferai paître dans un bon pâturage, et leur lieu de séjour[a] sera sur les hautes montagnes d’Israël. Là, elles se coucheront dans un bon lieu de séjour, et elles paîtront dans un pâturage fertile sur les montagnes d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur demeure » ou « leur pâturage ». Le mot hébreu peut désigner un lieu de séjour, une demeure ou un lieu de pâture.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה טּוֹב
  choice: un bon pâturage
  rationale: Le groupe nominal désigne une bonne terre de pâture. « Bon pâturage » conserve simplement l’évaluation du texte et son image pastorale.
- source_word: אֶרְעֶה אֹתָם
  choice: je les ferai paître
  rationale: Cette tournure française naturelle présente Dieu comme le berger qui conduit et nourrit le troupeau, sans réduire l’image à la seule alimentation.
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: les hautes montagnes d’Israël
  rationale: מְרוֹם exprime ici l’altitude; « hautes montagnes » préserve clairement la dimension topographique.
- source_word: נְוֵהֶם
  choice: leur lieu de repos
  rationale: נָוֶה peut désigner une demeure ou un lieu pastoral. Dans ce contexte de troupeau qui se couche, « lieu de repos » rend naturellement sa fonction sans le confondre entièrement avec מִרְעֶה.
- source_word: תִּרְבַּצְנָה
  choice: elles se coucheront
  rationale: Le féminin pluriel renvoie aux brebis du troupeau. « Se coucher » conserve le geste concret des animaux en sécurité.
- source_word: בְּנָוֶה טּוֹב
  choice: dans un bon lieu de pâture
  rationale: Ici, le parallélisme pastoral favorise le sens de terrain où le troupeau séjourne et se nourrit. La note signale l’autre valeur possible du nom.
- source_word: מִרְעֶה שָׁמֵן
  choice: un pâturage abondant
  rationale: שָׁמֵן signifie littéralement « gras » et évoque par extension fertilité et abondance. « Abondant » est idiomatique en français moderne tout en maintenant cette idée.
- source_word: תִּרְעֶינָה
  choice: elles paîtront
  rationale: Le troupeau étant sujet, « paître » exprime directement l’action des brebis dans le pâturage.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: sur les montagnes d’Israël
  rationale: Bien que אֶל marque souvent une direction, il prend ici une valeur spatiale adaptée à l’activité de pâture; « sur » est naturel en français.
theological_decisions:
- issue: Image pastorale des soins de Dieu
  choice: Maintenir les images concrètes du berger, du pâturage et des brebis qui se couchent.
  alternative: Paraphraser par des notions abstraites de protection, de provision et de sécurité.
  rationale: Le verset appartient à une longue métaphore pastorale. Conserver cette métaphore respecte le texte sans imposer une interprétation doctrinale supplémentaire.
- issue: Sens de נָוֶה
  choice: Employer « lieu de repos » puis « lieu de pâture », avec une note sur l’ambiguïté lexicale.
  alternative: Uniformiser les deux occurrences par « demeure » ou par « pâturage ».
  rationale: Le nom peut évoquer aussi bien le séjour que la pâture. Les rendus contextuels préservent la progression—lieu assigné, puis lieu où le troupeau se couche—tandis que la note maintient l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les sujets féminins « elles » rendent explicitement les brebis sous-entendues par les formes verbales hébraïques. La répétition de « pâturage » et « paître » est maintenue pour porter l’image pastorale structurante.
