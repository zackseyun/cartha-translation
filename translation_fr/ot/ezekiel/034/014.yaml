revisions:
- from: Je les ferai paître dans un bon pâturage, et leur lieu de repos sera sur les hautes montagnes d’Israël. Là, elles se coucheront dans un bon lieu de pâture[a] et elles paîtront dans un pâturage abondant, sur les montagnes d’Israël.
  to: Je les ferai paître dans un bon pâturage, et leur lieu de séjour[a] sera sur les hautes montagnes d’Israël. Là, elles se coucheront dans un bon lieu de séjour, et elles paîtront dans un pâturage fertile sur les montagnes d’Israël.
  rationale: La révision emploie « lieu de séjour » aux deux occurrences de נָוֶה afin de maintenir la cohérence lexicale et de ne pas trancher entre les sens voisins de demeure et de pâturage. La note préserve explicitement ces possibilités. Le reste du texte est conservé avec une légère suppression de la virgule avant « sur les montagnes d’Israël », qui rend la dernière proposition plus fluide sans modifier son sens.
