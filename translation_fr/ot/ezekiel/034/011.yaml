  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִי אָ֕נִי וְ/דָרַשְׁתִּ֥י אֶת צֹאנִ֖/י וּ/בִקַּרְתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : Voici que moi-même, je chercherai mes brebis et je m’occuperai d’elles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les examinerai », « je veillerai sur elles » ou « je prendrai soin d’elles ». Le verbe hébreu peut évoquer l’inspection des brebis aussi bien que l’attention personnelle qui leur est accordée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le double titre hébreu associe אֲדֹנָי, « Seigneur », au nom divin YHWH. « Le Seigneur Yahweh » préserve les deux éléments sans produire l’expression artificielle « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי אָנִי
  choice: Me voici, moi-même !
  rationale: הִנְנִי présente avec force l’intervention personnelle de Dieu, tandis que אָנִי renforce explicitement le sujet. Cette formulation française conserve cette insistance.
- source_word: וְדָרַשְׁתִּי
  choice: Je rechercherai
  rationale: Dans ce contexte pastoral, דרש exprime l’action de chercher activement les brebis. « Rechercher » convient au registre et prépare naturellement le second verbe.
- source_word: צֹאנִי
  choice: mes brebis
  rationale: צֹאן désigne collectivement le petit bétail ou le troupeau. « Mes brebis » rend concrètement l’image pastorale et correspond à l’objet pluriel repris ensuite.
- source_word: וּבִקַּרְתִּים
  choice: et je prendrai soin d’elles
  rationale: בקר peut ici exprimer le fait d’examiner, de s’occuper de ou de veiller personnellement sur les brebis. « Prendre soin d’elles » distingue ce verbe du précédent tout en conservant sa nuance pastorale; les autres possibilités sont signalées en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre divin YHWH. Garder « Yahweh » préserve cette distinction et évite d’effacer le nom de l’alliance derrière un titre générique.
- issue: Portée de l’intervention divine dans הִנְנִי אָנִי
  choice: Me voici, moi-même !
  alternative: Voici que moi, je vais
  rationale: La formulation retenue conserve l’accent inhabituel mis sur l’action personnelle de Dieu, sans expliciter davantage la raison théologique de cette insistance.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure prophétique « voici ce que dit » est conservée, et l’exclamation après « Me voici, moi-même » rend l’emphase hébraïque sans archaïsme excessif.
