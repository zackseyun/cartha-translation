  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: fr
  text: 'Puis il me dit : « As-tu vu cela, fils d’homme ? Tu verras encore des abominations plus grandes que celles-ci. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֵבוֹת
  choice: pratiques abominables
  rationale: Le nom désigne ici des actes ou pratiques religieuses jugés odieux, et non un simple sentiment d’aversion. Cette formulation reste naturelle en français tout en conservant la condamnation forte du texte.
- source_word: גְּדֹלוֹת מֵאֵלֶּה
  choice: plus graves que celles-ci
  rationale: Littéralement « plus grandes que celles-ci » ; en parlant de pratiques abominables, « plus graves » exprime naturellement en français l’intensification morale.
- source_word: ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה
  choice: Tu verras encore
  rationale: 'La combinaison de עוֹד et du verbe שׁוב employé adverbialement marque la répétition ou la continuation : une nouvelle vision va suivre. « Encore » rend cette nuance sans la lourdeur de « tu retourneras voir ».'
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique d’Ézéchiel, conservée sous sa forme traditionnelle et transparente.
theological_decisions:
- issue: Force morale de תּוֹעֵבוֹת
  choice: pratiques abominables
  alternative: abominations
  rationale: « Pratiques abominables » explicite qu’il s’agit des conduites cultuelles montrées au prophète, sans atténuer leur condamnation. Le terme ne reçoit pas ici une définition confessionnelle plus étroite.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe directe reproduit l’enchaînement de la vision ; « fils d’homme » maintient le registre prophétique traditionnel.
