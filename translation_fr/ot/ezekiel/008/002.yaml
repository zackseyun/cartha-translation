source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה דְמוּת֙ כְּ/מַרְאֵה אֵ֔שׁ מִ/מַּרְאֵ֥ה מָתְנָ֛י/ו וּ/לְ/מַ֖טָּה אֵ֑שׁ וּ/מִ/מָּתְנָ֣י/ו וּ/לְ/מַ֔עְלָ/ה כְּ/מַרְאֵה זֹ֖הַר כְּ/עֵ֥ין הַ/חַשְׁמַֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: fr
  text: 'Puis je vis : voici une forme qui avait l’aspect du feu. Depuis ce qui paraissait être sa taille jusqu’en bas, c’était du feu ; et depuis sa taille jusqu’en haut, c’était comme l’aspect d’une lumière rayonnante, comme l’éclat de l’ambre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme l’aspect de l’électrum » ou « comme l’éclat d’un métal incandescent ». Le terme hébreu est rare et désigne une matière d’un brillant intense.
    reason: Alternative lexicale pour le terme rare חַשְׁמַל.
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Puis je vis
  rationale: Le waw narratif fait progresser le récit de la vision. Cette formulation française est naturelle tout en conservant le témoignage visuel à la première personne.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la force déictique et l’effet soudain de la scène visionnaire dans un registre digne et courant.
- source_word: דְמוּת
  choice: une forme
  rationale: Le terme désigne une réalité perçue par ressemblance dans la vision, sans l’identifier de manière catégorique. « Forme » reste clair et non excessivement précis.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: qui avait l’aspect du feu
  rationale: Cette traduction maintient explicitement le langage comparatif de כ et מַרְאֶה, sans affirmer que la forme était littéralement du feu.
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: depuis ce qui paraissait être sa taille
  rationale: L’expression hébraïque est elliptique et difficile. Cette formulation rend la répétition de l’idée d’apparence, emploie une désignation anatomique moderne et évite de surdéterminer la vision.
- source_word: וּלְמַטָּה
  choice: jusqu’en bas
  rationale: Rend simplement l’orientation spatiale descendante et s’intègre naturellement à la construction française.
- source_word: אֵשׁ
  choice: c’était du feu
  rationale: Le nom est rendu directement ; l’ajout de « c’était » explicite en français la proposition nominale hébraïque sans modifier son sens.
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: et depuis sa taille jusqu’en haut
  rationale: Conserve le parallélisme spatial avec la proposition précédente dans un français actuel.
- source_word: כְּמַרְאֵה זֹהַר
  choice: comme une clarté éclatante
  rationale: זֹהַר évoque une lumière brillante ou rayonnante. « Clarté éclatante » transmet cette luminosité tout en gardant la comparaison.
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: comme l’éclat de l’ambre
  rationale: חַשְׁמַל est un terme rare désignant apparemment une matière d’un brillant intense. « Ambre » reste accessible et traditionnel dans les traductions d’Ézéchiel, tandis que l’incertitude lexicale est signalée en note.
theological_decisions:
- issue: Description visionnaire de la forme
  choice: Maintenir les expressions d’apparence et de comparaison
  alternative: Décrire directement l’être comme étant lui-même du feu ou une matière métallique rayonnante
  rationale: Ézéchiel qualifie avec retenue ce qu’il voit au moyen de termes de ressemblance et d’apparence. Les conserver évite de transformer une perception visionnaire en identification ontologique.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la progression vive de la vision, le parallélisme entre le bas et le haut de la forme, ainsi que la prudence descriptive du texte hébreu.
