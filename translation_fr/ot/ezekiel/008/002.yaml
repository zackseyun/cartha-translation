revisions:
- from: 'Puis je vis : voici une forme qui avait l’aspect du feu. Depuis ce qui paraissait être sa taille jusqu’en bas, c’était du feu ; et depuis sa taille jusqu’en haut, c’était comme une clarté éclatante, comme l’éclat de l’ambre[a].'
  to: 'Puis je vis : voici une forme qui avait l’aspect du feu. Depuis ce qui paraissait être sa taille jusqu’en bas, c’était du feu ; et depuis sa taille jusqu’en haut, c’était comme l’aspect d’une lumière rayonnante, comme l’éclat de l’ambre[a].'
  rationale: La révision remplace seulement « une clarté éclatante » par « l’aspect d’une lumière rayonnante ». Elle préserve ainsi plus explicitement la construction comparative et le langage d’apparence de l’hébreu, sans alourdir le français ni trancher l’incertitude concernant חַשְׁמַל.
