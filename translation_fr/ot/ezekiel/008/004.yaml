id: EZK.8.4
reference: Ezekiel 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: fr
  text: Et voici que la gloire du Dieu d’Israël était là, semblable à ce que j’avais vu dans la vallée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la plaine ». Le mot hébreu בִּקְעָה peut désigner une large vallée ou une plaine.
    reason: Alternative lexicale authentique du terme hébreu.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve à la fois l’enchaînement narratif et la force vive, déictique, de הִנֵּה dans un français actuel et digne.
- source_word: שָׁם
  choice: était là
  rationale: Rend explicitement la valeur locative de l’adverbe tout en formant une proposition française naturelle.
- source_word: כְּבוֹד
  choice: la gloire
  rationale: « Gloire » est le terme français usuel pour כָּבוֹד dans le cadre d’une manifestation divine et en préserve la portée visible et théologique sans ajout explicatif.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: du Dieu d’Israël
  rationale: Rend directement la chaîne construite hébraïque et conserve l’identification traditionnelle et relationnelle de Dieu avec Israël.
- source_word: כַּמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: semblable à ce que j’avais vu
  rationale: Cette formulation naturelle maintient la comparaison avec la manifestation visuelle antérieure. Elle évite le peu idiomatique « l’apparence que j’avais vue » et ne précise pas indûment s’il s’agit de l’aspect observé ou de la vision elle-même.
- source_word: בַּבִּקְעָה
  choice: dans la vallée
  rationale: בִּקְעָה peut désigner une large vallée ou une plaine. « Vallée » convient à l’allusion probable à Ézéchiel 3.22-23, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Nature de « la gloire du Dieu d’Israël »
  choice: Présenter simplement la gloire de Dieu comme étant visible sur place, sans explication ajoutée.
  alternative: Préciser qu’il s’agit de la splendeur visible représentant la présence de Dieu ou d’une manifestation théophanique technique.
  rationale: Le texte affirme que la gloire du Dieu d’Israël était là et la rapproche de ce qu’Ézéchiel avait déjà vu. La traduction conserve cette force théophanique sans définir davantage la relation entre la gloire manifestée et Dieu lui-même.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici que » garde la vivacité du récit prophétique sans archaïsme excessif. La formulation « semblable à ce que j’avais vu » privilégie l’idiomaticité tout en préservant l’indétermination du nom מַרְאֶה.
