  naturalness: Le texte révisé demeure idiomatique, moderne et d’un registre prophétique sobre. « Toute forme d’animaux qui rampent » est plus large et plus fidèle que « toutes sortes de représentations de reptiles ».
  terminology: « Maison d’Israël », « idoles » et « gravées » sont appropriés. La note conserve la force méprisante de גִּלּוּלִים tout en ne présentant pas comme certaine une étymologie débattue.
