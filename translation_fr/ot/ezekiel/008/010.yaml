  text: וָ/אָבוֹא֮ וָֽ/אֶרְאֶה֒ וְ/הִנֵּ֨ה כָל תַּבְנִ֜ית רֶ֤מֶשׂ וּ/בְהֵמָה֙ שֶׁ֔קֶץ וְ/כָל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל מְחֻקֶּ֥ה עַל הַ/קִּ֖יר סָבִ֥יב סָבִֽיב־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: fr
  text: 'J’entrai et je regardai. Et voici : toute forme d’animaux qui rampent et de bêtes abominables, ainsi que toutes les idoles[a] de la maison d’Israël, étaient gravées sur le mur, tout autour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement méprisant ; on pourrait aussi rendre « idoles immondes ». Son étymologie est discutée ; certains le rapprochent du mot « fumier ».
    reason: Préserver la nuance péjorative marquée de גִּלּוּלִים sans présenter comme certaine une étymologie discutée.
lexical_decisions:
- source_word: וָאָבוֹא וָאֶרְאֶה
  choice: J’entrai donc et je regardai
  rationale: Les deux formes narratives font progresser le récit et décrivent successivement l’entrée puis l’observation. « J’entrai » convient au mouvement dans la pièce, et « je regardai » introduit naturellement la scène contemplée.
- source_word: וְהִנֵּה
  choice: 'Et voici :'
  rationale: « Voici » conserve la présentation vive et soudaine propre à הִנֵּה ; les deux-points introduisent clairement le contenu de la vision en français moderne.
- source_word: כָל תַּבְנִית
  choice: toutes sortes de représentations
  rationale: תַּבְנִית désigne ici une forme ou une représentation figurée. Cette formulation française exprime la diversité signalée par כָל sans suggérer nécessairement des statues.
- source_word: רֶמֶשׂ וּבְהֵמָה שֶׁקֶץ
  choice: de reptiles et de bêtes abominables
  rationale: רֶמֶשׂ désigne les créatures qui rampent ; « reptiles » est naturel dans ce catalogue d’images. שֶׁקֶץ exprime leur caractère répugnant ou rituellement détestable. La syntaxe hébraïque permet une certaine ambiguïté sur la portée exacte du terme, mais le français l’attache naturellement aux bêtes sans effacer l’évaluation négative de l’ensemble.
- source_word: גִּלּוּלֵי
  choice: idoles
  rationale: « Idoles » est clair et naturel dans le texte principal. La forte nuance méprisante propre au terme employé par Ézéchiel est conservée dans une note.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La désignation prophétique traditionnelle est conservée plutôt que réduite simplement à « Israël ».
- source_word: מְחֻקֶּה עַל הַקִּיר
  choice: étaient gravées sur le mur
  rationale: Le participe passif de חקק évoque des figures incisées ou gravées. L’accord au pluriel reprend naturellement l’ensemble des représentations et des idoles.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette expression idiomatique rend la répétition hébraïque intensive et l’étendue des gravures sur le pourtour du mur.
theological_decisions:
- issue: Force méprisante du terme employé pour les idoles
  choice: Employer « idoles » dans le texte et signaler en note la nuance fortement dépréciative.
  alternative: « idoles immondes » ou, très littéralement, « idoles de fumier »
  rationale: Le terme hébreu est volontairement insultant, mais une traduction littérale dans le corps du verset serait peu naturelle et pourrait imposer une image étymologique trop précise. La note préserve la vigueur rhétorique sans obscurcir le sens.
- issue: Portée syntaxique de שֶׁקֶץ
  choice: Rendre le groupe par « reptiles et bêtes abominables ».
  alternative: « reptiles et bêtes, choses abominables » ou « toutes sortes de reptiles et de bêtes répugnantes »
  rationale: L’hébreu compact peut laisser discuter la portée exacte de שֶׁקֶץ. La formulation retenue reste naturelle et traduit l’évaluation de ces créatures sans introduire une catégorie doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en valeur l’irruption visuelle introduite par « voici ». Le vocabulaire demeure concret et prophétique sans archaïsmes inutiles.
