  text: וַ/יָּבֵ֥א אֹתִ֖/י אֶל פֶּ֣תַח הֶֽ/חָצֵ֑ר וָ/אֶרְאֶ֕ה וְ/הִנֵּ֥ה חֹר אֶחָ֖ד בַּ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: fr
  text: Puis il m’amena à l’entrée de la cour. Je regardai, et voici qu’il y avait un trou dans le mur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Puis il m’amena
  rationale: Le hiphil narratif de בוא signifie « amener »; « puis » rend naturellement la progression du récit, et אֹתִי est le complément direct « me/m’ ».
- source_word: אֶל פֶּתַח הֶחָצֵר
  choice: à l’entrée de la cour
  rationale: אֶל indique le mouvement vers un lieu; פֶּתַח désigne une entrée ou ouverture, et חָצֵר une cour. « Cour » convient au contexte de l’enceinte du temple.
- source_word: וָאֶרְאֶה
  choice: Je regardai
  rationale: ראה peut exprimer le fait de regarder ou celui de voir. Ici, avant וְהִנֵּה, « je regardai » rend bien l’attention dirigée vers ce qui est ensuite découvert.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: הִנֵּה attire vivement l’attention sur la découverte. « Voici que » conserve cette fonction dans un français actuel et digne.
- source_word: חֹר אֶחָד
  choice: un trou
  rationale: חֹר désigne un trou ou une ouverture; אֶחָד fonctionne ici naturellement comme marqueur indéfini, sans insistance numérique.
- source_word: בַּקִּיר
  choice: dans le mur
  rationale: קִיר signifie « mur » et la préposition ב indique ici l’emplacement du trou.
