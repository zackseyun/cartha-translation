  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, vois-tu ce qu’ils font — les grandes abominations que la maison d’Israël commet ici — pour me chasser loin de mon sanctuaire[a] ? Mais tu verras encore de grandes abominations.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour me faire partir loin de mon sanctuaire ». La construction peut aussi être comprise, selon une autre analyse, comme se rapportant à l’éloignement du peuple par rapport au sanctuaire.'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: 'L’hébreu répète « de grandes abominations ». Dans ce contexte, la répétition avec « encore » peut marquer une progression : « des abominations encore plus grandes ».'
    reason: répétition littérale pouvant exprimer une progression
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse prophétique caractéristique d’Ézéchiel, tout en restant naturelle et traditionnelle en français.
- source_word: הֲרֹאֶה אַתָּה
  choice: vois-tu
  rationale: Rend directement et idiomatiquement l’interrogation hébraïque avec participe.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: grandes abominations
  rationale: « Abominations » préserve la forte portée cultuelle et morale du terme dans le discours prophétique.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Maintient la désignation collective et alliancélle du texte hébreu plutôt que de la simplifier en « Israël ».
- source_word: פֹּה
  choice: ici
  rationale: Équivalent déictique simple et naturel.
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: pour m’éloigner de mon sanctuaire
  rationale: Exprime le fait que les actes commis provoquent l’éloignement de Dieu, tout en laissant une note signaler l’ambiguïté syntaxique réelle.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: « Sanctuaire » correspond précisément à מִקְדָּשׁ et évite de réduire le terme à l’édifice du Temple.
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: Mais tu verras encore
  rationale: Rend naturellement l’idiome hébreu qui annonce la poursuite de la vision et une nouvelle scène.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: de grandes abominations
  rationale: Reproduit la répétition exacte de l’hébreu sans transformer explicitement l’adjectif en comparatif; le contexte et « encore » portent la progression.
theological_decisions:
- issue: Le référent implicite de לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: Les abominations ont pour effet d’éloigner Dieu de son sanctuaire.
  alternative: La proposition pourrait décrire un éloignement du sanctuaire sans préciser aussi nettement qui s’éloigne.
  rationale: Le contexte d’Ézéchiel et le suffixe de première personne dans « mon sanctuaire » favorisent l’éloignement de Dieu, mais la formulation hébraïque compacte justifie de préserver l’autre possibilité en note.
- issue: La progression dans la dernière proposition
  choice: Conserver littéralement « de grandes abominations » après « encore ».
  alternative: « Des abominations plus grandes encore » ou « des abominations encore plus grandes ».
  rationale: L’hébreu répète la même expression, תּוֹעֵבוֹת גְּדֹלוֹת, sans comparatif morphologique. La traduction retenue préserve cette répétition et la note explicite le sens possible de progression.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans raideur excessive. « Fils d’homme », « maison d’Israël », « abominations » et « sanctuaire » conservent le registre prophétique et cultuel du passage.
