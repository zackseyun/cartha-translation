source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: fr
  text: Puis il étendit ce qui ressemblait à une main[a] et me saisit par une mèche de mes cheveux. L’Esprit[b] me souleva entre la terre et le ciel et, dans des visions de Dieu, m’amena à Jérusalem, à l’entrée de la porte intérieure qui fait face au nord, là où se trouvait l’image de la jalousie qui provoque la jalousie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une forme de main » ou « la ressemblance d’une main ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le vent » ou « un esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: ce qui ressemblait à une main
  rationale: תַּבְנִית désigne une forme ou une ressemblance. Cette formulation naturelle maintient le caractère perceptif de la vision sans affirmer qu’il s’agissait nécessairement d’une main au sens littéral.
- source_word: בְּצִיצִת רֹאשִׁי
  choice: par une mèche de cheveux
  rationale: צִיצִת désigne ici une touffe ou une mèche. La formulation française restitue concrètement et naturellement le geste.
- source_word: רוּחַ
  choice: l’Esprit
  rationale: Dans les récits de transport visionnaire d’Ézéchiel, le contexte favorise l’action de l’Esprit divin, tout en laissant les autres valeurs possibles du mot en note.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: entre la terre et le ciel
  rationale: En français courant, « le ciel » est la manière idiomatique de rendre שָׁמַיִם dans cette expression spatiale, sans perte de sens.
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: dans des visions de Dieu
  rationale: Le pluriel de מַרְאוֹת est conservé, et « de Dieu » maintient l’ouverture entre provenance divine et caractère divin.
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: l’entrée de la porte intérieure
  rationale: La formulation conserve les deux éléments, l’ouverture et la porte, ainsi que leur relation syntaxique.
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: qui fait face au nord
  rationale: Rendu directionnel clair et idiomatique en français moderne.
- source_word: מוֹשַׁב
  choice: là où se trouvait
  rationale: Dans ce contexte, מוֹשַׁב indique l’emplacement fixe de l’image. Une tournure locative est plus naturelle en français que « le siège de ».
- source_word: סֵמֶל
  choice: idole
  rationale: סֵמֶל désigne une représentation cultuelle condamnée dans ce contexte. « Idole » rend clairement sa fonction sans alourdir l’expression.
- source_word: הַקִּנְאָה ... הַמַּקְנֶה
  choice: de la jalousie qui provoque la jalousie
  rationale: La répétition de « jalousie » conserve le jeu lexical hébreu entre le nom קִנְאָה et la forme causative apparentée.
theological_decisions:
- issue: רוּחַ peut désigner le vent, un esprit ou l’Esprit divin.
  choice: l’Esprit
  alternative: le vent ; un esprit
  rationale: Le transport surnaturel du prophète et l’usage plus large d’Ézéchiel favorisent l’agent divin. Une note préserve toutefois l’ambiguïté lexicale réelle.
- issue: La relation exprimée par בְּמַרְאוֹת אֱלֹהִים peut indiquer la source ou la qualité des visions.
  choice: dans des visions de Dieu
  alternative: dans des visions divines ; dans des visions venant de Dieu
  rationale: Le génitif français conserve, comme l’hébreu, une certaine ouverture entre visions données par Dieu et visions de nature divine.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme de la longue phrase visionnaire est allégé par deux phrases, sans modifier l’enchaînement des actions. La répétition finale, inhabituelle mais significative, est volontairement conservée.
