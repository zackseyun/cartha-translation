  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: fr
  text: 'Puis il me dit : « As-tu vu, fils d’homme, ce que les anciens de la maison d’Israël font dans l’obscurité, chacun dans les chambres de ses images[a] ? Car ils disent : “Yahweh ne nous voit pas ; Yahweh a abandonné le pays[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les chambres de son imagerie » ou « dans les chambres de son image gravée ». Le terme hébreu peut désigner des figures ou des représentations, probablement idolâtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « la terre ». Ici, il s’agit probablement du pays d’Israël ou de Juda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français.
- source_word: הֲרָאִיתָ
  choice: As-tu vu
  rationale: L’interrogation avec l’accompli renvoie à ce qui vient d’être montré au prophète dans la vision.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette formule conserve l’appellation prophétique récurrente d’Ézéchiel et sa portée littéraire.
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: les anciens de la communauté d’Israël
  rationale: Ici, « maison » désigne collectivement le peuple d’Israël ; « communauté » rend cette valeur de manière claire et naturelle sans suggérer un bâtiment ou une dynastie.
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: font dans l’obscurité
  rationale: Cette formulation maintient à la fois l’obscurité concrète de la vision et la connotation d’actes secrets.
- source_word: אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: chacun dans les pièces où se trouvent ses représentations
  rationale: Le distributif אִישׁ est rendu par « chacun ». מַשְׂכִּית peut désigner une image ou une représentation figurée, possiblement gravée ; le pluriel français collectif évite de trancher indûment entre une image unique et un décor figuré.
- source_word: כִּי אֹמְרִים
  choice: Car ils disent
  rationale: כִּי introduit ici la raison de leur conduite cachée ; le présent exprime leur conviction persistante.
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: Yahweh ne nous voit pas
  rationale: Rend directement et idiomatiquement la proposition participiale négative tout en conservant le nom divin.
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: Yahweh a abandonné le pays
  rationale: « Abandonné » restitue la force de עָזַב. Dans ce contexte centré sur Jérusalem et le sanctuaire, הָאָרֶץ désigne vraisemblablement le pays d’Israël plutôt que la terre entière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme ; « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Étendue de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le cadre du temple de Jérusalem favorise le sens territorial, probablement le pays d’Israël/Juda, mais une note signale l’autre portée lexicale possible.
- issue: Nature de מַשְׂכִּית
  choice: représentations
  alternative: images gravées
  rationale: Le terme peut désigner des figures, images ou représentations gravées. Le texte principal préserve cette latitude plutôt que de préciser sans certitude leur technique de fabrication.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression visionnaire et la parole directe. « Fils d’homme » et « Yahweh » maintiennent les expressions théologiquement et littérairement marquées du texte source.
