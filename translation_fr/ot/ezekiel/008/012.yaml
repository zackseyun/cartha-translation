  to: 'Puis il me dit : « As-tu vu, fils d’homme, ce que les anciens de la maison d’Israël font dans l’obscurité, chacun dans les chambres de ses images[a] ? Car ils disent : “Yahweh ne nous voit pas ; Yahweh a abandonné le pays[b].” »'
  rationale: La révision restitue « maison d’Israël », expression caractéristique d’Ézéchiel, et rapproche le rendu de la construction hébraïque « chambres de son imagerie/de ses images ». La note a est maintenue au même emplacement et explicite les possibilités lexicales sans imposer une interprétation précise. La note b conserve l’ambiguïté de הָאָרֶץ.
