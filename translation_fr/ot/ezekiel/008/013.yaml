lexical_decisions:
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Tu verras encore
  rationale: La combinaison de עוֹד et תָּשׁוּב exprime ici la répétition; en français naturel, « encore » suffit sans le redondant « tu recommenceras à voir ».
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: des abominations plus grandes
  rationale: Dans la progression de la vision, l’adjectif peut avoir une valeur comparative contextuelle. « Plus grandes » conserve cette gradation, reprise par la couche de consultation anglaise.
- source_word: עֹשִׂים
  choice: commettent
  rationale: Avec « abominations », « commettre » est idiomatique en français et rend l’action moralement répréhensible sans ajouter de précision étrangère au texte.
theological_decisions:
- issue: 'Valeur de גְּדֹלוֹת : absolue ou comparative'
  choice: plus grandes
  alternative: grandes
  rationale: L’hébreu ne marque pas morphologiquement le comparatif, mais le contexte immédiat et la progression rhétorique soutiennent « plus grandes ». Cette lecture ne précise pas au-delà du texte la nature de leur gravité.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve l’adresse directe ainsi que la progression dramatique du passage.
