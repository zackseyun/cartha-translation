language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שִׁבְעִ֣ים אִ֣ישׁ מִ/זִּקְנֵ֣י בֵֽית יִ֠שְׂרָאֵל וְ/יַאֲזַנְיָ֨הוּ בֶן שָׁפָ֜ן עֹמֵ֤ד בְּ/תוֹכָ/ם֙ עֹמְדִ֣ים לִ/פְנֵי/הֶ֔ם וְ/אִ֥ישׁ מִקְטַרְתּ֖/וֹ בְּ/יָד֑/וֹ וַ/עֲתַ֥ר עֲנַֽן הַ/קְּטֹ֖רֶת עֹלֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/011.yaml
  text: And seventy men from the elders of the house of Israel[a], with Jaazaniah the son of Shaphan standing among them, were standing before them, each man with his censer in his hand[d][c][b]; and the thick cloud of incense was going up.
translation:
  language: fr
  text: Soixante-dix hommes d’entre les anciens de la maison d’Israël — Yaazania, fils de Shaphân, se tenait au milieu d’eux[a] — se tenaient devant eux[b], chacun son encensoir[c] à la main, et un épais nuage d’encens[d] s’élevait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi eux ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit vraisemblablement des représentations figurant sur le mur de la pièce (voir v. 10).
    reason: cross_reference
  - marker: c
    text: Ou « brûle-parfum ».
    reason: lexical_alternative
  - marker: d
    text: L’expression hébraïque souligne l’abondance ou la densité du nuage d’encens.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים אִישׁ
  choice: soixante-dix hommes
  rationale: Le groupe compté est explicitement masculin dans le contexte; « hommes » conserve cette donnée.
- source_word: מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: pris parmi les anciens de la maison d’Israël
  rationale: « Pris parmi » rend la valeur partitive de מִן, tandis que « maison d’Israël » conserve l’expression hébraïque.
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן
  choice: Yaazania, fils de Shaphân
  rationale: Les noms sont translittérés et la filiation est exprimée de façon naturelle en français.
- source_word: עֹמֵד בְּתוֹכָם
  choice: se tenait au milieu d’eux
  rationale: Cette formulation conserve la position centrale exprimée par בְּתוֹךְ et distingue le singulier du participe suivant au pluriel.
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: se tenaient devant eux
  rationale: L’imparfait décrit la scène visionnaire en cours; le pronom pluriel reste volontairement non explicité, comme en hébreu.
- source_word: מִקְטַרְתּוֹ
  choice: son encensoir
  rationale: « Encensoir » désigne avec concision l’instrument servant à brûler l’encens et convient au registre cultuel.
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת
  choice: et un épais nuage d’encens
  rationale: עֲתַר exprime ici l’abondance ou la densité; « épais » restitue naturellement l’intensité visuelle.
- source_word: עֹלֶה
  choice: s’élevait
  rationale: L’imparfait rend l’action continue du participe et le mouvement ascendant du nuage.
theological_decisions:
- issue: Référent de « devant eux » (לִפְנֵיהֶם)
  choice: Maintien du pronom pluriel « eux » sans explicitation dans le texte principal.
  alternative: « devant les représentations figurant sur le mur »
  rationale: Dans le contexte, le suffixe renvoie probablement aux figures décrites au verset 10, mais le texte hébreu n’identifie pas expressément son référent. Le pronom préserve cette ambiguïté.
translation_notes:
  register: Français moderne, courant et digne. La construction entre tirets permet de conserver l’ordre de la scène et l’accord distinct des deux participes hébreux sans alourdir la phrase. « Maison d’Israël » maintient la formulation biblique traditionnelle tout en restant intelligible.
