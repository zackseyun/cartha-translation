  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: fr
  text: 'Moi aussi, j’agirai avec fureur : mon œil n’épargnera pas, et je n’aurai aucune compassion. Même s’ils crient à mes oreilles d’une voix forte, je ne les écouterai pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: L’expression rend l’addition et l’emphase portée par le pronom explicite, dans un français naturel, sans imposer une valeur adversative plus forte que l’hébreu.
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: j’agirai avec fureur
  rationale: « Agir » convient au verbe large עשה dans ce contexte de jugement, et « avec fureur » restitue l’intensité de חֵמָה en français courant et digne.
- source_word: לֹא תָחוֹס עֵינִי
  choice: mon œil sera sans pitié
  rationale: Cette formulation conserve l’image anthropomorphique de l’œil tout en exprimant naturellement l’idée que celui-ci n’épargnera pas.
- source_word: וְלֹא אֶחְמֹל
  choice: et je n’aurai aucune compassion
  rationale: « Compassion » distingue la nuance affective de חמל de l’absence de pitié exprimée dans le membre parallèle.
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: Même s’ils crient à mes oreilles d’une voix forte
  rationale: « Même si » explicite sobrement la relation concessive créée par le contraste contextuel; « à mes oreilles » maintient l’image concrète et « d’une voix forte » rend l’expression hébraïque.
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: je ne les écouterai pas
  rationale: Dans ce contexte d’appel volontairement ignoré, « écouter » exprime naturellement le refus de prêter attention ou de répondre, sans suggérer une incapacité auditive.
theological_decisions:
- issue: Sévérité et langage anthropomorphique du jugement divin
  choice: Conserver la fureur, l’image de l’œil sans pitié et l’absence de compassion dans le discours direct
  alternative: Paraphraser par une formule judiciaire plus abstraite, telle que « je les punirai sévèrement »
  rationale: Le texte hébreu présente le jugement en termes personnels et saisissants. La traduction ne doit ni en atténuer la dureté ni remplacer ses images par une abstraction.
- issue: Rapport concessif dans la dernière proposition
  choice: « Même s’ils crient… je ne les écouterai pas »
  alternative: « Ils crieront… mais je ne les écouterai pas »
  rationale: La conjonction hébraïque est simple, mais le contraste implique une concession. « Même si » la rend clairement sans modifier le sens théologique du refus divin.
translation_notes:
  register: Français international moderne, direct et solennel. La syntaxe demeure accessible, les images hébraïques essentielles sont conservées, et aucun vocabulaire confessionnel particulier n’est introduit.
