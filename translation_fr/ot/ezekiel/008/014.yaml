  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: fr
  text: 'Puis il me conduisit à l’entrée de la porte nord de la maison de Yahweh. Et voici : là, les femmes étaient assises et pleuraient[a] Tammouz[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se lamentaient ». Le verbe hébreu signifie littéralement « pleurer ».
    reason: lexical_alternative
  - marker: b
    text: Tammouz était une divinité mésopotamienne associée à des rites saisonniers de lamentation ; les femmes sont représentées en train de participer à ces lamentations.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Puis il me conduisit
  rationale: Le hifil de בוא exprime ici le fait de faire venir ou d’amener quelqu’un. « Conduisit » est naturel dans le récit d’une vision, tandis que « Puis » rend la progression narrative du waw.
- source_word: פֶּתַח שַׁעַר
  choice: l’entrée de la porte
  rationale: 'Cette formulation conserve les deux éléments architecturaux distincts du texte hébreu : פֶּתַח, l’entrée ou l’ouverture, et שַׁעַר, la porte monumentale.'
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » reproduit le terme hébreu sans expliciter par « temple » ce que le contexte permet déjà de comprendre; le nom divin est translittéré.
- source_word: אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: qui donne au nord
  rationale: La phrase indique l’orientation ou la situation septentrionale de la porte. « Donne au nord » reste naturelle en français sans trancher plus précisément entre orientation et emplacement.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: La formule attire vivement l’attention sur ce que le prophète aperçoit et conserve le ton visionnaire du passage.
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: des femmes étaient assises
  rationale: Le participe décrit une scène en cours. En français, l’article hébreu peut naturellement être rendu par l’indéfini lors de la présentation d’un groupe visible qui n’a pas encore été identifié.
- source_word: מְבַכּוֹת
  choice: pleuraient sur
  rationale: Le verbe signifie littéralement « pleurer »; avec Tammouz comme objet, « pleurer sur » exprime en français une lamentation dirigée vers lui sans ajouter explicitement la notion de mort.
- source_word: אֶת הַתַּמּוּז
  choice: Tammouz
  rationale: Le nom propre est translittéré selon sa forme française courante. La marque hébraïque de l’objet direct n’est pas traduite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom plutôt que de lui substituer un titre.
- issue: Identification de תַּמּוּז
  choice: Tammouz
  alternative: le dieu Tammouz
  rationale: L’hébreu donne le nom propre sans substantif explicatif. L’identité cultuelle de Tammouz est donc précisée en note plutôt qu’ajoutée au corps du texte.
- issue: Nature des pleurs des femmes
  choice: pleuraient sur Tammouz
  alternative: se lamentaient sur Tammouz
  rationale: Le rendu retenu maintient le sens concret du verbe « pleurer » tout en laissant la note expliquer le contexte rituel, sans réduire la scène à une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la vivacité de la vision et les principaux traits architecturaux du texte hébreu, tout en évitant d’expliquer le rite dans le corps du verset.
