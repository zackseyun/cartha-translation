    rationale: Dans « la porte de la maison de Yahweh qui donne au nord », la relative peut qualifier « maison », alors que l’hébreu identifie la porte comme étant du côté nord / orientée au nord.
  - severity: low
    issue: Article indéfini « des femmes »
    rationale: L’hébreu porte l’article défini. « Les femmes » le reproduit naturellement dans la présentation visuelle de la scène.
  - severity: low
    issue: Tournure « pleuraient sur Tammouz »
    rationale: Elle est compréhensible, mais « pleuraient Tammouz » est plus direct et plus idiomatique dans le registre biblique, tout en préservant l’objet direct hébreu et sans expliciter la cause des lamentations.
