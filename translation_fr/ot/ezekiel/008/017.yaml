  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ הֲ/נָקֵל֙ לְ/בֵ֣ית יְהוּדָ֔ה מֵ/עֲשׂ֕וֹת אֶת הַ/תּוֹעֵב֖וֹת אֲשֶׁ֣ר עָֽשׂוּ פֹ֑ה כִּֽי מָלְא֨וּ אֶת הָ/אָ֜רֶץ חָמָ֗ס וַ/יָּשֻׁ֨בוּ֙ לְ/הַכְעִיסֵ֔/נִי וְ/הִנָּ֛/ם שֹׁלְחִ֥ים אֶת הַ/זְּמוֹרָ֖ה אֶל אַפָּֽ/ם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: fr
  text: 'Puis il me dit : « As-tu vu, fils d’homme ? Est-ce donc si peu de chose, pour la maison de Juda, que de commettre les abominations qu’ils ont commises ici, de remplir le pays de violence et de recommencer à m’irriter ? Et voici qu’ils tendent le rameau vers leur nez[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens de ce geste est obscur ; il pourrait s’agir d’un geste rituel idolâtre. Certains témoins anciens portent : « vers mon nez » ; le texte hébreu massorétique porte : « vers leur nez ».'
    reason: Variante textuelle et note culturelle sur une expression obscure.
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: As-tu vu
  rationale: Le parfait qal avec l’interrogatif renvoie à ce que le prophète vient de voir dans la vision et conserve la force de la question rhétorique.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette traduction maintient l’adresse prophétique caractéristique et répétée du livre d’Ézéchiel.
- source_word: הֲנָקֵל
  choice: Est-ce trop peu de chose
  rationale: Cette tournure française naturelle exprime l’idée de légèreté ou d’insignifiance et la progression rhétorique du passage.
- source_word: לְבֵית יְהוּדָה
  choice: pour la maison de Juda
  rationale: La formulation collective et traditionnelle de l’hébreu est conservée sans la réduire simplement à « Juda ».
- source_word: הַתּוֹעֵבוֹת
  choice: les abominations
  rationale: Le terme rend la forte réprobation morale et cultuelle attachée à תּוֹעֵבוֹת dans ce contexte.
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: remplissent le pays de violence
  rationale: חָמָס désigne ici la violence et l’injustice brutale; « violence » en donne le sens principal dans un français direct.
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: recommencent à m’irriter
  rationale: וַיָּשֻׁבוּ marque la répétition de leur conduite, tandis que « m’irriter » exprime sans lourdeur le fait de provoquer la colère divine.
- source_word: וְהִנָּם
  choice: Et les voilà
  rationale: Cette tournure actuelle et vive attire l’attention sur la scène, comme l’hébreu, sans recourir à l’archaïsme « voici » isolé.
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: portent le rameau
  rationale: Le geste reste obscur. « Portent » exprime le mouvement vers le nez sans imposer une interprétation rituelle précise; « rameau » convient à זְמוֹרָה, qui peut désigner une branche ou une pousse de vigne.
- source_word: אֶל אַפָּם
  choice: à leur nez
  rationale: Le texte massorétique porte le suffixe de troisième personne du pluriel, « leur ». La difficulté textuelle et interprétative est signalée en note.
theological_decisions:
- issue: Sens du geste final et personne du suffixe dans אֶל אַפָּם
  choice: 'Traduire le texte massorétique de manière transparente : « ils portent le rameau à leur nez »'
  alternative: « ils portent le rameau à mon nez »; ou expliciter le geste comme un rite idolâtre
  rationale: La formulation hébraïque est obscure. Le texte principal conserve la lecture massorétique sans identifier avec certitude le rite; la variante ancienne « mon nez » et l’hypothèse cultuelle sont mentionnées en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible. La question rhétorique est répartie en deux phrases pour rendre clairement la progression de l’hébreu. Le pluriel « ils » reprend collectivement « la maison de Juda ». Le geste final est rendu sans interprétation confessionnelle ni précision rituelle conjecturale.
