  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: fr
  text: La sixième année[a], le sixième mois, le cinquième jour du mois, alors que j’étais assis dans ma maison et que les anciens de Juda étaient assis devant moi, c’est là[b] que la main du Seigneur Yahweh[c] tomba sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset ne précise pas explicitement à partir de quel événement cette année est comptée ; le contexte du livre permet de la comprendre comme la sixième année de l’exil du roi Yoyakîn.
    reason: contextual_clarification
  - marker: b
    text: L’hébreu dit littéralement « là » ; certaines traductions comprennent l’adverbe au sens temporel d’« alors ».
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : Adonaï YHWH, combinaison du titre « Seigneur » et du nom divin Yahweh. On traduit aussi traditionnellement « le Seigneur DIEU ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: La sixième année…
  rationale: La formule narrative introduit la scène et sa date. En français, commencer directement par la date évite le calque lourd « Et il arriva que » tout en conservant la fonction discursive de l’hébreu.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: La sixième année
  rationale: L’époque à partir de laquelle l’année est comptée n’est pas précisée dans ce verset; aucune explicitation n’est donc ajoutée au texte.
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: le sixième mois, le cinquième jour du mois
  rationale: Cette formulation française rend intégralement et clairement la date hébraïque.
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: j’étais assis dans ma maison
  rationale: Le participe décrit une situation en cours servant d’arrière-plan à l’action principale; l’imparfait français convient naturellement.
- source_word: וְזִקְנֵי יְהוּדָה
  choice: les anciens de Juda
  rationale: « Anciens » désigne ici les responsables reconnus du peuple et conserve le terme institutionnel traditionnel sans le surinterpréter.
- source_word: יוֹשְׁבִים לְפָנָי
  choice: étaient assis devant moi
  rationale: Le participe indique une action simultanée en cours. « Devant moi » peut exprimer à la fois la position physique et la situation d’audience.
- source_word: וַתִּפֹּל עָלַי
  choice: tomba sur moi
  rationale: Le choix conserve l’image forte de נפל avec עַל, plutôt que de la réduire à « vint sur moi ».
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe est normalement locatif. « Là » préserve cette valeur au lieu de l’interpréter comme le temporel « alors ».
- source_word: יַד
  choice: la main
  rationale: L’image corporelle appartient à une expression prophétique caractéristique de l’action ou de la puissance divine; elle n’est pas remplacée par son interprétation.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom divin יהוה et évite le redoublement artificiel « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans l’expression אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom propre divin. « Seigneur Yahweh » rend les deux éléments explicitement sans substituer un second titre au nom.
- issue: Sens de « la main » divine
  choice: conserver l’image sans l’expliciter
  alternative: la puissance du Seigneur Yahweh s’empara de moi
  rationale: L’expression peut évoquer la puissance, l’emprise ou l’impulsion prophétique de Dieu. Traduire simplement « la main » préserve cette richesse et ne tranche pas entre ces nuances.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est légèrement restructurée pour éviter l’archaïsme « il arriva que », tandis que les images hébraïques « la main » et « tomba sur moi » sont conservées. Les trois marqueurs [a], [b] et [c] figurent au point pertinent du texte.
