  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֹּ֤א וּ/רְאֵה֙ אֶת הַ/תּוֹעֵב֣וֹת הָ/רָע֔וֹת אֲשֶׁ֛ר הֵ֥ם עֹשִׂ֖ים פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/009.yaml
  text: And he said to me, “Come and see the evil abominations that they are doing here.”
translation:
  language: fr
  text: 'Il me dit : « Entre, et regarde les abominations mauvaises qu’ils commettent ici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא
  choice: Entre
  rationale: Dans ce contexte où Ézéchiel est invité à franchir l’ouverture pratiquée dans le mur (v. 8), l’impératif signifie naturellement « entre » plutôt que le plus général « viens ».
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: les abominations mauvaises
  rationale: Cette formulation conserve à la fois le terme fort « abominations » et l’adjectif הָרָעוֹת (« mauvaises »), sans atténuer leur redondance expressive.
- source_word: עֹשִׂים
  choice: commettent
  rationale: En français courant, on « commet » des abominations ; ce choix rend naturellement le verbe « faire » dans cette construction tout en gardant sa portée morale.
- source_word: פֹּה
  choice: ici
  rationale: Équivalent direct de l’adverbe locatif, qui souligne que ces actes ont lieu dans l’espace montré au prophète.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le masculin pluriel « ils » maintient la référence collective non explicitée dans ce verset. La répétition sémantique de « mauvaises » après « abominations » est volontairement conservée parce qu’elle appartient au texte hébreu.
