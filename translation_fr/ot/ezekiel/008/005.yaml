  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם שָׂא נָ֥א עֵינֶ֖י/ךָ דֶּ֣רֶךְ צָפ֑וֹנָ/ה וָ/אֶשָּׂ֤א עֵינַ/י֙ דֶּ֣רֶךְ צָפ֔וֹנָ/ה וְ/הִנֵּ֤ה מִ/צָּפוֹן֙ לְ/שַׁ֣עַר הַ/מִּזְבֵּ֔חַ סֵ֛מֶל הַ/קִּנְאָ֥ה הַ/זֶּ֖ה בַּ/בִּאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, lève les yeux, je te prie, vers le nord. » Je levai donc les yeux vers le nord, et voici qu’au nord de la porte de l’autel, à l’entrée, se trouvait cette image de jalousie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette idole de jalousie », ou « cette image qui provoque la jalousie ». L’expression hébraïque est concise et peut désigner soit le caractère de l’image, soit son effet, qui est de provoquer la jalousie divine.
    reason: Alternative lexicale et préservation de l’ambiguïté de la construction hébraïque.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette expression conserve la formule hébraïque par laquelle Ézéchiel est habituellement interpellé, ainsi que sa résonance littéraire, sans la réduire à une simple paraphrase.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: lève les yeux, je te prie
  rationale: « Lève les yeux » restitue l’image concrète de l’idiome hébreu, tandis que « je te prie » rend la nuance polie ou incitative de נָא.
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: vers le nord
  rationale: Formulation naturelle en français moderne qui exprime exactement la direction indiquée par l’hébreu.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure garde la force déictique et la vivacité de la scène visionnaire tout en restant idiomatique en français.
- source_word: מִצָּפוֹן
  choice: au nord de
  rationale: Dans ce contexte, la préposition situe l’image par rapport à la porte plutôt qu’elle ne décrit un mouvement venant du nord.
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: de la porte de l’autel
  rationale: Le rendu conserve le rapport nominal de l’hébreu sans préciser abusivement la configuration architecturale exacte.
- source_word: סֵמֶל
  choice: image
  rationale: « Image » rend le terme de manière assez large pour inclure une représentation cultuelle sans ajouter explicitement la qualification d’« idole », fournie par le contexte.
- source_word: הַקִּנְאָה
  choice: de jalousie
  rationale: Le complément nominal préserve la formulation compacte et ambiguë de l’hébreu, qui peut caractériser l’image ou évoquer son effet provocateur.
- source_word: בַּבִּאָה
  choice: à l’entrée
  rationale: Expression française naturelle qui respecte l’indication spatiale sans déterminer de façon excessive à quel élément architectural l’entrée appartient.
theological_decisions:
- issue: Degré d’explicitation de סֵמֶל הַקִּנְאָה
  choice: cette image de jalousie
  alternative: cette idole de jalousie ; cette image qui provoque la jalousie
  rationale: Le contexte est idolâtre et implique la jalousie divine, mais l’hébreu présente une expression nominale concise plutôt qu’une proposition verbale explicite. Le texte principal en conserve donc la tension, et la note signale les interprétations possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Et voici que » maintient la vivacité prophétique ; l’ordre des compléments spatiaux reste proche de l’hébreu tout en étant naturel en français.
