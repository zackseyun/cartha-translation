id: EZK.8.16
reference: Ezekiel 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: fr
  text: Puis il me fit entrer dans la cour intérieure de la maison de Yahweh. Et voici qu’à l’entrée du temple de Yahweh, entre le vestibule et l’autel, se tenaient environ vingt-cinq hommes. Ils avaient le dos tourné vers le temple de Yahweh et le visage vers l’est ; ils se prosternaient[a] vers l’est, devant le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu désigne le fait de se prosterner en signe d’adoration ; on pourrait donc aussi traduire : « ils adoraient le soleil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Puis il me fit entrer
  rationale: Le hiphil de בוא exprime ici l’action de faire entrer, et le wayyiqtol poursuit la séquence narrative ; « Puis » rend naturellement cette progression.
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: la cour intérieure de la maison de Yahweh
  rationale: חָצֵר désigne une cour, tandis que בֵּית יְהוָה signifie littéralement « maison de Yahweh ». La formulation conserve l’image hébraïque sans devenir obscure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure introduit avec vivacité ce qu’Ézéchiel découvre dans la vision.
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: à l’entrée du temple de Yahweh
  rationale: פֶּתַח désigne l’entrée ou l’ouverture ; הֵיכָל désigne ici le sanctuaire, rendu naturellement par « temple ».
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: entre le vestibule et l’autel
  rationale: אוּלָם désigne le porche ou vestibule placé devant le sanctuaire. « Vestibule » est précis et naturel dans ce contexte architectural.
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: environ vingt-cinq hommes
  rationale: Le préfixe כ marque l’approximation ; « environ » en conserve explicitement la valeur.
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה
  choice: Ils tournaient le dos au temple de Yahweh
  rationale: La formulation française exprime clairement leur orientation délibérée, le dos dirigé vers le sanctuaire.
- source_word: וּפְנֵיהֶם קֵדְמָה
  choice: et regardaient vers l’est
  rationale: Littéralement, le texte dit que leurs visages étaient vers l’est. « Regardaient vers l’est » rend cette posture de manière naturelle tout en maintenant le contraste avec leur dos tourné au temple.
- source_word: מִשְׁתַּחֲוִיתֶם
  choice: ils se prosternaient
  rationale: Le verbe désigne l’action physique de se courber ou de se prosterner, souvent comme geste d’adoration. Le choix conserve l’image concrète sans remplacer le geste par son interprétation.
- source_word: קֵדְמָה לַשָּׁמֶשׁ
  choice: vers l’est, devant le soleil
  rationale: La traduction maintient à la fois la direction orientale et le soleil comme destinataire de la prosternation. « Devant le soleil » est idiomatique en français et évite la tournure équivoque « au soleil ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. Sa translittération le distingue d’un titre et suit directement la donnée hébraïque.
- issue: Portée cultuelle de מִשְׁתַּחֲוִיתֶם
  choice: ils se prosternaient… devant le soleil
  alternative: ils adoraient le soleil
  rationale: Le contexte implique une adoration idolâtre, mais le verbe décrit concrètement une prosternation. Le texte principal préserve ce geste, tandis que la note signale sa pleine portée cultuelle.
translation_notes:
  register: 'Français international moderne, digne et accessible. La structure visuelle du passage est conservée : le temple derrière les hommes, l’est et le soleil devant eux. « Maison de Yahweh » maintient l’expression hébraïque, tandis que « temple de Yahweh » rend הֵיכָל selon son sens contextuel.'
