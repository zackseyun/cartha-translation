  naturalness: Le français est moderne, clair et d’un registre approprié. « Avaient le dos tourné vers » et « le visage vers l’est » sont à la fois plus proches de l’hébreu et très naturels. La ponctuation en deux phrases conserve bien la scène visionnaire.
  terminology: « Cour intérieure », « maison de Yahweh », « temple de Yahweh », « vestibule », « autel » et « se prosternaient » sont appropriés. Le nom Yahweh est rendu de façon cohérente. La note explique justement la portée cultuelle possible de la prosternation sans l’imposer dans le texte principal.
