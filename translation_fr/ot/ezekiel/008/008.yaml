id: EZK.8.8
reference: Ezekiel 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֖ם חֲתָר נָ֣א בַ/קִּ֑יר וָ/אֶחְתֹּ֣ר בַּ/קִּ֔יר וְ/הִנֵּ֖ה פֶּ֥תַח אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, creuse[a] donc dans le mur. » Je creusai dans le mur, et voici qu’il y avait une ouverture.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « perce le mur ». Le verbe hébreu peut signifier creuser à travers ou percer un mur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule littérale conserve l’appellation récurrente adressée à Ézéchiel, sans en faire ici un titre messianique.
- source_word: חֲתָר
  choice: creuse
  rationale: Le verbe désigne l’action de creuser ou de percer, notamment un mur. « Creuser dans le mur » rend naturellement l’action tout en laissant ouverte la nuance de percée.
- source_word: נָא
  choice: donc
  rationale: La particule donne à l’impératif une nuance d’exhortation ou d’insistance polie. Dans ce contexte, « donc » est plus idiomatique que « s’il te plaît » dans un ordre divin.
- source_word: קִּיר
  choice: mur
  rationale: Équivalent direct et naturel dans ce contexte architectural.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette formulation préserve l’effet de découverte soudaine du marqueur hébreu.
- source_word: פֶּתַח אֶחָד
  choice: une ouverture
  rationale: En français, l’article indéfini exprime naturellement ici l’existence d’une ouverture; traduire אֶחָד par « une seule » lui donnerait une valeur restrictive que le contexte n’impose pas.
theological_decisions:
- issue: Sens de אָדָם dans l’appellation בֶּן אָדָם
  choice: Fils d’homme
  alternative: être humain
  rationale: La formule masculine singulière est l’appellation caractéristique d’Ézéchiel. La conserver respecte le motif littéraire du livre sans importer une lecture christologique dans ce verset.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au registre biblique littéraire sans être archaïque. La répétition de « dans le mur » reproduit celle de l’hébreu.
