reference: Ecclesiastes 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת יְמֵ֣י חַיָּ֑י/ו כִּ֧י הָ/אֱלֹהִ֛ים מַעֲנֶ֖ה בְּ/שִׂמְחַ֥ת לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: fr
  text: Car il ne se souviendra guère des jours de sa vie[a], puisque Dieu le tient occupé par la joie de son cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne pensera guère aux jours de sa vie ». Le verbe hébreu signifie littéralement « se souvenir », mais peut ici évoquer le fait de s’attarder en pensée sur sa vie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « Dieu lui répond par la joie de son cœur ». Le verbe hébreu peut signifier « répondre », mais, dans ce contexte, il est souvent compris au sens de tenir quelqu’un occupé ou absorbé.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première conjonction introduit l’explication de l’affirmation précédente ; « Car » convient au début du verset et conserve ce lien discursif.
- source_word: לֹא הַרְבֵּה
  choice: ne… guère
  rationale: Cette tournure française exprime naturellement le faible degré ou la faible fréquence indiqués par l’hébreu, sans alourdir la phrase.
- source_word: יִזְכֹּר
  choice: se souviendra
  rationale: Le choix garde le sens lexical premier de זכר, « se souvenir », même si le contexte permet aussi l’idée de penser longuement à quelque chose.
- source_word: אֶת יְמֵי חַיָּיו
  choice: des jours de sa vie
  rationale: Cette formulation proche de l’hébreu préserve l’image et le style de Qohélet.
- source_word: כִּי
  choice: puisque
  rationale: La seconde conjonction introduit la cause de ce qui précède ; « puisque » rend clairement ce rapport en français courant.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne directement Dieu dans ce contexte.
- source_word: מַעֲנֶה
  choice: le tient occupé
  rationale: Dans ce contexte positif, la forme verbale indique vraisemblablement que Dieu absorbe ou retient l’attention de la personne. Cette traduction est naturelle tout en laissant la lecture plus littérale en note.
- source_word: בְּשִׂמְחַת לִבּוֹ
  choice: par la joie de son cœur
  rationale: La préposition peut indiquer le moyen ; cette formulation conserve l’image hébraïque du cœur et s’accorde avec « le tient occupé ».
theological_decisions:
- issue: Sens de l’action divine exprimée par מַעֲנֶה
  choice: Dieu tient la personne occupée par la joie
  alternative: Dieu lui répond par la joie de son cœur
  rationale: Le contexte immédiat présente la capacité de jouir de la vie comme un don positif de Dieu. Le sens « tenir occupé » s’intègre donc bien à l’enchaînement, tandis que la valeur plus littérale « répondre » reste possible et est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de l’image hébraïque tout en employant une syntaxe naturelle ; les deux principales ambiguïtés lexicales sont conservées dans les notes.
