  text: מְתוּקָה֙ שְׁנַ֣ת הָ/עֹבֵ֔ד אִם מְעַ֥ט וְ/אִם הַרְבֵּ֖ה יֹאכֵ֑ל וְ/הַ/שָּׂבָע֙ לֶֽ/עָשִׁ֔יר אֵינֶ֛/נּוּ מַנִּ֥יחַֽ ל֖/וֹ לִ/ישֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
translation:
  language: fr
  text: Le sommeil de celui qui travaille est doux, qu’il mange peu ou beaucoup ; mais la satiété du riche[a] ne le laisse pas dormir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’abondance du riche ». Le terme hébreu peut désigner le rassasiement, l’état de plénitude ou l’abondance.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: doux
  rationale: Conserve l’image concrète de la douceur, employée métaphoriquement pour qualifier le sommeil.
- source_word: שְׁנַת הָעֹבֵד
  choice: le sommeil de celui qui travaille
  rationale: Rend l’état construit et le participe de עבד dans un français moderne et naturel, sans restreindre le sens à un métier particulier.
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: qu’il mange peu ou beaucoup
  rationale: Restitue de façon idiomatique la construction corrélative hébraïque et l’idée que son sommeil reste doux quelle que soit la quantité mangée.
- source_word: וְהַשָּׂבָע
  choice: mais la satiété
  rationale: Le nom désigne d’abord l’état d’être rassasié ou repu. « Satiété » préserve ce sens concret et l’ambiguïté contextuelle avec l’abondance matérielle.
- source_word: לֶעָשִׁיר
  choice: du riche
  rationale: Le lamed exprime ici naturellement la relation au riche ; la formulation française est concise et maintient le singulier.
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: ne le laisse pas dormir
  rationale: Rend clairement et naturellement la construction causative indiquant que quelque chose empêche le riche de dormir.
theological_decisions: []
