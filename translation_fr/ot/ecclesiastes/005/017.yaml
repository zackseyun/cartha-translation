source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: fr
  text: 'Voici ce que j’ai moi-même constaté : il est bon et convenable de manger, de boire et de jouir du bien[a] au milieu de tout le travail auquel on se livre sous le soleil, pendant les jours de sa vie que Dieu lui a donnés, car telle est sa part.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de voir le bien »; on peut aussi comprendre : « de faire l’expérience du bien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec naturel en français une observation mise en relief, sans l’archaïsme de « Voici donc » ou « Voyez ».
- source_word: רָאִיתִי אָנִי
  choice: ce que j’ai moi-même constaté
  rationale: « Moi-même » rend l’emphase du pronom explicite; « constaté » exprime ici l’observation réfléchie plutôt qu’une simple perception visuelle.
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: il est bon et convenable
  rationale: Rend les deux qualifications, la bonté et le caractère approprié, dans un français courant et digne.
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: de manger, de boire
  rationale: Traduction directe des infinitifs, conforme au motif récurrent de l’Ecclésiaste.
- source_word: וְלִרְאוֹת טוֹבָה
  choice: de jouir du bien
  rationale: L’expression littérale « voir le bien » signifie ici en faire l’expérience ou en jouir; la formulation idiomatique évite en français l’impression d’une simple observation visuelle, tandis que la note conserve la forme hébraïque.
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: au milieu de tout le travail auquel on se livre
  rationale: Conserve la reprise nominale et verbale de la racine עמל autant que le permet un français naturel; « au milieu de » garde la relation exprimée par בְּ sans la réduire nécessairement à une provenance.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: sous le soleil
  rationale: Maintient littéralement le refrain caractéristique de l’Ecclésiaste.
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: pendant les jours de la vie
  rationale: Le français n’emploie pas naturellement « le nombre des jours » dans cette construction; la durée bornée demeure implicite sans ajouter l’idée absente de « peu de jours ».
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: que Dieu nous donne
  rationale: Le présent rend la perspective générale de la maxime. Le « nous » inclusif transpose naturellement la portée représentative du singulier hébreu dans ce contexte sapientiel.
- source_word: כִּי הוּא חֶלְקוֹ
  choice: car telle est la part de chacun
  rationale: « Part » exprime le lot accordé à une personne; « de chacun » explicite en français la portée générale du suffixe masculin singulier sans restreindre le propos aux hommes.
theological_decisions:
- issue: Portée du masculin singulier dans une maxime sapientielle
  choice: Formulation générique avec « on », « nous » et « chacun »
  alternative: « le travail auquel il se livre… que Dieu lui donne… car telle est sa part »
  rationale: Les formes masculines singulières ont ici une portée humaine représentative. Une formulation générique naturelle en français moderne transmet cette portée sans introduire un sujet masculin lexical absent du texte.
- issue: Sens de וְלִרְאוֹת טוֹבָה
  choice: « jouir du bien » avec note littérale
  alternative: « voir le bien »
  rationale: L’idiome désigne l’expérience favorable ou la jouissance du bien. La traduction courante communique le sens en français, tandis que la note préserve l’image et l’ambiguïté lexicale de l’hébreu.
- issue: Nature de la « part » humaine
  choice: « telle est la part de chacun »
  alternative: « tel est son lot »
  rationale: « Part » conserve l’idée d’une portion accordée sans imposer une conception fataliste que « lot » pourrait suggérer.
translation_notes:
  register: Français international moderne, accessible et digne. La syntaxe a été allégée pour éviter un calque lourd, tout en conservant l’emphase personnelle du Qohélet, le refrain « sous le soleil » et l’idée de la part accordée par Dieu.
