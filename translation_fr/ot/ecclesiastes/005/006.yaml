  text: כִּ֣י בְ/רֹ֤ב חֲלֹמוֹת֙ וַ/הֲבָלִ֔ים וּ/דְבָרִ֖ים הַרְבֵּ֑ה כִּ֥י אֶת הָ/אֱלֹהִ֖ים יְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
translation:
  language: fr
  text: Car, parmi tant de rêves, de réalités éphémères et de paroles, crains Dieu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Car, lorsque les rêves, les réalités éphémères et les paroles abondent, crains Dieu. » L’hébreu est elliptique, et le second « car » peut avoir une valeur contrastive ou introduire une conclusion.'
    reason: alternative_reading
  - marker: b
    text: « Réalités éphémères » traduit le pluriel de hévèl, terme récurrent de l’Ecclésiaste qui évoque ce qui est fugitif, inconsistant ou vain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי rattache cette maxime à l’avertissement précédent en en donnant le motif.
- source_word: בְרֹב חֲלֹמוֹת
  choice: dans l’abondance des rêves
  rationale: Cette formulation conserve la préposition et l’idée de profusion exprimée par רֹב, tout en restant naturelle en français.
- source_word: וַהֲבָלִים
  choice: des réalités éphémères
  rationale: Le pluriel de הֶבֶל évoque ce qui est fugitif, inconsistant ou vain. « Réalités éphémères » préserve ici cette gamme d’images sans imposer la conclusion philosophique de « choses absurdes ».
- source_word: וּדְבָרִים הַרְבֵּה
  choice: et des paroles
  rationale: דְּבָרִים désigne ici les paroles, tandis que l’idée d’abondance est portée par la construction elliptique de l’ensemble; éviter de répéter « nombreuses » allège la phrase française.
- source_word: כִּי
  choice: lui
  rationale: Le second כִּי est syntaxiquement difficile. La dislocation « Dieu, lui » rend la valeur contrastive probable sans transformer explicitement la particule en une conjonction univoque.
- source_word: אֶת הָאֱלֹהִים יְרָא
  choice: Dieu, lui, crains-le
  rationale: L’antéposition de « Dieu » dans l’hébreu lui donne du relief. La dislocation française conserve cette emphase et « crains » maintient le terme théologique fort de la tradition sapientielle.
theological_decisions:
- issue: Sens de ירא dans le contexte sapientiel
  choice: crains-le
  alternative: révère-le
  rationale: « Craindre Dieu » exprime de façon compacte la crainte révérencielle, la soumission et le respect; « révérer » atténuerait la force du terme source.
- issue: Fonction du second כִּי
  choice: contraste exprimé par « Dieu, lui »
  alternative: « mais crains Dieu » ou « car crains Dieu »
  rationale: L’hébreu est elliptique et la particule peut être comprise comme contrastive ou inférentielle. La tournure retenue met en relief l’exhortation sans trancher entièrement entre ces fonctions.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la densité et l’emphase de l’hébreu tout en signalant en notes son caractère elliptique et ses principales ambiguïtés.
