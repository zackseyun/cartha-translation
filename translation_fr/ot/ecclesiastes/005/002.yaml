  text: For a dream comes with much preoccupation[a], and a fool’s voice with many words.
translation:
  language: fr
  text: Car le rêve vient avec beaucoup de préoccupations[a], et la voix de l’insensé avec beaucoup de paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car le rêve vient de beaucoup d’occupations, et la voix de l’insensé de beaucoup de paroles ».'
