lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’avertissement précédent et conserve le lien logique sous une forme française concise.
- source_word: בָּא
  choice: vient
  rationale: Le parfait qal a ici une valeur proverbiale ou générale; le présent français rend naturellement cette portée.
- source_word: הַחֲלוֹם
  choice: le rêve
  rationale: L’article hébreu peut avoir une valeur générique. En français, le singulier défini convient naturellement à une observation générale.
- source_word: בְּרֹב עִנְיָן
  choice: avec beaucoup de préoccupations
  rationale: עִנְיָן désigne une occupation, une affaire ou ce qui mobilise l’esprit. « Préoccupations » conserve ici l’idée de forte activité mentale sans la réduire à la seule anxiété.
- source_word: וְקוֹל כְּסִיל
  choice: et la voix de l’insensé
  rationale: Reproduit l’image hébraïque de la voix et emploie le terme traditionnel de la littérature sapientielle pour la personne moralement et intellectuellement dépourvue de sagesse.
- source_word: בְּרֹב דְּבָרִים
  choice: avec beaucoup de paroles
  rationale: Préserve le parallélisme avec le premier membre et l’association entre l’abondance des paroles et la voix de l’insensé.
