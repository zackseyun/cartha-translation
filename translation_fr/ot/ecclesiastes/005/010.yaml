source:
  edition: WLC
  text: בִּ/רְבוֹת֙ הַ/טּוֹבָ֔ה רַבּ֖וּ אוֹכְלֶ֑י/הָ וּ/מַה כִּשְׁרוֹן֙ לִ/בְעָלֶ֔י/הָ כִּ֖י אִם ראית עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: fr
  text: Quand les biens[a] se multiplient, ceux qui les consomment se multiplient aussi. Quel avantage leurs propriétaires en retirent-ils, sinon le fait de les voir de leurs propres yeux[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bonnes choses », « la prospérité » ou « la richesse ». Le terme hébreu peut désigner ce qui est matériellement bon ou, plus largement, la prospérité ; le contexte immédiat favorise ici des possessions susceptibles d’être consommées et possédées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sinon la vue de ses yeux ». L’expression hébraïque suggère que le seul bénéfice du propriétaire peut se réduire au fait de contempler ce qu’il possède.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Quand … se multiplient
  rationale: La préposition בְּ avec l’infinitif construit de רבה a ici une valeur temporelle. « Quand … se multiplient » est naturel en français et prépare la reprise du même verbe dans la proposition suivante.
- source_word: הַטּוֹבָה
  choice: les biens
  rationale: Le terme טוֹבָה peut désigner ce qui est bon, la prospérité ou des biens. Le contexte économique, avec des consommateurs et des propriétaires, favorise ici le sens concret de possessions.
- source_word: רַבּוּ
  choice: se multiplient aussi
  rationale: 'La répétition de רבה établit un parallélisme : les biens se multiplient, et leurs consommateurs également. « Aussi » rend explicite ce rapport sans en modifier le sens.'
- source_word: אֹכְלֶיהָ
  choice: ceux qui les consomment
  rationale: Le mot signifie littéralement « ceux qui les mangent ». Dans ce contexte plus large de biens et de richesse, « consomment » peut englober ceux qui en vivent ou les épuisent, tout en conservant l’image de la consommation.
- source_word: וּמַה כִּשְׁרוֹן
  choice: Quel avantage … en retirent-ils
  rationale: כִּשְׁרוֹן désigne un avantage, un profit ou un gain. Cette formulation française exprime naturellement la question rhétorique et son idée de bénéfice.
- source_word: לִבְעָלֶיהָ
  choice: leurs propriétaires
  rationale: Le nom בַּעַל désigne ici le propriétaire ou possesseur. Le pluriel hébreu est conservé, et le pronom renvoie aux « biens » rendus au pluriel en français.
- source_word: כִּי אִם
  choice: sinon
  rationale: Après une question rhétorique, כִּי אִם introduit la seule exception ou le seul bénéfice restant. « Sinon » est concis et idiomatique.
- source_word: רְאִית עֵינָיו
  choice: de les regarder de leurs yeux
  rationale: L’expression signifie littéralement « la vue de ses yeux ». La formulation retenue conserve la mention insistante des yeux et suggère que le propriétaire ne retire de ses biens que le fait de les contempler, tout en accordant le possessif au pluriel collectif français.
