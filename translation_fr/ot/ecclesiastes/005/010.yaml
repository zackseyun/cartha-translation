translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « se multiplient » conserve le parallélisme hébreu. Le pluriel français dans « leurs propriétaires » et « leurs yeux » représente le collectif tout en évitant une alternance artificielle entre pluriel et singulier.
