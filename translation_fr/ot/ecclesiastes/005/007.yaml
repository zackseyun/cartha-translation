source:
  edition: WLC
  text: אִם עֹ֣שֶׁק רָ֠שׁ וְ/גֵ֨זֶל מִשְׁפָּ֤ט וָ/צֶ֨דֶק֙ תִּרְאֶ֣ה בַ/מְּדִינָ֔ה אַל תִּתְמַ֖הּ עַל הַ/חֵ֑פֶץ כִּ֣י גָבֹ֜הַּ מֵ/עַ֤ל גָּבֹ֨הַ֙ שֹׁמֵ֔ר וּ/גְבֹהִ֖ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: fr
  text: 'Si tu vois, dans la province, l’oppression du pauvre[a] et la spoliation de la justice et de l’équité[b], ne t’étonne pas de cette situation : un haut placé est surveillé par quelqu’un de plus haut placé, et d’autres, plus hauts encore, sont au-dessus d’eux[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’extorsion du pauvre ». Le terme hébreu peut désigner aussi bien l’oppression en général qu’une exploitation accompagnée de saisie abusive.
    reason: lexical_alternative
  - marker: b
    text: Ou « le vol de la justice et de l’équité ». Le terme hébreu évoque une saisie ou une dépossession abusive.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « car un haut placé au-dessus d’un haut placé surveille, et des plus hauts sont au-dessus d’eux ». Ces mots peuvent évoquer les échelons successifs des autorités humaines, mais aussi laisser entendre une surveillance divine ultime.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק
  choice: oppression
  rationale: Le nom désigne une exploitation oppressive, pouvant aller jusqu’à l’extorsion. « Oppression » convient au contexte général d’injustice sociale tout en restant naturel en français.
- source_word: רָשׁ
  choice: le pauvre
  rationale: Employé comme substantif, le terme désigne la personne pauvre ou démunie. Le singulier collectif français correspond au singulier hébreu.
- source_word: גֵזֶל
  choice: déni
  rationale: Le mot évoque normalement le vol ou la spoliation. Appliqué à la justice et à l’équité, « déni » exprime naturellement en français le fait de les soustraire aux personnes, tandis qu’une note conserve l’image plus concrète de la spoliation.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Dans ce contexte administratif et judiciaire, le terme renvoie à l’exercice juste du droit plutôt qu’à une simple décision judiciaire.
- source_word: צֶדֶק
  choice: équité
  rationale: Associé à מִשְׁפָּט, le terme ajoute l’idée de rectitude et de traitement juste. « Équité » rend cette dimension morale dans une formulation française courante.
- source_word: מְדִינָה
  choice: province
  rationale: Le terme désigne ici une circonscription administrative ou un territoire gouverné. « Province » convient à l’arrière-plan bureaucratique du passage.
- source_word: תִּתְמַהּ
  choice: ne t’étonne pas
  rationale: Le verbe exprime l’étonnement ou la stupéfaction. Cette tournure est claire, actuelle et fidèle au ton de l’exhortation.
- source_word: הַחֵפֶץ
  choice: cette situation
  rationale: Dans ce contexte, le nom renvoie vraisemblablement à l’affaire ou au fait qui vient d’être décrit. « Cette situation » établit clairement ce lien sans imposer un sens abstrait de désir ou de dessein.
- source_word: גָבֹהַּ מֵעַל גָּבֹהַ
  choice: un haut placé … quelqu’un de plus haut placé
  rationale: L’adjectif « élevé » est substantivé et décrit des personnes de rang supérieur. « Haut placé » restitue la hiérarchie sans préciser qu’il s’agit nécessairement de fonctionnaires humains.
- source_word: שֹׁמֵר
  choice: est surveillé
  rationale: Le participe signifie « surveiller, veiller sur ». La construction passive française rend clairement la relation hiérarchique comprise dans « un haut au-dessus d’un haut veille », sans trancher la valeur favorable ou hostile de cette surveillance.
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: d’autres, plus hauts encore, sont au-dessus d’eux
  rationale: Le pluriel poursuit l’image de niveaux d’autorité superposés. « Plus hauts encore » rend la progression hiérarchique sans identifier explicitement les personnes évoquées.
theological_decisions:
- issue: Faut-il identifier explicitement Dieu comme l’autorité suprême qui surveille ?
  choice: Conserver dans le texte principal la formulation indéterminée parlant de personnes « plus hautes », sans ajouter « Dieu ».
  alternative: Comprendre les derniers « plus hauts » comme une allusion à Dieu, surveillant en dernier ressort les autorités humaines.
  rationale: L’hébreu décrit plusieurs niveaux élevés sans nommer Dieu. La formulation retenue préserve donc l’ambiguïté entre une observation de la bureaucratie humaine et une possible évocation de la supervision divine.
- issue: Quelle nuance donner à שֹׁמֵר dans la hiérarchie décrite ?
  choice: Employer le terme neutre « surveillé ».
  alternative: Traduire par « veille sur », ce qui pourrait suggérer une protection, ou par « épie », qui suggérerait une surveillance hostile.
  rationale: Le verbe permet plusieurs nuances. Le contexte ne précise pas si cette surveillance corrige l’injustice, la contrôle ou participe au système oppressif ; une formulation neutre maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque. La phrase conserve l’image d’une hiérarchie verticale et évite les termes trop techniques ou confessionnels.
