  text: 'There is a grievous evil that I have seen under the sun: wealth kept by its owner to his harm[a].'
translation:
  language: fr
  text: 'Il y a un mal grave que j’ai vu sous le soleil : une richesse conservée par son propriétaire pour son propre malheur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une richesse conservée pour son propriétaire, pour son malheur ». Les prépositions hébraïques permettent cette formulation légèrement différente, sans changement essentiel de sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a
  rationale: Rend naturellement en français moderne la particule existentielle qui introduit le constat.
- source_word: רָעָה חוֹלָה
  choice: un mal accablant
  rationale: רָעָה désigne ici une réalité mauvaise et nuisible, tandis que חוֹלָה, littéralement associé à la maladie, en souligne le caractère grave et pénible. « Accablant » conserve cette intensité sans calque artificiel.
- source_word: רָאִיתִי
  choice: que j’ai vu
  rationale: Préserve le témoignage personnel du locuteur et la valeur accomplie du verbe.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Conserve la formule caractéristique et récurrente de l’Ecclésiaste.
- source_word: עֹשֶׁר
  choice: une richesse
  rationale: Terme courant qui désigne ici les biens possédés; le singulier respecte la forme hébraïque et convient au constat général.
- source_word: שָׁמוּר
  choice: conservée
  rationale: Le participe passif présente la richesse comme gardée ou retenue. « Conservée » demeure neutre et n’impose pas explicitement l’idée de thésaurisation.
- source_word: לִבְעָלָיו
  choice: par son propriétaire
  rationale: בעל désigne le possesseur. Dans le contexte, « par » exprime naturellement en français le rôle du propriétaire dans la conservation de cette richesse, même si ל peut aussi être compris comme « pour ».
- source_word: לְרָעָתוֹ
  choice: pour son propre malheur
  rationale: Exprime le résultat nuisible qui atteint le propriétaire. « Son propre » clarifie le référent masculin sans changer le sens.
