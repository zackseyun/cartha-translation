  text: אֹהֵ֥ב כֶּ֨סֶף֙ לֹא יִשְׂבַּ֣ע כֶּ֔סֶף וּ/מִֽי אֹהֵ֥ב בֶּ/הָמ֖וֹן לֹ֣א תְבוּאָ֑ה גַּם זֶ֖ה הָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
translation:
  language: fr
  text: Qui aime l’argent ne se rassasie pas d’argent ; qui aime l’abondance n’est pas comblé par le revenu[a]. Cela aussi est de la vapeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le second membre est elliptique et sa syntaxe est difficile en hébreu : littéralement, après « qui aime l’abondance », « pas de revenu/produit ». Le verbe « est comblé » est sous-entendu. « Abondance » peut aussi se comprendre comme « richesse », et « revenu » comme « produit », « rendement » ou « gain ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « vapeur » (traditionnellement « vanité ») : terme récurrent de l’Ecclésiaste pour ce qui est fugitif, insaisissable ou sans consistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: qui aime
  rationale: Le participe désigne de manière générale toute personne caractérisée par cet attachement. « Qui aime » convient au ton proverbial et reste naturel en français.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le mot désigne littéralement l’argent métal et, par métonymie, la monnaie ou la richesse. En français, « argent » conserve naturellement ces deux valeurs ainsi que la répétition hébraïque.
- source_word: יִשְׂבַּע
  choice: ne se rassasie pas
  rationale: Le verbe exprime le fait d’être repu ou comblé. « Ne se rassasie pas » préserve l’image d’un désir insatiable et le registre sapiential.
- source_word: וּמִי
  choice: qui
  rationale: Dans ce membre parallèle de syntaxe difficile, l’expression introduit vraisemblablement une seconde catégorie générale plutôt qu’une véritable question. Le parallélisme français rend la coordination sans lourdeur.
- source_word: בֶּהָמוֹן
  choice: l’abondance
  rationale: הָמוֹן peut désigner une multitude, l’abondance ou la richesse. « L’abondance » maintient l’étendue sémantique du terme sans la réduire d’emblée à l’argent.
- source_word: תְבוּאָה
  choice: revenus
  rationale: Le nom signifie d’abord produit, récolte ou rendement, puis gain. Dans ce contexte économique, « revenus » exprime clairement le produit tiré des biens, tout en laissant une note signaler les autres possibilités.
- source_word: הָבֶל
  choice: vapeur
  rationale: Ce mot-clé de l’Ecclésiaste évoque ce qui est fugitif, insaisissable et sans consistance. « Vapeur » conserve la métaphore concrète sans imposer l’interprétation plus forte de « dépourvu de sens ».
theological_decisions:
- issue: Traduction du refrain הָבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: vanité ; souffle ; absurdité
  rationale: « Vapeur » maintient la tension entre brièveté, insaisissabilité et inconsistance. Cette traduction évite de réduire le terme soit à une faute morale (« vanité » au sens moderne), soit à une conclusion philosophique univoque (« absurdité »).
- issue: Sens du second membre de phrase
  choice: qui aime l’abondance ne se rassasie pas de revenus
  alternative: qui aime la richesse n’est pas comblé par le gain
  rationale: La syntaxe hébraïque est elliptique et difficile. La traduction répète le verbe du premier membre pour rendre explicite le parallélisme, sans dissimuler en note les autres valeurs possibles de הָמוֹן et תְבוּאָה.
translation_notes:
  register: Français international actuel, sobre et proverbial. La répétition de « argent » et de « ne se rassasie pas » reproduit le parallélisme et met en relief l’insatiabilité. « Cela aussi est vapeur » conserve volontairement la formule brève et métaphorique du texte hébreu.
