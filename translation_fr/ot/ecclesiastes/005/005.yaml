source:
  edition: WLC
  text: אַל תִּתֵּ֤ן אֶת פִּ֨י/ךָ֙ לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ וְ/אַל תֹּאמַר֙ לִ/פְנֵ֣י הַ/מַּלְאָ֔ךְ כִּ֥י שְׁגָגָ֖ה הִ֑יא לָ֣/מָּה יִקְצֹ֤ף הָֽ/אֱלֹהִים֙ עַל קוֹלֶ֔/ךָ וְ/חִבֵּ֖ל אֶת מַעֲשֵׂ֥ה יָדֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: fr
  text: 'Ne permets pas à ta bouche de faire pécher ta chair, et ne dis pas devant le messager[a] : « C’était une erreur. » Pourquoi Dieu s’irriterait-il à cause de ta voix et détruirait-il l’œuvre de tes mains ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ange ». Le mot hébreu מַלְאָךְ peut désigner soit un messager humain, soit un messager céleste.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: permets à ta bouche
  rationale: La tournure hébraïque est littéralement « donne ta bouche », mais « permets à ta bouche » restitue naturellement en français sa valeur permissive.
- source_word: לַחֲטִיא
  choice: faire pécher
  rationale: Le hifil de חטא a ici une valeur causative. « Faire pécher » conserve cette force sans préciser au-delà du texte la nature exacte de la faute.
- source_word: בְּשָׂרֶךָ
  choice: ta chair
  rationale: Le terme désigne littéralement la chair et peut évoquer la personne dans sa réalité corporelle. Le maintien de « chair » préserve cette image et sa tension avec la bouche.
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: מַלְאָךְ peut désigner un messager humain ou un ange. Dans le contexte des vœux, un agent humain lié au sanctuaire est plausible, sans être certain ; l’autre sens est donc signalé en note.
- source_word: שְׁגָגָה
  choice: une erreur
  rationale: Le nom évoque une faute commise par mégarde ou une inadvertance. « Une erreur » convient à l’excuse invoquée et reste naturelle en français.
- source_word: קוֹלֶךָ
  choice: ta voix
  rationale: Le choix conserve l’image concrète de l’hébreu, tout en renvoyant dans le contexte aux paroles prononcées.
- source_word: וְחִבֵּל
  choice: détruirait
  rationale: Le verbe exprime l’idée de ruiner ou de détruire. « Détruirait » rend clairement la gravité du jugement évoqué.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: l’œuvre de tes mains
  rationale: Cette expression hébraïque désigne le travail d’une personne et ses résultats. Le calque est idiomatique et digne en français.
theological_decisions:
- issue: Identité de הַמַּלְאָךְ dans le contexte des vœux
  choice: le messager
  alternative: l’ange
  rationale: Le contexte peut viser un représentant humain chargé des vœux, mais le terme hébreu peut aussi désigner un être céleste. Le texte principal retient le sens général de « messager » et la note préserve l’autre lecture sans trancher abusivement.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond au singulier de l’hébreu. Les expressions concrètes « ta chair », « ta voix » et « l’œuvre de tes mains » sont conservées, car elles demeurent compréhensibles et portent la texture poétique du texte.
