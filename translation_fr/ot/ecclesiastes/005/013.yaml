  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: fr
  text: Cette richesse se perd dans une affaire malheureuse[a] ; il engendre un fils, et il n’a rien en main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause d’une affaire désastreuse » ou « dans une circonstance pénible ». L’expression hébraïque peut désigner une entreprise nuisible ou une situation malheureuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y a rien dans sa main », expression qui signifie qu’il ne possède rien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: se perd
  rationale: Le qal a pour sujet « cette richesse ». La tournure pronominale française exprime naturellement sa disparition sans préciser un agent que l’hébreu ne nomme pas.
- source_word: הָעֹשֶׁר הַהוּא
  choice: cette richesse
  rationale: « Richesse » rend le nom collectif עֹשֶׁר, tandis que le démonstratif français reflète l’article suivi de הַהוּא.
- source_word: בְּעִנְיַן רָע
  choice: dans une affaire malheureuse
  rationale: עִנְיָן peut désigner une affaire, une activité ou une circonstance. « Affaire malheureuse » conserve l’indétermination de l’expression et son résultat nuisible sans la réduire nécessairement à un investissement commercial.
- source_word: וְהוֹלִיד בֵּן
  choice: il devient père d’un fils
  rationale: Le hiphil de ילד signifie ici engendrer ou devenir père. Cette formulation est naturelle en français moderne, garde le sujet masculin implicite et traduit précisément בֵּן par « fils ».
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: mais il ne lui reste rien
  rationale: La proposition signifie idiomatiquement qu’il ne possède plus rien. « Il ne lui reste rien » communique clairement le dénuement dans le contexte, tandis qu’une note conserve l’image concrète de la main.
