  text: It is better that you should not vow than that you should vow and not fulfill it[a].
translation:
  language: fr
  text: Mieux vaut ne pas faire de vœu que d’en faire un sans l’accomplir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et ne pas le payer ». Ici, « payer » signifie s’acquitter d’un vœu, l’accomplir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב אֲשֶׁר
  choice: Mieux vaut
  rationale: Cette tournure française naturelle et proverbiale exprime fidèlement l’évaluation comparative introduite par טוֹב.
- source_word: לֹא תִדֹּר
  choice: ne pas faire de vœu
  rationale: Le verbe נדר désigne ici l’action de prononcer ou faire un vœu; l’infinitif s’intègre naturellement à la construction comparative française.
- source_word: מִשֶּׁתִּדּוֹר
  choice: que d’en faire un
  rationale: Le préfixe מִן avec אֲשֶׁר introduit le second terme de la comparaison; «en faire un» reprend clairement «vœu» sans lourdeur.
- source_word: וְלֹא תְשַׁלֵּם
  choice: sans l’accomplir
  rationale: Dans le contexte d’un vœu, le piel de שלם signifie s’en acquitter, c’est-à-dire l’accomplir. «Sans» rend naturellement la conséquence associée au fait de faire le vœu, tandis que la note conserve le sens plus littéral de «payer».
