source:
  edition: WLC
  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: fr
  text: De plus, toute personne à qui Dieu a donné richesses et biens, et qu’il a rendue capable d’en manger, de prendre sa part[a] et de se réjouir de son travail — c’est un don de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de recevoir son lot ». Dans l’Ecclésiaste, la « part » désigne ce qui revient à quelqu’un dans la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De même
  rationale: Marque la continuité avec la réflexion précédente tout en gardant la valeur additive de l’hébreu.
- source_word: כָּל הָאָדָם
  choice: toute personne
  rationale: Le singulier hébreu הָאָדָם a ici une portée générique et distributive; « toute personne » la restitue naturellement en français moderne.
- source_word: עֹשֶׁר וּנְכָסִים
  choice: richesses et biens
  rationale: Distingue l’abondance matérielle des possessions concrètes dans une formulation française courante.
- source_word: וְהִשְׁלִיטוֹ
  choice: qu’il a rendue capable
  rationale: Le hiphil de שלט exprime ici une capacité accordée par Dieu, et non une simple permission.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: d’en manger
  rationale: Conserve l’image concrète du texte hébreu, où manger de ses biens signifie en tirer effectivement profit.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: de prendre sa part
  rationale: חֵלֶק désigne dans l’Ecclésiaste la part attribuée à quelqu’un; « prendre sa part » préserve le mouvement du verbe נשׂא sans surinterprétation.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: de se réjouir de son travail
  rationale: Maintient la joie explicite de שמח et rend עמל par un terme naturel qui conserve l’idée d’effort.
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: voilà le don de Dieu
  rationale: La tournure présentative française reprend naturellement la conclusion emphatique de l’hébreu.
theological_decisions:
- issue: Portée générique de הָאָדָם
  choice: toute personne
  alternative: tout homme
  rationale: Le nom masculin singulier désigne ici distributivement l’être humain en général. Le français « toute personne » exprime cette portée sans transformer le référent en pluriel.
- issue: Nature de l’action divine dans וְהִשְׁלִיטוֹ
  choice: qu’il a rendue capable
  alternative: à qui il a donné le pouvoir
  rationale: Le contexte met l’accent sur la capacité, elle-même donnée par Dieu, de jouir des biens reçus; la traduction évite de réduire le verbe à une simple autorisation.
- issue: Sens de חֵלֶק dans l’Ecclésiaste
  choice: sa part
  alternative: son lot
  rationale: « Part » conserve l’idée d’une portion attribuée dans la vie sans préciser indûment si elle est reçue, acceptée ou méritée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la structure cumulative du texte hébreu et son image concrète de « manger » de ses biens.
