source:
  edition: WLC
  text: וְ/יִתְר֥וֹן אֶ֖רֶץ בַּ/כֹּ֣ל היא מֶ֥לֶךְ לְ/שָׂדֶ֖ה נֶעֱבָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/008.yaml
  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: fr
  text: Le profit de la terre est pour tous ; même le roi est servi par les champs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est particulièrement difficile. On peut aussi traduire : « Un avantage pour un pays, à tous égards, c’est un roi qui se consacre aux terres cultivées. » La dernière proposition peut également se comprendre ainsi : « même le roi dépend des champs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: Le profit de la terre
  rationale: יִתְרוֹן est le terme récurrent de l’Ecclésiaste pour le profit, l’avantage ou le gain. « Le profit de la terre » conserve ce fil lexical tout en restant naturel en français.
- source_word: בַּכֹּל
  choice: est pour tous
  rationale: Selon la division syntaxique retenue, l’expression indique que le produit ou l’avantage de la terre profite à tous. Le sens adverbial « à tous égards » demeure possible et est signalé en note.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: même le roi est servi par les champs
  rationale: La formulation comprend le roi comme sujet du participe passif et les champs comme ce par quoi il est servi. Le pluriel français « les champs » exprime naturellement la réalité agricole désignée collectivement par שָׂדֶה, sans effacer les autres analyses possibles.
theological_decisions: []
