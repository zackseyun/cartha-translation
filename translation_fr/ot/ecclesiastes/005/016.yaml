  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: fr
  text: De plus, tous ses jours, il mange dans l’obscurité[a], avec beaucoup de contrariété[b], de maladie et de colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Dans l’obscurité » peut se comprendre au sens propre ou comme l’image d’une vie sombre et sans joie.
    reason: lexical_alternative
  - marker: b
    text: Ou « beaucoup de chagrin » ou « beaucoup de frustration » ; l’expression hébraïque est condensée et peut exprimer la contrariété, la frustration ou le chagrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: Marque l’ajout d’un nouvel aspect à la condition misérable décrite dans le contexte.
- source_word: כָּל יָמָיו
  choice: tous ses jours
  rationale: Conserve l’expression hébraïque et sa tonalité caractéristique dans l’Ecclésiaste, tout en restant compréhensible en français moderne.
- source_word: בַּחֹשֶׁךְ
  choice: dans l’obscurité
  rationale: Préserve l’image concrète de l’hébreu sans décider si elle est littérale ou figurée.
- source_word: יֹאכֵל
  choice: il mange
  rationale: L’imparfait hébreu exprime ici une action habituelle ou caractéristique; le présent français convient à cette valeur.
- source_word: וְכָעַס הַרְבֵּה
  choice: accablé de beaucoup de contrariété
  rationale: La séquence hébraïque est elliptique. « Accablé de » permet de la relier naturellement à la proposition précédente, tandis que « contrariété » garde l’idée d’agitation, de frustration ou de chagrin.
- source_word: וְחָלְיוֹ
  choice: de maladie
  rationale: Le nom désigne une maladie ou une souffrance physique. La coordination française l’intègre à la série des maux qui accablent l’homme.
- source_word: וָקָצֶף
  choice: et de colère
  rationale: Dans ce contexte, le terme décrit vraisemblablement l’état d’amertume ou d’irritation de l’homme plutôt qu’une colère divine.
