source:
  edition: WLC
  text: אַל תְּבַהֵ֨ל עַל פִּ֜י/ךָ וְ/לִבְּ/ךָ֧ אַל יְמַהֵ֛ר לְ/הוֹצִ֥יא דָבָ֖ר לִ/פְנֵ֣י הָ/אֱלֹהִ֑ים כִּ֣י הָ/אֱלֹהִ֤ים בַּ/שָּׁמַ֨יִם֙ וְ/אַתָּ֣ה עַל הָ/אָ֔רֶץ עַֽל כֵּ֛ן יִהְי֥וּ דְבָרֶ֖י/ךָ מְעַטִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: fr
  text: Ne te précipite pas pour parler[a], et que ton cœur ne se hâte pas de prononcer une parole devant Dieu, car Dieu est au ciel et toi, tu es sur la terre. Que tes paroles soient donc peu nombreuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne te précipite pas quant à ta bouche ». Dans ce contexte, l’avertissement peut inclure les vœux irréfléchis, mais l’hébreu parle ici plus largement de toute parole prononcée devant Dieu.'
    reason: Précision littérale et maintien de la portée sémantique générale.
lexical_decisions:
- source_word: תְּבַהֵל עַל פִּיךָ
  choice: Ne te précipite pas pour parler
  rationale: L’expression hébraïque associe l’idée de précipitation à la bouche. Cette formulation française exprime naturellement la parole irréfléchie sans la limiter aux vœux.
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: Le « cœur » hébreu désigne ici l’intériorité, notamment la pensée et la volonté. Conserver l’image reste naturel et respecte l’anthropologie du texte.
- source_word: יְמַהֵר לְהוֹצִיא דָבָר
  choice: ne se hâte pas de prononcer une parole
  rationale: « Prononcer une parole » rend idiomatiquement le sens littéral de « faire sortir une parole », tout en préservant la portée générale de l’expression.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: Équivalent direct, concis et solennel de la locution hébraïque.
- source_word: בַּשָּׁמַיִם ... עַל הָאָרֶץ
  choice: au ciel ... sur la terre
  rationale: Cette formulation française naturelle maintient pleinement le contraste spatial entre Dieu et l’être humain.
- source_word: עַל כֵּן
  choice: donc
  rationale: Le connecteur marque la conséquence pratique tirée du contraste entre le ciel et la terre.
- source_word: יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: Que tes paroles soient donc peu nombreuses
  rationale: Le tour exhortatif rend la valeur jussive et conserve l’appel explicite à la retenue verbale.
theological_decisions:
- issue: Faut-il limiter l’avertissement aux vœux ou aux promesses prononcés dans le culte ?
  choice: Conserver une référence générale à la parole prononcée devant Dieu.
  alternative: Traduire explicitement par un avertissement contre les vœux irréfléchis.
  rationale: Le contexte voisin traite des vœux, mais ce verset emploie le terme général דָבָר, « parole ». La traduction ne réduit donc pas une ambiguïté que l’hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit les formes hébraïques. Le parallélisme entre la bouche et le cœur est conservé, avec une légère adaptation idiomatique nécessaire en français.
