id: ECC.5.15
reference: Ecclesiastes 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּ/ל עֻמַּ֥ת שֶׁ/בָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּ/מַה יִּתְר֣וֹן ל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל לָ/רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: fr
  text: 'C’est aussi un mal accablant : il s’en ira exactement comme il est venu. Quel avantage a-t-il donc à peiner pour le vent[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le souffle » ou « pour l’esprit ». Le mot hébreu רוּחַ peut signifier « vent », « souffle » ou « esprit ». Ici, « vent » correspond le mieux au contexte d’un labeur futile.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: un mal accablant
  rationale: L’expression associe « mal » à un terme lié à la maladie ou à la souffrance. « Un mal accablant » rend la gravité douloureuse de l’idiome sans évoquer à tort une maladie au sens propre.
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: exactement comme il est venu
  rationale: עֻמַּת marque une correspondance étroite. Cette formulation conserve clairement le parallèle entre l’arrivée de l’être humain dans le monde et son départ.
- source_word: יֵלֵךְ
  choice: il s’en ira
  rationale: L’imparfait hébreu exprime ici la certitude générale du départ, c’est-à-dire de la mort. « Il s’en ira » est naturel en français et garde la sobriété de l’image.
- source_word: יִתְרוֹן
  choice: avantage
  rationale: Terme récurrent de Qohélet désignant ce qui reste comme gain ou bénéfice. « Avantage » convient à la question existentielle du passage sans réduire le sens au seul profit financier.
- source_word: שֶׁיַּעֲמֹל
  choice: à peiner
  rationale: עמל évoque un travail pénible et lassant. « Peiner » restitue cette nuance tout en donnant une question idiomatique en français.
- source_word: לָרוּחַ
  choice: pour le vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Dans ce contexte de labeur sans gain durable, « le vent » conserve l’image concrète d’un effort futile.
theological_decisions:
- issue: Sens de רוּחַ dans un contexte de sagesse portant sur la futilité
  choice: le vent
  alternative: le souffle ; l’esprit
  rationale: Le contexte oppose le labeur humain à l’absence de gain conservé au moment de la mort. « Le vent » exprime cette insaisissabilité sans introduire une interprétation spiritualisée, tandis que la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe est rendue naturelle sans effacer le parallélisme proverbial ni l’image concrète du vent.
