revisions:
- from: Quand tu fais un vœu à Dieu, ne tarde pas à l’accomplir[a], car il ne prend aucun plaisir aux insensés[b]. Accomplis ce que tu as promis par ton vœu.
  to: Quand tu fais un vœu à Dieu, ne tarde pas à l’accomplir[a], car les insensés ne lui plaisent pas[b]. Accomplis ce que tu as voué.
  rationale: La révision corrige une tournure française maladroite sans modifier l’analyse contextuelle du sujet implicite. Elle allège également la dernière phrase afin de suivre plus étroitement l’objet relatif et l’impératif hébreux, tout en conservant un français moderne et digne. Les notes maintiennent l’alternative lexicale de שׁלם et l’ellipse syntaxique de la clause centrale.
