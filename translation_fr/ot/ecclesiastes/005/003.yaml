base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: fr
  text: Quand tu fais un vœu à Dieu, ne tarde pas à l’accomplir[a], car les insensés ne lui plaisent pas[b]. Accomplis ce que tu as voué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à t’en acquitter ». Le verbe hébreu peut signifier payer, achever ou accomplir ce qui a été voué.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car il n’y a pas de plaisir dans les insensés »; le sujet est sous-entendu. Dans ce contexte, le sens le plus probable est que les insensés ne plaisent pas à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quand
  rationale: Introduit la circonstance dans laquelle un vœu est prononcé; « Quand » est naturel en français et convient à la portée générale de l’exhortation.
- source_word: תִּדֹּר נֶדֶר
  choice: tu fais un vœu
  rationale: Le redoublement étymologique hébreu, littéralement « vouer un vœu », désigne l’acte formel de faire un vœu; la tournure française choisie est idiomatique.
- source_word: לֵאלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte cultuel de l’Ecclésiaste, le terme désigne Dieu au singulier.
- source_word: אַל תְּאַחֵר
  choice: ne tarde pas
  rationale: Rend directement l’interdiction de différer l’exécution du vœu.
- source_word: לְשַׁלְּמוֹ
  choice: à l’accomplir
  rationale: Le verbe שׁלם peut exprimer le paiement, l’achèvement ou l’exécution d’un engagement. « Accomplir un vœu » est naturel et couvre aussi bien une promesse d’action qu’une offrande.
- source_word: כִּי אֵין חֵפֶץ
  choice: car il ne prend aucun plaisir
  rationale: Le texte hébreu dit littéralement qu’« il n’y a pas de plaisir » parmi ou envers les insensés; le contexte permet de comprendre Dieu comme sujet implicite, sans effacer l’ellipse dans la note.
- source_word: בַּכְּסִילִים
  choice: aux insensés
  rationale: Dans la littérature de sagesse, כְּסִילִים caractérise des personnes moralement et spirituellement déraisonnables, et non un simple manque d’intelligence.
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: Accomplis ce que tu as promis par ton vœu
  rationale: La formulation française explicite naturellement l’objet du vœu tout en conservant l’impératif final et la répétition de שׁלם.
theological_decisions:
- issue: Sujet implicite de « כִּי אֵין חֵפֶץ בַּכְּסִילִים »
  choice: 'Comprendre Dieu comme sujet implicite: « car il ne prend aucun plaisir aux insensés »'
  alternative: 'Conserver une tournure impersonnelle: « car il n’y a aucun plaisir dans les insensés »'
  rationale: Dieu est le référent immédiatement précédent et la maxime explique pourquoi il ne faut pas différer l’accomplissement du vœu. Une note conserve cependant la forme plus elliptique de l’hébreu.
- issue: Portée morale de כְּסִילִים
  choice: « les insensés » au sens sapientiel
  alternative: « les sots » ou « les personnes stupides »
  rationale: Le mot désigne une attitude moralement déraisonnable devant Dieu; « insensés » maintient cette catégorie de sagesse sans la réduire aux capacités intellectuelles.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque. « Accomplir un vœu » a été préféré à « payer un vœu », plus étroit en français, tandis que les notes signalent l’étendue lexicale et l’ellipse de l’original.
