  text: כַּ/אֲשֶׁ֤ר יָצָא֙ מִ/בֶּ֣טֶן אִמּ֔/וֹ עָר֛וֹם יָשׁ֥וּב לָ/לֶ֖כֶת כְּ/שֶׁ/בָּ֑א וּ/מְא֨וּמָה֙ לֹא יִשָּׂ֣א בַ/עֲמָל֔/וֹ שֶׁ/יֹּלֵ֖ךְ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: fr
  text: Comme il est sorti du ventre de sa mère, nu, il s’en retournera comme il était venu. Il n’emportera rien de son labeur qu’il puisse emporter dans sa main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר יָצָא מִבֶּטֶן אִמּוֹ
  choice: Comme il est sorti du ventre de sa mère
  rationale: Rend directement la comparaison et l’image concrète de la naissance, dans un français naturel.
- source_word: עָרוֹם
  choice: nu
  rationale: Conserve le sens littéral et souligne le dénuement de l’être humain à son arrivée comme à son départ.
- source_word: יָשׁוּב לָלֶכֶת כְּשֶׁבָּא
  choice: il s’en retournera, repartant comme il était venu
  rationale: Le verbe pronominal « s’en retourner » exprime le départ et le retour, tandis que la suite préserve la comparaison avec la venue au monde sans préciser au-delà du texte la destination du retour.
- source_word: וּמְאוּמָה לֹא יִשָּׂא
  choice: Il n’emportera rien
  rationale: Formulation idiomatique qui garde la négation absolue et l’idée de ne rien prendre avec soi en partant.
- source_word: בַעֲמָלוֹ
  choice: du fruit de son travail
  rationale: Dans cette construction, la préposition peut désigner ce qui provient de son labeur; « fruit de son travail » explicite naturellement ce rapport sans effacer la notion de travail pénible.
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: qu’il puisse prendre dans sa main
  rationale: Préserve l’image concrète de la main et rend le relatif comme précisant le « rien » qu’il pourrait emporter.
theological_decisions:
- issue: Sens du retour après la mort
  choice: Conserver l’image du retour sans nommer explicitement la terre ni une destination post-mortem.
  alternative: « il retournera à la terre »
  rationale: La destination n’est pas exprimée dans ce verset; l’ajouter résoudrait une implication que l’hébreu laisse sous-entendue.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme entre naissance et départ, ainsi que l’image concrète de la main. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
