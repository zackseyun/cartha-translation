review_pass:
  verdict: revise
  source_fidelity: La comparaison entre la sortie du ventre maternel, la nudité et le départ final est bien conservée. « Fruit de son travail » est toutefois légèrement plus interprétatif que בַּעֲמָלוֹ (« de son labeur / travail »), et la séquence « s’en retournera, repartant » redouble de manière lourde les verbes de départ. La révision maintient le mouvement de retour et de départ sans ajouter de destination.
  naturalness: Le français est globalement clair et d’un registre approprié, mais « il s’en retournera, repartant » est tautologique et peu fluide. « Nu, il s’en retournera comme il était venu » est plus naturel tout en gardant le parallélisme.
  terminology: « Nu » rend correctement עָרוֹם. « Labeur » rend mieux עָמָל que « fruit de son travail », en conservant l’idée d’un travail pénible sans expliciter un gain ou un produit. « Emporter dans sa main » conserve l’image concrète de בְּיָדוֹ.
  issues:
  - severity: medium
    issue: Redondance dans « il s’en retournera, repartant »
    rationale: Les deux expressions rendent un même mouvement de départ. Cette accumulation alourdit le français sans reproduire naturellement la construction hébraïque יָשׁוּב לָלֶכֶת.
  - severity: low
    issue: « du fruit de son travail » explicite le résultat du labeur
    rationale: Le terme hébreu עָמָל désigne le labeur ou le travail pénible; « fruit » introduit plus précisément l’idée de produit ou de bénéfice. « De son labeur » est plus proche et reste idiomatique.
  revised_text: Comme il est sorti du ventre de sa mère, nu, il s’en retournera comme il était venu. Il n’emportera rien de son labeur qu’il puisse emporter dans sa main.
  revised_footnotes: []
  revision_rationale: 'La révision élimine une redondance stylistique, rend עָמָל par « labeur » et conserve l’image de ce qui peut être emporté « dans sa main ». Aucune note française n’est nécessaire : l’alternative anglaise ne signale pas une ambiguïté textuelle exigeant une note en français, et aucun marqueur n’est présent dans le projet français.'
