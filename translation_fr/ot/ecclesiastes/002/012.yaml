  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: fr
  text: Je me suis alors tourné pour considérer la sagesse, la folie et la sottise. Car que pourra faire l’homme qui viendra après le roi, sinon ce qui a déjà été fait[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est difficile. Littéralement, il se termine par une expression telle que : « ce qu’ils ont déjà fait à lui / à cela », le suffixe final étant ambigu. On peut aussi comprendre : « seulement ce qui a déjà été fait ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Alors je me suis tourné
  rationale: Le verbe פנה marque ici le passage à un nouvel objet de réflexion. Cette formulation conserve l’image du mouvement tout en restant naturelle en français.
- source_word: לִרְאוֹת
  choice: vers l’examen de
  rationale: Littéralement « pour voir », l’infinitif signifie ici examiner ou considérer des réalités abstraites. « L’examen de » exprime clairement la démarche intellectuelle.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rendu usuel de חָכְמָה, qui désigne ici la sagesse pratique et intellectuelle.
- source_word: הוֹלֵלוֹת
  choice: la démence
  rationale: Dans l’Ecclésiaste, le terme évoque un comportement irrationnel ou insensé. « Démence » maintient son intensité et le distingue de סִכְלוּת.
- source_word: סִכְלוּת
  choice: la sottise
  rationale: Le mot désigne la stupidité ou la folie. « Sottise » offre un contraste naturel avec « sagesse » sans répéter « démence ».
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici la justification de la démarche précédente. « En effet » convient au mouvement argumentatif en français moderne.
- source_word: מֶה הָאָדָם
  choice: que pourra faire l’homme
  rationale: L’hébreu dit littéralement « qu’est-ce que l’homme », mais la question elliptique porte vraisemblablement sur ce que le successeur peut accomplir. Le futur s’accorde avec « qui viendra ».
- source_word: שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: qui viendra après le roi
  rationale: Le yiqtol indique naturellement le successeur à venir. La formulation demeure proche de la syntaxe hébraïque.
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: Seulement ce qui a déjà été fait
  rationale: La proposition hébraïque est très condensée et son suffixe peut viser « lui » ou « cela ». Le texte principal donne le sens contextuel probable sans attribuer explicitement l’action à un sujet indéterminé; la note conserve l’ambiguïté formelle.
theological_decisions:
- issue: Valeur de הָאָדָם dans une question rhétorique singulière
  choice: l’homme
  alternative: un homme ; l’être humain
  rationale: Le nom désigne ici l’individu qui succède au roi plutôt que l’humanité prise collectivement. L’article et le singulier sont ainsi conservés sans ajouter de portée doctrinale.
- issue: Interprétation de la proposition finale difficile
  choice: Seulement ce qui a déjà été fait
  alternative: ce qu’on lui a déjà fait ; ce qu’ils ont déjà fait
  rationale: Le contexte suggère qu’un successeur ne peut que répéter l’œuvre déjà accomplie, mais la morphologie hébraïque permet aussi de comprendre le suffixe comme « lui ». La traduction lisible est retenue dans le texte et l’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation répartit la longue phrase hébraïque en trois unités pour clarifier le raisonnement, tandis que la note rend visible l’obscurité réelle de la proposition finale.
