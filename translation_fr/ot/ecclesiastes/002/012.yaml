revisions:
- from: Alors je me suis tourné vers l’examen de la sagesse, de la démence et de la sottise. En effet, que pourra faire l’homme qui viendra après le roi ? Seulement ce qui a déjà été fait.[a]
  to: Je me suis alors tourné pour considérer la sagesse, la folie et la sottise. Car que pourra faire l’homme qui viendra après le roi, sinon ce qui a déjà été fait[a] ?
  rationale: La révision remplace le terme clinique « démence » par « folie », rend l’ouverture plus naturelle en français, et exprime par « sinon » la limitation contextuelle du successeur. La note conserve explicitement l’obscurité de la finale hébraïque et l’ambiguïté du suffixe, tandis que le texte principal adopte, sans surinterprétation, le sens contextuel également retenu dans l’audit anglais.
