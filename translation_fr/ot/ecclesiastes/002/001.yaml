base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: fr
  text: 'Je me suis dit dans mon cœur : « Allons, je vais te mettre à l’épreuve par le plaisir[a] ; profite de ce qui est bon[b]. » Mais voilà : cela aussi est vapeur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la joie » ou « l’allégresse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vois le bien » ; l’expression hébraïque signifie ici faire l’expérience de ce qui est bon ou en jouir.
    reason: lexical_alternative
  - marker: c
    text: Ou « vanité » ou « souffle ». Le mot hébreu traduit par « vapeur » est une métaphore récurrente dans l’Ecclésiaste pour ce qui est fugitif, insaisissable ou sans consistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Je me suis dit dans mon cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la réflexion intérieure, tout en restant compréhensible en français moderne.
- source_word: לְכָה נָּא
  choice: Allons donc !
  rationale: L’expression introduit une exhortation que le locuteur s’adresse à lui-même. « Allons donc ! » en rend naturellement l’élan sans recourir à une tournure archaïque.
- source_word: אֲנַסְּכָה
  choice: Je vais te mettre à l’épreuve
  rationale: Le verbe נסה signifie essayer ou mettre à l’épreuve. Le pronom de deuxième personne maintient l’adresse intérieure présente dans l’hébreu.
- source_word: בְשִׂמְחָה
  choice: par la joie
  rationale: שִׂמְחָה peut désigner la joie, l’allégresse ou le plaisir. « Joie » est naturel et assez large pour ne pas limiter prématurément l’expérience évoquée au seul plaisir sensuel.
- source_word: וּרְאֵה בְטוֹב
  choice: goûte au bonheur
  rationale: Littéralement, la tournure invite à « voir dans le bien ». Dans ce contexte, « goûter au bonheur » exprime de façon actuelle l’idée d’en faire l’expérience et d’en jouir, tout en gardant une image concrète.
- source_word: וְהִנֵּה
  choice: Mais voilà
  rationale: הִנֵּה attire l’attention sur le constat qui suit. « Mais voilà » rend aussi le tournant adversatif implicite du contexte dans un registre moderne et digne.
- source_word: גַם הוּא
  choice: cela aussi
  rationale: La formule renvoie à l’expérience de la joie et du bonheur qui vient d’être décrite et l’ajoute aux réalités déjà évaluées.
- source_word: הָבֶל
  choice: vapeur
  rationale: '« Vapeur » préserve la métaphore concrète et récurrente de l’Ecclésiaste : quelque chose de fugitif, insaisissable ou sans consistance, sans la réduire à la seule idée d’absurdité.'
theological_decisions:
- issue: Traduction du terme thématique הָבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: vanité, souffle, absurdité
  rationale: Le terme porte plusieurs nuances — caractère fugitif, insaisissable et inconsistant. « Vapeur » maintient cette tension métaphorique, tandis que « absurdité » impose une conclusion interprétative et que « vanité » peut évoquer à tort l’orgueil personnel.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore du cœur et celle de la vapeur sont conservées ; les expressions idiomatiques sont rendues de manière intelligible sans effacer leur portée poétique.
