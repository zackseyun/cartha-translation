  yaml_path: translation/ot/ecclesiastes/002/025.yaml
  text: For who can eat[a], and who can enjoy[b], apart from him?
translation:
  language: fr
  text: Car qui peut manger et qui peut éprouver du plaisir[b], en dehors de moi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « en dehors de moi ». Des témoins anciens et de nombreux interprètes comprennent « en dehors de lui », c’est-à-dire en dehors de Dieu, ce qui correspond au contexte.
    reason: textual_variant
  - marker: b
    text: Ou « qui peut se hâter ? » ou « qui peut ressentir ? » Le verbe hébreu est difficile ; le contexte conduit ici à le comprendre au sens d’éprouver du plaisir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « Car » en conserve clairement la valeur causale.
- source_word: מִי
  choice: qui
  rationale: Le pronom interrogatif ouvre une question rhétorique ; « qui » est l’équivalent français naturel.
- source_word: יֹאכַל
  choice: peut manger
  rationale: Dans cette question rhétorique, l’imparfait exprime la possibilité ou la capacité, rendue naturellement par « peut manger ».
- source_word: וּמִי
  choice: et qui
  rationale: Cette formulation conserve la coordination et le parallélisme de l’hébreu.
- source_word: יָחוּשׁ
  choice: peut éprouver du plaisir
  rationale: Le verbe est difficile. Le contexte immédiat, qui associe nourriture et jouissance, favorise l’idée de faire l’expérience du plaisir sans masquer les autres analyses possibles.
- source_word: חוּץ מִמֶּנִּי
  choice: en dehors de moi
  rationale: Le texte massorétique porte littéralement « hors de moi ». La formulation française conserve cette leçon tout en signalant en note la lecture contextuelle « en dehors de lui ».
theological_decisions:
- issue: Référent du suffixe pronominal dans מִמֶּנִּי
  choice: en dehors de moi
  alternative: en dehors de lui, c’est-à-dire de Dieu
  rationale: La vocalisation massorétique donne sans ambiguïté grammaticale « de moi », avec Qohéleth comme locuteur. Toutefois, le contexte attribue à Dieu la capacité de jouir, et des témoins anciens ainsi que de nombreux interprètes reflètent « de lui ». Le texte principal suit donc la source hébraïque fournie, tandis que la note préserve la tension textuelle et contextuelle.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique reste concise. Le texte principal suit la forme massorétique « moi », tandis que les notes rendent visibles l’incertitude lexicale de יָחוּשׁ et la lecture contextuelle « lui ».
