base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: fr
  text: Car que retire l’homme de tout son travail et de l’effort de son cœur, dans lesquels il peine sous le soleil ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la préoccupation de son cœur », « du tourment de son cœur » ou « de ce que poursuit son cœur ». Le terme hébreu רַעְיוֹן peut évoquer un effort intérieur, une poursuite mentale ou une préoccupation pénible dans l’Ecclésiaste.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la progression argumentative.
- source_word: מֶה הֹוֶה לָאָדָם
  choice: que retire l’homme
  rationale: Littéralement, la tournure demande ce qui advient ou revient à l’homme; « que retire » exprime naturellement en français le bénéfice obtenu sans transformer explicitement la question en vocabulaire de profit.
- source_word: לָאָדָם
  choice: l’homme
  rationale: Désigne ici l’être humain de manière générique tout en conservant le singulier masculin représentatif de l’hébreu.
- source_word: בְּכָל עֲמָלוֹ
  choice: de tout son travail
  rationale: Le contexte demande ce qui revient à l’homme de son labeur; « travail » est clair et actuel, tandis que « de » rend la valeur de source ou de résultat.
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: et des préoccupations de son cœur
  rationale: רַעְיוֹן peut évoquer l’effort intérieur, la poursuite mentale ou une préoccupation pénible. « Préoccupations » garde ici la dimension mentale et inquiète, tandis qu’une note signale les autres nuances possibles.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Conserve l’image et l’anthropologie hébraïques, où le cœur comprend notamment la pensée, la volonté et les dispositions intérieures.
- source_word: שֶׁהוּא עָמֵל
  choice: pour lesquels il peine
  rationale: Le relatif se rapporte naturellement en français à l’ensemble du travail et des préoccupations; « peine » conserve l’idée d’un effort laborieux et pénible.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Rend littéralement cette formule structurante et récurrente de l’Ecclésiaste.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, de même que les expressions littéraires « son cœur » et « sous le soleil ». Le choix de « préoccupations » évite de fixer trop étroitement le sens disputé de רַעְיוֹן; les principales possibilités sont données en note.
