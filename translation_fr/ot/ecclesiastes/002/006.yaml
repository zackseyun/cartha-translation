  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
translation:
  language: fr
  text: Je me suis aménagé des bassins d’eau afin d’irriguer, avec leur eau,[a] un bois[b] où poussent des arbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin d’arroser à partir d’eux », c’est-à-dire à partir de ces bassins.'
    reason: lexical_alternative
  - marker: b
    text: Ou « une forêt » ou « une étendue boisée ». Le mot hébreu יַעַר peut désigner une forêt ou un terrain boisé ; « bois » convient ici au contexte d’un espace aménagé et irrigué.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Je me suis aménagé
  rationale: Le verbe עשה signifie « faire » ou « réaliser », et לִי marque ici le bénéfice personnel. La tournure pronominale française exprime naturellement l’idée d’un aménagement entrepris pour soi.
- source_word: בְּרֵכוֹת מָיִם
  choice: des bassins d’eau
  rationale: בְּרֵכוֹת désigne des bassins ou réservoirs. « Bassins d’eau » conserve l’image concrète sans préciser excessivement la nature des ouvrages.
- source_word: לְהַשְׁקוֹת מֵהֶם
  choice: afin d’irriguer, avec leur eau
  rationale: Le hiphil de שקה signifie « faire boire », donc « arroser » ou « irriguer ». מֵהֶם indique que l’eau provenait des bassins ; « avec leur eau » rend ce rapport de source de façon naturelle en français.
- source_word: יַעַר
  choice: un bois
  rationale: יַעַר peut désigner une forêt ou une étendue boisée. « Bois » convient au cadre aménagé et irrigué tout en préservant l’idée d’un terrain couvert d’arbres.
- source_word: צוֹמֵחַ עֵצִים
  choice: où poussaient des arbres
  rationale: Le participe צוֹמֵחַ exprime la croissance en cours. La proposition relative est idiomatique en français et conserve l’image d’un espace boisé qui produit ou fait croître des arbres.
