  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: fr
  text: Car tous ses jours ne sont que souffrances, et son occupation n’est que contrariété ; même la nuit, son cœur ne se repose pas[a]. Cela aussi est une vapeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son cœur ne se couche pas ». L’image hébraïque exprime une agitation intérieure qui se prolonge pendant la nuit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vanité » ou « souffle ». Le mot hébreu הֶבֶל évoque ce qui est fugitif et insaisissable, comme une vapeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la réflexion précédente et marque naturellement le lien causal en français.
- source_word: כָל יָמָיו
  choice: tous ses jours
  rationale: Conserve l’expression temporelle concrète de l’hébreu tout en restant naturelle en français.
- source_word: מַכְאֹבִים
  choice: ne sont que souffrances
  rationale: Le nom pluriel désigne douleurs et peines; « souffrances » garde cette portée générale, tandis que la tournure française exprime naturellement l’identification prédicative.
- source_word: וָכַעַס
  choice: n’est que contrariété
  rationale: Dans ce contexte, le terme évoque l’irritation, le dépit et le tourment intérieur plutôt qu’une simple colère.
- source_word: עִנְיָנוֹ
  choice: son occupation
  rationale: Rend la tâche ou l’activité qui accapare l’être humain, avec une portée plus large que le seul travail rémunéré.
- source_word: גַּם בַּלַּיְלָה
  choice: même la nuit
  rationale: Restitue la valeur additive et emphatique de גַּם dans une formulation française idiomatique.
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: son cœur ne se repose pas
  rationale: Rend clairement l’agitation intérieure nocturne; la note conserve l’image hébraïque littérale du cœur qui ne se couche pas.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Préserve l’anthropologie imagée de l’hébreu, où le cœur est le siège de la pensée et de la vie intérieure.
- source_word: גַּם זֶה
  choice: Cela aussi
  rationale: Reproduit simplement la formule additive récurrente de l’Ecclésiaste.
- source_word: הֶבֶל
  choice: vapeur
  rationale: Préserve l’image directrice de ce qui est fugitif, insaisissable et inconsistant, sans réduire le mot à une seule conclusion abstraite comme « absurdité » ou « vanité ».
theological_decisions:
- issue: Portée de הֶבֶל
  choice: vapeur
  alternative: vanité, souffle ou absurdité
  rationale: Le mot est laissé sous forme d’image afin de préserver sa polysémie et la tension théologique du livre, plutôt que de trancher entre caractère éphémère, inconsistance et futilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images structurantes de l’hébreu, tout en explicitant dans une note l’expression littérale moins naturelle concernant le cœur.
