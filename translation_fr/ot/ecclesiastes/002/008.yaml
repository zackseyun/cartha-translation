  text: כָּנַ֤סְתִּי לִ/י֙ גַּם כֶּ֣סֶף וְ/זָהָ֔ב וּ/סְגֻלַּ֥ת מְלָכִ֖ים וְ/הַ/מְּדִינ֑וֹת עָשִׂ֨יתִי לִ֜/י שָׁרִ֣ים וְ/שָׁר֗וֹת וְ/תַעֲנוּגֹ֛ת בְּנֵ֥י הָ/אָדָ֖ם שִׁדָּ֥ה וְ/שִׁדּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: fr
  text: 'J’ai aussi amassé pour moi de l’argent et de l’or, ainsi que le trésor des rois et des provinces. Je me suis procuré des chanteurs et des chanteuses, et les délices des êtres humains[a] : une concubine et des concubines[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les délices des fils de l’homme » ou « des fils d’Adam ».'
    reason: La note préserve la forme concrète et grammaticalement masculine de l’expression hébraïque derrière sa traduction générique naturelle.
  - marker: b
    text: 'Le sens des mots hébreux traduits par « une concubine et des concubines » est incertain. On a aussi proposé : « une maîtresse et des maîtresses », « des échansons et des échansonnes » ou, plus généralement, « toutes sortes de raffinements ».'
    reason: Le terme hébreu est très rare et son interprétation fait l’objet d’un désaccord lexical important.
lexical_decisions:
- source_word: כָּנַסְתִּי לִי
  choice: J’ai aussi amassé pour moi
  rationale: Le verbe exprime l’action de rassembler ou d’accumuler. « Amassé » convient au contexte d’une accumulation de richesses, tandis que « pour moi » conserve l’insistance du datif hébreu sur l’acquisition personnelle.
- source_word: כֶּסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: Équivalents français courants des deux métaux précieux envisagés comme richesses.
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: les trésors des rois et des provinces
  rationale: סְגֻלָּה désigne un bien précieux ou un trésor, et מְדִינוֹת des territoires administratifs, d’où « provinces » plutôt qu’un terme abstrait comme « États ».
- source_word: עָשִׂיתִי לִי
  choice: Je me suis procuré
  rationale: Bien que le verbe signifie fondamentalement « faire », il prend ici, dans une liste d’acquisitions, le sens contextuel de se procurer ou de s’assurer quelque chose.
- source_word: שָׁרִים וְשָׁרוֹת
  choice: des chanteurs et des chanteuses
  rationale: Les formes masculine et féminine désignent explicitement des interprètes des deux sexes; la formulation française reproduit cette distinction.
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: les délices des êtres humains
  rationale: תַעֲנוּגֹת évoque les plaisirs raffinés ou les délices. La formulation française exprime naturellement la portée générique de בְּנֵי הָאָדָם, tandis qu’une note conserve sa forme littérale.
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: une concubine, et même des concubines
  rationale: L’expression, très rare et de sens incertain, est traditionnellement comprise comme une référence aux femmes d’un harem. « Et même » rend naturellement la progression du singulier au pluriel sans masquer l’incertitude, signalée en note.
theological_decisions:
- issue: Portée de בְּנֵי הָאָדָם
  choice: les êtres humains
  alternative: les fils de l’homme / les fils d’Adam
  rationale: L’expression hébraïque est générique dans ce contexte. Une traduction inclusive et idiomatique évite en français une possible confusion avec le titre « Fils de l’homme », tandis que la note indique la forme littérale et maintient la transparence envers le texte source.
- issue: Interprétation de שִׁדָּה וְשִׁדּוֹת
  choice: une concubine, et même des concubines
  alternative: une maîtresse et des maîtresses ; des échansons et des échansonnes ; toutes sortes de raffinements
  rationale: Le contexte des plaisirs royaux rend plausible l’interprétation traditionnelle liée au harem, mais le mot demeure obscur. Les principales autres lectures sont donc données en note plutôt que l’incertitude soit résolue silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme cumulatif de l’hébreu est conservé, avec des formulations idiomatiques. « Délices » maintient le registre soutenu du passage sans devenir archaïque; « êtres humains » exprime naturellement le sens générique.
