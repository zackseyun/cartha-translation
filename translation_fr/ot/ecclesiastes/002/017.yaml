source:
  edition: WLC
  text: וְ/שָׂנֵ֨אתִי֙ אֶת הַ֣/חַיִּ֔ים כִּ֣י רַ֤ע עָלַ/י֙ הַֽ/מַּעֲשֶׂ֔ה שֶׁ/נַּעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּֽי הַ/כֹּ֥ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: fr
  text: 'J’ai donc détesté la vie, car l’activité qui s’accomplit sous le soleil m’était pénible : tout est vapeur[a] et poursuite du vent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vanité » ou « souffle » ; le mot hébreu hével évoque quelque chose de fugitif, d’inconsistant ou d’insaisissable.
    reason: lexical_alternative
  - marker: b
    text: Ou « effort pour saisir le vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: Alors, j’ai détesté
  rationale: Le qal accompli à la première personne exprime la réaction arrêtée de l’orateur. « Alors » rend la progression du discours portée par la conjonction sans en faire une simple addition.
- source_word: הַחַיִּים
  choice: la vie
  rationale: Bien que le nom hébreu soit morphologiquement pluriel, il désigne idiomatiquement la vie.
- source_word: רַע עָלַי
  choice: m’était pénible
  rationale: La tournure signifie littéralement que l’activité était mauvaise pour ou pesait sur l’orateur. « M’était pénible » restitue naturellement cette expérience accablante sans réduire רַע à un jugement moral abstrait.
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: l’activité qui se fait
  rationale: Le nom et la forme passive renvoient collectivement à ce qui s’accomplit. Le présent exprime ici le caractère général et continu de l’activité humaine.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression caractéristique de l’Ecclésiaste pour la sphère de l’existence terrestre, rendue de façon exacte et familière.
- source_word: הַכֹּל
  choice: tout
  rationale: Le pronom français restitue avec concision la portée globale de l’expression hébraïque.
- source_word: הֶבֶל
  choice: vapeur
  rationale: Le terme désigne concrètement un souffle ou une vapeur et évoque, dans l’Ecclésiaste, ce qui est fugitif, inconsistant ou insaisissable. « Vapeur » conserve l’image plutôt que de la réduire à la seule idée de futilité.
- source_word: וּרְעוּת רוּחַ
  choice: et poursuite du vent
  rationale: Cette expression difficile présente l’image d’un effort dirigé vers le vent, donc vers ce qui ne peut être saisi. « Poursuite du vent » est actuelle, vive et laisse subsister l’image.
theological_decisions:
- issue: Portée de הֶבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: vanité, souffle, absurdité, futilité
  rationale: « Vapeur » préserve la métaphore concrète et sa pluralité de connotations — brièveté, inconsistance et caractère insaisissable — sans imposer une interprétation morale ou philosophique unique.
- issue: Sens de רְעוּת רוּחַ
  choice: poursuite du vent
  alternative: effort pour saisir le vent ; pâture du vent
  rationale: L’étymologie et la nuance précise de רְעוּת sont discutées. Le texte principal retient la lecture idiomatique la plus probable, tandis que la note signale une autre formulation possible sans résoudre excessivement l’image.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation met en relief la conclusion explicative. Les marqueurs de notes sont placés après les expressions auxquelles les variantes se rapportent.
