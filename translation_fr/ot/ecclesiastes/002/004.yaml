  yaml_path: translation/ot/ecclesiastes/002/004.yaml
  text: 'I made my works great: I built houses for myself[a]; I planted vineyards for myself.'
translation:
  language: fr
  text: 'J’ai donné une grande ampleur à mes travaux[a] : je me suis construit des maisons et j’ai planté des vignobles pour moi-même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai rendu grandes mes œuvres » ; autres traductions possibles : « J’ai développé mes projets » ou « J’ai multiplié mes entreprises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדַּלְתִּי מַעֲשָׂי
  choice: J’ai entrepris de grands travaux
  rationale: Cette formulation française naturelle exprime l’ampleur donnée aux activités du locuteur et introduit bien les constructions et plantations qui suivent. La note conserve la tournure causative plus littérale et les autres nuances possibles.
- source_word: בָּנִיתִי
  choice: je me suis construit
  rationale: Rend simplement l’action de bâtir tout en intégrant le premier לִי, qui indique que les maisons sont destinées au locuteur lui-même.
- source_word: בָּתִּים
  choice: des maisons
  rationale: Le terme hébreu désigne normalement des maisons; le contexte royal ne suffit pas à imposer « palais ».
- source_word: נָטַעְתִּי
  choice: j’ai planté
  rationale: Équivalent direct et courant du verbe hébreu dans un contexte agricole.
- source_word: לִי
  choice: pour moi-même
  rationale: La formulation explicite la destination personnelle ou l’intérêt propre marqué par la préposition avec suffixe. Dans la première proposition, cette nuance est naturellement portée par la construction pronominale « je me suis construit ».
- source_word: כְּרָמִים
  choice: des vignobles
  rationale: Équivalent français usuel, adapté au contexte agricole et aux vastes réalisations décrites.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le parallélisme des deux réalisations concrètes est conservé, ainsi que l’idée qu’elles sont faites au bénéfice du locuteur.
