source:
  edition: WLC
  text: תַּ֣רְתִּי בְ/לִבִּ֔/י לִ/מְשׁ֥וֹךְ בַּ/יַּ֖יִן אֶת בְּשָׂרִ֑/י וְ/לִבִּ֞/י נֹהֵ֤ג בַּֽ/חָכְמָה֙ וְ/לֶ/אֱחֹ֣ז בְּ/סִכְל֔וּת עַ֣ד אֲשֶׁר אֶרְאֶ֗ה אֵי זֶ֨ה ט֜וֹב לִ/בְנֵ֤י הָ/אָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַ/שָּׁמַ֔יִם מִסְפַּ֖ר יְמֵ֥י חַיֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: fr
  text: J’ai cherché en mon cœur à entraîner ma chair par le vin[a], alors que mon cœur me guidait avec sagesse, et à saisir la folie, jusqu’à ce que je puisse voir ce qu’il est bon pour les êtres humains[b] de faire sous les cieux durant le nombre de jours de leur vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « entraîner ma chair par le vin » est difficile. Elle peut évoquer le fait d’éprouver les plaisirs corporels liés au vin tout en conservant une conduite réfléchie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils de l’être humain » ou « les fils de l’homme » ; cette expression hébraïque désigne ici l’ensemble des humains.'
    reason: source_form
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: J’ai cherché en mon cœur
  rationale: Le verbe exprime une exploration délibérée et intérieure. Cette formulation conserve aussi le « cœur » hébreu comme siège de la réflexion et de la volonté.
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי
  choice: à entraîner ma chair par le vin
  rationale: משׁך signifie fondamentalement tirer ou entraîner. La formulation française maintient l’image inhabituelle et l’ambiguïté du passage sans réduire la chair au seul « corps » ni préciser à tort s’il s’agit de réjouir ou de satisfaire.
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: alors que mon cœur me guidait avec sagesse
  rationale: נהג évoque l’action de conduire ou de guider. L’objet « me » est implicite mais naturellement requis en français; la proposition indique que l’expérience reste accompagnée d’un discernement sage.
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: et à saisir la folie
  rationale: אחז désigne le fait de saisir ou de tenir fermement, tandis que סכלות est le terme thématique opposé à la sagesse dans l’Ecclésiaste.
- source_word: לִבְנֵי הָאָדָם
  choice: pour les êtres humains
  rationale: L’expression hébraïque, littéralement « les fils de l’être humain/de l’homme », désigne ici collectivement l’humanité. Le français inclusif courant en communique clairement la portée générique.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: sous les cieux
  rationale: Le pluriel français conserve le pluriel morphologique de שׁמים et convient au registre sapiential.
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: pendant le nombre de jours que dure leur vie
  rationale: Cette traduction conserve explicitement l’idée de « nombre » et donc de durée comptée, sans introduire la notion de « peu de jours », qui n’est pas formulée dans l’hébreu.
theological_decisions:
- issue: Portée générique de בְּנֵי הָאָדָם
  choice: les êtres humains
  alternative: les fils de l’homme
  rationale: Dans ce contexte, l’expression masculine hébraïque est générique. « Les êtres humains » transmet cette référence universelle sans faire entendre en français un groupe exclusivement masculin ni une possible allusion christologique étrangère au contexte.
- issue: Rapport entre l’usage du vin et la sagesse
  choice: Maintien simultané de l’expérience du vin et de la conduite sage
  alternative: Présenter le locuteur comme s’abandonnant sans réserve à l’ivresse
  rationale: Le texte juxtapose délibérément l’action exercée sur la chair par le vin et le cœur qui guide avec sagesse. La traduction conserve cette tension sans trancher le degré de consommation ou de maîtrise.
translation_notes:
  register: Français international moderne, digne et légèrement littéraire. Les images caractéristiques de l’hébreu (« en mon cœur », « ma chair », « sous les cieux ») sont conservées, tandis que la syntaxe reste intelligible pour un lectorat général.
