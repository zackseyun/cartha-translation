  text: עָשִׂ֣יתִי לִ֔/י גַּנּ֖וֹת וּ/פַרְדֵּסִ֑ים וְ/נָטַ֥עְתִּי בָ/הֶ֖ם עֵ֥ץ כָּל פֶּֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/005.yaml
  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
translation:
  language: fr
  text: Je me suis fait des jardins et des parcs[a], et j’y ai planté toutes sortes d’arbres fruitiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vergers ». Le mot hébreu désigne des espaces cultivés et clos, tels que des parcs d’agrément ou des vergers.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Je me suis fait
  rationale: Le verbe עשה signifie ici « faire, aménager », tandis que לִי exprime le bénéfice personnel. La tournure pronominale française rend naturellement cette nuance sans alourdir la phrase.
- source_word: גַּנּוֹת
  choice: des jardins
  rationale: גַּנּוֹת est le pluriel du terme courant désignant des jardins et reste distinct du mot plus spécialisé qui suit.
- source_word: פַרְדֵּסִים
  choice: des parcs
  rationale: Le terme désigne des espaces cultivés et clos, pouvant être des parcs d’agrément ou des vergers. « Parcs » préserve ici son sens plus large, tandis que « vergers » est signalé en note.
- source_word: וְנָטַעְתִּי בָהֶם
  choice: et j’y ai planté
  rationale: Le pronom adverbial « y » reprend naturellement en français les jardins et les parcs et rend la préposition ב avec son suffixe pluriel.
- source_word: עֵץ כָּל פֶּרִי
  choice: toutes sortes d’arbres fruitiers
  rationale: Littéralement « arbre de tout fruit » ; cette formulation française idiomatique conserve la diversité exprimée par כָּל dans ce contexte horticole.
