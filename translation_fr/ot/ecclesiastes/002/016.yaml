source:
  edition: WLC
  text: כִּי֩ אֵ֨ין זִכְר֧וֹן לֶ/חָכָ֛ם עִֽם הַ/כְּסִ֖יל לְ/עוֹלָ֑ם בְּ/שֶׁ/כְּבָ֞ר הַ/יָּמִ֤ים הַ/בָּאִים֙ הַ/כֹּ֣ל נִשְׁכָּ֔ח וְ/אֵ֛יךְ יָמ֥וּת הֶ/חָכָ֖ם עִֽם הַ/כְּסִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: fr
  text: 'Car le souvenir du sage ne dure pas plus que celui de l’insensé[a] : dans les jours à venir, tout aura déjà été oublié. Et dire que le sage meurt comme l’insensé ![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Car il n’y a pas, pour toujours, de souvenir du sage avec l’insensé. » La formulation du texte courant exprime en français naturel la disparition également durable de leur souvenir.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut se rendre plus littéralement : « Et comment le sage meurt avec l’insensé ! » La tournure est probablement exclamative et déplore que le sage connaisse la mort tout comme l’insensé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן
  choice: le souvenir
  rationale: Le nom désigne le fait de garder quelqu’un en mémoire, voire sa commémoration. « Le souvenir » convient au thème existentiel du passage et reste naturel en français.
- source_word: לֶחָכָם / הֶחָכָם
  choice: du sage / le sage
  rationale: L’adjectif substantivé masculin singulier est rendu par la forme française naturelle « le sage », qui conserve le singulier représentatif du texte.
- source_word: עִם הַכְּסִיל
  choice: pas plus que celui de l’insensé / comme l’insensé
  rationale: La préposition signifie littéralement « avec », mais elle met ici en parallèle le sage et l’insensé, d’abord quant à leur souvenir, puis quant à leur mort commune. La formulation française explicite cette comparaison sans effacer l’idée d’un sort partagé.
- source_word: לְעוֹלָם
  choice: ne dure pas
  rationale: Dans ce contexte, l’expression porte sur la permanence du souvenir. « Ne dure pas » exprime naturellement l’absence de souvenir durable, sans suggérer une affirmation métaphysique étrangère au propos.
- source_word: בְּשֶׁכְּבָר
  choice: dans les jours à venir… déjà
  rationale: La construction condensée relie l’affirmation précédente à la perspective future. Le deux-points marque ce lien, tandis que « déjà » conserve la valeur adverbiale de כְּבָר.
- source_word: הַיָּמִים הַבָּאִים
  choice: les jours à venir
  rationale: Cette expression française courante reproduit fidèlement l’orientation vers l’avenir du participe hébreu.
- source_word: הַכֹּל נִשְׁכָּח
  choice: tout aura déjà été oublié
  rationale: Le nifal a un sens passif, « être oublié ». Avec « les jours à venir » et כְּבָר, le futur antérieur rend clairement l’idée qu’à ce moment futur tout se trouvera déjà oublié.
- source_word: וְאֵיךְ
  choice: Et dire que
  rationale: Dans le contexte, אֵיךְ introduit vraisemblablement une exclamation douloureuse plutôt qu’une demande d’information. « Et dire que » restitue en français cette réaction de consternation.
- source_word: יָמוּת
  choice: meurt
  rationale: L’inaccompli exprime ici la réalité générale de la mortalité. Le présent français convient à cette vérité générale.
theological_decisions:
- issue: Portée de la comparaison entre le sage et l’insensé
  choice: La traduction limite explicitement l’égalité au souvenir qui disparaît et à la mort commune.
  alternative: Formuler une égalité générale entre le sage et l’insensé.
  rationale: Le verset affirme leur sort commun sous ces deux rapports précis, sans nier les distinctions établies ailleurs entre sagesse et folie.
- issue: Valeur interrogative ou exclamative de וְאֵיךְ
  choice: 'Lecture exclamative : « Et dire que… ! »'
  alternative: 'Lecture interrogative plus littérale : « Et comment le sage meurt-il avec l’insensé ? »'
  rationale: Le contexte de lamentation et la tournure hébraïque favorisent l’exclamation, mais la note signale la forme plus littérale et l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide pour une lecture publique, tandis que les notes conservent les formulations hébraïques plus littérales et l’ambiguïté de la dernière exclamation.
