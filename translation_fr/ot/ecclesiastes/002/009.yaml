  text: וְ/גָדַ֣לְתִּי וְ/הוֹסַ֔פְתִּי מִ/כֹּ֛ל שֶׁ/הָיָ֥ה לְ/פָנַ֖/י בִּ/ירוּשָׁלִָ֑ם אַ֥ף חָכְמָתִ֖/י עָ֥מְדָה לִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/009.yaml
  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
translation:
  language: fr
  text: Je devins grand et surpassai tous ceux qui m’avaient précédé à Jérusalem[a]. Ma sagesse aussi demeura avec moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et augmentai plus que tout ce qui avait été avant moi à Jérusalem ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ma sagesse se tint auprès de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי
  choice: Je devins grand
  rationale: Le qal de גדל exprime ici l’accès à la grandeur, au rang ou à l’importance. Cette formulation conserve le sens personnel et résultatif sans préciser indûment la nature de cette grandeur.
- source_word: וְהוֹסַפְתִּי מִכֹּל
  choice: et surpassai tous
  rationale: Le hiphil de יסף signifie littéralement « ajouter, augmenter »; avec la comparaison introduite par מִן, il indique idiomatiquement que le locuteur dépasse les autres. « Surpassai » rend clairement cette force comparative en français.
- source_word: שֶׁהָיָה לְפָנַי
  choice: ceux qui m’avaient précédé
  rationale: Dans ce contexte de grandeur personnelle à Jérusalem, l’expression vise probablement des prédécesseurs. La note conserve toutefois la portée formellement plus large de l’hébreu.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: Rendu locatif français naturel du nom de lieu.
- source_word: אַף
  choice: elle aussi
  rationale: אַף ajoute ici une autre affirmation. La tournure détachée « elle aussi » met naturellement en relief la persistance de la sagesse.
- source_word: חָכְמָתִי
  choice: Ma sagesse
  rationale: Traduction directe du nom avec suffixe possessif de première personne.
- source_word: עָמְדָה לִּי
  choice: me resta
  rationale: Littéralement, la sagesse « se tint pour moi »; dans ce contexte, l’expression indique qu’elle demeura avec le locuteur ou à sa disposition. « Me resta » est naturel et concis.
theological_decisions:
- issue: Portée de כֹּל שֶׁהָיָה לְפָנַי
  choice: Le texte principal comprend l’expression comme une référence aux prédécesseurs du locuteur.
  alternative: « tout ce qui avait été avant moi »
  rationale: Le contexte favorise une comparaison avec des personnes, mais la construction hébraïque est grammaticalement plus large; la note préserve cette ambiguïté sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit rétrospectif et maintient une formulation concise. Les notes signalent la largeur possible de la comparaison et l’image littérale du verbe עמד.
