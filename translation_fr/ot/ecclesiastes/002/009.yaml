  source_fidelity: Le sens comparatif de וְגָדַלְתִּי וְהוֹסַפְתִּי מִכֹּל est bien rendu par « devins grand et surpassai tous ». « Ceux qui m’avaient précédé » est une interprétation contextuellement plausible de כֹּל שֶׁהָיָה לְפָנַי, et la note en conserve correctement la possibilité plus large. La seconde proposition exprime adéquatement la permanence de la sagesse (אַף חָכְמָתִי עָמְדָה לִּי).
  naturalness: « Ma sagesse, elle aussi, me resta » est compréhensible, mais « me rester » suggère facilement ce qui demeure après une perte ou ce qui échoit à quelqu’un. « Ma sagesse aussi demeura avec moi » est plus naturel, plus clair dans le contexte, et conserve la sobriété du texte.
  terminology: « Jérusalem », « sagesse » et le registre rétrospectif au passé simple sont appropriés. « Devins grand » conserve utilement l’ouverture de גדל sans réduire la grandeur à la richesse, au pouvoir ou à la renommée. La note sur עָמְדָה לִּי doit fournir une formulation française complète et idiomatique de l’image littérale.
