source:
  edition: WLC
  text: הֶֽ/חָכָם֙ עֵינָ֣י/ו בְּ/רֹאשׁ֔/וֹ וְ/הַ/כְּסִ֖יל בַּ/חֹ֣שֶׁךְ הוֹלֵ֑ךְ וְ/יָדַ֣עְתִּי גַם אָ֔נִי שֶׁ/מִּקְרֶ֥ה אֶחָ֖ד יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: fr
  text: Le sage a les yeux dans la tête, mais l’insensé marche dans les ténèbres. Pourtant, moi aussi, j’ai compris qu’un même sort[a] les atteint tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un même événement ». Le mot hébreu מִקְרֶה désigne ce qui arrive à quelqu’un et peut, selon le contexte, se traduire par « événement », « sort » ou « destinée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: Le sage
  rationale: Le substantif désigne une personne sage et porte ici une forme masculine singulière, conservée dans le contraste représentatif avec « l’insensé ».
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: a les yeux dans la tête
  rationale: Cette formulation garde l’image concrète de l’hébreu, qui évoque la lucidité du sage sans expliciter davantage la métaphore.
- source_word: וְהַכְּסִיל
  choice: mais l’insensé
  rationale: Dans ce parallélisme antithétique, « mais » rend naturellement la valeur contrastive de la conjonction ו.
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: marche dans les ténèbres
  rationale: La traduction préserve l’image du déplacement dans l’obscurité sans décider si celle-ci est morale, intellectuelle ou circonstancielle.
- source_word: וְיָדַעְתִּי גַם אֲנִי
  choice: Pourtant, moi aussi, j’ai compris
  rationale: '« Pourtant » marque le retournement argumentatif : malgré l’avantage du sage, l’orateur reconnaît une issue commune. « Moi aussi » conserve l’insistance de גַם אֲנִי.'
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: qu’un même sort
  rationale: מִקְרֶה désigne ce qui arrive à quelqu’un. Dans ce contexte, « un même sort » exprime avec naturel l’issue commune tout en laissant ouverte sa nature précise.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: les atteint tous
  rationale: Le verbe קרה signifie arriver ou échoir. Avec « sort » comme sujet, « les atteint tous » donne en français une formulation naturelle et maintient la portée universelle de כֻּלָּם.
