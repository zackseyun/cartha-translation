  yaml_path: translation/ot/ecclesiastes/002/013.yaml
  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: fr
  text: Et j’ai vu, moi, que la sagesse a un avantage sur la folie[a], comme la lumière a un avantage sur les ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « profit » ou « gain ». Le terme hébreu peut désigner un surplus, un bénéfice ou un avantage; ici, il exprime la supériorité de la sagesse sur la folie.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: Et moi, j’ai constaté
  rationale: Le verbe ראה exprime ici une observation issue de l’expérience; « constaté » est naturel en français. Le pronom indépendant אָנִי, redondant avec la forme verbale, est rendu par « moi » pour conserver son emphase sans lourdeur.
- source_word: שֶׁיֵּשׁ יִתְרוֹן לַחָכְמָה
  choice: que la sagesse a un avantage
  rationale: La construction existentielle יֵשׁ avec ל est rendue idiomatiquement par « avoir ». יִתְרוֹן désigne ici une supériorité ou un bénéfice comparatif.
- source_word: מִן הַסִּכְלוּת
  choice: sur la folie
  rationale: Après יִתְרוֹן, מִן marque la comparaison; « sur » exprime clairement l’avantage de la sagesse. סִכְלוּת est rendu par le terme biblique courant « folie ».
- source_word: כִּיתְרוֹן הָאוֹר מִן הַחֹשֶׁךְ
  choice: comme la lumière a un avantage sur les ténèbres
  rationale: La formulation répétée conserve le parallélisme comparatif de l’hébreu. Le pluriel français « les ténèbres » est l’équivalent idiomatique du singulier collectif hébreu חֹשֶׁךְ.
theological_decisions:
- issue: Nuance de יִתְרוֹן dans l’Ecclésiaste
  choice: avantage
  alternative: profit, gain, supériorité
  rationale: Dans cette analogie entre sagesse et lumière, « avantage » préserve la notion de bénéfice ou de surplus sans imposer un sens exclusivement économique.
- issue: Portée de l’image lumière-ténèbres
  choice: comparaison concrète sans explicitation théologique ajoutée
  alternative: interprétation symbolique morale ou doctrinale explicite
  rationale: Le texte affirme la supériorité comparative de la sagesse sur la folie; la traduction ne précise pas au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Et moi » maintient l’emphase du pronom hébreu; « j’ai constaté » rend naturellement l’observation réfléchie du locuteur. Le parallélisme des deux propositions est conservé.
