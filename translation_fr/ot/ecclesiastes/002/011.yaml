language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: fr
  text: 'Je me suis alors tourné vers toutes les œuvres que mes mains avaient réalisées et vers la peine que je m’étais donnée pour les accomplir. Et voici : tout était vapeur[a] et poursuite du vent[b] ; il n’y avait aucun avantage[c] sous le soleil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vanité » ou « souffle ». Le mot hébreu hévèl désigne souvent ce qui est fugace, inconsistant ou frustrant parce qu’on ne peut le saisir.
    reason: lexical_alternative
  - marker: b
    text: Ou « effort pour saisir le vent ». L’expression hébraïque dépeint une poursuite ou un effort futile.
    reason: lexical_alternative
  - marker: c
    text: Ou « profit » ou « gain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲנִי
  choice: Je me suis alors tourné
  rationale: Conserve l’image concrète du verbe « se tourner » tout en exprimant naturellement le passage à une évaluation rétrospective. Le pronom français marque déjà le sujet ; ajouter « moi » alourdirait inutilement la phrase.
- source_word: בְּכָל מַעֲשַׂי
  choice: vers toutes les œuvres
  rationale: « Œuvres » convient aux réalisations et projets décrits dans le contexte et maintient le lien avec l’activité concrète des mains.
- source_word: שֶׁעָשׂוּ יָדַי
  choice: que mes mains avaient réalisées
  rationale: Préserve l’expression corporelle qui souligne l’action personnelle, avec un verbe français naturel pour des ouvrages accomplis.
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת
  choice: et vers la peine que je m’étais donnée pour les accomplir
  rationale: Rend la pénibilité de עָמָל et reprend implicitement les œuvres comme objet de l’infinitif. La répétition étymologique hébraïque ne peut être reproduite littéralement sans produire un français artificiel.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la force de présentation vive qui introduit le constat du narrateur, dans un registre digne et intelligible.
- source_word: הַכֹּל הֶבֶל
  choice: tout était vapeur
  rationale: '« Vapeur » garde l’image concrète et polysémique de הֶבֶל : ce qui est fugace, inconsistant et impossible à saisir. Ce choix évite que « vanité », en français contemporain, soit compris principalement comme amour-propre, et évite aussi l’interprétation totalisante de « dépourvu de sens ».'
- source_word: וּרְעוּת רוּחַ
  choice: et poursuite du vent
  rationale: Rend clairement l’image d’une entreprise futile visant quelque chose d’insaisissable, sans trancher au-delà du nécessaire les difficultés étymologiques de רְעוּת.
- source_word: וְאֵין יִתְרוֹן
  choice: il n’y avait aucun avantage
  rationale: « Avantage » exprime le surplus ou bénéfice durable recherché dans l’Ecclésiaste, sans réduire le terme au seul profit financier.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Formule programmatique de l’Ecclésiaste, naturelle en français et fidèle à l’image hébraïque.
theological_decisions:
- issue: Sens de הֶבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: vanité ; souffle ; absurdité
  rationale: Le mot clé évoque littéralement une vapeur ou un souffle et, selon le contexte, la fugacité, l’inconsistance ou la frustration. « Vapeur » préserve cette tension métaphorique sans imposer une conclusion nihiliste ni le sens moderne courant de « vanité ».
- issue: Portée de יִתְרוֹן
  choice: avantage
  alternative: profit ; gain
  rationale: Le terme désigne ce qui reste en surplus ou constitue un bénéfice. « Avantage » laisse ouverte sa portée économique et existentielle dans le raisonnement du livre.
translation_notes:
  register: Français international moderne, littéraire sans archaïsme marqué. La formulation conserve les images structurantes de l’hébreu (« mes mains », « vapeur », « vent », « sous le soleil ») tout en évitant le calque peu naturel de la répétition עָמָל / עָמַל.
