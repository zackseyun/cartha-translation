  text: לִ/שְׂח֖וֹק אָמַ֣רְתִּי מְהוֹלָ֑ל וּ/לְ/שִׂמְחָ֖ה מַה זֹּ֥ה עֹשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/002.yaml
  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: fr
  text: 'J’ai dit au sujet du rire : « C’est de la folie », et au sujet de la joie : « À quoi sert-elle ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: du rire
  rationale: שְׂחוֹק désigne le rire ou l’amusement. Avec אמר, ל introduit ici ce au sujet de quoi le constat est formulé ; « du rire » restitue sobrement cette relation.
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Le qal accompli à la première personne du singulier signifie simplement « j’ai dit ». Le contexte peut suggérer une réflexion intérieure, mais le texte n’ajoute pas explicitement « en moi-même ».
- source_word: מְהוֹלָל
  choice: C’est de la folie
  rationale: Le terme qualifie le rire comme insensé, irrationnel ou déraisonnable. La tournure nominale française est naturelle et conserve la force du jugement.
- source_word: וּלְשִׂמְחָה
  choice: et de la joie
  rationale: שִׂמְחָה peut désigner la joie, l’allégresse ou le plaisir. « Joie » est le sens direct et permet de conserver la distinction avec le « rire » sans réduire le terme au seul plaisir sensoriel.
- source_word: מַה זֹּה עֹשָׂה
  choice: À quoi sert-elle ?
  rationale: 'Littéralement, la question demande : « Qu’est-ce que celle-ci fait ? » Dans ce contexte d’évaluation, l’expression française « À quoi sert-elle ? » rend naturellement la question portant sur l’effet ou la valeur de la joie, le féminin renvoyant clairement à « joie ».'
theological_decisions:
- issue: Portée du jugement sur le rire et la joie
  choice: Conserver les deux questions tranchantes sans préciser qu’elles condamneraient toute forme de rire ou de joie.
  alternative: Expliciter qu’il s’agit seulement d’une recherche hédoniste du plaisir.
  rationale: Le contexte rapporte une mise à l’épreuve du plaisir, mais le verset lui-même formule un jugement volontairement abrupt. Une précision interprétative dans le texte atténuerait sa tension.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme hébreu est conservé par « du rire… et de la joie ». « À quoi sert-elle ? » privilégie une équivalence naturelle tout en gardant la portée évaluative de la question.
