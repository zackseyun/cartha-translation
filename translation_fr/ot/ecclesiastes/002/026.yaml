source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: fr
  text: Car à celui qui est bon à ses yeux[a], Dieu donne sagesse, connaissance et joie ; mais au pécheur, il donne la tâche de recueillir et d’amasser, pour donner à celui qui est bon aux yeux de Dieu. Cela aussi est vanité et poursuite du vent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui lui plaît ». L’hébreu dit littéralement : « qui est bon devant lui ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « effort pour saisir le vent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: à celui
  rationale: Dans ce contexte, אָדָם désigne un individu mis en contraste avec « le pécheur ». « Celui » exprime naturellement cette opposition en français sans faire croire que le propos ne concerne que les hommes.
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: qui est bon à ses yeux
  rationale: La formulation conserve טוב, « bon », et rend naturellement l’idiome littéral « bon devant lui ». Elle laisse perceptible la nuance possible « qui lui plaît », signalée en note.
- source_word: נָתַן
  choice: donne
  rationale: Le présent convient au caractère général et réflexif de l’affirmation en français. Dieu, sujet implicite éclairé par le contexte immédiat et nommé plus loin dans le verset, est explicité une fois pour assurer la clarté.
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: sagesse, connaissance et joie
  rationale: Ces équivalents directs et usuels préservent les trois dons distincts et le thème ecclésiastique de la joie accordée par Dieu.
- source_word: לַחוֹטֶא
  choice: au pécheur
  rationale: Le participe désigne ici une personne caractérisée comme pécheresse, en opposition à celle qui est bonne aux yeux de Dieu.
- source_word: עִנְיָן
  choice: la tâche
  rationale: Le terme désigne une occupation assignée, avec une nuance potentiellement pénible. « Tâche » conserve ce sens sans accentuer indûment l’idée de fardeau.
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: de recueillir et d’amasser
  rationale: Les deux verbes proches soulignent l’accumulation. « Recueillir et amasser » maintient ce parallélisme dans un français naturel.
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: afin que cela revienne à celui qui est bon aux yeux de Dieu
  rationale: Le sens de transfert est rendu idiomatiquement par « revienne à ». La phrase reprend explicitement le critère d’être bon devant Dieu sans préciser le mécanisme du don.
- source_word: הֶבֶל
  choice: vanité
  rationale: « Vanité » conserve le mot-thème traditionnel de l’Ecclésiaste et ses nuances de caractère fugitif, inconsistant et futile, sans le réduire à la seule absence de sens.
- source_word: רְעוּת רוּחַ
  choice: poursuite du vent
  rationale: Cette expression française claire garde l’image d’un effort impossible et futile. Une autre analyse possible, « effort pour saisir le vent », est indiquée en note.
theological_decisions:
- issue: Sujet implicite de נָתַן
  choice: Dieu est le donateur implicite dans les deux propositions
  alternative: Laisser le sujet sous la seule forme pronominale ou lui donner une valeur impersonnelle
  rationale: Le contexte immédiat évoque ce qui vient de la main de Dieu (2.24), et Dieu est expressément nommé dans la seconde moitié du verset. Son nom est explicité une fois en français pour rendre le référent clair sans changer l’agent du texte.
- issue: Sens de טוב לפני האלהים
  choice: bon aux yeux de Dieu
  alternative: qui plaît à Dieu
  rationale: L’hébreu peut exprimer ce qui plaît à Dieu, mais la traduction principale conserve le terme « bon » et ne réduit pas l’évaluation morale ou favorable à la seule notion de plaisir.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant les répétitions conceptuelles, le contraste entre le juste et le pécheur, ainsi que les images caractéristiques de l’Ecclésiaste. Tous les appels de note figurent dans le texte principal.
