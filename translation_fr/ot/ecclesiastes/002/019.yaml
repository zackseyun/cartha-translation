  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: fr
  text: Et qui sait s’il sera sage ou insensé ? Pourtant, il aura autorité sur tout mon labeur, pour lequel j’ai peiné et agi avec sagesse sous le soleil. Cela aussi est vanité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vapeur », pour souligner le caractère éphémère ; le sens peut aussi être « futilité ». Dans l’Ecclésiaste, le mot hébreu hével couvre plusieurs nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: Et qui sait
  rationale: Conserve l’enchaînement hébreu et exprime naturellement l’incertitude dans le contexte.
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: s’il sera sage ou insensé
  rationale: Rend la question indirecte et maintient l’opposition entre sagesse et folie sans substantiver inutilement les termes.
- source_word: וְיִשְׁלַט
  choice: Pourtant, il aura autorité sur
  rationale: 'Exprime l’exercice du pouvoir ou du contrôle. « Pourtant » fait ressortir le contraste contextuel : quelle que soit sa conduite, le successeur disposera du résultat du travail.'
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי וְשֶׁחָכַמְתִּי
  choice: sur tout le travail que j’ai accompli avec peine et sagesse
  rationale: Formulation française naturelle qui conserve l’idée d’un travail pénible et celle d’une sagesse activement mise en œuvre, sans réduire חכם à la simple possession de sagesse.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Conserve la formule caractéristique de l’Ecclésiaste désignant l’existence dans le monde présent.
- source_word: גַּם זֶה הָבֶל
  choice: Cela aussi est vanité
  rationale: « Vanité » maintient le terme thématique traditionnel tout en laissant ouvertes les nuances de caractère éphémère, inconsistant ou futile portées par הֶבֶל.
theological_decisions:
- issue: Sens du terme thématique הֶבֶל dans l’Ecclésiaste
  choice: vanité
  alternative: vapeur ; fugacité ; futilité
  rationale: Le mot hébreu évoque littéralement un souffle ou une vapeur et peut, selon le contexte, suggérer la fugacité, l’inconsistance ou la futilité. « Vanité » préserve l’écho thématique du livre sans imposer la seule idée d’absence de sens ; une note signale l’étendue sémantique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible, tandis que « sous le soleil » et « vanité » assurent la continuité des motifs propres à l’Ecclésiaste.
