  text: אֵֽין ט֤וֹב בָּ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/הֶרְאָ֧ה אֶת נַפְשׁ֛/וֹ ט֖וֹב בַּ/עֲמָל֑/וֹ גַּם זֹה֙ רָאִ֣יתִי אָ֔נִי כִּ֛י מִ/יַּ֥ד הָ/אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
translation:
  language: fr
  text: Il n’y a rien de mieux pour l’être humain que de manger, de boire et de goûter au bonheur dans son travail[a][b]. J’ai vu que cela aussi vient de la main de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et de faire voir le bien à son âme dans son travail », c’est-à-dire d’y faire l’expérience du bien ou d’en jouir.'
    reason: lexical_alternative
  - marker: b
    text: 'La clause initiale peut aussi être comprise dans un sens plus littéral et non comparatif : « Il n’y a pas de bien pour l’être humain… » La suite mentionne alors le fait de manger, de boire et de voir le bien dans son travail. Le contexte favorise toutefois le sens comparatif retenu dans le texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב בָּאָדָם
  choice: Il n’y a rien de mieux pour l’être humain
  rationale: La tournure hébraïque est difficile, mais le contexte invite à lui donner un sens comparatif. « L’être humain » rend le singulier générique אָדָם en français actuel.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: que de manger, de boire
  rationale: L’infinitif français complète naturellement la tournure comparative tout en conservant les deux actions simples du texte.
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  choice: et de goûter au bonheur
  rationale: L’expression signifie littéralement faire voir le bien à son âme, c’est-à-dire en faire l’expérience ou en jouir. « Goûter au bonheur » restitue cette expérience en français naturel sans la réduire à un simple sentiment de satisfaction.
- source_word: בַּעֲמָלוֹ
  choice: dans son travail
  rationale: « Travail » conserve ici la réalité de l’effort exprimée par עָמָל sans donner à cette affirmation positive une tonalité excessivement pénible.
- source_word: גַּם זֹה רָאִיתִי אָנִי
  choice: J’ai vu que cela aussi
  rationale: Cette formulation française naturelle maintient l’insistance de גַּם, qui rattache cette constatation à ce qui précède.
- source_word: מִיַּד הָאֱלֹהִים
  choice: vient de la main de Dieu
  rationale: 'La métaphore de la main est conservée : elle présente cette capacité de jouir comme venant de Dieu, implicitement comme un don.'
theological_decisions:
- issue: Sens de la proposition initiale אֵין טוֹב בָּאָדָם
  choice: 'Lecture comparative : « Il n’y a rien de mieux pour l’être humain que… »'
  alternative: 'Lecture plus littérale et absolue : « Il n’y a pas de bien pour l’être humain à manger et à boire… »'
  rationale: La lecture comparative s’accorde le mieux avec la suite du verset, où cette jouissance est dite venir de la main de Dieu, ainsi qu’avec les refrains analogues de Qohélet. La note préserve néanmoins l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La formulation évite le calque peu intelligible « faire voir le bien à son âme » dans le corps du texte, tout en le signalant en note. « L’être humain » exprime clairement la valeur générique de אָדָם.
