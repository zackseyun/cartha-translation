  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: fr
  text: Car il y a un homme qui peine avec sagesse, connaissance et savoir-faire, mais il devra donner sa part à un homme qui n’a pas peiné pour cela[a]. Cela aussi est vapeur[b] et un grand mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « qui n’a pas peiné en cela »; le pronom peut renvoyer au travail ou à ce qui en résulte.
    reason: ambiguïté_référentielle
  - marker: b
    text: 'Traditionnellement : « vanité ». Le mot hébreu הֶבֶל désigne littéralement une vapeur ou un souffle, image de ce qui est fugace et insaisissable.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la réflexion précédente et assure un enchaînement naturel en français.
- source_word: יֵשׁ אָדָם שֶׁעֲמָלוֹ
  choice: tel homme peine
  rationale: Rend de façon idiomatique le cas individuel introduit par יֵשׁ אָדָם et conserve la valeur pénible de עָמָל.
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: avec sagesse, connaissance et savoir-faire
  rationale: Préserve la série ternaire et distingue la sagesse, la connaissance et la compétence pratique.
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: il devra donner sa part
  rationale: « Devra » exprime l’inéluctabilité contextuelle de l’imparfait hébreu; « sa part » maintient le motif ecclésiastique de la part attribuée à chacun.
- source_word: לְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: à un homme qui n’y a pas peiné
  rationale: Conserve le contraste entre celui qui peine et le bénéficiaire, ainsi que la référence peu explicite du pronom בּוֹ.
- source_word: הֶבֶל
  choice: vapeur
  rationale: Conserve l’image concrète d’un souffle ou d’une vapeur, évoquant ce qui est fugace et insaisissable, sans la réduire à l’orgueil que peut suggérer aujourd’hui « vanité ».
- source_word: רָעָה רַבָּה
  choice: un grand mal
  rationale: Préserve l’amplitude de רָעָה, qui peut évoquer le mal, le malheur ou une situation profondément mauvaise.
theological_decisions:
- issue: Sens du terme thématique הֶבֶל
  choice: vapeur
  alternative: vanité; caractère éphémère; absurdité
  rationale: « Vapeur » maintient la métaphore hébraïque et sa tension entre fragilité, fugacité et caractère insaisissable, sans imposer une seule interprétation abstraite.
- issue: Portée de רָעָה
  choice: un grand mal
  alternative: un grand malheur; une grave injustice
  rationale: Le français « mal » laisse ouverte la dimension existentielle, calamiteuse ou morale de l’évaluation, comme le permet l’hébreu.
- issue: Référence de בּוֹ
  choice: n’y a pas peiné
  alternative: n’a pas peiné pour l’obtenir; n’a pas travaillé à cette œuvre
  rationale: Le pronom hébreu ne précise pas entièrement s’il renvoie au travail, à son produit ou à la part qui en résulte; la formulation retenue préserve cette relative ambiguïté.
translation_notes:
  register: Français international moderne, courant et digne. La structure reste concise et proverbiale; « savoir-faire » exprime naturellement la compétence pratique, tandis que « vapeur » conserve volontairement l’image directrice de l’hébreu.
