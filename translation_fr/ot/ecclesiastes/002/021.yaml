revisions:
- from: Car tel homme peine avec sagesse, connaissance et savoir-faire, mais il devra donner sa part à un homme qui n’y a pas peiné[a]. Cela aussi est vapeur[b] et un grand mal.
  to: Car il y a un homme qui peine avec sagesse, connaissance et savoir-faire, mais il devra donner sa part à un homme qui n’a pas peiné pour cela[a]. Cela aussi est vapeur[b] et un grand mal.
  rationale: La révision rétablit la valeur existentielle de יֵשׁ אָדָם par « il y a un homme » et améliore la lisibilité du pronom français sans lever l’ambiguïté référentielle de בּוֹ, laquelle est expressément conservée dans la note. Les autres choix sont maintenus, car ils rendent fidèlement le lexique et le ton de l’original.
