review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « tel homme » affaiblit l’assertion existentielle de יֵשׁ אָדָם (« il y a un homme / quelqu’un ») et sonne moins naturel ici. « Qui n’y a pas peiné » conserve l’ambiguïté de בּוֹ, mais l’antécédent de « y » est peu accessible en français après « sa part »; « qui n’a pas travaillé pour elle » explicite excessivement la référence à la part, tandis que « qui n’a pas peiné à ce travail » resserre indûment la référence sur le travail. Une formulation avec « qui n’a pas participé à ce labeur » serait interprétative. Il est préférable de conserver l’ambiguïté par « qui n’a pas peiné pour cela », avec note signalant que le pronom peut viser le travail ou son résultat.
  naturalness: « Il y a un homme qui peine » est plus idiomatique et précis que « Car tel homme peine ». La répétition de « homme » est naturelle dans le parallélisme volontaire du verset. « Vapeur » demeure inhabituel mais est un choix thématique défendable et la note le rend intelligible. « Un grand mal » est naturel dans le registre sapientiel.
  terminology: « Sagesse, connaissance et savoir-faire » rend bien חָכְמָה, דַּעַת et כִּשְׁרוֹן. « Peine » et « devra donner sa part » transmettent de manière adéquate עָמָל et l’imparfait à valeur d’inéluctabilité. « Vapeur » préserve l’image de הֶבֶל sans imposer « vanité ».
  issues:
  - severity: medium
    issue: « tel homme » pour יֵשׁ אָדָם
    rationale: L’hébreu introduit explicitement un cas par une construction existentielle (« il y a un homme »). « Tel homme » peut désigner un type d’homme ou un homme déjà envisagé et ne restitue pas aussi clairement cette introduction.
  - severity: low
    issue: Référence de « n’y » peu lisible
    rationale: Le pronom hébreu est ambigu, mais le français « y » ne possède pas d’antécédent spatial ou notionnel immédiatement saillant dans la formulation actuelle. « Pour cela » demeure suffisamment ouvert tout en étant plus fluide; la note conserve l’ambiguïté.
  revised_text: Car il y a un homme qui peine avec sagesse, connaissance et savoir-faire, mais il devra donner sa part à un homme qui n’a pas peiné pour cela[a]. Cela aussi est vapeur[b] et un grand mal.
  revised_footnotes:
  - marker: a
    text: Littéralement « qui n’a pas peiné en cela »; le pronom peut renvoyer au travail ou à ce qui en résulte.
    reason: ambiguïté_référentielle
  - marker: b
    text: 'Traditionnellement : « vanité ». Le mot hébreu הֶבֶל désigne littéralement une vapeur ou un souffle, image de ce qui est fugace et insaisissable.'
    reason: alternative_lexicale
