  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: fr
  text: Et moi, j’ai détesté tout le labeur auquel je me suis livré sous le soleil, car je le laisserai à l’homme qui viendra après moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à un homme qui sera après moi »; littéralement, « qui sera après moi ».'
    reason: La construction peut être comprise avec une référence moins définie, et le verbe hébreu signifie littéralement « être » plutôt que « venir ».
lexical_decisions:
- source_word: וְשָׂנֵאתִי אֲנִי
  choice: Et moi, j’ai détesté
  rationale: Le parfait qal exprime la réaction arrêtée du locuteur. « Et » maintient l’enchaînement discursif, tandis que « moi » rend l’accent porté par le pronom אֲנִי.
- source_word: כָּל עֲמָלִי
  choice: tout le labeur
  rationale: עָמָל désigne ici un travail pénible, avec la nuance de peine caractéristique de l’Ecclésiaste. « Labeur » conserve cette nuance et convient au registre digne du livre.
- source_word: שֶׁאֲנִי עָמֵל
  choice: auquel je me suis livré
  rationale: La proposition relative reprend la racine de עָמָל et souligne l’engagement personnel dans ce labeur. Cette formulation reste naturelle en français sans effacer l’idée d’effort soutenu.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression caractéristique de l’Ecclésiaste désigne la sphère de l’existence terrestre; la traduction traditionnelle est exacte, claire et reconnaissable.
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: car je le laisserai
  rationale: Le hiphil de נוח signifie ici « laisser » ou « abandonner à quelqu’un ». Le contexte donne à שֶׁ une valeur causale. Le futur français restitue l’énoncé sans ajouter explicitement une modalité d’obligation absente de la forme hébraïque.
- source_word: לָאָדָם
  choice: à l’homme
  rationale: אָדָם désigne un individu humain singulier, précisé par la relative qui suit. « À l’homme » conserve le masculin grammatical et la détermination du texte hébreu.
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: qui viendra après moi
  rationale: Littéralement, « qui sera après moi ». En contexte de succession, « viendra après moi » est idiomatique tout en maintenant le sens temporel et personnel.
theological_decisions:
- issue: Portée de אָדָם dans la désignation du successeur
  choice: à l’homme
  alternative: à un homme / à la personne
  rationale: Le substantif hébreu est masculin singulier et vise le successeur particulier défini par la proposition relative. La traduction ne neutralise pas cette forme, tout en signalant en note que l’article peut aussi se comprendre de façon moins définie.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Labeur » maintient le vocabulaire de la peine propre à l’Ecclésiaste; la syntaxe reste fluide et conserve l’insistance du pronom « moi ».
