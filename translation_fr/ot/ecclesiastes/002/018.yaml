  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : réaction rétrospective (« j’ai détesté »), totalité du labeur, activité personnelle sous le soleil, puis motif causal du legs à un successeur. Le futur « je le laisserai » rend correctement l’action à venir sans introduire la nécessité interprétative de « je dois ».'
