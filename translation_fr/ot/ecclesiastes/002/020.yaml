  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
translation:
  language: fr
  text: Alors, j’ai entrepris de plonger mon cœur dans le désespoir[a] à cause de tout le labeur auquel je me suis livré sous le soleil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Alors je me suis mis à désespérer en mon cœur » ou « Alors j’ai entrepris de livrer mon cœur au désespoir ». L’expression hébraïque est concise et peut être rendue de plusieurs manières proches.
    reason: lexical_alternative
  - marker: b
    text: « Sous le soleil » est une expression récurrente de l’Ecclésiaste qui désigne la vie dans le monde présent, dans sa réalité terrestre.
    reason: cross_reference
lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: Alors je me suis mis
  rationale: Le verbe סבב marque ici un changement d’orientation intérieure. Cette tournure française rend naturellement le passage à une nouvelle réaction, sans imposer l’image plus concrète de « se retourner ».
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: à désespérer, dans mon cœur
  rationale: La construction hébraïque est compacte et peut suggérer soit que l’auteur livre son cœur au désespoir, soit qu’il désespère intérieurement. La formulation retenue reste naturelle tout en conservant la mention du cœur, siège de la vie intérieure.
- source_word: עַל כָּל הֶעָמָל
  choice: de tout le travail
  rationale: עַל introduit ici l’objet ou le motif du désespoir. עָמָל désigne un travail pénible et éprouvant; « travail » demeure clair et permet de conserver la répétition avec le verbe apparenté.
- source_word: שֶׁעָמַלְתִּי
  choice: que j’avais accompli
  rationale: Le plus-que-parfait situe ce travail avant le mouvement de désespoir. « Accompli » évite en français la lourdeur de « travail que j’avais travaillé », même si la répétition étymologique de l’hébreu est ainsi atténuée.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression récurrente de l’Ecclésiaste est rendue de manière constante et idiomatique; elle évoque l’existence dans sa sphère terrestre présente.
