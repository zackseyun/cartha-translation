revisions:
- from: Alors je me suis mis à désespérer, dans mon cœur, de tout le travail que j’avais accompli sous le soleil[a][b].
  to: Alors, j’ai entrepris de plonger mon cœur dans le désespoir[a] à cause de tout le labeur auquel je me suis livré sous le soleil[b].
  rationale: La révision corrige la syntaxe française et rend plus explicitement, sans surinterprétation doctrinale, le fait que le cœur est affecté par le désespoir et que le labeur en est le motif. Elle conserve la transition du verbe סבב, la répétition conceptuelle entre le nom et le verbe de la racine עמל, ainsi que l’expression structurante « sous le soleil ».
