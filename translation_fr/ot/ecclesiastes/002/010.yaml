base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: fr
  text: Tout ce que mes yeux désiraient, je ne le leur ai pas refusé[a]. Je n’ai privé mon cœur d’aucun plaisir[b], car mon cœur se réjouissait de tout mon labeur[c] ; et cela a été ma part de tout mon labeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout ce que mes yeux demandaient, je ne le leur ai pas refusé. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je n’ai empêché mon cœur de connaître aucune joie. »'
    reason: lexical_alternative
  - marker: c
    text: Le terme traduit par « labeur » peut aussi être rendu par « travail pénible » aux deux endroits où il figure dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: mes yeux désiraient
  rationale: Le verbe signifie littéralement « demander », mais avec « mes yeux » pour sujet, l’expression évoque ce que le regard convoite ou désire. La formulation conserve l’image hébraïque tout en étant naturelle en français.
- source_word: לֹא אָצַלְתִּי מֵהֶם
  choice: je ne le leur ai pas refusé
  rationale: Le verbe exprime l’idée de retenir ou de refuser quelque chose. Le pronom « leur » reprend les yeux, conformément à la syntaxe et à l’image du texte.
- source_word: לֹא מָנַעְתִּי אֶת לִבִּי מִכָּל שִׂמְחָה
  choice: Je n’ai privé mon cœur d’aucune joie
  rationale: Cette formulation rend l’idée de ne pas empêcher le cœur de connaître la joie, tout en maintenant le cœur comme siège de l’expérience intérieure.
- source_word: לִבִּי שָׂמֵחַ
  choice: mon cœur se réjouissait
  rationale: Traduction directe et idiomatique qui préserve l’image hébraïque du cœur comme siège de la joie.
- source_word: עֲמָלִי
  choice: mon labeur
  rationale: « Labeur » garde la nuance d’effort pénible souvent portée par עָמָל dans l’Ecclésiaste, sans exclure le travail et ses résultats. Le même choix est conservé aux deux occurrences.
- source_word: חֶלְקִי
  choice: la part qui m’est revenue
  rationale: Cette expression rend la part attribuée ou obtenue par une personne. Elle explicite naturellement en français le possessif « ma part » sans ajouter une idée étrangère.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les images concrètes des « yeux » et du « cœur » sont conservées. Le choix de « labeur » maintient la tonalité caractéristique de l’Ecclésiaste, tandis que la ponctuation fait ressortir la conclusion réflexive du verset.
