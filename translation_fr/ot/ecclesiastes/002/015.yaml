  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: fr
  text: 'Je me suis dit en moi-même : « Ce qui arrive à l’insensé m’arrivera aussi. Pourquoi donc ai-je été plus sage ? » Puis je me suis dit en moi-même que cela aussi n’est que vapeur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souffle ». Le mot hébreu הָבֶל, fréquent dans l’Ecclésiaste, évoque ce qui est fugitif, insaisissable ou vain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Je me suis dit en moi-même
  rationale: L’expression hébraïque désigne une réflexion intérieure. « En moi-même » restitue naturellement l’idiome sans perdre son caractère introspectif.
- source_word: כְּמִקְרֵה הַכְּסִיל גַּם אֲנִי יִקְרֵנִי
  choice: Ce qui arrive à l’insensé m’arrivera aussi
  rationale: מִקְרֶה et קָרָה évoquent ici ce qui arrive ou échoit à quelqu’un. Cette formulation conserve la répétition conceptuelle et n’impose pas la notion plus forte de destin.
- source_word: הַכְּסִיל
  choice: l’insensé
  rationale: Terme courant de la littérature de sagesse pour celui qui manque de sagesse sur les plans intellectuel et moral ; « insensé » convient au registre biblique sans être obscur.
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: Pourquoi donc ai-je été plus sage ?
  rationale: « Donc » exprime la conséquence argumentative portée par אָז. Le parfait חָכַמְתִּי est rendu comme un bilan passé, tandis que « plus sage » conserve la comparaison laissée implicite par יוֹתֵר.
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: Puis je me suis dit en moi-même
  rationale: Dans ce monologue intérieur, « se dire » est plus idiomatique que « parler » en français. « Puis » marque la progression sans surcharger la coordination hébraïque.
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: que cela aussi n’est que vapeur
  rationale: « Cela aussi » préserve la valeur additive de גַּם. « Vapeur » garde l’image concrète de הָבֶל ainsi que ses connotations de caractère fugitif, insaisissable et vain, sans la réduire à la seule absence de sens.
theological_decisions:
- issue: Sens du terme récurrent הָבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: vanité, souffle, absurdité, futilité
  rationale: « Vapeur » conserve la métaphore fondamentale et l’ouverture sémantique du mot hébreu. « Absurdité » ou « absence de sens » trancherait trop fortement en faveur d’une interprétation existentielle, tandis que « vanité » peut aujourd’hui évoquer surtout l’orgueil personnel.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation conserve le mouvement du raisonnement intérieur, la comparaison implicite de « plus sage » et l’image centrale de la vapeur.
