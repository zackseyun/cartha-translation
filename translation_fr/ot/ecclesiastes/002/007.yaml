reference: Ecclesiastes 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קָנִ֨יתִי֙ עֲבָדִ֣ים וּ/שְׁפָח֔וֹת וּ/בְנֵי בַ֖יִת הָ֣יָה לִ֑/י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָ/צֹ֤אן הַרְבֵּה֙ הָ֣יָה לִ֔/י מִ/כֹּ֛ל שֶֽׁ/הָי֥וּ לְ/פָנַ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male servants and female servants[a], and homeborn servants were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: fr
  text: J’ai acquis des esclaves, hommes et femmes, et j’ai eu des esclaves nés dans ma maison[a]. J’ai aussi possédé du gros et du petit bétail en abondance[b], plus que tous ceux qui m’avaient précédé à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de la maison », c’est-à-dire des personnes nées au sein de la maisonnée ; dans ce contexte, il s’agit vraisemblablement d’esclaves qui y étaient nés.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « beaucoup de troupeaux de gros et de petit bétail ». Les mots hébreux sont des termes collectifs désignant les animaux possédés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: J’ai acquis
  rationale: Le verbe קנה peut signifier acheter ou acquérir. « Acquis » conserve cette amplitude sans préciser indûment le mode d’obtention.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: des esclaves, hommes et femmes
  rationale: Les deux termes désignent respectivement des esclaves masculins et féminins. Cette formulation explicite le statut social et conserve l’opposition de genre dans un français naturel.
- source_word: וּבְנֵי בַיִת
  choice: des esclaves nés dans ma maison
  rationale: L’expression signifie littéralement « fils de la maison » et désigne ici, dans la suite de la mention des esclaves, des personnes nées au sein de la maisonnée, vraisemblablement esclaves.
- source_word: הָיָה לִי
  choice: j’ai eu / j’ai possédé
  rationale: La formule hébraïque de possession est rendue selon le contexte par des tournures françaises idiomatiques.
- source_word: מִקְנֶה בָקָר וָצֹאן הַרְבֵּה
  choice: du gros et du petit bétail en abondance
  rationale: בָקָר désigne collectivement les bovins, et צֹאן le petit bétail, notamment moutons et chèvres. « En abondance » rend clairement הַרְבֵּה.
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  choice: plus que tous ceux qui m’avaient précédé
  rationale: Cette formulation française naturelle conserve la comparaison avec l’ensemble des prédécesseurs du locuteur.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom de lieu avec la préposition exigée par le contexte.
theological_decisions: []
