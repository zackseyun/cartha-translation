  text: גַּ֣ם מִ/גָּבֹ֤הַּ יִרָ֨אוּ֙ וְ/חַתְחַתִּ֣ים בַּ/דֶּ֔רֶךְ וְ/יָנֵ֤אץ הַ/שָּׁקֵד֙ וְ/יִסְתַּבֵּ֣ל הֶֽ/חָגָ֔ב וְ/תָפֵ֖ר הָֽ/אֲבִיּוֹנָ֑ה כִּֽי הֹלֵ֤ךְ הָ/אָדָם֙ אֶל בֵּ֣ית עוֹלָמ֔/וֹ וְ/סָבְב֥וּ בָ/שּׁ֖וּק הַ/סֹּפְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: fr
  text: De plus, on a peur des hauteurs, et il y a des terreurs sur le chemin ; l’amandier fleurit, la sauterelle se traîne[a], et la câpre n’a plus d’effet[b]. Car l’être humain s’en va vers sa demeure éternelle, et les pleureurs parcourent la rue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la sauterelle devient un fardeau ». L’expression hébraïque est difficile ; l’image peut évoquer soit une progression pénible, soit le fait que la moindre chose devient pesante avec l’âge.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le désir s’éteint ». L’hébreu mentionne littéralement la câpre, probablement en rapport avec l’appétit ou son effet stimulant.'
    reason: lexical_alternative
  - marker: c
    text: Les « pleureurs » pouvaient comprendre des personnes engagées pour exprimer publiquement les lamentations funèbres.
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: On a aussi peur de ce qui est haut
  rationale: La tournure française impersonnelle rend naturellement le pluriel indéfini hébreu et conserve l’idée concrète de crainte devant les hauteurs, dans le contexte du déclin lié à l’âge.
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: des terreurs guettent sur le chemin
  rationale: חַתְחַתִּים désigne des sujets d’effroi ou des dangers redoutés. « Guettent » exprime idiomatiquement leur présence menaçante sur le chemin sans identifier plus précisément ces dangers.
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: l’amandier fleurit
  rationale: Le verbe est difficile, mais le sens traditionnel « fleurir » convient à la série d’images du vieillissement et peut évoquer les cheveux devenus blancs.
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: la sauterelle se traîne
  rationale: La forme verbale est obscure. Cette traduction conserve l’image de l’insecte et fait ressortir une locomotion pénible, appropriée au contexte, tout en signalant l’autre analyse possible en note.
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: la câpre n’a plus d’effet
  rationale: אֲבִיּוֹנָה désigne vraisemblablement le fruit du câprier, réputé stimulant. Cette formulation garde l’image concrète et exprime l’échec de son effet, sans remplacer directement le nom par « désir ».
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Dans cette sentence universelle sur la mortalité, אָדָם désigne l’individu humain représentatif. « L’être humain » garde le singulier générique en français moderne sans suggérer qu’il ne s’agit que du sexe masculin.
- source_word: בֵּית עוֹלָמוֹ
  choice: sa demeure éternelle
  rationale: Cette formulation conserve la métaphore littérale de la « maison » et la portée durable de עוֹלָם, avec le registre solennel du passage.
- source_word: וְסָבְבוּ בַשּׁוּק הַסֹּפְדִים
  choice: les pleureurs parcourent les rues
  rationale: סבב évoque le fait de circuler, et שׁוּק un espace public, rue ou place de marché. Le pluriel « les rues » est naturel en français et rend la manifestation publique du deuil.
theological_decisions:
- issue: Portée de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le texte parle ici de la destinée mortelle de tout individu humain. Le choix retenu préserve cette portée générique sans transformer le singulier en collectif abstrait.
- issue: Sens de בֵּית עוֹלָמוֹ
  choice: sa demeure éternelle
  alternative: sa demeure pour toujours / sa longue demeure
  rationale: La traduction conserve l’expression métaphorique et son ambiguïté poétique concernant la tombe et le séjour durable des morts, sans développer une doctrine précise de l’au-delà.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsmes. Le rythme juxtapose les images comme en hébreu. Les difficultés lexicales réelles sont conservées dans le texte ou exposées en notes, sans imposer une lecture allégorique détaillée de chaque image.
