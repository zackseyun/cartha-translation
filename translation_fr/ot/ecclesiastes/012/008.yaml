  rationale: Le remplacement de « buée » par « vapeur » améliore la fidélité à l’image lexicale de הבל et évite l’association française étroite avec la condensation. La construction intensive, la répétition du mot-clé, le registre du refrain et l’ambiguïté sémantique du texte source sont préservés. La note indique la traduction traditionnelle et explique l’image sans la réduire à une interprétation doctrinale ou philosophique.
