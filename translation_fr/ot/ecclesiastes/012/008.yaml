  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
translation:
  language: fr
  text: « Vapeur des vapeurs[a], dit l’Enseignant, tout est vapeur. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit traditionnellement : « Vanité des vanités… tout est vanité. » Le mot hébreu évoque littéralement une vapeur ou un souffle : quelque chose de fugitif, de sans consistance ou d’insaisissable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: Buée des buées
  rationale: La construction intensive hébraïque est conservée, ainsi que l’image concrète d’une réalité fugace, insaisissable et sans consistance. « Buée » est plus évocateur en français actuel que « vanité », qui suggère souvent l’amour-propre.
- source_word: אָמַר
  choice: dit
  rationale: Le présent français convient à une formule de citation qui reprend solennellement le refrain du livre.
- source_word: הַקּוֹהֶלֶת
  choice: l’Enseignant
  rationale: Le terme désigne ici un titre ou une fonction liée à la parole adressée à une assemblée. « L’Enseignant » reste intelligible et évite la coloration ecclésiastique de « Prédicateur ».
- source_word: הַכֹּל
  choice: tout
  rationale: Cette formulation concise et idiomatique exprime la totalité visée par l’hébreu.
- source_word: הָבֶל
  choice: buée
  rationale: La répétition du même terme français préserve l’unité du mot-clé et son image concrète, sans réduire son sens à la seule absurdité ou inutilité.
theological_decisions:
- issue: Traduction du mot-clé הבל dans l’Ecclésiaste
  choice: buée
  alternative: vanité ; futilité ; souffle
  rationale: '« Buée » maintient la polyvalence de l’image hébraïque : ce qui est passager, inconsistant ou difficile à saisir. Ce choix évite d’imposer une interprétation exclusivement morale ou philosophique.'
translation_notes:
  register: Français international moderne, concis et solennel. La tournure répétitive conserve le caractère proverbial du refrain hébreu.
