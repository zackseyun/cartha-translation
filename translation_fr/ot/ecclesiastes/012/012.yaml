source:
  edition: WLC
  text: וְ/יֹתֵ֥ר מֵ/הֵ֖מָּה בְּנִ֣/י הִזָּהֵ֑ר עֲשׂ֨וֹת סְפָרִ֤ים הַרְבֵּה֙ אֵ֣ין קֵ֔ץ וְ/לַ֥הַג הַרְבֵּ֖ה יְגִעַ֥ת בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/012.yaml
  text: 'And beyond these[a], my son, be warned: of making many books there is no end, and much study is a weariness of the flesh.'
translation:
  language: fr
  text: 'Et au-delà de ceux-ci[a], mon fils, prends garde : faire beaucoup de livres n’a pas de fin, et beaucoup d’étude fatigue le corps.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus que ceux-ci » ; le référent peut être les paroles ou les recueils mentionnés juste avant.
    reason: ambiguïté syntaxique et référentielle
  - marker: b
    text: Ou « beaucoup de lecture » ou « beaucoup d’application ». Le mot hébreu traduit par « étude » est rare et peut désigner plus largement une absorption soutenue dans les livres ou les paroles.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְיֹתֵר מֵהֵמָּה
  choice: Et au-delà de ceux-ci
  rationale: La formulation rattache l’avertissement aux paroles ou recueils précédents tout en conservant le sens comparatif et la légère ambiguïté du référent masculin pluriel.
- source_word: בְּנִי
  choice: mon fils
  rationale: Traduction directe de l’adresse masculine singulière, qui garde la forme sapientielle et paternelle de l’hébreu.
- source_word: הִזָּהֵר
  choice: sois averti
  rationale: Le nifal impératif exprime ici une mise en garde. Cette formulation est naturelle et conserve sa nuance passive ou réflexive.
- source_word: עֲשׂוֹת סְפָרִים הַרְבֵּה
  choice: à faire beaucoup de livres
  rationale: Cette construction rend l’infinitif hébreu et peut désigner la production ou la composition de nombreux livres sans préciser davantage le procédé.
- source_word: אֵין קֵץ
  choice: il n’y a pas de fin
  rationale: Équivalent idiomatique direct de la proposition existentielle négative, qui préserve l’image de l’absence de terme.
- source_word: וְלַהַג הַרְבֵּה
  choice: beaucoup d’étude
  rationale: Le terme rare לַהַג est incertain. Dans le contexte des livres, « étude » exprime plausiblement l’application soutenue aux écrits, tandis qu’une note conserve d’autres possibilités.
- source_word: יְגִעַת בָּשָׂר
  choice: fatigue le corps
  rationale: La tournure française naturelle communique l’épuisement physique indiqué par בָּשָׂר, ici employé au sens corporel plutôt que théologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le lien avec le contexte précédent et l’adresse sapientielle « mon fils ». « Fatigue le corps » évite une tournure française artificielle tout en rendant clairement la dimension physique de l’expression hébraïque.
