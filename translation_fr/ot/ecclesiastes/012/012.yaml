    rationale: En français courant, « être averti » évoque souvent le fait d’avoir reçu une information. Le contexte exige une mise en garde active ; « prends garde » rend mieux la valeur impérative réflexive/prudente.
  - severity: medium
    issue: La tournure « à faire beaucoup de livres, il n’y a pas de fin » est syntaxiquement lourde et peu naturelle.
    rationale: Bien qu’elle cherche à reproduire l’infinitif hébreu, elle ne constitue pas une formulation française idiomatique. « Faire beaucoup de livres n’a pas de fin » conserve le sens sans ajouter d’interprétation.
