source:
  edition: WLC
  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: fr
  text: 'Et souviens-toi de ton Créateur[a] aux jours de ta jeunesse, avant que viennent les jours mauvais et qu’arrivent les années dont tu diras : « Je n’y prends aucun plaisir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une forme plurielle, littéralement « tes créateurs »; ici, elle désigne Dieu au singulier : « ton Créateur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכֹר
  choice: Et souviens-toi
  rationale: L’impératif qal masculin singulier exprime une exhortation directe. « Et » conserve le lien avec le contexte précédent.
- source_word: אֶת בּוֹרְאֶיךָ
  choice: de ton Créateur
  rationale: Bien que le mot soit morphologiquement au pluriel, il désigne ici le Dieu unique. Le singulier français communique le référent sans suggérer plusieurs créateurs; la particularité formelle est signalée en note.
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: aux jours de ta jeunesse
  rationale: Cette formulation demeure proche de l’image temporelle de l’hébreu tout en étant naturelle dans un registre biblique moderne.
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: avant que viennent
  rationale: Dans ce contexte, l’expression fixe une limite antérieure à l’arrivée d’une période pénible; « avant que » en rend naturellement la valeur.
- source_word: יְמֵי הָרָעָה
  choice: les jours mauvais
  rationale: « Mauvais » conserve l’ampleur sémantique de רָעָה, qui évoque ici les jours pénibles ou malheureux associés au déclin décrit ensuite, sans imposer une lecture exclusivement morale.
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: et qu’arrivent les années
  rationale: Le verbe hiphil exprime l’idée d’atteindre ou d’arriver. La coordination sous « avant que » produit une phrase française fluide.
- source_word: אֲשֶׁר תֹּאמַר
  choice: dont tu diras
  rationale: Le relatif renvoie aux années; « dont » rend avec concision l’idée de parler à leur sujet.
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: Je n’y prends aucun plaisir
  rationale: חֵפֶץ désigne ici le plaisir ou l’agrément. Cette tournure française claire conserve l’évaluation personnelle exprimée par le locuteur.
theological_decisions:
- issue: Nombre grammatical de בּוֹרְאֶיךָ
  choice: Le singulier « ton Créateur »
  alternative: Le pluriel littéral « tes créateurs »
  rationale: La forme hébraïque est plurielle, mais son référent dans ce contexte sapiential israélite est le Dieu unique. Le singulier évite en français une implication polythéiste étrangère au contexte, tandis que la note préserve la donnée morphologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques de deuxième personne masculine singulière. « Aux jours de ta jeunesse » conserve l’imagerie de l’original; « jours mauvais » préserve sa sobriété et son ambiguïté entre malheur, pénibilité et adversité.
