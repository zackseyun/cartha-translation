- from: Les paroles des sages sont comme des aiguillons, et les sentences rassemblées[a], comme des clous solidement plantés ; elles ont été données par un seul berger[b].
  to: Les paroles des sages sont comme des aiguillons, et les maîtres des recueils[a] comme des clous solidement fixés ; ces paroles sont données par un seul berger[b].
  rationale: La révision restitue explicitement le terme « maîtres » de בַּעֲלֵי tout en maintenant l’alternative interprétative dans la note. Elle conserve la structure parallèle et les métaphores du verset, laisse l’identité du « seul berger » ouverte et garde « par » comme formulation française naturelle de la source dans une construction passive.
