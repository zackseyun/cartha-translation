  text: דִּבְרֵ֤י חֲכָמִים֙ כַּ/דָּ֣רְבֹנ֔וֹת וּֽ/כְ/מַשְׂמְר֥וֹת נְטוּעִ֖ים בַּעֲלֵ֣י אֲסֻפּ֑וֹת נִתְּנ֖וּ מֵ/רֹעֶ֥ה אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: fr
  text: Les paroles des sages sont comme des aiguillons, et les maîtres des recueils[a] comme des clous solidement fixés ; ces paroles sont données par un seul berger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Elle peut aussi désigner des compilateurs ou détenteurs de recueils, ou encore « les responsables des assemblées ».
    reason: alternative_reading
  - marker: b
    text: Le texte n’identifie pas explicitement ce « seul berger ». L’expression peut notamment être comprise comme une référence à Dieu, source ultime de la sagesse.
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: Les paroles des sages
  rationale: « Paroles » conserve la portée large de דִּבְרֵי, tandis que « des sages » désigne les personnes sages sans préciser leur sexe.
- source_word: כַּדָּרְבֹנוֹת
  choice: comme des aiguillons
  rationale: דָּרְבֹן désigne un instrument pointu servant à faire avancer les animaux. « Aiguillons » restitue directement l’image.
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: comme des clous solidement plantés
  rationale: « Clous » est un sens naturel de מַשְׂמְרוֹת. « Solidement plantés » garde la métaphore de נטע tout en exprimant la stabilité suggérée dans ce contexte.
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: les sentences rassemblées
  rationale: La formule hébraïque est difficile. Dans ce contexte littéraire, cette traduction comprend אֲסֻפּוֹת comme des collections de sentences et exprime naturellement leur contenu, sans dissimuler dans la note les autres analyses possibles de בַּעֲלֵי.
- source_word: נִתְּנוּ מֵרֹעֶה אֶחָד
  choice: elles ont été données par un seul berger
  rationale: Le parfait passif נִתְּנוּ est rendu par « ont été données ». En français, « par » exprime naturellement l’origine ou l’agent après le passif, tandis que « un seul berger » conserve אֶחָד et ne précise pas l’identité du berger.
theological_decisions:
- issue: Identité du « seul berger »
  choice: L’expression reste indéterminée et sans majuscule dans le texte principal.
  alternative: Comprendre le berger comme Dieu, comme Qohéleth ou comme l’image d’une source unique d’enseignement sage.
  rationale: Le verset n’identifie pas explicitement le berger. La traduction préserve donc cette ouverture au lieu d’imposer une identification théologique.
- issue: Sens de בַּעֲלֵי אֲסֻפּוֹת
  choice: « les sentences rassemblées » dans le texte, avec signalement de l’ambiguïté en note
  alternative: « les maîtres des recueils » ou « les responsables des assemblées »
  rationale: Le contexte favorise une référence à des paroles de sages recueillies, mais la construction hébraïque permet aussi des lectures désignant des compilateurs, des détenteurs de recueils ou des responsables d’assemblées.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en parallèle les deux images. « Aiguillons » et « clous solidement plantés » conservent le relief concret des métaphores hébraïques.
