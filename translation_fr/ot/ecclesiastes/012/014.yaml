revisions:
- from: Car Dieu fera passer toute action en jugement[a], au sujet de tout ce qui est caché, que ce soit bien ou mal.
  to: Car Dieu amènera toute action en jugement[a], y compris tout ce qui est caché, qu’elle soit bonne ou mauvaise.
  rationale: La révision améliore l’idiomaticité française et rend plus directement la dimension inclusive possible de עַל כָּל נֶעְלָם. La note conserve les principales lectures relationnelles sans trancher une ambiguïté syntaxique ou théologique que l’hébreu ne résout pas explicitement.
