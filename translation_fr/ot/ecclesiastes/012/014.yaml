  revision_rationale: La révision améliore l’idiomaticité française et rend plus directement la dimension inclusive possible de עַל כָּל נֶעְלָם. La note conserve les principales lectures relationnelles sans trancher une ambiguïté syntaxique ou théologique que l’hébreu ne résout pas explicitement.
