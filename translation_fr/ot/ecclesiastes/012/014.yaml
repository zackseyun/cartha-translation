reference: Ecclesiastes 12:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: fr
  text: Car Dieu amènera toute action en jugement[a], y compris tout ce qui est caché, qu’elle soit bonne ou mauvaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « concernant tout ce qui est caché » ; ou : « avec tout ce qui est caché ».'
    reason: 'La relation exacte exprimée par עַל est discutée : elle peut marquer le domaine ou l’objet du jugement (« concernant ») ou présenter les réalités cachées comme incluses parmi ce qui est soumis au jugement (« avec », « y compris »).'
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: toute action
  rationale: Rend distributivement l’expression hébraïque et convient au contexte d’évaluation morale, sans limiter le propos à un type particulier d’œuvre.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: L’article défini relève ici de l’usage hébraïque; « Dieu » est la formulation française naturelle.
- source_word: יָבִא בְמִשְׁפָּט
  choice: fera passer … en jugement
  rationale: Le hiphil de בוא exprime le fait d’amener ou de faire entrer quelque chose dans la sphère du jugement; cette tournure est naturelle et dignifiée en français.
- source_word: עַל כָּל נֶעְלָם
  choice: au sujet de tout ce qui est caché
  rationale: עַל peut signifier « au sujet de » ou « quant à », tandis que נֶעְלָם désigne ce qui est dissimulé ou échappe aux regards. La formulation conserve cette relation sans réduire le sens aux seules intentions secrètes.
- source_word: אִם טוֹב וְאִם רָע
  choice: que ce soit bien ou mal
  rationale: Rend l’alternative hébraïque couvrant toute l’étendue de l’évaluation morale, dans un français courant.
theological_decisions:
- issue: Portée du jugement divin
  choice: Le verset affirme que Dieu soumet toute action au jugement, y compris ce qui est caché, sans en préciser le moment ni le mécanisme.
  alternative: Y voir exclusivement le jugement final, ou à la fois les jugements providentiels dans l’histoire et le jugement final.
  rationale: L’hébreu affirme l’universalité du jugement divin, mais ne tranche pas explicitement entre ces cadres théologiques; la traduction préserve cette tension.
- issue: Rapport syntaxique de עַל כָּל נֶעְלָם
  choice: « au sujet de tout ce qui est caché » rattache les réalités cachées à l’objet ou au champ du jugement.
  alternative: « avec tout ce qui est caché » ou « y compris tout ce qui est caché », qui les présente plus directement comme des éléments eux-mêmes conduits au jugement.
  rationale: La préposition עַל autorise une lecture relationnelle (« au sujet de », « quant à »), mais la construction reste assez ouverte pour justifier une note signalant les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Toute action » est accessible sans être familier; « fera passer … en jugement » conserve l’image judiciaire et le mouvement exprimé par le verbe hébreu.
