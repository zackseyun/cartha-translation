  text: וְ/יֹתֵ֕ר שֶׁ/הָיָ֥ה קֹהֶ֖לֶת חָכָ֑ם ע֗וֹד לִמַּד דַּ֨עַת֙ אֶת הָ/עָ֔ם וְ/אִזֵּ֣ן וְ/חִקֵּ֔ר תִּקֵּ֖ן מְשָׁלִ֥ים הַרְבֵּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: fr
  text: De plus[a], puisque Qohéleth était sage, il enseigna encore la connaissance au peuple ; il pesa, examina et mit en ordre de nombreux proverbes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De plus, Qohéleth étant sage, il enseigna aussi la connaissance au peuple ; il réfléchit, fit des recherches et arrangea de nombreux proverbes. »'
    reason: La relation exprimée par שֶׁהָיָה, ainsi que les nuances de עוֹד, וְאִזֵּן et תִּקֵּן, admettent cette formulation alternative.
lexical_decisions:
- source_word: וְיֹתֵר
  choice: En plus de cela
  rationale: Introduit une observation supplémentaire tout en conservant la valeur connective et additive de l’hébreu.
- source_word: שֶׁהָיָה
  choice: puisque… était
  rationale: 'La particule שֶׁ peut ici exprimer le motif : la sagesse de Qohéleth fonde son activité d’enseignement et de mise en forme.'
- source_word: קֹהֶלֶת
  choice: Qohéleth
  rationale: Conserve la désignation hébraïque distinctive sans la réduire au seul sens de « Prédicateur » ou d’« Enseignant ».
- source_word: חָכָם
  choice: sage
  rationale: Rend directement l’adjectif prédicatif hébreu dans un français naturel.
- source_word: עוֹד
  choice: encore
  rationale: Exprime l’idée d’une activité supplémentaire ou poursuivie, au-delà du fait qu’il était sage.
- source_word: לִמַּד דַּעַת אֶת הָעָם
  choice: il enseigna la connaissance au peuple
  rationale: Respecte la distinction lexicale entre « connaissance » (דַּעַת) et « sage » (חָכָם), avec un ordre naturel en français.
- source_word: וְאִזֵּן
  choice: il pesa
  rationale: Préserve la métaphore probable de la pesée, c’est-à-dire de l’évaluation attentive.
- source_word: וְחִקֵּר
  choice: examina
  rationale: Exprime une recherche ou une investigation soigneuse dans un français actuel.
- source_word: תִּקֵּן
  choice: mit en ordre
  rationale: Rend l’idée de redresser, ordonner ou arranger, sans conclure trop précisément à la seule composition des proverbes.
- source_word: מְשָׁלִים הַרְבֵּה
  choice: de nombreux proverbes
  rationale: Traduction directe, concise et idiomatique de la quantité et de l’objet.
