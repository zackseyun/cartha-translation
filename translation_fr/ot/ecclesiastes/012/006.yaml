source:
  edition: WLC
  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: fr
  text: avant que le cordon d’argent ne se rompe[a], que la coupe d’or ne se brise, que la cruche ne se casse à la source, et que la roue[b] ne se fracasse au puits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne soit détaché », « ne soit éloigné » ou « ne soit tranché » ; le verbe hébreu est difficile dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: La « roue » peut désigner plus précisément la poulie ou le dispositif de puisage d’un puits.
    reason: lexical_alternative
  - marker: c
    text: Ou « à la citerne » ; le mot hébreu peut aussi désigner une fosse.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: avant que
  rationale: Dans la suite de l’exhortation précédente, cette tournure introduit naturellement en français ce qui doit être fait avant que la mort ne survienne.
- source_word: ירחק
  choice: ne se rompe
  rationale: Le verbe hébreu est difficile dans ce contexte. « Se rompe » s’accorde avec le cordon et avec la série d’objets détruits, tandis qu’une note conserve les autres possibilités.
- source_word: חֶבֶל הַכֶּסֶף
  choice: le cordon d’argent
  rationale: Cette formulation française naturelle conserve directement l’image poétique du syntagme hébreu.
- source_word: וְתָרֻץ
  choice: ne se brise
  rationale: Le verbe exprime un bris violent. Avec une coupe, « se brise » est idiomatique et garde la force de l’image sans lourdeur.
- source_word: גֻּלַּת הַזָּהָב
  choice: la coupe d’or
  rationale: גֻּלָּה peut désigner un récipient arrondi, éventuellement un réservoir de lampe. « Coupe d’or » préserve l’image sans préciser une fonction incertaine.
- source_word: וְתִשָּׁבֶר כַּד
  choice: que la cruche ne se casse
  rationale: כַּד désigne un récipient servant notamment à puiser de l’eau. « Cruche » est courant et convient au contexte de la source.
- source_word: עַל הַמַּבּוּעַ
  choice: à la source
  rationale: מַבּוּעַ désigne une source ou un jaillissement d’eau; « à la source » est précis et naturel.
- source_word: וְנָרֹץ
  choice: ne se fracasse
  rationale: Le même champ lexical de destruction violente est rendu ici par « se fracasse », qui convient à la roue et évite une répétition mécanique.
- source_word: הַגַּלְגַּל
  choice: la roue
  rationale: Le sens général est « roue »; il peut s’agir plus précisément du dispositif ou de la poulie d’un puits, possibilité signalée en note.
- source_word: אֶל הַבּוֹר
  choice: au puits
  rationale: Dans cette scène de puisage, בּוֹר désigne vraisemblablement un puits ou une citerne. « Au puits » restitue naturellement le lieu sans imposer que la roue tombe dedans.
theological_decisions:
- issue: Interprétation des objets brisés
  choice: Conserver littéralement la succession des images comme évocation poétique de la mort.
  alternative: Identifier chaque objet à une partie précise du corps vieillissant.
  rationale: Le passage évoque l’effondrement de la vie, mais la correspondance exacte entre chaque objet et l’anatomie humaine demeure discutée. La traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international moderne, poétique et digne. La construction répétée avec le « ne » explétif après « avant que » maintient le rythme solennel sans suggérer une négation autonome. Les images restent concrètes et ne sont pas transformées en allégorie anatomique.
