  source_fidelity: La traduction conserve globalement la succession et les images du texte hébreu. Toutefois, « deux battants » spécifie davantage que דְלָתַיִם, qui peut simplement désigner des « portes », et « s’affaiblissent » atténue le sens premier de וְיִשַּׁחוּ, « s’abaissent / sont abaissées ».
  naturalness: Le français est poétique et accessible. « Les portes donnant sur la rue » est plus naturel et moins restrictif que « les deux battants donnant sur la rue ». « S’abaissent » maintient une étrangeté poétique légitime tout en étant fidèle au verbe hébreu.
  terminology: « Rue », « mouture », « chant d’un oiseau » et « filles du chant » rendent convenablement les images sans imposer l’allégorie du vieillissement. La note conserve à juste titre les interprétations possibles sans les présenter comme certaines.
