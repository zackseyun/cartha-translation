  text: וְ/סֻגְּר֤וּ דְלָתַ֨יִם֙ בַּ/שּׁ֔וּק בִּ/שְׁפַ֖ל ק֣וֹל הַֽ/טַּחֲנָ֑ה וְ/יָקוּם֙ לְ/ק֣וֹל הַ/צִּפּ֔וֹר וְ/יִשַּׁ֖חוּ כָּל בְּנ֥וֹת הַ/שִּֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: fr
  text: et les portes donnant sur la rue se ferment quand faiblit le bruit de la mouture[a] ; on se lève au chant d’un oiseau, et toutes les filles du chant s’abaissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand le bruit de la mouture devient faible ». Les portes et la mouture sont souvent comprises comme des images de la bouche et de la mastication, mais le texte ne précise pas leur correspondance.
    reason: alternative_reading
  - marker: b
    text: Littéralement « toutes les filles du chant s’abaissent ». L’expression peut désigner les chanteuses, les voix ou les facultés liées au chant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ דְלָתַיִם בַּשּׁוּק
  choice: et les deux battants donnant sur la rue se ferment
  rationale: Le duel דְלָתַיִם peut désigner une porte à deux battants. « Donnant sur la rue » rend naturellement la relation spatiale de בַּשּׁוּק sans imposer l’interprétation métaphorique des lèvres.
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: quand faiblit le bruit de la meule
  rationale: שְׁפַל exprime ici l’abaissement ou l’affaiblissement, tandis que טַחֲנָה renvoie à la mouture ou au moulin. « Bruit de la meule » conserve l’image concrète en français naturel.
- source_word: וְיָקוּם לְקוֹל הַצִּפּוֹר
  choice: on se lève au chant d’un oiseau
  rationale: Le singulier verbal sans antécédent explicite se rend naturellement par le pronom indéfini « on ». קוֹל peut désigner la voix ou le cri ; avec l’oiseau, « chant » est idiomatique sans expliciter davantage l’image.
- source_word: וְיִשַּׁחוּ כָּל בְּנוֹת הַשִּׁיר
  choice: et toutes les filles du chant s’affaiblissent
  rationale: « Les filles du chant » préserve la métaphore hébraïque. Le verbe peut évoquer l’abaissement, l’accablement ou l’affaiblissement ; « s’affaiblissent » convient au contexte tout en évitant d’identifier précisément ces « filles ».
theological_decisions:
- issue: Interprétation des images du vieillissement en Ecclésiaste 12
  choice: Conserver dans le texte les images de la porte, de la meule et des filles du chant.
  alternative: Identifier explicitement les battants aux lèvres, la mouture aux dents et les filles du chant aux facultés vocales ou auditives.
  rationale: Le passage évoque largement le vieillissement, mais les correspondances anatomiques précises restent discutées. La traduction ne doit pas trancher dans le corps du texte ce que l’hébreu laisse poétiquement ouvert.
translation_notes:
  register: Français international moderne, poétique mais accessible. La ponctuation maintient le mouvement de la phrase hébraïque. Les métaphores sont conservées, avec une formulation française naturelle et digne.
