  source_fidelity: Le texte conserve correctement la structure temporelle, les images domestiques et les pluriels féminins/masculins de l’hébreu. Toutefois, « verront leur vue s’obscurcir » introduit explicitement la « vue », alors que le texte source dit littéralement que « celles qui regardent par les fenêtres » s’obscurcissent; cette explicitation affaiblit la retenue métaphorique observée ailleurs.
  naturalness: Le français est globalement poétique et naturel. « Celles qui broient cesseront » est plus concis, plus proche de l’hébreu et plus fluide que « cesseront leur travail ». « Celles qui regardent par les fenêtres s’obscurciront » conserve une formulation volontairement poétique, appropriée au registre du passage.
  terminology: « Gardiens de la maison », « hommes vigoureux » et « celles qui broient » rendent bien les images et les genres grammaticaux du texte. La note interprétative demeure prudemment hypothétique et ne transforme pas l’allégorie probable en sens explicite du texte principal.
