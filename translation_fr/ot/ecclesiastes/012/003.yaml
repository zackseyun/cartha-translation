  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: fr
  text: au jour où trembleront les gardiens de la maison[a], où se courberont les hommes vigoureux, où celles qui broient cesseront parce qu’elles seront devenues peu nombreuses, et où celles qui regardent par les fenêtres[b] s’obscurciront,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ces images décrivent probablement le déclin de la vieillesse : les « gardiens de la maison » pourraient représenter les bras ou les mains, les « hommes vigoureux », les jambes, « celles qui broient », les dents, et « celles qui regardent par les fenêtres », les yeux.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « par les treillis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: au jour où
  rationale: Conserve le cadre temporel et s’insère naturellement dans la longue phrase poétique du contexte.
- source_word: יָזֻעוּ
  choice: trembleront
  rationale: Rend directement le mouvement physique évoqué par le verbe, sans expliciter prématurément l’image du vieillissement.
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: les gardiens de la maison
  rationale: Préserve l’image domestique de l’hébreu plutôt que d’identifier dans le texte principal les parties du corps éventuellement visées.
- source_word: הִתְעַוְּתוּ
  choice: se courberont
  rationale: Exprime en français naturel la déformation ou la posture voûtée suggérée par le verbe.
- source_word: אַנְשֵׁי הֶחָיִל
  choice: les hommes vigoureux
  rationale: Conserve le référent masculin et l’idée de force, avec une tournure française plus naturelle que « hommes de force ».
- source_word: בָטְלוּ
  choice: cesseront leur travail
  rationale: Rend clairement l’idée de devenir inactives tout en maintenant l’image de personnes occupées à moudre.
- source_word: הַטֹּחֲנוֹת
  choice: celles qui broient
  rationale: Respecte la forme féminine plurielle de l’hébreu et préserve l’image sans la remplacer par les dents.
- source_word: כִּי מִעֵטוּ
  choice: parce qu’elles seront devenues peu nombreuses
  rationale: Fait entendre le processus de diminution exprimé par le verbe et clarifie l’accord avec « celles qui broient ».
- source_word: חָשְׁכוּ
  choice: verront leur vue s’obscurcir
  rationale: La formulation française rend intelligiblement l’affaiblissement de la vision, tout en gardant les personnes qui regardent comme sujet grammatical de l’image hébraïque.
- source_word: הָרֹאוֹת
  choice: celles qui regardent
  rationale: Préserve le participe féminin pluriel sans identifier explicitement ces figures aux yeux.
- source_word: בָּאֲרֻבּוֹת
  choice: par les fenêtres
  rationale: « Fenêtres » est le sens courant et accessible; l’autre possibilité, « treillis », est signalée en note.
theological_decisions:
- issue: Faut-il décoder dans le texte principal l’allégorie de la maison et du corps ?
  choice: Conserver les images domestiques et humaines sans les remplacer par des parties du corps.
  alternative: Traduire directement par les mains ou les bras, les jambes, les dents et les yeux.
  rationale: Le passage évoque très probablement le déclin dû à la vieillesse, mais l’hébreu ne fournit pas explicitement toutes les correspondances. La traduction maintient donc l’ambiguïté poétique et place l’interprétation en note.
- issue: Rendu du masculin dans אַנְשֵׁי הֶחָיִל
  choice: les hommes vigoureux
  alternative: les êtres forts / les forts
  rationale: Le syntagme hébreu désigne explicitement des hommes; le conserver respecte la forme genrée de la scène métaphorique sans en tirer une affirmation doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Le futur s’accorde au cadre temporel « au jour où » dans le contexte. Les reprises de « où » structurent la série d’images. La ponctuation finale reste ouverte, conformément au fait que le verset appartient à une phrase plus longue.
