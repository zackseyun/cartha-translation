id: ECC.12.7
reference: Ecclesiastes 12:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָשֹׁ֧ב הֶ/עָפָ֛ר עַל הָ/אָ֖רֶץ כְּ/שֶׁ/הָיָ֑ה וְ/הָ/ר֣וּחַ תָּשׁ֔וּב אֶל הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: fr
  text: et la poussière retourne à la terre, comme elle y était, et l’esprit[a] retourne à Dieu qui l’a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle ». Le mot hébreu רוּחַ peut signifier « esprit », « souffle » ou « vent » ; dans ce contexte de mort, « esprit » convient bien, mais « souffle » reste une autre traduction possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: et … retourne
  rationale: L’imparfait qal de שוב exprime ici le résultat inéluctable de la mort dans une formulation poétique à valeur générale. Le présent français garde cette force et conserve la coordination marquée par וְ.
- source_word: הֶעָפָר
  choice: la poussière
  rationale: Le nom défini désigne la matière du corps humain et évoque le langage biblique de la création et de la mortalité.
- source_word: עַל הָאָרֶץ
  choice: à la terre
  rationale: Avec שוב, עַל peut indiquer le lieu vers lequel s’effectue le retour. « À la terre » est naturel en français et respecte l’emploi de אֶרֶץ, sans le remplacer par « sol ».
- source_word: כְּשֶׁהָיָה
  choice: comme elle y était
  rationale: La proposition comparative indique le rétablissement de la poussière dans son état ou sa situation antérieure. Le pronom adverbial « y » rend cette relation clairement et naturellement en français.
- source_word: וְהָרוּחַ
  choice: et l’esprit
  rationale: רוּחַ peut signifier « vent », « souffle » ou « esprit ». Dans le parallélisme entre la poussière corporelle et ce qui retourne à Dieu, « esprit » convient le mieux, tout en laissant « souffle » comme possibilité dans une note.
- source_word: תָּשׁוּב
  choice: retourne
  rationale: La reprise du verbe שוב est conservée afin de rendre le parallélisme poétique entre la poussière et l’esprit.
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: La préposition אֶל indique un mouvement vers Dieu. En français, le nom « Dieu » se construit ici naturellement sans article.
- source_word: אֲשֶׁר נְתָנָהּ
  choice: qui l’a donné
  rationale: La relative présente Dieu comme celui qui a donné l’esprit. Le pronom « l’ » reprend « esprit » et le passé composé est idiomatique en français moderne.
theological_decisions:
- issue: Sens de רוּחַ dans le contexte de la mort humaine
  choice: esprit
  alternative: souffle
  rationale: « Esprit » maintient le contraste entre la poussière du corps et l’aspect non matériel qui retourne à Dieu, sans définir plus précisément l’anthropologie du texte. La polysémie de רוּחַ est préservée par la note.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « retourne » conserve le parallélisme hébreu, et la coordination répétée par « et » respecte le rythme du verset.
