source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: fr
  text: 'Conclusion de l’affaire, maintenant que tout a été entendu : crains Dieu et garde ses commandements, car cela concerne tout être humain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car cela, tout l’être humain ». L’expression hébraïque est très condensée; elle peut aussi se comprendre : « car c’est là tout [ce qui concerne] l’être humain » ou « car c’est là tout le devoir de l’être humain ».'
    reason: L’hébreu כי זה כל־האדם ne précise pas le rapport syntaxique entre « cela » et « tout l’être humain »; la note signale les principales analyses sans faire du mot « devoir », absent du texte, la seule lecture possible.
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: Conclusion de l’affaire
  rationale: Rend l’idée de la fin ou de l’aboutissement du propos dans un français naturel, sans préciser à tort s’il s’agit seulement du livre ou de toute la réflexion.
- source_word: הַכֹּל נִשְׁמָע
  choice: maintenant que tout a été entendu
  rationale: Conserve le passif de נשׁמע et exprime naturellement la circonstance résumant l’examen qui précède.
- source_word: יְרָא
  choice: crains
  rationale: Le verbe ירא désigne ici la crainte révérencielle due à Dieu; « crains » en garde la force et le lien biblique sans le réduire à « respecte ».
- source_word: שְׁמוֹר
  choice: garde
  rationale: « Garder ses commandements » conserve l’image hébraïque de veiller à leur observance tout en restant idiomatique dans le registre biblique français.
- source_word: כָּל־הָאָדָם
  choice: le tout de l’être humain
  rationale: Cette formulation volontairement concise préserve l’énigmatique expression hébraïque, qui ne contient pas de mot équivalant explicitement à « devoir », et évite de limiter האדם aux hommes de sexe masculin.
theological_decisions:
- issue: Portée de כִּי זֶה כָּל־הָאָדָם
  choice: car c’est là le tout de l’être humain
  alternative: car c’est là tout le devoir de l’être humain / car cela concerne tout être humain
  rationale: L’hébreu laisse ouverte la relation exacte entre « cela » et « tout l’être humain ». La traduction ne fournit donc ni « devoir », absent du texte, ni une lecture distributive certaine; une note signale les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier (« crains », « garde ») reproduit les impératifs hébreux au singulier. La légère étrangeté de « le tout de l’être humain » est assumée afin de préserver la densité et l’ambiguïté théologique de la clausule.
