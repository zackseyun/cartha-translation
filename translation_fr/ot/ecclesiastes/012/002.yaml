source:
  edition: WLC
  text: עַ֠ד אֲשֶׁ֨ר לֹֽא תֶחְשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ וְ/הָ/א֔וֹר וְ/הַ/יָּרֵ֖חַ וְ/הַ/כּוֹכָבִ֑ים וְ/שָׁ֥בוּ הֶ/עָבִ֖ים אַחַ֥ר הַ/גָּֽשֶׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/002.yaml
  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: fr
  text: avant que le soleil, la lumière, la lune et les étoiles ne s’obscurcissent[a], et que les nuages ne reviennent après la pluie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne deviennent sombres » ou « ne perdent leur éclat ».'
    reason: Alternative lexicale pour תֶחְשַׁךְ, qui peut décrire le fait de devenir sombre ou de perdre sa luminosité.
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: avant que
  rationale: Dans ce contexte, la tournure introduit ce qui doit arriver auparavant. « Avant que » est naturel en français et convient à la continuité avec le verset précédent.
- source_word: תֶחְשַׁךְ
  choice: ne s’obscurcissent
  rationale: Le qal de חשׁך exprime le fait de devenir sombre ou de perdre son éclat. Le verbe pronominal français garde cette valeur intransitive; « ne » est ici explétif après « avant que » et ne constitue pas une négation.
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Équivalent lexical direct.
- source_word: וְהָאוֹר
  choice: la lumière
  rationale: אוֹר désigne largement la lumière. Ce choix préserve la simplicité et le parallélisme poétique de l’hébreu sans préciser indûment « lumière du jour ».
- source_word: וְהַיָּרֵחַ
  choice: la lune
  rationale: Équivalent lexical direct.
- source_word: וְהַכּוֹכָבִים
  choice: les étoiles
  rationale: Équivalent lexical direct.
- source_word: וְשָׁבוּ
  choice: ne reviennent
  rationale: שׁוב signifie couramment « revenir ». Le subjonctif dépend de « avant que »; le « ne » explétif maintient une formulation française soignée.
- source_word: הֶעָבִים
  choice: les nuages
  rationale: Équivalent lexical direct.
- source_word: אַחַר הַגָּשֶׁם
  choice: après la pluie
  rationale: Expression prépositionnelle directe qui conserve l’image d’un ciel où les nuages reviennent après la pluie.
theological_decisions:
- issue: Portée interprétative de l’obscurcissement cosmique et du retour des nuages
  choice: Conserver l’imagerie poétique sans l’expliquer dans le texte principal.
  alternative: L’expliciter comme métaphore de la vieillesse, du déclin des facultés, des épreuves répétées ou du jugement.
  rationale: Le verset énonce l’image sans en donner lui-même l’interprétation. La traduction préserve donc son ambiguïté et sa tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. L’énumération est conservée, ainsi que la métaphore non explicitée. Le subjonctif avec « avant que » et le « ne » explétif relèvent d’un registre courant soigné.
