  text: בִּקֵּ֣שׁ קֹהֶ֔לֶת לִ/מְצֹ֖א דִּבְרֵי חֵ֑פֶץ וְ/כָת֥וּב יֹ֖שֶׁר דִּבְרֵ֥י אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/010.yaml
  text: Qoheleth sought to find delightful words[b][a], and to write uprightly words of truth.
translation:
  language: fr
  text: 'Qohélet a cherché à trouver des paroles agréables[a], et ce qui a été écrit[b] avec droiture : des paroles de vérité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des paroles plaisantes » ou « des paroles désirables ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture possible : « et il écrivit avec droiture des paroles de vérité ». La syntaxe hébraïque est très compacte.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּקֵּשׁ
  choice: a cherché
  rationale: Le verbe exprime une recherche intentionnelle et appliquée ; « a cherché » en conserve directement la force.
- source_word: קֹהֶלֶת
  choice: Qohélet
  rationale: La translittération maintient la désignation hébraïque distinctive sans la réduire à une fonction particulière comme « le Maître » ou « le Prédicateur ».
- source_word: לִמְצֹא
  choice: à trouver
  rationale: Rendu direct de l’infinitif, naturel en français après « a cherché ».
- source_word: דִּבְרֵי חֵפֶץ
  choice: des paroles agréables
  rationale: חֵפֶץ évoque ce qui procure plaisir, agrément ou satisfaction. « Paroles agréables » est naturel en français et laisse ouverte la nuance de paroles plaisantes ou désirables.
- source_word: וְכָתוּב
  choice: et à écrire
  rationale: Dans cette syntaxe très compacte, la forme peut être comprise dans le prolongement de l’infinitif précédent. Ce rendu produit une phrase française complète tout en signalant en note la lecture participiale possible.
- source_word: יֹשֶׁר
  choice: avec droiture
  rationale: Le nom exprime la rectitude ou le caractère droit. La locution adverbiale « avec droiture » conserve cette nuance éthique et formelle mieux que le seul « correctement ».
- source_word: דִּבְרֵי אֱמֶת
  choice: des paroles de vérité
  rationale: Ce calque intelligible préserve la construction hébraïque et laisse entendre à la fois un contenu vrai et le caractère véridique des paroles.
theological_decisions:
- issue: Identité et rendu de קֹהֶלֶת
  choice: Qohélet, comme désignation translittérée
  alternative: le Maître ; le Prédicateur
  rationale: La translittération évite d’imposer au personnage une fonction précise que le terme hébreu ne tranche pas à lui seul.
- issue: Construction de וְכָתוּב יֹשֶׁר
  choice: « et à écrire avec droiture » dans le prolongement de « a cherché »
  alternative: « et ce qui est écrit avec droiture » ou « et il écrivit avec droiture »
  rationale: La syntaxe hébraïque est resserrée et permet plusieurs analyses. Le texte principal privilégie une formulation française fluide sans effacer l’autre lecture, donnée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Qohélet » conserve la persona littéraire hébraïque ; « avec droiture » maintient une légère solennité adaptée au contexte sapiential.
