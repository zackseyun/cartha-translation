  text: עֵ֥ת לָ/לֶ֖דֶת וְ/עֵ֣ת לָ/מ֑וּת עֵ֣ת לָ/טַ֔עַת וְ/עֵ֖ת לַ/עֲק֥וֹר נָטֽוּעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: fr
  text: Un temps pour naître, et un temps pour mourir ; un temps pour planter, et un temps pour arracher ce qui a été planté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: עֵת désigne un moment ou un temps déterminé. « Un temps » reproduit naturellement le motif répété du poème et convient à chacune des propositions.
- source_word: לָלֶדֶת
  choice: pour naître
  rationale: Dans son opposition à « mourir », l’infinitif renvoie ici au commencement de la vie d’une personne. « Naître » exprime ce sens avec naturel en français tout en maintenant la concision poétique.
- source_word: לָמוּת
  choice: pour mourir
  rationale: מות signifie directement « mourir » et forme l’antithèse naturelle de « naître ».
- source_word: לָטַעַת
  choice: pour planter
  rationale: נטע signifie « planter » ; l’image agricole concrète est conservée.
- source_word: לַעֲקוֹר
  choice: pour arracher
  rationale: עקר signifie retirer en tirant, notamment arracher avec les racines. Dans ce contexte agricole, « arracher » est courant et clair en français moderne.
- source_word: נָטוּעַ
  choice: ce qui a été planté
  rationale: Le participe passif de נטע désigne l’objet de l’arrachage sans préciser de nom. Cette formulation garde cette généralité et rend explicitement l’état résultant de la plantation.
