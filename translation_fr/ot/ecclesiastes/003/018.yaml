  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
translation:
  language: fr
  text: 'Je me suis dit dans mon cœur, au sujet des fils des hommes[a] : Dieu les met à l’épreuve afin qu’ils voient[b] qu’ils sont eux-mêmes des bêtes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres humains »; l’hébreu emploie une expression masculine à valeur représentative.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « et pour voir ». Le sujet de « voir » n’est pas explicitement indiqué; on peut aussi comprendre « pour voir » ou « afin de voir qu’ils sont eux-mêmes des bêtes ».
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Je me suis dit dans mon cœur
  rationale: L’expression hébraïque décrit une réflexion intérieure. Cette formulation garde l’image du cœur tout en restant naturelle en français moderne.
- source_word: עַל דִּבְרַת
  choice: au sujet de
  rationale: La locution introduit ce sur quoi porte la réflexion, sans préciser davantage une nuance causale incertaine.
- source_word: בְּנֵי הָאָדָם
  choice: les fils de l’homme
  rationale: La traduction conserve l’expression masculine hébraïque et sa portée représentative; l’équivalent inclusif est signalé en note.
- source_word: לְבָרָם
  choice: Dieu les met à l’épreuve
  rationale: Le verbe ברר peut exprimer l’action d’éprouver, de vérifier ou d’affiner. « Mettre à l’épreuve » est clair et convient au contexte sans imposer l’idée plus étroite de purification.
- source_word: וְלִרְאוֹת
  choice: pour leur faire voir
  rationale: Littéralement, la forme signifie « et pour voir ». Dans le contexte, elle peut exprimer le but selon lequel les humains doivent prendre conscience de leur condition. La formulation retenue est naturelle, tandis que l’ambiguïté syntaxique est conservée en note.
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: qu’en eux-mêmes, ils sont des bêtes
  rationale: Le prédicat hébreu établit directement l’identité, sans particule comparative. « En eux-mêmes » rend l’effet emphatique des pronoms répétés et de לָהֶם; « des bêtes » conserve la rudesse de l’image.
theological_decisions:
- issue: Portée anthropologique de l’identification des humains aux bêtes
  choice: qu’en eux-mêmes, ils sont des bêtes
  alternative: qu’ils sont comme des bêtes
  rationale: L’hébreu formule un prédicat direct et non une simple comparaison. Dans le raisonnement de Qohélet, cette affirmation souligne la condition mortelle et créaturelle commune, sans qu’il faille l’adoucir ni lui faire nier d’autres distinctions bibliques entre humains et animaux.
- issue: Portée de l’expression masculine בְּנֵי הָאָדָם
  choice: les fils de l’homme
  alternative: les êtres humains
  rationale: La formulation principale reproduit le caractère masculin et représentatif de l’expression source; la note explicite sa portée générique.
- issue: Sujet et valeur de וְלִרְאוֹת
  choice: pour leur faire voir
  alternative: et pour voir; pour qu’ils voient
  rationale: La construction hébraïque permet plusieurs rattachements. Le texte principal exprime naturellement l’idée que Dieu amène les humains à reconnaître leur condition, mais la note maintient les autres analyses possibles.
translation_notes:
  register: Français international moderne, sobre et méditatif. Le tour « dans mon cœur » conserve l’image biblique sans devenir obscur; « mettre à l’épreuve » et « faire voir » restent accessibles, tandis que « des bêtes » préserve la force abrupte du texte.
