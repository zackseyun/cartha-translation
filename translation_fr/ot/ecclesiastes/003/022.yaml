language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: fr
  text: J’ai donc vu qu’il n’y a rien de mieux pour l’homme que de se réjouir de ce qu’il fait, car c’est là sa part. En effet, qui pourra l’amener à voir ce qui sera après lui[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui arrivera quand il ne sera plus ».'
    reason: 'Variante de compréhension : l’hébreu peut viser explicitement les événements qui suivront la disparition de la personne.'
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: J’ai donc vu
  rationale: Le parfait qal à la première personne introduit ici une observation qui découle du raisonnement précédent ; « donc » en rend naturellement la portée conclusive.
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: il n’y a rien de mieux … que de
  rationale: Cette tournure exprime une appréciation comparative caractéristique de Qohélet, sans affirmer que cette joie serait le seul bien possible.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Le singulier hébreu a une portée générique et représentative. « L’homme » conserve cette forme tout en désignant ici l’être humain en général.
- source_word: יִשְׂמַח
  choice: se réjouir
  rationale: L’infinitif après la tournure comparative exprime en français le contenu de ce qui est jugé préférable, sans transformer l’énoncé en commandement.
- source_word: בְּמַעֲשָׂיו
  choice: de ce qu’il fait
  rationale: מַעֲשֶׂה couvre les actes, l’activité et le travail d’une personne. Cette formulation naturelle garde ici cette ampleur mieux que « ses œuvres », susceptible d’évoquer surtout des productions ou une catégorie théologique.
- source_word: חֶלְקוֹ
  choice: sa part
  rationale: חֵלֶק désigne la part attribuée à une personne dans l’existence ; « sa part » conserve ce motif récurrent du livre.
- source_word: מִי יְבִיאֶנּוּ לִרְאוֹת
  choice: qui pourra l’amener à voir
  rationale: Le hiphil de בוא signifie « amener » et la question rhétorique implique l’incapacité humaine, rendue explicitement et naturellement par « pourra ».
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: ce qui sera après lui
  rationale: La formulation proche de l’hébreu préserve l’ambiguïté entre ce qui viendra ultérieurement et ce qui arrivera après la disparition de la personne.
theological_decisions:
- issue: Portée générique de אָדָם au masculin singulier
  choice: l’homme
  alternative: l’être humain
  rationale: « L’homme » maintient le singulier représentatif et la forme masculine du texte source, sans limiter l’application de la maxime aux seuls hommes.
- issue: Sens temporel de אַחֲרָיו
  choice: ce qui sera après lui
  alternative: ce qui arrivera quand il ne sera plus
  rationale: Le texte principal conserve l’indétermination de l’hébreu au sujet de ce qui vient « après » une personne ; l’autre lecture, plus explicitement posthume, est signalée en note plutôt qu’imposée.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste proche de l’argumentation de Qohélet, tandis que « ce qu’il fait » évite le caractère moins naturel ou potentiellement spécialisé de « ses œuvres ».
