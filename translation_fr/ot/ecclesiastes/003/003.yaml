source:
  edition: WLC
  text: עֵ֤ת לַ/הֲרוֹג֙ וְ/עֵ֣ת לִ/רְפּ֔וֹא עֵ֥ת לִ/פְר֖וֹץ וְ/עֵ֥ת לִ/בְנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/003.yaml
  text: a time to kill[a], and a time to heal; a time to tear down[b], and a time to build up.
translation:
  language: fr
  text: Un temps[a] pour tuer et un temps pour guérir ; un temps pour démolir[b] et un temps pour bâtir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un moment », ici et dans les autres occurrences de « un temps ».
    reason: lexical_alternative
  - marker: b
    text: Ou « abattre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: עֵת désigne un temps, un moment ou une occasion déterminée. « Un temps » garde la cadence répétitive du poème et demeure naturel en français.
- source_word: לַהֲרוֹג
  choice: pour tuer
  rationale: Le verbe הרג signifie directement « tuer ». Cette formulation sobre conserve la force du contraste sans atténuer la difficulté du propos.
- source_word: לִרְפּוֹא
  choice: pour guérir
  rationale: רפא signifie couramment « guérir ». Le verbe français convient aussi bien au rétablissement d’une personne qu’à l’idée plus générale de restauration.
- source_word: לִפְרֹוץ
  choice: pour démolir
  rationale: פרץ peut exprimer l’action de briser, d’ouvrir une brèche ou d’abattre. Face à « bâtir », « démolir » rend clairement l’idée de destruction d’un ouvrage.
- source_word: לִבְנוֹת
  choice: pour bâtir
  rationale: בנה signifie « bâtir, construire ». « Bâtir » forme en français une antithèse concise et naturelle avec « démolir ».
theological_decisions:
- issue: Faut-il atténuer « tuer » afin d’éviter l’apparence d’une approbation morale ?
  choice: Conserver « tuer » comme élément descriptif de l’inventaire poétique de Qohélet.
  alternative: Mettre à mort.
  rationale: Le verset énumère des réalités et leurs temps respectifs sans déclarer explicitement que toute action citée est moralement approuvée. Atténuer le verbe supprimerait une tension présente dans l’hébreu.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure elliptique sans « il y a » suit de près l’hébreu et maintient le rythme des couples antithétiques.
