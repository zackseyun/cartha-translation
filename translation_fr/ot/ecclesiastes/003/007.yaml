  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: fr
  text: un temps pour déchirer[a], et un temps pour coudre ; un temps pour se taire[b], et un temps pour parler ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut évoquer le geste de déchirer ses vêtements en signe de deuil, de stupeur ou de profonde détresse, mais l’hébreu ne précise pas ce qui est déchiré.
    reason: cultural_note
  - marker: b
    text: Ou « un temps pour garder le silence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: Le nom désigne un moment ou une période. « Un temps » est naturel en français et conserve la cadence répétitive du poème.
- source_word: לִקְרוֹעַ
  choice: déchirer
  rationale: Le verbe signifie « déchirer », souvent à propos de vêtements. La traduction reste générale puisque l’objet n’est pas exprimé en hébreu.
- source_word: לִתְפּוֹר
  choice: coudre
  rationale: Le verbe signifie directement « coudre ». Ce choix préserve l’opposition concise avec « déchirer » sans préciser qu’il s’agit nécessairement de réparer.
- source_word: לַחֲשׁוֹת
  choice: se taire
  rationale: Le verbe exprime le fait de demeurer silencieux. « Se taire » est idiomatique, sobre et convient au parallélisme avec « parler ».
- source_word: לְדַבֵּר
  choice: parler
  rationale: Le verbe courant signifie « parler ». Ce choix restitue clairement l’antithèse avec le silence.
