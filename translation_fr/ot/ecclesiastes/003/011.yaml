language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל עָשָׂ֖ה יָפֶ֣ה בְ/עִתּ֑/וֹ גַּ֤ם אֶת הָ/עֹלָם֙ נָתַ֣ן בְּ/לִבָּ֔/ם מִ/בְּלִ֞י אֲשֶׁ֧ר לֹא יִמְצָ֣א הָ/אָדָ֗ם אֶת הַֽ/מַּעֲשֶׂ֛ה אֲשֶׁר עָשָׂ֥ה הָ/אֱלֹהִ֖ים מֵ/רֹ֥אשׁ וְ/עַד סֽוֹף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: fr
  text: Il a fait toute chose belle en son temps. Il a aussi mis l’éternité dans leur cœur[a], sans que l’être humain puisse toutefois découvrir l’œuvre que Dieu a accomplie du commencement à la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde », « la durée » ou « le cours des âges ». Le mot hébreu est difficile ici et peut désigner la perception de toute l’étendue du temps ou du monde au-delà de l’expérience immédiate.
    reason: Alternative lexicale pour le terme hébreu הָעֹלָם, dont le sens est débattu dans ce verset.
lexical_decisions:
- source_word: הַכֹּל
  choice: toute chose
  rationale: Cette expression rend la totalité visée tout en restant naturelle avec le singulier collectif du contexte.
- source_word: יָפֶה
  choice: belle
  rationale: Le mot peut évoquer aussi bien la beauté que le caractère approprié ou harmonieux. « Belle » conserve cette richesse sans réduire le sens à la seule convenance.
- source_word: בְעִתּוֹ
  choice: en son temps
  rationale: Cette formulation concise reprend le thème des temps déterminés qui structure le passage et conserve le suffixe singulier de l’hébreu.
- source_word: הָעֹלָם
  choice: l’éternité
  rationale: Le terme est difficile ici. « L’éternité » exprime une conscience qui dépasse l’instant présent et s’accorde avec l’incapacité humaine à saisir toute l’œuvre divine, sans éliminer les autres sens possibles signalés en note.
- source_word: בְּלִבָּם
  choice: dans leur cœur
  rationale: Dans l’anthropologie hébraïque, le cœur désigne la vie intérieure, notamment la pensée et la volonté. La formulation conserve le possessif pluriel et le nom singulier du texte.
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: sans que … puisse toutefois
  rationale: Cette tournure française exprime la limitation introduite par la construction hébraïque, tandis que « toutefois » fait entendre le contraste contextuel.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le nom est générique et désigne ici l’humanité dans sa condition limitée. « L’être humain » conserve le singulier représentatif sans suggérer que seuls les hommes sont concernés.
- source_word: יִמְצָא
  choice: découvrir
  rationale: Dans ce contexte, le verbe renvoie au fait de parvenir à connaître ou à retracer l’activité divine, non à une simple découverte matérielle.
- source_word: הַמַּעֲשֶׂה
  choice: l’œuvre
  rationale: Le singulier désigne globalement l’activité de Dieu. « L’œuvre » est clair, digne et adapté au contexte.
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: du commencement à la fin
  rationale: Cette expression restitue le mérisme hébreu qui indique une totalité sans limite intermédiaire.
theological_decisions:
- issue: Sens de הָעֹלָם en rapport avec la connaissance humaine et la souveraineté divine
  choice: « l’éternité » dans le texte principal
  alternative: « le monde », « la durée » ou « le cours des âges »
  rationale: « L’éternité » maintient la tension entre l’ouverture de l’être humain à une réalité qui dépasse le présent et son incapacité à saisir entièrement l’œuvre de Dieu. La note conserve les principales possibilités lexicales sans trancher de manière dogmatique.
translation_notes:
  register: Français international actuel, clair et digne. « En son temps » conserve l’écho poétique du passage; « l’être humain » exprime naturellement la portée générique de הָאָדָם.
