  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: fr
  text: Je sais que tout ce que Dieu fait subsistera pour toujours. On ne peut rien y ajouter ni rien en retrancher. Dieu a fait cela afin qu’on le craigne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’on éprouve de la crainte devant lui ». Le verbe hébreu peut exprimer à la fois la crainte et un profond respect.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Je sais
  rationale: Le qal accompli à la première personne exprime ici une constatation acquise dont le résultat demeure; le présent français est naturel.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: tout ce que Dieu fait
  rationale: Cette formulation conserve la portée universelle de כָּל אֲשֶׁר et rend naturellement l’action habituelle ou générale exprimée dans le contexte.
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: subsistera pour toujours
  rationale: « Subsister » exprime de façon idiomatique la permanence de l’œuvre divine sans surinterpréter la nature de cette permanence.
- source_word: עָלָיו אֵין לְהוֹסִיף וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: On ne peut rien y ajouter ni rien en retrancher
  rationale: La tournure française rend clairement l’impossibilité d’ajouter à l’œuvre de Dieu ou d’en retirer quoi que ce soit, tout en conservant le parallélisme.
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: Dieu agit ainsi
  rationale: L’accompli hébreu présente l’action de Dieu comme établie. « Agit ainsi » relie naturellement cette action à sa finalité, sans limiter le propos à un seul acte passé.
- source_word: שֶׁיִּרְאוּ מִלְּפָנָיו
  choice: afin qu’on le craigne
  rationale: Le français indéfini « on » rend le sujet humain non exprimé du verbe. « Craindre » conserve la valeur forte de ירא, tandis que le pronom « le » évite une formulation française pesante.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: craindre
  alternative: éprouver du respect devant lui / le révérer
  rationale: ירא peut inclure peur, respect et révérence. Le texte principal garde « craindre » afin de préserver toute la tension théologique du terme, tandis que la note explicite sa nuance possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en évitant les calques peu naturels. Le marqueur [a] est placé immédiatement après l’expression concernée.
