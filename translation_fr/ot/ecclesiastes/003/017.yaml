base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: fr
  text: 'Je me suis dit dans mon cœur : « Dieu jugera le juste et le méchant, car il y a là un temps pour toute affaire et pour toute œuvre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour tout dessein et pour tout acte ». Les mots hébreux ont un champ de sens étendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Je me suis dit dans mon cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme lieu de la réflexion intérieure, tout en restant claire et naturelle en français moderne.
- source_word: הַצַּדִּיק וְאֶת הָרָשָׁע
  choice: le juste et le méchant
  rationale: Les deux adjectifs substantivés désignent les personnes caractérisées respectivement par la justice et la méchanceté. La formulation maintient leur opposition morale sans la réduire à une culpabilité strictement juridique.
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  choice: Dieu jugera
  rationale: Dans ce contexte, l’inaccompli exprime l’attente d’un jugement divin à venir. Le futur français rend directement cette conclusion de Qohélet.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le fondement de l’affirmation précédente. « Car » marque sobrement ce rapport explicatif.
- source_word: עֵת
  choice: un temps
  rationale: Ce choix reprend le vocabulaire thématique du chapitre, consacré au temps propre à chaque réalité, sans préciser davantage que l’hébreu s’il s’agit d’un temps fixé.
- source_word: לְכָל חֵפֶץ
  choice: pour toute affaire
  rationale: חֵפֶץ peut désigner un désir, un dessein, une activité ou une affaire. « Toute affaire » convient au contexte tout en évitant de réduire le terme à une intention subjective.
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: et pour toute œuvre
  rationale: מַעֲשֶׂה désigne ce qui est fait, une œuvre ou un acte. « Œuvre » préserve l’étendue du terme, qui ne se limite pas nécessairement à un acte moral isolé.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe signifie littéralement « là ». Le conserver en fin de proposition respecte sa position dans le texte hébreu et maintient l’ambiguïté de son référent.
theological_decisions:
- issue: Rapport de l’adverbe final שָׁם avec le jugement de Dieu
  choice: Maintenir l’adverbe sous la forme « là » à la fin de la phrase.
  alternative: Omettre l’adverbe; le rendre par « alors »; ou expliciter « au lieu du jugement » ou « devant Dieu ».
  rationale: Le texte hébreu comporte expressément שָׁם, mais son référent et sa fonction sont difficiles à déterminer. « Là » peut évoquer le lieu ou l’occasion du jugement divin. Une explicitation trancherait une ambiguïté que le texte ne résout pas.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore du cœur et l’adverbe final difficile sont conservés; les notes signalent les principales possibilités lexicales sans imposer une interprétation.
