id: ECC.3.1
reference: Ecclesiastes 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַ/כֹּ֖ל זְמָ֑ן וְ/עֵ֥ת לְ/כָל חֵ֖פֶץ תַּ֥חַת הַ/שָּׁמָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: fr
  text: Pour tout, il y a un moment fixé, et un temps pour chaque chose[a] sous le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque activité », « chaque affaire » ou « chaque projet ». Le mot hébreu a ici un sens large et peut aussi évoquer ce qui est voulu ou recherché.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  choice: pour tout
  rationale: Cette formulation rend la portée globale de לְ avec כֹּל et reste naturelle en français.
- source_word: זְמָן
  choice: un moment fixé
  rationale: זְמָן désigne un temps déterminé ou approprié. « Moment fixé » conserve cette nuance et le distingue de עֵת dans le membre parallèle.
- source_word: וְעֵת
  choice: et un temps
  rationale: עֵת est le terme courant pour un temps ou une occasion. « Temps » rend simplement le mot tout en maintenant le parallélisme poétique.
- source_word: לְכָל חֵפֶץ
  choice: pour chaque chose[a]
  rationale: חֵפֶץ possède ici un sens large pouvant couvrir une chose, une affaire, une activité ou un projet. « Chaque chose » convient au vaste éventail d’événements énumérés aux versets suivants sans imposer une idée forte de finalité.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: sous le ciel
  rationale: « Sous le ciel » est l’expression française naturelle pour le domaine terrestre visé. Le singulier idiomatique français ne nie pas la forme plurielle du nom hébreu.
theological_decisions:
- issue: Faut-il rendre חֵפֶץ par « but » et affirmer ainsi une intention providentielle explicite pour chaque événement ?
  choice: chaque chose
  alternative: chaque but
  rationale: Le nom hébreu peut évoquer ce qui est voulu ou poursuivi, mais il peut aussi désigner plus largement une affaire ou une activité. La traduction retenue préserve cette amplitude et laisse au contexte plus large la détermination de la portée théologique.
translation_notes:
  register: Français international actuel, sobre et poétique. Le parallélisme « moment fixé… temps » distingue les deux termes hébreux sans alourdir la phrase. Le marqueur [a] est placé après l’expression correspondant réellement à חֵפֶץ.
