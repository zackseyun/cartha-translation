  text: וְ/ע֥וֹד רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ מְק֤וֹם הַ/מִּשְׁפָּט֙ שָׁ֣מָּ/ה הָ/רֶ֔שַׁע וּ/מְק֥וֹם הַ/צֶּ֖דֶק שָׁ֥מָּ/ה הָ/רָֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: fr
  text: J’ai aussi vu, sous le soleil, que, dans le lieu du jugement, il y avait la méchanceté, et que, dans le lieu de la droiture[a], il y avait la méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice ». L’hébreu emploie ici un autre mot (צֶדֶק) que dans la proposition précédente (מִשְׁפָּט), bien que leurs sens se recoupent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֥וֹד
  choice: J’ai encore
  rationale: Introduit une observation supplémentaire. « Encore » rend naturellement la valeur additive sans alourdir la phrase.
- source_word: רָאִיתִי
  choice: vu
  rationale: Conserve le caractère concret et expérientiel du témoignage de Qohélet.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression caractéristique de l’Ecclésiaste, exacte et idiomatique en français.
- source_word: מְקוֹם הַמִּשְׁפָּט
  choice: au lieu où devait régner la justice
  rationale: מִשְׁפָּט désigne ici la justice dans son cadre institutionnel ou judiciaire. L’ajout implicatif « devait régner » exprime naturellement en français le contraste entre la vocation du lieu et ce qui s’y trouve, sans réduire le terme à un tribunal précis.
- source_word: שָׁמָּה
  choice: il y avait
  rationale: Rend la fonction prédicative de « là » par une tournure existentielle française naturelle.
- source_word: הָרֶשַׁע
  choice: la méchanceté
  rationale: Préserve le nom abstrait et la dénonciation morale du texte; le contexte judiciaire lui donne aussi une nuance d’injustice.
- source_word: וּמְקוֹם הַצֶּדֶק
  choice: et qu’au lieu où devait régner la droiture
  rationale: « Droiture » distingue צֶדֶק de מִשְׁפָּט tout en conservant son sens moral plus large.
- source_word: הָרָשַׁע
  choice: la méchanceté
  rationale: Le parallélisme avec הָרֶשַׁע favorise le sens abstrait, malgré une forme pouvant aussi évoquer « le méchant ».
theological_decisions:
- issue: Rendu de צֶדֶק par rapport à מִשְׁפָּט
  choice: droiture
  alternative: justice
  rationale: Les deux mots hébreux ont des sens qui se recoupent, mais leur distinction mérite d’être conservée. « Droiture » maintient la dimension morale de צֶדֶק; « justice » reste une traduction contextuelle possible et figure en note.
- issue: Interprétation de הָרָשַׁע dans le second membre
  choice: la méchanceté
  alternative: le méchant
  rationale: Le parallélisme étroit avec le premier הָרֶשַׁע appuie le nom abstrait. La lecture personnelle demeure grammaticalement envisageable, mais elle romprait la symétrie rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « il y avait la méchanceté » est maintenue pour préserver l’insistance et le parallélisme de l’hébreu.
