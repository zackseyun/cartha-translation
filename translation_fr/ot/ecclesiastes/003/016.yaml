  to: J’ai aussi vu, sous le soleil, que, dans le lieu du jugement, il y avait la méchanceté, et que, dans le lieu de la droiture[a], il y avait la méchanceté.
  rationale: La révision supprime l’implication ajoutée par « devait régner » et rend explicitement les deux syntagmes de lieu du texte source. « J’ai aussi vu » exprime naturellement la valeur additive de וְעוֹד sans suggérer nécessairement la répétition temporelle. La répétition de « il y avait la méchanceté » préserve l’insistance et le parallélisme du verset.
