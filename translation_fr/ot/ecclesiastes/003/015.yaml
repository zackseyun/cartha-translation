source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָה֙ כְּבָ֣ר ה֔וּא וַ/אֲשֶׁ֥ר לִ/הְי֖וֹת כְּבָ֣ר הָיָ֑ה וְ/הָ/אֱלֹהִ֖ים יְבַקֵּ֥שׁ אֶת נִרְדָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: fr
  text: Ce qui a été existe déjà, et ce qui sera a déjà été ; Dieu recherche ce qui a été chassé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu recherche ce qui est poursuivi » ; ou encore : « Dieu demande des comptes au passé. » La dernière proposition est difficile en hébreu : elle peut désigner ce qui a été chassé ou ce qui est poursuivi, et peut aussi évoquer ce qui est passé.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Ce qui a été
  rationale: Cette tournure générale désigne l’ensemble des réalités ou des événements antérieurs et garde la formulation abstraite de l’hébreu.
- source_word: כְּבָר
  choice: déjà
  rationale: « Déjà » exprime l’antériorité et maintient le parallélisme concis des deux propositions.
- source_word: הוּא
  choice: existe
  rationale: Le pronom est prédicatif dans une proposition sans verbe. « Existe » produit une phrase française naturelle tout en exprimant que ce qui a été est déjà présent dans l’ordre des choses.
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: ce qui doit être
  rationale: Cette expression conserve la perspective tournée vers ce qui est destiné à advenir, sans réduire la formulation au seul futur grammatical.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne Dieu et se traduit naturellement ainsi en français.
- source_word: יְבַקֵּשׁ
  choice: recherche
  rationale: « Recherche » conserve le sens lexical fondamental de בקשׁ sans imposer les possibles nuances judiciaires ou restauratrices.
- source_word: אֶת נִרְדָּף
  choice: ce qui a été chassé
  rationale: Le participe passif de רדף peut désigner ce qui est poursuivi ou chassé. Cette traduction préserve sa valeur passive et s’accorde avec le contexte des réalités qui passent et reviennent.
theological_decisions:
- issue: Sens de וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף
  choice: Dieu recherche ce qui a été chassé
  alternative: Dieu recherche ce qui est poursuivi ; Dieu demande compte du passé
  rationale: La proposition hébraïque est très condensée et son sens exact reste incertain. Le texte principal demeure proche des valeurs lexicales, tandis que la note signale les lectures qui orienteraient davantage le passage vers la poursuite, le retour du passé ou le jugement.
translation_notes:
  register: Français moderne, international et digne, avec une structure aphoristique concise. Le point-virgule conserve l’articulation de la maxime, et la note maintient l’ambiguïté réelle de la dernière proposition.
