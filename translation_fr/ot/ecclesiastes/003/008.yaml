  text: a time to love[a], and a time to hate; a time for war[c][b], and a time for peace.
translation:
  language: fr
  text: un temps pour aimer[a] et un temps pour haïr[b] ; un temps de guerre et un temps de paix[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une saison ». Le mot hébreu עֵת peut désigner un moment ou une période ; « un temps » convient le mieux à la cadence répétée du poème.
    reason: lexical_alternative
  - marker: b
    text: « Haïr » traduit directement le verbe hébreu. Dans ce contexte sapientiel, il peut exprimer une forte aversion ou opposition en contraste avec l’amour, sans désigner nécessairement une malveillance coupable.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu שָׁלוֹם peut aussi signifier « bien-être » ou « intégrité » ; son contraste avec la guerre favorise ici « paix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: עֵת désigne un moment ou une période. « Un temps » est naturel en français et conserve la cadence répétitive du poème ; « une saison » reste possible.
- source_word: לֶאֱהֹב
  choice: aimer
  rationale: L’infinitif construit de אָהֵב exprime directement l’action d’aimer dans la formule « un temps pour… ».
- source_word: לִשְׂנֹא
  choice: haïr
  rationale: שָׂנֵא signifie ordinairement « haïr ». Ce choix préserve l’antithèse forte avec « aimer » sans l’atténuer par une paraphrase interprétative.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: מִלְחָמָה désigne ici la guerre ou le conflit armé ; « la guerre » forme en français le contraste le plus direct avec « la paix ».
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut aussi évoquer le bien-être ou l’intégrité, mais son opposition immédiate à la guerre privilégie ici le sens de « paix ».
theological_decisions:
- issue: Portée morale de « haïr » dans le contraste sapientiel
  choice: Conserver « haïr » dans le texte principal sans l’adoucir.
  alternative: Paraphraser par « ne pas aimer » ou « s’opposer à ».
  rationale: Le verset énumère les temps contrastés de l’existence plutôt qu’il ne formule un commandement moral absolu invitant à la haine. Maintenir l’antithèse abrupte respecte la poésie hébraïque et préserve sa tension sans imposer une résolution interprétative.
translation_notes:
  register: Français international moderne, simple et digne. La structure parallèle « un temps pour… » reproduit la cadence de l’hébreu. Les articles devant « guerre » et « paix » sont idiomatiques en français.
