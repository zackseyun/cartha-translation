lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: Le nom désigne un moment ou une occasion déterminée. « Un temps » est naturel en français et préserve la cadence répétitive du poème.
- source_word: בקשׁ
  choice: chercher
  rationale: Le piel לְבַקֵּשׁ signifie couramment « chercher ». Ce choix est concis et maintient le parallélisme poétique.
- source_word: אבד
  choice: perdre
  rationale: Dans son opposition à « chercher », l’infinitif לְאַבֵּד se comprend naturellement comme « perdre », tout en évitant de préciser indûment s’il s’agit d’une perte involontaire ou d’un abandon comme perdu.
- source_word: שׁמר
  choice: garder
  rationale: Face à « jeter », שׁמר exprime ici naturellement l’idée de conserver ce que l’on possède.
- source_word: השליך
  choice: jeter
  rationale: Le hiphil de שלך signifie « jeter » ou « rejeter ». « Jeter » est actuel, direct et forme une opposition nette avec « garder ».
