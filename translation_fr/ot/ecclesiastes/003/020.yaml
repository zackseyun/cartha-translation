source:
  edition: WLC
  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: fr
  text: Tous vont vers un même lieu. Tous sont issus de la poussière[a], et tous retournent à la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « Tout était de la poussière. » « Sont issus de la poussière » exprime naturellement l’idée d’origine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: tous
  rationale: Dans le contexte immédiat, le terme englobe les humains et les animaux. « Tous » convient à ces êtres animés et conserve la répétition ainsi que la portée universelle de l’hébreu.
- source_word: הוֹלֵךְ
  choice: vont
  rationale: Le participe exprime ici une réalité générale. Le présent simple est naturel en français dans cette affirmation sentencieuse.
- source_word: מָקוֹם אֶחָד
  choice: au même endroit
  rationale: Littéralement « vers un seul endroit ». « Au même endroit » rend clairement l’idée contextuelle d’une destination commune sans préciser davantage sa nature.
- source_word: הָיָה מִן הֶעָפָר
  choice: viennent de la poussière
  rationale: Le verbe signifie littéralement « était », mais la construction indique ici l’origine. « Viennent de » est idiomatique et maintient le parallélisme avec « retournent à ».
- source_word: עָפָר
  choice: poussière
  rationale: « Poussière » est le rendu traditionnel et précis dans ce contexte de mortalité, avec un écho à Genèse 3.19.
- source_word: שָׁב אֶל הֶעָפָר
  choice: retournent à la poussière
  rationale: « Retournent » exprime naturellement le mouvement inverse vers l’origine et rend précisément שׁוב.
theological_decisions:
- issue: Portée anthropologique de « tous »
  choice: Le verset affirme la mortalité commune des humains et des animaux.
  alternative: Limiter « tous » aux seuls humains, ou y voir une négation de toute distinction après la mort.
  rationale: Ecclésiaste 3.18-21 compare les humains aux animaux et souligne leur sort commun dans la mort. La traduction conserve cette observation sans lui faire trancher une question sur l’au-delà que ce verset ne résout pas.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « tous » et le parallélisme origine-retour sont conservés. « Au même endroit » est plus idiomatique que « vers un seul endroit » tout en préservant l’idée d’une destination commune.
