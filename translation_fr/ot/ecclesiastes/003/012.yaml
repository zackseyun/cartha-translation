source:
  edition: WLC
  text: יָדַ֕עְתִּי כִּ֛י אֵ֥ין ט֖וֹב בָּ֑/ם כִּ֣י אִם לִ/שְׂמ֔וֹחַ וְ/לַ/עֲשׂ֥וֹת ט֖וֹב בְּ/חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/012.yaml
  text: I know that there is nothing better for them than to rejoice and to do good during their lives[a].
translation:
  language: fr
  text: Je sais qu’il n’y a rien de mieux pour eux que de se réjouir et de faire le bien au cours de leur vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et de se faire du bien » ou « et de connaître le bien-être » ; l’expression hébraïque peut être comprise au sens éthique (« faire le bien ») ou au sens expérientiel (« se faire du bien, profiter de la vie »).
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Je sais
  rationale: Le parfait qal à la première personne du singulier exprime ici un savoir acquis et présent; « Je sais » convient au caractère réflexif de l’affirmation.
- source_word: אֵין טוֹב בָּם
  choice: il n’y a rien de mieux pour eux
  rationale: Dans ce contexte, la tournure difficile est comprise de façon idiomatique et comparative, plutôt que comme l’affirmation qu’aucun bien ne se trouve en eux.
- source_word: כִּי אִם
  choice: que
  rationale: Après « rien de mieux », « que » rend naturellement la valeur exceptive et comparative de la locution.
- source_word: לִשְׂמוֹחַ
  choice: se réjouir
  rationale: Ce choix conserve la force verbale de שׂמח ainsi que le registre méditatif du passage.
- source_word: וְלַעֲשׂוֹת טוֹב
  choice: et de faire le bien
  rationale: C’est le sens lexical direct de la locution, tout en maintenant dans une note son possible sens expérientiel dans l’Ecclésiaste.
- source_word: בְּחַיָּיו
  choice: au cours de leur vie
  rationale: L’hébreu porte littéralement un suffixe singulier (« sa vie »), mais le référent précédent est pluriel; le français emploie ici un singulier distributif naturel.
theological_decisions:
- issue: Sens de וְלַעֲשׂוֹת טוֹב dans l’Ecclésiaste
  choice: 'sens éthique : « faire le bien »'
  alternative: 'sens expérientiel : « se faire du bien », « profiter de la vie » ou « connaître le bien-être »'
  rationale: La locution hébraïque permet directement le sens éthique, mais le contexte et l’usage de טוֹב dans l’Ecclésiaste autorisent aussi une lecture expérientielle. La note conserve cette ambiguïté réelle sans trancher silencieusement.
translation_notes:
  register: Français moderne international, naturel et digne. La formulation reste proche de la structure hébraïque tout en employant l’expression française idiomatique « rien de mieux… que ». Le marqueur de note [a] figure dans le texte.
