  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ מִקְרֶ֨ה בְֽנֵי הָ/אָדָ֜ם וּ/מִקְרֶ֣ה הַ/בְּהֵמָ֗ה וּ/מִקְרֶ֤ה אֶחָד֙ לָ/הֶ֔ם כְּ/מ֥וֹת זֶה֙ כֵּ֣ן מ֣וֹת זֶ֔ה וְ/ר֥וּחַ אֶחָ֖ד לַ/כֹּ֑ל וּ/מוֹתַ֨ר הָ/אָדָ֤ם מִן הַ/בְּהֵמָה֙ אָ֔יִן כִּ֥י הַ/כֹּ֖ל הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: fr
  text: 'Car le sort des êtres humains et celui des animaux est le même pour eux : comme meurt l’un, ainsi meurt l’autre. Tous ont un même souffle[a]. L’être humain n’a aucun avantage sur l’animal, car tout est vapeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un même esprit ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ».
    reason: Alternative lexicale préservant l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: מִקְרֶה
  choice: sort
  rationale: « Sort » exprime naturellement en français ce qui échoit aux humains et aux animaux, ici leur issue commune dans la mort.
- source_word: בְנֵי הָאָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque désigne collectivement les humains. « Les êtres humains » est actuel, précis et évite en français l’ambiguïté de « fils de l’homme », souvent comprise comme un titre.
- source_word: הַבְּהֵמָה
  choice: les animaux / l’animal
  rationale: Le singulier hébreu a une valeur collective. Le pluriel dans la première proposition est naturel en français, tandis que le singulier maintient ensuite le contraste représentatif avec l’être humain.
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: est le même pour eux
  rationale: Cette formulation française rend l’idée du sort unique et commun sans la lourdeur de « un seul sort pour eux ».
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: comme meurt l’un, ainsi meurt l’autre
  rationale: La tournure conserve le parallélisme équilibré des démonstratifs hébreux et souligne une mortalité identique.
- source_word: רוּחַ
  choice: souffle
  rationale: Dans ce contexte de vie et de mort partagée par humains et animaux, « souffle » convient au souffle vital tout en laissant « esprit » comme possibilité lexicale signalée en note.
- source_word: אֶחָד לַכֹּל
  choice: Tous ont un même souffle
  rationale: Cette construction est idiomatique en français et conserve à la fois l’unité du souffle et l’étendue universelle de לַכֹּל.
- source_word: מוֹתַר
  choice: avantage
  rationale: « Avantage » rend clairement le gain ou la supériorité que le texte nie ici à l’être humain.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le singulier générique contraste avec l’animal collectif. « L’être humain » préserve ce contraste sans restreindre le propos aux hommes de sexe masculin.
- source_word: הַכֹּל
  choice: tout
  rationale: « Tout » garde la portée générale et la brièveté proverbiale de l’hébreu.
- source_word: הָבֶל
  choice: vapeur
  rationale: « Vapeur » conserve l’image concrète de ce qui est fugitif, insaisissable et sans consistance, au lieu de réduire le terme à la seule idée de vanité.
theological_decisions:
- issue: Sens de רוּחַ dans la comparaison entre humains et animaux
  choice: souffle
  alternative: esprit
  rationale: Le contexte immédiat porte sur leur mortalité commune. « Souffle » maintient cette perspective observable sans trancher implicitement une question d’anthropologie théologique; la possibilité « esprit » est conservée en note.
- issue: Portée de אָדָם / בְנֵי הָאָדָם
  choice: les êtres humains… l’être humain
  alternative: les fils de l’homme… l’homme
  rationale: Ici, les expressions désignent l’humanité en général. En français moderne, « fils de l’homme » risque d’être entendu comme un titre christologique et « l’homme » comme spécifiquement masculin; le sens générique est donc rendu explicitement.
- issue: Portée de l’absence d’avantage humain
  choice: énoncé maintenu sans qualification
  alternative: expliciter « face à la mort »
  rationale: Le contexte indique que l’affirmation concerne le sort mortel commun, mais l’hébreu formule la conclusion de manière absolue. La traduction n’ajoute donc pas une restriction absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique et proverbial est conservé. « Vapeur » maintient la métaphore directrice de Qohélet; « êtres humains » évite le calque potentiellement trompeur « fils de l’homme ».
