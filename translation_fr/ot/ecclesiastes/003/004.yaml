  text: עֵ֤ת לִ/בְכּוֹת֙ וְ/עֵ֣ת לִ/שְׂח֔וֹק עֵ֥ת סְפ֖וֹד וְ/עֵ֥ת רְקֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/004.yaml
  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: fr
  text: Un temps pour pleurer[a], et un temps pour rire ; un temps pour se lamenter[b], et un temps pour danser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un moment », ici et dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: Ou « porter le deuil » ; le verbe peut désigner une lamentation, notamment funéraire.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: עֵת désigne un temps, un moment ou une occasion. « Un temps » est direct, idiomatique et conserve le rythme répétitif du poème.
- source_word: לִבְכּוֹת
  choice: pleurer
  rationale: L’infinitif de בכה signifie « pleurer ». Ce choix naturel forme une antithèse nette avec « rire ».
- source_word: לִשְׂחוֹק
  choice: rire
  rationale: שׂחק signifie ici le plus directement « rire » ; cette traduction préserve l’opposition avec les pleurs.
- source_word: סְפוֹד
  choice: se lamenter
  rationale: ספד évoque le fait de se lamenter ou de porter le deuil, souvent dans un contexte funéraire. « Se lamenter » conserve le caractère verbal et distingue ce terme du simple fait de pleurer.
- source_word: רְקוֹד
  choice: danser
  rationale: רקד signifie « danser ». Le choix maintient la série d’infinitifs et le contraste avec la lamentation.
