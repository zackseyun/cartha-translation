  text: מַה יִּתְרוֹן֙ הָֽ/עוֹשֶׂ֔ה בַּ/אֲשֶׁ֖ר ה֥וּא עָמֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/009.yaml
  text: What profit has the worker from that in which he labors?[a]
translation:
  language: fr
  text: Quel profit celui qui travaille retire-t-il de la peine qu’il se donne ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel avantage celui qui agit retire-t-il de ce à quoi il peine ? »
    reason: Cette formulation plus littérale conserve la distinction entre עשה (« faire, agir ») et עמל (« peiner, travailler péniblement »), ainsi que la relation relativement ouverte exprimée par בַּאֲשֶׁר.
lexical_decisions:
- source_word: מַה
  choice: Quel
  rationale: Introduit directement la question rhétorique et s’accorde naturellement avec « profit ».
- source_word: יִתְרוֹן
  choice: profit
  rationale: Terme clé de l’Ecclésiaste, il évoque le bénéfice ou l’excédent durable que le travail pourrait procurer.
- source_word: הָעֹשֶׂה
  choice: celui qui travaille
  rationale: Le participe signifie littéralement « celui qui fait ». Associé ici à עמל, il désigne naturellement la personne qui accomplit un travail.
- source_word: בַּאֲשֶׁר
  choice: de
  rationale: Dans la tournure française « retirer un profit de », cette préposition exprime naturellement la source du profit tout en rendant la relation indiquée par בַּאֲשֶׁר.
- source_word: הוּא
  choice: celui qui
  rationale: La construction française reprend le sujet humain sans alourdir la phrase par un pronom masculin supplémentaire.
- source_word: עָמֵל
  choice: toute sa peine
  rationale: Le terme évoque un labeur pénible, et non la seule activité de travailler. « Peine » conserve cette nuance caractéristique de l’Ecclésiaste; « toute » rend ici idiomatiquement l’ensemble du labeur, sans prétendre correspondre à un quantificateur hébreu explicite.
theological_decisions:
- issue: Masculin singulier représentatif
  choice: celui qui travaille… sa peine
  alternative: la personne qui travaille… sa peine
  rationale: Le masculin singulier générique maintient la forme représentative de l’hébreu tout en restant naturel en français moderne.
translation_notes:
  register: Français moderne, courant et digne. La formulation garde la concision de la question rhétorique et le terme récurrent « profit », tout en faisant entendre la pénibilité du labeur.
