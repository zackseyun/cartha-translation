  text: מִ֣י יוֹדֵ֗עַ ר֚וּחַ בְּנֵ֣י הָ/אָדָ֔ם הָ/עֹלָ֥ה הִ֖יא לְ/מָ֑עְלָ/ה וְ/ר֨וּחַ֙ הַ/בְּהֵמָ֔ה הַ/יֹּרֶ֥דֶת הִ֖יא לְ/מַ֥טָּה לָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: fr
  text: Qui sait si le souffle des êtres humains s’élève vers le haut[a] et si le souffle de l’animal descend vers le bas, jusqu’à la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit » au lieu de « le souffle » dans les deux occurrences. Le mot hébreu רוּחַ peut recouvrir ici plusieurs sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Qui sait
  rationale: Rend directement la question rhétorique et préserve l’incertitude épistémique du texte.
- source_word: רוּחַ
  choice: souffle
  rationale: Dans le contexte immédiat de la mortalité commune aux humains et aux animaux, « souffle » exprime naturellement le principe vital sans imposer une distinction métaphysique; « esprit » demeure possible.
- source_word: בְּנֵי הָאָדָם
  choice: les êtres humains
  rationale: Expression collective et inclusive en français moderne, correspondant à l’hébreu littéral « les fils de l’être humain / d’Adam » sans donner à croire que seuls les hommes sont visés.
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: monte en haut
  rationale: Conserve le mouvement ascendant ainsi que l’insistance directionnelle de לְמָעְלָה, dans une formulation française claire.
- source_word: וְרוּחַ הַבְּהֵמָה
  choice: et si le souffle de l’animal
  rationale: Le singulier collectif « l’animal » maintient le contraste entre l’humanité et le monde animal; le second « si » explicite en français la portée continue de l’interrogation.
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ
  choice: descend en bas, vers la terre
  rationale: Préserve le parallélisme avec « monte en haut », l’insistance de לְמַטָּה et la destination exprimée par לָאָרֶץ.
theological_decisions:
- issue: Question ouverte ou affirmation sur la destinée respective des humains et des animaux
  choice: 'Conserver une question exprimant l’incertitude : « Qui sait si… ? »'
  alternative: Comprendre la question comme appelant une réponse positive et traduire de manière à affirmer que le souffle humain monte tandis que celui de l’animal descend.
  rationale: מִי יוֹדֵעַ introduit formellement une interrogation. La traduction ne tranche donc pas ce que le verset laisse en tension.
- issue: Sens de רוּחַ
  choice: Traduire par « souffle » dans le texte et signaler « esprit » en note.
  alternative: Traduire directement par « esprit » dans les deux occurrences.
  rationale: Le contexte rapproche humains et animaux face à la mort; « souffle » garde le chevauchement entre respiration, force vitale et esprit, tandis qu’une note préserve l’autre lecture importante.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme directionnel de l’hébreu est maintenu. « Êtres humains » rend naturellement la portée représentative de l’expression masculine hébraïque.
