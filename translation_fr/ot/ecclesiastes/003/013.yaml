source:
  edition: WLC
  text: וְ/גַ֤ם כָּל הָ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/רָאָ֥ה ט֖וֹב בְּ/כָל עֲמָל֑/וֹ מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: fr
  text: 'Et aussi, que chacun mange, boive et jouisse de ce qui est bon dans tout son travail : cela est un don de Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voie le bien » ; l’expression peut aussi signifier « éprouve le bien » ou « profite de ce qui est bon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Et aussi
  rationale: Conserve la valeur additive de la locution et son lien avec la pensée précédente.
- source_word: כָּל הָאָדָם
  choice: chacun
  rationale: Le singulier générique désigne distributivement tout être humain. « Chacun » exprime naturellement en français moderne cette portée universelle sans introduire une distinction de sexe absente du propos.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: que chacun mange, boive
  rationale: Le subjonctif français s’intègre naturellement à la proposition introduite par « que » et présente l’action comme le bien accordé à tout être humain.
- source_word: וְרָאָה טוֹב
  choice: et jouisse de ce qui est bon
  rationale: L’expression hébraïque signifie littéralement « voir le bien », idiome qui, dans l’Ecclésiaste, évoque le fait d’éprouver ou de goûter ce qui est bon. « Jouir de ce qui est bon » en transmet le sens tout en conservant la notion de bien.
- source_word: בְּכָל עֲמָלוֹ
  choice: dans tout son travail
  rationale: « Travail » rend l’activité laborieuse désignée par עָמָל, tandis que « dans » suit la relation exprimée par la préposition hébraïque.
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: cela est un don de Dieu
  rationale: Le pronom « cela » reprend l’ensemble de la réalité précédente. L’absence d’article devant מַתַּת se rend naturellement par « un don », sans affaiblir l’accent mis sur Dieu comme donateur.
theological_decisions:
- issue: Portée de אָדָם dans une affirmation générale sur l’humanité
  choice: chacun
  alternative: tout homme
  rationale: אָדָם est ici un singulier générique et distributif. « Chacun » rend explicitement la portée inclusive en français actuel, sans faire du sexe masculin un élément théologique du verset.
- issue: Nature du bien accordé par Dieu
  choice: jouisse de ce qui est bon
  alternative: voie le bien
  rationale: La formulation retient la dimension d’expérience positive de l’idiome sans préciser davantage la nature du bien ni transformer le verset en promesse de prospérité.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe conserve le lien additif avec le contexte précédent. « Chacun » est naturel et universel ; « jouisse de ce qui est bon » rend intelligible l’idiome hébraïque, dont l’image littérale est signalée en note.
