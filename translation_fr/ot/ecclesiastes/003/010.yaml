id: ECC.3.10
reference: Ecclesiastes 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָאִ֣יתִי אֶת הָֽ/עִנְיָ֗ן אֲשֶׁ֨ר נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/010.yaml
  text: I have seen the task that God has given to the sons of man to be occupied with[a].
translation:
  language: fr
  text: J’ai vu la tâche que Dieu a donnée aux êtres humains pour qu’ils s’en occupent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour qu’elle les accable » ou « pour qu’ils y peinent ». L’expression hébraïque est difficile et peut souligner soit l’occupation à laquelle les humains se consacrent, soit le fardeau qu’elle leur impose.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le parfait qal à la première personne exprime ici une observation réfléchie. Le passé composé est naturel en français et maintient le lien avec le constat présent de Qohélet.
- source_word: הָעִנְיָן
  choice: la tâche
  rationale: Dans l’Ecclésiaste, עִנְיָן désigne souvent une activité ou une occupation imposée. « Tâche » est clair, concis et peut suggérer aussi bien l’activité que son caractère pesant.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: que Dieu a donnée
  rationale: Cette formulation rend directement la proposition relative hébraïque. L’accord au féminin avec « tâche » est requis en français.
- source_word: לִבְנֵי הָאָדָם
  choice: aux êtres humains
  rationale: L’expression hébraïque, littéralement « aux fils de l’homme/de l’humain », désigne collectivement l’humanité. « Aux êtres humains » en restitue naturellement la portée générique en français moderne.
- source_word: לַעֲנוֹת בּוֹ
  choice: pour qu’ils s’en occupent
  rationale: Le sens exact de ענה avec ב est difficile ici. Le texte principal retient l’idée d’être occupé à cette tâche, sans effacer les nuances possibles de peine ou d’accablement, signalées en note.
theological_decisions:
- issue: Portée de לִבְנֵי הָאָדָם
  choice: aux êtres humains
  alternative: aux fils de l’homme
  rationale: Dans ce contexte sapientiel, l’expression hébraïque a une valeur collective et universelle. La traduction choisie communique cette portée sans transformer un idiome hébraïque en expression christologique ou en désignation exclusivement masculine.
- issue: Sens de לַעֲנוֹת בּוֹ
  choice: pour qu’ils s’en occupent
  alternative: pour qu’elle les accable / pour qu’ils y peinent
  rationale: La construction admet plusieurs nuances, de l’occupation à l’affliction. Le texte principal conserve le sens contextuel le plus large et la note préserve la tension liée au caractère pénible de la tâche.
translation_notes:
  register: Français international moderne, simple et digne. « J’ai vu » garde la sobriété du constat hébraïque; « êtres humains » rend naturellement la portée collective de l’expression; la note conserve l’ambiguïté lexicale essentielle.
