id: ECC.3.5
reference: Ecclesiastes 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵ֚ת לְ/הַשְׁלִ֣יךְ אֲבָנִ֔ים וְ/עֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַ/חֲב֔וֹק וְ/עֵ֖ת לִ/רְחֹ֥ק מֵ/חַבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: fr
  text: Un temps pour jeter des pierres[a], et un temps pour ramasser des pierres ; un temps pour prendre dans ses bras, et un temps pour s’en abstenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image hébraïque peut être comprise au sens littéral. Certains l’interprètent aussi de façon symbolique, notamment en rapport avec les relations humaines, l’agriculture ou la guerre.
    reason: ambiguïté_interprétative
lexical_decisions:
- source_word: עֵת
  choice: un temps
  rationale: עֵת désigne un moment ou une période. « Un temps » conserve le motif poétique répété du passage et reste naturel en français.
- source_word: לְהַשְׁלִיךְ
  choice: jeter
  rationale: L’infinitif hiphil de שלך signifie « jeter, lancer ». « Jeter » exprime clairement l’image concrète sans ajouter une nuance de violence.
- source_word: אֲבָנִים
  choice: des pierres
  rationale: אֶבֶן désigne ordinairement une pierre. Ce choix direct préserve l’image hébraïque.
- source_word: כְּנוֹס
  choice: ramasser
  rationale: L’infinitif de כנס signifie rassembler ou recueillir. « Ramasser » forme en français un contraste concret et naturel avec le fait de jeter des pierres.
- source_word: לַחֲבוֹק
  choice: prendre dans ses bras
  rationale: חבק signifie étreindre ou embrasser. « Prendre dans ses bras » est clair en français moderne et évite l’ambiguïté de « embrasser », qui peut surtout évoquer le baiser.
- source_word: לִרְחֹק מֵחַבֵּק
  choice: s’en abstenir
  rationale: רחק avec מן exprime ici le fait de se tenir éloigné de l’action d’étreindre. La reprise pronominale rend le contraste avec « prendre dans ses bras » de façon concise et idiomatique.
theological_decisions:
- issue: Sens de l’image consistant à jeter puis à ramasser des pierres
  choice: Conserver l’image concrète sans l’interpréter dans le corps du texte
  alternative: L’expliciter comme une allusion aux relations humaines, à l’agriculture ou à la guerre
  rationale: L’hébreu ne précise ni le contexte ni la portée symbolique de l’image. La traduction doit préserver cette ambiguïté plutôt que privilégier une interprétation.
translation_notes:
  register: Français international moderne, concis et poétique. Le parallélisme est conservé. « Prendre dans ses bras » est préféré à « embrasser » pour restituer sans équivoque le sens de חבק dans l’usage français actuel.
