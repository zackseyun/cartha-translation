source:
  edition: WLC
  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: fr
  text: J’ai vu tout cela, en appliquant mon cœur à tout ce qui se fait sous le soleil, à un moment où un être humain a dominé un autre, à son détriment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom traduit par « son » peut désigner soit la personne dominée, soit celle qui domine.
    reason: ambiguïté du référent pronominal
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le passé composé exprime naturellement en français une observation acquise dont le constat reste pertinent, tout en conservant le sens direct de « voir ».
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: en appliquant mon cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la réflexion; « en » rend naturellement le lien circonstanciel avec l’observation.
- source_word: מַעֲשֶׂה ... נַעֲשָׂה
  choice: œuvre qui s’accomplit
  rationale: « Œuvre » garde la portée générale de מַעֲשֶׂה, et la tournure pronominale française restitue sans lourdeur la forme passive de נַעֲשָׂה.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression caractéristique de l’Ecclésiaste est conservée sous sa forme française traditionnelle et transparente.
- source_word: עֵת אֲשֶׁר
  choice: au temps où
  rationale: La traduction maintient explicitement la notion temporelle de עֵת tout en restant fluide.
- source_word: שָׁלַט
  choice: domine
  rationale: Le verbe exprime l’exercice d’un pouvoir sur autrui; « domine » conserve sa force sans ajouter de cadre politique précis.
- source_word: הָאָדָם בְּאָדָם
  choice: un être humain domine un autre être humain
  rationale: La formulation rend la relation proverbiale entre deux humains sans faire du masculin français une précision biologique absente du propos générique.
- source_word: לְרַע לוֹ
  choice: pour son malheur
  rationale: Cette expression concise conserve l’idée d’un résultat nuisible ainsi que l’ambiguïté du pronom hébreu quant à la personne lésée.
theological_decisions:
- issue: Portée générique de אָדָם dans הָאָדָם בְּאָדָם
  choice: un être humain … un autre être humain
  alternative: l’homme … l’homme
  rationale: Dans ce proverbe, אָדָם désigne l’être humain en général plutôt qu’un homme par opposition à une femme. La traduction explicite cette portée humaine universelle sans modifier la relation singulière de domination.
- issue: Référent de לוֹ dans לְרַע לוֹ
  choice: maintien de l’ambiguïté par « son malheur »
  alternative: pour le malheur de celui qui est dominé / pour son propre malheur
  rationale: Le pronom masculin singulier peut grammaticalement renvoyer à l’un ou à l’autre des deux humains mentionnés. Le texte principal ne tranche donc pas entre le dominé et le dominateur.
translation_notes:
  register: Français international moderne, digne et lisible. L’image du « cœur » est volontairement conservée malgré son registre légèrement biblique, tandis que « être humain » explicite la portée générique de אָדָם.
