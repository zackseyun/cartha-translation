revisions:
- from: J’ai vu tout cela en appliquant mon cœur à toute œuvre qui s’accomplit sous le soleil, au temps où un être humain domine un autre être humain, pour son malheur[a].
  to: J’ai vu tout cela, en appliquant mon cœur à tout ce qui se fait sous le soleil, à un moment où un être humain a dominé un autre, à son détriment[a].
  rationale: La révision améliore la fluidité du français et rend plus directement l’aspect accompli de שָׁלַט. Elle conserve les images et expressions importantes du texte source, la portée générique de אָדָם, ainsi que l’ambiguïté textuelle de לְרַע לוֹ sans privilégier une interprétation doctrinale ou syntaxique disputée.
