  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: fr
  text: Personne n’a de pouvoir sur le vent pour le retenir[a]. Personne n’a d’autorité sur le jour de la mort. Il n’y a pas de dispense en temps de guerre, et la méchanceté ne délivrera pas son maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « souffle » : « Personne n’a de pouvoir sur le souffle pour le retenir » ; ou « esprit » : « Personne n’a de pouvoir sur l’esprit pour le retenir ». Le mot hébreu רוּחַ peut désigner le vent, le souffle ou l’esprit.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: personne
  rationale: La tournure existentielle négative exprime une vérité générale sur tout être humain. « Personne » est naturel en français moderne et conserve cette portée universelle.
- source_word: שַׁלִּיט
  choice: a pouvoir
  rationale: L’adjectif désigne la maîtrise ou le pouvoir exercé sur quelque chose. « A pouvoir sur » restitue directement cette idée dans la construction française.
- source_word: רוּחַ
  choice: vent
  rationale: Avec le verbe « retenir » et dans une série de réalités échappant à la maîtrise humaine, le sens concret « vent » est probable. La polysémie avec « souffle » et « esprit » reste signalée en note.
- source_word: לִכְלוֹא
  choice: pour le retenir
  rationale: Le verbe signifie enfermer, contenir ou retenir. Le pronom évite une répétition peu naturelle en français sans modifier le sens.
- source_word: שִׁלְטוֹן
  choice: autorité
  rationale: Le nom désigne le pouvoir ou la maîtrise. « Autorité sur » préserve le champ sémantique du terme et convient à l’absence de contrôle sur la mort.
- source_word: בְּיוֹם הַמָּוֶת
  choice: sur le jour de sa mort
  rationale: Dans la dépendance de « autorité », la préposition est rendue par « sur ». Le possessif explicite naturellement en français qu’il s’agit du jour de la mort de la personne concernée.
- source_word: מִשְׁלַחַת
  choice: exemption
  rationale: Dans le contexte militaire, le nom évoque une libération ou dispense de service. « Exemption » est clair et idiomatique, tout en exprimant l’impossibilité de se soustraire au conflit.
- source_word: בַּמִּלְחָמָה
  choice: à la guerre
  rationale: Cette expression française naturelle correspond au contexte militaire général du syntagme hébreu.
- source_word: רֶשַׁע
  choice: méchanceté
  rationale: Le nom abstrait est maintenu comme sujet personnifié, conformément à la formulation proverbiale hébraïque.
- source_word: יְמַלֵּט
  choice: ne délivrera pas
  rationale: Le verbe signifie faire échapper, mettre à l’abri ou délivrer. « Délivrer » garde la force sapientielle de l’énoncé.
- source_word: בְּעָלָיו
  choice: celui qui s’y livre
  rationale: Littéralement « son maître » ou « son possesseur ». En français, « celui qui s’y livre » rend clairement la relation entre la méchanceté et la personne qui la pratique, sans suggérer maladroitement qu’elle en aurait la maîtrise effective.
theological_decisions:
- issue: Sens de רוּחַ dans la première proposition
  choice: vent
  alternative: souffle ou esprit
  rationale: La répétition du mot avec l’idée de le contenir et la série d’éléments incontrôlables favorisent « vent ». La polysémie réelle du terme hébreu est préservée dans une note plutôt que supprimée.
- issue: Rapport entre la méchanceté et בְּעָלָיו
  choice: celui qui s’y livre
  alternative: son maître / son possesseur
  rationale: Le texte personnifie la méchanceté et affirme qu’elle ne sauve pas la personne qui lui est attachée. La formulation choisie conserve l’idée sans trancher davantage la nature morale de ce rapport.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases brèves rendent la série hébraïque avec clarté. La note conserve l’ambiguïté lexicale majeure de רוּחַ.
