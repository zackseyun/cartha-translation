  text: מִ֚י כְּ/הֶ֣/חָכָ֔ם וּ/מִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר פָּנָ֔י/ו וְ/עֹ֥ז פָּנָ֖י/ו יְשֻׁנֶּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: fr
  text: Qui est comme le sage, et qui connaît l’explication d’une chose ? La sagesse d’un homme illumine son visage, et la dureté[a] de son visage est changée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la force », « l’assurance » ou « la sévérité de son visage est changée ». L’expression hébraïque est idiomatique et peut désigner une expression du visage dure, sévère ou assurée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: Qui est comme le sage
  rationale: La tournure interrogative et comparative est conservée, ainsi que le singulier défini à valeur représentative.
- source_word: יוֹדֵעַ פֵּשֶׁר דָּבָר
  choice: qui connaît l’explication d’une chose
  rationale: « Connaît » rend directement יוֹדֵעַ; « explication » exprime naturellement פֵּשֶׁר, tandis que « une chose » garde la portée large de דָּבָר.
- source_word: חָכְמַת אָדָם
  choice: La sagesse d’un homme
  rationale: Cette formulation préserve le singulier générique אָדָם sans réduire l’expression à une abstraction.
- source_word: תָּאִיר פָּנָיו
  choice: illumine son visage
  rationale: 'Le verbe français exprime avec dignité la valeur causative de אור: faire luire ou rendre lumineux.'
- source_word: עֹז פָּנָיו
  choice: la dureté de son visage
  rationale: Dans cette association idiomatique, עֹז peut évoquer la dureté, la sévérité ou l’assurance du visage; « dureté » convient au contraste contextuel avec l’effet de la sagesse.
- source_word: יְשֻׁנֶּא
  choice: se transforme
  rationale: Le verbe indique ici un changement subi. « Se transforme » est naturel en français, sans préciser à tort la nature exacte du changement.
theological_decisions:
- issue: Valeur générique du singulier אָדָם
  choice: La sagesse d’un homme
  alternative: La sagesse humaine; la sagesse d’une personne
  rationale: Le texte hébreu emploie un singulier générique. « D’un homme » en conserve la forme représentative et ne limite pas l’énoncé à un individu particulier.
- issue: Nature du changement du visage
  choice: la dureté de son visage se transforme
  alternative: l’assurance de son visage change; la sévérité de son visage est changée
  rationale: Le texte affirme un changement sans en expliciter précisément le sens ni la direction. La traduction maintient cette tension plutôt que d’ajouter que le visage est nécessairement adouci.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe rhétorique de l’hébreu est conservée, tandis que « illumine son visage » offre une formulation naturelle et imagée.
