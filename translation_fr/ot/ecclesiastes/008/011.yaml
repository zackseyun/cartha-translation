source:
  edition: WLC
  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: fr
  text: Parce que la sentence contre une mauvaise action n’est pas mise à exécution rapidement, c’est pourquoi le cœur des êtres humains[a] est rempli du désir de faire le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’être humain » ; cette expression désigne ici l’humanité en général.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement que leur cœur est « plein en eux pour faire le mal », image d’une disposition intérieure pleine ou résolue à faire le mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  choice: sentence
  rationale: Dans ce contexte judiciaire, le terme désigne une décision faisant autorité concernant une mauvaise action. « Sentence » conserve cette valeur sans préciser excessivement s’il s’agit d’un verdict ou d’un décret.
- source_word: מַעֲשֵׂה הָרָעָה
  choice: une mauvaise action
  rationale: Le singulier hébreu est conservé avec une valeur générique. Cette formulation est naturelle en français et maintient le lien explicite entre la sentence et l’acte mauvais.
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: n’est pas exécutée rapidement
  rationale: Le passif de עשה exprime ici la mise à exécution de la sentence. « Exécutée » convient au cadre judiciaire, tandis que « rapidement » rend directement l’adverbe.
- source_word: עַל־כֵּן
  choice: '[relation rendue par la construction « Parce que…, … »]'
  rationale: La structure causale française exprime clairement la conséquence introduite en hébreu par « c’est pourquoi », sans alourdir la phrase par « parce que… c’est pourquoi ».
- source_word: לֵב
  choice: le cœur
  rationale: « Cœur » préserve l’image hébraïque du centre intérieur de la volonté et de la décision.
- source_word: בְּנֵי הָאָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque désigne collectivement l’humanité. La traduction courante évite en français l’ambiguïté christologique possible de « fils de l’homme » ; la forme littérale est signalée en note.
- source_word: מָלֵא ... בָּהֶם לַעֲשׂוֹת רָע
  choice: est tout entier porté à faire le mal
  rationale: Cette formulation française conserve le cœur comme sujet et rend l’idée d’une disposition intérieure pleinement orientée vers le mal. La note préserve l’image littérale difficile de la plénitude « en eux ».
- source_word: רָע
  choice: le mal
  rationale: « Le mal » conserve la force morale du terme et forme une expression française naturelle après « faire ».
theological_decisions:
- issue: Portée de בְּנֵי הָאָדָם
  choice: les êtres humains
  alternative: les fils de l’être humain / les fils d’Adam
  rationale: Le syntagme masculin hébreu est générique et vise l’humanité. En français moderne, « les êtres humains » transmet cette portée sans suggérer que seuls les hommes sont concernés ni créer une association indue avec le titre « Fils de l’homme » ; la forme source reste accessible en note.
- issue: Effet moral du retard de la justice
  choice: est tout entier porté à faire le mal
  alternative: est rempli en eux pour faire le mal / s’enhardit à faire le mal
  rationale: Le texte affirme une orientation intérieure renforcée par l’absence d’exécution rapide, mais ne tranche pas explicitement entre résolution arrêtée et hardiesse accrue. La formulation retenue garde cette tension, et la note donne l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement causal du verset, le singulier générique « une mauvaise action » et l’image biblique du cœur, tout en évitant un calque hébreu obscur.
