    issue: Le connecteur conséquentiel עַל־כֵּן n'est pas exprimé explicitement.
    rationale: Le texte hébreu présente le retard dans l'exécution comme la cause suivie de sa conséquence (« c'est pourquoi »). En français, il faut conserver ce mouvement par « c'est pourquoi » ou « ainsi ».
  - severity: low
    issue: La note a emploie « les fils d'Adam » comme si c'était la forme littérale.
    rationale: בְּנֵי הָאָדָם signifie littéralement « les fils de l'humain / de l'homme » ; « Adam » est une possibilité de lecture du nom commun, mais n'est pas nécessaire et peut suggérer à tort une référence au personnage Adam.
  revised_text: Parce que la sentence contre une mauvaise action n’est pas mise à exécution rapidement, c’est pourquoi le cœur des êtres humains[a] est rempli du désir de faire le mal[b].
