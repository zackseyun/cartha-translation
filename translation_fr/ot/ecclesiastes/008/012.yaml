base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: fr
  text: Même si un pécheur fait le mal cent fois et prolonge sa vie[a], je sais pourtant, moi aussi, qu’il sera bien pour ceux qui craignent Dieu[b], ceux qui le craignent devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vit longtemps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il y aura du bien pour ceux qui craignent Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Même si
  rationale: Dans ce contexte, la particule introduit une proposition concessive. « Même si » exprime clairement cette valeur en français courant.
- source_word: חֹטֶא
  choice: un pécheur
  rationale: Le participe substantivé désigne une personne caractérisée par le péché; le singulier est conservé.
- source_word: עֹשֶׂה רָע
  choice: fait le mal
  rationale: Cette formulation naturelle reste proche de l’expression verbale hébraïque sans la rendre plus abstraite.
- source_word: מְאַת
  choice: cent fois
  rationale: Le nombre est pris dans son emploi adverbial et garde sa force numérique, plutôt que d’être réduit à « souvent ».
- source_word: וּמַאֲרִיךְ לוֹ
  choice: et prolonge sa vie
  rationale: Le verbe signifie littéralement « prolonger pour lui-même »; le complément implicite est vraisemblablement la vie ou les jours. La note conserve l’autre lecture idiomatique possible.
- source_word: כִּי גַּם
  choice: pourtant, moi aussi
  rationale: « Pourtant » marque le contraste avec la concession précédente, tandis que « moi aussi » conserve la valeur additive et l’emphase du pronom exprimé.
- source_word: יוֹדֵעַ אָ֔נִי
  choice: je sais
  rationale: Le participe prédicatif avec le pronom personnel est rendu naturellement; l’emphase portée par le pronom est exprimée dans « moi aussi ».
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: que tout ira bien
  rationale: L’expression indique que la situation sera favorable. « Tout ira bien » est idiomatique, actuelle et garde l’orientation future.
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: pour ceux qui craignent Dieu
  rationale: Le participe substantivé désigne les personnes caractérisées par la crainte révérencielle de Dieu.
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: ceux qui vivent dans la crainte devant lui
  rationale: La traduction conserve la répétition de la racine « craindre » ainsi que l’image spatiale et révérencielle de la présence divine exprimée par « devant lui ».
theological_decisions:
- issue: Référent du suffixe pronominal dans מִלְּפָנָיו
  choice: « devant lui », avec Dieu pour antécédent
  alternative: « devant Dieu »
  rationale: Dieu est l’antécédent le plus proche et le plus naturel. Le pronom préserve la cohésion et évite une répétition inutile.
- issue: Portée de la promesse אֲשֶׁר יִהְיֶה טּוֹב
  choice: « tout ira bien pour ceux qui craignent Dieu »
  alternative: « il y aura du bonheur pour ceux qui craignent Dieu »
  rationale: La formulation affirme une issue favorable sans préciser de quelle manière ni à quel moment, ce qui préserve la tension du livre face à la longévité apparente du pécheur.
translation_notes:
  register: Français international moderne, naturel et digne. La structure concessive et le contraste sont explicites; la répétition de la notion de crainte est maintenue sans produire un calque trop abrupt.
