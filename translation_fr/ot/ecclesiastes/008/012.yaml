    text: 'Ou : « et vit longtemps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il y aura du bien pour ceux qui craignent Dieu ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace l’expression plus absolue « tout ira bien » par « il sera bien », qui rend avec davantage de retenue l’affirmation hébraïque. Elle rétablit aussi le verbe « craindre » dans la proposition finale afin de refléter la répétition intentionnelle de la racine hébraïque, sans préciser davantage la nature du bien promis.
