source:
  edition: WLC
  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: fr
  text: Ne te hâte pas de quitter sa présence[a]. Ne prends pas position dans une affaire mauvaise[b], car il fait tout ce qui lui plaît.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne t’affole pas au point de quitter sa présence ». Le verbe hébreu peut exprimer l’agitation ou l’effroi aussi bien que la précipitation.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ne défends pas une mauvaise cause » ou « Ne persiste pas dans une affaire mauvaise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: te hâte
  rationale: Le verbe בהל peut exprimer l’agitation ou l’effroi, mais, associé ici au départ de devant le roi, il évoque probablement une réaction précipitée. « Te hâte » rend naturellement cette portée pratique tout en signalant l’autre nuance en note.
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: quitter sa présence
  rationale: L’expression signifie littéralement « aller de devant lui ». « Quitter sa présence » est idiomatique en français et conserve le cadre d’une audience auprès du roi.
- source_word: תַּעֲמֹד
  choice: prends position
  rationale: עמד peut désigner ici le fait d’adopter ou de maintenir une position, plutôt qu’une simple posture physique. La note conserve la possibilité d’une persistance.
- source_word: בְּדָבָר רָע
  choice: dans une mauvaise affaire
  rationale: דבר est volontairement large et peut désigner une affaire, une cause ou une conduite. « Mauvaise affaire » préserve cette latitude sans imposer une interprétation précise; dans ce contexte, « mauvaise » peut porter une appréciation morale ou pratique.
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: car il fait tout ce qui lui plaît
  rationale: Cette formulation française naturelle rend l’idée que le roi est en mesure d’exécuter sa volonté.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit clairement la raison des deux avertissements précédents.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Les pronoms renvoient au roi mentionné dans le contexte immédiat, sans le nommer dans le verset.
  alternative: Ils pourraient viser plus généralement un souverain ou une autorité.
  rationale: Ecclésiaste 8.2 et 8.4 encadrent ce verset par des références explicites au roi et à son autorité. Garder « sa » et « il » suit néanmoins la forme pronominale de l’hébreu sans explicitation excessive.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes verbales hébraïques. La formulation conserve le ton de conseil adressé à une personne placée devant un souverain et maintient les ambiguïtés lexicales importantes au moyen de notes.
