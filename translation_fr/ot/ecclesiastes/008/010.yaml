source:
  edition: WLC
  text: וּ/בְ/כֵ֡ן רָאִיתִי֩ רְשָׁעִ֨ים קְבֻרִ֜ים וָ/בָ֗אוּ וּ/מִ/מְּק֤וֹם קָדוֹשׁ֙ יְהַלֵּ֔כוּ וְ/יִֽשְׁתַּכְּח֥וּ בָ/עִ֖יר אֲשֶׁ֣ר כֵּן עָשׂ֑וּ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: fr
  text: Ainsi, j’ai vu des méchants recevoir la sépulture[a]. Ils allaient et venaient du lieu saint[b], puis ils étaient oubliés dans la ville où ils avaient agi ainsi. Cela aussi est une vapeur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon certaines versions anciennes et une autre compréhension de l’hébreu, on pourrait lire : « et ils étaient célébrés dans la ville où ils avaient agi ainsi » ; la construction de l’ensemble du verset est difficile.'
    reason: textual_variant
  - marker: b
    text: Le « lieu saint » peut désigner l’enceinte du temple ou un autre endroit sacré.
    reason: cultural_note
  - marker: c
    text: Hébreu hével, souvent traduit par « vanité » ; le mot signifie littéralement « vapeur » et évoque ce qui est fugitif ou insaisissable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֵן
  choice: C’est alors que
  rationale: Rend le lien avec la réflexion précédente et introduit naturellement l’observation, sans imposer une conclusion logique trop forte.
- source_word: רָאִיתִי רְשָׁעִים קְבֻרִים
  choice: j’ai vu des méchants être enterrés
  rationale: Le passé composé convient à un constat rapporté en français moderne; l’infinitif passif exprime clairement le participe hébreu.
- source_word: וָבָאוּ וּמִמְּקוֹם קָדוֹשׁ יְהַלֵּכוּ
  choice: Ils allaient et venaient du lieu saint
  rationale: Cette formulation française naturelle conserve l’idée de mouvements associés au lieu saint, tout en laissant ouverte la relation syntaxique difficile entre les verbes.
- source_word: וְיִשְׁתַּכְּחוּ
  choice: ils étaient oubliés
  rationale: Suit le texte consonantique massorétique et le sens ordinaire de שכח au passif; l’autre lecture ancienne est signalée en note.
- source_word: בָעִיר אֲשֶׁר כֵּן עָשׂוּ
  choice: dans la ville où ils avaient agi ainsi
  rationale: Préserve la formulation comprimée et la référence indéterminée de כֵּן, sans préciser abusivement la nature de leurs actes.
- source_word: גַּם זֶה הָבֶל
  choice: Cela aussi est vapeur
  rationale: « Vapeur » maintient l’image concrète de הבל et ses connotations de caractère fugitif, insaisissable ou déroutant, plutôt que de la réduire à la seule idée de futilité.
theological_decisions:
- issue: Sens de la proposition difficile concernant les méchants et le lieu saint
  choice: Le texte décrit des méchants liés par leurs allées et venues au lieu saint, puis enterrés et oubliés dans la ville.
  alternative: Ils auraient été honorés ou loués dans la ville après avoir fréquenté le lieu saint.
  rationale: La traduction principale suit le texte massorétique sans transformer cette scène obscure en accusation explicite d’hypocrisie religieuse; la lecture attestée par certaines versions anciennes est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en préservant l’obscurité réelle du passage. « Lieu saint » évite de préciser « Temple » ou « sanctuaire » au-delà de l’hébreu; « vapeur » restitue l’image directrice de hével.
