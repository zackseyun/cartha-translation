  text: בַּ/אֲשֶׁ֥ר דְּבַר מֶ֖לֶךְ שִׁלְט֑וֹן וּ/מִ֥י יֹֽאמַר ל֖/וֹ מַֽה תַּעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: fr
  text: 'Car la parole d’un roi fait autorité[a], et qui peut lui dire : « Que fais-tu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car là où est la parole d’un roi, là est l’autorité. » Le début de la phrase hébraïque peut se comprendre plus littéralement ainsi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Car
  rationale: Dans le contexte, l’expression introduit la raison de l’exhortation précédente. « Car » rend naturellement cette valeur explicative, tout en signalant en note la lecture plus littérale et locative.
- source_word: דְּבַר מֶלֶךְ
  choice: la parole d’un roi
  rationale: « Parole » conserve l’image hébraïque sans réduire le terme à « ordre » ou « décret ». L’absence d’article devant « roi » favorise ici une formulation générale et proverbiale.
- source_word: שִׁלְטוֹן
  choice: fait autorité
  rationale: Le nom désigne le pouvoir souverain ou l’autorité. En français, « fait autorité » exprime naturellement la force contraignante de la parole royale sans ajouter une notion étrangère au texte.
- source_word: וּמִי יֹאמַר לוֹ
  choice: et qui peut lui dire
  rationale: Dans cette question rhétorique, l’imparfait hébreu exprime la possibilité de contester le roi; « peut » convient mieux en français moderne que le futur simple.
- source_word: מַה תַּעֲשֶׂה
  choice: Que fais-tu ?
  rationale: Cette formulation directe et naturelle conserve la force de la contestation adressée au roi.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et proverbiale. « Fait autorité » évite la tournure peu naturelle « est autorité », tandis que la note conserve l’ambiguïté syntaxique réelle de l’hébreu.
