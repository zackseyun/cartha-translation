  text: וְ/טוֹב֙ לֹֽא יִהְיֶ֣ה לָֽ/רָשָׁ֔ע וְ/לֹֽא יַאֲרִ֥יךְ יָמִ֖ים כַּ/צֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥/נּוּ יָרֵ֖א מִ/לִּ/פְנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: fr
  text: Mais le méchant ne connaîtra pas le bonheur et ne prolongera pas ses jours, semblables à l’ombre[a], parce qu’il ne craint pas Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en rattachant « comme l’ombre » au verbe : « et ne prolongera pas ses jours comme l’ombre ».'
    reason: 'Le rattachement de כַּצֵּל (« comme l’ombre ») est ambigu en hébreu : l’expression peut qualifier les jours ou la non-prolongation des jours.'
  - marker: b
    text: 'Littéralement : « parce qu’il ne craint pas devant Dieu », c’est-à-dire en sa présence.'
    reason: La note conserve la nuance de מִלִּפְנֵי אֱלֹהִים, que le français idiomatique « craindre Dieu » ne rend pas explicitement.
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: Mais le méchant ne connaîtra pas le bonheur
  rationale: Avec היה, טוֹב exprime ici une issue favorable ou le bien-être plutôt que le bien abstrait. « Mais » marque le contraste avec le verset précédent, et « ne connaîtra pas le bonheur » est une formulation française naturelle qui conserve cette portée.
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: et ne prolongera pas ses jours
  rationale: Le hiphil de ארך avec ימים signifie littéralement « prolonger des jours ». La formulation française garde l’image hébraïque sans la réduire à « ne vivra pas longtemps ».
- source_word: כַצֵּל
  choice: comme l’ombre
  rationale: 'La comparaison est conservée directement. Son rattachement syntaxique exact demeure ambigu : elle peut décrire la manière dont les jours ne se prolongent pas ou qualifier les jours eux-mêmes comme fugitifs.'
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, אֲשֶׁר introduit naturellement la cause du sort du méchant plutôt qu’une simple proposition relative.
- source_word: אֵינֶנּוּ יָרֵא מִלִּפְנֵי אֱלֹהִים
  choice: il ne craint pas Dieu
  rationale: Cette tournure française courante exprime l’absence durable de crainte révérencielle. La nuance spatiale de מִלִּפְנֵי, « devant/en présence de », est signalée en note.
theological_decisions:
- issue: Portée de la rétribution du méchant dans la littérature de sagesse
  choice: Énoncer sans atténuation que le méchant ne connaîtra pas une issue heureuse et ne prolongera pas ses jours
  alternative: Ajouter qu’il s’agit seulement d’une règle générale, ou affirmer explicitement que tout méchant mourra prématurément
  rationale: Le verset formule une affirmation morale forte tout en s’inscrivant dans les tensions observées ailleurs dans l’Ecclésiaste. La traduction ne lui ajoute ni restriction explicative ni garantie mécanique absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant le calque peu naturel « cela n’ira pas bien pour le méchant ». Les deux notes rendent visibles les principales nuances lexicales et syntaxiques sans résoudre l’ambiguïté du texte.
