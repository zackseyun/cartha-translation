id: ECC.8.6
reference: Ecclesiastes 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: fr
  text: Car, pour toute affaire[a], il y a un temps et un jugement[b], puisque le mal de l’être humain pèse lourdement sur lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour tout dessein » ou « pour toute chose ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une décision », « la justice » ou « une juste manière d’agir ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le malheur de l’être humain est grand pour lui » ou « la détresse de l’humanité pèse lourdement sur elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première conjonction introduit l’explication de ce qui précède; « Car » rend naturellement cette fonction discursive.
- source_word: לְכָל חֵפֶץ
  choice: pour toute affaire
  rationale: חֵפֶץ peut désigner un désir, un dessein ou une affaire. Avec עֵת et dans le contexte de Qohélet, « affaire » garde ici une portée large et concrète.
- source_word: יֵשׁ עֵת
  choice: il y a un temps
  rationale: Cette formulation rend directement la proposition existentielle sans ajouter explicitement l’idée d’un temps fixé.
- source_word: וּמִשְׁפָּט
  choice: et un jugement
  rationale: « Jugement » conserve le noyau juridique et décisionnel de מִשְׁפָּט, tout en laissant ouvertes les nuances de justice, de procédure ou de manière appropriée.
- source_word: כִּי
  choice: puisque
  rationale: La seconde conjonction exprime la cause; « puisque » évite la répétition de « car » tout en maintenant clairement le lien logique.
- source_word: רָעַת הָאָדָם
  choice: le mal de l’être humain
  rationale: רָעָה peut évoquer le mal, le malheur, la détresse ou l’adversité. « Le mal » préserve l’ambiguïté entre mal moral et mal subi, tandis que « l’être humain » exprime naturellement la valeur générique de הָאָדָם.
- source_word: רַבָּה עָלָיו
  choice: pèse lourdement sur lui
  rationale: Cette expression française restitue de manière idiomatique l’image hébraïque de quelque chose qui devient grand ou lourd sur une personne.
theological_decisions:
- issue: Valeur générique de הָאָדָם
  choice: l’être humain
  alternative: l’homme / l’humanité
  rationale: Le nom hébreu est singulier et générique. En français moderne, « l’être humain » conserve cette force représentative sans faire croire qu’il est uniquement question d’un homme de sexe masculin.
- issue: Sens de רָעָה dans ce contexte
  choice: le mal
  alternative: le malheur / la détresse / l’adversité
  rationale: Le terme hébreu possède une réelle amplitude sémantique. Le texte principal maintient cette tension avec « mal », et la note signale les sens contextuels possibles sans trancher abusivement.
- issue: Portée de מִשְׁפָּט
  choice: un jugement
  alternative: la justice / une décision / une juste manière d’agir
  rationale: Le mot peut viser aussi bien un jugement qu’un ordre juste ou une procédure appropriée. La traduction retient son sens lexical central et documente l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure hébraïque, avec un ordre légèrement réaménagé pour la fluidité. Les répétitions et ambiguïtés théologiques importantes sont conservées ou signalées en notes.
