  text: אֲנִי֙ פִּי מֶ֣לֶךְ שְׁמ֔וֹר וְ/עַ֕ל דִּבְרַ֖ת שְׁבוּעַ֥ת אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: fr
  text: 'Moi, je dis : respecte l’ordre du roi[a], à cause du serment prêté devant Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche du roi ». L’hébreu est condensé ; on peut aussi le comprendre ainsi : « Je [dis] : respecte l’ordre du roi, et [fais-le] à cause du serment de Dieu. »'
    reason: alternative_reading
  - marker: b
    text: L’expression peut aussi signifier « le serment fait à Dieu » ou « le serment de Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, je dis
  rationale: Le pronom indépendant ouvre abruptement la phrase. « Moi, je dis » explicite avec sobriété le verbe sous-entendu tout en gardant l’insistance personnelle.
- source_word: פִּי מֶלֶךְ
  choice: l’ordre du roi
  rationale: Littéralement « la bouche d’un roi »; l’expression désigne ici ce que le roi dit avec autorité. « L’ordre du roi » rend naturellement cette valeur idiomatique.
- source_word: שְׁמֹר
  choice: respecte
  rationale: Le verbe signifie garder, observer ou veiller à. Avec « l’ordre du roi », « respecte » exprime une observance concrète sans ajouter l’idée d’une obéissance absolue.
- source_word: וְעַל דִּבְרַת
  choice: à cause de
  rationale: Cette séquence condensée peut indiquer le motif de l’impératif. « À cause de » en donne la lecture causale la plus probable, tandis que la note signale l’incertitude syntaxique.
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: le serment prêté devant Dieu
  rationale: La chaîne construite est ambiguë. Cette formulation retient en contexte un serment humain ayant Dieu pour témoin, sans intégrer un possessif absent de l’hébreu.
theological_decisions:
- issue: Rapport entre שְׁבוּעַת אֱלֹהִים et le respect de l’ordre royal
  choice: Un serment prêté devant Dieu motive le respect de l’ordre du roi.
  alternative: Le serment peut être fait à Dieu, appartenir à Dieu, ou la proposition peut coordonner deux injonctions plutôt qu’exprimer nettement une cause.
  rationale: La lecture causale convient au contexte, mais la formulation hébraïque reste condensée. La traduction et les notes préservent cette tension sans enseigner une autorité royale inconditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Moi, je dis » conserve l’ouverture emphatique; « respecte » évite une formulation archaïque. Les notes rendent visibles le sens littéral et les principales ambiguïtés syntaxiques et théologiques.
