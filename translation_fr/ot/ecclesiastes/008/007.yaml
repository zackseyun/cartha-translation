  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: fr
  text: En effet, il ne sait pas ce qui arrivera, car qui peut lui dire comment cela arrivera ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une compréhension temporelle : « car qui peut lui dire quand cela arrivera ? » L’expression hébraïque peut aussi être comprise plus généralement ; « comment cela arrivera » maintient toutefois la distinction entre les deux propositions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: La première conjonction introduit l’explication de l’affirmation précédente. « En effet » rend naturellement cette valeur explicative en français moderne.
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: il ne sait pas
  rationale: La négation avec suffixe masculin singulier et le participe de ידע expriment ici l’ignorance du sujet humain à l’égard de l’avenir.
- source_word: מַה שֶּׁיִּהְיֶה
  choice: ce qui arrivera
  rationale: Cette formulation française naturelle exprime ce qui sera ou se produira, sans alourdir la phrase par le calque « ce qui sera ».
- source_word: כִּי
  choice: car
  rationale: La seconde conjonction introduit le motif de l’ignorance affirmée dans la première proposition.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: comment cela arrivera
  rationale: « Comment » conserve la distinction rhétorique possible entre la réalité future, dans la première proposition, et son déroulement ou ses modalités, dans la seconde. L’ambiguïté de l’hébreu est signalée en note.
- source_word: מִי יַגִּיד לוֹ
  choice: qui peut lui dire
  rationale: Le hiphil de נגד signifie « annoncer, faire connaître ». L’ajout idiomatique de « peut » fait ressortir la portée rhétorique de la question sans présenter l’annonce comme un simple événement futur.
