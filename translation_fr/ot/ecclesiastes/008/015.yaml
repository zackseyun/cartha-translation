revisions:
- from: J’ai donc fait l’éloge de la joie, car il n’y a rien de mieux pour l’être humain[a] sous le soleil que de manger, de boire et de se réjouir. Cette joie l’accompagnera dans son travail tout au long des jours de vie que Dieu lui donne sous le soleil.[b]
  to: J’ai donc fait l’éloge de la joie, car il n’y a rien de mieux pour l’être humain[a] sous le soleil que de manger, de boire et de se réjouir. Et cela l’accompagnera dans sa peine pendant les jours de sa vie que Dieu lui a donnés sous le soleil.[b]
  rationale: La correction principale évite de faire de « joie » l’antécédent certain d’un pronom masculin hébreu. Elle conserve la lecture contextuelle d’une jouissance qui accompagne la personne dans sa peine, mais sans surinterpréter le référent. Le parfait « a donnés » rend également plus directement la forme verbale source.
