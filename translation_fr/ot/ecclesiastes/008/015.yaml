source:
  edition: WLC
  text: וְ/שִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת הַ/שִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין ט֤וֹב לָֽ/אָדָם֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּ֛י אִם לֶ/אֱכ֥וֹל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׂמ֑וֹחַ וְ/ה֞וּא יִלְוֶ֣/נּוּ בַ/עֲמָל֗/וֹ יְמֵ֥י חַיָּ֛י/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: fr
  text: J’ai donc fait l’éloge de la joie, car il n’y a rien de mieux pour l’être humain[a] sous le soleil que de manger, de boire et de se réjouir. Et cela l’accompagnera dans sa peine pendant les jours de sa vie que Dieu lui a donnés sous le soleil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’humain » ; le singulier a ici un sens générique.'
    reason: Préciser la portée inclusive et générique de אָדָם.
  - marker: b
    text: 'Ou : « et cela l’accompagnera dans son labeur, pendant les jours de sa vie que Dieu lui a donnés sous le soleil ». Le pronom peut résumer la joie et la jouissance qui viennent d’être évoquées.'
    reason: Préserver l’ambiguïté du sujet de וְהוּא, la nuance de עָמָל et le parfait de נתן.
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: J’ai donc fait l’éloge
  rationale: Le piel de שׁבח signifie « louer, faire l’éloge, recommander ». « Faire l’éloge de » exprime naturellement en français l’évaluation positive de la joie, sans connotation nécessairement liturgique. « Donc » rend le lien discursif du וְ initial avec la réflexion précédente.
- source_word: הַשִּׂמְחָה
  choice: la joie
  rationale: « Joie » est le terme français courant et suffisamment large pour le thème récurrent de la jouissance de la vie dans Qohélet.
- source_word: אֵין טוֹב לָאָדָם
  choice: il n’y a rien de mieux pour l’être humain
  rationale: La tournure comparative rend clairement l’idiome hébreu dans ce contexte. « L’être humain » conserve le sens générique de אָדָם sans limiter l’énoncé aux hommes de sexe masculin.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette formulation littérale, naturelle en français, préserve un refrain structurant de Qohélet et sa perspective sur la vie terrestre.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: de manger, de boire et de se réjouir
  rationale: La série des trois infinitifs est conservée avec une syntaxe française fluide; « se réjouir » maintient la valeur verbale du dernier terme.
- source_word: וְהוּא יִלְוֶנּוּ
  choice: Cette joie l’accompagnera
  rationale: Le pronom masculin singulier peut reprendre שִׂמְחָה, dont le genre est masculin en hébreu malgré le féminin français « joie ». La reprise explicite évite l’ambiguïté artificielle de « elle » ou « cela » et conserve le lien probable avec la joie.
- source_word: בַעֲמָלוֹ
  choice: dans son travail
  rationale: עָמָל peut évoquer travail, peine ou labeur. « Travail » est naturel en français moderne; la note signale la nuance plus pénible possible.
- source_word: יְמֵי חַיָּיו אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: tout au long des jours de vie que Dieu lui donne
  rationale: La formulation exprime la durée de la vie reçue de Dieu. Le présent français convient à la maxime et à la perspective d’une vie continuellement accordée, sans imposer une précision temporelle absente de la forme hébraïque.
theological_decisions:
- issue: Portée de אָדָם dans une maxime au singulier
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom est ici générique et vise tout être humain. « L’être humain » traduit cette portée sans transformer le référent en collectif abstrait ni introduire une restriction masculine.
- issue: Référent de וְהוּא dans « וְהוּא יִלְוֶנּוּ »
  choice: Cette joie l’accompagnera
  alternative: et cela l’accompagnera / et il l’accompagnera
  rationale: Le contexte favorise la joie comme sujet qui accompagne la personne dans son travail. L’hébreu demeure grammaticalement susceptible d’une reprise plus générale; la note préserve cette possibilité sans introduire un sujet personnel théologiquement chargé.
- issue: Évaluation de la jouissance terrestre
  choice: fait l’éloge de la joie
  alternative: recommande la joie
  rationale: Le texte présente une appréciation positive de la joie dans les limites de la vie donnée par Dieu. La traduction ne transforme cette appréciation ni en commandement absolu ni en doctrine hédoniste.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour améliorer la lisibilité sans perdre la coordination hébraïque. Le refrain « sous le soleil » est conservé littéralement. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
