source:
  edition: WLC
  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: fr
  text: 'Il y a une absurdité[a] qui se produit sur la terre : il y a des justes auxquels il arrive ce qui correspond aux actes des méchants, et des méchants auxquels il arrive ce qui correspond aux actes des justes. J’ai dit que cela aussi est une absurdité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « futilité », « vanité » ou « vapeur ». Le mot hébreu הֶבֶל, terme clé de l’Ecclésiaste, évoque ce qui est passager, insaisissable ou déconcertant par son incohérence.
    reason: Alternative lexicale pour un terme thématique à plusieurs nuances.
lexical_decisions:
- source_word: הֶבֶל
  choice: absurdité / absurde
  rationale: Dans ce contexte de renversement entre conduite et sort, le terme désigne une réalité déconcertante et profondément incohérente. « Absurdité » rend naturellement cette nuance en français sans réduire le mot à l’idée de non-sens absolu.
- source_word: נַעֲשָׂה
  choice: se produit
  rationale: Le nifal décrit ici ce qui arrive ou a lieu sur la terre ; « se produit » est idiomatique et conserve la portée générale.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Traduction directe de l’expression hébraïque, sans lui substituer la formule distincte « sous le soleil ».
- source_word: צַדִּיקִים / רְשָׁעִים
  choice: des justes / des méchants
  rationale: Ces adjectifs substantivés désignent des catégories morales et forment en français une opposition claire, traditionnelle et concise.
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: subissent le sort
  rationale: Littéralement, quelque chose « leur arrive » ou « les atteint ». Le contexte laisse implicite le résultat correspondant aux actes ; « subissent le sort » l’exprime naturellement sans préciser la nature de ce résultat.
- source_word: כְּמַעֲשֵׂה
  choice: le sort que mériteraient les actes de
  rationale: La tournure hébraïque compare ce qui échoit aux personnes à ce qui correspond normalement à la conduite de l’autre groupe. Cette formulation rend explicite le rapport moral implicite et l’inversion dénoncée.
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Rend simplement le parfait à la première personne sans renforcer le verbe en « conclure » ou « déclarer ».
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: que cela aussi est absurde
  rationale: Préserve la reprise de הֶבֶל et la valeur additive de גַּם dans une phrase française fluide.
theological_decisions:
- issue: Sens de הֶבֶל dans l’Ecclésiaste
  choice: absurdité / absurde
  alternative: vanité ; futilité ; vapeur
  rationale: Le mot peut évoquer ce qui est fugitif, insaisissable, frustrant ou incohérent. Ici, l’inversion apparente des rétributions met surtout en relief l’incongruité. La note conserve les autres dimensions possibles plutôt que de présenter « absurdité » comme une définition exhaustive.
- issue: Rapport entre les actes et le sort reçu
  choice: « le sort que mériteraient les actes »
  alternative: « ce qui correspond aux actes » ; « selon les actes »
  rationale: Le verset constate une inversion de la rétribution attendue sans expliquer sa cause ni nier explicitement toute justice divine. Le conditionnel « mériteraient » signale cette correspondance normale sans transformer le constat en doctrine exhaustive de la rétribution.
translation_notes:
  register: Français international moderne, courant et digne. La symétrie entre « justes » et « méchants » est conservée, ainsi que la répétition finale du terme clé. La formulation privilégie la clarté de l’inversion morale tout en laissant ouverte la portée générale de הֶבֶל.
