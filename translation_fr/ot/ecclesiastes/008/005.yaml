  variant: modern international French
source:
  edition: WLC
  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: fr
  text: Qui observe un commandement ne connaîtra aucun mal[a], et le cœur d’un sage connaît le moment opportun et le jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une chose mauvaise ». L’expression peut désigner le mal, le malheur ou une conséquence néfaste.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le temps et le jugement »; il peut s’agir du moment approprié et du jugement, de la décision ou de la procédure appropriés.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: observe
  rationale: Le participe désigne la personne qui garde ou respecte un ordre. « Observe » est naturel en français avec « commandement » et exprime l’obéissance.
- source_word: מִצְוָה
  choice: un commandement
  rationale: Le singulier est ici générique. L’article indéfini évite de désigner abusivement un commandement précis.
- source_word: לֹא יֵדַע
  choice: ne connaîtra
  rationale: Le futur rend la conséquence générale exprimée par l’inaccompli tout en conservant l’idiome hébreu, qui peut inclure l’idée de faire l’expérience de quelque chose.
- source_word: דָּבָר רָע
  choice: aucun mal
  rationale: Littéralement « une chose mauvaise ». « Aucun mal » reste concis et conserve l’ambiguïté entre mal moral, malheur et conséquence nuisible.
- source_word: וְעֵת
  choice: le moment opportun
  rationale: Dans ce contexte sapiential, עֵת désigne vraisemblablement le moment approprié plutôt que le temps au sens abstrait.
- source_word: וּמִשְׁפָּט
  choice: la juste manière d’agir
  rationale: מִשְׁפָּט peut évoquer ici le jugement, la décision, la procédure ou la conduite appropriée. Cette formulation française exprime le sens contextuel sans réduire le terme à la justice judiciaire.
- source_word: יֵדַע לֵב חָכָם
  choice: le cœur du sage sait discerner
  rationale: La formulation maintient le « cœur » comme siège hébreu de l’intelligence et du discernement; « discerner » rend naturellement le savoir pratique impliqué par le contexte.
theological_decisions:
- issue: Portée de דָּבָר רָע
  choice: aucun mal
  alternative: aucun malheur / rien de mauvais
  rationale: Le texte peut parler soit d’une chose moralement mauvaise, soit, plus probablement dans le contexte, d’un malheur ou d’une conséquence néfaste. La traduction conserve cette tension.
- issue: Anthropologie de לֵב חָכָם
  choice: le cœur du sage
  alternative: le sage
  rationale: Conserver « cœur » respecte l’image hébraïque du centre intérieur de la compréhension et de la décision, sans la réduire à l’intellect seul.
- issue: Valeur de מִשְׁפָּט
  choice: la juste manière d’agir
  alternative: le jugement / la procédure appropriée
  rationale: Le contexte concerne le discernement pratique face à l’autorité. La traduction indique l’adéquation sans imposer un sens exclusivement judiciaire.
- issue: Masculin générique du participe
  choice: Qui observe un commandement
  alternative: Celui qui observe un commandement
  rationale: « Qui » exprime naturellement la portée générale du participe masculin singulier sans limiter l’énoncé aux hommes.
translation_notes:
  register: Français international moderne, digne et accessible. La structure proverbiale est conservée, ainsi que l’image hébraïque du cœur. Les explicitations « opportun » et « juste manière d’agir » rendent le discernement pratique du binôme עֵת וּמִשְׁפָּט; les notes préservent sa formulation plus littérale et son amplitude sémantique.
