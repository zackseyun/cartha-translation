  source_fidelity: 'Le sens fondamental est fidèlement rendu : l’effort du locuteur pour connaître la sagesse et examiner l’activité terrestre, suivi de l’image volontairement insolite des yeux qui ne voient pas le sommeil. Le suffixe masculin singulier demeure à juste titre non résolu. Toutefois, « car » seul ne rend pas explicitement גם (« même »), et « j’ai appliqué mon cœur » est un calque peu naturel en français moderne.'
  naturalness: « Consacré mon cœur à » conserve l’anthropologie et l’investissement délibéré exprimés par l’hébreu tout en étant plus idiomatique que « appliqué mon cœur à ». L’ajout de « même » avant « de jour comme de nuit » rend l’emphase sans normaliser l’image finale.
