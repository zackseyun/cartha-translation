  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: fr
  text: Quand j’ai consacré mon cœur à connaître la sagesse et à observer l’activité qui se fait sur la terre — car, même de jour comme de nuit, ses yeux ne voient pas le sommeil —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « il ne dort ni jour ni nuit ». Le texte principal conserve l’image hébraïque, littéralement : « le sommeil, ses yeux ne le voient pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quand
  rationale: Introduit ici la circonstance temporelle de la démarche du locuteur; « Quand » est naturel et respecte la valeur du terme.
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: j’ai appliqué mon cœur
  rationale: Conserve l’image hébraïque du cœur tout en exprimant un effort délibéré de réflexion.
- source_word: לָדַעַת חָכְמָה
  choice: à connaître la sagesse
  rationale: Rend directement ידע et חָכְמָה sans réduire la connaissance à une simple compréhension intellectuelle.
- source_word: וְלִרְאוֹת
  choice: et à observer
  rationale: Dans ce contexte d’examen attentif, « observer » communique mieux la nuance que le simple « voir ».
- source_word: הָעִנְיָן
  choice: l’activité
  rationale: Le nom désigne ici l’occupation ou l’affaire humaine; « activité » est moderne, large et non exclusivement commerciale.
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: qui se fait sur la terre
  rationale: Préserve la construction passive et la portée générale de ce qui a lieu dans le monde humain.
- source_word: כִּי גַם
  choice: car
  rationale: « Car » marque la fonction explicative de כִּי; l’idée d’extension portée par גַם ressort dans l’expression englobante « de jour comme de nuit ».
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: de jour comme de nuit
  rationale: Expression française naturelle qui indique une durée continue couvrant le jour et la nuit.
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: ses yeux ne voient pas le sommeil
  rationale: Conserve l’image frappante et inhabituelle du texte hébreu ainsi que le suffixe masculin singulier, sans expliciter son référent.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans בְּעֵינָיו
  choice: Maintenir « ses yeux » sans identifier le sujet
  alternative: Interpréter le suffixe comme renvoyant précisément au Qohélet (« mes yeux » en français) ou comme une tournure générique (« on ne dort pas »).
  rationale: Le texte massorétique porte un suffixe de troisième personne masculine singulière, et non de première personne. Le conserver respecte l’ambiguïté grammaticale et évite une correction ou une interprétation non imposée par le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images hébraïques du cœur appliqué et des yeux qui ne voient pas le sommeil; la note offre l’équivalent idiomatique sans effacer l’étrangeté de l’original.
