  to: Quand j’ai consacré mon cœur à connaître la sagesse et à observer l’activité qui se fait sur la terre — car, même de jour comme de nuit, ses yeux ne voient pas le sommeil —[a]
  rationale: La révision améliore l’idiomaticité française de l’expression du « cœur » consacré à une recherche, tout en conservant l’image anthropologique du texte. Elle rend aussi explicitement « même » (גם). La troisième personne masculine et l’image des yeux privés de sommeil restent intactes, afin de ne pas trancher le référent disputé ou implicite.
