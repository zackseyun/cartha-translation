source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: fr
  text: Car si un homme vit de nombreuses années, qu’il se réjouisse durant toutes ces années, mais qu’il se souvienne des jours de ténèbres, car ils seront nombreux. Tout ce qui vient est vapeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souffle » ; traditionnellement « vanité ». Le mot hébreu hével revient souvent dans l’Ecclésiaste pour désigner ce qui est passager, sans consistance ou insaisissable.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car, même si
  rationale: La combinaison introduit une éventualité tout en reliant le verset à ce qui précède. « Car, même si » restitue naturellement cette valeur explicative et concessive en français.
- source_word: שָׁנִים הַרְבֵּה
  choice: de nombreuses années
  rationale: L’expression désigne clairement une longue vie; cette formulation est naturelle et digne.
- source_word: הָאָדָם
  choice: un homme
  rationale: Le nom singulier a ici une portée générique. « Un homme » conserve la forme représentative masculine de l’hébreu sans limiter nécessairement l’énoncé aux hommes.
- source_word: בְּכֻלָּם
  choice: pendant chacune d’elles
  rationale: Le pronom renvoie aux nombreuses années. Cette formulation française exprime clairement que la joie doit embrasser chacune d’elles.
- source_word: יִשְׂמָח
  choice: qu’il se réjouisse
  rationale: L’imparfait hébreu prend ici une nuance exhortative ou jussive, bien rendue par le subjonctif français.
- source_word: וְיִזְכֹּר
  choice: mais qu’il se souvienne
  rationale: La conjonction est littéralement additive, mais le contexte marque un contraste entre la joie et le souvenir des jours sombres; « mais » rend cette relation sans supprimer la tension.
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: les jours de ténèbres
  rationale: 'La traduction conserve la métaphore et son ambiguïté possible: malheur, vieillesse, mort ou obscurité du séjour des morts.'
- source_word: כִּי הַרְבֵּה יִהְיוּ
  choice: car ils seront nombreux
  rationale: La proposition donne la raison de se souvenir de ces jours; le pronom renvoie naturellement aux jours de ténèbres.
- source_word: כָּל שֶׁבָּא
  choice: Tout ce qui vient
  rationale: La formulation garde la portée générale et sentencieuse de l’hébreu sans préciser indûment le référent.
- source_word: הָבֶל
  choice: vapeur
  rationale: Le terme récurrent de l’Ecclésiaste évoque ce qui est passager, insaisissable et sans consistance. « Vapeur » conserve la métaphore concrète sans imposer l’interprétation plus forte « absurdité » ou « absence de sens ».
theological_decisions:
- issue: Portée du masculin générique הָאָדָם
  choice: un homme
  alternative: une personne; l’être humain
  rationale: Le singulier masculin fonctionne comme représentant de l’humanité. La traduction maintient la forme du texte source tout en laissant sa portée générale intacte.
- issue: Sens du motif הָבֶל dans l’Ecclésiaste
  choice: vapeur
  alternative: souffle; vanité; absurdité
  rationale: « Vapeur » préserve l’image de la fugacité et de l’insaisissable. Elle évite de résoudre le motif en une affirmation univoque d’inutilité ou d’absence de sens.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde le mouvement proverbial du verset et préserve les métaphores de l’obscurité et de la vapeur.
