  text: שֹׁמֵ֥ר ר֖וּחַ לֹ֣א יִזְרָ֑ע וְ/רֹאֶ֥ה בֶ/עָבִ֖ים לֹ֥א יִקְצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/004.yaml
  text: Whoever watches the wind will not sow[a], and whoever looks at the clouds will not reap.
translation:
  language: fr
  text: Qui observe le vent ne sèmera pas, et qui regarde les nuages ne moissonnera pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמֵר
  choice: observe
  rationale: Le participe désigne ici une personne qui prête continuellement attention aux conditions météorologiques. « Observe » exprime cette attention sans introduire le sens protecteur de « garde ».
- source_word: רוּחַ
  choice: le vent
  rationale: Le contexte agricole, avec les semailles et les nuages, impose le sens météorologique plutôt que « esprit » ou « souffle ».
- source_word: יִזְרָע
  choice: ne sèmera pas
  rationale: L’imparfait hébreu exprime la conséquence générale d’une attitude habituelle. Le futur français conserve la formulation proverbiale et le lien logique implicite.
- source_word: וְרֹאֶה
  choice: et qui regarde
  rationale: Le participe parallèle introduit le second sujet générique. « Regarde » est naturel en français et maintient une légère variation par rapport à « observe ».
- source_word: בֶעָבִים
  choice: les nuages
  rationale: Après « regarder », le français n’exige pas de préposition. « Les nuages » rend directement l’image météorologique du texte.
- source_word: יִקְצוֹר
  choice: ne moissonnera pas
  rationale: « Moissonner » conserve le parallélisme agricole entre semer et récolter, tout en évoquant précisément l’action de couper la récolte.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, en français moderne et soutenu sans archaïsme. La structure parallèle de l’hébreu est conservée, de même que la portée générique des deux participes.
