source:
  edition: WLC
  text: תֶּן חֵ֥לֶק לְ/שִׁבְעָ֖ה וְ/גַ֣ם לִ/שְׁמוֹנָ֑ה כִּ֚י לֹ֣א תֵדַ֔ע מַה יִּהְיֶ֥ה רָעָ֖ה עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/002.yaml
  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: fr
  text: Donne une part à sept, et même à huit, car tu ne sais pas quel malheur surviendra sur la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: Donne
  rationale: Impératif qal à la deuxième personne du masculin singulier de נתן. « Donne » rend directement et naturellement l’exhortation.
- source_word: חֵלֶק
  choice: une part
  rationale: חֵלֶק désigne couramment une part ou une portion. « Une part » conserve ici le caractère concret de ce qui est distribué.
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: à sept, et même à huit
  rationale: La formule numérique hébraïque élargit la distribution au-delà du nombre complet. Le maintien des nombres et l’absence d’un nom ajouté préservent la forme littéraire ainsi que l’implicite de l’original.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation ; « car » convient au registre sapiential et reste naturel en français.
- source_word: לֹא תֵדַע
  choice: tu ne sais pas
  rationale: La négation accompagnée de l’imparfait exprime l’absence de connaissance. Cette formulation reste proche de l’hébreu sans transformer l’énoncé en incapacité absolue.
- source_word: מַה יִּהְיֶה
  choice: quel … surviendra
  rationale: Avec רָעָה, la tournure hébraïque désigne l’événement adverse qui se produira. « Quel … surviendra » est idiomatique en français tout en gardant l’orientation future.
- source_word: רָעָה
  choice: malheur
  rationale: Dans ce contexte, רָעָה renvoie à une circonstance néfaste plutôt qu’au mal moral. « Malheur » conserve une certaine amplitude, de l’adversité à la calamité.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre au sens large ou un pays. Le cadre général de la réflexion de Qohélet favorise « la terre », tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Étendue du terme הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La portée générale de la réflexion sapientiale favorise « la terre », sans exclure le sens plus local de « pays ». L’ambiguïté lexicale est conservée dans une note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La formule énigmatique « à sept, et même à huit » est maintenue sans ajouter « personnes » ni expliciter une interprétation particulière (générosité, diversification ou autre).
