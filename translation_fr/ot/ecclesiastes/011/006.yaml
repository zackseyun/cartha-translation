  text: בַּ/בֹּ֨קֶר֙ זְרַ֣ע אֶת זַרְעֶ֔/ךָ וְ/לָ/עֶ֖רֶב אַל תַּנַּ֣ח יָדֶ֑/ךָ כִּי֩ אֵֽינְ/ךָ֨ יוֹדֵ֜ע אֵ֣י זֶ֤ה יִכְשָׁר֙ הֲ/זֶ֣ה אוֹ זֶ֔ה וְ/אִם שְׁנֵי/הֶ֥ם כְּ/אֶחָ֖ד טוֹבִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: fr
  text: Le matin, sème ta semence, et le soir, ne laisse pas ta main se reposer[a], car tu ne sais pas lequel réussira[b], celui-ci ou celui-là, ou si tous les deux seront également bons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression évoquant le fait de ne pas cesser de travailler.
    reason: cultural_note
  - marker: b
    text: Ou « prospérera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Le matin
  rationale: Rend naturellement en français la locution temporelle qui désigne le début de la journée.
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: sème ta semence
  rationale: Préserve l’image agricole et le lien étymologique entre le verbe « semer » et son complément « semence ».
- source_word: וְלָעֶרֶב
  choice: et le soir
  rationale: Conserve le parallélisme temporel avec « Le matin » ainsi que la coordination hébraïque.
- source_word: אַל תַּנַּח יָדֶךָ
  choice: ne laisse pas ta main se reposer
  rationale: Rend concrètement l’expression hébraïque tout en laissant comprendre l’exhortation à ne pas interrompre son activité.
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: car tu ne sais pas
  rationale: Préserve le rapport causal entre l’exhortation et l’incertitude quant au résultat.
- source_word: אֵי זֶה יִכְשָׁר
  choice: lequel réussira
  rationale: אֵי זֶה oppose ici deux possibilités, tandis que יִכְשָׁר désigne ce qui réussit ou tourne bien.
- source_word: הֲזֶה אוֹ זֶה
  choice: celui-ci ou celui-là
  rationale: Exprime clairement en français le contraste démonstratif entre les deux entreprises envisagées.
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: ou si tous les deux seront également bons
  rationale: Maintient la possibilité ouverte que les deux résultats soient bons de la même manière, sans réduire טוֹבִים au seul sens de réussite.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne masculine singulière. La formulation conserve l’imagerie agricole et la tension entre diligence humaine et incertitude des résultats.
