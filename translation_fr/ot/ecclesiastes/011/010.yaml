  text: וְ/הָסֵ֥ר כַּ֨עַס֙ מִ/לִּבֶּ֔/ךָ וְ/הַעֲבֵ֥ר רָעָ֖ה מִ/בְּשָׂרֶ֑/ךָ כִּֽי הַ/יַּלְד֥וּת וְ/הַֽ/שַּׁחֲר֖וּת הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: fr
  text: Écarte donc de ton cœur l’irritation, et éloigne de ton corps le mal, car la jeunesse et l’aube de la vie ne sont que vapeur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעַס
  choice: le chagrin
  rationale: Le nom peut désigner le dépit, l’irritation ou le chagrin. Dans ce contexte d’exhortation adressée au jeune, « chagrin » exprime naturellement le trouble intérieur sans le réduire à la seule colère.
- source_word: רָעָה
  choice: ce qui fait du mal
  rationale: Le terme רָעָה peut signifier le mal, le malheur ou ce qui est nuisible. La formulation conserve ici l’idée de nuisance corporelle sans transformer nécessairement l’exhortation en jugement moral.
- source_word: בָּשָׂר
  choice: corps
  rationale: Bien que le sens littéral soit « chair », le mot désigne ici la réalité corporelle de la personne; « corps » est le français courant et naturel.
- source_word: הַשַּׁחֲרוּת
  choice: l’aube de la vie
  rationale: Mot rare lié vraisemblablement à l’idée de noirceur des cheveux ou d’aurore. « L’aube de la vie » restitue l’image d’un âge précoce et garde la nuance poétique attestée par le contexte.
- source_word: הָבֶל
  choice: vapeur
  rationale: L’image fondamentale est celle d’un souffle ou d’une vapeur, donc de ce qui est fugitif et insaisissable. « Vapeur » préserve la métaphore récurrente de Qohélet au lieu de la résoudre en « vanité ».
theological_decisions:
- issue: Portée morale de רָעָה
  choice: « ce qui fait du mal », au sens ouvert de nuisance ou de mal
  alternative: « le mal », qui pourrait être compris exclusivement comme faute morale
  rationale: Le texte hébreu permet une dimension morale comme une dimension nuisible ou pénible. La traduction évite de fermer cette ambiguïté.
- issue: Sens de הָבֶל appliqué à la jeunesse
  choice: Maintenir l’image de la « vapeur »
  alternative: « vanité », « futilité » ou « passagères »
  rationale: L’auteur souligne à la fois le caractère fugitif et insaisissable de la jeunesse; garder l’image évite d’imposer un jugement purement négatif.
translation_notes:
  register: Français international moderne, direct et poétique. L’impératif au singulier conserve l’adresse personnelle. « Donc » relie le verset à l’exhortation précédente; la phrase reste digne et accessible.
