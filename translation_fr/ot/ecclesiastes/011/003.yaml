source:
  edition: WLC
  text: אִם יִמָּלְא֨וּ הֶ/עָבִ֥ים גֶּ֨שֶׁם֙ עַל הָ/אָ֣רֶץ יָרִ֔יקוּ וְ/אִם יִפּ֥וֹל עֵ֛ץ בַּ/דָּר֖וֹם וְ/אִ֣ם בַּ/צָּפ֑וֹן מְק֛וֹם שֶׁ/יִּפּ֥וֹל הָ/עֵ֖ץ שָׁ֥ם יְהֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: fr
  text: Si les nuages sont chargés de pluie, ils la déversent sur la terre ; et si un arbre tombe vers le sud ou vers le nord, à l’endroit où l’arbre tombe, il restera là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « là il sera ». Le verbe hébreu signifie simplement « être » ; « il restera là » exprime naturellement en français la situation de l’arbre tombé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ הֶעָבִים גֶּשֶׁם
  choice: les nuages sont chargés de pluie
  rationale: Le nifal de מלא peut exprimer le fait d’être rempli ou devenu plein. « Sont chargés de pluie » est une tournure française naturelle qui conserve l’image de nuages arrivés à pleine capacité.
- source_word: יָרִיקוּ
  choice: ils la déversent
  rationale: Le hifil de ריק signifie vider ou déverser. Le pronom « la » reprend explicitement la pluie, objet sous-entendu en hébreu.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: ארץ peut désigner la terre ou le pays. L’observation générale sur la nature favorise ici « la terre ».
- source_word: יִפּוֹל עֵץ
  choice: un arbre tombe
  rationale: Le présent français convient à la valeur conditionnelle et proverbiale de l’imparfait hébreu.
- source_word: בַּדָּרוֹם וְאִם בַּצָּפוֹן
  choice: vers le sud ou vers le nord
  rationale: Avec le verbe « tomber », la valeur directionnelle est naturelle et maintient le parallélisme des deux orientations.
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ
  choice: à l’endroit où l’arbre tombe
  rationale: Cette formulation conserve le nom explicite מְקוֹם, « endroit, lieu », ainsi que la structure aphoristique.
- source_word: שָׁם יְהוּא
  choice: il restera là
  rationale: Le verbe hébreu signifie littéralement « être ». Dans le contexte d’un arbre tombé, « restera » exprime naturellement l’état résultant sans en modifier le sens essentiel.
