source:
  edition: WLC
  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: fr
  text: Réjouis-toi, jeune homme, pendant ta jeunesse, et que ton cœur te réjouisse aux jours de ta vigueur[a]. Marche selon les voies de ton cœur et selon ce qui s’offre à tes yeux[b]. Mais sache que, pour tout cela, Dieu t’amènera en jugement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux jours de ta jeunesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les apparences — ou la vue — de tes yeux ».'
    reason: lexical_alternative
  - marker: c
    text: L’Ecclésiaste maintient ensemble la joie de vivre et la responsabilité devant Dieu. Le verset peut se lire comme une permission encadrée ou comme une exhortation chargée d’avertissement.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: Réjouis-toi
  rationale: L’impératif qal appelle directement le jeune homme à éprouver et manifester de la joie; cette formulation conserve sa force positive.
- source_word: בָּחוּר
  choice: jeune homme
  rationale: Le nom et toute l’adresse sont au masculin singulier; « jeune homme » reproduit cette précision sans neutraliser le genre grammatical et référentiel.
- source_word: בְּיַלְדוּתֶיךָ
  choice: pendant ta jeunesse
  rationale: Dans ce contexte, le terme désigne la période de la jeunesse plutôt que la petite enfance.
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: que ton cœur te réjouisse
  rationale: Le hiphil de יטב exprime ici l’effet bénéfique ou joyeux produit par le cœur; cette tournure française garde le cœur comme sujet causatif.
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: aux jours de ta vigueur
  rationale: L’expression évoque les jours de la pleine force propre à la jeunesse. « Vigueur » évite une répétition lourde tout en gardant cette nuance, avec l’équivalent plus littéral signalé en note.
- source_word: וְהַלֵּךְ
  choice: Marche
  rationale: L’impératif conserve la métaphore hébraïque de la marche pour désigner la conduite.
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: selon les voies de ton cœur
  rationale: Cette formulation maintient à la fois l’image des voies et le rôle du cœur comme siège des désirs et des intentions.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: selon ce que voient tes yeux
  rationale: Rendu naturel de l’expression littérale « dans les apparences ou la vue de tes yeux », sans préciser abusivement s’il s’agit du désir, de l’attrait ou du simple regard.
- source_word: וְדָע
  choice: Mais sache
  rationale: La conjonction est formellement additive, mais elle introduit ici un avertissement qui met en balance les impératifs précédents; « mais » rend cette valeur discursive sans annuler l’exhortation à la joie.
- source_word: עַל כָּל אֵלֶּה
  choice: pour tout cela
  rationale: Dans le contexte judiciaire, la préposition exprime naturellement ce au sujet de quoi la personne devra répondre.
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: Dieu te fera venir en jugement
  rationale: Cette traduction conserve le causatif de בוא et le caractère judiciaire de מִשְׁפָּט, sans préciser davantage la forme ou le moment du jugement.
theological_decisions:
- issue: L’exhortation à profiter de la jeunesse est-elle ironique, permissive ou moralement encadrée ?
  choice: Le texte principal garde ensemble les impératifs positifs de joie et de conduite selon le cœur et les yeux, puis l’annonce du jugement divin.
  alternative: Comprendre les premiers impératifs comme une invitation ironique à une conduite que la dernière proposition condamnerait, ou comme une approbation sans réserve du plaisir.
  rationale: L’hébreu ne marque pas explicitement l’ironie. L’Ecclésiaste associe régulièrement la jouissance de la vie à la responsabilité devant Dieu; la traduction ne tranche donc pas la tension que le verset maintient.
- issue: Genre de la personne interpellée
  choice: L’adresse masculine singulière est rendue par « jeune homme ».
  alternative: Employer une formule générique comme « jeune personne » ou « toi qui es jeune ».
  rationale: Le substantif בָּחוּר et les suffixes de deuxième personne sont masculins singuliers; la traduction reproduit cette forme explicite.
- issue: Nature du jugement divin
  choice: La formulation générale « en jugement » est conservée.
  alternative: Préciser un jugement eschatologique, une sanction dans la vie présente ou une évaluation morale particulière.
  rationale: Le verset affirme la responsabilité devant Dieu sans définir ici le moment ni les modalités du jugement; la traduction évite d’importer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au masculin singulier. Les métaphores bibliques du cœur, des voies et de la marche sont conservées, tandis que les constructions les moins idiomatiques sont légèrement explicitées.
