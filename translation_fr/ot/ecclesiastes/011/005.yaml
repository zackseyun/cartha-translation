  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: fr
  text: De même que tu ne sais pas par quel chemin passe le vent[a], ni comment les os se forment dans le ventre d’une femme enceinte[b], de même tu ne connais pas l’œuvre de Dieu, qui fait tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par quel chemin passe le souffle » ou « par quel chemin passe l’esprit » ; le mot hébreu רוּחַ peut signifier « vent », « souffle » ou « esprit ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « dans le ventre de celle qui est pleine », expression qui désigne ici une femme enceinte.
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: le chemin du vent
  rationale: « Chemin » conserve l’image de דֶּרֶךְ, tandis que « vent » convient au contexte des phénomènes naturels dont le fonctionnement échappe à l’être humain. Le mot רוּחַ reste toutefois polysémique, d’où la note.
- source_word: כַּעֲצָמִים
  choice: ni comment les os se forment
  rationale: L’hébreu est elliptique, littéralement « comme les os ». La formulation française explicite le développement caché évoqué par la comparaison sans prétendre en décrire le mécanisme.
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: dans le ventre d’une femme enceinte
  rationale: Littéralement « dans le ventre de celle qui est pleine » ; il s’agit d’une expression désignant une femme enceinte. Cette formulation est claire et naturelle en français moderne.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: l’œuvre de Dieu
  rationale: Cette expression restitue naturellement le syntagme hébreu et maintient le thème de l’action divine.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: qui fait toutes choses
  rationale: La relative désigne naturellement Dieu comme celui qui accomplit ou produit toutes choses. « Fait » conserve aussi le lien lexical avec « œuvre ».
theological_decisions:
- issue: Sens de רוּחַ dans ce verset
  choice: vent
  alternative: souffle ou esprit
  rationale: Le contexte souligne l’ignorance humaine devant les processus cachés de la création et de l’action divine ; « vent » s’accorde bien avec cette analogie. Puisque l’hébreu peut aussi signifier « souffle » ou « esprit », la note préserve cette ambiguïté réelle.
- issue: Portée de אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: Dieu « fait toutes choses »
  alternative: Dieu « accomplit tout »
  rationale: Le verbe עשה couvre l’idée de faire, produire ou accomplir. « Fait toutes choses » garde l’ampleur de l’énoncé sans préciser davantage la nature de l’action divine.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative « Tout comme… de même… » reflète l’encadrement כַּאֲשֶׁר… כָּכָה. Le tutoiement conserve l’adresse directe au lecteur caractéristique du passage sapientiel.
