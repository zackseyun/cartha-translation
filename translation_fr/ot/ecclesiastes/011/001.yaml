  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: fr
  text: Jette ton pain sur les eaux[a], car après bien des jours, tu le trouveras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Envoie ton pain sur les eaux. » Littéralement : « à la surface des eaux ». L’image hébraïque peut évoquer la générosité, un investissement, ou les deux ; elle reste figurée dans le texte principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלַּח
  choice: Jette
  rationale: L’impératif signifie littéralement « envoie » ou « laisse aller ». « Jette » conserve ici l’image vive et énigmatique sans en expliciter l’application.
- source_word: לַחְמְךָ
  choice: ton pain
  rationale: לֶחֶם désigne couramment le pain, avec une extension possible à la nourriture. Le terme concret est conservé pour préserver l’image du proverbe.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: à la surface des eaux
  rationale: פְּנֵי évoque littéralement la face ou la surface. Cette formulation reste claire en français et maintient le pluriel hébreu « eaux ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif donné à l’impératif ; « car » convient au style proverbial.
- source_word: בְרֹב הַיָּמִים
  choice: après bien des jours
  rationale: La locution exprime un délai prolongé. « Après bien des jours » est naturel et conserve l’image temporelle concrète.
- source_word: תִּמְצָאֶנּוּ
  choice: tu le retrouveras
  rationale: Le verbe signifie « trouver » et le suffixe masculin singulier renvoie naturellement au pain. « Retrouver » exprime en français qu’on trouve ultérieurement ce qui a été envoyé, sans préciser la nature du retour.
theological_decisions:
- issue: Interprétation de l’image proverbiale
  choice: Conserver l’image du pain jeté sur les eaux sans l’identifier à une seule application.
  alternative: Traduire explicitement comme une exhortation à la générosité ou comme un encouragement au commerce et à la prise de risque.
  rationale: L’hébreu demeure figuré et permet plusieurs lectures plausibles. La traduction ne tranche donc pas une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du singulier. L’expression « à la surface des eaux » conserve la formulation imagée de l’hébreu.
