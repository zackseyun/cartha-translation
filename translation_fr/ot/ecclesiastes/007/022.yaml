  yaml_path: translation/ot/ecclesiastes/007/022.yaml
  text: For your heart knows that many times you yourself have also cursed others[a].
translation:
  language: fr
  text: Car ton cœur sait que, bien souvent, toi aussi, tu as maudit les autres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « insulté les autres » ou « dit du mal des autres ». Le verbe hébreu peut désigner le fait de maudire quelqu’un en paroles, mais, dans ce contexte, il peut avoir le sens plus large d’insulter quelqu’un ou de dire du mal de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la recommandation précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: גַּם פְּעָמִים רַבּוֹת
  choice: bien souvent
  rationale: La tournure exprime la répétition à de nombreuses reprises. « Bien souvent » est idiomatique en français, tandis que la valeur additive ou emphatique de גַּם est portée avec plus de naturel par « toi aussi » dans la proposition suivante.
- source_word: יָדַע לִבֶּךָ
  choice: ton cœur sait
  rationale: Le parfait exprime ici un savoir personnel établi. Le présent convient en français, et « cœur » préserve l'image hébraïque de l'être intérieur, notamment de la conscience et de la pensée.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduit directement le contenu de ce que le cœur sait.
- source_word: גַּם אַתָּה
  choice: toi aussi
  rationale: L'emploi du pronom indépendant avec גַּם souligne que le destinataire a lui-même commis ce qu'il pourrait entendre dire contre lui.
- source_word: קִלַּלְתָּ
  choice: tu as maudit
  rationale: « Maudire » est l'équivalent direct du verbe et maintient la symétrie avec le contexte précédent. Une note conserve les nuances possibles d'injure ou de parole malveillante.
- source_word: אֲחֵרִים
  choice: les autres
  rationale: Désigne de manière générale d'autres personnes; l'article défini générique est naturel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. « Bien souvent » évite la lourdeur de « de nombreuses fois », tandis que « toi aussi » conserve l'insistance personnelle.
