translation:
  language: fr
  text: Mieux vaut écouter la réprimande d’un sage que d’écouter le chant des insensés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt., dans le second membre : « qu’un homme écoutant le chant des insensés » ; la construction hébraïque est elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette construction comparative, l’adjectif a une valeur prédicative. « Mieux vaut » est idiomatique, naturel et concis en français.
- source_word: לִשְׁמֹעַ
  choice: écouter
  rationale: Le verbe peut signifier entendre ou écouter. Ici, puisqu’il s’agit de prêter attention à des paroles de correction ou à un chant, « écouter » exprime naturellement l’action volontaire tout en permettant de reprendre le même verbe dans les deux membres.
- source_word: גַּעֲרַת
  choice: la réprimande
  rationale: Le nom désigne une correction verbale ferme. « Réprimande » conserve cette vigueur dans un registre courant et digne.
- source_word: חָכָם
  choice: d’un sage
  rationale: Le substantif masculin singulier désigne ici un homme sage. En français sapientiel, « un sage » est la formulation naturelle et fidèle à la forme grammaticale.
- source_word: מֵאִישׁ
  choice: que d’écouter
  rationale: La préposition marque la comparaison. La formulation principale lisse la proposition nominale hébraïque afin de produire un parallélisme naturel en français; sa forme plus littérale est signalée en note.
- source_word: שֹׁמֵעַ
  choice: d’écouter
  rationale: Bien qu’il s’agisse formellement d’un participe, l’infinitif français équilibre les deux membres de la comparaison sans en modifier le sens.
- source_word: שִׁיר
  choice: le chant
  rationale: Le singulier peut avoir une portée générique ou collective. « Chant » garde le contraste vif entre la correction du sage et le divertissement des insensés.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Dans la littérature de sagesse, le terme désigne des personnes moralement et intellectuellement obtuses, non de simples personnes peu intelligentes. « Insensés » préserve cette nuance éthique.
