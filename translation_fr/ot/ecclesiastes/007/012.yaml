source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: fr
  text: 'Car la sagesse offre un abri, comme l’argent offre un abri[a] ; mais voici l’avantage du savoir : la sagesse garde en vie ceux qui la possèdent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Car dans l’ombre de la sagesse, dans l’ombre de l’argent. » En hébreu, l’ombre représente ici la protection ou l’abri.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la sagesse fait vivre ceux qui la possèdent ». Le verbe hébreu peut aussi signifier « faire vivre » ou « préserver la vie de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du passage.
- source_word: בְּצֵל הַחָכְמָה בְּצֵל הַכָּסֶף
  choice: la sagesse offre un abri, comme l’argent offre un abri
  rationale: Littéralement « dans l’ombre de la sagesse, dans l’ombre de l’argent ». L’ombre évoque ici la protection. La répétition de « offre un abri » rend naturellement en français le parallélisme elliptique hébreu, tandis que « comme » explicite la comparaison impliquée.
- source_word: הַחָכְמָה
  choice: la sagesse
  rationale: Équivalent courant de חָכְמָה dans l’Ecclésiaste, où le terme désigne notamment une sagesse pratique et existentielle.
- source_word: הַכָּסֶף
  choice: l’argent
  rationale: כֶּסֶף signifie « argent » au sens de métal, puis de monnaie ou de ressources financières. Le contexte met en avant sa capacité pratique à protéger.
- source_word: וְיִתְרוֹן דַּעַת
  choice: mais voici l’avantage du savoir
  rationale: יִתְרוֹן désigne un avantage, un gain ou un profit. La tournure choisie marque le contraste avec la protection commune à la sagesse et à l’argent, tout en conservant la relation difficile entre « avantage » et « savoir ».
- source_word: תְּחַיֶּה
  choice: garde en vie
  rationale: Le piel de חיה peut signifier « faire vivre », « conserver en vie » ou « vivifier ». « Garde en vie » convient au contexte de protection sans exclure entièrement la force vivifiante du verbe.
- source_word: בְעָלֶיהָ
  choice: ceux qui la possèdent
  rationale: Littéralement « ses possesseurs ». Cette formulation moderne et naturelle conserve l’idée que la sagesse est détenue par ceux auxquels elle profite.
theological_decisions:
- issue: Portée de תְּחַיֶּה
  choice: garde en vie
  alternative: fait vivre
  rationale: Le contexte peut viser la préservation concrète de la vie, mais le verbe permet aussi l’idée plus forte de donner ou de rendre la vie. Le texte principal retient la valeur contextuelle de conservation et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La répétition proverbiale est maintenue, mais l’ellipse nominale hébraïque est explicitée pour être naturelle en français. Les notes conservent l’image littérale de l’ombre et l’ambiguïté du verbe חיה.
