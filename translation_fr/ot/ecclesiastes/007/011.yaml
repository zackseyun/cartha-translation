source:
  edition: WLC
  text: טוֹבָ֥ה חָכְמָ֖ה עִֽם נַחֲלָ֑ה וְ/יֹתֵ֖ר לְ/רֹאֵ֥י הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/011.yaml
  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
translation:
  language: fr
  text: La sagesse est bonne avec un héritage[a] ; elle est un avantage pour ceux qui voient le soleil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La sagesse est aussi bonne qu’un héritage ». La construction hébraïque peut soit comparer la sagesse à un héritage, soit les présenter comme deux biens associés.
    reason: lexical_alternative
  - marker: b
    text: « Ceux qui voient le soleil » désigne les vivants, ceux qui sont en vie dans ce monde.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  choice: est bonne
  rationale: L’adjectif prédicatif signifie « bonne » ; le verbe « être », absent de la proposition nominale hébraïque, est naturellement explicité en français. Rien n’impose ici le comparatif « meilleure ».
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rendu courant dans l’Ecclésiaste, où le terme désigne notamment une sagesse pratique permettant de conduire sa vie.
- source_word: עִם
  choice: avec
  rationale: Ce choix conserve le sens premier d’accompagnement ou d’association, sans exclure la lecture comparative possible dans cette construction.
- source_word: נַחֲלָה
  choice: un héritage
  rationale: Le mot désigne couramment un bien reçu en héritage ou une possession héréditaire ; « héritage » en préserve la précision lexicale.
- source_word: וְיֹתֵר
  choice: elle est un avantage
  rationale: יֹתֵר peut désigner un surplus, un profit ou un avantage. La reprise pronominale rend en français la proposition elliptique hébraïque sans ajouter l’idée de supériorité exprimée par « mieux encore ».
- source_word: לְרֹאֵי הַשָּׁמֶשׁ
  choice: pour ceux qui voient le soleil
  rationale: La formulation littérale préserve l’image caractéristique de l’Ecclésiaste, tandis que « pour » exprime naturellement le bénéficiaire de l’avantage.
