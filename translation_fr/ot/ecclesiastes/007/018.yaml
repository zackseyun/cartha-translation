  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: fr
  text: Il est bon que tu tiennes fermement ceci et que tu ne retires pas non plus ta main de cela, car celui qui craint Dieu sortira de tout cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « s’en tirera en toutes ces choses ». D’autres comprennent : « évitera tout cela ». La construction hébraïque est inhabituelle et son sens exact est discuté.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב אֲשֶׁר
  choice: Il est bon que
  rationale: Cette tournure rend naturellement en français l’évaluation exprimée par טוֹב et introduit le conseil qui suit.
- source_word: תֶּאֱחֹז בָּזֶה
  choice: tu saisisses ceci
  rationale: Le verbe אָחַז signifie concrètement « saisir, tenir ». « Saisir ceci » conserve l’image de la prise tout en renvoyant au conseil précédent.
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: sans pour autant relâcher ta prise sur cela
  rationale: La formulation hébraïque évoque la main que l’on ne laisse pas au repos ou que l’on ne dégage pas. Cette expression française conserve la même métaphore générale et marque clairement qu’il ne faut pas abandonner l’autre élément.
- source_word: יְרֵא אֱלֹהִים
  choice: celui qui craint Dieu
  rationale: Le participe désigne une personne caractérisée par sa crainte de Dieu. La formulation est actuelle, digne et n’ajoute aucune précision absente de l’hébreu.
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: sortira de tout cela
  rationale: יָצָא garde son image fondamentale de sortie. La construction avec אֶת est inhabituelle et le sens exact reste discuté; cette traduction demeure proche de l’image sans la résoudre explicitement en « évitera » ou « accomplira ».
theological_decisions:
- issue: Portée de la proposition finale
  choice: La personne qui craint Dieu « sortira de tout cela », formulation qui conserve l’image et une part de l’ambiguïté de l’hébreu.
  alternative: La personne qui craint Dieu évitera les deux extrêmes, ou saura mener à bien les deux exigences.
  rationale: Le texte hébreu est condensé et sa construction finale est difficile. Il ne faut pas imposer une lecture doctrinale ou morale plus précise que le texte lui-même.
translation_notes:
  register: Français international moderne, avec tutoiement conforme à l’adresse hébraïque au singulier. Le parallélisme « ceci… cela » et la métaphore de la prise sont conservés, tandis que la syntaxe est rendue naturelle en français.
