id: ECC.7.9
reference: Ecclesiastes 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תְּבַהֵ֥ל בְּ/רֽוּחֲ/ךָ֖ לִ/כְע֑וֹס כִּ֣י כַ֔עַס בְּ/חֵ֥יק כְּסִילִ֖ים יָנֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
translation:
  language: fr
  text: Ne t’empresse pas, dans ton esprit, de t’irriter, car l’irritation repose dans le sein des insensés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le giron des insensés ». L’image hébraïque présente l’irritation comme installée tout près de leur vie intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  choice: t’empresse pas
  rationale: Avec אַל, le verbe exprime l’interdiction de se hâter impulsivement. La tournure française met en garde contre une disposition trop prompte à la colère.
- source_word: בְּרוּחֲךָ
  choice: dans ton esprit
  rationale: רוּחַ désigne ici la disposition intérieure. La traduction conserve l’image anthropologique hébraïque sans la réduire au seul « caractère ».
- source_word: לִכְעוֹס
  choice: de t’irriter
  rationale: L’infinitif décrit l’entrée dans un état de colère. « S’irriter » rend naturellement ce mouvement en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation dans un style proverbial concis.
- source_word: כַעַס
  choice: l’irritation
  rationale: Le nom peut désigner la colère, l’irritation ou le dépit. « Irritation » maintient ici le lien lexical et sémantique avec « t’irriter ».
- source_word: בְּחֵיק
  choice: dans le sein
  rationale: חֵיק évoque le sein ou le giron, lieu où quelque chose est tenu tout près de soi. « Dans le sein » conserve cette image, avec une note signalant l’autre rendu concret.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Terme sapientiel désignant des personnes moralement et intellectuellement dépourvues de discernement. « Insensés » convient au registre digne de l’Ecclésiaste.
- source_word: יָנוּחַ
  choice: repose
  rationale: Le verbe signifie se poser, se reposer ou demeurer. « Repose » garde l’image troublante d’une irritation installée à demeure chez les insensés.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme et les images hébraïques de l’« esprit », du « sein » et du repos de l’irritation sont préservés, tout en gardant une syntaxe naturelle.
