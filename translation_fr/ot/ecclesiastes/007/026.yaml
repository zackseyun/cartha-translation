  rationale: La seule modification nécessaire remplace le pronom potentiellement ambigu par « à la femme ». Elle maintient la référence féminine singulière, le mouvement d’échappement exprimé par le nifal de מלט et le registre du passage. La note b est ajustée de façon correspondante.
