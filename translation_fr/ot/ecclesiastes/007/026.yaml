  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: fr
  text: Et je trouve plus amère que la mort la femme dont le cœur est pièges et filets[a], et dont les mains sont des chaînes. Celui qui est bon devant Dieu échappera à la femme[b], mais celui qui pèche sera pris par elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont le cœur est embûches et filets ».'
    reason: Alternative lexicale pour מְצוֹדִים, qui peut désigner des pièges ou des embûches.
  - marker: b
    text: 'Ou : « Celui qui plaît à Dieu échappera à la femme ».'
    reason: טוֹב לִפְנֵי הָאֱלֹהִים peut se comprendre idiomatiquement comme le fait d’être agréable à Dieu.
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: Et je trouve
  rationale: Le participe avec sujet explicite exprime ici naturellement une constatation présente du Qohélet.
- source_word: מַר מִמָּוֶת
  choice: plus amère que la mort
  rationale: Cette formulation rend directement le comparatif hébreu et conserve son image saisissante.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’article défini hébreu est conservé sans préciser s’il s’agit d’une personne particulière, d’un type ou d’une figure.
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: pièges et filets
  rationale: Les deux termes relèvent du champ lexical de la capture; cette paire est claire en français et maintient le parallélisme imagé.
- source_word: לִבָּהּ
  choice: dont le cœur est pièges et filets
  rationale: Le cœur demeure le siège des intentions et des désirs; la métaphore nominale abrupte de l’hébreu est préservée.
- source_word: אֲסוּרִים יָדֶיהָ
  choice: dont les mains sont des chaînes
  rationale: « Chaînes » concrétise les liens évoqués par אֲסוּרִים et s’accorde avec l’imagerie de l’emprisonnement.
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Celui qui est bon devant Dieu
  rationale: La traduction garde la valeur lexicale de טוֹב et l’expression relationnelle « devant Dieu », sans imposer l’interprétation plus idiomatique « qui plaît à Dieu ».
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: lui échappera
  rationale: Le nifal de מלט exprime le fait d’échapper; le pronom français reprend naturellement « la femme ».
- source_word: וְחוֹטֵא
  choice: mais celui qui pèche
  rationale: Le participe substantivé désigne la personne qui pèche; cette formulation évite que « le pécheur » soit compris uniquement comme une identité figée.
- source_word: יִלָּכֶד בָּהּ
  choice: sera pris par elle
  rationale: Le passif de לכד signifie être capturé ou pris; « par elle » rend ici la femme comme source de la capture.
theological_decisions:
- issue: Faut-il généraliser ou atténuer le portrait de « la femme » ?
  choice: Conserver le singulier défini « la femme » et l’imagerie du texte.
  alternative: « une femme », « la femme séductrice » ou une identification explicite à la folie personnifiée.
  rationale: L’hébreu emploie le singulier avec l’article et ne tranche pas explicitement entre une femme particulière, un type moral et une personnification. La traduction préserve cette tension sans étendre le propos à toutes les femmes.
- issue: Sens de טוֹב לִפְנֵי הָאֱלֹהִים
  choice: « Celui qui est bon devant Dieu »
  alternative: « Celui qui plaît à Dieu »
  rationale: L’alternative est idiomatiquement possible, mais le texte principal conserve les éléments lexicaux de l’hébreu; la nuance interprétative est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la force et l’étrangeté mesurée des métaphores hébraïques, notamment « le cœur est pièges et filets », tout en employant des enchaînements français naturels.
