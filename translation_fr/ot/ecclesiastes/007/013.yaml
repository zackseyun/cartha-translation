  text: רְאֵ֖ה אֶת מַעֲשֵׂ֣ה הָ/אֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְ/תַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/013.yaml
  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: fr
  text: Considère l’œuvre de Dieu, car qui peut redresser ce qu’il a courbé ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Considère
  rationale: L’impératif appelle ici à porter une attention réfléchie à l’action de Dieu, plutôt qu’à simplement regarder.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: l’œuvre de Dieu
  rationale: Cette expression large et naturelle désigne ce que Dieu fait ou a fait.
- source_word: כִּי
  choice: ':'
  rationale: En français, les deux-points rendent naturellement le lien explicatif entre l’exhortation et la question rhétorique, sans alourdir la phrase par « car ».
- source_word: מִי יוּכַל לְתַקֵּן
  choice: qui peut redresser
  rationale: La formulation conserve la question rhétorique et l’image concrète de rendre droit, en contraste direct avec « rendu courbe ».
- source_word: אֵת אֲשֶׁר עִוְּתוֹ
  choice: ce qu’il a rendu courbe
  rationale: Le pronom masculin singulier renvoie naturellement à Dieu dans le contexte. « Rendu courbe » préserve la métaphore et son opposition avec « redresser ».
theological_decisions:
- issue: Référent et portée du suffixe masculin singulier dans עִוְּתוֹ
  choice: 'Dieu est le sujet implicite : « ce qu’il a rendu courbe »'
  alternative: « ce qui a été rendu courbe » ou « ce qu’il a courbé »
  rationale: Le contexte immédiat mentionne l’œuvre de Dieu, et la grammaire hébraïque porte un sujet masculin singulier. La formulation personnelle conserve sans l’atténuer la tension du texte concernant l’action souveraine de Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image antithétique « redresser / rendre courbe » et le caractère méditatif de la littérature sapientielle.
