  text: ט֛וֹב אַחֲרִ֥ית דָּבָ֖ר מֵֽ/רֵאשִׁית֑/וֹ ט֥וֹב אֶֽרֶךְ ר֖וּחַ מִ/גְּבַהּ רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/008.yaml
  text: The end of a matter is better than its beginning[a]; patience is better than a proud spirit.
translation:
  language: fr
  text: Mieux vaut la fin d’une affaire que son commencement ; mieux vaut être patient[a] que d’avoir l’esprit hautain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « être long d’esprit », expression qui désigne la patience ou la lenteur à s’irriter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִית
  choice: la fin
  rationale: Le terme désigne la fin, la dernière partie ou l’issue. « La fin » conserve directement le contraste temporel avec le commencement, sans exclure la nuance d’issue.
- source_word: דָּבָר
  choice: une affaire
  rationale: Le mot peut signifier parole, chose ou affaire. Ici, « affaire » désigne naturellement ce qui suit un déroulement, depuis son commencement jusqu’à sa fin.
- source_word: מֵרֵאשִׁיתוֹ
  choice: que son commencement
  rationale: La préposition מִן marque ici la comparaison introduite par טוֹב ; le suffixe masculin singulier renvoie à דָּבָר.
- source_word: אֶרֶךְ רוּחַ
  choice: être patient
  rationale: L’expression signifie littéralement « long d’esprit » et décrit la patience, notamment la lenteur à s’irriter. La tournure verbale est claire et naturelle en français moderne.
- source_word: מִגְּבַהּ רוּחַ
  choice: qu’avoir l’esprit orgueilleux
  rationale: L’expression évoque l’élévation hautaine de l’esprit. Cette formulation préserve la mention explicite de l’esprit et exprime clairement l’orgueil intérieur.
- source_word: טוֹב
  choice: mieux vaut
  rationale: Dans les deux propositions, טוֹב a une valeur comparative. « Mieux vaut… que… » rend ce parallélisme proverbial de manière naturelle et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme hébreu est conservé par la répétition de « mieux vaut », tandis que la seconde expression garde explicitement la notion d’esprit.
