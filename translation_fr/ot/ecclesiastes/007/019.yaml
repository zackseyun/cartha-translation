  text: הַֽ/חָכְמָ֖ה תָּעֹ֣ז לֶ/חָכָ֑ם מֵֽ/עֲשָׂרָה֙ שַׁלִּיטִ֔ים אֲשֶׁ֥ר הָי֖וּ בָּ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/019.yaml
  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
translation:
  language: fr
  text: La sagesse donne au sage plus de force que dix dirigeants qui se trouvaient dans une ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la ville ». La forme hébraïque peut être comprise comme définie, mais la maxime semble avoir une portée générale plutôt que de désigner une ville précise.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  choice: La sagesse
  rationale: L’article hébreu est conservé naturellement en français devant le nom abstrait « sagesse », sans impliquer une personnification théologique.
- source_word: תָּעֹז
  choice: donne […] plus de force
  rationale: 'Cette formulation naturelle conserve la valeur causative du verbe dans la comparaison : la sagesse confère au sage une force supérieure.'
- source_word: לֶחָכָם
  choice: au sage
  rationale: La préposition ל marque ici le bénéficiaire. « Au sage » respecte le singulier masculin de la maxime tout en restant idiomatique.
- source_word: מֵעֲשָׂרָה
  choice: plus […] que dix
  rationale: La préposition מ introduit une comparaison; la construction discontinue « plus de force que dix » est naturelle en français.
- source_word: שַׁלִּיטִים
  choice: dirigeants
  rationale: Le terme désigne des personnes qui exercent l’autorité. « Dirigeants » convient au cadre urbain sans préciser indûment leur fonction.
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: qui se trouvaient dans une ville
  rationale: La proposition relative est conservée. Bien que בָּעִיר porte formellement l’article défini, l’indéfini rend naturellement la portée générale de la maxime; l’autre lecture est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et proverbial. La formulation reste proche de la syntaxe hébraïque tout en évitant une tournure lourde; elle ne personnifie pas théologiquement la sagesse et maintient la comparaison avec les dix détenteurs de l’autorité.
