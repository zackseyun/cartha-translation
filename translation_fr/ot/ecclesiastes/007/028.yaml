  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: fr
  text: 'ce que mon âme cherchait encore[a], mais que je n’ai pas trouvé : j’ai trouvé un homme sur mille, mais, parmi tout cela, je n’ai trouvé aucune femme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « mon âme » peut ici désigner la personne elle-même ou son être intérieur : « ce que je cherchais encore ».'
    reason: lexical_alternative
  - marker: b
    text: « Parmi tout cela » renvoie à l’ensemble considéré dans cette recherche. Le verset rapporte ce que le locuteur dit avoir trouvé ; il ne formule pas nécessairement une affirmation universelle sur toutes les femmes.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ce que
  rationale: Le relatif reprend et prolonge la pensée du verset précédent sans transformer le fragment hébreu en nouvelle proposition indépendante.
- source_word: עוֹד
  choice: encore
  rationale: Exprime la poursuite de la recherche et correspond naturellement à l’aspect continu du contexte.
- source_word: בִּקְשָׁה נַפְשִׁי
  choice: mon âme cherchait
  rationale: Conserve l’image hébraïque où l’âme du locuteur est le sujet, tout en restant intelligible en français moderne.
- source_word: וְלֹא מָצָאתִי
  choice: mais que je n’ai pas trouvé
  rationale: Le waw prend ici une valeur adversative naturelle entre la recherche et son résultat négatif.
- source_word: אָדָם
  choice: un homme
  rationale: Le terme est ici explicitement mis en contraste avec « une femme » ; une traduction générique comme « une personne » effacerait ce contraste.
- source_word: אֶחָד מֵאֶלֶף
  choice: un homme sur mille
  rationale: « Sur mille » rend de manière idiomatique et exacte la proportion exprimée par l’hébreu.
- source_word: וְאִשָּׁה בְכָל אֵלֶּה לֹא מָצָאתִי
  choice: mais, parmi toutes celles-ci, je n’ai trouvé aucune femme
  rationale: La formulation française conserve le contraste et le groupe précis dans lequel porte la recherche, sans transformer le constat en affirmation universelle.
theological_decisions:
- issue: Portée potentiellement généralisante ou misogyne du constat
  choice: Présenter les mots comme le résultat limité de la recherche rapportée par Qohéleth.
  alternative: En faire un jugement universel sur toutes les femmes, ou atténuer la déclaration par une paraphrase.
  rationale: Le texte affirme qu’aucune femme n’a été trouvée « parmi toutes celles-ci ». La traduction préserve cette tension sans élargir la portée du propos au-delà du groupe considéré et sans en émousser la formulation.
translation_notes:
  register: Français international moderne, sobre et littéraire. La syntaxe relative maintient le lien avec le verset précédent. L’expression « mon âme » conserve la texture de l’hébreu, tandis que « sur mille » et « aucune femme » assurent une lecture naturelle.
