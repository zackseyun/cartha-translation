base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: fr
  text: Je me suis tourné[a], moi et mon cœur, pour connaître, explorer et rechercher la sagesse et une explication[b], et pour connaître la méchanceté de la sottise et la folie de la démence[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai changé d’orientation ». Le verbe hébreu évoque littéralement le fait de se tourner.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner un calcul, un compte, un raisonnement ou un exposé raisonné.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu juxtapose ici les noms. On peut aussi comprendre : « que la méchanceté est sottise et que la folie est démence ».'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  choice: Je me suis tourné
  rationale: Le verbe סבב évoque littéralement le fait de se tourner ou de changer d’orientation. Cette formulation conserve l’image concrète d’une réorientation volontaire de la recherche.
- source_word: אֲנִי וְלִבִּי
  choice: moi et mon cœur
  rationale: L’hébreu coordonne explicitement la personne qui parle et son cœur. Le mot « cœur » est conservé comme siège de la réflexion et de la volonté, sans le réduire au seul « esprit ».
- source_word: לָדַעַת
  choice: pour connaître / pour reconnaître
  rationale: Le verbe ידע est répété. « Connaître » convient à la recherche initiale; « reconnaître » rend naturellement en français la conclusion évaluative de la seconde occurrence tout en maintenant le lien lexical.
- source_word: לָתוּר
  choice: explorer
  rationale: תור désigne une recherche menée en parcourant ou en examinant. « Explorer » le distingue du verbe בקש qui suit.
- source_word: וּבַקֵּשׁ
  choice: rechercher
  rationale: בקש signifie chercher ou rechercher. Ce choix préserve l’accumulation de verbes d’enquête sans reproduire le même terme français.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Traduction usuelle et terme central de l’Ecclésiaste.
- source_word: חֶשְׁבּוֹן
  choice: une explication
  rationale: Le nom peut désigner un calcul, un compte, un raisonnement ou un exposé raisonné. Dans ce contexte d’enquête intellectuelle, « explication » est clair et naturel, tandis qu’une note conserve l’étendue du terme.
- source_word: רֶשַׁע
  choice: la méchanceté
  rationale: רשע porte ici une valeur morale et désigne la conduite mauvaise ou coupable. « Méchanceté » conserve cette force éthique.
- source_word: כֶּסֶל
  choice: sottise
  rationale: Dans la littérature de sagesse, כסל désigne une sottise intellectuelle et morale. « Sottise » permet de la distinguer du quasi-synonyme suivant.
- source_word: הַסִּכְלוּת
  choice: la folie
  rationale: Le terme désigne le manque de discernement ou la folie. « Folie » est idiomatique et maintient la proximité sémantique avec כסל sans répétition exacte.
- source_word: הוֹלֵלוֹת
  choice: démence
  rationale: הוללות exprime une irrationalité extrême, proche de la démence. Le choix garde la progression évaluative du texte et évite de répéter « folie ».
theological_decisions:
- issue: Langage anthropologique du « cœur »
  choice: Conserver « moi et mon cœur » dans le texte principal
  alternative: « moi et mon esprit » ou « de tout mon cœur »
  rationale: Le cœur représente en hébreu la faculté intérieure de penser et de vouloir. Le conserver respecte l’anthropologie et la formulation marquée de la source, sans imposer une distinction psychologique moderne.
- issue: Rapport entre méchanceté, sottise, folie et démence
  choice: 'Rendre les groupes nominaux comme deux propositions d’identification : « la méchanceté est sottise » et « la folie est démence »'
  alternative: « la méchanceté de la sottise et la folie de la démence »
  rationale: L’hébreu juxtapose des noms sans verbes exprimés. L’ajout de « est » donne en français une lecture évaluative naturelle sans effacer, grâce à la note, la concision et l’ambiguïté syntaxique de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence cumulative des trois verbes de recherche est conservée. La tournure inhabituelle « moi et mon cœur » est volontairement maintenue pour refléter l’expression hébraïque, avec une note explicative limitée au premier verbe.
