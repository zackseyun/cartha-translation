source:
  edition: WLC
  text: אַל תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְ/אַל תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖/מָּה תִּשּׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: fr
  text: Ne sois pas juste à l’excès[a] et ne te montre pas trop sage. Pourquoi te ruinerais-tu[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne sois pas juste outre mesure. »'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi évoquer le fait d’être dévasté, désolé ou frappé de stupeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Ne sois pas
  rationale: La particule négative suivie de l’imparfait exprime ici une défense ou un avertissement; cette tournure française en conserve la force directe.
- source_word: צַדִּיק הַרְבֵּה
  choice: juste à l’excès
  rationale: « Juste » rend directement צַדִּיק, tandis que « à l’excès » préserve la qualification apportée par הַרְבֵּה sans suggérer que la justice serait mauvaise en elle-même.
- source_word: וְאַל תִּתְחַכַּם יוֹתֵר
  choice: et ne te crois pas trop sage
  rationale: Le hitpael de חכם peut évoquer une sagesse que l’on s’attribue ou que l’on cherche à afficher. « Ne te crois pas trop sage » est naturel en français et garde cette possible nuance réflexive, sans la réduire à une simple possession de sagesse.
- source_word: לָמָּה
  choice: Pourquoi… ?
  rationale: Introduit une question rhétorique à valeur d’avertissement.
- source_word: תִּשּׁוֹמֵם
  choice: causerais-tu ta propre ruine
  rationale: Le verbe שמם peut exprimer la dévastation, la désolation ou la stupeur. Dans ce contexte, la ruine personnelle est une lecture naturelle, mais la note conserve l’étendue sémantique du terme.
theological_decisions:
- issue: Portée de l’avertissement contre une justice et une sagesse excessives
  choice: Conserver la formulation paradoxale comme une mise en garde contre l’excès, sans expliquer dans le texte qu’il s’agirait précisément de suffisance morale ou de fausse sagesse.
  alternative: Paraphraser explicitement « Ne sois pas pharisien » ou « Ne cherche pas à paraître plus juste et plus sage que tu ne l’es ».
  rationale: Les adverbes הַרְבֵּה et יוֹתֵר indiquent l’excès, mais le verset ne définit pas précisément la nature de cet excès. La traduction doit préserver cette tension plutôt que lui imposer une interprétation confessionnelle ou psychologique.
- issue: Sens de תִּשּׁוֹמֵם
  choice: Exprimer la ruine personnelle dans le texte et signaler en note les sens de désolation ou de stupeur.
  alternative: Traduire directement « Pourquoi serais-tu frappé de stupeur ? »
  rationale: La forme et le lexème permettent plusieurs nuances. « Ta propre ruine » s’accorde bien au contexte admonitoire, tandis que la note évite de masquer l’ambiguïté réelle.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et proverbiale. « Ne te crois pas trop sage » évite le calque peu naturel « ne te rends pas trop sage » tout en conservant la nuance réflexive possible du verbe hébreu; les deux marqueurs de note figurent dans le texte.
