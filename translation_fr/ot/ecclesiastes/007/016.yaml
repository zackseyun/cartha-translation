  source_fidelity: '« Ne sois pas juste à l’excès » rend fidèlement אַל תְּהִי צַדִּיק הַרְבֵּה. En revanche, « ne te crois pas trop sage » déplace la nuance du hitpael vers une opinion subjective sur soi-même; « ne te montre pas trop sage » conserve mieux l’idée de se donner pour sage ou de faire le sage. « Pourquoi causerais-tu ta propre ruine ? » introduit indûment une construction causative: le verbe hébreu décrit le sujet comme celui qui est ruiné/dévasté. « Pourquoi te ruinerais-tu ? » est plus direct et fidèle, tout en laissant la note signaler l’ambiguïté lexicale.'
