source:
  edition: WLC
  text: ט֥וֹב שֵׁ֖ם מִ/שֶּׁ֣מֶן ט֑וֹב וְ/י֣וֹם הַ/מָּ֔וֶת מִ/יּ֖וֹם הִוָּלְדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: fr
  text: Un bon nom vaut mieux qu’une huile fine[a], et le jour de la mort vaut mieux que le jour de sa naissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une bonne huile »; on peut aussi comprendre « un parfum raffiné » ou « une huile parfumée précieuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: un bon nom
  rationale: La formulation conserve l’image hébraïque du « nom », qui désigne ici la réputation ou la renommée, tout en restant compréhensible en français moderne.
- source_word: מִשֶּׁמֶן טוֹב
  choice: vaut mieux qu’une huile fine
  rationale: La préposition מִן marque la comparaison. « Huile fine » conserve l’image concrète de l’hébreu tout en évoquant naturellement une huile précieuse, souvent parfumée.
- source_word: וְיוֹם הַמָּוֶת
  choice: et le jour de la mort
  rationale: Cette expression définie et générique préserve la forme proverbiale du texte hébreu.
- source_word: מִיּוֹם הִוָּלְדוֹ
  choice: vaut mieux que le jour de sa naissance
  rationale: Le comparatif, sous-entendu dans le second membre hébreu, est répété pour produire une phrase française claire. Le possessif « sa » rend le suffixe masculin singulier sans imposer en français le genre de la personne représentative.
theological_decisions:
- issue: Portée du suffixe masculin singulier dans הִוָּלְדוֹ
  choice: sa naissance
  alternative: le jour où il est né
  rationale: Le suffixe hébreu est masculin singulier, mais il fonctionne de manière représentative dans ce proverbe. Le français « sa naissance » conserve le singulier et le lien personnel sans transformer cette forme grammaticale en affirmation portant exclusivement sur un homme.
- issue: Comparaison entre le jour de la mort et celui de la naissance
  choice: répéter « vaut mieux » sans expliquer la raison
  alternative: laisser le comparatif entièrement sous-entendu
  rationale: La répétition explicite en français rend le parallélisme intelligible, tout en préservant la tension provocante du dicton et sans lui ajouter d’explication théologique.
translation_notes:
  register: Français moderne, sobre et proverbial. « Un bon nom » maintient l’image et la concision de l’hébreu; « huile fine » évite une tournure trop raide tout en conservant la métaphore originale.
