  text: לְ/בַד֙ רְאֵה זֶ֣ה מָצָ֔אתִי אֲשֶׁ֨ר עָשָׂ֧ה הָ/אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם יָשָׁ֑ר וְ/הֵ֥מָּה בִקְשׁ֖וּ חִשְּׁבֹנ֥וֹת רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/029.yaml
  text: 'Only see this: I have found that God made man upright[b][a], but they have sought out many schemes.'
translation:
  language: fr
  text: 'Voici la seule chose que j’ai trouvée : Dieu a créé les êtres humains droits, mais ils ont recherché bien des projets.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien des calculs », « bien des plans », « bien des procédés » ou « bien des stratagèmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  choice: Voici seulement ce que
  rationale: La formule attire l’attention sur une conclusion précise et restrictive. « Voici seulement ce que » est naturel et digne en français, sans l’archaïsme de « vois » employé comme interjection.
- source_word: מָצָאתִי
  choice: j’ai trouvé
  rationale: Le passé composé exprime une conclusion acquise qui demeure pertinente dans le discours.
- source_word: עָשָׂה ... אֶת־הָאָדָם יָשָׁר
  choice: a fait l’être humain droit
  rationale: הָאָדָם désigne ici l’humanité de manière générique, tandis que יָשָׁר évoque ce qui est droit, juste ou intègre. « L’être humain droit » conserve le singulier collectif et la portée morale sans limiter le propos au sexe masculin.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Équivalent français courant et contextuellement approprié du nom divin avec l’article.
- source_word: וְהֵמָּה
  choice: mais les humains
  rationale: Le pluriel hébreu reprend le singulier collectif הָאָדָם. La répétition explicite évite un pronom français discordant ou ambigu et rend clairement le passage de l’humanité collective aux individus.
- source_word: בִּקְשׁוּ
  choice: ont recherché
  rationale: Le verbe exprime une quête intentionnelle. « Ont recherché » garde son sens lexical plutôt que de l’assimiler directement à « ont inventé ».
- source_word: חִשְּׁבֹנוֹת רַבִּים
  choice: bien des inventions
  rationale: Le nom peut désigner des calculs, plans, procédés ou inventions. « Inventions » garde l’idée de constructions humaines élaborées et laisse au contexte sa nuance critique, sans la rendre exclusivement malveillante.
theological_decisions:
- issue: Portée générique de הָאָדָם et reprise plurielle וְהֵמָּה
  choice: « l’être humain » puis « les humains »
  alternative: « l’homme » puis « eux »
  rationale: Le texte passe d’un singulier collectif désignant l’humanité à un pluriel. La formulation choisie reproduit ce mouvement sans faire croire que le premier terme vise seulement les hommes.
- issue: Valeur morale de חִשְּׁבֹנוֹת
  choice: « inventions » avec alternatives en note
  alternative: « manigances » ou « stratagèmes »
  rationale: Le contexte oppose la droiture donnée par Dieu aux multiples élaborations humaines, mais le mot lui-même peut aussi signifier calculs, plans ou procédés. « Inventions » préserve cette largeur sémantique et évite de renforcer sans nécessité la qualification morale.
translation_notes:
  register: Français international moderne, sobre et soutenu. La formulation demeure accessible, conserve l’opposition entre la droiture originelle et la multiplicité des élaborations humaines, et explicite naturellement la reprise plurielle du collectif hébreu.
