revisions:
- from: 'Voici seulement ce que j’ai trouvé : Dieu a fait l’être humain droit, mais les humains ont recherché bien des inventions.[a]'
  to: 'Voici la seule chose que j’ai trouvée : Dieu a créé les êtres humains droits, mais ils ont recherché bien des projets.[a]'
  rationale: La révision rend explicitement la limitation introduite par לְבַד, emploie une formulation française plus naturelle pour l’affirmation générique sur l’humanité, et choisit « projets » afin de préserver l’amplitude de חִשְּׁבֹנוֹת sans imposer une nuance technique ou moralement péjorative. La note maintient les principales possibilités lexicales.
