source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: fr
  text: 'Au jour du bonheur, jouis du bonheur[a] ; au jour du malheur, réfléchis : Dieu a fait l’un comme l’autre, afin que l’être humain ne découvre rien de ce qui viendra après lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sois heureux ». L’expression hébraïque est idiomatique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne découvre rien de ce qui arrivera ensuite ». L’hébreu peut désigner l’avenir qui lui échappe ou ce qui viendra après lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: Au jour du bonheur
  rationale: יוֹם accompagné d’un nom abstrait désigne ici une période ou une situation; טוֹבָה évoque des circonstances favorables plutôt que la bonté morale.
- source_word: הֱיֵה בְטוֹב
  choice: jouis du bonheur
  rationale: L’expression est idiomatique. Cette formulation française naturelle conserve l’impératif et reprend le champ lexical du bonheur sans réduire le sens à une simple humeur joyeuse.
- source_word: וּבְיוֹם רָעָה
  choice: au jour du malheur
  rationale: רָעָה s’oppose ici aux circonstances heureuses et désigne le malheur ou l’adversité, non nécessairement le mal moral.
- source_word: רְאֵה
  choice: réfléchis
  rationale: L’impératif de ראה appelle ici à porter un regard réfléchi sur la situation, et non seulement à voir matériellement.
- source_word: גַּם אֶת־זֶה לְעֻמַּת זֶה
  choice: l’un comme l’autre
  rationale: La formule met les deux réalités en correspondance, l’une en regard de l’autre, tout en affirmant qu’elles relèvent toutes deux de l’action divine.
- source_word: עָשָׂה הָאֱלֹהִים
  choice: Dieu a fait
  rationale: Le verbe עשה attribue explicitement à Dieu l’action concernant les deux situations; « a fait » reste sobre et proche de l’hébreu.
- source_word: עַל דִּבְרַת
  choice: afin que
  rationale: La locution peut introduire le but ou le résultat; « afin que » conserve ici la formulation téléologique du texte.
- source_word: שֶׁלֹּא יִמְצָא הָאָדָם
  choice: que l’être humain ne découvre
  rationale: מצא signifie ici découvrir ou parvenir à connaître. האדם est un singulier collectif et représentatif; « l’être humain » restitue ce sens générique en français moderne.
- source_word: אַחֲרָיו מְאוּמָה
  choice: rien de ce qui viendra après lui
  rationale: מְאוּמָה sous la négation signifie « rien ». אַחֲרָיו demeure ambigu entre ce qui survient ultérieurement et ce qui arrivera après la personne; la formulation retenue préserve cette perspective personnelle.
theological_decisions:
- issue: Action divine dans le bonheur et le malheur
  choice: Dieu a fait l’un comme l’autre
  alternative: Dieu a disposé l’un en regard de l’autre
  rationale: L’hébreu attribue les deux réalités à l’action de Dieu. La traduction conserve cette tension sans préciser un mécanisme causal ni proposer une théodicée absente du verset.
- issue: Sens générique de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le terme désigne ici l’humanité représentée par un individu. En français contemporain, « l’être humain » exprime clairement cette portée générique sans modifier la fonction du singulier.
- issue: Portée de אַחֲרָיו
  choice: ce qui viendra après lui
  alternative: ce qui arrivera ensuite
  rationale: Le syntagme peut viser l’avenir inconnaissable en général ou ce qui adviendra après la personne. Le texte principal suit la construction personnelle de l’hébreu, et la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « jour du bonheur / jour du malheur » et la formulation concise de la souveraineté divine sont conservés; la ponctuation explicite le mouvement réflexif sans résoudre l’ambiguïté finale.
