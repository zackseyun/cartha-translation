revisions:
- from: Mieux vaut aller dans une maison en deuil que dans une maison où l’on festoie, car telle est la fin de tout être humain, et celui qui est en vie doit la prendre à cœur.
  to: Mieux vaut aller dans une maison en deuil que dans une maison où l’on festoie, car c’est là la fin de tout être humain, et les vivants le prennent à cœur.
  rationale: La révision conserve tous les éléments sémantiques du texte source tout en clarifiant, dans un français proverbial naturel, que la maison de deuil confronte à la fin humaine et que les vivants doivent intégrer ce constat. Le présent « prennent » exprime la valeur gnomique de la maxime sans imposer une lecture temporelle ou doctrinale du yiqtol hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèlement rendu : la comparaison entre la maison de deuil et celle du festin, l’universalité de la mort (כָּל־הָאָדָם) et l’appel à en tirer une réflexion intérieure sont conservés. « C’est là » rend plus clairement le démonstratif הוּא, qui renvoie à la réalité de la mort manifestée dans la maison de deuil.'
  naturalness: « Maison en deuil » et « maison où l’on festoie » sont naturels en français international moderne. La formulation « car telle est la fin » est cependant légèrement littéraire et laisse un antécédent grammaticalement flottant ; « car c’est là la fin » est plus idiomatique et plus transparent. « Les vivants le prennent à cœur » restitue naturellement la portée générique de וְהַחַי et l’idiome hébreu.
  terminology: « Tout être humain » rend correctement אָדָם dans son emploi générique, sans introduire une restriction masculine. « Prendre à cœur » est l’équivalent idiomatique approprié de יִתֵּן אֶל־לִבּוֹ. Aucun terme théologique spécialisé n’est en jeu.
  issues:
  - severity: low
    issue: Référent de « telle » et du pronom « la »
    rationale: Dans « car telle est la fin ... et celui qui est en vie doit la prendre à cœur », « telle » peut sembler renvoyer formellement à la maison plutôt qu’à la réalité de la mort, et « la » reprend alors une référence moins nette. « C’est là » suivi de « le » désigne clairement le constat précédent sans expliciter davantage que l’hébreu.
  - severity: low
    issue: Rendu de וְהַחַי
    rationale: « Celui qui est en vie » est possible, mais « les vivants » est la désignation collective française la plus naturelle pour le substantif générique hébreu et évite une tournure un peu lourde.
  revised_text: Mieux vaut aller dans une maison en deuil que dans une maison où l’on festoie, car c’est là la fin de tout être humain, et les vivants le prennent à cœur.
  revised_footnotes: []
