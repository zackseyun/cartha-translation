source:
  edition: WLC
  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: fr
  text: Mieux vaut aller dans une maison en deuil que dans une maison où l’on festoie, car c’est là la fin de tout être humain, et les vivants le prennent à cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: La tournure française exprime naturellement le jugement comparatif de la maxime de sagesse.
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: aller… que…
  rationale: Dans le contexte de la fréquentation de deux lieux ou événements, « aller » est l’équivalent français naturel; la seconde occurrence est implicitement portée par la construction comparative.
- source_word: בֵּית אֵבֶל
  choice: une maison en deuil
  rationale: Cette expression actuelle désigne naturellement une maison marquée par un décès et les lamentations, sans supposer un bâtiment institutionnel.
- source_word: בֵּית מִשְׁתֶּה
  choice: une maison où l’on festoie
  rationale: מִשְׁתֶּה évoque un festin ou banquet, souvent accompagné de boisson; la formulation maintient le contraste entre deuil et réjouissances.
- source_word: בַּאֲשֶׁר
  choice: car
  rationale: La conjonction introduit la raison du jugement de sagesse; « car » convient au registre proverbial et dignifié.
- source_word: סוֹף כָּל הָאָדָם
  choice: la fin de tout être humain
  rationale: אָדָם a ici une portée générique qui englobe l’humanité; « tout être humain » rend cette universalité sans lecture exclusivement masculine.
- source_word: וְהַחַי
  choice: celui qui est en vie
  rationale: Le singulier substantivé hébreu est générique. Cette formulation française en conserve le nombre tout en restant naturelle.
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: doit la prendre à cœur
  rationale: Littéralement « mettra/donnera à son cœur »; l’idiome français exprime une réflexion intérieure sérieuse. « Doit » communique la portée exhortative de la maxime plutôt qu’une simple prédiction.
theological_decisions:
- issue: Portée de אָדָם dans l’affirmation universelle sur la mortalité
  choice: tout être humain
  alternative: tout homme; toute l’humanité
  rationale: Avec כָּל, אָדָם désigne ici l’être humain de manière générique. La traduction choisie conserve l’universalité et évite qu’un lecteur moderne ne comprenne une restriction aux hommes de sexe masculin.
- issue: Référent de « telle » et du pronom dans « la prendre à cœur »
  choice: La scène du deuil manifeste la fin qui attend tout être humain
  alternative: La maison en deuil elle-même est la fin de tout être humain
  rationale: Le démonstratif hébreu הוּא peut reprendre la réalité présente dans la maison de deuil, à savoir la mort. La formulation française conserve une certaine concision sans développer explicitement ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, proverbial et dignifié. La phrase conserve le contraste net entre deuil et festin, ainsi que la tension entre constat de la mortalité et exhortation à la méditer.
