source:
  edition: WLC
  text: אַל תֹּאמַר֙ מֶ֣ה הָיָ֔ה שֶׁ֤/הַ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים הָי֥וּ טוֹבִ֖ים מֵ/אֵ֑לֶּה כִּ֛י לֹ֥א מֵ/חָכְמָ֖ה שָׁאַ֥לְתָּ עַל זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/010.yaml
  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: fr
  text: 'Ne dis pas : « Pourquoi les jours d’autrefois étaient-ils meilleurs que ceux-ci ? » Car ce n’est pas par sagesse que tu poses cette question.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: La particule אַל suivie de l’imparfait exprime ici une interdiction adressée à une seule personne ; « Ne dis pas » est direct et naturel.
- source_word: מֶה הָיָה
  choice: Pourquoi… étaient-ils
  rationale: Dans cette construction, l’expression introduit une question portant sur la raison. Une traduction littérale avec « quoi » serait obscure en français.
- source_word: הַיָּמִים הָרִאשֹׁנִים
  choice: les jours d’autrefois
  rationale: Cette formulation désigne naturellement les temps passés tout en conservant l’image hébraïque des « jours ».
- source_word: הָיוּ טוֹבִים מֵאֵלֶּה
  choice: étaient-ils meilleurs que ceux-ci
  rationale: Le comparatif hébreu est rendu directement. « Ceux-ci » renvoie sans ambiguïté aux jours présents, sans les expliciter dans le texte.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’interdiction et maintient le ton proverbial.
- source_word: לֹא מֵחָכְמָה
  choice: ce n’est pas par sagesse
  rationale: « Par sagesse » exprime en français la source ou le fondement indiqué par מִן, sans réduire l’expression au simple adverbe « sagement ».
- source_word: שָׁאַלְתָּ עַל זֶה
  choice: tu poses cette question
  rationale: Le parfait hébreu peut avoir ici une portée générale dans la maxime. « Poser cette question » rend idiomatiquement le verbe « demander » suivi de « à propos de cela ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement singulier conforme à l’adresse hébraïque. La formulation conserve le rythme proverbial et la mise en garde contre l’idéalisation irréfléchie du passé.
