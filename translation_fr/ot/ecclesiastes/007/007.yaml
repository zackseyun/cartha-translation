id: ECC.7.7
reference: Ecclesiastes 7:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
translation:
  language: fr
  text: Car l’oppression rend fou le sage, et un présent[a] détruit le cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pot-de-vin ». Le mot hébreu désigne généralement un don ou un présent, mais il peut avoir ici le sens négatif d’un cadeau corrupteur.
    reason: lexical_alternative
  - marker: b
    text: Dans la pensée hébraïque, le « cœur » désigne souvent l’être intérieur, notamment le jugement, l’intelligence et la volonté.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de la pensée précédente et restitue naturellement le mouvement argumentatif en français.
- source_word: הָעֹשֶׁק
  choice: l’oppression
  rationale: Désigne une exploitation oppressive, pouvant inclure l’extorsion; « oppression » conserve l’ampleur sociale et morale du terme.
- source_word: יְהוֹלֵל
  choice: rend fou
  rationale: Le verbe exprime ici l’idée de faire perdre la raison ou d’amener à agir de manière insensée; cette tournure française est claire et vigoureuse.
- source_word: חָכָם
  choice: le sage
  rationale: L’adjectif masculin singulier est substantivé. « Le sage » est la formulation proverbiale la plus naturelle en français et conserve la forme grammaticale du texte.
- source_word: וִיאַבֵּד
  choice: détruit
  rationale: La forme causative signifie faire périr, ruiner ou détruire; « détruit » maintient la force du verbe.
- source_word: אֶת לֵב
  choice: le cœur
  rationale: La métaphore hébraïque est conservée; le cœur englobe ici la faculté de juger, de comprendre et de vouloir.
- source_word: מַתָּנָה
  choice: un présent
  rationale: Le sens lexical ordinaire est « don, présent ». Le contexte peut suggérer un cadeau corrupteur, donc un pot-de-vin, mais le terme hébreu lui-même ne l’impose pas; la traduction principale préserve cette ambiguïté et la note signale le sens contextuel possible.
