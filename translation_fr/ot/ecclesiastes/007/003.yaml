id: ECC.7.3
reference: Ecclesiastes 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: fr
  text: Le chagrin vaut mieux que le rire[a], car un visage triste[b] rend le cœur meilleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La colère vaut mieux que le rire ». Le mot hébreu peut aussi signifier « colère » ou « irritation » ; ici, le contexte évoque surtout le chagrin et son effet bénéfique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car par la mauvaise apparence du visage, le cœur devient meilleur ». Cette expression hébraïque évoque un visage triste, sombre ou affligé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: vaut mieux
  rationale: Avec la préposition comparative מִן (« que »), טוֹב exprime ici une comparaison. « Vaut mieux » est naturel en français et conserve cette valeur.
- source_word: כַּעַס
  choice: le chagrin
  rationale: Le mot peut désigner la colère, l’irritation ou le chagrin. Dans ce contexte, où il est opposé au rire et associé à un visage triste qui exerce un effet bénéfique sur le cœur, « chagrin » rend le sens contextuel sans effacer les autres possibilités, signalées en note.
- source_word: מִשְּׂחֹק
  choice: que le rire
  rationale: שְׂחוֹק désigne le rire ou la gaieté. « Le rire » est ici l’équivalent français le plus direct et naturel.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison qui fonde l’affirmation précédente. « Car » en conserve la force explicative et concise.
- source_word: בְרֹעַ פָּנִים
  choice: un visage triste
  rationale: L’expression signifie littéralement « par la mauvaise apparence du visage » et désigne idiomatiquement un visage triste, sombre ou affligé. La formulation choisie garde l’image concrète tout en restant claire.
- source_word: יִיטַב
  choice: rend … meilleur
  rationale: La forme de יטב exprime le fait de devenir bon ou meilleur. La construction française causative rend l’effet bénéfique exercé sur le cœur sans le réduire à la seule joie.
- source_word: לֵב
  choice: le cœur
  rationale: Dans la littérature de sagesse, לֵב désigne la personne intérieure, notamment la pensée, la volonté et les dispositions. « Le cœur » conserve cette image biblique largement compréhensible.
theological_decisions:
- issue: Nature de l’affect exprimé par כַּעַס
  choice: « chagrin » dans le texte, avec l’ambiguïté lexicale indiquée en note
  alternative: « colère » ou « irritation »
  rationale: Le contexte met l’accent sur l’effet formateur d’une expérience pénible et d’un visage affligé plutôt que sur la colère en elle-même. La note préserve néanmoins l’étendue sémantique réelle du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve le contraste saisissant entre le chagrin et le rire ainsi que l’image concrète du visage et du cœur, sans expliciter davantage le mécanisme moral ou spirituel.
