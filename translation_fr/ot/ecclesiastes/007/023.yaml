    issue: Ajout aspectuel dans « elle est restée loin de moi »
    rationale: Le verbe « rester » introduit l’idée que la sagesse a continué d’être loin, alors que l’hébreu emploie l’adjectif רְחוֹקָה (« lointaine ») avec un simple constat au passé. « Elle était loin de moi » restitue ce sens sans ajout.
