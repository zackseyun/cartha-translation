  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
translation:
  language: fr
  text: 'Tout cela, je l’ai mis à l’épreuve par la sagesse[a]. J’ai dit : « Je deviendrai sage[b] », mais elle était loin de moi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec sagesse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Je serai sage » ou « J’acquerrai la sagesse ».
    reason: lexical_alternative
  - marker: c
    text: Ou « elle était hors de ma portée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹה
  choice: Tout cela
  rationale: Le démonstratif singulier après כָּל renvoie naturellement à l’ensemble des réflexions précédentes considéré comme un tout.
- source_word: נִסִּיתִי
  choice: je l’ai mis à l’épreuve
  rationale: Le piel de נסה exprime ici une démarche d’examen ou de vérification; cette tournure conserve la nuance d’investigation.
- source_word: בַחָכְמָה
  choice: par la sagesse
  rationale: La préposition ב indique vraisemblablement le moyen employé; « par la sagesse » reste proche de l’hébreu, tandis que « avec sagesse » demeure possible.
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: La traduction garde le sens ordinaire du verbe אמר, qui introduit ici une résolution intérieure.
- source_word: אֶחְכָּמָה
  choice: Je deviendrai sage
  rationale: La forme exprime une volonté ou une aspiration à atteindre la sagesse, et non simplement la description d’un état présent.
- source_word: וְהִיא
  choice: mais elle
  rationale: Le pronom féminin reprend « la sagesse »; la conjonction ו reçoit ici une valeur adversative imposée par l’échec de la résolution.
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: elle est restée loin de moi
  rationale: La formulation rend directement l’idée de distance tout en faisant sentir que la sagesse n’a pas été atteinte.
