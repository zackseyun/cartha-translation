    issue: Note c formulée comme une explication univoque
    rationale: « C’est-à-dire que ... demeurait » renforce elle aussi une durée non exprimée. Une variante de traduction, « hors de ma portée », conserve mieux la valeur contextuelle sans l’imposer au texte principal.
