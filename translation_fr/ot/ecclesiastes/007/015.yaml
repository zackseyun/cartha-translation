source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: fr
  text: 'J’ai tout vu durant les jours de ma vie fugace[a] : il y a un juste qui périt dans sa justice[b], et il y a un méchant qui prolonge ses jours dans sa méchanceté[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « aux jours de mon hével ». Le mot hébreu הֶבֶל, terme clé de l’Ecclésiaste, peut évoquer un souffle ou une vapeur, et suggère ce qui est passager, insaisissable ou frustrant. Autres traductions possibles : « durant les jours de mon souffle » ou « de ma vaine existence ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi comprendre : « qui périt malgré sa justice » ou « à cause de sa justice ». L’hébreu laisse le rapport précis ouvert.'
    reason: alternative_reading
  - marker: c
    text: 'On pourrait aussi comprendre : « qui prolonge ses jours malgré sa méchanceté » ou « à cause de sa méchanceté ». Littéralement, le verbe signifie « allonger » ou « prolonger ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל רָאִיתִי
  choice: J’ai tout vu
  rationale: Cette formulation française naturelle conserve la portée globale de l’expression hébraïque et le ton rétrospectif de l’observation.
- source_word: בִּימֵי הֶבְלִי
  choice: durant les jours de ma vie fugace
  rationale: Dans ce contexte, הֶבֶל qualifie l’existence du locuteur comme passagère, insaisissable et frustrante. « Vie fugace » communique ce sens en français actuel sans suggérer l’orgueil moral que peut évoquer « vanité ».
- source_word: יֵשׁ ... וְיֵשׁ
  choice: il y a… et il y a
  rationale: La répétition reproduit la structure équilibrée des deux cas observés et convient au style sentencieux du passage.
- source_word: צַדִּיק
  choice: un juste
  rationale: L’adjectif masculin singulier substantivé désigne ici un individu représentatif. « Un juste » est idiomatique et digne en français biblique moderne.
- source_word: אֹבֵד
  choice: qui périt
  rationale: « Périr » garde l’étendue de sens de אבד, qui peut évoquer la mort ou la ruine, sans limiter indûment le propos.
- source_word: בְּצִדְקוֹ
  choice: dans sa justice
  rationale: La traduction relativement littérale par « dans » maintient l’ambiguïté de la préposition ב entre circonstance, concession et cause.
- source_word: רָשָׁע
  choice: un méchant
  rationale: Le masculin singulier substantivé présente, en parallèle avec « un juste », un cas individuel représentatif.
- source_word: מַאֲרִיךְ
  choice: qui prolonge ses jours
  rationale: Le hiphil de ארך exprime l’allongement. « Prolonger ses jours » est une tournure française intelligible qui rend explicite l’idée de longévité sans transformer la construction en simple état.
- source_word: בְּרָעָתוֹ
  choice: dans sa méchanceté
  rationale: « Méchanceté » reprend naturellement en français la qualité du « méchant » et « dans » préserve le parallélisme ainsi que la souplesse sémantique de ב.
theological_decisions:
- issue: Sens de הֶבְלִי dans l’Ecclésiaste
  choice: « ma vie fugace », compris comme l’existence passagère et insaisissable du locuteur
  alternative: « ma vanité », « mon souffle » ou « ma vie dérisoire »
  rationale: Le verset ne parle pas d’orgueil personnel. Il reprend le thème de הֶבֶל, image de ce qui est aussi éphémère et difficile à saisir qu’une vapeur. La note conserve les autres nuances du terme clé.
- issue: Valeur de ב dans בְּצִדְקוֹ et בְּרָעָתוֹ
  choice: « dans sa justice » et « dans sa méchanceté », sans préciser le rapport logique
  alternative: « malgré sa justice / malgré sa méchanceté » ou « à cause de sa justice / à cause de sa méchanceté »
  rationale: La préposition hébraïque permet plusieurs rapports, notamment la circonstance, la concession ou la cause. Le texte principal conserve cette tension au lieu d’imposer une explication théologique.
translation_notes:
  register: Français international actuel, naturel et digne. La syntaxe parallèle « il y a… et il y a » garde le relief aphoristique de l’hébreu. « Vie fugace » évite le contresens moderne possible de « ma vanité », tandis que la note signale le terme thématique hébreu. Les deux occurrences de « dans » préservent volontairement l’ambiguïté du texte source.
