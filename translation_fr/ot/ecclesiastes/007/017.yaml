source:
  edition: WLC
  text: אַל תִּרְשַׁ֥ע הַרְבֵּ֖ה וְ/אַל תְּהִ֣י סָכָ֑ל לָ֥/מָּה תָמ֖וּת בְּ/לֹ֥א עִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
translation:
  language: fr
  text: Ne sois pas excessivement méchant[a] et ne sois pas insensé. Pourquoi mourrais-tu avant ton heure[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trop méchant ». L’hébreu comporte un terme de degré, ce qui crée une tension délibérée avec le contexte sans approuver pour autant une quelconque mesure de méchanceté.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pas en ton temps ». C’est-à-dire avant le moment normal ou attendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע
  choice: sois méchant
  rationale: Le qal de רשע désigne ici la méchanceté comme conduite ou disposition morale. « Sois méchant » conserve directement cette catégorie morale en français naturel.
- source_word: הַרְבֵּה
  choice: excessivement
  rationale: Cet adverbe de degré modifie l'interdiction. « Excessivement » préserve la formulation provocante de l'hébreu sans la transformer en approbation explicite d'une méchanceté modérée.
- source_word: תְּהִי סָכָל
  choice: ne sois pas insensé
  rationale: La construction היה + nom se rend naturellement par « être insensé ». Ce choix garde la portée morale et sapientielle de סָכָל dans un registre digne et courant.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Introduit une question rhétorique à valeur d'avertissement.
- source_word: תָמוּת
  choice: mourrais-tu
  rationale: Le conditionnel dans la question « Pourquoi mourrais-tu… ? » exprime naturellement en français la force rhétorique de l'imparfait hébreu.
- source_word: בְּלֹא עִתֶּךָ
  choice: avant ton heure
  rationale: Expression française idiomatique qui rend littéralement l'idée de mourir « alors que ce n'est pas ton temps », c'est-à-dire prématurément, sans préciser que ce temps serait nécessairement fixé ou décrété.
theological_decisions:
- issue: La formulation semble-t-elle tolérer une certaine mesure de méchanceté ?
  choice: Conserver le terme de degré « excessivement » et la tension rhétorique du texte.
  alternative: Ne sois pas méchant du tout.
  rationale: L'hébreu dit bien de ne pas être méchant « beaucoup/excessivement », en parallèle avec l'avertissement du verset précédent. Supprimer le degré résoudrait une tension que le texte maintient; le conserver ne constitue pas pour autant une approbation morale de la méchanceté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l'adresse individuelle au masculin singulier de l'hébreu. « Insensé » appartient au vocabulaire sapientiel courant, tandis que « avant ton heure » rend idiomatiquement l'expression hébraïque sans ajouter l'idée interprétative d'un moment divinement fixé.
