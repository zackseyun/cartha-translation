  text: What has been is far off and very deep—who can find it out?[a]
translation:
  language: fr
  text: 'Ce qui a été est lointain et très profond : qui peut le découvrir ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « profond, profond »; la répétition renforce le sens : « très profond » ou « extrêmement profond ».'
