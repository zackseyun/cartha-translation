lexical_decisions:
- source_word: רָחוֹק
  choice: lointain
  rationale: Adjectif attribut exprimant l’éloignement ou l’inaccessibilité; « lointain » conserve la métaphore tout en restant naturel en français.
- source_word: מַה שֶּׁהָיָה
  choice: ce qui a été
  rationale: La construction relative avec היה à l’accompli désigne naturellement ce qui a été ou ce qui est advenu; la formulation préserve cette nuance temporelle sans l’expliciter davantage.
- source_word: וְעָמֹק עָמֹק
  choice: et très profond
  rationale: La répétition de עָמֹק a une valeur intensive. « Très profond » en restitue naturellement la force; la répétition hébraïque est signalée en note.
- source_word: מִי יִמְצָאֶנּוּ
  choice: qui peut le découvrir ?
  rationale: מצא signifie trouver ou découvrir. Ici, la question rhétorique porte sur l’accès intellectuel à la réalité évoquée; « peut » en rend la portée, et « le » reprend « ce qui a été ».
