base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
translation:
  language: fr
  text: Le cœur des sages est dans la maison du deuil, mais le cœur des insensés dans la maison de la joie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des réjouissances ». Le mot hébreu peut désigner la joie au sens large, mais il évoque probablement ici une ambiance festive, par contraste avec le deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » conserve l’image hébraïque et désigne ici l’orientation intérieure, l’attention et les préoccupations de la personne, non les seules émotions.
- source_word: חֲכָמִים
  choice: les sages
  rationale: L’adjectif pluriel est substantivé. « Les sages » garde la concision proverbiale sans introduire de restriction masculine.
- source_word: בֵּית
  choice: maison
  rationale: « Maison » rend directement le terme hébreu et préserve le parallélisme imagé entre la maison du deuil et celle de la joie.
- source_word: אֵבֶל
  choice: deuil
  rationale: Le mot désigne le deuil, notamment lié à la mort et aux lamentations. Cette traduction correspond au contexte immédiat d’Ecclésiaste 7.
- source_word: וְ
  choice: mais
  rationale: La conjonction peut se traduire littéralement par « et », mais elle relie ici les deux membres antithétiques du dicton; « mais » exprime naturellement ce contraste en français.
- source_word: כְּסִילִים
  choice: les insensés
  rationale: « Insensés » exprime la catégorie morale et intellectuelle propre à la littérature sapientiale, sans suggérer seulement un manque d’intelligence.
- source_word: שִׂמְחָה
  choice: joie
  rationale: Le terme peut désigner la joie ou la réjouissance, parfois festive. « Joie » est naturel en français moderne; la note précise la nuance contextuelle possible.
theological_decisions: []
