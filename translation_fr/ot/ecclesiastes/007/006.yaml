    issue: Ajout de « n’est que »
    rationale: La tournure intensifie l’assertion au-delà de l’hébreu, qui dit littéralement et sobrement que « cela aussi est hével ». Une prédication directe préserve mieux l’image et son ambiguïté.
  - severity: low
    issue: « Inconsistant » dans la note
    rationale: Le mot français est sémantiquement ambigu et ne désigne pas naturellement le caractère insubstantiel d’une vapeur ; « sans consistance » est plus exact.
