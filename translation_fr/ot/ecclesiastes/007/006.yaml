base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: fr
  text: De même que le crépitement des épines sous la marmite[a], de même le rire de l’insensé ; cela aussi est vapeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme le bruit des épines sous la marmite ». Le contexte évoque leur crépitement lorsqu’elles brûlent.'
    reason: lexical_alternative
  - marker: b
    text: Hébreu hével, souvent traduit par « vanité », « futilité » ou « souffle ». « Vapeur » conserve ici l’image de ce qui est fugitif et sans consistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication imagée qui prolonge le contexte précédent, sans préciser excessivement le lien causal.
- source_word: כְקוֹל הַסִּירִים
  choice: comme le crépitement des épines
  rationale: קוֹל signifie littéralement « voix » ou « bruit » ; « crépitement » exprime naturellement le bruit aigu des épines qui brûlent, tandis que la note conserve le sens littéral.
- source_word: תַּחַת הַסִּיר
  choice: sous la marmite
  rationale: Le nom désigne un récipient de cuisson. « Marmite » rend concrètement l’image en français courant, et l’article défini respecte la forme hébraïque tout en restant naturel dans cette comparaison proverbiale.
- source_word: כֵּן שְׂחֹק הַכְּסִיל
  choice: ainsi est le rire de l’insensé
  rationale: La formulation maintient le parallélisme sonore de la comparaison et rend כְּסִיל par le terme traditionnel de la littérature sapientielle, qui désigne une déficience autant morale qu’intellectuelle.
- source_word: וְגַם זֶה הָבֶל
  choice: cela aussi n’est que vapeur
  rationale: '« Vapeur » conserve l’image concrète de הֶבֶל : quelque chose de fugitif, inconsistant et difficile à saisir. La tournure française exprime l’évaluation sans la réduire au seul sens de « vanité ».'
theological_decisions:
- issue: Portée de הָבֶל
  choice: vapeur
  alternative: vanité ; absurdité ; futilité ; souffle
  rationale: Le mot clé de Qohélet garde une polysémie délibérée entre caractère fugitif, inconsistance et futilité. « Vapeur » préserve l’image source sans trancher en faveur d’une seule interprétation abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme comparatif et l’image sonore de l’hébreu sont conservés ; « l’insensé » maintient le registre sapientiel biblique sans recourir à une formulation familière ou insultante.
