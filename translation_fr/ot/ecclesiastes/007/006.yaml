- from: Car, comme le crépitement des épines sous la marmite[a], ainsi est le rire de l’insensé ; cela aussi n’est que vapeur[b].
  to: De même que le crépitement des épines sous la marmite[a], de même le rire de l’insensé ; cela aussi est vapeur[b].
  rationale: La révision élimine l’intensification non marquée de « n’est que » et emploie une construction comparative française plus naturelle, sans modifier le sens ni résoudre la polysémie de hével. La note est ajustée pour une formulation française précise.
