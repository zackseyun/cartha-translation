source:
  edition: WLC
  text: גַּ֤ם לְ/כָל הַ/דְּבָרִים֙ אֲשֶׁ֣ר יְדַבֵּ֔רוּ אַל תִּתֵּ֖ן לִבֶּ֑/ךָ אֲשֶׁ֥ר לֹֽא תִשְׁמַ֥ע אֶֽת עַבְדְּ/ךָ֖ מְקַלְלֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/021.yaml
  text: Also[a], do not give your heart to every word that is spoken[b], lest you hear your servant cursing you.
translation:
  language: fr
  text: Ne prends pas non plus à cœur tout ce qui se dit, de peur d’entendre ton serviteur te maudire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton esclave t’injurier ». Le mot hébreu traduit par « serviteur » peut aussi désigner un esclave, et le verbe traduit par « maudire » peut exprimer l’injure ou le mépris.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: non plus
  rationale: Avec la négation, « non plus » rend naturellement la valeur additive de גַּם et relie ce conseil au contexte précédent.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: tout ce qui se dit
  rationale: דְּבָרִים désigne ici des paroles, comme le confirme « entendre ». La tournure impersonnelle conserve le sujet humain indéfini du verbe hébreu au pluriel.
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: ne prends pas à cœur
  rationale: Cette expression française naturelle communique l’idée de diriger son attention ou sa préoccupation intérieure vers quelque chose, tout en conservant l’image du cœur.
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: de peur d’entendre
  rationale: Dans ce contexte, la proposition indique la conséquence indésirable que l’interdiction vise à éviter.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. « Serviteur » convient au contexte de maisonnée sans déterminer plus précisément le statut juridique que ne le permet le verset.
- source_word: מְקַלְלֶךָ
  choice: te maudire
  rationale: Le participe de קלל exprime ici une parole hostile pouvant signifier maudire ou injurier; « maudire » en donne le sens direct sans l’atténuer.
theological_decisions: []
