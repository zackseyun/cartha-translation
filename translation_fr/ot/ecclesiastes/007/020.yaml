  text: כִּ֣י אָדָ֔ם אֵ֥ין צַדִּ֖יק בָּ/אָ֑רֶץ אֲשֶׁ֥ר יַעֲשֶׂה טּ֖וֹב וְ/לֹ֥א יֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: fr
  text: Car il n’y a sur terre aucun être humain juste qui fasse le bien et ne pèche pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison ou l’explication de l’affirmation précédente; « Car » conserve clairement ce lien logique.
- source_word: אָדָם
  choice: être humain
  rationale: Le nom singulier est employé de manière générique et représentative. « Être humain » exprime naturellement en français moderne la portée universelle de l’énoncé sans le restreindre aux hommes de sexe masculin.
- source_word: אֵין צַדִּיק
  choice: il n’y a … aucun … juste
  rationale: Cette tournure rend l’expression existentielle אֵין et maintient « juste » comme adjectif substantivé en lien avec צַדִּיק.
- source_word: בָּאָרֶץ
  choice: sur terre
  rationale: Dans ce contexte, l’expression désigne le monde humain en général plutôt qu’un territoire particulier; « sur terre » est idiomatique et concis.
- source_word: אֲשֶׁר יַעֲשֶׂה טּוֹב
  choice: qui fasse le bien
  rationale: Le subjonctif convient naturellement en français après une proposition existentielle négative et rend avec concision l’action moralement bonne.
- source_word: וְלֹא יֶחֱטָא
  choice: sans jamais pécher
  rationale: Cette formulation idiomatique exprime la coordination hébraïque dans la portée de la négation existentielle. « Jamais » rend explicite la valeur générale de l’énoncé sans prétendre préciser davantage l’aspect verbal.
theological_decisions:
- issue: Portée générique du singulier אָדָם
  choice: être humain
  alternative: homme
  rationale: Le singulier hébreu représente ici tout membre de l’humanité. En français contemporain, « être humain » préserve à la fois le singulier proverbial et la portée universelle, tandis que « homme » pourrait être compris comme désignant seulement le sexe masculin.
- issue: Caractère absolu de l’absence de péché
  choice: sans jamais pécher
  alternative: et qui ne pèche pas
  rationale: L’énoncé nie l’existence d’un juste dont la pratique du bien serait exempte de péché. « Sans jamais pécher » communique cette portée générale sans transformer le verset en affirmation doctrinale plus détaillée sur la fréquence ou la nature du péché.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe reste proche de l’hébreu tout en évitant une tournure lourde; le registre est digne, clair et accessible.
