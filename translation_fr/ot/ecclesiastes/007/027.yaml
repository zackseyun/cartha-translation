  text: רְאֵה֙ זֶ֣ה מָצָ֔אתִי אָמְרָ֖ה קֹהֶ֑לֶת אַחַ֥ת לְ/אַחַ֖ת לִ/מְצֹ֥א חֶשְׁבּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: fr
  text: 'Regarde, voici ce que j’ai trouvé, dit Qohélet : en ajoutant une chose à une autre pour trouver le total[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour parvenir à une conclusion ». L’hébreu emploie un mot qui peut désigner un compte, un calcul ou son résultat.
    reason: Préserver l’étendue sémantique de חֶשְׁבּוֹן et l’ambiguïté de l’expression elliptique dans ce contexte.
lexical_decisions:
- source_word: קֹהֶלֶת
  choice: Qohélet
  rationale: Translittération française usuelle du titre hébreu, qui conserve son caractère distinctif sans lui imposer ici une interprétation comme « le Prédicateur » ou « l’Ecclésiaste ».
- source_word: אַחַת לְאַחַת
  choice: en ajoutant une chose à une autre
  rationale: L’expression elliptique signifie littéralement « une à une » ou « une chose à une autre »; dans ce contexte de recherche et de calcul, cette formulation française exprime naturellement la mise en relation progressive des éléments.
- source_word: חֶשְׁבּוֹן
  choice: le total
  rationale: Le nom appartient au champ du calcul, du compte et du résultat. « Le total » convient à l’image consistant à ajouter un élément à un autre, tout en laissant une note signaler l’autre compréhension possible, « conclusion ».
theological_decisions:
- issue: Nature du résultat recherché par Qohélet
  choice: Conserver l’image d’un calcul aboutissant à « un total »
  alternative: Traduire par « explication », « raison » ou « conclusion »
  rationale: Le terme hébreu évoque d’abord un calcul ou un compte. La traduction ne transforme donc pas explicitement la recherche en explication philosophique, tout en reconnaissant en note que le mot peut désigner le résultat intellectuel de l’enquête.
translation_notes:
  register: Français moderne, sobre et digne. « Regarde, voici » maintient l’insistance de רְאֵה זֶה; les deux-points rendent lisible la méthode décrite après la déclaration de Qohélet.
