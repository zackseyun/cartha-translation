source:
  edition: WLC
  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: fr
  text: Le vent[a] va vers le sud et tourne vers le nord ; il tourne, tourne encore, le vent poursuit sa course, puis revient sur ses circuits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu רוּחַ peut aussi signifier « esprit » ou « souffle » ; ici, le contexte des cycles naturels favorise « vent ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses rondes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: se dirige / poursuivant sa course
  rationale: Le participe de הלך exprime un mouvement continu. « Se dirige » rend naturellement l’orientation initiale, tandis que « poursuivant sa course » restitue la seconde occurrence sans suggérer que le vent marche.
- source_word: דָּרוֹם
  choice: sud
  rationale: Le nom désigne la direction du sud ; avec אֶל, il indique un mouvement vers le sud.
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: puis tourne / il tourne et tourne encore
  rationale: La racine סבב évoque l’action de tourner ou de faire le tour. La reprise française conserve l’insistance rythmique et l’idée d’un mouvement continuel.
- source_word: צָפוֹן
  choice: nord
  rationale: Le terme désigne la direction du nord ; « vers le nord » rend directement la construction avec אֶל.
- source_word: הָרוּחַ
  choice: le vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Le contexte immédiat, consacré aux cycles observables de la nature, favorise ici le sens météorologique.
- source_word: וְעַל
  choice: et … sur
  rationale: La préposition עַל peut signifier « sur » ou « le long de ». Avec les parcours circulaires du vent, « sur » reste proche de l’hébreu tout en étant idiomatique.
- source_word: סְבִיבֹתָיו
  choice: ses circuits
  rationale: Ce pluriel, apparenté au champ lexical de סבב, désigne les parcours ou rondes du vent. « Circuits » met en valeur le mouvement cyclique du passage.
- source_word: שָׁב
  choice: revient
  rationale: Le verbe שוב signifie revenir ou retourner. « Revient » exprime avec concision la répétition cyclique.
theological_decisions:
- issue: Sens de רוּחַ dans ce verset
  choice: le vent
  alternative: l’esprit ou le souffle
  rationale: Bien que רוּחַ puisse avoir ailleurs une portée spirituelle, Ecclésiaste 1.5-7 décrit les cycles du soleil, du vent et des cours d’eau. Le référent météorologique convient donc le mieux, sans effacer l’éventail lexical du mot, signalé en note.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition « tourne et tourne encore » conserve l’effet insistant de l’hébreu, tandis que l’antéposition de « le vent » évite en français une ambiguïté syntaxique artificielle.
