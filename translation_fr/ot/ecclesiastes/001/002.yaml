  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: fr
  text: Souffle des souffles[a], dit Qohéleth[b] ; souffle des souffles, tout n’est que souffle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu הֶבֶל (hèvel) signifie littéralement « souffle » ou « vapeur ». Dans l’Ecclésiaste, ce mot évoque à la fois ce qui passe rapidement, ce qui échappe à toute prise et le décalage entre ce qu’on attend et ce qui arrive. Aucun mot français ne réunit parfaitement ces nuances. La traduction conserve donc l’image concrète du « souffle ». Les rendus traditionnels tels que « vanité », « futilité » ou « absurdité » n’en expriment chacun qu’un aspect. La formule « souffle des souffles » est un superlatif hébreu, comparable à « cantique des cantiques » ou « saint des saints ».
    reason: lexical_choice
  - marker: b
    text: Qohéleth est le titre ou nom hébreu traditionnellement traduit par « le Maître », « l’Enseignant » ou « le Prédicateur ». Ces traductions étant interprétatives et plus étroites, le terme hébreu est ici transcrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: souffle
  rationale: Le nom hébreu désigne concrètement un souffle ou une vapeur. Dans l’Ecclésiaste, l’image évoque à la fois ce qui passe vite, ce qu’on ne peut saisir et le décalage déroutant entre l’attente et la réalité. « Souffle » conserve cette image et cette pluralité de sens, contrairement à des termes abstraits comme « vanité », « absurdité » ou « futilité ».
- source_word: הֲבֵל הֲבָלִים
  choice: souffle des souffles
  rationale: La construction hébraïque exprime un superlatif absolu, sur le modèle de « cantique des cantiques ». Cette traduction en préserve à la fois la forme et l’image concrète.
- source_word: אָמַר
  choice: dit
  rationale: Dans cette formule littéraire, le parfait hébreu introduit une déclaration qui fait autorité. Le présent français « dit » garde la formule vive et naturelle.
- source_word: קֹהֶלֶת
  choice: Qohéleth
  rationale: La translittération conserve l’ouverture du titre ou nom hébreu, que « le Maître », « l’Enseignant » ou « le Prédicateur » interpréteraient chacun de manière plus étroite.
- source_word: הַכֹּל
  choice: tout
  rationale: « Tout » rend avec naturel la portée globale et totalisante de l’expression hébraïque.
- source_word: הָבֶל
  choice: n’est que souffle
  rationale: La tournure française « n’est que » fait entendre la valeur de réduction et de désillusion du prédicat sans remplacer l’image hébraïque par une abstraction.
theological_decisions:
- issue: Rendu du motif directeur הֶבֶל
  choice: Conserver l’image concrète du souffle, avec « souffle des souffles » puis « tout n’est que souffle ».
  alternative: Vanité, futilité, absurdité, non-sens, vapeur.
  rationale: Le mot hébreu laisse jouer ensemble la brièveté, le caractère insaisissable et le décalage ironique de l’existence. Une traduction abstraite privilégierait un seul de ces aspects et pourrait notamment introduire un nihilisme que le texte n’affirme pas explicitement.
translation_notes:
  register: Français international actuel, sobre et littéraire. La répétition insistante et la construction sémitique sont volontairement conservées. « Tout n’est que souffle » est idiomatique en français et communique la force évaluative du dernier prédicat sans effacer son image.
