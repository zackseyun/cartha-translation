source:
  edition: WLC
  text: מַה יִּתְר֖וֹן לָֽ/אָדָ֑ם בְּ/כָל עֲמָל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/003.yaml
  text: What profit does man have in all his labor at which he toils under the sun?[a]
translation:
  language: fr
  text: Quel avantage l’être humain retire-t-il de tout le travail pénible auquel il se livre sous le soleil ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme ». Le mot hébreu est au singulier et représente ici l’être humain en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Quel
  rationale: Introduit directement la question rhétorique; avec « avantage », « quel » est idiomatique et conserve la concision de l’hébreu.
- source_word: יִתְרוֹן
  choice: avantage
  rationale: Ce terme clé de Qohélet désigne le bénéfice net ou durable qui subsiste. « Avantage » garde cette portée sans limiter l’image au profit financier.
- source_word: לָאָדָם
  choice: l’être humain retire-t-il
  rationale: אָדָם est ici générique et singulier. « L’être humain » exprime naturellement en français sa valeur représentative; « retire-t-il » explicite le rapport de bénéfice impliqué par la construction nominale hébraïque.
- source_word: בְּכָל עֲמָלוֹ
  choice: de tout le travail pénible
  rationale: La préposition introduit ce dont un éventuel avantage serait tiré. « Travail pénible » restitue la nuance de peine portée par עָמָל.
- source_word: שֶׁיַּעֲמֹל
  choice: auquel il se livre
  rationale: Préserve la proposition relative et évite en français une répétition lourde de « travailler », tout en maintenant l’idée d’effort soutenu.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression programmatique de Qohélet, rendue littéralement et naturellement en français.
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: l’être humain
  alternative: l’homme; une personne
  rationale: Le nom hébreu est singulier et représentatif de l’humanité. « L’être humain » conserve le singulier générique tout en évitant qu’un lecteur moderne ne comprenne une restriction aux hommes de sexe masculin.
- issue: Portée de יִתְרוֹן
  choice: avantage
  alternative: profit; gain
  rationale: « Avantage » préserve la question ouverte du livre sur ce qui demeure réellement de l’activité humaine, sans résoudre d’avance cette tension en un sens exclusivement économique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la question rhétorique, le singulier représentatif et l’expression récurrente « sous le soleil ».
