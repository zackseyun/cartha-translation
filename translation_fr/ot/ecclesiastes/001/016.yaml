revisions:
- from: 'Je me suis dit en mon cœur : « Moi, voyez : je suis devenu grand et j’ai accru ma sagesse plus que tous ceux qui ont été avant moi à la tête de Jérusalem ; mon cœur a vu beaucoup de sagesse et de connaissance. »'
  to: 'Je me suis dit en mon cœur : « Moi, voici, j’ai grandi et j’ai accru ma sagesse plus que tous ceux qui m’ont précédé à Jérusalem ; mon cœur a vu beaucoup de sagesse et de connaissance. »'
  rationale: La révision remplace l’apostrophe française artificielle par une interjection déictique et retire l’explicitation de gouvernement contenue dans « à la tête de Jérusalem ». Elle maintient l’emphase du pronom, les deux verbes coordonnés, la comparaison avec les prédécesseurs et la métaphore du cœur voyant.
