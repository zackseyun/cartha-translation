base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: fr
  text: 'Je me suis dit en mon cœur : « Moi, voici, j’ai grandi et j’ai accru ma sagesse plus que tous ceux qui m’ont précédé à Jérusalem ; mon cœur a vu beaucoup de sagesse et de connaissance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם לִבִּי
  choice: Je me suis dit en mon cœur
  rationale: Formulation française naturelle qui conserve l’image biblique du cœur comme siège de la réflexion, tout en rendant l’idée hébraïque de se parler intérieurement.
- source_word: אֲנִי הִנֵּה
  choice: Moi, voyez
  rationale: Conserve à la fois l’insistance du pronom אֲנִי et l’interjection הִנֵּה, sans les fondre en une simple affirmation.
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  choice: je suis devenu grand et j’ai accru ma sagesse
  rationale: 'Reproduit les deux affirmations coordonnées : l’élévation du locuteur et l’accroissement de sa sagesse.'
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלִָם
  choice: plus que tous ceux qui ont été avant moi à la tête de Jérusalem
  rationale: « Plus que » exprime la comparaison portée par עַל, tandis que « à la tête de Jérusalem » rend de façon idiomatique l’autorité suggérée par le second עַל.
- source_word: וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת
  choice: mon cœur a vu beaucoup de sagesse et de connaissance
  rationale: Maintient la métaphore concrète de la vision et le parallélisme entre sagesse et connaissance, plutôt que d’interpréter explicitement « voir » comme « faire l’expérience de ».
theological_decisions:
- issue: Portée de la comparaison avec les prédécesseurs à Jérusalem
  choice: tous ceux qui ont été avant moi à la tête de Jérusalem
  alternative: tous ceux qui m’ont précédé à Jérusalem
  rationale: Le choix retenu conserve l’idée d’autorité présente dans עַל יְרוּשָׁלִָם sans préciser l’identité ni le nombre des prédécesseurs, évitant ainsi d’harmoniser la déclaration avec une reconstruction historique particulière.
translation_notes:
  register: 'Français moderne, digne et accessible. La légère étrangeté de « Moi, voyez » et de « mon cœur a vu » est volontaire : elle préserve l’emphase et les images du texte hébreu sans les aplanir.'
