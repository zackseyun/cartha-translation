translation_notes:
  register: Français international moderne, sobre et poétique. Les parallélismes entre « l’œil » et « l’oreille », ainsi que la distinction entre « se rassasier » et « se remplir », sont conservés. Les notes signalent les ambiguïtés réelles de דְּבָרִים et de la proposition sur l’incapacité de parler.
