  text: כָּל הַ/דְּבָרִ֣ים יְגֵעִ֔ים לֹא יוּכַ֥ל אִ֖ישׁ לְ/דַבֵּ֑ר לֹא תִשְׂבַּ֥ע עַ֨יִן֙ לִ/רְא֔וֹת וְ/לֹא תִמָּלֵ֥א אֹ֖זֶן מִ/שְּׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: fr
  text: Toutes choses sont pénibles[a] ; personne ne peut en parler[b]. L’œil ne se rassasie pas de voir, et l’oreille ne se remplit pas d’entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toutes les paroles sont fatigantes ». Le mot hébreu peut désigner des paroles, des réalités ou des choses.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un homme ne peut parler ». La proposition peut signifier que nul ne peut exprimer adéquatement ces réalités, ou que le sujet est trop pénible pour qu’on en parle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: Toutes choses
  rationale: דְּבָרִים peut désigner des paroles, des réalités ou des choses. Ici, « toutes choses » conserve la portée générale et la structure de l’hébreu, tandis que la note maintient l’alternative lexicale.
- source_word: יְגֵעִים
  choice: sont pénibles
  rationale: L’adjectif exprime ce qui est fatigant, épuisant ou accablant. « Pénibles » est naturel en français et permet de conserver l’ambiguïté entre la lassitude inhérente aux réalités évoquées et celle qu’elles produisent.
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: personne ne peut les exprimer pleinement
  rationale: אִישׁ a ici une portée générique. Le verbe « exprimer » rend l’idée de mettre en paroles les réalités évoquées ; « pleinement » explicite avec prudence l’incapacité suggérée par le contexte, sans présenter cette interprétation comme l’unique lecture possible, d’où la note.
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: L’œil ne se rassasie pas de voir
  rationale: « Se rassasier » reflète directement שׂבע et convient à l’image d’un désir visuel jamais comblé. Le singulier générique « l’œil » reproduit la formulation hébraïque.
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: et l’oreille ne se remplit pas d’entendre
  rationale: La traduction conserve מלא, « être rempli », et maintient ainsi la variation lexicale par rapport à « se rassasier ». La tournure légèrement poétique reste compréhensible et proche de l’hébreu.
