id: ECC.1.12
reference: Ecclesiastes 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: fr
  text: Moi, Qohélet[a], j’ai été roi sur Israël à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qohélet peut aussi être traduit par « le Maître » ou « le Prédicateur ».
    reason: Alternative lexicale pour un terme hébreu dont le sens précis est débattu.
lexical_decisions:
- source_word: אֲנִי
  choice: Moi
  rationale: Le pronom détaché rend l’auto-identification emphatique qui ouvre la phrase hébraïque.
- source_word: קֹהֶלֶת
  choice: Qohélet
  rationale: La translittération conserve cette désignation distinctive, dont le sens précis demeure débattu, sans la réduire à un titre interprétatif unique.
- source_word: הָיִיתִי
  choice: j’ai été
  rationale: Le qatal de היה présente rétrospectivement l’exercice de la royauté. Le passé composé est naturel en français moderne tout en laissant ouverte la portée exacte de cette rétrospection.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Attribut sans article après « être », conformément à l’usage français pour une fonction royale.
- source_word: עַל
  choice: sur
  rationale: La préposition exprime ici l’autorité exercée sur Israël; « sur » reflète directement cette relation de gouvernement.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: « À » est la préposition locative française naturelle avec un nom de ville.
theological_decisions:
- issue: Traduire קֹהֶלֶת comme un titre ou conserver une désignation translittérée
  choice: Qohélet
  alternative: le Maître; le Prédicateur; celui qui rassemble l’assemblée
  rationale: Le terme hébreu est sémantiquement discuté et sert de désignation propre au locuteur du livre. La translittération préserve cette ambiguïté sans imposer une compréhension particulière de son rôle.
translation_notes:
  register: Français moderne, sobre et digne. La dislocation « Moi, Qohélet » restitue l’accent initial de l’hébreu; « j’ai été roi » conserve la perspective rétrospective sans rendre la formulation artificielle.
