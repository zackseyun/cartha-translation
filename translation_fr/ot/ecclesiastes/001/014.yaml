  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: fr
  text: 'J’ai vu toutes les œuvres qui se font sous le soleil, et voici : tout est vapeur[a] et poursuite du vent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vanité », « souffle » ou « futilité ». Dans l’Ecclésiaste, le mot hébreu הֶבֶל évoque ce qui est éphémère, insaisissable et source de frustration, plutôt que simplement « dépourvu de sens ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. Elle évoque probablement une poursuite vaine ; plus littéralement, elle pourrait signifier « faire paître le vent » ou « conduire le vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le qatal qal à la première personne du singulier présente ici le constat rétrospectif de Qohélet; le passé composé est naturel en français et garde la portée actuelle de son observation.
- source_word: כָּל הַמַּעֲשִׂים
  choice: toutes les œuvres
  rationale: מַעֲשִׂים englobe les actes, les travaux et les entreprises humaines. « Œuvres » conserve cette ampleur sans limiter le propos aux actes moraux.
- source_word: שֶׁנַּעֲשׂוּ
  choice: qui se font
  rationale: Le niphal exprime ce qui est accompli; le présent à valeur générale convient au bilan des activités humaines sous le soleil.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression récurrente de l’Ecclésiaste désigne la sphère de l’existence humaine terrestre. La traduction littérale est claire et consacrée en français.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: הִנֵּה attire l’attention sur la conclusion tirée de l’observation. « Et voici » en maintient la force rhétorique dans un registre digne.
- source_word: הַכֹּל
  choice: tout
  rationale: Le terme reprend globalement l’ensemble des œuvres observées; « tout » est direct et naturel.
- source_word: הֶבֶל
  choice: vapeur
  rationale: Le mot désigne littéralement un souffle ou une vapeur et évoque, dans l’Ecclésiaste, ce qui est fugitif, insaisissable et décevant. « Vapeur » préserve l’image sans réduire le terme à la seule idée d’absence de sens.
- source_word: רְעוּת רוּחַ
  choice: poursuite du vent
  rationale: L’expression difficile semble décrire une entreprise aussi vaine que la tentative de saisir le vent. Cette formulation française conserve l’image et son idée d’effort infructueux.
theological_decisions:
- issue: Portée de הֶבֶל
  choice: vapeur
  alternative: vanité; absurdité; futilité
  rationale: Le choix maintient ensemble la brièveté, l’insaisissabilité et la frustration suggérées par la métaphore hébraïque, sans imposer une conclusion philosophique plus étroite comme « absurdité » ou « absence de sens ».
- issue: Sens de רְעוּת רוּחַ
  choice: poursuite du vent
  alternative: effort pour saisir le vent; pâture du vent
  rationale: L’étymologie et la forme de l’expression permettent une image plus littérale liée au fait de paître ou de conduire. Le texte retient le sens idiomatique probable d’une quête futile tout en signalant l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et littéraire. La syntaxe reste proche de l’hébreu, tandis que « vapeur » rend concrètement la métaphore centrale et que les notes préservent ses autres nuances ainsi que l’incertitude de l’expression finale.
