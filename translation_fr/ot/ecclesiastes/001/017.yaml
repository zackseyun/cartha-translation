base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: fr
  text: Je me suis appliqué à connaître la sagesse, et à connaître la déraison et la folie. J’ai compris que cela aussi est une poursuite du vent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un effort pour saisir le vent » ; traduction traditionnelle : « tourment de l’esprit ».'
    reason: L’expression רַעְיוֹן רוּחַ évoque une entreprise vaine et insaisissable. La note conserve un rendu possible de l’image ainsi que la traduction traditionnelle, moins transparente en français moderne.
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  choice: Je me suis appliqué
  rationale: Cette formulation française naturelle rend l’expression hébraïque qui désigne l’orientation résolue de l’être intérieur et de l’attention vers une recherche.
- source_word: לָדַעַת / וְדַעַת
  choice: à connaître / et à connaître
  rationale: La répétition de « connaître » conserve le parallélisme hébreu et présente la sagesse comme la démence et la folie en tant qu’objets d’investigation.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent courant du terme dans la littérature sapientielle, englobant discernement intellectuel et conduite avisée.
- source_word: הוֹלֵלוֹת
  choice: la démence
  rationale: Le mot évoque l’irrationalité ou un comportement insensé; « démence » le distingue du terme suivant rendu par « folie ».
- source_word: שִׂכְלוּת
  choice: la folie
  rationale: Terme sapientiel opposé à la sagesse; « folie » est clair, concis et adapté au registre du livre.
- source_word: יָדַעְתִּי
  choice: J’ai compris
  rationale: Le parfait exprime ici le résultat acquis par l’enquête; « j’ai compris » est idiomatique en français et garde la dimension cognitive de ידע.
- source_word: שֶׁגַּם זֶה הוּא
  choice: que cela aussi revient à
  rationale: Cette tournure restitue la conclusion et la valeur additive de גַּם dans un français naturel.
- source_word: רַעְיוֹן רוּחַ
  choice: poursuivre le vent
  rationale: L’expression évoque une entreprise futile et insaisissable. Cette traduction conserve l’image concrète du vent tout en restant immédiatement compréhensible.
