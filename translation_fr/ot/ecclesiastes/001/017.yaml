  revision_rationale: La révision évite la connotation clinique de « démence », conserve la distinction entre les deux termes hébreux, et rapproche la dernière proposition de la structure nominale et de la métaphore du texte source. L’ancre de note et son contenu restent cohérents avec l’expression expliquée.
