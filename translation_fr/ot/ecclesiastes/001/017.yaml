revisions:
- from: Je me suis appliqué à connaître la sagesse, et à connaître la démence et la folie. J’ai compris que cela aussi revient à poursuivre le vent[a].
  to: Je me suis appliqué à connaître la sagesse, et à connaître la déraison et la folie. J’ai compris que cela aussi est une poursuite du vent[a].
  rationale: La révision évite la connotation clinique de « démence », conserve la distinction entre les deux termes hébreux, et rapproche la dernière proposition de la structure nominale et de la métaphore du texte source. L’ancre de note et son contenu restent cohérents avec l’expression expliquée.
