base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: fr
  text: Ce qui a été, c’est ce qui sera[a], et ce qui a été fait, c’est ce qui sera fait ; il n’y a rien de nouveau sous le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce qui était, c’est ce qui sera, et ce qui a été fait, c’est ce qui sera fait. »'
    reason: 'Alternative temporelle possible pour מַה שֶּׁהָיָה : l’imparfait français présente simplement le passé, tandis que le passé composé peut souligner son lien avec l’observation présente. Le passif de la seconde proposition est maintenu.'
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Ce qui a été
  rationale: Le passé composé rend naturellement la construction relative et présente le passé comme pertinent pour l’observation générale.
- source_word: הוּא שֶׁיִּהְיֶה
  choice: c’est ce qui sera
  rationale: Cette formulation conserve la structure équative, le parallélisme et la force aphoristique de l’hébreu.
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: et ce qui s’est fait
  rationale: Le tour pronominal français exprime ici naturellement le sens passif ou résultatif du niphal de עשה.
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: c’est ce qui se fera
  rationale: Le futur pronominal maintient le parallélisme passif avec « ce qui s’est fait », sans élargir le sens à « arriver ».
- source_word: וְאֵין כָּל חָדָשׁ
  choice: il n’y a rien de nouveau
  rationale: Cette tournure idiomatique française restitue la négation existentielle et sa portée universelle.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression consacrée et transparente conserve l’idiome majeur de l’Ecclésiaste désignant la sphère de la vie terrestre observable.
theological_decisions:
- issue: Portée de l’affirmation dans la vision du monde de l’Ecclésiaste
  choice: Conserver une observation générale sur les réalités récurrentes de la vie « sous le soleil ».
  alternative: Comprendre le verset comme la négation métaphysique absolue de toute nouveauté, en quelque sens que ce soit.
  rationale: L’expression « sous le soleil » situe l’affirmation dans le domaine observable de l’existence terrestre. La traduction garde sa portée rhétorique sans ajouter une interprétation restrictive ou absolue.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est préservé ; les formes « s’est fait / se fera » gardent la nuance passive ou résultative sans lourdeur.
