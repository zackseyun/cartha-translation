- from: On ne se souvient pas de ceux d’autrefois[a] ; et même de ceux qui viendront plus tard, on ne gardera aucun souvenir parmi ceux qui viendront après eux.
  to: Il n’y a pas de souvenir des premiers[a] ; même ceux qui viendront plus tard ne laisseront aucun souvenir chez ceux qui viendront après eux.
  rationale: La révision clarifie que les personnes à venir ne seront pas retenues dans la mémoire de ceux qui leur succéderont. Elle préserve l’ambiguïté référentielle des pluriels hébreux, le contraste temporel et la répétition de זכרון, tout en employant une syntaxe française plus directe. L’ancre de note est maintenue et la note est reformulée pour exprimer sobrement l’alternative grammaticale.
