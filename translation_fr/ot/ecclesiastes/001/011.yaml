base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: fr
  text: Il n’y a pas de souvenir des premiers[a] ; même ceux qui viendront plus tard ne laisseront aucun souvenir chez ceux qui viendront après eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre analyse des prépositions : « Les premiers n’ont pas de souvenir, et même les derniers, qui seront, n’en auront pas chez ceux qui viendront ensuite. »'
    reason: La préposition ל peut, dans cette formulation, être comprise soit comme introduisant l’objet du souvenir (« souvenir des premiers »), soit comme marquant la personne à qui le souvenir appartient (« les premiers n’ont pas de souvenir »).
lexical_decisions:
- source_word: אֵין זִכְרוֹן
  choice: On ne se souvient pas
  rationale: Cette tournure française naturelle rend la négation existentielle et l’idée de souvenir sans alourdir la phrase par « il n’y a pas de souvenir ».
- source_word: לָרִאשֹׁנִים
  choice: de ceux d’autrefois
  rationale: Le pluriel substantivé désigne largement les êtres ou les générations antérieurs. « Ceux d’autrefois » conserve cette largeur sans préciser indûment « les ancêtres » ou « les générations passées ».
- source_word: וְגַם
  choice: et même
  rationale: La locution marque à la fois la coordination et l’intensification rhétorique.
- source_word: לָאַחֲרֹנִים שֶׁיִּהְיוּ
  choice: de ceux qui viendront plus tard
  rationale: Cette formulation exprime clairement la postériorité et rend idiomatiquement le relatif « qui seront ».
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: on ne gardera aucun souvenir
  rationale: La construction hébraïque peut exprimer l’absence de souvenir concernant ces personnes. Le français impersonnel évite une formulation pesante tout en maintenant le parallélisme.
- source_word: עִם שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: parmi ceux qui viendront après eux
  rationale: « Parmi » rend la relation sociale exprimée par עִם, tandis que « après eux » explicite naturellement la succession temporelle de groupes encore ultérieurs.
