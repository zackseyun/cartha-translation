  yaml_path: translation/ot/ecclesiastes/001/015.yaml
  text: What is crooked cannot be made straight[b][a], and what is lacking cannot be counted.
translation:
  language: fr
  text: Ce qui est tordu ne peut être redressé[a], et ce qui manque ne peut être compté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « remis en ordre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dénombré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעֻוָּת
  choice: ce qui est tordu
  rationale: Le participe passif de עוה désigne ce qui est courbé, tordu ou déformé. Cette formulation conserve la portée générale et proverbiale de l’hébreu.
- source_word: לֹא יוּכַל
  choice: ne peut être
  rationale: La construction exprime l’impossibilité et s’intègre naturellement en français à la tournure passive qui suit.
- source_word: לִתְקֹן
  choice: être redressé
  rationale: Le verbe תקן signifie ici rendre droit ou remettre en ordre. « Redressé » maintient l’image concrète introduite par « tordu » sans élargir excessivement le sens.
- source_word: וְחֶסְרוֹן
  choice: ce qui manque
  rationale: Le nom חֶסְרוֹן exprime un manque ou une insuffisance. « Ce qui manque » forme en français un parallèle naturel avec « ce qui est tordu ».
- source_word: לְהִמָּנוֹת
  choice: être compté
  rationale: À la forme nifal, מנה signifie être compté ou dénombré. « Être compté » est clair et idiomatique, tout en préservant le paradoxe de ce qui est absent et ne peut entrer dans un compte.
