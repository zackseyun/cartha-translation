  text: The words of Qoheleth[a], son of David, king in Jerusalem.
translation:
  language: fr
  text: Paroles de Qohéleth[a], fils de David, roi à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qohéleth est la désignation hébraïque de celui qui parle ; le mot peut évoquer « le Maître », « le Prédicateur » ou une personne liée à l’assemblée.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit de דָּבָר introduit ici le contenu du livre. « Paroles » est direct, naturel et moins interprétatif que « propos » ou « enseignements ».
- source_word: קֹהֶלֶת
  choice: Qohéleth
  rationale: Cette désignation hébraïque singulière a un sens débattu. La translittération française traditionnelle « Qohéleth » préserve cette ambiguïté, explicitée en note.
- source_word: בֶּן דָּוִד
  choice: fils de David
  rationale: Rendu direct de l’expression filiale, qui conserve également sa résonance royale possible.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent français courant et précis de מֶלֶךְ.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition ב est locative. En français moderne, on dit naturellement « roi à Jérusalem » pour indiquer le lieu où il règne ou siège.
theological_decisions:
- issue: Traduire קֹהֶלֶת comme un titre fonctionnel ou conserver sa désignation hébraïque
  choice: Qohéleth dans le texte principal
  alternative: le Maître ; le Prédicateur ; celui qui est lié à l’assemblée
  rationale: Le sens précis du mot et le statut du personnage restent discutés. La translittération évite de trancher indûment et conserve la tension littéraire et théologique de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation nominale concise reproduit le caractère de titre ou de suscription du verset.
