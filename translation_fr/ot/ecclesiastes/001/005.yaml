  yaml_path: translation/ot/ecclesiastes/001/005.yaml
  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
translation:
  language: fr
  text: Le soleil se lève, le soleil se couche, et il se hâte[a] vers sa place ; là, il se lève.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il halète ». Le participe hébreu שׁוֹאֵף peut décrire le fait de haleter ou, plus idiomatiquement ici, de se hâter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַח
  choice: Le soleil se lève
  rationale: Le verbe זרח désigne ici le lever ou l’apparition lumineuse du soleil. Le présent exprime naturellement en français une observation générale et répétée.
- source_word: וּבָא
  choice: le soleil se couche
  rationale: Avec le soleil pour sujet, בוא désigne idiomatiquement son coucher. « Se couche » est l’expression française courante tout en conservant le mouvement opposé au lever.
- source_word: מְקוֹמוֹ
  choice: vers sa place
  rationale: Le nom מָקוֹם signifie simplement « lieu, place » et le suffixe renvoie au soleil. La formulation évite d’expliciter dans le nom lui-même qu’il s’agit du lieu de son lever.
- source_word: שׁוֹאֵף
  choice: il se hâte
  rationale: Le participe peut évoquer le fait de haleter, de tendre avec ardeur ou, idiomatiquement, de se hâter. « Se hâte » donne un français naturel tout en conservant la personnification et l’idée de mouvement empressé; l’image plus concrète est signalée en note.
- source_word: זוֹרֵחַ הוּא שָׁם
  choice: où il se lève de nouveau
  rationale: Le participe זוֹרֵחַ reprend l’action du lever, tandis que הוּא a une valeur de reprise ou d’insistance et שָׁם signifie « là ». « De nouveau » rend explicite la répétition cyclique impliquée par le contexte, sans modifier le sens fondamental.
