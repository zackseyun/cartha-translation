id: ECC.1.18
reference: Ecclesiastes 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֛י בְּ/רֹ֥ב חָכְמָ֖ה רָב כָּ֑עַס וְ/יוֹסִ֥יף דַּ֖עַת יוֹסִ֥יף מַכְאֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/018.yaml
  text: For with much wisdom comes much vexation[b][a], and he who increases knowledge increases pain.
translation:
  language: fr
  text: Car plus il y a de sagesse, plus il y a de contrariété[a] ; celui qui accroît sa connaissance accroît sa souffrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car là où abonde la sagesse, le chagrin abonde » ; le nom hébreu peut désigner la contrariété, l’irritation ou le chagrin.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et celui qui ajoute de la connaissance ajoute de la souffrance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison explicative de l’affirmation précédente et conserve naturellement le lien logique en français.
- source_word: בְּרֹב חָכְמָה רָב כָּעַס
  choice: plus il y a de sagesse, plus il y a de contrariété
  rationale: La tournure corrélative française rend clairement le parallélisme quantitatif entre l’abondance de sagesse et l’abondance de כָּעַס, sans présenter une causalité plus précise que l’hébreu.
- source_word: חָכְמָה
  choice: sagesse
  rationale: Équivalent courant de חָכְמָה dans l’Ecclésiaste.
- source_word: כָּעַס
  choice: contrariété
  rationale: Le terme peut exprimer l’irritation, le dépit ou le chagrin. « Contrariété » convient au contexte réflexif tout en laissant à la note les autres nuances possibles.
- source_word: וְיוֹסִיף דַּעַת
  choice: celui qui accroît sa connaissance
  rationale: Rend l’emploi du participe verbal de façon naturelle et proverbiale, tout en maintenant la distinction entre connaissance et sagesse.
- source_word: יוֹסִיף מַכְאוֹב
  choice: accroît sa souffrance
  rationale: La répétition d’« accroît » reproduit celle du verbe יסף. « Souffrance » garde la portée physique ou morale possible de מַכְאוֹב.
