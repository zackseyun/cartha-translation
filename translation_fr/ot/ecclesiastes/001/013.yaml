base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: fr
  text: J’ai appliqué mon cœur à rechercher et à explorer avec sagesse tout ce qui se fait sous le ciel. C’est une tâche pénible que Dieu a donnée aux êtres humains[a] pour qu’ils s’y consacrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de l’homme » ; cette expression hébraïque désigne ici l’ensemble des êtres humains.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour qu’ils en soient accablés » ou « pour qu’ils peinent à l’accomplir ». L’hébreu peut évoquer à la fois le fait de s’occuper d’une tâche et celui d’en subir le poids.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: J’ai appliqué mon cœur
  rationale: L’expression hébraïque signifie littéralement « j’ai donné mon cœur ». « Appliquer son cœur » conserve le cœur comme siège de l’intelligence et de la volonté, tout en exprimant naturellement une résolution réfléchie.
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: à rechercher et à explorer
  rationale: 'Les deux infinitifs proches ne sont pas entièrement redondants : דרש évoque la recherche ou l’examen, tandis que תור suggère l’exploration attentive.'
- source_word: בַּחָכְמָה
  choice: avec sagesse
  rationale: La préposition ב indique ici le moyen ou la manière. « Avec sagesse » est naturel en français et présente la sagesse comme le mode de l’enquête.
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: tout ce qui se fait
  rationale: Cette formulation préserve le passif et la portée générale, presque proverbiale, de l’hébreu.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: sous le ciel
  rationale: Expression française idiomatique qui conserve la formule récurrente de Qohélet pour désigner la sphère de l’existence humaine.
- source_word: עִנְיַן רָע
  choice: une tâche pénible
  rationale: עִנְיַן désigne une activité, une occupation ou une tâche, et רָע en souligne ici le caractère éprouvant. « Pénible » conserve l’évaluation négative sans imposer le sens d’un mal moral.
- source_word: לִבְנֵי הָאָדָם
  choice: aux êtres humains
  rationale: Littéralement « aux fils de l’homme/de l’humain », l’expression a ici une portée générique. « Aux êtres humains » restitue clairement cette référence à l’humanité en français moderne.
- source_word: לַעֲנוֹת בּוֹ
  choice: pour qu’ils s’y consacrent
  rationale: Dans cette forme, ענה peut évoquer le fait d’être occupé ou accablé par quelque chose. Le choix principal exprime l’engagement dans la tâche, tandis qu’une note conserve la nuance possible de peine ou d’affliction.
theological_decisions:
- issue: La portée de רָע dans une tâche donnée par Dieu
  choice: « pénible »
  alternative: « mauvaise » ou « funeste »
  rationale: Le contexte met l’accent sur le poids et la frustration de l’activité humaine. « Pénible » maintient le jugement négatif sans affirmer que Dieu serait l’auteur d’un mal moral.
- issue: La portée de לִבְנֵי הָאָדָם
  choice: « aux êtres humains »
  alternative: « aux fils de l’homme »
  rationale: L’expression hébraïque masculine est générique dans ce contexte. La traduction principale communique directement sa portée universelle, et la forme littérale est signalée en note.
- issue: L’ambiguïté de לַעֲנוֹת בּוֹ
  choice: « pour qu’ils s’y consacrent » avec note
  alternative: « pour qu’ils en soient accablés »
  rationale: L’hébreu permet à la fois l’idée d’être occupé par cette tâche et celle d’en subir le poids. Le texte principal reste lisible, tandis que la note préserve la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « appliquer son cœur » conserve l’image hébraïque tout en restant intelligible. Les répétitions conceptuelles et l’ambiguïté du dernier verbe sont préservées sans alourdir le texte principal.
