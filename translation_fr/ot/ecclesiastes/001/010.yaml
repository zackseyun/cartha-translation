    rationale: Cette expression peut suggérer une durée prolongée jusqu’au présent, alors que le texte affirme surtout que la chose était déjà présente dans les âges antérieurs. La mention explicite des temps précédents suffit à rendre l’ampleur temporelle.
  - severity: low
    issue: Préposition temporelle
    rationale: Avec « temps » au sens d’époques, « aux temps qui nous ont précédés » est plus naturel que « dans les temps qui nous ont précédés ».
