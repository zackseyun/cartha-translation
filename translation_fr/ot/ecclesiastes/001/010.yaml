  verdict: revise
  source_fidelity: La question existentielle et la portée indéfinie de שֶׁיֹּאמַר sont bien rendues. Toutefois, « depuis longtemps » ajoute une idée de durée continue qui n’est pas explicitement portée par כְּבָר הָיָה; le complément לְעֹלָמִים ... situe plutôt l’existence dans les âges/temps antérieurs.
  naturalness: Le français est globalement naturel et de registre moderne. « dans les temps qui nous ont précédés » est compréhensible, mais « aux temps qui nous ont précédés » est plus idiomatique avec un repère temporel.
  terminology: Aucun terme théologique ou nom propre n’est en cause. « quelque chose », « on puisse dire » et « c’est nouveau » conservent convenablement l’indétermination et le caractère rhétorique de l’hébreu.
