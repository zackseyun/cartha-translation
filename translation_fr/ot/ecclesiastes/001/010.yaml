  text: יֵ֥שׁ דָּבָ֛ר שֶׁ/יֹּאמַ֥ר רְאֵה זֶ֖ה חָדָ֣שׁ ה֑וּא כְּבָר֙ הָיָ֣ה לְ/עֹֽלָמִ֔ים אֲשֶׁ֥ר הָיָ֖ה מִ/לְּ/פָנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: fr
  text: 'Y a-t-il quelque chose dont on puisse dire : « Regarde, c’est nouveau » ? Cela existait déjà aux temps qui nous ont précédés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דָּבָר
  choice: Y a-t-il quelque chose
  rationale: Le tour existentiel est compris comme une question rhétorique dans la continuité du contexte. « Quelque chose » rend naturellement la portée générale de דָּבָר.
- source_word: שֶׁיֹּאמַר
  choice: dont on puisse dire
  rationale: Le relatif suivi de l’imparfait exprime ici une affirmation éventuelle et indéfinie; le pronom « on » en garde la portée générale.
- source_word: רְאֵה זֶה חָדָשׁ הוּא
  choice: Regarde, c’est nouveau
  rationale: « Regarde » est un impératif actuel et direct; « c’est nouveau » restitue naturellement le démonstratif et le prédicat.
- source_word: כְּבָר הָיָה
  choice: Cela existait déjà depuis longtemps
  rationale: Le verbe הָיָה indique ici l’existence antérieure. « Déjà » porte l’insistance de כְּבָר, tandis que « depuis longtemps » prépare le complément temporel sans suggérer une durée éternelle.
- source_word: לְעֹלָמִים אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: dans les temps qui nous ont précédés
  rationale: Dans ce contexte, le pluriel עֹלָמִים désigne des temps reculés. La formulation française conserve l’idée de périodes antérieures à la génération présente.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, ainsi que l’ampleur temporelle du texte, sans rendre עֹלָמִים par une éternité absolue.
