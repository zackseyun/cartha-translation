source:
  edition: WLC
  text: דּ֤וֹר הֹלֵךְ֙ וְ/ד֣וֹר בָּ֔א וְ/הָ/אָ֖רֶץ לְ/עוֹלָ֥ם עֹמָֽדֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: fr
  text: Une génération s’en va, une génération arrive, mais la terre demeure pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se tient pour toujours ». L’expression souligne ici la stabilité durable de la terre, par contraste avec les générations qui se succèdent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: génération
  rationale: Le nom désigne ici une génération humaine. Sa répétition conserve le parallélisme entre celle qui part et celle qui arrive.
- source_word: הֹלֵךְ
  choice: s’en va
  rationale: Le participe exprime une réalité générale et continue. « S’en va » restitue simplement l’image du mouvement sans expliciter « meurt » ou « disparaît ».
- source_word: בָּא
  choice: arrive
  rationale: Le participe répond à הֹלֵךְ dans une antithèse concise. « Arrive » est naturel en français pour parler de l’apparition d’une nouvelle génération.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans cette réflexion de portée universelle, le terme désigne la terre plutôt qu’un territoire particulier.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression française rend la continuité durable exprimée par l’idiome hébreu et maintient le contraste rhétorique avec la succession des générations.
- source_word: עֹמָדֶת
  choice: demeure
  rationale: Le verbe signifie littéralement « se tenir, rester debout ». « Demeure » exprime naturellement en français la stabilité durable, tandis que l’image concrète est signalée en note.
theological_decisions:
- issue: Faut-il comprendre לְעוֹלָם comme une affirmation métaphysique absolue ou comme l’expression rhétorique d’une permanence durable ?
  choice: « pour toujours » dans le texte principal
  alternative: « d’âge en âge » ou « durablement »
  rationale: Le verset oppose la brièveté des générations humaines à la stabilité observée de la terre. La traduction conserve la force et la tension de l’idiome sans transformer cette observation sapientiale en définition cosmologique.
translation_notes:
  register: Français international moderne, sobre et rythmé. La reprise de « une génération » reproduit le parallélisme hébreu ; « s’en va » et « arrive » forment une opposition naturelle, tandis que « demeure » évite la raideur de « se tient » dans le texte principal.
