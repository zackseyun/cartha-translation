base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: fr
  text: Tous les cours d’eau coulent vers la mer[a], et pourtant la mer n’est pas pleine. Vers le lieu où coulent les cours d’eau[b], là ils retournent pour couler de nouveau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rivières » ou « torrents » pour « cours d’eau ». Le mot hébreu peut aussi désigner des oueds ou leur lit, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Vers le lieu où vont les cours d’eau, là ils retournent pour aller. » Cette formulation peut évoquer le cycle récurrent des eaux sans en décrire explicitement le mécanisme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: cours d’eau
  rationale: Le terme peut désigner des torrents, des oueds, leur lit ou des rivières. « Cours d’eau » reste naturel et assez large pour préserver cette latitude dans ce contexte poétique.
- source_word: הֹלְכִים
  choice: se jettent / coulent
  rationale: Le verbe signifie littéralement « aller », mais, appliqué à l’eau, ces formulations rendent naturellement son mouvement en français. « Se jettent dans » convient à la première destination exprimée; « coulent » garde la formulation plus ouverte dans la reprise.
- source_word: יָם
  choice: mer
  rationale: « Mer » est l’équivalent courant et n’impose pas la précision supplémentaire d’« océan ».
- source_word: אֵינֶנּוּ מָלֵא
  choice: ne se remplit pas
  rationale: Cette tournure française exprime l’absence persistante de remplissement sans ajouter explicitement « jamais », absent de l’hébreu.
- source_word: מְקוֹם
  choice: lieu
  rationale: L’hébreu dit « lieu » et non « source »; ce choix évite d’introduire dans le texte une explication précise du cycle de l’eau.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe est conservé afin de reproduire l’insistance de la reprise hébraïque.
- source_word: שָׁבִים
  choice: retournent
  rationale: Le sens ordinaire est « revenir, retourner » et soutient ici l’image de répétition.
- source_word: לָלָכֶת
  choice: pour couler de nouveau
  rationale: Littéralement « pour aller »; avec des cours d’eau, « couler » est idiomatique. « De nouveau » explicite sobrement la récurrence impliquée par « retournent » suivi de l’infinitif.
theological_decisions:
- issue: Description du retour des eaux
  choice: Conserver la formulation spatiale et cyclique sans en préciser le mécanisme
  alternative: Traduire le « lieu » comme la « source » ou expliciter le cycle hydrologique
  rationale: Le texte évoque le retour récurrent des eaux, mais n’en expose pas le mécanisme. La traduction préserve cette tension et n’importe pas une explication scientifique ou interprétative.
translation_notes:
  register: Français international moderne, poétique mais accessible. La coordination « et pourtant » fait ressortir le contraste. Les répétitions « cours d’eau », « lieu » et « là » maintiennent la structure insistante de l’hébreu.
