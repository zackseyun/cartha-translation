  register: 'Français international moderne, naturel et digne. La formulation conserve le contraste paradoxal du texte : la sagesse est supérieure à la force, mais celle du pauvre est socialement méprisée. Les marqueurs [a] et [b] sont placés dans le texte principal à l’endroit pertinent.'
