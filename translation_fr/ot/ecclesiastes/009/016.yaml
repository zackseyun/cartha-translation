base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: fr
  text: 'Et je me suis dit : « La sagesse vaut mieux que la force. » Pourtant, la sagesse du pauvre[a] est méprisée, et ses paroles ne sont pas écoutées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pauvre : il s’agit probablement de l’homme pauvre et sage mentionné au verset précédent.'
    reason: cross_reference
  - marker: b
    text: 'Ou : « ne sont pas entendues » ou « restent sans écho ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי
  choice: Et je me suis dit
  rationale: Le parfait à la première personne introduit ici la réflexion ou la conclusion personnelle de l’Ecclésiaste. Le passé composé est naturel en français moderne et « me suis dit » convient à une réflexion intérieure.
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: La sagesse vaut mieux que la force
  rationale: La construction comparative exprime la supériorité de la sagesse. « Vaut mieux que » est idiomatique et dignifié, tandis que « force » conserve le sens général de puissance ou de vaillance.
- source_word: וְחָכְמַת
  choice: Pourtant, la sagesse de
  rationale: Bien que la conjonction soit formellement additive, le contexte marque un contraste entre la valeur de la sagesse et le mépris social dont elle fait l’objet.
- source_word: הַמִּסְכֵּן
  choice: du pauvre
  rationale: Le substantif masculin singulier désigne l’homme pauvre et sage mentionné au verset précédent. En français, « du pauvre » reste naturel tout en conservant le renvoi spécifique.
- source_word: בְּזוּיָה
  choice: est méprisée
  rationale: Le terme exprime le dédain ou le mépris. L’accord féminin suit « sagesse », sujet grammatical du participe.
- source_word: וּדְבָרָיו
  choice: et ses paroles
  rationale: Le pluriel désigne les propos ou conseils de cet homme. « Paroles » est direct, naturel et adapté au registre biblique moderne.
- source_word: אֵינָם נִשְׁמָעִים
  choice: ne sont pas écoutées
  rationale: Le niphal de שׁמע peut exprimer non seulement le fait d’être entendu, mais aussi celui de recevoir attention ou considération. Dans ce contexte de mépris, « ne sont pas écoutées » communique clairement cette portée sans exclure l’idée qu’elles restent sans effet.
