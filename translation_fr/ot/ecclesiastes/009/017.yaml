  text: דִּבְרֵ֣י חֲכָמִ֔ים בְּ/נַ֖חַת נִשְׁמָעִ֑ים מִ/זַּעֲקַ֥ת מוֹשֵׁ֖ל בַּ/כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/017.yaml
  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
translation:
  language: fr
  text: Les paroles des sages sont davantage entendues dans le calme que le cri d’un dirigeant parmi les insensés[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les paroles des sages, entendues dans le calme, valent mieux que le cri d’un dirigeant parmi les insensés. » La comparaison hébraïque peut exprimer soit un degré supérieur (« davantage »), soit une supériorité de valeur (« valent mieux »).'
    reason: lexical_alternative
  - marker: b
    text: « Parmi les insensés » peut aussi se comprendre comme « sur les insensés », mais la préposition évoque plus naturellement ici le lieu ou la compagnie.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: les paroles des sages
  rationale: Le nom construit דִּבְרֵי désigne ici des propos ou paroles, et חֲכָמִים est un adjectif substantivé au pluriel. « Les sages » conserve sa portée générale sans préciser inutilement le genre.
- source_word: בְּנַחַת
  choice: dans le calme
  rationale: נַחַת évoque le calme, la tranquillité ou la douceur. La tournure nominale « dans le calme » préserve la forme de l’hébreu et contraste avec le cri.
- source_word: נִשְׁמָעִים
  choice: sont entendues
  rationale: Le participe niphal de שׁמע a ici un sens passif. « Sont entendues » reste proche du texte et n’impose pas le sens plus interprétatif de « sont écoutées » ou « sont suivies ».
- source_word: מִזַּעֲקַת
  choice: davantage que le cri de
  rationale: Le מִן introduit la comparaison après « sont entendues ». זַעֲקָה désigne un cri ou une clameur; le singulier « cri » respecte la forme hébraïque.
- source_word: מוֹשֵׁל
  choice: un dirigeant
  rationale: Le participe substantivé désigne quelqu’un qui exerce l’autorité. « Dirigeant » est actuel, naturel et assez large pour ne pas préciser une fonction politique absente du texte.
- source_word: בַּכְּסִילִים
  choice: au milieu des insensés
  rationale: La préposition ב est comprise ici dans son sens locatif ou associatif. « Au milieu de » exprime clairement cette présence parmi un groupe, tandis qu’« insensés » convient au vocabulaire sapientiel.
theological_decisions:
- issue: Nature de la comparaison introduite par מִן
  choice: davantage que
  alternative: valent mieux que
  rationale: La formulation retenue conserve explicitement le passif « sont entendues » et présente une comparaison de degré. Une lecture évaluative, « valent mieux que », est possible mais rend explicite une supériorité seulement implicite.
- issue: Sens de la préposition ב devant כְּסִילִים
  choice: au milieu des insensés
  alternative: sur des insensés
  rationale: Le sens locatif ou associatif est le plus naturel dans ce contexte. Le sens d’autorité, « sur », reste grammaticalement envisageable et est signalé en note sans être imposé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du parallélisme hébreu tout en restant intelligible. « Insensés » maintient la tonalité propre à la littérature de sagesse; « dirigeant » évite de restreindre מוֹשֵׁל à un titre institutionnel précis.
