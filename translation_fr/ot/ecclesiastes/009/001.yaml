  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: fr
  text: 'Car j’ai pris tout cela à cœur et j’ai cherché à éclaircir ceci : les justes, les sages et leurs œuvres[a] sont dans la main de Dieu. Les êtres humains ne savent pas si l’amour ou la haine les attend[b] ; tout est devant eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs serviteurs ». La forme hébraïque vocalisée se lit naturellement ainsi, mais beaucoup comprennent ici « leurs œuvres » ou « leurs actes ».
    reason: alternative_reading
  - marker: b
    text: La fin du verset est difficile en hébreu. Elle peut vouloir dire que les êtres humains ignorent si l’amour ou la haine les attend, ou que les circonstances présentes ne permettent pas de savoir s’ils sont aimés ou haïs.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: j’ai pris tout cela à cœur
  rationale: Cette expression française naturelle conserve l’image hébraïque du cœur comme lieu de la réflexion et exprime une considération sérieuse.
- source_word: וְלָבוּר
  choice: j’ai cherché à éclaircir
  rationale: Le verbe évoque ici l’examen visant à distinguer ou clarifier une question ; cette formulation convient à la démarche réfléchie de Qohéleth.
- source_word: הַצַּדִּיקִים וְהַחֲכָמִים
  choice: les justes, les sages
  rationale: « Justes » garde la portée morale du premier terme, tandis que « sages » est le terme courant de la littérature sapientiale.
- source_word: וַעֲבָדֵיהֶם
  choice: et leurs œuvres
  rationale: Dans le contexte, cette lecture relie à Dieu non seulement les justes et les sages, mais aussi leur activité. La forme massorétique se lit naturellement « leurs serviteurs » ; cette possibilité réelle est signalée en note.
- source_word: בְּיַד הָאֱלֹהִים
  choice: dans la main de Dieu
  rationale: La traduction conserve la métaphore concrète de la main, qui peut exprimer pouvoir, maîtrise et garde sans imposer une seule nuance.
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: si c’est l’amour ou la haine
  rationale: Cette tournure française rend les deux possibilités opposées sans déterminer si elles désignent les dispositions de Dieu, celles d’autrui ou les expériences à venir.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le singulier hébreu est générique ; « l’être humain » le rend en français moderne sans le limiter au sexe masculin.
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: tout est devant eux
  rationale: Cette formulation reste proche de la clause hébraïque difficile et conserve son caractère ouvert plutôt que de préciser abusivement ce que « tout » désigne.
theological_decisions:
- issue: Sens de וַעֲבָדֵיהֶם
  choice: leurs œuvres
  alternative: leurs serviteurs
  rationale: « Leurs œuvres » s’intègre au propos sur les justes et les sages placés, avec ce qui procède d’eux, dans la main de Dieu. Toutefois, la vocalisation massorétique soutient directement « leurs serviteurs » ; la note maintient donc cette difficulté textuelle et sémantique.
- issue: Rapport entre l’amour, la haine et ce que l’être humain peut connaître
  choice: l’être humain ignore si l’amour ou la haine l’attend
  alternative: les circonstances présentes ne permettent pas de savoir si une personne est aimée ou haïe
  rationale: Le texte hébreu est condensé et permet plusieurs relations syntaxiques. Le corps du texte exprime l’incertitude quant à ce qui attend chacun, tandis que la note préserve l’autre compréhension importante sans trancher théologiquement.
- issue: Portée de l’expression « dans la main de Dieu »
  choice: conserver la métaphore sans l’expliciter
  alternative: sous le contrôle de Dieu
  rationale: La métaphore hébraïque affirme que les personnes concernées et leurs œuvres relèvent de Dieu, mais le verset ne précise pas s’il insiste sur la souveraineté, la protection ou le jugement. La traduction ne réduit donc pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression méditative du texte, ainsi que les métaphores du cœur et de la main. Les deux difficultés majeures du verset sont rendues visibles par des notes placées exactement après les expressions concernées.
