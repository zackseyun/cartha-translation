base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: fr
  text: 'Tout est pareil pour tous : un même sort[a] échoit au juste comme au méchant, à celui qui est bon, à celui qui est pur et à celui qui est impur, à celui qui offre des sacrifices et à celui qui n’en offre pas ; il en va de l’homme bon comme du pécheur, de celui qui prête serment comme de celui qui redoute un serment[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un même événement » ou « une même destinée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui a peur de prêter serment ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: Tout arrive de la même manière à tous
  rationale: Rend l’ellipse hébraïque dans un français naturel tout en conservant l’affirmation générale qui ouvre le verset.
- source_word: מִקְרֶה אֶחָד
  choice: un même sort
  rationale: Dans le contexte de Qohélet, l’expression désigne ce qui échoit pareillement à chacun, avec la mort en arrière-plan, sans imposer l’idée d’un déterminisme impersonnel.
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: le juste et le méchant
  rationale: Conserve l’opposition morale traditionnelle et directe du texte hébreu.
- source_word: לַטּוֹב
  choice: celui qui est bon
  rationale: Maintient cette catégorie distincte du « juste », conformément à l’accumulation rhétorique de l’hébreu.
- source_word: לַטָּהוֹר וְלַטָּמֵא
  choice: celui qui est pur et celui qui est impur
  rationale: « Pur » et « impur » sont les termes français bibliques usuels et peuvent garder ici leur dimension rituelle sans l’expliciter excessivement.
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: celui qui offre des sacrifices et celui qui n’en offre pas
  rationale: Formulation française actuelle qui maintient clairement le contraste cultuel.
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: Il en va de l’homme bon comme du pécheur
  rationale: Reproduit la comparaison ramassée de l’hébreu en français idiomatique.
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: de celui qui prête serment comme de celui qui redoute un serment
  rationale: « Prêter serment » évite l’ambiguïté moderne du verbe « jurer »; « redouter un serment » préserve l’indétermination entre crainte de jurer et respect prudent du serment.
theological_decisions:
- issue: Portée de מִקְרֶה אֶחָד
  choice: un même sort
  alternative: un même événement; une même destinée
  rationale: Le contexte vise vraisemblablement l’issue commune qu’est la mort. « Sort » exprime ce qui arrive à tous sans introduire une doctrine fataliste.
- issue: Valeur de טָהוֹר et טָמֵא
  choice: pur et impur
  alternative: rituellement pur et rituellement impur; propre et impur
  rationale: La traduction conserve les catégories pouvant être rituelles sans les réduire à une qualification exclusivement morale ni ajouter une précision absente du texte.
- issue: Sens de שְׁבוּעָה יָרֵא
  choice: celui qui redoute un serment
  alternative: celui qui a peur de prêter serment; celui qui respecte un serment
  rationale: L’hébreu permet d’entendre soit la crainte de prêter serment, soit une attitude de révérence prudente envers le serment. Le texte principal garde cette tension, et la note signale l’autre formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation de couples opposés propre au verset, tout en utilisant des tournures naturelles. Les marqueurs [a] et [b] figurent dans le texte principal.
