  source_fidelity: 'Le sens général est fidèlement rendu : Qohelet affirme qu’un même sort atteint toutes les catégories énumérées. « Un même sort », « juste / méchant », « pur / impur », ainsi que le contraste entre celui qui sacrifie et celui qui ne sacrifie pas, respectent bien l’hébreu. La formulation révisée « Tout est pareil pour tous » rend plus directement l’ellipse initiale הַכֹּל כַּאֲשֶׁר לַכֹּל que « Tout arrive de la même manière à tous ».'
