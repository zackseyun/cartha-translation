  terminology: « Sort » est approprié pour מִקְרֶה dans ce contexte sans imposer un fatalisme doctrinal. « Pur » et « impur » conviennent aux catégories vraisemblablement rituelles. « Pécheur » et « prêter serment » sont des choix bibliques et modernes adéquats.
