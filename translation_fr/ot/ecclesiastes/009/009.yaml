source:
  edition: WLC
  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: fr
  text: Jouis de la vie[a] avec la femme que tu aimes, tous les jours de ta vie passagère[b] qu’il t’a donnée[c] sous le soleil — tous tes jours passagers —, car c’est la part qui te revient dans la vie et dans le labeur auquel tu t’emploies sous le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vois la vie avec la femme que tu aimes. » L’expression hébraïque « voir la vie » peut signifier faire l’expérience de la vie ou en jouir.'
    reason: lexical_alternative
  - marker: b
    text: Hébreu hévèl, souvent traduit par « vanité » ou « vapeur » ; ici, le mot souligne le caractère bref et insaisissable de la vie.
    reason: lexical_alternative
  - marker: c
    text: Le sujet de « a donnée » est sous-entendu en hébreu. Le contexte plus large suggère Dieu, bien qu’il ne soit pas nommé dans cette proposition.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: Jouis de la vie
  rationale: Littéralement « vois la vie » ; dans cette expression sapientielle, le verbe désigne l’expérience heureuse de la vie. « Jouis de la vie » restitue naturellement cet idiome en français.
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: avec la femme que tu aimes
  rationale: Bien que אִשָּׁה soit sans article, la relative et le contexte désignent une femme précise, comprise comme l’épouse du destinataire. Le parfait אָהַבְתָּ peut exprimer ici une relation durable, rendue naturellement au présent.
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: ta vie passagère / tes jours passagers
  rationale: הֶבֶל évoque la vapeur, le caractère éphémère et insaisissable de l’existence. « Passagère » préserve surtout l’idée de brièveté sans imposer le sens plus catégorique de « dépourvue de sens ».
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: qu’il t’a donnée
  rationale: Le sujet masculin singulier demeure implicite en hébreu. Le pronom « il » conserve cette retenue ; le contexte permet de comprendre Dieu comme donateur sans le nommer dans la proposition.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression caractéristique de l’Ecclésiaste désignant l’existence humaine dans l’ordre présent ; la formulation française traditionnelle reste claire et naturelle.
- source_word: כִּי הוּא חֶלְקְךָ
  choice: car c’est la part qui te revient
  rationale: חֵלֶק désigne une part attribuée. Cette formulation conserve l’image tout en exprimant clairement en français l’idée d’un lot accordé.
- source_word: וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: et dans le travail auquel tu peines
  rationale: Le nom עָמָל et le participe apparenté soulignent le travail pénible et continu. « Travail » suivi de « tu peines » garde ce champ sémantique sans répétition maladroite.
theological_decisions:
- issue: Sujet implicite du verbe נָתַן (« a donné »)
  choice: Conserver « il » dans le texte principal.
  alternative: 'Expliciter « Dieu » : « que Dieu t’a donnée ».'
  rationale: Le contexte général présente Dieu comme celui qui donne, mais son nom n’apparaît pas dans cette proposition. Le pronom respecte l’implicite du texte source et évite de résoudre silencieusement cette donnée grammaticale.
- issue: Portée de הֶבֶל appliqué à la vie
  choice: Employer « passagère » plutôt que « vaine » ou « dépourvue de sens ».
  alternative: Traduire « ta vie vaine » ou « ta vie fugitive ».
  rationale: Dans ce contexte, l’exhortation à recevoir la vie comme une part donnée favorise la nuance de brièveté et d’insaisissabilité. « Passagère » ne transforme pas le verset en affirmation théologique univoque sur l’absence de sens de la vie.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement correspond à l’adresse masculine singulière de l’hébreu. La phrase conserve les répétitions rhétoriques (« sous le soleil », « passagère/passagers ») et l’ambiguïté du sujet implicite, tout en adoptant une syntaxe française fluide.
