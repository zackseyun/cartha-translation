reference: Ecclesiastes 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֣ךְ אֱכֹ֤ל בְּ/שִׂמְחָה֙ לַחְמֶ֔/ךָ וּֽ/שֲׁתֵ֥ה בְ/לֶב ט֖וֹב יֵינֶ֑/ךָ כִּ֣י כְבָ֔ר רָצָ֥ה הָ/אֱלֹהִ֖ים אֶֽת מַעֲשֶֽׂי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: fr
  text: Va, mange ton pain dans la joie et bois ton vin d’un cœur heureux, car Dieu a déjà agréé tes actes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a accepté tes actes », « approuve ce que tu fais » ou « prend plaisir à ce que tu fais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif ouvre l’exhortation de manière vive. « Va » conserve cette force discursive sans développer le texte.
- source_word: בְּשִׂמְחָה
  choice: dans la joie
  rationale: La préposition indique la manière; cette tournure naturelle conserve le substantif « joie ».
- source_word: לַחְמֶךָ
  choice: ton pain
  rationale: Le sens concret de « pain » convient au contexte et reste idiomatique en français.
- source_word: בְלֶב טוֹב
  choice: d’un cœur heureux
  rationale: L’expression hébraïque évoque une disposition intérieure joyeuse; la traduction préserve l’image du cœur sans reproduire littéralement « un bon cœur », ambigu en français.
- source_word: יֵינֶךָ
  choice: ton vin
  rationale: Traduction directe et appropriée dans ce contexte.
- source_word: כְבָר
  choice: déjà
  rationale: L’adverbe signale que la faveur divine est antérieure ou déjà établie.
- source_word: רָצָה
  choice: a agréé
  rationale: Le verbe exprime l’accueil favorable ou le plaisir. « Agréer » conserve cette nuance d’acceptation favorable, tout en laissant ouvertes les nuances précisées en note.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Avec l’article, le terme désigne ici Dieu; « Dieu » est la traduction française habituelle.
- source_word: מַעֲשֶׂיךָ
  choice: tes actes
  rationale: Le nom désigne les actions ou les réalisations. « Actes » est clair et naturel, tout en évitant la possible surcharge doctrinale de « œuvres ».
theological_decisions:
- issue: Sens de l’agrément divin dans la dernière proposition
  choice: Le verset affirme que Dieu a déjà accueilli favorablement les actes du destinataire, ce qui fonde l’invitation à jouir des dons de la vie.
  alternative: Le verbe peut aussi être compris comme « a accepté », « approuve » ou « prend plaisir à » ce que fait le destinataire.
  rationale: רצה avec מַעֲשִׂים exprime une appréciation ou une acceptation favorable. Le verset ne précise pas à lui seul si cette acceptation est cultuelle, providentielle ou liée à un autre cadre théologique; la traduction et la note préservent cette latitude sans suggérer que les actes méritent le salut.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs et les images concrètes du pain, du vin et du cœur sont conservés; la dernière proposition garde son caractère évaluatif sans explicitation doctrinale.
