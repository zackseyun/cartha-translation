source:
  edition: WLC
  text: עִ֣יר קְטַנָּ֔ה וַ/אֲנָשִׁ֥ים בָּ֖/הּ מְעָ֑ט וּ/בָֽא אֵלֶ֜י/הָ מֶ֤לֶךְ גָּדוֹל֙ וְ/סָבַ֣ב אֹתָ֔/הּ וּ/בָנָ֥ה עָלֶ֖י/הָ מְצוֹדִ֥ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: fr
  text: Il y avait une petite ville, avec peu d’hommes à l’intérieur. Un grand roi vint l’attaquer, l’encercla et construisit contre elle d’imposants ouvrages de siège.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de grandes fortifications » ou « de grandes rampes de siège ». Le mot hébreu peut désigner plus largement des constructions de siège ou des fortifications.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: une petite ville
  rationale: Traduction directe et naturelle qui conserve le contraste avec la grandeur du roi et des ouvrages de siège.
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: avec peu d’hommes à l’intérieur
  rationale: אֲנָשִׁים est un pluriel masculin signifiant ici « hommes »; la formulation française exprime naturellement leur faible nombre dans la ville.
- source_word: וּבָא אֵלֶיהָ
  choice: vint l’attaquer
  rationale: Pris littéralement, le tour peut signifier « vint vers elle », mais l’encerclement et les ouvrages de siège rendent manifeste l’intention hostile; « l’attaquer » explicite cette valeur contextuelle.
- source_word: מֶלֶךְ גָּדוֹל
  choice: un grand roi
  rationale: Rend directement l’hébreu et maintient le contraste rhétorique entre la petite ville et le grand roi.
- source_word: וְסָבַב אֹתָהּ
  choice: l’encercla
  rationale: Dans ce contexte militaire, « encercler » exprime avec précision l’action de faire le tour de la ville pour l’assiéger.
- source_word: וּבָנָה עָלֶיהָ
  choice: construisit contre elle
  rationale: La préposition עַל indique ici des constructions dirigées contre la ville dans le cadre du siège.
- source_word: מְצוֹדִים גְּדֹלִים
  choice: d’imposants ouvrages de siège
  rationale: מְצוֹדִים peut désigner diverses constructions militaires; « ouvrages de siège » préserve cette portée générale, tandis qu’« imposants » rend גְּדֹלִים sans produire la répétition peu naturelle de « grand ».
