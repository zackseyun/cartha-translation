source:
  edition: WLC
  text: כִּי מִי֙ אֲשֶׁ֣ר יבחר אֶ֥ל כָּל הַ/חַיִּ֖ים יֵ֣שׁ בִּטָּח֑וֹן כִּֽי לְ/כֶ֤לֶב חַי֙ ה֣וּא ט֔וֹב מִן הָ/אַרְיֵ֖ה הַ/מֵּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: fr
  text: 'Car celui qui est associé à tous les vivants a de l’espoir[a][b] : mieux vaut un chien vivant qu’un lion mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Celui qui est choisi parmi tous les vivants a de l’assurance. » La forme hébraïque de la proposition initiale est difficile et peut être comprise autrement.'
    reason: alternative_reading
  - marker: b
    text: Le terme rendu par « espoir » peut aussi exprimer la confiance, l’assurance ou la sécurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: est associé
  rationale: La forme hébraïque est difficile. Dans ce contexte, « est associé » exprime naturellement le fait d’être encore compté avec les vivants, sens appuyé par le contraste avec les morts, tout en signalant en note la lecture possible « est choisi ».
- source_word: אֶל כָּל הַחַיִּים
  choice: à tous les vivants
  rationale: La préposition et le groupe nominal marquent ici l’appartenance ou l’association à l’ensemble des vivants. La formulation complète « associé à tous les vivants » reste claire en français moderne.
- source_word: בִּטָּחוֹן
  choice: peut encore espérer
  rationale: Le nom peut désigner l’assurance, la confiance ou la sécurité. Dans le contexte, il évoque surtout la possibilité qui demeure tant que l’on vit; la tournure verbale française transmet naturellement cette idée, et « encore » rend explicite l’opposition pragmatique entre vie et mort sans la surcharger.
- source_word: לְכֶלֶב חַי
  choice: un chien vivant
  rationale: Traduction directe avec l’article indéfini, naturel dans cette comparaison proverbiale.
- source_word: טוֹב מִן
  choice: mieux vaut… que
  rationale: Cette tournure française idiomatique conserve la simplicité et la force proverbiale du comparatif hébreu.
- source_word: הָאַרְיֵה הַמֵּת
  choice: un lion mort
  rationale: Même si l’hébreu emploie les articles, l’indéfini convient mieux en français à une comparaison générale entre deux figures symboliques.
theological_decisions:
- issue: Sens de la proposition initiale avec יבחר
  choice: celui qui est associé à tous les vivants
  alternative: celui qui est choisi parmi tous les vivants
  rationale: La vocalisation massorétique donne une formulation difficile si le verbe est compris au sens courant de « choisir ». Le contexte favorise l’idée de quelqu’un qui appartient encore au monde des vivants. La traduction principale suit cette cohérence contextuelle, tandis que la note préserve l’autre analyse possible sans résoudre artificiellement l’ambiguïté.
- issue: Portée de בִּטָּחוֹן
  choice: peut encore espérer
  alternative: a de l’assurance / de la sécurité
  rationale: Le passage souligne l’avantage concret d’être vivant plutôt qu’une doctrine générale sur l’au-delà. « Espérer » exprime la possibilité encore ouverte, tandis que la note conserve les autres valeurs lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale « mieux vaut… que… » donne au second membre sa concision. Les deux appels de note figurent dans le texte principal et distinguent l’incertitude syntaxico-lexicale de la première proposition de la nuance propre à בִּטָּחוֹן.
