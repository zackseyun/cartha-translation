  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: fr
  text: 'Voici le mal qui se trouve dans tout ce qui se fait sous le soleil : un même sort atteint tout le monde[a]. De plus, le cœur des humains[b] est rempli de mal, et la folie habite leur cœur pendant leur vie ; après cela, ils vont vers les morts[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un même événement arrive à tous ». Le mot hébreu peut désigner ce qui survient à quelqu’un, un événement ou un sort commun.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le cœur des fils de l’homme ». Cette expression hébraïque désigne ici l’humanité en général.'
    reason: source_form
  - marker: c
    text: 'L’hébreu est abrupt : littéralement, « et après cela, vers les morts ». Le verbe « vont » est sous-entendu.'
    reason: textual_ellipsis
lexical_decisions:
- source_word: זֶה רָע
  choice: Voici ce qu’il y a de mauvais
  rationale: Rend naturellement en français la tournure démonstrative et évaluative, qui désigne un aspect affligeant précis de la vie sous le soleil.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: dans tout ce qui se fait sous le soleil
  rationale: Conserve la formule caractéristique de Qohélet ainsi que la valeur passive et impersonnelle du verbe.
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: un même sort atteint tout le monde
  rationale: מִקְרֶה désigne ici ce qui arrive aux êtres humains, leur sort commun ; « atteint » évite de suggérer une doctrine déterministe tout en exprimant ce qui leur échoit.
- source_word: לֵב בְּנֵי הָאָדָם
  choice: le cœur des humains
  rationale: Préserve le singulier collectif « cœur » tout en rendant naturellement en français l’expression générique désignant l’humanité, sans la limiter aux hommes de sexe masculin.
- source_word: מָלֵא רָע
  choice: est rempli de mal
  rationale: Rendu direct qui garde la portée large du terme רָע, susceptible d’évoquer à la fois la corruption morale et les intentions nuisibles.
- source_word: וְהוֹלֵלוֹת בִּלְבָבָם
  choice: et la folie habite leur cœur
  rationale: « Folie » exprime la conduite irrationnelle et déraisonnable ; « habite » produit un français naturel sans atténuer l’image intérieure du cœur.
- source_word: בְּחַיֵּיהֶם
  choice: pendant leur vie
  rationale: Rend simplement la valeur temporelle de l’expression hébraïque.
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: après cela, ils rejoignent les morts
  rationale: La proposition hébraïque est abrupte et elliptique. Le français explicite le mouvement sous-entendu, tandis qu’une note signale la formulation littérale et son ambiguïté.
theological_decisions:
- issue: Portée anthropologique de בְּנֵי הָאָדָם
  choice: les humains
  alternative: les fils de l’homme / les êtres humains
  rationale: L’expression hébraïque est générique et vise l’humanité entière. « Les humains » communique cette portée en français moderne sans transformer une forme masculine représentative en affirmation exclusivement masculine.
- issue: Sens de מִקְרֶה אֶחָד
  choice: un même sort
  alternative: un même événement / ce qui arrive à tous est identique
  rationale: Dans le contexte immédiat de la mort commune, « sort » restitue la portée existentielle du terme tout en laissant la note rappeler son sens plus général d’événement qui survient.
- issue: Ellipse finale et condition des morts
  choice: ils rejoignent les morts
  alternative: après cela, aux morts
  rationale: Le texte affirme la destination commune sans préciser ici une doctrine détaillée de l’au-delà. L’ajout du verbe implicite rend la phrase intelligible sans introduire un « lieu des morts » absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « sous le soleil » et l’image biblique du cœur sont conservées. La syntaxe finale est explicitée avec mesure, et l’ellipse de l’hébreu est documentée en note.
