  text: גַּ֣ם אַהֲבָתָ֧/ם גַּם שִׂנְאָתָ֛/ם גַּם קִנְאָתָ֖/ם כְּבָ֣ר אָבָ֑דָה וְ/חֵ֨לֶק אֵין לָ/הֶ֥ם עוֹד֙ לְ/עוֹלָ֔ם בְּ/כֹ֥ל אֲשֶֽׁר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: fr
  text: Leur amour, leur haine et leur jalousie[a] ont déjà disparu, et ils n’auront plus jamais part à quoi que ce soit qui se fait sous le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur zèle » ou « leur envie ».
    reason: Alternative lexicale pour קִנְאָתָם, dont le sens peut varier selon le contexte.
lexical_decisions:
- source_word: גַּם אַהֲבָתָם גַּם שִׂנְאָתָם גַּם קִנְאָתָם
  choice: Leur amour, leur haine et leur jalousie
  rationale: La répétition de גַּם coordonne et souligne les trois réalités. En français, la répétition de « leur » conserve naturellement cet effet cumulatif sans reproduire mécaniquement « aussi ».
- source_word: קִנְאָתָם
  choice: leur jalousie
  rationale: קִנְאָה peut désigner la jalousie, le zèle ou l’envie. Dans cette série de passions humaines avec l’amour et la haine, « jalousie » convient bien, tandis qu’une note préserve les autres possibilités lexicales.
- source_word: כְּבָר אָבָדָה
  choice: ont déjà disparu
  rationale: כְּבָר indique un état déjà accompli, et אבד exprime ici la disparition de ces passions. L’accord pluriel est naturel en français avec les trois noms coordonnés, malgré le verbe hébreu au féminin singulier.
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד לְעוֹלָם
  choice: et jamais plus ils n’auront part
  rationale: Cette formulation française rend l’absence désormais permanente de toute participation. Le futur, associé à « jamais plus », exprime idiomatiquement la portée durable de l’expression existentielle hébraïque et de לְעוֹלָם.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: à quoi que ce soit de ce qui se fait
  rationale: La tournure conserve la portée exhaustive de בְּכֹל et la nuance passive de נַעֲשָׂה, tout en s’intégrant naturellement à « avoir part à ».
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression caractéristique de l’Ecclésiaste désigne la sphère de la vie et des activités terrestres; la formulation traditionnelle reste claire en français moderne.
theological_decisions:
- issue: Portée de l’affirmation sur le rapport des morts aux affaires terrestres
  choice: Le verset affirme qu’ils ne participent plus à ce qui se fait dans la sphère terrestre, « sous le soleil ».
  alternative: Comprendre le verset comme une affirmation métaphysique générale selon laquelle les morts seraient totalement inconscients à tous égards.
  rationale: La précision « sous le soleil » délimite explicitement le propos. La traduction maintient cette limite sans tirer de conclusion doctrinale plus large sur l’état des morts.
translation_notes:
  register: Français international moderne, clair et digne. « Jamais plus » restitue avec force et naturel la permanence exprimée par עוֹד לְעוֹלָם. Le marqueur de note est placé après « jalousie », le terme auquel s’appliquent les variantes.
