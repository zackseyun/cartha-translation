  yaml_path: translation/ot/ecclesiastes/009/018.yaml
  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
translation:
  language: fr
  text: Mieux vaut la sagesse que les armes de guerre ; mais un seul pécheur détruit beaucoup de bien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et un seul pécheur détruit beaucoup de bien ». La conjonction hébraïque peut simplement signifier « et », mais le contexte permet de comprendre ici un contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה חָכְמָה מִכְּלֵי קְרָב
  choice: Mieux vaut la sagesse que les armes de guerre
  rationale: La construction avec מִן exprime une comparaison. « Mieux vaut… que… » est une formulation française naturelle et proverbiale, tandis que כְּלֵי קְרָב désigne l’équipement ou les armes de combat.
- source_word: וְחוֹטֶא אֶחָד
  choice: mais un seul pécheur
  rationale: Le וְ est formellement une coordination, mais il introduit ici un contraste avec la valeur de la sagesse. « Un seul » rend l’insistance portée par אֶחָד.
- source_word: יְאַבֵּד
  choice: détruit
  rationale: Le piel de אבד exprime le fait de causer la perte ou la destruction ; « détruit » conserve la force de l’avertissement.
- source_word: טוֹבָה הַרְבֵּה
  choice: beaucoup de bien
  rationale: L’expression désigne une grande quantité de bien ou de bénéfice, sans limiter celui-ci à une seule dimension morale ou pratique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale « Mieux vaut… que… » restitue naturellement la comparaison hébraïque. Le point-virgule met en relief le contraste entre le pouvoir bénéfique de la sagesse et le tort qu’un seul pécheur peut causer.
