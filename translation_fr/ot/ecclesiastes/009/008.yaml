  text: בְּ/כָל עֵ֕ת יִהְי֥וּ בְגָדֶ֖י/ךָ לְבָנִ֑ים וְ/שֶׁ֖מֶן עַל רֹאשְׁ/ךָ֥ אַל יֶחְסָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
translation:
  language: fr
  text: Qu’en tout temps tes vêtements soient blancs[a], et que l’huile ne manque pas sur ta tête.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que tes vêtements soient toujours blancs. »'
    reason: lexical_alternative
  - marker: b
    text: Les vêtements blancs et l’huile sur la tête évoquent la fête, la joie et le bien-être, par contraste avec le deuil.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: Rend directement la portée continue de l’expression hébraïque, dans un français naturel et digne.
- source_word: יִהְיוּ
  choice: qu’ils soient
  rationale: Le yiqtol a ici une valeur jussive et exprime une exhortation plutôt qu’un simple futur.
- source_word: בְגָדֶיךָ
  choice: tes vêtements
  rationale: « Vêtements » conserve le pluriel concret et convient au registre sapientiel sans être archaïque.
- source_word: לְבָנִים
  choice: blancs
  rationale: Équivalent direct qui préserve l’image sans en intégrer l’interprétation symbolique au texte.
- source_word: וְשֶׁמֶן
  choice: l’huile
  rationale: L’hébreu dit simplement « huile »; préciser « huile d’olive » ou « huile d’onction » irait au-delà du texte.
- source_word: עַל רֹאשְׁךָ
  choice: sur ta tête
  rationale: Traduction directe et idiomatique de la locution prépositionnelle.
- source_word: אַל יֶחְסָר
  choice: que … ne manque pas
  rationale: La construction négative à valeur jussive est rendue naturellement tout en conservant la notion de manque.
theological_decisions:
- issue: Portée symbolique des vêtements blancs et de l’huile
  choice: Conserver les images concrètes dans le texte et expliquer leur évocation culturelle en note
  alternative: Traduire explicitement par une invitation à la joie et à la fête
  rationale: Le verset emploie des images et non une explication abstraite; les expliciter dans le corps du texte réduirait leur richesse et leur possible polysémie.
translation_notes:
  register: Français international moderne, fluide et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. La structure coordonnée conserve le parallélisme exhortatif du verset.
