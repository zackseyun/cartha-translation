id: ECC.9.5
reference: Ecclesiastes 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: fr
  text: Car les vivants savent qu’ils mourront, mais les morts ne savent absolument rien[a]. Il n’y a plus de récompense pour eux, puisque leur souvenir est tombé dans l’oubli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne savent rien ». L’expression hébraïque est emphatique : « ne savent absolument rien ».'
    reason: Variante lexicale signalant la force de l’expression hébraïque.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison explicative de l’affirmation précédente et conserve naturellement le lien logique en français.
- source_word: הַחַיִּים
  choice: les vivants
  rationale: Rend directement l’adjectif substantivé pluriel qui désigne collectivement les personnes en vie.
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: savent qu’ils mourront
  rationale: Exprime simplement le contenu de leur connaissance; le futur français correspond bien à l’imparfait hébreu dans ce contexte.
- source_word: וְהַמֵּתִים
  choice: mais les morts
  rationale: Le waw marque ici un contraste net avec « les vivants »; « mais » le communique idiomatiquement.
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: ne savent absolument rien
  rationale: « Absolument rien » restitue la force emphatique de la négation accompagnée de מְאוּמָה.
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: Il n’y a plus de récompense pour eux
  rationale: « Récompense » convient au sens large de שָׂכָר dans l’Ecclésiaste, tandis que « plus » rend עוֹד dans la construction négative.
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: puisque leur souvenir est tombé dans l’oubli
  rationale: Rend la relation causale et l’idée passive d’un souvenir désormais oublié dans un français naturel et digne.
theological_decisions:
- issue: La portée de l’affirmation selon laquelle les morts ne savent rien
  choice: 'Conserver l’affirmation sans restriction ajoutée : « les morts ne savent absolument rien »'
  alternative: Ajouter « de ce qui se passe sous le soleil » ou atténuer l’énoncé en fonction d’autres textes bibliques
  rationale: L’hébreu formule l’affirmation de manière abrupte. La traduction préserve cette tension dans la perspective littéraire de Qohélet sans en faire explicitement un traité systématique sur l’état des morts ni introduire une harmonisation absente du verset.
- issue: Le sens de שָׂכָר
  choice: récompense
  alternative: salaire; gain
  rationale: « Récompense » garde l’étendue sémantique du terme et évite de réduire le propos à une rémunération économique.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le contraste entre les vivants et les morts est maintenu, de même que la formulation tranchante du texte. Le marqueur de note est placé après la proposition qu’il explique.
