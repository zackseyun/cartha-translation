  text: וּ/מָ֣צָא בָ֗/הּ אִ֤ישׁ מִסְכֵּן֙ חָכָ֔ם וּ/מִלַּט ה֥וּא אֶת הָ/עִ֖יר בְּ/חָכְמָת֑/וֹ וְ/אָדָם֙ לֹ֣א זָכַ֔ר אֶת הָ/אִ֥ישׁ הַ/מִּסְכֵּ֖ן הַ/הּֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: fr
  text: On y trouva[a] un homme pauvre et sage, et celui-ci sauva la ville par sa sagesse. Pourtant, personne ne se souvint de cet homme pauvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y trouva »; le sujet du verbe hébreu peut être compris comme personnel ou indéfini.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: On y trouva
  rationale: Cette tournure française rend naturellement l’emploi indéfini du verbe hébreu à la troisième personne tout en conservant l’idée qu’un tel homme fut trouvé dans la ville. La construction hébraïque permet aussi une lecture avec un sujet personnel, signalée en note.
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: un homme pauvre et sage
  rationale: אִישׁ désigne ici un homme, מִסְכֵּן sa condition modeste ou pauvre, et חָכָם sa sagesse. L’ordre français coordonné est naturel et fidèle.
- source_word: וּמִלַּט הוּא אֶת הָעִיר
  choice: et celui-ci sauva la ville
  rationale: Le piel de מלט avec la ville comme complément direct signifie la sauver ou la délivrer. « Sauva » est le terme français courant; « celui-ci » reprend clairement l’homme pauvre et rend l’insistance du pronom הוּא.
- source_word: בְּחָכְמָתוֹ
  choice: par sa sagesse
  rationale: 'La préposition בְּ exprime ici le moyen: la sagesse de cet homme fut l’instrument du salut de la ville.'
- source_word: וְאָדָם לֹא זָכַר
  choice: Pourtant, personne ne se souvint
  rationale: אָדָם est générique dans cette négation et signifie qu’aucun être humain ne se souvint de lui. « Personne » est le rendu français moderne, exact et non ambigu; « pourtant » exprime le contraste contextuel porté par la coordination.
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: de cet homme pauvre
  rationale: Le groupe défini avec démonstratif renvoie avec insistance à l’homme précis qui avait sauvé la ville.
theological_decisions:
- issue: Portée générique de אָדָם dans la proposition négative
  choice: personne
  alternative: aucun homme
  rationale: Dans ce contexte, אָדָם ne vise pas seulement les personnes de sexe masculin, mais nie que qui que ce soit se soit souvenu du sage. « Personne » transmet exactement cette portée en français courant sans introduire une restriction absente de l’hébreu.
- issue: Sujet de וּמָצָא
  choice: 'construction indéfinie: « On y trouva »'
  alternative: 'sujet personnel: « Il y trouva »'
  rationale: La forme verbale est morphologiquement à la troisième personne masculine singulière et peut reprendre un sujet du contexte, mais elle est couramment comprise ici de façon indéfinie. La traduction principale suit cette lecture sans effacer l’autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au récit bref et contraste avec la réflexion sapientielle. « Sauva » est plus naturel aujourd’hui que « délivra » pour le sauvetage d’une ville, sans ajouter de connotation confessionnelle.
