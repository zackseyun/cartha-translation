source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: fr
  text: Car l’être humain ne connaît même pas son heure[a]. Comme les poissons pris dans un filet funeste et les oiseaux pris au piège, les êtres humains[b] sont eux aussi pris au piège à l’heure du malheur[c], lorsqu’elle s’abat soudain sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son temps » ou « son moment ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les fils de l’être humain », expression qui désigne les êtres humains en général.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « à un temps mauvais » ; autre traduction possible : « à un temps de calamité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le singulier générique hébreu désigne ici tout être humain. Cette formulation conserve le singulier et reste naturelle en français moderne, sans restreindre indûment le propos aux hommes de sexe masculin.
- source_word: עִתּוֹ
  choice: son heure
  rationale: עֵת désigne un temps ou un moment qui échoit à quelqu’un. « Son heure » est concis, idiomatique et permet de reprendre le même terme par « l’heure du malheur », sans préciser s’il s’agit exclusivement de la mort.
- source_word: מְצוֹדָה רָעָה
  choice: un filet funeste
  rationale: מְצוֹדָה est un filet servant à capturer. Ici, רָעָה qualifie son effet nuisible ou fatal plutôt qu’une faute morale ; « funeste » rend cette force de manière naturelle et digne.
- source_word: פָּח
  choice: piège
  rationale: Le mot désigne un piège ou un lacet destiné notamment aux oiseaux. « Piège » est clair en français contemporain et convient au parallélisme avec le filet.
- source_word: יֽוּקָשִׁים
  choice: sont pris au piège
  rationale: Le passif de יקש exprime le fait d’être pris ou pris au piège. La formulation française maintient explicitement l’image de la capture.
- source_word: בְּנֵי הָאָדָם
  choice: les êtres humains
  rationale: L’expression signifie littéralement « les fils de l’être humain/de l’homme », mais fonctionne comme un idiome collectif désignant les humains. La traduction évite en outre la possible connotation christologique de « fils de l’homme » en français.
- source_word: לְעֵת רָעָה
  choice: à l’heure du malheur
  rationale: La locution désigne un moment mauvais ou calamiteux. « À l’heure du malheur » est idiomatique, conserve la notion temporelle et reprend le choix fait pour עֵת plus haut.
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: lorsqu’elle s’abat soudain sur eux
  rationale: Le verbe féminin singulier renvoie vraisemblablement à עֵת, nom féminin en hébreu. Le pronom féminin « elle » renvoie de même à « l’heure », tandis que « s’abat sur » restitue l’image de la chute soudaine.
theological_decisions:
- issue: Portée du singulier générique הָאָדָם et de l’idiome בְּנֵי הָאָדָם
  choice: « l’être humain » puis « les êtres humains »
  alternative: « l’homme » puis « les fils de l’homme »
  rationale: Le premier emploi reste singulier et représentatif, tandis que le second est rendu comme l’idiome collectif qu’il constitue. Cette solution transmet la portée universelle du texte et évite que « les fils de l’homme » soit compris comme un titre théologique absent du contexte.
- issue: Référent du verbe féminin תִּפּוֹל
  choice: Faire renvoyer « elle » à « l’heure du malheur »
  alternative: Expliciter « lorsque le malheur s’abat soudain sur eux »
  rationale: L’accord hébreu favorise un renvoi à עֵת, féminin, plutôt qu’à un nom de désastre ajouté par interprétation. Le pronom préserve ce lien grammatical sans résoudre davantage la nature exacte de l’événement.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des poissons, des oiseaux et des humains est conservé, de même que la répétition du vocabulaire temporel. « Pris au piège » est volontairement répété pour faire entendre le motif dominant de la capture.
