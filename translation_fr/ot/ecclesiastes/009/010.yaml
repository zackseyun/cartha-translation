id: ECC.9.10
reference: Ecclesiastes 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: fr
  text: Tout ce que ta main trouve à faire, fais-le avec la force que tu as, car il n’y a ni activité, ni projet, ni connaissance, ni sagesse dans le Shéol[a], où tu vas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le séjour des morts » ou « la tombe ». Le terme hébreu Shéol désigne le lieu ou la condition des morts dans l’Ancien Testament.
    reason: Alternative lexicale et clarification du concept hébreu.
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce que
  rationale: Cette tournure française naturelle conserve la portée générale de la proposition relative hébraïque.
- source_word: תִּמְצָא יָדְךָ
  choice: ta main trouve
  rationale: Le maintien de « main » préserve l’image hébraïque liée à la possibilité et à la capacité d’agir.
- source_word: לַעֲשׂוֹת ... עֲשֵׂה
  choice: à faire, fais-le
  rationale: La répétition de la racine עשה est conservée par « faire »; le pronom « le » reprend naturellement ce qui se présente à faire.
- source_word: בְּכֹחֲךָ
  choice: avec la force que tu as
  rationale: Cette formulation actuelle exprime l’emploi de la force dont la personne dispose, sans ajouter explicitement « toute », absent du texte hébreu.
- source_word: מַעֲשֶׂה
  choice: activité
  rationale: Dans ce contexte, le nom désigne largement ce qui se fait; « activité » évite de restreindre le sens au travail professionnel ou à une œuvre particulière.
- source_word: חֶשְׁבּוֹן
  choice: projet
  rationale: Le terme peut désigner calcul, réflexion ou planification; « projet » rend ici naturellement l’idée de ce qui est conçu ou planifié.
- source_word: דַעַת
  choice: connaissance
  rationale: Équivalent direct qui conserve la dimension cognitive du terme.
- source_word: חָכְמָה
  choice: sagesse
  rationale: Rend le sens sapiential large et récurrent du mot dans l’Ecclésiaste.
- source_word: בִּשְׁאוֹל
  choice: dans le Shéol
  rationale: La translittération conserve le concept hébreu sans le réduire à la tombe ni lui imposer la notion plus tardive d’enfer.
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: où tu vas
  rationale: Formulation concise et naturelle qui présente le Shéol comme la destination de l’interlocuteur.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le Shéol
  alternative: le séjour des morts; la tombe
  rationale: « Shéol » préserve l’étendue du terme hébreu et la perspective propre à l’Ecclésiaste sur la condition des morts, sans l’assimiler à l’enfer. La note fournit les principaux équivalents explicatifs.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement suit l’adresse individuelle au masculin singulier de l’hébreu. La phrase conserve l’image concrète de la main et la série de quatre réalités absentes du Shéol.
