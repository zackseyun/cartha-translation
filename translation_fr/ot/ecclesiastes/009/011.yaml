  text: שַׁ֜בְתִּי וְ/רָאֹ֣ה תַֽחַת הַ/שֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַ/קַּלִּ֨ים הַ/מֵּר֜וֹץ וְ/לֹ֧א לַ/גִּבּוֹרִ֣ים הַ/מִּלְחָמָ֗ה וְ֠/גַם לֹ֣א לַ/חֲכָמִ֥ים לֶ֨חֶם֙ וְ/גַ֨ם לֹ֤א לַ/נְּבֹנִים֙ עֹ֔שֶׁר וְ/גַ֛ם לֹ֥א לַ/יֹּדְעִ֖ים חֵ֑ן כִּי עֵ֥ת וָ/פֶ֖גַע יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: fr
  text: J’ai encore vu sous le soleil que la course ne revient pas aux plus rapides, ni la bataille aux plus vaillants ; que le pain ne revient pas non plus aux sages, ni la richesse aux personnes avisées, ni la faveur à ceux qui savent, car le temps et les circonstances[a] leur arrivent à tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temps et le hasard », « le temps et l’accident » ou « le moment et ce qui arrive ». L’expression hébraïque évoque le temps et ce qui survient ; elle souligne que les circonstances ne sont pas maîtrisables par les capacités humaines.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: J’ai encore vu
  rationale: Littéralement « je suis revenu et j’ai vu » ; chez Qohéleth, la tournure introduit ici une nouvelle observation plutôt qu’un déplacement physique. « J’ai encore vu » exprime naturellement cette reprise.
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression caractéristique de l’Ecclésiaste désignant la sphère de l’existence humaine terrestre ; la formulation consacrée reste claire en français moderne.
- source_word: לַקַּלִּים הַמֵּרוֹץ
  choice: la course ne revient pas aux plus rapides
  rationale: קַל désigne ici les personnes rapides et מֵרוֹץ la course. « Revenir à » exprime que la victoire ou l’issue favorable n’est pas nécessairement acquise, sans ajouter explicitement le mot « victoire ».
- source_word: לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: ni la bataille aux plus vaillants
  rationale: גִּבּוֹרִים désigne des hommes puissants ou valeureux, souvent des guerriers. « Vaillants » convient au contexte militaire tout en conservant la qualité mise en parallèle avec la rapidité.
- source_word: לַחֲכָמִים לֶחֶם
  choice: le pain ne revient pas non plus aux sages
  rationale: לֶחֶם signifie littéralement « pain » et peut évoquer plus largement la nourriture ou la subsistance. Le maintien de « pain » préserve l’image concrète de l’hébreu.
- source_word: לַנְּבֹנִים
  choice: les personnes avisées
  rationale: Le terme désigne ceux qui possèdent intelligence et discernement. « Personnes avisées » est actuel et souligne la capacité de jugement.
- source_word: עֹשֶׁר
  choice: la richesse
  rationale: Le singulier collectif « richesse » rend directement l’idée de biens et s’intègre naturellement au parallélisme français.
- source_word: לַיֹּדְעִים
  choice: ceux qui ont du savoir
  rationale: Le participe de ידע reste général. Cette formulation garde la notion de connaissance sans préciser indûment son domaine.
- source_word: חֵן
  choice: la faveur
  rationale: חֵן peut désigner la faveur, l’agrément ou l’accueil favorable. « Faveur » convient ici sans introduire une connotation doctrinale étrangère au contexte.
- source_word: עֵת וָפֶגַע
  choice: le temps et les événements imprévus
  rationale: עֵת désigne le temps ou le moment, tandis que פֶּגַע évoque ce qui survient ou fait irruption. La formulation conserve l’idée de circonstances qui échappent aux prévisions humaines sans affirmer que le monde est régi par un hasard absolu.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: les atteignent tous
  rationale: Le verbe peut exprimer ce qui arrive, survient ou rencontre quelqu’un. « Les atteignent tous » rend l’idée que nul n’échappe à ces circonstances.
theological_decisions:
- issue: Le rapport entre les événements imprévus et la providence divine
  choice: Décrire l’imprévisibilité des résultats du point de vue de l’expérience humaine « sous le soleil ».
  alternative: Présenter le verset comme l’affirmation que la vie est gouvernée uniquement par un hasard aveugle.
  rationale: Le texte constate que les aptitudes humaines ne garantissent pas les résultats et que des circonstances imprévisibles touchent chacun. Il ne formule pas explicitement une négation de la souveraineté divine ; la traduction conserve donc cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé ; « revient à » évite d’ajouter explicitement la victoire ou la réussite, tandis que la reprise partielle de la tournure rend la longue série lisible.
