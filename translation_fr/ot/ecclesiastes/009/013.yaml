lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Conserve la valeur additive, en reliant cette observation aux réflexions précédentes.
- source_word: זֹה … חָכְמָה
  choice: cet exemple de sagesse
  rationale: Le démonstratif annonce le récit qui suit. « Exemple de » rend naturellement l’emploi concret du nom abstrait, sans perdre la notion de sagesse.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Rend directement le qal accompli et correspond au langage d’observation récurrent de Qohélet.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Conserve l’expression caractéristique de l’Ecclésiaste pour désigner la sphère de la vie terrestre.
- source_word: וּגְדוֹלָה הִיא אֵלָי
  choice: et il m’a paru remarquable
  rationale: Exprime l’évaluation personnelle portée par אֵלַי. « Remarquable » est plus idiomatique ici que « grand » en français et évite de préciser indûment la nature de cette grandeur.
