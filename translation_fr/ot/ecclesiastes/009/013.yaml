  text: 'J’ai aussi vu sous le soleil cet exemple de sagesse[a], et il m’a paru remarquable :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette sagesse ». Le contexte présente un cas concret de sagesse raconté dans les versets suivants.'
