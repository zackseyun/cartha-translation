id: ECC.4.14
reference: Ecclesiastes 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי מִ/בֵּ֥ית הָ/סוּרִ֖ים יָצָ֣א לִ/מְלֹ֑ךְ כִּ֛י גַּ֥ם בְּ/מַלְכוּת֖/וֹ נוֹלַ֥ד רָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
translation:
  language: fr
  text: Car il est sorti de prison[a] pour régner, alors même que, dans son royaume[b], il était né pauvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison des prisonniers » ou « des détenus ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « durant son règne » ; le mot hébreu peut désigner le royaume, la royauté ou le règne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  choice: de prison
  rationale: L’expression signifie littéralement « de la maison des prisonniers » ou « des détenus ». « De prison » restitue naturellement en français moderne l’idée du lieu de détention, tandis qu’une note conserve la forme imagée de l’hébreu.
- source_word: יָצָא
  choice: il est sorti
  rationale: Le verbe courant יָצָא signifie « sortir ». Le passé composé convient au récit rétrospectif et s’accorde naturellement avec « de prison ».
- source_word: לִמְלֹךְ
  choice: pour régner
  rationale: L’infinitif de מלך exprime le fait de régner ou d’être roi. « Pour régner » conserve directement la notion royale sans expliciter davantage que le texte.
- source_word: גַּם
  choice: même
  rationale: 'Dans la seconde proposition, גַּם renforce le contraste concessif : malgré son accession au pouvoir, il était « même » né pauvre.'
- source_word: בְּמַלְכוּתוֹ
  choice: dans son royaume
  rationale: Le nom מַלְכוּת peut désigner le royaume, la royauté ou le règne. « Dans son royaume » suit de près la construction spatiale apparente, tout en signalant en note la lecture temporelle possible.
- source_word: נוֹלַד
  choice: il était né
  rationale: La forme passive accomplie renvoie à sa naissance, antérieure à sa sortie de prison et à son règne. Le plus-que-parfait français rend clairement cette antériorité.
- source_word: רָשׁ
  choice: pauvre
  rationale: « Pauvre » est l’équivalent français direct et courant de רָשׁ, qui peut aussi évoquer une personne indigente ou démunie.
- source_word: כִּי ... כִּי
  choice: Car ... alors même que
  rationale: Le premier כִּי introduit l’explication. Le second se comprend naturellement comme concessif dans le contexte ; « alors même que » garde le contraste sans le durcir en une opposition absolue.
theological_decisions:
- issue: Rapport logique introduit par le second כִּי
  choice: 'Lecture concessive : « alors même que »'
  alternative: 'Lecture causale : « car, même dans son royaume, il était né pauvre »'
  rationale: Le contexte oppose la condition initiale du jeune homme à son accession au trône. La valeur concessive donne un français cohérent, mais la particule hébraïque peut aussi conserver une nuance explicative.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation privilégie une syntaxe naturelle, conserve l’image de l’ascension de la prison au pouvoir et signale sans la résoudre l’ambiguïté de בְּמַלְכוּתוֹ.
