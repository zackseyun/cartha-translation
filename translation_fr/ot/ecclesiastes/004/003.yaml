  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: fr
  text: Mais celui qui n’existe pas encore et qui n’a pas vu l’acte mauvais qui se commet sous le soleil est dans une meilleure situation que tous les deux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטוֹב
  choice: Mais … est mieux loti
  rationale: Dans le contexte, טוֹב exprime une comparaison avec les vivants et les morts du verset précédent. « Mieux loti » évite que « meilleur » suggère une supériorité morale, tandis que « mais » rend naturellement le contraste discursif.
- source_word: מִשְּׁנֵיהֶם
  choice: que l’un et l’autre
  rationale: Cette formulation française renvoie clairement aux deux groupes mentionnés au verset précédent et conserve la comparaison avec tous deux.
- source_word: אֵת אֲשֶׁר
  choice: celui qui
  rationale: La proposition relative est substantivée et désigne une personne au singulier. « Celui qui » est naturel et fidèle.
- source_word: עֲדֶן לֹא הָיָה
  choice: n’a pas encore été
  rationale: Cette traduction conserve l’expression volontairement générale du verbe היה, sans préciser dans le texte qu’il s’agit de naissance ou d’existence. Une note donne l’interprétation contextuelle plus explicite.
- source_word: לֹא רָאָה
  choice: n’a pas vu
  rationale: Le passé composé exprime naturellement en français une expérience qui n’a jamais eu lieu et maintient le parallélisme avec « n’a pas encore été ».
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: l’acte mauvais
  rationale: מַעֲשֶׂה désigne ce qui est fait, un acte ou une œuvre. « L’acte mauvais » conserve le singulier et la qualification morale sans l’abstraire en simple notion de mal.
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: qui se commet
  rationale: Pour un acte mauvais, « se commet » rend naturellement en français la forme passive et la portée générale de l’observation.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette formule récurrente de l’Ecclésiaste est rendue de manière littérale, naturelle et cohérente.
theological_decisions:
- issue: Identité de celui qui « n’a pas encore été »
  choice: Maintenir dans le texte la formulation générale du verbe « être »
  alternative: « celui qui n’est pas encore né »
  rationale: Le contexte oriente vers une personne non encore née ou jamais venue à l’existence, mais l’hébreu ne contient pas explicitement le verbe « naître ». La traduction préserve cette tension et place l’explicitation en note.
translation_notes:
  register: Français international actuel, sobre et digne. L’ordre des propositions a été légèrement réorganisé pour obtenir une phrase française naturelle, sans modifier la relation comparative. « Mieux loti » exprime un avantage de condition plutôt qu’une supériorité morale.
