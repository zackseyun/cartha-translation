source:
  edition: WLC
  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
translation:
  language: fr
  text: Mieux vaut un jeune pauvre mais sage qu’un roi âgé et insensé qui ne sait plus accepter les avertissements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « recevoir une instruction » ou « se laisser avertir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Mieux vaut ... que
  rationale: La construction comparative hébraïque est rendue par la tournure proverbiale française naturelle « Mieux vaut… que… ».
- source_word: יֶלֶד
  choice: un jeune
  rationale: Le nom désigne ici une personne jeune, en contraste avec le roi âgé, sans imposer l’idée précise d’un petit enfant.
- source_word: מִסְכֵּן
  choice: pauvre
  rationale: L’adjectif évoque la pauvreté ou une condition modeste; « pauvre » est direct et naturel.
- source_word: וְחָכָם
  choice: mais sage
  rationale: La conjonction relie les qualités du jeune; « mais » exprime naturellement en français le contraste concessif entre pauvreté et sagesse.
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: un roi vieux et insensé
  rationale: Cette formulation conserve les trois éléments du texte et le contraste entre la jeunesse sage et la vieillesse insensée. « Insensé » garde la portée pratique et morale du vocabulaire sapientiel.
- source_word: אֲשֶׁר לֹא יָדַע ... עוֹד
  choice: qui ne sait plus
  rationale: Avec la négation, עוֹד indique que la capacité ou la disposition n’existe plus; « ne sait plus » est idiomatique et fidèle.
- source_word: לְהִזָּהֵר
  choice: se laisser avertir
  rationale: La forme niphal exprime ici la réception d’un avertissement ou d’une réprimande. « Se laisser avertir » préserve l’idée de réceptivité sans réduire le sens à la simple prudence.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et proverbial. La formulation demeure concise, tout en conservant l’opposition entre pauvreté et sagesse, royauté et folie, jeunesse et vieillesse.
