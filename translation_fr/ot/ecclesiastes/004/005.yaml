translation:
  language: fr
  text: L’insensé se croise les mains[a] et mange sa propre chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « joint » ou « serre ses mains » ; le geste évoque l’inaction.
    reason: lexical_alternative
  - marker: b
    text: Image pouvant évoquer l’autodestruction par la folie ou l’oisiveté.
