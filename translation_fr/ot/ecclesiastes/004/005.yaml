lexical_decisions:
- source_word: הַכְּסִיל
  choice: le sot
  rationale: Dans la littérature de sagesse, כְּסִיל désigne une personne dont la folie est à la fois morale et intellectuelle. « Le sot » convient au ton proverbial sans réduire le terme à un simple manque d’intelligence.
- source_word: חֹבֵק
  choice: croise
  rationale: Le verbe signifie littéralement « étreindre » ou « serrer ». Appliqué aux mains, il décrit ici le geste d’une personne inactive. « Croise les mains » conserve l’image concrète tout en restant compréhensible en français moderne.
- source_word: יָדָיו
  choice: les mains
  rationale: יָד désigne la « main » ; la forme munie du suffixe de troisième personne masculine singulière signifie ici « ses mains ». La tournure française avec « les mains » est naturelle après un verbe employé avec une partie du corps.
- source_word: וְאֹכֵל
  choice: et mange
  rationale: Le participe poursuit une description proverbiale générale. Le présent français rend naturellement cette valeur gnomique et conserve la coordination hébraïque.
- source_word: בְּשָׂרוֹ
  choice: sa propre chair
  rationale: בָּשָׂר signifie littéralement « chair ». Le possessif hébreu est rendu par « sa », et « propre » souligne la portée réflexive de l’image sans remplacer la métaphore par son interprétation.
theological_decisions:
- issue: Portée métaphorique de « mange sa propre chair »
  choice: Conserver dans le texte l’image littérale d’une folie ou d’une paresse qui se détruit elle-même.
  alternative: Traduire de manière explicative par « se détruit lui-même » ou « se ruine ».
  rationale: L’hébreu emploie une métaphore corporelle saisissante plutôt qu’une explication abstraite. La garder préserve sa force ainsi que l’ouverture de son application, sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Le sot » garde la dimension sapientielle du terme ; l’image corporelle forte de l’hébreu est maintenue dans le texte principal.
