reference: Ecclesiastes 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִֽם יִתְקְפ/וֹ֙ הָ/אֶחָ֔ד הַ/שְּׁנַ֖יִם יַעַמְד֣וּ נֶגְדּ֑/וֹ וְ/הַ/חוּט֙ הַֽ/מְשֻׁלָּ֔שׁ לֹ֥א בִ/מְהֵרָ֖ה יִנָּתֵֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: fr
  text: Si quelqu’un s’en prend à un homme seul, deux pourront lui tenir tête ; et une corde à trois brins[a] ne se rompt pas vite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une corde rendue triple » ou « triplée ».'
    reason: La forme hébraïque décrit une corde faite triple ; « à trois brins » en donne le sens concret dans un français plus naturel.
lexical_decisions:
- source_word: וְאִם
  choice: Si
  rationale: Introduit naturellement en français la condition qui prolonge la pensée du verset précédent ; le lien exprimé par ו ressort du contexte sans qu’un « et » initial soit nécessaire.
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: quelqu’un s’en prend à un homme seul
  rationale: תקף exprime l’idée de se montrer fort contre quelqu’un ou de l’attaquer. La formulation explicite le sujet indéfini sous-entendu et rattache « un homme seul » au thème du contexte, tout en conservant le suffixe objet singulier.
- source_word: הַשְּׁנַיִם
  choice: deux
  rationale: Le duel hébreu établit un contraste proverbial direct entre l’homme seul et deux personnes.
- source_word: יַעַמְדוּ נֶגְדּוֹ
  choice: pourront lui tenir tête
  rationale: Rend l’image de se tenir face à l’adversaire et son sens de résistance, dans un français naturel.
- source_word: הַחוּט הַמְשֻׁלָּשׁ
  choice: une corde à trois brins
  rationale: חוּט désigne ici une corde, et מְשֻׁלָּשׁ ce qui est fait triple. « À trois brins » exprime clairement et naturellement l’image concrète.
- source_word: לֹא בִמְהֵרָה
  choice: ne… pas vite
  rationale: Conserve le sens temporel premier de בִמְהֵרָה (« rapidement, vite »), sans le remplacer par l’idée voisine de facilité.
- source_word: יִנָּתֵק
  choice: se rompt
  rationale: Le niphal de נתק évoque une corde arrachée, rompue ou séparée ; « se rompt » est précis et idiomatique en français.
theological_decisions:
- issue: Identification grammaticale de l’agresseur et de l’homme seul
  choice: « quelqu’un s’en prend à un homme seul »
  alternative: « si l’un est maîtrisé »
  rationale: L’hébreu présente un verbe actif avec un suffixe objet masculin singulier, suivi de הָאֶחָד. La traduction retenue préserve cette structure autant que possible et s’accorde avec le contraste contextuel entre une personne seule et deux, sans préciser davantage l’identité des personnes.
translation_notes:
  register: Français international moderne, proverbial et digne. Le rythme oppose nettement « un homme seul », « deux » et « trois brins ». Le point-virgule conserve le lien entre l’exemple de la résistance à deux et l’image finale de la corde.
