  to: 'Il y a un homme seul[a], sans personne d’autre ; il n’a ni fils ni frère, et son labeur n’a pas de fin. De plus, ses yeux ne se rassasient pas de richesse : « Pour qui est-ce que je travaille et me prive de ce qui est bon[b] ? » Cela aussi est vanité[c] et constitue une pénible occupation.'
  rationale: La révision remplace « bonheur » par « ce qui est bon » afin de garder la portée ouverte de טוֹבָה. Elle adopte « vanité » pour la cohérence terminologique avec l’Ecclésiaste, tandis que la note conserve les images et nuances alternatives de הֶבֶל. Enfin, « De plus » rend גַּם sans transformer en opposition explicite une relation que l’hébreu laisse moins déterminée. Les ancres de notes restent correctement attachées aux expressions concernées.
