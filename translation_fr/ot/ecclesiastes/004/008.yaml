  source_fidelity: Le projet rend bien la solitude, l’absence de fils et de frère, le labeur interminable, l’absence de satisfaction, la question à la première personne et la qualification finale. Toutefois, « bonheur » resserre indûment טוֹבָה, qui désigne plus largement le bien ou les bonnes choses dont on se prive. « Dérisoire » n’est pas impossible pour הֶבֶל, mais « vanité » conserve plus sûrement le terme thématique de l’Ecclésiaste et sa portée volontairement large, explicitée en note. La formulation révisée rend aussi גַּם avant « yeux » sans introduire une opposition marquée.
  naturalness: La révision reste naturelle en français international moderne. « Son labeur n’a pas de fin » et « ses yeux ne se rassasient pas de richesse » sont idiomatiques dans un registre biblique moderne et digne. Le discours direct sans verbe introducteur respecte la syntaxe source et se lit clairement.
  terminology: « Labeur », « richesse », « vanité » et « pénible occupation » sont cohérents avec le vocabulaire sapientiel. « Ce qui est bon » préserve la largeur de טוֹבָה sans imposer le sens psychologique plus étroit de « bonheur ».
