    rationale: Cette option exprime une facette contextuelle possible, mais elle ne maintient pas aussi bien le mot-repère de l’Ecclésiaste ni son réseau de sens (vapeur, caractère passager, futilité). « Vanité », accompagné d’une note, préserve mieux cette polysémie.
  - severity: low
    issue: « Pourtant » pour גַּם
    rationale: Le connecteur hébreu signifie d’abord « aussi / de plus ». Une lecture adversative est possible dans le contexte, mais « pourtant » impose plus explicitement le contraste. Une coordination neutre est plus fidèle à l’ambiguïté.
