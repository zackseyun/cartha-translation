  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: fr
  text: 'Il y a un homme seul[a], sans personne d’autre ; il n’a ni fils ni frère, et son labeur n’a pas de fin. De plus, ses yeux ne se rassasient pas de richesse : « Pour qui est-ce que je travaille et me prive de ce qui est bon[b] ? » Cela aussi est vanité[c] et constitue une pénible occupation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il y en a un, et il n’y en a pas de second. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je prive ma personne de bien » ; il s’agit des bonnes choses dont il pourrait jouir.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner une vapeur ou un souffle et évoquer ce qui est éphémère, inconsistant ou futile.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: Il y a un homme seul, sans personne d’autre
  rationale: Le masculin singulier est conservé, tandis que « seul » et « sans personne d’autre » rendent naturellement en français l’idée d’un individu sans second ni compagnon.
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: il n’a ni fils ni frère
  rationale: La paire concrète de proches parents est maintenue sans la généraliser en « famille ».
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: tout son labeur est sans fin
  rationale: « Labeur » exprime la dimension pénible de עָמָל et permet une formulation française concise.
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: Pourtant, ses yeux ne sont jamais rassasiés de richesses
  rationale: L’image des yeux rassasiés est préservée. « Pourtant » traduit la valeur contextuellement adversative de גַּם, et « jamais » exprime la négation dans le cadre d’un labeur sans fin.
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: Pour qui donc est-ce que je travaille
  rationale: La question du bénéficiaire est conservée ; la tournure orale mais digne convient à la réflexion intérieure du personnage.
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: et me prive de bonheur
  rationale: נַפְשִׁי désigne ici la personne elle-même. טוֹבָה peut évoquer le bien ou les bonnes choses dont on pourrait jouir ; « bonheur » rend naturellement cette idée dans le contexte.
- source_word: גַּם זֶה הֶבֶל
  choice: Cela aussi est dérisoire
  rationale: « Dérisoire » communique ici l’inconsistance et l’absurdité pratique de הֶבֶל, tandis qu’une note préserve l’image polysémique de la vapeur.
- source_word: וְעִנְיַן רָע הוּא
  choice: et constitue une pénible occupation
  rationale: עִנְיָן désigne une tâche ou occupation, et רָע qualifie ici son caractère mauvais, malheureux ou pénible.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי
  choice: me
  alternative: mon âme
  rationale: Dans cette expression, נֶפֶשׁ renvoie idiomatiquement à la personne elle-même ; « me prive » évite d’imposer une distinction technique entre corps et âme.
- issue: Portée de הֶבֶל
  choice: dérisoire
  alternative: vanité ; vapeur ; futile
  rationale: Le mot conserve dans l’Ecclésiaste plusieurs nuances — souffle, caractère éphémère, inconsistance et absurdité. Le texte principal choisit un français actuel adapté au contexte, sans réduire la gamme sémantique, signalée en note.
- issue: Discours direct non introduit
  choice: deux-points suivis de la question
  alternative: ajouter « se dit-il »
  rationale: L’hébreu passe directement à la première personne sans verbe de parole explicite ; la ponctuation française suffit à marquer cette réflexion sans ajouter de contenu.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme de la longue phrase hébraïque est conservé par des points-virgules. Le discours intérieur n’est pas introduit par un verbe absent de l’original.
