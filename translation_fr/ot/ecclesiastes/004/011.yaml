  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: fr
  text: De plus, si deux personnes se couchent ensemble, elles se tiennent chaud ; mais une personne seule, comment pourrait-elle avoir chaud ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: De même
  rationale: Introduit une observation supplémentaire à l’appui de l’idée développée dans le passage ; cette tournure restitue naturellement la valeur additive.
- source_word: אִם
  choice: si
  rationale: Conserve directement la formulation conditionnelle de l’hébreu.
- source_word: יִשְׁכְּבוּ שְׁנַיִם
  choice: si deux personnes se couchent ensemble
  rationale: שׁכב signifie d’abord « se coucher » plutôt que nécessairement « dormir ». « Personnes » explicite naturellement le numéral substantivé, et « ensemble » rend en français la situation mutuelle impliquée par le contexte.
- source_word: וְחַם לָהֶם
  choice: elles se tiennent chaud
  rationale: Littéralement, la chaleur est « pour elles ». L’expression française « se tenir chaud » rend avec naturel la chaleur réciproque résultant de leur proximité.
- source_word: וּלְאֶחָד
  choice: mais une personne seule
  rationale: La conjonction prend ici une valeur contrastive. « Seule » explicite sans modifier le sens l’opposition entre deux personnes et une personne.
- source_word: אֵיךְ יֵחָם
  choice: comment se tiendra-t-elle chaud ?
  rationale: La question rhétorique est conservée. Le futur français correspond ici à l’imparfait hébreu et exprime la possibilité pratique dans la situation envisagée.
