base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: fr
  text: Il n’y avait pas de limite au nombre de tous les gens[a], de tous ceux qui étaient avant eux ; pourtant, ceux qui viendront après ne se réjouiront pas de lui[b]. Car cela aussi est vanité[c] et poursuite du vent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y a pas de limite au nombre de tous les gens, de tous ceux qui étaient avant eux. » La syntaxe hébraïque de cette proposition est difficile et peut se comprendre de plusieurs manières.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ne seront pas heureux à son sujet » ou « ne se réjouiront pas à cause de lui ».'
    reason: lexical_alternative
  - marker: c
    text: Hébreu hével, terme clé de l’Ecclésiaste pour ce qui est fugitif, inconsistant ou frustrant, comme un souffle.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: il n’y avait pas de fin
  rationale: L’expression signifie qu’il n’existait ni terme ni limite, et suggère ici une multitude innombrable. Le passé convient à la description rétrospective du contexte, bien que l’hébreu puisse aussi se rendre au présent.
- source_word: לְכָל הָעָם
  choice: à tout ce peuple
  rationale: La préposition ל indique ici un rapport après « pas de fin ». Cette formulation reste proche de la structure hébraïque tout en étant compréhensible en français.
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: à tous ceux qui étaient avant eux
  rationale: La syntaxe est difficile. Cette traduction conserve l’expression temporelle et l’ambiguïté des référents sans imposer une interprétation plus précise que l’hébreu.
- source_word: הָאַחֲרוֹנִים
  choice: ceux qui viendront après
  rationale: Le terme désigne les personnes ultérieures, probablement une génération suivante. Le futur s’accorde avec l’imparfait hébreu qui suit et avec l’opposition à ceux qui étaient auparavant.
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: ne se réjouiront pas de lui
  rationale: Le verbe exprime la joie, et le suffixe masculin singulier renvoie le plus naturellement au jeune homme ou dirigeant du contexte immédiat. « De lui » préserve ce renvoi sans préciser la nature exacte de la réaction.
- source_word: הֶבֶל
  choice: vanité
  rationale: Terme clé de l’Ecclésiaste, הבל évoque ce qui est aussi fugitif qu’un souffle, inconsistant ou frustrant. « Vanité » conserve la résonance traditionnelle, explicitée en note afin d’éviter le seul sens moderne d’orgueil.
- source_word: רַעְיוֹן רוּחַ
  choice: poursuite du vent
  rationale: Cette expression récurrente dans l’Ecclésiaste représente une entreprise vaine, comme si l’on tentait de saisir ou de poursuivre le vent.
theological_decisions:
- issue: Référents des pronoms dans ce verset à la syntaxe difficile
  choice: Conserver les pronoms « eux » et « lui » sans identifier davantage leurs référents.
  alternative: Nommer explicitement le jeune homme devenu roi, ou comprendre le peuple comme tous ceux sur lesquels il régnait.
  rationale: Le texte hébreu est condensé et débattu. La traduction laisse subsister son ambiguïté réelle plutôt que de la résoudre par une paraphrase interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. La structure inhabituelle du premier membre est maintenue avec une note parce qu’elle reflète une difficulté réelle de l’hébreu. « Poursuite du vent » conserve l’image concrète et l’idée d’un effort futile.
