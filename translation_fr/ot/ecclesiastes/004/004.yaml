  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: fr
  text: J’ai vu que tout labeur et toute habileté dans tout ouvrage sont l’envie d’un homme à l’égard de son prochain[a]. Cela aussi est vapeur et poursuite du vent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute réussite dans le travail ». Littéralement, « l’envie d’un homme à l’égard de son prochain »; « jalousie » ou « émulation » sont aussi possibles pour le terme hébreu.
    reason: lexical_alternative
  - marker: b
    text: Ou « effort pour saisir le vent » ou « poursuite après le vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: labeur
  rationale: Le mot désigne ici le travail humain pénible et exigeant. « Labeur » conserve cette nuance tout en restant digne et compréhensible.
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: réussite dans le travail
  rationale: כִּשְׁרוֹן peut désigner l’habileté, la compétence ou la réussite qui en résulte. Dans cette construction, « réussite dans le travail » rend naturellement le résultat accompli sans exclure l’idée de savoir-faire.
- source_word: קִנְאַת
  choice: rivalité
  rationale: Le terme peut exprimer l’envie, la jalousie ou l’émulation. Dans le contexte de comparaison sociale, « rivalité » préserve mieux cette étendue que le seul mot « envie ».
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: de l’un envers l’autre
  rationale: Cette formulation française rend le singulier représentatif et la relation entre personnes sans limiter artificiellement l’énoncé aux hommes ni donner à רֵעַ le sens plus étroit d’un voisin géographique.
- source_word: הֶבֶל
  choice: vapeur
  rationale: Le terme thématique de l’Ecclésiaste évoque ce qui est fugitif, insaisissable et inconsistant. « Vapeur » conserve l’image concrète et évite de réduire d’emblée son sens à l’absurdité ou à l’inutilité.
- source_word: רְעוּת רוּחַ
  choice: poursuite du vent
  rationale: Cette expression imagée évoque une entreprise vaine et insaisissable. « Poursuite du vent » est naturelle en français et préserve l’image hébraïque.
theological_decisions:
- issue: Portée de la rivalité comme motivation du travail
  choice: « viennent de la rivalité »
  alternative: « sont rivalité »
  rationale: La proposition nominale hébraïque est concise et peut caractériser l’activité comme issue de la rivalité ou comme en étant une manifestation. La formulation retenue exprime la relation implicite sans transformer le constat sapientiel en affirmation doctrinale absolue sur tout travail.
translation_notes:
  register: Français international moderne, sobre et sapientiel. « Labeur » donne une légère dignité littéraire sans archaïsme marqué. « Vapeur » est maintenu comme terme-image récurrent de l’Ecclésiaste; la phrase reste concise et conserve la tension entre accomplissement humain et rivalité.
