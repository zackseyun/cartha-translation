revisions:
- from: J’ai vu que tout labeur et toute réussite dans le travail viennent de la rivalité de l’un envers l’autre[a]. Cela aussi est vapeur et poursuite du vent[b].
  to: J’ai vu que tout labeur et toute habileté dans tout ouvrage sont l’envie d’un homme à l’égard de son prochain[a]. Cela aussi est vapeur et poursuite du vent[b].
  rationale: La correction restaure le rapport non réciproque et singulier du texte source, rend plus directement le sens principal de קִנְאָה, et remplace « réussite » par une formulation qui maintient la nuance de compétence de כִּשְׁרוֹן. Les variantes interprétatives pertinentes sont conservées dans les notes.
