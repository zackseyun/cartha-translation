base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: fr
  text: J’ai vu tous les vivants, ceux qui marchent sous le soleil, avec le second jeune homme[a] qui prendrait sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le second enfant » ; l’expression peut désigner le jeune successeur qui remplace le dirigeant précédent, mais l’hébreu laisse son identité exacte ouverte.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Rend directement le qal accompli à la première personne et conserve la formule d’observation caractéristique de Qohélet.
- source_word: כָּל הַחַיִּים
  choice: tous les vivants
  rationale: Conserve l’expression hébraïque compacte tout en désignant naturellement l’ensemble des personnes en vie.
- source_word: הַמְהַלְּכִים
  choice: ceux qui marchent
  rationale: Reproduit la valeur participiale et le mouvement exprimé par הלך sans ajouter une idée d’adhésion politique.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Maintient la formule récurrente et structurante de l’Ecclésiaste.
- source_word: עִם
  choice: avec
  rationale: Correspond au sens ordinaire de la préposition et préserve l’ambiguïté entre simple association, présence et soutien.
- source_word: הַיֶּלֶד הַשֵּׁנִי
  choice: le deuxième jeune homme
  rationale: « Jeune homme » convient au contexte de succession sans réduire ילד à un petit enfant ; « deuxième » conserve l’ordinal au lieu de l’interpréter directement comme « successeur ».
- source_word: אֲשֶׁר יַעֲמֹד
  choice: qui se tiendrait
  rationale: Garde l’image de עמד, « se tenir, prendre position », et le conditionnel français convient à la perspective narrative sans imposer un futur strict.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Rend l’emploi idiomatique de תחת dans un contexte où une personne en remplace une autre, tout en conservant le pronom ambigu du texte.
theological_decisions:
- issue: Identité et rôle du « deuxième jeune homme »
  choice: Maintenir la désignation littérale et la relation exprimée par « avec »
  alternative: Expliciter « le jeune successeur que tous suivaient »
  rationale: Le texte évoque vraisemblablement une succession politique, mais ne précise ni l’identité du jeune homme ni la nature exacte du rapport de la foule avec lui ; la traduction ne tranche donc pas au-delà de l’hébreu.
translation_notes:
  register: Français moderne, sobre et littéraire. La syntaxe légèrement répétitive (« tous les vivants, ceux qui… ») conserve la progression de l’hébreu, tandis que « sous le soleil » maintient le refrain propre à l’Ecclésiaste.
