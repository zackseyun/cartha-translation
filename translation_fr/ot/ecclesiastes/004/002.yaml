source:
  edition: WLC
  text: וְ/שַׁבֵּ֧חַ אֲנִ֛י אֶת הַ/מֵּתִ֖ים שֶׁ/כְּבָ֣ר מֵ֑תוּ מִן הַ֣/חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
translation:
  language: fr
  text: Et j’ai estimé les morts, ceux qui étaient déjà morts, plus heureux que les vivants, qui sont encore en vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: j’ai estimé… plus heureux
  rationale: Le piel de שׁבח signifie couramment « louer » ou « déclarer digne d’éloge ». Dans ce contexte comparatif, il exprime le jugement de Qohélet selon lequel les morts sont dans une situation préférable; cette formulation française rend naturellement cette valeur sans suggérer un éloge moral.
- source_word: אֲנִי
  choice: j’ai
  rationale: La première personne est conservée; en français, le pronom sujet est nécessaire et porte ici le jugement personnel de Qohélet.
- source_word: אֶת הַמֵּתִים
  choice: les morts
  rationale: Le participe substantivé désigne les personnes mortes comme catégorie. « Les morts » est direct et idiomatique.
- source_word: שֶׁכְּבָר מֵתוּ
  choice: ceux qui étaient déjà morts
  rationale: כבר indique « déjà », tandis que le parfait de מות présente la mort comme accomplie. La reprise « ceux qui » préserve l’insistance du texte hébreu.
- source_word: מִן הַחַיִּים
  choice: plus heureux que les vivants
  rationale: מן marque ici la comparaison après un verbe d’évaluation. « Plus heureux que » explicite en français l’avantage relatif exprimé dans le contexte de l’oppression.
- source_word: הַחַיִּים
  choice: les vivants
  rationale: L’expression désigne les personnes vivantes comme catégorie; « les vivants » est concise et naturelle.
- source_word: אֲשֶׁר הֵמָּה חַיִּים עֲדֶנָה
  choice: ceux qui sont encore en vie
  rationale: La proposition relative réaffirme leur condition présente, et עֲדֶנָה signifie « encore, toujours, jusqu’à présent ». La formulation conserve cette insistance sans lourdeur excessive.
theological_decisions:
- issue: Comparaison existentielle entre les morts et les vivants
  choice: Le verset présente le jugement de Qohélet selon lequel, face à l’oppression, les morts sont dans une situation préférable à celle des vivants.
  alternative: Y voir une affirmation sur la félicité des morts dans l’au-delà, ou réduire la phrase à une pure hyperbole sans véritable comparaison.
  rationale: Le contexte immédiat (4.1-3) porte sur l’oppression « sous le soleil ». La traduction maintient la comparaison troublante sans introduire une doctrine précise de l’état après la mort ni en neutraliser la force.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition explicative du texte hébreu (« les morts… déjà morts »; « les vivants… encore en vie ») est conservée afin d’en maintenir l’insistance rhétorique.
