  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: fr
  text: Prends garde à tes pas[a] lorsque tu vas à la maison de Dieu. Approche-toi pour écouter[b] plutôt que pour offrir le sacrifice des insensés, car ils ne savent pas qu’ils font le mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Garde tes pieds. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour entendre ». Le verbe peut désigner aussi bien l’audition que l’écoute attentive et obéissante.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « car ils ne savent pas faire le mal », expression concise qui signifie probablement qu’ils ne se rendent pas compte que leur conduite est mauvaise.'
    reason: ambiguity
lexical_decisions:
- source_word: שְׁמֹר רגליך
  choice: Veille à tes pas
  rationale: L’expression appelle à surveiller sa conduite en s’approchant du lieu de culte. « Pas » conserve l’image concrète des pieds tout en étant idiomatique en français.
- source_word: כַּאֲשֶׁר תֵּלֵךְ
  choice: lorsque tu vas
  rationale: La valeur temporelle convient naturellement à l’avertissement donné pour le moment où l’on se rend au culte.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette formulation garde l’expression hébraïque sans préciser de manière interprétative « le Temple ».
- source_word: וְקָרוֹב לִשְׁמֹעַ
  choice: Approche-toi pour écouter
  rationale: La tournure française exprime naturellement l’exhortation implicite dans cette construction hébraïque concise et présente l’écoute attentive comme le but de l’approche.
- source_word: מִתֵּת ... זָבַח
  choice: plutôt que pour offrir le sacrifice
  rationale: Dans ce contexte cultuel, נתן désigne la présentation d’un sacrifice; « plutôt que » rend clairement la comparaison.
- source_word: הַכְּסִילִים
  choice: des insensés
  rationale: Dans la littérature de sagesse, le terme désigne des personnes dépourvues de discernement moral et spirituel, non de simples ignorants.
- source_word: כִּי אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע
  choice: car ils ne savent pas qu’ils font le mal
  rationale: 'La formulation explicite le sens contextuel probable: ces personnes ne discernent pas que leur manière d’offrir un sacrifice constitue un mal. Une note conserve la concision ambiguë de l’hébreu.'
theological_decisions:
- issue: Nature du contraste entre l’écoute et le sacrifice dans le culte
  choice: Le verset donne la priorité à une écoute attentive de Dieu et critique le sacrifice offert sans discernement.
  alternative: Comprendre le verset comme un rejet général de tout sacrifice.
  rationale: Le texte vise précisément « le sacrifice des insensés » et qualifie leur conduite de mauvaise; il ne condamne donc pas nécessairement le sacrifice en lui-même.
- issue: Sens de l’ignorance des insensés dans la dernière proposition
  choice: Ils ne reconnaissent pas que leur propre conduite est mauvaise.
  alternative: Ils ne savent pas comment faire le mal, ou ils pèchent sans savoir ce qu’ils font.
  rationale: Le contexte immédiat rattache vraisemblablement le mal à leur façon irréfléchie d’offrir un sacrifice, mais la syntaxe hébraïque reste condensée; cette tension est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque. « Maison de Dieu » préserve l’image source; « insensés » maintient le registre sapientiel. La ponctuation répartit l’avertissement et l’exhortation en deux phrases pour une lecture naturelle.
