source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: fr
  text: 'Puis je me suis tourné et j’ai vu toutes les oppressions[a] qui se commettent sous le soleil. Et voici les larmes des opprimés : personne pour les consoler. Le pouvoir est entre les mains de leurs oppresseurs[b], et personne pour les consoler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les opprimés qui sont sous le soleil ». Le participe passif hébreu peut désigner soit les personnes opprimées, soit, par extension, les actes ou situations d’oppression.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et de la main de leurs oppresseurs, le pouvoir » ; la construction hébraïque met en relief le pouvoir exercé par les oppresseurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Puis je me suis retourné
  rationale: Dans l’Ecclésiaste, שוב introduit ici une nouvelle observation plutôt qu’un retour physique. Cette formulation conserve l’image concrète et marque naturellement la progression du discours.
- source_word: וָאֶרְאֶה
  choice: et j’ai vu
  rationale: ראה exprime une observation directe; « j’ai vu » en donne le sens simple sans le transformer en réflexion abstraite.
- source_word: כָּל הָעֲשֻׁקִים
  choice: toutes les oppressions
  rationale: La forme hébraïque est un participe passif pouvant désigner les personnes opprimées, mais אֲשֶׁר נַעֲשִׂים (« qui se commettent ») favorise ici le sens étendu d’actes ou de situations d’oppression.
- source_word: אֲשֶׁר נַעֲשִׂים
  choice: qui se commettent
  rationale: Le présent français rend la réalité continue observée, tandis que la tournure pronominale passive est idiomatique avec « oppressions ».
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Cette expression caractéristique de l’Ecclésiaste est conservée littéralement et pourra servir de formule cohérente dans tout le livre.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: הִנֵּה attire vivement l’attention sur le spectacle qui suit; « voici » garde cette force rhétorique dans un français digne et courant.
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: les larmes des opprimés
  rationale: Bien que דִּמְעַת soit morphologiquement au singulier, le pluriel collectif est naturel en français et exprime les pleurs visibles des victimes.
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: personne pour les consoler
  rationale: La construction existentielle affirme l’absence de toute personne qui leur apporte du réconfort. Cette formulation française est concise et conserve la répétition exacte du refrain.
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: Le pouvoir est entre les mains de leurs oppresseurs
  rationale: Cette restructuration idiomatique maintient l’image de la main et souligne le déséquilibre de pouvoir en faveur des oppresseurs.
- source_word: עֹשְׁקֵיהֶם
  choice: leurs oppresseurs
  rationale: Le participe actif désigne ceux qui exploitent ou oppriment; « oppresseurs » est clair et maintient le lien lexical avec « oppressions » et « opprimés ».
- source_word: מְנַחֵם
  choice: pour les consoler
  rationale: Le participe substantivé désigne une personne qui console. La construction « personne pour les consoler » est plus naturelle en français moderne que « aucun consolateur », tout en gardant le sens.
theological_decisions:
- issue: Référent de הָעֲשֻׁקִים dans la première proposition
  choice: « toutes les oppressions » dans le texte principal
  alternative: « tous les opprimés »
  rationale: La forme peut désigner concrètement des personnes opprimées, mais son association avec « qui se commettent sous le soleil » favorise les actes ou situations d’oppression. Le verset passe ainsi des réalités oppressives aux larmes de leurs victimes, sans effacer l’autre lecture possible.
- issue: Temps des propositions existentielles
  choice: 'Présent nominal : « personne pour les consoler »'
  alternative: « ils n’avaient personne pour les consoler »
  rationale: Après le récit de l’observation au passé, la formulation nominale française présente vivement la situation constatée et ne tranche pas inutilement entre un état passé et une réalité générale.
- issue: Nature du pouvoir des oppresseurs
  choice: « Le pouvoir est entre les mains de leurs oppresseurs »
  alternative: « de la main de leurs oppresseurs vient la force »
  rationale: La formulation retenue exprime le rapport de domination indiqué par כֹּחַ et מִיַּד, sans préciser si la force est politique, physique ou sociale.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « personne pour les consoler » reproduit l’insistance du texte. « Et voici » conserve la vivacité rhétorique de l’hébreu sans archaïsme excessif.
