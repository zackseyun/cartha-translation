  text: ט֕וֹב מְלֹ֥א כַ֖ף נָ֑חַת מִ/מְּלֹ֥א חָפְנַ֛יִם עָמָ֖ל וּ/רְע֥וּת רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/006.yaml
  text: Better is a handful with rest than two handfuls with toil and a striving after wind[a][b].
translation:
  language: fr
  text: Mieux vaut une poignée dans le calme[a] que les deux mains pleines de travail pénible et de poursuite du vent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec de la tranquillité ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « et de poursuite du vent »; traduction traditionnelle : « et de tourment de l’esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: L’adjectif évaluatif ouvre une comparaison proverbiale; « Mieux vaut » est la formulation française naturelle et concise.
- source_word: מְלֹא כַף
  choice: une poignée
  rationale: Littéralement « le plein d’une paume/main »; « une poignée » rend naturellement cette mesure en français.
- source_word: נָחַת
  choice: du repos
  rationale: Le nom désigne le calme, la tranquillité ou le repos; « repos » s’oppose clairement au travail pénible sans exclure l’idée de quiétude.
- source_word: מִמְלֹא חָפְנַיִם
  choice: que les deux mains pleines
  rationale: La préposition exprime la comparaison et le duel désigne les deux mains creuses remplies; cette formulation conserve l’image et le contraste avec une seule poignée.
- source_word: עָמָל
  choice: travail pénible
  rationale: Dans l’Ecclésiaste, le terme associe fréquemment le travail à la peine et à la fatigue; « travail pénible » rend ces deux dimensions.
- source_word: וּרְעוּת רוּחַ
  choice: et de poursuite du vent
  rationale: L’expression récurrente évoque une activité vaine dirigée vers le vent; « poursuite du vent » conserve la métaphore et son caractère insaisissable.
