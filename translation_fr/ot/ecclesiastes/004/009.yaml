  text: טוֹבִ֥ים הַ/שְּׁנַ֖יִם מִן הָ/אֶחָ֑ד אֲשֶׁ֧ר יֵשׁ לָ/הֶ֛ם שָׂכָ֥ר ט֖וֹב בַּ/עֲמָלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/009.yaml
  text: Two are better than one[a], because they have a good reward for their labor.
translation:
  language: fr
  text: Deux valent mieux qu’un, car ils retirent un bon profit de leur travail.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹבִים הַשְּׁנַיִם מִן הָאֶחָד
  choice: Deux valent mieux qu’un
  rationale: Le prédicat טוֹבִים suivi de מִן forme une comparaison. « valent mieux » exprime naturellement en français la supériorité du groupe de deux sur une personne seule, sans faire de l’article hébreu une désignation particulière.
- source_word: אֲשֶׁר
  choice: car
  rationale: La proposition introduit la raison de l’affirmation précédente ; « car » conserve le lien explicatif dans un registre proverbial et digne.
- source_word: יֵשׁ לָהֶם
  choice: ils retirent
  rationale: La construction existentielle avec ל indique ici qu’un bénéfice leur revient. Avec « profit », « retirent » rend cette relation idiomatiquement.
- source_word: שָׂכָר טוֹב
  choice: un bon profit
  rationale: שָׂכָר désigne la rémunération, la récompense ou le bénéfice obtenu. « bon profit » convient au contexte du travail partagé sans limiter le sens à un salaire monétaire.
- source_word: בַּעֲמָלָם
  choice: de leur travail
  rationale: עָמָל désigne fréquemment dans l’Ecclésiaste le travail pénible ou l’effort. Ici, « travail » est clair et naturel ; la préposition ב marque la source ou le cadre du profit, rendue par « de ».
