translation_notes:
  register: Formulation proverbiale, concise et naturelle en français international moderne. « Deux » reste générique, et « valent mieux qu’un » évite une traduction artificiellement littérale. Aucun marqueur de note n’est nécessaire puisque le texte principal conserve la portée économique et générale de שָׂכָר.
