  text: כִּ֣י אִם יִפֹּ֔לוּ הָ/אֶחָ֖ד יָקִ֣ים אֶת חֲבֵר֑/וֹ וְ/אִ֣י/ל֗/וֹ הָֽ/אֶחָד֙ שֶׁ/יִּפּ֔וֹל וְ/אֵ֥ין שֵׁנִ֖י לַ/הֲקִימֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: fr
  text: Car s’ils tombent, l’un relève son compagnon ; mais malheur à celui qui tombe sans avoir un second pour le relever !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Introduit une condition qui explique l’affirmation précédente sur l’avantage d’être deux.
- source_word: יִפֹּלוּ
  choice: ils tombent
  rationale: Conserve l’image concrète de la chute et le lien verbal avec le singulier qui suit.
- source_word: הָאֶחָד
  choice: l’un
  rationale: Expression française naturelle dans le contexte explicite de deux personnes.
- source_word: יָקִים
  choice: relève
  rationale: Le hiphil de קום signifie faire se lever ; « relever » exprime clairement et sobrement l’action.
- source_word: אֶת חֲבֵרוֹ
  choice: son compagnon
  rationale: חבר désigne ici l’associé ou le compagnon, sans impliquer nécessairement l’intimité affective d’un ami.
- source_word: וְאִילוֹ
  choice: mais malheur à
  rationale: Rend la lamentation ou l’avertissement vigoureux de l’interjection hébraïque.
- source_word: הָאֶחָד שֶׁיִּפּוֹל
  choice: celui qui tombe
  rationale: Désigne naturellement en français la personne seule, par contraste avec les deux personnes du début.
- source_word: וְאֵין שֵׁנִי
  choice: sans avoir un second
  rationale: Préserve le contraste numérique central, tout en exprimant naturellement la circonstance en français.
- source_word: לַהֲקִימוֹ
  choice: pour le relever
  rationale: Reprend le même verbe français que dans la première proposition et conserve ainsi la répétition hébraïque.
