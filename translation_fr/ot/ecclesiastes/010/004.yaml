  naturalness: '« Si la colère du dirigeant s’élève contre toi » est compréhensible et conserve volontairement l''image du texte. En revanche, « le calme fait retomber de graves offenses » n''est pas idiomatique : en français, ce sont plutôt la colère, la tension ou l''agitation qui retombent. « Le calme prévient de graves fautes » est à la fois proverbial et naturel.'
