  register: Français international moderne, sobre et proverbial. Le tutoiement conserve l’adresse directe du singulier hébreu. La formulation garde les images de la colère qui « s’élève » et que le calme « fait retomber », tout en maintenant dans les notes les principales ambiguïtés lexicales.
