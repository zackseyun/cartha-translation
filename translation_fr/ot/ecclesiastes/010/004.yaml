  text: אִם ר֤וּחַ הַ/מּוֹשֵׁל֙ תַּעֲלֶ֣ה עָלֶ֔י/ךָ מְקוֹמְ/ךָ֖ אַל תַּנַּ֑ח כִּ֣י מַרְפֵּ֔א יַנִּ֖יחַ חֲטָאִ֥ים גְּדוֹלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
translation:
  language: fr
  text: Si la colère du dirigeant s’élève contre toi[a], ne quitte pas ta place[b], car le calme[c] prévient de graves fautes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit du dirigeant » ou « l’humeur du dirigeant ». Le mot hébreu רוּחַ signifie littéralement « esprit », « souffle » ou « vent » et désigne probablement ici un mouvement de colère.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ta place » ; l’expression peut aussi évoquer le poste ou la fonction occupés.
    reason: lexical_alternative
  - marker: c
    text: Ou « ce qui apaise », « la douceur » ou « un remède ». Le nom hébreu מַרְפֵּא évoque une action apaisante ou curative.
    reason: lexical_alternative
  - marker: d
    text: Ou « de graves offenses » ou « de grands péchés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: colère
  rationale: Le mot signifie littéralement « souffle », « vent » ou « esprit », mais, dans cette construction où il « s’élève contre » quelqu’un, il désigne probablement l’emportement ou la colère du dirigeant.
- source_word: הַמּוֹשֵׁל
  choice: le dirigeant
  rationale: Le participe désigne celui qui gouverne ou exerce l’autorité. « Dirigeant » est naturel en français moderne et reste assez général.
- source_word: תַּעֲלֶה עָלֶיךָ
  choice: s’élève contre toi
  rationale: Cette traduction conserve l’image hébraïque de quelque chose qui monte tout en exprimant son orientation hostile envers l’interlocuteur.
- source_word: מְקוֹמְךָ
  choice: ta place
  rationale: Traduction directe qui préserve l’ambiguïté entre le lieu occupé et la fonction ou le poste auprès du dirigeant.
- source_word: אַל תַּנַּח
  choice: ne quitte pas
  rationale: Dans ce contexte, le verbe exprime l’idée de laisser ou d’abandonner sa place. « Ne quitte pas » est clair et idiomatique.
- source_word: מַרְפֵּא
  choice: le calme
  rationale: Le nom évoque ce qui soigne, apaise ou adoucit. Ici, « le calme » désigne naturellement une réaction posée qui désamorce la tension.
- source_word: יַנִּיחַ
  choice: fait retomber
  rationale: La forme causative signifie faire reposer, laisser en repos ou faire cesser. « Fait retomber » reprend l’image initiale de la colère qui s’élève et exprime l’apaisement sans préciser excessivement son mécanisme.
- source_word: חֲטָאִים גְּדוֹלִים
  choice: de graves offenses
  rationale: Le groupe peut désigner de grands péchés, de graves fautes ou des offenses sérieuses. « Graves offenses » convient au contexte relationnel et politique tout en gardant une portée morale.
