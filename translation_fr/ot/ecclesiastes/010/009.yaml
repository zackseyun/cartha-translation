source:
  edition: WLC
  text: מַסִּ֣יעַ אֲבָנִ֔ים יֵעָצֵ֖ב בָּ/הֶ֑ם בּוֹקֵ֥עַ עֵצִ֖ים יִסָּ֥כֶן בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/009.yaml
  text: Whoever quarries stones may be hurt by them, and whoever splits logs may be endangered by them.
translation:
  language: fr
  text: Celui qui déplace des pierres risque de se blesser avec elles, et celui qui fend du bois risque de se mettre en danger en le fendant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: celui qui extrait des pierres
  rationale: Le participe מַסִּיעַ désigne ici vraisemblablement l’action de déplacer ou d’arracher des pierres; «extraire» convient au contexte d’un travail de carrière sans préciser excessivement la technique.
- source_word: יֵעָצֵב בָּהֶם
  choice: peut se blesser avec elles
  rationale: Le verbe עצב exprime ici le fait de subir douleur ou blessure. La modalité «peut» rend la valeur générale de l’imparfait dans cette maxime.
- source_word: בּוֹקֵעַ עֵצִים
  choice: celui qui fend du bois
  rationale: בקע signifie «fendre» et עֵצִים peut désigner du bois ou des morceaux de bois; le collectif français «du bois» reste naturel et ne force pas «bûches».
- source_word: יִסָּכֶן בָּם
  choice: s’expose au danger
  rationale: La forme rare peut exprimer le fait d’être en danger ou de se mettre en danger. Cette formulation française conserve le sens probable sans introduire un type précis d’accident.
theological_decisions: []
translation_notes:
  register: Maxime concise en français moderne, courant et digne. Le parallélisme des deux activités risquées est préservé, ainsi que la prudence modale du propos.
