  text: גַּ֣ם בְּ/מַדָּֽעֲ/ךָ֗ מֶ֚לֶךְ אַל תְּקַלֵּ֔ל וּ/בְ/חַדְרֵי֙ מִשְׁכָּ֣בְ/ךָ֔ אַל תְּקַלֵּ֖ל עָשִׁ֑יר כִּ֣י ע֤וֹף הַ/שָּׁמַ֨יִם֙ יוֹלִ֣יךְ אֶת הַ/קּ֔וֹל וּ/בַ֥עַל ה/כנפים יַגֵּ֥יד דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: fr
  text: Même dans tes pensées[a], ne maudis pas un roi, et même dans ta chambre[b], ne maudis pas un riche, car un oiseau du ciel[c] pourrait emporter le son, et une créature ailée pourrait rapporter l’affaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ton esprit ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans les chambres de ton lit », c’est-à-dire dans l’intimité de ta chambre.
    reason: cultural_note
  - marker: c
    text: Littéralement « un oiseau des cieux »; cette image rappelle l’idée exprimée en français par « mon petit doigt me l’a dit ».
    reason: cultural_note
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: dans tes pensées
  rationale: מַדָּע peut désigner la connaissance ou la pensée. Dans cet avertissement, il s’agit de la réflexion intérieure; « dans tes pensées » exprime naturellement ce cadre intime sans réduire le terme à la connaissance abstraite.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: L’hébreu est sans article; « un roi » conserve la portée générale du proverbe.
- source_word: תְּקַלֵּל
  choice: maudis
  rationale: Le piel de קלל signifie couramment « maudire » ou traiter avec mépris. « Maudis » est direct et maintient le parallélisme des deux interdictions.
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: jusque dans ta chambre
  rationale: Littéralement « dans les chambres de ton lit ». « Dans ta chambre » rend en français moderne le lieu le plus privé; « jusque » souligne naturellement que l’interdiction vaut même là.
- source_word: עָשִׁיר
  choice: un riche
  rationale: L’adjectif masculin singulier est substantivé. « Un riche » est concis, naturel et parallèle à « un roi ».
- source_word: עוֹף הַשָּׁמַיִם
  choice: un oiseau du ciel
  rationale: Cette formulation reste proche de l’image hébraïque tout en étant idiomatique en français.
- source_word: יוֹלִיךְ אֶת־הַקּוֹל
  choice: pourrait emporter le son de ta voix
  rationale: קוֹל signifie « voix » ou « son ». La formulation conserve l’image concrète du son transporté, tandis que le conditionnel traduit la valeur d’avertissement proverbial.
- source_word: בַעַל הַכְּנָפַיִם
  choice: une créature ailée
  rationale: Littéralement « possesseur d’ailes »; « une créature ailée » restitue clairement l’expression idiomatique sans l’identifier plus précisément que le texte.
- source_word: יַגֵּיד דָּבָר
  choice: pourrait rapporter l’affaire
  rationale: נגד signifie annoncer ou rapporter, et דָבָר désigne ici la chose dite, donc « l’affaire ». Le conditionnel convient à la mise en garde.
theological_decisions: []
translation_notes:
  register: Français international moderne, au tutoiement singulier conformément aux formes hébraïques. Style proverbial, clair et digne. Le conditionnel « pourrait » rend la portée de mise en garde des imparfaits hébreux sans présenter le résultat comme mécaniquement certain.
