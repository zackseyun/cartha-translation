revisions:
- from: Même dans tes pensées[a], ne maudis pas un roi, et jusque dans ta chambre[b], ne maudis pas un riche, car un oiseau du ciel[c] pourrait emporter le son de ta voix, et une créature ailée pourrait rapporter l’affaire.
  to: Même dans tes pensées[a], ne maudis pas un roi, et même dans ta chambre[b], ne maudis pas un riche, car un oiseau du ciel[c] pourrait emporter le son, et une créature ailée pourrait rapporter l’affaire.
  rationale: La révision supprime l’ajout non exprimé « ta voix » afin de préserver l’ambiguïté et l’image de קוֹל, tout en maintenant le conditionnel proverbial. Elle remplace aussi « jusque » par « même » pour refléter plus directement l’emphase répétée du texte hébreu. Les ancres et les notes restent correctement associées aux éléments qu’elles expliquent.
