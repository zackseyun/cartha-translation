id: ECC.10.1
reference: Ecclesiastes 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: fr
  text: Des mouches mortes font puer et bouillonner l’huile du parfumeur[a] ; un peu de folie pèse plus lourd que la sagesse et l’honneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fermenter », « produire des bulles » ou, plus généralement, « gâter ». Le verbe hébreu suggère une émission ou un bouillonnement actif de l’huile altérée.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « a plus de valeur que ». L’hébreu peut exprimer une comparaison de valeur : « un peu de folie a plus de poids ou d’importance que la sagesse et l’honneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: des mouches mortes
  rationale: Le groupe construit signifie littéralement « mouches de mort ». Dans cette image de contamination d’une huile parfumée, « mouches mortes » est l’expression française la plus naturelle, tout en conservant le lien avec la mort et la décomposition.
- source_word: יַבְאִישׁ
  choice: font puer
  rationale: Le hifil de באש exprime le fait de rendre malodorant. « Font puer » restitue clairement et vivement cette valeur causative.
- source_word: יַבִּיעַ
  choice: bouillonner
  rationale: Le verbe évoque ce qui jaillit, émet ou produit des bulles. « Bouillonner » garde l’image concrète d’une huile activement altérée, sans réduire le sens au seul processus de fermentation.
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: l’huile du parfumeur
  rationale: Expression naturelle qui conserve à la fois l’huile et le métier de celui qui compose des parfums, sans employer un terme archaïque comme « apothicaire ».
- source_word: יָקָר
  choice: pèse plus lourd
  rationale: יָקָר signifie couramment « précieux, de valeur », mais peut ici exprimer un poids ou une importance comparative. « Pèse plus lourd » rend bien l’effet disproportionné d’un peu de folie et préserve la métaphore évaluative.
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: que la sagesse et l’honneur
  rationale: Les deux groupes prépositionnels sont compris ensemble comme les réalités dépassées en poids ou en importance. Dans ce contexte humain et social, כָּבוֹד se rend naturellement par « honneur ».
- source_word: סִכְלוּת מְעָט
  choice: un peu de folie
  rationale: 'Traduction idiomatique et directe du nom suivi de l’adjectif, qui maintient le paradoxe : une petite quantité de folie peut avoir un effet considérable.'
theological_decisions: []
translation_notes:
  register: Français international moderne, concret et proverbial. La formulation conserve le parallélisme, l’image sensorielle de l’huile corrompue et l’ambiguïté de יָקָר entre valeur et poids, explicitée en note.
