  text: בַּ/עֲצַלְתַּ֖יִם יִמַּ֣ךְ הַ/מְּקָרֶ֑ה וּ/בְ/שִׁפְל֥וּת יָדַ֖יִם יִדְלֹ֥ף הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/018.yaml
  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
translation:
  language: fr
  text: Par la paresse, la toiture s’affaisse[a] ; par le relâchement des mains[b], la maison prend l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le toit s’abaisse » ; le terme hébreu rendu par « toiture » peut désigner la structure du toit, notamment les poutres ou les chevrons.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par l’abaissement des mains », image du relâchement et de la négligence.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  choice: À force de paresse
  rationale: La préposition בְּ exprime ici la cause ou le moyen. « À force de paresse » rend naturellement en français l’idée d’une négligence persistante qui entraîne la dégradation.
- source_word: יִמַּךְ
  choice: s’affaisse
  rationale: Le niphal de מוך indique le fait de s’abaisser, de s’enfoncer ou de céder. Pour une toiture qui se détériore progressivement, « s’affaisse » est précis sans suggérer un effondrement total.
- source_word: הַמְּקָרֶה
  choice: la toiture
  rationale: מְקָרֶה désigne ce qui couvre l’édifice, éventuellement sa charpente. « La toiture » exprime clairement l’ensemble structurel concerné tout en évitant la précision incertaine de « chevrons ».
- source_word: וּבְשִׁפְלוּת יָדַיִם
  choice: quand les mains restent inactives
  rationale: L’expression signifie littéralement « dans l’abaissement des mains » et évoque le relâchement ou la négligence. La formulation française conserve l’image des mains tout en en faisant comprendre le sens idiomatique.
- source_word: יִדְלֹף
  choice: prend l’eau
  rationale: דלף signifie couler goutte à goutte ou fuir. Avec « la maison » pour sujet, l’expression française « prend l’eau » décrit naturellement l’infiltration causée par le défaut d’entretien.
- source_word: הַבָּיִת
  choice: la maison
  rationale: « Maison » est le sens courant de בַּיִת et préserve l’image concrète du proverbe.
