  text: חֹפֵ֥ר גּוּמָּ֖ץ בּ֣/וֹ יִפּ֑וֹל וּ/פֹרֵ֥ץ גָּדֵ֖ר יִשְּׁכֶ֥/נּוּ נָחָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: fr
  text: Qui creuse une fosse y tombera, et celui qui ouvre une brèche dans un mur[a], un serpent le mordra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « mur » peut aussi désigner une clôture, probablement un mur de pierres délimitant une propriété dans le contexte ancien.
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר גּוּמָּץ
  choice: Qui creuse une fosse
  rationale: Le participe qal a ici une valeur générale et proverbiale. « Qui creuse » est naturel en français et « fosse » rend le trou creusé, éventuellement conçu comme un piège.
- source_word: בּוֹ יִפּוֹל
  choice: y tombera
  rationale: Le pronom adverbial « y » reprend naturellement « une fosse », tandis que le futur exprime bien la conséquence générale formulée par le proverbe.
- source_word: וּפֹרֵץ גָּדֵר
  choice: et celui qui ouvre une brèche dans un mur
  rationale: פרץ évoque l'action de rompre une clôture ou d'y pratiquer une ouverture. « Ouvrir une brèche » restitue cette image sans supposer que tout le mur est détruit.
- source_word: יִשְּׁכֶנּוּ נָחָשׁ
  choice: un serpent le mordra
  rationale: נשך signifie « mordre » et son suffixe renvoie à celui qui ouvre la brèche. Le maintien de « un serpent » comme sujet après le verbe respecte la progression de l'hébreu et conserve une formulation active.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. La reprise disloquée « celui qui…, un serpent le mordra » conserve l'ordre et l'effet de la proposition hébraïque tout en restant intelligible. Le verset ne précise pas si les deux conséquences relèvent d'un accident, d'une rétribution ou des risques inhérents à l'action; cette ouverture est préservée.
