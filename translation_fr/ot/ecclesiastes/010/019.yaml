  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: fr
  text: On prépare un repas[a] pour les réjouissances, le vin réjouit la vie, et l’argent répond à tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du pain » ; le mot peut aussi désigner la nourriture ou un repas.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « l’argent répond à tout » ; on pourrait aussi comprendre : « l’argent apporte une réponse à tout ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: pour les réjouissances
  rationale: La préposition ל exprime ici le but, et שְׂחוֹק désigne le rire ou la gaieté. « Pour les réjouissances » conserve l’idée festive dans un français naturel sans préciser davantage la nature de la scène.
- source_word: עֹשִׂים לֶחֶם
  choice: on prépare un repas
  rationale: Le pluriel sans sujet exprimé se rend naturellement par le pronom indéfini « on ». לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture ou un repas dans ce contexte.
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: le vin réjouit la vie
  rationale: Le piel de שׂמח signifie « réjouir, rendre joyeux ». חַיִּים peut désigner la vie ou les vivants ; « la vie » préserve ici la formulation générale et proverbiale.
- source_word: וְהַכֶּסֶף
  choice: et l’argent
  rationale: כֶּסֶף peut signifier « argent » au sens du métal ou de la monnaie. Le sens économique convient au contexte et est immédiatement compréhensible.
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: répond à tout
  rationale: ענה signifie normalement « répondre ». Cette traduction conserve l’expression hébraïque concise et sa force potentiellement ironique, sans la paraphraser comme « satisfait tous les besoins ».
theological_decisions:
- issue: Portée et ton de l’affirmation finale
  choice: 'Présenter directement l’observation : « l’argent répond à tout »'
  alternative: Expliciter une ironie (« on croit que l’argent résout tout ») ou atténuer la portée (« l’argent répond à bien des besoins »)
  rationale: L’hébreu ne marque grammaticalement ni l’ironie ni une restriction. La formulation directe maintient la tension du texte et laisse le contexte littéraire de l’Ecclésiaste guider l’interprétation.
translation_notes:
  register: Français international moderne, proverbial et concis. « On prépare » rend naturellement le sujet indéfini pluriel ; « repas » explicite la valeur contextuelle de « pain », signalée en note. La dernière proposition demeure volontairement abrupte afin de préserver l’ambiguïté et la tension du texte.
