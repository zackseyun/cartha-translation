  text: עֲמַ֥ל הַ/כְּסִילִ֖ים תְּיַגְּעֶ֑/נּוּ אֲשֶׁ֥ר לֹֽא יָדַ֖ע לָ/לֶ֥כֶת אֶל עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: fr
  text: Le labeur des insensés épuise celui[a] qui ne sait pas comment se rendre dans une ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Le labeur des insensés les épuise, car ils ne savent pas comment se rendre dans une ville. » L’hébreu a un objet masculin singulier (« l’épuise »), qui peut désigner chaque insensé individuellement ; le contexte permet aussi une compréhension collective au pluriel.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  choice: labeur
  rationale: Le nom désigne un travail pénible, une peine laborieuse. « Labeur » conserve l’idée d’effort éprouvant sans la réduire au simple « travail » ni l’interpréter seulement comme un « malheur ».
- source_word: הַכְּסִילִים
  choice: insensés
  rationale: Dans la littérature de sagesse, כְּסִיל désigne une catégorie à la fois morale et intellectuelle. « Insensés » rend cette portée sans suggérer uniquement un manque d’intelligence.
- source_word: תְּיַגְּעֶנּוּ
  choice: épuise celui
  rationale: Le verbe au féminin singulier s’accorde avec עֲמַל, et le suffixe objet est masculin singulier. « Épuise celui » respecte cette construction tout en préparant naturellement la proposition relative.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: qui ne sait pas
  rationale: La relative se rattache le plus directement à l’objet masculin singulier. Dans cette maxime, l’accompli hébreu exprime naturellement un trait caractéristique rendu au présent en français.
- source_word: לָלֶכֶת
  choice: comment aller
  rationale: Avec ידע et l’infinitif, le sens est « savoir comment aller ». Cette formulation française reste proche de l’hébreu et demeure naturelle.
- source_word: אֶל עִיר
  choice: à la ville
  rationale: עִיר n’a pas d’article en hébreu et garde une portée proverbiale. En français, « aller à une ville » serait peu idiomatique ; « aller à la ville » exprime naturellement la destination générique sans identifier une ville particulière.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. « Labeur » maintient la densité sapientielle du verset ; « à la ville » est idiomatique en français tout en conservant la portée générique de l’hébreu.
