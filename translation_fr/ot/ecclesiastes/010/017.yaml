  text: אַשְׁרֵ֣י/ךְ אֶ֔רֶץ שֶׁ/מַּלְכֵּ֖/ךְ בֶּן חוֹרִ֑ים וְ/שָׂרַ֨יִ/ךְ֙ בָּ/עֵ֣ת יֹאכֵ֔לוּ בִּ/גְבוּרָ֖ה וְ/לֹ֥א בַ/שְּׁתִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: fr
  text: Heureux es-tu, pays[a], quand ton roi est de noble naissance[b] et que tes princes mangent au moment voulu, pour se fortifier et non pour boire[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel bonheur pour toi, pays ». L’hébreu peut exprimer le bonheur, la félicité ou une condition enviable.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « est fils de nobles ». Le terme peut aussi évoquer des hommes libres.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « pour la force et non pour boire ». Le contraste vise le repas pris pour la vigueur plutôt que pour la boisson; dans ce contexte, cela peut évoquer l’excès.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: Heureux es-tu
  rationale: L’expression introduit un état enviable de bonheur ou de prospérité. « Heureux es-tu » conserve la forme sapientielle sans suggérer nécessairement une bénédiction divine explicite.
- source_word: אֶרֶץ
  choice: pays
  rationale: Dans ce contexte politique, אֶרֶץ désigne le territoire gouverné. « Pays » est plus naturel en français moderne que l’apostrophe « ô terre », tout en conservant l’adresse directe.
- source_word: שֶׁמַּלְכֵּךְ בֶּן חוֹרִים
  choice: quand ton roi est de noble naissance
  rationale: Le littéral « fils de nobles » évoque ici l’origine libre ou noble du roi, en contraste avec le serviteur du verset précédent. La formulation retenue est naturelle et préserve ce sens social.
- source_word: וְשָׂרַיִךְ
  choice: et que tes princes
  rationale: שָׂרִים désigne les hauts dirigeants de la cour. « Princes » maintient le cadre royal et politique.
- source_word: בָּעֵת
  choice: au moment voulu
  rationale: L’expression indique le moment approprié, par contraste avec les repas pris dès le matin au verset précédent.
- source_word: יֹאכֵלוּ
  choice: mangent
  rationale: Le verbe signifie simplement « manger ». Le contexte de banquet ne nécessite pas de le renforcer en « festoyer ».
- source_word: בִּגְבוּרָה
  choice: pour reprendre des forces
  rationale: 'גְּבוּרָה exprime la force ou la vigueur. Dans ce contexte, la préposition peut indiquer le but : manger en vue d’avoir des forces plutôt que de se livrer à l’excès.'
- source_word: וְלֹא בַשְּׁתִי
  choice: et non pour s’enivrer
  rationale: שְׁתִי désigne littéralement le fait de boire, mais le contraste vise vraisemblablement la consommation excessive. « S’enivrer » rend clairement l’opposition sans condamner toute boisson.
