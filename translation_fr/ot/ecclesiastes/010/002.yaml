id: ECC.10.2
reference: Ecclesiastes 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֤ב חָכָם֙ לִֽ/ימִינ֔/וֹ וְ/לֵ֥ב כְּסִ֖יל לִ/שְׂמֹאלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: fr
  text: Le cœur du sage est à sa droite[a], mais le cœur de l’insensé est à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se porte vers sa droite […] vers sa gauche ». En hébreu, la droite et la gauche servent ici d’orientations symboliques, évoquant vraisemblablement le bon discernement et le mauvais jugement.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Le terme désigne ici la personne intérieure, notamment la pensée et les dispositions. « Cœur » conserve l’image hébraïque sans la réduire au seul intellect.
- source_word: חָכָם
  choice: sage
  rationale: L’adjectif masculin singulier est employé comme substantif. « Le sage » rend naturellement en français la figure représentative du dicton.
- source_word: לִימִינוֹ
  choice: à sa droite
  rationale: La préposition לְ avec « droite » indique ici un côté ou une orientation. Cette formulation préserve le contraste symbolique sans en expliciter excessivement le sens.
- source_word: כְּסִיל
  choice: insensé
  rationale: Dans la littérature de sagesse, כְּסִיל désigne celui qui manque de discernement, avec une dimension morale autant qu’intellectuelle. « Insensé » convient au registre biblique tout en restant compréhensible.
- source_word: לִשְׂמֹאלוֹ
  choice: à sa gauche
  rationale: Cette traduction maintient le parallélisme spatial avec « à sa droite » et conserve la métaphore hébraïque.
theological_decisions:
- issue: Adjectifs substantivés masculins dans un contraste sapientiel
  choice: Employer « le sage » et « l’insensé » au masculin singulier.
  alternative: Employer des formulations épicènes telles que « la personne sage » et « la personne insensée ».
  rationale: L’hébreu présente deux figures représentatives au masculin singulier. Le français permet de conserver cette forme de manière naturelle sans ajouter une restriction explicite aux seuls hommes.
- issue: Valeur symbolique de la droite et de la gauche
  choice: Conserver l’image spatiale sans expliquer dans le corps du verset ce qu’elle symbolise.
  alternative: Paraphraser en termes de bon et de mauvais jugement.
  rationale: Le texte laisse à l’image sa force et une part d’ambiguïté. Une explicitation dans le verset réduirait la tension poétique et interprétative.
translation_notes:
  register: Français moderne, sobre et proverbial. La répétition de « le cœur » et de « est » conserve le parallélisme hébreu et rend la phrase immédiatement claire. « Insensé » évite le ton insultant ou trop familier de « idiot » tout en gardant la portée morale et intellectuelle du terme sapientiel.
