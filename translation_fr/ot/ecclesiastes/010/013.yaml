  text: תְּחִלַּ֥ת דִּבְרֵי פִ֖י/הוּ סִכְל֑וּת וְ/אַחֲרִ֣ית פִּ֔י/הוּ הוֹלֵל֖וּת רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/013.yaml
  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: fr
  text: Le début des paroles de sa bouche est folie, et la fin de son discours est une démence malfaisante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une démence nuisible ». Littéralement, l’hébreu répète « sa bouche » ; רָעָה peut signifier « mauvaise » ou, plus largement, « nuisible ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת
  choice: Le début de
  rationale: Rend naturellement le nom construit « commencement de » et maintient le parallèle avec « la fin ».
- source_word: דִּבְרֵי
  choice: des paroles
  rationale: Dans ce contexte, le pluriel désigne les paroles prononcées plutôt que des affaires ou des choses.
- source_word: פִיהוּ
  choice: qui sortent de sa bouche
  rationale: Conserve l’image concrète de la bouche tout en donnant en français une formulation idiomatique.
- source_word: סִכְלוּת
  choice: folie
  rationale: Terme clair et digne qui exprime le manque de sagesse et correspond au contraste récurrent de Qohélet.
- source_word: וְאַחֲרִית
  choice: et la fin de
  rationale: Préserve le parallélisme entre le commencement et la fin.
- source_word: פִיהוּ
  choice: de son discours
  rationale: Rend idiomatiquement la seconde occurrence littérale de « sa bouche », où le sens est celui de ce qu’il dit.
- source_word: הוֹלֵלוּת
  choice: démence
  rationale: Marque une intensification par rapport à « folie » et rend la dimension d’irrationalité du terme.
- source_word: רָעָה
  choice: mauvaise
  rationale: Conserve la portée négative et potentiellement morale de l’adjectif, sans exclure l’idée de nocivité.
