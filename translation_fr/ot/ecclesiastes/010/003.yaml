reference: Ecclesiastes 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם בַּ/דֶּ֛רֶךְ כ/ש/ה/סכל הֹלֵ֖ךְ לִבּ֣/וֹ חָסֵ֑ר וְ/אָמַ֥ר לַ/כֹּ֖ל סָכָ֥ל הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: fr
  text: Même sur la route, quand l’insensé marche, son cœur manque de discernement, et il dit à tous qu’il est un insensé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il dit à tous : “C’est un insensé.” » L’hébreu peut signifier soit que l’insensé révèle sa propre folie, soit qu’il traite les autres d’insensés.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: 'Rend l’idée d’ajout avec une légère insistance : la folie se manifeste jusque dans une situation ordinaire et publique.'
- source_word: בַּדֶּרֶךְ
  choice: sur la route
  rationale: Conserve l’image spatiale concrète et se lit naturellement en français moderne.
- source_word: כשהסכל הֹלֵךְ
  choice: quand l’insensé marche
  rationale: La construction כ + ש a ici une valeur temporelle, tandis que « marche » maintient le lien avec la route.
- source_word: לִבּוֹ חָסֵר
  choice: son cœur manque de discernement
  rationale: Préserve l’image hébraïque du cœur comme siège du jugement tout en explicitant naturellement ce qui lui fait défaut.
- source_word: וְאָמַר לַכֹּל
  choice: et il dit à tous
  rationale: Suit la formulation simple de l’hébreu et conserve la dimension publique de ses paroles.
- source_word: סָכָל הוּא
  choice: qu’il est insensé
  rationale: 'Comprend le pronom comme renvoyant au sujet : par ses paroles, l’insensé révèle sa propre folie. Le nom hébreu est rendu par le même terme que plus haut sous forme adjectivale, naturelle après « il est ».'
theological_decisions:
- issue: Référent de הוּא dans סָכָל הוּא
  choice: L’insensé fait savoir à tous qu’il est lui-même insensé.
  alternative: 'Il dit à tous, à propos d’autrui : « C’est un insensé. »'
  rationale: Le contexte favorise l’idée d’une folie qui se dévoile elle-même, mais la syntaxe hébraïque permet aussi de comprendre que l’insensé traite les autres d’insensés; l’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. « Insensé » convient au registre sapientiel sans être familier; « son cœur manque de discernement » conserve l’anthropologie imagée de l’hébreu tout en restant compréhensible.
