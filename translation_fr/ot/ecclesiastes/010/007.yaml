  text: רָאִ֥יתִי עֲבָדִ֖ים עַל סוּסִ֑ים וְ/שָׂרִ֛ים הֹלְכִ֥ים כַּ/עֲבָדִ֖ים עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/007.yaml
  text: I have seen servants on horses[c][b][a], and princes walking on the ground like servants.
translation:
  language: fr
  text: J’ai vu des esclaves à cheval, et des princes marcher à pied comme des esclaves.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le parfait qal à la première personne exprime ici une observation personnelle. Le passé composé est naturel en français moderne et peut conserver la portée actuelle de ce constat.
- source_word: עֲבָדִים
  choice: des esclaves
  rationale: Dans ce renversement manifeste des rangs sociaux, « esclaves » rend plus nettement que « serviteurs » le statut inférieur et dépendant évoqué par עֶבֶד.
- source_word: עַל סוּסִים
  choice: à cheval
  rationale: Cette tournure française naturelle exprime fidèlement la situation de personnes montées sur des chevaux, signe de rang privilégié dans le contraste du verset.
- source_word: שָׂרִים
  choice: des princes
  rationale: שָׂרִים désigne des personnages de haut rang ou d’autorité. « Princes » maintient le contraste social marqué sans réduire le terme à une fonction administrative précise.
- source_word: הֹלְכִים
  choice: marcher
  rationale: Le participe décrit l’action observée; après « j’ai vu », l’infinitif est la construction française la plus naturelle et conserve l’image concrète de la marche.
- source_word: כַּעֲבָדִים
  choice: comme des esclaves
  rationale: Le כ comparatif établit une comparaison de condition ou d’apparence sans identifier les princes à des esclaves.
- source_word: עַל הָאָרֶץ
  choice: à terre
  rationale: Littéralement « sur la terre/le sol ». Dans le contexte, « à terre » conserve l’image concrète et contraste directement avec « à cheval », sans expliciter davantage par « à pied ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme et le renversement social du texte hébreu. « À cheval » est plus idiomatique que le littéral « sur des chevaux », tandis que « à terre » maintient le contraste spatial sans surinterprétation.
