  text: דִּבְרֵ֥י פִי חָכָ֖ם חֵ֑ן וְ/שִׂפְת֥וֹת כְּסִ֖יל תְּבַלְּעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/012.yaml
  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
translation:
  language: fr
  text: Les paroles qui sortent de la bouche d’un sage sont pleines de grâce[a], mais les lèvres d’un insensé l’engloutissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « attirent la faveur », si חֵן est compris plus concrètement au sens de « faveur » ou de « grâce ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: Les paroles qui sortent de la bouche d’un sage
  rationale: Cette formulation conserve l’image concrète de la bouche et exprime naturellement en français la relation du construit hébreu.
- source_word: חֵן
  choice: sont pleines de grâce
  rationale: Le nom prédicatif peut désigner la grâce, le charme ou la faveur. « Pleines de grâce » reste naturel tout en conservant la portée sémantique du nom hébreu.
- source_word: שִׂפְתוֹת כְּסִיל
  choice: les lèvres d’un insensé
  rationale: « Lèvres » préserve le parallélisme poétique avec « bouche » ; « insensé » correspond au terme classique de la littérature sapientielle, qui vise une folie morale autant qu’intellectuelle.
- source_word: תְּבַלְּעֶנּוּ
  choice: l’engloutissent
  rationale: 'Le verbe בלע évoque l’action d’avaler ou d’engloutir. Le pronom renvoie à l’insensé : sa propre parole cause sa perte.'
