id: ECC.10.14
reference: Ecclesiastes 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/סָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא יֵדַ֤ע הָ/אָדָם֙ מַה שֶׁ/יִּֽהְיֶ֔ה וַ/אֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽ/אַחֲרָ֔י/ו מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: fr
  text: Et l’insensé multiplie les paroles. L’être humain[a] ne sait pas ce qui arrivera, et qui peut lui dire ce qui arrivera après lui[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le singulier הָאָדָם, qui représente l’humanité en général. On pourrait aussi traduire : « l’homme » ou « personne ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce qui se produira après lui » ou « ce qui arrivera après sa disparition ». L’hébreu peut désigner ce qui vient plus tard, notamment après la vie d’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: Et l’insensé
  rationale: Le nom défini singulier désigne « l’insensé ». La conjonction וְ est rendue par « Et » afin de conserver l’enchaînement du discours, sans imposer une opposition que l’hébreu ne marque pas explicitement.
- source_word: יַרְבֶּה דְבָרִים
  choice: multiplie les paroles
  rationale: Le hiphil de רבה avec דְבָרִים exprime l’abondance de paroles. Cette formulation conserve l’image hébraïque tout en restant claire en français.
- source_word: לֹא יֵדַע הָאָדָם
  choice: L’être humain ne sait pas
  rationale: הָאָדָם est ici un singulier générique représentant l’humanité. « L’être humain » garde cette valeur collective sans désigner exclusivement un homme de sexe masculin.
- source_word: מַה שֶׁיִּהְיֶה
  choice: ce qui arrivera
  rationale: La tournure exprime de manière ouverte ce qui sera ou se produira dans l’avenir. « Ce qui arrivera » est naturel en français et convient au contexte.
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: ce qui arrivera après lui
  rationale: La traduction reste proche de l’hébreu et préserve l’ambiguïté entre ce qui se produira plus tard et ce qui adviendra après la disparition de la personne.
- source_word: מִי יַגִּיד לוֹ
  choice: qui peut lui dire
  rationale: La question rhétorique porte sur la capacité de faire connaître l’avenir. « Qui peut lui dire » en rend naturellement la force en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de la multiplication des paroles ainsi que l’indétermination de l’avenir et l’ambiguïté temporelle de « après lui ».
