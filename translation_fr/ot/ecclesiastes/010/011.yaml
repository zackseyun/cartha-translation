source:
  edition: WLC
  text: אִם יִשֹּׁ֥ךְ הַ/נָּחָ֖שׁ בְּ/לוֹא לָ֑חַשׁ וְ/אֵ֣ין יִתְר֔וֹן לְ/בַ֖עַל הַ/לָּשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/011.yaml
  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
translation:
  language: fr
  text: Si le serpent mord avant d’être charmé[a], le charmeur[b] n’en tire aucun avantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans incantation »; littéralement, « en l’absence de murmure (ou de formule murmurée) ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « le maître de la langue ». L’expression désigne probablement un charmeur de serpents, habile à prononcer des formules incantatoires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit ici un cas conditionnel servant d’illustration proverbiale.
- source_word: יִשֹּׁךְ
  choice: mord
  rationale: Le verbe נשׁך désigne couramment la morsure, notamment celle d’un serpent.
- source_word: הַנָּחָשׁ
  choice: le serpent
  rationale: Désigne l’animal concret de l’image proverbiale; « serpent » est naturel et précis en français.
- source_word: בְּלוֹא לָחַשׁ
  choice: avant d’être charmé
  rationale: לחש peut désigner un murmure, une formule incantatoire ou l’action de charmer. Dans ce contexte, cette formulation exprime naturellement l’idée pratique que la morsure survient avant l’intervention du charmeur, tout en signalant en note la traduction plus formelle.
- source_word: וְאֵין יִתְרוֹן
  choice: n’en tire aucun avantage
  rationale: יתרון est un terme caractéristique de Qohélet, exprimant l’avantage, le bénéfice ou le gain. « Avantage » conserve ce lien thématique.
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: le charmeur
  rationale: Littéralement « maître de la langue »; dans l’image du serpent et de l’incantation, l’expression désigne vraisemblablement celui qui charme le serpent par sa parole.
