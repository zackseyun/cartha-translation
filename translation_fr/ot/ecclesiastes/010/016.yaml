base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: fr
  text: Malheur à toi, pays[a], dont le roi est un jeune homme[b] et dont les dirigeants mangent le matin[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel malheur pour toi, pays ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner un enfant, un jeune homme ou parfois un serviteur. Ici, il souligne probablement l’immaturité du roi.
    reason: lexical_alternative
  - marker: c
    text: Le fait de manger le matin évoque probablement des banquets pris à une heure inconvenante et l’abandon aux plaisirs, par contraste avec le verset suivant.
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ
  choice: Malheur à toi
  rationale: Cette formule rend directement l’exclamation de lamentation ou de dénonciation adressée au pays.
- source_word: אֶרֶץ
  choice: pays
  rationale: Dans ce contexte politique, le terme désigne le territoire ou la nation gouvernée par un roi, plutôt que la terre entière.
- source_word: שֶׁמַּלְכֵּךְ
  choice: dont le roi
  rationale: La relative hébraïque qualifie directement le pays; cette tournure française demeure naturelle et préserve la structure du texte.
- source_word: נָעַר
  choice: un jeune homme
  rationale: Le mot peut désigner un enfant, un jeune homme ou parfois un serviteur. Ici, il évoque probablement la jeunesse et, en contexte, l’immaturité politique, sans que celle-ci soit explicitée dans le corps du texte.
- source_word: וְשָׂרַיִךְ
  choice: et dont les dirigeants
  rationale: שָׂרִים désigne les hauts responsables placés sous l’autorité royale. « Dirigeants » est clair en français moderne et évite de suggérer nécessairement des fils de roi.
- source_word: בַּבֹּקֶר
  choice: dès le matin
  rationale: Cette expression naturelle souligne le caractère matinal de leur repas, dont la portée négative ressort du contraste avec le verset suivant.
- source_word: יֹאכֵלוּ
  choice: mangent
  rationale: Le verbe signifie simplement « manger ». Le traduire par « festoyer » introduirait dans le texte principal une interprétation que le contexte permet, mais que le verbe seul n’impose pas.
