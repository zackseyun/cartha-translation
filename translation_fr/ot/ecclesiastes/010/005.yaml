  yaml_path: translation/ot/ecclesiastes/010/005.yaml
  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
translation:
  language: fr
  text: 'Il y a un mal que j’ai vu sous le soleil : comme une erreur qui vient du gouvernant[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une erreur qui vient de devant le gouvernant ». L’hébreu peut évoquer une méprise réellement involontaire, ou quelque chose qui est traité comme si c’en était une.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Il est
  rationale: La tournure existentielle, légèrement soutenue mais naturelle, introduit l’observation de Qohélet.
- source_word: רָעָה
  choice: un mal
  rationale: Préserve la portée large du terme, qui peut désigner une réalité mauvaise ou grave sans préciser s’il s’agit d’une faute morale ou d’un malheur.
- source_word: רָאִיתִי
  choice: que j’ai vu
  rationale: Le passé composé convient à une observation faite dans le passé et toujours pertinente dans la réflexion présente.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Rend fidèlement la formule caractéristique de l’Ecclésiaste dans un français traditionnel et immédiatement compréhensible.
- source_word: כִּשְׁגָגָה
  choice: comme une erreur
  rationale: Conserve explicitement la comparaison marquée par כ et l’ambiguïté entre une méprise involontaire et un acte présenté comme tel.
- source_word: שֶׁיֹּצָא מִלִּפְנֵי
  choice: provenant de
  rationale: Formulation française naturelle qui exprime l’origine, tout en évitant le calque peu idiomatique « sortant de devant ».
- source_word: הַשַּׁלִּיט
  choice: celui qui gouverne
  rationale: Désigne clairement la personne qui exerce le pouvoir sans lui attribuer un titre politique plus précis que l’hébreu.
theological_decisions:
- issue: Nature de l’« erreur » du gouvernant
  choice: Maintenir la comparaison et l’indétermination avec « comme une erreur »
  alternative: « une erreur commise par celui qui gouverne »
  rationale: L’hébreu peut évoquer soit une méprise réelle, soit quelque chose qui sort du pouvoir comme si c’était une méprise; la traduction ne doit pas trancher.
translation_notes:
  register: Français international moderne, digne et lisible. Le deux-points final est conservé puisque le verset introduit l’exemple développé au verset suivant. La note restitue l’image plus littérale de la présence du gouvernant et préserve l’ambiguïté de שְׁגָגָה.
