source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: fr
  text: Si le fer est émoussé et qu’on n’en affûte pas le tranchant, il faut alors déployer davantage de force ; mais l’avantage de la sagesse, c’est qu’elle fait réussir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais la sagesse rend plus efficace » ; littéralement, la formulation hébraïque associe l’avantage de la sagesse au fait de rendre apte ou de faire réussir.'
    reason: La syntaxe concise de l’hébreu permet des formulations proches qui mettent en avant soit l’efficacité, soit la réussite procurée par la sagesse.
lexical_decisions:
- source_word: קֵהָה
  choice: est émoussé
  rationale: Exprime naturellement en français la perte de tranchant d’une lame ou d’un outil.
- source_word: הַבַּרְזֶל
  choice: le fer
  rationale: Conserve la métonymie hébraïque, où « le fer » désigne vraisemblablement une lame ou un outil en fer.
- source_word: פָנִים קִלְקַל
  choice: aiguise […] le tranchant
  rationale: פָנִים signifie littéralement « face(s) », mais désigne ici la partie active de la lame ; dans ce contexte, קלקל renvoie à sa préparation ou à son affûtage.
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: il faut redoubler de force
  rationale: Rend la nécessité pratique d’accroître l’effort lorsqu’un outil est émoussé.
- source_word: וְיִתְרוֹן הכשיר חָכְמָה
  choice: mais la sagesse donne l’avantage en faisant réussir
  rationale: Maintient à la fois l’idée d’avantage exprimée par יִתְרוֹן et celle d’efficacité ou de réussite portée par הכשיר, sans réduire la clause à une seule de ces nuances.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Terme usuel qui désigne ici notamment le savoir-faire et le bon jugement pratiques.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le proverbe conserve l’image concrète du « fer » tout en explicitant son tranchant. La formulation finale préserve les deux éléments lexicaux — avantage et réussite — ainsi que la légère ambiguïté syntaxique de l’hébreu.
