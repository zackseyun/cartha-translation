source:
  edition: WLC
  text: נִתַּ֣ן הַ/סֶּ֔כֶל בַּ/מְּרוֹמִ֖ים רַבִּ֑ים וַ/עֲשִׁירִ֖ים בַּ/שֵּׁ֥פֶל יֵשֵֽׁבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/006.yaml
  text: Folly is set in many high places[a], and the rich sit in a low place.
translation:
  language: fr
  text: La folie est placée à bien des postes élevés[a], tandis que les riches siègent à une place inférieure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La sottise est établie dans bien des lieux élevés. » L’hébreu emploie les images spatiales de la hauteur et de la position basse pour parler du rang ou de la fonction sociale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתַּן
  choice: est placée
  rationale: 'Le nifal accompli de נתן a ici un sens passif : « être donné, placé, établi ». « Est placée » conserve cette voix sans préciser l’agent.'
- source_word: הַסֶּכֶל
  choice: la folie
  rationale: Le nom désigne la folie ou la sottise, plutôt qu’un individu insensé. « La folie » maintient le contraste thématique de Qohélet entre sagesse et folie.
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: à bien des postes élevés
  rationale: Le syntagme évoque littéralement de nombreuses hauteurs, employées ici comme image du rang ou de la fonction sociale. « Postes élevés » rend naturellement la métaphore en français, et « bien des » traduit la pluralité exprimée par רַבִּים.
- source_word: וַעֲשִׁירִים
  choice: tandis que les riches
  rationale: L’adjectif masculin pluriel est substantivé. « Les riches » désigne naturellement cette catégorie sociale; « tandis que » fait ressortir le contraste entre les deux propositions sans en modifier le contenu.
- source_word: בַּשֵּׁפֶל
  choice: à une place inférieure
  rationale: שֵׁפֶל désigne ce qui est bas ou une situation basse. Cette formulation conserve l’image spatiale et son sens social, en parallèle avec les « postes élevés ».
- source_word: יֵשֵׁבוּ
  choice: siègent
  rationale: ישב signifie couramment « s’asseoir, siéger, demeurer ». « Siègent » préserve ici l’image d’une position occupée tout en convenant au contexte de rang social.
theological_decisions: []
