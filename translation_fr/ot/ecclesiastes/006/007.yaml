source:
  edition: WLC
  text: כָּל עֲמַ֥ל הָ/אָדָ֖ם לְ/פִ֑י/הוּ וְ/גַם הַ/נֶּ֖פֶשׁ לֹ֥א תִמָּלֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
translation:
  language: fr
  text: Tout le labeur de l’être humain est pour sa bouche, et pourtant son appétit n’est pas comblé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme n’est pas comblée ». Ici, le mot hébreu traduit par « appétit » peut aussi désigner l’âme, la personne ou le désir.
    reason: Alternative lexicale préservant la polysémie de נֶפֶשׁ.
lexical_decisions:
- source_word: כָּל עֲמַל
  choice: Tout le labeur
  rationale: Préserve l’idée de totalité ainsi que la nuance d’effort pénible souvent portée par עֲמַל dans l’Ecclésiaste.
- source_word: הָאָדָם
  choice: de l’être humain
  rationale: אָדָם est ici générique. « L’être humain » rend naturellement en français la portée universelle du singulier hébreu sans désigner un individu précis.
- source_word: לְפִיהוּ
  choice: pour sa bouche
  rationale: Conserve l’image concrète et littérale de la bouche, plutôt que de l’interpréter d’emblée comme la nourriture ou les besoins.
- source_word: וְגַם
  choice: et pourtant
  rationale: Dans le contexte, la coordination introduit un contraste ironique entre tout le labeur fourni et l’absence persistante de plénitude.
- source_word: הַנֶּפֶשׁ
  choice: son appétit
  rationale: Au voisinage de « bouche » et du verbe « remplir », נֶפֶשׁ désigne vraisemblablement le désir ou l’appétit. Une note conserve toutefois l’autre lecture possible, « âme ».
- source_word: לֹא תִמָּלֵא
  choice: n’est jamais comblé
  rationale: « Comblé » garde l’image de la plénitude tout en étant idiomatique avec « appétit ». « Jamais » exprime la valeur générale de l’imparfait dans cette maxime, plutôt qu’un simple événement ponctuel.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le propos concerne tout être humain. Cette formulation moderne garde le singulier représentatif sans restreindre artificiellement l’énoncé au sexe masculin.
- issue: Sens de נֶפֶשׁ dans le contexte de la consommation et de l’insatisfaction
  choice: appétit
  alternative: âme
  rationale: « Appétit » évite d’imposer au verset une opposition doctrinale entre corps et âme que l’hébreu n’exige pas. Comme נֶפֶשׁ demeure polysémique, « âme » est signalé en note.
translation_notes:
  register: Français international actuel, digne et proverbial. L’image de la bouche est conservée; la seconde proposition demeure concise et met en relief l’insatisfaction persistante.
