id: ECC.6.5
reference: Ecclesiastes 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם שֶׁ֥מֶשׁ לֹא רָאָ֖ה וְ/לֹ֣א יָדָ֑ע נַ֥חַת לָ/זֶ֖ה מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
translation:
  language: fr
  text: Même s’il n’a pas vu le soleil[a] et n’a rien connu, il a plus de repos que cet homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Voir le soleil » est une expression hébraïque qui évoque l’expérience de la vie en ce monde.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « celui-ci a plus de repos que celui-là ». Les démonstratifs renvoient à l’enfant mort-né et à l’homme décrits dans les versets précédents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même si
  rationale: 'Dans ce contexte, la particule ajoute un élément à l’argument tout en ayant une valeur concessive : malgré l’absence de toute expérience de la vie, l’enfant mort-né connaît davantage de repos.'
- source_word: שֶׁמֶשׁ
  choice: le soleil
  rationale: L’image hébraïque est conservée. Dans l’Ecclésiaste, « voir le soleil » évoque l’expérience de la vie en ce monde.
- source_word: לֹא רָאָה
  choice: il n’a pas vu
  rationale: Le passé composé convient naturellement en français et renvoie à l’enfant mort-né mentionné au verset précédent.
- source_word: וְלֹא יָדָע
  choice: et n’a rien connu
  rationale: Le verbe ידע est employé sans complément explicite et désigne ici largement l’expérience ou la connaissance consciente. « Rien connu » restitue cette portée sans la préciser excessivement.
- source_word: נַחַת
  choice: repos
  rationale: Le nom désigne le calme, la tranquillité ou le repos. « Repos » est clair, naturel et maintient le contraste avec l’existence insatisfaite de l’homme.
- source_word: לָזֶה מִזֶּה
  choice: il a plus de repos que cet homme
  rationale: La construction compare littéralement « celui-ci » à « celui-là ». Le contexte identifie le premier comme l’enfant mort-né et le second comme l’homme des versets précédents; expliciter « cet homme » rend la comparaison intelligible.
theological_decisions:
- issue: Nature du « repos » de l’enfant mort-né
  choice: Conserver le terme général « repos » sans définir un état après la mort.
  alternative: Interpréter le repos comme une félicité consciente ou comme une simple absence de souffrance.
  rationale: Le texte affirme seulement un avantage comparatif en matière de repos; il ne précise ni la conscience ni la condition eschatologique de l’enfant.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’image du soleil et la sobriété du texte hébreu, tout en explicitant seulement le référent nécessaire à la compréhension.
