review_pass:
  verdict: revise
  source_fidelity: La structure interrogative double, « bon », הֶבֶל rendu par « vanité », l’image de l’ombre, « après lui » et « sous le soleil » sont bien conservés. Toutefois, « quelques jours » ajoute une limitation numérique qui n’est pas explicitement exprimée par מִסְפַּר (« nombre, compte »).
  naturalness: Le français est globalement moderne, clair et digne. « Les jours que compte sa vie » est plus naturel que la reproduction littérale de « le nombre des jours », tout en évitant l’ajout interprétatif « quelques ».
  terminology: « L’être humain » rend correctement אָדָם au sens générique. « Vie de vanité » préserve le terme directeur הֶבֶל de Qohélet sans en imposer une interprétation unique. « Sous le soleil » maintient la formule caractéristique.
  issues:
  - severity: medium
    issue: « quelques jours »
    rationale: מִסְפַּר יְמֵי signifie littéralement « le nombre des jours » et peut évoquer des jours comptés ou limités, mais ne dit pas explicitement qu’ils sont « quelques ». Cette précision réduit indûment l’ouverture du texte.
  revised_text: Car qui sait ce qui est bon pour l’être humain pendant sa vie, au cours des jours que compte sa vie de vanité, qu’il les passe comme une ombre ? Et qui peut lui dire ce qui arrivera après lui sous le soleil ?
