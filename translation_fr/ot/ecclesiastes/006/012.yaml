  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: fr
  text: Car qui sait ce qui est bon pour l’être humain pendant sa vie, au cours des jours que compte sa vie de vanité, qu’il les passe comme une ombre ? Et qui peut lui dire ce qui arrivera après lui sous le soleil ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָדָם
  choice: pour l’être humain
  rationale: Rend le terme générique אָדָם de façon inclusive et naturelle en français moderne.
- source_word: הֶבְלוֹ
  choice: sa vie de vanité
  rationale: Conserve le mot-clé הֶבֶל de Qohélet et son ambiguïté entre inconsistance, caractère éphémère et absurdité, sans la réduire à la seule brièveté.
- source_word: וְיַעֲשֵׂם כַּצֵּל
  choice: qu’il passe comme une ombre
  rationale: Le pronom suffixe renvoie vraisemblablement aux jours; cette formulation idiomatique conserve l’image de l’ombre et l’idée que l’être humain passe ses jours.
- source_word: אַחֲרָיו
  choice: après lui
  rationale: 'Préserve l’ambiguïté: ce qui se produira après son époque ou après sa mort.'
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Maintient la formule caractéristique de Qohélet.
theological_decisions:
- issue: Sens de הֶבֶל
  choice: vanité
  alternative: fugacité
  rationale: « Vanité » garde davantage la tension théologique et existentielle du terme récurrent, tandis que « fugacité » en fixe trop étroitement le sens temporel.
- issue: Portée de « après lui »
  choice: laisser la formule ouverte
  alternative: « après sa mort »
  rationale: L’hébreu ne précise pas explicitement la mort; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « vie » est conservée pour refléter la densité de חַיִּים / חַיֵּי, tandis que « au cours des quelques jours » rend naturellement מִסְפַּר יְמֵי dans ce contexte.
