revisions:
- from: Car qui sait ce qui est bon pour l’être humain pendant sa vie, au cours des quelques jours de sa vie de vanité, qu’il passe comme une ombre ? Et qui peut lui dire ce qui arrivera après lui sous le soleil ?
  to: Car qui sait ce qui est bon pour l’être humain pendant sa vie, au cours des jours que compte sa vie de vanité, qu’il les passe comme une ombre ? Et qui peut lui dire ce qui arrivera après lui sous le soleil ?
  rationale: La révision retire l’ajout « quelques » et rend מִסְפַּר יְמֵי par « les jours que compte », formulation française idiomatique qui garde l’idée de durée mesurée. Le pronom objet « les » explicite sobrement que « passer » porte sur les jours, conformément au suffixe pluriel de וְיַעֲשֵׂם.
  reviewer_model: gpt-5.6-terra
