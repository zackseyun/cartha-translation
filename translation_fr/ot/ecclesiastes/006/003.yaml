    issue: « bonheur » pour הַטּוֹבָה
    rationale: Le terme hébreu désigne le bien, les bonnes choses ou le bien-être dont on jouit; « bonheur » restreint indûment le sens à un sentiment ou à un état affectif.
  - severity: medium
