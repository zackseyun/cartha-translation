source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: fr
  text: Si un homme engendre cent enfants et vit de nombreuses années, quelque nombreux que soient les jours de ses années, mais que son âme[b] ne se rassasie pas du bien et qu’il n’ait même pas de sépulture, je dis[c] qu’un enfant mort-né[a] est mieux loti que lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fausse couche » ou « une naissance prématurée ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « son âme ne se rassasie pas du bien » ; « âme » peut aussi désigner la personne elle-même ou, dans ce contexte, son appétit.'
    reason: lexical_alternative
  - marker: c
    text: Ou « j’ai dit » ; le parfait hébreu peut se rendre soit comme une déclaration passée, soit comme une formule de discours au présent.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit naturellement en français le cas hypothétique développé dans le verset.
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: un homme engendre cent enfants
  rationale: « Engendre » conserve la valeur procréatrice du hiphil de ילד; « enfants » explicite en français le complément numérique sous-entendu.
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה
  choice: et vit de nombreuses années
  rationale: Formulation française naturelle qui préserve l’idée de longévité.
- source_word: וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: si nombreux que soient les jours de ses années
  rationale: Rend la force concessive ou intensive de la proposition tout en conservant l’image hébraïque des jours et des années.
- source_word: וְנַפְשׁוֹ
  choice: mais que son âme
  rationale: « Âme » maintient la texture anthropologique de נֶפֶשׁ sans lui imposer ici une définition doctrinale technique.
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: ne soit pas rassasiée de bonheur
  rationale: « Rassasiée » préserve l’image de satiété exprimée par שבע; « bonheur » désigne ici le bien dont on jouit plutôt que le bien moral abstrait.
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: et qu’il n’ait même pas de sépulture
  rationale: Exprime clairement la privation supplémentaire et l’indignité marquée par גַם.
- source_word: אָמַרְתִּי
  choice: je dis
  rationale: Le parfait peut fonctionner ici comme formule présente de discours introduisant le jugement du Qohélet.
- source_word: טוֹב מִמֶּנּוּ
  choice: est plus heureux que lui
  rationale: Le comparatif porte sur la condition de l’un et de l’autre, non sur leur valeur morale; « plus heureux » est idiomatique et contextuellement clair.
- source_word: הַנָּפֶל
  choice: un enfant mort-né
  rationale: Désigne concrètement l’être issu d’une grossesse interrompue ou d’une naissance sans vie; la note préserve les autres possibilités lexicales.
theological_decisions:
- issue: Nuance anthropologique de נֶפֶשׁ dans la littérature de sagesse
  choice: « son âme ne soit pas rassasiée »
  alternative: « il ne soit pas rassasié » ou « son appétit ne soit pas rassasié »
  rationale: Le passage ne formule pas une doctrine technique de l’âme. Garder « âme » respecte cependant l’expression hébraïque et sa profondeur anthropologique sans trancher entre « personne », « vie » et « appétit ».
- issue: Langage représentatif masculin
  choice: « un homme »
  alternative: « quelqu’un » ou « une personne »
  rationale: Le texte source emploie אִישׁ au masculin singulier et construit un cas représentatif; la traduction conserve cette forme.
- issue: Valeur temporelle de אָמַרְתִּי
  choice: « je dis »
  alternative: « j’ai dit »
  rationale: Le parfait hébreu peut être lu soit comme un constat antérieur, soit comme une formule discursive introduisant le jugement présent. Le corps du texte retient la seconde option sans nier la première.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la longue hypothèse conditionnelle et son intensification. « Engendre » et « sépulture » relèvent d’un registre soutenu mais courant dans un texte biblique; « mort-né » donne un référent humain concret. Le marqueur [a] figure dans le texte principal.
