source:
  edition: WLC
  text: יֵ֣שׁ רָעָ֔ה אֲשֶׁ֥ר רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/רַבָּ֥ה הִ֖יא עַל הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/001.yaml
  text: 'There is an evil that I have seen under the sun[a], and it is heavy upon man:'
translation:
  language: fr
  text: 'Il y a un mal que j’ai vu sous le soleil, et il pèse lourdement sur l’être humain[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur l’humanité ». L’hébreu emploie ici le singulier générique אָדָם, qui désigne les êtres humains en général.
    reason: Précision lexicale sur la portée générique du terme hébreu.
lexical_decisions:
- source_word: יֵשׁ
  choice: Il est
  rationale: Introduit naturellement, dans un registre digne, l’existence du mal observé.
- source_word: רָעָה
  choice: un mal
  rationale: Conserve l’ampleur sémantique du nom hébreu, qui peut désigner un mal, une situation mauvaise ou un malheur, sans trancher indûment.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que j’ai vu
  rationale: Rend directement la proposition relative et le parfait à la première personne dans la réflexion de Qohélet.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: sous le soleil
  rationale: Expression consacrée et exacte pour l’idiome récurrent de l’Ecclésiaste.
- source_word: וְרַבָּה הִיא
  choice: et il pèse lourdement
  rationale: Dans la construction avec עַל, רבה exprime ici la gravité ou le poids accablant du mal; cette formulation française en restitue naturellement la force.
- source_word: עַל הָאָדָם
  choice: sur l’être humain
  rationale: אָדָם est ici un singulier générique désignant l’humanité; « l’être humain » en garde la forme singulière et la portée inclusive, tandis que « sur » correspond à עַל et s’accorde avec l’image du poids.
theological_decisions:
- issue: Portée de הָאָדָם
  choice: l’être humain
  alternative: l’humanité
  rationale: Le terme désigne ici l’être humain de façon générique plutôt qu’un homme particulier. Le singulier est conservé sans restreindre le référent au sexe masculin.
- issue: Nature de רָעָה
  choice: un mal
  alternative: un malheur
  rationale: « Un mal » préserve la tension entre dimension mauvaise, pénible et calamiteuse, là où « malheur » réduirait davantage le sens à l’infortune.
translation_notes:
  register: Français international moderne, sobre et digne. Le tour « Il est un mal » conserve une légère solennité sapientielle; « pèse lourdement » rend de manière idiomatique la gravité exprimée par רבה avec עַל.
