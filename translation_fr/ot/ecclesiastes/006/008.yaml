source:
  edition: WLC
  text: כִּ֛י מַה יּוֹתֵ֥ר לֶ/חָכָ֖ם מִֽן הַ/כְּסִ֑יל מַה לֶּ/עָנִ֣י יוֹדֵ֔עַ לַ/הֲלֹ֖ךְ נֶ֥גֶד הַ/חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
translation:
  language: fr
  text: Car quel avantage le sage a-t-il sur l’insensé ? Qu’a de plus le pauvre qui sait comment se conduire devant les vivants[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui sait marcher devant les vivants ». En hébreu, « marcher » peut désigner la manière de vivre ou de se conduire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif ou l’explication de la pensée précédente et convient au mouvement argumentatif du passage.
- source_word: מַה יּוֹתֵר
  choice: quel avantage… a-t-il
  rationale: L’expression interroge le surplus, le profit ou l’avantage; « avantage » est naturel en français et correspond à un thème récurrent de Qohélet.
- source_word: לֶחָכָם
  choice: le sage
  rationale: L’adjectif masculin singulier est substantivé; « le sage » conserve cette forme tout en étant idiomatique en français.
- source_word: מִן הַכְּסִיל
  choice: sur l’insensé
  rationale: La préposition marque ici la comparaison; « avoir un avantage sur » est l’expression française naturelle.
- source_word: מַה לֶּעָנִי
  choice: Qu’a de plus le pauvre
  rationale: La proposition est elliptique et parallèle à la première. « De plus » restitue sobrement l’idée implicite d’avantage sans répéter lourdement le substantif.
- source_word: עָנִי
  choice: le pauvre
  rationale: Le sens socioéconomique est le plus probable dans ce contexte, bien que le mot puisse aussi désigner une personne affligée ou humble.
- source_word: יוֹדֵעַ
  choice: qui sait
  rationale: Le participe exprime le fait de savoir ou d’être habile; « sait » maintient la formulation directe de l’hébreu.
- source_word: לַהֲלֹךְ
  choice: comment se conduire
  rationale: Le verbe signifie littéralement « marcher », mais peut idiomatiquement désigner la manière de vivre ou de se comporter.
- source_word: נֶגֶד הַחַיִּים
  choice: devant les vivants
  rationale: נֶגֶד signifie « devant, en présence de, vis-à-vis de » et הַחַיִּים désigne naturellement les personnes vivantes collectivement. La formulation conserve l’étrangeté et l’ambiguïté possibles de l’image.
theological_decisions:
- issue: Lien syntaxique et sens précis de la seconde question
  choice: Conserver une question elliptique où le savoir-vivre du pauvre ne garantit aucun avantage évident.
  alternative: Comprendre que le pauvre possède précisément comme avantage le fait de savoir se conduire parmi les vivants.
  rationale: La syntaxe hébraïque est concise et peut se lire de plusieurs manières. La traduction garde la tension en posant « Qu’a de plus… ? » sans transformer explicitement son savoir en avantage positif.
translation_notes:
  register: Français international moderne, sobre et digne. « L’insensé » convient au registre sapientiel sans être archaïque. L’ordre de la seconde question reste proche de l’hébreu, tandis que « se conduire » rend idiomatiquement l’image de la marche; la note en préserve la forme littérale.
