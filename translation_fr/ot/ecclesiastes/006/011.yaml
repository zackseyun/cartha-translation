  text: כִּ֛י יֵשׁ דְּבָרִ֥ים הַרְבֵּ֖ה מַרְבִּ֣ים הָ֑בֶל מַה יֹּתֵ֖ר לָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/011.yaml
  text: For there are many words that increase vanity; what advantage is there for man?
translation:
  language: fr
  text: Car il y a bien des paroles[a] qui ajoutent à la futilité[b]. Quel avantage y a-t-il pour l’être humain ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « choses », « affaires » ou « réalités ». Le terme hébreu peut désigner des paroles ou, plus largement, ce dont il est question.'
    reason: Préserver l’ambiguïté lexicale de דְּבָרִים sans écarter la lecture « paroles ».
  - marker: b
    text: Le mot hébreu traduit par « futilité » signifie littéralement « souffle » ou « vapeur » et peut évoquer ce qui est éphémère, insaisissable ou vain.
    reason: Préserver la métaphore fondamentale et la polysémie de הֶבֶל, terme clé de l’Ecclésiaste.
lexical_decisions:
- source_word: דְּבָרִים (devarim)
  choice: paroles
  rationale: 'Dans ce contexte, le terme désigne probablement des paroles plutôt que des « choses » ou des « affaires ». Cette lecture correspond au parallélisme de l’idée : la multiplication des paroles ne procure aucun avantage réel.'
- source_word: הֶבֶל (hevel)
  choice: futilité
  rationale: Le mot évoque littéralement un souffle ou une vapeur et, par extension, ce qui est éphémère, insaisissable ou vain. « Futilité » convient naturellement à l’effet attribué ici aux nombreuses paroles, tout en faisant l’objet d’une note qui préserve l’image et l’étendue du terme hébreu.
- source_word: אָדָם (adam)
  choice: l’être humain
  rationale: Le nom est employé ici dans un sens générique. « L’être humain » l’exprime clairement en français moderne sans limiter la question au sexe masculin.
- source_word: יִתְרוֹן (yitron), sous la forme יֹתֵר
  choice: avantage
  rationale: Ce terme récurrent de l’Ecclésiaste désigne le gain, le bénéfice ou l’avantage qui reste à une personne. « Avantage » conserve bien la portée de la question.
theological_decisions:
- issue: Portée de la question finale
  choice: Quel avantage l’être humain en retire-t-il ?
  alternative: Quel avantage y a-t-il pour l’être humain ?
  rationale: « En retire-t-il » explicite seulement le rapport syntaxique avec la multiplication des paroles, sans répondre à la question ni en supprimer la force rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en évitant le sens courant de « vanité » comme orgueil ou amour-propre.
