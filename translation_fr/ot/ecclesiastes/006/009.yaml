  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: fr
  text: Mieux vaut ce que les yeux voient[a] que l’errance du désir[b] ; cela aussi est vapeur et poursuite du vent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la vue des yeux ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’âme » ou « de l’appétit » ; ici, le mot hébreu peut désigner l’être désirant ou le désir.
    reason: lexical_alternative
  - marker: c
    text: Ou « quête du vent ». L’expression hébraïque est difficile et peut évoquer une poursuite ou un effort aussi futile qu’insaisissable.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: La construction comparative avec מִן appelle en français la tournure idiomatique « mieux vaut ».
- source_word: מַרְאֵה עֵינַיִם
  choice: ce que les yeux voient
  rationale: Cette formulation naturelle conserve le caractère concret de la perception visuelle et rend clairement l’idée de ce qui est présent aux yeux.
- source_word: מֵהֲלָךְ
  choice: les vagabondages de
  rationale: Le nom dérivé de הלך évoque ici le mouvement errant ou incessant ; le pluriel français exprime naturellement les divagations répétées du désir.
- source_word: נָפֶשׁ
  choice: du désir
  rationale: Dans ce contexte, נֶפֶשׁ désigne vraisemblablement l’être qui désire, l’appétit ou la convoitise, plutôt que l’âme immatérielle au sens théologique ultérieur.
- source_word: גַּם זֶה
  choice: cela aussi
  rationale: Formule française simple qui préserve la reprise évaluative caractéristique de Qohélet.
- source_word: הֶבֶל
  choice: vapeur
  rationale: « Vapeur » maintient l’image concrète de ce qui est fugitif et insaisissable, sans la réduire au seul sens moral de « vanité ».
- source_word: וּרְעוּת רוּחַ
  choice: et poursuite du vent
  rationale: Cette expression accessible conserve l’image d’un effort futile dirigé vers quelque chose d’insaisissable.
theological_decisions:
- issue: Sens de נָפֶשׁ dans le contraste du verset
  choice: désir
  alternative: âme ; appétit
  rationale: « Désir » rend le mieux ici la dimension de convoitise mobile et insatisfaite, tout en évitant d’imposer une anthropologie dualiste ; la note conserve l’ambiguïté lexicale.
- issue: Portée métaphorique de הֶבֶל
  choice: vapeur
  alternative: vanité ; souffle
  rationale: Le terme concret laisse ouvertes les nuances de fugacité, d’insaisissabilité et d’inconsistance propres au livre.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est rendu de façon idiomatique, tandis que « vapeur » et « poursuite du vent » préservent les images récurrentes de Qohélet.
