  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: fr
  text: Il y a un homme à qui Dieu donne richesse, biens et honneur, et qui ne manque, pour lui-même, de rien de tout ce qu’il désire ; pourtant, Dieu ne lui donne pas le pouvoir d’en profiter[a], car un étranger en profite. C’est là une vapeur[b] et une grave maladie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’en manger ». Cette expression concrète signifie ici profiter de ces biens ou en jouir ; le même verbe est repris dans la proposition suivante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « futilité », « vanité ». Le mot hébreu hével évoque d’abord une vapeur, quelque chose de fugitif et d’insaisissable.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un mal grave ». L’hébreu emploie le mot « maladie », qui peut décrire au sens figuré une situation profondément mauvaise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Il y a un homme à qui
  rationale: Cette formulation restitue l’ouverture elliptique et le masculin singulier représentatif tout en restant naturelle en français.
- source_word: יִתֶּן לוֹ הָאֱלֹהִים
  choice: Dieu donne
  rationale: Le présent exprime ici la portée générale de cette observation sapientielle.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: richesse, biens et honneur
  rationale: Ces termes distinguent les ressources, les possessions et le prestige social sans alourdir la phrase.
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: sans que rien de tout ce qu’il désire lui manque pour lui-même
  rationale: « Pour lui-même » rend l’emploi idiomatique de נֶפֶשׁ sans introduire une conception technique de l’âme.
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: pourtant, Dieu ne lui donne pas le pouvoir
  rationale: Cette expression conserve la valeur causative de שלט et demeure claire en français courant.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: d’en manger
  rationale: Le concret de l’image hébraïque est préservé plutôt que remplacé dans le texte par l’interprétation « en profiter ».
- source_word: אִישׁ נָכְרִי יֹאכֲלֶנּוּ
  choice: un homme étranger en mange
  rationale: La traduction conserve les deux éléments, אִישׁ et נָכְרִי, ainsi que la reprise de l’image de manger.
- source_word: זֶה הֶבֶל
  choice: C’est là une vapeur
  rationale: « Vapeur » rend l’image fondamentale de הֶבֶל — fugacité, insaisissabilité et inconsistance — sans la réduire à une seule interprétation abstraite.
- source_word: וָחֳלִי רָע
  choice: et une maladie grave
  rationale: « Maladie » conserve le sens lexical concret de חֳלִי ; רָע qualifie ici sa gravité ou son caractère funeste.
theological_decisions:
- issue: Sens de לְנַפְשׁוֹ
  choice: pour lui-même
  alternative: pour son âme
  rationale: Dans ce contexte, נֶפֶשׁ désigne idiomatiquement la personne elle-même ; la traduction évite donc d’imposer une anthropologie dualiste.
- issue: Agentivité divine dans וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: Dieu ne lui donne pas le pouvoir
  alternative: Dieu ne lui permet pas
  rationale: Le choix maintient l’affirmation forte et tendue du texte selon laquelle Dieu ne confère pas la capacité de jouir des biens, sans l’atténuer en simple permission.
- issue: Masculin représentatif
  choice: un homme
  alternative: une personne / quelqu’un
  rationale: Le texte hébreu emploie explicitement אִישׁ au masculin singulier dans cette observation sapientielle.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’accumulation du texte hébreu, tandis que le point-virgule clarifie son contraste central. Les images concrètes de « manger », de la « vapeur » et de la « maladie » sont maintenues, avec des notes pour leurs sens possibles.
