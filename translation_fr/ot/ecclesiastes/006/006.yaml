  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: fr
  text: Même s’il vivait deux fois mille ans[a] sans voir le bien[b], tous ne vont-ils pas vers un même lieu[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mille ans deux fois » ; ou : « deux mille ans ».'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « voir le bien » signifie faire l’expérience de ce qui est bon ou en jouir.
    reason: lexical_alternative
  - marker: c
    text: 'C’est-à-dire la destination commune dans la mort ; l’hébreu dit seulement : « un même lieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ חָיָה
  choice: Même s’il vivait
  rationale: La tournure introduit une hypothèse concessive; l’imparfait français après « même si » l’exprime naturellement.
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: mille ans, deux fois
  rationale: Cette formulation conserve l’expression hébraïque littérale et son insistance, plutôt que de la réduire au seul nombre « deux mille ans ».
- source_word: וְטוֹבָה לֹא רָאָה
  choice: sans voir le bonheur
  rationale: « Voir » préserve l’image récurrente de l’hébreu, tandis que « le bonheur » exprime ici le bien éprouvé ou goûté sans le limiter à la prospérité matérielle.
- source_word: הֲלֹא
  choice: tous ne vont-ils pas
  rationale: L’inversion négative rend en français la question rhétorique qui appelle une réponse affirmative.
- source_word: אֶל מָקוֹם אֶחָד
  choice: vers un même lieu
  rationale: « Un même lieu » reste proche de l’hébreu tout en indiquant naturellement en français la destination commune, sans la nommer.
- source_word: הַכֹּל הוֹלֵךְ
  choice: tous ne vont-ils pas
  rationale: « Tous » vise ici l’ensemble des êtres humains concernés; le présent exprime la vérité générale du participe hébreu.
theological_decisions:
- issue: Destination implicite du « même lieu »
  choice: Conserver « un même lieu » sans identifier la destination dans le corps du texte.
  alternative: la tombe, le séjour des morts ou la mort
  rationale: Le texte hébreu laisse cette destination implicite. La préciser résoudrait une retenue voulue par la formulation source.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible, et l’image hébraïque « voir le bien » est signalée en note. La ponctuation de « mille ans, deux fois » garde l’insistance de l’original sans lourdeur excessive.
