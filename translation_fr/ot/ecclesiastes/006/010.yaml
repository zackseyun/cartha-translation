  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: fr
  text: Tout ce qui est advenu a déjà reçu son nom, et l’on sait ce qu’est l’être humain[a] ; il ne peut contester celui qui est plus puissant que lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est au singulier et désigne ici l’humanité en général.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de Dieu, mais le texte hébreu ne l’affirme pas explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Tout ce qui est advenu
  rationale: Cette formulation conserve la portée générale de l’expression et l’aspect accompli de היה, tout en restant naturelle en français.
- source_word: כְּבָר
  choice: déjà
  rationale: « Déjà » rend avec concision l’idée d’une désignation antérieure et établie.
- source_word: נִקְרָא שְׁמוֹ
  choice: a déjà reçu son nom
  rationale: L’expression hébraïque signifie littéralement que son nom a été appelé. « A reçu son nom » préserve l’image de la nomination sans produire un calque maladroit.
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: et l’on sait ce qu’est l’être humain
  rationale: La tournure exprime un fait reconnu concernant l’identité ou la condition humaine. « L’être humain » restitue ici le singulier représentatif אָדָם de manière claire et inclusive.
- source_word: וְלֹא יוּכַל לָדִין
  choice: il ne peut contester
  rationale: Le verbe דין évoque ici une contestation ou un différend, sans exiger le vocabulaire plus étroit d’une procédure judiciaire.
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  choice: avec plus puissant que lui
  rationale: La traduction garde indéterminée l’identité de celui qui est plus puissant, comme le fait l’hébreu, et rend התקיף par une comparaison de puissance.
theological_decisions:
- issue: Faut-il identifier explicitement comme Dieu celui qui est plus puissant ?
  choice: 'Laisser le référent implicite : « plus puissant que lui »'
  alternative: 'Préciser : « avec Dieu, qui est plus puissant que lui »'
  rationale: Le contexte peut orienter vers Dieu, mais le verset ne le nomme pas. Garder le référent implicite préserve l’ambiguïté et la tension rhétorique du texte.
- issue: Portée de אָדָם
  choice: « l’être humain », au singulier représentatif
  alternative: « l’humanité » ou « l’homme »
  rationale: Le terme désigne ici l’être humain dans sa condition générale, non un homme particulier. Le singulier français conserve cette valeur représentative sans ambiguïté de genre.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe reste proche de la progression hébraïque, tandis que « a reçu son nom » et « l’être humain » évitent des calques peu naturels. Le point-virgule fait ressortir la conséquence concernant les limites humaines.
