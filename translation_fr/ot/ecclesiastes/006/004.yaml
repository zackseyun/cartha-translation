base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/004.yaml
  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
translation:
  language: fr
  text: Car il vient en vain[a] et s’en va dans les ténèbres ; dans les ténèbres, son nom est recouvert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la futilité » ou « comme une vapeur ». Le mot hébreu הֶבֶל, terme clé de l’Ecclésiaste, peut évoquer ce qui est passager, insaisissable, vide ou futile.
    reason: lexical_alternative
  - marker: b
    text: Le fait que « son nom est recouvert » peut signifier que son identité ou son souvenir demeure dans l’obscurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la valeur causale ou explicative de la conjonction.
- source_word: הֶבֶל
  choice: un souffle
  rationale: Rend le terme clé de l’Ecclésiaste par une image naturelle en français, évoquant la brièveté et l’insaisissable sans réduire son sens à la seule futilité.
- source_word: בָּא
  choice: vient
  rationale: Le présent convient à la description générale et maintient le parallélisme avec « s’en va ».
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Conserve la répétition hébraïque ainsi que les résonances conjointes d’obscurité, d’effacement et d’absence de souvenir.
- source_word: יֵלֵךְ
  choice: s’en va
  rationale: Exprime ici le départ de façon naturelle, sans préciser davantage que le texte qu’il s’agit de la mort.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Préserve l’image concrète du nom, qui peut évoquer dans ce contexte l’identité ou le souvenir.
- source_word: יְכֻסֶּה
  choice: est recouvert
  rationale: Maintient la voix passive et l’image d’un nom enveloppé ou soustrait à la vue, plutôt que de remplacer cette image par une explication.
theological_decisions:
- issue: Portée de l’obscurité qui recouvre le nom
  choice: Conserver l’image sans l’expliciter dans le verset
  alternative: Traduire directement que son identité ou son souvenir demeure dans l’oubli
  rationale: Le texte peut viser l’identité, la mémoire ou l’absence de reconnaissance ; une traduction explicative trancherait une ambiguïté réelle.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation garde le parallélisme entre la venue et le départ, ainsi que la répétition rhétorique de « dans les ténèbres ». « Dans un souffle » conserve l’image centrale de הֶבֶל tout en restant intelligible, et les autres nuances sont signalées en note.
