  verdict: revise
  source_fidelity: La structure causale, les deux occurrences de « ténèbres », le passif final et « son nom » sont bien conservés. Toutefois, « vient dans un souffle » suggère principalement une action très brève en français et ne rend pas clairement la qualification existentielle de הֶבֶל (futilité, vacuité, caractère vaporeux). « Il vient en vain » est un rendu idiomatique et fidèle à l’une des valeurs centrales du terme, sans exclure ses autres résonances signalées en note.
  naturalness: « Car il vient en vain » est nettement plus naturel en français international actuel que « Car il vient dans un souffle ». La répétition de « dans les ténèbres » maintient le parallélisme et l’insistance du texte hébreu. « Son nom est recouvert » reste compréhensible et conserve l’image passive sans la surinterpréter.
  terminology: « En vain » rend ici de façon sobre la dimension de futilité de הֶבֶל; la note conserve les nuances de souffle, vapeur, vacuité et caractère éphémère qui font de ce mot un terme clé de l’Ecclésiaste. « Ténèbres » et « nom » préservent respectivement l’image répétée et l’ambiguïté entre identité et souvenir.
  issues:
