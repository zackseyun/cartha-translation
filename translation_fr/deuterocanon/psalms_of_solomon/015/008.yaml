base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/008.yaml
  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
translation:
  language: fr
  text: Car le signe[a] de Dieu est sur les justes, en vue du salut ; la famine, l’épée et la mort[b] sont loin des justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marque ».
    reason: lexical_alternative
  - marker: b
    text: Dans les listes bibliques de fléaux, le mot grec traduit par « mort » peut parfois désigner plus précisément la peste.
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » conserve le sens concret mais ouvert d’un indice ou d’une marque relevant de Dieu, sans imposer l’idée d’une marque nécessairement physique.
- source_word: δικαίους / δικαίων
  choice: les justes
  rationale: L’expression désigne collectivement les personnes justes. « Les justes » est naturel en français et maintient cette valeur générique.
- source_word: εἰς σωτηρίαν
  choice: en vue du salut
  rationale: Cette formulation préserve la valeur de but de εἰς et le poids du nom σωτηρία, sans ajouter un possessif absent du grec.
- source_word: λιμός
  choice: famine
  rationale: Dans cette liste de calamités, « famine » est plus précis que « faim ».
- source_word: ῥομφαία
  choice: épée
  rationale: « Épée » est l’équivalent français usuel et convient à la série traditionnelle des fléaux.
- source_word: θάνατος
  choice: mort
  rationale: Le sens lexical direct est « mort ». Dans certaines listes de jugements inspirées de l’idiome biblique, le terme peut évoquer la peste, possibilité signalée en note sans remplacer le sens explicite du grec.
- source_word: μακράν
  choice: loin de
  rationale: « Être loin de » rend naturellement en français l’éloignement exprimé par μακράν.
theological_decisions:
- issue: Portée de σωτηρία
  choice: salut
  alternative: délivrance
  rationale: « Salut » conserve l’amplitude du terme grec, qui peut inclure une délivrance concrète sans s’y réduire.
- issue: Valeur de θάνατος dans la série des fléaux
  choice: mort dans le texte, avec « peste » en note
  alternative: peste dans le texte
  rationale: Le grec conservé porte explicitement θάνατος, « mort ». La valeur possible de « peste » dans une formule traditionnelle de jugement reste réelle, mais elle ne doit pas être imposée sans signaler l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en étant naturelle ; « en vue du salut » évite d’ajouter « leur », absent du texte source. Les répétitions de « justes » sont conservées pour respecter la structure et l’insistance du verset.
