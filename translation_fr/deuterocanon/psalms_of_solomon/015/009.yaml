base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: fr
  text: 'Car ils fuiront loin des fidèles comme des gens pourchassés par la guerre[a], mais ils poursuivront les pécheurs et les rattraperont. Ceux qui pratiquent l’iniquité n’échapperont pas au jugement du Seigneur : ils seront pris comme par des ennemis aguerris.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des gens chassés par la guerre ». Le grec est très condensé.'
    reason: alternative_reading
lexical_decisions:
- source_word: φεύξονται
  choice: ils fuiront
  rationale: Le futur exprime directement la fuite; « fuiront » est naturel et conserve le mouvement du grec.
- source_word: ὡς διωκόμενοι πολέμου
  choice: comme des gens pourchassés par la guerre
  rationale: La tournure grecque est resserrée et quelque peu ambiguë. Cette traduction en garde l’image militaire sans préciser indûment comment la guerre les poursuit.
- source_word: ἀπὸ ὁσίων
  choice: loin des fidèles
  rationale: Dans les Psaumes de Salomon, ὅσιοι désigne les personnes pieuses ou fidèles; « fidèles » évite de confondre ce groupe avec le vocabulaire plus général des « saints » tout en convenant au complément de « fuir ».
- source_word: καταδιώξονται
  choice: ils poursuivront
  rationale: Le verbe indique une poursuite soutenue ou intensive; « poursuivront » maintient sobrement le parallèle verbal.
- source_word: καταλήψονται
  choice: les rattraperont
  rationale: Après « poursuivront », « rattraperont » rend naturellement l’aboutissement de la poursuite.
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: ceux qui pratiquent le mépris de la Loi
  rationale: La construction participiale décrit une conduite caractéristique. « Mépris de la Loi » conserve ici la référence à la transgression plutôt que de réduire ἀνομία à une méchanceté vague.
- source_word: τὸ κρίμα Κυρίου
  choice: le jugement du Seigneur
  rationale: Cette formulation française naturelle préserve κύριος comme « Seigneur » et κρίμα comme décision ou jugement.
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: ils seront pris comme par des ennemis aguerris
  rationale: Le passif et ὑπό favorisent « par »; « aguerris » exprime l’expérience pratique des ennemis et maintient l’imagerie militaire.
theological_decisions:
- issue: Rendu de κύριος dans τὸ κρίμα Κυρίου
  choice: le jugement du Seigneur
  alternative: la sentence du Seigneur
  rationale: « Seigneur » traduit le titre grec sans introduire un nom d’alliance absent du texte; « jugement » préserve mieux l’étendue sémantique de κρίμα que « sentence ».
- issue: Identification des ὅσιοι
  choice: les fidèles
  alternative: les hommes pieux / les saints
  rationale: « Fidèles » rend la piété et la loyauté religieuse associées à ὅσιοι dans ce livre, sans assimiler automatiquement le terme à ἅγιοι ni imposer une catégorie confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les contrastes et l’enchaînement militaire du grec. « Aguerris » est courant dans ce contexte et plus idiomatique que « ennemis expérimentés ».
