review_pass:
  verdict: revise
  source_fidelity: 'La structure et l’imagerie de la poursuite sont bien rendues : φεύξονται, καταδιώξονται, καταλήψονται et le passif final sont respectés, de même que « les fidèles » pour ὁσίων et « le jugement du Seigneur » pour τὸ κρίμα Κυρίου. En revanche, « le mépris de la Loi » interprète ἀνομία comme un mépris volontaire et explicite d’une Loi identifiée, alors que le grec désigne plus largement l’iniquité / la conduite sans loi. La majuscule et l’idée de mépris ajoutent donc une précision non exprimée.'
  naturalness: Le français est fluide, digne et accessible. « Comme des gens pourchassés par la guerre » conserve utilement la compression étrange de l’image grecque; la note en signale correctement l’ambiguïté. « Pris comme par des ennemis aguerris » est idiomatique et rend bien la comparaison avec des adversaires expérimentés.
  terminology: « Fidèles » est un choix approprié pour ὁσίων dans ce livre et évite l’assimilation automatique avec « saints ». « Seigneur » et « jugement » sont appropriés. « Iniquité » rend ἀνομία dans un registre scripturaire moderne sans imposer l’idée plus étroite de « mépris de la Loi ».
