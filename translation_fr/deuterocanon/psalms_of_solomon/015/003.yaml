revisions:
- from: Car qui en a la force, ô Dieu, sinon pour te rendre grâce[a] en vérité ?
  to: Car qui donc, ô Dieu, a la force de te rendre grâce[a] en vérité ?
  rationale: La révision remplace une ellipse française maladroite par « a la force de », qui rend explicitement et naturellement le lien de ἰσχύει avec l’infinitif. La question rhétorique conserve son sens ; en français, elle véhicule l’exclusivité sous-jacente de εἰ μὴ sans introduire une construction exceptive ambiguë. Le choix « rendre grâce » et la note lexicale sont maintenus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:26Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens principal de ἐξομολογήσασθαι avec Dieu au datif est bien rendu par « rendre grâce ». « En vérité » conserve utilement l’ambiguïté entre vérité et sincérité. Toutefois, ἰσχύει suivi de l’infinitif exprime la capacité à accomplir l’action ; la construction actuelle « qui en a la force … sinon pour » ne rend pas naturellement ce rapport en français.
  naturalness: '« Car qui en a la force, ô Dieu, sinon pour te rendre grâce… ? » est elliptique de manière peu idiomatique : « sinon pour » peut indiquer un but ou une exception portant sur une finalité, plutôt que la capacité de rendre grâce. « a la force de » est naturel et exprime directement la valeur du grec.'
  terminology: « Ô Dieu », « rendre grâce » et « en vérité » conviennent au registre priant et au français international moderne. La note maintient correctement les possibilités de louange et de reconnaissance publique sans imposer le sens pénitentiel de « confesser ».
  issues:
  - severity: medium
    issue: Construction française de la capacité avec « sinon pour »
    rationale: Le grec associe ἰσχύει à l’infinitif (« avoir la force de faire »). En français, « qui en a la force … sinon pour faire » est syntaxiquement et sémantiquement moins clair que « qui a la force de faire ».
  revised_text: Car qui donc, ô Dieu, a la force de te rendre grâce[a] en vérité ?
