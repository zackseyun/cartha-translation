  text: For who is strong[a], O God[b], except to give thanks to you in truth?
translation:
  language: fr
  text: Car qui donc, ô Dieu, a la force de te rendre grâce[a] en vérité ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te louer » ou « te reconnaître ouvertement » ; le verbe grec peut exprimer la louange, l’action de grâce ou l’aveu public.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: qui
  rationale: Le pronom interrogatif introduit une question rhétorique ; « qui » est son équivalent français direct et naturel.
- source_word: ἰσχύει
  choice: en a la force
  rationale: Le verbe exprime ici la force ou la capacité en lien avec l’infinitif qui suit. Cette tournure conserve l’image de la force tout en rendant ce lien intelligible en français.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: L’article avec le nominatif est compris comme une adresse directe dans ce contexte de prière ; « ô Dieu » en restitue le ton solennel.
- source_word: ἐξομολογήσασθαί
  choice: rendre grâce
  rationale: Dans l’usage biblique grec, particulièrement avec un complément au datif désignant Dieu, le verbe exprime couramment la louange reconnaissante ou l’action de grâce. Le contexte dévotionnel favorise ce sens plutôt que celui de confesser des péchés.
- source_word: σοι
  choice: te
  rationale: Le datif marque la personne à qui s’adresse l’action de grâce ; le pronom français « te » est naturel après « rendre grâce ».
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: La traduction formelle préserve à la fois l’idée de conformité à la vérité et la possibilité d’une nuance de sincérité.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Cette locution exceptive est rendue directement par « sinon », malgré le caractère elliptique de la construction grecque.
theological_decisions:
- issue: Sens dévotionnel de ἐξομολογήσασθαί
  choice: te rendre grâce
  alternative: te reconnaître ouvertement / te louer / te confesser
  rationale: Avec Dieu au datif, l’usage biblique du verbe favorise l’action de grâce ou la louange. « Rendre grâce » évite d’introduire sans appui une confession pénitentielle, tandis qu’une note conserve l’étendue lexicale.
- issue: Portée de ἐν ἀληθείᾳ
  choice: en vérité
  alternative: avec sincérité / véritablement
  rationale: La formulation retenue ne tranche pas entre vérité objective et sincérité intérieure, maintenant ainsi la tension sémantique du grec.
translation_notes:
  register: Français international moderne, digne et priant. La tournure « qui en a la force… sinon pour » conserve volontairement l’ellipse et l’étrangeté rhétorique du grec sans les remplacer par une interprétation théologique plus explicite.
