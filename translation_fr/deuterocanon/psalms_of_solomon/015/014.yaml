  text: when God visits the earth with his judgment[a].
translation:
  language: fr
  text: quand Dieu visitera la terre dans son jugement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand Dieu visitera le pays dans son jugement ».
    reason: γῆ peut signifier « terre » ou « pays ». La formulation « dans son jugement » rend de près ἐν κρίματι αὐτοῦ sans présenter le jugement comme un simple instrument.
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit une proposition temporelle avec le subjonctif. « Quand » rend naturellement ici la perspective future sans imposer la nuance itérative de « chaque fois que ».
- source_word: ἐπισκέπτηται
  choice: visitera
  rationale: Le verbe exprime une visite ou une intervention intentionnelle. « Visitera » conserve le langage biblique de la visitation sans décider à lui seul si celle-ci est favorable ou punitive; le complément judiciaire en précise ici la portée.
- source_word: τὴν γῆν
  choice: la terre
  rationale: γῆ peut désigner la terre entière ou un pays. Le contexte ne nommant aucun territoire particulier, « la terre » convient au sens général, tandis que l’autre possibilité est signalée en note.
- source_word: ἐν κρίματι αὐτοῦ
  choice: par son jugement
  rationale: κρίμα désigne un jugement ou une décision judiciaire. Avec un verbe de visitation, « par son jugement » exprime naturellement en français le moyen ou le mode de l’intervention, tout en maintenant sa solennité judiciaire.
theological_decisions:
- issue: Portée de la visitation divine
  choice: Ne pas qualifier explicitement la visitation de châtiment
  alternative: quand Dieu viendra châtier la terre
  rationale: Le grec associe la visitation au jugement, mais ne remplace pas le verbe par un terme signifiant directement « châtier »; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, concis et solennel. Le futur rend naturellement la valeur prospective de ὅταν avec le subjonctif. Le terme biblique « visitera » est conservé afin de ne pas surinterpréter l’intervention divine.
