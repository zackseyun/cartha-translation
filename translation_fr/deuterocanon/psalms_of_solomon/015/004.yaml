  text: And what is man able to do[a], except give thanks to your name?
translation:
  language: fr
  text: Et que peut faire l’être humain, sinon rendre grâce à ton nom[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confesser ton nom » ou « louer ton nom ». Selon le contexte, le verbe grec peut avoir chacun de ces sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δυνατὸς ἄνθρωπος
  choice: que peut faire l’être humain
  rationale: La tournure grecque demande quelle capacité d’agir reste à l’être humain. En français, l’ajout de « faire », implicite dans δυνατός, rend naturellement la question rhétorique.
- source_word: ἄνθρωπος
  choice: l’être humain
  rationale: Le nom désigne ici l’humain de manière représentative et générique; « l’être humain » conserve le singulier sans suggérer exclusivement le sexe masculin.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette question rhétorique, εἰ μή introduit l’unique exception; « sinon » est l’équivalent idiomatique naturel.
- source_word: ἐξομολογήσασθαι
  choice: rendre grâce
  rationale: Dans le grec biblique, surtout lorsque l’acte est dirigé vers Dieu ou son nom, le verbe peut exprimer l’action de grâce ou la louange. « Rendre grâce » convient au contexte doxologique tout en laissant les autres sens en note.
- source_word: τῷ ὀνόματί σου
  choice: à ton nom
  rationale: Cette formulation maintient explicitement le datif grec et l’expression biblique selon laquelle l’action de grâce est adressée au nom de Dieu.
theological_decisions:
- issue: Portée de ἐξομολογήσασθαι
  choice: rendre grâce
  alternative: confesser ton nom; louer ton nom
  rationale: Le contexte favorise l’action de grâce, mais le verbe grec possède une gamme sémantique réelle qui inclut la confession et la louange; la note préserve cette ambiguïté sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le singulier générique du grec sont conservés; « l’être humain » évite une lecture exclusivement masculine.
