  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
translation:
  language: fr
  text: un psaume nouveau avec un chant[a], dans la joie du cœur ; le fruit des lèvres, avec l’instrument bien accordé de la langue[b] ; les prémices des lèvres[c], venant d’un cœur saint et juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « un psaume nouveau accompagné d’un chant ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque est dense et quelque peu difficile. On pourrait aussi traduire : « avec la langue comme instrument bien accordé ».'
    reason: lexical_alternative
  - marker: c
    text: Les expressions « fruit des lèvres » et « prémices des lèvres » conservent l’image d’une offrande, au lieu de la réduire à de simples paroles ou louanges.
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινὸν
  choice: un psaume nouveau
  rationale: « Psaume » conserve le sens littéraire et religieux de ψαλμός, tandis que καινός signifie simplement « nouveau ».
- source_word: μετὰ ᾠδῆς
  choice: avec un chant
  rationale: μετά avec le génitif exprime ici l’accompagnement. « Chant » est le terme français courant pour ᾠδή et évite le registre plus spécialisé d’« ode ».
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: dans la joie du cœur
  rationale: Cette formulation naturelle conserve à la fois l’idée de joie exprimée par εὐφροσύνη et la référence au cœur comme siège intérieur de cette joie.
- source_word: καρπὸν χειλέων
  choice: le fruit des lèvres
  rationale: La traduction littérale préserve une image biblique reconnaissable et évite de la réduire à de simples paroles ou louanges.
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  choice: avec l’instrument bien accordé de la langue
  rationale: 'La formulation maintient la structure poétique compacte du grec : ὄργανον est l’« instrument », ἤρμοσμένῳ évoque ce qui est ajusté ou accordé, et γλώσσης reste un complément au génitif.'
- source_word: ἀπαρχὴν χειλέων
  choice: les prémices des lèvres
  rationale: « Prémices » conserve l’image cultuelle d’une première part offerte, portée par ἀπαρχή, plutôt que de la paraphraser en « paroles ».
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: venant d’un cœur saint et juste
  rationale: « Venant de » rend naturellement ἀπό ; « saint et juste » conserve l’association morale et religieuse de ὁσία et δικαία.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre poétique et digne. La structure nominale et les métaphores des lèvres comme source de fruit et de prémices ont été conservées. La ponctuation par points-virgules rend lisible l’accumulation poétique sans imposer des liens syntaxiques absents ou ambigus dans le grec.
