  text: Car le signe de la destruction est sur leur front.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » rend directement le terme grec et préserve le parallélisme lexical avec les autres emplois de σημεῖον dans le contexte.
- source_word: ἀπωλείας
  choice: de la destruction
  rationale: Le génitif qualifie naturellement le signe comme annonçant ou caractérisant la destruction; cette formulation reste claire sans préciser davantage la relation.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec le génitif τοῦ μετώπου, la préposition indique ici la localisation; « sur » est naturel en français moderne.
- source_word: μετώπου αὐτῶν
  choice: leur front
  rationale: Le grec emploie le singulier distributif; « leur front » le conserve et demeure idiomatique en français.
theological_decisions:
- issue: Valeur exacte du génitif « de la destruction »
  choice: Conserver la formulation ouverte « signe de la destruction »
  alternative: « signe annonçant leur destruction » ou « marque vouée à la destruction »
  rationale: Le grec ne détermine pas explicitement si le signe annonce, caractérise ou entraîne la destruction; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. La conjonction « Car » maintient le lien explicatif de γάρ. Aucun archaïsme ni développement interprétatif.
