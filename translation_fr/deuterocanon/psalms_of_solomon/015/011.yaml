  text: And the inheritance of sinners is destruction and darkness, and their lawlessness will pursue them down to Hades.
translation:
  language: fr
  text: L’héritage des pécheurs, c’est la destruction et les ténèbres, et leur iniquité les poursuivra jusqu’à l’Hadès, en bas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « jusqu’à l’Hadès, au-dessous » ou « jusqu’au séjour des morts, en bas ».'
    reason: La construction ἕως ᾅδου κάτω associe une limite ou destination à l’idée de ce qui est en bas; « Hadès » désigne le domaine des morts plutôt que la géhenne.
lexical_decisions:
- source_word: κληρονομία
  choice: héritage
  rationale: « Héritage » conserve l’image concrète de la part reçue et le contraste implicite entre le sort des pécheurs et une part bénie.
- source_word: ἁμαρτωλῶν
  choice: des pécheurs
  rationale: Équivalent substantival naturel et direct du pluriel grec.
- source_word: ἀπώλεια
  choice: destruction
  rationale: Rend la perte catastrophique exprimée par le grec sans employer le terme vieilli et théologiquement chargé « perdition ».
- source_word: σκότος
  choice: ténèbres
  rationale: Conserve l’image forte du grec ainsi que sa portée morale et eschatologique, dans un registre biblique encore courant.
- source_word: ἀνομία
  choice: mépris de la Loi
  rationale: Exprime ici non une simple méchanceté générale, mais le fait de vivre sans égard pour la loi; la majuscule signale la Loi divine dans ce contexte religieux sans réduire le terme à une infraction ponctuelle.
- source_word: διώξεται
  choice: les poursuivra
  rationale: Préserve le futur et l’image personnifiée d’une poursuite inexorable.
- source_word: ἕως ᾅδου κάτω
  choice: jusque dans l’Hadès, en bas
  rationale: « Jusque dans » rend la limite ou destination marquée par ἕως, tandis que « en bas » représente explicitement κάτω sans le confondre avec le mouvement déjà suggéré par la destination.
theological_decisions:
- issue: Traduction de ᾅδης
  choice: l’Hadès
  alternative: l’enfer; le séjour des morts
  rationale: Le grec nomme l’Hadès, domaine des morts, et non la géhenne. La translittération préserve cette distinction et évite de préciser indûment la nature du châtiment.
- issue: Portée de ἀνομία
  choice: mépris de la Loi
  alternative: iniquité; absence de loi; révolte contre la Loi
  rationale: Cette formulation maintient le rapport étymologique et religieux à la loi sans transformer nécessairement le terme en doctrine technique ni en simple mal moral.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure présentative « c’est » clarifie que « destruction et ténèbres » constituent l’héritage annoncé. « Ténèbres » maintient la force poétique du parallélisme. La répétition de « et » suit la coordination solennelle du grec.
