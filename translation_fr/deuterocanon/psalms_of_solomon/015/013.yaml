  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: fr
  text: Car les péchés dévasteront[a] les maisons des pécheurs, et les pécheurs périront au jour du jugement du Seigneur, à jamais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ravageront » ou « rendront désertes ».
    reason: lexical_alternative
  - marker: b
    text: Litt. « pour l’âge » ; ici rendu par « à jamais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: les péchés
  rationale: Le pluriel désigne directement des fautes concrètes ou accumulées; « les péchés » conserve aussi leur rôle de sujet dans la phrase.
- source_word: ἐξερημώσουσιν
  choice: dévasteront
  rationale: Le verbe exprime l’idée de rendre désert, de ravager ou de ruiner. « Dévasteront » est naturel en français tout en gardant la force du grec.
- source_word: οἴκους
  choice: les maisons
  rationale: « Maisons » rend le sens premier du nom sans l’élargir inutilement à « familles » ou « maisonnées ».
- source_word: ἁμαρτωλῶν / ἁμαρτωλοί
  choice: des pécheurs / les pécheurs
  rationale: La répétition de « pécheurs » reproduit le parallélisme rhétorique du grec sans introduire la notion distincte de « méchants ».
- source_word: ἀπολοῦνται
  choice: périront
  rationale: « Périront » exprime la ruine ou la destruction dans ce contexte judiciaire sans préciser un mécanisme absent du texte.
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: au jour du jugement du Seigneur
  rationale: Cette formulation française naturelle maintient explicitement le rapport génitif entre le jugement et le Seigneur.
- source_word: εἰς τὸν αἰῶνα
  choice: à jamais
  rationale: Dans ce contexte de jugement, l’expression marque une finalité durable. « À jamais » conserve le registre solennel et reste idiomatique.
theological_decisions:
- issue: Portée de εἰς τὸν αἰῶνα
  choice: « à jamais » qualifie le fait que les pécheurs périront
  alternative: L’expression pourrait être rendue littéralement par « pour l’âge » ou comprise plus largement comme renforçant toute la déclaration de jugement.
  rationale: Sa place après la proposition sur la disparition des pécheurs l’attache le plus naturellement à leur sort. La virgule préserve la structure grecque sans faire de l’éternité une caractéristique du jour lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la répétition du grec; le vocabulaire reste solennel sans archaïsme.
