  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: fr
  text: Celui qui fait ces choses ne sera jamais ébranlé par le mal ni par une flamme de feu[a] ; et la colère contre les injustes[b] ne l’atteindra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de mal, d’une flamme de feu ». Le grec rattache vraisemblablement « flamme de feu » au premier verbe, comme autre cause ou source possible d’ébranlement.'
    reason: syntaxe et nuance de la préposition
  - marker: b
    text: 'Ou : « la colère des injustes ». Le génitif grec peut désigner soit les personnes contre lesquelles la colère se dirige, soit celles qui l’éprouvent.'
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: Celui qui fait ces choses
  rationale: Le participe substantivé désigne de manière générale la personne qui accomplit les actes évoqués dans le contexte. Cette formulation conserve le singulier générique et le renvoi explicite de ταῦτα.
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: ne sera jamais ébranlé
  rationale: Le passif futur de σαλεύω exprime l’idée d’être secoué ou déstabilisé, tandis que εἰς τὸν αἰῶνα, sous la négation, marque une durée sans limite. « Ne sera jamais ébranlé » rend naturellement l’ensemble.
- source_word: ἀπὸ κακοῦ
  choice: par le mal
  rationale: Avec le passif σαλευθήσεται, ἀπό peut indiquer ce qui provoque l’ébranlement. « Le mal » garde la portée morale et destructive de κακόν sans le réduire au seul dommage matériel.
- source_word: φλογὸς πυρός
  choice: par une flamme de feu
  rationale: φλογός est au génitif et se comprend au mieux comme dépendant de ἀπό, parallèlement à κακοῦ. La tournure imagée « flamme de feu » conserve l’expression grecque, tandis que la préposition répétée en français clarifie la syntaxe.
- source_word: ὀργὴ ἀδίκων
  choice: la colère contre les injustes
  rationale: 'Le génitif ἀδίκων peut être objectif : la colère dirigée contre les injustes. Cette lecture s’accorde avec l’évocation contextuelle d’un jugement qui ne touche pas le juste, sans effacer l’autre analyse grammaticale possible.'
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: ne l’atteindra pas
  rationale: ἅπτομαι signifie littéralement « toucher » ou « saisir ». Dans ce contexte de menace et de protection, « atteindre » est idiomatique en français et conserve l’idée qu’elle ne viendra pas sur lui.
theological_decisions:
- issue: Valeur morale ou dommageable de ἀπὸ κακοῦ
  choice: par le mal
  alternative: à cause d’un malheur / par le malheur
  rationale: « Le mal » maintient la densité morale du terme tout en pouvant englober ses effets destructeurs.
- issue: Rapport syntaxique de φλογὸς πυρός
  choice: complément de σαλευθήσεται sous la dépendance de ἀπό
  alternative: sujet coordonné de « ne l’atteindra pas »
  rationale: Le génitif φλογός s’accorde avec la dépendance de ἀπό, et non avec un sujet nominatif de ἅψεται. Le français explicite ce rapport par « ni par ».
- issue: Sens du génitif dans ὀργὴ ἀδίκων
  choice: 'génitif objectif : la colère contre les injustes'
  alternative: 'génitif subjectif : la colère des injustes'
  rationale: Les deux analyses sont grammaticalement possibles. Le contexte suivant, qui rattache la colère au jugement du Seigneur contre les pécheurs, favorise le sens objectif; l’alternative est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: 'Français international actuel, digne et lisible. La structure en deux propositions suit les cas grecs : « flamme » est rattachée au premier verbe, tandis que « colère » est le sujet du second. Le point-virgule rend cette articulation sans alourdir le verset.'
