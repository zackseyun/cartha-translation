  text: when it goes out against sinners from the presence of the Lord[a], to destroy every possession of sinners.
translation:
  language: fr
  text: lorsqu’il sortira de la présence du Seigneur contre les pécheurs, pour détruire tout ce que possèdent les pécheurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute leur substance » ; le terme grec peut désigner leurs biens, leurs moyens d’existence ou leur existence même.'
    reason: Préserver l’étendue sémantique de ὑπόστασις sans imposer un seul sens certain.
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit naturellement la proposition temporelle sans imposer une idée de répétition.
- source_word: ἐξέλθῃ
  choice: il sort
  rationale: Le sujet singulier reste implicite dans ce verset et se déduit du contexte précédent; le pronom français est grammaticalement nécessaire sans préciser davantage le référent.
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: contre les pécheurs
  rationale: Avec un verbe de mouvement, ἐπί marque ici une direction hostile dans un contexte de jugement.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: venant de la présence du Seigneur
  rationale: Rend l’idiome grec et rattache clairement l’origine du mouvement au Seigneur, tout en évitant que « contre les pécheurs de la présence » soit mal analysé.
- source_word: ὀλεθρεύσαι
  choice: pour détruire
  rationale: L’infinitif indique le but, éventuellement teinté de résultat; « détruire » conserve sa force sans amplification.
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: tout ce que possèdent les pécheurs
  rationale: Dans ce grec hellénistique, ὑπόστασις peut désigner les biens ou possessions. Cette formulation est idiomatique en français tout en conservant en note l’autre possibilité contextuelle, plus existentielle.
theological_decisions:
- issue: Référent du sujet implicite de ἐξέλθῃ
  choice: Conserver un pronom masculin non identifié dans le verset
  alternative: Nommer explicitement le fléau ou le jugement d’après le contexte précédent
  rationale: Le grec n’énonce pas ici le sujet; la traduction évite d’introduire une identification théologique absente du verset.
- issue: Portée de ὑπόστασις
  choice: Biens ou possessions des pécheurs
  alternative: Existence ou subsistance des pécheurs
  rationale: Le contexte de destruction permet les deux nuances; le texte principal retient le sens concret bien attesté, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et direct. La virgule et le participe « venant » clarifient que « de la présence du Seigneur » indique l’origine de ce qui sort. Le marqueur [a] figure dans le texte principal.
