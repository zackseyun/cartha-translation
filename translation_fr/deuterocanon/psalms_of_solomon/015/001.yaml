  text: When I was in distress[a], I called on the name of the Lord; I hoped for help from the God of Jacob[b], and I was saved.
translation:
  language: fr
  text: Quand j’étais dans la détresse, j’ai invoqué le nom du Seigneur ; j’ai espéré le secours du Dieu de Jacob, et j’ai été sauvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: Quand j’étais dans la détresse
  rationale: La construction ἐν + infinitif articulé a ici une valeur temporelle. « Dans la détresse » rend naturellement l’idée d’oppression ou d’affliction exprimée par θλίβεσθαι.
- source_word: ἐπεκαλεσάμην
  choice: j’ai invoqué
  rationale: Le moyen ἐπεκαλεσάμην désigne un appel adressé à Dieu. « Invoquer » convient à l’expression biblique qui suit et reste clair en français moderne.
- source_word: τὸ ὄνομα Κυρίου
  choice: le nom du Seigneur
  rationale: Cette expression biblique désigne le Seigneur lui-même en tant que personne invoquée ; sa forme traditionnelle peut être conservée sans explication.
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: j’ai mis mon espoir dans le secours du Dieu de Jacob
  rationale: εἰς βοήθειαν est le complément de ἤλπισα, tandis que le génitif τοῦ θεοῦ Ἰακώβ se rattache le plus naturellement à βοήθειαν. « Mettre son espoir dans » exprime idiomatiquement en français la confiance portée vers ce secours.
- source_word: ἐσώθην
  choice: j’ai été sauvé
  rationale: Le passif de σῴζω signifie être sauvé ou délivré. « J’ai été sauvé » reste proche du grec et, dans ce contexte de détresse, désigne naturellement un secours concret sans exclure la portée plus large du verbe.
theological_decisions:
- issue: Portée de ἐσώθην
  choice: j’ai été sauvé
  alternative: j’ai été délivré
  rationale: Le contexte permet les deux sens. Le choix retenu conserve l’étendue sémantique de σῴζω sans préciser indûment la nature du salut.
- issue: Rapport syntaxique entre βοήθειαν et τοῦ θεοῦ Ἰακώβ
  choice: le secours du Dieu de Jacob
  alternative: recevoir du secours de la part du Dieu de Jacob
  rationale: Le génitif se rattache probablement à « secours ». La note signale une formulation française alternative qui explicite la provenance du secours sans transformer directement Dieu en complément grammatical de « espérer ».
translation_notes:
  register: Français international moderne, digne et lisible. Le passé composé donne au témoignage une expression naturelle ; le parallélisme des trois verbes à la première personne est conservé. Le point-virgule reflète l’enchaînement des propositions sans alourdir le verset.
