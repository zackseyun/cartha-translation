  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: fr
  text: Mais ceux qui craignent le Seigneur recevront miséricorde en elle[a], et ils vivront par la miséricorde de leur Dieu, tandis que les pécheurs périront pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en elle ». Le pronom renvoie probablement au jour du jugement du Seigneur mentionné plus haut, mais il pourrait aussi reprendre la terre du verset précédent.'
    reason: alternative_reading
lexical_decisions:
- source_word: φοβούμενοι
  choice: ceux qui craignent
  rationale: Le participe substantivé désigne ceux qui se caractérisent par la crainte révérencielle du Seigneur. Cette formulation française est naturelle et conserve la portée religieuse du grec.
- source_word: κύριον
  choice: le Seigneur
  rationale: « Seigneur » est l’équivalent usuel et digne de κύριος dans ce contexte religieux.
- source_word: ἐλεηθήσονται
  choice: obtiendront miséricorde
  rationale: Cette tournure exprime naturellement en français le fait de recevoir la miséricorde, tout en maintenant l’idée qu’elle leur est accordée plutôt qu’acquise par mérite.
- source_word: ἐν αὐτῇ
  choice: en ce temps-là
  rationale: Le pronom féminin singulier renvoie vraisemblablement au jour du jugement mentionné dans le contexte immédiat. « En ce temps-là » reste idiomatique sans inscrire explicitement « jour » dans le verset; l’incertitude sur l’antécédent est signalée en note.
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: par la miséricorde
  rationale: Ici, ἐλεημοσύνη désigne la miséricorde divine plutôt que l’aumône. « Par » rend clairement la miséricorde de Dieu comme le moyen par lequel ils vivent.
- source_word: ἀπολοῦνται
  choice: périront
  rationale: « Périront » convient au contexte de jugement et rend avec gravité le futur grec sans préciser indûment le mode de la perte.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: pour toujours
  rationale: Cette expression grecque insiste sur une durée sans fin; « pour toujours » en est l’équivalent français le plus naturel.
theological_decisions:
- issue: Antécédent de αὐτῇ
  choice: La traduction « en ce temps-là » privilégie un renvoi au jour du jugement du Seigneur mentionné dans le contexte immédiat.
  alternative: Le pronom peut être conservé plus littéralement par « en lui » ou compris comme renvoyant à la terre du verset précédent.
  rationale: Le jour du jugement fournit l’antécédent contextuel le plus cohérent, mais le grec ne le répète pas et permet un autre rattachement. La note préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination finale est rendue par « tandis que » afin d’éviter la répétition lourde de « mais » tout en maintenant le contraste. Le marqueur [a] figure dans le texte principal.
