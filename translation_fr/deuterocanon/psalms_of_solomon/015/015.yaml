  verdict: revise
  source_fidelity: La structure et le sens général sont fidèles. Toutefois, « en ce temps-là » interprète αὐτῇ en faveur du jour du jugement, alors que le grec emploie simplement le pronom féminin « en elle » et que son antécédent demeure discuté dans le contexte. Le maintien de cette indétermination dans le texte, accompagné d’une note, rend plus exactement la source.
  naturalness: « Obtiendront miséricorde » est compréhensible, mais moins idiomatique en français moderne que « recevront miséricorde » dans ce registre scripturaire. « En elle » est volontairement elliptique, mais la note en explicite la fonction et préserve l’ambiguïté du grec.
  terminology: « Ceux qui craignent le Seigneur », « miséricorde », « leur Dieu », « pécheurs » et « périront pour toujours » conviennent au registre et rendent adéquatement les termes grecs. « Recevront miséricorde » exprime sans surinterprétation le passif futur ἐλεηθήσονται.
  issues:
