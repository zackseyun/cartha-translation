    issue: « en ce temps-là » résout l’antécédent de αὐτῇ dans le texte principal.
    rationale: Bien que le jour du jugement soit un antécédent contextuellement plausible, αὐτῇ signifie littéralement « en elle » et peut aussi reprendre la terre. Puisque l’antécédent est incertain, la traduction principale ne devrait pas le fixer.
  - severity: low
    issue: « obtiendront miséricorde » est une formulation moins naturelle et moins directement réceptive que nécessaire.
    rationale: Le futur passif grec indique que la miséricorde leur est accordée. « Recevront miséricorde » est idiomatique, sobre et conserve cette orientation.
  revised_text: Mais ceux qui craignent le Seigneur recevront miséricorde en elle[a], et ils vivront par la miséricorde de leur Dieu, tandis que les pécheurs périront pour toujours.
