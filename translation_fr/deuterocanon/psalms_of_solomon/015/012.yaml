- source_word: τοῖς τέκνοις αὐτῶν
  choice: chez leurs enfants
  rationale: '« Chez » rend le datif de façon suffisamment large : l’héritage ne sera pas présent parmi leurs enfants ni en leur possession, sans imposer une seule valeur au datif.'
