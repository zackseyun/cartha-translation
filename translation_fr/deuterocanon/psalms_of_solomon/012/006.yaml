base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/006.yaml
  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: fr
  text: Que le Seigneur garde l’âme paisible qui déteste les injustes, et que le Seigneur dirige l’homme qui fait la paix dans la maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le foyer » ou « au sein de la maisonnée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαι
  choice: garde
  rationale: L’optatif aoriste exprime ici un souhait ou une prière; « que… garde » rend naturellement l’idée de protection et de préservation.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Titre divin usuel et direct dans ce contexte de prière.
- source_word: ψυχὴν
  choice: l’âme
  rationale: « Âme » préserve la désignation de la personne intérieure, tout en laissant possible la portée plus large de ψυχή.
- source_word: ἡσύχιον
  choice: paisible
  rationale: Le terme décrit le calme et la tranquillité; « paisible » est naturel en français pour qualifier l’âme.
- source_word: μισοῦσαν ἀδίκους
  choice: qui déteste les injustes
  rationale: Le participe féminin se rapporte à « l’âme »; « les injustes » rend directement l’adjectif substantivé ἀδίκους sans le réduire aux seuls actes commis.
- source_word: κατευθύναι
  choice: dirige
  rationale: Le verbe évoque une direction droite ou bien ordonnée; « dirige » conserve ce sens sans ajouter l’image explicite d’un chemin.
- source_word: ἄνδρα
  choice: l’homme
  rationale: Le grec emploie un nom masculin singulier désignant un homme; la traduction en garde la forme.
- source_word: ποιοῦντα εἰρήνην
  choice: qui fait régner la paix
  rationale: Cette tournure française idiomatique exprime l’action concrète d’établir ou de maintenir la paix.
- source_word: ἐν οἴκῳ
  choice: dans la maison
  rationale: Traduction directe de οἶκος, qui peut désigner aussi bien la maison que le foyer ou la maisonnée; une note conserve cette ambiguïté.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « le Seigneur » et le parallélisme des deux souhaits sont conservés. « Déteste » maintient la force de μισοῦσαν, tandis que « fait régner la paix » évite le calque peu naturel « fait la paix » dans ce contexte domestique.
