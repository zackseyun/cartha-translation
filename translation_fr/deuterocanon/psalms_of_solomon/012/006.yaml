  source_fidelity: 'Le parallélisme optatif est bien rendu par « Que le Seigneur… », et « garde », « l’âme paisible », « les injustes », « dirige », « l’homme » et « dans la maison » correspondent de près au grec. Toutefois, « fait régner la paix » développe ποιοῦντα εἰρήνην : l’expression grecque dit littéralement « faisant la paix » et ne précise pas l’idée de la faire régner ou de la maintenir.'
  naturalness: Le français est moderne, clair et de registre approprié. « Faire la paix dans la maison » est une expression française naturelle dans ce contexte et restitue plus exactement la formulation concise du source.
