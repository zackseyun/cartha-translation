  source_fidelity: 'La structure est bien rendue : γλῶττα reste l’image concrète au singulier, ἀπόλοιτο garde la forme imprécative (« Que … périsse »), et ἐν πυρὶ φλογός est correctement conservé dans une expression poétique. Toutefois, « calomniateurs » est plus précis et plus accusateur que ψιθύρων, qui désigne d’abord ceux qui chuchotent, colportent ou médisent secrètement. « Médisants » préserve mieux cette nuance sans neutraliser la condamnation du contexte. « Loin des fidèles » rend adéquatement ἀπὸ ὁσίων, dont le sens est celui des personnes pieuses/fidèles plutôt que des « saints » au sens technique.'
