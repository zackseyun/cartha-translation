  terminology: « Fidèles » est un bon rendu contextuel de ὁσίων dans les Psaumes de Salomon et évite d’assimiler ce terme à ἅγιοι. La note « hommes pieux » offre une alternative utile. Le remplacement de « calomniateurs » par « médisants » évite de réduire ψιθύρων à l’accusation spécifique de calomnie.
