  yaml_path: translation/deuterocanon/psalms_of_solomon/012/005.yaml
  text: May the tongue of whisperers perish in flaming fire[c][b][a], away from the devout.
translation:
  language: fr
  text: Que la langue des médisants[a] périsse dans un feu flamboyant, loin des fidèles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui chuchotent contre autrui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des hommes pieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶττα
  choice: langue
  rationale: Conserve l’image concrète et singulière du grec plutôt que de l’abstraire en « parole ».
- source_word: ψιθύρων
  choice: calomniateurs
  rationale: Dans ce contexte de condamnation, le terme désigne ceux qui murmurent en secret contre autrui. « Calomniateurs » exprime naturellement en français la portée hostile du mot; « ceux qui parlent en secret » demeure une possibilité plus littérale signalée en note.
- source_word: ἀπόλοιτο
  choice: périsse
  rationale: Le souhait exprimé par l’optatif appelle un jugement; « périsse » en garde la force solennelle sans préciser davantage le mode de destruction.
- source_word: ἐν πυρὶ φλογός
  choice: dans un feu flamboyant
  rationale: Cette formulation idiomatique maintient l’image redoublée du feu et de la flamme ainsi que son intensité poétique.
- source_word: ὁσίων
  choice: fidèles
  rationale: Dans les Psaumes de Salomon, le terme désigne les personnes pieuses et loyales envers Dieu. « Fidèles » est naturel et évite de le confondre avec ἅγιοι, « saints ».
theological_decisions:
- issue: Identité des ὅσιοι
  choice: les fidèles
  alternative: les hommes pieux / les saints
  rationale: « Fidèles » rend l’orientation religieuse et la loyauté du groupe sans importer la catégorie plus technique des « saints ».
translation_notes:
  register: Français moderne, poétique et solennel. La syntaxe conserve l’imprécation du grec et l’image vive de la langue consumée par le feu.
