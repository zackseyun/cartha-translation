  - 802
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: fr
  text: Que les pécheurs[c] périssent loin de la présence du Seigneur, une fois pour toutes[b], et que les fidèles du Seigneur[a] héritent des promesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes pieux du Seigneur » ou « les saints du Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « une fois » ; le grec peut souligner soit le caractère unique de l’événement, soit son caractère définitif.
    reason: lexical_alternative
  - marker: c
    text: Ou « Que des pécheurs périssent » ; toutefois, le grec porte l’article défini et peut viser un groupe déterminé.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: que … périssent
  rationale: L’optatif exprime un souhait ou une prière. La tournure « que … périssent » en restitue naturellement la force sans préciser un agent destructeur.
- source_word: οἱ ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: L’article grec est conservé. Dans le contexte polémique des Psaumes de Salomon, l’expression peut désigner un groupe déterminé plutôt que les pécheurs en général.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: loin de la présence du Seigneur
  rationale: Littéralement « de devant la face du Seigneur ». Cette formulation française naturelle conserve l’idée d’exclusion hors de la présence divine.
- source_word: ἅπαξ
  choice: une fois pour toutes
  rationale: Dans ce contexte, cette traduction fait ressortir la possible valeur définitive de l’adverbe, tout en signalant en note la traduction plus littérale « une fois ».
- source_word: ὅσιοι
  choice: les fidèles
  rationale: Le terme désigne des personnes caractérisées par leur piété et leur attachement à Dieu. « Les fidèles » est naturel en français, tandis que les autres nuances possibles sont conservées en note.
- source_word: κληρονομήσαισαν
  choice: que … héritent
  rationale: Le second optatif poursuit l’expression du souhait. « Hériter » maintient la nuance d’un bien promis reçu en héritage.
- source_word: ἐπαγγελίας
  choice: des promesses
  rationale: Le grec ne porte pas d’article. « Hériter des promesses » demeure naturel en français et évite de déterminer plus que ne le fait explicitement le texte source.
theological_decisions:
- issue: Portée de l’expression « les pécheurs »
  choice: 'Maintien de l’article défini : « les pécheurs »'
  alternative: « des pécheurs » ou « les gens pécheurs »
  rationale: L’article grec et le contexte peuvent pointer vers un groupe polémique particulier. La traduction ne réduit donc pas l’expression à une abstraction morale générale.
- issue: Nuance de ὅσιοι
  choice: « les fidèles » avec variantes en note
  alternative: « les hommes pieux » ou « les saints »
  rationale: Le choix principal souligne la loyauté envers Dieu sans trancher entre sainteté, piété et fidélité, nuances que la note préserve.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme des deux optatifs est rendu par « Que… et que… ». « Loin de la présence » évite le calque peu idiomatique « de la face » tout en exprimant clairement l’éloignement.
