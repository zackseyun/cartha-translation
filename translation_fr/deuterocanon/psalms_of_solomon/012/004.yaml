  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: fr
  text: Que Dieu jette dans le désarroi, en temps de guerre, les maisons des sans-loi, par des lèvres qui chuchotent[a] ! Que Dieu éloigne, dans la détresse[b], des innocents les lèvres des sans-loi, et que les os de ceux qui chuchotent soient dispersés loin de ceux qui craignent le Seigneur !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par des lèvres calomnieuses ». Le groupe de mots grec lié au chuchotement peut désigner des propos malveillants tenus en secret, et non le simple fait de parler à voix basse.
    reason: lexical_alternative
  - marker: b
    text: 'Le rattachement de « dans la détresse » est incertain : l''expression peut qualifier les innocents, les sans-loi ou la situation dans laquelle Dieu les éloigne.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: jette dans le désarroi
  rationale: L’optatif exprime ici un souhait imprécatoire. Cette tournure conserve l’idée d’un bouleversement profond sans alourdir le français.
- source_word: οἴκους
  choice: maisons
  rationale: Le sens concret est conservé, tout en laissant possible l’idée de maisonnées ou de familles.
- source_word: παρανόμους / παρανόμων
  choice: des hommes sans loi
  rationale: Cette expression rend l’opposition à la loi sans réduire le terme à une méchanceté générale.
- source_word: χείλεσι ψιθυροῖς
  choice: par des lèvres qui chuchotent
  rationale: Le français maintient l’image des lèvres et la valeur instrumentale de la construction, tandis que la note explicite la nuance malveillante du groupe lexical.
- source_word: μακρύναι
  choice: éloigne
  rationale: Le verbe exprime le fait de mettre à distance; l’optatif est rendu par une prière introduite par « Que Dieu ».
- source_word: ἀκάκων
  choice: des innocents
  rationale: Le terme désigne des personnes dépourvues de malice ou de méchanceté; « innocents » est naturel et digne en français contemporain.
- source_word: ἐν ἀπορίᾳ
  choice: dans leur détresse
  rationale: Le syntagme peut désigner la détresse, l’impuissance ou une situation sans issue. Le possessif rattache prudemment la détresse aux innocents, tout en signalant l’ambiguïté dans la note.
- source_word: ψιθύρων
  choice: calomniateurs
  rationale: Dans ce contexte, le nom évoque non de simples personnes parlant à voix basse, mais celles qui répandent secrètement des propos malveillants. La note relie ce choix à l’image précédente.
- source_word: φοβουμένων Κύριον
  choice: ceux qui craignent le Seigneur
  rationale: Formule biblique consacrée exprimant la révérence et la fidélité envers le Seigneur.
theological_decisions: []
translation_notes:
  register: Français international moderne, de registre biblique digne mais accessible. La structure en trois souhaits imprécatoires est conservée. « Maisons » maintient l’image concrète grecque, qui peut également englober les maisonnées. Le parallélisme lexical du grec autour du chuchotement est partiellement explicité par la note afin d’éviter en français l’impression de simples paroles discrètes.
