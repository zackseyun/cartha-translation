revisions:
- from: Que Dieu jette dans le désarroi, en temps de guerre, les maisons des hommes sans loi, par des lèvres qui chuchotent[a] ! Que Dieu éloigne des innocents les lèvres des hommes sans loi, dans leur détresse[b], et que les os des calomniateurs soient dispersés loin de ceux qui craignent le Seigneur !
  to: Que Dieu jette dans le désarroi, en temps de guerre, les maisons des sans-loi, par des lèvres qui chuchotent[a] ! Que Dieu éloigne, dans la détresse[b], des innocents les lèvres des sans-loi, et que les os de ceux qui chuchotent soient dispersés loin de ceux qui craignent le Seigneur !
  rationale: La révision conserve les souhaits imprécatoires, l'image des maisons et la terminologie théologique. Elle retire un possessif absent du grec afin de ne pas décider du rattachement de ἐν ἀπορίᾳ, et rétablit dans le dernier membre le motif lexical du chuchotement, dont la nuance calomnieuse reste correctement indiquée en note.
