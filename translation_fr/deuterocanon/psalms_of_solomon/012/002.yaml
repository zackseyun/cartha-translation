translation:
  language: fr
  text: Les paroles qui viennent de la langue d’un homme mauvais prennent toutes sortes de détours[a] ; son charme[b] est comme un feu qui s’allume au milieu d’un peuple.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une diversité de tours » ; le grec évoque des paroles changeantes ou tortueuses.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa beauté ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un feu qui prend au milieu d’un peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: prennent toutes sortes de détours
  rationale: Cette formulation française naturelle conserve à la fois la diversité exprimée par ποικιλίᾳ et l’image des tours ou détours portée par στροφῆς, sans préciser au-delà du grec s’il s’agit de duplicité, d’instabilité ou d’une rhétorique tortueuse.
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: Les paroles de la langue
  rationale: Le tour reste proche de l’image concrète du grec tout en étant compréhensible en français ; « le discours » aurait effacé la mention explicite de la langue.
- source_word: ἀνδρὸς πονηροῦ
  choice: d’un homme mauvais
  rationale: Le singulier masculin de ἀνήρ est conservé. « Mauvais » exprime ici le jugement moral de πονηρός dans un registre courant et digne.
- source_word: καλλονὴ
  choice: charme
  rationale: Dans ce contexte, καλλονή désigne l’attrait de cet homme et son effet social, plutôt que nécessairement sa seule beauté physique. Une note préserve le sens plus littéral « beauté ».
- source_word: πῦρ ἀνάπτον
  choice: un feu qui s’allume
  rationale: 'La relative française rend la valeur active et progressive du participe présent ἀνάπτον : le feu prend ou s’allume, plutôt qu’il n’est présenté passivement comme déjà allumé.'
- source_word: ἐν λαῷ
  choice: au milieu d’un peuple
  rationale: L’expression rend la présence et la propagation potentielles du feu dans une collectivité, tout en conservant l’indéfini du nom grec sans article.
