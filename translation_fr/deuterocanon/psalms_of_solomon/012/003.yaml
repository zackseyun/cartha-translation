base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: fr
  text: Son séjour[a] consiste à remplir les maisons d’une langue mensongère, à abattre les arbres d’une joie[b] qui embrase les gens sans loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa résidence comme étranger » ; le nom grec désigne le fait de demeurer ou de séjourner, souvent parmi des gens dont on n’est pas originaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les arbres d’une joie » ; l’image peut évoquer ce qui fait prospérer une maison et lui donne de la joie.
    reason: cultural_note
  - marker: c
    text: La fin de la phrase est très condensée en grec. Grammaticalement, « qui embrase » se rattache probablement à « joie » ; certains comprennent plutôt l’expression comme « enflammant les gens sans loi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: Son séjour
  rationale: παροικία désigne le fait de demeurer ou de séjourner, souvent avec la nuance d’une résidence parmi des étrangers. « Son séjour » conserve la tournure nominale du grec sans imposer cette nuance contextuelle.
- source_word: ἐμπλῆσαι οἴκους ἐν γλώσσῃ ψεύδει
  choice: remplir les maisons d’une langue mensongère
  rationale: La construction infinitive est conservée après « consiste à ». « Maisons » maintient l’image concrète de οἴκους, et « langue mensongère » rend la formulation grecque compacte sans l’aplatir en simple « discours trompeur ».
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: abattre les arbres d’une joie
  rationale: ἐκκόψαι exprime l’action forte de couper ou d’abattre, tandis que « arbres d’une joie » préserve une métaphore difficile au lieu de la remplacer par une interprétation abstraite.
- source_word: φλογίζούσης παρανόμους
  choice: qui embrase les gens sans loi
  rationale: Le participe féminin au génitif se rattache grammaticalement le plus naturellement à εὐφροσύνης, également féminin au génitif. « Embrase » conserve l’image du feu, et « gens sans loi » rend παρανόμους sans introduire une catégorie confessionnelle.
theological_decisions:
- issue: Rattachement du participe φλογίζούσης
  choice: 'le rattacher à « joie » : « une joie qui embrase les gens sans loi »'
  alternative: 'le comprendre comme une action coordonnée de l’homme : « et enflammer les gens sans loi »'
  rationale: La forme féminine au génitif de φλογίζούσης concorde avec εὐφροσύνης et ne peut pas directement présenter une nouvelle action du sujet masculin. La traduction garde toutefois en note le caractère obscur et comprimé de la proposition.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure nominale et les deux infinitifs du grec sont maintenus. Les images inhabituelles de la langue, des arbres et du feu sont conservées, avec des notes pour les principales ambiguïtés.
