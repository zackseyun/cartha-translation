    rationale: Le grec décrit l’homme comme πονηρός; « mauvais » conserve plus directement ce prédicat moral.
  - severity: low
    issue: L’ancre de la note sur « mon âme » est placée en fin de verset.
    rationale: Elle doit suivre immédiatement l’expression qu’elle explique, afin que son rattachement soit clair.
