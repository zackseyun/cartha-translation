  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
translation:
  language: fr
  text: Seigneur, délivre mon âme[a] d’un homme sans loi et mauvais, d’une langue sans loi et murmurante, qui profère des mensonges et des tromperies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon âme » peut aussi se comprendre comme « ma vie » ou simplement « moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif direct adressé à Dieu; « Seigneur » est naturel dans la prière et correspond à l’usage établi de κύριος.
- source_word: ῥῦσαι
  choice: délivre
  rationale: L’impératif aoriste exprime un appel pressant au secours; « délivre » conserve le registre de la prière et l’idée d’arracher au danger.
- source_word: τὴν ψυχήν μου
  choice: mon âme
  rationale: ψυχή peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici l’image et la gravité poétique sans exclure la portée existentielle.
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: de l’homme qui méprise la loi et fait le mal
  rationale: ἀνήρ est rendu par « homme ». Plutôt que le peu idiomatique « homme sans loi », la formulation verbale exprime παράνομος comme opposition à la loi et πονηρός comme caractère ou conduite mauvaise.
- source_word: γλώσσης παρανόμου καὶ ψιθυροῦ
  choice: d’une langue qui méprise la loi et murmure
  rationale: Les deux adjectifs coordonnés qualifient γλώσσης. La traduction conserve donc « langue » comme noyau et ne transforme pas ψιθυροῦ en nom de personne; « murmure » évoque une parole basse et malveillante sans imposer à lui seul l’interprétation « calomnie ».
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: qui profère mensonge et tromperie
  rationale: Le participe féminin se rapporte à « langue ». « Profère » convient à cet organe de parole, tandis que les deux noms rendent les deux catégories substantivées, le faux et le trompeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme des deux compléments introduits par ἀπό est maintenu. La syntaxe grecque faisant de παρανόμου et ψιθυροῦ deux qualificatifs de « langue » est respectée; la formulation française reste intelligible sans réduire ψιθυρός à la seule calomnie.
