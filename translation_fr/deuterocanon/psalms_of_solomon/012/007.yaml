  text: The Lord’s salvation be upon Israel[a], his servant[b], forever.
translation:
  language: fr
  text: Que le salut du Seigneur soit[a] sur Israël, son serviteur[b], pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le salut du Seigneur est ». Le grec n’a pas ici de verbe exprimé; le contexte, marqué par des souhaits et des prières, favorise « soit ».
    reason: ambiguïté grammaticale
  - marker: b
    text: Ou « son enfant » ou « son fils ». Le mot grec peut avoir chacun de ces sens.
    reason: alternative lexicale
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif exprime naturellement l’appartenance ou l’origine du salut; « Seigneur » est le titre français usuel de κύριος.
- source_word: ἡ σωτηρία
  choice: le salut
  rationale: « Salut » conserve la portée large de σωτηρία, qui peut aussi désigner la délivrance.
- source_word: ἐπὶ Ἰσραήλ
  choice: sur Israël
  rationale: « Sur » préserve l’image de ἐπί et convient à la formulation d’une bénédiction.
- source_word: παῖδα αὐτοῦ
  choice: son serviteur
  rationale: παῖς peut signifier « serviteur », « enfant » ou « fils ». Dans le langage biblique de la relation entre Dieu et Israël, « serviteur » convient au contexte d’alliance sans effacer l’autre lecture, signalée en note.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée sans fin; « pour toujours » est naturel et digne en français moderne.
theological_decisions:
- issue: Valeur de la proposition nominale sans verbe explicite
  choice: 'souhait ou bénédiction : « Que… soit »'
  alternative: 'affirmation : « Le salut du Seigneur est… »'
  rationale: Les verbes optatifs du contexte immédiat favorisent la lecture de cette proposition comme un souhait, tout en laissant grammaticalement possible une affirmation.
- issue: Sens de παῖς appliqué à Israël
  choice: « serviteur »
  alternative: « enfant » ou « fils »
  rationale: « Serviteur » correspond bien à la relation d’alliance et de dépendance envers Dieu; la polysémie réelle du grec est conservée en note.
translation_notes:
  register: Français international moderne, simple et solennel. La structure brève et bénédictionnelle du grec est conservée sans archaïsme.
