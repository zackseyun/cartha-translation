  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: fr
  text: Il purifiera une âme dans les péchés par la confession, par des déclarations publiques.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traduit par « déclarations publiques » est rare et son sens exact demeure incertain; il peut aussi évoquer des aveux ouverts ou une divulgation publique.
    reason: ἐξαγορίαις est au pluriel et possède un sens disputé; la note explicite cette incertitude sans imposer une interprétation.
lexical_decisions:
- source_word: καθαρίσει
  choice: Il purifiera
  rationale: Le futur actif est conservé, ainsi que le sujet implicite à la troisième personne du singulier.
- source_word: ἐν ἁμαρτίαις
  choice: dans ses péchés
  rationale: Cette formulation préserve la préposition grecque ἐν (« dans ») et évite de la remplacer silencieusement par « de ses péchés », qui résoudrait l’ambiguïté du texte.
- source_word: ψυχὴν
  choice: une âme
  rationale: Le nom désigne ici la personne intérieure ou la vie personnelle; « une âme » garde l’image et l’indétermination du grec.
- source_word: ἐν ἐξομολογήσει
  choice: par la confession
  rationale: Dans ce contexte, ἐν peut exprimer le moyen; « confession » rend l’idée d’un aveu ou d’une reconnaissance explicite.
- source_word: ἐν ἐξαγορίαις
  choice: par l’aveu public
  rationale: Le terme rare évoque une déclaration ouverte, une divulgation ou un aveu fait au grand jour; cette traduction le distingue de la « confession » précédente tout en maintenant le parallélisme.
theological_decisions:
- issue: Rapport entre la purification et les péchés
  choice: dans ses péchés
  alternative: de ses péchés
  rationale: Le grec dit ἐν ἁμαρτίαις. La traduction retenue conserve cette construction inhabituelle et ne formule pas plus nettement que la source l’idée d’une purification qui enlèverait les péchés.
- issue: Rôle de la confession
  choice: par la confession, par l’aveu public
  alternative: dans la confession, dans les déclarations publiques
  rationale: Le contexte permet une valeur instrumentale de ἐν. « Par » produit un français naturel sans préciser davantage le mécanisme théologique de la purification.
translation_notes:
  register: Français moderne, sobre et digne. La tournure inhabituelle « dans ses péchés » est volontairement maintenue afin de respecter l’ambiguïté de la formulation grecque.
