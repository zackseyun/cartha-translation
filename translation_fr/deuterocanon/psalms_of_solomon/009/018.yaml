  text: And you set your name upon us, O Lord; and you will never remove it.
translation:
  language: fr
  text: Tu as posé ton nom sur nous, Seigneur, et tu ne cesseras jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθου
  choice: tu as posé
  rationale: L’aoriste moyen de τίθημι exprime ici l’action d’établir ou de placer le nom sur le peuple; le passé composé est naturel en français et garde la portée durable de l’acte.
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: ton nom sur nous
  rationale: Rend directement l’image grecque du nom placé sur la communauté, sans expliciter davantage l’appartenance ou la protection qu’elle peut évoquer.
- source_word: οὐ καταπαύσεις τὸν αἰῶνα
  choice: tu ne le retireras jamais
  rationale: καταπαύω signifie faire cesser ou mettre fin; le complément implicite est compris comme le nom posé sur le peuple. «Jamais» exprime naturellement la négation renforcée par τὸν αἰῶνα.
theological_decisions:
- issue: Permanence du nom divin sur la communauté
  choice: tu ne le retireras jamais
  alternative: tu ne le feras jamais cesser
  rationale: La formulation retenue communique la permanence affirmée par le grec tout en restant idiomatique, sans développer une doctrine particulière de l’élection ou de l’alliance.
translation_notes:
  register: Français moderne, simple et digne. L’adresse «Seigneur» conserve le vocatif Κύριε; la répétition de «et» respecte la coordination du grec.
