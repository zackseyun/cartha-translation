  source_fidelity: La première proposition rend fidèlement καὶ ἔθου τὸ ὄνομά σου ἐφʼ ἡμᾶς. En revanche, « tu ne le retireras jamais » introduit un pronom objet (« le », le nom) et le sens spécifique de retirer, qui ne sont pas exprimés dans le grec. Dans οὐ καταπαύσεις τὸν αἰῶνα, le sujet demeure « tu »; καταπαύσεις signifie « cesser / prendre fin », et τὸν αἰῶνα fonctionne comme complément temporel (« pour toujours »).
  naturalness: « Tu as posé ton nom sur nous, Seigneur » est naturel, sobre et convient au registre de prière. « Tu ne cesseras jamais » est également idiomatique en français moderne et laisse, comme le grec, l’ellipse sans lui imposer un objet.
  terminology: « Seigneur » rend correctement le vocatif Κύριε. « Ton nom » conserve l’expression biblique sans expliciter ses implications théologiques. La révision évite d’identifier sans nécessité ce qui ne cessera pas avec le « nom » précédemment mentionné.
