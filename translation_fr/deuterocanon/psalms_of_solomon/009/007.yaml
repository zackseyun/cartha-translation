  yaml_path: translation/deuterocanon/psalms_of_solomon/009/007.yaml
  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: fr
  text: Il dépend du choix et du pouvoir[a] de notre âme de faire ce qui est juste et ce qui est injuste par les œuvres de nos mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « autorité » ou « maîtrise ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « par les œuvres de nos mains » ; le grec peut aussi se comprendre comme « dans les œuvres de nos mains ».
    reason: source_form_and_ambiguity
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: nos actes
  rationale: « Actes » exprime naturellement en français des actions moralement significatives, tandis que « œuvres » est conservé dans l’image concrète finale des mains.
- source_word: ἐν ἐκλογῇ
  choice: relèvent du choix
  rationale: Ici, ἐκλογή désigne la faculté ou l’acte de choisir, non une « élection » au sens théologique. « Relèvent du » rend idiomatiquement la construction ἐν sans réduire le choix à une simple circonstance.
- source_word: ἐξουσίᾳ
  choice: pouvoir
  rationale: Le contexte porte sur la capacité et la maîtrise morales de la personne. « Pouvoir » est naturel en français ; la nuance possible d’autorité est signalée en note.
- source_word: τῆς ψυχῆς ἡμῶν
  choice: de notre âme
  rationale: Cette formulation transparente conserve le terme ψυχή et situe le choix moral dans l’être intérieur.
- source_word: τοῦ ποιῆσαι
  choice: faire
  rationale: L’infinitif français maintient sans la préciser excessivement la valeur explicative, finale ou capacitaire de la construction grecque.
- source_word: δικαιοσύνην καὶ ἀδικίαν
  choice: ce qui est juste et ce qui est injuste
  rationale: Cette paire française naturelle préserve l’opposition lexicale étroite du grec et sa portée morale, sans limiter δικαιοσύνη à la seule justice sociale ni employer le lourd couple « justice et non-justice ».
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: par les œuvres de nos mains
  rationale: La formulation conserve l’image concrète des mains et rend le datif comme moyen ou instrument de l’action.
theological_decisions:
- issue: Forte affirmation de la responsabilité morale humaine
  choice: « relèvent du choix et du pouvoir de notre âme »
  alternative: « sont dans le choix et l’autorité de notre âme »
  rationale: Le texte attribue explicitement à l’être humain une capacité de choisir et d’agir justement ou injustement. La traduction maintient cette affirmation sans l’harmoniser avec un système doctrinal particulier.
- issue: Coordination de δικαιοσύνη et ἀδικία par καί
  choice: « ce qui est juste et ce qui est injuste »
  alternative: « ce qui est juste ou ce qui est injuste »
  rationale: Le « et » du grec est conservé plutôt que remplacé par un « ou » interprétatif, même si les deux possibilités morales sont naturellement comprises comme opposées.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la densité morale et la structure contrastive du grec, tout en évitant l’emploi théologique trompeur d’« élection » pour ἐκλογή.
