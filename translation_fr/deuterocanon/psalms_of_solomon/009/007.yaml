  source_fidelity: 'Le sens fondamental est bien rendu : les actes humains sont placés sous la capacité de choix et d’action de l’âme, en vue de pratiquer la justice et l’injustice par les œuvres des mains. « Pouvoir » rend convenablement ἐξουσία, sans imposer la nuance institutionnelle d’« autorité ». La coordination « et » est préservée. Toutefois, dans le texte français, l’infinitif isolé après les deux-points (« : faire ») n’est pas bien rattaché syntaxiquement à la proposition précédente.'
