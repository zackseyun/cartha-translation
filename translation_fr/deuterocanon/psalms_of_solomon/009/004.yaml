lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’affirmation précédente; « Car » en conserve naturellement la valeur causale.
- source_word: κριτὴς δίκαιος
  choice: un juge juste
  rationale: « Juge » rend directement κριτής, tandis que « juste » exprime ici la rectitude du juge en français moderne et évite la tournure moins naturelle « juge droit ».
- source_word: ἐπὶ
  choice: qui exerce son autorité sur
  rationale: Dans ce contexte, la préposition indique la juridiction ou l’autorité du juge. Cette formulation explicite ce rapport plus naturellement que le calque « sur » seul.
- source_word: πάντας τοὺς λαοὺς
  choice: tous les peuples
  rationale: Le pluriel λαούς désigne l’ensemble des groupes humains; « peuples » en préserve la pluralité sans lui imposer le sens politique moderne de « nations ».
- source_word: τῆς γῆς
  choice: de la terre
  rationale: La portée universelle de « tous les peuples » favorise « terre » plutôt que le sens localisé « pays ».
theological_decisions: []
