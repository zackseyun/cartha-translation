base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
translation:
  language: fr
  text: Quand Israël fut emmené en exil dans une terre étrangère, quand ils se détournèrent du Seigneur[a], qui les avait rachetés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’éloignèrent du Seigneur » ; le verbe peut aussi exprimer l’idée d’abandon ou d’apostasie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: fut emmené
  rationale: L’infinitif passif indique qu’Israël subit son déplacement. « Fut emmené » rend naturellement cette déportation sans suggérer un départ volontaire.
- source_word: ἀποικεσίᾳ
  choice: en exil
  rationale: Dans ce contexte, le terme désigne la condition d’un peuple déplacé hors de son pays. « En exil » est clair et idiomatique en français moderne.
- source_word: γῆν ἀλλοτρίαν
  choice: dans une terre étrangère
  rationale: L’expression désigne une terre qui n’est pas celle d’Israël. « Une terre étrangère » en conserve le sens et la force.
- source_word: ἀποστῆναι
  choice: se détournèrent
  rationale: Le verbe peut désigner un éloignement ou une défection. « Se détournèrent » garde ici la dimension relationnelle et religieuse sans imposer un terme technique.
- source_word: Κυρίου
  choice: Seigneur
  rationale: « Seigneur » est le rendu français traditionnel et naturel de κύριος dans ce contexte d’alliance.
- source_word: τοῦ λυτρωσαμένου
  choice: qui les avait rachetés
  rationale: Le participe présente le Seigneur comme celui qui avait auparavant délivré Israël en exerçant le rôle de rédempteur. « Rachetés » préserve cette résonance mieux qu’un simple « délivrés ».
theological_decisions:
- issue: Portée de ἀποστῆναι
  choice: se détournèrent du Seigneur
  alternative: s’éloignèrent du Seigneur ; abandonnèrent le Seigneur ; apostasièrent
  rationale: Le texte peut évoquer aussi bien l’éloignement que la défection religieuse. Le corps du texte conserve cette amplitude, et la note signale explicitement la possibilité d’une apostasie sans la rendre obligatoire.
translation_notes:
  register: Français moderne, sobre et dignifié. Le passage du singulier collectif « Israël » au pluriel « ils/les » reproduit le mouvement du grec, qui traite ensuite Israël comme un ensemble de personnes. La virgule finale est conservée parce que le verset fourni forme une proposition introductive inachevée.
