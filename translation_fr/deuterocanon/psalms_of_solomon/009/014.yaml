  text: And to whom will he forgive sins, if not to those who have sinned?
translation:
  language: fr
  text: Et à qui pardonnera-t-il les péchés, sinon à ceux qui ont péché ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  choice: pardonnera-t-il
  rationale: Le futur actif de ἀφίημι, avec « les péchés » pour complément, signifie naturellement « pardonner ». Le futur et la forme interrogative sont conservés.
- source_word: ἁμαρτίας
  choice: les péchés
  rationale: Le pluriel désigne directement les péchés. L’article défini est idiomatique en français dans la construction « pardonner les péchés ».
- source_word: τοῖς ἡμαρτηκόσι
  choice: à ceux qui ont péché
  rationale: Cette formulation conserve la valeur verbale du participe parfait actif et évite de réduire les personnes à l’étiquette « pécheurs ».
- source_word: τίνι
  choice: à qui
  rationale: Le datif grec est rendu naturellement par « à qui » avec le verbe français « pardonner ».
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette question rhétorique, « sinon » exprime clairement et avec concision le sens exceptif de εἰ μή.
theological_decisions:
- issue: Portée du pardon divin
  choice: Une question rhétorique affirmant que le pardon s’adresse à ceux qui ont effectivement péché.
  alternative: Comprendre plus étroitement qu’il s’adresse seulement à ceux qui ont déjà conscience de leur péché.
  rationale: Le grec mentionne simplement « ceux qui ont péché » et ne précise ni leur état de conscience ni d’autres conditions. La traduction préserve donc la force rhétorique sans ajouter de système doctrinal.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle; « ceux qui ont péché » préserve la nuance du participe plutôt que d’employer le substantif plus catégorisant « pécheurs ».
