revisions:
- from: Celui qui pratique la justice[a] met en réserve pour lui-même la vie auprès du Seigneur[b], et celui qui commet l’injustice est lui-même responsable de la perdition de son âme[c][d].
  to: Celui qui pratique la justice[a] amasse pour lui-même la vie auprès du Seigneur[b], et celui qui commet l’injustice est lui-même responsable de son âme dans la destruction[c][d].
  rationale: La révision remplace l’interprétation causale « de la perdition de son âme » par une formulation qui conserve l’association, grammaticalement concise et sémantiquement ouverte, entre l’âme/la vie et la destruction. Elle remplace aussi « met en réserve » par « amasse » afin de mieux garder la métaphore de θησαυρίζει. Les alternatives pertinentes sont maintenues dans les notes, sans imposer une lecture doctrinale ou syntaxique contestable.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:21Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement le contraste moral, l’image de l’accumulation et la nuance de proximité de παρὰ Κυρίῳ. Dans la seconde, « responsable de la perdition de son âme » fixe toutefois ἐν ἀπωλείᾳ comme un génitif causal ou possessif (« la destruction de son âme »), alors que le grec le rattache plus sobrement à la responsabilité concernant l’âme/la vie dans la destruction. Cette interprétation ne devrait pas être imposée dans le texte principal.
  naturalness: Le français est globalement moderne et clair. « Met en réserve » est recevable, mais « amasse » exprime plus naturellement l’image de θησαυρίζει. La formulation révisée de la dernière proposition reste volontairement proche de la concision ambiguë du grec tout en demeurant lisible.
  terminology: « Pratique la justice », « injustice », « âme » et « Seigneur » conviennent au registre et au parallélisme du verset. La note sur ψυχή préserve correctement les sens possibles (« vie », « personne »). « Destruction » est ici plus neutre que « perdition » et évite de charger ἀπώλεια d’une précision doctrinale non explicitée.
  issues:
  - severity: medium
    issue: La principale formulation interprète de façon trop précise ἐν ἀπωλείᾳ.
    rationale: « La perdition de son âme » présente la destruction comme l’objet directement causé ou possédé par l’âme. Le grec dit littéralement que l’auteur de l’injustice est responsable de son âme « dans la destruction »; le lien exact doit rester ouvert.
  - severity: low
    issue: « Met en réserve » affaiblit légèrement l’imagerie de θησαυρίζει.
    rationale: « Amasse » conserve plus directement l’idée d’accumuler un trésor, tout en restant naturel en français contemporain.
