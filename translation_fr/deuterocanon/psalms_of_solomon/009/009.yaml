base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/009.yaml
  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
translation:
  language: fr
  text: Celui qui pratique la justice[a] amasse pour lui-même la vie auprès du Seigneur[b], et celui qui commet l’injustice est lui-même responsable de son âme dans la destruction[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture »; le terme peut aussi évoquer le fait d’agir selon ce qui est juste.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant le Seigneur »; éventuellement « venant du Seigneur ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement, « est lui-même responsable de son âme dans la destruction ». On peut aussi comprendre : « est coupable quant à sa vie en vue de la ruine » ou « est lui-même responsable de lui-même dans la ruine ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: celui qui pratique / celui qui commet
  rationale: Le participe substantivé désigne de manière générale celui qui accomplit l’action. La variation française évite la tournure peu naturelle « faire la justice / faire l’injustice », sans imposer une valeur aspectuelle technique.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: Dans ce contraste moral de type sapiential, « justice » exprime une conduite conforme à ce qui est droit et reste le correspondant français naturel de δικαιοσύνη.
- source_word: θησαυρίζει
  choice: met en réserve
  rationale: Cette expression conserve l’image d’un bien accumulé et gardé, tout en étant plus naturelle en français actuel que « thésaurise ».
- source_word: ζωὴν
  choice: la vie
  rationale: Le nom désigne ici la vie comme bien acquis ou conservé auprès du Seigneur; l’article défini est idiomatique en français.
- source_word: αὐτῷ
  choice: pour lui-même
  rationale: Le datif a ici une valeur bénéficiaire et réflexive, soulignant que le fruit de l’action revient à son auteur.
- source_word: παρὰ Κυρίῳ
  choice: auprès du Seigneur
  rationale: παρά avec le datif peut exprimer la proximité ou la situation auprès de quelqu’un. « Auprès du Seigneur » préserve ce sens sans exclure totalement les nuances de présence ou d’origine.
- source_word: ἀδικίαν
  choice: l’injustice
  rationale: Ce choix maintient l’opposition lexicale directe avec δικαιοσύνη, même si le terme peut aussi désigner plus largement le mal ou l’iniquité.
- source_word: αἴτιος
  choice: responsable
  rationale: L’adjectif exprime la responsabilité ou la culpabilité. « Responsable » rend clairement l’imputabilité personnelle sans limiter le sens à une déclaration juridique de culpabilité.
- source_word: τῆς ψυχῆς
  choice: de son âme
  rationale: ψυχή peut désigner l’âme, la vie ou la personne elle-même. « Âme » conserve ici la portée morale et religieuse de l’avertissement, tandis qu’une note signale l’étendue sémantique.
- source_word: ἐν ἀπωλείᾳ
  choice: de la perdition
  rationale: La formulation principale rattache naturellement en français la perdition à l’âme, mais la construction grecque demeure concise et ambiguë; une note donne une traduction plus formelle qui maintient la valeur ouverte de ἐν.
theological_decisions:
- issue: Responsabilité personnelle et perdition dans la seconde proposition
  choice: Le malfaiteur est lui-même responsable de la perdition de son âme.
  alternative: Il est responsable de son âme dans la perdition, ou coupable quant à sa vie en vue de la ruine.
  rationale: La formulation retenue est claire en français et exprime la responsabilité personnelle indiquée par αὐτὸς αἴτιος. La note conserve toutefois l’ambiguïté de la construction grecque et évite de présenter le lien causal comme la seule analyse possible.
- issue: Sens de ψυχή
  choice: âme
  alternative: vie ou personne elle-même
  rationale: « Âme » garde la gravité religieuse du passage, mais le terme grec ne tranche pas nettement entre une composante intérieure, la vie de l’individu et l’individu lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme moral est conservé, ainsi que la coordination par « et ». La première proposition garde l’image de l’accumulation; la seconde adopte une syntaxe française lisible tout en documentant en note la formulation grecque plus abrupte et son ambiguïté.
