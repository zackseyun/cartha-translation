  text: To whom will you show kindness[a], O God[b], if not to those who call on the Lord?
translation:
  language: fr
  text: Envers qui te montreras-tu bon, ô Dieu, sinon envers ceux qui invoquent le Seigneur ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνι
  choice: envers qui
  rationale: Le datif interrogatif désigne le bénéficiaire de la bonté divine; « envers qui » convient naturellement avec « se montrer bon » et conserve la question rhétorique.
- source_word: χρηστεύσῃ
  choice: te montreras-tu bon
  rationale: Cette forme verbale à la deuxième personne du singulier s’adresse directement à Dieu et exprime une conduite bienveillante. Cette traduction évite de la lire comme une troisième personne.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif articulé fonctionne ici comme une interpellation en grec hellénistique, en accord avec la deuxième personne du verbe.
- source_word: ἐπικαλουμένοις
  choice: ceux qui invoquent
  rationale: Le participe désigne ceux qui font appel au Seigneur ou l’invoquent; « invoquent » est précis, naturel dans ce registre religieux et moins ambigu que « appellent ».
- source_word: κύριον
  choice: le Seigneur
  rationale: Dans ce contexte religieux, κύριος désigne le Seigneur comme celui auquel on fait appel.
theological_decisions:
- issue: Personne grammaticale et fonction de ὁ θεός
  choice: 'Adresse directe à Dieu: « te montreras-tu bon, ô Dieu »'
  alternative: « Dieu se montrera-t-il bon »
  rationale: χρηστεύσῃ est à la deuxième personne du singulier, tandis que ὁ θεός sert d’interpellation; la lecture à la troisième personne ne respecte pas la syntaxe.
translation_notes:
  register: Français moderne, digne et accessible. La structure rhétorique « sinon envers ceux qui… » ainsi que la distinction entre « Dieu » interpellé et « le Seigneur » invoqué sont conservées sans les harmoniser.
