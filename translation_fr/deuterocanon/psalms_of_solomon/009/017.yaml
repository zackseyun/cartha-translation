  text: For you chose the offspring of Abraham above all the nations[b][a],
translation:
  language: fr
  text: Car tu as choisi la descendance d’Abraham[a], de préférence à toutes les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence d’Abraham » ; autre traduction : « les descendants d’Abraham ».'
