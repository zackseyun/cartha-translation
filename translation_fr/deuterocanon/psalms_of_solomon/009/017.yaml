  - marker: b
    text: 'Autres traductions possibles : « au-dessus de toutes les nations » ou « plus que toutes les nations ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡρέτισω
  choice: tu as choisi
  rationale: Le verbe exprime un choix ou une sélection. « Tu as choisi » en donne le sens direct et naturel, tout en conservant l’adresse à Dieu à la deuxième personne.
- source_word: τὸ σπέρμα Ἀβραάμ
  choice: la descendance d’Abraham
  rationale: Dans ce contexte, le singulier collectif σπέρμα désigne la lignée issue d’Abraham. « Descendance » est idiomatique en français moderne et garde cette valeur collective; « semence » serait plus littéral, mais moins naturel.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: plutôt que toutes les nations
  rationale: Avec l’accusatif, παρά porte ici une valeur comparative de préférence. « Plutôt que » exprime clairement le choix préférentiel sans introduire une idée spatiale.
- source_word: ἔθνη
  choice: nations
  rationale: « Nations » est le terme français le plus direct et le moins chargé d’interprétation. « Païens » introduirait une caractérisation religieuse que le grec n’impose pas à lui seul.
theological_decisions:
- issue: L’élection de la descendance d’Abraham par rapport aux nations
  choice: Exprimer directement que Dieu a choisi la descendance d’Abraham plutôt que toutes les nations.
  alternative: Dieu a choisi la descendance d’Abraham parmi toutes les nations; Dieu l’a préférée à toutes les nations.
  rationale: Le grec présente un choix divin assorti d’une comparaison. La formulation retenue conserve la force de cette préférence sans la transformer en système doctrinal ni supprimer l’ambiguïté possible de παρά.
translation_notes:
  register: Français international moderne, clair et digne. « Car » maintient le lien causal de ὅτι. Le tutoiement singulier traduit explicitement σύ. Les notes préservent la valeur collective de σπέρμα et l’ambiguïté comparative ou séparative possible de παρά.
