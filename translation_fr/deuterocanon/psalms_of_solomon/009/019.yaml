base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/019.yaml
  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
translation:
  language: fr
  text: Tu as conclu avec nos pères une alliance qui nous concernait, et nous espérerons en toi lors du retour de notre âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque nous nous repentirons » ; littéralement : « dans le retour de notre âme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  choice: tu as conclu… une alliance
  rationale: La tournure grecque associe διαθήκη et διατίθημι dans une expression d’alliance. « Conclure une alliance » restitue naturellement en français l’action exprimée par l’ensemble, sans transformer ἐν διαθήκῃ en complément prépositionnel isolé.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: avec nos pères
  rationale: Le datif désigne ici les partenaires ancestraux de l’alliance. « Nos pères » conserve la formulation historique et patriarcale explicite du grec.
- source_word: περὶ ἡμῶν
  choice: qui nous concernait
  rationale: περί avec le génitif signifie directement « au sujet de, concernant ». La proposition relative donne une syntaxe française naturelle tout en évitant le sens plus interprétatif « en notre faveur ».
- source_word: ἐλπιοῦμεν ἐπὶ σέ
  choice: nous espérerons en toi
  rationale: Le futur ἐλπιοῦμεν est conservé. « Espérer en toi », tournure française soutenue mais claire, exprime l’orientation personnelle de l’espérance marquée par ἐπί.
- source_word: ἐν ἐπιστροφῇ ψυχῆς ἡμῶν
  choice: lors du retour de notre âme
  rationale: « Retour » maintient l’image de ἐπιστροφή et sa possible portée pénitentielle sans la réduire explicitement au repentir. Le singulier collectif « notre âme » correspond à ψυχῆς ἡμῶν.
theological_decisions:
- issue: Faut-il rendre ἐπιστροφῇ ψυχῆς ἡμῶν explicitement par le repentir ?
  choice: lors du retour de notre âme
  alternative: lorsque nous nous repentirons
  rationale: Le contexte peut donner à ἐπιστροφή une valeur de repentance ou de conversion, mais le grec conserve l’image plus large d’un retour. Le texte principal préserve cette tension, et la note signale l’interprétation pénitentielle.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le futur, le singulier collectif « notre âme » et le langage biblique de l’alliance, tout en évitant un calque syntaxique obscur.
