base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/015.yaml
  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: fr
  text: Tu béniras les justes, et tu ne leur demandes pas compte des fautes qu’ils ont commises ; ta bonté se porte sur ceux qui pèchent et se repentent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ceux qui pèchent dans le repentir ». Le terme grec peut aussi évoquer le regret ou le remords.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: les justes
  rationale: L’adjectif substantivé désigne les personnes caractérisées par la justice. « Les justes » est naturel, digne et traditionnel en français biblique.
- source_word: εὐλογήσεις
  choice: tu béniras
  rationale: Le futur grec est explicite et contraste avec le présent qui suit.
- source_word: οὐκ εὐθύνεις
  choice: tu ne leur demandes pas compte
  rationale: Le présent εὐθύνεις exprime ici l’action de demander des comptes. Le présent est conservé, malgré le futur précédent, afin de respecter le changement de temps du grec.
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: des fautes qu’ils ont commises
  rationale: Cette formulation idiomatique exprime les actes pour lesquels ils ont péché sans reproduire une tournure grecque maladroite en français.
- source_word: χρηστότης
  choice: bonté
  rationale: « Bonté » conserve l’étendue morale et bienveillante du terme, tandis que « bienveillance » serait également possible.
- source_word: ἁμαρτάνοντας
  choice: ceux qui pèchent
  rationale: La traduction verbale préserve la valeur du participe et évite d’en faire une désignation figée comme « les pécheurs ».
- source_word: ἐν μεταμελείᾳ
  choice: et se repentent
  rationale: 'La coordination donne en français le sens contextuel le plus naturel : la bonté de Dieu s’adresse à ceux qui ont péché dans une disposition de repentir. La nuance de regret ou de remords est signalée en note.'
theological_decisions:
- issue: Rapport entre le péché et μεταμέλεια
  choice: « ceux qui pèchent et se repentent »
  alternative: « ceux qui pèchent dans le repentir »
  rationale: La traduction évite de suggérer que l’acte de pécher serait accompli en état de repentance, tout en maintenant le repentir comme caractéristique des personnes auxquelles se porte la bonté divine.
translation_notes:
  register: Français international moderne, courant et digne. Le contraste temporel entre « tu béniras » et « tu ne… demandes pas » reproduit le futur εὐλογήσεις et le présent εὐθύνεις du texte grec. Le point-virgule maintient les trois propositions étroitement liées.
