  text: So that you may be vindicated[a], O God, in your righteousness amid our lawless deeds[c][b];
translation:
  language: fr
  text: Afin que tu sois reconnu juste[a], ô Dieu, dans ta justice, au milieu de nos actes contraires à la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que tu sois justifié ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « à propos de nos actes contraires à la loi » ou « au milieu de nos transgressions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: Afin que
  rationale: Introduit ici un but ou un résultat et conserve le lien logique avec le contexte précédent.
- source_word: δικαιωθῇς
  choice: tu sois reconnu juste
  rationale: Avec Dieu comme sujet, le passif exprime le fait que sa justice est manifestée ou reconnue, non qu’il devient juste. Cette formulation reste naturelle en français tout en conservant la portée judiciaire du verbe.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif grec remplit ici une fonction vocative dans une adresse de prière; « ô Dieu » en garde le ton solennel.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: dans ta justice
  rationale: « Justice » couvre ici la rectitude de Dieu et sa juste manière d’agir. La préposition « dans » préserve la formulation ouverte du grec quant à la sphère ou au fondement de cette reconnaissance.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: au milieu de nos actes contraires à la Loi
  rationale: La seconde construction avec ἐν se prête au sens local ou circonstanciel « au milieu de ». ἀνομίαι désigne plus précisément des violations ou des rejets de la Loi que de simples fautes.
theological_decisions:
- issue: Sens de δικαιωθῇς lorsque Dieu est le sujet
  choice: « tu sois reconnu juste »
  alternative: « tu sois justifié »
  rationale: Le choix principal évite de suggérer que Dieu acquiert la justice, tout en exprimant que sa rectitude est établie ou reconnue. La traduction plus formelle demeure en note.
- issue: Portée de δικαιοσύνη
  choice: « justice »
  alternative: « droiture »
  rationale: Le contexte possède une tonalité judiciaire, mais le terme grec peut aussi désigner plus largement la rectitude; l’alternative est donc signalée sans imposer une lecture doctrinale.
- issue: Rapport exprimé par ἐν ταῖς ἀνομίαις ἡμῶν
  choice: « au milieu de nos actes contraires à la Loi »
  alternative: « à propos de nos actes contraires à la Loi »
  rationale: Le texte principal suit directement la valeur circonstancielle de ἐν et préserve l’image de la justice divine manifestée au sein des transgressions humaines, sans exclure une valeur de référence.
translation_notes:
  register: Français moderne, digne et adapté à la prière. « Actes contraires à la Loi » rend la force de ἀνομίαι sans employer le terme abstrait et peu courant « iniquités ». Les deux marqueurs de note figurent dans le texte principal.
