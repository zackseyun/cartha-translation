  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: fr
  text: Et maintenant, tu es Dieu, et nous sommes ton peuple, celui que tu as aimé. Regarde et prends pitié de nous, Dieu d’Israël, car nous sommes à toi. Ne retire pas de nous ta compassion, de peur qu’ils ne nous attaquent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτείρησον
  choice: prends pitié de nous
  rationale: L’impératif exprime une compassion active envers le peuple; cette formulation est naturelle en français et explicite le complément implicite.
- source_word: ἔλεός
  choice: compassion
  rationale: Le terme désigne ici la miséricorde compatissante de Dieu; « compassion » évite une répétition immédiate de « pitié » tout en conservant le champ sémantique.
- source_word: ἐπιθῶνται ἡμῖν
  choice: qu’ils ne nous attaquent
  rationale: Avec le datif, le verbe signifie se jeter sur quelqu’un ou l’attaquer; la traduction conserve le sujet indéfini au pluriel du grec.
theological_decisions:
- issue: Affirmation « tu es Dieu » sans article dans le prédicat
  choice: tu es Dieu
  alternative: tu es le Dieu
  rationale: Le grec ὁ θεός fonctionne ici comme une désignation directe de Dieu; « tu es Dieu » est fidèle et n’ajoute pas un complément absent.
- issue: Relation d’appartenance exprimée par σοί ἐσμεν
  choice: nous sommes à toi
  alternative: nous t’appartenons
  rationale: La formulation retenue préserve la simplicité relationnelle du grec sans développer sa portée théologique.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement convient à l’adresse directe à Dieu. Les phrases ont été légèrement segmentées pour une lecture fluide sans modifier la progression du texte grec.
