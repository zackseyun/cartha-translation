lexical_decisions:
- source_word: ἐπεσκέπτῃ
  choice: tu as visité
  rationale: Le verbe peut exprimer une visite, une inspection ou une attention active. « Tu as visité » conserve cette amplitude et la valeur ponctuelle de l’aoriste, sans imposer exclusivement une idée de protection ni de jugement.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: Dans ce contexte où Dieu juge avec droiture, « justice » est naturel en français et peut désigner à la fois son caractère juste et la manière juste dont il agit.
- source_word: υἱοὺς ἀνθρώπων
  choice: les fils des hommes
  rationale: Cette formulation préserve l’expression sémitisante du grec, qui désigne collectivement les êtres humains, tout en signalant en note sa portée générale.
theological_decisions:
- issue: Portée de la visite divine
  choice: Conserver le terme ouvert « visité »
  alternative: « examiné », « inspecté » ou « veillé sur »
  rationale: Le contexte judiciaire peut orienter le verbe vers l’examen, mais le mot grec demeure plus large. La traduction ne tranche donc pas silencieusement entre intervention, examen et sollicitude.
- issue: Expression masculine représentative
  choice: « les fils des hommes » dans le texte principal
  alternative: « les êtres humains » ou « les enfants des hommes »
  rationale: La tournure imagée de la source est maintenue, tandis qu’une note précise qu’elle vise l’humanité en général.
translation_notes:
  register: Français moderne et digne, avec maintien de l’idiome biblique « les fils des hommes ». La formulation littérale « tu as visité » conserve l’ambiguïté du verbe grec ; les notes en explicitent la portée sans alourdir le texte.
