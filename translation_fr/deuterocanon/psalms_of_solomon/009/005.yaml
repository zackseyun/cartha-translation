  text: For everyone who does unjust deeds will not be hidden from your knowledge[b][a],
translation:
  language: fr
  text: Car quiconque commet des actes injustes n’échappera pas à ta connaissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « ne sera pas caché de ta connaissance »; il évoque l’image de la dissimulation.'
    reason: La note conserve l’image passive de κρυβήσεται sans ajouter la nuance de distance de « loin de ».
lexical_decisions:
- source_word: κρυβήσεται
  choice: n’échappera pas
  rationale: Dans la construction « ne sera pas caché loin de ta connaissance », le français idiomatique « n’échappera pas à ta connaissance » conserve l’idée que rien ne peut demeurer dissimulé à Dieu.
- source_word: γνώσεώς
  choice: connaissance
  rationale: « Connaissance » correspond directement à γνῶσις et préserve l’énoncé portant sur la connaissance divine sans le réduire à la simple attention.
- source_word: πᾶς ποιῶν ἄδικα
  choice: quiconque commet des actes injustes
  rationale: « Quiconque » garde la portée universelle de πᾶς, tandis que « commet des actes injustes » rend le participe présent et le neutre pluriel substantivé.
- source_word: ἄδικα
  choice: actes injustes
  rationale: Ce choix maintient le lien lexical et thématique avec le champ de la justice et de l’injustice dans le psaume, plutôt que de généraliser en « mal ».
theological_decisions:
- issue: Portée judiciaire et morale du groupe lexical δίκαιος/ἄδικος
  choice: actes injustes
  alternative: le mal
  rationale: La formulation retenue préserve le contraste thématique entre justice et injustice sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la portée universelle du grec et son vocabulaire de justice, tout en évitant le calque peu naturel « ne sera pas caché de ta connaissance ».
