base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/010.yaml
  text: For the judgments of the Lord are in righteousness toward each man and household[a][b][c].
translation:
  language: fr
  text: Car les jugements du Seigneur s’exercent dans la justice envers chaque personne et chaque foyer[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « selon un homme et une maison » ; l’expression a probablement un sens distributif : chaque personne et chaque foyer sont concernés.'
    reason: lexical_alternative
  - marker: b
    text: « Dans la justice » peut aussi se rendre par « avec justice » ou « sont justes ».
    reason: lexical_alternative
  - marker: c
    text: Le mot grec traduit par « foyer » signifie littéralement « maison » et peut désigner les personnes qui la composent.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα
  choice: jugements
  rationale: Le terme désigne des décisions ou des actes judiciaires. « Jugements » en conserve à la fois la portée juridique et morale.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent français naturel de κύριος dans ce contexte.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Cette formulation conserve le nom δικαιοσύνη et son lien lexical avec les versets voisins, tout en exprimant que les jugements du Seigneur procèdent avec justice.
- source_word: κατʼ ἄνδρα
  choice: envers chaque personne
  rationale: κατά avec l’accusatif paraît avoir ici une valeur distributive. « Chaque personne » la rend clairement sans faire du masculin grec une restriction aux seuls hommes.
- source_word: οἶκον
  choice: chaque foyer
  rationale: οἶκος peut désigner non seulement une habitation, mais aussi l’unité domestique qui y vit. « Foyer » exprime ce sens collectif dans un français actuel.
theological_decisions:
- issue: Rapport de ἐν δικαιοσύνῃ aux jugements du Seigneur
  choice: s’exercent dans la justice
  alternative: sont justes / sont rendus avec justice
  rationale: Le grec permet d’entendre soit le caractère juste des jugements, soit la manière juste dont ils s’exercent. La traduction retient une formulation qui préserve le nom « justice » et laisse subsister cette proximité de sens.
- issue: Valeur de κατʼ ἄνδρα καὶ οἶκον
  choice: envers chaque personne et chaque foyer
  alternative: selon l’homme et la maison
  rationale: La lecture distributive est la plus probable, mais la note conserve la forme plus littérale afin de ne pas masquer l’ambiguïté de κατά.
translation_notes:
  register: Français international moderne, digne et accessible. « S’exercent dans la justice » évite le calque peu naturel « sont dans la justice » tout en maintenant le substantif répété dans le contexte. « Personne » communique la portée distributive de ἄνδρα sans suggérer une limitation de sexe, et « foyer » rend la dimension domestique de οἶκος.
