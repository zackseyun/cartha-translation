  text: The Lord's mercy is upon the house of Israel forevermore.
translation:
  language: fr
  text: La miséricorde du Seigneur repose sur la maison d’Israël pour toujours, et même au-delà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’éternité, et encore ». Cette expression grecque renforce l’idée d’une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif est rendu naturellement en français par « du Seigneur » ; « Seigneur » est la traduction traditionnelle et intelligible de κύριος.
- source_word: ἐλεημοσύνη
  choice: miséricorde
  rationale: Dans ce contexte, le nom désigne la compassion bienveillante du Seigneur envers Israël. « Miséricorde » conserve sa portée théologique et relationnelle sans le réduire à des actes d’aumône.
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: repose sur la maison d’Israël
  rationale: La tournure rend la relation exprimée par ἐπί et donne une phrase française naturelle. « Maison d’Israël » préserve le sens collectif et historique de οἶκος.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: pour toujours et au-delà
  rationale: Cette formulation garde l’intensification inhabituelle de καὶ ἔτι au lieu de la ramener au simple « pour toujours ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Repose sur » conserve l’image relationnelle de la faveur divine dirigée vers Israël, tandis que « pour toujours et au-delà » préserve l’intensité singulière du grec.
