    issue: Les deux occurrences de καί ne sont pas rendues.
    rationale: 'Le grec coordonne explicitement les deux membres : « et … ; et où … ? ». Leur omission modifie légèrement l’enchaînement rhétorique.'
  - severity: medium
    issue: κρυβήσεται est rendu par « pourrait-il se cacher ».
    rationale: Le futur grec appelle « se cachera-t-il », et non un conditionnel de possibilité.
  - severity: low
    issue: « loin de ta connaissance » surinterprète ἀπὸ τῆς γνώσεώς σου.
    rationale: Dans ce contexte, ἀπό signifie naturellement « à/de ta connaissance » au sens de se soustraire à elle ; « loin de » accentue inutilement une image spatiale.
  revised_text: Et les actes justes de tes fidèles sont devant toi, Seigneur ; et où l’être humain se cachera-t-il de ta connaissance, ô Dieu ?
