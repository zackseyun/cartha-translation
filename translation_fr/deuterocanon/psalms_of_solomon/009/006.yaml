translation:
  language: fr
  text: Et les actes justes de tes fidèles sont devant toi, Seigneur ; et où l’être humain se cachera-t-il de ta connaissance, ô Dieu ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύναι
  choice: actes justes
  rationale: Le pluriel désigne ici vraisemblablement les manifestations concrètes de la justice; «actes justes» est naturel en français tout en conservant le pluriel grec.
- source_word: ὁσίων
  choice: ceux qui te sont fidèles
  rationale: Ὅσιος évoque la piété et la fidélité envers Dieu; cette formulation relationnelle convient au possessif σου sans introduire une catégorie confessionnelle.
- source_word: γνώσεώς
  choice: connaissance
  rationale: Traduction directe de γνῶσις, qui maintient l'idée que rien n'échappe à la connaissance divine.
- source_word: ἄνθρωπος
  choice: un être humain
  rationale: Rend le terme générique sans le restreindre au sexe masculin.
theological_decisions:
- issue: Portée de «δικαιοσύναι»
  choice: actes justes
  alternative: œuvres de justice / justices
  rationale: Le pluriel grec est préservé sémantiquement, sans transformer la phrase en affirmation doctrinale sur une justice intrinsèque ou imputée.
- issue: Sens de «ὅσιοι»
  choice: ceux qui te sont fidèles
  alternative: tes saints / tes fidèles pieux
  rationale: Ce choix conserve la dimension de dévouement envers Dieu tout en évitant que «saints» soit compris comme un titre technique.
- issue: Préposition ἀπό avec κρυβήσεται
  choice: se cacher loin de ta connaissance
  alternative: se dérober à ta connaissance
  rationale: La formulation garde l'image spatiale du grec et l'affirmation de l'impossibilité d'échapper à la connaissance de Dieu.
translation_notes:
  register: Français moderne, digne et accessible. La répétition manifestement corrompue de la couche anglaise n'est pas suivie; la traduction repose directement sur le grec de Swete.
