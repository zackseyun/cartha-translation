  source_fidelity: Le projet rend bien δικαιοσύναι, ὅσιοι, γνώσις et le sens générique de ἄνθρωπος. Il omet toutefois les deux conjonctions καί, atténue le futur κρυβήσεται par un conditionnel, et « loin de » ajoute une nuance spatiale qui n’est pas exprimée par ἀπό dans cette construction.
  naturalness: La formulation est globalement claire et digne. « Tes fidèles » est plus direct et idiomatique que « ceux qui te sont fidèles », tout en gardant le sens de ὅσιοι. La question au futur est naturelle en français biblique moderne.
  terminology: « Actes justes » est une restitution recevable du pluriel δικαιοσύναι dans ce contexte. « Fidèles » rend sans technicisme indu la piété/dévouement de ὅσιοι. « Connaissance » correspond directement à γνώσις.
