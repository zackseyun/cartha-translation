revisions:
- from: Ils ont été chassés de l’héritage que le Seigneur leur avait donné ; la dispersion d’Israël s’étend à toutes les nations[a], conformément à la parole de Dieu.
  to: Ils ont été chassés de l’héritage que le Seigneur leur avait donné ; la dispersion d’Israël est présente dans toutes les nations[a], selon la parole de Dieu.
  rationale: La révision remplace le prédicat d’extension par un prédicat de présence afin de rendre la préposition ἐν avec davantage de précision, tout en conservant le substantif « dispersion ». Elle emploie aussi « selon » pour une équivalence plus directe de κατά et ῥῆμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:17Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement ἀπερρίφησαν ἀπὸ κληρονομίας ἧς ἔδωκεν αὐτοῖς Κύριος. Dans la seconde, « s’étend à » atténue et modifie légèrement la valeur locative de ἐν (« dans/parmi ») en suggérant une extension vers les nations. « Est présente dans toutes les nations » conserve mieux l’idée que la dispersion se trouve dans chacune d’elles. « Selon la parole de Dieu » rend directement κατὰ τὸ ῥῆμα τοῦ θεοῦ, sans resserrer ῥῆμα au sens de conformité administrative ou de décret.
  naturalness: Le français est fluide et d’un registre biblique moderne accessible. « La dispersion d’Israël est présente dans toutes les nations » demeure idiomatique tout en préservant la construction nominale du grec.
  terminology: « Héritage », « Seigneur », « dispersion » et « parole de Dieu » sont appropriés, cohérents et ne surinterprètent pas le texte. Le plus-que-parfait « leur avait donné » est une bonne transposition française de l’antériorité contextuelle.
  issues:
  - severity: medium
    issue: « la dispersion d’Israël s’étend à toutes les nations »
    rationale: Le grec ἐν παντὶ ἔθνει exprime une localisation/distribution (« dans toute nation »), non un mouvement ou une portée vers les nations. « S’étend à » peut suggérer une nuance différente.
  - severity: low
    issue: « conformément à la parole de Dieu »
    rationale: Cette expression est possible, mais elle donne à κατὰ une coloration plus formelle et normative. « Selon la parole de Dieu » est plus direct et maintient l’ouverture sémantique de ῥῆμα.
  revised_text: Ils ont été chassés de l’héritage que le Seigneur leur avait donné ; la dispersion d’Israël est présente dans toutes les nations[a], selon la parole de Dieu.
  revised_footnotes:
