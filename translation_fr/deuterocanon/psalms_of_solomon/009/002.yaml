  yaml_path: translation/deuterocanon/psalms_of_solomon/009/002.yaml
  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: fr
  text: Ils ont été chassés de l’héritage que le Seigneur leur avait donné ; la dispersion d’Israël est présente dans toutes les nations[a], selon la parole de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Israël est dispersé parmi toutes les nations. »'
    reason: Alternative lexicale et syntaxique qui rend verbalement le substantif grec διασπορά.
lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: ont été chassés
  rationale: Le passif exprime une exclusion effective et sévère, adaptée au contexte de l’exil, plutôt qu’un simple rejet affectif.
- source_word: κληρονομίας
  choice: héritage
  rationale: « Héritage » conserve le sens biblique d’un bien accordé par Dieu, notamment la terre ou la possession liée à l’alliance.
- source_word: Κύριος
  choice: Seigneur
  rationale: Traduction française habituelle de κύριος lorsqu’il désigne le Dieu d’Israël dans ce cadre d’alliance.
- source_word: διασπορὰ
  choice: dispersion
  rationale: Le substantif grec est conservé par un substantif français, tout en exprimant la dissémination d’Israël parmi les peuples.
- source_word: ἐν παντὶ ἔθνει
  choice: s’étend à toutes les nations
  rationale: Cette formulation française naturelle rend la portée distributive de l’expression grecque sans suggérer qu’une seule nation serait visée.
- source_word: ῥῆμα
  choice: parole
  rationale: « Parole » reste proche du grec et laisse ouverte la nuance entre parole prononcée, déclaration et décret divin.
theological_decisions:
- issue: Faut-il transformer l’expression nominale διασπορὰ τοῦ Ἰσραήλ en proposition verbale ?
  choice: 'Maintien de l’expression nominale : « la dispersion d’Israël »'
  alternative: « Israël est dispersé parmi toutes les nations »
  rationale: Le maintien du substantif respecte la forme grecque et évite de lisser inutilement la formulation, tout en restant intelligible en français.
- issue: Valeur temporelle de ἔδωκεν dans la relative
  choice: « leur avait donné »
  alternative: « leur a donné »
  rationale: Le plus-que-parfait situe naturellement en français le don antérieur à l’expulsion, sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure nominale grecque est préservée, mais le prédicat « s’étend à » évite le calque peu naturel « est parmi ».
