base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: fr
  text: Le Seigneur est fidèle envers ceux qui l’aiment en vérité, envers ceux qui endurent sa discipline[a], envers ceux qui marchent dans la justice de ses commandements[b], dans la loi qu’il nous a prescrite pour notre vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son instruction ». Le grec peut englober la formation, la correction et l’enseignement.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression peut aussi se comprendre : « qui marchent avec droiture conformément à ses commandements ».'
    reason: syntactic_alternative
  - marker: c
    text: 'Littéralement : « pour notre vie ».'
    reason: literal_rendering
lexical_decisions:
- source_word: Πιστὸς
  choice: fidèle
  rationale: Employé comme attribut du Seigneur, le terme exprime sa fiabilité et sa constance envers les siens.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Cette formulation conserve l’expression grecque et sa portée morale et religieuse, sans la réduire au seul adverbe « sincèrement ».
- source_word: ὑπομένουσιν
  choice: supportent
  rationale: Le verbe évoque le fait de tenir ferme sous une réalité éprouvante; « supportent » est naturel avec « discipline ».
- source_word: παιδείαν
  choice: discipline
  rationale: Le mot englobe formation, instruction et correction; dans ce contexte d’obéissance, « discipline » en rend bien la dimension éducative et corrective.
- source_word: πορευομένοις
  choice: marchent
  rationale: Le choix préserve la métaphore biblique de la marche comme manière de vivre.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: En français, « justice » est le correspondant naturel de δικαιοσύνη et désigne ici la conduite droite conforme aux commandements.
- source_word: προσταγμάτων
  choice: commandements
  rationale: Le terme convient au registre dévotionnel et exprime clairement les prescriptions divines.
- source_word: νόμῳ
  choice: loi
  rationale: « Loi » est le rendu direct et transparent, particulièrement approprié à proximité du vocabulaire du commandement.
- source_word: ἐνετείλατο
  choice: a prescrite
  rationale: Le verbe signifie ordonner ou commander; « prescrire » évite en français la tournure lourde « loi qu’il a commandée ».
- source_word: εἰς ζωὴν ἡμῶν
  choice: pour que nous vivions
  rationale: Cette formulation naturelle rend la visée exprimée par εἰς et le caractère communautaire de « notre vie », tout en laissant ouverte la portée concrète ou spirituelle de la vie.
theological_decisions:
- issue: Rapport entre la loi et la vie dans εἰς ζωὴν ἡμῶν
  choice: pour que nous vivions
  alternative: pour notre vie
  rationale: Le grec peut exprimer la destination ou le but. La formulation retenue communique naturellement la finalité vivifiante sans préciser indûment la nature de cette vie.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « envers ceux qui » conserve la structure en trois membres du grec; la métaphore biblique de la marche est maintenue.
