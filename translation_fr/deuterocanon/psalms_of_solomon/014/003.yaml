review_pass:
  verdict: revise
  source_fidelity: La première proposition et la conclusion rendent fidèlement le grec. « Ils ne disparaîtront pas » exprime l’idée générale de permanence, mais ἐκλήξουσιν renvoie plus directement au fait de cesser ou de prendre fin. « Tant que dureront les jours du ciel » explicite la durée, mais atténue la formulation « tous les jours du ciel » et sa totalité.
  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « Ils ne cesseront pas » seul serait toutefois elliptiques pour des personnes; « ils ne connaîtront pas de fin » est idiomatique, poétique sans archaïsme, et conserve la portée du verbe.
  terminology: « Plantation », « enracinée », « part », « héritage » et « Dieu » conviennent. La métaphore végétale et l’affirmation selon laquelle Israël appartient à Dieu sont maintenues sans surcharge doctrinale.
  issues:
  - severity: medium
    issue: Rendu de ἐκλήξουσιν et de πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
    rationale: « Ne disparaîtront pas » est plus spécifique que « ne cesseront pas / ne prendront pas fin », tandis que « tant que dureront » reformule l’expression inclusive « tous les jours ». Un rendu qui conserve « ne connaîtront pas de fin » et « durant tous les jours du ciel » est plus proche du grec tout en restant naturel.
  revised_text: Leur plantation est enracinée à jamais ; ils ne connaîtront pas de fin durant tous les jours du ciel[a], car Israël est la part et l’héritage de Dieu.
