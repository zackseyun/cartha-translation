- from: Leur plantation est enracinée pour toujours ; ils ne disparaîtront pas[a] tant que dureront les jours du ciel[b], car Israël est la part et l’héritage de Dieu.
  to: Leur plantation est enracinée à jamais ; ils ne connaîtront pas de fin durant tous les jours du ciel[a], car Israël est la part et l’héritage de Dieu.
  rationale: La révision rend plus directement le sens de ἐκλήξουσιν (« cesser », « prendre fin ») sans employer une tournure française incomplète avec un sujet personnel. Elle rétablit aussi l’idée de totalité portée par πάσας (« tous »), tout en conservant l’expression poétique « les jours du ciel ». Les deux notes initiales, qui portaient respectivement sur le verbe et sur l’expression temporelle, sont regroupées sous une seule ancre placée sur l’expression concernée.
