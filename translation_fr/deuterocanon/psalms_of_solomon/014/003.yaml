  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: fr
  text: Leur plantation est enracinée à jamais ; ils ne connaîtront pas de fin durant tous les jours du ciel[a], car Israël est la part et l’héritage de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne cesseront pas tous les jours du ciel ». « Tous les jours du ciel » est une expression qui évoque toute la durée de l’ordre céleste présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεία
  choice: plantation
  rationale: Le nom désigne ce qui est planté ou l’acte de planter. « Plantation » conserve l’image végétale et le singulier collectif, sans préciser davantage si l’image vise le peuple ou son établissement.
- source_word: ἐρριζωμένη
  choice: est enracinée
  rationale: Le participe parfait passif exprime un état durablement établi. « Enracinée » maintient l’image végétale de φυτεία.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans ce contexte, l’expression marque une permanence durable ; « pour toujours » en rend naturellement la force.
- source_word: ἐκλήξουσιν
  choice: ils ne disparaîtront pas
  rationale: Ce verbe rare évoque la cessation ou la disparition. « Ne disparaîtront pas » est clair en français actuel et convient au contraste avec l’enracinement durable.
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: tant que dureront les jours du ciel
  rationale: Cette formulation française conserve l’image élevée des « jours du ciel » tout en exprimant naturellement l’idée de leur durée entière.
- source_word: μερὶς
  choice: part
  rationale: « Part » exprime sobrement la portion attribuée ou possédée et s’associe naturellement à « héritage ».
- source_word: κληρονομία
  choice: héritage
  rationale: « Héritage » préserve la nuance biblique de possession reçue ou propre, sans ajout doctrinal.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement comme possessif, sans explicitation supplémentaire.
theological_decisions:
- issue: Israël comme part et héritage appartenant à Dieu
  choice: Israël est la part et l’héritage de Dieu
  alternative: Israël est la part de Dieu, son héritage
  rationale: La formulation retenue suit de près la construction prédicative grecque et préserve l’affirmation d’appartenance sans développer sa portée théologique.
translation_notes:
  register: Français international moderne, digne et lisible. Le vers conserve l’image végétale et l’expression poétique « les jours du ciel ». Le passage du singulier collectif « leur plantation » au pluriel « ils » reproduit le mouvement du grec vers les personnes représentées par cette plantation.
