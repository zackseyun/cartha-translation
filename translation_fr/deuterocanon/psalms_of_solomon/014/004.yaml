revisions:
- from: Mais il n’en va pas ainsi des pécheurs et de ceux qui vivent sans loi, eux qui ont aimé une journée passée à prendre part à leur péché ; leur désir s’attachait à la brièveté de la corruption.[a]
  to: Mais il n’en va pas ainsi des pécheurs et de ceux qui vivent sans loi, eux qui ont aimé une journée de participation à leur péché ; leur désir se portait sur la brièveté de la corruption.[a]
  rationale: La révision limitée supprime l’explicitation temporelle introduite par « passée à », afin de refléter plus étroitement ἐν μετοχῇ tout en gardant un français naturel. La note et le rendu contextuel de μικρότης sont conservés, car ils signalent adéquatement l’ambiguïté du syntagme difficile.
