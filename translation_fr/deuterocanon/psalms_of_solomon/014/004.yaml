  revision_rationale: La révision limitée supprime l’explicitation temporelle introduite par « passée à », afin de refléter plus étroitement ἐν μετοχῇ tout en gardant un français naturel. La note et le rendu contextuel de μικρότης sont conservés, car ils signalent adéquatement l’ambiguïté du syntagme difficile.
