review_pass:
  verdict: revise
  source_fidelity: La traduction maintient bien l’opposition initiale, les deux catégories morales distinctes et le singulier indéfini de ἡμέραν. « Brièveté de la corruption » est une interprétation contextuellement plausible de μικρότης, à juste titre nuancée par la note. Toutefois, « une journée passée à prendre part » introduit plus explicitement l’idée qu’ils ont employé cette journée à cette activité. Le grec situe plus sobrement « un jour » dans la participation à leur péché.
  naturalness: Le français est globalement moderne, clair et d’un registre biblique sobre. « Une journée de participation à leur péché » rend plus directement la construction grecque, sans être excessivement lourd. « Leur désir se portait sur » est idiomatique et évite de suggérer par « s’attachait » une détermination affective plus marquée que nécessaire.
  terminology: « Pécheurs » et « ceux qui vivent sans loi » préservent utilement la double désignation ἁμαρτωλοὶ καὶ παράνομοι. « Corruption » convient pour σαπρία dans cette formulation poétique, tandis que la note conserve les sens concurrents de μικρότης sans imposer une lecture doctrinale ou lexicale unique.
  issues:
  - severity: low
    issue: « passée à prendre part » explicite excessivement le rapport entre « une journée » et la participation au péché.
    rationale: ἐν μετοχῇ ἁμαρτίας αὐτῶν signifie littéralement « dans la participation à leur péché »; il ne dit pas explicitement que la journée a été entièrement passée à cette participation. Une formulation nominale conserve mieux la densité et l’ambiguïté du grec.
  revised_text: Mais il n’en va pas ainsi des pécheurs et de ceux qui vivent sans loi, eux qui ont aimé une journée de participation à leur péché ; leur désir se portait sur la brièveté de la corruption.[a]
