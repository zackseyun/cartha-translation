  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: fr
  text: Mais il n’en va pas ainsi des pécheurs et de ceux qui vivent sans loi, eux qui ont aimé une journée de participation à leur péché ; leur désir se portait sur la brièveté de la corruption.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la petitesse de la corruption ». Le grec peut évoquer soit sa brièveté, soit son caractère petit ou mesquin.'
    reason: La construction ἐν μικρότητι σαπρίας est rare et ambiguë ; la note préserve les principales possibilités lexicales sans imposer une certitude absente du texte.
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: Mais il n’en va pas ainsi
  rationale: Cette formulation française naturelle marque nettement le contraste avec le sort durable des saints décrit auparavant, tout en conservant la concision du grec.
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: les pécheurs et ceux qui vivent sans loi
  rationale: Les deux désignations sont maintenues. « Pécheurs » rend directement ἁμαρτωλοί, tandis que « ceux qui vivent sans loi » exprime la portée morale et juridique de παράνομοι sans suggérer seulement un statut civil d’illégalité.
- source_word: οἱ ἠγάπησαν ἡμέραν
  choice: eux qui ont aimé une journée
  rationale: Le singulier indéfini du grec est conservé. « Une journée » convient mieux que « un jour » à l’idée d’une période vécue et prépare naturellement le complément participatif qui suit.
- source_word: ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: passée à prendre part à leur péché
  rationale: μετοχή désigne la participation ou le fait d’avoir part à quelque chose. La tournure choisie rend le grec comprimé dans un français courant sans réduire le péché à une simple activité extérieure.
- source_word: ἐν μικρότητι σαπρίας
  choice: à la brièveté de la corruption
  rationale: Dans le contexte, μικρότης peut évoquer la faible durée, en contraste avec la permanence évoquée au verset précédent. σαπρία garde ici son image de dégradation ou de corruption. Une note préserve toutefois la formulation littérale et son ambiguïté.
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: leur désir s’attachait
  rationale: ἐπιθυμία signifie ici « désir » sans connotation nécessairement sexuelle. « S’attachait à » donne un français idiomatique au complément introduit par ἐν.
theological_decisions:
- issue: Rapport entre la brièveté et la corruption
  choice: Conserver l’idée que le désir des pécheurs se porte sur une corruption passagère
  alternative: Comprendre μικρότης comme la petitesse ou le caractère mesquin de la corruption
  rationale: Le contraste contextuel avec ce qui demeure éternellement favorise la valeur temporelle de μικρότης, mais le grec reste inhabituel ; l’autre lecture est donc signalée en note plutôt qu’exclue.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe poétique demeure serrée, mais les liens grammaticaux ont été légèrement explicités pour être naturels en français. Le point-virgule conserve l’articulation des deux propositions grecques.
