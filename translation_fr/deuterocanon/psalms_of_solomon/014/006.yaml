base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: fr
  text: Voilà pourquoi leur héritage est l’Hadès[a], les ténèbres et la destruction ; ils ne seront pas trouvés au jour de la miséricorde accordée aux justes[b]. Mais les fidèles du Seigneur hériteront de la vie dans la joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’Hadès est le séjour des morts ; ce terme ne correspond pas nécessairement à tout ce que le mot « enfer » en est venu à évoquer.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « au jour de la miséricorde des justes », c’est-à-dire au jour où les justes exercent la miséricorde. La construction grecque peut se comprendre de plusieurs façons.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Exprime naturellement en français moderne la conséquence tirée du contexte précédent.
- source_word: κληρονομία
  choice: héritage
  rationale: Conserve l’image de l’héritage et sa portée eschatologique, reprise ensuite par le verbe « hériteront ».
- source_word: ᾅδης
  choice: l’Hadès
  rationale: La translittération évite d’assimiler sans nuance ce terme à « l’enfer » et désigne le séjour des morts.
- source_word: σκότος
  choice: les ténèbres
  rationale: Rend directement le terme grec tout en maintenant le registre solennel de l’énumération.
- source_word: ἀπώλεια
  choice: la destruction
  rationale: Équivalent direct et compréhensible, moins marqué par le vocabulaire ecclésiastique que « perdition ».
- source_word: οὐχ εὑρεθήσονται
  choice: ils ne seront pas trouvés
  rationale: Préserve la forme passive du grec et son possible arrière-plan judiciaire ou d’exclusion, malgré une tournure légèrement inhabituelle en français.
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: au jour de la miséricorde accordée aux justes
  rationale: Comprend les justes comme bénéficiaires de la miséricorde, lecture qui convient au contraste immédiat, tout en signalant en note l’ambiguïté du génitif.
- source_word: ὅσιοι Κυρίου
  choice: les fidèles du Seigneur
  rationale: Rend ὅσιοι comme les personnes attachées à Dieu par leur piété et leur loyauté, sans le confondre automatiquement avec ἅγιοι, souvent rendu par « saints ».
- source_word: κληρονομήσουσιν ζωὴν
  choice: hériteront de la vie
  rationale: Reproduit le motif de l’héritage et fait ressortir le contraste entre les deux destinées.
- source_word: ἐν εὐφροσύνῃ
  choice: dans la joie
  rationale: Formulation actuelle, claire et digne, correspondant au sens de joie ou d’allégresse.
theological_decisions:
- issue: Sens de ᾅδης
  choice: « l’Hadès », compris comme le séjour des morts
  alternative: « l’enfer » ou « le séjour des morts » dans le corps du texte
  rationale: Le grec ne requiert pas toutes les connotations doctrinales plus tardives associées au mot « enfer » ; la translittération conserve la précision lexicale.
- issue: Fonction de δικαίων dans ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: Les justes sont les bénéficiaires de la miséricorde
  alternative: La miséricorde exercée par les justes, ou « le jour de la miséricorde des justes »
  rationale: Le contraste entre ceux qui disparaissent et les fidèles qui héritent de la vie favorise la première lecture, mais la syntaxe grecque demeure réellement ambiguë ; la note préserve cette tension.
- issue: Valeur de ὅσιοι
  choice: « les fidèles »
  alternative: « les hommes pieux », « les dévots » ou « les saints »
  rationale: « Fidèles » exprime ici une appartenance pieuse et loyale au Seigneur sans imposer une catégorie doctrinale ultérieure ni confondre nécessairement ὅσιοι avec ἅγιοι.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition du vocabulaire de l’héritage est conservée. La tournure passive « ils ne seront pas trouvés » reste proche du grec afin de ne pas préciser indûment s’il s’agit d’absence, d’exclusion ou de disparition.
