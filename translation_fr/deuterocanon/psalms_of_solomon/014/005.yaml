- from: 'Ils ne se sont pas souvenus de Dieu : les voies des humains sont toujours connues devant lui, et il connaît les secrets du cœur avant qu’ils ne viennent à l’existence.[a]'
  to: Ils ne se sont pas souvenus de Dieu, car les voies des humains lui sont connues en tout temps, et il connaît les secrets du cœur avant qu’ils ne viennent à l’existence.[a]
  rationale: La révision améliore l’idiomaticité française sans modifier le sens. La note est reformulée afin de ne pas attribuer grammaticalement et sémantiquement la venue à l’existence aux « chambres » littérales, tout en préservant l’ambiguïté du grec sur le référent implicite de γενέσθαι.
