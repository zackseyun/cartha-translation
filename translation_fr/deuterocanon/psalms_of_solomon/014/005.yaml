base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: fr
  text: Ils ne se sont pas souvenus de Dieu, car les voies des humains lui sont connues en tout temps, et il connaît les secrets du cœur avant qu’ils ne viennent à l’existence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, ταμεῖα καρδίας signifie « les chambres intérieures du cœur » ; l’expression est figurée ici. « Avant qu’ils ne viennent à l’existence » peut aussi se comprendre : « avant qu’ils ne surgissent » ou « avant qu’ils ne se produisent » ; le grec ne précise pas ce qui vient à l’existence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se sont souvenus
  rationale: Le verbe exprime ici le fait de ne pas se rappeler Dieu ou de ne pas le garder présent à l’esprit. « Se souvenir » reste direct et conserve la portée morale du grec.
- source_word: ὁδοὶ ἀνθρώπων
  choice: les voies des humains
  rationale: « Voies » préserve l’image biblique et son sens possible de conduite. « Humains » rend ἀνθρώπων sans limiter le propos aux hommes de sexe masculin.
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός
  choice: sont toujours connues devant lui
  rationale: Cette formulation conserve la connaissance constante exprimée par διὰ παντός ainsi que l’idée de présence portée par ἐνώπιον αὐτοῦ.
- source_word: ταμεῖα καρδίας
  choice: les secrets du cœur
  rationale: Bien que ταμεῖα désigne littéralement des pièces intérieures, l’expression est figurée ici. « Secrets du cœur » communique naturellement le contenu caché visé et s’accorde avec ce qui « vient à l’existence ».
- source_word: ἐπίσταται
  choice: il connaît
  rationale: Le verbe indique une connaissance assurée ou approfondie ; « connaît » est l’équivalent français le plus clair dans ce parallélisme.
- source_word: πρὸ τοῦ γενέσθαι
  choice: avant qu’ils ne viennent à l’existence
  rationale: La formule garde l’indétermination du grec, qui parle de venir à l’être sans préciser s’il s’agit de pensées, de desseins ou d’événements.
theological_decisions:
- issue: Portée de la prescience divine dans la dernière proposition
  choice: Dieu connaît les réalités cachées du cœur avant même qu’elles ne viennent à l’existence.
  alternative: Dieu connaît les pensées ou les desseins du cœur avant qu’ils ne surgissent, ou avant qu’ils ne se traduisent en actes.
  rationale: Le grec affirme largement la connaissance divine sans préciser la nature exacte de ce qui vient à l’existence. La traduction maintient cette ampleur au lieu d’imposer un système doctrinal ou de réduire le propos aux seuls actes.
- issue: Référent implicite du pluriel dans πρὸ τοῦ γενέσθαι
  choice: Le pronom « ils » reprend « les secrets du cœur ».
  alternative: La proposition peut viser plus largement les réalités, pensées ou événements issus du cœur.
  rationale: L’accord contextuel favorise « les secrets », mais le grec n’explicite pas le sujet de l’infinitif ; une note préserve donc l’ouverture sémantique.
translation_notes:
  register: Français moderne, international et digne. Le deux-points explicite le lien introduit par ὅτι sans en réduire la nuance causale ou explicative. Le « ne » de « avant qu’ils ne viennent » est explétif et ne marque pas une négation.
