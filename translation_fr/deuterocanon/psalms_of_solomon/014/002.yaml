base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
translation:
  language: fr
  text: Les fidèles du Seigneur vivront par elle pour toujours[a] ; le paradis du Seigneur, les arbres de vie[b], ce sont ses fidèles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vivront en lui ». Le pronom grec peut reprendre « la Loi » mentionnée au verset précédent, d’où « par elle » ; il peut aussi être compris comme renvoyant au Seigneur.'
    reason: ambiguite_contextuelle
  - marker: b
    text: 'Le grec porte le pluriel : « les arbres de vie ».'
    reason: precision_lexicale
lexical_decisions:
- source_word: ὅσιοι / ὅσιοι αὐτοῦ
  choice: les fidèles / ses fidèles
  rationale: Ὅσιοι désigne ici des personnes caractérisées par leur piété et leur attachement à Dieu. « Les fidèles » est naturel en français moderne, conserve la portée religieuse du terme et évite les connotations ecclésiastiques plus tardives que pourrait suggérer « les saints ».
- source_word: Κυρίου / τοῦ κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est le rendu français usuel de κύριος dans ce contexte religieux et convient aux deux occurrences.
- source_word: ζήσονται
  choice: vivront
  rationale: Futur direct de ζάω, rendu simplement et naturellement.
- source_word: ἐν αὐτῷ
  choice: par elle
  rationale: Le pronom masculin grec peut reprendre νόμος, « la Loi », au verset précédent. Dans ce contexte, ἐν peut exprimer le moyen ou le principe selon lequel on vit. Le féminin français « elle » reprend donc « la Loi » malgré le genre masculin de νόμος en grec. L’autre antécédent possible, « le Seigneur », est signalé en note.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression idiomatique française qui rend la durée indéfinie de la formule grecque sans lourdeur.
- source_word: ὁ παράδεισος τοῦ κυρίου
  choice: le paradis du Seigneur
  rationale: « Paradis » garde la tonalité élevée et eschatologique de παράδεισος.
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: les arbres de vie
  rationale: Le pluriel explicite τὰ ξύλα est conservé, même si l’imagerie biblique familière emploie souvent le singulier « arbre de vie ».
theological_decisions:
- issue: Antécédent de ἐν αὐτῷ
  choice: « par elle », avec renvoi à la Loi mentionnée au verset précédent
  alternative: « en lui », avec renvoi au Seigneur
  rationale: Νόμος, immédiatement présent dans le contexte antérieur et masculin en grec, constitue un antécédent plausible et donne le sens biblique naturel de vivre par la Loi. Puisque « Seigneur » est également masculin et proche, la note conserve l’ambiguïté grammaticale au lieu de l’effacer.
- issue: Force métaphorique de la seconde proposition sans verbe exprimé
  choice: 'Identification : « le paradis du Seigneur, les arbres de vie, ce sont ses fidèles »'
  alternative: 'Possession ou localisation : « le paradis du Seigneur appartient à ses fidèles » ou « ses fidèles sont dans le paradis du Seigneur »'
  rationale: Les trois groupes nominaux grecs sont juxtaposés au nominatif. La tournure identificatrice française préserve cette métaphore audacieuse sans la transformer en rapport de possession ou de lieu.
translation_notes:
  register: Français international moderne, digne et poétique. « Ce sont » explicite le lien identificatif sous-entendu par la proposition nominale grecque, tandis que le point-virgule conserve l’équilibre des deux membres du verset.
