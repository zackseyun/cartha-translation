lexical_decisions:
- source_word: ὄρη
  choice: montagnes
  rationale: Le nom désigne ordinairement des montagnes ou de grandes collines ; « montagnes » convient à l’ampleur de l’image.
- source_word: ὑψηλά
  choice: hautes
  rationale: Ce rendu attributif direct conserve l’image de l’altitude en français naturel.
- source_word: ἐταπείνωσεν
  choice: a abaissé
  rationale: Avec les montagnes pour objet, le verbe exprime ici un abaissement physique, tout en conservant la force évocatrice du grec.
- source_word: εἰς ὁμαλισμόν
  choice: jusqu’à en faire un terrain plat
  rationale: 'La tournure grecque indique le résultat de l’action : les montagnes sont nivelées. Cette formulation l’exprime clairement et naturellement.'
- source_word: αὐτοῖς
  choice: pour eux
  rationale: 'Le datif est compris comme un datif d’intérêt : cet aplanissement est accompli en leur faveur.'
