  yaml_path: translation/deuterocanon/psalms_of_solomon/011/002.yaml
  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
translation:
  language: fr
  text: 'Proclamez à Jérusalem la voix de celui qui annonce une bonne nouvelle : car Dieu a fait miséricorde à Israël en venant le visiter[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « dans leur visitation ». Le terme peut aussi désigner une attention vigilante ou une intervention ; dans le contexte, Israël est l’objet de la visite bienveillante de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξατε
  choice: Proclamez
  rationale: L’impératif pluriel appelle une annonce publique et solennelle ; « Proclamez » en conserve la force sans archaïsme.
- source_word: φωνὴν
  choice: la voix
  rationale: Cette traduction maintient l’image concrète du grec, plutôt que de la réduire au seul contenu du message.
- source_word: εὐαγγελιζομένου
  choice: de celui qui annonce une bonne nouvelle
  rationale: Le participe désigne celui qui apporte une heureuse annonce ; cette formulation évite de donner automatiquement au verbe un sens chrétien technique plus tardif.
- source_word: ἠλέησεν
  choice: a fait miséricorde à
  rationale: Cette expression française digne et intelligible conserve explicitement le vocabulaire de la miséricorde et met en relief l’action divine.
- source_word: ἐπισκοπῇ αὐτῶν
  choice: en venant le visiter
  rationale: Le contexte de bonne nouvelle et de miséricorde indique une visite bienveillante de Dieu envers Israël. Le singulier « le » reprend Israël comme peuple collectif et rend clairement la valeur objective de αὐτῶν.
theological_decisions:
- issue: Sens de ἐπισκοπῇ dans la proposition finale
  choice: une visite miséricordieuse de Dieu auprès d’Israël
  alternative: une attention vigilante ou une intervention providentielle
  rationale: Le contexte positif favorise la visite salvatrice ou bienveillante. « En venant le visiter » rend cette orientation sans préciser davantage la forme de l’intervention divine.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « la voix de celui qui annonce une bonne nouvelle » conserve l’image et la construction du grec ; « en venant le visiter » évite l’ambiguïté peu naturelle de « dans leur visitation » tout en signalant celle-ci en note.
