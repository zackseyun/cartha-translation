base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/008.yaml
  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: fr
  text: Revêts-toi, Jérusalem, des vêtements de ta gloire ; prépare la robe de ta sainteté[a], car Dieu a parlé à Israël de bonnes choses, pour toujours et à jamais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la robe de ton sanctuaire » ; autre traduction possible : « ta robe sacrée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour l’éternité et encore ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδυσαι
  choice: Revêts
  rationale: L’impératif moyen invite Jérusalem à se vêtir elle-même. « Revêts » est naturel dans ce registre poétique et conserve la force de l’impératif.
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: les vêtements de ta gloire
  rationale: Cette formulation garde le pluriel de ἱμάτια et la résonance biblique de δόξα sans réduire le sens à un type précis de vêtement.
- source_word: ἑτοίμασον
  choice: prépare
  rationale: Rend directement l’impératif grec dans un français actuel et digne.
- source_word: τὴν στολὴν
  choice: la robe
  rationale: στολή désigne ici un vêtement long ou solennel ; « robe » préserve le singulier et l’image d’apparat.
- source_word: τοῦ ἁγιάσματός σου
  choice: de ta sainteté
  rationale: Le génitif grec peut renvoyer à la sainteté, à ce qui est consacré ou au sanctuaire. La traduction formelle « de ta sainteté » préserve cette tension mieux que l’adjectif plus interprétatif « sacrée ».
- source_word: ἐλάλησεν ἀγαθὰ
  choice: a annoncé des biens
  rationale: Le grec dit que Dieu a « parlé des choses bonnes ». « A annoncé des biens » reste proche de l’acte de parole tout en donnant en français un sens intelligible de bienfaits déclarés, sans imposer explicitement la notion de promesse.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: pour toujours, et au-delà
  rationale: La formule joint la durée permanente à καὶ ἔτι, « et encore / davantage ». Cette traduction conserve l’ajout inhabituel plutôt que de l’aplatir en simple redoublement idiomatique.
theological_decisions:
- issue: Sens de τοῦ ἁγιάσματός σου dans l’image de Jérusalem revêtue
  choice: la robe de ta sainteté
  alternative: la robe de ton sanctuaire ; ta robe sacrée
  rationale: ἁγίασμα peut désigner la sainteté, une réalité consacrée ou un sanctuaire. Le texte principal conserve la construction nominale et son ambiguïté, tandis que la note signale les autres lectures possibles.
- issue: Portée de ἐλάλησεν ἀγαθὰ
  choice: Dieu a annoncé des biens
  alternative: Dieu a dit du bien ; Dieu a promis des biens
  rationale: « Promis » expliciterait une valeur possible mais non exprimée lexicalement. « Annoncé des biens » maintient l’acte divin de parole et le caractère favorable de son contenu.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux impératifs et l’imagerie vestimentaire sont conservés. Les ambiguïtés de ἁγίασμα et de la formule finale sont maintenues dans le texte ou documentées en notes.
