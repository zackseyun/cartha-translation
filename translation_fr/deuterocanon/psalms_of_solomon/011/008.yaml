  source_fidelity: Le projet conserve correctement les deux impératifs, le pluriel de « vêtements », la robe au singulier et l’image de la gloire. Toutefois, « Revêts » ne rend pas correctement l’impératif moyen sans pronom réfléchi, et « a annoncé des biens » ajoute une nuance de proclamation absente de ἐλάλησεν. La finale est mieux rendue par l’expression française établie « pour toujours et à jamais », tout en conservant en note la tournure grecque littérale.
  naturalness: « Revêts-toi » est nécessaire et naturel dans cette apostrophe poétique. « Dieu a parlé à Israël de bonnes choses » demeure proche du grec tout en étant plus idiomatique que « a annoncé des biens ». « Pour toujours et à jamais » convient au registre psalmique et exprime la valeur intensive de εἰς τὸν αἰῶνα καὶ ἔτι.
  terminology: « Les vêtements de ta gloire » et « la robe de ta sainteté » sont appropriés. Le génitif τοῦ ἁγιάσματός σου reste sémantiquement ouvert; les possibilités « sanctuaire » et « robe sacrée » doivent rester signalées en note sans imposer une lecture cultuelle.
