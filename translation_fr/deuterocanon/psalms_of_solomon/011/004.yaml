base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/004.yaml
  text: They come from the north in the joy of their God[a]; from distant islands God has gathered them.
translation:
  language: fr
  text: Ils viennent du nord dans la joie de leur Dieu ; des îles lointaines[a], Dieu les a rassemblés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des côtes lointaines » ou « des pays côtiers lointains ».'
    reason: 'alternative lexicale : νῆσοι désigne ordinairement des îles, mais peut aussi désigner des côtes ou des régions maritimes dans le grec biblique.'
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: du nord
  rationale: ἀπό avec le génitif indique la provenance, et βορρᾶ désigne le nord ou la région septentrionale. « Du nord » est naturel et conserve la valeur directionnelle.
- source_word: ἔρχονται
  choice: ils viennent
  rationale: Le présent grec est rendu par un présent français simple, qui préserve le caractère vivant de la scène.
- source_word: τῇ εὐφροσύνῃ
  choice: dans la joie
  rationale: Le datif exprime vraisemblablement la manière ou l'état concomitant. « Dans la joie » conserve la force nominale de εὐφροσύνη sans expliciter une causalité absente du grec.
- source_word: τοῦ θεοῦ αὐτῶν
  choice: de leur Dieu
  rationale: Le génitif est rendu directement, sans préciser si Dieu est la source ou l'objet de cette joie, afin de préserver l'ambiguïté du grec.
- source_word: ἐκ νήσων μακρόθεν
  choice: des îles lointaines
  rationale: ἐκ indique la provenance, νῆσοι signifie normalement « îles », et μακρόθεν exprime l'éloignement. Dans l'usage biblique, νῆσοι peut aussi désigner des régions côtières, d'où la note.
- source_word: συνήγαγεν
  choice: a rassemblés
  rationale: Le passé composé rend naturellement en français l'aoriste grec comme action accomplie dont le résultat est pertinent dans la scène présente.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Le sujet explicite est conservé et placé après le complément initial, ce qui maintient l'accent sur l'action divine tout en restant naturel en français.
theological_decisions:
- issue: Rapport entre la joie et Dieu dans τοῦ θεοῦ αὐτῶν
  choice: « la joie de leur Dieu »
  alternative: « la joie qui vient de leur Dieu » ou « la joie devant leur Dieu »
  rationale: Le génitif grec ne tranche pas explicitement entre appartenance, origine ou relation. La formulation littérale préserve cette tension sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule reflète les deux mouvements parallèles du verset. La formulation conserve l'image géographique et l'ambiguïté du génitif grec.
