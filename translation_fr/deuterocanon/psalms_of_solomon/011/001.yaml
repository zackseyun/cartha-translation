  text: Sound the trumpet in Zion with the trumpet of the holy signal[b][a],
translation:
  language: fr
  text: Sonnez de la trompette en Sion, avec une trompette de signal des saints[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec une trompette de signal des saints ». La relation entre « signal » et « saints » est condensée en grec; elle peut indiquer un signal destiné aux saints. « Saints » peut aussi se comprendre plus largement comme « personnes consacrées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαλπίσατε
  choice: Sonnez de la trompette
  rationale: L’impératif aoriste pluriel de σαλπίζω appelle à faire publiquement retentir la trompette. Cette tournure française est naturelle et conserve la force de l’ordre.
- source_word: ἐν Σιὼν
  choice: dans Sion
  rationale: Le premier ἐν a ici une valeur locative, rendue directement par « dans ».
- source_word: ἐν σάλπιγγι
  choice: avec une trompette
  rationale: Le second ἐν suivi du datif exprime l’instrument. L’article indéfini respecte aussi l’absence d’article en grec.
- source_word: σημασίας
  choice: qui donne le signal
  rationale: 'Le génitif σημασίας caractérise la fonction de la trompette : elle sert à émettre un signal. La proposition relative produit un français clair sans réduire ce signal à une alarme militaire.'
- source_word: ἁγίων
  choice: aux saints
  rationale: 'L’adjectif substantivé au génitif pluriel désigne vraisemblablement les êtres ou les personnes saintes. Le datif français rend la lecture contextuelle du génitif objectif : le signal leur est destiné.'
theological_decisions:
- issue: Référent de ἁγίων
  choice: « les saints », sans préciser davantage leur identité
  alternative: « ceux qui sont saints », « les consacrés » ou, si le neutre est retenu, « les choses saintes »
  rationale: La forme grecque ne précise pas s’il s’agit des fidèles consacrés, de prêtres ou plus largement du peuple saint. Le contexte favorise des personnes, mais la traduction ne définit pas leur groupe.
- issue: Rapport syntaxique entre σημασίας et ἁγίων
  choice: 'génitif objectif : un signal adressé aux saints'
  alternative: « la trompette du signal des saints », où le génitif pourrait suggérer l’appartenance ou l’origine
  rationale: La suite du psaume, qui évoque le rassemblement et le retour, appuie la lecture d’un signal destiné aux saints. Une note conserve toutefois la compacité et l’ambiguïté de la construction grecque.
translation_notes:
  register: Français international moderne, solennel mais immédiatement compréhensible. « Saints » conserve le vocabulaire religieux du texte sans identifier plus précisément le groupe visé. La virgule finale est maintenue parce que l’extrait fourni se poursuit syntaxiquement.
