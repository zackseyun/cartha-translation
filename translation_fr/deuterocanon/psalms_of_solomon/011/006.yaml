  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
translation:
  language: fr
  text: Les collines s’enfuirent devant leur venue[a] ; les forêts leur donnèrent de l’ombre sur leur passage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant leur arrivée » ou « à leur entrée ». L’expression grecque est concise ; avec le verbe « s’enfuir », elle désigne ce devant quoi les collines fuient.
    reason: lexical_alternative
  - marker: b
    text: Ou « le long de leur chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ βουνοὶ
  choice: les collines
  rationale: βουνός désigne normalement une colline plutôt qu’une haute montagne ; « collines » conserve l’échelle probable de l’image.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: L’aoriste de φεύγω signifie directement « fuir » ; le verbe pronominal français maintient la vive personnification.
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: à leur approche
  rationale: Avec φεύγω, ἀπό marque ce devant quoi l’on fuit, tandis que εἴσοδος évoque ici la venue ou l’arrivée. « À leur approche » rend naturellement l’ensemble sans suggérer nécessairement l’entrée dans un lieu clos.
- source_word: οἱ δρυμοὶ
  choice: les forêts
  rationale: δρυμός peut désigner une région boisée, un bois ou un fourré ; « forêts » restitue clairement l’image d’étendues boisées.
- source_word: ἐσκίασαν αὐτοῖς
  choice: leur donnèrent de l’ombre
  rationale: Cette formulation rend le datif bénéficiaire αὐτοῖς et l’action de procurer de l’ombre.
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: sur leur passage
  rationale: πάροδος désigne le passage, le trajet ou le fait de passer ; « sur leur passage » est idiomatique et reste proche du grec.
