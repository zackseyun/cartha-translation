  source_fidelity: 'Le sens général est fidèle : Jérusalem est appelée à se placer en un lieu élevé et à voir ses enfants rassemblés depuis l’est et l’ouest par le Seigneur. « Tous ensemble » rend de façon recevable εἰς ἅπαξ, dont la nuance peut être celle d’un rassemblement commun ou simultané ; la note préserve l’autre possibilité. Toutefois, « tiens-toi debout » évoque plus volontiers le maintien d’une position déjà prise que l’appel ponctuel de στῆθι. « Dresse-toi » exprime plus naturellement l’impératif grec dans cette adresse poétique.'
