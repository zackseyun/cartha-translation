  text: Stand[a], O Jerusalem, on high[c][b], and see your children gathered from east and west by the Lord.
translation:
  language: fr
  text: Dresse-toi, Jérusalem, sur une hauteur, et regarde tes enfants, que le Seigneur a rassemblés tous ensemble de l’est et de l’ouest[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en une seule fois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆθι
  choice: Tiens-toi debout
  rationale: L’impératif appelle Jérusalem à prendre position pour regarder. « Tiens-toi debout » est direct et naturel, sans ajouter l’idée explicite de se relever.
- source_word: ἐφʼ ὑψηλοῦ
  choice: sur une hauteur
  rationale: L’expression désigne ici un point d’observation élevé et concret. « Sur une hauteur » évite la possible connotation céleste de « dans les hauteurs ».
- source_word: τέκνα
  choice: enfants
  rationale: Le terme grec englobe les descendants ou les membres du peuple de Jérusalem sans restriction de sexe.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: de l’est et de l’ouest
  rationale: Les pluriels grecs désignent idiomatiquement les directions ou régions orientales et occidentales.
- source_word: συνηγμένα
  choice: a rassemblés
  rationale: La tournure participiale grecque est rendue par une proposition relative active, plus naturelle en français, tout en conservant le Seigneur comme agent du rassemblement.
- source_word: εἰς ἅπαξ
  choice: tous ensemble
  rationale: Dans ce contexte, l’expression souligne vraisemblablement le rassemblement commun ou simultané plutôt qu’une soudaineté. Une note conserve l’autre lecture possible.
- source_word: ἀπὸ Κυρίου
  choice: que le Seigneur a rassemblés
  rationale: Avec le participe passif, ἀπό indique naturellement l’agent ou la source du rassemblement. La formulation active est idiomatique en français.
theological_decisions:
- issue: Portée de εἰς ἅπαξ
  choice: tous ensemble
  alternative: en une seule fois
  rationale: Le texte peut évoquer soit l’unité du rassemblement, soit sa simultanéité. Le texte principal retient la lecture la plus naturelle dans le contexte, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. L’adresse directe à Jérusalem et l’image concrète du point d’observation élevé sont conservées; la syntaxe grecque est légèrement réorganisée pour une lecture française naturelle.
