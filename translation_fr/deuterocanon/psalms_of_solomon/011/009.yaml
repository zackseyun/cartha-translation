base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/009.yaml
  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: fr
  text: Que le Seigneur accomplisse ce qu’il a déclaré au sujet d’Israël et de Jérusalem[a] ! Que le Seigneur relève Israël au nom de sa gloire[b] ! Que la miséricorde du Seigneur soit sur Israël pour toujours et à jamais[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réalise ce qu’il a dit concernant Israël et Jérusalem ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rétablisse Israël ».'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « pour l’éternité et encore » ; l’expression souligne une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι
  choice: accomplisse
  rationale: Dans ce souhait à valeur de prière, « accomplir » exprime naturellement l’idée de faire effectivement ce qui a été déclaré, sans ajouter de contenu absent du grec.
- source_word: ἐλάλησεν ἐπὶ
  choice: a déclaré au sujet de
  rationale: Cette formulation rend la parole prononcée à propos d’Israël et de Jérusalem; « déclaré » convient au registre solennel sans imposer explicitement la notion de prophétie.
- source_word: ἀναστήσαι
  choice: relève
  rationale: « Relever » conserve l’image ouverte du grec, qui peut évoquer le relèvement, le rétablissement ou la remise debout, sans la limiter à une restauration politique ni à la résurrection.
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: au nom de sa gloire
  rationale: Ce calque intelligible préserve la construction condensée du grec ainsi que la présence distincte de « nom » et de « gloire ».
- source_word: ἔλεος
  choice: miséricorde
  rationale: « Miséricorde » est ici un équivalent précis, transparent et digne, sans explicitation théologique supplémentaire.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: pour toujours et à jamais
  rationale: Cette formule française naturelle rend la durée intensifiée de l’expression grecque, littéralement « pour l’éternité et encore ».
theological_decisions:
- issue: Sens du relèvement d’Israël
  choice: « relève Israël » sans préciser la nature du relèvement
  alternative: « rétablisse Israël » ou « fasse se lever Israël »
  rationale: Le verbe grec permet plusieurs nuances — relèvement, restauration, remise debout — et le contexte ne justifie pas de trancher entre une lecture politique, nationale, spirituelle ou résurrectionnelle.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les deux premiers membres sont rendus comme des souhaits-prières parallèles. « Relève » maintient l’ambiguïté théologique du grec; la locution inhabituelle « au nom de sa gloire » est conservée afin de ne pas réduire « nom » et « gloire » à un simple adjectif.
