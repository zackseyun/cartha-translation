  yaml_path: translation/deuterocanon/psalms_of_solomon/011/007.yaml
  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: fr
  text: Dieu fit pousser pour eux tout arbre odorant, afin qu’Israël puisse traverser dans la visitation de la gloire de son Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la surveillance attentive » ou « dans la sollicitude de la gloire de son Dieu ». Le mot grec peut désigner une visitation, une surveillance attentive ou des soins.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ξύλον
  choice: toutes sortes d’arbres
  rationale: Avec le singulier ξύλον, πᾶν a une portée distributive. Cette formulation française exprime naturellement l’ensemble des arbres concernés sans suggérer un seul arbre collectif.
- source_word: εὐωδίας
  choice: odorants
  rationale: Le génitif qualifie les arbres par leur parfum. « Odorants » garde l’image olfactive dans un registre poétique et digne.
- source_word: ἀνέτειλεν
  choice: fit pousser
  rationale: Le verbe évoque ici la croissance ou le jaillissement végétal; la tournure causative conserve explicitement l’action de Dieu.
- source_word: παρέλθῃ
  choice: puisse passer
  rationale: Le contexte présente le déplacement d’Israël à travers le lieu ainsi préparé. « Passer » demeure naturel tout en laissant le complément implicite, comme en grec.
- source_word: ἐπισκοπῇ
  choice: visitation
  rationale: Le terme peut désigner une venue attentive, une surveillance ou des soins. « Visitation » conserve le relief théologique et l’ambiguïté du grec, avec les autres sens signalés en note.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » est le terme biblique usuel pour la splendeur et la majesté divines et respecte la construction génitive du grec.
- source_word: αὐτῶν
  choice: son
  rationale: Le pronom grec renvoie à Israël envisagé comme peuple. En français, le singulier « son Dieu » s’accorde naturellement avec le collectif « Israël ».
theological_decisions:
- issue: Sens de ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν
  choice: sous la visitation de la gloire de son Dieu
  alternative: sous la garde, ou sous les soins, de la gloire de son Dieu
  rationale: La traduction principale maintient l’idée d’une intervention ou présence divine sans réduire ἐπισκοπή à une simple surveillance administrative. La note préserve les autres valeurs lexicales possibles et la tension de la construction « de la gloire ».
translation_notes:
  register: Français international moderne, poétique et accessible. « Toutes sortes d’arbres odorants » rend la valeur distributive de πᾶν avec naturel. La formulation plus inhabituelle « visitation de la gloire » est volontairement conservée afin de ne pas résoudre la construction grecque ni sa portée théologique.
