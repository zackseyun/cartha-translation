  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
translation:
  language: fr
  text: Car si tu envoies la mort[a], tu lui donneras des instructions à notre sujet ; car tu es miséricordieux et tu ne te mettras pas en colère au point de nous anéantir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec personnifie la mort et la reprend par un pronom masculin.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλῃς
  choice: envoies
  rationale: Le verbe signifie directement « envoyer » ; le subjonctif français convient après « si » dans cette formulation hypothétique.
- source_word: θάνατον
  choice: la mort
  rationale: Le sens lexical premier est « la mort ». Le contexte peut évoquer une mortalité ou une peste envoyée comme jugement, sans que le mot grec l’impose à lui seul.
- source_word: ἐντελῇ αὐτῷ
  choice: tu lui donneras des ordres
  rationale: Cette tournure naturelle exprime l’autorité exercée sur la mort et conserve la personnification marquée par le pronom masculin grec.
- source_word: περὶ ἡμῶν
  choice: à notre sujet
  rationale: Rend sans précision indue le rapport visé par les ordres donnés à la mort.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Équivalent biblique courant et précis, exprimant la disposition à faire grâce.
- source_word: οὐκ ὀργισθήσῃ
  choice: tu ne te mettras pas en colère
  rationale: Rend le futur passif de forme déponente sans ajouter explicitement une mesure d’intensité absente du verbe.
- source_word: τοῦ συντελέσαι ἡμᾶς
  choice: au point de nous anéantir
  rationale: Le génitif de l’infinitif indique ici l’issue ou la conséquence ; « anéantir » exprime l’idée d’en finir complètement avec le groupe.
theological_decisions:
- issue: La mort comme agent soumis aux ordres de Dieu
  choice: Conserver la personnification par « lui »
  alternative: Employer « elle » selon le genre grammatical français, ou « la peste »
  rationale: Le grec reprend θάνατος par un pronom masculin et présente ainsi la mort comme un agent auquel Dieu commande. « Lui » maintient discrètement cet effet malgré le féminin grammatical de « mort » en français.
- issue: Portée de la colère divine
  choice: « au point de nous anéantir »
  alternative: « assez pour nous anéantir »
  rationale: La traduction retenue conserve le lien entre colère et destruction totale sans suggérer que Dieu atteindrait simplement un seuil quantitatif de colère.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu. La ponctuation conserve la progression argumentative du grec, tandis que « donner des ordres » est plus naturel en français que le calque « commander à son sujet ».
