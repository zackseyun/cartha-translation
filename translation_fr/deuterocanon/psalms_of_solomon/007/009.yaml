base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
translation:
  language: fr
  text: Tu nous conduiras au temps de ton secours, afin de faire miséricorde à la maison de Jacob, en vue du jour que tu leur as promis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme du dernier verbe est difficile dans le texte grec. D’après le contexte, elle est comprise ici au sens de « tu leur as promis » ; une lecture plus littérale de la forme transmise serait « je leur ai promis ».
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  choice: tu nous conduiras
  rationale: Le verbe exprime l’action de diriger ou de rendre droit un chemin. « Conduire » rend naturellement, dans cette prière, l’idée que Dieu oriente les siens sans imposer l’image plus précise de l’aplanissement.
- source_word: ἐν καιρῷ ἀντιλήψεως σου
  choice: au temps de ton secours
  rationale: καιρός désigne ici un temps ou moment déterminé, et ἀντίληψις une aide ou un soutien. « Secours » convient au contexte d’une intervention divine sans restreindre le sens à la seule délivrance.
- source_word: τοῦ ἐλεῆσαι
  choice: afin de faire miséricorde à
  rationale: L’infinitif articulé indique vraisemblablement le but. « Faire miséricorde à » conserve la force biblique de ἐλεέω dans un français digne et intelligible.
- source_word: τὸν οἶκον Ἰακώβ
  choice: la maison de Jacob
  rationale: La formule collective et conventionnelle est conservée telle quelle plutôt que remplacée par l’interprétation « Israël ».
- source_word: εἰς ἡμέραν ἐν ᾗ
  choice: en vue du jour que
  rationale: εἰς porte une orientation vers le jour mentionné, tandis que ἐν ᾗ introduit la relative. Cette formulation française préserve l’idée prospective sans produire le tour peu naturel « dans le jour ».
- source_word: ἐπηγγείλω αὐτοῖς
  choice: tu leur as promis
  rationale: La forme transmise est difficile. Le contexte d’adresse directe à Dieu favorise la deuxième personne, tout en nécessitant une note signalant l’incertitude textuelle.
theological_decisions:
- issue: Identification de « la maison de Jacob »
  choice: Maintien de « la maison de Jacob »
  alternative: Israël ; le peuple d’Israël
  rationale: Le grec emploie précisément cette expression conventionnelle. La conserver respecte sa texture biblique et sa portée collective sans introduire une explicitation interprétative.
- issue: Personne grammaticale du verbe final
  choice: 'Deuxième personne : « tu leur as promis »'
  alternative: 'Première personne : « je leur ai promis »'
  rationale: L’ensemble du verset s’adresse à Dieu à la deuxième personne, ce qui rend cette lecture contextuellement cohérente. La difficulté réelle de la forme grecque est toutefois maintenue dans une note plutôt que dissimulée.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur de l’adresse priante, le vocabulaire biblique « faire miséricorde » et l’expression « maison de Jacob » sont conservés, tandis que la syntaxe grecque est légèrement réorganisée pour rester claire en français.
