base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/003.yaml
  text: Discipline us according to your will[c][b][a], and do not give us over to the nations.
translation:
  language: fr
  text: Toi, corrige-nous[a] selon ta volonté, et ne nous livre pas[b] aux nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instruis-nous », « forme-nous » ou « châtie-nous ». Le verbe grec englobe la formation et la correction.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne donne pas aux nations »; « nous » est sous-entendu d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Toi
  rationale: Le pronom exprimé renforce le sujet et met l’action de Dieu en contraste avec la remise du peuple aux nations.
- source_word: ἐν θελήματί σου
  choice: selon ta volonté
  rationale: Dans ce contexte, ἐν indique naturellement la conformité à la volonté divine; cette tournure française est claire sans surinterpréter le rapport précis.
- source_word: παιδεύσον
  choice: corrige-nous
  rationale: Le verbe παιδεύω peut désigner une éducation formatrice aussi bien qu’une correction. À l’impératif, « corrige-nous » rend ici clairement la demande adressée à Dieu, tandis qu’une note conserve l’étendue du terme grec.
- source_word: μὴ δῷς ἔθνεσιν
  choice: ne nous livre pas aux nations
  rationale: Le grec dit littéralement « ne donne pas aux nations »; « nous », repris du premier membre, est sous-entendu. « Livrer » exprime idiomatiquement la remise au pouvoir d’autrui, sans préciser davantage le sort envisagé.
- source_word: ἔθνεσιν
  choice: aux nations
  rationale: « Nations » conserve la désignation large des peuples étrangers sans la restreindre explicitement au sens religieux de « païens ».
theological_decisions:
- issue: Rapport entre la correction divine et la domination étrangère
  choice: Maintenir le contraste sans expliquer la correction comme un châtiment précis
  alternative: Interpréter explicitement la correction comme un châtiment infligé directement par Dieu
  rationale: Le vers oppose la demande d’être corrigé par Dieu au fait d’être livré aux nations, mais ne définit ni les moyens ni la nature exacte de cette correction.
translation_notes:
  register: Français moderne, direct et digne. « Toi » garde l’insistance du pronom grec sans alourdir l’impératif. « Corrige-nous » est plus naturel ici que « discipline-nous », tout en nécessitant une note pour préserver la dimension formatrice de παιδεύω.
