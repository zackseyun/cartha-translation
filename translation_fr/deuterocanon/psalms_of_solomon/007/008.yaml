base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: fr
  text: Car tu auras compassion de la descendance d’Israël pour toujours, et tu ne la rejetteras pas. Et nous serons pour toujours sous ton joug et sous le fouet de ta discipline.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτειρήσεις
  choice: tu auras compassion
  rationale: Rend directement le futur du verbe exprimant la compassion, dans un français naturel et digne.
- source_word: τὸ γένος Ἰσραήλ
  choice: le peuple d’Israël
  rationale: γένος désigne ici la collectivité ou la lignée d’Israël; «peuple» est clair en français actuel sans imposer le sens biologique plus étroit de «race».
- source_word: οὐκ ἀπώσεις
  choice: tu ne le rejetteras pas
  rationale: Le pronom reprend naturellement «le peuple d’Israël»; «rejeter» conserve l’idée d’écarter ou de repousser.
- source_word: ὑπὸ ζυγόν σου
  choice: sous ton joug
  rationale: Conserve l’image concrète du joug et sa portée de soumission à l’autorité divine.
- source_word: μάστιγα παιδίας σου
  choice: sous le fouet de ta discipline
  rationale: μάστιξ est un fouet ou un instrument de châtiment; παιδεία évoque ici une correction éducative, rendue par «discipline».
theological_decisions:
- issue: Durée de la compassion divine et de la soumission d’Israël
  choice: pour toujours
  alternative: à jamais / pour l’éternité
  rationale: εἰς τὸν αἰῶνα est conservé avec sa force durable sans préciser davantage la nature métaphysique de cette durée.
- issue: Sens de la correction divine
  choice: le fouet de ta discipline
  alternative: la verge de ta correction
  rationale: La traduction maintient ensemble la dureté de μάστιξ et la dimension formative de παιδεία, sans atténuer ni systématiser la tension.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La coordination grecque est répartie en deux phrases pour une lecture fluide, tout en conservant le parallélisme entre le joug et le fouet.
