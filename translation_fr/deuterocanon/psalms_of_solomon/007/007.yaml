  text: And we will call upon you[a], and you will hear us.
translation:
  language: fr
  text: Et nous, nous t’invoquerons, et tu nous entendras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu nous écouteras » ; le verbe peut impliquer une écoute favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσόμεθαί
  choice: nous ferons appel à
  rationale: Dans un contexte de prière, ἐπικαλέω signifie appeler, invoquer ou faire appel à quelqu’un. « Faire appel à toi » est naturel en français actuel et conserve l’idée d’une invocation adressée directement à Dieu.
- source_word: σε
  choice: toi
  rationale: Le pronom objet direct de deuxième personne est rendu explicitement, avec le tutoiement habituel dans la langue biblique française contemporaine.
- source_word: ἐπακούσει
  choice: tu nous écouteras
  rationale: ἐπακούω peut exprimer le fait d’entendre, d’écouter favorablement ou d’exaucer. « Écouter » conserve le sens lexical sans affirmer explicitement une réponse qui n’est pas formulée dans le grec.
- source_word: ἡμῶν
  choice: nous
  rationale: 'Le génitif régi par ἐπακούω se rend idiomatiquement en français par un pronom objet direct : « nous écouteras ».'
theological_decisions:
- issue: Portée de l’écoute divine exprimée par ἐπακούσει
  choice: tu nous écouteras
  alternative: tu nous exauceras
  rationale: « Exaucer » préciserait que Dieu accorde la demande, tandis que le grec peut aussi signifier entendre ou prêter une attention favorable. La traduction choisie préserve cette latitude.
translation_notes:
  register: Français moderne, simple et digne. La reprise « Et nous, nous » rend l’emphase de καὶ ἡμεῖς. Le futur est conservé dans les deux propositions, et la ponctuation maintient leur parallélisme.
