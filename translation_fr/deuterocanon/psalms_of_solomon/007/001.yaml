  source_fidelity: 'Le texte rend fidèlement la prière grecque : l’impératif négatif adressé à Dieu, l’éloignement « de nous », la conséquence redoutée introduite par ἵνα μή, l’hostilité des adversaires et δωρεάν sont tous conservés. « Ne t’éloigne pas » est une transposition idiomatique sûre de ἀποσκηνώσῃς ; la note préserve à juste titre l’image de campement ou de tente sans introduire dans le texte un complément absent du grec.'
  naturalness: Le français est moderne, fluide et convient au registre priant. « Ô Dieu » et « de peur que… ne » sont dignes sans être archaïsants. La place de « sans raison » après « nous haïssent » l’associe naturellement à la haine, tandis que la note signale correctement l’autre portée possible.
