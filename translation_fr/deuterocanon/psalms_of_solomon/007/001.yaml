  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: fr
  text: Ne t’éloigne pas de nous, ô Dieu,[a] de peur que ceux qui nous haïssent sans raison ne nous attaquent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est littéralement lié au fait de lever le camp ou de déplacer sa tente; il évoque ici le retrait de la présence de Dieu.
    reason: cultural_note
  - marker: b
    text: 'Ou : « de peur que ceux qui nous haïssent ne nous attaquent gratuitement ». L’adverbe grec peut se rapporter soit à leur haine, soit à leur attaque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: t’éloigne
  rationale: Le verbe évoque littéralement le fait de lever le camp ou de déplacer sa tente, et exprime ici le retrait de la présence de Dieu. « T’éloigne » reste naturel en français tout en conservant l’idée de séparation; l’image concrète est signalée en note.
- source_word: ἀφʼ ἡμῶν
  choice: de nous
  rationale: La préposition marque l’éloignement par rapport à la communauté.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif grec a ici une valeur vocative; « ô Dieu » convient au registre digne d’une prière.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: La locution introduit le résultat redouté et se rend naturellement ainsi en français soutenu mais courant.
- source_word: ἐπιθῶνται ἡμῖν
  choice: ne nous attaquent
  rationale: Le verbe désigne ici une action hostile dirigée contre la communauté; « attaquer » en donne clairement le sens.
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: ceux qui nous haïssent
  rationale: Cette proposition relative rend naturellement le participe substantivé grec.
- source_word: δωρεάν
  choice: sans raison
  rationale: L’adverbe peut qualifier la haine comme injustifiée ou l’attaque comme gratuite. Dans le texte principal, « sans raison » est rattaché à la haine, sans exclure l’autre analyse signalée en note.
theological_decisions:
- issue: Image de la tente et retrait de la présence divine dans ἀποσκηνώσῃς
  choice: Traduction idiomatique « t’éloigne », avec l’image littérale explicitée en note
  alternative: « ne retire pas ta demeure de chez nous » ou « ne lève pas ton camp loin de nous »
  rationale: Le grec porte une image d’installation ou de campement, potentiellement importante dans le contexte du psaume, mais une traduction française trop littérale introduirait un complément possessif absent et paraîtrait artificielle. La note préserve cette dimension sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français moderne, naturel et digne, avec tutoiement de Dieu conforme au registre biblique français courant. La formulation conserve la supplication collective et la portée redoutée de ἵνα μή.
