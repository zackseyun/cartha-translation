  yaml_path: translation/deuterocanon/psalms_of_solomon/007/002.yaml
  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: fr
  text: Car tu les as repoussés[a], ô Dieu ; que leur pied ne foule pas l’héritage de ton sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme grecque est comprise ici comme « tu les as repoussés ». Elle a parfois été interprétée comme une demande : « repousse-les, ô Dieu » ; toutefois, sa morphologie et l’usage de la Septante favorisent l’indicatif passé.'
    reason: alternative_reading
  - marker: b
    text: 'Autre compréhension possible : « ton saint héritage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσω
  choice: tu les as repoussés
  rationale: La forme est comprise comme un aoriste moyen indicatif à la deuxième personne du singulier, sans augment, usage attesté dans le grec de la Septante. « Repoussés » conserve l’idée d’un éloignement énergique, adaptée à la menace ennemie.
- source_word: μὴ πατήσαι
  choice: que … ne foule pas
  rationale: L’aoriste optatif précédé de μή exprime ici un souhait ou une prière indépendante. Cette tournure française en garde la valeur sans en faire une proposition de but (« de peur que »).
- source_word: ὁ ποὺς αὐτῶν
  choice: leur pied
  rationale: Le singulier collectif du grec est conservé ; en français, « leur pied » reste naturel dans ce registre poétique et souligne l’action commune des adversaires.
- source_word: κληρονομίαν
  choice: l’héritage
  rationale: « Héritage » préserve les résonances d’appartenance sacrée et d’alliance du terme grec, davantage que « possession ».
- source_word: ἁγιάσματός
  choice: de ton sanctuaire
  rationale: Dans ce contexte de profanation menaçante, le nom désigne naturellement le lieu consacré à Dieu. « Sanctuaire » exprime clairement cette dimension cultuelle.
theological_decisions:
- issue: Rapport entre le sanctuaire et l’héritage
  choice: l’héritage de ton sanctuaire
  alternative: ton saint héritage
  rationale: Le génitif grec peut désigner l’héritage appartenant au sanctuaire ou être compris de façon plus attributive. Le texte principal conserve la construction génitive sans trancher davantage l’identité précise de cet héritage.
translation_notes:
  register: Français international actuel, digne et poétique. L’invocation « ô Dieu » maintient la solennité sans archaïsme excessif ; le singulier collectif « leur pied » suit de près le grec.
