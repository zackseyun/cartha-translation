  text: When your name dwells in our midst[a], we will be shown mercy,
translation:
  language: fr
  text: Quand ton nom demeurera au milieu de nous[a], il nous sera fait miséricorde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, avec l’image de la tente : « Quand ton nom plante sa tente parmi nous. »'
    reason: Alternative lexicale qui fait ressortir l’image de la tente associée à κατασκηνόω, sans remplacer dans le texte principal la formulation naturelle « demeure ».
lexical_decisions:
- source_word: ἐν τῷ κατασκηνοῦν
  choice: Quand ... demeure
  rationale: L’infinitif articulé précédé de ἐν exprime ici une circonstance temporelle. « Quand » est naturel en français et « demeure » conserve l’idée de résidence durable.
- source_word: κατασκηνοῦν
  choice: demeure
  rationale: Le verbe évoque l’installation sous une tente ou le fait d’établir sa demeure. « Demeure » convient au registre biblique moderne sans rendre la métaphore trop explicitement.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: La formulation grecque est maintenue, car le « nom » peut évoquer la présence manifestée de Dieu sans que cette portée soit imposée dans la traduction.
- source_word: ἐν μέσῳ ἡμῶν
  choice: au milieu de nous
  rationale: Cette expression française naturelle préserve la dimension communautaire et spatiale de l’original.
- source_word: ἐλεηθησόμεθα
  choice: il nous sera fait miséricorde
  rationale: Cette tournure conserve explicitement le futur passif grec et son registre solennel, sans réduire la miséricorde à un simple sentiment de pitié.
theological_decisions:
- issue: Le rapport entre le nom divin et la présence divine
  choice: Conserver « ton nom »
  alternative: Rendre par « ta présence »
  rationale: L’original parle du nom et laisse ouverte sa relation métaphorique avec la présence de Dieu. Une explicitation dans le texte principal résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La proposition garde le parallélisme solennel et l’image biblique du nom divin, tandis que la note restitue la métaphore plus concrète de la tente.
