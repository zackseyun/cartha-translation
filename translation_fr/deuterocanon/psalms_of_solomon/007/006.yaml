  text: and no nation will prevail against us, because you are our defender.
translation:
  language: fr
  text: Et aucune nation ne l’emportera sur nous, car tu es notre défenseur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: ne l’emportera
  rationale: Avec πρὸς ἡμᾶς, le verbe ἰσχύω exprime ici la capacité de vaincre ou de prévaloir contre quelqu’un. « Ne l’emportera » rend naturellement cette idée en français.
- source_word: πρὸς ἡμᾶς
  choice: sur nous
  rationale: Après « l’emporter », le français emploie naturellement « sur » pour exprimer le rapport d’opposition indiqué ici par πρός avec l’accusatif.
- source_word: ἔθνος
  choice: nation
  rationale: « Nation » correspond directement au singulier grec et conserve sa possible valeur collective sans ajouter l’idée plus précise de « païens ».
- source_word: ὑπερασπιστής
  choice: défenseur
  rationale: Le nom désigne celui qui prend la défense de quelqu’un. « Défenseur » conserve la forme nominale, la concision et la force du titre attribué à Dieu.
theological_decisions:
- issue: Formulation de la protection divine
  choice: car tu es notre défenseur
  alternative: car tu es celui qui nous protège
  rationale: Le grec attribue à Dieu un nom à valeur de titre plutôt qu’il n’emploie une proposition verbale. « Notre défenseur » préserve cette formulation compacte et confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La coordination initiale « Et » respecte καί et le lien avec le contexte. Le futur affirmatif sous négation est conservé sans explicitation supplémentaire.
