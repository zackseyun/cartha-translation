  yaml_path: translation/deuterocanon/psalms_of_solomon/008/029.yaml
  text: Praised be the Lord[b][a], who judges the whole earth in his righteousness.
translation:
  language: fr
  text: Que le Seigneur soit loué, lui qui juge toute la terre selon sa justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνετὸς
  choice: Que … soit loué
  rationale: L’adjectif verbal signifie « digne de louange » ou « loué ». La tournure optative française restitue naturellement la formule doxologique sans la confondre avec εὐλογητός, « béni ».
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rend le titre défini qui désigne ici le Seigneur comme figure connue.
- source_word: ὁ κρίνων
  choice: lui qui juge
  rationale: La proposition relative rend naturellement le participe présent substantivé tout en soulignant celui qui exerce le jugement.
- source_word: πᾶσαν τὴν γῆν
  choice: toute la terre
  rationale: Dans ce contexte, γῆ désigne vraisemblablement la terre entière plutôt qu’un territoire particulier; πᾶσαν en marque l’étendue universelle.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: selon sa justice
  rationale: La préposition ἐν indique ici la norme ou la manière du jugement. « Justice » exprime clairement en français la rectitude judiciaire et morale de δικαιοσύνη.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le jugement divin
  choice: justice
  alternative: droiture
  rationale: « Justice » convient particulièrement à l’acte de juger, tandis que « droiture » demeure une possibilité plus large. Le choix n’impose aucune conception confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère doxologique de l’ouverture et la portée universelle du jugement.
