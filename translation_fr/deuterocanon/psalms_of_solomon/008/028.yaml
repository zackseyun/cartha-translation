  text: And the holy ones of God were like lambs in innocence in their midst[a][b][c][d].
translation:
  language: fr
  text: Et les fidèles[a] de Dieu étaient[b] comme des agneaux, dans l’innocence[c], au milieu d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes pieuses ».
    reason: lexical_alternative
  - marker: b
    text: Le grec ne comporte pas de verbe dans cette proposition ; le passé est fourni par le contexte.
    reason: grammatical_ambiguity
  - marker: c
    text: Le terme grec peut aussi évoquer l’absence de malice ou la simplicité.
    reason: lexical_semantic_range
lexical_decisions:
- source_word: ὅσιοι
  choice: les fidèles
  rationale: Le terme désigne ici ceux qui se caractérisent par leur piété et leur loyauté envers Dieu. « Les fidèles » rend cette identité religieuse sans les connotations ecclésiastiques plus tardives que pourrait évoquer « les saints ».
- source_word: ἀρνία
  choice: des agneaux
  rationale: Le grec désigne précisément des agneaux et conserve ainsi l’image de douceur, d’innocence et de vulnérabilité.
- source_word: ἐν ἀκακίᾳ
  choice: dans leur innocence
  rationale: Le nom grec exprime l’innocence ou l’absence de malice. Cette formulation nominale reste proche du grec tout en étant naturelle en français.
- source_word: ἐν μέσῳ αὐτῶν
  choice: au milieu d’eux
  rationale: La formulation conserve l’image spatiale ainsi que l’antécédent implicite du pronom, sans chercher à le préciser.
theological_decisions:
- issue: Identité des ὅσιοι
  choice: les fidèles
  alternative: les saints / les hommes pieux
  rationale: « Les fidèles » met en avant la piété loyale envers Dieu propre à ὅσιοι, sans confondre automatiquement ce terme avec ἅγιοι ni importer une catégorie ecclésiastique ultérieure.
translation_notes:
  register: Français moderne, sobre et digne. La tournure garde l’image des agneaux et la structure nominale de ἐν ἀκακίᾳ, tandis que les virgules rendent les rapports entre les compléments plus lisibles.
