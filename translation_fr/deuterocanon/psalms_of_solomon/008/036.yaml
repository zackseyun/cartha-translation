base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: fr
  text: Ne nous ignore pas, notre Dieu, de peur que les nations ne nous engloutissent comme s’il n’y avait personne pour nous délivrer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme s’il n’y avait personne pour nous racheter » ; autre traduction possible : « comme s’il n’y avait aucun libérateur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Ne nous ignore pas
  rationale: Le verbe exprime l’idée de détourner le regard, de ne pas tenir compte. « Ne nous ignore pas » est naturel en français moderne et conserve la force de la supplication.
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Le groupe nominal a ici une valeur d’apostrophe. « Notre Dieu » rend simplement et dignement cette adresse.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: Dans ce contexte, la construction introduit le résultat redouté. Cette tournure française en restitue clairement la nuance.
- source_word: καταπίωσιν
  choice: engloutissent
  rationale: Le verbe évoque littéralement l’action d’avaler. « Engloutir » préserve cette image vive tout en convenant naturellement à des nations ennemies.
- source_word: ἔθνη
  choice: les nations
  rationale: Le terme désigne ici les nations étrangères. L’article défini rend en français la catégorie reconnue des peuples hostiles sans imposer le terme confessionnel « païens ».
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: comme s’il n’y avait personne pour nous délivrer
  rationale: La construction au participe évoque l’absence de quelqu’un qui accomplisse l’action de délivrer ou de racheter. La formulation verbale évite d’en faire artificiellement un titre et explicite l’objet sous-entendu en français.
theological_decisions:
- issue: Sens de λυτρουμένου
  choice: pour nous délivrer
  alternative: pour nous racheter ; aucun libérateur
  rationale: Le verbe peut exprimer la délivrance et le rachat. Dans la menace d’anéantissement par les nations, « délivrer » est idiomatique, tandis que la note conserve la nuance possible de rachat et l’interprétation substantivée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la supplication directe, l’image concrète de l’engloutissement et l’ambiguïté entre délivrance, rachat et figure du libérateur.
