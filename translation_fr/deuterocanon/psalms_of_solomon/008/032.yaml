  yaml_path: translation/deuterocanon/psalms_of_solomon/008/032.yaml
  text: For you are the God of righteousness[b][a], judging Israel with discipline.
translation:
  language: fr
  text: Car toi, tu es le Dieu de la justice[a], toi qui juges Israël en le corrigeant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la droiture ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la discipline » ; ou « par la discipline ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’affirmation ou de la prière précédente ; « Car » conserve naturellement cette valeur explicative.
- source_word: σὺ ὁ θεὸς
  choice: toi, tu es le Dieu
  rationale: La reprise « toi, tu » rend l’insistance portée par le pronom grec σὺ, tandis que le verbe « es », sous-entendu en grec, est nécessaire en français.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans « Dieu de la justice », le terme désigne à la fois la rectitude morale de Dieu et son juste gouvernement. « Justice » est ici plus naturel que « droiture », signalé néanmoins en note comme autre nuance possible.
- source_word: κρίνων
  choice: toi qui juges
  rationale: Cette tournure française restitue le participe présent comme caractérisation continue de Dieu tout en évitant une construction participiale peu naturelle.
- source_word: Ἰσραὴλ
  choice: Israël
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: ἐν παιδείᾳ
  choice: en le corrigeant
  rationale: παιδεία évoque ici une action éducative et corrective, non un simple enseignement. La formulation verbale est naturelle en français et conserve le lien entre jugement et correction ; la formulation nominale plus littérale est donnée en note.
theological_decisions:
- issue: Rapport entre le jugement divin et la παιδεία
  choice: juges Israël en le corrigeant
  alternative: juges Israël par la discipline
  rationale: Le texte présente le jugement comme exercé dans ou par une correction éducative. La traduction maintient ce lien sans réduire le jugement à une condamnation ni préciser davantage la nature de la correction.
translation_notes:
  register: Français moderne, courant et digne. La répétition emphatique « toi, tu » reflète σὺ sans alourdir excessivement la phrase. « En le corrigeant » privilégie l’intelligibilité tout en conservant en note l’image nominale et l’ambiguïté prépositionnelle du grec.
