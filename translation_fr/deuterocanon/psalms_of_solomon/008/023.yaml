  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: fr
  text: Il fit périr leurs dirigeants et toute personne sage en conseil[a] ; il répandit le sang des habitants de Jérusalem comme de l’eau d’impureté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui étaient sages dans le conseil » ou « tous les sages conseillers ». La formule grecque est condensée et collective.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme de l’eau impure ». Littéralement, « comme de l’eau d’impureté » ; aussi « de souillure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: fit périr
  rationale: Le verbe exprime le fait de mener à la ruine ou à la mort. « Fit périr » conserve cette force sans réduire artificiellement le sens au seul acte d’exécuter.
- source_word: ἄρχοντας αὐτῶν
  choice: leurs dirigeants
  rationale: ἄρχοντες désigne ceux qui exercent l’autorité ; « dirigeants » est clair en français moderne et garde la portée politique du terme.
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: tous ceux qui étaient sages dans le conseil
  rationale: La formule grecque, au singulier collectif, est condensée. Cette traduction en restitue la référence personnelle et collective tout en préservant l’idée de sagesse dans la délibération.
- source_word: ἐξέχεεν
  choice: répandit
  rationale: « Répandit » conserve l’image concrète du sang versé comme un liquide et correspond naturellement au verbe grec.
- source_word: τῶν οἰκούντων Ἰερουσαλήμ
  choice: des habitants de Jérusalem
  rationale: Cette formulation française naturelle rend le participe substantivé désignant ceux qui habitent Jérusalem.
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: comme une eau d’impureté
  rationale: Le génitif nominal ἀκαθαρσίας signifie littéralement « d’impureté » ou « de souillure ». La formulation retenue préserve cette construction et sa possible résonance rituelle, sans la réduire au simple adjectif « sale ».
theological_decisions:
- issue: Portée de ἀκαθαρσία dans la comparaison finale
  choice: eau d’impureté
  alternative: eau impure
  rationale: Le nom grec peut évoquer l’impureté ou la souillure, éventuellement dans un sens cultuel. Le génitif français maintient cette tension, tandis que « eau impure » serait plus idiomatique mais moins précis quant à la forme et aux résonances du grec.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme en deux propositions parallèles et l’image forte du sang répandu sont conservés. « Eau d’impureté » est volontairement plus marqué que le français courant afin de préserver le génitif grec et sa possible portée cultuelle.
