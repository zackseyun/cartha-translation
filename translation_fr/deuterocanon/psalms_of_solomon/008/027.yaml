  text: God was vindicated in his judgments among the nations of the earth,[a]
translation:
  language: fr
  text: Dieu a été reconnu juste dans ses jugements parmi les nations de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu a été justifié dans ses jugements parmi les nations de la terre. »'
    reason: Alternative lexicale plus littérale pour ἐδικαίωθη.
lexical_decisions:
- source_word: ἐδικαίωθη
  choice: a été reconnu juste
  rationale: Le passif indique ici que Dieu est manifesté ou reconnu comme étant dans son droit. Cette formulation française reste naturelle, évite le sens potentiellement trompeur de « a été justifié » et conserve l’idée d’une reconnaissance publique de sa justice.
- source_word: κρίμασιν
  choice: jugements
  rationale: Le terme désigne des décisions ou des actes judiciaires. « Jugements » préserve sa portée juridique et morale sans préciser indûment s’il s’agit de sentences ou de leur exécution.
- source_word: ἔθνεσι
  choice: nations
  rationale: Dans ce contexte, le mot vise largement les peuples de la terre plutôt que les non-Juifs envisagés en opposition à Israël.
- source_word: τῆς γῆς
  choice: de la terre
  rationale: Avec « nations », l’expression a vraisemblablement une portée universelle. « De la terre » convient donc mieux que « du pays ».
theological_decisions:
- issue: Comment rendre δικαιόω lorsqu’il est appliqué à Dieu
  choice: a été reconnu juste
  alternative: a été justifié
  rationale: Le texte ne signifie pas que Dieu devient juste, mais que ses jugements manifestent qu’il est juste. « Reconnu juste » exprime ce sens tout en laissant en note la formulation plus littérale et traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le grec, tandis que « reconnu juste » rend clairement le passif théologique sans introduire de terminologie confessionnelle technique.
