  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: fr
  text: 'J’ai dit : « Ils dirigent leurs voies dans la justice. » J’ai considéré les jugements de Dieu depuis la création du ciel et de la terre ; j’ai déclaré Dieu juste[a] dans ses jugements d’autrefois[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai donné raison à Dieu » ou « j’ai reconnu Dieu comme juste ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ses jugements de toute éternité ».
    reason: alternative_reading
lexical_decisions:
- source_word: Κατευθύνουσιν ὁδοὺς αὐτῶν
  choice: Ils dirigent leurs voies
  rationale: Le verbe évoque l’action de rendre droit ou de bien orienter un chemin. « Dirigent leurs voies » conserve l’image morale du chemin tout en restant naturel en français.
- source_word: ἐν δικαιοσύνῃ
  choice: selon la justice
  rationale: Dans ce contexte de conduite morale, « justice » exprime une manière d’agir conforme à ce qui est droit. La tournure « selon la justice » est plus idiomatique en français que « dans la justice ».
- source_word: ἀνελογισάμην
  choice: J’ai médité
  rationale: Le moyen aoriste exprime une réflexion attentive. « Médité » rend cette délibération intérieure avec un registre digne et accessible.
- source_word: τὰ κρίματα τοῦ θεοῦ
  choice: les jugements de Dieu
  rationale: « Jugements » peut désigner à la fois les décisions judiciaires de Dieu et leur mise en œuvre, sans réduire le terme à des décrets abstraits.
- source_word: ἐδικαίωσα τὸν θεόν
  choice: j’ai déclaré Dieu juste
  rationale: Cette formulation conserve le lien lexical entre la justice et le fait de reconnaître Dieu comme juste, sans suggérer que le locuteur lui confère sa justice.
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: depuis les temps anciens
  rationale: La locution peut évoquer une haute antiquité ou l’éternité. Le choix principal retient le sens temporel ancien sans imposer une lecture métaphysique.
theological_decisions:
- issue: Sens de ἐδικαίωσα τὸν θεόν
  choice: j’ai déclaré Dieu juste
  alternative: j’ai donné raison à Dieu
  rationale: Le texte affirme que Dieu est reconnu comme juste dans ses jugements. La traduction principale préserve explicitement le motif de la justice et la tension de l’expression grecque.
- issue: Portée de τοῖς ἀπʼ αἰῶνος
  choice: ses jugements depuis les temps anciens
  alternative: ses jugements de toute éternité
  rationale: Le grec permet de comprendre soit des jugements remontant à une époque très ancienne, soit des jugements éternels. Le texte principal évite de trancher en faveur d’une affirmation métaphysique forte, tandis que la note signale cette possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. L’image des voies est conservée, de même que le lien thématique entre justice et reconnaissance de Dieu comme juste. La ponctuation fait de la première affirmation le contenu de « J’ai dit », conformément à la lecture la plus naturelle du grec transmis.
