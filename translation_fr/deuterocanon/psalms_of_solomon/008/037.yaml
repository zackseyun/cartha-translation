  text: And you are our God from the beginning, and on you is our hope, O Lord.
translation:
  language: fr
  text: Et toi, tu es notre Dieu depuis le commencement, et c’est sur toi que repose notre espérance, Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπʼ ἀρχῆς
  choice: depuis le commencement
  rationale: Rend directement l’idée temporelle d’une relation qui remonte à l’origine, tout en conservant la formulation générale du grec.
- source_word: ἐπὶ σὲ ἡ ἐλπὶς ἡμῶν
  choice: c’est sur toi que repose notre espérance
  rationale: Préserve l’image grecque d’une espérance placée ou appuyée sur Dieu, dans un français naturel et solennel.
- source_word: Κύριε
  choice: Seigneur
  rationale: Équivalent français usuel du vocatif grec, sans ajouter un nom divin absent du texte source.
theological_decisions:
- issue: Portée de « depuis le commencement »
  choice: Conserver la formule sans préciser de quel commencement il s’agit
  alternative: Depuis nos origines
  rationale: Le grec demeure indéterminé; expliciter les origines du peuple réduirait une ambiguïté authentique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure emphatique « Et toi, tu es » reproduit le relief du pronom grec exprimé, tandis que « repose » rend idiomatiquement la construction avec ἐπί sans en effacer l’image.
