lexical_decisions:
- source_word: ἐπίστρεψον
  choice: tourne
  rationale: L’impératif exprime l’action d’orienter vers les suppliants ce qui suit. « Tourne vers nous » conserve l’image verbale grecque tout en restant naturel dans une prière.
- source_word: τὸ ἔλεός σου
  choice: ta bonté
  rationale: Ἔλεος désigne ici la faveur miséricordieuse et compatissante de Dieu. « Ta bonté » est naturel avec « tourner vers » et évite de répéter en français le champ lexical de la compassion dans le second membre.
- source_word: ἐφʼ ἡμᾶς
  choice: vers nous
  rationale: Avec l’accusatif, ἐπί marque ici la direction. « Vers nous » rend clairement ce mouvement sans imposer l’image plus littérale de quelque chose venant « sur nous ».
- source_word: οἰκτείρησον ἡμᾶς
  choice: prends-nous en compassion
  rationale: Le verbe exprime une pitié compatissante. Cette tournure digne et intelligible préserve la nuance affective du grec sans la réduire à une simple répétition de « bonté ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne, avec tutoiement de Dieu conforme à l’usage biblique français courant. L’ordre vocatif initial rend la supplication fluide sans modifier le sens du grec.
