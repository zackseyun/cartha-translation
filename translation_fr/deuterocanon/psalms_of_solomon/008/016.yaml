lexical_decisions:
- source_word: ἤγαγεν
  choice: Il a fait venir
  rationale: L’aoriste de ἄγω exprime ici l’arrivée provoquée d’un personnage. « A fait venir » rend naturellement ce mouvement sans préciser davantage son mode.
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: celui qui venait des confins de la terre
  rationale: La tournure désigne le personnage par sa provenance. « Des confins de la terre » restitue l’éloignement extrême exprimé par ἔσχατος dans un français actuel et soutenu.
- source_word: παίοντα
  choice: celui qui frappe
  rationale: Le participe présent de παίω désigne l’action de frapper. Cette formulation directe conserve sa valeur descriptive sans archaïsme.
- source_word: κραταιῶς
  choice: avec puissance
  rationale: L’adverbe indique que l’action s’accomplit avec une grande force. « Avec puissance » convient au registre poétique et laisse ouverte la nuance entre force et violence.
