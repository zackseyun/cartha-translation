  text: They omitted no sin that they did not commit[a], beyond the nations.
translation:
  language: fr
  text: Ils n’ont laissé aucun péché sans le commettre, surpassant les nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils n’ont omis aucun péché qu’ils n’aient commis plus que les nations. »'
    reason: La syntaxe grecque peut rattacher « plus que les nations » plus directement à l’action de commettre les péchés.
lexical_decisions:
- source_word: παρέλειπον
  choice: ont laissé… sans
  rationale: Dans cette tournure négative, le verbe signifie laisser quelque chose sans l’accomplir. « N’ont laissé aucun péché sans le commettre » rend naturellement en français l’idée qu’aucun péché n’est resté non commis.
- source_word: ἁμαρτίαν
  choice: péché
  rationale: « Péché » est le terme français direct et usuel, qui conserve la portée morale et religieuse du grec.
- source_word: ἐποίησαν
  choice: commettre
  rationale: Le verbe signifie littéralement « faire », mais en français on dit normalement « commettre un péché ».
- source_word: ὑπὲρ τὰ ἔθνη
  choice: surpassant les nations
  rationale: Ὑπέρ exprime ici le dépassement ou l’excès. « Surpassant les nations » garde la force comparative, tandis que « nations » évite d’introduire la nuance plus spécialisée de « païens ».
theological_decisions:
- issue: Rapport syntaxique de ὑπὲρ τὰ ἔθνη
  choice: La phrase principale affirme qu’ils ont surpassé les nations dans l’ensemble de leurs péchés.
  alternative: 'Rattacher plus étroitement le complément au verbe « commettre » : ils auraient commis chaque péché plus que les nations.'
  rationale: La position finale du complément grec permet une certaine ambiguïté de rattachement. Le texte principal conserve une formulation globale et concise, et la note signale l’autre lecture possible sans trancher davantage.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure idiomatique « laisser… sans le commettre » évite une double négation française obscure, tout en conservant la totalité exprimée par le grec.
