  yaml_path: translation/deuterocanon/psalms_of_solomon/008/019.yaml
  text: They made rough roads smooth before his entrance; they opened gates toward Jerusalem; they crowned her walls.
translation:
  language: fr
  text: Ils aplanirent les chemins accidentés avant son entrée[a] ; ils ouvrirent des portes en direction de Jérusalem[b] ; ils couronnèrent ses murailles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « depuis son entrée ». La tournure grecque est difficile ; elle semble ici évoquer les préparatifs faits avant son arrivée.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour Jérusalem ». Le rapport exact exprimé par la préposition grecque est incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « ornèrent ses murailles de guirlandes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: aplanirent
  rationale: Le verbe signifie rendre égal ou uni. « Aplanirent » exprime naturellement la préparation concrète d’une voie.
- source_word: ὁδοὺς τραχείας
  choice: les chemins accidentés
  rationale: « Chemins accidentés » restitue l’idée de voies rudes, inégales ou difficiles à parcourir, dans un français courant.
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: avant son entrée
  rationale: Le sens littéral de ἀπό est « depuis/de », mais la tournure est difficile ici. Dans le contexte de l’aplanissement des chemins, elle indique vraisemblablement une préparation précédant son entrée.
- source_word: ἤνοιξαν πύλας
  choice: ils ouvrirent des portes
  rationale: Le grec ne comporte pas d’article. L’indéfini « des portes » maintient cette absence sans imposer qu’il s’agisse explicitement de toutes les portes de la ville.
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: en direction de Jérusalem
  rationale: Avec les portes, ἐπί peut être compris dans un sens directionnel. Cette formulation reste proche du grec tout en étant intelligible en français.
- source_word: ἐστεφάνωσαν
  choice: ils couronnèrent
  rationale: Le verbe signifie littéralement « couronner » et peut aussi évoquer l’ornement de guirlandes. Le choix principal conserve l’image frappante du texte.
- source_word: τείχη αὐτῆς
  choice: ses murailles
  rationale: Le pronom féminin renvoie naturellement à Jérusalem. « Ses murailles » conserve la personnification implicite de la ville.
