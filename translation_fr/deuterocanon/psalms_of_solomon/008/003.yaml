lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: j’ai dit dans mon cœur
  rationale: Le grec signifie littéralement « j’ai dit à mon cœur ». La formulation retenue exprime naturellement en français une parole intérieure tout en conservant l’image du cœur.
- source_word: Ποῦ ἄρα
  choice: Où donc
  rationale: Ποῦ pose la question du lieu, tandis que ἄρα lui donne une nuance déductive ou méditative, bien rendue par « donc ».
- source_word: κρινεῖ
  choice: jugera-t-il
  rationale: Le verbe κρίνω signifie ici « juger ». « Condamnera-t-il » préciserait indûment une issue punitive que le terme grec, à lui seul, n’impose pas.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom grec est masculin singulier à l’accusatif ; le pronom objet « le » en est l’équivalent direct et naturel.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française habituelle de θεός dans ce contexte.
theological_decisions: []
