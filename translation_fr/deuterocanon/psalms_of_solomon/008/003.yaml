  text: And I said in my heart[a], “Where then will God judge him?”
translation:
  language: fr
  text: 'Et j’ai dit dans mon cœur[a] : « Où donc Dieu le jugera-t-il ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
