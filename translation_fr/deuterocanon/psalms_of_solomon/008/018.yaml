  source_fidelity: 'Le texte rend fidèlement la scène d’accueil : ἠπάντησαν est bien exprimé par « allèrent à sa rencontre », οἱ ἄρχοντες τῆς γῆς par « les dirigeants du pays », et μετὰ χαρᾶς par « avec joie ». « Ta venue est la bienvenue » interprète naturellement εὐκτὴ ἡ ὁδός σου dans le cadre narratif, sans lui attribuer indûment le sens de prospérité ou une bénédiction religieuse. Les impératifs grecs sont pluriels ; « Venez, entrez » les conserve, tandis que le singulier antérieur reflète correctement σου.'
