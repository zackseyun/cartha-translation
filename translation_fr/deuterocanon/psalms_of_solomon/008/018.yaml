  yaml_path: translation/deuterocanon/psalms_of_solomon/008/018.yaml
  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: fr
  text: 'Les dirigeants du pays[a] allèrent à sa rencontre avec joie et lui dirent : « Ta venue est la bienvenue[b]. Venez, entrez en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Ici, « du pays » convient mieux au contexte politique local.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ton chemin est souhaité »; on pourrait aussi comprendre : « Ton chemin est le bienvenu. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπάντησαν αὐτῷ
  choice: allèrent à sa rencontre
  rationale: Le verbe exprime ici une rencontre d’accueil, souvent en allant au-devant de quelqu’un. Cette tournure française rend naturellement la scène sans réduire le sens à une simple salutation.
- source_word: οἱ ἄρχοντες τῆς γῆς
  choice: les dirigeants du pays
  rationale: ἄρχοντες désigne les autorités politiques ou les notables qui gouvernent. Dans ce contexte, γῆ renvoie vraisemblablement au territoire concerné plutôt qu’à la terre entière.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Traduction directe et idiomatique de la manière joyeuse dont ils l’accueillent.
- source_word: Εὐκτὴ ἡ ὁδός σου
  choice: Ta venue est la bienvenue
  rationale: Εὐκτή signifie « souhaitée », « désirée » ou « bienvenue ». Avec ὁδός, l’expression vise ici le déplacement ou l’arrivée de l’homme accueilli. La formulation française naturelle « ta venue est la bienvenue » conserve cette idée, plutôt que d’introduire la notion différente de prospérité.
- source_word: δεῦτε εἰσέλθατε
  choice: Venez, entrez
  rationale: Les deux formes grecques sont au pluriel. Le français « vous » préserve cette pluralité possible tout en pouvant constituer une adresse respectueuse à l’individu mentionné au singulier.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: « En paix » est l’expression française naturelle pour une entrée pacifique ou sans hostilité, tout en restant proche du grec.
theological_decisions:
- issue: Valeur de Εὐκτή appliquée à ὁδός
  choice: 'Une arrivée souhaitée et favorable : « Ta venue est la bienvenue »'
  alternative: « Ton chemin est béni » ou « Ton chemin est prospère »
  rationale: Le mot grec exprime d’abord ce qui est désiré ou appelé de ses vœux; il ne formule pas explicitement une bénédiction religieuse et ne signifie pas normalement « prospère ». La traduction évite donc d’ajouter une portée théologique absente du terme.
translation_notes:
  register: Français international moderne, clair et digne. « Dirigeants » garde la portée politique de ἄρχοντες. Le vouvoiement de « Venez, entrez » respecte les impératifs grecs au pluriel sans trancher entre une adresse au personnage avec sa suite et une formule de politesse.
