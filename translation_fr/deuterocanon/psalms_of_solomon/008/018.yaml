  terminology: « Dirigeants » transmet adéquatement la valeur politique et sociale de ἄρχοντες. « Pays » est un choix contextuellement solide pour γῆ, avec l’alternative « terre » correctement signalée. « En paix » est naturel et fidèle à μετʼ εἰρήνης.
