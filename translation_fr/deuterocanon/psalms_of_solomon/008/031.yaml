  yaml_path: translation/deuterocanon/psalms_of_solomon/008/031.yaml
  text: Our eyes have seen your judgments[a], O God; we have justified your honored name forever[b],
translation:
  language: fr
  text: Nos yeux ont vu tes jugements[a], ô Dieu ; nous avons reconnu comme juste ton nom digne d’honneur[b], pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile ici : il dit littéralement « nos yeux ont donné tes jugements ». La traduction suit le sens qui paraît ressortir du contexte : « Nos yeux ont vu tes jugements. »'
    reason: difficult_text
  - marker: b
    text: Ou « ton nom honoré » ; le grec désigne un nom tenu en honneur ou digne d’estime.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοσαν
  choice: ont vu
  rationale: Le texte transmis signifie littéralement « ont donné », mais la construction avec « nos yeux » comme sujet et « tes jugements » comme objet est difficile. Dans le contexte, où Dieu manifeste son jugement, « ont vu » exprime le sens apparent sans masquer la difficulté, signalée en note.
- source_word: τὰ κρίματά σου
  choice: tes jugements
  rationale: κρίματα désigne ici les décisions ou les actes judiciaires de Dieu. « Jugements » est direct, naturel dans le registre biblique français et adapté au contexte immédiat.
- source_word: ἐδικαιώσαμεν
  choice: nous avons reconnu comme juste
  rationale: Le verbe signifie littéralement « nous avons justifié ». Avec le nom de Dieu pour objet, cette formulation exprime que les locuteurs en reconnaissent publiquement la justice, sans suggérer qu’ils rendent Dieu juste.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: ton nom digne d’honneur
  rationale: ἔντιμος qualifie ce qui est estimé, précieux ou tenu en honneur. « Digne d’honneur » conserve cette valeur révérencielle dans un français actuel et soutenu.
- source_word: εἰς αἰῶνας
  choice: pour toujours
  rationale: Cette expression au pluriel marque une durée indéfinie et permanente ; « pour toujours » en est l’équivalent idiomatique naturel.
theological_decisions:
- issue: Sens de ἐδικαιώσαμεν lorsque le nom de Dieu en est l’objet
  choice: nous avons reconnu comme juste
  alternative: nous avons justifié
  rationale: Le grec conserve le langage de la justification, mais le français « justifier le nom de Dieu » pourrait laisser entendre que les humains lui confèrent sa justice. « Reconnu comme juste » présente plutôt leur réponse aux jugements manifestés par Dieu, tout en maintenant l’idée qu’ils déclarent sa justice.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct adressé à Dieu. La ponctuation distingue les deux propositions tout en conservant leur parallélisme.
