  text: The sound of a great multitude was like a very strong wind[c][b][a], like a storm of great fire sweeping through the wilderness.
translation:
  language: fr
  text: Le bruit d’une foule immense était comme celui d’un vent extrêmement violent, comme une tempête d’un feu immense emporté à travers le désert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une tempête de feu immense, ce feu étant emporté à travers le désert ». Le grec rattache grammaticalement « emporté » au feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: bruit
  rationale: Dans cette suite de comparaisons, le mot désigne l’effet sonore collectif de la foule plutôt qu’une parole articulée; « bruit » est naturel en français tout en conservant la valeur auditive du grec.
- source_word: λαοῦ πολλοῦ
  choice: d’une foule immense
  rationale: λαός désigne ici un ensemble humain nombreux; « foule immense » rend clairement l’idée collective et l’ampleur exprimée par πολλοῦ.
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: d’un vent d’une extrême violence
  rationale: Cette formulation idiomatique restitue la forte intensification produite par πολλοῦ et σφόδρα sans les aplatir en un simple « vent fort ».
- source_word: καταιγὶς
  choice: tempête
  rationale: « Tempête » est l’équivalent moderne le plus clair, assez énergique pour l’image sans archaïsme.
- source_word: πυρὸς πολλοῦ
  choice: de feu
  rationale: Le complément grec est littéralement « de beaucoup de feu ». En français, « tempête de feu » exprime naturellement l’ampleur de l’incendie sans ajouter un qualificatif interprétatif.
- source_word: φερομένου διʼ ἐρήμου
  choice: qui déferlait à travers le désert
  rationale: Le participe exprime un feu emporté ou poussé en avant. « Déferlait » transmet ce mouvement puissant, tandis que « à travers le désert » rend directement διʼ ἐρήμου.
