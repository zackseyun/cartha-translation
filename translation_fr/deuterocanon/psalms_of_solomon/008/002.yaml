translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le verbe « était » explicite la copule sous-entendue dans la proposition nominale grecque et respecte le nominatif qui marque ici une nouvelle phrase. La répétition « comme… comme… » conserve la structure imagée de l’original.
