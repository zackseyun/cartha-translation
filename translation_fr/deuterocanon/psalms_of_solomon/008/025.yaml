lexical_decisions:
- source_word: ἐποίησαν
  choice: ont agi
  rationale: Le verbe ποιέω est large (« faire »), mais « agir » convient naturellement avec κατά pour exprimer une conduite conforme à une norme morale.
- source_word: κατὰ
  choice: selon
  rationale: « Selon » conserve ici l’idée d’une conduite qui correspond à leurs souillures, sans expliciter davantage le rapport.
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: leurs souillures
  rationale: Le pluriel « souillures » préserve le nombre du grec ainsi que sa portée morale ou rituelle; « impuretés » demeure une autre traduction possible.
- source_word: καθὼς
  choice: tout comme
  rationale: « Tout comme » rend clairement la comparaison et souligne la continuité entre leur conduite et celle de leurs pères.
- source_word: οἱ πατέρες αὐτῶν
  choice: leurs pères
  rationale: « Pères » est l’équivalent direct et conserve le langage familial et ancestral du grec sans le généraliser en « ancêtres ».
