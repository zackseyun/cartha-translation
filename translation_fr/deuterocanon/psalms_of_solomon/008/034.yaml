lexical_decisions:
- source_word: συνάγαγε
  choice: Rassemble
  rationale: L’impératif aoriste appelle Dieu à réunir ceux qui sont dispersés. « Rassemble » est direct, naturel et conserve la forme de supplication.
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: les dispersés d’Israël
  rationale: Le nom collectif διασπορά signifie littéralement « dispersion », mais désigne ici concrètement les personnes d’Israël qui sont dispersées. Cette formulation française reste concise et intelligible tout en conservant le sens collectif; le rendu littéral est signalé en note.
- source_word: μετὰ ἐλέους
  choice: avec miséricorde
  rationale: μετά avec le génitif exprime ici l’accompagnement ou la manière. « Avec miséricorde » conserve la formulation de la prière et le vocabulaire biblique courant.
- source_word: χρηστότητος
  choice: bonté
  rationale: χρηστότης peut désigner la bonté, la bienveillance ou la générosité dans l’action. « Bonté » est digne, accessible et suffisamment large pour ne pas réduire le champ du terme.
theological_decisions:
- issue: Valeur collective et historique de διασπορά
  choice: les dispersés d’Israël
  alternative: la dispersion d’Israël
  rationale: Le texte grec emploie un nom collectif qui peut évoquer à la fois l’état de dispersion et les personnes dispersées. Le texte principal privilégie le référent humain requis par « rassemble », sans effacer le sens nominal littéral, conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève conserve le caractère impératif de la supplication. « Les dispersés » garde une légère coloration biblique tout en restant immédiatement compréhensible.
