  source_fidelity: Le texte rend fidèlement l’imparfait distributif de ἐμοιχῶντο ἕκαστος (« Chacun commettait »), le complément « la femme de son prochain », puis l’aoriste ponctuel de συνέθεντο (« conclurent »). « Entre eux » explicite de façon plausible la valeur réciproque de αὐτοῖς, tandis que la note conserve la possibilité plus littérale « avec eux ». « Sous serment » rend correctement μετὰ ὅρκου, et « à ce sujet » reprend naturellement περὶ τούτων.
