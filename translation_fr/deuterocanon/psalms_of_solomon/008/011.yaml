  yaml_path: translation/deuterocanon/psalms_of_solomon/008/011.yaml
  text: Each one was committing adultery with his neighbor’s wife[a]; they made covenants with one another under oath about these things.
translation:
  language: fr
  text: Chacun commettait l’adultère avec la femme de son prochain ; ils conclurent entre eux des accords sous serment à ce sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils conclurent avec eux des accords sous serment à ce sujet ». Le datif αὐτοῖς peut se comprendre plus littéralement comme « avec eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοιχῶντο
  choice: commettait l’adultère
  rationale: Le verbe désigne l’adultère, et l’imparfait grec est rendu par l’imparfait français afin de conserver l’idée d’une conduite en cours ou répétée.
- source_word: ἕκαστος
  choice: Chacun
  rationale: Cette formulation conserve la valeur distributive du singulier grec et impute la faute individuellement aux membres du groupe.
- source_word: τὴν γυναῖκα τοῦ πλησίον αὐτοῦ
  choice: avec la femme de son prochain
  rationale: « Son prochain » rend πλησίον dans un registre digne et courant, tandis que la préposition « avec » est naturellement requise en français avec « commettre l’adultère ».
- source_word: συνέθεντο
  choice: conclurent
  rationale: L’aoriste indique ici un acte global d’établissement d’accords ; le passé simple convient au récit et s’emploie naturellement avec « des accords ».
- source_word: συνθήκας
  choice: des accords
  rationale: Le nom peut désigner des conventions, des pactes ou des accords. « Accords » préserve le sens sans introduire une résonance théologique particulière liée au mot « alliance ».
- source_word: αὐτοῖς
  choice: entre eux
  rationale: Le datif est elliptique. « Entre eux » exprime naturellement en français l’interprétation réciproque probable, tout en signalant en note la lecture plus littérale « avec eux ».
- source_word: μετὰ ὅρκου
  choice: sous serment
  rationale: Cette expression française idiomatique restitue la force solennelle de l’engagement juré.
- source_word: περὶ τούτων
  choice: à ce sujet
  rationale: La formule renvoie aux actes qui viennent d’être dénoncés et traduit sobrement le démonstratif grec.
theological_decisions:
- issue: Portée de συνθήκας
  choice: accords
  alternative: alliances
  rationale: Le contexte décrit des arrangements liés à une faute collective, sans imposer le sens théologique fort que « alliances » pourrait suggérer.
translation_notes:
  register: Français international moderne, lisible et digne. L’imparfait du premier verbe conserve l’aspect continu ou répété, tandis que le passé simple du second reflète l’aoriste grec. La note maintient l’ambiguïté du datif αὐτοῖς sans alourdir le texte principal.
