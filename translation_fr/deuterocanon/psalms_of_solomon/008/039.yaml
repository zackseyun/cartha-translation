base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/039.yaml
  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: fr
  text: Que la faveur soit sur nous et sur nos enfants pour toujours[a] ! Seigneur, notre Sauveur, nous ne serons plus jamais ébranlés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La faveur est pour nous et pour nos enfants pour toujours. » Le grec ne comporte pas de verbe exprimé et peut aussi se comprendre comme une affirmation.'
    reason: ambiguity
  - marker: b
    text: 'Littéralement : « nous ne serons plus ébranlés pour la durée éternelle », expression emphatique d''une stabilité qui ne prendra pas fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: faveur
  rationale: Dans cette prière, le nom désigne une disposition bienveillante ou une approbation favorable. « Faveur » est naturel en français et n'ajoute pas un possessif absent du grec.
- source_word: τέκνοις
  choice: enfants
  rationale: Le terme est inclusif et désigne les descendants sans les limiter aux fils.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif s'adresse directement à Dieu ; « Seigneur » conserve le titre et le registre de la prière.
- source_word: σωτὴρ
  choice: Sauveur
  rationale: Le mot désigne celui qui sauve ou délivre. « Notre Sauveur » préserve ici sa force de titre.
- source_word: σαλευθησόμεθα
  choice: nous ne serons […] ébranlés
  rationale: Le futur passif exprime l'idée d'être déstabilisé ou ébranlé ; cette formulation demeure claire et proche du grec.
- source_word: ἔτι τὸν αἰῶνα χρόνον
  choice: plus jamais
  rationale: La combinaison de ἔτι avec l'expression temporelle renforcée nie tout nouvel ébranlement à quelque moment que ce soit. « Plus jamais » rend naturellement cette portée emphatique en français.
theological_decisions:
- issue: Valeur de la proposition nominale ἡμῖν καὶ τοῖς τέκνοις ἡμῶν ἡ εὐδοκία
  choice: 'La rendre comme un souhait : « Que la faveur soit sur nous… »'
  alternative: 'La comprendre comme une affirmation : « La faveur est pour nous et pour nos enfants… »'
  rationale: Le grec sans verbe permet une nuance de souhait ou d'affirmation. Le contexte de prière et l'adresse qui suit favorisent le souhait, tandis qu'une note conserve l'autre lecture.
translation_notes:
  register: Français international actuel, digne et adapté à une prière poétique. La tournure « Que… soit » garde la solennité sans archaïsme ; « plus jamais » évite la répétition maladroite de deux équivalents français de l'éternité tout en conservant l'intensité du grec.
