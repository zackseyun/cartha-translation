  text: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν ἡ εὐδοκία εἰς τὸν αἰῶνα· Κύριε σωτὴρ ἡμῶν, οὐ σαλευθησόμεθα ἔτι τὸν αἰῶνα χρόνον.
