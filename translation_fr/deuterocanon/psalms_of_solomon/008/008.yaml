- from: Dieu a dévoilé leurs péchés à la face du soleil ; toute la terre a reconnu la justice des jugements de Dieu.[a]
  to: Dieu a dévoilé leurs péchés à la face du soleil ; toute la terre a reconnu les justes jugements de Dieu.
  rationale: 'La révision rétablit δίκαια comme adjectif qualifiant directement κρίματα. Aucun renvoi n’est nécessaire : « justes jugements » est une traduction directe, naturelle et suffisamment précise. L’image volontairement marquée « à la face du soleil » est conservée, car elle reflète sans la banaliser l’exposition publique exprimée par ἐναντίον τοῦ ἡλίου.'
