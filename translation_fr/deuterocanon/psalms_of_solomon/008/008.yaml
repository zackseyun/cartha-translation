  source_fidelity: 'Le sens global est fidèle : Dieu rend les péchés publiquement visibles, puis toute la terre reconnaît ses jugements. Toutefois, « la justice des jugements de Dieu » transforme l’adjectif δίκαια, qui qualifie directement κρίματα (« jugements »), en un nom abstrait et atténue la formulation grecque.'
  naturalness: « À la face du soleil » est une expression française littéraire mais compréhensible et bien adaptée au registre poétique et à l’image publique du grec. « Les justes jugements de Dieu » est naturel dans un français biblique moderne.
  terminology: « Péchés », « toute la terre » et « jugements » rendent adéquatement les termes grecs. « Justes » doit qualifier directement « jugements » pour préserver la syntaxe et la force de τὰ κρίματα ... τὰ δίκαια.
