    rationale: Le grec désigne « les jugements justes de Dieu », non principalement « la justice de ses jugements ». La rédaction actuelle reste intelligible, mais elle modifie la relation grammaticale et sémantique entre κρίματα et δίκαια.
  revised_text: Dieu a dévoilé leurs péchés à la face du soleil ; toute la terre a reconnu les justes jugements de Dieu.
