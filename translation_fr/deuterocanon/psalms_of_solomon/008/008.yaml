  yaml_path: translation/deuterocanon/psalms_of_solomon/008/008.yaml
  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: fr
  text: Dieu a dévoilé leurs péchés à la face du soleil ; toute la terre a reconnu les justes jugements de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: a dévoilé
  rationale: Le verbe exprime l’action de découvrir ce qui était caché. « A dévoilé » est naturel en français et conserve l’image d’une mise au jour publique.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: leurs péchés
  rationale: Traduction directe et transparente de l’expression grecque, sans atténuer sa portée morale.
- source_word: ἐναντίον τοῦ ἡλίου
  choice: à la face du soleil
  rationale: Cette formulation préserve l’image grecque inhabituelle d’une exposition publique devant le soleil, plutôt que de la réduire à l’expression idiomatique « au grand jour ».
- source_word: ἔγνω
  choice: a reconnu
  rationale: Dans ce contexte, l’aoriste décrit la prise de conscience qui résulte de la manifestation publique des actes de Dieu. « A reconnu » est plus naturel que « est venue à connaître ».
- source_word: πᾶσα ἡ γῆ
  choice: toute la terre
  rationale: Cette traduction conserve la portée potentiellement universelle du grec ; « tout le pays » la restreindrait sans nécessité contextuelle.
- source_word: τὰ κρίματα τοῦ θεοῦ τὰ δίκαια
  choice: la justice des jugements de Dieu
  rationale: La construction rend intelligiblement l’adjectif neutre pluriel δίκαια qualifiant κρίματα, tout en conservant à la fois le cadre judiciaire et la rectitude morale.
theological_decisions:
- issue: Portée de δίκαια appliqué aux κρίματα de Dieu
  choice: la justice des jugements de Dieu
  alternative: les justes jugements de Dieu
  rationale: La formulation choisie exprime clairement que les jugements divins sont conformes à la justice. L’autre construction demeure également possible et plus formelle.
translation_notes:
  register: Français moderne, digne et accessible. L’image « à la face du soleil » est volontairement conservée malgré son caractère marqué, afin de respecter la formulation grecque et son idée d’exposition publique.
