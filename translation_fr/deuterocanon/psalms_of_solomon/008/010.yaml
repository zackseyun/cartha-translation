  text: A son with a mother and a father with a daughter were commingling[a][b].
translation:
  language: fr
  text: Un fils avec sa mère, et un père avec sa fille, s’unissaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se mêlaient ensemble ». Dans ce contexte, l’expression désigne une union sexuelle illicite entre proches parents.'
    reason: Précision lexicale et explicitation contextuelle de l’euphémisme grec.
lexical_decisions:
- source_word: υἱὸς
  choice: un fils
  rationale: Le singulier sans article présente un cas représentatif; l’article indéfini donne en français une formulation naturelle sans en faire un personnage précis.
- source_word: μετὰ μητρὸς
  choice: avec sa mère
  rationale: μετά suivi du génitif exprime ici l’association. Le possessif français rend explicite le lien familial impliqué par le rapprochement « fils—mère », sans modifier la nature de la relation dénoncée.
- source_word: πατὴρ μετὰ θυγατρὸς
  choice: un père avec sa fille
  rationale: La formulation conserve le parallélisme des deux liens de parenté et emploie le possessif requis par le français naturel dans ce contexte.
- source_word: συνεφύροντο
  choice: s’unissaient
  rationale: L’imparfait grec décrit une action en cours ou répétée. « S’unissaient » garde une certaine retenue eupémistique tout en évoquant, plus naturellement que « se mélangeaient », l’union illicite indiquée par les relations familiales mentionnées.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal le caractère sexuel et incestueux de l’union ?
  choice: Conserver l’euphémisme « s’unissaient » et laisser les liens familiaux manifester la faute.
  alternative: « avaient des rapports sexuels » ou « couchaient ensemble »
  rationale: Le contexte rend l’inceste manifeste, mais le verbe grec emploie l’image du mélange plutôt qu’un terme sexuel explicite. Une formulation directe irait au-delà de son degré d’explicitation.
translation_notes:
  register: Français moderne, sobre et digne. La phrase garde le parallélisme abrupt de l’original tout en évitant « se mélangeaient », peu naturel pour des personnes en français actuel. L’imparfait rend l’aspect imperfectif de συνεφύροντο.
