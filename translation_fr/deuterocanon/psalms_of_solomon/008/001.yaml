    issue: « faisant retentir le massacre et la destruction »
    rationale: 'Cette construction est maladroite en français : on fait retentir un son, un cri ou une proclamation, non un massacre ou une destruction. Elle obscurcit la relation transitive entre le son de la trompette et les calamités. « annonçant » rend clairement le signal sonore impliqué par ἠχούσης avec ses accusatifs.'
