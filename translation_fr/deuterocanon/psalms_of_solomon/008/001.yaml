  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
translation:
  language: fr
  text: Mon oreille a entendu la détresse[a] et le bruit de la guerre, le son d’une trompette annonçant le massacre et la destruction ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’affliction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Θλίψιν
  choice: la détresse
  rationale: Le nom désigne une situation de forte pression, de souffrance ou d’épreuve. « Détresse » convient au choc immédiat de la scène sans lui imposer une connotation théologique ultérieure.
- source_word: φωνὴν πολέμου
  choice: le bruit de la guerre
  rationale: φωνή désigne ici un phénomène audible. « Bruit » est naturel avec « guerre » et évite une répétition maladroite de « son » dans la proposition suivante.
- source_word: τὸ οὖς μου
  choice: Mon oreille
  rationale: La formulation concrète et singulière du grec est conservée afin de maintenir la vive image corporelle de l’audition.
- source_word: φωνὴν σάλπιγγος
  choice: le son d’une trompette
  rationale: « Son » rend naturellement φωνή dans ce contexte, tandis que « trompette » reste le terme français standard et suffisamment général pour l’instrument militaire.
- source_word: ἠχούσης
  choice: faisant retentir
  rationale: Le participe, suivi des accusatifs σφαγὴν et ὄλεθρον, présente la trompette comme donnant une expression sonore au massacre et à la destruction. Cette tournure préserve cette force transitive sans réduire le verbe à « annoncer ».
- source_word: σφαγὴν
  choice: le massacre
  rationale: Le mot évoque une mise à mort violente et collective; « massacre » en conserve la gravité.
- source_word: ὄλεθρον
  choice: la destruction
  rationale: Équivalent direct et ample, « destruction » forme avec « massacre » le couple final de calamités.
