  text: And we will not turn away from you[b][a], because your judgments toward us are good.
translation:
  language: fr
  text: Et nous ne nous tiendrons pas éloignés de toi[a], car tes jugements à notre égard sont bons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous ne nous éloignerons pas de toi » ou « nous ne nous détournerons pas de toi ».
