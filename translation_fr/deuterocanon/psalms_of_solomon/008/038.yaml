  - marker: b
    text: Ou « sont bienveillants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  choice: nous ne nous éloignerons pas
  rationale: Le futur moyen de ἀπέχω/ἀφέχομαι, construit ici avec un complément personnel, exprime le fait de se tenir ou de rester éloigné de quelqu’un. « Nous ne nous éloignerons pas de toi » rend naturellement la dimension relationnelle sans ajouter l’idée plus précise d’un rejet.
- source_word: χρηστὰ
  choice: bons
  rationale: χρηστός peut signifier « bon », « bienveillant » ou « favorable ». « Bons » conserve ici l’étendue du terme et laisse ouverte sa nuance de bonté bienveillante.
- source_word: κρίματά
  choice: jugements
  rationale: κρίματα désigne des jugements, décisions judiciaires ou actes de jugement. « Jugements » maintient le registre théologique et juridique sans restreindre indûment le sens.
- source_word: εἰς ἡμᾶς
  choice: envers nous
  rationale: εἰς marque ici la direction ou la relation. « Envers nous » indique que les jugements de Dieu concernent les locuteurs, sans imposer une lecture exclusivement punitive ou favorable.
