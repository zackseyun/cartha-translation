lexical_decisions:
- source_word: φωνὴν
  choice: un bruit
  rationale: Dans le contexte immédiat, φωνή reprend le motif sonore des versets précédents — bruit de guerre, trompette et multitude. « Bruit » préserve cette continuité rhétorique sans personnifier indûment le son.
- source_word: ἤκουσα
  choice: J’ai entendu
  rationale: L’aoriste ἤκουσα exprime simplement la perception auditive d’un événement ponctuel; le passé composé est naturel en français moderne.
- source_word: εἰς Ἰερουσαλήμ
  choice: dans Jérusalem
  rationale: Bien que εἰς puisse marquer un mouvement vers ou dans un lieu, son emploi locatif est attesté en grec tardif; ici, « dans Jérusalem » donne le sens contextuel le plus naturel.
- source_word: πόλιν ἁγιάσματος
  choice: ville sainte
  rationale: La formulation française idiomatique « ville sainte » rend le sens de la construction littérale « ville de sainteté », laquelle est conservée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et dignifié. « Bruit » a été retenu plutôt que « voix » pour maintenir la répétition contextuelle de φωνή; l’absence d’article devant πόλιν ἁγιάσματος est rendue naturellement par une apposition sans article.
