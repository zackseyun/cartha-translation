  text: For God led him safely through their wandering[a][b].
translation:
  language: fr
  text: Car Dieu l’a conduit en sécurité dans leur égarement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur erreur » ou « dans leur illusion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: a conduit
  rationale: L’aoriste de ἄγω exprime naturellement l’action de mener ou de conduire; « a conduit » conserve l’image de Dieu dirigeant le parcours de cet homme.
- source_word: μετὰ ἀσφαλείας
  choice: en sécurité
  rationale: Cette locution adverbiale indique qu’il a été conduit sans danger; « en sécurité » est idiomatique et reste proche de la formulation grecque.
- source_word: πλανήσει
  choice: égarement
  rationale: Le terme peut désigner l’erreur, l’illusion ou le fait de s’égarer. « Égarement » préserve à la fois la dimension cognitive ou morale et l’image du dévoiement, sans imposer l’idée d’un déplacement physique.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom grec est masculin singulier; l’élision française rend naturellement « lui » comme complément direct, le référent masculin étant fourni par le contexte.
- source_word: αὐτῶν
  choice: leur
  rationale: Le génitif pluriel marque ici l’égarement du groupe et se rend naturellement par le possessif pluriel « leur ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Au milieu de » rend ἐν sans suggérer trop précisément que l’égarement était un trajet physique traversé, tandis que la note maintient l’ambiguïté sémantique de πλάνησις.
