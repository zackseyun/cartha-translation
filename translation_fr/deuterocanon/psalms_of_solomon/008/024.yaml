  text: He led away their sons and their daughters[a], whom they had begotten in defilement.
translation:
  language: fr
  text: Il emmena leurs fils et leurs filles, qu’ils avaient engendrés dans la souillure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la profanation ». Le nom grec peut désigner une profanation ou une souillure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγεν
  choice: emmena
  rationale: L’aoriste de ἀπάγω exprime ici le fait d’emmener ou de déporter. « Emmena » conserve le mouvement imposé sans préciser davantage les modalités.
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας αὐτῶν
  choice: leurs fils et leurs filles
  rationale: Le grec nomme explicitement les fils et les filles; la formulation française préserve cette paire et rattache naturellement le possessif aux deux groupes.
- source_word: ἃ
  choice: qu’
  rationale: Le relatif grec neutre pluriel reprend collectivement les fils et les filles. En français, « que » est la reprise personnelle naturelle et non marquée.
- source_word: ἐγέννησαν
  choice: ils avaient engendrés
  rationale: γεννάω peut désigner le fait d’engendrer ou de mettre au monde. « Engendrer » garde ici la portée généalogique et n’attribue pas l’action aux seules mères; le plus-que-parfait marque l’antériorité par rapport au fait de les emmener.
- source_word: ἐν βεβηλώσει
  choice: dans la profanation
  rationale: βεβήλωσις désigne la profanation, avec une idée de violation du sacré et, selon le contexte, de souillure. « Dans la profanation » conserve directement cette portée religieuse et morale.
theological_decisions:
- issue: Portée morale et religieuse de ἐν βεβηλώσει
  choice: dans la profanation
  alternative: dans la souillure
  rationale: Le texte porte un jugement sur les circonstances de ces naissances sans en préciser la nature. « Profanation » maintient la dimension de violation du sacré, tandis que la note signale l’autre nuance possible sans résoudre l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. « Emmena » et « engendrés » conservent le relief concret et généalogique du grec; la note maintient l’étendue sémantique de βεβήλωσις.
