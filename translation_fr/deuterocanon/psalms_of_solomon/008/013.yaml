base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/013.yaml
  text: They trampled the altar of the Lord with every uncleanness[a], and with menstrual blood they defiled the sacrifices like profane meat[c][b];
translation:
  language: fr
  text: Ils foulèrent l’autel du Seigneur avec toutes sortes d’impuretés[a] et, avec du sang menstruel[b], ils souillèrent les sacrifices comme de la viande profane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme grecque initiale est difficile dans le témoin principal. Une leçon étroitement attestée donne le sens : « Ils foulèrent l’autel du Seigneur. »'
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « avec une impureté menstruelle de sang » ; on pourrait aussi traduire : « avec un écoulement menstruel de sang ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίπουσαν
  choice: Ils foulèrent
  rationale: La forme grecque transmise est difficile, mais une tradition textuelle étroitement apparentée et le contexte de profanation violente soutiennent le sens de « fouler ». L’incertitude est signalée en note.
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: l’autel du Seigneur
  rationale: Équivalent français courant et précis du vocabulaire cultuel grec.
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: avec toutes sortes d’impuretés
  rationale: Cette formulation naturelle conserve la portée rituelle de ἀκαθαρσία et rend la valeur distributive de πάσης sans suggérer une abstraction unique.
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: avec du sang menstruel
  rationale: Dans l’usage biblique grec, ἄφεδρος désigne spécifiquement l’impureté ou l’écoulement menstruel. La traduction explicite la catégorie cultuelle précise plutôt que de la réduire à de simples pertes de sang.
- source_word: ἐμίανιν
  choice: ils souillèrent
  rationale: « Souiller » convient au contexte de contamination rituelle des sacrifices et reste clair en français moderne.
- source_word: τὰς θυσίας
  choice: les sacrifices
  rationale: Traduction directe et naturelle du terme cultuel.
- source_word: ὡς κρέα βέβηλα
  choice: comme de la viande profane
  rationale: « Profane » préserve l’opposition entre ce qui est consacré et ce qui est commun ou non sacré, portée par βέβηλα.
theological_decisions: []
