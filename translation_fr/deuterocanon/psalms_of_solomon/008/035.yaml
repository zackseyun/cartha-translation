    rationale: παιδευτής désigne « celui qui discipline/forme ». La formulation proposée décrit seulement une action de correction et peut évoquer une simple réprimande. « Tu es celui qui nous discipline » maintient la fonction exprimée par le grec et l’emphase sur « toi ».
  revised_text: Car ta fidélité est avec nous[a], mais nous avons raidi notre nuque[b], et toi, tu es celui qui nous discipline.
