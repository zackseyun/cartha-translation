  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : πίστις σου est raisonnablement compris comme la fidélité de Dieu, μεθ’ ἡμῶν comme « avec nous », et l’image de la nuque raidie est conservée. La valeur adversative de « mais » est défendable dans ce contexte de contraste, malgré le καί grec. En revanche, « c’est toi qui nous corriges » transforme le prédicat nominal παιδευτὴς ἡμῶν en une simple action et atténue la notion durable de discipline/formation portée par παιδευτής.'
