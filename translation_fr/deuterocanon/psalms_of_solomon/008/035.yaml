  terminology: « Fidélité » convient mieux que « foi » pour πίστις appliqué à Dieu dans ce contexte; l’alternative littérale est utilement signalée. « Celui qui nous discipline » rend παιδευτής sans le réduire au seul enseignement ni à une correction ponctuelle.
