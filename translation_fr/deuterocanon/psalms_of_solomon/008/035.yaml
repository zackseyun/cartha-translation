base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/035.yaml
  text: For your faithfulness is with us[a], and we have stiffened our neck[c][b], and you are our disciplinarian.
translation:
  language: fr
  text: Car ta fidélité est avec nous[a], mais nous avons raidi notre nuque[b], et toi, tu es celui qui nous discipline.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta foi est avec nous ».'
    reason: lexical_alternative
  - marker: b
    text: « Raidir sa nuque » est une image biblique qui signifie s’obstiner.
    reason: cultural_note
lexical_decisions:
- source_word: πίστις σου
  choice: ta fidélité
  rationale: Avec Dieu comme destinataire, le syntagme désigne le plus naturellement sa constance fidèle; «ta foi», plus formel, reste possible et est signalé en note.
- source_word: μεθʼ ἡμῶν
  choice: est avec nous
  rationale: Rend directement la présence relationnelle exprimée par la préposition, sans explicitation supplémentaire.
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: nous avons raidi notre nuque
  rationale: Conserve l’image biblique et le singulier collectif du grec; l’expression désigne l’obstination.
- source_word: παιδευτὴς ἡμῶν
  choice: c’est toi qui nous corriges
  rationale: Exprime naturellement en français la fonction de celui qui éduque par la discipline et la correction, sans la réduire au seul enseignement ni lui donner une dureté excessive.
theological_decisions:
- issue: Sens de πίστις σου appliqué à Dieu
  choice: ta fidélité
  alternative: ta foi
  rationale: Le contexte oppose vraisemblablement la fidélité constante de Dieu à l’obstination du peuple. La possibilité lexicale plus littérale «ta foi» est néanmoins conservée en note.
- issue: Valeur du premier καὶ devant ἡμεῖς
  choice: mais
  alternative: et
  rationale: Le pronom emphatique et le contraste entre la fidélité divine et l’obstination humaine permettent une valeur adversative, même si καί peut formellement se rendre par «et».
translation_notes:
  register: Français moderne, digne et accessible. L’image de la nuque est conservée pour maintenir la couleur biblique; la tournure clivée «c’est toi qui» rend l’emphase de καὶ σύ et évite le substantif peu naturel «disciplinaire».
