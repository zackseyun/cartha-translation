  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: fr
  text: C’est pourquoi Dieu leur a mêlé un esprit d’égarement[a] ; il leur a fait boire une coupe de vin non dilué jusqu’à l’ivresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec imprimé fourni porte ici εὕρε, une leçon difficile, probablement fautive. La formulation reprend Ésaïe 19.14 dans la Septante, où l’on lit πνεῦμα πλανήσεως, « un esprit d’égarement ».
    reason: Signaler honnêtement le problème textuel tout en justifiant la leçon traduite à partir de l’allusion scripturaire identifiable.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette locution exprime naturellement en français la conséquence judiciaire tirée des accusations précédentes.
- source_word: ἐκέρασεν αὐτοῖς
  choice: leur a mêlé
  rationale: Le verbe désigne l’action de mélanger ou de préparer une boisson. Cette formulation conserve l’image concrète, reprise dans la seconde proposition.
- source_word: πνεῦμα πλανήσεως (le texte fourni porte εὕρε πλανήσεως)
  choice: un esprit d’égarement
  rationale: La leçon πνεῦμα correspond à la citation de la Septante en Ésaïe 19.14 et donne une construction intelligible. « Égarement » préserve la portée morale et spirituelle de πλάνη sans préciser excessivement s’il s’agit d’erreur, de vertige ou d’illusion.
- source_word: ἐπότισεν αὐτοὺς
  choice: il leur a fait boire
  rationale: Cette tournure française rend la valeur causative du verbe et la contrainte propre à l’image du jugement.
- source_word: ποτήριον οἴνου ἀκράτου
  choice: une coupe de vin non coupé
  rationale: Dans l’Antiquité, ἄκρατος désigne le vin qui n’a pas été mélangé à de l’eau. « Non coupé » est précis et conserve le contraste implicite avec le verbe « mêler ».
- source_word: εἰς μέθην
  choice: jusqu’à l’ivresse
  rationale: La formulation exprime clairement l’aboutissement ou le résultat indiqué par εἰς, dans un français naturel.
theological_decisions:
- issue: L’action divine dans ce jugement
  choice: 'Maintenir explicitement Dieu comme sujet des deux actions : il mêle et fait boire.'
  alternative: Atténuer la causalité en disant que Dieu les laisse s’égarer ou s’enivrer.
  rationale: Le grec attribue directement les deux verbes à Dieu. L’atténuer résoudrait une tension théologique que le texte lui-même conserve.
translation_notes:
  register: Français international moderne, sobre et poétique. « C’est pourquoi » rend l’enchaînement logique ; « vin non coupé » conserve avec précision l’image antique sans employer un vocabulaire technique. La ponctuation maintient le parallélisme des deux actes de jugement.
