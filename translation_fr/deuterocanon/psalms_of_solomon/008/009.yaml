  text: Their lawless deeds were in secret chambers[a], in provocation.
translation:
  language: fr
  text: Leurs actes contraires à la loi se commettaient dans des lieux secrets, dans un esprit de provocation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en suscitant la colère ».'
    reason: Cette variante explicite la nuance causative possible de παροργισμός tout en signalant qu’elle n’est pas formulée par un verbe dans le grec.
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: dans des lieux secrets
  rationale: καταγωγή peut désigner un lieu où l’on se retire ou séjourne. Avec κρυφίοις, l’expression souligne surtout le caractère caché de ces lieux; « lieux secrets » préserve ce sens sans imposer une architecture précise.
- source_word: αἱ παρανομίαι αὐτῶν
  choice: leurs actes contraires à la Loi
  rationale: παρανομίαι désigne des violations de la loi ou des actes commis contre ce qui est juste. Cette formulation garde la dimension concrète et juridico-morale du terme.
- source_word: ἐν παροργισμῷ
  choice: dans un esprit de provocation
  rationale: παροργισμός peut exprimer la provocation, notamment celle qui suscite la colère. La formulation française conserve cette portée sans ajouter un objet que le grec ne nomme pas.
- source_word: '[copule implicite]'
  choice: se commettaient
  rationale: La proposition grecque est sans verbe exprimé. « Se commettaient » donne une phrase française naturelle et rattache clairement les actes aux lieux secrets, sans préciser davantage les circonstances.
theological_decisions:
- issue: Objet implicite de la provocation
  choice: Ne pas préciser qui est provoqué
  alternative: « provoquant Dieu à la colère » ou « suscitant sa colère »
  rationale: Le contexte peut suggérer une provocation de Dieu, mais le verset grec ne nomme aucun objet. Le texte principal conserve donc cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « dans » reflète la structure grecque, tandis que « dans un esprit de provocation » évite le calque peu naturel « dans la provocation ».
