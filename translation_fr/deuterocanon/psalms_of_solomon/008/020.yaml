- from: Il entra en paix, comme un père dans la maison de ses fils[a] ; il y posa les pieds avec une grande assurance[b].
  to: Il entra comme un père dans la maison de ses fils[a], en paix ; il posa les pieds en parfaite sécurité[b].
  rationale: La révision rétablit l’ordre rhétorique du grec, rend ἀσφάλεια par le terme français non psychologique « sécurité » et remplace la première note par une alternative idiomatique qui conserve explicitement « fils ». L’image des pieds est maintenue, sans paraphrase interprétative.
