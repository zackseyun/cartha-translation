  yaml_path: translation/deuterocanon/psalms_of_solomon/008/020.yaml
  text: He entered like a father into the house of his sons in peace[b][a]; he set his feet with great security.
translation:
  language: fr
  text: Il entra comme un père dans la maison de ses fils[a], en paix ; il posa les pieds en parfaite sécurité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez ses fils ». Le grec dit littéralement « dans la maison de ses fils »; le français peut exprimer cette relation de manière plus idiomatique.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec une grande assurance ». Le grec peut exprimer la sûreté, l’absence de danger ou la stabilité d’une position établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Il entra
  rationale: L’aoriste exprime ici simplement l’entrée dans la maison ; le passé simple convient au registre narratif et soutenu.
- source_word: ὡς πατὴρ
  choice: comme un père
  rationale: ὡς introduit une comparaison ; cette formulation préserve la valeur de similitude sans transformer celle-ci en identité.
- source_word: οἶκον υἱῶν αὐτοῦ
  choice: la maison de ses fils
  rationale: Le rendu conserve l’image concrète de la maison et la relation génitive explicite du grec.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Expression française idiomatique qui conserve le sens circonstanciel de la locution grecque.
- source_word: ἔστησεν τοὺς πόδας αὐτοῦ
  choice: il y posa les pieds
  rationale: Cette tournure maintient l’image corporelle du grec tout en étant naturelle en français ; « y » rattache clairement l’action à la maison où il vient d’entrer.
- source_word: μετὰ ἀσφαλείας πολλῆς
  choice: avec une grande assurance
  rationale: ἀσφάλεια évoque ici la sûreté, la stabilité et l’absence de danger ; « assurance » convient à la manière ferme et incontestée dont il prend position, sans imposer une interprétation psychologique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple correspond au ton narratif. L’ordre « en paix, comme un père » évite l’enchaînement moins naturel « comme un père dans… en paix » tout en laissant « en paix » porter sur l’entrée. L’image des pieds est conservée plutôt que remplacée par une paraphrase telle que « il s’établit ».
