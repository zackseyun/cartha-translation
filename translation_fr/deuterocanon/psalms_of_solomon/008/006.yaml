  text: My heart was afraid[c][b][a]; my bones were shaken like flax.
translation:
  language: fr
  text: Mon cœur a pris peur ; mes os ont été ébranlés comme du lin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une toile de lin ». L’image est difficile ; le grec dit littéralement « comme du lin » et peut évoquer soit la matière brute, soit une matière textile en lin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθη
  choice: a pris peur
  rationale: L’aoriste exprime ici naturellement l’entrée dans la crainte. « A pris peur » est idiomatique en français moderne tout en restant proche du grec.
- source_word: ἡ καρδία μου
  choice: mon cœur
  rationale: Cette traduction directe conserve l’image anthropologique concrète du texte sans l’expliciter en « être intérieur ».
- source_word: ἐταράχθη
  choice: ont été ébranlés
  rationale: Le verbe évoque une agitation ou un bouleversement. Avec « mes os » comme sujet, « ont été ébranlés » garde la dimension physique de l’image sans imposer l’idée plus précise de tremblement.
- source_word: τὰ ὀστᾶ μου
  choice: mes os
  rationale: Le nom désigne littéralement les os ; le choix conserve la vigueur corporelle de la plainte.
- source_word: ὡς
  choice: comme
  rationale: « Comme » introduit naturellement la comparaison en français.
- source_word: λίνον
  choice: lin
  rationale: Le mot peut désigner le lin ou une matière textile qui en est issue. « Lin » préserve l’image la moins interprétative et l’ambiguïté du grec.
