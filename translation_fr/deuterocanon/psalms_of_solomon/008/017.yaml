lexical_decisions:
- source_word: ἔκρινεν
  choice: décréta
  rationale: Dans ce contexte, l’aoriste de κρίνω exprime vraisemblablement une décision faisant autorité. « Décréta » restitue cette force judiciaire et décisionnelle, tandis que « jugea la guerre » serait trompeur ou peu naturel en français.
- source_word: τὸν πόλεμον
  choice: la guerre
  rationale: πόλεμος désigne normalement la guerre ou un conflit armé, plutôt qu’une seule bataille.
- source_word: ἐπὶ
  choice: contre
  rationale: Avec la guerre et les lieux visés, ἐπί marque ici naturellement une orientation hostile.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
- source_word: γῆν
  choice: pays
  rationale: γῆ peut désigner la terre, le pays ou le territoire. « Pays » est naturel en français et conserve une portée assez large pour les terres rattachées à Jérusalem.
- source_word: αὐτῆς
  choice: son
  rationale: Le possessif renvoie à Jérusalem. En français, « son pays » est la formulation idiomatique correspondante, sans pouvoir marquer explicitement la personnification féminine du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation « décréta la guerre » conserve la force d’une décision souveraine sans employer l’expression française trompeuse « jugea la guerre ». Les deux appels de note signalent l’étendue sémantique de γῆ et l’ambiguïté de κρίνω.
