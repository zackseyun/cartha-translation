translation:
  language: fr
  text: Il s’empara de ses tours fortifiées et de la muraille de Jérusalem[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec rare traduit par « tours fortifiées » peut aussi désigner des bastions, des citadelles ou des ouvrages avancés.
