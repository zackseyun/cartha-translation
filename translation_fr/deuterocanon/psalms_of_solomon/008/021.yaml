lexical_decisions:
- source_word: κατελάβετο
  choice: s’empara de
  rationale: Dans ce contexte militaire, le verbe exprime la prise de possession. « S’empara de » conserve la force du grec sans imposer l’idée précise d’un assaut, puisque le contexte précédent évoque une entrée rendue possible par l’ouverture des portes.
- source_word: τὰς πυργοβάρεις
  choice: tours fortifiées
  rationale: Ce terme grec rare désigne vraisemblablement des ouvrages défensifs, peut-être des bastions, des citadelles ou des tours fortifiées. « Tours fortifiées » rend clairement la formation du mot et convient à son association avec la muraille.
- source_word: αὐτῆς
  choice: ses
  rationale: Le pronom féminin renvoie naturellement à Jérusalem, ville personnifiée dans le style poétique. Le possessif français conserve ce lien sans lourdeur.
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: la muraille de Jérusalem
  rationale: « Muraille » convient mieux que « mur » à l’enceinte défensive d’une ville et préserve le singulier collectif ainsi que le nom explicite de Jérusalem.
