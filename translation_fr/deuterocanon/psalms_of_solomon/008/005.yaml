  text: À cette nouvelle, mes reins furent écrasés[a] ; mes genoux fléchirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mes reins furent brisés » ; littéralement, « à cause de ce qui fut entendu » ou « de la nouvelle entendue ».'
