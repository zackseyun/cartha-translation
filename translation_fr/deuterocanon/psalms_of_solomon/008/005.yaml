lexical_decisions:
- source_word: συντριβὴ
  choice: furent brisés
  rationale: Le nom exprime le brisement ou l’écrasement. Une tournure verbale au passé restitue naturellement en français la force prédicative de la proposition nominale et s’accorde avec la séquence narrative du contexte.
- source_word: ὀσφύς
  choice: reins
  rationale: Dans cette image corporelle de détresse, « reins » est l’équivalent français traditionnel et digne pour la région des lombes, sans réduire le terme aux seules hanches.
- source_word: ἀπὸ ἀκοῆς
  choice: À cette nouvelle
  rationale: La préposition ἀπό marque ici vraisemblablement la cause, et ἀκοή ce qui a été entendu. « À cette nouvelle » exprime ce lien causal dans un français naturel tout en laissant en note les rendus plus littéraux.
- source_word: παρελύθη
  choice: fléchirent
  rationale: Avec « genoux » pour sujet, « fléchirent » rend idiomatiquement la perte de force ou de soutien exprimée par le passif aoriste, sans imposer le sens médical plus étroit de paralysie.
- source_word: γόνατά
  choice: genoux
  rationale: Équivalent lexical direct.
