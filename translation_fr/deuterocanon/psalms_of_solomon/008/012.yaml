base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/012.yaml
  text: The holy things of God were being plundered[b][a], as though there were no heir to redeem them.
translation:
  language: fr
  text: Les choses saintes de Dieu étaient pillées[b], comme s’il n’y avait aucun héritier pour les racheter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme s’il n’y avait aucun héritier qui les rachète » ; cette formulation rend plus directement le participe grec.
    reason: alternative_reading
  - marker: b
    text: « Les choses saintes » peut aussi se comprendre plus précisément comme « les biens sacrés » ou, moins probablement ici, « le sanctuaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Le neutre pluriel désigne le plus naturellement les biens ou objets saints appartenant à Dieu, tout en conservant l’ampleur de l’expression grecque sans imposer le sens spatial de « sanctuaire ».
- source_word: διηρπάζοντο
  choice: étaient mises au pillage
  rationale: L’imparfait exprime une spoliation violente en cours. Cette tournure française rend à la fois la durée et le caractère sacrilège du pillage.
- source_word: ὡς μὴ ὄντος
  choice: comme s’il n’y avait aucun
  rationale: Cette formulation naturelle conserve la valeur comparative et irréelle de l’expression grecque.
- source_word: κληρονόμου
  choice: héritier
  rationale: Le sens ordinaire du nom est « héritier »; il convient de ne pas le développer en « protecteur » ou « rédempteur », puisque cette fonction est exprimée par le participe suivant.
- source_word: λυτρουμένου
  choice: pour les racheter
  rationale: Le verbe évoque la délivrance et la récupération de ce qui appartient à quelqu’un. « Racheter » préserve cette portée, tandis que l’infinitif introduit par « pour » produit un français lisible.
theological_decisions:
- issue: Rapport entre « héritier » et l’action de racheter
  choice: comme s’il n’y avait aucun héritier pour les racheter
  alternative: comme s’il n’y avait aucun héritier qui les rachète
  rationale: La traduction principale exprime naturellement la fonction attendue de l’héritier sans identifier davantage celui-ci. La note conserve une représentation plus directe du participe grec et l’ambiguïté de son rapport à l’héritier.
translation_notes:
  register: Français international moderne, digne et accessible. « Mises au pillage » conserve la force de la spoliation continue; « choses saintes » maintient volontairement l’étendue sémantique du pluriel grec.
