revisions:
- from: Le Seigneur est digne de louange dans ses jugements, sur les lèvres des fidèles[a], et Israël est béni par le Seigneur pour toujours.
  to: Le Seigneur est loué pour ses jugements par les fidèles[a], et Israël est béni par le Seigneur pour toujours.
  rationale: La révision remplace une construction française peu idiomatique par une formulation qui rattache explicitement la louange à ceux qui la prononcent et les jugements au motif de cette louange. Elle conserve le caractère déclaratif des deux adjectifs prédicatifs grecs, le parallélisme de la phrase et l’ambiguïté non confessionnelle de ὅσιοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:19Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation actuelle rend correctement les termes principaux, mais « est digne de louange ... sur les lèvres des fidèles » associe de façon peu naturelle le complément « sur les lèvres » à une qualité (« digne ») plutôt qu’à l’acte de louer. Le grec présente une acclamation selon laquelle le Seigneur est loué en raison de ses jugements, par l’expression des ὅσιοι. « Pour ses jugements » et « par les fidèles » rendent ce rapport idiomatiquement sans introduire d’interprétation doctrinale.
  naturalness: « Le Seigneur est digne de louange dans ses jugements, sur les lèvres des fidèles » est grammaticalement possible mais lourd et sémantiquement ambigu en français moderne. « Le Seigneur est loué pour ses jugements par les fidèles » est clair, fluide et conserve le parallélisme avec la seconde proposition.
  terminology: « Seigneur », « jugements », « fidèles », « Israël », « béni » et « pour toujours » conviennent. « Fidèles » est un rendu sobre et approprié de ὅσιοι, préférable à « saints », qui risquerait de confondre ce terme avec ἅγιοι. « Béni par le Seigneur » conserve l’agent exprimé par ὑπό.
  issues:
  - severity: medium
    issue: Lien syntaxique peu naturel entre « digne de louange » et « sur les lèvres des fidèles ».
    rationale: En français, « sur les lèvres » décrit naturellement une parole ou une louange effectivement prononcée, non le fait d’être digne de louange. Une reformulation verbale rend mieux la fonction de ἐν στόματι tout en respectant l’acclamation grecque.
  - severity: low
    issue: « Dans ses jugements » est trop littéral et laisse obscur le rapport de causalité ou de motif.
    rationale: Dans ce contexte laudatif, « pour ses jugements » rend naturellement le rapport entre la louange et les jugements divins, sans réduire κρίματα à des décrets ou à des actes judiciaires particuliers.
  revised_text: Le Seigneur est loué pour ses jugements par les fidèles[a], et Israël est béni par le Seigneur pour toujours.
  revised_footnotes:
  - marker: a
    text: Ou « les hommes pieux ». Littéralement, « dans la bouche des fidèles » (ou « des pieux »).
    reason: Le grec ὁσίων désigne des personnes pieuses ou fidèles à Dieu; ἐν στόματι emploie littéralement l’image de la bouche pour l’expression de leur louange.
  revision_rationale: La révision remplace une construction française peu idiomatique par une formulation qui rattache explicitement la louange à ceux qui la prononcent et les jugements au motif de cette louange. Elle conserve le caractère déclaratif des deux adjectifs prédicatifs grecs, le parallélisme de la phrase et l’ambiguïté non confessionnelle de ὅσιοι.
