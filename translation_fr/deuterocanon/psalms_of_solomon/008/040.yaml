  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: fr
  text: Le Seigneur est loué pour ses jugements par les fidèles[a], et Israël est béni par le Seigneur pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes pieux ». Littéralement, « dans la bouche des fidèles » (ou « des pieux »).
    reason: Le grec ὁσίων désigne des personnes pieuses ou fidèles à Dieu; ἐν στόματι emploie littéralement l’image de la bouche pour l’expression de leur louange.
lexical_decisions:
- source_word: αἰνετὸς
  choice: est digne de louange
  rationale: L’adjectif prédicatif exprime que le Seigneur mérite la louange. Cette formulation française garde la valeur déclarative sans lui donner artificiellement une nuance optative.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rendu français courant du titre divin κύριος.
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: dans ses jugements
  rationale: Conserve la préposition ἐν et l’étendue sémantique de κρίματα, qui peut désigner les jugements ou les actes judiciaires de Dieu.
- source_word: ἐν στόματι
  choice: sur les lèvres de
  rationale: Expression idiomatique moderne qui conserve l’image de la parole prononcée sans le calque peu naturel « dans la bouche de ».
- source_word: ὁσίων
  choice: des fidèles
  rationale: ὅσιοι désigne ici des personnes pieuses, fidèles à Dieu. « Fidèles » évite de confondre ce terme avec ἅγιοι, généralement rendu par « saints », tout en exprimant sa portée religieuse et relationnelle.
- source_word: εὐλογημένος
  choice: est béni
  rationale: Adjectif prédicatif parallèle à αἰνετός; l’indicatif préserve la lecture déclarative du grec.
- source_word: Ἰσραὴλ
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: ὑπὸ Κυρίου
  choice: par le Seigneur
  rationale: ὑπό suivi du génitif marque l’agent de la bénédiction.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Équivalent français naturel de l’expression indiquant une durée sans fin.
theological_decisions:
- issue: Valeur des deux adjectifs prédicatifs αἰνετός et εὐλογημένος
  choice: 'Lecture déclarative : « est digne de louange » et « est béni »'
  alternative: 'Lecture de souhait ou d’acclamation : « Loué soit le Seigneur » et « qu’Israël soit béni »'
  rationale: La syntaxe nominale grecque permet une couleur acclamative, mais n’impose pas l’optatif. Le rendu déclaratif respecte le parallélisme et évite d’ajouter un souhait absent de la forme grecque.
translation_notes:
  register: Français moderne, digne et lisible. Le parallélisme des deux propositions est maintenu, avec une légère adaptation idiomatique de ἐν στόματι.
