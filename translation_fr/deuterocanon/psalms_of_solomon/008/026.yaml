  source_fidelity: Le grec ἐμίανεν signifie d’abord « souilla / rendit impur »; « profané » est possible dans un cadre cultuel, mais resserre le sens vers une atteinte au sacré. Le parfait passif substantivé τὰ ἡγιασμένα désigne au pluriel les réalités consacrées. « Les choses consacrées » le rend plus directement que le singulier collectif au plus-que-parfait. « Au nom de Dieu » conserve de façon idiomatique le rapport de consécration exprimé par τῷ ὀνόματι τοῦ θεοῦ sans trancher indûment sa nuance précise.
