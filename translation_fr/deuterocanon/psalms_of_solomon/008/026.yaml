lexical_decisions:
- source_word: ἐμίανεν
  choice: a profané
  rationale: Le verbe μίανω exprime l’idée de rendre impur ou de souiller. Dans ce contexte cultuel, « profaner » rend naturellement l’atteinte portée à Jérusalem et aux réalités consacrées, sans limiter le sens à une souillure matérielle.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: τὰ ἡγιασμένα
  choice: ce qui avait été consacré
  rationale: Le participe parfait passif substantivé désigne collectivement les choses rendues saintes ou consacrées; le plus-que-parfait français fait ressortir l’état résultant d’une consécration antérieure.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: au nom de Dieu
  rationale: Le datif peut indiquer le rapport ou la destination de la consécration. « Au nom de Dieu » est naturel en français et conserve cette relation sans imposer nettement une lecture instrumentale.
theological_decisions:
- issue: Valeur du datif τῷ ὀνόματι τοῦ θεοῦ
  choice: au nom de Dieu
  alternative: par le nom de Dieu
  rationale: La formulation retenue laisse ouverte la nuance entre consécration en relation avec le nom divin et consécration destinée à ce nom; « par le nom » imposerait davantage une valeur instrumentale.
translation_notes:
  register: Français moderne, sobre et digne. « Profané » convient au contexte religieux et cultuel; « ce qui avait été consacré » reste accessible tout en reflétant le participe grec.
