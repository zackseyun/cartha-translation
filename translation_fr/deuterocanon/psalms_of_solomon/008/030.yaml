  text: Behold now[a], O God, you have shown us your judgment in your righteousness,
translation:
  language: fr
  text: Vois donc, ô Dieu, tu nous as montré ton jugement dans ta justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δή
  choice: Voici donc
  rationale: Cette formule emphatique attire solennellement l’attention sur ce qui suit. « Voici donc » conserve sa force discursive et convient au registre de la prière.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: L’article avec le nom assume ici une valeur d’adresse directe; « ô Dieu » la rend naturellement dans une prière française soutenue.
- source_word: ἔδειξας
  choice: tu nous as montré
  rationale: Le passé composé exprime naturellement en français un acte accompli dont la portée demeure présente. « Montré » reste plus direct et moins interprétatif que « révélé ».
- source_word: τὸ κρῖμά σου
  choice: ton jugement
  rationale: κρῖμα désigne ici l’acte judiciaire ou le verdict de Dieu. « Jugement » en conserve la portée juridique sans la réduire à une sentence particulière.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: dans ta justice
  rationale: La préposition ἐν peut exprimer la sphère ou la manière de l’action. Dans ce contexte judiciaire, le français naturel « dans ta justice » préserve à la fois la rectitude morale de Dieu et l’exercice juste de son jugement.
theological_decisions:
- issue: Traduction de δικαιοσύνη dans un contexte de jugement divin
  choice: justice
  alternative: droiture
  rationale: En français moderne, « justice » rend naturellement δικαιοσύνη lorsqu’il est question du jugement de Dieu, tout en pouvant désigner sa qualité morale. « Droiture » mettrait davantage l’accent sur la rectitude, mais atténuerait ici la nuance judiciaire.
translation_notes:
  register: Français moderne, solennel et accessible, avec tutoiement conforme au registre biblique courant. La tournure « Voici donc » maintient l’emphase du grec sans archaïsme excessif.
