base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/050.yaml
  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: fr
  text: Heureux ceux qui vivront en ces jours-là[a] et verront les biens d’Israël au rassemblement des tribus ! Que Dieu l’accomplisse ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui naîtront en ces jours-là ».
    reason: Le participe γενόμενοι peut évoquer soit le fait de vivre ou de se trouver à cette époque, soit plus littéralement le fait d’y venir à l’existence.
  - marker: b
    text: 'Autre compréhension possible : « les biens d’Israël au rassemblement des tribus, que Dieu accomplira ».'
    reason: La formule grecque finale est très concise et peut être comprise soit comme un souhait indépendant, soit comme précisant que Dieu accomplira ces biens.
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule traditionnelle et naturelle des béatitudes en français biblique, qui exprime une condition enviable sous la faveur de Dieu sans alourdir la phrase.
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: ceux qui vivront en ces jours-là
  rationale: γενόμενοι signifie littéralement « étant venus à l’existence » ou « se trouvant là » ; dans ce contexte eschatologique, l’expression désigne naturellement ceux qui seront en vie à cette époque, tout en laissant en note la possibilité de comprendre « naîtront ».
- source_word: ἰδεῖν
  choice: et verront
  rationale: L’infinitif indique ce que ces personnes auront le bonheur de connaître. La coordination rend ce rapport idiomatiquement en français sans ajouter l’idée d’une simple observation extérieure.
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: les biens d’Israël
  rationale: 'Cette formulation reste proche du grec et conserve l’ouverture du génitif : il peut s’agir des biens appartenant à Israël ou des bienfaits qui lui sont accordés.'
- source_word: ἐν συναγωγῇ φυλῶν
  choice: au rassemblement des tribus
  rationale: συναγωγή désigne ici l’action ou le fait de rassembler. « Rassemblement » évite de suggérer nécessairement une institution et évoque la réunion des tribus d’Israël.
- source_word: ποιῆσαι ὁ θεός
  choice: Que Dieu l’accomplisse !
  rationale: 'Après la ponctuation forte de l’édition, la formule abrégée se comprend bien comme un souhait ou une prière : que Dieu réalise les biens qui viennent d’être annoncés.'
theological_decisions:
- issue: Valeur de la formule finale ποιῆσαι ὁ θεός
  choice: 'Souhait indépendant : « Que Dieu l’accomplisse ! »'
  alternative: 'Proposition rattachée à ce qui précède : « ce que Dieu accomplira »'
  rationale: La ponctuation forte du texte grec et le parallèle avec le souhait du verset suivant favorisent une exclamation volitive, mais la syntaxe comprimée permet aussi un rattachement à la proposition précédente ; cette possibilité est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. La tournure de béatitude conserve une tonalité biblique ; « rassemblement » et « biens d’Israël » maintiennent les images et l’ambiguïté relationnelle du grec.
