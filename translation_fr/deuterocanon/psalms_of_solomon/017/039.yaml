  yaml_path: translation/deuterocanon/psalms_of_solomon/017/039.yaml
  text: For he will subdue the earth forever with the word of his mouth[c][b][a],
translation:
  language: fr
  text: Car il brisera la terre[a] par la parole de sa bouche, à jamais.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ».
    reason: lexical_alternative
  - marker: b
    text: Cette ligne fait probablement écho à Ésaïe 11.4, où le roi idéal frappe la terre par la parole de sa bouche.
    reason: cross_reference
  - marker: c
    text: 'Le texte grec imprimé porte un verbe signifiant « brisera ». Une leçon souvent envisagée, conforme à Ésaïe 11.4, donnerait : « il frappera la terre ».'
    reason: textual_variant
lexical_decisions:
- source_word: κατάξει
  choice: brisera
  rationale: Le texte imprimé de Swete porte κατάξει, compris comme le futur de κατάγνυμι, « briser, mettre en pièces ». « Brisera » traduit directement cette forme sans lui substituer la leçon πατάξει, « frappera », suggérée par l’écho à Ésaïe 11.4.
- source_word: γῆν
  choice: la terre
  rationale: γῆ peut désigner la terre entière ou un territoire particulier. « La terre » convient à la portée royale et universelle du contexte, tandis que « le pays » demeure possible.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: par la parole de sa bouche
  rationale: Cette traduction proche du grec conserve l’image solennelle d’un jugement accompli par la parole souveraine plutôt que par une arme.
- source_word: εἰς αἰῶνα
  choice: à jamais
  rationale: L’expression indique ici une durée sans fin. « À jamais » est naturel, soutenu et garde la force solennelle de la formule.
theological_decisions:
- issue: Écho possible à Ésaïe 11.4 et jugement du roi par sa parole
  choice: Conserver l’image directe de la terre brisée par la parole de sa bouche.
  alternative: « Il soumettra la terre par son ordre » ou, d’après une leçon rapprochée d’Ésaïe 11.4, « il frappera la terre ».
  rationale: Le grec imprimé exprime une action violente accomplie par la parole. Une paraphrase comme « soumettra » atténuerait cette image, tandis que « frappera » traduirait probablement une autre leçon grecque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec afin de préserver l’image poétique et judiciaire; « à jamais » maintient le registre solennel sans archaïsme excessif.
