  source_fidelity: '« Car il brisera la terre par la parole de sa bouche, à jamais » rend fidèlement le grec imprimé : κατάξει est bien pris au sens de « brisera », sans le remplacer par la leçon conjecturale/harmonisante « frappera » ; γῆν est correctement rendu par « la terre », et l’instrumental τῷ λόγῳ τοῦ στόματος αὐτοῦ est conservé. La position finale de « à jamais » préserve sans la résoudre l’ambiguïté de portée de εἰς αἰῶνα.'
