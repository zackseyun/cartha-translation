  verdict: revise
  source_fidelity: La structure ternaire à l’infinitif et les principaux référents sont conservés. Toutefois, « sceptre » interprète ῥάβδος à partir d’un contexte royal supposé; le grec dit plus sobrement une « verge/bâton », avec l’attribut « de fer ».
  naturalness: « Toute leur assise » est possible dans un registre analytique, mais demeure abstrait et peu naturel ici. « Toute leur substance » rend plus directement l’ampleur de ὑπόστασις tout en restant suffisamment ouvert. La comparaison gagne en naturel avec « les vases d’un potier ».
  terminology: « Héritage », « orgueil » et le singulier représentatif « du pécheur » sont bien retenus. « Verge de fer » est l’expression biblique française établie pour ῥάβδῳ σιδηρᾷ et évite de transformer l’instrument en insigne royal précis.
  issues:
  - severity: medium
    issue: « sceptre de fer » pour ἐν ῥάβδῳ σιδηρᾷ
    rationale: ῥάβδος désigne d’abord une verge, un bâton ou une houlette. « Sceptre » peut être défendable dans certains contextes, mais le choisir ici impose une interprétation royale qui n’est pas lexicalement nécessaire. « Verge de fer » préserve l’image et l’écho scripturaire sans la surdéterminer.
  - severity: low
    issue: « toute leur assise » pour πᾶσαν ὑπόστασιν αὐτῶν
    rationale: La formule française est opaque dans ce contexte et peut évoquer une position institutionnelle. « Toute leur substance » rend de façon plus transparente ce qui les constitue ou les soutient, sans réduire le mot à leurs seuls biens.
  - severity: low
    issue: Comparaison « comme des vases de potier »
    rationale: L’expression sans déterminant est moins idiomatique. « Comme les vases d’un potier » est naturel et conserve le pluriel de σκεύη ainsi que le génitif singulier κεραμέως.
