  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
translation:
  language: fr
  text: pour chasser les pécheurs de l’héritage[a], pour réduire en miettes l’orgueil du pécheur[b] comme les vases d’un potier, pour briser toute leur substance[c] avec une verge de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du patrimoine » ; le mot peut aussi désigner le pays reçu en partage.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le singulier « du pécheur », qui peut avoir une valeur représentative.
    reason: lexical_alternative
  - marker: c
    text: Ou « tous leurs biens », « toute leur assise » ou « toute leur position ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῶσαι
  choice: chasser ... hors de
  rationale: Le verbe exprime une expulsion énergique. Cette tournure est claire en français moderne et conserve l’idée d’exclusion forcée.
- source_word: κληρονομίας
  choice: l’héritage
  rationale: Le terme peut désigner un bien reçu en partage ou un patrimoine hérité; « l’héritage » préserve ici sa possible portée territoriale et liée à l’alliance.
- source_word: ἐκτρῖψαι
  choice: réduire en miettes
  rationale: Dans l’image des vases de potier, le verbe évoque une destruction complète par broyage ou brisement. La formulation française maintient à la fois la violence et l’image concrète.
- source_word: ὑπερηφανίαν ἁμαρτωλοῦ
  choice: l’orgueil du pécheur
  rationale: « Orgueil » rend l’arrogance et l’élévation de soi; le singulier grec est conservé comme singulier représentatif.
- source_word: σκεύη κεραμέως
  choice: des vases de potier
  rationale: Cette expression naturelle conserve l’image biblique d’objets en terre cuite fragiles et aisément brisés.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: avec un sceptre de fer
  rationale: Dans ce contexte royal, « sceptre » est une valeur possible de ῥάβδος et préserve l’écho biblique du souverain qui exerce le jugement.
- source_word: συντρίψαι
  choice: briser
  rationale: Le verbe désigne une destruction violente par rupture. « Briser » évite de répéter la formulation choisie pour ἐκτρῖψαι.
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: toute leur assise
  rationale: ὑπόστασις peut désigner ce qui constitue la base, les ressources ou la position de quelqu’un. « Assise » garde cette ampleur sans limiter le sens aux seuls biens matériels.
theological_decisions:
- issue: Portée de κληρονομία
  choice: l’héritage
  alternative: le patrimoine / le pays reçu en héritage
  rationale: Le texte peut évoquer le territoire d’Israël sans l’expliciter entièrement; la traduction conserve donc le terme ouvert et son possible sens lié à l’alliance.
- issue: Valeur de ῥάβδος dans un contexte royal
  choice: sceptre
  alternative: bâton / verge
  rationale: Le contexte du roi messianique et l’écho au langage royal biblique favorisent « sceptre », sans modifier l’image du fer ni préciser davantage la nature du jugement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme marqué. La structure en trois infinitifs est conservée afin de respecter le mouvement du grec et son lien syntaxique avec le contexte précédent.
