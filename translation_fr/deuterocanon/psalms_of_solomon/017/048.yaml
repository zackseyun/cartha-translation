  yaml_path: translation/deuterocanon/psalms_of_solomon/017/048.yaml
  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
translation:
  language: fr
  text: Ses paroles sont plus pures que l’or le plus pur[a] ; dans les assemblées, il jugera le peuple[b], les tribus des sanctifiés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses paroles sont purifiées, éprouvées par le feu, plus que l’or le plus fin. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il distinguera le peuple » ou « il séparera le peuple ».'
    reason: alternative_reading
  - marker: c
    text: 'Le grec est très condensé et emploie littéralement un singulier : « les tribus du sanctifié ». « Du saint » ou « du consacré » sont également possibles. Le singulier peut avoir une portée collective dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ῥήματα αὐτοῦ
  choice: Ses paroles
  rationale: « Paroles » rend naturellement les propos prononcés désignés par ῥήματα et conserve la concision du grec.
- source_word: πεπυρωμένα
  choice: sont affinées
  rationale: Le participe évoque le passage au feu et l’affinage d’un métal ; ce choix maintient l’image métallurgique liée à l’or.
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: plus que l’or fin le plus précieux
  rationale: Cette formulation française exprime la comparaison intensive et la qualité exceptionnelle de l’or sans reproduire lourdement la syntaxe grecque.
- source_word: ἐν συναγωγαῖς
  choice: dans les assemblées
  rationale: Le terme désigne ici des rassemblements communautaires ; « assemblées » évite de lui imposer un sens institutionnel plus tardif.
- source_word: διακρινεῖ
  choice: il jugera
  rationale: Dans le contexte de l’action du roi, le verbe peut désigner un discernement judiciaire. Son éventail sémantique permet aussi « distinguera » ou « séparera », signalés en note.
- source_word: φυλὰς ἡγιασμένου
  choice: les tribus de ceux qui sont sanctifiés
  rationale: Le génitif singulier substantivé est syntaxiquement resserré et semble avoir une portée collective. Cette traduction évite d’impliquer à tort un individu unique tout en conservant l’idée de consécration.
theological_decisions:
- issue: Référent et nombre de ἡγιασμένου
  choice: ceux qui sont sanctifiés
  alternative: le sanctifié ; le saint ; le consacré
  rationale: Bien que la forme grecque soit au singulier, elle paraît fonctionner collectivement en désignant le peuple consacré. Le pluriel français rend cette portée contextuelle sans identifier le référent à une figure individuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de l’affinage au feu est conservée, tandis que les ambiguïtés de διακρινεῖ et de la construction φυλὰς ἡγιασμένου sont rendues visibles dans les notes.
