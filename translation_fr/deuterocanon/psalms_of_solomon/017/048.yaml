revisions:
- from: Ses paroles sont affinées plus que l’or fin le plus précieux[a] ; dans les assemblées, il jugera le peuple[b], les tribus de ceux qui sont sanctifiés[c].
  to: Ses paroles sont plus pures que l’or le plus pur[a] ; dans les assemblées, il jugera le peuple[b], les tribus des sanctifiés[c].
  rationale: La révision remplace une métaphore peu idiomatique en français par une formulation poétique naturelle qui maintient l’image de purification, allège la description de l’or, et rend la dernière expression de manière concise tout en conservant en note l’ambiguïté du singulier grec et sa possible portée collective.
