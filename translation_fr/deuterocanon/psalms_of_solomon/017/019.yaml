  source_fidelity: La traduction rend fidèlement l’errance dans des lieux désolés, la finalité exprimée par l’infinitif passif σωθῆναι, et le sens concret de ψυχή comme « vie » dans ce contexte. « Parmi eux » ne rend toutefois pas assez précisément ἐξ αὐτῶν, qui indique qu’une vie a été sauvée hors du groupe concerné, et peut en français évoquer seulement une localisation au sein du groupe.
  naturalness: Le français est moderne, sobre et d’un registre approprié au psaume. « Une vie sauvée de l’un des leurs » exprime plus naturellement en français le lien entre la personne sauvée et le groupe que « une vie sauvée parmi eux ».
  terminology: « Lieux déserts », « vie », « mal », « précieuse » et « communauté vivant en terre étrangère » sont des choix recevables et cohérents avec le grec. Les notes conservent les principales alternatives sans imposer une interprétation doctrinale.
