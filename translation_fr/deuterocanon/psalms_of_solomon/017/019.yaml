base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: fr
  text: Ils erraient dans des lieux déserts[a] pour que leur vie[b] soit sauvée du mal; et, aux yeux de la communauté vivant en terre étrangère[c], une vie sauvée de l’un des leurs était précieuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans des déserts » ou « dans des régions sauvages ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec ψυχή peut signifier « vie » ou « âme »; ici, le contexte de survie favorise « vie ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « aux yeux de la communauté en exil ». Le grec désigne une communauté qui vit hors de sa patrie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: ils erraient
  rationale: Avec ἐν ἐρήμοις, le verbe décrit ici un déplacement sans demeure stable plutôt qu’un égarement moral.
- source_word: ἐν ἐρήμοις
  choice: dans des lieux déserts
  rationale: Le pluriel désigne des espaces inhabités ou désolés, sans limiter le sens à des déserts de sable.
- source_word: σωθῆναι ψυχὰς αὐτῶν
  choice: pour que leur vie soit sauvée
  rationale: Cette formulation conserve la valeur finale de l’infinitif ainsi que sa voix passive. Le singulier distributif « leur vie » est idiomatique en français pour parler de la vie de chacun.
- source_word: ἀπὸ κακοῦ
  choice: du mal
  rationale: « Mal » préserve l’étendue du grec, qui peut évoquer le mal lui-même, un tort ou un malheur.
- source_word: παροικίας
  choice: la communauté vivant en terre étrangère
  rationale: παροικία peut désigner une collectivité qui réside hors de sa patrie; cette formulation rend à la fois l’idée communautaire et la condition d’étrangers sans imposer un exil formel.
- source_word: ψυχὴ σεσωμένη
  choice: une vie sauvée
  rationale: Dans ce contexte de fuite devant le danger, ψυχή désigne naturellement la vie préservée; le participe parfait exprime l’état résultant du sauvetage.
- source_word: ἐξ αὐτῶν
  choice: parmi eux
  rationale: La formule indique qu’il s’agit d’une vie tirée du groupe déjà évoqué, tout en restant naturelle en français.
- source_word: τίμιον
  choice: précieuse
  rationale: Le terme exprime la grande valeur accordée à la vie qui a été sauvée.
theological_decisions:
- issue: Sens de ψυχή dans ses deux occurrences
  choice: « vie » dans les deux cas
  alternative: « âme »
  rationale: Le contexte immédiat concerne la survie face au danger. « Vie » évite d’introduire une affirmation anthropologique plus précise que ne l’exige le grec.
- issue: Agent implicite de σωθῆναι
  choice: 'Maintien de la voix passive : « pour que leur vie soit sauvée »'
  alternative: « pour sauver leur vie »
  rationale: Le grec ne présente pas les errants comme les agents directs du salut; la tournure passive laisse l’agent indéterminé, sans l’identifier explicitement à Dieu.
- issue: Portée de παροικία
  choice: Une communauté vivant en terre étrangère
  alternative: « l’exil », « la diaspora » ou « la communauté des résidents étrangers »
  rationale: Le choix retenu garde l’idée de déplacement et de résidence hors de la patrie sans préciser si cette situation est forcée, permanente ou institutionnalisée.
translation_notes:
  register: Français moderne, digne et lisible, avec une structure légèrement poétique. Le point-virgule distingue les deux propositions tout en maintenant leur unité. La répétition de « vie » reflète celle de ψυχή dans le grec.
