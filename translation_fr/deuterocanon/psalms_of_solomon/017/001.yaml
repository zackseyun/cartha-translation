  yaml_path: translation/deuterocanon/psalms_of_solomon/017/001.yaml
  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: fr
  text: Seigneur, tu es notre roi pour toujours et à jamais[a] ; car c’est en toi, notre Dieu, que notre âme se glorifiera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toujours » ; plus littéralement, « pour l’âge et encore » ou « pour l’âge et au-delà ».
    reason: lexical_alternative
  - marker: b
    text: Ou « trouvera sa gloire en toi » ou « se prévaudra de toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε s’adresse directement à Dieu. « Seigneur » est l’équivalent français courant, naturel et digne, sans qu’un « ô » soit nécessaire.
- source_word: Βασιλεὺς
  choice: roi
  rationale: « Roi » conserve directement l’image royale et l’affirmation de la souveraineté divine.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: pour toujours et à jamais
  rationale: Cette tournure française idiomatique rend l’insistance de la formule grecque sur une durée sans fin, tout en laissant la formulation plus littérale en note.
- source_word: καυχήσεται
  choice: mettra sa fierté
  rationale: Avec ἐν (« en »), le verbe exprime ici le fait de tirer sa fierté de Dieu ou de placer en lui son sujet de gloire. « Mettra sa fierté » est naturel en français et évite le sens potentiellement trompeur de « se vantera ».
- source_word: ἡ ψυχὴ ἡμῶν
  choice: notre âme
  rationale: Le grec emploie un singulier avec un possesseur pluriel. « Notre âme » préserve cette image et sa portée collective sans la réduire à un simple « nous ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La construction emphatique « c’est en toi… que » restitue la mise en relief initiale de ἐν σοὶ et rend idiomatiquement καυχάομαι ἐν. Les marqueurs de notes sont placés après les expressions auxquelles les variantes se rapportent.
