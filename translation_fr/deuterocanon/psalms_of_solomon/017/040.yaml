lexical_decisions:
- source_word: εὐλογήσει
  choice: Il bénira
  rationale: Le futur actif de εὐλογέω annonce l’action du roi à venir. « Bénir » est l’équivalent français naturel et conserve le sens religieux sans paraphrase.
- source_word: λαὸν Κυρίου
  choice: le peuple du Seigneur
  rationale: λαός désigne ici la communauté appartenant au Seigneur; le génitif Κυρίου est rendu naturellement par « du Seigneur ».
- source_word: ἐν σοφίᾳ
  choice: avec sagesse
  rationale: ἐν peut exprimer ici la manière ou la sphère. « Avec sagesse » est idiomatique en français et indique que la bénédiction s’exerce avec sagesse, tout en signalant en note le calque possible.
- source_word: μετʼ εὐφροσύνης
  choice: dans la joie
  rationale: μετά avec le génitif exprime l’accompagnement. « Dans la joie » rend cette circonstance avec naturel; εὐφροσύνη désigne la joie ou l’allégresse.
