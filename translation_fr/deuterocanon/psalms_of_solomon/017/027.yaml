  text: to destroy lawless nations with the word of his mouth[a], to make nations flee from before him at his threat[c][b], and to convict sinners by the word of their heart.
translation:
  language: fr
  text: pour détruire les nations sans loi par la parole de sa bouche, faire fuir les nations devant lui par sa menace[a], et confondre les pécheurs par la parole de leur cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour que les nations fuient devant lui par sa menace ». Le grec emploie l’infinitif « fuir » ; il peut présenter leur fuite comme le résultat de sa menace sans employer explicitement un verbe causatif.'
    reason: syntactic_alternative
  - marker: b
    text: L’expression grecque est condensée. Elle peut évoquer la parole intérieure ou les intentions du cœur par lesquelles la faute des pécheurs est mise en lumière.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: détruire
  rationale: Le verbe exprime une destruction décisive. « Détruire » conserve sa force sans imposer l’idée plus absolue d’un anéantissement total.
- source_word: ἔθνη παράνομα
  choice: les nations sans loi
  rationale: « Nations » rend ἔθνη sans lui donner automatiquement le sens religieux technique de « païens ». « Sans loi » préserve le rapport explicite de παράνομα avec la loi et sa portée morale et juridique.
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: par la parole de sa bouche
  rationale: Cette formulation garde l’image concrète d’un jugement accompli par la parole prononcée, tout en restant claire en français biblique moderne.
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: par sa menace
  rationale: La préposition ἐν peut ici marquer le moyen ou la circonstance. « Par sa menace » exprime sobrement l’efficacité de cette menace.
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: faire fuir les nations loin de sa présence
  rationale: Le tour causatif est naturel en français dans cette série d’actions. « Loin de sa présence » restitue l’expression grecque littérale « loin de sa face » sans archaïsme obscur.
- source_word: ἐλέγξαι
  choice: confondre
  rationale: Le verbe peut signifier mettre en lumière la faute, reprendre ou établir la culpabilité. « Confondre » maintient cette portée accusatrice sans la réduire à un verdict judiciaire formel.
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: par la parole de leur cœur
  rationale: La formulation volontairement serrée conserve l’image grecque de la parole intérieure. Le singulier « cœur », malgré l’antécédent pluriel, respecte le singulier distributif καρδίας.
theological_decisions:
- issue: Le jugement du roi messianique exercé par la parole
  choice: Conserver les images de la parole de sa bouche et de sa menace comme moyens de son action judiciaire.
  alternative: Comprendre ces expressions comme de simples symboles généraux de son autorité souveraine.
  rationale: Le grec insiste explicitement sur la parole, la bouche et la menace. La traduction préserve cette présentation sans préciser davantage le mécanisme ni importer une élaboration doctrinale ultérieure.
- issue: La parole du cœur des pécheurs
  choice: Maintenir la formule ambiguë « par la parole de leur cœur ».
  alternative: Expliciter qu’ils sont confondus par leurs propres pensées, intentions ou paroles intérieures.
  rationale: 'Le grec est comprimé et permet plusieurs nuances : parole intérieure, intention du cœur ou témoignage intérieur révélant la faute. Une explicitation dans le corps du texte trancherait indûment.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme infinitif est maintenu. Les images sémitisantes sont conservées lorsqu’elles restent intelligibles ; « présence » remplace toutefois le littéral « face » pour éviter une tournure inutilement archaïque.
