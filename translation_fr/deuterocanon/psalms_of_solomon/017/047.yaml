  text: 'This is the splendor of the king of Israel[a], which God knew: to raise him up over the house of Israel[c][b], to discipline him.'
translation:
  language: fr
  text: 'Telle est la splendeur du roi d’Israël, celle que Dieu a connue[a] : le susciter à la tête de la maison d’Israël[b] et le former[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait connue d’avance » ou « avait agréée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le susciter sur la maison d’Israël » ; autre traduction possible : « pour la maison d’Israël ».'
    reason: semantic_ambiguity
  - marker: c
    text: Ou « le corriger » ou « l’instruire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐπρέπεια
  choice: splendeur
  rationale: Le mot désigne la beauté, la dignité ou la magnificence visible. « Splendeur » convient au cadre royal tout en restant naturel en français.
- source_word: ἔγνω
  choice: a connue
  rationale: Cette traduction formelle conserve l’étendue de sens du verbe grec et son possible arrière-plan sémitique, sans trancher entre simple connaissance, connaissance préalable et approbation.
- source_word: ἀναστῆσαι
  choice: susciter
  rationale: Dans un contexte royal, « susciter » exprime naturellement l’action de faire paraître et d’établir quelqu’un, tout en gardant l’image dynamique du verbe grec.
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: à la tête de la maison d’Israël
  rationale: Cette formulation rend le rapport d’autorité probablement exprimé par ἐπί et conserve l’expression collective « maison d’Israël ».
- source_word: παιδεῦσαι
  choice: former
  rationale: Le verbe peut désigner l’éducation, la formation ou la discipline corrective. « Former » maintient ici la portée éducative sans imposer un sens exclusivement punitif.
theological_decisions:
- issue: Portée de la connaissance divine exprimée par ἔγνω
  choice: a connue
  alternative: avait connue d’avance ; avait agréée
  rationale: Le grec permet une connaissance simple, préalable ou élective. Le texte principal garde la formulation ouverte et la note signale les principales nuances possibles.
- issue: Fonction des infinitifs ἀναστῆσαι et παιδεῦσαι
  choice: explication ou finalité de ce que Dieu a connu, marquée par les deux-points puis « pour »
  alternative: « en le suscitant… et en le formant »
  rationale: Les infinitifs peuvent expliciter la connaissance ou le dessein divin. La formulation retenue préserve leur force prospective ou finale sans transformer les deux actions en simples circonstances.
- issue: Référent des pronoms masculins αὐτόν
  choice: le roi d’Israël
  alternative: Israël personnifié
  rationale: Le roi est l’antécédent masculin singulier le plus immédiat. Le français garde toutefois la même chaîne pronominale et n’ajoute pas de nom absent du grec.
translation_notes:
  register: Français moderne, digne et lisible. « Telle est » conserve le caractère déclaratif de la phrase nominale grecque. La reprise « celle que » clarifie l’accord féminin du relatif grec avec « splendeur ». Les deux-points maintiennent la construction abrupte et l’ambiguïté théologique du texte source, tandis que « pour » rend plus naturellement en français la relation entre les deux infinitifs.
