lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: lorsque … s’est dressé
  rationale: La construction ἐν suivi de l’infinitif articulé a ici une valeur temporelle. « Lorsque » l’exprime naturellement, tandis que « s’est dressé » conserve la force du verbe.
- source_word: αὐτοῖς
  choice: contre eux
  rationale: Avec ἐπανίστημι, le datif désigne naturellement ceux auxquels on s’oppose ; « contre eux » rend clairement cet emploi.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le grec emploie un nom masculin singulier ; « un homme » en conserve la forme explicite.
- source_word: ἀλλότριον
  choice: étranger
  rationale: Dans ce contexte d’appartenance collective, « étranger » exprime naturellement le fait de ne pas appartenir au groupe.
- source_word: γένους ἡμῶν
  choice: à notre peuple
  rationale: γένος peut désigner l’origine, la lignée ou le groupe d’appartenance. « Notre peuple » convient au contexte collectif et évite les connotations modernes potentiellement trompeuses de « race ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le fragment conserve sa dépendance syntaxique au contexte précédent. « S’est dressé contre » rend l’opposition sans expliciter davantage l’identité de l’homme ou des personnes visées.
