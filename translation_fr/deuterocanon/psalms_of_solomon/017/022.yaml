  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
translation:
  language: fr
  text: Le roi était dans le mépris de la loi[a], le juge dans la désobéissance[b], et le peuple dans le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ne comporte pas de verbe exprimé. « Était » est ajouté d’après le contexte passé; on pourrait aussi traduire plus littéralement : « Le roi est dans le mépris de la loi ».'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Ou : « la rébellion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεὺς
  choice: le roi
  rationale: Titre politique direct et courant, sans élargir indûment le sens à tout dirigeant.
- source_word: ἐν
  choice: dans
  rationale: La répétition de ἐν présente chaque personnage ou groupe comme évoluant dans une condition morale; « dans » conserve le parallélisme grec.
- source_word: παρανομίᾳ
  choice: le mépris de la loi
  rationale: Cette formulation française naturelle exprime la violation ou le rejet de la loi mieux que « illégalité », qui évoquerait surtout un statut juridique.
- source_word: κριτὴς
  choice: le juge
  rationale: Équivalent direct et naturel de la fonction désignée.
- source_word: ἀπειθείᾳ
  choice: la désobéissance
  rationale: Rend le refus d’obéir sans imposer la nuance plus forte de révolte ni le sens plus étroit d’incrédulité.
- source_word: λαὸς
  choice: le peuple
  rationale: Conserve le sens collectif sans introduire la connotation géopolitique de « nation ».
- source_word: ἁμαρτίᾳ
  choice: le péché
  rationale: Rendu direct qui maintient la brièveté solennelle du dernier membre.
theological_decisions:
- issue: Temps du verbe sous-entendu dans la proposition nominale grecque
  choice: « vivait », à l’imparfait
  alternative: « vit », au présent, ou une formulation nominale sans verbe
  rationale: Le grec ne comporte aucun verbe exprimé, mais le contexte narratif antérieur, notamment l’imparfait ἦν en 17.21, situe cette corruption dans le passé. L’imparfait français respecte ce cadre tout en signalant en note que le temps est fourni par le contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure ternaire et l’ellipse du verbe dans les deuxième et troisième membres préservent le rythme accusateur du grec. « Vivait dans » est plus idiomatique que le calque uniforme « était dans », tandis que la note rend visible l’absence de verbe dans le texte source.
