  text: Look, Lord, and raise up for them their king, Look, Lord, and raise up for them their king, the son of David, at the time you chose, O God, for him to reign over Israel your servant., at the time Look, Lord, and raise up for them their king, a son of David, at the time you chose, O God, for him to reign over Israel your servant., O God, for him to reign over Israel your servant.
translation:
  language: fr
  text: Vois, Seigneur, et suscite pour eux leur roi, fils de David, au temps que toi, ô Dieu, tu as vu, pour qu’il règne sur Israël, ton serviteur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: Regarde
  rationale: Rend directement l’impératif grec, ici comme appel pressant adressé au Seigneur.
- source_word: ἀνάστησον
  choice: suscite
  rationale: Dans ce contexte royal, « susciter » exprime l’action de faire paraître et d’établir le roi attendu, sans suggérer nécessairement une résurrection.
- source_word: τὸν βασιλέα αὐτῶν
  choice: leur roi
  rationale: Reproduit l’article défini et le possessif du grec.
- source_word: υἱὸν Δαυίδ
  choice: fils de David
  rationale: Conserve la formule dynastique sans ajouter un article absent du groupe appositif grec.
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: au temps que tu as fixé
  rationale: Le littéral « au temps que tu as vu » serait obscur en français; dans ce contexte, voir le temps signifie le discerner ou le déterminer souverainement.
- source_word: παῖδά σου
  choice: ton serviteur
  rationale: παῖς peut signifier « enfant » ou « serviteur »; appliqué ici à Israël, « serviteur » correspond à l’usage biblique collectif et au contexte.
theological_decisions:
- issue: Détermination de « fils de David »
  choice: fils de David
  alternative: le fils de David / un fils de David
  rationale: Le grec présente l’expression en apposition à « leur roi » sans article propre. La formulation française sans article conserve au mieux cette nuance et évite de trancher entre titre défini et membre indéfini de la lignée.
- issue: Sujet implicite de βασιλεῦσαι
  choice: afin qu’il règne
  alternative: pour régner
  rationale: Le sujet naturel est le roi suscité; l’explicitation française clarifie la syntaxe sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. « Ô Dieu » garde la solennité de l’adresse grecque; « suscite » conserve le registre biblique tout en restant intelligible.
