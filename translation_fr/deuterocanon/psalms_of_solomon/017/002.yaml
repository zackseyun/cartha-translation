base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: fr
  text: Et quelle est la durée de la vie d’un être humain sur la terre ? Selon la durée de sa vie, son espérance aussi repose sur lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son espérance aussi repose sur cette durée », si le pronom final renvoie au temps de sa vie plutôt qu’à l’être humain.
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς
  choice: durée de la vie
  rationale: Dans la question, χρόνος désigne la durée mesurée de la vie humaine plutôt que le temps abstrait. « Durée de la vie » est précis et naturel en français.
- source_word: ἀνθρώπου
  choice: d’un être humain
  rationale: Le singulier est générique. « Un être humain » conserve cette portée représentative sans restreindre le propos au sexe masculin.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Rendu locatif direct et idiomatique de l’expression grecque.
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: À la mesure de son temps
  rationale: κατά exprime ici une correspondance ou une proportion. Cette formulation préserve la comparaison avec la brièveté du temps humain, plutôt que de la réduire à la seule idée de simultanéité.
- source_word: ἐλπὶς
  choice: espérance
  rationale: « Espérance » rend le substantif dans un registre biblique actuel et digne, tout en gardant l’idée d’attente confiante.
- source_word: ἐπʼ αὐτόν
  choice: repose sur lui
  rationale: La préposition ἐπί avec l’accusatif exprime ici l’objet sur lequel porte ou repose l’espérance. Le pronom est principalement compris comme renvoyant à l’être humain, lecture soutenue par le contraste avec l’espérance en Dieu au verset suivant.
theological_decisions:
- issue: Référent du pronom final ἐπʼ αὐτόν
  choice: Le texte principal comprend « lui » comme renvoyant à l’être humain.
  alternative: Le pronom peut grammaticalement renvoyer à χρόνος, « le temps », et signifier que l’espérance repose sur ce temps.
  rationale: La reprise de la personne humaine et le contraste immédiat du verset suivant avec l’espérance placée en Dieu favorisent le référent personnel. L’ambiguïté grammaticale réelle est toutefois conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La première occurrence de χρόνος est explicitée par « durée », tandis que la seconde reste « temps » afin de préserver la formulation comparative du grec. Le tour « à la mesure de » maintient la tension qualitative et proportionnelle de κατά.
