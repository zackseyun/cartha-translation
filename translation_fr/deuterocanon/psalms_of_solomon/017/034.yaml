translation:
  language: fr
  text: pour que des nations viennent des confins de la terre voir sa gloire, en apportant comme présents ses fils affaiblis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεσθαι
  choice: pour que ... viennent
  rationale: L’infinitif dépend syntaxiquement du verset précédent et exprime ici le but ou le résultat; il ne convient donc pas d’en faire un futur indépendant.
- source_word: ἔθνη
  choice: des nations
  rationale: Le pluriel désigne largement les peuples non israélites; « nations » reste naturel et n’accentue pas indûment l’opposition entre Juifs et non-Juifs.
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: des confins de la terre
  rationale: Cette expression française idiomatique traduit l’idée d’une provenance extrêmement lointaine tout en conservant le singulier collectif du grec.
- source_word: ἰδεῖν
  choice: voir
  rationale: L’infinitif simple marque le but; « voir » est clair, direct et adapté au registre du passage.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » est l’équivalent traditionnel et sémantiquement large de δόξα, sans préciser abusivement s’il s’agit de splendeur ou de majesté.
- source_word: φέροντες δῶρα
  choice: en apportant comme présents
  rationale: La tournure rattache δῶρα aux fils apportés et rend clairement qu’ils sont eux-mêmes présentés comme des dons.
- source_word: τοὺς ἐξησθενηκότας
  choice: affaiblis
  rationale: Le participe parfait décrit un état résultant de faiblesse; « affaiblis » préserve cette valeur sans la limiter à l’épuisement physique.
- source_word: υἱοὺς αὐτῆς
  choice: ses fils
  rationale: Le grec emploie le masculin pluriel υἱούς; « ses fils » conserve cette précision et le possessif féminin renvoie à Jérusalem dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation demeure syntaxiquement liée au verset précédent. « Des confins de la terre » est plus idiomatique en français que le calque « de l’extrémité de la terre ». La construction conserve l’ambiguïté contextuelle de l’acte par lequel les nations ramènent les fils de Jérusalem comme présents.
