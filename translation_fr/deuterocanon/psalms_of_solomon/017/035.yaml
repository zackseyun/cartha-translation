  text: and to see the glory of the Lord with which God glorified her[a]; and he himself will be a righteous king over them, taught by God[c][b],
translation:
  language: fr
  text: et de voir la gloire du Seigneur dont Dieu l’a glorifiée[a] ; et lui-même sera leur roi juste, instruit par Dieu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la gloire du Seigneur, dont Dieu l’a glorifiée » ; le pronom féminin désigne vraisemblablement Jérusalem personnifiée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « enseigné par Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le grec dit, sans verbe exprimé et dans un ordre différent : « et lui-même, roi juste, instruit par Dieu, sur eux ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: δόξαν Κυρίου
  choice: la gloire du Seigneur
  rationale: « Gloire » conserve le registre biblique élevé de δόξα ainsi que son lien lexical avec ἐδόξασεν ; Κυρίου est rendu normalement par « du Seigneur ».
- source_word: ἐδόξασεν αὐτήν
  choice: dont Dieu l’a glorifiée
  rationale: Cette formulation conserve la répétition grecque entre « gloire » et « glorifier ». Le pronom féminin renvoie naturellement à la ville, Jérusalem personnifiée, dans le contexte.
- source_word: βασιλεὺς δίκαιος
  choice: roi juste
  rationale: « Juste » rend naturellement δίκαιος en français biblique sans limiter le terme à la seule équité civique.
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: instruit par Dieu
  rationale: « Instruit par Dieu » exprime directement l’idée d’un enseignement reçu de Dieu et sonne plus naturellement ici que « enseigné par Dieu ».
- source_word: ἐπ’ αὐτούς
  choice: leur roi
  rationale: Dans le contexte de la royauté, ἐπί avec l’accusatif indique l’exercice de l’autorité sur eux. Le possessif français restitue naturellement cette relation sans la tournure peu idiomatique « roi sur eux ».
theological_decisions:
- issue: Verbe sous-entendu dans la seconde proposition
  choice: sera
  alternative: 'laisser la proposition sans verbe explicite : « et lui-même, leur roi juste, instruit par Dieu »'
  rationale: Le grec transmis est sans verbe, mais le français exige normalement qu’on en explicite un. Le futur « sera » correspond au contexte orienté vers l’avenir, tout en signalant en note que le verbe n’est pas exprimé.
- issue: Rattachement de ἐπ’ αὐτούς
  choice: rattacher « sur eux » à la royauté au moyen de « leur roi »
  alternative: « et lui-même sera un roi juste, instruit par Dieu, sur eux »
  rationale: La proximité sémantique avec βασιλεύς favorise le rattachement à la fonction royale. La note préserve néanmoins l’ordre grec, qui place l’expression après « instruit par Dieu ».
translation_notes:
  register: Français international moderne, digne et biblique. La répétition « gloire / glorifiée » est volontairement conservée malgré son caractère marqué, afin de reproduire le jeu lexical grec. « Leur roi » privilégie un français naturel tout en rendant l’autorité exercée sur le peuple.
