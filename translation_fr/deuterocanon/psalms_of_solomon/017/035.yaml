  text: καὶ ἰδεῖν τὴν δόξαν Κυρίου ἣν ἐδόξασεν αὐτὴν ὁ θεός· καὶ αὐτὸς βασιλεὺς δίκαιος διδακτὸς ὑπὸ θεοῦ ἐπ’ αὐτούς,
