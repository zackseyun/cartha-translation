  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: fr
  text: Dans la colère de sa beauté[a], il les envoya jusqu’en occident, et les dirigeants du pays à la dérision[b] ; et il n’épargna pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la colère de sa beauté ». On pourrait aussi rendre « beauté » par « éclat », mais le grec présente une expression inhabituelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le même verbe se poursuit : « il envoya […] les dirigeants du pays à la dérision ».'
    reason: source_syntax
  - marker: c
    text: Le grec ne précise pas qui ou ce qu’il n’épargna pas.
    reason: ambiguity
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: dans la colère de sa beauté
  rationale: Cette formulation conserve le génitif grec inhabituel et rend κάλλος selon son sens premier, « beauté », sans supposer que le sujet est Dieu ni corriger une éventuelle difficulté du texte grec.
- source_word: ἐξαπέστειλεν
  choice: il les envoya
  rationale: Le verbe renforcé exprime l’envoi au loin ou l’expulsion. « Envoya » en garde le noyau lexical, tandis que la destination jusqu’en Occident fait ressortir l’éloignement.
- source_word: ἕως ἐπὶ δυσμῶν
  choice: jusqu’en Occident
  rationale: δυσμαί désigne le couchant ou l’ouest. « Jusqu’en Occident » restitue naturellement en français la direction et la limite lointaine.
- source_word: τοὺς ἄρχοντας τῆς γῆς
  choice: les dirigeants du pays
  rationale: ἄρχοντες désigne ceux qui exercent l’autorité, et γῆ peut ici se comprendre comme le pays plutôt que la terre entière.
- source_word: εἰς ἐμπαιγμόν
  choice: à la dérision
  rationale: ἐμπαιγμός exprime la moquerie humiliante. « Livrer à la dérision » est l’expression française naturelle correspondant à la construction elliptique grecque.
- source_word: οὐκ ἐφείσατο
  choice: il n’épargna pas
  rationale: Le grec ne précise aucun complément. La traduction maintient cette absence plutôt que d’ajouter « eux » ou un autre objet implicite.
theological_decisions:
- issue: Identité du sujet et portée de « sa beauté »
  choice: Ne pas identifier explicitement le sujet et conserver « sa beauté »
  alternative: Employer « sa splendeur » en supposant un contexte d’action divine
  rationale: Le verset grec ne nomme pas ici le sujet, et le contexte littéraire peut renvoyer au personnage impie du verset précédent. La traduction évite donc une interprétation théologique importée.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe a été légèrement régularisée avec « livra […] à la dérision », tout en signalant en note la construction grecque. L’étrangeté de « colère de sa beauté » est volontairement conservée afin de ne pas corriger ou théologiser le texte source.
