  text: The Lord is faithful in all his judgments that he carries out on the earth[a].
translation:
  language: fr
  text: Le Seigneur est fidèle dans tous ses jugements qu’il accomplit sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστός
  choice: fidèle
  rationale: 'Adjectif attribut qualifiant le Seigneur lui-même : « fidèle » exprime sa constance et sa fiabilité sans introduire l’idée distincte de justice.'
- source_word: κύριος
  choice: Seigneur
  rationale: Titre révérenciel courant qui correspond naturellement à l’usage de κύριος dans la tradition grecque biblique.
- source_word: κρίμασιν
  choice: jugements
  rationale: Le terme désigne ici des décisions ou actes judiciaires concrets de Dieu ; « jugements » en conserve la portée sans paraphrase excessive.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif grec est rendu explicitement, conformément à la formulation « tous ses jugements ».
- source_word: ποιεῖ
  choice: exécute
  rationale: Avec « jugements », « exécute » rend idiomatiquement l’idée de jugements mis en œuvre, plutôt que simplement formulés.
- source_word: ἐπὶ τὴν γῆν
  choice: sur la terre
  rationale: Cette traduction conserve le sens géographique large et évite de restreindre γῆ à un pays particulier.
theological_decisions:
- issue: Le verset souligne-t-il le caractère du Seigneur ou seulement la justesse de ses actes ?
  choice: « Le Seigneur est fidèle » fait de la fidélité une qualité du Seigneur, manifestée dans l’ensemble de ses jugements.
  alternative: « Le Seigneur est juste dans tous ses jugements »
  rationale: πιστός signifie ici « fidèle » ou « digne de confiance » ; le traduire par « juste » introduirait une notion lexicale distincte.
- issue: Portée de la proposition relative οἷς ποιεῖ ἐπὶ τὴν γῆν
  choice: Elle précise que les jugements sont exécutés sur la terre, tout en maintenant le possessif αὐτοῦ.
  alternative: « dans tous les jugements qu’il exécute sur la terre »
  rationale: Le texte grec comporte à la fois le possessif « ses » et une proposition relative dont l’antécédent est « jugements » ; la traduction principale conserve ces deux éléments malgré une légère redondance naturelle en français.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la répétition sémantique du possessif « ses » et du sujet « il », présente dans le grec, sans alourdir le vocabulaire.
