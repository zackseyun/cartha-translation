source:
  edition: lxx-swete-1909
  text: καὶ αὐτὸς καθαρὸς ἀπὸ ἁμαρτίας, τοῦ ἄρχειν λαοὺς μεγάλους, ἐλέγξαι ἄρχοντας καὶ ἐξᾶραι ἁμαρτωλοὺς ἐν ἰσχύϊ λόγου.
  language: Greek
