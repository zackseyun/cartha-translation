base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/041.yaml
  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: fr
  text: Et lui-même sera pur de tout péché[a], afin de gouverner de grands peuples, de réprimander les dirigeants et d’écarter les pécheurs[b] par la puissance de sa parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pur du péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de chasser les pécheurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: pur de tout péché
  rationale: L’expression décrit une pureté morale. « Pur de tout péché » conserve l’image de pureté portée par καθαρός tout en étant naturelle en français moderne.
- source_word: ἄρχειν
  choice: gouverner
  rationale: Le verbe désigne l’exercice de l’autorité; « gouverner » convient au contexte royal sans préciser davantage la nature de cette autorité.
- source_word: λαοὺς μεγάλους
  choice: de grands peuples
  rationale: Le pluriel « peuples » préserve la portée collective et politique de λαοί, tandis que « grands » rend directement μεγάλους.
- source_word: ἐλέγξαι
  choice: réprimander
  rationale: Dans ce contexte, le verbe exprime une censure autorisée adressée aux détenteurs du pouvoir.
- source_word: ἄρχοντας
  choice: les dirigeants
  rationale: Ce terme général désigne ceux qui exercent l’autorité et évite de limiter indûment le mot à des rois ou à des princes.
- source_word: ἐξᾶραι
  choice: écarter
  rationale: Le verbe indique que les pécheurs sont ôtés ou éliminés du milieu concerné; « écarter » garde cette portée générale sans imposer l’idée plus précise d’expulsion.
- source_word: ἐν ἰσχύϊ λόγου
  choice: par la puissance de sa parole
  rationale: La tournure exprime une puissance agissant au moyen de la parole. Le possessif, implicite en grec, est nécessaire pour une formulation française naturelle et rattache la parole au sujet.
theological_decisions:
- issue: Pureté morale du personnage attendu
  choice: pur de tout péché
  alternative: exempt de péché
  rationale: Le choix retenu préserve la métaphore explicite de la pureté dans καθαρός, sans transformer cette affirmation en formule doctrinale plus développée.
- issue: Valeur des infinitifs après τοῦ
  choice: afin de gouverner… de réprimander… et d’écarter
  alternative: pour gouverner… réprimander… et écarter
  rationale: La construction est rendue comme exprimant la finalité ou l’aptitude liée à sa pureté. « Afin de » rend clairement ce rapport sans en développer les implications théologiques.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme des infinitifs grecs et le vocabulaire royal et judiciaire, sans archaïsmes ni précisions confessionnelles ajoutées.
