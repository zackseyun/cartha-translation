- from: Aucun étranger établi ni aucun homme d’une autre nation ne séjournera plus parmi eux ; il jugera les peuples et les nations dans la sagesse de sa justice. Sélah.[a]
  to: Aucun étranger établi ni aucune personne d’origine étrangère ne séjournera plus parmi eux ; il jugera les peuples et les nations dans la sagesse de sa justice. Sélah.[a]
  rationale: La révision se limite au rendu de ἀλλογενής afin d’éviter une restriction masculine et une précision nationale non imposées par le grec. Le reste du texte et l’ancrage de la note sont conservés.
