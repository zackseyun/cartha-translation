review_pass:
  verdict: revise
  source_fidelity: 'Le verset rend correctement les deux propositions grecques, le futur, la négation renforcée (« οὐ ... ἔτι »), la distinction entre « peuples » (λαούς) et « nations » (ἔθνη), ainsi que διάψαλμα. « Homme d’une autre nation » restreint toutefois sans nécessité le référent humain au masculin et exprime ἀλλογενής de façon moins exacte : le terme marque l’origine étrangère, non spécifiquement l’appartenance à une nation au sens moderne.'
  naturalness: La formulation est globalement claire et d’un registre psalmique moderne. « Personne d’origine étrangère » est plus inclusif et plus idiomatique que « homme d’une autre nation », tout en laissant distincts le résident étranger et la personne définie par son origine étrangère. « Dans la sagesse de sa justice » conserve volontairement la construction dense du grec et reste acceptable dans ce registre.
  terminology: « Étranger établi » / « séjournera » maintient utilement le lien sémantique entre πάροικος et παροικήσει. « Justice » pour δικαιοσύνη convient au contexte judiciaire sans exclure sa portée morale. « Sélah » et sa note préservent à juste titre l’incertitude liée à διάψαλμα.
