  text: And no sojourner or foreigner shall sojourn among them any longer[a]; he will judge peoples and nations in the wisdom of his righteousness[d][c][b]. Selah.
translation:
  language: fr
  text: Aucun étranger établi ni aucune personne d’origine étrangère ne séjournera plus parmi eux ; il jugera les peuples et les nations dans la sagesse de sa justice. Sélah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sélah » semble signaler une pause liturgique ou musicale ; sa fonction précise reste incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  choice: étranger établi
  rationale: Le terme désigne une personne qui réside au milieu d’un peuple sans en être pleinement membre. « Étranger établi » exprime ce statut sans suggérer un simple passage.
- source_word: ἀλλογενής
  choice: homme d’une autre nation
  rationale: Le mot souligne l’origine étrangère. Cette formulation conserve la distinction avec l’étranger déjà établi désigné par πάροικος.
- source_word: παροικήσει
  choice: séjournera parmi eux
  rationale: Le verbe signifie résider en qualité d’étranger. « Séjournera parmi eux » reste naturel et maintient le lien de sens avec πάροικος.
- source_word: λαούς
  choice: les peuples
  rationale: Le pluriel collectif est rendu distinctement du terme ἔθνη qui suit.
- source_word: ἔθνη
  choice: les nations
  rationale: « Nations » est l’équivalent naturel dans ce contexte et préserve le couple « peuples et nations ».
- source_word: σοφίᾳ
  choice: sagesse
  rationale: Dans ce contexte royal et judiciaire, le terme désigne la sagesse avec laquelle le jugement est exercé.
- source_word: δικαιοσύνης
  choice: justice
  rationale: En français biblique moderne, « justice » peut exprimer à la fois la rectitude morale et l’équité judiciaire de δικαιοσύνη, particulièrement appropriée ici au contexte du jugement.
- source_word: διάψαλμα
  choice: Sélah
  rationale: La translittération traditionnelle préserve l’incertitude sur la fonction exacte de cette indication liturgique ou musicale.
theological_decisions:
- issue: Portée de δικαιοσύνη dans un contexte de jugement royal
  choice: sa justice
  alternative: sa droiture
  rationale: « Justice » convient directement à l’acte de juger tout en pouvant désigner en français la rectitude morale du juge. « Droiture » mettrait davantage l’accent sur le caractère moral, mais atténuerait la dimension judiciaire du contexte.
- issue: Rapport syntaxique entre σοφίᾳ et δικαιοσύνης
  choice: dans la sagesse de sa justice
  alternative: avec une sagesse conforme à sa justice
  rationale: La formulation retenue suit de près le génitif grec et en conserve la densité ainsi qu’une certaine ambiguïté, sans décider si la justice qualifie, produit ou possède cette sagesse.
translation_notes:
  register: Français international moderne, digne et légèrement élevé. « Étranger établi » évite le ton administratif de « résident étranger » et la connotation contemporaine plus marquée d’« immigré ». La structure parallèle et le point-virgule reproduisent le mouvement du grec.
