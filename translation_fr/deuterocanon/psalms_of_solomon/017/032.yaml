review_pass:
  verdict: revise
  source_fidelity: La construction « Il aura des peuples des nations pour le servir sous son joug » rend avec justesse ἕξει + accusatif + infinitif, sans imposer une lecture purement causative. « Des peuples des nations », « servir », « joug », « le Seigneur » et « glorifiera » sont fidèles au grec. La dernière expression vise un cadre publiquement remarquable ou visible à l’échelle de toute la terre; le français du projet la formule de manière un peu trop littérale.
  naturalness: 'Le registre est moderne, soutenu et approprié. Toutefois, « un lieu visible de toute la terre » est un tour moins naturel et ambigu en français: il peut suggérer un lieu physiquement visible depuis chaque point de la terre. « Un lieu bien en vue aux yeux de toute la terre » conserve la portée publique et universelle tout en étant plus idiomatique.'
  terminology: « Seigneur » et « glorifiera » conviennent au registre biblique français. « Sous son joug » préserve l’image grecque de sujétion sans durcir indûment le sens en « asservir ».
  issues:
  - severity: low
    issue: Formulation de ἐν ἐπισήμῳ πάσης τῆς γῆς
    rationale: « Visible de toute la terre » est grammaticalement possible, mais sonne comme une affirmation de visibilité physique. Le grec permet aussi l’idée d’un lieu bien en vue, notoire ou remarquable. Une formulation française plus idiomatique doit conserver cette nuance sans trancher en faveur de la seule célébrité.
  revised_text: Il aura des peuples des nations pour le servir sous son joug, et il glorifiera le Seigneur dans un lieu bien en vue aux yeux de toute la terre[a].
  revised_footnotes:
  - marker: a
    text: Ou « dans un lieu renommé dans toute la terre ». Le grec peut évoquer soit un lieu bien visible, soit un lieu remarquable ou célèbre.
    reason: lexical_alternative
  revision_rationale: Révision limitée de la formulation française de la dernière expression afin d’éviter le calque « visible de toute la terre ». Le texte révisé maintient l’image d’un lieu publiquement apparent et la note conserve l’alternative de la notoriété, conformément à l’ambiguïté lexicale de ἐπίσημος.
