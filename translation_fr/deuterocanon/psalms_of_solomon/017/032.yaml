base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/032.yaml
  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
translation:
  language: fr
  text: Il aura des peuples des nations pour le servir sous son joug, et il glorifiera le Seigneur dans un lieu bien en vue aux yeux de toute la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu renommé dans toute la terre ». Le grec peut évoquer soit un lieu bien visible, soit un lieu remarquable ou célèbre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξει ... δουλεύειν
  choice: Il aura ... pour le servir
  rationale: La tournure rend naturellement la construction grecque ἔχω avec objet et infinitif, qui présente ces peuples comme étant à sa disposition pour le servir, sans la réduire à un simple causatif.
- source_word: λαοὺς ἐθνῶν
  choice: des peuples des nations
  rationale: Cette formulation conserve les deux termes grecs et l'absence d'article devant λαούς, sans interpréter prématurément ἔθνη comme « païens ».
- source_word: δουλεύειν
  choice: servir
  rationale: Le verbe exprime ici le service et la sujétion; l'image du joug rend déjà explicite la dimension de soumission.
- source_word: ζυγὸν
  choice: joug
  rationale: Le choix maintient la métaphore concrète grecque de la domination et de la sujétion.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Seigneur » est le titre français usuel et direct pour κύριος dans ce contexte religieux.
- source_word: δοξάσει
  choice: glorifiera
  rationale: Ce verbe conserve le poids religieux de δοξάζω et reste naturel en français biblique moderne.
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: en un lieu visible de toute la terre
  rationale: ἐν ἐπισήμῳ est compris substantivement comme désignant un lieu bien en vue; « visible de toute la terre » préserve la portée de πάσης τῆς γῆς sans introduire un comparatif absent du grec.
theological_decisions:
- issue: Nature de la domination exercée sur les nations
  choice: Conserver « servir sous son joug »
  alternative: Expliciter par « être asservis » ou « être ses sujets »
  rationale: Le grec associe le service à l'image du joug, mais ne précise pas davantage la forme politique ou coercitive de cette sujétion; la traduction maintient cette tension sans surinterprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « aura ... pour le servir » évite un calque maladroit tout en distinguant la possession ou disposition du simple causatif. La répétition « peuples des nations » est conservée en raison de sa valeur textuelle.
