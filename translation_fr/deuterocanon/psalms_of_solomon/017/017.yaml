  yaml_path: translation/deuterocanon/psalms_of_solomon/017/017.yaml
  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: fr
  text: Et les fils de l’alliance l’emportaient sur eux[a] au milieu des nations mêlées ; il n’y avait parmi eux, à Jérusalem, personne qui pratique la miséricorde et la vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les surpassaient » ou « exerçaient leur domination sur eux ».

      '
    reason: Le verbe grec peut exprimer le fait de l’emporter, de surpasser ou d’exercer une domination.
  - marker: b
    text: 'Ou : « la miséricorde et la fidélité ».

      '
    reason: Dans cette paire d’allure sémitique, ἀλήθεια peut désigner la fidélité autant que la vérité.
lexical_decisions:
- source_word: ἐπεκρατοῦσαν
  choice: l’emportaient sur
  rationale: L’imparfait exprime une situation continue, et la construction avec le génitif αὐτῶν signifie qu’ils avaient l’avantage sur eux ou les surpassaient. « L’emportaient sur » garde cette portée comparative sans imposer l’idée d’un pouvoir politique ou militaire.
- source_word: υἱοὶ τῆς διαθήκης
  choice: les fils de l’alliance
  rationale: Cette traduction conserve le masculin pluriel explicite du grec et la valeur identitaire de l’expression liée à l’alliance.
- source_word: ἐθνῶν συμμίκτων
  choice: des nations mêlées
  rationale: συμμίктων désigne ce qui est mélangé ou mêlé, tandis que ἐθνῶν garde ici son sens collectif de nations ou de peuples.
- source_word: ὁ ποιῶν
  choice: personne qui pratique
  rationale: Dans cette tournure morale d’allure sémitique, ποιεῖν signifie mettre effectivement en œuvre. « Pratiquer » est naturel en français tout en conservant la portée éthique du participe.
- source_word: ἔλεος
  choice: la miséricorde
  rationale: ἔλεος exprime la compassion bienveillante ou la miséricorde ; « miséricorde » en maintient la force morale et religieuse.
- source_word: ἀλήθειαν
  choice: la vérité
  rationale: « Vérité » est le sens direct de ἀλήθεια et préserve le parallélisme traditionnel « miséricorde et vérité », sans exclure la nuance de fidélité.
theological_decisions:
- issue: Maintien de la forme masculine de υἱοὶ τῆς διαθήκης
  choice: les fils de l’alliance
  alternative: les enfants de l’alliance / le peuple de l’alliance
  rationale: Le grec emploie explicitement le masculin pluriel dans une expression identitaire. La traduction le conserve sans neutraliser la formulation.
- issue: Interprétation de la paire ἔλεος καὶ ἀλήθειαν
  choice: la miséricorde et la vérité
  alternative: la miséricorde et la fidélité
  rationale: La paire peut refléter une expression sémitique à portée éthique et relationnelle. Le texte principal garde les équivalents directs, tandis que la note signale la nuance possible de fidélité.
- issue: Portée de ἐπεκρατοῦσαν dans le contexte
  choice: l’emportaient sur eux
  alternative: dominaient sur eux / les surpassaient
  rationale: La formulation retenue préserve l’idée d’une supériorité ou d’un avantage sans trancher entre comparaison morale et domination effective.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe a été légèrement réordonnée pour rendre naturellement la double indication grecque « parmi eux, à Jérusalem », tout en conservant son insistance. Le vocabulaire de l’alliance et la tension entre « vérité » et « fidélité » sont maintenus.
