  verdict: revise
  source_fidelity: Le texte rend correctement l’image des sources dont l’origine est indiquée par « des profondeurs » et « des hautes montagnes », ainsi que la généralisation sociale allant du dirigeant au plus humble. « Furent retenues » correspond bien au passif συνεσχέθησαν. La note b, toutefois, présente une citation dite littérale qui omet la reprise implicite de la préposition devant le second membre et ne reflète pas exactement le génitif grec.
  naturalness: Le français est moderne, clair et conserve un registre poétique approprié. « Tous vivaient dans toutes sortes de péchés » est naturel, même si « vivaient » explicite la copule sous-entendue du grec sans modifier sensiblement le sens.
  terminology: « Sources », « éternelles », « justice et le droit », « chef » et « le plus petit du peuple » sont des choix recevables. « Éternelles » conserve la force poétique de αἰώνιοι; l’alternative ancienne/durable est utilement signalée. La paire « justice et droit » distingue de façon acceptable δικαιοσύνη et κρίμα sans imposer une lecture doctrinale.
