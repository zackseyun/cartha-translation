base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: fr
  text: Les sources éternelles[a], issues des profondeurs et des hautes montagnes, furent retenues, parce qu’il n’y avait parmi eux personne qui pratique la justice et le droit. Depuis leur chef jusqu’au plus petit du peuple[b], tous vivaient dans toutes sortes de péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « antiques » ou « qui coulent depuis toujours ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de leur chef et du plus petit de leur peuple » ; la tournure exprime vraisemblablement l’ensemble de la population, du plus grand au plus petit.'
    reason: source_syntax
lexical_decisions:
- source_word: πηγαὶ
  choice: sources
  rationale: Le nom désigne ici des sources naturelles d’eau. « Sources » est le terme français courant et convient au registre poétique.
- source_word: συνεσχέθησαν
  choice: furent retenues
  rationale: Le passif exprime le fait d’être contenu ou empêché de couler, sans préciser davantage le mécanisme.
- source_word: αἰώνιοι
  choice: éternelles
  rationale: « Éternelles » conserve la portée poétique et temporelle forte de l’adjectif, tout en laissant en note la possibilité du sens « antiques » ou « depuis toujours ».
- source_word: ἐξ ἀβύσσων, ἀπὸ ὀρέων ὑψηλῶν
  choice: issues des profondeurs et des hautes montagnes
  rationale: « Issues de » indique clairement que les compléments désignent l’origine des sources, et non ce dont elles auraient été séparées ou empêchées de s’approcher.
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: qui pratique la justice et le droit
  rationale: Cette formulation garde le caractère actif du participe et distingue les deux termes de la paire éthique et judiciaire.
- source_word: ἄρχοντος
  choice: chef
  rationale: « Chef » rend largement l’idée d’une personne qui gouverne, sans imposer un titre politique plus précis.
- source_word: ἐλαχίστου
  choice: le plus petit
  rationale: L’expression marque le degré social le plus bas et forme en français un contraste naturel avec « chef ».
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: dans toutes sortes de péchés
  rationale: Cette tournure française exprime naturellement la portée globale de la formule grecque.
theological_decisions:
- issue: Distinction entre δικαιοσύνη et κρίμα dans un texte juif non paulinien
  choice: la justice et le droit
  alternative: la justice et le jugement
  rationale: « Justice » exprime ici la conduite droite, tandis que « droit » conserve la dimension normative et judiciaire de κρίμα sans donner l’impression qu’il s’agit seulement d’un verdict.
- issue: Portée temporelle de αἰώνιοι
  choice: éternelles
  alternative: antiques / depuis toujours
  rationale: Le contexte peut évoquer soit des sources durables, soit des sources très anciennes. Le texte principal garde le terme poétique fort sans transformer cette durée en affirmation philosophique explicite.
translation_notes:
  register: Français international moderne, poétique mais accessible. L’ordre des mots précise que les profondeurs et les montagnes sont l’origine des sources. La dernière proposition est légèrement explicitée par « tous vivaient » afin de rendre en français naturel la construction grecque abrupte.
