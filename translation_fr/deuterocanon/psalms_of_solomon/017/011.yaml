base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/011.yaml
  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: fr
  text: Dieu n’a pas eu pitié d’eux.[a] Il a recherché leurs descendants[b] et n’en a laissé aucun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne leur a pas fait miséricorde ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leur semence »; autre traduction possible : « leur postérité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλέησεν
  choice: a eu pitié
  rationale: Le verbe signifie ici « avoir pitié » ou « faire miséricorde ». « N’a pas eu pitié » exprime directement le refus de miséricorde et évite de le confondre avec φείδομαι, « épargner ».
- source_word: ἐξερεύνησεν
  choice: a recherché
  rationale: Le verbe évoque une recherche approfondie. Dans ce contexte de jugement, « a recherché » reste naturel tout en conservant l’idée d’une poursuite minutieuse.
- source_word: σπέρμα
  choice: descendants
  rationale: Bien que le sens littéral soit « semence », le mot désigne ici la postérité; « descendants » communique clairement ce sens familial en français moderne.
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: n’a laissé subsister aucun d’eux
  rationale: Cette formulation rend la totalité négative de l’expression grecque et précise naturellement en français que personne n’a été laissé en vie ou maintenu.
theological_decisions:
- issue: Portée de ἐλέησεν dans le contexte du jugement
  choice: n’a pas eu pitié d’eux
  alternative: ne les a pas épargnés
  rationale: Le choix maintient explicitement la notion de pitié ou de miséricorde portée par ἐλεέω, sans la remplacer par le vocabulaire distinct de l’action d’épargner.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve les deux affirmations successives du grec. « Laissé subsister » évite l’ambiguïté de « laissé aucun d’eux » et exprime naturellement l’idée d’une élimination totale.
