source:
  edition: lxx-swete-1909
  text: ἠρήμωσαν τὸν θρόνον Δαυὶδ ἐν ὑπερηφανίᾳ ἀλλάγματος. καὶ σύ, ὁ θεός, καταβαλεῖς αὐτούς, καὶ ἀρεῖς σπέρμα αὐτῶν ἀπὸ τῆς γῆς,
  language: Greek
  pages:
  - 806
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/008.yaml
  text: They laid waste the throne of David in arrogant usurpation[a]. But you, O God, will cast them down and remove their offspring from the earth[b],
translation:
  language: fr
  text: Ils ont dévasté le trône de David par une usurpation arrogante[a]. Mais toi, ô Dieu, tu les renverseras et tu feras disparaître leur descendance de la terre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans l’arrogance d’un changement » ou « d’un remplacement ». La formule grecque est condensée; « usurpation » en exprime le sens politique probable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσαν
  choice: ont dévasté
  rationale: Le verbe exprime l’action de rendre désert ou ruiné. « Ont dévasté » en conserve la force dans un français naturel.
- source_word: τὸν θρόνον Δαυὶδ
  choice: le trône de David
  rationale: Cette traduction directe maintient la portée royale et dynastique de l’expression.
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: par une usurpation arrogante
  rationale: ὑπερηφανία désigne l’orgueil ou l’arrogance, tandis que ἀλλάγματος évoque littéralement un changement, un échange ou un remplacement. Dans ce contexte dynastique, « usurpation » explicite le sens politique probable, tandis qu’une note préserve l’ambiguïté de la formule grecque.
- source_word: καταβαλεῖς
  choice: tu les renverseras
  rationale: Le futur grec décrit leur abaissement ou leur renversement décisif par Dieu.
- source_word: ἀρεῖς
  choice: tu feras disparaître
  rationale: αἴρω signifie enlever ou ôter. Avec « leur descendance » comme complément, cette formulation est idiomatique sans préciser indûment le mode du jugement.
- source_word: σπέρμα αὐτῶν
  choice: leur descendance
  rationale: « Descendance » rend clairement le sens générationnel de σπέρμα en français moderne.
- source_word: ἀπὸ τῆς γῆς
  choice: de la terre
  rationale: γῆ peut désigner soit la terre au sens large, soit un pays particulier. Le texte immédiat n’impose pas de restreindre le sens à un territoire.
theological_decisions:
- issue: Valeur temporelle de καταβαλεῖς et ἀρεῖς
  choice: 'futur : « tu les renverseras et tu feras disparaître »'
  alternative: 'passé narratif : « tu les as renversés et tu as fait disparaître »'
  rationale: Les deux formes grecques sont morphologiquement au futur. Même si le contexte historique peut inviter à comprendre ces actes comme déjà accomplis, le texte transmis formule ici l’action divine au futur; la traduction conserve donc cette tension au lieu de la résoudre par un changement de temps.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’adresse « ô Dieu » conserve la solennité de l’apostrophe grecque. Le contraste marqué par ἀλλά est rendu par « Mais ». La virgule finale est maintenue puisque le verset se poursuit syntaxiquement.
