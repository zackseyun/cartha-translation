lexical_decisions:
- source_word: εὐλογία
  choice: bénédiction
  rationale: Le nom désigne ici directement une bénédiction; « bénédiction » est l’équivalent français le plus transparent.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le génitif exprime l’origine ou l’appartenance de la bénédiction; « du Seigneur » rend naturellement la construction grecque.
- source_word: μετʼ αὐτοῦ
  choice: avec lui
  rationale: μετά suivi du génitif signifie normalement « avec »; cette formulation conserve le sens relationnel sans l’interpréter davantage.
- source_word: ἐν ἰσχύϊ
  choice: dans la force
  rationale: ἰσχύς désigne la force, la puissance ou la vigueur. « Dans la force » préserve la construction grecque et son ambiguïté quant au lien précis de l’expression avec le reste de la proposition.
- source_word: '[copule sous-entendue]'
  choice: est
  rationale: Le grec omet le verbe copule; le français exige normalement de l’expliciter.
theological_decisions:
- issue: Lien syntaxique de ἐν ἰσχύϊ
  choice: Maintenir l’expression « dans la force » sans préciser explicitement si elle caractérise la présence de la bénédiction ou la manière dont elle agit.
  alternative: « La puissante bénédiction du Seigneur est avec lui » ou « la bénédiction du Seigneur l’accompagne avec puissance ».
  rationale: Le grec permet une relation adverbiale ou qualitative qui n’est pas entièrement explicitée; une reformulation plus fluide trancherait indûment la question.
translation_notes:
  register: Français moderne, sobre et digne. La formulation légèrement marquée « dans la force » suit de près le grec afin de préserver son ambiguïté; la note fournit des équivalents plus idiomatiques.
