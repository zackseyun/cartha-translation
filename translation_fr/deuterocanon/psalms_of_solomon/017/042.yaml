  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: fr
  text: Et il ne faiblira pas durant ses jours, appuyé sur son Dieu[a], car Dieu l’a rendu puissant dans l’Esprit saint[b], et sage dans un conseil avisé, avec force et justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur son Dieu »; on peut aussi comprendre : « mettant sa confiance en son Dieu ».'
    reason: La construction ἐπί avec le datif exprime ici vraisemblablement l’appui ou la confiance, mais sa formulation reste concise en grec.
  - marker: b
    text: 'Ou : « par l’Esprit saint »; éventuellement : « dans un esprit saint ».'
    reason: La préposition ἐν peut indiquer le moyen ou la sphère, et le grec ne porte pas d’article devant « esprit saint ».
  - marker: c
    text: 'Ou : « droiture ».'
    reason: δικαιοσύνη peut désigner aussi bien la justice que la rectitude ou la droiture.
lexical_decisions:
- source_word: ἀσθενήσει
  choice: faiblira
  rationale: Le futur de ἀσθενέω exprime ici le fait de devenir faible ou de perdre ses forces. « Faiblira » restitue directement cette nuance en français naturel.
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: appuyé sur son Dieu
  rationale: Avec ἐπί suivi du datif, l’expression peut indiquer le fondement ou l’objet de la confiance. « Appuyé sur son Dieu » conserve l’image de l’appui tout en rendant la relation intelligible.
- source_word: κατηργάσατο
  choice: l’a rendu
  rationale: 'Dans cette construction avec un attribut de l’objet, le verbe indique le résultat produit par Dieu : il l’a rendu puissant.'
- source_word: δυνατὸν
  choice: puissant
  rationale: L’adjectif désigne la capacité et la force; « puissant » convient au portrait du dirigeant attendu.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: par l’Esprit saint
  rationale: ἐν peut marquer ici le moyen par lequel Dieu le rend puissant. La formulation française est naturelle, tandis qu’une note conserve les autres lectures possibles de la phrase grecque anarthre.
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: sage dans un conseil plein de discernement
  rationale: Le génitif συνέσεως caractérise le conseil. « Plein de discernement » évite le calque peu naturel « conseil de compréhension » sans dissocier les deux notions.
- source_word: ἰσχύος
  choice: force
  rationale: « Force » est l’équivalent français direct et s’accorde naturellement avec le dernier groupe prépositionnel.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans le portrait d’un roi ou dirigeant, δικαιοσύνη évoque particulièrement l’exercice juste du pouvoir. « Droiture » demeure possible et figure en note.
theological_decisions:
- issue: La référence de πνεύματι ἁγίῳ et la valeur de ἐν
  choice: par l’Esprit saint
  alternative: dans l’Esprit saint; dans un esprit saint
  rationale: Le contexte d’une puissance donnée par Dieu favorise une référence à l’Esprit saint et une valeur instrumentale de ἐν. Cependant, l’absence d’article et la souplesse de la préposition permettent aussi une lecture de sphère, voire une lecture qualitative; la note préserve cette tension.
- issue: La nuance de δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: Le contexte du gouvernement messianique favorise « justice », mais le terme grec peut aussi désigner la rectitude personnelle; aucune opposition artificielle n’est imposée entre ces nuances.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure cumulative du grec sans reproduire ses tours les moins naturels. « Esprit saint » est traité comme une désignation définie dans le texte principal, tout en maintenant en note l’ambiguïté grammaticale réelle.
