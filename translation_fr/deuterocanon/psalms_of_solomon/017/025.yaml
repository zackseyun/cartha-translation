  source_fidelity: Le texte rend fidèlement l’impératif καθάρισον (« purifie »), l’objet Ἰερουσαλήμ, l’éloignement ἀπὸ ἐθνῶν (« des nations »), le participe hostile καταπατούντων (« qui la foulent aux pieds ») et la portée destructive de ἐν ἀπωλείᾳ (« pour sa ruine »). Le placement initial de « Dans la sagesse et la justice » rattache de façon claire ces expressions à la demande de purification, conformément au choix suivi dans l’audit anglais, sans ajout doctrinal.
