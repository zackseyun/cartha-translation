base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/025.yaml
  text: In wisdom and righteousness[c][b][a], cleanse Jerusalem from nations trampling her in destruction.
translation:
  language: fr
  text: Dans la sagesse et la justice, purifie Jérusalem des nations[a] qui la foulent aux pieds pour sa ruine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des païens ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui la foulent aux pieds dans la destruction ». Le grec permet aussi de comprendre : « qui la foulent aux pieds de manière destructrice ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: καθάρισον
  choice: purifie
  rationale: L’impératif aoriste demande une action décisive. « Purifie » conserve la portée à la fois religieuse et civique du verbe grec.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française consacrée du nom de lieu.
- source_word: ἐθνῶν
  choice: nations
  rationale: Le terme désigne ici des peuples étrangers qui oppriment Jérusalem. « Nations » reste large et n’impose pas une lecture religieuse plus technique.
- source_word: καταπατούντων
  choice: qui la foulent aux pieds
  rationale: Cette expression française naturelle garde l’image forte d’un piétinement hostile et méprisant.
- source_word: ἐν ἀπωλείᾳ
  choice: pour sa ruine
  rationale: La formulation exprime naturellement l’effet ou l’aboutissement destructeur du piétinement, sans réduire ἀπώλεια à une simple détérioration.
- source_word: ἐν σοφίᾳ
  choice: dans la sagesse
  rationale: Le rendu assez formel préserve la manière ou le principe selon lequel la purification est demandée.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Dans ce contexte d’intervention contre des oppresseurs, « justice » rend naturellement δικαιοσύνη tout en conservant sa dimension morale.
theological_decisions:
- issue: 'Portée de ἐθνῶν : peuples étrangers au sens général ou « païens » au sens ethnoreligieux.'
  choice: nations
  alternative: païens
  rationale: « Nations » désigne adéquatement les peuples étrangers sans introduire un contraste religieux plus précis que ne l’exige le verset.
- issue: Rattachement de ἐν σοφίᾳ, ἐν δικαιοσύνῃ.
  choice: 'Les deux groupes qualifient principalement l’action demandée : « purifie » dans la sagesse et la justice.'
  alternative: Ils peuvent être entendus comme le principe ou la norme selon lesquels les nations sont jugées et écartées.
  rationale: Le placement initial évite de faire croire que les nations piétinent Jérusalem avec sagesse et justice, tout en laissant aux expressions leur portée générale.
- issue: Valeur de ἐν ἀπωλείᾳ.
  choice: 'Le groupe indique l’effet ou le but destructeur du piétinement : « pour sa ruine ».'
  alternative: « dans la destruction », formulation plus littérale mais moins naturelle et sémantiquement plus obscure en français.
  rationale: La préposition ἐν peut ici exprimer la circonstance, l’effet ou la sphère du geste hostile. Le français exige une relation plus explicite, signalée en note.
translation_notes:
  register: Français moderne, international et digne. L’ordre initial « Dans la sagesse et la justice » rattache clairement ces expressions à l’impératif. « Foulent aux pieds » maintient l’image vive du grec, tandis que les notes conservent les principales possibilités lexicales et syntaxiques.
