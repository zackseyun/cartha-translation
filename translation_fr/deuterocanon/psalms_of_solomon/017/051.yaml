  terminology: « Miséricorde », « délivrera », « impureté », « profanes » et « Seigneur » conviennent au contexte et à la terminologie source. « Pour toujours et à jamais » rend adéquatement l’intensification de εἰς τὸν αἰῶνα καὶ ἔτι.
