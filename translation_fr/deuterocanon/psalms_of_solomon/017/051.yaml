  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: fr
  text: Que Dieu se hâte de manifester sa miséricorde envers Israël[a] ! Il nous délivrera de l’impureté des ennemis profanes[b][c]. Le Seigneur lui-même est notre roi pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec commence par un infinitif, littéralement « hâter ». Il est compris ici comme l’expression d’un souhait ou d’une prière : « Que Dieu se hâte… »'
    reason: alternative_reading
  - marker: b
    text: Ou « de la souillure » au lieu de « de l’impureté ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ennemis impies » au lieu de « ennemis profanes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: se hâte de manifester
  rationale: L’infinitif initial exprime vraisemblablement un souhait ou une prière pressante. Cette tournure française conserve l’urgence tout en donnant à « miséricorde » un verbe naturel.
- source_word: ἔλεος
  choice: miséricorde
  rationale: « Miséricorde » rend directement la faveur compatissante de Dieu, dans un registre biblique digne mais encore courant.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Le futur exprime une assurance de délivrance. « Délivrer » convient naturellement au fait d’arracher le peuple à une situation hostile.
- source_word: ἀκαθαρσίας
  choice: impureté
  rationale: Le terme peut évoquer à la fois l’impureté et la souillure, avec des résonances cultuelles et morales. « Impureté » préserve cette amplitude.
- source_word: βεβήλων
  choice: profanes
  rationale: Le mot désigne ce qui est non sacré, irrévérencieux ou impie. « Profanes » maintient son lien avec le vocabulaire de l’impureté sans préciser abusivement le type d’impiété.
- source_word: Κύριος
  choice: Seigneur
  rationale: Ici, le titre désigne Dieu comme le véritable souverain d’Israël ; « Seigneur » est la traduction française établie et appropriée.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: pour toujours et à jamais
  rationale: Cette formulation rend l’intensification de la durée exprimée par « pour l’âge et encore », plutôt que de réduire la phrase à un simple « toujours ».
theological_decisions:
- issue: Valeur de l’infinitif initial ταχύναι
  choice: 'Souhait ou prière : « Que Dieu se hâte… ! »'
  alternative: Infinitif plus littéral (« à Dieu de hâter… ») ou déclaration (« Dieu hâte… »)
  rationale: L’infinitif isolé en tête de phrase se comprend le mieux comme une exclamation optative. La traduction conserve néanmoins cette particularité dans une note afin de ne pas masquer l’ambiguïté grammaticale.
- issue: Rapport entre ἀκαθαρσίας et ἐχθρῶν βεβήλων
  choice: « de l’impureté de nos ennemis profanes »
  alternative: « de la souillure causée par des ennemis impies »
  rationale: Le génitif grec permet de comprendre l’impureté comme celle qui caractérise les ennemis ou comme la souillure qu’ils produisent. Le texte principal garde la construction génitive sans trancher explicitement.
translation_notes:
  register: Français international moderne, clair et digne. L’exclamation initiale restitue le ton de prière ; « miséricorde », « délivrera » et « Seigneur » conservent un registre biblique accessible. Les marqueurs [b][c] suivent immédiatement les expressions qu’ils documentent.
