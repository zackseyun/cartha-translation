  yaml_path: translation/deuterocanon/psalms_of_solomon/017/045.yaml
  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
translation:
  language: fr
  text: Faisant paître le troupeau du Seigneur avec fidélité[a] et justice[b], il ne laissera aucun d’eux s’affaiblir dans leur pâturage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec foi »; le grec πίστις peut désigner la foi ou la fidélité.
    reason: lexical_alternative
  - marker: b
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμαίνων
  choice: Faisant paître
  rationale: Le participe présent conserve la forme du grec et prolonge la métaphore du berger, qui comprend ici à la fois le soin et la conduite du troupeau.
- source_word: τὸ ποίμνιον Κυρίου
  choice: le troupeau du Seigneur
  rationale: « Troupeau » rend naturellement le groupe placé sous la conduite du berger, tandis que le génitif Κυρίου marque son appartenance au Seigneur.
- source_word: ἐν πίστει
  choice: avec fidélité
  rationale: Dans ce contexte décrivant la manière dont le berger gouverne, πίστις évoque plus naturellement la fidélité fiable que l’acte de croire, sans exclure entièrement ce dernier sens.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » exprime ici la droiture concrète avec laquelle le dirigeant exerce sa charge; « droiture » demeure une possibilité.
- source_word: οὐκ ἀφήσει ἀσθενῆσαι
  choice: il ne laissera … s’affaiblir
  rationale: La construction avec ἀφήσει suivi de l’infinitif exprime la non-permission ou la prévention; « s’affaiblir » rend l’entrée dans un état de faiblesse.
- source_word: ἐν αὐτοῖς
  choice: aucun d’eux
  rationale: Le grec dit littéralement « en/parmi eux »; en français, la tournure distributive « aucun d’eux » transmet clairement qu’aucun membre du troupeau ne sera laissé dans la faiblesse.
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: dans leur pâturage
  rationale: « Pâturage » maintient l’image pastorale de ποιμαίνων et ποίμνιον et peut désigner le lieu ou l’activité de paître.
theological_decisions:
- issue: Valeur de πίστει dans la conduite du berger
  choice: fidélité
  alternative: foi
  rationale: Le datif qualifie vraisemblablement la manière de conduire le troupeau. « Fidélité » convient donc mieux au comportement du berger, mais la polysémie du terme grec est signalée en note.
- issue: Rapport du participe ποιμαίνων avec le futur ἀφήσει
  choice: 'participe circonstanciel : « Faisant paître…, il ne laissera… »'
  alternative: 'coordination à valeur future : « Il fera paître…, et il ne laissera… »'
  rationale: La traduction retient la forme participiale explicite du grec sans effacer la portée prophétique donnée par le futur principal. La coordination de saveur sémitique permet toutefois l’autre analyse, qui reste légitime.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore pastorale est maintenue dans « faisant paître », « troupeau » et « pâturage ». Le participe initial suit de près le grec, tandis que la phrase demeure intelligible comme description prophétique de l’action du berger.
