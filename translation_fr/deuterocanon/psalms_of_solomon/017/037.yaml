  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
translation:
  language: fr
  text: Car il ne mettra pas son espérance dans le cheval, le cavalier ou l’arc ; il n’amassera pour lui ni or ni argent en vue de la guerre, et il ne puisera pas ses espoirs dans le grand nombre pour le jour du combat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la dernière proposition peut se rendre ainsi : « et, avec beaucoup, il ne rassemblera pas d’espoirs pour le jour de la guerre ». Le grec semble évoquer le fait de compter sur le grand nombre ou sur une force nombreuse.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: mettra son espérance […] dans
  rationale: Cette formulation conserve le sens premier d’« espérer » tout en exprimant naturellement l’idée de compter sur des moyens militaires.
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: ni dans le cheval, ni dans le cavalier, ni dans l’arc
  rationale: Les trois réalités militaires concrètes sont conservées. Après une négation, la coordination par « ni » est naturelle en français.
- source_word: πληθυνεῖ αὐτῷ
  choice: amassera pour lui
  rationale: Le verbe signifie rendre nombreux ou multiplier. Avec l’or et l’argent, « amasser » exprime idiomatiquement l’accumulation, tandis que « pour lui » rend le datif αὐτῷ.
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: ni or ni argent
  rationale: Le texte nomme les métaux précieux et les coordonne négativement; leur caractère concret est préservé.
- source_word: εἰς πόλεμον
  choice: en vue de la guerre
  rationale: La préposition indique ici la destination ou le but de cette accumulation.
- source_word: πολλοῖς οὐ συνάξει ἐλπίδας
  choice: il ne puisera pas ses espoirs dans le grand nombre
  rationale: L’expression grecque, littéralement proche de « il ne rassemblera pas des espoirs par/avec beaucoup », est comprimée. Cette traduction française restitue l’idée de tirer son assurance de la supériorité numérique sans identifier trop précisément ceux qui composent ce grand nombre.
- source_word: εἰς ἡμέραν πολέμου
  choice: pour le jour du combat
  rationale: « Jour du combat » rend naturellement le moment concret de l’affrontement envisagé par l’expression grecque.
