  text: And everything that he did in Jerusalem was just as the nations do to their gods in their cities[a][b].
translation:
  language: fr
  text: Et tout ce qu’il a fait à Jérusalem était semblable à ce que les nations font à leurs dieux dans leurs villes[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La comparaison est elliptique en grec ; on pourrait aussi comprendre : « comme les nations le font avec leurs dieux dans leurs villes ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « les non-Juifs » au lieu de « les nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Cette tournure française naturelle conserve la portée globale et relative de l’expression grecque.
- source_word: ἐποίησεν
  choice: a fait
  rationale: Le verbe grec est très général. « A fait » en préserve l’étendue sans préciser indûment la nature des actes.
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: En français courant, « à Jérusalem » est la formulation locative habituelle pour une ville.
- source_word: καθὼς καὶ
  choice: était semblable à ce que… font
  rationale: La comparaison grecque est elliptique. Cette formulation rend explicite le lien nécessaire en français tout en conservant l’idée de correspondance.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: « Les nations » rend directement le grec et convient à cette comparaison générale, sans imposer au texte une opposition religieuse plus marquée.
- source_word: ἐν ταῖς πόλεσι
  choice: dans leurs villes
  rationale: Le possessif, implicite en grec, est naturellement fourni en français d’après le contexte et le parallélisme entre Jérusalem et les villes des nations.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: leurs dieux
  rationale: Cette traduction suit exactement le lexique grec et évite de substituer l’interprétation « idoles » au terme employé.
