  yaml_path: translation/deuterocanon/psalms_of_solomon/017/003.yaml
  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: fr
  text: Mais nous, nous espérerons en Dieu, notre sauveur, car la domination de notre Dieu est pour toujours, avec miséricorde, et le règne de notre Dieu est pour toujours sur les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: nous mettrons notre espérance en
  rationale: Le futur grec et la construction avec ἐπί expriment une confiance placée en Dieu; cette tournure est naturelle et digne en français.
- source_word: σωτῆρα ἡμῶν
  choice: notre sauveur
  rationale: Rend directement le substantif σωτήρ et le possessif, sans ajouter de titre confessionnel.
- source_word: τὸ κράτος
  choice: la puissance
  rationale: κράτος désigne ici la force souveraine ou la domination effective; «puissance» conserve cette portée sans alourdir la phrase.
- source_word: μετʼ ἐλέους
  choice: accompagnée de miséricorde
  rationale: Rend explicitement μετά avec le génitif («avec») tout en indiquant que la puissance divine s’exerce conjointement à la miséricorde.
- source_word: ἡ βασιλεία
  choice: le règne
  rationale: Dans ce contexte, βασιλεία désigne l’exercice de la royauté divine plutôt qu’un territoire.
- source_word: ἐπὶ τὰ ἔθνη
  choice: sur les nations
  rationale: Traduction directe de la souveraineté exercée sur les peuples non spécifiés.
theological_decisions:
- issue: Rapport entre la puissance divine et la miséricorde
  choice: la puissance de notre Dieu demeure pour toujours, accompagnée de miséricorde
  alternative: la domination de notre Dieu est éternelle dans la miséricorde
  rationale: La formulation retenue préserve la coordination exprimée par μετʼ sans transformer celle-ci en définition théologique ni préciser indûment la manière dont puissance et miséricorde s’articulent.
- issue: Portée de la royauté divine
  choice: le règne de notre Dieu s’étend pour toujours sur les nations
  alternative: le royaume de notre Dieu est pour toujours au-dessus des nations
  rationale: «Règne» exprime ici la souveraineté active et «sur» conserve la portée de ἐπί, sans imposer une lecture territoriale ou seulement comparative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le redoublement «Mais nous, nous…» reproduit l’emphase de ἡμεῖς δέ. La répétition de «notre Dieu» et de «pour toujours» est conservée pour respecter le parallélisme grec.
