  text: καὶ οὐκ ἀφήσει ἀδικίαν ἔτι μεῖναι ἐν αὐτῶν αὐληθῆναι ἐν, καὶ οὐ κατοικήσει τὰς ἄνθρωπος μετ’ αὐτῶν εἰδὼς κακίαν.
