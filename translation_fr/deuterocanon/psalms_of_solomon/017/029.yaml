  yaml_path: translation/deuterocanon/psalms_of_solomon/017/029.yaml
  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
translation:
  language: fr
  text: Et il ne laissera plus l’injustice subsister parmi eux[a], et personne qui connaît le mal n’habitera avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À cet endroit, le texte grec de ce témoin présente une formulation difficile autour de « parmi eux » ; le sens général reste toutefois clair : l’injustice ne subsistera plus au sein de la communauté.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  choice: ne laissera pas
  rationale: Avec l’infinitif μεῖναι, le futur de ἀφίημι exprime ici le refus de permettre à une situation de se prolonger.
- source_word: ἀδικίαν
  choice: l’injustice
  rationale: ἀδικία désigne ce qui est contraire à la justice et à la droiture. « Injustice » reste naturel en français moderne tout en conservant la portée morale et communautaire du passage.
- source_word: ἔτι
  choice: plus
  rationale: 'Dans cette proposition négative, ἔτι indique qu’un état antérieur prendra fin : l’injustice ne subsistera plus.'
- source_word: μεῖναι
  choice: subsister
  rationale: « Subsister » rend l’idée de demeurer ou de continuer d’exister et convient à l’injustice prise comme réalité présente dans la communauté.
- source_word: ἐν αὐτῶν
  choice: parmi eux
  rationale: La formulation grecque transmise est irrégulière, mais le contexte indique une présence au sein du groupe. « Parmi eux » préserve ce sens collectif sans tenter de reconstruire silencieusement le texte.
- source_word: κατοικήσει
  choice: n’habitera
  rationale: κατοικέω évoque une habitation établie. « Habiter » est clair, digne et moins archaïque que « demeurer » dans cet emploi.
- source_word: ἄνθρωπος
  choice: personne
  rationale: Le singulier ἄνθρωπος a ici une valeur générique. Avec la négation, « personne » l’exprime naturellement sans restriction de sexe.
- source_word: εἰδὼς κακίαν
  choice: qui connaît le mal
  rationale: La formulation conserve le lien direct entre le participe « connaître » et son objet, sans réduire cette connaissance à une simple information ni préciser au-delà du grec la nature de cette familiarité.
- source_word: κακίαν
  choice: le mal
  rationale: κακία désigne ici largement la perversité ou le mal moral, plutôt qu’une malveillance interpersonnelle particulière. « Le mal » garde cette amplitude.
theological_decisions:
- issue: Exclusion morale de la communauté restaurée
  choice: Le verset exclut à la fois l’injustice et toute personne qui connaît le mal de la vie au sein de la communauté.
  alternative: On pourrait employer « iniquité » et « méchanceté », ce qui donnerait une coloration morale et religieuse plus marquée.
  rationale: « Injustice » et « mal » conservent les deux dimensions du grec — la réalité mauvaise et la personne qui lui est associée — sans importer de catégorie doctrinale ultérieure. La formule « qui connaît le mal » maintient aussi l’ambiguïté quant au degré exact d’implication suggéré par « connaître ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du parallélisme grec, tandis que « personne » évite un masculin faussement restrictif. La note signale l’état irrégulier du texte sans imposer une reconstruction conjecturale.
