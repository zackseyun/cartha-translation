  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: fr
  text: Il n’y aura pas d’injustice parmi eux en son temps[a], car tous seront saints, et leur roi sera le Messie Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a pas d’injustice ». Dans ce contexte tourné vers l’avenir, le présent grec peut avoir une portée prophétique.'
    reason: ambiguïté temporelle
  - marker: b
    text: 'Autre compréhension possible : « le Messie, le Seigneur ». Le grec juxtapose « Messie » et « Seigneur » sans possessif explicite.'
    reason: lecture alternative
lexical_decisions:
- source_word: ἀδικία
  choice: injustice
  rationale: « Injustice » rend directement la faute morale et sociale absente de la communauté, sans réduire le terme à une simple infraction individuelle.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: de son temps
  rationale: Cette tournure française naturelle conserve la référence temporelle à l’époque du roi sans expliciter davantage qu’il s’agit de son règne.
- source_word: ἐν μέσῳ αὐτῶν
  choice: parmi eux
  rationale: « Parmi eux » exprime clairement la présence ou l’absence d’un phénomène au sein de la communauté.
- source_word: ἅγιοι
  choice: saints
  rationale: « Saints » est ici l’adjectif français direct pour désigner ceux qui sont consacrés à Dieu; il ne suppose pas le sens technique ultérieur d’un groupe canonisé.
- source_word: χριστός
  choice: Messie
  rationale: Le mot fonctionne comme un titre royal, celui de l’oint, dans ce contexte juif messianique.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français normal du titre κύριος; il est maintenu dans la séquence inhabituelle sans introduire de possessif absent du grec.
theological_decisions:
- issue: Valeur temporelle de ἔστιν dans un contexte prophétique futur
  choice: il n’y aura
  alternative: il n’y a
  rationale: Bien que ἔστιν soit morphologiquement au présent, le contexte décrit l’ère future du Messie. Le futur rend ce cadre temporel en français, tandis que le présent grec est signalé en note.
- issue: Interprétation de la séquence χριστὸς κύριος
  choice: le Messie Seigneur
  alternative: le Messie, le Seigneur; le Messie du Seigneur
  rationale: La formulation retenue conserve côte à côte les deux titres et l’ambiguïté du grec, qui ne comporte aucun génitif explicite. Les principales interprétations possibles sont données en note plutôt que tranchées dans le texte.
- issue: Verbe sous-entendu dans πάντες ἅγιοι
  choice: tous seront saints
  alternative: tous sont saints
  rationale: Le grec ne répète pas de copule. Le futur français rattache naturellement la proposition à l’époque future déjà exprimée, sans modifier l’affirmation selon laquelle tous sont saints dans cette communauté.
translation_notes:
  register: Français international moderne, clair et digne. « De son temps » évite l’archaïsme de « en ses jours » tout en conservant l’expression temporelle. La séquence volontairement inhabituelle « Messie Seigneur » préserve la tension du grec et est éclairée par une note.
