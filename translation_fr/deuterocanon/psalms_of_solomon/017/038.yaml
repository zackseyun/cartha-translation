revisions:
- from: Le Seigneur lui-même est leur roi[a] ; l’espérance du puissant est l’espérance en Dieu[b], et il fera miséricorde à toutes les nations qui se tiendront devant lui dans la crainte[c].
  to: Le Seigneur lui-même est leur roi[a] ; l’espérance du puissant est l’espérance en Dieu[b], et il fera miséricorde à toutes les nations devant lui, dans la crainte[c].
  rationale: La révision retire uniquement la relative « qui se tiendront », qui n’a pas d’équivalent verbal dans le grec et transforme une expression circonstancielle compacte en proposition future. Elle maintient l’ambiguïté syntaxique de « devant lui, dans la crainte », ainsi que l’ambiguïté du sujet de « il fera miséricorde ». Les notes conservent leurs ancres et signalent correctement la variante pronominale, la difficulté textuelle et l’alternative lexicale.
