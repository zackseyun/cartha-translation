base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: fr
  text: Le Seigneur lui-même est leur roi[a] ; l’espérance du puissant est l’espérance en Dieu[b], et il fera miséricorde à toutes les nations devant lui, dans la crainte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins lisent « son roi » au lieu de « leur roi » ; la phrase ferait alors plus directement du Seigneur le roi du dirigeant davidique.
    reason: textual_variant
  - marker: b
    text: 'Le grec transmis dans cette proposition est difficile et semble présenter une forme irrégulière ou une leçon incertaine. On pourrait aussi comprendre : « l’espérance du puissant en Dieu ».'
    reason: textual_variant
  - marker: c
    text: Ou « avec révérence » ; ici, la « crainte » peut exprimer aussi bien la peur que le respect mêlé d’émerveillement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: le Seigneur
  rationale: Dans ce contexte, le titre désigne Dieu comme souverain suprême ; « le Seigneur » est l’équivalent français traditionnel, clair et digne.
- source_word: βασιλεὺς αὐτῶν
  choice: leur roi
  rationale: Le texte de Swete porte le pronom pluriel αὐτῶν. La traduction principale le conserve sans l’harmoniser avec le dirigeant davidique évoqué dans le contexte.
- source_word: ἐλπὶς
  choice: l’espérance
  rationale: « Espérance » maintient la répétition du mot grec et son lien lexical avec le langage de l’espérance ailleurs dans le psaume.
- source_word: τοῦ δυνατοῦ
  choice: du puissant
  rationale: Le génitif singulier est rendu comme une désignation personnelle. « Du puissant » est naturel en français et évite de transformer l’expression en qualité abstraite.
- source_word: ἐλπὶθ θεοῦ
  choice: est l’espérance en Dieu
  rationale: La leçon transmise est irrégulière ou incertaine. Cette formulation traite l’ensemble comme une proposition nominale, conserve la répétition d’« espérance » et son orientation vers Dieu, sans dissimuler la difficulté sous une relative explicative.
- source_word: ἐλεήσει
  choice: fera miséricorde à
  rationale: Cette expression conserve la portée religieuse et relationnelle du verbe tout en restant intelligible en français moderne.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: « Nations » rend largement ἔθνη dans ce contexte royal, sans limiter le terme aux seuls non-Juifs.
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: qui se tiendront devant lui dans la crainte
  rationale: « Devant lui » préserve la dimension de présence, tandis que « dans la crainte » maintient l’ambivalence entre peur et respect révérenciel. L’ajout idiomatique « qui se tiendront » relie naturellement le groupe français à « toutes les nations ».
theological_decisions:
- issue: Rapport entre la royauté du Seigneur et celle du dirigeant davidique dans le contexte
  choice: Le Seigneur lui-même est leur roi
  alternative: Le Seigneur lui-même est son roi
  rationale: Le pluriel du texte de base présente le Seigneur comme le roi ultime du peuple, sans nier le rôle du dirigeant davidique. La variante au singulier, qui soulignerait plus directement la subordination de ce dirigeant à Dieu, est signalée en note.
- issue: Référent implicite du sujet de ἐλεήσει
  choice: Conserver le pronom « il » sans identifier explicitement son référent
  alternative: Répéter « le puissant » ou « le Seigneur »
  rationale: Le grec laisse le sujet dans l’implicite et le contexte peut susciter une tension entre l’action du Seigneur et celle du dirigeant puissant. La traduction ne tranche pas ce point en ajoutant un nom.
- issue: Valeur de φόβος devant le roi
  choice: dans la crainte
  alternative: avec révérence
  rationale: « Crainte » préserve à la fois la possibilité d’une peur réelle et celle d’une attitude de respect sacré, sans réduire le terme à une seule nuance.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forte coupure après la première proposition, préserve la répétition marquée d’« espérance » et ne résout ni l’irrégularité du texte grec ni l’ambiguïté du sujet de « fera miséricorde ».
