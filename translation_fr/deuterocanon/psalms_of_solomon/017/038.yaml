  verdict: revise
  source_fidelity: La première proposition et la proposition nominale difficile rendent correctement le grec transmis, sans résoudre indûment la leçon irrégulière ἐλπὶθ. En revanche, « qui se tiendront » introduit un verbe futur relatif absent du grec et impose aux nations l’action de se tenir, alors que ἐνώπιον αὐτοῦ ἐν φόβῳ demeure une suite circonstancielle concise dont le rattachement exact ne doit pas être davantage explicité.
  naturalness: Le français est globalement sobre et moderne. « Il fera miséricorde à » est recevable dans un registre scripturaire digne. La suppression de la relative ajoutée rend la fin à la fois plus fidèle et moins interprétative.
  terminology: « Le Seigneur », « leur roi », « espérance », « le puissant », « toutes les nations » et « crainte » sont des choix cohérents et adéquats. « Espérance en Dieu » conserve, autant que possible, la répétition et l’orientation vers Dieu du texte difficile.
