  yaml_path: translation/deuterocanon/psalms_of_solomon/017/044.yaml
  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: fr
  text: Son espérance dans le Seigneur ne faiblira pas ; et qui peut lui résister ? Il est fort dans ses œuvres et puissant dans la crainte de Dieu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: ne faiblira pas
  rationale: Le futur exprime l’affaiblissement ou la perte de force. Avec « espérance » pour sujet, « ne faiblira pas » conserve naturellement la métaphore en français.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: Son espérance dans le Seigneur
  rationale: La préposition marque une espérance orientée vers le Seigneur et fondée sur lui. « Espérance dans le Seigneur » est idiomatique et reste proche du grec.
- source_word: Κύριον
  choice: le Seigneur
  rationale: « Seigneur » est l’équivalent biblique naturel de κύριος dans ce contexte; l’article défini convient à la syntaxe française.
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: Qui pourra lui résister ?
  rationale: La tournure grecque concise a ici une valeur adversative. Cette formulation française rend la question rhétorique sans expliciter davantage l’issue de l’affrontement.
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: fort dans ses œuvres
  rationale: « Fort » rend ἰσχυρός, tandis que « œuvres » conserve l’étendue de ἔργα, qui peut désigner ses actes ou ses réalisations.
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: puissant dans la crainte de Dieu
  rationale: « Puissant » distingue κραταιός de l’adjectif précédent tout en gardant l’idée de force. « Crainte de Dieu » préserve l’expression biblique et sa tension entre peur, respect et révérence.
- source_word: '[copule sous-entendue]'
  choice: Il est
  rationale: Le grec juxtapose les adjectifs sans verbe exprimé. Le français exige naturellement ici un sujet et une copule explicites.
theological_decisions:
- issue: Sens de φόβος θεοῦ
  choice: la crainte de Dieu
  alternative: le respect de Dieu / la révérence envers Dieu
  rationale: La traduction retient l’expression biblique traditionnelle et sémantiquement plus large, sans réduire φόβος à la seule révérence ni l’interpréter comme simple terreur.
translation_notes:
  register: Français moderne, international et digne. La structure reste proche du grec, avec une ponctuation française fluide. La virgule finale est conservée parce que le verset fourni se poursuit syntaxiquement dans son contexte.
