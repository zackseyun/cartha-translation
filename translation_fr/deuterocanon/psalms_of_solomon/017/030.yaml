  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: fr
  text: 'Car il les reconnaîtra : ils sont tous fils de leur Dieu[a]. Il les répartira selon leurs tribus[b] dans le pays[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils de leur Dieu ». On peut aussi comprendre : « enfants de leur Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parmi leurs tribus ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sur la terre ». Le grec peut désigner soit un pays déterminé, soit la terre au sens large.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: il les reconnaîtra
  rationale: Le futur de γινώσκω exprime ici vraisemblablement la reconnaissance de leur identité, plutôt que la simple acquisition d’une information. « Reconnaître » convient aussi au contexte relationnel.
- source_word: υἱοὶ θεοῦ … αὐτῶν
  choice: fils de leur Dieu
  rationale: « Fils » conserve le masculin explicite de υἱοί et la portée possible d’un statut d’alliance. Le pronom αὐτῶν est rendu naturellement par le possessif « leur ».
- source_word: καταμερίσει
  choice: il les répartira
  rationale: Le verbe désigne une distribution en parts ou une attribution ordonnée. « Répartir » est naturel en français et convient à l’organisation tribale évoquée.
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: selon leurs tribus
  rationale: Cette formulation rend la valeur distributive probable de la préposition dans un contexte d’organisation par tribus, sans faire de celles-ci de simples lieux.
- source_word: ἐπὶ τῆς γῆς
  choice: dans le pays
  rationale: Dans ce contexte d’allotissement tribal, γῆ désigne probablement le territoire, c’est-à-dire le pays, plutôt que la terre entière. « Dans le pays » est plus idiomatique en français que « sur le pays ».
theological_decisions:
- issue: Portée de υἱοὶ θεοῦ
  choice: fils de leur Dieu
  alternative: enfants de leur Dieu
  rationale: Le texte grec dit littéralement « fils ». La traduction principale préserve cette formulation et sa possible dignité d’alliance, tandis que la note signale le français générique possible.
- issue: Valeur de ἐν ταῖς φυλαῖς αὐτῶν
  choice: selon leurs tribus
  alternative: parmi leurs tribus
  rationale: Le contexte favorise une répartition suivant l’ordre tribal, mais la construction grecque peut aussi se comprendre de façon plus locative. L’alternative est donc conservée en note.
- issue: Sens de γῆ
  choice: le pays
  alternative: la terre
  rationale: L’allotissement par tribus favorise le sens territorial, sans supprimer l’ambiguïté lexicale réelle de γῆ, qui peut aussi désigner la terre au sens large.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation en deux phrases évite une subordination lourde tout en conservant le lien logique introduit par γάρ. « Pays » privilégie le contexte territorial, avec l’autre sens de γῆ explicitement préservé en note.
