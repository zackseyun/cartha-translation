  source_fidelity: « Ses paroles » rend fidèlement οἱ λόγοι αὐτοῦ. La comparaison introduite par ὡς est conservée, et « celles des saints » représente naturellement λόγοι ἁγίων, où ἁγίων est substantivé sans que le texte n’en précise davantage le référent. « Au milieu de peuples sanctifiés » maintient ἐν μέσῳ et le pluriel de λαῶν, tandis que « sanctifiés » reflète adéquatement le participe parfait passif ἡγιασμένων.
  naturalness: La phrase est sobre, grammaticale et adaptée à un français moderne de registre biblique. L’emploi de « celles » évite une répétition lourde tout en gardant le parallèle intelligible. « Peuples sanctifiés », bien que soutenu, convient au genre et à la densité du grec.
  terminology: « Saints » restitue de façon établie et non surinterprétée l’adjectif substantivé ἁγίων. « Sanctifiés » préserve l’idée que les peuples ont été rendus saints, mieux que « saints » seul, et le pluriel est correctement respecté. Aucun terme n’impose une lecture confessionnelle ou une identification indue des saints.
