  yaml_path: translation/deuterocanon/psalms_of_solomon/017/049.yaml
  text: His words are like the words of holy ones in the midst of sanctified peoples.
translation:
  language: fr
  text: Ses paroles sont comme celles des saints au milieu de peuples sanctifiés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: Ses paroles
  rationale: « Paroles » rend directement λόγοι et convient à des propos prononcés, tout en permettant de conserver la reprise du même nom dans la comparaison.
- source_word: ὡς λόγοι ἁγίων
  choice: sont comme celles des saints
  rationale: ὡς exprime ici une comparaison. Le pronom « celles » reprend naturellement « paroles » en français, tandis que ἁγίων est compris substantivement comme désignant des personnes saintes.
- source_word: ἐν μέσῳ
  choice: au milieu de
  rationale: Cette expression suit de près le grec et conserve l'image d'une présence au sein d'un groupe.
- source_word: λαῶν ἡγιασμένων
  choice: peuples sanctifiés
  rationale: Le pluriel λαῶν est maintenu. Le participe parfait passif ἡγιασμένων indique des peuples qui ont été rendus saints ou consacrés; « sanctifiés » préserve cette valeur verbale.
theological_decisions:
- issue: Référent de ἁγίων
  choice: des saints
  alternative: des êtres saints / des consacrés
  rationale: Le grec emploie l'adjectif substantivé sans préciser l'identité de ces personnes. « Les saints » conserve cette indétermination sans ajouter de catégorie angélique, ecclésiale ou institutionnelle.
- issue: Valeur de ἡγιασμένων
  choice: sanctifiés
  alternative: consacrés / saints
  rationale: '« Sanctifiés » garde l''idée résultative du participe parfait passif: ces peuples ont été rendus saints, sans préciser par qui ni selon quel cadre rituel.'
translation_notes:
  register: Français moderne, sobre et digne. La répétition grecque de λόγοι est allégée par « celles », reprise idiomatique qui conserve clairement le sens. « Au milieu de » maintient la formulation spatiale du grec; « peuples » reste au pluriel malgré son caractère moins courant en français.
