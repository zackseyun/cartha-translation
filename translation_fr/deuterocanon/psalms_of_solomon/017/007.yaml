  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
translation:
  language: fr
  text: Et ils n’ont pas glorifié ton nom, digne d’honneur ; avec faste, ils ont établi un royaume à la place de leur propre élévation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation contextuelle : « à cause de leur orgueil ». Littéralement, le grec dit : « à la place de leur élévation » ; ὕψος peut désigner l’élévation, une position élevée ou, dans une lecture interprétative, l’orgueil.'
    reason: La note conserve l’alternative contextuelle attestée dans le dossier anglais, mais ne présente pas à tort ἀντί comme ayant par lui-même un sens causal dans ce texte.
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: ils n’ont pas glorifié
  rationale: « Glorifier » conserve le sens actif de δοξάζω, qui consiste à rendre gloire ou honneur, et convient naturellement à un nom divin.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: ton nom, digne d’honneur
  rationale: ἔντιμος qualifie ce qui est honoré, estimé ou précieux. « Digne d’honneur » est idiomatique en français et évite l’ambiguïté de « ton nom honoré », qui pourrait seulement décrire l’action d’autres personnes.
- source_word: ἐν δόξῃ
  choice: avec faste
  rationale: Dans ce contexte de mise en place d’un pouvoir royal illégitime, δόξα évoque la gloire visible, l’éclat ou la pompe. « Avec faste » exprime cette dimension sans attribuer aux usurpateurs la gloire divine.
- source_word: ἔθεντο
  choice: ils ont établi
  rationale: τίθημι signifie ici mettre en place ou instituer. « Établir » convient au complément politique « un royaume » et reste naturel en français.
- source_word: βασίλειον
  choice: un royaume
  rationale: Le substantif peut désigner un royaume, une royauté ou un établissement royal. « Un royaume » est le choix le plus direct et le moins interprétatif dans le contexte.
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: à la place de leur propre élévation
  rationale: Cette traduction suit le sens ordinaire de ἀντί avec le génitif et conserve le terme métaphorique ὕψος, « hauteur » ou « élévation ». Comme le grec est condensé et susceptible d’une autre analyse, une note signale la lecture causale « à cause de leur orgueil ».
theological_decisions:
- issue: Rapport entre le royaume établi et ὕψος αὐτῶν
  choice: à la place de leur propre élévation
  alternative: à cause de leur orgueil
  rationale: Le grec transmis permet de lire ἀντί dans son sens courant de substitution et ὕψος comme « élévation » ou « haute position ». La lecture causale avec le sens d’« orgueil » est contextuellement possible, mais elle dépend d’une interprétation plus poussée, éventuellement liée à un arrière-plan sémitique. L’ambiguïté est donc maintenue plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Avec faste » rend l’éclat royal de façon naturelle ; la seconde proposition demeure volontairement légèrement énigmatique, comme le grec source.
