  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: fr
  text: Toi, Seigneur, tu as choisi David comme roi sur Israël, et tu lui as juré, au sujet de sa descendance[a], pour toujours, que son royaume[b] ne disparaîtrait pas devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa semence », c’est-à-dire ses descendants.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa dynastie ne cesserait pas devant toi ».
    reason: alternative_reading
lexical_decisions:
- source_word: σύ, Κύριε
  choice: Toi, Seigneur
  rationale: Le pronom explicite σύ met Dieu en relief; « Toi, Seigneur » conserve cette insistance dans une adresse naturelle et solennelle.
- source_word: ᾑρέτισω
  choice: tu as choisi
  rationale: Le verbe exprime le choix de David par Dieu, sans exiger l’idée supplémentaire d’une cérémonie d’investiture.
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: comme roi sur Israël
  rationale: Cette formulation française rend naturellement la fonction royale et l’autorité exercée sur Israël.
- source_word: περὶ τοῦ σπέρματος
  choice: au sujet de sa descendance
  rationale: Dans ce contexte dynastique, σπέρμα désigne la lignée de David; « descendance » est clair et actuel, tandis que le sens littéral est signalé en note.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans le cadre d’un serment divin, l’expression indique une durée sans terme et se rend naturellement ainsi.
- source_word: τοῦ μὴ ἐκλείπειν
  choice: que … ne disparaîtrait pas
  rationale: L’infinitif exprime le contenu du serment et le verbe évoque ce qui ne vient pas à manquer ou à s’éteindre.
- source_word: ἀπέναντί σου
  choice: devant toi
  rationale: La traduction conserve l’image relationnelle et solennelle d’une royauté qui subsiste en présence de Dieu.
- source_word: βασίλειον αὐτοῦ
  choice: son royaume
  rationale: « Royaume » reste proche du substantif grec et laisse au contexte de la descendance sa portée dynastique, explicitée sans être imposée dans une note.
theological_decisions:
- issue: Nature et continuité de la promesse davidique
  choice: La promesse concerne la descendance de David et affirme que « son royaume ne disparaîtrait pas devant toi ».
  alternative: « Sa dynastie ne cesserait pas en ta présence. »
  rationale: Le grec associe explicitement la descendance (σπέρμα) au royaume (βασίλειον). Le texte principal préserve les deux images sans réduire le royaume à la seule dynastie ni effacer la portée dynastique du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre « Toi, Seigneur » conserve l’emphase du pronom grec; la phrase garde le parallélisme entre le choix de David et le serment divin.
