  yaml_path: translation/deuterocanon/psalms_of_solomon/017/018.yaml
  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: fr
  text: Ceux qui aimaient les assemblées des fidèles se sont enfuis loin d’eux ; comme des moineaux, ils se sont envolés de leur nid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : de leur lieu de repos.'
    reason: Le grec κοίτη peut désigner un endroit où l’on se couche ou se repose, et pas seulement un nid.
lexical_decisions:
- source_word: συναγωγὰς ὁσίων
  choice: les assemblées des fidèles
  rationale: « Assemblées » rend directement συναγωγάς sans lui donner ici le sens institutionnel moderne de « synagogues ». Dans ce contexte, ὅσιοι désigne les personnes attachées à Dieu ; « fidèles » est naturel en français et évite de surcharger le texte d’une terminologie canonique.
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  choice: se sont enfuis loin d’eux
  rationale: Cette formulation conserve le mouvement d’éloignement exprimé par ἀπό et laisse intact le référent contextuel du pronom masculin pluriel.
- source_word: στρουθία
  choice: moineaux
  rationale: Le diminutif pluriel désigne de petits oiseaux et peut couramment évoquer des moineaux ; ce choix maintient l’image vive et familière du grec.
- source_word: κοίτης αὐτῶν
  choice: leur nid
  rationale: κοίτη désigne littéralement un lieu où l’on se couche ou se repose. Dans la comparaison avec des oiseaux qui s’envolent, « nid » donne en français l’image naturelle, tandis qu’une note conserve le sens plus général du terme grec.
theological_decisions:
- issue: Sens de ὁσίων
  choice: fidèles
  alternative: saints
  rationale: Le grec qualifie ici ceux qui sont pieux ou loyaux envers Dieu. « Fidèles » exprime cette relation sans décider que le terme constitue un titre technique ou une catégorie doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme et l’image des oiseaux sont conservés, de même que l’ambiguïté du pronom « eux ».
