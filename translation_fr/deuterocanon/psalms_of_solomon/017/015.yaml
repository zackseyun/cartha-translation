base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/015.yaml
  text: The enemy acted in estrangement[a], in pride[c][b]; and his heart was estranged from our God.
translation:
  language: fr
  text: L’ennemi a agi en étranger[a], avec orgueil ; et son cœur était étranger à notre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’éloignement » ; le terme peut évoquer aussi bien la condition de celui qui est étranger qu’une séparation relationnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « son cœur était éloigné de notre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: en étranger
  rationale: Cette tournure rend l’idée d’altérité ou de condition étrangère et demeure naturelle en français. Elle convient au parallélisme avec ἀλλοτρία, sans exclure entièrement la nuance relationnelle d’éloignement.
- source_word: ὁ ἐχθρός
  choice: l’ennemi
  rationale: Équivalent français direct, courant et adapté au registre biblique.
- source_word: ἐποίησεν
  choice: a agi
  rationale: Le verbe est employé sans complément d’objet exprimé ; « a agi » rend clairement cette conduite sans ajouter un acte précis.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec orgueil
  rationale: Expression française naturelle qui conserve la valeur négative d’arrogance et d’élévation de soi.
- source_word: ἡ καρδία
  choice: son cœur
  rationale: Rendu biblique usuel de l’être intérieur, de ses dispositions et de sa volonté.
- source_word: ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: était étranger à notre Dieu
  rationale: Conserve l’image de ce qui est étranger ou extérieur à Dieu et reprend le champ lexical de la première proposition. Le masculin « étranger » s’accorde ici avec « cœur ».
theological_decisions:
- issue: L’altérité de l’ennemi désigne-t-elle son statut d’étranger ou son éloignement relationnel de Dieu ?
  choice: Le texte principal emploie « étranger », qui privilégie l’altérité sans affirmer une ancienne relation rompue.
  alternative: « dans l’éloignement » / « éloigné de notre Dieu »
  rationale: ἀλλοτριότης et ἀλλότριος peuvent exprimer la qualité de ce qui est étranger aussi bien qu’une aliénation relationnelle. Le contexte peut viser un ennemi étranger, tandis que le parallélisme avec le cœur permet aussi une lecture morale ; une note préserve cette ambiguïté.
translation_notes:
  register: 'Français international moderne, sobre et digne. La répétition d’« étranger » est intentionnelle : elle reproduit le lien lexical entre ἀλλοτριότητι et ἀλλοτρία. La ponctuation conserve les deux compléments grecs de la première proposition, puis la proposition coordonnée.'
