base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/046.yaml
  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
translation:
  language: fr
  text: Il les conduira tous avec équité, et il n’y aura parmi eux aucune arrogance qui fasse que l’un d’eux soit opprimé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la fin de la phrase se lit approximativement : « et il n’y aura pas parmi eux d’arrogance d’être opprimé parmi eux ». L’infinitif grec est passif et la construction est difficile. On peut aussi comprendre : « aucune arrogance qui pousse les uns à opprimer les autres ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: avec équité
  rationale: ἰσότης peut désigner l’égalité ou un traitement équitable. Dans le contexte de la conduite d’un peuple, « avec équité » exprime naturellement une direction impartiale et juste.
- source_word: πάντας αὐτοὺς
  choice: les… tous
  rationale: Cette tournure conserve la portée globale et emphatique du grec dans un français idiomatique.
- source_word: ἄξει
  choice: conduira
  rationale: ἄγω signifie couramment « conduire » ou « mener ». « Conduira » convient au contexte du chef qui guide son peuple.
- source_word: ὑπερηφανία
  choice: arrogance
  rationale: Le terme désigne un orgueil hautain et dominateur. « Arrogance » rend clairement cette dimension sociale en français contemporain.
- source_word: τοῦ καταδυναστευθῆναι
  choice: qui fasse que l’un d’eux soit opprimé
  rationale: L’infinitif grec est formellement passif. Cette formulation française maintient le passif et présente l’oppression comme la conséquence de l’arrogance, sans masquer la difficulté syntaxique du texte.
- source_word: ἐν αὐτοῖς
  choice: parmi eux / l’un d’eux
  rationale: Le premier emploi est rendu directement par « parmi eux » ; dans la proposition finale, « l’un d’eux » restitue naturellement la référence interne au groupe sans répétition pesante.
theological_decisions:
- issue: Caractère social du règne du chef
  choice: Le chef conduit tout le peuple avec équité, sans qu’une arrogance interne aboutisse à l’oppression de l’un de ses membres.
  alternative: Comprendre la phrase comme une affirmation abstraite d’égalité, ou convertir directement le passif grec en « opprimer les uns les autres ».
  rationale: La traduction conserve la vision éthique et sociale du passage tout en respectant la forme passive difficile du grec, sans ajouter une conception politique ou confessionnelle étrangère au verset.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste accessible tout en conservant, dans le texte et la note, la tension créée par l’infinitif passif grec.
