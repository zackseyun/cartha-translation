  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: fr
  text: Et il rassemblera un peuple saint, qu’il conduira dans la justice[a] ; il jugera[b] les tribus d’un peuple rendu saint par le Seigneur, son Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la droiture ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte royal, « juger » peut aussi avoir le sens plus large de « gouverner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάξει
  choice: il rassemblera
  rationale: Le verbe exprime directement l’action de réunir un peuple ; « rassemblera » est naturel et conserve le futur.
- source_word: λαὸν ἅγιον
  choice: un peuple saint
  rationale: Cette formulation garde la portée religieuse et collective de ἅγιος sans technicité inutile.
- source_word: ἀφήγήσεται
  choice: il conduira
  rationale: Le verbe signifie ici mener ou guider ; « conduira » convient naturellement à la conduite d’un peuple.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Dans ce contexte de conduite et de jugement royal, « justice » rend naturellement δικαιοσύνη tout en conservant sa portée morale.
- source_word: κρινεῖ
  choice: il jugera
  rationale: « Jugera » préserve le sens premier du verbe, sans exclure sa nuance plus large de gouvernement en contexte royal.
- source_word: φυλὰς λαοῦ ἡγιασμένου
  choice: les tribus d’un peuple rendu saint
  rationale: Le génitif singulier ἡγιασμένου se rapporte à λαοῦ, non aux tribus. « Rendu saint » conserve la valeur passive et résultative du parfait ; l’indéfini reflète l’absence d’article et le parallèle avec « un peuple saint ».
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: par le Seigneur son Dieu
  rationale: La formulation préserve l’agent divin et la relation personnelle exprimée par αὐτοῦ dans un français idiomatique.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: dans la justice
  alternative: dans la droiture
  rationale: « Justice » convient particulièrement au cadre royal et judiciaire, tandis que « droiture » reste une lecture possible de la qualité morale exprimée.
- issue: Portée de κρινεῖ
  choice: il jugera
  alternative: il gouvernera
  rationale: Le sens judiciaire de base est maintenu dans le texte ; la fonction royale peut toutefois élargir le terme au gouvernement.
- issue: Référent de ἡγιασμένου
  choice: un peuple rendu saint
  alternative: le peuple sanctifié
  rationale: Le participe passif génitif singulier qualifie « peuple » et indique que Dieu l’a rendu saint. La solution retenue préserve aussi le parallélisme avec « un peuple saint ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve les deux propositions parallèles du grec. « Rendu saint » est préféré à « sanctifié » pour rester accessible tout en exprimant clairement l’action divine accomplie.
