  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: fr
  text: Dans nos péchés, des pécheurs se sont dressés contre nous ; ils nous ont attaqués et chassés. Ceux à qui tu ne l’avais pas promis l’ont pris de force.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec laisse inexprimé l’objet de « tu avais promis » et de « ils ont pris » ; le pronom « l’ » le représente sans l’identifier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: Dans nos péchés
  rationale: La formulation conserve le lien énigmatique établi par le grec entre les péchés du peuple et le soulèvement de ses adversaires, sans préciser davantage la relation causale.
- source_word: ἐπανέστησαν ἡμῖν
  choice: se sont dressés contre nous
  rationale: Le verbe exprime ici un soulèvement hostile. Cette tournure française en garde la force sans imposer le sens plus spécifique de « se révolter ».
- source_word: ἐπέθεντο ἡμῖν
  choice: ils nous ont attaqués
  rationale: Dans cette suite d’actes hostiles, le moyen grec signifie naturellement qu’ils se sont jetés sur le peuple ou l’ont attaqué.
- source_word: ἐξώσαντο ἡμᾶς
  choice: et chassés
  rationale: 'Le verbe indique une expulsion forcée. Le complément « nous » est mis en facteur avec le verbe précédent pour obtenir un français fluide : « ils nous ont attaqués et chassés ».'
- source_word: οἷς οὐκ ἐπηγγείλω
  choice: Ceux à qui tu ne l’avais pas promis
  rationale: 'οἷς est un relatif masculin pluriel renvoyant aux pécheurs, tandis que ἐπηγγείλω est une deuxième personne du singulier : le texte s’adresse donc à Dieu. Le plus-que-parfait situe naturellement la promesse antérieurement à la prise.'
- source_word: μετὰ βίας ἀφείλαντο
  choice: l’ont pris de force
  rationale: La locution μετὰ βίας marque la contrainte. Le verbe signifie prendre ou enlever ; le pronom « l’ », nécessaire à la fluidité en français, représente l’objet que le grec laisse inexprimé.
theological_decisions:
- issue: Identité du sujet de « tu ne l’avais pas promis »
  choice: Conserver la deuxième personne du singulier et l’adresse directe à Dieu
  alternative: Employer une tournure passive telle que « cela ne leur avait pas été promis »
  rationale: ἐπηγγείλω est une forme de deuxième personne du singulier et prolonge l’adresse à Dieu du contexte. Une tournure passive effacerait ce trait grammatical.
- issue: Objet de la promesse et de la prise violente
  choice: Employer le pronom neutre « l’ » sans nommer son référent, avec une note
  alternative: Préciser « le royaume », « l’héritage » ou un autre objet
  rationale: Le grec n’exprime pas l’objet. Le français exige ici un appui pronominal pour rester naturel, mais aucun nom interprétatif ne doit être ajouté.
- issue: Sens de « dans nos péchés »
  choice: Maintenir la préposition et l’ambiguïté de la relation
  alternative: Expliciter « à cause de nos péchés » ou « pendant que nous péchions »
  rationale: ἐν peut prendre selon le contexte une valeur circonstancielle ou causale. La traduction littérale et intelligible « dans nos péchés » préserve cette tension.
translation_notes:
  register: 'Français moderne, courant et digne. Le rythme en deux phrases conserve la progression du grec : soulèvement, attaque, expulsion, puis prise violente. L’adresse à Dieu reste au tutoiement, conformément au contexte poétique et à la deuxième personne du singulier du texte grec.'
