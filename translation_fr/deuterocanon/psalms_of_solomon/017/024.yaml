translation:
  language: fr
  text: Et élève-le avec puissance, pour briser les dirigeants injustes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « élève-le en puissance » ou « exalte-le puissamment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώσον
  choice: élève-le
  rationale: L’impératif de ὑψόω exprime ici l’action d’élever ou d’exalter la figure attendue. « Élève-le » conserve concrètement ce mouvement sans imposer une interprétation plus précise.
- source_word: ἰσχὺν
  choice: avec puissance
  rationale: L’accusatif peut exprimer la manière ou la caractérisation. « Avec puissance » est naturel en français tout en laissant ouverte la nuance entre élévation puissante et attribution de puissance.
- source_word: θραῦσαι
  choice: pour briser
  rationale: L’infinitif a une valeur de but. « Briser » rend la force destructive du verbe sans ajouter une image étrangère au texte.
- source_word: ἄρχοντας
  choice: les dirigeants
  rationale: Le terme désigne des personnes exerçant l’autorité. « Dirigeants » est actuel, clair et suffisamment large.
- source_word: ἀδίκους
  choice: injustes
  rationale: L’adjectif qualifie moralement ceux qui gouvernent; « injustes » préserve particulièrement sa portée publique et judiciaire.
theological_decisions:
- issue: Nature de l’élévation et de la puissance accordées à la figure attendue
  choice: 'Conserver une formulation ouverte : « élève-le avec puissance »'
  alternative: « revêts-le de puissance » ou « exalte-le puissamment »
  rationale: Le texte grec fourni porte ὑψώσον, non un verbe signifiant « ceindre ». Il faut donc préserver l’idée d’élévation, tout en évitant de trancher si ἰσχὺν désigne le moyen, la manière ou la puissance conférée.
translation_notes:
  register: Français moderne, international et digne. La formulation reste compacte et suit la structure de l’impératif grec avec son infinitif de but.
