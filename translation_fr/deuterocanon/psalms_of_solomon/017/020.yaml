  yaml_path: translation/deuterocanon/psalms_of_solomon/017/020.yaml
  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: fr
  text: Ceux qui aimaient les assemblées des pieux[a] s’enfuirent loin d’eux ; leur dispersion par les hommes sans loi s’étendit sur toute la terre, car le ciel se retint de faire tomber la pluie[b] sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des fidèles » ou « des personnes pieuses ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de distiller la pluie ».'
    reason: source_imagery
lexical_decisions:
- source_word: ἔφυγοσαν
  choice: s’enfuirent
  rationale: Le verbe exprime clairement la fuite ; « s’enfuirent » en conserve la force tout en restant naturel en français.
- source_word: συναγωγὰς
  choice: assemblées
  rationale: Le terme désigne des rassemblements ou communautés réunies. « Assemblées » garde ce sens collectif sans imposer une institution ultérieure.
- source_word: ὁσίων
  choice: fidèles
  rationale: Dans les Psaumes de Salomon, le mot désigne les personnes pieuses et loyales envers Dieu. « Fidèles » convient à ce groupe sans les confondre automatiquement avec les « saints » au sens ecclésiastique ultérieur.
- source_word: σκορπισμὸς
  choice: les dispersèrent
  rationale: La tournure verbale rend naturellement en français l’idée concrète de dispersion, tandis que l’agent introduit par ὑπό reste explicite.
- source_word: ἀνόμων
  choice: les hommes sans loi
  rationale: Cette expression préserve la portée à la fois morale et juridique de ἄνομος, plutôt que de la réduire au sens général de « méchants ».
- source_word: ἀνέσχεν
  choice: s’était retenu
  rationale: Le verbe décrit ici une retenue ou une suspension ; cette formulation maintient la personnification du ciel.
- source_word: στάξαι ὑετὸν
  choice: faire tomber la pluie
  rationale: Cette formulation française naturelle exprime l’action de laisser venir la pluie ; une note conserve l’image plus littérale du grec, « faire goutter la pluie ».
theological_decisions:
- issue: Désignation du groupe exprimé par ὅσιοι
  choice: fidèles
  alternative: gens pieux / saints
  rationale: « Fidèles » reflète la piété et la loyauté du groupe visé sans importer la catégorie ecclésiastique plus tardive souvent associée à « saints ».
- issue: Lien causal introduit par ὅτι
  choice: car
  alternative: parce que
  rationale: Le lien causal, même surprenant entre la dispersion et l’absence de pluie, est conservé sans être expliqué ni harmonisé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement fluidifiée en transformant le nom abstrait « dispersion » en verbe actif, sans modifier l’agent ni l’étendue universelle. Le rapport causal inhabituel avec la sécheresse est volontairement maintenu.
