review_pass:
  verdict: revise
  source_fidelity: La révision rétablit plus directement la structure nominale de σκορπισμὸς αὐτῶν ὑπὸ ἀνόμων (« leur dispersion par les hommes sans loi »), au lieu d’introduire un verbe actif. Elle rend ὅσιοι par « les pieux », conformément à son sens de piété dans ce livre, et conserve le lien causal ainsi que l’image du ciel qui retient la pluie. Le passé simple correspond aux aoristes grecs sans introduire l’antériorité du plus-que-parfait.
  naturalness: « Les assemblées des pieux », « leur dispersion par les hommes sans loi » et « le ciel se retint de faire tomber la pluie » sont sobres et idiomatiques dans un français moderne de registre scripturaire. La note explicite l’image plus concrète de στάξαι sans alourdir le texte.
  terminology: « Pieux » convient mieux que « fidèles » pour ὅσιοι dans les Psaumes de Salomon et évite de lui donner un sens institutionnel. « Hommes sans loi » maintient la force de ἀνόμων. « Assemblées » est une traduction non anachronique de συναγωγαί.
  issues:
  - severity: medium
    issue: Rendu actif de σκορπισμός
    rationale: « Les hommes sans loi les dispersèrent » explicite l’événement comme une action verbale, alors que le grec emploie le nom « leur dispersion » avec l’agent introduit par ὑπό. Le nom doit être conservé pour refléter plus étroitement la construction source.
  - severity: medium
    issue: Temps verbal du ciel
    rationale: « S’était retenu » introduit une antériorité que l’aoriste ἀνέσχεν n’exprime pas. Le passé simple maintient la succession narrative sans ajout aspectuel.
  - severity: low
    issue: Note littérale sur στάξαι
    rationale: « Faire goutter » est fautif et ne rend pas bien στάξαι, qui évoque l’action de distiller ou de laisser tomber goutte à goutte. La note est corrigée.
