revisions:
- from: Ceux qui aimaient les assemblées des fidèles[a] s’enfuirent loin d’eux ; les hommes sans loi les dispersèrent sur toute la terre, car le ciel s’était retenu de faire tomber la pluie[b] sur la terre.
