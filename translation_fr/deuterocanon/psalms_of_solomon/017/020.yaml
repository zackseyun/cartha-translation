  rationale: La révision corrige la structure de la dispersion, le temps verbal et la note lexicale, tout en gardant l’ambiguïté référentielle de « loin d’eux » telle que le grec la permet. Elle adopte « pieux » pour ὅσιοι, choix cohérent avec l’usage propre des Psaumes de Salomon et avec la piste d’audit anglaise, sans imposer de lecture confessionnelle.
