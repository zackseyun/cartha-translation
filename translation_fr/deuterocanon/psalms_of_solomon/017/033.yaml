review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement καθαριεῖ, Ἰερουσαλήμ et ἐν ἁγιασμῷ. La finale grecque est elliptique, mais le καί (« aussi ») n’est pas représenté dans le texte courant. L’explicitation « elle l’était » est acceptable pour rendre l’ellipse intelligible, à condition que la note ne fasse pas attribuer au grec un verbe exprimé.
  naturalness: « Et il purifiera Jérusalem dans la sainteté » est digne et compréhensible en français moderne. « Comme elle l’était aussi dès le commencement » reste naturel dans un registre biblique sobre et rend le comparatif elliptique de manière lisible.
  terminology: « purifiera », « Jérusalem » et « sainteté » sont des choix justes et non confessionnels. « Rendra Jérusalem pure » est une alternative lexicale recevable.
  issues:
  - severity: low
    issue: Le καί de ὡς καὶ τὸ ἀπ’ ἀρχῆς n’est pas rendu.
    rationale: Même dans une expression elliptique, καί doit être conservé lorsque le français le permet. L’ajout de « aussi » le représente sans résoudre davantage l’ellipse.
  - severity: medium
    issue: La note b présente « était » comme s’il appartenait à la formulation grecque littérale.
    rationale: Le grec porte littéralement « comme aussi ce qui [est] depuis le commencement » et ne contient pas le verbe à l’imparfait ni le pronom « elle ». La note doit distinguer l’ellipse grecque de l’explicitation française.
  revised_text: Et il purifiera Jérusalem dans la sainteté[a], comme elle l’était aussi dès le commencement[b].
