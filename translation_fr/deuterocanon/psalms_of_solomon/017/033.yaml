lexical_decisions:
- source_word: καθαριεῖ
  choice: purifiera
  rationale: Le verbe signifie rendre pur ou nettoyer. « Purifiera » convient au contexte religieux et reste naturel en français.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: ἐν ἁγιασμῷ
  choice: dans la sainteté
  rationale: Cette formulation conserve la préposition et maintient ouverte la nuance entre sphère, état et moyen, sans imposer « sanctification » ou « consécration ».
- source_word: ὡς καὶ τὸ ἀπ’ ἀρχῆς
  choice: comme elle l’était dès le commencement
  rationale: 'Le grec est elliptique : l’article neutre τὸ renvoie à un état ou à une condition sous-entendus. Le français explicite sobrement le sujet et le verbe nécessaires à l’intelligibilité.'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La tournure « dans la sainteté » conserve l’ambiguïté du grec quant au rapport exact entre la purification et la sainteté.
