  yaml_path: translation/deuterocanon/psalms_of_solomon/017/010.yaml
  text: According to their sins you will repay them[a], O God; may they be found according to their works.
translation:
  language: fr
  text: Tu leur rendras selon leurs péchés, ô Dieu ; qu’ils reçoivent[a] selon leurs œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que cela soit trouvé pour eux selon leurs œuvres ».'
    reason: La tournure grecque emploie un passif singulier sans sujet exprimé ; la traduction principale en donne le sens idiomatique tout en signalant la forme littérale.
lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  choice: selon leurs péchés
  rationale: κατά avec l’accusatif exprime ici la norme ou la mesure de la rétribution. « Péchés » conserve directement la portée morale du pluriel ἁμαρτήματα.
- source_word: ἀποδώσεις αὐτοῖς
  choice: tu leur rendras
  rationale: Le futur ἀποδώσεις exprime la rétribution divine. « Tu leur rendras » reste proche du grec et garde ouverte la nature exacte de ce qui leur sera rendu.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif avec article remplit ici une fonction vocative. « Ô Dieu » restitue l’adresse directe et le ton de prière.
- source_word: εὑρεθείη αὐτοῖς
  choice: qu’ils reçoivent
  rationale: L’optatif passif singulier signifie littéralement que quelque chose « soit trouvé pour eux ». En français courant, « qu’ils reçoivent » exprime naturellement le souhait de rétribution, tandis qu’une note conserve la forme inhabituelle et l’indétermination du grec.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: selon leurs œuvres
  rationale: La formulation garde κατά comme norme de mesure et rend ἔργα par le terme biblique courant « œuvres », sans préciser davantage la nature des actes.
theological_decisions:
- issue: Nature de la rétribution dans la seconde proposition
  choice: Ne pas préciser ce qui est reçu
  alternative: qu’ils reçoivent leur dû selon leurs œuvres
  rationale: Le grec ne nomme pas le sujet implicite de εὑρεθείη. Ajouter « leur dû », « leur châtiment » ou « leur salaire » résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe à Dieu dans la tradition biblique française. Le parallélisme des deux propositions et la répétition de « selon » sont conservés.
