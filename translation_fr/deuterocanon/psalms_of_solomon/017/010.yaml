  source_fidelity: 'Le texte français rend fidèlement la structure et le sens du grec : « selon leurs péchés », le futur de rétribution « tu leur rendras », l’adresse vocative « ô Dieu », puis le souhait optatif. « Qu’ils reçoivent » exprime de manière idiomatique la conséquence rétributive du passif singulier indéterminé εὑρεθείη, sans ajouter un objet tel que « châtiment » ou « salaire ». La note signale correctement la formulation littérale et l’absence de sujet exprimé.'
