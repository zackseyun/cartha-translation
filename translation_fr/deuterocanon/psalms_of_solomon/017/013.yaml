  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: fr
  text: L’homme sans loi a dévasté notre terre, la vidant de ses habitants ; ils ont anéanti les jeunes, les vieux et leurs enfants, tous ensemble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe du singulier (« l’homme sans loi ») à un verbe au pluriel (« ils ont anéanti »). La traduction conserve ce changement au lieu de l’harmoniser.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: a dévasté
  rationale: Exprime naturellement l’action de rendre la terre désolée et ruinée.
- source_word: ὁ ἄνομος
  choice: le hors-la-loi
  rationale: Conserve le singulier substantivé et rend précisément l’idée d’un homme qui méprise ou transgresse la loi, sans élargir à la simple méchanceté.
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: la vidant de ses habitants
  rationale: 'Rend en français idiomatique le résultat de la tournure grecque : la terre est privée de ceux qui l’habitent.'
- source_word: ἠφάνισαν
  choice: ont anéanti
  rationale: Traduit la disparition infligée aux personnes avec une gravité et un registre appropriés.
- source_word: νέον καὶ πρεσβύτην
  choice: jeunes et vieux
  rationale: Préserve le mérisme des deux extrêmes de l’âge dans une formulation française naturelle.
- source_word: τέκνα αὐτῶν ἅμα
  choice: ainsi que leurs enfants tous ensemble
  rationale: Maintient explicitement l’inclusion des enfants et la valeur collective de ἅμα.
