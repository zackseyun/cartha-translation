revisions:
- from: Le hors-la-loi a dévasté notre terre, la vidant de ses habitants ; ils ont anéanti jeunes et vieux, ainsi que leurs enfants tous ensemble.[a]
  to: L’homme sans loi a dévasté notre terre, la vidant de ses habitants ; ils ont anéanti les jeunes, les vieux et leurs enfants, tous ensemble.[a]
  rationale: La révision remplace un terme français trop connoté par une expression qui reflète plus directement ἄνομος, et reformule l’énumération finale pour un français moderne fluide tout en maintenant le singulier initial, le pluriel inattendu qui suit, l’inclusion des enfants et la portée collective de ἅμα.
