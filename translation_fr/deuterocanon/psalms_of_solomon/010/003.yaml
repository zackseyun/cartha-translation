  yaml_path: translation/deuterocanon/psalms_of_solomon/010/003.yaml
  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: fr
  text: Car il a rendu droites les voies des justes, et il ne les rendra pas tortueuses dans la discipline.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors de la correction » ou « par la correction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθωσε
  choice: a rendu droites
  rationale: Le verbe exprime l’action de rendre droit ou de remettre dans le droit chemin. Ce choix conserve l’image concrète des voies et la valeur perfective de l’aoriste.
- source_word: ὁδοὺς
  choice: les voies
  rationale: « Voies » garde la métaphore du chemin tout en désignant naturellement la conduite dans un registre biblique français actuel.
- source_word: δικαίων
  choice: des justes
  rationale: Le génitif pluriel substantivé désigne les personnes justes. « Des justes » est concis, naturel et fidèle.
- source_word: διαστρέψει
  choice: ne les rendra pas tortueuses
  rationale: Le verbe peut signifier tordre, déformer ou détourner. Cette formulation française naturelle appliquée à des voies maintient le contraste spatial direct avec « rendu droites ».
- source_word: ἐν παιδείᾳ
  choice: lors de la correction
  rationale: παιδεία peut désigner l’éducation, la discipline ou la correction. « Lors de la correction » rend naturellement le contexte de l’action sans préciser à tort si ἐν a une valeur strictement temporelle ou instrumentale.
theological_decisions:
- issue: Rapport entre la correction divine et les voies des justes
  choice: 'Le pronom « les » reprend les voies : Dieu ne les rendra pas tortueuses au cours de la correction.'
  alternative: Dieu ne détournera pas les justes par la discipline, ou il n’agira pas injustement en les corrigeant.
  rationale: La reprise des « voies » prolonge le contraste interne entre ce qui est droit et ce qui devient tortueux. Elle évite de transformer l’image en une affirmation doctrinale plus abstraite que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la métaphore cohérente des voies droites ou tortueuses et signale en note l’ambiguïté de ἐν παιδείᾳ.
