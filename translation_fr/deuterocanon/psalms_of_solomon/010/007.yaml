  - 801
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: fr
  text: Et les fidèles[a] rendront grâce dans l’assemblée du peuple, et Dieu fera miséricorde aux pauvres dans la joie d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes pieux »; littéralement, « les pieux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au milieu de la joie d’Israël ». L’expression peut indiquer le cadre dans lequel Dieu exerce sa miséricorde.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅσιοι
  choice: les fidèles
  rationale: Le terme désigne ici les personnes pieuses ou loyales envers Dieu. « Les fidèles » exprime naturellement en français cette fidélité religieuse sans le confondre avec ἅγιοι, « les saints ».
- source_word: ἐξομολογήσονται
  choice: rendront grâce
  rationale: Dans l’usage religieux de la Septante, le verbe désigne souvent l’action publique de remercier ou de louer Dieu; le contexte de l’assemblée soutient « rendront grâce ».
- source_word: ἐν ἐκκλησίᾳ λαοῦ
  choice: dans l’assemblée du peuple
  rationale: Traduction directe qui conserve le cadre public et communautaire du rassemblement.
- source_word: πτωχοὺς
  choice: aux pauvres
  rationale: « Les pauvres » rend directement la condition sociale et matérielle exprimée par le grec, sans l’atténuer.
- source_word: ἐλεήσει
  choice: fera miséricorde à
  rationale: Cette formulation conserve la portée religieuse du verbe tout en restant claire et idiomatique en français biblique moderne.
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: dans la joie d’Israël
  rationale: Le calque mesuré préserve le lien grammatical ambigu de la locution et la répétition lexicale éventuelle avec le contexte, plutôt que de préciser qu’il s’agit nécessairement du cadre dans lequel Dieu agit.
theological_decisions:
- issue: Valeur de ὅσιοι comme désignation collective
  choice: les fidèles
  alternative: les hommes pieux / les saints
  rationale: « Les fidèles » garde l’idée de piété et de loyauté envers Dieu sans identifier automatiquement ce groupe aux « saints », terme généralement associé à ἅγιοι.
- issue: Rattachement de ἐν εὐφροσύνῃ Ἰσραήλ
  choice: maintien de « dans la joie d’Israël »
  alternative: « au milieu de la joie d’Israël » ou rattachement à l’action de grâce précédente
  rationale: La syntaxe grecque place l’expression après la proposition sur la miséricorde divine, mais sa portée exacte demeure peu déterminée. Une formulation proche du grec évite de résoudre silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Rendre grâce » et « faire miséricorde » maintiennent le registre cultuel du grec sans archaïsme excessif. Les marqueurs [a] et [b] figurent dans le texte.
