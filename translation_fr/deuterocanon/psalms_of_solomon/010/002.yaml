base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/002.yaml
  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
translation:
  language: fr
  text: Celui qui prépare son dos à recevoir les coups de fouet sera purifié[a], car le Seigneur est bon envers ceux qui supportent la discipline[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera rendu pur » ou « sera nettoyé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la correction »; le terme peut aussi désigner une éducation corrective.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἑτοιμάζων νῶτον
  choice: Celui qui prépare son dos
  rationale: Le participe présent substantivé désigne de manière générale celui qui se tient prêt; le possessif, naturel en français, explicite le rapport au sujet.
- source_word: εἰς μάστιγας
  choice: à recevoir les coups de fouet
  rationale: La préposition exprime ici la disposition à subir les coups. « Coups de fouet » conserve l’image concrète de μάστιξ et peut maintenir le lien lexical avec le verset précédent.
- source_word: καθαρισθήσεται
  choice: sera purifié
  rationale: Le futur passif exprime le résultat de la correction acceptée. « Purifié » préserve la portée morale ou religieuse du verbe sans la limiter à une purification rituelle.
- source_word: χρηστὸς
  choice: bon
  rationale: L’adjectif peut signifier « bon » ou « bienveillant »; « bon » reste direct et convient à cette affirmation sur le caractère du Seigneur.
- source_word: κύριος
  choice: le Seigneur
  rationale: Rendu usuel de κύριος dans ce contexte religieux.
- source_word: τοῖς ὑπομένουσιν
  choice: envers ceux qui supportent
  rationale: Le participe évoque le fait de demeurer ferme sous une épreuve ou une correction. « Supportent » est naturel ici et ne transforme pas implicitement la discipline en vertu abstraite.
- source_word: παιδείαν
  choice: la discipline
  rationale: Dans ce contexte, le mot désigne une formation corrective plutôt qu’une simple instruction; « discipline » garde cette amplitude.
theological_decisions:
- issue: Nature de la purification produite par la correction acceptée
  choice: La formulation laisse entendre une purification résultant de la discipline volontairement acceptée.
  alternative: Le langage pourrait viser plus précisément une purification rituelle ou, plus largement, une restauration à travers la souffrance.
  rationale: καθαρισθήσεται évoque naturellement la purification, tandis que παιδεία oriente vers une correction formatrice. La traduction conserve cette relation sans imposer une lecture exclusivement rituelle, morale ou judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « prépare son dos à recevoir » conserve l’image volontaire et concrète du grec tout en évitant une formulation française trop abrupte.
