base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/008.yaml
  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
translation:
  language: fr
  text: Car Dieu est bienveillant et miséricordieux pour toujours[a], et les assemblées d’Israël glorifieront le nom du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à jamais ».
    reason: lexical_alternative
  - marker: b
    text: Ou « communautés » pour « assemblées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison ou l’explication de ce qui précède, tout en conservant la valeur causale du grec.
- source_word: χρηστός
  choice: bienveillant
  rationale: Exprime ici la bonté active et favorable de Dieu; « bon » demeure une possibilité plus générale.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Rend directement la disposition divine à faire miséricorde et forme une paire naturelle avec « bienveillant ».
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française courante qui restitue l’idée de durée sans fin portée par l’idiome grec.
- source_word: συναγωγαὶ
  choice: assemblées
  rationale: Désigne les communautés d’Israël réunies, sans imposer trop fortement une connotation institutionnelle ultérieure.
- source_word: δοξάσουσιν
  choice: glorifieront
  rationale: Conserve le futur et la forte valeur doxologique du verbe grec.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Restitue le titre κύριος de manière idiomatique dans l’expression « le nom du Seigneur ».
theological_decisions:
- issue: Traduction de κύριος dans un texte grec deutérocanonique
  choice: le Seigneur
  alternative: Seigneur
  rationale: « Le Seigneur » est la formulation française naturelle dans l’expression « le nom du Seigneur » et préserve la valeur du titre sans préciser davantage son référent.
- issue: Nuance de χρηστός appliqué à Dieu
  choice: bienveillant
  alternative: bon
  rationale: « Bienveillant » met en relief la bonté favorable suggérée par le contexte et l’association avec « miséricordieux », tandis que « bon » conserve une nuance plus large; l’alternative est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et le futur du grec sont conservés. « Bienveillant et miséricordieux » maintient les deux qualités distinctes sans lourdeur; « assemblées d’Israël » reste transparent et non confessionnel.
