base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/006.yaml
  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: fr
  text: Juste et saint est notre Seigneur dans ses jugements, pour toujours[a] ; et Israël louera le nom du Seigneur avec joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la ponctuation : « Juste et saint est notre Seigneur dans ses jugements pour toujours ».'
    reason: La ponctuation française clarifie la portée de « pour toujours » sans modifier le sens du grec, dont le rattachement exact peut être exprimé différemment.
lexical_decisions:
- source_word: δίκαιος
  choice: juste
  rationale: Appliqué au Seigneur, l’adjectif exprime sa rectitude morale et la justice de son action. « Juste » est le terme français naturel qui conserve ces deux dimensions.
- source_word: ὅσιος
  choice: saint
  rationale: Dans une affirmation concernant Dieu, « saint » rend naturellement le caractère sacré et moral exprimé par ὅσιος, sans le réduire à la simple piété humaine.
- source_word: Κύριος ἡμῶν
  choice: notre Seigneur
  rationale: Κύριος est ici un titre divin ; l’ordre français retenu préserve aussi la mise en relief initiale des deux attributs.
- source_word: κρίμασιν αὐτοῦ
  choice: dans ses jugements
  rationale: Le datif peut désigner la sphère dans laquelle la justice et la sainteté du Seigneur se manifestent. « Dans ses jugements » garde la formulation judiciaire et l’ambiguïté du rapport grammatical.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette locution exprime ici une durée sans fin ; « pour toujours » est clair, actuel et adapté au registre psalmique.
- source_word: αἰνέσει
  choice: louera
  rationale: Le futur grec annonce la louange d’Israël. « Louera » en restitue directement le temps et le sens.
- source_word: τῷ ὀνόματι Κυρίου
  choice: le nom du Seigneur
  rationale: La mention explicite du « nom » est conservée en raison de sa portée religieuse et révérencielle.
- source_word: ἐν εὐφροσύνῃ
  choice: avec joie
  rationale: La locution indique la manière dont Israël louera ; « avec joie » est idiomatique et garde le ton d’allégresse.
theological_decisions:
- issue: Distinction entre les deux attributs divins δίκαιος et ὅσιος
  choice: juste et saint
  alternative: juste et fidèle
  rationale: « Juste et saint » maintient distinctes la rectitude judiciaire et morale, d’une part, et la qualité sacrée, d’autre part, sans interpréter ὅσιος comme une fidélité d’alliance.
- issue: Rapport du datif κρίμασιν αὐτοῦ aux attributs du Seigneur
  choice: dans ses jugements
  alternative: par ses jugements
  rationale: Le grec permet de comprendre les jugements comme la sphère où se manifestent la justice et la sainteté du Seigneur, ou comme le moyen par lequel elles se manifestent. Le texte principal retient la première lecture et la note conserve la seconde.
translation_notes:
  register: Français international moderne, digne et poétique. L’antéposition « Juste et saint est notre Seigneur » reproduit l’accent emphatique du grec tout en restant intelligible dans un contexte psalmique.
