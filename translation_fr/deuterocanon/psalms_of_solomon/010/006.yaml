  source_fidelity: Le texte rend fidèlement les deux prédicats δίκαιος et ὅσιος (« juste et saint »), le futur αἰνέσει (« louera »), ainsi que les compléments « le nom du Seigneur » et « avec joie ». Le datif κρίμασιν est bien rendu par « dans ses jugements », compris comme un datif de référence ou de sphère. La virgule avant « pour toujours » clarifie que εἰς τὸν αἰῶνα porte sur l'affirmation concernant le Seigneur, plutôt que de qualifier seulement « jugements ».
  naturalness: L'antéposition « Juste et saint est notre Seigneur » est marquée, mais naturelle dans un registre psalmique soutenu et elle préserve l'accent initial du grec. L'ajout de la virgule rend la phrase plus lisible en français moderne.
  terminology: '« Juste », « saint », « Seigneur », « jugements », « louera » et « joie » sont des choix cohérents, modernes et appropriés au registre biblique. La note proposée n''est pas retenue : « par ses jugements » est une reformulation instrumentale plus interprétative, tandis que « dans ses jugements » rend adéquatement la construction grecque sans devoir signaler une variante de sens.'
