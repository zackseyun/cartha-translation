translation:
  language: fr
  text: Le salut du Seigneur repose sur la maison d’Israël, pour une maîtrise de soi éternelle[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que le salut du Seigneur repose sur la maison d’Israël », si l’on donne à cette proposition sans verbe la valeur d’une bénédiction ou d’un souhait.'
    reason: alternative_reading
  - marker: b
    text: '« Maîtrise de soi » traduit le grec σωφροσύνην, qui peut aussi évoquer la sagesse pratique, la pondération ou la sobriété. Une tradition éditoriale signalée dans le dossier donne toutefois εὐφροσύνην, « joie » : « pour une joie éternelle ».'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif exprime naturellement l’appartenance ou l’origine; « le salut du Seigneur » conserve la formulation biblique usuelle.
- source_word: ἡ σωτηρία
  choice: le salut
  rationale: « Salut » garde toute la portée religieuse de σωτηρία, sans la réduire à une délivrance ponctuelle.
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: repose sur la maison d’Israël
  rationale: La proposition grecque est sans verbe. « Repose sur » rend naturellement ἐπί tout en conservant l’image d’un salut accordé à la maison d’Israël.
- source_word: εἰς
  choice: pour
  rationale: « Pour » préserve l’ambiguïté entre but et résultat portée ici par εἰς.
- source_word: σωφροσύνην
  choice: maîtrise de soi
  rationale: D’après le texte grec fourni et directement validé, σωφροσύνη désigne ici la retenue ou la maîtrise morale de soi; une note signale les autres nuances possibles.
- source_word: αἰώνιον
  choice: éternelle
  rationale: L’adjectif qualifie σωφροσύνην et exprime une durée sans fin ou permanente.
theological_decisions:
- issue: Force de la proposition nominale sans verbe
  choice: 'affirmation : « repose »'
  alternative: 'souhait ou bénédiction : « Que le salut du Seigneur repose… »'
  rationale: Sans contexte syntaxique décisif, la proposition peut être comprise comme une affirmation ou recevoir une valeur optative. Le texte principal retient l’affirmation, et la note conserve l’autre possibilité.
- issue: Leçon σωφροσύνην dans la source fournie
  choice: maîtrise de soi
  alternative: joie, si l’on adopte la leçon εὐφροσύνην attribuée à d’autres témoins ou relevés de l’édition
  rationale: La traduction suit en priorité le texte grec explicitement fourni, σωφροσύνην. La révision signalant εὐφροσύνην entre en conflit avec cette donnée validée; elle est donc mentionnée en note plutôt que substituée silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. « Maison d’Israël » conserve l’expression collective du grec. La légère solennité de « le salut du Seigneur » convient au registre psalmique.
