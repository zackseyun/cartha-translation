  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: fr
  text: Heureux l’homme dont le Seigneur s’est souvenu en le reprenant[a], et qui, par le fouet, a été détourné d’une voie mauvaise[b], afin d’être purifié du péché, pour que celui-ci ne se multiplie pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en le corrigeant » ou « par une réprimande ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « a été entouré loin d’une voie mauvaise »; l’image suggère qu’il a été contenu ou empêché d’y avancer.
    reason: lexical_alternative
  - marker: c
    text: 'La fin peut aussi se comprendre ainsi : « afin qu’il ne multiplie pas le péché » ou « afin de ne pas augmenter le péché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes en français biblique moderne, exprimant un état favorable plutôt qu’une simple émotion passagère.
- source_word: ἀνὴρ
  choice: l’homme
  rationale: Conserve le masculin singulier explicite du grec.
- source_word: ἐμνήσθη
  choice: s’est souvenu
  rationale: Rend directement le verbe grec, tout en laissant au contexte l’idée que le souvenir du Seigneur se manifeste par la correction.
- source_word: ἐν ἐλεγμῷ
  choice: en le reprenant
  rationale: Exprime naturellement en français le moyen ou les circonstances de l’intervention disciplinaire du Seigneur.
- source_word: ἐκυκλώθη
  choice: a été détourné
  rationale: Rend le résultat contextuel de l’image littérale d’un homme entouré ou contenu de manière à l’écarter d’une mauvaise voie; la note préserve l’image grecque.
- source_word: ὁδοῦ πονηρᾶς
  choice: d’une voie mauvaise
  rationale: Préserve la métaphore morale de la voie dans un français clair et digne.
- source_word: ἐν μάστιγι
  choice: sous le fouet
  rationale: Conserve l’image concrète de la discipline et le même champ lexical que le substantif grec μάστιξ.
- source_word: καθαρισθῆναι
  choice: afin d’être purifié
  rationale: Conserve le passif et la nuance de purification morale, ainsi que la valeur finale probable de l’infinitif.
- source_word: ἀπὸ ἁμαρτίας
  choice: du péché
  rationale: Maintient le singulier grec, compris comme réalité morale collective.
- source_word: τοῦ μὴ πληθῦναι
  choice: pour que celui-ci ne se multiplie pas
  rationale: Rattache prudemment l’infinitif final au péché, antécédent singulier le plus proche, tout en signalant dans une note l’ambiguïté syntaxique.
theological_decisions:
- issue: La correction du Seigneur comme expression de son souvenir
  choice: Conserver « le Seigneur s’est souvenu » et la reprise disciplinaire sans expliciter davantage leur rapport théologique.
  alternative: Paraphraser par « dont le Seigneur a pris soin en le corrigeant ».
  rationale: Le grec associe paradoxalement le souvenir favorable et la réprimande; l’expliciter comme soin providentiel résoudrait une tension que le texte laisse intacte.
- issue: Sujet implicite de πληθῦναι
  choice: Comprendre « le péché » comme ce qui ne doit pas se multiplier.
  alternative: Comprendre que l’homme ne doit pas multiplier le péché.
  rationale: Le grec omet le sujet ou l’objet attendu et permet les deux compréhensions; le français principal suit l’antécédent immédiat sans exclure l’autre lecture, indiquée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde les images bibliques de la voie, du fouet, de la purification et du souvenir divin, tandis que les notes rendent visibles les principales ambiguïtés lexicales et syntaxiques du grec.
