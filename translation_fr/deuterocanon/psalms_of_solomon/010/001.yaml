  text: Μακάριος ἀνὴρ οὗ ὁ κύριος ἐμνήσθη ἐν ἐλεγμῷ, καὶ ἐκυκλώθη ἀπὸ ὁδοῦ πονηρᾶς ἐν μάστιγι, καθαρισθῆναι ἀπὸ ἁμαρτίας, τοῦ μὴ πληθῦναι.
