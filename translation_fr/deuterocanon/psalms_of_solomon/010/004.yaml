base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: fr
  text: Et la miséricorde du Seigneur repose sur ceux qui l’aiment en vérité[a], et le Seigneur se souviendra de ses serviteurs[b] avec miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidèlement » ou « avec sincérité » pour « en vérité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « esclaves » pour « serviteurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: miséricorde / avec miséricorde
  rationale: « Miséricorde » conserve à la fois l’idée de compassion et celle de bonté fidèle; la répétition du même terme français reflète celle de la racine grecque.
- source_word: Κυρίου / Κύριος
  choice: Seigneur
  rationale: Dans ce contexte liturgique juif, « Seigneur » rend naturellement le titre divin κύριος.
- source_word: ἐπὶ
  choice: repose sur
  rationale: Cette formulation préserve l’image grecque d’une miséricorde qui demeure sur des personnes tout en étant naturelle en français.
- source_word: ἀγαπῶντας
  choice: ceux qui l’aiment
  rationale: Le participe substantivé est rendu par une tournure française idiomatique qui garde le sens relationnel.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: La traduction formelle maintient l’étendue sémantique de l’expression, qui peut évoquer la vérité, la fidélité ou la sincérité, sans trancher entre ces nuances.
- source_word: μνήσεται
  choice: se souviendra de
  rationale: Le futur est conservé, ainsi que l’idée biblique d’un souvenir divin favorable et actif.
- source_word: δούλων
  choice: serviteurs
  rationale: « Serviteurs » convient au contexte de prière et à la relation au Seigneur, tandis que le sens social plus fort de « esclaves » est signalé en note.
theological_decisions:
- issue: Sens de δοῦλος
  choice: serviteurs
  alternative: esclaves
  rationale: Le contexte met surtout en avant l’appartenance et le service envers le Seigneur ainsi que son souvenir miséricordieux; « serviteurs » est naturel sans effacer l’autre valeur lexicale, indiquée en note.
- issue: Portée de ἐν ἀληθείᾳ
  choice: en vérité
  alternative: fidèlement / avec sincérité
  rationale: La formulation retenue préserve la tension entre vérité, fidélité et sincérité au lieu de réduire l’expression à une seule interprétation.
- issue: Titre divin κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage du titre divin dans ce contexte liturgique et n’impose pas la nuance différente de « Maître ».
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée par « et » suit le rythme du grec. « Repose sur » conserve son image sans produire le calque moins naturel « est sur ».
