base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: fr
  text: 'Car le témoignage se trouve dans la loi de l’alliance éternelle[a] ;

    le témoignage du Seigneur porte sur les voies des humains au temps de la visitation[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Car le témoignage dans la loi de l’alliance éternelle est le témoignage du Seigneur portant sur les voies des humains au temps de la visitation. »'
    reason: Le grec est dépourvu de copule et permet, à côté des deux membres parallèles retenus dans le texte, une lecture où le premier groupe nominal est identifié au second.
  - marker: b
    text: Le mot grec peut aussi désigner une visite, une inspection ou une intervention, notamment divine, en vue de juger ou de secourir.
    reason: ἐπισκοπή possède une gamme de sens que « visitation » ne reproduit pas entièrement à lui seul.
lexical_decisions:
- source_word: μαρτυρία
  choice: témoignage
  rationale: « Témoignage » conserve la portée juridique et solennelle du terme dans ce contexte de loi et d’alliance, tout en permettant de reproduire sa répétition dans les deux membres.
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: dans la loi de l’alliance éternelle
  rationale: Cette formulation reste proche de la construction grecque et emploie une expression biblique naturelle en français moderne.
- source_word: Κυρίου
  choice: Seigneur
  rationale: Dans ce contexte d’alliance, κύριος fonctionne comme titre divin ; « Seigneur » est son équivalent français usuel.
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: concerne les chemins que suivent les humains
  rationale: Avec μαρτυρία, ἐπί peut indiquer ce sur quoi porte le témoignage. L’explicitation « que suivent » rend idiomatiquement l’image des chemins comme conduite de vie, tandis que « humains » garde la portée générique de ἀνθρώπων.
- source_word: ἐν ἐπισκοπῇ
  choice: lorsqu’il vient les examiner
  rationale: ἐπισκοπή peut désigner une visite, une inspection ou une intervention divine. Cette formulation courante fait ressortir ici l’idée d’un examen sans préciser abusivement si cette venue apporte jugement ou secours.
- source_word: '[copule sous-entendue]'
  choice: se trouve
  rationale: Le premier membre grec est sans verbe exprimé. « Se trouve » donne une phrase française naturelle tout en conservant le sens locatif de ἐν.
theological_decisions:
- issue: Valeur de la visitation divine
  choice: lorsqu’il vient les examiner
  alternative: lors de son intervention / lors de sa visitation
  rationale: Le contexte suggère l’inspection de la conduite humaine, mais ne dit pas explicitement si la venue du Seigneur aboutit au jugement ou au secours. Le texte principal garde cette ouverture, et la note signale l’étendue du terme grec.
- issue: Relation syntaxique entre les deux occurrences de « témoignage »
  choice: deux membres parallèles séparés par un point-virgule
  alternative: faire du premier groupe le sujet et du second son attribut
  rationale: La répétition de ἡ μαρτυρία favorise un distique parallèle, mais l’absence de copule autorise aussi une lecture appositionnelle. La note conserve cette ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « témoignage » et la disposition en deux membres préservent le parallélisme solennel du grec. « Chemins que suivent les humains » maintient l’image biblique tout en explicitant naturellement son rapport à la conduite.
