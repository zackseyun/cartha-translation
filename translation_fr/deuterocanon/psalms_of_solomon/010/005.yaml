  verdict: revise
  source_fidelity: Le distique parallèle et la répétition de μαρτυρία sont bien conservés. Toutefois, « lorsqu’il vient les examiner » transforme le syntagme nominal ἐν ἐπισκοπῇ (« dans/lors de la visitation, inspection ») en proposition verbale et explicite une action d’examen qui reste seulement implicite. La note a ajoute aussi « inscrit », idée absente du grec.
  naturalness: « Le témoignage se trouve dans… » est naturel et rend correctement la valeur locative. « Les voies des humains » est une image biblique française naturelle et suffisamment claire; « au temps de la visitation » préserve le substantif grec et son registre solennel sans imposer jugement ou secours.
  terminology: « Témoignage », « loi », « alliance éternelle » et « Seigneur » sont appropriés. « Visitation » est retenu comme terme biblique pour ἐπισκοπή, avec une note explicitant les sens possibles.
  issues:
