    issue: Rendu verbal de ἐν ἐπισκοπῇ
    rationale: « Lorsqu’il vient les examiner » ne préserve pas la forme nominale ni toute l’ambiguïté de ἐπισκοπή; il introduit une venue et un examen formulés comme des actions explicites. « Au temps de la visitation » maintient l’ouverture sémantique du grec.
  - severity: medium
