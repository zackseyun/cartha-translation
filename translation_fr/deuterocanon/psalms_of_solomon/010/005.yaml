  rationale: La révision conserve le parallélisme des deux clauses et les termes juridiques et covenantaux. Elle remplace la paraphrase verbale de ἐπισκοπή par « visitation », substantif qui correspond à la forme grecque et laisse ouverte la nature précise de l’intervention. La note syntaxique est corrigée afin de ne plus introduire l’idée non exprimée d’un témoignage « inscrit ».
