revisions:
- from: Ils ont irrité Dieu et l’ont poussé à les faire disparaître du pays[a], car, par tromperie, ils se faisaient passer pour des innocents[b].
  to: Ils ont provoqué la colère de Dieu et l’ont poussé à les retirer du pays[a], car ils trompaient les innocents[b] par leurs ruses.
  rationale: 'La révision corrige le sens syntaxique déterminant de la clause finale : les innocents sont l’objet de la tromperie, non l’identité feinte par les coupables. Elle rend aussi ἐξαίρω par un verbe français suffisamment neutre pour ne pas trancher entre expulsion et disparition destructrice. Les deux notes lexicales restent correctement ancrées et pertinentes.'
  reviewer_model: gpt-5.6-terra
