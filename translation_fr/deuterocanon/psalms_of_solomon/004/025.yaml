  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: fr
  text: Ils ont provoqué la colère de Dieu et l’ont poussé à les retirer du pays[a], car ils trompaient les innocents[b] par leurs ruses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des âmes d’innocents » ; l’expression peut aussi désigner des vies innocentes ou des personnes innocentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώργυσαν
  choice: ont irrité
  rationale: Le verbe exprime le fait de provoquer la colère de Dieu. « Irriter Dieu » est direct, naturel en français et conserve la force morale de l’accusation.
- source_word: παρώξυναν
  choice: l’ont poussé
  rationale: Suivi de l’infinitif ἐξᾶραι, le verbe indique qu’ils ont provoqué Dieu au point de susciter une action judiciaire. « L’ont poussé à » rend clairement cette construction sans ajouter de motif.
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: à les faire disparaître du pays
  rationale: ἐξαίρω signifie enlever ou ôter et peut, dans un contexte de jugement, avoir une portée destructrice. « Faire disparaître du pays » garde cette gravité sans préciser indûment s’il s’agit d’expulsion ou de destruction. La note conserve l’autre sens possible de γῆ, « terre ».
- source_word: ψυχὰς ἀκάκων
  choice: des innocents
  rationale: L’expression signifie littéralement « des âmes d’innocents », mais ψυχή peut désigner des personnes ou des vies. « Des innocents » est naturel et transmet le référent humain, tandis qu’une note préserve la formulation littérale et ses nuances.
- source_word: παραλογισμῷ
  choice: par tromperie
  rationale: Dans ce contexte, le nom désigne une manœuvre trompeuse plutôt qu’un simple raisonnement erroné. « Par tromperie » est concis et clair.
- source_word: ὑπεκρίνοντο
  choice: se faisaient passer pour
  rationale: Le verbe évoque ici le fait de jouer un rôle ou de feindre une identité. « Se faisaient passer pour » exprime naturellement cette hypocrisie en français moderne.
theological_decisions:
- issue: Dieu est présenté comme poussé à exercer son jugement
  choice: Conserver explicitement « l’ont poussé à »
  alternative: Atténuer en disant seulement qu’ils ont irrité Dieu avant qu’il les fasse disparaître
  rationale: Le grec coordonne deux verbes distincts et fait de ἐξᾶραι le complément de παρώξυναν. La traduction conserve donc cette tension anthropopathique sans la reformuler selon un système théologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite l’archaïsme de « ôter » et le caractère potentiellement trop précis de « chasser » ou « exterminer ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
