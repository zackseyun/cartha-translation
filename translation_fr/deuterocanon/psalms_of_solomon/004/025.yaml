review_pass:
  verdict: revise
  source_fidelity: 'La dernière proposition du projet ne suit pas la syntaxe grecque. ψυχὰς ἀκάκων est le complément visé par ὑπεκρίνοντο : les coupables trompaient des innocents par leur ruse; le grec ne dit pas qu’ils prétendaient eux-mêmes être innocents. La première partie rend bien la double provocation et l’action de jugement, mais « faire disparaître » est plus destructeur que le neutre ἐξᾶραι (« enlever/retirer »).'
  naturalness: « Provoqué la colère de Dieu » et « les retirer du pays » sont naturels dans un registre biblique moderne et évitent à la fois l’euphémisme et l’interprétation excessive. « Trompaient les innocents par leurs ruses » est idiomatique et exprime clairement les relations syntaxiques.
  terminology: « Dieu », « pays », « innocents », « ruses » conservent un registre digne et international. La note sur γῆ maintient l’alternative « terre ». La note sur ψυχάς conserve la formulation littérale sans imposer le sens étroit de « âmes ».
  issues:
  - severity: high
    issue: Le projet fait des coupables ceux qui « se faisaient passer pour des innocents ».
    rationale: 'Dans καὶ ... ψυχὰς ἀκάκων παραλογισμῷ ὑπεκρίνοντο, ψυχὰς ἀκάκων est l’accusatif complément : il s’agit des innocents que les coupables trompaient/abusaient par ruse. La traduction actuelle inverse donc le rapport entre les acteurs et les victimes.'
  - severity: medium
    issue: « Les faire disparaître du pays » explicite une destruction possible mais non requise.
    rationale: ἐξᾶραι signifie d’abord enlever ou retirer. Dans ce contexte judiciaire il peut avoir une portée grave, mais « retirer du pays » préserve l’ambiguïté entre expulsion et élimination.
  revised_text: Ils ont provoqué la colère de Dieu et l’ont poussé à les retirer du pays[a], car ils trompaient les innocents[b] par leurs ruses.
  revised_footnotes:
