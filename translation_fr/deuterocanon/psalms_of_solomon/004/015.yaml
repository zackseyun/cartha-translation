base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: fr
  text: Il fut rempli de cette iniquité, et ses yeux étaient tournés vers une autre maison[a], pour la détruire par des paroles sans délai[b] ; son âme, comme l’Hadès[c], ne se rassasie pas de toutes ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une autre maisonnée ». Le grec οἶκος peut désigner soit un bâtiment, soit une maisonnée, c’est-à-dire la famille et la sphère domestique.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est difficile. Elle peut aussi se comprendre comme « par des paroles sans hésitation », « par des paroles implacables » ou « par des paroles sans attendre ».
    reason: alternative_reading
  - marker: c
    text: L’Hadès est ici présenté comme insatiable. On pourrait aussi traduire par « le séjour des morts » ; « le shéol » ou « la tombe » seraient des rendus plus interprétatifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ
  choice: Il s’est rempli de cette transgression
  rationale: La tournure pronominale française rend naturellement la forme passive grecque sans atténuer l’image d’un homme rempli de conduite contraire à la loi. « Transgression » conserve ici la dimension normative de παρανομία.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: ses yeux se portent sur
  rationale: Cette expression française traduit le regard orienté vers sa cible et sa nuance d’intention, tout en restant proche de la construction grecque.
- source_word: οἶκον ἕτερον
  choice: une autre maisonnée
  rationale: « Maisonnée » peut désigner la famille et la sphère domestique visées, tandis que le sens concret « maison » demeure possible et est signalé en note.
- source_word: ὀλοθρεύσαι
  choice: pour la détruire
  rationale: L’infinitif exprime le but hostile, et « détruire » conserve la force du verbe grec.
- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: par des paroles qui ne souffrent aucun délai
  rationale: La formulation garde visible le sens littéral probable d’absence de report ou de délai, sans trancher silencieusement en faveur de la seule idée d’acharnement.
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: son âme n’est jamais rassasiée
  rationale: « Rassasiée » restitue l’image de plénitude non atteinte; « jamais » exprime idiomatiquement la négation au présent dans ce portrait d’insatiabilité.
- source_word: ὡς ᾅδης
  choice: comme l’Hadès
  rationale: Le calque transparent de ᾅδης préserve l’image grecque du séjour des morts insatiable, sans la réduire d’emblée à la tombe.
- source_word: ἐν πᾶσι τούτοις
  choice: malgré tout cela
  rationale: Dans le contexte de l’insatiabilité, ἐν peut indiquer les circonstances au sein desquelles l’homme demeure non rassasié; « malgré » rend ce rapport clairement en français.
theological_decisions:
- issue: Identification de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts / le shéol / la tombe
  rationale: Le texte grec nomme l’Hadès. Le conserver évite d’imposer une identification doctrinale plus précise; la note explique la fonction de l’image.
- issue: Portée de οἶκος
  choice: maisonnée
  alternative: maison
  rationale: Le contexte peut viser une famille ou un domaine domestique aussi bien qu’un bâtiment. Le texte retient le sens social probable et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme conserve les trois mouvements du grec. « Maisonnée » et « Hadès » sont légèrement littéraires, mais précis; leurs ambiguïtés sont explicitées en notes.
