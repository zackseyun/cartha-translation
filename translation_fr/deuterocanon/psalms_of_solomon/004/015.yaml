review_pass:
  verdict: revise
  source_fidelity: 'La voix passive de ἐπλήσθη doit être conservée : « Il s’est rempli » suggère plutôt une action réflexive volontaire. Παρανομία désigne ici une condition de conduite contraire à la loi, mieux rendue par « iniquité » que par « transgression ». La préposition ἐν dans ἐν πᾶσι τούτοις se rend plus directement par « de toutes ces choses » dans le cadre de l’image de l’insatiabilité, non par « malgré tout cela ».'
  naturalness: 'La révision emploie un français moderne et soutenu : « ses yeux étaient tournés vers » exprime clairement la visée hostile, et « ne se rassasie pas de toutes ces choses » restitue naturellement l’image grecque. « Par des paroles sans délai » reste volontairement sobre, car l’expression grecque est difficile; la note en indique les possibilités sans surinterprétation.'
  terminology: « Iniquité » préserve le caractère abstrait et normatif de παρανομία. « Maison » est retenu dans le texte pour le sens premier non marqué de οἶκος, tandis que la note maintient la possibilité de « maisonnée ». « Hadès » traduit directement ᾅδης sans imposer d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: « Il s’est rempli » ne reflète pas nettement le passif grec ἐπλήσθη.
    rationale: Le grec décrit le sujet comme rempli/saturé; la forme pronominale française peut faire de lui l’agent de son propre remplissage.
  - severity: medium
    issue: « Transgression » est trop ponctuel pour παρανομία.
    rationale: Le nom grec désigne plus naturellement l’iniquité ou l’état de mépris de la loi que l’acte isolé d’une transgression.
  - severity: medium
    issue: « Malgré tout cela » modifie le rapport exprimé par ἐν πᾶσι τούτοις.
    rationale: Le texte situe l’insatiabilité dans ou à l’égard de « toutes ces choses »; il n’énonce pas explicitement une concession.
  - severity: low
    issue: « Des paroles qui ne souffrent aucun délai » est lourd et déplace légèrement la qualification.
    rationale: « Par des paroles sans délai » correspond plus directement à la construction grecque tout en laissant l’incertitude lexicale à la note.
  revised_text: Il fut rempli de cette iniquité, et ses yeux étaient tournés vers une autre maison[a], pour la détruire par des paroles sans délai[b] ; son âme, comme l’Hadès[c], ne se rassasie pas de toutes ces choses.
