revisions:
- from: Il s’est rempli de cette transgression, et ses yeux se portent sur une autre maisonnée[a], pour la détruire par des paroles qui ne souffrent aucun délai[b] ; son âme n’est jamais rassasiée, comme l’Hadès[c], malgré tout cela.
  to: Il fut rempli de cette iniquité, et ses yeux étaient tournés vers une autre maison[a], pour la détruire par des paroles sans délai[b] ; son âme, comme l’Hadès[c], ne se rassasie pas de toutes ces choses.
  rationale: La révision corrige la voix de la première proposition, rend παρανομία par un terme abstrait approprié, et restitue l’objet de l’insatiabilité dans la dernière proposition. Elle conserve les ambiguïtés de οἶκος et de λόγοις ἀνυπερθέσεως au moyen de notes, sans privilégier une interprétation doctrinale ou contextuelle non exigée par le grec.
