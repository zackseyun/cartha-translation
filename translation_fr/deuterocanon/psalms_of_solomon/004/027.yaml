base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/027.yaml
  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: fr
  text: Et le Seigneur les délivrera des gens trompeurs et pécheurs, et il nous délivrera de tout piège contraire à la loi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de toute occasion de chute contraire à la loi »; autre compréhension possible : « de toute occasion de chute causée par une personne sans loi » ou « par des gens sans loi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Rend le titre divin grec par l’équivalent français usuel, sans en atténuer la portée religieuse.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Exprime naturellement en français l’action d’arracher quelqu’un à un danger; le futur est conservé dans les deux propositions.
- source_word: ἀνθρώπων
  choice: gens
  rationale: Le terme est générique ici; « gens » évite de restreindre indûment le référent aux hommes de sexe masculin.
- source_word: δολίων
  choice: trompeurs
  rationale: Restitue clairement l’idée de ruse et de tromperie dans un registre moderne et digne.
- source_word: ἁμαρτωλῶν
  choice: pécheurs
  rationale: Conserve la désignation morale forte du grec et l’éventuelle portée de nom de groupe propre aux Psaumes de Salomon, plutôt que de l’affaiblir en simple défaut occasionnel.
- source_word: σκανδάλου
  choice: piège
  rationale: Dans ce contexte de délivrance, « piège » exprime naturellement ce qui entraîne la chute, tout en laissant en note l’image plus littérale de l’occasion de chute.
- source_word: παρανόμου
  choice: contraire à la loi
  rationale: Reproduit l’idée de transgression ou d’opposition à la loi sans la remplacer par le terme plus général « mauvais ».
theological_decisions:
- issue: Rapport syntaxique de παρανόμου avec σκανδάλου
  choice: 'L’adjectif qualifie le piège : « tout piège contraire à la loi »'
  alternative: « toute occasion de chute causée par une personne sans loi »
  rationale: L’accord avec σκανδάλου fournit la lecture syntaxique la plus directe, mais la forme grecque permet aussi de comprendre un auteur personnel de la chute; cette ambiguïté est signalée en note.
- issue: Portée de ἁμαρτωλῶν
  choice: « pécheurs », coordonné à « trompeurs » sous le nom générique « gens »
  alternative: « gens pécheurs »
  rationale: Le substantif français « pécheurs » laisse perceptible la possibilité qu’il s’agisse d’un groupe caractérisé, tout en respectant le lien grammatical avec ἀνθρώπων.
translation_notes:
  register: Français international actuel, clair et digne. La répétition de « délivrera » suit celle du verbe grec et souligne le parallèle entre « les » et « nous ». Le mot « loi » reste en minuscule afin de ne pas décider à lui seul si le texte vise précisément la Loi de Moïse ou, plus largement, ce qui est conforme à la loi.
