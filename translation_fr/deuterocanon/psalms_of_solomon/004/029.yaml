  text: May your mercy, O Lord, be upon all who love you.
translation:
  language: fr
  text: Que ta miséricorde soit sur tous ceux qui t’aiment, Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: Que … soit
  rationale: L’optatif aoriste de γίνομαι exprime ici un souhait ou une prière. La tournure « Que … soit » en restitue naturellement la force en français.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος employé pour s’adresser à Dieu. « Seigneur » est le terme biblique français usuel et convient au registre de la prière.
- source_word: τὸ ἔλεός σου
  choice: ta bonté
  rationale: ἔλεος désigne la miséricorde ou la bonté bienveillante accordée à autrui. « Ta bonté » est ici naturel, digne et préserve la dimension relationnelle du terme.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec l’accusatif dans cette prière, ἐπί indique que cette bonté se porte sur les personnes visées. « Sur » conserve simplement l’image grecque.
- source_word: πάντας τοὺς ἀγαπῶντάς σε
  choice: tous ceux qui t’aiment
  rationale: Le participe présent substantivé désigne l’ensemble des personnes caractérisées par leur amour pour Dieu. Cette formulation est fidèle et idiomatique en français.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: Dans une prière adressée à Dieu, « Seigneur » préserve l’usage biblique courant et le sens du grec sans ajouter d’interprétation confessionnelle.
- issue: Portée de ἔλεος
  choice: bonté
  alternative: miséricorde
  rationale: Le grec peut exprimer la miséricorde comme la bonté bienveillante. « Bonté » convient naturellement à la bénédiction demandée sur ceux qui aiment Dieu, sans exclure la nuance de miséricorde.
translation_notes:
  register: Français international moderne, simple et digne. L’invocation « Seigneur » est placée en fin de phrase conformément à l’ordre grec, tout en restant naturelle dans une prière française.
