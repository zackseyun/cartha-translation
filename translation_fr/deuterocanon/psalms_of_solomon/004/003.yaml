  text: καὶ ἡ χείρ αὐτοῦ ἐν πρώτοις ἐπʼ αὐτὸν ὡς ἐν ζήλει, καὶ αὐτὸς ἔνοχος ἐν ποικιλίᾳ ἁμαρτωλῶν, ἐν ἀκρασίαις·
