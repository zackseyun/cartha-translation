  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
translation:
  language: fr
  text: Et il est parmi les premiers à lever la main contre lui[a], comme par zèle[b], alors que lui-même est coupable de toutes sortes d’actes pécheurs[c] et d’excès.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il lève d’abord la main contre lui », si ἐν πρώτοις est compris dans un sens temporel plutôt que comme une priorité parmi ceux qui agissent contre lui.
    reason: alternative_reading
  - marker: b
    text: L’expression peut évoquer un zèle apparent ou une attitude présentée comme zélée, sans nécessairement affirmer que ce zèle est sincère.
    reason: lexical_alternative
  - marker: c
    text: La forme grecque peut aussi être comprise comme « de pécheurs » ; on traduirait alors la tournure très condensée par « dans les multiples voies des pécheurs ».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: χείρ
  choice: main
  rationale: Le sens concret conserve l’image vive de la main dirigée contre quelqu’un; «se lever contre» rend naturellement en français la portée hostile de ἐπʼ αὐτόν.
- source_word: ἐν πρώτοις
  choice: parmi les premières
  rationale: Cette lecture exprime la priorité et l’empressement à agir contre la personne visée, tout en laissant en note la lecture temporelle possible.
- source_word: ὡς ἐν ζήλει
  choice: comme par zèle
  rationale: Cette formulation française concise préserve l’ambiguïté entre un zèle apparent et une action présentée comme motivée par le zèle.
- source_word: ἔνοχος
  choice: coupable
  rationale: «Coupable» rend directement la valeur judiciaire et morale du terme dans ce contexte d’accusation.
- source_word: ποικιλίᾳ ἁμαρτωλῶν
  choice: de toutes sortes d’actes pécheurs
  rationale: ἁμαρτωλῶν peut être analysé ici comme un neutre pluriel substantivé, «choses ou actes pécheurs»; l’expression rend naturellement la multiplicité indiquée par ποικιλίᾳ.
- source_word: ἀκρασίαις
  choice: dans ses excès par manque de maîtrise de soi
  rationale: La formulation explicite l’idée d’absence de maîtrise personnelle et d’excès sans restreindre indûment le mot à l’ivrognerie ou à l’inconduite sexuelle.
theological_decisions:
- issue: Le zèle du personnage est-il réel ou seulement affiché?
  choice: comme par zèle
  alternative: comme s’il était animé de zèle
  rationale: Le grec ὡς n’impose pas à lui seul de trancher entre manière, apparence et prétention; le texte français conserve cette tension dans le corps du verset et l’explicite en note.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination grecque est rendue par «alors que» afin de faire ressortir le contraste entre l’accusation zélée et la culpabilité personnelle, sans ajouter de jugement doctrinal. Les images concrètes et les ambiguïtés grammaticales importantes sont conservées ou signalées en note.
