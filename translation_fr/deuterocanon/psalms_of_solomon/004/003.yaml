revisions:
- from: Et sa main est parmi les premières à se lever contre lui[a], comme par zèle[b], alors que lui-même est coupable de toutes sortes d’actes pécheurs[c], dans ses excès par manque de maîtrise de soi.
  to: Et il est parmi les premiers à lever la main contre lui[a], comme par zèle[b], alors que lui-même est coupable de toutes sortes d’actes pécheurs[c] et d’excès.
  rationale: 'La révision remplace une personnification française pesante par l’idiome « lever la main contre », qui maintient l’image concrète de la main et la priorité d’action exprimée par ἐν πρώτοις. Elle allège également le rendu d’ἀκρασίαις, sans résoudre au-delà du nécessaire sa portée précise. Les notes continuent de signaler les deux ambiguïtés textuellement pertinentes : la valeur temporelle ou prioritaire de ἐν πρώτοις et l’analyse possible de ἁμαρτωλῶν comme génitif personnel.'
