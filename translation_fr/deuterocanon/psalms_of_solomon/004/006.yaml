lexical_decisions:
- source_word: ταχὺς εἰσόδῳ
  choice: prompt à entrer
  rationale: La construction exprime la rapidité ou l’empressement à entrer; « prompt à entrer » reste proche du grec tout en étant naturel en français.
- source_word: εἰς πᾶσαν οἰκίαν
  choice: dans chaque maison
  rationale: Rend directement la totalité distributive de πᾶσαν avec un français idiomatique.
- source_word: ἱλαρότητι
  choice: avec enjouement
  rationale: Le datif modal désigne une attitude joyeuse ou avenante; « enjouement » conserve cette nuance sans surinterprétation.
- source_word: ὡς ἄκακος
  choice: comme s’il était innocent
  rationale: Dans ce contexte critique, ὡς présente une innocence affichée ou apparente; cette formulation préserve l’écart implicite entre apparence et réalité.
theological_decisions:
- issue: Caractère réel ou feint de l’innocence
  choice: comme s’il était innocent
  alternative: comme un innocent
  rationale: Le contexte et la valeur comparative de ὡς permettent de comprendre qu’il se donne l’apparence de l’innocence; la traduction choisie conserve cette tension sans déclarer qu’il est véritablement innocent.
translation_notes:
  register: Français moderne, sobre et digne. La phrase demeure un fragment descriptif, conformément au grec et à son contexte poétique.
