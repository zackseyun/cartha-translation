  yaml_path: translation/deuterocanon/psalms_of_solomon/004/012.yaml
  text: His words are false reasonings for carrying out the desire of unjust men[a][b][c].
translation:
  language: fr
  text: Ses paroles sont des raisonnements trompeurs[a], destinés à mettre en œuvre le désir des gens injustes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des sophismes », « des raisonnements fallacieux » ou « des tromperies ».
    reason: lexical_alternative
  - marker: b
    text: Ou « destinés à mettre en œuvre un désir de choses injustes ». La forme grecque peut désigner des personnes injustes ou des choses injustes.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: λόγοι
  choice: paroles
  rationale: « Paroles » rend concrètement ce que cet homme dit, sans introduire le sens plus formel de « discours ».
- source_word: παραλογισμοί
  choice: raisonnements trompeurs
  rationale: Le terme désigne des raisonnements faux ou fallacieux, avec une dimension de tromperie. Cette formulation en conserve la force intellectuelle et morale dans un français accessible.
- source_word: εἰς πρᾶξιν
  choice: qui servent à réaliser
  rationale: 'La tournure exprime la finalité pratique de ses paroles : elles conduisent à la mise en œuvre du désir. « Qui servent à réaliser » est naturel en français et évite le calque lourd « en vue de la pratique ».'
- source_word: ἐπιθυμίας
  choice: le désir
  rationale: Le singulier défini du grec est conservé. « Désir » reste assez large pour ne pas limiter indûment le terme à la convoitise sexuelle.
- source_word: ἀδίκων
  choice: des gens injustes
  rationale: Le génitif pluriel est compris dans le texte principal comme un masculin substantivé désignant les personnes injustes. « Gens injustes » est actuel et n’ajoute pas le genre masculin du français « hommes ».
theological_decisions:
- issue: Valeur grammaticale de ἀδίκων
  choice: 'Génitif masculin substantivé : « des gens injustes »'
  alternative: 'Génitif neutre objectif : « de choses injustes » ou « pour des choses injustes »'
  rationale: La forme grecque peut être masculine ou neutre. La lecture masculine suit la construction la plus immédiate retenue par la couche anglaise auditée, tandis qu’une note préserve la lecture neutre contextuellement plausible sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise et conserve l’enchaînement logique du grec. « Gens injustes » évite le masculin potentiellement restrictif de « hommes injustes » ; l’ambiguïté grammaticale de ἀδίκων est explicitement préservée en note.
