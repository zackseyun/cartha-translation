review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’optatif de δικαιώσαισαν (« Et que »), le sens judiciaire de δικαιόω avec κρίμα (« reconnaissent la justice du jugement »), la valeur temporelle de ἐν τῷ ἐξαίρεσθαι et l’image de ἀπὸ προσώπου (« de devant »). Il conserve aussi, avec une note explicative, le passage difficile du pluriel ἁμαρτωλούς au singulier accusatif λαλοῦντα. L’analyse de ἀνθρώπῳ ἀρέσκον comme « ce qui plaît à un homme » est défendable et correspond à l’audit anglais retenu.
  naturalness: La formulation est globalement naturelle, digne et adaptée à un français international moderne. Toutefois, « mais uniquement avec tromperie » introduit une opposition (« mais ») qui n’est pas explicitée par le grec et reste légèrement heurtée en français. La tournure restrictive « ne … qu’avec tromperie » exprime plus directement μόνον μετὰ δόλου.
  terminology: « Les fidèles », « jugement », « pécheurs », « le juste » et « tromperie » conviennent au registre et ne surinterprètent pas le texte. « Reconnaissent la justice du jugement » est une bonne manière française de rendre ici le sens de validation/vindication, sans imposer une lecture doctrinale.
