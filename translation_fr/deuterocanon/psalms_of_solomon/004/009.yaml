  to: Et que les fidèles reconnaissent la justice du jugement de leur Dieu, lorsque les pécheurs sont écartés de devant le juste[a] — celui qui ne dit ce qui plaît à un homme qu’avec tromperie.[b]
  rationale: La révision se limite à remplacer la coordination adversative par une restriction négative. Elle conserve l’ambiguïté syntaxique et le singulier générique du texte transmis, tout en rendant plus précisément et naturellement la portée de μόνον μετὰ δόλου.
