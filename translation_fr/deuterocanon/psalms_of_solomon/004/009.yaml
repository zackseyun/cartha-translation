    issue: « mais uniquement avec tromperie »
    rationale: Le connecteur adversatif ajoute une relation contrastive non marquée dans le grec. La restriction portée par μόνον est mieux reproduite par « ne … qu’avec tromperie », formulation plus idiomatique et plus exacte.
