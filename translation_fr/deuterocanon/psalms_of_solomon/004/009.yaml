  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: fr
  text: Et que les fidèles reconnaissent la justice du jugement de leur Dieu, lorsque les pécheurs sont écartés de devant le juste[a] — celui qui ne dit ce qui plaît à un homme qu’avec tromperie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « loin de la présence du juste ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec passe du pluriel « les pécheurs » à une description au singulier (« celui qui… »), probablement pour caractériser le pécheur de manière générale. La syntaxe du texte transmis est difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσιοι
  choice: les fidèles
  rationale: Le terme désigne ici des personnes pieuses et attachées à Dieu. « Les fidèles » est naturel en français moderne et conserve cette portée morale et religieuse.
- source_word: δικαιώσαισαν
  choice: que … reconnaissent la justice
  rationale: L’optatif exprime un souhait. Avec κρίμα pour complément, le verbe signifie tenir le jugement pour juste ou en attester la justice, non rendre juste.
- source_word: κρίμα
  choice: jugement
  rationale: « Jugement » conserve la portée judiciaire du grec sans préciser indûment s’il s’agit du verdict ou de la peine.
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: lorsque … sont écartés
  rationale: La construction infinitive est comprise temporellement. La forme passive de « écarter » rend le moyen grec dans un français idiomatique.
- source_word: ἀπὸ προσώπου δικαίου
  choice: de devant le juste
  rationale: Cette formulation garde l’image de la présence ou de la face et le singulier représentatif δικαίου, sans ajouter un nom absent du grec.
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: ce qui plaît à un homme
  rationale: 'ἀρέσκον est pris comme participe neutre substantivé, complément de λαλοῦντα : il s’agit de dire ce qui plaît à un être humain, plutôt que de parler dans le but de lui plaire.'
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: celui qui dit … mais uniquement avec tromperie
  rationale: Le singulier du participe est conservé malgré son lien syntaxiquement difficile avec le pluriel « pécheurs ». « Uniquement » porte sur la manière trompeuse de parler, conformément à l’ordre et à l’analyse grammaticale du grec.
theological_decisions:
- issue: Référent du participe singulier λαλοῦντα après le pluriel ἁμαρτωλούς
  choice: 'Le présenter comme une caractérisation générique du pécheur : « celui qui… »'
  alternative: Le rattacher au juste ou harmoniser librement au pluriel
  rationale: Le texte transmis passe du pluriel au singulier et demeure syntaxiquement difficile. La traduction maintient cette tension au lieu de choisir silencieusement un autre référent ou de corriger le nombre.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste proche du grec tout en évitant les calques obscurs ; les deux difficultés principales — l’optatif de souhait et le passage du pluriel au singulier — sont préservées.
