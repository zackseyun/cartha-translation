  text: περισσὸς ἐν λόγοις, περισσὸς ἐν σημειώσει ὑπὲρ πάντας, ὁ σκληρὸς ἐν λόγοις κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει.
