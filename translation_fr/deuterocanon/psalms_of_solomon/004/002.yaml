review_pass:
  verdict: revise
  source_fidelity: La répétition de περισσὸς et celle de ἐν λόγοις sont conservées, et « ostentation » rend de manière plausible σημείωσις comme manifestation extérieure. En revanche, « quand il condamne » transforme l’infinitif κατακρῖναι en subordonnée temporelle, alors que le grec caractérise plutôt sa dureté dans son action ou son intention de condamner. « Pour condamner » préserve mieux ce lien sans préciser l’autorité ni le cadre du jugement.
  naturalness: « Prodigue en paroles » est recevable dans un registre soutenu, mais « prodigue en ostentation » reste sensiblement heurté. « Excessif en paroles, excessif en ostentation » est plus direct, naturel et conserve l’anaphore concise du grec. « Dans le jugement » est plus idiomatique et plus transparent que « en jugement » dans ce contexte.
  terminology: « Ostentation » est maintenu pour ne pas surinterpréter σημείωσις, terme dont la nuance exacte peut relever de la mise en évidence ou de la démonstration extérieure. « Pécheurs » et « jugement » sont adéquats et ne chargent pas le texte d’une lecture confessionnelle.
  issues:
  - severity: medium
    issue: Valeur de l’infinitif κατακρῖναι
    rationale: « Quand il condamne » introduit une relation temporelle absente du grec. La construction « dur en paroles pour condamner les pécheurs » rend plus fidèlement la caractérisation suivie de l’infinitif, sans résoudre indûment sa nuance précise.
  - severity: low
    issue: Collocation « prodigue en ostentation »
    rationale: La répétition est juste, mais cette association nominale est peu idiomatique en français moderne. « Excessif en ostentation » conserve le sens d’excès et la structure rhétorique.
  revised_text: Excessif en paroles, excessif en ostentation plus que tous les autres, dur en paroles pour condamner les pécheurs dans le jugement.
