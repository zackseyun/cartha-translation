  yaml_path: translation/deuterocanon/psalms_of_solomon/004/002.yaml
  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: fr
  text: Excessif en paroles, excessif en ostentation plus que tous les autres, dur en paroles pour condamner les pécheurs dans le jugement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: Prodigue en paroles
  rationale: περισσός exprime ici l’excès ou la démesure; « prodigue » conserve la répétition rhétorique et s’emploie naturellement avec « en paroles ».
- source_word: περισσὸς ἐν σημειώσει
  choice: prodigue en ostentation
  rationale: σημείωσις peut désigner le fait de se signaler ou de se mettre en évidence. « Ostentation » restitue l’idée d’une manifestation extérieure excessive sans préciser indûment sa forme.
- source_word: ὑπὲρ πάντας
  choice: plus que tous les autres
  rationale: Rend le comparatif implicite de ὑπέρ avec l’accusatif dans ce contexte.
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: il est dur en paroles
  rationale: σκληρός signifie « dur, sévère »; la reprise de « paroles » préserve celle de λόγοις dans le grec.
- source_word: κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει
  choice: quand il condamne les pécheurs en jugement
  rationale: L’infinitif a une valeur liée à la caractérisation du personnage; « quand il condamne » produit une phrase française naturelle tout en gardant la juxtaposition potentiellement tendue entre condamner et jugement.
theological_decisions:
- issue: Nature du « jugement » et identité de celui qui condamne
  choice: 'Formulation laissée générale: « il condamne les pécheurs en jugement »'
  alternative: « il prononce en justice la condamnation des pécheurs »
  rationale: Le grec ne précise ni tribunal ni autorité légitime, et le contexte immédiat dénonce vraisemblablement la dureté du personnage. La traduction évite donc de légitimer ou de définir davantage son jugement.
translation_notes:
  register: Français moderne, soutenu mais accessible. La répétition « prodigue… prodigue » reflète l’anaphore grecque; « ostentation » est retenu pour l’expression rare ἐν σημειώσει.
