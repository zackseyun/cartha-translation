base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/004.yaml
  text: His eyes are on every woman without distinction[c][b][a]; his tongue is deceitful in a transaction with an oath.
translation:
  language: fr
  text: Ses yeux se portent sur toute femme, sans distinction[a] ; sa langue est mensongère lors d’une transaction accompagnée d’un serment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans retenue ». L’expression grecque peut indiquer qu’il regarde toutes les femmes indistinctement ou sans se fixer de limite.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans une transaction, avec un serment ». Le terme grec peut aussi désigner un accord ou un contrat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: Ses yeux se portent sur toute femme
  rationale: Cette formulation conserve l’image concrète des yeux dirigés vers les femmes, tout en rendant naturellement en français la valeur directionnelle de ἐπί avec l’accusatif et la portée générale de πᾶσαν.
- source_word: ἄνευ διαστολῆς
  choice: sans distinction
  rationale: 'διαστολή désigne d’abord une distinction ou une différenciation : l’homme porte donc ses regards sur toute femme indistinctement. Le contexte peut aussi suggérer l’absence de retenue, possibilité signalée en note.'
- source_word: ἡ γλῶσσα ψευδὴς
  choice: sa langue est mensongère
  rationale: Le choix conserve la métaphore grecque de la langue comme organe de la parole et exprime naturellement le caractère faux ou trompeur de ses propos.
- source_word: ἐν συναλλάγματι
  choice: lors d’une transaction
  rationale: συνάλλαγμα désigne ici un échange, une affaire ou un accord concret. « Transaction » préserve cette portée sans imposer le cadre juridique plus précis d’un contrat formel.
- source_word: μεθʼ ὅρκου
  choice: accompagnée d’un serment
  rationale: La préposition μετά indique que la transaction et le mensonge verbal s’accompagnent d’un serment, sans nécessairement évoquer une déposition judiciaire sous serment.
