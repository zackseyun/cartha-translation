  text: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα ἄνευ διαστολῆς, ἡ γλῶσσα ψευδὴς ἐν συναλλάγματι μεθʼ ὅρκου.
