base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/013.yaml
  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
translation:
  language: fr
  text: Il ne s’arrêta pas avant d’avoir réussi à les disperser[a], comme des orphelins[b], et il rendit une maison déserte[c] à cause d’un désir contraire à la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas l’objet de « disperser » ; « les » renvoie aux personnes évoquées par le contexte.
    reason: supplied_word
  - marker: b
    text: 'Littéralement : « comme dans l’état d’orphelin ». On peut aussi comprendre : « comme dans le deuil » ou « comme parmi des orphelins ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « maison » peut aussi désigner le foyer ou la maisonnée.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: Il ne s’arrêta pas
  rationale: Dans ce contexte, le verbe exprime la poursuite obstinée de l’action plutôt qu’un déplacement physique. Cette formulation est naturelle en français moderne.
- source_word: ἕως ἐνίκησεν σκορπίσαι
  choice: avant d’avoir réussi à les disperser
  rationale: Avec l’infinitif σκορπίσαι, ἐνίκησεν indique ici l’aboutissement de l’entreprise. Le pronom « les », absent du grec mais nécessaire en français courant, renvoie aux personnes visées sans anticiper « une maison » dans la proposition suivante.
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: comme des orphelins
  rationale: Cette expression française conserve l’image concrète de personnes dispersées, privées de protection et de liens familiaux, tout en évitant le tour peu naturel « dans l’état d’orphelin ».
- source_word: ἠρήμωσεν οἶκον
  choice: il rendit une maison déserte
  rationale: « Rendit… déserte » restitue directement la force désolante de ἠρήμωσεν et maintient le terme concret « maison », dont la portée peut inclure le foyer.
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: à cause d’un désir contraire à la loi
  rationale: La formulation conserve la dimension normative de παράνομος sans préciser indûment s’il s’agit ici d’une loi civile ou de la loi divine.
theological_decisions:
- issue: Portée de παράνομος
  choice: contraire à la loi
  alternative: impie / contraire à la Loi
  rationale: Le grec qualifie le désir par son opposition à la loi, mais le verset ne précise pas à lui seul la référence exacte. La minuscule préserve cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé sans introduire « maison » avant la seconde proposition, et les ambiguïtés de ὀρφανία, οἶκος et παράνομος sont signalées plutôt que résolues silencieusement.
