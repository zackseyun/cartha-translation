review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : les deux cadres (« la nuit », « dans des lieux cachés »), le péché, la comparaison ὡς (« comme si »), l’adresse distributive à chaque femme et le caractère délibérément mauvais de συνταγῇ κακίας sont conservés. « Comme s’il n’était pas vu » reproduit plus directement οὐχ ὁρώμενος que « comme s’il échappait aux regards », sans trancher sur le fait qu’il soit réellement observé.'
  naturalness: La coordination initiale « La nuit et dans des lieux cachés » est elliptique et moins fluide en français. « De ses yeux, il parle à toute femme » conserve l’image, mais l’ordre « il parle à toute femme avec ses yeux » est plus naturel tout en gardant l’instrument expressif du grec. « Machination mauvaise » est peu idiomatique ; « projet mauvais » est plus lisible et demeure suffisamment large.
  terminology: « Il pèche » convient à ἁμαρτάνει. « Lieux cachés » rend adéquatement le pluriel concret ἀποκρύφοις. « Projet mauvais » rend sans surinterprétation la συνταγή, qui peut désigner un arrangement, un plan ou une entreprise concertée ; la note conserve les possibilités plus marquées de « dessein » et « complot ».
  issues:
