    issue: Coordination temporelle et locative initiale peu naturelle
    rationale: Le grec répète ἐν devant « nuit » et « lieux cachés ». En français, « La nuit, dans des lieux cachés » exprime clairement les deux compléments sans l’ellipse maladroite de « La nuit et dans… ».
  - severity: low
    issue: Formulation de l’image du regard et de la comparaison à ajuster
    rationale: « Il parle à toute femme avec ses yeux » est plus idiomatique que « de ses yeux, il parle à toute femme » et maintient l’image grecque. « Comme s’il n’était pas vu » est plus proche de ὡς οὐχ ὁρώμενος.
  - severity: low
    issue: « Machination mauvaise » est peu naturel
    rationale: La formulation « projet mauvais » est moderne et suffisamment ouverte pour ne pas réduire συνταγή à un complot.
