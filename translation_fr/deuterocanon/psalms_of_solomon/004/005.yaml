  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
translation:
  language: fr
  text: La nuit, dans des lieux cachés[a], il pèche comme s’il n’était pas vu ; il parle à toute femme avec ses yeux[b], dans un projet mauvais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des lieux secrets ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec ses yeux, il parle » ; l’image évoque des signes silencieux et suggestifs faits du regard.'
    reason: cultural_note
  - marker: c
    text: Ou « dans un dessein mauvais », « dans un complot mauvais » ; le grec peut désigner un agencement, un plan ou une entreprise concertée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νυκτί
  choice: La nuit
  rationale: Expression temporelle naturelle en français, qui conserve l’idée d’agir à la faveur de l’obscurité.
- source_word: ἐν ἀποκρύφοις
  choice: dans des lieux cachés
  rationale: Le pluriel substantivé désigne vraisemblablement des endroits dissimulés plutôt qu’une simple manière d’agir en secret.
- source_word: ἁμαρτάνει
  choice: il pèche
  rationale: Le verbe exprime directement le péché et conserve ici toute sa portée morale.
- source_word: ὡς οὐχ ὁρώμενος
  choice: comme s’il échappait aux regards
  rationale: Cette formulation française naturelle rend l’apparence ou la supposition introduite par ὡς, sans affirmer qu’il est réellement invisible.
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: de ses yeux, il parle
  rationale: La tournure garde l’image corporelle frappante d’une communication silencieuse par le regard.
- source_word: πάσῃ γυναικί
  choice: à toute femme
  rationale: Le singulier avec πάσῃ a une valeur distributive, rendue naturellement par « toute femme ».
- source_word: ἐν συνταγῇ κακίας
  choice: dans une machination mauvaise
  rationale: συνταγή évoque un agencement, un plan concerté ou une entreprise délibérée ; « machination » préserve l’idée d’un dessein organisé sans en préciser excessivement la forme.
