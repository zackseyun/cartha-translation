  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: fr
  text: Que le sommeil soit ôté de ses tempes durant la nuit ; qu’ils tombent loin de toute œuvre de ses mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’ils tombent loin de toute œuvre de ses mains ». Le sujet du verbe grec au pluriel n’est pas exprimé.'
    reason: Le grec présente une ambiguïté syntaxique réelle ; la note l’explicite sans identifier arbitrairement le sujet pluriel.
lexical_decisions:
- source_word: ἀφαιρεθείη
  choice: soit ôté
  rationale: L’optatif aoriste passif exprime ici un souhait imprécatoire ; « soit ôté » en conserve la force et la voix passive.
- source_word: κροτάφων
  choice: tempes
  rationale: Le grec désigne proprement les tempes, et non les yeux ; ce choix maintient l’image corporelle du texte source.
- source_word: ἀποπέσοιεν ἀπὸ παντὸς ἔργου χειρῶν αὐτοῦ
  choice: que ses mains défaillent dans tout leur travail
  rationale: Le verbe pluriel n’a pas de sujet exprimé. Cette formulation française comprend les mains comme sujet implicite et rend ἀποπίπτω par l’idée de manquer ou de défaillir dans l’accomplissement du travail, tout en signalant l’ambiguïté dans une note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et directement compréhensible. La tournure optative « Que… » préserve le caractère imprécatoire du verset ; « pendant la nuit » est plus naturel en français courant que « dans la nuit ».
