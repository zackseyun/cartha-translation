translation:
  language: fr
  text: Et que sa maison soit privée de tout ce qui rassasierait son âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui comblerait son être » ; le mot grec traduit par « âme » peut aussi désigner la personne, la vie ou l’appétit.'
    reason: La note préserve l’étendue sémantique de ψυχή et l’ambiguïté contextuelle entre intériorité, personne et appétit.
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: soit privée
  rationale: L’adjectif grec signifie « manquante, déficiente ». Dans cette suite imprécatoire, le subjonctif français exprime naturellement le souhait ou la malédiction, tandis que « privée de » s’accorde idiomatiquement avec ἀπό.
- source_word: ὁ οἶκος αὐτοῦ
  choice: sa maison
  rationale: « Maison » conserve l’image grecque et peut évoquer aussi bien l’habitation que, par extension, la maisonnée, sans trancher inutilement.
- source_word: ἀπὸ παντὸς
  choice: de tout
  rationale: La construction marque la privation totale à l’égard de ce qui pourrait combler l’intéressé ; « privée de tout » rend cette relation naturellement en français.
- source_word: οὗ ἐμπλήσει
  choice: ce qui rassasierait
  rationale: ἐμπίμπλημι signifie remplir, combler ou rassasier. Avec ψυχή dans un contexte de besoin et de provision, « rassasierait » rend l’image d’une plénitude procurée, tout en restant naturel.
- source_word: ψυχὴν αὐτοῦ
  choice: son âme
  rationale: « Âme » maintient l’expression grecque et sa portée ouverte entre la personne intérieure, le désir et l’appétit ; une note signale cette amplitude sémantique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La tournure imprécatoire « que… soit » restitue la force implicite de la proposition nominale grecque. « Maison » et « âme » conservent les images du texte source, avec une note pour l’ambiguïté de ψυχή.
