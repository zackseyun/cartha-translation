lexical_decisions:
- source_word: ἐκκόψαισαν
  choice: Que… arrachent
  rationale: L’optatif aoriste exprime ici un souhait imprécatoire. La tournure « Que… arrachent » en rend naturellement la force en français, et « arracher les yeux » conserve la violence de l’image sans la renforcer indûment.
- source_word: κόρακες
  choice: les corbeaux
  rationale: κόραξ désigne normalement le corbeau; ce choix préserve précisément l’image saisissante de l’oiseau charognard.
- source_word: ὀφθαλμοὺς
  choice: les yeux
  rationale: C’est le sens courant du terme grec. Une formulation plus graphique surtraduirait le texte.
- source_word: ὑποκρινομένων
  choice: ceux qui feignent
  rationale: Le participe désigne des personnes qui jouent un rôle, feignent ou dissimulent. « Ceux qui feignent » rend directement cette idée sans imposer le sens religieux moderne que peut évoquer « hypocrites ».
