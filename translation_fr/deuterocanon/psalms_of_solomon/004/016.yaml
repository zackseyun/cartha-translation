base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/016.yaml
  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
translation:
  language: fr
  text: Que sa part[a], Seigneur, soit dans le déshonneur devant toi, que sa sortie soit dans les gémissements et son entrée[b] sous une malédiction[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lot ».
    reason: lexical_alternative
  - marker: b
    text: Dans le langage biblique, « sortie » et « entrée » peuvent désigner ensemble tous les déplacements d’une personne ou l’ensemble du cours de sa vie.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « dans une malédiction »; on peut aussi traduire : « avec une malédiction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γένοιτο
  choice: Que ... soit / se fassent
  rationale: L’optatif exprime ici un souhait imprécatoire adressé au Seigneur. La tournure française avec « que » en conserve la force de prière.
- source_word: μερὶς
  choice: part
  rationale: « Part » désigne naturellement ce qui revient à quelqu’un, son lot, sans réduire le terme à une possession matérielle.
- source_word: ἀτιμίᾳ
  choice: déshonneur
  rationale: Ce nom abstrait garde la tonalité morale et publique de ἀτιμία; « honte » aurait une coloration plus subjective.
- source_word: ἔξοδος / εἴσοδος
  choice: sorties / entrées
  rationale: Le couple antithétique est conservé et évoque, dans le langage biblique, l’ensemble des déplacements ou du cours de la vie.
- source_word: στεναγμοῖς
  choice: gémissements
  rationale: Le pluriel rend les manifestations répétées de détresse et correspond directement au datif pluriel grec.
- source_word: ἀρᾷ
  choice: sous la malédiction
  rationale: Cette expression française naturelle rend l’état marqué par une malédiction exprimé par ἐν avec le datif, sans imposer l’étrange calque « dans une malédiction ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Rendu usuel et digne de l’adresse divine κύριε.
theological_decisions:
- issue: Structure du souhait imprécatoire
  choice: Présenter le verset comme une prière directe demandant le jugement du Seigneur sur cet homme.
  alternative: Le rendre comme une simple prédiction de son sort.
  rationale: L’optatif γένοιτο associé au vocatif Κύριε indique un souhait ou une requête, et non une simple description prédictive.
- issue: Portée du verbe γένοιτο sur les trois groupes nominaux
  choice: Faire dépendre la part, les sorties et les entrées d’un même souhait, avec reprise française de « que » pour la clarté.
  alternative: Séparer la seconde moitié comme une proposition autonome ou un fragment nominal.
  rationale: La syntaxe grecque présente une série continue gouvernée par l’unique optatif; la reprise de « que » explicite cette relation sans modifier le sens.
translation_notes:
  register: Français international actuel, digne et lisible. Le parallélisme biblique est maintenu, tandis que la reprise de « que » et la formulation « se fassent » évitent une suite nominale raide. L’imprécation n’est ni atténuée ni transformée en prédiction.
