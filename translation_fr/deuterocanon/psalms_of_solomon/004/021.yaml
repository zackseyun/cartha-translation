  yaml_path: translation/deuterocanon/psalms_of_solomon/004/021.yaml
  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: fr
  text: Que la chair de ceux qui cherchent à plaire aux gens soit dispersée par les bêtes sauvages, et que les ossements[a] de ceux qui transgressent la loi restent exposés au soleil, dans le déshonneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte fourni lit « οὐτὰ », une forme obscure. La leçon « ὀστᾶ » (« ossements »), attestée dans l’édition imprimée de Swete, est probablement visée.
    reason: Signaler l’incertitude textuelle au mot précis tout en expliquant la traduction adoptée.
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: Que… soit dispersée
  rationale: L’optatif aoriste passif exprime ici un souhait imprécatoire. La tournure avec « que » conserve cette valeur de malédiction plutôt que d’en faire une simple prédiction.
- source_word: σάρκες
  choice: la chair
  rationale: Le grec emploie le pluriel de σάρξ pour la chair corporelle. Le singulier collectif est plus naturel en français tout en conservant l’image concrète et macabre.
- source_word: ἀνθρωπαρέσκων
  choice: de ceux qui cherchent à plaire aux gens
  rationale: Le composé désigne ceux dont la conduite vise à obtenir l’approbation humaine. Cette formulation moderne évite aussi de limiter artificiellement le sens aux personnes de sexe masculin.
- source_word: ὑπὸ θηρίων
  choice: par les bêtes sauvages
  rationale: θηρία évoque ici des animaux sauvages qui dispersent ou dévorent les restes des morts.
- source_word: ὀστᾶ (transcrit οὐτὰ dans les données fournies)
  choice: les ossements
  rationale: Le texte imprimé de Swete porte ὀστᾶ, « os, ossements »; la forme οὐτὰ fournie est une erreur de transcription ou d’OCR. « Ossements » convient au parallélisme avec « chair ».
- source_word: παρανόμων
  choice: de ceux qui transgressent la loi
  rationale: παράνομος qualifie ceux qui agissent contre la loi. La périphrase est claire en français et préserve la portée morale et juridique sans les assimiler simplement à des criminels au sens moderne.
- source_word: κατέναντι τοῦ ἡλίου
  choice: exposés au soleil
  rationale: L’expression signifie littéralement « devant le soleil » et suggère une exposition publique en plein jour. « Exposés au soleil » transmet naturellement cette image en français.
- source_word: ἐν ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: ἀτιμία désigne la privation d’honneur, l’ignominie. « Dans le déshonneur » conserve le registre solennel et le motif de l’humiliation publique.
theological_decisions:
- issue: Portée de l’imprécation
  choice: Conserver la formulation de souhait ou de malédiction
  alternative: La transformer en annonce certaine d’un jugement futur
  rationale: L’optatif grec présente le châtiment comme un souhait imprécatoire; le rendre comme une prédiction supprimerait une tension réelle du texte.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La phrase garde la violence concrète et le parallélisme de l’imprécation grecque. Le pluriel grec « chairs » est rendu par le singulier collectif français « chair », plus idiomatique.
