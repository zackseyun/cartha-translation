  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
translation:
  language: fr
  text: Que sa vie soit marquée par les souffrances, la pauvreté et le dénuement[a], Seigneur ; que son sommeil soit marqué par les chagrins et son réveil par les détresses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner le manque extrême, le dénuement, l’impuissance ou la détresse. Le même terme, au pluriel, est rendu par « détresses » à la fin du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, les propositions grecques n’ont pas de verbe exprimé : « sa vie dans les souffrances… son sommeil dans les chagrins… ». Le contexte des versets voisins conduit à les comprendre comme une imprécation ; prises isolément, elles pourraient aussi décrire un état de fait.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὀδύναις
  choice: souffrances
  rationale: Le terme peut désigner des douleurs physiques ou morales. « Souffrances » conserve cette amplitude sans renforcer indûment le sens.
- source_word: πενίᾳ
  choice: pauvreté
  rationale: Le nom désigne clairement la pauvreté ou le manque matériel ; « pauvreté » est l’équivalent français le plus direct.
- source_word: ἀπορίᾳ
  choice: dénuement
  rationale: Dans la série formée avec les souffrances et la pauvreté, le mot évoque ici le manque extrême et l’absence de ressources plutôt qu’une perplexité intellectuelle.
- source_word: ζωὴ
  choice: vie
  rationale: Équivalent courant qui englobe ici toute la condition de la personne.
- source_word: λύπαις
  choice: chagrins
  rationale: Le pluriel grec évoque des peines répétées ou multiples ; « chagrins » en conserve la portée affective.
- source_word: ἐξέγερσις
  choice: réveil
  rationale: Le nom désigne ici le fait de sortir du sommeil et forme un contraste naturel avec « sommeil ».
- source_word: ἀπορίαις
  choice: détresses
  rationale: Au pluriel et en parallèle avec les chagrins du sommeil, « détresses » exprime les situations oppressantes qui marquent l’état de veille. La note signale qu’il s’agit du même mot grec que celui rendu plus haut par « dénuement ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif grec marque une adresse directe dans la prière ; le français n’a pas besoin d’ajouter une interjection.
theological_decisions:
- issue: Valeur modale des propositions nominales sans verbe exprimé
  choice: Formulation de souhait ou d’imprécation avec « Que… »
  alternative: « Sa vie se passe… » comme constat à l’indicatif
  rationale: Les propositions grecques sont dépourvues de copule, mais le contexte immédiat appartient à une suite d’imprécations optatives. La formulation jussive rend cette continuité tout en signalant dans une note l’ambiguïté grammaticale propre au verset isolé.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « que » rend explicitement l’imprécation suggérée par le contexte. « Se passe » et « soit rempli » évitent une succession peu naturelle de calques avec « dans », tandis que le parallélisme entre la vie, le sommeil et le réveil demeure perceptible.
