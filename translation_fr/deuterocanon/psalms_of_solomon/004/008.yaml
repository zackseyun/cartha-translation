  yaml_path: translation/deuterocanon/psalms_of_solomon/004/008.yaml
  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
translation:
  language: fr
  text: Que Dieu mette au jour les actes de celui qui cherche à plaire aux humains[a], ses actes livrés au ridicule et à la dérision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile. Autre traduction possible : « les actes qui plaisent aux humains » ; la suite reprend alors : « ses actes livrés au ridicule et à la dérision ».'
    reason: La construction ἀνθρώπων ἀρεσκόν est irrégulière ou elliptique et permet une lecture personnelle aussi bien qu’une lecture rattachant l’idée de plaire aux actes.
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: Que Dieu mette au jour
  rationale: L’infinitif ἀνακαλύψαι a ici, dans le contexte imprécatoire, la valeur d’un souhait ou d’un appel. « Que Dieu mette au jour » exprime naturellement cette force tout en conservant l’idée de dévoilement public.
- source_word: τὰ ἔργα
  choice: les actes
  rationale: Dans ce contexte moral, ἔργα désigne les comportements concrets de la personne. « Actes » est plus naturel ici que « œuvres » et moins général que « actions ».
- source_word: ἀνθρώπων ἀρεσκόν
  choice: celui qui cherche à plaire aux humains
  rationale: La tournure grecque transmise est difficile, mais elle caractérise vraisemblablement une personne qui recherche l’approbation humaine. Cette formulation française rend l’idée éthique sans employer le peu naturel « complaireur d’hommes ».
- source_word: ἐν καταγέλωτι
  choice: livrés au ridicule
  rationale: La préposition ἐν associe ici la mise au jour des actes à leur humiliation publique. « Livrés au ridicule » donne une formulation française naturelle sans transformer la phrase en simple constat.
- source_word: μυκτηρισμῷ
  choice: dérision
  rationale: μυκτηρισμός évoque une moquerie chargée de mépris. « Dérision » conserve cette nuance et se distingue suffisamment de « ridicule ».
theological_decisions:
- issue: Orientation de celui qui plaît
  choice: celui qui cherche à plaire aux humains
  alternative: ce qui plaît aux humains
  rationale: Malgré la difficulté syntaxique du texte transmis, le contexte immédiat et l’expression éthique sous-jacente favorisent une référence à une personne caractérisée par la recherche de l’approbation humaine. La note signale l’incertitude sans imposer une opposition explicite à Dieu que le verset ne formule pas.
translation_notes:
  register: Français moderne, digne et accessible. La reprise de « ses actes » conserve l’insistance et l’ellipse poétique du grec. « Humains » rend ἀνθρώπων de manière inclusive et actuelle sans modifier la portée générale du terme.
