  source_fidelity: La force imprécatoire de « Que » rend correctement le contexte. « Sa vieillesse » correspond à γῆρας, « solitude » à μονία et « sans enfants » exprime clairement ἀτεκνία. En revanche, « se passe » introduit l’idée de déroulement, absente de la proposition nominale grecque, et « jusqu’à ce qu’il soit enlevé » impose une valeur temporelle qui n’est pas explicitement portée par εἰς ἀνάλημψιν.
  naturalness: « Que sa vieillesse soit dans la solitude, sans enfants, pour son enlèvement » est une formulation française soutenue, claire et plus proche de la concision solennelle du grec. « En vue de son enlèvement » est plus idiomatique que « pour son enlèvement » tout en conservant l’orientation finale de εἰς.
  terminology: « Solitude » et « sans enfants » sont justes. « Enlèvement » maintient l’ambiguïté de ἀνάλημψις sans identifier indûment l’événement à la mort. Le pronom possessif (« son enlèvement ») est nécessaire et naturel en français.
