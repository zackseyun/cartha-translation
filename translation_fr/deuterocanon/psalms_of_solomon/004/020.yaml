  text: May his old age be in the solitude of childlessness[b][a], for removal.
translation:
  language: fr
  text: Que sa vieillesse soit dans la solitude, sans enfants, en vue de son enlèvement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’enlèvement » ou « en vue de l’enlèvement ». Le grec peut aussi être compris, dans ce contexte, comme indiquant que cet état dure jusqu’à ce qu’il soit enlevé.'
    reason: alternative_reading
lexical_decisions:
- source_word: μονίᾳ
  choice: dans la solitude
  rationale: Le nom désigne un état d’isolement. « Dans la solitude » reste formel, naturel en français et convient au contexte de malédiction.
- source_word: ἀτεκνίας
  choice: sans enfants
  rationale: Le terme exprime l’absence d’enfants. Cette tournure est plus idiomatique que « dans la privation d’enfants » tout en gardant le sens précis.
- source_word: γῆρας
  choice: sa vieillesse
  rationale: Équivalent français courant du stade avancé de la vie visé par le jugement.
- source_word: εἰς ἀνάλημψιν
  choice: jusqu’à ce qu’il soit enlevé
  rationale: ἀνάλημψις désigne une prise ou un enlèvement. La formulation conserve l’ambiguïté quant à la nature de cet enlèvement, même si le contexte peut évoquer la mort; la valeur temporelle de « jusqu’à » demeure une interprétation de εἰς.
- source_word: '[force imprécatoire implicite]'
  choice: Que sa vieillesse se passe
  rationale: La proposition grecque est sans verbe, mais le contexte transmet la force optative des imprécations voisines. « Que… » l’exprime naturellement en français.
theological_decisions:
- issue: Faut-il rendre la proposition sans verbe comme un souhait de jugement ou comme une simple description ?
  choice: 'La rendre comme une imprécation : « Que sa vieillesse… »'
  alternative: 'La rendre comme une description nominale : « Sa vieillesse dans la solitude… »'
  rationale: La série de demandes de jugement dans le contexte soutient une force optative implicite, qu’il ne faut ni neutraliser ni adoucir.
- issue: ἀνάλημψις désigne-t-il explicitement la mort ?
  choice: Conserver « enlevé », sans préciser « par la mort ».
  alternative: Traduire explicitement « jusqu’à sa mort » ou, plus littéralement, « en vue de l’enlèvement ».
  rationale: Le contexte imprécatoire peut orienter vers la mort, mais le mot grec signifie d’abord prise, enlèvement ou retrait; expliciter la mort résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. « Se passe » complète naturellement la proposition nominale grecque. La proximité de « dans la solitude » et « sans enfants » maintient le lien entre isolement et absence de descendance sans employer le terme plus spécialisé « infécondité ».
