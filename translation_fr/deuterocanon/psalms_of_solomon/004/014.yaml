  text: He reasoned falsely in words[a], “There is no one who sees and judges.”
translation:
  language: fr
  text: 'Il a raisonné faussement[a] : « Il n’y a personne qui voie et qui juge. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il s’est trompé lui-même par ses paroles. »'
    reason: 'Alternative lexicale : le moyen παρελογίσατο peut évoquer une tromperie de soi, et ἐν λόγοις peut se rendre par « par ses paroles ».'
lexical_decisions:
- source_word: παρελογίσατο
  choice: il s’est égaré dans ses raisonnements
  rationale: Le verbe exprime un raisonnement faux ou trompeur. Cette formulation conserve la dimension cognitive tout en laissant ouverte la question de savoir s’il s’est lui-même trompé ou s’il raisonnait de manière fallacieuse.
- source_word: ἐν λόγοις
  choice: dans ses raisonnements
  rationale: Dans ce contexte, λόγοις renvoie aux paroles ou aux raisonnements formulés. L’intégration au verbe donne un français naturel sans perdre l’accent mis sur la pensée exprimée.
- source_word: ὁρῶν
  choice: qui voie
  rationale: Le participe substantivé désigne une personne qui voit. Après la tournure négative « il n’y a personne qui », le subjonctif est idiomatique en français.
- source_word: κρίνων
  choice: qui juge
  rationale: Le participe est coordonné à ὁρῶν et évoque une appréciation morale ou judiciaire. « Juge » en conserve directement la force.
theological_decisions:
- issue: Sujet implicite des participes ὁρῶν et κρίνων
  choice: Il n’y a personne qui voie et qui juge
  alternative: Dieu ne voit pas et ne juge pas
  rationale: Le grec nie le plus naturellement l’existence d’un observateur et juge sans nommer explicitement Dieu. La traduction préserve cette formulation et son implication possible sans ajouter un sujet divin absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. « S’égarer dans ses raisonnements » rend naturellement le raisonnement fautif; la note conserve une lecture plus littérale et réflexive.
