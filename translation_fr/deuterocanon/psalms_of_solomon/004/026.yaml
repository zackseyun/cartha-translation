  text: Blessed are those who fear the Lord in their innocence[a][b].
translation:
  language: fr
  text: Heureux ceux qui craignent le Seigneur dans leur innocence[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur absence de malice » ou « dans leur intégrité ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « craindre » désigne une crainte respectueuse envers le Seigneur, et non une simple terreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: La formule « Heureux ceux qui… » est la tournure traditionnelle et naturelle des béatitudes en français; elle exprime une condition favorable accordée ou reconnue par Dieu, et non une simple émotion passagère.
- source_word: φοβούμενοι
  choice: craignent
  rationale: Le verbe grec signifie littéralement « craindre ». Ce choix préserve la tension biblique du terme au lieu de la réduire d’emblée à « révérer »; une note précise qu’il s’agit ici d’une crainte respectueuse.
- source_word: κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » est le rendu français naturel de κύριον employé comme titre divin dans ce contexte religieux.
- source_word: ἀκακίᾳ
  choice: innocence
  rationale: Le nom désigne l’absence de mal, de malice ou de tromperie. « Innocence » est concis, naturel et suffisamment large, tandis qu’une note signale les nuances possibles d’absence de malice et d’intégrité.
theological_decisions:
- issue: Sens de la crainte du Seigneur
  choice: Conserver « craignent » dans le texte et en préciser la portée respectueuse en note.
  alternative: Traduire directement par « révèrent » ou « respectent profondément ».
  rationale: Le grec maintient le vocabulaire de la crainte, fréquent dans la tradition sapientielle. Le conserver évite d’effacer sa force et son ambiguïté, tout en empêchant la lecture réductrice d’une simple terreur grâce à la note.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe proche du grec conserve la formule de béatitude et l’expression « dans leur innocence », sans ajouter de complément interprétatif comme « avec un cœur ».
