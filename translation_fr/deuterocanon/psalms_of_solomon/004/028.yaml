  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: fr
  text: Que Dieu écarte ceux qui commettent toute injustice avec arrogance[a], car le Seigneur, notre Dieu, est un juge grand et puissant, qui juge avec justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute iniquité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la droiture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  choice: Que Dieu retranche
  rationale: L’infinitif aoriste exprime ici un souhait ou une imprécation. « Que Dieu retranche » rend cette force en français naturel tout en conservant le sens d’écarter ou de supprimer.
- source_word: τοὺς ποιοῦντας
  choice: ceux qui commettent
  rationale: Le participe désigne des personnes caractérisées par leurs actes. Avec « injustice », le verbe « commettre » est idiomatique en français.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec arrogance
  rationale: Cette expression indique la manière d’agir. « Avec arrogance » conserve la valeur nominale et la portée morale de l’original.
- source_word: πᾶσαν ἀδικίαν
  choice: toute injustice
  rationale: ἀδικία peut désigner l’injustice ou l’iniquité au sens moral. « Toute injustice » reste large, naturel et proche du grec.
- source_word: κριτὴς
  choice: juge
  rationale: Le sens judiciaire est direct et convient à la justification de l’intervention divine.
- source_word: μέγας καὶ κραταιὸς
  choice: grand et puissant
  rationale: Cette combinaison garde le parallélisme solennel du grec dans un français actuel et digne.
- source_word: Κύριος
  choice: Seigneur
  rationale: « Seigneur » est le rendu français usuel du titre divin κύριος.
- source_word: ἐν δικαιοσύνῃ
  choice: qui juge avec justice
  rationale: La formulation explicite naturellement en français le lien entre la qualité de juge et la justice, sans modifier le contenu du grec.
theological_decisions:
- issue: Sens de δικαιοσύνη dans un contexte de jugement divin
  choice: justice
  alternative: droiture
  rationale: Dans ce contexte explicitement judiciaire, « justice » est le rendu français le plus naturel. « Droiture » préserverait une portée morale plus large, mais s’articule moins directement avec « juge ».
- issue: Force de l’infinitif initial ἐξᾶραι
  choice: 'souhait ou imprécation : « Que Dieu retranche »'
  alternative: 'infinitif plus littéral : « Dieu, retrancher… »'
  rationale: La construction grecque demeure formellement infinitive, mais sa fonction contextuelle est optative ou imprécatoire. Le français exige normalement une proposition introduite par « que ».
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Retranche » conserve la vigueur imprécatoire du verset; « puissant » est plus courant aujourd’hui que « redoutable » ou « fort » dans cette coordination.
