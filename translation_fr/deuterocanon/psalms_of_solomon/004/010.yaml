base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/010.yaml
  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
translation:
  language: fr
  text: Et leurs yeux se portent sur la maison d’un homme qui vit dans la prospérité[a], comme un serpent, afin de ruiner la sagesse les uns des autres par les paroles de gens sans loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la stabilité », « dans la sécurité » ou « dans le bien-être ». Le terme grec évoque une situation ferme, stable et favorable.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par les paroles de gens sans loi ». Le grec désigne les auteurs des paroles, plutôt que de qualifier simplement les paroles elles-mêmes.'
    reason: grammar_clarification
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: leurs yeux se portent
  rationale: Cette formulation conserve l’image concrète des yeux tout en exprimant naturellement en français l’orientation insistante du regard.
- source_word: ἐπʼ οἶκον ἀνδρὸς
  choice: sur la maison d’un homme
  rationale: « Maison » préserve l’image grecque et peut aussi évoquer, selon le contexte, la maisonnée ou les biens de l’homme.
- source_word: ἐν εὐσταθείᾳ
  choice: qui vit dans la prospérité
  rationale: εὐστάθεια désigne fondamentalement un état stable ou assuré ; dans ce contexte, « prospérité » rend naturellement l’idée d’une situation favorable et bien établie.
- source_word: ὡς ὄφις
  choice: comme un serpent
  rationale: Le choix conserve sans l’expliciter la comparaison brève et menaçante du grec, ainsi que son rattachement syntaxique quelque peu ouvert.
- source_word: διαλῦσαι
  choice: afin de ruiner
  rationale: L’infinitif exprime ici le but. « Ruiner » traduit l’idée de défaire, dissoudre ou mettre à bas sans imposer l’idée d’une destruction physique.
- source_word: σοφίαν ἀλλήλων
  choice: la sagesse les uns des autres
  rationale: La traduction maintient à la fois le sens intellectuel et moral de σοφία et la réciprocité explicite de ἀλλήλων.
- source_word: ἐν λόγοις παρανόμων
  choice: par les paroles de gens sans loi
  rationale: παρανόμων est un génitif pluriel substantivé, et non un adjectif accordé avec λόγοις ; la traduction signifie donc littéralement « par les paroles de personnes sans loi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La comparaison elliptique « comme un serpent » et la réciprocité inhabituelle de « la sagesse les uns des autres » sont conservées afin de ne pas résoudre artificiellement les tensions du grec.
