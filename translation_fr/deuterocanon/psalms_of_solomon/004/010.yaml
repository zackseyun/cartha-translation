source:
  edition: lxx-swete-1909
  text: καὶ οἱ ὀφθαλμοὶ αὐτῶν ἐπʼ οἶκον ἀνδρὸς ἐν εὐσταθείᾳ, ὡς ὄφις, διαλῦσαι σοφίαν ἀλλήλων ἐν λόγοις παρανόμων.
