  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: fr
  text: Pourquoi, profane, sièges-tu dans un conseil sacré[a], alors que ton cœur s’est éloigné bien loin du Seigneur, tout en provoquant la colère du Dieu d’Israël par des proverbes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un conseil pieux » ou « une assemblée sainte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par des railleries », « par des sentences proverbiales » ou « en paroles énigmatiques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βέβηλε
  choice: homme profane
  rationale: Le vocatif désigne quelqu’un qui se trouve en dehors de la sphère sacrée ou qui la traite sans respect. « Homme profane » conserve le contraste marqué avec le « conseil saint » sans aller jusqu’au sens plus interprétatif d’« impie ».
- source_word: συνεδρίῳ ὁσίῳ
  choice: conseil saint
  rationale: συνέδριον désigne une assemblée siégeant pour délibérer, d’où « conseil ». ὅσιος exprime ici ce qui est saint, pieux ou fidèle à Dieu ; « saint » préserve en français le contraste direct avec « profane ».
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: ton cœur s’est éloigné
  rationale: Le parfait de ἀφίστημι présente un éloignement accompli dont l’état demeure. Le passé composé français rend naturellement cette rupture persistante ; l’idée de distance est portée par « s’est éloigné ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le contexte désigne Dieu ; « Seigneur » est donc employé avec une majuscule.
- source_word: ἐν παροιμίαις
  choice: par des proverbes
  rationale: « Proverbes » est le sens le plus direct de παροιμίαι. Le contexte peut toutefois suggérer des formules sentencieuses, énigmatiques ou moqueuses ; ces nuances sont conservées en note.
- source_word: παροργίζων
  choice: irritant
  rationale: Le participe signifie susciter la colère. « Irritant » reste concis, naturel et proche de la construction grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu mais accessible. L’interpellation « homme profane » et « conseil saint » maintient l’opposition rhétorique du grec. La coordination grecque est rendue par « alors que » afin d’exprimer naturellement le contraste sans en modifier le contenu.
