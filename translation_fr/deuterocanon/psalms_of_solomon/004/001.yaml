    rationale: « Ton cœur s’est éloigné du Seigneur » exprime l’éloignement, mais non le « loin » marqué par μακράν. « S’est éloigné bien loin du Seigneur » restitue cette intensité et l’état résultant du parfait.
  - severity: low
    issue: « Donc » ajoute une liaison argumentative non marquée dans le grec.
    rationale: Ἵνα τί introduit directement la question « Pourquoi ? » ; la suppression de « donc » est plus exacte.
  - severity: low
    issue: « Conseil saint » est peu naturel dans le registre français contemporain.
    rationale: Pour συνέδριον ὅσιον, « conseil sacré » garde le sens d’un conseil consacré à Dieu et convient mieux à la collocation française. Les autres nuances sont maintenues en note.
