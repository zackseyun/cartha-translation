  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: fr
  text: Que Dieu retranche ceux qui vivent dans l’hypocrisie parmi les pieux[a], ainsi que leur vie, dans la corruption de leur chair et dans la pauvreté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les pieux »; le grec peut exprimer la présence au sein de ce groupe.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte littéralement « sa chair » et « sa vie », au singulier, probablement avec une valeur distributive après « ceux ». La syntaxe est abrupte : la traduction comprend « leur vie » comme un second complément de « retranche »; la dernière expression peut aussi être comprise comme décrivant leur condition de vie.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: retranche
  rationale: « Retrancher » exprime une mise à l’écart énergique dans cette imprécation, sans imposer explicitement l’idée de mise à mort.
- source_word: ἐν ὑποκρίσει ζῶντας
  choice: qui vivent dans l’hypocrisie
  rationale: La formulation conserve l’image grecque d’une vie menée dans l’hypocrisie, plutôt que de la réduire à un simple comportement occasionnel.
- source_word: ὁσίων
  choice: gens pieux
  rationale: Dans ce contexte, ὅσιοι désigne des personnes caractérisées par leur piété; « gens pieux » évite les connotations ecclésiastiques possibles de « saints ».
- source_word: φθορᾷ
  choice: corruption
  rationale: Le terme garde l’étendue sémantique de φθορά, qui peut évoquer la dégradation, la ruine ou la corruption de la chair.
- source_word: σαρκός
  choice: chair
  rationale: « Chair » correspond directement à σάρξ et maintient ici la dimension corporelle de l’expression.
- source_word: πενίᾳ
  choice: pauvreté
  rationale: « Pauvreté » est l’équivalent direct et naturel de πενία.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: leur vie
  rationale: Le français emploie naturellement le pluriel après « ceux »; la note signale que le grec revient littéralement au singulier et que la construction exacte demeure difficile.
theological_decisions:
- issue: Valeur de ἐξάραι ὁ θεός
  choice: 'Souhait ou prière imprécatoire : « Que Dieu retranche… »'
  alternative: 'Infinitif dépendant du contexte : « pour que Dieu retranche… »'
  rationale: Sans verbe régissant conservé dans ce verset isolé, la lecture comme souhait rend naturellement la force imprécatoire tout en laissant l’autre analyse en note.
- issue: Rapport de « sa vie » au verbe
  choice: Comprendre « la vie » comme un second complément de « retranche »
  alternative: Comprendre la dernière séquence comme décrivant la condition dans laquelle les hypocrites vivent ou sont retranchés
  rationale: L’accusatif τὴν ζωήν favorise son rattachement direct à ἐξάραι, mais l’ordre des mots et les singuliers rendent la syntaxe abrupte; la note conserve cette difficulté.
translation_notes:
  register: Français international moderne, sobre et digne. Le texte principal privilégie une lecture intelligible, tandis que la note conserve le retour abrupt au singulier et l’ambiguïté syntaxique du grec.
