  yaml_path: translation/deuterocanon/psalms_of_solomon/004/023.yaml
  text: For he has laid waste many people’s households in disgrace[b][a], and scattered them by lust.
translation:
  language: fr
  text: Car il a dévasté dans le déshonneur les foyers[a] de beaucoup de gens, et il les a dispersés par convoitise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « maisons »; le mot peut aussi désigner les maisonnées ou les familles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par désir » ou « par passion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: a dévasté
  rationale: Le verbe exprime une destruction qui laisse dans la désolation; « dévasté » en conserve la force dans un français naturel.
- source_word: οἴκους
  choice: foyers
  rationale: Le terme signifie littéralement « maisons », mais peut désigner les maisonnées ou les familles qui y vivent. « Foyers » maintient cette double portée.
- source_word: ἀνθρώπων
  choice: de beaucoup de gens
  rationale: Le génitif est générique et ne requiert pas une référence exclusivement masculine; cette formulation rend naturellement l’idée en français.
- source_word: ἐν ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: Cette traduction garde la dimension sociale et morale de l’ἀτιμία sans préciser artificiellement si elle caractérise l’acte, l’état des foyers ou les deux.
- source_word: ἐσκόρπισεν
  choice: a dispersés
  rationale: Le verbe évoque directement l’action d’éparpiller ou de séparer. Le pronom reprend naturellement les « foyers », conformément au sens contextuel malgré l’absence d’objet exprimé en grec.
- source_word: ἐπιθυμίᾳ
  choice: par convoitise
  rationale: Le mot peut désigner le désir en général, mais le contexte de déshonneur favorise ici une nuance moralement négative. La note préserve les sens plus larges.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Foyers » évite de réduire οἴκους aux seuls bâtiments tout en conservant son image concrète; « dans le déshonneur » maintient l’ambiguïté syntaxique du grec.
