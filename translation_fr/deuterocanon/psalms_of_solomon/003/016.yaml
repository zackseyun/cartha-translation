  yaml_path: translation/deuterocanon/psalms_of_solomon/003/016.yaml
  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: fr
  text: Mais ceux qui craignent le Seigneur ressusciteront pour la vie éternelle, et leur vie dans la lumière du Seigneur ne cessera jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενοι
  choice: ceux qui craignent
  rationale: Le participe substantivé désigne un groupe caractérisé par une attitude durable envers Dieu. « Craignent » conserve le poids biblique de la crainte du Seigneur sans l’atténuer en simple révérence.
- source_word: κύριον / Κυρίου
  choice: le Seigneur / du Seigneur
  rationale: « Seigneur » est le correspondant naturel de κύριος lorsqu’il désigne Dieu dans ce texte grec.
- source_word: ἀναστήσονται
  choice: ressusciteront
  rationale: Le futur moyen peut signifier « se lèveront » ou « ressusciteront ». Avec « pour la vie éternelle », le contexte eschatologique favorise clairement le sens de résurrection, exprimé naturellement en français par « ressusciteront ».
- source_word: εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  rationale: εἰς indique ici la destination ou l’aboutissement. « Pour la vie éternelle » est idiomatique en français et s’accorde naturellement avec « ressusciteront ».
- source_word: ἐν φωτὶ Κυρίου
  choice: dans la lumière du Seigneur
  rationale: Cette traduction directe préserve l’image spatiale ou existentielle de la vie vécue dans la lumière qui vient du Seigneur.
- source_word: οὐκ ἐκλείψει ἔτι
  choice: ne cessera plus
  rationale: ἐκλείπω peut signifier manquer, défaillir, cesser ou prendre fin. Appliqué à la vie, « ne cessera plus » exprime clairement sa continuité désormais sans fin tout en reproduisant la valeur prospective de οὐκ…ἔτι.
theological_decisions:
- issue: Portée résurrectionnelle de ἀναστήσονται εἰς ζωὴν αἰώνιον
  choice: « ressusciteront pour la vie éternelle »
  alternative: « se lèveront pour la vie éternelle »
  rationale: Le verbe peut littéralement évoquer le fait de se lever, mais son association avec la vie éternelle indique très probablement une résurrection future. Le choix retenu rend ce sens naturel sans ajouter de voix passive absente du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en étant fluide. La répétition de « Seigneur » et de « vie » est conservée afin de respecter la structure et l’insistance du texte source.
