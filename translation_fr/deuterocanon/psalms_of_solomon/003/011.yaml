  yaml_path: translation/deuterocanon/psalms_of_solomon/003/011.yaml
  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
translation:
  language: fr
  text: Le pécheur a trébuché[a] et il maudit sa vie, le jour de sa naissance et les douleurs de l’accouchement de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a couru à sa perte ». Le verbe grec peut évoquer aussi bien le fait de trébucher qu’une chute figurée menant au malheur.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέκοψεν
  choice: a trébuché
  rationale: Le verbe προσκόπτω évoque d’abord le fait de trébucher ou de heurter un obstacle, et peut aussi désigner figurativement une chute funeste. « A trébuché » conserve cette image sans préciser à tort l’ampleur du désastre.
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Le substantif désigne directement une personne pécheresse. « Le pécheur » est l’équivalent français le plus simple et le plus fidèle.
- source_word: καταρᾶται
  choice: maudit
  rationale: Le verbe signifie prononcer une malédiction contre quelqu’un ou quelque chose. « Maudit » en restitue clairement la force.
- source_word: ζωὴν αὐτοῦ
  choice: sa vie
  rationale: L’objet de la malédiction est sa propre vie. « Sa vie » rend l’expression grecque avec naturel et concision.
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: le jour de sa naissance
  rationale: L’expression désigne le jour où il est né. Cette formulation reste proche du grec et garde un ton digne.
- source_word: ὠδῖνας μητρός
  choice: les douleurs de sa mère
  rationale: ὠδῖνες désigne les douleurs de l’enfantement. Dans ce contexte, « les douleurs de sa mère » est naturel, conserve l’image de l’accouchement et évite une lourdeur inutile.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des éléments est maintenu afin de préserver l’apposition grecque entre « sa vie » et « le jour de sa naissance et les douleurs de sa mère ».
