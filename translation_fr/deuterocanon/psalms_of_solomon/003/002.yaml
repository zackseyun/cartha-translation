  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: fr
  text: Chantez à Dieu, qui est digne de louange, un hymne et un chant de louange. Chante, et veille à l’égard de sa vigilance[a], car un psaume adressé à Dieu, issu d’un bon cœur, est bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est inhabituelle. On pourrait aussi traduire : « veille dans l’attente de sa veille », « sois vigilant en raison de sa vigilance » ou de manière semblable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  choice: un hymne et un chant de louange
  rationale: Cette formulation conserve les deux termes grecs et permet à « chantez » de régir naturellement deux compléments en français.
- source_word: ψάλλετε / ψάλλε
  choice: chantez / chante
  rationale: Le contexte cultuel favorise le sens de chanter; le passage du pluriel au singulier dans les impératifs est conservé.
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: pour Dieu, digne de louange
  rationale: αἰνετός peut désigner celui qui est loué ou qui mérite la louange; « digne de louange » est idiomatique et préserve cette seconde nuance.
- source_word: γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: veille en vue de sa vigilance
  rationale: La répétition étymologique entre le verbe et le nom est rendue autant que possible sans résoudre la relation inhabituelle exprimée par ἐπί.
- source_word: ψαλμός
  choice: psaume
  rationale: « Psaume » convient au cadre religieux et garde le caractère littéraire du terme grec.
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: venant d’un cœur bon
  rationale: La formulation conserve le sens élémentaire de ἀγαθός et évite d’introduire l’idée plus forte de pureté.
- source_word: ἀγαθὸς ... ἀγαθῆς
  choice: bon ... bon
  rationale: La répétition voulue du même adjectif grec est maintenue malgré sa légère tautologie en français.
theological_decisions:
- issue: Sens de la vigilance attribuée à Dieu
  choice: sa vigilance
  alternative: sa veille / le fait qu’il veille
  rationale: Le texte grec est inhabituel et ne précise pas exactement le rapport entre la vigilance humaine commandée et celle de Dieu; la traduction ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le balancement poétique, le changement du pluriel au singulier et la répétition de « bon » sont conservés. La tournure volontairement étrange sur la vigilance est signalée en note plutôt que normalisée.
