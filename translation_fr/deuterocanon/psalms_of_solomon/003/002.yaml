  rationale: La révision clarifie l’apposition qui qualifie Dieu et améliore la syntaxe française sans modifier le sens. Elle remplace une formulation susceptible de suggérer un but (« en vue de ») par une relation plus indéterminée, conformément à l’ambiguïté de la construction grecque, signalée par la note. La répétition « bon … bon », le registre et l’alternance des impératifs sont maintenus.
