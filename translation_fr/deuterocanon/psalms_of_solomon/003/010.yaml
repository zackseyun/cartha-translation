lexical_decisions:
- source_word: κύριος
  choice: le Seigneur
  rationale: Avec l’article grec, « le Seigneur » est le titre français naturel et conforme à l’usage biblique.
- source_word: καθαρίζει
  choice: purifie
  rationale: Le présent « purifie » conserve l’aspect verbal et la portée morale ou rituelle de καθαρίζω.
- source_word: πᾶν ἄνδρα
  choice: tout homme
  rationale: πᾶν avec le singulier ἄνδρα a un sens distributif. Le nom masculin explicite du grec est conservé.
- source_word: ὅσιον
  choice: fidèle
  rationale: Ici, ὅσιος qualifie une personne pieuse et loyale envers Dieu. « Fidèle » est naturel en français moderne tout en gardant cette nuance relationnelle; « pieux » reste possible.
- source_word: οἶκον
  choice: maison
  rationale: « Maison » préserve l’ambiguïté entre la demeure et la maisonnée, ainsi que la répétition lexicale d’οἶκος dans le contexte proche.
