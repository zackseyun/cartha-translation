  source_fidelity: La traduction suit à juste titre la leçon de Swete δίκαιος παιδευόμενος, plutôt que les formes manifestement discordantes reproduites dans le champ source. Elle conserve le juste comme sujet de la première proposition, le passif de παιδευόμενος, les deux occurrences de « Seigneur », et la formulation temporelle de διὰ παντός. « Son plaisir » rend de manière sobre εὐδοκία sans résoudre indûment la nuance exacte du terme.
