  yaml_path: translation/deuterocanon/psalms_of_solomon/003/004.yaml
  text: The righteous man will not disdain being disciplined by the Lord[c][b][a]; his delight is continually before the Lord.
translation:
  language: fr
  text: Le juste ne méprisera pas d’être corrigé par le Seigneur[a] ; son plaisir demeure constamment devant le Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni présente les formes grammaticalement discordantes δίκαιας παιδευόμενους. Le texte imprimé de Swete porte δίκαιος παιδευόμενος, « le juste, lorsqu’il est corrigé », leçon suivie ici.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « son bon plaisir est constamment devant le Seigneur ». Le possessif renvoie très probablement au juste, mais le grec ne le nomme pas de nouveau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος παιδευόμενος (le texte fourni présente les formes irrégulières δίκαιας παιδευόμενους)
  choice: Le juste… d’être corrigé
  rationale: La leçon nominative attestée dans l’édition de Swete donne « le juste » comme sujet et le participe passif exprime la correction formatrice reçue du Seigneur. La tournure française à l’infinitif est naturelle tout en conservant cette relation.
- source_word: ὀλιγωρήσει
  choice: ne méprisera pas
  rationale: ὀλιγωρέω signifie tenir pour peu, négliger ou mépriser. « Ne méprisera pas » convient à l’écho de Proverbes 3.11 et exprime ici le refus de faire peu de cas de la correction.
- source_word: εὐδοκία
  choice: plaisir
  rationale: Le nom peut désigner le bon plaisir, la satisfaction ou ce qui agrée. « Plaisir » reste sobre et naturel, sans préciser davantage la nature de cette disposition.
- source_word: διὰ παντός
  choice: constamment
  rationale: Cette locution marque la continuité dans le temps ; « constamment » en rend le sens dans un registre actuel et soutenu.
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: La traduction conserve directement l’image relationnelle et spatiale du grec.
- source_word: κυρίου / Κυρίου
  choice: Seigneur
  rationale: Dans ce contexte où κύριος désigne Dieu, « Seigneur » maintient l’usage biblique français et la répétition du texte.
theological_decisions:
- issue: Référent de αὐτοῦ dans « son plaisir »
  choice: Le possessif renvoie au juste, sans explicitation supplémentaire
  alternative: Comprendre le possessif comme renvoyant au Seigneur, ou lire « sa faveur » comme sujet de la première proposition d’après les formes irrégulières fournies
  rationale: Avec la leçon nominative δίκαιος παιδευόμενος de Swete, le juste est le sujet naturel de la première proposition et demeure l’antécédent le plus proche du possessif. La formulation française conserve néanmoins la forme possessive du grec sans ajouter une identification doctrinale.
- issue: Sens de la discipline divine
  choice: être corrigé par le Seigneur
  alternative: être instruit ou discipliné par le Seigneur
  rationale: παιδεύω réunit ici correction et formation. « Corrigé » convient au contexte sapientiel sans déterminer la forme ni la sévérité de l’action divine.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Le terme est employé en référence à Dieu ; « Seigneur » préserve la continuité du langage biblique sans ajout confessionnel.
translation_notes:
  register: Français international moderne, clair et digne. « Ne méprisera pas d’être corrigé » garde la tonalité sapientielle et l’écho de Proverbes 3.11. La répétition de « Seigneur » ainsi que le parallélisme des deux propositions sont conservés.
