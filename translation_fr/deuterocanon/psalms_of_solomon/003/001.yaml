lexical_decisions:
- source_word: Ἵνα τί
  choice: Pourquoi
  rationale: Rend naturellement l’interrogation qui exprime ici un reproche ou un appel au réveil.
- source_word: ὑπνοῖς
  choice: dors-tu
  rationale: Le présent actif à la deuxième personne du singulier est conservé dans une question directe et idiomatique.
- source_word: ψυχή
  choice: ô âme
  rationale: Le grec s’adresse directement à l’âme. La particule « ô » marque clairement cette apostrophe dans un registre digne, sans ajouter de possessif.
- source_word: εὐλογεῖς
  choice: bénis-tu
  rationale: « Bénir » conserve le sens cultuel d’εὐλογέω lorsque le Seigneur en est l’objet, ainsi que la diction biblique usuelle.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte d’adoration, « le Seigneur » est l’équivalent naturel et traditionnel de κύριος.
theological_decisions:
- issue: Possessif implicite avec ψυχή
  choice: Ne pas ajouter « mon »
  alternative: « ô mon âme »
  rationale: Le texte grec apostrophe l’âme directement, mais n’emploie aucun possessif. La traduction préserve cette formulation sans explicitation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion interrogative et l’apostrophe « ô âme » préservent la force rhétorique et poétique de l’original sans archaïsme excessif.
