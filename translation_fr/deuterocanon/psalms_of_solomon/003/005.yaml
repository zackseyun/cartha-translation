  text: The righteous man is attentive and will declare the Lord just; The righteous man is attentive and will vindicate the Lord; he falls, and he looks to see what God will do for him., and he looks to see what God will do for him.
translation:
  language: fr
  text: Le juste est attentif et reconnaîtra que le Seigneur est juste[a] ; il tombe et regarde ce que Dieu fera pour lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « justifiera le Seigneur » ; ou : « donnera raison au Seigneur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ce que Dieu fera à son égard ».'
    reason: dative_ambiguity
lexical_decisions:
- source_word: προσέχων
  choice: reste attentif
  rationale: Le participe décrit l’attitude vigilante et soutenue du juste. « Reste attentif » est naturel en français et n’impose pas l’idée d’une observation uniquement visuelle.
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé masculin singulier désigne ici la personne juste de manière représentative. « Le juste » est concis, courant dans le registre biblique français et fidèle à la forme grecque.
- source_word: δικαιώσει
  choice: reconnaîtra que … est juste
  rationale: Avec le Seigneur comme objet, le verbe signifie que le juste reconnaît ou affirme le bien-fondé de Dieu, non qu’il lui confère la justice. Cette formulation française exprime clairement ce sens tout en signalant en note la construction grecque plus littérale.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rendu révérenciel habituel de κύριος lorsqu’il désigne Dieu.
- source_word: ἔπεσεν
  choice: il tombe
  rationale: Bien que l’aoriste soit morphologiquement passé, le contexte décrit le comportement caractéristique du juste. Le présent français rend donc naturellement la valeur gnomique probable, tandis que la lecture événementielle reste indiquée en note.
- source_word: ἀποβλέπει
  choice: regarde
  rationale: Le verbe exprime un regard dirigé vers ce qui va se produire. Avec la proposition interrogative qui suit, « regarde ce que » conserve simplement cette attente attentive.
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: ce que Dieu fera pour lui
  rationale: Le datif αὐτῷ peut avoir une nuance bénéficiaire, particulièrement plausible dans le contexte proche de l’espérance du salut. Sa valeur plus neutre demeure possible et est conservée en note.
theological_decisions:
- issue: Le juste approuve-t-il la justice du Seigneur ou attend-il seulement son intervention ?
  choice: « reconnaîtra que le Seigneur est juste » exprime l’évaluation positive portée sur le Seigneur par le verbe δικαιώσει.
  alternative: « justifiera le Seigneur » ou « donnera raison au Seigneur »
  rationale: Le grec relie directement l’attention du juste à l’affirmation de la justice du Seigneur. Le texte principal évite de suggérer que l’être humain rend Dieu juste, tout en maintenant en note la formulation active et sa force juridique.
- issue: L’action future de Dieu est-elle favorable au juste ou simplement dirigée vers lui ?
  choice: « fera pour lui » retient la nuance bénéficiaire.
  alternative: « fera à son égard »
  rationale: Le contexte favorise l’espérance d’une intervention secourable, mais le datif grec ne tranche pas à lui seul ; la note préserve donc la lecture neutre ou potentiellement défavorable.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement grec sans reproduire une tournure juridiquement ou théologiquement trompeuse. Le présent « il tombe » présente la chute comme une situation caractéristique du juste, en accord avec le contexte.
