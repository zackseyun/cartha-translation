  text: He makes atonement for unintentional sin by fasting and humbling his soul[c][b][a];
translation:
  language: fr
  text: Il fait l’expiation pour une faute involontaire[a] par le jeûne et en humiliant son âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une ignorance »; dans ce contexte cultuel, il peut s’agir d’une faute ou d’un péché commis sans le savoir.'
    reason: lexical_alternative
  - marker: b
    text: « Humilier son âme » est une expression biblique qui peut évoquer l’abaissement volontaire, le renoncement à soi ou la mortification.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξιλάσατο
  choice: fait l’expiation
  rationale: Le verbe a ici une portée cultuelle d’expiation. Le présent rend naturellement la valeur gnomique probable de l’aoriste dans la description habituelle du juste, sans effacer l’ambiguïté temporelle.
- source_word: περὶ ἀγνοίας
  choice: pour une faute involontaire
  rationale: Dans ce contexte cultuel, ἀγνοία désigne vraisemblablement une faute commise sans le savoir plutôt que la simple ignorance; « faute » évite toutefois d’ajouter explicitement « péché » au grec.
- source_word: ἐν νηστείᾳ
  choice: par le jeûne
  rationale: La préposition ἐν exprime ici le moyen ou la manière; cette formulation est idiomatique en français et conserve le rôle instrumental du jeûne.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  choice: et en humiliant son âme
  rationale: La traduction conserve l’expression biblique concrète « humilier son âme », plutôt que de la réduire silencieusement à « s’humilier » ou « se mortifier ».
theological_decisions:
- issue: Valeur de l’expiation accomplie par le jeûne et l’humiliation
  choice: Conserver l’énoncé tel quel, sans préciser son mécanisme théologique
  alternative: Paraphraser comme une démarche de repentance ou d’auto-mortification
  rationale: Le grec associe directement l’expiation au jeûne et à l’humiliation de l’âme. Une explicitation doctrinale résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et lisible. « Faire l’expiation » préserve le poids cultuel du verbe grec; « faute involontaire » en explicite sobrement le sens contextuel. La tournure « humilier son âme » est volontairement conservée pour maintenir la texture biblique.
