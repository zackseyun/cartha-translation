  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: fr
  text: Les justes se souviendront sans cesse du Seigneur, en lui rendant grâce[a] et en reconnaissant comme justes les jugements du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en le louant », ou encore « en confessant » ; le mot grec peut désigner l’action de grâce, la louange ou la confession selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « dans la justification — ou la défense — des jugements du Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: les justes
  rationale: L’adjectif substantivé désigne les personnes caractérisées par la justice. « Les justes » est une formulation française concise, courante dans le registre biblique et fidèle à la portée morale du grec.
- source_word: μνημονεύσουσιν
  choice: se souviendront
  rationale: Le futur exprime ici le souvenir durable du Seigneur. « Se souviendront » rend directement le sens le plus naturel, sans imposer la nuance publique possible de « feront mention ».
- source_word: διὰ παντός
  choice: sans cesse
  rationale: Cette locution idiomatique exprime la continuité. « Sans cesse » est naturel en français moderne et conserve la force durative du grec.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: « Seigneur » restitue le titre κύριος conformément à son emploi théologique dans la langue biblique grecque.
- source_word: ἐν ἐξομολογήσει
  choice: en lui rendant grâce
  rationale: Dans le grec biblique et psalmique, ἐξομολόγησις peut désigner l’action de grâce, la louange ou la confession. Ici, « rendre grâce » convient au contexte tout en laissant les autres valeurs dans une note.
- source_word: δικαιώσει
  choice: en reconnaissant comme justes
  rationale: Le terme évoque la justification ou la confirmation de la justice. Appliqué aux jugements du Seigneur, il indique que les justes en attestent la rectitude. Cette formulation évite l’ambiguïté française de « justifier », qui pourrait suggérer qu’ils cherchent à les excuser.
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: les jugements du Seigneur
  rationale: κρίματα désigne des décisions ou actes judiciaires. « Les jugements du Seigneur » conserve clairement ce sens sans explicitation excessive.
theological_decisions:
- issue: Rapport des justes aux jugements divins
  choice: « en reconnaissant comme justes les jugements du Seigneur »
  alternative: « dans la justification des jugements du Seigneur »
  rationale: La traduction exprime l’approbation de leur justice sans suggérer que les humains confèrent eux-mêmes leur légitimité aux jugements divins. Elle garde néanmoins l’idée forte de δικαίωσις, plutôt que de l’affaiblir en simple acceptation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme dévotionnel du grec tout en évitant les tours abstraits ou équivoques qui paraîtraient artificiels en français.
