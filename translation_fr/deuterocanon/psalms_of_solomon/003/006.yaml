lexical_decisions:
- source_word: ἀποσκοπεύει
  choice: il veille pour voir
  rationale: Le verbe exprime un regard attentif et soutenu, avec une nuance d’attente. « Veille pour voir » rend naturellement cette idée en français moderne.
- source_word: ὅθεν
  choice: d’où
  rationale: L’adverbe indique l’origine ou la provenance; « d’où » en conserve directement la force.
- source_word: ἥξει
  choice: viendra
  rationale: Le futur de ἥκω exprime ici la venue ou l’arrivée; « viendra » est idiomatique avec « salut ».
- source_word: σωτηρία
  choice: salut
  rationale: « Salut » est l’équivalent religieux le plus large et préserve la portée potentiellement spirituelle ou concrète du terme grec.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif est rendu comme complément de destination avec « viendra », au plus près de la construction grecque.
