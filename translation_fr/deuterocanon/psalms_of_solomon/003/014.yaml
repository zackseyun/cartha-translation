translation:
  language: fr
  text: et il ne sera absolument plus gardé en mémoire quand il visitera les justes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas le référent de « il ne sera… gardé en mémoire ». Il peut s’agir du pécheur ; une autre lecture le rapporte à sa destruction, mentionnée dans le contexte précédent.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « quand il visitera les justes ». Le sujet n’est pas exprimé ; dans le contexte, il est probablement Dieu. Le verbe peut aussi signifier « prendre soin de » ou « intervenir en faveur de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: ne… absolument aucun
  rationale: La tournure négative renforcée exprime une négation emphatique; « absolument aucun » en restitue naturellement la force en français moderne.
- source_word: μνησθήσεται
  choice: il ne restera… aucun souvenir de lui
  rationale: Cette formulation française naturelle rend le passif « ne sera pas rappelé / ne sera pas gardé en mémoire » tout en désignant le pécheur comme référent implicite, conformément à la continuité du contexte antérieur.
- source_word: ἐπισκέπτηται
  choice: visitera
  rationale: « Visiter » reste proche du grec et conserve la richesse biblique du verbe, qui peut impliquer une intervention attentive ou bienveillante.
- source_word: δικαίους
  choice: les justes
  rationale: « Les justes » est la formulation directe, traditionnelle et encore intelligible dans ce contexte moral et religieux.
- source_word: implicit subject of ἐπισκέπτηται
  choice: Dieu
  rationale: Le sujet de la visitation des justes est naturellement compris comme Dieu dans l'idiome biblique; l'expliciter évite qu'en français le pronom renvoie fautivement au pécheur, tout en signalant cette suppléance par une note.
theological_decisions:
- issue: Référent implicite de μνησθήσεται
  choice: le pécheur, rendu par « de lui »
  alternative: la destruction du pécheur (« elle ne sera absolument pas rappelée »)
  rationale: La suite des verbes du contexte décrit le sort du pécheur, et l'idée que son souvenir disparaît correspond à l'idiome biblique. Comme le grec omet le sujet et permet une autre analyse grammaticale, l'ambiguïté est conservée en note.
- issue: Sujet implicite de ἐπισκέπτηται
  choice: Dieu
  alternative: le pécheur (« quand il visitera les justes »)
  rationale: La visitation des justes a vraisemblablement Dieu pour agent. L'explicitation produit un français clair sans déterminer le caractère précis de cette visitation.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « il ne restera absolument aucun souvenir de lui » évite un passif lourd, tandis que « visitera » préserve le vocabulaire biblique et son amplitude sémantique.
