  source_fidelity: 'Le grec porte une négation emphatique (οὐ μή) et le passif μνησθήσεται, « ne sera absolument pas rappelé / ne sera plus en mémoire ». La formulation proposée « il ne restera absolument aucun souvenir de lui » interprète de façon recevable le référent comme le pécheur, mais elle transforme le passif en une tournure plus paraphrastique. Surtout, le sujet de ἐπισκέπτηται n’est pas exprimé : « Dieu » est contextuellement probable, mais son ajout dans le texte principal réduit une ambiguïté syntaxique que l’original conserve.'
  naturalness: « Il ne restera absolument aucun souvenir de lui » est naturel, mais un peu lourd. « Il ne sera absolument plus gardé en mémoire » est fluide en français moderne et rend directement le passif grec. Le pronom « il » de « quand il visitera » est grammaticalement ambigu en français ; une note peut indiquer l’identification contextuelle probable du visiteur à Dieu sans l’imposer dans le texte.
  terminology: '« Les justes » et « visiter » conviennent au registre biblique moderne. « Gardé en mémoire » rend naturellement μνησθήσεται. La note doit corriger l’alternative : elle concerne le référent implicite de « il », non une traduction féminine isolée (« elle ne sera pas rappelée »), laquelle n’est pas suffisamment claire sans rappeler « sa destruction ».'
