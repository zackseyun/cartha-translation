base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/008.yaml
  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
translation:
  language: fr
  text: Le juste examine sans cesse sa maison[a], afin d’éliminer le mal lorsqu’il commet une faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veille sans cesse sur sa maison ». Le mot grec évoque ici une surveillance active ou un examen attentif.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans sa faute »; on peut aussi comprendre : « à cause de sa faute ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισκέπτεται
  choice: examine
  rationale: Dans le contexte de sa propre maison, le verbe exprime une surveillance active et un examen attentif, plutôt qu’une simple visite.
- source_word: διὰ παντός
  choice: sans cesse
  rationale: Cette locution marque une action continue ou habituelle; « sans cesse » est naturel et conserve cette valeur durative.
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: Le singulier désigne ici une personne juste prise comme exemple moral; « le juste » est idiomatique en français et respecte la forme grecque.
- source_word: τὸν οἶκον αὐτοῦ
  choice: sa maison
  rationale: Le terme peut désigner la demeure ou la maisonnée; « maison » conserve cette amplitude en français.
- source_word: τοῦ ἐξᾶραι
  choice: afin d’éliminer
  rationale: L’infinitif articulé exprime le but. « Afin d’éliminer » rend clairement cette relation et le sens de retrait.
- source_word: ἀδικίαν
  choice: le mal
  rationale: Dans ce cadre moral, ἀδικία désigne plus largement ce qui est mauvais ou injuste, et non la seule injustice sociale.
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: lorsqu’il commet une faute
  rationale: La formule grecque, littéralement « dans sa faute », peut indiquer la circonstance où le juste agit contre le mal. La traduction temporelle est naturelle tout en maintenant que la faute peut être la sienne.
theological_decisions:
- issue: Le juste peut-il lui-même commettre une faute ?
  choice: La traduction permet de comprendre que le juste commet une faute, puis agit pour éliminer le mal.
  alternative: Laisser indéterminé l’auteur de la faute, ou suggérer que le juste est exempt de toute faute.
  rationale: Le possessif αὐτοῦ renvoie le plus naturellement au juste. La tension entre sa qualité de juste et la possibilité d’une faute est donc conservée plutôt qu’effacée.
- issue: Portée de « sa maison »
  choice: Conserver « maison », qui peut évoquer aussi bien la demeure que la maisonnée.
  alternative: Préciser uniquement « foyer » ou uniquement « maisonnée ».
  rationale: Le grec οἶκος possède cette latitude; le contexte ne contraint pas à choisir exclusivement le bâtiment ou les personnes qui en dépendent.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste accessible tout en conservant l’ambiguïté de « maison » et la tension théologique selon laquelle le juste peut commettre une faute et y remédier.
