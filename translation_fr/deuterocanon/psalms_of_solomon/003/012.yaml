  text: Il a ajouté péchés sur péchés à sa vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a ajouté péchés sur péchés dans sa vie. »'
    reason: Le datif τῇ ζωῇ αὐτοῦ peut aussi désigner le cadre dans lequel les péchés se sont accumulés.
lexical_decisions:
- source_word: προσεθήκεν
  choice: a ajouté
  rationale: L’aoriste de προστίθημι exprime simplement l’action d’ajouter; cette formulation conserve l’image cumulative sans la paraphraser.
- source_word: ἁμαρτίας ἐφʼ ἁμαρτίαις
  choice: péchés sur péchés
  rationale: Le double pluriel grec est maintenu, notamment parce qu’il peut marquer une intensification par rapport au singulier employé ailleurs. « Sur » rend naturellement l’idée d’accumulation portée par ἐπί.
- source_word: τῇ ζωῇ αὐτοῦ
  choice: à sa vie
  rationale: Le datif peut fonctionner comme complément indirect de « a ajouté ». Cette traduction préserve aussi le lien lexical avec la mention de sa vie au verset précédent.
