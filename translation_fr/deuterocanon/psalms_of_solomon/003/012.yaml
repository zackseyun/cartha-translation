translation_notes:
  register: Français moderne, sobre et digne. La tournure légèrement marquée « péchés sur péchés » conserve le double pluriel et la force cumulative du grec; « à sa vie » privilégie l’analyse du datif comme complément indirect, tandis que la note maintient l’autre lecture grammaticale réelle.
