  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: fr
  text: Il est tombé, car sa chute[a] est terrible, et il ne se relèvera pas. La destruction du pécheur est pour toujours[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot grec rendu par « chute » peut aussi désigner un cadavre; la clause pourrait alors se comprendre : « car son cadavre est abject ».'
