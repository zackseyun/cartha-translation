lexical_decisions:
- source_word: ἔπεσεν
  choice: Il est tombé
  rationale: Le passé composé exprime naturellement en français une chute accomplie dont les conséquences demeurent, ce que confirme l’impossibilité de se relever.
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: sa chute est terrible
  rationale: La reprise « tombé/chute » rend le jeu étymologique ἔπεσεν/πτῶμα. Dans ce contexte, πονηρός qualifie vraisemblablement la gravité funeste de la chute plutôt que sa valeur morale; « terrible » reste naturel tout en conservant sa forte tonalité négative.
- source_word: ἀνιστήσεται
  choice: il ne se relèvera pas
  rationale: « Se relever » correspond directement à la chute évoquée et n’ajoute pas explicitement l’idée de « de nouveau », absente du grec.
- source_word: ἀπώλεια
  choice: destruction
  rationale: « Destruction » conserve la force du terme grec et évite le registre ecclésiastique de « perdition », tandis que « ruine » serait légèrement moins fort.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression française courante rend ici la permanence du jugement sans imposer la formulation plus abstraite « éternelle ».
theological_decisions:
- issue: Portée de l’impossibilité de se relever
  choice: Ne pas préciser s’il s’agit seulement d’une chute irréversible ou d’une allusion à la résurrection.
  alternative: Traduire « il ne ressuscitera pas ».
  rationale: ἀνίστημι peut prendre une portée résurrectionnelle, mais l’association immédiate avec ἔπεσεν et πτῶμα permet aussi le sens ordinaire de se relever. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition « tombé/chute » est volontaire afin de refléter l’écho lexical grec. La virgule finale est conservée parce que le verset se poursuit dans la source.
