  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: fr
  text: La vérité[a] des justes vient de Dieu, leur sauveur ; le péché, s’ajoutant au péché, ne loge pas dans la maison d’un juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La fidélité des justes » ou « L’intégrité des justes ». Le mot grec traduit par « vérité » peut désigner ici leur caractère vrai et droit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: vérité
  rationale: « Vérité » est le correspondant français le plus direct et conserve l’ampleur sémantique du grec, qui peut désigner ici la droiture vraie ou la fidélité des justes, sans réduire le terme à la seule sincérité du discours.
- source_word: παρὰ θεοῦ
  choice: vient de Dieu
  rationale: Avec le génitif, παρά indique ici la source ou l’origine. « Vient de Dieu » exprime clairement ce rapport en français courant.
- source_word: σωτῆρος αὐτῶν
  choice: leur sauveur
  rationale: σωτήρ désigne celui qui sauve ou délivre. « Sauveur » respecte le registre religieux du passage sans ajouter de précision absente du grec.
- source_word: αὐλίζεται
  choice: s’installe
  rationale: Le verbe évoque le fait de passer la nuit, de loger ou de camper. « S’installe » conserve l’image d’un péché qui trouverait durablement place dans la maison, tout en restant naturel en français.
- source_word: ἐν οἴκῳ δικαίου
  choice: dans la maison d’un juste
  rationale: Le singulier indéfini δικαίου est conservé. Le substantif français « un juste » rend la forme masculine sans ajouter le mot « homme », absent du grec.
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: le péché ne s’installe pas, péché sur péché
  rationale: La reprise « péché sur péché » préserve l’effet d’accumulation du grec. Son placement détaché rend la tournure intelligible en français sans la transformer en simple paraphrase telle que « un péché après l’autre ».
theological_decisions:
- issue: Portée de ἀλήθεια appliqué aux justes
  choice: vérité
  alternative: fidélité ou intégrité
  rationale: Le contexte éthique permet une lecture plus concrète, mais le grec garde une certaine ouverture. Le texte principal retient le sens lexical direct et la note signale les nuances contextuelles possibles sans imposer une lecture confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est conservé, ainsi que la métaphore domestique du péché qui ne trouve pas à s’installer et l’expression cumulative « péché sur péché ».
