base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/008.yaml
  text: For he will admonish a righteous man as a beloved son[c][b][a], and his discipline is like that of a firstborn.
translation:
  language: fr
  text: Car il reprendra un juste comme un fils bien-aimé[a], et sa discipline sera comme celle d’un premier-né[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un fils d’amour ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et son instruction, comme celle d’un premier-né ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νουθετήσει
  choice: il reprendra
  rationale: Le futur de νουθετέω exprime ici un avertissement correctif ou une exhortation destinée à ramener quelqu’un dans la bonne voie. « Reprendre » est naturel en français et convient au contexte de discipline paternelle.
- source_word: δίκαιον
  choice: un juste
  rationale: L’adjectif substantivé est masculin singulier et dépourvu d’article. « Un juste » maintient ce singulier représentatif et s’accorde avec les images singulières du fils et du premier-né.
- source_word: υἱὸν ἀγαπήσεως
  choice: un fils bien-aimé
  rationale: Le génitif ἀγαπήσεως est compris comme qualitatif. « Fils bien-aimé » transmet naturellement l’idée d’un fils qui fait l’objet d’un amour particulier, sans conserver un calque grec peu idiomatique.
- source_word: παιδεία
  choice: discipline
  rationale: Dans ce cadre paternel, παιδεία désigne une formation corrective, et non un simple enseignement. « Discipline » conserve à la fois l’idée de correction et celle de formation.
- source_word: πρωτοτόκου
  choice: premier-né
  rationale: L’adjectif substantivé évoque le statut particulier du premier-né. Le français permet le même emploi substantivé sans qu’il soit nécessaire d’ajouter « fils ».
theological_decisions:
- issue: Référent et portée de αὐτοῦ dans καὶ ἡ παιδεία αὐτοῦ
  choice: sa discipline
  alternative: la discipline qu’il lui impose
  rationale: Le possessif grec peut se comprendre comme la discipline qui concerne le juste ou comme celle exercée par le sujet implicite. Le possessif français conserve cette légère ambiguïté au lieu de fixer explicitement les rôles.
translation_notes:
  register: Français moderne, digne et lisible. « Reprendre » garde la nuance d’exhortation corrective sans archaïsme marqué. La seconde proposition conserve le parallélisme elliptique du grec tout en ajoutant « sera », nécessaire à une formulation française fluide.
