  text: For the discipline of the righteous in ignorance is not like the destruction of the sinner[c][b][a];
translation:
  language: fr
  text: Car la correction des justes dans l’ignorance[a] ne ressemble pas à la destruction du pécheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « la correction des justes pour des actes commis par ignorance » ou « quand ils agissent par ignorance ».'
    reason: ambiguïté lexicale et syntaxique
  - marker: b
    text: Une variante du texte porte « des pécheurs » à la place de « des justes » dans la première proposition.
    reason: variante textuelle
lexical_decisions:
- source_word: οὐχ ὁμοία
  choice: n’est pas comparable à
  rationale: Cette tournure française exprime naturellement le contraste de nature posé par le grec, sans réduire celui-ci à une simple différence de degré.
- source_word: παιδεία
  choice: correction
  rationale: Dans ce contexte, le terme désigne une intervention corrective plutôt qu’une simple instruction. « Correction » fait ressortir ce sens tout en maintenant le contraste avec la destruction.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: Le génitif désigne ici la catégorie des personnes justes. « Les justes » est une formulation biblique claire et courante en français.
- source_word: ἐν ἀγνοίᾳ
  choice: dans l’ignorance
  rationale: 'La formulation littérale conserve l’ambiguïté syntaxique et sémantique du grec : elle peut évoquer l’état d’ignorance des justes ou des actes commis sans savoir. Une note présente l’interprétation plus explicite sans l’imposer dans le texte.'
- source_word: καταστροφὴ
  choice: destruction
  rationale: Le mot dénote une ruine catastrophique. « Destruction » préserve la force du contraste avec la correction.
- source_word: τοῦ ἁμαρτωλοῦ
  choice: du pécheur
  rationale: Le singulier substantivé est conservé et représente la catégorie morale opposée aux justes.
theological_decisions:
- issue: Nature de l’épreuve subie par les justes
  choice: Le texte oppose leur correction à la destruction du pécheur.
  alternative: Comprendre παιδεία dans un sens plus général d’éducation ou de discipline.
  rationale: Le contraste explicite avec καταστροφή indique une intervention corrective qui n’a pas la même nature que la ruine du pécheur, sans préciser davantage la doctrine sous-jacente.
- issue: Portée de l’expression ἐν ἀγνοίᾳ
  choice: Maintenir « dans l’ignorance » dans le texte principal.
  alternative: Traduire explicitement « pour des fautes commises par ignorance » ou « lorsqu’ils agissent par ignorance ».
  rationale: Le grec ne nomme pas expressément des fautes et ne précise pas sans ambiguïté le lien syntaxique de l’expression. La traduction principale conserve donc cette tension, tandis que la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la structure antithétique du grec. « Dans l’ignorance » demeure volontairement légèrement opaque afin de ne pas trancher une ambiguïté réelle du texte source.
