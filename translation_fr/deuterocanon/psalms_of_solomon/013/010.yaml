  text: But sinners will be taken away to destruction[b][a], and no remembrance of them will be found any longer.
translation:
  language: fr
  text: Mais les pécheurs seront emportés[a] vers la destruction, et l’on ne trouvera plus aucun souvenir d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront enlevés » ou « seront ôtés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « on ne trouvera plus aucun mémorial en leur mémoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: Le substantif désigne directement ceux qui sont caractérisés par le péché. « Les pécheurs » en conserve le sens simple sans introduire la catégorie plus interprétative de « méchants ».
- source_word: ἀρθήσονται
  choice: seront emportés
  rationale: Le futur passif de αἴρω exprime ici le fait d’être enlevé ou ôté. « Seront emportés » convient au contexte de jugement tout en gardant l’idée fondamentale de déplacement ou de suppression.
- source_word: εἰς ἀπώλειαν
  choice: vers la destruction
  rationale: ἀπώλεια évoque la destruction ou la ruine. « Vers la destruction » conserve la direction exprimée par εἰς et la gravité du propos, sans recourir au terme théologiquement chargé « perdition ».
- source_word: μνημόσυνον
  choice: souvenir
  rationale: Le mot peut désigner le souvenir ou ce qui perpétue la mémoire d’une personne. « Souvenir » est naturel en français dans cette construction, tandis que la note préserve la possibilité de « monument commémoratif ».
- source_word: ἔτι
  choice: plus
  rationale: Avec la négation et le futur, « ne… plus » exprime naturellement en français la cessation durable indiquée par ἔτι.
