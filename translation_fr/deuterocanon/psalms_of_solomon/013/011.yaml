base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/011.yaml
  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
translation:
  language: fr
  text: Mais la miséricorde du Seigneur repose sur les fidèles[a], et sa miséricorde sur ceux qui le craignent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes pieuses » ; le grec désigne ceux qui se distinguent par leur piété et leur fidélité envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « ceux qui le révèrent », mais le grec conserve le langage biblique plus fort de la crainte de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσίους
  choice: les fidèles
  rationale: Dans les Psaumes de Salomon, ὅσιοι désigne les personnes attachées à Dieu par leur piété et leur loyauté. « Les fidèles » rend naturellement cette identité collective sans la confondre avec ἅγιοι ni importer les connotations ecclésiastiques possibles de « saints ».
- source_word: ἔλεος
  choice: miséricorde
  rationale: « Miséricorde » traduit directement ἔλεος et convient aux deux occurrences, tout en conservant sa tonalité religieuse et relationnelle.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est le rendu français traditionnel et naturel de κύριος dans ce contexte divin.
- source_word: φοβουμένους
  choice: ceux qui le craignent
  rationale: Ce choix maintient l'expression biblique forte de la crainte de Dieu, qui comprend la révérence sans se réduire à la simple peur ni être adoucie en « respecter ».
- source_word: ἐπὶ
  choice: repose sur
  rationale: Avec ἔλεος, cette formulation française exprime naturellement que la miséricorde divine s'étend aux groupes mentionnés, sans modifier le rapport syntaxique.
theological_decisions:
- issue: Faut-il adoucir la crainte de Dieu en simple révérence ?
  choice: ceux qui le craignent
  alternative: ceux qui le révèrent
  rationale: Le grec garde le langage biblique de la crainte de Dieu. « Craignent » en préserve la force et la tension théologique.
- issue: Comment désigner le groupe exprimé par ὁσίους ?
  choice: les fidèles
  alternative: les personnes pieuses / les saints
  rationale: « Les fidèles » conserve l'idée d'un groupe caractérisé par sa piété et sa loyauté envers Dieu, sans assimiler automatiquement ὅσιοι aux « saints ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et la répétition de « miséricorde » sont conservées. « Repose sur » évite un calque maladroit de ἐπί tout en gardant l'image relationnelle du texte.
