  yaml_path: translation/deuterocanon/psalms_of_solomon/013/004.yaml
  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
translation:
  language: fr
  text: L’impie a été bouleversé à cause de ses fautes, de peur d’être emporté avec les pécheurs.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « non pas lorsqu’il est emporté avec les pécheurs ». La construction grecque μὴ ὅτε συμπαραληφθῇ est syntaxiquement difficile ; le texte retient ici le sens préventif : « de peur d’être emporté ».'
    reason: alternative_reading
  - marker: b
    text: « Être emporté » peut aussi se traduire par « être entraîné » ou « être pris avec les autres », ce qui souligne le jugement partagé avec les pécheurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: a été bouleversé
  rationale: Le passif de ταράσσω exprime ici un trouble profond ou un ébranlement. « A été bouleversé » reste naturel en français sans préciser indûment s’il s’agit d’une émotion, d’une situation ou d’un jugement.
- source_word: ὁ ἀσεβής
  choice: l’impie
  rationale: ἀσεβής désigne celui qui manque de révérence envers Dieu. « L’impie » conserve cette dimension religieuse et éthique dans un registre biblique encore intelligible.
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: à cause de ses fautes
  rationale: διά avec l’accusatif a ici une valeur causale. παραπτώματα désigne des écarts ou manquements concrets ; « fautes » est clair et actuel, sans atténuer leur portée morale.
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: de peur d’être emporté
  rationale: La construction grecque est difficile et condensée. Le sens préventif de μή fournit l’enchaînement le plus cohérent, tandis que « être emporté » rend l’idée d’être entraîné avec d’autres dans un jugement commun.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: avec les pécheurs
  rationale: La formule indique une destinée partagée lors du jugement. « Avec les pécheurs » est concise et fidèle, la valeur collective étant déjà renforcée par συμπαραληφθῇ.
theological_decisions:
- issue: Valeur syntaxique de μὴ ὅτε συμπαραληφθῇ
  choice: 'Lecture préventive : « de peur d’être emporté »'
  alternative: « non pas lorsqu’il est emporté avec les pécheurs »
  rationale: Le grec permet difficilement une analyse certaine. Le texte principal retient la lecture qui relie le trouble de l’impie à la crainte du jugement, tout en signalant l’autre analyse en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. « L’impie » maintient la nuance religieuse de ἀσεβής ; « fautes » évite un archaïsme inutile. La syntaxe reste fluide tout en conservant en notes l’incertitude réelle du grec.
