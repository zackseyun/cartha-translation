  text: Savage beasts rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us. rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us.
translation:
  language: fr
  text: Des bêtes féroces se ruèrent sur eux ; avec leurs dents, elles arrachaient leur chair, et avec leurs molaires, elles broyaient leurs os ; et de tout cela, le Seigneur nous a délivrés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία … πονηρά
  choice: des bêtes féroces
  rationale: « Féroces » rend ici naturellement la nocivité et la violence exprimées par πονηρά, plutôt que le sens moral étroit de « mauvaises ».
- source_word: ἐπέδραμοσαν
  choice: se ruèrent sur
  rationale: Le verbe exprime une attaque soudaine et violente ; « se ruèrent sur » conserve cette force.
- source_word: ἔτιλλον σάρκας
  choice: arrachaient leur chair
  rationale: ἔτιλλον désigne l’action d’arracher ou de déchirer ; l’imparfait français restitue l’aspect duratif de l’imparfait grec.
- source_word: ἐν ταῖς μυλαῖς
  choice: de leurs molaires
  rationale: μύλαι désigne littéralement les dents qui broient, donc les molaires.
- source_word: ἔθλων ὀστᾶ
  choice: broyaient leurs os
  rationale: Le verbe évoque l’écrasement ou le broyage, image renforcée par la mention des molaires.
- source_word: ἐκ τούτων ἁπάντων
  choice: de tous ces dangers
  rationale: Le démonstratif renvoie aux attaques décrites ; « dangers » explicite sobrement le référent sans reproduire le calque peu naturel « toutes ces choses ».
- source_word: ἐρρύσατο
  choice: a délivrés
  rationale: Le verbe signifie tirer hors du danger, secourir ou délivrer ; « délivrés » convient au registre biblique moderne.
theological_decisions:
- issue: Référent des bêtes féroces
  choice: Conserver l’image sans identifier les bêtes à des adversaires humains ou spirituels.
  alternative: Interpréter explicitement les bêtes comme une métaphore d’ennemis humains.
  rationale: Le verset ne tranche pas lui-même entre description et métaphore ; la traduction préserve donc cette ouverture.
- issue: Valeur de Κύριος
  choice: « le Seigneur »
  alternative: « YHWH » ou « l’Éternel »
  rationale: Le texte grec transmis porte Κύριος sans nom divin explicite ; « le Seigneur » traduit directement cette forme sans rétroversion conjecturale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme violent est maintenu, avec des verbes concrets. « Mais » marque naturellement le contraste conclusif porté par καί dans le contexte.
