base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/001.yaml
  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
translation:
  language: fr
  text: La main droite du Seigneur m’a couvert[a] ; la main droite du Seigneur nous a épargnés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a abrité » ou « m’a protégé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a eu pitié de nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  choice: la main droite
  rationale: Le féminin substantivé sous-entend « main » ; cette expression naturelle en français biblique conserve l’image de la puissance protectrice.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le génitif exprime ici la possession. « Seigneur » est l’équivalent français usuel de κύριος dans ce contexte.
- source_word: ἐσκέπασέν
  choice: m’a couvert
  rationale: Le verbe signifie d’abord couvrir, avec ici une valeur protectrice. La traduction formelle préserve l’image grecque sans en réduire le sens à une seule interprétation.
- source_word: με
  choice: m’
  rationale: Pronom objet à la première personne du singulier.
- source_word: ἐφείσατο
  choice: a épargnés
  rationale: Le verbe exprime le fait de préserver quelqu’un du mal ou de la destruction ; « épargner » est direct et idiomatique.
- source_word: ἡμῶν
  choice: nous
  rationale: Bien que le grec emploie le génitif régi par φείδομαι, le français exige le pronom objet « nous ».
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est la traduction consacrée et naturelle dans ce contexte religieux ; rien dans le verset ne justifie « Maître ».
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est conservé par la répétition de « la main droite du Seigneur ». « Couvert » maintient l’image concrète du grec, tandis que la note explicite sa portée protectrice.
