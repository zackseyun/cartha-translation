  yaml_path: translation/deuterocanon/psalms_of_solomon/013/002.yaml
  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: fr
  text: Le bras du Seigneur nous a sauvés de l’épée qui passait[a], de la famine et de la mort des pécheurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’épée qui passait à travers ». L’espace traversé n’est pas précisé en grec.'
    reason: alternative_reading
  - marker: b
    text: 'Ou peut-être : « de la mort destinée aux pécheurs » ou « de la mort causée par les pécheurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχίων
  choice: bras
  rationale: Conserve l’image corporelle concrète du grec, qui exprime la puissance salvatrice du Seigneur sans l’abstraire en « force » ou « puissance ».
- source_word: Κυρίου
  choice: Seigneur
  rationale: Rend naturellement le titre divin κύριος sans introduire une convention typographique liée au nom divin hébreu.
- source_word: ἔσωσεν
  choice: a sauvés
  rationale: Équivalent direct de l’aoriste, naturel en français et porteur de la dimension religieuse de la délivrance.
- source_word: ῥομφαίας
  choice: l’épée
  rationale: Terme usuel et précis pour cette arme; l’article défini convient à la menace caractérisée par le participe qui suit.
- source_word: διαπορευομένης
  choice: qui traversait le pays
  rationale: Le participe indique un déplacement à travers un espace. « Traversait » en restitue directement le mouvement; « le pays » explicite en français le complément spatial laissé implicite en grec, et cette explicitation est signalée en note.
- source_word: λιμοῦ
  choice: famine
  rationale: Dans cette série de calamités collectives, « famine » correspond mieux à l’échelle du désastre que « faim ».
- source_word: θανάτου
  choice: mort
  rationale: Rendu lexicalement direct, sans élargir le sens en « destruction ».
- source_word: ἁμαρτωλῶν
  choice: des pécheurs
  rationale: Préserve le génitif compact du grec et son ambiguïté au lieu d’imposer dans le texte une relation causale ou bénéficiaire.
theological_decisions:
- issue: Relation du génitif dans θανάτου ἁμαρτωλῶν
  choice: la mort des pécheurs
  alternative: la mort destinée aux pécheurs; la mort causée par les pécheurs
  rationale: Le génitif grec ne précise pas explicitement la relation. Le texte principal conserve donc la formulation la plus transparente, tandis que la note présente les principales lectures possibles sans trancher.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore biblique du « bras du Seigneur » est conservée. La syntaxe reste proche du grec tout en explicitant discrètement le complément spatial nécessaire à une formulation française naturelle; l’ambiguïté théologique du dernier génitif est maintenue et documentée.
