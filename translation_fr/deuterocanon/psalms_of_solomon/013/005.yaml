  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: fr
  text: Car la destruction du pécheur est terrible, et pas une seule de toutes ces choses ne touchera le juste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: terrible
  rationale: « Terrible » rend naturellement la gravité alarmante de l’adjectif grec et qualifie la ruine elle-même.
- source_word: καταστροφή
  choice: ruine
  rationale: « Ruine » exprime ici l’anéantissement ou le renversement désastreux du pécheur sans imposer un contexte militaire.
- source_word: ἁμαρτωλοῦ
  choice: du pécheur
  rationale: Le singulier substantivé est conservé dans une formulation française directe et traditionnelle, sans ajout explicatif.
- source_word: ἅψεται
  choice: ne touchera
  rationale: Le verbe garde son image concrète de contact tout en exprimant qu’aucun des malheurs évoqués n’atteindra le juste.
- source_word: δικαίου
  choice: le juste
  rationale: Le singulier représentatif désigne la catégorie morale du juste; cette tournure est idiomatique et ne précise pas inutilement le genre de la personne visée.
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: aucune de toutes ces choses
  rationale: 'Cette formulation conserve la force totalisante de πάντων : pas une seule parmi toutes les choses précédemment évoquées.'
