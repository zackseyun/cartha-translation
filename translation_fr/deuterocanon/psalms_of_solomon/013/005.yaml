translation_notes:
  register: Français moderne, sobre et solennel. L’ordre « terrible est la ruine » maintient l’accent initial du grec sur le caractère effrayant de la ruine, tout en restant intelligible; la coordination par « et » respecte καί sans transformer explicitement le rapport en opposition.
