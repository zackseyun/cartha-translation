  source_fidelity: 'La formulation rend correctement la structure grecque : δίκαιος a une valeur représentative (« le juste »), παιδεύεται est conservé au passif sans agent explicité, et la finale négative est fidèlement exprimée. « En secret » est une interprétation contextuellement défendable de ἐν περιστολῇ, dont l’idée de couverture ou de dissimulation explique bien que le pécheur ne puisse se réjouir du malheur du juste. La note signale de façon appropriée l’alternative « avec retenue / de manière mesurée », liée au sens de restriction ou de maîtrise. « Jubiler aux dépens de » restitue bien la joie hostile de ἐπιχαρῇ.'
  naturalness: Le français est moderne, clair et de registre proverbial. « Le juste reçoit une correction » est idiomatique et évite un calque passif lourd. « Afin que le pécheur ne jubile pas aux dépens du juste » est naturel et conserve le contraste moral du texte.
  terminology: « Le juste » et « le pécheur » maintiennent le parallélisme typologique du grec sans explicitation doctrinale. « Correction » convient à παιδεύεται dans ce contexte, tout en laissant ouverte la portée de formation ou de châtiment. Les notes lexicales sont utiles et les deux appels de note sont correctement ancrés.
