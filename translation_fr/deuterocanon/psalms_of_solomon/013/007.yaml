  yaml_path: translation/deuterocanon/psalms_of_solomon/013/007.yaml
  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: fr
  text: Le juste reçoit une correction en secret[a], afin que le pécheur ne jubile pas aux dépens du juste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec retenue » ou « de manière mesurée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne se réjouisse pas au sujet du juste » ; ou « ne triomphe pas du juste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν περιστολῇ
  choice: en secret
  rationale: Dans ce contexte, περιστολή peut désigner le fait de couvrir ou de tenir caché. La proposition finale indique que la correction du juste demeure soustraite au regard du pécheur, ce qui l’empêche d’en tirer une joie malveillante. Le sens « avec retenue » reste toutefois possible et est signalé en note.
- source_word: παιδεύεται
  choice: reçoit une correction
  rationale: Le verbe παιδεύω couvre l’éducation, la formation et la discipline corrective. Ici, « reçoit une correction » exprime naturellement en français la dimension corrective du passif sans suggérer une simple instruction scolaire.
- source_word: δίκαιος
  choice: le juste
  rationale: Le masculin singulier grec a une valeur représentative. « Le juste » conserve la forme proverbiale et le contraste direct avec « le pécheur ».
- source_word: ἐπιχαρῇ
  choice: ne jubile pas aux dépens de
  rationale: Le composé exprime une joie prise à la situation d’autrui. « Jubiler aux dépens de » rend la nuance hostile, plus marquée que le simple fait de se réjouir.
- source_word: ὁ ἁμαρτωλός
  choice: le pécheur
  rationale: L’article et le singulier présentent un type moral dans une opposition proverbiale avec « le juste ».
theological_decisions:
- issue: Valeur du masculin singulier δίκαιος
  choice: le juste
  alternative: la personne juste
  rationale: La formulation retenue respecte le masculin singulier représentatif du grec, sans lui ajouter une restriction doctrinale aux seuls hommes.
- issue: Nature de la correction divine ou providentielle
  choice: ne pas préciser l’agent de la correction
  alternative: Dieu corrige le juste
  rationale: Le grec emploie un passif sans nommer l’agent. La traduction conserve cette indétermination au lieu d’expliciter théologiquement qui corrige.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Reçoit une correction » évite le tour peu idiomatique « est discipliné ». « Jubile aux dépens de » conserve la joie malveillante suggérée par le contexte. Les deux marqueurs de notes figurent dans le texte principal.
