base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: fr
  text: Car le Seigneur épargnera ses fidèles[a], et il effacera leurs fautes par la discipline[b] ; car la vie des justes demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui lui sont fidèles » ou « ceux qui lui sont attachés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la discipline » ; le terme grec peut désigner une éducation corrective, une réprimande ou un châtiment formateur.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: φείσεται
  choice: épargnera
  rationale: Conserve l’idée concrète de ne pas livrer au plein jugement, tout en s’accordant avec la correction mentionnée ensuite.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rend naturellement en français le titre divin, même si le grec est sans article.
- source_word: τῶν ὁσίων αὐτοῦ
  choice: ceux qui lui sont fidèles
  rationale: Dans les Psaumes de Salomon, ὅσιοι désigne les membres pieux et loyaux de la communauté ; cette formulation évite de confondre le terme avec ἅγιοι, « saints ».
- source_word: τὰ παραπτώματα αὐτῶν
  choice: leurs fautes
  rationale: « Fautes » exprime des manquements moraux précis dans un français courant et digne, sans élargir automatiquement le sens à tout péché.
- source_word: ἐξαλείψει
  choice: effacera
  rationale: Préserve l’image de l’enlèvement complet ou de l’oblitération des fautes et constitue l’équivalent français le plus naturel.
- source_word: ἐν παιδείᾳ
  choice: par la correction
  rationale: Le français « par » conserve ici la valeur instrumentale possible de ἐν, tandis que « correction » exprime une discipline formatrice sans la réduire à un châtiment punitif.
- source_word: ἡ ζωὴ τῶν δικαίων
  choice: la vie des justes
  rationale: Rend directement et idiomatiquement l’expression grecque sans surinterpréter la nature de cette vie.
- source_word: εἰς τὸν αἰῶνα
  choice: demeure pour toujours
  rationale: Exprime clairement la durée permanente visée ; « demeure » rend la phrase française plus naturelle tout en restant implicite dans la proposition nominale grecque.
theological_decisions:
- issue: Rapport entre l’épargne divine et la correction
  choice: La correction est présentée comme le moyen par lequel le Seigneur efface les fautes de ses fidèles.
  alternative: La correction pourrait désigner plus largement le cadre dans lequel les fautes sont effacées, ou une réprimande principalement punitive.
  rationale: La construction ἐν παιδείᾳ permet une nuance instrumentale ou circonstancielle. « Par la correction » retient la première sans nier que cette discipline puisse comporter une dimension pénible ; elle maintient ainsi ensemble la clémence et la formation morale.
- issue: Portée de εἰς τὸν αἰῶνα
  choice: « pour toujours » exprime une vie durable sans préciser davantage sa modalité.
  alternative: « éternelle » pourrait formuler plus explicitement l’idée d’éternité, tandis que « pour l’âge » resterait plus littéral mais serait obscur en français.
  rationale: Le texte affirme la permanence de la vie des justes, mais ne développe pas ici sa nature. La traduction évite donc d’ajouter une précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation « ceux qui lui sont fidèles » explicite sans lourdeur la relation exprimée par le génitif grec. Le point-virgule conserve le lien argumentatif introduit par γάρ.
