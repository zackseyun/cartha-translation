  text: Blessed is the man whose heart is ready to call on the name of the Lord[a][b].
translation:
  language: fr
  text: Heureux l’homme dont le cœur est prêt à invoquer le nom du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « l’homme » traduit un masculin singulier grec employé dans un sens représentatif; on pourrait aussi traduire: « la personne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριος
  choice: Heureux
  rationale: Formule consacrée des béatitudes en français biblique moderne; elle exprime une condition favorable sans réduire le propos à une émotion passagère.
- source_word: ἀνὴρ
  choice: l’homme
  rationale: Le grec porte un masculin singulier employé ici dans une maxime de portée représentative; « l’homme » en conserve la forme et le ton sapientiel.
- source_word: καρδία
  choice: cœur
  rationale: Conserve l’image biblique de l’intériorité, siège de la disposition et de la volonté, sans la réduire à « esprit » ou « pensée ».
- source_word: ἑτοίμη
  choice: prêt
  rationale: Rend directement l’idée de préparation ou de disponibilité; l’accord au masculin suit naturellement « cœur » en français.
- source_word: ἐπικαλέσασθαι
  choice: à invoquer
  rationale: Dans ce contexte religieux, « invoquer » exprime naturellement le fait de faire appel au Seigneur en prononçant son nom; « faire appel à » reste une possibilité moins solennelle.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Maintient l’expression biblique et sa densité théologique plutôt que de la paraphraser par « autorité » ou « réputation ».
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Rendu français conventionnel de κύριος dans ce contexte; l’article défini est requis par l’expression naturelle « le nom du Seigneur ».
theological_decisions:
- issue: Portée représentative du masculin singulier ἀνὴρ
  choice: Conserver « l’homme » dans le texte et signaler sa portée représentative en note.
  alternative: « la personne » ou « quiconque »
  rationale: Cette solution préserve la forme masculine de la maxime grecque sans suggérer que la béatitude serait réservée aux hommes.
translation_notes:
  register: Français international moderne, digne et accessible, avec un léger registre sapientiel. La syntaxe reste proche du grec tout en étant naturelle. « Invoquer » a été retenu plutôt que « faire appel à » afin de préserver le sens religieux de l’expression.
