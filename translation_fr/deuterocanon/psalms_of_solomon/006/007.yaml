base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/007.yaml
  text: With gladness in his heart he sang praise to the name of God[b][a], and he entreated the Lord for all his household.
translation:
  language: fr
  text: Dans la joie de son cœur, il chanta les louanges du nom de Dieu, et il implora le Seigneur[a] pour tous ceux de sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il implora le visage du Seigneur », expression qui signifie solliciter sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: Dans la joie de son cœur
  rationale: Cette formulation conserve l’image biblique du cœur comme centre intérieur de la personne et rend εὐφρίᾳ par un français naturel et digne.
- source_word: ἐξύμνησεν
  choice: il chanta les louanges
  rationale: Le verbe évoque une louange exprimée comme un hymne; cette traduction est plus précise que le simple verbe « louer ».
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: du nom de Dieu
  rationale: Le grec mentionne explicitement le nom divin. En français, « chanter les louanges du nom de Dieu » restitue naturellement la relation exprimée par le datif.
- source_word: ἐδεήθη τοῦ προσώπου Κυρίου
  choice: il implora le Seigneur[a]
  rationale: δέομαι régit ici le génitif de la personne implorée. La traduction française exprime cette supplication avec naturel, tandis que la note conserve l’image littérale du « visage » et sa portée idiomatique.
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: pour tous ceux de sa maison
  rationale: οἶκος désigne ici les membres de la maisonnée plutôt que le bâtiment. Cette formulation garde l’image de la maison tout en évitant l’ambiguïté de « pour toute sa maison ».
theological_decisions:
- issue: L’idiome τοῦ προσώπου Κυρίου
  choice: il implora le Seigneur
  alternative: il implora le visage du Seigneur
  rationale: Le génitif dépend du verbe de supplication et ne doit pas être transformé en complément locatif (« devant le Seigneur »). Le texte principal donne le sens idiomatique en français, et la note signale l’image littérale, associée à la recherche de la faveur divine.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe demeure proche du grec, tandis que l’idiome sémitisant du « visage du Seigneur » est expliqué en note afin de ne pas produire une expression obscure dans le texte principal.
