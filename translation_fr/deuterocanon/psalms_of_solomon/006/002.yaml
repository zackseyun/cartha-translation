lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: Quand il se souviendra
  rationale: La construction ἐν τῷ suivie de l’infinitif a ici une valeur temporelle. Le futur français s’accorde naturellement avec le verbe principal au futur.
- source_word: αὐτὸν
  choice: il
  rationale: 'Le pronom à l’accusatif est compris comme le sujet de l’infinitif substantivé, et non comme son complément d’objet : « quand il se souviendra », plutôt que « en se souvenant de lui ».'
- source_word: τὸ ὄνομα Κυρίου
  choice: du nom du Seigneur
  rationale: Cette formulation suit étroitement le grec et conserve la portée biblique de l’expression « le nom du Seigneur ».
- source_word: σωθήσεται
  choice: il sera sauvé
  rationale: Le futur passif de σῴζω peut signifier être sauvé ou délivré. « Il sera sauvé » préserve à la fois le sens direct et la résonance théologique du terme.
