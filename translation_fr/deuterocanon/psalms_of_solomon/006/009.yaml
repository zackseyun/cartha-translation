lexical_decisions:
- source_word: εὐλογητὸς
  choice: Béni soit
  rationale: Cette formule française naturelle de louange rend l’adjectif prédicatif employé dans un contexte doxologique.
- source_word: Κύριος
  choice: le Seigneur
  rationale: « Seigneur » est le titre divin français usuel et convient à cette formule de louange.
- source_word: ὁ ποιῶν
  choice: qui fait
  rationale: Avec « miséricorde », « faire » conserve ici l’expression sémitisante du grec tout en restant intelligible en français.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Ce terme transparent préserve à la fois l’idée de compassion et la portée religieuse de ἔλεος.
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: à ceux qui l’aiment
  rationale: La proposition relative rend naturellement en français le participe substantivé grec sans en modifier le sens.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Cette traduction formellement proche maintient l’ambiguïté entre vérité, sincérité et fidélité.
