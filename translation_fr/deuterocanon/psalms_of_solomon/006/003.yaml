  text: αἱ ὁδοὶ αὐτοῦ κατευθύνονται ὑπὸ Κυρίου, καὶ πεφυλαγμένα ἔργα χειρῶν αὐτοῦ ὑπὸ Κυρίου θεοῦ αὐτοῦ.
