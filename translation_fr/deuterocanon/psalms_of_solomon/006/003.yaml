  naturalness: Le français est naturel dans un registre biblique moderne et soutenu. « Voies » et « œuvres de ses mains » sont légèrement littéraux, mais ils sont transparents et appropriés au parallélisme poétique. La répétition de « par le Seigneur » est voulue et fidèle à la structure source.
