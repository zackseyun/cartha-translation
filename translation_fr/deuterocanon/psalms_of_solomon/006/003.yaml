  yaml_path: translation/deuterocanon/psalms_of_solomon/006/003.yaml
  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: fr
  text: Ses voies sont rendues droites par le Seigneur, et les œuvres de ses mains sont gardées par le Seigneur, son Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: Ses voies
  rationale: « Voies » conserve l’image grecque et peut désigner aussi bien le parcours que la conduite d’une personne, sans préciser davantage que le texte.
- source_word: κατευθύνονται
  choice: sont rendues droites
  rationale: Le passif garde l’action divine explicitement exprimée par ὑπὸ Κυρίου, tandis que « rendues droites » restitue plus directement la valeur de κατευθύνω que le seul verbe « diriger ».
- source_word: πεφυλαγμένα
  choice: sont gardées
  rationale: Le participe parfait passif décrit les œuvres comme se trouvant dans un état de garde ou de protection; « sont gardées » préserve à la fois cette nuance et la forme passive.
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: les œuvres de ses mains
  rationale: Cette formulation conserve l’image concrète et transparente du grec plutôt que de la réduire à « ses œuvres » ou « ce qu’il fait ».
- source_word: Κυρίου
  choice: le Seigneur
  rationale: « Le Seigneur » est l’équivalent français naturel et traditionnel de Κύριος dans ce contexte.
- source_word: θεοῦ αὐτοῦ
  choice: son Dieu
  rationale: La construction possessive est rendue directement et rattache explicitement « Dieu » à la personne évoquée.
theological_decisions:
- issue: L’action divine exprimée par les deux passifs
  choice: Le Seigneur est présenté comme celui qui rend droites les voies de la personne et garde les œuvres de ses mains.
  alternative: Atténuer l’action divine en parlant seulement de voies qui réussissent ou d’œuvres bénéficiant d’une bénédiction générale.
  rationale: Dans les deux propositions, ὑπό suivi du génitif nomme explicitement le Seigneur comme agent. La traduction maintient cette affirmation forte de la providence divine sans en expliquer ni en limiter la portée.
- issue: Sens de κατευθύνονται
  choice: sont rendues droites
  alternative: sont dirigées / sont guidées
  rationale: La formulation choisie préserve le sens imagé de voies mises dans la bonne direction, tout en laissant subsister la tension entre rectification morale, conduite providentielle et réussite du parcours.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme des deux propositions et la répétition de « par le Seigneur » sont conservés afin de refléter la structure et l’insistance du grec.
