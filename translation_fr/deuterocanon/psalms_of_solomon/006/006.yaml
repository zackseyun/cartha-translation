translation:
  language: fr
  text: Il se réveilla de son sommeil et bénit le nom du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξανέστη ἐξ ὕπνου αὐτοῦ
  choice: Il se réveilla de son sommeil
  rationale: Dans ce contexte, l’expression indique qu’il sortit de son sommeil. « Se réveilla » est naturel en français moderne et évite de suggérer inutilement qu’il se mit physiquement debout.
- source_word: ἐυλόγησεν
  choice: bénit
  rationale: Le verbe grec signifie ici louer ou prononcer du bien au sujet de Dieu; « bénit » conserve la formulation biblique et son lien lexical direct.
- source_word: τῷ ὀνόματι Κυρίου
  choice: le nom du Seigneur
  rationale: Le datif après εὐλογέω est rendu naturellement comme complément direct en français. « Seigneur » correspond à Κυρίου sans introduire un nom divin absent du texte grec transmis.
theological_decisions:
- issue: Sens de ἐξανέστη après le sommeil
  choice: se réveilla
  alternative: se leva
  rationale: Bien que le verbe puisse littéralement évoquer le fait de se lever, son association avec « de son sommeil » autorise le sens contextuel de se réveiller. La traduction ne tire donc aucune conclusion théologique d’un éventuel langage de relèvement.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique concis; aucune note n’est nécessaire.
