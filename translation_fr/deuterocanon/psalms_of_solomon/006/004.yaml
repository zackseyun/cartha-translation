  text: He will not be troubled by the vision of his evil dreams.
translation:
  language: fr
  text: Il ne sera pas troublé par la vision de ses mauvais rêves.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: par la vision
  rationale: La préposition ἀπό peut ici exprimer la cause du trouble, tandis que « vision » conserve la valeur visuelle de ὅρασις sans la réduire à la simple expérience d’un rêve.
- source_word: πονηρῶν ἐνυπνίων αὐτοῦ
  choice: de ses mauvais rêves
  rationale: Le génitif αὐτοῦ se rattache naturellement à l’ensemble nominal et indique que ces rêves sont les siens. « Mauvais » préserve la portée assez large de πονηρός, qui peut évoquer des rêves pénibles, funestes ou mauvais.
- source_word: οὐ ταραχθήσεται
  choice: Il ne sera pas troublé
  rationale: Le futur passif est rendu directement, dans un français naturel et digne.
theological_decisions:
- issue: Nature exacte des rêves qualifiés par πονηρός
  choice: mauvais rêves
  alternative: rêves funestes / cauchemars
  rationale: « Mauvais » maintient l’ambiguïté du grec entre caractère pénible, menaçant ou moralement mauvais, sans imposer une interprétation particulière.
translation_notes:
  register: Français moderne international, simple et soutenu. La formulation reste proche de la structure grecque tout en étant idiomatique.
