  yaml_path: translation/deuterocanon/psalms_of_solomon/006/008.yaml
  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: fr
  text: Et le Seigneur écoute la prière de toute personne qui craint Dieu[a], et le Seigneur accomplit toute requête d’une âme qui espère en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de toute personne dans la crainte de Dieu ».'
    reason: La construction grecque ἐν φόβῳ θεοῦ peut être rendue de manière plus proche par « dans la crainte de Dieu » ; « qui craint Dieu » est plus naturel en français.
  - marker: b
    text: 'Ou : « d’une personne qui espère en lui ». Le grec dit littéralement « d’une âme ».'
    reason: ψυχή peut désigner l’âme ou, selon le contexte, la personne.
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: le Seigneur
  rationale: Rendu usuel et digne de κύριος comme titre divin. La répétition dans les deux membres conserve l’insistance du grec.
- source_word: εἰσήκουσεν
  choice: écoute
  rationale: 'L’aoriste est compris comme gnomique dans cette maxime, en parallèle avec le présent ἐπιτελεῖ : le présent français exprime donc une vérité générale.'
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: de toute personne qui vit dans la crainte de Dieu
  rationale: La formulation rend en français naturel l’expression grecque elliptique tout en maintenant l’idée d’une existence placée dans la crainte révérencielle de Dieu.
- source_word: αἴτημα
  choice: requête
  rationale: « Requête » convient au contexte de prière et garde un registre digne sans être archaïque.
- source_word: ψυχῆς
  choice: âme
  rationale: Le terme explicite du grec est conservé afin de respecter la texture anthropologique et dévotionnelle du passage; « personne » reste possible selon l’usage contextuel de ψυχή.
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: qui espère en lui
  rationale: Cette tournure française naturelle conserve l’espérance orientée vers Dieu qu’expriment le participe et la préposition πρός.
- source_word: ἐπιτελεῖ
  choice: accomplit
  rationale: « Accomplit » conserve l’idée de mener à son terme ou de réaliser, sans réduire explicitement le verbe au seul sens technique d’« exaucer ».
theological_decisions:
- issue: Portée de la promesse concernant toute requête
  choice: Conserver l’énoncé absolu « accomplit toute requête »
  alternative: Nuancer par « répond à toute requête » ou introduire une condition implicite
  rationale: Le grec formule sans restriction explicite l’action du Seigneur envers la requête de l’âme qui espère en lui; aucune qualification théologique absente du texte n’est ajoutée.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux propositions ainsi que la répétition de « le Seigneur » sont préservés; « crainte de Dieu » maintient le registre biblique de révérence.
