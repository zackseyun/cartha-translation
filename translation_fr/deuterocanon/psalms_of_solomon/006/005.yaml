  text: His soul will not be terrified at the crossing of rivers and the tossing of seas[a][b][c].
translation:
  language: fr
  text: Son âme ne sera pas terrifiée au passage des fleuves et dans la houle des mers[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sa vie » ou « Lui-même », pour « Son âme ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « au passage des fleuves et dans l’agitation des mers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: âme
  rationale: « Âme » conserve le registre élevé de ψυχή et sa portée personnelle, tout en pouvant désigner ici la personne elle-même ou sa vie.
- source_word: διάβασις
  choice: quand elle traversera
  rationale: διάβασις désigne une traversée ou un passage. La tournure verbale est naturelle en français et rend clairement l'image d'une traversée dangereuse de fleuves.
- source_word: σάλος
  choice: agitées
  rationale: σάλος évoque l'agitation, le mouvement houleux ou le déferlement. « Les mers seront agitées » exprime cette image dans un français actuel et digne.
- source_word: πτοηθήσεται
  choice: ne sera pas terrifiée
  rationale: Le futur passif de πτοέω exprime une peur vive, l'effroi ou la terreur; « ne sera pas terrifiée » en préserve l'intensité mieux que « n'aura pas peur ».
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La syntaxe explicite la relation circonstancielle implicite dans les groupes prépositionnels grecs, sans atténuer l'intensité de πτοηθήσεται.
