  yaml_path: translation/deuterocanon/psalms_of_solomon/016/007.yaml
  text: Restrain me[a], O God, from evil sin and from every evil woman who causes a foolish man to stumble.
translation:
  language: fr
  text: Retiens-moi[a], ô Dieu, loin d’un mauvais péché et de toute femme mauvaise qui fait trébucher un homme insensé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Exerce ta maîtrise sur moi, ô Dieu, pour m’éloigner de ».
    reason: La note préserve la valeur plus littérale de ἐπικρατέω, « dominer, exercer sa maîtrise », tandis que le texte principal en exprime la fonction protectrice dans ce contexte.
lexical_decisions:
- source_word: ἐπικράτησόν μου
  choice: Retiens-moi
  rationale: Dans cette prière, l’impératif demande à Dieu d’exercer sa maîtrise sur le locuteur afin de le préserver de ce qui suit. Avec ἀπό, « Retiens-moi… loin de » exprime naturellement en français cette idée de contrôle protecteur, tout en laissant en note le sens plus littéral du verbe.
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  choice: loin du péché mauvais
  rationale: ἀπό marque ici l’éloignement ou la séparation. « Péché mauvais » conserve explicitement la qualification πονηρᾶς, malgré une légère redondance qui appartient au texte grec.
- source_word: καὶ ἀπὸ πάσης γυναικὸς πονηρᾶς
  choice: et de toute femme mauvaise
  rationale: πάσης avec le singulier a une portée générale et exhaustive. La répétition de « mauvaise » reproduit celle de πονηρᾶς dans les deux groupes nominaux.
- source_word: σκανδαλιζούσης
  choice: qui fait trébucher
  rationale: Le participe évoque l’action de faire tomber dans un piège ou dans la faute. L’image du faux pas reste claire et expressive en français.
- source_word: ἄφρονα
  choice: l’homme dépourvu de bon sens
  rationale: ἄφρονα est un accusatif masculin singulier désignant quelqu’un qui manque de discernement. « L’homme dépourvu de bon sens » rend à la fois le genre grammatical et la déficience de jugement sans employer le très dur « insensé ».
theological_decisions:
- issue: Portée de ἄφρονα
  choice: l’homme dépourvu de bon sens
  alternative: un homme dépourvu de bon sens / une personne dépourvue de bon sens
  rationale: L’absence d’article en grec permet une lecture indéfinie ou générique. Le français générique avec l’article défini garde la concision sans décider que le texte vise un individu précis; le masculin du grec est conservé.
translation_notes:
  register: Français moderne, digne et accessible. L’invocation « ô Dieu » conserve le ton solennel de la prière. La répétition « péché mauvais / femme mauvaise » suit volontairement le grec, et « fait trébucher » maintient son image concrète.
