  source_fidelity: 'Le sens global est bien rendu : la demande adressée à Dieu vise à être préservé du péché et d’une femme mauvaise qui fait trébucher un homme dépourvu de sagesse. « Retiens-moi » exprime de façon idiomatique la fonction de ἐπικράτησόν μου dans ce contexte, avec ἀπό. La répétition de πονηρᾶς est conservée.'
  naturalness: « Péché mauvais » est grammaticalement possible mais peu naturel en français moderne. « Mauvais péché » est plus idiomatique sans affaiblir la qualification morale. « Un homme insensé » est plus concis et plus naturel que « l’homme dépourvu de bon sens », tout en respectant le masculin singulier indéfini de ἄφρονα.
