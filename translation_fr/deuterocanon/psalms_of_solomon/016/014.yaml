  yaml_path: translation/deuterocanon/psalms_of_solomon/016/014.yaml
  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: fr
  text: Si une personne est reprise au moyen de sa ruine[a], ton épreuve est dans sa chair et dans la pauvreté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Si une âme est reprise sous le pouvoir de sa destruction. » Le grec de cette proposition est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέγχηται
  choice: est reprise
  rationale: « Reprendre » conserve la valeur corrective de ἐλέγχω sans lui donner un sens exclusivement judiciaire.
- source_word: ψυχήν
  choice: une personne
  rationale: Dans ce contexte marqué par un usage sémitisant, ψυχή peut désigner la personne entière. Ce choix s’accorde aussi naturellement avec les pronoms masculins qui suivent, sans imposer une opposition entre l’âme et le corps.
- source_word: ἐν χειρὶ
  choice: au moyen de
  rationale: L’expression sémitisante peut marquer le moyen ou l’instrument. Cette formulation transmet ce sens tout en évitant le calque obscur « dans la main de ».
- source_word: ἀπωλίας
  choice: ruine
  rationale: « Ruine » rend ἀπώλεια sans la connotation doctrinale que pourrait prendre « perdition » et convient à une épreuve subie dès la vie présente.
- source_word: δοκιμασία
  choice: l’épreuve que tu lui imposes
  rationale: Cette tournure verbalisée exprime l’idée d’une mise à l’épreuve venant du destinataire divin et rend la relation avec αὐτοῦ intelligible en français.
- source_word: σαρκὶ
  choice: sa chair
  rationale: « Chair » garde le terme concret du grec et désigne ici la dimension corporelle de la personne.
- source_word: πενίᾳς
  choice: la pauvreté
  rationale: Malgré la forme grecque irrégulière transmise, le nom désigne clairement la pauvreté ou le dénuement matériel.
theological_decisions:
- issue: Sens de la proposition difficile ἐὰν ἐλέγχηται ψυχήν ἐν χειρὶ ἀπωλίας αὐτοῦ
  choice: « Si une personne est reprise au moyen de sa ruine »
  alternative: « Si une âme est reprise sous le pouvoir de sa destruction »
  rationale: Le texte grec est syntaxiquement difficile. La traduction principale comprend ψυχή au sens sémitisant de « personne » et ἐν χειρί comme indiquant le moyen, mais une note conserve une lecture plus formelle afin de ne pas masquer l’incertitude.
- issue: Rapport entre l’épreuve divine, la chair et la pauvreté
  choice: « l’épreuve que tu lui imposes s’exerce dans sa chair et dans la pauvreté »
  alternative: « ton épreuve est dans sa chair et dans la pauvreté »
  rationale: La formulation retenue rend le tour nominal grec en français naturel, sans préciser davantage si la pauvreté est l’instrument, le cadre ou le résultat de l’épreuve.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe de la seconde proposition est légèrement explicitée pour rester intelligible, tandis que la note signale l’incertitude réelle de la première proposition.
