  yaml_path: translation/deuterocanon/psalms_of_solomon/016/012.yaml
  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: fr
  text: Mais, avec bienveillance et joie[a], affermis mon âme ; quand tu fortifieras mon âme[b], ce qui a été donné me suffira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec transmis porte littéralement « bienveillance avec joie ». Le premier terme est au nominatif, alors que le verbe est un impératif à la deuxième personne, ce qui rend la syntaxe incertaine. La traduction suit le sens d’une prière adressée à Dieu. « Bienveillance » peut aussi se traduire par « faveur » ou « bon plaisir ».
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: La tournure grecque peut aussi se rendre par « en fortifiant mon âme » ou « lorsque tu fortifies mon âme ».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: εὐδοκία
  choice: bienveillance
  rationale: Dans cette prière, le terme évoque une disposition favorable ou gracieuse. « Bienveillance » reste naturel en français et évite de lui imposer un sens théologique technique.
- source_word: ἱλαρότητος
  choice: joie
  rationale: Le nom exprime une disposition joyeuse, enjouée ou lumineuse. « Joie » convient au registre poétique et s’associe naturellement à « bienveillance ».
- source_word: στήρισον
  choice: affermis
  rationale: L’impératif demande de rendre ferme ou stable. « Affermis » conserve cette nuance et permet de distinguer ce verbe de ἐνισχύω dans la proposition suivante.
- source_word: ψυχήν
  choice: âme
  rationale: Dans ce contexte de prière, « âme » rend le sens de la personne intérieure et préserve le ton spirituel du passage.
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: quand tu fortifieras
  rationale: La construction ἐν + infinitif articulé peut exprimer la circonstance ou le moment. Cette formulation temporelle est claire tout en laissant la note signaler l’autre nuance possible.
- source_word: ἀρκέσει μοι
  choice: me suffira
  rationale: Le futur exprime la suffisance. « Me suffira » est une formulation française directe et actuelle.
- source_word: τὸ δοθέν
  choice: ce qui a été donné
  rationale: Le participe substantivé reste volontairement indéterminé. Cette traduction ne précise ni la nature de ce qui est donné ni explicitement son destinataire.
theological_decisions:
- issue: Agent ou modalité associés à εὐδοκία
  choice: Lire la bienveillance et la joie comme la manière dont Dieu est prié d’affermir l’âme.
  alternative: Comprendre « la bienveillance accompagnée de joie » comme sujet de « affermisse mon âme ».
  rationale: Le verbe στήρισον est un impératif à la deuxième personne, ce qui favorise une lecture où Dieu est le sujet sous-entendu. La forme nominative εὐδοκία du texte transmis crée toutefois une difficulté grammaticale, signalée dans la note.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme. « Affermis » puis « fortifieras » maintient la distinction entre les deux verbes grecs, tandis que « ce qui a été donné » conserve l’indétermination du texte source.
