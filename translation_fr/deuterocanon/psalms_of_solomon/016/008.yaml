    text: 'Le grec de ce second membre est condensé. Littéralement : « ni [la beauté] de tout ce qui est soumis à un péché sans profit ». Le sens précis de « soumis » dans ce contexte est discuté.'
    reason: παντὸς ὑποκειμένου est un participe difficile, mais sa forme au génitif le rattache vraisemblablement à κάλλος (« beauté »), en parallèle avec γυναικὸς.
  revision_rationale: La révision conserve la forme de prière et le parallélisme syntaxique du grec. Elle retire les ajouts interprétatifs concernant la « Loi » et l’action supposée du péché, tout en signalant en note la difficulté réelle du participe ὑποκειμένου.
