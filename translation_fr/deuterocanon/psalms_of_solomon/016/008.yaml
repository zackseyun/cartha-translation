revisions:
- from: Que la beauté d’une femme qui méprise la Loi ne me séduise pas, ni celle de tout ce que le péché stérile place devant moi.[a]
  to: Que la beauté d’une femme qui ne respecte pas la loi ne me trompe pas, ni celle de tout ce qui est soumis à un péché stérile.[a]
  rationale: La révision conserve la forme de prière et le parallélisme syntaxique du grec. Elle retire les ajouts interprétatifs concernant la « Loi » et l’action supposée du péché, tout en signalant en note la difficulté réelle du participe ὑποκειμένου.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première proposition est globalement bien comprise, mais « qui méprise la Loi » ajoute l’idée spécifique de mépris volontaire et la majuscule interprétative. Dans le second membre, le grec présente plus directement παντὸς ὑποκειμένου comme un génitif coordonné à γυναικὸς et dépendant de κάλλος : il s’agit de la beauté de « tout ce qui est soumis/assujetti à » un péché sans profit. La traduction actuelle fait de ἁμαρτίας l’agent qui « place devant » le priant, ce que le grec n’explicite pas.'
  naturalness: « Que ... ne me trompe pas » est un jussif de prière naturel et rend plus directement ἀπατησάτω que « séduise ». « Femme qui ne respecte pas la loi » est moderne, clair et moins chargé que « femme sans loi ». « Péché stérile » demeure idiomatique en français et rend l’idée d’absence de profit ou de fruit.
  terminology: παράνομος est rendu sans lui attribuer un sens civil étroit ni une catégorie confessionnelle déterminée. Le terme « loi » reste en minuscule, car le grec ne permet pas à lui seul d’imposer l’identification à la Loi mosaïque. ἀνώφελος est rendu par « stérile », sans introduire l’idée étrangère d’une action active du péché.
  issues:
  - severity: medium
    issue: « qui méprise la Loi » est trop interprétatif
    rationale: παράνομος qualifie ce qui est contraire à la loi ou ne la respecte pas; il n’énonce pas expressément le mépris, et la majuscule « Loi » tranche un référent que le verset isolé ne précise pas.
  - severity: high
    issue: Le second membre attribue au péché l’action de « placer devant moi »
    rationale: Dans « παντὸς ὑποκειμένου ἀπὸ ἁμαρτίας ἀνωφελοῦς », ὑποκειμένου est plus naturellement un participe au génitif dépendant de κάλλος, avec ἀπό marquant ce à quoi la chose est soumise ou assujettie. Le grec ne dit pas explicitement que le péché place des objets devant le priant.
  - severity: medium
    issue: La note propose une analyse syntaxique insuffisamment fondée
    rationale: L’analyse de « ni rien ... » comme second sujet efface le parallélisme des génitifs γυναικὸς et παντός sous κάλλος. Une note doit signaler la difficulté sémantique de ὑποκείμενον sans privilégier une construction qui contredit ce parallélisme.
  revised_text: Que la beauté d’une femme qui ne respecte pas la loi ne me trompe pas, ni celle de tout ce qui est soumis à un péché stérile.[a]
  revised_footnotes:
