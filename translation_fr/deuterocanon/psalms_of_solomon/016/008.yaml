  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: fr
  text: Que la beauté d’une femme qui ne respecte pas la loi ne me trompe pas, ni celle de tout ce qui est soumis à un péché stérile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de ce second membre est condensé. Littéralement : « ni [la beauté] de tout ce qui est soumis à un péché sans profit ». Le sens précis de « soumis » dans ce contexte est discuté.'
    reason: παντὸς ὑποκειμένου est un participe difficile, mais sa forme au génitif le rattache vraisemblablement à κάλλος (« beauté »), en parallèle avec γυναικὸς.
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: Que … ne me séduise pas
  rationale: Le tour jussif rend naturellement l’impératif aoriste grec dans le contexte d’une prière. « Séduire » exprime ici la tromperie exercée par un attrait.
- source_word: κάλλος γυναικὸς παρανόμου
  choice: la beauté d’une femme qui méprise la Loi
  rationale: κάλλος signifie « beauté ». παρανόμου désigne une personne qui agit contre la loi; la formulation verbale est plus naturelle en français que « femme sans loi » et conserve la portée morale et religieuse du terme.
- source_word: παντὸς ὑποκειμένου
  choice: celle de tout ce que … place devant moi
  rationale: Le génitif coordonné à γυναικὸς dépend vraisemblablement de κάλλος sous-entendu. La formulation française maintient cette dépendance tout en rendant ὑποκειμένου comme ce qui est placé devant le priant.
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: le péché stérile
  rationale: ἀπό indique ici vraisemblablement la provenance ou l’agent de ce qui est présenté. ἀνώφελος signifie inutile, sans profit; « stérile » traduit de façon naturelle l’absence de fruit ou de bénéfice.
theological_decisions:
- issue: Portée de παρανόμου
  choice: qui méprise la Loi
  alternative: hors-la-loi / impie
  rationale: La traduction évite de réduire le mot à une infraction civile ou de lui imposer une qualification théologique plus précise que le grec.
- issue: Dépendance syntaxique de παντὸς ὑποκειμένου
  choice: le rattacher à « beauté » par « celle de »
  alternative: en faire un second sujet autonome de « séduise »
  rationale: Le génitif παντός se coordonne le plus directement avec γυναικός et dépend donc de κάλλος, bien que la construction soit condensée et difficile.
translation_notes:
  register: Français moderne, digne et accessible. « La Loi » porte une majuscule pour signaler la portée morale et religieuse probable de παράνομος, sans préciser davantage son référent. La phrase conserve la forme de prière et l’ambiguïté du second membre est signalée en note.
