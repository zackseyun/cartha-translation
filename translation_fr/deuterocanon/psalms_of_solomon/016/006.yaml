  source_fidelity: 'Le texte rend fidèlement la prière négative au subjonctif : μὴ ἀποστήσῃς est bien exprimé par « Ne retire pas ». « Ta miséricorde » traduit directement τὸ ἔλεός σου, et l’unique verbe régit correctement le second complément introduit par μηδέ. « Le souvenir de toi », « de mon cœur » et « jusqu’à la mort » reproduisent sans surinterprétation μνήμην περὶ σοῦ, ἀπὸ καρδίας et ἕως θανάτου. L’explicitation de « mon » est idiomatique et découle du locuteur, sans ajout de sens substantiel.'
  naturalness: Le français est naturel, sobre et approprié à une prière poétique moderne. L’ordre « ni de mon cœur le souvenir de toi » est légèrement marqué, mais il est pleinement idiomatique dans ce registre et permet de conserver l’ellipse du verbe ainsi que le parallélisme grec.
  terminology: « Miséricorde » est un équivalent établi et direct de ἔλεος dans ce contexte. « Ô Dieu » convient au vocatif liturgique et poétique. « Souvenir de toi » est une formulation française claire pour la mémoire dirigée vers Dieu, sans réduire indûment la portée intérieure de καρδία.
