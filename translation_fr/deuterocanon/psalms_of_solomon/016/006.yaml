base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/006.yaml
  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
translation:
  language: fr
  text: 'Ne retire pas de moi ta miséricorde, ô Dieu,

    ni de mon cœur le souvenir de toi jusqu’à la mort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni le souvenir à ton sujet hors de mon cœur jusqu’à la mort » ; le verbe « retire » reste sous-entendu dans ce second membre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: retire
  rationale: Le verbe demande à Dieu de ne pas faire disparaître ou éloigner ce qui est nommé. « Retirer » est naturel en français et peut régir les deux compléments coordonnés.
- source_word: ἔλεός
  choice: miséricorde
  rationale: Ἔλεος désigne ici la miséricorde ou la compassion divine. « Miséricorde » convient au registre d’une prière tout en restant directement fidèle au grec.
- source_word: μνήμην περὶ σοῦ
  choice: le souvenir de toi
  rationale: Cette expression désigne le fait de garder Dieu présent à la mémoire. « Le souvenir de toi » est idiomatique et conserve la formulation nominale du grec.
- source_word: καρδίας
  choice: cœur
  rationale: Dans ce contexte, le cœur représente la vie intérieure, notamment la mémoire et l’attachement. Le possessif « mon » est explicité en français d’après la personne du locuteur.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: La formule temporelle est rendue directement sans la développer en « tant que je vivrai », ce qui préserve sa sobriété et sa portée.
theological_decisions:
- issue: Portée du verbe ἀποστήσῃς dans le second membre
  choice: Conserver un seul verbe, sous-entendu après « ni »
  alternative: 'Répéter ou remplacer le verbe : « et n’enlève pas de mon cœur… »'
  rationale: En grec, le même verbe gouverne « ta miséricorde » et « le souvenir de toi ». L’ellipse française préserve ce parallélisme sans introduire une action distincte.
- issue: Valeur de ἔλεος
  choice: miséricorde
  alternative: compassion ; amour fidèle
  rationale: « Miséricorde » exprime directement l’attitude bienveillante sollicitée auprès de Dieu. « Amour fidèle » serait plus interprétatif et préciserait une nuance que le mot grec ne rend pas obligatoire à lui seul.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocatif « ô Dieu » garde la tonalité poétique de la prière. L’ordre « ni de mon cœur le souvenir de toi » permet au verbe « retire » de régir naturellement les deux membres tout en restant proche de la structure grecque.
