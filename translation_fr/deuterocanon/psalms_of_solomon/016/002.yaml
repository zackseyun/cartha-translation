base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
translation:
  language: fr
  text: Alors que j’étais loin de Dieu[a], mon âme[b] s’est presque répandue jusqu’à la mort, tout près des portes de l’Hadès[c], avec un pécheur[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très condensé; autre traduction possible : « étant loin de Dieu ».'
    reason: syntactic_ambiguity
  - marker: b
    text: Ou « ma vie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « du séjour des morts », voire « de la tombe ». Le grec porte « Hadès ».
    reason: lexical_alternative
  - marker: d
    text: Ou « avec le pécheur », si le singulier désigne ici les pécheurs en général.
    reason: generic_singular_ambiguity
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: Alors que j’étais loin de Dieu
  rationale: L’ouverture grecque est très condensée et syntaxiquement abrupte. La tournure circonstancielle française exprime naturellement l’éloignement par rapport à Dieu sans préciser davantage sa cause ou sa nature.
- source_word: παρʼ ὀλίγον
  choice: presque
  rationale: L’expression idiomatique signifie ici « presque » ou « peu s’en est fallu ».
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: mon âme s’est presque répandue dans la mort
  rationale: Cette formulation conserve l’image forte du verbe ἐκχέω, « répandre », ainsi que ψυχή, « âme » ou « vie », malgré le caractère volontairement inhabituel de l’image en français.
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: tout près des portes de l’Hadès
  rationale: σύνεγγυς indique une grande proximité. « Hadès » maintient le terme grec et l’image spatiale des portes du séjour des morts.
- source_word: μετὰ ἁμαρτωλοῦ
  choice: avec un pécheur
  rationale: Le grec emploie un nom singulier sans article. « Un pécheur » respecte cette indétermination, tout en laissant en note la possibilité d’un singulier générique.
theological_decisions:
- issue: Sens de ψυχή
  choice: âme
  alternative: vie
  rationale: ψυχή peut désigner l’âme, la personne elle-même ou la vie. « Âme » préserve ici le vocabulaire et la tension du texte, tandis que « vie » est signalé comme autre traduction possible.
- issue: Rendu de ᾅδης
  choice: Hadès
  alternative: séjour des morts ; tombe
  rationale: Le grec nomme explicitement l’Hadès. La translittération évite de réduire cette image à la tombe physique ou de lui imposer une définition doctrinale plus étroite.
- issue: Valeur du singulier ἁμαρτωλοῦ
  choice: avec un pécheur
  alternative: avec le pécheur
  rationale: L’absence d’article favorise une traduction indéfinie, mais le singulier peut aussi avoir une valeur générique et représenter la catégorie des pécheurs.
translation_notes:
  register: Français international actuel, sobre et digne. L’image inhabituelle de l’âme répandue dans la mort est conservée afin de rester proche du grec, tandis que les notes rendent visibles ses principales ambiguïtés lexicales et syntaxiques.
