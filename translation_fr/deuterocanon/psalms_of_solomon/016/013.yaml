  text: For if you do not strengthen[b][a], who will endure discipline in poverty?
translation:
  language: fr
  text: Car si tu ne fortifies pas[a], qui supportera la discipline[b] dans la pauvreté ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas qui est fortifié.
