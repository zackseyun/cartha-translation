    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: tu ne donnes pas de force
  rationale: Le verbe exprime l’action de communiquer force ou soutien. Cette tournure conserve l’absence de complément d’objet dans le grec sans en ajouter un implicitement.
- source_word: ὑφέξεται
  choice: supportera
  rationale: Le futur évoque le fait de tenir sous une charge ou une épreuve. « Supportera » rend naturellement cette idée dans la question rhétorique.
- source_word: παιδείαν
  choice: la discipline
  rationale: παιδεία peut désigner l’éducation, la formation ou la correction formatrice. Dans ce contexte de pauvreté à endurer, « discipline » préserve cette amplitude sans réduire le terme à un simple enseignement.
- source_word: ἐν πενίᾳ
  choice: dans la pauvreté
  rationale: πενία désigne directement la pauvreté ou le dénuement. La traduction retenue conserve le sens socioéconomique net du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse singulière à Dieu. La question rhétorique et l’ambiguïté du complément non exprimé de ἐνισχύσῃς sont conservées.
