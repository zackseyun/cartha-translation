  text: Clothe my tongue and my lips with words of truth[c][b][a]; keep anger and senseless wrath far from me.
translation:
  language: fr
  text: Revêts ma langue et mes lèvres de paroles de vérité[a] ; éloigne de moi la colère et la fureur déraisonnable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Entoure ma langue et mes lèvres de paroles de vérité » ou « Enveloppe ma langue et mes lèvres de paroles de vérité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la fureur irrationnelle » ou « l’emportement insensé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίστειλον
  choice: Revêts
  rationale: L’impératif peut évoquer l’action d’envelopper ou de couvrir. « Revêts » conserve cette image concrète et poétique tout en exprimant naturellement la demande que les paroles vraies gouvernent la langue et les lèvres.
- source_word: τὴν γλῶσσάν μου καὶ τὰ χείλη μου
  choice: ma langue et mes lèvres
  rationale: La traduction directe préserve l’image corporelle et le parallélisme poétique du grec.
- source_word: ἐν λόγοις ἀληθείας
  choice: de paroles de vérité
  rationale: Cette formulation conserve le pluriel λόγοις et la construction avec le génitif ἀληθείας, dans un registre élevé mais intelligible.
- source_word: ὀργὴν
  choice: la colère
  rationale: « Colère » est l’équivalent courant et permet de ne pas confondre ce terme avec θυμός.
- source_word: θυμὸν ἄλογον
  choice: la fureur déraisonnable
  rationale: « Fureur » rend l’intensité possible de θυμός, tandis que « déraisonnable » exprime clairement l’absence de raison indiquée par ἄλογον.
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: éloigne de moi
  rationale: Cette tournure française naturelle restitue directement la demande de mettre ces dispositions loin du priant.
