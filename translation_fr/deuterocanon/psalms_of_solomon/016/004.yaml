  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: fr
  text: Il m’a piqué comme avec l’aiguillon d’un cheval, en vue de son éveil[a] ; mon sauveur, celui qui me vient en aide, m’a sauvé en tout temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers/pour son éveil ». Le mot grec peut aussi évoquer la vigilance ; la relation exacte de l’expression et le référent du pronom « son » sont difficiles à déterminer.'
    reason: Préserver l’ambiguïté syntaxique et référentielle de ἐπὶ τὴν ἐγρήγορσιν αὐτοῦ, sans intégrer au texte principal une interprétation non explicitée par le grec.
lexical_decisions:
- source_word: ἔνυξέν
  choice: m’a piqué
  rationale: Le verbe exprime une action vive et ponctuelle, celle de piquer ou d’aiguillonner. « Piquer » conserve l’image concrète sans l’affaiblir en simple encouragement.
- source_word: ὡς κέντρον ἵππου
  choice: comme on pique un cheval avec un aiguillon
  rationale: 'La formulation explicite la comparaison grecque très condensée : κέντρον désigne ici l’aiguillon employé pour faire réagir un cheval.'
- source_word: ἐγρήγορσιν
  choice: me tenir vigilant
  rationale: Le nom grec évoque l’éveil ou la vigilance. La tournure verbale est plus naturelle en français tout en gardant cette idée.
- source_word: ἀντιλήμπτωρ
  choice: celui qui me vient en aide
  rationale: Le terme désigne une personne qui prend en charge, soutient ou secourt. Cette périphrase rend clairement la fonction personnelle exprimée en grec.
- source_word: ἐν παντὶ καιρῷ
  choice: en tout temps
  rationale: Cette expression formelle et naturelle correspond directement à l’idée de constance temporelle du grec.
theological_decisions:
- issue: Référent de αὐτοῦ et relation avec ἐγρήγορσιν
  choice: pour me tenir vigilant devant lui
  alternative: pour son éveil ; pour que je m’éveille à lui ; en vue de sa vigilance
  rationale: Le grec dit littéralement quelque chose comme « vers/pour son éveil (ou sa vigilance) », formulation dont le référent et la relation syntaxique restent difficiles. Le texte principal donne une lecture française cohérente sans identifier davantage le référent ; la note conserve l’ambiguïté.
- issue: Identité du sujet qui pique et du sauveur qui secourt
  choice: ne pas expliciter davantage son identité
  alternative: Dieu m’a piqué… Dieu m’a sauvé
  rationale: Le verset enchaîne les propositions sans nommer explicitement le sujet. L’ajout d’un nom divin résoudrait une donnée que le grec laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. L’image concrète de l’aiguillon est conservée ; la syntaxe grecque condensée est légèrement développée pour être immédiatement compréhensible.
