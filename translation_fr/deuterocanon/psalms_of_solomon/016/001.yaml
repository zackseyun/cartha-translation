  yaml_path: translation/deuterocanon/psalms_of_solomon/016/001.yaml
  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
translation:
  language: fr
  text: Quand mon âme s’assoupissait loin du Seigneur[a], j’ai failli glisser dans la torpeur du sommeil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en s’éloignant du Seigneur ».'
    reason: alternative_reading
  - marker: b
    text: Le terme grec peut aussi évoquer l’accablement, l’assoupissement profond ou la descente dans le sommeil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ νυστάξαι
  choice: Quand … s’assoupissait
  rationale: La construction ἐν τῷ avec l’infinitif est temporelle. La lecture νυστάξαι, attestée dans l’édition citée malgré la transcription fournie συστάξαι, signifie « s’assoupir, somnoler » et correspond au champ lexical de ὕπνου.
- source_word: ψυχήν μου
  choice: mon âme
  rationale: ψυχή peut désigner l’âme, la vie ou la personne; « mon âme » conserve ici la portée intérieure et poétique.
- source_word: ἀπὸ Κυρίου
  choice: loin du Seigneur
  rationale: ἀπό exprime l’éloignement ou la séparation. « Loin du Seigneur » garde la tension relationnelle sans préciser si cet éloignement est volontaire.
- source_word: παρὰ μικρόν
  choice: j’ai failli
  rationale: παρὰ μικρόν est une locution idiomatique signifiant « presque »; avec le verbe, « j’ai failli » est naturel en français.
- source_word: ὠλίσθησα
  choice: glisser
  rationale: Le verbe évoque la perte d’appui. « Glisser » conserve cette image concrète.
- source_word: ἐν καταφορᾷ ὕπνου
  choice: dans la torpeur du sommeil
  rationale: καταφορά peut évoquer une chute, un abattement ou un profond assoupissement. « Torpeur » rend naturellement l’état d’alourdissement tout en laissant « glisser » porter l’image de la chute.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent français naturel de κύριος dans ce contexte religieux.
theological_decisions:
- issue: Valeur de ἀπὸ Κυρίου
  choice: 'éloignement relationnel : « loin du Seigneur »'
  alternative: 'origine : « venant du Seigneur »; séparation plus explicite : « en s’éloignant du Seigneur »'
  rationale: Le contexte associe l’assoupissement à une situation périlleuse de distance par rapport au Seigneur. La formulation choisie préserve cette tension sans attribuer explicitement à l’âme une décision de s’éloigner.
- issue: Lecture du premier verbe
  choice: 'νυστάξαι : « s’assoupissait »'
  alternative: 'συστάξαι, transcription fournie : sens incertain, éventuellement « se rassemblait »'
  rationale: La leçon νυστάξαι signalée pour Swete produit un grec cohérent et un parallélisme direct avec « sommeil ». La forme συστάξαι de la transcription est vraisemblablement une erreur de saisie ou d’OCR et ne doit pas fonder silencieusement un sens théologique différent.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme conserve le mouvement de l’assoupissement vers la glissade, sans employer l’expression peu naturelle « descente du sommeil » dans le corps du texte.
