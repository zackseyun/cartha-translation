  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: fr
  text: Je te rendrai grâce, ô Dieu, car tu m’as secouru pour me sauver, et tu ne m’as pas compté parmi les pécheurs pour la destruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: Je te rendrai grâce
  rationale: Dans cette prière adressée à Dieu, le verbe exprime naturellement la reconnaissance et la louange plutôt que la confession d’un péché.
- source_word: ἀντελάβου μου
  choice: tu m’as secouru
  rationale: Le verbe désigne ici le fait de venir en aide ou de porter secours. Cette traduction naturelle évite de sur-littéraliser l’image de « saisir » et maintient le lien lexical avec l’idée de Dieu comme secours dans le contexte proche.
- source_word: εἰς σωτηρίαν
  choice: pour me sauver
  rationale: La tournure française explicite naturellement le but ou le résultat du secours divin, tout en conservant le sens de σωτηρία.
- source_word: οὐκ ἐλογίσω με
  choice: tu ne m’as pas compté
  rationale: « Compter » rend le sens évaluatif de λογίζομαι et convient au fait d’associer ou non le locuteur à un groupe voué à un même sort.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: avec les pécheurs
  rationale: L’article défini grec est conservé. Dans le contexte des Psaumes de Salomon, « les pécheurs » peut désigner un groupe déterminé, sans que la traduction impose une identification historique précise.
- source_word: εἰς ἀπώλειαν
  choice: pour la perdition
  rationale: « Perdition » conserve la gravité et la portée eschatologique possible de ἀπώλεια, tandis que « pour » rend la destination ou le sort envisagé.
theological_decisions:
- issue: Portée de « les pécheurs »
  choice: 'Conserver l’article défini : « les pécheurs »'
  alternative: « des pécheurs » ou « parmi les pécheurs » au sens générique
  rationale: Le grec emploie l’article défini et le contexte du livre permet d’entendre l’expression comme l’étiquette d’un groupe particulier. La traduction préserve cette possibilité sans trancher son identité.
- issue: Nature du salut évoqué
  choice: Employer la formulation ouverte « pour me sauver »
  alternative: Préciser un salut spirituel, eschatologique ou seulement une délivrance temporelle
  rationale: Le grec σωτηρία peut désigner le salut ou la délivrance. Le contexte immédiat ne justifie pas de réduire cette amplitude à une seule catégorie théologique.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « ô Dieu » conserve la solennité de ὁ θεός. La syntaxe reste proche du grec tout en étant idiomatique en français.
