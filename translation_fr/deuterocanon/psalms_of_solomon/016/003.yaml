  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
translation:
  language: fr
  text: Quand mon âme fut arrachée au Seigneur, le Dieu d’Israël[a] — si le Seigneur ne m’avait secouru[b] par sa miséricorde pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand mon âme fut emportée loin du Seigneur, le Dieu d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne m’était venu en aide » ; littéralement, le verbe peut évoquer le fait de saisir quelqu’un pour le soutenir.'
    reason: lexical_alternative
  - marker: c
    text: « Pour toujours » peut qualifier soit la miséricorde du Seigneur, soit l’ensemble de son intervention secourable.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: Quand … était arrachée
  rationale: La construction ἐν + infinitif articulaire a une valeur temporelle. « Était arrachée » rend le passif et la violence possible de διενεχθῆναι, tout en restant naturel en français.
- source_word: ψυχήν μου
  choice: mon âme
  rationale: Dans ce contexte de prière et de péril mortel, « âme » conserve la portée personnelle et spirituelle de ψυχή sans la réduire à la seule vie physique.
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: au Seigneur, le Dieu d’Israël
  rationale: Après « arrachée », le français emploie naturellement « à » pour exprimer la séparation. L’apposition explicite le rapport entre « Seigneur » et « Dieu d’Israël ».
- source_word: εἰ μὴ
  choice: si … ne …
  rationale: La tournure conditionnelle irréelle « si le Seigneur ne m’avait… » conserve la structure grecque et le lien implicite avec la pensée commencée au verset précédent.
- source_word: ἀντελάβετό μου
  choice: m’avait secouru
  rationale: Le verbe évoque le fait de saisir quelqu’un pour le soutenir ou lui venir en aide. « Secouru » exprime clairement cette intervention salvatrice.
- source_word: τῷ ἐλέει αὐτοῦ
  choice: par sa miséricorde
  rationale: Le datif est instrumental. « Par sa miséricorde » présente celle-ci comme le moyen du secours divin.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression française courante rend la durée indéfinie de la formule grecque. Sa position finale maintient l’ambiguïté de son rattachement.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Souverain
  rationale: « Seigneur » est l’équivalent français traditionnel et naturel de κύριος dans ce contexte, sans imposer une distinction absente du texte grec.
- issue: Portée de εἰς τὸν αἰῶνα
  choice: 'Maintien en position finale : « par sa miséricorde, pour toujours »'
  alternative: « par sa miséricorde éternelle » ou rattachement explicite à l’action de secourir
  rationale: Le grec permet de rattacher la formule soit à la miséricorde, soit plus largement au secours divin. La position finale évite de trancher.
- issue: Caractère incomplet de la construction conditionnelle
  choice: Conserver la tournure suspendue du verset
  alternative: Ajouter une conséquence telle que « j’aurais péri »
  rationale: Le verset complète une pensée amorcée auparavant, mais le grec ne formule pas ici de conséquence explicite. En ajouter une résoudrait indûment la tension syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve volontairement sa structure conditionnelle suspendue, qui dépend du contexte précédent. Le tiret signale la transition vers la condition sans ajouter au grec une conséquence non exprimée.
