    issue: Aspect verbal de « était arrachée »
    rationale: διενεχθῆναι est un infinitif aoriste passif. « Fut arrachée » restitue plus directement l’action ponctuelle ou globale, sans transformer la forme en procès en cours.
  - severity: low
    issue: Virgule avant « pour toujours »
    rationale: Le grec n’isole pas εἰς τὸν αἰῶνα par une pause. En français, cette virgule est inutile et alourdit la clausule ; l’absence de virgule laisse ouverte la portée sur la miséricorde ou sur le secours.
  - severity: low
