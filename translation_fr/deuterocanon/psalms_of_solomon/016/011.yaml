review_pass:
  verdict: revise
  source_fidelity: La traduction principale substitue « quand je pèche » à la deuxième personne singulière explicitement transmise par ἁμαρτήσῃς. Même si cette forme est contextuellement très difficile et peut refléter une altération, une telle émendation ne doit pas être intégrée sans signaler dans le texte la lecture transmise. La construction ἐν τῷ σε παιδεύειν est bien rendue par une subordonnée temporelle où « tu » est le sujet de « corriger ».
  naturalness: La formulation est globalement fluide et d’un registre approprié. « Éloigne de moi » rend plus directement l’impératif grec que « Tiens loin de moi ». La phrase demeure nécessairement inhabituelle, car le grec transmis l’est aussi.
  terminology: « Murmures », « découragement », « détresse » et « corriger » sont des choix naturels et adéquats. « Me ramener au repentir » explicite sobrement la finalité de εἰς ἐπιστροφήν; « repentir » conserve le terme théologique sans surcharge confessionnelle.
  issues:
  - severity: high
    issue: Le texte principal corrige implicitement la personne de ἁμαρτήσῃς.
    rationale: Le grec fourni porte « si tu pèches » et non « quand je pèche ». Le contexte peut motiver une conjecture ou une correction textuelle, mais la source transmise et son ambiguïté doivent être préservées, plutôt que résolues selon une considération doctrinale ou contextuelle.
  - severity: medium
    issue: L’ancre de note est placée à la fin du verset plutôt qu’au terme textuellement disputé.
    rationale: La note concerne précisément ἁμαρτήσῃς; l’appel doit suivre « pèches » afin de rendre le lien transparent.
  revised_text: Éloigne de moi les murmures et le découragement dans la détresse, si tu pèches[a] alors que tu me corriges pour me ramener au repentir.
  revised_footnotes:
  - marker: a
    text: Le grec transmis porte « si tu pèches » (à la deuxième personne du singulier). Le verbe peut aussi signifier « si tu te trompes ». La formulation est difficile dans le contexte; « si/quand je pèche » supposerait une correction du texte grec.
    reason: Préserver la leçon grecque transmise et signaler sans l’imposer la solution contextuelle qui attribuerait le verbe au priant.
  revision_rationale: La révision restitue la deuxième personne du texte grec et la valeur conditionnelle de ἐάν, sans prétendre trancher la difficulté textuelle. Elle conserve les bons choix lexicaux du projet et déplace l’appel de note sur le mot concerné.
