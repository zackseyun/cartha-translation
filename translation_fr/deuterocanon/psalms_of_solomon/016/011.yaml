  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: fr
  text: Tiens loin de moi les murmures et le découragement dans la détresse, quand je pèche et que tu me corriges pour m’amener au repentir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis porte littéralement : « si tu pèches »; le verbe peut aussi signifier « si tu te trompes en me corrigeant ». Le contexte paraît plutôt supposer : « quand je pèche ».'
    reason: 'Signaler une difficulté textuelle et grammaticale véritable : ἁμαρτήσῃς est à la deuxième personne, alors que le contexte semble appeler la première personne.'
lexical_decisions:
- source_word: γογγυσμόν
  choice: les murmures
  rationale: Le nom désigne des plaintes murmurées, empreintes de mécontentement. « Les murmures » convient au registre biblique tout en restant clair en français moderne.
- source_word: ὀλιγοψυχίαν
  choice: le découragement
  rationale: Le terme exprime le manque de courage ou l’abattement. « Découragement » restitue naturellement cet état intérieur sans recourir à un calque obscur.
- source_word: ἐν θλίψει
  choice: dans la détresse
  rationale: θλῖψις évoque une situation d’oppression, d’épreuve ou de détresse. Cette formulation est naturelle et conserve la gravité de la prière.
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: Tiens loin de moi
  rationale: L’impératif demande que ces dispositions demeurent à distance du priant. La tournure française reproduit directement cette image.
- source_word: ἐὰν ἁμαρτήσῃς
  choice: quand je pèche
  rationale: Le grec transmis porte formellement la deuxième personne, « si tu pèches/te trompes », mais le contexte paraît exiger le priant comme sujet et suppose vraisemblablement une altération textuelle. Le corps du texte suit le sens contextuel retenu par la couche de consultation, tandis que la leçon grecque est signalée en note.
- source_word: ἐν τῷ σε παιδεύειν
  choice: et que tu me corriges
  rationale: La construction à infinitif articulé est temporelle; σε est le sujet explicite de παιδεύειν. « Corriger » exprime ici une discipline éducative, et « me » est fourni par le contexte.
- source_word: εἰς ἐπιστροφήν
  choice: pour m’amener au repentir
  rationale: ἐπιστροφή signifie un retour ou un changement d’orientation, d’où le repentir. Cette formulation conserve la finalité de la correction et rend naturellement la valeur directionnelle de εἰς.
theological_decisions:
- issue: Le texte grec transmis semble attribuer l’action de pécher ou de se tromper à Dieu.
  choice: Adopter dans le texte principal le sens contextuel « quand je pèche », en signalant la forme transmise dans une note.
  alternative: Traduire littéralement « si tu pèches » ou, selon un autre sens du verbe, « si tu te trompes en me corrigeant ».
  rationale: Attribuer sans explication le péché à Dieu créerait une affirmation théologique probablement étrangère à la prière. Toutefois, la difficulté réelle du témoin grec ne doit pas être effacée; la note la conserve explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. « Murmures » maintient la tonalité biblique sans archaïsme marqué; « découragement » et « détresse » rendent la dimension intérieure et éprouvante de la prière. La phrase reste compacte, conformément au parallélisme et à la densité du grec.
