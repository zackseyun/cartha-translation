  text: Direct the works of my hands in your place, and guard my steps in the remembrance of you.
translation:
  language: fr
  text: Dirige les œuvres de mes mains dans le lieu qui est le tien[a], et préserve mes pas dans le souvenir de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ta présence ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ta mémoire » ; le grec peut aussi être compris comme une demande adressée à Dieu de garder les pas du priant dans son souvenir.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: κατεύθυνον
  choice: Dirige
  rationale: L’impératif demande à Dieu d’orienter les actions du priant dans la bonne direction. « Dirige » est naturel et garde l’idée de conduite contenue dans le verbe grec.
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: les œuvres de mes mains
  rationale: Cette formulation conserve l’expression concrète et sémitisante du grec, qui désigne ce que le priant accomplit.
- source_word: ἐν τόπῳ σου
  choice: dans le lieu qui est le tien
  rationale: τόπος signifie d’abord « lieu ». Cette traduction reste proche du texte sans imposer dans le corps du verset l’interprétation contextuelle « en ta présence ».
- source_word: τὰ διαβήματά μου
  choice: mes pas
  rationale: Le mot évoque les déplacements et, par extension, la conduite du priant. « Mes pas » rend naturellement les deux dimensions.
- source_word: διαφύλαξον
  choice: préserve
  rationale: Le verbe renforcé exprime l’action de garder soigneusement ou de maintenir en sûreté. « Préserve » s’accorde naturellement avec « mes pas ».
- source_word: ἐν τῇ μνήμῃ σου
  choice: dans le souvenir de toi
  rationale: 'La formulation rend μνήμη et permet de comprendre le génitif comme objectif : le priant se souvient de Dieu. Ce choix correspond aussi au parallèle interne du psaume, tout en signalant l’autre analyse en note.'
theological_decisions:
- issue: Qui se souvient de qui dans ἐν τῇ μνήμῃ σου ?
  choice: 'Le priant garde Dieu dans son souvenir : « dans le souvenir de toi »'
  alternative: 'Dieu garde le priant dans sa mémoire : « dans ton souvenir » ou « dans ta mémoire »'
  rationale: Le génitif peut formellement prêter à discussion, mais le parallèle du verset 6 favorise un génitif objectif, c’est-à-dire le souvenir que le priant a de Dieu. La traduction principale exprime cette lecture sans supprimer l’autre possibilité, donnée en note.
translation_notes:
  register: Français moderne, digne et accessible. « Les œuvres de mes mains » conserve volontairement l’image concrète du texte. « Le lieu qui est le tien » est légèrement marqué, mais évite l’archaïsme « en ton lieu » et l’interprétation non signalée « en ta présence ».
