  source_fidelity: 'Le sens général est bien rendu, mais « ces épreuves » explicite davantage que le grec ἐν τούτοις (« dans ces choses / circonstances-ci »). Le contexte peut désigner des difficultés, sans que le mot « épreuves » soit présent dans ce verset. La note b affirme en outre à tort que « recevra miséricorde » conserve la voix passive : cette formulation française est active, même si elle exprime adéquatement le bénéfice de la miséricorde.'
