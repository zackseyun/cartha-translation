  text: When the righteous one endures in these things[b][a], he will be shown mercy by the Lord.
translation:
  language: fr
  text: Quand le juste endure ces choses[a][b], le Seigneur lui fera miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans ces choses » ; l’expression renvoie vraisemblablement aux difficultés mentionnées auparavant.
    reason: Clarifie la formulation littérale de ἐν τούτοις sans imposer « épreuves » dans le texte principal.
  - marker: b
    text: 'Ou : « En endurant ces choses, le juste recevra miséricorde du Seigneur. »'
    reason: La construction grecque avec ἐν et l’infinitif articulé peut être comprise dans un sens instrumental (« en endurant ») plutôt que temporel (« quand »).
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: Quand ... persévère
  rationale: La construction ἐν avec l’infinitif articulé peut exprimer le temps ou le moyen. Le sens temporel convient au contexte, tandis que « persévère » rend l’endurance au milieu des difficultés.
- source_word: δίκαιον
  choice: le juste
  rationale: L’accusatif masculin singulier est compris comme le sujet de l’infinitif. « Le juste » conserve sa valeur substantive et peut avoir une portée représentative.
- source_word: ἐν τούτοις
  choice: dans ces épreuves
  rationale: Le démonstratif renvoie aux difficultés évoquées dans le contexte. « Épreuves » explicite légèrement ce référent pour produire un français naturel, sans définir davantage leur nature.
- source_word: ἐλεηθήσεται
  choice: lui fera miséricorde
  rationale: Cette tournure française naturelle exprime l’action miséricordieuse dont le juste bénéficie. La voix passive grecque est transposée à l’actif avec le Seigneur comme agent explicite.
- source_word: ὑπὸ Κυρίου
  choice: le Seigneur
  rationale: Avec le génitif, ὑπό désigne l’agent du passif. La restructuration active place naturellement « le Seigneur » en position de sujet.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte dévotionnel, « Seigneur » est la désignation française naturelle et traditionnelle, sans imposer une précision absente du grec.
- issue: Rapport entre persévérance et miséricorde
  choice: Lien temporel dans le texte principal
  alternative: 'Lien instrumental ou circonstanciel : « En persévérant… »'
  rationale: La construction grecque permet plusieurs nuances. Le texte principal retient la lecture temporelle adaptée au contexte, tandis qu’une note préserve la possibilité instrumentale.
translation_notes:
  register: Français international moderne, digne et accessible. « Le juste » est idiomatique dans le registre biblique sans être archaïque. « Faire miséricorde » maintient le vocabulaire théologique du grec; les notes signalent les principales ambiguïtés syntaxiques et lexicales.
