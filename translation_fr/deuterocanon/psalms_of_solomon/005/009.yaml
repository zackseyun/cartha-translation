  yaml_path: translation/deuterocanon/psalms_of_solomon/005/009.yaml
  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: fr
  text: Et si tu ne nous fais pas revenir[a], nous ne nous tiendrons pas à l’écart[b], mais nous viendrons à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne nous ramènes pas » ou « tu ne nous rétablis pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous ne nous éloignerons pas » ou « nous ne nous abstiendrons pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: si … ne … pas
  rationale: Cette formulation conserve la structure conditionnelle directe du grec sans la condenser en « à moins que ».
- source_word: ἐπιστρέψῃς ἡμᾶς
  choice: tu ne nous fais pas revenir
  rationale: Le causatif « faire revenir » rend le verbe transitif avec ἡμᾶς pour complément, tout en préservant l’idée de retour sans imposer le sens doctrinal de conversion ni réduire le mouvement à un déplacement physique.
- source_word: οὐκ ἀφεξόμεθα
  choice: nous ne nous tiendrons pas à l’écart
  rationale: Le moyen futur exprime ici le fait de ne pas se retirer ou de ne pas garder ses distances. Cette tournure française prépare naturellement le contraste avec « nous viendrons à toi ».
- source_word: ἀλλʼ
  choice: mais
  rationale: La conjonction adversative simple reproduit sobrement le contraste grec.
- source_word: ἐπὶ σὲ ἥξομεν
  choice: nous viendrons à toi
  rationale: Cette traduction rend le mouvement vers la personne interpellée et conserve la force relationnelle de l’expression.
theological_decisions:
- issue: Déterminer si ἐπιστρέψῃς doit recevoir un sens explicitement spirituel ou doctrinal
  choice: tu nous fais revenir
  alternative: tu nous rétablis / tu nous convertis
  rationale: Le grec évoque un retour provoqué par Dieu, mais ne précise pas à lui seul s’il s’agit de restauration, de retour spirituel ou d’un autre rétablissement. La traduction maintient cette ouverture.
translation_notes:
  register: 'Français moderne, sobre et digne, avec tutoiement de Dieu conforme au registre poétique biblique. La syntaxe conserve le paradoxe apparent de l’appel : même sans être ramenés par Dieu, les locuteurs déclarent qu’ils ne resteront pas à distance, mais viendront à lui.'
