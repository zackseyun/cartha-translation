  yaml_path: translation/deuterocanon/psalms_of_solomon/005/001.yaml
  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
translation:
  language: fr
  text: Seigneur Dieu, je louerai ton nom dans l’allégresse, au milieu de ceux qui connaissent tes justes jugements.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi ceux qui comprennent tes jugements équitables ».
    reason: Alternative lexicale reflétant les nuances possibles de ἐν μέσῳ, ἐπισταμένων et δίκαια.
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: Seigneur Dieu
  rationale: L’expression associe le vocatif κύριε au titre divin apposé ὁ θεός. « Seigneur Dieu » est naturel dans la prière biblique française et conserve les deux désignations.
- source_word: αἰνέσω
  choice: je louerai
  rationale: Le futur exprime ici la déclaration ou la résolution du psalmiste; le futur simple en maintient directement la valeur.
- source_word: τῷ ὀνόματί σου
  choice: ton nom
  rationale: Cette formulation conserve l’idiome biblique du nom de Dieu, qui évoque sa personne révélée et sa réputation.
- source_word: ἐν ἀγαλλιάσει
  choice: dans l’allégresse
  rationale: La préposition et le nom indiquent la manière joyeuse et exaltée de la louange. « Allégresse » garde un registre digne sans être archaïque.
- source_word: ἐν μέσῳ
  choice: au milieu de
  rationale: Le rendu préserve l’image spatiale et communautaire du grec, plutôt que de la réduire au simple sens de « parmi ».
- source_word: ἐπισταμένων
  choice: ceux qui connaissent
  rationale: Le participe de ἐπίσταμαι peut désigner ceux qui savent, connaissent ou comprennent. « Connaissent » est ici concis et naturel, tout en laissant l’autre nuance en note.
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: tes justes jugements
  rationale: « Jugements » maintient la portée judiciaire de κρίματα, tandis que « justes » rend δίκαια et affirme leur rectitude morale.
