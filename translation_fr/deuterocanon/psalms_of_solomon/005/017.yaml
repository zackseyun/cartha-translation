  text: Your mercy is over all the earth, O Lord, in kindness.
translation:
  language: fr
  text: Ta miséricorde s’étend sur toute la terre, Seigneur, dans ta bonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  choice: miséricorde
  rationale: « Miséricorde » rend directement l’idée de compassion envers ceux qui sont dans le besoin, sans introduire explicitement la nuance d’amour d’alliance propre à d’autres termes.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: s’étend sur toute la terre
  rationale: Avec ἐπί et l’accusatif, l’expression marque une extension couvrant la terre entière. Le verbe « s’étend », nécessaire en français dans cette proposition grecque sans verbe exprimé, en donne naturellement la portée.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif grec est rendu par l’apostrophe directe « Seigneur », forme naturelle et digne en français moderne.
- source_word: χρηστότητι
  choice: dans ta bonté
  rationale: χρηστότης peut désigner la bonté ou la bienveillance. « Bonté » conserve ici une formulation ample et naturelle; le possessif explicite le lien avec le Seigneur déjà interpellé.
- source_word: '[copule implicite]'
  choice: s’étend
  rationale: La proposition grecque est sans verbe exprimé. « S’étend » produit un français idiomatique et préserve la valeur spatiale de ἐπὶ πᾶσαν τὴν γῆν, sans préciser davantage le mode d’action de la miséricorde.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’apostrophe « Seigneur » demeure formelle sans l’interjection vieillie « ô ». La formulation conserve la portée universelle de πᾶσαν τὴν γῆν et la relation légèrement elliptique entre « miséricorde » et « bonté ».
