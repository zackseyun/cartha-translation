  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
translation:
  language: fr
  text: Et toi, tu exauceras[a], car qui est bon et doux, sinon toi, pour réjouir l’âme de l’humble quand tu ouvres ta main dans ta miséricorde[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu écouteras favorablement » ; le verbe peut désigner une écoute qui répond à la prière.
    reason: lexical_alternative
  - marker: b
    text: « Ouvrir la main » est une image qui évoque le don généreux et la satisfaction des besoins.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: tu exauceras
  rationale: Dans un contexte de prière, ἐπακούω désigne souvent une écoute favorable qui répond à la supplication. « Exaucer » exprime naturellement cette écoute active en français.
- source_word: χρηστός
  choice: bon
  rationale: « Bon » conserve la portée morale et bienfaisante du terme sans la réduire à la seule amabilité.
- source_word: ἐπιεικής
  choice: doux
  rationale: « Doux » rend ici la disposition clémente et bienveillante évoquée par l’adjectif, dans un registre poétique naturel.
- source_word: εὐφρᾶναι
  choice: pour réjouir
  rationale: L’infinitif est conservé afin de maintenir son lien syntaxique avec la qualité et l’action attribuées à Dieu.
- source_word: ψυχὴν ταπεινοῦ
  choice: l’âme de l’humble
  rationale: Cette formulation suit la lecture contextualisée de l’édition, « l’âme de l’humble », et préserve le registre poétique et spirituel.
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: quand tu ouvres ta main
  rationale: La tournure temporelle est naturelle en français et garde l’image biblique de la main ouverte, symbole de don généreux.
- source_word: ἐν ἐλέει
  choice: dans ta miséricorde
  rationale: La préposition et le substantif sont maintenus dans une expression française élevée et courante dans le langage biblique.
theological_decisions:
- issue: Portée de l’écoute divine exprimée par ἐπακούσῃ
  choice: tu exauceras
  alternative: tu écouteras / tu écouteras favorablement
  rationale: « Exaucer » fait entendre une réponse favorable sans préciser la forme concrète de cette réponse et sans ajouter de doctrine au texte.
translation_notes:
  register: Français international moderne, poétique et digne. La structure interrogative et l’infinitif « pour réjouir » préservent la tension syntaxique du grec, tandis que « ouvrir la main » maintient l’image biblique sans l’expliciter dans le corps du verset.
