  source_fidelity: 'Le texte rend avec fidélité la construction de louange : ἐπακούσῃ est bien compris comme une écoute favorable/exaucement, χρηστός et ἐπιεικής comme « bon et doux », et l’infinitif εὐφρᾶναι est conservé par « pour réjouir ». « L’âme de l’humble » suit la leçon génitive ταπεινοῦ, nécessaire au sens et signalée par l’historique éditorial malgré la forme manifestement fautive/océrisée ταπεινὸν dans l’extrait source. L’image de la main ouverte et ἐν ἐλέει sont préservées sans surinterprétation.'
