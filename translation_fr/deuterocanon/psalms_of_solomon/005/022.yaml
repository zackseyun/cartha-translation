  text: Blessed be the glory of the Lord, for he himself is our king.
translation:
  language: fr
  text: Bénie soit la gloire du Seigneur, car c’est lui qui est notre roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένη
  choice: Bénie soit
  rationale: L’adjectif féminin s’accorde avec « gloire » et fonctionne ici comme une formule doxologique avec copule sous-entendue. « Bénie soit » en conserve la force de bénédiction dans un français naturel et digne.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » est l’équivalent direct et consacré, capable d’évoquer à la fois la splendeur divine et l’honneur qui revient au Seigneur.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Le grec porte κύριος ; « Seigneur » est donc la traduction directe, sans introduire la convention typographique réservée au nom divin hébreu.
- source_word: ὅτι
  choice: car
  rationale: « Car » rend la valeur explicative ou causale de la conjonction et convient au registre doxologique de la phrase.
- source_word: αὐτὸς
  choice: c’est lui qui
  rationale: La tournure disloquée met naturellement en relief le pronom intensif en français, sans lui ajouter le sens exclusif de « lui seul ».
- source_word: βασιλεὺς
  choice: roi
  rationale: « Roi » est le sens premier du terme et préserve sans atténuation la confession royale du verset.
theological_decisions:
- issue: Valeur emphatique de αὐτός
  choice: c’est lui qui est notre roi
  alternative: il est lui-même notre roi
  rationale: Le texte souligne l’identité du Seigneur comme roi. La tournure choisie rend cette emphase idiomatiquement, tout en évitant d’ajouter une affirmation explicite d’exclusivité absente du grec.
translation_notes:
  register: Français moderne international, sobre et doxologique. La structure en deux membres est conservée, avec une formulation accessible à la lecture publique.
