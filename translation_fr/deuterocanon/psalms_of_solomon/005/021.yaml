  text: Those who fear the Lord rejoiced in good things[a], and your goodness is upon Israel[c][b], your kingdom.
translation:
  language: fr
  text: Ceux qui craignent le Seigneur se sont réjouis au milieu des biens[a], et ta bonté repose sur Israël dans ton règne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont été rendus heureux au milieu des bonnes choses ». Le mot peut aussi désigner des « bienfaits ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans ton royaume / règne ». Le dernier groupe est syntaxiquement ambigu : il peut exprimer la sphère (« dans ton règne »), et peut-être aussi être rattaché plus étroitement à Israël (« Israël, ton royaume »).'
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: se sont réjouis
  rationale: Cette tournure française naturelle exprime le fait d’avoir été rempli de joie, sens du passif aoriste, sans alourdir la phrase par un passif artificiel.
- source_word: οἱ φοβούμενοι Κύριον
  choice: ceux qui craignent le Seigneur
  rationale: Le participe substantivé désigne ceux qui se caractérisent par leur crainte révérencielle du Seigneur; la formulation reste naturelle et transparente.
- source_word: ἐν ἀγαθοῖς
  choice: au milieu des biens
  rationale: 'La traduction conserve la préposition et le pluriel substantivé, tout en laissant ouverte la portée de ἀγαθά: biens, bonnes choses ou bienfaits.'
- source_word: ἡ χρηστότης σου
  choice: ta bonté
  rationale: «Bonté» rend le sens large de qualité bienfaisante sans le réduire à la seule gentillesse.
- source_word: ἐπʼ Ἰσραήλ
  choice: repose sur Israël
  rationale: Le verbe «repose», fourni en français avec la copule implicite du grec, communique naturellement l’idée d’une bonté étendue sur Israël.
- source_word: τῇ βασιλείᾳ σου
  choice: dans ton règne
  rationale: Le datif ne s’accorde pas avec Ἰσραήλ, accusatif après ἐπί, et ne constitue donc pas une apposition grammaticale régulière. Il est compris comme un datif de sphère; «règne» convient ici mieux que «royaume» à l’exercice de la royauté divine.
theological_decisions:
- issue: Rapport de τῇ βασιλείᾳ σου avec Israël et la bonté divine
  choice: dans ton règne
  alternative: par ton règne; pour ton royaume
  rationale: Le datif permet une nuance de sphère ou éventuellement de moyen. La traduction principale retient la sphère du règne divin sans identifier artificiellement «Israël» et «ton royaume», dont les cas grecs diffèrent.
translation_notes:
  register: Français international moderne, digne et lisible. La structure parallèle et le vocabulaire théologique traditionnel sont conservés, tandis que la fin du verset respecte l’écart de cas entre «Israël» et «ton règne» au lieu de les présenter comme une apposition directe.
