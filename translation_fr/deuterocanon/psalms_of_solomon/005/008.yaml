  yaml_path: translation/deuterocanon/psalms_of_solomon/005/008.yaml
  text: Do not lay your hand heavily upon us, so that we may not sin under compulsion.
translation:
  language: fr
  text: Ne fais pas peser lourdement ta main sur nous, de peur que nous ne péchions sous la contrainte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne rends pas ta main lourde sur nous, afin que nous ne péchions pas par nécessité. »'
    reason: Alternative plus littérale pour βαρύνῃς, ἵνα μὴ et διʼ ἀνάγκην.
lexical_decisions:
- source_word: βαρύνῃς
  choice: fais pas peser lourdement
  rationale: Le verbe exprime littéralement l’action de rendre lourd. Cette formulation conserve l’image grecque tout en restant intelligible en français.
- source_word: χεῖρά
  choice: main
  rationale: Le terme concret « main » préserve l’image biblique d’une puissance exercée ou d’une affliction imposée.
- source_word: ἐφʼ ἡμᾶς
  choice: sur nous
  rationale: « Sur nous » convient à l’image d’une main qui pèse et n’impose pas inutilement l’idée plus étroite d’hostilité.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: Cette tournure française naturelle exprime ici le résultat redouté ou le but négatif lié à la supplication précédente.
- source_word: διʼ ἀνάγκην
  choice: sous la contrainte
  rationale: La locution grecque peut désigner la nécessité ou la contrainte. « Sous la contrainte » rend clairement la pression susceptible de conduire au péché sans préciser abusivement sa nature.
- source_word: ἁμάρτωμεν
  choice: nous ne péchions
  rationale: Le subjonctif français après « de peur que » correspond naturellement à l’aoriste subjonctif grec dans cette proposition dépendante.
theological_decisions:
- issue: Rapport entre l’épreuve imposée et le péché possible
  choice: de peur que nous ne péchions sous la contrainte
  alternative: afin que nous ne péchions pas par nécessité
  rationale: 'La traduction conserve la tension du texte : la pression est présentée comme pouvant mener au péché, sans affirmer qu’elle supprimerait la responsabilité humaine ni résoudre la relation entre contrainte et faute.'
translation_notes:
  register: Français international moderne, digne et accessible. L’image concrète de la main est maintenue; la formulation évite aussi bien l’archaïsme que la paraphrase doctrinale.
