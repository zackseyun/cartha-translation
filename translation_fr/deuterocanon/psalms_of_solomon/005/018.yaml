  text: Blessed is the one whom God remembers with measured sufficiency[a][b].
translation:
  language: fr
  text: Heureux celui dont Dieu se souvient avec une suffisance mesurée.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Heureux celui dont Dieu se souvient dans une juste mesure de suffisance. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « suffisance » peut aussi signifier « contentement » ou, plus littéralement, « autosuffisance ».
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Terme traditionnel des béatitudes en français biblique, naturel et digne, sans réduire l’expression à une simple émotion passagère.
- source_word: οὗ
  choice: celui dont
  rationale: Le génitif du pronom relatif dépend de μνημονεύει. « Celui dont Dieu se souvient » est grammaticalement précis et idiomatique en français.
- source_word: μνημονεύει
  choice: se souvient
  rationale: Rend directement l’idée de se rappeler ou de garder quelqu’un présent à l’esprit, tout en laissant ouverte la nuance biblique d’une attention bienveillante.
- source_word: ἐν συμμετρίᾳ
  choice: juste
  rationale: Dans cette tournure, συμμετρία évoque la juste mesure, la proportion convenable. « Juste ce qu’il lui faut » exprime naturellement une suffisance mesurée.
- source_word: αὐταρκίας
  choice: ce qu’il lui faut
  rationale: αὐταρκία peut désigner la suffisance, le fait d’avoir assez ou le contentement. Cette formulation évite le contresens moderne d’une autonomie indépendante de Dieu et convient au contexte de la provision divine.
theological_decisions:
- issue: Sens de αὐταρκίας dans son rapport à l’action de Dieu
  choice: La phrase évoque Dieu qui accorde à la personne ce qui lui suffit, dans une juste mesure.
  alternative: La phrase peut mettre l’accent sur le contentement intérieur ou, plus littéralement, sur l’autosuffisance.
  rationale: Dieu étant le sujet de μνημονεύει, la formulation principale garde au premier plan son attention providentielle sans effacer la gamme sémantique de αὐταρκία, signalée en note.
- issue: Valeur de μνημονεύει
  choice: « se souvient » conserve la formulation du texte grec et peut impliquer une attention active et bienveillante.
  alternative: « prend soin » expliciterait directement la conséquence providentielle.
  rationale: Le texte dit littéralement « se souvient ». Il ne faut pas remplacer sans indication cette image biblique par son interprétation, même si le contexte suggère une sollicitude concrète.
translation_notes:
  register: Français international moderne, simple et digne. La tournure principale privilégie l’intelligibilité immédiate tout en conservant l’image selon laquelle Dieu « se souvient » de quelqu’un. Les notes rendent visibles le caractère condensé du grec et l’ambiguïté de αὐταρκία.
