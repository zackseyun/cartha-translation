review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement l’abondance, la bonté et la richesse du don. En revanche, « tu ne ménageras pas tes dons » introduit Dieu comme sujet explicite et « tes dons » comme objet, alors que le grec porte un futur à la troisième personne (οὐ φείσεται) et ne formule ni ce sujet divin ni ce pluriel. Cette résolution interprétative ne doit pas figurer sans réserve dans le texte courant.
  naturalness: Le français du premier membre est fluide après un léger ajustement. Pour le dernier membre, une formulation littérale avec personnification (« l’espérance… ne sera pas parcimonieuse ») demeure volontairement resserrée, mais elle respecte l’ellipse du grec; une note donne une reconstruction française plus idiomatique.
  terminology: « Don », « bonté », « abondant » et « riche » rendent adéquatement δόμα, χρηστότης, πολύ et πλούσιον. « Parcimonieuse » restitue le champ de φείδομαι sans imposer la lecture selon laquelle Dieu refuserait ou dispenserait ses dons.
  issues:
  - severity: high
    issue: Sujet divin ajouté dans la dernière proposition
    rationale: 'Le texte grec ne dit pas « tu ne ménageras pas » : φείσεται est à la troisième personne du singulier. Faire de Dieu le sujet, puis ajouter « tes dons », tranche une ellipse syntaxique disputée et modifie la forme de l’énoncé.'
  - severity: medium
    issue: Note explicative inexacte sur la littéralité
    rationale: La note actuelle présente « l’espérance en toi… ne ménagera pas dans le don » comme littéral, mais le texte complet comprend aussi οὐκ ἔστιν. Elle doit signaler l’incertitude de construction plutôt que proposer une paraphrase incomplète comme traduction littérale.
  revised_text: Mais ton don est abondant de bonté et riche ; et l’espérance en toi ne sera pas parcimonieuse dans le don.[a]
  revised_footnotes:
  - marker: a
    text: 'Le grec est très condensé et sa syntaxe est incertaine. La formulation conserve la personnification de « l’espérance ». On peut aussi comprendre : « il n’est personne qui espère en toi qui se montre parcimonieux dans le don ». Une interprétation contextuelle fait de Dieu celui qui ne retient pas son don, mais ce sujet n’est pas exprimé dans le grec.'
    reason: ambiguïté syntaxique et alternative interprétative
  revision_rationale: La révision retire l’ajout non exprimé d’un sujet divin et d’un pluriel « dons ». Elle conserve l’ambiguïté grammaticale du grec dans le texte et expose, sans privilégier doctrinalement ni contextuellement une solution, les principales reconstructions dans la note.
