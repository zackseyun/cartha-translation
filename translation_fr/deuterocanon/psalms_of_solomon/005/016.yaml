  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: fr
  text: Mais ton don, accordé avec bonté, est abondant et généreux ; et à celui qui espère en toi, tu ne ménageras pas tes dons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de la dernière proposition est très condensé et quelque peu elliptique. Littéralement, il peut se comprendre ainsi : « l’espérance en toi… ne ménagera pas dans le don ». Autre traduction possible : « celui qui espère en toi ne donnera pas avec parcimonie ».'
    reason: ambiguïté syntaxique et alternative lexicale
lexical_decisions:
- source_word: δόμα
  choice: don / dons
  rationale: δόμα désigne ce qui est donné. Le singulier est conservé dans la première proposition ; le pluriel idiomatique de la seconde exprime l’acte de donner sans limiter le propos à un objet précis.
- source_word: πολύ
  choice: abondant
  rationale: πολύ souligne ici l’ampleur du don ; « abondant » convient au contexte de générosité.
- source_word: μετὰ χρηστότητος
  choice: accordé avec bonté
  rationale: χρηστότης exprime la bonté bienveillante qui accompagne le don. L’ajout de « accordé » rend la relation naturelle en français.
- source_word: πλούσιον
  choice: généreux
  rationale: πλούσιον signifie littéralement « riche », mais qualifie ici un don largement accordé ; « généreux » transmet ce sens sans suggérer seulement la richesse matérielle.
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: celui qui espère en toi
  rationale: Le grec emploie abstraitement « l’espérance en toi ». La formulation personnelle est naturelle en français et explicite l’espérant impliqué par le contexte.
- source_word: οὐ φείσεται ἐν δόματι
  choice: tu ne ménageras pas tes dons
  rationale: φείδομαι signifie « épargner, ménager, retenir ». Le contexte oppose la générosité divine à la parcimonie humaine ; la traduction comprend donc Dieu comme celui qui ne retient pas ses dons, tout en signalant en note l’ellipse grammaticale.
theological_decisions:
- issue: Sujet implicite de οὐ φείσεται et bénéficiaire du don
  choice: Dieu ne ménagera pas ses dons à celui qui espère en lui
  alternative: Celui qui espère en Dieu ne sera pas parcimonieux lorsqu’il donne
  rationale: La syntaxe grecque est fortement comprimée et permet formellement plusieurs reconstructions. Toutefois, le contraste contextuel porte sur l’abondance du don divin ; la lecture retenue garde donc l’espérant comme bénéficiaire, sans faire de lui le donateur.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Tu ne ménageras pas tes dons » conserve l’idée de non-parcimonie tout en rendant explicite la relation suggérée par le contexte. Le marqueur de note suit la proposition ambiguë.
