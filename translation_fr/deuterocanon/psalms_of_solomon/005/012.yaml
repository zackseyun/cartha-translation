  text: And if they are hungry[a], they will lift up their faces to you.
translation:
  language: fr
  text: Et s’ils ont faim, ils lèveront le visage vers toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. « ils lèveront leur visage vers toi » : expression grecque évoquant le fait de se tourner vers Dieu pour implorer son aide ou dépendre de lui.'
    reason: cultural_note
lexical_decisions:
- source_word: πεινάσωσιν
  choice: ont faim
  rationale: 'L’aoriste subjonctif avec ἐὰν exprime une condition éventuelle : « s’ils ont faim ». Cette formulation française est naturelle et n’exagère pas l’intensité.'
- source_word: ἀροῦσιν
  choice: lèveront
  rationale: Le futur de αἴρω signifie littéralement « lever » ou « élever ». « Lèveront » conserve l’image concrète de l’appel adressé à Dieu.
- source_word: πρόσωπον αὐτῶν
  choice: le visage
  rationale: Le grec emploie le singulier πρόσωπον avec un possesseur pluriel. Le singulier distributif « le visage » est idiomatique en français et reste proche de la forme grecque.
- source_word: πρὸς σέ
  choice: vers toi
  rationale: « Vers toi » rend clairement la direction exprimée par πρὸς et s’accorde naturellement avec l’image de lever le visage.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La traduction conserve l’image corporelle du grec plutôt que de la remplacer dans le texte par une interprétation telle que « ils feront appel à toi ».
