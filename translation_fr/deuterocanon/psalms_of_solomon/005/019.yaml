  text: If a man has an abundance[a], he sins.
translation:
  language: fr
  text: Si quelqu’un a trop[a], il pèche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si quelqu’un a plus qu’il ne faut, il pèche. »'
    reason: Variante idiomatique qui explicite légèrement l’idée de surplus ou de dépassement de la mesure exprimée par ὑπερπλεονάσῃ, sans ajouter de motif moral particulier.
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit simplement la condition exprimée par la maxime, sans lui imposer une valeur répétitive.
- source_word: ὑπερπλεονάσῃ
  choice: est dans la surabondance
  rationale: Rend l’idée de dépasser l’abondance ordinaire ou la juste mesure, tout en évitant d’ajouter explicitement la notion de cupidité.
- source_word: ὁ ἄνθρωπος
  choice: quelqu’un
  rationale: Dans cette maxime générale, « quelqu’un » exprime naturellement en français la portée générique de ἄνθρωπος sans restreindre le propos aux hommes de sexe masculin.
- source_word: ἐξαμαρτάνει
  choice: il pèche
  rationale: Conserve le sens moral direct du verbe et la formulation concise de l’original.
theological_decisions:
- issue: Faut-il interpréter la surabondance comme de la cupidité ou comme un autre vice intérieur précis ?
  choice: Maintenir l’affirmation générale selon laquelle celui qui est dans la surabondance pèche.
  alternative: Traduire en nommant la cupidité ou l’avidité.
  rationale: Le grec relie directement la surabondance au péché sans préciser le motif intérieur; la traduction préserve cette tension plutôt que de la résoudre.
translation_notes:
  register: Maxime brève, solennelle et intelligible en français moderne international. « Surabondance » conserve la force du préfixe grec, tandis que la note donne une formulation plus courante.
