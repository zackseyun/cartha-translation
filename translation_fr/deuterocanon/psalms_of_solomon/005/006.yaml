  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: fr
  text: Car l’être humain et la part qui lui vient de toi sont pesés à la balance[a] ; il n’ajoutera rien au point de dépasser ton jugement, ô Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Car l’être humain et sa part venant de toi sont dans une balance. »'
    reason: La construction grecque est compacte. La traduction principale exprime naturellement en français l’image de la pesée; la note conserve la formulation plus proche de la structure grecque.
  - marker: b
    text: 'Autre traduction possible : « il n’ajoutera pas de manière à aller au-delà de ta décision, ô Dieu ».'
    reason: κρίμα peut désigner le jugement, la décision ou le verdict de Dieu, et la construction infinitive admet plusieurs formulations françaises proches.
lexical_decisions:
- source_word: ἄνθρωπος
  choice: l’être humain
  rationale: Le singulier générique grec désigne ici une personne humaine sous l’évaluation divine. « L’être humain » conserve le singulier sans imposer en français moderne un masculin biologique absent du sens contextuel.
- source_word: ἡ μερὶς αὐτοῦ
  choice: la part qui lui vient
  rationale: « La part » rend l’idée d’une portion attribuée. La relative permet de rattacher naturellement παρὰ σοῦ à cette part en français.
- source_word: παρὰ σοῦ
  choice: qui lui vient de toi
  rationale: 'παρά avec le génitif exprime la provenance : la part vient de Dieu. Cette traduction respecte la grammaire grecque plutôt que le sens locatif « devant toi », qui appellerait le datif.'
- source_word: ἐν σταθμῷ
  choice: dans la balance
  rationale: Le syntagme garde l’image concrète d’une quantité pesée ou mesurée. « Dans la balance » est naturel et digne en français.
- source_word: οὐ προσθήσει
  choice: il n’ajoutera rien
  rationale: Le verbe signifie littéralement « ajouter ». « Rien » fournit en français l’objet implicite de la négation sans préciser ce qui serait ajouté.
- source_word: τοῦ πλεονάσαι
  choice: au point de dépasser
  rationale: 'L’infinitif génitif exprime ici la portée ou le résultat de l’ajout : aller au-delà de la mesure fixée.'
- source_word: τὸ κρίμα σου
  choice: ton jugement
  rationale: « Jugement » préserve la portée judiciaire ou évaluative de κρίμα sans choisir plus étroitement entre verdict, décision et norme fixée.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif avec article fonctionne comme une interpellation. « Ô Dieu » restitue le vocatif solennel de la prière.
theological_decisions:
- issue: Portée générique du singulier ἄνθρωπος
  choice: Traduire par « l’être humain » au singulier
  alternative: « l’homme » ou « un être humain »
  rationale: Le singulier représentatif est conservé, mais le français « l’être humain » communique plus clairement la portée générique et n’ajoute pas une restriction au sexe masculin.
- issue: Rapport entre la part humaine et le jugement divin
  choice: Maintenir l’image d’une part venant de Dieu, pesée, que l’être humain ne peut augmenter au-delà du jugement divin
  alternative: Comprendre παρὰ σοῦ comme « devant toi » et faire de la scène principalement une comparution
  rationale: Le génitif σοῦ indique normalement la provenance. La traduction ne transforme donc pas cette expression en indication de présence, tout en laissant subsister la tension entre attribution, mesure et jugement.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme poétique est maintenu par deux propositions équilibrées et l’interpellation finale. Les images de la part, de la balance et du jugement sont conservées sans explicitation doctrinale.
