  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
translation:
  language: fr
  text: Quand nous sommes dans la détresse[a], nous t’appellerons au secours, et tu ne repousseras pas notre supplication[b], car tu es notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand nous sommes accablés » ou « dans notre détresse ».'
