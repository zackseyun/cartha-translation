  - marker: b
    text: 'Ou : « notre requête » ou « notre prière instante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: Quand nous sommes dans la détresse
  rationale: La construction ἐν + infinitif articulé a ici une valeur temporelle. « Dans la détresse » rend naturellement θλίβεσθαι sans préciser à tort qu’il s’agit nécessairement de persécution.
- source_word: ἐπικαλεσόμεθα εἰς βοήθειαν
  choice: nous t’appellerons au secours
  rationale: Le futur moyen exprime un appel direct à Dieu, implicite dans le grec et explicité naturellement en français par « t’ ». « Appeler au secours » restitue de façon idiomatique εἰς βοήθειαν.
- source_word: οὐκ ἀποστρέψῃ
  choice: tu ne repousseras pas
  rationale: Dans ce contexte, le verbe désigne le fait de détourner ou d’écarter la demande. « Repousser » conserve l’idée de refus tout en donnant une formulation française naturelle.
- source_word: τὴν δέησιν ἡμῶν
  choice: notre supplication
  rationale: δέησις désigne une demande pressante adressée à Dieu. « Supplication » en préserve la force et le registre de prière.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: car tu es notre Dieu
  rationale: ὅτι introduit le fondement de la confiance exprimée. « Car » maintient clairement ce lien causal dans un registre digne.
