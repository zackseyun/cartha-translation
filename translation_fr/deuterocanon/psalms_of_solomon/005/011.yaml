  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: fr
  text: Tu nourris les oiseaux et les poissons, en donnant de la pluie aux lieux arides pour faire pousser l’herbe, afin de préparer du fourrage dans le désert pour tout être vivant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πετεινὰ
  choice: les oiseaux
  rationale: Le terme désigne ici naturellement les oiseaux; cette formulation est claire et n’ajoute aucune précision absente du grec.
- source_word: τοὺς ἰχθύας
  choice: les poissons
  rationale: Équivalent français direct et courant du nom grec.
- source_word: τρέφεις
  choice: tu nourris
  rationale: Le verbe exprime l’action de procurer la nourriture et de soutenir la vie; «nourrir» convient aux oiseaux comme aux poissons.
- source_word: ἐν τῷ διδόναι σὲ
  choice: en donnant
  rationale: L’infinitif articulé peut indiquer le moyen ou le temps. «En donnant» conserve une certaine souplesse tout en reliant la pluie à l’action de nourrir.
- source_word: ἐρήμοις
  choice: aux lieux arides
  rationale: Le pluriel substantivé évoque des régions désertes ou désolées; «lieux arides» restitue clairement leur caractère stérile.
- source_word: εἰς ἀνατολὴν χλόης
  choice: pour que l’herbe pousse
  rationale: Littéralement, l’expression évoque la levée ou la poussée de la jeune verdure. Cette tournure française en communique naturellement le sens.
- source_word: ἑτοιμάσαι χορτάσματα
  choice: afin de préparer […] de quoi nourrir
  rationale: L’infinitif aoriste porte une valeur de but ou de résultat visé. χορτάσματα désigne ce qui sert de nourriture, notamment du fourrage; la périphrase française reste adaptée à «tout être vivant».
- source_word: ἐν ἐρήμῳ
  choice: dans le désert
  rationale: Rend directement le singulier grec et maintient l’image d’un espace désertique.
- source_word: παντὶ ζῶντι
  choice: tout être vivant
  rationale: Cette expression inclusive rend la portée générale du grec sans limiter le référent à une catégorie précise de créatures.
theological_decisions:
- issue: Rapport exprimé par ἐν τῷ διδόναι σὲ
  choice: en donnant
  alternative: quand tu donnes / tandis que tu donnes
  rationale: La construction grecque admet une nuance instrumentale ou temporelle. «En donnant» privilégie légèrement le moyen, cohérent avec la providence décrite, sans imposer une explication théologique supplémentaire.
- issue: Valeur de ἑτοιμάσαι
  choice: afin de préparer
  alternative: pour préparer / de sorte à préparer
  rationale: La traduction garde la force finale probable de l’infinitif tout en laissant ouverte la proximité entre but et résultat dans l’enchaînement poétique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’adresse directe à Dieu et l’enchaînement poétique des actes de provision. Aucun marqueur de note n’est nécessaire.
