  text: For you are kind and merciful[a], the refuge of the poor.
translation:
  language: fr
  text: Car tu es bon et miséricordieux, toi qui es le refuge du pauvre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστός
  choice: bon
  rationale: Dans ce contexte, l’adjectif décrit la bonté bienveillante de Dieu. « Bon » reste naturel, digne et suffisamment large pour rendre la nuance de χρηστός.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: « Miséricordieux » rend directement l’idée d’accorder sa miséricorde aux personnes dans le besoin et convient au registre des psaumes.
- source_word: καταφυγή
  choice: refuge
  rationale: Le mot désigne un lieu ou un moyen de protection. « Refuge » conserve l’image du grec sans la remplacer par l’interprétation plus personnelle de « protecteur ».
- source_word: τοῦ πτωχοῦ
  choice: du pauvre
  rationale: Le singulier grec désigne ici la personne pauvre ou démunie de manière représentative. « Du pauvre » respecte le nombre et le registre psalmique.
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit la raison de l’affirmation précédente. « Car » exprime clairement cette valeur explicative dans un style littéraire courant.
theological_decisions:
- issue: Rapport entre les adjectifs et « refuge »
  choice: Les adjectifs « bon » et « miséricordieux » qualifient Dieu; « refuge du pauvre » lui est ensuite appliqué en apposition, explicitée par « toi qui es ».
  alternative: « Car le refuge du pauvre est bon et miséricordieux. »
  rationale: Les adjectifs grecs sont masculins, tandis que καταφυγή est féminin; ils ne peuvent donc pas qualifier grammaticalement « refuge ». La mise en apposition préserve l’identification de Dieu comme refuge sans créer de contresens.
translation_notes:
  register: Français international moderne, clair et digne. L’explicitation « toi qui es » rend naturelle l’apposition en français et évite que « refuge » soit pris à tort comme sujet des adjectifs.
