  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: fr
  text: Car si j’ai faim, je crierai vers toi, ô Dieu, et tu me donneras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet du verbe « donner » n’est pas exprimé en grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσω
  choice: j’ai faim
  rationale: Avec ἐὰν et le subjonctif aoriste, l’expression présente une éventualité future. En français moderne, « si j’ai faim » rend naturellement cette valeur sans exagérer une nuance inchoative.
- source_word: κεκράξομαι
  choice: je crierai vers toi
  rationale: « Crier vers » conserve l’intensité de κράζω ainsi que l’orientation exprimée par πρὸς σέ, tout en restant idiomatique dans le registre de la prière biblique.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif grec avec article remplit ici une fonction vocative. « Ô Dieu » marque clairement l’adresse directe dans un registre digne.
- source_word: δώσεις μοι
  choice: tu me donneras
  rationale: Cette traduction conserve le verbe simple « donner » et respecte l’absence de complément d’objet dans le grec, sans préciser de manière interprétative ce que Dieu donnera.
theological_decisions:
- issue: Objet non exprimé de δώσεις
  choice: 'Maintenir l’ellipse : « tu me donneras »'
  alternative: « tu me donneras de quoi manger » ou « tu pourvoiras à mes besoins »
  rationale: Le contexte de la faim suggère une nourriture ou une réponse au besoin, mais le texte grec ne nomme pas l’objet. La traduction préserve donc cette ouverture au lieu de la résoudre.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « crier vers toi » garde la couleur de la prière biblique; l’ellipse finale, inhabituelle mais intelligible, reproduit volontairement celle du grec.
