  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: fr
  text: Une part modérée suffit dans la justice, et c’est en cela que se trouve la bénédiction du Seigneur, pour une pleine satisfaction dans la justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: suffit
  rationale: Rend naturellement l’idée de suffisance exprimée par l’adjectif grec employé de façon prédicative.
- source_word: τὸ μέτριον
  choice: une part modeste
  rationale: Le neutre substantivé désigne ce qui est mesuré ou modéré ; dans le contexte de πλησμονή, « part » explicite sobrement la dimension matérielle sans la surdéterminer.
- source_word: ἐν δικαιοσύνῃ
  choice: accompagnée de justice / dans la justice
  rationale: La première occurrence indique naturellement la circonstance ou la qualité morale associée à la part ; la dernière est conservée plus littéralement afin de respecter la répétition et sa portée théologique ouverte.
- source_word: ἐν τούτῳ
  choice: c’est en cela que
  rationale: Reproduit le renvoi démonstratif au contentement juste décrit dans la première proposition.
- source_word: εἰς πλησμονὴν
  choice: être rassasié
  rationale: Exprime l’aboutissement vers la satiété ou la pleine satisfaction, sens contextuel de πλησμονή, plutôt qu’une abondance illimitée qui contredirait τὸ μέτριον.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Traduction conventionnelle et digne du titre grec, sans introduire un nom divin absent du texte transmis.
theological_decisions:
- issue: Rapport entre modération, justice et bénédiction divine
  choice: Conserver l’affirmation selon laquelle la bénédiction réside dans une suffisance vécue dans la justice
  alternative: Comprendre la bénédiction comme une promesse d’abondance matérielle accordée en récompense de la justice
  rationale: Le contraste apparent entre τὸ μέτριον et πλησμονή invite à comprendre cette dernière comme satiété ou contentement, sans transformer le verset en promesse de prospérité.
- issue: Valeur de la répétition de ἐν δικαιοσύνῃ
  choice: Maintenir les deux occurrences en variant seulement la formulation française exigée par la syntaxe
  alternative: Supprimer la seconde comme redondante ou lui attribuer une doctrine distincte
  rationale: La répétition appartient au texte grec et encadre à la fois la part modeste et le rassasiement ; elle doit rester perceptible sans résolution doctrinale ajoutée.
translation_notes:
  register: Français international moderne, sobre et proverbial. La ponctuation met en évidence l’explication finale sans reproduire les répétitions manifestement corrompues de la couche anglaise consultative.
