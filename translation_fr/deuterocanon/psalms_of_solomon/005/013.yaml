base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: fr
  text: Tu nourris les rois, les dirigeants et les peuples, ô Dieu. Et qui donc est l’espérance du pauvre et de l’indigent, sinon toi, Seigneur ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: tu nourris
  rationale: Le verbe grec signifie directement « nourrir, alimenter, entretenir ». Une seule occurrence figure dans la source; la répétition et l’ajout « sustain » de la couche anglaise ne sont donc pas reproduits.
- source_word: ἄρχοντας
  choice: les dirigeants
  rationale: Terme général désignant ceux qui gouvernent ou exercent l’autorité; « dirigeants » convient au français international sans préciser indûment leur statut.
- source_word: λαοὺς
  choice: les peuples
  rationale: Le pluriel grec est conservé naturellement.
- source_word: πτωχοῦ καὶ πένητος
  choice: du pauvre et de l’indigent
  rationale: 'Les deux substantifs proches sont distingués: πτωχός évoque le pauvre, et πένης celui qui manque de ressources et vit dans le besoin.'
- source_word: ἡ ἐλπὶς
  choice: l’espérance
  rationale: Dans ce contexte adressé à Dieu, « espérance » exprime l’attente confiante tout en restant lexicalement fidèle.
- source_word: εἰ μὴ σύ
  choice: sinon toi
  rationale: Rendu idiomatique de l’exception grecque dans une interrogation rhétorique.
theological_decisions:
- issue: Dieu comme unique espérance des personnes démunies
  choice: « qui donc est l’espérance du pauvre et de l’indigent, sinon toi »
  alternative: « en qui le pauvre et l’indigent peuvent-ils espérer, si ce n’est en toi »
  rationale: La formulation retenue préserve le tour nominal grec, qui identifie directement le Seigneur comme leur espérance, sans développer l’énoncé en paraphrase.
- issue: Ajout présent dans la couche anglaise
  choice: Ne pas répéter la première proposition et ne pas ajouter « tu soutiens »
  alternative: « Tu nourris… et tu soutiens… »
  rationale: Le grec validé ne contient qu’une proposition avec τρέφεις. La traduction suit en priorité la source originale et n’importe pas la duplication absente du texte grec.
translation_notes:
  register: Français moderne, international et digne. L’invocation « ô Dieu » conserve la solennité de ὁ θεός sans archaïsme excessif; « Seigneur » rend Κύριε. La ponctuation sépare clairement l’affirmation initiale de la question rhétorique.
