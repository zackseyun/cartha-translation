  source_fidelity: 'Le grec demande littéralement : « Et qui prendra de toutes les choses que tu as faites, à moins que toi, tu donnes ? » Le pronom objet de « donner » est implicite et peut reprendre ce qui est pris ; « le donnes » est donc défendable. En revanche, « quoi que ce soit parmi tout » amplifie et reformule inutilement ἀπὸ πάντων (« de tout / de toutes [les choses] »).'
  naturalness: La phrase est globalement naturelle, mais « parmi tout » est peu idiomatique ici. « De tout ce que tu as fait » est plus fluide, précis et conforme au grec. La tournure exceptive au subjonctif est naturelle.
  terminology: « Tu as fait » rend exactement ἐποίησας et conserve la portée générale du verbe. Aucun terme théologique spécialisé ni nom propre n'appelle de modification. L'insistance de σύ est suffisamment portée par le sujet explicite « tu » dans la subordonnée.
