  text: And who will take from all that you have made, unless you give it?
translation:
  language: fr
  text: Et qui prendra de tout ce que tu as fait, à moins que tu ne le donnes ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λήψεται ἀπὸ πάντων
  choice: prendra quoi que ce soit parmi tout
  rationale: Le grec dit littéralement « prendra de tout ». L’ajout idiomatique de « quoi que ce soit » rend explicite en français l’objet indéfini impliqué, tandis que « parmi tout » conserve l’idée d’un prélèvement sur l’ensemble de la création.
- source_word: ἐποίησας
  choice: tu as fait
  rationale: Rend directement l’aoriste de ποιέω et conserve la formulation large du grec sans la restreindre à un acte particulier de création.
- source_word: ἐὰν μὴ σὺ δῷς
  choice: à moins que tu ne le donnes
  rationale: « À moins que » exprime naturellement la condition exceptive. Le pronom sujet « tu » garde l’insistance portée par le grec σύ, et « le » reprend ce qui est pris, objet laissé implicite dans le grec.
theological_decisions:
- issue: La dépendance de toute acquisition envers le don divin
  choice: à moins que tu ne le donnes
  alternative: si tu ne donnes pas
  rationale: 'La formulation retenue conserve la force exceptive de ἐὰν μή : nul ne peut prendre parmi les œuvres de Dieu sans que Dieu donne ce qui est reçu. Elle n’ajoute aucune précision doctrinale sur la manière de ce don.'
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse directe au Dieu du psaume. La phrase conserve la forme interrogative et l’accent grec sur « tu » sans lourdeur littérale.
