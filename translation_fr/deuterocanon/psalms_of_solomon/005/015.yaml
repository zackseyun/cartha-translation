revisions:
- from: La bonté d’un homme est parcimonieuse et remise au lendemain ; et s’il la renouvelle sans murmurer, même cela t’émerveillera.[a]
  to: La bonté d’un homme est limitée et remise au lendemain[a] ; et s’il la renouvelle sans murmurer, tu t’en étonneras même.
  rationale: La révision rend θαυμάσεις par un futur actif à la deuxième personne, améliore l’idiomaticité de la première proposition et déplace l’appel de note auprès de l’ellipse qu’il explique. Elle conserve l’interprétation prudente de l’idée de report tout en la présentant explicitement comme une compréhension possible du grec elliptique.
