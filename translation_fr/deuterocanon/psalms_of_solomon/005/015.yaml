    issue: Voix et sujet de θαυμάσεις
    rationale: Le grec a « tu t’étonneras / tu t’émerveilleras ». Le texte français fait de « cela » le sujet de « t’émerveillera », ce qui modifie légèrement la construction et l’agentivité du verbe.
  - severity: low
    issue: Ancrage de la note
    rationale: La note explique l’ellipse autour de αὔριον (« demain ») ; son marqueur doit être placé immédiatement après « demain », non après la conclusion du verset.
  - severity: low
    issue: Formulation de la note comme littérale
    rationale: « Est dans la parcimonie, et le lendemain » n’est pas une restitution française utilement littérale et risque de laisser entendre que la syntaxe grecque est plus définie qu’elle ne l’est. Il vaut mieux indiquer les mots grecs pertinents et distinguer clairement l’interprétation.
