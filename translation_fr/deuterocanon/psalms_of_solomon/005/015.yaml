  text: A man's kindness is sparing and for tomorrow; and if he repeats it without grumbling[a], even at this you will marvel.
translation:
  language: fr
  text: La bonté d’un homme est limitée et remise au lendemain[a] ; et s’il la renouvelle sans murmurer, tu t’en étonneras même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très elliptique : il associe littéralement la bonté d’un homme à « avec mesure » et à « demain ». On peut comprendre que cette bonté est donnée avec parcimonie et reportée au lendemain ; le sens précis du lien avec « demain » reste implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηστότης
  choice: bonté
  rationale: Le terme désigne ici une disposition bonne ou bienveillante manifestée envers autrui. « Bonté » conserve sa portée morale sans réduire le sens à la seule générosité matérielle.
- source_word: ἀνθρώπου
  choice: d’un homme
  rationale: Le génitif singulier est rendu directement, tout en gardant la forme proverbiale et générique du grec.
- source_word: ἐν φειδῷ
  choice: est parcimonieuse
  rationale: L’expression évoque la retenue, la mesure chiche ou l’économie. « Parcimonieuse » conserve cette nuance critique sans aller jusqu’à « avare ».
- source_word: ἡ αὔριον
  choice: remise au lendemain
  rationale: Le grec est elliptique et associe de façon abrupte la bonté humaine à « demain ». Cette formulation française explicite légèrement l’idée probable de report, signalée en note comme interprétation d’une syntaxe incertaine.
- source_word: δευτερώσῃ
  choice: la renouvelle
  rationale: Le verbe signifie accomplir une seconde fois. Le pronom reprend naturellement la bonté ou l’acte bienveillant implicite.
- source_word: γογγυσμοῦ
  choice: murmurer
  rationale: « Sans murmurer » est naturel dans un registre biblique digne et exprime une plainte réticente.
- source_word: θαυμάσεις
  choice: t’émerveillera
  rationale: Le futur à la deuxième personne du singulier est conservé. Cette tournure exprime l’étonnement admiratif ou surpris du verbe grec.
