lexical_decisions:
- source_word: λήψεται
  choice: on ne prendra pas
  rationale: Le futur moyen de λαμβάνω a ici le sens direct de « prendre ». En l’absence de sujet exprimé, le pronom indéfini français « on » rend naturellement la portée générale de la formulation grecque.
- source_word: σκῦλα
  choice: butin
  rationale: Le terme désigne ce qui est pris à un adversaire. « Butin » est courant et précis en français moderne ; « dépouilles » demeure une possibilité plus littérale.
- source_word: παρὰ
  choice: à
  rationale: Avec le génitif, παρά indique ici la provenance. Dans l’expression française « prendre quelque chose à quelqu’un », « à » rend cette relation plus naturellement que « de ».
- source_word: ἀνδρὸς δυνατοῦ
  choice: un homme fort
  rationale: ἀνήρ désigne un homme, tandis que δυνατός exprime ici la force ou la puissance. « Un homme fort » conserve le masculin singulier et la simplicité proverbiale de la phrase.
theological_decisions:
- issue: Sujet non exprimé de λήψεται
  choice: 'Sujet indéfini : « on »'
  alternative: 'Sujet personnel : « il »'
  rationale: Le grec ne donne aucun sujet explicite. Dans ce contexte proverbial, « on » évite d’introduire un référent masculin non identifié, tout en conservant en note la lecture grammaticalement possible « il ».
translation_notes:
  register: Français moderne, sobre et proverbial. La tournure « prendre du butin à quelqu’un » est naturelle et conserve l’idée de provenance exprimée par παρά avec le génitif.
