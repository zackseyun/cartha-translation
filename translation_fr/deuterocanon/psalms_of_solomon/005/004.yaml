  verdict: revise
  source_fidelity: 'Le grec οὐ γὰρ λήψεται σκῦλα παρὰ ἀνδρὸς δυνατοῦ signifie littéralement : « Car [on] ne prendra pas de butin d’auprès/d’un homme puissant. » Le sujet indéfini « on » est une bonne résolution de l’absence de sujet exprimé. « Prendre ... à quelqu’un » est possible en français, mais « enlever du butin à un homme puissant » rend plus clairement le sens de prélèvement/provenance de παρά avec le génitif et évite une légère ambiguïté de « prendre du butin à » (prendre du butin appartenant à quelqu’un ou lui ravir du butin).'
  naturalness: La phrase est naturelle dans l’ensemble, mais « enlever du butin à un homme puissant » est plus idiomatique et plus explicite dans ce proverbe. « Homme puissant » rend δυνατός avec davantage de justesse contextuelle que « homme fort », qui peut évoquer principalement la force physique.
  terminology: '« Butin » est un équivalent moderne et exact de σκῦλα. « Dépouilles » est une alternative recevable. La note b ne correspond pas à une alternative textuelle ou lexicale nécessaire : elle introduit « il », alors que le grec ne fournit aucun antécédent et que l’indéfini français est préférable. Elle devrait être supprimée.'
