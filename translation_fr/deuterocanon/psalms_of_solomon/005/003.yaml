  text: But if I cry out to you[a], do not be silent to me.
translation:
  language: fr
  text: Mais si j’ai crié vers toi[a], ne reste pas silencieux loin de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Mais si j’ai crié vers toi, ne garde pas le silence loin de moi. » Le verbe grec peut aussi évoquer l’idée de passer quelqu’un ou quelque chose sous silence.'
    reason: Conserve l’aspect parfait de κεκραγέναι et signale la nuance possible de παρασιωπάω, tout en respectant ἀπʼ ἐμοῦ (« loin de moi »).
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mais si
  rationale: Conserve la valeur conditionnelle de ἐάν et la légère inflexion adversative de δέ, dans une formulation française naturelle.
- source_word: κεκραγέναι με
  choice: je crie
  rationale: Le parfait infinitif avec με pour sujet est rendu par une forme personnelle naturelle en français. Le présent évite de suraccentuer l'aspect accompli dans cet appel condensé, tandis que la note signale la forme plus littérale.
- source_word: πρὸς σέ
  choice: vers toi
  rationale: Dans le contexte de la prière, « vers toi » exprime naturellement l'orientation du cri tout en restant proche de la préposition grecque.
- source_word: μὴ παρασιωπήσῃς
  choice: ne garde pas le silence
  rationale: Cette formulation conserve l'image explicite du silence portée par le verbe, sans la remplacer par l'interprétation plus générale « ne m'ignore pas ».
- source_word: ἀπʼ ἐμοῦ
  choice: à mon égard
  rationale: Le grec dit littéralement « loin de moi » ou « de moi » avec le verbe du silence. « À mon égard » rend en français idiomatique la relation visée sans effacer la difficulté de l'expression.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement convient à l'adresse directe à Dieu dans la poésie biblique. La tournure « à mon égard » maintient une légère solennité tout en restant compréhensible.
