review_pass:
  verdict: revise
  source_fidelity: 'La condition introduite par ἐὰν porte un infinitif parfait (κεκραγέναι) avec με comme sujet : « si j’ai crié » rend plus directement cet aspect que le présent « si je crie ». Surtout, ἀπʼ ἐμοῦ signifie littéralement « loin de moi / de moi » et ne vise pas principalement le sujet sur lequel porterait un silence (« à mon égard »).'
  naturalness: « Ne reste pas silencieux loin de moi » est naturel dans un registre poétique et priant moderne, tout en évitant de transformer le silence divin en silence “à propos” du suppliant. Le tutoiement et « vers toi » conviennent.
  terminology: Aucun terme théologique spécialisé n’est en jeu. « Rester silencieux » transmet sobrement παρασιωπάω; la note conserve la possibilité lexicale de « passer sous silence » sans imposer une interprétation.
  issues:
