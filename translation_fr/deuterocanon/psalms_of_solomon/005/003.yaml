    issue: Rendu de κεκραγέναι par « je crie »
    rationale: Le présent français est possible comme lissage idiomatique, mais le parfait infinitif grec est suffisamment net pour être rendu ici par « j’ai crié », sans alourdir la phrase.
  - severity: medium
    issue: Rendu de ἀπʼ ἐμοῦ par « à mon égard »
    rationale: Cette expression suggère que Dieu garderait le silence au sujet du priant, alors que l’expression grecque conserve l’image spatiale/relationnelle d’un silence tenu loin de lui. « Loin de moi » préserve cette formulation difficile.
  - severity: low
    issue: Note explicative trop interprétative
    rationale: « Ne passe pas sur moi en silence » déplace également ἀπʼ ἐμοῦ vers un objet direct. Une note littérale est préférable pour signaler la construction sans la résoudre de manière trop étroite.
