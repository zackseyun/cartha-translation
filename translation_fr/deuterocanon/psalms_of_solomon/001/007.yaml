  text: Their sins were in secret[b][a], and I did not know.
translation:
  language: fr
  text: Leurs péchés étaient commis en secret[a], et moi, je ne le savais pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la tournure grecque peut aussi se comprendre : « Leurs péchés étaient dans des lieux cachés » ou « relevaient de choses cachées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἁμαρτίαι αὐτῶν
  choice: Leurs péchés
  rationale: Le pluriel désigne directement leurs actes fautifs; « péchés » est l’équivalent français le plus naturel et conserve le possessif.
- source_word: ἐν ἀποκρύφοις
  choice: se commettaient en secret
  rationale: Le pluriel substantivé s’emploie ici de manière elliptique et peut exprimer ce qui se fait secrètement. Cette formulation naturelle évite de réduire le sens à des lieux physiques cachés; une note conserve l’ambiguïté formelle.
- source_word: καὶ ἐγώ
  choice: et moi
  rationale: « Et » rend καί sans lui imposer une valeur adversative; le pronom renforcé « moi » restitue l’explicitation emphatique de ἐγώ.
- source_word: οὐκ ᾔδειν
  choice: je ne le savais pas
  rationale: L’imparfait de οἶδα exprime ici l’absence de connaissance ou de conscience. Le pronom « le » renvoie naturellement au fait évoqué dans la proposition précédente.
theological_decisions:
- issue: Nature de ce qui est caché dans ἐν ἀποκρύφοις
  choice: Les péchés se commettaient en secret, sans préciser à qui ils étaient cachés.
  alternative: Leurs péchés étaient dans des lieux cachés / relevaient de choses cachées.
  rationale: La tournure grecque est concise et elliptique. La traduction principale exprime le caractère secret sans préciser que les actes étaient cachés à Dieu, au locuteur ou à tous; la note signale les autres analyses possibles.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait « se commettaient » s’accorde avec l’état passé exprimé par ᾔδειν et rend explicitement, mais sans surinterprétation, le lien elliptique entre les péchés et le secret.
