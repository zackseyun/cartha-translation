  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: fr
  text: Soudain, un cri de guerre fut étouffé devant moi[a] ; il m’entendra[b], car je suis rempli de justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis est difficile : littéralement, le cri est « rendu sourd » ou réduit au silence. Une autre leçon, signalée dans l’historique éditorial, donne : « un cri de guerre se fit entendre devant moi ».'
    reason: textual_and_lexical_alternative
  - marker: b
    text: Ou « il m’écoutera » ; le verbe peut aussi suggérer « il m’exaucera ». Le sujet n’est pas exprimé en grec et est compris comme étant Dieu d’après le contexte.
    reason: lexical_and_implicit_subject
  - marker: c
    text: Ou « de droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξάπινα
  choice: Soudain
  rationale: L’adverbe exprime la brusquerie de l’événement ; « Soudain » est naturel et précis en français moderne.
- source_word: κωφωθὴ
  choice: fut étouffé
  rationale: D’après le texte grec fourni et validé, cette forme passive de κωφόω évoque le fait de rendre sourd, muet ou assourdi. Appliqué à un cri, « fut étouffé » offre un sens intelligible sans corriger silencieusement la source en ἠκούσθη.
- source_word: κραυγὴ πολέμου
  choice: un cri de guerre
  rationale: Cette traduction conserve le rapport génitif du grec et reste idiomatique ; « cri de bataille » demeure possible.
- source_word: ἐνώπιόν μου
  choice: devant moi
  rationale: Expression française concise qui correspond au sens spatial ou personnel de l’expression grecque.
- source_word: ἐπακούσεταί μου
  choice: il m’écoutera
  rationale: Le verbe peut désigner une écoute favorable. « Il m’écoutera » conserve cette nuance sans aller jusqu’à expliciter « il m’exaucera ».
- source_word: ἐπλήσθην
  choice: je suis rempli
  rationale: Le passif aoriste peut ici être rendu par l’état résultant en français, en accord avec la proposition causale.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » couvre naturellement en français la rectitude morale et la justice ; « droiture » est également possible dans ce contexte religieux.
theological_decisions:
- issue: Sujet implicite de ἐπακούσεταί μου
  choice: Le texte conserve le pronom « il », Dieu étant compris d’après le contexte de prière.
  alternative: « Dieu m’écoutera » ou « je serai entendu ».
  rationale: Le grec n’exprime pas le sujet. Ne pas ajouter explicitement « Dieu » préserve la formulation et l’implicite du texte source.
- issue: Portée de δικαιοσύνης
  choice: « justice »
  alternative: « droiture »
  rationale: Le terme grec peut viser la justice, la rectitude ou la conduite juste. Le choix principal garde l’étendue sémantique sans imposer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation suit le grec transmis dans la demande, notamment κωφωθὴ, tout en signalant en note la difficulté textuelle et l’autre lecture attestée dans l’historique éditorial.
