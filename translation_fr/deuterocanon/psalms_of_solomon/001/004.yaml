base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/004.yaml
  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
translation:
  language: fr
  text: Leur richesse s’est répandue dans tout le pays[a], et leur gloire[b] a atteint les extrémités de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toute la terre ». Le grec γῆ peut désigner aussi bien un pays que la terre.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur renommée ». Le grec δόξα peut désigner l’honneur ou la réputation aussi bien que la gloire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πλοῦτος αὐτῶν
  choice: leur richesse
  rationale: πλοῦτος désigne la richesse ou les biens. Le singulier collectif « richesse » suit le grec et convient au registre poétique.
- source_word: διεδόθη
  choice: s’est répandue
  rationale: Le passif de διαδίδωμι exprime ici une diffusion étendue. La tournure pronominale française est naturelle et évite de suggérer sans nécessité un agent précis.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: dans tout le pays
  rationale: γῆ peut désigner un pays, une terre ou la terre entière. « Dans tout le pays » permet de conserver la progression poétique vers « les extrémités de la terre » dans le second membre.
- source_word: ἡ δόξα αὐτῶν
  choice: leur gloire
  rationale: δόξα peut évoquer la gloire, l’honneur ou la renommée. « Gloire » garde l’élévation et l’ambiguïté du terme grec.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: jusqu’aux extrémités de la terre
  rationale: Cette formulation idiomatique exprime les confins les plus lointains du monde. Le pluriel est naturel en français sans modifier la portée de l’expression grecque au singulier.
theological_decisions:
- issue: Portée de γῆ dans les deux membres du vers
  choice: Traduire le premier emploi par « pays » et le second par « terre »
  alternative: Traduire les deux emplois par « terre »
  rationale: Le nom grec est le même dans les deux membres, mais son champ sémantique permet les deux sens. La distinction française conserve une possible progression du territoire entier jusqu’aux confins du monde, tout en signalant l’autre lecture en note.
- issue: Ellipse verbale dans le second membre
  choice: 'Conserver l’ellipse : « et leur gloire jusqu’aux extrémités de la terre »'
  alternative: 'Expliciter : « et leur gloire a atteint les extrémités de la terre »'
  rationale: Le grec ne répète pas le verbe après καί. L’ellipse demeure claire et digne en français poétique, tout en reproduisant le parallélisme resserré de la source.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase conserve l’ellipse verbale du second membre, qui reste intelligible en français, ainsi que l’ambiguïté de δόξα.
