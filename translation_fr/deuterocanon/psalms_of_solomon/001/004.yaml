  source_fidelity: Le premier membre rend fidèlement ὁ πλοῦτος αὐτῶν διεδόθη εἰς πᾶσαν τὴν γῆν. « Pays » pour le premier γῆ et « terre » dans l’expression finale préservent une nuance de portée possible et la progression poétique. Dans le second membre, le grec présente une ellipse verbale après καί; en français moderne, il est préférable d’expliciter sobrement le verbe impliqué plutôt que de laisser un groupe nominal isolé.
  naturalness: « Et leur gloire jusqu’aux extrémités de la terre » est intelligible comme effet poétique, mais demeure une ellipse nettement plus abrupte en français contemporain que dans le grec. « Et leur gloire a atteint les extrémités de la terre » est naturel, digne et conserve le parallélisme sans introduire de précision doctrinale.
  terminology: « Richesse » rend bien πλοῦτος, et « gloire » conserve utilement l’amplitude de δόξα (honneur, éclat, renommée). La note sur γῆ est appropriée. « Extrémités de la terre » est une expression française établie pour ἕως ἐσχάτου τῆς γῆς.
