  text: They were exalted to the stars[a]; they said[d][c][b], “We will certainly not fall.”
translation:
  language: fr
  text: 'Ils ont été exaltés jusqu’aux étoiles[a] ; ils ont dit : « Ils ne tomberont certainement pas[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils ont été élevés jusqu’aux étoiles ». Le verbe grec peut désigner une élévation ou une exaltation, et l’expression est hyperbolique.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ils ne tomberont jamais ». La négation grecque est fortement emphatique.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec porte ici la troisième personne du pluriel : littéralement, « ils ont dit : “Ils ne tomberont certainement pas.” » Certains pourraient comprendre qu’ils parlent d’eux-mêmes, mais le texte ne dit pas « nous ne tomberons pas ».'
    reason: grammar
lexical_decisions:
- source_word: ὑψώθησαν
  choice: ont été exaltés
  rationale: L’aoriste passif de ὑψόω peut évoquer aussi bien une élévation qu’une exaltation. « Ont été exaltés » conserve la forme passive et convient au contexte d’orgueil, tandis que le complément spatial maintient l’image de hauteur.
- source_word: ἕως τῶν ἄστρων
  choice: jusqu’aux étoiles
  rationale: ἕως avec le génitif marque ici l’étendue atteinte. « Jusqu’aux étoiles » rend directement l’image hyperbolique et garde une tonalité poétique naturelle en français.
- source_word: εἶπαν
  choice: ils ont dit
  rationale: Rendu simple et direct du verbe narratif à l’aoriste, sans ajouter l’idée d’une proclamation solennelle.
- source_word: Οὐ μὴ πέσωσιν
  choice: Ils ne tomberont certainement pas
  rationale: οὐ μή exprime une négation fortement appuyée. πέσωσιν est à la troisième personne du pluriel ; la traduction conserve donc « ils », même si ce choix produit un discours direct inhabituel.
theological_decisions:
- issue: La déclaration exprime-t-elle une assurance neutre ou une confiance présomptueuse ?
  choice: 'Formulation emphatique : « Ils ne tomberont certainement pas. »'
  alternative: « Ils ne tomberont pas. »
  rationale: La construction οὐ μή marque une vive assurance. Le contexte peut lui donner la tonalité d’une prétention orgueilleuse, mais la traduction n’ajoute aucun jugement explicite absent de cette proposition.
- issue: Faut-il convertir la troisième personne grecque en première personne dans le discours direct ?
  choice: 'Conserver la troisième personne : « Ils ne tomberont certainement pas. »'
  alternative: « Nous ne tomberons certainement pas. »
  rationale: Le grec attesté porte πέσωσιν, troisième personne du pluriel, et non une forme à la première personne. La formulation inhabituelle est donc préservée plutôt que normalisée silencieusement.
translation_notes:
  register: Français moderne, international et digne, avec une cadence poétique sobre. La ponctuation conserve le discours direct du grec. La troisième personne inhabituelle à l’intérieur de la citation est maintenue et explicitée en note afin de respecter la forme attestée.
