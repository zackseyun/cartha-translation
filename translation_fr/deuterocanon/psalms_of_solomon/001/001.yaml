  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
translation:
  language: fr
  text: J’ai crié au Seigneur lorsque j’étais accablé jusqu’à la fin[a], à Dieu lorsque des pécheurs m’ont assailli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque j’étais complètement accablé » ou « continuellement accablé ». L’expression grecque traduite littéralement par « jusqu’à la fin » peut renforcer l’idée d’accablement ou en indiquer la durée.
    reason: lexical_alternative
  - marker: b
    text: Le grec est difficile, et le rapport entre le verbe et « des pécheurs » est incertain. « M’ont assailli » rend le sens hostile probable dans ce contexte ; le verbe peut aussi avoir une autre nuance, par exemple « sont venus sur moi ». Selon une autre analyse, on pourrait comprendre « lorsque j’ai vu des pécheurs ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: J’ai crié
  rationale: L’aoriste de βοάω exprime ici un cri pressant adressé à Dieu. « J’ai crié » est direct et naturel en français, tout en gardant la force du verbe.
- source_word: πρὸς Κύριον
  choice: vers le Seigneur
  rationale: πρός avec l’accusatif indique la direction du cri. « Vers le Seigneur » conserve cette image et rend κύριος selon son sens habituel dans la prière.
- source_word: ἐν τῷ θλίβεσθαί με
  choice: quand j’étais accablé
  rationale: La construction ἐν + infinitif articulé a une valeur temporelle ou circonstancielle. L’imparfait français exprime naturellement l’état subi, tout en maintenant la valeur passive de θλίβεσθαι.
- source_word: εἰς τέλος
  choice: jusqu’au bout
  rationale: Cette traduction proche de la forme grecque préserve l’ambiguïté entre une limite temporelle et une intensification de l’épreuve, sans imposer « complètement » ou « continuellement » dans le texte.
- source_word: πρὸς τὸν θεὸν
  choice: vers Dieu
  rationale: La répétition de la construction parallèle est conservée, comme dans le grec.
- source_word: ἐν τῷ ἐπιδέσθαι ἁμαρτωλοὺς
  choice: quand des pécheurs m’ont assailli
  rationale: La forme verbale et la construction sont difficiles. Dans le contexte de lamentation, une action hostile de pécheurs contre le locuteur est vraisemblable; « m’ont assailli » donne ce sens de manière idiomatique, tandis qu’une note signale l’incertitude.
- source_word: ἁμαρτωλούς
  choice: des pécheurs
  rationale: « Pécheurs » rend directement ἁμαρτωλούς sans le transformer en « méchants », qui ajouterait une nuance interprétative.
theological_decisions:
- issue: Traduction de κύριος dans une prière
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » convient à l’adresse au Dieu d’Israël et n’introduit pas la nuance plus étroite de maître humain.
- issue: Double désignation divine
  choice: Conserver « vers le Seigneur… vers Dieu »
  alternative: Fusionner les deux membres en une seule adresse
  rationale: La répétition grecque forme un parallélisme poétique et intensifie la supplication; elle ne doit pas être supprimée.
- issue: Interprétation de εἰς τέλος
  choice: jusqu’au bout
  alternative: complètement / continuellement
  rationale: Le grec peut indiquer l’extrémité, l’intensité ou la durée. La traduction retenue garde cette tension plutôt que de trancher.
- issue: Sens de ἐπιδέσθαι et rôle de ἁμαρτωλούς
  choice: des pécheurs m’ont assailli
  alternative: j’ai vu des pécheurs / des pécheurs sont venus sur moi
  rationale: Le contexte favorise une lecture hostile, mais la forme grecque reste difficile et peut recevoir une autre analyse. Cette incertitude est explicitement conservée en note.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme de la prière est maintenu. « Accablé » restitue naturellement la passivité de θλίβεσθαι, tandis que les notes préservent les ambiguïtés réelles de εἰς τέλος et de ἐπιδέσθαι.
