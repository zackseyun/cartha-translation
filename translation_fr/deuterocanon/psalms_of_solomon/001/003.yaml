translation:
  language: fr
  text: Je me suis dit en mon cœur que j’étais rempli de droiture lorsque je prospérais et devenais grand par mes enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsque je prospérais et devenais grand en enfants ». La formule grecque est elliptique ; elle peut désigner le fait d’avoir beaucoup d’enfants ou de voir sa descendance s’accroître.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογισάμην
  choice: J’ai pensé
  rationale: L’aoriste de λογίζομαι exprime ici une réflexion intérieure; « j’ai pensé » est naturel et fidèle.
- source_word: ἐν καρδίᾳ μου
  choice: dans mon cœur
  rationale: Cette expression conserve l’image biblique du cœur comme siège de la réflexion intérieure.
- source_word: ἐπλήσθην δικαιοσύνης
  choice: j’étais rempli de justice
  rationale: Le passif indique l’état que le locuteur s’attribuait; « justice » rend δικαιοσύνη dans son sens de rectitude morale, sans exclure sa dimension de conduite juste.
- source_word: ἐν τῷ εὐθηνῆσαί με
  choice: lorsque je prospérais
  rationale: La construction ἐν τῷ suivie de l’infinitif a une valeur temporelle, et εὐθηνέω signifie prospérer ou être florissant.
- source_word: πολλὴν γενέσθαι ἐν τέκνοις
  choice: que mes enfants devenaient nombreux
  rationale: La formulation grecque, littéralement « devenir grand/nombreux en enfants », désigne naturellement l’accroissement du nombre des enfants.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Dans ce contexte d’autoévaluation morale, « justice » conserve le terme biblique français courant et sa tension entre état juste et conduite droite; « droiture » expliciterait davantage le sens moral.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe intérieure « dans mon cœur » est conservée, tandis que l’expression grecque comprimée sur les enfants est rendue idiomatiquement et signalée en note.
