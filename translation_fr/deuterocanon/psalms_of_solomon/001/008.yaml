  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: fr
  text: Leurs actes contraires à la loi ont dépassé ceux des nations qui les avaient précédés ; ils ont profané les choses saintes du Seigneur[a] en les traitant comme profanes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire du Seigneur » ou « les lieux saints du Seigneur ». Le grec emploie un pluriel qui peut désigner largement ce qui est sacré ou, collectivement, le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: Leurs actes contraires à la loi
  rationale: Le pluriel grec peut désigner concrètement leurs multiples violations de la loi. Cette formulation conserve cette idée dans un français courant sans employer le peu naturel « leurs illégalités ».
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: dépassaient ceux des nations qui les avaient précédés
  rationale: Avec l’accusatif, ὑπέρ marque ici une comparaison et un dépassement. Le pronom « ceux » reprend naturellement les actes, tandis que πρὸ αὐτῶν exprime l’antériorité des nations.
- source_word: ἐβεβήλωσαν
  choice: ils ont profané
  rationale: βεβηλόω signifie traiter ce qui est saint comme profane. « Profaner » rend plus précisément ce contraste cultuel que « souiller ».
- source_word: τὰ ἅγια Κυρίου
  choice: les choses saintes du Seigneur
  rationale: Le neutre pluriel peut désigner les réalités sacrées, les lieux saints ou, collectivement, le sanctuaire. La traduction principale préserve sa forme plurielle et son amplitude sémantique.
- source_word: ἐν βεβηλώσει
  choice: en les traitant comme profanes
  rationale: La formule explicite en français le nom apparenté au verbe et conserve l’insistance de la tournure grecque sans produire le calque peu idiomatique « par une profanation ».
theological_decisions:
- issue: Portée cultuelle de τὰ ἅγια Κυρίου
  choice: les choses saintes du Seigneur
  alternative: le sanctuaire du Seigneur ; les lieux saints du Seigneur
  rationale: Dans le grec biblique et du Second Temple, τὰ ἅγια peut désigner le sanctuaire, mais le pluriel permet aussi un sens plus large. Le texte principal ne tranche donc pas silencieusement en faveur d’un lieu unique ; la lecture cultuelle plus précise est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme étymologique de βεβηλόω avec βεβήλωσις est rendu par « profané… en les traitant comme profanes », formulation naturelle qui maintient l’insistance du grec.
