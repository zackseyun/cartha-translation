  text: and they were insolent in their prosperity[c][b][a], and they did not endure.
translation:
  language: fr
  text: et ils se sont comportés avec insolence dans leur prospérité[a], et ils n’ont pas tenu bon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu de leurs biens » ou « parmi les bonnes choses dont ils jouissaient ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils n’ont pas supporté cela » ou « ils n’ont pas résisté ». Le grec ne précise pas ce qu’ils n’ont pas supporté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξύβρισαν
  choice: ils se sont comportés avec insolence
  rationale: Le verbe exprime une conduite arrogante, outrageante ou démesurée. Cette formulation conserve sa portée morale tout en restant naturelle en français moderne.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: dans leur prospérité
  rationale: Le pluriel substantivé ἀγαθά peut désigner les biens, les avantages ou les bonnes choses dont ils jouissent. Dans ce contexte, « leur prospérité » rend naturellement la situation d’aisance sans exclure entièrement l’idée de biens matériels.
- source_word: οὐκ ἤνεγκαν
  choice: ils n’ont pas tenu bon
  rationale: Le verbe φέρω peut ici signifier supporter, endurer ou tenir. Le grec ne précise aucun complément; cette tournure française préserve ce caractère absolu sans introduire une incapacité absente du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « et » suit la coordination du grec. Le rendu conserve l’ambiguïté de la dernière proposition et signale la portée possible, matérielle ou plus générale, de ἀγαθά.
