  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: fr
  text: Ta bonté s’étend sur Israël comme un don abondant ; tes yeux sont tournés vers eux, et aucun d’eux ne manquera de rien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il n’y aura parmi eux aucun manque ». Le grec est elliptique.
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: bonté
  rationale: Le terme désigne une bonté bienveillante qui se manifeste concrètement. « Bonté » convient au registre poétique et reste naturel en français.
- source_word: δόματος πλουσίου
  choice: un don abondant
  rationale: δόμα, avec omicron, signifie « don » et non « toit » (δῶμα). πλούσιος évoque ici la richesse ou l’abondance du don ; « don abondant » restitue clairement cette image comprimée.
- source_word: ἐπὶ Ἰσραήλ
  choice: s’étend sur Israël
  rationale: La répétition de ἐπί présente la bonté divine comme se déployant sur Israël. « S’étend sur » conserve cette orientation spatiale sans produire une tournure française raide.
- source_word: οἱ ὀφθαλμοί σου ἐπιβλέποντες ἐπʼ αὐτά
  choice: tes yeux sont tournés vers eux
  rationale: Le participe exprime un regard attentif. La traduction garde l’image visuelle sans expliciter davantage l’idée de protection. Le neutre pluriel αὐτά renvoie collectivement aux membres ou aux réalités d’Israël, rendus naturellement par « eux ».
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: aucun d’eux ne manquera de rien
  rationale: La proposition grecque est elliptique. Cette formulation rend le sens probable — aucun membre d’Israël ne sera dans le besoin — tout en signalant en note une autre manière de comprendre la syntaxe.
theological_decisions:
- issue: Référent et portée de la dernière proposition
  choice: La phrase affirme qu’aucun de ceux sur qui Dieu porte son regard ne manquera du nécessaire.
  alternative: 'La construction peut aussi se comprendre de façon impersonnelle : « il n’y aura parmi eux aucun manque » ; plus rarement, on peut suppléer Dieu comme sujet : « il ne fera défaut à aucun d’eux ».'
  rationale: Le grec est bref et elliptique. La traduction retenue s’accorde avec le pronom pluriel et le contexte du regard bienveillant de Dieu, sans transformer ce regard en une doctrine plus précise que le texte.
translation_notes:
  register: Français international moderne, poétique et digne. « Tel un don abondant » conserve la comparaison et corrige toute confusion entre δόμα (« don ») et δῶμα (« toit, maison »).
