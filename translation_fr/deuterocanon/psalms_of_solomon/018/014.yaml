  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his servants.
translation:
  language: fr
  text: Et ils ne se sont pas égarés depuis le jour où il les a créés.[a] Depuis les générations anciennes, ils ne se sont pas écartés de leurs voies,[b] à moins que Dieu ne le leur ait ordonné par un ordre de ses esclaves.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne se sont pas détournés de leur route » ou « n’ont pas erré ».'
    reason: lexical_alternative
  - marker: b
    text: « Leurs voies » peut désigner les trajectoires ou les règles de fonctionnement qui leur ont été assignées.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « par l’intermédiaire de ses esclaves ».'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Le grec peut aussi se traduire très littéralement : « par une ordonnance de ses esclaves ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: se sont égarés
  rationale: Le verbe exprime ici le fait de dévier d’un parcours juste ou fixé. « Se sont égarés » reste idiomatique tout en conservant la possibilité d’un égarement spatial ou figuré.
- source_word: ἔκτισεν
  choice: a créés
  rationale: κτίζω signifie normalement « créer »; ce choix convient au contexte de l’ordre établi dans la création.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: depuis le jour où
  rationale: Cette tournure rend naturellement en français le point de départ temporel exprimé par le grec.
- source_word: ἀπὸ γενεῶν ἀρχαίων
  choice: depuis les générations anciennes
  rationale: La formulation conserve la référence aux générations et l’idée d’une durée remontant à l’Antiquité, sans la réduire à un simple adverbe.
- source_word: ἀπέστησαν
  choice: se sont écartés
  rationale: Le verbe désigne l’éloignement ou l’abandon d’une position ou d’un parcours établi.
- source_word: ὁδῶν αὐτῶν
  choice: leurs voies
  rationale: « Voies » préserve la portée de ὁδός, qui peut désigner des chemins, des trajectoires ou des conduites établies.
- source_word: ἐνετείλατο
  choice: ait ordonné
  rationale: Le verbe marque un commandement faisant autorité. Le subjonctif passé est exigé naturellement après « à moins que ».
- source_word: ἐν ἐπιταγῇ
  choice: par un ordre
  rationale: La préposition ἐν peut ici exprimer le moyen ou la circonstance, tandis que ἐπιταγή désigne un ordre faisant autorité.
- source_word: δούλων αὐτοῦ
  choice: de ses esclaves
  rationale: « Esclaves » conserve explicitement la condition de dépendance exprimée par δοῦλος, sans l’adoucir en « serviteurs ».
theological_decisions:
- issue: Référent du pronom « ils »
  choice: Conserver le pronom sans préciser son référent.
  alternative: Identifier explicitement les astres, les éléments célestes ou les êtres créés.
  rationale: Dans ce verset, le grec laisse l’antécédent dépendre du contexte. Le préciser dans la traduction lèverait une ambiguïté que la phrase elle-même maintient.
- issue: Rapport entre « l’ordre » et « ses esclaves »
  choice: Traduire formellement le génitif par « un ordre de ses esclaves ».
  alternative: « un ordre transmis par ses esclaves » ou « par l’intermédiaire de ses esclaves »
  rationale: Le grec ἐν ἐπιταγῇ δούλων αὐτοῦ associe directement « ordre » au génitif « de ses esclaves ». La formulation principale préserve cette tension grammaticale; une note signale la lecture instrumentale possible sans l’imposer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux propositions négatives. « Esclaves » est maintenu pour δοῦλοι, et la construction inhabituelle de la dernière proposition reste visible plutôt que d’être résolue silencieusement.
