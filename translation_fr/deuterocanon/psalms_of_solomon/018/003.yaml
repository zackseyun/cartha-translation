  yaml_path: translation/deuterocanon/psalms_of_solomon/018/003.yaml
  text: Your ears heed the plea of the poor in hope[d][c][b][a]; your judgments are over all the earth with mercy.
translation:
  language: fr
  text: Tes oreilles sont attentives à la supplication d’un pauvre[a], dans l’espérance[b] ; tes jugements s’exercent sur toute la terre avec miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une personne pauvre » ; le grec est au masculin singulier.
    reason: lexical_alternative
  - marker: b
    text: L’expression « dans l’espérance » peut se rapporter au pauvre ou à sa supplication.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: τὰ ὦτά σου ἐπακούει
  choice: Tes oreilles écoutent
  rationale: Cette formulation conserve l’image concrète des « oreilles » tout en rendant ἐπακούει comme une écoute attentive et réceptive, plutôt que comme une simple perception auditive.
- source_word: δέησιν
  choice: supplication
  rationale: Le terme désigne une demande pressante, souvent adressée à Dieu. « Supplication » en garde la force et la tonalité de prière.
- source_word: πτωχοῦ
  choice: d’un pauvre
  rationale: Le grec emploie un nom masculin singulier sans article. « D’un pauvre » préserve le singulier et le caractère indéfini sans imposer que le passage désigne nécessairement un homme particulier.
- source_word: ἐν ἐλπίδι
  choice: dans l’espérance
  rationale: Le rendu littéral garde la brièveté de l’expression grecque ainsi que son rattachement syntaxique ouvert.
- source_word: τὰ κρίματά σου
  choice: tes jugements
  rationale: « Jugements » rend directement κρίματα et peut désigner les décisions ou actes judiciaires de Dieu.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: s’exercent sur toute la terre
  rationale: Le grec indique que les jugements divins portent sur la terre entière. Le verbe « s’exercent » explicite naturellement en français la proposition nominale grecque sans réduire cette portée à une simple localisation.
- source_word: μετὰ ἐλέους
  choice: avec miséricorde
  rationale: Ce rendu conserve le substantif grec et l’association, théologiquement importante, entre jugement et miséricorde.
theological_decisions:
- issue: Rapport entre les jugements divins et la miséricorde
  choice: avec miséricorde
  alternative: des jugements miséricordieux
  rationale: La tournure prépositionnelle préserve la juxtaposition du jugement et de la miséricorde sans fondre l’un dans l’autre ni atténuer leur tension.
- issue: Rattachement de ἐν ἐλπίδι
  choice: dans l’espérance, placé après « d’un pauvre »
  alternative: qui espère / avec espérance
  rationale: Le grec ne précise pas explicitement si l’expression caractérise le pauvre, sa supplication ou les circonstances de l’écoute. La formulation française conserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. « Supplication » maintient la tonalité priante du texte, tandis que « s’exercent » évite le calque peu naturel « sont sur toute la terre ». Les deux marqueurs de note figurent dans le texte principal.
