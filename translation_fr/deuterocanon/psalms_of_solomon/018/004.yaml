  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: fr
  text: Et ton amour repose sur la descendance d’Abraham, les fils d’Israël. Ta discipline[a] s’exerce sur nous comme sur un fils premier-né, unique,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec porte la forme παιδία, comprise ici au sens de παιδεία : discipline, éducation ou formation corrective.'
    reason: Signaler la particularité orthographique du texte transmis et l’interprétation lexicale nécessaire à la traduction.
lexical_decisions:
- source_word: ἀγάπη σου
  choice: ton amour
  rationale: « Amour » rend directement ἀγάπη et conserve la chaleur relationnelle et l’arrière-plan d’alliance du verset.
- source_word: σπέρμα Ἀβραάμ
  choice: la descendance d’Abraham
  rationale: σπέρμα est un singulier collectif. « Descendance » en exprime naturellement le sens collectif en français tout en gardant claire la référence à Abraham.
- source_word: υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  rationale: La formulation explicite « fils » est conservée afin de maintenir l’écho lexical avec l’image du fils au singulier dans la proposition suivante.
- source_word: ἡ παιδία σου
  choice: ta discipline
  rationale: Le terme est compris au sens de παιδεία, formation corrective et éducative. « Discipline » conserve à la fois la correction et la formation, sans réduire le sens à une simple punition.
- source_word: ἐπὶ / ἐφʼ
  choice: repose sur / s’exerce sur
  rationale: La répétition de ἐπί est perceptible grâce à « sur », tandis que les verbes choisis assurent un français naturel et distinguent la manière dont l’amour et la discipline se rapportent à leurs objets.
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: comme sur un fils premier-né, un fils unique
  rationale: 'Cette formulation maintient côte à côte πρωτότοκον et μονογενῆ sans les fondre en une seule idée : elle préserve à la fois le statut de premier-né et le caractère unique et précieux du fils.'
theological_decisions:
- issue: Rapport entre « premier-né » et « fils unique »
  choice: Conserver les deux désignations en apposition
  alternative: Les réunir en « un fils unique premier-né » ou n’en retenir qu’une
  rationale: Le grec juxtapose les deux termes, qui créent une tension signifiante. La traduction ne doit ni en éliminer un ni harmoniser silencieusement leurs nuances.
translation_notes:
  register: Français moderne, international et digne, avec un parallélisme psalmique lisible. « Repose sur » et « s’exerce sur » évitent le calque peu naturel « est sur », tout en gardant la répétition de la préposition. La virgule finale est conservée puisque le verset se poursuit syntaxiquement.
