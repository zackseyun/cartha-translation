base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/009.yaml
  text: to guide men in works of righteousness in the fear of God[c][b][a], to set them all before the Lord.
translation:
  language: fr
  text: pour diriger les hommes dans des œuvres de justice, dans la crainte de Dieu, et pour les placer tous devant le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence du Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευθῦναι
  choice: diriger
  rationale: L’infinitif exprime l’action de conduire des personnes dans une voie droite. « Diriger » reste naturel tout en conservant l’idée d’orientation morale.
- source_word: ἄνδρας
  choice: les hommes
  rationale: Le grec emploie le pluriel masculin ἄνδρας. La traduction conserve cette forme genrée plutôt que de la généraliser sans indication contextuelle décisive.
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: dans des œuvres de justice
  rationale: Cette formulation maintient le nom concret « œuvres » et laisse à δικαιοσύνη sa dimension à la fois morale et juste. En français actuel, « justice » est plus idiomatique ici que « droiture », sans réduire l’expression aux seules décisions judiciaires.
- source_word: φόβῳ θεοῦ
  choice: dans la crainte de Dieu
  rationale: Le datif peut indiquer la sphère ou la manière. La formule biblique française préserve la révérence religieuse sans la ramener à une simple peur.
- source_word: καταστῆσαι
  choice: placer
  rationale: Dans ce contexte, le verbe indique que les personnes sont mises ou établies devant le Seigneur. « Placer » conserve cette image sans introduire l’idée plus précise d’une nomination.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: Traduction directe et traditionnelle qui peut désigner aussi bien la position devant le Seigneur que sa présence.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: δικαιοσύνη peut désigner la conformité morale ou la justice. « Œuvres de justice » conserve l’expression nominale et son ampleur; « œuvres de droiture » reste une autre traduction possible.
- issue: Portée de ἐνώπιον Κυρίου
  choice: devant le Seigneur
  alternative: en présence du Seigneur
  rationale: « Devant » reproduit sobrement la relation spatiale et cultuelle du grec, tandis que « en présence de » en explicite une nuance légitime.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme des deux infinitifs est rendu par « pour… et pour… ». L’expression biblique « crainte de Dieu » est conservée.
