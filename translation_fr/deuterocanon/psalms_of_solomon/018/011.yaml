  text: Great and glorious is our God[a], dwelling in the heights;
translation:
  language: fr
  text: Notre Dieu est grand et glorieux, lui qui demeure dans les hauteurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les lieux les plus élevés » ou « dans les plus hauts cieux ».
    reason: 'Alternative lexicale : ἐν ὑψίστοις peut désigner les hauteurs, les lieux les plus élevés ou, par implication, les plus hauts cieux.'
lexical_decisions:
- source_word: μέγας
  choice: grand
  rationale: « Grand » conserve le sens fondamental de l’adjectif et convient à cette louange, sans accentuer exclusivement la puissance comme le ferait « puissant ».
- source_word: ἔνδοξος
  choice: glorieux
  rationale: « Glorieux » rend naturellement le terme dans un contexte de louange et maintient son association directe avec la gloire divine.
- source_word: ἐν ὑψίστοις
  choice: dans les hauteurs
  rationale: Le grec désigne littéralement les lieux ou réalités les plus élevés. « Dans les hauteurs » préserve l’image spatiale sans préciser « les cieux » au-delà de ce qu’énonce explicitement le texte.
- source_word: κατοικῶν
  choice: lui qui demeure
  rationale: Le participe présent exprime une habitation continue. « Lui qui demeure » est naturel en français et garde le lien descriptif avec « notre Dieu ».
