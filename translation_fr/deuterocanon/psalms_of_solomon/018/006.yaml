base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
translation:
  language: fr
  text: Que Dieu purifie Israël pour un jour de miséricorde, dans la bénédiction, pour un jour de choix[a], lors de l’élévation de son Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «un jour d’élection».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : «lorsqu’il élèvera son Messie»; le terme grec peut aussi évoquer son exaltation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι ὁ θεὸς Ἰσραήλ
  choice: Que Dieu purifie Israël
  rationale: καθαρίσαι peut ici être analysé comme un optatif aoriste exprimant un souhait; ὁ θεός est le sujet et l’indéclinable Ἰσραήλ l’objet direct. Cette analyse donne une phrase complète sans ajouter «nous» ni comprendre «Israël» comme un complément de «Dieu».
- source_word: εἰς ἡμέραν ἐλέους
  choice: pour un jour de miséricorde
  rationale: εἰς présente le jour à venir comme l’horizon auquel cette purification prépare Israël. «Miséricorde» conserve la portée religieuse de ἔλεος dans un français biblique actuel.
- source_word: ἐν εὐλογίᾳ
  choice: dans la bénédiction
  rationale: La formulation garde la préposition et le nom abstrait du grec sans décider si la bénédiction désigne le cadre, la manière ou la circonstance accompagnant ce jour.
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: pour un jour de choix
  rationale: «Choix» rend clairement ἐκλογή sans imposer au lecteur le sens politique moderne d’«élection»; une note conserve cette autre traduction possible.
- source_word: ἐν ἀνάξει
  choice: lors de l’élévation
  rationale: «Élévation» préserve l’idée de mouvement vers le haut et laisse ouverte la nuance entre action de faire paraître, accession et exaltation.
- source_word: χριστοῦ αὐτοῦ
  choice: de son Messie
  rationale: Dans ce contexte juif, χριστός fonctionne comme un titre; «Messie» en restitue directement le sens.
theological_decisions:
- issue: Fonction syntaxique de Ἰσραήλ
  choice: Comprendre Israël comme l’objet direct de «purifie».
  alternative: Comprendre l’expression comme «le Dieu d’Israël» et suppléer un objet tel que «nous».
  rationale: Avec ὁ θεός au nominatif comme sujet et καθαρίσαι comme optatif, l’indéclinable Ἰσραήλ s’analyse naturellement comme objet. Cette lecture évite tout ajout absent du texte.
- issue: Valeur de καθαρίσαι
  choice: Exprimer un souhait par «Que Dieu purifie».
  alternative: 'Traduire l’infinitif de manière dépendante: «afin de purifier» ou «purifier».'
  rationale: La forme peut être morphologiquement identique à l’infinitif aoriste, mais la présence du sujet nominatif ὁ θεός et de l’objet Ἰσραήλ favorise fortement l’optatif de souhait dans cette phrase.
- issue: Portée messianique de ἐν ἀνάξει
  choice: Conserver la formulation ouverte «lors de l’élévation de son Messie».
  alternative: Préciser «lorsqu’il suscitera son Messie» ou «dans l’exaltation de son Messie».
  rationale: Le grec évoque une élévation sans préciser ici s’il s’agit principalement de l’apparition, de l’établissement royal ou de l’exaltation du Messie; la traduction ne tranche donc pas.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle «pour un jour… pour un jour…» reproduit le mouvement du grec. «Dans la bénédiction» reste volontairement proche de l’expression concise et quelque peu ouverte du texte source.
