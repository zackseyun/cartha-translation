revisions:
- from: Heureux ceux qui viendront au monde en ces jours-là[a] et verront les bienfaits[b] que le Seigneur accordera à la génération à venir !
  to: Heureux ceux qui viendront au monde en ces jours-là[a], pour voir les bonnes choses[b] que le Seigneur fera pour la génération à venir !
  rationale: 'La révision conserve le choix idiomatique « viendront au monde », tout en signalant dans la note la portée plus large possible de γενόμενοι. Elle rend ἰδεῖν par un infinitif français et restitue τὰ ἀγαθὰ ἃ ποιήσει de manière plus directe et moins interprétative : « les bonnes choses que le Seigneur fera pour ». Les deux ancres de note restent correctement placées.'
