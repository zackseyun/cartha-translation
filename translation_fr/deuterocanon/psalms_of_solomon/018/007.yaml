  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
translation:
  language: fr
  text: Heureux ceux qui viendront au monde en ces jours-là[a], pour voir les bonnes choses[b] que le Seigneur fera pour la génération à venir !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui vivront en ces jours-là » ou « ceux qui seront là en ces jours-là ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les biens » ou « les bénédictions du Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule naturelle et consacrée des béatitudes en français moderne, qui exprime la condition privilégiée de ces personnes sans recourir à l’archaïsme « bienheureux ».
- source_word: οἱ γενόμενοι
  choice: ceux qui viendront au monde
  rationale: Le participe de γίνομαι évoque ici le fait de venir à l’existence. Cette formulation française est idiomatique, tandis qu’une note conserve les lectures plus larges possibles.
- source_word: ἐν ἡμέραις ἐκείναις
  choice: en ces jours-là
  rationale: Expression temporelle biblique courante, claire et non archaïque.
- source_word: ἰδεῖν
  choice: et verront
  rationale: L’infinitif grec exprime ce qu’il sera donné à ces personnes de voir. La coordination avec un futur donne en français une phrase fluide sans modifier la perspective future du contexte.
- source_word: τὰ ἀγαθὰ
  choice: les bienfaits
  rationale: Rend naturellement les bonnes choses venant du Seigneur. Une note signale la formulation plus littérale et plus large.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Rendu français habituel de κύριος dans ce contexte théologique; le rapport génitif est exprimé par l’idée que les bienfaits ont le Seigneur pour auteur.
- source_word: ἃ ποιήσει
  choice: que le Seigneur accordera
  rationale: En lien avec « bienfaits » et le datif bénéficiaire, « accordera » exprime naturellement l’action divine. Le grec dit plus littéralement « qu’il fera ».
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: à la génération à venir
  rationale: Conserve le datif de bénéficiaire et l’orientation future de l’expression grecque.
theological_decisions:
- issue: Portée de οἱ γενόμενοι
  choice: ceux qui viendront au monde
  alternative: ceux qui seront en vie / se trouveront là
  rationale: Le contexte permet de comprendre le participe comme une venue à l’existence, sans imposer une doctrine particulière sur l’identité de la génération. La note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le ton d’une béatitude et évite aussi bien l’archaïsme que l’explicitation doctrinale. Les deux marqueurs de note figurent dans le texte principal.
