translation:
  language: fr
  text: Seigneur, ta miséricorde repose sur les œuvres de tes mains pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif s’exprime naturellement en français par l’adresse directe « Seigneur », sans ajout d’une interjection.
- source_word: τὸ ἔλεός σου
  choice: ta miséricorde
  rationale: ἔλεος désigne ici la miséricorde ou la bonté compatissante de Dieu ; « miséricorde » conserve le poids théologique du terme tout en restant intelligible.
- source_word: ἐπὶ
  choice: repose sur
  rationale: Cette formulation conserve l’image spatiale d’une miséricorde qui s’étend sur les réalités désignées, dans un français plus naturel que « est sur ».
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: les œuvres de tes mains
  rationale: La traduction préserve l’expression concrète et anthropomorphique du grec sans la réduire explicitement à la création ni la paraphraser.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: L’expression indique une durée sans fin ; « pour toujours » est courant, clair et fidèle dans ce contexte.
theological_decisions:
- issue: Faut-il expliciter τὰ ἔργα τῶν χειρῶν σου comme une référence à la création ?
  choice: les œuvres de tes mains
  alternative: tout ce que tes mains ont fait
  rationale: Le grec évoque ce que Dieu a réalisé sans imposer une explicitation plus étroite. Le maintien de l’image conserve l’étendue et la tension du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse biblique directe à Dieu et permet de conserver le singulier du grec.
