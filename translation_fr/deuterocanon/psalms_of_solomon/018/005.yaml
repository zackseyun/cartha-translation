translation:
  language: fr
  text: pour détourner une âme disposée à écouter[a][c] de la sottise dans l’ignorance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une âme docile » ou « une âme prête à écouter ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec distingue ἀμαθία et ἀγνοία : le vers associe la sottise ou le manque d’instruction à l’ignorance, sans employer simplement deux fois le même terme.'
    reason: lexical_alternative
  - marker: c
    text: Ou « une âme réceptive ».
    reason: previous_rendering
lexical_decisions:
- source_word: ἀποστρέψαι
  choice: pour détourner
  rationale: L’infinitif aoriste exprime ici l’action de faire se détourner de quelque chose; « détourner … de » restitue naturellement la force directionnelle de ἀπό. « Pour » marque la valeur infinitive dans la continuité probable du contexte.
- source_word: ψυχὴν
  choice: une âme
  rationale: Dans ce contexte moral et religieux, « âme » conserve la portée anthropologique de ψυχή sans la réduire à l’émotion ou à la personnalité.
- source_word: εὔκοον
  choice: disposée à écouter
  rationale: Formé sur l’idée de bien ou volontiers entendre, l’adjectif décrit une âme prête à écouter, donc enseignable ou docile. Cette formulation garde l’image de l’écoute sans imposer la seule notion d’obéissance.
- source_word: ἀμαθίας
  choice: de la sottise
  rationale: « Sottise » exprime ici un défaut moral et intellectuel ou un manque d’instruction, tout en évitant de confondre ἀμαθία avec ἀγνοία, également présent dans la proposition.
- source_word: ἐν ἀγνοίᾳ
  choice: dans l’ignorance
  rationale: 'La traduction directe préserve l’ambiguïté du rapport syntaxique: l’expression peut indiquer l’état ou les circonstances dans lesquels se trouve la sottise, sans expliciter davantage ce que le grec laisse compact.'
