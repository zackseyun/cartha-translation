base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/013.yaml
  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
translation:
  language: fr
  text: Leur voie est dans la crainte de Dieu chaque jour[a], depuis le jour où Dieu les a créés et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le respect révérenciel de Dieu » pour « dans la crainte de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  choice: dans la crainte de Dieu
  rationale: Cette expression française traditionnelle et toujours intelligible conserve le lexique et la portée théologique du grec, où la crainte désigne ici une attitude de piété révérencielle orientée vers Dieu.
- source_word: ἡ ὁδὸς αὐτῶν
  choice: leur voie
  rationale: « Voie » préserve la métaphore grecque du chemin comme manière de vivre. « Conduite » serait plus explicatif, tandis que « chemin » évoquerait davantage un trajet concret.
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: chaque jour
  rationale: Formulation naturelle et précise pour exprimer la continuité quotidienne.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: depuis le jour où
  rationale: Le français demande naturellement « où » devant la proposition verbale; la tournure marque clairement le point de départ temporel.
- source_word: ἔκτισεν
  choice: a créés
  rationale: « Créer » rend directement κτίζω et maintient la portée de Dieu comme créateur. Le participe passé s'accorde avec le pronom objet direct antéposé « les ».
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Cette tournure française courante exprime une durée indéfiniment prolongée sans imposer une interprétation plus technique de αἰών.
theological_decisions:
- issue: Portée de « crainte de Dieu »
  choice: Conserver « crainte de Dieu »
  alternative: « respect révérenciel envers Dieu »
  rationale: Le rendu retenu préserve la tension du terme φόβος entre crainte et révérence, sans la réduire silencieusement à une seule nuance.
- issue: Référent du pluriel αὐτῶν / αὐτούς
  choice: Maintenir les pronoms pluriels sans préciser leur référent
  alternative: Remplacer les pronoms par un groupe nominal explicatif tiré du contexte
  rationale: Le verset fourni ne nomme pas lui-même le référent; l'expliciter ici ajouterait une interprétation contextuelle au texte.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec tout en étant idiomatique. « Leur voie » conserve la métaphore biblique de la conduite comme chemin de vie; « pour toujours » évite l'archaïsme de « à jamais ».
