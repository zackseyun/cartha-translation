  text: the one who appointed the luminaries in their course for the appointed times of the hours, from day to day; and they have not departed from the path he commanded them.
translation:
  language: fr
  text: celui qui a disposé les astres lumineux dans leur course[a], pour les temps fixés des heures[b], de jour en jour ; et ils ne se sont pas écartés du chemin qu’il leur avait prescrit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur marche » ou « en procession ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les temps fixés des heures » ; l’expression semble désigner un ordre temporel déterminé. Le mot rendu par « heures » peut aussi désigner des périodes ou des saisons.'
    reason: lexical_alternative
  - marker: c
    text: Ou « qu’il leur avait commandé de suivre ».
    reason: translation_clarity
lexical_decisions:
- source_word: διατάξας
  choice: a disposé
  rationale: Le participe exprime ici une mise en ordre intentionnelle. « A disposé » convient aux astres et préserve l’idée d’organisation sans ajouter celle d’une délégation.
- source_word: φωστῆρας
  choice: les astres lumineux
  rationale: Dans ce contexte céleste, l’expression désigne les corps lumineux du ciel. « Astres lumineux » est clair et soutenu, tandis que « luminaires » pourrait évoquer en français moderne des appareils d’éclairage.
- source_word: ἐν πορείᾳ
  choice: sur leur parcours
  rationale: Le groupe décrit leur mouvement ordonné. « Sur leur parcours » rend naturellement l’image sans introduire la notion scientifique moderne d’orbite.
- source_word: καιροὺς ὡρῶν
  choice: les temps fixés des heures
  rationale: 'La formulation conserve les deux termes grecs et son caractère quelque peu énigmatique : καιρούς évoque des moments déterminés, et ὡρῶν peut désigner des heures ou, plus largement, des périodes réglées.'
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: de jour en jour
  rationale: Cette tournure française idiomatique exprime la régularité continue du grec tout en gardant sa répétition temporelle.
- source_word: παρέβησαν
  choice: ne se sont pas écartés
  rationale: Avec « chemin », le verbe évoque surtout une déviation spatiale. Le passé composé présente naturellement en français l’état d’obéissance constaté jusqu’au point de vue du locuteur.
- source_word: ὁδοῦ
  choice: du chemin
  rationale: « Chemin » maintient l’image concrète d’une voie prescrite aux astres et évite de répéter « parcours ».
- source_word: ἐνετείλατο
  choice: avait prescrit
  rationale: Le verbe marque un ordre donné avec autorité. « Prescrit » s’accorde bien avec un chemin assigné ; le plus-que-parfait explicite naturellement en français l’antériorité de cet ordre par rapport à l’absence de déviation.
