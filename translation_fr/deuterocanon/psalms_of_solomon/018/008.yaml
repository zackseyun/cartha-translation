  text: under the rod of discipline of the Lord's Messiah[a], in the fear of his God, in wisdom of spirit and righteousness and strength[d][c][b];
translation:
  language: fr
  text: sous le bâton de discipline du Messie du Seigneur[a], dans la crainte de son Dieu, dans la sagesse d’esprit, de justice et de force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « du Messie Seigneur » ou « de l’oint du Seigneur » ; la suite des génitifs grecs est très condensée.
    reason: alternative_reading
lexical_decisions:
- source_word: ῥάβδον παιδείας
  choice: le bâton qui corrige
  rationale: La tournure exprime naturellement en français l’instrument de la discipline corrective, tout en conservant l’image concrète de la ῥάβδος.
- source_word: χριστοῦ κυρίου
  choice: du Messie du Seigneur
  rationale: « Messie » maintient la portée juive du titre χριστός. Le double complément conserve la relation la plus probable entre les génitifs sans transformer « Messie » en simple nom propre.
- source_word: φόβῳ θεοῦ αὐτοῦ
  choice: dans la crainte de son Dieu
  rationale: La traduction garde le terme biblique « crainte » ainsi que le possessif explicite αὐτοῦ.
- source_word: σοφίᾳ πνεύματος
  choice: dans la sagesse d’esprit
  rationale: Cette traduction formelle préserve l’absence d’article et ne tranche pas entre une qualité spirituelle et une éventuelle référence à l’Esprit.
- source_word: δικαιοσύνης
  choice: la justice
  rationale: En français, « justice » est le rendu naturel de δικαιοσύνη dans cette série de qualités et peut couvrir à la fois la droiture et la justice exercée.
- source_word: ἰσχύος
  choice: la force
  rationale: « Force » rend simplement ἰσχύς sans accentuer indûment l’idée de puissance souveraine.
theological_decisions:
- issue: Rapport entre χριστοῦ et κυρίου
  choice: du Messie du Seigneur
  alternative: du Messie Seigneur ; de l’oint du Seigneur
  rationale: La suite compacte de génitifs permet plusieurs analyses. Le texte principal retient la relation génitivale la plus probable, tandis que la note préserve l’ambiguïté réelle.
- issue: Sens de πνεύματος
  choice: d’esprit
  alternative: de l’Esprit
  rationale: L’absence d’article et la série de qualités ne permettent pas d’identifier sûrement l’Esprit de Dieu ; la minuscule évite donc de préciser plus que le grec.
- issue: Portée de δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: « Justice » reste le rendu français biblique le plus large, mais « droiture » est possible si le mot désigne ici surtout une qualité morale.
translation_notes:
  register: Français international moderne, digne et accessible. « Le bâton qui corrige » évite la raideur de « bâton de discipline » tout en gardant l’image. La ponctuation présente « sagesse d’esprit, justice et force » comme une série coordonnée, sans imposer que les trois derniers génitifs dépendent tous de « sagesse ».
