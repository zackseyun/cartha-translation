base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/002.yaml
  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
translation:
  language: fr
  text: Des nations étrangères sont montées sur ton autel[a] ; elles l’ont piétiné avec leurs sandales, avec arrogance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs » ; ἔθνη peut désigner les nations en général ou, dans un contexte juif et cultuel, les peuples non israélites.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: sont montées sur
  rationale: Le verbe exprime concrètement le mouvement vers le haut. Avec ἐπὶ τὸ θυσιαστήριόν σου, « sont montées sur » conserve l’image d’une intrusion jusque sur l’autel sans ajouter une nuance militaire.
- source_word: θυσιαστήριόν
  choice: autel
  rationale: « Autel » est le terme français usuel et suffisamment précis dans ce contexte cultuel.
- source_word: ἔθνη ἀλλότρια
  choice: nations étrangères
  rationale: ἔθνη désigne des nations ou, dans un cadre juif, les non-Israélites ; ἀλλότρια ajoute l’idée qu’elles sont étrangères ou étrangères au peuple. « Nations étrangères » rend naturellement les deux éléments.
- source_word: κατεπάτησαν
  choice: ont piétiné
  rationale: Le verbe évoque l’action de fouler aux pieds avec violence et convient à l’image de profanation.
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: avec leurs sandales
  rationale: La préposition indique ici le moyen ou la circonstance. « Sandales » conserve l’image concrète et son cadre historique.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec arrogance
  rationale: Cette formulation exprime clairement la manière et la portée morale de l’acte, sans atténuer l’insolence suggérée par ὑπερηφανία.
theological_decisions:
- issue: Portée de ἔθνη dans un contexte juif et cultuel
  choice: nations
  alternative: non-Juifs
  rationale: « Nations » préserve la valeur lexicale générale et l’ambiguïté contextuelle, tandis que « non-Juifs » préciserait davantage l’identité religieuse que ne le fait nécessairement le mot seul.
translation_notes:
  register: Français international moderne, digne et direct. Le passé composé donne au récit une expression naturelle ; la répétition de « avec » maintient distincts le moyen du piétinement et l’attitude arrogante.
