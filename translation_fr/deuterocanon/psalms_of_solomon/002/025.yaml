  text: For they mocked and did not spare, in anger and wrath with fierce indignation.
translation:
  language: fr
  text: Car ils se sont moqués et n’ont pas épargné, dans la colère et la fureur, avec indignation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ressentiment » ou « avec une colère vindicative » (μετὰ μηνίσεως).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et assure une liaison naturelle en français.
- source_word: ἐνέπαιξαν
  choice: ils se sont moqués
  rationale: Rend la dérision hostile exprimée par le verbe grec sans expliciter un objet que le texte ne nomme pas.
- source_word: οὐκ ἐφείσαντο
  choice: n’ont pas épargné
  rationale: Conserve la formulation concise et l’absence d’objet du grec, ainsi que l’idée de ne faire preuve d’aucune retenue.
- source_word: ἐν ὀργῇ
  choice: dans la colère
  rationale: Reproduit directement la première expression de colère et maintient l’accumulation rhétorique.
- source_word: καὶ θυμῷ
  choice: et la fureur
  rationale: Distingue θυμός de ὀργή en faisant entendre une colère plus emportée, sans effacer le doublet grec.
- source_word: μετὰ μηνίσεως
  choice: avec indignation
  rationale: μήνισις désigne une colère profonde, potentiellement durable ou vindicative. « Indignation » garde la force et la dignité du registre sans imposer à tort une nuance unique.
