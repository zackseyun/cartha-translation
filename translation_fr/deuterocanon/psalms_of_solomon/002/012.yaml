  text: And the earth will know all your righteous judgments[a], O God.
translation:
  language: fr
  text: Et la terre connaîtra tous tes jugements justes[a], ô Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous tes jugements conformes à la justice ».
