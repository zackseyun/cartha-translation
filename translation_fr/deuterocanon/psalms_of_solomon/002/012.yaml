lexical_decisions:
- source_word: γνώσεται
  choice: connaîtra
  rationale: Le futur de γινώσκω exprime ici l’accès à la connaissance ou à la reconnaissance. « Connaîtra » reste direct et préserve cette latitude sans préciser indûment « apprendra » ou « reconnaîtra ».
- source_word: ἡ γῆ
  choice: la terre
  rationale: γῆ peut désigner la terre ou un pays. La portée générale associée à « tous tes jugements » favorise ici « la terre ».
- source_word: τὰ κρίματά σου
  choice: tes jugements
  rationale: κρίματα désigne des jugements ou décisions judiciaires. « Tes jugements » conserve naturellement cette dimension en français.
- source_word: πάντα
  choice: tous
  rationale: πάντα porte sur l’ensemble des jugements et se rend naturellement par « tous ».
- source_word: τὰ δίκαια
  choice: justes
  rationale: δίκαια qualifie les jugements comme conformes à la justice. En français moderne, « jugements justes » est plus naturel et précis que « jugements droits ».
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif articulé a ici une valeur vocative. « ô Dieu » restitue l’adresse directe et le registre de la prière.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit étroitement le grec tout en restant idiomatique; l’ambiguïté de γνώσεται entre connaissance et reconnaissance n’est pas explicitement résolue.
