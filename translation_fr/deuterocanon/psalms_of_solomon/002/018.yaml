  text: Tu as dévoilé leurs péchés, afin que ton jugement soit manifeste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: Tu as dévoilé
  rationale: Le verbe signifie littéralement « découvrir, ôter ce qui couvre », d’où « dévoiler ». Cette formulation naturelle conserve l’idée que Dieu met les péchés au jour.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: leurs péchés
  rationale: Équivalent direct et courant du grec, sans atténuer sa portée morale.
- source_word: φανῇ
  choice: soit manifeste
  rationale: Le passif aoriste de φαίνω exprime ici le fait de devenir visible ou évident. « Soit manifeste » préserve la nuance sans préciser indûment par quel moyen.
- source_word: τὸ κρίμα σου
  choice: ton jugement
  rationale: κρίμα peut désigner le jugement, la sentence ou la décision judiciaire. « Jugement » maintient cette amplitude dans ce contexte.
theological_decisions:
- issue: Rapport entre la révélation des péchés et le jugement divin
  choice: afin que ton jugement soit manifeste
  alternative: pour que l’on voie ta sentence
  rationale: La traduction conserve la proposition finale introduite par ἵνα et n’explicite ni l’identité des observateurs ni la nature exacte de κρίμα.
translation_notes:
  register: Français international moderne, sobre et digne. La structure concise du grec est conservée, avec un vocabulaire accessible mais légèrement soutenu adapté au registre poétique et judiciaire.
