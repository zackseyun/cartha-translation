lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: a méprisé
  rationale: Le verbe signifie traiter quelqu’un comme rien, le tenir pour négligeable ou le mépriser. « Mépriser » est naturel, vigoureux et permet de conserver l’écho lexical du contexte.
- source_word: ἐν ἀτιμίᾳ
  choice: en le couvrant de déshonneur
  rationale: ἀτιμία désigne le déshonneur ou l’ignominie. Cette formulation française exprime la manière honteuse dont la personne est méprisée sans réduire la locution à deux verbes coordonnés.
- source_word: ἐλογίσατο
  choice: a considéré / a envisagé
  rationale: Le verbe indique ici le fait de prendre en compte ou de réfléchir. La variation française rend naturellement ses deux compléments différents tout en conservant la même idée fondamentale.
- source_word: ἄνθρωπός
  choice: un homme
  rationale: Le singulier grec est rendu directement. Dans ce contexte, « un homme » garde la portée rhétorique liée à la condition et aux limites humaines.
- source_word: τὸ ὕστερον
  choice: ce qui viendrait ensuite
  rationale: L’expression substantivée peut désigner ce qui vient après, la suite ou l’issue. La traduction retenue préserve cette ouverture sans imposer exclusivement le sens de « fin » ou de « conséquence ».
theological_decisions:
- issue: Référents des sujets non exprimés
  choice: Conserver les pronoms du grec dans le texte et signaler l’ambiguïté en note
  alternative: Introduire explicitement « Dieu » comme sujet du premier verbe et identifier l’homme comme sujet des suivants
  rationale: Le grec ne nomme pas ici les sujets. Le contexte peut favoriser un changement de référent, mais l’expliciter dans le corps du texte supprimerait une ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive de ἐλογίσατο est perceptible, tandis que les compléments sont formulés idiomatiquement. Les référents pronominaux et la portée de τὸ ὕστερον ne sont pas tranchés au-delà de ce que permet le grec.
