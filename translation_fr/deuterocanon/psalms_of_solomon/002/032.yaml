translation:
  language: fr
  text: car il l’a méprisé dans le déshonneur[a] ; il n’a pas considéré qu’il était un homme[b], et il n’a pas considéré la suite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec déshonneur ». La locution peut aussi évoquer l’ignominie ou la disgrâce.'
    reason: lexical_alternative
  - marker: b
    text: Les sujets des verbes ne sont pas exprimés en grec. Le contexte peut indiquer que celui qui méprise et celui qui ne considère pas ne sont pas la même personne.
