review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le sujet féminin enlève elle-même une μίτρα que Dieu lui avait auparavant placée. Toutefois, « coiffure » désigne habituellement la manière dont les cheveux sont arrangés plutôt qu’un objet que l’on ôte ; il affaiblit donc l’image concrète d’une parure portée sur la tête. « Coiffe » rend plus précisément, sans surinterpréter, le couvre-chef féminin évoqué par μίτρα.'
  naturalness: « Elle ôta la coiffe de gloire que Dieu avait posée sur elle » est idiomatique dans un registre biblique moderne et digne. La formulation évite aussi la légère lourdeur et l’ambiguïté référentielle de « que Dieu lui avait mise ».
  terminology: « Coiffe de gloire » conserve le génitif δόξης et convient au contexte de la ville personnifiée. « Diadème » demeure une alternative interprétative recevable en note ; « turban » est possible lexicalement, mais moins adapté comme rendu principal à cette figure féminine.
  issues:
