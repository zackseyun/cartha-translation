  - severity: low
    issue: « que Dieu lui avait mise » est grammaticalement possible mais moins net et moins naturel.
    rationale: « Posée sur elle » exprime directement περιέθηκεν αὐτῇ (« plaça/posa sur elle, autour d’elle ») et évite une ambiguïté de pronom dans la relative.
  revised_text: Elle ôta la coiffe de gloire[a][b] que Dieu avait posée sur elle.
