- from: Elle ôta la coiffure de gloire[a][b] que Dieu lui avait mise.
  to: Elle ôta la coiffe de gloire[a][b] que Dieu avait posée sur elle.
  rationale: La révision remplace « coiffure » par « coiffe », qui désigne bien une pièce de tête susceptible d’être ôtée et préserve l’ambiguïté lexicale de μίτρα sans imposer « diadème ». Elle reformule également le second membre pour rendre avec plus de clarté le fait que Dieu avait placé cette coiffe sur la femme personnifiée.
