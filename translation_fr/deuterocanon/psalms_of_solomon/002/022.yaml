lexical_decisions:
- source_word: περιείλατο
  choice: ôta
  rationale: L’aoriste moyen exprime naturellement l’action du sujet féminin qui enlève elle-même ce qu’elle portait. « Ôta » reste direct sans ajouter l’idée de violence.
- source_word: μίτραν
  choice: coiffure
  rationale: Dans le contexte de Jérusalem personnifiée en femme, μίτρα désigne une parure ou coiffure portée sur la tête. « Coiffure » conserve l’image concrète tout en évitant les connotations modernes et surtout masculines que peut avoir « turban ».
- source_word: δόξης
  choice: de gloire
  rationale: Le complément du nom est conservé afin de rendre la formulation élevée du grec et l’honneur associé à cette coiffure.
- source_word: περιέθηκεν αὐτῇ
  choice: lui avait mise
  rationale: Le verbe signifie mettre ou placer autour de quelqu’un ou sur quelqu’un. Le plus-que-parfait indique naturellement en français que Dieu la lui avait donnée et mise avant qu’elle ne l’ôte.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française usuelle, sans ajout de titre absent du texte grec.
