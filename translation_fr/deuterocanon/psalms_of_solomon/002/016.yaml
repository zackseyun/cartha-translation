  source_fidelity: 'Le texte rend fidèlement les quatre éléments grecs : le futur à la première personne (« Je te déclarerai »), l’adresse à Dieu comme objet de δικαιόω, la manière exprimée par ἐν εὐθύτητι καρδίας (« d’un cœur droit »), et l’assertion que la justice divine est présente dans ses jugements. « Justice » convient très bien à δικαιοσύνη dans ce contexte judiciaire, sans éliminer la nuance de rectitude signalée en note.'
  naturalness: Le français est fluide, moderne et suffisamment digne pour un psaume. « D’un cœur droit » est naturel et bibliquement évocateur. « Dans tes jugements se trouve ta justice » conserve l’ordre et l’image de la proposition grecque tout en restant compréhensible ; il n’est pas nécessaire de la remplacer par une formulation plus interprétative telle que « tes jugements manifestent ».
  terminology: « Déclarer juste » évite à juste titre de suggérer que le locuteur rendrait Dieu juste. Les alternatives « justifier » et « donner raison » sont utiles et ne surdéterminent pas le sens. « Jugements » et « justice » forment un couple terminologique cohérent pour κρίματα et δικαιοσύνη.
