  yaml_path: translation/deuterocanon/psalms_of_solomon/002/016.yaml
  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: fr
  text: Je te déclarerai juste[a], ô Dieu, d’un cœur droit, car dans tes jugements se trouve ta justice[b], ô Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je te justifierai » ou « je te donnerai raison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « droiture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: je te déclarerai juste
  rationale: Le futur actif à la première personne a Dieu pour objet. « Déclarer juste » conserve la portée déclarative ou judiciaire du verbe sans laisser entendre que le locuteur rend Dieu juste.
- source_word: ἐν εὐθύτητι καρδίας
  choice: d’un cœur droit
  rationale: Cette tournure française naturelle préserve l’image de la rectitude du cœur et exprime la manière dont le locuteur parlera de Dieu.
- source_word: κρίμασιν
  choice: jugements
  rationale: Le pluriel désigne directement les décisions ou actes judiciaires de Dieu ; « jugements » est à la fois précis et idiomatique.
- source_word: δικαιοσύνη
  choice: justice
  rationale: Dans ce contexte judiciaire, « justice » exprime la rectitude de Dieu telle qu’elle apparaît dans ses jugements, tout en laissant « droiture » comme possibilité lexicale.
theological_decisions:
- issue: Le locuteur applique δικαιόω à Dieu comme objet.
  choice: Je te déclarerai juste
  alternative: Je te justifierai ; je te donnerai raison
  rationale: La traduction retenue présente l’acte comme une reconnaissance publique de la justice divine, non comme l’action de rendre Dieu juste, tout en signalant les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. L’invocation répétée « ô Dieu » et l’image biblique du « cœur droit » sont conservées. La proposition nominale grecque est rendue par « se trouve » afin d’obtenir une phrase française naturelle sans préciser davantage la relation entre la justice de Dieu et ses jugements.
