translation:
  language: fr
  text: afin de distinguer le juste du pécheur[a] et de rendre aux pécheurs ce qui leur est dû pour toujours[b], selon leurs actes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de séparer le juste du pécheur ».
