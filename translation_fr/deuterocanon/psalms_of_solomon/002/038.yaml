lexical_decisions:
- source_word: διαστεῖλαι
  choice: distinguer
  rationale: Le verbe exprime ici l’établissement d’une distinction nette entre deux catégories morales. « Distinguer » conserve la portée judiciaire sans imposer l’image plus concrète d’une séparation physique.
- source_word: ἀνὰ μέσον
  choice: le juste du pécheur
  rationale: La locution marque la distinction entre deux parties. En français, la construction idiomatique « distinguer X de Y » rend naturellement ce rapport.
- source_word: δικαίου
  choice: le juste
  rationale: Le singulier grec a une valeur générique et représente une catégorie morale. « Le juste » est concis, traditionnel sans être archaïque, et correspond directement au terme source.
- source_word: ἁμαρτωλοῦ
  choice: le pécheur
  rationale: Le substantif singulier forme le pendant moral de « le juste ». « Le pécheur » en conserve à la fois le nombre et la valeur générique.
- source_word: ἀποδοῦναι
  choice: rétribuer
  rationale: Dans ce contexte de jugement selon les actes, le verbe désigne une rétribution correspondante. « Rétribuer » est naturel et laisse au contexte le soin d’en préciser le caractère défavorable.
- source_word: ἁμαρτωλοῖς
  choice: les pécheurs
  rationale: Le datif désigne les destinataires de la rétribution. La construction française directe avec « rétribuer » donne une formulation fluide.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans ce contexte punitif, l’expression indique vraisemblablement une durée sans fin ou durable. « Pour toujours » est clair en français moderne, tandis que la traduction littérale « pour l’âge » serait obscure.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: selon leurs actes
  rationale: « Actes » exprime clairement les actions moralement évaluées. Ce choix évite que « œuvres » soit compris dans un sens confessionnel ou technique absent du contexte immédiat.
theological_decisions:
- issue: Singuliers génériques désignant des catégories morales
  choice: « le juste » et « le pécheur »
  alternative: « l’homme juste » et « l’homme pécheur »
  rationale: Les singuliers grecs représentent ici deux catégories opposées dans un cadre de jugement. La traduction retenue préserve cette valeur générique sans ajouter le substantif masculin « homme », qui n’est pas exprimé dans le grec.
- issue: Durée exprimée par εἰς τὸν αἰῶνα
  choice: « pour toujours » dans le texte, avec une note signalant le sens littéral
  alternative: « pour l’âge » ou « durablement »
  rationale: Le contexte soutient une rétribution continue, mais la formulation grecque emploie αἰών et non un terme abstrait signifiant explicitement « éternité ». La note conserve cette tension lexicale sans rendre le texte principal obscur.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe infinitive (« afin de… ») conserve le caractère dépendant du fragment, et le point-virgule final respecte sa continuité avec le contexte. Les termes « juste », « pécheur », « rétribuer » et « actes » restent accessibles tout en maintenant la portée judiciaire du grec.
