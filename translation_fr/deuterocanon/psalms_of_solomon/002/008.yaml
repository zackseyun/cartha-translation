revisions:
- from: Car il a détourné son visage pour ne plus leur faire miséricorde[a] — jeunes et vieux[b], ainsi que leurs enfants —, tous d’un seul coup.
  to: Car il a détourné son visage de la miséricorde envers eux — jeunes et vieux, ainsi que leurs enfants —, tous à la fois.
  rationale: La révision supprime l’ajout temporel « ne plus » et conserve, dans le texte même, la construction volontairement condensée du grec. Elle maintient l’image du visage détourné, le terme théologique « miséricorde » et la portée collective de l’énumération. La note a est simplifiée afin de proposer une alternative idiomatique sans présenter comme « plus littérale » une formulation française qui reste elle-même interprétative.
