review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement l’image de « détourner son visage », la désignation collective « jeunes et vieux », ainsi que « leurs enfants ». Toutefois, « ne plus leur faire miséricorde » introduit une idée temporelle (« ne plus ») que le grec n’exprime pas. La formulation révisée rend le retrait/refus de miséricorde sans ajouter cette nuance.
  naturalness: Le français est globalement naturel et de registre biblique accessible. « Tous à la fois » est plus neutre que « tous d’un seul coup », qui peut suggérer une modalité instrumentale ou un coup unique non explicitement exprimé.
  terminology: « Miséricorde » est un bon équivalent de ἔλεος et « visage » préserve l’anthropomorphisme du texte. La note sur les singuliers collectifs est exacte et utile.
  issues:
  - severity: medium
    issue: Ajout de « ne plus »
    rationale: Le grec ἀπὸ ἐλέους αὐτῶν exprime le fait de se détourner de la miséricorde à leur égard, mais ne marque pas explicitement la cessation d’une miséricorde antérieure. « Ne plus » ajoute donc une donnée temporelle.
  - severity: low
    issue: « Tous d’un seul coup » est légèrement trop imagé
    rationale: εἰς ἅπαξ peut exprimer la simultanéité ou la totalité. « Tous à la fois » restitue cette portée sans évoquer un coup ou un moyen d’exécution.
  revised_text: Car il a détourné son visage de la miséricorde envers eux — jeunes et vieux, ainsi que leurs enfants —, tous à la fois.
