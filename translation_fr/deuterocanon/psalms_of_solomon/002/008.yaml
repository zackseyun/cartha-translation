  yaml_path: translation/deuterocanon/psalms_of_solomon/002/008.yaml
  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
translation:
  language: fr
  text: Car il a détourné son visage de la miséricorde envers eux — jeunes et vieux, ainsi que leurs enfants —, tous à la fois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: a détourné
  rationale: Avec « visage » comme complément, ce verbe exprime concrètement le fait de se détourner; cette image biblique reste naturelle en français.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: son visage
  rationale: La traduction littérale conserve l’image relationnelle du grec sans la réduire à une notion abstraite comme la présence ou la faveur.
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: pour ne plus leur faire miséricorde
  rationale: La tournure grecque est condensée. Cette formulation française rend clairement le retrait de la miséricorde tout en conservant le terme biblique « miséricorde »; une traduction plus formelle est signalée en note.
- source_word: νέον καὶ πρεσβύτην
  choice: jeunes et vieux
  rationale: Les deux noms grecs sont au singulier, mais forment une paire à valeur collective et distributive désignant les différentes générations.
- source_word: τέκνα αὐτῶν
  choice: leurs enfants
  rationale: « Enfants » rend la portée générale de τέκνα sans la limiter aux fils.
- source_word: εἰς ἅπαξ
  choice: tous d’un seul coup
  rationale: Cette expression restitue à la fois la totalité des personnes frappées et le caractère soudain ou simultané de l’événement.
theological_decisions:
- issue: 'Langage anthropomorphique: le sujet détourne son visage'
  choice: Conserver l’image concrète « a détourné son visage »
  alternative: « a retiré sa miséricorde » ou « leur a refusé sa compassion »
  rationale: Le grec présente le jugement sous une image corporelle et relationnelle. La conserver évite d’aplanir la tension théologique en une abstraction.
- issue: Rapport entre le visage détourné et la miséricorde
  choice: Comprendre la construction comme le refus de continuer à leur faire miséricorde
  alternative: Traduire formellement « a détourné son visage de la miséricorde envers eux »
  rationale: La construction ἀπὸ ἐλέους αὐτῶν est comprimée et admet une formulation plus littérale. Le texte principal privilégie un français intelligible, tandis que la note préserve la forme et l’ambiguïté de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire miséricorde » conserve la tonalité biblique sans archaïsme excessif. Les tirets structurent l’énumération et rattachent clairement « tous d’un seul coup » à l’ensemble des personnes mentionnées.
