  yaml_path: translation/deuterocanon/psalms_of_solomon/002/015.yaml
  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: fr
  text: Parce qu’elles-mêmes ont souillé ce qui était pur[a] dans la souillure d’un mélange[b]. J’ai mal au ventre et aux entrailles à cause de cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses saintes » au lieu de « ce qui était pur ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « mélange » ; ici, le terme a probablement une connotation morale ou sexuelle.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Parce que
  rationale: Introduit naturellement en français la cause de la lamentation, sans durcir la relation logique.
- source_word: αὐταὶ
  choice: elles-mêmes
  rationale: Conserve à la fois le féminin et l’insistance du pronom grec, sans ajouter un nom absent de ce verset.
- source_word: 'ἐμίαυσαν (lecture corrigée probable : ἐμίαναν)'
  choice: ont souillé
  rationale: Rend le langage de contamination morale ou rituelle; la forme transmise paraît fautive, mais le sens visé est clair dans le contexte.
- source_word: ἁγνὰ
  choice: ce qui était pur
  rationale: Le neutre pluriel grec peut désigner collectivement les réalités pures; cette formulation est naturelle en français tout en laissant en note l’alternative « les choses saintes ».
- source_word: 'ἐν ῥύμῳ (lecture corrigée probable : ἐν ῥύπῳ)'
  choice: dans l’impureté
  rationale: La forme imprimée ῥύμῳ est vraisemblablement une erreur pour ῥύπῳ, « saleté, souillure »; le contexte de souillure et la morphologie appuient cette correction.
- source_word: ἀναμίξεως
  choice: d’un mélange interdit
  rationale: Préserve l’image littérale du mélange tout en exprimant sa portée moralement réprouvée dans ce contexte, probablement sexuelle.
- source_word: τὴν κοιλίαν μου καὶ τὰ σπλάγχνα μου
  choice: Mon ventre et mes entrailles
  rationale: Maintient le parallélisme corporel et l’intensité viscérale de la douleur.
- source_word: πονῶ ἐπὶ τούτοις
  choice: me font souffrir à cause de cela
  rationale: Exprime en français naturel la douleur présente provoquée par les faits évoqués.
theological_decisions:
- issue: Portée de ἁγνά
  choice: ce qui était pur
  alternative: les choses saintes
  rationale: Le grec permet une nuance de pureté comme de sainteté; le texte principal retient le sens lexical le moins interprétatif et signale l’autre possibilité en note.
- issue: Nature de ἀνάμιξις
  choice: mélange interdit
  alternative: relations sexuelles illicites
  rationale: Le contexte suggère fortement une portée sexuelle et morale, mais la traduction conserve l’image grecque au lieu d’expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, grave et digne. L’imagerie corporelle est conservée. La traduction suit la lecture grecque corrigée ῥύπῳ (« impureté, souillure »), puisque ῥύμῳ dans la source validée paraît être une faute de transmission ou d’impression; aucune note « rue » n’est retenue, car cette analyse ne convient ni à la forme ni au contexte.
