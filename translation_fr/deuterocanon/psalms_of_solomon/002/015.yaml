  to: Parce qu’elles-mêmes ont souillé ce qui était pur[a] dans la souillure d’un mélange[b]. J’ai mal au ventre et aux entrailles à cause de cela.
  rationale: La révision rend ῥύπος par « souillure » et retire « interdit », qui surinterprète ἀναμίξεως. Elle conserve l’ambiguïté du « mélange » dans le texte et en indique la probable portée morale ou sexuelle en note. La seconde phrase adopte une expression française plus naturelle de la douleur viscérale, fidèle aux termes corporels grecs.
