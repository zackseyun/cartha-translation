  text: Her beauty was cast to the ground in disgrace[a][b][c].
translation:
  language: fr
  text: Sa beauté fut jetée à terre dans l’humiliation[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le déshonneur » ou « dans la honte ».
    reason: lexical_alternative
  - marker: b
    text: Le pronom féminin « sa » renvoie vraisemblablement, dans le contexte, à la ville personnifiée.
