lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: dans l’humiliation
  rationale: Le nom exprime la perte d’honneur, le déshonneur ou l’abaissement public. « Dans l’humiliation » est naturel en français et conserve la dimension d’avilissement sans imposer l’idée d’un sentiment intérieur de honte.
- source_word: τὸ κάλλος αὐτῆς
  choice: sa beauté
  rationale: κάλλος désigne directement la beauté, tout en pouvant évoquer ici la splendeur passée de la réalité féminine personnifiée. « Sa beauté » reste proche du grec et préserve cette latitude.
- source_word: ἀπερρίφη
  choice: fut jetée
  rationale: Le passif aoriste décrit l’action de jeter ou de précipiter. « Fut jetée » convient au registre poétique et laisse à « à terre » l’expression du mouvement vers le bas.
- source_word: ἐπὶ τὴν γῆν
  choice: à terre
  rationale: Avec l’accusatif, la préposition marque ici le mouvement vers le sol. « À terre » rend l’image de façon concise et idiomatique.
theological_decisions:
- issue: Référent du pronom féminin αὐτῆς
  choice: Conserver « sa » sans expliciter le référent dans le corps du texte.
  alternative: Remplacer le pronom par « la beauté de la ville ».
  rationale: Le grec emploie un pronom féminin dont le référent dépend du contexte, vraisemblablement la ville personnifiée. L’expliciter dans le verset supprimerait une ambiguïté grammaticale réelle.
translation_notes:
  register: Français moderne, sobre et poétique. Le passé simple passif maintient la dignité du genre psalmique; « à terre » demeure courant et concret. La formulation suit étroitement l’ordre et l’image du grec sans préciser abusivement le référent féminin.
