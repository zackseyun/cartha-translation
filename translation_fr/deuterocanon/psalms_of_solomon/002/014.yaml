  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
translation:
  language: fr
  text: Comme eux-mêmes le faisaient, ils ont fait étalage de leurs iniquités au grand jour[a] ; les filles de Jérusalem étaient profanées, conformément à ton jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant le soleil », c’est-à-dire ouvertement, aux yeux de tous.'
