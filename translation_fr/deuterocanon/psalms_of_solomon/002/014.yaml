  - marker: b
    text: 'Ou : « profanes, conformément à ton jugement » ; ou « souillées selon ton jugement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: Comme ils agissaient eux-mêmes
  rationale: La tournure conserve la comparaison introduite par καθά, l’aspect duratif de l’imparfait ἐποίουν et l’insistance du pronom αὐτοί.
- source_word: παρεδειγμάτισαν
  choice: ils ont étalé
  rationale: Le verbe évoque une mise en évidence publique. « Étalé » exprime naturellement cette exposition ouverte sans imposer l’idée plus précise de faire de quelqu’un un exemple.
- source_word: ἀδικίας αὐτῶν
  choice: leurs iniquités
  rationale: Le pluriel désigne ici des actes moralement condamnables. « Iniquités » en garde le poids religieux et moral, là où « injustices » pourrait suggérer surtout l’iniquité sociale au sens moderne.
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: au grand jour
  rationale: L’expression signifie littéralement « devant le soleil » et souligne le caractère public, manifeste, des actes. L’équivalent idiomatique français « au grand jour » transmet directement cette valeur.
- source_word: βέβηλοι
  choice: profanes
  rationale: L’adjectif désigne ce qui se trouve hors du domaine sacré ou a perdu son caractère saint. « Profanes » maintient ce contraste cultuel, tandis que « souillées » reste une possibilité contextuelle.
- source_word: κατὰ τὸ κρίμα σου
  choice: conformément à ton jugement
  rationale: Cette formulation relie leur état au jugement divin sans préciser indûment si κρίμα désigne l’acte de juger, la décision ou la sentence.
theological_decisions:
- issue: Rapport entre l’état des filles de Jérusalem et le jugement divin
  choice: étaient profanes, conformément à ton jugement
  alternative: ont été profanées par ton jugement
  rationale: Le grec présente une proposition nominale avec l’adjectif βέβηλοι et n’énonce pas explicitement une transformation passive. La traduction retenue préserve cette réserve tout en maintenant le lien avec le jugement de Dieu.
translation_notes:
  register: Français international actuel, digne et accessible. « Iniquités » conserve la gravité morale du passage ; « au grand jour » rend idiomatiquement l’image grecque, dont la forme littérale est donnée en note. Le point-virgule fait ressortir les deux propositions tout en maintenant leur lien.
