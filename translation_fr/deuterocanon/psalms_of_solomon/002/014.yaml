  - severity: medium
    issue: Sens moderne ambigu de « profanes » appliqué à des personnes
    rationale: En français actuel, « profanes » désigne surtout des personnes non initiées. « Profanées » exprime naturellement l’atteinte au statut sacré que βέβηλοι peut dénoter, tout en restant un prédicat d’état plutôt qu’une affirmation explicite de l’agent de la profanation.
