  source_fidelity: Le grec dit littéralement « comme eux-mêmes le faisaient » (καθὰ ἐποίουν αὐτοί), puis décrit l’exposition publique de « leurs iniquités » devant le soleil. βέβηλοι qualifie les filles de Jérusalem comme profanées/hors du sacré, en rapport avec le jugement divin. La révision conserve la forme descriptive de la dernière proposition, sans imposer une causalité passive explicite.
  naturalness: « Comme ils agissaient eux-mêmes » est elliptique et peu naturel en français, car le verbe « agir » appelle ici un complément que le grec laisse implicite. « Comme eux-mêmes le faisaient » rend l’ellipse grecque de façon idiomatique. Pour des personnes, « profanes » évoque couramment en français moderne des non-spécialistes ou des laïcs ; « profanées » communique plus clairement l’état cultuel visé.
  terminology: « Iniquités » convient à ἀδικίας dans ce contexte moral et religieux. « Faire étalage de » restitue bien l’idée d’exposition ostensible de παρεδειγμάτισαν, et « au grand jour » rend idiomatiquement ἀπέναντι τοῦ ἡλίου. « Profanées » est préférable ici à « profanes » pour βέβηλοι appliqué aux filles de Jérusalem ; la note conserve l’alternative plus littérale.
