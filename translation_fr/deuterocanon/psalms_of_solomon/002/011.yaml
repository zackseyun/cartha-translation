lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison ou l’explication de l’affirmation précédente et conserve naturellement la valeur causale.
- source_word: οὐκ ... πᾶς ἄνθρωπος
  choice: aucun être humain
  rationale: Dans ce contexte comparatif, la négation avec πᾶς ἄνθρωπος exprime naturellement une négation universelle. « Être humain » garde la portée générique de ἄνθρωπος en français actuel.
- source_word: ἐποίησεν
  choice: n’a fait
  rationale: Le passé composé exprime un acte accompli tout en convenant à la portée rétrospective de l’énoncé.
- source_word: ἐπ’ αὐτῆς
  choice: sur elle
  rationale: Le pronom féminin renvoie à « la terre » au verset précédent; la préposition a ici un sens spatial, non hostile.
- source_word: ὅσα ἐποίησαν
  choice: ce qu’ils ont fait
  rationale: Formulation française naturelle qui conserve la comparaison portant sur l’étendue ou la nature de leurs actes.
theological_decisions:
- issue: Portée de la négation dans οὐκ ... πᾶς ἄνθρωπος
  choice: aucun être humain
  alternative: ce n’est pas tout être humain
  rationale: La lecture retenue correspond le mieux à l’affirmation comparative dans son contexte, tout en signalant en note l’autre portée grammaticalement possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le pronom féminin imposé par l’antécédent « la terre » et évite d’interpréter ἐπ’ αὐτῆς comme « contre elle ».
