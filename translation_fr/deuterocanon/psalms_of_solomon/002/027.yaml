  text: For they did not act out of zeal[a], but out of the desire of their soul[b],
translation:
  language: fr
  text: Car ils n’ont pas agi par zèle[a], mais par le désir de leur âme[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ardeur » ; selon le contexte, le mot peut aussi signifier « jalousie ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « désir d’âme » ; on pourrait aussi comprendre « leur propre désir ».
    reason: idiom_and_lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: ils n’ont pas agi
  rationale: Le verbe signifie littéralement « faire », mais, sans complément exprimé et devant deux indications de mobile, « agir » est plus naturel en français tout en laissant l’objet de l’action implicite.
- source_word: ζήλῳ
  choice: par zèle
  rationale: « Zèle » conserve ici l’idée d’un mobile ardent, éventuellement présenté comme légitime, qui s’oppose au désir personnel. Il évite de réduire le mot au seul sens négatif de « jalousie ».
- source_word: ἐπιθυμίᾳ
  choice: par le désir
  rationale: Le terme peut désigner un désir intense ou une convoitise. « Désir » préserve l’étendue du sens sans lui donner nécessairement une connotation sexuelle.
- source_word: ψυχῆς
  choice: de leur âme
  rationale: « Âme » conserve le poids psychologique et le registre psalmique de ψυχή. Le possessif « leur » est explicité en français d’après le sujet pluriel, bien qu’il ne soit pas formellement exprimé dans le grec.
theological_decisions:
- issue: Portée de ψυχή dans l’expression ἐπιθυμίᾳ ψυχῆς
  choice: le désir de leur âme
  alternative: leur propre désir
  rationale: La formulation retenue préserve l’anthropologie et la tension de l’expression grecque, tandis que « leur propre désir » en donnerait une interprétation plus fluide mais aplatirait l’image de l’âme comme siège du désir.
translation_notes:
  register: Français moderne, sobre et digne, avec une cadence psalmique. Le parallélisme « par zèle… mais par le désir… » reproduit l’opposition des deux groupes grecs introduits par ἐν. La virgule finale est maintenue puisque la pensée se poursuit au verset suivant.
