  text: and to show mercy to the righteous from the humiliation of the sinner[c][b][a], and to repay the sinner for what he did to the righteous.
translation:
  language: fr
  text: et faire miséricorde au juste, loin de l’humiliation du pécheur[a], et rendre au pécheur selon ce qu’il a fait au juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faire miséricorde au juste en le délivrant de l’humiliation du pécheur ». Le grec est condensé et ne précise pas la relation exacte entre la miséricorde et « l’humiliation du pécheur ». « Humiliation » peut aussi se rendre par « abaissement », « affliction » ou « oppression ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: faire miséricorde
  rationale: L’infinitif aoriste désigne un acte concret de miséricorde; cette formulation reste naturelle et digne en français biblique moderne.
- source_word: δίκαιον
  choice: le juste
  rationale: L’adjectif substantivé au singulier désigne de manière générique une personne juste et forme un contraste direct avec « le pécheur ».
- source_word: ἀπὸ ταπεινώσεως ἁμαρτωλοῦ
  choice: en le délivrant de l’humiliation que lui inflige le pécheur
  rationale: La construction grecque est condensée. « En le délivrant » explicite le mouvement d’éloignement exprimé par ἀπό, tandis que la proposition relative rend naturellement le génitif susceptible de désigner l’auteur de l’humiliation.
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: le pécheur
  rationale: Le même terme personnel au singulier apparaît dans les deux membres; sa répétition conserve le parallélisme grec.
- source_word: ἀποδοῦναι
  choice: rendre
  rationale: Le verbe exprime ici une rétribution. Avec « selon ce qu’il a fait », « rendre » est idiomatique et conserve le registre solennel.
- source_word: ἀνθʼ ὧν
  choice: selon ce que
  rationale: Cette expression communique le rapport de correspondance rétributive entre les actes commis et la réponse reçue.
- source_word: ἐποίησεν δικαίῳ
  choice: il a fait au juste
  rationale: Le datif est rendu naturellement par « au juste » sans préciser davantage la nature de l’action.
theological_decisions:
- issue: Nature de la miséricorde accordée au juste
  choice: La rendre comme une délivrance hors de l’humiliation
  alternative: « faire miséricorde au juste à cause de l’humiliation du pécheur » ou « depuis l’humiliation du pécheur »
  rationale: La relation exacte entre ἐλεῆσαι et ἀπό est comprimée et quelque peu ambiguë. Le texte principal adopte le sens contextuellement probable de délivrance, tout en signalant en note une traduction plus formelle.
translation_notes:
  register: Français international moderne, au registre biblique digne mais accessible. Le parallélisme entre « le juste » et « le pécheur » ainsi que la répétition de ces désignations sont conservés.
