  source_fidelity: La seconde proposition rend fidèlement ἀποδοῦναι ... ἀνθʼ ὧν ἐποίησεν δικαίῳ. Dans la première, le grec condense la relation de ἐλεῆσαι avec ἀπὸ ταπεινώσεως ἁμαρτωλοῦ et ne formule ni explicitement un acte de délivrance ni explicitement le pécheur comme auteur de l’humiliation. Le texte proposé explicite ces deux éléments de manière interprétative.
