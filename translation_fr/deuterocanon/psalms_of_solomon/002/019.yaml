  yaml_path: translation/deuterocanon/psalms_of_solomon/002/019.yaml
  text: You made their memorial perish from the earth[a]. God is a righteous judge[d][c][b], and he will not show partiality.
translation:
  language: fr
  text: Tu as fait connaître leur souvenir depuis la terre[a]. Dieu est un juge juste, et il ne fera preuve d’aucun favoritisme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est inhabituelle : elle dit littéralement « tu as fait connaître leur souvenir depuis la terre ». Certains comprennent plutôt, d’après le contexte, que leur souvenir a été effacé de la terre, mais le verbe grec transmis signifie « faire connaître » ou « manifester ».'
    reason: textual_ambiguity
  - marker: b
    text: 'Littéralement : « il n’admirera pas un visage » ; expression indiquant qu’un juge ne favorise personne en fonction de son identité ou de son rang.'
    reason: idiom
lexical_decisions:
- source_word: ἐδήλωσας
  choice: tu as fait connaître
  rationale: Le verbe δηλόω signifie normalement « faire connaître », « révéler » ou « manifester ». Malgré l’étrangeté de la proposition dans ce contexte, la traduction conserve le sens attesté du texte grec plutôt que de lui substituer l’idée de disparition.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: leur souvenir
  rationale: μνημόσυνον peut désigner le souvenir, la mémoire ou un mémorial. « Leur souvenir » reste naturel tout en convenant à la construction inhabituelle du grec.
- source_word: ἀπὸ τῆς γῆς
  choice: depuis la terre
  rationale: La préposition ἀπό exprime ici le point de départ, « depuis » ou « de ». γῆ peut signifier « terre » ou « pays » ; « terre » préserve l’étendue générale de l’expression sans la limiter à un territoire.
- source_word: κριτὴς δίκαιος
  choice: un juge juste
  rationale: Cette traduction rend directement la fonction judiciaire et la rectitude attribuées à Dieu, dans un français courant et digne.
- source_word: οὐ θαυμάσει πρόσωπον
  choice: il ne fera pas de favoritisme
  rationale: Littéralement, l’expression évoque le fait de ne pas « admirer un visage ». Il s’agit d’un idiome judiciaire indiquant l’absence de partialité ou de favoritisme.
theological_decisions:
- issue: Sens de la première proposition, lexicalement claire mais contextuellement difficile
  choice: 'Conserver le sens ordinaire de ἐδήλωσας : « tu as fait connaître »'
  alternative: « Tu as fait disparaître leur souvenir de la terre » ou « tu as effacé leur souvenir de la terre »
  rationale: Le contexte pourrait suggérer l’effacement de la mémoire des impies, mais le grec transmis emploie explicitement un verbe signifiant « faire connaître » ou « manifester ». Sans variante manuscrite fournie, traduire par « faire disparaître » reviendrait à corriger silencieusement le texte. Une note signale donc la difficulté sans résoudre artificiellement la tension.
- issue: Portée de γῆ
  choice: la terre
  alternative: le pays
  rationale: Les deux sens sont possibles. Le contexte ne permet pas d’imposer un territoire particulier ; « la terre » maintient la portée la plus ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. La première proposition conserve volontairement l’étrangeté du texte grec transmis, avec une note explicative. L’idiome judiciaire final est rendu selon son sens naturel en français.
