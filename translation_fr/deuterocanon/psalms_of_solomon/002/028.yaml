lexical_decisions:
- source_word: ἐκχέαι
  choice: déverser
  rationale: Conserve l’image grecque d’un liquide répandu tout en exprimant naturellement le déchaînement de la colère.
- source_word: τὴν ὀργὴν αὐτῶν
  choice: leur fureur
  rationale: « Fureur » rend ici la force violente de ὀργή et s’accorde avec l’action de dépouiller.
- source_word: ἐν ἁρπάγματι
  choice: en nous dépouillant
  rationale: Cette formulation française naturelle comprend le syntagme compact comme la circonstance active dans laquelle leur fureur se déverse, sans effacer l’idée de spoliation violente.
- source_word: μὴ χρονίσῃς
  choice: ne tarde pas
  rationale: Expression française actuelle et directe de la demande pressante adressée à Dieu.
- source_word: ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: faire retomber sur leurs têtes ce qu’ils ont fait
  rationale: Rend clairement l’idiome rétributif grec et en conserve l’image corporelle; le complément implicite de ἀποδοῦναι est explicité en français.
theological_decisions:
- issue: Idiome de la rétribution
  choice: faire retomber sur leurs têtes ce qu’ils ont fait
  alternative: leur rendre sur leurs têtes
  rationale: Le grec prie Dieu de retourner aux agresseurs la conséquence de leurs actes. La traduction choisie rend l’idiome intelligible sans atténuer la demande de jugement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’invocation « ô Dieu » et l’image des actes retombant sur les têtes maintiennent la dignité poétique et la vigueur judiciaire du texte.
