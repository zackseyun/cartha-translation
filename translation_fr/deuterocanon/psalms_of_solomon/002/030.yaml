  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: fr
  text: 'Et je n’attendis pas longtemps avant que Dieu me montre son arrogance : il était transpercé sur les montagnes d’Égypte, rendu plus méprisable que le plus insignifiant sur terre et sur mer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rendu plus méprisable que le plus insignifiant sur terre et sur mer ». La comparaison grecque est elliptique; elle exprime un abaissement extrême.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: je n’attendis pas longtemps
  rationale: Dans le contexte, la tournure indique naturellement que le locuteur n’eut pas longtemps à attendre avant de voir la réponse de Dieu, plutôt qu’un retard volontaire de sa part.
- source_word: τὴν ὕβριν αὐτοῦ
  choice: son arrogance
  rationale: ὕβρις désigne un orgueil démesuré qui se manifeste par l’insolence ou l’outrage. « Arrogance » est clair, actuel et conserve la force morale du terme.
- source_word: ἐκκενεκεντημένον
  choice: transpercé
  rationale: Le participe masculin singulier renvoie à l’homme dont Dieu dévoile l’arrogance, et non à l’arrogance elle-même. « Transpercé » conserve l’image concrète sans préciser l’arme.
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: sur les montagnes d’Égypte
  rationale: Traduction directe qui préserve l’expression géographique surprenante du grec au lieu de la lisser.
- source_word: ὑπὲρ ἐλάχιστον
  choice: plus méprisable que le plus insignifiant
  rationale: La comparaison grecque est elliptique. Cette formulation conserve son caractère superlatif sans ajouter explicitement « personne », absent du texte.
- source_word: ἐξουδενωμένον
  choice: rendu plus méprisable
  rationale: Le participe exprime le fait d’être réduit à rien ou couvert de mépris; « rendu » maintient l’état résultant et la construction comparative.
- source_word: ἐπὶ γῆς καὶ θαλάσσης
  choice: sur terre et sur mer
  rationale: Formule française naturelle et proche du grec, qui conserve l’étendue totale de l’humiliation.
theological_decisions:
- issue: Référent des participes masculins ἐκκενεκεντημένον et ἐξουδενωμένον
  choice: Les rattacher implicitement à l’homme porteur de l’arrogance, avec un deux-points
  alternative: Les rattacher grammaticalement à « son arrogance »
  rationale: Les participes sont au masculin accusatif singulier, tandis que ὕβριν est féminin. Le deux-points conserve la compression du grec tout en empêchant un rattachement grammatical erroné.
translation_notes:
  register: Français international moderne, digne et poétique. Le passé simple convient au registre psalmique. La syntaxe participiale et le deux-points préservent la densité du grec tout en clarifiant le référent masculin.
