lexical_decisions:
- source_word: σῶμα
  choice: corps
  rationale: Terme français ordinaire et concret correspondant au grec, sans expliciter davantage que le texte qu’il s’agit d’un cadavre.
- source_word: διαφερόμενον
  choice: emporté
  rationale: Le participe passif évoque un corps entraîné par une force extérieure et ballotté par les vagues ; « emporté » restitue ce mouvement avec naturel et concision.
- source_word: ἐπὶ κυμάτων
  choice: sur les vagues
  rationale: Rend directement et idiomatiquement la position et le mouvement du corps à la surface des vagues.
- source_word: ἐν ὕβρει πολλῇ
  choice: dans un grand déshonneur
  rationale: ὕβρις peut évoquer l’outrage, l’affront ou le traitement humiliant. Ici, « déshonneur » exprime l’indignité infligée au corps sans réduire le mot à une simple émotion.
- source_word: οὐκ ἦν ὁ θάπτων
  choice: personne n’était là pour l’ensevelir
  rationale: Formulation française naturelle qui exprime l’absence de quiconque pour accomplir les rites funéraires, tout en conservant le pathétique du grec.
