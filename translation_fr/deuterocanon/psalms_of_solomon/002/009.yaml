  text: For they did evil once for all[c][b][a], not listening.
translation:
  language: fr
  text: Car ils ont fait le mal tous ensemble[a], sans écouter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fois pour toutes »; l’expression peut aussi signifier plus largement « complètement ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour ne pas entendre »; on peut aussi comprendre « afin de ne pas écouter » ou « refusant d’écouter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρά
  choice: le mal
  rationale: Cette expression conserve la portée morale générale et la concision du grec, sans préciser indûment la nature des actes commis.
- source_word: ἐποίησαν
  choice: ont fait
  rationale: Le verbe courant ποιέω garde ici son sens simple et forme en français l’expression naturelle « faire le mal ».
- source_word: εἰς ἅπαξ
  choice: tous ensemble
  rationale: Dans le contexte immédiat, notamment après l’énumération du verset précédent, l’expression peut souligner l’action collective. Une note maintient toutefois ses autres sens possibles, liés à l’unicité ou à l’achèvement.
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: sans écouter
  rationale: Cette formulation française concise rend la non-écoute exprimée par l’infinitif négatif sans imposer avec certitude une nuance de refus volontaire; la valeur finale possible est signalée en note.
theological_decisions:
- issue: Portée de εἰς ἅπαξ
  choice: tous ensemble
  alternative: une fois pour toutes; complètement
  rationale: Le grec permet plusieurs nuances. Le contexte proche favorise ici une action commune, mais le texte français ne doit pas effacer les lectures possibles de finalité ou de totalité, conservées en note.
- issue: Valeur de τοῦ μὴ ἀκοῦσαι
  choice: sans écouter
  alternative: afin de ne pas écouter; refusant d’écouter
  rationale: La construction peut exprimer le but, le résultat ou une attitude associée. « Sans écouter » préserve cette relative indétermination et évite d’ajouter explicitement une intention que la syntaxe ne tranche pas seule.
translation_notes:
  register: Français moderne, sobre et digne. La phrase reste brève comme le grec. « Écouter » est retenu plutôt qu’« entendre » parce que le contexte moral suggère l’attention ou l’obéissance, tout en signalant le sens littéral dans la note.
