  source_fidelity: 'Le projet rend fidèlement les éléments essentiels : « fils et filles », la captivité qualifiée de πονηρά comme cruelle, le singulier distributif « leur cou », ainsi que le cadre « parmi les nations ». Il a raison de ne pas identifier avec certitude le sceau ou la marque à un marquage au fer. Cependant, la juxtaposition française actuelle « leur cou portait un sceau, une marque parmi les nations » laisse grammaticalement incertain le lien entre « une marque » et « parmi les nations » et affaiblit la fonction probablement descriptive de ἐν ἐπισήμῳ.'
