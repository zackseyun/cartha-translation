  yaml_path: translation/deuterocanon/psalms_of_solomon/002/006.yaml
  text: Sons and daughters were in evil captivity[a], their necks in a seal[b], with a mark among the nations.
translation:
  language: fr
  text: Fils et filles étaient dans une cruelle captivité ; leur cou portait un sceau[a], une marque qui les signalait parmi les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « leur cou dans un sceau ». L’image grecque est condensée et peut évoquer un sceau ou une empreinte apposés aux captifs.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi signifier qu’ils étaient reconnaissables, signalés ou rendus manifestes parmi les nations ; il peut s’agir d’une marque publique d’asservissement ou d’humiliation.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: Fils et filles
  rationale: La traduction directe conserve l’expression grecque explicitement genrée, sans la généraliser en « enfants ».
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: dans une cruelle captivité
  rationale: Dans ce contexte, πονηρᾷ caractérise la captivité comme pénible, funeste ou cruelle, plutôt que comme moralement mauvaise. « Cruelle captivité » exprime naturellement sa dureté.
- source_word: ἐν σφραγῖδι
  choice: portait un sceau
  rationale: σφραγίς désigne un sceau, une empreinte ou une marque. Le grec est très condensé ; cette formulation française rend explicite le rapport entre le cou et le sceau sans préciser indûment la manière dont celui-ci était apposé.
- source_word: ὁ τράχηλος αὐτῶν
  choice: leur cou
  rationale: Le singulier distributif français correspond au singulier collectif grec et désigne le cou de chacun des captifs.
- source_word: ἐν ἐπισήμῳ
  choice: une marque
  rationale: ἐπίσημος peut évoquer ce qui est marqué, reconnaissable ou rendu manifeste. « Une marque » préserve cette largeur sémantique mieux que « une flétrissure » ou « une marque au fer ».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Cette traduction transparente conserve la portée générale de ἔθνη sans imposer ici le sens confessionnel de « païens ».
theological_decisions:
- issue: Nature du sceau et de la marque imposés aux captifs
  choice: Ne pas identifier précisément le sceau à une marque d’esclavage
  alternative: Traduire explicitement par « marqués au fer comme des esclaves »
  rationale: Le contexte peut suggérer une marque publique d’asservissement ou d’humiliation, mais le grec ne précise ni le procédé ni le statut juridique. La traduction conserve donc cette tension et l’explique en note.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation et le verbe « portait » rendent intelligible la formulation nominale et très condensée du grec, tandis que les notes maintiennent l’incertitude propre aux images du sceau et de la marque.
