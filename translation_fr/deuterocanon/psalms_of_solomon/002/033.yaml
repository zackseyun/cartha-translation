  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: fr
  text: 'Il a dit : « Je serai le maître de la terre et de la mer. » Et il n’a pas reconnu que Dieu est grand, puissant par sa grande force.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « puissant dans sa grande puissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: maître
  rationale: Dans cette vantardise humaine, κύριος exprime la domination plutôt qu’un titre divin. « Maître » est naturel en français et évite de confondre le locuteur avec le Seigneur.
- source_word: γῆς
  choice: terre
  rationale: Dans l’expression coordonnée « terre et mer », « terre » rend naturellement γῆ et conserve l’ambiguïté entre le sol ferme et le domaine terrestre.
- source_word: οὐκ ἔγνω
  choice: n’a pas reconnu
  rationale: Dans ce contraste ironique, γινώσκω désigne vraisemblablement une absence de reconnaissance de la réalité divine, et pas seulement un manque d’information.
- source_word: κραταιὸς
  choice: puissant
  rationale: « Puissant » restitue le registre élevé de κραταιός et s’accorde naturellement avec la mention de la force divine.
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: dans sa grande force
  rationale: Cette formulation suit de près la construction grecque et préserve l’insistance sur la force propre de Dieu, malgré une légère redondance intentionnelle.
theological_decisions:
- issue: Faut-il comprendre ὁ θεὸς comme un titre ou comme une affirmation simple au sujet de Dieu ?
  choice: que Dieu est grand, puissant dans sa grande force
  alternative: que Dieu est le Grand et le Puissant
  rationale: Le grec oppose directement la prétention du locuteur à la grandeur et à la puissance de Dieu, sans imposer une lecture titularisée.
- issue: Rapport syntaxique entre μέγας et κραταιὸς
  choice: 'deux qualificatifs coordonnés : « grand, puissant »'
  alternative: « grand et puissant »
  rationale: L’absence de conjonction en grec permet une juxtaposition emphatique, conservée en français pour refléter le rythme de la source.
translation_notes:
  register: Français international moderne, digne et lisible. « Maître » marque clairement la prétention humaine à la domination; la juxtaposition « grand, puissant » et la répétition autour de la force conservent l’intensité du grec.
