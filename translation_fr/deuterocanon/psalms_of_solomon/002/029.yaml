  text: to bring down the arrogance of the dragon in dishonor[a][b][c].
translation:
  language: fr
  text: pour vouer l’arrogance du dragon au déshonneur[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « pour placer l’arrogance du dragon dans le déshonneur ».'
    reason: lexical_alternative
  - marker: b
    text: Le « dragon » représente probablement, dans ce contexte, un souverain ou une puissance hostile ; l’image grecque est toutefois conservée dans le texte.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ ἐπιθεῖναι
  choice: pour abaisser
  rationale: L’infinitif articulaire poursuit la demande du contexte. « Abaisser » rend naturellement ici l’action exercée contre l’arrogance, sans transformer explicitement celle-ci en déshonneur.
- source_word: τὴν ὑπερηφανίαν
  choice: l’arrogance
  rationale: Le nom désigne une élévation orgueilleuse et condamnable. « Arrogance » en exprime clairement la force négative en français moderne.
- source_word: τοῦ δράκοντος
  choice: du dragon
  rationale: La métaphore grecque est conservée afin de préserver l’image vive du texte sans identifier prématurément son référent.
- source_word: ἐν ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: La formule exprime l’ignominie ou la perte d’honneur. « Dans le déshonneur » conserve la construction et sa portée publique plus précisément qu’une simple formule avec « honte ».
theological_decisions:
- issue: Identité du « dragon »
  choice: Conserver « le dragon » dans le texte principal.
  alternative: Identifier explicitement le dragon à un souverain ou à une puissance hostile de l’histoire.
  rationale: Le verset emploie une image sans nommer ici son référent. La conserver respecte l’ambiguïté du grec et évite d’imposer une interprétation historique dans le texte.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde l’image du dragon et la notion précise de déshonneur, tout en donnant à la construction grecque une tournure française naturelle.
