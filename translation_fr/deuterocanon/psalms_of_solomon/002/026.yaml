translation:
  language: fr
  text: Et ils seront menés à leur fin[a], si ce n’est toi, Seigneur, qui les réprimandes dans ta colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « seront achevés », « seront détruits ». Le grec exprime littéralement qu’ils « seront menés à leur terme » (συντελεσθήσονται).'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas le sujet de « ils seront menés à leur fin ». Dans le contexte, il peut s’agir d’Israël, tandis que « les » désignerait ses adversaires; la formulation grecque laisse toutefois les référents implicites.
    reason: referential_ambiguity
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui poursuit l’argument de la prière sans ajouter de nuance temporelle.
- source_word: συντελεσθήσονται
  choice: ils seront anéantis
  rationale: Le futur passif de συντελέω exprime ici le fait d’être mené à sa fin. Dans ce contexte hostile, « seront anéantis » rend naturellement la portée funeste, tandis qu’une note conserve le sens plus littéral et moins déterminé.
- source_word: ἐὰν μὴ
  choice: à moins que
  rationale: Rend naturellement la condition exceptive introduite par ἐὰν μή.
- source_word: σύ, Κύριε
  choice: toi, Seigneur
  rationale: Le pronom exprimé σύ met l’interlocuteur en relief; « toi, Seigneur » en conserve l’insistance dans l’adresse directe.
- source_word: ἐπιτιμήσεις
  choice: tu ne les réprimandes
  rationale: ἐπιτιμάω désigne une réprimande ferme et autoritaire. Le ne explétif est requis en français soigné après « à moins que » et ne constitue pas une négation indépendante.
- source_word: ἐν ὀργῇ σου
  choice: dans ta colère
  rationale: « Colère » est le terme français moderne et digne qui rend directement ὀργή, avec sa gravité judiciaire dans ce contexte.
theological_decisions:
- issue: Référents du sujet implicite de συντελεσθήσονται et de αὐτοῖς
  choice: Conserver les pronoms « ils » et « les » dans le texte, avec une note explicative
  alternative: Nommer Israël comme sujet et ses adversaires comme objet
  rationale: Le grec ne nomme pas le sujet de συντελεσθήσονται. Le contexte peut inviter à distinguer ceux qui seront anéantis de ceux que le Seigneur réprimandera, mais inscrire explicitement « Israël » dans le texte lèverait une ambiguïté réelle de la formulation grecque.
translation_notes:
  register: Français international moderne, naturel et digne. L’insistance de σύ est conservée par « toi, Seigneur ». « Colère » est préféré à « courroux », plus archaïque. Les marqueurs [a] et [b] figurent dans le texte.
