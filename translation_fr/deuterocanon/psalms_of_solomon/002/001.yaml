  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: fr
  text: Quand le pécheur s’enorgueillissait, il abattait des murailles fortifiées avec des béliers[a], et tu ne l’en as pas empêché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec signifie littéralement « béliers » et peut désigner les animaux ; ici, le contexte des murailles indique des machines de siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: Quand … s’enorgueillissait
  rationale: La construction ἐν τῷ suivie de l’infinitif a ici une valeur temporelle. « S’enorgueillissait » exprime naturellement l’idée d’élévation orgueilleuse et l’imparfait convient à l’action en cours.
- source_word: τὸν ἁμαρτωλόν
  choice: le pécheur
  rationale: Le singulier et la désignation morale du grec sont conservés sans remplacer le terme par une qualification plus interprétative.
- source_word: ἐν κριοῖς
  choice: à coups de béliers
  rationale: Dans le contexte de murailles abattues, κριοί désigne très probablement des machines de siège. La tournure française indique clairement leur fonction instrumentale.
- source_word: κατέβαλλε
  choice: il abattait
  rationale: L’imparfait français rend l’aspect duratif de l’imparfait grec et « abattre » convient idiomatiquement à la destruction de murailles.
- source_word: τείχη ὀχυρά
  choice: des murailles fortifiées
  rationale: « Murailles » correspond au contexte urbain ou militaire, tandis que « fortifiées » restitue la force défensive exprimée par ὀχυρά.
- source_word: οὐκ ἐκώλυας
  choice: tu ne l’en empêchais pas
  rationale: Le complément sous-entendu est explicité de façon naturelle en français. L’imparfait maintient la perspective passée du verset.
