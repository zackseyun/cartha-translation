  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: fr
  text: Car les nations ont insulté Jérusalem tandis qu’elle était piétinée[a] ; elles ont fait tomber sa splendeur du trône de gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme grecque transmise, συνείδισαν, est difficile. Autre traduction possible : « Car les nations ont vu Jérusalem piétinée » ; certains comprennent plutôt le texte comme une allusion aux insultes lancées contre elle au moment où elle était foulée aux pieds.'
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: Ou « d’un trône glorieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: ont insulté
  rationale: Dans ce contexte d’humiliation publique, « ont insulté » exprime naturellement l’idée de raillerie ou d’outrage associée à la forme grecque transmise, sans employer le plus faible « ont fait des reproches ».
- source_word: ἐν καταπατήσει
  choice: tandis qu’elle était piétinée
  rationale: La tournure rend idiomatiquement le nom grec καταπάτησις tout en conservant l’image concrète de Jérusalem foulée aux pieds.
- source_word: κατέσπασεν
  choice: ont fait descendre
  rationale: Le verbe indique un mouvement énergique vers le bas. Le sujet neutre pluriel ἔθνη peut commander un verbe grec au singulier ; en français, la reprise se fait normalement au pluriel par « elles ».
- source_word: τὸ κάλλος αὐτῆς
  choice: sa splendeur
  rationale: κάλλος peut désigner la beauté, mais « splendeur » convient mieux ici à la dignité visible de Jérusalem et au contexte du trône de gloire.
- source_word: ἀπὸ θρόνου δόξης
  choice: du trône de gloire
  rationale: Cette traduction conserve la construction au génitif et l’image élevée du texte grec, tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. « Piétinée » maintient l’image violente du texte ; « trône de gloire » préserve volontairement l’ambiguïté du génitif grec.
