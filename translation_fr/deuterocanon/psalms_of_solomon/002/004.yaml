  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: fr
  text: 'À cause de tout cela, il a dit : « Rejetez-les loin de moi. »[a] La beauté de sa[b] gloire ne leur a été d’aucun profit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ancien ne comporte pas de guillemets. On peut aussi comprendre que les mots qui suivent font encore partie de la déclaration.
    reason: syntactic_ambiguity
  - marker: b
    text: 'Le pronom grec peut signifier « de lui » ou « de cela ». Un manuscrit porte une forme féminine : « d’elle ».'
    reason: textual_variant
  - marker: c
    text: 'Ou : « ne les a pas fait prospérer » ; le verbe peut exprimer le fait de faire prospérer ou de procurer un avantage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: À cause de tout cela
  rationale: Cette formulation française naturelle conserve le renvoi explicite aux faits qui précèdent, sans préciser davantage leur nature.
- source_word: εἶπεν
  choice: il a dit
  rationale: Le grec emploie le verbe courant pour dire; la traduction ne nomme pas le locuteur, même si le contexte permet de l’identifier.
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ’ ἐμοῦ
  choice: Rejetez-les loin de moi
  rationale: « Rejetez » exprime à la fois l’action vive de jeter au loin et l’idée de répudiation portée par ἀπορρίπτω; « loin de moi » conserve la force spatiale de μακράν.
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: La beauté de sa gloire
  rationale: La construction nominale grecque est conservée afin de ne pas réduire δόξα à un simple adjectif. En français, « sa » laisse naturellement ouvert le référent du possessif.
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: ne leur a été d’aucun profit
  rationale: Dans ce contexte, εὐοδόω indique que cette beauté ne leur a procuré ni avantage ni réussite; cette formulation est claire et idiomatique sans effacer la nuance de prospérité, signalée en note.
theological_decisions:
- issue: Étendue des paroles rapportées
  choice: La citation s’achève après « loin de moi »
  alternative: Inclure aussi « La beauté de sa gloire… » dans la citation
  rationale: Le passage de la première personne (« moi ») à la troisième personne (« sa ») favorise une reprise de la narration par le psalmiste, mais le grec ancien ne fournit pas de guillemets; l’autre lecture demeure donc signalée.
- issue: Référent de αὐτοῦ
  choice: Employer « sa » sans expliciter le référent
  alternative: Traduire explicitement « la gloire de celui-ci » ou rattacher le possessif au sanctuaire/autel du contexte
  rationale: Le pronom grec est au masculin ou au neutre génitif singulier et son antécédent n’est pas entièrement certain. Le français permet de conserver cette ambiguïté sans imposer une identification théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme reste sobre; « Rejetez » convient au registre du commandement sans archaïsme, tandis que les notes conservent les ambiguïtés syntaxique, référentielle et lexicale du grec.
