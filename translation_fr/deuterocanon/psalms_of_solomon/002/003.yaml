  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: fr
  text: parce que les fils de Jérusalem[a] ont souillé les choses saintes du Seigneur ; ils ont profané les offrandes faites à Dieu[b] par leurs actes contraires à la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants de Jérusalem ». Le grec dit littéralement « les fils ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les dons de Dieu ». Dans ce contexte, il s’agit probablement des offrandes consacrées à Dieu.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: parce que
  rationale: Dans le contexte, la locution introduit la cause du jugement évoqué ; « parce que » en exprime naturellement la valeur causale.
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: les fils de Jérusalem
  rationale: Le grec porte explicitement le masculin pluriel « fils ». Cette formulation imagée est conservée, avec une variante plus inclusive en note.
- source_word: ἐμίαναν
  choice: ont souillé
  rationale: Le verbe exprime ici la contamination cultuelle de réalités sacrées ; « souiller » en garde la force dans un français actuel et digne.
- source_word: τὰ ἅγια Κυρίου
  choice: les choses saintes du Seigneur
  rationale: Le neutre pluriel désigne largement ce qui est saint ou consacré au Seigneur, sans imposer le sens plus étroit de « sanctuaire ».
- source_word: ἐβεβήλωσαν
  choice: ont profané
  rationale: Le verbe signifie traiter comme profane ou commun ce qui est sacré ; « profaner » restitue précisément cette opposition cultuelle.
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: les offrandes faites à Dieu
  rationale: Dans ce contexte cultuel, δῶρα désigne vraisemblablement des dons présentés à Dieu. Cette formulation évite que « dons de Dieu » soit compris comme des dons venant de Dieu, tout en signalant l'interprétation du génitif.
- source_word: ἐν ἀνομίαις
  choice: par leurs actes contraires à la Loi
  rationale: Le pluriel ἀνομίαις renvoie à des transgressions concrètes ; « par » rend la valeur instrumentale probable de ἐν, et la majuscule à « Loi » explicite ici la référence à la loi divine.
theological_decisions:
- issue: Sens du génitif dans τὰ δῶρα τοῦ θεοῦ
  choice: les offrandes faites à Dieu
  alternative: les dons de Dieu
  rationale: Le contexte du temple favorise des dons consacrés ou présentés à Dieu, mais la construction grecque permet formellement la traduction plus littérale donnée en note.
- issue: Portée de ἀνομίαις
  choice: actes contraires à la Loi
  alternative: iniquités
  rationale: Le choix conserve le rapport étymologique à la loi et le pluriel concret, sans réduire le terme à une notion morale vague.
translation_notes:
  register: Français moderne international, sobre et liturgiquement digne. Le parallélisme des deux propositions et le vocabulaire cultuel sont conservés ; le point-virgule reflète leur étroite coordination.
