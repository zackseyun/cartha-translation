  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: fr
  text: 'Et maintenant, voyez, grands de la terre[a], le jugement du Seigneur : il est un roi grand et juste, lui qui juge ce qui est sous le ciel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les notables », « les hauts dignitaires » ou « les dirigeants de la terre ».
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « jugeant le [domaine] sous le ciel » ; on pourrait aussi comprendre « jugeant la terre sous le ciel » ou « le monde sous le ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: voyez
  rationale: L’impératif appelle directement les puissants à constater le jugement divin. « Voyez » est naturel et conserve cette force sans archaïsme.
- source_word: μεγιστᾶνες
  choice: les grands de la terre
  rationale: Le terme désigne les personnages de haut rang ou détenteurs de pouvoir. « Les grands » convient au registre élevé et reste plus large que « nobles ».
- source_word: κρίμα
  choice: jugement
  rationale: Le mot peut désigner l’acte judiciaire ou la sentence du Seigneur. « Jugement » conserve cette amplitude.
- source_word: κυρίου
  choice: du Seigneur
  rationale: « Seigneur » rend naturellement le titre divin κύριος au génitif.
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: un roi grand et juste
  rationale: Cette formulation rattache naturellement les deux adjectifs à « roi » et préserve à la fois la grandeur royale et la justice morale.
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: lui qui juge ce qui est sous le ciel
  rationale: Le grec est elliptique et ne nomme pas explicitement le domaine jugé. « Ce qui est sous le ciel » préserve cette indétermination sans ajouter « tout », absent du texte.
theological_decisions:
- issue: Rapport de la proposition introduite par ὅτι avec « le jugement du Seigneur »
  choice: 'le jugement du Seigneur : il est un roi grand et juste'
  alternative: le jugement du Seigneur, car il est un roi grand et juste
  rationale: Les deux valeurs, explicative ou déclarative, sont possibles dans le contexte. Les deux-points conservent un lien ouvert entre le jugement manifesté et l’identité du Seigneur comme roi juste, sans imposer artificiellement une seule nuance de ὅτι.
- issue: Référent du participe κρίνων
  choice: lui qui juge
  alternative: jugeant
  rationale: La tournure détachée rattache clairement l’activité judiciaire au Seigneur-roi tout en conservant la valeur participiale descriptive.
translation_notes:
  register: Français international actuel, digne et accessible. L’adresse directe est maintenue, et l’ellipse grecque finale n’est pas comblée par un universel absent du texte.
