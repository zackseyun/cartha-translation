base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/007.yaml
  text: He dealt with them according to their sins[b][a], because he abandoned them into the hands of those who prevailed over them.
translation:
  language: fr
  text: Il les a traités selon leurs péchés, car[a] il les abandonnait aux mains de ceux qui l’emportaient sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il » ; autre possibilité : « en ce qu’il ».'
    reason: Le lien exprimé par ὅτι peut être causal ou explicatif, l’abandon constituant alors la manifestation du jugement.
  - marker: b
    text: 'Ou : « de ceux qui prenaient le dessus sur eux » ; ou : « de ceux qui étaient plus forts qu’eux ».'
    reason: Le participe κατισχυόντων peut désigner soit l’action de prévaloir, soit la supériorité effective de ceux qui dominaient.
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: selon leurs péchés
  rationale: 'La préposition κατὰ exprime ici la correspondance ou la mesure : le traitement subi correspond à leurs péchés. Cette formulation conserve la portée judiciaire sans l’expliciter davantage.'
- source_word: ἐποίησεν αὐτοῖς
  choice: il les a traités
  rationale: Le grec dit littéralement « il leur a fait », tournure peu naturelle en français dans ce contexte. « Il les a traités » exprime idiomatiquement l’action exercée envers eux.
- source_word: ἐγκατέλειπεν
  choice: il les avait abandonnés
  rationale: Le verbe indique qu’ils ont été délaissés et laissés sans protection. Le plus-que-parfait français présente naturellement cette action comme l’arrière-plan explicatif de l’action principale à l’aoriste.
- source_word: εἰς χεῖρας
  choice: aux mains de
  rationale: Cette expression conserve l’image biblique de personnes placées sous le pouvoir d’autres personnes.
- source_word: κατισχυόντων
  choice: ceux qui prenaient le dessus sur eux
  rationale: Le participe présent décrit une supériorité qui s’exerce effectivement. « Prendre le dessus » rend cette dynamique sans réduire le terme à une simple qualité statique.
theological_decisions:
- issue: Rapport logique introduit par ὅτι
  choice: car
  alternative: parce que ; en ce qu’il
  rationale: Dans ce contexte, ὅτι peut présenter l’abandon comme l’explication, la manifestation ou la manière dont le traitement correspondant aux péchés s’est réalisé. « Car » maintient cette souplesse mieux qu’une causalité strictement définie.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’image des « mains » et évite aussi bien l’archaïsme que l’ajout d’un vocabulaire théologique absent du grec.
