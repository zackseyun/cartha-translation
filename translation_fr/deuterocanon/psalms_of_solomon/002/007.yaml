  source_fidelity: 'La structure et le sens sont globalement fidèles : κατὰ τὰς ἁμαρτίας αὐτῶν est bien rendu par « selon leurs péchés », εἰς χεῖρας par « aux mains de », et κατισχυόντων garde une valeur active. Toutefois, le plus-que-parfait « il les avait abandonnés » introduit une antériorité accomplie que l’imparfait grec ἐγκατέλειπεν n’exprime pas. Un imparfait français rend mieux l’aspect en cours ou descriptif du verbe grec.'
