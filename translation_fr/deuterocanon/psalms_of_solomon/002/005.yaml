lexical_decisions:
- source_word: ἐξουδενώθη
  choice: fut tenu pour rien
  rationale: Le passif exprime le fait d’être regardé comme ne comptant pour rien, donc méprisé. Cette formulation conserve cette image avec un sujet grammatical non genré.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Rend directement l’idée de présence ou de regard divin, dans un français naturel et digne.
- source_word: ἠτιμώθη
  choice: fut déshonoré
  rationale: Le verbe désigne la privation d’honneur ou l’exposition au déshonneur et maintient le parallélisme avec le premier membre.
- source_word: ἕως εἰς τέλος
  choice: jusqu’à la fin
  rationale: Traduction formellement proche qui préserve l’ambiguïté entre durée jusqu’au terme et intensité complète, sans imposer « entièrement » dans le texte.
theological_decisions:
- issue: Sujet non exprimé des deux verbes au singulier
  choice: Sujet grammatical masculin neutre sur le plan référentiel (« Il »), sans identifier explicitement l’antécédent dans ce verset isolé
  alternative: Employer « cela » ou expliciter « le sanctuaire/l’autel »
  rationale: Le grec omet le sujet. Le contexte antérieur peut renvoyer à un nom masculin tel que l’autel, mais ce seul verset ne le nomme pas ; la traduction évite donc de transformer l’antécédent implicite en personne humaine tout en conservant l’anaphore française.
translation_notes:
  register: Français international moderne, sobre et littéraire. Le passé simple convient au registre poétique. Les deux passifs et le parallélisme du grec sont conservés ; les notes signalent les principales possibilités lexicales et l’ambiguïté de l’expression finale.
