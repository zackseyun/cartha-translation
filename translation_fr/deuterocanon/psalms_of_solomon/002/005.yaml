translation:
  language: fr
  text: Cela fut tenu pour rien devant Dieu[a] ; cela fut déshonoré jusqu’à la fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela fut méprisé aux yeux de Dieu. »'
