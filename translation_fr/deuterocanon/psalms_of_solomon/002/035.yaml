  yaml_path: translation/deuterocanon/psalms_of_solomon/002/035.yaml
  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: fr
  text: celui qui m’élève à la gloire et mène les orgueilleux à une destruction éternelle[a], dans le déshonneur, parce qu’ils ne l’ont pas connu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une destruction pour toujours »; plus littéralement, « une destruction d’un âge » (ou « du siècle »).
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne l’ont pas reconnu » ou « ils n’ont pas reconnu son autorité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιστῶν
  choice: relève
  rationale: Le verbe exprime le fait de faire lever ou de relever. « Relève » conserve cette image sans réduire le sens à une exaltation purement honorifique.
- source_word: εἰς δόξαν
  choice: pour la gloire
  rationale: εἰς indique ici le but ou le résultat. « Pour la gloire » est naturel en français et maintient cette ouverture sémantique.
- source_word: κομίζων
  choice: conduit
  rationale: Le texte grec fourni et validé porte κομίζων, « amenant, conduisant », et non κοιμίζων, « endormant ». « Conduit » convient à la construction avec εἰς et évite de corriger conjecturalement la source.
- source_word: ὑπερηφάνους
  choice: les orgueilleux
  rationale: Le substantif adjectival désigne ceux qui se caractérisent par l’orgueil ou l’arrogance. « Les orgueilleux » est idiomatique et non genré en français.
- source_word: ἀπωλίαν αἰῶνος
  choice: une perdition éternelle
  rationale: Le génitif αἰῶνος peut conférer à la perdition une durée indéfinie ou éternelle. La formulation littérale « perdition de l’âge » demeure signalée en note afin de préserver l’ambiguïté.
- source_word: ἐν ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: Cette formulation rend directement l’idée d’indignité, d’opprobre ou de perte d’honneur portée par ἀτιμία.
- source_word: ἔγνωσαν
  choice: n’ont pas connu
  rationale: « Connaître » garde la portée large du verbe, qui peut aussi impliquer reconnaître ou admettre l’identité ou l’autorité de quelqu’un.
theological_decisions:
- issue: Durée ou nature de la perdition dans ἀπωλίαν αἰῶνος
  choice: une perdition éternelle
  alternative: une perdition de l’âge
  rationale: Le contexte permet une valeur durable ou éternelle, mais le génitif grec reste formellement susceptible d’une lecture liée à « l’âge »; la note conserve cette tension sans imposer une précision doctrinale.
- issue: Portée de οὐκ ἔγνωσαν αὐτόν
  choice: ils ne l’ont pas connu
  alternative: ils ne l’ont pas reconnu / admis
  rationale: La traduction principale ne décide pas si le défaut est intellectuel, relationnel ou moral; les nuances possibles sont indiquées en note.
translation_notes:
  register: Fragment poétique au registre digne et actuel. « Relève » et « conduit » préservent le mouvement des deux participes grecs. La syntaxe reste proche de l’original tout en étant immédiatement compréhensible en français international.
