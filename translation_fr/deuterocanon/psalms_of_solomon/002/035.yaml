    issue: « relève pour la gloire » pour ἀνιστῶν ἐμέ εἰς δόξαν
    rationale: « Relever » peut suggérer surtout un rétablissement après une chute, et « pour la gloire » exprime plus spontanément un but. « M’élève à la gloire » rend plus naturellement le mouvement ascendant et le terme de εἰς.
  - severity: low
    issue: « perdition éternelle » pour ἀπωλίαν αἰῶνος
    rationale: « Perdition » est possible, mais en français il peut évoquer plus spécifiquement la damnation. « Destruction » correspond plus directement à ἀπώλεια sans introduire cette coloration.
  - severity: low
