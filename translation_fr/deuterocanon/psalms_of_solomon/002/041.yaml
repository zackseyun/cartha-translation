  text: Le Seigneur est béni pour toujours devant ses serviteurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Que … soit béni
  rationale: L’adjectif prédicatif ouvre une formule doxologique. En français, « Que le Seigneur soit béni » est la tournure naturelle et solennelle, sans imposer une distinction nette entre déclaration et souhait que la phrase grecque sans verbe ne tranche pas explicitement.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Rend naturellement le titre divin κύριος dans ce contexte doxologique.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette locution idiomatique exprime ici une durée sans fin; « pour toujours » est clair et courant en français moderne.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » conserve directement le sens spatial et relationnel de ce qui a lieu en présence de quelqu’un, sans développer davantage l’image.
- source_word: δούλων αὐτοῦ
  choice: ses serviteurs
  rationale: Dans ce cadre cultuel et relationnel, « serviteurs » appartient au champ de sens de δοῦλοι et convient mieux que « esclaves », qui mettrait au premier plan le statut social.
theological_decisions: []
translation_notes:
  register: Formulation brève, doxologique et digne, en français international moderne. Le tour « Que … soit béni » respecte le caractère elliptique de la proposition grecque et son usage liturgique.
