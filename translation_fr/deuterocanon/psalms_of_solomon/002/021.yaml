  source_fidelity: 'Le grec décrit deux gestes parallèles de mise en place : elle se revêt d’un σάκκος à la place d’un vêtement élégant ou distingué, puis place un σχοινίον autour de sa tête à la place d’un στέφανος. « Toile de sac », « vêtement d’apparat » et « couronne » sont défendables. Toutefois, σχοινίον est plus précisément un « cordon » qu’une « corde », et la reprise française de deux verbes rend plus naturellement les deux compléments du verbe grec sans modifier le sens.'
