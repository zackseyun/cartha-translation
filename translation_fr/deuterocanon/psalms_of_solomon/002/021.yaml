  yaml_path: translation/deuterocanon/psalms_of_solomon/002/021.yaml
  text: She wrapped herself in sackcloth instead of splendid clothing[c][b][a], and a cord around her head instead of a wreath.
translation:
  language: fr
  text: Elle s’enveloppa d’une toile de sac au lieu d’un vêtement d’apparat[a], et noua un cordon autour de sa tête au lieu d’une couronne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un beau vêtement » ou « une tenue élégante ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une guirlande ».
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέζωσατο
  choice: se ceignit… et entoura
  rationale: Le moyen indique qu’elle se revêt ou se lie elle-même. La reprise du geste par deux verbes français naturels évite une coordination maladroite tout en conservant les deux compléments grecs.
- source_word: σάκκον
  choice: toile de sac
  rationale: Expression française courante pour l’étoffe grossière portée en signe de deuil ou d’humiliation.
- source_word: ἐνδύματος εὐπρεπείας
  choice: vêtement d’apparat
  rationale: Le groupe désigne une tenue belle, digne ou somptueuse, mise en contraste avec la toile de sac. « D’apparat » rend ici la fonction ornementale sans alourdir la phrase.
- source_word: σχοινίον
  choice: corde
  rationale: Le mot désigne une corde ou un cordon. « Corde » maintient le contraste rude avec la parure de tête.
- source_word: στεφάνου
  choice: couronne
  rationale: Le terme peut désigner une couronne, une guirlande ou une parure circulaire. « Couronne » est clair et traditionnel, tandis que la note conserve l’autre possibilité contextuelle.
