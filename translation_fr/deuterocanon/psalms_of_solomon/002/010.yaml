  text: And heaven was weighed down[a], and the earth abhorred them[b],
translation:
  language: fr
  text: Et le ciel fut accablé[a], et la terre les prit en horreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis ici porte ἐβαρύνθησενσεν, forme qui semble comporter une terminaison répétée. La traduction suit la forme sous-jacente évidente ἐβαρύνθησεν.
    reason: textual_variant
lexical_decisions:
- source_word: οὐρανός
  choice: le ciel
  rationale: Dans le parallèle avec « la terre », le mot désigne le ciel comme partie de l’ensemble cosmique « ciel et terre ». « Le ciel » est l’expression française naturelle et préserve cette image biblique.
- source_word: ἐβαρύνθησενσεν
  choice: fut accablé
  rationale: Malgré la forme manifestement altérée dans la transcription, le verbe sous-jacent exprime l’idée de devenir lourd ou d’être chargé d’un poids. « Fut accablé » conserve la personnification cosmique et évite de réduire l’image à un phénomène météorologique.
- source_word: γῆ
  choice: la terre
  rationale: Le parallèle avec « le ciel » favorise le sens cosmique de « terre », plutôt que celui, plus local, de « pays ».
- source_word: ἐβδελύξατο
  choice: prit en horreur
  rationale: Le verbe exprime une vive répulsion. « Prendre en horreur » est naturel en français, garde la force morale du grec et convient au registre poétique.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom masculin pluriel reprend directement les personnes visées dans le contexte.
theological_decisions:
- issue: Nature de la réaction du ciel
  choice: Une personnification cosmique exprimée par « fut accablé »
  alternative: « s’alourdit » ou « devint lourd »
  rationale: Le grec laisse subsister l’image du poids sans en préciser la cause. La formulation choisie préserve cette image et son parallélisme avec la répulsion de la terre, sans définir davantage la portée théologique du jugement.
translation_notes:
  register: Style poétique, solennel et accessible. Le parallélisme « le ciel… la terre… » ainsi que la personnification des deux éléments sont conservés.
