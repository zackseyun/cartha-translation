base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: fr
  text: 'Car le Seigneur est bienveillant envers ceux qui l’invoquent avec persévérance[a] : il agit selon sa miséricorde envers ceux qui lui sont fidèles[b], afin qu’ils se tiennent constamment devant lui avec force.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec endurance » ou « avec patience ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les personnes pieuses qui lui appartiennent ».
    reason: lexical_alternative
  - marker: c
    text: 'Le grec présente ici une suite d’infinitifs très condensée. Le dernier peut aussi se comprendre avec le Seigneur pour sujet et les fidèles comme objet sous-entendu : « pour les établir constamment devant lui avec force ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: χρηστὸς
  choice: bienveillant
  rationale: « Bienveillant » exprime ici la bonté active et relationnelle du Seigneur avec plus de précision que le terme général « bon ».
- source_word: ἐπικαλουμένοις αὐτόν
  choice: ceux qui l’invoquent
  rationale: Le verbe désigne l’appel adressé à Dieu dans la prière. « Invoquer » est naturel dans ce registre religieux sans être archaïque.
- source_word: ἐν ὑπομονῇ
  choice: avec persévérance
  rationale: ὑπομονή évoque l’endurance fidèle dans la durée et sous l’épreuve ; « persévérance » rend bien cette dimension en français courant.
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: il agit selon sa miséricorde
  rationale: La tournure infinitive grecque est très condensée. Une proposition conjuguée restitue clairement l’action miséricordieuse du Seigneur sans en préciser indûment la forme.
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: ceux qui lui sont fidèles
  rationale: Dans ce contexte, ὅσιοι désigne des personnes pieuses et loyales envers Dieu. « Ceux qui lui sont fidèles » distingue ce terme de ἅγιοι, souvent rendu par « saints », et évite d’effacer sa nuance de fidélité religieuse.
- source_word: διὰ παντός
  choice: constamment
  rationale: Le terme marque une continuité durable ; « constamment » convient au registre poétique et reste immédiatement compréhensible.
- source_word: παρεστᾶναι … ἐν ἰσχύι
  choice: qu’ils se tiennent … devant lui avec force
  rationale: Cette formulation conserve l’image d’une présence ferme devant Dieu et laisse implicite, comme le grec, l’origine de la force.
theological_decisions:
- issue: Rapport syntaxique des infinitifs ποιῆσαι et παρεστᾶναι avec la proposition principale
  choice: 'Le premier infinitif est explicité comme l’action miséricordieuse du Seigneur, et le second comme son effet ou son but pour les fidèles : « il agit… afin qu’ils se tiennent… »'
  alternative: 'Conserver formellement la suite « pour agir… pour se tenir… », ou comprendre le dernier infinitif de manière causative : « pour les établir devant lui ».'
  rationale: Le grec est syntaxiquement condensé et ne rend pas entièrement explicite le sujet du dernier infinitif. La formulation retenue donne une phrase française intelligible tout en signalant en note qu’une lecture plus causative demeure possible.
- issue: Sens de ὅσιοι
  choice: ceux qui lui sont fidèles
  alternative: les personnes pieuses ; ses consacrés ; ses saints
  rationale: « Fidèles » préserve la dimension de piété et de loyauté envers Dieu sans identifier automatiquement ὅσιοι au vocabulaire distinct de la sainteté exprimé par ἅγιοι.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation explicite la progression de la pensée sans alourdir la phrase. « Miséricorde » est conservé en raison de sa portée biblique et théologique largement comprise.
