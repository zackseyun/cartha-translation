  yaml_path: translation/deuterocanon/psalms_of_solomon/002/017.yaml
  text: For you repaid the sinners according to their deeds[c][b][a], and according to their exceedingly evil sins.
translation:
  language: fr
  text: Car tu as rétribué les pécheurs selon leurs actes[a], et selon leurs péchés extrêmement mauvais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « œuvres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « très mauvais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκας
  choice: tu as rétribué
  rationale: Le verbe exprime le fait de rendre à chacun ce qui lui revient. « Rétribué » conserve ici la portée judiciaire de la rétribution tout en restant clair en français.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: les pécheurs
  rationale: Cette traduction directe conserve l’article défini grec, qui peut désigner un groupe déterminé dans le contexte plutôt que les pécheurs en général.
- source_word: ἔργα
  choice: actes
  rationale: « Actes » rend naturellement les actions concrètes soumises au jugement; « œuvres » demeure une possibilité plus formelle.
- source_word: ἁμαρτίας
  choice: péchés
  rationale: « Péchés » est l’équivalent direct et conserve la force morale et religieuse du terme grec.
- source_word: πονηρὰς σφόδρα
  choice: extrêmement mauvais
  rationale: Cette formulation préserve à la fois la qualification morale de πονηράς et l’intensification exprimée par σφόδρα.
theological_decisions:
- issue: Portée de l’article dans τοῖς ἁμαρτωλοῖς
  choice: les pécheurs
  alternative: des pécheurs
  rationale: L’article défini est maintenu, car le grec peut viser un groupe identifiable dans le contexte historique et littéraire; une formulation indéfinie effacerait cette possibilité.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle « selon… et selon… » reproduit celle du grec, tandis que « rétribué » exprime sans lourdeur le sens judiciaire de la phrase.
