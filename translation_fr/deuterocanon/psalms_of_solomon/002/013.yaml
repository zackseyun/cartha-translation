  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: fr
  text: Ils ont fait des fils de Jérusalem un objet de dérision, comme des prostituées en son sein[a] ; tout passant y entrait en plein jour[b] ; ils les raillaient à cause de leurs actes d’iniquité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la place de prostituées » ; dans ce contexte, l’expression peut décrire une humiliation comparable à la leur.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « devant le soleil », c’est-à-dire ouvertement, en plein jour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν … εἰς ἐμπαιγμόν
  choice: ont livré … à la dérision
  rationale: La construction signifie littéralement « placer pour la moquerie » et présente les fils de Jérusalem comme exposés publiquement aux outrages. Cette tournure française restitue le résultat sans être artificiellement littérale.
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: les fils de Jérusalem
  rationale: Le grec emploie explicitement le masculin pluriel et conserve une image d’appartenance familiale à la ville.
- source_word: ἀντὶ πορνῶν
  choice: comme des prostituées
  rationale: Bien que ἀντί signifie normalement « à la place de », le contexte paraît comparer l’humiliation infligée aux fils de Jérusalem à celle de prostituées. L’ambiguïté est signalée en note.
- source_word: ἐν αὐτῇ
  choice: au milieu d’elle
  rationale: Le pronom féminin renvoie naturellement à Jérusalem, personnifiée comme une ville.
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: chaque passant entrait
  rationale: L’imparfait grec suggère une action répétée ou habituelle ; le français à l’imparfait conserve cet aspect.
- source_word: κατέναντι τοῦ ἡλίου
  choice: au grand jour
  rationale: Littéralement « devant le soleil », l’expression souligne que l’action se déroulait ouvertement, en plein jour.
- source_word: ἐνέπαιζον
  choice: ils se moquaient d’eux
  rationale: Le verbe exprime la raillerie et reprend le thème de ἐμπαιγμός. Le complément « d’eux », implicite dans le contexte, clarifie en français la cible de la moquerie.
- source_word: ταῖς ἀνομίαις αὐτῶν
  choice: par leurs actes contraires à la Loi
  rationale: ἀνομία désigne ici des conduites transgressant la norme divine ; la majuscule à « Loi » indique cette référence sans réduire le terme à une simple illégalité civile.
theological_decisions:
- issue: Portée de ἀνομίαις
  choice: actes contraires à la Loi
  alternative: actes iniques / actes sans loi
  rationale: La formulation retenue conserve le lien lexical avec νόμος tout en exprimant une transgression morale et religieuse, sans préciser davantage la nature des actes.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe en trois propositions conserve la progression du grec et son tableau d’humiliation publique. Les notes préservent les deux principales particularités littérales sans alourdir le verset.
