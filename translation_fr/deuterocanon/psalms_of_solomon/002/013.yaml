revisions:
- from: Ils ont livré les fils de Jérusalem à la dérision, comme des prostituées au milieu d’elle[a] ; chaque passant entrait au grand jour[b] ; ils se moquaient d’eux par leurs actes contraires à la Loi.
  to: Ils ont fait des fils de Jérusalem un objet de dérision, comme des prostituées en son sein[a] ; tout passant y entrait en plein jour[b] ; ils les raillaient à cause de leurs actes d’iniquité.
  rationale: La révision remplace un verbe français qui ajoutait une idée de remise par l’expression idiomatique correspondant à « placer comme objet de dérision ». Elle rend l’entrée dans Jérusalem explicite par « y », sans ajouter de contenu, améliore l’expression du lieu, et évite de restreindre ἀνομία à une terminologie légale ou confessionnelle particulière. Les deux notes conservent les ambiguïtés textuelles pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première proposition doit rendre plus directement ἔστησαν … εἰς ἐμπαιγμόν (« ils ont fait … un objet de dérision ») plutôt que « ont livré », qui ajoute l’idée de remise à quelqu’un. Dans la deuxième, « y entrait » rend l’entrée dans Jérusalem implicitement visée. La dernière proposition est plus fidèlement formulée avec un complément causal explicite : le datif ταῖς ἀνομίαις αὐτῶν rattache les actes d’iniquité à la raillerie visant les fils de Jérusalem.'
  naturalness: « Au milieu d’elle » est peu naturel et trop spatial dans ce contexte. « En son sein » est idiomatique pour Jérusalem personnifiée. « Tout passant y entrait en plein jour » est clair et fluide.
  terminology: « Fils de Jérusalem » conserve le masculin pluriel du grec. « Actes d’iniquité » rend ἀνομίαι sans imposer la référence spécifique à la Loi mosaïque que suggère indûment la majuscule dans « Loi ».
  issues:
  - severity: medium
    issue: « Ont livré » pour ἔστησαν
    rationale: Le grec signifie littéralement « établir/placer » et, avec εἰς ἐμπαιγμόν, « faire de quelqu’un un objet de dérision ». « Livrer » introduit une notion absente du texte.
  - severity: low
    issue: « Au milieu d’elle » pour ἐν αὐτῇ
    rationale: La formule ajoute l’idée de centralité spatiale ; « en son sein » rend naturellement le simple « en elle » en français.
  - severity: medium
    issue: « Se moquaient d’eux par leurs actes contraires à la Loi »
    rationale: La formulation française est ambiguë et « par » peut faire des actes le moyen de la raillerie. Une formulation causale rend plus clairement le lien des iniquités à la moquerie, sans ajouter de précision doctrinale sur « la Loi ».
  revised_text: Ils ont fait des fils de Jérusalem un objet de dérision, comme des prostituées en son sein[a] ; tout passant y entrait en plein jour[b] ; ils les raillaient à cause de leurs actes d’iniquité.
