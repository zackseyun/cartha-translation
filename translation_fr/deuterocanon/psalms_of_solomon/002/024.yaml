revisions:
- from: 'Et moi, j’ai vu, puis j’ai imploré le Seigneur[a] et j’ai dit : « Assez, Seigneur[b], de tes mains qui pèsent lourdement sur Israël[c] par l’assaut des nations[d] ! »'
  to: 'Et moi, j’ai vu, puis j’ai imploré le Seigneur[a] et j’ai dit : « Que cela suffise, Seigneur[b] : tes mains pèsent lourdement sur Israël[c] par l’assaut des nations[d] ! »'
  rationale: La révision remplace l’ellipse française maladroite après « Assez » par une formulation impérative naturelle. Les deux-points introduisent le contenu que le grec exprime par le groupe infinitif génitif. Le pluriel « tes mains », l’imagerie de pression divine et l’ambiguïté d’ἐπαγωγή sont préservés. Les ancres et les quatre notes restent correctement rattachées à leurs éléments respectifs.
