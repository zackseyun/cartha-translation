    issue: La formulation principale « Assez, Seigneur, de tes mains qui pèsent lourdement… » est syntaxiquement elliptique et peut sembler peu idiomatique.
    rationale: Ἱκάνωσον appelle une demande de suffisance ou de cessation. « Que cela suffise, Seigneur » rend cette fonction de manière plus claire et plus naturelle en français, tout en laissant les autres possibilités (« Sois satisfait ») en note.
  - severity: low
    issue: La note a décrit la tournure grecque comme « j’ai supplié la face du Seigneur », formulation française trop littérale et peu naturelle.
    rationale: La note peut conserver l’information formelle en disant que le grec porte littéralement « la face du Seigneur », puis expliquer l’idiome. Cela évite de présenter comme français littéral une construction qui ne l’est pas réellement.
