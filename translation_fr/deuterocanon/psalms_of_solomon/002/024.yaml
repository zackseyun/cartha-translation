  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les éléments essentiels : l’emphase de κἀγώ (« Et moi »), la vision, la supplication, l’adresse à Dieu, l’impératif de cessation/suffisance, le pluriel χεῖράς (« mains »), l’image des mains divines pesant sur Israël et le rôle des nations dans l’assaut. « Par l’assaut des nations » maintient de façon acceptable la valeur instrumentale/contextuelle de ἐν ἐπαγωγῇ ἐθνῶν.'
  naturalness: La traduction est globalement naturelle et de registre biblique moderne. Toutefois, « Assez, Seigneur, de tes mains qui pèsent… » est une construction elliptique possible mais heurtée en français contemporain. « Que cela suffise, Seigneur » exprime plus clairement l’impératif grec sans éliminer l’ambiguïté lexicale, qui demeure signalée en note.
  terminology: « Seigneur », « Israël », « mains » et « assaut des nations » sont appropriés. La conservation du pluriel « mains » suit le grec et ne doit pas être remplacée par un singulier. La note sur « la face du Seigneur » explique utilement l’idiome sans lui imposer une interprétation doctrinale.
  issues:
