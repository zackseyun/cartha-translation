base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: fr
  text: 'Et moi, j’ai vu, puis j’ai imploré le Seigneur[a] et j’ai dit : « Que cela suffise, Seigneur[b] : tes mains pèsent lourdement sur Israël[c] par l’assaut des nations[d] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « la face du Seigneur » ; il s’agit d’un idiome biblique évoquant sa présence ou sa faveur.
    reason: traduction_littérale
  - marker: b
    text: 'Ou : « Assez, Seigneur » ou « Sois satisfait, Seigneur ».'
    reason: alternative_lexicale
  - marker: c
    text: L’image des mains du Seigneur pesant lourdement exprime ici la pression de son jugement.
    reason: note_culturelle
  - marker: d
    text: 'Ou : « lors de l’invasion des nations ». Le terme grec peut évoquer soit leur irruption, soit leur attaque.'
    reason: lecture_alternative
lexical_decisions:
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: j’ai imploré le Seigneur
  rationale: ἐδεήθην exprime une supplication pressante. La mention littérale de la « face du Seigneur » reflète un idiome sémitique désignant sa présence ou sa faveur ; en français courant, « implorer le Seigneur » en transmet naturellement le sens, tandis que la forme littérale est signalée en note.
- source_word: Ἱκάνωσον
  choice: Assez
  rationale: Dans cette supplication, l’impératif demande que l’affliction soit jugée suffisante et prenne fin. « Assez » restitue avec force et concision cette demande, sans préciser davantage le sens du verbe.
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: de tes mains qui pèsent lourdement sur Israël
  rationale: La traduction conserve le pluriel χεῖράς et l’image biblique des mains divines pesant sur le peuple dans le jugement. La tournure française dépend naturellement de « Assez ».
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: par l’assaut des nations
  rationale: ἐπαγωγή peut désigner le fait de faire venir un mal, une attaque ou une invasion. « Par l’assaut » conserve ici la valeur instrumentale probable de ἐν et le contexte d’oppression étrangère.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans cette prière adressée au Dieu d’Israël, « Seigneur » est la traduction française biblique naturelle de κύριος.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve l’adresse révérencieuse traditionnelle sans introduire la nuance plus étroitement servile que pourrait suggérer « Maître ».
- issue: Image de l’action divine contre Israël
  choice: conserver l’image des mains du Seigneur qui pèsent sur Israël
  alternative: expliciter par « le châtiment que tu infliges à Israël »
  rationale: Le grec attribue directement au Seigneur l’action figurée par ses mains, tout en indiquant les nations comme moyen de l’assaut. Conserver cette tension évite d’atténuer ou de systématiser la responsabilité divine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la répétition narrative du grec (« j’ai vu… j’ai imploré… j’ai dit »), tout en rendant idiomatiquement l’expression sémitique liée à la face du Seigneur. Le pluriel « mains » suit directement le texte grec.
