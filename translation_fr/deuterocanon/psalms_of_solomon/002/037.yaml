base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: fr
  text: Bénissez Dieu, vous qui craignez le Seigneur avec discernement[a], car la miséricorde du Seigneur repose sur ceux qui le craignent, avec jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec connaissance » ou « avec intelligence ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec justice » ; le grec exprime de façon condensée le rapport entre la miséricorde et le jugement.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle directement à une réponse de louange. « Bénissez » conserve le vocabulaire biblique de la bénédiction, sans le réduire au terme plus général « louez ».
- source_word: οἱ φοβούμενοι
  choice: vous qui craignez
  rationale: Le participe substantivé a ici une valeur d’adresse directe en lien avec l’impératif ; cette formulation est naturelle en français.
- source_word: κύριον / Κυρίου
  choice: Seigneur
  rationale: Rend le titre κύριος selon l’usage biblique français courant.
- source_word: ἐν ἐπιστήμῃ
  choice: avec discernement
  rationale: La tournure exprime une crainte éclairée ou consciente. « Avec discernement » est idiomatique et préserve cette nuance sans préciser excessivement son objet.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Équivalent biblique établi qui convient au registre dévotionnel et garde l’idée de faveur compatissante.
- source_word: ἐπὶ τοὺς φοβουμένους αὐτόν
  choice: repose sur ceux qui le craignent
  rationale: « Repose sur » rend naturellement la relation exprimée par ἐπί tout en conservant l’image d’une miséricorde accordée aux personnes concernées.
- source_word: μετὰ κρίματος
  choice: avec jugement
  rationale: La formule grecque est concise et sa relation avec la proposition précédente demeure implicite. La traduction littérale préserve cette tension plutôt que de l’expliquer.
theological_decisions:
- issue: Rapport entre la miséricorde et le jugement dans μετὰ κρίματος
  choice: La miséricorde du Seigneur repose sur ceux qui le craignent, « avec jugement ».
  alternative: La miséricorde du Seigneur repose sur ceux qui le craignent, « avec justice » ; ou elle est unie au jugement.
  rationale: κρίμα peut évoquer le jugement, la justice rendue ou une décision judiciaire. Le grec ne précise pas davantage le lien syntaxique et théologique ; la formulation retenue conserve donc cette densité sans opposer ni confondre la miséricorde et le jugement.
translation_notes:
  register: Français moderne, digne et accessible, avec une syntaxe biblique légère. L’adresse directe est conservée, et la formule finale volontairement condensée respecte l’ambiguïté du grec.
