  yaml_path: translation/deuterocanon/psalms_of_solomon/002/034.yaml
  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: fr
  text: Lui-même est roi sur les cieux et juge les rois et les dirigeants[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les autorités » ou « les princes ».
    reason: Le grec ἀρχάς peut désigner les détenteurs de l’autorité, les pouvoirs ou, dans ce contexte politique, les princes et dirigeants.
lexical_decisions:
- source_word: αὐτὸς
  choice: Lui-même
  rationale: La forme emphatique est conservée afin de souligner que Dieu en personne exerce cette royauté.
- source_word: βασιλεὺς
  choice: roi
  rationale: Le nom sans article fonctionne comme attribut ; « est roi » exprime directement la royauté sans l’élargir au sens plus vague de « souverain ».
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: sur les cieux
  rationale: Avec ἐπί suivi du génitif, l’expression indique ici la domination plutôt qu’une simple localisation ; le pluriel grec est conservé.
- source_word: κρίνων
  choice: juge
  rationale: Le participe présent est rendu par un verbe coordonné, tournure naturelle en français qui préserve l’action judiciaire attribuée au même sujet.
- source_word: ἀρχάς
  choice: dirigeants
  rationale: Associé aux « rois », le terme désigne naturellement les détenteurs du pouvoir. « Dirigeants » est actuel et clair, tandis qu’« autorités » demeure une autre traduction possible.
theological_decisions:
- issue: Portée de la royauté divine dans ἐπὶ τῶν οὐρανῶν
  choice: Le vers affirme que Dieu est roi sur les cieux et qu’il juge les puissances politiques terrestres.
  alternative: Comprendre « les cieux » comme une manière de désigner le ciel au singulier.
  rationale: Le pluriel de l’original est maintenu sans préciser davantage sa portée cosmologique ; dans les deux lectures, l’accent porte sur la royauté transcendante de Dieu et son jugement des gouvernants.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’emphase de αὐτὸς, le pluriel « cieux » et le parallélisme entre royauté divine et jugement des gouvernants.
