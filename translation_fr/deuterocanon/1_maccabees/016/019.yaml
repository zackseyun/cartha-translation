  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: fr
  text: Il envoya d’autres personnes à Gazara pour emmener Jean[a], et il envoya aux commandants de milliers des lettres pour qu’ils viennent auprès de lui, afin qu’il leur donne de l’argent, de l’or et des présents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enlever Jean ». Le verbe grec peut signifier prendre, emporter ou enlever. Dans ce contexte, il indique une intention hostile sans préciser davantage ce qui devait arriver à Jean.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: il envoya / il écrivit
  rationale: Le premier emploi est rendu directement par « envoya ». Pour le second, avec « des lettres » comme complément, le français naturel exprime l’action par « écrivit », sans changer le sens.
- source_word: ἑτέρους
  choice: d’autres hommes
  rationale: Le grec substantivé signifie « d’autres »; « hommes » explicite naturellement en français les agents envoyés dans ce contexte, sans les identifier davantage.
- source_word: Γάζαρα
  choice: Gazara
  rationale: Conserve la forme grecque du nom de lieu attestée dans le texte source; une note indique son équivalent plus connu.
- source_word: ἄραι
  choice: enlever
  rationale: Le verbe αἴρω peut signifier emporter ou faire disparaître. « Enlever » préserve ici l’idée hostile de soustraire Jean sans préciser s’il s’agit de l’arrêter, de l’enlever de force ou de le tuer.
- source_word: τοῖς χιλιάρχοις
  choice: aux chefs de milliers
  rationale: Rend littéralement le titre militaire grec tout en restant intelligible; « chefs » évite le calque technique « chiliarques ».
- source_word: ἐπιστολάς
  choice: écrivit
  rationale: Le grec dit littéralement qu’il « envoya des lettres ». En français, « il écrivit aux… » transmet avec naturel la même action épistolaire.
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: qu’ils viennent auprès de lui
  rationale: Exprime l’arrivée auprès d’une personne sans ajouter l’idée plus précise de ralliement ou de comparution.
- source_word: ὅπως δῷ αὐτοῖς
  choice: afin qu’il leur donne
  rationale: Préserve clairement la valeur de but de ὅπως suivi du subjonctif.
- source_word: ἀργύριον καὶ χρυσίον
  choice: de l’argent, de l’or
  rationale: Rend les deux métaux précieux nommés dans le grec; la coordination française avec virgules est fluide dans une liste de trois éléments.
- source_word: δόματα
  choice: des présents
  rationale: « Présents » désigne naturellement des dons offerts pour gagner les destinataires et évite la répétition immédiate de « donne… des dons ».
