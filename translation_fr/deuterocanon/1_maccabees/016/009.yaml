  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
translation:
  language: fr
  text: Alors Judas, le frère de Jean, fut blessé; mais Jean les poursuivit jusqu’à la ville de Kédrôn[a], qu’il avait bâtie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cédron », selon la forme traditionnelle du nom.
    reason: lexical_alternative
  - marker: b
    text: Le relatif féminin grec renvoie le plus naturellement à Kédrôn, compris comme une ville; le texte ne précise pas davantage l’antécédent.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: fut blessé
  rationale: Le passif aoriste décrit une blessure reçue au combat. « Fut blessé » est précis, naturel et adapté au récit militaire.
- source_word: κατεδίωξεν
  choice: les poursuivit
  rationale: Le verbe exprime la poursuite active d’adversaires en fuite. « Poursuivit » conserve à la fois le mouvement et le registre narratif.
- source_word: ἕως ἐλθεῖν
  choice: jusqu’à ce qu’il arrive
  rationale: L’infinitif exprime ici le terme de la poursuite. Le sujet le plus naturel demeure Jean, sujet du verbe principal au singulier, sans exclure que ses hommes l’accompagnent.
- source_word: Κεδρών
  choice: Kédrôn
  rationale: Cette translittération française rend directement le kappa grec et distingue les voyelles longues selon un usage savant lisible. La forme traditionnelle « Cédron » reste possible.
- source_word: οἰκοδόμησεν
  choice: avait bâtie
  rationale: Le verbe signifie normalement « bâtir ». Le plus-que-parfait marque l’antériorité de la construction par rapport à l’arrivée de Jean; l’accord au féminin comprend Kédrôn comme une ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation en deux phrases allège la longue coordination grecque sans modifier l’enchaînement. Le nom « Jean » suit l’usage biblique français courant, et « Judas » conserve la forme usuelle du personnage.
