  text: For he was the son-in-law of the high priest[a].
translation:
  language: fr
  text: Car il était le gendre du grand prêtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec γαμβρός peut désigner plus largement un parent par alliance ; ici, « gendre » est le sens précis le plus probable d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί exprime ici simplement un état passé ; « était » est la tournure française naturelle.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit l’explication de ce qui précède ; « car » en conserve clairement et sobrement la valeur explicative.
- source_word: γαμβρὸς
  choice: gendre
  rationale: Dans ce contexte, ce terme de parenté désigne très probablement le gendre, même s’il peut avoir un sens plus large de parent par alliance.
- source_word: τοῦ ἀρχιερέως
  choice: du grand prêtre
  rationale: ἀρχιερεύς est le titre habituel du « grand prêtre » dans le contexte juif.
