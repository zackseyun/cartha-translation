  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
translation:
  language: fr
  text: S’étant levés le matin, ils se dirigèrent vers la plaine. Et voici qu’une force importante venait à leur rencontre, composée de fantassins et de cavaliers ; un oued[a] les séparait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un torrent » ou « le lit d’un torrent ». Le terme grec désigne un cours d’eau alimenté par les pluies d’hiver et peut renvoyer soit à l’eau, soit à son lit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: S’étant levés le matin
  rationale: Le participe exprime une action antérieure au déplacement. Cette formulation conserve l’enchaînement temporel sans ajouter l’idée de « tôt », qui n’est pas explicitement marquée.
- source_word: ἐπορεύοντο εἰς τὸ πεδίον
  choice: ils se dirigèrent vers la plaine
  rationale: Le verbe de déplacement à l’imparfait décrit leur progression. Le passé simple convient au récit français, tandis que « vers la plaine » rend naturellement εἰς sans imposer qu’ils y soient déjà entrés.
- source_word: δύναμις πολλὴ
  choice: une force importante
  rationale: Dans ce contexte militaire, δύναμις désigne un corps de troupes. « Force importante » en indique la taille sans préciser indûment qu’il s’agit d’une armée constituée.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: venait à leur rencontre
  rationale: Cette tournure restitue l’idée d’un mouvement vers l’autre groupe sans accentuer explicitement l’hostilité au-delà du grec.
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: composée de fantassins et de cavaliers
  rationale: Les deux termes désignent respectivement les combattants à pied et montés. L’ajout explicatif « composée de » clarifie leur rapport appositif avec la force mentionnée.
- source_word: χειμάρρους
  choice: un oued
  rationale: Le mot grec désigne un cours d’eau torrentiel, souvent saisonnier, ou son lit. « Oued » convient au cadre géographique et permet de préserver cette double possibilité dans une note.
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: les séparait
  rationale: Cette formulation française naturelle exprime fidèlement que le cours d’eau se trouvait entre les deux groupes.
