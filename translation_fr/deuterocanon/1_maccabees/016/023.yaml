  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: fr
  text: Quant au reste des récits concernant Jean, ses guerres, les exploits qu’il accomplit, la construction des murailles qu’il bâtit et ses actions…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τὰ λοιπὰ τῶν λόγων Ἰωάννου
  choice: Quant au reste des récits concernant Jean
  rationale: La tournure française restitue naturellement la formule historiographique grecque annonçant les éléments non rapportés ici; λόγων désigne dans ce contexte les récits ou faits consignés, plutôt que de simples paroles.
- source_word: πολέμων
  choice: guerres
  rationale: Le pluriel grec couvre largement les conflits militaires de Jean; « guerres » en conserve mieux l’étendue que « batailles ».
- source_word: ἀνδραγαθιῶν … ἠνδραγάθησεν
  choice: les exploits qu’il accomplit
  rationale: Le nom et le verbe apparentés expriment des actes de bravoure. « Exploits » conserve la valeur élogieuse, tandis que « accomplit » évite une répétition lourde en français.
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: la construction des murailles qu’il bâtit
  rationale: « Murailles » rend la fonction défensive de τείχη, et la reprise « construction… bâtit » préserve la structure insistante du grec sans être incompréhensible.
- source_word: πράξεων
  choice: ses autres actions
  rationale: πράξεις est un terme général concluant l’énumération. L’ajout idiomatique de « autres » signale que ces actions forment la dernière catégorie après les éléments déjà nommés.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la forme d’une conclusion historiographique laissée en suspens, marquée par les points de suspension, puisque le texte grec fourni se termine par une virgule et se poursuit au verset suivant.
