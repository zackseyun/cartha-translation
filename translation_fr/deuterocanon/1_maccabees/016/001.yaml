  text: And John came up from Gazara and reported to Simon his father what Cendebeus was doing[a].
translation:
  language: fr
  text: Jean monta de Gazara et rapporta à Simon, son père, ce que Cendébée faisait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que Cendébée était en train d’accomplir » ou « ce que Cendébée mettait à exécution ». Le verbe grec peut désigner une action en cours ou l’exécution d’un projet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: monta
  rationale: L’aoriste de ἀναβαίνω exprime ici un déplacement vers le haut ou vers un lieu considéré comme plus élevé. « Monta » conserve ce sens directionnel avec naturel dans le récit.
- source_word: Γαζάρων
  choice: Gazara
  rationale: Le grec donne la forme hellénisée du nom de lieu. « Gazara » suit ce témoin plutôt que de lui substituer la forme hébraïque « Guézer ».
- source_word: ἀπήγγειλεν
  choice: rapporta
  rationale: ἀπαγγέλλω désigne la transmission d’une information ou d’un rapport. « Rapporta » convient au contexte politico-militaire.
- source_word: συνετέλει
  choice: était en train d’accomplir
  rationale: L’imparfait présente l’action comme en cours, tandis que συντελέω peut signifier accomplir, exécuter ou mener à terme. Cette formulation conserve à la fois l’aspect progressif et l’idée d’exécution.
- source_word: Κενδεβαῖος
  choice: Kendébée
  rationale: « Kendébée » est une translittération française traditionnelle et identifiable du nom grec, avec un K qui reflète directement l’initiale grecque.
