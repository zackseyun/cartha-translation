  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: fr
  text: Il courut en avant et informa Jean, à Gazara, que son père et ses frères avaient péri, et que Ptolémée avait envoyé des hommes pour le tuer lui aussi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et qu’il avait envoyé aussi pour te tuer ». Le grec ne précise pas qui avait été envoyé ; « des hommes » est ajouté dans le texte pour la clarté. Le sujet implicite, « il », renvoie à Ptolémée dans le contexte immédiat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: courut en avant
  rationale: Le participe exprime un déplacement rapide en prenant de l’avance. « Courut en avant » conserve à la fois le mouvement et l’urgence.
- source_word: ἀπήγγειλεν
  choice: informa
  rationale: Le verbe désigne la transmission d’une nouvelle ou d’un rapport. « Informa » convient naturellement à ce contexte de messager.
- source_word: εἰς Γάζαρα
  choice: à Gazara
  rationale: Dans la construction avec Jean comme destinataire du message, le groupe prépositionnel indique naturellement le lieu où Jean se trouve.
- source_word: ἀπώλετο
  choice: avaient péri
  rationale: Le verbe peut signifier périr, mourir ou être détruit. Ici, « avaient péri » évoque la mort violente sans préciser dans le verbe lui-même comment elle s’est produite.
- source_word: Ἀπέσταλκεν
  choice: avait envoyé des hommes
  rationale: Le parfait grec présente l’envoi comme déjà accompli et toujours pertinent. Le complément de « avait envoyé » reste implicite en grec ; « des hommes » est ajouté pour obtenir une phrase française claire et idiomatique.
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: pour le tuer lui aussi
  rationale: 'Cette formulation rend le sens direct de « tuer » et conserve l’accent de καὶ σέ : Jean doit subir le même sort que son père et ses frères.'
