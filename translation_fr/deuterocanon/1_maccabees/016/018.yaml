  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: fr
  text: Ptolémée écrivit ces choses et les envoya au roi, afin que celui-ci lui envoie des troupes en renfort et lui livre leur pays et leurs villes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμεις εἰς βοήθειαν
  choice: des troupes en renfort
  rationale: Dans ce contexte militaire, δυνάμεις désigne des forces armées et εἰς βοήθειαν leur fonction d’assistance; «des troupes en renfort» est naturel et précis en français.
- source_word: παραδῷ
  choice: lui livre
  rationale: Le verbe exprime ici la remise du pays et des villes au pouvoir de Ptolémée; «livrer» conserve cette idée de transfert de contrôle.
- source_word: τὴν χώραν αὐτῶν καὶ τὰς πόλεις
  choice: leur pays et leurs villes
  rationale: Le possessif αὐτῶν porte naturellement sur le pays et, par le sens, sur les villes; sa reprise en français rend la relation claire sans modifier le contenu.
