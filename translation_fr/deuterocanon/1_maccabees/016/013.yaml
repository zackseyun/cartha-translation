  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
translation:
  language: fr
  text: Son cœur s’enorgueillit[a] ; il voulut prendre le contrôle du pays et complotait par ruse contre Simon et ses fils, pour les faire disparaître[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son cœur s’éleva » ; autre traduction possible : « il devint orgueilleux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour les éliminer ». Le grec dit littéralement « les enlever » ; dans ce contexte, cela implique probablement une élimination violente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: Son cœur s’enorgueillit
  rationale: Cette formulation française naturelle exprime l’orgueil et l’élévation de soi portés par l’expression grecque, tandis que la note conserve son image littérale.
- source_word: ἐβουλήθη
  choice: il voulut
  rationale: Le verbe indique ici une volonté arrêtée ou une intention formée, sans nécessairement affirmer que le projet fut exécuté.
- source_word: κατακρατῆσαι τῆς χώρας
  choice: prendre le contrôle du pays
  rationale: Avec le génitif, κατακρατέω désigne la prise de domination sur un territoire ; cette tournure rend clairement l’enjeu politique.
- source_word: ἐβούλευετο δόλῳ
  choice: trama avec perfidie
  rationale: L’imparfait évoque une machination en cours, et δόλῳ en précise le caractère trompeur ou perfide.
- source_word: κατὰ Σίμωνος καὶ κατὰ τῶν υἱῶν αὐτοῦ
  choice: contre Simon et ses fils
  rationale: La répétition grecque de κατά marque l’hostilité envers Simon comme envers ses fils ; une seule préposition suffit naturellement en français.
- source_word: ἆραι αὐτούς
  choice: afin de les éliminer
  rationale: αἴρω signifie littéralement enlever ou écarter ; dans ce contexte hostile, « éliminer » communique l’intention violente probable sans préciser explicitement le moyen.
