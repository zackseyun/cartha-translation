  source_fidelity: La première proposition rend bien l’idiome grec et son sens d’orgueil. « prendre le contrôle du pays » rend correctement κατακρατῆσαι τῆς χώρας, et « complotait par ruse » restitue mieux l’imparfait ἐβούλευετο et le datif instrumental δόλῳ. En revanche, « éliminer » dans le texte principal précise davantage que ἆραι (« enlever, écarter »), dont le contexte suggère probablement une suppression violente sans l’énoncer de façon explicite.
