  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: fr
  text: Ils s’enfuirent dans les tours situées dans les champs d’Azôt[a], et il y mit le feu[b]. Environ mille hommes d’entre eux tombèrent[c], puis il retourna en Judée en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azôt est le nom grec d’Ashdod.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il la brûla par le feu ». Le pronom grec est au singulier et peut désigner globalement la position fortifiée plutôt que chacune des tours prise séparément.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « mille hommes ». La tournure grecque peut indiquer un total approximatif.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Rend directement la fuite dans un contexte militaire, sans ajouter l’idée d’une évasion réussie.
- source_word: πύργους
  choice: tours
  rationale: Conserve l’image concrète des ouvrages défensifs donnée par le sens premier du grec.
- source_word: ἐν τοῖς ἀγροῖς
  choice: situées dans les champs
  rationale: Reproduit le cadre rural du grec tout en reliant naturellement le complément aux tours.
- source_word: Ἀζώτου
  choice: Azôt
  rationale: Forme française traditionnelle du nom grec Azôtos, distincte de l’équivalent hébreu Ashdod signalé en note.
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: il y mit le feu
  rationale: Expression française naturelle qui rend l’incendie et laisse le pronom adverbial renvoyer globalement au lieu fortifié, sans corriger explicitement le singulier grec en un pluriel.
- source_word: ἔπεσον
  choice: tombèrent
  rationale: Préserve l’idiome militaire grec, où tomber signifie mourir au combat, sans l’expliciter davantage.
- source_word: ἐξ αὐτῶν
  choice: d’entre eux
  rationale: 'Exprime clairement la valeur partitive : les victimes appartenaient au groupe en fuite.'
- source_word: εἰς ἄνδρας χιλίους
  choice: environ mille hommes
  rationale: La construction avec εἰς devant le nombre peut indiquer un total approximatif; « environ » restitue cette nuance probable sans la présenter comme certaine.
- source_word: ἀπέστρεψεν
  choice: retourna
  rationale: Équivalent narratif naturel du verbe indiquant le retour.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Rend littéralement et idiomatiquement la manière dont s’effectue le retour.
