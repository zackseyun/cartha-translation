translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et accessible; « il y mit le feu » évite une discordance française entre le pronom grec singulier et le nom « tours » au pluriel tout en conservant l’ambiguïté du référent dans une note.
