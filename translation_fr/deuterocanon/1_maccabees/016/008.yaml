  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
translation:
  language: fr
  text: Ils sonnèrent des trompettes, et Cendébée ainsi que son camp furent mis en déroute[a]. Beaucoup d’entre eux tombèrent blessés[b], tandis que ceux qui étaient restés s’enfuirent dans la forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent repoussés » ou « furent mis en fuite ». Le verbe grec est un terme militaire qui peut exprimer la défaite et la dispersion.
    reason: lexical_alternative
  - marker: b
    text: L’expression « tombèrent blessés » suit le grec de près et ne signifie pas nécessairement qu’ils moururent tous ; elle peut désigner des hommes atteints et abattus au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: ils sonnèrent des trompettes
  rationale: La tournure rend naturellement en français l’action de sonner des trompettes comme signal militaire, tout en conservant l’image concrète du grec.
- source_word: ἐτροπώθη
  choice: furent mis en déroute
  rationale: Dans ce contexte militaire, le passif désigne le renversement et la dispersion d’une force. Cette traduction exprime plus précisément le sens grec que « furent plongés dans la confusion », sans rendre superflue la mention ultérieure de la fuite des hommes restants.
- source_word: παρεμβολὴ
  choice: armée
  rationale: Le terme peut désigner un camp ou les troupes qui le composent. Comme le groupe subit des pertes et que ses membres prennent la fuite, « armée » désigne ici naturellement la force militaire de Kendébée.
- source_word: ἔπεσον τραυματίαι
  choice: tombèrent blessés
  rationale: Cette formulation suit de près le grec et laisse ouverte la question de savoir si tous ceux qui tombèrent moururent; elle désigne des combattants abattus ou atteints au combat.
- source_word: οἱ δὲ καταλειφθέντες
  choice: tandis que ceux qui restaient
  rationale: La traduction conserve la valeur du participe, qui désigne ceux qui demeuraient après les pertes, sans imposer le terme plus interprétatif de « survivants ».
- source_word: ὀχύρωμα
  choice: forteresse
  rationale: Le nom grec désigne un lieu fortifié. « Forteresse » est clair, courant et approprié au contexte militaire.
