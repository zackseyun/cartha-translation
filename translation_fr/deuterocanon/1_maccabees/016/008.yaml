revisions:
- from: Ils sonnèrent des trompettes, et Kendébée ainsi que son armée furent mis en déroute[a]. Beaucoup d’entre eux tombèrent blessés[b], tandis que ceux qui restaient s’enfuirent dans la forteresse.
  to: Ils sonnèrent des trompettes, et Cendébée ainsi que son camp furent mis en déroute[a]. Beaucoup d’entre eux tombèrent blessés[b], tandis que ceux qui étaient restés s’enfuirent dans la forteresse.
  rationale: La révision adopte la graphie française biblique habituelle du nom, restitue le sens concret de « camp » pour παρεμβολή et rend plus précisément le participe « ceux qui étaient restés ». Elle conserve la déroute, les blessés tombés au combat et la fuite vers le lieu fortifié, sans préciser au-delà de ce que dit le grec.
