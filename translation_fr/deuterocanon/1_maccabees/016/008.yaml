  - severity: low
    issue: « Armée » atténue le sens concret de παρεμβολή
    rationale: Le mot grec peut s’étendre aux troupes, mais son sens premier est « camp ». Dans ce verset, « son camp » est une équivalence plus directe et reste naturel.
  - severity: low
