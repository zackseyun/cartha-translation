  text: Behold[a], these things are written in the book of the days of his high priesthood, from the time when he became high priest after his father.
translation:
  language: fr
  text: Voici, tout cela est écrit dans le livre des jours de son grand sacerdoce[a], depuis qu’il est devenu grand prêtre après son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « dans les annales de son grand sacerdoce ». Le grec dit plus littéralement : « dans le livre des jours de son grand sacerdoce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Conserve la fonction présentative et l’appel à l’attention du grec, dans un registre digne et naturel en français.
- source_word: ταῦτα
  choice: tout cela
  rationale: Le neutre pluriel renvoie globalement aux événements précédemment rapportés; « tout cela » est idiomatique tout en conservant cette portée récapitulative.
- source_word: γέγραπται
  choice: est écrit
  rationale: Le parfait passif présente ces faits comme consignés dans un document qui subsiste; « est écrit » rend naturellement cette valeur documentaire.
- source_word: ἐπὶ βιβλίῳ
  choice: dans le livre
  rationale: Dans ce contexte documentaire, la préposition désigne le support ou le registre où les faits sont consignés; « dans le livre » est le tour français naturel.
- source_word: ἡμερῶν ἀρχιερωσύνης αὐτοῦ
  choice: des jours de son grand-prêtrise
  rationale: Cette traduction formellement proche préserve l’expression annalistique du grec sans la remplacer directement par l’interprétation « annales ».
- source_word: ἀφʼ οὗ
  choice: depuis que
  rationale: Rend avec concision le point de départ temporel de la période couverte par le document.
- source_word: ἐγενήθη ἀρχιερεὺς
  choice: il est devenu grand prêtre
  rationale: Exprime l’accession à la charge sans introduire un agent qui n’est pas mentionné dans le grec.
- source_word: μετὰ τὸν πατέρα αὐτοῦ
  choice: après son père
  rationale: Conserve la formulation concise du grec et laisse le contexte indiquer qu’il s’agit d’une succession dans la charge.
