  text: And he selected from the country twenty thousand fighting men and horsemen[a], and they marched against Kendebaios, and camped in Modein.
translation:
  language: fr
  text: Il choisit dans le pays vingt mille combattants ainsi que des cavaliers, puis ils marchèrent contre Kendébée et passèrent la nuit à Modéïn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dormirent à Modéïn »; dans ce contexte militaire, il s’agit d’une halte pour la nuit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: choisit
  rationale: Le verbe exprime une sélection opérée au sein d’un ensemble; « choisit » est naturel et précis en français.
- source_word: ἐκ τῆς χώρας
  choice: dans le pays
  rationale: χώρα désigne ici le territoire d’où les hommes sont recrutés; « dans le pays » restitue ce cadre sans le limiter à une ville.
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: vingt mille combattants
  rationale: Cette formulation française concise rend le nombre et la fonction guerrière des hommes, le genre masculin étant porté par « combattants » dans ce contexte.
- source_word: ἱππεῖς
  choice: des cavaliers
  rationale: « Cavaliers » désigne directement les hommes montés et reste plus concret que « cavalerie ».
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: ils marchèrent contre Kendébée
  rationale: Dans ce récit militaire, πορεύομαι décrit une marche et ἐπί avec l’accusatif marque ici le mouvement hostile contre un adversaire.
- source_word: ἐκοιμήθησαν
  choice: passèrent la nuit
  rationale: Le sens premier est « dormir/se coucher »; dans le contexte d’une campagne, l’expression indique une halte nocturne. « Passèrent la nuit » préserve davantage l’image grecque que « campèrent » sans être artificiellement littéral.
- source_word: Κενδεβαῖον
  choice: Kendébée
  rationale: Forme française traditionnelle et intelligible du nom propre grec, employée comme nom de l’adversaire.
- source_word: Μωδαείμ
  choice: Modéïn
  rationale: Forme française usuelle du toponyme biblique, avec une graphie qui distingue les deux voyelles finales.
