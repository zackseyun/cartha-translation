  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: fr
  text: Quand Simon et ses fils furent ivres, Ptolémée et ceux qui étaient avec lui se levèrent, prirent leurs armes et pénétrèrent dans la salle du banquet[a] pour attaquer Simon. Ils le tuèrent, ainsi que ses fils et quelques-uns de ses jeunes serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réunion de boisson » ; le terme grec peut désigner plus précisément un banquet où l’on boit ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: furent ivres
  rationale: Le verbe indique que Simon et ses fils se trouvèrent en état d’ivresse. « Furent ivres » est naturel en français et n’ajoute pas l’idée d’une intention délibérée que pourrait suggérer « s’enivrèrent ».
- source_word: ἐξανέστη
  choice: se levèrent
  rationale: Cette expression marque le début résolu de l’attaque tout en restant proche du grec.
- source_word: οἱ μετʼ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Le grec ne précise pas s’il s’agit de soldats, de serviteurs ou de compagnons ; la traduction conserve cette indétermination.
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: prirent leurs armes
  rationale: Rendu direct qui n’impose pas de nuance supplémentaire telle que « saisirent » ou « s’armèrent ».
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι
  choice: pénétrèrent … pour attaquer Simon
  rationale: Le verbe composé et le datif expriment une entrée dirigée avec hostilité contre Simon. Cette formulation restitue clairement ce mouvement hostile en français naturel.
- source_word: συμπόσιον
  choice: salle du banquet
  rationale: Dans ce contexte, le terme désigne le banquet comme lieu de la rencontre. L’ajout idiomatique de « salle » évite l’expression peu naturelle « entrer dans le banquet », tandis que la note conserve la nuance de beuverie possible.
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: Ce verbe rend le sens lexical sans ajouter explicitement la qualification juridique ou morale de « assassinèrent ».
- source_word: παιδαρίων
  choice: jeunes serviteurs
  rationale: Le mot peut désigner des garçons ou de jeunes gens attachés au service de quelqu’un ; ce choix conserve à la fois la nuance d’âge et la fonction probable dans ce contexte.
