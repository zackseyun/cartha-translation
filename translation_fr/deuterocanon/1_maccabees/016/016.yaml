translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée en deux phrases pour éviter une coordination lourde, sans modifier la succession des actions. La relation exacte entre Ptolémée et les personnes qui l’accompagnent demeure volontairement indéterminée.
