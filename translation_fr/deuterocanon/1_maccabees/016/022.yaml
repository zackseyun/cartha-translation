  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: fr
  text: Quand il l’apprit, il fut saisi d’une très grande frayeur. Il s’empara des hommes qui étaient venus pour le faire périr et les tua, car il savait qu’ils cherchaient à le faire périr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand il l’apprit
  rationale: Le participe aoriste marque ici l’antériorité immédiate. « L’apprit » est naturel en français et renvoie à la nouvelle mentionnée par le contexte.
- source_word: ἐξέστη σφόδρα
  choice: il fut saisi d’une très grande frayeur
  rationale: Dans le contexte d’une tentative d’assassinat, ἐξίστημι décrit un bouleversement profond ou l’effroi plutôt qu’un simple étonnement; σφόδρα renforce fortement la réaction.
- source_word: συνέλαβεν
  choice: il s’empara
  rationale: Le verbe désigne le fait de saisir ou d’appréhender. « S’empara de » reste large et n’introduit pas la procédure officielle que pourrait suggérer « arrêta ».
- source_word: τοὺς ἄνδρας
  choice: des hommes
  rationale: Le grec désigne explicitement des hommes; le français en conserve la valeur masculine.
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: qui étaient venus pour le faire périr
  rationale: « Faire périr » exprime ici l’intention homicide de ἀπόλλυμι et permet de conserver la répétition du même verbe grec dans la seconde proposition.
- source_word: ἀπέκτεινεν
  choice: les tua
  rationale: ἀποκτείνω signifie directement tuer; « tua » est clair, actuel et sans archaïsme.
- source_word: ἔγνω
  choice: il savait
  rationale: Le verbe indique qu’il connaissait ou avait reconnu leur intention. « Il savait » suit directement le grec sans imposer davantage l’idée ponctuelle de prise de conscience.
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: ils cherchaient à le faire périr
  rationale: L’imparfait ἐζήτουν présente une intention ou une démarche en cours. La reprise de « faire périr » conserve la répétition rhétorique de ἀπολέσαι.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la répétition volontaire de « faire périr » tout en distinguant nettement ἀποκτείνω par « tua ». Aucun marqueur de note n’est requis.
