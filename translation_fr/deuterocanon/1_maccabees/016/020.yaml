translation:
  language: fr
  text: Il envoya d’autres s’emparer de Jérusalem et du mont du sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « le mont du Temple ». Le grec dit littéralement « le mont du sanctuaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρους
  choice: d’autres
  rationale: Désigne de manière concise des agents supplémentaires, distincts de ceux qui viennent d’être mentionnés.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Verbe narratif courant qui exprime l’envoi de personnes chargées d’une mission.
- source_word: καταλαβέσθαι
  choice: s’emparer de
  rationale: Dans ce contexte politico-militaire, le verbe indique la prise de contrôle, sans préciser si elle devait se faire par la force ou par la ruse.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: le mont du sanctuaire
  rationale: Rend directement ὄρος par « mont » et ἱερόν par « sanctuaire », tout en conservant la relation génitive et l’image spatiale grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « S’emparer de » restitue naturellement la visée hostile; « mont du sanctuaire » préserve la formulation grecque, tandis que la note donne l’expression française conventionnelle.
