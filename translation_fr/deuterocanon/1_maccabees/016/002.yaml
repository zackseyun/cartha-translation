  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: fr
  text: 'Simon appela ses deux fils les plus âgés, Judas et Jean, et leur dit : « Moi, mes frères et la maison de mon père, nous avons mené les guerres d’Israël depuis notre jeunesse jusqu’à ce jour, et nous avons réussi à délivrer Israël à maintes reprises.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela a prospéré entre nos mains pour délivrer Israël à maintes reprises » ; c’est-à-dire : « nous avons réussi à délivrer Israël à maintes reprises ».'
    reason: La note conserve l’image et la construction inhabituelle de εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν sans introduire un sujet divin ou un autre agent que le grec ne nomme pas.
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: ses deux fils aînés
  rationale: Le comparatif πρεσβυτέρους désigne les deux fils plus âgés. En français courant, « ses deux fils aînés » est naturel et n’implique pas nécessairement que Simon n’avait que deux fils.
- source_word: ἐπολεμήσαμεν τοὺς πολέμους Ἰσραήλ
  choice: nous avons mené les guerres d’Israël
  rationale: '« Mener les guerres » rend l’expression apparentée du verbe et du nom sans réduire πόλεμοι à de simples batailles. Le génitif « d’Israël » demeure volontairement ouvert : guerres menées par Israël, pour Israël ou lui appartenant.'
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: depuis notre jeunesse jusqu’à ce jour
  rationale: La formulation exprime naturellement en français la durée allant de la jeunesse des locuteurs jusqu’au moment présent. « Notre » explicite le référent pluriel implicite dans le contexte.
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: il nous a été donné
  rationale: La tournure grecque signifie littéralement que l’entreprise a prospéré ou réussi entre leurs mains. « Il nous a été donné » conserve l’idée d’un succès accordé sans nommer explicitement son auteur, tout en évitant une construction française opaque.
- source_word: ῥύσασθαι τὸν Ἰσραήλ
  choice: de délivrer Israël
  rationale: « Délivrer » convient au contexte de sauvetage militaire et conserve le registre biblique sans imposer ici un sens sotériologique plus large.
- source_word: πλεονάκις
  choice: à maintes reprises
  rationale: Cette expression française soutenue mais claire rend l’idée d’actions répétées et nombreuses.
theological_decisions:
- issue: Agent du succès dans la délivrance d’Israël
  choice: La traduction laisse l’auteur du succès inexprimé tout en présentant la famille de Simon comme l’agent humain de la délivrance.
  alternative: « nous avons réussi à délivrer Israël à maintes reprises » ou, plus littéralement, « cela a prospéré entre nos mains, de délivrer Israël à maintes reprises »
  rationale: Le grec ne nomme pas Dieu comme sujet, même si la tournure peut suggérer un succès providentiel. « Il nous a été donné » ne précise pas qui l’a donné et préserve ainsi la tension entre l’action humaine et un succès reçu.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres sont rendus selon leurs formes françaises usuelles (« Judas », « Jean »). La syntaxe emphatique « Moi, mes frères… nous » reproduit naturellement la mise en relief du sujet grec.
