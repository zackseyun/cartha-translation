  yaml_path: translation/deuterocanon/1_maccabees/016/011.yaml
  text: And Ptolemy son of Abubus had been appointed governor over the plain of Jericho[a], and he had much silver and gold;
translation:
  language: fr
  text: Ptolémée, fils d’Aboubos, avait été nommé gouverneur de la plaine de Jéricho[a], et il possédait beaucoup d’argent et d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « gouverneur » peut aussi signifier « général » ou « gouverneur militaire ». Ici, il désigne une autorité exercée sur un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: omis comme connecteur initial
  rationale: En français moderne, l’enchaînement narratif reste naturel sans rendre systématiquement καί par « et » au début de la phrase.
- source_word: Πτολεμαῖος ὁ τοῦ Ἀβούβου
  choice: Ptolémée, fils d’Aboubos
  rationale: La construction au génitif sert de patronyme; cette formulation explicite naturellement la filiation en français.
- source_word: ἦν καθεστημένος
  choice: avait été établi
  rationale: La périphrase exprime un état résultant d’une désignation antérieure. « Avait été établi » conserve cette valeur sans préciser davantage le mode de nomination.
- source_word: στρατηγὸς
  choice: gouverneur
  rationale: Dans ce contexte territorial, le terme désigne une autorité exercée sur un district, même s’il peut aussi porter une nuance militaire.
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  choice: de la plaine de Jéricho
  rationale: Avec le titre, εἰς indique ici le ressort territorial; « plaine » rend précisément πεδίον.
- source_word: ἀργύριον καὶ χρυσίον πολύ
  choice: beaucoup d’argent et d’or
  rationale: Rendu direct et idiomatique de l’abondance des métaux précieux; « argent » est ici compris comme le métal précieux.
