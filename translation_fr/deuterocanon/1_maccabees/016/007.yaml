  text: And he divided the people and the horsemen among the foot soldiers; but the cavalry of the enemy was very numerous.
translation:
  language: fr
  text: Il répartit le peuple et plaça les cavaliers au milieu des fantassins ; mais la cavalerie ennemie était très nombreuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεῖλεν
  choice: répartit
  rationale: Le verbe peut signifier « diviser » ou « répartir ». Dans ce contexte militaire, « répartit » exprime naturellement l’organisation des troupes sans préciser abusivement la tactique.
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Traduction directe du grec. Dans le contexte, le terme désigne les hommes placés sous le commandement, probablement la troupe, mais « le peuple » conserve la formulation de la source.
- source_word: τοὺς ἱππεῖς
  choice: les cavaliers
  rationale: Le nom désigne directement des soldats montés ; « cavaliers » est le terme militaire français naturel.
- source_word: ἐν μέσῳ τῶν πεζῶν
  choice: au milieu des fantassins
  rationale: πεζοί désigne ceux qui combattent à pied. La formulation rend clairement leur disposition sans ajouter de détail.
- source_word: ἡ δὲ ἵππος
  choice: mais la cavalerie
  rationale: Le singulier ἵππος, littéralement « cheval », a ici un sens collectif et désigne la force montée.
- source_word: τῶν ὑπεναντίων
  choice: ennemie
  rationale: Le génitif désigne ceux qui leur sont opposés ; l’adjectif « ennemie » convient naturellement avec « cavalerie » en contexte militaire.
- source_word: πολλὴ σφόδρα
  choice: très nombreuse
  rationale: L’expression souligne la grande quantité de cavaliers ennemis ; « très nombreuse » restitue clairement cette intensité en français moderne.
