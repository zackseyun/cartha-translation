base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: fr
  text: Mais maintenant, j’ai vieilli, et vous aussi, par miséricorde[a], vous avez atteint l’âge requis. Prenez ma place et celle de mon frère[b] ; allez combattre pour défendre notre nation, et que le secours venant du ciel[c] soit avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à la miséricorde ». Le grec ne précise pas explicitement de qui vient cette miséricorde, bien que le contexte suggère naturellement la miséricorde divine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Devenez à ma place et à celle de mon frère. » Le grec exprime l’idée de substitution.'
    reason: alternative_reading
  - marker: c
    text: Le « secours venant du ciel » est une manière révérencieuse de parler de l’aide divine sans nommer Dieu directement.
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: j’ai vieilli
  rationale: Le parfait exprime l’état présent résultant du vieillissement ; « j’ai vieilli » conserve à la fois le processus et son résultat.
- source_word: ἐν τῷ ἐλέει
  choice: par miséricorde
  rationale: La formule grecque signifie littéralement « dans la miséricorde » sans préciser explicitement de qui vient cette miséricorde. « Par miséricorde » en préserve la portée tout en évitant d’ajouter « de Dieu » dans le texte.
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: vous avez atteint l’âge requis
  rationale: ἱκανοί indique ici l’aptitude ou la suffisance quant à l’âge. Cette formulation française exprime naturellement qu’ils sont désormais assez âgés et prêts à assumer cette responsabilité.
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: Prenez ma place et celle de mon frère
  rationale: ἀντί avec le génitif exprime la substitution. La formulation retenue rend ce sens clairement et naturellement en français.
- source_word: ὑπερμαχεῖτε ὑπὲρ
  choice: combattez pour
  rationale: Le verbe désigne le fait de combattre pour la défense d’une personne ou d’une cause. Dans ce contexte militaire, « combattre pour » est direct et idiomatique.
- source_word: ἔθνους
  choice: nation
  rationale: Dans le contexte maccabéen, le terme désigne la communauté nationale et ethnique juive ; « nation » en conserve la dimension collective.
- source_word: ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: le secours venant du ciel
  rationale: Cette expression présente le ciel comme la source du secours et suggère avec révérence l’aide divine sans nommer Dieu explicitement.
- source_word: ἤτω μεθʼ ὑμῶν
  choice: que … soit avec vous
  rationale: L’impératif grec à la troisième personne a ici une valeur de souhait ou de bénédiction, naturellement rendue par « que … soit avec vous ».
theological_decisions:
- issue: Référence divine implicite dans « miséricorde » et « secours venant du ciel »
  choice: Conserver les formulations implicites sans introduire le nom de Dieu dans le texte principal.
  alternative: « par la miséricorde de Dieu » ; « que le secours de Dieu soit avec vous »
  rationale: Le contexte suggère fortement l’action divine, surtout dans le secours venant du ciel, mais le grec ne nomme pas Dieu dans ce verset. La traduction préserve donc cette implication sans l’expliciter davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide tout en conservant l’ambiguïté du grec sur l’origine de la miséricorde et la désignation indirecte de l’aide divine.
