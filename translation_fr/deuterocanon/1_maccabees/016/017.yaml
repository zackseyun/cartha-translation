  text: And he committed a great act of treachery[a], and repaid evil for good.
translation:
  language: fr
  text: Il commit une grande trahison[a] et rendit le mal pour le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grave infidélité » ou « une grave violation de la confiance ». Le terme grec peut désigner le non-respect de la confiance accordée ou d’une obligation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: commit
  rationale: Avec « trahison » comme complément, « commettre » exprime naturellement l’accomplissement d’un acte moralement condamnable, sans calquer mécaniquement le verbe grec.
- source_word: ἀθεσίαν
  choice: trahison
  rationale: Dans ce contexte narratif, le nom désigne une violation concrète de la confiance, de la fidélité ou d’une obligation. « Trahison » en restitue clairement la portée relationnelle et morale.
- source_word: μεγάλην
  choice: grande
  rationale: L’adjectif intensifie la gravité de l’acte; « grande » reste proche du grec tout en étant naturel en français.
- source_word: ἀνταπέδωκεν
  choice: rendit
  rationale: Le verbe exprime ici la rétribution ou le retour de ce qui est donné; dans la formule française consacrée « rendre le mal pour le bien », « rendit » est précis et idiomatique.
- source_word: κακὰ
  choice: le mal
  rationale: Le pluriel neutre grec vise des actes ou traitements mauvais. Le singulier collectif français « le mal » conserve la dimension morale et forme un contraste net avec « le bien ».
- source_word: ἀντὶ ἀγαθῶν
  choice: pour le bien
  rationale: La préposition marque l’échange ou la contrepartie. « Pour le bien » rend cette relation de façon concise et naturelle dans l’antithèse française.
theological_decisions:
- issue: Portée morale de ἀθεσία
  choice: Une violation relationnelle concrète rendue par « trahison »
  alternative: « infidélité », « violation grave de la confiance » ou « acte d’impiété »
  rationale: Le contexte présente un acte de félonie envers des personnes ayant fait du bien. « Trahison » préserve cette force narrative et éthique sans transformer le terme en catégorie théologique technique.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’expression « rendre le mal pour le bien » est claire et idiomatique; l’alliance « grande trahison » maintient la proximité formelle avec le grec, tandis que la note conserve sa latitude sémantique.
