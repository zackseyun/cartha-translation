  yaml_path: translation/deuterocanon/1_maccabees/016/014.yaml
  text: Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
translation:
  language: fr
  text: Simon faisait la tournée des villes du pays et veillait à leur administration. Il descendit à Jéricho, accompagné de ses fils Mattathias et Judas, en l’an cent soixante-dix-sept, au onzième mois, c’est-à-dire le mois de Chebat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Sabat » ; « Chebat » est la forme française usuelle du nom de ce mois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοδεύων
  choice: faisait la tournée de
  rationale: Le participe évoque un déplacement de ville en ville, probablement dans le cadre d’une inspection. « Faisait la tournée de » rend ce mouvement répété sans surinterpréter sa fonction.
- source_word: τὰς πόλεις τὰς ἐν τῇ χώρᾳ
  choice: les villes du pays
  rationale: χώρα peut désigner un pays, un territoire ou une région. « Du pays » est naturel ici et distingue le territoire des villes qui s’y trouvent.
- source_word: φροντίζω τὰς ἐπιμελίας αὐτῶν
  choice: veillait à leur administration
  rationale: Malgré la forme difficile du texte grec, l’expression associe le souci attentif à la gestion ou à la surveillance des affaires des villes. Cette formulation française conserve cette portée administrative.
- source_word: κατέβη εἰς Ἰεριχώ
  choice: descendit à Jéricho
  rationale: Le verbe καταβαίνω comporte une indication de mouvement vers le bas, courante dans les récits de voyage bibliques.
- source_word: αὐτὸς καὶ Ματταθίας καὶ Ἰούδας καὶ οἱ υἱοὶ αὐτοῦ
  choice: accompagné de ses fils Mattathias et Judas
  rationale: La construction grecque est lourde, mais Mattathias et Judas sont présentés comme les fils de Simon. La formulation française rend clairement cette relation sans ajouter de renseignement.
- source_word: ἔτους ἑβδόμου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: en l’an cent soixante-dix-sept
  rationale: Il s’agit de la manière grecque d’indiquer la cent soixante-dix-septième année de l’ère employée dans le récit.
- source_word: μηνὶ ἐνδεκάτῳ
  choice: au onzième mois
  rationale: Traduction directe et idiomatique de l’indication calendaire.
- source_word: Σαβάτ
  choice: Chebat
  rationale: « Chebat » est une translittération française courante du nom sémitique de ce mois, représenté en grec par Σαβάτ.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Faisait la tournée » restitue l’activité suivie de Simon, tandis que « veillait à leur administration » conserve la nuance de sollicitude et de gestion. La phrase a été légèrement réorganisée pour être naturelle en français, sans effacer les indications historiques et calendaires.
