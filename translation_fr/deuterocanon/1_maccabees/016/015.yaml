  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
translation:
  language: fr
  text: Le fils d’Aboubos les accueillit par ruse dans la forteresse appelée Dok, qu’il avait construite. Il leur offrit un grand festin[a] et y dissimula des hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une grande fête où l’on buvait ». Le grec met particulièrement l’accent sur la boisson.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδέξατο
  choice: accueillit
  rationale: Le verbe désigne l’accueil de personnes reçues comme hôtes ; « accueillit » convient au cadre d’une hospitalité qui sert ici de piège.
- source_word: ὁ τοῦ Ἀβουβον
  choice: le fils d’Aboubos
  rationale: Cette tournure elliptique grecque est un patronyme. Le contexte identifie Ptolémée, mais le verset emploie seulement la filiation, que la traduction conserve.
- source_word: ὀχύρωματιν
  choice: forteresse
  rationale: Malgré la forme inhabituelle du texte grec, le mot désigne clairement un lieu fortifié. « Forteresse » est précis et naturel en français.
- source_word: τὸ καλούμενον Δὼκ
  choice: appelée Dok
  rationale: Rendu direct de la formule de dénomination, avec translittération sobre du nom propre grec.
- source_word: μετὰ δόλου
  choice: par ruse
  rationale: Cette formulation conserve l’idée explicite de tromperie et exprime naturellement en français la manière dont l’accueil a eu lieu, sans préciser davantage la nature du complot.
- source_word: ὃ ᾠκοδόμησεν
  choice: qu’il avait construite
  rationale: Le relatif neutre renvoie à l’ouvrage fortifié. Le plus-que-parfait indique naturellement que sa construction précédait cet accueil.
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: Il leur offrit un grand festin
  rationale: La tournure grecque met littéralement l’accent sur la boisson, mais désigne dans ce contexte une réception abondante. « Grand festin » transmet naturellement la scène, tandis qu’une note conserve la nuance lexicale.
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: y dissimula des hommes
  rationale: Le verbe exprime une action délibérée de dissimulation sur place en vue du piège. « Y dissimula » reste concis et proche du grec.
theological_decisions: []
