  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: fr
  text: Lui-même et son peuple établirent leur camp face à eux. Voyant que le peuple avait peur de traverser le torrent[a], il passa le premier. Les hommes le virent et traversèrent derrière lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cours d’eau saisonnier » ou « le lit du torrent » ; le terme grec désigne un cours d’eau alimenté surtout pendant la saison des pluies.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: établirent leur camp
  rationale: Le verbe désigne ici l’installation d’un camp dans un contexte militaire. La tournure française est naturelle et conserve ce cadre.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: en face d’eux
  rationale: L’expression indique une position directement devant le camp ou les forces adverses.
- source_word: δειλούμενον
  choice: avait peur
  rationale: Le participe exprime la crainte ressentie devant la traversée, sans nécessairement porter un jugement moral de lâcheté.
- source_word: διαπερᾶσαι
  choice: traverser
  rationale: Dans ce contexte géographique, le verbe signifie passer d’un côté à l’autre du cours d’eau.
- source_word: τὸν χειμάρρουν
  choice: le torrent
  rationale: χείμαρρους désigne un cours d’eau saisonnier ou son lit. « Torrent » est clair en français courant, tandis qu’une note préserve la précision géographique.
- source_word: διεπέρασεν πρῶτος
  choice: il passa le premier
  rationale: Cette formulation met en relief l’action exemplaire du chef tout en évitant une répétition immédiate de « traverser ».
- source_word: ὁ λαὸς αὐτοῦ / τὸν λαὸν
  choice: ses hommes / le peuple
  rationale: La première occurrence désigne les gens qui l’accompagnent dans le cadre militaire et se rend naturellement par « ses hommes »; la seconde conserve le terme collectif « peuple », conformément au grec.
- source_word: οἱ ἄνδρες
  choice: les hommes
  rationale: Le grec dit simplement « les hommes », sans possessif ni désignation explicite comme « soldats ».
- source_word: κατόπισθεν αὐτοῦ
  choice: derrière lui
  rationale: L’expression décrit leur déplacement dans son sillage; « derrière lui » en conserve l’image spatiale.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Ses hommes » explicite naturellement le groupe militaire à la première occurrence sans ajouter le mot « soldats ». Le découpage en trois phrases allège la longue coordination grecque tout en préservant l’enchaînement des actions.
