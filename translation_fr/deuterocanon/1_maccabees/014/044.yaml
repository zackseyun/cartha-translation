  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: fr
  text: Il n’est permis à personne, ni parmi le peuple ni parmi les prêtres, d’annuler l’une quelconque de ces dispositions, de contester ce qu’il dira, de convoquer sans lui une assemblée dans le pays[a], ni de revêtir la pourpre et de porter une agrafe d’or[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « d’organiser sans lui une faction dans le pays ». Le terme grec peut désigner un rassemblement, une coalition ou une assemblée à caractère factieux.'
    reason: lexical_alternative
  - marker: b
    text: La pourpre et l’agrafe d’or étaient des marques de rang ou d’honneur officiel.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: Il n’est permis à personne
  rationale: Rend clairement la prohibition officielle, dans un français moderne, sans accentuer indûment sa portée juridique.
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: ni parmi le peuple ni parmi les prêtres
  rationale: Exprime naturellement l’appartenance indiquée par les génitifs et conserve la distinction entre le peuple et les prêtres.
- source_word: ἀθετῆσαί τι τούτων
  choice: d’annuler l’une de ces dispositions
  rationale: Dans le contexte d’un décret public, ἀθετέω désigne la mise à l’écart ou l’invalidation; « dispositions » explicite sobrement le référent de τούτων.
- source_word: ἀντειπεῖν τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: de contester ce qu’il dira
  rationale: « Contester » garde l’idée de parler contre ou de s’opposer; le futur « dira » respecte la valeur prospective du participe futur passif.
- source_word: ἐπιστρέψαι συστροφὴν
  choice: de convoquer une assemblée
  rationale: La tournure grecque est difficile; ce choix convient au cadre civique tout en évitant d’imposer le sens plus péjoratif de faction ou de sédition.
- source_word: ἐν τῇ χώρᾳ ἄνευ αὐτοῦ
  choice: sans lui une assemblée dans le pays
  rationale: « Sans lui » traduit la dépendance à son autorité, tandis que « dans le pays » rend le territoire gouverné.
- source_word: περιβαλέσθαι πορφύραν
  choice: de revêtir la pourpre
  rationale: Formulation française concise et digne qui préserve la valeur symbolique de la pourpre comme marque de rang.
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: de porter une agrafe d’or
  rationale: Rend l’action de fixer ou porter cet ornement servant vraisemblablement d’insigne honorifique.
theological_decisions:
- issue: Nature de l’interdiction formulée par le décret
  choice: La phrase est rendue comme une restriction juridico-politique établissant l’autorité exclusive de Simon.
  alternative: Donner à συστροφή un sens explicitement séditieux et traduire par « organiser une faction » ou « fomenter un soulèvement ».
  rationale: Le contexte est celui d’un décret public. Comme συστροφή peut désigner un rassemblement, une coalition ou une faction, la traduction principale demeure neutre et la possibilité péjorative est signalée en note plutôt qu’imposée.
translation_notes:
  register: Français international moderne, clair et digne. La structure énumérative du décret est conservée, avec une syntaxe allégée. Les notes maintiennent l’ambiguïté lexicale de συστροφή et expliquent les insignes de rang.
