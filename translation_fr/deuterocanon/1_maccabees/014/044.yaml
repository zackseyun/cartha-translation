  text: καὶ οὐκ ἔξεστιν οὐδενὶ τοῦ λαοῦ καὶ τῶν ἱερέων ἀθετῆσαί τι τούτων καὶ ἀντειπεῖν τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις, καὶ ἐπιστρέψαι συστροφὴν ἐν τῇ χώρᾳ ἄνευ αὐτοῦ, καὶ περιβαλέσθαι πορφύραν καὶ ἐνπορποῦσθαι πόρπην χρυσῆν.
