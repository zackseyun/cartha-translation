  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: fr
  text: Après ces événements, Simon envoya Numénius à Rome ; il portait un grand bouclier d’or pesant mille mines[a], afin d’établir l’alliance avec les Romains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mine était une ancienne unité de poids ; l’expression décrit un objet d’un poids et d’une valeur exceptionnels, vraisemblablement destiné comme présent diplomatique.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français moderne; le singulier collectif « cela » reprend sans lourdeur les événements précédents.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent direct et naturel de l’aoriste narratif.
- source_word: Νουμήνιον
  choice: Nouménios
  rationale: Translittération française usuelle de la forme grecque du nom propre.
- source_word: εἰς Ῥώμην
  choice: à Rome
  rationale: Rend naturellement en français la direction exprimée par εἰς avec un nom de ville.
- source_word: ἔχοντα
  choice: porteur de
  rationale: Le participe qualifie Nouménios et indique l’objet diplomatique qu’il emportait; cette formulation est concise et digne.
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: un grand bouclier d’or
  rationale: « Bouclier » rend directement ἀσπίς, « grand » décrit sa taille et « d’or » indique clairement sa matière.
- source_word: ὁλκὴν μνῶν χιλίων
  choice: pesant mille mines
  rationale: Formulation idiomatique qui conserve explicitement l’unité de poids antique et la quantité du grec.
- source_word: εἰς τὸ στῆσαι
  choice: afin d’établir
  rationale: L’infinitif articulé exprime le but; « établir » convient au contexte diplomatique tout en laissant ouverte la nuance possible de confirmation officielle.
- source_word: πρὸς αὐτοὺς
  choice: avec les Romains
  rationale: Le pronom renvoie aux destinataires à Rome; expliciter « les Romains » évite en français une référence pronominale potentiellement floue.
- source_word: τὴν συμμαχίαν
  choice: l’alliance
  rationale: Équivalent direct du terme désignant une alliance politique ou militaire.
