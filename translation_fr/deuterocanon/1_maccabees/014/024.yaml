  source_fidelity: 'Le sens fondamental est bien rendu : Simon envoie un émissaire à Rome avec un grand bouclier d’or de mille mines, dans le but d’établir l’alliance avec les Romains. « Après cela » est possible, mais « Après ces événements » rend plus explicitement le pluriel de Μετὰ ταῦτα. La forme française usuelle du nom est « Numénius ».'
