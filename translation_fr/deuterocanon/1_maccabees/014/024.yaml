  terminology: « Bouclier », « d’or », « mines » et « alliance » sont appropriés. L’explicitation « les Romains » est justifiée par le référent de αὐτούς. La note culturelle est utile, mais « cadeau » présente comme explicite une fonction qui demeure contextuelle ; « présent diplomatique » formulé avec prudence est préférable.
