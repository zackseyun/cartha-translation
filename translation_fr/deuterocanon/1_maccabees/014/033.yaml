  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: fr
  text: Il fortifia les villes de Judée, ainsi que Bethsoura, située aux frontières de la Judée, là où se trouvaient autrefois les armes des ennemis, et il y établit une garnison composée d’hommes juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’hommes judéens ». Le grec peut désigner ici soit l’identité juive, soit l’origine régionale judéenne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: fortifia
  rationale: Le verbe désigne l’action de renforcer un lieu par des ouvrages ou des préparatifs défensifs; « fortifia » est précis et naturel dans ce contexte militaire.
- source_word: τὰς πόλεις
  choice: les villes
  rationale: « Villes » rend le sens ordinaire du nom et convient aux centres urbains placés dans un dispositif défensif.
- source_word: Βαιθσουρὰμ
  choice: Bethsoura
  rationale: Cette forme française translittère de près le nom grec tout en restant lisible.
- source_word: ἐπὶ τῶν ὁρίων
  choice: aux frontières
  rationale: La formule situe Bethsoura dans la zone limitrophe de la Judée; le pluriel du grec est conservé.
- source_word: ὅπλα
  choice: les armes
  rationale: Le terme désigne ici l’équipement militaire; « armes » est direct et courant.
- source_word: τῶν πολεμίων
  choice: des ennemis
  rationale: Le génitif indique à qui appartenaient les armes; « ennemis » en donne le sens immédiat.
- source_word: τὸ πρότερον
  choice: autrefois
  rationale: L’adverbe renvoie à une situation antérieure et se rend naturellement par « autrefois ».
- source_word: ἔθετο ἐκεῖ φρουράν
  choice: il y établit une garnison
  rationale: Dans ce contexte militaire, il ne s’agit pas seulement de placer une garde, mais d’installer une force chargée de tenir le lieu.
- source_word: ἄνδρας Ἰουδαίους
  choice: des hommes juifs
  rationale: « Hommes » conserve la désignation masculine explicite. Ἰουδαίους peut exprimer une identité juive ou judéenne; « juifs » est retenu dans le texte, sans exclure l’autre lecture.
theological_decisions:
- issue: Sens de Ἰουδαίους par rapport à Ἰουδαίας
  choice: Judée / hommes juifs
  alternative: Judée / hommes judéens
  rationale: Ἰουδαία est le nom géographique « Judée ». Pour Ἰουδαίους, l’identité ethnoreligieuse et l’appartenance régionale peuvent se recouvrir dans ce contexte. Le texte principal retient « juifs », tandis qu’une note préserve la lecture géopolitique possible.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est légèrement explicitée par « située » et « composée de » pour assurer une lecture fluide sans ajouter d’information substantielle.
