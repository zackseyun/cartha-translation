  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
translation:
  language: fr
  text: Ils lui écrivirent sur des tablettes de bronze[a] afin de renouveler avec lui l’amitié ainsi que l’alliance qu’ils avaient établie avec Judas et Jonathan, ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaques de bronze ». Le grec désigne des supports d’écriture en bronze, probablement destinés à conserver durablement un document public ou diplomatique.
    reason: Alternative lexicale et précision sur la nature du support.
lexical_decisions:
- source_word: ἔγραψαν
  choice: ils écrivirent
  rationale: Le verbe signifie simplement « écrire ». Le support en bronze implique une inscription durable sans qu’il soit nécessaire de préciser davantage le verbe.
- source_word: δέλτους χαλκᾶς
  choice: tablettes de bronze
  rationale: δέλτος désigne une tablette destinée à recevoir un texte, et χαλκᾶς en indique le matériau. Cette formulation conserve le caractère officiel et durable du document.
- source_word: τοῦ ἀνανεώσασθαι
  choice: afin de renouveler
  rationale: L’infinitif articulé exprime ici le but ; « afin de » le rend clairement et naturellement.
- source_word: φιλίαν
  choice: l’amitié
  rationale: Le terme désigne ici des relations amicales de nature diplomatique. « L’amitié » conserve la formulation grecque sans la surinterpréter.
- source_word: συμμαχίαν
  choice: l’alliance
  rationale: συμμαχία désigne une alliance politique ou militaire ; « alliance » en est l’équivalent français direct.
- source_word: ἔστησαν
  choice: avaient établie
  rationale: Dans ce contexte diplomatique, le verbe signifie établir une alliance. Le plus-que-parfait marque l’antériorité de cette alliance désormais renouvelée.
- source_word: πρὸς αὐτόν
  choice: avec lui
  rationale: Dans l’expression d’une relation diplomatique, πρὸς suivi de l’accusatif se rend idiomatiquement par « avec lui ».
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: Judas et Jonathan, ses frères
  rationale: L’apposition grecque identifie Judas et Jonathan comme les frères de Simon ; la virgule rend cette relation clairement en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La tournure « l’amitié ainsi que l’alliance » permet de respecter le relatif grec au singulier, qui se rapporte grammaticalement à « l’alliance », sans effacer le parallélisme diplomatique des deux termes.
