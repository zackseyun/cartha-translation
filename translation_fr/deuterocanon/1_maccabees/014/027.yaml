  text: 'And this is the copy of the writing: On the eighteenth of Elul[a], in the one hundred seventy-second year, and this was the third year under Simon the high priest,'
translation:
  language: fr
  text: 'Et voici la copie du document : le dix-huitième jour du mois d’Éloul[a], en l’an cent soixante-douze, et c’était la troisième année sous Simon, le grand prêtre,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éloul correspond approximativement à août-septembre.
    reason: Repère calendaire utile aux lecteurs modernes.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: copie
  rationale: Le terme désigne la copie ou le double d’un texte écrit; « copie » est naturel et exact dans ce contexte documentaire.
- source_word: γραφῆς
  choice: document
  rationale: Dans ce contexte officiel, le mot désigne un écrit administratif plutôt que l’Écriture sainte; « document » rend clairement cette fonction.
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  choice: le dix-huitième jour du mois d’Éloul
  rationale: L’ordinal au datif donne la date; l’ajout de « jour du mois » est idiomatique en français et explicite la formule sans en modifier le sens.
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: en l’an cent soixante-douze
  rationale: Cette formulation française naturelle restitue l’année 172 de l’ère employée par le texte.
- source_word: τοῦτο τρίτον ἔτος
  choice: qui était la troisième année
  rationale: La proposition précise la datation par rapport à la fonction de Simon; la tournure relative rend naturellement sa valeur explicative.
- source_word: ἐπὶ Σίμωνος τοῦ ἀρχιερέως
  choice: de Simon, le grand prêtre
  rationale: Dans cette formule chronologique, ἐπί avec le génitif situe l’année sous le mandat de Simon; la construction avec « de » s’accorde naturellement avec « troisième année ».
theological_decisions:
- issue: Sens de γραφή dans ce contexte
  choice: document
  alternative: écrit
  rationale: Le contexte juridique et commémoratif indique un acte écrit officiel. « Document » évite que le lecteur comprenne ici une référence technique aux Écritures, sans nier le sens général d’« écrit ».
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation conserve le caractère introductif et inachevé du verset, qui mène au contenu du document dans la suite. « Grand prêtre » est la désignation française biblique usuelle de ἀρχιερεύς.
