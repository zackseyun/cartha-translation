  - severity: low
    issue: « la troisième année de Simon »
    rationale: La construction grecque ἐπὶ Σίμωνος est une formule de datation signifiant « sous Simon » ou « durant la charge de Simon ». « Sous Simon, le grand prêtre » la restitue plus directement.
