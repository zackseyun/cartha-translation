  - severity: low
    issue: Introduction chronologique peu idiomatique
    rationale: La formulation nominale isolée « La cent soixante-douzième année » est moins naturelle que « Dans la cent soixante-douzième année », qui traduit aussi explicitement la préposition ἐν.
  revised_text: Dans la cent soixante-douzième année[a], le roi Démétrios rassembla ses forces et se rendit en Médie pour obtenir de l’aide, afin de faire la guerre à Tryphon.
