  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: fr
  text: Dans la cent soixante-douzième année[a], le roi Démétrios rassembla ses forces et se rendit en Médie pour obtenir de l’aide, afin de faire la guerre à Tryphon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette date est généralement comprise selon l’ère séleucide. Littéralement : « dans la deuxième, la soixante-dixième et la centième année ».'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: La cent soixante-douzième année
  rationale: La numération grecque est additive (« la deuxième, la soixante-dixième et la centième année »). La formulation française restitue naturellement la date tout en conservant son cadre chronologique.
- source_word: συνήγαγεν τὰς δυνάμεις αὐτοῦ
  choice: rassembla ses forces
  rationale: Dans ce contexte militaire, συνάγω désigne le rassemblement des forces armées, tandis que δυνάμεις garde naturellement son sens collectif au pluriel.
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: se rendit en Médie
  rationale: Le verbe indique un déplacement vers cette région sans imposer la nuance plus précise de « marcher » militairement.
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: pour s’assurer du soutien
  rationale: L’infinitif articulé exprime ici le but. ἐπισπάσθαι évoque l’action d’attirer ou d’obtenir à son profit, et βοήθεια une aide ou un appui; cette tournure est naturelle en français et conserve l’idée d’un soutien recherché.
- source_word: ὅπως πολεμήσῃ τὸν Τρύφωνα
  choice: afin de faire la guerre à Tryphon
  rationale: ὅπως avec le subjonctif exprime le but, et πολεμέω désigne ici l’action de mener la guerre plutôt qu’un seul affrontement.
- source_word: Δημήτριος / Τρύφωνα
  choice: Démétrios / Tryphon
  rationale: Ces formes françaises translittèrent clairement les noms grecs et correspondent à l’usage historique courant.
theological_decisions: []
