  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « s’assurer du soutien » ne rend pas explicitement l’aide recherchée « pour lui-même » et sonne incomplet sans complément; « obtenir de l’aide » restitue plus directement βοήθειαν et l’objectif exprimé par ἐπισπάσθαι. La double relation de but est conservée.
  naturalness: « La cent soixante-douzième année » employé seul est peu naturel dans une narration française contemporaine. « Dans la cent soixante-douzième année » est idiomatique et rend exactement ἐν ἔτει. La phrase révisée reste sobre et fluide.
  terminology: « Démétrios », « Médie » et « Tryphon » sont des formes françaises recevables. « Faire la guerre à » rend adéquatement πολεμήσῃ sans réduire l’action à un seul combat.
