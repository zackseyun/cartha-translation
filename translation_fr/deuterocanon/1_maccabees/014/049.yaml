  yaml_path: translation/deuterocanon/1_maccabees/014/049.yaml
  text: And copies of them were to be placed in the treasury[a], so that Simon and his sons might have them.
translation:
  language: fr
  text: Des copies[a] devaient en être déposées dans le trésor, afin que Simon et ses fils les aient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « doubles » ou « transcriptions » ; le grec désigne des reproductions de documents.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφα
  choice: copies
  rationale: Le terme désigne ici des reproductions de documents. « Copies » est le terme français moderne le plus naturel sans préciser indûment leur forme matérielle.
- source_word: θέσθαι
  choice: devaient être déposées
  rationale: L’infinitif reprend le contenu normatif de la décision formulée dans le contexte précédent. « Devaient être déposées » restitue cette valeur directive et convient à la conservation de documents.
- source_word: γαζοφυλακίῳ
  choice: trésor
  rationale: Le mot peut désigner le trésor ou la salle du trésor. « Trésor » est concis et convient ici à un lieu officiel de dépôt et de conservation.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but; « afin que » en conserve clairement la valeur finale dans un registre digne et courant.
- source_word: ἔχῃ
  choice: puissent les avoir
  rationale: Le subjonctif exprime le but visé. Le pronom « les » reprend naturellement les copies, objet sous-entendu en grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure passive conserve la formulation officielle du décret, tandis que « en » maintient la référence aux documents mentionnés auparavant sans les nommer plus précisément que le grec.
