  text: And they said that this document should be put on bronze tablets and set up in the court of the sanctuary, in a secure place.
translation:
  language: fr
  text: Ils dirent de consigner cet écrit sur des tablettes de bronze et de les ériger dans l’enceinte du sanctuaire, en lieu sûr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφή
  choice: écrit
  rationale: Le terme désigne ici le document officiel mentionné, sans imposer l’idée plus précise d’une inscription gravée.
- source_word: δέλτοις χαλκαῖς
  choice: plaques de bronze
  rationale: Rend naturellement le support matériel désigné par le grec, avec le pluriel conservé.
- source_word: περιβόλῳ τῶν ἁγίων
  choice: enceinte du sanctuaire
  rationale: « Enceinte » exprime l’espace délimité autour du lieu saint; « sanctuaire » restitue ici le sens collectif de τὰ ἅγια.
- source_word: τόπῳ πιστῷ
  choice: en lieu sûr
  rationale: Dans ce contexte matériel, πιστός qualifie un emplacement fiable ou sécurisé où le document pourra être conservé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve « ils dirent », proche de εἶπαν, plutôt que d’expliciter l’acte comme un décret. « Placer » évite d’ajouter au grec l’idée certaine de graver le texte, tandis que « dresser » respecte le changement de verbe et l’idée d’installer les plaques debout.
