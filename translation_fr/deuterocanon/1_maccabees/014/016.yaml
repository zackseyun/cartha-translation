  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
translation:
  language: fr
  text: À Rome[a], et même jusqu’à Sparte, on apprit que Jonathan était mort, et ils en furent profondément attristés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un verbe au singulier (« apprit »), avant de passer au pluriel (« ils furent profondément attristés »). La traduction comprend la phrase dans un sens collectif : à Rome, et jusqu’à Sparte, on apprit la nouvelle.'
    reason: La discordance grammaticale du texte grec entre le verbe singulier ἤκουσεν et le pluriel ἐλυπήθησαν mérite d’être signalée.
lexical_decisions:
- source_word: ἤκουσεν
  choice: on apprit
  rationale: Le singulier grec s’accorde difficilement avec le pluriel ἐλυπήθησαν qui suit. Le tour français impersonnel « on apprit » conserve le singulier grammatical tout en exprimant naturellement une réception collective de la nouvelle.
- source_word: ἐν Ῥώμῃ
  choice: À Rome
  rationale: Formulation locative idiomatique en français moderne pour une ville.
- source_word: καὶ ἕως Σπάρτης
  choice: et même jusqu’à Sparte
  rationale: ἕως avec le génitif marque l’étendue géographique, « jusqu’à Sparte »; « même » fait ressortir la portée du καί sans réduire Sparte à une simple seconde localisation.
- source_word: ἀπέθανεν
  choice: était mort
  rationale: Dans le discours indirect après un verbe au passé, le plus-que-parfait français situe naturellement la mort de Jonathan avant l’annonce reçue.
- source_word: ἐλυπήθησαν σφόδρα
  choice: l’on en éprouva une profonde tristesse
  rationale: Cette formulation rend le pluriel collectif et l’intensité de σφόδρα dans un français naturel et digne; « en » rattache explicitement la tristesse à la nouvelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le tour impersonnel « on apprit » évite d’imposer au singulier grec un sujet masculin précis et rend le sens collectif; la seconde proposition reprend ce collectif par « l’on ».
