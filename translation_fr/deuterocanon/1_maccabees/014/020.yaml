  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: fr
  text: 'Voici la copie des lettres que les Spartiates — leurs dirigeants et la cité — ont envoyées à Simon, le grand prêtre, aux anciens, aux prêtres et au reste du peuple juif, leurs frères : Salut !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: copie
  rationale: Le terme désigne la reproduction écrite d’un document ; « copie » est précis et naturel en français moderne.
- source_word: ἐπιστολῶν
  choice: lettres
  rationale: Le pluriel grec est conservé afin de ne pas effacer une particularité réelle du texte, même si la suite introduit une seule formulation épistolaire.
- source_word: Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: les dirigeants des Spartiates et la cité
  rationale: Cette formulation respecte la construction grecque et présente les autorités ainsi que le corps civique comme expéditeurs officiels.
- source_word: ἱερεῖ μεγάλῳ
  choice: grand prêtre
  rationale: « Grand prêtre » est le titre institutionnel consacré et idiomatique en français.
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Dans ce contexte politique et religieux, le mot désigne des responsables reconnus plutôt que de simples personnes âgées.
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: tout le reste du peuple juif
  rationale: La formulation exprime naturellement en français le reste du peuple envisagé comme corps collectif.
- source_word: ἀδελφοῖς
  choice: leurs frères
  rationale: L’apposition qualifie les destinataires et rend explicite le lien de fraternité diplomatique affirmé entre Spartiates et Juifs.
- source_word: χαίρειν
  choice: saluent
  rationale: Dans une adresse épistolaire, l’infinitif χαίρειν correspond à la formule de salutation ; intégré à la syntaxe française, « saluent » est naturel et clair.
theological_decisions:
- issue: Traduction du titre officiel ἱερεῖ μεγάλῳ
  choice: grand prêtre
  alternative: prêtre suprême ; grand sacrificateur
  rationale: « Grand prêtre » est le titre français courant et exact pour cette fonction juive, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Les deux-points et les guillemets rendent visible le passage de l’introduction à la formule de la lettre. Le pluriel « lettres » suit délibérément le grec, malgré la présentation subséquente d’une seule adresse.
