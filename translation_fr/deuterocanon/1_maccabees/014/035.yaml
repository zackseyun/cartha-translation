  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: fr
  text: Le peuple vit la fidélité[a] de Simon et la gloire qu’il avait projeté de procurer à sa nation. Ils l’établirent comme leur chef et grand prêtre, parce qu’il avait accompli tout cela, à cause de la justice[b] et de la fidélité[a] dont il avait fait preuve envers sa nation, et parce qu’il avait cherché par tous les moyens à élever son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « foi » ; le mot grec peut désigner aussi bien la foi que la fidélité ou la fiabilité. Dans ce contexte, il caractérise surtout la loyauté éprouvée de Simon.
    reason: lexical_alternative
  - marker: b
    text: Ou « droiture » ; le mot grec peut évoquer ici une conduite juste et droite envers la nation.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: fidélité
  rationale: Dans ce récit politique et historique, le terme qualifie la loyauté et la fiabilité démontrées par Simon envers sa nation. Une note conserve néanmoins le sens possible de « foi ».
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » conserve l’ampleur du grec, qui peut désigner l’honneur, le prestige ou la renommée que Simon voulait procurer à sa nation.
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: avait projeté de procurer
  rationale: Cette formulation exprime une intention mûrement délibérée orientée vers un résultat, dans un français naturel.
- source_word: ἔθνει
  choice: nation
  rationale: Le terme désigne ici la communauté nationale et politique de Simon.
- source_word: ἔθεντο
  choice: établirent
  rationale: Le verbe indique l’installation officielle de Simon dans ses fonctions.
- source_word: ἡγούμενον
  choice: chef
  rationale: Terme général qui exprime la direction sans préciser indûment une fonction politique particulière.
- source_word: ἀρχιερέα
  choice: grand prêtre
  rationale: Équivalent français consacré dans le contexte cultuel juif.
- source_word: δικαιοσύνην
  choice: justice
  rationale: Dans ce contexte public, « justice » rend naturellement la conduite équitable et droite de Simon ; « droiture » est signalé en note.
- source_word: συνετήρησεν
  choice: dont il avait fait preuve
  rationale: Cette tournure idiomatique française exprime le maintien concret et durable de la justice et de la fidélité envers la nation.
- source_word: ἐζήτησεν παντὶ τρόπῳ
  choice: avait cherché par tous les moyens
  rationale: Rend l’effort soutenu et l’étendue des moyens envisagés.
- source_word: ὑψῶσαι
  choice: élever
  rationale: Le verbe concerne ici l’élévation du statut, de l’honneur ou de la condition du peuple.
- source_word: λαὸν
  choice: peuple
  rationale: « Peuple » distingue naturellement λαός de ἔθνος, rendu plus tôt par « nation ».
theological_decisions:
- issue: Sens de πίστις dans l’éloge de Simon
  choice: fidélité
  alternative: foi
  rationale: Le contexte met en avant la loyauté et la fiabilité attestées par les actes de Simon. La note préserve toutefois l’ambiguïté lexicale du grec sans transformer ce passage historique en affirmation doctrinale abstraite.
- issue: Sens de δικαιοσύνη dans un cadre politico-historique
  choice: justice
  alternative: droiture
  rationale: « Justice » convient à la dimension publique de la conduite de Simon, tandis que « droiture » souligne davantage sa qualité morale ; la note conserve cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque est divisée en deux phrases pour la lisibilité, tout en conservant l’enchaînement causal. Les termes institutionnels restent sobres et historiquement adaptés.
