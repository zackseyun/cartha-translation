  yaml_path: translation/deuterocanon/1_maccabees/014/043.yaml
  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: fr
  text: qu’il soit chargé des affaires sacrées[a], que tous lui obéissent[b], que tous les documents du pays soient rédigés en son nom[c], et qu’il porte la pourpre et de l’or[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses saintes » ou « du sanctuaire ». Le grec emploie une expression large qui désigne les réalités ou les affaires sacrées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qu’il soit entendu de tous » ; ici, il s’agit de reconnaître son autorité et de lui obéir.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire que tous les documents officiels du pays devaient être établis sous son autorité.
    reason: cultural_note
  - marker: d
    text: La pourpre et l’or étaient des marques de haut rang et d’honneur officiel.
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ ... περὶ
  choice: soit chargé de
  rationale: Dans le contexte de ce décret, cette tournure exprime la responsabilité et la surveillance officielles, plutôt qu’une simple préoccupation personnelle.
- source_word: τῶν ἁγίων
  choice: des affaires saintes
  rationale: Le neutre pluriel grec est une expression large qui peut englober les réalités, les lieux ou les questions sacrées. « Affaires saintes » en conserve l’étendue sans la limiter au sanctuaire.
- source_word: ἀκούηται
  choice: que tous lui obéissent
  rationale: Littéralement « qu’il soit entendu » ; dans ce contexte d’autorité publique, le passif signifie qu’il doit être écouté au sens d’être suivi ou obéi.
- source_word: συγγραφαὶ
  choice: documents
  rationale: Le terme désigne ici des écrits ou actes officiels. « Documents » reste naturel et suffisamment large pour inclure divers instruments administratifs ou juridiques.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: en son nom
  rationale: La formule indique que les documents sont établis sous son nom et son autorité officielle.
- source_word: πορφύραν
  choice: la pourpre
  rationale: Le grec nomme la pourpre comme signe visible de rang, sans préciser un vêtement particulier.
- source_word: χρυσοφορῇ
  choice: porte ... l’or
  rationale: Le verbe signifie porter de l’or, probablement sous forme d’ornements. La coordination « porte la pourpre et l’or » restitue sobrement les deux insignes de dignité.
theological_decisions:
- issue: Étendue de τῶν ἁγίων
  choice: des affaires saintes
  alternative: du sanctuaire ; des choses saintes
  rationale: Le pluriel grec peut viser l’ensemble des responsabilités sacrées liées au Temple. La traduction conserve cette portée générale au lieu de la réduire au seul bâtiment du sanctuaire.
translation_notes:
  register: Français international moderne, fluide et digne. La structure en propositions coordonnées conserve la forme du décret grec, tandis que le vocabulaire administratif explicite naturellement sa portée.
