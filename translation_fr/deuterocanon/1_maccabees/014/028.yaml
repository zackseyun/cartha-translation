    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Σαραμέλ
  choice: À Saramel
  rationale: Avec un nom de lieu, ἐν peut se rendre par « à » ou « dans ». « À Saramel » est la tournure française naturelle pour situer une assemblée, tout en conservant le nom propre par translittération.
- source_word: ἐπὶ συναγωγῆς μεγάλης
  choice: lors d’une grande assemblée
  rationale: ἐπί avec le génitif situe ici l’occasion ou le cadre. συναγωγή désigne le rassemblement constitué, non un bâtiment synagogal ; « assemblée » garde le ton public et officiel, et « grande » préserve la portée possible de μεγάλη au-delà du seul nombre.
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  choice: des prêtres, du peuple, des dirigeants de la nation et des anciens du pays
  rationale: La série des groupes est conservée. « Dirigeants » rend ἄρχοντες sans imposer une fonction politique trop précise ; « nation » convient à ἔθνος dans ce contexte juif, et « pays » rend naturellement χώρα.
- source_word: ἐγνώσθη ἡμῖν
  choice: il nous a été déclaré ceci
  rationale: Le passif aoriste introduit une proclamation officielle. La formulation française garde le passif et prépare naturellement le contenu qui suit après les deux-points, sans désigner explicitement l’agent.
