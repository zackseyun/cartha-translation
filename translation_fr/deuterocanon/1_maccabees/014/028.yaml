  text: 'At Saramel[a], in a great assembly of the priests and the people and the leaders of the nation and the elders of the country[b], it was made known to us:'
translation:
  language: fr
  text: 'À Saramel[a], lors d’une grande assemblée des prêtres, du peuple, des dirigeants de la nation et des anciens du pays[b], il nous a été fait savoir :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dans Saramel ». La préposition grecque admet les deux traductions avec un nom de lieu.
