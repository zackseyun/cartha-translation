- from: Jonathan rassembla leur nation et devint leur grand prêtre, puis il fut ajouté à son peuple[a].
  to: Jonathan rassembla leur peuple et devint leur grand prêtre, puis il fut ajouté à son peuple[a].
  rationale: La seule modification remplace « nation » par « peuple » afin d’obtenir une construction française naturelle avec « rassembla ». Elle ne précise ni ne modifie le référent collectif de ἔθνος, et la distinction potentielle avec λαός n’est pas sémantiquement déterminante dans ce contexte. La formulation littérale finale et sa note sont maintenues afin de conserver l’image grecque et son idiome funéraire sans le réduire à une paraphrase.
