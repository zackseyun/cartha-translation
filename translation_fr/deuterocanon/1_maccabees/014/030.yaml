  text: And Jonathan gathered their nation[a], and became their high priest, and was added to his people.
translation:
  language: fr
  text: Jonathan rassembla leur peuple et devint leur grand prêtre, puis il fut ajouté à son peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut réuni à son peuple », expression biblique courante évoquant la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροισεν
  choice: rassembla
  rationale: L’aoriste de ἀθροίζω exprime l’action de rassembler ou de réunir. « Rassembla » est naturel en français et reste proche de l’image grecque.
- source_word: τὸ ἔθνος αὐτῶν
  choice: leur nation
  rationale: ἔθνος désigne ici la collectivité nationale. « Leur nation » conserve cette dimension collective et politique, tout en distinguant le terme de λαός dans la dernière proposition.
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: devint leur grand prêtre
  rationale: Avec un nom attribut, ἐγενήθη signifie naturellement « devint ». « Grand prêtre » est l’équivalent français courant de ἀρχιερεύς, et « leur » rend le datif αὐτοῖς.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: fut ajouté à son peuple
  rationale: Cette formulation reproduit au plus près le verbe προστίθημι et l’image grecque, tout en laissant la note expliciter l’idiome biblique relatif à la mort.
- source_word: λαός
  choice: peuple
  rationale: « Peuple » est l’équivalent collectif courant et digne de λαός.
theological_decisions:
- issue: Sens idiomatique de προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: fut ajouté à son peuple
  alternative: fut réuni à son peuple
  rationale: Le texte principal conserve l’image précise du grec sans réduire l’expression à une simple mention explicite de la mort. La note donne la tournure biblique plus familière et en indique le sens idiomatique.
translation_notes:
  register: Français moderne, sobre et digne. La coordination est légèrement allégée par « puis », qui marque naturellement la dernière étape du récit sans ajouter de contenu doctrinal.
