  source_fidelity: 'Le texte rend correctement les trois actions de l’original : Jonathan rassemble le groupe collectif visé (ἔθνος), devient leur grand prêtre, puis « est ajouté à son peuple » (προσετέθη πρὸς τὸν λαὸν αὐτοῦ), formule idiomatique associée à la mort. La coordination et les possessifs sont conservés sans interprétation doctrinale supplémentaire.'
  naturalness: '« Rassembla leur nation » est peu naturel en français moderne : on rassemble un peuple, une assemblée ou des personnes, tandis qu’une « nation » ne se rassemble normalement pas ainsi. « Leur peuple » est idiomatique et conserve le sens collectif de ἔθνος dans ce contexte. Le reste est sobre et naturel, hormis le littéralisme volontaire de la formule finale, utilement éclairé par la note.'
  terminology: '« Grand prêtre » est le terme français établi pour ἀρχιερεύς. Employer « peuple » pour ἔθνος comme pour λαός dans ce verset ne compromet pas la fidélité : la différence lexicale grecque ne correspond pas ici à une opposition terminologique que le français devrait maintenir au prix d’une formulation artificielle. La note préserve l’alternative idiomatique « réuni à son peuple ».'
