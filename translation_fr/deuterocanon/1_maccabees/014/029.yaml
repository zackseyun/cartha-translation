base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: fr
  text: Puisque des guerres avaient souvent éclaté dans le pays, Simon, fils de Mattathias, de la lignée de Joarib, ainsi que ses frères, s’exposèrent au danger[a] et résistèrent aux adversaires de leur nation, afin que leurs lieux saints[b] et la Loi subsistent, et ils couvrirent leur nation d’une grande gloire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se livrèrent au danger » ; l’expression souligne qu’ils s’exposèrent volontairement au péril.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur sanctuaire » ou « leurs choses saintes ». Le grec emploie un pluriel pouvant désigner les espaces sacrés ou l’ensemble des réalités consacrées.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils glorifièrent leur nation d’une grande gloire ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: Puisque des guerres avaient souvent éclaté dans le pays
  rationale: « Puisque » rend la valeur causale de ἐπεὶ; « avaient souvent éclaté » exprime naturellement la survenue répétée des guerres; « pays » désigne ici le territoire concerné.
- source_word: ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: de la lignée de Joarib
  rationale: La tournure grecque indique l’appartenance généalogique au groupe des descendants de Joarib; cette formulation évite en français l’expression maladroite « fils des fils » sans préciser indûment le degré de parenté.
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: s’exposèrent au danger
  rationale: Cette expression française naturelle conserve l’idée d’une exposition volontaire de soi au péril.
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις
  choice: résistèrent aux adversaires
  rationale: « Résistèrent » restitue l’opposition active exprimée par ἀντέστησαν, tandis qu’« adversaires » demeure assez large pour ὑπεναντίοις.
- source_word: τοῦ ἔθνους αὐτῶν
  choice: de leur nation
  rationale: Dans cette inscription publique et commémorative, ἔθνος possède une dimension collective et politique que « nation » préserve.
- source_word: ὅπως σταθῇ
  choice: afin que … subsistent
  rationale: Le subjonctif passif/intransitif de ἵστημι exprime ici le maintien ou la permanence; « subsistent » est naturel avec les lieux saints et la Loi.
- source_word: τὰ ἅγια αὐτῶν
  choice: leurs lieux saints
  rationale: Le pluriel neutre peut désigner les réalités, espaces ou objets sacrés. « Lieux saints » conserve le pluriel et l’ambiguïté mieux que le singulier « sanctuaire ».
- source_word: ὁ νόμος
  choice: la Loi
  rationale: Le contexte vise la Loi juive en tant qu’institution religieuse déterminée; la majuscule facilite cette identification en français.
- source_word: δόξῃ μεγάλῃ ἐδόξασαν
  choice: ils couvrirent leur nation d’une grande gloire
  rationale: Cette formulation conserve le substantif « gloire » et l’intensité de la construction apparentée grecque, tout en restant idiomatique en français.
theological_decisions:
- issue: Portée de ἔθνος dans le contexte juif
  choice: nation
  alternative: peuple
  rationale: « Nation » maintient la portée corporative et politique du terme dans le contexte commémoratif de 1 Maccabées, sans lui donner un sens nationaliste moderne.
- issue: Référent de τὰ ἅγια αὐτῶν
  choice: leurs lieux saints
  alternative: leur sanctuaire / leurs choses saintes
  rationale: Le grec est au pluriel et peut renvoyer aux espaces sacrés ou, plus largement, aux réalités saintes. Le texte principal conserve cette pluralité, tandis que la note signale les autres possibilités.
- issue: Sens de σταθῇ appliqué aux lieux saints et à la Loi
  choice: subsistent
  alternative: restent debout / soient maintenus
  rationale: « Subsistent » rend l’idée de préservation durable sans décider si le verbe vise un rétablissement institutionnel ou une simple continuité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton solennel d’une inscription honorifique, tout en évitant les calques peu naturels. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
