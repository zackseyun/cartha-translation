lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: furent lues
  rationale: Aoriste passif de ἀναγινώσκω, avec pour sujet implicite les lettres ou documents mentionnés dans le contexte. « Furent lues » rend directement le grec; la lecture à haute voix découle du cadre public sans qu’il soit nécessaire d’ajouter « publiquement ».
- source_word: ἐνώπιον
  choice: devant
  rationale: Rend naturellement l’idée de présence face à un groupe réuni, sans le littéralisme lourd de « devant la face de ».
- source_word: ἐκκλησίας
  choice: l’assemblée
  rationale: Dans ce contexte civico-religieux du judaïsme du Second Temple, ἐκκλησία désigne le corps réuni; « assemblée » évite l’anachronisme possible de « Église ».
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: En français, « à Jérusalem » est la tournure locative idiomatique correspondant à ἐν suivi du nom de ville.
