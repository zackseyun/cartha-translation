base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: fr
  text: Il fortifia Joppé, au bord de la mer, ainsi que Gazara[a], aux frontières d’Azôt, où les ennemis habitaient auparavant. Il y établit des Juifs et mit dans ces lieux tout ce qui était nécessaire à leur rétablissement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi employer « Guézer », forme du nom davantage associée à l’hébreu et plus familière ; le texte grec porte ici « Gazara ».
    reason: lexical_alternative
  - marker: b
    text: Le « rétablissement » peut désigner la remise en état de ces lieux ou l’établissement durable des communautés juives qui y furent installées ; la formulation grecque concise permet les deux nuances.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: fortifia
  rationale: Le verbe désigne l’action de rendre une ville sûre au moyen de fortifications ; « fortifia » est précis et naturel dans ce contexte.
- source_word: Ἰόππην
  choice: Joppé
  rationale: « Joppé » est la forme française traditionnelle et reconnaissable du nom grec de la ville antique.
- source_word: τὴν ἐπὶ τῆς θαλάσσης
  choice: au bord de la mer
  rationale: Cette formulation rend naturellement la localisation littorale exprimée par le grec, sans suggérer que la ville se trouve matériellement sur l’eau.
- source_word: Γάζαραν
  choice: Gazara
  rationale: La forme suit directement le nom grec Γάζαρα plutôt que de l’harmoniser silencieusement avec le nom hébreu plus connu, Guézer.
- source_word: τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  choice: aux frontières d’Azôt
  rationale: ὅρια peut désigner les frontières ou les confins d’un territoire ; la traduction conserve ici l’expression géographique concise du grec.
- source_word: οἱ πολέμιοι
  choice: les ennemis
  rationale: Équivalent direct du substantif pluriel désignant les adversaires hostiles.
- source_word: τὸ πρότερον
  choice: auparavant
  rationale: Rend clairement l’antériorité indiquée par l’expression grecque.
- source_word: κατῴκισεν
  choice: établit
  rationale: 'Le verbe a ici un sens causatif : Simon fit habiter des Juifs dans ces lieux. « Établit » exprime naturellement cette installation de population.'
- source_word: Ἰουδαίους
  choice: des Juifs
  rationale: Dans ce contexte, le terme désigne le peuple installé dans les villes ; « Juifs » est l’appellation française courante, tout en laissant subsister ses dimensions ethnique, religieuse et politique.
- source_word: ὅσα ἐπιτήδεια
  choice: tout ce qui était nécessaire
  rationale: Le grec peut englober les ressources, équipements ou provisions utiles ; cette expression ne réduit pas indûment le sens aux seules vivres.
- source_word: πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: à leur rétablissement
  rationale: ἐπανόρθωσις évoque le fait de remettre en état ou de rétablir. Le pronom français maintient l’ambiguïté concise du grec quant au référent exact.
- source_word: ἔθετο ἐν αὐτοῖς
  choice: mit dans ces lieux
  rationale: Cette tournure française naturelle rend l’idée de placer les éléments nécessaires dans les lieux précédemment nommés, sans le calque maladroit « mit en eux ».
theological_decisions:
- issue: Référent de τούτων dans « πρὸς τὴν τούτων ἐπανόρθωσιν »
  choice: Conserver « leur rétablissement » dans le texte et signaler l’ambiguïté en note.
  alternative: Préciser « la remise en état de ces villes » ou « l’établissement de ces communautés juives ».
  rationale: La formulation grecque est brève et peut orienter le lecteur vers les lieux restaurés ou vers les communautés qui y sont établies. Le texte ne justifie pas de trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été répartie en deux phrases pour éviter une période excessivement lourde, tout en conservant la progression du grec. Les toponymes suivent des formes françaises bibliques reconnaissables, sauf « Gazara », maintenu d’après la source grecque et expliqué en note.
