base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: fr
  text: En son temps, il réussit à chasser de leur pays les nations, ainsi que ceux qui se trouvaient dans la ville de David, à Jérusalem. Ceux-ci s’étaient construit une citadelle[a], d’où ils sortaient pour souiller les abords du sanctuaire et porter gravement atteinte à sa pureté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Acra », la citadelle fortifiée de Jérusalem.
    reason: Le grec ἄκραν est un nom commun signifiant « citadelle », mais il peut désigner ici la forteresse connue sous le nom d’Acra.
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: il réussit
  rationale: La tournure grecque, littéralement « cela prospéra entre ses mains », exprime ici le succès de son entreprise. « Il réussit » restitue naturellement cet idiome en français moderne.
- source_word: τοῦ ἐξαρθῆναι
  choice: à chasser
  rationale: Le verbe indique ici l’élimination d’une présence étrangère ou hostile du territoire. « Chasser » conserve l’idée d’expulsion sans imposer celle d’une extermination.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Ce terme désigne les peuples non juifs ou les puissances étrangères, mais « les nations » en conserve le sens lexical sans ajouter une interprétation confessionnelle.
- source_word: ἐκ τῆς χώρας αὐτῶν
  choice: de leur pays
  rationale: χώρα désigne le pays ou le territoire. Le pronom grec est conservé sans lever artificiellement l’ambiguïté éventuelle de son référent.
- source_word: ἄκραν
  choice: une citadelle
  rationale: Le nom commun signifie « citadelle » ou « forteresse ». Dans ce contexte, il peut aussi désigner spécifiquement l’Acra de Jérusalem, possibilité signalée en note.
- source_word: κύκλῳ τῶν ἁγίων
  choice: les abords du sanctuaire
  rationale: La formule grecque est condensée, littéralement liée à ce qui entoure « les choses saintes » ou « les lieux saints ». Le contexte du Temple justifie « les abords du sanctuaire » sans effacer la dimension cultuelle.
- source_word: ἐμίανον
  choice: souiller
  rationale: Le verbe exprime une contamination rituelle ou morale. « Souiller » convient au contexte cultuel.
- source_word: ἐποίουν πληγὴν μεγάλην ἐν τῇ ἁγνείᾳ
  choice: porter gravement atteinte à sa pureté
  rationale: L’expression signifie littéralement produire un grand coup ou dommage dans la pureté. Cette formulation française en restitue clairement la gravité et la portée cultuelle.
theological_decisions:
- issue: Vocabulaire cultuel relatif au Temple
  choice: « souiller », « sanctuaire » et « pureté »
  alternative: Employer des termes plus généraux comme « corrompre », « lieu sacré » et « intégrité »
  rationale: Le grec décrit une profanation liée à la pureté cultuelle des lieux saints. Un vocabulaire explicitement cultuel préserve cette dimension théologique sans la développer au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque est divisée en deux phrases pour améliorer la lisibilité, sans modifier les rapports logiques. Le rendu privilégie une équivalence optimale et conserve le vocabulaire cultuel du passage.
