  to: Le peuple décida d’accueillir ces hommes avec honneur et de déposer une copie de leurs paroles dans les registres officiels du peuple[a], afin que le peuple spartiate ait un mémorial. Ils en rédigèrent une copie pour Simon, le grand prêtre.
