  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: fr
  text: Le peuple décida d’accueillir ces hommes avec honneur et de déposer une copie de leurs paroles dans les registres officiels du peuple[a], afin que le peuple spartiate ait un mémorial. Ils en rédigèrent une copie pour Simon, le grand prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les livres désignés pour le peuple » ; il s’agit vraisemblablement d’archives ou de registres civiques officiels.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: Le peuple décida
  rationale: La tournure impersonnelle signifie littéralement « cela plut au peuple », formule qui, dans ce contexte civique, exprime une décision collective officielle. La formulation retenue est naturelle en français moderne.
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: d’accueillir ces hommes avec honneur
  rationale: ἐπιδέξασθαι désigne ici un accueil favorable, tandis que ἐνδόξως indique un traitement honorable et public. « Ces hommes » reprend naturellement les représentants déjà mentionnés sans préciser davantage leur fonction.
- source_word: τοῦ δέσθαι τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: de déposer une copie de leurs paroles
  rationale: Dans ce contexte documentaire, δέσθαι décrit la mise en dépôt d’une copie. « Leurs paroles » reste proche de λόγων tout en pouvant désigner leur message ou leur déclaration.
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: dans les registres officiels de la cité
  rationale: L’expression désigne littéralement les livres assignés ou désignés pour le peuple, c’est-à-dire les archives civiques officielles. « Registres officiels de la cité » transmet clairement cette réalité institutionnelle.
- source_word: τοῦ μνημόσυνον ἔχειν τὸν δῆμον τῶν Σπαρτιατῶν
  choice: afin que le peuple de Sparte en garde mémoire
  rationale: L’infinitif articulé exprime le but. μνημόσυνον peut désigner un mémorial ou un souvenir durable; « en garde mémoire » conserve la nuance commémorative dans un français idiomatique.
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ
  choice: Ils écrivirent aussi une copie de tout cela à Simon, le grand prêtre
  rationale: La formulation maintient l’acte d’établir une copie écrite et conserve le datif Σίμωνι comme destinataire, sans ajouter explicitement l’idée d’envoi, absente du verbe grec.
