  text: And he went and struck the camp of Demetrius, and captured him, and brought him to Arsaces, and put him in prison.
translation:
  language: fr
  text: Il alla attaquer le camp de Démétrios, le captura, le conduisit à Arsace et le mit en prison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: partit
  rationale: L’aoriste de πορεύομαι exprime ici le déplacement qui ouvre l’action. « Partit » est naturel dans ce récit et n’ajoute pas explicitement une nuance militaire.
- source_word: ἐπάταξεν
  choice: attaqua
  rationale: πάτασσω signifie littéralement frapper et, avec un camp pour objet, décrit naturellement une attaque. « Attaqua » évite l’ambiguïté peu idiomatique de « frappa le camp » sans affirmer explicitement une victoire.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, παρεμβολή désigne le campement d’une armée. « Camp » est courant, précis et concis.
- source_word: συνέλαβεν
  choice: captura
  rationale: Le verbe signifie saisir ou capturer. « Captura » convient au contexte militaire et évite les connotations judiciaires modernes d’« arrêta ».
- source_word: ἤγαγεν
  choice: amena
  rationale: ἄγω indique ici que le captif est conduit auprès d’une personne. « Amena » rend naturellement ce mouvement vers Arsace.
- source_word: Ἀρσάκην
  choice: Arsace
  rationale: « Arsace » est la forme française traditionnelle et usuelle du nom grec Ἀρσάκης.
- source_word: ἔθετο
  choice: mit
  rationale: τίθημι signifie mettre ou placer. « Mit » conserve la formulation concrète du grec, tandis que le complément précise l’emprisonnement.
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: φυλακή peut désigner la garde, la détention ou la prison. Avec « le mit », le contexte indique clairement l’emprisonnement, que « en prison » rend directement.
