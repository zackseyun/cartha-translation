  terminology: « Actes de l’assemblée du peuple », « ambassadeurs » et les formes Nouménios, Antiochos, Antipater et Jason conviennent. « Amitié » doit être conservé, avec une note sur sa valeur diplomatique possible, sans imposer « alliance ».
