  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
translation:
  language: fr
  text: 'Ils consignèrent dans les actes de l’assemblée du peuple[a] ce que ceux-ci avaient déclaré, en ces termes : « Nouménios, fils d’Antiochos, et Antipater, fils de Jason, ambassadeurs des Juifs[b], sont venus auprès de nous, renouvelant leur amitié envers nous[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les délibérations » ou « dans les décisions de l’assemblée du peuple ». L’expression grecque renvoie vraisemblablement à une consignation civique officielle.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec transmis comporte avant « Juifs » un alpha isolé (Α Ἰουδαίων), probablement dû à la transmission du texte et dépourvu ici de sens certain.
    reason: textual_variant
  - marker: c
    text: Dans ce contexte, « amitié » peut désigner des relations diplomatiques officielles.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγραψάμενοι
  choice: Après avoir consigné
  rationale: Le participe aoriste exprime une action préalable et désigne ici la mise par écrit dans un cadre officiel.
- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: ce qu’ils avaient déclaré
  rationale: Cette formulation rend le contenu de leurs paroles antérieures, avec un registre adapté à une démarche diplomatique.
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: dans les actes de l’assemblée du peuple
  rationale: βουλαί peut désigner des délibérations, décisions ou actes officiels. Le contexte documentaire appelle une formulation administrative, tout en conservant la référence au peuple.
- source_word: οὕτως
  choice: ils écrivirent ceci
  rationale: οὕτως introduit ici la teneur de la mention officielle. L’ajout explicite du verbe « écrivirent » rend naturel en français le passage à la citation après « avoir consigné ».
- source_word: πρεσβευταὶ
  choice: ambassadeurs
  rationale: Le terme désigne des représentants officiels chargés d’une mission diplomatique.
- source_word: Α Ἰουδαίων
  choice: des Juifs
  rationale: L’alpha isolé transmis avant Ἰουδαίων ne fournit pas de sens assuré; la construction intelligible désigne les ambassadeurs représentant les Juifs.
- source_word: ἀνανεούμενοι
  choice: pour renouveler
  rationale: 'Le participe indique le but de leur venue dans un français idiomatique : rendre à nouveau actuelle une relation diplomatique existante.'
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: les liens d’amitié qui nous unissent
  rationale: φιλία garde son sens d’amitié tout en ayant ici une portée diplomatique. Cette formulation évite de préciser abusivement qu’il s’agit nécessairement d’une alliance formelle.
