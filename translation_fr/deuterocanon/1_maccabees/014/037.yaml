  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: fr
  text: Il y installa des hommes juifs et la fortifia afin d’assurer la sécurité du pays et de la ville. Il rehaussa aussi les murailles de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: y installa
  rationale: 'Le verbe a ici un sens causatif : il établit des personnes comme résidents dans ce lieu. « Y installa » est naturel en français et garde cette nuance.'
- source_word: ἄνδρας Ἰουδαίους
  choice: des hommes juifs
  rationale: Cette traduction conserve la mention explicite d’hommes dans ἄνδρας et rend Ἰουδαίους dans son sens ethnoreligieux naturel ici.
- source_word: ὠχύρωσεν
  choice: la fortifia
  rationale: Le verbe désigne couramment l’action de renforcer militairement un lieu; « fortifier » convient au contexte défensif.
- source_word: πρὸς ἀσφάλειαν
  choice: afin d’assurer la sécurité
  rationale: La préposition exprime le but. Cette formulation française rend clairement la finalité sans alourdir la phrase.
- source_word: τῆς χώρας
  choice: du pays
  rationale: χώρα désigne ici le territoire plus large, mis en parallèle avec la ville. « Pays » préserve cette portée territoriale.
- source_word: τῆς πόλεως
  choice: de la ville
  rationale: πόλις signifie directement « ville »; le contexte renvoie vraisemblablement à Jérusalem sans qu’il soit nécessaire de l’expliciter dans cette proposition.
- source_word: ὕψωσεν
  choice: rehaussa
  rationale: Le verbe signifie rendre plus haut. « Rehaussa » exprime précisément l’augmentation de la hauteur des murailles sans imposer l’idée d’une reconstruction complète.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: les murailles de Jérusalem
  rationale: « Murailles » convient mieux que « murs » à l’enceinte défensive d’une ville et respecte le pluriel grec.
