  text: and he made him one of his Friends[a], and he honored him with great honor.
translation:
  language: fr
  text: Il le fit entrer au nombre de ses Amis[a] et lui accorda de grands honneurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses amis ». Le grec peut désigner soit des amis personnels, soit, plus probablement ici, les membres du cercle officiel des « Amis » du roi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν αὐτὸν τῶν φίλων αὐτοῦ
  choice: Il le fit entrer au nombre de ses Amis
  rationale: La construction exprime l’intégration de quelqu’un à un groupe. Cette formulation est naturelle en français et conserve le probable sens institutionnel de « ses Amis » à la cour hellénistique.
- source_word: ἐδόξασεν
  choice: lui accorda … des honneurs
  rationale: Dans ce contexte royal et politique, le verbe désigne l’octroi d’honneur ou de distinction, plutôt qu’une glorification au sens théologique.
- source_word: δόξῃ μεγάλῃ
  choice: de grands honneurs
  rationale: Le datif indique ici ce par quoi ou de quelle manière il fut honoré. Le pluriel idiomatique français rend naturellement l’importance de l’honneur conféré.
theological_decisions:
- issue: φίλοι désigne-t-il des relations personnelles ou un rang de cour ?
  choice: Amis, avec une majuscule, pour signaler le probable titre de cour
  alternative: amis, au sens de proches ou de compagnons personnels
  rationale: Dans l’usage royal hellénistique et dans 1 Maccabées, les « Amis » peuvent constituer un cercle officiel de dignitaires. La note maintient toutefois l’ambiguïté réelle du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Fit entrer au nombre de » explicite sans lourdeur l’intégration à une catégorie; « accorda de grands honneurs » évite une répétition peu naturelle tout en préservant le sens politique de δόξα.
