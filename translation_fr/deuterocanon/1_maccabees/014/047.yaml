  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: fr
  text: Simon accepta, et il consentit à exercer la fonction de grand prêtre, à être commandant et ethnarque des Juifs[a] et des prêtres, et à être à la tête de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le terme grec peut désigner les Juifs comme peuple ou les habitants de la Judée dans un sens géographique et ethnique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: accepta
  rationale: Le moyen exprime ici l’acceptation par Simon de la charge ou de la décision décrite dans le contexte; le français peut laisser l’objet implicite comme le grec.
- source_word: εὐδόκησεν
  choice: consentit
  rationale: Dans ce contexte, le verbe marque l’adhésion volontaire de Simon aux fonctions énumérées, plutôt qu’un simple sentiment de plaisir.
- source_word: ἀρχιερατεύσαι
  choice: exercer la fonction de grand prêtre
  rationale: L’infinitif verbal désigne l’exercice effectif de la grande prêtrise, nuance mieux conservée qu’avec le seul intitulé « être grand prêtre ».
- source_word: στρατηγός
  choice: commandant
  rationale: Ce terme accessible exprime l’autorité militaire sans imposer le grade moderne plus précis de « général ».
- source_word: ἐθνάρχης
  choice: ethnarque
  rationale: La translittération française conserve ce titre politique historique précis sans en fixer abusivement la portée constitutionnelle.
- source_word: Ἰουδαίων
  choice: Juifs
  rationale: Le contexte politico-national favorise la désignation du peuple juif dans son ensemble, tout en laissant possible le sens géo-ethnique « Judéens ».
- source_word: ἱερέων
  choice: prêtres
  rationale: Rendu direct du pluriel, qui présente les prêtres comme un groupe explicitement mentionné aux côtés des Juifs.
- source_word: προστῆσαι
  choice: être à la tête de
  rationale: Cette expression française naturelle rend l’idée d’être placé au-dessus, de présider ou de diriger.
- source_word: ἁπάντων
  choice: de tous
  rationale: Le masculin pluriel reprend collectivement les groupes précédemment nommés sans ajouter un référent absent du grec.
theological_decisions:
- issue: Portée du titre politique ἐθνάρχης
  choice: ethnarque
  alternative: chef du peuple / dirigeant de la nation
  rationale: Le maintien du titre historique préserve la texture institutionnelle du passage et évite de préciser excessivement la nature exacte de la fonction.
- issue: Sens de Ἰουδαίων
  choice: Juifs
  alternative: Judéens
  rationale: Le mot grec peut avoir un sens ethnique ou géo-ethnique. « Juifs » convient au cadre national du décret, tandis qu’une note conserve l’autre possibilité.
- issue: Rapport de ἁπάντων aux groupes énumérés
  choice: de tous
  alternative: de tous ceux-ci / de tout
  rationale: Le grec demeure concis et peut viser collectivement toutes les personnes ou composantes nommées; la traduction conserve cette relative indétermination.
translation_notes:
  register: Français international moderne, digne et lisible. « Grand prêtre » est l’appellation française courante; « ethnarque » conserve le titre historique, tandis que « être à la tête de tous » exprime naturellement l’autorité générale. Le texte ne surcharge pas la ponctuation de notes et maintient l’ambiguïté réelle de Ἰουδαίων.
