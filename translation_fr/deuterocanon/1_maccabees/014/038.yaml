  text: Et le roi Démétrios le confirma dans sa charge de grand prêtre, conformément à ces dispositions,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησεν
  choice: confirma
  rationale: Dans ce contexte politico-administratif, le verbe indique que Démétrios établit ou maintient Simon dans une fonction déjà reconnue. « Confirma » exprime naturellement cette ratification sans suggérer la création de la charge.
- source_word: ἀρχιερωσύνην
  choice: la charge de grand prêtre
  rationale: Le nom désigne la fonction ou la dignité de grand prêtre. « La charge de grand prêtre » est plus immédiatement compréhensible en français moderne que « le grand sacerdoce ».
- source_word: κατὰ ταῦτα
  choice: conformément à ces dispositions
  rationale: L’expression renvoie aux décisions ou conditions énoncées auparavant. « Ces dispositions » conserve ce renvoi tout en restant naturel dans un contexte officiel.
- source_word: βασιλεὺς Δημήτριος
  choice: le roi Démétrios
  rationale: Ordre usuel du titre et du nom en français, avec la forme française courante du nom grec.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne la personne en faveur de laquelle la charge est confirmée; le pronom indirect français rend cette relation avec concision.
