base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/007.yaml
  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: fr
  text: Il rassembla de nombreux captifs, prit le contrôle de Guézer, de Beth-Sour et de la citadelle[a], qu’il débarrassa de ses souillures. Personne ne s’opposa à lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Acra », c’est-à-dire la forteresse particulière de Jérusalem.'
    reason: Le mot grec peut être un nom commun signifiant « citadelle » ou désigner ici la forteresse connue sous le nom d’Acra.
lexical_decisions:
- source_word: συνήγαγεν αἰχμαλωσίαν πολλήν
  choice: rassembla de nombreux captifs
  rationale: Le singulier collectif αἰχμαλωσίαν, qualifié par πολλήν, désigne ici vraisemblablement un grand nombre de personnes emmenées captives. Cette formulation reste proche du grec tout en étant naturelle en français.
- source_word: ἐκυρίευσεν
  choice: prit le contrôle de
  rationale: Le verbe exprime l’idée de devenir maître de lieux ou d’en acquérir la maîtrise; cette traduction convient au contexte militaire sans présumer la durée de cette domination.
- source_word: Γαζάρων
  choice: Guézer
  rationale: Forme française usuelle du toponyme biblique correspondant à Gezer.
- source_word: Βαιθσούρων
  choice: Beth-Tsour
  rationale: Transcription française courante du toponyme sémitique, claire et reconnaissable.
- source_word: τῆς ἄκρας
  choice: la citadelle
  rationale: ἄκρα peut être compris comme le nom commun « citadelle ». La possibilité qu’il désigne spécifiquement l’Acra de Jérusalem est conservée en note.
- source_word: ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς
  choice: qu’il débarrassa de ses souillures
  rationale: La tournure française exprime naturellement l’élimination hors de la citadelle des réalités qui la rendaient impure. « Souillures » conserve la portée potentiellement cultuelle du pluriel grec.
- source_word: οὐκ ἦν ὁ ἀντικείμενος αὐτῷ
  choice: Personne ne s’opposa à lui
  rationale: Cette formulation idiomatique rend l’absence de quiconque se dressant contre lui, sans préciser davantage la nature de l’opposition.
theological_decisions:
- issue: Portée cultuelle de τὰς ἀκαθαρσίας
  choice: souillures
  alternative: impuretés; choses impures
  rationale: « Souillures » peut désigner une profanation ou une impureté religieuse sans limiter le texte à une interprétation purement rituelle ou matérielle.
- issue: Statut de ἄκρα
  choice: la citadelle dans le texte principal
  alternative: l’Acra
  rationale: Le grec permet la lecture comme nom commun, immédiatement intelligible. La lecture historique comme nom de la forteresse particulière de Jérusalem demeure explicitement signalée en note.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit historique écrit. Les toponymes suivent des formes françaises bibliques usuelles; la syntaxe est légèrement resserrée sans supprimer aucun élément du grec.
