    issue: Pronom sans antécédent clair dans « Ils le consignèrent ».
    rationale: Le seul nom immédiatement disponible est « liberté », qui est féminin ; « le » ne peut donc pas le reprendre. Le grec emploie κατέγραψαν avec un objet implicite, probablement l’acte, le décret ou les faits relatés. « Cela » restitue cette implicitation sans erreur grammaticale.
  - severity: low
    issue: « Colonne » est trop spécifique pour στήλη.
    rationale: στήλη désigne normalement une stèle ou un monument/pilier portant une inscription. « Stèle » est le terme français le plus exact dans ce cadre épigraphique.
