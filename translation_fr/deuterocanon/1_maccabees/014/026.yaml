  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: fr
  text: Car lui-même, ses frères et la maison de son père tinrent ferme ; ils repoussèrent loin d’eux les ennemis d’Israël et établirent pour lui[a] la liberté. Ils consignèrent cela sur des tablettes de bronze et placèrent celles-ci sur une stèle, sur le mont Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour lui ». Il peut s’agir d’Israël, considéré comme un peuple personnifié, ou éventuellement de Simon lui-même.'
    reason: Préserver l’ambiguïté du référent masculin singulier αὐτῷ.
lexical_decisions:
- source_word: ἐστήρισεν
  choice: tinrent ferme
  rationale: Le verbe peut signifier affermir, établir ou tenir ferme. Dans cette énumération de Simon, de ses frères et de sa maison paternelle, « tinrent ferme » exprime naturellement leur constance, tout en adaptant au pluriel l’accord singulier du grec.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Le sens familial ordinaire convient au contexte et n’exige pas l’élargissement à « proches » ou « membres de son clan ».
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: la maison de son père
  rationale: Cette formulation conserve l’expression sémitisante désignant la famille élargie ou la lignée paternelle, tout en restant intelligible en français biblique moderne.
- source_word: ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  choice: ils repoussèrent loin d’eux les ennemis d’Israël
  rationale: « Repoussèrent » garde la force militaire de ἐπολέμησαν et permet de rendre naturellement la valeur d’éloignement de ἀπʼ αὐτῶν, sans la supprimer.
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: établirent pour lui la liberté
  rationale: 'La formulation reste proche du grec : ἐλευθερία désigne la liberté, et αὐτῷ est explicitement masculin singulier. Une note signale l’incertitude de son référent.'
- source_word: κατέγραψαν
  choice: le consignèrent
  rationale: Le verbe exprime la mise par écrit ou l’enregistrement. « Consigner » convient à un texte officiel gravé sur un support durable ; le pronom reprend l’acte ou le fait qui vient d’être rapporté.
- source_word: ἐν δέλτοις χαλκαῖς
  choice: sur des tablettes de bronze
  rationale: δέλτοι désigne des tablettes destinées à l’écriture ; la préposition française « sur » est idiomatique pour le support d’une inscription.
- source_word: ἔθεντο ἐν στήλῃ
  choice: placèrent celles-ci sur une colonne
  rationale: Le démonstratif reprend clairement les tablettes. στήλη peut désigner une stèle, un pilier ou une colonne monumentale ; « colonne » est accessible et convient au support public décrit.
- source_word: ἐν ὄρει Σιών
  choice: sur le mont Sion
  rationale: C’est la tournure géographique française habituelle pour un monument situé sur le mont Sion.
theological_decisions:
- issue: Référent de αὐτῷ dans ἔστησαν αὐτῷ ἐλευθερίαν
  choice: Conserver « pour lui » dans le texte principal
  alternative: « pour Israël », « pour le peuple » ou « pour eux »
  rationale: Le grec porte un datif masculin singulier. Le contexte favorise probablement Israël envisagé comme une réalité collective personnifiée, mais Simon demeure un autre référent grammatical possible. Le texte ne tranche donc pas silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe a été légèrement fluidifiée par le point-virgule et la reprise explicite « ils ». L’expression « maison de son père » conserve volontairement la couleur familiale du texte source ; l’ambiguïté du pronom masculin singulier est maintenue et expliquée en note.
