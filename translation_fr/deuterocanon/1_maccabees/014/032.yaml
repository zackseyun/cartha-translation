base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/032.yaml
  text: Then Simon rose up and fought for his nation[a], and spent much of his own money, and armed the men of his nation's forces[b], and gave them wages.
translation:
  language: fr
  text: Alors Simon se leva[a] et combattit pour sa nation[b] ; il dépensa beaucoup de son propre argent, arma les hommes de l’armée de sa nation et leur versa une solde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme grecque imprimée ἀνέστησενσεν semble comporter une syllabe répétée par erreur ; le sens attendu est « se leva » ou « se dressa ».
    reason: textual_variant
  - marker: b
    text: Le grec ἔθνος peut aussi être traduit ici par « peuple » ; « nation » souligne son sens collectif et politique dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la progression temporelle du récit.
- source_word: ἀνέστησενσεν
  choice: se leva
  rationale: Le texte imprimé semble comporter une syllabe répétée et correspond manifestement à une forme de ἀνίστημι. « Se leva » conserve à la fois l’image et l’idée d’entrer en action.
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: combattit pour sa nation
  rationale: Avec πολεμέω, περί exprime ici le fait de combattre en faveur ou pour la défense de quelqu’un. « Nation » garde la dimension collective et politique de ἔθνος dans ce contexte.
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: dépensa beaucoup de son propre argent
  rationale: Rend directement l’action de dépenser, la quantité importante et le fait que les fonds appartenaient personnellement à Simon.
- source_word: ὡπλοδότησεν
  choice: arma
  rationale: Le verbe signifie fournir des armes ; « arma » est précis, concis et naturel.
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: les hommes de l’armée de sa nation
  rationale: δύναμις désigne ici une force militaire. « Les hommes » conserve la référence masculine explicite de ἄνδρας, tandis que « armée » donne en français le sens contextuel de la force organisée.
- source_word: ὀψώνια
  choice: une solde
  rationale: Dans un contexte militaire, le terme désigne la rémunération des soldats. Le collectif français « une solde » est plus idiomatique que « des salaires ».
theological_decisions:
- issue: Sens de ἔθνος dans le contexte juif
  choice: nation
  alternative: peuple
  rationale: Le passage présente le peuple juif comme un corps collectif doté d’une force militaire. « Nation » préserve cette nuance politique sans lui imposer une conception moderne du nationalisme.
- issue: Référence masculine de τοὺς ἄνδρας
  choice: les hommes
  alternative: les soldats
  rationale: Le grec désigne explicitement des hommes. La traduction conserve cette donnée plutôt que de la neutraliser, tout en laissant le complément militaire préciser leur fonction.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve l’enchaînement narratif du grec ; « solde » apporte la précision militaire sans alourdir le style.
