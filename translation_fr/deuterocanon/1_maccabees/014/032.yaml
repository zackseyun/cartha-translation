  text: τότε ἀνέστησενσεν Σίμων, καὶ ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ, καὶ ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ, καὶ ὡπλοδότησεν τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ, καὶ ἔδωκεν αὐτοῖς ὀψώνια.
