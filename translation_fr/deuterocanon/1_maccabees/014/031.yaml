  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: fr
  text: Leurs ennemis projetèrent d’envahir leur pays afin de détruire leur pays et de porter la main sur leurs lieux saints[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur sanctuaire » ou « leurs choses saintes » ; le grec emploie ici le pluriel.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: projetèrent
  rationale: Le verbe exprime ici la formation d’un dessein hostile. « Projetèrent » rend l’intention délibérée sans imposer l’idée d’une décision formelle.
- source_word: ἐμβατεῦσαι
  choice: d’envahir
  rationale: Le sens fondamental est « entrer dans », mais le contexte militaire et hostile justifie le français naturel « envahir ».
- source_word: χώραν
  choice: pays
  rationale: « Pays » convient aux deux occurrences et leur répétition préserve l’insistance du grec.
- source_word: τοῦ ἐκτρῖψαι
  choice: afin de détruire
  rationale: L’infinitif articulé exprime le but, et ἐκτρίβω indique une destruction complète. « Afin de détruire » est clair, digne et suffisamment fort.
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπί
  choice: porter la main sur
  rationale: Cette locution française naturelle exprime l’action hostile suggérée par l’idiome grec, sans préciser indûment la forme de l’agression.
- source_word: τὰ ἅγια
  choice: leurs lieux saints
  rationale: Le neutre pluriel peut désigner des lieux ou des réalités sacrés. « Lieux saints » conserve le pluriel et convient au contexte cultuel.
theological_decisions:
- issue: Sens de τὰ ἅγια dans le contexte cultuel
  choice: leurs lieux saints
  alternative: leur sanctuaire ; leurs choses saintes
  rationale: Le grec emploie un pluriel susceptible de désigner les lieux sacrés, le sanctuaire envisagé comme enceinte sacrée, ou les objets saints. Le texte principal maintient le pluriel sans réduire l’expression au seul sanctuaire.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « leur pays » reproduit celle du grec ; « porter la main sur » rend idiomatiquement l’image d’une intervention hostile.
