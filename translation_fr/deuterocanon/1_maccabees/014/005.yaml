  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
translation:
  language: fr
  text: Avec toute sa gloire, il prit Joppé pour en faire un port et en fit un point d’accès aux îles de la mer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ouvrit un accès vers les îles de la mer ». Le grec peut se rendre plus littéralement par « fit une entrée aux îles de la mer »; il indique probablement que Joppé servait de point d’accès aux liaisons maritimes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  choice: Avec toute sa gloire
  rationale: « Gloire » conserve le registre élevé de l’éloge et laisse ouvertes les nuances de prestige, d’honneur et de splendeur portées par δόξα.
- source_word: ἔλαβεν
  choice: il s’empara de
  rationale: Dans ce contexte historique et territorial, « s’empara de » exprime naturellement la prise de Joppé, sans préciser davantage que le grec les modalités de cette acquisition.
- source_word: τὴν Ἰόππην
  choice: Joppé
  rationale: « Joppé » est la forme française traditionnelle et courante du nom grec Ἰόππη.
- source_word: εἰς λιμένα
  choice: pour en faire un port
  rationale: εἰς exprime ici vraisemblablement le but ou le résultat. Cette tournure française rend clairement la fonction portuaire donnée à Joppé; « port » traduit naturellement λιμήν.
- source_word: ἐποίησεν εἴσοδον
  choice: en fit une voie d’accès
  rationale: La formule rend le sens fonctionnel de ποιέω avec εἴσοδος tout en conservant l’image d’une entrée ou d’un accès.
- source_word: ταῖς νήσοις τῆς θαλάσσης
  choice: aux îles de la mer
  rationale: Le datif est rendu par « aux », qui convient à l’idée d’un accès orienté vers les îles. « De la mer » préserve la formulation élevée du génitif grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe reste concise et élogieuse, conformément au contexte. Le pronom « en » explicite naturellement que Joppé devient le port puis la voie d’accès.
