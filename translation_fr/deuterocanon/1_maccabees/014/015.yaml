  text: He honored the holy things and increased the vessels of the sanctuary[a][b].
translation:
  language: fr
  text: Il honora les choses saintes[a] et augmenta le nombre des objets sacrés du sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il donna de l’éclat au sanctuaire » ou « Il honora les objets sacrés ». Le grec peut désigner les choses saintes ou, par extension, le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des récipients, ustensiles et autres objets employés dans le culte du sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Le neutre pluriel peut désigner les réalités ou objets sacrés, et par extension le sanctuaire. « Les choses saintes » préserve ici l’étendue du sens sans confondre les deux propositions.
- source_word: ἐδόξασεν
  choice: honora
  rationale: Le verbe exprime l’idée de conférer gloire ou honneur. Dans ce contexte historique et cultuel, « honora » est naturel et conserve le sens central.
- source_word: ἐπλήθυνεν
  choice: augmenta le nombre
  rationale: Le verbe signifie rendre plus nombreux. Cette formulation explicite naturellement qu’il accrut l’inventaire cultuel.
- source_word: τὰ σκεύη
  choice: les objets sacrés
  rationale: Dans un contexte cultuel, σκεύη désigne les récipients, ustensiles ou instruments employés dans le culte. « Objets sacrés » est clair en français courant tout en laissant la catégorie assez large.
- source_word: τῶν ἁγίων
  choice: du sanctuaire
  rationale: Le génitif désigne vraisemblablement le domaine sacré auquel appartiennent ces objets. « Du sanctuaire » rend clairement ce rapport dans le contexte du Temple.
