  yaml_path: translation/deuterocanon/1_maccabees/014/042.yaml
  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
translation:
  language: fr
  text: qu’il soit leur commandant, qu’il prenne soin de ce qui est saint[a] et qu’il nomme des responsables de leurs travaux, du pays, des armes et des forteresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sanctuaire » ou « au lieu saint » ; le texte grec transmis est difficile à cet endroit.
    reason: Leçon transmise difficile et référent incertain.
lexical_decisions:
- source_word: στρατηγόν
  choice: commandant
  rationale: Le terme désigne ici un chef militaire investi d’autorité; « commandant » conserve ce sens sans imposer un grade moderne précis.
- source_word: μέλῃ αὐτῷ
  choice: qu’il veille à
  rationale: Cette tournure exprime le soin et l’attention dont une personne a la charge; « veiller à » est naturel dans le registre d’un décret.
- source_word: τῶν Α ἅγιον
  choice: ce qui est saint
  rationale: Le texte grec transmis est difficile. Cette formulation garde un référent large et sacré sans décider qu’il s’agit nécessairement du bâtiment du sanctuaire.
- source_word: καθιστάναι
  choice: qu’il nomme des responsables
  rationale: Le verbe signifie établir ou nommer quelqu’un à une fonction. L’ajout de « responsables », implicite dans le contexte, rend en français la série des domaines placés sous leur autorité.
- source_word: τῶν ἔργων αὐτῶν
  choice: leurs travaux
  rationale: « Travaux » conserve le sens concret de ἔργα tout en convenant au contexte administratif.
- source_word: τῆς χώρας
  choice: du pays
  rationale: χώρα désigne le pays, la région ou le territoire; « pays » convient au contexte civique et politique.
- source_word: τῶν ὅπλων
  choice: des armes
  rationale: ὅπλα désigne l’armement ou les armes; « armes » est l’équivalent français courant et précis.
- source_word: τῶν ὀχυρωμάτων
  choice: des forteresses
  rationale: Le terme désigne des ouvrages ou lieux fortifiés; « forteresses » exprime clairement leur fonction militaire.
theological_decisions:
- issue: Référent de la leçon difficile τῶν Α ἅγιον
  choice: ce qui est saint
  alternative: le sanctuaire; le lieu saint
  rationale: La difficulté est avant tout textuelle et lexicale. Le rendu principal préserve l’indétermination du grec transmis, tandis que la note donne les interprétations localisées possibles sans en privilégier silencieusement une.
translation_notes:
  register: Français international moderne, digne et accessible, avec la cadence formelle d’un décret public. La coordination répétée du grec est légèrement allégée sans supprimer aucun domaine administratif.
