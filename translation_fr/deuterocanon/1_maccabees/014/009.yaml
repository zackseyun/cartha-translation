  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
translation:
  language: fr
  text: Les anciens étaient assis sur les places publiques ; tous s’entretenaient de ce qui était bon, et les jeunes hommes revêtirent des parures splendides[a] et des tenues de guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des gloires ». Dans ce contexte vestimentaire, l’expression désigne probablement des parures splendides ou honorifiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: les anciens
  rationale: Dans cette scène de vie publique, le terme désigne les hommes âgés et respectés de la communauté, sans imposer l’idée d’une fonction officielle.
- source_word: ἐν ταῖς πλατείαις
  choice: sur les places publiques
  rationale: Le mot grec peut désigner de larges rues ou des espaces ouverts en ville ; « places publiques » rend naturellement le cadre collectif.
- source_word: ἐκάθηντο
  choice: étaient assis
  rationale: L’imparfait grec plante le décor et décrit une situation qui se prolonge.
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: tous s’entretenaient de ce qui était bon
  rationale: Cette formulation conserve le caractère large de ἀγαθῶν — bonnes choses, bienfaits ou situation favorable — tout en exprimant la conversation commune indiquée par ἐκοινολόγουν.
- source_word: οἱ νεανίσκοι
  choice: les jeunes hommes
  rationale: Le terme grec désigne explicitement les jeunes hommes de la communauté.
- source_word: ἐνεδύσαντο
  choice: avaient revêtu
  rationale: Le moyen grec décrit le fait de se vêtir ; le plus-que-parfait s’intègre naturellement à la scène introduite par les imparfaits.
- source_word: δόξας
  choice: des parures splendides
  rationale: Le sens littéral « gloires » serait obscur en français. Dans ce contexte vestimentaire, le mot évoque un apparat visible, splendide ou honorifique ; une note conserve l’image grecque.
- source_word: στολὰς πολέμου
  choice: des tenues de guerre
  rationale: La locution signifie littéralement des vêtements ou tenues de guerre. Cette traduction préserve la référence vestimentaire sans la réduire nécessairement à l’armure.
