  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: fr
  text: 'Quand le peuple entendit ces paroles, il dit : « Quelle faveur rendrons-nous à Simon et à ses fils[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quelle reconnaissance rendrons-nous à Simon et à ses fils ? » Le grec χάρις peut désigner une faveur, des remerciements ou de la reconnaissance ; associé à « rendre », il exprime ici une idée de réciprocité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quand
  rationale: Introduit la circonstance temporelle qui provoque la réaction du peuple; « Quand » est naturel en français narratif sans surtraduire δέ.
- source_word: ἤκουσεν
  choice: entendit
  rationale: L’aoriste de ἀκούω désigne ici simplement le fait d’entendre; le passé simple convient au récit.
- source_word: ὁ δῆμος
  choice: le peuple
  rationale: Désigne la collectivité qui réagit d’une seule voix, sans imposer le sens institutionnel plus précis d’« assemblée ».
- source_word: τῶν λόγων τούτων
  choice: ces paroles
  rationale: Rend directement λόγοι et renvoie naturellement, en français, aux propos qui précèdent.
- source_word: Τίνα χάριν
  choice: en témoignage de notre reconnaissance
  rationale: Dans cette construction avec ἀποδώσομεν, χάρις évoque une réponse reconnaissante à un bienfait. Cette formulation française reste naturelle tout en laissant la note signaler les nuances de faveur, gratitude et remerciement.
- source_word: ἀποδώσομεν
  choice: Que rendrons-nous
  rationale: Le futur de ἀποδίδωμι signifie « rendre, donner en retour ». La question au futur conserve la valeur délibérative et le mouvement de réciprocité.
- source_word: Σίμωνι
  choice: à Simon
  rationale: Transcription française traditionnelle du nom propre Σίμων, avec le datif rendu par « à ».
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: à ses fils
  rationale: υἱοί désigne précisément les fils; le possessif rend αὐτοῦ sans neutraliser le terme.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le singulier « il dit » respecte l’accord grammatical avec le collectif « le peuple ». La tournure « Que rendrons-nous… en témoignage de notre reconnaissance ? » conserve le verbe de réciprocité du grec tout en évitant une expression peu idiomatique comme « rendre de la reconnaissance ».
