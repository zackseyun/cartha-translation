  yaml_path: translation/deuterocanon/1_maccabees/014/045.yaml
  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
translation:
  language: fr
  text: Mais si quelqu’un agit contrairement à ces dispositions ou écarte l’une quelconque d’entre elles, il sera tenu pour responsable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il sera coupable ». L’expression grecque peut désigner aussi bien la responsabilité juridique que la culpabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα ποιήσῃ
  choice: agit contrairement à ces dispositions
  rationale: Avec ποιέω, παρά suivi de l’accusatif exprime ici une action contraire aux prescriptions précédentes. « Ces dispositions » convient au contexte juridique du décret.
- source_word: ἀθετήσῃ
  choice: en annule
  rationale: Dans un cadre juridique, ἀθετέω peut signifier invalider ou priver d’effet. « Annule » conserve cette force juridique sans suggérer un simple oubli.
- source_word: τι τούτων
  choice: une seule
  rationale: L’expression partitive désigne n’importe laquelle des dispositions précédemment énumérées. « Une seule » rend naturellement en français la portée indéfinie de τι et souligne que toute disposition est concernée.
- source_word: ἔνοχος ἔσται
  choice: il sera tenu pour responsable
  rationale: ἔνοχος exprime la responsabilité ou la culpabilité, souvent avec une portée juridique. Cette formulation française reste claire et ne précise pas une peine absente du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, avec une légère tonalité juridique adaptée à un décret. Le singulier générique « quelqu’un » évite d’ajouter une précision de genre absente de la proposition indéfinie grecque.
