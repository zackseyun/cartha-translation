  text: And all the people approved that Simon should act according to these words[a].
translation:
  language: fr
  text: Et tout le peuple approuva que Simon agisse conformément à ces paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à ces dispositions ». Le grec dit littéralement « selon ces paroles », probablement en référence aux dispositions énoncées précédemment.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησεν
  choice: approuva
  rationale: Dans ce contexte de décision publique, l’aoriste exprime l’approbation collective du peuple plutôt qu’un simple sentiment de satisfaction.
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Cette formulation naturelle conserve la totalité exprimée par πᾶς et rend λαός sans lui donner le sens plus précis de « nation ».
- source_word: θέσθαι Σίμωνι ποιῆσαι
  choice: que Simon agisse
  rationale: La construction grecque est condensée. Cette formulation française en restitue naturellement le sens délibératif sans introduire explicitement une nomination que le texte n’énonce pas clairement.
- source_word: ποιῆσαι
  choice: agisse
  rationale: Dans ce cadre politique et administratif, « agir » exprime mieux que le vague « faire » la mise en œuvre de ce qui vient d’être énoncé.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: conformément à ces paroles
  rationale: « Ces paroles » conserve l’expression grecque, tandis que « conformément à » rend naturellement la relation normative indiquée par κατά.
