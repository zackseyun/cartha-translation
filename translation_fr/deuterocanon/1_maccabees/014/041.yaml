  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: fr
  text: et que les Juifs et les prêtres jugèrent bon que Simon soit leur chef et grand prêtre pour toujours, jusqu’à ce qu’un prophète digne de confiance se lève[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prophète fidèle » ou « un véritable prophète ». Le grec πιστόν peut signifier « fidèle » ou « digne de confiance » ; selon le contexte, « véritable » est aussi possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: avaient jugé bon
  rationale: Cette expression rend l’approbation favorable et formelle exprimée par le verbe, dans un français naturel et adapté au contexte d’une décision collective.
- source_word: ἡγούμενον
  choice: chef
  rationale: Le terme désigne ici la fonction dirigeante de Simon sans préciser un titre politique plus étroit comme « gouverneur ».
- source_word: ἀρχιερέα
  choice: grand prêtre
  rationale: C’est la désignation française courante de la fonction sacerdotale exprimée par le grec.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette traduction conserve la portée forte et ouverte de la formule grecque, sans l’affaiblir malgré la proposition limitative qui suit.
- source_word: ἕως τοῦ ἀναστῆναι
  choice: jusqu’à ce que se lève
  rationale: La tournure marque naturellement en français le terme prospectif du mandat de Simon et reprend l’image d’un prophète qui se lève.
- source_word: προφήτην πιστόν
  choice: un prophète digne de confiance
  rationale: πιστός peut qualifier une personne fiable, fidèle ou authentique. « Digne de confiance » exprime clairement ici la fiabilité ou la légitimité reconnue du prophète, tout en laissant les autres nuances en note.
theological_decisions:
- issue: 'Portée du mandat de Simon : εἰς τὸν αἰῶνα suivi d’une proposition introduite par ἕως'
  choice: Conserver à la fois « pour toujours » et « jusqu’à ce que », sans harmoniser leur tension.
  alternative: Atténuer « pour toujours » en « durablement », ou considérer la proposition suivante comme purement explicative.
  rationale: Le grec associe une concession apparemment permanente à une limite explicite liée à la venue d’un prophète. La traduction préserve les deux affirmations sans trancher leur articulation.
translation_notes:
  register: Français international moderne, clair et digne. « Avaient jugé bon » convient au ton d’un décret rapporté; « chef » évite d’attribuer au grec un office politique trop précis. La répétition de « leur » clarifie que Simon exerce les deux fonctions à leur égard.
