  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: fr
  text: Les envoyés[a] qui avaient été dépêchés auprès de notre peuple nous ont fait part de votre gloire et de votre honneur, et nous nous sommes réjouis de leur arrivée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les délégations qui avaient été envoyées auprès de notre peuple nous ont fait part… » Le grec peut désigner soit les missions diplomatiques elles-mêmes, soit les envoyés qui les composent ; le texte principal retient ce dernier sens, notamment en raison de la mention de « leur arrivée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι
  choice: les envoyés
  rationale: Le syntagme peut désigner une mission diplomatique ou ses membres. Le participe masculin pluriel ἀποσταλέντες et la mention ultérieure de « leur arrivée » favorisent ici le sens personnel. « Envoyés » est naturel et conserve le cadre diplomatique.
- source_word: οἱ ἀποσταλέντες
  choice: qui avaient été dépêchés
  rationale: Le plus-que-parfait marque clairement que l’envoi précède le compte rendu. « Dépêchés » convient au registre diplomatique sans être archaïque.
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: auprès de notre peuple
  rationale: δῆμος désigne ici le peuple envisagé comme corps civique. « Auprès de » convient à une mission diplomatique envoyée vers cette communauté.
- source_word: ἀπήγγειλαν ἡμῖν περὶ
  choice: nous ont fait part de
  rationale: Cette formulation française exprime une communication officielle tout en restant fluide et actuelle.
- source_word: τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: votre gloire et votre honneur
  rationale: La traduction directe maintient les deux notions coordonnées de renommée publique et de distinction, sans les fusionner.
- source_word: ηὐφράνθημεν
  choice: nous nous sommes réjouis
  rationale: Cette expression restitue la force de la joie exprimée et convient au ton solennel de la lettre.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: de leur arrivée
  rationale: ἐπί avec le datif indique ici le motif ou l’occasion de la joie. ἔφοδος peut désigner la venue ou l’arrivée; « arrivée » est concise et s’accorde avec la lecture personnelle d’« envoyés ».
