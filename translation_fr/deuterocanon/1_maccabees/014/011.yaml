  text: He made peace upon the land, and Israel rejoiced with great joy.
translation:
  language: fr
  text: Il établit la paix dans le pays[a], et Israël éprouva une grande joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre » ; le grec dit littéralement « sur la terre / le pays ».
    reason: γῆ peut désigner le pays ou la terre, et ἐπί signifie littéralement « sur » dans cette construction.
lexical_decisions:
- source_word: ἐποίησεν
  choice: Il établit
  rationale: Avec « la paix » comme complément, ποιέω exprime ici l’action d’instaurer une situation paisible. « Établit » est naturel en français et rend mieux cette valeur que le calque « fit ».
- source_word: τὴν εἰρήνην
  choice: la paix
  rationale: L’article grec se rend naturellement en français dans l’expression « établir la paix ».
- source_word: ἐπὶ τῆς γῆς
  choice: dans le pays
  rationale: Dans ce contexte, γῆ désigne vraisemblablement le pays ou le territoire d’Israël, non la terre entière. Avec une situation telle que la paix, le français idiomatique emploie « dans ».
- source_word: ηὐφράνθη
  choice: éprouva […] joie
  rationale: Cette forme exprime le fait de se réjouir. La tournure « éprouva une grande joie » est actuelle et permet de conserver le substantif apparenté qui suit sans lourde répétition.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française traditionnelle du nom du peuple.
- source_word: εὐφροσύνην μεγάλην
  choice: une grande joie
  rationale: L’accusatif renforce ou précise le verbe de réjouissance. « Une grande joie » restitue simplement cette intensité.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Il établit la paix » évite le calque peu naturel « il fit la paix », tandis que « éprouva une grande joie » préserve l’insistance du grec sur la joie sans produire une répétition maladroite.
