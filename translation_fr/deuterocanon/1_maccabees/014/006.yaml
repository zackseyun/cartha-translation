  text: Il agrandit les frontières de sa nation et prit le contrôle du pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: agrandit
  rationale: Le verbe signifie littéralement « élargir ». Avec « les frontières », « agrandit » exprime naturellement en français l’expansion territoriale.
- source_word: τὰ ὅρια
  choice: les frontières
  rationale: ὅρια désigne les limites ou frontières d’un territoire ; « les frontières » convient au contexte politique et territorial.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: de sa nation
  rationale: Le datif indique ici l’intérêt ou l’avantage de son ἔθνος. Dans ce contexte politico-national, « de sa nation » est idiomatique avec « agrandir les frontières » et conserve la notion de nation.
- source_word: ἐκράτησεν
  choice: prit le contrôle de
  rationale: Avec le génitif, κρατέω exprime la maîtrise ou la domination. « Prit le contrôle de » rend clairement l’acquisition de cette maîtrise sans affirmer nécessairement une propriété juridique.
- source_word: τῆς χώρας
  choice: du pays
  rationale: χώρα peut désigner un pays, une contrée ou un territoire. « Le pays » rend ici l’étendue territoriale tout en évitant de répéter « frontières ».
