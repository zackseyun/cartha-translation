  yaml_path: translation/deuterocanon/1_maccabees/014/012.yaml
  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: fr
  text: Chacun s’assit sous sa vigne et sous son figuier[a], et il n’y avait personne pour les effrayer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation reprend une expression biblique évoquant la paix et la sécurité ; comparer 1 Rois 4.25 et Michée 4.4.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: était assis
  rationale: L’expression conserve l’image concrète d’une personne assise paisiblement, tout en rendant naturellement en français la situation de sécurité décrite par l’aoriste grec.
- source_word: ἕκαστος
  choice: Chacun
  rationale: 'Le terme grec a un sens distributif : chaque personne bénéficiait de cette sécurité. « Chacun » n’ajoute aucune précision masculine absente du grec.'
- source_word: ὑπὸ
  choice: sous
  rationale: La préposition a ici son sens spatial et appartient à la formule biblique traditionnelle évoquant la paix et la sécurité.
- source_word: ἄμπελον
  choice: vigne
  rationale: « Vigne » est l’équivalent français naturel et traditionnel, qui préserve l’image agricole du grec.
- source_word: συκῆν
  choice: figuier
  rationale: Le nom grec désigne l’arbre ; « figuier » est précis et idiomatique en français.
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: personne ne les effrayait
  rationale: Le participe substantivé désigne quiconque aurait suscité la peur. Cette formulation française est naturelle et conserve le sens causatif d’ἐκφοβέω.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend collectivement les personnes qui jouissaient de cette sécurité.
theological_decisions:
- issue: Formule intertextuelle de paix (« sous sa vigne et sous son figuier »)
  choice: Conserver littéralement l’image agricole dans le texte principal.
  alternative: Paraphraser par une affirmation générale de paix et de prospérité.
  rationale: Cette image biblique reconnaissable exprime la paix et la sécurité. La conserver maintient les résonances scripturaires sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « sous » rend la coordination grecque avec naturel et maintient l’équilibre de la formule biblique.
