  text: And he ceased fighting against them on the earth[a], and their kings were crushed in those days.
translation:
  language: fr
  text: Il cessa de leur faire la guerre dans le pays[a], et leurs rois furent écrasés en ces jours-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sur la terre». Le grec peut désigner soit le territoire concerné, soit la terre dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν
  choice: cessa de faire la guerre
  rationale: La combinaison du verbe ἐκλείπω avec le participe πολεμῶν exprime ici la cessation de l’action militaire. Cette formulation française est naturelle et conserve explicitement l’idée de guerre.
- source_word: αὐτούς
  choice: leur
  rationale: Le pronom renvoie aux adversaires mentionnés dans le contexte; le complément indirect est exigé en français par «faire la guerre à».
- source_word: ἐπὶ τῆς γῆς
  choice: dans le pays
  rationale: Dans ce contexte historique et politique, γῆ désigne probablement le territoire concerné. Une note conserve toutefois le sens plus large possible de «terre».
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: leurs rois
  rationale: Le génitif αὐτῶν rattache naturellement ces rois aux adversaires précédemment évoqués.
- source_word: συνετρίβησαν
  choice: furent écrasés
  rationale: Le passif de συντρίβω évoque une défaite décisive; «furent écrasés» en garde la force dans un registre digne et courant.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: en ces jours-là
  rationale: Cette tournure restitue fidèlement l’expression temporelle grecque tout en restant idiomatique en français biblique moderne.
