  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: fr
  text: Ils cultivaient leur terre en paix ; la terre donnait ses produits, et les arbres des plaines[a], leurs fruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des champs » ou « de la campagne ». Le grec peut désigner des plaines ou, plus largement, des espaces ouverts.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  choice: cultivaient
  rationale: Le participe présent associé à l’imparfait ἦσαν décrit une activité agricole continue ; « cultivaient » est naturel et précis.
- source_word: τὴν γῆν αὐτῶν
  choice: leur terre
  rationale: Dans ce contexte agricole, γῆ désigne la terre qu’ils exploitent plutôt que la planète ou le pays au sens politique.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Cette expression nominale conserve l’idée de paix et de sécurité dans lesquelles le travail agricole s’effectuait.
- source_word: ἐδίδου
  choice: donnait
  rationale: L’imparfait exprime ici une production continue ou habituelle ; « donnait » garde aussi l’image simple du grec.
- source_word: τὰ γενήματα αὐτῆς
  choice: ses produits
  rationale: γενήματα désigne largement ce que la terre produit ; « produits » évite de réduire le sens aux seules récoltes céréalières.
- source_word: τὰ ξύλα
  choice: les arbres
  rationale: La mention de leur fruit montre que ξύλα désigne ici des arbres vivants, non du bois ou du bois d’œuvre.
- source_word: τῶν πεδίων
  choice: des plaines
  rationale: πέδιον désigne d’abord une étendue plane et ouverte. « Des plaines » préserve cette nuance géographique, tandis qu’une note signale les autres rendus possibles.
- source_word: τὸν καρπὸν αὐτῶν
  choice: leurs fruits
  rationale: Avec les arbres comme référent, « fruits » est le rendu direct et idiomatique de καρπόν.
