  text: But when they heard that Simon his brother had become high priest in his place and was ruling over the country and the cities in it,
translation:
  language: fr
  text: Mais lorsqu’ils apprirent que Simon, son frère, était devenu grand prêtre à sa place et qu’il gouvernait le pays ainsi que les villes qui s’y trouvaient,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Mais lorsqu’ils apprirent
  rationale: ὡς introduit ici une proposition temporelle, tandis que δέ marque une légère progression ou opposition narrative. « Mais lorsqu’ils apprirent » rend naturellement cet enchaînement.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: Simon, son frère
  rationale: L’apposition identifie Simon comme le frère de l’homme mentionné dans le contexte précédent. Les virgules rendent clairement cette relation en français.
- source_word: γέγονεν
  choice: était devenu
  rationale: Le parfait présente une accession accomplie dont le résultat demeure. Dans le discours indirect au passé, « était devenu » indique que Simon avait accédé à la fonction avant que la nouvelle ne soit apprise.
- source_word: ἀντ’ αὐτοῦ
  choice: à sa place
  rationale: ἀντί exprime ici le remplacement ou la succession dans une fonction. « À sa place » est précis et idiomatique.
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: « Grand prêtre » est l’appellation française courante et historiquement appropriée pour cette fonction juive.
- source_word: ἐπικρατεῖ
  choice: il gouvernait
  rationale: Dans ce contexte politique et territorial, ἐπικρατέω désigne l’exercice effectif de l’autorité. « Gouvernait » exprime cette domination sans suggérer seulement une victoire militaire.
- source_word: τῆς χώρας
  choice: le pays
  rationale: χώρα désigne ici l’ensemble du territoire, distingué des villes qui s’y trouvent. « Le pays » conserve cette portée large.
- source_word: καὶ τῶν πόλεων τῶν ἐν αὐτῇ
  choice: ainsi que les villes qui s’y trouvaient
  rationale: La formulation conserve le lien explicite entre le territoire et les villes situées en son sein. « Ainsi que » évite une coordination française pesante après « gouvernait le pays ».
theological_decisions:
- issue: Portée politique de ἐπικρατεῖ dans le récit historique
  choice: il gouvernait
  alternative: il avait autorité sur
  rationale: Le contexte décrit l’autorité civique et territoriale de Simon. « Il gouvernait » communique cette autorité effective sans introduire de notion théologique étrangère au passage.
translation_notes:
  register: Français international moderne, narratif et digne. La traduction conserve la structure de proposition inachevée du verset, signalée par la virgule finale, puisque la phrase se poursuit au verset suivant.
