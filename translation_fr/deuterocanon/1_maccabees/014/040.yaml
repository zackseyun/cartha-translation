base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/040.yaml
  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
translation:
  language: fr
  text: Car on avait appris que les Romains appelaient les Juifs leurs amis, leurs alliés et leurs frères, et qu’ils avaient reçu avec honneur les ambassadeurs de Simon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient allés à la rencontre des ambassadeurs de Simon avec honneur ». Dans ce contexte, il s’agit vraisemblablement d’une réception diplomatique officielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη
  choice: on avait appris
  rationale: La tournure impersonnelle rend naturellement le passif grec et indique que l’information était devenue connue, sans préciser qui l’avait rapportée.
- source_word: προσηγορεῦνται
  choice: appelaient
  rationale: Le verbe désigne ici l’attribution de titres ou d’appellations dans un cadre diplomatique. « Appelaient » reste clair et direct.
- source_word: φίλοι
  choice: amis
  rationale: Traduction directe qui conserve la valeur diplomatique possible du terme hellénistique sans la surinterpréter.
- source_word: σύμμαχοι
  choice: alliés
  rationale: Équivalent français courant du terme politique et militaire désignant les membres d’une alliance.
- source_word: οἱ ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel explicite et la désignation relationnelle de la formule diplomatique sont conservés.
- source_word: ἀπήντησαν
  choice: avaient reçu
  rationale: Le sens premier est « aller à la rencontre de », mais, avec des ambassadeurs, le contexte évoque une réception diplomatique officielle.
- source_word: πρεσβευταῖς
  choice: ambassadeurs
  rationale: Le terme désigne des représentants officiels ; « ambassadeurs » convient naturellement au contexte diplomatique.
- source_word: ἐνδόξως
  choice: avec honneur
  rationale: Cette expression française actuelle rend le traitement honorable et distingué indiqué par l’adverbe grec.
theological_decisions:
- issue: Rendu de οἱ ἀδελφοί dans une formule diplomatique
  choice: frères
  alternative: proches ; frères et sœurs
  rationale: Le grec emploie explicitement un masculin pluriel comme titre relationnel officiel. « Frères » préserve la forme et la tension du texte sans élargissement inclusif ni interprétation familiale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure causale du grec tout en explicitant les Romains comme sujet naturel de la seconde proposition. Le marqueur [a] est placé après la proposition qu’il explique.
