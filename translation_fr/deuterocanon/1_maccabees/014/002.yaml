base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/002.yaml
  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: fr
  text: Arsace, roi de Perse et de Médie, apprit que Démétrios était entré sur son territoire et envoya l’un de ses hauts responsables le capturer vivant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce contexte, ἀκούω désigne la réception d’une information. « Apprit » est plus naturel en français narratif que le littéral « entendit dire ».
- source_word: Ἀρσάκης
  choice: Arsace
  rationale: « Arsace » est la forme française traditionnelle et usuelle du nom royal grec Ἀρσάκης.
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: roi de Perse et de Médie
  rationale: Cette formulation rend directement les deux désignations géographiques dans leurs formes françaises courantes.
- source_word: ἦλθεν
  choice: était entré
  rationale: Le plus-que-parfait marque l’antériorité de l’arrivée de Démétrios par rapport à l’information reçue par Arsace. « Entré » s’accorde naturellement avec l’idée d’un déplacement sur le territoire royal.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française proche du grec, avec accentuation conforme à l’usage moderne pour les noms antiques.
- source_word: εἰς τὰ ὅρια αὐτοῦ
  choice: sur son territoire
  rationale: Bien que ὅρια désigne littéralement des limites ou frontières, le pluriel renvoie ici à la région placée sous l’autorité d’Arsace. « Sur son territoire » exprime naturellement ce sens politique et géographique.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent français direct et naturel de l’aoriste ἀποστέλλω dans ce récit.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: l’un de ses hauts responsables
  rationale: ἄρχων est un terme large pouvant désigner un dirigeant, dignitaire ou officier. « Haut responsable » conserve cette largeur sans imposer une fonction militaire précise que le grec n’explicite pas.
- source_word: συλλαβεῖν
  choice: le capturer
  rationale: Le verbe désigne ici le fait de s’emparer de Démétrios. « Capturer » convient au contexte politico-militaire et évite la nuance strictement judiciaire d’« arrêter ».
- source_word: ζῶντα
  choice: vivant
  rationale: Le participe précise que Démétrios devait être pris en vie; « vivant » est l’expression française idiomatique.
