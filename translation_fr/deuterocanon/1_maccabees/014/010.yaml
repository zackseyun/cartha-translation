  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
translation:
  language: fr
  text: Il fournit aux villes des vivres et les dota de matériel de fortification[a], jusqu’à ce que le nom de sa gloire soit nommé jusqu’aux confins de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner largement l’équipement défensif ou les moyens matériels servant à fortifier les villes.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « jusqu’à ce que le nom de sa gloire soit nommé jusqu’à l’extrémité de la terre ». L’expression indique que son nom glorieux devint connu partout.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐχορήγησεν βρώματα
  choice: approvisionna … en vivres
  rationale: ἐχορήγησεν exprime l’action de fournir ce qui est nécessaire, tandis que βρώματα désigne littéralement des aliments; «approvisionna … en vivres» convient naturellement au contexte civique et militaire.
- source_word: ἔταξεν αὐτὰς ἐν σκεύεσιν ὀχυρώσεως
  choice: les équipa de matériel de fortification
  rationale: La tournure grecque décrit la mise en état défensif des villes. «Matériel» conserve la portée générale de σκεύεσιν sans la réduire aux armes, et «de fortification» rend ὀχυρώσεως.
- source_word: ὠνομάσθη
  choice: soit proclamé
  rationale: Le passif signifie littéralement «soit nommé», mais, dans ce contexte de renommée étendue, «soit proclamé» restitue plus clairement l’idée que son nom fut publiquement mentionné et connu, sans remplacer celle-ci par une simple abstraction comme «renommée».
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: le nom de sa gloire
  rationale: Cette formulation maintient la construction génitivale inhabituelle et solennelle du grec, au lieu de la lisser entièrement en «son nom glorieux».
- source_word: ἕως ἄκρου γῆς
  choice: jusqu’aux extrémités de la terre
  rationale: Le grec a littéralement le singulier «jusqu’à l’extrémité de la terre»; le pluriel est l’expression française naturelle pour une diffusion universelle.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu mais accessible. Le texte privilégie une formulation naturelle pour l’action d’approvisionner et l’extension universelle de la renommée, tout en conservant dans le corps du verset la construction solennelle «le nom de sa gloire» et en signalant la formulation grecque très littérale en note.
