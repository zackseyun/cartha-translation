  yaml_path: translation/deuterocanon/1_maccabees/014/014.yaml
  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: fr
  text: Il affermit tous les humbles de son peuple[a] ; il rechercha la loi[b] et élimina tout ce qui était contraire à la loi et mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les gens de condition modeste de son peuple ». Le grec peut désigner aussi bien les personnes d’humble condition que celles qui sont humbles de disposition.
    reason: lexical_alternative
  - marker: b
    text: Ici, « la loi » désigne probablement la loi ancestrale juive, c’est-à-dire la Torah.
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: affermit
  rationale: Le verbe signifie rendre ferme, fortifier ou soutenir. « Affermit » conserve cette image tout en convenant à l’action d’un dirigeant envers les membres vulnérables de son peuple.
- source_word: πάντας τοὺς ταπεινοὺς
  choice: tous les humbles
  rationale: ταπεινός peut désigner les personnes d’humble condition aussi bien que celles qui sont humbles de disposition. « Les humbles » maintient cette double possibilité.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: de son peuple
  rationale: Cette formulation rend directement le génitif et sa valeur possessive.
- source_word: τὸν νόμον
  choice: la loi
  rationale: Dans ce contexte, νόμος désigne très probablement la loi ancestrale juive, la Torah. La minuscule évite toutefois d’ajouter au grec une distinction typographique interprétative.
- source_word: ἐξεζήτησεν
  choice: rechercha
  rationale: Le composé exprime une recherche active et attentive. « Rechercha » est naturel et garde cette idée de sollicitude diligente.
- source_word: ἐξῆρεν
  choice: élimina
  rationale: Le verbe signifie enlever ou faire disparaître. « Élimina » convient à l’action énergique décrite, sans préciser indûment s’il s’agit de personnes, de pratiques ou de réalités.
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: tout ce qui était contraire à la loi et mauvais
  rationale: Les adjectifs neutres substantivés englobent toute réalité caractérisée de la sorte. « Contraire à la loi » préserve le lien lexical avec νόμος, tandis que « mauvais » rend simplement πονηρόν.
theological_decisions:
- issue: Faut-il expliciter typographiquement que νόμος désigne la Torah ?
  choice: la loi
  alternative: la Loi
  rationale: Le contexte indique très probablement la Torah, mais le grec ne comporte aucune distinction de majuscule. Le texte principal reste donc peu interprétatif, et la note apporte la précision culturelle.
- issue: ταπεινούς désigne-t-il surtout une condition sociale ou une disposition morale ?
  choice: les humbles
  alternative: les gens de condition modeste
  rationale: Le mot grec permet les deux nuances. « Les humbles » conserve cette ambiguïté réelle plutôt que de la réduire à la pauvreté ou au seul caractère moral.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation maintient le parallélisme des trois actions et conserve les ambiguïtés lexicales importantes.
