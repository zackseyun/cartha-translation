  yaml_path: translation/deuterocanon/1_maccabees/014/004.yaml
  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: fr
  text: Le pays connut le repos pendant toute la vie de Simon. Celui-ci rechercha le bien de sa nation, et son autorité et sa gloire leur plurent durant toute sa vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  choice: Le pays connut le repos
  rationale: Dans ce contexte historique et national, γῆ désigne le territoire du peuple. « Connût le repos » exprime l’état paisible indiqué par ἡσυχάζω sans supposer un traité de paix officiel.
- source_word: πάσας τὰς ἡμέρας Σίμωνος
  choice: pendant toute la vie de Simon
  rationale: Cette formulation française naturelle rend l’idée de toute la durée des jours de Simon, c’est-à-dire de son vivant.
- source_word: ἐζήτησεν ἀγαθὰ τῷ ἔθνει αὐτοῦ
  choice: rechercha le bien de sa nation
  rationale: « Rechercher le bien » conserve l’idée d’une démarche active en faveur du bien-être collectif; « nation » maintient la dimension politique et ethnique de ἔθνος.
- source_word: ἡ ἐξουσία αὐτοῦ
  choice: son autorité
  rationale: « Autorité » rend la capacité légitime ou effective d’exercer le pouvoir sans introduire une nuance monarchique absente du grec.
- source_word: ἡ δόξα αὐτοῦ
  choice: sa gloire
  rationale: « Gloire » préserve le registre élevé et l’étendue sémantique de δόξα, qui peut inclure honneur et renommée.
- source_word: ἤρεσεν αὐτοῖς
  choice: leur plurent
  rationale: Le pluriel est naturel en français avec les deux sujets coordonnés, « son autorité et sa gloire », tandis que le sens évaluatif du grec est conservé.
- source_word: πάσας τὰς ἡμέρας
  choice: durant toute sa vie
  rationale: La reprise temporelle du grec est maintenue, avec une légère variation stylistique qui évite une répétition pesante en français.
theological_decisions:
- issue: Éloge politique du gouvernement de Simon
  choice: Présenter le verset comme une appréciation historique favorable de Simon.
  alternative: Donner au repos du pays un sens explicitement théologique ou messianique.
  rationale: Le grec n’attribue pas explicitement ce repos à une intervention divine et ne confère pas à Simon un rôle messianique; la traduction n’ajoute donc pas ces interprétations.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en divisant la longue coordination en deux phrases pour une lecture naturelle. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
