  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: fr
  text: 'La crainte et l’effroi qu’ils inspiraient s’abattirent sur tout le peuple, car ils disaient : « Il n’y a chez eux ni vérité ni justice, car ils ont violé l’accord[a] et le serment qu’ils avaient prêté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le pacte » ou « l’engagement » : le terme grec désigne ici un arrangement formel, confirmé par le serment qui l’accompagne.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: saisirent
  rationale: Le verbe exprime ici la survenue soudaine de la peur et de l’effroi. « Saisirent » transpose naturellement en français l’image grecque de sentiments qui tombent sur quelqu’un.
- source_word: αὐτῶν ὁ φόβος
  choice: la peur qu’ils inspiraient
  rationale: Le génitif αὐτῶν se comprend naturellement comme l’objet de la peur, c’est-à-dire la peur éprouvée à leur égard. Cette formulation française rend ce rapport sans lourdeur.
- source_word: ὁ τρόμος
  choice: l’effroi
  rationale: Dans ce contexte, τρόμος désigne l’état de terreur plutôt que le tremblement physique. « Effroi » le distingue de φόβος tout en conservant l’intensité du couple grec.
- source_word: εἰς πάντα τὸν λαόν
  choice: tout le peuple
  rationale: Avec ἐπιπίπτω, εἰς marque l’extension de la peur à l’ensemble du peuple. Le français l’exprime directement comme complément de « saisirent ».
- source_word: ἀλήθεια
  choice: vérité
  rationale: « Vérité » est le correspondant direct et conserve l’éventail de sens du terme, qui peut ici inclure la sincérité et la loyauté.
- source_word: κρίσις
  choice: justice
  rationale: Le contexte reproche une conduite injuste, non simplement une faculté de jugement. « Justice » rend donc la portée éthique du mot.
- source_word: παρῆρσαν
  choice: ont violé
  rationale: Le verbe décrit la transgression d’obligations formelles. « Violer » convient à la fois à un accord et à un serment et maintient un registre digne.
- source_word: τὴν στάσιν
  choice: l’accord
  rationale: Dans son association avec le serment, στάσις désigne ici l’arrangement formel conclu entre les parties. « Accord » évite d’imposer au mot une valeur théologique plus forte que le contexte ne l’exige.
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: le serment qu’ils avaient prêté
  rationale: Cette expression française idiomatique conserve le lien explicite entre le nom « serment » et l’action de jurer; le plus-que-parfait situe clairement le serment avant sa violation.
theological_decisions:
- issue: Faut-il rendre στάσις par un terme propre au langage d’alliance ?
  choice: accord
  alternative: alliance, pacte, engagement
  rationale: Le passage évoque bien une obligation formelle garantie par serment, mais στάσις n’impose pas à lui seul le sens théologique d’« alliance ». « Accord » maintient le caractère juridique et relationnel sans surinterprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde la coordination solennelle « ni vérité ni justice ». « La peur qu’ils inspiraient » explicite naturellement le génitif grec αὐτῶν, absent de la couche anglaise consultative.
