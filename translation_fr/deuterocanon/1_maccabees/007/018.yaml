    rationale: Dans « La peur qu’ils inspiraient et l’effroi », le relatif se rattache syntaxiquement à « peur » seulement. Le grec αὐτῶν se rapporte à φόβος et à τρόμος.
  - severity: low
    issue: Ajout de « tous »
    rationale: Le sujet implicite de εἶπον est simplement « ils » ; πάντα qualifie « le peuple » dans la proposition précédente, non les locuteurs.
