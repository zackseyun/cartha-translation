base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: fr
  text: Mais lorsqu’Alcime vit que Judas et ceux qui l’accompagnaient avaient gagné en puissance, et qu’il comprit qu’il était capable de leur résister[a], il retourna auprès du roi et porta contre eux des accusations malveillantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec imprimé dit littéralement : « il comprit qu’il était capable de leur résister ». Cette affirmation s’accorde difficilement avec la suite du récit ; certaines traductions rendent donc : « il n’était pas capable de leur résister ».'
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: Mais lorsqu’Alcime vit
  rationale: ὡς suivi de l’aoriste introduit ici une proposition temporelle, tandis que δέ marque une légère transition ou opposition narrative. « Mais lorsque » restitue naturellement les deux nuances.
- source_word: ἐνίσχυσεν Ἰούδας καὶ οἱ μετ’ αὐτοῦ
  choice: Judas et ceux qui l’accompagnaient avaient gagné en puissance
  rationale: ἐνίσχυσεν exprime un accroissement de force ou de puissance déjà acquis au moment où Alcime le constate. Le plus-que-parfait rend cette antériorité, et « ceux qui l’accompagnaient » traduit sans ajout οἱ μετ’ αὐτοῦ.
- source_word: ἔγνω
  choice: il comprit
  rationale: Le verbe indique ici qu’Alcime prend conscience de la situation. « Comprit » convient mieux au mouvement narratif que le simple « sut ».
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: il n’était pas capable de leur résister
  rationale: 'Le grec transmis et imprimé ne comporte pas de négation, mais le contexte narratif paraît exiger l’incapacité d’Alcime : constatant la puissance de Judas, il retourne auprès du roi. La traduction suit ce sens cohérent tout en signalant explicitement la difficulté textuelle en note.'
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: il retourna auprès du roi
  rationale: ἐπιστρέφω désigne ici le fait de revenir ou de retourner vers quelqu’un. « Auprès du roi » exprime naturellement la destination personnelle.
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: porta contre eux des accusations malveillantes
  rationale: κατηγορέω possède une nuance accusatoire, voire judiciaire, et πονηρά qualifie les accusations de mauvaises ou malveillantes. Cette formulation conserve à la fois l’acte d’accuser et son évaluation morale.
theological_decisions:
- issue: Sens de δύναται ὑποστῆναι αὐτούς dans le contexte
  choice: 'Traduire comme une incapacité : « il n’était pas capable de leur résister »'
  alternative: 'Traduire littéralement le texte grec transmis sans négation : « il était capable de leur résister »'
  rationale: La formulation grecque conservée affirme littéralement la capacité d’Alcime, mais cela s’accorde difficilement avec la suite immédiate, où il retourne auprès du roi après avoir constaté la puissance de Judas. Une négation a vraisemblablement été comprise ou perdue dans la transmission. Le texte principal suit le sens contextuellement cohérent, tandis que la note préserve la lecture attestée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le rythme narratif du grec sans archaïsmes. Le nom « Alcime » suit la forme française traditionnelle, et la difficulté textuelle majeure est rendue transparente par une note.
