  rationale: La révision remplace une paraphrase singulière et peu naturelle par « tes choses saintes », qui reflète le pluriel τὰ ἅγια tout en laissant ouverte la possibilité que le contexte vise notamment le sanctuaire. Elle simplifie aussi le connecteur initial sans modifier le sens. Le singulier « il / le » est conservé conformément au grec.
