base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: fr
  text: Ainsi, écrase aujourd’hui devant nous ce camp, et que les autres sachent qu’il a parlé avec méchanceté contre tes choses saintes[a] ; juge-le selon sa méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre ton sanctuaire ». Le grec dit littéralement « contre tes choses saintes », au pluriel ; l’expression peut désigner plus largement tout ce qui est consacré à Dieu, y compris le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  choice: écrase
  rationale: L’impératif aoriste appelle une destruction décisive. « Écrase » convient naturellement à une défaite militaire tout en gardant la force de l’image grecque.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, παρεμβολή désigne un camp ou un campement. « Camp » est précis et courant.
- source_word: ἐνώπιον ἡμῶν
  choice: devant nous
  rationale: Cette formulation rend directement l’idée de présence ou de spectacle sous les yeux des locuteurs.
- source_word: οἱ ἐπίλοιποι
  choice: les autres
  rationale: Le terme désigne ceux qui restent. « Les autres » préserve la portée générale sans préciser qu’il s’agit nécessairement de survivants.
- source_word: κακῶς ἐλάλησεν
  choice: il a parlé avec méchanceté
  rationale: κακῶς exprime ici la qualité moralement mauvaise de ses paroles, et non une simple maladresse d’expression.
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: contre ce qui t’est saint
  rationale: Le grec emploie un pluriel substantivé pouvant désigner les réalités saintes ou le sanctuaire. Cette formulation française reste naturelle tout en évitant de réduire d’emblée le référent à un seul lieu.
- source_word: κρῖνον αὐτὸν
  choice: juge-le
  rationale: « Juge-le » conserve le sens judiciaire fondamental de κρίνω sans expliciter à tort « condamne-le ».
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: selon sa méchanceté
  rationale: La formulation conserve le rapport exprimé par κατά entre le jugement demandé et la méchanceté de l’individu.
theological_decisions:
- issue: Référent singulier de αὐτόν après ἐλάλησεν
  choice: Maintenir « il » et « le » au singulier.
  alternative: Comprendre le singulier collectivement et employer une formulation visant l’ensemble du camp ou de l’armée.
  rationale: Le texte grec passe du collectif « ce camp » à un responsable singulier. Garder ce changement grammatical préserve la tension du texte sans identifier cet individu plus précisément que ne le fait le verset.
- issue: Portée de τὰ ἅγιά σου
  choice: Traduire dans le texte « ce qui t’est saint » et signaler « ton sanctuaire » en note.
  alternative: Traduire directement « ton sanctuaire ».
  rationale: Le pluriel grec peut englober les choses ou lieux saints et peut aussi désigner le sanctuaire. Le texte principal conserve cette amplitude, tandis que la note présente l’interprétation contextuelle plus précise.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe de prière directe. Le vocabulaire conserve la force militaire et judiciaire du grec sans archaïsme inutile.
