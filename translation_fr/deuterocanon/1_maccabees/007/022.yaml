  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
translation:
  language: fr
  text: Tous ceux qui semaient le trouble parmi leur peuple se rassemblèrent auprès de lui. Ils prirent le contrôle du pays de Juda et infligèrent un grand coup en Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». L’expression grecque peut désigner le peuple au sein duquel ce coup fut porté, et pas seulement un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: se rassemblèrent auprès de lui
  rationale: Le verbe passif de forme, accompagné de πρός et de l’accusatif, exprime ici un rassemblement orienté vers cet homme et une association avec lui, sans nécessairement évoquer un enrôlement formel.
- source_word: πάντες οἱ ταράσσοντες τὸν λαὸν αὐτῶν
  choice: tous ceux qui semaient le trouble parmi leur peuple
  rationale: Cette formulation conserve la valeur verbale du participe ταράσσοντες, rend explicitement le possessif αὐτῶν et exprime naturellement l’agitation causée au sein du peuple.
- source_word: κατεκράτησαν γῆν Ἰούδα
  choice: ils prirent le contrôle du pays de Juda
  rationale: κατακρατέω indique la prise de maîtrise ou de contrôle. « Prirent le contrôle » décrit une domination effective sans suggérer une possession juridique permanente; « pays de Juda » conserve le sens territorial de γῆ.
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: infligèrent un coup terrible
  rationale: L’expression grecque signifie littéralement qu’ils produisirent une grande atteinte ou un grand coup. Cette traduction garde l’image de la frappe sans limiter le sens à un massacre ou à une épidémie.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: La préposition ἐν signifie normalement « en » ou « parmi ». La traduction principale reste proche du grec et laisse ouverte la question de savoir si Israël désigne un lieu ou le peuple.
