  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: fr
  text: Une assemblée de scribes se réunit auprès d’Alcime et de Bacchidès pour rechercher ce qui est juste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice » ou « ce qui est conforme au droit ». Le grec peut avoir ici une portée à la fois morale et juridique.
    reason: Alternative lexicale destinée à préserver l’étendue de sens de δίκαια.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se réunit
  rationale: L’aoriste décrit ici le rassemblement d’un groupe. Le singulier s’accorde naturellement avec le sujet collectif « une assemblée ».
- source_word: πρὸς
  choice: auprès de
  rationale: Avec des personnes après un verbe de rassemblement, la préposition exprime le mouvement vers elles et l’association avec elles. « Auprès de » conserve cette nuance sans imposer une alliance.
- source_word: συναγωγὴ γραμματέων
  choice: une assemblée de scribes
  rationale: Dans ce contexte, συναγωγή désigne un groupe réuni et non un bâtiment; γραμματεῖς désigne les scribes du milieu juif.
- source_word: ἐκζητῆσαι
  choice: pour rechercher
  rationale: L’infinitif exprime le but. « Rechercher » rend l’idée d’une démarche délibérée sans préciser indûment sa forme.
- source_word: δίκαια
  choice: ce qui est juste
  rationale: Le neutre pluriel peut désigner les choses justes, le droit ou la justice. Cette formulation française reste naturelle tout en conservant l’étendue morale et juridique du grec.
- source_word: Ἄλκιμον
  choice: Alcime
  rationale: Forme française traditionnelle et intelligible du nom propre grec.
- source_word: Βακχίδην
  choice: Bacchidès
  rationale: Forme française usuelle du nom propre grec.
theological_decisions:
- issue: Portée de δίκαια dans un contexte politique
  choice: ce qui est juste
  alternative: la justice; leurs droits; des conditions équitables
  rationale: Le verset ne précise pas si les scribes cherchent une décision judiciaire, la reconnaissance de droits, un accord équitable ou plus largement ce qui est moralement juste. Le choix retenu préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure garde le caractère formel de l’assemblée tout en restant claire pour un lectorat général; les noms suivent les formes françaises usuelles.
