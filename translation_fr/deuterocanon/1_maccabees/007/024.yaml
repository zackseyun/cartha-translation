base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
translation:
  language: fr
  text: Il se rendit dans toutes les régions frontalières de la Judée et tout autour[a]. Il se vengea des hommes et de ceux qui avaient fait défection[b], et ils furent empêchés de se rendre dans le pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les régions alentour ». Le grec étend le parcours au-delà des régions frontalières proprement dites.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui avaient rejoint le camp adverse » ou « les transfuges ». Le grec désigne des personnes passées dans l’autre camp.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la région » ou « sur le territoire ». Le mot grec peut désigner un pays, une terre ou une région.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se rendit
  rationale: Dans ce récit de déplacement, cette tournure française exprime naturellement le fait de partir et d'aller dans les lieux indiqués, sans archaïsme.
- source_word: πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: toutes les régions frontalières de la Judée
  rationale: ὅρια peut désigner des limites ou les territoires situés aux confins. « Régions frontalières » convient mieux après εἰς que le calque peu naturel « dans toutes les frontières ».
- source_word: κυκλόθεν
  choice: dans les environs
  rationale: L'adverbe étend le parcours aux zones situées tout autour; cette formulation est claire et idiomatique en français moderne.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: exerça sa vengeance
  rationale: Cette expression conserve explicitement la force punitive de l'idiome grec sans la réduire au terme plus général « châtia ».
- source_word: ἐν τοῖς ἀνδράσιν
  choice: contre ces hommes
  rationale: Avec ἐκδίκησιν, ἐν désigne ici les personnes visées. Le démonstratif français reprend naturellement le groupe déjà identifiable dans le contexte, tout en laissant « hommes » sans qualification ajoutée.
- source_word: τοῖς αὐτομολήσασιν
  choice: ceux qui avaient rejoint le camp adverse
  rationale: αὐτομολέω désigne le passage volontaire dans l'autre camp. Cette formulation rend ce mouvement plus précisément que « déserté », qui pourrait simplement évoquer l'abandon de son propre camp.
- source_word: ἐνεστάλησαν
  choice: furent empêchés
  rationale: Le passif exprime une entrave effective et s'articule naturellement avec l'infinitif de déplacement.
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: de se rendre dans le pays
  rationale: L'infinitif indique l'action empêchée; χώρα peut désigner un pays, une terre ou une région. « Le pays » préserve ici la portée géographique générale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les calques (« dans toutes les frontières ») tout en conservant le vocabulaire explicite de la vengeance et le passif final. Le pronom « ils » maintient l'ambiguïté référentielle du grec au lieu d'identifier davantage les personnes empêchées.
