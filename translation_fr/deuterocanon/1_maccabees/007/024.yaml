  naturalness: Le français est globalement clair et moderne. « Il se vengea des hommes et de ceux qui avaient fait défection » est plus idiomatique que « Il exerça sa vengeance contre… » tout en gardant la force de ἐποίησεν ἐκδίκησιν. « Tout autour » rend naturellement l’adverbe κυκλόθεν sans faire des « environs » un second lieu insuffisamment déterminé.
  terminology: « Judée », « hommes », « fait défection » et « pays » conviennent. « Ceux qui avaient fait défection » restitue αὐτομολήσασιν sans préciser indûment quel camp ils ont rejoint. Le pronom « ils » maintient l’ambiguïté syntaxique présente dans le grec.
