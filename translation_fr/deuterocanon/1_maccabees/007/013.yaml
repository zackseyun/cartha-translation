  text: And the Hasideans were the first among the sons of Israel[a], and they sought peace from them.
translation:
  language: fr
  text: Les Assidéens furent les premiers parmi les fils d’Israël[a], et ils cherchèrent à obtenir d’eux la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». Le grec porte littéralement « parmi les fils d’Israël », expression traditionnelle désignant le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτοι
  choice: les premiers
  rationale: 'L’emploi prédicatif avec ἦσαν exprime la priorité : les Assidéens prirent l’initiative avant les autres.'
- source_word: Ἀσιδαῖοι
  choice: les Assidéens
  rationale: « Assidéens » est la forme française traditionnelle et reconnaissable de ce nom de groupe ; elle évite une paraphrase interprétative.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: parmi les fils d’Israël
  rationale: La préposition ἐν a ici le sens de « parmi ». La formulation conserve l’expression familiale et nationale traditionnelle du grec.
- source_word: ἐπεζήτουν
  choice: cherchèrent à obtenir
  rationale: Le verbe exprime une démarche visant à obtenir quelque chose. Le passé simple convient à la progression narrative française, même si l’imparfait grec peut aussi suggérer une action en cours ou tentée.
- source_word: παρʼ αὐτῶν
  choice: d’eux
  rationale: παρά avec le génitif indique la provenance. Le pluriel αὐτῶν est maintenu sans expliciter davantage son référent contextuel.
- source_word: εἰρήνην
  choice: la paix
  rationale: Le sens premier est conservé sans développer en « conditions de paix », ce qui ajouterait une précision politique absente du nom grec.
theological_decisions:
- issue: Traduction de l’expression identitaire et traditionnelle υἱοῖς Ἰσραήλ
  choice: parmi les fils d’Israël
  alternative: parmi les Israélites
  rationale: Le grec dit explicitement « fils d’Israël ». Cette expression nationale traditionnelle est conservée dans le texte, tandis que son équivalent courant est signalé en note.
translation_notes:
  register: Français moderne, naturel et digne. « Assidéens » conserve le nom historique du groupe ; « cherchèrent à obtenir d’eux la paix » rend idiomatiquement la construction grecque sans préciser abusivement la nature de l’accord recherché.
