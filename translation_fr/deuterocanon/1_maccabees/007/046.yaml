revisions:
- from: Alors des gens sortirent de tous les villages de Judée, de tous côtés, et prirent l’ennemi à revers[a]. Ceux-ci se retournèrent contre ceux-là, mais tous tombèrent sous l’épée, et il n’en resta pas même un.
  to: Ils sortirent de tous les villages de Judée, d’alentour, et les débordèrent[a]. Ceux-ci se retournèrent contre ceux-là[b], et tous tombèrent sous l’épée ; il n’en resta pas un seul.
  rationale: La révision conserve l’indétermination des groupes en remplaçant « l’ennemi » par le pronom « les » et rend le mouvement tactique par « les débordèrent », formulation naturelle qui n’impose pas une manœuvre par l’arrière. Elle supprime l’opposition ajoutée par « mais » et sépare les notes selon leurs ancres respectives.
