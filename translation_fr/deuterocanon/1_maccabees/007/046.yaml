  - severity: medium
    issue: « prirent l’ennemi à revers » est trop spécifique
    rationale: Dans ce contexte, ὑπερεφέρων peut suggérer un avantage tactique, un débordement ou possiblement un encerclement, mais ne requiert pas une attaque par l’arrière.
  - severity: low
    issue: Conjonction « mais » ajoutée
    rationale: Le grec enchaîne par καί (« et »); l’opposition explicite n’est pas nécessaire.
