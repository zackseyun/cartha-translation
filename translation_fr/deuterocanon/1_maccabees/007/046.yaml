translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’ambiguïté des pronoms grecs plutôt que d’identifier explicitement les deux groupes. « Des gens » explicite seulement le sujet humain sous-entendu par le pluriel grec, sans préciser leur identité.
