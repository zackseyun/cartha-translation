  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
translation:
  language: fr
  text: Ils sortirent de tous les villages de Judée, d’alentour, et les débordèrent[a]. Ceux-ci se retournèrent contre ceux-là[b], et tous tombèrent sous l’épée ; il n’en resta pas un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est inhabituel dans ce contexte. Il peut aussi évoquer l’idée de les encercler ou de prendre l’avantage sur eux.
    reason: alternative_reading
  - marker: b
    text: 'Le grec dit littéralement, dans une formule concise : « ceux-ci se retournèrent contre ceux-là ». Les référents des deux pronoms restent implicites dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: sortirent
  rationale: Verbe narratif simple qui exprime le mouvement depuis les villages, sans préciser inutilement le point de vue.
- source_word: κωμῶν
  choice: villages
  rationale: κώμη désigne normalement une localité rurale plus petite qu’une ville ; « villages » est clair et courant.
- source_word: κυκλόθεν
  choice: de tous côtés
  rationale: Rend naturellement l’idée d’un mouvement venant des alentours et convient à la scène d’encerclement tactique.
- source_word: ὑπερεφέρων
  choice: prirent l’ennemi à revers
  rationale: La forme est inhabituelle, mais le contexte militaire et κυκλόθεν suggèrent qu’ils obtiennent un avantage de position autour de l’ennemi. La note conserve les autres possibilités.
- source_word: ἀνέστρεφον
  choice: se retournèrent
  rationale: Préserve le sens concret de changement de direction sans imposer l’idée plus précise d’une retraite.
- source_word: οὗτοι πρὸς τούτους
  choice: Ceux-ci se retournèrent contre ceux-là
  rationale: Maintient la formulation pronominale contrastive et l’ambiguïté des référents présente dans le grec.
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: tous tombèrent sous l’épée
  rationale: Expression française naturelle et digne correspondant à l’idiome de mort au combat.
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: il n’en resta pas même un
  rationale: Conserve l’insistance de la double négation et de οὐδὲ εἷς sur l’anéantissement total.
