  yaml_path: translation/deuterocanon/1_maccabees/007/039.yaml
  text: And Nicanor went out from Jerusalem and camped at Beth-horon[a], and a force of Syria met him.
translation:
  language: fr
  text: Nicanor sortit de Jérusalem et établit son camp à Beth-Horôn. Une force de Syrie[a] vint à sa rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une armée de Syrie » ou « une force syrienne ». Le grec δύναμις peut désigner une force militaire ou une armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe exprime directement le mouvement hors de Jérusalem. « Sortit » reste fidèle sans ajouter l’idée, non explicite, d’une marche militaire.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans ce contexte militaire, le verbe signifie camper ou établir un camp. Cette formulation est naturelle en français moderne.
- source_word: Βεθωρών
  choice: Beth-Horôn
  rationale: Le nom de lieu est translittéré selon une forme française conventionnelle.
- source_word: συνήντησεν αὐτῷ
  choice: vint à sa rencontre
  rationale: Cette expression rend la rencontre sans préciser si la force venait rejoindre Nicanor comme renfort ou si elle l’abordait d’une autre manière.
- source_word: δύναμις Συρίας
  choice: une force de Syrie
  rationale: Dans un récit militaire, δύναμις désigne une force ou une armée. Le génitif Συρίας est rendu directement par « de Syrie », sans imposer une qualification politique plus précise.
