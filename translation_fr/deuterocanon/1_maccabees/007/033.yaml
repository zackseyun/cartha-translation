  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: fr
  text: Après ces paroles, Nicanor monta au mont Sion. Des prêtres sortirent du sanctuaire[a], ainsi que des anciens du peuple[b], pour le saluer dans la paix et lui montrer l’holocauste qui était offert pour le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du lieu saint ». L’expression grecque peut désigner plus précisément le sanctuaire ou l’enceinte sacrée.
    reason: lexical_alternative
  - marker: b
    text: La tournure grecque semble indiquer que seuls certains représentants des prêtres et des anciens sortirent, et non nécessairement tous.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: monta
  rationale: Rend naturellement le mouvement ascendant vers le mont Sion et conserve l’idiome géographique du grec.
- source_word: τὸ ὄρος Σιών
  choice: le mont Sion
  rationale: Forme française conventionnelle et claire du nom de lieu.
- source_word: ἐξῆλθαν
  choice: sortirent
  rationale: Exprime directement le mouvement depuis l’intérieur du lieu saint.
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: Des prêtres ... accompagnés de quelques anciens du peuple
  rationale: 'Le double ἀπό paraît partitif : il s’agit de membres de ces groupes, sans impliquer leur totalité. La formulation française évite une répétition lourde.'
- source_word: ἐκ τῶν ἁγίων
  choice: du sanctuaire
  rationale: Dans ce contexte cultuel, le pluriel substantivé désigne vraisemblablement le lieu ou l’espace saint d’où sortent les prêtres.
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: pour le saluer dans un esprit de paix
  rationale: Conserve à la fois l’acte de saluer et la disposition ou l’intention pacifique exprimée par l’adverbe, dans un français naturel.
- source_word: δεῖξαι αὐτῷ
  choice: lui montrer
  rationale: Équivalent direct et idiomatique de l’infinitif de but.
- source_word: τὴν ὁλοκαύτωσιν
  choice: l’holocauste
  rationale: Terme sacrificiel français traditionnel et précis pour une offrande entièrement consumée, sans employer la périphrase plus lourde « sacrifice entièrement brûlé ».
- source_word: τὴν προσφερομένην
  choice: qui était offert
  rationale: L’imparfait passif restitue l’action en cours exprimée par le participe présent.
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: pour le roi
  rationale: Formulation concise qui conserve la portée bénéfactive ou représentative de ὑπέρ sans la préciser excessivement.
