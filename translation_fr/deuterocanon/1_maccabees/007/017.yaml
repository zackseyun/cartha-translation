  text: They poured out the flesh of your holy ones and their blood around Jerusalem[c][b][a], and there was no one to bury them.
translation:
  language: fr
  text: Ils répandirent la chair de tes fidèles et leur sang autour de Jérusalem[c][b][a], et personne ne les ensevelit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes saints » ou « ceux qui te sont consacrés » pour « tes fidèles ».
    reason: lexical_alternative
  - marker: b
    text: Cette phrase reprend de très près le Psaume 79.2-3 (78.2-3 dans la Septante).
    reason: cross_reference
  - marker: c
    text: Ou « ils versèrent » ; le verbe grec signifie littéralement « verser, répandre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σάρκας
  choice: la chair
  rationale: Le pluriel grec désigne concrètement les chairs; le singulier collectif français « la chair » conserve l’image corporelle crue sans l’atténuer en « corps ».
- source_word: ὁσίων σου
  choice: de ceux qui te sont consacrés
  rationale: ὅσιος qualifie ici des personnes saintes, pieuses ou fidèles envers Dieu. Cette formulation garde la relation exprimée par « σου » et évite les connotations ecclésiastiques possibles de « saints ».
- source_word: ἐξέχεαν
  choice: ils ont répandu
  rationale: Le verbe signifie littéralement « verser, répandre ». « Répandu » convient aux deux compléments coordonnés, la chair et le sang, tout en conservant l’écho du psaume.
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: autour de Jérusalem
  rationale: La locution indique l’espace entourant Jérusalem; cette traduction est directe et naturelle.
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: personne n’était là pour les ensevelir
  rationale: Cette formulation idiomatique rend l’absence de toute personne susceptible d’assurer leur sépulture et conserve la force pathétique de la proposition grecque.
theological_decisions:
- issue: Sens de ὁσίων dans une lamentation faisant écho au langage scripturaire
  choice: ceux qui te sont consacrés
  alternative: tes saints; tes fidèles; ceux qui te sont attachés
  rationale: Le choix préserve la dimension sacrée et l’appartenance exprimée par « σου », sans imposer la notion plus tardive de saints officiellement reconnus. Une note signale les autres nuances légitimes.
translation_notes:
  register: Français international moderne, digne et accessible. « Ensevelir » est préféré à « enterrer » pour la sépulture, sans archaïsme marqué. L’ordre des appels de notes suit la position fournie dans la couche anglaise auditée.
