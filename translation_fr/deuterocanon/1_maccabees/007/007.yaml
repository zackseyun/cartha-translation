translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement est maintenu parce que le discours s’adresse directement à un souverain individuel et que le grec emploie la deuxième personne du singulier. La syntaxe est légèrement réorganisée en trois mouvements naturels : envoi, constat, punition.'
