  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: fr
  text: Maintenant donc, envoie un homme en qui tu as confiance. Qu’il aille constater toute la destruction que cet homme a causée contre nous et contre le territoire du roi, puis qu’il les punisse, eux et tous ceux qui leur viennent en aide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστειλον
  choice: envoie
  rationale: L’impératif simple et direct est rendu naturellement, sans solennité ajoutée.
- source_word: ἄνδρα ᾧ πιστεύεις
  choice: un homme en qui tu as confiance
  rationale: La proposition relative indique explicitement la confiance du destinataire envers cet homme, plutôt qu’une qualité générale de fiabilité.
- source_word: πορευθεὶς ἰδέτω
  choice: Qu’il aille constater
  rationale: Le participe suivi de l’impératif exprime une suite d’actions. « Aille constater » est idiomatique et convient ici à une vérification sur place, sans ajouter l’idée technique d’une inspection officielle.
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: toute la destruction
  rationale: Cette formulation conserve à la fois le sens de destruction ou de dévastation et l’insistance de ἅπασαν sur sa totalité.
- source_word: ἣν ἐποίησεν
  choice: que cet homme a causée
  rationale: « A causée » rend naturellement ποιέω avec le nom « destruction ». « Cet homme » explicite en français le sujet singulier distinct des groupes pluriels visés ensuite, sans l’identifier davantage.
- source_word: ἡμῖν
  choice: parmi nous
  rationale: Avec une destruction infligée à des personnes, « parmi nous » exprime naturellement les ravages subis par le groupe; le grec demeure littéralement orienté vers « nous ».
- source_word: τῇ χώρᾳ τοῦ βασιλέως
  choice: dans le territoire du roi
  rationale: χώρα désigne ici une région ou un territoire. « Territoire » évite la connotation moderne d’un État-nation que pourrait suggérer « pays ».
- source_word: κολάσατο
  choice: qu’il les punisse
  rationale: Le verbe appelle une action punitive. « Punir » reste neutre et ne renforce pas indûment le sens en « se venger ».
- source_word: τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: ceux qui leur viennent en aide
  rationale: La tournure conserve la valeur verbale du participe et l’idée d’assistance, sans limiter celle-ci au seul domaine militaire.
