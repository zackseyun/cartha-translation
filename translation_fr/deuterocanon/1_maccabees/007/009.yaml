  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: fr
  text: Il l’envoya avec Alcime l’impie, et ils établirent pour celui-ci la fonction sacerdotale[a]. Puis il lui ordonna d’exercer la vengeance parmi les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils établirent pour lui la prêtrise ». Dans ce contexte, il s’agit d’établir Alcime dans la fonction sacerdotale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « contre les fils d’Israël ». La préposition grecque peut indiquer le groupe au sein duquel la vengeance devait s’exercer, tandis que le contexte lui donne un sens hostile.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν αὐτὸν καὶ Ἄλκιμον
  choice: Il l’envoya avec Alcime
  rationale: Le grec coordonne les deux personnes envoyées. En français, « avec Alcime » exprime naturellement qu’elles sont envoyées ensemble sans alourdir la phrase.
- source_word: τὸν ἀσεβῆ
  choice: l’impie
  rationale: « Impie » conserve la portée religieuse et morale de ἀσεβής et convient au registre narratif biblique moderne.
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: ils établirent pour celui-ci la fonction sacerdotale
  rationale: Le pluriel « ils établirent » respecte la forme grecque ἔστησαν. « Pour celui-ci » désigne Alcime sans rendre le pronom ambigu, tandis que « fonction sacerdotale » exprime ici l’exercice institutionnel de la prêtrise.
- source_word: ἐνετείλατο
  choice: il lui ordonna
  rationale: Cette formulation restitue clairement la force autoritative du verbe grec et son complément personnel.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: d’exercer la vengeance
  rationale: La tournure française conserve l’idée littérale de mettre la vengeance à exécution sans la réduire à une sanction judiciaire.
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: parmi les fils d’Israël
  rationale: « Parmi » rend directement ἐν comme indication de la sphère où s’exerce la vengeance. La note signale le sens hostile « contre », fortement suggéré par le contexte.
theological_decisions:
- issue: Valeur du qualificatif ἀσεβής appliqué à Alcime
  choice: l’impie
  alternative: le méchant
  rationale: Le choix retenu préserve la condamnation spécifiquement religieuse exprimée par le narrateur, alors que « méchant » serait plus général.
- issue: Sens institutionnel de ἱερωσύνη
  choice: la fonction sacerdotale
  alternative: la prêtrise
  rationale: Le contexte concerne l’établissement d’Alcime dans une charge sacerdotale. La traduction ne précise toutefois pas « grand prêtre » dans le texte principal, puisque ce titre n’est pas exprimé ici par le grec.
- issue: Valeur de ἐν devant les fils d’Israël
  choice: parmi les fils d’Israël
  alternative: contre les fils d’Israël
  rationale: « Parmi » maintient la construction spatiale ou collective de ἐν, tandis que « contre » explicite la direction hostile de la vengeance. La note conserve cette ambiguïté réelle.
- issue: Désignation υἱοῖς Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formule traditionnelle et explicitement masculine du grec est conservée sans la neutraliser, tout en restant intelligible en français.
translation_notes:
  register: Français international actuel, digne et narratif. Le passé simple convient au récit historique. La reprise « pour celui-ci » évite d’attribuer la fonction sacerdotale au premier homme envoyé, et la variation du pluriel « ils établirent » au singulier « il ordonna » suit exactement les formes verbales du texte grec fourni.
