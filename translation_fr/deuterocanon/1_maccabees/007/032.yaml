  text: at Chaphar-salama. And about five thousand men of those with Nicanor fell[a], and they fled into the city of David.
translation:
  language: fr
  text: à Charpharasarama[a]. Environ cinq mille hommes parmi ceux qui étaient avec Nicanor tombèrent, et ils s’enfuirent dans la Cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom de lieu « Charpharasarama » transcrit le toponyme grec difficile Χαρφαρασαραμά ; d’autres transcriptions ou restitutions sont possibles.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: à
  rationale: Devant le nom de lieu, κατά a ici une valeur locale et indique le lieu de l’affrontement.
- source_word: Χαρφαρασαραμά
  choice: Chaphar-Salama
  rationale: Ce toponyme grec est difficile et probablement altéré dans la transmission. La forme retenue, lisible en français, suit une restitution traditionnelle sans masquer l’incertitude.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Dans un récit militaire, « tombèrent » exprime naturellement la mort au combat tout en conservant la concision du grec.
- source_word: τῶν παρὰ Νικάνορος
  choice: parmi ceux qui étaient avec Nicanor
  rationale: Cette formulation rend au plus près l’idée de personnes se trouvant aux côtés de Nicanor, c’est-à-dire ses forces, sans ajouter « soldats » ou « hommes de Nicanor ».
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: environ cinq mille hommes
  rationale: ὡς devant un nombre en marque l’approximation ; « environ » est naturel en français moderne.
- source_word: ἔφυγον
  choice: ils s’enfuirent
  rationale: Le pronom reprend naturellement les survivants du groupe mentionné, comme le permet le changement implicite de sujet en grec, sans ajouter « les autres ».
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: dans la Cité de David
  rationale: εἰς marque un mouvement vers l’intérieur. « Cité de David » est la désignation française consacrée de ce lieu.
