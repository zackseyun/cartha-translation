  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: fr
  text: 'Ils lui firent confiance, et ils saisirent[a] soixante hommes d’entre eux ; puis il les tua en un seul jour, selon les paroles qu’il avait écrites :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe ici du pluriel, « ils saisirent », au singulier, « il les tua ».
    reason: Construction grammaticale irrégulière du texte grec, qui influe sur l’attribution précise de l’action.
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: ils lui firent confiance
  rationale: Le verbe exprime ici la confiance accordée à une personne. Cette formulation est naturelle en français et évite une lecture excessivement doctrinale de « ils crurent en lui ».
- source_word: συνέλαβον
  choice: ils saisirent
  rationale: La forme grecque est à la troisième personne du pluriel. La traduction la conserve, malgré le passage au singulier dans le verbe suivant, afin de respecter la construction transmise et l’ambiguïté relative à l’action des hommes du chef.
- source_word: ἐξ αὐτῶν
  choice: parmi eux
  rationale: 'Cette expression rend clairement le sens partitif : les soixante hommes sont pris au sein d’un groupe plus large.'
- source_word: ἑξήκοντα ἄνδρας
  choice: soixante hommes
  rationale: Rendu direct et courant du nombre et du nom désignant ici des personnes de sexe masculin.
- source_word: ἀπέκτεινεν
  choice: il les tua
  rationale: Le singulier du grec est maintenu. « Tua » exprime directement l’acte sans lui attribuer une dimension judiciaire absente du texte.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: en un seul jour
  rationale: Cette tournure française naturelle souligne que tous les meurtres eurent lieu dans la même journée.
- source_word: κατὰ τοὺς λόγους
  choice: selon les paroles
  rationale: La formulation conserve le rapport explicite de conformité avec l’écrit cité ensuite.
- source_word: οὓς ἔγραφεν
  choice: qu’il avait écrites
  rationale: Le plus-que-parfait situe naturellement en français l’acte d’écrire avant les événements racontés. Le sujet masculin singulier demeure sans identification explicite, comme dans le grec.
theological_decisions:
- issue: Passage du sujet pluriel de συνέλαβον au sujet singulier de ἀπέκτεινεν
  choice: Conserver « ils saisirent… puis il les tua »
  alternative: 'Harmoniser au singulier : « il saisit… et les tua »'
  rationale: Le texte grec transmis présente réellement ce changement de nombre. Le conserver respecte la donnée source et laisse entendre, sans l’imposer, que le dirigeant agit par l’intermédiaire de ses hommes puis porte la responsabilité principale des meurtres.
- issue: Identité du sujet de οὓς ἔγραφεν
  choice: 'Maintenir le pronom non identifié : « qu’il avait écrites »'
  alternative: Expliciter « que le psalmiste avait écrites » ou employer le passif « qui avaient été écrites »
  rationale: Le grec emploie un sujet singulier implicite sans nommer l’auteur. L’expliciter ou passer au passif résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français moderne, international et digne. La formulation reste narrative et accessible. Le point-virgule et « puis » rendent lisible le changement abrupt de sujet sans le supprimer ; les deux-points annoncent la citation du verset suivant.
