lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: vint à sa connaissance
  rationale: 'La tournure rend naturellement en français le passif grec et le datif : l’affaire lui devint connue, sans transformer explicitement la construction en un verbe actif comme « il apprit ».'
- source_word: τὸ πρᾶγμα
  choice: l’affaire
  rationale: πρᾶγμα désigne ici une affaire, un fait ou une situation ; « l’affaire » reste suffisamment large tout en étant idiomatique.
- source_word: Μή μοι δείξητε
  choice: Ne me montrez pas
  rationale: μή avec l’impératif exprime une interdiction, et « montrer » conserve le sens concret et direct de δείκνυμι.
- source_word: τὰ πρόσωπα αὐτῶν
  choice: leur visage
  rationale: Le grec dit littéralement « leurs visages ». En français, le singulier distributif « leur visage » est naturel, tout en préservant l’image concrète de l’expression.
