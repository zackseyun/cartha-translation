  text: And the matter became known to him[a], and he said, “Do not show me their faces.”
translation:
  language: fr
  text: 'L’affaire vint à sa connaissance, et il dit : « Ne me montrez pas leurs visages[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression signifiant ici qu’il refusait qu’on les fasse venir devant lui.
