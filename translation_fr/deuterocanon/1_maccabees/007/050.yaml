lexical_decisions:
- source_word: ἡσύχασεν
  choice: connut le calme
  rationale: L’aoriste de ἡσυχάζω exprime ici l’établissement ou l’expérience d’un état de tranquillité après les combats. « Connût le calme » est naturel en français et n’exagère pas cette brève accalmie en parlant d’une paix durable.
- source_word: ἡ γῆ Ἰούδα
  choice: le pays de Juda
  rationale: γῆ désigne le territoire ou le pays. « Le pays de Juda » conserve cette dimension territoriale tout en rendant naturellement la construction grecque.
- source_word: ἡμέρας ὀλίγας
  choice: pendant quelques jours
  rationale: L’accusatif marque la durée. « Pendant quelques jours » rend explicitement cette valeur temporelle ainsi que la brièveté exprimée par ὀλίγας.
