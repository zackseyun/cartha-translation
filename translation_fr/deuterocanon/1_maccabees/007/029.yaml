  text: And he came to Judas[a], and they greeted one another peaceably[b]; but the enemies were ready to seize Judas.
translation:
  language: fr
  text: Il vint trouver Judas, et ils se saluèrent pacifiquement[a] ; mais les ennemis se tenaient prêts à saisir Judas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un esprit de paix ». L’adverbe grec souligne le caractère apparemment pacifique de la rencontre.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi signifier « enlever de force » ou « emporter brusquement » ; il met en relief l’intention perfide dissimulée derrière les salutations pacifiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: Il vint trouver Judas
  rationale: La tournure exprime naturellement en français le déplacement vers une personne, sans ajouter d’intention particulière.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: ils se saluèrent
  rationale: Le verbe désigne couramment l’échange de salutations ; il n’impose pas l’idée d’une accolade.
- source_word: εἰρηνικῶς
  choice: pacifiquement
  rationale: L’adverbe conserve la manière apparemment paisible de la rencontre et son contraste ironique avec le projet hostile qui suit.
- source_word: οἱ πολέμιοι
  choice: les ennemis
  rationale: Le substantif désigne le groupe hostile défini par le contexte.
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: se tenaient prêts à saisir
  rationale: Cette formulation rend l’état de préparation et l’action soudaine ou violente exprimée par ἐξαρπάζω, dans un français naturel.
