  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: fr
  text: Bacchidès quitta Jérusalem et établit son camp à Bexeth[a]. Il envoya des hommes et fit saisir beaucoup de ceux qui s’étaient ralliés à lui, ainsi que quelques membres du peuple. Puis il les massacra dans la grande citerne[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom de ce lieu est incertain; le grec porte « Bexeth ».
    reason: textual_geographical_uncertainty
  - marker: b
    text: Le verbe grec signifie littéralement « sacrifia » ou « immola »; ici, il désigne une mise à mort violente.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans le grand puits » ou « dans la grande fosse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: quitta
  rationale: Le verbe marque ici le départ de Bacchidès hors de Jérusalem. « Quitta » exprime naturellement ce mouvement sans alourdir la narration.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans ce contexte militaire, l’expression désigne l’installation d’un campement.
- source_word: ἐν Βηξέθ
  choice: à Bexeth
  rationale: Le nom grec est translittéré avec prudence, puisque l’identification et la forme sémitique sous-jacente demeurent incertaines.
- source_word: ἀπέστειλεν καὶ συνέλαβεν
  choice: envoya des hommes et fit saisir
  rationale: Le grec dit littéralement qu’il « envoya et saisit ». Le français explicite sobrement les agents sous-entendus de l’envoi tout en maintenant Bacchidès comme responsable des captures.
- source_word: αὐτομολησάντων
  choice: s’étaient ralliés à lui
  rationale: Le participe désigne des hommes passés dans le camp de Bacchidès. « Se rallier à lui » rend clairement le changement d’allégeance sans présumer qu’ils avaient déserté une armée régulière.
- source_word: τινας τοῦ λαοῦ
  choice: quelques membres du peuple
  rationale: 'Cette formulation française naturelle conserve le sens partitif : seules certaines personnes du peuple sont visées.'
- source_word: ἔθυσεν
  choice: massacra
  rationale: Le verbe signifie littéralement « sacrifier », mais décrit ici une mise à mort violente. « Massacra » préserve la brutalité de l’acte sans présenter celui-ci comme un sacrifice cultuel légitime.
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: dans la grande citerne
  rationale: φρέαρ peut désigner un puits, une fosse ou une citerne. « Citerne » convient à une grande cavité aménagée, tandis que « dans » respecte ici la direction ou la localisation exprimée par εἰς sans préciser davantage le déroulement de la mise à mort.
theological_decisions:
- issue: Nuance sacrificielle possible de ἔθυσεν dans un récit d’exécution
  choice: massacra
  alternative: sacrifia / immola / mit à mort
  rationale: Le contexte ne décrit pas un acte cultuel légitime. La traduction principale communique donc la violence de la mise à mort, tandis qu’une note conserve la valeur littérale et la tension lexicale du grec.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. « Fit saisir » maintient la responsabilité de Bacchidès, et « s’étaient ralliés à lui » rend le changement de camp sans surinterprétation militaire.
