base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: fr
  text: Quand les gens du roi proféraient des insultes[a][b], ton ange est sorti et en frappa cent quatre-vingt-cinq mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « blasphémaient ». Le verbe grec peut désigner des paroles injurieuses, outrageantes ou impies.
    reason: lexical_alternative
  - marker: b
    text: Allusion à la destruction de l’armée assyrienne au temps d’Ézéchias ; voir 2 Rois 19.35 et Ésaïe 37.36.
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: les gens du roi
  rationale: Cette expression désigne ceux qui viennent de la part du roi ou lui sont attachés. « Les gens du roi » reste naturel en français sans préciser indûment s’il s’agit d’envoyés ou de soldats.
- source_word: ἐδυσφήμουν
  choice: proféraient des insultes
  rationale: Le verbe évoque des paroles outrageantes, injurieuses ou impies. Cette formulation conserve la portée générale du grec, tandis que la possibilité d’un blasphème est signalée en note.
- source_word: ἐξῆλθεν
  choice: est sorti
  rationale: Rendu direct de l’aoriste, qui conserve l’image de mouvement du texte grec.
- source_word: ἄγγελός σου
  choice: ton ange
  rationale: Bien que ἄγγελος puisse signifier « messager », l’allusion historique renvoie à une intervention divine accomplie par un être céleste.
- source_word: ἐπάταξεν
  choice: a frappé
  rationale: Le verbe signifie d’abord « frapper » et peut, dans ce contexte, impliquer la mise à mort. Le français conserve cette formulation biblique sans ajouter explicitement un résultat que le verbe laisse au contexte.
- source_word: ἐν αὐτοῖς
  choice: d’entre eux
  rationale: Dans le contexte du nombre de victimes au sein du groupe, « d’entre eux » exprime naturellement la relation partitive ou collective.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: cent quatre-vingt-cinq mille
  rationale: Le nombre explicite du grec est reproduit en toutes lettres, conformément au registre narratif biblique.
theological_decisions:
- issue: Faut-il rendre δυσφημέω par un terme explicitement théologique ?
  choice: proféraient des insultes
  alternative: blasphémaient
  rationale: 'Le passage évoque des paroles hostiles dirigées contre Dieu, mais le verbe grec a un sens plus large : parler en mal, outrager ou injurier. Le texte principal préserve cette amplitude, et la note présente la lecture théologique possible.'
- issue: Référent de « ton ange »
  choice: ton ange
  alternative: ton messager
  rationale: Dans l’allusion à la destruction de l’armée assyrienne, l’agent est céleste. « Ange » convient donc mieux au contexte tout en respectant le sens usuel de ἄγγελος.
- issue: Portée de ἐπάταξεν
  choice: a frappé
  alternative: a abattu
  rationale: Le contexte parallèle implique la mort des soldats, mais le grec emploie le verbe général « frapper ». Le retenir évite de résoudre silencieusement la nuance lexicale, tout en laissant le contexte indiquer l’issue fatale.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec, tandis que « les gens du roi » et « d’entre eux » assurent une lecture naturelle. Les deux appels de note figurent dans le texte principal dans l’ordre correspondant aux notes.
