base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: fr
  text: En l'an cent cinquante et un, Démétrios, fils de Séleucos, partit de Rome et monta avec quelques hommes jusqu'à une ville côtière[a]. Là, il devint roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu''à une ville située au bord de la mer ».'
    reason: Cette note explicite le sens de παραθαλασσίαν; le verbe « monta » du texte principal rend ἀνέβη.
  - marker: b
    text: 'Ou : « il y régna ». Le verbe grec peut désigner l''accession à la royauté ou l''exercice du règne.'
    reason: Le contexte peut viser l'accession de Démétrios à la royauté, tandis que ἐβασίλευσεν peut aussi se comprendre comme « régna ».
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: La cent cinquante et unième année
  rationale: Cette formule française naturelle conserve le repère chronologique ordinal du grec sans ajouter de système de datation absent du verset.
- source_word: ἐξῆλθεν ... ἐκ Ῥώμης
  choice: partit de Rome
  rationale: « Partit de » exprime naturellement en français le mouvement hors de Rome, sans introduire l'idée plus précise d'une fuite.
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: Démétrios, fils de Séleucos
  rationale: Le génitif patronymique grec désigne naturellement la filiation. Les formes Démétrios et Séleucos translittèrent directement les noms grecs.
- source_word: ἀνέβη
  choice: se rendit
  rationale: Dans ce récit de déplacement, le français idiomatique n'emploie pas naturellement « monta » avec une destination maritime non précisée. « Se rendit » conserve le déplacement vers la ville sans lui imposer une direction géographique incertaine.
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: accompagné de quelques hommes
  rationale: Cette tournure claire restitue l'accompagnement et le faible nombre d'hommes.
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: dans une ville située au bord de la mer
  rationale: Cette expression rend explicitement et avec dignité le sens de παραθαλασσίαν, « située près de la mer, côtière ».
- source_word: ἐβασίλευσεν
  choice: devint roi
  rationale: Dans la progression narrative, l'aoriste indique vraisemblablement l'accession de Démétrios à la royauté à son arrivée. La note conserve l'autre valeur possible du verbe, « régner ».
theological_decisions:
- issue: Nuance du verbe royal ἐβασίλευσεν
  choice: devint roi
  alternative: régna
  rationale: Le verbe peut désigner soit l'entrée dans la royauté, soit l'exercice du règne. Le contexte immédiat favorise ici le commencement de la royauté, mais l'autre lecture demeure linguistiquement possible et est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, les noms propres suivent une translittération proche du grec, et les notes préservent les ambiguïtés lexicales réelles sans alourdir le texte principal.
