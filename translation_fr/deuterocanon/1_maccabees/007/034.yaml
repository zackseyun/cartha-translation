  text: And he sneered at them, and laughed at them and defiled them, and spoke arrogantly.
translation:
  language: fr
  text: Il les traita avec mépris, se moqua d’eux, les souilla et parla avec arrogance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: traita avec mépris
  rationale: Le verbe exprime une dérision méprisante, littéralement associée au fait de relever le nez. Cette tournure est naturelle en français et demeure distincte du verbe suivant.
- source_word: κατεγέλασεν
  choice: se moqua d’eux
  rationale: Le verbe signifie rire de quelqu’un ou le tourner en dérision. « Se moqua d’eux » rend clairement l’action sans reproduire maladroitement en français l’idée de rire.
- source_word: ἐμίανεν
  choice: les souilla
  rationale: Le verbe peut signifier souiller, profaner ou rendre impur. « Les souilla » conserve sa forte portée morale ou cultuelle sans préciser une manière que le texte ne donne pas.
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: parla avec arrogance
  rationale: Cette expression décrit une parole hautaine, arrogante ou insolente. La traduction choisie est directe et courante en français moderne.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: Il..., se..., les... et...
  rationale: Le français supporte moins naturellement la répétition intégrale de « et ». L’énumération serrée conserve néanmoins l’accumulation des actes, avec la dernière conjonction pour marquer l’aboutissement.
