  text: But they did not pay attention to their words[a], for behold[c][b], they had come with great force.
translation:
  language: fr
  text: Mais ils ne prêtèrent pas attention à leurs paroles[a], car voici qu’ils étaient venus avec une force considérable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne tinrent pas compte de leurs paroles » ; autre possibilité : « n’écoutèrent pas ce qu’ils disaient ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « une force considérable » désigne vraisemblablement des troupes nombreuses ou une importante puissance militaire.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ προσεῖχον
  choice: ils ne prêtèrent pas attention
  rationale: Avec le datif, προσέχω signifie ici « prêter attention à », « tenir compte de » ou « écouter ». Cette formulation moderne reste proche du grec sans préciser à tort s’il s’agit seulement d’écouter ou aussi d’accorder foi.
- source_word: τοῖς λόγοις αὐτῶν
  choice: à leurs paroles
  rationale: λόγοι désigne ce qu’ils avaient dit. « Leurs paroles » conserve la forme du grec dans un registre digne et courant.
- source_word: ἴδου γὰρ ὅτι
  choice: car voici que
  rationale: ἴδου est une formule qui attire l’attention. « Voici que » en maintient la présence et l’emphase, tandis que « car » rend la valeur explicative de γάρ.
- source_word: ἦλθον
  choice: ils étaient venus
  rationale: Le plus-que-parfait exprime naturellement en français que leur arrivée en force constituait déjà le motif de la méfiance évoquée.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec une force considérable
  rationale: δύναμις peut désigner la puissance, une force ou des troupes. Le contexte militaire favorise « force », sans transformer explicitement le terme en « armée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » conserve la formule grecque d’appel à l’attention sans recourir à l’archaïsant « voici ! » ou à une paraphrase qui la supprimerait.
