base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: fr
  text: Exerce ta vengeance contre cet homme et contre son camp, et qu’ils tombent par l’épée. Souviens-toi de leurs outrages[a] et ne leur accorde aucune possibilité de demeurer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « blasphèmes », « insultes » ou « calomnies » : le mot grec peut désigner des paroles outrageantes de manière générale; dans ce contexte, il peut aussi avoir une portée religieuse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « aucun lieu où demeurer » ou « aucun répit » : le grec peut évoquer le fait ou le lieu de demeurer et, dans ce contexte de jugement, l’absence de stabilité ou de possibilité de subsister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: Exerce ta vengeance
  rationale: L’expression grecque demande explicitement une action punitive de Dieu. « Exerce ta vengeance » est naturel en français et conserve la force judiciaire de la prière.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ καὶ ἐν τῇ παρεμβολῇ αὐτοῦ
  choice: contre cet homme et contre son camp
  rationale: Avec ἐκδίκησιν, ἐν désigne ici ceux contre qui la vengeance s’exerce. παρεμβολή renvoie au camp militaire, et par extension aux forces qui y sont rassemblées.
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  choice: qu’ils tombent par l’épée
  rationale: Le pluriel englobe l’homme et les membres de son camp. « Tomber par l’épée » rend directement l’image grecque de la mort violente au combat.
- source_word: μνήσθητι
  choice: Souviens-toi
  rationale: Dans cette prière, le verbe appelle Dieu à tenir compte des fautes commises et à agir en conséquence; « Souviens-toi » en préserve la portée judiciaire sans l’expliciter excessivement.
- source_word: δυσφημιῶν
  choice: blasphèmes
  rationale: Le mot peut désigner plus largement des propos injurieux ou diffamatoires. Dans cette prière liée à un conflit sacré, « blasphèmes » conserve sa possible portée religieuse.
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: ne leur accorde aucun répit
  rationale: μονή évoque le fait de rester, une demeure ou une situation durable. Dans cette demande de jugement, « aucun répit » exprime naturellement l’absence de repos ou de sécurité, tandis qu’une note préserve les autres possibilités.
theological_decisions:
- issue: Portée religieuse de δυσφημιῶν
  choice: blasphèmes
  alternative: insultes ou calomnies
  rationale: Le contexte de prière adressée à Dieu favorise une offense à portée religieuse, mais le terme grec peut aussi désigner plus généralement des paroles outrageantes; cette latitude est signalée en note.
- issue: Sens de μονήν dans l’imprécation
  choice: aucun répit
  alternative: aucun lieu où demeurer, ou aucune possibilité de subsister
  rationale: Le grec ne précise pas si l’absence demandée concerne le repos, un séjour stable ou la possibilité de continuer à subsister. Le texte principal retient une formulation française naturelle sans faire de « survie » le seul sens possible.
translation_notes:
  register: Français international actuel, digne et direct. La tournure de prière à l’impératif est maintenue, ainsi que la violence explicite du texte source. Les ambiguïtés de δυσφημία et μονή sont préservées par des notes plutôt que résolues silencieusement.
