  terminology: « Outrages » est un terme français moderne et suffisamment large pour δυσφημίαι; la note maintient notamment la possibilité de « blasphèmes ». « Camp » et « épée » conviennent au contexte militaire. La formulation finale révisée rend le champ de μονή sans imposer « survie » ni « repos » comme sens exclusif.
