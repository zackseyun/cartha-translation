    issue: « exterminer le peuple » est trop spécifique.
    rationale: ἐξᾶραι peut certainement avoir une portée destructrice dans ce contexte, mais ne désigne pas explicitement l’extermination physique. « Anéantir » rend la gravité de l’ordre tout en préservant mieux l’amplitude du grec.
  - severity: low
    issue: L’alternative « supprimer le peuple » est ambiguë en français moderne.
    rationale: « Supprimer » peut évoquer une suppression administrative ou éditoriale et ne constitue pas une aide lexicale claire pour le lecteur.
