base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: fr
  text: Le roi envoya Nicanor, l’un de ses hauts dignitaires, qui haïssait Israël et lui était hostile, et il lui ordonna d’anéantir le peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faire disparaître le peuple » ou « détruire le peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Verbe narratif courant qui rend directement l’envoi de Nicanor par le roi.
- source_word: Νικάνορα
  choice: Nicanor
  rationale: Forme française traditionnelle et couramment employée pour ce nom grec.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: l’un de ses hauts dignitaires
  rationale: « Dignitaire » exprime la fonction et le rang de ἄρχων, tandis que « haut » restitue le prestige marqué par ἐνδόξων, dans un français naturel.
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: qui haïssait Israël et lui était hostile
  rationale: La proposition relative restitue naturellement les deux participes et conserve leur effet cumulatif sans les fondre en une seule idée.
- source_word: ἐνετείλατο αὐτῷ
  choice: il lui ordonna
  rationale: Rend clairement l’ordre royal et son destinataire.
- source_word: ἐξᾶραι τὸν λαόν
  choice: d’exterminer le peuple
  rationale: Dans ce contexte d’hostilité politique et militaire, « exterminer » communique la force destructive du verbe, tout en signalant en note son amplitude lexicale.
theological_decisions:
- issue: Portée de ἐξᾶραι appliqué au peuple
  choice: exterminer le peuple
  alternative: faire disparaître le peuple ; supprimer le peuple
  rationale: Le contexte favorise une élimination violente, mais le grec peut littéralement évoquer le fait d’enlever ou de faire disparaître. La traduction principale conserve la gravité de la menace, et la note maintient l’amplitude du terme.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe conserve l’enchaînement narratif grec et distingue les deux expressions d’hostilité. Le marqueur [a] est placé après l’expression qu’il précise.
