base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: fr
  text: Judas vit tout le mal qu’Alcime et ses partisans avaient fait parmi les fils d’Israël, un mal plus grand encore que celui des nations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus encore que les non-Juifs ». L’expression grecque compare de façon elliptique le mal commis par Alcime et ses alliés à celui des nations environnantes et indique qu’il le surpassait.'
    reason: Alternative lexicale pour « les nations » et explicitation de la comparaison elliptique.
lexical_decisions:
- source_word: ἴδεν
  choice: vit
  rationale: L’aoriste de ὁράω est rendu par le passé simple, naturel dans ce récit et assez large pour exprimer aussi bien la constatation que la vue physique.
- source_word: ἅπαν τὴν κακίαν
  choice: tout le mal
  rationale: Cette formulation conserve à la fois la portée morale de κακία et la totalité exprimée par ἅπαν, dans un français simple et digne.
- source_word: ἐποίησεν
  choice: avaient fait
  rationale: Le plus-que-parfait marque naturellement que les actes d’Alcime et de ses alliés précèdent la constatation de Judas.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ses partisans
  rationale: L’expression désigne ceux qui se rangent avec Alcime. « Ses partisans » est plus idiomatique en français que le calque « ceux qui étaient avec lui » sans préciser au-delà du grec la nature exacte de leur association.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: au milieu des fils d’Israël
  rationale: « Au milieu de » rend la sphère indiquée par ἐν, tandis que « fils d’Israël » préserve l’expression filiale et collective du grec.
- source_word: ὑπὲρ τὰ ἔθνη
  choice: plus encore que les nations
  rationale: ὑπέρ avec l’accusatif exprime ici un dépassement. Cette traduction garde la comparaison concise et son effet accusateur, sans remplacer d’emblée « les nations » par le terme interprétatif « les non-Juifs ».
theological_decisions:
- issue: Rendu de υἱοῖς Ἰσραήλ
  choice: les fils d’Israël
  alternative: le peuple d’Israël / les Israélites
  rationale: Le grec emploie explicitement une expression filiale traditionnelle. La conserver maintient sa résonance identitaire et scripturaire sans transformer le groupe visé.
- issue: Rendu de τὰ ἔθνη
  choice: les nations
  alternative: les non-Juifs
  rationale: Dans ce contexte juif, τὰ ἔθνη peut désigner les peuples non juifs. « Les nations » reste toutefois plus proche du grec et préserve la tension rhétorique entre Israël et les peuples environnants.
- issue: Comparaison elliptique dans ὑπὲρ τὰ ἔθνη
  choice: plus encore que les nations
  alternative: dépassant même le mal commis par les nations
  rationale: Le texte grec formule une comparaison elliptique. Le texte principal en conserve la brièveté et une part d’ambiguïté, tandis que la note explicite le sens comparatif probable sans l’imposer dans le verset.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; le plus-que-parfait ordonne clairement les événements. « Partisans » évite un calque lourd, tandis que « fils d’Israël » et « les nations » conservent les formulations culturellement marquées du grec.
