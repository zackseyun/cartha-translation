    issue: Intensif « vivement »
    rationale: σφόδρα marque une forte intensité. « Grandement » est plus idiomatique dans cette collocation narrative (« se réjouir grandement ») et conserve un registre digne.
  - severity: medium
    issue: Formulation de la note littérale
    rationale: « Ils conduisirent ce jour-là comme un jour… » transforme « ce jour-là » en complément circonstanciel et produit une formulation française opaque. Il vaut mieux signaler explicitement que « mener/conduire » est le sens lexical du verbe grec, puis expliquer l’idiome.
