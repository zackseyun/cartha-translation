  text: And the people rejoiced greatly[a], and they made that day a day of great gladness.
translation:
  language: fr
  text: Et le peuple se réjouit grandement, et ils firent de ce jour-là un jour de grande joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie littéralement le verbe « mener » ou « conduire » : « ils menèrent ce jour-là, [comme] un jour de grande joie ». Cette tournure signifie qu’ils observèrent ou célébrèrent ce jour comme tel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐφράνθη
  choice: se réjouit
  rationale: 'L’aoriste passif de εὐφραίνω a ici un sens naturellement intransitif : le peuple éprouve et manifeste de la joie.'
- source_word: ὁ λαός
  choice: le peuple
  rationale: Le grec dit simplement « le peuple » ; le contexte suffit à en préciser l’identité sans ajouter « d’Israël ».
- source_word: σφόδρα
  choice: vivement
  rationale: L’adverbe intensifie la joie. « Vivement » exprime cette forte réaction dans un français naturel et digne.
- source_word: ἦγαγον
  choice: ils célébrèrent
  rationale: Bien que le verbe signifie littéralement « mener » ou « conduire », l’expression ἄγειν ἡμέραν désigne ici le fait d’observer ou de célébrer un jour.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ce jour-là
  rationale: Équivalent français direct et idiomatique du groupe démonstratif grec.
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: comme un jour de grande joie
  rationale: εὐφροσύνη évoque la joie, notamment festive. Cette formulation conserve la répétition de « jour » présente dans le grec tout en restant naturelle.
