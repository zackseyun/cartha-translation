lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: les troupes
  rationale: Dans ce contexte militaire, le terme désigne les forces armées. « Les troupes » est naturel en français moderne et évite le sens abstrait de « puissances ».
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: L’aoriste indique simplement l’action de tuer, sans imposer l’idée plus précise d’une exécution officielle.
- source_word: ἐκάθισεν
  choice: s’assit
  rationale: Le verbe signifie littéralement « s’assit »; associé au trône, il évoque naturellement l’accession au pouvoir sans l’expliciter davantage.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: sur le trône de son royaume
  rationale: Cette formulation conserve de près l’expression grecque et son image royale, sans la réduire à « son trône royal ».
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française directe du nom grec, avec l’accentuation usuelle en français.
