  yaml_path: translation/deuterocanon/1_maccabees/007/014.yaml
  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: fr
  text: 'Car ils dirent : « Un homme, un prêtre de la descendance d’Aaron, est venu avec les forces armées[a], et il ne nous fera pas de tort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les troupes » ou « avec l’armée ». Le grec emploie un pluriel qui désigne ici des forces militaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: Car ils se disaient
  rationale: γάρ introduit l’explication de leur conduite; l’imparfait français convient à une parole exprimant leur raisonnement dans la scène, même si εἶπαν est un aoriste.
- source_word: Ἄνθρωπος ἱερεὺς
  choice: Un homme, un prêtre
  rationale: Cette formulation conserve l’apposition et l’ordre expressif du grec sans identifier l’individu plus précisément que le texte.
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: de la descendance d’Aaron
  rationale: Dans ce contexte généalogique, σπέρμα désigne la postérité ou la lignée. « Descendance » restitue naturellement en français moderne l’origine sacerdotale revendiquée.
- source_word: ἦλθεν
  choice: est venu
  rationale: Le passé composé est naturel dans le discours direct et souligne que sa venue récente fonde leur confiance présente.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: avec les forces armées
  rationale: Le pluriel δυνάμεις désigne ici des forces militaires. L’ajout explicatif « armées » évite le sens abstrait que pourrait avoir « forces » seul en français.
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: il ne nous fera aucun tort
  rationale: ἀδικέω peut exprimer le fait de traiter injustement, de léser ou de faire du mal. Cette tournure française conserve à la fois la nuance morale et le préjudice concret.
theological_decisions:
- issue: La formule généalogique liée à la légitimité sacerdotale
  choice: de la descendance d’Aaron
  alternative: de la lignée d’Aaron; de la semence d’Aaron
  rationale: La traduction garde explicite l’ascendance aaronique invoquée comme motif de confiance, sans confirmer ni infirmer la légitimité du personnage. « Semence » serait plus littéral, mais moins naturel et potentiellement ambigu en français actuel.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation demeure proche de la structure grecque tout en évitant les calques peu naturels. Le raisonnement des locuteurs est rapporté sans valider leur appréciation.
