  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: fr
  text: Il établit Alkime à la tête du pays et laissa auprès de lui une troupe pour lui venir en aide. Puis Bacchidès se rendit auprès du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν ... τὴν χώραν τῷ Ἀλκίμῳ
  choice: établit Alkime à la tête du pays
  rationale: La construction exprime l’attribution à Alkime de l’autorité sur le territoire. Cette formulation est naturelle en français et conserve le sens administratif de l’original.
- source_word: τὴν χώραν
  choice: le pays
  rationale: Dans ce contexte politique, χώρα désigne le territoire placé sous l’autorité d’Alkime; « pays » convient sans en préciser excessivement l’étendue.
- source_word: ἀφῆκεν
  choice: laissa
  rationale: Le verbe indique que Bacchidès laisse une force militaire auprès d’Alkime.
- source_word: δύναμιν
  choice: une troupe
  rationale: Dans ce récit militaire, δύναμις désigne des forces armées. « Une troupe » rend ce sens sans supposer les dimensions d’une armée entière.
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: pour lui venir en aide
  rationale: L’infinitif articulé exprime ici le but de la présence de la troupe; cette tournure française est claire et fidèle.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: Le verbe marque simplement le départ de Bacchidès; « partit » est naturel et n’ajoute pas l’idée d’un retour.
- source_word: πρὸς τὸν βασιλέα
  choice: auprès du roi
  rationale: πρός avec l’accusatif indique le mouvement en direction du roi. « Auprès du roi » rend idiomatiquement la destination personnelle sans ajouter « retour », absent du grec.
