  yaml_path: translation/deuterocanon/1_maccabees/007/044.yaml
  text: And he himself fell first in the battle. But when his camp saw that Nicanor had fallen[a], they threw down their weapons and fled.
translation:
  language: fr
  text: Et lui-même tomba le premier dans la bataille. Quand son camp[a] vit que Nicanor était tombé, ses hommes jetèrent leurs armes et s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses troupes » ou « son campement » (ἡ παρεμβολὴ αὐτοῦ).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν
  choice: tomba / était tombé
  rationale: Le verbe signifie littéralement « tomber » et, dans ce contexte militaire, implique la mort sans qu’il soit nécessaire de l’expliciter davantage.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Cette forme rend l’insistance du pronom grec.
- source_word: πρῶτος
  choice: le premier
  rationale: Cette traduction conserve simplement la valeur temporelle et séquentielle du grec.
- source_word: ἐν τῷ πολέμῳ
  choice: dans la bataille
  rationale: Même si πόλεμος peut désigner la guerre, le contexte immédiat concerne un affrontement précis.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son camp
  rationale: παρεμβολή peut désigner le campement ou, par métonymie, les troupes qui y sont rassemblées. « Son camp » conserve cette image et son ambiguïté.
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: jetèrent leurs armes
  rationale: Le participe décrit l’abandon des armes avant la fuite; « jetèrent » en restitue la force.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: C’est l’équivalent français naturel dans un contexte de déroute militaire.
