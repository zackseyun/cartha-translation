lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: avec une armée nombreuse
  rationale: Dans ce contexte militaire, δύναμις désigne les forces armées plutôt qu’une puissance abstraite.
- source_word: μετὰ δόλου
  choice: dans l’intention de les tromper
  rationale: Rend explicitement la manière ou l’intention perfide indiquée par δόλος, sans laisser croire que les paroles elles-mêmes étaient simplement maladroites.
- source_word: λόγους εἰρηνικούς
  choice: un message de paix
  rationale: Expression française naturelle qui conserve l’idée de paroles présentant une offre ou une intention pacifique.
- source_word: ἀδελφοὺς
  choice: frères
  rationale: Conserve le terme familial du grec sans l’élargir à « compagnons ».
