  yaml_path: translation/deuterocanon/1_maccabees/007/002.yaml
  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
translation:
  language: fr
  text: Et il arriva, tandis qu’il entrait dans la maison royale de ses pères[a], que les troupes se saisirent d’Antiochos et de Lysias pour les lui amener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de la royauté de ses pères »; on peut aussi comprendre : « le palais de ses pères ».'
    reason: La formulation grecque est inhabituelle et peut désigner la résidence royale ou le siège dynastique ancestral.
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Et il arriva, tandis que
  rationale: Conserve la formule grecque de transition narrative et introduit naturellement en français l’action simultanée.
- source_word: εἰσεπορεύετο
  choice: il entrait
  rationale: L’imparfait rend l’action en cours exprimée par l’imparfait grec.
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  choice: la maison royale de ses pères
  rationale: « Maison royale » demeure proche de la tournure inhabituelle du grec tout en étant intelligible; « de ses pères » conserve la nuance ancestrale et dynastique.
- source_word: συνέλαβον
  choice: se saisirent de
  rationale: Rend l’idée de capture sans supposer une procédure judiciaire formelle.
- source_word: αἱ δυνάμεις
  choice: les troupes
  rationale: Dans ce contexte militaire, ce terme français est plus naturel que le calque « les forces » tout en rendant le pluriel grec.
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: pour les lui amener
  rationale: Exprime clairement la valeur finale de l’infinitif et conserve les deux renvois pronominaux du grec.
