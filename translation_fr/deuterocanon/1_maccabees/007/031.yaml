  text: And Nikanor learned that his plan had been uncovered, and he went out to meet Judas,
translation:
  language: fr
  text: Nicanor apprit que son plan avait été découvert et sortit à la rencontre de Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: apprit
  rationale: L’aoriste de γινώσκω exprime ici l’acquisition d’une information; « apprit » rend naturellement ce changement de connaissance.
- source_word: ἀπεκαλύφθη
  choice: avait été découvert
  rationale: Le passif indique que le plan était devenu connu. Le plus-que-parfait marque son antériorité par rapport au moment où Nicanor l’apprit.
- source_word: ἡ βουλὴ αὐτοῦ
  choice: son plan
  rationale: Dans ce contexte politico-militaire, βουλή désigne naturellement un plan; « dessein » serait plus soutenu et « complot » ajouterait une nuance péjorative.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Rend directement le verbe « sortir », sans ajouter l’idée explicite d’une marche militaire.
- source_word: εἰς συνάντησιν
  choice: à la rencontre de
  rationale: Cette expression française conserve l’idée d’aller au-devant de quelqu’un sans préciser au-delà du grec la nature hostile de la rencontre.
- source_word: τῷ Ἰούδα
  choice: Judas
  rationale: Forme française traditionnelle du nom personnel Ἰούδας dans 1 Maccabées.
