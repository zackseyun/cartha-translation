lexical_decisions:
- source_word: ἠγωνίσατο
  choice: lutta
  rationale: Le verbe exprime un effort combatif ou une lutte soutenue. Ici, le contexte porte sur l’obtention d’une fonction; « lutta » conserve la vigueur du grec sans imposer l’idée d’un combat physique.
- source_word: Ἄλκιμος
  choice: Alkime
  rationale: « Alkime » est la forme française traditionnelle et reconnaissable du nom grec Ἄλκιμος.
- source_word: περὶ
  choice: pour obtenir
  rationale: Après un verbe de lutte, περί désigne ici l’enjeu poursuivi. « pour obtenir » rend clairement en français naturel que la charge était l’objet de ses efforts.
- source_word: τῆς ἀρχιερωσύνης
  choice: la charge de grand prêtre
  rationale: ἀρχιερωσύνη désigne la fonction ou dignité de grand prêtre. « la charge de grand prêtre » est précis, courant et évite l’ambiguïté possible de « grand sacerdoce ».
