lexical_decisions:
- source_word: ὤμοσεν
  choice: jura
  rationale: L’aoriste de ὄμνυμι exprime ici la prestation d’un serment. « Jura » est direct, solennel et naturel.
- source_word: μετὰ θυμοῦ
  choice: dans sa colère
  rationale: Cette expression décrit l’état dans lequel le serment est prononcé. « Dans sa colère » rend θυμός sans en exagérer l’intensité.
- source_word: παραδοθῇ
  choice: ne sont pas livrés
  rationale: Le subjonctif passif de παραδίδωμι indique que Judas et son camp doivent être remis au pouvoir de l’orateur. « Livrés » convient au contexte militaire et conserve la voix passive.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son camp
  rationale: παρεμβολή peut désigner un campement ou les forces qui y sont rassemblées. « Son camp » préserve cette amplitude sans réduire le terme à la seule armée combattante.
- source_word: τὸ νῦν
  choice: maintenant
  rationale: L’expression souligne l’immédiateté. « Maintenant » en donne le sens direct sans ajouter l’idée plus forte d’un ordre d’agir sur-le-champ.
- source_word: εἰς χεῖράς μου
  choice: entre mes mains
  rationale: Cette locution imagée signifie être remis au pouvoir de quelqu’un. L’expression française correspondante reste claire et conserve l’image grecque.
- source_word: ἐπιστρέψω ἐν εἰρήνῃ
  choice: si je reviens en paix
  rationale: Le subjonctif avec ἐάν garde une valeur conditionnelle. « Revenir en paix » conserve l’expression grecque sans la limiter à un simple retour sain et sauf.
- source_word: καὶ ἔσται ἐὰν
  choice: et si
  rationale: Dans cette formule inachevée, καὶ ἔσται introduit la suite de la menace conditionnelle. Le français « et si » maintient l’enchaînement et l’inachèvement sans produire une tournure artificielle.
theological_decisions:
- issue: Serment et menace laissés inachevés à la fin du verset
  choice: Conserver une phrase suspendue, signalée par des points de suspension
  alternative: Compléter la menace en important dans ce verset les mots du verset suivant
  rationale: Le texte grec fourni s’arrête au milieu de la déclaration, dont la conséquence apparaît dans le verset suivant. La traduction respecte cette limite et n’anticipe pas la suite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste naturelle tout en conservant la condition double et la suspension finale du grec.
