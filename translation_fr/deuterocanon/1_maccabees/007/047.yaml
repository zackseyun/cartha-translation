base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: fr
  text: Ils prirent les dépouilles et le butin, tranchèrent la tête de Nicanor ainsi que sa main droite, qu’il avait tendue avec arrogance, puis les emportèrent et les exposèrent près de Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à côté de Jérusalem ». Le grec ne précise pas l’emplacement exact.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: dépouilles
  rationale: Le terme désigne les biens pris aux vaincus. « Dépouilles » conserve le sens militaire et permet de maintenir la distinction avec προνομήν.
- source_word: προνομήν
  choice: butin
  rationale: Le mot évoque les biens saisis lors du pillage. « Butin » rend naturellement cette idée sans fusionner les deux substantifs grecs.
- source_word: ἀφεῖλαν
  choice: coupèrent
  rationale: Avec « la tête » et « la main droite » comme compléments, le contexte implique qu’elles furent tranchées. « Coupèrent » exprime clairement l’action en français.
- source_word: δεξιὰν
  choice: main droite
  rationale: Employé substantivement, δεξιά désigne normalement la main droite plutôt que le bras.
- source_word: ἐξέτεινεν
  choice: avait tendue
  rationale: Le plus-que-parfait marque naturellement que ce geste arrogant de Nicanor était antérieur à la mutilation rapportée.
- source_word: ἐν ὑπερηφάνως
  choice: avec arrogance
  rationale: Malgré la forme grecque irrégulière, l’expression qualifie clairement le geste de hautain. « Avec arrogance » en conserve la portée morale.
- source_word: ἤνεγκαν
  choice: emportèrent
  rationale: Dans la séquence narrative, le verbe indique qu’ils transportèrent la tête et la main jusqu’au lieu d’exposition.
- source_word: ἐξέτειναν
  choice: exposèrent
  rationale: Le sens littéral est « étendirent », mais le contexte décrit la présentation publique des restes. « Exposèrent » rend cette fonction sans préciser un mode d’accrochage absent du grec.
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: près de Jérusalem
  rationale: παρά avec l’accusatif situe ici l’exposition à côté ou à proximité de Jérusalem, sans identifier un emplacement plus précis.
theological_decisions:
- issue: Traitement public des restes de Nicanor
  choice: Décrire sobrement l’acte historique de victoire et d’humiliation, sans commentaire moral ajouté.
  alternative: Présenter explicitement l’exposition comme un jugement divin ou la situer à une porte de la ville ou dans l’enceinte du Temple.
  rationale: Le verset rapporte l’acte et souligne l’arrogance antérieure de Nicanor, mais ne précise ni le lieu exact ni une interprétation théologique explicite.
translation_notes:
  register: Français moderne, clair et digne. Le nom « Nicanor » suit l’usage français établi. La coordination et le rythme narratif restent proches du grec, tandis que « exposèrent » explicite naturellement la valeur contextuelle du second ἐξέτειναν.
