base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/010.yaml
  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: fr
  text: Il partit et arriva au pays de Juda avec une armée nombreuse. Il envoya des messagers à Judas et à ses frères avec des paroles de paix, mais avec tromperie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec tromperie ». Le grec oppose des paroles de paix à la tromperie qui les accompagnait, sans préciser davantage la portée de cette tromperie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: Il partit et arriva
  rationale: La succession des deux aoristes exprime d’abord le départ, puis l’arrivée. Cette formulation conserve les deux mouvements dans un français naturel.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec une armée nombreuse
  rationale: Dans ce contexte militaire, δύναμις désigne une force armée plutôt qu’une puissance abstraite. « Armée nombreuse » est clair et idiomatique.
- source_word: εἰς γῆν Ἰούδα
  choice: au pays de Juda
  rationale: γῆ désigne ici le territoire de Juda. « Pays de Juda » restitue explicitement cette dimension territoriale.
- source_word: ἀπέστειλεν ἀγγέλους
  choice: Il envoya ... des messagers
  rationale: Dans ce cadre politique et militaire, ἄγγελοι désigne des émissaires humains. « Messagers » reste précis sans imposer un statut diplomatique plus formel.
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: à Judas et à ses frères
  rationale: La traduction suit les destinataires explicitement indiqués et conserve le sens ordinaire de ἀδελφοί.
- source_word: λόγους εἰρηνικοὺς
  choice: porteurs de paroles de paix
  rationale: « Paroles de paix » conserve de près l’expression grecque et désigne un discours extérieurement pacifique.
- source_word: μετὰ δόλου
  choice: mais avec l’intention de les tromper
  rationale: δόλος exprime la tromperie, la ruse ou la duplicité. L’ajout explicatif de « mais » fait ressortir en français le contraste implicite entre le discours pacifique et l’intention trompeuse.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Armée nombreuse » rend clairement le contexte militaire; « paroles de paix » préserve l’image du grec. La note maintient visible la formulation plus littérale et son contraste.
