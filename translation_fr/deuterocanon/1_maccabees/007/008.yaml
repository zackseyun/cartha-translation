  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
translation:
  language: fr
  text: Le roi choisit Bacchidès, l’un des Amis du roi[a], qui gouvernait la région située au-delà du Fleuve[b], occupait un rang élevé dans le royaume et était fidèle au roi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Amis du roi » formaient probablement un rang officiel ou une catégorie reconnue de conseillers et de compagnons royaux dans les cours hellénistiques, et non un simple cercle d’amis personnels.
    reason: cultural_note
  - marker: b
    text: '« Au-delà du Fleuve » est une désignation territoriale, probablement celle d’une région située à l’ouest de l’Euphrate dans l’administration impériale. On peut aussi comprendre plus simplement : « de l’autre côté du fleuve » sans y voir un nom administratif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: choisit
  rationale: Le verbe signifie directement « choisir » ou « sélectionner ». « Choisit » reste naturel et n’ajoute pas l’idée plus précise d’une nomination officielle.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: l’un des Amis du roi
  rationale: Le génitif partitif indique que Bacchidès appartenait au groupe des φίλοι royaux. La majuscule à « Amis » signale discrètement qu’il s’agit probablement d’un rang ou d’un corps de cour reconnu.
- source_word: κυριεύοντα
  choice: qui gouvernait
  rationale: Le participe décrit l’exercice d’une autorité sur un territoire. La tournure verbale conserve mieux la forme grecque que le titre plus interprétatif « gouverneur », tout en étant idiomatique en français.
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: la région située au-delà du Fleuve
  rationale: La formulation rend perceptible la valeur territoriale probable de l’expression, tandis que « Fleuve » avec une majuscule conserve son caractère de désignation connue sans identifier explicitement l’Euphrate dans le texte.
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: occupait un rang élevé dans le royaume
  rationale: Dans ce contexte, μέγαν désigne le statut et l’influence plutôt que la grandeur physique. Cette expression française rend naturellement cette position éminente.
- source_word: πιστὸν τῷ βασιλεῖ
  choice: était fidèle au roi
  rationale: πιστός exprime ici la fidélité, la fiabilité ou la loyauté politique envers le roi. « Fidèle » conserve cette amplitude sémantique.
