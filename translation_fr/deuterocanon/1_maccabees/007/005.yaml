  text: And all the lawless and ungodly men from Israel came to him[a], and Alcimus led them, wanting to be priest,
translation:
  language: fr
  text: Et tous les hommes sans loi et impies d’Israël vinrent à lui ; Alcime était à leur tête, aspirant à la prêtrise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec signifie plus littéralement « exercer les fonctions de prêtre ». Dans ce contexte, cela peut viser la charge de grand prêtre, sans que le titre soit exprimé dans le verbe grec.
    reason: Précise la portée lexicale de ἱερατεύειν et signale avec prudence l’identification contextuelle possible à la grande prêtrise.
lexical_decisions:
- source_word: ἄνδρες
  choice: hommes
  rationale: Le nom grec est explicitement masculin pluriel et désigne ici un groupe d’hommes déterminé.
- source_word: ἄνομοι
  choice: sans loi
  rationale: Cette expression conserve l’idée de transgression de la Loi, probablement avec sa portée d’alliance, sans la réduire à une méchanceté générale.
- source_word: ἀσεβεῖς
  choice: impies
  rationale: Le terme exprime l’irrévérence envers Dieu et maintient la dimension religieuse distincte de ἄνομοι.
- source_word: ἐξ Ἰσραήλ
  choice: issus d’Israël
  rationale: La formule indique que ces hommes venaient du sein même d’Israël.
- source_word: πρὸς αὐτόν
  choice: auprès de lui
  rationale: Avec le verbe de mouvement, la préposition marque l’approche vers la personne mentionnée.
- source_word: ἡγείται αὐτῶν
  choice: avec Alcime à leur tête
  rationale: Cette tournure française naturelle rend le présent narratif et le rôle dirigeant d’Alcime.
- source_word: βουλόμενος
  choice: qui voulait
  rationale: Le participe exprime le désir ou l’ambition qui motive Alcime.
- source_word: ἱερατεύειν
  choice: exercer la prêtrise
  rationale: Le verbe signifie littéralement exercer les fonctions de prêtre. Cette traduction évite d’ajouter « grand » absent du grec, tout en permettant de préciser le contexte en note.
theological_decisions:
- issue: Double qualification morale des Israélites concernés
  choice: sans loi et impies
  alternative: méchants et impies
  rationale: 'La traduction maintient deux accusations distinctes : opposition à la Loi et irrévérence envers Dieu.'
- issue: Nature de l’ambition sacerdotale d’Alcime
  choice: exercer la prêtrise
  alternative: devenir grand prêtre
  rationale: Le grec ne précise pas lexicalement la dignité de grand prêtre. Le texte principal garde donc sa portée formelle, tandis que la note signale le sens probable dans le contexte historique.
translation_notes:
  register: Français international moderne, digne et lisible. « Sans loi » préserve la coloration juridique et religieuse; « avec Alcime à leur tête » évite une coordination française maladroite tout en restant proche de la syntaxe grecque.
