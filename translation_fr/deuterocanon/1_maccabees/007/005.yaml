- from: Tous les hommes sans loi et impies issus d’Israël vinrent auprès de lui, avec Alcime à leur tête, qui voulait exercer la prêtrise[a].
  to: Et tous les hommes sans loi et impies d’Israël vinrent à lui ; Alcime était à leur tête, aspirant à la prêtrise[a].
  rationale: La révision améliore la précision de ἐξ Ἰσραήλ et de l’infinitif ἱερατεύειν, tout en conservant le sens narratif, la double qualification morale et l’ambiguïté lexicale du grec concernant le rang sacerdotal.
