    issue: « issus d’Israël »
    rationale: Cette expression peut se comprendre comme une origine ancestrale. « d’Israël » rend plus simplement ἐξ Ἰσραήλ, qui désigne ici des hommes provenant du sein d’Israël.
  - severity: medium
    issue: « qui voulait exercer la prêtrise »
    rationale: La tournure peut suggérer qu’Alcime souhaitait accomplir une fonction sacerdotale en général. « aspirant à la prêtrise » rend mieux son ambition pour cette fonction, tout en ne surtraduissant pas le grec par « grand prêtre ».
  - severity: low
    issue: Note sur le grand-prêtre
    rationale: Le contexte peut orienter vers la grande prêtrise, mais le verbe grec seul ne porte pas ce titre. La note doit présenter cette identification comme une possibilité contextuelle.
