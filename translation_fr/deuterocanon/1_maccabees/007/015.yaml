  text: And he spoke peaceful words with them, and swore to them, saying, “We will not seek harm against you or against your friends.”
translation:
  language: fr
  text: 'Il leur adressa des paroles de paix, puis leur jura : « Nous ne chercherons à faire de mal[a] ni à vous ni à vos amis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous ne chercherons à nuire ni à vous ni à vos amis. » Le grec κακόν peut désigner le mal ou le tort causé ; ici, il s’agit vraisemblablement d’une action nuisible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  choice: Il leur adressa
  rationale: Cette formulation française rend naturellement l’acte de parler avec eux dans ce contexte diplomatique, sans alourdir le récit par le calque « parla avec eux ».
- source_word: εἰρηνικοὺς λόγους
  choice: des paroles de paix
  rationale: Expression française naturelle et digne qui conserve l’image grecque et indique un discours conciliant, sans affirmer que l’intention était sincère.
- source_word: ὤμοσεν αὐτοῖς λέγων
  choice: puis leur jura
  rationale: Le verbe « jurer » rend directement ὄμνυμι; les paroles citées qui suivent rendent superflu le participe « disant » en français.
- source_word: Οὐκ ἐκζητήσομεν
  choice: Nous ne chercherons à faire
  rationale: Avec κακόν, cette tournure exprime idiomatiquement l’intention de nuire tout en conservant la notion de recherche ou de dessein portée par ἐκζητέω.
- source_word: ὑμῖν κακὸν, καὶ τοῖς φίλοις ὑμῶν
  choice: de mal ni à vous ni à vos amis
  rationale: « Mal » préserve l’étendue sémantique de κακόν; la construction corrélative française exprime clairement que la promesse concerne les interlocuteurs comme leurs amis.
