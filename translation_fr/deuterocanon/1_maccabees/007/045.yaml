base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/045.yaml
  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
translation:
  language: fr
  text: Ils les poursuivirent pendant une journée de marche, depuis Adasa jusqu’à Gazéra, et sonnèrent derrière eux des trompettes de signal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «firent retentir derrière eux les trompettes servant aux signaux».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωκον
  choice: ils les poursuivirent
  rationale: L’imparfait grec décrit la poursuite en cours; le passé simple convient au récit français et «poursuivirent» conserve clairement le contexte militaire.
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: pendant une journée de marche
  rationale: L’expression désigne une distance ou une durée correspondant à une journée de déplacement; cette formulation est naturelle en français tout en conservant la mesure du texte.
- source_word: ἀπὸ Ἀδασὰ
  choice: depuis Adasa
  rationale: Le nom de lieu est translittéré, et «depuis» marque naturellement le point de départ de la poursuite.
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: jusqu’à Gazéra
  rationale: La construction indique le terme atteint. La formulation concise garde le sens sans devoir expliciter un sujet potentiellement ambigu dans «ils arrivèrent».
- source_word: ἐσάλπισαν
  choice: sonnèrent
  rationale: Le verbe signifie faire retentir une trompette; «sonner des trompettes» est idiomatique et conserve le ton militaire.
- source_word: ὀπίσω αὐτῶν
  choice: derrière eux
  rationale: Cette traduction préserve le sens spatial du grec sans l’interpréter explicitement comme «à leur poursuite».
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: des trompettes de signal
  rationale: Le génitif qualifie les trompettes par leur fonction de transmission de signaux militaires. La tournure reste proche du grec et intelligible en français.
