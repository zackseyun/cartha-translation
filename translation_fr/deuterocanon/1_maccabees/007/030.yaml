review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Judas apprend la démarche hostile et trompeuse, en éprouve de l''alarme, puis refuse tout nouveau contact. Toutefois, « Il en fut alarmé » fait porter l''alarme sur la nouvelle ou le complot, alors que ἀπ’ αὐτοῦ renvoie plus directement à l''homme en question. La traduction de τὸ πρόσωπον αὐτοῦ par « le rencontrer en personne » explicite de façon un peu étroite une expression qui dit littéralement « voir son visage ».'
  naturalness: La prose est fluide et d'un registre narratif moderne. « Il fut alarmé à cause de lui » est légèrement plus explicite que « Il en fut alarmé », mais reste naturel et restitue mieux le référent grec. « Ne voulut plus le voir » est idiomatique en français moderne.
  terminology: « par ruse » rend sobrement μετὰ δόλου, sans surinterpréter. « l’attaquer » convient au contexte de ἦλθεν ἐπ’ αὐτόν. Aucun terme théologique particulier n'est en jeu.
  issues:
