translation_notes:
  register: 'Français moderne, international et narratif. La traduction privilégie une équivalence optimale : syntaxe française fluide, hostilité de ἐπ’ αὐτόν explicitée par le contexte, et conservation en note des ambiguïtés lexicales et de la tournure grecque.'
