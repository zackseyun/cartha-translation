  yaml_path: translation/deuterocanon/1_maccabees/007/030.yaml
  text: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
translation:
  language: fr
  text: Judas apprit[a] qu’il était venu l’attaquer par ruse. Il fut alarmé à cause de lui et ne voulut plus le voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La chose — ou : la nouvelle — fut connue de Judas ».'
    reason: La syntaxe passive de ἐγνώσθη et la portée de λόγος permettent une traduction plus formelle que le naturel « Judas apprit ».
lexical_decisions:
- source_word: καὶ ἐγνώσθη ὁ λόγος τῷ Ἰούδα
  choice: Judas apprit
  rationale: La tournure passive grecque indique que l’information parvint à Judas. Le français actif avec « apprit » est naturel sans introduire d’informateur absent du texte; la note conserve la structure et la nuance possibles de λόγος.
- source_word: μετὰ δόλου
  choice: par ruse
  rationale: Cette expression rend le moyen trompeur de l’approche sans renforcer indûment δόλος en « trahison ».
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: était venu l’attaquer
  rationale: Dans ce contexte hostile, ἐπί avec l’accusatif exprime un mouvement dirigé contre Judas. Le plus-que-parfait marque naturellement l’antériorité par rapport à ce qu’il apprit.
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: Il en fut alarmé
  rationale: ἐπτοήθη évoque l’effroi ou l’alarme sans imposer la terreur; « en » reprend idiomatiquement la cause constituée par cet homme et son dessein.
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: ne voulut plus
  rationale: La formulation exprime une volonté désormais arrêtée, avec concision et dans un registre narratif digne.
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: le rencontrer en personne
  rationale: L’expression grecque signifie littéralement « voir son visage », mais désigne ici le fait d’accepter une rencontre personnelle. Cette formulation française évite l’impression qu’il s’agit seulement de regarder son visage, tandis que la note conserve la forme littérale.
