    issue: Référent de ἀπ’ αὐτοῦ insuffisamment rendu
    rationale: Dans « Il en fut alarmé », le pronom « en » renvoie normalement au fait appris ou au dessein; le grec indique que Judas fut alarmé à cause de cet homme (ἀπ’ αὐτοῦ).
  - severity: low
    issue: « le rencontrer en personne » est plus interprétatif que nécessaire
    rationale: ἰδεῖν τὸ πρόσωπον αὐτοῦ signifie littéralement « voir son visage » et fonctionne idiomatiquement pour « le voir ». La notion précise d'une rencontre personnelle est possible dans le contexte, mais n'est pas explicitement formulée.
