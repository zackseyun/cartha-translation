  text: And the camps joined battle on the thirteenth day of the month Adar[a], and Nicanor’s camp was crushed,
translation:
  language: fr
  text: Les deux camps engagèrent le combat le treizième jour du mois d’Adar, et le camp de Nicanor fut écrasé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψαν αἱ παρεμβολαὶ εἰς πόλεμον
  choice: Les deux camps engagèrent le combat
  rationale: Dans ce contexte militaire, συνάπτω avec εἰς πόλεμον désigne l’engagement du combat. « Les deux camps » rend naturellement le pluriel αἱ παρεμβολαί tout en désignant les forces adverses, sans remplacer directement l’image grecque par « armées ».
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: le treizième jour du mois d’Adar
  rationale: Le datif marque la date; l’ajout de « jour » est implicite dans le grec et nécessaire en français courant.
- source_word: συνετρίβη
  choice: fut écrasé
  rationale: Le passif de συντρίβω exprime une défaite complète et violente; « fut écrasé » en conserve la force, contrairement au plus neutre « fut vaincu ».
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: le camp de Nicanor
  rationale: « Camp » maintient le lien lexical avec le pluriel précédent et peut désigner ici la force militaire rassemblée sous le commandement de Nicanor.
