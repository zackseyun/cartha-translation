  text: 'Judas établit son camp à Adasa avec trois mille hommes. Judas pria et dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans ce contexte militaire, le verbe désigne l’action d’installer un camp. Cette formulation est naturelle en français moderne tout en conservant la précision du récit.
- source_word: ἐν Ἀδασὰ
  choice: à Adasa
  rationale: La préposition ἐν situe le campement; devant un nom de lieu de cette forme, « à Adasa » est idiomatique en français.
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: avec trois mille hommes
  rationale: La tournure indique les troupes accompagnant Judas. « Avec » rend clairement cette association sans alourdir la phrase.
- source_word: προσηύξατο
  choice: pria
  rationale: Le verbe προσεύχομαι signifie directement prier; le passé simple convient au registre narratif biblique moderne et digne.
- source_word: καὶ εἶπεν
  choice: 'ainsi :'
  rationale: 'Après « pria », traduire littéralement « et dit » serait redondant en français. « Ainsi : » introduit naturellement les paroles de la prière qui suivent, tout en rendant la fonction de εἶπεν.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu mais courant dans la traduction biblique. La répétition du nom Judas est conservée, conformément au grec; « Puis » explicite sobrement la progression narrative portée par le second καί.
