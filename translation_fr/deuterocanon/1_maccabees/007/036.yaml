  text: “I will burn this house.” And he went out in anger[a]. Then the priests entered and stood before the altar and the sanctuary, and they wept and said[b],
translation:
  language: fr
  text: '« Je mettrai le feu à cette maison[a]. » Puis il sortit, plein de colère. Les prêtres entrèrent alors, se tinrent devant l’autel et le sanctuaire, pleurèrent et dirent[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce Temple ». Le grec dit littéralement « cette maison », expression courante pour désigner le Temple.
    reason: lexical_alternative
  - marker: b
    text: Le verset se termine par « dirent »; la prière qu’introduit ce verbe se poursuit au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμπυριῶ
  choice: Je mettrai le feu à
  rationale: Le futur exprime une menace directe. « Mettre le feu à » rend naturellement l’action sans affirmer nécessairement que l’édifice sera entièrement détruit.
- source_word: τὸν οἶκον τοῦτον
  choice: cette maison
  rationale: Le grec dit littéralement « cette maison ». Dans ce contexte, il s’agit du Temple, mais conserver « maison » préserve l’image biblique et la distinction avec ναός plus loin.
- source_word: μετὰ θυμοῦ
  choice: plein de colère
  rationale: Cette tournure française naturelle exprime l’état de colère qui accompagne son départ, sans le registre plus soutenu de « courroux ».
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Équivalent français courant et précis pour les prêtres attachés au Temple.
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: se tinrent devant
  rationale: Rend l’idée de prendre place face à l’autel et au sanctuaire dans une langue digne et naturelle.
- source_word: τοῦ θυσιαστηρίου
  choice: l’autel
  rationale: Terme cultuel français standard.
- source_word: τοῦ ναοῦ
  choice: le sanctuaire
  rationale: ναός peut désigner plus précisément le sanctuaire, par opposition au complexe plus large du Temple; ce choix maintient aussi la distinction lexicale avec οἶκος.
- source_word: ἔκλαυσαν
  choice: pleurèrent
  rationale: Rend directement l’action de pleurer dans le registre narratif solennel du passage.
- source_word: εἶπαν
  choice: dirent
  rationale: Verbe introducteur standard; les deux-points indiquent que les paroles commencent au verset suivant.
