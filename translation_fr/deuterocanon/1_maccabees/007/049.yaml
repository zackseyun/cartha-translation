  text: And they established that this day should be observed year by year, on the thirteenth day of Adar.
translation:
  language: fr
  text: Ils instituèrent l’observance de ce jour, chaque année le treizième jour du mois d’Adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: Ils décidèrent
  rationale: Dans cette construction, l’aoriste de ἵστημι exprime l’établissement d’une pratique. « Décidèrent » rend naturellement en français l’acte collectif qui institue l’observance, sans suggérer nécessairement un décret officiel.
- source_word: τοῦ ἄγειν
  choice: serait observé
  rationale: L’infinitif articulaire indique ce qui fut décidé au sujet de cette journée. « Observer » convient à une commémoration annuelle et évite d’imposer la nuance festive de « célébrer ».
- source_word: κατʼ ἐνιαυτόν
  choice: chaque année
  rationale: Cette expression signifie une récurrence annuelle. « Chaque année » est direct, idiomatique et accessible en français moderne.
- source_word: τὴν ἡμέραν ταύτην
  choice: ce jour
  rationale: Le démonstratif proximal ταύτην est rendu directement par « ce », tandis que « jour » conserve le substantif du grec.
- source_word: τῇ τρισκαιδεκάτῃ
  choice: le treizième jour
  rationale: Le datif indique la date de l’observance. L’ajout explicite de « jour » produit une formulation française claire.
- source_word: τοῦ Ἀδάρ
  choice: du mois d’Adar
  rationale: Ἀδάρ est translittéré comme nom de mois. L’explicitation « mois » facilite la compréhension sans modifier le sens.
