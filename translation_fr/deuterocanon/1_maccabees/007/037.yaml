  yaml_path: translation/deuterocanon/1_maccabees/007/037.yaml
  text: You chose this house for your name to be called upon it[a], to be a house of prayer and petition for your people.
translation:
  language: fr
  text: C’est toi qui as choisi cette maison pour que ton nom soit invoqué sur elle[a], afin qu’elle soit une maison de prière et de supplication pour ton peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour qu’elle porte ton nom ». Le grec emploie une formule biblique indiquant que cette maison appartient à Dieu, qu’elle est placée sous son nom et que son nom y est invoqué.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ ἐξελέξω
  choice: C’est toi qui as choisi
  rationale: Le pronom exprimé Σὺ met le sujet en relief. La tournure « C’est toi qui » rend naturellement cette insistance en français, tandis que « as choisi » traduit l’aoriste de ἐκλέγω sans technicité.
- source_word: τὸν οἶκον τοῦτον
  choice: cette maison
  rationale: « Maison » conserve l’image biblique de οἶκος appliquée au sanctuaire et prépare la reprise « une maison de prière ».
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: pour que ton nom soit invoqué sur elle
  rationale: Cette formulation suit de près le passif grec et préserve la formule biblique, qui peut évoquer à la fois l’invocation du nom divin et l’appartenance de la maison à Dieu.
- source_word: εἶναι
  choice: afin qu’elle soit
  rationale: La proposition infinitive poursuit l’expression du but du choix divin. La reprise pronominale est nécessaire à la fluidité du français.
- source_word: οἶκον προσευχῆς
  choice: une maison de prière
  rationale: Cette expression française naturelle et consacrée reproduit fidèlement la construction grecque et son registre biblique.
- source_word: καὶ δεήσεως
  choice: et de supplication
  rationale: δέησις désigne une demande pressante adressée à Dieu. « Supplication » la distingue de la prière au sens large tout en restant intelligible et digne.
- source_word: τῷ λαῷ σου
  choice: pour ton peuple
  rationale: 'Le datif peut marquer l’intérêt ou la destination : la maison est destinée au service cultuel du peuple. « Pour ton peuple » garde cette valeur sans exclure que le peuple y prie.'
theological_decisions:
- issue: Formule du Nom divin associée au Temple
  choice: pour que ton nom soit invoqué sur elle
  alternative: pour qu’elle porte ton nom
  rationale: Le grec reprend une formule biblique pouvant exprimer l’invocation du nom de Dieu ainsi que son autorité et son lien d’appartenance avec le sanctuaire. Le texte principal conserve la forme verbale et l’ambiguïté réelle; la note signale l’autre expression française possible.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « cette maison… une maison de prière » ainsi que la formule biblique du Nom sont conservés; aucun vocabulaire confessionnel particulier n’est introduit.
