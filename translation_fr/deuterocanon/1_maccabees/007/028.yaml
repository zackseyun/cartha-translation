  yaml_path: translation/deuterocanon/1_maccabees/007/028.yaml
  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: fr
  text: « Qu’il n’y ait pas de combat entre moi et vous. Je viendrai avec quelques hommes afin de voir vos visages en paix. »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que je voie vos visages en paix ». L’expression « voir vos visages » désigne une rencontre personnelle.'
    reason: La note explique l'expression concrète grecque sans introduire l'alternative non attestée « votre visage » ni une ambiguïté syntaxique inexistante.
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: Qu’il n’y ait pas
  rationale: Le tour jussif négatif est rendu par une formulation française directe, naturelle et proche de la force de l’appel grec.
- source_word: μάχη
  choice: combat
  rationale: « Combat » convient au contexte militaire et politique, tout en restant naturel au singulier.
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: entre moi et vous
  rationale: Cette traduction conserve explicitement l’opposition entre le locuteur singulier et ses interlocuteurs pluriels.
- source_word: ἥξω
  choice: Je viendrai
  rationale: Le futur de ἥκω exprime ici la venue ou l’arrivée du locuteur auprès de ses interlocuteurs.
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: avec quelques hommes
  rationale: Dans ce contexte, ἐν marque l’accompagnement; « hommes » correspond aux personnes qui formeront la petite escorte.
- source_word: ἵνα ἴδω
  choice: pour … rencontrer
  rationale: La construction française avec « pour » garde la valeur de but de ἵνα et rend naturellement l’expression idiomatique qui suit.
- source_word: ὑμῶν τὰ πρόσωπα
  choice: vous rencontrer
  rationale: Littéralement « voir vos visages »; en contexte, l’expression désigne une rencontre personnelle. La traduction idiomatique évite une tournure peu naturelle en français, tandis que la note préserve l’image grecque.
- source_word: μετ’ εἰρήνης
  choice: en paix
  rationale: La formule conserve le substantif « paix » et l’idée d’une rencontre dépourvue d’hostilité.
