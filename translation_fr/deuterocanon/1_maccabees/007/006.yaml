  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: fr
  text: 'Ils accusèrent le peuple devant le roi en disant : « Judas et ses frères ont fait périr tous tes amis[a] et nous ont dispersés hors de notre pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes alliés » ou « tes partisans » ; dans un contexte royal, les « amis » peuvent être les soutiens politiques du roi ou des membres de son entourage.
    reason: Alternative lexicale et nuance du vocabulaire royal hellénistique.
lexical_decisions:
- source_word: κατηγόρησαν
  choice: accusèrent
  rationale: Le verbe désigne l’action d’accuser ou de porter une accusation; « accusèrent » est direct et naturel dans ce compte rendu hostile.
- source_word: τοῦ λαοῦ
  choice: le peuple
  rationale: Le génitif marque ici l’objet de l’accusation. « Le peuple » rend simplement le grec sans lui imposer un sens national plus technique.
- source_word: πρὸς τὸν βασιλέα
  choice: devant le roi
  rationale: Avec un verbe d’accusation, πρός indique la personne à qui l’accusation est présentée; « devant le roi » restitue le cadre officiel.
- source_word: Ἀπώλεσεν
  choice: ont fait périr
  rationale: Dans ce contexte, ἀπόλλυμι évoque l’élimination de personnes. « Faire périr » conserve une légère ouverture quant à la manière exacte, sans réduire nécessairement le sens à « tuer ».
- source_word: οἱ φίλοι σου
  choice: tes amis
  rationale: « Amis » est le sens direct de φίλοι; dans un contexte royal hellénistique, le mot peut aussi désigner des partisans, alliés ou proches de la cour, nuance signalée en note.
- source_word: ἐσκόρπισεν
  choice: nous ont dispersés
  rationale: Le verbe signifie disperser ou éparpiller. Cette traduction préserve l’image et exprime le déplacement du groupe.
- source_word: ἀπὸ τῆς γῆς ἡμῶν
  choice: loin de notre pays
  rationale: ἀπό indique l’éloignement à partir du territoire des locuteurs; « loin de notre pays » exprime clairement qu’ils en ont été dispersés, tandis que γῆ est ici naturellement rendu par « pays ».
theological_decisions:
- issue: Accord des verbes grecs au singulier avec « Judas et ses frères »
  choice: 'Employer en français le pluriel : « ont fait périr… nous ont dispersés »'
  alternative: 'Conserver la mise en avant grammaticale de Judas : « Judas a fait périr… et ses frères avec lui »'
  rationale: Le grec met Judas au premier plan par des verbes au singulier, malgré le groupe sujet explicite. Le français courant appelle le pluriel avec « Judas et ses frères »; ce choix rend l’accusation naturellement sans introduire de distinction doctrinale d’agence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au récit historique, tandis que le passé composé dans la citation rend l’accusation immédiate et naturelle. La formulation conserve la portée politique possible de « amis » au moyen d’une note.
