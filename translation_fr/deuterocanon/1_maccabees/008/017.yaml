base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/017.yaml
  text: And Judas chose Eupolemus son of John[a], the son of Accos, and Jason son of Eleazar, and sent them to Rome to establish friendship and alliance with them,
translation:
  language: fr
  text: Judas choisit Eupolème, fils de Jean, lui-même fils d’Accos[a], ainsi que Jason, fils d’Éléazar, et il les envoya à Rome pour établir avec les Romains des relations d’amitié et une alliance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être: « Eupolème, fils de Jean d’Accos », si le dernier complément est directement rattaché à Jean plutôt que compris comme une deuxième indication de filiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: choisit
  rationale: Le verbe désigne simplement l’action de choisir ou de sélectionner; « choisit » est naturel dans le récit et n’ajoute pas l’idée d’une nomination officielle.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Rendu narratif courant et fidèle du verbe grec.
- source_word: στῆσαι
  choice: pour établir
  rationale: L’infinitif aoriste exprime ici le but de l’envoi et vise la mise en place d’une relation diplomatique.
- source_word: φιλίαν
  choice: des relations d’amitié
  rationale: Dans ce contexte diplomatique, le terme évoque une amitié officielle entre collectivités; cette formulation rend clairement cette nuance en français moderne.
- source_word: συμμαχίαν
  choice: une alliance
  rationale: Le mot désigne une alliance politique, souvent militaire, sans que le contexte immédiat oblige à préciser davantage.
- source_word: τοῦ Ἀκχώς
  choice: lui-même fils d’Accos
  rationale: 'La reprise de l’article au génitif se comprend naturellement comme la continuation de la chaîne patronymique: Eupolème est fils de Jean, lequel est fils d’Accos.'
- source_word: αὐτοῖς
  choice: avec les Romains
  rationale: Le datif est relationnel dans ce contexte diplomatique. L’explicitation de l’antécédent évite en français une ambiguïté artificielle avec les envoyés.
