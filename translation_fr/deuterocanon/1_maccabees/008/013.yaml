review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend adéquatement le double infinitif et la répétition de βασιλεύειν/βασιλεύουσιν dans son sens contextuel causatif : Rome soutient certaines personnes et les établit dans la royauté. « Destituer » convient à μεθιστῶσιν dans ce contexte politique, sans impliquer leur mort. En revanche, « Ils se sont élevés » présente l’élévation comme réflexive/active, alors que ὑψώθησαν est un aoriste passif (« ils furent/ont été grandement élevés »).'
  naturalness: Le français est globalement clair, soutenu et moderne. « Ils ont atteint une très grande puissance » est plus idiomatique que « ils se sont élevés à une très grande puissance » et évite de transformer le passif grec en action réflexive. La répétition « faire régner … font régner » est recevable et reflète l’insistance de l’original.
  terminology: « Faire régner » et « destituer » sont appropriés au registre politique du passage. La note sur « destituer » conserve utilement l’alternative plus large « écarter ». La note finale doit corriger le littéral pour rendre le passif grec.
