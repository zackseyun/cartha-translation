  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: fr
  text: Ceux qu’ils veulent aider et faire régner, ils les font régner ; ceux qu’ils veulent, ils les destituent[a]. Ils ont atteint une très grande puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils les écartent » ; le verbe grec peut désigner le fait de déplacer quelqu’un ou, dans ce contexte politique, de le destituer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ont été grandement élevés » ; dans ce contexte, l’expression décrit leur accession à une puissance considérable.'
    reason: literal_rendering
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  choice: Ceux qu’ils veulent
  rationale: La relative indéfinie avec ἄν et le subjonctif désigne sans restriction les personnes que les Romains choisissent. Cette formulation est naturelle en français et permet de reprendre explicitement le complément par « ils les ».
- source_word: βοηθεῖν
  choice: aider
  rationale: Le verbe signifie venir en aide ou prêter assistance. « Aider » reste clair et n’ajoute pas une précision militaire absente du terme lui-même.
- source_word: καὶ βασιλεύειν … βασιλεύουσιν
  choice: et faire régner, ils les font régner
  rationale: Dans ce contexte politique, le parallélisme avec la destitution exprime le pouvoir des Romains d’établir des souverains. La tournure causative française rend ce sens contextuel tout en conservant la répétition marquée du grec.
- source_word: μεθιστῶσιν
  choice: ils les destituent
  rationale: Le verbe peut signifier déplacer, écarter ou changer. Appliqué aux souverains que Rome établit ou écarte, « destituer » exprime précisément le sens politique sans suggérer nécessairement leur mise à mort.
- source_word: ὑψώθησαν σφόδρα
  choice: Ils se sont élevés à une très grande puissance
  rationale: L’expression signifie littéralement qu’ils ont été ou se sont trouvés grandement élevés. Ici, elle résume l’ascension politique de Rome ; « à une très grande puissance » en explicite naturellement la portée contextuelle.
