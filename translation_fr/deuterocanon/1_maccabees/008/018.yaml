  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: fr
  text: et de leur ôter leur joug, car ils voyaient que le royaume des Grecs réduisait Israël en esclavage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « asservissait Israël à l’esclavage »; le grec insiste en employant deux mots de la même famille sémantique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆραι
  choice: ôter
  rationale: Avec « joug », l’aoriste infinitif de αἴρω exprime le retrait d’un poids ou d’une domination; « ôter » rend naturellement cette idée.
- source_word: ζυγὸν
  choice: joug
  rationale: Le terme désigne littéralement un joug et, par métaphore, une domination oppressive. L’image reste claire en français.
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: le royaume des Grecs
  rationale: Cette formulation conserve directement le sens politique de βασιλεία et le génitif ethnique Ἑλλήνων sans préciser davantage la nature de ce pouvoir.
- source_word: καταδουλουμένους … δουλίαν
  choice: réduisait Israël en esclavage
  rationale: Cette tournure française idiomatique exprime avec force le processus de mise en servitude indiqué par le verbe intensif et son complément apparenté.
theological_decisions:
- issue: Redoublement du vocabulaire grec de l’esclavage
  choice: réduisait Israël en esclavage
  alternative: asservissait Israël à l’esclavage
  rationale: Le grec associe καταδουλόω et δουλία pour produire une insistance. La traduction principale conserve le résultat explicite, « en esclavage », tout en évitant en français une répétition maladroite; la note signale la formulation littérale.
translation_notes:
  register: Français moderne, digne et accessible. « Ôter leur joug » préserve l’image traditionnelle sans archaïsme marqué; « réduisait … en esclavage » restitue naturellement l’emphase du grec.
