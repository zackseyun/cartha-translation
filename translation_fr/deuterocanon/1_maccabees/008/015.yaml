  text: And they established a council for themselves, and every day three hundred and twenty would deliberate, continually taking counsel concerning the multitude, to govern themselves well.
translation:
  language: fr
  text: Ils établirent pour eux-mêmes un conseil, et chaque jour trois cent vingt hommes délibéraient, se concertant sans cesse au sujet du peuple, afin d’assurer le bon ordre parmi eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet du peuple, afin qu’ils se maintiennent eux-mêmes en bon ordre ». Le grec peut rapporter « eux-mêmes » aux Romains dans leur ensemble; dans le contexte, l’expression évoque l’organisation et le bon ordre de la collectivité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευτήριον
  choice: conseil
  rationale: Dans ce contexte institutionnel, le mot désigne un corps délibérant. « Conseil » est naturel et n’impose pas le terme romain plus précis de « sénat ».
- source_word: ἐποίησαν ἑαυτοῖς
  choice: ils établirent pour eux-mêmes
  rationale: Le sens littéral est « ils firent pour eux-mêmes », mais, à propos d’une institution, « établirent » exprime clairement sa mise en place tout en conservant le réfléchi.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Rend directement l’expression temporelle et son caractère régulier.
- source_word: ἐβουλεύοντο
  choice: délibéraient
  rationale: L’imparfait grec présente une activité habituelle ou répétée; l’imparfait français en garde naturellement la valeur.
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: trois cent vingt hommes
  rationale: Rend directement le nombre; « hommes » explicite en français le masculin personnel sous-entendu par le numéral grec substantivé.
- source_word: βουλευόμενοι διὰ παντός
  choice: se concertant sans cesse
  rationale: Exprime la délibération continue indiquée par le participe et διὰ παντός, sans répétition lourde de « délibérer ».
- source_word: περὶ τοῦ πλήθους
  choice: au sujet du peuple
  rationale: πλῆθος désigne ici la collectivité ou la population; « peuple » convient au contexte civique sans suggérer péjorativement une foule.
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: afin d’assurer le bon ordre parmi eux
  rationale: εὐκοσμεῖν signifie mettre ou maintenir en bon ordre. Cette formulation préserve le sens civique et le réfléchi sans réduire l’expression à la seule idée de gouverner.
