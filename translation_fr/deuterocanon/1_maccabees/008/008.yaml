  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
translation:
  language: fr
  text: ainsi que l’Inde, la Médie et la Lydie, parmi les plus belles de leurs régions[a]. Ils les lui prirent et les donnèrent au roi Eumène.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi leurs territoires les plus précieux ». Le grec dit littéralement « parmi leurs plus belles régions », expression pouvant désigner des territoires particulièrement désirables ou excellents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  choice: l’Inde, la Médie et la Lydie
  rationale: Les trois accusatifs désignent des régions géopolitiques. En français, leurs noms usuels suffisent sans répéter « le pays de ».
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: qui comptaient parmi leurs plus belles régions
  rationale: Cette formulation restitue la valeur partitive de ἀπό et le superlatif καλλίστων, tout en rattachant naturellement la proposition aux territoires nommés. « Belles » conserve l’image grecque sans imposer une interprétation purement esthétique.
- source_word: λαβόντες
  choice: Ils les lui prirent
  rationale: Le participe aoriste exprime une action antérieure à celle de donner. Deux verbes conjugués rendent clairement la succession narrative en français.
- source_word: παρ’ αὐτοῦ
  choice: lui
  rationale: Le pronom renvoie au souverain évoqué dans le contexte; le conserver évite d’expliciter un antécédent que ce verset ne répète pas.
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: les donnèrent au roi Eumène
  rationale: La tournure française place naturellement le titre avant le nom et garde le sens direct de ἔδωκαν.
