base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/014.yaml
  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: fr
  text: Dans tout cela, aucun d’eux ne posa sur sa tête un diadème[a] et ils ne se revêtirent pas de pourpre[b] pour s’en grandir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couronne »; le mot grec désigne précisément le bandeau royal porté comme signe de royauté.
    reason: lexical_alternative
  - marker: b
    text: La pourpre était un signe de royauté ou de rang élevé.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: Dans tout cela
  rationale: Formulation française naturelle qui renvoie globalement aux pratiques politiques romaines décrites auparavant.
- source_word: ἐπέθετο ... διάδημα
  choice: ne posa sur sa tête un diadème
  rationale: « Diadème » conserve le sens précis de l’insigne royal grec, tandis que « sur sa tête » explicite naturellement le geste exprimé par ἐπέθετο.
- source_word: πορφύραν
  choice: de pourpre
  rationale: Le grec désigne par métonymie un vêtement de pourpre; la tournure « se revêtir de pourpre » garde cette concision et sa connotation de haut rang.
- source_word: ἁδρυνθῆναι
  choice: pour s’en grandir
  rationale: Cette expression rend l’idée de se donner de l’importance ou de la grandeur, sans réduire le verbe au seul orgueil intérieur.
- source_word: ἐν αὐτῇ
  choice: s’en
  rationale: Le pronom renvoie vraisemblablement à la pourpre comme moyen de se grandir; « s’en » exprime ce rapport avec concision.
