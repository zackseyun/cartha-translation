base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: fr
  text: Que tout aille bien pour les Romains et pour la nation des Juifs, sur mer comme sur terre, pour toujours ; que l’épée[a] et l’ennemi restent loin d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « l’épée » représente probablement la guerre, mais le texte grec emploie le terme concret.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: Que tout aille bien
  rationale: L’optatif exprime un souhait solennel. Cette formulation est naturelle en français moderne et conserve cette valeur sans archaïsme.
- source_word: Ῥωμαίοις
  choice: pour les Romains
  rationale: Le datif désigne le peuple romain comme bénéficiaire du souhait.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: pour la nation des Juifs
  rationale: ἔθνος désigne ici un peuple constitué dans un cadre politico-ethnique ; « nation des Juifs » reste proche du grec et convient au contexte d’un traité.
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: sur mer comme sur terre
  rationale: Cette paire conventionnelle couvre tous les domaines d’activité. « Comme » rend naturellement en français le parallélisme sans en expliciter excessivement la portée.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française courante d’une durée indéfinie et durable dans ce contexte d’alliance.
- source_word: ῥομφαία
  choice: l’épée
  rationale: Le terme concret est conservé, même s’il évoque probablement la guerre par métonymie.
- source_word: ἐχθρός
  choice: l’ennemi
  rationale: Le singulier grec est maintenu ; il peut avoir une valeur collective ou représentative.
- source_word: μακρυνθείη ἀπ' αὐτῶν
  choice: restent loin d’eux
  rationale: L’optatif passif exprime le souhait d’un éloignement. Le pluriel verbal exigé en français par le sujet composé transmet naturellement cette idée.
