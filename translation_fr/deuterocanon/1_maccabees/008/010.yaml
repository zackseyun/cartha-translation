  yaml_path: translation/deuterocanon/1_maccabees/008/010.yaml
  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: fr
  text: Quand ils apprirent la nouvelle, ils envoyèrent contre eux un seul général. Ils les combattirent, et beaucoup parmi les vaincus tombèrent blessés. Ils emmenèrent leurs femmes et leurs enfants en captivité, dépouillèrent les vaincus, prirent le contrôle de leur pays, abattirent leurs forteresses et dépouillèrent les vaincus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec répète ici « dépouillèrent les vaincus ». Cette répétition est conservée dans le texte, car elle peut constituer une insistance délibérée ou provenir d’une duplication lors de la transmission du texte.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος αὐτοῖς
  choice: ils apprirent la nouvelle
  rationale: Dans ce récit, λόγος désigne la nouvelle ou l’information qui parvient aux Romains. Cette formulation naturelle rend le passif grec sans donner à λόγος le sens isolé de « parole ».
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: ils envoyèrent contre eux un seul général
  rationale: « Général » convient au contexte militaire, et « un seul » conserve l’accent porté par ἕνα sur l’unicité du commandant envoyé.
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: ils les combattirent
  rationale: Formulation française directe qui conserve le sens hostile de πρὸς dans ce contexte militaire.
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: beaucoup d’entre eux tombèrent blessés
  rationale: τραυματίαι désigne des blessés ou des hommes frappés au combat. « Tombèrent blessés » préserve l’image militaire sans affirmer explicitement qu’ils moururent.
- source_word: ᾐχμαλώτισαν τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν
  choice: ils emmenèrent leurs femmes et leurs enfants en captivité
  rationale: Le verbe désigne la capture de personnes comme prisonniers de guerre. « Emmenèrent … en captivité » en exprime clairement la portée.
- source_word: ἐπρονόμευσαν αὐτούς
  choice: les pillèrent
  rationale: Le verbe signifie piller ou dépouiller après une victoire. La même traduction est conservée lors de sa répétition finale dans le grec.
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: prirent le contrôle de leur pays
  rationale: κατακρατέω avec le génitif exprime la maîtrise ou la domination. « Prirent le contrôle » évite de préciser indûment la nature juridique de la possession; « pays » désigne ici le territoire des vaincus.
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: abattirent leurs forteresses
  rationale: καθαιρέω exprime la destruction ou le démantèlement, tandis que ὀχυρώματα désigne des ouvrages ou lieux fortifiés. La formulation est concise et accessible.
