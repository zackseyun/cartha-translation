review_pass:
  verdict: revise
  source_fidelity: Le projet respecte la succession des actions et conserve à juste titre la répétition finale de ἐπρονόμευσαν αὐτούς. Toutefois, « beaucoup d’entre eux tombèrent blessés » laisse en français l’antécédent incertain (les Romains ou leurs adversaires) et « les pillèrent », placé immédiatement après la capture des femmes et des enfants, peut faire comprendre que les captives sont pillées. Une formulation explicitant les vaincus rend mieux les pronoms grecs dans le flux français sans ajouter de détail historique.
  naturalness: Le registre narratif est naturel et moderne. La révision allège les ambiguïtés référentielles et emploie « dépouiller » avec un complément personnel, emploi plus idiomatique que « piller » appliqué directement à des personnes dans ce contexte.
  terminology: « Général », « emmenèrent ... en captivité », « prirent le contrôle de leur pays » et « forteresses » conviennent. « Dépouillèrent les vaincus » rend ἐπρονόμευσαν αὐτούς sans transformer indûment le référent personnel en territoire ou en biens, et sa répétition reflète celle du grec.
  issues:
  - severity: medium
    issue: Ambiguïté de l’antécédent de « beaucoup d’entre eux »
    rationale: Le grec ἐξ αὐτῶν renvoie aux adversaires contre lesquels le général a été envoyé; en français, après « Ils les combattirent », « d’entre eux » peut se rapporter aux deux groupes évoqués.
  - severity: medium
    issue: Ambiguïté de « les pillèrent » après « leurs femmes et leurs enfants »
    rationale: Le pronom grec αὐτούς vise les adversaires vaincus, non les femmes et enfants qui viennent d’être pris captifs. La syntaxe française actuelle favorise à tort ce dernier antécédent.
