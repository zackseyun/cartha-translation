revisions:
- from: Quand ils apprirent la nouvelle, ils envoyèrent contre eux un seul général. Ils les combattirent, et beaucoup d’entre eux tombèrent blessés. Ils emmenèrent leurs femmes et leurs enfants en captivité, les pillèrent, prirent le contrôle de leur pays, abattirent leurs forteresses et les pillèrent[a].
  to: Quand ils apprirent la nouvelle, ils envoyèrent contre eux un seul général. Ils les combattirent, et beaucoup parmi les vaincus tombèrent blessés. Ils emmenèrent leurs femmes et leurs enfants en captivité, dépouillèrent les vaincus, prirent le contrôle de leur pays, abattirent leurs forteresses et dépouillèrent les vaincus[a].
  rationale: La révision conserve toutes les actions, leur ordre et la répétition attestée par le texte grec. Elle explicite seulement, là où le français risquait de créer une fausse référence, que les personnes blessées et dépouillées sont les adversaires vaincus. « Dépouiller » rend naturellement le fait de priver les vaincus de leurs biens tout en conservant le complément personnel αὐτούς.
