base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: fr
  text: Judas, appelé aussi Maccabée, ses frères et un grand nombre de Juifs nous ont envoyés auprès de vous afin d’établir avec vous une alliance et la paix, et d’être inscrits[a] comme vos alliés et vos amis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être enregistrés officiellement comme vos alliés et vos amis ». Le verbe grec peut désigner une inscription ou un enregistrement officiel, probablement dans un cadre diplomatique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: « Judas » est la forme française traditionnelle du nom grec Ἰούδας dans les livres des Maccabées.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: appelé aussi Maccabée
  rationale: La tournure indique un autre nom ou un surnom ; cette formulation est claire et naturelle en français.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Traduction directe du terme familial, qui désigne ici les frères de Judas.
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: l’ensemble des Juifs
  rationale: πλῆθος désigne ici le corps collectif des Juifs. « L’ensemble » restitue ce sens sans suggérer nécessairement une institution formelle et sonne plus naturellement que « la multitude » dans ce contexte diplomatique.
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: nous ont envoyés auprès de vous
  rationale: Rend directement l’envoi des délégués vers leurs destinataires, dans un registre diplomatique naturel.
- source_word: στῆσαι μεθ' ὑμῶν
  choice: afin d’établir avec vous
  rationale: Dans ce contexte, στῆσαι exprime la mise en place officielle d’un accord ; « établir » convient au registre.
- source_word: συμμαχίαν καὶ εἰρήνην
  choice: une alliance et la paix
  rationale: La traduction conserve les deux noms distincts sans préciser indûment qu’il s’agit d’une alliance militaire ou d’un traité de paix.
- source_word: γραφῆναι ἡμᾶς
  choice: de nous faire inscrire
  rationale: Le passif de γράφω évoque vraisemblablement une inscription ou un enregistrement officiel. La tournure causative française exprime naturellement le souhait que les destinataires procèdent à cette inscription.
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: comme vos alliés et vos amis
  rationale: Cette formule restitue clairement la double qualité diplomatique demandée.
