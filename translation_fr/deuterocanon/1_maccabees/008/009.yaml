lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἑλλάδος
  choice: ceux de Grèce
  rationale: Rend littéralement l’origine indiquée par la tournure grecque sans préciser davantage leur identité ethnique.
- source_word: ἐβουλεύσαντο
  choice: avaient projeté
  rationale: Exprime en français moderne la délibération ayant abouti à un dessein, sans ajouter la nuance nécessairement malveillante de « comploter ».
- source_word: ἐλθεῖν
  choice: de venir
  rationale: Traduction directe de l’infinitif grec, coordonné au second infinitif.
- source_word: ἐξᾶραι
  choice: les éliminer
  rationale: Dans ce contexte politico-militaire, le verbe désigne leur suppression ou leur éviction par la force. « Éliminer » conserve une certaine latitude quant à la manière et à l’étendue de cette action.
- source_word: αὐτούς
  choice: les
  rationale: Pronom complément naturel en français, renvoyant au groupe mentionné dans le contexte.
