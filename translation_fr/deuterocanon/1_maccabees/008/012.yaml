base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: fr
  text: Mais ils maintinrent avec leurs alliés[a] et avec ceux qui s’appuyaient sur eux des relations d’amitié, et ils prirent le contrôle des royaumes proches et lointains ; tous ceux qui entendaient parler d’eux[b] les craignaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs amis ». Le grec φίλοι peut désigner des amis personnels ou des alliés politiques ; le contexte diplomatique favorise le sens d’« alliés ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « entendaient leur nom », expression qui évoque ici leur réputation ou leur renommée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mais
  rationale: δέ assure la progression du récit avec une légère nuance de contraste ; « Mais » convient ici au mouvement argumentatif du passage.
- source_word: τῶν φίλων αὐτῶν
  choice: leurs amis
  rationale: φίλοι peut désigner des amis personnels ou des alliés politiques. « Amis » préserve cette amplitude, tandis que le contexte diplomatique permet de comprendre des partenaires ou alliés.
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: ceux qui s’appuyaient sur eux
  rationale: Le participe de ἐπαναπαύομαι exprime le fait de placer sa confiance ou son soutien en quelqu’un ; cette formulation française conserve l’image de dépendance.
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: ils restèrent en bons termes avec eux
  rationale: συντηρέω signifie maintenir ou préserver, et φιλία désigne ici une relation amicale, vraisemblablement diplomatique. La tournure choisie est naturelle en français moderne.
- source_word: κατεκράτησαν
  choice: ils prirent le contrôle
  rationale: κατακρατέω exprime la domination ou la maîtrise exercée sur quelque chose ; « prendre le contrôle » rend l’acquisition de cette domination sans suggérer qu’ils devinrent eux-mêmes rois.
- source_word: τῶν βασιλειῶν τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: des royaumes proches et lointains
  rationale: La formulation conserve le sens territorial de βασιλεῖαι et le mérisme géographique exprimant une vaste étendue.
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: tous ceux qui entendaient parler d’eux
  rationale: Littéralement, le grec dit « entendaient leur nom » ; l’expression évoque le fait d’entendre parler de leur réputation. La traduction idiomatique française en communique clairement le sens.
- source_word: ἐφοβοῦντο αὐτούς
  choice: les craignaient
  rationale: La traduction directe rend la peur inspirée par la puissance romaine.
