  text: The nation of the Jews shall be an ally[a], as the occasion may indicate for them, with a full heart.
translation:
  language: fr
  text: La nation des Juifs sera une alliée, selon ce que les circonstances lui indiqueront, de tout cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec un cœur plein ».'
    reason: La note conserve l’image grecque derrière l’expression idiomatique française « de tout cœur ».
lexical_decisions:
- source_word: συμμαχήσει
  choice: se joindra à eux comme alliée
  rationale: Le futur de συμμαχέω exprime ici le fait d’agir en alliance. Cette formulation convient au contexte diplomatique sans réduire nécessairement l’alliance au seul combat.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: la nation des Juifs
  rationale: « Nation » conserve la portée politique et collective de ἔθνος, tandis que « des Juifs » rend directement le génitif.
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: selon ce que les circonstances lui indiqueront
  rationale: ὡς ἄν avec le subjonctif marque ici une éventualité dépendant de l’occasion. καιρός désigne les circonstances opportunes, et ὑπογράφῃ peut signifier « indiquer » ou « prescrire ». Le singulier « lui » reprend naturellement « la nation » en français.
- source_word: καρδίᾳ πλήρει
  choice: de tout cœur
  rationale: Cette expression française naturelle rend l’idée idiomatique d’un engagement entier et sincère portée par le grec littéral « d’un cœur plein ».
