- from: La nation des Juifs se joindra à eux comme alliée, selon ce que les circonstances lui indiqueront, de tout cœur.[a]
  to: La nation des Juifs sera une alliée, selon ce que les circonstances lui indiqueront, de tout cœur.[a]
