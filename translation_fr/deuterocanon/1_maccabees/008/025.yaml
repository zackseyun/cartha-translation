review_pass:
  verdict: revise
  source_fidelity: La formulation « se joindra à eux comme alliée » ajoute un complément (« à eux ») qui n’est pas exprimé dans ce verset et oriente συμμαχήσει vers l’idée de rejoindre un groupe. Le verbe signifie plus directement « être allié / s’allier ». « Selon ce que les circonstances lui indiqueront » rend correctement ὡς ἂν…ὑπογράφῃ αὐτοῖς, avec l’éventualité et le datif repris par « lui ». « De tout cœur » rend bien καρδίᾳ πλήρει.
  naturalness: Le français est globalement naturel et de registre diplomatique. « Sera une alliée » est plus direct, plus idiomatique et plus proche du grec que « se joindra à eux comme alliée ».
  terminology: « La nation des Juifs » préserve la portée collective et politique de τὸ ἔθνος τῶν Ἰουδαίων. « De tout cœur » est une équivalence française naturelle de l’expression grecque; la note littérale doit employer « avec un cœur plein », qui reflète mieux le datif instrumental.
  issues:
  - severity: medium
    issue: Ajout et orientation de « à eux » dans « se joindra à eux comme alliée »
    rationale: Le grec ne donne pas ici de complément explicite à συμμαχήσει; αὐτοῖς dépend de ὑπογράφῃ. La tournure actuelle introduit donc un référent et infléchit inutilement le sens vers l’adhésion à un groupe.
  - severity: low
    issue: Formulation de la note littérale
    rationale: « D’un cœur plein » ne reproduit pas au plus près la valeur instrumentale du datif καρδίᾳ. « Avec un cœur plein » est la formulation littérale plus exacte.
