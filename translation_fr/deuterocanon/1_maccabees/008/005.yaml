  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: fr
  text: 'Philippe, Persée, roi des Kittiens[a][b], et ceux qui s’étaient dressés contre eux : ils les écrasèrent dans la guerre et prirent le dessus sur eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « roi des Kittiens ». Dans le contexte historique, l’expression peut désigner le royaume macédonien ; certaines traductions rendent donc « roi des Macédoniens ».'
    reason: alternative_reading
  - marker: b
    text: Le texte grec transmis répète ici plusieurs fois la conjonction « et ». Il s’agit vraisemblablement d’une irrégularité textuelle qui ne modifie pas sensiblement le sens.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: Περσέα
  choice: Persée
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: Κιτιέων
  choice: des Kittiens
  rationale: Reproduit l’ethnonyme grec au pluriel sans lui substituer l’identification historique probable avec le royaume macédonien.
- source_word: βασιλέα
  choice: roi
  rationale: Équivalent français direct et naturel du titre royal.
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτούς
  choice: ceux qui s’étaient dressés contre eux
  rationale: Rend l’image d’une hostilité déclarée exprimée par ἐπαίρω, tout en conservant le pronom ambigu du grec.
- source_word: συνέτριψαν αὐτούς
  choice: ils les écrasèrent
  rationale: Exprime la défaite militaire décisive et conserve la reprise pronominale emphatique du texte grec.
- source_word: πολέμῳ
  choice: à la guerre
  rationale: Rend le datif dans son sens circonstanciel ou instrumental militaire sans le restreindre à une seule bataille.
- source_word: κατεκράτησαν αὐτῶν
  choice: prirent le dessus sur eux
  rationale: Expression française actuelle indiquant qu’ils acquirent la maîtrise sur leurs adversaires, sans affirmer nécessairement une domination politique durable.
theological_decisions:
- issue: Identification historiquement chargée de Κιτιέων
  choice: des Kittiens
  alternative: des Macédoniens ; de Kition
  rationale: Le texte principal suit l’ethnonyme transmis par le grec. L’identification historique probable avec le domaine macédonien est signalée en note plutôt qu’introduite dans la traduction.
- issue: Référent de αὐτούς dans « contre eux »
  choice: conserver le pronom « eux »
  alternative: expliciter « contre les Romains »
  rationale: Le contexte peut orienter vers les Romains, mais le verset emploie un pronom. La traduction ne résout donc pas silencieusement son référent.
translation_notes:
  register: Français moderne, international et digne. La construction détachée en tête de phrase conserve l’ordre emphatique des compléments dans le grec, tandis que « prirent le dessus » évite un registre trop archaïque. Tous les marqueurs de note figurent dans le texte.
