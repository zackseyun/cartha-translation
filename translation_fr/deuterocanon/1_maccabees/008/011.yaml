  rationale: La révision résout l’ambiguïté référentielle créée par « tous ceux » tout en conservant la totalité exprimée par ὅσοι et l’indéfini ποτέ (« un jour »). Elle maintient les termes forts relatifs à l’esclavage et les deux ancres de notes existantes.
