base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/011.yaml
  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: fr
  text: Ils les réduisirent en esclavage jusqu’à ce jour[a]. Quant à tous les autres royaumes et à toutes les îles qui leur résistèrent un jour, ils les dévastèrent[b] et se les asservirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « encore aujourd’hui ».'
    reason: La formule grecque indique que cet état se prolonge jusqu’au présent du narrateur.
  - marker: b
    text: 'Ou : « détruisirent » ou « ruinèrent ».'
    reason: Le verbe grec peut désigner une destruction ou une dévastation sévère, sans préciser à lui seul si elle fut totale.
lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: réduisirent en esclavage
  rationale: Cette expression conserve la force de καταδουλόω, qui désigne la réduction à l’esclavage ou à une sujétion complète, sans l’atténuer en simple domination politique.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Formule française digne et naturelle qui indique que la situation se prolonge jusqu’au présent du narrateur.
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: les autres royaumes
  rationale: Dans ce contexte de catalogue, « les autres royaumes » rend naturellement les royaumes qui restaient après ceux déjà mentionnés.
- source_word: τὰς νήσους
  choice: les îles
  rationale: Traduction directe de νήσους, sans explicitation géopolitique absente du grec.
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: tous ceux qui leur résistèrent un jour
  rationale: « Tous ceux » préserve la portée générale de ὅσοι, tandis que « un jour » rend l’indéfini ποτέ sans suggérer nécessairement une résistance permanente.
- source_word: κατέφθειραν
  choice: dévastèrent
  rationale: Dans un contexte militaire, καταφθείρω exprime une destruction sévère. « Dévastèrent » garde cette force sans imposer l’idée d’un anéantissement total, difficile à concilier avec l’asservissement qui suit.
- source_word: ἐδούλωσαν αὐτοῖς
  choice: se les asservirent
  rationale: 'La tournure française rend à la fois l’asservissement exprimé par δουλόω et l’idée du datif αὐτοῖς : ils les placèrent sous leur propre domination.'
theological_decisions:
- issue: Force du vocabulaire de l’esclavage dans un contexte politico-militaire
  choice: Conserver « réduisirent en esclavage » et « asservirent »
  alternative: Employer « soumirent » ou « assujettirent » dans les deux cas
  rationale: Les verbes grecs appartiennent à la famille de δοῦλος et expriment ici une domination particulièrement dure. Les rendre par de simples termes de sujétion politique affaiblirait leur portée, sans que le contexte justifie cette atténuation.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La reprise « tous ceux… ils » conserve autant que possible la construction grecque, qui passe des royaumes et des îles aux personnes ou peuples qui résistèrent. « Se les asservirent » est légèrement marqué, mais demeure idiomatique et représente explicitement la domination exercée au profit des Romains.
