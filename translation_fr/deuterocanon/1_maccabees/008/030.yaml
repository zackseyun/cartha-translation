base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: fr
  text: Mais si, après ces dispositions, les uns et les autres décident d’y ajouter ou d’en retrancher quelque chose, ils agiront selon leur propre choix, et tout ce qu’ils ajouteront ou retrancheront sera valable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aura force » ou « sera contraignant » dans ce contexte juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: dispositions
  rationale: Dans le contexte juridique d’un traité, le mot désigne les clauses ou dispositions énoncées, et non de simples paroles.
- source_word: βουλεύσωνται
  choice: décident
  rationale: Le verbe peut désigner la délibération ou la résolution qui en résulte; dans cette condition juridique, « décident » est clair et naturel.
- source_word: οὗτοι καὶ οὗτοι
  choice: les uns et les autres
  rationale: La répétition des démonstratifs renvoie aux deux parties contractantes; cette tournure française conserve la réciprocité sans préciser davantage que le grec.
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: y ajouter ou en retrancher quelque chose
  rationale: Les pronoms renvoient naturellement aux dispositions et rendent explicite en français la modification du traité, tandis que « retrancher » convient au registre juridique.
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: selon leur propre choix
  rationale: αἵρεσις signifie ici choix ou décision, sans son sens ultérieur de secte; la formule préserve l’idée que la modification dépend de la volonté commune des parties.
- source_word: κύρια
  choice: valable
  rationale: Au neutre pluriel, l’adjectif qualifie les ajouts ou retraits comme juridiquement valides et ayant force; « valable » est idiomatique et sobre.
