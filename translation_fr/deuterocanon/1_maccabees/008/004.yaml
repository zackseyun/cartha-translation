base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: fr
  text: Ils exercèrent leur domination sur toute la région grâce à leur politique et à l’épée — alors même qu’elle était très éloignée d’eux — ainsi que sur les rois qui étaient venus les attaquer depuis l’extrémité de la terre[a], jusqu’à ce qu’ils les écrasent et leur portent un coup terrible ; les autres leur versent un tribut année après année[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « depuis l’extrémité de la terre », expression désignant une provenance très lointaine.'
    reason: lexical_alternative
  - marker: b
    text: « Les autres » peut désigner les autres rois ou peuples, qui continuent à verser un tribut annuel aux Romains.
    reason: referent_ambiguity
lexical_decisions:
- source_word: κατεκράτησαν
  choice: prirent le contrôle de
  rationale: Le verbe exprime une domination effective obtenue par la force. Cette formulation est naturelle en français et convient au contexte politique et militaire.
- source_word: τοῦ τόπου παντός
  choice: de toute la région
  rationale: τόπος désigne ici un espace géopolitique plutôt qu’un simple lieu ; « région » rend ce sens sans suggérer abusivement toutes les terres.
- source_word: τῇ βουλῇ αὐτῶν
  choice: par leur stratégie
  rationale: βουλή peut désigner le conseil, le dessein ou la politique réfléchie. « Stratégie » exprime clairement ici l’action concertée et forme un contraste naturel avec « par l’épée ».
- source_word: τῇ ῥομφαίᾳ
  choice: par l’épée
  rationale: La métaphore militaire du grec est conservée dans une expression française claire et traditionnelle.
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: soit très éloignée d’eux
  rationale: La formulation préserve l’intensification de σφόδρα et souligne la distance remarquable séparant Rome de la région dominée.
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: des rois venus les attaquer
  rationale: Le génitif prolonge probablement le domaine sur lequel les Romains exercèrent leur domination. « Venus les attaquer » rend explicitement la portée hostile de ἐπέρχομαι dans ce contexte.
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: depuis l’extrémité de la terre
  rationale: La traduction conserve au singulier l’image grecque d’une provenance extrêmement lointaine, expliquée en note.
- source_word: συνέτριψαν
  choice: écrasèrent
  rationale: Ce verbe énergique traduit la destruction ou la défaite décisive exprimée par le grec.
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: leur infligèrent une lourde défaite
  rationale: L’expression française restitue naturellement l’idiome militaire grec, littéralement lié à un grand coup ou fléau, sans produire une tournure maladroite.
- source_word: οἱ ἐπίλοιποι
  choice: ceux qui restèrent
  rationale: Cette formulation préserve l’imprécision du grec quant à l’identité des personnes restantes, sans les définir nécessairement comme des survivants.
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: leur paient un tribut
  rationale: Malgré la forme textuelle inhabituelle du verbe, le contexte et φόρον indiquent le versement continu d’un tribut aux Romains.
- source_word: κατʼ ἐνιαυτόν
  choice: chaque année
  rationale: Cette expression française courante rend clairement la périodicité annuelle distributive.
