revisions:
- from: Ils prirent le contrôle de toute la région par leur stratégie et par l’épée — bien que cette région soit très éloignée d’eux — ainsi que des rois venus les attaquer depuis l’extrémité de la terre[a]. Ils les écrasèrent et leur infligèrent une lourde défaite ; ceux qui restèrent leur paient un tribut chaque année[b].
  to: Ils exercèrent leur domination sur toute la région grâce à leur politique et à l’épée — alors même qu’elle était très éloignée d’eux — ainsi que sur les rois qui étaient venus les attaquer depuis l’extrémité de la terre[a], jusqu’à ce qu’ils les écrasent et leur portent un coup terrible ; les autres leur versent un tribut année après année[b].
  rationale: La révision rétablit la portée de ἕως (« jusqu’à ce que »), conserve le parallélisme entre la région et les rois soumis, et remplace une formulation qui pouvait présenter les payeurs de tribut comme des survivants par une expression volontairement non spécifiée. Les notes sont conservées, avec adaptation de la seconde au texte révisé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:50:52Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la domination romaine, l’éloignement, l’opposition des rois, l’écrasement et le tribut annuel. Toutefois, la rupture en deux phrases efface « jusqu’à ce que » (ἕως), qui relie explicitement la domination des rois à leur défaite. « Ceux qui restèrent » est plus restrictif que οἱ ἐπίλοιποι, qui peut simplement signifier « les autres » ou « ceux qui restent ».
  naturalness: Le français est globalement clair et de registre approprié. Une seule phrase structurée avec « ainsi que sur les rois » rend plus naturellement le parallélisme syntaxique grec et évite l’enchaînement un peu heurté « ainsi que des rois ... Ils les écrasèrent ».
  terminology: « Par leur stratégie » est possible, mais « grâce à leur politique » conserve mieux l’ampleur délibérative et politique de βουλή. « À l’épée », « tribut » et « année après année » sont naturels et fidèles. « Les autres » préserve l’ambiguïté du référent sans imposer l’idée de survivants.
  issues:
  - severity: medium
    issue: La relation introduite par ἕως n’est pas rendue.
    rationale: Le grec dit que leur domination sur les rois ennemis dura ou s’exerça jusqu’à ce qu’ils les écrasent et leur portent un grand coup. La segmentation actuelle en fait une simple nouvelle assertion.
  - severity: medium
    issue: « Ceux qui restèrent » restreint indûment οἱ ἐπίλοιποι.
    rationale: Cette formule suggère des survivants après la défaite, tandis que le grec peut désigner plus largement les autres rois ou peuples restants. « Les autres » maintient l’ambiguïté.
  - severity: low
    issue: « Stratégie » est plus étroit que βουλή.
    rationale: βουλή comprend le conseil, la décision ou la politique; dans ce contexte de puissance romaine, « politique » rend mieux cette dimension sans exclure l’action militaire.
