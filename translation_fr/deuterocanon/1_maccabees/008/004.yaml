translation_notes:
  register: Français international moderne, digne et accessible. La longue construction grecque a été répartie en deux phrases pour plus de clarté, tout en conservant le lien entre la domination de la région et celle des rois. L’image de l’épée et l’ambiguïté de οἱ ἐπίλοιποι sont préservées.
