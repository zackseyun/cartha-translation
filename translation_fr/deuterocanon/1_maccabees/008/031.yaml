  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: fr
  text: 'Quant aux torts que le roi Démétrios leur cause[a], nous lui avons écrit : « Pourquoi as-tu alourdi ton joug sur nos amis et alliés, les Juifs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quant aux maux que le roi Démétrios leur fait subir » ; ou : « Quant aux dommages que le roi Démétrios leur inflige ». L’expression grecque peut désigner des actes nuisibles ou des mesures oppressives, et pas seulement le mal moral dans l’abstrait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: Quant aux torts
  rationale: Dans ce contexte, κακά désigne des actes nuisibles ou des mauvais traitements concrets plutôt que le mal moral dans l’abstrait. « Torts » conserve cette portée sans préciser indûment la nature des mesures.
- source_word: συντελεῖται εἰς αὐτούς
  choice: leur fait subir
  rationale: Cette tournure française exprime naturellement les actes hostiles accomplis à leur encontre et s’accorde avec « les torts ».
- source_word: ἐγράψαμεν αὐτῷ
  choice: nous lui avons écrit
  rationale: Le passé composé convient au récit en français moderne et rend simplement l’aoriste grec.
- source_word: Διὰ τί ἐβάρυνας τὸν ζυγόν σου ἐπὶ
  choice: Pourquoi as-tu fait peser lourdement ton joug sur
  rationale: La formulation maintient l’image explicite du joug et la notion de poids portée par ἐβάρυνας, tout en restant idiomatique en français.
- source_word: τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: nos amis et alliés, les Juifs
  rationale: 'Cette formulation préserve l’ordre et la valeur appositive du grec : les Juifs sont identifiés comme les amis et alliés des Romains.'
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’image politique du « joug » est conservée, ainsi que l’ambiguïté relative de κακά quant à la nature précise des mauvais traitements.
