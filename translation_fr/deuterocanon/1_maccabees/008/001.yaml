  verdict: revise
  source_fidelity: 'La première partie rend correctement le sens de ἤκουσεν … τὸ ὄνομα (« entendit parler de la renommée »), et les notes préservent utilement le littéral « nom ». « Très puissants » restitue bien l’intensité de δυνατοὶ ἐν ἰσχύϊ. En revanche, le dernier membre inverse le sujet grammatical : ἐσπῶντο a pour sujet « tous ceux qui venaient à eux », lesquels obtenaient ou gagnaient l’amitié des Romains; ce ne sont pas les Romains qui l’accordaient explicitement.'
  naturalness: Le français est globalement clair, narratif et moderne. « Se montraient favorables à » est légèrement plus direct et idiomatique que « accueillaient favorablement », sans changer la nuance relationnelle. « Gagnaient leur amitié » rend naturellement le dernier verbe tout en conservant l’ambiguïté diplomatique de φιλία.
  terminology: « Renommée », « puissants », « se joignaient à eux » et « amitié » conviennent. La note b explique justement que « amitié » peut avoir une portée diplomatique ou d’alliance, sans imposer cette interprétation dans le texte.
  issues:
