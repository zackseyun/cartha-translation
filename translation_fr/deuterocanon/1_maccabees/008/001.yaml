    issue: Inversion du sujet dans le dernier membre
    rationale: Le grec ὅσοι ἐὰν προσέλθωσιν αὐτοῖς, ἐσπῶντο αὐτοῖς φιλίαν signifie que ceux qui venaient aux Romains obtenaient/gagnaient leur amitié. « Accordaient leur amitié » fait des Romains le sujet et modifie la syntaxe ainsi que la perspective de l’énoncé.
