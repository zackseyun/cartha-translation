  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
translation:
  language: fr
  text: 'Judas entendit parler de la renommée des Romains[a] : ils étaient très puissants, se montraient favorables à tous ceux qui se joignaient à eux, et tous ceux qui venaient à eux gagnaient leur amitié[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nom des Romains » ; ici, leur renommée ou ce qui se disait à leur sujet.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « amitié » peut désigner des relations politiques officielles, voire une alliance, et non seulement une affection personnelle.
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν … τὸ ὄνομα τῶν Ῥωμαίων
  choice: entendit parler de la renommée des Romains
  rationale: La tournure française naturelle « entendre parler de » rend la réception d'un rapport, tandis que « renommée » exprime ici le sens étendu de ὄνομα sans masquer le sens littéral, signalé en note.
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: très puissants
  rationale: Le grec est intensif et quelque peu redondant. « Très puissants » en restitue l'emphase dans un français courant et digne.
- source_word: εὐδοκοῦσιν ἐν πᾶσιν τοῖς προστεθειμένοις αὐτοῖς
  choice: accueillaient favorablement tous ceux qui se joignaient à eux
  rationale: Dans ce contexte relationnel et politique, εὐδοκοῦσιν indique une attitude favorable; « se joignaient à eux » rend le participe sans imposer d'emblée l'idée technique d'une alliance.
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: tous ceux qui venaient à eux
  rationale: Cette formulation conserve le caractère général et l'image d'un mouvement vers les Romains.
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: accordaient leur amitié
  rationale: Le verbe rare est compris contextuellement comme l'établissement ou l'octroi de relations amicales. La formulation française est naturelle et laisse à φιλία sa portée à la fois relationnelle et diplomatique.
