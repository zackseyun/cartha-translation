  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
translation:
  language: fr
  text: 'Ils se rendirent à Rome — le voyage était extrêmement long[a] — et entrèrent dans la salle du conseil[b] et répondirent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la route était extrêmement longue ». Le grec parle littéralement du « chemin » ou de la « route », mais, dans ce contexte, il évoque la longueur du voyage.
    reason: lexical_alternative
  - marker: b
    text: Ou « la salle du Sénat ». Le grec désigne le lieu où se réunissait le conseil ; « salle du conseil » est une traduction moins interprétative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: se rendirent
  rationale: Ce verbe de déplacement indique simplement qu’ils allèrent à destination; « se rendirent » convient naturellement à un voyage vers une ville.
- source_word: εἰς Ῥώμην
  choice: à Rome
  rationale: Avec un nom de ville, εἰς exprime ici la destination; « à Rome » est la tournure française idiomatique.
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: le voyage fut extrêmement long
  rationale: ὁδός signifie littéralement « chemin, route », mais désigne en contexte le trajet; πολλὴ σφόδρα en souligne fortement la longueur.
- source_word: εἰσῆλθον
  choice: entrèrent
  rationale: Rendu direct et concis de l’aoriste de εἰσέρχομαι.
- source_word: τὸ βουλευτήριον
  choice: la salle du conseil
  rationale: Le terme désigne le bâtiment ou la salle où siège un conseil. Cette traduction reste transparente sans préciser davantage que le grec l’institution romaine concernée.
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: Le sens ordinaire est « répondre ». Les deux-points indiquent que le contenu de leur réponse suit, sans remplacer le verbe par une formulation plus interprétative.
