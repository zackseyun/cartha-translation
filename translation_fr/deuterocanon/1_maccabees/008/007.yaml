  text: and they took him alive[a], and imposed on them that both he and those reigning after him should pay a great tribute, and give hostages and a cession of territory[b],
translation:
  language: fr
  text: Ils le capturèrent vivant[a] et imposèrent à lui-même ainsi qu’à ceux qui régneraient après lui de payer un lourd tribut, de livrer des otages et d’accorder une cession de territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils le prirent vivant ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec διαστολήν est difficile. Il peut désigner une division ou une délimitation territoriale, ou, dans ce contexte, une concession de territoire imposée par l’accord.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: Ils le capturèrent vivant
  rationale: Le verbe λαμβάνω désigne ici la capture, et ζῶντα précise qu’il fut pris en vie. « Capturèrent vivant » est naturel et exact en français.
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: leur imposèrent ... de payer / de livrer / de céder
  rationale: La construction exprime l’établissement contraignant d’une obligation. « Imposer de » restitue clairement sa portée politique et juridique.
- source_word: αὐτόν τε καὶ τοὺς βασιλεύοντας μετʼ αὐτόν
  choice: à lui comme à ceux qui régneraient après lui
  rationale: La tournure rend la coordination τε καὶ et conserve l’idée de succession royale sans substituer un terme plus interprétatif comme « dynastie ».
- source_word: φόρον μέγαν
  choice: un lourd tribut
  rationale: Dans ce contexte de soumission politique, φόρος est un tribut plutôt qu’un impôt ordinaire. « Lourd » exprime idiomatiquement l’importance de μέγαν.
- source_word: ὅμηρα
  choice: des otages
  rationale: Le terme désigne des personnes remises en garantie dans le cadre d’un accord politique.
- source_word: διαστολήν
  choice: céder un territoire
  rationale: Le substantif est difficile dans ce contexte et semble désigner une division, une délimitation ou une concession territoriale imposée. Cette formulation française exprime le sens politique probable tout en signalant l’incertitude en note.
