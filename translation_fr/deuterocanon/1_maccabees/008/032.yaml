base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/032.yaml
  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: fr
  text: Si donc ils portent encore plainte contre toi, nous exécuterons le jugement contre eux, et nous te ferons la guerre sur mer et sur terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « nous te ferons la guerre sur mer et sur terre ». D’après le contexte, le sens attendu pourrait être : « nous combattrons pour toi » ou « nous leur ferons la guerre » ; la formulation transmise présente donc une difficulté textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: Si donc… encore
  rationale: Rend distinctement la condition (ἐὰν), la liaison logique (οὖν) et la continuation ou répétition (ἔτι), dans un français naturel.
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: ils portent… plainte contre toi
  rationale: Dans ce cadre diplomatique, le verbe désigne vraisemblablement une démarche hostile ou une plainte adressée à une autorité, plutôt qu’une attaque physique.
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: nous exécuterons le jugement contre eux
  rationale: Conserve la valeur judiciaire de κρίσις et l’idée de mettre une décision à exécution contre les plaignants.
- source_word: πολεμήσομέν σε
  choice: nous te ferons la guerre
  rationale: Traduit formellement le grec transmis, où σε est bien le complément à la deuxième personne, malgré la difficulté contextuelle.
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: sur mer et sur terre
  rationale: Expression française idiomatique qui rend les deux théâtres d’opérations militaires.
theological_decisions:
- issue: Le complément inattendu de πολεμήσομεν dans la dernière proposition
  choice: Conserver « nous te ferons la guerre » dans le texte principal.
  alternative: « nous combattrons pour toi » ou « nous leur ferons la guerre »
  rationale: Le texte grec attesté porte σε, « toi », et non αὐτούς, « eux ». Le contexte semble pourtant annoncer une intervention en faveur du destinataire. La traduction maintient donc la difficulté textuelle sans corriger silencieusement la source et signale les interprétations contextuelles en note.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement conforme au singulier grec. La tournure judiciaire « porter plainte » est courante; la dernière proposition reste volontairement formelle afin de préserver l’ambiguïté du texte transmis.
