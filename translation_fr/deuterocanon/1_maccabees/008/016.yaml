translation_notes:
  register: Français international moderne, clair et digne. « Confient… le soin de » rend idiomatiquement la délégation d’autorité ; « territoire » précise le sens politique de γῆ. La répétition « cet homme » évite le tour peu naturel « l’unique » tout en maintenant le référent masculin singulier.
