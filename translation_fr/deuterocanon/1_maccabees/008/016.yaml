base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: fr
  text: Ils confient chaque année à un seul homme le soin de les gouverner et d’exercer son autorité sur tout leur territoire ; tous écoutent cet homme[a], et il n’y a parmi eux ni envie ni jalousie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous obéissent à cet homme ». Littéralement, le grec dit : « tous écoutent l’unique homme », expression qui peut impliquer l’obéissance dans ce contexte politique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύουσιν
  choice: confient… le soin de
  rationale: Avec les infinitifs ἄρχειν et κυριεύειν, le verbe exprime ici la remise d’une autorité à quelqu’un, plutôt qu’une simple croyance ou confiance intérieure.
- source_word: ἑνὶ ἀνθρώπῳ
  choice: à un seul homme
  rationale: Le grec est explicitement au masculin singulier et insiste sur l’unicité du gouvernant.
- source_word: ἄρχειν αὐτῶν
  choice: les gouverner
  rationale: Cette formulation française naturelle conserve le sens politique d’exercice du gouvernement.
- source_word: κατ' ἐνιαυτόν
  choice: chaque année
  rationale: La locution indique une charge annuelle ou renouvelée année après année.
- source_word: κυριεύειν
  choice: exercer son autorité sur
  rationale: Le verbe marque une autorité effective et forte. Cette expression reste digne et naturelle sans recourir à « exercer sa seigneurie », peu idiomatique ici.
- source_word: πάσης τῆς γῆς αὐτῶν
  choice: tout leur territoire
  rationale: Dans ce contexte politique, γῆ désigne vraisemblablement le pays ou territoire soumis à l’autorité romaine.
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: tous écoutent cet homme
  rationale: Le rendu conserve l’image littérale du grec, tandis que le contexte gouvernemental laisse entendre l’obéissance sans l’imposer dans le texte.
- source_word: φθόνος
  choice: envie
  rationale: Équivalent courant de l’envie malveillante désignée par φθόνος.
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans cette coordination négative avec φθόνος, ζῆλος évoque la jalousie ou la rivalité, et non un zèle positif.
