base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/006.yaml
  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: fr
  text: et Antiochos, le grand roi d’Asie, qui marcha contre eux pour leur faire la guerre avec cent vingt éléphants, de la cavalerie[a], des chars et une armée extrêmement nombreuse, fut écrasé par eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « cheval » au singulier, mais, dans cet inventaire militaire, le terme désigne collectivement la cavalerie ou les troupes montées.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχον
  choice: Antiochos
  rationale: Forme française traditionnelle du nom grec, directement reconnaissable.
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: le grand roi d’Asie
  rationale: Conserve l’apposition et rend directement μέγαν par « grand », sans transformer le titre.
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: qui marcha contre eux pour leur faire la guerre
  rationale: Exprime le déplacement militaire de πορεύομαι, l’hostilité de ἐπ’ αὐτούς et la finalité guerrière de εἰς πόλεμον dans un français naturel.
- source_word: ἔχοντα
  choice: avec
  rationale: Introduit naturellement l’inventaire militaire tout en maintenant son rattachement à Antiochos.
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: cent vingt éléphants
  rationale: Rendu numérique direct et idiomatique en français moderne.
- source_word: ἵππον
  choice: de la cavalerie
  rationale: Le singulier grec « cheval » a ici une valeur collective dans une liste de moyens militaires ; « cavalerie » communique clairement cette catégorie de troupes.
- source_word: ἅρματα
  choice: des chars
  rationale: Équivalent militaire direct et usuel.
- source_word: δύναμιν πολλὴν σφόδρα
  choice: une armée extrêmement nombreuse
  rationale: Dans ce contexte, δύναμις désigne une force armée ; cette formulation rend nettement l’intensification πολλὴν σφόδρα en français courant.
- source_word: συνετρίβη
  choice: fut écrasé
  rationale: Préserve la force du passif de συντρίβω, plus énergique qu’un simple « fut vaincu ».
- source_word: ἀπʼ αὐτῶν
  choice: par eux
  rationale: Rend directement l’agent de la défaite sans préciser davantage l’antécédent que ne le fait le grec.
