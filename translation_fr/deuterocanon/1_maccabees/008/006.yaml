translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale « et » est conservée parce que le verset poursuit la phrase et l’énumération du contexte précédent. La construction reste proche de la syntaxe grecque tout en évitant une accumulation peu naturelle de participes.
