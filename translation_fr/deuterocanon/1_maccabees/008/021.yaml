lexical_decisions:
- source_word: ἤρεσεν
  choice: plut
  rationale: L’aoriste de ἀρέσκω indique ici que la proposition reçut leur approbation. « Plut » est naturel, concis et fidèle au sens.
- source_word: ὁ λόγος
  choice: cette proposition
  rationale: Dans ce contexte diplomatique, λόγος désigne le contenu qui vient d’être présenté plutôt qu’un simple mot. Le démonstratif « cette » renvoie naturellement à ce qui précède.
- source_word: ἐνώπιον αὐτῶν
  choice: leur
  rationale: Littéralement « devant eux », l’expression marque ici leur jugement favorable. Avec « plaire », le pronom indirect « leur » en rend idiomatiquement le sens en français.
