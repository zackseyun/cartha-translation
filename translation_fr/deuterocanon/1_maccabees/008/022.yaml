base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: fr
  text: Et voici la copie du document qu’ils ont reproduit sur des tablettes de bronze et envoyé à Jérusalem, afin qu’elle y demeure auprès d’eux comme mémorial de paix et d’alliance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: copie
  rationale: Le terme désigne la reproduction d’un écrit; « copie » est naturel et précis dans ce contexte administratif.
- source_word: γραφῆς
  choice: document
  rationale: Ici, γραφή désigne un écrit officiel, et non l’Écriture sainte; « document » convient au contexte diplomatique.
- source_word: ἀντέγραψαν
  choice: ont reproduit
  rationale: Le verbe exprime l’établissement d’une copie. « Reproduit » évite une répétition française pesante tout en conservant le sens.
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: sur des tablettes de bronze
  rationale: δέλτοι désigne des tablettes servant de support écrit, et χαλκαῖς en précise le matériau.
- source_word: μνημόσυνον
  choice: mémorial
  rationale: Le nom désigne ce qui conserve le souvenir; « mémorial » maintient le caractère officiel et commémoratif de la copie déposée.
- source_word: εἰρήνης
  choice: paix
  rationale: Le grec porte simplement « paix »; il n’est pas nécessaire d’expliciter « traité de paix ».
- source_word: συμμαχίας
  choice: alliance
  rationale: Le terme désigne une alliance, notamment politique ou militaire, sans que sa portée exacte doive être précisée ici.
- source_word: παρ’ αὐτοῖς
  choice: auprès d’eux
  rationale: La locution indique que le document doit rester en leur possession ou dans leur communauté; « auprès d’eux » conserve cette nuance relationnelle.
