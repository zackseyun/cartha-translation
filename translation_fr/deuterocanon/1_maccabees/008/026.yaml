base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: fr
  text: À ceux qui leur font la guerre, ils ne donneront ni ne fourniront de blé, d’armes, d’argent ni de navires, conformément à la décision de Rome. Ils respecteront leurs obligations[a] sans rien recevoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils observeront leurs clauses » ou « ils respecteront les dispositions de leur traité ». Le grec emploie un verbe et un nom de même racine, littéralement « ils garderont les choses à garder », dans le contexte d’un traité.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: à ceux qui leur font la guerre
  rationale: Le participe substantivé désigne les parties hostiles; « leur » explicite, d’après le contexte du traité, ceux contre qui la guerre est menée.
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: ils ne donneront ni ne fourniront
  rationale: La paire de futurs distingue le don direct de l’approvisionnement ou de l’aide matérielle.
- source_word: σῖτον
  choice: blé
  rationale: Dans cette liste de ressources, σῖτος désigne les céréales destinées aux provisions; « blé » est naturel en français, sans élargir au sens général de nourriture.
- source_word: ὅπλα
  choice: armes
  rationale: Terme militaire direct et courant pour l’équipement offensif ou défensif.
- source_word: ἀργύριον
  choice: argent
  rationale: Le français « argent » conserve heureusement à la fois le sens littéral du métal et son emploi monétaire possible.
- source_word: πλοῖα
  choice: navires
  rationale: « Navires » convient au contexte militaire et diplomatique mieux que le terme plus général « bateaux ».
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: conformément à la décision de Rome
  rationale: L’expression idiomatique avec ἔδοξεν et le datif renvoie ici à une décision officielle; cette formulation française en restitue la portée juridique.
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: ils respecteront leurs obligations
  rationale: L’expression apparentée verbe-nom signifie littéralement qu’ils garderont ce qui doit être gardé; dans ce traité, elle vise vraisemblablement les obligations ou clauses convenues.
- source_word: οὐθὲν λαβόντες
  choice: sans rien recevoir
  rationale: Le participe exprime que le respect de ces obligations se fera sans recevoir quoi que ce soit, sans préciser une contrepartie que le grec laisse implicite.
