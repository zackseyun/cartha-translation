base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/027.yaml
  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: fr
  text: De même, si la guerre atteint d’abord la nation des Juifs, les Romains combattront à leurs côtés de tout cœur[a], selon ce que les circonstances leur dicteront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un engagement total ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « selon ce que la situation leur indiquera » ou « selon ce que le moment leur prescrira ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: De même
  rationale: Transition naturelle qui renvoie à la réciprocité des clauses précédentes et conserve la valeur comparative du grec.
- source_word: ἔθνει Ἰουδαίων
  choice: la nation des Juifs
  rationale: ἔθνος désigne ici un peuple constitué; cette formulation reste proche de la construction grecque sans ajouter de nuance politique moderne.
- source_word: συμβῇ προτέρῳ πόλεμος
  choice: si la guerre atteint d’abord
  rationale: La tournure conserve l'éventualité exprimée par ἐὰν avec le subjonctif et comprend προτέρῳ comme une priorité temporelle.
- source_word: συμμαχήσουσιν
  choice: combattront à leurs côtés
  rationale: Le verbe exprime une assistance militaire en qualité d’alliés; la formulation française rend ce sens concrètement et naturellement.
- source_word: ἐκ ψυχῆς
  choice: de tout cœur
  rationale: Expression française courante et digne qui traduit l’idée d’un engagement entier et sincère.
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: selon ce que les circonstances leur dicteront
  rationale: καιρός renvoie ici aux circonstances ou à la conjoncture, tandis que ὑπογράφῃ évoque ce qu’elles indiquent ou prescrivent; la formulation maintient la latitude prévue par le traité.
