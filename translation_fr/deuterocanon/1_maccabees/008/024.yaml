  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνστῇ πόλεμος
  choice: une guerre éclate contre
  rationale: Le verbe ἐνίστημι exprime ici la survenue d’une guerre qui menace ou frappe une partie; « éclate contre » rend naturellement cette idée en français.
- source_word: Ῥώμῃ προτέρα
  choice: d’abord contre Rome
  rationale: Le datif désigne la partie touchée par la guerre, et προτέρα indique que Rome est atteinte en premier dans la situation envisagée.
- source_word: πᾶσι τοῖς συμμάχοις αὐτῶν
  choice: l’un quelconque de ses alliés
  rationale: Dans la formulation distributive d’une clause de traité, πᾶσι vise tout allié susceptible d’être attaqué; cette tournure française évite de suggérer que tous les alliés doivent être attaqués simultanément.
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: en quelque lieu que ce soit sous leur domination
  rationale: κυρία désigne ici la sphère d’autorité ou de domination; la formulation conserve l’étendue générale exprimée par πᾶσα sans la réduire au seul territoire romain.
