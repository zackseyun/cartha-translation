lexical_decisions:
- source_word: χώρα
  choice: pays
  rationale: Le terme désigne ici un territoire géographique. « Pays » est naturel en français, sans imposer nécessairement l’idée d’un État-nation moderne.
- source_word: Σπανίας
  choice: Espagne
  rationale: « Espagne » est la désignation géographique française courante de ce territoire occidental; « Hispanie » serait plus historique, mais moins immédiatement accessible.
- source_word: ἐποίησαν
  choice: avaient fait
  rationale: Le plus-que-parfait rend naturellement en français le regard rétrospectif du récit sur les actions accomplies par les Romains.
- source_word: κατακρατῆσαι
  choice: prendre le contrôle de
  rationale: L’infinitif exprime le but et le verbe composé évoque la maîtrise ou la domination. Cette formulation conserve cette force sans réduire le sens à une prise militaire ponctuelle.
- source_word: μέταλλα
  choice: mines
  rationale: Le mot peut désigner des mines ou des ressources métalliques. Dans cette évocation de la puissance économique acquise en Espagne, « mines » donne un sens concret et naturel.
- source_word: ἀργύριον
  choice: argent
  rationale: Équivalent français usuel du métal précieux dans ce contexte.
- source_word: χρυσίον
  choice: or
  rationale: Équivalent français usuel du métal précieux, naturellement associé à l’argent.
- source_word: τοῦ ἐκεῖ
  choice: qui s’y trouvaient
  rationale: Cette relative française explicite naturellement la localisation exprimée en grec par l’article suivi de l’adverbe « là ».
