  yaml_path: translation/deuterocanon/1_maccabees/008/029.yaml
  text: According to these terms[a], the Romans thus made an agreement with the people of the Jews.
translation:
  language: fr
  text: C’est selon ces clauses que les Romains conclurent un accord avec le peuple des Juifs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le grec Ἰουδαίων peut désigner le peuple juif ou les habitants de la Judée, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: C’est selon ces clauses que
  rationale: Dans ce contexte diplomatique, λόγοι désigne les clauses énoncées plutôt que de simples « paroles »; la tournure met naturellement en relief la conformité de l’accord à celles-ci.
- source_word: οὕτως ἔστησαν
  choice: conclurent un accord
  rationale: Dans cette formule diplomatique elliptique, ἔστησαν exprime la mise en place d’un arrangement. « Conclurent un accord » est idiomatique en français sans préciser indûment qu’il s’agit d’un traité ou d’une alliance.
- source_word: Ῥωμαῖοι
  choice: les Romains
  rationale: Rendu naturel de l’ethnonyme employé comme sujet collectif.
- source_word: τῷ δήμῳ
  choice: avec le peuple
  rationale: Le datif désigne ici la partie avec laquelle l’arrangement est établi; δῆμος renvoie au peuple comme corps collectif.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans ce contexte, le terme vise vraisemblablement le peuple juif dans son ensemble, tout en permettant aussi la nuance géographique « Judéens », signalée en note.
theological_decisions:
- issue: Portée de Ἰουδαίων
  choice: des Juifs
  alternative: des Judéens
  rationale: « Juifs » convient au référent collectif et ethnoreligieux dans ce contexte diplomatique, mais la valeur géographique du grec demeure possible et n’est donc pas effacée.
translation_notes:
  register: Français moderne, digne et accessible, avec une légère coloration juridique adaptée au contexte diplomatique. La dislocation « C’est selon… que » rend la relation entre κατὰ et οὕτως sans produire le lourd « Selon ces clauses, ainsi… ».
