base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
translation:
  language: fr
  text: On ne donnera aux alliés ni grain, ni armes, ni argent, conformément à la décision de Rome[a]. Ils respecteront ces dispositions[b], sans tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « comme Rome l’a jugé bon » ; c’est une formule officielle indiquant ce que Rome a décidé.
    reason: cultural_note
  - marker: b
    text: Ou « ces stipulations » ou « ces obligations ». Le grec désigne littéralement les choses qui doivent être gardées ou observées.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμάχοις
  choice: aux alliés
  rationale: Le datif pluriel désigne les partenaires d’une alliance politique et militaire ; « alliés » est le terme français moderne le plus direct.
- source_word: δοθήσεται
  choice: on ne donnera
  rationale: Le futur passif grec a ici une valeur impersonnelle. La tournure avec « on » restitue naturellement en français l’absence de sujet exprimé sans en introduire un de manière précise.
- source_word: σῖτος
  choice: grain
  rationale: Le mot désigne les céréales ou le grain en général, sans imposer l’idée plus précise de blé.
- source_word: ὅπλα
  choice: armes
  rationale: Dans ce contexte de traité militaire, le terme désigne clairement les armes ou l’armement.
- source_word: ἀργύριον
  choice: argent
  rationale: « Argent » conserve en français la référence littérale au métal tout en pouvant naturellement évoquer les ressources monétaires.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: conformément à la décision de Rome
  rationale: Cette formulation rend le sens institutionnel de l’expression diplomatique grecque dans un français actuel et digne.
- source_word: φυλάξονται
  choice: ils respecteront
  rationale: Dans un cadre juridique, φυλάσσω signifie observer ou respecter des prescriptions ; « respecteront » convient naturellement aux clauses d’un traité.
- source_word: τὰ φυλάγματα ταῦτα
  choice: ces dispositions
  rationale: L’expression, littéralement liée à ce qui doit être gardé ou observé, renvoie ici aux prescriptions contraignantes du traité.
- source_word: οὐ μετὰ δόλου
  choice: sans tromperie
  rationale: La formule exclut toute conduite frauduleuse dans l’observation des dispositions et conserve la portée concise du grec.
