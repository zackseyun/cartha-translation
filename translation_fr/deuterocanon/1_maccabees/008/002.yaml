base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/002.yaml
  text: and that they are mighty in strength[a]. They told him about their wars and the brave deeds they did among the Galatians[b], and that they had subdued them and brought them under tribute.
translation:
  language: fr
  text: et qu’ils sont d’une grande puissance. On lui raconta leurs guerres, les actes de bravoure qu’ils accomplissent parmi les Galates[a], et qu’ils les avaient soumis en leur imposant un tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi les Galates ». L’expression peut désigner les exploits des Romains en rapport avec les Galates ou sur leur territoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  choice: d’une grande puissance
  rationale: Rend l’intensification quelque peu redondante du grec dans un français naturel et digne, tout en gardant l’idée de force militaire.
- source_word: διηγήσαντο αὐτῷ
  choice: On lui raconta
  rationale: Le verbe désigne le fait de relater en détail. Le sujet indéfini pluriel grec se rend naturellement en français par « on » dans ce contexte.
- source_word: τοὺς πολέμους αὐτῶν
  choice: leurs guerres
  rationale: Conserve le sens large de conflits militaires; « batailles » serait trop étroit et « campagnes » plus interprétatif.
- source_word: τὰς ἀνδραγαθίας
  choice: les actes de bravoure
  rationale: Exprime clairement les exploits valeureux sans employer une formulation archaïque ou inutilement genrée.
- source_word: ἃς ποιοῦσιν ἐν τοῖς Γαλάταις
  choice: qu’ils avaient accomplis parmi les Galates
  rationale: Préserve la préposition grecque ἐν, littéralement « parmi », sans transformer explicitement les Galates en adversaires ni identifier le lieu comme la Galatie. Le plus-que-parfait convient au récit rétrospectif français.
- source_word: κατεκράτησαν αὐτῶν
  choice: ils les avaient soumis
  rationale: Rend l’idée de domination acquise dans un contexte militaire et politique.
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: leur avaient imposé un tribut
  rationale: Formulation française idiomatique exprimant leur assujettissement au paiement d’un tribut.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’ambiguïté géographique ou relationnelle de ἐν τοῖς Γαλάταις. Aucun marqueur n’est ajouté pour « actes de bravoure », puisque cette traduction rend directement ἀνδραγαθίας sans nécessiter d’alternative explicative.
