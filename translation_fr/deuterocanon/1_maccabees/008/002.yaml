  verdict: revise
  source_fidelity: La traduction rend avec justesse la force, les guerres, les actes de bravoure, la soumission et le tribut. Toutefois, ἃς ποιοῦσιν est un présent grec (« qu’ils accomplissent »), tandis que « qu’ils avaient accomplis » le transforme en antériorité achevée. Le présent doit être conservé, même si le cadre narratif français pourrait inciter à l’harmoniser au passé.
  naturalness: Le français est clair, moderne et d’un registre narratif approprié. « Parmi les Galates » est un peu littéral mais pleinement recevable ici, d’autant que la note en explique l’ambiguïté. La coordination est légèrement lissée pour une phrase française plus fluide.
  terminology: « D’une grande puissance », « actes de bravoure », « soumis » et « imposé un tribut » conviennent au contexte militaire et politique. « Galates » est le nom historique approprié. La note préserve correctement l’incertitude de ἐν τοῖς Γαλάταις sans décider s’il s’agit d’une relation aux Galates ou d’un lieu.
