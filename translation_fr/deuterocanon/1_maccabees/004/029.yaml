  text: And they came into Idumea and encamped at Beth-zur[a], and Judas met them with ten thousand men.
translation:
  language: fr
  text: Ils entrèrent en Idumée et établirent leur camp à Bethsour. Judas les rencontra avec dix mille hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον εἰς τὴν Ἰδουμαίαν
  choice: Ils entrèrent en Idumée
  rationale: « Entrèrent en » exprime naturellement le déplacement vers l’intérieur de la région; « Idumée » est le nom français usuel de la région hellénistique désignée par Ἰδουμαία.
- source_word: παρεμβάλον
  choice: établirent leur camp
  rationale: Le verbe appartient ici au vocabulaire militaire et signifie installer un camp; cette formulation est claire et actuelle.
- source_word: ἐν Βηθορούς
  choice: à Bethsour[a]
  rationale: Dans ce contexte géographique et narratif, le lieu est généralement identifié à Bethsour. Une note signale toutefois la forme inhabituelle du nom dans le grec fourni et l’autre lecture attestée.
- source_word: συνήντησεν αὐτοῖς
  choice: vint à leur rencontre
  rationale: Le verbe exprime le fait que Judas se porta au-devant de l’armée adverse; cette tournure restitue mieux le mouvement que le simple « les rencontra ».
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: avec dix mille hommes
  rationale: La préposition indique ici la force qui accompagne Judas. « Hommes » traduit directement ἀνδρῶν sans ajouter explicitement « soldats », bien que le contexte soit militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Établirent leur camp » conserve la tonalité militaire sans archaïsme; « vint à leur rencontre » rend explicitement le mouvement de Judas. Le toponyme est présenté sous la forme française courante « Bethsour », avec une note qui préserve l’incertitude liée à la forme grecque.
