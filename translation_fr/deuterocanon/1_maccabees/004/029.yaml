  source_fidelity: 'Le sens général est bien rendu : arrivée en Idumée, établissement du camp, rencontre avec Judas accompagné de dix mille hommes. Toutefois, « vint à leur rencontre » explicite un mouvement que συνήντησεν (« rencontra ») n’exprime pas nécessairement. La forme grecque Βηθορούς, dans ce contexte, renvoie traditionnellement à Bethsour ; elle ne justifie pas l’alternative « Beth-Horôn » proposée dans la note.'
