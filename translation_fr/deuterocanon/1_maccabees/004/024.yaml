base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/024.yaml
  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: fr
  text: 'Après être revenus, ils chantaient des hymnes et adressaient leurs louanges au ciel[a] : « Car il est bon[b] ; sa miséricorde dure à jamais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « au ciel » ou « vers le ciel » : manière respectueuse d’adresser la louange à Dieu.'
    reason: cultural_note
  - marker: b
    text: Ou, plus littéralement, « car c’est bon ». Le grec n’exprime pas le sujet de « bon » ; la traduction retient le sens personnel probable de cette formule liturgique.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: Après être revenus
  rationale: Le participe aoriste marque ici une action antérieure à la louange. « Après être revenus » exprime naturellement cette relation temporelle sans préciser une destination absente du grec.
- source_word: ὕμνουν
  choice: ils chantaient des hymnes
  rationale: Le verbe ὑμνέω désigne le chant d’hymnes ou de louanges chantées. Cette formulation conserve sa nuance musicale et liturgique.
- source_word: ᾐνοῦν
  choice: adressaient leurs louanges
  rationale: Le verbe αἰνέω signifie « louer ». Une formulation distincte de « chantaient des hymnes » préserve le parallélisme des deux verbes grecs.
- source_word: εἰς οὐρανόν
  choice: au ciel
  rationale: La locution signifie littéralement « vers/au ciel » et désigne ici, par révérence, celui auquel s’adresse la louange, sans remplacer explicitement « ciel » par « Dieu ».
- source_word: Ὅτι καλὸν
  choice: Car il est bon
  rationale: Bien que le grec n’exprime pas le sujet et permette formellement une lecture impersonnelle, la formule liturgique et le possessif « sa » dans la proposition suivante favorisent une référence personnelle à Dieu.
- source_word: εἰς τὸν αἰῶνα
  choice: dure à jamais
  rationale: Dans cette formule de louange, l’expression indique la permanence. « Dure à jamais » est idiomatique en français et rend la valeur durative sous-entendue.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sa miséricorde
  rationale: ἔλεος désigne la miséricorde ou la bonté compatissante. « Miséricorde » demeure direct, compréhensible et théologiquement non restrictif.
theological_decisions:
- issue: Sujet implicite de la formule de louange
  choice: '« Car il est bon » : le sujet implicite est compris comme Dieu.'
  alternative: « Car cela est bon » ou, plus littéralement, « Car c’est bon ».
  rationale: Le grec καλόν n’exprime aucun sujet grammatical explicite et conserve donc une certaine ambiguïté. Toutefois, l’écho des formules bibliques de louange et le possessif αὐτοῦ (« sa ») rendent la lecture personnelle la plus probable. Une note signale l’autre possibilité au lieu d’effacer l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux verbes de louange est maintenu, tandis que les notes conservent la métonymie « ciel » et l’ambiguïté grammaticale de καλόν.
