base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/058.yaml
  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: fr
  text: Et il y eut une très grande joie parmi le peuple, et l’opprobre des nations[a] fut écarté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’opprobre venant des nations » ou « l’opprobre des païens ».'
    reason: Le génitif grec ἐθνῶν est conservé dans le texte sous une forme qui ne fixe pas sa relation exacte; la note indique des rendus interprétatifs possibles.
lexical_decisions:
- source_word: ἐγενήθη
  choice: il y eut
  rationale: Cette tournure existentielle rend naturellement en français la formule narrative grecque, sans lui ajouter une nuance événementielle excessive.
- source_word: εὐφροσύνη μεγάλη ... σφόδρα
  choice: une très grande joie
  rationale: εὐφροσύνη désigne ici une joie collective et festive; μεγάλη et σφόδρα en marquent ensemble la forte intensité.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: Avec un nom collectif, ἐν indique ici que la joie se répand au sein du peuple.
- source_word: ἀπεστράφη
  choice: fut écarté
  rationale: Le passif conserve l’absence d’agent exprimé et évoque la suppression ou le détournement de l’opprobre.
- source_word: ὀνειδὸς ἐθνῶν
  choice: l’opprobre infligé par les nations
  rationale: Le génitif peut désigner l’opprobre provenant des nations; «infligé par» exprime clairement cette relation dans le contexte sans remplacer «nations» par un terme confessionnellement marqué.
theological_decisions:
- issue: Référents du «peuple» et des «nations»
  choice: Conserver le contraste biblique entre «le peuple» et «les nations»
  alternative: Expliciter «Israël» et «les peuples non juifs»
  rationale: Le contexte permet d’identifier les groupes, mais le texte grec les désigne simplement par ces termes; les conserver évite d’introduire une explicitation absente.
- issue: Sens du génitif ἐθνῶν
  choice: L’opprobre infligé par les nations
  alternative: L’opprobre des nations, formulation plus littérale mais ambiguë
  rationale: Dans le contexte de la restauration du sanctuaire, il s’agit vraisemblablement de l’opprobre que les nations faisaient peser sur le peuple; une note signale cependant la formulation plus formelle.
translation_notes:
  register: Français international moderne, digne et narratif. «Opprobre» conserve la gravité publique et relationnelle de ὀνειδός; la note en facilite l’interprétation sans surcharger le verset.
