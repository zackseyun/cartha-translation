  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
translation:
  language: fr
  text: 'Judas dit aux hommes qui étaient avec lui : « Ne craignez pas leur grand nombre et ne perdez pas courage devant leur assaut. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Ne craignez pas
  rationale: Rend directement l’impératif négatif de φοβέομαι dans un français naturel et digne.
- source_word: τὸ πλῆθος αὐτῶν
  choice: leur grand nombre
  rationale: πλῆθος souligne ici la supériorité numérique; « grand nombre » est plus courant en français moderne que « multitude ».
- source_word: τὸ ὅρμημα αὐτῶν
  choice: leur assaut
  rationale: Dans ce contexte militaire, ὅρμημα désigne un mouvement offensif impétueux; « assaut » conserve à la fois l’idée d’attaque et celle d’élan.
- source_word: μὴ δειλωθῆτε
  choice: ne perdez pas courage
  rationale: La forme de δειλόω exprime le fait de céder à la peur ou de perdre courage; cette traduction évite de moraliser par « ne soyez pas lâches » et se distingue suffisamment de la première interdiction.
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: aux hommes qui étaient avec lui
  rationale: Traduction explicite et fidèle de la construction grecque; « hommes » convient au groupe militaire masculin désigné.
