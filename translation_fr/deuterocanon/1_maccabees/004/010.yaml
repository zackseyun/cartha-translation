base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: fr
  text: Et maintenant, crions vers le ciel. S’il nous est favorable[a], il se souviendra de l’alliance de nos pères et écrasera aujourd’hui ce camp devant nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’il veut de nous » ou « s’il prend plaisir en nous ». Le grec dit littéralement « s’il nous veut », ce qui exprime ici sa disposition favorable envers son peuple.
    reason: alternative_lexicale
lexical_decisions:
- source_word: βοήσωμεν
  choice: crions
  rationale: Le subjonctif aoriste a ici une valeur exhortative. « Crions » exprime l’appel pressant lancé dans une situation militaire critique.
- source_word: εἰς οὐρανόν
  choice: vers le ciel
  rationale: Cette formulation conserve l’image grecque de l’appel dirigé vers le ciel sans remplacer explicitement « le ciel » par « Dieu ».
- source_word: εἰ θελήσει ἡμᾶς
  choice: s’il nous est favorable
  rationale: Le grec emploie littéralement θέλω avec un objet personnel, tournure marquée qui exprime ici une disposition favorable. La traduction française rend ce sens naturellement tout en signalant en note les formulations plus littérales ou voisines.
- source_word: μνησθήσεται
  choice: il se souviendra
  rationale: « Se souvenir » conserve le langage biblique de l’alliance, où le souvenir divin conduit à l’action.
- source_word: διαθήκης πατέρων
  choice: de l’alliance de nos pères
  rationale: Le génitif associe l’alliance aux ancêtres. L’ajout de « nos », implicite dans le contexte et attesté par le sens, donne une formulation française claire sans trancher explicitement entre alliance faite avec eux ou alliance qui leur appartient.
- source_word: συντρίψει
  choice: écrasera
  rationale: Le verbe évoque une destruction violente et décisive; « écrasera » convient au contexte militaire.
- source_word: τὴν παρεμβολὴν ταύτην
  choice: ce camp
  rationale: παρεμβολή peut désigner un campement ou, par extension, l’armée qui y est rassemblée. « Ce camp » préserve l’image concrète du grec.
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: devant nous
  rationale: Équivalent français naturel de l’expression idiomatique grecque, avec le sens de « sous nos yeux » ou « en notre présence ».
theological_decisions:
- issue: Sujet implicite des verbes au singulier
  choice: Employer « il », avec Dieu comme référent implicite
  alternative: Répéter explicitement « Dieu »
  rationale: L’appel monte « vers le ciel » et les verbes au singulier renvoient naturellement à Dieu. Le pronom rend la phrase claire sans expliciter davantage que le grec.
- issue: Sens de εἰ θελήσει ἡμᾶς
  choice: « s’il nous est favorable »
  alternative: « s’il veut de nous » ou « s’il prend plaisir en nous »
  rationale: La construction grecque conserve une nuance conditionnelle et personnelle inhabituelle. « Nous est favorable » transmet la disposition bienveillante visée sans suggérer une doctrine particulière; la note préserve les autres nuances possibles.
- issue: Relation exprimée par διαθήκης πατέρων
  choice: « l’alliance de nos pères »
  alternative: « l’alliance conclue avec nos pères »
  rationale: La formulation retenue préserve l’ambiguïté du génitif grec au lieu de préciser que l’alliance a été conclue avec les ancêtres.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée après « ciel » pour rendre clairement l’exhortation puis la condition. Le vocabulaire conserve la tonalité biblique de l’alliance sans archaïsmes inutiles.
