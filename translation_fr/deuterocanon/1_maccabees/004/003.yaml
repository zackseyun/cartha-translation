  text: And Judas heard, and he and the mighty men set out to strike the king’s force that was at Emmaus,
translation:
  language: fr
  text: Judas l’apprit. Alors lui et les hommes vaillants partirent pour frapper les forces du roi qui se trouvaient à Emmaüs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans ce récit militaire, ἀκούω signifie naturellement recevoir une nouvelle. « L’apprit » rend le sens sans préciser davantage le contenu implicite.
- source_word: ἀπῆρεν
  choice: partirent
  rationale: Le singulier grec a pour sujet Judas accompagné des hommes vaillants; le français coordonne naturellement les participants au pluriel. « Partirent » exprime le départ en vue de l’action sans préciser l’itinéraire ni la formation militaire.
- source_word: οἱ δυνατοὶ
  choice: les hommes vaillants
  rationale: L’expression désigne littéralement les hommes forts ou puissants, avec ici une connotation guerrière. « Hommes vaillants » est digne, naturel et n’ajoute aucun possessif.
- source_word: πατάξαι
  choice: pour frapper
  rationale: « Frapper » conserve l’image verbale et présente l’action projetée sans anticiper son résultat, contrairement à « vaincre ».
- source_word: τὴν δύναμιν
  choice: les forces
  rationale: Dans le contexte, δύναμις désigne une force militaire. Le pluriel français « les forces » est idiomatique et évite de faire supposer une armée permanente formellement constituée.
- source_word: τοῦ βασιλέως
  choice: du roi
  rationale: Le génitif marque l’appartenance ou le rattachement; « les forces du roi » l’exprime clairement en français.
- source_word: τὴν ἐν Ἐμμαούμ
  choice: qui se trouvaient à Emmaüs
  rationale: L’article suivi de ἐν et du nom de lieu identifie les forces par leur emplacement. Cette formulation n’ajoute pas l’idée plus précise d’un stationnement officiel.
