  yaml_path: translation/deuterocanon/1_maccabees/004/057.yaml
  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
translation:
  language: fr
  text: Ils ornèrent la façade du Temple de couronnes d’or[a] et de petits boucliers. Ils restaurèrent les portes et les salles latérales, et les munirent de portes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de couronnes ornementales d’or » ou « de guirlandes d’or » ; le grec peut désigner des ornements en forme de couronne aussi bien que des couronnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: ornèrent
  rationale: Le verbe désigne l’action d’embellir par des éléments décoratifs; « ornèrent » est naturel et digne en français.
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: le devant du Temple
  rationale: La formule désigne la partie antérieure ou la façade du sanctuaire; « le devant » reste clair sans imposer un terme architectural trop précis.
- source_word: στεφάνοις χρυσοῖς
  choice: couronnes d’or
  rationale: στέφανος peut désigner une couronne ou une guirlande décorative. Le rendu direct « couronnes » conserve cette image, tandis que l’autre possibilité est signalée en note.
- source_word: ἀσπιδίσκαις
  choice: petits boucliers
  rationale: Le diminutif désigne de petits boucliers, probablement employés ici comme ornements; le français est clair et précis.
- source_word: ἐνεκαίνισαν
  choice: rénovèrent
  rationale: Puisque le verbe porte sur les portes et les salles, le contexte favorise une remise à neuf ou une restauration plutôt qu’une nouvelle consécration cultuelle.
- source_word: πύλας
  choice: portes
  rationale: πύλαι désigne les portes ou accès monumentaux. « Portes » convient en français, tandis que les battants matériels sont distingués dans la dernière proposition.
- source_word: παστοφόρια
  choice: salles latérales
  rationale: Le terme désigne des pièces rattachées au complexe du sanctuaire; ce choix évite de leur attribuer une fonction précise que le texte ne donne pas.
- source_word: ἐθύρωσαν
  choice: les munirent de battants
  rationale: Le verbe signifie pourvoir de portes ou de vantaux. Comme πύλας vient d’être rendu par « portes », « battants » évite une répétition ambiguë et exprime l’installation des éléments de fermeture.
- source_word: αὐτά
  choice: les
  rationale: Le pronom neutre pluriel renvoie collectivement aux portes et aux salles latérales.
