  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: fr
  text: Alors Judas ordonna à des hommes de combattre ceux qui se trouvaient dans la citadelle, jusqu’à ce qu’il ait purifié le sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se trouvaient dans l’Acra », la forteresse de Jérusalem.
    reason: Préserve l’identification historique probable de ἄκρα et l’autre manière possible de rendre ce terme.
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: L’aoriste de ἐπιτάσσω exprime un ordre donné avec autorité. « Ordonna » est naturel et digne en français moderne.
- source_word: ἀνδράσιν
  choice: à des hommes
  rationale: Le datif pluriel signifie littéralement « à des hommes ». Le contexte est militaire, mais le grec ne dit pas explicitement « soldats ».
- source_word: πολεμεῖν
  choice: de combattre
  rationale: L’infinitif indique l’action commandée. « Combattre » rend clairement le conflit armé sans alourdir la phrase.
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: ceux qui se trouvaient dans la citadelle
  rationale: ἄκρα désigne une citadelle ou une forteresse et renvoie probablement ici à l’Acra de Jérusalem. La formulation descriptive reste claire dans le texte, tandis que le nom historique est signalé en note.
- source_word: ἕως
  choice: jusqu’à ce que
  rationale: ἕως marque ici le terme temporel ou l’objectif jusqu’auquel le combat devait se poursuivre.
- source_word: καθαρίσῃ
  choice: il ait purifié
  rationale: L’aoriste subjonctif après ἕως présente l’accomplissement de la purification comme le terme visé. Le sujet singulier le plus naturel est Judas.
- source_word: τὰ ἅγια
  choice: le sanctuaire
  rationale: Dans ce contexte relatif au Temple, le pluriel substantivé désigne le lieu saint ou l’espace sacré plutôt que des objets saints en général. « Le sanctuaire » est idiomatique et précis.
theological_decisions:
- issue: Référent de ἄκρα
  choice: « la citadelle » dans le texte, avec « l’Acra » en note
  alternative: « l’Acra » ou « la forteresse »
  rationale: Il s’agit surtout d’une question historico-géographique. Le grec emploie le nom commun ἄκρα avec l’article, mais, dans le contexte des Maccabées, il désigne vraisemblablement la forteresse de Jérusalem appelée l’Acra.
- issue: Sujet de καθαρίσῃ
  choice: 'Judas : « jusqu’à ce qu’il ait purifié »'
  alternative: 'Formulation impersonnelle : « jusqu’à ce que le sanctuaire soit purifié »'
  rationale: Le verbe grec est actif et singulier; son sujet implicite le plus proche et le plus naturel est Judas. La traduction conserve cette syntaxe sans transformer l’actif en passif.
translation_notes:
  register: Français international moderne, clair et digne. La structure de l’ordre et son terme temporel sont conservés sans archaïsme. « À des hommes » maintient la précision du grec sans expliciter « soldats ».
