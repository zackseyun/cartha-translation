  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: fr
  text: Et toutes les nations sauront qu’il existe quelqu’un qui rachète et sauve Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il est celui qui rachète et sauve Israël ». Le grec laisse le sujet implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσονται
  choice: sauront
  rationale: Le futur de γινώσκω annonce la connaissance ou la reconnaissance d’un fait. « Sauront » est naturel en français et conserve la portée prédictive.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette formulation garde la portée universelle, politique et ethnique de l’expression grecque, sans la restreindre explicitement aux non-Juifs.
- source_word: ὅτι ἔστιν
  choice: qu’il existe quelqu’un
  rationale: Le grec emploie ἔστιν sans sujet explicite avant les participes substantivés. La tournure existentielle française préserve cette retenue, tout en produisant une phrase intelligible.
- source_word: ὁ λυτρούμενος
  choice: qui rachète
  rationale: Le participe présent substantivé exprime une action caractéristique. « Rachète » conserve le champ lexical de la rédemption et convient au moyen grec, qui peut ici avoir une valeur active.
- source_word: σώζων
  choice: sauve
  rationale: « Sauve » rend directement σῴζω, s’accorde naturellement avec « rachète » et en conserve la résonance théologique sans surinterprétation.
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Le nom propre se rend directement par « Israël » ; l’article grec n’exige pas l’ajout de « le peuple d’ ».
theological_decisions:
- issue: Sujet implicite des participes substantivés désignant celui qui rachète et sauve Israël
  choice: 'Formulation existentielle : « il existe quelqu’un qui rachète et sauve Israël »'
  alternative: « il est celui qui rachète et sauve Israël »
  rationale: Dans le contexte, le référent est Dieu, mais la proposition grecque ne l’explicite pas grammaticalement. La traduction principale conserve cette ambiguïté et la note signale l’autre analyse possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « il existe quelqu’un » est légèrement plus explicite que le grec, comme l’exige la syntaxe française, mais elle évite de nommer le référent ou de trancher silencieusement l’ambiguïté.
