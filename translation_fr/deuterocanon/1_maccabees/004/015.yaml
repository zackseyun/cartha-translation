base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: fr
  text: Mais tous ceux qui fermaient la marche tombèrent sous l’épée. Ils les poursuivirent jusqu’à Gazara[a], jusqu’aux plaines de la Judée, ainsi que jusqu’à Azôtos et Jamnia[b]. Environ trois mille d’entre eux tombèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara est le nom grec de la ville généralement identifiée à Guézer.
    reason: cross_reference
  - marker: b
    text: Azôtos est la forme grecque d’Ashdod; Jamnia est généralement identifiée à Yabné, aujourd’hui Yavné.
    reason: cross_reference
  - marker: c
    text: 'Ou : « trois mille hommes parmi eux tombèrent »; la tournure grecque indique l’effectif des tués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: tous ceux qui fermaient la marche
  rationale: Le grec désigne littéralement « tous les derniers ». Dans ce contexte militaire, l’expression vise ceux qui se trouvaient à l’arrière de la troupe, sans nécessairement désigner une unité constituée d’arrière-garde.
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: tombèrent sous l’épée
  rationale: Cette tournure française conserve l’image martiale et exprime naturellement une mort violente au combat.
- source_word: ἐδίωξαν
  choice: poursuivirent
  rationale: C’est le sens militaire direct du verbe dans la suite du récit.
- source_word: ἕως Γαζήρων
  choice: jusqu’à Gazara
  rationale: Gazara reflète la forme grecque du toponyme, communément identifié à Guézer.
- source_word: τῶν πεδίων τῆς Ἰουδαίας
  choice: aux plaines de la Judée
  rationale: πεδίον désigne une étendue plane ou ouverte; « plaines » rend clairement cette indication géographique.
- source_word: Ἀζώτου
  choice: Azôtos
  rationale: La forme française translittère directement le toponyme grec Ἄζωτος, plutôt que de lui substituer la forme hébraïque Ashdod.
- source_word: Ἰαννείας
  choice: Jamnia
  rationale: Jamnia est une forme française reconnue du toponyme grec, généralement identifié à Yavné.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: Environ trois mille d’entre eux tombèrent
  rationale: La construction grecque avec εἰς et un nombre exprime ici un effectif approximatif. La formulation française est naturelle tout en conservant la répétition de « tombèrent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation « ceux qui fermaient la marche » évite de transformer implicitement le groupe en unité militaire organisée. Les toponymes suivent prioritairement les formes grecques, avec les identifications modernes en notes.
