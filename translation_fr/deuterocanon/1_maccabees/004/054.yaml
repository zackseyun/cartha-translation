base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: fr
  text: En ce temps-là, le jour même où les nations l’avaient profané, ce jour-là même il fut consacré de nouveau avec des chants et des lyres, des harpes[a] et des cymbales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne un instrument ancien à cordes dont l’identification exacte est incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: À la même époque, le jour même
  rationale: La formulation française restitue le double repère temporel et souligne la correspondance exacte de la date sans conserver la lourdeur de la répétition grecque de κατά.
- source_word: ἐβεβήλωσαν
  choice: avaient profané
  rationale: Dans ce contexte sacré, « profaner » exprime précisément le fait de retirer à un lieu son caractère saint; le plus-que-parfait marque l’antériorité par rapport à la nouvelle inauguration.
- source_word: αὐτό
  choice: l’
  rationale: Le grec emploie un pronom dont le référent est fourni par le contexte précédent. La traduction conserve cette absence de précision plutôt que d’ajouter « sanctuaire » ou « autel ».
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Cette traduction formelle garde le terme grec et désigne ici les peuples non juifs sans recourir à un mot vieilli ou péjoratif.
- source_word: ἐνεκαινίσθη
  choice: il fut inauguré de nouveau
  rationale: Le verbe indique ici la restauration cultuelle suivie d’une nouvelle dédicace. Cette expression est claire en français moderne et préserve l’idée de renouvellement.
- source_word: ἐν ᾠδαῖς
  choice: par des chants
  rationale: Le sens est celui de l’accompagnement festif de la nouvelle inauguration; « chants » ne précise pas indûment qu’il s’agissait d’hymnes.
- source_word: κιθάραις
  choice: lyres
  rationale: La κιθάρα est un instrument à cordes de la famille des lyres; ce terme la distingue du suivant.
- source_word: κινύραις
  choice: harpes
  rationale: « Harpes » est une désignation conventionnelle intelligible, mais l’identification exacte de cet instrument ancien reste incertaine et fait donc l’objet d’une note.
- source_word: κυμβάλοις
  choice: cymbales
  rationale: Équivalent français direct et naturel de l’instrument de percussion grec.
theological_decisions:
- issue: Valeur cultuelle de ἐνεκαινίσθη après la profanation
  choice: il fut inauguré de nouveau
  alternative: il fut consacré de nouveau / il fut renouvelé
  rationale: Le contexte décrit le rétablissement du culte après une profanation. « Inauguré de nouveau » rend la nouvelle dédicace sans suggérer que le rite aurait conféré pour la première fois son caractère sacré ni réduire le verbe à une simple rénovation matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde l’insistance sur le jour correspondant à celui de la profanation. Le pronom grec est conservé sans explicitation contextuelle. Le vocabulaire musical demeure concret, avec une note limitée au seul instrument d’identification incertaine.
