  yaml_path: translation/deuterocanon/1_maccabees/004/032.yaml
  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: fr
  text: Donne-leur la lâcheté, fais fondre l’audace que leur donne leur force, et qu’ils soient ébranlés par leur écrasement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qu’ils soient ébranlés devant leur ruine ». Le dernier terme peut désigner plus généralement la ruine ou la destruction, plutôt que l’écrasement au sens concret.'
    reason: Variante lexicale et nuance possible de la relation exprimée par le datif.
lexical_decisions:
- source_word: δὸς
  choice: Donne
  rationale: L’impératif direct conserve la simplicité et la vigueur de la prière.
- source_word: δειλίαν
  choice: la lâcheté
  rationale: Le nom désigne la couardise ou le manque de courage, et non la peur au sens général.
- source_word: τῆξον
  choice: fais fondre
  rationale: Cette formulation garde l’image vive d’une assurance qui se liquéfie et disparaît.
- source_word: θράσος
  choice: l’audace
  rationale: Le terme peut évoquer aussi bien la hardiesse que l’audace agressive; dans ce contexte militaire hostile, « audace » reste naturel sans ajouter explicitement l’idée d’insolence.
- source_word: ἰσχύος αὐτῶν
  choice: que leur donne leur force
  rationale: Cette tournure française exprime naturellement le rapport génitif entre leur audace et leur force, sans réduire ἰσχύς à une simple capacité abstraite.
- source_word: σαλευθήτωσαν
  choice: qu’ils soient ébranlés
  rationale: Le passif garde l’idée qu’ils sont secoués, déstabilisés ou mis en désarroi.
- source_word: τῇ συντριβῇ αὐτῶν
  choice: par leur écrasement
  rationale: « Écrasement » préserve l’image concrète de brisement portée par συντριβή; le possessif rend αὐτῶν sans imposer une réflexivité plus forte que le grec.
theological_decisions:
- issue: Langage de prière imprécatoire
  choice: Conserver les demandes directes visant la lâcheté, l’effondrement de l’audace et l’ébranlement des ennemis.
  alternative: Atténuer le texte en parlant seulement de leur défaite.
  rationale: Le grec formule sans détour une prière demandant à Dieu d’agir contre des forces hostiles; l’adoucir effacerait sa tension théologique et sa force rhétorique.
- issue: Portée de συντριβή dans la dernière proposition
  choice: Retenir l’image concrète d’« écrasement » dans le texte.
  alternative: Traduire plus généralement par « ruine » ou « destruction ».
  rationale: Le terme permet les deux lectures. Le texte principal conserve l’image forte, tandis que la note signale le sens plus général sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le parallélisme de la prière tout en rendant naturel le rapport entre l’audace et la force.
