  text: While Judas was still saying these things in a low voice[a], a certain part appeared, coming out from the mountain.
translation:
  language: fr
  text: Pendant que Judas prononçait encore ces paroles à voix basse, une partie[a] apparut, sortant de la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « une certaine partie »; il s’agit probablement d’une partie de l’armée ennemie qui devenait visible en sortant de la montagne.
    reason: Le référent de μέρος τι est implicite et ne doit pas être ajouté sans signalement dans le corps du texte.
lexical_decisions:
- source_word: ἔτι ὑποφθεγγομένου Ἰούδου ταῦτα
  choice: Pendant que Judas prononçait encore ces paroles à voix basse
  rationale: La tournure exprime la simultanéité, et ὑποφθέγγομαι indique une élocution à voix basse, sans nécessairement suggérer un murmure de mécontentement.
- source_word: ὤφθη
  choice: apparut
  rationale: 'Le passif grec a ici un sens intransitif naturel : quelque chose devint visible.'
- source_word: μέρος τι
  choice: une partie[a]
  rationale: Rendu proche du grec, qui ne précise pas explicitement de quel ensemble il s’agit; l’ambiguïté est conservée dans le texte et éclairée en note.
- source_word: ἐκκύπτον
  choice: sortant
  rationale: Dans ce contexte narratif et militaire, le participe décrit vraisemblablement ce qui émerge et devient visible.
- source_word: ἐκ τοῦ ὄρους
  choice: de la montagne
  rationale: Rend directement le singulier ὄρος sans le généraliser en région montagneuse.
