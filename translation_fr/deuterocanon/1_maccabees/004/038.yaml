  source_fidelity: La traduction rend fidèlement la série descriptive et les principaux termes cultuels. Toutefois, « sur l’une des montagnes » ne correspond pas à ἐν ἑνὶ τῶν ὀρέων (« dans l’une des montagnes »). La formulation révisée conserve cette localisation, même si l’image reste inhabituelle en français, comme elle l’est dans le grec.
  naturalness: Le français est moderne, clair et conserve efficacement l’accumulation du verset. « Comme dans un fourré ou dans l’une des montagnes » est naturel dans le cadre de cette comparaison de végétation non entretenue.
  terminology: « Sanctuaire », « autel », « profané », « cours » et « chambres du Temple » conviennent au contexte. La note sur les chambres préserve avec justesse l’incertitude architecturale de παστοφόρια.
