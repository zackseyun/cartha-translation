    issue: Préposition de lieu dans la seconde comparaison
    rationale: Le grec porte ἐν (« dans ») avec « l’une des montagnes ». « Sur » modifie le rapport spatial exprimé par le texte source. Il convient de traduire « dans l’une des montagnes ».
