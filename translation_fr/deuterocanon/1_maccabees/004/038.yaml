  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: fr
  text: Ils virent notre sanctuaire dévasté, l’autel profané, les portes entièrement brûlées, des plantes qui avaient poussé dans les cours comme dans un fourré ou dans l’une des montagnes, et les chambres du Temple démolies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne des chambres appartenant au complexe du Temple; leur emplacement et leur fonction exacts sont incertains.
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: sanctuaire
  rationale: Dans ce contexte cultuel, le mot désigne le lieu consacré, c’est-à-dire le sanctuaire, et non la sainteté au sens abstrait.
- source_word: ἠρημωμένον
  choice: dévasté
  rationale: Le participe exprime un état de ruine et d’abandon; « dévasté » est naturel en français moderne et en conserve la force.
- source_word: θυσιαστήριον
  choice: autel
  rationale: Équivalent français usuel du terme cultuel grec.
- source_word: βεβηλωμένον
  choice: profané
  rationale: Le terme indique que ce qui était sacré a subi une violation; « profané » rend directement cette dimension cultuelle.
- source_word: πύλας
  choice: portes
  rationale: Dans l’enceinte du Temple, « portes » constitue le terme architectural courant et respecte le pluriel grec.
- source_word: κατακεκαυμένας
  choice: entièrement brûlées
  rationale: Le préverbe intensif et l’état résultant exprimé par le parfait signalent une destruction accomplie par le feu.
- source_word: αὐλαῖς
  choice: cours
  rationale: Le contexte désigne les cours de l’ensemble du Temple.
- source_word: φυτὰ πεφυκότα
  choice: des plantes qui avaient poussé
  rationale: Cette formulation française rend l’état résultant du parfait sans préciser indûment les espèces végétales.
- source_word: δρυμῷ
  choice: fourré
  rationale: Le mot évoque ici une végétation sauvage et dense; « fourré » convient bien à la comparaison avec les cours envahies.
- source_word: παστοφόρια
  choice: chambres du Temple
  rationale: Le terme désigne des pièces liées au complexe cultuel, mais leur emplacement et leur fonction exacts restent incertains; cette traduction évite de les déterminer davantage.
- source_word: καθῃρημένα
  choice: démolies
  rationale: Le participe décrit des constructions abattues ou mises à bas; « démolies » exprime clairement le résultat.
