translation_notes:
  register: Français international moderne, digne et accessible. La longue coordination cumulative du grec est conservée, tandis que la syntaxe française évite la répétition lourde de « et ». La référence au Temple est explicitée seulement pour situer les chambres, sans leur attribuer une fonction précise.
