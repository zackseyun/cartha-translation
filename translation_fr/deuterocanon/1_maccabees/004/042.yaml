  text: And he chose blameless priests[a], devoted to the law.
translation:
  language: fr
  text: Il choisit des prêtres irréprochables[a], attachés à la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans défaut, et zélés pour la Loi ». Le grec peut évoquer à la fois l’absence de défaut et un engagement empressé.
    reason: Alternative lexicale préservant les nuances possibles de ἀμώμους et θελητάς.
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: choisit
  rationale: L’aoriste de ἐπιλέγω exprime ici une sélection délibérée. « Choisit » est naturel et précis en français moderne.
- source_word: ἱερεῖς
  choice: prêtres
  rationale: Équivalent usuel de ἱερεύς dans le contexte du culte juif et du Temple.
- source_word: ἀμώμους
  choice: irréprochables
  rationale: Le terme peut désigner l’absence de défaut ou de blâme. « Irréprochables » convient à des personnes tout en laissant la note signaler la possible nuance cultuelle d’intégrité physique.
- source_word: θελητὰς
  choice: attachés à
  rationale: θελητής désigne quelqu’un qui veut ou désire. Dans cette construction, « attachés à » rend naturellement l’adhésion volontaire et résolue, sans renforcer indûment le terme en « zélés ».
- source_word: νόμου
  choice: la Loi
  rationale: Malgré l’absence d’article en grec, le contexte renvoie vraisemblablement à la Loi juive reçue. La majuscule permet d’indiquer cette référence reconnue en français.
theological_decisions:
- issue: Faut-il comprendre νόμου au sens général de « loi » ou comme désignant la Loi d’Israël ?
  choice: la Loi
  alternative: la loi
  rationale: Dans 1 Maccabées, νόμος désigne couramment la Loi ancestrale d’Israël. Cette formulation conserve cette spécificité sans ajouter « de Moïse » ou « Torah », absents du texte.
translation_notes:
  register: Français international moderne, simple et digne. Le présent de narration « choisit » restitue naturellement l’aoriste dans le récit. « Attachés à la Loi » évite la tournure peu idiomatique « désireux de la Loi » tout en ne surtraduisant pas nécessairement θελητάς par « zélés ».
