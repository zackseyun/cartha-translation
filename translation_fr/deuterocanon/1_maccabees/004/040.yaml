  text: And they fell facedown on the ground[a], and they sounded the signal trumpets, and they cried out to heaven.
translation:
  language: fr
  text: Ils tombèrent face contre terre, sonnèrent les trompettes de signalisation[a] et crièrent vers le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les trompettes des signaux ». L’expression désigne probablement des trompettes servant à transmettre des signaux ; elle pourrait aussi être comprise comme « les trompettes des étendards ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: tombèrent face contre terre
  rationale: Cette formulation française naturelle conserve l’image concrète de personnes tombant le visage contre le sol, sans réduire le geste à une interprétation abstraite comme « se prosternèrent ».
- source_word: ἐσάλπισαν
  choice: sonnèrent
  rationale: Le verbe désigne l’action de sonner de la trompette. « Sonnèrent » convient naturellement avec le complément instrumental qui suit.
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: des trompettes de signal
  rationale: 'Le génitif est compris comme indiquant la fonction des trompettes : elles servent à transmettre des signaux. La note conserve la formulation littérale et signale l’autre sens possible de σημεῖον/σημαία lié aux étendards.'
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: crièrent vers le ciel
  rationale: « Crièrent » rend l’intensité de ἐβόησαν, tandis que « vers le ciel » conserve la valeur directionnelle de εἰς sans expliciter le destinataire au-delà du texte.
theological_decisions:
- issue: Destinataire implicite du cri vers le ciel
  choice: vers le ciel
  alternative: vers Dieu
  rationale: Le grec nomme le ciel, non Dieu explicitement. La traduction préserve cette formulation et laisse au lecteur l’inférence théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination brève garde le rythme narratif du grec. « Face contre terre » est courant et concret ; « crièrent vers le ciel » préserve l’expression source sans surinterprétation.
