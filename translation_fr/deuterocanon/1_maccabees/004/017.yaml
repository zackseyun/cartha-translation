lexical_decisions:
- source_word: ἐπιθυμήσητε
  choice: convoitez
  rationale: Le verbe exprime un désir fort. « Convoiter » convient naturellement à l’attrait du butin et conserve la force de l’exhortation sans ajouter d’explication.
- source_word: σκύλων
  choice: le butin
  rationale: Le pluriel grec désigne ici les biens pris à l’ennemi. En français moderne, « le butin » est le terme collectif courant, clair et digne.
- source_word: πόλεμος
  choice: le combat
  rationale: Même si πόλεμος peut signifier « guerre », le contexte vise l’affrontement immédiat; « combat » rend mieux cette situation tactique.
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: devant nous
  rationale: L’expression indique ce qui se trouve en face. « Devant nous » préserve cette dimension spatiale et suggère naturellement l’affrontement encore à mener.
- source_word: λαόν
  choice: le peuple
  rationale: Le grec emploie le terme général « peuple ». La traduction le conserve plutôt que de préciser interprétativement « soldats » ou « troupes ».
