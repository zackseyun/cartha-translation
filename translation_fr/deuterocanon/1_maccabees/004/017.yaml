  text: And he said to the people[a], “Do not desire the spoils[b], for the battle is before us,”
translation:
  language: fr
  text: 'Il dit au peuple : « Ne convoitez pas le butin, car le combat est devant nous[a]. »'
  philosophy: optimal-equivalence
