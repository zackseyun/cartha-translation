  verdict: approve
  source_fidelity: Le texte rend fidèlement le grec. « avaient été mis en fuite » exprime bien le parfait de τετρόπωται dans son emploi militaire, sans imposer une défaite totale. « on mettait le camp en feu » conserve l’action en cours de ἐνπυρίζουσιν et ne spécifie pas indûment le sujet. « la fumée visible révélait ce qui s’était passé » correspond à ὁ καπνὸς ὁ θεωρούμενος ἐνεφάνιζε τὸ γεγονός.
  naturalness: Français moderne, fluide et narratif. La coordination et la ponctuation sont naturelles. « Fumée visible » est légèrement plus condensé que « fumée que l’on voyait », mais reste parfaitement idiomatique et convient au registre.
  terminology: « Camp » est le terme militaire courant pour παρεμβολήν. La note présente de façon adéquate les possibilités lexicales de τετρόπωται et situe explicitement l’acception militaire. Aucun terme théologique ou nom propre n’est en jeu.
