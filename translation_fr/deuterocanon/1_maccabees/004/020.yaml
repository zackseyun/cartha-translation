base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/020.yaml
  text: And he saw that they had been routed[a], and that they were setting the camp on fire; for the smoke that was visible made what had happened clear.
translation:
  language: fr
  text: Il vit qu’ils avaient été mis en fuite[a] et qu’on mettait le camp en feu, car la fumée visible révélait ce qui s’était passé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avaient fait demi-tour » ou « avaient été repoussés » ; le verbe grec peut désigner des soldats contraints de battre en retraite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  choice: Il vit
  rationale: L’aoriste de ὁράω exprime ici la perception visuelle directe de la situation.
- source_word: τετρόπωται
  choice: avaient été mis en fuite
  rationale: Le parfait à valeur passive ou moyenne de τρέπω désigne, dans ce contexte militaire, une troupe forcée de battre en retraite; cette formulation conserve mieux l’image grecque que le terme plus interprétatif « avaient été vaincus ».
- source_word: ἐνπυρίζουσιν
  choice: on mettait ... en feu
  rationale: Le présent indique une action en cours; le sujet n’étant pas exprimé en grec, le pronom indéfini « on » évite de l’identifier artificiellement.
- source_word: τὴν παρεμβολήν
  choice: le camp
  rationale: Équivalent français courant et précis de ce terme militaire désignant le campement.
- source_word: ὁ καπνὸς ὁ θεωρούμενος
  choice: la fumée visible
  rationale: Cette tournure naturelle rend le participe passif, qui souligne que la fumée pouvait être observée.
- source_word: ἐνεφάνιζε
  choice: révélait
  rationale: Le verbe signifie rendre manifeste ou évident; « révélait » exprime ici que la fumée donnait à connaître l’issue des événements.
- source_word: τὸ γεγονός
  choice: ce qui s’était passé
  rationale: Le participe parfait substantivé renvoie à l’événement accompli; cette expression est naturelle en français moderne.
