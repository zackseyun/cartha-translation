base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/027.yaml
  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: fr
  text: Mais, quand il apprit tout cela, il fut bouleversé et perdit courage[a], car ce qui était arrivé à Israël n’était pas ce qu’il voulait, et ce que le roi lui avait ordonné ne s’était pas réalisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut plongé dans la confusion et se découragea ».'
    reason: Alternative lexicale qui fait ressortir plus explicitement la confusion exprimée par συνεχύθη et l’abattement exprimé par ἤθυμει.
lexical_decisions:
- source_word: συνεχύθη
  choice: il fut bouleversé
  rationale: Le passif exprime le fait d’être jeté dans la confusion ou profondément troublé. « Fut bouleversé » rend naturellement cette forte perturbation intérieure sans en préciser excessivement la nature.
- source_word: ἤθυμει
  choice: perdit courage
  rationale: Le verbe décrit le découragement ou l’abattement. « Perdit courage » est une formulation française courante et digne; l’imparfait grec présente cet abattement comme l’état dans lequel il se trouvait.
- source_word: οὐχ οἷα ἤθελεν
  choice: n’était pas ce qu’il voulait
  rationale: Cette formulation conserve le contraste entre le désir ou l’attente du personnage et le résultat effectif, sans transformer son souhait en plan explicitement formulé.
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: ce qui était arrivé à Israël
  rationale: Le parfait de γίνομαι désigne ici des événements accomplis dont le résultat demeure. Cette traduction est naturelle en français et conserve Israël comme groupe touché par ces événements.
- source_word: οὐχ οἷα ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  choice: ce que le roi lui avait ordonné
  rationale: ἐντέλλομαι exprime un ordre revêtu d’autorité; « ordonné » convient donc au commandement royal.
- source_word: ἐξέβη
  choice: ne s’était pas réalisé
  rationale: Dans ce contexte, le verbe porte sur l’issue des événements. « Ne s’était pas réalisé » indique que le résultat prescrit par le roi n’avait pas été obtenu, sans ajouter explicitement la notion d’échec personnel.
