  yaml_path: translation/deuterocanon/1_maccabees/004/046.yaml
  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: fr
  text: Ils déposèrent les pierres sur la montagne du Temple, dans un endroit approprié, jusqu’à ce qu’un prophète vienne donner une réponse à leur sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la montagne de la Maison », c’est-à-dire sur le mont du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  choice: déposèrent
  rationale: Le moyen exprime ici la mise à l’écart des pierres en vue d’une décision ultérieure. « Déposèrent » est naturel et conserve l’idée de les placer en réserve.
- source_word: τοὺς λίθους
  choice: les pierres
  rationale: Le grec renvoie aux pierres mentionnées dans le contexte immédiat sans préciser ici qu’elles viennent de l’autel.
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: sur la montagne du Temple
  rationale: Littéralement « sur la montagne de la Maison ». « La montagne du Temple » rend clairement l’emplacement tout en conservant l’image géographique du grec.
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: dans un endroit approprié
  rationale: ἐπιτήδειος désigne ce qui convient ou est adapté; « approprié » transmet cette appréciation sans ajouter de précision.
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: jusqu’à ce que … vienne
  rationale: La construction marque le terme futur attendu depuis le point de vue du récit.
- source_word: προφήτην
  choice: un prophète
  rationale: Le nom sans article ne désigne pas explicitement un prophète déterminé.
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: donner une réponse à leur sujet
  rationale: Cette formulation conserve le sens littéral de « répondre au sujet d’elles » sans transformer la réponse prophétique en décision juridique formelle.
theological_decisions:
- issue: Nature du rôle prophétique attendu
  choice: Un prophète futur est attendu pour fournir une réponse faisant autorité au sujet des pierres.
  alternative: Le prophète rendrait une décision juridique formelle, ou la formule ne serait qu’une manière conventionnelle d’ajourner la question.
  rationale: Le grec affirme qu’un prophète viendra répondre à leur sujet, mais ne précise ni le mécanisme, ni la portée juridique exacte, ni l’identité de ce prophète.
translation_notes:
  register: Français international moderne, clair et digne. « Temple » porte une majuscule pour rendre « la Maison » dans son sens institutionnel. La note explicite l’expression sémitisante sans alourdir le texte principal.
