base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: fr
  text: Judas, ses frères et toute l’assemblée d’Israël décidèrent que les jours de la dédicace de l’autel seraient célébrés aux dates prévues, année après année, pendant huit jours, à partir du vingt-cinquième jour du mois de Kislev[a], dans l’allégresse et la joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec Χασελεύ transcrit le nom du mois juif généralement appelé « Kislev » en français.
    reason: Précision lexicale sur la forme grecque du nom du mois.
lexical_decisions:
- source_word: ἔστησεν
  choice: décidèrent
  rationale: Avec la proposition en ἵνα qui en précise le contenu, le verbe exprime ici l’établissement collectif d’une observance. « Décidèrent » est naturel en français et évite la nuance excessivement juridique de « décrétèrent ».
- source_word: ἐκκλησία
  choice: assemblée
  rationale: Dans le contexte juif préchrétien, le terme désigne l’ensemble réuni d’Israël. « Assemblée » conserve ce sens collectif sans introduire l’association chrétienne moderne du mot « Église ».
- source_word: ἵνα ἄγωνται
  choice: seraient célébrés
  rationale: La tournure indique que ces jours doivent être observés comme une fête récurrente. « Célébrés » convient au caractère joyeux explicitement indiqué à la fin du verset.
- source_word: ἐγκαινισμοῦ τοῦ θυσιαστηρίου
  choice: de la dédicace de l’autel
  rationale: ἐγκαινισμός désigne ici la dédicace cultuelle de l’autel; cette formulation est précise et idiomatique.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: à la date fixée
  rationale: L’expression renvoie au moment déterminé dans le calendrier. Le singulier collectif français rend naturellement l’échéance annuelle sans suggérer plusieurs saisons distinctes.
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: année après année
  rationale: Cette formule conserve l’insistance de l’idiome grec sur la répétition annuelle.
- source_word: ἡμέρας ὀκτώ
  choice: pendant huit jours
  rationale: La préposition « pendant » exprime clairement et naturellement la durée de l’observance.
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: à partir du vingt-cinquième jour
  rationale: ἀπό marque le point de départ de la célébration de huit jours; « à partir de » en garde explicitement la valeur temporelle.
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: du mois de Kislev
  rationale: « Kislev » est la graphie française moderne usuelle du nom du mois juif que le grec transcrit Χασελεύ.
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: dans l’allégresse et la joie
  rationale: La paire nominale grecque intensifie le caractère festif. La traduction conserve les deux termes plutôt que de les fondre en un seul.
theological_decisions:
- issue: Traduction de ἐκκλησία dans un contexte juif deutérocanonique
  choice: assemblée
  alternative: communauté; congrégation; Église
  rationale: Le mot désigne ici Israël en tant que collectivité réunie, non l’Église chrétienne postérieure. « Assemblée » préserve ce sens sans anachronisme ecclésiologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans être archaïque. Le doublet « allégresse et joie » et la répétition « année après année » préservent l’emphase du grec.
