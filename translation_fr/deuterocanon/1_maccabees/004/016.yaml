  text: Alors Judas et ses troupes cessèrent de les poursuivre et rebroussèrent chemin,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: rebroussèrent chemin
  rationale: Dans ce contexte militaire, le verbe indique un changement de direction. Le singulier grec s’accorde formellement avec Judas, mais le sujet composé inclut aussi les troupes; le français demande donc naturellement le pluriel.
- source_word: ἡ δύναμις
  choice: ses troupes
  rationale: δύναμις désigne ici le corps armé qui accompagne Judas. «Ses troupes» est idiomatique, clair et évite de suggérer une armée institutionnalisée.
- source_word: ἀπὸ τοῦ διώκειν
  choice: cessèrent de poursuivre
  rationale: La construction ἀπό suivie de l’infinitif substantivé marque ici l’interruption ou l’abandon de l’action en cours.
- source_word: ὀπίσθεν αὐτῶν
  choice: les poursuivre
  rationale: Dans une scène de poursuite, ὀπίσθεν αὐτῶν précise que les troupes allaient derrière les fuyards. En français, cette idée est déjà portée naturellement par «poursuivre»; ajouter «derrière eux» serait lourd ou redondant.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. «Alors» assure la continuité du récit; la virgule finale est conservée puisque le verset constitue une proposition qui se poursuit dans le contexte immédiat.
