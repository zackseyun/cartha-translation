  source_fidelity: Le sens des trois gestes de deuil est fidèlement rendu. Toutefois, καί est une simple coordination (« et ») plutôt que l’adverbe temporel « Alors » ; l’omission évite d’ajouter une nuance temporelle. La tournure « se mirent de la cendre » est moins idiomatique et peut être remplacée par « mirent de la cendre », qui rend directement ἐπέθεντο.
