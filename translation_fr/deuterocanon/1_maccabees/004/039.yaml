  text: And they tore their garments[a], and made great lamentation, and put ashes on their heads.
translation:
  language: fr
  text: Ils déchirèrent leurs vêtements[a], se livrèrent à de grandes lamentations et mirent de la cendre sur leur tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements, se lamenter et se mettre de la cendre sur la tête sont, dans les écrits bibliques, des signes traditionnels de douleur et de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξαν
  choice: déchirèrent
  rationale: Le verbe exprime l’action de déchirer; ce choix français moderne rend clairement le geste rituel de deuil.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: leurs vêtements
  rationale: Ἱμάτια désigne de manière générale les habits ou vêtements; «vêtements» convient au registre digne du récit.
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: se livrèrent à de grandes lamentations
  rationale: La construction avec verbe et nom apparentés souligne une manifestation intense de deuil. Cette formulation naturelle conserve le caractère visible et rituel sans ajouter un geste corporel non explicité par le grec.
- source_word: σποδὸν
  choice: de la cendre
  rationale: Le singulier collectif grec désigne la cendre; le partitif est idiomatique en français dans ce contexte.
- source_word: ἐπέθεντο
  choice: se mirent
  rationale: Cette tournure française rend naturellement l’action de placer de la cendre sur soi.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: sur la tête
  rationale: Le grec emploie «tête» au singulier avec un possesseur pluriel; le français conserve naturellement cette valeur distributive.
