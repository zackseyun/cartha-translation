base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: fr
  text: Ils jugèrent bon de le démolir, de peur qu’il ne devienne pour eux un objet de honte, parce que les nations[a] l’avaient souillé. Ils démolirent donc l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs ». Dans ce contexte juif, le grec τὰ ἔθνη peut désigner les peuples autres qu’Israël.
    reason: Alternative lexicale contextuelle.
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: Ils jugèrent bon
  rationale: L’expression grecque dit littéralement qu’une « bonne décision » leur vint. Cette tournure idiomatique rend naturellement en français leur délibération et leur conclusion, sans ajouter l’idée d’un ordre extérieur.
- source_word: καθελεῖν / καθεῖλον
  choice: le démolir / Ils démolirent
  rationale: Le verbe désigne ici le fait d’abattre ou de démonter l’autel. « Démolir » convient à une construction et permet de conserver la répétition du verbe grec.
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: de peur qu’il ne devienne pour eux un objet de honte
  rationale: La formulation conserve la crainte exprimée par μή ποτε et le sens de déshonneur ou d’opprobre porté par ὄνειδος, dans un français actuel et intelligible.
- source_word: ἐμίαναν
  choice: avaient souillé
  rationale: Dans ce contexte cultuel, μιαίνω évoque une contamination rituelle. « Souiller » préserve cette dimension mieux qu’un terme purement moral ou émotionnel.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: C’est le rendu direct du grec et il désigne ici les peuples non juifs. La note signale l’autre traduction française traditionnelle, « les non-Juifs ».
- source_word: τὸ θυσιαστήριον
  choice: l’autel
  rationale: Équivalent français précis et courant du nom grec désignant l’autel sacrificiel.
theological_decisions:
- issue: Langage de souillure cultuelle appliqué à l’autel
  choice: souillé
  alternative: profané
  rationale: « Souillé » maintient l’idée de contamination rituelle présente dans le verbe grec. « Profané » serait possible, mais mettrait davantage l’accent sur l’atteinte au caractère sacré.
- issue: Identification de τὰ ἔθνη
  choice: les nations
  alternative: les non-Juifs
  rationale: Le texte principal conserve le terme collectif du grec sans effacer son sens contextuel. La note indique explicitement que, dans ce contexte juif, il s’agit des peuples non juifs.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « démolir » reproduit celle du grec, tandis que « objet de honte » garde la dimension publique de ὄνειδος sans archaïsme.
