  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: fr
  text: 'Gorgias arriva de nuit au camp de Judas et n’y trouva personne. Il les cherchait dans les montagnes, car il disait : « Ces hommes nous fuient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, « camp » rend naturellement le sens de παρεμβολή.
- source_word: νυκτός
  choice: de nuit
  rationale: Expression française courante qui conserve la valeur temporelle du génitif grec.
- source_word: ἐζήτει
  choice: chercha
  rationale: L’imparfait grec décrit l’action de recherche; le passé simple convient au fil narratif français, renforcé par « alors ».
- source_word: ἐν τοῖς ὄρεσιν
  choice: dans les montagnes
  rationale: Traduction directe et naturelle du pluriel grec.
- source_word: Φεύγουσιν οὗτοι ἀφʼ ἡμῶν
  choice: Ces hommes fuient devant nous
  rationale: Dans un cadre militaire, « fuir devant » exprime idiomatiquement l’éloignement motivé par la crainte ou la défaite, sans ajouter qu’ils auraient déjà été vaincus.
