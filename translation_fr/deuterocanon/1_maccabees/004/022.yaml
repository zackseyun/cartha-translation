  text: They all fled into the land of the foreigners[a].
translation:
  language: fr
  text: Ils s’enfuirent tous au pays des étrangers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au pays des non-Juifs ». Le grec désigne des personnes appartenant à un autre peuple et fait probablement référence ici, de manière générale, aux peuples étrangers plutôt qu’aux seuls Philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: L’aoriste de φεύγω exprime ici la fuite devant le danger dans un contexte militaire. « S’enfuirent » est naturel et conserve cette idée de retraite précipitée.
- source_word: πάντες
  choice: tous
  rationale: L’adjectif employé substantivement souligne que l’ensemble du groupe prit la fuite. La tournure « Ils s’enfuirent tous » est idiomatique en français.
- source_word: γῆν
  choice: pays
  rationale: γῆ peut désigner une terre, un pays ou un territoire. Dans ce contexte géographique, « pays » rend naturellement la destination sans précision excessive.
- source_word: ἀλλοφύλων
  choice: des étrangers
  rationale: ἀλλόφυλος désigne littéralement des personnes appartenant à un autre peuple. Ici, le terme semble viser largement des peuples non judéens plutôt que les Philistins en particulier.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation concise respecte la brièveté du grec tout en conservant l’accent porté par πάντες sur la totalité du groupe.
