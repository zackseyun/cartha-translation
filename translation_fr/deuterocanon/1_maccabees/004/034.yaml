  yaml_path: translation/deuterocanon/1_maccabees/004/034.yaml
  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
translation:
  language: fr
  text: Ils engagèrent le combat les uns contre les autres. Environ cinq mille hommes[a] du camp de Lysias tombèrent ; ils tombèrent face à eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cinq mille hommes » ; avec εἰς, le grec peut exprimer soit une approximation, soit le nombre total atteint.'
    reason: lexical_alternative
  - marker: b
    text: Ou « devant eux » ou « en face d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: ils engagèrent le combat les uns contre les autres
  rationale: Dans un contexte militaire, συμβάλλω signifie engager ou livrer bataille. La formulation française conserve explicitement la réciprocité exprimée par ἀλλήλοις.
- source_word: ἔπεσον / ἔπεσαν
  choice: tombèrent / ils tombèrent
  rationale: « Tomber » est à la fois littéral et idiomatique dans un récit de bataille, où il implique la mort sans l’expliciter davantage que le grec. La répétition du verbe dans le texte source est conservée.
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: du camp de Lysias
  rationale: παρεμβολή désigne ici le camp militaire et, par extension contextuelle, les forces qui s’y trouvent. « Du camp de Lysias » reste concis et proche de la construction grecque.
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: environ cinq mille hommes
  rationale: Devant un nombre, εἰς peut indiquer une quantité approximative ou une quantité atteinte. « Environ » donne naturellement en français la première nuance sans masquer l’autre possibilité, signalée en note.
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: face à eux
  rationale: L’expression indique une position en vis-à-vis ou devant l’adversaire. « Face à eux » convient au contexte militaire tout en maintenant la valeur spatiale du grec.
