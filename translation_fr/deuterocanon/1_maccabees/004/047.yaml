  yaml_path: translation/deuterocanon/1_maccabees/004/047.yaml
  text: And they took whole stones according to the law[b][a], and built a new altar as before.
translation:
  language: fr
  text: Ils prirent des pierres intactes[a], conformément à la Loi, et construisirent un autel neuf comme le précédent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pierres entières »; le grec dit littéralement « entières, intactes ». « Des pierres non taillées » exprime probablement l’exigence de la Loi à laquelle la suite fait allusion.
    reason: alternative_lexicale
  - marker: b
    text: 'Ou « comme auparavant »; autre possibilité : « sur le modèle du précédent ».'
    reason: lecture_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: ils prirent
  rationale: L’aoriste de λαμβάνω désigne ici l’action concrète de prendre les matériaux nécessaires; « prirent » reste direct et naturel.
- source_word: λίθους ὁλοκλήρους
  choice: des pierres intactes
  rationale: ὁλόκληρος signifie « entier, complet, intact ». « Pierres intactes » rend le sens explicite sans intégrer au texte principal l’interprétation plus précise « pierres non taillées », suggérée par le contexte légal.
- source_word: κατὰ τὸν νόμον
  choice: conformément à la Loi
  rationale: La tournure exprime la conformité aux prescriptions légales. La majuscule à « Loi » indique naturellement ici la Torah, sans ajouter de précision absente du grec.
- source_word: ᾠκοδόμησαν
  choice: construisirent
  rationale: Le verbe signifie « bâtir, construire ». « Reconstruisirent » préciserait davantage que le grec.
- source_word: θυσιαστήριον καινὸν
  choice: un autel neuf
  rationale: θυσιαστήριον désigne un autel et καινός souligne qu’il est nouveau; « neuf » évite l’éventuelle ambiguïté d’un autel simplement différent ou récemment conçu.
- source_word: κατὰ τὸ πρότερον
  choice: comme le précédent
  rationale: La formule marque une correspondance avec ce qui existait auparavant. « Comme le précédent » conserve ce rapport comparatif sans imposer l’idée plus précise d’un plan architectural.
theological_decisions:
- issue: Faut-il expliciter dans la désignation des pierres l’arrière-plan de la Torah?
  choice: Conserver « pierres intactes » dans le texte et laisser « conformément à la Loi » signaler la prescription légale.
  alternative: Traduire « pierres non taillées » dans le texte principal.
  rationale: Le grec dit explicitement « entières/intactes », puis ajoute séparément « conformément à la Loi ». « Non taillées » correspond probablement à l’allusion scripturaire, mais introduit dans l’adjectif une précision déduite du contexte.
- issue: κατὰ τὸ πρότερον renvoie-t-il au précédent autel ou signifie-t-il simplement « comme auparavant »?
  choice: Traduire « comme le précédent ».
  alternative: Traduire « comme auparavant » ou « sur le modèle du précédent ».
  rationale: La formulation retenue garde la référence probable à l’autel antérieur tout en évitant de préciser indûment la nature exacte de la conformité.
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple convient au registre narratif biblique. La formulation reste proche du grec tout en évitant les calques peu naturels.
