base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your servant David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: fr
  text: 'Quand il vit que le camp était fort, il pria et dit : « Béni sois-tu, Sauveur d’Israël, toi qui as brisé l’assaut du puissant par la main de David, ton serviteur[a], et qui as livré le camp des étrangers aux mains de Jonathan, fils de Saül, et de celui qui portait ses armes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton esclave ». Le grec δοῦλος peut désigner un esclave ou un serviteur selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Cette prière fait allusion à la victoire de David sur Goliath et à celle de Jonathan accompagné de celui qui portait ses armes. Ici, le grec parle toutefois du « puissant » et des « étrangers » sans les nommer explicitement.
    reason: cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: camp
  rationale: Dans ce contexte militaire, le mot peut désigner aussi bien le camp que la force qui y est établie. « Camp » conserve cette latitude sans expliciter davantage que le grec.
- source_word: ἰσχυράν
  choice: fort
  rationale: « Fort » rend directement la puissance militaire du camp; le contexte empêche normalement de le comprendre comme une simple fortification.
- source_word: σωτήρ
  choice: Sauveur
  rationale: Titre adressé à Dieu, « Sauveur » en conserve le sens théologique et la forme solennelle.
- source_word: συντρίψας
  choice: as brisé
  rationale: Le verbe exprime une défaite décisive et violente. « Briser » est naturel en français tout en gardant la vigueur de l’image grecque.
- source_word: ὅρμημα
  choice: assaut
  rationale: Le nom désigne un élan violent ou une attaque; « assaut » convient précisément au contexte militaire.
- source_word: τοῦ δυνατοῦ
  choice: du puissant
  rationale: Le grec substantivé reste générique tout en visant vraisemblablement Goliath. « Du puissant » préserve cette allusion sans ajouter son nom.
- source_word: ἐν χειρὶ
  choice: par la main de
  rationale: Cette tournure biblique exprime l’intermédiaire ou l’agent. Sa conservation maintient la texture scripturaire de la prière.
- source_word: δούλου
  choice: serviteur
  rationale: Dans la formule relationnelle appliquée à David devant Dieu, « serviteur » est naturel, digne et traditionnel, tout en exprimant sa dépendance et son appartenance à Dieu. Une note signale la valeur plus forte possible du grec.
- source_word: ἀλλοφύλων
  choice: étrangers
  rationale: Le terme grec signifie littéralement les gens d’un autre peuple. « Étrangers » évite d’insérer « Philistins », identification suggérée par l’allusion mais non formulée ici.
- source_word: αἴροντος τὰ σκεύη αὐτοῦ
  choice: celui qui portait ses armes
  rationale: La formulation garde la structure descriptive du grec et son sens militaire sans remplacer le syntagme par le titre plus spécialisé « porteur d’armes ».
theological_decisions:
- issue: Rendre δοῦλος à propos de David
  choice: ton serviteur
  alternative: ton esclave
  rationale: « Serviteur » correspond au registre naturel d’une prière et à l’usage biblique français pour la relation de David à Dieu, sans nier l’idée d’entière appartenance contenue dans δοῦλος. La note conserve l’alternative lexicale plus forte.
- issue: Expliciter ou non l’allusion à Goliath et aux Philistins
  choice: conserver « le puissant » et « les étrangers »
  alternative: nommer Goliath et les Philistins
  rationale: La prière évoque clairement les récits de David et de Jonathan, mais le texte grec ne donne pas ces noms. La traduction maintient donc l’implicite et la tension allusive de la source.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe de la prière conserve un léger relief biblique, notamment « par la main de », tandis que la ponctuation et les enchaînements restent naturels en français moderne.
