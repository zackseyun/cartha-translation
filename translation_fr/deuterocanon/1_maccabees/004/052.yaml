base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/052.yaml
  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
translation:
  language: fr
  text: Ils se levèrent de bon matin, le vingt-cinquième jour du neuvième mois, le mois de Kislev[a], dans la cent quarante-huitième année[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « le mois Chaseleu » ; ce mois du calendrier juif est couramment appelé Kislev en français.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit simplement « la cent quarante-huitième année » ; historiquement, il s’agit de l’ère séleucide.
    reason: cultural_note
lexical_decisions:
- source_word: ὤρθρισαν τὸ πρωί
  choice: ils se levèrent de bon matin
  rationale: Le verbe indique qu’ils se levèrent tôt, et τὸ πρωί précise « le matin ». « De bon matin » restitue naturellement en français l’insistance temporelle de l’ensemble.
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: le vingt-cinquième jour
  rationale: Il s’agit de la formulation grecque ordinaire pour désigner le vingt-cinquième jour du mois.
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: du neuvième mois
  rationale: Traduction directe et naturelle de la formule de datation au génitif.
- source_word: Χασελεύ
  choice: Kislev
  rationale: Forme française usuelle du nom du mois juif représenté en grec par Χασελεύ.
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: en la cent quarante-huitième année
  rationale: Cette tournure française digne et fluide conserve la formule de datation sans expliciter dans le corps du texte l’ère que le grec ne nomme pas.
theological_decisions:
- issue: Identification de l’ère chronologique
  choice: Maintenir dans le texte « en la cent quarante-huitième année » sans nommer l’ère.
  alternative: « en la cent quarante-huitième année de l’ère séleucide »
  rationale: Le grec donne simplement le numéro de l’année. Son identification à l’ère séleucide relève du contexte historique et est donc signalée en note plutôt qu’ajoutée au texte.
translation_notes:
  register: Français international moderne, clair et digne. « De bon matin » rend sans lourdeur le redoublement temporel grec. La formulation historique reste proche de la source, et les précisions lexicales et culturelles sont réservées aux notes.
