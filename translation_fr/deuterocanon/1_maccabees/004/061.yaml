base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: fr
  text: Ils y postèrent une troupe pour le garder[a], et ils le fortifièrent pour garder Bethsoura[b], afin que le peuple ait une place forte face à l’Idumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ordonnèrent à une troupe de le garder ». Le verbe grec peut signifier « ordonner » ou « affecter » ; ici, il semble désigner l’installation de soldats à un poste de garde.
    reason: lexical_alternative
  - marker: b
    text: Bethsoura était une place fortifiée située au sud de Jérusalem, dans une position stratégique du côté de l’Idumée.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  choice: ils postèrent
  rationale: Avec δύναμιν et l’infinitif τηρεῖν, le verbe exprime ici l’affectation d’une troupe à un poste de garde. « Postèrent » restitue naturellement cette portée militaire, sans effacer le sens premier d’ordonner, signalé en note.
- source_word: δύναμιν
  choice: une troupe
  rationale: Dans ce contexte militaire, le nom désigne un corps de soldats plutôt que la force au sens abstrait.
- source_word: τηρεῖν
  choice: pour le garder
  rationale: Le verbe signifie ici surveiller et protéger un lieu. « Garder » convient au contexte militaire et conserve la référence pronominale du grec.
- source_word: ὠχύρωσαν
  choice: ils fortifièrent
  rationale: Le verbe indique que l’on rend un lieu défensivement solide; « fortifièrent » en préserve la valeur militaire.
- source_word: τὴν Βαιθσουρά
  choice: Bethsoura
  rationale: Le nom propre est translittéré d’après la forme grecque, sous une graphie naturelle en français.
- source_word: τοῦ ἔχειν
  choice: afin que le peuple ait
  rationale: L’infinitif articulé au génitif exprime le but. Cette construction française est claire, digne et proche de la relation syntaxique grecque.
- source_word: ὀχύρωμα
  choice: une place forte
  rationale: Le nom désigne un ouvrage ou un lieu défensif. « Place forte » rend bien la fonction stratégique sans imposer l’image plus précise d’une citadelle.
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: face à l’Idumée
  rationale: L’expression spatiale signifie littéralement « devant la face de l’Idumée » et indique une position tournée vers cette région.
