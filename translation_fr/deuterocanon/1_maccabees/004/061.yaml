translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et militaire. Le pronom « le » conserve l’ambiguïté référentielle du grec, tandis que la seconde proposition est rendue selon la syntaxe grecque qui fait de Bethsoura l’objet de « fortifièrent ».
