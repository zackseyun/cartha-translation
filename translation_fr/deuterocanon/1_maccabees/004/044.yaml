  text: And they deliberated concerning the defiled altar of burnt offering[a], what they should do with it.
translation:
  language: fr
  text: Ils délibérèrent sur ce qu’ils devaient faire de l’autel des holocaustes profané[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souillé » ou « rendu profane ».
    reason: Alternatives lexicales pour βεβηλωμένου, qui décrit l’autel comme ayant subi une violation de son caractère sacré.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: Ils délibérèrent
  rationale: Le moyen exprime ici une concertation en vue d’une décision; « délibérèrent » restitue cette réflexion collective dans un registre digne et actuel.
- source_word: θυσιαστηρίου
  choice: l’autel
  rationale: « Autel » est le terme français usuel; le génitif qui suit en précise la fonction.
- source_word: ὁλοκαυτώσεως
  choice: des holocaustes
  rationale: Le génitif désigne l’autel destiné aux offrandes entièrement brûlées. « Autel des holocaustes » est une formulation française établie et concise.
- source_word: βεβηλωμένου
  choice: qui avait été profané
  rationale: Le participe parfait passif décrit l’état présent résultant d’une profanation antérieure. La proposition relative rend clairement cette valeur sans alourdir le français.
- source_word: τί αὐτῷ ποιήσωσιν
  choice: afin de savoir ce qu’ils devaient en faire
  rationale: Dans le contexte de la délibération, la question indirecte porte sur la conduite à adopter à l’égard de l’autel. « En faire » est idiomatique en français; « afin de savoir » explicite naturellement le lien syntaxique sans trancher l’issue.
theological_decisions:
- issue: Description cultuelle de l’état de l’autel
  choice: qui avait été profané
  alternative: qui avait été souillé / qui avait été désacralisé
  rationale: βεβηλωμένου indique que l’autel a subi une violation de son caractère sacré. « Profané » conserve directement cette dimension cultuelle, tandis que « souillé » pourrait faire davantage penser à une impureté matérielle ou rituelle et « désacralisé » suggérer un changement de statut plus technique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit historique. La tournure « autel des holocaustes » conserve le vocabulaire cultuel traditionnel tout en restant intelligible.
