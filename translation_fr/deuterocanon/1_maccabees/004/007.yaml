revisions:
- from: Ils virent le camp puissant des nations, couvert d’armures, ainsi que la cavalerie qui l’entourait ; tous étaient entraînés à la guerre.
  to: Ils virent un puissant camp des nations, bien armé, et la cavalerie qui l’entourait ; ils étaient entraînés à la guerre.
  rationale: La révision remplace une formulation française imagée mais sémantiquement maladroite par « bien armé », qui rend naturellement l’état d’équipement militaire exprimé par le parfait τεθωρακισμένην. Elle conserve « des nations », sans introduire « païens », maintient la cavalerie collective pour ἵππον et évite de surdéterminer le référent humain de οὗτοι. Aucune ambiguïté textuelle disputée ne nécessite une note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:50:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens militaire général est bien rendu : le camp est puissant, la cavalerie l’entoure et les combattants sont formés à la guerre. Toutefois, « couvert d’armures » donne l’image concrète d’un camp matériellement recouvert d’armures, alors que τεθωρακισμένην qualifie le camp par métonymie, c’est-à-dire les troupes qui le composent, comme étant armées/équipées d’armures. La coordination grecque est également rendue plus directement.'
  naturalness: « Ainsi que » est possible, mais atténue la succession coordonnée du grec. « Bien armé » est idiomatique en français militaire lorsqu’il se rapporte à un camp au sens des forces qui y sont réunies. « Tous » explicite de façon un peu forte un antécédent que le démonstratif grec laisse relativement souple ; « ils » conserve mieux cette souplesse tout en restant naturel.
  terminology: « Camp », « des nations », « cavalerie » et « entraînés à la guerre » conviennent au grec et au registre moderne international. Aucun terme théologique particulier ni aucune note ne sont requis.
  issues:
  - severity: medium
    issue: Image inexacte de τεθωρακισμένην
    rationale: « Couvert d’armures » présente le camp comme physiquement couvert d’objets. Le grec emploie le participe de « revêtir d’une cuirasse » pour un camp/une force militairement équipée ; « bien armé » rend cette métonymie sans image matérielle incongrue.
  - severity: low
    issue: Explicitation excessive du référent de οὗτοι
    rationale: « Tous » fixe le référent à l’ensemble des combattants. Le démonstratif grec masculin pluriel renvoie aux hommes en présence, avec une portée qui n’est pas nécessairement à expliciter davantage en français.
  revised_text: Ils virent un puissant camp des nations, bien armé, et la cavalerie qui l’entourait ; ils étaient entraînés à la guerre.
