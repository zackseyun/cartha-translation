  yaml_path: translation/deuterocanon/1_maccabees/004/007.yaml
  text: And they saw a strong camp of the nations[a], armored, and cavalry surrounding it, and these were trained for war.
translation:
  language: fr
  text: Ils virent un puissant camp des nations, bien armé, et la cavalerie qui l’entourait ; ils étaient entraînés à la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, le terme désigne un campement ou un camp militaire ; « camp » est naturel et précis en français.
- source_word: ἐθνῶν
  choice: des nations
  rationale: L’expression désigne ici les peuples non juifs. « Des nations » reste proche du grec sans imposer la formulation plus interprétative « des païens ».
- source_word: ἰσχυρὰν
  choice: puissant
  rationale: L’adjectif décrit le caractère redoutable du camp ou des forces qui y sont rassemblées ; « puissant » convient naturellement à cet ensemble militaire.
- source_word: τεθωρακισμένην
  choice: couvert d’armures
  rationale: Le participe parfait indique que le camp, par métonymie pour les troupes qui l’occupent, est pourvu d’armures. Cette formulation conserve l’image grecque sans suggérer un camp physiquement blindé.
- source_word: ἵππον
  choice: la cavalerie
  rationale: Le singulier collectif désigne ici les forces montées plutôt qu’un cheval isolé ; « la cavalerie » rend clairement le sens militaire.
- source_word: κυκλοῦσαν
  choice: qui l’entourait
  rationale: Le participe décrit la cavalerie disposée autour du camp ; cette relative est naturelle en français et conserve le rapport grammatical avec le camp.
- source_word: οὗτοι
  choice: tous
  rationale: Le démonstratif masculin pluriel renvoie le plus naturellement aux combattants implicitement présents dans le camp et dans la cavalerie. « Tous » rend ce référent humain collectif sans lourdeur.
- source_word: διδακτοὶ πολέμου
  choice: entraînés à la guerre
  rationale: L’expression signifie qu’ils ont reçu une instruction militaire ; « entraînés à la guerre » préserve l’idée de formation plutôt que de simple expérience.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La coordination grecque est rendue par « ainsi que », tandis que la dernière proposition est légèrement explicitée par « tous » afin d’éviter qu’en français elle paraisse ne viser que la cavalerie. Aucune distinction confessionnelle n’est introduite.
