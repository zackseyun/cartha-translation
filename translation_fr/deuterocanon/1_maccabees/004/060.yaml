base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: fr
  text: Ils construisirent alors, tout autour du mont Sion, de hautes murailles et de solides tours[a], de peur que les nations ne viennent les piétiner, comme elles l’avaient fait auparavant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs ». Le grec τὰ ἔθνη peut désigner « les nations » ou, selon le contexte, « les non-Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: ils entourèrent ... de
  rationale: Le verbe signifie littéralement « ils construisirent ». Avec le mont Sion comme objet, puis les murailles et les tours en apposition, le français naturel explicite que ces ouvrages furent construits autour du site, sans réduire le sens à la seule notion interprétative de fortification.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: À cette époque
  rationale: Expression temporelle courante, naturelle dans un récit historique et fidèle au grec.
- source_word: τὸ ὄρος Σιὼν
  choice: le mont Sion
  rationale: Forme française traditionnelle et précise du nom de lieu.
- source_word: κυκλόθεν
  choice: entourèrent
  rationale: Le sens spatial « tout autour » est intégré naturellement à la construction française « entourer de ».
- source_word: τείχη ὑψηλὰ
  choice: de hautes murailles
  rationale: « Murailles » convient mieux que « murs » au contexte défensif, tandis que « hautes » traduit directement l’adjectif.
- source_word: πύργους ἰσχυρούς
  choice: de solides tours
  rationale: « Solides » exprime la robustesse indiquée par ἰσχυρούς dans un français actuel et idiomatique.
- source_word: μή ποτε
  choice: de peur que ... ne
  rationale: Cette tournure française exprime clairement la précaution et le risque redouté, avec le ne explétif attendu.
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: les nations ne viennent
  rationale: Le participe est rendu naturellement par un verbe conjugué. « Les nations » conserve le sens premier et l’ambiguïté possible du grec.
- source_word: καταπατήσωσιν αὐτά
  choice: le piétiner
  rationale: « Piétiner » traduit directement le verbe. Malgré le pluriel grec αὐτά, le singulier français renvoie naturellement au mont Sion envisagé comme ensemble fortifié.
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: comme elles l’avaient fait auparavant
  rationale: Le plus-que-parfait restitue le retour sur une action antérieure; « auparavant » traduit sobrement τὸ πρότερον.
theological_decisions:
- issue: Sens de τὰ ἔθνη dans ce récit historique deutérocanonique
  choice: les nations
  alternative: les non-Juifs
  rationale: « Les nations » est proche du sens lexical fondamental et maintient la couleur du texte grec. Dans le contexte, le terme désigne les peuples non juifs hostiles; cette valeur est signalée en note sans imposer une terminologie confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible tout en conservant le vocabulaire concret des ouvrages défensifs et l’ambiguïté de τὰ ἔθνη.
