  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: fr
  text: Tout le peuple tomba face contre terre ; tous adorèrent et bénirent, en direction du ciel[a], celui qui leur avait accordé le succès[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le ciel » ou « au ciel » ; le grec peut indiquer la direction de l’adoration et de la bénédiction ou, par une périphrase révérencielle, renvoyer à Dieu qui est au ciel.
    reason: alternative_lexicale
  - marker: b
    text: Ou « celui qui leur avait donné la réussite » ou « celui qui avait fait prospérer leur chemin ».
    reason: alternative_de_traduction
lexical_decisions:
- source_word: ἔπεσον πᾶς ὁ λαὸς ἐπὶ πρόσωπον
  choice: Tout le peuple tomba face contre terre
  rationale: L’expression grecque décrit une prostration. Le singulier collectif « tout le peuple » et la locution française « face contre terre » rendent naturellement l’image sans en atténuer la force.
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Dans le contexte cultuel de la dédicace de l’autel, le verbe exprime l’adoration et non un simple geste de déférence. « Se prosternèrent » serait possible, mais ferait inutilement double emploi avec la proposition précédente.
- source_word: ηὐλόγησαν
  choice: bénirent
  rationale: Le choix conserve le sens direct du verbe grec, appliqué à Dieu au sens de proclamer sa bénédiction ou sa louange, plutôt que de le remplacer par le terme plus interprétatif « louèrent ».
- source_word: εἰς οὐρανὸν
  choice: en direction du ciel
  rationale: Cette formulation conserve la valeur directionnelle de εἰς tout en laissant ouverte la possibilité que « le ciel » serve de périphrase révérencielle pour Dieu.
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: celui qui leur avait accordé le succès
  rationale: Le participe substantivé désigne implicitement Dieu. « Accorder le succès » rend clairement εὐοδόω en français moderne sans expliciter dans le texte principal le nom divin que le grec laisse sous-entendu.
theological_decisions:
- issue: Référent de « celui qui leur avait accordé le succès »
  choice: Conserver la désignation indirecte de Dieu
  alternative: « Dieu, qui leur avait accordé le succès »
  rationale: Le grec emploie un participe substantivé et ne nomme pas Dieu directement. La traduction maintient cette périphrase révérencielle et la tension créée par la mention du ciel.
- issue: Fonction de « vers le ciel »
  choice: Conserver une indication de direction liée à l’adoration et à la bénédiction
  alternative: Comprendre « le ciel » comme une désignation directe de Dieu
  rationale: εἰς οὐρανόν peut indiquer la direction des actes, tout en évoquant indirectement Dieu dans le ciel. Le texte principal et la note préservent ces deux dimensions sans trancher excessivement.
translation_notes:
  register: Français international actuel, digne et accessible. Le point-virgule conserve l’enchaînement serré du grec. « Adorèrent » évite une répétition maladroite de la prostration, tandis que « bénirent » maintient le vocabulaire théologique de la source.
