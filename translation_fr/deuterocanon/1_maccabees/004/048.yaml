  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: fr
  text: Ils reconstruisirent le sanctuaire[a] et l’intérieur du temple, puis consacrèrent les cours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lieu saint » ; le grec peut désigner l’espace sacré du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: reconstruisirent
  rationale: Le verbe signifie littéralement « bâtir »; dans le contexte de la remise en état du temple profané, « reconstruisirent » exprime naturellement l’activité de restauration matérielle sans la réduire à une simple réparation.
- source_word: τὰ ἅγια
  choice: le sanctuaire
  rationale: Dans ce contexte cultuel et architectural, le pluriel neutre désigne vraisemblablement l’espace sacré du temple. « Le sanctuaire » est clair en français moderne tout en maintenant sa distinction avec l’intérieur de la Maison.
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: l’intérieur de la Maison
  rationale: La tournure grecque désigne ce qui se trouve à l’intérieur du bâtiment. Cette formulation française restitue le sens spatial sans lourdeur.
- source_word: οἴκου
  choice: Maison
  rationale: « Maison » conserve l’appellation biblique du temple comme Maison de Dieu; la majuscule signale ici qu’il s’agit du bâtiment du temple, et non d’une habitation ordinaire.
- source_word: τὰς αὐλάς
  choice: les cours
  rationale: Dans l’architecture du temple, αὐλαί désigne les cours. « Cours » est le terme français naturel et traditionnel dans ce contexte.
- source_word: ἡγίασαν
  choice: consacrèrent
  rationale: Le verbe indique que les cours furent rendues saintes, mises à part pour le culte. « Consacrèrent » exprime clairement cette action rituelle en français courant.
theological_decisions:
- issue: Désignation des espaces sacrés du temple
  choice: Traduire τὰ ἅγια par « le sanctuaire » et le distinguer de « l’intérieur de la Maison ».
  alternative: « Le lieu saint » ou, plus littéralement mais moins probablement ici, « les choses saintes ».
  rationale: L’énumération porte sur des parties du complexe du temple qui sont reconstruites ou consacrées. Une désignation locale convient donc mieux que la référence à des objets, tout en préservant les distinctions architecturales du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Maison » est conservé comme idiome cultuel biblique et explicité en note; « sanctuaire » et « cours » emploient une terminologie architecturale claire.
