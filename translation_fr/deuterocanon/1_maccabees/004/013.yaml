  text: And they went out from the camp for battle[a], and those with Judas sounded the trumpets.
translation:
  language: fr
  text: Ils sortirent du camp pour livrer bataille, et ceux qui étaient avec Judas sonnèrent de la trompette.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθαν
  choice: sortirent
  rationale: L’aoriste indique simplement qu’ils quittèrent un lieu; « sortirent » reste direct sans ajouter l’idée d’une marche militaire.
- source_word: παρεμβολῆς
  choice: camp
  rationale: Dans ce contexte militaire, παρεμβολή désigne le campement des troupes; « camp » est le terme français courant et précis.
- source_word: εἰς πόλεμον
  choice: pour livrer bataille
  rationale: La tournure exprime ici l’entrée dans le combat. « Pour livrer bataille » est idiomatique en français et convient mieux à l’affrontement immédiat que « pour faire la guerre ».
- source_word: ἐσάλπισαν
  choice: sonnèrent de la trompette
  rationale: Le verbe signifie faire retentir une trompette. Cette formulation française naturelle n’impose pas un nombre d’instruments que le grec ne précise pas.
- source_word: οἱ παρὰ Ἰούδου
  choice: ceux qui étaient avec Judas
  rationale: La construction désigne les personnes accompagnant Judas. Cette traduction reste neutre et n’ajoute ni sexe explicite ni structure de commandement.
- source_word: Ἰούδου
  choice: Judas
  rationale: « Judas » est la forme française traditionnelle du nom de Judas Maccabée.
