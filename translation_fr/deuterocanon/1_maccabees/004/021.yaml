  yaml_path: translation/deuterocanon/1_maccabees/004/021.yaml
  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
translation:
  language: fr
  text: Mais, à cette vue, ils furent saisis d’une grande peur ; voyant aussi dans la plaine le camp de Judas, prêt pour le déploiement en ordre de bataille[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prêt à être mis en ordre de bataille » ou « prêt pour le combat » ; le terme grec désigne la mise en formation des troupes en vue de la bataille.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: à cette vue / voyant
  rationale: Le participe de συνοράω exprime ici la perception. La variation française évite une répétition pesante tout en conservant les deux occurrences et leur valeur circonstancielle.
- source_word: ἐδειλώθησαν σφόδρα
  choice: ils furent saisis d’une grande peur
  rationale: Le verbe évoque la peur et la perte de courage, tandis que σφόδρα en marque fortement l’intensité. Cette formulation est naturelle et convient au contexte militaire sans qualifier moralement les hommes de lâches.
- source_word: παρεμβολή
  choice: camp
  rationale: Dans ce contexte militaire, le terme désigne le campement ou, par extension, les forces qui y sont rassemblées. « Camp » garde cette possible métonymie et correspond à l’accord de ἑτοίμην.
- source_word: ἐν τῷ πεδίῳ
  choice: dans la plaine
  rationale: πεδίον désigne ici un terrain plat et découvert; « plaine » en rend clairement la valeur géographique.
- source_word: ἑτοίμην εἰς παράταξιν
  choice: prêt à se ranger en ordre de bataille
  rationale: La formulation rend à la fois l’état de préparation exprimé par ἑτοίμην et le sens militaire précis de παράταξις, à savoir la mise en formation pour l’affrontement.
