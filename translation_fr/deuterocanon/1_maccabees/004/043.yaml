  text: And they cleansed the sanctuary, and carried the stones of defilement to an unclean place.
translation:
  language: fr
  text: Ils purifièrent le sanctuaire et transportèrent les pierres souillées dans un lieu impur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: purifièrent
  rationale: Dans le contexte du rétablissement du culte, le verbe exprime une purification à la fois concrète et rituelle ; « purifièrent » conserve clairement cette portée.
- source_word: τὰ ἅγια
  choice: le sanctuaire
  rationale: Dans ce contexte du Temple, le neutre pluriel désigne l’espace sacré plutôt que des objets saints pris isolément. « Le sanctuaire » est idiomatique et précis en français.
- source_word: ἦραν
  choice: transportèrent
  rationale: Le verbe signifie littéralement lever ou emporter. Ici, il décrit le déplacement des pierres vers un autre lieu ; « transportèrent » rend l’action concrète sans la réduire au simple fait de les enlever.
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: les pierres souillées
  rationale: Le génitif associe les pierres à la profanation ou souillure cultuelle. « Les pierres souillées » est naturel en français et conserve la dimension rituelle, sans la tournure peu idiomatique « pierres de souillure ».
- source_word: εἰς τόπον ἀκάθαρτον
  choice: dans un lieu impur
  rationale: ἀκάθαρτος appartient au vocabulaire de l’impureté rituelle. « Un lieu impur » préserve ce registre biblique et cultuel.
theological_decisions:
- issue: Vocabulaire cultuel lors de la restauration du Temple
  choice: Conserver explicitement le langage de pureté rituelle avec « purifièrent », « souillées » et « impur ».
  alternative: Employer des termes matériels plus généraux comme « nettoyèrent », « sales » et « endroit malpropre ».
  rationale: Le grec décrit non seulement un nettoyage matériel, mais la restauration cultuelle du sanctuaire après sa profanation. La traduction garde donc visible cette dimension sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français moderne international, narratif, sobre et digne. La formulation demeure naturelle pour le grand public tout en préservant le champ lexical cultuel du grec.
