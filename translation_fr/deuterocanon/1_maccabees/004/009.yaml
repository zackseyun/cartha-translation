base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/009.yaml
  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
translation:
  language: fr
  text: Souvenez-vous comment nos pères ont été sauvés dans la mer Rouge, lorsque Pharaon les a poursuivis en force.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec puissance » ; le grec peut désigner la force ou une force militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif aoriste appelle les auditeurs à se rappeler activement un événement fondateur; « Souvenez-vous » est direct, naturel et digne en français.
- source_word: ἐσώθησαν
  choice: ont été sauvés
  rationale: Le passif de σῴζω désigne ici la délivrance historique au passage de la mer, tout en conservant la résonance biblique du langage du salut.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Cette formulation conserve l’expression masculine explicite du grec et son sens traditionnel de pères d’Israël, sans la neutraliser en « ancêtres ».
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: dans la mer Rouge
  rationale: La traduction suit étroitement ἐν et rend le nom conventionnel de cette mer dans le grec biblique.
- source_word: ἐδίωξεν
  choice: a poursuivis
  rationale: « Poursuivre » rend naturellement διώκω dans ce contexte narratif et militaire.
- source_word: ἐν δυνάμει
  choice: avec ses forces
  rationale: Dans le contexte de la poursuite menée par Pharaon, δύναμις peut évoquer une force militaire. « Avec ses forces » demeure naturel en français sans préciser explicitement « armée ».
theological_decisions:
- issue: Langage du salut dans le récit d’une délivrance historique
  choice: ont été sauvés
  alternative: ont été délivrés
  rationale: « Sauvés » préserve le champ sémantique de σῴζω et les résonances intertextuelles bibliques, sans transformer cette délivrance historique en affirmation doctrinale plus précise.
- issue: Désignation genrée des générations antérieures d’Israël
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie explicitement le masculin pluriel; la traduction le conserve tout en reconnaissant que le référent historique peut englober le peuple antérieur d’Israël.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste proche du grec tout en étant naturelle; « avec ses forces » explicite seulement la valeur militaire probable de l’expression contextuelle.
