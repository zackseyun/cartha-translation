  terminology: « Sauvés » préserve de façon appropriée le vocabulaire de σῴζω dans son cadre de délivrance historique. « Nos pères », « mer Rouge » et « Pharaon » sont exacts et usuels. La note conserve une alternative lexicale sans imposer l’interprétation militaire.
