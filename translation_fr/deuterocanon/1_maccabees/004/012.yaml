  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
translation:
  language: fr
  text: Les étrangers levèrent les yeux et les virent postés en face d’eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rangés en face d’eux » ou « campés en face d’eux ». Le participe grec peut désigner le fait d’occuper une position ou d’être disposé en ordre; le contexte est militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλόφυλοι
  choice: les étrangers
  rationale: Le terme désigne ici les forces non juives, celles d’un autre peuple, sans qu’il faille les identifier plus précisément comme des Philistins.
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: levèrent les yeux
  rationale: Cette tournure conserve l’image de l’expression grecque tout en restant naturelle et intelligible en français moderne.
- source_word: ἶδαν
  choice: virent
  rationale: Le passé simple rend directement l’aoriste dans un récit au registre digne.
- source_word: ἐχομένους
  choice: postés
  rationale: Dans ce contexte militaire, le participe décrit des hommes qui occupent une position. « Postés » est naturel sans préciser indûment s’ils campaient ou s’ils étaient rangés pour le combat.
- source_word: ἐξ ἐναντίας
  choice: en face d’eux
  rationale: L’expression indique une position opposée ou directement vis-à-vis, rendue naturellement par « en face d’eux ».
