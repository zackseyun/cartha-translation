  text: But as many of the foreigners as escaped, after they arrived, reported to Lysias all that had happened.
translation:
  language: fr
  text: Mais ceux des étrangers qui avaient survécu, une fois arrivés, rapportèrent à Lysias tout ce qui s’était passé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλων
  choice: étrangers
  rationale: Le terme désigne ici les membres des forces non juives; « étrangers » conserve la distinction de groupe sans ajouter une désignation ethnique absente du grec.
- source_word: διεσώθησαν
  choice: avaient échappé au massacre
  rationale: Le verbe signifie être sauvé ou sortir indemne d’un danger. Dans le contexte immédiat de la bataille, « échapper au massacre » exprime naturellement le péril implicite, sans prétendre qu’ils n’avaient subi aucune blessure.
- source_word: παραγενηθέντες
  choice: se rendirent auprès de Lysias
  rationale: Le participe indique qu’ils arrivèrent ou se présentèrent; sa relation avec « à Lysias » est rendue idiomatiquement en français.
- source_word: ἀπήγγειλαν
  choice: racontèrent
  rationale: Le verbe signifie rapporter ou annoncer. « Racontèrent » convient au complément « tout ce qui s’était passé » et reste naturel.
- source_word: πάντα τὰ συμβεβηκότα
  choice: tout ce qui s’était passé
  rationale: Rendu direct et idiomatique du parfait grec désignant l’ensemble des événements survenus.
