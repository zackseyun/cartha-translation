    reason: lexical_alternative
  - marker: b
    text: Ou « des mercenaires ». Le verbe grec met d’abord l’accent sur le recrutement d’étrangers, sans préciser nécessairement qu’ils étaient rémunérés.
    reason: alternative_reading
