base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: fr
  text: Mais lorsque Lysias vit la déroute de sa propre armée, le courage qui s’était manifesté dans le camp de Judas[a], et qu’ils étaient prêts à vivre ou à mourir noblement, il partit pour Antioche, où il se mit à recruter des soldats étrangers[b], afin de revenir en Judée après avoir de nouveau accru ses effectifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec dit « le courage de Judas ». Dans le contexte, et compte tenu du pluriel de la proposition suivante, il s’agit vraisemblablement du courage manifesté par le camp de Judas.
    reason: lexical_alternative
  - marker: b
    text: Ou « des mercenaires ». Le verbe grec met d’abord l’accent sur le recrutement d’étrangers, sans préciser nécessairement qu’ils étaient rémunérés.
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: déroute
  rationale: Dans ce contexte militaire, le nom désigne la mise en fuite ou la débâcle d’une force, plutôt qu’une simple défaite.
- source_word: σύνταξις
  choice: armée
  rationale: Le terme désigne ici les troupes rangées ou organisées de Lysias. « Armée » est naturel en français moderne et rend clairement le référent collectif.
- source_word: θάρσος
  choice: courage
  rationale: Le mot exprime l’assurance courageuse ou la hardiesse. « Courage » convient au registre narratif et prépare la disposition à vivre ou à mourir noblement.
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  choice: le courage qui avait grandi chez les hommes de Judas
  rationale: Le grec dit de manière condensée « le courage de Judas », mais le pluriel qui suit montre que le propos englobe son camp. La formulation française explicite ce référent sans réduire le courage à Judas seul.
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: ils étaient prêts à vivre ou à mourir noblement
  rationale: La construction équilibrée entre vivre et mourir est conservée. « Noblement » maintient la nuance de bravoure et d’honneur portée par γενναίως.
- source_word: ἀπῆρεν
  choice: il partit
  rationale: Le verbe indique simplement le départ de Lysias vers Antioche; « partit » est direct et naturel.
- source_word: ἐξενολόγει
  choice: il y recruta des soldats étrangers
  rationale: Le verbe met explicitement l’accent sur le recrutement d’étrangers. Il peut s’agir de mercenaires, mais leur statut rémunéré n’est pas affirmé sans ambiguïté par le terme lui-même.
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: dans l’intention d’accroître encore ses effectifs
  rationale: La tournure grecque exprime l’augmentation numérique de la force de Lysias avant une nouvelle campagne. La formulation rend explicite l’objet militaire implicite.
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: de revenir en Judée
  rationale: Le verbe exprime l’arrivée projetée en Judée; dans le contexte d’une campagne renouvelée, « revenir » restitue naturellement cette idée.
