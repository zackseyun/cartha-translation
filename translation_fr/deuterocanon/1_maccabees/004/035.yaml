revisions:
- from: Mais lorsque Lysias vit la déroute de sa propre armée, le courage qui avait grandi chez les hommes de Judas[a], et qu’ils étaient prêts à vivre ou à mourir noblement, il partit pour Antioche. Il y recruta des soldats étrangers[b], dans l’intention d’accroître encore ses effectifs et de revenir en Judée.
  to: Mais lorsque Lysias vit la déroute de sa propre armée, le courage qui s’était manifesté dans le camp de Judas[a], et qu’ils étaient prêts à vivre ou à mourir noblement, il partit pour Antioche, où il se mit à recruter des soldats étrangers[b], afin de revenir en Judée après avoir de nouveau accru ses effectifs.
  rationale: La révision conserve le sens militaire et le registre du projet, tout en rendant plus fidèlement l'imparfait grec et la relation entre le recrutement, le renforcement numérique et le retour envisagé. Elle reformule également le groupe relatif à Judas de façon à ne pas résoudre indûment une ambiguïté du grec.
