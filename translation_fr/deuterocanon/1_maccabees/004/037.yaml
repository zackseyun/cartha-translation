  text: Tout le camp se rassembla, et tous montèrent au mont Sion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθη
  choice: se rassembla
  rationale: L’aoriste passif de συνάγω a ici un sens collectif naturellement rendu en français par le pronominal « se rassembla ».
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: toute l’armée
  rationale: παρεμβολή peut désigner le camp ou, par métonymie, les forces qui le composent. Puisque le groupe se rassemble et monte, « toute l’armée » désigne naturellement les personnes plutôt que le lieu du campement, tout en conservant la totalité exprimée par πᾶσα.
- source_word: ἀνέβησαν
  choice: ils montèrent
  rationale: Le verbe exprime un déplacement vers le haut. « Montèrent » est direct et naturel, sans ajouter l’idée non explicitée d’une marche militaire.
- source_word: εἰς ὄρος Σιών
  choice: au mont Sion
  rationale: εἰς marque ici la destination, et « mont Sion » est la désignation biblique française habituelle de ὄρος Σιών.
