lexical_decisions:
- source_word: ἕως ἔτι
  choice: tandis que… encore
  rationale: La tournure grecque, assez condensée, introduit ici la période pendant laquelle l’action doit avoir lieu. « tandis que… encore » en rend naturellement la valeur temporelle en français.
- source_word: αἱ δυνάμεις
  choice: les troupes
  rationale: Dans ce contexte militaire, le pluriel désigne les forces combattantes. « Les troupes » est naturel en français et conserve la valeur collective du grec.
- source_word: ἐσκορπισμέναι
  choice: dispersées
  rationale: Le participe indique que les troupes n’étaient pas regroupées. « Dispersées » en donne le sens direct sans préciser davantage leur disposition.
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: loin du camp
  rationale: παρεμβολή désigne ici le camp militaire, et ἀπό marque l’éloignement. « Loin du camp » exprime clairement cette séparation en français idiomatique.
