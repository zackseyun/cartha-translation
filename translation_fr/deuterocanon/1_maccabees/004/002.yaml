  text: so as to fall upon the camp of the Jews and strike them suddenly[a]; and the men of the citadel were his guides.
translation:
  language: fr
  text: afin de fondre sur le camp des Juifs et de les frapper soudainement ; les hommes de la citadelle[a] lui servaient de guides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la citadelle ». « Akra » est le nom grec souvent donné à la citadelle fortifiée de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: afin de
  rationale: Dans le prolongement du mouvement décrit au verset précédent, ὥστε avec l’infinitif exprime ici le but visé ; « afin de » le rend naturellement en français.
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: fondre sur
  rationale: L’expression dépeint un mouvement offensif brusque contre une cible. « Fondre sur » conserve cette vivacité militaire sans développer le texte.
- source_word: παρεμβολή
  choice: camp
  rationale: Dans ce contexte militaire, le terme désigne le campement de l’armée ; « camp » est précis et courant.
- source_word: πατάξαι
  choice: frapper
  rationale: Le verbe désigne le fait de porter des coups et peut, selon le contexte, avoir une issue mortelle. « Frapper » préserve cette latitude sans imposer « tuer ».
- source_word: ἄφνω
  choice: soudainement
  rationale: L’adverbe exprime directement la soudaineté. Le contexte suggère déjà l’effet de surprise, qu’il n’est pas nécessaire d’ajouter.
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: les hommes de la Citadelle
  rationale: Littéralement « les fils de la Citadelle », l’expression désigne les hommes associés à cette forteresse plutôt qu’une filiation biologique. Cette formulation est naturelle et fidèle au sens.
- source_word: ἄκρα
  choice: Citadelle
  rationale: Le mot désigne ici la forteresse de Jérusalem connue comme l’Akra. « Citadelle » en communique le sens, tandis que le nom grec est signalé en note.
- source_word: ὁδηγοί
  choice: guides
  rationale: Le terme désigne ceux qui montrent ou conduisent le chemin, ce qui convient à l’itinéraire d’une attaque.
