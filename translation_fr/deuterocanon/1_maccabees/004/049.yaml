base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: fr
  text: Ils fabriquèrent de nouveaux objets sacrés et apportèrent dans le sanctuaire le porte-lampes, l’autel des holocaustes et celui de l’encens[a], ainsi que la table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’autel des holocaustes et de l’encens ». En grec, « holocaustes » et « encens » dépendent tous deux du mot « autel », bien que le contexte renvoie aux deux autels distincts du sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: ils fabriquèrent
  rationale: Dans ce contexte, ποιέω désigne la fabrication d’objets cultuels de remplacement. « Fabriquèrent » est naturel et plus précis que le très général « firent ».
- source_word: τὰ σκεύη τὰ ἅγια καινά
  choice: de nouveaux objets sacrés
  rationale: σκεύη désigne ici l’ensemble des articles ou ustensiles du culte. « Objets sacrés » est clair en français moderne, tandis que « nouveaux » rend directement καινά.
- source_word: εἰσήνεγκαν
  choice: apportèrent dans
  rationale: Le verbe composé, avec εἰς, exprime le déplacement vers l’intérieur du sanctuaire.
- source_word: τὴν λυχνίαν
  choice: le porte-lampes
  rationale: λυχνία désigne le support cultuel portant les lampes, et non une lampe isolée. « Porte-lampes » évite de réduire explicitement l’objet à un chandelier destiné à des bougies.
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: l’autel des holocaustes et celui des parfums
  rationale: La syntaxe grecque rattache les deux génitifs à θυσιαστήριον, mais le contexte cultuel renvoie à deux autels familiers. La répétition elliptique de « celui » rend ce sens naturellement sans masquer la forme grecque, signalée en note.
- source_word: τὴν τράπεζαν
  choice: la table
  rationale: Le grec dit simplement « la table »; préciser « des pains de la Présence » ajouterait une identification implicite absente du verset.
- source_word: εἰς τὸν ναόν
  choice: dans le sanctuaire
  rationale: ναός désigne ici le bâtiment sacré intérieur, non l’ensemble plus vaste du Temple. « Sanctuaire » exprime cette distinction avec précision.
theological_decisions:
- issue: Identification des autels
  choice: 'Rendre le sens contextuel comme deux autels : « l’autel des holocaustes et celui des parfums »'
  alternative: « l’autel des holocaustes et des parfums »
  rationale: Le grec n’énonce qu’une fois « autel » et coordonne deux génitifs, ce qui crée une ambiguïté grammaticale réelle. Toutefois, l’aménagement du sanctuaire suppose l’autel des holocaustes et l’autel des parfums comme deux objets distincts. La traduction principale restitue le référent probable, et la note conserve la lecture formellement possible.
- issue: Explicitation des objets du sanctuaire
  choice: Conserver la liste concise du grec
  alternative: Développer « la table » en « la table des pains de la Présence »
  rationale: L’expansion identifierait correctement l’objet, mais introduirait des mots qui ne figurent pas dans ce verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Sanctuaire » précise la portée de ναός. « Parfums » conserve le vocabulaire cultuel traditionnel pour l’encens aromatique; la syntaxe légèrement elliptique de « celui des parfums » reste naturelle et concise.
