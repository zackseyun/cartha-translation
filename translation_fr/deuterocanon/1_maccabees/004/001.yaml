  yaml_path: translation/deuterocanon/1_maccabees/004/001.yaml
  text: And Gorgias took five thousand men and one thousand chosen horsemen[a], and the camp set out by night,
translation:
  language: fr
  text: Gorgias prit avec lui cinq mille hommes et mille cavaliers d’élite, et le camp[a] se mit en route pendant la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les troupes »; le mot grec rendu par « camp » peut désigner collectivement les troupes qui y sont rassemblées.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: prit avec lui
  rationale: Dans ce contexte militaire, le verbe indique que Gorgias prend avec lui les troupes mentionnées, sans préciser davantage les modalités de son commandement.
- source_word: πεντακισχιλίους ἄνδρας
  choice: cinq mille hommes
  rationale: Le grec dit littéralement « hommes »; le contexte militaire permet de comprendre qu’il s’agit de combattants sans qu’il soit nécessaire de remplacer le terme par « soldats ».
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: mille cavaliers d’élite
  rationale: ἵππον est ici un collectif désignant la cavalerie, et ἐκλεκτήν qualifie cette troupe comme choisie ou de premier ordre. « Cavaliers d’élite » est naturel en français et conserve les deux idées.
- source_word: ἀπῆρεν
  choice: se mit en route
  rationale: Le verbe exprime le départ. Cette formulation convient au déplacement d’une troupe sans ajouter l’idée plus précise d’une marche militaire.
- source_word: ἡ παρεμβολή
  choice: le camp
  rationale: Le terme désigne proprement le campement et, par métonymie, les troupes qui y sont rassemblées. « Le camp » préserve l’image grecque et son caractère collectif.
- source_word: νυκτός
  choice: pendant la nuit
  rationale: Le génitif a ici une valeur temporelle. « Pendant la nuit » est clair, naturel et n’ajoute pas explicitement une intention de furtivité.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La formulation conserve la métonymie du « camp » tout en l’expliquant en note; elle évite d’accentuer au-delà du grec le commandement de Gorgias ou le caractère furtif du départ nocturne.
