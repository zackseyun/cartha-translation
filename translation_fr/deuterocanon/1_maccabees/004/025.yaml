lexical_decisions:
- source_word: ἐγενήθη
  choice: connut
  rationale: Dans cette tournure événementielle, « Israël connut » exprime naturellement en français la survenue d'une situation, sans insister artificiellement sur le processus de devenir.
- source_word: σωτηρία
  choice: délivrance
  rationale: Dans le contexte militaire et national de 1 Maccabées, le terme désigne un secours concret qui libère du danger. « Délivrance » garde cette portée sans réduire le sens à la seule victoire militaire ni l'orienter exclusivement vers le salut spirituel.
- source_word: μεγάλη
  choice: grande
  rationale: L'adjectif intensifie directement « délivrance » ; « grande » en est l'équivalent français naturel et solennel.
- source_word: τῷ Ἰσραήλ
  choice: Israël
  rationale: Le datif désigne ici le bénéficiaire. La construction française « Israël connut » réorganise idiomatiquement la phrase tout en conservant Israël comme désignation collective du peuple.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ce jour-là
  rationale: Cette expression française actuelle restitue précisément la référence temporelle et la valeur démonstrative de ἐκείνῃ.
