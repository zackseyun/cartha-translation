  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: fr
  text: Livre ce camp aux mains de ton peuple, Israël[a], et qu’ils soient couverts de honte à cause de leur puissance et de leur cavalerie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Livre ce camp au pouvoir de ton peuple, Israël. » Le verbe grec signifie plus littéralement « enfermer » ou « confiner »; dans ce contexte, il demande que la force ennemie soit livrée au pouvoir d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en raison de leur puissance et de leur cavalerie »; la préposition grecque peut aussi être comprise dans un sens circonstanciel, « dans leur puissance et leur cavalerie ». Le mot traduit par « puissance » peut désigner plus précisément leur force militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Livre
  rationale: Dans cette prière militaire, le verbe demande à Dieu de mettre le camp ennemi au pouvoir d’Israël. « Livre » exprime naturellement ce sens tout en conservant l’idée fondamentale d’enfermer l’adversaire dans une situation sans issue.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Le nom peut désigner le camp ou la force qui y est rassemblée. « Camp » conserve ici l’image concrète du texte grec.
- source_word: εἰς χεῖρας
  choice: aux mains de
  rationale: Cette expression idiomatique indique le passage sous le pouvoir de quelqu’un. L’expression biblique « aux mains de » reste claire et naturelle en français.
- source_word: λαοῦ σου Ἰσραήλ
  choice: ton peuple, Israël
  rationale: « Israël » est en apposition et identifie le peuple de Dieu; la virgule rend cette relation explicite en français.
- source_word: αἰσχυνθήτωσαν
  choice: qu’ils soient couverts de honte
  rationale: Cette tournure restitue la valeur passive et injonctive du grec, ainsi que la honte publique résultant de la défaite.
- source_word: ἐπὶ τῇ δυνάμει
  choice: malgré leur puissance
  rationale: ἐπί avec le datif admet plusieurs nuances. Dans ce contexte, la demande paraît viser l’humiliation des ennemis en dépit même de la puissance sur laquelle ils comptent; la note préserve les autres lectures possibles.
- source_word: τῇ ἵππῳ αὐτῶν
  choice: leur cavalerie
  rationale: Le singulier collectif ἵππος peut désigner les chevaux ou la force montée. « Cavalerie » convient au contexte militaire et au français moderne.
theological_decisions:
- issue: Prière demandant à Dieu de livrer l’ennemi à Israël
  choice: Livre ce camp aux mains de ton peuple, Israël
  alternative: Enferme ce camp entre les mains de ton peuple, Israël
  rationale: La traduction exprime une demande de victoire accordée par Dieu sans atténuer la violence du cadre narratif. Elle évite toutefois un calque obscur du verbe grec.
- issue: Rapport entre la honte et la puissance ennemie
  choice: malgré leur puissance et leur cavalerie
  alternative: à cause de leur puissance et de leur cavalerie
  rationale: 'La préposition ἐπί est sémantiquement ouverte. « Malgré » donne un sens contextuellement cohérent: les ennemis doivent être humiliés en dépit des moyens militaires dont ils se glorient. Une note signale les lectures causale et circonstancielle afin de ne pas supprimer l’ambiguïté.'
translation_notes:
  register: Français international moderne, digne et accessible. Le verset garde l’impératif de prière, l’idiome des « mains » et le vocabulaire militaire. Les notes rendent visibles le sens concret de σύγκλεισον et l’ambiguïté de ἐπί avec δύναμις.
