review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’aube, l’apparition de Judas dans la plaine, le nombre de trois mille hommes et le manque d’équipement. Toutefois, καθὼς ἠβούλοντο porte sur le fait de disposer de cet équipement « comme ils le souhaitaient », plutôt que sur des objets particuliers « qu’ils auraient voulus ».
  naturalness: « Au point du jour » et « parut » sont recevables, mais « À l’aube » et « apparut » sont plus directs et naturels dans ce récit. La construction proposée clarifie aussi la portée de la dernière proposition.
  terminology: καλύμματα est un terme général désignant des protections/couvertures défensives; « protections » conserve utilement cette généralité. Le singulier μάχαιραν est maintenu par « épée », sans en tirer une conclusion excessive sur le nombre réel d’armes.
