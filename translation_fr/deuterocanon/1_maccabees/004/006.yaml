revisions:
- from: Au point du jour, Judas parut dans la plaine avec trois mille hommes. Cependant, ils n’avaient ni les protections ni l’épée qu’ils auraient voulues.[a]
  to: À l’aube, Judas apparut dans la plaine avec trois mille hommes. Mais ils n’avaient ni protections ni épée, comme ils l’auraient souhaité.
