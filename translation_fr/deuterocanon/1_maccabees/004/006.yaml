    issue: Portée de « qu’ils auraient voulues »
    rationale: Cette formulation peut faire de « protections » et « épée » les objets désirés en tant que tels. Le grec καθὼς ἠβούλοντο exprime plus naturellement qu’ils ne possédaient pas ces éléments dans la mesure ou de la manière qu’ils souhaitaient.
  - severity: low
    issue: Note présentant une alternative plurielle et une explication spéculative
    rationale: La note substitue « épées » au singulier du texte grec et affirme une valeur collective comme probable. Le français peut conserver le singulier sans note, et le contexte ne requiert pas cette hypothèse.
