review_pass:
  verdict: revise
  source_fidelity: La dernière proposition grecque, καὶ ἐφαίνοντο ἐν τῷ ναῷ, présente les lampes comme sujet et les situe « dans le sanctuaire/Temple »; l’imparfait exprime leur rayonnement continu. « Celles-ci éclairèrent le sanctuaire » transforme indûment le complément locatif en objet direct et efface l’aspect imperfectif. La révision rétablit ces deux éléments.
  naturalness: « Ils brûlèrent de l’encens » est plus direct et naturel que « firent brûler de l’encens » sans perdre la précision rituelle. « Celles-ci brillaient dans le sanctuaire » est clair, soutenu et évite que le sujet de « brillaient » soit compris comme les officiants.
  terminology: « Autel », « lampes », « porte-lampes » et « sanctuaire » rendent correctement le vocabulaire cultuel. La note conserve avec justesse « Temple » comme possibilité plus large pour ναός, sans imposer une délimitation architecturale excessive.
  issues:
  - severity: medium
    issue: Le dernier membre est rendu comme si les lampes éclairaient directement le sanctuaire.
    rationale: ἐν τῷ ναῷ est un complément de lieu (« dans le sanctuaire »), non un objet direct. ἐφαίνοντο décrit les lampes qui brillaient ou donnaient de la lumière.
  - severity: low
    issue: L’imparfait ἐφαίνοντο est traduit par le passé simple « éclairèrent ».
    rationale: 'Après les aoristes narratifs « ils brûlèrent » et « ils allumèrent », l’imparfait décrit naturellement l’état ou l’action en cours des lampes : « brillaient ».'
  - severity: low
    issue: « Firent brûler » est une périphrase causative moins directe.
    rationale: Le grec attribue l’action aux mêmes sujets; « brûlèrent de l’encens » est idiomatique et rend directement l’acte cultuel.
  revised_text: Ils brûlèrent de l’encens sur l’autel, allumèrent les lampes qui se trouvaient sur le porte-lampes, et celles-ci brillaient dans le sanctuaire.[a]
  revised_footnotes:
