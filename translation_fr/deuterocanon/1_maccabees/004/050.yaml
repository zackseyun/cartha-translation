  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: fr
  text: Ils brûlèrent de l’encens sur l’autel, allumèrent les lampes qui se trouvaient sur le porte-lampes, et celles-ci brillaient dans le sanctuaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple ». Ici, le mot grec peut désigner plus précisément le sanctuaire, c’est-à-dire la partie sacrée intérieure du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: firent brûler de l’encens
  rationale: Le verbe désigne précisément l’action cultuelle de brûler de l’encens; cette formulation est naturelle en français et évite de confondre l’acte avec un sacrifice générique.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sur l’autel
  rationale: Avec l’accusatif, ἐπί exprime ici le dépôt ou la combustion de l’encens sur la surface de l’autel.
- source_word: ἐξῆψαν
  choice: allumèrent
  rationale: Le verbe signifie mettre en feu ou allumer; « allumèrent » convient naturellement aux lampes.
- source_word: τοὺς λύχνους
  choice: les lampes
  rationale: λύχνος désigne des lampes concrètes plutôt que la lumière de manière abstraite.
- source_word: τῆς λυχνίας
  choice: le porte-lampes
  rationale: λυχνία désigne le support portant les lampes. « Porte-lampes » reste transparent et n’importe pas le terme culturel plus spécifique « menorah ».
- source_word: ἐφαίνοντο
  choice: celles-ci éclairèrent
  rationale: Le sujet implicite demeure les lampes. « Éclairèrent » rend naturellement leur rayonnement visible, tandis que le pronom explicite évite que le sujet soit compris comme les personnes.
- source_word: ἐν τῷ ναῷ
  choice: le sanctuaire
  rationale: Dans ce contexte de mobilier et de rites intérieurs, ναός désigne plus précisément le sanctuaire du Temple que l’ensemble du complexe.
theological_decisions:
- issue: Terminologie cultuelle de la restauration du Temple
  choice: 'Conserver les réalités rituelles concrètes : encens, autel, lampes, porte-lampes et sanctuaire.'
  alternative: Employer un vocabulaire plus général relatif au culte.
  rationale: Le récit décrit des gestes précis accomplis lors du rétablissement du culte; les généraliser effacerait des détails historiques et cultuels du grec.
- issue: Référent du verbe ἐφαίνοντο
  choice: Faire explicitement des lampes le sujet de l’éclairage.
  alternative: Traduire de manière susceptible de faire des officiants le sujet.
  rationale: L’accord et l’enchaînement syntaxique rattachent naturellement le verbe aux lampes; « celles-ci » préserve ce lien en français.
translation_notes:
  register: Français moderne, international et digne. La coordination est légèrement resserrée pour une lecture naturelle; le vocabulaire cultuel concret et la distinction possible entre le Temple au sens large et son sanctuaire sont préservés.
