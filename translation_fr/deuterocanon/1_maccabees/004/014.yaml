  text: And they joined battle[a], and the nations were crushed, and they fled into the plain.
translation:
  language: fr
  text: Ils engagèrent le combat, et les nations[a] furent écrasées et s’enfuirent dans la plaine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs » ; dans ce contexte, « les nations » peut désigner plus précisément les peuples non juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν
  choice: ils engagèrent le combat
  rationale: Dans ce contexte militaire, συνάπτω signifie engager ou livrer bataille. Cette formulation française explicite naturellement le sens martial du verbe.
- source_word: συνετρίβησαν
  choice: furent écrasées
  rationale: Le passif de συντρίβω exprime l’idée d’être brisé ou écrasé. « Furent écrasées » conserve la vigueur de l’image grecque, plutôt que de l’aplanir en « furent vaincues ».
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Le grec dit littéralement « les nations ». Dans 1 Maccabées, l’expression peut désigner plus précisément les peuples non juifs, mais le choix principal conserve la portée du terme source.
- source_word: τὸ πεδίον
  choice: la plaine
  rationale: πεδίον désigne couramment une étendue plane et découverte. « La plaine » est concise, naturelle et adaptée au mouvement de fuite décrit.
