  terminology: « Région montagneuse » rend bien l’ambiguïté de ἐν τῷ ὄρει, explicitée en note. « Tenez tête à » et « combattez-les » conviennent aux deux impératifs. « Avec assurance » est une restitution recevable de μετὰ παρρησίας, dont la note signale des nuances proches.
