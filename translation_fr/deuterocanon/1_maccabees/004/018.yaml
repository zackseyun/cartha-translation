base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: fr
  text: Gorgias et les troupes sont dans la région montagneuse, près de nous[a]. Mais maintenant, tenez tête à nos ennemis et combattez-les. Après cela, prenez les dépouilles avec assurance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la montagne, près de nous ». L’expression grecque peut désigner une montagne précise ou, plus largement, une région montagneuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec hardiesse » ou « sans crainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμις
  choice: troupes
  rationale: Dans ce contexte militaire, le terme désigne les forces armées de Gorgias sans préciser leur taille ni leur organisation.
- source_word: ἐν τῷ ὄρει
  choice: dans la région montagneuse
  rationale: Le singulier grec peut désigner soit une montagne particulière, soit plus largement une zone montagneuse; le texte retient ici le sens géographique collectif tout en signalant l'autre possibilité en note.
- source_word: ἐγγὺς ἡμῶν
  choice: près de nous
  rationale: Rendu spatial direct qui conserve l'idée d'une menace proche.
- source_word: στῆτε ... ἐναντίον
  choice: tenez tête à
  rationale: Cette expression française naturelle rend l'ordre de se dresser résolument contre l'ennemi.
- source_word: πολεμήσατε
  choice: combattez-les
  rationale: Rendu direct et actuel de l'impératif militaire.
- source_word: σκῦλα
  choice: leurs dépouilles
  rationale: Dans un contexte de victoire militaire, le mot désigne les biens pris à l'ennemi; «dépouilles» convient au registre biblique dignifié sans suggérer seulement l'action de piller.
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: Dans ce contexte, l'expression indique que les vainqueurs pourront prendre les dépouilles sans crainte; «avec assurance» préserve la construction nominale et la nuance de confiance.
- source_word: Γοργίας
  choice: Gorgias
  rationale: Transcription française traditionnelle du nom propre grec.
theological_decisions: []
