  text: Strike them down with the sword of those who love you, and let all who know your name praise you with hymns.
translation:
  language: fr
  text: Abats-les avec l’épée de ceux qui t’aiment, et que tous ceux qui connaissent ton nom te louent par des hymnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: Abats
  rationale: Rend directement l’impératif aoriste exprimant la mise à terre ou la défaite, avec la force martiale du contexte.
- source_word: ῥομφαίᾳ ἀγαπώντων σε
  choice: par l’épée de ceux qui t’aiment
  rationale: 'Conserve le rapport génitif du grec et son ambiguïté naturelle : l’épée appartient ou est associée à ceux qui aiment Dieu.'
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: ceux qui connaissent ton nom
  rationale: Traduction formellement proche qui maintient la portée relationnelle et théologique de la connaissance du nom.
- source_word: αἰνεσάτωσάν σε … ἐν ὕμνοις
  choice: te célèbrent par des hymnes
  rationale: « Célébrer » exprime ici la louange adressée à Dieu; « par des hymnes » rend ἐν ὕμνοις dans un français naturel et digne.
theological_decisions:
- issue: Instrument humain de la victoire divine
  choice: par l’épée de ceux qui t’aiment
  alternative: avec l’épée de ceux qui t’aiment
  rationale: « Par » marque naturellement le moyen en français sans déterminer davantage si Dieu agit directement ou par l’intermédiaire de ses fidèles; la tension du grec est préservée.
translation_notes:
  register: Prière au registre solennel mais courant. Tutoiement conservé, conformément aux formes grecques au singulier et au style direct de l’invocation.
