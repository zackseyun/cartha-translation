base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/023.yaml
  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: fr
  text: Judas revint vers le butin du camp et prit beaucoup d’or et d’argent, des étoffes bleu-violet et pourpres, des produits de la mer[a], ainsi que de grandes richesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « des étoffes bleu marine » ou « de la pourpre marine ». Le grec signifie littéralement « ce qui est de la mer », mais le bien précieux ainsi désigné n’est pas certain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: revint
  rationale: Le verbe exprime ici un retour vers le camp après le combat; « revint » est naturel et fidèle au mouvement décrit.
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: prendre le butin du camp
  rationale: σκυλία désigne les biens pris à l’ennemi, et παρεμβολή le camp militaire. Cette formulation française rend naturellement la construction ἐπὶ τὴν σκυλίαν.
- source_word: ἔλαβε
  choice: Il prit
  rationale: La forme grecque est au singulier et a Judas pour sujet. Le singulier est conservé, même si Judas peut agir ici comme chef représentant ses hommes.
- source_word: ὑάκινθον
  choice: des étoffes bleu-violet
  rationale: Le terme désigne une matière ou une étoffe d’une teinte allant du bleu au violet; « bleu-violet » préserve cette gamme chromatique sans la réduire au seul bleu.
- source_word: πορφύραν
  choice: des étoffes pourpres
  rationale: Dans cette liste d’objets précieux, le mot renvoie vraisemblablement à de la pourpre ou à une étoffe teinte en pourpre; le contexte matériel justifie « étoffes ».
- source_word: θαλασσίαν
  choice: des produits de la mer
  rationale: L’adjectif substantivé signifie littéralement « ce qui est de la mer ». Son référent précis demeure incertain; une formulation générale et une note préservent cette incertitude.
- source_word: πλοῦτον μέγαν
  choice: de grandes richesses
  rationale: Cette expression résume l’abondance des biens saisis sans répéter le mot « butin ».
