  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: fr
  text: L’année suivante[a], il rassembla soixante mille hommes choisis et cinq mille cavaliers[b], afin de leur faire la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’année qui venait ». L’expression grecque signifie littéralement « dans l’année qui vient » et désigne ici l’année suivante dans le déroulement du récit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « cinq mille chevaux » ; en contexte militaire, le grec emploie « cheval » comme terme collectif pour désigner les cavaliers ou la cavalerie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: L’année suivante
  rationale: L’expression signifie littéralement « dans l’année qui vient ». Dans la continuité du récit, « l’année suivante » en rend naturellement la valeur temporelle.
- source_word: συνελόχησεν
  choice: il rassembla
  rationale: Le verbe désigne ici le rassemblement ou la mobilisation de troupes. « Rassembla » est clair et n’ajoute pas de précision absente du grec.
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: hommes choisis
  rationale: Cette formulation conserve l’idée d’hommes spécialement sélectionnés sans imposer la nuance plus interprétative de « troupes d’élite ».
- source_word: ἑξήκοντα χιλιάδας
  choice: soixante mille
  rationale: Rendu direct du nombre cardinal grec.
- source_word: πεντακισχιλίαν ἵππον
  choice: cinq mille cavaliers
  rationale: Dans ce contexte militaire, le singulier collectif ἵππον (« cheval ») désigne la cavalerie ou les hommes à cheval. « Cavaliers » est naturel en français et conserve le dénombrement des combattants.
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: afin de leur faire la guerre
  rationale: ὥστε suivi de l’infinitif exprime ici le but visé, et ἐκπολεμέω indique l’action de mener la guerre contre quelqu’un.
