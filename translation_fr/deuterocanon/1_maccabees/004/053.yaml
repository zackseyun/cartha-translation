review_pass:
  verdict: revise
  source_fidelity: 'Le texte restitue fidèlement les éléments grecs : l’offrande sacrificielle (ἀνήνεγκαν θυσίαν), la conformité à la Loi (κατὰ τὸν νόμον), le nouvel autel associé aux holocaustes (τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων τὸ καινόν) et l’antériorité de sa fabrication (ὃ ἐποίησαν). « Construit » est une explicitation contextuellement sûre de ἐποίησαν pour un autel.'
  naturalness: Le français est globalement naturel et d’un registre biblique moderne approprié. Toutefois, dans l’ordre actuel, « conformément à la Loi sur le nouvel autel » peut produire une brève ambiguïté de rattachement, comme si « sur le nouvel autel » précisait « la Loi ». Antéposer le complément de lieu lève cette ambiguïté sans modifier le sens.
  terminology: « Sacrifice », « Loi », « autel » et « holocaustes » conservent avec justesse le registre cultuel explicite du grec. La majuscule à « Loi » est idiomatique dans ce contexte scripturaire. La note doit présenter l’alternative fonctionnelle du génitif sans introduire « destiné à », légèrement plus explicatif que nécessaire.
  issues:
  - severity: low
    issue: Ambiguïté de rattachement dans l’ordre des compléments
    rationale: Dans « conformément à la Loi sur le nouvel autel », le groupe « sur le nouvel autel » suit immédiatement « Loi » et peut momentanément être lu comme le complément de celle-ci. Une réorganisation rend la phrase immédiatement nette.
  - severity: low
    issue: Note alternative légèrement explicative
    rationale: « Destiné aux holocaustes » est acceptable, mais « pour les holocaustes » exprime plus directement l’alternative fonctionnelle du génitif grec sans ajouter l’idée de destination comme explicitation interprétative.
