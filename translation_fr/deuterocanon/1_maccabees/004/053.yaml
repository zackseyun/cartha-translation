  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: fr
  text: Sur le nouvel autel des holocaustes qu’ils avaient construit[a], ils offrirent un sacrifice conformément à la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur le nouvel autel pour les holocaustes qu’ils avaient fait ».'
    reason: 'Alternative lexicale : « pour les holocaustes » rend explicitement la valeur fonctionnelle possible du génitif τῶν ὁλοκαυτωμάτων ; « avaient fait » reflète plus littéralement ἐποίησαν.'
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: offrirent
  rationale: Dans ce contexte cultuel, ἀναφέρω désigne l’action d’offrir un sacrifice. « Offrirent » restitue naturellement ce sens en français.
- source_word: θυσίαν
  choice: un sacrifice
  rationale: θυσία désigne ici le sacrifice offert. L’article indéfini est requis en français courant, tandis que « sacrifice » maintient le vocabulaire cultuel explicite.
- source_word: κατὰ τὸν νόμον
  choice: conformément à la Loi
  rationale: La tournure exprime la conformité aux prescriptions légales. « La Loi », avec une majuscule, indique naturellement dans ce contexte la Loi mosaïque sans ajouter d’explication au texte.
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: autel des holocaustes
  rationale: Le génitif pluriel désigne l’autel destiné aux holocaustes. « Autel des holocaustes » est une formulation française concise, précise et traditionnelle, tout en conservant le pluriel grec.
- source_word: τὸ καινόν
  choice: nouvel
  rationale: καινός qualifie simplement l’autel de nouveau, en contraste avec l’autel antérieur profané.
- source_word: ὃ ἐποίησαν
  choice: qu’ils avaient construit
  rationale: ποιέω signifie littéralement « faire », mais à propos d’un autel l’action concrète est de le construire. Le plus-que-parfait marque clairement que cette construction précède l’offrande.
theological_decisions:
- issue: Terminologie cultuelle du culte au Temple
  choice: Conserver les termes explicites « offrirent un sacrifice » et « autel des holocaustes ».
  alternative: Employer des termes plus généraux comme « présentèrent une offrande » ou simplement « sur l’autel ».
  rationale: Le verset décrit précisément le rétablissement du sacrifice conforme à la Loi. Une formulation générale atténuerait son accent cultuel et légal.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La formulation conserve la précision cultuelle du grec.
