  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: fr
  text: Ils célébrèrent pendant huit jours la dédicace de l’autel. Ils offrirent avec joie des holocaustes et sacrifièrent un sacrifice de salut et de louange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sacrifice de paix et de louange ». Le grec porte littéralement « un sacrifice de salut et de louange »; le terme peut évoquer le salut, la délivrance ou le bien-être.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  choice: ils célébrèrent ... la dédicace
  rationale: Avec ἐγκαινισμός pour complément, ἐποίησαν désigne l’accomplissement solennel de la dédicace; « célébrèrent » est naturel en français et maintient le caractère festif de l’événement.
- source_word: τοῦ θυσιαστηρίου
  choice: de l’autel
  rationale: Équivalent cultuel courant et clair de θυσιαστήριον.
- source_word: ἡμέρας ὀκτώ
  choice: pendant huit jours
  rationale: L’accusatif exprime ici la durée; « pendant » la rend explicitement.
- source_word: προσήνεγκαν ὁλοκαυτώματα
  choice: ils offrirent ... des holocaustes
  rationale: Dans ce contexte sacrificiel, προσφέρω signifie « offrir ». En français biblique, « holocauste » désigne précisément une offrande entièrement consumée par le feu et demeure intelligible.
- source_word: μετʼ εὐφροσύνης
  choice: avec joie
  rationale: Formulation moderne, simple et digne qui exprime l’allégresse accompagnant les offrandes.
- source_word: ἔθυσαν
  choice: sacrifièrent
  rationale: Le verbe conserve l’action sacrificielle explicite et la distingue de l’offrande mentionnée auparavant.
- source_word: θυσίαν σωτηρίου
  choice: un sacrifice de salut
  rationale: Cette traduction suit directement le grec σωτηρίου et préserve sa portée de salut, de délivrance ou de bien-être, sans imposer dans le texte principal une catégorie technique issue de la rétroversion hébraïque.
- source_word: αἰνέσεως
  choice: de louange
  rationale: Le génitif dépend de θυσίαν; « louange » en est l’équivalent direct et naturel.
theological_decisions:
- issue: Valeur cultuelle de θυσίαν σωτηρίου
  choice: un sacrifice de salut
  alternative: un sacrifice de paix; un sacrifice de délivrance
  rationale: '« Salut » rend directement σωτήριον tout en laissant ouverte sa gamme de sens: salut, délivrance et bien-être. Une note signale l’interprétation cultuelle traditionnelle « sacrifice de paix » sans la substituer silencieusement au grec.'
- issue: Maintien du langage sacrificiel
  choice: des holocaustes ... un sacrifice
  alternative: des offrandes entièrement brûlées ... une offrande
  rationale: Le vocabulaire cultuel est conservé afin de respecter le poids religieux de la dédicace, tout en restant usuel dans un registre biblique français moderne.
translation_notes:
  register: Français international moderne, digne et lisible. La première longue coordination grecque est divisée en deux phrases pour une lecture naturelle, sans perte de contenu. Le terme « holocaustes » est maintenu dans son sens sacrificiel biblique précis.
