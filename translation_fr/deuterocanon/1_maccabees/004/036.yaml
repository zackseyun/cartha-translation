  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: fr
  text: 'Judas et ses frères dirent alors : « Voyez, nos ennemis ont été écrasés. Montons purifier le sanctuaire et le dédier[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’inaugurer ». Dans ce contexte de restauration après la profanation du temple, il s’agit d’une dédicace renouvelée.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ Ἰούδας καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Judas et ses frères dirent alors
  rationale: Le singulier grec « dit » a pour sujet composé Judas et ses frères; le pluriel est requis en français. « Alors » rend naturellement le δὲ narratif.
- source_word: Ἰδοὺ
  choice: Voyez
  rationale: Interpellation qui attire l’attention sur la défaite constatée; formulation actuelle et digne.
- source_word: συνετρίβησαν
  choice: ont été écrasés
  rationale: Le passif aoriste de συντρίβω exprime ici une défaite militaire décisive dont le résultat est constaté.
- source_word: ἀναβῶμεν
  choice: Montons
  rationale: Le subjonctif d’exhortation est rendu par l’impératif français à la première personne du pluriel; le mouvement ascendant vers Jérusalem et le sanctuaire est conservé.
- source_word: καθαρίσαι
  choice: purifier
  rationale: Dans ce contexte cultuel, « purifier » exprime mieux l’élimination de la souillure rituelle que le simple nettoyage matériel.
- source_word: τὰ ἅγια
  choice: le sanctuaire
  rationale: Le pluriel neutre désigne ici les lieux saints du temple; « le sanctuaire » en donne le référent contextuel sans lourdeur.
- source_word: ἐγκαινίσαι
  choice: en faire la dédicace
  rationale: Cette formulation rend l’acte d’inaugurer ou de dédier sans introduire explicitement le préfixe « re- », absent du verbe grec, tout en laissant le contexte indiquer qu’il s’agit d’une restauration.
theological_decisions:
- issue: Portée cultuelle de καθαρίσαι τὰ ἅγια
  choice: purifier le sanctuaire
  alternative: nettoyer les lieux saints
  rationale: La scène concerne la suppression de la profanation du temple; « purifier » conserve la dimension rituelle, tandis que « sanctuaire » identifie naturellement le lieu visé.
- issue: Dédicace nouvelle ou renouvelée dans ἐγκαινίσαι
  choice: en faire la dédicace
  alternative: le consacrer de nouveau
  rationale: Le contexte implique une dédicace renouvelée après profanation, mais le verbe grec lui-même peut signifier dédier ou inaugurer. Le texte principal préserve cette latitude et la note explicite le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La montée vers Jérusalem est conservée par « Montons ». Le texte évite aussi bien l’archaïsme que l’ajout interprétatif non marqué.
