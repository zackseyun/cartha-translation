  yaml_path: translation/deuterocanon/1_maccabees/004/051.yaml
  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
translation:
  language: fr
  text: Ils déposèrent des pains sur la table[a], déployèrent les tentures[b] et menèrent à terme tous les travaux qu’ils avaient accomplis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des miches ». Le grec emploie le pluriel ἄρτους.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les voiles » ou « les rideaux » ; le terme désigne souvent les éléments de tissu d’un sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: déposèrent
  rationale: L’aoriste de ἐπιτίθημι signifie ici mettre ou placer sur quelque chose. « Déposèrent » exprime naturellement ce geste cultuel.
- source_word: τὴν τράπεζαν
  choice: la table
  rationale: Le grec dit simplement « la table ». Le contexte permet de reconnaître le mobilier du sanctuaire sans ajouter de précision absente du texte.
- source_word: ἄρτους
  choice: des pains
  rationale: Le pluriel grec désigne des pains ou des miches. « Des pains » en conserve le nombre et convient au contexte cultuel.
- source_word: ἐξεπέτασαν
  choice: déployèrent
  rationale: Le verbe évoque l’action d’étendre ou de déployer. Ce choix convient à la mise en place des tentures du sanctuaire.
- source_word: τὰ καταπετάσματα
  choice: les tentures
  rationale: καταπέτασμα peut désigner un rideau, une tenture ou un voile, notamment dans un sanctuaire. « Tentures » reste clair sans imposer une identification technique précise.
- source_word: ἐτέλεσαν
  choice: achevèrent
  rationale: Le verbe signifie mener à son terme ou terminer. « Achevèrent » rend clairement l’aboutissement des travaux.
- source_word: πάντα τὰ ἔργα ἃ ἐποίησαν
  choice: tous les travaux qu’ils avaient entrepris
  rationale: Le grec est littéralement proche de « tous les travaux qu’ils firent ». En français, cette formulation serait maladroite après « achevèrent » ; « qu’ils avaient entrepris » restitue naturellement l’idée des travaux menés à leur terme, sans préciser leur nature.
theological_decisions:
- issue: Terminologie cultuelle du mobilier et des éléments du sanctuaire
  choice: Employer les termes ordinaires « table », « pains » et « tentures » dans le texte principal.
  alternative: Préciser « table des pains de la Présence » ou traduire καταπετάσματα par « voiles ».
  rationale: Le verset grec n’ajoute aucun qualificatif technique. La traduction évite donc de surdéterminer les objets tout en conservant le cadre cultuel.
- issue: Relation entre ἐτέλεσαν et ἃ ἐποίησαν
  choice: « achevèrent tous les travaux qu’ils avaient entrepris »
  alternative: « achevèrent tous les travaux qu’ils avaient faits »
  rationale: La version littérale produit en français une relation logique peu naturelle, puisque des travaux déjà « faits » n’ont plus à être achevés. « Entrepris » conserve l’idée contextuelle de travaux accomplis jusqu’à leur terme sans introduire de contenu doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La coordination est allégée en français tout en conservant la succession des trois actions du grec.
