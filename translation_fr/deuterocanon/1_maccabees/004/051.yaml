  verdict: revise
  source_fidelity: 'La première partie rend fidèlement les trois actions : ἐπέθηκαν (« déposèrent/placèrent »), ἄρτους (« des pains »), ἐξεπέτασαν (« déployèrent ») et τὰ καταπετάσματα (« les tentures »). En revanche, « qu’ils avaient entrepris » interprète ἐποίησαν (« qu’ils avaient faits/accomplis ») et substitue l’idée de commencement à celle d’exécution. La tournure grecque est quelque peu redondante, mais la traduction ne doit pas la résoudre par une précision contextuelle absente du texte.'
