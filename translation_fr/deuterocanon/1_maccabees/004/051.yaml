  terminology: « Table », « pains » et « tentures » sont des choix justes et non surdéterminés pour le mobilier et les étoffes du sanctuaire. Les notes conservent utilement les alternatives « miches », « voiles » et « rideaux » sans imposer une identification rituelle plus précise.
