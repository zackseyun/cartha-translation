  rationale: La révision remplace l’interprétation « entrepris » par « accomplis », qui rend directement ἐποίησαν. « Menèrent à terme » exprime naturellement ἐτέλεσαν et préserve, sans l’effacer, la relation légèrement redondante du grec entre les travaux accomplis et leur achèvement. Les notes et leurs ancres sont conservées.
