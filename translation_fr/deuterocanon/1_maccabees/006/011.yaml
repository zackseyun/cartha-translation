  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: fr
  text: 'Et je me suis dit en mon cœur : « Dans quelle détresse suis-je tombé, et dans quel grand tourbillon je me trouve maintenant ! Car j’étais bon et aimé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ
  choice: je me suis dit en mon cœur
  rationale: Conserve l’image sémitisante de la réflexion intérieure tout en restant intelligible en français moderne.
- source_word: Ἕως τίνος θλίψεως ἦλθον
  choice: Dans quelle détresse suis-je tombé
  rationale: Ἕως τίνος est compris ici comme une exclamation portant sur l’ampleur ou la nature de la détresse; « tomber dans » rend naturellement l’arrivée dans cet état.
- source_word: κλύδωνος μεγάλου
  choice: grande tempête
  rationale: κλύδων désigne une forte agitation, notamment celle des flots; « tempête » préserve l’image vive et convient métaphoriquement à l’épreuve.
- source_word: χρηστὸς
  choice: bon
  rationale: Le terme peut exprimer la bonté, la bienveillance ou l’amabilité; « bon » en conserve l’étendue sans préciser indûment.
- source_word: ἀγαπώμενος
  choice: aimé
  rationale: Rend directement le participe passif et maintient le contraste avec la situation présente.
theological_decisions:
- issue: Valeur de ὅτι avant χρηστὸς καὶ ἀγαπώμενος ἤμην
  choice: Pourtant
  alternative: car
  rationale: Le contexte exprime vraisemblablement le contraste entre la détresse actuelle et la condition antérieure du locuteur. La particule grecque ὅτι signifie normalement « car/parce que », mais une traduction strictement causale produit ici un lien peu naturel; « pourtant » explicite sobrement la tension contextuelle sans ajout doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve « en mon cœur » pour la couleur biblique et emploie une exclamation afin de rendre la plainte intérieure. Aucun marqueur de note n’est requis.
