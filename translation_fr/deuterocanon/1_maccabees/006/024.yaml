  text: and to follow his commands[a], because those of our people were becoming alienated from us on account of this, except those who were found among us.
translation:
  language: fr
  text: et de suivre ses ordres, car, à cause de cela, ceux de notre peuple s’éloignaient de nous, sauf ceux qui se trouvaient avec nous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière proposition est très condensée en grec. Littéralement, elle se rapproche de « sauf tous ceux qui étaient trouvés d’entre nous » ou « de chez nous ». Elle peut désigner ceux qui se trouvaient avec eux ou ceux qui étaient de leur parti.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθεῖν
  choice: suivre
  rationale: Avec le datif τοῖς προστάγμασιν, le verbe exprime le fait de se conformer à des directives. « Suivre » reste proche du grec tout en étant naturel en français.
- source_word: προστάγμασιν
  choice: ordres
  rationale: Le terme désigne des directives émanant d’une autorité. « Ses ordres » convient au possessif personnel αὐτοῦ et au contexte politique.
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: ceux de notre peuple
  rationale: Cette formulation conserve l’expression grecque elliptique sans ajouter « hommes » ni l’aplanir en « notre peuple ».
- source_word: χάριν τούτου
  choice: à cause de cela
  rationale: La locution exprime explicitement la cause et se rend naturellement ainsi en français moderne.
- source_word: ἠλλοτριοῦντο
  choice: s’éloignaient
  rationale: L’imparfait grec décrit un processus continu de distanciation ou d’aliénation. « S’éloignaient de nous » rend cette évolution relationnelle sans lourdeur.
- source_word: ἀφʼ ἡμῶν
  choice: de nous
  rationale: Dans la première occurrence, ἀπό marque clairement la séparation; « de nous » est la tournure française normale après « s’éloigner ».
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: sauf ceux qui se trouvaient parmi nous
  rationale: πλήν introduit une exception et εὑρίσκοντο signifie littéralement « étaient trouvés » ou, idiomatiquement, « se trouvaient ». La seconde expression ἀφʼ ἡμῶν est inhabituelle; « parmi nous » préserve l’idée d’association sans trancher explicitement entre présence et appartenance au camp.
