base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/025.yaml
  text: They were being put to death[a], and our inheritances were being plundered. And they stretched out their hand not only against us, but also against all their territories.
translation:
  language: fr
  text: Ils étaient mis à mort, et nos héritages étaient pillés. Ils ont étendu la main non seulement contre nous, mais aussi contre tous leurs territoires[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes leurs frontières ». Le terme grec peut désigner des lignes frontalières ou les territoires qu’elles délimitent.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐθανατοῦντο
  choice: étaient mis à mort
  rationale: L’imparfait passif exprime une action passée en cours ou répétée; cette formulation conserve à la fois la voix passive et la gravité du verbe.
- source_word: κληρονομίαι
  choice: héritages
  rationale: Le terme désigne des biens reçus en héritage ou des possessions héréditaires; « héritages » en préserve la dimension familiale et ancestrale.
- source_word: διηρπάζοντο
  choice: étaient pillés
  rationale: Le verbe évoque une prise violente et le pillage; l’imparfait passif grec est également conservé.
- source_word: ἐξέτειναν χεῖρα
  choice: ont porté la main sur
  rationale: Cette expression française naturelle garde l’image corporelle de l’expression grecque tout en exprimant une action hostile.
- source_word: ὅρια
  choice: territoires
  rationale: Le mot peut désigner des frontières ou les territoires qu’elles délimitent; « territoires » convient naturellement avec πάντα et évite de réduire le sens aux seules lignes frontalières.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le pronom grec est rendu sans expliciter son référent, afin de préserver l’ambiguïté possible du texte source.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les deux imparfaits passifs rendent l’action continue ou répétée, tandis que le passé composé traduit l’aoriste de l’action hostile. L’image de la main est conservée sans préciser le référent ambigu de « leurs ».
