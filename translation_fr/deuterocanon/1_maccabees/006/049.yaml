  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: fr
  text: Il conclut un accord avec les gens de Bethsour et sortit de la ville, car ils n’y avaient pas de vivres pour rester enfermés, puisque c’était une année sabbatique pour la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « c’était un sabbat pour la terre », c’est-à-dire l’année sabbatique pendant laquelle on laissait la terre en repos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: Il conclut un accord avec les gens de Bethsour
  rationale: Dans ce récit de siège, l’expression idiomatique indique qu’il conclut des conditions ou un accord avec les habitants de Bethsour.
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: qui sortirent de la ville
  rationale: Le singulier grec peut renvoyer collectivement au groupe de Bethsour; le pluriel français rend clairement le sujet logique sans ajouter l’idée d’une capitulation.
- source_word: διατροφή
  choice: de quoi subsister
  rationale: Le terme désigne les moyens de nourriture ou d’entretien; cette formulation naturelle convient à la pénurie provoquée par le siège.
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: s’ils y restaient enfermés
  rationale: La tournure exprime la situation prolongée d’habitants confinés dans la ville; la formulation française explicite naturellement le rapport avec le manque de vivres.
- source_word: σάββατον ἦν τῇ γῇ
  choice: c’était une année de repos sabbatique pour la terre
  rationale: Le contexte désigne l’année sabbatique durant laquelle la terre restait en repos; le mot « année » évite une confusion avec le sabbat hebdomadaire.
theological_decisions:
- issue: Sens de σάββατον ἦν τῇ γῇ
  choice: une année de repos sabbatique pour la terre
  alternative: c’était un sabbat pour la terre
  rationale: Le contexte de pénurie et la législation sur le repos de la terre indiquent vraisemblablement l’année sabbatique. La note conserve toutefois la forme littérale et la métaphore du texte grec.
translation_notes:
  register: Français international moderne, narratif et digne. « Bethsour » suit une forme française courante du toponyme. La causalité répétée du grec est allégée par deux-points et « en effet », tout en conservant les deux motifs énoncés.
