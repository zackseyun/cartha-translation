  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: fr
  text: Quand le roi l’apprit, il se mit en colère. Il rassembla tous ses Amis, les chefs de son armée et les responsables de la cavalerie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui étaient préposés aux rênes » ; il pourrait s’agir des chefs de la cavalerie ou des chars.'
    reason: Préserve l’image concrète et l’incertitude du grec, que la formulation courante du texte principal doit expliciter pour être intelligible.
lexical_decisions:
- source_word: ὠργίσθη
  choice: il entra dans une grande colère
  rationale: Exprime naturellement en français l’intensité de la réaction du roi sans ajouter de motif.
- source_word: τοὺς φίλους αὐτοῦ
  choice: ses Amis
  rationale: La majuscule signale qu’il s’agit ici du titre officiel des proches conseillers et dignitaires royaux, et non simplement d’amis personnels.
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: les chefs de son armée
  rationale: δύναμις désigne ici les forces militaires du roi; cette formulation est claire et idiomatique.
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: les responsables de la cavalerie
  rationale: L’expression signifie littéralement «ceux qui sont préposés aux rênes»; dans ce contexte militaire, elle désigne vraisemblablement des responsables des troupes montées ou des chars, mais son référent précis demeure incertain.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. «Amis» reçoit une majuscule comme titre de cour. La seconde phrase évite une coordination trop lourde tout en conservant la progression du grec.
