base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: fr
  text: 'Ils se hâtaient et insistaient pour partir. Alors il dit au roi, aux chefs de l’armée et aux hommes : « Nous nous affaiblissons de jour en jour[a], la nourriture se fait rare, le lieu où nous campons est fortifié, et les affaires du royaume nous pressent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nous nous épuisons de jour en jour » ou « Nous diminuons de jour en jour » ; le verbe grec peut évoquer l’affaiblissement, l’épuisement ou la diminution des effectifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: Ils se hâtaient et insistaient
  rationale: Les deux imparfaits expriment une action persistante et pressante. La coordination française conserve à la fois l’empressement et l’insistance sans les fondre en une seule idée.
- source_word: τοῦ ἀπελθεῖν
  choice: pour partir
  rationale: Dans ce contexte militaire, « partir » est naturel et traduit sobrement l’idée de quitter les lieux, sans préciser davantage la nature du départ.
- source_word: Ἐκλείπομεν
  choice: Nous nous affaiblissons
  rationale: Le verbe peut évoquer l’épuisement, le déclin ou la diminution. Cette formulation française garde une portée assez large et convient à la détérioration progressive de la situation.
- source_word: καθʼ ἡμέραν
  choice: de jour en jour
  rationale: Expression française idiomatique qui rend la progression quotidienne suggérée par le grec.
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: la nourriture se fait rare
  rationale: Formulation naturelle qui communique la faiblesse croissante des réserves alimentaires sans transformer explicitement τροφή en provisions militaires.
- source_word: ὁ τόπος, οὗ παρεμβάλλομεν
  choice: le lieu où nous campons
  rationale: Le présent grec décrit la situation actuelle du campement militaire; la traduction reste directe et compréhensible.
- source_word: ὀχυρός
  choice: fortifié
  rationale: L’adjectif désigne un lieu fort ou défendable. « Fortifié » rend clairement la nuance militaire dans un français courant.
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: les affaires du royaume nous pressent
  rationale: La formulation conserve l’image d’un poids ou d’une urgence qui s’impose, tout en rendant l’expression idiomatique τὰ τῆς βασιλείας par « les affaires du royaume ».
