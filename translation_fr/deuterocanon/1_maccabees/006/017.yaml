  yaml_path: translation/deuterocanon/1_maccabees/006/017.yaml
  text: And Lysias learned that the king had died[a], and he installed Antiochus his son to reign in his place, whom he had reared from youth, and
translation:
  language: fr
  text: Lysias apprit que le roi était mort, et il établit Antiochos, le fils de celui-ci, comme roi à sa place, lui qu’il avait élevé depuis sa jeunesse, et[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte grec fourni, le verset se termine par « et », ce qui indique que la phrase se poursuit au verset suivant.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπέγνω
  choice: apprit
  rationale: L’aoriste exprime ici le fait que Lysias reçut ou acquit cette information; « apprit » est naturel et précis dans un récit.
- source_word: τέθνηκεν
  choice: était mort
  rationale: Le parfait présente la mort comme accomplie, avec un état qui demeure. Après « apprit », « était mort » rend naturellement ce rapport temporel en français.
- source_word: κατέστησεν βασιλεύειν
  choice: établit … comme roi
  rationale: La construction indique que Lysias plaça Antiochos dans la fonction royale. Cette formulation est plus naturelle que « établit pour régner » tout en conservant l’idée d’une accession organisée.
- source_word: Ἀντίοχον τὸν υἱὸν αὐτοῦ
  choice: Antiochos, le fils du roi
  rationale: Dans le contexte, αὐτοῦ renvoie au roi défunt. Répéter « du roi » évite que le possessif français « son » fasse à tort comprendre qu’Antiochos était le fils de Lysias.
- source_word: ἀντʼ αὐτοῦ
  choice: à sa place
  rationale: L’expression marque la succession d’Antiochos au roi défunt; « à sa place » en donne un équivalent français idiomatique.
- source_word: ἐξέθρεψεν
  choice: avait élevé
  rationale: Le verbe désigne l’éducation et l’entretien d’un enfant jusqu’à ce qu’il grandisse. Le plus-que-parfait situe cette action avant l’établissement d’Antiochos comme roi.
- source_word: νεώτερον
  choice: depuis son jeune âge
  rationale: L’accusatif employé adverbialement évoque Antiochos dans sa jeunesse, sans préciser qu’il s’agissait nécessairement de la petite enfance.
