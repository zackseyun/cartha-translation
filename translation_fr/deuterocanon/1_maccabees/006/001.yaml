base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/001.yaml
  text: And King Antiochus was traveling through the upper regions[a], and he heard that in Elymais, in Persia, there was a city renowned for wealth, silver, and gold;
translation:
  language: fr
  text: Le roi Antiochos parcourait les régions supérieures et apprit qu’en Élymaïde, dans la Perse[a], se trouvait une ville renommée pour ses richesses, son argent et son or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la Perside », région ou province perse. Le terme grec peut avoir un sens géographique plus précis que « la Perse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: parcourait
  rationale: L’imparfait grec présente un déplacement en cours à travers plusieurs territoires ; « parcourait » en rend naturellement l’aspect duratif.
- source_word: τὰς ἐπάνω χώρας
  choice: les régions supérieures
  rationale: Cette formulation conserve l’indication spatiale littérale sans trancher entre des régions situées en altitude, à l’intérieur des terres ou plus à l’est.
- source_word: Ἐλυμαΐς
  choice: Élymaïde
  rationale: « Élymaïde » est la forme française traditionnelle du nom géographique grec.
- source_word: ἐν τῇ Περσίδι
  choice: dans la Perse
  rationale: « La Perse » est immédiatement compréhensible en français ; le nom grec peut toutefois désigner plus précisément la Perside, région ou province perse.
- source_word: πόλις ἔνδοξος
  choice: une ville renommée
  rationale: ἔνδοξος exprime ici la notoriété ou l’illustration de la ville, sans nécessairement lui attribuer une gloire morale.
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: pour ses richesses, son argent et son or
  rationale: Les datifs indiquent ce qui faisait la renommée de la ville. Les possessifs donnent une tournure française naturelle tout en conservant l’énumération cumulative.
