  text: And they showed the elephants the blood of grapes and mulberries[a], to provoke them for battle.
translation:
  language: fr
  text: Ils montrèrent aux éléphants du sang de raisin et de mûres[a], afin de les exciter au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « du sang de raisin et de mûres » : une image frappante pour désigner leur jus rouge.'
    reason: La note explicite la métaphore concrète du texte grec sans la remplacer dans le corps du verset.
lexical_decisions:
- source_word: ἔδειξαν
  choice: montrèrent
  rationale: Le verbe narratif à l’aoriste signifie simplement « montrer » ou « présenter » ; « montrèrent » respecte directement la construction avec le datif « aux éléphants ».
- source_word: τοῖς ἐλέφασιν
  choice: aux éléphants
  rationale: Le datif pluriel désigne les destinataires de ce qui est montré.
- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: du sang de raisin et de mûres
  rationale: Cette traduction conserve l’image frappante du grec, où le jus rouge des fruits est appelé « sang ». Le singulier σταφυλῆς a ici une valeur collective, naturellement rendue par « raisin » en français, tandis que μόρων désigne des mûres.
- source_word: τοῦ παραστῆσαι
  choice: afin de les exciter
  rationale: L’infinitif articulé au génitif exprime le but. Dans ce contexte militaire, παραστῆσαι évoque l’action de stimuler ou de pousser les éléphants à prendre part au combat.
- source_word: εἰς τὸν πόλεμον
  choice: au combat
  rationale: Dans ce contexte précis, « au combat » rend naturellement la destination ou la mise en condition exprimée par εἰς, sans élargir indûment le sens à toute une guerre.
