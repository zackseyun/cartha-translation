  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
translation:
  language: fr
  text: Ils démolirent l’abomination qu’il avait construite sur l’autel à Jérusalem[a]. Comme auparavant, ils entourèrent le sanctuaire de hautes murailles, ainsi que Bethsoura, sa ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’objet abominable ». Le grec emploie un terme à forte connotation cultuelle pour désigner quelque chose d’odieux dans le cadre du culte.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque « Bethsoura, sa ville » est très condensée. Dans le contexte, « sa » renvoie probablement à Judas ; on peut aussi comprendre qu’il s’agit plus généralement d’une ville placée sous son autorité.
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: ils démolirent
  rationale: L’aoriste de καθαιρέω exprime ici la destruction matérielle d’une construction ou installation. « Démolirent » est naturel en français et conserve la force du verbe.
- source_word: τὸ βδέλυγμα
  choice: l’abomination
  rationale: βδέλυγμα désigne une chose tenue pour abominable, avec ici une forte connotation cultuelle. « L’abomination » maintient cette résonance sans ajouter « de la désolation », expression absente du verset.
- source_word: ᾠκοδόμησεν
  choice: avait construite
  rationale: Le verbe signifie littéralement « construire ». Le plus-que-parfait convient au récit rapporté et l’accord au féminin reprend « l’abomination ».
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ ἐν Ἰερουσαλήμ
  choice: sur l’autel à Jérusalem
  rationale: ἐπί avec l’accusatif indique ici que la construction se trouvait sur l’autel. La formulation française rattache naturellement « à Jérusalem » à l’autel.
- source_word: τὸ ἁγίασμα
  choice: le sanctuaire
  rationale: Dans ce contexte lié au temple, ἁγίασμα désigne le lieu ou l’espace sacré. « Sanctuaire » est idiomatique, précis et accessible.
- source_word: καθὼς τὸ πρότερον
  choice: comme auparavant
  rationale: La locution évoque le rétablissement d’un état antérieur. « Comme auparavant » en conserve clairement le sens.
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: ils entourèrent … de hautes murailles
  rationale: Le verbe signifie « entourer, encercler » et le datif indique le moyen. Cette traduction reste proche du grec sans expliciter davantage par « fortifièrent ».
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: ainsi que Bethsoura, sa ville
  rationale: Bethsoura est un second complément du verbe « entourèrent ». La formulation conserve le possessif αὐτοῦ et la concision inhabituelle du grec, tout en signalant l’ajout par « ainsi que ».
theological_decisions:
- issue: Valeur cultuelle de βδέλυγμα
  choice: l’abomination
  alternative: l’objet abominable ; la chose détestable
  rationale: Le substantif possède une portée cultuelle marquée dans les Écritures juives et dans ce contexte de profanation du culte. La traduction retenue préserve cette force sans importer la formule plus développée « abomination de la désolation », qui ne figure pas ici.
- issue: Référent du possessif αὐτοῦ dans « Bethsoura, sa ville »
  choice: conserver « sa ville » sans identifier explicitement le possesseur
  alternative: Bethsoura, la ville sous son autorité
  rationale: Dans le contexte narratif, le possessif renvoie probablement à Judas, mais la syntaxe grecque reste condensée. Le texte principal garde donc l’ambiguïté, avec une précision en note.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe a été légèrement segmentée en deux phrases pour la lisibilité, sans modifier les rapports logiques du grec. Les termes cultuels « autel » et « sanctuaire » sont conservés, et les ambiguïtés réelles sont signalées plutôt que résolues dans le corps du texte.
