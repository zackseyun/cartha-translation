  yaml_path: translation/deuterocanon/1_maccabees/006/032.yaml
  text: And Judas moved away from the citadel and encamped at Beth-zachariah[a], opposite the king’s camp.
translation:
  language: fr
  text: Judas partit de la Citadelle[a] et établit son camp à Beth-Zacharie, en face du camp du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Acra », la citadelle fortifiée de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partit
  rationale: Le verbe indique ici le départ d’un lieu, sans préciser qu’il s’agit d’une retraite militaire.
- source_word: τῆς ἄκρας
  choice: de la Citadelle
  rationale: Dans 1 Maccabées, le terme désigne vraisemblablement la forteresse de Jérusalem appelée l’Acra. La majuscule signale cette référence déterminée tout en gardant un terme français intelligible.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Le verbe militaire signifie dresser ou établir un camp; cette formulation est naturelle en français actuel et fait écho au camp du roi.
- source_word: εἰς Βεθζαχαριά
  choice: à Beth-Zacharie
  rationale: Avec le verbe d’installation du camp, « à » exprime naturellement la destination et le lieu. Le toponyme est francisé selon l’usage biblique français.
- source_word: ἀπέναντι
  choice: en face de
  rationale: Cette expression rend clairement la position opposée des deux camps sans suggérer davantage que le grec.
- source_word: παρεμβολῆς
  choice: camp
  rationale: Le nom désigne ici un campement militaire; « camp » est précis et courant.
- source_word: τοῦ βασιλέως
  choice: du roi
  rationale: Le complément du nom restitue simplement et naturellement le génitif grec.
