  text: And Judas and his camp advanced into battle formation, and six thousand men from the king’s camp fell.
translation:
  language: fr
  text: Judas et son camp s’avancèrent en ordre de bataille, et six mille hommes du camp du roi tombèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισεν
  choice: s’avancèrent
  rationale: Le verbe signifie littéralement « s’approcher ». Dans ce contexte militaire, avec εἰς παράταξιν, « s’avancèrent » exprime naturellement le mouvement vers l’affrontement. Le singulier grec porte sur un sujet composé, tandis que le français courant appelle ici le pluriel.
- source_word: παρεμβολὴ
  choice: camp
  rationale: παρεμβολή désigne couramment un campement militaire et, par métonymie, les forces qui y sont rassemblées. « Camp » convient aux deux occurrences et préserve cette souplesse.
- source_word: εἰς παράταξιν
  choice: en ordre de bataille
  rationale: παράταξις évoque la disposition des troupes pour le combat. L’expression française « en ordre de bataille » restitue précisément cette nuance militaire.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Le grec emploie le verbe « tomber », idiome militaire qui implique la mort au combat sans l’expliciter davantage. La traduction conserve cette formulation.
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: six mille hommes
  rationale: La formulation rend directement le nombre et le substantif grecs. Le contexte identifie ces hommes comme des combattants, sans qu’il soit nécessaire de remplacer « hommes » par « soldats ».
