base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: fr
  text: « Voici, je meurs dans une profonde affliction, en terre étrangère. »[a] Puis il appela Philippe, l’un de ses amis,[b] et l’établit à la tête de tout son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici, je dépéris dans une grande douleur, en terre étrangère. » Le verbe grec peut exprimer le fait de périr ou de mourir, et le nom traduit par « affliction » peut aussi signifier « douleur », « tristesse » ou « détresse ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « l’un de ses amis » peut aussi désigner un membre de l’entourage royal ou un courtisan, plutôt qu’un simple ami personnel.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Marqueur discursif vif et digne, naturel en français biblique moderne, qui attire l’attention sur les paroles du roi sans l’archaïsme de « voici que ».
- source_word: ἀπόλλυμαι
  choice: je meurs
  rationale: Dans le contexte des dernières paroles du roi, le verbe désigne naturellement sa mort imminente. La note conserve la nuance plus large de dépérissement ou de perdition.
- source_word: λύπῃ μεγάλῃ
  choice: dans une profonde affliction
  rationale: Cette formulation rend la grande intensité de λύπη et convient à la fois à la douleur morale et à la détresse, sans réduire le terme à une seule émotion.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: en terre étrangère
  rationale: Expression française concise et idiomatique qui préserve l’idée d’éloignement du pays propre.
- source_word: ἐκάλεσεν
  choice: il appela
  rationale: Rend directement le verbe grec sans préciser indûment les modalités de la convocation.
- source_word: Φίλιππον
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom grec.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: l’un de ses amis
  rationale: Conserve le sens lexical premier de φίλος, tandis qu’une note signale son possible emploi comme titre de cour.
- source_word: κατέστησεν
  choice: l’établit
  rationale: Exprime une désignation officielle à une fonction d’autorité tout en restant proche du sens de mise en place du grec.
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: à la tête de tout son royaume
  rationale: Formulation française naturelle exprimant l’autorité sur l’ensemble du royaume.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le discours direct est délimité pour clarifier que la première phrase appartient aux paroles du roi dans le contexte immédiat. « Puis » rend naturellement la progression narrative portée par καί. Les notes préservent l’étendue sémantique de ἀπόλλυμαι et λύπη ainsi que la possible valeur institutionnelle de φίλος.
