  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: fr
  text: Il lui donna le nom d’Eupator. Les gens de la citadelle encerclaient Israël autour du sanctuaire[a] ; ils cherchaient constamment à lui nuire et servaient d’appui aux nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « autour des choses ou des lieux saints » ; l’expression désigne probablement le sanctuaire et son enceinte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux non-Juifs ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: Il lui donna le nom
  rationale: Cette tournure française naturelle rend l’expression grecque qui désigne l’attribution d’un nom, sans conserver le calque « il appela son nom ».
- source_word: Εὐπάτωρ
  choice: Eupator
  rationale: Le nom ou titre grec est translittéré sous sa forme française usuelle.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: Les gens de la citadelle
  rationale: ἄκρα désigne ici la citadelle fortifiée de Jérusalem. « Les gens » exprime l’appartenance à ce groupe sans préciser leur sexe au-delà de ce que dit le grec.
- source_word: συγκλείοντες
  choice: tenaient … assiégé
  rationale: Le participe évoque le fait d’enfermer ou de cerner. Avec κύκλῳ, « tenaient … assiégé autour » restitue l’encerclement hostile dans un français lisible.
- source_word: τὸν Ἰσραὴλ
  choice: Israël
  rationale: Le collectif singulier du grec est conservé plutôt que remplacé par « les Israélites ».
- source_word: κύκλῳ τῶν ἁγίων
  choice: autour du sanctuaire
  rationale: Dans le contexte, le pluriel substantivé τὰ ἅγια renvoie vraisemblablement au sanctuaire ou à son enceinte sacrée. La note préserve la portée littérale plus large.
- source_word: ζητοῦντες κακὰ
  choice: cherchaient … à lui nuire
  rationale: Cette formulation idiomatique exprime l’intention hostile de « rechercher des maux » tout en explicitant que le tort visait Israël, d’après le contexte syntaxique.
- source_word: διʼ ὅλου
  choice: constamment
  rationale: L’expression idiomatique marque la continuité ou la répétition persistante.
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: servaient d’appui aux nations
  rationale: στήριγμα désigne un appui ou un soutien, et le datif indique les bénéficiaires. « Nations » garde la valeur ethnique et politique générale de ἔθνη.
theological_decisions:
- issue: Sens de ἔθνεσιν
  choice: nations
  alternative: non-Juifs
  rationale: Le contexte est principalement ethnique et politique. « Nations » conserve la largeur du terme grec sans imposer une opposition théologique plus technique entre Juifs et non-Juifs.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est préservé, avec un point-virgule pour relier les actions continues des gens de la citadelle. Les marqueurs de notes sont placés sur les expressions auxquelles les variantes se rapportent.
