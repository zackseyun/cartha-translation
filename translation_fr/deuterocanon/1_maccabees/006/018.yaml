  rationale: La seule correction nécessaire remplace une expression française ambiguë et excessivement militaire par « encerclaient », qui correspond plus précisément au participe συγκλείοντες et s’accorde naturellement avec « autour du sanctuaire ». Les notes et leurs ancrages restent correctement associés aux expressions concernées.
