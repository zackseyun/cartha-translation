  yaml_path: translation/deuterocanon/1_maccabees/006/021.yaml
  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: fr
  text: Ils sortirent de là[a], de leur enfermement, et quelques impies d’Israël se joignirent à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’état de siège » ou « de l’endroit où ils étaient enfermés » ; le terme grec souligne le fait d’être enfermé ou encerclé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Ils sortirent
  rationale: Rend directement l’aoriste de ἐξέρχομαι et le mouvement hors d’un lieu, dans un français naturel.
- source_word: ἐξ αὐτοῦ
  choice: de là
  rationale: L’antécédent du pronom grec est implicite. « De là » conserve cette indétermination tout en évitant le peu naturel « de cela ».
- source_word: συγκλεισμοῦ
  choice: enfermement
  rationale: Le nom exprime le fait d’être enfermé ou encerclé. « Enfermement » en garde le sens central sans imposer dans le texte la nuance militaire plus précise de « siège ».
- source_word: ἐκολλήθησαν
  choice: se joignirent
  rationale: Le verbe exprime ici l’attachement ou le ralliement à un groupe; « se joignirent » convient naturellement au contexte collectif.
- source_word: τινες
  choice: quelques
  rationale: Restitue simplement l’indéfini pluriel sans ajouter un substantif absent du grec.
- source_word: ἀσεβῶν
  choice: impies
  rationale: « Impies » conserve la portée religieuse et morale de ἀσεβής plus précisément que le terme général « méchants ».
- source_word: ἐξ Ἰσραήλ
  choice: d’Israël
  rationale: Indique que ces personnes sont issues du peuple d’Israël, conformément à la formulation grecque.
theological_decisions:
- issue: Caractérisation religieuse et morale de ἀσεβῶν
  choice: impies
  alternative: méchants; irréligieux; sans foi
  rationale: Le mot grec désigne le manque de respect envers Dieu ou la piété, et non la seule méchanceté générale. « Impies » préserve cette dimension sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « de là, de leur enfermement » maintient le redoublement des deux constructions grecques avec ἐξ, tandis que la note signale la possible nuance militaire.
