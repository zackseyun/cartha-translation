  yaml_path: translation/deuterocanon/1_maccabees/006/063.yaml
  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: fr
  text: Il partit en toute hâte et retourna à Antioche. Il y trouva Philippe qui contrôlait la ville, lui fit la guerre et s’empara de la ville par la force.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partit
  rationale: L’aoriste marque le départ du lieu où il se trouvait. « Partit » est naturel en français et n’ajoute aucune précision absente du grec.
- source_word: κατὰ σπουδήν
  choice: en toute hâte
  rationale: Cette locution exprime à la fois la rapidité et l’urgence; « en toute hâte » en conserve la vigueur narrative.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: retourna à Antioche
  rationale: Avec εἰς, le verbe indique ici un retour vers Antioche. Cette formulation est claire et idiomatique.
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: il trouva Philippe maître de la ville
  rationale: κυριεύω désigne l’exercice de la maîtrise ou de l’autorité. « Maître de la ville » rend cette domination effective sans préciser indûment un titre royal ou une fonction administrative.
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: il lui fit la guerre
  rationale: πολεμέω désigne une action de guerre, et la tournure française convient au contexte militaire tout en gardant Philippe comme adversaire explicite par le pronom.
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: s’empara de la ville par la force
  rationale: καταλαμβάνω signifie ici prendre ou s’emparer, tandis que βίᾳ précise le recours à la force. La traduction conserve les deux éléments.
