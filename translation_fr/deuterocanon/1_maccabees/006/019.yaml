  text: And Judas decided to root them out[a], and he assembled all the people to besiege them.
translation:
  language: fr
  text: Judas décida de les déloger et convoqua tout le peuple pour les assiéger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’asseoir autour d’eux » ; dans ce contexte militaire, l’expression signifie les assiéger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίσατο
  choice: décida
  rationale: Le moyen de λογίζομαι exprime ici une décision mûrement réfléchie plutôt qu’un simple calcul mental.
- source_word: ἐξᾶραι
  choice: les déloger
  rationale: Le verbe exprime l’idée de les enlever de force ou de les chasser de leur position. « Déloger » rend cette action hostile sans préciser, au-delà du grec, qu’il s’agirait nécessairement de les exterminer.
- source_word: ἐξεκκλησίασεν
  choice: convoqua
  rationale: Le verbe signifie appeler une assemblée ou réunir des personnes. « Convoqua » convient naturellement avec « tout le peuple ».
- source_word: πάντα τὸν λαόν
  choice: tout le peuple
  rationale: Cette traduction suit directement le grec. Le contexte peut viser les hommes mobilisables, mais le texte dit bien « peuple » et non « armée ».
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: pour les assiéger
  rationale: L’infinitif articulé indique ici le but de la convocation. L’expression signifie littéralement s’installer autour d’eux et, en contexte militaire, leur mettre le siège.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Déloger » conserve l’idée d’une éviction forcée sans durcir le sens jusqu’à « exterminer » ; « assiéger » restitue naturellement l’expression militaire grecque.
