  text: And the proposal pleased the king and the rulers[a], and he sent to them to make peace[c][b], and they accepted.
translation:
  language: fr
  text: La proposition plut au roi et aux dirigeants[a]. Il envoya vers eux pour faire la paix[b], et ils acceptèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La parole » ou « L’affaire plut au roi et aux dirigeants. » Le grec λόγος peut désigner les paroles prononcées, la proposition ou l’affaire en discussion.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Il envoya vers eux pour faire la paix. » Le grec ne précise pas s’il envoya des messagers ou un message.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire qu’ils acceptèrent la démarche de paix ou les conditions proposées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν
  choice: plut
  rationale: L’aoriste de ἀρέσκω indique que la proposition reçut l’approbation du roi et des dirigeants. « Plut » est naturel, concis et fidèle.
- source_word: ὁ λόγος
  choice: la proposition
  rationale: Dans ce contexte diplomatique, λόγος désigne vraisemblablement ce qui vient d’être proposé plutôt qu’une simple « parole ». « La proposition » restitue clairement ce sens contextuel.
- source_word: ἐναντίον
  choice: au roi et aux dirigeants
  rationale: Avec ἤρεσεν, la tournure signifie idiomatiquement que la chose plut au roi et aux dirigeants; traduire littéralement « devant » serait peu naturel en français.
- source_word: ἀρχόντων
  choice: dirigeants
  rationale: ἄρχοντες désigne ici les personnes qui exercent l’autorité auprès du roi, sans préciser leur charge. « Dirigeants » évite de surdéterminer leur titre.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: il leur envoya
  rationale: Le grec ne précise pas explicitement ce qui fut envoyé. La formulation française doit toutefois fournir un complément naturel, explicité par l’infinitif de but qui suit.
- source_word: εἰρηνεῦσαι
  choice: une offre de paix
  rationale: Littéralement, le roi « envoya vers eux pour faire la paix ». « Une offre de paix » exprime naturellement la démarche diplomatique sans supposer un traité déjà conclu.
- source_word: ἐπεδέξαντο
  choice: ils l’acceptèrent
  rationale: Le verbe signifie recevoir favorablement ou accepter. Le pronom renvoie naturellement à l’offre de paix, objet implicite dans le grec.
