  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
translation:
  language: fr
  text: Il se glissa sous l’éléphant et le frappa par-dessous[a], puis le tua. L’éléphant tomba à terre sur lui, et il mourut là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le poignarda par-dessous ». L’expression grecque est quelque peu idiomatique dans ce contexte; le texte indique clairement une attaque portée depuis le dessous, sans en préciser explicitement la manière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: se glissa
  rationale: Le verbe évoque une entrée furtive ou serrée. « Se glissa » rend avec naturel le mouvement volontaire sous l’animal.
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: sous l’éléphant
  rationale: Cette formulation spatiale simple et concrète correspond directement au grec.
- source_word: ὑπέθηκεν αὐτῷ
  choice: le frappa par-dessous
  rationale: L’expression est idiomatique et difficile; dans le contexte, elle désigne une attaque portée depuis le dessous. Cette traduction conserve la direction du coup sans préciser une arme que la proposition grecque ne nomme pas.
- source_word: ἀνεῖλεν αὐτόν
  choice: puis le tua
  rationale: Le verbe signifie ici tuer ou abattre. « Tua » est direct, moderne et dépourvu d’archaïsme; « puis » explicite naturellement la succession immédiate sans modifier le rapport des actions.
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: L’éléphant tomba à terre sur lui
  rationale: Le nom est repris afin d’éviter l’ambiguïté que produiraient en français deux pronoms masculins successifs. La formulation conserve à la fois la chute au sol et le fait que l’animal tombe sur l’homme.
- source_word: ἀπέθανεν ἐκεῖ
  choice: il mourut là
  rationale: Traduction sobre et proche du grec, sans ajouter l’insistance de « sur-le-champ ».
