    rationale: στήσωμεν αὐτοῖς τοῦ πορεύεσθαι décrit l’établissement d’une disposition ou permission leur permettant de vivre selon leurs lois; « accordons-leur » rend cette portée sans substantiver explicitement un droit.
  - severity: low
