  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : il s’agit de rétablir une politique permettant au peuple de se conformer à ses lois, et la cause de sa colère est correctement liée à la suppression ou au démantèlement de ces lois. Toutefois, « donc » n’est pas exprimé par καί et « le droit » explicite de manière un peu trop juridique ce que le grec formule plus largement comme une disposition à établir en leur faveur.'
  naturalness: Le français est globalement clair et moderne. « Accordons-leur de vivre selon leurs lois » est plus idiomatique que « Établissons pour eux le droit de vivre », tout en conservant la portée politique de la proposition. La suppression de la virgule avant la relative restrictive améliore aussi la syntaxe française.
  terminology: « Lois » convient pour νομίμοις dans ce contexte. « Vivre selon » rend naturellement le sens idiomatique de πορεύεσθαι. « Supprimées » est une interprétation contextuelle acceptable de διεσκεδάσαμεν, et la note conserve utilement la nuance plus littérale de dispersion ou de désorganisation.
