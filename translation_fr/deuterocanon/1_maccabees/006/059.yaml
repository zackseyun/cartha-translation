translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement explicitée par « le droit de » afin d’éviter le calque peu naturel « établir pour eux de vivre », tout en conservant l’idée d’une disposition officielle. Les deux phrases françaises suivent la ponctuation logique du grec.
