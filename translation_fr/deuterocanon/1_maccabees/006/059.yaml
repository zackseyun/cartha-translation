  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: fr
  text: Accordons-leur de vivre selon leurs lois[a], comme auparavant. Car c’est à cause de leurs lois que nous avons supprimées[b] qu’ils se sont mis en colère et ont fait tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller » ou « marcher selon leurs lois » ; cette expression signifie régler sa conduite sur elles.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie littéralement « disperser » ou « désorganiser » ; ici, il évoque la suppression ou le démantèlement de leurs pratiques légales.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: Établissons donc pour eux le droit
  rationale: Le subjonctif aoriste a une valeur exhortative (« établissons »). L’ajout de « le droit » explicite naturellement en français la construction grecque στήσωμεν αὐτοῖς τοῦ πορεύεσθαι, qui instaure concrètement une autorisation ou une disposition en leur faveur.
- source_word: τοῦ πορεύεσθαι
  choice: de vivre selon
  rationale: Le verbe signifie littéralement « aller, marcher » ; avec des lois, il désigne idiomatiquement la conduite de la vie. « Vivre selon » est clair et naturel en français moderne.
- source_word: τοῖς νομίμοις αὐτῶν
  choice: leurs propres lois
  rationale: νομίμοις peut désigner des lois, des coutumes ou des usages établis. Ici, le contexte porte sur les pratiques légales et religieuses juives ; « lois » convient, tandis que « propres » rend la force de αὐτῶν dans le contraste contextuel.
- source_word: ὡς τὸ πρότερον
  choice: comme auparavant
  rationale: Expression temporelle simple indiquant le rétablissement de la situation antérieure.
- source_word: χάριν
  choice: à cause de
  rationale: Employé avec le génitif, χάριν exprime ici la cause de leur colère, non un avantage ou une finalité.
- source_word: διεσκεδάσαμεν
  choice: nous avons supprimées
  rationale: Le sens premier est « disperser, éparpiller » ; appliqué aux lois et usages, le verbe évoque leur désorganisation ou leur suppression. « Supprimer » exprime naturellement leur mise hors d’usage sans imposer le terme plus technique « abroger ».
- source_word: ὠργίσθησαν
  choice: ils se sont mis en colère
  rationale: 'Rend le changement d’état exprimé par l’aoriste : ils sont devenus irrités ou courroucés.'
- source_word: ἐποίησαν ταῦτα πάντα
  choice: ont fait tout cela
  rationale: Formulation française naturelle qui conserve la portée récapitulative de πάντα.
