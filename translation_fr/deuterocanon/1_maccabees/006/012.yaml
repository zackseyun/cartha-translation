  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: fr
  text: 'Mais maintenant, je me souviens des actes mauvais que j’ai commis à Jérusalem : j’y ai pris tous les objets d’argent et d’or, et j’ai donné l’ordre d’exterminer sans raison les habitants de Juda.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: je me souviens
  rationale: Le présent grec exprime le souvenir qui revient maintenant à l’esprit du locuteur; cette formulation est naturelle en français et conserve la dimension réflexive de l’aveu.
- source_word: τῶν κακῶν
  choice: des actes mauvais
  rationale: Le contexte désigne les mauvaises actions commises par le roi. « Actes mauvais » garde la portée morale de κακά tout en étant plus naturel ici que le substantif abstrait « maux ».
- source_word: πάντα τὰ σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: tous les objets d’argent et d’or
  rationale: σκεύη peut désigner des objets ou ustensiles, notamment précieux ou cultuels. « Objets » est clair en français moderne, tandis que les adjectifs répétés sont rendus sans lourdeur par « d’argent et d’or ».
- source_word: ἐξαπέστειλα
  choice: j’ai donné l’ordre
  rationale: Avec l’infinitif final qui suit, le verbe indique qu’une directive a été envoyée. La formulation française explicite naturellement l’ordre sans modifier son contenu.
- source_word: τοῦ ἐξᾶραι
  choice: d’exterminer
  rationale: ἐξαίρω exprime ici l’élimination complète d’une population. « Exterminer » restitue cette violence avec un registre digne et plus précis que « faire disparaître ».
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: les habitants de Juda
  rationale: Le participe substantivé désigne ceux qui résident dans la région appelée Juda; cette traduction est concise et fidèle.
- source_word: διὰ κενῆς
  choice: sans raison
  rationale: Cette locution exprime l’absence de motif ou de justification. « Sans raison » est idiomatique en français et évite l’ambiguïté de « pour rien », qui pourrait suggérer une action restée sans résultat.
theological_decisions:
- issue: Caractérisation morale des actions d’Antiochos dans son propre discours
  choice: « des actes mauvais que j’ai commis »
  alternative: « des maux que j’ai faits »
  rationale: Le texte présente le roi reconnaissant le caractère moralement mauvais de ses actes, et non de simples erreurs politiques. La traduction conserve cette portée sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression de l’aveu grec. « Juda » est retenu comme nom régional conformément à l’usage biblique français; « j’y ai pris » reprend explicitement Jérusalem sans alourdir la phrase.
