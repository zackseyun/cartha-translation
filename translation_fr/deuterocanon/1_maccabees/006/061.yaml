  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
translation:
  language: fr
  text: Le roi et les chefs leur prêtèrent serment à ces conditions[a]. Puis il sortit de la forteresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « sur ces choses » ; l’expression renvoie aux conditions énoncées précédemment.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec est au singulier (« il sortit »), mais le contexte immédiat peut conduire à comprendre un sujet collectif ; autre traduction possible : « ils sortirent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: firent le serment
  rationale: Le verbe ὄμνυμι désigne l’acte de prêter serment. En français, « faire le serment » s’intègre naturellement avec le complément qui précise l’objet de l’engagement, tout en conservant sa portée officielle.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Équivalent courant de βασιλεύς dans un récit historique.
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: Dans ce contexte politico-militaire, ἄρχοντες désigne les hommes qui exercent l’autorité. « Les chefs » est naturel et suffisamment large; « les dirigeants » serait également possible.
- source_word: ἐπὶ τούτοις
  choice: en
  rationale: Le pronom « en » renvoie avec concision aux conditions énoncées auparavant. La formulation plus explicite « à ces conditions » est signalée en note afin de préserver la nuance de la préposition ἐπί.
- source_word: ἐξῆλθεν
  choice: il sortit
  rationale: L’aoriste singulier est rendu au singulier, sans imposer une identité au sujet implicite. « Sortit » convient au mouvement depuis l’intérieur de la forteresse.
- source_word: τοῦ ὀχυρώματος
  choice: de la forteresse
  rationale: ὀχύρωμα désigne un lieu fortifié. « Forteresse » est idiomatique en français et conserve nettement le sens militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase est divisée en deux pour rendre clairement la succession narrative. L’accord au pluriel de « firent » suit le sujet composé « le roi et les chefs », tandis que le singulier grec de ἐξῆλθεν est strictement conservé dans « il sortit ».
