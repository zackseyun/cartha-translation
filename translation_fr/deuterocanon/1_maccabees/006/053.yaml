base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: fr
  text: Mais il n’y avait pas de nourriture dans le sanctuaire, parce que c’était la septième année[a], et ceux qui avaient fui les nations pour se réfugier en Judée[b] avaient consommé les provisions qui restaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la septième année sabbatique, durant laquelle la production agricole était restreinte ; cela explique la pénurie de nourriture.
    reason: cultural_note
  - marker: b
    text: Ou « des peuples non juifs ». Le grec dit littéralement « des nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: nourriture
  rationale: Terme général désignant ce qui se mange; « nourriture » est naturel et convient au contexte de siège sans préciser indûment la nature des vivres.
- source_word: ἐν τοῖς ἁγίοις
  choice: dans le sanctuaire
  rationale: Le grec dit littéralement « dans les lieux saints »; dans ce contexte, l’expression désigne le complexe sacré du Temple. « Le sanctuaire » est clair et digne en français.
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: parce que c’était la septième année
  rationale: Cette formulation suit le grec sans remplacer par « année sabbatique » l’allusion historique qu’il laisse implicite.
- source_word: οἱ ἀνασωζόμενοι
  choice: ceux qui avaient trouvé refuge
  rationale: Le participe désigne ici ceux qui avaient échappé au danger et gagné la Judée. Cette tournure française exprime leur arrivée en sûreté sans imposer le sens théologique de « sauvés ».
- source_word: εἰς τὴν Ἰουδαίαν
  choice: en Judée
  rationale: Avec « avaient trouvé refuge », « en Judée » exprime naturellement le mouvement vers cette région.
- source_word: ἀπὸ τῶν ἐθνῶν
  choice: en venant de chez les nations
  rationale: La formule conserve l’expression juive grecque « les nations » tout en indiquant clairement que les personnes venaient des territoires ou des milieux des peuples non juifs.
- source_word: κατέφαγον
  choice: avaient épuisé
  rationale: Le verbe composé est intensif et indique que ce qui restait avait été entièrement consommé; appliqué à des réserves, « épuisé » est idiomatique.
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: le reste des réserves
  rationale: ὑπόλιμμα désigne ce qui subsiste, tandis que παράθεσις renvoie ici aux provisions mises de côté. « Le reste des réserves » restitue ce sens avec naturel.
theological_decisions:
- issue: Faut-il expliciter que « la septième année » est l’année sabbatique?
  choice: Conserver « la septième année » dans le texte et expliquer l’allusion en note.
  alternative: Traduire directement « l’année sabbatique ».
  rationale: Le grec dit expressément « la septième année ». L’identification avec l’année sabbatique est historiquement très probable et explique la pénurie, mais elle ne doit pas remplacer la formulation de la source.
- issue: Comment rendre ἐθνῶν dans ce contexte historique juif?
  choice: « les nations »
  alternative: « les païens » ou « les peuples étrangers »
  rationale: « Les nations » préserve l’idiome grec juif et son ouverture sémantique, sans introduire la connotation religieuse plus marquée de « païens ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression grecque, tandis que « avaient trouvé refuge » et « avaient épuisé le reste des réserves » assurent une lecture idiomatique. Tous les marqueurs de note figurent dans le texte.
