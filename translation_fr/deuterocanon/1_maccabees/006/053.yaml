revisions:
- from: Mais il n’y avait pas de nourriture dans le sanctuaire, parce que c’était la septième année[a], et ceux qui avaient trouvé refuge en Judée en venant de chez les nations[b] avaient épuisé le reste des réserves.
  to: Mais il n’y avait pas de nourriture dans le sanctuaire, parce que c’était la septième année[a], et ceux qui avaient fui les nations pour se réfugier en Judée[b] avaient consommé les provisions qui restaient.
  rationale: La révision remplace une expression non idiomatique par une formulation française claire qui maintient le sens de fuite et de refuge vers la Judée. Elle allège aussi la désignation des provisions restantes sans ajouter de précision interprétative. Les notes conservent leurs ancres et leur fonction, avec une formulation historique légèrement plus exacte.
