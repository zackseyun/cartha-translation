base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: fr
  text: Il posta le reste de la cavalerie de part et d’autre, aux deux flancs du camp[a], brandissant leurs armes[b] et se resserrant au sein des phalanges[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux deux côtés de l’armée » ; le mot grec peut désigner le camp ou l’armée en campagne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « agitant » ou « brandissant » ; ce qui est brandi n’est pas précisé en grec.
    reason: source_ambiguity
  - marker: c
    text: Ou « se protégeant au sein des phalanges » ou « étant pleinement armés dans les phalanges » ; le verbe grec est difficile et peut évoquer la protection, l’armement ou le resserrement de la formation.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: le reste de la cavalerie
  rationale: Dans ce contexte militaire, ἵππος désigne collectivement la cavalerie plutôt que les chevaux pris individuellement.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: de part et d’autre
  rationale: Cette expression indique ici une disposition sur les deux côtés.
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: sur les deux flancs du camp
  rationale: παρεμβολή peut désigner un camp ou une armée en campagne. Dans cette description tactique, « les deux flancs du camp » restitue naturellement les deux côtés de l’ensemble militaire sans préciser davantage que le grec.
- source_word: κατασείοντες
  choice: brandissaient leurs armes
  rationale: Le participe évoque un mouvement menaçant, mais son complément reste sous-entendu. « Leurs armes » explicite l’objet le plus vraisemblable dans le contexte militaire.
- source_word: καταφρασσόμενοι ἐν ταῖς φάλαγξιν
  choice: se protégeaient au sein des phalanges
  rationale: Le moyen καταφρασσόμενοι peut exprimer l’idée de se couvrir ou de se mettre à l’abri. La formulation conserve cette valeur tout en maintenant le terme militaire précis « phalanges ».
