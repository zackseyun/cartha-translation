  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: fr
  text: Lorsque le soleil brilla sur les boucliers d’or, les montagnes en reflétèrent l’éclat et resplendirent comme des torches enflammées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: se mit à resplendir / resplendirent
  rationale: Le verbe exprime un vif éclat lumineux. La répétition française conserve celle du grec tout en rendant naturellement l’effet du soleil sur le métal puis sur les montagnes.
- source_word: χρυσᾶς ἀσπίδας
  choice: les boucliers d’or
  rationale: « Boucliers » est le terme militaire courant. « D’or » reste naturel et ne précise pas si les boucliers étaient en or massif ou seulement revêtus d’or, distinction que le grec ne tranche pas.
- source_word: τὰ ὄρη
  choice: les montagnes
  rationale: Traduction directe de ὄρη, qui préserve l’ampleur du tableau.
- source_word: ἀπʼ αὐτῶν
  choice: de leur éclat
  rationale: Le pronom renvoie aux boucliers. Cette formulation explicite avec sobriété que la lumière des montagnes provenait de leur éclat réfléchi, sans ajouter de détail matériel.
- source_word: κατήγαζεν
  choice: brillèrent
  rationale: Le verbe décrit une émission ou une diffusion de lumière. « Brillèrent » est clair, naturel et convient à la comparaison qui suit.
- source_word: ὡς λαμπάδες πυρός
  choice: comme des torches enflammées
  rationale: Cette tournure restitue vivement l’image de torches de feu sans le calque moins idiomatique « torches de feu ».
