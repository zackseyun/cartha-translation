  rationale: La révision retire l’aspect inchoatif non marqué dans le grec et rend explicite, par « en reflétèrent l’éclat », la provenance de la lumière exprimée par ἀπ’ αὐτῶν. Elle conserve la répétition et l’intensité visuelle des deux verbes grecs, ainsi que l’image finale.
