    issue: Nuance inchoative ajoutée
    rationale: « Se mit à resplendir » suggère le commencement de l’action; le grec emploie simplement ἔστιλβεν, « brilla/étincela ». Il convient de ne pas introduire cet aspect.
  - severity: low
    issue: Référent de « leur éclat » insuffisamment net
    rationale: Dans « les montagnes resplendirent de leur éclat », le possessif peut être rapporté aux montagnes plutôt qu’aux boucliers. La préposition ἀπ’ (« de, depuis ») indique que leur éclat provient des boucliers.
