    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ τὸ ἁγίασμα
  choice: Il campa devant le sanctuaire
  rationale: παρεμβάλλω désigne d’abord l’action de camper; dans ce contexte militaire, ἐπί avec l’accusatif exprime un positionnement hostile dirigé vers le sanctuaire. « Devant » conserve l’image concrète du camp établi face au lieu saint sans remplacer le verbe par « assiéger ».
- source_word: ἡμέρας πολλάς
  choice: pendant de nombreux jours
  rationale: Rend naturellement l’accusatif de durée en français moderne.
- source_word: ἔστησεν
  choice: installa
  rationale: Exprime clairement la mise en place de matériel militaire tout en gardant la portée générale du verbe grec.
- source_word: βελοστασίσεις
  choice: lance-projectiles
  rationale: Le terme désigne des dispositifs destinés au lancement de βέλη. « Projectiles » évite de limiter indûment ces engins aux seules flèches.
- source_word: μηχανὰς
  choice: machines de guerre
  rationale: Le nom est général; l’ajout « de guerre », imposé par le contexte de siège, rend le sens immédiatement intelligible sans préciser un type d’engin absent du grec.
- source_word: πυροβόλα
  choice: lance-feu
  rationale: Rend de manière transparente le composé désignant des dispositifs qui projettent du feu, sans introduire une technologie anachronique.
- source_word: λιθοβόλα
  choice: lance-pierres
  rationale: Reproduit le sens littéral d’engins lançant des pierres sans les identifier plus précisément à des catapultes. Dans la liste des machines, le terme ne peut guère être confondu avec l’arme manuelle.
- source_word: σκορπίδια
  choice: scorpions
  rationale: Conserve le nom militaire historique de ces petits engins de jet; une note explique ce sens peu familier au lectorat moderne.
- source_word: εἰς τὸ βάλλεσθαι
  choice: afin de tirer
  rationale: L’infinitif articulé avec εἰς exprime ici le but. La forme grecque est passive, mais elle peut avoir une valeur fonctionnelle indiquant l’usage des machines; « afin de tirer » est naturel en français.
- source_word: βέλη
  choice: flèches
  rationale: Dans l’énumération finale des munitions, « flèches » est un sens concret et accessible de βέλη.
- source_word: σφενδόνας
  choice: projectiles de fronde
  rationale: Dans ce contexte, le mot désigne vraisemblablement les munitions lancées plutôt que les frondes elles-mêmes. « Projectiles de fronde » préserve l’incertitude sur leur matière, contrairement à « pierres de fronde ».
