  naturalness: La phrase révisée reste fluide en français international moderne. « Lanceurs de pierres » évite l’ambiguïté contemporaine de « lance-pierres », qui évoque surtout une arme manuelle. « Projecteurs de feu » est plus idiomatique et explicite que « lance-feu » dans cette liste d’engins.
  terminology: « Scorpions » conserve le nom historique de l’engin, avec une note explicative. « Engins de jet », « machines de guerre », « projecteurs de feu » et « lanceurs de pierres » rendent l’énumération technique sans imposer d’identifications plus précises que le grec.
