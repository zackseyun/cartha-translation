    rationale: Cette formulation décrit principalement une position spatiale et ne restitue pas suffisamment l’orientation hostile de παρενέβαλεν ἐπὶ τὸ ἁγίασμα. « Contre le sanctuaire » est plus fidèle au contexte militaire et à la construction grecque.
  - severity: medium
    issue: « lance-pierres »
    rationale: En français moderne, le mot désigne normalement un lance-pierre manuel (fronde à élastique) plutôt qu’un engin de siège. « Lanceurs de pierres » conserve le sens de λιθοβόλα sans cette confusion.
