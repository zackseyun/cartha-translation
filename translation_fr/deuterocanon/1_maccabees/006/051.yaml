  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: fr
  text: Il campa contre le sanctuaire pendant de nombreux jours et y installa des engins de jet, des machines de guerre, des projecteurs de feu, des lanceurs de pierres et des scorpions[a], afin de lancer des flèches et des projectiles de fronde.
  philosophy: optimal-equivalence
  footnotes:
