  yaml_path: translation/deuterocanon/1_maccabees/006/027.yaml
  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
translation:
  language: fr
  text: Et s’il ne les devance pas rapidement[a], ils feront des choses plus grandes que celles-ci[b], et il ne pourra pas les contenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne les prend pas de vitesse » ou « n’agit pas avant eux » ; le verbe grec évoque le fait d’agir avant eux, afin de les devancer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des choses plus grandes que celles-ci » ; dans ce contexte, il peut s’agir d’actions plus graves ou de plus grande ampleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  choice: les devance
  rationale: Le verbe exprime l’idée d’agir avant les autres ou de les prendre de vitesse. « Les devance » reste naturel en français et conserve cette portée sans imposer une image militaire trop précise.
- source_word: διὰ τάχους
  choice: rapidement
  rationale: Cette locution exprime la rapidité et l’urgence. « Rapidement » en donne ici un équivalent français direct et courant.
- source_word: μείζονα τούτων
  choice: des choses plus grandes encore que celles-ci
  rationale: La formulation conserve le comparatif grec « plus grandes » et son référent démonstratif, sans décider si ces actions seront plus graves, plus nombreuses ou de plus grande ampleur.
- source_word: κατασχεῖν
  choice: contenir
  rationale: Dans ce contexte politico-militaire, le verbe désigne le fait de tenir en échec, de maîtriser ou de freiner. « Contenir » est idiomatique et garde une certaine largeur de sens.
- source_word: αὐτῶν
  choice: les
  rationale: Le génitif grec dépend de l’infinitif; en français idiomatique, il devient le complément d’objet direct de « contenir ».
- source_word: οὐ δυνήσεται
  choice: il ne pourra pas
  rationale: Le futur de δύναμαι exprime une incapacité à venir; « il ne pourra pas » en rend directement le temps et le sens.
