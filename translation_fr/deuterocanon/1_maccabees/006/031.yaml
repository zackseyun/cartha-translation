base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: fr
  text: Ils traversèrent l’Idumée et campèrent devant Bethsour. Ils combattirent pendant de nombreux jours et construisirent des engins de siège. Les défenseurs firent une sortie[a], les incendièrent[b] et combattirent avec bravoure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici un verbe au singulier, « sortit », après plusieurs verbes au pluriel. Le contexte laisse penser qu’il s’agit collectivement des défenseurs de Bethsour effectuant une sortie.
    reason: textual_variant
  - marker: b
    text: Le pronom grec est masculin et ne s’accorde pas grammaticalement avec « engins », qui est masculin en français mais féminin en grec. Le contexte suggère néanmoins que les défenseurs incendièrent les engins de siège; le référent exact demeure formellement incertain.
    reason: source_ambiguity
  - marker: c
    text: Ou « vaillamment »; l’adverbe grec signifie littéralement « d’une manière virile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: traversèrent l’Idumée
  rationale: διά avec le génitif exprime ici le déplacement à travers une région. « Idumée » est la forme française usuelle.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: établirent leur camp face à Bethsour
  rationale: Le verbe désigne l’installation d’un camp; dans ce contexte militaire, ἐπί avec le datif indique une position hostile devant la place assiégée.
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: combattirent pendant de nombreux jours
  rationale: L’expression indique clairement une durée. Cette formulation est naturelle et conserve le sens militaire du verbe.
- source_word: μηχανὰς
  choice: machines de siège
  rationale: Dans le contexte d’un siège, le terme désigne des engins militaires plutôt que de simples machines.
- source_word: ἔξηλθεν
  choice: les défenseurs firent une sortie
  rationale: Le texte transmis emploie un verbe au singulier au milieu de verbes au pluriel. Le contexte suggère une sortie des défenseurs de Bethsour; le sujet explicite est donc une clarification contextuelle signalée en note.
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: les incendièrent
  rationale: Le verbe et le complément redondant expriment une mise à feu effective. « Incendièrent » rend cette force sans reproduire une tournure grecque lourde en français; le pronom conserve une part de l’ambiguïté de son référent.
- source_word: ἀνδρωδῶς
  choice: avec bravoure
  rationale: L’adverbe signifie littéralement « d’une manière virile », mais exprime ici avant tout la vaillance. « Avec bravoure » est actuel, digne et non archaïque.
