lexical_decisions:
- source_word: ἀπαγγέλλων
  choice: annoncer
  rationale: Le participe exprime l’action de rapporter une nouvelle; « vint lui annoncer » est naturel en français et conserve le mouvement suivi de l’annonce.
- source_word: παρεμβολαί
  choice: armées
  rationale: Dans ce contexte militaire, le pluriel désigne les forces en campagne plutôt que leurs seuls campements. « Armées » rend clairement le référent sans ajouter de précision absente du grec.
- source_word: γῆν Ἰούδα
  choice: pays de Juda
  rationale: « Pays de Juda » restitue l’expression géographique de façon idiomatique et distingue le territoire de la personne de Judas.
- source_word: τετρόπωνται
  choice: avaient été mises en déroute
  rationale: Le parfait passif indique une défaite décisive dont le résultat demeure pertinent au moment de l’annonce.
