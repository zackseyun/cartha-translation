translation:
  language: fr
  text: justice[a], et vengeras-tu nos frères[b] ? Nous sommes disposés à servir ton père et à nous conduire selon ses paroles[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis ici commence au milieu d’une phrase ; « justice » semble poursuivre la proposition précédente.
    reason: textual_variant
  - marker: b
    text: Ou « feras-tu justice à nos frères ? » Le verbe grec peut signifier soit venger quelqu’un, soit lui obtenir justice.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « marcher selon les choses dites par lui », c’est-à-dire agir conformément à ses paroles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσιν
  choice: justice
  rationale: Le fragment transmis commence au milieu d’une phrase. « Justice » conserve la valeur judiciaire générale du terme sans préciser indûment s’il s’agit d’un jugement, d’une sentence ou d’une cause.
- source_word: ἐκδικήσεις
  choice: vengeras-tu
  rationale: Le verbe peut désigner l’action de venger une personne lésée ou de lui obtenir justice. « Vengeras-tu » rend directement sa force dans ce contexte, tout en laissant l’autre nuance en note.
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: nos frères
  rationale: Traduction directe du terme familial, qui peut aussi désigner ici les membres du même peuple ou les compagnons.
- source_word: εὐδοκοῦμεν
  choice: Nous sommes disposés
  rationale: Cette expression française naturelle rend l’attitude favorable et la volonté exprimées par le verbe, sans suggérer nécessairement le plaisir.
- source_word: δουλεύειν
  choice: à servir
  rationale: Dans ce contexte politique, le verbe désigne le service et la sujétion envers un souverain ; « servir » convient mieux que le sens littéral plus marqué d’« être esclaves ».
- source_word: τῷ πατρί σου
  choice: ton père
  rationale: Traduction directe du complément au datif.
- source_word: πορεύεσθαι
  choice: à nous conduire
  rationale: Le verbe de déplacement est ici employé pour la manière de vivre ou d’agir. « Nous conduire » restitue naturellement cet emploi tout en conservant sa portée éthique et politique.
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: selon ses paroles
  rationale: Formulation concise et naturelle pour « selon les choses dites par lui », sans renforcer le texte en parlant explicitement d’ordres ou de commandements.
