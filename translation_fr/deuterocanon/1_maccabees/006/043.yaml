base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: fr
  text: Éléazar, surnommé Avaran, vit l’un des éléphants[a], revêtu de cuirasses royales. Il dominait tous les autres éléphants, et il semblait que le roi était sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « l’un des animaux » ou « l’une des bêtes » ; dans ce contexte, il s’agit d’éléphants de guerre.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « il paraissait que le roi était sur lui ». Le grec exprime une apparence plutôt qu’une certitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: Éléazar, surnommé Avaran
  rationale: Le grec donne à Éléazar une désignation propre. « Avaran », forme traditionnelle du nom, est conservé comme surnom sans lui attribuer une étymologie incertaine.
- source_word: ἐν τῶν θηρίων
  choice: l’un des éléphants
  rationale: θηρίον signifie littéralement « animal » ou « bête », mais le contexte immédiat identifie clairement ces animaux comme des éléphants de guerre. La formulation française explicite le référent naturel tout en signalant le mot grec en note.
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: revêtu d’armures royales
  rationale: Le participe et le nom apparenté forment une expression d’équipement défensif. Le pluriel « armures » respecte θώραξιν sans imposer « cuirasses », trop étroit dans ce contexte où il s’agit de la parure protectrice de l’éléphant.
- source_word: ὑπεράγον πάντα τὰ θηρία
  choice: Il dépassait tous les autres éléphants en hauteur
  rationale: ὑπεράγω exprime ici une supériorité visible. « En hauteur » rend explicitement et naturellement la stature dominante suggérée par la scène.
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: il semblait que le roi était sur lui
  rationale: ὤφθη marque une apparence, non une certitude. « Sur lui » convient à un roi supposé monter l’éléphant et garde pour pronom le genre naturel de l’animal en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour éviter une coordination lourde. « Éléphants » explicite le référent contextuel, tandis que la note conserve la formulation littérale du grec. L’incertitude narrative est maintenue par « il semblait ».
