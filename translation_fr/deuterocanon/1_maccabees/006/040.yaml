  yaml_path: translation/deuterocanon/1_maccabees/006/040.yaml
  text: And part of the king’s camp spread out over the high mountains[a], and some over the lowlands; and they advanced securely and in formation.
translation:
  language: fr
  text: Une partie du camp du roi se déploya sur les hautes montagnes, et d’autres sur les terrains plus bas[a] ; les troupes avançaient en sécurité et en bon ordre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les lieux bas ». Le grec oppose les hautes montagnes aux terrains situés plus bas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάθη
  choice: se déploya
  rationale: Le passif aoriste exprime ici l’extension ou le déploiement d’une force militaire sur le terrain ; « se déploya » est naturel en français dans ce contexte.
- source_word: μέρος τι
  choice: une partie
  rationale: L’expression désigne une portion indéterminée, sans qu’il soit nécessaire de rendre explicitement τι par « une certaine ».
- source_word: παρεμβολῆς
  choice: l’armée
  rationale: Dans ce récit militaire, le mot peut désigner le camp ou la force qui y est rassemblée. Puisque les personnes se déploient et avancent, « l’armée » exprime clairement le sens contextuel.
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: sur les hautes montagnes
  rationale: ἐπί avec l’accusatif indique ici l’extension sur un terrain ; la formulation conserve littéralement le relief élevé du grec.
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: d’autres troupes sur les terrains plus bas
  rationale: τινες renvoie à certains membres de l’armée, tandis que l’adjectif substantivé τὰ ταπεινά désigne des lieux bas. « D’autres troupes » rend explicite le référent naturel sans préciser leur nombre.
- source_word: ἤρχοντο
  choice: elles avançaient
  rationale: L’imparfait décrit la progression continue des forces ; « avançaient » convient au mouvement militaire.
- source_word: ἀσφαλῶς
  choice: sans danger
  rationale: L’adverbe évoque une progression sûre, à l’abri d’une attaque ou d’un obstacle ; « sans danger » est plus idiomatique ici que « sûrement », qui serait ambigu en français.
- source_word: τεταγμένως
  choice: en bon ordre
  rationale: L’adverbe indique une disposition réglée et disciplinée. « En bon ordre » reste naturel tout en évitant de préciser indûment une formation de combat particulière.
