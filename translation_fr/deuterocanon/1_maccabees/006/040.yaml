revisions:
- from: Une partie de l’armée du roi se déploya sur les hautes montagnes, et d’autres troupes sur les terrains plus bas[a] ; elles avançaient sans danger et en bon ordre.
  to: Une partie du camp du roi se déploya sur les hautes montagnes, et d’autres sur les terrains plus bas[a] ; les troupes avançaient en sécurité et en bon ordre.
  rationale: La révision rétablit « camp » pour παρεμβολή, allège l’explicitation de τινες et clarifie le sujet pluriel de l’imparfait. Elle conserve l’ambiguïté numérique du grec, le contraste entre relief élevé et terrain bas, ainsi que l’idée d’une progression sûre et ordonnée.
