  text: And they went to the king and said[b][a], “How long will you not act…?”
translation:
  language: fr
  text: 'Ils allèrent trouver le roi et dirent : « Jusqu’à quand n’agiras-tu pas… ? »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé fourni pour ce verset est incomplet : il s’interrompt après « Jusqu’à quand n’agiras-tu pas… ? ». Les points de suspension signalent cette interruption du texte source, et non un raccourci de traduction.'
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « Jusqu’à quand ne feras-tu pas… ? » Le verbe grec peut avoir le sens général de « faire »; « agir » donne une formulation française plus claire dans cette phrase interrompue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: allèrent
  rationale: L’aoriste déponent de πορεύομαι exprime ici simplement le déplacement; « allèrent » convient au récit en français naturel.
- source_word: πρὸς τὸν βασιλέα
  choice: trouver le roi
  rationale: πρός avec l’accusatif marque un mouvement vers une personne afin de s’adresser à elle. « Aller trouver le roi » est idiomatique et ne suppose pas une comparution formelle.
- source_word: Ἕως πότε
  choice: Jusqu’à quand
  rationale: Cette formule introduit une plainte pressante au sujet d’un délai. « Jusqu’à quand » conserve directement la tournure grecque tout en restant naturel en français.
- source_word: οὐ ποιήσεις
  choice: resteras-tu sans agir
  rationale: ποιέω est un verbe très large, « faire, agir ». Comme la proposition transmise s’interrompt sans complément, cette formulation française rend la demande d’intervention sans préciser indûment l’action attendue.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « aller trouver » rend naturellement la démarche auprès du roi; la question conserve son urgence ainsi que l’inachèvement réel du témoin grec fourni.
