  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: fr
  text: Le roi s’empara de Bethsoura[a] et y établit une garnison[b] pour la garder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit Bethsoura » ou « occupa Bethsoura ». Le verbe grec signifie plus largement prendre possession d’un lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « y posta une garde ». Le grec souligne l’affectation sur place d’une force militaire chargée de tenir la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: s’empara de
  rationale: Dans ce contexte militaire, le verbe exprime la prise de possession effective d’une place fortifiée. « S’empara de » conserve cette nuance sans préciser au-delà du grec les modalités de la prise.
- source_word: ὁ βασιλεύς
  choice: le roi
  rationale: Traduction directe du titre employé comme sujet, sans remplacer celui-ci par un nom propre absent du verset.
- source_word: τὴν Βεθσούραν
  choice: Bethsoura
  rationale: Translittération française de la forme grecque Βεθσούρα, sans harmonisation avec la forme hébraïque Beth-Tsour.
- source_word: ἐπέταξεν
  choice: établit
  rationale: Avec φρουράν comme complément, le verbe désigne ici l’affectation ou l’installation d’une force militaire sur place. « Établit » est naturel en français avec « garnison ».
- source_word: φρουράν
  choice: une garnison
  rationale: Dans le contexte d’une ville conquise, le terme désigne vraisemblablement une force militaire laissée sur place pour la tenir et la surveiller.
- source_word: τηρεῖν αὐτήν
  choice: pour la garder
  rationale: Le verbe peut signifier garder, surveiller ou conserver. « La garder » maintient à la fois l’idée de protection et celle de maintien sous contrôle; le pronom féminin renvoie à Bethsoura, comprise comme ville.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et suit l’enchaînement du grec. « Bethsoura » reproduit la forme grecque du nom de lieu.
