  yaml_path: translation/deuterocanon/1_maccabees/006/036.yaml
  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: fr
  text: Ceux-ci étaient là d’avance, partout où se trouvait l’animal[a] ; partout où il allait, ils allaient avec lui et ne s’en éloignaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, il s’agit d’un éléphant.
    reason: Précision du référent contextuel tout en conservant dans le texte le terme générique θηρίον.
lexical_decisions:
- source_word: οὗτοι
  choice: Ceux-ci
  rationale: Le démonstratif renvoie aux hommes affectés aux éléphants dans le contexte précédent, sans ajouter au texte grec un nom explicatif.
- source_word: πρὸ καιροῦ
  choice: se tenaient prêts à l’avance
  rationale: L’expression marque une disposition anticipée. Cette formulation rend naturellement en français l’idée qu’ils étaient déjà en position et prêts.
- source_word: οὗ ἂν ᾖ
  choice: partout où se trouvait
  rationale: La relative indéfinie avec ἄν exprime une situation valable quel que soit l’endroit. En français, l’imparfait restitue naturellement cette valeur répétée sans imposer une nuance hypothétique artificielle.
- source_word: τὸ θηρίον
  choice: l’animal
  rationale: θηρίον désigne ici l’animal, qui est un éléphant d’après le contexte. « Animal » conserve le terme générique du grec sans la connotation péjorative que pourrait avoir « bête » en français moderne.
- source_word: ἐπορεύετο
  choice: allait
  rationale: Le verbe exprime simplement le déplacement ; « allait » reste direct et n’ajoute pas l’idée plus précise de marcher au pas militaire.
- source_word: ἅμα
  choice: avec lui
  rationale: L’adverbe indique un déplacement conjoint. « Avec lui » est idiomatique et reprend naturellement l’animal, traité comme un être animé.
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: ne s’en éloignaient pas
  rationale: La tournure exprime le fait de ne pas se retirer ni se séparer de l’animal. « Ne s’en éloignaient pas » préserve cette proximité continue.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « partout où » reproduit la structure du grec, tandis que l’imparfait exprime l’action habituelle. Le point-virgule conserve l’équilibre des deux propositions.
