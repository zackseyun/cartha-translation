  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
translation:
  language: fr
  text: Sur eux étaient installées de solides tours en bois, couvertes et équipées de machines de guerre, une sur chaque bête[a]. Sur chaque bête se trouvaient trente-deux combattants, ainsi que son Indien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « bête »; d’après le contexte, il s’agit d’un éléphant.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son Indien ». Il s’agit vraisemblablement de l’Indien chargé de conduire chaque éléphant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι
  choice: tours en bois
  rationale: πύργοι désigne des tours ou tourelles. « Tours en bois » est direct, naturel et convient aux structures montées sur les éléphants.
- source_word: ὀχυροὶ
  choice: solides
  rationale: L’adjectif exprime la robustesse et la capacité défensive de ces tours sans exiger le sens plus précis de « fortifiées ».
- source_word: σκεπαζόμενοι
  choice: couvertes
  rationale: Le participe indique que les tours étaient couvertes ou munies d’un toit, sans en préciser la forme.
- source_word: θηρίου
  choice: bête
  rationale: Le grec emploie un nom générique signifiant « bête » ou « animal »; le contexte permet de reconnaître les éléphants sans remplacer silencieusement le terme grec.
- source_word: ἐζωσμένοι ... μηχαναῖς
  choice: équipées de machines de guerre
  rationale: ἐζωσμένοι évoque ici le fait d’être pourvu ou équipé, et μηχαναῖς des dispositifs mécaniques à fonction militaire. Cette formulation rend clairement le sens contextuel.
- source_word: ἄνδρες δύο καὶ τριάκοντα
  choice: trente-deux combattants
  rationale: La numération grecque signifie trente-deux; « combattants » rend à la fois ἄνδρες et le participe οἱ πολεμοῦντες dans un français fluide.
- source_word: οἱ πολεμοῦντες
  choice: combattants
  rationale: Le participe caractérise ces hommes par leur rôle au combat; le nom français exprime ce rôle avec concision.
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: l’Indien qui conduisait l’animal
  rationale: Littéralement, le grec dit « son Indien ». Dans ce contexte, il s’agit de l’Indien chargé de conduire chaque éléphant; la formulation explicite sa fonction sans employer le terme spécialisé « cornac » dans le texte principal.
