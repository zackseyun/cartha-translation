translation_notes:
  register: Français international moderne, narratif et digne. La phrase est restructurée légèrement pour éviter l’enchaînement pesant des compléments grecs tout en conservant les tours couvertes, leur équipement, le nombre de combattants et le conducteur indien. Les marqueurs de note sont placés sur les termes auxquels leurs explications se rapportent.
