base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: fr
  text: Le nombre de ses forces s’élevait à cent mille fantassins, vingt mille cavaliers[a] et trente-deux éléphants entraînés au combat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vingt mille chevaux » ; dans cette énumération militaire, le grec désigne vraisemblablement ainsi les troupes montées.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « connaissant la guerre », c’est-à-dire dressés ou expérimentés pour le combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς τῶν δυνάμεων
  choice: nombre de ses forces
  rationale: Cette formulation conserve le sens militaire collectif de δυνάμεις et rend directement ἀριθμός, tout en restant naturelle en français.
- source_word: πεζῶν
  choice: fantassins
  rationale: Le terme désigne les soldats combattant à pied, par opposition aux troupes montées.
- source_word: ἵππων
  choice: cavaliers
  rationale: Le grec dit littéralement « chevaux », mais, dans cette énumération militaire, ceux-ci représentent par métonymie les troupes montées.
- source_word: ἐλέφαντες δύο καὶ τριάκοντα
  choice: trente-deux éléphants
  rationale: Traduction directe du nom et du nombre grecs.
- source_word: εἰδότες πόλεμον
  choice: entraînés au combat
  rationale: L’expression signifie littéralement « connaissant la guerre ». Appliquée aux éléphants, elle indique qu’ils étaient dressés ou expérimentés pour le combat.
