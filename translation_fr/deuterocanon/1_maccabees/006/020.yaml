lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: la cent cinquantième année
  rationale: La formule grecque au génitif indique la date. En français, « la cent cinquantième année » est naturel dans la continuité syntaxique du verset.
- source_word: ἐποίησεν
  choice: il fabriqua
  rationale: Dans ce contexte militaire, « fabriqua » exprime plus précisément la confection de dispositifs tout en restant fidèle au sens large de ποιέω.
- source_word: ἐπʼ αὐτούς
  choice: contre eux
  rationale: Avec des engins militaires, ἐπί suivi de l’accusatif marque ici la destination hostile.
- source_word: βελοστασίεις
  choice: des lance-projectiles
  rationale: Le terme désigne des dispositifs lançant des traits ou d’autres projectiles, sans permettre de les identifier avec certitude à une catégorie unique comme les catapultes.
- source_word: μηχανάς
  choice: des machines de siège
  rationale: Dans le contexte d’un siège, μηχαναί désigne des dispositifs militaires conçus pour attaquer les fortifications.
