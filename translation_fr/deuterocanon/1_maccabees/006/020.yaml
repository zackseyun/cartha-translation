translation:
  language: fr
  text: La cent cinquantième année[a], il fabriqua contre eux des lance-projectiles et des machines de siège.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’an 150 de l’ère séleucide, soit 163–162 av. J.-C.
