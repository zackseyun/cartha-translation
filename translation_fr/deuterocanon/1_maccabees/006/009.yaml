lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: il resta là
  rationale: Dans ce contexte narratif, cette tournure exprime naturellement la prolongation du séjour, plutôt que la simple présence.
- source_word: ἡμέρας πλείους
  choice: de nombreux jours
  rationale: Rend une durée prolongée dans un français naturel et digne.
- source_word: ἀνεκαινίσθη
  choice: s’abattit de nouveau
  rationale: Le passif exprime le renouvellement ou le retour de la tristesse; « de nouveau » conserve cette valeur lexicale.
- source_word: ἐπ᾽ αὐτόν
  choice: sur lui
  rationale: Préserve l’image d’une tristesse qui vient peser sur la personne.
- source_word: λύπη μεγάλη
  choice: une grande tristesse
  rationale: Traduction directe et courante de l’intensité de λύπη μεγάλη.
- source_word: ἐλογίσατο
  choice: il pensa
  rationale: Expression claire qui n’exagère pas la nuance possible de calcul, de réflexion ou de conclusion.
- source_word: ὅτι ἀποθνήσκει
  choice: qu’il était en train de mourir
  rationale: Conserve l’aspect en cours du présent grec dans le cadre du récit au passé.
