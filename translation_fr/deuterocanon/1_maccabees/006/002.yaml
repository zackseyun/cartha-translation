  yaml_path: translation/deuterocanon/1_maccabees/006/002.yaml
  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
translation:
  language: fr
  text: On disait aussi que le temple qui s’y trouvait était extrêmement riche et qu’il y avait là des couvertures en or[a], ainsi que des cuirasses et des armes qu’Alexandre, fils de Philippe, roi de Macédoine et premier à régner sur les Grecs, y avait laissées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne des couvertures en or, sans préciser leur forme ou leur usage exacts.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: temple
  rationale: Dans ce contexte, le terme désigne le sanctuaire ou complexe cultuel de la ville; « temple » est naturel et précis en français courant.
- source_word: πλούσιον σφόδρα
  choice: extrêmement riche
  rationale: Cette formulation restitue clairement l’intensité de σφόδρα sans archaïsme.
- source_word: καλύμματα χρυσᾶ
  choice: objets en or servant de couvertures
  rationale: καλύμματα désigne de manière générale ce qui couvre, sans permettre d’identifier précisément la forme des objets; la traduction maintient cette indétermination.
- source_word: θώρακες
  choice: cuirasses
  rationale: Le mot désigne spécifiquement une armure protégeant le torse; « cuirasses » est précis et compréhensible.
- source_word: ὅπλα
  choice: armes
  rationale: Dans cette liste de matériel militaire, « armes » est le rendu moderne le plus clair.
- source_word: κατέλειπεν
  choice: avait laissés
  rationale: Le plus-que-parfait convient au cadre de discours rapporté venant du verset précédent et exprime une action antérieure.
- source_word: Ἀλέξανδρος ὁ τοῦ Φιλίππου
  choice: Alexandre, fils de Philippe
  rationale: Cette formulation rend naturellement le patronyme grec.
- source_word: ὁ βασιλεὺς ὁ Μακεδών
  choice: roi de Macédoine
  rationale: Cette tournure française idiomatique rend l’identification d’Alexandre comme roi macédonien.
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: premier à régner sur les Grecs
  rationale: Le rendu conserve πρῶτος et la construction de ἐβασίλευσεν avec le datif, sans expliquer ni corriger l’affirmation historique.
