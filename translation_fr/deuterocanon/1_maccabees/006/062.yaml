  yaml_path: translation/deuterocanon/1_maccabees/006/062.yaml
  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: fr
  text: Le roi entra sur le mont Sion et, voyant la fortification du lieu, il viola le serment qu’il avait prêté, donna l’ordre de démolir la muraille tout autour et la fit démolir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Aoriste narratif simple de εἰσέρχομαι, rendu naturellement en français par « entra ».
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Équivalent direct et courant de βασιλεύς dans un récit historique.
- source_word: τὸ ὄρος Σιών
  choice: le mont Sion
  rationale: Forme géographique française consacrée, correspondant directement au grec.
- source_word: τὸ ὀχύρωμα τοῦ τόπου
  choice: les fortifications du lieu
  rationale: ὀχύρωμα peut désigner un ouvrage fortifié ou un ensemble défensif. Le pluriel français « les fortifications » exprime naturellement ce que le roi voit sans préciser indûment qu’il s’agit d’une forteresse unique.
- source_word: ἠθέτησεν
  choice: il viola
  rationale: Avec un serment pour complément, le verbe désigne le fait de ne pas respecter ou de transgresser un engagement contraignant. « Viola » conserve clairement la portée morale du grec.
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: le serment qu’il avait prêté
  rationale: « Prêter serment » est l’expression française idiomatique; le plus-que-parfait marque naturellement l’antériorité de l’engagement.
- source_word: ἐνετείλατο
  choice: ordonna
  rationale: Rendu direct et naturel du commandement donné dans ce contexte militaire.
- source_word: καθεῖλεν
  choice: de démolir
  rationale: Le grec exprime l’action d’abattre ou de faire tomber. Après « ordonna », l’infinitif français rend naturellement la construction, et le contexte indique que l’ordre est exécuté par d’autres.
- source_word: τὸ τεῖχος κυκλόθεν
  choice: la muraille tout autour
  rationale: « Muraille » convient à un mur défensif; « tout autour » préserve la portée spatiale de κυκλόθεν.
theological_decisions:
- issue: Portée morale de ἠθέτησεν à propos d’un serment
  choice: il viola le serment
  alternative: il rejeta le serment / il ne tint pas compte du serment
  rationale: « Viola » rend sans atténuation la transgression d’un engagement juré, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe grecque tout en employant les tournures idiomatiques « prêter serment » et « ordonner de ». Aucun archaïsme ni marque confessionnelle.
