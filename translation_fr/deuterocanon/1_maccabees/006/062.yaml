  source_fidelity: 'La traduction rend correctement l''entrée du roi, le mont Sion, la violation du serment et l''étendue circulaire de la muraille. Deux écarts exigent cependant correction : τὸ ὀχύρωμα est singulier, et la double action coordonnée ἐνετείλατο καὶ καθεῖλεν doit conserver à la fois l''ordre et la démolition accomplie.'
