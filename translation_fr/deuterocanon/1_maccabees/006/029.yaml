  text: And from other kings and from islands of the seas, hired troops came to him.
translation:
  language: fr
  text: Des troupes mercenaires, venues d’autres rois et des îles des mers, arrivèrent auprès de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμεις μισθωταί
  choice: des troupes mercenaires
  rationale: δυνάμεις désigne ici des forces armées, rendu naturellement par « troupes » ; μισθωταί précise qu’elles servent contre rémunération, d’où « mercenaires ».
- source_word: ἦλθον πρὸς αὐτόν
  choice: vinrent le rejoindre
  rationale: Cette formulation française exprime naturellement le mouvement vers lui et, dans ce contexte militaire, le ralliement à ses forces.
- source_word: ἀπὸ βασιλέων ἑτέρων
  choice: envoyées par d’autres rois
  rationale: La préposition ἀπό marque la provenance. Avec des troupes venant de rois, « envoyées par » explicite légèrement la relation idiomatique sans modifier le sens contextuel.
- source_word: ἀπὸ νήσων θαλασσῶν
  choice: venues des îles de la mer
  rationale: Conserve l’expression grecque au pluriel et son image géographique sans la réduire à une région particulière.
