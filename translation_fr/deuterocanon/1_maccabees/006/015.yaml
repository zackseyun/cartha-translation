  text: and he gave him the crown and his robe and the ring[a], to bring Antiochus his son and
translation:
  language: fr
  text: et il lui donna le diadème, sa robe et l’anneau[a], afin qu’il amène Antiochos, son fils, et
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec fourni pour ce verset s’interrompt au milieu de la phrase : « et il lui donna le diadème, sa robe et l’anneau, afin qu’il amène Antiochos, son fils, et ». La traduction conserve donc cette formulation inachevée, sans ajouter la suite d’après le contexte.'
    reason: textual_variant
lexical_decisions:
- source_word: διάδημα
  choice: diadème
  rationale: Désigne ici l’insigne royal porté sur la tête. « Diadème » conserve la précision historique et le registre royal du grec.
- source_word: στολὴν αὐτοῦ
  choice: son vêtement d’apparat
  rationale: Dans ce contexte royal, στολή désigne un vêtement distinctif ou officiel. Cette formulation rend la dignité de l’objet sans préciser indûment qu’il s’agit nécessairement d’une robe.
- source_word: δακτύλιον
  choice: anneau
  rationale: Le grec signifie simplement « anneau ». Il peut s’agir d’un anneau servant de sceau et symbolisant l’autorité, mais le texte ne l’explicite pas.
- source_word: τοῦ ἀγαγεῖν
  choice: afin qu’il amène
  rationale: L’infinitif articulé exprime ici le but. « Afin qu’il amène » rend naturellement cette valeur tout en conservant l’inachèvement de la proposition.
- source_word: Ἀντίοχον τὸν υἱὸν αὐτοῦ
  choice: Antiochos, son fils
  rationale: La mise en apposition est naturelle en français et reproduit sans ambiguïté le lien filial exprimé par le grec.
