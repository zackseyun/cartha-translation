  yaml_path: translation/deuterocanon/1_maccabees/006/058.yaml
  text: Now then[a], let us give our right hand to these men, and let us make peace with them and with their whole nation;
translation:
  language: fr
  text: Maintenant donc, tendons la main droite à ces hommes[a] et faisons la paix avec eux ainsi qu’avec toute leur nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnons la main droite à ces hommes »; ce geste exprimait un engagement de paix ou d’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Cette expression conserve à la fois l’immédiateté de νῦν et la valeur déductive ou transitoire de οὖν, dans un français soutenu mais naturel.
- source_word: δῶμεν δεξιὰν
  choice: tendons la main droite
  rationale: Le grec dit littéralement « donnons la main droite », geste exprimant un engagement de bonne foi, de paix ou d’alliance. « Tendre la main droite » préserve l’image tout en étant plus idiomatique en français moderne.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: à ces hommes
  rationale: Dans ce contexte politico-militaire, ἄνθρωποι désigne les membres masculins du groupe auquel il est proposé de faire la paix.
- source_word: ποιήσωμεν ... εἰρήνην
  choice: faisons la paix
  rationale: Expression française directe et courante qui correspond fidèlement à la construction grecque.
- source_word: μετʼ αὐτῶν
  choice: avec eux
  rationale: Rend directement les parties avec lesquelles la paix doit être conclue.
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  choice: ainsi qu’avec toute leur nation
  rationale: ἔθνος désigne ici l’ensemble du peuple ou de la nation auquel ces hommes appartiennent; παντός souligne sa totalité.
