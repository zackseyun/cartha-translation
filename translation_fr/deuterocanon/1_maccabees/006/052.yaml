- from: Eux aussi construisirent des machines de guerre pour s’opposer aux leurs[a], et ils combattirent pendant de nombreux jours.
  to: Eux aussi construisirent des machines de guerre contre les leurs[a], et ils combattirent pendant de nombreux jours.
  rationale: La révision remplace la formulation finalisée « pour s’opposer à » par « contre », qui rend directement πρὸς dans son emploi hostile et maintient la concision du grec. La note est simplifiée afin de distinguer clairement l’alternative plus précise « machines de siège » sans la présenter comme le seul sens possible.
