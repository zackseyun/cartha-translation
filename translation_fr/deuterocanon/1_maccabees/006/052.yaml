  naturalness: Le français est fluide et le passé simple convient au récit. « Des machines de guerre contre les leurs » est à la fois plus direct, plus idiomatique dans ce contexte et plus proche de la construction grecque que « pour s’opposer aux leurs ».
  terminology: « Machines de guerre » est un bon choix moderne pour μηχανάς, sans imposer la précision possible de « machines de siège ». La note peut présenter cette dernière comme alternative, tout en précisant la portée militaire du terme.
