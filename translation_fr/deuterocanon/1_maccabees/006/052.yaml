  text: And they also made engines against their engines[a], and they fought for many days.
translation:
  language: fr
  text: Eux aussi construisirent des machines de guerre contre les leurs[a], et ils combattirent pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des machines de siège ». Le terme grec peut désigner des dispositifs mécaniques employés dans la guerre, notamment lors d’un siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  choice: machines de guerre
  rationale: Dans ce contexte militaire et probablement de siège, μηχανή désigne des dispositifs mécaniques employés au combat. « Machines de guerre » est naturel en français moderne et reste moins restrictif que « machines de siège ».
- source_word: πρὸς
  choice: pour s’opposer à
  rationale: Avec l’accusatif, dans ce contexte hostile, πρὸς exprime l’opposition ou la riposte. Cette formulation rend clairement que leurs machines étaient destinées à contrer celles de l’adversaire.
- source_word: ἐπολέμησαν
  choice: ils combattirent
  rationale: Le verbe signifie ici prendre part au combat. Le passé simple convient au registre narratif biblique tout en restant clair et digne.
- source_word: ἡμέρας πολλάς
  choice: pendant de nombreux jours
  rationale: L’accusatif indique la durée. « Pendant de nombreux jours » en donne une traduction française directe et naturelle.
- source_word: καὶ αὐτοὶ
  choice: eux aussi
  rationale: 'La tournure conserve la valeur additive et le léger relief du pronom αὐτοί : ce camp construisit lui aussi de telles machines en réponse à l’adversaire.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le ton historique. « Machines de guerre » évite l’archaïsme de « engins » tout en rendant explicitement le contexte militaire; la note conserve l’interprétation plus précise liée au siège.
