  text: Il se donna lui-même pour sauver son peuple et se faire un nom éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτόν
  choice: se donna lui-même
  rationale: Reproduit l’expression grecque avec son insistance réflexive, dans un français digne et naturel.
- source_word: τοῦ σῶσαι
  choice: pour sauver
  rationale: Rend directement l’infinitif de but grec.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: Équivalent direct et idiomatique.
- source_word: περιποιῆσαι αὐτῷ ὄνομα αἰώνιον
  choice: se faire un nom éternel
  rationale: « Se faire un nom » exprime naturellement l’idée d’acquérir ou de gagner une renommée pour soi; « éternel » conserve la portée de αἰώνιον sans l’atténuer.
theological_decisions:
- issue: Portée de « se donna lui-même »
  choice: Conserver la formulation réflexive sans l’expliciter théologiquement
  alternative: « sacrifia sa vie »
  rationale: Le grec dit qu’il « se donna lui-même »; préciser « sa vie » ou employer un vocabulaire sacrificiel résoudrait une nuance que le texte laisse implicite.
- issue: Sens de ὄνομα αἰώνιον
  choice: « un nom éternel »
  alternative: « une renommée impérissable »
  rationale: La traduction retenue préserve l’image concrète du « nom » et sa possible profondeur mémorielle, plutôt que de la réduire à la seule célébrité.
translation_notes:
  register: Français moderne international, concis et solennel. La coordination grecque est rendue par deux infinitifs de but parallèles; aucune note n’est nécessaire.
