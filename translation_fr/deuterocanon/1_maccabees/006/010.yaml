  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
translation:
  language: fr
  text: 'Il appela tous ses amis[a] et leur dit : « Le sommeil s’éloigne de mes yeux, et mon cœur défaille sous le poids de l’inquiétude[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses proches » ou « tous ses conseillers » ; en grec, le mot traduit par « amis » peut aussi désigner les membres de l’entourage d’un souverain.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « je suis abattu dans mon cœur à cause de l’inquiétude » ; autres traductions possibles : « mon cœur est abattu » ou « je me sens défaillir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: L’aoriste de καλέω signifie ici « appeler » ou « convoquer ». « Appela » convient naturellement au récit sans accentuer plus que le grec le caractère officiel de l’appel.
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: tous ses amis
  rationale: φίλοι signifie directement « amis ». Dans un contexte royal hellénistique, le terme peut aussi désigner les proches ou conseillers du souverain ; le texte principal conserve le sens premier et une note signale cette nuance.
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: Le sommeil s’éloigne de mes yeux
  rationale: Cette formulation conserve l’image concrète de l’expression grecque tout en restant claire et naturelle en français.
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: mon cœur défaille
  rationale: Le grec exprime l’effondrement ou l’abattement intérieur. « Mon cœur défaille » restitue cette force sans la tournure peu naturelle d’un calque strict.
- source_word: ἀπὸ τῆς μερίμνης
  choice: sous le poids de l’inquiétude
  rationale: μέριμνα désigne l’inquiétude, le souci ou l’angoisse. La tournure française exprime naturellement la cause accablante indiquée par ἀπό.
