  text: And he charged boldly into the middle of the phalanx[a], and kept killing right and left, and they were split apart before him on both sides.
translation:
  language: fr
  text: Il se lança avec audace contre lui, au milieu de la phalange, tuant à droite et à gauche, tandis que les rangs s’ouvraient devant lui de part et d’autre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέδραμεν αὐτῷ
  choice: Il s’élança hardiment sur lui
  rationale: Le verbe exprime un mouvement offensif et impétueux dirigé contre l’éléphant évoqué dans le contexte. « S’élança sur lui » restitue à la fois l’assaut et son élan.
- source_word: θράσει
  choice: hardiment
  rationale: Le datif de manière indique l’audace avec laquelle il agit. « Hardiment » convient au registre narratif digne et reste immédiatement compréhensible.
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: au milieu de la phalange
  rationale: φάλαγξ désigne ici une troupe disposée en formation compacte. « Phalange » conserve l’image militaire précise du grec.
- source_word: ἐθανάτου
  choice: tuant
  rationale: L’imparfait décrit une action continue ou répétée pendant sa progression. Le participe présent français relie naturellement cette action à l’assaut sans en perdre la durée.
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: à droite et à gauche
  rationale: Cette tournure idiomatique française rend directement les deux côtés indiqués par le grec.
- source_word: ἐσχίζοντο
  choice: les rangs s’ouvraient
  rationale: Le passif imparfait dépeint la formation qui se sépare à mesure qu’il avance. L’ajout explicatif « les rangs » donne en français le référent militaire implicite sans suggérer nécessairement que les soldats étaient physiquement déchirés.
- source_word: ἀπʼ αὐτοῦ
  choice: devant lui
  rationale: Dans ce contexte de progression au cœur d’une formation, l’expression indique que les rangs s’écartent à son approche. « Devant lui » est l’équivalent français le plus naturel.
- source_word: ἔνθα καὶ ἔνθα
  choice: de part et d’autre
  rationale: La locution grecque évoque une séparation dans les deux directions. « De part et d’autre » préserve ce mouvement bilatéral et fait écho à « à droite et à gauche ».
