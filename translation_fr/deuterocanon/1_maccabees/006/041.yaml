  yaml_path: translation/deuterocanon/1_maccabees/006/041.yaml
  text: And all who heard the sound of their multitude, and the marching of the multitude, and the clashing of the weapons, were shaken; for the camp was exceedingly great and strong.
translation:
  language: fr
  text: Tous ceux qui entendaient le bruit de cette multitude, sa marche et le fracas des armes étaient ébranlés, car le camp était immense et puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: étaient ébranlés
  rationale: L’imparfait passif exprime un bouleversement durable provoqué par ce qu’ils entendaient. « Ébranlés » conserve à la fois la force physique de l’image et son effet émotionnel, sans préciser qu’il s’agissait nécessairement de terreur.
- source_word: φωνῆς πλήθους αὐτῶν
  choice: le bruit de cette multitude
  rationale: Dans ce contexte militaire, φωνή désigne le bruit collectif produit par la masse des soldats plutôt qu’une voix distincte. « Cette multitude » renvoie naturellement au groupe déjà évoqué.
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: sa marche
  rationale: ὁδοιπορία peut désigner un déplacement ou un voyage ; appliqué ici à une force militaire, « marche » rend clairement le mouvement des troupes. Le possessif évite en français une répétition pesante de « multitude ».
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: le fracas des armes
  rationale: συγκρουσμός évoque les chocs répétés de pièces d’équipement les unes contre les autres. « Fracas » restitue naturellement l’image sonore, tandis que « armes » conserve la portée générale de ὅπλα dans ce contexte.
- source_word: παρεμβολὴ
  choice: le camp
  rationale: Le terme désigne couramment un camp ou un campement militaire. « Camp » est direct, naturel et adapté au récit.
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: immense et puissant
  rationale: « Immense » rend avec vigueur μεγάλη σφόδρα, et « puissant » traduit ἰσχυρά en soulignant la force militaire du camp sans alourdir la phrase.
