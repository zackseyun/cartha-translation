base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: fr
  text: Et il arriva que, lorsque le roi entendit ces paroles, il fut frappé de stupeur et profondément ébranlé. Il tomba sur son lit et tomba malade de chagrin, parce que cela ne s’était pas passé pour lui comme il l’avait projeté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que cela ne s’était pas passé pour lui comme il l’avait envisagé » ; littéralement, « parce que cela ne lui était pas arrivé comme il le pensait ».'
    reason: La tournure grecque est impersonnelle, et ἐνεθυμεῖτο peut évoquer ce que le roi pensait, envisageait ou projetait.
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: il arriva que, lorsque […] entendit
  rationale: Cette formulation conserve la transition narrative d’allure sémitique tout en restant claire et digne en français moderne.
- source_word: ἐθαμβήθη
  choice: il fut frappé de stupeur
  rationale: Le verbe exprime un saisissement provoqué par l’étonnement ou le choc; le contexte de mauvaises nouvelles favorise « stupeur » sans imposer l’idée plus forte d’épouvante.
- source_word: ἐσαλεύθη σφόδρα
  choice: profondément ébranlé
  rationale: L’emploi métaphorique de σαλεύω décrit un bouleversement intérieur, tandis que « profondément » rend l’intensité de σφόδρα.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: il se laissa tomber sur son lit
  rationale: La traduction garde l’image concrète de la chute sur le lit sans suggérer nécessairement une perte de connaissance.
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: tomba malade
  rationale: Cette expression idiomatique française rend naturellement l’entrée dans un état de maladie.
- source_word: ἀπὸ τῆς λύπης
  choice: de chagrin
  rationale: La préposition a ici une valeur causale, et λύπη désigne la peine ou le chagrin.
- source_word: οὐκ ἐγένετο αὐτῷ
  choice: les choses ne s’étaient pas passées pour lui
  rationale: Le pluriel idiomatique français explicite légèrement le sujet impersonnel grec tout en conservant la nuance d’un résultat contraire aux attentes du roi.
- source_word: καθὼς ἐνεθυμεῖτο
  choice: comme il l’avait projeté
  rationale: Dans ce contexte, ἐνθυμέομαι renvoie à ce que le roi avait conçu ou prévu; « projeté » préserve la nuance d’intention sans préciser davantage la nature de son dessein.
