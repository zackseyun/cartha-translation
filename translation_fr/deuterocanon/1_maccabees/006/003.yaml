  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: fr
  text: Il vint et chercha à s’emparer de la ville et à la piller, mais il n’y parvint pas, car son projet[a] fut connu des habitants de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’affaire » ou « le dessein ». Le grec λόγος peut désigner une parole, une information, une affaire ou un projet ; ici, le contexte suggère que ses intentions furent découvertes.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  choice: s’emparer de
  rationale: Dans ce contexte militaire, le verbe désigne la prise de contrôle de la ville. « S’emparer de » est naturel en français et conserve l’idée de conquête.
- source_word: προνομεῦσαι
  choice: piller
  rationale: Le verbe évoque le fait d’emporter du butin ou de livrer un lieu au pillage. « Piller » rend directement cette action sans préciser davantage ses modalités.
- source_word: οὐκ ἠδυνάσθη
  choice: il n’y parvint pas
  rationale: Cette formulation idiomatique exprime clairement l’incapacité d’accomplir les actions projetées, tout en évitant une tournure française pesante.
- source_word: ἐγνώσθη
  choice: fut connu
  rationale: Le passif grec est conservé sans préciser de quelle manière l’information fut divulguée.
- source_word: ὁ λόγος
  choice: son projet
  rationale: Dans le contexte, λόγος désigne vraisemblablement l’action qu’il projetait d’accomplir. « Son projet » rend bien la logique du récit, tandis qu’une note préserve l’étendue sémantique du grec.
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: des habitants de la ville
  rationale: L’expression grecque signifie littéralement « ceux de la ville ». « Les habitants de la ville » en donne le sens contextuel en français naturel.
