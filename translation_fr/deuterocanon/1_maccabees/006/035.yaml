  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: fr
  text: 'Ils répartirent les bêtes entre les unités[a]. Auprès de chaque éléphant[b], ils postèrent mille hommes revêtus de cottes de mailles et portant des casques de bronze, ainsi que cinq cents chevaux choisis affectés à chaque bête.


    [a] Ou « dans les formations ». Le sens de l’expression grecque est difficile ici ; dans ce contexte, elle désigne probablement des unités militaires.


    [b] Ou « pour chaque éléphant » ou « à chaque éléphant ». La préposition grecque peut se comprendre de plusieurs manières ici.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les formations ». Le sens de l’expression grecque est difficile ici ; dans ce contexte, elle désigne probablement des unités militaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour chaque éléphant » ou « à chaque éléphant ». La préposition grecque peut se comprendre de plusieurs manières ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: ils répartirent
  rationale: Le verbe peut signifier « diviser » ou « distribuer ». « Répartir » convient naturellement à l’organisation tactique décrite.
- source_word: τὰ θηρία
  choice: les bêtes
  rationale: Traduction directe du grec, qui emploie θηρία avant de préciser ensuite qu’il s’agit d’éléphants.
- source_word: εἰς τὰς φάραγγας
  choice: entre les unités
  rationale: L’expression est difficile. Un sens militaire est probable dans le contexte ; « unités » reste clair sans imposer le terme technique « phalanges », dont la forme grecque attendue serait normalement différente.
- source_word: παρέστησαν
  choice: ils placèrent
  rationale: Dans ce contexte militaire, le verbe indique que les hommes furent postés auprès des éléphants.
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: auprès de chaque éléphant
  rationale: ἐπί avec le datif peut signifier « sur », « à », « auprès de » ou « pour ». « Auprès de » convient au déploiement de mille hommes sans suggérer qu’ils montaient tous l’animal.
- source_word: χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: mille hommes revêtus de cottes de mailles
  rationale: La formulation rend à la fois l’état d’hommes équipés d’une armure et la précision ἁλυσιδωτοῖς, qui évoque une armure faite de mailles.
- source_word: περικεφαλαῖαι χαλκαῖ ἐπὶ τῶν κεφαλῶν αὐτῶν
  choice: portant des casques de bronze
  rationale: Formulation française naturelle qui conserve la matière des casques ; « sur leurs têtes » serait redondant en français.
- source_word: πεντακόσιοι ἵπποι
  choice: cinq cents cavaliers
  rationale: Bien que ἵπποι signifie littéralement « chevaux », dans un déploiement militaire le terme désigne naturellement la cavalerie ou les cavaliers.
- source_word: διατεταγμένοι ἑκάστῳ θηρίῳ ἐκλελεγμένοι
  choice: cavaliers d’élite affectés à chaque bête
  rationale: « D’élite » exprime ici qu’ils avaient été sélectionnés, et « affectés » rend leur assignation tactique à chaque animal.
