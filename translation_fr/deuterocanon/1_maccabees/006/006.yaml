  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: fr
  text: Lysias marcha d’abord avec une force considérable, mais il fut mis en déroute par eux. Quant à eux, ils gagnèrent en puissance grâce aux armes qu’ils avaient prises dans les camps qu’ils avaient détruits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ils l’emportèrent avec les armes qu’ils avaient prises dans les camps qu’ils avaient anéantis ». Le grec peut mettre l’accent soit sur le fait de gagner en puissance, soit sur le fait de l’emporter. La dernière proposition est une tournure militaire condensée : le verbe signifie littéralement « couper » ou « abattre » et peut évoquer la destruction des camps ou, par métonymie, la mise hors de combat des forces qui s’y trouvaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: se mit en marche
  rationale: Dans ce contexte militaire, cette expression française rend le déplacement d’une troupe sans réduire le verbe au simple « aller ».
- source_word: δυνάμει ἰσχυρᾷ
  choice: avec une force puissante
  rationale: δύναμις désigne ici une force militaire. « Force puissante » reste proche du grec sans préciser davantage qu’il ne le fait.
- source_word: ἐν πρώτοις
  choice: au début
  rationale: L’expression situe cette action dans la première phase des événements et prépare le contraste avec le revers de Lysias.
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: il fut repoussé devant eux
  rationale: Le passif de ἀνατρέπω évoque ici une déroute ou un recul imposé; « devant eux » conserve l’image de ἀπὸ προσώπου αὐτῶν.
- source_word: ἴσχυσαν
  choice: ils se fortifièrent
  rationale: Le verbe peut signifier devenir fort ou l’emporter. Avec le datif instrumental ὅπλοις, « se fortifièrent » exprime naturellement l’accroissement de leur puissance grâce aux armes capturées, tout en signalant l’autre possibilité en note.
- source_word: ὅπλοις
  choice: grâce aux armes
  rationale: Cette formulation rend clairement la valeur instrumentale du datif et le sens militaire de ὅπλα.
- source_word: παρεμβολῶν
  choice: camps
  rationale: Dans ce récit militaire, παρεμβολή désigne un camp ou un campement.
- source_word: ἐξέκοψαν
  choice: avaient détruits
  rationale: Le sens concret est « couper, abattre », mais appliqué aux camps dans cette tournure militaire condensée, « détruire » donne un français intelligible sans préciser arbitrairement si le verbe vise les camps ou les forces qui s’y trouvaient.
