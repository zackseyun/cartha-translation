translation_notes:
  register: Français moderne, clair et digne. La reprise « Quant à eux » lève naturellement l’ambiguïté de sujet créée par le passage du singulier Lysias au pluriel grec, sans identifier davantage le groupe. La note préserve les deux valeurs possibles de ἴσχυσαν et le caractère condensé de la proposition finale.
