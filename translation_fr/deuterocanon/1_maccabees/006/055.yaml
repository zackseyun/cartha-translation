base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/055.yaml
  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: fr
  text: Lysias apprit que Philippe, que le roi Antiochos avait désigné, du vivant du roi Antiochos, pour élever son fils Antiochos afin qu’il règne[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il devienne roi ». Le verbe grec peut désigner l’exercice de la royauté ou, dans ce contexte, l’accession au trône.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce contexte, le verbe introduit une nouvelle reçue par Lysias. « Apprit » est plus naturel en français que le calque « entendit ».
- source_word: κατέστησεν
  choice: avait désigné
  rationale: Le verbe exprime ici une nomination officielle à une responsabilité. Le plus-que-parfait marque clairement que cette désignation précède la nouvelle reçue par Lysias.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: de son vivant
  rationale: Cette tournure concise et naturelle renvoie à la période où le roi Antiochos était encore en vie, sans alourdir la phrase.
- source_word: ἐκθρέψαι
  choice: pour élever
  rationale: Le verbe désigne le fait d’assurer la formation et l’éducation d’un enfant. « Élever » convient au contexte d’une charge confiée à Philippe.
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: afin qu’il règne
  rationale: La formulation conserve la valeur de but de la construction grecque et le sens verbal de βασιλεῦσαι, sans préciser davantage les modalités de l’accession au trône.
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: le roi Antiochos
  rationale: Cette formulation suit l’usage idiomatique du français pour un titre placé devant un nom propre.
