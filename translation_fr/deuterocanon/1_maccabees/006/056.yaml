  text: he turned back from Persia and Media[a], and the forces that had gone with the king are with him, and that he is seeking to take over the conduct of affairs;
translation:
  language: fr
  text: qu’il était revenu de Perse et de Médie, que les troupes parties avec le roi étaient avec lui[a], et qu’il cherchait à prendre en main la conduite des affaires ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de cette proposition est syntaxiquement difficile, en particulier l’expression rendue par « les troupes parties avec le roi étaient avec lui ». La traduction reste proche du texte transmis sans trancher davantage la relation exacte entre le roi, les troupes et « lui ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: il était revenu
  rationale: Dans ce discours indirect dépendant du contexte précédent, le plus-que-parfait français exprime naturellement un retour déjà accompli ; « revenir » rend ici le sens contextuel de ἀποστρέφω.
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: de Perse et de Médie
  rationale: Traduction géographique directe et naturelle de la construction avec ἀπό.
- source_word: αἱ δυνάμεις
  choice: les troupes
  rationale: Dans ce récit militaire, δυνάμεις désigne les forces armées ; « troupes » est courant, précis et naturel en français.
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: les troupes parties avec le roi étaient avec lui
  rationale: Le grec transmis est syntaxiquement difficile, notamment par la présence conjointe de τῷ βασιλεῖ et μετʼ αὐτοῦ. La formulation française conserve les deux relations personnelles et supplée « étaient », verbe nécessairement sous-entendu pour former la proposition.
- source_word: ζητεῖ
  choice: il cherchait
  rationale: L’imparfait convient au discours indirect au passé et exprime une intention en cours sans la transformer en fait accompli.
- source_word: παραλαβεῖν
  choice: à prendre en main
  rationale: Dans ce contexte politique, le verbe signifie assumer la maîtrise ou la responsabilité, et non simplement recevoir.
- source_word: τὰ τῶν πραγμάτων
  choice: la conduite des affaires
  rationale: Cette expression idiomatique renvoie à la direction générale des affaires sans imposer la précision moderne « affaires de l’État ».
