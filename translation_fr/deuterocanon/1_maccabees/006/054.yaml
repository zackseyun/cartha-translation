  yaml_path: translation/deuterocanon/1_maccabees/006/054.yaml
  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: fr
  text: Il ne resta que quelques hommes dans le sanctuaire[a], car la famine l’avait emporté sur eux ; ils furent dispersés, chacun vers son propre lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lieu saint » ou « dans les enceintes sacrées ». Le grec dit littéralement « dans les [choses ou lieux] saints », expression liée au Temple qui désigne l’espace sacré.
    reason: Alternative lexicale et préservation de l’ambiguïté spatiale et cultuelle du grec.
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: Il ne resta
  rationale: Le verbe passif exprime la présence d’un reste après le départ des autres. En français, « il ne resta » rend naturellement ce résultat sans alourdir la phrase.
- source_word: ἐν τοῖς ἁγίοις
  choice: dans le sanctuaire
  rationale: L’expression grecque, littéralement « dans les [choses/lieux] saints », désigne ici l’espace sacré du Temple. « Sanctuaire » est clair et idiomatique tout en conservant la référence cultuelle.
- source_word: ἄνδρες ὀλίγοι
  choice: que peu d’hommes
  rationale: ἄνδρες désigne explicitement des hommes, et ὀλίγοι leur petit nombre. Cette formulation française souligne qu’il n’en subsistait qu’un faible effectif.
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: la famine avait pris le dessus sur eux
  rationale: κατακρατέω exprime l’idée de dominer ou de l’emporter sur quelqu’un. « Prendre le dessus » conserve cette image de domination sans suggérer simplement qu’ils avaient faim.
- source_word: ἐσκορπίσθησαν
  choice: Ils se dispersèrent
  rationale: Le passif grec décrit leur dispersion. Le pronominal français est plus naturel et préserve l’idée que le groupe s’est disséminé.
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: chacun vers son propre lieu
  rationale: τόπος signifie largement « lieu » ou « endroit ». La traduction évite de préciser « chez lui », qui ferait du lieu leur domicile sans que le grec l’impose.
theological_decisions:
- issue: Sens spatial et cultuel de ἐν τοῖς ἁγίοις
  choice: dans le sanctuaire
  alternative: dans le lieu saint ; dans les lieux saints
  rationale: Dans ce contexte militaire lié au Temple, l’expression renvoie à l’espace sacré où demeuraient les défenseurs. « Sanctuaire » donne un référent intelligible sans trancher plus précisément entre le bâtiment saint et l’ensemble des enceintes sacrées.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux phrases évite un enchaînement lourd. « Son propre lieu » est volontairement plus formel que « chez lui » afin de ne pas surinterpréter τόπος.
