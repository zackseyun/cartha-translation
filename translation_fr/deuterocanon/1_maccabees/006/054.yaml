revisions:
- from: Il ne resta que peu d’hommes dans le sanctuaire[a], car la famine avait pris le dessus sur eux. Ils se dispersèrent, chacun vers son propre lieu.
  to: Il ne resta que quelques hommes dans le sanctuaire[a], car la famine l’avait emporté sur eux ; ils furent dispersés, chacun vers son propre lieu.
  rationale: La révision améliore l’idiome français et restitue explicitement la voix passive de ἐσκορπίσθησαν. Elle conserve le sens de κατακρατέω par « l’avait emporté sur eux », ne précise pas indûment τόπος comme un domicile, et maintient la note nécessaire sur ἐν τοῖς ἁγίοις.
