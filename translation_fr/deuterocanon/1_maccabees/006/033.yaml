base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: fr
  text: Le roi se leva de bon matin et fit avancer le camp avec tout son élan sur la route de Beth-Zacharia[a]. Les troupes se rangèrent en ordre de bataille, puis on sonna des trompettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la route de Beth-Zacharia ». L’expression grecque peut désigner un déplacement le long de la route qui y mène ou qui passe par là.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  choice: se leva de bon matin
  rationale: Le verbe exprime le fait de se lever ou d’être actif tôt, dès le matin, sans préciser à lui seul le moment du départ.
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: fit avancer le camp
  rationale: Avec παρεμβολή, ἀπαίρω désigne ici la mise en mouvement du camp, c’est-à-dire de l’armée campée. Cette formulation conserve la valeur causative du singulier grec et le contexte militaire.
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: avec tout son élan
  rationale: ὅρμημα évoque l’impulsion, l’élan ou le mouvement d’assaut. La traduction garde cette image dynamique sans la réduire à la seule idée d’effectif complet.
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: sur la route de Beth-Zacharia
  rationale: κατά avec ὁδός indique un déplacement le long d’une route; le génitif français laisse ouverte la nuance de route menant à Beth-Zacharia ou passant par ce lieu.
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: Les troupes se rangèrent en ordre de bataille
  rationale: Le moyen διετάξαντο décrit les forces qui prennent leurs dispositions tactiques en vue du combat.
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: on sonna des trompettes
  rationale: La tournure française rend naturellement le verbe et son instrument apparenté, tout en préservant le pluriel et la fonction de signal militaire.
- source_word: Βεθζαχαριά
  choice: Beth-Zacharia
  rationale: Translittération française claire du toponyme grec, avec une forme familière du nom Zacharia.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Avec tout son élan » préserve l’image militaire et l’ambiguïté de ὁρμήματι plutôt que d’expliciter par « au grand complet » ou « de toutes ses forces ».
