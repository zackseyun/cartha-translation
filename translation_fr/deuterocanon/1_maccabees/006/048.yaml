  text: And from the king’s camp they went up to meet them at Jerusalem[a], and the king encamped in Judea and at Mount Zion.
translation:
  language: fr
  text: Du camp du roi, ils montèrent à leur rencontre à Jérusalem, et le roi établit son camp en Judée et sur le mont Sion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολῆς
  choice: camp
  rationale: Dans ce contexte militaire, παρεμβολή désigne le camp de l’armée. « Camp » est naturel en français moderne.
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe exprime une montée; avec Jérusalem comme destination, « montèrent » conserve la valeur topographique sans ajouter l’idée explicite d’une marche militaire.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: à leur rencontre
  rationale: Cette tournure rend naturellement l’idée de se diriger vers des personnes afin de les rencontrer, tout en laissant ouverte la nature de la rencontre.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans le récit militaire, le verbe signifie installer son camp. Cette formulation est actuelle, claire et plus digne que le familier « campa ».
- source_word: Ἰουδαίαν
  choice: Judée
  rationale: Le terme désigne ici la région géographique et politique de Judée.
- source_word: ὄρος Σιών
  choice: mont Sion
  rationale: C’est la désignation française traditionnelle et transparente du lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le sujet implicite pluriel de ἀνέβησαν est rendu par « Des hommes » afin d’éviter un pronom français sans antécédent explicite dans ce verset isolé; le texte grec ne précise pas davantage leur identité. « Vers Jérusalem » conserve la construction grecque, dont le rapport exact entre la rencontre et Jérusalem demeure légèrement ambigu.
