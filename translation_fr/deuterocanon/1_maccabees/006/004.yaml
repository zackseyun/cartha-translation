  text: And they rose up against him in battle, and he fled and went away from there with great sorrow, to return to Babylon.
translation:
  language: fr
  text: Ils se dressèrent contre lui pour combattre, et il s’enfuit et partit de là avec une grande tristesse, pour retourner à Babylone.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: Ils se dressèrent contre lui pour combattre
  rationale: La tournure exprime une levée hostile contre lui en vue du combat. « Se dressèrent contre lui » conserve l’image du grec, tandis que « pour combattre » rend naturellement εἰς πόλεμον.
- source_word: ἔφυγεν
  choice: il prit la fuite
  rationale: Le verbe signifie directement « fuir ». Cette formulation française garde la netteté et la force narrative de l’action.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: partit de là
  rationale: Cette expression rend à la fois le départ physique et la valeur déictique de ἐκεῖθεν, dans un français courant et concis.
- source_word: μετὰ λύπης μεγάλης
  choice: rempli d’une profonde tristesse
  rationale: λύπη peut désigner la tristesse, le chagrin ou l’affliction. La formulation retenue exprime naturellement en français l’état émotionnel intense indiqué par μεγάλη.
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: pour retourner à Babylone
  rationale: L’infinitif se comprend ici comme indiquant le but du départ. « Retourner » restitue le mouvement de retour porté par ἀποστρέφω, et εἰς marque la destination.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La coordination narrative du grec est légèrement structurée par « Alors » afin d’obtenir une lecture fluide sans modifier la succession des actions. Aucun terme confessionnel ni développement interprétatif n’est ajouté.
