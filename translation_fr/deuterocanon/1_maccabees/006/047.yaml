  text: And they saw the strength of the kingdom and the fierce rush of the forces, and they turned away from them.
translation:
  language: fr
  text: Ils virent la puissance du royaume et l’élan impétueux des forces[a], et ils se détournèrent d’elles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assaut des forces » ou « la charge des troupes ». Le terme grec évoque un puissant mouvement vers l’avant au combat.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « d’elles » au pluriel, probablement en référence aux forces ennemies; l’expression peut aussi reprendre plus largement la puissance royale qui vient d’être évoquée.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: puissance
  rationale: Dans ce contexte politico-militaire, ἰσχύς désigne la force effective du royaume. « Puissance » rend naturellement cette capacité sans la réduire à la seule vigueur physique.
- source_word: βασιλείας
  choice: royaume
  rationale: βασιλεία peut désigner le règne, la royauté ou le royaume. Ici, « royaume » garde la portée institutionnelle et politique du terme tout en convenant au contexte militaire.
- source_word: ὁρμήμα
  choice: élan impétueux
  rationale: ὁρμήμα évoque un mouvement puissant vers l’avant, notamment une ruée ou une charge. « Élan impétueux » conserve cette image dynamique sans préciser plus que le grec la forme exacte de l’attaque.
- source_word: δυνάμεων
  choice: forces
  rationale: Dans un contexte militaire, δυνάμεις désigne les forces armées ou les troupes. « Forces » reste proche du grec et évite une précision indue.
- source_word: ἐξέκλιναν
  choice: se détournèrent
  rationale: ἐκκλίνω signifie se détourner, s’écarter ou dévier. « Se détournèrent » demeure formellement proche du grec, tandis que le contexte permet de comprendre un mouvement de retrait.
- source_word: ἀπʼ αὐτῶν
  choice: d’elles
  rationale: Le pronom grec est au pluriel et renvoie le plus naturellement aux forces qui viennent d’être mentionnées. « D’elles » en préserve le nombre et ne transforme pas explicitement le geste en fuite.
