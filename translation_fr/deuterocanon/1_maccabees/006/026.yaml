  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: fr
  text: Et voici qu’aujourd’hui ils ont établi leur camp contre la citadelle[a], à Jérusalem, afin de s’en emparer ainsi que du sanctuaire; et ils ont fortifié Bethsour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Acra », la citadelle fortifiée de Jérusalem.
    reason: Le grec ἄκρα peut être compris comme un nom commun, « citadelle », ou comme la désignation historique de l’Acra de Jérusalem.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Et voici que
  rationale: Cette formule conserve la fonction de mise en relief de ἰδού dans un français actuel et digne.
- source_word: παρεμβεβλήκασιν
  choice: ils ont établi leur camp contre
  rationale: Le parfait indique une installation militaire déjà accomplie et toujours pertinente; cette formulation évite de préciser indûment qu’un siège formel a commencé.
- source_word: ἐπὶ τὴν ἄκραν
  choice: contre la citadelle
  rationale: ἄκρα désigne une citadelle ou place forte; le nom commun reste immédiatement compréhensible, tandis que l’identification possible à l’Acra est signalée en note.
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: afin de s’en emparer
  rationale: L’infinitif articulé exprime ici le but, et καταλαμβάνω désigne la prise militaire du lieu.
- source_word: τὸ ἁγίασμα
  choice: le sanctuaire
  rationale: Ce terme rend directement le lieu consacré sans ajouter au grec une précision telle que « temple ».
- source_word: τὴν Βεθσούραν
  choice: Bethsour
  rationale: Cette forme française traditionnelle du toponyme rend la forme grecque Βεθσούρα de manière naturelle.
- source_word: ὠχύρωσαν
  choice: ils ont fortifié
  rationale: Le verbe signifie renforcer défensivement ou rendre une place forte; « fortifier » en est l’équivalent militaire direct.
