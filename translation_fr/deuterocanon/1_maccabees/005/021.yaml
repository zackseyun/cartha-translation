  text: And Simon went into Galilee, and fought many battles against the nations; and the nations were crushed before him.
translation:
  language: fr
  text: Simon se rendit en Galilée et livra de nombreux combats contre les nations. Les nations furent écrasées devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: se rendit
  rationale: L’aoriste de πορεύομαι exprime simplement le déplacement. « Se rendit » est naturel dans un récit historique et n’ajoute pas la nuance militaire plus précise de « marcha ».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: Avec un nom de région, le français idiomatique emploie « en ». Cette tournure rend le mouvement vers l’intérieur de la région sans lourdeur.
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: livra de nombreux combats
  rationale: L’expression συνάπτειν πολέμους désigne le fait d’engager ou de mener des affrontements. « Livra de nombreux combats » convient au contexte militaire et évite de présenter chaque affrontement comme une guerre distincte.
- source_word: πρὸς τὰ ἔθνη
  choice: contre les nations
  rationale: Dans ce contexte, ἔθνη désigne les peuples non juifs environnants. « Les nations » conserve le terme collectif grec sans introduire la coloration religieuse plus marquée de « les païens ».
- source_word: συνετρίβη
  choice: furent écrasées
  rationale: Le passif de συντρίβω évoque une défaite écrasante, littéralement le fait d’être brisé ou broyé. « Furent écrasées » préserve cette force mieux que le simple « furent vaincues ».
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: Cette locution signifie ici que les nations furent écrasées face à Simon ou à son avance. « Devant lui » conserve l’image et reste idiomatique en français.
