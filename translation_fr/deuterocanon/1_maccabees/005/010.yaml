  text: And they sent letters to Judas and his brothers[a], saying, “The nations around us have gathered together against us to destroy us,”
translation:
  language: fr
  text: 'Ils envoyèrent des lettres à Judas et à ses frères, disant : « Les nations qui nous entourent se sont rassemblées contre nous pour nous exterminer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν γράμματα
  choice: Ils envoyèrent des lettres
  rationale: Le passé simple convient au registre narratif historique et « lettres » rend naturellement les communications écrites.
- source_word: Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: à Judas et à ses frères
  rationale: « Judas » est la forme française traditionnelle du nom dans 1 Maccabées; le contexte désigne ses frères masculins, ses collaborateurs dans le récit.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: se sont rassemblées
  rationale: Cette tournure rend l’état présent résultant du rassemblement exprimé par la construction périphrastique au parfait, dans un français naturel.
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  choice: les nations qui nous entourent
  rationale: « Nations » conserve le sens ethnopolitique sans introduire les connotations ultérieures de « païens »; la relative exprime clairement leur situation géographique.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: pour nous exterminer
  rationale: L’infinitif articulé exprime ici le but hostile; « exterminer » communique l’idée d’élimination totale de façon précise et digne.
theological_decisions:
- issue: Sens de τὰ ἔθνη dans ce contexte historique deutérocanonique
  choice: les nations
  alternative: les païens
  rationale: Le terme désigne ici les peuples non juifs environnants sous un angle ethnopolitique; « nations » évite d’importer une catégorie théologique plus chargée.
- issue: Portée de τοὺς ἀδελφοὺς αὐτοῦ
  choice: ses frères
  alternative: ses proches
  rationale: Dans le récit, il s’agit des frères masculins de Judas; une formulation inclusive ou élargie serait moins exacte.
- issue: Intensité de ἐξᾶραι
  choice: nous exterminer
  alternative: nous détruire
  rationale: Le contexte indique une volonté d’élimination collective. « Exterminer » conserve cette force sans atténuer la menace, tandis que « détruire » reste possible mais moins précis.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; la citation reste directe et énergique.
