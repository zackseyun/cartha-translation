lexical_decisions:
- source_word: ἀπῆρεν
  choice: partit
  rationale: L’aoriste exprime ici le départ d’un lieu; « partit » est naturel et précis dans ce récit de déplacement.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: L’adverbe indique simplement le point de départ.
- source_word: νυκτός
  choice: pendant la nuit
  rationale: Le génitif a une valeur adverbiale et situe le déplacement de nuit, sans préciser davantage le moment.
- source_word: ἐπορεύετο
  choice: poursuivit sa route
  rationale: L’imparfait présente le déplacement dans son déroulement; cette formulation française rend la progression sans lourdeur.
- source_word: ἕως ἐπὶ
  choice: jusqu’à
  rationale: La locution marque le terme spatial du déplacement tout en évitant d’ajouter explicitement un verbe d’arrivée.
- source_word: ὀχύρωμα
  choice: place forte
  rationale: Le terme désigne un lieu fortifié; « place forte » conserve cette portée générale sans imposer un type précis d’ouvrage.
