  yaml_path: translation/deuterocanon/1_maccabees/005/001.yaml
  text: And it happened that when the surrounding nations heard that the altar had been rebuilt and the sanctuary rededicated as before, they became very angry.
translation:
  language: fr
  text: Quand les nations des alentours apprirent que l’autel avait été rebâti et que le sanctuaire avait été consacré de nouveau comme auparavant, elles entrèrent dans une grande colère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quand
  rationale: La formule narrative d’influence sémitique introduit ici la circonstance temporelle. En français moderne, « Quand » en restitue naturellement la fonction sans alourdir la phrase.
- source_word: τὰ ἔθνη κυκλόθεν
  choice: les nations des alentours
  rationale: Cette expression conserve le terme collectif « nations » et le sens géographique de κυκλόθεν, tout en restant idiomatique en français.
- source_word: ᾠκοδομήθη τὸ θυσιαστήριον
  choice: l’autel avait été rebâti
  rationale: Le contexte est celui de la restauration après la profanation ; « rebâti » explicite justement cette reconstruction. Le plus-que-parfait marque l’antériorité par rapport à ce que les nations apprennent.
- source_word: ἐνεκαινίσθη τὸ ἁγίασμα
  choice: le sanctuaire avait été consacré de nouveau
  rationale: Dans le contexte cultuel, le verbe désigne le renouvellement de la consécration. Cette formulation est claire et conserve davantage la composition du grec que le seul verbe « reconsacrer ».
- source_word: ὡς τὸ πρότερον
  choice: comme auparavant
  rationale: La formule exprime le rétablissement de l’état antérieur de manière concise et naturelle.
- source_word: ὠργίσθη σφόδρα
  choice: elles entrèrent dans une grande colère
  rationale: Le tour rend le changement d’état exprimé par l’aoriste et l’intensité de σφόδρα, dans un registre narratif digne.
theological_decisions:
- issue: Référence de τὰ ἔθνη dans ce récit historique juif
  choice: les nations des alentours
  alternative: les païens des alentours
  rationale: Le grec dit littéralement « les nations » et le contexte permet de comprendre qu’il s’agit des peuples non juifs voisins. Le choix retenu préserve cette formulation sans introduire la nuance religieuse plus interprétative de « païens ».
translation_notes:
  register: Français international moderne, clair et digne. La formule grecque Καὶ ἐγένετο ὅτε n’est pas reproduite littéralement par « Et il arriva que », jugé inutilement archaïsant ; sa fonction narrative et temporelle est rendue par « Quand ».
