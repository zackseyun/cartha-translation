  text: And he said to the men of the force[b][a], “Fight today for our brothers.”
translation:
  language: fr
  text: 'Et il dit aux hommes de l’armée[a] : « Combattez aujourd’hui pour nos frères[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux hommes de la force » ; le grec peut désigner ici les soldats ou les guerriers.'
