  - marker: b
    text: Le mot « frères » peut désigner ici, au sens large, les autres Israélites, et pas seulement des frères biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: aux hommes de l’armée
  rationale: Cette formulation conserve la mention explicite des hommes (ἀνδράσιν) et rend le sens militaire de δύναμις par « armée », terme naturel en français moderne.
- source_word: Πολεμήσατε
  choice: Combattez
  rationale: L’impératif aoriste appelle à une action militaire immédiate ; « Combattez » est direct, idiomatique et solennel sans être archaïque.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Le terme marque l’urgence du moment présent et reçoit son équivalent français courant.
- source_word: ὑπὲρ
  choice: pour
  rationale: Dans ce contexte de combat, la préposition exprime l’action menée en faveur ou pour la défense d’autrui ; « pour » préserve cette amplitude sans la préciser excessivement.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: nos frères
  rationale: Le grec emploie le masculin pluriel ἀδελφῶν. « Nos frères » en conserve la forme et l’idée de solidarité communautaire, tout en laissant ouverte l’étendue exacte du groupe visé.
theological_decisions:
- issue: Portée du terme de parenté ἀδελφῶν
  choice: nos frères
  alternative: nos compatriotes / les membres de notre peuple
  rationale: Le texte grec dit littéralement « frères », mais le mot peut désigner plus largement les autres Israélites. La traduction maintient l’image familiale et signale en note sa possible portée collective.
translation_notes:
  register: Français international moderne, direct et digne. La structure brève de l’exhortation grecque est conservée, ainsi que son urgence militaire et son langage masculin explicite.
