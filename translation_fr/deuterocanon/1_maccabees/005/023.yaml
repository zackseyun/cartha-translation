  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: fr
  text: Il les emmena de Galilée et d’Arbactis[a], avec les femmes, les enfants et tout ce qu’ils possédaient, et ils les conduisirent[b] en Judée dans une grande allégresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à Arbactis ». Dans ce contexte de déplacement, le sens paraît être « d’Arbactis ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec passe ici du singulier (« il les emmena ») au pluriel (« ils les conduisirent »). La traduction conserve ce changement tel qu’il a été transmis.
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: emmena
  rationale: Dans ce récit, le verbe désigne le fait de prendre ces personnes avec soi pour les conduire en lieu sûr. « Emmena » exprime naturellement ce mouvement sans réduire le sens à une simple réception.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: de Galilée
  rationale: La préposition marque clairement le lieu de départ; « Galilée » est la forme française usuelle du nom géographique.
- source_word: ἐν Ἀρβάκτοις
  choice: d’Arbactis
  rationale: Le grec transmis porte littéralement « à Arbactis », mais la coordination avec « de Galilée » et le mouvement vers la Judée indiquent ici une provenance. La note conserve l’information sur la formulation grecque.
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: avec les femmes, les enfants
  rationale: Le grec dit « les femmes » et « les enfants » sans préciser qu’il s’agit exclusivement des épouses; la traduction évite donc d’ajouter ce lien familial.
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: tout ce qu’ils possédaient
  rationale: Cette expression englobe leurs biens sans en préciser la nature. La formulation française est large, claire et naturelle.
- source_word: ἤγαγον
  choice: ils les conduisirent
  rationale: Le verbe grec est au pluriel, contrairement au verbe singulier qui ouvre le verset. La traduction maintient ce changement de nombre au lieu de l’harmoniser.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: en Judée
  rationale: En français, « conduire en Judée » exprime naturellement le mouvement vers l’intérieur de cette région.
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: dans une grande allégresse
  rationale: L’expression évoque une joie vive et collective. « Grande allégresse » convient au ton narratif et célébratif du passage.
