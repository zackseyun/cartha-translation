base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: fr
  text: Judas et ses frères partirent, et ils combattirent les fils d’Ésaü[a] dans le pays situé au sud. Judas frappa Hébron et les localités qui en dépendaient[b] ; il démolit sa forteresse et incendia ses tours de tous côtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire les Édomites ; littéralement : « les fils d’Ésaü ».'
    reason: alternative_reading
  - marker: b
    text: L’expression désigne les petites villes et les villages placés sous l’autorité d’une ville principale.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans ce récit de campagne, « partit » rend naturellement l’aoriste sans ajouter la nuance plus précise de « se mit en marche ».
- source_word: ἐπολέμουν
  choice: combattirent
  rationale: Le passé simple convient au récit français ; le contexte exprime suffisamment l’action militaire, même si l’imparfait grec peut présenter le combat dans son déroulement.
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: les fils d’Ésaü
  rationale: La traduction conserve l’expression grecque et sa résonance biblique, sans la remplacer dans le texte par l’identification interprétative « les Édomites ».
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: dans le pays situé au sud
  rationale: Cette formulation rend le sens géographique littéral sans transformer la désignation descriptive en nom propre « Néguev ».
- source_word: ἐπάταξεν
  choice: Judas attaqua
  rationale: « Attaqua » exprime naturellement la force militaire de πατάσσω sans affirmer explicitement une victoire. La reprise de « Judas » clarifie le passage du sujet pluriel au verbe singulier.
- source_word: τὰς θυγατέρας αὐτῆς
  choice: les localités qui en dépendaient
  rationale: Cette équivalence transmet clairement l’idiome géographique désignant les agglomérations satellites d’une ville principale.
- source_word: καθεῖλεν τὸ ὀχύρωμα αὐτῆς
  choice: il démolit sa forteresse
  rationale: « Démolit » rend l’abattage d’un ouvrage défensif, et « forteresse » traduit sobrement ὀχύρωμα.
- source_word: τοὺς πύργους αὐτῆς ἐνεπύρισεν κυκλόθεν
  choice: mit le feu aux tours qui l’entouraient
  rationale: Le contexte permet de rattacher κυκλόθεν à la disposition des tours autour de la ville ou de la forteresse ; la formulation française est naturelle tout en conservant cette idée d’encerclement.
theological_decisions:
- issue: Désignation ethnique ou expression de parenté dans τοὺς υἱοὺς Ἠσαῦ
  choice: les fils d’Ésaü
  alternative: les Édomites ; les descendants d’Ésaü
  rationale: Le maintien de l’expression littérale préserve le lien intertextuel avec Ésaü et les relations entre Israël et Édom, sans imposer l’explicitation ethnique dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre historique sans archaïsme marqué. Les formulations explicatives restent dans les notes afin de préserver dans le texte l’expression biblique « fils d’Ésaü ».
