revisions:
- from: Judas partit avec ses frères, et ils combattirent les fils d’Ésaü[a] dans le pays situé au sud. Judas attaqua Hébron et les localités qui en dépendaient[b] ; il démolit sa forteresse et mit le feu aux tours qui l’entouraient.
  to: Judas et ses frères partirent, et ils combattirent les fils d’Ésaü[a] dans le pays situé au sud. Judas frappa Hébron et les localités qui en dépendaient[b] ; il démolit sa forteresse et incendia ses tours de tous côtés.
  rationale: La révision corrige la portée de l’adverbe κυκλόθεν, qui décrit l’action d’incendier plutôt que la position des tours, et emploie « frappa » pour une correspondance plus directe avec ἐπάταξεν. Le reste du texte et les ancres de notes sont conservés.
