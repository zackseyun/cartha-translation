lexical_decisions:
- source_word: ἐπισυνήγοντο
  choice: se rassemblaient
  rationale: L’imparfait exprime un mouvement collectif en cours ou répété; le pronominal français rend naturellement ici la valeur moyenne de ἐπισυνάγω.
- source_word: πρὸς αὐτούς
  choice: autour d’eux
  rationale: Avec l’idée de rassemblement, πρός suivi de l’accusatif indique un mouvement vers le groupe; «autour d’eux» produit un français naturel tout en conservant cette orientation.
- source_word: εὐφημοῦντες
  choice: en les acclamant
  rationale: Le participe exprime des paroles favorables ou approbatrices. «En les acclamant» convient à une foule qui se rassemble, sans préciser davantage la forme de cette approbation.
