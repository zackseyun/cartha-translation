  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
translation:
  language: fr
  text: Les hommes de la ville[a] établirent leur camp, puis ils combattirent contre la ville durant toute cette journée et toute la nuit. La ville fut livrée entre ses mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « les hommes de la ville », bien que la suite dise qu’ils combattirent contre la ville. L’expression est conservée malgré cette difficulté apparente.
    reason: textual_difficulty
  - marker: b
    text: 'Littéralement : « entre ses mains », au singulier. Certains traduisent au pluriel pour l’accorder avec les sujets précédents, mais le grec porte ici un singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρενέβαλον
  choice: établirent leur camp
  rationale: Le verbe désigne ordinairement l’action d’établir un camp ou de prendre position. Cette formulation conserve ici son image militaire concrète sans la réduire à une simple attaque.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: les hommes de la ville
  rationale: 'Traduction directe de l’expression grecque : ἄνδρες désigne des hommes, et πόλεως, la ville. L’apparente difficulté contextuelle n’est pas corrigée silencieusement.'
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: ils combattirent contre la ville
  rationale: Le verbe exprime le fait de combattre ou de faire la guerre ; en français, « contre » rend naturellement la relation avec son complément direct grec.
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: durant toute cette journée et toute la nuit
  rationale: La répétition de ὅλην est conservée par « toute », tandis que « durant » exprime clairement la durée continue.
- source_word: παρεδόθη
  choice: fut livrée
  rationale: Le passif grec est maintenu et l’agent demeure implicite, comme dans le texte source.
- source_word: ἐν χερσὶν αὐτοῦ
  choice: entre ses mains
  rationale: L’expression idiomatique française conserve le possessif singulier correspondant à αὐτοῦ, malgré les sujets pluriels qui précèdent.
theological_decisions:
- issue: Passage du pluriel au singulier dans la dernière proposition
  choice: conserver « entre ses mains » au singulier
  alternative: « entre leurs mains »
  rationale: Le grec porte explicitement le singulier αὐτοῦ. Le lisser au pluriel supprimerait une ambiguïté réelle du texte, qui peut viser un chef représentant l’ensemble des combattants.
- issue: Tension entre « les hommes de la ville » et le combat contre « la ville »
  choice: conserver les deux expressions et signaler la difficulté
  alternative: corriger « les hommes de la ville » en « les hommes de l’armée » ou omettre « contre la ville »
  rationale: Le texte grec fourni lit bien πόλεως dans les deux expressions. Une correction contextuelle ne doit pas être introduite sans témoin textuel explicite.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans archaïsme excessif. « Puis » clarifie la succession des actions sans modifier leur rapport logique.
