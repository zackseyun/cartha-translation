base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: fr
  text: 'Lorsque Judas approcha de l’oued[a], il posta les scribes du peuple[b] au bord de l’oued et leur donna cet ordre : « Ne laissez personne camper, mais que tous viennent au combat. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torrent », « ruisseau » ou « lit de cours d’eau ». Le grec désigne un cours d’eau souvent saisonnier ou le ravin dans lequel il coule.
    reason: lexical_alternative
  - marker: b
    text: Les « scribes du peuple » pouvaient être des secrétaires, des greffiers ou des responsables administratifs au service de l’armée; le texte grec les appelle littéralement « scribes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: approcha
  rationale: Le verbe exprime simplement l’approche d’un lieu; « approcha » est naturel dans le récit et conserve le mouvement.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: oued
  rationale: χειμάρρους désigne un cours d’eau, souvent saisonnier, ou son lit. « Oued » rend avec concision cette réalité géographique; le génitif τοῦ ὕδατος précise la nature du lieu sans exiger en français l’expression redondante « oued d’eau ».
- source_word: ἔστησεν
  choice: posta
  rationale: Dans ce contexte militaire, « posta » exprime clairement le fait de placer des personnes à un endroit déterminé en vue d’une tâche.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: les scribes du peuple
  rationale: La traduction conserve le sens lexical de γραμματεῖς sans décider si ces hommes exerçaient ici plus précisément une fonction de secrétaires, de greffiers ou d’officiers administratifs.
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: au bord de l’oued
  rationale: Avec le génitif, ἐπί indique ici une position près du cours d’eau; « au bord de » est précis et idiomatique.
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: Ne laissez personne camper
  rationale: La construction interdit de permettre l’action. « Personne » rend naturellement le singulier générique ἄνθρωπον, tandis que « camper » conserve le sens militaire de παρεμβάλλω.
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: que tous viennent au combat
  rationale: Cette formulation conserve à la fois l’impératif, l’universalité de πάντες, le mouvement exprimé par ἐρχέσθωσαν et l’engagement militaire désigné par πόλεμος.
