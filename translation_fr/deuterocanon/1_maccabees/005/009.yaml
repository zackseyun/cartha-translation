translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement divisée en deux phrases pour éviter une coordination ambiguë et rendre explicite que ce sont les Israélites qui fuient. Le marqueur [a] figure immédiatement après l’expression concernée.
