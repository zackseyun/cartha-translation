  text: And the nations in Gilead gathered together against the Israelites who were within their borders[a], to wipe them out; and they fled into the stronghold at Dathema.
translation:
  language: fr
  text: Les nations qui se trouvaient en Galaad se rassemblèrent contre les Israélites qui se trouvaient sur leur territoire, afin de les éliminer[a]. Ceux-ci s’enfuirent dans la forteresse de Dathema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les faire disparaître », « les détruire » ou « les arracher ». Le verbe grec exprime l’intention de les éliminer complètement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se rassemblèrent
  rationale: Le verbe composé exprime le regroupement collectif des nations dans une intention hostile; « se rassemblèrent » est naturel et précis.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Dans ce contexte, l’expression désigne les peuples non israélites environnants. « Les nations » conserve la formulation grecque sans imposer les connotations plus tardives de « païens ».
- source_word: τὰ ἐν τῇ Γαλααδίτιδι
  choice: qui se trouvaient en Galaad
  rationale: La tournure identifie les nations présentes dans la région de Galaad; cette formulation française rend clairement la portée géographique.
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: contre les Israélites
  rationale: Le grec dit littéralement « contre Israël », mais le participe pluriel qui suit montre qu’il s’agit des membres du peuple établis dans la région.
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: établis sur leur territoire
  rationale: ὅρια peut désigner les limites ou le territoire délimité. Ici, le possessif renvoie naturellement aux nations de Galaad; « sur leur territoire » préserve la relation territoriale sans suggérer uniquement une ligne frontalière.
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: afin de les faire disparaître
  rationale: ἐξαίρω exprime ici l’intention de supprimer ou d’éliminer complètement les Israélites. La formulation est forte, actuelle et laisse la note signaler les autres nuances possibles.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Rendu narratif direct du verbe « fuir ». Le démonstratif « Ceux-ci » clarifie que le sujet implicite désigne les Israélites menacés.
- source_word: Δάθεμα
  choice: Datéma
  rationale: Transcription française régulière du nom grec, avec accent graphique indiquant naturellement la prononciation.
- source_word: τὸ ὀχύρωμα
  choice: la forteresse
  rationale: Le nom désigne un ouvrage ou un lieu fortifié; « forteresse » est clair et idiomatique en français contemporain.
