  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
translation:
  language: fr
  text: 'Judas leur envoya un message de paix en disant : « Nous traverserons votre territoire pour aller dans notre pays. Personne ne vous fera de mal ; nous ne ferons que passer à pied. » Mais ils ne voulurent pas lui ouvrir[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ne précise pas ce qu’ils refusèrent d’ouvrir : probablement la ville ou ses portes, et donc l’accès et le passage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: un message de paix
  rationale: L’expression désigne ici une communication aux intentions pacifiques. « Un message de paix » est naturel en français moderne et conserve la tonalité diplomatique du grec.
- source_word: Διελευσόμεθα
  choice: Nous traverserons
  rationale: Le futur de διέρχομαι exprime le passage projeté à travers un territoire. « Traverserons » est précis et idiomatique.
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: pour aller dans notre pays
  rationale: L’infinitif articulé exprime le but. « Aller » évite d’ajouter l’idée explicite d’un retour, absente du grec, tandis que « pays » rend naturellement γῆν dans ce contexte territorial.
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: Personne ne vous fera de mal
  rationale: κακοποιέω signifie ici causer du tort ou nuire. Cette formulation est claire, concise et adaptée au contexte militaire et diplomatique.
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: nous ne ferons que passer à pied
  rationale: La tournure souligne qu’il ne s’agira que d’un passage sans hostilité. « À pied » préserve l’image explicite des pieds sans alourdir le français.
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: ils ne voulurent pas lui ouvrir
  rationale: Cette traduction reste proche du grec, qui laisse inexprimé ce qui devait être ouvert, probablement la ville ou ses portes, et évite de résoudre silencieusement cette ellipse.
