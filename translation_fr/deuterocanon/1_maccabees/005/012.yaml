  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
translation:
  language: fr
  text: Viens donc maintenant nous délivrer de leur main[a], car beaucoup d’entre nous sont tombés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de leur main », expression qui désigne ici leur pouvoir ou leur domination hostile.
    reason: idiome_source
  - marker: b
    text: Ou « ont péri » ou « ont été vaincus ». Le grec dit « sont tombés » sans préciser si l’accent porte sur la mort, la défaite ou les deux.
    reason: ambiguite_lexicale
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois la valeur temporelle de νῦν et la nuance de conséquence ou de transition urgente portée par οὖν.
- source_word: ἐλθὼν
  choice: viens
  rationale: Le participe aoriste se joint idiomatiquement à l’impératif suivant; en français naturel, l’appel direct se rend par « viens nous délivrer ».
- source_word: ἔξελου
  choice: délivrer
  rationale: Dans ce contexte, ἐξαιρέω désigne l’action d’arracher quelqu’un à un danger ou à un pouvoir hostile. « Délivrer » convient au registre digne du récit sans préciser davantage le mode du secours.
- source_word: ἐκ χειρὸς αὐτῶν
  choice: de leur main
  rationale: Maintient la métaphore grecque traditionnelle de la main comme expression de la domination ou du pouvoir hostile, tout en restant intelligible en français.
- source_word: πέπτωκεν
  choice: sont tombés
  rationale: Le parfait de πίπτω évoque ici des personnes tombées au combat, mais ne tranche pas explicitement entre mort, défaite ou les deux; « sont tombés » préserve cette ambiguïté.
- source_word: ἐξ ἡμῶν
  choice: d’entre nous
  rationale: 'Rend directement l’idée partitive du grec: les personnes tombées appartiennent au groupe qui parle.'
- source_word: πλῆθος
  choice: beaucoup
  rationale: Dans la construction πλῆθος ἐξ ἡμῶν, « beaucoup d’entre nous » exprime naturellement en français le grand nombre indiqué par πλῆθος, sans lourdeur.
theological_decisions:
- issue: Portée de πέπτωκεν dans le contexte militaire
  choice: sont tombés
  alternative: ont péri / ont été vaincus
  rationale: Le grec permet d’évoquer la mort au combat ou la défaite sans les distinguer nettement. La traduction ne doit pas résoudre cette tension à la place du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’urgence de l’appel, la métaphore de la « main » et l’ambiguïté militaire de « tomber ».
