  text: And Judas gathered all Israel who were in Gilead[a], from the least to the greatest, along with their wives and their children and their baggage, a very great company, to come into the land of Judah.
translation:
  language: fr
  text: Judas rassembla tous les Israélites qui se trouvaient en Galaad, du plus petit au plus grand, avec leurs femmes, leurs enfants et leurs bagages — une foule immense[a] —, pour se rendre au pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un camp immense ». Le grec παρεμβολή peut désigner un camp, surtout dans un contexte militaire, mais il renvoie ici plus largement au groupe rassemblé avec les familles et les bagages.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: rassembla
  rationale: L’aoriste de συνάγω décrit ici l’action de réunir des personnes en vue d’un déplacement; « rassembla » est direct et naturel.
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: tous les Israélites qui se trouvaient en Galaad
  rationale: Dans ce contexte, « tout Israël » désigne l’ensemble de la population israélite présente en Galaad. Cette formulation rend clairement ce sens en français courant.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: du plus petit au plus grand
  rationale: Cette expression consacrée marque une totalité sans la limiter explicitement à l’âge ou au rang social.
- source_word: ἀποσκευήν
  choice: bagages
  rationale: ἀποσκευή désigne les biens et effets transportés par un groupe en déplacement; « bagages » en est ici l’équivalent le plus précis.
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: une troupe immense
  rationale: παρεμβολή peut désigner un camp, notamment militaire, mais résume ici le vaste groupe composé de familles avec leurs bagages. « Troupe » conserve une légère coloration collective sans réduire le groupe aux combattants.
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: pour se rendre au pays de Juda
  rationale: L’infinitif indique le but du rassemblement. « Se rendre au pays de Juda » est idiomatique et respecte le mouvement vers cette région.
