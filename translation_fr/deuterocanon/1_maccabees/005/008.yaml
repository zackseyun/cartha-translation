lexical_decisions:
- source_word: προκατελάβε
  choice: s’empara de
  rationale: Dans ce contexte militaire, le verbe composé indique la prise de possession d’un lieu. « S’empara de » rend naturellement cette action sans surtraduire la valeur du préverbe προ-.
- source_word: Ἰαζὴρ
  choice: Yazer
  rationale: Transcription française biblique usuelle du nom de lieu grec Ἰαζήρ.
- source_word: θυγατέρας
  choice: localités qui en dépendaient
  rationale: Littéralement « filles », ce terme désigne ici les agglomérations secondaires rattachées à une ville principale. Cette formulation explicite l’idiome géographique en français actuel.
- source_word: ἀπέστρεψεν
  choice: retourna
  rationale: Le verbe signifie revenir ou faire demi-tour ; « retourna » convient au récit militaire concis.
- source_word: Ἰουδαίαν
  choice: Judée
  rationale: Ἰουδαία désigne ici la région de Judée, selon l’usage hellénistique.
