  text: And Judas was gathering up those who were falling behind and encouraging the people all along the way[a], until he came into the land of Judah.
translation:
  language: fr
  text: Judas rassemblait ceux qui restaient en arrière et encourageait le peuple tout au long du chemin[a], jusqu’à son arrivée au pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui fermaient la marche ». Le grec désigne probablement des personnes restées à l’arrière ou qui peinaient à suivre pendant la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγων
  choice: rassemblait
  rationale: 'Le participe exprime une action continue : Judas regroupait ceux qui s’étaient espacés pendant la marche. « Rassemblait » est naturel en français et conserve l’idée de réunir des personnes dispersées.'
- source_word: τοὺς ἐσχατίζοντας
  choice: ceux qui restaient en arrière
  rationale: Le verbe désigne ici ceux qui se trouvent à l’extrémité ou à l’arrière de la colonne, probablement des personnes qui peinent à suivre. Cette formulation préserve le caractère descriptif sans supposer un arrière-garde militaire organisée.
- source_word: παρακαλῶν
  choice: encourageait
  rationale: Dans le contexte de la marche, παρακαλέω peut évoquer à la fois l’exhortation et le soutien moral. « Encourageait » rend naturellement cette amplitude sans durcir le sens.
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Le grec emploie le terme général λαός. « Le peuple » évite de le réduire aux seuls soldats, même si le contexte est celui d’une expédition militaire.
- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: tout au long du chemin
  rationale: Cette tournure restitue l’idée distributive d’une action poursuivie sur l’ensemble du trajet.
- source_word: γῆν Ἰούδα
  choice: pays de Juda
  rationale: La formulation reste proche du grec « terre/pays de Juda » tout en étant idiomatique en français biblique moderne. Elle ne substitue pas automatiquement le nom géographique « Judée ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’imparfait rend les deux participes grecs comme des actions continues et simultanées durant le trajet; « jusqu’à son arrivée » évite une répétition lourde de « il » tout en rendant ἕως ἦλθεν.
