  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
translation:
  language: fr
  text: Et il se souvint du mal commis par les fils de Baïan[a], qui étaient pour le peuple un piège et une occasion de chute, en lui tendant des embuscades sur les routes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fils de Béan » ; le nom propre grec Βαιάν peut être transcrit de plusieurs façons.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: il se souvint
  rationale: Rend directement l’aoriste de μιμνῄσκομαι et présente le souvenir de l’hostilité passée comme le motif de l’action suivante.
- source_word: κακίας
  choice: du mal commis
  rationale: κακία désigne ici les agissements hostiles du groupe. « Du mal commis » exprime clairement ce sens narratif sans préciser indûment s’il s’agit de méchanceté, de malveillance ou de crimes particuliers.
- source_word: υἱῶν Βαιάν
  choice: les fils de Baïan
  rationale: Conserve la formulation généalogique ou clanique du grec sans la réduire explicitement à des descendants. Le tréma rend la suite vocalique naturelle et non ambiguë en français.
- source_word: παγίδα
  choice: un piège
  rationale: « Piège » garde l’image d’un danger préparé contre autrui tout en étant idiomatique en français moderne.
- source_word: σκάνδαλον
  choice: une occasion de chute
  rationale: Cette expression préserve la métaphore de σκάνδαλον, en parallèle avec « piège », sans lui imposer le sens moderne plus étroit de « scandale ».
- source_word: ἐν τῷ ἐνεδρεύειν αὐτοὺς
  choice: en lui tendant des embuscades
  rationale: La construction « en » suivie du participe présent conserve la valeur circonstancielle ou instrumentale de l’infinitif grec. « Lui » reprend le collectif singulier « le peuple ».
- source_word: ἐν ταῖς ὁδοῖς
  choice: sur les routes
  rationale: Rend naturellement les voies de déplacement où les embuscades étaient organisées.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve les deux images coordonnées du grec et l’ambiguïté circonstancielle ou instrumentale de ἐν τῷ ἐνεδρεύειν.
