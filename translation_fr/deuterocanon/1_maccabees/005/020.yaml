  text: And three thousand men were assigned to Simon to go into Galilee, but eight thousand men to Judas into Gilead.
translation:
  language: fr
  text: On attribua à Simon trois mille hommes pour aller en Galilée, et à Judas huit mille hommes pour aller en Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: On attribua
  rationale: Le passif de μερίζω désigne ici la répartition de troupes entre des chefs. « On attribua » rend naturellement ce sens administratif et militaire, sans imposer l’idée qu’on aurait divisé les hommes eux-mêmes.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec dit explicitement « hommes ». Le contexte indique qu’il s’agit de combattants, mais « hommes » préserve la formulation de la source sans ajouter une précision interprétative.
- source_word: τρισχίλιοι
  choice: trois mille
  rationale: Rendu direct du nombre grec.
- source_word: τοῦ πορευθῆναι
  choice: pour aller
  rationale: L’infinitif articulé exprime le but. « Pour aller » est simple et exact; « pour marcher » ajouterait une nuance militaire qui n’est pas explicite dans le verbe.
- source_word: Γαλιλαίαν
  choice: Galilée
  rationale: Forme française usuelle du nom géographique.
- source_word: Ἰούδα
  choice: Judas
  rationale: Forme française traditionnelle du nom personnel Ἰούδας dans 1 Maccabées; « Juda » pourrait davantage évoquer la tribu ou le territoire dans certains contextes.
- source_word: ὀκτακισχίλιοι
  choice: huit mille
  rationale: Rendu direct du nombre grec.
- source_word: Γαλααδῖτιν
  choice: Galaad
  rationale: Nom français biblique usuel de la région désignée par le grec Γαλααδῖτις.
