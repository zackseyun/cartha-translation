  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
translation:
  language: fr
  text: Et il y eut une grande déroute parmi le peuple[a], parce qu’ils n’avaient pas écouté Judas et ses frères, pensant qu’ils feraient eux-mêmes preuve de bravoure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lourde défaite » ou « une grande panique » ; le terme grec évoque un retournement en fuite, d’où « déroute ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pensant qu’ils agiraient eux-mêmes vaillamment » ou « qu’ils se distingueraient eux-mêmes par leur bravoure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπὴ μεγάλη
  choice: une lourde défaite
  rationale: Dans ce contexte militaire, τροπή désigne la mise en fuite ou la déroute. « Lourde défaite » exprime naturellement en français l’effondrement subi, tandis que la note conserve les nuances plus concrètes du grec.
- source_word: ἐν τῷ λαῷ
  choice: le peuple subit
  rationale: λαός signifie littéralement « peuple ». La reformulation syntaxique française conserve ce référent sans le réduire explicitement à l’armée ou aux troupes.
- source_word: οὐκ ἤκουσαν
  choice: n’avaient pas écouté
  rationale: Avec le génitif, ἀκούω signifie ici écouter quelqu’un, avec l’implication de tenir compte de ses instructions. Le plus-que-parfait rend clairement l’antériorité par rapport à la défaite.
- source_word: Ἰούδα
  choice: Judas
  rationale: « Judas » est la forme française traditionnelle du nom personnel dans 1 Maccabées.
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: ses frères
  rationale: Le contexte désigne les frères de Judas au sens familial; cette formulation est exacte et naturelle.
- source_word: οἰόμενοι
  choice: s’imaginant
  rationale: Le participe exprime la conviction présomptueuse qui motive leur conduite; « s’imaginant » restitue cette nuance sans ajout doctrinal.
- source_word: ἀνδραγαθῆσαι
  choice: accomplir des exploits
  rationale: Le verbe signifie agir vaillamment ou se distinguer par sa bravoure. « Accomplir des exploits » est idiomatique, actuel et adapté au contexte militaire.
- source_word: αὐτοί
  choice: eux-mêmes
  rationale: Le pronom est emphatique et souligne qu’ils pensaient pouvoir se distinguer par eux-mêmes.
theological_decisions:
- issue: Force causale de ὅτι
  choice: La défaite est explicitement expliquée par le fait qu’ils n’avaient pas écouté Judas et ses frères.
  alternative: Comprendre la proposition comme une simple explication narrative, avec une causalité moins marquée.
  rationale: ὅτι introduit naturellement la cause. La traduction conserve ce jugement narratif sans l’élargir en principe doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite l’anglicisme « il y eut une grande déroute parmi le peuple » au profit d’une tournure française plus naturelle, tout en conservant « peuple » et l’emphase de « eux-mêmes ».
