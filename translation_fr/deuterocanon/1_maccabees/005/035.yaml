  verdict: revise
  source_fidelity: Le projet rend correctement la succession des actions et ne minimise pas la violence du récit. Toutefois, « l’attaqua » resserre légèrement ἐπολέμησεν (« fit la guerre à / combattit contre »), et « tous les hommes qui s’y trouvaient » peut viser des hommes simplement présents plutôt que l’ensemble masculin de la ville. La mention explicite du feu mérite aussi d’être maintenue.
  naturalness: La formulation proposée est globalement claire et moderne. « Se détourna vers », « fit la guerre à », « tous les hommes de la ville » et « y mit le feu » sont naturels dans un récit historique sobre.
  terminology: « Maafa » est une translittération française acceptable de Μααφά. « Butin » rend bien τὰ σκῦλα. « Tous les hommes de la ville » conserve le sens collectif de πᾶν ἀρσενικόν sans introduire une interprétation doctrinale.
  issues:
  - severity: low
    issue: « l’attaqua » pour ἐπολέμησεν
    rationale: Le grec exprime littéralement l’action de faire la guerre/combattre contre la ville; « attaqua » est possible, mais un peu plus spécifique et moins proche.
  - severity: medium
    issue: « tous les hommes qui s’y trouvaient » pour πᾶν ἀρσενικὸν αὐτῆς
    rationale: Cette expression peut inclure tout homme présent dans la ville, y compris un visiteur, alors que le possessif grec renvoie plus directement à sa population masculine.
  - severity: low
    issue: L’explicitation « en πυρί » n’est pas conservée
    rationale: « L’incendia » implique le feu, mais « y mit le feu » maintient explicitement l’élément formulé dans le grec.
