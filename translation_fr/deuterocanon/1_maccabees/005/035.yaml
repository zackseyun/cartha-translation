  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: fr
  text: Il se détourna vers Maafa et lui fit la guerre. Il s’en empara, tua tous les hommes de la ville, prit son butin et y mit le feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν
  choice: fit un détour vers
  rationale: Rend le mouvement d’écart exprimé par le verbe grec, sans le réduire à une simple marche offensive.
- source_word: Μααφὰ
  choice: Maafa
  rationale: Translittération française simple et proche de la forme grecque Μααφά.
- source_word: ἐπολέμησεν αὐτήν
  choice: l’attaqua
  rationale: Dans cette séquence militaire, le verbe indique qu’il engagea le combat contre la ville; « attaqua » est naturel et concis en français.
- source_word: κατελάβετο αὐτήν
  choice: s’en empara
  rationale: Exprime la prise effective de la ville dans un contexte de conquête.
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: tous les hommes qui s’y trouvaient
  rationale: Formulation française naturelle qui conserve la portée totale de πᾶν et le sens humain masculin de ἀρσενικόν dans ce récit.
- source_word: τὰ σκῦλα αὐτῆς
  choice: son butin
  rationale: « Butin » est le terme français courant pour les biens pris à l’ennemi après un combat.
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: l’incendia
  rationale: Le verbe français exprime à lui seul l’action de livrer la ville au feu; reprendre « par le feu » serait redondant en français moderne.
