revisions:
- from: Tous nos frères qui se trouvent dans la région de Tob[a] ont été tués. Leurs femmes et leurs enfants ont été emmenés en captivité, ainsi que leurs biens[b], et environ mille hommes ont été massacrés là-bas[c].
  to: Tous nos frères qui se trouvent dans la région de Tob[a] ont été tués. Leurs femmes et leurs enfants ont été emmenés en captivité, avec leurs biens[b], et l’on a fait périr là-bas environ mille hommes[c].
  rationale: La révision remplace « massacrés » par « l’on a fait périr », qui restitue la portée du grec sans ajouter une nuance non exprimée et sans créer l’ambiguïté qu’aurait un pronom « ils » en français. Elle maintient la captivité des femmes et des enfants, les biens emportés avec eux, l’approximation numérique et la prudence requise pour le toponyme.
