  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
translation:
  language: fr
  text: Tous nos frères qui se trouvent dans la région de Tob[a] ont été tués. Leurs femmes et leurs enfants ont été emmenés en captivité, avec leurs biens[b], et l’on a fait périr là-bas environ mille hommes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « parmi/dans les [gens ou lieux] de Toubiou ». La désignation exacte est difficile; « la région de Tob » rend le sens géographique probable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leurs bagages », « leur propriété » ou « leurs biens ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils ont détruit environ mille hommes là-bas ». Le verbe peut aussi se rendre par « ils ont fait périr » ou « ils ont tué ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: nos frères
  rationale: Le terme grec désigne littéralement des « frères » et, dans ce contexte, probablement des compatriotes israélites; le terme de parenté est conservé.
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: qui se trouvent dans la région de Tob
  rationale: La tournure grecque est difficile, mais semble désigner un territoire associé à Tob; « région de Tob » exprime prudemment le sens géographique probable.
- source_word: τεθανάτωνται
  choice: ont été tués
  rationale: Le parfait décrit un état résultant d'une mort accomplie; le contexte d'attaque et de captivité indique une mort violente.
- source_word: αἰχμαλωτίκασι
  choice: ont été emmenés en captivité
  rationale: Le verbe signifie faire prisonnier ou emmener captif en contexte de guerre; cette formulation est naturelle en français.
- source_word: τὴν ὑποσκευήν
  choice: leurs biens
  rationale: Le nom peut désigner les bagages, le matériel ou les biens mobiliers; « biens » conserve cette portée générale.
- source_word: ἀπώλεσαν
  choice: ont été massacrés
  rationale: Le verbe signifie détruire ou faire périr. Avec des personnes comme objet, « massacrés » rend naturellement la mise à mort violente, tout en signalant en note le sens littéral plus large.
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: environ mille hommes
  rationale: ὡς devant un nombre marque une approximation; « environ » la rend clairement.
