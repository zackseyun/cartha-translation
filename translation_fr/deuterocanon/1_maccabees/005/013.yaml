  source_fidelity: La première proposition rend fidèlement le parfait τεθανάτωνται. En revanche, le texte grec maintient ensuite l’action des agresseurs (« ils ont emmené... ils ont fait périr/détruit »). La formulation passive française peut se comprendre, mais elle efface cette distinction, et « massacrés » est plus spécifique et plus chargé que ἀπώλεσαν (« faire périr », « détruire »).
  naturalness: « Emmenés en captivité » est idiomatique. La révision conserve une syntaxe française fluide tout en évitant que le pronom « ils » soit naturellement rapporté aux « frères » de la première phrase.
  terminology: « Nos frères », « région de Tob », « biens » et « environ mille hommes » conviennent. La note sur ὑποσκευήν doit inclure « propriété/biens » parmi les possibilités; « matériel » seul est trop étroit dans ce contexte.
  issues:
  - severity: medium
    issue: « environ mille hommes ont été massacrés »
    rationale: ἀπώλεσαν est actif et signifie largement « ils firent périr/détruisirent »; « massacrer » introduit une nuance de tuerie collective brutale qui n’est pas explicitement portée par le grec et la voix passive supprime les auteurs de l’action.
  - severity: low
    issue: Note b incomplète
    rationale: ὑποσκευήν peut désigner les bagages ou les biens/propriétés mobilières. « Leur matériel » est possible mais ne doit pas remplacer l’alternative plus usuelle « leurs biens »/« leur propriété ».
  - severity: low
    issue: Formulation de la note a
    rationale: « [lieux ou groupes] » est peu naturel en français et donne une impression d’incertitude excessive. Il est préférable de présenter sobrement l’ambiguïté du génitif Τουβίου et le choix géographique retenu.
