  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: fr
  text: Mais si nous traversons et qu’il établit son camp au-delà du fleuve, nous passerons de l’autre côté pour aller vers lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour marcher contre lui ». Dans ce contexte de bataille, aller vers lui signifie vraisemblablement avancer pour l’affronter.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέλθωμεν
  choice: nous traversons
  rationale: L’aoriste du subjonctif après ἐὰν exprime une éventualité future. « Traversons » rend naturellement le mouvement tactique.
- source_word: παρεμβάλῃ
  choice: qu’il établisse son camp
  rationale: 'La troisième personne du singulier doit être conservée : le sujet implicite est l’adversaire, non « nous ». Dans ce contexte militaire, le verbe signifie établir son camp.'
- source_word: πέραν τοῦ ποταμοῦ
  choice: au-delà du fleuve
  rationale: Cette expression situe le camp sur l’autre rive sans préciser davantage la perspective spatiale.
- source_word: διαπεράσομεν
  choice: nous passerons de l’autre côté
  rationale: Le futur annonce la traversée qui permettra de rejoindre l’adversaire. Cette formulation restitue le sens du verbe sans une répétition française trop lourde.
- source_word: πρὸς αὐτόν
  choice: pour aller vers lui
  rationale: πρός avec l’accusatif indique d’abord un mouvement en direction de quelqu’un. Le contexte implique une confrontation, mais le texte grec ne l’explicite pas entièrement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque distingue le « nous » qui traverse de l’adversaire qui établit son camp ; cette distinction a été maintenue. Le terme « fleuve » conserve le registre narratif du passage.
