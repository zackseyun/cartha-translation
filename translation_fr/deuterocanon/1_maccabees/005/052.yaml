  text: And they crossed the Jordan into the great plain opposite Baisan[a].
translation:
  language: fr
  text: Ils traversèrent le Jourdain et arrivèrent dans la grande plaine, en face de Baisan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baisan est la forme grecque d’un nom de lieu souvent identifié à Beth-Shéân.
    reason: Renvoi géographique utile, tout en distinguant la forme présente dans le texte grec de son identification courante.
lexical_decisions:
- source_word: διέβησαν
  choice: traversèrent
  rationale: L’aoriste de διαβαίνω décrit ici le franchissement du Jourdain; « traversèrent » est naturel et précis en français narratif.
- source_word: τὸν Ἰορδάνην
  choice: le Jourdain
  rationale: Le nom propre précédé de l’article désigne le fleuve; l’usage français courant permet « le Jourdain » sans ajouter « fleuve ».
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: et arrivèrent dans la grande plaine
  rationale: πεδίον désigne une plaine ou une étendue plane, et μέγα est conservé par « grande ». Après « traversèrent le Jourdain », l’ajout idiomatique « et arrivèrent » rend clairement la destination marquée par εἰς sans laisser entendre qu’ils auraient traversé la plaine elle-même.
- source_word: κατὰ πρόσωπον
  choice: en face de
  rationale: Dans cette indication géographique, l’expression signifie « vis-à-vis de » ou « en face de »; cette dernière formulation est claire et naturelle.
- source_word: Βαισάν
  choice: Baisan
  rationale: La translittération « Baisan » préserve la forme grecque du nom de lieu sans lui substituer silencieusement son identification hébraïque traditionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite l’ambiguïté possible de « traversèrent le Jourdain dans la grande plaine » et conserve explicitement le rapport géographique avec Baisan.
