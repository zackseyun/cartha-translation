  text: And the man Judas and his brothers were greatly glorified before all Israel and all the nations, wherever their name was heard.
translation:
  language: fr
  text: Judas[a] et ses frères étaient tenus en très grand honneur devant tout Israël et toutes les nations, partout où leur nom se faisait entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « l’homme Judas », une tournure appositive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: Judas[a]
  rationale: En grec, ὁ ἀνήρ est placé en apposition devant le nom. Le rendre dans le corps du verset par « l’homme Judas » serait peu naturel et potentiellement trompeur en français moderne; la note conserve cette particularité du texte source.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Rend directement le pluriel masculin familial employé pour les frères de Judas dans ce contexte.
- source_word: ἐδοξάζοντο σφόδρα
  choice: étaient tenus en très grand honneur
  rationale: Le passif de δοξάζω exprime ici l’honneur et l’estime accordés à Judas et à ses frères. Cette formulation conserve la valeur passive et l’intensité de σφόδρα sans suggérer une glorification cultuelle.
- source_word: ἐναντίον παντὸς Ἰσραὴλ καὶ τῶν ἐθνῶν πάντων
  choice: devant tout Israël et toutes les nations
  rationale: « Devant » garde l’image de la considération publique, tandis que « tout Israël » et « toutes les nations » rendent les deux expressions collectives sans transformer ἔθνη en catégorie théologique.
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: partout où leur nom était connu
  rationale: La tournure française exprime naturellement la diffusion de leur renommée tout en conservant le singulier collectif « leur nom ». « Était connu » communique l’effet idiomatique du grec, littéralement « était entendu ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque peu idiomatique « l’homme Judas » dans le texte courant, mais le signale en note; elle distingue aussi l’honneur public d’une éventuelle glorification religieuse.
