lexical_decisions:
- source_word: διεπέρασεν ἐπὶ
  choice: passa ensuite à l’attaque de
  rationale: Le verbe exprime un passage ou une traversée, tandis que ἐπί indique ici vraisemblablement une direction hostile dans ce contexte militaire. Cette formulation française rend les deux éléments sans préciser indûment l’itinéraire.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: les fils d’Ammon
  rationale: Cette traduction conserve l’expression grecque et reste claire en français; « les Ammonites » est l’équivalent ethnique idiomatique.
- source_word: χεῖρα κραταιὰν
  choice: une force puissante
  rationale: Littéralement « une main puissante »; dans ce contexte, χείρ désigne vraisemblablement une puissance ou une force militaire. La traduction communique cet emploi idiomatique, signalé en note.
- source_word: λαὸν πολύν
  choice: un peuple nombreux
  rationale: La formulation respecte le sens collectif de λαός et évite de préciser « armée », que le grec n’énonce pas explicitement.
- source_word: ἡγούμενον αὐτῶν
  choice: ayant Timothée à leur tête
  rationale: Cette tournure naturelle exprime le rôle de dirigeant de Timothée sans imposer le sens plus étroit de commandant militaire.
