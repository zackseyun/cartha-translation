  yaml_path: translation/deuterocanon/1_maccabees/005/054.yaml
  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
translation:
  language: fr
  text: Ils montèrent sur le mont Sion dans l’allégresse et la joie, et ils offrirent des offrandes entièrement brûlées[a], car pas un seul d’entre eux n’était tombé jusqu’à leur retour en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « des holocaustes ». Le terme grec désigne des offrandes entièrement consumées sur l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe exprime une montée réelle vers Sion. « Montèrent » est naturel en français et conserve cette image spatiale.
- source_word: τὸ ὄρος Σιὼν
  choice: le mont Sion
  rationale: Forme française usuelle du nom de lieu, qui préserve sa portée géographique et religieuse.
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: dans l’allégresse et la joie
  rationale: Cette formulation conserve les deux noms grecs distincts et leur caractère festif dans un registre digne et actuel.
- source_word: προσήγαγον
  choice: offrirent
  rationale: Dans ce contexte cultuel, le verbe désigne la présentation d’une offrande sacrificielle ; « offrirent » exprime clairement cette action.
- source_word: ὁλοκαυτώματα
  choice: des offrandes entièrement brûlées
  rationale: Le terme désigne des offrandes totalement consumées par le feu. Cette traduction explicite le sens sans employer seul « holocaustes », aujourd’hui fortement associé au génocide des Juifs d’Europe.
- source_word: οὐκ ἔπεσεν
  choice: n’était tombé
  rationale: Dans un récit militaire, « tomber » peut signifier mourir au combat. Le plus-que-parfait convient au bilan rétrospectif de l’expédition.
- source_word: ἐξ αὐτῶν οὐθεὶς
  choice: pas un seul d’entre eux
  rationale: Cette tournure naturelle conserve l’insistance de la négation grecque et son sens partitif.
- source_word: ἕως τοῦ ἐπιστρέψαι
  choice: jusqu’à leur retour
  rationale: L’infinitif grec substantivé après ἕως marque le terme temporel ; le groupe nominal français en restitue la concision.
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: La traduction littérale garde ouverte la nuance entre un retour paisible et un retour sain et sauf.
theological_decisions:
- issue: Terminologie cultuelle de ὁλοκαυτώματα
  choice: offrandes entièrement brûlées
  alternative: holocaustes ; sacrifices entièrement consumés
  rationale: Le choix rend explicite que les offrandes étaient intégralement consumées sur l’autel, tout en évitant que le sens moderne dominant du mot « holocauste » n’obscurcisse le rite antique.
- issue: Portée de l’expression ἐν εἰρήνῃ
  choice: en paix
  alternative: sains et saufs ; sans dommage
  rationale: « En paix » préserve la formulation et l’amplitude du grec, qui peut évoquer la sécurité du retour sans réduire l’expression à cette seule idée.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme « l’allégresse et la joie » est maintenu, ainsi que la tension de la tournure temporelle grecque « jusqu’à leur retour en paix ».
