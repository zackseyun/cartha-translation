base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/002.yaml
  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: fr
  text: Ils projetaient de faire disparaître les descendants de Jacob[a] qui vivaient au milieu d’eux, et ils commencèrent à les tuer et à les exterminer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lignée de Jacob » ou « le peuple de Jacob ». Le grec γένος souligne l’ascendance ou la parenté.
    reason: lexical_alternative
  - marker: b
    text: Litt. « dans/parmi le peuple ». Cette formule grecque concise peut indiquer que les victimes étaient prises au sein du peuple.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: ils projetaient
  rationale: L’imparfait exprime une délibération ou un projet en cours; le contexte hostile donne au verbe la nuance d’un complot sans qu’il soit nécessaire de la suraccentuer.
- source_word: ἆραι
  choice: faire disparaître
  rationale: Le verbe αἴρω signifie ici enlever ou supprimer. « Faire disparaître » conserve l’idée d’élimination tout en laissant les verbes suivants préciser sa forme violente.
- source_word: τὸ γένος Ἰακώβ
  choice: les descendants de Jacob
  rationale: γένος désigne ici une lignée ou un peuple uni par l’ascendance. Cette formulation garde la dimension généalogique sans les connotations modernes de « race ».
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: qui vivaient au milieu d’eux
  rationale: La tournure identifie les descendants de Jacob présents parmi les peuples environnants. « Vivaient » rend naturellement en français la présence durable suggérée par le participe.
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: ils commencèrent à tuer
  rationale: La construction avec ἤρξαντο marque le commencement de l’action, et θανατόω signifie mettre à mort ou tuer.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: La préposition ἐν a naturellement une valeur locative, mais la formule grecque est resserrée et peut aussi viser des personnes prises au sein du peuple; la note conserve cette ambiguïté.
- source_word: ἐξαίρειν
  choice: exterminer
  rationale: Dans ce contexte de mise à mort collective, ἐξαιρέω ne désigne pas une simple extraction, mais une élimination complète. « Exterminer » restitue cette force.
theological_decisions:
- issue: Désignation ethnico-généalogique dans τὸ γένος Ἰακώβ
  choice: les descendants de Jacob
  alternative: la lignée de Jacob; le peuple de Jacob
  rationale: Le texte désigne le peuple juif par son ascendance en Jacob. « Descendants » préserve cette identité historique et généalogique sans introduire une conception moderne de la race.
- issue: Progression de ἆραι à θανατοῦν et ἐξαίρειν
  choice: faire disparaître… tuer… exterminer
  alternative: enlever… mettre à mort… éliminer
  rationale: La traduction conserve la progression du projet de suppression vers la mise à mort effective et l’éradication, sans réduire les trois verbes à une seule notion.
- issue: Objet implicite des verbes finaux
  choice: maintien d’une formulation sans objet explicite
  alternative: tuer des membres du peuple et les exterminer
  rationale: Le grec n’énonce pas d’objet après θανατοῦν et ἐξαίρειν. Ne pas en ajouter préserve la formulation abrégée et l’ambiguïté syntaxique du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la violence et la progression du grec, ainsi que la formulation resserrée de la dernière proposition; les solutions pouvant suggérer une catégorie raciale moderne ont été évitées.
