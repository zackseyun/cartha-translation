revisions:
- from: Ils projetaient de faire disparaître les descendants de Jacob[a] qui vivaient au milieu d’eux, et ils commencèrent à tuer parmi le peuple[b] et à exterminer.
  to: Ils projetaient de faire disparaître les descendants de Jacob[a] qui vivaient au milieu d’eux, et ils commencèrent à les tuer et à les exterminer[b].
  rationale: La révision rétablit une syntaxe française complète en donnant aux deux verbes finaux le même antécédent explicite, « les descendants de Jacob ». Cette reprise est exigée par l’idiome français et est conforme au contexte immédiat, sans ajouter un nouveau groupe de victimes. La note b conserve l’incertitude de la formule grecque ἐν τῷ λαῷ sans alourdir la traduction ni lui attribuer un objet différent.
