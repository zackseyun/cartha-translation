    issue: Coordination finale sans objet cohérent
    rationale: « Ils commencèrent à tuer parmi le peuple et à exterminer » associe un complément locatif/partitif à « tuer », puis laisse « exterminer » sans complément. Cela obscurcit la syntaxe et ne rend pas de façon naturelle les deux infinitifs grecs coordonnés.
  - severity: low
    issue: Note b insuffisamment alignée sur le texte révisé
    rationale: La note actuelle propose « tuer des membres du peuple et les exterminer », alors que le texte révisé reprend explicitement les descendants de Jacob comme objet. La note devrait seulement expliquer la valeur possible de ἐν τῷ λαῷ et ne pas créer une alternative syntaxique concurrente.
  revised_text: Ils projetaient de faire disparaître les descendants de Jacob[a] qui vivaient au milieu d’eux, et ils commencèrent à les tuer et à les exterminer[b].
