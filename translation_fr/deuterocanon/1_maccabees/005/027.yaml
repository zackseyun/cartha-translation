  source_fidelity: 'La structure et le vocabulaire sont globalement fidèles : λοιπαῖς πόλεσιν, Γαλααδίτιδος, συνειλημμένοι, παρεμβαλεῖν, ὀχυρώματα et καταλαβέσθαι sont bien rendus. Le contexte autorise l’explicitation du sujet hostile (« leurs assaillants »), puisque le second « ils » ne peut raisonnablement désigner les personnes enfermées. En revanche, dans la formulation actuelle, « de les exterminer tous » peut faire de « les » les « places fortes », son antécédent grammatical le plus proche, tandis que ἅπαντας αὐτούς désigne les personnes précédemment dites encerclées. « Exterminer » est également plus étroit que le grec ἐξᾶραι, dont la force d’élimination est contextuellement nette mais dont le sens lexical premier demeure plus large.'
