  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: fr
  text: Dans les autres villes de Galaad aussi, ils sont encerclés[a] ; demain, leurs assaillants projettent d’établir leur camp contre les places fortes, de s’en emparer et de les faire tous disparaître en un seul jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfermés » ou « assiégés ». Le grec décrit des personnes retenues sous la menace, sans imposer nécessairement le terme technique d’un siège.
    reason: lexical_alternative
  - marker: b
    text: Ou « les exterminer tous » ou « les anéantir tous ». Le verbe grec est énergique et, dans ce contexte, évoque l’élimination totale des personnes encerclées ; il peut aussi être rendu plus largement par « les faire disparaître tous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν τῆς Γαλααδίτιδος
  choice: les autres villes de Galaad
  rationale: « Les autres villes » exprime naturellement λοιπαῖς, tandis que « Galaad » est le nom géographique français usuel de la région.
- source_word: συνειλημμένοι
  choice: encerclés
  rationale: Le participe parfait passif décrit des personnes maintenues enfermées sous une pression hostile. « Encerclés » rend cet état sans imposer le terme plus technique « assiégés ».
- source_word: πάσονται
  choice: projettent
  rationale: Le verbe exprime ici un dessein imminent plutôt qu’un simple futur. « Projettent » conserve cette nuance d’intention.
- source_word: παρεμβαλεῖν ἐπὶ τὰ ὀχυρώματα
  choice: établir leur camp contre les places fortes
  rationale: Cette formulation garde l’image militaire concrète de l’établissement d’un camp dirigé contre des lieux fortifiés, sans réduire d’emblée l’action à l’assaut ou au siège.
- source_word: καταλαβέσθαι
  choice: s’en emparer
  rationale: Le moyen infinitif indique la prise de possession des places fortes ; « s’en emparer » est précis et naturel en français.
- source_word: ἐξᾶραι ἅπαντας αὐτοὺς
  choice: les exterminer tous
  rationale: Dans ce contexte militaire, ἐξαίρω associé à des personnes exprime leur élimination totale. « Les exterminer tous » conserve la violence et l’insistance de ἅπαντας.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: en un seul jour
  rationale: « Un seul jour » restitue l’accent mis sur la rapidité et la totalité de l’opération.
theological_decisions:
- issue: Identification du sujet des verbes de projet et d’attaque
  choice: leurs assaillants
  alternative: ils
  rationale: La morphologie grecque emploie la troisième personne du pluriel, mais le sens exige de distinguer les personnes encerclées de ceux qui projettent de prendre les places fortes et de les exterminer. « Leurs assaillants » explicite sobrement le référent hostile requis par le contexte, sans lui attribuer une identité plus précise.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La phrase conserve l’image du camp militaire et la force exterminatrice du dernier verbe. L’ajout explicatif « leurs assaillants » évite en français une confusion de sujets que le contexte grec permet de résoudre.
