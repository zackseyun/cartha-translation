    issue: Formulation maladroite de la traversée
    rationale: « Traverse vers nous le premier » n’est pas idiomatique en français. « Passe le premier de notre côté » rend naturellement le franchissement du cours d’eau vers le camp adverse, avec l’idée de priorité de πρότερος.
  - severity: medium
    issue: Rendu trop littéral et peu naturel de δυνήσεται πρὸς ἡμᾶς
    rationale: « Il sera assez fort contre nous » ne sonne pas naturellement et atténue inutilement le sens contextuel. « Il l’emportera sur nous » exprime l’avantage militaire attendu sans ajouter de précision doctrinale ou interprétative.
