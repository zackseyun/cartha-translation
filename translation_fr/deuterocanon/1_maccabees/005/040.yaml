  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: fr
  text: 'Timothée dit aux commandants de son armée, alors que Judas et son camp approchaient du torrent[a] : « S’il passe le premier de notre côté, nous ne pourrons pas lui résister, car il l’emportera sur nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le torrent d’eau ». Il s’agit probablement d’un cours d’eau saisonnier ou du ravin dans lequel il coule.'
    reason: cultural_note
  - marker: b
    text: 'Le grec dit de manière condensée : « il pourra contre nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: aux commandants de son armée
  rationale: Dans ce contexte militaire, ἄρχοντες désigne les responsables placés à la tête des combattants, et δύναμις la force armée de Timothée. Cette formulation est naturelle et précise en français.
- source_word: ἐν τῷ ἐγγίζειν
  choice: alors que ... approchaient
  rationale: La construction avec infinitif articulé exprime ici une action contemporaine de la parole de Timothée.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Le mot peut désigner un campement ou les forces qui y sont rassemblées. « Camp » conserve cette amplitude sans préciser indûment « troupes ».
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: torrent
  rationale: χειμάρρους désigne un torrent ou un cours d’eau, souvent saisonnier. « Torrent » est idiomatique en français et convient mieux que « rivière » à ce type de terrain.
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: traverse vers nous le premier
  rationale: La traduction garde à la fois le mouvement de traversée, sa direction vers le camp de Timothée et l’idée que Judas franchirait le cours d’eau avant ses adversaires.
- source_word: ὑποστῆναι αὐτόν
  choice: lui résister
  rationale: Dans un affrontement militaire, le verbe signifie tenir face à un adversaire ou lui résister.
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: il sera assez fort contre nous
  rationale: Le grec est condensé, littéralement proche de « il pourra contre nous ». La formulation française exprime sa force supérieure tout en évitant de transformer implicitement la déclaration en certitude absolue de victoire.
- source_word: Τιμόθεος
  choice: Timothée
  rationale: « Timothée » est la forme française traditionnelle et immédiatement reconnaissable du nom grec.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Il s’agit de Judas Maccabée ; « Judas » est la forme française conventionnelle de ce nom personnel.
