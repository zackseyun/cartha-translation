  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
translation:
  language: fr
  text: Ils se préparent à venir s’emparer de la forteresse où nous nous sommes réfugiés[a] ; Timothée est à la tête de leur armée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se traduire par « prendre d’avance » ou « occuper les premiers » ; il peut souligner le caractère préventif de la prise.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner leur camp militaire ou, par extension, les forces qui le composent.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: ils se préparent
  rationale: La construction périphrastique au présent exprime des préparatifs en cours.
- source_word: προκαταλαβέσθαι
  choice: s’emparer de
  rationale: Le verbe désigne ici la prise d’une position, avec une nuance possible d’anticipation ou de prise préventive, signalée en note sans alourdir le texte.
- source_word: τὸ ὀχύρωμα
  choice: la forteresse
  rationale: Le terme désigne une position fortifiée servant ici de refuge.
- source_word: εἰς ὃ κατεφύγομεν
  choice: où nous nous sommes réfugiés
  rationale: Cette formulation française naturelle rend à la fois le mouvement vers le refuge et la situation qui en résulte.
- source_word: ἡγεῖται
  choice: est à la tête de
  rationale: L’expression conserve le sens général de diriger tout en convenant au contexte militaire.
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: leur armée
  rationale: παρεμβολή peut désigner le camp militaire ou, par métonymie, les forces qui y sont rassemblées ; « armée » convient naturellement avec l’idée de commandement.
