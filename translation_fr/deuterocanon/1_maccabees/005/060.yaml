  yaml_path: translation/deuterocanon/1_maccabees/005/060.yaml
  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
translation:
  language: fr
  text: Joseph et Azarias furent mis en déroute et poursuivis jusqu’aux frontières de la Judée. Ce jour-là, environ deux mille hommes[a] du peuple d’Israël tombèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « tombèrent ... jusqu’à deux mille hommes » ; l’expression indique probablement un total approximatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  choice: furent mis en déroute
  rationale: Dans ce contexte militaire, le passif exprime une défaite qui contraint à la fuite ; « mis en déroute » rend ce sens avec précision.
- source_word: ἐδιώχθησαν
  choice: poursuivis
  rationale: Le passif de διώκω désigne ici la poursuite hostile qui suit la déroute.
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: jusqu’aux frontières de la Judée
  rationale: ὅρια désigne les frontières ou limites d’un territoire, et ἕως marque le point atteint par la poursuite.
- source_word: ἔπεσον
  choice: tombèrent
  rationale: « Tomber » conserve l’image grecque et constitue en français un emploi naturel pour des hommes morts au combat, sans expliciter davantage que le texte.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Ce jour-là
  rationale: Formulation temporelle naturelle en français moderne.
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: du peuple d’Israël
  rationale: La tournure identifie les hommes tombés comme appartenant au peuple d’Israël.
- source_word: εἰς δισχιλίους ἄνδρας
  choice: environ deux mille hommes
  rationale: Devant un nombre, εἰς peut présenter un total approximatif ou approchant ce chiffre ; « environ » rend cet idiome sans imposer une exactitude mathématique.
