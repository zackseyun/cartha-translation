  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
translation:
  language: fr
  text: Judas et son armée changèrent soudain de direction et prirent le chemin du désert vers Bosor. Il s’empara de la ville, tua tous les mâles au fil de l’épée[a], prit tout leur butin et livra la ville aux flammes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « dans la bouche de l’épée », expression biblique signifiant « par l’épée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: changèrent de direction
  rationale: Le verbe exprime ici un changement de direction sans suggérer nécessairement un retour ou une retraite.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son armée
  rationale: Dans ce contexte de déplacement militaire, παρεμβολή désigne naturellement la troupe organisée qui accompagne Judas; «camp» serait moins naturel en français pour un groupe en marche.
- source_word: ὁδὸν εἰς τὴν ἔρημον εἰς Βοσὸρ
  choice: prenant le chemin du désert vers Bosor
  rationale: Cette formulation conserve les notions de chemin, de désert et de mouvement vers Bosor tout en rendant naturelle la syntaxe grecque comprimée.
- source_word: ἄφνω
  choice: soudain
  rationale: L’adverbe souligne le caractère brusque et probablement inattendu de la manœuvre.
- source_word: κατελάβετο
  choice: s’empara de
  rationale: Dans un contexte militaire, le verbe signifie prendre possession d’une ville par la force.
- source_word: πᾶν ἀρσενικόν
  choice: tous les hommes
  rationale: Dans le récit militaire français, cette expression rend naturellement l’ensemble des personnes de sexe masculin visées, sans employer le substantif clinique «mâles».
- source_word: ἐν στόματι ῥομφαίας
  choice: par le tranchant de l’épée
  rationale: Équivalent idiomatique français de l’expression biblique littérale «par la bouche de l’épée»; une note en conserve la forme source.
- source_word: τὰ σκῦλα
  choice: butin
  rationale: Le terme désigne les biens pris à l’ennemi lors d’une opération militaire.
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: livra la ville aux flammes
  rationale: Cette tournure française actuelle et digne exprime clairement la destruction par le feu; «la ville» explicite le référent du pronom grec.
