  yaml_path: translation/deuterocanon/1_maccabees/005/044.yaml
  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: fr
  text: Ils s’emparèrent de la ville et incendièrent l’enceinte sacrée, avec tous ceux qui s’y trouvaient.[a] Karnaïn fut mise en déroute et ne put plus tenir devant Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tout ce qui s’y trouvait ». La tournure grecque peut avoir un sens plus large, bien que le contexte évoque probablement les personnes présentes dans l’enceinte sacrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  choice: s’emparèrent
  rationale: Dans ce récit militaire, le verbe exprime la prise de possession de la ville. Le préfixe προ- peut suggérer qu’ils la devancèrent ou s’en assurèrent avant l’adversaire, mais l’expliciter ici alourdirait le français et risquerait de préciser indûment la chronologie.
- source_word: τὴν πόλιν
  choice: la ville
  rationale: Équivalent français courant et exact de πόλις dans ce contexte.
- source_word: τὸ τέμενος
  choice: l’enceinte sacrée
  rationale: τέμενος désigne un espace consacré ou une enceinte cultuelle, plutôt que nécessairement le seul bâtiment du temple.
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: incendièrent
  rationale: Le grec emploie une formulation emphatique, littéralement « brûlèrent par le feu ». « Incendièrent » en restitue naturellement le sens en français sans redondance maladroite.
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: avec tous ceux qui s’y trouvaient
  rationale: Dans ce contexte, la tournure substantivée désigne très probablement les personnes présentes dans l’enceinte. Son extension possible à tout ce qui s’y trouvait est signalée en note.
- source_word: ἐτροπώθη
  choice: fut mise en déroute
  rationale: 'Le passif possède ici son sens militaire : Karnaïn est vaincue et ne peut plus opposer de résistance.'
- source_word: Καρναῒν
  choice: Karnaïn
  rationale: Translittération française proche de la forme grecque, avec tréma pour indiquer que les deux voyelles finales se prononcent séparément.
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι
  choice: ne put plus tenir
  rationale: Dans ce contexte d’affrontement, ὑποστῆναι signifie tenir sa position ou résister. La formulation est concise et idiomatique.
- source_word: κατὰ πρόσωπον Ἰούδα
  choice: devant Judas
  rationale: L’expression désigne ici l’affrontement direct avec Judas. « Devant Judas » conserve l’image grecque tout en restant naturel en français.
