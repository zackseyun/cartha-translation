  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
translation:
  language: fr
  text: Il laissa en Judée Joseph, fils de Zacharie, et Azarias, chef du peuple, avec le reste des forces, pour en assurer la garde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la surveiller » ou « pour la protéger ». Le grec souligne l’idée de garder ou de veiller sur la Judée.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: laissa
  rationale: Le verbe signifie directement « laisser » ou « laisser derrière soi » ; le contexte implique une mission sans qu’il soit nécessaire de traduire par « nomma ».
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: Joseph, fils de Zacharie
  rationale: La tournure grecque τὸν τοῦ suivie du génitif indique la filiation ; cette formulation est naturelle en français.
- source_word: Ἀζαρίαν
  choice: Azarias
  rationale: Forme française biblique traditionnelle et intelligible du nom propre grec.
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: chef du peuple
  rationale: ἡγούμενον est un accusatif masculin singulier qui se rapporte grammaticalement à Azarias. « Chef » conserve la portée générale du terme sans lui attribuer un titre administratif ou militaire plus précis.
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: avec le reste des forces
  rationale: Dans ce contexte militaire, δύναμις désigne les forces ou les troupes, et ἐπίλοιπος ce qui reste.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: en Judée
  rationale: Forme géographique française usuelle.
- source_word: εἰς τήρησιν
  choice: pour en assurer la garde
  rationale: τήρησις exprime l’action de garder, de surveiller ou de protéger. Le pronom « en » rattache naturellement cette mission à la Judée sans réduire le sens à la seule défense militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’ordre de la phrase place « en Judée » assez tôt pour que « en assurer la garde » ait un référent net. Le singulier grec ἡγούμενον est respecté par « Azarias, chef du peuple », plutôt que d’en faire un titre attribué aux deux hommes.
