lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις αἷς
  choice: À l’époque où
  rationale: Rend naturellement en français moderne cette tournure temporelle grecque sans alourdir la phrase.
- source_word: ἦν
  choice: étaient
  rationale: Le verbe grec est au singulier, mais son sujet coordonné est « Judas et Jonathan » ; le français exige le pluriel.
- source_word: Γαλαάδ
  choice: Galaad
  rationale: Forme française traditionnelle et courante du nom de cette région.
- source_word: Γαλιλαίᾳ
  choice: Galilée
  rationale: Forme française usuelle du nom de cette région.
- source_word: κατὰ πρόσωπον Πτολεμαΐδος
  choice: en face de Ptolémaïs
  rationale: Expression géographique concise qui conserve l’idée d’une position définie par rapport à la ville, sans préciser davantage une localisation que le grec laisse ouverte.
- source_word: Πτολεμαΐδος
  choice: Ptolémaïs
  rationale: Forme française établie du nom de la ville antique.
