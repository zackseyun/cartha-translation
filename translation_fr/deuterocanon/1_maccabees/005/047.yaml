lexical_decisions:
- source_word: ἀπέκλεισαν
  choice: les enfermèrent
  rationale: Le verbe exprime l’action de fermer un espace autour de personnes ou de les y retenir. « Les enfermèrent » est naturel en français et conserve l’idée qu’ils ne pouvaient plus sortir.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les gens de la ville
  rationale: L’expression signifie littéralement « ceux de la ville ». « Les gens de la ville » reste collectif et n’ajoute pas au grec une précision de sexe ou de fonction.
- source_word: ἐνέφραξαν
  choice: obstruèrent
  rationale: Le verbe signifie boucher ou bloquer. Avec des portes et des pierres, « obstruèrent » décrit clairement une obstruction matérielle.
- source_word: τὰς πύλας
  choice: les portes
  rationale: Rendu français courant du pluriel désignant les portes d’une ville.
- source_word: λίθοις
  choice: avec des pierres
  rationale: Le datif indique ici le moyen ou le matériau employé pour obstruer les portes.
