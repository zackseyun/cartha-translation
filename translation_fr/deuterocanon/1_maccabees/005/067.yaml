  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: fr
  text: Ce jour-là, des prêtres tombèrent au combat parce qu’il voulait faire preuve de bravoure[a], lorsqu’ils partirent au combat sans avoir pris conseil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte ici le singulier : « il voulait », sans préciser dans ce verset à qui renvoie « il ». Le verbe peut aussi se traduire par « se distinguer » ou « accomplir un exploit ».'
    reason: Ambiguïté grammaticale et alternative lexicale.
  - marker: b
    text: Ou « sans délibération », « témérairement ». Le grec signifie littéralement agir sans conseil.
    reason: Alternative lexicale.
lexical_decisions:
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: 'Le verbe est employé dans son sens militaire courant : tomber, c’est-à-dire mourir, au combat. « Tombèrent » conserve ce registre sans expliciter davantage que le grec.'
- source_word: ἱερεῖς
  choice: des prêtres
  rationale: Le pluriel grec sans article désigne ici des membres de la classe sacerdotale ; l’article partitif français est naturel.
- source_word: πολέμῳ
  choice: au combat
  rationale: Le datif indique la circonstance dans laquelle les prêtres tombèrent. « Au combat » est idiomatique et garde la tonalité militaire.
- source_word: βουλομένου αὐτοῦ
  choice: parce qu’il voulait
  rationale: Le génitif absolu est au singulier et peut exprimer ici la cause. La traduction maintient le pronom singulier et n’en précise pas l’antécédent, absent du verset.
- source_word: ἀνδραγαθῆσαι
  choice: faire preuve de bravoure
  rationale: Le verbe désigne le fait de manifester sa valeur ou d’accomplir un acte héroïque. Cette formulation moderne conserve l’idée de vaillance sans calquer une expression grecque explicitement masculine.
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν
  choice: lorsqu’ils partirent
  rationale: L’infinitif articulé, avec αὐτούς pour sujet, a ici une valeur temporelle. « Lorsqu’ils partirent » rend clairement cette relation.
- source_word: εἰς τὸν πόλεμον
  choice: au combat
  rationale: L’expression indique qu’ils sortirent pour prendre part à l’affrontement ; « partirent au combat » est naturel en français.
- source_word: ἀβουλεύτως
  choice: sans avoir pris conseil
  rationale: 'L’adverbe signifie agir sans conseil ni délibération. La traduction conserve cette image et laisse ouverte la nature exacte du défaut : absence de consultation, de réflexion ou de préparation.'
theological_decisions:
- issue: Référent et nombre de αὐτοῦ dans βουλομένου αὐτοῦ ἀνδραγαθῆσαι
  choice: Maintenir le singulier « il » sans nommer son référent.
  alternative: 'Comprendre que les prêtres eux-mêmes voulaient faire preuve de bravoure et traduire au pluriel : « parce qu’ils voulaient faire preuve de bravoure ».'
  rationale: Le texte grec fourni porte explicitement un génitif absolu singulier. Même si le contexte ou certaines traditions de traduction peuvent favoriser un sujet pluriel, le rendre par « ils » corrigerait silencieusement la tension grammaticale. La note signale donc l’ambiguïté sans la résoudre.
translation_notes:
  register: Français international actuel, sobre et narratif. La syntaxe conserve volontairement le contraste entre le singulier « il » et le pluriel « ils », conformément au texte grec transmis, tandis que les notes rendent cette difficulté transparente.
