  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: fr
  text: Judas se détourna vers Azôtos[a], au pays des étrangers. Il démolit leurs autels, et ils brûlèrent les images sculptées de leurs dieux. Il s’empara du butin des villes[b], puis retourna en Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte historique : « au pays des Philistins ». Le grec dit littéralement « au pays des étrangers ».'
    reason: alternative_reading
  - marker: b
    text: Le verbe grec traduit par « ils brûlèrent » est au pluriel, alors que les verbes qui l’entourent sont au singulier. Le pluriel renvoie probablement aux hommes de Judas, et non à Judas seul.
    reason: textual_feature
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: fit un détour par
  rationale: Exprime naturellement le changement de direction indiqué par le verbe, sans préciser un motif absent du texte.
- source_word: Ἄζωτον
  choice: Azôtos
  rationale: Reproduit en français la forme grecque hellénisée du nom de lieu plutôt que de lui substituer l’équivalent historique Ashdod.
- source_word: γῆν ἀλλοφύλων
  choice: au pays des étrangers
  rationale: Conserve le sens large et littéral d’ἀλλόφυλοι; l’identification historique aux Philistins est donnée en note.
- source_word: καθεῖλεν
  choice: démolit
  rationale: Rend concrètement la destruction d’ouvrages construits tels que des autels.
- source_word: βωμοὺς
  choice: autels
  rationale: Équivalent direct et usuel de βωμός.
- source_word: γλυπτὰ
  choice: statues sculptées
  rationale: Conserve la nature matérielle de ces représentations; « idoles » serait plus interprétatif.
- source_word: κατέκαυσαν
  choice: ils brûlèrent
  rationale: Préserve le pluriel remarquable du texte grec, probablement appliqué aux hommes de Judas, au lieu de l’harmoniser avec les verbes au singulier.
- source_word: ἐσκύλευσεν τὰ σκῦλα
  choice: prit comme butin les dépouilles
  rationale: Reproduit le lien étymologique entre le verbe et le nom tout en restant intelligible en français; « dépouilles » garde la nuance de prises de guerre.
- source_word: ἐπέστρεψεν
  choice: retourna
  rationale: Formulation narrative naturelle pour le retour en Judée.
- source_word: Ἰουδαίαν
  choice: Judée
  rationale: Nom français moderne et courant de cette région.
theological_decisions:
- issue: Désignation ethnique ἀλλόφυλοι dans une région historiquement philistine
  choice: pays des étrangers
  alternative: pays des Philistins
  rationale: Le texte grec emploie une désignation plus générale qu’un nom ethnique explicite. Le texte principal en garde l’ambiguïté, tandis que la note fournit l’identification historique possible.
- issue: Passage au pluriel dans κατέκαυσαν après des verbes au singulier
  choice: ils brûlèrent
  alternative: il brûla
  rationale: Le pluriel attesté est conservé malgré la rupture syntaxique. Il peut renvoyer aux forces de Judas, mais cette explication n’est pas imposée dans le texte.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. Le pluriel inattendu du grec est maintenu explicitement, et le nom Azôtos suit la forme de la source.
