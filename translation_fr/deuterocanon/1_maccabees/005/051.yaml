  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: fr
  text: Il fit périr tous les mâles par le tranchant de l’épée[a], déracina la ville[b], s’empara du butin de la ville et passa à travers la ville, par-dessus les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la bouche de l’épée », expression signifiant « par le tranchant de l’épée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’arracha jusqu’aux racines » ; le verbe conserve l’image d’un déracinement complet et désigne ici la destruction de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: fit périr
  rationale: Dans ce contexte militaire, le verbe exprime le fait de causer la mort ou la destruction. « Fit périr » rend clairement l’issue mortelle sans atténuer la violence.
- source_word: πᾶν ἀρσενικόν
  choice: tout individu de sexe masculin
  rationale: Cette formulation conserve la portée exhaustive et explicitement sexuée du grec, sans limiter indûment le propos aux seuls hommes adultes.
- source_word: ἐν στόματι ῥομφαίας
  choice: par le tranchant de l’épée
  rationale: Équivalent idiomatique français de l’expression littérale « par la bouche de l’épée » ; il garde l’image du fil de l’arme.
- source_word: ἐξερρίζωσεν
  choice: déracina
  rationale: Le verbe signifie proprement arracher avec les racines. Le choix conserve l’image forte d’une destruction totale de la ville.
- source_word: αὐτήν
  choice: la ville
  rationale: Le pronom féminin renvoie à la ville. Répéter le nom en français clarifie le référent sans modifier le sens.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: son butin
  rationale: Le terme désigne les biens pris à la guerre. Le possessif renvoie naturellement à la ville déjà nommée.
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: la traversa
  rationale: Rend de façon concise et naturelle le mouvement à travers la ville, sans ajouter l’idée d’une marche militaire qui n’est pas explicite.
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: en passant par-dessus les morts
  rationale: Le participe désigne ceux qui avaient été tués. Cette formulation préserve l’image concrète et brutale du texte.
theological_decisions:
- issue: Portée et violence de la destruction
  choice: Conserver explicitement la mise à mort de tout individu de sexe masculin, la destruction de la ville et le passage sur les morts.
  alternative: Employer des termes atténués tels que « vainquit », « prit la ville » ou « passa parmi les victimes ».
  rationale: Le grec décrit une violence militaire extrême sans l’adoucir. La traduction ne doit ni en réduire la portée ni ajouter une justification théologique absente du verset.
translation_notes:
  register: Français moderne, sobre et dignifié. La syntaxe coordonnée suit le rythme narratif grec. « Tout individu de sexe masculin » est volontairement précis afin de ne pas réduire ἀρσενικόν aux seuls adultes ; « déracina » conserve la métaphore inhabituelle mais signifiante de l’original.
