  yaml_path: translation/deuterocanon/1_maccabees/005/017.yaml
  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
translation:
  language: fr
  text: 'Judas dit à son frère Simon : « Choisis des hommes pour toi, puis va délivrer tes frères qui sont en Galilée. Quant à moi, j’irai avec mon frère Jonathan en Galaaditide[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Galaad ». Le grec emploie « Galaaditide », nom plus précis de cette région.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίλεξον σεαυτῷ ἄνδρας
  choice: Choisis des hommes pour t’accompagner
  rationale: L’impératif aoriste appelle Simon à sélectionner des hommes pour l’expédition qui lui est confiée. Cette formulation française rend naturellement le datif réfléchi σεαυτῷ sans ajouter la notion plus précise de « soldats », absente du grec.
- source_word: ῥῦσαι
  choice: délivrer
  rationale: Dans ce contexte de danger et d’intervention armée, « délivrer » exprime l’action de soustraire les frères à la menace, tout en conservant la portée du verbe ῥύομαι.
- source_word: τοὺς ἀδελφούς σου
  choice: tes frères
  rationale: Le grec emploie directement le langage de la fraternité. Celui-ci peut désigner ici les compatriotes israélites de Simon, mais la traduction ne remplace pas cette image par une explicitation.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: qui sont en Galilée
  rationale: La relative explicite naturellement en français que la localisation concerne les frères à délivrer.
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: Quant à moi, j’irai avec mon frère Jonathan
  rationale: « Quant à moi » marque le contraste introduit par δέ entre les deux missions. La coordination française idiomatique exprime que Judas et Jonathan partiront ensemble.
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: en Galaaditide
  rationale: « Galaaditide » conserve le nom régional spécifique Γαλααδῖτις transmis par le grec, plutôt que de le réduire silencieusement à « Galaad ».
