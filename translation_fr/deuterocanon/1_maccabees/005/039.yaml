base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/039.yaml
  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
translation:
  language: fr
  text: Des Arabes ont été engagés pour leur venir en aide, et ils campent de l’autre côté du torrent[a], prêts à marcher contre toi pour te faire la guerre[b]. Judas partit à leur rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté de l’oued ». Le mot grec peut désigner un torrent, un cours d’eau saisonnier ou son lit.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici « toi » au singulier, car ces paroles sont directement rapportées à Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄραβες
  choice: Arabes
  rationale: Désignation ethnique directe et naturelle en français moderne.
- source_word: μεμίσθωνται
  choice: ont été engagés
  rationale: Le parfait moyen-passif indique qu’ils ont été recrutés contre rémunération et se trouvent désormais à leur service, sans qu’il soit nécessaire d’expliciter « mercenaires ».
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: pour leur venir en aide
  rationale: Cette tournure rend clairement le but de leur engagement tout en restant naturelle et digne.
- source_word: παρεμβάλλουσιν
  choice: ils campent
  rationale: Le présent grec décrit la situation militaire en cours au moment du rapport.
- source_word: πέραν τοῦ χειμάρρου
  choice: de l’autre côté du torrent
  rationale: χείμαρρος peut désigner un torrent, un cours d’eau saisonnier ou son lit; « torrent » conserve l’image sans imposer le terme régional « oued ».
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: prêts à marcher contre toi pour te faire la guerre
  rationale: La formulation conserve à la fois l’idée de mouvement hostile, le singulier de l’adresse et la finalité guerrière.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: à leur rencontre
  rationale: Cette expression rend sobrement l’idée d’aller au-devant d’eux; le contexte suffit à indiquer qu’il s’agit d’un affrontement.
