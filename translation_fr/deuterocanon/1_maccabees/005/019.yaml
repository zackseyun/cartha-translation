  yaml_path: translation/deuterocanon/1_maccabees/005/019.yaml
  text: And he commanded them[a], saying, “Take care of this people, and do not join battle with the nations until we return.”
translation:
  language: fr
  text: 'Il leur donna cet ordre : « Veillez sur ce peuple[a] et n’engagez pas le combat contre les nations avant notre retour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Prenez soin de ce peuple ». Le verbe grec peut exprimer aussi bien une vigilance protectrice que le souci concret de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο αὐτοῖς
  choice: Il leur donna cet ordre
  rationale: Cette formulation naturelle conserve la force d’autorité du verbe ἐντέλλομαι et rend explicitement le pronom αὐτοῖς.
- source_word: Πρόσεχετε, τοῦ λαοῦ τούτου
  choice: Veillez sur ce peuple
  rationale: Avec le génitif, l’impératif exprime ici une attention vigilante, vraisemblablement protectrice. « Veillez sur » reste naturel sans préciser davantage la nature de cette protection.
- source_word: μὴ συνάψητε πόλεμον
  choice: n’engagez pas le combat
  rationale: L’expression grecque désigne le fait d’entrer dans un affrontement armé. Cette traduction conserve le caractère militaire et l’interdiction de prendre l’initiative avant le retour du groupe.
- source_word: πρὸς τὰ ἔθνη
  choice: contre les nations
  rationale: « Les nations » rend directement ἔθνη et préserve la référence générale aux peuples non juifs environnants sans importer le terme théologiquement plus marqué « païens ».
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: avant notre retour
  rationale: Le tour français exprime naturellement la limite temporelle donnée par ἕως suivi de l’infinitif articulé. Le pronom « notre » conserve la première personne du pluriel.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Il leur donna cet ordre » évite le tour plus lourd « il leur ordonna en disant ». « N’engagez pas le combat » est idiomatique tout en restant proche de l’expression militaire grecque.
