revisions:
- from: Il traversa vers eux le premier[a], tandis que tout son peuple était devant lui. Toutes les nations furent écrasées devant lui ; elles jetèrent toutes leurs armes et s’enfuirent dans le sanctuaire[b] de Carnaïn.
  to: Il traversa le premier pour aller vers eux[a], et tout son peuple était devant lui. Toutes les nations furent écrasées devant lui ; elles jetèrent toutes leurs armes et s’enfuirent dans le sanctuaire[b], à Carnaïn.
  rationale: La révision corrige une construction française peu naturelle tout en maintenant l'ambiguïté de πρός αὐτούς, signalée par la note. Elle conserve la tension syntaxique du grec entre le fait qu'il passe « le premier » et le fait que tout son peuple est « devant lui », sans tentative d'harmonisation. La localisation de Carnaïn est rendue explicitement comme telle.
