  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
translation:
  language: fr
  text: Il traversa le premier pour aller vers eux[a], et tout son peuple était devant lui. Toutes les nations furent écrasées devant lui ; elles jetèrent toutes leurs armes et s’enfuirent dans le sanctuaire[b], à Carnaïn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre eux » ; le grec peut exprimer soit la direction (« vers eux »), soit, dans ce contexte, un mouvement hostile (« contre eux »).
    reason: lexical_alternative
  - marker: b
    text: Ou « enceinte sacrée » ; le mot grec désigne un espace consacré, souvent l’enceinte d’un temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: traversa
  rationale: Le verbe exprime le passage d’un côté à l’autre. « Traverser » conserve ce mouvement sans préciser indûment le terrain franchi.
- source_word: πρὸς αὐτούς
  choice: vers eux
  rationale: Avec l’accusatif, πρός indique ici un mouvement en direction d’eux et peut, dans ce contexte militaire, avoir la nuance de « contre eux ». « Vers eux » préserve l’ambiguïté directionnelle.
- source_word: πρότερον
  choice: le premier
  rationale: Dans la continuité du récit, l’adverbe indique le plus naturellement qu’il effectue la traversée avant les autres.
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: tout son peuple
  rationale: Cette traduction garde le sens ordinaire de λαός, même si le contexte montre qu’il s’agit ici de ses troupes.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: devant lui
  rationale: La formulation spatiale directe respecte le grec, y compris la tension apparente avec « le premier », sans la corriger conjecturalement.
- source_word: συνετρίβησαν
  choice: furent écrasées
  rationale: Le passif décrit une défaite décisive et conserve l’image grecque d’un adversaire brisé.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: « Nations » rend largement ἔθνη sans imposer ici le sens théologique plus étroit de « païens ».
- source_word: ἔρριψαν πάντα τὰ ὅπλα αὐτῶν
  choice: jetèrent toutes leurs armes
  rationale: La formulation rend l’abandon énergique de l’ensemble de leurs armes dans la déroute.
- source_word: τέμενος
  choice: sanctuaire
  rationale: Le terme désigne un espace consacré ou une enceinte sacrée. « Sanctuaire » est naturel, digne et suffisamment large en français moderne.
- source_word: ἐν Καρναΐν
  choice: de Carnaïn
  rationale: Le complément désigne le sanctuaire situé à Carnaïn ; « de » est idiomatique en français, et le toponyme suit de près la forme grecque.
