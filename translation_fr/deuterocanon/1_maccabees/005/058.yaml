  text: And they gave orders to those of the force with them[a], and they marched against Jamnia.
translation:
  language: fr
  text: Ils donnèrent des ordres aux hommes de la troupe qui les accompagnait, puis ils marchèrent contre Jamnia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Jamnia ». L’expression grecque peut simplement indiquer un déplacement en direction d’un lieu, mais, dans ce contexte militaire, elle évoque probablement une avancée hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  choice: donnèrent des ordres
  rationale: Le verbe désigne ici la transmission d’ordres dans un cadre militaire. Cette expression est naturelle en français moderne et conserve la force du grec.
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: aux hommes de la troupe qui les accompagnait
  rationale: δύναμις désigne ici une force militaire. « Aux hommes de la troupe » rend le groupe de personnes visé par la tournure avec ἀπό, tandis que « qui les accompagnait » exprime naturellement τῆς μετʼ αὐτῶν.
- source_word: ἐπορεύθησαν
  choice: ils marchèrent
  rationale: Dans ce récit militaire, « marchèrent » rend le déplacement organisé de la troupe, sans dépasser le sens contextuel du verbe.
- source_word: ἐπὶ Ἰαμνίαν
  choice: contre Jamnia
  rationale: Avec un verbe de déplacement militaire, ἐπί suivi de l’accusatif peut indiquer une avancée hostile. « Contre » exprime ce sens probable, tandis que l’ambiguïté directionnelle est signalée en note.
- source_word: Ἰαμνίαν
  choice: Jamnia
  rationale: « Jamnia » est la forme française traditionnelle et courante du nom de cette ville.
