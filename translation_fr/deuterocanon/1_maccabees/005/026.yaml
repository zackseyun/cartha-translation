  text: and that many of them are shut up in Bosora and Bosor[a], in Alamis, Casphor, Maked, and Carnaim; all these cities are fortified and large.
translation:
  language: fr
  text: et qu’un grand nombre d’entre eux sont enfermés à Bossora et à Bosor[a], à Alamoïs, Casphôr, Maked et Karnaïn. Toutes ces villes sont grandes et fortifiées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms de lieux grecs sont difficiles à identifier et leurs formes varient selon les traditions de traduction. Le présent texte suit de près la translittération du texte grec de Swete, sans les harmoniser avec des formes plus courantes.
    reason: cultural_note
lexical_decisions:
- source_word: συνειλημμένοι
  choice: sont enfermés
  rationale: Le participe exprime l’idée d’être retenus ou cernés dans ces villes, sans imposer le sens militaire plus précis d’« assiégés ».
- source_word: εἰς / ἐν
  choice: à
  rationale: Avec les noms de lieux et l’état résultant exprimé par le participe, le français emploie naturellement « à ».
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: Bossora et Bosor, à Alamoïs, Casphôr, Maked et Karnaïn
  rationale: Translittération française prudente des formes grecques de Swete, sans harmonisation avec d’autres traditions textuelles ou géographiques.
- source_word: ὀχυραὶ
  choice: fortifiées
  rationale: L’adjectif décrit concrètement la force défensive des villes.
- source_word: μεγάλαι
  choice: grandes
  rationale: « Grandes » conserve le sens descriptif sans préciser s’il s’agit de superficie, de population ou d’importance.
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: Toutes ces villes
  rationale: Rend directement la récapitulation grecque des lieux énumérés.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’ambiguïté de συνειλημμένοι entre le fait d’être retenus, cernés ou enfermés, et maintient des formes proches du témoin grec pour les toponymes.
