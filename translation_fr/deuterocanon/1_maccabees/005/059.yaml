  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: fr
  text: Gorgias sortit de la ville, et ses hommes aussi, pour aller à leur rencontre au combat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι exprime ici le mouvement depuis l’intérieur de la ville vers l’extérieur; le passé simple convient au récit historique.
- source_word: πόλεως
  choice: ville
  rationale: πόλις désigne normalement une ville ou une cité; « ville » est naturel en français moderne et convient au cadre militaire.
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: avec ses hommes
  rationale: Dans ce contexte, ἄνδρες désigne les hommes placés sous le commandement de Gorgias. « Ses hommes » reste proche du grec sans expliciter davantage par « soldats ».
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: pour les affronter
  rationale: L’expression signifie aller à leur rencontre; dans ce contexte hostile, « affronter » rend naturellement la rencontre militaire, explicitée par εἰς πόλεμον.
- source_word: εἰς πόλεμον
  choice: au combat
  rationale: L’expression indique la finalité guerrière de la rencontre. « Au combat » conserve le sens martial dans une formulation française fluide.
