  yaml_path: translation/deuterocanon/1_maccabees/005/015.yaml
  text: saying[a], “A gathering has been assembled against them from Ptolemais and Tyre and Sidon and all Galilee of the foreigners, to wipe us out.”
translation:
  language: fr
  text: 'en disant : « Une troupe a été rassemblée contre eux, venant de Ptolémaïs, de Tyr, de Sidon et de toute la Galilée des étrangers[a], afin de nous anéantir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute la Galilée des gens d’autres peuples ». Le grec emploie un terme qui désigne des personnes appartenant à un autre peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent pluriel est rendu directement, sans préciser l’identité des locuteurs au-delà du contexte.
- source_word: Ἐπισυνήχθη
  choice: Une troupe a été rassemblée
  rationale: La forme passive aoriste est conservée. « Une troupe » explicite avec retenue le groupe collectif sous-entendu par le verbe dans ce contexte militaire, sans aller jusqu’à préciser « une armée ».
- source_word: ἐπʼ αὐτούς
  choice: contre eux
  rationale: Avec l’accusatif, ἐπί exprime ici une direction hostile ; « contre eux » est naturel et n’ajoute pas l’idée explicite d’une attaque déjà engagée.
- source_word: ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος
  choice: venant de Ptolémaïs, de Tyr, de Sidon
  rationale: « Venant de » rattache clairement les lieux d’origine à la troupe rassemblée. Les toponymes suivent leurs formes françaises usuelles.
- source_word: πάσης Γαλιλαίας ἀλλοφύλων
  choice: de toute la Galilée des étrangers
  rationale: Cette formulation reste proche de la construction grecque et conserve son ambiguïté, plutôt que de transformer ἀλλόφυλοι en catégorie théologique explicite.
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  choice: afin de nous anéantir
  rationale: L’infinitif articulé exprime le but. « Anéantir » communique l’idée d’une destruction totale dans un registre soutenu mais courant.
theological_decisions:
- issue: Valeur de ἀλλοφύλων dans un récit militaire
  choice: des étrangers
  alternative: des gens d’autres peuples ; des nations
  rationale: Le mot désigne d’abord des personnes appartenant à un autre peuple. « Étrangers » maintient ici la portée ethnique et politique sans imposer le terme théologique « païens ».
- issue: Passage de la troisième à la première personne
  choice: contre eux… nous anéantir
  alternative: contre nous… nous anéantir
  rationale: Le grec passe explicitement de αὐτούς (« eux ») à ἡμᾶς (« nous »). La traduction préserve cette tension au lieu de l’harmoniser.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve la voix passive et le changement de personne du grec, tout en ajoutant seulement le collectif implicite « une troupe » pour obtenir une phrase française intelligible.
