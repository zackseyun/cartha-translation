  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
translation:
  language: fr
  text: Il les poursuivit jusqu’aux villes de Ptolémaïs. Environ trois mille hommes des nations tombèrent[a], et il s’empara de leur butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se traduire sans nuance d’approximation : « trois mille hommes des nations tombèrent ». « Des nations » désigne ici des non-Israélites engagés dans les forces adverses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: poursuivit
  rationale: Dans ce contexte militaire, le verbe exprime la poursuite d’une troupe en fuite; « poursuivit » est naturel et proche du grec.
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: jusqu’aux villes de Ptolémaïs
  rationale: ἕως suivi du génitif indique la limite atteinte. Le pluriel explicite πόλεων est conservé, malgré l’incertitude sur la réalité géographique précise qu’il désigne.
- source_word: ἔπεσον
  choice: tombèrent
  rationale: En contexte de bataille, le verbe signifie tomber au combat. « Tombèrent » conserve l’expression militaire du grec sans expliciter davantage par « furent tués ».
- source_word: ἐκ τῶν ἐθνῶν
  choice: des nations
  rationale: L’expression désigne ici les peuples non israélites appartenant aux forces adverses. « Des nations » reste transparent et évite les connotations potentiellement plus spécialisées de « païens ».
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: environ trois mille hommes
  rationale: Avec un nombre, εἰς peut marquer un total et éventuellement une approximation. « Environ » rend cette nuance possible dans un français naturel, sans présenter le chiffre comme nécessairement exact.
- source_word: τὰ σκῦλα αὐτῶν
  choice: leurs dépouilles
  rationale: σκῦλα désigne le butin pris aux vaincus après le combat; « leurs dépouilles » restitue également le possessif αὐτῶν et convient au registre narratif militaire.
