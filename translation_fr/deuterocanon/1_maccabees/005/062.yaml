  yaml_path: translation/deuterocanon/1_maccabees/005/062.yaml
  text: But they were not from the offspring of those men through whose hand deliverance had been given to Israel[a].
translation:
  language: fr
  text: Mais eux n’étaient pas de la descendance de ces hommes par l’intermédiaire desquels la délivrance avait été accordée à Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par leur main »; autrement : « par eux ».'
    reason: La note signale l’image concrète et l’idiome d’agence de διὰ χειρὸς αὐτῶν, rendus plus naturellement dans le texte.
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Mais eux
  rationale: δέ marque ici le contraste avec le contexte précédent, tandis que le pronom explicite et accentué αὐτοί justifie « eux ».
- source_word: ἐκ τοῦ σπέρματος
  choice: de la descendance
  rationale: Dans cette expression généalogique, σπέρμα désigne la lignée ou la postérité. « Descendance » est naturel en français moderne et conserve précisément ce sens.
- source_word: τῶν ἀνδρῶν ἐκείνων
  choice: de ces hommes
  rationale: ἀνδρῶν désigne ici des figures masculines déterminées, et ἐκείνων les identifie comme les hommes évoqués ou connus dans le contexte.
- source_word: σωτηρία
  choice: la délivrance
  rationale: Dans ce cadre historique et militaire, le terme évoque le secours et la préservation d’Israël. « Délivrance » évite de limiter le sens à la victoire comme d’y importer une portée doctrinale étrangère au contexte.
- source_word: ἐδόθη
  choice: avait été accordée
  rationale: Le passif est conservé sans expliciter l’agent; le plus-que-parfait rend naturellement l’antériorité de cette délivrance par rapport au récit.
- source_word: διὰ χειρὸς αὐτῶν
  choice: par l’intermédiaire desquels
  rationale: L’expression sémitisante signifie l’agence ou la médiation. Cette formulation française transmet clairement le sens sans introduire un pluriel maladroit avec le singulier « main ».
theological_decisions:
- issue: Sens de σωτηρία dans un contexte historique et militaire
  choice: délivrance
  alternative: salut; victoire
  rationale: « Délivrance » garde l’idée concrète qu’Israël a été sauvé d’un danger, sans réduire le terme à un succès militaire ni lui imposer une acception sotériologique plus tardive.
- issue: Agent implicite du passif ἐδόθη
  choice: ne pas nommer celui qui accorde la délivrance
  alternative: expliciter Dieu comme agent
  rationale: Le grec emploie un passif sans agent exprimé. Même si un passif divin est possible, la traduction préserve cette retenue et ne résout pas l’ambiguïté.
- issue: Expression d’agence διὰ χειρὸς αὐτῶν
  choice: par l’intermédiaire desquels
  alternative: par leur main; par eux
  rationale: Le choix exprime la médiation humaine tout en laissant ouverte la question de l’agent ultime de la délivrance. La note conserve l’image littérale de la main.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial, la dimension généalogique et le passif du grec, tout en rendant naturellement l’idiome sémitisant d’agence.
