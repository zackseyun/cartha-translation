  text: And Judas gave orders to make proclamation in the camp that each should encamp in the place where he is.
translation:
  language: fr
  text: Judas ordonna qu’on proclame dans le camp que chacun campe à l’endroit où il se trouve.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que chacun reste là où il se trouve ». La formulation grecque peut être comprise comme l’ordre donné à chacun de demeurer à sa position actuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime un ordre donné avec autorité; « ordonna » est direct, naturel et digne en français moderne.
- source_word: κηρῦξαι
  choice: de faire proclamer
  rationale: L’infinitif désigne une annonce publique faite dans le camp; la tournure factitive convient puisque Judas ordonne qu’elle soit proclamée.
- source_word: παρεμβολῇ
  choice: camp
  rationale: Dans ce contexte militaire, παρεμβολή désigne clairement le camp.
- source_word: παρεμβαλεῖν
  choice: reste
  rationale: Littéralement, le verbe signifie « camper » ou « établir son camp »; avec « là où il se trouvait », l’ordre vise vraisemblablement à maintenir chacun à sa position actuelle. « Reste » rend ce sens naturellement, tandis que la note conserve la formulation plus littérale.
- source_word: ἕκαστον
  choice: chacun
  rationale: « Chacun » préserve la valeur distributive du singulier grec sans préciser un genre absent du texte.
- source_word: ἐν ᾧ ἐστιν τόπῳ
  choice: là où il se trouvait
  rationale: Cette expression locative renvoie à l’emplacement occupé par chaque personne au moment de l’ordre; l’imparfait est idiomatique dans le discours indirect français.
