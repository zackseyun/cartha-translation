  yaml_path: translation/deuterocanon/1_maccabees/005/031.yaml
  text: And Judas saw that the battle had begun[a], and the outcry of the city went up to heaven with trumpet blasts and a great cry.
translation:
  language: fr
  text: Judas vit que le combat avait commencé, et la clameur de la ville monta jusqu’au ciel, au son des trompettes et d’un grand cri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des trompettes et un grand cri ». Les datifs grecs peuvent désigner plus précisément le moyen ou, plus généralement, les sons qui accompagnent la clameur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρκται
  choice: avait commencé
  rationale: Le parfait moyen-passif indique que le combat avait déjà commencé lorsque Judas s’en aperçut ; le plus-que-parfait convient à la succession narrative.
- source_word: ὁ πόλεμος
  choice: le combat
  rationale: Dans cette scène, πόλεμος désigne l’affrontement en cours plutôt que l’ensemble d’une guerre.
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: la clameur de la ville
  rationale: κραυγή évoque un cri collectif puissant ; le génitif indique ici la clameur qui s’élève de la ville.
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: monta jusqu’au ciel
  rationale: Cette formulation conserve l’image verticale et la portée de ἕως sans raideur en français.
- source_word: σάλπιγξιν
  choice: au son des trompettes
  rationale: Le datif pluriel exprime vraisemblablement l’accompagnement ou la manière ; « au son » rend explicite le bruit produit par les instruments dans ce contexte militaire.
- source_word: κραυγῇ μεγάλῃ
  choice: et d’un grand cri
  rationale: Le second datif décrit lui aussi le bruit accompagnant la clameur ; le singulier et l’intensité de μεγάλη sont conservés.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition entre « clameur » et « grand cri », présente dans le grec, est maintenue plutôt que lissée ; elle renforce l’intensité sonore de la scène.
