  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: fr
  text: Et il partit pour se rendre dans le pays des étrangers[a], et il passa par la Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, peut-être : « le pays des Philistins ». Dans l’usage biblique, le grec ἀλλόφυλοι peut servir de désignation conventionnelle des Philistins ; toutefois, « étrangers » est retenu ici parce que ce verset ne précise pas davantage leur identité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: il partit
  rationale: L’aoriste de ἀπαίρω marque ici le départ et le commencement du déplacement. « Il partit » est naturel et fidèle en français.
- source_word: τοῦ πορευθῆναι
  choice: pour se rendre
  rationale: L’infinitif articulé exprime le but après ἀπῆρεν. « Pour se rendre » restitue clairement la destination visée.
- source_word: γῆν ἀλλοφύλων
  choice: le pays des étrangers
  rationale: ἀλλόφυλοι désigne littéralement des gens d’un autre peuple et peut, dans l’usage biblique, servir de désignation conventionnelle aux Philistins. Le rendu plus général conserve ici l’indétermination du grec.
- source_word: διεπορεύετο
  choice: il traversa
  rationale: Le verbe indique un déplacement à travers une région. Malgré l’imparfait grec, le passé simple convient au fil narratif français et exprime naturellement l’action envisagée dans son déroulement.
- source_word: τὴν Σαμάριαν
  choice: la Samarie
  rationale: Forme française consacrée du nom géographique.
