  text: And they said[a], “Let us also make a name for ourselves[b], and let us go to fight against the nations around us.”
translation:
  language: fr
  text: 'Et ils dirent : « Faisons-nous, nous aussi, un nom[a], et allons combattre les nations[b] qui nous entourent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « acquérons du renom ». Littéralement : « faisons-nous un nom ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les non-Juifs qui nous entourent ». Le terme grec peut désigner ici les peuples non juifs des alentours.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  choice: Faisons-nous ... un nom
  rationale: Conserve l’image grecque et l’idiome biblique, tout en restant compréhensible en français moderne; le sens est acquérir du renom.
- source_word: καὶ αὐτοὶ
  choice: nous aussi
  rationale: Rend explicitement l’idée d’addition et l’insistance portée par αὐτοί dans le discours direct.
- source_word: πορευθῶμεν πολεμῆσαι
  choice: allons combattre
  rationale: Expression naturelle qui respecte le verbe de déplacement suivi de l’infinitif indiquant l’action militaire projetée.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Choix proche du grec, qui laisse au contexte le soin d’indiquer qu’il s’agit des peuples non juifs voisins.
- source_word: τὰ κύκλῳ ἡμῶν
  choice: qui nous entourent
  rationale: Rend clairement et naturellement la situation géographique exprimée par κύκλῳ.
theological_decisions:
- issue: Portée de l’expression « se faire un nom »
  choice: Conserver l’idiome « Faisons-nous un nom »
  alternative: « Acquérons du renom »
  rationale: La formulation retenue préserve la résonance littéraire biblique sans imposer une évaluation morale supplémentaire.
- issue: Sens de ἔθνη
  choice: « les nations »
  alternative: « les païens » ou « les non-Juifs »
  rationale: « Nations » conserve l’amplitude lexicale du grec et évite de durcir en opposition théologique ce récit avant tout historique et militaire.
translation_notes:
  register: Français international moderne, narratif et digne. L’ordre « nous aussi » restitue l’emphase grecque; « combattre » évite le tour plus lourd « faire la guerre » tout en gardant la portée militaire.
