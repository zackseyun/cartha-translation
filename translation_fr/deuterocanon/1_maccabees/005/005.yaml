  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: fr
  text: Ils furent enfermés par lui dans les tours. Il établit son camp contre eux, les voua à la destruction[a] et livra aux flammes les tours de la ville[b], avec tous ceux qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mit au ban ». Le verbe grec désigne ici le fait de vouer des personnes ou des biens à la destruction, et non simplement de les maudire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses tours ». Le grec emploie un pronom féminin singulier qui renvoie vraisemblablement à la ville dans le contexte.
    reason: source_ambiguity
lexical_decisions:
- source_word: διεκλείσθησαν
  choice: furent enfermés
  rationale: Le passif grec indique qu’ils furent confinés par l’action de Judas. « Furent enfermés » conserve cette voix et reste naturel en français.
- source_word: πύργους
  choice: tours
  rationale: Le terme désigne ordinairement des tours, ici des ouvrages défensifs. Le rendre simplement par « tours » évite de préciser abusivement leur nature.
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: établit son camp contre eux
  rationale: Le verbe évoque concrètement l’établissement d’un camp, tandis que la préposition marque l’hostilité. Cette formulation laisse le contexte exprimer l’idée de siège sans la substituer à l’image grecque.
- source_word: ἀνεθεμάτισεν
  choice: les voua à la destruction
  rationale: Le verbe exprime la mise au ban en vue de la destruction, avec une portée religieuse plus forte qu’un simple « détruisit » ou « maudit ».
- source_word: ἐνεπύρισεν
  choice: incendia
  rationale: Le verbe signifie mettre le feu ou livrer aux flammes. « Incendia » rend naturellement en français le verbe renforcé par la mention grecque du feu, sans la répétition peu idiomatique « brûla par le feu ».
- source_word: αὐτῆς
  choice: de la ville
  rationale: Le pronom grec est féminin singulier et renvoie vraisemblablement à la ville sous-entendue dans le contexte. L’explicitation française évite un possessif sans antécédent clair, tandis qu’une note signale la forme littérale.
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: avec tous ceux qui s’y trouvaient
  rationale: La formulation rend l’inclusion totale de toutes les personnes présentes à l’intérieur, sans imposer qu’elles y résidaient durablement.
theological_decisions:
- issue: Valeur de ἀνεθεμάτισεν dans le contexte de guerre sacrée
  choice: les voua à la destruction
  alternative: les mit au ban ; les détruisit entièrement
  rationale: Le grec évoque la consécration au bannissement destructeur connue du langage biblique de la guerre. La traduction retenue conserve cette portée religieuse sans employer dans le texte principal un jargon devenu peu transparent.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe conserve la succession rapide des actions militaires du grec. « Établit son camp » maintient l’image concrète de παρέβαλεν, tandis que « incendia » évite une répétition artificielle autour du mot « feu ».
