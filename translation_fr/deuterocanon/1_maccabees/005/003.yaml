  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: fr
  text: Judas combattait contre les fils d’Ésaü en Judée, dans l’Akrabattène[a], parce qu’ils encerclaient Israël. Il leur porta un rude coup, les réduisit et prit leurs dépouilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’Akrabattène est le nom d’une région de Judée. La syntaxe grecque, très condensée, peut aussi se comprendre : « en Judée, à Akrabattène ».'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπολέμει
  choice: combattit
  rationale: L’imparfait grec présente une action militaire en cours; le passé simple convient au récit français et « combattit » exprime naturellement l’hostilité marquée par πρὸς.
- source_word: υἱοὺς Ἠσαῦ
  choice: les fils d’Ésaü
  rationale: Cette traduction conserve l’expression généalogique explicite du grec, plutôt que de la remplacer dans le texte par l’identification interprétative « les Édomites ».
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: en Judée, dans la région d’Akrabattène
  rationale: La syntaxe grecque est condensée. Cette formulation claire traite l’Akrabattène comme une désignation régionale sans effacer l’incertitude syntaxique, signalée en note.
- source_word: περικάθηντο
  choice: encerclaient
  rationale: Le verbe évoque le fait de se tenir autour et d’exercer une pression hostile. « Encerclaient » conserve cette image sans imposer l’idée plus précise d’un siège urbain.
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Le collectif singulier du grec est maintenu, avec sa portée nationale et biblique.
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην
  choice: leur infligea une lourde défaite
  rationale: L’expression grecque est un idiome militaire. Cette traduction naturelle en français en restitue le sens sans calquer maladroitement « frapper d’un grand coup ».
- source_word: συνέστειλεν αὐτούς
  choice: les soumit
  rationale: Dans ce contexte militaire, le verbe signifie réduire, contenir ou subjuguer. « Les soumit » exprime la réduction de l’adversaire sans suggérer son anéantissement.
- source_word: τὰ σκῦλα αὐτῶν
  choice: leurs dépouilles
  rationale: « Dépouilles » est un terme français établi pour les biens pris à l’ennemi après une victoire militaire.
