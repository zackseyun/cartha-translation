  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: fr
  text: Ils arrivèrent jusqu’à Éphron. C’était une grande ville située à l’entrée[a], extrêmement bien fortifiée. Il n’était pas possible de la contourner ni par la droite ni par la gauche ; il fallait passer en plein milieu de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au défilé » ou « sur la voie d’accès » ; l’expression grecque présente Éphron comme contrôlant le passage, ce qui explique qu’il était impossible de la contourner.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: Ils arrivèrent jusqu’à Éphron
  rationale: ἕως marque ici le point atteint. « Arrivèrent jusqu’à » est naturel en français et conserve cette nuance spatiale.
- source_word: αὕτη ἡ πόλις μεγάλη
  choice: C’était une grande ville
  rationale: Cette formulation rend explicitement le démonstratif αὕτη tout en assurant un enchaînement naturel après le nom de lieu.
- source_word: ἡ τῆς εἰσόδου
  choice: située à l’entrée
  rationale: Le génitif qualifie vraisemblablement la position stratégique de la ville sur une voie d’accès. La note conserve les autres sens contextuellement possibles.
- source_word: ἰσχυρὰ σφόδρα
  choice: extrêmement bien fortifiée
  rationale: Dans le cas d’une ville qui bloque un itinéraire militaire, ἰσχυρά désigne naturellement la puissance de ses défenses ; σφόδρα intensifie fortement l’adjectif.
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: Il n’était possible de la contourner ni par la droite ni par la gauche
  rationale: La construction impersonnelle exprime l’impossibilité, et ἐκκλῖναι indique ici qu’on ne pouvait dévier de l’itinéraire pour éviter la ville.
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: il fallait passer en plein milieu de la ville
  rationale: La tournure grecque oppose à tout détour l’unique possibilité de traverser la ville elle-même ; « en plein milieu » rend la force de διὰ μέσου.
