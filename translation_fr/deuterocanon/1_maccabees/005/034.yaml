translation_notes:
  register: Français moderne, international et digne. La première phrase évite une période excessivement longue ; « ses hommes » explicite que le camp désigne collectivement les troupes, sans changer le référent. Le point-virgule maintient l’enchaînement rapide du récit de bataille.
