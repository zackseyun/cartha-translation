  yaml_path: translation/deuterocanon/1_maccabees/005/034.yaml
  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
translation:
  language: fr
  text: Le camp de Timothée reconnut que c’était Maccabée. Ses hommes s’enfuirent devant lui ; il leur infligea une lourde défaite, et près de huit mille[a] d’entre eux tombèrent ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « huit mille hommes » ; l’expression grecque peut désigner un total approximatif ou arrondi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνω
  choice: reconnut
  rationale: Le verbe exprime ici l’identification de l’adversaire ; « reconnut » convient naturellement au contexte militaire.
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: le camp de Timothée
  rationale: παρεμβολή désigne couramment un camp ou un campement militaire. En français, « le camp de Timothée » peut aussi désigner naturellement les hommes qui le composent.
- source_word: ὁ Μακκαβαῖός
  choice: Maccabée
  rationale: La forme française traditionnelle « Maccabée » rend le nom ou surnom grec ; l’article grec n’a pas besoin d’être reproduit devant ce nom en français.
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: s’enfuirent devant lui
  rationale: Cette formulation française naturelle conserve l’image de la fuite devant la présence de Maccabée.
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: il leur infligea une lourde défaite
  rationale: L’expression grecque signifie littéralement qu’il les frappa d’un grand coup ; dans ce contexte militaire, « infligea une lourde défaite » en communique clairement le sens sans suggérer un seul coup physique.
- source_word: ἔπεσον
  choice: tombèrent
  rationale: « Tombèrent » conserve l’euphémisme militaire du grec, tout en étant compris comme une mort au combat.
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: près de huit mille
  rationale: εἰς devant un nombre peut présenter un total allant jusqu’à ce chiffre ou un chiffre arrondi. « Près de huit mille » rend cette nuance approximative, explicitée en note.
