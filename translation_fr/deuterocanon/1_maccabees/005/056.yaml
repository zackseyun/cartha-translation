  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
translation:
  language: fr
  text: Joseph, fils de Zacharie, et Azarias[a], chefs des troupes, entendirent parler des actes de bravoure et des faits de guerre qu’ils avaient accomplis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’édition grecque de Swete, le second nom paraît être « Zacharie » (Ζαχαρίας) ; le contexte du récit et la tradition textuelle courante appuient toutefois la leçon « Azarias ».
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: entendirent parler
  rationale: Le verbe signifie « entendre » ou « apprendre par ouï-dire ». « Entendirent parler » introduit naturellement en français le récit des actions rapportées. Le pluriel s’accorde avec le sujet composé, malgré le singulier du texte grec transmis.
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: Joseph, fils de Zacharie
  rationale: L’article suivi du génitif exprime ici la filiation. Cette formulation est claire et idiomatique en français moderne.
- source_word: Ζαχαρίας
  choice: Azarias
  rationale: Le texte grec de Swete reproduit ici « Zacharie », mais le contexte narratif et la tradition textuelle courante identifient le second chef comme Azarias. L’incertitude du texte source est signalée en note.
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: chefs des troupes
  rationale: ἄρχοντες désigne des dirigeants ou commandants, et δυνάμεις les forces armées. « Chefs des troupes » exprime la fonction militaire sans imposer un grade moderne précis.
- source_word: ἀνδραγαθήσεων
  choice: actes de bravoure
  rationale: Le terme désigne des manifestations de courage ou de valeur. « Actes de bravoure » en conserve le sens élogieux dans un registre actuel et digne.
- source_word: τοῦ πολέμου
  choice: faits de guerre
  rationale: Dans le parallélisme avec les actes de bravoure, « faits de guerre » rend concrètement les actions accomplies au combat, sans réduire le terme au concept abstrait de guerre.
- source_word: οἷα ἐποίησαν
  choice: qu’ils avaient accomplis
  rationale: La relative renvoie aux actions rapportées. Le plus-que-parfait marque naturellement leur antériorité par rapport au moment où Joseph et Azarias en entendent parler.
