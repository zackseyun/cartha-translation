  text: After these words[a], Timotheus gathered another camp and encamped opposite Raphon, beyond the stream.
translation:
  language: fr
  text: Après ces paroles, Timothée rassembla une autre armée et campa en face de Raphôn, de l’autre côté du torrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà du cours d’eau saisonnier » ou « de l’autre côté de l’oued » ; le mot grec peut désigner un cours d’eau qui coule surtout pendant la saison des pluies.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: Après ces paroles
  rationale: La formule sert de transition temporelle et renvoie vraisemblablement aux paroles qui précèdent. « Paroles » conserve le sens direct de ῥήματα sans exclure entièrement l’idée plus générale de faits ou d’événements.
- source_word: συνήγαγεν
  choice: rassembla
  rationale: Le verbe signifie réunir ou assembler et convient naturellement à la mobilisation d’une troupe.
- source_word: παρεμβολὴν ἄλλην
  choice: une autre troupe
  rationale: παρεμβολή peut désigner un camp, mais aussi, par métonymie, les forces qui y campent. Puisque l’on rassemble des hommes plutôt qu’un emplacement et que le verbe suivant exprime déjà l’établissement du camp, « troupe » rend ici le sens militaire avec naturel.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Cette expression française claire restitue le sens militaire de camper ou d’installer un camp, tout en évitant la répétition maladroite de « camp ».
- source_word: κατὰ πρόσωπον
  choice: en face de
  rationale: Dans ce contexte géographique et militaire, la locution indique une position faisant face à un lieu.
- source_word: Ῥαφὼν
  choice: Raphôn
  rationale: Le nom de lieu est translittéré à partir du grec, avec un accent circonflexe indiquant naturellement la voyelle longue en français.
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: de l’autre côté du torrent
  rationale: La formule situe le camp au-delà du cours d’eau. χειμάρρους peut désigner un torrent ou un cours d’eau saisonnier; « torrent » reste accessible et conserve la nuance du terme grec.
