  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: fr
  text: Quand Judas et le peuple entendirent ces paroles[a], une grande assemblée se réunit pour délibérer sur ce qu’ils devaient faire en faveur de leurs frères[b], qui étaient dans la détresse et étaient attaqués par eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces nouvelles » ou « ce message » ; littéralement « ces paroles ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne les membres de leur propre peuple.
    reason: cultural_note
  - marker: c
    text: Littéralement « et auxquels ils faisaient la guerre ». Le pronom renvoie, d’après le contexte, aux adversaires mentionnés auparavant.
    reason: referent_clarification
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Quand … entendirent
  rationale: La tournure introduit naturellement une proposition temporelle dans le récit. Le singulier grec peut s’accorder avec le premier élément d’un sujet composé; le français moderne exige ici le pluriel avec « Judas et le peuple ».
- source_word: Ἰούδας καὶ ὁ λαός
  choice: Judas et le peuple
  rationale: « Judas » suit la forme traditionnelle du nom dans 1 Maccabées; « le peuple » rend directement λαός sans le réduire à l’armée.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: Rend littéralement λόγους tout en restant naturel; dans le contexte, le groupe de mots peut aussi désigner les nouvelles ou le message qui vient d’être transmis.
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: une grande assemblée se réunit
  rationale: Cette formulation exprime le rassemblement d’une assemblée publique sans donner à ἐκκλησία le sens chrétien ultérieur d’« Église ».
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: pour délibérer sur ce qu’ils devaient faire
  rationale: « Délibérer » conserve l’idée d’une consultation collective orientée vers une décision; l’imparfait traduit naturellement la délibération rapportée dans un récit au passé.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: en faveur de leurs frères
  rationale: Le datif indique ici les bénéficiaires de l’action envisagée. « Frères » préserve le terme de parenté masculin du grec, qui désigne dans ce contexte les membres de leur propre peuple.
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: qui étaient dans la détresse
  rationale: Cette expression claire et digne rend la pression, l’affliction et la situation critique exprimées par θλίψις.
- source_word: καὶ πολεμουμένοις ὑπʼ αὐτῶν
  choice: et subissaient leurs attaques
  rationale: Le participe passif désigne une action militaire hostile exercée contre eux. La formulation française évite la lourdeur de « contre lesquels on faisait la guerre », tout en conservant le pronom grec dont l’antécédent dépend du contexte.
theological_decisions:
- issue: Sens de ἐκκλησία dans un récit juif antérieur au christianisme
  choice: assemblée
  alternative: communauté / congrégation / Église
  rationale: « Assemblée » rend le sens public et collectif du mot sans importer une institution ecclésiale chrétienne ultérieure.
- issue: Portée de ἀδελφοῖς
  choice: frères
  alternative: compatriotes / membres de leur peuple / frères et sœurs
  rationale: Le texte grec emploie le masculin « frères ». Le contexte indique une solidarité entre membres du peuple juif; une note explicite cette portée sans remplacer le terme source.
- issue: Référent de ὑπʼ αὐτῶν
  choice: leurs attaques, avec maintien du pronom
  alternative: les attaques de leurs ennemis / des nations voisines
  rationale: Le référent se déduit du contexte antérieur, mais le verset conserve un pronom. La traduction ne précise donc pas dans le corps du texte ce que le grec laisse contextuel.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible; « délibérer » conserve la portée officielle de la grande assemblée. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
