  yaml_path: translation/deuterocanon/1_maccabees/005/038.yaml
  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: fr
  text: 'Judas envoya des hommes reconnaître le camp. Ils lui firent ce rapport : « Toutes les nations qui vous entourent se sont rassemblées contre eux[a] : c’est une force extrêmement nombreuse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « qui vous entourent… contre eux ». Les pronoms sont inattendus dans ce contexte, mais la traduction conserve le texte transmis au lieu de l’harmoniser en « contre vous » ou « qui nous entourent ».
    reason: Ambiguïté des pronoms dans le texte transmis.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Aoriste narratif courant de ἀποστέλλω ; « envoya » est naturel et fidèle dans ce récit.
- source_word: κατασκοπῆσαι
  choice: reconnaître
  rationale: L’infinitif désigne ici une mission d’observation militaire ; « reconnaître le camp » est idiomatique en français sans être excessivement technique.
- source_word: παρεμβολήν
  choice: le camp
  rationale: Dans ce contexte militaire, le nom désigne le campement des forces adverses ; « le camp » est clair et concis.
- source_word: ἀπήγγειλαν
  choice: lui firent ce rapport
  rationale: Le verbe exprime le fait de revenir avec des renseignements ; cette formulation convient au contexte de reconnaissance.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: se sont rassemblées
  rationale: La construction périphrastique au parfait décrit un rassemblement accompli dont le résultat demeure présent.
- source_word: πρὸς αὐτοὺς
  choice: contre eux
  rationale: Dans le contexte militaire, πρός désigne vraisemblablement une orientation hostile. Le pronom grec de troisième personne est conservé au lieu d’être harmonisé avec « vous ».
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Le terme ἔθνη vise les groupes ethnopolitiques voisins ; « nations » reste large et évite une interprétation religieuse ajoutée.
- source_word: τὰ κύκλῳ ὑμῶν
  choice: qui vous entourent
  rationale: La formulation rend naturellement la situation géographique tout en conservant la deuxième personne du texte grec.
- source_word: δύναμις πολλὴ σφόδρα
  choice: une force extrêmement nombreuse
  rationale: Dans un récit militaire, δύναμις désigne une force armée, tandis que πολλὴ σφόδρα en souligne fortement l’importance numérique.
