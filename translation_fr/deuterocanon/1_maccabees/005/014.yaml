  text: 'While the letters were still being read[a], behold, other messengers arrived from Galilee with their garments torn, reporting these words:'
translation:
  language: fr
  text: 'Pendant qu’on lisait encore les lettres, voici que d’autres messagers arrivèrent de Galilée, les vêtements déchirés[a], rapportant ces paroles :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant déchiré leurs vêtements ». Ce geste exprimait le deuil ou une profonde détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι … ἀνεγινώσκοντο
  choice: Pendant qu’on lisait encore
  rationale: L’imparfait passif présente une lecture en cours, tandis que ἔτι en souligne la continuité au moment de l’arrivée des messagers.
- source_word: αἱ ἐπιστολαὶ
  choice: les lettres
  rationale: Traduction directe et naturelle du pluriel dans ce contexte narratif.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve l’effet de soudaineté et attire l’attention sur l’arrivée inattendue, dans un français narratif digne et actuel.
- source_word: ἄγγελοι ἕτεροι
  choice: d’autres messagers
  rationale: Dans ce récit historique, ἄγγελοι désigne des porteurs humains de nouvelles; ἕτεροι les distingue des précédents.
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: arrivèrent de Galilée
  rationale: Rend idiomatiquement leur venue sur les lieux et leur provenance.
- source_word: διερρηχότες τὰ ἱμάτια
  choice: les vêtements déchirés
  rationale: Le participe parfait décrit leur état à l’arrivée tout en laissant entendre l’acte antérieur de déchirer leurs vêtements, geste de deuil ou de détresse.
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: et rapportèrent ces paroles
  rationale: Le participe est coordonné naturellement au verbe principal en français; «ces paroles» reste proche de l’expression grecque qui introduit le contenu du message.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité du grec; « vêtements » convient mieux que « habits » au geste solennel de détresse. Le marqueur de note est placé immédiatement après l’expression concernée.
