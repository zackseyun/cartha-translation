  yaml_path: translation/deuterocanon/1_maccabees/005/030.yaml
  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
translation:
  language: fr
  text: Quand vint le matin, ils levèrent les yeux, et voici qu’une foule immense, impossible à dénombrer[a], portait des échelles et des machines de siège[b] pour s’emparer de la forteresse ; ils les combattaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « innombrable » ou « trop nombreuse pour être comptée ».
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne des dispositifs ou engins employés pour donner l’assaut à une place fortifiée.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: Quand vint le matin
  rationale: Expression temporelle française naturelle qui conserve la transition narrative du grec.
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ils levèrent les yeux
  rationale: Conserve l’image et le style narratif biblique tout en restant parfaitement compréhensible en français moderne.
- source_word: ἰδοὺ
  choice: et voici que
  rationale: Rend la particule qui attire soudainement l’attention sur ce qui apparaît aux personnages.
- source_word: λαὸς πολὺς
  choice: une foule immense
  rationale: Dans ce contexte militaire, le terme désigne un très grand rassemblement de personnes ; « foule immense » exprime naturellement son ampleur.
- source_word: οὗ οὐκ ἦν ἀριθμός
  choice: impossible à dénombrer
  rationale: Rend de façon idiomatique et emphatique l’idée d’une multitude sans nombre assignable.
- source_word: αἴροντες κλίμακας
  choice: portait des échelles
  rationale: Le participe décrit le matériel transporté par les membres de la foule en vue de l’assaut ; l’accord au singulier suit naturellement « foule » en français.
- source_word: μηχανὰς
  choice: machines de siège
  rationale: Le contexte militaire indique des dispositifs employés pour attaquer une position fortifiée, plutôt que de simples machines au sens général.
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: pour s’emparer de la forteresse
  rationale: L’infinitif exprime le but de l’équipement d’assaut ; « forteresse » convient à la position fortifiée désignée par ὀχύρωμα.
- source_word: ἐπολέμουν αὐτούς
  choice: ils les combattaient
  rationale: L’imparfait conserve l’action en cours exprimée par l’imparfait grec. Les pronoms maintiennent la formulation concise du texte source sans ajouter une identification absente du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « et voici que » préserve l’effet de découverte du grec. Le passage du collectif singulier « une foule… portait » au pluriel « ils les combattaient » reflète la construction ad sensum du texte source et laisse aux pronoms leur concision originale.
