  text: And they met the Nabateans[a], and they greeted them peaceably, and they told them everything that had happened to their brothers in Gilead,
translation:
  language: fr
  text: Ils rencontrèrent les Nabatéens, qui vinrent à leur rencontre en paix[a] et leur racontèrent tout ce qui était arrivé à leurs frères en Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui les accueillirent pacifiquement » ou « qui les rencontrèrent en paix ». Le verbe grec peut désigner le fait d’aller à la rencontre de quelqu’un ou de l’accueillir; l’adverbe souligne le caractère pacifique de la rencontre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησαν
  choice: rencontrèrent
  rationale: Rend simplement la rencontre narrative, sans suggérer ni hostilité ni hasard.
- source_word: Ναβαταίοις
  choice: les Nabatéens
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  choice: qui vinrent à leur rencontre avec des intentions pacifiques
  rationale: Le verbe peut désigner le fait d’aller à la rencontre de quelqu’un, tandis que l’adverbe marque nettement le caractère pacifique de la démarche. Le relatif évite en français une répétition lourde de « rencontrèrent ».
- source_word: διηγήσαντο
  choice: racontèrent
  rationale: Le verbe évoque le récit ou l’exposé des événements; « racontèrent » est naturel et conserve cette nuance.
- source_word: ἅπαντα τὰ συμβεβηκότα
  choice: tout ce qui était arrivé
  rationale: Expression française idiomatique qui conserve la portée exhaustive de ἅπαντα.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: à leurs frères
  rationale: Préserve l’image de parenté du grec sans expliciter qu’il s’agit probablement de leurs compatriotes juifs.
- source_word: ἐν τῇ Γαλααδίτιδι
  choice: en Galaad
  rationale: Désignation française concise et traditionnelle de la région.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe clarifie que les Nabatéens sont le sujet du second verbe, conformément à l’enchaînement grec, tout en conservant dans la note l’ambiguïté lexicale entre aller à la rencontre et accueillir.
