  yaml_path: translation/deuterocanon/1_maccabees/005/033.yaml
  text: And he went out against them in three divisions from outside them[a]; and they sounded the trumpets and cried out in prayer.
translation:
  language: fr
  text: Il sortit contre eux en trois corps, venant de l’extérieur[a] ; il sonna des trompettes[b], et ils poussèrent des cris en priant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’extérieur d’eux ». Le grec ne précise pas de quel lieu il sortit ni s’il s’agit de l’extérieur de leur camp, de leur dispositif ou de leur position.'
    reason: ambiguity
  - marker: b
    text: 'Le grec emploie ici le singulier, « il sonna », puis passe au pluriel : « et ils poussèrent des cris ».'
    reason: grammatical_number_shift
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: Il sortit contre eux
  rationale: Le verbe signifie littéralement « sortir », mais le contexte militaire indique une sortie dirigée contre l’ennemi. La formulation explicite cette relation sans transformer le mouvement en une action plus précise que ne le permet le grec.
- source_word: ἐν τρισὶν ἀρχαῖς
  choice: en trois corps
  rationale: Dans ce contexte militaire, ἀρχαί désigne vraisemblablement des unités placées sous un commandement. « Corps » exprime des groupements tactiques sans les identifier nécessairement à des divisions au sens militaire moderne ni à trois chefs.
- source_word: ἔξωθεν αὐτῶν
  choice: depuis l’extérieur de leur position
  rationale: ἔξωθεν signifie « de l’extérieur » ou « depuis l’extérieur ». L’ajout explicatif de « position » rend la relation spatiale intelligible en français tout en maintenant l’imprécision du grec sur le lieu exact.
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: il sonna des trompettes
  rationale: Le verbe grec est au singulier et doit d’abord être respecté. « Sonner des trompettes » restitue l’expression militaire sans attribuer explicitement l’action à plusieurs hommes.
- source_word: ἐβόησαν
  choice: ils poussèrent des cris
  rationale: Le pluriel grec marque un changement explicite de sujet grammatical. « Pousser des cris » conserve l’intensité de l’action et s’enchaîne naturellement avec la prière.
- source_word: ἐν προσευχῇ
  choice: en priant
  rationale: La tournure idiomatique française exprime naturellement la manière dont ils poussèrent leurs cris. Elle conserve la valeur religieuse de προσευχή sans préciser indûment s’il s’agissait d’une supplication particulière.
theological_decisions:
- issue: Explicitation du caractère hostile de la sortie
  choice: Il sortit contre eux
  alternative: Il sortit
  rationale: Le récit est celui d’un affrontement militaire. « Contre eux » rend la direction hostile implicite dans le contexte sans ajouter de détail tactique.
- issue: Alternance entre le singulier ἐσάλπισεν et le pluriel ἐβόησαν
  choice: 'Conserver l’alternance : « il sonna… et ils poussèrent »'
  alternative: 'Harmoniser au pluriel : « ils sonnèrent… et poussèrent »'
  rationale: Le texte grec attesté présente réellement cette alternance. La conserver respecte la source et laisse ouverte la possibilité que le chef ait donné le signal tandis que les troupes ont crié, sans imposer cette interprétation.
translation_notes:
  register: Français moderne, digne et narratif. « Corps » évite le technicisme anachronique de « divisions ». La tournure « en priant » est plus naturelle que le calque « dans la prière », tandis que les notes préservent les ambiguïtés spatiale et grammaticale du grec.
