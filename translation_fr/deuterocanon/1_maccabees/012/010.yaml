base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
translation:
  language: fr
  text: Nous avons tenté de renouveler avec vous les liens de fraternité et d’amitié en vous envoyant un message[a], afin de ne pas nous éloigner de vous. En effet, bien du temps s’est écoulé depuis que vous nous avez envoyé un message.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les deux occurrences, le grec dit simplement « envoyer » sans en préciser le complément. « Un message » convient au contexte de correspondance, mais il pourrait aussi s’agir de messagers ou d’une autre communication.
    reason: Préserver l’indétermination du complément sous-entendu avec ἀποστεῖλαι et ἀπεστείλατε, tout en permettant une formulation française naturelle.
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Nous avons pris l’initiative
  rationale: Le verbe exprime ici une démarche entreprise ou tentée. Cette formulation naturelle convient au contexte diplomatique sans laisser entendre que la démarche aurait échoué.
- source_word: ἀποστεῖλαι
  choice: de vous envoyer un message
  rationale: Le grec signifie littéralement « envoyer » sans objet exprimé. Le contexte épistolaire implique une communication; « un message » explicite sobrement cette idée.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: les liens de fraternité et d’amitié qui nous unissent
  rationale: « Fraternité » et « amitié » conservent les deux termes relationnels et diplomatiques; « les liens… qui nous unissent » rend naturellement πρὸς ὑμᾶς en français.
- source_word: ἀνανεώσασθαι
  choice: pour renouveler
  rationale: Le verbe désigne le renouvellement d’une relation déjà établie.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: afin de ne pas devenir étrangers les uns aux autres
  rationale: La construction indique le but. La formulation garde l’image forte de l’éloignement relationnel tout en rendant idiomatiquement le génitif ὑμῶν.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: En effet, bien du temps s’est écoulé
  rationale: Le pluriel grec évoque de nombreux intervalles ou périodes écoulés. Le singulier collectif français est plus naturel sans réduire καιροί à des saisons littérales.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: depuis que vous nous avez envoyé un message
  rationale: Le grec laisse l’objet de l’envoi implicite. Le contexte de correspondance permet « un message », mais cette explicitation est signalée en note.
