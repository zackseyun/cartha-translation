  naturalness: La phrase proposée est globalement fluide et d’un registre diplomatique approprié. « Tenter » rend plus directement et naturellement la nuance de ἐπειράθημεν. « Nous éloigner de vous » est idiomatique en français moderne et exprime sobrement l’aliénation relationnelle.
  terminology: « Fraternité et amitié » conserve les deux termes diplomatiques ἀδελφότης et φιλία. « Renouveler » rend exactement ἀνανεώσασθαι. « Bien du temps s’est écoulé » est une équivalence française naturelle du pluriel πολλοὶ καιροί, sans imposer le sens restreint de « saisons ».
