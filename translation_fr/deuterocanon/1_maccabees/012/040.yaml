  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: fr
  text: Il se mit à craindre que Jonathan refuse de le laisser faire[a] et lui fasse la guerre. Il cherchait un moyen de s’emparer de lui pour le tuer. Puis il partit et se rendit à Beth-Shéân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que Jonathan ne lui permette pas »; le grec ne précise pas ce que Jonathan risquait de l’empêcher de faire.'
    reason: Le complément d’action de ἐάσῃ est implicite dans le grec; « le laisser faire » l’explicite de façon idiomatique en français tout en conservant l’indétermination signalée par la note.
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: se mit à craindre
  rationale: L’aoriste peut marquer l’entrée dans un état de crainte ou d’appréhension. Cette tournure rend naturellement cette nuance sans introduire le sens religieux que le verbe peut avoir ailleurs.
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: que Jonathan refuse de le laisser faire[a]
  rationale: Le grec dit littéralement que Jonathan pourrait « ne pas le laisser », sans préciser l’action empêchée. « Le laisser faire » garde la personne comme complément et explicite seulement l’ellipse nécessaire en français courant.
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: lui fasse la guerre
  rationale: Cette expression conserve la portée militaire du verbe πολεμέω et désigne clairement l’hostilité dirigée contre lui.
- source_word: ἐζήτει πόρον
  choice: cherchait donc un moyen
  rationale: πόρος désigne ici un moyen praticable, voire une occasion. « Un moyen » convient au projet qui suit; « donc » exprime naturellement le lien narratif porté par καί dans ce contexte.
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: de s’emparer de lui pour le tuer
  rationale: Les infinitifs articulés indiquent le but du moyen recherché. « S’emparer de lui » n’implique aucune procédure judiciaire, et « pour le tuer » fait ressortir le but ultime.
- source_word: ἀπάρας
  choice: partit
  rationale: Le participe indique le départ qui précède l’arrivée. « Partit » reste naturel et n’ajoute pas l’idée incertaine d’une levée de camp.
- source_word: Βεθσά
  choice: Beth-Shéân
  rationale: La forme grecque désigne la ville généralement connue en français sous le nom de Beth-Shéân; cette graphie moderne facilite son identification.
