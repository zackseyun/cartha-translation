base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: fr
  text: Il le reçut avec honneur et le présenta à tous ses amis[a]. Il lui donna des cadeaux et ordonna à ses amis[b] et à ses troupes de lui obéir de même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fit connaître à tous ses amis ». Le verbe grec peut désigner le fait de présenter quelqu’un ou de le faire connaître publiquement.
    reason: lexical_alternative
  - marker: b
    text: Dans le cadre d’une cour royale hellénistique, le terme « amis » peut désigner les membres de l’entourage officiel du roi, et non seulement ses compagnons personnels.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: reçut
  rationale: Le moyen de ἐπιδέχομαι désigne ici l’accueil ou la réception d’une personne. « Reçut » convient au registre formel et s’associe naturellement à « avec honneur ».
- source_word: ἐνδόξως
  choice: avec honneur
  rationale: L’adverbe exprime un accueil honorable ou distingué. Cette tournure est naturelle en français moderne et adaptée au cadre de cour.
- source_word: συνέστησεν
  choice: présenta
  rationale: Dans la construction avec la personne présentée et le cercle des « amis », le verbe signifie faire connaître ou présenter quelqu’un. « Présenta » convient bien au contexte social et politique.
- source_word: φίλοις
  choice: amis
  rationale: Le sens littéral est « amis ». Dans un cadre royal hellénistique, le terme peut aussi désigner officiellement les membres de l’entourage du souverain ; cette nuance est signalée en note sans être imposée dans le texte.
- source_word: δόματα
  choice: cadeaux
  rationale: Rendu direct et courant du nom pluriel désignant des dons ou présents.
- source_word: δυνάμεσιν
  choice: troupes
  rationale: Dans ce contexte, le pluriel renvoie aux forces militaires placées sous son autorité. « Troupes » est clair et idiomatique.
- source_word: ὑπακούειν
  choice: obéir
  rationale: Dans le cadre d’un ordre donné à l’entourage et aux troupes, « obéir » rend précisément la force de l’infinitif.
- source_word: ὡσαύτως
  choice: de même
  rationale: Cette expression conserve la valeur comparative de l’adverbe grec sans préciser artificiellement le terme de comparaison.
