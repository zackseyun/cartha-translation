translation_notes:
  register: Français moderne, international et digne, avec une syntaxe narrative fluide. Le plus-que-parfait littéraire « se fut couché » convient au registre biblique sans être archaïque. La longue phrase grecque est divisée en deux phrases françaises pour la lisibilité, sans perte de lien narratif.
