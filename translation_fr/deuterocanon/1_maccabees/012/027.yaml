revisions:
- from: Quand le soleil se fut couché, Jonathan ordonna à ceux qui étaient avec lui de rester éveillés et de garder leurs armes à portée de main, afin d’être prêts au combat pendant toute la nuit. Il posta aussi des sentinelles tout autour du camp.
  to: Quand le soleil se coucha, Jonathan ordonna à ceux qui étaient avec lui de rester éveillés, de se tenir sous les armes et de se préparer au combat pendant toute la nuit ; il posta des sentinelles autour du camp.
  rationale: La révision conserve chaque élément de l’ordre grec et sa coordination, tout en employant un français militaire naturel. Elle restitue explicitement l’action de se préparer, évite l’ajout léger de « aussi » et adopte une narration plus neutre en français international moderne.
