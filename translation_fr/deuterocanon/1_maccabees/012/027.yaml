  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: fr
  text: Quand le soleil se coucha, Jonathan ordonna à ceux qui étaient avec lui de rester éveillés, de se tenir sous les armes et de se préparer au combat pendant toute la nuit ; il posta des sentinelles autour du camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: Quand le soleil se fut couché
  rationale: L’aoriste présente le coucher du soleil comme le repère temporel précédant l’ordre. Cette formulation est naturelle dans un récit soutenu et marque clairement l’antériorité.
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime un ordre donné avec autorité dans un contexte militaire.
- source_word: τοῖς παρʼ αὐτοῦ
  choice: à ceux qui étaient avec lui
  rationale: Cette traduction reste proche de l’expression grecque sans préciser davantage l’identité du groupe.
- source_word: γρηγορεῖν
  choice: de rester éveillés
  rationale: Le sens premier de veille éveillée est conservé; cela distingue cet ordre de l’affectation particulière des sentinelles mentionnée ensuite.
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: de garder leurs armes à portée de main
  rationale: L’expression grecque décrit une disponibilité immédiate des armes. La formulation française restitue naturellement cette image concrète de préparation militaire.
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: afin d’être prêts au combat
  rationale: Dans ce contexte tactique immédiat, « combat » convient mieux que le terme plus large « guerre ». « Afin de » rend le rapport de préparation exprimé par l’infinitif.
- source_word: διʼ ὅλης τῆς νυκτός
  choice: pendant toute la nuit
  rationale: La formulation exprime clairement la durée complète indiquée par le grec.
- source_word: ἐξέβαλεν προφύλακας
  choice: Il posta aussi des sentinelles
  rationale: Le verbe et son complément forment ici une expression militaire désignant le déploiement de gardes. « Posta des sentinelles » est précis et idiomatique; « aussi » rend la coordination narrative sans surcharger la phrase.
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: tout autour du camp
  rationale: « Camp » correspond au sens militaire de παρεμβολή, et « tout autour » rend clairement κύκλῳ.
