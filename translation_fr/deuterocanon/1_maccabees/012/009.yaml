  yaml_path: translation/deuterocanon/1_maccabees/012/009.yaml
  text: And so we also[a], though having no need of these things, have the holy books that are in our hands as encouragement[b],
translation:
  language: fr
  text: Ainsi donc, nous aussi, sans avoir besoin de ces choses, nous avons pour encouragement[a] les livres saints qui sont entre nos mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réconfort » ou « consolation ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les livres saints qui sont entre nos mains ». L’expression désigne vraisemblablement les écrits sacrés d’Israël qu’ils possédaient ou auxquels ils avaient accès.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: sans avoir besoin
  rationale: L’adjectif signifie « qui n’a pas besoin de ». Cette tournure française exprime clairement leur indépendance à l’égard des choses évoquées, tout en restant proche du grec.
- source_word: τούτων
  choice: de ces choses
  rationale: Le pronom neutre pluriel renvoie de manière générale à ce qui précède. « Ces choses » conserve cette référence sans la préciser au-delà du texte.
- source_word: παράκλησιν
  choice: encouragement
  rationale: Dans ce contexte, le terme désigne le soutien ou le réconfort que procurent les livres saints. « Encouragement » garde cette amplitude de sens.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: les livres saints
  rationale: Traduction directe de l’expression grecque, adaptée au contexte juif du Second Temple et moins interprétative que « les Saintes Écritures ».
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: qui sont entre nos mains
  rationale: Cette formulation conserve l’image concrète du grec tout en exprimant naturellement la possession et l’accès immédiat en français.
theological_decisions:
- issue: Référence des « livres saints »
  choice: Conserver l’expression générale « les livres saints »
  alternative: Expliciter « les écrits sacrés d’Israël » ou traduire « les Saintes Écritures »
  rationale: L’expression renvoie très probablement aux écrits sacrés d’Israël, mais le grec ne les définit pas davantage. La traduction préserve cette ouverture sans imposer une délimitation canonique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec, tandis que « sans avoir besoin » évite une formulation adjectivale lourde. L’image « entre nos mains » est conservée.
