lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici le contraste avec ce qui précède; « Mais » en rend naturellement la valeur adversative.
- source_word: πολλαὶ θλίψεις
  choice: de nombreuses détresses
  rationale: θλίψεις évoque des situations de pression, de souffrance et d’épreuve. « Détresses » conserve cette gravité sans lui donner une coloration théologique particulière.
- source_word: καὶ πόλεμοι πολλοί
  choice: et de nombreuses guerres
  rationale: πόλεμοι désigne des guerres ou conflits armés, plutôt que de simples combats; la répétition de « nombreuses » préserve l’insistance du grec.
- source_word: ἡμᾶς ἐκύκλωσαν
  choice: nous ont encerclés
  rationale: Le verbe κυκλόω signifie littéralement entourer ou encercler. Le passé composé rend en français actuel l’aoriste dans ce bilan épistolaire tout en suggérant les conséquences présentes de ces événements.
