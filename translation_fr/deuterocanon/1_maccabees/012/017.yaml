  footnotes:
  - marker: a
    text: 'Littéralement en grec : « de nombreuses détresses et de nombreuses guerres nous encerclèrent ». Le passé composé exprime ici naturellement en français une situation passée dont les effets se font encore sentir dans le contexte de la lettre.'
