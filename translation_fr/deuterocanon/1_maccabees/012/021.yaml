  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: fr
  text: On a trouvé dans un écrit au sujet des Spartiates et des Juifs qu’ils sont frères et qu’ils sont de la lignée d’Abraham[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un document » ou « dans un registre ». Le terme grec désigne ici une source écrite et ne signifie pas nécessairement l’Écriture sainte.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la descendance commune d’Abraham revendiquée dans l’écrit cité.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: On a trouvé
  rationale: L’aoriste passif exprime une découverte passée sans nommer celui qui l’a faite. La tournure impersonnelle française est naturelle et fidèle à ce sens.
- source_word: ἐν γραφῇ
  choice: dans un écrit
  rationale: γραφή désigne ici une source écrite, sans impliquer nécessairement l’Écriture sainte. « Écrit » conserve cette généralité.
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: au sujet des Spartiates et des Juifs
  rationale: περί avec le génitif signifie « au sujet de »; τε…καί associe étroitement les deux peuples, ce que la coordination française rend naturellement.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel décrit explicitement une parenté revendiquée entre les deux peuples. « Frères » préserve l’image et la formulation du grec.
- source_word: ἐκ γένους Ἀβραάμ
  choice: de la lignée d’Abraham
  rationale: γένος désigne ici l’origine familiale ou la descendance. « Lignée » exprime clairement cette filiation en français moderne et soutenu.
theological_decisions:
- issue: Nature de la relation revendiquée entre les Spartiates et les Juifs
  choice: Présenter directement la parenté et la commune ascendance comme l’affirmation de l’écrit cité, sans en garantir la vérité historique.
  alternative: Réduire cette relation à une amitié politique ou à une alliance.
  rationale: Le grec dit explicitement qu’ils sont « frères » et issus de la lignée d’Abraham. La traduction doit préserver cette affirmation et sa tension historique, sans l’atténuer ni la ratifier.
translation_notes:
  register: Français international moderne, clair et digne. « On a trouvé » évite une construction passive pesante; « un écrit » et « la lignée » restent accessibles tout en conservant la précision du grec.
