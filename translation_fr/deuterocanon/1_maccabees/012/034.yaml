  yaml_path: translation/deuterocanon/1_maccabees/012/034.yaml
  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: fr
  text: En effet, il apprit qu’ils voulaient livrer la forteresse aux partisans de Démétrios, et il y plaça une garnison pour la garder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: il avait appris
  rationale: Dans ce contexte, ἀκούω indique qu’il a reçu une information motivant l’action qui suit. Le plus-que-parfait rend naturellement en français l’antériorité de cette information.
- source_word: βούλονται
  choice: avaient l’intention
  rationale: βούλομαι exprime ici une volonté ou un projet concret, sans affirmer que sa réalisation était certaine.
- source_word: τὸ ὀχύρωμα
  choice: la forteresse
  rationale: ὀχύρωμα désigne un lieu fortifié ou un ouvrage défensif; « forteresse » est clair, courant et adapté au contexte militaire.
- source_word: παραδοῦναι
  choice: livrer
  rationale: Le verbe signifie remettre le contrôle du lieu à un autre groupe. « Livrer » conserve cette idée sans imposer la nuance plus précise de capitulation.
- source_word: τοῖς παρὰ Δημητρίου
  choice: aux partisans de Démétrios
  rationale: La tournure désigne les personnes rattachées au camp de Démétrios. « Partisans » exprime cette affiliation politique sans les réduire nécessairement à des soldats.
- source_word: ἔθετο
  choice: il y établit
  rationale: Avec φρουράν, le verbe décrit la mise en place d’une force chargée de garder un lieu; « établir une garnison » est idiomatique en français.
- source_word: φρουράν
  choice: une garnison
  rationale: φρουρά désigne ici une troupe laissée sur place pour assurer la garde.
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: pour la garder
  rationale: ὅπως suivi du subjonctif exprime le but. « Pour la garder » restitue simplement cette finalité et rapporte naturellement le pronom à la forteresse.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La première proposition est reliée causalement au contexte par « En effet »; la seconde explicite avec « donc » le rapport entre l’information reçue et l’établissement de la garnison. Le nom grec Δημήτριος est rendu par la forme française usuelle « Démétrios ».
