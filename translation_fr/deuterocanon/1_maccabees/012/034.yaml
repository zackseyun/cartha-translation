review_pass:
  verdict: revise
  source_fidelity: Le plus-que-parfait (« il avait appris ») et l’imparfait (« avaient l’intention ») déplacent inutilement les actions dans une antériorité par rapport au récit. Le grec emploie l’aoriste pour les deux actions principales et le présent βούλονται pour le projet alors en cours. Une narration française au passé simple rend plus exactement cette progression. « Forteresse », « livrer », « partisans de Démétrios » et « garnison » restituent fidèlement les termes grecs.
  naturalness: La formulation est globalement naturelle. « Il apprit ... et y plaça une garnison pour la garder » est plus fluide et plus directement narratif que la succession au plus-que-parfait suivie de « donc ».
  terminology: « Démétrios » est la forme française usuelle. « Partisans de Démétrios » conserve l’affiliation exprimée par τοῖς παρὰ Δημητρίου sans réduire le groupe à des soldats. Aucun terme théologique n’est en jeu.
