base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: fr
  text: 'Et nous aussi, nous vous écrivons en retour[a] : « Votre bétail et vos biens sont à nous, et les nôtres sont à vous[b]. » Nous donnons donc ordre qu’ils vous fassent savoir la même chose[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous vous en adressons copie », si l’on donne à ἀντιγράφομεν son sens le plus littéral ; dans ce contexte, le verbe signifie probablement « répondre par écrit » ou « écrire en retour ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Votre bétail et vos biens sont à nous, et les nôtres sont à vous. » Il s’agit d’une formule diplomatique exprimant l’alliance et la solidarité mutuelle, sans nécessairement abolir la propriété juridique.'
    reason: cultural_note
  - marker: c
    text: Ou « qu’ils vous en fassent rapport au même effet ». Le grec laisse implicite ce qui doit être annoncé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: nous vous écrivons en retour
  rationale: Dans ce contexte épistolaire, le verbe désigne vraisemblablement une réponse écrite. « Écrivons en retour » conserve à la fois l’idée d’écriture et celle de réciprocité.
- source_word: κτήνη
  choice: bétail
  rationale: Le terme désigne ici les animaux domestiques considérés comme biens; « bétail » est précis et naturel en français moderne.
- source_word: ὕπαρξις
  choice: biens
  rationale: Le singulier collectif grec désigne l’ensemble des avoirs matériels. « Biens » rend ce sens sans limiter la formule à un bien juridique particulier.
- source_word: ἐντελλόμεθα
  choice: nous donnons ordre
  rationale: Cette tournure restitue la force officielle du verbe, qui exprime le fait de donner des instructions ou des ordres.
- source_word: ἀπαγγείλωσιν
  choice: qu’ils vous transmettent un message
  rationale: Le verbe signifie annoncer, rapporter ou transmettre. Le grec ne précise pas explicitement l’objet; « un message » permet une formulation française naturelle tout en signalant cette valeur générale.
- source_word: κατὰ τὰ αὐτά
  choice: dans le même sens
  rationale: L’expression indique que le message doit correspondre à ce qui vient d’être écrit. « Dans le même sens » préserve ce rapport sans surdéterminer le contenu implicite.
