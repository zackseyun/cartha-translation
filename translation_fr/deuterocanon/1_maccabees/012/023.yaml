translation_notes:
  register: Français international moderne, clair et digne. La citation directe met en évidence la formule diplomatique. Le tour « sont à nous / sont à vous » conserve sa réciprocité solennelle, tandis que les notes maintiennent les ambiguïtés lexicales du grec.
