base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: fr
  text: Tryphon chercha à régner sur l’Asie[a], à ceindre le diadème et à porter la main sur le roi Antiochos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « l’Asie » désigne le royaume hellénistique dont il est question, et non le continent asiatique au sens moderne.
    reason: cultural_note
  - marker: b
    text: Ou « à attaquer le roi Antiochos »; littéralement, « à étendre les mains contre le roi Antiochos ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: chercha à
  rationale: L’aoriste de ζητέω exprime ici un projet ou une ambition. « Chercha à » en conserve la visée sans laisser entendre que Tryphon réussit.
- source_word: βασιλεῦσαι
  choice: régner sur
  rationale: βασιλεύω signifie exercer la royauté ou régner. « Régner sur » est naturel en français devant un territoire et convient à l’ambition politique décrite.
- source_word: τῆς Ἀσίας
  choice: l’Asie
  rationale: La traduction formelle du nom géographique préserve le libellé grec; une note précise son sens dans le contexte hellénistique.
- source_word: περιθέσθαι τὸ διάδημα
  choice: ceindre le diadème
  rationale: Le moyen περιθέσθαι indique que Tryphon veut mettre lui-même le διάδημα, insigne propre de la royauté. « Ceindre le diadème » est précis, digne et intelligible.
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: porter la main sur Antiochos
  rationale: Cette expression française conserve l’image de la main et communique une action hostile sans préciser davantage la forme de l’agression.
- source_word: τὸν βασιλέα
  choice: le roi Antiochos
  rationale: Le titre royal est explicitement conservé. L’ordre français « le roi Antiochos » rend naturellement l’apposition grecque.
