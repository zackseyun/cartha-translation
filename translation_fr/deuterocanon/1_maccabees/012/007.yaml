base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: fr
  text: 'Bien auparavant, des lettres avaient été envoyées à Onias, le grand prêtre, de la part d’Aréus, qui régnait parmi vous, disant : « Vous êtes nos frères », comme le montre la copie présentée ici.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le montre la copie jointe ici ». L’expression grecque indique qu’une copie de la lettre antérieure est présentée ou reproduite dans le contexte qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: Déjà auparavant
  rationale: Cette tournure conserve la valeur temporelle comparative et l’insistance de ἔτι, tout en restant naturelle en français.
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  choice: des lettres avaient été envoyées
  rationale: Le pluriel grec est maintenu. Le plus-que-parfait situe clairement cet envoi avant la correspondance présente.
- source_word: πρὸς Ὀνίαν τὸν ἀρχιερέα
  choice: à Onias, le grand prêtre
  rationale: Le destinataire et son titre en apposition sont rendus directement et naturellement.
- source_word: παρὰ δʼ Ἀρείου
  choice: de la part d’Aréus
  rationale: παρά avec le génitif marque ici la provenance des lettres ; cette formulation évite l’ambiguïté que pourrait créer le simple « d’Aréus » après le destinataire.
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: qui régnait parmi vous
  rationale: « Régnait » rend la valeur royale de βασιλεύω, tandis que « parmi vous » suit au plus près ἐν ὑμῖν sans imposer « sur vous ».
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: 'pour dire : « Vous êtes nos frères »'
  rationale: ὅτι introduit naturellement le contenu de la lettre. Le discours direct préserve la force de l’affirmation de parenté entre les peuples.
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: comme le montre la copie présentée ci-dessous
  rationale: ἀντίγραφον désigne une copie ou transcription, et ὑπόκειται indique qu’elle est mise à disposition dans la suite immédiate du texte.
