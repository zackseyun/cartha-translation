revisions:
- from: 'Déjà auparavant, des lettres avaient été envoyées à Onias, le grand prêtre, de la part d’Aréus, qui régnait parmi vous, pour dire : « Vous êtes nos frères », comme le montre la copie présentée ci-dessous.[a]'
  to: 'Bien auparavant, des lettres avaient été envoyées à Onias, le grand prêtre, de la part d’Aréus, qui régnait parmi vous, disant : « Vous êtes nos frères », comme le montre la copie présentée ici.[a]'
  rationale: La révision améliore l’idiomaticité française et resserre le lien syntaxique entre les lettres et la déclaration citée. Elle remplace l’indication de position « ci-dessous », qui dépend de la composition de la page, par une formulation documentaire neutre, tout en préservant le sens de la copie mise à disposition.
