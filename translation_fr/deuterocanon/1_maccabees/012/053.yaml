base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: fr
  text: 'Tous les peuples qui les entouraient cherchèrent à les exterminer[a], car ils disaient : « Ils n’ont aucun homme pour les gouverner et les secourir[b]. Maintenant donc, faisons-leur la guerre et faisons disparaître leur souvenir du milieu des hommes[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les faire disparaître » ; le verbe grec exprime une destruction complète.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ils n’ont pas d’homme les gouvernant et les aidant. »'
    reason: formal_equivalence
  - marker: c
    text: Ou « effaçons leur mémoire du milieu des hommes » ; l’expression évoque l’effacement de leur souvenir parmi les êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: cherchèrent à
  rationale: Avec l’infinitif ἐκτρῖψαι, le verbe exprime une tentative ou une intention active; « cherchèrent à » reste proche de la construction grecque.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: tous les peuples qui les entouraient
  rationale: ἔθνη désigne ici les populations environnantes; « peuples » est naturel en français et évite d’imposer soit le sens politique de « nations », soit le sens religieux de « païens ».
- source_word: ἐκτρῖψαι
  choice: les exterminer
  rationale: Le verbe évoque l’éradication complète. « Exterminer » restitue clairement cette force dans un registre historique digne.
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  choice: personne pour les diriger et leur venir en aide
  rationale: La tournure française rend naturellement l’absence d’un homme exerçant les deux fonctions exprimées par les participes. Dans ce contexte, ἄνδρα individualise le dirigeant attendu sans exiger que le français emploie le lourd « homme dirigeant ».
- source_word: πολεμήσωμεν αὐτούς
  choice: faisons-leur la guerre
  rationale: Le subjonctif exhortatif appelle à engager des hostilités organisées; la locution française conserve cette portée.
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: effaçons leur souvenir du milieu des humains
  rationale: μνημόσυνον désigne le souvenir ou la mémoire laissée, et ἐξαίρω l’action de l’enlever. « Humains » rend le générique ἀνθρώπων sans ambiguïté sexuelle en français moderne.
theological_decisions:
- issue: Genre grammatical et référent humain dans ἄνδρα ἄρχοντα
  choice: « personne pour les diriger » dans le texte, avec la forme littérale en note
  alternative: « aucun homme pour les diriger »
  rationale: Le grec présente explicitement un homme exerçant le commandement, mais l’idée centrale de la déclaration hostile est l’absence de dirigeant et de secours. Le français courant « personne » transmet cette idée sans suggérer à tort qu’aucun individu masculin n’existe parmi eux; la note préserve la forme grecque.
- issue: Portée de ἀνθρώπων
  choice: « humains »
  alternative: « hommes »
  rationale: Dans cette expression, ἀνθρώπων est générique et vise l’humanité. « Humains » conserve cette portée universelle, tandis que « hommes » peut aujourd’hui être compris comme exclusivement masculin.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours hostile demeure direct et énergique. Les deux propositions coordonnées de la fin sont rendues par des impératifs exhortatifs naturels en français, correspondant aux formes grecques délibératives/exhortatives.
