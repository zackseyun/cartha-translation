  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les peuples voisins cherchent l’anéantissement, invoquent l’absence d’un dirigeant secourable, puis appellent à la guerre et à l’effacement du souvenir. Toutefois, le texte grec dit explicitement « un homme » (ἄνδρα), qualifié par les participes « gouvernant » et « aidant » ; « personne » neutralise cet élément dans le texte principal. De même, « du milieu des humains » est moins idiomatique en français pour cette formule d’effacement du souvenir.'
  naturalness: La phrase est claire et d’un registre narratif convenable. « Du milieu des humains » sonne toutefois quelque peu calqué ; « du milieu des hommes » est l’expression française établie et convient ici, puisque ἀνθρώπων est générique dans cette formule.
  terminology: « Peuples », « exterminer » et « faire la guerre » rendent bien le contexte et la force des termes grecs. « Aucun homme pour les gouverner et les secourir » préserve l’explicitation masculine de ἄνδρα tout en restant naturel. « Souvenir » convient à μνημόσυνον.
