    rationale: « Personne » exprime l’absence de tout individu, mais ne rend pas l’élément explicitement masculin de ἄνδρα. Une note littérale ne remplace pas la fidélité du texte principal quand une formulation française naturelle est disponible.
  - severity: low
    issue: Formulation « du milieu des humains »
    rationale: Cette expression est compréhensible, mais moins naturelle que « du milieu des hommes » dans une formule de type « effacer le souvenir ». Le mot grec ἀνθρώπων a ici une valeur humaine générique, non une affirmation sur des hommes masculins.
