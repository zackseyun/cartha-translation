translation_notes:
  register: Français moderne, digne et accessible. La syntaxe a été légèrement allégée en divisant la longue coordination grecque en deux phrases. Dans le discours direct, « avec vous » explicite naturellement le destinataire présent de αὐτοῖς sans modifier la relation exprimée.
