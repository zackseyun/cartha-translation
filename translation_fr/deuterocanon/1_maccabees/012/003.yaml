  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: fr
  text: 'Ils allèrent à Rome et se rendirent dans la salle du conseil[a]. Ils dirent : « Jonathan, le grand prêtre, et la nation juive nous ont envoyés pour renouveler avec eux l’alliance, comme auparavant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salle du Sénat »; le grec désigne le lieu de réunion du conseil dirigeant sans employer le titre institutionnel romain officiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: allèrent / se rendirent
  rationale: Le verbe exprime simplement un déplacement. La variation française évite une répétition pesante tout en conservant les deux étapes du récit.
- source_word: βουλευτήριον
  choice: salle du conseil
  rationale: Le terme grec désigne concrètement le lieu où siège le conseil; cette traduction évite d’introduire le titre institutionnel plus interprétatif de « Sénat ».
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: Jonathan, le grand prêtre
  rationale: « Grand prêtre » est l’équivalent français usuel et historiquement approprié de ἀρχιερεύς.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: la nation juive
  rationale: Cette expression naturelle rend le peuple considéré comme corps national, sans alourdir le français par un calque de la construction grecque.
- source_word: ἀπέστειλαν ἡμῖς
  choice: nous ont envoyés
  rationale: Le parfait composé exprime naturellement en français une mission passée dont le mandat demeure actuel. Le texte grec transmis porte ἡμῖς, forme non standard dans ce contexte, mais le sens attendu est « nous » comme objet.
- source_word: ἀνανεώσασθαι
  choice: renouveler
  rationale: Le verbe signifie remettre en vigueur ou rendre de nouveau actuel; « renouveler » convient précisément au contexte diplomatique.
- source_word: αὐτοῖς
  choice: avec vous
  rationale: Dans le discours direct adressé au conseil romain, le référent de la troisième personne grecque se rend naturellement à la deuxième personne en français; la relation bilatérale est exprimée par « avec ».
- source_word: συμμαχίαν
  choice: l’alliance
  rationale: Dans ce contexte politique, συμμαχία désigne une alliance entre deux collectivités plutôt qu’une simple amitié.
- source_word: κατὰ τὸ πρότερον
  choice: comme auparavant
  rationale: La locution renvoie à l’état antérieur des relations; « comme auparavant » est clair, naturel et fidèle.
