  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: fr
  text: Ils apprirent que lui et ceux qui étaient avec lui avaient été capturés et avaient péri. Ils s’encouragèrent mutuellement et poursuivirent leur marche en rangs serrés, prêts au combat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: ils apprirent
  rationale: Dans ce contexte narratif, le verbe exprime l’acquisition ou la prise de connaissance d’une nouvelle; « apprirent » est naturel et précis.
- source_word: συνελήμφθη
  choice: avait été capturé
  rationale: L’aoriste passif de συλλαμβάνω désigne ici le fait d’avoir été saisi par l’ennemi; « capturé » convient au cadre militaire.
- source_word: ἀπώλωλεν
  choice: avait péri
  rationale: Le parfait de ἀπόλλυμι peut signifier être mort, perdu ou détruit. « Avait péri » conserve la gravité et une certaine étendue sémantique sans préciser la manière de mourir.
- source_word: οἱ μετʼ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Cette formulation demeure aussi large que le grec et n’ajoute pas une désignation absente du texte.
- source_word: παρεκάλεσαν ἑαυτούς
  choice: ils s’encouragèrent les uns les autres
  rationale: Le réfléchi grec appliqué au groupe exprime naturellement un encouragement mutuel; l’explicitation « les uns les autres » évite en français l’idée que chacun ne ferait que s’encourager lui-même.
- source_word: ἐπορεύοντο
  choice: poursuivirent leur marche
  rationale: Le verbe indique leur déplacement continu; dans ce contexte militaire, « poursuivirent leur marche » est idiomatique sans surcharger le sens.
- source_word: συνεστραμμένοι
  choice: en rangs serrés
  rationale: Le participe décrit un groupe resserré ou compact; « en rangs serrés » rend clairement l’image militaire.
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: prêts au combat
  rationale: L’expression marque leur préparation à l’affrontement immédiat; « au combat » est plus contextuel que le sens plus large de « à la guerre ».
