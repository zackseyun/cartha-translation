translation_notes:
  register: 'Français moderne, international et digne. La syntaxe a été divisée en deux phrases pour une lecture naturelle, tout en maintenant la progression du grec. Aucune note n’est nécessaire: la variante signalée dans la couche anglaise semble mal rattachée à « had perished », alors que son contenu concerne παρεκάλεσαν ἑαυτούς; la traduction française explicite directement le sens mutuel.'
