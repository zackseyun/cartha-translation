  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
translation:
  language: fr
  text: 'Il envoya des éclaireurs dans leur camp. Ceux-ci revinrent et lui rapportèrent : « Voici comment ils se mettent en ordre pour fondre sur eux pendant la nuit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils se rangent ainsi en ordre de bataille pour les attaquer de nuit. » Le grec peut évoquer leur déploiement en formation, et pas seulement leurs préparatifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Aoriste narratif rendu simplement et naturellement en français.
- source_word: κατασκόπους
  choice: des éclaireurs
  rationale: Dans ce contexte militaire, le terme désigne des hommes chargés d’observer les positions ennemies ; « éclaireurs » convient mieux que « espions ».
- source_word: παρεμβολήν
  choice: camp
  rationale: Le nom désigne ici le campement militaire adverse.
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe exprime le compte rendu fait au retour d’une mission de reconnaissance.
- source_word: Οὕτως τάσσονται
  choice: Voici comment ils se mettent en ordre
  rationale: Cette formulation conserve οὕτως et le présent, tout en exprimant la disposition tactique suggérée par τάσσονται sans la réduire à une simple intention.
- source_word: ἐπιπεσεῖν
  choice: pour fondre sur
  rationale: « Fondre sur » restitue la vigueur de l’assaut soudain exprimé par le verbe grec.
- source_word: τὴν νύκτα
  choice: pendant la nuit
  rationale: Rend naturellement l’accusatif de durée ou de moment sans préciser davantage le point exact de l’attaque.
