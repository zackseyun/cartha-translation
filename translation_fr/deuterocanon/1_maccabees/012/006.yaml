base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: fr
  text: 'Jonathan, grand prêtre de la nation, le conseil des anciens, les prêtres et le reste du peuple juif, aux Spartiates, leurs frères[a] : salut !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » relève du langage diplomatique de parenté ; le mot n’implique pas nécessairement une fraternité au sens littéral.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: Titre français consacré pour la fonction sacerdotale suprême juive.
- source_word: τοῦ ἔθνους
  choice: de la nation
  rationale: Conserve explicitement la portée collective et politique de ἔθνος ainsi que son rattachement à la fonction de Jonathan.
- source_word: ἡ γερουσία
  choice: le conseil des anciens
  rationale: Rend clairement l’institution dirigeante composée d’anciens, sans l’assimiler trop directement à un sénat moderne.
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  choice: le reste du peuple juif
  rationale: Formulation française naturelle qui distingue l’ensemble du peuple des responsables et des prêtres déjà nommés.
- source_word: Σπαρτιάταις
  choice: aux Spartiates
  rationale: Ethnonyme français usuel, le datif marquant les destinataires.
- source_word: τοῖς ἀδελφοῖς
  choice: leurs frères
  rationale: Préserve le langage explicite de fraternité ou de parenté diplomatique employé par la lettre.
- source_word: χαίρειν
  choice: salut !
  rationale: Équivalent idiomatique et digne de la formule épistolaire hellénistique.
theological_decisions:
- issue: Portée de « frères » dans l’adresse diplomatique
  choice: Conserver « leurs frères » comme formulation de parenté revendiquée par la lettre.
  alternative: leurs parents ; leurs alliés
  rationale: Le grec dit explicitement « frères ». La traduction maintient cette affirmation diplomatique sans la transformer en fraternité littérale ni l’expliquer dans le corps du texte.
- issue: Portée de Ἰουδαίων
  choice: juif
  alternative: judéen
  rationale: « Juif » est ici naturel pour désigner collectivement les expéditeurs, tout en conservant la possibilité d’une nuance ethnique et politique plutôt que seulement religieuse.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reproduit l’en-tête d’une lettre officielle tout en évitant une succession pesante de « et ». « Salut ! » marque naturellement la formule épistolaire finale.
