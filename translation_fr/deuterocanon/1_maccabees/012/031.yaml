lexical_decisions:
- source_word: ἐξέκλινεν
  choice: se détourna pour attaquer
  rationale: Le verbe exprime d’abord un changement de direction. Dans ce contexte militaire, « pour attaquer » explicite naturellement la visée indiquée par ἐπί avec l’accusatif, sans réduire le verbe au seul sens de « marcher ».
- source_word: Ἀράβας
  choice: les Arabes
  rationale: Désignation directe et naturelle, en français moderne, du peuple ou groupe arabe visé.
- source_word: τοὺς καλουμένους
  choice: appelés
  rationale: Rend sobrement le participe grec qui introduit le nom particulier du groupe.
- source_word: Ζαβαδαίους
  choice: Zabadéens
  rationale: Translittération francisée et lisible de l’ethnonyme grec Ζαβαδαῖοι.
- source_word: ἐπάταξεν
  choice: il les frappa
  rationale: Conserve le sens direct de « frapper » dans un contexte guerrier, sans imposer « vainquit », résultat possible mais non formulé explicitement.
- source_word: σκῦλα
  choice: leur butin
  rationale: Désigne naturellement en français les biens pris à l’ennemi après un affrontement.
