  yaml_path: translation/deuterocanon/1_maccabees/012/047.yaml
  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: fr
  text: 'Mais il laissa avec lui[a] trois mille hommes : il en laissa environ deux mille en Galilée, et mille se joignirent à lui.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « avec lui-même ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’accompagnèrent » ; le grec signifie plus littéralement « se réunirent avec lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν … μεθʼ ἑαυτοῦ
  choice: il garda … avec lui
  rationale: Καταλείπω signifie laisser ou maintenir en place. Dans ce contexte militaire, « garda … avec lui » exprime naturellement que ces hommes restèrent auprès de lui, tout en conservant la valeur réflexive de μεθʼ ἑαυτοῦ.
- source_word: ἄνδρας τρισχιλίους
  choice: trois mille hommes
  rationale: Ἄνδρας désigne littéralement des hommes. Le contexte est militaire, mais « hommes » reste proche du grec sans expliciter davantage que le texte.
- source_word: ὡς δισχιλίους
  choice: environ deux mille
  rationale: Devant un nombre, ὡς indique ici une approximation, rendue clairement par « environ ».
- source_word: ἀφῆκεν ἐν τῇ Γαλιλαίᾳ
  choice: il en laissa … en Galilée
  rationale: Ἀφίημι peut signifier laisser ou permettre de rester. « Laissa » convient au récit sans introduire l’idée plus précise d’un stationnement militaire officiel.
- source_word: χίλιοι δὲ συνῆλθον αὐτῷ
  choice: et mille l’accompagnèrent
  rationale: Συνέρχομαι avec le datif peut décrire le fait de se réunir avec quelqu’un et, dans ce contexte de déplacement, de l’accompagner. La note conserve le sens plus littéral.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Garda … avec lui » évite la tournure peu naturelle « laissa avec lui-même », tandis que « hommes » préserve la sobriété du grec sans ajouter explicitement « soldats ».
