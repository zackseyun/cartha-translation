  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
translation:
  language: fr
  text: Simon bâtit Adida dans la Shéphéla[a] et en fortifia les portes et les barres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Shéphéla » est la région des collines basses de Judée ; on peut aussi traduire par « le bas pays » ou « la plaine ».
    reason: cultural_note
  - marker: b
    text: 'Ou : « rebâtit Adida ». Le verbe grec peut désigner le fait de bâtir ou, selon le contexte, de rebâtir ou restaurer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: rebâtit
  rationale: Le verbe peut signifier « bâtir » ou, selon le contexte, « rebâtir ». Comme Adida est présentée comme un site déjà connu et ensuite fortifié, « rebâtit » rend naturellement l’idée d’une remise en état, sans sortir du champ sémantique grec.
- source_word: τὴν Ἀδιδὰ
  choice: Adida
  rationale: Le nom de lieu est translittéré sous la forme française simple « Adida ».
- source_word: ἐν τῇ σεφηλά
  choice: dans la Shéphéla
  rationale: Le grec reprend le nom géographique de la région de collines basses située entre les montagnes de Judée et la plaine côtière. Conserver le toponyme est plus précis que le seul terme « plaine ».
- source_word: ὠχύρωσεν
  choice: la fortifia
  rationale: Le verbe exprime l’action de rendre un lieu solide et défendable ; « fortifier » est le terme militaire français naturel dans ce contexte.
- source_word: θύρας
  choice: portes
  rationale: Dans le contexte des défenses d’une ville, il s’agit des portes de l’enceinte plutôt que de portes domestiques.
- source_word: μοχλούς
  choice: barres
  rationale: Le mot désigne les lourdes barres servant à bloquer et sécuriser les portes ; « barres » conserve clairement cette image défensive.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Rebâtit » et « fortifia » maintiennent le caractère militaire du passage. La formulation « en y installant » explicite naturellement en français le rapport instrumental entre la fortification, les portes et les barres, sans ajouter d’élément substantiel.
