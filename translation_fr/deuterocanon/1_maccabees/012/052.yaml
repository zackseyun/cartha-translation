  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: fr
  text: Ils arrivèrent tous en paix au pays de Juda ; ils portèrent le deuil de Jonathan et de ceux qui étaient avec lui, et ils eurent très peur ; Israël porta un grand deuil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un verbe et un nom de même famille, littéralement : « Israël pleura un grand deuil », pour renforcer l’expression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πάντες
  choice: Ils arrivèrent tous
  rationale: Le verbe aoriste indique ici l’aboutissement du déplacement; « arrivèrent » reste naturel en français sans imposer un point de vue absent du grec, et « tous » conserve πάντες.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Cette formulation garde l’image grecque tout en pouvant évoquer à la fois une arrivée paisible et une arrivée saine et sauve.
- source_word: εἰς γῆν Ἰούδα
  choice: au pays de Juda
  rationale: « Pays de Juda » rend le territoire désigné par γῆ Ἰούδα sans introduire la nuance provinciale plus tardive de « Judée ».
- source_word: ἐπένθησαν τὸν Ἰωνάθαν καὶ τοὺς μετʼ αὐτοῦ
  choice: Ils portèrent le deuil de Jonathan et de ceux qui étaient avec lui
  rationale: « Porter le deuil de » exprime naturellement un deuil solennel, tandis que « ceux qui étaient avec lui » préserve l’indétermination du groupe.
- source_word: ἐφοβήθησαν σφόδρα
  choice: furent saisis d’une très grande peur
  rationale: La tournure française restitue avec force la réaction de peur et l’intensif σφόδρα.
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: Israël mena un grand deuil
  rationale: Cette expression française naturelle conserve autant que possible la répétition sémantique emphatique entre le verbe et le nom grecs.
