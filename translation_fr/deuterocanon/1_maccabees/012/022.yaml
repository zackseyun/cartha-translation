  yaml_path: translation/deuterocanon/1_maccabees/012/022.yaml
  text: And now[a], since we have learned these things, you will do well to write to us concerning your peace.
translation:
  language: fr
  text: Et maintenant, puisque nous avons appris cela, vous ferez bien de nous écrire au sujet de votre paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de votre bien-être ». Le mot grec traduit par « paix » peut aussi désigner le bien-être ou la prospérité d’une personne ou d’un peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et l’indication temporelle, dans un style épistolaire naturel.
- source_word: ἀφʼ οὗ
  choice: puisque
  rationale: Dans ce contexte, la locution introduit le fait nouvellement appris comme fondement de la demande; « puisque » rend naturellement cette valeur causale, sans exclure entièrement sa nuance temporelle.
- source_word: ἔγνωμεν
  choice: nous avons appris
  rationale: L’aoriste de γινώσκω désigne ici l’acquisition d’une information; le passé composé exprime clairement en français le fait acquis et sa pertinence présente.
- source_word: ταῦτα
  choice: cela
  rationale: Le neutre pluriel grec renvoie aux faits mentionnés auparavant. Le singulier collectif « cela » est plus naturel en français moderne que « ces choses ».
- source_word: καλῶς ποιήσετε
  choice: vous ferez bien
  rationale: Rend directement l’expression épistolaire qui recommande courtoisement une action.
- source_word: γράφοντες ἡμῖν
  choice: de nous écrire
  rationale: L’infinitif français complète naturellement « vous ferez bien » et exprime l’action portée par le participe grec.
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: au sujet de votre paix
  rationale: « Paix » est l’équivalent lexical direct de εἰρήνη et convient au contexte diplomatique, tout en laissant ouverte la possibilité du sens plus large de bien-être.
