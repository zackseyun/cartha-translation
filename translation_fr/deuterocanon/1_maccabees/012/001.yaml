base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: fr
  text: Quand Jonathan vit que les circonstances lui étaient favorables[a], il choisit des hommes et les envoya à Rome pour établir et renouveler les relations d’amitié avec les Romains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que le moment travaillait avec lui »; autrement dit, que la conjoncture jouait en sa faveur.'
    reason: lexical_alternative
  - marker: b
    text: Ici, les « relations d’amitié » désignent vraisemblablement des relations diplomatiques officielles, et non une simple affection personnelle.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: Quand Jonathan vit
  rationale: Le participe aoriste introduit la circonstance qui précède les actions principales; cette tournure est naturelle en français et conserve sa valeur temporelle.
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: que les circonstances lui étaient favorables
  rationale: καιρός désigne ici une conjoncture propice, tandis que συνεργεῖ exprime idiomatiquement qu’elle concourt à l’avantage de Jonathan. Cette formulation restitue le sens sans reproduire littéralement la métaphore grecque de coopération.
- source_word: ἐπέλεξεν ἄνδρας
  choice: il choisit des hommes
  rationale: Rendu direct de la sélection d’hommes qui serviront vraisemblablement d’émissaires.
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: les envoya à Rome
  rationale: Formulation française simple et exacte du déplacement à but diplomatique.
- source_word: στῆσαι
  choice: établir
  rationale: Dans ce contexte diplomatique, le verbe indique l’action de donner une assise ferme aux relations.
- source_word: ἀνανεῶσαι
  choice: renouveler
  rationale: Le terme signifie rendre de nouveau actuel ou réaffirmer ce qui existait déjà.
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: les relations d’amitié avec les Romains
  rationale: φιλία peut désigner une amitié politique officielle. « Relations d’amitié » préserve ce terme sans imposer le sens plus précis d’« alliance »; « les Romains » explicite naturellement le référent du pronom.
