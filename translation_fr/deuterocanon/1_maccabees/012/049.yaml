base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/049.yaml
  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
translation:
  language: fr
  text: Tryphon envoya des troupes et de la cavalerie en Galilée, dans la grande plaine, afin de faire périr tous ceux qui étaient avec Jonathan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les partisans de Jonathan ». L’expression grecque signifie littéralement « tous ceux qui étaient auprès de Jonathan » et peut désigner ses hommes ou ses partisans.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste indique simplement l’envoi de forces militaires; « envoya » est naturel et fidèle.
- source_word: δυνάμεις
  choice: des troupes
  rationale: Au pluriel et dans ce contexte militaire, le terme désigne des unités armées plutôt que des « puissances » abstraites.
- source_word: ἵππον
  choice: de la cavalerie
  rationale: Le singulier grec a ici un sens collectif et désigne les troupes montées.
- source_word: εἰς Γαλιλαίαν
  choice: en Galilée
  rationale: Cette tournure française exprime naturellement le mouvement vers l’intérieur de la région marqué par εἰς.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: dans la grande plaine
  rationale: La traduction conserve la désignation géographique sobre du grec sans préciser davantage son identification.
- source_word: τοῦ ἀπολέσαι
  choice: afin de faire périr
  rationale: L’infinitif articulé exprime le but; « faire périr » rend la visée meurtrière sans ajouter une nuance familière.
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: tous ceux qui étaient avec Jonathan
  rationale: παρά avec le nom d’une personne exprime ici l’association ou l’appartenance à son camp, tout en gardant une légère ambiguïté sur la nature exacte de ce lien.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le vocabulaire militaire reste précis sans être technique; la formulation conserve l’ambiguïté de l’expression décrivant les hommes associés à Jonathan.
