  text: And he sent letters to the Spartans and to other places in the same terms[a].
translation:
  language: fr
  text: Il envoya aussi des lettres aux Spartiates et en d’autres lieux, dans les mêmes termes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de même teneur » ou « de la même manière » ; l’expression grecque indique que ces lettres correspondaient, par leur contenu ou leur formulation, à celle qui vient d’être mentionnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: L’aoriste actif de ἀποστέλλω exprime simplement l’action d’envoyer; « il envoya » est naturel, précis et digne en français moderne.
- source_word: ἐπιστολὰς
  choice: des lettres
  rationale: L’accusatif pluriel désigne plusieurs lettres; « des lettres » en rend clairement le nombre.
- source_word: πρὸς Σπαρτιάτας
  choice: aux Spartiates
  rationale: Après un verbe d’envoi, πρός indique ici les destinataires; « aux Spartiates » est la formulation française idiomatique.
- source_word: τόπους ἑτέρους
  choice: en d’autres lieux
  rationale: La formulation conserve le sens géographique général de τόπους sans préciser indûment qu’il s’agirait de régions ou d’entités politiques.
- source_word: κατὰ ταὐτά
  choice: rédigées dans les mêmes termes
  rationale: L’expression marque une correspondance avec le contenu ou la formulation de la lettre précédemment évoquée. Cette traduction explicite naturellement le lien tout en laissant ouverte la question d’une identité de formulation ou seulement de teneur.
