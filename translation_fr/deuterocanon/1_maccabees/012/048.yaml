base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: fr
  text: Mais lorsque Jonathan entra dans Ptolémaïs, les habitants de la ville fermèrent les portes et se saisirent de lui, puis ils tuèrent par l’épée tous ceux qui étaient venus avec lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tous ceux qui s’étaient rassemblés avec lui ». Dans ce contexte, il s’agit de ceux qui étaient entrés dans la ville avec Jonathan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mais lorsque
  rationale: Rend à la fois la transition temporelle et le contraste narratif qui introduit le guet-apens.
- source_word: εἰσῆλθεν
  choice: entra dans
  rationale: Exprime simplement le mouvement vers l’intérieur de la ville, dans un français naturel.
- source_word: Πτολεμαΐδα
  choice: Ptolémaïs
  rationale: Forme française traditionnelle et reconnaissable du nom grec de la ville.
- source_word: οἱ Πτολεμαεῖται
  choice: les habitants de la ville
  rationale: L’ethnique désigne les gens de Ptolémaïs. Cette formulation évite la répétition immédiate du nom de la ville tout en restant précise dans le contexte.
- source_word: ἀπέκλεισαν τὰς πύλας
  choice: fermèrent les portes
  rationale: Rend directement l’action hostile de fermer les portes, sans ajouter l’idée plus précise de les barricader.
- source_word: συνέλαβον αὐτόν
  choice: se saisirent de lui
  rationale: Traduit la prise soudaine de Jonathan sans suggérer nécessairement une arrestation judiciaire formelle.
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: tous ceux qui étaient venus avec lui
  rationale: Formulation française naturelle qui conserve l’idée de personnes ayant accompagné Jonathan; la nuance littérale de réunion est signalée en note.
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: ils tuèrent par l’épée
  rationale: Reproduit l’expression grecque de mise à mort violente dans un registre biblique digne mais actuel.
