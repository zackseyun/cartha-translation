  yaml_path: translation/deuterocanon/1_maccabees/012/024.yaml
  text: And Jonathan heard that Demetrius’s commanders had returned with a much larger force than before to make war against him.
translation:
  language: fr
  text: Jonathan apprit que les commandants de Démétrios étaient revenus avec une force bien plus importante qu’auparavant pour lui faire la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce récit, le verbe indique que Jonathan reçoit une nouvelle. « Apprit » est plus naturel en français que le calque « entendit » sans préciser le mode de transmission.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: les commandants de Démétrios
  rationale: Dans ce contexte militaire, ἄρχοντες désigne vraisemblablement les chefs ou officiers qui dirigent les troupes; « commandants » exprime cette fonction sans leur attribuer une souveraineté.
- source_word: ἐπέστρεψαν
  choice: étaient revenus
  rationale: Le plus-que-parfait situe naturellement leur retour avant le moment où Jonathan en reçoit la nouvelle.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec des forces beaucoup plus nombreuses
  rationale: δύναμις désigne ici les forces militaires. Le pluriel français « des forces » est idiomatique, et « beaucoup plus nombreuses » intègre la comparaison exprimée par ὑπὲρ τὸ πρότερον.
- source_word: ὑπὲρ τὸ πρότερον
  choice: qu’auparavant
  rationale: Cette tournure établit une comparaison avec l’expédition ou les forces précédentes; « qu’auparavant » la rend avec concision.
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: pour lui faire la guerre
  rationale: L’infinitif articulé exprime le but. « Faire la guerre à quelqu’un » restitue la portée militaire de πολεμέω dans un français naturel et soutenu.
