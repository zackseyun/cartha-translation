base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: fr
  text: Ainsi donc, en tout temps et sans relâche, nous nous souvenons de vous lors des fêtes et des autres jours prescrits[a], lorsque nous offrons des sacrifices[b] et dans nos prières, comme il est juste et convenable de se souvenir de ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des autres jours appropriés » ; le grec désigne des jours considérés comme requis ou convenables pour l’observance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la construction peut aussi se rendre : « à l’occasion des sacrifices que nous offrons ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ ἀδιαλείπτως
  choice: en tout temps et sans relâche
  rationale: Conserve les deux expressions grecques, qui soulignent ensemble la régularité constante du souvenir, sans suggérer nécessairement une action littéralement ininterrompue.
- source_word: ἑορταῖς
  choice: fêtes
  rationale: Terme français courant et digne pour les célébrations du calendrier religieux.
- source_word: καθηκούσαις ἡμέραις
  choice: jours prescrits
  rationale: Rend l’idée de jours reconnus comme requis ou appropriés pour l’observance, tout en signalant en note la nuance possible.
- source_word: μνημονεύομεν ὑμῶν
  choice: nous nous souvenons de vous
  rationale: Formulation naturelle qui garde ici la portée concrète du souvenir exprimé dans le culte et la prière.
- source_word: ἐφʼ ὧν προσφέρομεν θυσίων
  choice: lorsque nous offrons des sacrifices
  rationale: Rend naturellement le lien entre les occasions cultuelles et l’offrande des sacrifices; la construction grecque inhabituelle permet aussi une formulation plus littérale, donnée en note.
- source_word: ἐν ταῖς προσευχαῖς
  choice: dans nos prières
  rationale: Préserve le pluriel grec et le cadre liturgique des prières répétées.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: comme il est juste et convenable
  rationale: Reproduit les deux notions complémentaires d’obligation morale et de convenance.
- source_word: ἀδελφῶν
  choice: ses frères
  rationale: Maintient le masculin pluriel et la désignation de parenté collective du grec, dans une maxime générale où le possessif français est nécessaire.
theological_decisions:
- issue: Portée du terme de parenté ἀδελφῶν
  choice: ses frères
  alternative: ses compatriotes
  rationale: Le grec emploie explicitement le terme « frères », qui peut exprimer ici une solidarité ethnique, politique ou religieuse. La traduction conserve cette image et n’en réduit pas la portée à la seule nationalité.
translation_notes:
  register: Français international moderne, fluide et digne. « Ainsi donc » assure la transition; « fêtes », « sacrifices » et « prières » conservent le cadre cultuel sans archaïsme. Les deux notes préservent les nuances syntaxiques et lexicales réelles du grec.
