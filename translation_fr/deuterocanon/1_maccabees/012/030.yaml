  text: And he pursued after them, but did not overtake them, for they had crossed the Eleutherus River.
translation:
  language: fr
  text: Il se lança à leur poursuite, mais ne les rattrapa pas, car ils avaient franchi le fleuve Éleuthère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτῶν
  choice: se lança à leur poursuite
  rationale: Cette tournure française naturelle rend l’idée d’une poursuite active exprimée par καταδιώκω avec ὀπίσω αὐτῶν, sans reproduire maladroitement le sens spatial littéral de « derrière eux ».
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: ne les rattrapa pas
  rationale: Dans ce contexte de fuite et de poursuite, καταλαμβάνω signifie rejoindre ou rattraper les fugitifs ; « rattraper » est précis et idiomatique en français moderne.
- source_word: διέβησαν
  choice: avaient franchi
  rationale: Le plus-que-parfait marque naturellement que la traversée avait déjà eu lieu et explique l’échec de la poursuite. « Franchir » convient au passage d’un cours d’eau dans ce récit militaire.
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: le fleuve Éleuthère
  rationale: Ἐλεύθερον est conservé comme nom propre sous sa forme française traditionnelle « Éleuthère », tandis que ποταμόν est rendu par « fleuve ».
