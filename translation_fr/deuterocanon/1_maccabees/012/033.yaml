  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: fr
  text: Simon partit et passa par Ascalon et les places fortes voisines. Puis il se détourna vers Joppé et s’en empara d’avance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’occupa d’avance » ou « s’en empara préventivement » ; le verbe grec évoque une prise de contrôle réalisée avant une autre partie.
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: parcourut le pays
  rationale: Le verbe exprime le déplacement à travers une région ou le long d’un itinéraire; cette tournure française reste naturelle sans préciser indûment qu’il s’agissait d’une marche militaire.
- source_word: ἕως Ἀσκάλωνος
  choice: jusqu’à Ascalon
  rationale: ἕως indique la limite atteinte et se rend directement par «jusqu’à».
- source_word: τὰ πλησίον ὀχυρώματα
  choice: les places fortes des environs
  rationale: ὀχυρώματα désigne des lieux fortifiés, tandis que πλησίον marque leur proximité. «Places fortes» convient au contexte historique et reste compréhensible.
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: il fit un détour par Joppé
  rationale: ἐκκλίνω signale un écart par rapport à l’itinéraire suivi. «Fit un détour par» exprime naturellement ce changement de direction.
- source_word: προκατελάβετο
  choice: s’en empara avant les autres
  rationale: Le composé indique une prise de contrôle effectuée d’avance ou avant une autre partie. La traduction conserve cette antériorité sans identifier les personnes devancées.
- source_word: αὐτήν
  choice: en
  rationale: Le pronom reprend la ville de Joppé; «s’en empara» est l’expression idiomatique française.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les toponymes traditionnels français «Ascalon» et «Joppé» sont retenus. La coordination grecque est répartie en deux phrases pour une lecture naturelle, sans modifier la progression du récit.
