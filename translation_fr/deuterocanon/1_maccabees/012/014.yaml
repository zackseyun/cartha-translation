  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: fr
  text: Nous avons tenté de vous envoyer un message afin de renouveler la fraternité et l’amitié envers vous, afin de ne pas nous éloigner de vous ; car bien du temps s’est écoulé depuis que vous nous avez envoyé un message.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car de nombreuses périodes se sont écoulées depuis que vous avez envoyé vers nous ». Le grec ne précise pas ce qui a été envoyé ; « un message » est une explicitation dans la traduction aux deux occurrences.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Nous avons entrepris
  rationale: Le verbe exprime ici une tentative ou une démarche délibérée. « Avons entrepris » convient à la dignité d’une correspondance diplomatique sans garantir l’aboutissement de la démarche.
- source_word: ἀποστεῖλαι
  choice: de vous envoyer un message
  rationale: Le verbe signifie simplement « envoyer », sans complément exprimé. Le français exige ici une légère explicitation ; « un message » reste plus neutre que « une lettre » ou « des envoyés ».
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: les liens de fraternité et d’amitié qui nous unissent
  rationale: ἀδελφότης et φιλία désignent les relations de fraternité et d’amitié. « Les liens » rend la tournure naturelle en français, tandis que « qui nous unissent » explicite la portée relationnelle de πρὸς ὑμᾶς.
- source_word: ἀνανεώσασθαι
  choice: pour renouveler
  rationale: Le moyen infinitif indique le renouvellement d’une relation déjà existante ; « renouveler » est précis et naturel dans un contexte diplomatique.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: afin de ne pas devenir étrangers à vos yeux
  rationale: La construction exprime le but. ἐξαλλοτριόω évoque l’éloignement ou l’aliénation relationnelle ; cette formulation conserve l’idée de devenir étrangers sans employer le français plus technique « être aliénés ».
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: car bien du temps s’est écoulé
  rationale: Le pluriel καιροί signifie littéralement « temps », « périodes » ou « saisons ». En contexte, l’expression idiomatique française « bien du temps » communique clairement une longue durée sans la préciser en années.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: depuis que vous nous avez envoyé un message
  rationale: Le grec ne précise pas ce qui fut envoyé. « Un message » fournit le complément nécessaire en français tout en évitant de choisir entre lettre et ambassade.
