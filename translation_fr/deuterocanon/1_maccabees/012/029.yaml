  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
translation:
  language: fr
  text: Mais Jonathan et ceux qui étaient avec lui ne s’en aperçurent que le matin[a], car ils voyaient les feux qui brûlaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « les lumières qui brûlaient ». Dans ce contexte, il s’agit vraisemblablement de feux laissés allumés dans le camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωναθὰν δὲ
  choice: Mais Jonathan
  rationale: La particule δέ marque ici une transition avec une légère opposition; « mais » convient au déroulement du récit.
- source_word: οἱ παρʼ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Rend naturellement le groupe accompagnant Jonathan sans préciser davantage qu’il s’agit de soldats.
- source_word: οὐκ ἔγνωσαν ἕως πρωί
  choice: ne s’en aperçurent que le matin
  rationale: Cette tournure française exprime idiomatiquement qu’ils restèrent dans l’ignorance jusqu’au matin. « Ne le surent pas avant le matin » serait plus formel, mais moins naturel ici.
- source_word: ἔβλεπον
  choice: ils voyaient
  rationale: L’imparfait grec fournit la circonstance continue expliquant pourquoi ils ne se sont aperçus de rien; l’imparfait français en restitue bien l’aspect.
- source_word: τὰ φῶτα
  choice: les feux
  rationale: Le sens littéral est « les lumières », mais, dans ce contexte de campement nocturne, il s’agit vraisemblablement de feux visibles. La note conserve l’expression grecque littérale.
- source_word: καιόμενα
  choice: qui brûlaient
  rationale: Rend de manière naturelle le participe décrivant l’état visible et continu des feux.
