lexical_decisions:
- source_word: Ἄρης
  choice: Arius
  rationale: Dans cette adresse épistolaire, il s’agit d’un nom personnel. Bien que la forme grecque corresponde à « Arès », le roi spartiate est traditionnellement identifié sous le nom d’Arius ; une note conserve la forme grecque comme autre possibilité.
- source_word: βασιλεὺς Σπαρτιατῶν
  choice: roi des Spartiates
  rationale: Le génitif pluriel désigne le peuple spartiate, et non simplement la ville de Sparte.
- source_word: Ὀνείᾳ
  choice: à Onias
  rationale: Le datif marque ici le destinataire de la lettre et se rend naturellement par « à ».
- source_word: ἱερεῖ μεγάλῳ
  choice: le grand prêtre
  rationale: « Grand prêtre » est le titre français établi pour cette fonction juive et rend idiomatiquement l’expression grecque.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans une formule épistolaire grecque, χαίρειν est une salutation conventionnelle, et non une invitation littérale à se réjouir.
