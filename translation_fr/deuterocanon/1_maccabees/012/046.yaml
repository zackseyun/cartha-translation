  text: And trusting him, he did as he said, and sent out the forces, and they went away into the land of Judah.
translation:
  language: fr
  text: Lui ayant fait confiance, il fit comme il l’avait dit, dépêcha les troupes, et elles partirent pour le pays de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entrèrent dans le pays de Juda »; dans ce contexte de déplacement, la préposition grecque peut indiquer soit la destination, soit l’entrée dans le territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπιστεύσας αὐτῷ
  choice: Comme il lui faisait confiance
  rationale: La tournure causale rend naturellement en français le participe aoriste et le complément personnel, sans alourdir la phrase.
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: il fit ce qu’il avait dit
  rationale: Cette formulation reste proche du grec et conserve l’ambiguïté de son sujet implicite, tout en employant le plus-que-parfait attendu dans un récit français.
- source_word: ἐξαπέστειλεν τὰς δυνάμεις
  choice: il renvoya les troupes
  rationale: Dans ce contexte militaire, δυνάμεις désigne des troupes et le composé ἐξαποστέλλω exprime ici leur renvoi plutôt qu’un simple envoi en mission.
- source_word: ἀπῆλθον
  choice: partirent
  rationale: Le verbe français exprime clairement le départ, sans la lourdeur de « s’en allèrent ».
- source_word: εἰς γῆν Ἰούδα
  choice: pour le pays de Juda
  rationale: Avec un verbe de départ, « pour » indique naturellement la destination; « pays de Juda » reproduit la construction grecque sans la remplacer par « Judée ».
