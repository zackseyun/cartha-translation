  text: And when the pursuers saw that it was a matter of life and death for them[a], they turned back.
translation:
  language: fr
  text: Quand ceux qui les poursuivaient virent que leur vie était en jeu[a], ils rebroussèrent chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « que, pour eux, il s’agissait de leur vie » ; cette expression signifie que leur vie était en danger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: quand … virent
  rationale: Le participe aoriste a ici une valeur temporelle naturelle. Bien que la forme grecque soit au singulier, elle se rapporte dans le texte transmis au sujet pluriel οἱ διώκοντες ; le français exige donc le pluriel.
- source_word: οἱ διώκοντες
  choice: ceux qui les poursuivaient
  rationale: Le participe présent substantivé désigne le groupe engagé dans la poursuite. Cette formulation est claire et naturelle dans le récit.
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: que leur vie était en jeu
  rationale: 'La tournure grecque exprime un danger mortel : les poursuivants comprennent que leur propre vie est menacée. La formulation française rend directement cet idiome sans lui donner un sens métaphysique.'
- source_word: ψυχῆς
  choice: vie
  rationale: Dans cette expression, ψυχή désigne la vie physique plutôt que l'âme comme réalité immatérielle.
- source_word: ἐπέστρεψαν
  choice: ils rebroussèrent chemin
  rationale: Dans le contexte d'une poursuite, le verbe indique qu'ils inversent leur direction et renoncent à continuer, plutôt qu'un simple retour à un lieu précisé.
