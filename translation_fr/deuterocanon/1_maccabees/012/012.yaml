lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: nous nous réjouissons
  rationale: Le verbe exprime ici la joie éprouvée. « Nous nous réjouissons » est naturel, digne et conserve pleinement la force verbale du grec.
- source_word: δὲ
  choice: mais
  rationale: δέ marque une transition ou un léger contraste avec ce qui précède ; « mais » en maintient ici la valeur connective.
- source_word: ἐπὶ
  choice: de
  rationale: Avec le datif, ἐπί peut désigner le motif ou l’occasion de la joie. En français moderne, « se réjouir de » rend cette relation de façon idiomatique sans en préciser excessivement la nuance causale.
- source_word: τῇ δόξῃ
  choice: votre gloire
  rationale: δόξα désigne ici la gloire, l’honneur ou le renom des destinataires. « Gloire » reste le correspondant direct tout en préservant l’étendue sémantique du terme.
- source_word: ὑμῶν
  choice: votre
  rationale: Le génitif de la deuxième personne du pluriel détermine δόξῃ ; « votre » convient aussi bien à un destinataire collectif qu’à plusieurs destinataires.
