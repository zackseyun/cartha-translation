base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: fr
  text: « Maintenant donc, renvoie-les chez eux, mais choisis pour toi quelques hommes qui resteront avec toi. Viens avec moi à Ptolémaïs, et je te la livrerai, avec les autres places fortes, les nombreuses troupes et tous les responsables des affaires[a]. Puis, après être revenu, je partirai[b], car c’est pour cela que je suis ici. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les fonctionnaires ». Le grec désigne littéralement tous ceux qui sont préposés aux besoins ou aux affaires.
    reason: lexical_alternative
  - marker: b
    text: 'La formulation grecque est condensée : le locuteur dit qu’il sera revenu ou se sera retourné avant de partir, sans préciser vers quel lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: renvoie-les chez eux
  rationale: Cette tournure française exprime naturellement le renvoi des hommes vers leur domicile, sans réduire οἴκους aux bâtiments physiques.
- source_word: ἐπίλεξαι δὲ σεαυτῷ
  choice: mais choisis pour toi
  rationale: Le pronom réfléchi et la voix moyenne indiquent que Jonathan doit sélectionner ces hommes pour les garder auprès de lui.
- source_word: ἄνδρας ὀλίγους
  choice: quelques hommes
  rationale: La traduction conserve le terme général « hommes » plutôt que d’ajouter « soldats », même si le contexte est militaire.
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: Viens avec moi à Ptolémaïs
  rationale: L’impératif δεῦρο fonctionne ici comme une invitation ou une sommation à accompagner le locuteur.
- source_word: παραδώσω σοι αὐτὴν
  choice: je te la livrerai
  rationale: Le pronom féminin renvoie naturellement à Ptolémaïs; « livrer » exprime le transfert de son contrôle sans ajouter l’idée explicite d’une reddition.
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: les autres places fortes
  rationale: « Places fortes » convient au contexte politico-militaire et rend les positions fortifiées désignées par ὀχυρώματα.
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: les nombreuses troupes
  rationale: Dans ce contexte, δυνάμεις désigne des forces militaires; « nombreuses » rend explicitement leur quantité.
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: tous les responsables des affaires
  rationale: Cette formulation garde le sens administratif de personnes préposées aux besoins ou aux affaires, sans leur attribuer un titre moderne trop précis.
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: après être revenu, je partirai
  rationale: La formulation respecte l’antériorité du participe par rapport au verbe au futur, tout en laissant indéterminé le point vers lequel le locuteur reviendra.
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: car c’est pour cela que je suis venu
  rationale: Cette traduction française naturelle exprime la raison ou le but de la présence du locuteur.
