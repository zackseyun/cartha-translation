base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: fr
  text: Onias accueillit avec honneur l’homme qui avait été envoyé[a] et reçut les lettres[b], dans lesquelles l’alliance et l’amitié étaient exposées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « accueillit honorablement l’envoyé ». Le grec dit plus littéralement : « accueillit avec honneur l’homme qui avait été envoyé ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « où il était clairement question d’alliance et d’amitié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: accueillit
  rationale: Le verbe désigne ici l’accueil réservé à une personne; « accueillit » est plus naturel en français que la répétition de « reçut » et n’exagère pas la chaleur de l’accueil.
- source_word: ἐνδόξως
  choice: avec honneur
  rationale: L’adverbe indique un accueil honorable ou distingué. « Avec honneur » rend clairement la dignité sociale de la réception sans la connotation trompeuse de « glorieusement ».
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: l’homme qui avait été envoyé
  rationale: Cette formulation conserve l’expression descriptive du grec, littéralement « l’homme, celui qui avait été envoyé », sans lui substituer d’office le titre contextuel d’« envoyé » ou d’« émissaire ».
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: reçut les lettres
  rationale: Dans cet échange diplomatique, « reçut » exprime idiomatiquement le sens de ἔλαβε, plutôt que le plus matériel « prit ».
- source_word: διεσάφειτο
  choice: il était question
  rationale: Cette tournure française naturelle rend le fait que les lettres exposaient ou précisaient le sujet, tout en évitant l’expression peu idiomatique « l’alliance et l’amitié étaient expliquées ».
- source_word: συμμαχίας
  choice: alliance
  rationale: Le nom désigne une alliance, souvent politique ou militaire; le contexte diplomatique suffit sans ajouter « militaire ».
- source_word: φιλίας
  choice: amitié
  rationale: « Amitié » est l’équivalent direct et convient au vocabulaire diplomatique ancien, en parallèle avec « alliance ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La traduction évite la répétition maladroite de « reçut » tout en distinguant l’accueil de l’homme de la réception des lettres. Le tour diplomatique demeure intelligible pour un lectorat général.
