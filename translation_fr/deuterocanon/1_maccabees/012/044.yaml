  yaml_path: translation/deuterocanon/1_maccabees/012/044.yaml
  text: And he said to Jonathan[a], “Why have you cut down all this people, when no war is pressing upon us?”
translation:
  language: fr
  text: 'Il dit à Jonathan : « Pourquoi as-tu frappé[a] tout ce peuple, alors qu’aucune guerre ne nous menace ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec signifie littéralement « coupé » ou « frappé ». Dans ce contexte, le verbe peut évoquer le fait d’abattre, de mettre à mal ou de détruire, sans préciser exactement l’ampleur de l’action.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνα τί
  choice: Pourquoi
  rationale: La suite interrogative transmise est abrupte, mais elle demande manifestement la raison de l’action. « Pourquoi » en restitue naturellement la fonction sans reproduire une obscurité grammaticale.
- source_word: ἔκοψας
  choice: as-tu anéanti
  rationale: Le verbe κόπτω signifie littéralement « couper » ou « frapper » et peut, dans un contexte militaire, désigner le fait d’abattre ou de détruire. « Anéanti » rend ici cette force sans employer le calque peu naturel « couper tout ce peuple ».
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: tout ce peuple
  rationale: λαός désigne normalement un peuple ou un ensemble de personnes, et non spécifiquement une armée. Le singulier collectif grec est conservé dans une tournure française naturelle.
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: alors qu’aucune guerre ne nous menace
  rationale: Le participe de ἐνίστημι exprime une guerre présente, survenue ou pressante. « Ne nous menace » communique clairement qu’aucune guerre ne pèse alors sur eux, tout en gardant l’idée d’imminence.
- source_word: τῷ Ἰωναθάν
  choice: à Jonathan
  rationale: Le datif marque le destinataire des paroles; le nom propre est rendu selon sa forme française usuelle.
