base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/004.yaml
  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
translation:
  language: fr
  text: Ils leur remirent des lettres adressées aux gens de chaque localité[a], afin que ceux-ci les aident à poursuivre leur route[b] jusqu’au pays de Juda, en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « localité par localité ». L’expression indique que les lettres étaient destinées aux gens ou aux autorités des différents lieux situés sur le trajet.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les escortent plus loin ». Le verbe grec peut désigner le fait d’accompagner des voyageurs ou de les aider à poursuivre leur route.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: ils remirent
  rationale: Dans ce contexte, δίδωμι désigne la remise de lettres à des voyageurs; « remirent » est naturel et précis en français narratif.
- source_word: ἐπιστολὰς
  choice: des lettres
  rationale: ἐπιστολή désigne couramment une lettre ou communication écrite.
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: leur ... adressées aux gens
  rationale: Le premier pronom renvoie aux voyageurs qui reçoivent les lettres; le second, comprimé en grec, renvoie vraisemblablement aux destinataires rencontrés en chemin. L’explicitation évite une suite ambiguë de pronoms en français.
- source_word: κατὰ τόπον
  choice: de chaque localité
  rationale: La tournure distributive signifie « localité par localité » ou « dans chaque lieu » et indique les destinataires successifs le long de l’itinéraire.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but de la remise des lettres.
- source_word: προπέμπωσιν
  choice: les aident à poursuivre leur route
  rationale: προπέμπω peut signifier envoyer plus loin, accompagner ou pourvoir à la continuation d’un voyage. Cette formulation française conserve cette amplitude sans imposer l’idée plus étroite d’une escorte.
- source_word: γῆν Ἰούδα
  choice: pays de Juda
  rationale: Rend directement l’expression « terre/pays de Juda » tout en restant idiomatique en français.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Traduction proche de l’expression grecque, qui implique ici un voyage sûr et sans entrave.
