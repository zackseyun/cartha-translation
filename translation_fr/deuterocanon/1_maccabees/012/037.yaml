  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: fr
  text: Ils se rassemblèrent pour bâtir, et une partie du mur du ravin à l’est[a] s’effondra ; il répara ce qu’on appelle Chaphenatha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une partie du mur du torrent, du côté est ». La formulation grecque est très resserrée, et χείμαρρος peut désigner un cours d’eau saisonnier ou le ravin qui lui sert de lit.
    reason: lexical_alternative
  - marker: b
    text: Chaphenatha est la translittération d’un nom de lieu. Le grec ne précise pas plus exactement de quel type de lieu ou d’ouvrage il s’agissait.
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν
  choice: ils se rassemblèrent
  rationale: L’aoriste passif à valeur intransitive indique que le groupe se réunit dans un but précis. « Se rassemblèrent » est naturel et proche du grec.
- source_word: τοῦ οἰκοδομεῖν
  choice: pour bâtir
  rationale: L’infinitif articulé au génitif exprime ici le but. « Bâtir » respecte le grec sans ajouter l’idée explicite de reconstruction.
- source_word: ἔπεσεν
  choice: s’effondra
  rationale: Le verbe signifie littéralement « tomber » ; appliqué à un mur, « s’effondra » exprime naturellement l’événement en français.
- source_word: τοῦ τείχους
  choice: le mur
  rationale: τείχος désigne un mur, souvent une muraille défensive. Le contexte n’exige pas de préciser davantage.
- source_word: τοῦ χειμάρρου
  choice: du ravin
  rationale: χείμαρρος peut désigner un torrent saisonnier ainsi que son lit ou le ravin qu’il forme. « Ravin » convient au relief évoqué sans suggérer qu’un cours d’eau coulait en permanence.
- source_word: τοῦ ἐξ ἀπηλιώτου
  choice: situé à l’est
  rationale: ἀπηλιώτης renvoie à l’est ou au vent d’est. Dans cette expression resserrée, « situé à l’est » rend clairement l’orientation sans prétendre lever toute l’ambiguïté syntaxique.
- source_word: ἐπεσκεύασεν
  choice: il répara
  rationale: Le verbe signifie réparer ou remettre en état. « Répara » convient au contexte des fortifications endommagées et n’exagère pas l’ampleur des travaux.
- source_word: τὸ καλούμενον Χαφεναθά
  choice: ce qu’on appelle Chaphenatha
  rationale: Le grec emploie une tournure neutre sans indiquer s’il s’agit précisément d’un lieu, d’un quartier ou d’un ouvrage. Cette formulation conserve cette réserve et translittère le nom propre.
