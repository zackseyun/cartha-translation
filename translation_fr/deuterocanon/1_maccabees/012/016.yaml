lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: nous nous réjouissons
  rationale: Le verbe exprime ici une joie présente. Cette tournure est naturelle, digne et proche de la forme grecque.
- source_word: δὲ
  choice: mais
  rationale: La particule marque une légère opposition ou transition avec le contexte précédent ; « mais » en conserve la valeur, sans accentuer fortement le contraste.
- source_word: ἐπὶ
  choice: de
  rationale: Avec le datif, la préposition indique ici le motif de la joie. En français, « se réjouir de » rend naturellement cette relation.
- source_word: τῇ δόξῃ
  choice: renommée
  rationale: Dans ce contexte épistolaire, δόξα désigne vraisemblablement la réputation honorable ou le prestige des destinataires plutôt qu'une splendeur visible. « Renommée » exprime clairement ce sens tout en laissant les autres possibilités en note.
- source_word: ὑμῶν
  choice: votre
  rationale: Le pronom grec est à la deuxième personne du pluriel et renvoie collectivement aux destinataires.
