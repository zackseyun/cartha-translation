  text: Jonathan revint, rassembla les anciens du peuple et tint conseil avec eux pour construire des forteresses en Judée,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: revint
  rationale: Dans ce contexte narratif, le verbe désigne un retour physique. « Revint » est naturel et précis en français moderne.
- source_word: ἐξεκκλησίασεν
  choice: rassembla
  rationale: Le verbe exprime l’action de convoquer et réunir un groupe. « Rassembla » garde ici le sens public sans lourdeur technique.
- source_word: πρεσβυτέρους τοῦ λαοῦ
  choice: les anciens du peuple
  rationale: Il s’agit de responsables reconnus de la communauté, et non simplement d’hommes âgés. « Les anciens du peuple » conserve ce sens institutionnel traditionnel et intelligible.
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: tint conseil avec eux
  rationale: Le moyen souligne la délibération menée avec les anciens. « Tint conseil avec eux » restitue la dimension consultative et collective dans un registre digne.
- source_word: οἰκοδομῆσαι
  choice: construire
  rationale: L’infinitif indique l’objet ou le projet de la délibération. « Construire » convient naturellement aux ouvrages défensifs.
- source_word: ὀχυρώματα
  choice: des forteresses
  rationale: Le nom désigne des ouvrages ou lieux fortifiés à vocation défensive. « Forteresses » est concret et évite la possible abstraction de « fortifications ».
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: en Judée
  rationale: La formule situe les constructions dans la région de Judée, selon la forme française usuelle du nom.
