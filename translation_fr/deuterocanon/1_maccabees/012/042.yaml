  yaml_path: translation/deuterocanon/1_maccabees/012/042.yaml
  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
translation:
  language: fr
  text: Tryphon vit que Jonathan était venu avec une troupe nombreuse, et il craignit de porter la main sur lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’étendre les mains contre lui ». L’expression grecque peut désigner plus généralement une action hostile contre quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: était venu
  rationale: Dans ce récit militaire, l’aoriste de παρίστημι indique que Jonathan s’est présenté sur les lieux. Le plus-que-parfait français marque naturellement l’antériorité par rapport au constat de Tryphon.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec des forces nombreuses
  rationale: δύναμις désigne ici une force militaire ou des troupes, non une puissance abstraite. « Des forces nombreuses » conserve le sens collectif sans préciser indûment qu’il s’agit d’une armée constituée.
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: porter la main sur lui
  rationale: Cette expression française naturelle rend l’action hostile indiquée par l’idiome grec tout en laissant ouverte sa forme exacte. La formulation littérale est signalée en note.
- source_word: ηὐλαβήθη
  choice: il craignit
  rationale: Le verbe exprime ici une retenue motivée par la crainte. « Il craignit » est direct, actuel et cohérent avec la menace militaire immédiate.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Jonathan », implicite dans le verbe grec mais clair dans le contexte, est repris afin d’éviter que le premier « il » soit attribué à Tryphon. L’expression idiomatique « porter la main sur lui » préserve l’indétermination quant à la nature précise de l’action hostile.
