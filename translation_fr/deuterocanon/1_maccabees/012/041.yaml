  yaml_path: translation/deuterocanon/1_maccabees/012/041.yaml
  text: And Jonathan went out to meet him with forty thousand chosen men for battle[a], and he came to Beth-shan.
translation:
  language: fr
  text: Jonathan sortit à sa rencontre avec quarante mille hommes choisis pour le combat[a], et il arriva à Beth-Shân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pour se ranger en ordre de bataille» ou «pour le déploiement»; l’expression grecque évoque plus littéralement la mise en formation de combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι exprime simplement le fait de sortir; ce choix suit le mouvement narratif sans ajouter une nuance militaire absente du verbe.
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: Cette tournure idiomatique indique que Jonathan sort dans le but de rencontrer l’homme mentionné précédemment; «à sa rencontre» est naturel et concis en français.
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: avec quarante mille hommes
  rationale: Ici, ἐν a une valeur d’accompagnement. «Hommes» traduit ἀνδρῶν sans introduire explicitement «soldats», même si le contexte est militaire.
- source_word: ἐπιλεγμέναις
  choice: choisis
  rationale: Le mot désigne des hommes sélectionnés; «choisis» conserve cette idée dans un registre digne et courant.
- source_word: εἰς παρατάξιν
  choice: pour le combat
  rationale: παράταξις peut désigner la mise en ordre de bataille ou le combat envisagé. «Pour le combat» rend clairement la fonction militaire, tandis que la note conserve la nuance plus littérale de formation.
- source_word: ἦλθεν
  choice: il arriva
  rationale: Avec un lieu de destination, «arriva» rend naturellement l’aboutissement du déplacement exprimé par ἦλθεν, sans créer en français l’ambiguïté déictique de «vint».
- source_word: εἰς Βεθσάν
  choice: à Beth-Shân
  rationale: Le nom propre grec est translittéré sous une forme française lisible; l’accent circonflexe aide à représenter la voyelle longue traditionnellement indiquée dans ce toponyme.
