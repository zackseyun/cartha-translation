base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: fr
  text: de renforcer les murailles de Jérusalem et d’élever un ouvrage très haut entre la citadelle[a] et la ville, afin de séparer la citadelle de la ville et de l’isoler, pour que ses occupants ne puissent ni acheter ni vendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Acra », la place forte située à Jérusalem.
    reason: Alternative lexicale et désignation historique de la citadelle.
lexical_decisions:
- source_word: προφυῶσαι
  choice: renforcer
  rationale: Ce verbe rare évoque l’ajout d’éléments défensifs ou la consolidation. « Renforcer » exprime clairement l’action militaire sans préciser indûment la technique de construction.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: les murailles de Jérusalem
  rationale: « Murailles » convient naturellement aux murs défensifs d’une ville et maintient la portée concrète de τείχη.
- source_word: ὑψῶσαι ὕψος μέγα
  choice: élever un ouvrage très haut
  rationale: Le grec dit littéralement « élever une grande hauteur ». La formulation française conserve l’accent sur l’élévation tout en laissant indéterminée la nature exacte de l’ouvrage, plutôt que d’ajouter explicitement « muraille ».
- source_word: ἄκρας
  choice: la citadelle
  rationale: Dans ce contexte, ἄκρα désigne la place forte de Jérusalem. « Citadelle » en communique la fonction, tandis que la note conserve son nom historique possible.
- source_word: εἰς τὸ διαχωρίσαι
  choice: afin de séparer
  rationale: La construction infinitive exprime ici le but de l’ouvrage.
- source_word: αὐτὴν τῆς πόλεως
  choice: séparer la citadelle de la ville
  rationale: La répétition du nom lève en français l’ambiguïté référentielle du pronom féminin grec, qui renvoie naturellement à la citadelle.
- source_word: κατὰ μόνας
  choice: l’isoler
  rationale: L’expression indique que la citadelle devait se trouver seule, coupée de la ville. « L’isoler » restitue ce résultat avec naturel.
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: pour que ses occupants ne puissent ni acheter ni vendre
  rationale: Le sujet pluriel est implicite en grec et désigne les personnes présentes dans la citadelle. L’explicitation « ses occupants » évite en français un pronom sans antécédent humain clair.
theological_decisions:
- issue: Désignation historique de ἄκρα
  choice: « la citadelle » dans le texte principal
  alternative: « l’Acra » ou « la forteresse »
  rationale: Le terme n’est pas doctrinalement controversé, mais il possède une portée historique précise. La traduction fonctionnelle favorise la compréhension, et la note préserve l’appellation historique.
- issue: Nature de la structure exprimée par ὕψος μέγα
  choice: « un ouvrage très haut »
  alternative: « une haute muraille » ou « une haute barrière »
  rationale: Le grec insiste sur la hauteur sans nommer explicitement un mur dans cette proposition. La traduction retenue conserve cette légère indétermination tout en restant intelligible.
translation_notes:
  register: Français international moderne, clair et digne. Le début infinitif (« de renforcer ») conserve le lien syntaxique du verset avec la décision énoncée dans le contexte précédent. La répétition de « la citadelle » et l’expression « ses occupants » rendent explicites les référents implicites du grec sans modifier le sens.
