base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: fr
  text: Ainsi donc, en tout temps, nous nous souvenons continuellement de vous lors des fêtes et des autres jours prescrits[a], lorsque nous offrons des sacrifices et dans nos prières, comme il est juste et convenable de se souvenir de ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des autres jours appropriés » ou « habituels ». Le grec peut désigner des jours jugés convenables, observés selon l’usage ou fixés à cet effet.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: continuellement
  rationale: Rend l’idée d’une pratique constante et répétée, tout en conservant l’insistance créée avec « en tout temps ».
- source_word: ἑορταῖς
  choice: fêtes
  rationale: Désigne ici les célébrations religieuses; « fêtes » est le terme français courant et précis dans ce contexte.
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: les autres jours prescrits
  rationale: Dans ce contexte cultuel, καθηκούσαις qualifie vraisemblablement des jours reconnus comme appropriés, habituels ou fixés pour l’observance.
- source_word: μιμνησκόμεθα ὑμῶν
  choice: nous nous souvenons de vous
  rationale: Expression française directe qui conserve ici le sens actif d’une commémoration manifestée dans les sacrifices et les prières.
- source_word: ἐφʼ ὧν
  choice: quand
  rationale: Rend naturellement la relation temporelle entre ces jours d’observance et l’offrande des sacrifices.
- source_word: προσφέρομεν θυσιῶν
  choice: nous offrons des sacrifices
  rationale: Conserve sans généralisation le vocabulaire cultuel explicite du grec.
- source_word: ἐν ταῖς προσευχαῖς
  choice: dans nos prières
  rationale: Le possessif, implicite dans le contexte à la première personne du pluriel, donne une formulation française naturelle sans changer le référent.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: car il est juste et convenable
  rationale: Préserve les deux notions complémentaires de devoir et de convenance dans un français idiomatique.
- source_word: ἀδελφῶν
  choice: ses frères
  rationale: Maintient le masculin du grec et sa portée familiale, diplomatique et politique entre les peuples concernés.
theological_decisions:
- issue: Terme familial masculin ἀδελφῶν
  choice: ses frères
  alternative: les siens; ses frères et sœurs
  rationale: Le grec emploie explicitement le masculin dans une formule de fraternité entre collectivités; le conserver évite de neutraliser ou d’élargir silencieusement le texte.
- issue: Mention cultuelle des sacrifices et des prières
  choice: conserver explicitement « sacrifices » et « prières »
  alternative: généraliser par « offrandes » ou « culte »
  rationale: Le texte nomme précisément ces deux pratiques; une formulation plus générale effacerait le cadre cultuel et sacrificiel.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « en tout temps… continuellement » est maintenue parce qu’elle reflète l’insistance du grec, malgré une légère redondance en français.
