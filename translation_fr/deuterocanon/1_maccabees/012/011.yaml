review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’insistance de ἐν παντὶ καιρῷ ἀδιαλείπτως, les fêtes, les sacrifices, les prières et la formule fraternelle. Toutefois, « car » transforme ὡς (« comme / ainsi qu’il convient ») en une causalité absente du grec. La relation entre le souvenir, les sacrifices et les prières gagne aussi à être formulée plus nettement en français.
  naturalness: Le registre est moderne et digne. « Lors des fêtes » est naturel. La révision proposée évite l’enchaînement quelque peu heurté « quand nous offrons des sacrifices, ainsi que dans nos prières » et remplace le causal « car » par une tournure conforme au grec.
  terminology: « Fêtes », « sacrifices », « prières » et « frères » conviennent. « Jours prescrits » est une option recevable pour καθηκούσαις, à condition de conserver la note qui signale les sens possibles (« appropriés », « habituels », « fixés »).
  issues:
  - severity: medium
    issue: « car il est juste et convenable » pour ὡς δέον ἐστὶν καὶ πρέπον
    rationale: ὡς introduit une comparaison ou une conformité (« comme il est juste et convenable »), non la raison causale du souvenir. « Car » ajoute donc une relation logique que le texte grec n’explicite pas.
  - severity: low
    issue: Articulation de « quand nous offrons des sacrifices, ainsi que dans nos prières »
    rationale: Le grec associe le souvenir aux occasions sacrificielles et aux prières, avec une ellipse après « prières ». Une formulation française qui coordonne plus directement les deux cadres de souvenir est plus claire sans modifier le sens.
  revised_text: Ainsi donc, en tout temps, nous nous souvenons continuellement de vous lors des fêtes et des autres jours prescrits[a], lorsque nous offrons des sacrifices et dans nos prières, comme il est juste et convenable de se souvenir de ses frères.
