  text: Après avoir levé le camp, il se rendit à Damas et parcourut toute la région.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζεύξας
  choice: Après avoir levé le camp
  rationale: Le participe de ἀναζεύγνυμι évoque le fait de lever le camp ou de se mettre en marche. « Après avoir levé le camp » conserve clairement la nuance militaire et itinérante du contexte.
- source_word: ἦλθεν
  choice: il se rendit
  rationale: Avec εἰς Δαμασκόν, le verbe indique un déplacement jusqu’à Damas. « Il se rendit » est naturel en français narratif et évite de devoir choisir entre les perspectives de « vint » et « alla ».
- source_word: διώδευσεν
  choice: parcourut
  rationale: Le verbe désigne le fait de cheminer à travers un territoire. « Parcourut » exprime de façon concise un déplacement dans l’ensemble de la zone.
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: toute la région
  rationale: χώρα peut désigner un pays, un territoire ou une région. Ici, « région » convient au cadre territorial entourant Damas sans suggérer un État moderne.
- source_word: καὶ ... καὶ
  choice: Après ... et
  rationale: Le premier καί participe à l’enchaînement narratif et se trouve naturellement intégré à la construction participiale française; le second est rendu par « et ».
