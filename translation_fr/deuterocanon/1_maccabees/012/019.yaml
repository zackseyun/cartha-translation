  text: Therefore we did not wish to trouble you and the rest of our allies and friends in these wars[a].
translation:
  language: fr
  text: C’est pourquoi nous n’avons pas voulu vous déranger, vous et nos autres alliés et amis, dans ces guerres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « imposer une charge à vous et à nos autres alliés et amis dans ces conflits ». Le verbe grec peut signifier déranger, importuner ou imposer une charge ; dans ce contexte, il s’agit probablement d’une sollicitation diplomatique ou militaire plutôt que d’une contrariété personnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβουλόμεθα
  choice: nous n’avons pas voulu
  rationale: L’imparfait de βούλομαι exprime ici une volonté ou une intention passée. Le passé composé est naturel dans une lettre en français moderne et conserve le caractère délibéré de la décision.
- source_word: οὖν
  choice: C’est pourquoi
  rationale: Cette formulation marque clairement la conséquence ou l’inférence reliant la phrase au contexte précédent.
- source_word: παρενοχλεῖν
  choice: importuner
  rationale: Le verbe désigne le fait de déranger, gêner ou imposer une charge. « Importuner » convient au ton diplomatique sans suggérer un harcèlement violent.
- source_word: ὑμῖν καὶ τοὺς λοιποὺς
  choice: vous importuner, vous et nos autres
  rationale: Cette construction française rend explicitement le changement de cas du grec et comprend les destinataires avec les autres alliés, sans laisser entendre que « autres » qualifie les destinataires eux-mêmes.
- source_word: συμμάχους
  choice: alliés
  rationale: Terme politique et militaire courant pour les partenaires liés par une alliance.
- source_word: φίλους
  choice: amis
  rationale: Rend directement φίλους tout en laissant au contexte diplomatique sa possible nuance politique.
- source_word: ἐν τοῖς πολέμοις τούτοις
  choice: dans ces guerres
  rationale: Préserve le pluriel de πολέμοις et présente les guerres comme le cadre dans lequel les alliés auraient été sollicités ou gênés.
