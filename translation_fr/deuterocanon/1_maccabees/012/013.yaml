  text: But we[a], though having no need of these things, have as encouragement the holy books that are in our hands[b],
translation:
  language: fr
  text: Mais nous, qui n’avons pas besoin de ces choses, nous avons pour encouragement[a] les livres saints que nous avons entre les mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réconfort » ou « consolation ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les livres saints qui sont entre nos mains » ; l’expression peut aussi signifier « en notre possession ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσδεοι
  choice: qui n’avons pas besoin
  rationale: L’adjectif signifie « qui n’a pas besoin de » ou « indépendant de ». Cette formulation est naturelle en français et n’exagère pas l’idée d’autosuffisance.
- source_word: τούτων
  choice: de ces choses
  rationale: Le pronom au génitif renvoie aux réalités mentionnées auparavant. La traduction conserve ce renvoi sans le préciser indûment.
- source_word: παράκλησιν
  choice: réconfort
  rationale: Dans ce contexte, le terme désigne le soutien ou la consolation que procurent les écrits sacrés. « Réconfort » est naturel et laisse ouverte la nuance voisine d’encouragement.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: les livres saints
  rationale: Traduction directe qui préserve le terme concret « livres » sans introduire une définition canonique postérieure.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: que nous avons entre les mains
  rationale: Cette expression française conserve l’image grecque tout en pouvant évoquer la possession ou la disponibilité immédiate.
theological_decisions:
- issue: Référence des « livres saints »
  choice: les livres saints
  alternative: les Saintes Écritures / les écrits sacrés
  rationale: Le grec parle de livres qualifiés de saints sans délimiter explicitement un canon. La formulation retenue évite d’importer une précision doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « nous… nous » rend lisiblement la construction participiale grecque. La ponctuation finale laisse entendre que la phrase se poursuit dans le verset suivant.
