base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
translation:
  language: fr
  text: Quand leurs adversaires apprirent que Jonathan et ceux qui étaient avec lui étaient prêts au combat, ils eurent peur et perdirent courage[a] ; puis ils allumèrent des feux dans leur camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « figèrent leur cœur », image exprimant la perte de courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: leurs adversaires
  rationale: Le terme désigne ceux qui s’opposent à Jonathan ; « adversaires » conserve ce sens sans aller au-delà du grec.
- source_word: ἡτοίμασται Ἰωναθὰν καὶ οἱ παρʼ αὐτοῦ
  choice: Jonathan et ceux qui étaient avec lui étaient prêts
  rationale: Le parfait exprime l’état de préparation atteint ; « ceux qui étaient avec lui » reste proche de la formulation grecque sans ajouter « hommes ».
- source_word: εἰς πόλεμον
  choice: au combat
  rationale: Dans ce contexte militaire immédiat, « prêts au combat » est une expression française naturelle ; « pour la guerre » demeure possible mais sonne moins idiomatique ici.
- source_word: ἐφοβήθησαν
  choice: ils eurent peur
  rationale: Rend directement et naturellement l’aoriste déponent.
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: perdirent courage
  rationale: Cette formulation rend en français courant le sens de l’expression imagée selon laquelle leur cœur se figea.
- source_word: ἀνέκαυσαν πυρὰς
  choice: ils allumèrent des feux
  rationale: Traduction directe et naturelle du verbe « allumer, attiser » et du pluriel « feux ».
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: dans leur camp
  rationale: Dans un contexte militaire, παρεμβολή désigne naturellement le camp ou le campement.
