  text: And the kings around us fought against us[a].
translation:
  language: fr
  text: Et les rois qui nous entouraient nous ont fait la guerre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont combattu contre nous » ; le verbe grec peut désigner plus largement le fait de mener la guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμησαν
  choice: nous ont fait la guerre
  rationale: L’aoriste de πολεμέω désigne l’action de mener la guerre ou d’engager des hostilités. « Nous ont fait la guerre » exprime naturellement en français le sens militaire plein et la relation hostile marquée par ἡμᾶς.
- source_word: οἱ βασιλεῖς
  choice: les rois
  rationale: L’article grec désigne un groupe défini de rois, rendu de façon directe et idiomatique par « les rois ».
- source_word: οἱ κύκλῳ ἡμῶν
  choice: qui nous entouraient
  rationale: κύκλῳ avec le génitif indique la situation autour de quelqu’un. La proposition relative rend clairement le sens géographique ou géopolitique de rois établis dans les régions environnantes, sans ajouter « de tous côtés ».
