  text: Repay the nations with recompense[a], and pay attention to the commands of the law.
translation:
  language: fr
  text: Rendez aux nations leur rétribution[a], et soyez attentifs aux prescriptions de la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un verbe et un nom de la même famille, littéralement : « rendez aux nations une rétribution ». Cette répétition souligne l’idée de rendre en retour.'
    reason: Signale la construction cognate emphatique du grec; « leur » est requis par l’usage français et ne limite pas davantage le sens.
lexical_decisions:
- source_word: ἀνταποδίδοτε ἀνταπόδομα
  choice: Rendez… la pareille
  rationale: Cette tournure française naturelle exprime le retour en nature demandé par le verbe et son complément de même famille, tout en conservant la force réciproque du grec sans préciser indûment la forme de la rétribution.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: « Nations » maintient le sens ethnique et politique du grec dans ce contexte de lutte, sans réduire explicitement le terme à une catégorie religieuse.
- source_word: προσέχετε εἰς
  choice: soyez attentifs à
  rationale: L’expression rend l’appel à porter une attention soutenue, sans transformer directement cette nuance en un simple impératif d’exécution.
- source_word: προστάγματα
  choice: prescriptions
  rationale: « Prescriptions » désigne clairement les ordres ou dispositions normatives de la Loi, dans un registre digne et courant.
- source_word: τοῦ νόμου
  choice: de la Loi
  rationale: La majuscule indique naturellement en français qu’il s’agit ici de la Loi d’Israël, la Torah, plutôt que d’une loi quelconque.
theological_decisions:
- issue: Sens de τοῖς ἔθνεσιν
  choice: les nations
  alternative: les païens
  rationale: Le contexte vise les peuples non juifs hostiles, mais « nations » conserve aussi la dimension politique du terme et évite de résoudre plus étroitement sa portée.
- issue: Force de la construction ἀνταποδίδοτε ἀνταπόδομα
  choice: rendez… la pareille
  alternative: rendez aux nations leur rétribution
  rationale: La tournure choisie conserve l’idée de réponse en retour et la vigueur de l’exhortation sans imposer le sens exclusivement judiciaire ou punitif que pourrait suggérer « châtiment ».
translation_notes:
  register: Français international moderne, direct et digne. L’impératif pluriel est conservé. « La pareille » est idiomatique sans être familier; la note explicite la formulation grecque.
