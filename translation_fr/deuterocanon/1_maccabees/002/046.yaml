  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: fr
  text: Et ils circoncirent tous les garçons non circoncis qu’ils trouvèrent dans le territoire d’Israël[a], par la force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les régions d’Israël » ; littéralement, le terme peut aussi évoquer ses limites ou ses frontières.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec force » ou « avec puissance » ; ici, l’expression a un sens coercitif.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: ils circoncirent
  rationale: Aoriste actif de περιτέμνω, verbe usuel pour l’acte de circoncire. Le passé simple convient au registre narratif et dignifié.
- source_word: τὰ παιδάρια
  choice: les garçons
  rationale: παιδάριον peut désigner un enfant ou un jeune garçon. Dans le contexte de la circoncision, « garçons » identifie naturellement les personnes concernées sans préciser indûment leur âge.
- source_word: τὰ ἀπερίτμητα
  choice: non circoncis
  rationale: L’adjectif décrit directement l’état des garçons. « Non circoncis » est clair, précis et naturel en français moderne.
- source_word: ὅσα εὗρεν
  choice: tous … qu’ils trouvèrent
  rationale: 'Le relatif neutre pluriel ὅσα a ici une valeur globale : tous ceux qui furent trouvés. Malgré le singulier εὗρεν dans l’édition de Swete, le français accorde naturellement le verbe avec le sujet pluriel de l’action principale.'
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: dans le territoire d’Israël
  rationale: ὅρια peut désigner des limites, un territoire ou des régions. « Dans le territoire d’Israël » exprime clairement la portée géographique sans suggérer seulement une ligne frontalière.
- source_word: ἐν ἰσχύϊ
  choice: par la force
  rationale: Littéralement « avec force/puissance » ; dans ce contexte, la formule indique que la circoncision fut imposée. « Par la force » rend explicitement cette dimension coercitive.
theological_decisions:
- issue: Valeur morale et théologique de l’action rapportée
  choice: 'Décrire sans atténuation l’emploi de la contrainte : « par la force ».'
  alternative: « avec vigueur » ou « puissamment »
  rationale: Le contexte soutient une action coercitive. La traduction ne la justifie ni ne la condamne explicitement, mais évite d’en masquer la dureté.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient la tonalité historique. La formulation reste descriptive et ne résout pas la tension morale du recours à la force.
