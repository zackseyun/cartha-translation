  text: Why should we still live?[a]
translation:
  language: fr
  text: Pourquoi continuer à vivre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Pourquoi nous est-il encore de vivre ? » Le grec emploie une question idiomatique de lamentation ; le datif signifie littéralement « pour nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα τί
  choice: Pourquoi
  rationale: En grec koinè, ἵνα τί forme ici une interrogation idiomatique exprimant la raison ou le but. « Pourquoi » est naturel en français et convient au ton de lamentation.
- source_word: ἡμῖν
  choice: sous-entendu dans « continuer à vivre »
  rationale: Le datif signifie littéralement « pour nous », mais le français idiomatique n’a pas besoin d’exprimer séparément le pronom puisque les locuteurs sont déjà inclus par le contexte.
- source_word: ἔτι
  choice: continuer à
  rationale: ἔτι marque la persistance, « encore, toujours ». Avec ζῇν, « continuer à vivre » rend naturellement cette valeur aspectuelle et le désespoir de la question.
- source_word: ζῇν
  choice: vivre
  rationale: L’infinitif présent désigne le fait de vivre, avec ici l’idée contextuelle que cette vie se prolonge.
theological_decisions: []
translation_notes:
  register: Formulation française moderne, concise et digne. « Continuer à vivre » restitue plus naturellement l’association de ἔτι et ζῇν que le calque « vivre encore », tout en conservant la force lamentative et sans ajouter d’interprétation théologique.
