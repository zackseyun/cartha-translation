  text: Her sanctuary became like a man of honor;[a]
translation:
  language: fr
  text: Son sanctuaire est devenu comme un homme honoré[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Son temple est devenu comme un homme glorieux. » Le grec ναός peut se traduire par « temple » ou « sanctuaire », et ἔνδοξος par « honoré » ou « glorieux ».
    reason: Alternative lexicale préservant les deux sens possibles des termes grecs.
lexical_decisions:
- source_word: ἐγένετο
  choice: est devenu
  rationale: L’aoriste de γίνομαι exprime ici un changement d’état ; « est devenu » le rend naturellement en français.
- source_word: ὁ ναὸς
  choice: son sanctuaire
  rationale: ναός peut désigner le temple ou, plus précisément, le sanctuaire. « Sanctuaire » conserve ici la portée sacrée du terme sans l’étendre nécessairement à tout l’ensemble du Temple.
- source_word: αὐτῆς
  choice: son
  rationale: Le pronom féminin renvoie à Jérusalem personnifiée. En français, le possessif s’accorde avec « sanctuaire », mais le référent demeure la ville personnifiée.
- source_word: ὡς ἀνὴρ ἔνδοξος
  choice: comme un homme honoré
  rationale: Cette formulation conserve la comparaison masculine singulière et rend ἔνδοξος dans son sens de personne tenue en honneur, sans trancher en faveur de l’idée plus éclatante de gloire.
