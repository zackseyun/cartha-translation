  yaml_path: translation/deuterocanon/1_maccabees/002/036.yaml
  text: And they did not answer them[a], nor did they hurl a stone at them, nor did they block up the hiding places,
translation:
  language: fr
  text: Ils ne leur répondirent pas, ne leur lancèrent pas une seule pierre et n’obstruèrent pas les cachettes[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lieux cachés » ou « les endroits secrets ». L’expression grecque désigne probablement des lieux où se cacher plutôt que des personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ne leur répondirent pas
  rationale: Le verbe signifie couramment « répondre » ou « répliquer ». Le passé simple convient au registre narratif biblique moderne sans être archaïque.
- source_word: λίθον
  choice: une seule pierre
  rationale: 'Le singulier grec est conservé, et « une seule » rend naturellement en français la portée emphatique de la négation : ils ne lancèrent même pas une pierre.'
- source_word: ἐνετίναξαν
  choice: ne leur lancèrent pas
  rationale: Le verbe désigne ici l’action de jeter avec force. « Lancer » est naturel et suffisamment énergique dans ce contexte d’affrontement.
- source_word: ἐνέφραξαν
  choice: n’obstruèrent pas
  rationale: Le verbe peut signifier fermer, boucher ou barrer. « Obstruer » préserve l’idée d’empêcher l’accès sans préciser un moyen absent du grec.
- source_word: τοὺς κρυφούς
  choice: les cachettes
  rationale: L’adjectif substantivé désigne vraisemblablement des lieux cachés servant de refuges. « Les cachettes » exprime clairement ce sens spatial tout en maintenant une légère ambiguïté sur leur nature exacte.
