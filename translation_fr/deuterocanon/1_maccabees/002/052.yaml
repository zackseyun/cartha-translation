base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/052.yaml
  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
translation:
  language: fr
  text: Abraham n’a-t-il pas été trouvé fidèle dans l’épreuve[a], et cela ne lui a-t-il pas été compté comme justice[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la mise à l’épreuve ». Le terme grec peut aussi signifier « tentation », mais il désigne ici l’épreuve subie par Abraham.
    reason: lexical_alternative
  - marker: b
    text: Allusion à Genèse 15.6, rapprochée ici de l’épreuve d’Abraham.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom du patriarche.
- source_word: πειρασμῷ
  choice: dans l’épreuve
  rationale: πειρασμός peut désigner une épreuve, une mise à l’épreuve ou une tentation. Ici, le contexte évoque Abraham éprouvé plutôt qu’incité au mal; « dans l’épreuve » reste naturel tout en conservant la portée générale du terme.
- source_word: εὑρέθη πιστός
  choice: a été trouvé fidèle
  rationale: Cette traduction garde la forme passive et le jugement porté par πιστός, sans transformer explicitement l’expression en « s’est montré fidèle ».
- source_word: ἐλογίσθη αὐτῷ
  choice: cela lui a été compté
  rationale: La formulation conserve la métaphore de l’imputation ou de la mise au compte et fait écho à Genèse 15.6 sans développer une interprétation doctrinale.
- source_word: δικαιοσύνη
  choice: justice
  rationale: En français biblique moderne, « justice » est l’équivalent naturel de δικαιοσύνη dans la formule de Genèse 15.6; le terme garde ici sa portée relationnelle et déclarative.
theological_decisions:
- issue: Rapport entre l’épreuve d’Abraham et le fait que cela lui soit compté comme justice
  choice: Présenter les deux propositions dans une même question rhétorique, sans préciser leur chronologie ni définir leur relation théologique.
  alternative: Expliciter que la fidélité d’Abraham lors de l’épreuve lui aurait été comptée comme justice, ou distinguer expressément Genèse 22 de Genèse 15.6.
  rationale: Le grec rapproche l’épreuve d’Abraham et la formule de la justice comptée, mais n’explique pas comment les deux épisodes scripturaires s’articulent. La traduction préserve cette tension.
- issue: Référent implicite du sujet de ἐλογίσθη
  choice: « cela », qui reprend globalement le fait qu’Abraham a été trouvé fidèle.
  alternative: « sa foi », formulation tirée de Genèse 15.6 mais non exprimée dans ce verset grec.
  rationale: Le grec omet un sujet nominal explicite. « Cela » respecte cette ellipse et évite d’ajouter « sa foi » au texte.
- issue: Traduction de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » correspond à l’usage biblique français établi dans l’écho à Genèse 15.6 et évite de réduire le terme à une simple qualité morale personnelle.
translation_notes:
  register: Français international moderne, clair et digne. La construction interrogative conserve la rhétorique grecque; « a été trouvé fidèle » maintient volontairement la forme passive et « cela » préserve l’implicite du texte source.
