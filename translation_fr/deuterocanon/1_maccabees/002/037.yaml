base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/037.yaml
  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: fr
  text: 'en disant : « Mourons tous dans notre innocence[a] ! Le ciel et la terre témoignent à notre sujet que vous nous faites périr sans jugement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans notre simplicité » ou « dans notre sincérité ». Ici, le mot grec désigne probablement leur innocence et l'absence de duplicité.
    reason: lexical_alternative
  - marker: b
    text: Ou « injustement ». Littéralement, l'expression évoque une mise à mort sans examen ni jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit directement les paroles et se rend naturellement ainsi en français.
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: Mourons tous
  rationale: Le subjonctif aoriste à valeur exhortative appelle le groupe entier à accepter la mort.
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: dans notre innocence
  rationale: Dans ce contexte, ἁπλότης évoque surtout l'absence de faute et de duplicité, plutôt que la naïveté.
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: témoignent à notre sujet
  rationale: Cette formulation conserve prudemment la portée de ἐπί avec l'accusatif sans imposer que le témoignage soit explicitement « pour nous » ou « contre vous ».
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Le ciel et la terre
  rationale: Formule biblique consacrée et naturelle en français; le verbe est mis au pluriel conformément à l'usage français.
- source_word: ἀκρίτως
  choice: sans jugement
  rationale: Le rendu préserve directement la nuance judiciaire d'une mise à mort accomplie sans examen ni jugement, tout en laissant entendre son injustice.
- source_word: ἀπόλλυτε
  choice: vous nous faites périr
  rationale: Le présent et l'adresse directe sont conservés; « faire périr » exprime clairement l'issue mortelle tout en respectant la portée de ἀπόλλυμι.
theological_decisions:
- issue: Sens de ἁπλότης dans le contexte du martyre
  choice: innocence
  alternative: simplicité; sincérité; droiture
  rationale: Les locuteurs affirment leur absence de culpabilité face à ceux qui vont les tuer; « innocence » transmet cette portée morale sans construire une doctrine technique.
- issue: Orientation de μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: témoignent à notre sujet
  alternative: témoignent en notre faveur; témoignent contre vous à notre sujet
  rationale: La préposition permet une nuance contextuelle ou judiciaire qui n'est pas entièrement univoque. Le texte principal préserve cette tension au lieu de préciser silencieusement le camp auquel le témoignage est favorable.
- issue: Portée de ἀκρίτως
  choice: sans jugement
  alternative: injustement; sans procès; arbitrairement
  rationale: Le choix conserve la nuance procédurale immédiate du grec; la note explicite qu'elle implique aussi une injustice.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation exclamative rend la force de l'exhortation. « Sans jugement » garde la précision judiciaire du grec, tandis que les notes signalent les principales possibilités lexicales.
