  yaml_path: translation/deuterocanon/1_maccabees/002/053.yaml
  text: Joseph[a], in the time of his distress, kept the commandment, and became lord of Egypt.
translation:
  language: fr
  text: Joseph, au temps de sa détresse, observa un commandement[a] et devint maître de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commandement » ou « l’ordre » ; le grec ne précise pas de quel commandement il s’agit et peut résumer de manière générale l’obéissance de Joseph.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: au temps de sa détresse
  rationale: Cette tournure conserve la construction temporelle et le possessif du grec, dans un français naturel. « Détresse » exprime l’épreuve et la situation difficile sans préciser excessivement sa nature.
- source_word: ἐφύλαξε
  choice: observa
  rationale: Avec « commandement », « observer » rend idiomatiquement l’idée de garder fidèlement et de mettre en pratique.
- source_word: ἐντολήν
  choice: un commandement
  rationale: Le nom grec est singulier et sans article. « Un commandement » en conserve l’indétermination, tandis que la note signale les autres lectures françaises possibles sans identifier une prescription précise.
- source_word: ἐγένετο κύριος Αἰγύπτου
  choice: devint maître de l’Égypte
  rationale: « Devint » rend directement ἐγένετο. Dans ce contexte humain, « maître de l’Égypte » exprime l’autorité élevée de Joseph sans confondre κύριος avec le titre divin.
theological_decisions:
- issue: Objet précis de l’obéissance de Joseph
  choice: Conserver l’indétermination du grec avec « un commandement »
  alternative: « le commandement », compris comme une désignation générale de la volonté de Dieu, ou comme une allusion précise au refus de la femme de Potiphar
  rationale: Le grec ne précise pas de quel commandement il s’agit. La traduction ne réduit donc pas la déclaration au seul épisode de Genèse 39 et préserve l’ambiguïté du texte.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe brève suit le parallélisme du grec. « Maître de l’Égypte » conserve la force du titre humain sans employer ici « Seigneur », généralement associé au titre divin.
