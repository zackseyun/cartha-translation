  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: fr
  text: 'Ils dirent : « Nous ne sortirons pas et nous n’exécuterons pas l’ordre du roi, ce qui profanerait le jour du sabbat. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: nous ne sortirons pas
  rationale: Le futur de ἐξέρχομαι signifie « sortir ». Dans le contexte d’hommes sommés de quitter leur refuge, cette formulation est naturelle et fidèle.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: nous ne ferons pas ce qu’a ordonné le roi
  rationale: L’expression signifie littéralement « faire la parole du roi ». La formulation retenue conserve le verbe « faire » tout en exprimant clairement, en français courant, l’idée d’exécuter un ordre royal.
- source_word: βεβηλῶσαι
  choice: profaner
  rationale: Le verbe désigne le fait de traiter comme ordinaire ou impur ce qui est saint. « Profaner » maintient précisément ce registre religieux.
- source_word: ἡμέραν τῶν σαββάτων
  choice: le jour du sabbat
  rationale: Bien que σαββάτων soit formellement au pluriel, l’expression grecque désigne idiomatiquement le jour du sabbat au singulier.
theological_decisions:
- issue: Rapport entre l’ordre royal et la profanation du sabbat
  choice: car ce serait profaner le jour du sabbat
  alternative: pour profaner le jour du sabbat
  rationale: L’infinitif βεβηλῶσαι rattache la profanation à l’exécution de l’ordre royal, avec une nuance possible de but ou de conséquence. En français, « car ce serait » rend clairement le refus motivé par la sainteté du sabbat sans réduire la scène à une simple désobéissance civile.
translation_notes:
  register: Français moderne, international et digne. La syntaxe directe convient à une déclaration solennelle, tandis que « ce qu’a ordonné le roi » évite le calque peu naturel « faire la parole du roi ».
