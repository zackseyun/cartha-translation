  yaml_path: translation/deuterocanon/1_maccabees/002/065.yaml
  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: fr
  text: Et voici Siméon, votre frère. Je sais que c’est un homme de bon conseil. Écoutez-le tous les jours de votre vie ; il sera pour vous un père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: voici
  rationale: Marque naturellement l’attention en français moderne, dans un registre digne, sans l’archaïsme de « voici que ».
- source_word: Συμεών
  choice: Siméon
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ἀνὴρ βουλῆς
  choice: un homme de bon conseil
  rationale: Rend l’idée d’un homme capable de donner des avis sages et avisés, plutôt que le simple membre d’un conseil.
- source_word: αὐτοῦ ἀκούετε
  choice: Écoutez-le
  rationale: Dans ce contexte d’instructions et d’autorité familiale, le verbe implique de prêter attention à ses avis, sans devoir expliciter davantage.
- source_word: πάσας τὰς ἡμέρας
  choice: tous les jours de votre vie
  rationale: Expression française naturelle qui restitue la durée continue impliquée par le grec.
- source_word: εἰς πατέρα
  choice: pour vous un père
  rationale: Préserve directement la métaphore paternelle et la fonction que Siméon assumera envers eux.
theological_decisions:
- issue: Portée de l’autorité confiée à Siméon
  choice: Écoutez-le
  alternative: Obéissez-lui
  rationale: Le grec ἀκούετε signifie littéralement « écoutez » et peut impliquer l’obéissance, mais le texte ne contraint pas à expliciter cette nuance plus forte.
translation_notes:
  register: Français moderne international, clair et digne. La ponctuation répartit les propositions pour une lecture naturelle tout en conservant l’enchaînement exhortatif du grec.
