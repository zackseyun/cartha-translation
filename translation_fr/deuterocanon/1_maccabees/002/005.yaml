  text: Éléazar, appelé Avaran ; Jonathan, appelé Sapphous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins et certaines traductions donnent « Apphous » ou « Apphus ».
