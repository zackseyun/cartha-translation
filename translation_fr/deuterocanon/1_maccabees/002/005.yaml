lexical_decisions:
- source_word: Ἐλεαζὰρ
  choice: Éléazar
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec translittéré Eleazar.
- source_word: ὁ καλούμενος
  choice: appelé
  rationale: Rend naturellement et fidèlement la désignation par un surnom, sans alourdir par « qui était appelé ».
- source_word: Αὐαράν
  choice: Avaran
  rationale: Translittération usuelle correspondant directement à la forme grecque.
- source_word: Ἰωνάθας
  choice: Jonathan
  rationale: Forme française traditionnelle du nom biblique.
- source_word: Σαφφούς
  choice: Sapphous
  rationale: Translittération directe de la leçon grecque fournie, plutôt que « Apphus », qui suppose une autre tradition textuelle ou une altération de la forme.
