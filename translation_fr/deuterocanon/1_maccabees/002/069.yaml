  text: And he blessed them[a], and was gathered to his fathers.
translation:
  language: fr
  text: Puis il les bénit et rejoignit ses pères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fut ajouté à ses pères » ; expression traditionnelle évoquant la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλόγησεν
  choice: bénit
  rationale: Dans ce contexte, l’aoriste de εὐλογέω désigne la bénédiction prononcée par Mattathias sur ceux qui étaient présents. « Bénit » est naturel, digne et précis.
- source_word: προσετέθη
  choice: rejoignit
  rationale: Le passif de προστίθημι signifie littéralement « fut ajouté ». Dans cette formule traditionnelle évoquant la mort, « rejoignit » rend naturellement le mouvement exprimé sans réduire la phrase à une simple mention du décès.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: ses pères
  rationale: « Ses pères » conserve l’expression biblique traditionnelle et sa résonance, tout en laissant intacte l’ambiguïté sur ce qu’implique le fait de les rejoindre.
theological_decisions:
- issue: Formule de mort προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: rejoignit ses pères
  alternative: fut ajouté à ses pères
  rationale: La traduction principale garde l’image traditionnelle tout en restant idiomatique en français moderne. Elle ne remplace pas la formule par « mourut », ce qui imposerait une explicitation et effacerait sa portée scripturaire.
translation_notes:
  register: Français moderne international, simple et digne. La coordination et la brièveté de la phrase grecque sont conservées ; la formule biblique relative aux ancêtres demeure visible.
