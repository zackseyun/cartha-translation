  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: fr
  text: 'Et voici : nos choses saintes, notre beauté et notre gloire ont été dévastées, et les nations les ont profanées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Interjection naturelle et digne qui attire vivement l’attention sans alourdir la phrase.
- source_word: τὰ ἅγια ἡμῶν
  choice: ce qui nous est saint
  rationale: Le neutre pluriel peut désigner les choses ou les lieux saints; cette formulation française conserve cette amplitude.
- source_word: ἡ καλλονὴ ἡμῶν
  choice: notre beauté
  rationale: Rend directement καλλονή et préserve le langage poétique de la lamentation.
- source_word: ἡ δόξα ἡμῶν
  choice: notre gloire
  rationale: Équivalent usuel et contextuellement approprié de δόξα.
- source_word: ἠρημώθη
  choice: tout a été dévasté
  rationale: Le singulier grec récapitule vraisemblablement les éléments coordonnés; «tout» produit une syntaxe française claire tout en conservant l’idée de ruine.
- source_word: ἔθνη
  choice: les nations
  rationale: Rend le pluriel grec sans préciser arbitrairement «païens» ou «étrangers».
- source_word: ἐβεβήλωσαν αὐτὰ
  choice: l’ont profané
  rationale: Le pronom français reprend collectivement «ce qui nous est saint, notre beauté et notre gloire»; «profané» restitue le sens cultuel de βεβηλόω.
theological_decisions:
- issue: Référent de τὰ ἅγια
  choice: ce qui nous est saint
  alternative: notre sanctuaire / nos choses saintes
  rationale: Le grec demeure assez large; la traduction évite de réduire sans nécessité le référent au seul sanctuaire.
- issue: Valeur de ἔθνη
  choice: les nations
  alternative: les païens
  rationale: «Les nations» préserve la désignation grecque et n’ajoute pas explicitement une qualification religieuse.
translation_notes:
  register: Français moderne, international et soutenu, avec une cadence de lamentation. La ponctuation après «voici» marque l’appel à constater le désastre; aucune note n’est nécessaire.
