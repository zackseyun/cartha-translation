base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: fr
  text: 'Un homme dit à son prochain : « Si nous faisons tous comme nos frères l’ont fait et que nous ne combattons pas les nations[a] pour défendre notre vie et nos droits[b], elles nous feront bientôt disparaître du pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les païens » ou « les peuples non juifs ». Le grec signifie littéralement « les nations » et désigne ici les peuples non juifs opposés aux Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos prescriptions », « nos lois » ou « nos revendications légitimes ». Le terme grec peut désigner des règles établies aussi bien que des droits reconnus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
  choice: Un homme dit à son prochain
  rationale: Cette formulation conserve le singulier du grec et le sens de πλησίον, « personne proche, prochain », sans transformer explicitement la phrase en un échange collectif.
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: nos frères
  rationale: Le masculin pluriel renvoie aux membres du peuple mentionnés dans le contexte précédent; « frères » garde cette désignation concrète.
- source_word: πολεμήσωμεν εἰς τὰ ἔθνη
  choice: nous ne combattons pas les nations
  rationale: « Combattre » exprime naturellement l’affrontement armé. « Les nations » conserve le terme grec et son emploi juif traditionnel pour les peuples non juifs, explicité en note.
- source_word: ὑπὲρ τῆς ψυχῆς ἡμῶν
  choice: pour défendre notre vie
  rationale: ψυχή désigne ici la vie menacée, non l’âme comme réalité abstraite. L’ajout idiomatique de « défendre » rend la valeur de ὑπέρ dans ce contexte de combat.
- source_word: τῶν δικαιωμάτων ἡμῶν
  choice: nos droits
  rationale: Le mot peut désigner les droits, prescriptions ou règles reconnues de la communauté. « Nos droits » est clair en français moderne, tandis que la note maintient l’éventail juridique et normatif.
- source_word: νῦν τάχιον
  choice: bientôt
  rationale: Dans l’avertissement, l’expression souligne l’imminence ou la rapidité du désastre. « Bientôt » est naturel et évite un « maintenant plus vite » obscur en français.
- source_word: ὀλεθρεύσουσιν ἀπὸ τῆς γῆς
  choice: elles nous feront bientôt disparaître du pays
  rationale: La tournure exprime une destruction qui retranche le groupe de son territoire. « Pays » rend γῆ selon le contexte territorial plutôt que cosmique.
theological_decisions:
- issue: Identité des τὰ ἔθνη dans le contexte de la résistance juive
  choice: les nations
  alternative: les païens / les peuples non juifs
  rationale: « Les nations » garde le terme traditionnel et la forme du grec sans réduire le mot à une qualification religieuse. Une note précise qu’il désigne ici les peuples non juifs hostiles.
- issue: Portée de δικαιωμάτων
  choice: nos droits
  alternative: nos prescriptions / nos lois / nos revendications légitimes
  rationale: Le contexte permet d’entendre aussi bien les droits reconnus du peuple que ses prescriptions ancestrales. Le texte principal privilégie une expression moderne, et la note préserve l’ambiguïté juridique et religieuse.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec tout en employant des formulations idiomatiques; les ambiguïtés de « nations » et de δικαιώματα sont conservées par des notes.
