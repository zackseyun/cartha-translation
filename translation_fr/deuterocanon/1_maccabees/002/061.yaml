  yaml_path: translation/deuterocanon/1_maccabees/002/061.yaml
  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: fr
  text: Ainsi, considérez, de génération en génération, que tous ceux qui espèrent en lui ne faibliront pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « ne seront pas faibles » ; le grec peut aussi avoir le sens plus large de « ne défailliront pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: prenez conscience
  rationale: L’impératif aoriste pluriel appelle les auditeurs à reconnaître et à intérioriser la leçon de l’histoire. « Prenez conscience » est naturel en français moderne et conserve la force exhortative; « considérez » serait également possible.
- source_word: κατὰ γενεὰν
  choice: de génération en génération
  rationale: Cette tournure rend naturellement la portée historique et successive de l’expression grecque.
- source_word: ἐλπίζοντες
  choice: espèrent
  rationale: « Espérer » correspond directement à ἐλπίζω et conserve ici l’idée d’une attente confiante sans la réduire au seul sens de « faire confiance ».
- source_word: ἐπʼ αὐτόν
  choice: en lui
  rationale: Avec « espérer », « en lui » est idiomatique en français et maintient le pronom grec; le contexte désigne Dieu.
- source_word: ἀσθενήσουσιν
  choice: ne faibliront pas
  rationale: « Faiblir » exprime le sens verbal futur de devenir ou se montrer faible, tout en laissant ouverte la portée plus large possible de « défaillir ».
theological_decisions:
- issue: Référent de αὐτόν (« lui »)
  choice: Dieu est le référent implicite, mais le pronom « lui » est conservé.
  alternative: Expliciter « Dieu » dans le corps du texte.
  rationale: Le contexte immédiat renvoie à la fidélité de Dieu envers les ancêtres. Garder le pronom respecte toutefois la forme du grec et évite une explicitation inutile.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’exhortation collective, la perspective des générations successives et l’ambiguïté relative de ἀσθενέω.
