  source_fidelity: 'Le texte rend fidèlement la progression grecque : perception, zèle, agitation intérieure, manifestation de colère « conformément au jugement », puis action rapide et violente sur l’autel. « Fut saisi de zèle » exprime correctement ἐζήλωσεν sans le réduire à la jalousie. « Jusqu’au plus profond de lui-même » est une équivalence idiomatique recevable pour l’image des « reins », que la note restitue explicitement. « Donner libre cours à sa colère » explicite légèrement l’expression ἀνήνεγκεν θυμόν, mais demeure compatible avec son sens contextuel et n’impose pas une lecture doctrinale du jugement.'
