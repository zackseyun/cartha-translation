  yaml_path: translation/deuterocanon/1_maccabees/002/024.yaml
  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: fr
  text: 'Mattathias vit cela et fut saisi de zèle. Jusqu’au plus profond de lui-même[a], il trembla, puis il donna libre cours à sa colère conformément au jugement[b] : il courut égorger cet homme sur l’autel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses reins tremblèrent ». Dans cette expression de style hébraïque, les reins représentent le siège des émotions profondes.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « comme le jugement l’exigeait »; le terme grec peut aussi désigner une décision, une sentence ou une prescription.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: fut saisi de zèle
  rationale: Exprime un zèle indigné plutôt que la jalousie, tout en conservant le motif du zèle pour la Loi.
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: jusqu’au plus profond de lui-même
  rationale: Rend naturellement l’expression sémitisante littérale « ses reins », qui désigne le siège des émotions profondes; la note conserve l’image corporelle grecque.
- source_word: ἀνήνεγκεν θυμόν
  choice: il donna libre cours à sa colère
  rationale: Formulation française naturelle pour la manifestation extérieure et soudaine de la colère, sans réduire θυμός à une simple irritation.
- source_word: κατὰ τὸ κρίμα
  choice: conformément au jugement
  rationale: Conserve la portée judiciaire de κρίμα et laisse ouverte la référence précise à une décision, une sentence ou une prescription.
- source_word: δραμὼν
  choice: il courut
  rationale: Restitue directement la rapidité de l’action exprimée par le participe aoriste.
- source_word: ἔσφαξεν
  choice: égorger
  rationale: Préserve la violence de σφάζω ainsi que sa possible résonance sacrificielle, particulièrement marquée par la présence de l’autel.
- source_word: ἐπὶ τὸν βωμόν
  choice: sur l’autel
  rationale: Rend explicitement le lieu choquant de la mise à mort et correspond au mouvement ou à la position indiqués par ἐπί avec l’accusatif dans ce contexte.
theological_decisions:
- issue: Préservation de l’allusion au zèle d’alliance et à l’exécution judiciaire
  choice: Maintenir les termes « zèle », « jugement » et « égorger » sans atténuer ni expliciter davantage l’acte.
  alternative: Traduire de manière interprétative par « il entra dans une grande colère » ou « il l’exécuta conformément à la Loi ».
  rationale: Le grec présente l’acte de Mattathias sous le signe du zèle et du jugement, avec de possibles échos au récit de Phinéas. La traduction conserve cette tension narrative et théologique sans identifier explicitement le jugement à la Loi ni approuver ou condamner l’acte.
translation_notes:
  register: Français international moderne, digne et narratif. La coordination grecque répétitive est légèrement restructurée pour obtenir une phrase naturelle, tandis que la succession rapide de la perception, de l’émotion et de l’action reste nette. Les deux marqueurs de note [a] et [b] figurent dans le texte.
