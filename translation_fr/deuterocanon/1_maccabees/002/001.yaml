  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: fr
  text: En ces jours-là, Mattathias, fils de Jean, fils de Siméon, prêtre de la famille de Joarib, se leva, venant de Jérusalem, et s’établit à Modéïn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « se leva de Jérusalem ». La relation exacte entre « de Jérusalem » et « se leva » est elliptique; l’expression peut évoquer son origine ou son départ de la ville.'
    reason: Préserve en français l’ambiguïté syntaxique de ἀπὸ Ἱερουσαλήμ sans adopter un calque peu naturel dans le texte courant.
lexical_decisions:
- source_word: ἀνέστη
  choice: se leva
  rationale: Conserve le sens premier et la portée narrative du verbe, sans le réduire à un simple déplacement.
- source_word: ἱερεὺς τῶν υἱῶν Ἰωαρίβ
  choice: prêtre issu des descendants de Joarib
  rationale: Exprime naturellement en français l’appartenance à la lignée sacerdotale de Joarib.
- source_word: ἀπὸ Ἱερουσαλήμ
  choice: quitta Jérusalem
  rationale: Avec le verbe de mouvement ἀνέστη et la destination indiquée ensuite, ἀπό marque ici le point de départ.
- source_word: ἐκάθισεν
  choice: s’établit
  rationale: Dans ce contexte résidentiel, le verbe signifie qu’il alla demeurer à Modéïn plutôt qu’il s’assit simplement.
- source_word: Μωδεείν
  choice: Modéïn
  rationale: Transcription française claire du nom grec, avec le tréma signalant que les deux voyelles se prononcent séparément.
