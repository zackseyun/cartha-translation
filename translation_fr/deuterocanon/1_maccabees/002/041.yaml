  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: fr
  text: 'Ce jour-là, ils prirent cette décision : « Si quelqu’un vient nous attaquer le jour du sabbat, nous combattrons contre lui et nous ne mourrons certainement pas tous comme nos frères sont morts dans les cachettes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: ils prirent cette décision
  rationale: Rend naturellement en français la délibération suivie d’une résolution commune.
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: Si quelqu’un vient
  rationale: La construction grecque a une valeur conditionnelle générale; cette formulation française est naturelle et inclusive sans surtraduire.
- source_word: εἰς πόλεμον
  choice: nous attaquer
  rationale: Dans ce contexte, venir « pour le combat » signifie engager les hostilités contre eux.
- source_word: ἐν τοῖς κρυφοῖς
  choice: dans les cachettes
  rationale: Conserve le sens concret et pluriel des lieux cachés où les frères avaient trouvé refuge.
theological_decisions:
- issue: Combat défensif le jour du sabbat
  choice: « Si quelqu’un vient nous attaquer le jour du sabbat, nous combattrons contre lui »
  alternative: « Quiconque viendra nous faire la guerre le jour du sabbat, nous lui ferons la guerre »
  rationale: La traduction maintient la décision de riposter à une attaque sans élargir le propos à une permission générale de combattre le jour du sabbat.
- issue: Négation emphatique οὐ μὴ
  choice: « nous ne mourrons certainement pas tous »
  alternative: « nous ne mourrons pas tous »
  rationale: « certainement pas » préserve l’emphase grecque sans transformer la déclaration en affirmation d’invulnérabilité individuelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe directe convient à une décision collective solennelle; aucun archaïsme ni marque confessionnelle n’a été ajouté.
