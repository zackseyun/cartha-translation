  yaml_path: translation/deuterocanon/1_maccabees/002/032.yaml
  text: And many ran after them[a], and when they caught up with them, they encamped against them and joined battle with them on the Sabbath day.
translation:
  language: fr
  text: Beaucoup se lancèrent à leur poursuite. Quand ils les eurent rattrapés, ils établirent leur camp face à eux et engagèrent le combat avec eux le jour du sabbat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « le jour des sabbats », expression idiomatique désignant le jour du sabbat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  choice: se lancèrent à leur poursuite
  rationale: L’expression décrit une poursuite. Cette formulation française conserve le mouvement vif du verbe ἔδραμον tout en étant plus naturelle que le calque « coururent derrière eux ».
- source_word: πολλοί
  choice: Beaucoup
  rationale: Rendu quantitatif simple et direct ; le référent humain est clair dans le contexte.
- source_word: καταλαβόντες αὐτούς
  choice: Quand ils les eurent rattrapés
  rationale: Dans le contexte d’une poursuite, καταλαμβάνω signifie atteindre ou rattraper, sans impliquer nécessairement une capture.
- source_word: παρενέβαλον ἐπʼ αὐτούς
  choice: ils établirent leur camp face à eux
  rationale: Le verbe a ici son sens militaire d’établir un camp. « Face à eux » exprime la position hostile sans laisser croire que l’attaque elle-même est déjà désignée par ce premier verbe.
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  choice: engagèrent le combat avec eux
  rationale: La tournure grecque indique l’ouverture d’une action militaire contre le groupe rejoint. « Engagèrent le combat » convient mieux à cette rencontre immédiate que le plus large « firent la guerre ».
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: le jour du sabbat
  rationale: La forme grecque littéralement plurielle appartient à une expression idiomatique désignant le jour du sabbat ; le singulier est naturel et exact en français.
theological_decisions:
- issue: Interprétation de σαββάτων dans l’expression calendaire juive
  choice: le jour du sabbat
  alternative: le jour des sabbats
  rationale: Le pluriel grec reflète une tournure idiomatique et ne désigne pas ici plusieurs sabbats. Le singulier français transmet clairement le sens tout en conservant la référence juive au sabbat.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre historique ; les formulations restent accessibles et évitent aussi bien les calques grecs que le jargon militaire inutile.
