  yaml_path: translation/deuterocanon/1_maccabees/002/050.yaml
  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: fr
  text: Et maintenant, mes enfants, soyez pleins de zèle pour la Loi et donnez votre vie pour l’alliance de nos pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: mes enfants
  rationale: Le vocatif pluriel est une adresse familiale. En français, l’ajout naturel de « mes » explicite la relation du locuteur sans limiter le terme aux fils, même si ceux-ci constituent l’auditoire immédiat.
- source_word: ζηλώσατε τῷ νόμῳ
  choice: soyez pleins de zèle pour la Loi
  rationale: L’impératif appelle à un engagement ardent. Cette formulation française actuelle conserve l’intensité religieuse de ζηλόω; la majuscule indique ici la Torah ancestrale.
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: donnez votre vie
  rationale: Dans cet appel au sacrifice, ψυχαί désigne la vie de chacun plutôt que l’âme immatérielle. Le singulier distributif « votre vie » est idiomatique en français.
- source_word: ὑπὲρ διαθήκης
  choice: pour l’alliance
  rationale: ὑπέρ exprime ici la cause défendue, avec une implication de sacrifice; « pour » reste concis et naturel sans surinterpréter.
- source_word: πατέρων ἡμῶν
  choice: de nos pères
  rationale: La formulation conserve le langage ancestral explicitement masculin du grec et sa portée covenantale.
theological_decisions:
- issue: Portée de ψυχή dans un contexte d’exhortation au sacrifice
  choice: vie
  alternative: âme
  rationale: Le contexte vise le don de la vie pour défendre l’alliance; « âme » risquerait d’introduire une distinction anthropologique que le passage n’exige pas.
- issue: Langage ancestral de πατέρων ἡμῶν
  choice: de nos pères
  alternative: de nos ancêtres
  rationale: « Nos pères » reproduit l’expression masculine et covenantale du texte, tandis que « nos ancêtres » la neutraliserait.
- issue: Référence de νόμος
  choice: la Loi
  alternative: la loi
  rationale: Dans le contexte maccabéen, le terme désigne la Torah ancestrale; la majuscule française rend ce référent précis sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme exhortatif est conservé, avec un vocabulaire biblique intelligible. Aucune note n’est nécessaire, car les principales nuances du grec sont rendues sans ambiguïté trompeuse.
