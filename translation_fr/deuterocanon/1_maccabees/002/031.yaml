review_pass:
  verdict: revise
  source_fidelity: La construction grecque διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως prend explicitement « l’ordre du roi » comme complément. « S’étaient dispersés à cause de l’ordre » transforme ce complément en cause et ajoute une relation causale qui n’est pas exprimée. Dans ce contexte, « avaient désobéi à l’ordre du roi » rend de façon idiomatique le sens contextuel probable, tout en signalant en note la difficulté lexicale et l’autre possibilité.
  naturalness: La révision emploie une syntaxe narrative française claire. « Troupes » est plus idiomatique que « forces » pour des unités militaires, et « lieux cachés du désert » conserve le caractère non spécifié des cachettes.
  terminology: « Hommes du roi » maintient l’indétermination de ἄνδρες; « troupes » rend δυνάμεις sans imposer une structure militaire précise; « ordre » rend bien ἐντολή. La note préserve l’ambiguïté de la formulation grecque.
  issues:
