base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: fr
  text: On rapporta aux hommes du roi et aux troupes qui se trouvaient à Jérusalem, la ville de David, que des hommes qui avaient désobéi à l’ordre du roi[a] étaient descendus dans les lieux cachés du désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est difficile : le verbe signifie ordinairement « disperser », mais « l’ordre du roi » en est ici le complément. On peut aussi comprendre : « qui s’étaient dispersés à cause de l’ordre du roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: On rapporta
  rationale: La tournure impersonnelle française rend naturellement le passif aoriste employé comme formule de transmission d’une nouvelle.
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: aux hommes du roi
  rationale: Cette expression reste proche du grec et ne précise pas indûment s’il s’agit d’officiers, de soldats ou d’autres agents royaux.
- source_word: ταῖς δυνάμεσιν
  choice: aux forces
  rationale: Dans ce contexte militaire, « forces » conserve la portée collective et assez large du pluriel grec.
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: à Jérusalem, la ville de David
  rationale: L’apposition identifie naturellement Jérusalem comme la ville de David tout en conservant les deux désignations du texte grec.
- source_word: κατέβησαν
  choice: étaient descendus
  rationale: Le plus-que-parfait situe cette action avant le moment où la nouvelle fut rapportée et conserve l’idée de descente.
- source_word: διεσκέδασαν
  choice: s’étaient dispersés à cause de
  rationale: Le verbe signifie normalement « disperser » ou « se disperser ». Cette formulation préserve ce sens lexical tout en explicitant de manière idiomatique le rapport difficile avec « l’ordre du roi ».
- source_word: τὴν ἐντολὴν τοῦ βασιλέως
  choice: l’ordre du roi
  rationale: « Ordre » rend clairement ἐντολή dans ce contexte de directive royale.
- source_word: εἰς τοὺς κρυφοὺς
  choice: dans les lieux cachés
  rationale: Le grec emploie un adjectif substantivé désignant des endroits dissimulés ; « lieux cachés » en conserve la forme et le sens sans les réduire nécessairement à des abris aménagés.
- source_word: ἐν τῇ ἐρήμῳ
  choice: du désert
  rationale: « Désert » est naturel en français biblique moderne et désigne ici une région inhabitée, sans imposer qu’elle soit sablonneuse.
theological_decisions:
- issue: Interprétation de διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως
  choice: Les hommes s’étaient dispersés à cause de l’ordre du roi.
  alternative: Les hommes avaient transgressé ou rejeté l’ordre du roi.
  rationale: 'La construction grecque est comprimée et inhabituelle : διεσκέδασαν signifie ordinairement « dispersèrent », mais prend ici pour complément direct « l’ordre du roi ». Le texte principal conserve le sens lexical usuel du verbe et le contexte de fuite, tandis que la note maintient ouverte l’interprétation selon laquelle ces hommes avaient désobéi à l’ordre.'
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure accessible, tout en conservant les termes généraux du grec et son ambiguïté centrale.
