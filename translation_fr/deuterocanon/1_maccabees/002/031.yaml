    issue: Relation causale ajoutée dans « s’étaient dispersés à cause de l’ordre du roi »
    rationale: Le grec associe directement διεσκέδασαν à τὴν ἐντολὴν; il ne comporte pas d’expression équivalente à « à cause de ». Cette formulation ne conserve donc pas la syntaxe ni l’ambiguïté du texte source.
  - severity: low
    issue: « Aux forces » est moins naturel en français courant pour δυνάμεις dans ce contexte
    rationale: « Aux troupes » est une désignation militaire collective plus idiomatique tout en restant aussi large que le grec.
