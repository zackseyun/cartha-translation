- from: On rapporta aux hommes du roi et aux forces qui se trouvaient à Jérusalem, la ville de David, que des hommes qui s’étaient dispersés à cause de l’ordre du roi[a] étaient descendus dans les lieux cachés du désert.
  to: On rapporta aux hommes du roi et aux troupes qui se trouvaient à Jérusalem, la ville de David, que des hommes qui avaient désobéi à l’ordre du roi[a] étaient descendus dans les lieux cachés du désert.
  rationale: La révision évite d’insérer dans le texte principal une causalité absente du grec et rend le sens contextuel le plus probable d’une construction elliptique ou inhabituelle. La note expose sans la résoudre l’ambiguïté lexicale et syntaxique, y compris la lecture qui conserve le sens usuel de « disperser ».
