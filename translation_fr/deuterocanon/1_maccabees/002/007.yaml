base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: fr
  text: 'Et il dit : « Malheur à moi ! Pourquoi suis-je né pour voir les ruines[a] de mon peuple et la ruine de la ville sainte, et pour rester là, assis, tandis qu’elle était livrée aux mains d’ennemis[b], et le sanctuaire aux mains d’étrangers ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dévastation de mon peuple ». Le grec emploie ici un pluriel qui peut souligner l’ampleur des ravages.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans la main des ennemis […] dans la main d’étrangers » : expression biblique signifiant qu’on est livré à leur pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  choice: Malheur à moi !
  rationale: Cette interjection exprime une lamentation personnelle intense. La formule reste digne et immédiatement compréhensible en français moderne.
- source_word: ἵνα τί τοῦτο ἐγενήθην
  choice: Pourquoi suis-je né
  rationale: Dans cette plainte, ἐγενήθην (« je suis venu à l’existence ») se rend naturellement par « je suis né »; τοῦτο n’a pas besoin d’être traduit séparément en français.
- source_word: τὰ συντρίμματα τοῦ λαοῦ μου
  choice: les ruines de mon peuple
  rationale: Le pluriel grec évoque les effets étendus de la dévastation. « Les ruines » conserve cette pluralité et l’image d’un peuple brisé, sans réduire le sens à de simples décombres matériels.
- source_word: τὸ σύντριμμα τῆς πόλεως τῆς ἁγίας
  choice: la ruine de la ville sainte
  rationale: Le singulier parallèle désigne l’état de destruction de la ville. « Ville sainte » traduit directement l’expression grecque sans ajouter explicitement le nom de Jérusalem.
- source_word: καθίσαι ἐκεῖ
  choice: rester là, assis
  rationale: La formulation préserve l’image concrète de Mattathias assis sur place et son impuissance douloureuse; « rester » exprime naturellement la valeur contextuelle de καθίσαι.
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: tandis qu’elle était livrée
  rationale: La construction avec l’infinitif articulé indique une circonstance contemporaine. Le passif grec est conservé, et le pronom féminin renvoie à la ville.
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: aux mains de ses ennemis
  rationale: « Aux mains de » rend en français naturel l’idiome biblique signifiant « sous le pouvoir de ». Le possessif clarifie que les ennemis sont ceux de la ville ou de son peuple sans modifier le sens.
- source_word: τὸ ἁγίασμα
  choice: le sanctuaire
  rationale: Le terme désigne le lieu consacré, distinct de la ville dans son ensemble. « Sanctuaire » est précis, courant et traditionnel sans être confessionnellement marqué.
- source_word: ἐν χειρὶ ἀλλοτρίων
  choice: aux mains d’étrangers
  rationale: ἀλλότριοι désigne ici des personnes étrangères au peuple et au sanctuaire. « Étrangers » conserve cette opposition sans introduire une qualification théologique supplémentaire.
theological_decisions:
- issue: Portée nationale et religieuse de la lamentation
  choice: Conserver « mon peuple », « la ville sainte » et « le sanctuaire » sans explicitation
  alternative: Remplacer ces expressions par « ma nation », « Jérusalem » et « le Temple »
  rationale: Le grec emploie des termes chargés de sens collectif et sacré, mais ne nomme ni Jérusalem ni le Temple dans ce verset. La traduction maintient donc leur portée théologique tout en évitant une précision ajoutée.
- issue: Image de la remise au pouvoir des ennemis
  choice: Maintenir l’idiome « aux mains de »
  alternative: Expliciter par « sous le pouvoir de »
  rationale: L’image de la main appartient au langage biblique de la domination et de la remise au pouvoir d’autrui. La tournure française demeure intelligible, et une note en précise la valeur.
translation_notes:
  register: Français international moderne, digne et soutenu sans archaïsme inutile. Le rythme de la longue lamentation et le parallélisme entre le peuple, la ville sainte et le sanctuaire sont conservés. Les reprises elliptiques du grec restent lisibles en français.
