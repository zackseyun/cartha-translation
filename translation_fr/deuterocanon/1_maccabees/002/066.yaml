  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: fr
  text: Judas Maccabée lui-même, fort et puissant depuis sa jeunesse,[a] sera votre chef militaire, et vous ferez la guerre aux nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis porte littéralement, de façon maladroite, une expression proche de « fort en puissance, de lui, depuis sa jeunesse ». Le segment « de lui » est difficile; la traduction en rend le sens apparent : Judas est fort depuis sa jeunesse.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas Maccabée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom et de l’épithète grecs.
- source_word: ἰσχυρὸς δυνάμει
  choice: puissant
  rationale: Le français « puissant » exprime naturellement la force soulignée par la tournure grecque intensive, sans produire le pléonasme peu idiomatique « fort en puissance ».
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: depuis sa jeunesse
  rationale: Cette formulation restitue le sens apparent de la proposition tout en signalant en note l’expression grecque transmise, difficile et probablement altérée.
- source_word: ἄρχοντα στρατιᾶς
  choice: le chef de votre armée
  rationale: Dans ce contexte militaire, ἄρχων désigne celui qui commande; le possessif découle naturellement de ὑμῖν et donne un français clair.
- source_word: πολεμήσετε πόλεμον
  choice: vous combattrez
  rationale: Le grec emploie une construction à verbe et nom apparentés, littéralement « vous combattrez un combat/une guerre ». Le verbe français seul en rend naturellement l’action.
- source_word: λαῶν
  choice: les nations
  rationale: « Les nations » conserve la portée collective de λαῶν sans introduire la coloration religieuse plus marquée de « les païens ».
theological_decisions:
- issue: Interprétation de la leçon difficile ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: Rendre le sens apparent « depuis sa jeunesse » et documenter la difficulté en note.
  alternative: Traduire littéralement « puissant par lui, depuis sa jeunesse » ou « puissant venant de lui, depuis sa jeunesse ».
  rationale: Le premier groupe ἐκ αὐτοῦ est syntaxiquement difficile dans le texte transmis. L’intégrer littéralement rendrait la phrase obscure et pourrait suggérer sans fondement un agent extérieur. La note préserve la donnée textuelle et son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur conserve la désignation solennelle de Judas par Mattathias; la syntaxe reste directe et accessible.
