  text: David[a], because of his mercy, inherited the throne of an everlasting kingdom.
translation:
  language: fr
  text: David[a], à cause de sa miséricorde, hérita du trône d’un royaume éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « David, par la miséricorde de Dieu, hérita du trône d’un royaume éternel. » Le possessif grec traduit par « sa » peut renvoyer à Dieu plutôt qu’à David.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δαυεὶδ
  choice: David
  rationale: Forme française usuelle du nom propre biblique.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: à cause de sa miséricorde
  rationale: ἐν avec le datif peut ici exprimer la cause ou le moyen. Cette formulation française naturelle conserve le possessif ambigu du grec, tout en le rattachant dans le texte principal à David, son antécédent immédiat.
- source_word: ἐκληρονόμησεν
  choice: hérita
  rationale: Le verbe κληρονομέω signifie recevoir ou posséder en héritage. « Hérita » préserve la nuance dynastique de l’expression.
- source_word: θρόνον
  choice: le trône
  rationale: L’article défini convient au trône royal reconnu qui est associé à David.
- source_word: βασιλείας αἰωνίας
  choice: d’un royaume éternel
  rationale: « Royaume » rend naturellement βασιλεία dans ce contexte royal, tandis qu’« éternel » exprime le caractère durable et perpétuel indiqué par αἰωνίας.
theological_decisions:
- issue: Référent de αὐτοῦ dans ἐν τῷ ἐλέει αὐτοῦ
  choice: 'Dans le texte principal, le possessif renvoie à David : « à cause de sa miséricorde ».'
  alternative: « par la miséricorde de Dieu »
  rationale: L’antécédent grammatical immédiat est David, et le passage évoque les qualités remarquables de plusieurs figures exemplaires. Toutefois, un renvoi à la miséricorde divine reste possible dans l’idiome biblique ; cette ambiguïté réelle est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle ; « hérita du trône » conserve la portée dynastique, et la note préserve l’ambiguïté théologique du possessif.
