base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/048.yaml
  text: And they rescued the law from the hand of the nations and from the hand of the kings[a], and they did not give a horn to the sinner.
translation:
  language: fr
  text: Ils ont arraché la Loi aux mains des nations et des rois, et ils n’ont pas donné de pouvoir au pécheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils n’ont pas donné de corne au pécheur ». La « corne » est une image biblique de la force, de la puissance ou de l’élévation.'
    reason: Explication de la métaphore et conservation du libellé littéral grec.
lexical_decisions:
- source_word: ἀντελάβοντο
  choice: ont arraché
  rationale: Le moyen de ἀντιλαμβάνομαι peut exprimer le fait de prendre en main pour soutenir, secourir ou délivrer. Avec la Loi comme objet et les nations et les rois comme puissances auxquelles elle est soustraite, « ont arraché » rend naturellement l’idée d’une délivrance active.
- source_word: τοῦ νόμου
  choice: la Loi
  rationale: Dans le contexte maccabéen, νόμος désigne la Loi juive, la Torah. La majuscule française signale ce référent religieux précis sans ajouter de contenu doctrinal.
- source_word: ἐκ χειρὸς τῶν ἐθνῶν καὶ ἐκ χειρὸς τῶν βασιλέων
  choice: aux mains des nations et des rois
  rationale: « Aux mains de » conserve l’image concrète de la main comme pouvoir ou emprise. La répétition grecque de ἐκ χειρός peut être allégée en français sans perte de sens, puisque les deux compléments dépendent clairement du même tour.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: ἐθνῶν signifie littéralement « nations » et désigne ici les peuples non juifs. Ce choix préserve le lexique du texte sans imposer les termes plus interprétatifs « païens » ou « Gentils ».
- source_word: τῶν βασιλέων
  choice: des rois
  rationale: βασιλέων signifie directement « rois » ; le contexte ne justifie pas de généraliser en « dirigeants ».
- source_word: οὐκ ἔδωκαν κέρας
  choice: ils n’ont pas donné de corne
  rationale: κέρας signifie littéralement « corne » et fonctionne comme image biblique de la force, de la puissance ou de l’élévation. L’image est maintenue dans le texte, avec une explication en note.
- source_word: τῷ ἁμαρτωλῷ
  choice: au pécheur
  rationale: Le datif singulier désigne littéralement « le pécheur ». Cette traduction reste plus proche du grec que « au méchant », tout en laissant ouverte l’identité précise du personnage visé.
theological_decisions:
- issue: Valeur métaphorique de la « corne » dans la dernière proposition
  choice: 'Conserver l’image littérale : « ils n’ont pas donné de corne au pécheur »'
  alternative: « ils n’ont pas donné de force au pécheur » ou « ils n’ont pas laissé le pécheur prendre le pouvoir »
  rationale: La corne est une image biblique établie de force, de puissance ou d’élévation. La conserver maintient la texture intertextuelle et l’ambiguïté de l’image grecque ; la note en explicite les principaux sens possibles sans en imposer un seul.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « arracher aux mains de » est naturelle tout en conservant l’image de l’emprise. L’expression inhabituelle « donner de corne » est délibérément maintenue pour préserver la métaphore biblique, puis éclairée par une note.
