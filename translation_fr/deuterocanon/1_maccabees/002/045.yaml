translation:
  language: fr
  text: Mattathias et ses fils allèrent de lieu en lieu et démolirent leurs autels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: parcoururent la région
  rationale: Le verbe exprime l’idée d’aller alentour ou de faire le tour. Dans ce contexte, cette formulation naturelle évoque une action menée de lieu en lieu, sans suggérer un siège militaire. Le singulier grec avec sujet composé peut se rendre idiomatiquement par le pluriel en français.
- source_word: καθεῖλον
  choice: démolirent
  rationale: Le verbe signifie abattre ou mettre à bas une construction. « Démolirent » convient à la destruction matérielle des autels.
- source_word: βωμοὺς
  choice: autels
  rationale: βωμός désigne normalement un autel. « Hauts lieux » introduirait une notion cultuelle différente, absente du grec.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le possessif renvoie naturellement au groupe adverse évoqué dans le contexte, tout en laissant son référent exact aussi implicite que dans le grec.
- source_word: Ματταθίας
  choice: Mattathias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
theological_decisions:
- issue: Référent cultuel des autels détruits
  choice: les autels appartenant au groupe adverse ou associés à son culte
  alternative: les autels en général
  rationale: Le possessif αὐτῶν et le contexte indiquent qu’il ne s’agit pas indistinctement de tous les autels. La traduction « leurs autels » conserve cette précision sans expliciter davantage l’identité du groupe.
translation_notes:
  register: Français international moderne, narratif et digne. « Parcoururent la région » privilégie une expression fluide de l’action itinérante; « démolirent » garde la force concrète du geste.
