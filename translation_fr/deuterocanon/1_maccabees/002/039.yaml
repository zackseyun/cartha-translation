  text: And Mattathias and his friends learned of it, and they mourned for them very greatly.
translation:
  language: fr
  text: Mattathias et ses amis l’apprirent et les pleurèrent amèrement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprirent
  rationale: L’aoriste de γινώσκω exprime ici le fait d’apprendre l’événement rapporté juste avant; le pronom « l’ » reprend naturellement cette nouvelle en français.
- source_word: οἱ φίλοι αὐτοῦ
  choice: ses amis
  rationale: φίλοι désigne les amis ou proches associés de Mattathias; « ses amis » en est le rendu direct et naturel.
- source_word: ἐπένθησαν
  choice: menèrent … un deuil
  rationale: Le verbe désigne le deuil provoqué par une mort. Cette tournure française conserve cette valeur précise plutôt qu’un chagrin plus général.
- source_word: ἐπʼ αὐτούς
  choice: pour eux
  rationale: Avec le verbe de deuil, ἐπί suivi de l’accusatif indique les personnes dont on porte le deuil.
- source_word: ἕως σφόδρα
  choice: un très grand deuil
  rationale: L’expression marque une forte intensité. L’adjectif appliqué à « deuil » donne en français moderne une formulation naturelle tout en préservant cette insistance.
