  text: Elijah[a], in his zeal for the law, was taken up into heaven.
translation:
  language: fr
  text: Élie, dans son zèle pour la Loi, fut enlevé comme vers le ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme vers le ciel ». Le grec contient « comme » (ὡς), qui peut atténuer l’expression ou en caractériser la manière, plutôt que d’indiquer simplement une destination.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom grec Ἠλίας.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: dans son zèle
  rationale: L’infinitif articulé avec ἐν exprime ici la circonstance, tandis que l’accusatif de même racine renforce l’idée de zèle. Cette formulation française naturelle conserve l’accent sans reproduire maladroitement la répétition grecque.
- source_word: νόμου
  choice: pour la Loi
  rationale: Dans le contexte maccabéen, νόμος désigne la Loi juive, la Torah; la majuscule rend ce référent précis explicite.
- source_word: ἀνελήμφθη
  choice: fut enlevé
  rationale: L’aoriste passif de ἀναλαμβάνω indique qu’Élie fut emporté vers le haut; « fut enlevé » est idiomatique et convient au registre narratif.
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: comme au ciel
  rationale: « Comme » représente explicitement ὡς et préserve la nuance comparative ou caractérisante de la formule, sans la réduire à une simple destination.
theological_decisions:
- issue: Valeur de ὡς dans l’évocation de l’enlèvement d’Élie
  choice: Conserver explicitement la nuance avec « comme au ciel »
  alternative: « au ciel » ou « jusqu’au ciel »
  rationale: Le grec place ὡς devant εἰς τὸν οὐρανόν. Le conserver évite de transformer silencieusement la formulation en affirmation de destination plus catégorique.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient à la série d’exemples solennels du discours. La formulation évite un calque lourd du complément interne ζηλῶσαι ζῆλον tout en conservant son intensité.
