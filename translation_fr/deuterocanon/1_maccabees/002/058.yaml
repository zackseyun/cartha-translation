    issue: « comme au ciel » omet la valeur directionnelle de εἰς.
    rationale: La préposition εἰς marque un mouvement vers/à l’intérieur d’un terme. Avec ὡς, la formule doit conserver sa qualification sans transformer l’expression en simple localisation; « comme vers le ciel » le fait de façon transparente.
