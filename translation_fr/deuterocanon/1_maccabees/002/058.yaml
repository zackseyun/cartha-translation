  verdict: revise
  source_fidelity: Le nom, « la Loi », le passif « fut enlevé » et la circonstance exprimée par « dans son zèle » rendent correctement le grec. Toutefois, « comme au ciel » ne rend pas adéquatement εἰς (« vers/dans, en direction de ») et peut en français suggérer un état ou un lieu plutôt qu’un mouvement. « Comme vers le ciel » conserve à la fois la direction et la réserve portée par ὡς.
  naturalness: Le français est globalement fluide, solennel et adapté au contexte. « Comme vers le ciel » est moins usuel que « au ciel », mais cette légère littéralité est justifiée ici afin de ne pas effacer la nuance du grec; la note en explicite la raison.
  terminology: « Élie » est la forme française usuelle; « la Loi » identifie naturellement νόμος comme la Torah dans ce contexte. « Zèle » et « fut enlevé » conviennent au registre et au sens.
  issues:
