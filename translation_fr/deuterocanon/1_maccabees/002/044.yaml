base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: fr
  text: Ils se joignirent à eux et devinrent pour eux un appui.[a] Ils constituèrent une force et frappèrent les pécheurs dans leur colère, ainsi que les hommes sans loi dans leur fureur. Les autres s’enfuirent chez les nations pour se sauver.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent ajoutés à leur groupe ». Le verbe grec présente formellement leur intégration du point de vue du groupe qui les reçoit.
    reason: lexical_alternative
  - marker: b
    text: Ici, « les nations » désigne probablement les peuples non juifs des alentours ou leurs territoires; on pourrait aussi traduire « les païens » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: se joignirent
  rationale: Le passif de προστίθημι exprime ici l’intégration à un groupe. « Se joignirent » est naturel en français tout en conservant l’idée d’accession.
- source_word: εἰς στήριγμα
  choice: pour eux un appui
  rationale: στήριγμα désigne ce qui soutient ou affermit. « Un appui » garde ce sens concret sans imposer une image militaire absente du terme.
- source_word: συνεστήσαντο δύναμιν
  choice: constituèrent une force
  rationale: L’expression décrit l’organisation d’une puissance combattante. « Constituèrent une force » reste concise et n’explicite pas indûment « armée ».
- source_word: ἐπάταξαν
  choice: frappèrent
  rationale: πατάσσω signifie frapper et peut impliquer une mise à mort en contexte guerrier. « Frappèrent » préserve la force du verbe sans rendre explicite une conséquence seulement implicite.
- source_word: ἁμαρτωλούς
  choice: les pécheurs
  rationale: Le terme porte un jugement moral et religieux explicite, conservé directement en français.
- source_word: ἐν ὀργῇ αὐτῶν
  choice: dans leur colère
  rationale: Cette formulation reproduit la construction grecque et permet de distinguer ὀργή de θυμός dans le membre parallèle.
- source_word: ἄνδρας ἀνόμους
  choice: les hommes sans loi
  rationale: ἄνδρας est explicitement masculin et ἀνόμους signifie privés de loi ou opposés à celle-ci. « Hommes sans loi » préserve ces deux éléments.
- source_word: ἐν θυμῷ αὐτῶν
  choice: dans leur fureur
  rationale: θυμός évoque ici une colère ardente. « Fureur » maintient le parallélisme avec « colère » tout en donnant au second terme sa vigueur propre.
- source_word: οἱ λοιποί
  choice: les autres
  rationale: Dans le contexte, il s’agit de ceux du camp adverse qui n’ont pas été frappés. « Les autres » est plus idiomatique que « le reste » pour des personnes.
- source_word: εἰς τὰ ἔθνη
  choice: chez les nations
  rationale: ἔθνη désigne ici les peuples non juifs environnants ou leurs territoires. « Chez les nations » conserve le terme collectif et rend naturellement le déplacement vers leur milieu.
- source_word: σωθῆναι
  choice: pour se sauver
  rationale: L’infinitif passif exprime le but de la fuite, à savoir trouver le salut ou échapper au danger. La tournure pronominale est idiomatique en français.
theological_decisions:
- issue: Les qualificatifs moraux dans un contexte militaire
  choice: Conserver « les pécheurs » et « les hommes sans loi » comme catégories évaluatives propres au récit.
  alternative: « les malfaiteurs » et « les hors-la-loi »
  rationale: Le grec présente le conflit en termes moraux et religieux, et non seulement politiques ou juridiques. La traduction ne doit ni atténuer ni approuver séparément ce jugement narratif.
- issue: Le genre grammatical de ἄνδρας
  choice: Employer « hommes » plutôt qu’un nom épicène.
  alternative: « personnes » ou « gens »
  rationale: Le texte source emploie un substantif explicitement masculin; la traduction en conserve la précision.
- issue: La portée de σωθῆναι
  choice: Traduire le salut concret recherché par les fuyards par « pour se sauver ».
  alternative: « afin d’être sauvés »
  rationale: Dans ce contexte de fuite, le verbe vise d’abord la délivrance physique. La formulation ne lui impose pas une portée sotériologique technique.
translation_notes:
  register: Français international moderne, sobre et narratif. Le parallélisme « colère / fureur » et les catégories morales du grec sont maintenus. La ponctuation sépare clairement la fuite finale, et les deux appels de note [a] et [b] figurent dans le texte.
