  yaml_path: translation/deuterocanon/1_maccabees/002/064.yaml
  text: And you, children, be strong and act like men in your law, because in it you will be glorified.
translation:
  language: fr
  text: Et vous, enfants, soyez forts et montrez-vous des hommes[a] dans votre Loi, car c’est en elle que vous serez glorifiés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « soyez courageux ». Le grec emploie littéralement une image masculine : « montrez-vous des hommes ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vous serez honorés » ou « vous acquerrez de la gloire ».
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  choice: mes enfants
  rationale: Le grec signifie « enfants ». Dans cette adresse paternelle de Mattathias, « mes enfants » est naturel en français et explicite sans en changer le référent.
- source_word: ἰσχύετε
  choice: soyez forts
  rationale: L’impératif présent appelle à la force et à la fermeté; « soyez forts » en conserve directement la portée exhortative.
- source_word: ἀνδρίζεσθε
  choice: comportez-vous en hommes
  rationale: Le verbe évoque littéralement le fait de se montrer homme et, idiomatiquement, d’agir avec courage. La formulation retenue préserve l’image masculine explicite du grec, tandis que la note en indique le sens idiomatique.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: dans votre Loi
  rationale: La préposition ἐν présente la Loi comme le domaine dans lequel ils doivent manifester force et courage. La majuscule signale ici la Loi ancestrale d’Israël, et le possessif explicite ὑμῶν est conservé.
- source_word: ἐν αὐτῷ
  choice: par elle
  rationale: Bien que ἐν puisse littéralement se rendre par « en elle », le contexte permet un sens instrumental ou fondant la promesse. « Par elle » est plus naturel en français tout en maintenant le lien explicite avec la Loi.
- source_word: δοξασθήσεσθε
  choice: vous serez glorifiés
  rationale: Le futur passif est rendu directement. « Glorifiés » conserve le lien lexical avec la gloire et ne précise ni l’agent ni la nature exacte de cette glorification.
theological_decisions:
- issue: Image masculine de ἀνδρίζεσθε
  choice: comportez-vous en hommes
  alternative: soyez courageux
  rationale: Le grec emploie une image explicitement masculine. Le texte principal la conserve plutôt que de la neutraliser, et la note donne le sens idiomatique possible.
- issue: Portée de δοξασθήσεσθε
  choice: vous serez glorifiés
  alternative: vous serez honorés / vous acquerrez de la gloire
  rationale: Le texte ne nomme pas l’agent de la glorification et n’en définit pas la forme. La traduction garde cette indétermination et la tension théologique du passif.
- issue: Valeur de ἐν αὐτῷ
  choice: par elle
  alternative: en elle
  rationale: Le syntagme peut être compris comme indiquant le moyen ou la sphère. « Par elle » donne une phrase française naturelle sans préciser davantage comment la Loi conduit à la glorification; l’alternative littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et exhortatif. « Loi » prend la majuscule puisqu’il s’agit de la Loi ancestrale d’Israël. La tournure « comportez-vous en hommes » est volontairement marquée afin de préserver l’image du grec; la note fournit l’équivalent idiomatique courant.
