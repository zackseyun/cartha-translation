- from: Et vous, mes enfants, soyez forts et comportez-vous en hommes[a] dans votre Loi, car c’est par elle que vous serez glorifiés[b].
  to: Et vous, enfants, soyez forts et montrez-vous des hommes[a] dans votre Loi, car c’est en elle que vous serez glorifiés[b].
