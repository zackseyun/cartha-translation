review_pass:
  verdict: revise
  source_fidelity: Le texte grec porte « τέκνα » sans possessif ; « mes enfants » ajoute donc « mes », même si le contexte en fait bien les enfants de Mattathias. « ἐν αὐτῷ » correspond le plus directement à « en elle » et désigne la sphère de la Loi ; « par elle » impose une nuance instrumentale qui n’est pas nécessaire. Les impératifs et le futur passif sont autrement bien rendus.
  naturalness: « Comportez-vous en hommes » est compréhensible mais un peu pesant en français contemporain. « Montrez-vous des hommes » conserve l’image masculine explicite et a une valeur exhortative plus naturelle dans ce registre. La phrase révisée reste digne et claire.
  terminology: « Loi » avec majuscule convient au contexte de la Loi d’Israël. « Soyez forts », « montrez-vous des hommes » et « vous serez glorifiés » préservent respectivement la force impérative, l’imagerie masculine et le passif non spécifié du grec.
  issues:
  - severity: medium
    issue: Ajout du possessif « mes » dans « mes enfants »
    rationale: τέκνα signifie « enfants » et ne comporte aucun possessif. Le contexte justifie l’adresse paternelle, mais la traduction ne doit pas expliciter cet élément absent du verset.
  - severity: medium
    issue: « Par elle » pour ἐν αὐτῷ
    rationale: La préposition ἐν est ici rendue avec plus de sûreté par « en elle », qui conserve la relation de sphère avec la Loi sans privilégier une lecture instrumentale.
  - severity: low
    issue: Formulation principale de ἀνδρίζεσθε
    rationale: « Comportez-vous en hommes » est possible, mais « montrez-vous des hommes » restitue plus idiomatiquement en français l’image rhétorique masculine du verbe grec.
