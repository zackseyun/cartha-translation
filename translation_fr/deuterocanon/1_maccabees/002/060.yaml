  text: Daniel[a], in his simplicity, was rescued from the mouth of lions.
translation:
  language: fr
  text: Daniel[a], grâce à son intégrité, fut arraché à la gueule des lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à sa simplicité » ou « grâce à sa sincérité ». Le grec peut désigner la simplicité, la sincérité ou l’absence de duplicité, aussi bien que l’intégrité morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forme française traditionnelle et usuelle du nom propre.
- source_word: ἐν τῇ ἁπλότητι αὐτοῦ
  choice: grâce à son intégrité
  rationale: Dans ce contexte élogieux, ἁπλότης désigne la droiture et l’absence de duplicité plutôt que la naïveté. « Grâce à » exprime naturellement ici la circonstance fondant la délivrance, sans rendre explicite un agent que le grec laisse sous-entendu.
- source_word: ἐρύσθη
  choice: fut arraché
  rationale: L’aoriste passif exprime une délivrance concrète hors d’un péril. « Fut arraché » restitue avec force ce sauvetage sans lui imposer une portée sotériologique générale.
- source_word: ἐκ στόματος λεόντων
  choice: à la gueule des lions
  rationale: Cette tournure française naturelle conserve l’image vive du singulier grec στόματος associé au pluriel λεόντων.
theological_decisions:
- issue: Sens de ἁπλότης dans l’évocation exemplaire de Daniel
  choice: intégrité
  alternative: simplicité ; sincérité ; entière fidélité
  rationale: « Intégrité » rend la droiture et l’unité morale suggérées par le terme dans ce contexte, sans faire de Daniel un homme naïf ni préciser davantage la nature de sa fidélité.
- issue: Agent de la délivrance exprimée par ἐρύσθη
  choice: Maintenir le passif sans nommer l’agent
  alternative: Dieu le délivra
  rationale: Le grec ne nomme pas explicitement l’agent. Le passif français préserve cette retenue tout en laissant naturellement entendre l’action divine dans le contexte.
translation_notes:
  register: Français international moderne, concis et digne. Le passé simple convient à cette série de rappels historiques. « Gueule » est le terme courant et précis pour la bouche d’un lion, sans registre familier ici.
