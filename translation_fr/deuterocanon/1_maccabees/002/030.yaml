translation:
  language: fr
  text: eux, leurs fils, leurs femmes et leur bétail, car les malheurs s’étaient appesantis sur eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: eux
  rationale: Le pronom reprend les personnes mentionnées dans le contexte précédent; « eux » convient à ce fragment de phrase sans ajouter une emphase artificielle.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: leurs fils
  rationale: υἱοί désigne précisément les fils, et non les enfants en général.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: leurs femmes
  rationale: Dans cette liste familiale, γυναῖκες avec le possessif désigne naturellement leurs épouses; « leurs femmes » est courant en français international.
- source_word: τὰ κτήνη αὐτῶν
  choice: leur bétail
  rationale: κτήνη désigne collectivement les animaux domestiques possédés; « bétail » est naturel et suffisamment large.
- source_word: ἐσκληρύνθη ἐπʼ αὐτοὺς
  choice: s’étaient abattus durement sur eux
  rationale: La tournure rend idiomatiquement l’idée que les malheurs étaient devenus accablants, tout en conservant l’image de maux venant sur eux.
- source_word: τὰ κακά
  choice: les malheurs
  rationale: Dans ce contexte, le neutre pluriel désigne les épreuves, calamités ou circonstances pénibles plutôt que le mal moral abstrait.
