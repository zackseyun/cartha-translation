  text: And they hastened to make war against them[a].
translation:
  language: fr
  text: Et ils se hâtèrent de leur faire la guerre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ils s’empressèrent de leur faire la guerre » ou « ils lancèrent une attaque contre eux ». Le grec est concis : littéralement, « ils hâtèrent la guerre contre eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάχυναν
  choice: se hâtèrent
  rationale: L’aoriste de ταχύνω exprime ici l’empressement ou la rapidité de l’action. « Se hâtèrent » en conserve la force verbale sans préciser indûment la manœuvre militaire.
- source_word: πόλεμον
  choice: faire la guerre
  rationale: πόλεμον signifie littéralement « guerre ». La locution française naturelle « faire la guerre » restitue le tour grec condensé tout en gardant ce contenu lexical.
- source_word: ἐπʼ αὐτούς
  choice: leur
  rationale: Dans un contexte d’hostilité, ἐπί avec l’accusatif marque l’action dirigée contre eux. Avec « faire la guerre », le français idiomatique emploie « leur ».
