base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/019.yaml
  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
translation:
  language: fr
  text: 'Mattathias répondit d’une voix forte : « Même si toutes les nations du royaume du roi[a] l’écoutent[b], chacune abandonnant le culte de ses ancêtres et ayant choisi ses commandements, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la maison du royaume du roi » ; l’expression grecque, inhabituelle, peut désigner le domaine ou le territoire du roi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lui obéissent ». Le grec dit plus littéralement « l’écoutent », mais le contexte implique l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Expression française naturelle qui conserve l’image concrète et la vigueur narrative du grec.
- source_word: ἔθνη
  choice: nations
  rationale: Le terme désigne ici les différents peuples soumis au pouvoir royal; « nations » reste direct et n’introduit pas la connotation plus particulière de « païens ».
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: du royaume du roi
  rationale: Cette formulation garde la répétition inhabituelle de βασιλείας et βασιλέως tout en évitant un calque presque inintelligible de οἴκῳ; la note signale la texture littérale et l’autre sens possible.
- source_word: ἀκούουσιν αὐτοῦ
  choice: l’écoutent
  rationale: Le verbe signifie littéralement entendre ou écouter. Le contexte implique l’obéissance, mais la traduction ne rend pas cette implication plus explicite que le grec.
- source_word: ἀποστῆναι
  choice: abandonnant
  rationale: Dans ce contexte, le verbe exprime le fait de se détourner de la pratique religieuse ancestrale; « abandonnant » est clair sans employer le terme théologiquement plus technique « apostasier ».
- source_word: λατρίας πατέρων αὐτοῦ
  choice: le culte de ses ancêtres
  rationale: λατρεία désigne ici le service cultuel ou religieux. « Ancêtres » exprime naturellement la dimension ancestrale de πατέρων dans ce contexte collectif.
- source_word: ᾑρετίσαντο
  choice: choisissant
  rationale: Le verbe exprime le choix ou la préférence. Le participe français coordonné à « abandonnant » rend la relation logique du passage plus lisible malgré le changement de construction dans le grec.
- source_word: ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: ses commandements
  rationale: ἐντολαί désigne des ordres faisant autorité. « Commandements » conserve ce registre solennel, même lorsqu’il s’agit ici des prescriptions du roi.
theological_decisions:
- issue: Degré de littéralité pour οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: du royaume du roi
  alternative: dans la maison du royaume du roi; dans le domaine du roi
  rationale: Le grec est inhabituel et peut évoquer la maison, le domaine ou le territoire royal. Le texte principal conserve la répétition « royaume du roi », tandis que la note rend visible le calque et l’interprétation plus idiomatique.
- issue: Valeur de ἀκούουσιν αὐτοῦ
  choice: l’écoutent
  alternative: lui obéissent
  rationale: L’obéissance est nettement impliquée par le contexte, mais le verbe grec est celui de l’écoute. La traduction maintient cette distinction sans exclure la portée d’obéissance.
- issue: Nature de la rupture exprimée par ἀποστῆναι ἀπὸ λατρίας
  choice: abandonnant le culte
  alternative: se détournant du culte; reniant le culte
  rationale: « Abandonnant » exprime une rupture religieuse réelle sans importer un vocabulaire confessionnel ou technique absent du texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase demeure ouverte par une virgule finale parce que le discours conditionnel se poursuit au verset suivant. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
