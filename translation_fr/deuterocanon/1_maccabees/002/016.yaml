  text: to the city[a], so that they might offer sacrifice. And many from Israel came over to them[b], and Mattathias and his sons were gathered together.
translation:
  language: fr
  text: vers la ville[a], afin d’y offrir des sacrifices. Beaucoup d’Israélites se rendirent auprès d’eux[b], et Mattathias et ses fils furent rassemblés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’extrait grec fourni commence au milieu d’une phrase : « vers la ville » poursuit la proposition précédente et ne constitue pas à lui seul une phrase complète.'
    reason: textual_variant
  - marker: b
    text: Ou « se rallièrent à eux » ou « passèrent de leur côté ». Le grec dit littéralement qu’ils « s’approchèrent d’eux » ; dans ce contexte, cela peut impliquer qu’ils se rangèrent à leur parti.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν πόλιν
  choice: dans la ville
  rationale: L’accusatif dépend du mouvement exprimé dans la proposition précédente, absente de l’extrait fourni. « Dans la ville » restitue naturellement en français la destination sans tenter de reconstruire le début de la phrase.
- source_word: ἵνα θυσιάσωσιν
  choice: afin d’y offrir des sacrifices
  rationale: ἵνα avec le subjonctif exprime le but. « Offrir des sacrifices » rend clairement le sens cultuel de θυσιάζω; « y » rattache naturellement l’action à la ville en français.
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: beaucoup de gens d’Israël
  rationale: Cette formulation conserve l’idée d’origine ou d’appartenance exprimée par ἀπό, tout en restant naturelle et sans préciser davantage l’identité du groupe.
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: se rendirent auprès d’eux
  rationale: Le grec décrit un mouvement vers ces personnes et peut, dans ce contexte, suggérer un ralliement. La formulation française maintient cette possibilité sans l’expliciter indûment.
- source_word: συνήχθησαν
  choice: se rassemblèrent
  rationale: Bien que la forme grecque soit passive, elle peut exprimer le fait de se réunir. « Se rassemblèrent » est idiomatique et évite de suggérer sans fondement qu’un agent extérieur les aurait convoqués.
theological_decisions:
- issue: L’alignement politico-religieux suggéré par πρὸς αὐτοὺς προσῆλθαν
  choice: se rendirent auprès d’eux
  alternative: se rallièrent à eux
  rationale: Le contexte peut laisser entendre que ces Israélites prennent le parti des agents royaux, mais le verbe grec exprime directement leur approche plutôt qu’une adhésion formelle. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère fragmentaire du témoin fourni et l’ambiguïté entre simple déplacement et ralliement.
