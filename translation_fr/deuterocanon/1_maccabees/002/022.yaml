  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
translation:
  language: fr
  text: Nous n’obéirons pas à la loi du roi[a] en nous détournant de notre culte, ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous n’écouterons pas la loi du roi. » Le verbe grec peut signifier « écouter » ou, dans ce contexte, « obéir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: nous n’obéirons pas
  rationale: Avec νόμον comme complément, ἀκούω peut exprimer non seulement l’écoute, mais l’obéissance. « Obéir » rend clairement la portée pratique du refus.
- source_word: νόμον
  choice: la loi
  rationale: « Loi » traduit directement νόμος et conserve la tension explicite entre la loi imposée par le roi et la fidélité cultuelle d’Israël, sans réduire d’emblée le terme à un décret ponctuel.
- source_word: παρελθεῖν
  choice: en nous détournant
  rationale: Cette formulation exprime l’idée de quitter la voie prescrite et maintient la métaphore directionnelle développée par « ni à droite ni à gauche ».
- source_word: λατρίαν
  choice: notre culte
  rationale: Dans ce contexte, λατρεία désigne le service religieux rendu à Dieu. « Culte » est précis, naturel et plus englobant que le seul acte d’adoration.
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: ni à droite ni à gauche
  rationale: Cette tournure française naturelle préserve l’image biblique d’un écart dans l’une ou l’autre direction.
theological_decisions:
- issue: Portée de « la loi du roi »
  choice: Conserver « la loi du roi » dans le texte
  alternative: le décret du roi / l’ordre du roi
  rationale: Le grec porte νόμος, « loi ». Le rendre directement préserve le contraste entre l’autorité royale et la fidélité au culte, sans décider que le mot ne désigne ici qu’un décret ponctuel.
- issue: Relation syntaxique de παρελθεῖν avec le refus d’obéir
  choice: « en nous détournant »
  alternative: « pour nous détourner » / « au point de nous détourner »
  rationale: L’infinitif grec est concis et sa relation exacte avec ἀκουσόμεθα reste légèrement ouverte. La formulation choisie rend l’idée de l’obéissance qui entraînerait un écart, sans développer excessivement le lien logique.
translation_notes:
  register: Français international moderne, sobre et digne. « Culte » garde la dimension religieuse de λατρεία; « ni à droite ni à gauche » conserve l’idiome biblique sans archaïsme.
