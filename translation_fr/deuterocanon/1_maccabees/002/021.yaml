  text: Far be it from us to abandon the law and the ordinances[a].
translation:
  language: fr
  text: Loin de nous l’idée d’abandonner la Loi et les prescriptions[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Que Dieu nous en préserve : abandonner la Loi et les prescriptions ! » Le grec emploie un idiome de rejet catégorique : « Loin de nous cette idée ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: Loin de nous l’idée de
  rationale: Cette tournure française naturelle rend l’idiome grec de rejet énergique, plutôt qu’un appel littéral à la clémence.
- source_word: καταλεῖπειν
  choice: abandonner
  rationale: Le verbe exprime ici le fait de délaisser délibérément les obligations de l’alliance ; « abandonner » en restitue clairement la gravité.
- source_word: νόμον
  choice: la Loi
  rationale: Dans ce contexte juif, le nom désigne l’ensemble reconnu de l’enseignement légal d’Israël ; la majuscule signale ce référent particulier sans ajouter de précision doctrinale.
- source_word: δικαιώματα
  choice: ses prescriptions
  rationale: Le terme désigne des dispositions ou exigences établies. Le possessif explicite en français leur lien avec la Loi sans les réduire à une catégorie particulière.
theological_decisions:
- issue: Portée alliancielle de νόμον καὶ δικαιώματα
  choice: « la Loi et ses prescriptions »
  alternative: « la Loi et les ordonnances »
  rationale: Le rendu conserve la référence à la tradition légale de l’alliance d’Israël et la forte déclaration de fidélité, sans importer de catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, digne et direct. L’exclamation restitue la vigueur du refus grec. « Prescriptions » est plus courant aujourd’hui qu’« ordonnances » dans ce sens légal.
