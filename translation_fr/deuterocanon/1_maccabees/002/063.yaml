base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: fr
  text: Aujourd’hui, il sera élevé[a], et on ne le trouvera pas du tout, car il est retourné à sa poussière, et sa pensée[b] a péri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut évoquer le fait d’être élevé ou de gagner en importance.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi désigner son raisonnement ou son projet.
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Aujourd’hui
  rationale: Rend directement l’adverbe temporel et conserve l’immédiateté ainsi que la tournure proverbiale.
- source_word: ἐπαρθήσεται
  choice: il sera élevé
  rationale: Conserve la forme passive et l’image d’élévation, qui peut évoquer aussi bien une position élevée qu’une importance accrue, sans trancher davantage.
- source_word: οὐ μὴ εὑρεθῇ
  choice: on ne le trouvera absolument plus
  rationale: La tournure française impersonnelle est naturelle, tandis que « absolument plus » restitue la négation grecque fortement emphatique.
- source_word: ἐπέστρεψεν
  choice: il est retourné
  rationale: Le passé composé exprime naturellement en français un retour accompli dont la conséquence présente est qu’il ne peut plus être trouvé.
- source_word: εἰς τὸν χοῦν αὐτοῦ
  choice: à sa poussière
  rationale: « Poussière » rend χοῦς et préserve l’écho traditionnel de la mortalité et du retour de l’être humain à la poussière.
- source_word: ὁ διαλογισμὸς αὐτοῦ
  choice: sa pensée
  rationale: Le singulier collectif « pensée » conserve la largeur sémantique du grec, qui peut désigner la réflexion, le raisonnement ou le projet.
- source_word: ἀπώλετο
  choice: a péri
  rationale: Rend sobrement la disparition définitive exprimée par ἀπόλλυμι et maintient la force abrupte de la dernière proposition.
theological_decisions:
- issue: Portée anthropologique de διαλογισμός au moment de la mort
  choice: sa pensée a péri
  alternative: ses projets ont disparu
  rationale: Le texte affirme la disparition de la pensée, du raisonnement ou du dessein de cet homme, sans employer un terme signifiant « âme » et sans formuler une doctrine complète sur l’état de la personne après la mort. Le singulier et l’ambiguïté du grec sont donc conservés.
- issue: Sens de l’élévation exprimée par ἐπαρθήσεται
  choice: il sera élevé
  alternative: il sera exalté
  rationale: « Élevé » maintient l’image spatiale et permet aussi la lecture figurée d’une promotion ou d’une mise en vue, sans imposer une nuance honorifique ou théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le parallélisme abrupt du grec tout en employant une tournure idiomatique pour sa négation emphatique. Les formulations « sa poussière » et « sa pensée a péri » sont volontairement légèrement marquées afin de préserver les images et l’ambiguïté de la source.
