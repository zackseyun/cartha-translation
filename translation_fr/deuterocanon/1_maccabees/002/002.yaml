lexical_decisions:
- source_word: καὶ αὐτῷ
  choice: Il avait
  rationale: La construction au datif exprime ici la possession. En français courant, « il avait » est plus naturel que le calque « à lui étaient ». La conjonction καί n’est pas rendue séparément, car « Et il avait » serait moins fluide dans ce fragment énumératif.
- source_word: υἱοὶ πέντε
  choice: cinq fils
  rationale: Traduction directe, précise et idiomatique du groupe nominal grec.
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et naturelle du nom grec Ἰωάννης dans les textes bibliques.
- source_word: ὁ ἐπικαλούμενος
  choice: appelé
  rationale: Le participe introduit un surnom ou un nom supplémentaire. « Appelé » reste proche du grec tout en étant fluide en français moderne.
- source_word: Γαδδίς
  choice: Gaddis
  rationale: Le nom ou surnom est translittéré conformément à sa forme grecque plutôt que traduit.
