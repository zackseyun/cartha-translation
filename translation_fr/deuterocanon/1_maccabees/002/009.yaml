base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: fr
  text: Les objets de sa gloire furent emmenés captifs[a] ; ses petits enfants furent tués dans ses rues[b], ses jeunes gens par l’épée de l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « furent emportés comme des captifs ». Le grec exprime un enlèvement forcé en captivité.'
    reason: lexical_alternative
  - marker: b
    text: Les possessifs « sa » et « ses » renvoient à la ville personnifiée dans le contexte, vraisemblablement Jérusalem ou Sion.
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: objets
  rationale: Le terme peut désigner des récipients, des ustensiles ou des biens matériels. « Objets » préserve cette amplitude sans préciser qu’il s’agit des ustensiles du Temple, même si le contexte peut le suggérer.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » conserve le registre élevé ainsi que les résonances possibles de splendeur, d’honneur et de valeur sacrée.
- source_word: αἰχμάλωτα ἀπήχθη
  choice: furent emmenés captifs
  rationale: La formulation garde l’image frappante d’objets traités comme des captifs et exprime leur enlèvement forcé, sans la réduire à la simple idée de butin.
- source_word: νήπια
  choice: petits enfants
  rationale: νήπια désigne de très jeunes enfants, mais pas nécessairement uniquement des nourrissons. « Petits enfants » est naturel et suffisamment large.
- source_word: ἀπεκτάθη
  choice: furent tués
  rationale: Le verbe signifie mettre à mort. « Furent tués » est clair, grave et naturel en français moderne.
- source_word: πλατείαις
  choice: rues
  rationale: Le mot peut désigner les rues larges ou les espaces ouverts d’une ville. « Rues » convient naturellement au contexte sans imposer le sens plus précis de « places publiques ».
- source_word: νεανίσκοι
  choice: jeunes gens
  rationale: Le terme désigne de jeunes hommes. « Jeunes gens » conserve cette catégorie d’âge dans un registre digne et courant.
- source_word: ῥομφαίᾳ
  choice: épée
  rationale: Bien que ῥομφαία puisse évoquer une grande lame, « épée » transmet ici clairement l’instrument de guerre sans précision inutile.
- source_word: ἐχθροῦ
  choice: de l’ennemi
  rationale: Le singulier grec peut représenter collectivement la force ennemie. La tournure française est naturelle et conserve cette portée.
theological_decisions:
- issue: Référent des possessifs féminins répétés
  choice: Conserver « sa » et « ses » sans nommer leur référent dans le verset.
  alternative: Expliciter « Jérusalem » ou « Sion ».
  rationale: Le grec reprend un antécédent féminin fourni par le contexte. Le maintien des possessifs préserve la personnification et la force poétique de la lamentation sans trancher dans ce verset entre Jérusalem et Sion.
translation_notes:
  register: Français international moderne, sobre et digne. La construction elliptique finale (« ses jeunes gens par l’épée… ») reproduit le parallélisme tragique du grec, le verbe « furent tués » restant sous-entendu. L’image inhabituelle des objets emmenés captifs est volontairement conservée.
