  source_fidelity: Révision recommandée pour rétablir le singulier concret λόγου (« la parole ») plutôt que le pluriel interprétatif « les paroles ». La tournure « finira en fumier et en vers » rend de façon idiomatique l’issue exprimée par εἰς κόπρια καὶ εἰς σκώληκας, sans atténuer l’image de déchéance.
  naturalness: Le français proposé demeure direct, moderne et d’un registre biblique digne. « La parole d’un homme pécheur » est naturel dans ce contexte proverbial; « finira en fumier et en vers » est plus précis que « finira dans le fumier et les vers », qui évoque davantage un lieu qu’un aboutissement.
  terminology: « Homme pécheur », « gloire », « fumier » et « vers » respectent le masculin de ἀνήρ, la force de ἁμαρτωλός, l’ironie de δόξα et l’imagerie délibérément crue de κόπρια et σκώληκες. La note conserve l’alternative contextuelle sans réduire λόγος à une menace.
  issues:
