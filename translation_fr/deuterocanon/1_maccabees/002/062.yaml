    rationale: Le grec emploie le singulier λόγου. Le singulier français « la parole » est aussi naturel ici et conserve mieux la formulation concrète du texte source.
  - severity: low
    issue: « finira dans le fumier et les vers » traduit εἰς comme une localisation.
    rationale: Les deux emplois de εἰς présentent l’issue humiliante de cette gloire. « Finira en fumier et en vers » exprime plus directement cet aboutissement en français.
  - severity: low
    issue: La note qualifie « à cause de » de rendu littéral.
    rationale: « À cause de » explique la valeur de ἀπό, mais n’en est pas l’équivalent littéral. La note doit distinguer la construction grecque de son interprétation française.
