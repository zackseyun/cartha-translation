  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: fr
  text: Et ne craignez pas la parole d’un homme pécheur[a], car sa gloire finira en fumier et en vers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne craignez pas ce que dit un homme pécheur ». Le grec dit littéralement : « ne craignez pas de la parole d’un homme pécheur »; la préposition peut désigner ce qui provient de lui.'
    reason: La construction ἀπὸ λόγου après « craindre » est inhabituelle en français. La note explique l’alternative sans présenter un rendu interprétatif comme littéral.
lexical_decisions:
- source_word: λόγου
  choice: les paroles
  rationale: Le singulier grec désigne ici ce que dit l’homme pécheur. Le pluriel collectif « les paroles » est idiomatique en français et évite l’ambiguïté de « la parole », tout en restant proche du sens.
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: d’un homme pécheur
  rationale: ἀνήρ est masculin singulier et ἁμαρτωλός qualifie cet homme. Cette formulation conserve la structure et la portée morale du grec.
- source_word: μὴ φοβηθῆτε
  choice: ne craignez pas
  rationale: Impératif négatif direct, naturel dans un registre biblique moderne et fidèle au sens de φοβέομαι.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » maintient l’élévation ironique de δόξα, qui peut évoquer l’honneur, le renom ou l’éclat.
- source_word: εἰς κόπρια
  choice: finira dans le fumier
  rationale: εἰς exprime ici l’aboutissement. « Finira dans » rend naturellement ce destin humiliant, tandis que « fumier » conserve l’image concrète et méprisante de κόπρια.
- source_word: καὶ εἰς σκώληκας
  choice: et les vers
  rationale: σκώληκες désigne des vers, notamment associés à la décomposition. Le terme français conserve cette image sans préciser indûment « asticots ».
theological_decisions:
- issue: Valeur masculine ou générique de ἀνήρ
  choice: un homme pécheur
  alternative: une personne pécheresse ; un pécheur
  rationale: Le grec emploie explicitement ἀνήρ au masculin singulier. La traduction le conserve sans généraliser ni neutraliser le référent.
- issue: Rapport entre la gloire et les images de décomposition
  choice: sa gloire finira dans le fumier et les vers
  alternative: sa gloire est destinée au fumier et aux vers
  rationale: La formulation retenue préserve les images crues d’humiliation et de mortalité, tout en exprimant en français idiomatique l’aboutissement marqué par εἰς.
translation_notes:
  register: Français international moderne, digne et direct. L’image volontairement rude du fumier et des vers est conservée. « Les paroles » privilégie l’idiome français, tandis que la note signale la forme singulière et la construction ambiguë du grec.
