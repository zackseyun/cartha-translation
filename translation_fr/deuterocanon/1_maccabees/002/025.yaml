  text: And he killed the king’s man who was compelling them to sacrifice at that time[a], and he tore down the altar,
translation:
  language: fr
  text: À ce moment-là, il tua l’homme du roi qui les contraignait à offrir un sacrifice[a], et il renversa l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme du roi ». Il s’agissait probablement d’un officier ou d’un agent royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: l’homme du roi
  rationale: Cette expression rend directement ἄνδρα et le génitif d’appartenance ou de représentation τοῦ βασιλέως, sans préciser au-delà du grec s’il s’agissait d’un officier ou d’un autre agent royal.
- source_word: τὸν ἀναγκάζοντα
  choice: qui les contraignait
  rationale: Contraindre exprime clairement la coercition portée par ἀναγκάζω. Le pronom « les », absent comme objet explicite en grec, reprend naturellement les habitants que le contexte présente comme forcés à sacrifier.
- source_word: θύειν
  choice: à offrir un sacrifice
  rationale: Dans ce contexte cultuel, θύω désigne l’action d’offrir un sacrifice. Cette formulation française est naturelle et explicite sans ajouter le destinataire du sacrifice.
- source_word: ἀπέκτεινεν
  choice: il tua
  rationale: Le passé simple rend sobrement l’aoriste narratif de ἀποκτείνω et conserve le sens direct de « tuer ».
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: À ce moment-là
  rationale: Cette formulation conserve la valeur temporelle quelque peu appuyée de l’expression grecque, tout en s’intégrant naturellement au récit français.
- source_word: τὸν βωμὸν
  choice: l’autel
  rationale: « Autel » est l’équivalent français ordinaire et exact de βωμός dans un contexte sacrificiel.
- source_word: καθεῖλεν
  choice: il renversa
  rationale: Καθαιρέω signifie ici abattre ou démolir. « Renversa » décrit une action énergique contre l’autel sans affirmer plus précisément que le grec son degré de destruction.
theological_decisions:
- issue: Objet implicite de « contraindre à sacrifier »
  choice: qui les contraignait à offrir un sacrifice
  alternative: qui contraignait les gens à offrir un sacrifice ; qui le contraignait à offrir un sacrifice
  rationale: Le grec ne donne pas d’objet explicite à ἀναγκάζοντα, mais le contexte narratif concerne la population soumise à cette contrainte. « Les » garde cette référence collective contextuelle sans la réduire à un seul individu.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. La formulation reste proche du grec tout en évitant les tournures archaïques et les précisions administratives que le texte source ne fournit pas.
