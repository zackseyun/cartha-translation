  text: Les agents du roi, qui contraignaient à l’apostasie, arrivèrent à Modéïn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: les agents du roi
  rationale: L’expression signifie littéralement « ceux qui viennent de la part du roi ». Dans ce contexte, elle désigne des hommes agissant sous l’autorité royale ; « les agents du roi » est naturel et n’attribue pas de fonction administrative plus précise que le grec.
- source_word: καταναγκάζοντες
  choice: chargés d’imposer
  rationale: Le participe exprime une contrainte forte. Cette formulation française relie naturellement leur mission coercitive à leur qualité d’agents, sans atténuer la violence de l’action.
- source_word: τὴν ἀποστασίαν
  choice: l’apostasie
  rationale: Dans le contexte immédiat, il s’agit de contraindre les Juifs à abandonner la foi et les pratiques ancestrales. « Apostasie » conserve le sens religieux et le poids théologique du terme grec.
- source_word: εἰς Μωδεείν
  choice: à Modéïn
  rationale: Avec un verbe de mouvement, εἰς se traduit naturellement par « à ». « Modéïn » est une forme française transparente du nom grec Μωδεείν.
- source_word: Καὶ ἦλθον
  choice: arrivèrent
  rationale: Le verbe indique leur venue à destination. En français, l’enchaînement narratif n’exige pas toujours de rendre καί par « et » ; « arrivèrent » restitue clairement le mouvement et produit une phrase naturelle.
theological_decisions:
- issue: Sens de ἀποστασία dans un contexte de persécution
  choice: apostasie au sens religieux
  alternative: rébellion politique ou défection au sens général
  rationale: Le contexte maccabéen porte sur la contrainte exercée pour faire abandonner l’observance de l’alliance et adopter des rites païens. Le sens religieux est donc premier, sans transformer le terme en paraphrase doctrinale.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative. « Chargés d’imposer » explicite la mission des agents tout en conservant la force coercitive du participe grec.
