  text: What nation has not inherited a kingdom and taken hold of its spoils?[a]
translation:
  language: fr
  text: Quelle nation n’a pas hérité d’un royaume et ne s’est pas emparée de ses dépouilles[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son butin ». Le grec désigne les dépouilles prises lors d’une conquête ou d’une guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: Quelle nation
  rationale: L’expression introduit une question rhétorique. « Nation » convient au sens collectif et politique de ἔθνος.
- source_word: οὐκ ἐκληρονόμησεν
  choice: n’a pas hérité
  rationale: Le verbe κληρονομέω évoque l’héritage ou la possession reçue en partage. « Hériter » conserve cette image sans réduire le sens à une simple conquête.
- source_word: βασιλείαν
  choice: d’un royaume
  rationale: Dans ce contexte politique et en parallèle avec les dépouilles saisies, βασιλεία désigne naturellement un royaume, tout en pouvant ailleurs signifier royauté ou pouvoir royal.
- source_word: οὐκ ἐκράτησεν
  choice: ne s’est pas emparée
  rationale: κρατέω exprime ici la prise ou la maîtrise effective. « S’emparer de » est naturel en français et restitue la force du verbe dans un contexte de conquête.
- source_word: τῶν σκύλων αὐτῆς
  choice: de ses dépouilles
  rationale: σκῦλα désigne les dépouilles prises à la guerre. Le possessif « ses » conserve l’indétermination référentielle d’αὐτῆς aussi naturellement que possible en français.
