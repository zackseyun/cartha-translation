  text: Caleb[a], when he testified before the assembly, received the land as an inheritance.
translation:
  language: fr
  text: Caleb, lorsqu’il témoigna[a] devant l’assemblée, reçut le pays en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en rendant témoignage ».'
    reason: La construction grecque peut décrire la circonstance de l’action plutôt que seulement son moment.
lexical_decisions:
- source_word: Χαλὲβ
  choice: Caleb
  rationale: Forme française traditionnelle et courante du nom propre grec translittéré.
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: lorsqu’il témoigna
  rationale: La construction ἐν + infinitif articulé exprime ici naturellement une circonstance temporelle. « Témoigna » conserve le sens de témoignage porté, sans surinterpréter le lien comme explicitement causal.
- source_word: τῇ ἐκκλησίᾳ
  choice: devant l’assemblée
  rationale: Dans ce contexte juif antérieur au christianisme, ἐκκλησία désigne la communauté réunie. Avec le verbe de témoignage, « devant l’assemblée » est idiomatique en français et rend la scène publique.
- source_word: ἔλαβε
  choice: reçut
  rationale: Le verbe indique ici l’entrée en possession d’un bien attribué; « reçut » convient au contexte d’un héritage mieux que « prit ».
- source_word: γῆν
  choice: le pays
  rationale: Le référent contextuel est le pays promis attribué à Caleb. « Le pays » est plus naturel en français biblique que « la terre » dans ce contexte territorial.
- source_word: κληρονομίαν
  choice: en héritage
  rationale: Cette expression française concise rend la possession reçue comme part héréditaire ou lot attribué, sans ajouter un possessif absent du grec.
theological_decisions:
- issue: Sens de ἐκκλησία dans le cadre historique du récit de Caleb
  choice: assemblée
  alternative: Église; communauté
  rationale: Le mot désigne ici l’assemblée d’Israël et non l’Église chrétienne. « Assemblée » préserve le cadre historique et évite un anachronisme.
- issue: Rapport logique de ἐν τῷ ἐπιμαρτυρῆσαι avec le verbe principal
  choice: 'valeur temporelle : « lorsqu’il témoigna »'
  alternative: 'valeur circonstancielle : « en rendant témoignage »; valeur causale : « pour avoir témoigné »'
  rationale: La construction grecque permet une nuance circonstancielle ou temporelle. La traduction principale retient la valeur temporelle la plus directement exprimée, sans imposer une causalité que la préposition ne marque pas explicitement.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient à cette brève évocation historique et maintient une formulation concise. « Pays » précise naturellement la valeur territoriale de γῆ dans le contexte de l’héritage de Caleb.
