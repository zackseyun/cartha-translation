  text: And they pursued the sons of arrogance[b][a], and the work prospered in their hands.
translation:
  language: fr
  text: Ils poursuivirent les fils de l’arrogance[a], et l’entreprise réussit entre leurs mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les arrogants » ou « les fils de l’orgueil ». Le grec dit littéralement « les fils de l’arrogance ».
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire que l’entreprise menée sous leur direction fut couronnée de succès. Littéralement : « l’œuvre prospéra dans leur main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξαν
  choice: poursuivirent
  rationale: Le verbe exprime ici une poursuite active et hostile, sans préciser si elle aboutit à l’expulsion ou à la mort.
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  choice: les fils de l’arrogance
  rationale: Cette expression de tournure sémitique est conservée afin de préserver son relief rhétorique, tout en signalant en note son sens idiomatique.
- source_word: ὑπερηφανίας
  choice: arrogance
  rationale: « Arrogance » rend clairement la connotation morale négative d’un orgueil hautain et dominateur.
- source_word: κατευωδώθη
  choice: réussit
  rationale: Le passif grec indique que l’entreprise connut une issue favorable. « Réussit » est naturel en français et n’ajoute aucune cause explicite à ce succès.
- source_word: τὸ ἔργον
  choice: l’entreprise
  rationale: Dans ce contexte, le terme désigne l’action menée par les révoltés. « L’entreprise » garde cette portée générale sans donner à « œuvre » une coloration religieuse indue.
- source_word: ἐν χειρὶ αὐτῶν
  choice: entre leurs mains
  rationale: Cette expression française conserve l’image de la main et suggère que l’entreprise était menée sous leur direction.
