  text: Et voyant les blasphèmes commis en Juda et à Jérusalem,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδών
  choice: voyant
  rationale: Le participe aoriste de ὁράω est conservé sous une forme participiale naturelle en français et maintient le lien syntaxique avec la suite du récit.
- source_word: βλασφημίας
  choice: les blasphèmes
  rationale: Ce choix rend directement les actes de profanation ou d’offense envers Dieu, sans les réduire à de simples outrages ni les préciser davantage comme des sacrilèges.
- source_word: τὰς γινομένας
  choice: commis
  rationale: Avec « blasphèmes », « commis » exprime idiomatiquement des actes perpétrés, tout en rendant la valeur du participe qui caractérise les blasphèmes en cours dans le pays.
- source_word: ἐν Ἰούδᾳ
  choice: en Juda
  rationale: « Juda » conserve la forme et la résonance territoriale et ethnique du grec, sans introduire une désignation administrative romaine plus tardive.
- source_word: ἐν Ἱερουσαλήμ
  choice: à Jérusalem
  rationale: En français moderne, la préposition idiomatique devant un nom de ville est « à ».
theological_decisions:
- issue: Rendu de βλασφημίας dans ce contexte historique religieux
  choice: blasphèmes
  alternative: sacrilèges ; outrages ; actes blasphématoires
  rationale: « Blasphèmes » préserve la portée explicitement religieuse du grec et son caractère pluriel, sans restreindre le sens aux seules atteintes contre des objets sacrés ni l’affaiblir en offense générale.
translation_notes:
  register: Français international moderne, digne et direct. La tournure participiale est maintenue afin de respecter la structure grecque et le caractère non autonome du verset, qui se prolonge dans la suite.
