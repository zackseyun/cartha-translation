translation:
  language: fr
  text: Ananias[a], Azarias et Misaël, ayant cru[b], furent sauvés de la flamme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Ananias, Azarias, Misaël ». Il s’agit de Hanania, Azaria et Mishaël, les trois jeunes gens de Daniel 3.
    reason: Identification des noms et indication des formes hébraïques correspondantes.
  - marker: b
    text: 'Le participe peut aussi se traduire : « parce qu’ils avaient cru, ils furent sauvés » ou « ayant mis leur confiance, ils furent délivrés de la flamme ».'
    reason: Le participe grec permet plusieurs formulations du rapport entre leur confiance et leur délivrance, sans en fixer une seule.
lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: Ananias, Azarias et Misaël
  rationale: Ces formes françaises suivent de près les noms grecs du texte source. Une note signale les formes hébraïques couramment associées aux trois jeunes gens de Daniel 3.
- source_word: πιστεύσαντες
  choice: parce qu’ils avaient cru
  rationale: Le participe aoriste exprime ici le fait d’avoir cru ou fait confiance, en lien avec leur délivrance. Cette formulation est naturelle en français et conserve le verbe « croire » sans le remplacer par le nom abstrait « foi ».
- source_word: ἐσώθησαν
  choice: furent sauvés
  rationale: Le passif de σῴζω peut signifier sauver, délivrer ou arracher au danger. « Furent sauvés » demeure proche du grec tout en convenant à ce sauvetage concret.
- source_word: ἐκ φλογός
  choice: de la flamme
  rationale: Le singulier φλογός désigne la flamme ou le brasier. « De la flamme » conserve l’image vive et le nombre du grec.
theological_decisions:
- issue: Rapport entre πιστεύσαντες et ἐσώθησαν
  choice: « parce qu’ils avaient cru, furent sauvés »
  alternative: « ayant cru, ils furent sauvés » ; « par la foi, ils furent sauvés »
  rationale: Le participe peut indiquer une circonstance antérieure ou la raison associée au salut. « Parce qu’ils avaient cru » rend clairement ce lien sans transformer le verbe πιστεύω en une formule doctrinale fondée sur le nom « foi ». La note maintient l’ambiguïté grammaticale légitime.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure au passé antérieur logique (« avaient cru ») marque l’antériorité du participe aoriste, tandis que le passé simple convient au registre narratif biblique sans être archaïque. Les noms suivent directement les formes grecques.
