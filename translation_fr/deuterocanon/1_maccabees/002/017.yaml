  yaml_path: translation/deuterocanon/1_maccabees/002/017.yaml
  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: fr
  text: 'Les représentants du roi[a] répondirent à Mattathias en ces termes : « Tu es un chef, un homme honoré et important dans cette ville, et tu es soutenu par tes fils et tes frères[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui sont de la part du roi » ; c’est-à-dire ses représentants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « solidement établi avec tes fils et tes frères ». Le grec peut souligner soit l’appui que lui apporte sa famille, soit la position solide qu’il occupe grâce à elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: les représentants du roi
  rationale: L’expression signifie littéralement « ceux qui sont auprès du roi » ou « ceux qui viennent de la part du roi » ; dans ce contexte, elle désigne naturellement ses représentants.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν ... λέγοντες
  choice: répondirent ... en ces termes
  rationale: Cette formulation française rend la tournure narrative redoublée du grec sans produire la lourdeur de « répondirent et dirent, disant ».
- source_word: Ἄρχων
  choice: un chef
  rationale: Le terme désigne une personne qui exerce une autorité ou occupe une position éminente. « Chef » convient ici à une autorité locale sans préciser une charge non indiquée par le texte.
- source_word: ἔνδοξος
  choice: un homme honoré
  rationale: Dans ce cadre social, l’adjectif exprime l’honneur et l’estime dont jouit Mattathias plutôt qu’une « gloire » au sens religieux ou éclatant.
- source_word: μέγας
  choice: important
  rationale: L’adjectif évoque ici le rang et l’influence. « Important » transmet ce sens en français actuel, tandis que « grand » serait plus ambigu.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: dans cette ville
  rationale: Rendu direct de la locution grecque, dans un registre courant et digne.
- source_word: ἐστηριγμένος
  choice: soutenu
  rationale: Le participe peut signifier « affermi », « solidement établi » ou « soutenu ». Avec la mention des fils et des frères, « soutenu » fait ressortir l’appui familial sans effacer l’idée de stabilité.
- source_word: ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: par tes fils et tes frères
  rationale: La préposition ἐν peut ici exprimer le milieu ou le moyen par lequel Mattathias est affermi. « Par » donne un sens naturel à l’idée d’appui familial, tout en signalant l’autre possibilité en note.
