base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: fr
  text: Maintenant donc, avance le premier et exécute l’ordre du roi, comme l’ont fait toutes les nations, les chefs de Juda et ceux qui sont restés à Jérusalem. Toi et ta famille, vous compterez parmi les Amis du roi[a] ; toi et tes fils, vous serez honorés et recevrez de l’argent, de l’or et de nombreuses largesses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les amis du roi ». Dans les cours hellénistiques, les « Amis » pouvaient constituer une catégorie reconnue de proches, de conseillers et de compagnons du souverain.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner des dons, des avantages ou des distributions accordés par le roi, en plus de l’argent et de l’or.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσελθε πρῶτος
  choice: avance le premier
  rationale: L’impératif invite Mattathias à s’avancer publiquement et à donner l’exemple. Cette formulation exprime à la fois le mouvement et la priorité.
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: exécute l’ordre du roi
  rationale: πρόσταγμα désigne un ordre émanant d’une autorité ; « exécute » rend idiomatiquement l’obéissance demandée.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: La formulation conserve la portée collective du grec sans imposer le sens religieux plus spécialisé de « païens ».
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: les chefs de Juda
  rationale: ἄρχοντες désigne les personnes exerçant une autorité. « Chefs » est naturel en français et convient au contexte politique.
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: ceux qui sont restés à Jérusalem
  rationale: Cette traduction préserve le sens de personnes demeurées sur place sans préciser indûment qu’il s’agirait de survivants ou d’un reste théologique.
- source_word: ὁ οἶκός σου
  choice: ta famille
  rationale: Dans ce contexte, οἶκος désigne la maisonnée ou la famille plutôt qu’un bâtiment. « Ta famille » est clair et naturel.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: parmi les Amis du roi
  rationale: Dans le langage des cours hellénistiques, φίλοι pouvait désigner une catégorie reconnue de proches et de conseillers royaux. La majuscule signale cette probable valeur de titre.
- source_word: δοξασθήσεσθε
  choice: vous serez honorés
  rationale: Le passif exprime ici l’honneur et la distinction accordés par le pouvoir royal, non une glorification au sens religieux.
- source_word: ἀποστολαῖς πολλαῖς
  choice: de nombreuses largesses
  rationale: À côté de l’argent et de l’or, le terme évoque vraisemblablement des dons, avantages ou distributions venant du roi. « Largesses » restitue cette nuance royale sans suggérer des missions.
theological_decisions:
- issue: Valeur de titre de φίλοι
  choice: « les Amis du roi », avec une majuscule
  alternative: « les amis du roi »
  rationale: La majuscule conserve la probable référence à un rang de cour hellénistique, tandis que la note reconnaît que l’expression peut aussi être comprise dans son sens courant.
- issue: Portée de ἔθνη
  choice: « les nations »
  alternative: « les païens » ou « les peuples »
  rationale: Le contexte présente une comparaison politique et collective. « Les nations » suit le grec et évite de réduire sans nécessité le terme à une catégorie strictement religieuse.
- issue: Nature des récompenses promises
  choice: Conserver la construction où l’honneur se manifeste par l’argent, l’or et les largesses
  alternative: Paraphraser par « vous recevrez en récompense »
  rationale: La formulation retenue maintient le lien grammatical du grec entre δοξασθήσεσθε et les datifs qui suivent, sans transformer explicitement l’honneur en simple paiement.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse grecque au singulier. La phrase passe naturellement au pluriel lorsque Mattathias et sa famille, puis ses fils, deviennent sujets. La ponctuation scinde la longue période grecque sans en modifier la progression.
