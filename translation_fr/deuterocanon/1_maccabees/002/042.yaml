  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris le caractère volontaire de l’attachement à la Loi. Toutefois, « une force puissante » alourdit inutilement l’emphase grecque et rend l’apposition peu claire. Le texte grec qualifie directement l’assemblée comme forte/puissante, puis précise que chacun de ses membres se dévouait volontairement à la Loi.
  naturalness: La phrase actuelle est compréhensible, mais « une force puissante issue d’Israël » est peu idiomatique et la succession « un groupe … une force … tous ceux » manque de cohésion syntaxique. Une formulation qui garde le groupe comme sujet et explicite que « tous » renvoie à ses membres est plus naturelle.
  terminology: « Assidéens » est la forme française établie et proche du grec Ἀσιδαῖοι; elle convient mieux au texte courant que « Hassidéens ». « Loi » avec majuscule est approprié ici pour la Loi d’Israël. La note conserve les variantes utiles sans réduire le nom de groupe à « les pieux ».
