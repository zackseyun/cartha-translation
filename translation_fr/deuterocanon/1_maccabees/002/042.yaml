  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: fr
  text: Alors un groupe d’Assidéens[a] se joignit à eux, puissant et issu d’Israël ; tous ses membres se dévouaient volontairement à la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hassidéens », « Hasidim » ou « Assidéens ». Nom d’un groupe juif connu pour son attachement zélé à la Loi.
    reason: Signaler les principales formes du nom historique et éclairer brièvement son référent sans traduire le nom dans le texte.
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: se joignit à eux
  rationale: Le verbe passif et πρός avec l’accusatif expriment ici un rassemblement orienté vers le groupe précédent. Le singulier s’accorde naturellement en français avec le sujet collectif « un groupe ».
- source_word: συναγωγὴ Ἀσιδαίων
  choice: un groupe de Hassidéens
  rationale: « Groupe » rend l’ensemble assemblé sans évoquer anachroniquement une synagogue. « Hassidéens » conserve le nom historique du groupe plutôt que de le réduire à l’adjectif « pieux ».
- source_word: ἰσχυρὰ δυνάμει
  choice: une force puissante
  rationale: Cette formulation garde l’emphase du grec, où l’idée de force est redoublée, tout en restant naturelle en français.
- source_word: ἀπὸ Ἰσραήλ
  choice: issue d’Israël
  rationale: La préposition ἀπό marque la provenance. « Issue d’Israël » rattache naturellement cette origine à la force constituée par le groupe.
- source_word: πᾶς ὁ ἑκουσιαζόμενος
  choice: tous ceux qui se consacraient volontairement
  rationale: Le participe exprime une adhésion libre et active. Le pluriel français s’accorde au sens collectif et inclusif de πᾶς ὁ.
- source_word: τῷ νόμῳ
  choice: à la Loi
  rationale: Le datif indique l’objet de l’engagement. La majuscule aide le lecteur français à reconnaître ici la Loi d’Israël sans ajouter d’explication au corps du texte.
theological_decisions:
- issue: Valeur de Ἀσιδαίων
  choice: Hassidéens
  alternative: les pieux ; Hasidim ; Assidéens
  rationale: Le mot désigne vraisemblablement un groupe historique particulier. La translittération préserve cette identité sans imposer que le terme soit seulement une qualification morale.
- issue: Portée de ἑκουσιαζόμενος τῷ νόμῳ
  choice: ceux qui se consacraient volontairement à la Loi
  alternative: ceux qui se portaient volontaires pour la Loi
  rationale: Le choix conserve à la fois la liberté de l’engagement et son orientation vers la Loi, sans transformer explicitement cet engagement en enrôlement militaire.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la densité et l’emphase du grec, tout en évitant les connotations modernes de « congrégation » ou l’interprétation trop militaire de « volontaires ».
