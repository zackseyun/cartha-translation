  text: All her glory was taken away; instead of being free[a], she became a servant.
translation:
  language: fr
  text: Toute sa splendeur lui fut enlevée ; de femme libre, elle devint esclave.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ κόσμος αὐτῆς
  choice: toute sa splendeur
  rationale: κόσμος désigne ici la parure ou l’éclat qui confère de l’honneur, non le « monde » ; « splendeur » convient au registre de la lamentation, tandis que πᾶς exprime la totalité de la perte.
- source_word: ἀφηρέθη
  choice: lui fut enlevée
  rationale: Le passif aoriste exprime une privation subie ; cette formulation conserve le passif et le complément implicite de la personne dépouillée.
- source_word: ἀντὶ ἐλευθέρας
  choice: de femme libre
  rationale: ἀντί marque ici le remplacement d’un état par un autre. La forme féminine personnifie la ville comme une femme ; la tournure française met nettement en relief le changement de condition.
- source_word: ἐγενήθη εἰς δούλην
  choice: elle devint esclave
  rationale: La construction indique l’entrée dans une nouvelle condition. « Esclave » rend la servitude juridique et sociale de δούλη, fortement opposée à ἐλευθέρας.
theological_decisions:
- issue: Contraste entre ἐλευθέρα et δούλη
  choice: femme libre … esclave
  alternative: libre … servante
  rationale: Le passage décrit une perte de liberté et non simplement le fait de se mettre au service de quelqu’un. « Esclave » préserve donc la force du contraste sans l’atténuer ; « femme libre » maintient en outre la personnification féminine de la ville.
translation_notes:
  register: Français moderne, sobre et digne. La structure antithétique est resserrée pour rendre naturellement le renversement de condition, tout en conservant la personnification féminine de la ville.
