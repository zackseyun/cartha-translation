  text: But I and my sons and my brothers will walk in the covenant of our fathers[a].
translation:
  language: fr
  text: Mais moi, mes fils et mes frères, nous marcherons dans l’alliance de nos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « nous irons dans l’alliance de nos pères ». Cette tournure grecque signifie vraisemblablement que l’on conduit sa vie dans la fidélité à l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Mais moi
  rationale: La crase réunit καί et ἐγώ. Dans le contexte, « Mais moi » exprime naturellement le contraste et la résolution personnelle de Mattathias.
- source_word: οἱ υἱοί μου
  choice: mes fils
  rationale: υἱοί désigne précisément les fils; le terme masculin concret convient au contexte narratif.
- source_word: οἱ ἀδελφοί μου
  choice: mes frères
  rationale: ἀδελφοί signifie ici le plus naturellement « frères »; rien dans ce verset n’impose l’élargissement à « proches » ou « compatriotes ».
- source_word: πορευσόμεθα
  choice: nous marcherons
  rationale: Le verbe signifie littéralement « nous irons », mais avec ἐν διαθήκῃ il décrit une conduite fidèle. « Marcher » conserve l’image biblique sans réduire l’expression à une simple direction spatiale.
- source_word: ἐν διαθήκῃ
  choice: dans l’alliance
  rationale: διαθήκη désigne l’alliance; « dans » préserve la préposition grecque et s’accorde avec l’image de la marche.
- source_word: πατέρων ἡμῶν
  choice: de nos pères
  rationale: La formulation conserve le terme familial masculin et la résonance de l’alliance reçue des générations précédentes.
theological_decisions:
- issue: L’expression d’alliance πορευσόμεθα ἐν διαθήκῃ
  choice: nous marcherons dans l’alliance de nos pères
  alternative: nous vivrons selon l’alliance de nos pères
  rationale: La traduction retenue garde l’image et la structure du grec tout en exprimant une conduite fidèle à l’alliance. La note signale le sens plus littéral sans effacer la portée idiomatique.
- issue: Les termes de parenté masculins
  choice: mes fils, mes frères, nos pères
  alternative: mes enfants, mes proches, nos ancêtres
  rationale: Le grec emploie des termes spécifiquement masculins. Les conserver respecte la précision historique et familiale sans ajouter une portée que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. « Marcher dans l’alliance » conserve volontairement l’image biblique, tandis que la note en éclaire l’emploi idiomatique.
