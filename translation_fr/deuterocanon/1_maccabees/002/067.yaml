  text: And you[a], gather to yourselves all who practice the law[b], and take vengeance for your people.
translation:
  language: fr
  text: Et vous, ralliez à vous tous ceux qui mettent la loi en pratique[a], et vengez votre peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tous ceux qui font la loi » ou « tous ceux qui l’observent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « exercez une vengeance pour votre peuple ». Le grec emploie un verbe et un nom de même racine, ce qui renforce l’ordre de venger votre peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: ralliez à vous
  rationale: Le verbe accompagné de πρὸς ὑμᾶς appelle à faire venir ces personnes auprès de soi et à les unir à son camp. « Ralliez à vous » est naturel en français et convient au contexte de mobilisation.
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: tous ceux qui mettent la loi en pratique
  rationale: ποιητής désigne ici celui qui fait ou pratique quelque chose, non celui qui le compose. Cette formulation exprime clairement l’observance active de la loi.
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: vengez
  rationale: La construction grecque associe un verbe et un nom de même racine pour renforcer l’ordre. Le verbe français « vengez » en restitue le sens avec force, tandis qu’une note signale la tournure intensive de l’original.
- source_word: τοῦ λαοῦ ὑμῶν
  choice: votre peuple
  rationale: Avec l’idée de vengeance, le génitif désigne le peuple lésé en faveur duquel la vengeance doit être exercée. En français idiomatique, « vengez votre peuple » rend directement ce rapport.
theological_decisions:
- issue: Traduction de νόμος dans le contexte juif des Maccabées
  choice: la loi
  alternative: la Loi
  rationale: Dans ce contexte, le terme renvoie à la loi ancestrale, la Torah. La minuscule reste proche du grec, qui ne marque pas cette distinction typographique, et évite d’imposer une convention confessionnelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Ralliez à vous » conserve le mouvement vers le groupe des destinataires; « mettent la loi en pratique » rend l’observance concrète; « vengez votre peuple » demeure bref et énergique.
