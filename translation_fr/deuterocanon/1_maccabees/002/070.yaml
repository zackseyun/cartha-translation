  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: fr
  text: Il mourut la cent quarante-sixième année[a]. Ses fils l’ensevelirent dans les tombeaux de ses pères, à Modéïn, et tout Israël mena pour lui un grand deuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de la cent quarante-sixième année de l’ère séleucide.
    reason: 'Note culturelle et chronologique: elle explicite l’ère vraisemblablement sous-entendue sans l’ajouter au texte grec.'
lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Le verbe énonce directement la mort, sans euphémisme.
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: la cent quarante-sixième année
  rationale: Cette formulation française naturelle conserve la valeur ordinale de la formule chronologique grecque sans préciser dans le corps du texte l’ère sous-entendue.
- source_word: ἔθαψαν
  choice: ensevelirent
  rationale: « Ensevelir » est un verbe funéraire précis, digne et courant dans le registre biblique français.
- source_word: τάφοις πατέρων αὐτοῦ
  choice: les tombeaux de ses pères
  rationale: Ce choix conserve explicitement l’expression familiale et ancestrale du grec plutôt que de la réduire à « tombeaux ancestraux ».
- source_word: Μωδεείν
  choice: Modéïn
  rationale: Translittération française claire de la forme grecque, avec tréma pour signaler la séparation vocalique.
- source_word: ἐκόψαντο ... κοπετὸν μέγαν
  choice: mena ... un grand deuil
  rationale: Le verbe et son accusatif de même racine expriment un deuil intense; cette tournure française restitue l’intensification sans imposer un geste rituel particulier.
- source_word: πᾶς Ἰσραήλ
  choice: tout Israël
  rationale: Expression collective française traditionnelle et transparente désignant l’ensemble du peuple.
theological_decisions:
- issue: Référence de la formule chronologique
  choice: La date est donnée comme « la cent quarante-sixième année » sans désigner l’ère dans le texte principal.
  alternative: « la cent quarante-sixième année de l’ère séleucide »
  rationale: Le grec ne nomme pas l’ère. L’identification à l’ère séleucide est historiquement probable, mais relève d’une précision contextuelle qui convient mieux à une note.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation divise la longue coordination grecque en deux phrases pour améliorer la lisibilité sans modifier les rapports narratifs. « Ses pères » préserve la formulation ancestrale du texte source.
