  yaml_path: translation/deuterocanon/1_maccabees/002/038.yaml
  text: And they rose up against them in battle on the Sabbath[a], and they died—they and their wives and their children and their livestock—about a thousand persons.
translation:
  language: fr
  text: Ils se dressèrent contre eux au combat, le jour du sabbat. Ceux contre qui ils s’étaient dressés moururent, eux, leurs femmes, leurs enfants et leur bétail, jusqu’à mille personnes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « environ mille personnes » ; l’expression grecque peut indiquer une limite supérieure approximative plutôt qu’un dénombrement exact.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτούς
  choice: Ils se dressèrent contre eux
  rationale: L’expression décrit une action hostile dirigée contre quelqu’un. « Se dressèrent contre » conserve l’image verbale grecque sans préciser davantage la forme de l’attaque.
- source_word: ἐν τῷ πολέμῳ
  choice: pour les combattre
  rationale: Dans ce contexte immédiat, la formule désigne l’engagement hostile plutôt qu’une guerre prolongée. Cette tournure est naturelle en français et s’articule clairement avec le verbe précédent.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le pluriel grec appartient à une expression idiomatique relative au sabbat; le contexte évoque une attaque particulière. Le singulier idiomatique français convient donc.
- source_word: ἀπέθανον
  choice: moururent
  rationale: Le verbe grec est intransitif et signifie littéralement « moururent ». Le contexte implique une mort causée par l’attaque, mais la traduction n’ajoute pas un passif tel que « furent tués ».
- source_word: τὰ κτήνη
  choice: leur bétail
  rationale: κτήνη désigne les animaux domestiques considérés comme biens. « Bétail » est ici concis, courant et suffisamment large.
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: jusqu’à mille personnes
  rationale: ἕως suivi d’un nombre peut marquer une limite supérieure approximative. ψυχαί ἀνθρώπων sert à compter des êtres humains; « personnes » rend naturellement ce sens.
