  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
translation:
  language: fr
  text: 'Ils leur dirent : « Jusqu’à présent[a] : sortez et agissez conformément à la parole du roi[b], et vous vivrez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est abrupte et peut signaler qu’il leur reste une dernière occasion d’obéir.
    reason: lexical_alternative
  - marker: b
    text: « La parole du roi » peut aussi se traduire par « l’ordre du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  choice: Jusqu’à maintenant
  rationale: Cette expression temporelle abrupte marque une limite ou une dernière occasion, sans préciser davantage le rapport logique avec l’ordre qui suit.
- source_word: ἐξέλθοντες
  choice: Sortez
  rationale: Le participe a ici une valeur circonstancielle liée à l’impératif suivant. Un impératif coordonné est naturel en français et convient à des personnes sommées de quitter leur refuge.
- source_word: ποιήσατε
  choice: agissez
  rationale: L’impératif signifie littéralement « faites », mais « agissez conformément à » rend naturellement la construction française sans préciser au-delà du grec l’action exigée.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: conformément à la parole du roi
  rationale: « Parole » conserve la largeur sémantique de λόγος, qui désigne ici la directive royale; « conformément à » exprime clairement la relation indiquée par κατά.
- source_word: ζήσεσθε
  choice: vous vivrez
  rationale: Cette traduction directe préserve à la fois le sens littéral et la promesse implicite que leur vie sera épargnée.
