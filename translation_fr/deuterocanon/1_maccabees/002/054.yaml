  text: Phinehas our father[a], because he was zealous with zeal, received a covenant of holy priesthood.
translation:
  language: fr
  text: Phinéas, notre père, parce qu’il fit preuve d’un grand zèle[a], reçut une alliance d’un sacerdoce saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « parce qu’il fut zélé de zèle ». Le grec emploie deux mots de même racine pour renforcer l’idée.
    reason: La note préserve l’expression emphatique du grec, qu’une traduction française naturelle ne peut reproduire mot à mot.
lexical_decisions:
- source_word: Φινεὲς
  choice: Phinéas
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre grec.
- source_word: ὁ πατὴρ ἡμῶν
  choice: notre père
  rationale: Conserve le terme familial et sa force rhétorique; dans ce contexte, il désigne un ancêtre du peuple.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: parce qu’il fit preuve d’un grand zèle
  rationale: Rend naturellement en français la valeur causale du tour grec et l’intensité produite par la répétition de mots de même racine.
- source_word: ἔλαβε
  choice: reçut
  rationale: Exprime que l’alliance lui fut accordée, plutôt qu’obtenue par saisie.
- source_word: διαθήκην
  choice: une alliance
  rationale: Terme biblique usuel qui maintient le lien avec la tradition scripturaire concernant Phinéas.
- source_word: ἱερωσύνης ἁγίας
  choice: de saint sacerdoce
  rationale: Rendu formel qui conserve le rapport génitif et qualifie le sacerdoce de saint sans expliciter davantage la nature de l’alliance.
theological_decisions:
- issue: Rapport entre le zèle de Phinéas et l’alliance reçue
  choice: Rendre ἐν τῷ par « parce que » tout en conservant l’intensité du zèle
  alternative: « lorsqu’il fit preuve de zèle »
  rationale: Dans ce contexte, la construction indique vraisemblablement le motif de l’octroi de l’alliance. La note signale toutefois la formulation grecque sans ajouter de détails théologiques absents du texte.
- issue: Nature de l’alliance sacerdotale
  choice: « une alliance de saint sacerdoce »
  alternative: « une alliance lui accordant un saint sacerdoce »
  rationale: Le rendu retenu évite d’expliciter comme contenu ou effet de l’alliance ce que le génitif grec laisse sous une forme plus compacte.
translation_notes:
  register: Français moderne, digne et accessible. « Notre père » garde la rhétorique ancestrale du passage; « de saint sacerdoce » conserve volontairement la formulation biblique compacte du grec.
