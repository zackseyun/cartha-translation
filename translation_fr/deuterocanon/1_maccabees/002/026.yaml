  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: fr
  text: Il brûla de zèle pour la loi, comme l’avait fait Phinéès contre Zambri, fils de Salom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec donne ici les noms Zambri, fils de Salom. Dans Nombres 25, ces personnages sont plus couramment appelés Zimri, fils de Salou.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: brûla de zèle
  rationale: L’aoriste exprime ici un zèle ardent manifesté par une action décisive. Cette tournure française rend l’intensité du contexte sans suggérer la jalousie.
- source_word: τῷ νόμῳ
  choice: pour la loi
  rationale: Le datif indique l’objet ou la cause du zèle. « Pour la loi » est naturel en français et conserve la référence à la Torah sans imposer une convention confessionnelle de majuscule.
- source_word: καθὼς ἐποίησεν
  choice: comme l’avait fait
  rationale: La formulation conserve la comparaison historique explicite, tandis que le plus-que-parfait situe naturellement en français l’action antérieure de Phinéès.
- source_word: Φινεὲς
  choice: Phinéès
  rationale: Forme française biblique traditionnelle correspondant au personnage de Nombres 25.
- source_word: τῷ Ζαμβρὶ
  choice: contre Zambri
  rationale: 'Bien que le nom soit au datif, l’allusion narrative donne à la relation un sens adversatif : Phinéès a agi contre cet homme.'
- source_word: υἱῷ Σαλώμ
  choice: fils de Salom
  rationale: Les noms sont transcrits d’après les formes grecques Ζαμβρί et Σαλώμ; les formes plus courantes issues de Nombres 25 sont signalées en note.
theological_decisions:
- issue: Degré d’explicitation de l’imitation de Phinéès par Mattathias dans un contexte de zèle violent
  choice: Maintenir directement la comparaison, sans l’atténuer ni la développer
  alternative: Expliquer l’allusion dans le corps du texte ou adoucir le vocabulaire du zèle
  rationale: Le grec compare explicitement l’action de Mattathias à celle de Phinéès. La traduction préserve cette tension narrative et théologique sans ajouter une approbation ni en diminuer la force.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « brûla de zèle » conserve l’intensité de l’action; les noms suivent le témoin grec, avec les formes usuelles indiquées en note.
