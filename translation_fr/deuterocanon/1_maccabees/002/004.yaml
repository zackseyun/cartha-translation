lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle du nom propre grec Ἰούδας dans ce contexte; elle distingue naturellement le fils de Mattathias tout en restant conforme à l’usage biblique français.
- source_word: ὁ καλούμενος
  choice: appelé
  rationale: Rend simplement et naturellement le participe substantivé grec, qui introduit le surnom ou nom sous lequel Judas était connu.
- source_word: Μακκαβαῖος
  choice: Maccabée
  rationale: Forme française consacrée et immédiatement reconnaissable du surnom grec Μακκαβαῖος; «Maccabéos» serait une translittération plus directe, mais peu naturelle en français courant.
