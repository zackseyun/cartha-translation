  text: Then many who were seeking righteousness and justice went down into the wilderness to settle there,[a]
translation:
  language: fr
  text: Alors, beaucoup de gens qui recherchaient la justice et le droit descendirent au désert pour s’y établir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture et le jugement ». Le grec associe δικαιοσύνη et κρίμα, deux termes dont les sens peuvent se recouper, mais qui semblent ici désigner deux idéaux liés.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque simplement la succession narrative dans un français naturel.
- source_word: κατέβησαν
  choice: descendirent
  rationale: Conserve explicitement l’idée de descente exprimée par le verbe grec.
- source_word: πολλοὶ ζητοῦντες
  choice: beaucoup de ceux qui recherchaient
  rationale: Rend la valeur durative du participe présent et identifie naturellement le groupe en français.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: Dans ce récit, le terme évoque la conduite juste et la fidélité à ce qui est droit; « justice » est le terme français courant le plus naturel, même s’il recoupe partiellement κρίμα.
- source_word: καὶ κρίμα
  choice: et le droit
  rationale: « Le droit » préserve un second idéal lié à la décision juste ou à ce qui est juridiquement droit, sans répéter « justice ».
- source_word: εἰς τὴν ἔρημον
  choice: au désert
  rationale: Expression biblique française naturelle pour une région inhabitée, sans exiger un paysage uniquement sablonneux.
- source_word: καθίσαι ἐκεῖ
  choice: pour s’y établir
  rationale: Rend l’emploi idiomatique de l’infinitif comme installation ou résidence, plutôt qu’une action de s’asseoir.
theological_decisions:
- issue: Distinction entre δικαιοσύνη et κρίμα
  choice: la justice et le droit
  alternative: la droiture et le jugement
  rationale: Le grec associe deux notions proches. La traduction principale reste naturelle en français tout en maintenant deux termes distincts; la note conserve l’autre possibilité sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit écrit; « au désert » et « s’y établir » sont clairs pour un lectorat international.
