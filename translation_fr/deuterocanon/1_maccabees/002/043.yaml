    reason: textual_variant
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: L’adjectif employé substantivement avec l’article et le participe désigne l’ensemble des personnes concernées.
- source_word: οἱ φυγαδεύοντες
  choice: ceux qui fuyaient
  rationale: Le participe présent substantivé évoque une fuite en cours, sans présenter ces personnes comme des criminels ni préciser qu’elles auraient déjà trouvé refuge. L’imparfait convient au fil d’un récit français au passé.
- source_word: ἀπὸ
  choice: loin de
  rationale: La préposition marque ici l’éloignement ou la séparation; dans la tournure française « fuir loin de », elle explicite naturellement cette valeur.
- source_word: τῶν κακῶν
  choice: les maux
  rationale: Le neutre pluriel peut viser des actes mauvais, des malheurs ou des exactions. « Les maux » conserve cette ampleur sans restreindre prématurément le sens.
