base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/051.yaml
  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: fr
  text: Souvenez-vous des actes que nos pères ont accomplis en leur temps[a], et recevez une grande gloire et une gloire éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans leurs générations »; on peut aussi comprendre : « à leurs époques respectives ».'
    reason: La formule grecque est inhabituelle et peut renvoyer aux générations successives ou aux temps où vécurent les pères.
lexical_decisions:
- source_word: μνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif aoriste appelle les auditeurs à se rappeler activement les exemples du passé. « Souvenez-vous » est direct, naturel et conserve la force exhortative.
- source_word: τῶν πατέρων ἡμῶν
  choice: nos pères
  rationale: Le grec emploie explicitement le nom masculin πατέρων pour désigner les pères d’Israël. « Nos pères » en conserve la forme et la résonance biblique; « nos ancêtres » serait possible mais moins précis lexicalement.
- source_word: ἔργα ἃ ἐποίησαν
  choice: les actes qu’ils ont accomplis
  rationale: Dans ce contexte, ἔργα désigne les actions mémorables des pères. « Actes » est plus concret que « œuvres », et « accomplir » rend naturellement ἐποίησαν en français.
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: en leur temps
  rationale: La formulation grecque, littéralement « dans leurs générations », désigne vraisemblablement les époques successives où vécurent les pères. « En leur temps » est idiomatique en français moderne, tandis que la formulation littérale est signalée en note afin de préserver l’ambiguïté.
- source_word: δέξασθε
  choice: recevez
  rationale: L’impératif de δέχομαι signifie directement « recevoir ». Cette traduction conserve le parallélisme exhortatif avec « Souvenez-vous » sans expliciter le lien logique entre le souvenir des pères et la gloire promise.
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  choice: une grande gloire et une gloire éternelle
  rationale: La répétition de δόξαν est intentionnellement conservée. « Gloire » maintient le sens élevé d’honneur ou de renom, et αἰώνιον est rendu par « éternelle » sans réduire le terme à la seule réputation humaine.
theological_decisions:
- issue: Désignation masculine des ancêtres d’Israël
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le texte grec emploie un terme familial masculin. Le conserver évite de neutraliser la formulation de la source, tout en laissant le contexte identifier ces pères comme les figures ancestrales d’Israël.
- issue: Nature de la gloire promise
  choice: une grande gloire et une gloire éternelle
  alternative: un grand honneur et un renom impérissable
  rationale: δόξα peut évoquer la gloire, l’honneur ou le renom. La traduction retenue conserve la répétition grecque et ne décide pas si cette gloire est principalement une réputation durable parmi les hommes ou une récompense accordée par Dieu.
- issue: Relation entre les deux impératifs
  choice: et recevez
  alternative: afin de recevoir
  rationale: Le grec coordonne les impératifs par καί. La traduction garde cette coordination plutôt que d’imposer un rapport final ou causal plus explicite que celui du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les deux impératifs ainsi que la répétition solennelle de « gloire », tout en rendant idiomatiquement l’expression grecque relative aux générations.
