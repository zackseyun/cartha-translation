lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josué
  rationale: Dans cette rétrospective des figures fidèles d’Israël, le nom désigne Josué, fils de Noun. La forme française « Josué » identifie naturellement ce personnage sans le confondre avec Jésus.
- source_word: ἐν τῷ πληρῶσαι
  choice: en accomplissant
  rationale: La tournure avec ἐν et l’infinitif substantivé peut exprimer la circonstance temporelle ou le moyen. « En accomplissant » reste naturel en français et conserve cette ouverture.
- source_word: λόγον
  choice: la parole
  rationale: λόγος a ici un sens large. « La parole » préserve la formulation concise du grec sans préciser s’il s’agit d’un ordre, d’une promesse ou d’une affaire.
- source_word: ἐγένετο
  choice: devint
  rationale: ἐγένετο indique l’accès à un état ou à une fonction. « Devint » est l’équivalent français direct et idiomatique.
- source_word: κριτὴς
  choice: juge
  rationale: κριτής signifie directement « juge ». Ce choix conserve la catégorie biblique, sans l’élargir explicitement à « chef » ou « dirigeant ».
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Cette traduction rend directement la préposition ἐν et évite d’accentuer l’idée d’autorité qu’introduirait « sur Israël ».
theological_decisions:
- issue: Nature de « la parole » accomplie par Josué
  choice: Conserver l’expression générale « la parole »
  alternative: « l’ordre », « la promesse » ou « l’affaire »
  rationale: Le grec λόγον n’impose aucune de ces précisions. La formulation retenue préserve l’ambiguïté du texte et n’introduit pas une interprétation narrative ou théologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure grecque tout en étant immédiatement compréhensible. Le passé simple convient au registre narratif biblique et à cette brève rétrospective historique.
