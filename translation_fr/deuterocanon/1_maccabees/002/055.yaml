  text: Josué, en accomplissant[a] la parole[b], devint juge en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « lorsqu’il accomplit la parole » ou « par l’accomplissement de la parole ». La construction grecque peut avoir une valeur temporelle ou instrumentale.'
