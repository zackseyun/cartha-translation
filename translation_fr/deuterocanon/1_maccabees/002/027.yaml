  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: fr
  text: 'Mattathias s’écria d’une voix forte dans la ville : « Que tous ceux qui ont du zèle pour la Loi et qui restent fidèles à l’alliance sortent à ma suite ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: s’écria
  rationale: Le verbe exprime un appel public lancé avec force; « s’écria » en restitue l’intensité dans un français naturel et digne.
- source_word: ἐν τῇ πόλει
  choice: dans la ville
  rationale: La formule rend directement la valeur locative du grec, sans lui donner artificiellement le sens de « dans toute la ville ».
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette tournure française conserve l’image concrète de la voix et l’intensité de l’appel.
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: tous ceux qui ont du zèle pour la Loi
  rationale: « Avoir du zèle pour » exprime l’attachement ardent indiqué par ζηλόω avec le datif. Le pluriel inclusif est idiomatique après l’impératif français « Que… ».
- source_word: νόμῳ
  choice: la Loi
  rationale: Dans ce contexte juif, le terme désigne la Torah; la majuscule signale ce référent déterminé sans ajouter d’explication au texte.
- source_word: ἱστῶν διαθήκην
  choice: restent fidèles à l’alliance
  rationale: Le participe de ἵστημι évoque ici le fait de maintenir ou de soutenir l’alliance, non de l’établir pour la première fois. « Rester fidèles » en communique naturellement la portée active.
- source_word: διαθήκην
  choice: l’alliance
  rationale: Le contexte identifie l’alliance d’Israël avec Dieu; l’article défini est nécessaire et naturel en français.
- source_word: ἐξελθέτω ὀπίσω μου
  choice: sortent et me suivent
  rationale: « Sortent » conserve le déplacement concret exprimé par ἐξέρχομαι, tandis que « me suivent » rend idiomatiquement ὀπίσω μου dans cet appel au ralliement.
theological_decisions:
- issue: Sens de διαθήκη dans le contexte juif de l’alliance
  choice: l’alliance
  alternative: une alliance
  rationale: Il s’agit de l’alliance connue qui unit Israël à Dieu. L’article défini en français en préserve le poids théologique sans préciser davantage que le contexte.
- issue: Portée de ἱστῶν appliqué à l’alliance
  choice: restent fidèles à l’alliance
  alternative: maintiennent l’alliance
  rationale: Le grec décrit le soutien actif et durable de l’alliance plutôt que son établissement initial. La formulation choisie est claire sans imposer une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, public et solennel. La formulation conserve l’intensité de la proclamation et le mouvement narratif de la sortie, tout en évitant le calque peu naturel « sortent derrière moi ».
