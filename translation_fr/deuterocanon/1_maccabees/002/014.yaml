revisions:
- from: Alors Mattathias et ses fils déchirèrent leurs vêtements, se revêtirent de sacs[a] et prirent un grand deuil.
  to: Mattathias et ses fils déchirèrent leurs vêtements, se vêtirent de toile de sac[a] et furent très affligés.
  rationale: 'La révision corrige deux difficultés de français sans modifier le sens : « toile de sac » rend l''habillement rituel évoqué par σάκκους, et « furent très affligés » rend ἐπένθησαν σφόδρα de façon naturelle. La note conserve l''information lexicale importante que le grec emploie un pluriel littéral.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:50:06Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement le geste de deuil (« déchirèrent leurs vêtements »). En revanche, « se revêtirent de sacs » évoque spontanément des contenants en français moderne, et « prirent un grand deuil » n'est ni idiomatique ni une restitution heureuse de ἐπένθησαν σφόδρα. La révision rend le pluriel concret grec par l'expression française établie « toile de sac », tout en le signalant en note, et exprime l'intensité du deuil sans ajouter de nuance confessionnelle.
  naturalness: « Se vêtirent de toile de sac » est clair, digne et naturel dans un français biblique moderne. « Furent très affligés » est une formulation fluide qui exprime le deuil intensif du grec; elle évite l'expression peu naturelle « prirent un grand deuil ».
  terminology: Mattathias est conservé. « Vêtements » correspond bien à ἱμάτια. « Toile de sac » est le terme français usuel pour le vêtement de deuil fait de tissu grossier; la note préserve l'image plurielle de σάκκους.
  issues:
  - severity: medium
    issue: « se revêtirent de sacs » est ambigu en français moderne.
    rationale: Sans contexte explicatif immédiat, « sacs » désigne normalement des contenants plutôt que l'étoffe ou les vêtements de deuil visés par σάκκους.
  - severity: medium
    issue: « prirent un grand deuil » n'est pas idiomatique.
    rationale: Le français dit « prendre le deuil » ou « porter le deuil », mais l'article indéfini et l'intensification proposés produisent une tournure maladroite. Le grec exprime qu'ils se lamentèrent ou furent profondément affligés.
  - severity: low
    issue: La note donne une glose imprécise de l'expression grecque.
    rationale: περιεβάλοντο signifie ici qu'ils se vêtirent/se couvrirent de sacs; « s'enveloppèrent » est possible comme image, mais moins exact et moins direct. La note devrait surtout expliquer que le pluriel « sacs » désigne le tissu de deuil.
  revised_text: Mattathias et ses fils déchirèrent leurs vêtements, se vêtirent de toile de sac[a] et furent très affligés.
  revised_footnotes:
  - marker: a
    text: Le grec emploie littéralement le pluriel « sacs », désignant des vêtements ou une étoffe grossière portés en signe de deuil.
    reason: Préserve la forme plurielle concrète de σάκκους tout en expliquant l'expression française « toile de sac ».
  revision_rationale: 'La révision corrige deux difficultés de français sans modifier le sens : « toile de sac » rend l''habillement rituel évoqué par σάκκους, et « furent très affligés » rend ἐπένθησαν σφόδρα de façon naturelle. La note conserve l''information lexicale importante que le grec emploie un pluriel littéral.'
