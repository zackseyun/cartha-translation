translation:
  language: fr
  text: Mattathias et ses fils déchirèrent leurs vêtements, se vêtirent de toile de sac[a] et furent très affligés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie littéralement le pluriel « sacs », désignant des vêtements ou une étoffe grossière portés en signe de deuil.
    reason: Préserve la forme plurielle concrète de σάκκους tout en expliquant l'expression française « toile de sac ».
lexical_decisions:
- source_word: διέρρηξεν
  choice: déchirèrent
  rationale: Le verbe désigne ici le geste de déchirer ses vêtements en signe de deuil ou d'indignation. Le singulier grec malgré le sujet composé est rendu par un pluriel conforme au français.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: leurs vêtements
  rationale: ἱμάτια désigne de manière générale les vêtements, particulièrement les habits extérieurs. « Leurs vêtements » est naturel et conserve le possessif du grec.
- source_word: περιεβάλοντο σάκκους
  choice: se revêtirent de sacs
  rationale: Le grec emploie le pluriel concret σάκκους pour les habits grossiers portés en signe de deuil. Cette formulation maintient cette image tout en restant intelligible en français.
- source_word: ἐπένθησαν
  choice: prirent le deuil
  rationale: Le verbe exprime le fait de mener deuil. « Prirent le deuil » convient aux gestes rituels qui précèdent sans réduire l'expression à un sentiment intérieur.
- source_word: σφόδρα
  choice: un grand deuil
  rationale: L'intensité portée par σφόδρα est exprimée idiomatiquement par l'adjectif « grand » appliqué au deuil, sans ajouter la nuance non explicite de « amèrement ».
- source_word: Ματταθίας
  choice: Mattathias
  rationale: Translittération française courante du nom personnel grec.
