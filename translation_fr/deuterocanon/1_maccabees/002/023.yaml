base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/023.yaml
  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
translation:
  language: fr
  text: Dès qu’il eut fini de prononcer ces paroles, un homme juif[a] s’avança sous les yeux de tous pour offrir un sacrifice sur l’autel de Modéïn, conformément à l’ordre du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Judéen ». Le grec Ἰουδαῖος peut désigner l’identité juive ou l’origine judéenne; ici, le contexte favorise probablement le premier sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐπαύσατο
  choice: Dès qu’il eut fini
  rationale: Rend naturellement la succession immédiate indiquée par la tournure grecque, sans se limiter au calque « quand il cessa ».
- source_word: λαλῶν τοὺς λόγους τούτους
  choice: de prononcer ces paroles
  rationale: Conserve le contenu explicite de la locution grecque dans un français naturel et digne.
- source_word: προσῆλθεν
  choice: s’avança
  rationale: Exprime l’entrée publique de l’homme dans la scène, devant l’assemblée.
- source_word: ἀνὴρ Ἰουδαῖος
  choice: un homme juif
  rationale: Préserve le masculin singulier de ἀνήρ et rend ici l’identité juive, tout en signalant en note l’autre nuance possible de Ἰουδαῖος.
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: sous les yeux de tous
  rationale: Rend directement l’image grecque tout en employant une expression française courante.
- source_word: θυσιάσαι
  choice: pour offrir un sacrifice
  rationale: L’infinitif exprime le but; cette formulation conserve clairement le sens cultuel.
- source_word: ἐπὶ τοῦ βωμοῦ
  choice: sur l’autel
  rationale: Rendu français normal de la localisation cultuelle indiquée par le grec.
- source_word: ἐν Μωδεείμ
  choice: à Modéïn
  rationale: La préposition française « à » convient à un nom de localité; « Modéïn » est une translittération française reconnaissable de Μωδεείμ.
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: conformément à l’ordre du roi
  rationale: πρόσταγμα désigne un ordre émanant de l’autorité; « conformément à » garde le rapport explicite de conformité.
theological_decisions:
- issue: Sens de Ἰουδαῖος
  choice: un homme juif
  alternative: un Judéen
  rationale: Dans ce contexte de fidélité communautaire et religieuse face à l’ordre royal, l’identité juive paraît dominante. La note maintient toutefois la possibilité que le terme désigne aussi l’origine judéenne.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’enchaînement rapide, le caractère public de l’acte et le vocabulaire cultuel du grec.
