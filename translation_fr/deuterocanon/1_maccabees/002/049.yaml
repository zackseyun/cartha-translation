  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: fr
  text: 'Comme le moment où Mattathias allait mourir approchait, il dit à ses fils : « Maintenant, l’arrogance et l’opprobre se sont solidement établis[a] ; c’est un temps de ruine et de violente colère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont pris force » ; le verbe grec souligne que l’arrogance et l’opprobre se sont affermis et durablement enracinés.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque associe deux mots proches désignant la colère afin d’en renforcer l’intensité. Le texte ne précise pas de qui vient cette colère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι τοῦ Ματταθίου ἀποθανεῖν
  choice: Comme le moment de mourir approchait pour Mattathias
  rationale: Cette formulation française naturelle conserve l’idée temporelle de l’approche de la mort exprimée par ἤγγισαν, sans reproduire maladroitement l’expression grecque « les jours… de mourir ».
- source_word: ἐστηρίχθη
  choice: se sont solidement établis
  rationale: L’aoriste passif de στηρίζω exprime ici l’affermissement ou l’enracinement durable de réalités abstraites ; le pluriel français s’accorde naturellement avec les deux sujets coordonnés.
- source_word: ὑπερηφανία
  choice: l’arrogance
  rationale: Le terme désigne un orgueil hautain et dominateur ; « arrogance » en restitue clairement la portée morale en français moderne.
- source_word: ἔλεγμος
  choice: l’opprobre
  rationale: Dans cette description d’une crise collective, « opprobre » exprime mieux une situation de honte publique et de déshonneur que l’acte ponctuel d’adresser un reproche.
- source_word: καιρὸς καταστροφῆς
  choice: un temps de ruine
  rationale: καιρός désigne un temps marqué ou décisif, et καταστροφή une ruine, une destruction ou un bouleversement ; « temps de ruine » reste concis et menaçant.
- source_word: ὀργὴ θυμοῦ
  choice: violente colère
  rationale: Les deux termes grecs apparentés concernant la colère produisent un effet d’intensification. « Violente colère » évite un calque lourd tout en gardant cette force.
theological_decisions:
- issue: Identification de la colère
  choice: Ne pas préciser de qui vient la colère
  alternative: L’identifier explicitement comme la colère de Dieu ou comme la fureur des persécuteurs
  rationale: Le grec dit seulement ὀργὴ θυμοῦ et n’en nomme pas le sujet ou le possesseur ; la traduction conserve donc cette ambiguïté théologique et narrative.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase d’ouverture est rendue idiomatiquement, tandis que le discours conserve son ton solennel et sa structure resserrée. Les notes maintiennent les nuances lexicales et l’ambiguïté concernant la colère.
