  source_fidelity: 'Le texte rend fidèlement les trois actions coordonnées : l’aide apportée par les frères et les adhérents au père, puis le combat mené avec joie. Les imparfaits grecs sont bien reflétés par « apportaient » et « menaient », et le plus-que-parfait « s’étaient attachés » convient à l’aoriste indiquant une adhésion antérieure. « Le combat d’Israël » conserve sans la trancher la portée du génitif Ἰσραήλ.'
