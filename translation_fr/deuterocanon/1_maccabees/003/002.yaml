  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: fr
  text: Tous ses frères lui apportaient leur aide, ainsi que tous ceux qui s’étaient attachés à son père, et ils menaient le combat d’Israël dans la joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ils faisaient la guerre pour Israël avec joie ». Plus littéralement, le grec dit : « ils combattaient le combat d’Israël dans la joie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθουν
  choice: lui apportaient leur aide
  rationale: L’imparfait indique une aide continue dans le cadre du récit. Cette tournure est naturelle en français et conserve l’aspect duratif.
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: tous ses frères
  rationale: Il s’agit ici des frères de Judas, les fils de Mattathias, et non d’associés au sens large.
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: tous ceux qui s’étaient attachés à son père
  rationale: Le verbe κολλάω exprime le fait de se joindre étroitement à quelqu’un ou d’adhérer à sa cause. « S’étaient attachés » préserve cette image sans préciser davantage la nature de leur engagement.
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: menaient le combat
  rationale: La construction grecque est littéralement « combattaient le combat ». « Menaient le combat » rend naturellement en français l’action militaire prolongée exprimée par l’imparfait, tout en conservant un substantif comme objet.
- source_word: Ἰσραήλ
  choice: d’Israël
  rationale: Le génitif est conservé sans décider explicitement entre l’appartenance (« le combat d’Israël ») et le bénéfice (« le combat pour Israël »).
- source_word: μετʼ εὐφροσύνης
  choice: dans la joie
  rationale: Cette expression française actuelle et digne rend la joie ou l’entrain avec lesquels ils combattaient.
theological_decisions:
- issue: Portée de « τὸν πόλεμον Ἰσραήλ »
  choice: le combat d’Israël
  alternative: le combat pour Israël
  rationale: Le génitif grec peut présenter cette guerre comme celle d’Israël ou comme un combat mené pour Israël. Le texte principal conserve la formulation ouverte, tandis que la note signale l’autre compréhension sans transformer l’expression en slogan théologique.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend les actions continues du grec. La syntaxe reste accessible tout en conservant l’ambiguïté du génitif « d’Israël ».
