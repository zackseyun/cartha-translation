  text: and he became afraid that he might not have enough[a], as once and twice before, for the expenses and the gifts that he had formerly given with a generous hand,
translation:
  language: fr
  text: Il craignit de ne pas avoir, comme auparavant, de quoi couvrir les dépenses et les dons qu’il accordait autrefois d’une main généreuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλαβήθη
  choice: Il craignit
  rationale: Le verbe exprime ici la crainte devant une possible insuffisance de ressources; le passé simple rend naturellement l’aoriste et son aspect ponctuel dans le récit.
- source_word: μὴ οὐκ ἔχῃ
  choice: de ne pas avoir assez
  rationale: La construction introduit l’objet de la crainte. « Assez » explicite sans excès la suffisance financière impliquée par les dépenses et les dons qui suivent.
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: comme il en avait eu à plusieurs reprises
  rationale: La tournure idiomatique « une fois et deux fois » évoque des occasions antérieures répétées plutôt qu’un décompte strict de deux occurrences.
- source_word: δαπάνας
  choice: les dépenses
  rationale: Équivalent financier direct et courant, adapté au contexte des finances royales.
- source_word: δόματα
  choice: les dons
  rationale: Terme assez large pour désigner les présents ou libéralités distribués par le roi sans imposer un sens administratif trop précis.
- source_word: ἐδίδου
  choice: qu’il accordait
  rationale: L’imparfait grec décrit une pratique habituelle dans le passé; l’imparfait français conserve cette valeur.
- source_word: ἔμπροσθεν
  choice: autrefois
  rationale: L’adverbe a ici une valeur temporelle et renvoie à la période antérieure où le roi distribuait généreusement ses dons.
- source_word: δαψιλῇ χειρί
  choice: d’une main généreuse
  rationale: Cette formulation conserve la métaphore grecque tout en exprimant clairement la largesse.
