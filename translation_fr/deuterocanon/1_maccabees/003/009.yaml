  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
translation:
  language: fr
  text: Et son nom devint célèbre jusqu’aux extrémités de la terre[a], et il rassembla ceux qui périssaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fut nommé jusqu’à l’extrémité de la terre » ; l’expression peut signifier que son nom ou sa renommée se répandit jusqu’aux régions les plus lointaines.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui étaient en train d’être détruits » ou « ceux qui étaient ruinés ». Le grec peut désigner des personnes qui périssaient ou qui étaient menacées de destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: son nom devint célèbre
  rationale: L’aoriste passif signifie littéralement « fut nommé », mais, dans ce contexte, l’expression évoque la diffusion de son nom et de sa renommée. Cette formulation française rend naturellement l’idiome sans réduire le verbe au simple fait d’être appelé d’un nom.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: jusqu’aux extrémités de la terre
  rationale: L’expression désigne les régions les plus lointaines. Le pluriel est idiomatique en français et conserve la portée géographique très large du grec.
- source_word: συνήγαγεν
  choice: il rassembla
  rationale: L’aoriste de συνάγω signifie directement « rassembler » ou « réunir » ; « rassembla » convient au contexte collectif et militaire.
- source_word: ἀπολλυμένους
  choice: ceux qui couraient à leur perte
  rationale: Le participe présent moyen-passif décrit des personnes engagées dans un processus de ruine, en péril ou en train de périr. La formule exprime cet état continu sans en faire une catégorie théologique.
theological_decisions:
- issue: Portée de ἀπολλυμένους
  choice: ceux qui couraient à leur perte
  alternative: les perdus
  rationale: « Les perdus » pourrait suggérer en français une condition spirituelle déterminée. Le contexte décrit plus probablement des personnes menacées de ruine ou de destruction ; la traduction choisie préserve cette tension.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La coordination répétée par « et » conserve la structure simple du grec ; « son nom devint célèbre » explicite avec retenue l’idiome grec.
