  terminology: « Étrangers » restitue idiomatiquement υἱοὺς ἀλλοτρίους; le masculin pluriel conserve la forme masculine du grec sans ajouter l’idée que ces hommes seraient les fils de parents étrangers. La note maintient utilement la littéralité « fils étrangers ».
