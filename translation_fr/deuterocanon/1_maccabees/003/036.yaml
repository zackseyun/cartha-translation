  source_fidelity: 'Le projet rend correctement κατοικίσαι (« établir »), l’étendue de ἐν πᾶσι τοῖς ὁρίοις αὐτῶν (« dans tous leurs territoires ») et le tirage au sort impliqué par κατακληρονομῆσαι. Toutefois, « fils d’étrangers » ne correspond pas à la syntaxe grecque : ἀλλοτρίους qualifie « fils » et ne désigne pas leurs parents. « Puis » introduit en outre une succession que la simple coordination grecque n’explicite pas.'
