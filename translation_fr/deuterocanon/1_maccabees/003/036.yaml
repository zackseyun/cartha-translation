  text: and to settle foreigners throughout all their territories[a], and to distribute their land by lot.
translation:
  language: fr
  text: et d’établir des étrangers[a] dans tous leurs territoires, et de répartir leur terre par tirage au sort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, littéralement, « des fils étrangers ». Cette expression peut désigner idiomatiquement des étrangers.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίσαι
  choice: établir
  rationale: L’infinitif aoriste de κατοικίζω exprime ici l’action de faire habiter durablement une population dans le pays; « établir » conserve ce sens causatif en français naturel.
- source_word: υἱοὺς ἀλλοτρίους
  choice: des fils d’étrangers
  rationale: Cette formulation garde la référence masculine explicite de υἱούς et rend l’idée de personnes issues d’un autre peuple. Une note indique le sens idiomatique probable.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: dans tous leurs territoires
  rationale: Dans ce contexte, ὅρια désigne les régions comprises dans leurs limites, et non les seules lignes frontalières.
- source_word: κατακληρονομῆσαι
  choice: partager … par tirage au sort
  rationale: Le verbe évoque la répartition d’un bien en lots ou en parts d’héritage; cette traduction conserve explicitement l’idée du sort.
- source_word: τὴν γῆν αὐτῶν
  choice: leur terre
  rationale: Traduction directe de γῆ, qui désigne ici le territoire appartenant au peuple visé.
theological_decisions:
- issue: Rendu de l’expression masculine υἱοὺς ἀλλοτρίους
  choice: des fils d’étrangers
  alternative: des étrangers
  rationale: Le grec emploie explicitement « fils », probablement dans une tournure d’influence sémitique désignant des étrangers. Le texte principal en conserve la forme genrée, tandis que la note fournit le sens idiomatique sans effacer la tension lexicale.
translation_notes:
  register: Français moderne, digne et accessible. « Établir » est employé transitivement au sens d’installer comme habitants; « puis » articule naturellement les deux mesures successives sans modifier leur coordination fondamentale.
