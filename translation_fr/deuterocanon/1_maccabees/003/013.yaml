  source_fidelity: 'La traduction rend correctement les principaux termes : « apprit », « chef de l’armée de Syrie », « avait rassemblé », « troupe », « assemblée » et « fidèles ». Toutefois, la relative « qui partaient au combat » ne porte dans la rédaction actuelle que sur « fidèles » et ne rend pas explicitement la coordination grecque finale, qui peut désigner aussi « ceux qui partaient à la guerre ». La révision conserve cette coordination sans trancher indûment la portée exacte de la construction compacte.'
