  terminology: « Chef de l’armée de Syrie », « assemblée » et « fidèles » conviennent au contexte. « Assemblée » évite à juste titre l’anachronisme institutionnel d’« Église ». « Troupe » est acceptable pour ἄθροισμα, avec une note qui maintient le sens plus général de groupe réuni.
  issues:
