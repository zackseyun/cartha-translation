base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: fr
  text: Séron, chef de l’armée de Syrie, apprit que Judas avait rassemblé une troupe[a] et une assemblée de fidèles avec lui et de ceux qui partaient à la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un groupe rassemblé » ; le grec peut désigner simplement un ensemble de personnes réunies, avec ici une possible nuance militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce récit, ἀκούω signifie que Séron reçoit la nouvelle; « apprit » est plus naturel en français narratif que le calque « entendit ».
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: chef de l’armée de Syrie
  rationale: ἄρχων désigne ici le responsable militaire, et δύναμις une force armée. Cette formulation reste proche du génitif grec sans supposer un grade militaire précis.
- source_word: ἤθροισεν
  choice: avait rassemblé
  rationale: Le verbe exprime l’action de réunir; le plus-que-parfait marque naturellement en français l’antériorité par rapport à la nouvelle reçue par Séron.
- source_word: ἄθροισμα
  choice: une troupe
  rationale: Le nom désigne un groupe réuni et peut prendre ici une nuance militaire; « troupe » rend cette nuance sans en faire nécessairement une armée constituée.
- source_word: ἐκκλησίαν
  choice: une assemblée
  rationale: Dans ce contexte juif antérieur au christianisme, « assemblée » évite d’importer le sens institutionnel ultérieur d’« Église ».
- source_word: πιστῶν
  choice: de fidèles
  rationale: Le terme peut évoquer à la fois la fidélité religieuse et la loyauté envers Judas; « fidèles » conserve cette double portée.
- source_word: μεθʼ αὐτοῦ
  choice: avec lui
  rationale: Rend directement l’idée d’accompagnement, tout en conservant la portée syntaxique légèrement ouverte de la formule grecque.
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: qui partaient au combat
  rationale: La tournure exprime le départ pour la guerre. « Au combat » est naturel et digne en français, sans suggérer une campagne entière au-delà du contexte.
theological_decisions:
- issue: Sens de ἐκκλησίαν dans un contexte juif militaire et religieux du Second Temple
  choice: une assemblée
  alternative: une communauté; une Église
  rationale: « Assemblée » correspond au sens contextuel sans projeter sur le texte une institution chrétienne plus tardive.
- issue: Portée de πιστῶν
  choice: de fidèles
  alternative: de partisans loyaux
  rationale: Le grec permet une fidélité à la fois communautaire, religieuse et personnelle. « Fidèles » préserve cette tension, tandis que « partisans » réduirait le sens à la seule cause politique ou militaire.
- issue: Rattachement de ἐκπορευομένων εἰς πόλεμον
  choice: qui partaient au combat, rattaché naturellement aux fidèles de l’assemblée
  alternative: et de ceux qui partaient au combat, comme second groupe distinct
  rationale: Le participe génitif coordonné à πιστῶν décrit le plus naturellement les membres de l’assemblée. La syntaxe grecque reste toutefois compacte et peut laisser percevoir une distinction rhétorique entre « les fidèles » et « ceux qui partaient au combat ».
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite le calque lourd de la coordination grecque tout en conservant les deux termes collectifs, « troupe » et « assemblée ». Les notes signalent les principales ambiguïtés lexicales sans les résoudre de manière confessionnelle.
