  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: fr
  text: Les hommes sans loi furent refoulés par peur de lui, et tous ceux qui pratiquaient l’injustice furent troublés, et la délivrance prospéra par sa main[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le salut prospéra par sa main ». Le grec σωτηρία peut désigner la délivrance ou le salut ; dans ce contexte, « délivrance » convient bien. L’expression « par sa main » indique que cette réussite s’accomplit par son action ou sa puissance.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: συνεστάλησαν
  choice: reculèrent
  rationale: Dans ce récit de conflit, le passif exprime le fait d’être refoulés ou contraints à reculer. Le français emploie naturellement l’actif à valeur résultative ici.
- source_word: οἱ ἄνομοι
  choice: les gens sans loi
  rationale: Cette expression rend la caractérisation par l’absence ou le rejet de la loi, plutôt qu’une méchanceté générique.
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: par peur de lui
  rationale: La préposition marque ici la cause; la formulation est concise et naturelle en français moderne.
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: tous ceux qui pratiquaient l’injustice
  rationale: Cette tournure idiomatique conserve l’idée d’une activité habituelle, même si elle ne reproduit pas littéralement l’image des « ouvriers ».
- source_word: συνεταράχθησαν
  choice: furent bouleversés
  rationale: Le verbe exprime une forte agitation ou perturbation; « bouleversés » préserve cette latitude sans préciser indûment s’il s’agit de terreur ou de désordre militaire.
- source_word: εὐωδώθη
  choice: prospéra
  rationale: Le verbe signifie réussir, connaître une issue favorable ou prospérer. « Prospéra » garde la tournure frappante du grec.
- source_word: σωτηρία
  choice: la délivrance
  rationale: Dans ce contexte historique et militaire, le terme désigne surtout le secours ou la libération, tout en conservant une portée plus large que la seule victoire.
- source_word: ἐν χειρὶ αὐτοῦ
  choice: entre ses mains
  rationale: Cette expression française préserve l’image biblique de la main comme sphère d’action, de pouvoir ou d’agence.
theological_decisions:
- issue: Sens de σωτηρία dans un contexte militaire deutérocanonique
  choice: la délivrance
  alternative: le salut; la victoire
  rationale: « Délivrance » convient au secours national et militaire décrit ici, sans imposer un sens sotériologique plus étroit ni réduire le terme à une victoire au combat.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme du grec et son image finale, tout en évitant un calque peu naturel de « ceux qui œuvrent à l’illégalité ».
