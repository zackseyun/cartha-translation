  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: fr
  text: Ils apportèrent les vêtements sacerdotaux, les prémices et les dîmes, puis ils firent avancer les naziréens qui avaient accompli le nombre de jours prescrit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui avaient accompli les jours » ; il s’agit de la période prescrite pour leur vœu de naziréat.'
    reason: La note conserve la formulation littérale du grec et explique son sens dans le contexte rituel.
lexical_decisions:
- source_word: ἤνεγκαν
  choice: ils apportèrent
  rationale: L’aoriste de φέρω désigne ici le fait d’apporter en un lieu des objets destinés au culte.
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: les vêtements sacerdotaux
  rationale: Cette formulation naturelle désigne clairement les vêtements associés au service des prêtres, sans recourir au terme plus ecclésiastique « ornements ».
- source_word: τὰ πρωτογεννήματα
  choice: les prémices
  rationale: Dans ce contexte cultuel, à côté des dîmes, le mot désigne les premiers produits offerts à Dieu. « Prémices » est le terme français consacré et demeure compréhensible.
- source_word: τὰς δεκάτας
  choice: les dîmes
  rationale: C’est l’équivalent biblique usuel des dixièmes consacrés.
- source_word: ἤγειραν
  choice: ils firent avancer
  rationale: Le verbe signifie littéralement « ils firent se lever ». Avec des personnes dans cette scène publique, il indique vraisemblablement qu’on les fit s’avancer ou comparaître.
- source_word: τοὺς Ναζιραίους
  choice: les naziréens
  rationale: Ce terme technique désigne les personnes consacrées par le vœu prévu dans la Torah. La translittération française préserve cette institution religieuse particulière.
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: qui avaient accompli le nombre de jours prescrit
  rationale: Le grec dit littéralement « qui avaient accompli les jours ». La formulation française explicite seulement qu’il s’agit de la durée déterminée, sans ajouter dans le texte principal la mention absente du « vœu ».
theological_decisions:
- issue: Traduction du terme technique Ναζιραίους
  choice: les naziréens
  alternative: ceux qui avaient fait un vœu de naziréat
  rationale: Le substantif grec nomme une catégorie précise de personnes consacrées selon la Torah. Le terme technique conserve cette référence historique et religieuse sans transformer le texte en paraphrase.
- issue: Sens de l’accomplissement des jours
  choice: qui avaient accompli le nombre de jours prescrit
  alternative: qui avaient achevé les jours de leur vœu
  rationale: Le contexte renvoie à la période du naziréat, mais le grec ne répète pas explicitement « de leur vœu ». Le texte principal garde cette retenue, tandis que la note en précise le sens idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné du grec est conservé, avec « puis » pour clarifier le passage des objets apportés aux personnes que l’on fait avancer. Le terme « naziréens » maintient la précision historique sans coloration confessionnelle.
