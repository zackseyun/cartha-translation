  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: fr
  text: Il vit que l’argent avait disparu des trésors et que les recettes du pays étaient maigres, à cause de la discorde et de la calamité qu’il avait attirée sur le pays en supprimant les prescriptions établies depuis les premiers temps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en supprimant les coutumes » ou « les ordonnances » établies depuis les premiers temps. Le grec désigne des normes, usages ou prescriptions de longue date.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  choice: l’argent était épuisé dans les trésors
  rationale: Le grec décrit l’épuisement des fonds disponibles. « Argent » garde le sens concret et monétaire de ἀργύριον, tandis que le pluriel « trésors » respecte θησαυρῶν.
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: les revenus du pays étaient faibles
  rationale: φόροι peut désigner les taxes, tributs ou recettes fiscales. Dans cette construction, « revenus » et « faibles » expriment naturellement en français la diminution des rentrées fiscales sans limiter indûment le terme à un seul type d’impôt.
- source_word: χάριν τῆς διχοστασίας
  choice: à cause de la discorde
  rationale: διχοστασία évoque une division conflictuelle ou une dissension. « Discorde » rend cette dimension politique et sociale dans un français courant et digne.
- source_word: πληγῆς ἧς κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: du fléau qu’il avait attiré sur le pays
  rationale: πληγή peut désigner un coup, une plaie ou une calamité. « Fléau » conserve cette amplitude, et « avait attiré sur » rend l’idée de faire venir une affliction sur le pays.
- source_word: τοῦ ἆραι τὰ νόμιμα
  choice: en abolissant les coutumes établies
  rationale: Le génitif de l’infinitif explique ici comment le dommage a été causé. ἆραι signifie enlever ou supprimer, et νόμιμα désigne des usages normatifs, coutumes ou prescriptions reconnues.
- source_word: ἀφʼ ἡμερῶν τῶν πρώτων
  choice: depuis les temps anciens
  rationale: Cette expression temporelle renvoie à une pratique remontant aux temps antérieurs; la formulation française est naturelle et évite un littéralisme obscur comme « depuis les premiers jours ».
