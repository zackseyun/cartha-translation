  text: And he hunted down the lawless[a], searching them out[b], and he burned those who troubled his people.
translation:
  language: fr
  text: Il poursuivit les hommes sans loi[a], en les recherchant, et brûla ceux qui maltraitaient son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « poursuivit ceux qui vivaient sans loi » ; le terme grec comporte une dimension morale autant que juridique.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi être rendu par « embrasa » ou « mit le feu à ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: traqua
  rationale: Le verbe exprime une poursuite active et déterminée. « Traqua » s’accorde naturellement avec le participe qui décrit la recherche menée pour retrouver ces hommes.
- source_word: ἀνόμους
  choice: les hommes sans loi
  rationale: Cette expression conserve la portée à la fois morale et juridique du grec, sans réduire ces personnes à de simples criminels au sens civil.
- source_word: ἐξερευνῶν
  choice: les recherchant avec soin
  rationale: Le participe évoque une recherche approfondie et insistante. Cette formulation explicite cette intensité sans ajouter de résultat absent du grec.
- source_word: παράσσοντας
  choice: ceux qui semaient le trouble parmi
  rationale: Le participe désigne ceux qui causaient du désordre ou du tort au peuple. « Semaient le trouble » rend cette action de manière naturelle sans préciser indûment la forme de l’hostilité.
- source_word: ἐφλόγισεν
  choice: livra aux flammes
  rationale: Le verbe désigne une action par le feu. Cette formulation française, forte mais naturelle, maintient sans l’atténuer la violence exprimée par le grec.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: « Son peuple » rend directement le collectif λαός et convient au contexte national et communautaire.
theological_decisions:
- issue: Portée morale et juridique de ἀνόμους
  choice: les hommes sans loi
  alternative: les impies ; les hors-la-loi
  rationale: « Les hommes sans loi » préserve la tension entre transgression morale, religieuse et communautaire. « Les impies » privilégierait la dimension religieuse, tandis que « les hors-la-loi » évoquerait surtout la criminalité civile.
- issue: Violence exprimée par ἐφλόγισεν
  choice: livra aux flammes
  alternative: brûla ; embrasa
  rationale: Le texte grec présente l’acte sans l’expliquer ni l’atténuer. La traduction en maintient donc la sévérité, sans préciser s’il s’agit d’une exécution, d’un incendie ou d’une autre modalité que le contexte immédiat ne définit pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Traqua » et « livra aux flammes » restituent l’énergie et la dureté du grec ; les notes signalent les principales possibilités lexicales sans imposer une interprétation confessionnelle.
