review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Judas poursuit activement les ἀνόμους, les recherchant, puis brûle ceux qui nuisent à son peuple. Toutefois, « livra aux flammes » n’est pas une équivalence suffisamment directe de ἐφλόγισεν : cette expression peut suggérer qu’il les remet à un feu ou à d’autres agents, alors que le grec attribue directement l’action de brûler au sujet.'
  naturalness: « Il traqua … les recherchant avec soin » est compréhensible et vigoureux, mais l’enchaînement est légèrement redondant. « Poursuivit … en les recherchant » est plus neutre, fluide et garde l’intensification du participe. « Hommes sans loi » est acceptable dans un registre biblique moderne et conserve utilement l’ambiguïté morale et juridique.
  terminology: « Hommes sans loi » préserve la portée de ἀνόμους sans la réduire à la seule criminalité civile. « Maltraitaient son peuple » rend naturellement παράσσοντας, qui évoque une atteinte nuisible ou un harcèlement, avec davantage de précision que « semaient le trouble » sans imposer une forme particulière d’oppression. « Brûla » traduit directement ἐφλόγισεν.
