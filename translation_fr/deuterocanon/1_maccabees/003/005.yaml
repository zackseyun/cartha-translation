revisions:
- from: Il traqua les hommes sans loi[a], les recherchant avec soin, et livra aux flammes ceux qui semaient le trouble parmi son peuple[b].
  to: Il poursuivit les hommes sans loi[a], en les recherchant, et brûla ceux qui maltraitaient son peuple[b].
  rationale: La révision rend explicitement l’action directe exprimée par ἐφλόγισεν, tout en conservant la force de la poursuite et la recherche exprimées par ἐδίωξεν et ἐξερευνῶν. Elle maintient pour ἀνόμους une formulation française qui ne tranche pas entre délinquance civile, désordre communautaire et faute morale. Les notes sont ajustées pour correspondre précisément aux alternatives lexicales.
