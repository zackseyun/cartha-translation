  yaml_path: translation/deuterocanon/1_maccabees/003/039.yaml
  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: fr
  text: Il envoya avec eux quarante mille hommes et sept mille cavaliers[a], pour venir dans le pays de Juda et le détruire, selon la parole du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sept mille chevaux » ; dans cette énumération militaire, le grec emploie vraisemblablement « cheval » par métonymie pour désigner des troupes montées.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon l’ordre du roi ». Le grec dit littéralement « selon la parole du roi », le mot « parole » ayant ici, dans le contexte, la valeur d’un ordre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: Il envoya
  rationale: L’aoriste indique ici l’envoi de troupes avec les chefs mentionnés auparavant. « Envoya » est direct, naturel et fidèle.
- source_word: μετʼ αὐτῶν
  choice: avec eux
  rationale: La locution indique que les troupes accompagnaient les personnages précédemment mentionnés.
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: quarante mille hommes
  rationale: ἀνδρῶν signifie littéralement « hommes ». Le contexte militaire est clair sans qu’il soit nécessaire d’expliciter « soldats ».
- source_word: ἑπτακισχιλίον ἵππον
  choice: sept mille cavaliers
  rationale: Bien que ἵππος désigne littéralement le cheval, le singulier collectif est employé ici par métonymie pour une troupe montée. « Cavaliers » exprime naturellement ce sens militaire tout en conservant le dénombrement des personnes.
- source_word: τοῦ ἐλθεῖν
  choice: pour venir
  rationale: L’infinitif articularisé exprime le but. « Pour venir » conserve directement le mouvement exprimé par ἐλθεῖν, sans le remplacer par « aller » ou « se rendre ».
- source_word: εἰς γῆν Ἰούδα
  choice: dans la terre de Juda
  rationale: Cette formulation suit de près γῆν Ἰούδα et évite de substituer le nom régional plus interprétatif « Judée ».
- source_word: καταφθεῖραι αὐτήν
  choice: et la détruire
  rationale: Le pronom féminin αὐτήν reprend γῆν, « terre ». « Détruire » restitue la force générale de καταφθείρω sans préciser indûment la manière de la dévastation.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: conformément à la parole du roi
  rationale: « Parole » préserve le terme λόγος et son expression concrète, tandis que le contexte royal lui donne naturellement valeur d’ordre.
