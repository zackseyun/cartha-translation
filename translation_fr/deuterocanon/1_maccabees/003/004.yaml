  text: And he was like a lion in his deeds[a], and like a lion’s cub roaring for prey.
translation:
  language: fr
  text: Il était semblable à un lion dans ses exploits, à un lionceau rugissant en quête d’une proie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡμοιώθη
  choice: était semblable à
  rationale: Le passif exprime ici une comparaison plutôt qu’une transformation. Cette tournure française est naturelle et conserve explicitement la valeur de la similitude.
- source_word: Λέοντι
  choice: un lion
  rationale: Le datif désigne le terme de la comparaison; « semblable à un lion » est l’expression idiomatique en français.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: dans ses exploits
  rationale: Dans ce récit guerrier et héroïque, ἔργα renvoie à ses actions remarquables. « Exploits » restitue ce contexte avec concision sans donner au mot un sens théologique particulier.
- source_word: σκύμνος
  choice: un lionceau
  rationale: Le terme désigne un jeune lion. « Lionceau » est précis, courant et maintient la distinction avec le lion adulte de la première proposition.
- source_word: ἐρυγόμενος
  choice: rugissant
  rationale: Le participe évoque le cri puissant du jeune lion dans un contexte de chasse; « rugissant » est le terme français naturel pour cette image.
- source_word: εἰς θήραν
  choice: en quête d’une proie
  rationale: La préposition εἰς marque ici l’orientation ou la visée, et θήρα peut désigner la chasse ou le gibier recherché. La formule française conserve l’image prédatrice et exprime naturellement cette visée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le parallélisme des deux comparaisons léonines est conservé, avec « exploits » adapté au cadre martial et « en quête d’une proie » pour rendre naturellement l’orientation exprimée par εἰς θήραν.
