  text: And they took their equipment[a], and Judas took the sword of Apollonius, and he fought with it all his days.
translation:
  language: fr
  text: Ils prirent leur équipement, et Judas prit l’épée d’Apollonius. Il continua de combattre avec elle tous les jours de sa vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les jours »; dans ce contexte, l’expression désigne probablement tous les jours qui restaient à Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: équipement
  rationale: Dans ce contexte militaire, le terme désigne largement le matériel ou l’équipement; cette traduction évite de préciser qu’il s’agissait uniquement d’armes ou de butin.
- source_word: μάχαιραν
  choice: épée
  rationale: Le mot peut désigner une lame relativement courte, mais « épée » est ici le terme français naturel sans précision excessive.
- source_word: ἦν πολεμῶν
  choice: continua de combattre
  rationale: La construction périphrastique avec ἦν et le participe exprime une action prolongée ou habituelle; « continua de combattre » en restitue la valeur durative.
- source_word: ἐν αὐτῇ
  choice: avec elle
  rationale: Le pronom féminin renvoie naturellement à l’épée; « avec elle » rend en français la valeur instrumentale de l’expression.
- source_word: πάσας τὰς ἡμέρας
  choice: tous les jours de sa vie
  rationale: Littéralement « tous les jours », l’expression signifie vraisemblablement ici durant le reste de la vie de Judas; la note conserve la formulation plus littérale comme possibilité.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition grecque du verbe « prendre » est conservée, tandis qu’une coupure de phrase rend l’enchaînement naturel. Le référent féminin de « elle » reste explicitement l’épée.
