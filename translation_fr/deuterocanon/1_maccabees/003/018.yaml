  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: fr
  text: 'Judas dit : « Il est facile qu’un grand nombre tombe aux mains de quelques-uns[a], et devant le Ciel[b], il n’y a aucune différence entre sauver par un grand nombre ou par un petit nombre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « soit enfermé dans les mains de quelques-uns » ; le verbe grec évoque le fait d’être encerclé ou pris au piège, donc de tomber au pouvoir d’autrui.'
    reason: lexical_alternative
  - marker: b
    text: '« Le Ciel » est probablement ici une manière révérencielle de désigner Dieu ; on pourrait aussi comprendre : « devant Dieu » ou « aux yeux de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν
  choice: il est facile
  rationale: L’adjectif avec ἐστιν forme une expression impersonnelle indiquant qu’une chose est aisée ou peut facilement se produire.
- source_word: συγκλεισθῆναι
  choice: tombe aux mains de
  rationale: Le verbe passif signifie littéralement « être enfermé, enclos » et exprime ici le fait d’être pris au piège et livré au pouvoir d’autrui. La tournure française est naturelle et conserve l’image idiomatique des « mains » présente dans le grec.
- source_word: πολλοὺς ... ἐν χερσὶν ὀλίγων
  choice: un grand nombre ... aux mains de quelques-uns
  rationale: Cette formulation maintient le contraste central entre la multitude et le petit nombre, sans ajouter explicitement « hommes », absent du grec.
- source_word: διαφορὰ
  choice: aucune différence
  rationale: Rend directement l’expression οὐκ ἔστι διαφορὰ sans lui donner le sens plus interprétatif d’« avantage ».
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: devant le Ciel
  rationale: « Devant » exprime la présence ou le regard, et « le Ciel » conserve la circonlocution révérencielle du texte grec au lieu de la remplacer par « Dieu ».
- source_word: σῴζειν
  choice: sauver
  rationale: Le verbe peut désigner la délivrance, notamment militaire dans ce contexte, mais « sauver » préserve sa portée plus large ainsi que l’absence d’objet explicite.
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: par un grand nombre ou par un petit nombre
  rationale: « Par » restitue la valeur instrumentale probable de ἐν, tandis que la symétrie de la formulation française souligne l’opposition du grec.
theological_decisions:
- issue: Emploi révérenciel de « ciel » dans ἐναντίον τοῦ οὐρανοῦ
  choice: Conserver « le Ciel » dans le texte principal
  alternative: « devant Dieu » ou « aux yeux de Dieu »
  rationale: Le grec nomme explicitement le ciel, probablement comme manière révérencielle de parler de Dieu. La traduction maintient cette formulation et signale son sens probable en note, sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Tomber aux mains de » évite un calque peu naturel tout en conservant l’expression grecque de la puissance exercée par les « mains ». La majuscule à « Ciel » aide à signaler l’emploi personnel et révérenciel sans substituer explicitement « Dieu » au texte source.
