  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: fr
  text: Il rehaussa la gloire de son peuple[a] ; il revêtit une cuirasse, tel un géant[b], et se ceignit de ses armes de guerre. Il organisa des combats[c], protégeant le camp avec l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accrut l’honneur » ou « le renom de son peuple ». Le verbe grec signifie littéralement « élargir » et s’emploie ici au sens figuré.
    reason: lexical_alternative
  - marker: b
    text: « Tel un géant » peut aussi être compris plus généralement au sens de « tel un puissant guerrier » ou « tel un champion » ; le mot grec signifie littéralement « géant ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mena des guerres » ou « engagea des combats ». L’expression grecque peut mettre l’accent sur l’organisation et la conduite de l’action militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν δόξαν
  choice: rehaussa la gloire
  rationale: Le verbe signifie littéralement « élargir » et, au sens figuré, « accroître ». « Rehausser la gloire » exprime naturellement en français l’augmentation de l’honneur ou du renom, tout en gardant un registre élevé.
- source_word: τῷ λαῷ αὐτοῦ
  choice: de son peuple
  rationale: λαός désigne ici le peuple comme collectivité nationale. « Son peuple » reste direct sans préciser davantage l’identité ethnique.
- source_word: ἐνεδύσατο θώρακα
  choice: revêtit une cuirasse
  rationale: θώραξ désigne précisément la cuirasse. « Revêtit » conserve l’image de l’habillement militaire dans un français digne et intelligible.
- source_word: ὡς γίγας
  choice: comme un géant
  rationale: γίγας signifie littéralement « géant » et produit ici une comparaison héroïque. La formulation française en conserve la vigueur et l’ambiguïté possible entre stature et vaillance.
- source_word: συνεζώσατο τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: attacha ses armes de guerre
  rationale: Le verbe évoque le fait de ceindre ou fixer son équipement. « Attacha » est actuel, tandis que « armes de guerre » rend la valeur militaire de σκεύη πολεμικά sans archaïsme.
- source_word: πολέμους συνεστήσατο
  choice: organisa des combats
  rationale: L’expression peut désigner l’organisation, la conduite ou l’entreprise d’actions militaires. « Organisa des combats » préserve la nuance d’ordonnancement sans la réduire à la seule participation.
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: protégeant le camp
  rationale: σκεπάζω exprime ici une action de couverture protectrice, et παρεμβολή désigne le camp ou le campement militaire.
- source_word: ἐν ῥομφαίᾳ
  choice: par l’épée
  rationale: La préposition ἐν a ici une valeur instrumentale. ῥομφαία désigne une grande épée, mais « l’épée » suffit naturellement dans ce contexte.
