base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/052.yaml
  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
translation:
  language: fr
  text: Et voici, les nations se sont rassemblées contre nous pour nous faire disparaître[a] ; toi, tu sais ce qu’elles projettent contre nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour nous détruire » ou « pour nous éliminer ». Le verbe grec peut exprimer l’idée d’enlever, de supprimer ou de faire disparaître complètement.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qu’elles trament contre nous » ; le verbe grec évoque ici un dessein calculé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la force déictique et l’urgence de l’appel, dans un registre français actuel et digne.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Cette expression rend directement le grec et désigne ici les peuples non juifs hostiles à Israël, sans recourir au terme plus chargé de « païens ».
- source_word: συνῆκται
  choice: se sont rassemblées
  rationale: Le parfait grec décrit un rassemblement accompli dont le résultat demeure présent.
- source_word: ἐφʼ ἡμᾶς
  choice: contre nous
  rationale: Dans ce contexte militaire hostile, la préposition exprime nettement l’opposition dirigée contre le groupe qui prie.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: pour nous faire disparaître
  rationale: L’infinitif articulé exprime le but. « Faire disparaître » préserve l’image d’une suppression totale sans imposer un terme plus précis que le grec.
- source_word: σὺ οἶδας
  choice: toi, tu sais
  rationale: La reprise pronominale marque l’adresse directe et emphatique à Dieu exprimée par le pronom grec σὺ.
- source_word: ἃ λογίζονται
  choice: ce qu’elles projettent
  rationale: Dans ce contexte, λογίζομαι désigne un dessein hostile mûrement conçu plutôt qu’une simple pensée.
theological_decisions:
- issue: Sens de « les nations » dans une prière juive en contexte de guerre
  choice: les nations
  alternative: les païens / les peuples
  rationale: Le sens politico-militaire est ici au premier plan. « Les nations » maintient aussi l’ambivalence possible de ἔθνη sans importer une désignation religieuse plus technique.
- issue: Portée de l’action exprimée par ἐξᾶραι
  choice: nous faire disparaître
  alternative: nous détruire / nous éliminer
  rationale: Le grec peut évoquer le fait d’enlever, de supprimer ou d’anéantir. La formulation retenue conserve la menace d’éradication sans en préciser indûment le moyen.
translation_notes:
  register: Français international moderne, direct et solennel. « Voici » garde l’urgence de la prière ; « toi, tu sais » restitue l’emphase du pronom grec sans archaïsme.
