  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: fr
  text: Ils se rassemblèrent et se rendirent à Mitspa, en face de Jérusalem[a], car autrefois Mitspa était pour Israël un lieu de prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à l’opposé de Jérusalem». L’expression grecque indique une position en face de Jérusalem ou vis-à-vis d’elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: ils se rassemblèrent
  rationale: L’aoriste passif à valeur intransitive décrit naturellement le rassemblement collectif; cette formulation est claire et fidèle.
- source_word: ἦλθοσαν εἰς Μασσηφά
  choice: se rendirent à Mitspa
  rationale: Avec εἰς et une destination, «se rendirent à» convient au récit français et évite l’ambiguïté déictique de «vinrent».
- source_word: Μασσηφά
  choice: Mitspa
  rationale: «Mitspa» est une forme française biblique courante du toponyme, reconnaissable et proche du nom hébreu traditionnel.
- source_word: κατέναντι Ἰερουσαλήμ
  choice: en face de Jérusalem
  rationale: κατέναντι exprime une position vis-à-vis de Jérusalem, soit en face, soit à l’opposé; «en face de» préserve cette relation spatiale sans la réduire à la proximité.
- source_word: τόπος προσευχῆς
  choice: un lieu de prière
  rationale: La formule désigne un lieu associé à la prière sans préciser qu’il s’agissait d’une synagogue, d’un sanctuaire ou d’un autel.
- source_word: τὸ πρότερον
  choice: autrefois
  rationale: L’accusatif adverbial renvoie à une époque antérieure; «autrefois» est naturel et concis.
- source_word: τῷ Ἰσραήλ
  choice: pour Israël
  rationale: 'Le datif indique ici la relation ou l’usage: Mitspa servait de lieu de prière au peuple d’Israël.'
theological_decisions:
- issue: Nature de Mitspa comme lieu cultuel
  choice: un lieu de prière
  alternative: une maison de prière; un lieu de culte
  rationale: Le grec ne précise ni institution ni type de rite. La traduction conserve cette retenue et n’importe aucune catégorie cultuelle plus précise.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique; la syntaxe reste accessible. Le marqueur [a] figure immédiatement après l’expression concernée.
