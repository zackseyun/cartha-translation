base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/059.yaml
  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: fr
  text: Car il vaut mieux pour nous mourir au combat que d’assister aux malheurs de notre nation et des choses saintes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sanctuaire » ou « des lieux saints » ; le grec dit littéralement « des choses saintes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: il vaut mieux
  rationale: Cette tournure française exprime naturellement la préférence morale indiquée par le comparatif grec.
- source_word: ἀποθανεῖν
  choice: mourir
  rationale: Équivalent direct et courant de l’infinitif grec, sans emphase ajoutée.
- source_word: ἐν πολέμῳ
  choice: au combat
  rationale: Dans ce contexte militaire immédiat, « au combat » rend plus concrètement le sens que le général « à la guerre ».
- source_word: ἐφιδεῖν ἐπὶ
  choice: assister à
  rationale: La tournure exprime le fait d’être témoin, en spectateur impuissant, plutôt que le simple fait de voir.
- source_word: τὰ κακά
  choice: les malheurs
  rationale: Le terme grec peut désigner des maux, des calamités ou des épreuves; « malheurs » convient au contexte de souffrances subies sans réduire le mot aux seules fautes morales.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: notre nation
  rationale: « Nation » conserve la dimension collective et politique de la communauté juive visée ici.
- source_word: τῶν ἁγίων
  choice: des choses saintes
  rationale: Le grec est un neutre pluriel et désigne littéralement les réalités saintes; ce choix conserve son ampleur et son ambiguïté.
theological_decisions:
- issue: Référent de τῶν ἁγίων
  choice: les choses saintes
  alternative: le sanctuaire; les lieux saints
  rationale: Le neutre pluriel exclut ici le sens de « saints » appliqué à des personnes. La traduction large évite de réduire sans nécessité le référent au seul sanctuaire, tout en laissant ouverte cette interprétation contextuelle.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure exhortative du grec. « Assister aux malheurs » est naturel et maintient l’idée pénible de voir les événements se produire sans les empêcher; le rendu littéral de τῶν ἁγίων est explicité en note.
