  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: fr
  text: d’envoyer contre eux une force armée afin d’abattre et de supprimer la puissance d’Israël et ce qui restait de Jérusalem, et de faire disparaître de ce lieu son souvenir[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enlever son mémorial de ce lieu » ou « en effacer jusqu’au souvenir ».
    reason: 'Alternative lexicale : μνημόσυνον peut signifier « souvenir », « mémoire » ou « mémorial », et ἆραι peut être rendu par « enlever » ou « effacer » selon la nuance retenue.'
lexical_decisions:
- source_word: ἀποστεῖλαι
  choice: d’envoyer
  rationale: L’infinitif aoriste exprime ici le contenu ou le but de la décision évoquée dans le contexte. « Envoyer » est direct et naturel.
- source_word: δύναμιν
  choice: une force armée
  rationale: Dans ce contexte militaire, δύναμις désigne des troupes plutôt qu’une puissance abstraite. « Force armée » conserve une certaine généralité sans imposer la taille d’une armée.
- source_word: τοῦ ἐκρίψαι
  choice: afin d’abattre
  rationale: La construction marque le but et le verbe évoque une violente mise à bas. « Abattre » convient au contexte militaire sans se confondre avec le verbe suivant.
- source_word: ἐξᾶραι
  choice: supprimer
  rationale: Le verbe exprime l’action d’enlever ou de faire disparaître. « Supprimer » s’associe naturellement à « la puissance » et à « ce qui restait », tout en restant distinct d’« abattre ».
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: la puissance d’Israël
  rationale: ἰσχύς désigne la force ou la puissance. Cette formulation française conserve la relation génitive du grec.
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: ce qui restait de Jérusalem
  rationale: κατάλιμμα peut désigner globalement ce qui subsiste. Cette traduction ne limite pas arbitrairement le référent aux seuls survivants.
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: faire disparaître […] son souvenir
  rationale: μνημόσυνον peut désigner le souvenir, la mémoire ou un mémorial. « Faire disparaître son souvenir » rend naturellement le projet d’effacement tout en laissant au pronom singulier son ambiguïté contextuelle.
- source_word: ἀπὸ τοῦ τόπου
  choice: de ce lieu
  rationale: Le grec dit littéralement « du lieu ». En français, « ce lieu » rend l’article défini de manière naturelle et renvoie à la région déjà en vue.
theological_decisions:
- issue: Portée de « ce qui restait de Jérusalem »
  choice: Expression collective large, qui peut englober la communauté restante sans la limiter aux personnes.
  alternative: « les survivants de Jérusalem »
  rationale: Le grec κατάλιμμα désigne ce qui reste en général. Une formulation large préserve la portée du texte et évite de préciser plus que la source.
- issue: Référent du pronom αὐτοῦ
  choice: « son », sans expliciter le référent
  alternative: « leur souvenir » ou « le souvenir d’Israël »
  rationale: Le pronom grec est singulier, mais son antécédent exact peut être compris de diverses manières dans l’enchaînement. Le français « son souvenir » conserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation reste proche de la structure grecque tout en étant fluide. La virgule finale est conservée parce que le fragment fourni s’insère dans une phrase plus longue.
