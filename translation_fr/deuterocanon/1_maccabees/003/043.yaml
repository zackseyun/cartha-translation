  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: fr
  text: 'Et chacun dit à son prochain[a] : « Relevons notre peuple et les lieux saints de leur ruine. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un à l’autre ». Le grec associe un verbe signifiant « relever » à un nom qui évoque l’abattement, la destruction ou la ruine. « Les lieux saints » peut aussi être compris comme « les choses saintes ».
    reason: Signale l’idiome réciproque, l’image lexicale inhabituelle et l’étendue possible du référent cultuel, sans introduire de paraphrase syntaxiquement imprécise.
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: chacun dit à son prochain
  rationale: Cette formulation conserve la construction distributive et le singulier grecs tout en restant naturelle en français.
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: Relevons ... de leurs ruines
  rationale: Le grec associe littéralement l’idée de relever à celle d’abattement ou de ruine. La formulation française transpose naturellement cette image paradoxale sans réduire le sens à la seule reconstruction matérielle.
- source_word: τοῦ λαοῦ ἡμῶν
  choice: notre peuple
  rationale: λαός désigne ici le peuple d’Israël; « notre peuple » est direct, courant et contextuellement précis.
- source_word: τῶν ἁγίων
  choice: les lieux saints
  rationale: Dans le contexte de la profanation cultuelle rapportée en 1 Maccabées, le pluriel substantivé renvoie vraisemblablement aux espaces sacrés, tout en pouvant aussi englober les choses saintes.
theological_decisions:
- issue: Référent de τῶν ἁγίων
  choice: les lieux saints
  alternative: les choses saintes; le sanctuaire
  rationale: « Les lieux saints » conserve le pluriel et rend clairement la dimension cultuelle sans limiter arbitrairement le référent à un unique bâtiment. Une note maintient l’ambiguïté possible avec les objets sacrés.
translation_notes:
  register: Français international moderne, digne et accessible. « Relevons ... de leurs ruines » privilégie une expression française naturelle tout en gardant l’image grecque de relèvement après dévastation.
