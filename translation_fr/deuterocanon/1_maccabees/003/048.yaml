  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: fr
  text: Ils déployèrent le livre de la loi[a], au sujet duquel les nations recherchaient des représentations de leurs idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ouvrirent » ou « déroulèrent ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec est condensé. On peut aussi comprendre que les nations recherchaient des représentations de leurs idoles en rapport avec le livre de la loi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: déployèrent
  rationale: Le verbe évoque l’action d’étendre ou de déplier. « Déployèrent » conserve ce geste concret sans imposer explicitement l’idée d’un rouleau.
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: le livre de la loi
  rationale: Traduction directe et idiomatique, sans capitalisation interprétative de « loi ».
- source_word: περὶ ὧν
  choice: au sujet des questions pour lesquelles
  rationale: Le relatif grec est au pluriel et son antécédent demeure implicite. « Questions » explicite seulement le minimum nécessaire à une phrase française intelligible.
- source_word: ἐξηρεύων
  choice: interrogeaient
  rationale: Dans ce contexte de recherche d’une réponse auprès de représentations cultuelles, « interrogeaient » exprime naturellement l’action de consulter ou de chercher à connaître, tout en conservant la valeur durative de l’imparfait grec.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Choix direct et peu chargé sur le plan confessionnel pour désigner ici les peuples non israélites.
- source_word: τὰ ὁμοιώματα
  choice: les représentations
  rationale: Le terme désigne des ressemblances ou figures. « Représentations » maintient sa distinction lexicale avec εἴδωλα, rendu par « idoles ».
- source_word: τῶν εἰδώλων αὐτῶν
  choice: de leurs idoles
  rationale: « Idoles » restitue clairement la portée cultuelle et polémique de εἴδωλα.
theological_decisions:
- issue: Rapport entre le livre de la loi, les questions posées et les représentations idolâtres
  choice: Le texte présente les nations comme interrogeant les représentations de leurs idoles sur les questions concernées.
  alternative: Les nations recherchaient, dans le livre de la loi ou à son sujet, des représentations de leurs idoles.
  rationale: 'La construction grecque est condensée : le relatif pluriel a un antécédent implicite, et le rapport syntaxique exact entre le verbe et « les représentations » peut être compris de plusieurs façons. Le texte principal retient une lecture contextuellement cohérente, tandis que la note maintient ouverte l’autre analyse.'
translation_notes:
  register: Français international actuel, digne et accessible. « Déployèrent » garde la matérialité du geste; « interrogeaient » rend la consultation religieuse sans employer un vocabulaire confessionnel spécialisé. Les marqueurs suivent l’ordre naturel [a], puis [b].
