base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: fr
  text: 'Judas dit : « Ceignez-vous, montrez-vous vaillants[a] et soyez prêts, au matin, à combattre ces nations qui se sont rassemblées contre nous pour nous anéantir, nous et nos biens sacrés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devenez des fils puissants »; on peut aussi comprendre : « soyez des hommes vaillants » ou « montrez-vous forts ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « notre sanctuaire ». Le grec emploie un pluriel qui peut désigner les objets sacrés, les lieux saints ou l’ensemble du domaine sacré.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περιζώσασθε
  choice: Ceignez-vous
  rationale: L’impératif moyen évoque littéralement le fait de serrer sa ceinture en vue de l’action. « Ceignez-vous » conserve cette image militaire tout en restant intelligible en français soutenu.
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: montrez-vous vaillants
  rationale: L’expression grecque, littéralement « devenez des fils puissants », est un idiome d’allure sémitique désignant des hommes courageux et forts. Une traduction littérale serait peu naturelle et potentiellement obscure en français; le sens et l’exhortation sont rendus dans le texte, tandis que la forme est signalée en note.
- source_word: ἕτοιμοι
  choice: prêts
  rationale: Équivalent direct et naturel dans le contexte d’une préparation au combat.
- source_word: εἰς τὸ πρωῒ
  choice: au matin
  rationale: Cette formulation conserve la référence au matin sans préciser indûment « demain » ni imposer l’idée plus étroite du point du jour.
- source_word: πολεμῆσαι
  choice: combattre
  rationale: Verbe français naturel qui exprime directement l’action militaire visée.
- source_word: ἔθνεσιν
  choice: nations
  rationale: Le terme désigne ici les peuples étrangers hostiles. « Nations » demeure proche du grec sans introduire la qualification religieuse plus marquée de « païens ».
- source_word: ἐπισυνηγμένοις
  choice: qui se sont rassemblées
  rationale: Le parfait participial présente ces nations comme désormais réunies contre Judas et les siens; le verbe pronominal français rend naturellement ce résultat.
- source_word: ἐξᾶραι
  choice: anéantir
  rationale: Dans ce contexte de menace militaire visant des personnes et des réalités sacrées, le verbe signifie les faire disparaître par destruction. « Anéantir » rend la force de la menace.
- source_word: τὰ ἅγια ἡμῶν
  choice: nos biens sacrés
  rationale: Le neutre pluriel peut désigner les objets sacrés, les lieux saints ou plus largement le domaine sacré. « Biens sacrés » garde un pluriel collectif et une certaine ampleur, avec une note indiquant l’autre interprétation possible.
theological_decisions:
- issue: Expression masculine et idiomatique γίνεσθε εἰς υἱοὺς δυνατούς
  choice: Rendre idiomatiquement par « montrez-vous vaillants » et conserver la forme littérale en note
  alternative: « devenez des fils puissants » ou « soyez des hommes vaillants »
  rationale: Le grec emploie explicitement « fils », mais comme élément d’un idiome désignant des combattants forts et courageux. Le calque « fils puissants » obscurcirait le sens en français moderne; la note préserve néanmoins cette donnée du texte source sans neutraliser silencieusement sa forme masculine.
- issue: Référent de τὰ ἅγια ἡμῶν
  choice: Traduire largement par « nos biens sacrés »
  alternative: « notre sanctuaire »
  rationale: Le pluriel grec ne permet pas de limiter avec certitude le référent au seul sanctuaire; il peut englober les objets sacrés ou les espaces saints. Le texte principal maintient cette largeur, et la note donne l’interprétation plus précise.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tour « Ceignez-vous » conserve l’image martiale du grec; « montrez-vous vaillants » évite un calque obscur, et « biens sacrés » maintient autant que possible l’ampleur du pluriel grec.
