  text: And the assembly gathered to be ready for war[b][a], and to pray and ask for mercy and compassion.
translation:
  language: fr
  text: L’assemblée se réunit pour se tenir prête à la guerre[a], ainsi que pour prier et demander miséricorde et compassion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut rassemblée » ; le verbe grec est de forme passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροίσθη
  choice: se réunit
  rationale: L’aoriste passif de ἀθροίζω peut ici décrire le rassemblement du groupe. « Se réunit » est naturel en français et rend le sens collectif, tandis qu’une note signale la forme passive grecque.
- source_word: ἡ συναγωγή
  choice: l’assemblée
  rationale: Dans ce contexte, συναγωγή désigne la communauté rassemblée plutôt qu’un bâtiment ou une institution appelée synagogue. « Assemblée » convient au contexte militaire et cultuel.
- source_word: τοῦ εἶναι ἑτοίμους
  choice: pour se tenir prête
  rationale: L’infinitif substantivé exprime ici le but. L’accord au féminin singulier reprend naturellement « l’assemblée », bien que le grec emploie un adjectif au pluriel en référence à ses membres.
- source_word: εἰς πόλεμον
  choice: à la guerre
  rationale: πόλεμος signifie directement « guerre ». Avec « se tenir prête », la tournure française idiomatique est « prête à la guerre ».
- source_word: τοῦ προσεύξασθαι
  choice: pour prier
  rationale: Ce second infinitif substantivé est parallèle au premier et exprime lui aussi le but du rassemblement.
- source_word: αἰτῆσαι
  choice: demander
  rationale: Le verbe signifie demander ou solliciter et introduit directement les deux réalités recherchées.
- source_word: ἔλεον
  choice: miséricorde
  rationale: « Miséricorde » conserve la portée religieuse de ἔλεος dans une prière adressée à Dieu.
- source_word: οἰκτειρμούς
  choice: compassion
  rationale: Le terme, au pluriel en grec, évoque des marques ou des sentiments de compassion. Le singulier collectif est naturel en français et maintient la distinction avec « miséricorde ».
theological_decisions:
- issue: Sens de συναγωγή dans ce récit historique deutérocanonique
  choice: l’assemblée
  alternative: la communauté réunie ; la congrégation ; la synagogue
  rationale: Le mot désigne ici le peuple rassemblé afin de se préparer à la guerre et de prier. « Assemblée » évite de suggérer de manière anachronique un bâtiment ou une institution déterminée.
- issue: Relation entre préparation militaire et prière
  choice: deux buts coordonnés du rassemblement
  alternative: faire de la prière un simple moyen de préparation militaire
  rationale: Les deux infinitifs substantivés grecs sont parallèles. La traduction préserve donc la tension du texte entre préparation à la guerre et appel à la miséricorde divine, sans subordonner explicitement l’un à l’autre.
translation_notes:
  register: Français international moderne, digne et accessible. « Assemblée » évite l’anachronisme possible de « synagogue ». La coordination « ainsi que » clarifie les deux finalités parallèles sans alourdir la phrase.
