  text: And he himself will crush them before us; but as for you, do not fear them.
translation:
  language: fr
  text: Lui-même les écrasera devant nous. Quant à vous, ne les craignez pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίψει
  choice: écrasera
  rationale: Le futur de συντρίβω exprime ici une destruction violente. « Écrasera » conserve la vigueur martiale du grec dans un français naturel.
- source_word: πρὸ προσώπου ἡμῶν
  choice: devant nous
  rationale: Cette expression désigne littéralement ce qui se passe devant notre face, donc en notre présence. « Devant nous » en préserve simplement la portée spatiale.
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: ne les craignez pas
  rationale: La construction avec μή formule une interdiction ou une exhortation négative. « Ne les craignez pas » est directe, idiomatique et fidèle.
- source_word: αὐτὸς
  choice: Lui-même
  rationale: Le pronom est emphatique. La forme détachée « Lui-même » souligne que Dieu est l'acteur décisif sans ajouter d'explication absente du verset.
theological_decisions:
- issue: Identité et valeur emphatique du sujet αὐτός
  choice: « Lui-même », compris en contexte comme renvoyant à Dieu
  alternative: « Il les écrasera », sans rendre explicitement l'emphase
  rationale: Le contexte présente la victoire comme l'œuvre de Dieu plutôt que comme le résultat de la seule force des combattants. L'emphase du grec est donc conservée, tandis que le nom « Dieu » n'est pas ajouté au texte.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation en deux phrases restitue naturellement le contraste marqué par δέ. Aucun appel de note n'est requis.
