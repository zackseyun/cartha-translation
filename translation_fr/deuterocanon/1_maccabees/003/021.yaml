  text: But we are fighting for our lives and our laws[a][b].
translation:
  language: fr
  text: Mais nous, nous combattons pour nos vies[a] et pour nos lois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos âmes ». Le mot grec peut signifier « vies » ou « âmes »; dans ce contexte de bataille, « vies » correspond le mieux au sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos coutumes légitimes » ou « nos prescriptions ancestrales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous, nous
  rationale: δέ marque ici le contraste avec ce qui précède, tandis que le pronom explicite ἡμεῖς est emphatique. La reprise « nous, nous » rend cette insistance dans un français naturel.
- source_word: πολεμοῦμεν
  choice: combattons
  rationale: Le présent de πολεμέω désigne l'action de combattre ou de faire la guerre; « combattons » convient au contexte militaire et conserve la force immédiate de l'énoncé.
- source_word: περὶ
  choice: pour
  rationale: Avec le verbe « combattre », περί indique ce qui est en jeu ou ce que l'on défend; « pour » est la formulation française la plus directe.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: nos vies
  rationale: ψυχή peut désigner la vie ou l'âme. Dans ce contexte de bataille et de survie, « vies » exprime le sens concret le plus probable sans effacer l'autre possibilité, signalée en note.
- source_word: τῶν νομίμων ἡμῶν
  choice: nos lois
  rationale: νόμιμα désigne les prescriptions, institutions ou coutumes établies par la loi, avec ici une forte portée religieuse et ancestrale. « Lois » est clair et digne; les nuances plus larges sont indiquées en note.
theological_decisions:
- issue: Sens de ψυχαί dans un contexte de guerre
  choice: nos vies
  alternative: nos âmes
  rationale: Le contexte immédiat porte sur le combat et la survie. « Vies » conserve le sens concret sans imposer une lecture anthropologique dualiste; l'ambiguïté lexicale réelle est maintenue en note.
- issue: Étendue sémantique de νόμιμα
  choice: nos lois
  alternative: nos coutumes légitimes; nos prescriptions ancestrales
  rationale: Le terme englobe vraisemblablement les prescriptions et pratiques religieuses reçues. « Lois » en conserve la gravité et la concision, tandis que la note explicite la dimension coutumière et ancestrale possible.
translation_notes:
  register: Français international moderne, direct et digne. La tournure emphatique « Mais nous, nous » rend le contraste porté par δέ et par le pronom sujet explicite. Les notes préservent les ambiguïtés de ψυχαί et de νόμιμα sans alourdir le verset.
