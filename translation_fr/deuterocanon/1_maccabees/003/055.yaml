lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: Après cela
  rationale: Transition temporelle naturelle en français moderne, qui conserve la succession exprimée par le grec.
- source_word: κατέστησεν
  choice: établit
  rationale: Le verbe désigne ici l’installation de personnes dans une fonction ou une responsabilité; « établit » convient au registre et au contexte.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle du nom Ἰούδας dans 1 Maccabées.
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: des chefs du peuple
  rationale: Le terme grec est général et désigne ceux qui dirigent; les titres qui suivent précisent l’organisation militaire. « Chefs du peuple » garde cette portée sans réduire d’emblée le terme à un grade particulier.
- source_word: χιλιάρχους
  choice: des chefs de milliers
  rationale: Rendu transparent qui conserve la structure numérique de la hiérarchie sans introduire un titre romain anachronique.
- source_word: ἑκατοντάρχους
  choice: de centaines
  rationale: Le nom « chefs » se prolonge naturellement dans l’énumération et préserve le parallélisme des grades numériques.
- source_word: πεντηκοντάρχους
  choice: de cinquantaines
  rationale: « Cinquantaines » exprime des unités de cinquante et maintient la structure militaire graduée du grec.
- source_word: δεκαδάρχους
  choice: de dizaines
  rationale: Rendu parallèle aux autres grades, qui conserve l’organisation par groupes de dix.
