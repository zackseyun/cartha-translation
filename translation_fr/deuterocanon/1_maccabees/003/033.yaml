  text: and to provide for Antiochus his son until he returns[a].
translation:
  language: fr
  text: et de pourvoir aux besoins d’Antiochos, son fils, jusqu’à ce que le roi revienne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de nourrir ou d’entretenir Antiochos, son fils, jusqu’à ce que le roi revienne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρέφειν
  choice: pourvoir aux besoins de
  rationale: Le verbe peut signifier nourrir, élever ou entretenir. Dans ce contexte de cour, il désigne plus largement la prise en charge du fils du roi pendant l’absence de celui-ci.
- source_word: Ἀντίοχον
  choice: Antiochos
  rationale: Translittération française usuelle du nom grec Ἀντίοχος.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils
  rationale: Cette formulation française naturelle conserve explicitement le lien filial et possessif du grec.
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: jusqu’à son retour
  rationale: La construction ἕως suivi de l’infinitif substantivé fixe une limite temporelle. Le possessif conserve avec concision la référence contextuelle au roi absent, tout en reflétant la forme nominale de l’expression grecque.
