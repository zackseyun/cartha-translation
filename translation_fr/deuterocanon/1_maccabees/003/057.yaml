lexical_decisions:
- source_word: ἀπῆρεν
  choice: leva le camp
  rationale: Dans ce contexte militaire, le verbe indique que la troupe quitte son emplacement; « lever le camp » est l’expression française naturelle.
- source_word: ἡ παρεμβολή
  choice: le camp
  rationale: Le nom désigne ici collectivement le campement, et par métonymie la troupe qui s’y trouve.
- source_word: παρενεβάλοσαν
  choice: ils établirent leur camp
  rationale: Le verbe signifie installer un camp; cette formulation garde le sens militaire tout en évitant de répéter exactement « leva le camp ».
- source_word: κατὰ νότον
  choice: au sud de
  rationale: L’expression situe le nouveau camp par rapport à Emmaüs plutôt qu’elle ne décrit seulement la direction du déplacement.
- source_word: Ἀμμαούμ
  choice: Emmaüs
  rationale: Forme française conventionnelle du nom de lieu grec Ἀμμαούμ.
