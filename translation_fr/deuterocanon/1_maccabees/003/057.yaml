  text: Puis le camp se mit en marche, et ils établirent leur camp au sud d’Emmaüs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Ἀμμαούμ, traditionnellement rendu par « Emmaüs ».
