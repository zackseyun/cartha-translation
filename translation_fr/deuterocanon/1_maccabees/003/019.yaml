  yaml_path: translation/deuterocanon/1_maccabees/003/019.yaml
  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
translation:
  language: fr
  text: Car la victoire dans la guerre ne dépend pas du grand nombre des forces[a], mais la force vient du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une grande puissance ». Le grec oppose l’accumulation des forces humaines à la force qui vient du ciel.'
    reason: alternative lexicale
lexical_decisions:
- source_word: πλήθει δυνάμεως
  choice: une multitude de forces
  rationale: L’expression désigne une grande quantité de puissance ou de moyens militaires. « Une multitude de forces » conserve l’idée d’une puissance humaine accumulée sans la réduire au seul nombre de soldats.
- source_word: νίκη πολέμου
  choice: la victoire à la guerre
  rationale: Cette formulation française naturelle exprime le type de victoire visé par le génitif πολέμου.
- source_word: ἀλλʼ ἢ
  choice: ':'
  rationale: Dans cette construction contrastive, les deux-points rendent naturellement en français l’opposition entre ce dont la victoire ne dépend pas et la véritable provenance de la force.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Le grec dit explicitement « du ciel », tournure juive pouvant désigner avec révérence la source divine. La traduction préserve cette formulation sans l’expliciter par « de Dieu ».
- source_word: ἰσχύς
  choice: la force
  rationale: ἰσχύς désigne la force ou la puissance. Le singulier permet de distinguer la force venant du ciel de la multitude des forces humaines.
theological_decisions:
- issue: Faut-il expliciter ἐκ τοῦ οὐρανοῦ comme une référence indirecte à Dieu ?
  choice: du ciel
  alternative: de Dieu
  rationale: La formulation source conserve une certaine indirectivité révérencielle. « Du ciel » maintient cette tension et n’ajoute pas un référent que le grec laisse implicite.
translation_notes:
  register: Français moderne, courant et digne. « Dépendre de » explicite idiomatiquement la valeur de ἐν dans « ne réside pas dans / ne repose pas sur ». Le contraste entre δυνάμεως et ἰσχύς est conservé par le pluriel « forces » puis le singulier « force ».
