  yaml_path: translation/deuterocanon/1_maccabees/003/032.yaml
  text: And he left Lysias, an honored man and of the royal family, over the affairs of the king, from the Euphrates River as far as the borders of Egypt,
translation:
  language: fr
  text: Il confia à Lysias, homme honoré et membre de la famille royale, la direction des affaires du roi depuis l’Euphrate jusqu’aux frontières de l’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: confia
  rationale: Dans ce contexte de délégation administrative, le verbe signifie qu’il laissa Lysias chargé d’une responsabilité; « confia » exprime naturellement cette fonction en français.
- source_word: ἄνθρωπον ἔνδοξον
  choice: homme honoré
  rationale: ἔνδοξος désigne ici un homme jouissant d’honneur et de considération; cette formulation suit le sens grec sans surinterpréter son rang.
- source_word: ἀπὸ γένους τῆς βασιλείας
  choice: membre de la famille royale
  rationale: La tournure grecque indique son appartenance à la lignée ou à la parenté royale; « membre de la famille royale » est idiomatique et précis.
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  choice: la direction des affaires du roi
  rationale: La préposition ἐπί avec le génitif exprime ici l’autorité exercée sur l’administration royale; « direction » rend explicitement la charge confiée.
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  choice: depuis l’Euphrate jusqu’aux frontières de l’Égypte
  rationale: Rend directement l’étendue géographique de la compétence de Lysias; en français courant, le nom « Euphrate » suffit sans ajouter « fleuve ».
