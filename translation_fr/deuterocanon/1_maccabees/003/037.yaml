  source_fidelity: Le sens général est fidèle. Toutefois, « en la cent quarante-septième année » n’est pas une tournure moderne naturelle, et « régions d’en haut », bien que très littéral, est maladroit en français contemporain. « Régions supérieures » conserve l’ambiguïté géographique de τὰς ἐπάνω χώρας tout en étant plus idiomatique. « Laissées en arrière » exprime plus exactement l’idée de forces précédemment laissées derrière que « sur place ».
  naturalness: Le registre narratif est approprié et le passé simple convient. La révision améliore la fluidité de la notice chronologique et de l’expression géographique sans moderniser indûment le récit.
  terminology: « Forces », « Antioche », « l’Euphrate » et « ère séleucide » sont adéquats. « Ville de son royaume » maintient la formulation volontairement inhabituelle et appositionnelle du grec sans imposer « capitale ».
