translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre historique biblique tout en restant clair. L’apposition « la ville de son royaume » préserve la formulation inhabituelle du grec; « régions d’en haut » maintient l’incertitude géographique de l’original.
