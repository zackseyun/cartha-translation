  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: fr
  text: Le roi prit avec lui la moitié des forces qui avaient été laissées en arrière et partit d’Antioche, ville de son royaume, la cent quarante-septième année[a]. Il traversa l’Euphrate et parcourut les régions supérieures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la cent quarante-septième année de l’ère séleucide.
    reason: cultural_note
  - marker: b
    text: Ou « les régions de l’intérieur ». L’expression grecque peut aussi se comprendre comme « les régions d’en haut » et désigne probablement des territoires situés à l’est de l’Euphrate.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: prit avec lui
  rationale: Dans ce contexte militaire, le verbe indique que le roi emmène ces forces avec lui; cette formulation explicite naturellement le mouvement sans réduire le sens à une simple prise de commandement.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: la moitié des forces
  rationale: Le grec désigne la moitié des effectifs militaires. « Forces » garde la portée générale de δυνάμεις, tandis que le singulier collectif « la moitié » est idiomatique en français.
- source_word: τὰς καταλειφθείσας
  choice: qui avaient été laissées sur place
  rationale: Le plus-que-parfait marque l’antériorité de l’action, et « sur place » rend l’idée de troupes laissées en arrière sans formulation pesante.
- source_word: ἀπῆρεν
  choice: partit
  rationale: Verbe narratif courant et digne pour le départ d’une expédition.
- source_word: ἀπὸ Ἀντιοχίας, ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: partit d’Antioche, la ville de son royaume
  rationale: La seconde expression est comprise comme une apposition identifiant Antioche. La traduction reste proche du grec sans imposer le terme interprétatif « capitale ».
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: en la cent quarante-septième année
  rationale: Rend exactement l’année 147 dans une tournure chronologique française naturelle.
- source_word: διεπέρασεν τὸν Εὐφράτην ποταμόν
  choice: traversa l’Euphrate
  rationale: En français, le nom propre suffit à désigner le fleuve; « traversa » rend directement le mouvement d’un bord à l’autre.
- source_word: διεπορεύετο
  choice: parcourut
  rationale: Le verbe exprime la progression à travers un territoire. Le passé simple convient au récit historique, même si l’imparfait grec souligne la durée du déplacement.
- source_word: τὰς ἐπάνω χώρας
  choice: les régions d’en haut
  rationale: Cette formulation conserve l’expression géographique grecque et son ambiguïté, sans décider s’il s’agit précisément de provinces supérieures ou de régions intérieures.
