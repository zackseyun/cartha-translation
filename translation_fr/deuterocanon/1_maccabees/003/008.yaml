base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/008.yaml
  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
translation:
  language: fr
  text: Il parcourut les villes de Juda et en extermina les impies[a] ; il détourna la colère loin d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens sans respect pour Dieu » ou « les méchants ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « la colère » désigne probablement la colère de Dieu, bien que le verset ne le précise pas explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: διῆλθεν
  choice: parcourut
  rationale: Le verbe exprime un déplacement à travers une région ou une série de lieux. « Parcourut » est naturel en français et conserve cette idée.
- source_word: πόλεσιν Ἰούδα
  choice: les villes de Juda
  rationale: Traduction directe de l’expression grecque, où « Juda » désigne ici le territoire auquel appartiennent les villes.
- source_word: ἐξωλόθρευσεν
  choice: extermina
  rationale: Le verbe est fort et indique l’élimination par la destruction. « Extermina » en restitue la vigueur sans préciser davantage le moyen employé.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: Le terme désigne ceux qui manifestent de l’irrévérence envers Dieu et l’ordre religieux. « Les impies » conserve clairement cette portée religieuse et morale.
- source_word: ἐπʼ αὐτῆς
  choice: en
  rationale: Le pronom féminin renvoie très probablement à Juda envisagé comme territoire. « En » reprend naturellement ce lieu en français sans ajouter « pays » ou « territoire », absents du grec.
- source_word: ἀπέστρεψεν ὀργὴν
  choice: détourna la colère
  rationale: Cette tournure rend l’idée de faire cesser ou d’écarter la colère tout en restant proche de l’expression grecque.
- source_word: ἀπὸ Ἰσραήλ
  choice: loin d’Israël
  rationale: La préposition marque Israël comme celui dont la colère est écartée. « Loin d’Israël » s’accorde naturellement avec le verbe « détourner » et préserve le sens collectif.
theological_decisions:
- issue: Nature de la colère détournée d’Israël
  choice: La traduction parle simplement de « la colère », sans en nommer explicitement l’auteur.
  alternative: « la colère de Dieu » ou une calamité frappant Israël
  rationale: Dans ce contexte scripturaire juif, il s’agit vraisemblablement de la colère divine, mais le verset grec ne nomme pas Dieu. Le texte principal préserve donc cette réserve, et une note signale l’interprétation probable.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique. La formulation reste concise, conserve la force du grec et ne rend explicite ni le territoire sous-entendu par le pronom ni l’origine divine probable de la colère.
