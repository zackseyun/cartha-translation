  - severity: low
    issue: Note alternative insuffisamment distincte et elle-même ambiguë
    rationale: La note proposée reprend la même ambiguïté de « parmi eux » et décrit une variation d’ordre des mots plutôt qu’une alternative de traduction utile. Une note formulée avec « d’entre eux » préserve l’alternative quantitative sans obscurcir le référent.
