  text: And they pursued them down the descent of Beth-horon as far as the plain[a], and about eight hundred of them fell; but the rest fled into the land of the Philistines.
translation:
  language: fr
  text: Ils les poursuivirent dans la descente de Beth-Horon jusqu’à la plaine, et environ huit cents hommes d’entre eux tombèrent[a] ; les autres s’enfuirent au pays des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelque huit cents hommes d’entre eux tombèrent ». Le grec peut exprimer ici un nombre approximatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωκον
  choice: ils les poursuivirent
  rationale: L’imparfait grec présente une poursuite en cours dans le récit ; le passé simple convient à la narration française tout en conservant l’idée d’une poursuite active.
- source_word: ἐν τῇ καταβάσει
  choice: dans la descente
  rationale: κατάβασις désigne une descente ou une voie descendante. Cette formulation reste proche de la topographie grecque sans surinterpréter la préposition.
- source_word: Βαιθωρὼν
  choice: Beth-Horon
  rationale: Translittération française claire et courante du nom de lieu.
- source_word: ἕως τοῦ πεδίου
  choice: jusqu’à la plaine
  rationale: πέδιον désigne un terrain plat ou une plaine, tandis que ἕως marque ici la limite atteinte.
- source_word: ἔπεσον ἀπʼ αὐτῶν
  choice: parmi eux tombèrent
  rationale: La tournure indique que les pertes appartenaient au groupe poursuivi. « Tombèrent » préserve l’expression narrative grecque sans préciser davantage la manière de leur mort.
- source_word: εἰς ἄνδρας ὀκτακοσίους
  choice: environ huit cents hommes
  rationale: Avec un nombre, εἰς peut exprimer une quantité approximative. « Hommes » rend explicitement ἄνδρας.
- source_word: οἱ δὲ λοιποὶ
  choice: les autres
  rationale: La formule désigne ceux qui restaient, par contraste avec les hommes tombés ; en français, le point-virgule suffit à porter cette opposition.
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: s’enfuirent au pays des Philistins
  rationale: Rend de façon transparente la désignation littérale du territoire, tout en restant naturelle en français.
