  text: Ils sonnèrent des trompettes et crièrent d’une voix forte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισαν
  choice: sonnèrent
  rationale: Le verbe signifie sonner ou jouer de la trompette. En français, « sonner des trompettes » rend naturellement l’action tout en conservant le lien lexical avec l’instrument.
- source_word: ταῖς σάλπιγξιν
  choice: des trompettes
  rationale: Le datif est instrumental, mais l’expression française naturelle avec « sonner » construit l’instrument comme complément direct. L’instrument concret reste explicite.
- source_word: ἐβόησαν
  choice: poussèrent un grand cri
  rationale: Le verbe désigne le fait de crier avec force. Cette formulation convient au contexte collectif et martial sans préciser indûment le contenu du cri.
- source_word: φωνῇ μεγάλῃ
  choice: un grand cri
  rationale: L’expression signifie littéralement « d’une voix forte ». En lien avec ἐβόησαν, « poussèrent un grand cri » évite une tournure française redondante et restitue clairement l’intensité sonore.
