  text: And he handed over to him half of the forces and the elephants[a], and he gave him orders concerning everything he desired, and concerning all those dwelling in Judea and Jerusalem[b],
translation:
  language: fr
  text: Il lui remit[a] la moitié des forces et les éléphants, et il lui donna des ordres concernant tout ce qu’il voulait[b] et concernant tous ceux qui habitaient en Judée et à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confia ». Le verbe grec souligne le transfert sous l’autorité ou la responsabilité d’une autre personne.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « tout ce qu’il voulait » sans préciser davantage l’objet de sa volonté.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: παρέδωκεν
  choice: remit
  rationale: Le verbe exprime ici le transfert de troupes et d’éléphants sous l’autorité d’un autre. « Remit » conserve cette idée concrète sans imposer la nuance de confiance contenue dans « confia ».
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: la moitié des forces
  rationale: Dans ce contexte militaire, δυνάμεις désigne les forces armées au sens large. Le français idiomatique emploie le singulier collectif « la moitié ».
- source_word: τοὺς ἐλέφαντας
  choice: les éléphants
  rationale: Le grec dit simplement « les éléphants ». Le contexte militaire suffit à indiquer leur fonction, sans ajouter « de guerre ».
- source_word: ἐνετείλατο αὐτῷ
  choice: lui donna des ordres
  rationale: Cette formulation naturelle rend la transmission de directives dans un cadre militaire.
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: au sujet de tout ce qu’il voulait
  rationale: 'La formulation maintient la concision et l’indétermination du grec : ce qui était voulu n’est pas explicité.'
- source_word: τῶν κατοικούντων τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: tous ceux qui habitaient la Judée et Jérusalem
  rationale: Le participe substantivé désigne les personnes qui y résident. En français, « habiter » peut régir directement les noms de lieux.
