revisions:
- from: Il lui remit[a] la moitié des forces et les éléphants, puis lui donna des ordres au sujet de tout ce qu’il voulait[b], ainsi qu’au sujet de tous ceux qui habitaient la Judée et Jérusalem.
  to: Il lui remit[a] la moitié des forces et les éléphants, et il lui donna des ordres concernant tout ce qu’il voulait[b] et concernant tous ceux qui habitaient en Judée et à Jérusalem.
  rationale: La révision remplace des liens discursifs légèrement interprétatifs par une coordination qui reflète plus directement les καί grecs et conserve la répétition de « concernant ». Elle clarifie aussi la valeur locative de la Judée et de Jérusalem. Les notes et leurs ancres restent appropriées.
