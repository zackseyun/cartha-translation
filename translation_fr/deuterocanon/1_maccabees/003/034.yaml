    issue: Coordination rendue par « puis » et « ainsi que »
    rationale: Le grec enchaîne par καί et répète περί (« concernant »). Une coordination française plus neutre préserve mieux l'absence d'indication temporelle et la structure des deux domaines des ordres.
  - severity: low
    issue: Expression de la résidence
    rationale: Le grec situe les personnes en Judée et à Jérusalem. Employer « en Judée et à Jérusalem » rend la relation locative sans l'ambiguïté stylistique possible de « habiter la Judée et Jérusalem ».
