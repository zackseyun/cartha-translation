  yaml_path: translation/deuterocanon/1_maccabees/003/051.yaml
  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: fr
  text: Tes choses saintes[a] ont été foulées aux pieds et profanées, et tes prêtres sont en deuil et humiliés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton sanctuaire » ou « ton lieu saint ». Le grec est au pluriel et signifie littéralement « tes choses saintes ».
    reason: Alternative lexicale permettant de préciser la portée possible du pluriel grec sans la restreindre dans le texte principal.
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: tes choses saintes
  rationale: Le neutre pluriel désigne littéralement « tes choses saintes » et peut englober les lieux, espaces et objets consacrés. Le maintien du pluriel évite de réduire le sens au seul sanctuaire.
- source_word: κατεπεπάτηται
  choice: ont été foulées aux pieds
  rationale: Cette formulation conserve l’image violente du piétinement et rend l’état résultant exprimé par le parfait passif grec.
- source_word: βεβήλωται
  choice: profanées
  rationale: « Profanées » exprime directement le fait de traiter comme commun ce qui est saint et s’accorde naturellement avec « choses saintes ».
- source_word: οἱ ἱερεῖς σου
  choice: tes prêtres
  rationale: Équivalent courant et précis pour les ministres du culte du Temple.
- source_word: ἐν πένθει
  choice: dans le deuil
  rationale: Expression française naturelle qui décrit leur état de lamentation.
- source_word: ταπεινώσει
  choice: humiliation
  rationale: Le terme peut évoquer l’abaissement, l’affliction ou l’humiliation; ici, « humiliation » rend bien la condition publique de honte et d’oppression.
theological_decisions:
- issue: Portée de τὰ ἅγιά σου
  choice: Référence large aux réalités saintes appartenant à Dieu, sans la limiter à un bâtiment unique.
  alternative: « ton sanctuaire » ou « ton lieu saint »
  rationale: Le grec emploie un pluriel plus large qu’un sanctuaire architectural singulier. La traduction principale préserve cette amplitude, tandis que la note signale les équivalents contextuels possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe coordonnée du grec est conservée, ainsi que le parallélisme entre la profanation des réalités saintes et l’abaissement des prêtres.
