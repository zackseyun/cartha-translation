base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: fr
  text: Judas et ses frères virent que les malheurs s’étaient multipliés et que les forces armées campaient à l’intérieur de leur territoire ; ils reconnurent les ordres du pouvoir royal, qu’il avait ordonné d’exécuter contre le peuple, pour sa destruction et son anéantissement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « au peuple » plutôt que « contre le peuple ». Dans le contexte, les ordres ont clairement le peuple pour cible et visent sa destruction.
    reason: Le datif τῷ λαῷ peut, isolément, se rendre par « au peuple » ; la note préserve cette donnée grammaticale tout en expliquant la force hostile imposée par la suite de la phrase.
lexical_decisions:
- source_word: τὰ κακά
  choice: les malheurs
  rationale: Le pluriel désigne ici les calamités et les circonstances adverses qui se multiplient, plutôt que le mal moral au sens abstrait.
- source_word: αἱ δυνάμεις
  choice: les forces armées
  rationale: Dans ce contexte militaire, δυνάμεις désigne des troupes; l’ajout d’« armées » évite le sens abstrait de « forces ».
- source_word: παρεμβάλλουσιν
  choice: campaient
  rationale: Le présent grec décrit les troupes établies en camp; l’imparfait français convient au cadre narratif et à une situation en cours.
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: à l’intérieur de leurs frontières
  rationale: ὅρια peut désigner les frontières ou le territoire. Cette formulation conserve l’idée menaçante d’une présence ennemie à l’intérieur de leurs limites territoriales.
- source_word: ἐπέγνωσαν
  choice: ils comprirent aussi
  rationale: Le verbe exprime une prise de conscience ou une compréhension nette. « Comprirent » est naturel en français et n’ajoute pas l’idée non explicite qu’ils auraient reçu une nouvelle information.
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: que le pouvoir royal avait donné des ordres
  rationale: λόγοι désigne ici des directives officielles, tandis que βασιλεία renvoie à l’autorité ou au régime royal. La formulation française explicite idiomatiquement la relation sans substituer directement « le roi » au nom abstrait grec.
- source_word: ἐνετείλατο ποιῆσαι
  choice: avait donné des ordres visant à mener
  rationale: La construction unit l’ordre donné et sa mise à exécution. Cette tournure française rend l’intention opérationnelle des directives sans lourdeur syntaxique.
- source_word: τῷ λαῷ
  choice: le peuple
  rationale: Le datif est littéralement « au peuple »; associé à la destruction qui suit, il désigne le peuple comme cible des mesures hostiles. La note signale cette donnée grammaticale.
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: à la destruction et à l’anéantissement
  rationale: Les deux noms forment une accumulation intensive évoquant une ruine totale. « Anéantissement » rend la valeur terminale de συντέλεια dans ce contexte.
theological_decisions:
- issue: Sens de τῆς βασιλείας
  choice: le pouvoir royal
  alternative: le royaume; la royauté; le roi
  rationale: Le grec emploie le nom abstrait βασιλεία, non le mot « roi ». « Pouvoir royal » désigne naturellement le régime auteur des ordres tout en préservant cette distinction.
- issue: Valeur hostile de τῷ λαῷ
  choice: le peuple comme cible des ordres
  alternative: au peuple
  rationale: Le datif seul pourrait être rendu par « au peuple », mais εἰς ἀπώλειαν καὶ συντέλειαν établit que les ordres visent sa ruine. Le texte principal transmet cette relation sans donner au datif un sens bénéfique.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire reste accessible; la formulation évite à la fois le calque lourd du grec et toute précision confessionnelle absente de la source.
