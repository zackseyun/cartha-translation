  yaml_path: translation/deuterocanon/1_maccabees/003/053.yaml
  text: How will we be able to stand before them[a], unless you help us?
translation:
  language: fr
  text: Comment pourrons-nous tenir devant eux[a], si toi, tu ne nous aides pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur résister » ou « tenir face à eux » ; l’expression grecque peut désigner le fait de faire face à des adversaires dans un combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δυνησόμεθα
  choice: Comment pourrons-nous
  rationale: Rend naturellement la question rhétorique ainsi que la capacité future exprimée par le futur de δύναμαι.
- source_word: ὑποστῆναι
  choice: tenir
  rationale: Dans ce contexte d’affrontement, le verbe évoque le fait de rester ferme et de résister, sans imposer une précision absente du grec.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: devant eux
  rationale: Conserve l’image de leur faire face; le contexte militaire lui donne une portée hostile.
- source_word: ἐὰν μὴ
  choice: si… ne… pas
  rationale: Cette formulation conditionnelle est naturelle en français et préserve la relation explicite entre leur capacité à tenir et l’aide demandée.
- source_word: σὺ
  choice: toi, tu
  rationale: Le pronom grec explicite est emphatique; la dislocation française rend cette insistance avec naturel.
- source_word: βοηθήσῃς ἡμῖν
  choice: tu ne nous aides pas
  rationale: Rend directement l’idée de venir en aide, avec le destinataire au datif exprimé par « nous ».
theological_decisions:
- issue: Appel direct à Dieu dans une supplication militaire
  choice: Conserver l’adresse emphatique à la deuxième personne sans ajouter de promesse de victoire
  alternative: Comment pourrons-nous leur résister, si tu ne viens pas à notre aide ?
  rationale: Le grec affirme la dépendance envers l’aide divine, mais ne précise ici ni la forme de cette aide ni l’issue du combat.
translation_notes:
  register: Français international moderne, digne et direct. « Tenir devant eux » préserve l’image grecque tout en laissant la note expliciter son sens conflictuel; « si toi, tu » maintient l’emphase du pronom σὺ.
