  yaml_path: translation/deuterocanon/1_maccabees/003/023.yaml
  text: And when he stopped speaking[a], he suddenly charged at them[b], and Seron and his camp were crushed before him.
translation:
  language: fr
  text: Dès qu’il eut fini de parler, il fondit soudain sur eux[a], et Séron et son armée[b] furent écrasés devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se jeta brusquement sur eux » ou « se précipita sur eux ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son camp » ; le terme peut aussi désigner ses troupes ou ses forces.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Dès qu’il eut fini de parler
  rationale: La tournure exprime l’achèvement du discours suivi immédiatement de l’action; « dès que » rend clairement cet enchaînement.
- source_word: ἐνήλατο ἐπʼ αὐτοὺς
  choice: il fondit sur eux
  rationale: Le verbe décrit un mouvement offensif brusque; « fondre sur » conserve cette vigueur martiale en français naturel.
- source_word: ἄφνω
  choice: soudain
  rationale: Équivalent direct qui souligne la brusquerie de l’attaque.
- source_word: συνετρίβη
  choice: furent écrasés
  rationale: Le passif grec possède une image forte de brisement ou d’écrasement; le pluriel français s’accorde avec le sujet composé.
- source_word: Σήρων
  choice: Séron
  rationale: Translittération française usuelle du nom grec Σήρων.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son armée
  rationale: Dans ce contexte de bataille et avec un verbe décrivant une défaite, παρεμβολή désigne naturellement les troupes de Séron, tout en pouvant littéralement évoquer son camp.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Rend directement l’idiome grec sans préciser davantage si l’accent porte sur la présence de Judas ou sur l’affrontement en face de lui.
