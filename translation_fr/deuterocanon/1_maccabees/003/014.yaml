  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: fr
  text: 'Il dit : « Je me ferai un nom, je serai couvert de gloire dans le royaume, et je combattrai Judas ainsi que ceux qui sont avec lui et qui méprisent la parole du roi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre du roi » ou « le décret du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: Je me ferai un nom
  rationale: Expression idiomatique naturelle en français, qui conserve l’idée de rechercher pour soi renommée et réputation.
- source_word: δοξασθήσομαι
  choice: je serai couvert de gloire
  rationale: Rend le futur passif et maintient explicitement le champ sémantique de la gloire, dans une tournure française naturelle.
- source_word: ἐν τῇ βασιλείᾳ
  choice: dans le royaume
  rationale: Traduction directe et sobre de βασιλεία, sans ajouter un complément absent du grec.
- source_word: πολεμήσω
  choice: je combattrai
  rationale: Rend avec concision l’action militaire hostile exprimée par le verbe grec.
- source_word: τὸν Ἰούδαν
  choice: Judas
  rationale: En français biblique, Judas est la forme usuelle du nom du chef maccabéen désigné ici; elle évite la confusion avec le territoire ou la tribu de Juda.
- source_word: τοὺς σὺν αὐτῷ
  choice: ceux qui sont avec lui
  rationale: Reproduction directe qui ne précise pas indûment la fonction de ses associés.
- source_word: τοὺς ἐξουθενοῦντας
  choice: qui méprisent
  rationale: 'ἐξουθενέω exprime davantage qu’une simple négligence : il s’agit de tenir pour rien ou de traiter avec mépris.'
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: la parole du roi
  rationale: Conserve le sens lexical de λόγος tout en restant intelligible; dans le contexte, cette parole peut désigner un ordre royal.
theological_decisions:
- issue: Identification de Ἰούδαν
  choice: Judas, le chef maccabéen
  alternative: Juda
  rationale: Le contexte désigne une personne précise. « Judas » est la forme française conventionnelle de ce nom dans 1 Maccabées et évite une ambiguïté inutile avec Juda.
- issue: Portée de λόγος dans « la parole du roi »
  choice: Conserver « parole » dans le texte
  alternative: Traduire par « ordre » ou « décret »
  rationale: Le grec λόγος reste ouvert lexicalement, même si le contexte politique suggère fortement un ordre royal; la note préserve cette possibilité sans la faire entrer de force dans le texte.
translation_notes:
  register: Français moderne, international et digne. La coordination répétée du grec est légèrement allégée sans modifier la progression de la déclaration. « Couvert de gloire » conserve la valeur passive de δοξασθήσομαι dans une formulation courante.
