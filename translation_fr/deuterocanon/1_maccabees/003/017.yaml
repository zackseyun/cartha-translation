base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: fr
  text: 'Mais lorsqu’ils virent le camp venir à sa rencontre[a], ils dirent à Judas : « Comment pourrons-nous, si peu nombreux, combattre contre une multitude si nombreuse ? Et nous sommes épuisés[b], sans avoir mangé aujourd’hui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venir contre lui ». L’expression grecque signifie littéralement qu’il vient à sa rencontre ; dans ce contexte militaire, il s’agit d’un affrontement hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous sommes sans force ». Le grec peut désigner un état d’affaiblissement ou de découragement, lié ici au manque de nourriture.
    reason: lexical_alternative
  - marker: c
    text: 'On pourrait aussi traduire : « en jeûnant aujourd’hui ». Le grec indique qu’ils sont sans nourriture, sans préciser s’il s’agit d’un jeûne religieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: le camp
  rationale: Dans ce contexte militaire, le terme peut désigner le camp ou les troupes qui y sont rassemblées. « Le camp » conserve l’image concrète du grec.
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: venir à sa rencontre
  rationale: Cette formulation rend le mouvement vers une rencontre sans expliciter davantage que le grec son caractère hostile, déjà évident dans le contexte militaire.
- source_word: ὀλιγοστοὶ ὄντες
  choice: si peu nombreux
  rationale: Cette tournure française naturelle met en valeur le contraste numérique avec la grande force adverse.
- source_word: πολεμῆσαι
  choice: combattre
  rationale: « Combattre » est un équivalent courant et digne dans ce contexte d’affrontement militaire.
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: combattre une multitude aussi grande
  rationale: En français, « combattre » peut prendre ici un complément direct. « Une multitude aussi grande » maintient l’ampleur et la force rhétorique de l’expression grecque.
- source_word: ἐκλελύμεθα
  choice: nous sommes épuisés
  rationale: Le parfait exprime un état présent d’affaiblissement ou d’abattement. « Épuisés » convient au lien immédiat avec le manque de nourriture.
- source_word: ἀσιτοῦντες
  choice: nous n’avons rien mangé
  rationale: Le participe signifie qu’ils sont restés sans manger. Cette traduction naturelle n’impose pas l’idée d’un jeûne religieux formel.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image du « camp » en mouvement et laisse au contexte militaire le soin d’indiquer l’hostilité. Le discours direct reste naturel, tout en maintenant le contraste rhétorique entre le petit nombre des hommes de Judas et la multitude adverse.
