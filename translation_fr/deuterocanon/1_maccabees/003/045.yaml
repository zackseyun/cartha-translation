revisions:
- from: Jérusalem était inhabitée, pareille à un désert. Personne n’entrait ni ne sortait parmi ceux qu’elle avait enfantés[a]. Le sanctuaire était foulé aux pieds, et des fils d’étrangers occupaient la citadelle[b], devenue un lieu de séjour pour les nations. Toute joie fut enlevée à Jacob, et la flûte et la lyre[c] cessèrent de résonner.
  to: Jérusalem était inhabitée, pareille à un désert. Personne, parmi ceux qu’elle avait engendrés[a], n’entrait ni ne sortait. Le sanctuaire était foulé aux pieds, et des fils d’étrangers étaient dans la citadelle[b], un lieu de séjour pour les nations. La joie fut enlevée à Jacob, et la flûte et la lyre[c] cessèrent de résonner.
  rationale: La révision enlève les ajouts sémantiques de « occupaient », « devenue » et « toute », tout en conservant le registre moderne et la structure descriptive du verset. Elle repositionne aussi le groupe correspondant à γενημάτων afin de mieux refléter sa relation avec les personnes qui entraient et sortaient, sans résoudre indûment cette expression grecque inhabituelle. Les ancres et les trois notes restent cohérentes avec le texte révisé.
