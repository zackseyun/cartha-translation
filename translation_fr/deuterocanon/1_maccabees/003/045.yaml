base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: fr
  text: Jérusalem était inhabitée, pareille à un désert. Personne, parmi ceux qu’elle avait engendrés[a], n’entrait ni ne sortait. Le sanctuaire était foulé aux pieds, et des fils d’étrangers étaient dans la citadelle[b], un lieu de séjour pour les nations. La joie fut enlevée à Jacob, et la flûte et la lyre[c] cessèrent de résonner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « ceux qu’elle avait engendrés » signifie littéralement « ce qui est engendré » ou « ce qui est né ». Ici, il désigne probablement les personnes nées à Jérusalem, c’est-à-dire ses habitants.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’Acra », la citadelle fortifiée de Jérusalem.
    reason: alternative_reading
  - marker: c
    text: Ou « harpe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος ὡς ἔρημος
  choice: inhabitée, pareille à un désert
  rationale: « Inhabitée » exprime concrètement l’absence d’habitants, tandis que « pareille à un désert » conserve la comparaison du grec sans confondre les deux expressions.
- source_word: ὁ εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: Personne n’entrait ni ne sortait
  rationale: Cette formulation française naturelle conserve le couple verbal qui évoque l’absence de toute circulation ordinaire.
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: parmi ceux qu’elle avait enfantés
  rationale: Le grec transmis emploie un mot signifiant littéralement ce qui est engendré ou né. La personnification de Jérusalem est conservée, sans remplacer silencieusement le terme par « habitants ».
- source_word: ἁγίασμα
  choice: sanctuaire
  rationale: Le mot désigne le lieu saint; « sanctuaire » est précis, courant et adapté au contexte du Temple.
- source_word: καταπατούμενον
  choice: était foulé aux pieds
  rationale: Cette expression garde à la fois l’image physique du piétinement et sa portée déshonorante, sans la réduire au seul sens interprétatif de « profané ».
- source_word: υἱοὶ ἀλλογενῶν
  choice: des fils d’étrangers
  rationale: La traduction conserve la forme explicite du grec plutôt que de la simplifier en « étrangers ».
- source_word: ἄκρα
  choice: citadelle
  rationale: Le nom commun désigne ici la forteresse de Jérusalem connue comme l’Acra. « Citadelle » rend immédiatement sa fonction; le nom historique figure en note.
- source_word: κατάλυμα ἐν τοῖς ἔθνεσιν
  choice: un lieu de séjour pour les nations
  rationale: « Lieu de séjour » rend κατάλυμα sans préciser indûment s’il s’agit de quartiers militaires ou d’une habitation. « Nations » conserve la portée de ἔθνεσιν sans imposer « païens » ou « non-Juifs ».
- source_word: ἐξῆρθη τέρψις
  choice: Toute joie fut enlevée
  rationale: « Joie » est idiomatique en français pour τέρψις dans ce tableau de deuil; « fut enlevée » conserve l’idée explicite de retrait. « Toute » rend naturellement la portée générale de l’absence de réjouissance.
- source_word: αὐλὸς καὶ κινύρα
  choice: la flûte et la lyre
  rationale: Ces noms désignent deux instruments associés aux réjouissances. « Lyre » est un équivalent moderne clair de κινύρα; « harpe » reste possible et est signalé en note.
- source_word: ἐξέλιπεν
  choice: cessèrent de résonner
  rationale: Le verbe signifie que les instruments disparurent de la scène ou cessèrent; l’ajout idiomatique « de résonner » explicite naturellement en français que leur musique ne se faisait plus entendre.
theological_decisions:
- issue: Sens inhabituel de ἐκ τῶν γενημάτων αὐτῆς
  choice: parmi ceux qu’elle avait enfantés
  alternative: parmi ses habitants; parmi ceux qui étaient nés en elle
  rationale: Le texte grec personnifie vraisemblablement Jérusalem comme mère de sa population. La traduction garde cette image et l’étrangeté réelle du témoin grec, tandis que la note indique le sens contextuel probable.
- issue: ἄκρα comme nom commun ou nom propre historique
  choice: citadelle
  alternative: l’Acra
  rationale: La traduction du nom commun assure la compréhension immédiate sans nier l’identification historique; celle-ci est préservée en note.
- issue: Sens de ἔθνεσιν
  choice: nations
  alternative: non-Juifs; païens
  rationale: « Nations » reste proche du grec et évite de préciser davantage que le texte la relation religieuse ou ethnique du groupe concerné.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset conserve la personnification de Jérusalem, les images concrètes du désert et du sanctuaire foulé aux pieds, ainsi que l’ambiguïté de γενημάτων. Les longues coordinations grecques ont été réparties en phrases françaises pour la clarté, sans modifier la progression du tableau.
