review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend fidèlement l''image d''une Jérusalem sans habitants, le sanctuaire foulé aux pieds, la présence des fils d''étrangers dans la citadelle et la cessation de la musique. Deux formulations introduisent toutefois des nuances absentes du grec : « occupaient » suggère une prise de possession active, alors que ἐν τῇ ἄκρᾳ signifie simplement « étaient dans la citadelle » ; « devenue » ajoute une transformation explicitement formulée qui n''est pas exprimée. « Parmi ceux qu''elle avait enfantés » peut aussi laisser entendre que les entrées et sorties se faisaient à l''intérieur de ce groupe, plutôt que de présenter les personnes nées d''elle comme celles qui entraient et sortaient. La formulation révisée conserve l''étrangeté contrôlée de γενημάτων sans la surinterpréter.'
  naturalness: Le français est globalement moderne, digne et lisible. « Ceux qu'elle avait enfantés » est compréhensible mais un peu lourd dans cette personnification urbaine ; « ceux qu'elle avait engendrés » est plus soutenu et naturel dans ce registre. La construction « personne, parmi ceux qu'elle avait engendrés, n'entrait ni ne sortait » clarifie la fonction de ce groupe sans convertir le mot en « habitants ».
  terminology: « Sanctuaire », « citadelle », « nations », « Jacob », « flûte » et « lyre » conviennent. « Fils d'étrangers » reproduit de façon transparente la précision du grec, sans imposer une catégorie confessionnelle plus précise. La note sur l'Acra et l'alternative « harpe » sont adéquates.
  issues:
  - severity: medium
    issue: « occupaient la citadelle » dépasse le sens de ἐν τῇ ἄκρᾳ.
    rationale: Le grec indique la localisation (« étaient dans la citadelle »), non explicitement l'action d'occuper ou de prendre possession.
  - severity: medium
    issue: « devenue un lieu de séjour » ajoute une relation de transformation non exprimée.
    rationale: Κατάλυμα est apposé à la citadelle ; « un lieu de séjour pour les nations » suffit à rendre le grec sans ajout.
  - severity: low
    issue: La place de « parmi ceux qu'elle avait enfantés » est syntaxiquement ambiguë en français.
    rationale: Placée après « n'entrait ni ne sortait », elle peut qualifier le lieu ou le cadre du mouvement. La déplacer auprès de « personne » rend mieux la fonction des γενήματα tout en préservant l'incertitude lexicale.
  - severity: low
    issue: « Toute joie » renforce légèrement τέρψις.
    rationale: Le grec parle de « la joie/le plaisir » retiré de Jacob, sans quantificateur explicite. « La joie » est plus strict.
  revised_text: Jérusalem était inhabitée, pareille à un désert. Personne, parmi ceux qu’elle avait engendrés[a], n’entrait ni ne sortait. Le sanctuaire était foulé aux pieds, et des fils d’étrangers étaient dans la citadelle[b], un lieu de séjour pour les nations. La joie fut enlevée à Jacob, et la flûte et la lyre[c] cessèrent de résonner.
