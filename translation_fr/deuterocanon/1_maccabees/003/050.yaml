  yaml_path: translation/deuterocanon/1_maccabees/003/050.yaml
  text: And they cried out with a loud voice to heaven[a], saying, “What shall we do with these, and where shall we take them?”
translation:
  language: fr
  text: 'Ils crièrent d’une voix forte vers le ciel : « Que ferons-nous de ceux-ci, et où les emmènerons-nous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et où les conduirons-nous loin d’ici ? » Le verbe grec peut souligner l’idée de les éloigner du lieu présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησαν
  choice: ils crièrent
  rationale: Le verbe exprime un appel puissant et pressant ; « crièrent » conserve ici la force et la tonalité de supplication.
- source_word: φωνῇ
  choice: d’une voix forte
  rationale: Avec ἐβόησαν, le nom souligne l’intensité de l’appel. Cette tournure est naturelle en français et rend la valeur emphatique de l’expression grecque.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: La préposition marque la direction de l’appel. « Vers le ciel » garde le référent explicite du grec sans remplacer implicitement le ciel par Dieu.
- source_word: Τί ποιήσωμεν
  choice: Que ferons-nous
  rationale: Le futur français exprime naturellement la délibération urgente portée par le subjonctif grec, sans transformer la question en recommandation.
- source_word: τούτοις
  choice: de ceux-ci
  rationale: Le démonstratif substantivé reste volontairement peu explicite dans le grec. « De ceux-ci » en conserve le renvoi contextuel sans identifier davantage les personnes concernées.
- source_word: ἀπαγάγωμεν
  choice: les emmènerons-nous
  rationale: Le composé ἀπάγω suggère qu’on conduit ou emporte des personnes loin du lieu présent. « Emmener » rend naturellement en français ce mouvement d’éloignement.
theological_decisions:
- issue: Destinataire implicite du cri dirigé vers le ciel
  choice: Conserver « vers le ciel »
  alternative: « vers Dieu au ciel » ou « vers le Seigneur »
  rationale: Le grec nomme le ciel et laisse Dieu comme destinataire implicite. La traduction préserve cette formulation et n’ajoute aucun titre divin absent du texte.
translation_notes:
  register: Français moderne, international et digne. La phrase garde l’urgence de la supplication, le démonstratif peu explicite et le destinataire divin implicite, tout en évitant une formulation artificiellement littérale.
