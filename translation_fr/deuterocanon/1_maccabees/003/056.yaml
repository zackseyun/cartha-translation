  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: fr
  text: Puis il ordonna à ceux qui construisaient une maison, à ceux qui étaient fiancés à des femmes, à ceux qui plantaient des vignes et à ceux qui avaient peur[b] de retourner chacun chez lui, conformément à la Loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « conformément à la Loi » fait probablement allusion aux exemptions du service militaire énoncées en Deutéronome 20.5-8.
    reason: cross_reference
  - marker: b
    text: Ou « les timides » ou « les lâches ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: ceux qui construisaient une maison
  rationale: Le participe présent avec son complément désigne les hommes occupés à bâtir une maison. L’imparfait français convient au cadre narratif passé sans modifier l’aspect de l’activité en cours.
- source_word: μνηστευομένοις γυναῖκας
  choice: ceux qui étaient fiancés
  rationale: Le verbe désigne l’état de fiançailles dans son cadre social et juridique. En français, « être fiancés » exprime naturellement cette catégorie; préciser « à des femmes » serait lourd et inutile dans ce contexte militaire masculin.
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: ceux qui plantaient des vignes
  rationale: ἀμπελών désigne un vignoble ou une vigne au sens de terrain planté. « Planter des vignes » est l’expression française courante et conserve le parallélisme participial.
- source_word: δειλοῖς
  choice: ceux qui avaient peur
  rationale: Cette formulation préserve ici l’idée de peur face au combat sans imposer le jugement moral plus appuyé de « lâches ».
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: de retourner chacun chez lui
  rationale: L’infinitif dépend de εἶπεν et porte la valeur d’un ordre indirect. « Retourner chacun chez lui » restitue le mouvement de retour et la distribution individuelle.
- source_word: κατὰ τὸν νόμον
  choice: conformément à la Loi
  rationale: La formule indique l’accord avec la loi. La majuscule signale naturellement, dans ce contexte, la Loi reconnue par la communauté sans ajouter « de Moïse », absent du grec.
- source_word: εἶπεν
  choice: il ordonna
  rationale: Bien que le sens lexical premier soit « il dit », l’infinitif qui suit exprime une directive. « Il ordonna » rend clairement cette force syntaxique en français naturel.
theological_decisions:
- issue: Explicitation de l’arrière-plan de Deutéronome 20.5-8
  choice: Conserver « conformément à la Loi » dans le texte et placer l’allusion en note
  alternative: « conformément à la loi de Moïse » ou expliciter les exemptions militaires
  rationale: Le grec dit seulement « la loi ». L’allusion est forte, mais l’expliciter dans le corps du texte ajouterait une précision absente de la source.
- issue: Portée morale de δειλοῖς
  choice: « ceux qui avaient peur »
  alternative: « les timides » ou « les lâches »
  rationale: Le contexte légal concerne ceux qui ont peur avant la bataille. La traduction choisie maintient cette réalité sans trancher en faveur d’une condamnation morale.
- issue: Formes masculines distributives dans un contexte militaire
  choice: « chacun chez lui »
  alternative: « chaque personne chez elle »
  rationale: La formulation masculine distributive correspond au grec et au groupe militaire visé, tout en restant idiomatique en français.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe coordonnée du grec est allégée sans perdre les quatre catégories. Les deux appels de note figurent dans le texte principal; la note sur la Loi est placée après l’expression qu’elle explique.
