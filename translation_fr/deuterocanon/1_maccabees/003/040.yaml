lexical_decisions:
- source_word: ἀπῆραν
  choice: partirent
  rationale: Le verbe exprime ici la levée du camp et le départ; « partirent » est naturel et précis dans ce contexte militaire.
- source_word: σὺν πάσῃ τῇ δυνάμει αὐτῶν
  choice: avec toutes leurs forces
  rationale: Dans ce contexte, δύναμις désigne l’ensemble des forces militaires, plutôt qu’une puissance abstraite.
- source_word: παρεβάλον
  choice: établirent leur camp
  rationale: Le verbe militaire signifie camper ou dresser son camp; cette formulation française garde clairement l’action.
- source_word: Ἀμμαοῦν
  choice: Ammaous
  rationale: Translittération proche de la forme grecque de l’édition source, sans la normaliser silencieusement en « Emmaüs ».
- source_word: ἐν τῇ γῇ τῇ πεδινῇ
  choice: dans la région de la plaine
  rationale: Rend l’expression géographique désignant le bas pays ou la région de plaine, sans ajouter une identification technique absente du texte.
