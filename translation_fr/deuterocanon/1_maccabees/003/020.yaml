  text: They are coming against us in a great mass of insolence and lawlessness, to wipe out us and our wives and our children, and to plunder us.
translation:
  language: fr
  text: Ils viennent contre nous en grand nombre, avec insolence et mépris de la loi[a], afin de nous exterminer, ainsi que nos femmes et nos enfants, et de nous piller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure grecque peut aussi se rendre plus littéralement : « avec une multitude d’insolence et de mépris de la loi ». Elle associe de façon inhabituelle l’idée de multitude à ces deux dispositions morales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: Ils viennent contre nous
  rationale: Dans ce contexte militaire, πρός marque une avancée hostile ; « contre nous » l’exprime clairement sans amplification.
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  choice: en foule, avec insolence et au mépris de toute loi
  rationale: Cette formulation française naturelle rend πλήθει par l’idée d’une foule nombreuse et restitue les deux qualifications morales, tout en signalant en note l’ambiguïté de la construction grecque.
- source_word: ὕβρεως
  choice: insolence
  rationale: Le terme désigne une arrogance offensante, voire violente ; « insolence » en conserve ici la portée morale.
- source_word: ἀνομίας
  choice: au mépris de toute loi
  rationale: Cette expression rend l’idée de refus ou de transgression de la loi portée par ἀνομία, dans un français plus naturel que « illégalité ».
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: afin de nous exterminer
  rationale: L’infinitif articularisé indique le but, et ἐξαίρω exprime ici l’élimination complète.
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: ainsi que nos femmes et nos enfants
  rationale: Dans ce contexte familial et avec les possessifs, γυναῖκες désigne naturellement les épouses ; « ainsi que » rattache sans ambiguïté les femmes et les enfants à l’objet d’« exterminer ».
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: et de nous piller
  rationale: σκυλεύω évoque le dépouillement ou le pillage des vaincus ; « piller » est direct, actuel et adapté au contexte militaire.
