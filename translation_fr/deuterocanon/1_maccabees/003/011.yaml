  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: fr
  text: Judas l’apprit et sortit à sa rencontre. Il le frappa et le tua. Beaucoup tombèrent blessés[a], et les autres prirent la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « beaucoup de blessés tombèrent ». Le grec parle de combattants blessés, sans dire explicitement qu’ils furent tués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprit
  rationale: L’aoriste de γινώσκω exprime ici le fait que Judas prend connaissance de la situation; « l’apprit » rend naturellement cette valeur ponctuelle.
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: sortit à sa rencontre
  rationale: L’expression signifie littéralement aller à la rencontre de quelqu’un; le contexte militaire laisse entendre l’affrontement sans qu’il soit nécessaire d’ajouter « contre lui ».
- source_word: ἐπάταξεν αὐτόν
  choice: le frappa
  rationale: πατάσσω désigne un coup violent. La traduction reste distincte du verbe suivant, qui énonce explicitement la mise à mort.
- source_word: ἀπέκτεινεν
  choice: le tua
  rationale: Rendu direct et moderne de ἀποκτείνω.
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: beaucoup tombèrent blessés
  rationale: τραυματίαι désigne des blessés. Cette formulation conserve l’image de leur chute et n’introduit pas l’idée qu’ils furent nécessairement tués.
- source_word: οἱ ἐπίλοιποι
  choice: les autres
  rationale: Désigne le reste des hommes de la troupe; « les autres » est idiomatique en français dans cette opposition.
- source_word: ἔφυγον
  choice: prirent la fuite
  rationale: Expression française naturelle et soutenue pour une troupe qui fuit le combat.
