  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: fr
  text: Il fut profondément désemparé[a] et décida de se rendre en Perse, afin de percevoir les impôts des régions et d’amasser beaucoup d’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut profondément perplexe » ou « se trouva dans une grande détresse ». Le verbe grec peut exprimer aussi bien le désarroi que le fait de se trouver dans une situation très difficile.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne littéralement l’argent métal, employé ici comme richesse monétaire, sous forme de pièces ou d’argent pesé.
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο τῇ ψυχῇ αὐτοῦ σφόδρα
  choice: Il fut profondément désemparé
  rationale: ἠπορεῖτο peut exprimer la perplexité, l’impasse ou une grande détresse; « profondément désemparé » rend naturellement l’état intérieur renforcé par σφόδρα, sans réduire le sens à une simple émotion. Le français n’exige pas ici de traduire séparément τῇ ψυχῇ αὐτοῦ.
- source_word: ἐβουλεύσατο
  choice: décida
  rationale: Le moyen indique une délibération qui aboutit à une ligne de conduite; « décida » est clair et actuel.
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  choice: de se rendre en Perse
  rationale: Cette formulation rend le déplacement projeté de manière naturelle et digne en français.
- source_word: λαβεῖν τοὺς φόρους τῶν χωρῶν
  choice: percevoir les impôts des régions
  rationale: φόροι désigne ici les prélèvements fiscaux ou tributs; « percevoir les impôts » convient au contexte administratif, tandis que « régions » garde la généralité de χωρῶν.
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: amasser beaucoup d’argent
  rationale: ἀργύριον signifie littéralement « argent » au sens du métal et, par extension, de la monnaie. En français, « argent » conserve heureusement ces deux possibilités et exprime naturellement la richesse monétaire.
