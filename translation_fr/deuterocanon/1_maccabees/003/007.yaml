  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: fr
  text: Il remplit d’amertume de nombreux rois, réjouit Jacob par ses actions, et sa mémoire est une bénédiction à jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa mémoire est pour bénédiction à jamais ». La formule grecque est nominale ; on peut aussi comprendre : « sa mémoire est bénie à jamais ».'
    reason: La note conserve la tournure littérale de la formule grecque et signale, sans l’imposer dans le texte, la possibilité d’une compréhension passive.
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: remplit d’amertume
  rationale: Conserve l’image de l’amertume et exprime naturellement en français l’effet produit sur les rois ennemis.
- source_word: βασιλεῖς πολλούς
  choice: de nombreux rois
  rationale: Rend précisément βασιλεῖς sans l’élargir au sens plus général de « dirigeants ».
- source_word: ηὔφρανεν
  choice: réjouit
  rationale: Verbe causatif naturel et digne, indiquant qu’il procura de la joie.
- source_word: τὸν Ἰακώβ
  choice: Jacob
  rationale: Maintient le nom ancestral employé collectivement pour le peuple, sans le remplacer par l’interprétation « Israël ».
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: par ses exploits
  rationale: Le contexte guerrier favorise « exploits » pour ἔργα ; « par » exprime ici le moyen de la réjouissance.
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: sa mémoire
  rationale: Formulation française naturelle pour la mémoire durable laissée par une personne.
- source_word: ἕως τοῦ αἰῶνος … εἰς εὐλογίαν
  choice: à jamais, sa mémoire sera une bénédiction
  rationale: Rend clairement la durée perpétuelle et l’idiome de bénédiction, tout en signalant en note la structure nominale plus littérale du grec.
theological_decisions:
- issue: Sens collectif de « Jacob »
  choice: Conserver « Jacob » comme nom collectif du peuple de l’alliance.
  alternative: Israël
  rationale: Le grec porte explicitement Ἰακώβ. Le maintien du nom préserve le registre scripturaire et évite de résoudre son emploi collectif dans le corps du texte.
- issue: Formule finale de bénédiction
  choice: « à jamais, sa mémoire sera une bénédiction »
  alternative: « à jamais, sa mémoire est en bénédiction » ou « sa mémoire est bénie à jamais »
  rationale: Le grec emploie une formule nominale, sans verbe exprimé. La traduction retenue est idiomatique en français sans imposer le passif « sera bénie » ; la note préserve la forme littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme ternaire est conservé ; « remplit d’amertume » maintient la métaphore grecque, tandis que « exploits » convient au contexte héroïque et militaire.
