  naturalness: « Il remplit d’amertume de nombreux rois » est soutenu mais naturel dans un registre biblique moderne. « Sa mémoire est une bénédiction à jamais » est idiomatique en français et conserve mieux que le futur le caractère proverbial et nominal de la conclusion.
  terminology: « Rois » et « Jacob » sont justes. « Mémoire » convient à μνημόσυνον dans ce contexte. « Actions » rend ἔργοις sans l’amplification interprétative de « exploits ».
