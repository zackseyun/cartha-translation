  text: And Judas[a], who was called Maccabeus, his son, rose up in his place.
translation:
  language: fr
  text: Alors Judas, son fils, appelé Maccabée, se leva à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: se leva
  rationale: L’aoriste de ἀνίστημι marque ici l’entrée de Judas dans l’action après son père. « Se leva » conserve la force narrative sans en faire explicitement une accession officielle.
- source_word: ὁ καλούμενος
  choice: surnommé
  rationale: L’expression participiale introduit le nom ou l’épithète sous lequel Judas était connu. « Surnommé » est naturel en français dans ce contexte onomastique.
- source_word: Μακκαβαῖος
  choice: Maccabée
  rationale: « Maccabée » est la forme française traditionnelle et directement intelligible de l’épithète grecque Μακκαβαῖος.
- source_word: υἱὸς αὐτοῦ
  choice: son fils
  rationale: Cette formulation française naturelle identifie Judas comme le fils du personnage mentionné précédemment.
- source_word: ἀντʼ αὐτοῦ
  choice: pour prendre sa place
  rationale: ἀντί avec le génitif exprime ici le remplacement ou la succession. Cette tournure rend le mouvement narratif sans employer un terme politique ou institutionnel plus technique que le grec.
theological_decisions:
- issue: Nature de la succession de Judas
  choice: se leva pour prendre sa place
  alternative: lui succéda
  rationale: Le grec présente Judas entrant en action à la place de son père, mais n’emploie pas de terme technique désignant une succession officielle. La traduction conserve cette nuance.
translation_notes:
  register: Français moderne, international et dignifié. L’ordre des constituants est légèrement réorganisé pour une lecture naturelle, tout en préservant l’identification de Judas comme fils et porteur de l’épithète Maccabée.
