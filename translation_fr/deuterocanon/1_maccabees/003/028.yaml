lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: trésor
  rationale: Désigne ici le dépôt où sont conservées les réserves financières du souverain; « trésor » est naturel et précis en français.
- source_word: ὀψώνια
  choice: solde
  rationale: Dans ce contexte militaire, le terme désigne la rémunération versée aux soldats; « solde » convient mieux que le terme général « salaire ».
- source_word: δυνάμεσιν
  choice: troupes
  rationale: Le contexte désigne les forces militaires du souverain; « troupes » est clair et idiomatique.
- source_word: εἰς πᾶσαν χρείαν
  choice: à répondre à tout besoin
  rationale: Cette formulation conserve l'étendue indéterminée de πᾶσαν χρείαν tout en donnant un français naturel.
