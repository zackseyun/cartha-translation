  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: fr
  text: Une puissante armée[a] d’impies vint s’ajouter à lui et monta avec lui, afin de l’aider et d’exercer la vengeance[b] contre les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un puissant camp d’impies vint s’ajouter à lui et monta avec lui ». Le grec παρεμβολή peut désigner un camp ou une armée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « exercer la vengeance dans les fils d’Israël »; dans ce contexte, il s’agit d’une action punitive dirigée contre eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: se joignit encore à lui
  rationale: Le moyen a ici le sens d’un ajout au groupe déjà évoqué. Cette formulation française rend naturellement l’arrivée d’un renfort, tandis que « encore » traduit la valeur additive de καὶ προσεθέτο.
- source_word: ἀνέβη
  choice: monta
  rationale: Rend directement le mouvement exprimé par ἀναβαίνω sans ajouter à lui seul une précision militaire déjà fournie par le contexte.
- source_word: παρεμβολὴ
  choice: armée
  rationale: Le mot peut désigner un camp ou les forces qui le composent. Ici, puisqu’il s’agit d’un groupe puissant qui accompagne le commandant et lui prête main-forte, « armée » est le terme français le plus naturel; l’ambiguïté lexicale est signalée en note.
- source_word: ἀσεβῶν
  choice: d’impies
  rationale: « Impies » conserve la portée à la fois religieuse et morale du grec, plutôt que de réduire le terme à la seule méchanceté.
- source_word: ἰσχυρὰ
  choice: puissante
  rationale: Adjectif naturel en français pour qualifier une force militaire importante et redoutable.
- source_word: βοηθῆσαι αὐτῷ
  choice: pour lui prêter main-forte
  rationale: L’infinitif exprime le but. Cette locution actuelle convient particulièrement à l’arrivée d’un renfort militaire.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: exercer la vengeance
  rationale: Conserve la force rétributive de ἐκδίκησις sans l’atténuer en une simple idée de punition.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: contre les fils d’Israël
  rationale: Dans ce contexte hostile, ἐν désigne les personnes visées par l’action punitive. « Fils d’Israël » préserve l’expression ethnique et biblique du grec.
theological_decisions:
- issue: Portée religieuse de ἀσεβῶν
  choice: impies
  alternative: méchants; sans foi; profanateurs
  rationale: Le terme grec caractérise ces hommes par leur irrévérence envers Dieu et l’ordre religieux, et non seulement par une conduite moralement mauvaise.
- issue: Désignation υἱοῖς Ἰσραήλ
  choice: fils d’Israël
  alternative: peuple d’Israël; Israélites
  rationale: Le grec emploie explicitement la désignation biblique traditionnelle. La conserver maintient sa coloration ethnique et religieuse sans élargir ni restreindre le référent.
- issue: Sens de ἐν après l’expression de la vengeance
  choice: contre
  alternative: parmi; sur
  rationale: Le contexte indique une action punitive dirigée contre Israël. La note conserve toutefois la forme plus littérale et l’ambiguïté possible de la préposition.
translation_notes:
  register: Français international moderne, narratif et digne. « Se joignit encore à lui » évite le calque peu naturel « fut ajoutée », tandis que « prêter main-forte » exprime clairement le renfort militaire. Les termes « impies », « vengeance » et « fils d’Israël » maintiennent la portée religieuse et la tension du texte source.
