  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: fr
  text: Son nom parvint jusqu’au roi, et toutes les nations racontaient les combats de Judas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile : il contient littéralement une expression qui peut se rendre « au-delà de toute formation de combat ». Dans ce contexte, elle est généralement comprise comme renvoyant aux combats, aux opérations militaires ou aux formations de Judas. Le rapport exact de cette expression avec le reste de la phrase demeure incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: parvint jusqu’au roi
  rationale: Le verbe signifie littéralement « s’approcha », mais, avec « son nom » comme sujet et ἕως, le français idiomatique exprime que la renommée de Judas parvint à la connaissance du roi.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: Cette traduction conserve l’image grecque du « nom », qui désigne ici la réputation ou la renommée.
- source_word: ὑπὲρ πᾶν παράταξιν
  choice: plus que de toute formation de combat
  rationale: παράταξις désigne une troupe rangée pour le combat ou une formation militaire. Avec l’accusatif, ὑπέρ garde normalement une valeur comparative (« au-delà de », « plus que »), même si la construction grecque demeure difficile.
- source_word: ἐξηγεῖτο
  choice: parlaient de
  rationale: Le verbe peut signifier « raconter », « exposer » ou « faire le récit de ». « Parlaient de » reste naturel et évite de préciser excessivement le contenu de ces récits.
- source_word: πᾶν ἔθνος
  choice: toutes les nations
  rationale: Le singulier distributif grec est rendu par une tournure collective française naturelle, sans changer la portée universelle de l’expression.
- source_word: Ἰούδα
  choice: Judas
  rationale: Dans ce contexte, Ἰούδα désigne Judas Maccabée; « Judas » est la forme française historique usuelle pour ce personnage.
theological_decisions:
- issue: Rapport syntaxique de ὑπὲρ πᾶν παράταξιν avec Judas et le verbe « raconter »
  choice: les nations parlaient de Judas plus que de toute formation de combat
  alternative: les nations parlaient des formations de combat de Judas
  rationale: Le grec place ὑπέρ avec l’accusatif, ce qui favorise normalement une valeur comparative (« au-delà de », « plus que »). Toutefois, la phrase est comprimée et son sens exact reste incertain; la note signale donc une autre compréhension plausible sans résoudre silencieusement la difficulté.
translation_notes:
  register: Français moderne, international et digne. La première proposition reste proche de l’image grecque tout en étant idiomatique; la seconde conserve la comparaison inhabituelle du texte source et en explique l’incertitude en note.
