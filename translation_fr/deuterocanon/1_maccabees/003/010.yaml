  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: fr
  text: Apollonios rassembla des peuples[a] et une grande force venue de Samarie, pour faire la guerre à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations ». Le terme grec peut désigner les nations ou les peuples en général, mais il se rapporte probablement ici à des populations non israélites rassemblées contre Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: rassembla
  rationale: L’aoriste indique qu’Apollonios réunit des personnes et des troupes; « rassembla » reste naturel sans préciser davantage le mode de mobilisation.
- source_word: ἔθνη
  choice: des gens des nations
  rationale: Dans ce récit juif, le terme désigne vraisemblablement des populations non israélites. Cette formulation française exprime des personnes plutôt que des États et conserve le lien lexical avec le sens général de « nations ».
- source_word: δύναμιν μεγάλην
  choice: une force importante
  rationale: Dans le contexte militaire, δύναμις désigne des troupes ou une force armée. « Force importante » préserve cette portée sans imposer le terme plus précis d’« armée ».
- source_word: ἀπὸ Σαμαρίας
  choice: venue de Samarie
  rationale: La préposition marque l’origine de la force; l’ajout idiomatique de « venue » rend clairement ce rapport en français.
- source_word: τοῦ πολεμῆσαι
  choice: afin de faire la guerre
  rationale: L’infinitif articulé exprime ici le but. « Afin de faire la guerre » restitue une action militaire organisée.
- source_word: πρὸς Ἰσραήλ
  choice: à Israël
  rationale: Avec « faire la guerre », le français emploie naturellement « à » pour exprimer l’hostilité dirigée contre Israël.
theological_decisions:
- issue: Sens de ἔθνη dans un contexte de guerre opposant ces groupes à Israël
  choice: des gens des nations
  alternative: les non-Juifs; les nations
  rationale: Le contexte vise probablement des populations non israélites. « Non-Juifs » rendrait explicitement l’opposition mais interpréterait davantage; « nations » seul pourrait être compris comme des entités politiques. Le texte retenu préserve le sens collectif et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe coordonne clairement les deux éléments rassemblés par Apollonios tout en maintenant la provenance samaritaine de la force militaire.
