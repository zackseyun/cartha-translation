  text: And the fear of Judas and of his brothers began, and downfall was falling upon the nations around them.
translation:
  language: fr
  text: Alors, la crainte de Judas et de ses frères commença à se répandre[a], et la ruine s’abattait sur les nations qui les entouraient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la crainte de Judas et de ses frères se fit sentir », c’est-à-dire que la peur qu’ils inspiraient commença à se répandre.
    reason: lexical_alternative
  - marker: b
    text: Ou « la ruine continuait de s’abattre sur les nations environnantes » ; l’imparfait grec suggère une action qui se prolongeait ou se répétait.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: commença à se répandre
  rationale: L’aoriste de ἄρχομαι marque le commencement d’un état. L’ajout idiomatique « à se répandre » explicite naturellement en français la diffusion de cette crainte sans en changer la cause.
- source_word: ὁ φόβος
  choice: la crainte
  rationale: « Crainte » rend φόβος sans imposer l’intensité plus forte de « terreur » et convient au registre narratif.
- source_word: Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: de Judas et de ses frères
  rationale: Cette formulation conserve la relation génitive du grec et son ambiguïté formelle, tandis que le contexte indique qu’il s’agit de la crainte qu’ils inspiraient.
- source_word: ἡ πτῶσις
  choice: la ruine
  rationale: Dans ce contexte militaire, « ruine » exprime la chute ou le désastre subi, plutôt qu’une simple chute physique.
- source_word: ἐπίπτεν
  choice: s’abattait
  rationale: L’imparfait français préserve l’aspect continu ou progressif de l’imparfait grec, et « s’abattait sur » rend l’image de quelque chose qui tombe sur une cible.
- source_word: ἐπὶ τὰ ἔθνη
  choice: sur les nations
  rationale: « Nations » reste large et peu interprétatif pour ἔθνη, qui désigne ici les peuples non juifs environnants.
- source_word: τὰ κύκλῳ αὐτῶν
  choice: qui les entouraient
  rationale: Cette relative idiomatique rend clairement la proximité géographique des nations autour de Judas et de ses frères.
theological_decisions:
- issue: Relation du génitif après φόβος
  choice: Conserver « la crainte de Judas et de ses frères » dans le texte, avec une note explicative.
  alternative: « La crainte qu’inspiraient Judas et ses frères »
  rationale: Le contexte favorise nettement la crainte ressentie par les autres à leur égard, mais la traduction principale évite de remplacer silencieusement la construction génitive grecque par une interprétation entièrement explicite.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve le parallélisme du grec tout en évitant le calque peu naturel « la crainte commença ». « Alors » assure une transition narrative fluide pour καί.
