base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/027.yaml
  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: fr
  text: 'Quand le roi Antiochos entendit ces paroles, il entra dans une violente colère. Il envoya chercher et rassembla toutes les forces de son royaume : un camp très puissant[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner le camp lui-même ou l’armée qui y campe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quand
  rationale: Introduit naturellement la nouvelle étape du récit avec une valeur temporelle.
- source_word: Ἀντίοχος ὁ βασιλεὺς
  choice: le roi Antiochos
  rationale: Suit l’ordre naturel du français tout en conservant le nom et le titre.
- source_word: ἤκουσεν … τοὺς λόγους τούτους
  choice: entendit ces paroles
  rationale: Rend directement le verbe d’audition et λόγους sans réduire explicitement l’expression au sens de « rapport ».
- source_word: ὠργίσθη θυμῷ
  choice: entra dans une violente colère
  rationale: La formulation exprime l’intensité produite par l’association du verbe de colère avec θυμός, sans calque maladroit.
- source_word: ἀπέστειλεν
  choice: envoya des messagers
  rationale: Le verbe est employé sans complément exprimé; dans ce contexte de mobilisation, le français exige de préciser l’objet implicite. « Des messagers » reste une explicitation minimale et vraisemblable.
- source_word: συνήγαγεν
  choice: rassembla
  rationale: Restitue le sens fondamental de réunir, avec une valeur militaire donnée par le complément.
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: toutes les forces de son royaume
  rationale: δυνάμεις désigne ici les forces militaires; la formulation française conserve l’étendue totale indiquée par πάσας.
- source_word: παρεμβολὴν
  choice: un camp
  rationale: Conserve le sens concret principal tout en maintenant, par une note, l’ambiguïté entre le camp et les troupes qui y campent.
- source_word: ἰσχυρὰν σφόδρα
  choice: très puissant
  rationale: Rend l’adjectif et son intensif de manière claire et actuelle; « puissant » convient à une force militaire envisagée comme camp ou armée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les deux propositions grecques reliées par « et » sont réparties en deux phrases pour la lisibilité. Les deux-points préservent l’apposition finale, qui présente les forces rassemblées comme un camp ou une armée en campagne.
