  yaml_path: translation/deuterocanon/1_maccabees/003/016.yaml
  text: And he came near as far as the ascent of Beth-horon[a], and Judas went out to meet him with only a few men.
translation:
  language: fr
  text: Il s’approcha jusqu’à la montée de Beth-Horon[a], et Judas sortit à sa rencontre avec seulement quelques hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Μεθωρών (Methôrôn), forme qui désigne le lieu généralement connu sous le nom de Beth-Horon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: Il s’approcha
  rationale: L’aoriste de ἐγγίζω exprime ici le fait de s’approcher; cette tournure naturelle conserve le mouvement vers le lieu.
- source_word: ἕως ἀναβάσεως
  choice: jusqu’à la montée
  rationale: ἕως avec le génitif marque la limite atteinte, tandis que ἀνάβασις désigne ici une montée ou voie ascendante.
- source_word: Μεθωρών
  choice: Beth-Horon
  rationale: La forme grecque Μεθωρών renvoie au lieu généralement connu sous le nom de Beth-Horon; la graphie française usuelle est retenue et l’écart est signalé en note.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe signifie littéralement sortir; « sortit » évite d’ajouter une nuance militaire qui n’est pas explicitement portée par le verbe.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: Cette expression idiomatique signifie aller à la rencontre de quelqu’un; la formulation française est claire et naturelle.
- source_word: ὀλίγος
  choice: avec seulement quelques hommes
  rationale: L’adjectif au singulier qualifie Judas comme étant peu nombreux, c’est-à-dire accompagné d’un petit nombre d’hommes; le français exige ici d’expliciter ce complément implicite.
