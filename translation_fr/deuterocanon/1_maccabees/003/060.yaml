  text: As his will is in heaven[a], so he will do.
translation:
  language: fr
  text: Mais quelle que soit sa volonté dans le ciel[a], c’est ce qu’il fera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en conservant la structure comparative : « Comme est sa volonté dans le ciel, ainsi fera-t-il. »'
    reason: La structure ὡς ... οὕτως peut être rendue plus formellement ; « est » évite de transformer le présent subjonctif grec en futur.
lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: Mais quelle que soit
  rationale: La particule δέ marque ici une transition, tandis que ὡς ἂν ᾖ apporte une nuance indéfinie. « Mais quelle que soit » rend naturellement l’ensemble en français.
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » exprime sans ajout confessionnel l’intention ou le vouloir désigné par θέλημα.
- source_word: ἐν οὐρανῷ
  choice: dans le ciel
  rationale: Le singulier « le ciel » correspond au grec et constitue la tournure française courante dans ce contexte.
- source_word: οὕτως
  choice: c’est ce que
  rationale: Cette formulation reprend corrélativement la proposition indéfinie initiale et produit un français naturel, tout en conservant le sens de « ainsi ».
- source_word: ποιήσει
  choice: il fera
  rationale: Le futur actif garde l’action personnelle et la simplicité du grec, sans introduire de complément explicite absent du texte.
theological_decisions:
- issue: Sujet implicite de ποιήσει
  choice: il fera
  alternative: cela se fera
  rationale: Le verbe grec est actif, à la troisième personne du singulier, avec un sujet personnel implicite fourni par le contexte. La traduction conserve cette agentivité sans nommer davantage le sujet.
- issue: Portée de la volonté céleste
  choice: quelle que soit sa volonté dans le ciel
  alternative: comme est sa volonté dans le ciel
  rationale: La tournure avec ἄν peut porter une nuance indéfinie. Le texte affirme que l’action correspondra à la volonté céleste sans préciser davantage sa réalisation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la transition marquée par δέ, l’indétermination de ὡς ἂν ᾖ et le sujet personnel implicite du verbe final.
