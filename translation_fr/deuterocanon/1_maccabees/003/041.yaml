base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: fr
  text: Les marchands du pays entendirent parler d’eux[a]. Ils prirent une très grande quantité d’argent et d’or, ainsi que des esclaves, puis vinrent au camp pour prendre comme esclaves les fils d’Israël[b]. Des troupes de Syrie et du pays des étrangers se joignirent à eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entendirent leur nom »; autres traductions possibles : « entendirent parler de leur renommée » ou « apprirent ce qu’on racontait à leur sujet ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie le même mot aux deux occurrences, rendu ici par « esclaves ». Ce mot peut aussi signifier « enfants » ou « jeunes gens », mais le contexte décrit l’acquisition de captifs comme propriété humaine.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Des troupes de Syrie et du pays des étrangers leur furent ajoutées. » Dans certains contextes bibliques, le terme rendu par « étrangers » désigne les Philistins.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: les marchands du pays
  rationale: ἔμποροι désigne des commerçants; χώρα peut signifier pays, territoire ou région. Cette formulation est naturelle et proche du grec.
- source_word: τὸ ὄνομα αὐτῶν
  choice: parler d’eux
  rationale: Littéralement « leur nom »; dans cet emploi, entendre le nom de quelqu’un signifie entendre ce qui se rapporte à lui, sa renommée ou les nouvelles à son sujet. La note conserve l’expression littérale et ses nuances.
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: une très grande quantité d’argent et d’or
  rationale: πολὺ σφόδρα marque une forte intensification de la quantité; la formulation française reste soutenue et naturelle.
- source_word: παῖδας
  choice: des serviteurs / comme esclaves
  rationale: παῖς peut désigner un enfant, un serviteur ou un esclave. Pour les personnes déjà emmenées, « serviteurs » préserve l’indétermination lexicale; pour le sort réservé aux captifs vendus comme propriété humaine, « esclaves » rend clairement le contexte. Le même mot grec est toutefois employé aux deux endroits, ce que signale la note.
- source_word: παρεμβολήν
  choice: camp
  rationale: Le terme a ici son sens militaire courant de campement.
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: pour prendre comme esclaves les fils d’Israël
  rationale: L’infinitif articulé exprime le but. « Fils d’Israël » conserve l’expression explicite du grec, et « comme esclaves » communique le projet de mise en esclavage.
- source_word: προσετέθησαν πρὸς αὐτούς
  choice: se joignirent à eux
  rationale: Cette tournure française naturelle rend l’idée que des forces supplémentaires vinrent grossir leur coalition.
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: des troupes de Syrie et du pays des étrangers
  rationale: δυνάμεις désigne ici des forces militaires. ἀλλόφυλοι signifie littéralement des gens d’un autre peuple; « étrangers » évite de préciser « Philistins » sans nécessité contextuelle.
theological_decisions:
- issue: Sens de παῖδας dans un contexte de commerce de captifs
  choice: « serviteurs » à la première occurrence et « esclaves » à la seconde, avec une note signalant la répétition grecque
  alternative: Employer « esclaves » ou « serviteurs » aux deux occurrences
  rationale: Le contexte impose l’idée d’asservissement pour les fils d’Israël, mais la première occurrence peut désigner des serviteurs déjà présents dans la suite des marchands. La variation française clarifie la situation sans cacher que le grec emploie le même terme polysémique.
- issue: Identification de ἀλλοφύλων
  choice: les étrangers
  alternative: les Philistins
  rationale: Même si la Septante emploie souvent ce terme pour les Philistins, le sens lexical plus large demeure possible ici. La traduction ne fixe donc pas une identification ethnique que ce verset seul n’exige pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluidifiée sans effacer les répétitions ou ambiguïtés importantes du grec; les notes rendent visibles l’idiome « leur nom », la polysémie de παῖς et l’identification ouverte de ἀλλόφυλοι.
