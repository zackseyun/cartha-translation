  yaml_path: translation/deuterocanon/1_maccabees/003/038.yaml
  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: fr
  text: Lysias choisit Ptolémée, fils de Dorymène, Nicanor et Gorgias, des hommes puissants parmi les amis du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les courtisans du roi ». Dans l’usage des cours royales hellénistiques, « les amis du roi » pouvait être un titre de cour et ne désignait pas seulement des relations personnelles.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: choisit
  rationale: Le verbe signifie choisir ou sélectionner. « Choisit » est direct et naturel, sans ajouter l’idée d’une nomination officielle.
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: Ptolémée, fils de Dorymène
  rationale: L’article suivi du nom personnel au génitif identifie ici Ptolémée par son lien paternel; « fils de Dorymène » l’exprime clairement en français.
- source_word: ἄνδρας δυνατοὺς
  choice: des hommes puissants
  rationale: ἄνδρας désigne explicitement des hommes, tandis que δυνατούς peut évoquer la puissance, l’influence ou la capacité. « Hommes puissants » conserve cette amplitude dans le contexte militaire et politique.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: parmi les amis du roi
  rationale: Le génitif rattache ces hommes au cercle des « amis du roi ». « Parmi » rend naturellement cette appartenance en français, tandis que la note conserve la possibilité d’un titre de cour hellénistique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe grecque tout en étant naturelle; la minuscule à « amis » préserve l’ambiguïté entre le sens courant et le titre de cour, explicitée en note.
