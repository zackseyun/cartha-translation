  text: and that each should abandon his own customs[b][a]. And all the nations accepted the word of the king.
translation:
  language: fr
  text: et que chacun abandonne ses propres coutumes[a]. Toutes les nations acceptèrent la parole du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses propres lois » ou « ses coutumes ancestrales ». Le grec peut désigner les usages traditionnels à caractère légal et religieux, en particulier les observances reçues des ancêtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’ordre du roi » ou « le décret du roi ». Le grec dit littéralement « la parole du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: abandonne
  rationale: Le verbe exprime le fait de délaisser ou de renoncer à une pratique établie. « Abandonne » rend le caractère décisif de cette renonciation et convient au contexte coercitif.
- source_word: ἕκαστον
  choice: chacun
  rationale: Le singulier distributif grec est rendu précisément et naturellement par « chacun ».
- source_word: τὰ νόμιμα αὐτοῦ
  choice: ses propres coutumes
  rationale: Dans ce contexte, νόμιμα désigne les usages traditionnels, notamment légaux et religieux, plutôt que seulement des lois écrites. « Coutumes » conserve cette ampleur, tandis que « propres » rend αὐτοῦ dans sa valeur distinctive.
- source_word: ἐπεδέξαντο
  choice: acceptèrent
  rationale: Le verbe signifie recevoir ou accepter. « Acceptèrent » préserve ce sens sans expliciter davantage qu’il ne s’agit d’une conformité imposée.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: « Nations » rend directement ἔθνη dans ce récit historique. « Païens » introduirait ici une opposition religieuse plus marquée que ne l’exige la syntaxe.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: la parole du roi
  rationale: La formulation maintient la proximité avec λόγος et son ambiguïté entre parole, ordre et décret. Le français reste intelligible dans le contexte d’une directive royale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La première proposition conserve son lien syntaxique avec le contexte précédent grâce à « et que ». La traduction maintient l’ambiguïté de λόγος au lieu de choisir silencieusement entre parole, ordre et décret.
