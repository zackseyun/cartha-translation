  text: And they captured the fortified cities in the land of Egypt, and he took the plunder of the land of Egypt.
translation:
  language: fr
  text: Ils s’emparèrent des villes fortifiées du pays d’Égypte, et il prit le butin du pays d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: s’emparèrent de
  rationale: Dans ce contexte militaire, le verbe indique la prise de contrôle par la force. « S’emparer de » est naturel en français et rend bien la valeur de l’aoriste moyen.
- source_word: τὰς πόλεις τὰς ὀχυράς
  choice: les villes fortifiées
  rationale: « Villes fortifiées » rend directement le nom et son adjectif attributif, qui souligne leurs défenses.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: du pays d’Égypte
  rationale: Après « les villes fortifiées », « du pays d’Égypte » exprime naturellement leur localisation tout en restant proche de la formule géographique grecque.
- source_word: ἔλαβεν
  choice: il prit
  rationale: Le singulier du grec est conservé sans expliciter son référent, que le contexte antérieur permet d’identifier.
- source_word: τὰ σκῦλα
  choice: les dépouilles
  rationale: Le terme désigne les biens pris à l’ennemi dans la guerre. « Dépouilles » appartient au registre historique et biblique tout en demeurant compréhensible en français moderne.
theological_decisions:
- issue: Passage du pluriel κατελάβοντο au singulier ἔλαβεν
  choice: Conserver le passage de « ils » à « il »
  alternative: Harmoniser les deux propositions au pluriel ou au singulier
  rationale: 'Le changement de nombre appartient au texte grec : les forces s’emparent des villes, puis le personnage principal est présenté au singulier comme prenant les dépouilles. L’harmoniser effacerait cette particularité narrative.'
translation_notes:
  register: Français moderne, sobre et digne, adapté au récit militaire. La répétition « du pays d’Égypte » est conservée parce qu’elle correspond à la répétition rhétorique du grec.
