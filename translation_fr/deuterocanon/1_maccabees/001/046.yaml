  text: and to defile the sanctuary and the holy ones;[a]
translation:
  language: fr
  text: et de souiller le sanctuaire et les saints[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes saintes » ou « le peuple saint ». Le grec dit littéralement « les saints »; il s’agit d’un masculin pluriel désignant des personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾶναι
  choice: souiller
  rationale: Le verbe exprime le fait de rendre impur, notamment sur le plan rituel. « Souiller » conserve cette force cultuelle et s’applique naturellement tant au sanctuaire qu’aux personnes.
- source_word: ἁγίασμα
  choice: le sanctuaire
  rationale: Dans le contexte des mesures prises contre le culte juif, le terme désigne très probablement le Temple en tant qu’espace sacré. « Le sanctuaire » est précis, naturel et digne.
- source_word: ἁγίους
  choice: ceux qui sont saints
  rationale: L’adjectif substantivé est à l’accusatif masculin pluriel et renvoie donc normalement à des personnes. Cette formulation préserve le sens littéral sans donner à « les saints » une coloration chrétienne postérieure ni limiter indûment le groupe aux prêtres.
theological_decisions:
- issue: Référent de ἁγίους
  choice: des personnes appartenant à Dieu (« ceux qui sont saints »)
  alternative: « les saints », « le peuple saint » ou, de manière grammaticalement moins probable, « les choses saintes »
  rationale: Le masculin pluriel substantivé désigne le plus naturellement des personnes. La traduction retenue conserve cette indication grammaticale tout en laissant ouverte l’identité précise du groupe.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La coordination infinitive (« et de… ») respecte le fait que ce fragment poursuit la phrase précédente. Le point-virgule est conservé conformément à la structure fournie.
