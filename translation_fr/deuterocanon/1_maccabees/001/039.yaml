  - severity: low
    issue: « son honneur en mépris » pour εἰς ἐξουδένωσιν
    rationale: La formulation elliptique est possible, mais « en objet de mépris » exprime plus clairement en français le renversement de l’honneur en traitement méprisant et maintient le parallélisme avec le membre précédent.
