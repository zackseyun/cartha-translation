  source_fidelity: Le parallélisme et les transformations exprimées par εἰς sont bien rendus. « Objet de honte » atténue et reformule ὀνειδισμός, qui désigne plus précisément l’opprobre ou le déshonneur public. La dernière expression gagne à expliciter que l’honneur devient un objet de mépris, conformément au mouvement parallèle du grec.
  naturalness: Le français est fluide, sobre et adapté à un registre biblique moderne. « En objet d’opprobre » et « en objet de mépris » sont naturels dans ce style et rendent les deux derniers membres plus nettement parallèles.
  terminology: « Sanctuaire », « fêtes », « sabbats », « deuil » et « honneur » sont appropriés. « Opprobre » est le correspondant français le plus précis de ὀνειδισμός dans ce contexte; « mépris » convient à ἐξουδένωσις lorsqu’il est formulé comme le regard dépréciatif porté sur la ville.
