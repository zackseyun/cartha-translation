  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: fr
  text: Son sanctuaire fut dévasté comme un désert ; ses fêtes furent changées en deuil, ses sabbats en objet d’opprobre, son honneur en objet de mépris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: sanctuaire
  rationale: Dans ce contexte, le terme désigne le lieu sacré de Jérusalem. « Sanctuaire » en conserve le sens cultuel dans un français naturel.
- source_word: ἠρημώθη
  choice: fut dévasté
  rationale: Le passif exprime la mise en désolation et la ruine. « Fut dévasté » restitue cette force avec clarté.
- source_word: ὡς ἔρημος
  choice: comme un désert
  rationale: La comparaison introduite par ὡς est conservée. « Désert » évoque ici un lieu vide et désolé sans alourdir la formulation.
- source_word: αἱ ἑορταὶ
  choice: fêtes
  rationale: Il s’agit des célébrations religieuses d’Israël. « Fêtes » est concis, courant et adapté au contexte.
- source_word: ἐστράφησαν εἰς πένθος
  choice: furent changées en deuil
  rationale: Cette formulation conserve l’idée explicite de transformation portée par le passif suivi de εἰς.
- source_word: τὰ σάββατα
  choice: sabbats
  rationale: Le pluriel désigne les observances récurrentes du sabbat ; « sabbats » est la correspondance directe et usuelle.
- source_word: εἰς ὀνειδισμόν
  choice: en objet de honte
  rationale: ὀνειδισμός peut désigner l’opprobre, l’insulte ou la honte publique. « Objet de honte » exprime naturellement le discrédit subi sans préciser indûment son auteur.
- source_word: τιμὴ
  choice: honneur
  rationale: Le mot désigne ici l’honneur et le rang dont jouissait la ville ; « honneur » en est la traduction la plus directe.
- source_word: εἰς ἐξουδένωσιν
  choice: en mépris
  rationale: Le terme évoque le fait d’être tenu pour rien et traité avec dédain. « Mépris » rend ce renversement de manière concise.
theological_decisions:
- issue: Référent des possessifs féminins αὐτῆς
  choice: Employer « son/ses » tout au long du verset, en laissant l’antécédent féminin implicite comme dans le grec.
  alternative: Expliciter « de Jérusalem » ou « de la ville ».
  rationale: Le grec répète le possessif féminin sans renommer Jérusalem. Le français permet de préserver cette personnification et le rythme de la lamentation grâce à « son/ses ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle du grec et la personnification féminine de Jérusalem sont conservées. Le passé simple soutient le registre narratif solennel sans archaïsme marqué.
