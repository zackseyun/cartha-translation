  text: Every bridegroom took up lamentation[a]; she who sat in the bridal chamber became one in mourning.
translation:
  language: fr
  text: Chaque jeune marié entonna une lamentation[a] ; celle qui était assise dans la chambre nuptiale se retrouva en deuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « Chaque jeune marié se lamenta ; celle qui était assise dans la chambre nuptiale fut en deuil. » Le grec emploie une formulation poétique condensée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς νυμφίος
  choice: Chaque jeune marié
  rationale: πᾶς employé distributivement avec le singulier appelle « chaque ». « Jeune marié » exprime naturellement en français moderne l’homme dans le contexte des noces.
- source_word: ἀνέλαβε θρῆνον
  choice: entonna une lamentation
  rationale: La tournure évoque le fait de prendre ou d’élever une lamentation. « Entonna » conserve l’image d’une lamentation formulée ou chantée, avec un registre poétique digne.
- source_word: καθημένη
  choice: celle qui était assise
  rationale: Le participe féminin substantivé ne nomme pas explicitement la femme, probablement la mariée. La formulation maintient cette compression poétique sans ajouter un référent absent du grec.
- source_word: ἐν παστῷ
  choice: dans la chambre nuptiale
  rationale: παστός désigne ici la chambre des noces. « Chambre nuptiale » est clair, précis et adapté au registre.
- source_word: ἐγένετο ἐν πένθει
  choice: se retrouva en deuil
  rationale: ἐγένετο marque un changement d’état. « Se retrouva en deuil » le rend naturellement, contrairement au simple statif « était en deuil ».
