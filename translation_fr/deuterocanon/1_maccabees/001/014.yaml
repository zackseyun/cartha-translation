  text: And they built a gymnasium in Jerusalem according to the customs of the nations[a].
translation:
  language: fr
  text: Ils bâtirent un gymnase à Jérusalem, selon les coutumes des nations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs ». Le grec dit littéralement « des nations » ; dans ce contexte juif, cette expression désigne les peuples non juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: construisirent
  rationale: L’aoriste désigne simplement l’action de bâtir. « Construisirent » convient naturellement à l’établissement d’une institution et de ses installations.
- source_word: γυμνάσιον
  choice: gymnase
  rationale: Le mot grec désigne l’institution hellénistique consacrée à l’éducation et aux exercices physiques, et non une simple salle de sport. « Gymnase » en conserve la spécificité historique.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: Rendu locatif idiomatique en français moderne.
- source_word: κατὰ
  choice: conforme à
  rationale: Avec l’accusatif, κατά exprime ici la conformité à un modèle. Cette tournure est naturelle et précise en français.
- source_word: τὰ νόμιμα
  choice: les coutumes
  rationale: Dans ce contexte, νόμιμα renvoie aux usages et aux pratiques établies plutôt qu’aux seules lois formelles.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: Le sens littéral est « des nations »; dans ce contexte juif, l’expression désigne les peuples non juifs. Ce choix préserve la formulation grecque sans ajouter la connotation plus péjorative de « païens ».
theological_decisions:
- issue: Sens de ἐθνῶν dans un contexte de contraste juif
  choice: des nations
  alternative: des non-Juifs ; des païens
  rationale: « Des nations » conserve l’expression du grec et le contraste entre pratiques juives et non juives, sans renforcer le jugement porté par le texte.
translation_notes:
  register: Français moderne, clair et digne. « Gymnase » est maintenu comme terme historique; la note prévient son interprétation comme simple salle de sport contemporaine en explicitant surtout le sens de « nations ».
