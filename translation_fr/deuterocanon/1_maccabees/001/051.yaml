base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
translation:
  language: fr
  text: Conformément à toutes ces paroles, il adressa un écrit à son royaume[a], nomma des inspecteurs chargés de surveiller tout le peuple et ordonna aux villes de Juda d’offrir des sacrifices, ville par ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il écrivit à l’intention de son royaume ». Le datif grec peut désigner le royaume comme destinataire de l’écrit ou comme le domaine auquel il est destiné.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: Conformément à toutes ces paroles
  rationale: Cette formulation conserve le sens concret de λόγοι, « paroles », ainsi que l’idée de conformité exprimée par κατά, tout en restant naturelle en français.
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: il écrivit à son royaume
  rationale: Le datif désigne ici le royaume destinataire de l’écrit. La traduction reste proche du grec sans ajouter « tout », absent du texte source.
- source_word: ἐποίησεν ἐπισκόπους
  choice: établit des inspecteurs
  rationale: Dans ce contexte d’application administrative d’un ordre royal, ἐπίσκοποι désigne des agents chargés de surveiller. « Inspecteurs » évite l’anachronisme ecclésiastique d’« évêques ».
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: sur tout le peuple
  rationale: ἐπί avec l’accusatif exprime ici l’autorité ou la surveillance exercée sur l’ensemble du peuple.
- source_word: ἐνετείλατο
  choice: ordonna
  rationale: Le verbe exprime un commandement revêtu d’autorité; « ordonna » convient au cadre royal.
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: aux villes de Juda
  rationale: Traduction directe du datif pluriel et du complément géographique.
- source_word: θυσιάζειν
  choice: d’offrir des sacrifices
  rationale: Cette expression française naturelle explicite correctement l’action cultuelle désignée par l’infinitif grec.
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: ville par ville
  rationale: 'La tournure reproduit la force distributive de l’expression grecque: l’ordre devait être appliqué dans chaque ville.'
theological_decisions:
- issue: Risque de lecture ecclésiastique anachronique de ἐπισκόπους
  choice: inspecteurs
  alternative: évêques; surveillants; responsables
  rationale: Le passage décrit des agents royaux chargés de faire appliquer des mesures imposées au peuple, non une fonction ecclésiale ultérieure. « Inspecteurs » rend clairement ce rôle administratif sans importer de doctrine confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la succession des actes royaux. « Juda » est retenu comme désignation géographique traditionnelle; « inspecteurs » clarifie la fonction administrative sans connotation ecclésiastique.
