  text: And they stored up weapons and provisions[a], and after gathering the spoils of Jerusalem they deposited them there, and it became a great snare,
translation:
  language: fr
  text: Ils y entreposèrent des armes et des vivres. Après avoir rassemblé le butin de Jérusalem[a], ils le déposèrent là, et ce lieu devint un grand piège.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le butin pris à Jérusalem ». Le génitif grec peut exprimer l’appartenance ou la provenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέθεντο
  choice: entreposèrent
  rationale: Dans ce contexte militaire, le verbe désigne la mise en réserve d’armes et de vivres dans la forteresse.
- source_word: ὅπλα
  choice: armes
  rationale: Terme français courant et précis pour l’équipement offensif ou militaire en général.
- source_word: τροφήν
  choice: vivres
  rationale: Le mot signifie nourriture ou subsistance ; « vivres » convient naturellement à l’approvisionnement d’une garnison.
- source_word: συναγαγόντες
  choice: Après avoir rassemblé
  rationale: Cette tournure rend clairement l’antériorité du participe par rapport au verbe principal.
- source_word: τὰ σκῦλα
  choice: le butin
  rationale: Le terme désigne les biens pris par la force ; « butin » est naturel, actuel et digne en français.
- source_word: Ἰερουσαλήμ
  choice: de Jérusalem
  rationale: Le génitif grec relie Jérusalem au butin sans préciser formellement s’il en indique la provenance ou l’appartenance.
- source_word: ἀπέθεντο
  choice: ils le déposèrent
  rationale: Le verbe exprime le fait de placer le butin à cet endroit ; le pronom « le » reprend clairement « le butin ».
- source_word: ἐκεῖ
  choice: là
  rationale: Adverbe locatif naturel renvoyant au lieu fortifié mentionné dans le contexte précédent.
- source_word: ἐγένετο εἰς μεγάλην παγίδα
  choice: ce lieu devint un grand piège
  rationale: L’explicitation minimale de « ce lieu » évite que le pronom français soit compris comme renvoyant au butin, tout en conservant la métaphore menaçante.
theological_decisions:
- issue: Portée métaphorique de μεγάλην παγίδα
  choice: un grand piège
  alternative: un grand filet
  rationale: « Piège » conserve l’image d’un danger qui prend au dépourvu sans préciser qui y sera pris ; le contexte suivant peut fournir cette implication.
- issue: Référent implicite du sujet de ἐγένετο
  choice: ce lieu devint
  alternative: cela devint
  rationale: Le grec laisse le sujet sous-entendu. En français, « ce lieu » renvoie naturellement à la position fortifiée du contexte et évite l’interprétation accidentelle selon laquelle le butin lui-même serait devenu le piège.
translation_notes:
  register: Français international moderne, narratif et digne. « Vivres », « butin » et « piège » préservent le cadre militaire et la force imagée sans archaïsme inutile.
