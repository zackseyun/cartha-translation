  text: And after these things he fell upon his bed[a], and knew that he was dying.
translation:
  language: fr
  text: Après cela, il tomba sur son lit[a] et comprit qu’il était en train de mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «tomba sur le lit»; de manière plus idiomatique: «s’alita». Le grec conserve une expression plus physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Rend naturellement la transition temporelle grecque; le singulier collectif français évite le tour plus lourd «après ces choses» sans modifier la succession du récit.
- source_word: ἔπεσεν
  choice: il tomba
  rationale: Conserve l’image physique et concrète du verbe grec plutôt que de l’interpréter simplement comme «il s’alita».
- source_word: ἐπὶ τὴν κοίτην
  choice: sur son lit
  rationale: «Lit» convient ici au contexte de la maladie; le possessif, implicite dans la situation, est idiomatique en français.
- source_word: ἔγνω
  choice: comprit
  rationale: Dans ce contexte, l’aoriste exprime la prise de conscience. «Comprit» est plus naturel que «sut» tout en restant proche de la valeur de γινώσκω.
- source_word: ἀποθνήσκει
  choice: il était en train de mourir
  rationale: Rend explicitement la valeur progressive du présent grec et distingue le processus de mourir de la simple imminence de la mort.
