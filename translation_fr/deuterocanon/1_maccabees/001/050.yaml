  text: And whoever does not act according to the word of the king shall die[a].
translation:
  language: fr
  text: Et quiconque n’agira pas selon la parole du roi mourra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à l’ordre du roi ». Le grec dit littéralement « selon la parole du roi », expression qui, dans ce contexte, désigne son ordre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: quiconque n’agira pas
  rationale: La construction avec ἄν et le subjonctif a une portée générale et indéfinie. Dans ce contexte, ποιέω désigne le fait de se conformer à l’ordre royal; « agir » reste naturel tout en évitant d’expliciter davantage le verbe.
- source_word: κατὰ τὸ ῥῆμα
  choice: selon la parole
  rationale: ῥῆμα signifie littéralement « parole, déclaration ». Le contexte lui donne la force d’un ordre, mais conserver « parole » respecte le lexique grec et laisse cette nuance contextuelle apparaître dans la note.
- source_word: τοῦ βασιλέως
  choice: du roi
  rationale: Ce génitif simple indique que la parole émane du roi. « Du roi » est la traduction française directe et naturelle.
- source_word: ἀποθανεῖται
  choice: mourra
  rationale: Le futur de ἀποθνῄσκω signifie directement « mourra ». Le contexte implique une peine de mort, mais le grec ne nomme ni l’exécuteur ni explicitement l’acte d’exécution; « mourra » préserve cette formulation.
