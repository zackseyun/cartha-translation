  text: And he passed on to the ends of the earth, and took plunder from a multitude of nations; and the earth was quiet before him, and he was exalted, and his heart was lifted up.
translation:
  language: fr
  text: Il parcourut la terre jusqu’à ses extrémités et prit le butin d’une multitude de nations. La terre fut tranquille devant lui ; il fut élevé, et son cœur s’enorgueillit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son cœur s’éleva » ; cette expression peut évoquer l’orgueil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διῆλθεν
  choice: il alla
  rationale: Le verbe exprime ici la progression d’Alexandre à travers les territoires. « Il alla » est direct et naturel, sans préciser indûment son itinéraire.
- source_word: ἕως ἄκρων τῆς γῆς
  choice: jusqu’aux extrémités de la terre
  rationale: Cette formulation conserve l’image expansive, voire hyperbolique, des confins du monde connu.
- source_word: ἔλαβεν σκῦλα
  choice: prit le butin
  rationale: σκῦλα désigne les dépouilles ou le butin pris à la guerre. « Le butin » convient clairement au contexte militaire.
- source_word: πλήθους ἐθνῶν
  choice: d’une multitude de nations
  rationale: La traduction rend explicitement πλήθους et ἐθνῶν, tout en conservant la vaste portée de la formule.
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: la terre resta tranquille devant lui
  rationale: La formulation préserve l’image d’un monde pacifié ou soumis en sa présence, sans décider si ce calme est volontaire ou imposé.
- source_word: ὑψώθη
  choice: il fut élevé
  rationale: Le passif grec évoque une élévation de rang ou de prestige. La traduction conserve cette forme et son lien avec la proposition suivante.
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: son cœur s’enorgueillit
  rationale: En français biblique moderne, « le cœur s’enorgueillir » exprime naturellement l’idiome du cœur qui s’élève, tout en laissant une note signaler sa forme littérale.
theological_decisions:
- issue: Valeur morale de ἐπήρθη ἡ καρδία αὐτοῦ
  choice: son cœur s’enorgueillit
  alternative: son cœur s’éleva
  rationale: L’idiome grec suggère fortement l’orgueil, mais l’exprime littéralement par l’élévation du cœur. Le texte principal donne le sens idiomatique naturel en français, tandis que la note conserve l’image et son degré d’ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. Les phrases ont été légèrement segmentées pour éviter une accumulation de coordinations, sans modifier la progression du verset. « Extrémités de la terre » et « devant lui » conservent les images du grec.
