  yaml_path: translation/deuterocanon/1_maccabees/001/021.yaml
  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
translation:
  language: fr
  text: Il entra dans le sanctuaire[a] avec arrogance et prit l’autel d’or, le chandelier pour la lumière ainsi que tous ses ustensiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lieu saint ».
    reason: Variante lexicale possible pour ἁγίασμα, qui peut désigner plus spécifiquement un lieu consacré.
lexical_decisions:
- source_word: ἁγίασμα
  choice: sanctuaire
  rationale: Le terme désigne un lieu consacré. « Sanctuaire » convient au contexte du Temple sans préciser davantage que le grec la partie exacte de l’édifice.
- source_word: ἐν ὑπερηφανίᾳ
  choice: avec arrogance
  rationale: Cette tournure exprime la manière et conserve la forte condamnation morale portée par le nom ὑπερηφανία.
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: l’autel d’or
  rationale: Formulation française naturelle et précise pour le nom défini accompagné de l’adjectif « d’or ».
- source_word: λυχνίαν τοῦ φωτός
  choice: le chandelier destiné à l’éclairage
  rationale: « Chandelier » est le terme usuel pour ce support de lampes dans le mobilier du Temple; « destiné à l’éclairage » rend la valeur fonctionnelle du génitif τοῦ φωτός sans produire le calque peu naturel « de la lumière ».
- source_word: σκεύη
  choice: ustensiles
  rationale: Dans ce contexte, le mot désigne les objets accessoires associés au chandelier. « Ustensiles » reste concret, compréhensible et suffisamment large.
theological_decisions:
- issue: Faut-il rendre ἁγίασμα par un terme technique désignant une partie précise du Temple ?
  choice: sanctuaire
  alternative: lieu saint
  rationale: Le grec indique un espace sacré sans imposer ici une identification architecturale plus étroite. « Sanctuaire » préserve cette latitude et évite une précision interprétative excessive.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été légèrement allégée en français sans modifier la succession des actes ni les rapports syntaxiques du grec.
