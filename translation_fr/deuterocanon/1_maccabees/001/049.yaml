  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε ἐπιλαθέσθαι
  choice: afin de leur faire oublier
  rationale: Dans le contexte de l’action imposée par le pouvoir royal, cette tournure française exprime naturellement le but visé; «leur» explicite les personnes concernées sans changer le sens.
- source_word: τοῦ νόμου
  choice: la Loi
  rationale: La majuscule indique ici la Loi d’Israël, plutôt qu’une loi quelconque.
- source_word: ἀλλάξαι
  choice: modifier
  rationale: Rend le sens d’altérer ou de changer, sans préciser indûment la nature ni l’étendue des changements.
- source_word: πάντα τὰ δικαιώματα
  choice: toutes les prescriptions
  rationale: δικαιώματα désigne les dispositions ou ordonnances prescrites par la Loi; «prescriptions» est clair, digne et actuel.
theological_decisions:
- issue: Portée de «la Loi» et des δικαιώματα
  choice: Conserver la distinction entre «la Loi» et «toutes les prescriptions».
  alternative: Fondre les deux expressions en une formulation générale comme «abandonner entièrement leur religion».
  rationale: Le grec distingue explicitement l’oubli de la Loi et la modification de ses prescriptions; cette tension doit rester visible.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve la structure finale du grec tout en ajoutant le pronom «leur», requis pour une formulation française naturelle dans ce fragment contextuel.
