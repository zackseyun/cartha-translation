  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
translation:
  language: fr
  text: ainsi que la table où l’on présentait les pains[a], les récipients pour les libations, les coupes, les brûle-parfums en or, le rideau, les couronnes et la décoration en or sur la façade du sanctuaire ; il arracha tout cela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la table de la présentation ». Il s’agit de la table sur laquelle les pains étaient disposés devant Dieu ; on l’appelle aussi « table des pains de la Présence ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut signifier « peler » ou « arracher une couche » ; il suggère ici que les revêtements ou ornements ont été retirés.
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: la table où l’on présentait les pains
  rationale: Dans le contexte du sanctuaire, πρόθεσις désigne la présentation rituelle des pains devant Dieu. Cette formulation française explicite naturellement la fonction de la table sans imposer une appellation traditionnelle absente de l’expression grecque.
- source_word: σπονδεῖα
  choice: les récipients pour les libations
  rationale: Le terme désigne des objets servant aux libations. « Récipients » reste accessible tout en conservant la fonction rituelle.
- source_word: φιάλας
  choice: les coupes
  rationale: φιάλη désigne une coupe ou un récipient large, notamment dans un cadre cultuel. « Coupes » est ici naturel et distinct des récipients à libations déjà mentionnés.
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: les brûle-parfums en or
  rationale: Le terme désigne des ustensiles servant à brûler l’encens. « Brûle-parfums » est compréhensible en français moderne, et « en or » exprime clairement la matière.
- source_word: καταπέτασμα
  choice: le rideau
  rationale: Le mot désigne une tenture du sanctuaire. « Rideau » est actuel et accessible, tout en laissant ouverte la nature précise de cette tenture.
- source_word: στεφάνους
  choice: les couronnes
  rationale: Le sens premier est « couronnes » ou « guirlandes ». La traduction formelle « couronnes » préserve l’image sans préciser indûment leur forme décorative.
- source_word: κόσμον τὸν χρυσοῦν
  choice: la décoration en or
  rationale: κόσμος signifie ici parure ou ornement, et non « monde ». « Décoration en or » est clair et idiomatique.
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: sur la façade du sanctuaire
  rationale: Dans cette liste d’éléments pillés, l’expression situe vraisemblablement l’ornementation sur la face avant de l’édifice. « Façade » rend ce sens architectural avec naturel.
- source_word: ἐλέπισεν πάντα
  choice: il dépouilla le tout
  rationale: Le verbe évoque l’action de peler ou d’arracher une couche, probablement un revêtement ou des ornements d’or. « Dépouilla » conserve l’idée d’un retrait total sans alourdir la phrase.
