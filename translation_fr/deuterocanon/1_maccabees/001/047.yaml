translation:
  language: fr
  text: de bâtir des autels et des sanctuaires, d’ériger des idoles, et de sacrifier des porcs et des animaux impurs[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des animaux communs » ou « profanes » ; l’adjectif grec signifie littéralement « communs », mais il désigne probablement ici des animaux rituellement impurs.
    reason: Alternative lexicale préservant l’ambiguïté de κοινά.
lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: de bâtir
  rationale: L’infinitif aoriste exprime l’action imposée. « Bâtir » convient naturellement aux éléments cultuels énumérés.
- source_word: βωμοὺς
  choice: des autels
  rationale: βωμός désigne normalement un autel destiné notamment aux sacrifices.
- source_word: τεμένη
  choice: des sanctuaires
  rationale: τέμενος désigne un lieu consacré ou une enceinte sacrée. « Sanctuaires » est clair et digne, sans la lourdeur technique de « enceintes sacrées ».
- source_word: εἴδωλα
  choice: des idoles
  rationale: Dans ce contexte juif polémique concernant le culte païen, « idoles » rend mieux la valeur du terme que le mot neutre « images ».
- source_word: θύειν
  choice: de sacrifier
  rationale: L’infinitif poursuit la série des actions imposées; « sacrifier » est direct et idiomatique.
- source_word: ὕεια
  choice: des porcs
  rationale: Le terme désigne des porcs. « Porcs » est le terme moderne, courant et adapté au contexte sacrificiel.
- source_word: κτῆνη κοινά
  choice: des animaux impurs
  rationale: κτῆνη est un terme général pour les bêtes ou animaux, tandis que κοινά prend ici vraisemblablement le sens rituel d’« impurs » dans le contexte juif.
theological_decisions:
- issue: Sens de κοινά dans un contexte de pureté rituelle juive
  choice: animaux impurs
  alternative: animaux communs / profanes
  rationale: Le sens premier de κοινός est « commun », mais dans l’usage juif hellénistique il peut désigner ce qui est rituellement profane ou impur. Le contexte d’atteintes imposées à la Torah favorise « impurs », tout en conservant l’alternative littérale en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe infinitive est conservée afin que le fragment s’intègre à la phrase commencée dans les versets précédents. « Sanctuaires » privilégie la lisibilité, tandis que « porcs » évite l’archaïsme de « pourceaux ».
