  text: And they drove Israel into hiding[a], into every refuge they had.
translation:
  language: fr
  text: Et ils mirent Israël dans des lieux cachés, dans chacun de ses refuges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans tous ses lieux de refuge ». Le grec emploie littéralement « dans des lieux cachés » et « dans chaque refuge leur appartenant »; le possessif renvoie à Israël envisagé collectivement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: ils poussèrent
  rationale: L’aoriste moyen de τίθημι signifie littéralement « ils mirent/placèrent ». Avec le complément exprimant la dissimulation, « ils poussèrent … à se cacher » rend naturellement en français le résultat imposé, sans aller jusqu’au verbe plus fort « chasser ».
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Le nom désigne collectivement le peuple. Conserver « Israël » respecte la formulation et la force collective du grec.
- source_word: ἐν κρυφίοις
  choice: à se cacher
  rationale: Le pluriel substantivé désigne des lieux cachés ou secrets. La tournure verbale exprime idiomatiquement en français le fait de vivre caché.
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: dans tous ses refuges
  rationale: φυγαδευτήριον désigne un lieu où des fugitifs peuvent se mettre à l’abri. « Refuges » est concis, clair et évite de répéter l’idée de cachette.
- source_word: αὐτῶν
  choice: ses
  rationale: Le pronom pluriel se rapporte naturellement aux membres d’Israël, envisagé comme un collectif. Le possessif singulier français s’accorde avec le nom collectif « Israël ».
