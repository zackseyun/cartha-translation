translation:
  language: fr
  text: Et ils mirent à mort les femmes qui avaient circoncis leurs enfants[a], conformément au décret,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui avaient fait circoncire leurs enfants » ; le grec emploie un participe actif (« ayant circoncis »), qui peut désigner soit l’accomplissement direct de l’acte, soit le fait de l’avoir fait accomplir.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμηκυίας
  choice: qui avaient circoncis
  rationale: Le participe parfait actif féminin pluriel présente les femmes comme ayant accompli, ou fait accomplir, la circoncision avant leur mise à mort. Le plus-que-parfait français exprime cette antériorité tout en conservant la voix active du grec.
- source_word: τὰ τέκνα αὐτῶν
  choice: leurs enfants
  rationale: τέκνα signifie normalement « enfants ». Bien que la circoncision concerne ici les garçons, traduire par « fils » préciserait davantage que le texte grec.
- source_word: ἐθανάτωσαν
  choice: ils mirent à mort
  rationale: Cette expression rend le sens causatif du verbe et convient au contexte d'une persécution menée en vertu d'un ordre officiel, sans ajouter explicitement la notion judiciaire d'une exécution.
- source_word: κατὰ τὸ πρόσταγμα
  choice: conformément au décret
  rationale: πρόσταγμα désigne un ordre, un édit ou un décret. « Décret » restitue bien le caractère officiel de la mesure, et « conformément à » rend naturellement κατά dans ce contexte.
theological_decisions:
- issue: Rôle des femmes dans la circoncision des enfants
  choice: Le texte principal les présente comme celles qui avaient circoncis leurs enfants.
  alternative: Les femmes avaient fait circoncire leurs enfants.
  rationale: La forme grecque est active et favorise la formulation retenue, mais elle peut aussi englober le fait d'avoir organisé ou fait pratiquer la circoncision. Une note préserve cette ambiguïté réelle.
- issue: Portée de τέκνα dans le contexte de la circoncision
  choice: Traduire par « enfants » sans restreindre explicitement le terme.
  alternative: Traduire par « fils » ou « garçons ».
  rationale: Le contexte implique des enfants mâles, mais le nom grec employé a le sens plus large d'« enfants ». La traduction évite donc une précision interprétative absente de la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. « Mirent à mort » maintient le registre narratif formel ; « conformément au décret » exprime clairement le cadre officiel. La virgule finale est conservée parce que le verset fourni se poursuit syntaxiquement.
