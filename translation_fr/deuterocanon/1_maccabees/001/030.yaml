base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: fr
  text: Il leur adressa des paroles de paix, mais avec tromperie[a]. Ils lui firent confiance. Alors il fondit soudain sur la ville, lui porta un coup terrible et fit périr un grand nombre d’Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ruse » ou « de façon trompeuse ». Le grec souligne que ces paroles conciliantes servaient à les tromper.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν αὐτοῖς λόγους εἰρηνικούς
  choice: Il leur adressa des paroles de paix
  rationale: Cette formulation française naturelle conserve l’image concrète des « paroles » et le caractère conciliant de εἰρηνικούς, sans laisser entendre que la paix était sincère.
- source_word: ἐν δόλῳ
  choice: mais avec tromperie
  rationale: Le nom δόλος est conservé sous une forme nominale. « Mais » rend explicite en français le contraste déjà présent entre les paroles de paix et l’intention trompeuse.
- source_word: ἐπίστευσαν αὐτῷ
  choice: Ils lui firent confiance
  rationale: Dans ce récit, πιστεύω désigne la confiance accordée à ses assurances, et non la foi au sens théologique.
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  choice: il fondit soudain sur la ville
  rationale: « Fondre sur » restitue de manière vivante et idiomatique l’attaque exprimée par ἐπιπίπτω, tandis que « soudain » traduit directement ἐξαίφνα.
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: lui porta un coup terrible
  rationale: La tournure conserve l’idiome du coup porté. « Terrible » exprime naturellement l’ampleur de μεγάλην sans réduire πληγή au seul sens de massacre.
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  choice: fit périr un grand nombre d’Israélites
  rationale: Avec des personnes pour objet, ἀπόλλυμι indique ici une destruction mortelle. « Un grand nombre d’Israélites » rend naturellement λαὸν πολὺν ἐξ Ἰσραήλ en français.
theological_decisions:
- issue: Sens de ἐπίστευσαν dans un contexte narratif non théologique
  choice: Ils lui firent confiance
  alternative: Ils le crurent
  rationale: Le contexte porte sur l’acceptation d’assurances mensongères. Cette traduction évite d’introduire une connotation doctrinale tout en maintenant l’ironie narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour la clarté. « Fondit sur » garde la vigueur de l’image grecque sans archaïsme marqué.
