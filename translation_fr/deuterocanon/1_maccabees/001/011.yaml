base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: fr
  text: 'En ces jours-là, des hommes sans loi surgirent du milieu d’Israël et en persuadèrent beaucoup[a]. Ils disaient : « Allons conclure une alliance avec les nations qui nous entourent, car depuis que nous avons été séparés d’elles[b], bien des malheurs nous ont frappés[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils sans loi »; l’expression désigne des hommes caractérisés par leur mépris de la loi.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « depuis que nous nous sommes séparés d’elles ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « bien des maux nous ont trouvés »; il s’agit ici de malheurs ou de calamités.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: surgirent du milieu d’Israël
  rationale: L’expression décrit l’apparition de ce groupe au sein d’Israël. « Du milieu d’Israël » préserve son origine interne, tandis que « surgirent » rend naturellement le mouvement figuré.
- source_word: υἱοὶ παράνομος
  choice: des hommes sans loi
  rationale: Malgré l’accord irrégulier du texte grec, l’expression désigne idiomatiquement des personnes caractérisées par le mépris de la loi. La note conserve la formulation familiale plus littérale.
- source_word: ἀνέπεισαν πολλοὺς
  choice: en persuadèrent beaucoup
  rationale: Le verbe signifie persuader ou amener quelqu’un à agir, sans qu’il soit nécessaire d’ajouter lexicalement l’idée de tromper.
- source_word: Πορευθῶμεν
  choice: Allons
  rationale: Cette forme rend de manière naturelle et directe le subjonctif d’exhortation grec.
- source_word: διαθώμεθα διαθήκην
  choice: conclure une alliance
  rationale: En français, « conclure une alliance » exprime naturellement l’engagement formel envisagé ici et garde sa portée politique et religieuse.
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: les nations qui nous entourent
  rationale: Cette formulation rend clairement les peuples voisins sans imposer le terme néotestamentaire « païens ».
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: depuis que nous avons été séparés d’elles
  rationale: Le passif français suit la forme grecque et évite de décider si la séparation fut volontaire ou imposée.
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: bien des malheurs nous ont frappés
  rationale: Cette tournure française naturelle transmet l’image de calamités survenues aux locuteurs; une note donne le tour grec littéral.
theological_decisions:
- issue: Portée de διαθήκη dans un contexte politique et religieux
  choice: conclure une alliance
  alternative: conclure une alliance solennelle / établir une alliance
  rationale: « Alliance » conserve la portée biblique et l’engagement formel de διαθήκη, sans réduire l’acte à un simple accord pratique. Le verbe « conclure » est idiomatique en français.
- issue: Agent de la séparation d’avec les nations
  choice: nous avons été séparés d’elles
  alternative: nous nous sommes séparés d’elles
  rationale: La morphologie grecque permet un sens passif; la traduction le conserve afin de ne pas attribuer silencieusement l’initiative aux Israélites.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la désapprobation portée par « sans loi », le poids biblique d’« alliance » et l’ambiguïté du passif relatif à la séparation.
