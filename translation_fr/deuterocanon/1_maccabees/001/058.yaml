  yaml_path: translation/deuterocanon/1_maccabees/001/058.yaml
  text: By their power they kept doing this to Israel[b][a], to those who were found in the cities month after month.
translation:
  language: fr
  text: Usant de leur puissance[a], ils agissaient ainsi envers Israël, envers ceux qui se trouvaient dans les villes, mois après mois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par la force » ; l’expression grecque peut souligner la contrainte comme moyen d’action.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en chaque mois et mois », tournure qui exprime une répétition mensuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: Usant de leur puissance
  rationale: La tournure exprime le moyen par lequel ils agissaient. Cette formulation française conserve l’idée de puissance coercitive sans préciser davantage la nature de la violence.
- source_word: ἐποίουν οὕτω
  choice: ils traitaient ainsi
  rationale: L’imparfait grec indique une action répétée ou prolongée. « Ils traitaient ainsi » rend naturellement l’action exercée envers des personnes, tandis que l’ensemble de la phrase et « mois après mois » en font ressortir la continuité.
- source_word: τῷ Ἰσραήλ
  choice: Israël
  rationale: Le datif désigne Israël comme destinataire de ces actes. La construction française « traiter ainsi Israël » évite d’ajouter explicitement « contre », même si le contexte est hostile.
- source_word: τοῖς εὑρισκομένοις
  choice: ceux qu’ils trouvaient
  rationale: Le participe passif désigne les personnes qui étaient repérées ou découvertes dans les villes. La tournure active est plus naturelle en français et conserve l’idée qu’elles étaient trouvées par les persécuteurs.
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: mois après mois
  rationale: La répétition distributive grecque souligne la récurrence mensuelle; « mois après mois » la rend de façon idiomatique.
- source_word: ἐν ταῖς πόλεσιν
  choice: dans les villes
  rationale: Traduction directe de la désignation géographique, sans ajouter une idée de totalité absente de l’expression elle-même.
