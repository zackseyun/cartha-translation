  text: And many from the people gathered to them, everyone who was abandoning the law; and they did evil in the land,
translation:
  language: fr
  text: Beaucoup de membres du peuple se joignirent à eux, tous abandonnant la Loi ; ils firent le mal dans le pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: se rassemblèrent auprès d’eux
  rationale: Rend le mouvement de rassemblement et l’adhésion au groupe sans ajouter une nuance absente du grec.
- source_word: πᾶς ὁ ἐγκαταλείπων
  choice: tous ceux qui abandonnaient
  rationale: L’imparfait français reflète la valeur durative du participe présent grec et évite de présenter l’abandon comme un simple acte ponctuel achevé.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: La majuscule indique naturellement, dans ce contexte, la Loi religieuse d’Israël plutôt qu’une loi quelconque.
- source_word: ἐποίησαν κακὰ
  choice: ils firent le mal
  rationale: Formulation française claire et digne qui conserve la portée générale du pluriel grec κακά.
- source_word: ἐν τῇ γῇ
  choice: dans le pays
  rationale: Dans ce récit territorial, « le pays » est plus naturel que « la terre » tout en préservant la référence géographique.
theological_decisions:
- issue: Aspect de l’abandon de la Loi
  choice: qui abandonnaient la Loi
  alternative: qui avaient abandonné la Loi
  rationale: Le participe présent ἐγκαταλείπων décrit ceux qui étaient engagés dans cet abandon; la traduction ne transforme donc pas cette caractérisation en antériorité accomplie.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination simple du grec est conservée; aucune précision confessionnelle ou interprétative n’est ajoutée.
