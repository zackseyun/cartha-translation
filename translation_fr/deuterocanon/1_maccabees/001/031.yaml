  text: And he took the plunder of the city and burned it with fire, and he tore down its houses and its walls all around.
translation:
  language: fr
  text: Il prit le butin de la ville, y mit le feu et démolit ses maisons ainsi que les murailles tout autour de la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: prit
  rationale: Le passé simple convient au récit et rend directement λαμβάνω sans préciser davantage le mode de prise.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: le butin de la ville
  rationale: σκῦλα désigne les biens pris lors d’un pillage ou d’une guerre. « Butin » est naturel en français et conserve la dimension militaire; le génitif est rendu sans exclure le sens de biens pris dans la ville.
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: y mit le feu
  rationale: Cette expression française naturelle rend l’incendie volontaire de la ville. Le feu explicitement mentionné par πυρί demeure exprimé, sans la lourdeur de « la brûla par le feu ».
- source_word: καθεῖλεν
  choice: démolit
  rationale: Le verbe exprime l’action d’abattre ou de détruire des constructions; « démolit » est clair, énergique et actuel.
- source_word: τοὺς οἴκους αὐτῆς
  choice: ses maisons
  rationale: οἶκοι désigne ici les bâtiments d’habitation de la ville; « maisons » en est l’équivalent direct.
- source_word: τὰ τείχη αὐτῆς
  choice: ses murailles
  rationale: τείχη désigne les murs défensifs d’une ville. « Murailles » évite l’ambiguïté de « murs » et reste courant dans un récit historique.
- source_word: κύκλῳ
  choice: tout autour
  rationale: L’expression marque l’étendue circulaire de la destruction des murailles et correspond naturellement à κύκλῳ.
