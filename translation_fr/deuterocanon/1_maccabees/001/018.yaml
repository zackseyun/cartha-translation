  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: fr
  text: Il fit la guerre à Ptolémée, roi d’Égypte. Ptolémée fut mis en déroute devant lui[a] et s’enfuit, et beaucoup de blessés tombèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut repoussé devant lui ». Le verbe grec peut désigner plus généralement le fait d’être repoussé ou défait ; « mis en déroute » souligne ici le contexte militaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « beaucoup de blessés tombèrent ». L’expression peut désigner de nombreuses victimes du combat sans préciser si toutes moururent de leurs blessures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  choice: fit la guerre
  rationale: L’expression grecque désigne le fait d’engager et de mener un conflit. « Fit la guerre » est naturel, direct et garde la portée militaire sans imposer l’idée plus étroite d’une seule bataille.
- source_word: πρὸς Πτολεμαῖον
  choice: à Ptolémée
  rationale: Avec πόλεμον, πρὸς marque l’adversaire. En français, « faire la guerre à » rend naturellement cette relation hostile.
- source_word: ἐνετράπη
  choice: fut mis en déroute
  rationale: Dans ce contexte militaire, le passif exprime le fait d’être repoussé ou défait. « Mis en déroute » fait ressortir la fuite qui suit, sans exclure le sens plus général de recul.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: L’expression signifie littéralement « loin de sa face » et, dans le récit de bataille, décrit le recul devant l’adversaire. « Devant lui » conserve l’image avec une formulation française digne et concise.
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: Le verbe indique directement la fuite hors du combat. « S’enfuit » est précis et idiomatique.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Le grec dit littéralement qu’ils « tombèrent », image militaire qu’il convient de conserver sans préciser qu’ils moururent.
- source_word: τραυματίαι πολλοί
  choice: beaucoup tombèrent, blessés
  rationale: τραυματίαι désigne des personnes blessées. La construction retenue garde à la fois le verbe « tomber » et l’état de blessé, tout en laissant ouverte la portée exacte de l’expression comme désignation de victimes du combat.
