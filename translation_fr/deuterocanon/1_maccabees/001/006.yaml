  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: fr
  text: Il appela ses serviteurs de haut rang[a], qui avaient été élevés avec lui dès sa jeunesse, et il partagea son royaume entre eux de son vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ses παῖδας », terme qui peut signifier « enfants », « jeunes gens » ou « serviteurs ». Ici, les précisions « de haut rang » et « élevés avec lui dès sa jeunesse » désignent des hommes de confiance de la cour, et non ses fils biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Le verbe signifie directement « appeler » ou « faire venir ». « Appela » convient naturellement au récit sans accentuer indûment le caractère officiel de l’acte.
- source_word: τοὺς παῖδας αὐτοῦ
  choice: ses serviteurs
  rationale: παῖς peut désigner un enfant, un jeune homme ou un serviteur. Ici, les précisions qui suivent les présentent comme des membres distingués de l’entourage royal élevés avec Alexandre, et non comme ses fils biologiques. « Serviteurs » conserve le rapport de service exprimé par le terme sans les réduire à de simples domestiques.
- source_word: τοὺς ἐνδόξους
  choice: de haut rang
  rationale: L’adjectif désigne ici des hommes considérés, éminents ou prestigieux. « De haut rang » exprime clairement leur position à la cour et s’associe naturellement à « serviteurs ».
- source_word: τοὺς συνεκτρόφους αὐτοῦ
  choice: qui avaient été élevés avec lui
  rationale: Le terme désigne ceux qui ont grandi ou ont été élevés avec quelqu’un. La proposition relative restitue précisément cette relation, faute d’équivalent français simple et naturel.
- source_word: ἀπὸ νεότητος
  choice: depuis leur jeunesse
  rationale: La formule situe cette éducation commune à partir de la jeunesse. Le possessif explicite en français qu’il s’agit de la jeunesse partagée d’Alexandre et de ses compagnons.
- source_word: διεῖλεν
  choice: partagea
  rationale: Le verbe signifie diviser ou répartir. « Partagea » est idiomatique lorsqu’un royaume est distribué entre plusieurs bénéficiaires.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: son royaume
  rationale: βασιλεία peut désigner la royauté, le règne ou le royaume. Puisque celui-ci est réparti entre plusieurs hommes, le sens politico-territorial « royaume » est le plus probable.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: de son vivant
  rationale: Cette tournure française concise rend le génitif absolu et souligne que le partage eut lieu avant sa mort.
