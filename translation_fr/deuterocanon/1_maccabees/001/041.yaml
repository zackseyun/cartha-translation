  source_fidelity: 'Le sens fondamental est bien rendu : le roi adresse un écrit à l’ensemble de son domaine et exige l’unification de tous en un seul peuple. Toutefois, « pour que » présente surtout une finalité, alors que l’infinitif grec exprime le contenu normatif de l’écrit. « Devaient devenir » rend plus exactement cette teneur impérative sans transformer ἔγραψεν en « décréta ».'
