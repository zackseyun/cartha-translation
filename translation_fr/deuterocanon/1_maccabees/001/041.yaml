  yaml_path: translation/deuterocanon/1_maccabees/001/041.yaml
  text: And the king wrote to all his kingdom that all should become one people[b][a],
translation:
  language: fr
  text: Le roi écrivit à l’ensemble de son royaume[a] que tous devaient devenir[b] un seul peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans tout son royaume » ou « à tout son royaume ». La formulation grecque vise toute l’étendue du domaine royal comme destinataire ou sphère de l’écrit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que tous devaient être un seul peuple ». Le grec emploie littéralement le verbe « être » ; « devenir » fait ressortir ici l’unification imposée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: écrivit
  rationale: Rend directement l’aoriste de γράφω. Le contexte royal donne à cet écrit valeur d’ordre, sans qu’il soit nécessaire d’ajouter « décret ».
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: à tout son royaume
  rationale: La formulation exprime l’ensemble du territoire soumis au roi comme destinataire de l’écrit. Le grec transmis présente une irrégularité de cas, mais le sens général demeure clair.
- source_word: εἶναι πάντας
  choice: pour que tous deviennent
  rationale: L’infinitive énonce le contenu ou le but de l’ordre. « Deviennent » fait ressortir le passage imposé à une identité collective commune, tandis que « soient » reste possible plus littéralement.
- source_word: εἰς λαὸν ἕνα
  choice: un seul peuple
  rationale: λαός désigne ici un peuple comme corps humain et politique. « Un seul peuple » exprime naturellement en français le projet d’unification, sans introduire la notion moderne d’État-nation.
theological_decisions:
- issue: Portée politique et ethnique de λαός
  choice: un seul peuple
  alternative: une seule nation
  rationale: Le passage décrit une politique impériale d’assimilation. « Peuple » conserve le sens social et politique du grec sans lui imposer une conception moderne de la nation ni une portée théologique particulière.
- issue: Valeur de εἶναι avec εἰς
  choice: deviennent
  alternative: soient
  rationale: La construction peut se rendre formellement par « soient », mais « deviennent » communique mieux l’entrée dans une unité nouvelle qu’impose l’ordre royal, sans exclure l’ambiguïté signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle. Les notes conservent les principales possibilités de traduction sans surinterpréter la portée administrative ou théologique du verset.
