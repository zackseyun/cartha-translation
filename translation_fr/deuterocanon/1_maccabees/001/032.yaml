  text: And they took the women and the children captive[a], and they took the livestock as plunder.
translation:
  language: fr
  text: Ils emmenèrent en captivité les femmes et les enfants, et prirent possession du bétail comme butin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils prirent possession du bétail » ou « ils héritèrent du bétail ». Le verbe grec exprime normalement l’acquisition d’une possession, mais il désigne ici, dans un contexte de conquête, la prise des animaux comme butin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: emmenèrent en captivité
  rationale: Le verbe désigne le fait de faire des prisonniers de guerre ou de les emmener captifs. Cette tournure conserve clairement la contrainte propre au contexte militaire.
- source_word: τὰς γυναῖκας
  choice: les femmes
  rationale: γυνή peut signifier « femme » ou « épouse », mais, dans cette énumération de victimes avec les enfants, le sens générique « femmes » convient le mieux.
- source_word: τὰ τέκνα
  choice: les enfants
  rationale: τέκνα désigne les enfants sans restriction de sexe ; « enfants » en rend naturellement toute l’étendue.
- source_word: τὰ κτήνη
  choice: le bétail
  rationale: κτήνη désigne ici les animaux domestiques considérés comme biens. « Bétail » est courant et n’impose pas la restriction aux seuls bovins.
- source_word: ἐκληρονόμησαν
  choice: prirent possession de
  rationale: Le verbe signifie ordinairement « hériter » ou « recevoir comme possession ». Dans ce contexte de conquête, il indique l’appropriation du bétail ; la mention « comme butin » explicite cette valeur contextuelle sans suggérer un héritage légitime.
