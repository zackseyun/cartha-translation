  text: And he entered Egypt with a heavy force, with chariots and elephants and horsemen and a great fleet.
translation:
  language: fr
  text: Il entra en Égypte avec une puissante armée, avec des chars, des éléphants, des cavaliers et une grande flotte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «un armement considérable» ou «une grande force expéditionnaire». Le terme grec peut désigner plus largement un équipement militaire ou une expédition armée; «flotte» convient bien au contexte de cette campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Rend directement l’aoriste de εἰσέρχομαι sans expliciter davantage l’idée d’invasion, déjà suggérée par le contexte militaire.
- source_word: ὄχλῳ βαρεῖ
  choice: avec une puissante armée
  rationale: Dans ce contexte militaire, ὄχλος désigne une masse de troupes; βαρεῖ évoque leur poids et leur puissance. Cette formulation est naturelle en français et plus claire qu’un littéral «une foule lourde».
- source_word: ἅρμασιν
  choice: des chars
  rationale: Équivalent direct et suffisant dans un contexte militaire; il n’est pas nécessaire d’ajouter «de guerre».
- source_word: ἐλέφανσιν
  choice: des éléphants
  rationale: Traduction directe; le contexte permet de comprendre qu’il s’agit d’éléphants employés à la guerre.
- source_word: ἱππεῦσιν
  choice: des cavaliers
  rationale: Rend naturellement les combattants montés désignés par ἱππεῖς.
- source_word: στόλῳ μεγάλῳ
  choice: une grande flotte
  rationale: στόλος peut désigner un équipement ou une expédition militaire, mais «flotte» convient bien à la campagne d’Égypte et complète la liste des forces terrestres; l’ambiguïté est signalée en note.
