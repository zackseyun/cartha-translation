  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
translation:
  language: fr
  text: Elle devint un guet-apens contre le sanctuaire et, sans cesse, un adversaire malveillant[a] contre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un calomniateur malveillant ». Le grec διάβολος peut désigner un calomniateur, un accusateur ou un adversaire ; ici, le contexte d’hostilité favorise « adversaire ».
    reason: Alternative lexicale préservant l’étendue sémantique du grec.
lexical_decisions:
- source_word: ἐγένετο
  choice: elle devint
  rationale: L’aoriste de γίνομαι marque ici l’entrée dans un nouvel état ou une nouvelle fonction. Le pronom féminin reprend naturellement en français la forteresse ou citadelle mentionnée dans le contexte précédent.
- source_word: εἰς ἔνεδρον
  choice: un guet-apens
  rationale: ἔνεδρον désigne une embuscade, un piège ou un lieu où l’on se tient à l’affût. « Guet-apens » exprime naturellement en français l’hostilité militaire dirigée contre le sanctuaire.
- source_word: τῷ ἁγιάσματι
  choice: contre le sanctuaire
  rationale: ἁγίασμα désigne un lieu consacré. Dans le contexte du temple de Jérusalem, « le sanctuaire » est précis sans ajouter au grec; « contre » explicite la valeur hostile du datif.
- source_word: εἰς διάβολον πονηρόν
  choice: un adversaire malfaisant
  rationale: διάβολος peut désigner un calomniateur, un accusateur ou un adversaire. Le parallélisme militaire favorise ici « adversaire », tandis que « malfaisant » rend πονηρόν sans faire du mot un titre désignant le Diable.
- source_word: τῷ Ἰσραήλ
  choice: pour Israël
  rationale: Avec le prédicat hostile « adversaire », le datif indique la personne ou le peuple qui subit cette hostilité. « Pour Israël » est idiomatique en français et évite la répétition de « contre ».
- source_word: διὰ παντός
  choice: sans cesse
  rationale: La locution exprime la continuité. « Sans cesse » en restitue clairement la force durative dans un français actuel.
theological_decisions:
- issue: Faut-il comprendre διάβολον comme un titre désignant le Diable ou comme un nom commun?
  choice: 'Nom commun : « adversaire »'
  alternative: « calomniateur » ou « diable »
  rationale: Le sujet est la forteresse ou la garnison ennemie, décrite par son rôle hostile envers Israël. Le contexte ne présente pas un être surnaturel; traduire par « le Diable » importerait donc un sens ultérieur et personnifié.
translation_notes:
  register: Français international moderne, clair et digne. « Guet-apens » conserve l’image militaire tout en étant plus naturel que la formulation littérale « devint une embuscade ». La ponctuation met en relief la continuité exprimée par διὰ παντός.
