translation:
  language: fr
  text: Et ses fils prirent le pouvoir, chacun dans son propre lieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans son propre lieu » ; selon le contexte, on peut aussi comprendre : « dans sa propre région » ou « dans son propre territoire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: prirent le pouvoir
  rationale: Dans ce contexte de succession après la mort d’Alexandre, le verbe indique que ses fils s’imposèrent et établirent leur autorité. « Prirent le pouvoir » est naturel en français et évite le calque moins idiomatique « devinrent forts ».
- source_word: οἱ παῖδες αὐτοῦ
  choice: ses fils
  rationale: Bien que παῖδες puisse désigner des enfants ou des serviteurs, le contexte dynastique appelle ici « ses fils ».
- source_word: ἕκαστος
  choice: chacun
  rationale: Rend directement et naturellement le sens distributif du grec.
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: dans son propre territoire
  rationale: Le sens littéral est « dans son propre lieu », mais, dans ce contexte, τόπος désigne vraisemblablement la zone où chacun exerçait son autorité. « Territoire » exprime clairement cette valeur contextuelle.
