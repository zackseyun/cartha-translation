  text: Il mena de nombreuses guerres, s’empara de forteresses et massacra des rois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο
  choice: mena
  rationale: Dans l’expression συνεστήσατο πολέμους, le verbe désigne le fait d’entreprendre et de conduire des guerres. « Mena » est naturel en français et conserve le sens militaire.
- source_word: πολέμους πολλούς
  choice: de nombreuses guerres
  rationale: Le pluriel de πόλεμος désigne largement des conflits armés. « Guerres » est plus exact que « batailles », qui serait trop restreint, et moins interprétatif que « campagnes ».
- source_word: ἐκράτησεν
  choice: s’empara de
  rationale: κρατέω exprime ici la prise de contrôle ou de possession par la force. « S’empara de » convient au contexte militaire.
- source_word: ὀχυρωμάτων
  choice: forteresses
  rationale: ὀχύρωμα désigne un ouvrage ou un lieu fortifié. « Forteresses » est précis, courant et idiomatique en français.
- source_word: ἔσφαξεν
  choice: massacra
  rationale: σφάζω est un verbe fort évoquant une mise à mort violente. « Massacra » en préserve la dureté, contrairement au plus neutre « tua ».
- source_word: βασιλεῖς
  choice: rois
  rationale: βασιλεῖς désigne précisément des rois; « dirigeants » atténuerait inutilement le titre politique.
