lexical_decisions:
- source_word: ἠγαύθη
  choice: plut
  rationale: L’aoriste passif exprime ici l’accueil favorable réservé à ce qui vient d’être proposé. « Leur plut » restitue naturellement cette appréciation en français.
- source_word: ὁ λόγος
  choice: cette proposition
  rationale: Dans le contexte, λόγος désigne la proposition formulée précédemment plutôt qu’une simple parole. Le démonstratif « cette » explicite sobrement le renvoi au contexte immédiat.
- source_word: ἐν ὀφθαλμοῖς αὐτῶν
  choice: leur
  rationale: L’expression grecque signifie littéralement « à leurs yeux » et marque leur jugement favorable. La tournure idiomatique française « leur plut » en transmet directement le sens.
