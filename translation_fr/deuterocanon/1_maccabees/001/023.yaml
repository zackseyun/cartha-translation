  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
translation:
  language: fr
  text: Il prit l’argent, l’or et les objets précieux. Il prit aussi les trésors cachés[a] qu’il trouva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les réserves secrètes de trésors » : le grec peut désigner soit des richesses cachées, soit des lieux cachés où des richesses sont entreposées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: prit
  rationale: Rend directement l’aoriste de λαμβάνω sans ajouter l’idée plus précise de saisir ou d’emporter.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: l’argent, l’or
  rationale: Les articles désignent ici des richesses déterminées; les articles français conservent cette référence concrète.
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: les objets précieux
  rationale: Dans ce contexte de biens du temple, σκεύη désigne des objets ou ustensiles, tandis que ἐπιθυμητά signifie littéralement désirables ou recherchés. « Objets précieux » exprime naturellement en français leur caractère convoité sans les définir plus précisément comme vases.
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: les trésors cachés
  rationale: Cette formulation simple conserve le sens premier de richesses dissimulées, tout en signalant en note l’autre lecture possible de θησαυροί.
- source_word: οὓς εὗρεν
  choice: qu’il trouva
  rationale: Reproduit sobrement la proposition relative grecque et son temps narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition grecque de « il prit » est conservée sous la forme « Il prit aussi » afin de maintenir le rythme narratif sans lourdeur. « Objets précieux » est plus naturel que « objets désirables » et évite de limiter σκεύη à des récipients.
