base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: fr
  text: Partout où l’on trouvait chez quelqu’un un livre de l’alliance[a], ou si quelqu’un adhérait à la Loi[b], le décret du roi le mettait à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement «un livre de l’alliance»; il peut s’agir d’un document de l’alliance ou d’un livre de la Loi.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire se ralliait à la Loi juive ou lui demeurait fidèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Partout où
  rationale: Rend la valeur distributive de l’adverbe relatif dans le contexte d’une répression menée en divers lieux.
- source_word: εὑρίσκετο
  choice: l’on trouvait
  rationale: L’imparfait passif grec décrit une pratique répétée; la tournure française est naturelle et conserve cette valeur habituelle.
- source_word: παρὰ τινι
  choice: chez quelqu’un
  rationale: Exprime naturellement en français la présence ou la possession auprès d’une personne, sans préciser indûment le statut juridique de cette possession.
- source_word: βιβλίον διαθήκης
  choice: un livre de l’alliance
  rationale: Traduction proche du grec qui conserve la résonance biblique de διαθήκη et l’ambiguïté sur la nature exacte du document.
- source_word: συνευδόκει
  choice: adhérait
  rationale: Le verbe indique l’approbation et l’alignement avec la Loi; «adhérait» exprime ici plus qu’un simple accord intellectuel sans ajouter explicitement l’idée de fidélité durable.
- source_word: τῷ νόμῳ
  choice: à la Loi
  rationale: Le contexte désigne la loi juive, la Torah. La majuscule signale ce référent reconnu en français sans développer en «Loi de Moïse».
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: le décret du roi
  rationale: Désigne une décision royale officielle ayant force pénale; «décret» convient au registre public et judiciaire.
- source_word: ἐθάνατου αὐτόν
  choice: le mettait à mort
  rationale: Préserve l’imparfait et le caractère officiel de la mise à mort, avec un registre digne et moins étroit que «l’exécutait».
theological_decisions:
- issue: Référent de τῷ νόμῳ
  choice: la Loi juive, ou Torah, est visée, sans explicitation dans le corps du texte
  alternative: la loi au sens générique
  rationale: Le contexte de la persécution menée par Antiochos vise les pratiques ancestrales juives. La traduction «la Loi» identifie sobrement ce référent sans ajouter «de Moïse», absent du grec.
- issue: Rapport logique introduit par εἴ
  choice: «ou si», marquant deux motifs possibles de condamnation
  alternative: «et si», qui pourrait présenter les conditions comme cumulatives
  rationale: La syntaxe distingue la découverte d’un livre de l’alliance et l’adhésion à la Loi; le français «ou si» préserve cette disjonction.
translation_notes:
  register: Français moderne international, clair et digne. La syntaxe conserve le caractère répétitif de la répression par les imparfaits «trouvait» et «mettait». «Chez quelqu’un» reste idiomatique, tandis que les notes préservent les ambiguïtés lexicales du grec.
