  yaml_path: translation/deuterocanon/1_maccabees/001/024.yaml
  text: And after taking everything[a], he went away to his own land. And they committed murder[b], and spoke great arrogance.
translation:
  language: fr
  text: Après avoir tout pris, il partit pour son pays. Ils commirent un massacre[a] et tinrent des propos d’une grande arrogance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un meurtre » ou « une effusion de sang ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « parlèrent une grande arrogance »; autre traduction possible : « tinrent des propos très orgueilleux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν πάντα
  choice: après avoir tout pris
  rationale: Le participe aoriste exprime une action accomplie avant le verbe principal; cette tournure naturelle conserve aussi la portée globale de πάντα.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: il repartit dans son pays
  rationale: ἀπέρχομαι marque le départ, tandis que γῆ désigne ici le pays qui est le sien. « Repartit » rend naturellement le retour vers ce pays dans le contexte narratif.
- source_word: ἐποίησαν φονοκτονίαν
  choice: ils commirent un massacre
  rationale: La collocation française « commettre un massacre » restitue la violence et la condamnation morale du substantif rare φονοκτονία, sans réduire nécessairement l’acte à un homicide individuel.
- source_word: ἐλάλησαν ὑπερηφανίαν μεγάλην
  choice: tinrent des propos d’une grande arrogance
  rationale: Cette formulation française naturelle préserve la construction nominale grecque et présente l’arrogance comme le caractère de leurs paroles.
theological_decisions:
- issue: Portée morale et collective de φονοκτονίαν
  choice: un massacre
  alternative: un meurtre; une effusion de sang
  rationale: Le terme condamne fortement l’acte de tuer. Dans ce contexte collectif, « massacre » rend mieux sa possible ampleur que le singulier « meurtre », tandis qu’« effusion de sang » reste une traduction plus large.
- issue: Expression de ὑπερηφανίαν μεγάλην
  choice: des propos d’une grande arrogance
  alternative: des paroles très orgueilleuses; une grande arrogance
  rationale: Le choix maintient le lien explicite avec l’acte de parler et la forte valeur morale de ὑπερηφανία, sans préciser davantage le contenu des propos.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination du grec est légèrement lissée, mais le changement du singulier (« il ») au pluriel (« ils »), présent dans le texte source, est conservé afin de ne pas résoudre une ambiguïté éventuelle sur les acteurs.
