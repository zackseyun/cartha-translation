  yaml_path: translation/deuterocanon/1_maccabees/001/029.yaml
  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
translation:
  language: fr
  text: Deux ans plus tard, le roi envoya dans les villes de Juda un responsable de la perception du tribut. Celui-ci arriva à Jérusalem accompagné d’une foule imposante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accompagné d’une troupe nombreuse » ou « d’une force considérable ». Le grec dit littéralement « avec une foule lourde », expression qui évoque un groupe d’accompagnement important.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: Deux ans plus tard
  rationale: Cette tournure grecque, littéralement « après deux années de jours », indique naturellement qu’un intervalle de deux ans s’est écoulé.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent français courant et précis de l’aoriste du verbe « envoyer ».
- source_word: ἄρχοντα φορολογίας
  choice: un haut responsable de la levée du tribut
  rationale: ἄρχων désigne ici un responsable investi d’autorité, tandis que φορολογία renvoie à la perception d’un tribut. Cette formulation évite de réduire sa fonction à celle d’un simple percepteur local.
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: dans les villes de Juda
  rationale: Après un verbe d’envoi et avec εἰς, « dans » exprime le mouvement vers l’intérieur des villes; « Juda » est la forme géographique traditionnelle en français biblique.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: accompagné d’une troupe nombreuse
  rationale: ὄχλος désigne une foule ou un groupe nombreux, et βαρύς en souligne ici l’importance. Dans ce contexte politico-militaire, « troupe » est naturel sans préciser indûment qu’il s’agissait exclusivement de soldats.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation demeure proche du grec tout en évitant le calque peu naturel « une foule lourde ». Le démonstratif « Celui-ci » clarifie que le sujet de l’arrivée à Jérusalem est le responsable envoyé par le roi.
