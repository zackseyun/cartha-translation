base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: fr
  text: 'D’eux sortit une racine pécheresse[a] : Antiochos Épiphane, fils du roi Antiochos, qui avait été otage à Rome. Il devint roi en l’an cent quarante-sept du royaume des Grecs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « une racine mauvaise » ou « un rejeton pécheur ». Le grec emploie littéralement l’image d’une « racine ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire selon l’ère séleucide, un système de datation alors en usage.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: De leur lignée surgit
  rationale: Le verbe exprime l’apparition ou l’émergence à partir du groupe mentionné auparavant. « De leur lignée » explicite naturellement en français le lien dynastique impliqué par « d’eux », tandis que « surgit » introduit avec force l’image végétale qui suit.
- source_word: ῥίζα ἁμαρτωλός
  choice: une racine pécheresse
  rationale: « Racine » conserve littéralement la métaphore végétale du grec. « Pécheresse » maintient la qualification morale et religieuse de ἁμαρτωλός sans l’intensifier arbitrairement en « mauvaise » ou « perverse ».
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Antiochos Épiphane
  rationale: Le nom et l’épithète sont donnés sous leur forme française traditionnelle et immédiatement reconnaissable.
- source_word: ὅμηρα
  choice: otage
  rationale: Malgré la forme grecque au pluriel neutre, le mot fonctionne ici comme attribut d’un référent singulier. « Otage » rend précisément le statut politique d’une personne retenue comme garantie.
- source_word: ἐβασίλευσεν
  choice: devint roi
  rationale: Dans cette formule chronologique, l’aoriste indique l’accession au trône survenue cette année-là, plutôt que la durée générale du règne.
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: en l’an cent quarante-sept
  rationale: Cette formulation française naturelle reproduit la date ordinale exprimée par le grec.
- source_word: βασιλείας Ἑλλήνων
  choice: du règne des Grecs
  rationale: « Règne » conserve le sens politique et chronologique de βασιλεία. La note précise qu’il s’agit du système de datation de l’ère séleucide.
theological_decisions:
- issue: Caractérisation morale métaphorique de ῥίζα ἁμαρτωλός
  choice: Conserver « une racine pécheresse »
  alternative: Aplanir la métaphore en « un homme pécheur » ou l’intensifier en « un rejeton pervers »
  rationale: La métaphore présente Antiochos comme issu d’une origine dynastique tout en annonçant les effets funestes de son règne. La conserver respecte l’évaluation morale explicite du narrateur sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tandis que la métaphore inhabituelle de la « racine » est volontairement conservée. La note chronologique est placée après « règne des Grecs », qu’elle explique directement.
