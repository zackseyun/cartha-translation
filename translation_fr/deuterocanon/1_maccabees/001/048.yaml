lexical_decisions:
- source_word: ἀφεῖναι
  choice: laisser
  rationale: Dans ce contexte, l’infinitif aoriste de ἀφίημι signifie laisser quelqu’un demeurer dans un état donné.
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: leurs fils
  rationale: υἱούς désigne précisément les fils, ce qui convient à la mention de la circoncision.
- source_word: ἀπεριτμήτους
  choice: incirconcis
  rationale: Équivalent français direct qui conserve la portée rituelle et liée à l’alliance.
- source_word: βδελύξαι
  choice: rendre […] abominables
  rationale: Le verbe exprime l’idée de rendre abominable ou odieux; cette traduction préserve cette force, sans le réduire au seul sens de souiller.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: leurs âmes
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Âmes » maintient ici le poids moral et religieux du passage, tout en laissant une note signaler l’autre nuance possible.
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: par tout ce qui est impur
  rationale: Cette formulation naturelle rend la valeur instrumentale ou associative de ἐν et conserve la portée générale de παντί.
- source_word: βεβηλώσαι
  choice: profaner
  rationale: Le verbe signifie profaner ou désacraliser. « Profaner » garde la distinction entre l’abomination liée à l’impureté et l’atteinte à ce qui est saint.
theological_decisions:
- issue: Sens de ψυχή dans un contexte rituel et lié à l’alliance
  choice: leurs âmes
  alternative: leur personne / leur être
  rationale: « Âmes » conserve la gravité morale et religieuse du grec sans imposer une interprétation purement physique; la note reconnaît que ψυχή peut aussi désigner la personne entière.
- issue: Objet sous-entendu de βεβηλώσαι
  choice: de les profaner, où « les » reprend « leurs âmes »
  alternative: comprendre plus largement qu’il s’agit de profaner les personnes elles-mêmes
  rationale: La syntaxe grecque rattache naturellement l’objet sous-entendu à τὰς ψυχὰς αὐτῶν, mais le sens peut englober les personnes dans leur totalité.
translation_notes:
  register: Français moderne, digne et lisible. La structure infinitive est conservée parce que le verset poursuit la liste commencée dans le contexte précédent. « Incirconcis », « abominables » et « profaner » maintiennent le registre rituel et religieux du grec sans ajouter de précision confessionnelle.
