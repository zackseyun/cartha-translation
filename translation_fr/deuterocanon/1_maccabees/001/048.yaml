  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
translation:
  language: fr
  text: et de laisser leurs fils incirconcis, de rendre leurs âmes abominables[a] par toute chose impure et de les profaner[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « souiller leur personne ». Le verbe grec peut exprimer aussi bien l’abomination que la souillure, et « âme » peut ici désigner la personne entière.'
    reason: lexical_alternative
  - marker: b
    text: Dans le grec, « les » reprend « leurs âmes », même si le sens peut s’étendre aux personnes elles-mêmes.
