  text: And the earth shook for those who dwelt on it[a], and the whole house of Jacob clothed itself with shame.
translation:
  language: fr
  text: Et la terre trembla, ébranlant ses habitants[a], et toute la maison de Jacob se revêtit de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays trembla ». Le grec γῆ peut désigner soit la terre, soit un pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: trembla
  rationale: L’aoriste passif de σείω peut décrire une terre secouée ou qui tremble. « Trembla » est naturel en français, garde la force de l’image et ne tranche pas entre un phénomène littéral et une évocation poétique.
- source_word: ἡ γῆ
  choice: la terre
  rationale: γῆ peut désigner la terre au sens large ou un pays. Le ton élevé de lamentation et la mention de ses habitants favorisent ici « la terre », tandis qu’une note conserve l’autre possibilité.
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: sous ses habitants
  rationale: ἐπί avec l’accusatif et le contexte du tremblement permettent l’image de la terre qui tremble sous ceux qui l’habitent. Cette formulation est idiomatique en français et reste proche de la relation spatiale du grec.
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: toute la maison de Jacob
  rationale: Cette expression collective traditionnelle désigne le peuple issu de Jacob. La traduction littérale conserve sa résonance biblique sans l’expliciter en « tout Israël ».
- source_word: ἐνεδύσατο
  choice: se revêtit de
  rationale: Le moyen de ἐνδύω signifie se vêtir ou se revêtir. Cette tournure française conserve la métaphore vestimentaire explicite du grec dans un registre digne.
- source_word: αἰσχύνην
  choice: honte
  rationale: αἰσχύνη désigne la honte, l’opprobre ou le déshonneur. « Honte » est le choix le plus direct et le plus largement intelligible.
theological_decisions:
- issue: 'Portée de γῆ : « terre » ou « pays »'
  choice: la terre
  alternative: le pays
  rationale: Le grec demeure lexicalement ambigu. « La terre » convient au langage ample de la lamentation, mais la note signale honnêtement la lecture territoriale possible sans imposer une portée géographique précise.
- issue: Maintien de la métaphore vestimentaire dans ἐνεδύσατο αἰσχύνην
  choice: se revêtit de honte
  alternative: fut couverte de honte
  rationale: La formulation choisie reproduit l’action réfléchie ou moyenne et préserve l’image concrète du grec, sans réduire la honte à une simple émotion intérieure.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu. « Maison de Jacob » et « se revêtit de honte » maintiennent la couleur biblique et poétique tout en restant compréhensibles.
