  text: According to her glory[a], her dishonor was multiplied[b], and her exaltation was turned into mourning.
translation:
  language: fr
  text: À la mesure de sa gloire, son déshonneur se multiplia, et son élévation se changea en deuil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: À la mesure de sa gloire
  rationale: Avec l’accusatif, κατά exprime ici une correspondance ou une proportion. « À la mesure de » rend naturellement ce rapport tout en conservant « gloire » pour δόξα.
- source_word: ἐπληθύνθη ἀτιμασμὸς αὐτῆς
  choice: son déshonneur se multiplia
  rationale: La tournure conserve l’image quantitative du passif aoriste ἐπληθύνθη et l’opposition abstraite entre δόξα et ἀτιμασμός.
- source_word: τὸ ὕψος αὐτῆς
  choice: son élévation
  rationale: Dans ce contexte de renversement de la condition de Jérusalem, ὕψος désigne vraisemblablement sa haute position ou sa grandeur. « Élévation » préserve la métaphore verticale sans imposer une interprétation trop précise.
- source_word: ἐστράφη εἰς πένθος
  choice: se changea en deuil
  rationale: Cette formulation française rend le passage à un nouvel état exprimé par le passif de στρέφω suivi de εἰς, ainsi que le contraste de la seconde proposition.
