  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
translation:
  language: fr
  text: Le quinzième jour du mois de Kislev, dans la quarante-cinquième année[a], ils construisirent l’abomination de la désolation[b] sur l’autel. Dans les villes de Juda, tout autour, ils construisirent aussi des autels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec fourni porte littéralement « la quarante-cinquième année ». La datation habituelle de ce passage est cependant la cent quarante-cinquième année de l’ère séleucide.
    reason: textual_and_cultural_note
  - marker: b
    text: 'On peut aussi comprendre : « une abomination dévastatrice » ou « l’abomination qui cause la désolation ». L’expression grecque, très concise, peut fonctionner comme une désignation établie ou comme une description.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ Χασελεὺ
  choice: Le quinzième jour du mois de Kislev
  rationale: La formule au datif indique la date. L’ajout de « mois de » rend naturellement en français la fonction du nom translittéré Χασελεύ, tandis que « Kislev » est sa forme moderne usuelle.
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: dans la quarante-cinquième année
  rationale: Le grec fourni énonce littéralement la cinquième et quarantième année, soit la quarante-cinquième. La différence avec la datation historiquement attendue est signalée en note plutôt que corrigée silencieusement.
- source_word: ᾠκοδόμησαν
  choice: ils construisirent
  rationale: Le verbe signifie « construire, bâtir ». Le même choix est conservé aux deux occurrences afin de reproduire la répétition grecque, avec l’ajout français de « aussi » dans la seconde proposition pour assurer une liaison naturelle.
- source_word: βδέλυγμα ἐρημώσεως
  choice: l’abomination de la désolation
  rationale: Cette formulation traditionnelle conserve l’expression compacte et sa résonance intertextuelle sans décider si le génitif décrit l’effet produit ou constitue un titre établi.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sur l’autel
  rationale: ἐπί avec l’accusatif exprime ici le placement sur l’autel. « Sur » est précis, naturel et suffisamment digne en français moderne.
- source_word: ἐν πόλεσιν Ἰούδα κύκλῳ
  choice: Dans les villes de Juda, tout autour
  rationale: Cette formulation conserve la portée distributive de κύκλῳ tout en évitant de faire de Juda une ville entourée par d’autres villes.
- source_word: βωμούς
  choice: des autels
  rationale: βωμός désigne des autels cultuels. Traduire également θυσιαστήριον et βωμός par « autel » reste naturel en français et évite les interprétations plus étroites comme « hauts lieux » ou « sanctuaires ».
theological_decisions:
- issue: Sens et résonance de βδέλυγμα ἐρημώσεως
  choice: l’abomination de la désolation
  alternative: une abomination dévastatrice ; l’abomination qui cause la désolation
  rationale: Le texte grec permet de comprendre l’expression comme une désignation consacrée ou comme une description de l’effet dévastateur. Le texte principal maintient sa forme traditionnelle et sa tension théologique; la note expose les lectures descriptives possibles.
- issue: Datation de l’événement
  choice: la quarante-cinquième année, conformément au grec fourni
  alternative: la cent quarante-cinquième année, selon la datation séleucide attendue et la consultation anglaise
  rationale: La traduction privilégie le texte grec transmis dans la demande et ne lui ajoute pas silencieusement « cent ». Une note signale toutefois l’écart important avec la datation habituelle de ce passage.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. La syntaxe reste accessible, et les notes préservent les deux ambiguïtés majeures : la forme de la date dans le grec fourni et la portée de l’expression cultuelle.'
