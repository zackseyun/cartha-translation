    text: Le grec fourni porte littéralement « la quarante-cinquième année ». La datation habituellement attestée pour ce passage est cependant la cent quarante-cinquième année de l’ère séleucide.
    reason: textual_and_cultural_note
  - marker: b
    text: 'On peut aussi comprendre : « une abomination dévastatrice » ou « l’abomination qui cause la désolation ». L’expression grecque, très concise, peut fonctionner comme une désignation établie ou comme une description.'
    reason: lexical_alternative
  revision_rationale: 'La révision améliore uniquement la formulation française de la localisation : « dans les villes de Juda alentour » rend naturellement ἐν πόλεσιν Ἰούδα κύκλῳ. Le nombre 45 est maintenu dans le texte principal, conformément au grec explicitement fourni, et la note conserve l’information nécessaire concernant l’écart avec la datation habituellement attestée. Aucun ajout interprétatif n’est apporté à l’expression « l’abomination de la désolation ».'
