base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: fr
  text: Les habitants de Jérusalem s’enfuirent à cause d’eux, et elle devint une demeure d’étrangers. Elle devint étrangère à sa descendance[a], et ses enfants l’abandonnèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étrangère à ce qu’elle produit ». Le terme grec peut désigner soit la descendance, soit ce qui est produit ; le parallèle immédiat avec « ses enfants » favorise ici « descendance ».
    reason: Alternative lexicale authentique de γενήματα.
lexical_decisions:
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Exprime directement une fuite sous la pression, dans un registre narratif naturel et digne.
- source_word: οἱ κάτοικοι Ἰερουσαλήμ
  choice: les habitants de Jérusalem
  rationale: Désigne sans ambiguïté les personnes qui résident dans la ville.
- source_word: διʼ αὐτούς
  choice: à cause d’eux
  rationale: Avec l’accusatif, διά indique ici la cause ou le motif de la fuite; le pronom conserve le renvoi au contexte précédent.
- source_word: κατοικία ἀλλοτρίων
  choice: la demeure d’étrangers
  rationale: Rend l’image concrète d’une ville désormais habitée par des personnes qui lui sont étrangères, tout en gardant le thème lexical de l’altérité.
- source_word: ἐγένετο ἀλλοτρία
  choice: elle devint étrangère
  rationale: Conserve la personnification féminine de Jérusalem ainsi que le lien lexical avec les « étrangers » de la proposition précédente.
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: à sa descendance
  rationale: γενήματα peut désigner ce qui est engendré ou produit. Le parallélisme immédiat avec « ses enfants » favorise ici le sens de descendance.
- source_word: τὰ τέκνα αὐτῆς
  choice: ses enfants
  rationale: Préserve l’image maternelle de Jérusalem sans restreindre indûment le terme aux fils.
- source_word: ἐγκατέλειπον
  choice: l’abandonnèrent
  rationale: Communique une désertion plus forte qu’un simple départ, sans recourir à un terme archaïque.
theological_decisions:
- issue: Personnification féminine de Jérusalem
  choice: Maintenir « elle », « sa » et « ses » dans la seconde moitié du verset.
  alternative: Répéter « Jérusalem » ou reformuler les propositions de manière impersonnelle.
  rationale: Le grec personnifie la ville au féminin et développe l’image de Jérusalem comme mère de ses enfants; conserver cette figure maintient la force de la lamentation.
- issue: Sens de γενήματα
  choice: Comprendre le terme comme « descendance » dans le texte principal.
  alternative: Le comprendre comme « produits » ou « récoltes ».
  rationale: Les deux sens sont lexicalement possibles, mais la proposition parallèle « ses enfants l’abandonnèrent » favorise le sens humain sans éliminer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « elle devint » reproduit le parallélisme du grec, et « étrangers / étrangère » en conserve l’écho lexical.
