  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: fr
  text: Ils y installèrent une nation pécheresse, des hommes qui violaient la Loi, et ils s’y fortifièrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκαν ἐκεῖ
  choice: Ils y installèrent
  rationale: Rend naturellement l’idée de placer ou d’établir des personnes en ce lieu.
- source_word: ἔθνος ἁμαρτωλόν
  choice: une nation pécheresse
  rationale: Conserve le terme collectif ἔθνος et la qualification morale explicite du grec.
- source_word: ἄνδρας παρανόμους
  choice: des hommes qui violaient la Loi
  rationale: παράνομος désigne ici ceux qui agissent contre la Loi; la majuscule indique la Loi juive dans ce contexte.
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  choice: ils s’y fortifièrent
  rationale: Le verbe exprime l’idée de se rendre forts ou de consolider leur position dans la citadelle évoquée par le contexte.
theological_decisions:
- issue: Sens de παράνομος
  choice: qui violaient la Loi
  alternative: sans loi / hors-la-loi
  rationale: La formulation retenue préserve le lien probable avec la transgression de la Loi sans introduire une qualification juridique moderne.
- issue: Sujet de ἐνίσχυσαν
  choice: ils
  alternative: la nation pécheresse et les hommes qui violaient la Loi
  rationale: Le grec laisse le sujet implicite; le pronom français conserve cette continuité sans préciser davantage l’identité du groupe.
translation_notes:
  register: Français moderne, sobre et narratif. La structure en apposition du grec est conservée, tandis que « qui violaient la Loi » évite l’ambiguïté moderne de « hommes sans loi ».
