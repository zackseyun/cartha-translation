  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: fr
  text: Beaucoup d’Israélites approuvèrent son culte[a] ; ils sacrifièrent aux idoles et profanèrent le sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son culte ». Selon le contexte, il peut s’agir du culte établi ou prescrit par lui, ou éventuellement du culte qui lui était rendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: Beaucoup, parmi les Israélites
  rationale: ἀπό marque ici l’appartenance à un groupe. Cette formulation est naturelle en français et indique qu’il s’agissait d’une partie d’Israël, non de son ensemble.
- source_word: ηὐδόκησαν
  choice: approuvèrent
  rationale: Le verbe peut exprimer le plaisir, l’assentiment ou l’approbation. Dans ce contexte, « approuvèrent » souligne l’adhésion volontaire sans imposer l’idée d’un plaisir affectif.
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: le culte qu’il imposait
  rationale: λατρεία désigne ici une pratique cultuelle ou un système de culte. Le pronom αὐτοῦ renvoie vraisemblablement au roi et peut désigner le culte promu par lui, plutôt qu’un culte dont il serait personnellement l’objet. L’explicitation « qu’il imposait » rend ce rapport intelligible dans le contexte, tout en étant signalée par une note.
- source_word: ἔθυσαν
  choice: sacrifièrent
  rationale: Rend directement l’action cultuelle exprimée par le verbe grec.
- source_word: τοῖς εἰδώλοις
  choice: aux idoles
  rationale: Dans ce contexte religieux polémique, εἴδωλον désigne naturellement des idoles plutôt que de simples images.
- source_word: ἐβεβήλωσαν
  choice: profanèrent
  rationale: Le verbe exprime la violation du caractère sacré de quelque chose ; « profaner » convient précisément au sabbat.
- source_word: τὸ σάββατον
  choice: le sabbat
  rationale: Formulation française consacrée pour le jour saint juif ; la minuscule suit l’usage typographique courant en français.
theological_decisions:
- issue: Sens de τῇ λατρίᾳ αὐτοῦ dans le cadre de la religion royale païenne
  choice: le culte qu’il imposait
  alternative: son culte ; le culte établi par lui ; son service religieux
  rationale: 'Le génitif pronominal peut associer le culte au roi de plusieurs manières : culte promu ou prescrit par lui, voire culte qui lui est rendu. Le contexte général favorise le système religieux qu’il impose, mais la note conserve l’ambiguïté réelle de l’expression grecque.'
translation_notes:
  register: Français moderne, international et digne. La coordination grecque répétée est rendue par un point-virgule afin d’alléger la phrase sans perdre la succession des actes. Le terme « culte » conserve la dimension religieuse, tandis que la note protège l’ambiguïté du pronom.
