  yaml_path: translation/deuterocanon/1_maccabees/001/020.yaml
  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: fr
  text: Après avoir frappé l’Égypte, Antiochos revint dans la cent quarante-troisième année. Il marcha alors contre Israël et Jérusalem avec une armée imposante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec une foule pesante » ; on peut aussi comprendre : « avec une troupe nombreuse » ou « avec une force considérable ».'
    reason: L’expression grecque ἐν ὄχλῳ βαρεῖ associe un terme signifiant « foule, multitude » à l’adjectif « lourd, pesant » ; dans ce contexte, elle désigne une importante force militaire.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: revint
  rationale: Dans ce récit de campagne militaire, l’aoriste indique qu’Antiochos revient après son action en Égypte.
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: Après avoir frappé l’Égypte
  rationale: La construction marque l’antériorité. « Frappé » conserve la force militaire de πατάσσω sans préciser au-delà du grec qu’Antiochos aurait entièrement vaincu l’Égypte.
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: la cent quarante-troisième année
  rationale: Cette formulation claire conserve la manière séleucide de dater l’événement.
- source_word: ἀνέβη ἐπὶ Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: Il marcha alors contre Israël et Jérusalem
  rationale: Dans le contexte militaire, ἐπί avec l’accusatif exprime ici une orientation hostile. « Marcha contre » rend naturellement le déplacement offensif impliqué par ἀνέβη.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: avec une armée imposante
  rationale: ὄχλος désigne ici une masse d’hommes en contexte militaire, tandis que βαρύς en souligne le poids, l’importance ou la puissance. Cette expression est naturelle en français sans gommer complètement l’image grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le nom « Antiochos » suit la forme française usuelle. La ponctuation en deux phrases allège la longue coordination grecque sans modifier la succession des événements.
