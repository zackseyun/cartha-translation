  text: Et Alexandre régna douze ans et mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: régna
  rationale: L’aoriste de βασιλεύω désigne l’exercice de la royauté. « Régna » est l’équivalent français naturel et concis dans un récit historique.
- source_word: ἔτη δώδεκα
  choice: douze ans
  rationale: L’accusatif exprime ici la durée. En français, la construction directe « régna douze ans » est idiomatique et proche du grec.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: L’aoriste de ἀποθνῄσκω est rendu directement, sans l’atténuation qu’introduirait un euphémisme tel que « s’éteignit ».
- source_word: καὶ ... καὶ
  choice: … puis …
  rationale: Le premier καί assure la continuité avec le contexte précédent et n’a pas besoin d’être reproduit par un « et » initial isolé en français. Le second relie deux événements successifs; « puis » rend naturellement cette progression narrative sans ajouter de nuance causale.
- source_word: Ἀλέξανδρος
  choice: Alexandre
  rationale: Forme française traditionnelle et courante du nom grec Ἀλέξανδρος.
