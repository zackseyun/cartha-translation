base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: fr
  text: Et il arriva qu’après qu’Alexandre le Macédonien, fils de Philippe, qui était sorti du pays de Kittim[a], eut défait[b] Darius, roi des Perses et des Mèdes, il régna à sa place, après avoir d’abord régné sur la Grèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim est un nom de lieu traditionnel de la Bible. Selon le contexte, il peut désigner plus précisément Chypre ou, plus largement, des territoires occidentaux.
    reason: cultural_note
  - marker: b
    text: 'Ou : « frappa ». Le verbe grec peut aussi évoquer l’idée d’« abattre »; dans ce contexte, il désigne la défaite de Darius.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: il arriva que
  rationale: Conserve la formule narrative grecque tout en employant une tournure française actuelle et digne.
- source_word: μετὰ τὸ πατάξαι
  choice: après que… eut défait
  rationale: La construction avec μετά exprime l’antériorité. Le plus-que-parfait du subjonctif, exigé ici par la langue soignée après « après que » dans ce cadre narratif, marque clairement cette succession.
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: Alexandre le Macédonien, fils de Philippe
  rationale: Conserve les deux précisions d’identité dans un ordre naturel en français.
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: était venu du pays de Kittim
  rationale: Rend le mouvement d’origine exprimé par ἐξέρχομαι sans la lourdeur de « était sorti de », et maintient l’antériorité dans le récit.
- source_word: Χεττιείμ
  choice: Kittim
  rationale: Translittère le toponyme biblique sans imposer une identification géographique incertaine comme Chypre ou la Macédoine.
- source_word: ἐπάταξεν
  choice: défit
  rationale: Dans ce contexte militaire, « défaire » communique naturellement la victoire sur Darius; une note conserve le sens concret « frapper » du verbe grec.
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: il régna à sa place
  rationale: Exprime directement la succession royale indiquée par ἀντ’ αὐτοῦ.
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: après avoir d’abord régné sur la Grèce
  rationale: Rend πρότερον comme une antériorité de règne et traduit Ἑλλάδα par le nom français courant « Grèce ».
theological_decisions:
- issue: Identification historique de Χεττιείμ
  choice: Kittim
  alternative: Chypre, la Macédoine ou les terres occidentales
  rationale: Le grec emploie le toponyme biblique traditionnel; le conserver évite de trancher une identification historique que le texte ne précise pas.
- issue: Force du verbe πατάσσω dans le récit militaire
  choice: défaire
  alternative: frapper, abattre
  rationale: Le contexte indique une défaite militaire, mais la note signale le sens plus concret du grec afin de ne pas effacer sa vigueur.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule d’ouverture garde la cadence historiographique du grec; les identifications géographiques et la vigueur du vocabulaire militaire sont préservées sans surinterprétation.
