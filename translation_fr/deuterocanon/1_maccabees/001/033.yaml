  text: And they fortified the city of David with a great and strong wall[a], with strong towers, and it became a citadel for them.
translation:
  language: fr
  text: Ils bâtirent la cité de David avec une grande et solide muraille et de solides tours, et elle devint pour eux une citadelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle devint pour eux une Acra ». Le grec ἄκρα peut désigner communément une « citadelle » ou être compris comme le nom historique de la forteresse séleucide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: ils fortifièrent… en l’entourant
  rationale: Le verbe signifie littéralement « bâtir », mais la construction décrite porte sur la muraille et les tours défensives de la ville. Cette formulation française naturelle exprime l’action sans laisser entendre qu’ils auraient bâti la ville elle-même de toutes pièces.
- source_word: τὴν πόλιν Δαυεὶδ
  choice: la cité de David
  rationale: Rendu traditionnel et clair du nom topographique; « cité » convient au contexte historique et urbain.
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: d’une muraille haute et solide
  rationale: Dans ce contexte, μέγας évoque l’importance des dimensions de la muraille; « haute » est idiomatique en français. ὀχυρός indique sa robustesse défensive, rendue par « solide ».
- source_word: πύργοις ὀχυροῖς
  choice: avec de solides tours
  rationale: La répétition de « solide » reflète celle de ὀχυρός dans le grec tout en restant naturelle en français.
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: elle devint pour eux une citadelle
  rationale: ἄκρα désigne une hauteur fortifiée ou une citadelle. Le pronom féminin reprend naturellement « la cité » en français. La possibilité d’un nom historique, « l’Acra », est conservée en note.
