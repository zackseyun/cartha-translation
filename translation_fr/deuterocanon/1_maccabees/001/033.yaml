review_pass:
  verdict: revise
  source_fidelity: La formulation « ils fortifièrent … en l’entourant » interprète et développe ᾠκοδόμησαν (« ils bâtirent / construisirent »). Elle ajoute notamment l’idée d’entourer la cité, qui n’est pas explicitée par le grec. « Haute » restreint indûment μέγας, qui signifie « grand, important » plutôt que spécifiquement « haut ». La révision conserve le verbe de construction et rend les deux emplois de ὀχυρός par « solide ».
  naturalness: Le texte révisé reste fluide en français moderne tout en conservant la construction condensée du grec. « Grande et solide muraille » est plus exact et naturel que « muraille haute et solide » dans ce contexte.
  terminology: « Cité de David », « muraille », « tours » et « citadelle » conviennent. La note conserve correctement l’ambiguïté entre le nom commun ἄκρα et son emploi possible comme désignation historique, mais « une Acra » reflète mieux l’article indéfini grec que « l’Acra ».
  issues:
  - severity: medium
    issue: Interprétation expansive de ᾠκοδόμησαν
    rationale: « Fortifièrent » et surtout « en l’entourant » explicitent une opération défensive que le texte grec ne formule pas ainsi; ᾠκοδόμησαν signifie d’abord « bâtir / construire ».
  - severity: medium
    issue: « Haute » pour μεγάλῳ
    rationale: Le grec indique la grandeur ou l’importance de la muraille, sans préciser sa hauteur. « Grande » préserve mieux l’étendue sémantique du terme.
  - severity: low
    issue: Formulation de l’alternative historique dans la note
    rationale: « Une Acra » correspond plus directement à εἰς ἄκραν et distingue l’usage possible comme désignation historique de la simple identification de la forteresse.
