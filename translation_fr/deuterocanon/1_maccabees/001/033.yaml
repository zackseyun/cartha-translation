revisions:
- from: Ils fortifièrent la cité de David en l’entourant d’une muraille haute et solide, avec de solides tours, et elle devint pour eux une citadelle[a].
  to: Ils bâtirent la cité de David avec une grande et solide muraille et de solides tours, et elle devint pour eux une citadelle[a].
  rationale: La révision rétablit le sens premier de ᾠκοδόμησαν sans ajouter l’action d’entourer la ville, et remplace « haute » par « grande » afin de ne pas limiter μέγας à une dimension que le grec ne spécifie pas. L’ambiguïté historique de ἄκρα est maintenue en note.
