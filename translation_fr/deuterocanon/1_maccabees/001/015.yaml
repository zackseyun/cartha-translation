translation:
  language: fr
  text: Ils se firent un prépuce[a], se détournèrent de l’alliance sainte, se lièrent aux nations et se vendirent pour faire le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils se firent un prépuce » ; c’est-à-dire qu’ils dissimulèrent ou cherchèrent à faire disparaître la marque visible de la circoncision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: ils se firent un prépuce
  rationale: 'Cette traduction conserve l’expression grecque concrète et frappante, littéralement « ils se firent un prépuce ». Une note en explicite le sens idiomatique : ils cherchèrent à dissimuler ou à inverser la marque visible de la circoncision.'
- source_word: ἀπέστησαν
  choice: se détournèrent
  rationale: Le verbe exprime l’éloignement ou la défection. « Se détournèrent » est naturel en français moderne et rend la rupture de fidélité sans recourir au terme ecclésiastique plus technique « apostasier ».
- source_word: διαθήκης ἁγίας
  choice: de l’alliance sainte
  rationale: Malgré l’absence d’article en grec, le contexte désigne l’alliance connue d’Israël avec Dieu. L’article défini français convient donc naturellement.
- source_word: ἐζευγίσθησαν
  choice: s’attelèrent
  rationale: Le verbe évoque la mise sous un même joug. « S’attelèrent aux nations » préserve cette métaphore tout en exprimant une association volontaire.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Dans ce contexte juif hellénistique, le terme désigne les peuples non israélites. « Les nations » reste direct et évite une formulation confessionnellement chargée.
- source_word: ἐπράθησαν
  choice: se vendirent
  rationale: La forme passive ou moyenne prend ici une valeur réfléchie de livraison volontaire. « Se vendirent » conserve l’image forte d’un asservissement moral choisi.
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: pour faire le mal
  rationale: La construction infinitive indique naturellement le but ou l’aboutissement. Cette formulation est concise, claire et fidèle.
theological_decisions:
- issue: Degré d’explicitation de l’inversion de la circoncision
  choice: Conserver dans le texte l’expression littérale « ils se firent un prépuce »
  alternative: Traduire directement le sens par « ils restaurèrent leur prépuce » ou « ils effacèrent la marque de leur circoncision »
  rationale: L’image concrète du grec contribue fortement à la présentation de leur abandon de l’alliance. La conserver respecte la rudesse et l’ambiguïté relative de l’original, tandis que la note donne au lecteur le sens visé sans l’imposer à la place du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme coordonné du grec est conservé. « S’attelèrent » maintient la métaphore du joug sans devenir obscur, et la note éclaire l’expression anatomique volontairement concrète.
