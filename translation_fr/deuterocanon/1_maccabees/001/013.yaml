  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: fr
  text: Quelques membres du peuple se montrèrent très disposés à cela. Ils allèrent trouver le roi, et on leur accorda[a] l’autorisation de pratiquer les coutumes des nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement « ils leur accordèrent » : le verbe est au pluriel, bien que « le roi » vienne d’être mentionné au singulier. Le sujet n’est pas précisé ; il peut désigner le roi et ses représentants.'
    reason: textual_ambiguity
  - marker: b
    text: Ici, « les nations » désigne les peuples non israélites ; on pourrait aussi traduire « les coutumes des non-Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: se montrèrent très empressés
  rationale: Le verbe exprime une vive disposition ou un empressement. La formulation française conserve l’absence d’objet explicite dans le grec, sans ajouter « à accepter cela ».
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: quelques membres du peuple
  rationale: Cette tournure française naturelle désigne clairement un sous-groupe au sein du peuple, sans ajouter « hommes », absent du grec.
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: ils allèrent trouver le roi
  rationale: Rend simplement le mouvement vers le roi dans un français actuel et narratif.
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: on leur accorda l’autorité
  rationale: Le grec porte un verbe au pluriel sans sujet pluriel explicite immédiatement identifiable, alors que « le roi » est singulier. Le sujet indéfini « on » préserve cette difficulté textuelle sans attribuer silencieusement l’acte au roi seul.
- source_word: ποιῆσαι
  choice: de pratiquer
  rationale: Avec δικαιώματα, « pratiquer » exprime naturellement la mise en œuvre régulière de coutumes ou de prescriptions.
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: les coutumes des nations
  rationale: Dans ce contexte, δικαιώματα désigne les usages ou prescriptions suivis par les peuples non israélites. « Coutumes » est idiomatique, tandis que « nations » reste proche du grec.
theological_decisions:
- issue: Sens de ἐθνῶν dans un contexte juif
  choice: nations
  alternative: non-Juifs
  rationale: « Nations » traduit directement le grec et conserve sa portée ethnique et politique. Dans le contexte, il s’agit des peuples non israélites, mais traduire directement « non-Juifs » rendrait explicite ce que le terme grec laisse contextuel.
- issue: Sujet de ἔδωκαν, verbe pluriel après « le roi » au singulier
  choice: on leur accorda
  alternative: le roi leur accorda
  rationale: Le grec présente une discordance réelle entre le roi singulier et le verbe pluriel « ils accordèrent ». Le français indéfini évite de corriger tacitement le texte tout en donnant un sens intelligible, possiblement celui du roi et de son administration.
translation_notes:
  register: Français international moderne, narratif et digne. « Très empressés » garde la force volitive du verbe grec sans lui fournir un complément absent de la source. Le point après la première proposition évite une coordination française trop lourde, sans modifier la progression du récit.
