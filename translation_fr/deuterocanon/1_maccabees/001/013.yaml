    issue: Collocation de « autorité de pratiquer »
    rationale: En français, on « accorde l’autorisation de pratiquer » ; « accorder l’autorité de pratiquer » est moins idiomatique et peut suggérer une compétence institutionnelle plutôt qu’une permission ou un droit accordé.
  - severity: low
    issue: Rendu initial de προεθυμήθησαν
    rationale: « Se montrèrent très empressés » ne précise pas l’orientation de l’empressement et sonne légèrement raide. La source a un objet implicite, qui peut être rendu avec prudence par « à cela ».
  - severity: low
    issue: Note sur le pluriel grec à préciser
    rationale: La note actuelle signale l’incertitude d’agent, mais devrait indiquer clairement que la forme grecque est un pluriel (« ils accordèrent »), tandis que le français impersonnel ne reproduit pas ce nombre.
