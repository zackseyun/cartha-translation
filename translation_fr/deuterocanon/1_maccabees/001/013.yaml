review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : certains membres du peuple manifestent un vif empressement, se rendent auprès du roi, puis reçoivent le droit de mettre en pratique les coutumes des nations. Toutefois, « l’autorité de pratiquer » est peu idiomatique dans ce contexte ; ἐξουσία suivie d’un infinitif se rend plus naturellement par « l’autorisation de ». Le grec porte bien un pluriel (« ils accordèrent ») après la mention du roi au singulier ; l’impersonnel français peut conserver l’agent non précisé, à condition que la note signale explicitement le pluriel grec.'
  naturalness: « Se montrèrent très empressés » est possible, mais demeure légèrement vague et quelque peu marqué sans complément. « Se montrèrent très disposés à cela » exprime plus naturellement la forte disposition volontaire de προεθυμήθησαν, tout en indiquant clairement que l’objet est implicite dans le grec. « On leur accorda l’autorisation de pratiquer » est naturel en français international moderne.
  terminology: « Coutumes des nations » rend convenablement τὰ δικαιώματα τῶν ἐθνῶν et conserve « nations », sans imposer le terme interprétatif « non-Juifs » dans le texte. La note peut expliciter le référent contextuel. « Autorisation » convient ici mieux que « autorité » pour ἐξουσία accordée en vue d’une action.
  issues:
