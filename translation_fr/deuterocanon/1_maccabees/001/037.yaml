  text: And they poured out innocent blood around the sanctuary, and they defiled the sanctuary.
translation:
  language: fr
  text: Ils répandirent du sang innocent tout autour du sanctuaire et profanèrent le sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: répandirent
  rationale: Dans ce contexte de mise à mort, « répandre du sang » est une tournure biblique naturelle en français et conserve l’image concrète du grec.
- source_word: αἷμα ἀθῷον
  choice: du sang innocent
  rationale: Expression française claire et consacrée pour désigner le sang de personnes mises à mort injustement.
- source_word: κύκλῳ
  choice: tout autour
  rationale: Rend explicitement la disposition environnante indiquée par κύκλῳ, avec une formulation française naturelle.
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  choice: du sanctuaire / le sanctuaire
  rationale: « Sanctuaire » désigne adéquatement l’espace sacré dans ce contexte cultuel; sa répétition préserve l’insistance rhétorique du grec.
- source_word: ἐμόλυναν
  choice: profanèrent
  rationale: Dans le contexte d’un lieu sacré souillé par du sang innocent, « profaner » exprime naturellement en français l’atteinte cultuelle au sanctuaire, plutôt qu’une simple salissure matérielle.
theological_decisions:
- issue: Sens cultuel de ἁγίασμα
  choice: le sanctuaire
  alternative: le lieu saint; l’enceinte sacrée du Temple
  rationale: Le terme vise ici le lieu sacré lié au Temple de Jérusalem. « Sanctuaire » garde la portée cultuelle sans préciser plus que le grec.
- issue: Portée de ἐμόλυναν
  choice: profanèrent
  alternative: souillèrent; rendirent impur
  rationale: « Profanèrent » communique clairement l’atteinte portée à un espace consacré. « Souillèrent » serait plus formellement proche de l’idée de contamination, mais peut évoquer en français moderne une salissure surtout matérielle.
translation_notes:
  register: Français moderne, sobre et digne. La coordination et la répétition de « sanctuaire » suivent la structure grecque; le passé simple convient au registre narratif écrit.
