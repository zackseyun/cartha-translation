translation:
  language: fr
  text: Et un grand deuil s’abattit sur Israël, dans tous les lieux où ils se trouvaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans tous leurs lieux ». Le grec souligne que le deuil s’étendait à tous les endroits où se trouvaient les Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: s’abattit
  rationale: Avec ἐπὶ Ἰσραήλ, cette tournure française exprime naturellement qu’un deuil vint frapper Israël, tout en conservant la dynamique du grec.
- source_word: πένθος μέγα
  choice: un grand deuil
  rationale: « Deuil » rend le chagrin collectif suscité par la calamité et demeure proche de l’expression grecque.
- source_word: ἐπὶ Ἰσραήλ
  choice: sur Israël
  rationale: « Sur » préserve l’image du deuil qui atteint Israël, plutôt que de réduire la relation à une simple localisation.
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: dans toutes ses localités
  rationale: La formulation conserve la portée distributive de παντί et renvoie aux différents lieux habités par Israël; le singulier « ses » reprend naturellement le collectif « Israël » en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. « Localités » permet de conserver la référence aux lieux multiples sans la tournure peu naturelle « dans tous leurs lieux ».
