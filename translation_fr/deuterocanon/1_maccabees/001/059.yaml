  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: fr
  text: Le vingt-cinquième jour du mois, ils offraient des sacrifices sur l’autel qui se trouvait sur l’autel des holocaustes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici deux mots différents : βωμός (« autel ») et θυσιαστήριον (« autel des holocaustes »), ce qui indique qu’un autel avait été placé sur l’autel du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
  choice: le vingt-cinquième jour
  rationale: Cette formule grecque désigne le vingt-cinquième jour; la tournure retenue est naturelle et précise en français moderne.
- source_word: τοῦ μηνός
  choice: du mois
  rationale: Le génitif appartient à la formule de datation et se rend naturellement par « du mois ».
- source_word: θυσιάζοντες
  choice: ils offraient des sacrifices
  rationale: Le participe est rendu par un verbe conjugué afin de produire une phrase française fluide; l’imparfait conserve l’aspect duratif de l’action décrite.
- source_word: ἐπὶ τὸν βωμόν
  choice: sur l’autel
  rationale: Avec l’accusatif, ἐπί indique ici que les sacrifices sont offerts sur la surface de l’autel.
- source_word: βωμός
  choice: autel
  rationale: Le terme désigne un autel et se distingue ici de θυσιαστήριον; la note explicite cette différence lexicale que le français ne peut reproduire par deux mots courants distincts.
- source_word: θυσιαστήριον
  choice: autel des holocaustes
  rationale: Dans ce contexte cultuel, cette expression désigne l’autel établi du Temple sur lequel l’autre autel avait été placé, tout en préservant la distinction entre les deux termes grecs.
theological_decisions:
- issue: Distinction entre βωμός et θυσιαστήριον dans le contexte de la profanation
  choice: Traduire βωμός par « autel » et θυσιαστήριον par « autel des holocaustes »
  alternative: Traduire les deux termes par « autel », ou qualifier βωμός d’« autel païen »
  rationale: Le grec emploie délibérément deux termes cultuels différents et décrit vraisemblablement un autel installé sur l’autel principal du Temple. « Autel païen » est plausible d’après le contexte, mais n’est pas explicite dans ce verset; cette précision n’est donc pas ajoutée au texte.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait restitue l’action cultuelle en cours, tandis que la répétition intentionnelle d’« autel » préserve la structure frappante du grec; la note explique la distinction lexicale sous-jacente.
