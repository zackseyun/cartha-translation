  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: fr
  text: Après sa mort, ils mirent tous le diadème[a], et leurs fils après eux, pendant de nombreuses années ; et ils multiplièrent les maux dans le pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne royale ». Le terme grec désigne précisément le diadème, insigne de la royauté.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi comprendre : « ils accrurent la méchanceté » ou « ils multiplièrent les calamités dans le pays ». Le mot grec traduit par « maux » peut désigner aussi bien le mal moral que ses conséquences nuisibles.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: ceignirent
  rationale: Avec διαδήματα, le moyen grec exprime le fait de prendre et de porter l’insigne royal. « Ceignirent » conserve l’image concrète dans un français digne et naturel.
- source_word: διαδήματα
  choice: le diadème
  rationale: Le terme désigne précisément l’insigne de la royauté. Le singulier distributif français convient après « tous » et évite que « couronnes » ne perde cette précision.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: Après sa mort
  rationale: La construction exprime simplement la postériorité par rapport à la mort d’Alexandre.
- source_word: ὀπίσω αὐτῶν
  choice: après eux
  rationale: Dans ce contexte dynastique, l’expression marque la succession plutôt qu’une position physique.
- source_word: ἔτη πολλά
  choice: pendant de nombreuses années
  rationale: Rend explicitement l’accusatif de durée dans un français courant.
- source_word: ἐπλήθυναν
  choice: multiplièrent
  rationale: Conserve la valeur active du verbe grec et la force récapitulative de la phrase.
- source_word: κακὰ
  choice: les maux
  rationale: « Maux » garde l’ampleur du pluriel grec, qui peut viser à la fois le mal moral et ses conséquences destructrices.
- source_word: ἐν τῇ γῇ
  choice: dans le pays
  rationale: Dans le cadre historico-politique du récit, γῆ désigne vraisemblablement le territoire concerné plutôt que la terre entière.
theological_decisions:
- issue: Portée de κακὰ
  choice: les maux
  alternative: la méchanceté ; les calamités
  rationale: Le grec reste assez large pour englober tant les actes mauvais que les malheurs qui en résultent. La traduction ne réduit donc pas le propos à une seule dimension.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. « Ceignirent le diadème » maintient l’image royale avec concision ; « les maux » préserve l’ambiguïté du grec.
