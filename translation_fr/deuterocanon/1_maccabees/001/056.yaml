  text: And the books of the law that they found, they tore to pieces and burned with fire.
translation:
  language: fr
  text: Et les livres de la Loi qu’ils trouvèrent, ils les déchirèrent et les brûlèrent au feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  choice: les livres
  rationale: Le pluriel βιβλία désigne des écrits ou des livres. « Les livres » reste naturel en français moderne sans préciser de façon interprétative leur support matériel sous forme de rouleaux.
- source_word: τοῦ νόμου
  choice: de la Loi
  rationale: Dans ce contexte, νόμος renvoie à la Loi juive, la Torah. La majuscule signale ce référent reconnu tout en conservant la formulation concise du grec.
- source_word: ἃ εὗρον
  choice: qu’ils trouvèrent
  rationale: Le relatif suivi de l’aoriste εὗρον signifie directement « qu’ils trouvèrent ». Le passé simple convient au registre narratif soutenu du passage.
- source_word: κατασχίσαντες
  choice: ils les déchirèrent
  rationale: Le participe exprime l’action de déchirer ou de mettre en pièces. Une proposition coordonnée est plus naturelle en français et rend clairement l’acte destructeur qui accompagne et précède l’incendie.
- source_word: ἐνεπύρισαν πυρί
  choice: ils les brûlèrent
  rationale: Le verbe exprime déjà l’action de brûler, tandis que πυρί précise « par le feu ». En français, « brûlèrent » transmet naturellement l’ensemble sans la redondance peu idiomatique de « brûlèrent par le feu ».
theological_decisions:
- issue: Identification de νόμος comme la Torah
  choice: « la Loi » avec une majuscule
  alternative: « la loi » avec une minuscule
  rationale: Le contexte vise les écrits de la Torah, et non une législation indéterminée. La majuscule française rend ce référent sans ajouter de précision absente du texte.
translation_notes:
  register: Français moderne, clair et digne, avec passé simple narratif. La reprise pronominale (« les livres… ils les… ») conserve la mise en relief de l’objet présente dans le grec tout en restant intelligible.
