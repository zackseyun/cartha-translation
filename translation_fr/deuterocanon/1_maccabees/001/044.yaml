base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/044.yaml
  text: And the king sent letters by the hand of messengers to Jerusalem and the cities of Judah[a], that they should follow laws foreign to the land,
translation:
  language: fr
  text: Le roi envoya des lettres par l’intermédiaire de messagers à Jérusalem et aux villes de Juda, pour qu’on y suive des lois étrangères au pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des coutumes étrangères au pays ». Le mot grec peut désigner aussi bien des pratiques coutumières que des lois.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλία
  choice: lettres
  rationale: Dans ce contexte administratif, le terme désigne des communications écrites envoyées par le roi, et non des livres au sens moderne.
- source_word: ἐν χειρὶ ἀγγέλων
  choice: par l’intermédiaire de messagers
  rationale: L’expression signifie littéralement « dans la main de messagers » et indique ici le moyen de transmission; cette formulation est naturelle en français tout en conservant l’idée d’intermédiaires.
- source_word: προπορεύθηναι ὀπίσω
  choice: pour qu’elles adoptent
  rationale: La tournure exprime le fait de suivre une voie prescrite. Avec des lois ou des coutumes comme complément, « adopter » rend clairement le sens sans reproduire lourdement l’expression grecque.
- source_word: νομίμων
  choice: lois
  rationale: Le terme peut désigner des lois, des usages ou des pratiques établies. « Lois » convient au caractère officiel et contraignant de l’ordre royal, tandis que la note conserve l’autre nuance.
- source_word: ἀλλοτρίων
  choice: étrangères
  rationale: Le mot désigne ce qui appartient à d’autres ou n’est pas propre au pays; « étrangères » restitue naturellement ce contraste.
- source_word: τῆς γῆς
  choice: au pays
  rationale: Le grec dit simplement « le pays » ou « la terre ». Cette traduction évite de préciser davantage que le texte, tout en étant idiomatique en français.
theological_decisions:
- issue: Portée de νομίμων dans le contexte de la persécution
  choice: lois
  alternative: coutumes ou pratiques établies
  rationale: « Lois » préserve la dimension normative et coercitive du décret royal, sans nier que le terme grec puisse aussi englober les usages religieux et sociaux.
- issue: Valeur de la proposition infinitive après l’envoi des lettres
  choice: pour qu’elles adoptent
  alternative: leur ordonnant de suivre
  rationale: La formulation exprime le but ou le contenu directif des lettres sans ajouter explicitement un verbe comme « ordonner », absent du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Par l’intermédiaire de » rend naturellement l’agence des messagers; « adoptent » évite le calque obscur « marchent derrière » tout en gardant l’idée de se conformer à une voie étrangère.
