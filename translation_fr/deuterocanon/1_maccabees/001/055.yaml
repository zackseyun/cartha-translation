translation:
  language: fr
  text: Aux entrées des maisons et dans les places publiques, ils brûlaient de l’encens[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils offraient de l’encens ». Le verbe grec peut désigner le fait de brûler de l’encens comme offrande cultuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « larges rues » ou « espaces publics ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδων
  choice: ouvertures
  rationale: θυρίς peut désigner une ouverture, une petite porte ou une fenêtre. « Ouvertures » préserve cette amplitude sémantique sans imposer le sens plus précis de « portes ».
- source_word: οἰκιῶν
  choice: maisons
  rationale: Rendu direct et concret de οἰκία dans l’énumération des lieux.
- source_word: πλατείαις
  choice: places publiques
  rationale: πλατεῖα désigne une voie large ou un espace urbain ouvert; « places publiques » convient naturellement au contexte, tout en signalant en note l’autre possibilité.
- source_word: ἐθυμίων
  choice: ils brûlaient de l’encens
  rationale: θυμιάω désigne l’action de brûler de l’encens, souvent comme offrande cultuelle. Cette formulation française reste directe et n’explicite pas davantage la fonction rituelle.
- source_word: ἐπὶ ... καὶ ἐν
  choice: sur ... et sur
  rationale: Le premier « sur » rend ἐπί. Devant « places publiques », le français idiomatique emploie également « sur » pour ἐν; reproduire mécaniquement « dans » serait moins naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’imparfait restitue l’aspect imperfectif de ἐθυμίων. Le choix prudent d’« ouvertures » conserve l’ambiguïté architecturale de θυρίδων.
