review_pass:
  verdict: revise
  source_fidelity: La proposition rend correctement l’action cultuelle (ἐθυμίων) à l’imparfait et conserve utilement le pluriel des deux lieux. Toutefois, « sur les places publiques » ne rend pas ἐν ταῖς πλατείαις, qui situe l’action dans ces espaces. Pour ἐπὶ τῶν θυρίδων, « aux entrées des maisons » est plus naturel en français tout en évitant de décider indûment entre portes, embrasures et autres ouvertures.
  naturalness: « Sur les ouvertures des maisons » est peu idiomatique et architecturalement imprécis dans ce contexte. « Aux entrées des maisons et dans les places publiques » est fluide, clair et d’un registre narratif moderne approprié.
  terminology: « Brûlaient de l’encens » est un rendu direct et juste de θυμιάω, sans imposer une interprétation confessionnelle. « Places publiques » est défendable pour πλατείαις, avec une note signalant « larges rues » comme autre possibilité. Les variantes lexicales gagnent à être distinguées par des ancres séparées.
  issues:
  - severity: medium
    issue: La seconde préposition est rendue par « sur les places publiques ».
    rationale: Le grec ἐν (« dans ») diffère de ἐπί dans ce verset. En français, l’action se déroule « dans les places publiques », non « sur » elles.
  - severity: low
    issue: « Sur les ouvertures des maisons » est maladroit et trop littéral.
    rationale: θυρίδες peut désigner des portes, des entrées ou des ouvertures; « aux entrées des maisons » préserve une latitude sémantique raisonnable et rend naturellement la valeur locative de ἐπί.
  - severity: low
    issue: Une seule note regroupe deux alternatives indépendantes après « encens ».
    rationale: Des ancres distinctes rendent transparentes les alternatives concernant, d’une part, le verbe cultuel et, d’autre part, πλατείαις.
