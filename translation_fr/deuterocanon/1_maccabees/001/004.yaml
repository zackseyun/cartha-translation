  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
translation:
  language: fr
  text: Il rassembla une armée extrêmement puissante et se mit à régner sur des territoires, des nations et des tyrannies[a], et ils devinrent ses tributaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne des tyrannies, c’est-à-dire des domaines ou des gouvernements placés sous l’autorité de tyrans; on pourrait aussi rendre plus librement par « pouvoirs tyranniques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν δύναμιν ἰσχυρὰν σφόδρα
  choice: rassembla une armée extrêmement puissante
  rationale: Dans ce contexte militaire, δύναμις désigne des forces armées. « Armée » est naturel en français, tandis que « extrêmement puissante » restitue l’intensification de ἰσχυρὰν σφόδρα.
- source_word: ἦρξεν
  choice: se mit à régner sur
  rationale: Avec le génitif, ἄρχω exprime l’exercice de l’autorité. « Se mit à » conserve la possible valeur ingressive de l’aoriste, sans réduire le verbe au simple commencement.
- source_word: χωρῶν
  choice: territoires
  rationale: Le terme désigne ici des terres ou régions envisagées comme espaces politiques; « territoires » évite l’idée moderne d’États-nations.
- source_word: ἐθνῶν
  choice: nations
  rationale: Le mot renvoie aux peuples ou nations soumis par la conquête; « nations » convient au cadre historique et politique.
- source_word: τυραννιῶν
  choice: principautés
  rationale: Le terme peut désigner des pouvoirs ou domaines gouvernés par des chefs exerçant une autorité absolue. « Principautés » rend ici la catégorie politique plus naturellement que le calque français « tyrannies », qui évoque surtout un régime oppressif abstrait.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: qui durent lui payer un tribut
  rationale: L’expression indique l’entrée dans une condition de sujétion tributaire. Cette formulation française explicite naturellement l’obligation résultante sans ajouter de précision étrangère au texte.
