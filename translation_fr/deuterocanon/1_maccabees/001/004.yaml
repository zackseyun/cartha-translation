review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien le rassemblement d’une force militaire, l’intensité, la nuance ingressive de ἦρξεν et les trois catégories politiques. Toutefois, « qui durent lui payer un tribut » transforme l’état résultant exprimé par ἐγένοντο … εἰς φόρον (« devinrent tributaires ») en obligation de paiement et rattache maladroitement le relatif à « territoires, nations et principautés ».
  naturalness: Le français est globalement fluide et de registre historique approprié. « Dev[inrent] ses tributaires » est à la fois naturel et plus direct. « Tyrannies » est un terme politique français attesté et rend plus exactement τυραννιῶν que « principautés », qui évoque spécifiquement des États dirigés par des princes.
  terminology: « Armée extrêmement puissante », « territoires », « nations » et « tributaires » conviennent. Pour τυραννιῶν, « tyrannies » préserve la catégorie politique du grec sans identifier indûment ces entités à des principautés. La note précise utilement que le mot peut viser les domaines ou gouvernements soumis à des tyrans.
  issues:
  - severity: medium
    issue: « qui durent lui payer un tribut » ne reproduit pas exactement la construction de résultat ἐγένοντο αὐτῷ εἰς φόρον.
    rationale: Le grec indique qu’ils devinrent tributaires de lui, c’est-à-dire qu’ils entrèrent dans une condition de sujétion tributaire. Le verbe « durent » met l’accent sur une obligation de paiement et le relatif crée en outre une reprise moins nette.
  - severity: medium
    issue: « principautés » atténue et modifie la portée de τυραννιῶν.
    rationale: Une principauté est un territoire gouverné par un prince; τυραννίαι renvoie aux tyrannies, c’est-à-dire à des pouvoirs ou domaines sous des tyrans. Le français « tyrannies » est ici le correspondant formel et contextuellement intelligible.
  revised_text: Il rassembla une armée extrêmement puissante et se mit à régner sur des territoires, des nations et des tyrannies[a], et ils devinrent ses tributaires.
  revised_footnotes:
  - marker: a
    text: Le terme grec désigne des tyrannies, c’est-à-dire des domaines ou des gouvernements placés sous l’autorité de tyrans; on pourrait aussi rendre plus librement par « pouvoirs tyranniques ».
    reason: lexical_alternative
