  text: And many in Israel stood firm and were strengthened among themselves so as not to eat defiled food;[a]
translation:
  language: fr
  text: Beaucoup, en Israël, s’affermirent et se fortifièrent en eux-mêmes pour ne pas manger d’aliments profanés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’aliments impurs »; littéralement, « de choses communes ». Dans ce contexte, le terme grec désigne des aliments considérés comme rituellement impropres ou souillés. L’expression grecque rendue par « en eux-mêmes » peut aussi se comprendre « entre eux ».
    reason: Alternative lexicale pour κοινά et ambiguïté syntaxique de ἐν αὐτοῖς.
lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: Beaucoup, en Israël
  rationale: Cette formulation conserve la concision du grec et situe ces personnes au sein d’Israël sans ajouter un substantif absent du texte.
- source_word: ἐκραταιώθησαν
  choice: s’affermirent
  rationale: Le verbe exprime l’acquisition ou la manifestation de force; « s’affermirent » rend naturellement leur résolution sans effacer l’image de fermeté.
- source_word: ὠχυρώθησαν ἐν αὐτοῖς
  choice: puisèrent en eux-mêmes la force
  rationale: Le passif de ὀχυρόω évoque le fait d’être fortifié, tandis que ἐν αὐτοῖς signifie plus directement « en eux-mêmes » que « entre eux ». La tournure française restitue l’intériorité de l’expression grecque sans prétendre lever entièrement sa formulation inhabituelle.
- source_word: τοῦ μὴ φαγεῖν
  choice: de ne pas manger
  rationale: Dans cette construction, l’infinitif articulé indique l’orientation ou le résultat de leur affermissement; le français exprime naturellement ce rapport par « la force de ne pas manger ».
- source_word: κοινά
  choice: aliments profanés
  rationale: Dans ce contexte de prescriptions alimentaires juives, κοινά désigne des choses rendues impropres sur le plan rituel. « Aliments » explicite l’objet de φαγεῖν, et « profanés » distingue ce terme de ἀκάθαρτος, souvent traduit par « impur ».
theological_decisions:
- issue: Valeur rituelle de κοινά dans le contexte de la Loi juive
  choice: aliments profanés
  alternative: aliments impurs; littéralement, choses communes
  rationale: « Profanés » communique le passage du domaine consacré au domaine commun et l’impropriété rituelle, sans assimiler automatiquement κοινός à ἀκάθαρτος. La note conserve les autres possibilités.
- issue: Portée de ἐν αὐτοῖς
  choice: en eux-mêmes
  alternative: entre eux
  rationale: Le pronom réfléchi peut être compris comme renvoyant à leur disposition intérieure, tandis qu’une lecture communautaire est contextuellement possible. Le texte suit la valeur la plus directe de la préposition et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux verbes de force est maintenu par « s’affermirent » et « puisèrent… la force », tandis que la formulation française évite une répétition lourde. Le point-virgule grec final est rendu par un point.
