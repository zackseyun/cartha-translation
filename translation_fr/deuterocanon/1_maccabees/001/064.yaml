translation:
  language: fr
  text: Il y eut une très grande colère contre Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une très grande colère s’abattit sur Israël ». Le grec ne précise pas d’où vient cette colère.
    reason: Variante lexicale et préservation de l’ambiguïté quant à l’origine de la colère.
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: Il y eut alors
  rationale: Cette tournure française rend naturellement l’apparition de l’état exprimé par ἐγένετο; «alors» donne à καί sa valeur de liaison narrative dans ce résumé conclusif.
- source_word: ὀργὴ
  choice: colère
  rationale: «Colère» exprime l’intensité de ὀργή sans préciser une origine divine, humaine ou circonstancielle que le grec ne nomme pas.
- source_word: μεγάλη ... σφόδρα
  choice: très grande
  rationale: Le superlatif analytique naturel en français restitue l’intensification produite par l’adjectif μεγάλη et l’adverbe postposé σφόδρα.
- source_word: ἐπὶ Ἰσραήλ
  choice: contre Israël
  rationale: Avec «colère», «contre» exprime naturellement l’orientation hostile de ἐπί, tout en évitant une formulation française artificielle.
theological_decisions:
- issue: Origine implicite de la colère
  choice: Ne nommer aucun auteur de la colère
  alternative: Préciser qu’il s’agit de la colère de Dieu, de celle des persécuteurs, ou d’un malheur s’abattant sur Israël
  rationale: Le grec ne précise pas d’où vient cette colère. La traduction conserve donc cette ambiguïté et n’impose aucune interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en étant immédiatement compréhensible; elle évite d’identifier implicitement l’auteur de la colère.
