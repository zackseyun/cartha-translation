  yaml_path: translation/deuterocanon/1_maccabees/001/026.yaml
  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
translation:
  language: fr
  text: Les chefs et les anciens gémirent ; les vierges et les jeunes hommes s’affaiblirent, et la beauté des femmes fut altérée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut changée ». Le grec indique que la beauté des femmes changea, sans préciser de quelle manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  choice: gémirent
  rationale: Le verbe exprime de manière audible la douleur ou l’affliction. « Gémirent » en conserve la force corporelle sans ajouter l’idée plus précise d’une lamentation formelle.
- source_word: ἄρχοντες
  choice: chefs
  rationale: Le terme désigne de façon générale des personnes exerçant l’autorité. « Chefs » convient au contexte social sans suggérer nécessairement une royauté ou une noblesse héréditaire.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Le mot renvoie vraisemblablement aux figures reconnues et expérimentées de la communauté, plutôt qu’aux seuls hommes âgés.
- source_word: παρθένοι
  choice: vierges
  rationale: Le grec désigne explicitement des jeunes femmes vierges. « Vierges » préserve cette précision, que « jeunes filles » pourrait atténuer.
- source_word: νεανίσκοι
  choice: jeunes hommes
  rationale: Le terme désigne de jeunes personnes de sexe masculin. « Jeunes hommes » est précis et naturel en français moderne.
- source_word: ἠσθένησαν
  choice: s’affaiblirent
  rationale: Le verbe signifie devenir faible ou perdre ses forces. La forme pronominale exprime naturellement ce changement d’état.
- source_word: τὸ κάλλος
  choice: la beauté
  rationale: Le nom désigne la beauté ou l’attrait physique ; « beauté » en est l’équivalent direct et naturel.
- source_word: ἠλλοιώθη
  choice: fut altérée
  rationale: Le passif indique que la beauté fut changée, sans préciser la nature de ce changement. « Fut altérée » conserve cette indétermination et la nuance défavorable suggérée par le contexte, sans imposer l’image plus précise d’une beauté qui se serait fanée.
