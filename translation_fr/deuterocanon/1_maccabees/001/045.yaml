lexical_decisions:
- source_word: κωλῦσαι
  choice: interdire
  rationale: Dans le contexte d’un décret officiel, le verbe exprime une interdiction plutôt qu’un simple empêchement matériel.
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Dans le vocabulaire cultuel biblique, « holocaustes » désigne précisément les offrandes entièrement consumées par le feu.
- source_word: θυσίας
  choice: sacrifices
  rationale: Ce terme général conserve la distinction avec les holocaustes et les libations.
- source_word: σπονδὴν
  choice: libations
  rationale: Le pluriel français convient à une énumération de pratiques cultuelles interdites de manière générale; « libations » est précis et courant dans ce contexte.
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: dans le sanctuaire
  rationale: Après κωλῦσαι, la tournure indique vraisemblablement que ces rites doivent être exclus du sanctuaire; le français idiomatique exprime le lieu où leur célébration est interdite.
- source_word: βεβηλῶσαι
  choice: profaner
  rationale: Le verbe signifie traiter comme profane ce qui est sacré; « profaner » conserve sa force cultuelle.
- source_word: σάββατα
  choice: les sabbats
  rationale: Le pluriel grec est maintenu et renvoie à l’observance des jours de sabbat.
- source_word: ἑορτάς
  choice: les fêtes
  rationale: Le mot désigne les fêtes religieuses du calendrier d’Israël; « fêtes » est naturel et précis en français biblique moderne.
theological_decisions:
- issue: Terminologie cultuelle des rites du sanctuaire
  choice: Conserver les catégories distinctes « holocaustes », « sacrifices » et « libations ».
  alternative: Les regrouper sous un terme général tel que « offrandes » ou « actes de culte ».
  rationale: Le grec énumère des pratiques concrètes et distinctes dont la suppression est ordonnée; les maintenir évite d’aplanir la portée du texte.
- issue: Valeur de ἐκ τοῦ ἁγιάσματος avec κωλῦσαι
  choice: Traduire idiomatiquement « dans le sanctuaire » et signaler la formulation littérale en note.
  alternative: Traduire directement « du sanctuaire ».
  rationale: Le grec présente les rites comme exclus de la sphère du sanctuaire. « Dans le sanctuaire » rend clairement en français le lieu où ils ne doivent plus avoir lieu, tandis que la note préserve la forme et la nuance de l’original.
translation_notes:
  register: Français international moderne, digne et lisible. « Holocaustes » est employé dans son sens cultuel biblique précis; l’enchaînement infinitif suppose le décret mentionné dans le contexte précédent.
