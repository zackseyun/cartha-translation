  text: and to forbid whole burnt offerings and sacrifices and drink offerings from the sanctuary[a], and to profane Sabbaths and feasts[d][c][b],
translation:
  language: fr
  text: et d’interdire les holocaustes, les sacrifices et les libations, et de les exclure du sanctuaire[a], et de profaner les sabbats et les fêtes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
