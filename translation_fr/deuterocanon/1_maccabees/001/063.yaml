base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: fr
  text: Ils acceptèrent de mourir afin de ne pas se souiller par les aliments[a] et de ne pas profaner la sainte alliance[b] ; et ils moururent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nourritures ». Le terme grec désigne des aliments, ici ceux dont la consommation entraînerait une souillure selon la loi de l’alliance.
    reason: Précision lexicale sur le champ de βρῶμα et son référent contextuel.
  - marker: b
    text: Ou « une sainte alliance ». En grec, l’expression est sans article, mais le contexte renvoie très probablement à l’alliance connue d’Israël.
    reason: Préservation de l’autre lecture grammaticalement possible du syntagme anarthre.
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: ils acceptèrent de mourir
  rationale: Le moyen ἐπεδέξαντο exprime l’accueil volontaire ou l’acceptation du sort qui les attend. « Acceptèrent de mourir » reste naturel en français sans ajouter l’idée affective de « accueillirent avec joie » ni renforcer le grec en « choisirent la mort ».
- source_word: μιανθῶσιν
  choice: se souiller
  rationale: Le verbe évoque ici une souillure liée à la consommation d’aliments interdits, avec des dimensions rituelle et morale. La tournure pronominale est idiomatique en français.
- source_word: τοῖς βρώμασιν
  choice: les aliments
  rationale: Le pluriel désigne les denrées dont la consommation entraînerait la souillure dans ce contexte. « Aliments » est plus large et plus exact que « viandes ».
- source_word: βεβηλώσωσιν
  choice: profaner
  rationale: « Profaner » rend l’opposition entre ce qui est saint et le fait de le traiter comme commun, opposition portée par le grec.
- source_word: διαθήκην ἁγίαν
  choice: la sainte alliance
  rationale: Bien que le syntagme grec soit sans article, le contexte renvoie naturellement à l’alliance connue d’Israël. En français, l’article défini exprime ce référent de façon idiomatique.
- source_word: ἀπέθανον
  choice: ils moururent
  rationale: Le grec affirme simplement qu’ils moururent. Cette formulation n’explicite pas le mode de leur mort et n’ajoute donc pas « furent mis à mort ».
theological_decisions:
- issue: Nature de la souillure causée par les aliments
  choice: Une souillure rituelle et morale résultant de la consommation d’aliments interdits
  alternative: Une corruption morale générale associée à des pratiques alimentaires
  rationale: Le cadre de 1 Maccabées relie directement ces aliments à la fidélité à la loi de l’alliance. « Se souiller » conserve la portée rituelle sans exclure la dimension morale.
- issue: Détermination de διαθήκην ἁγίαν
  choice: « la sainte alliance », comprise comme l’alliance connue d’Israël
  alternative: « une sainte alliance »
  rationale: L’absence d’article en grec permet formellement l’indéfini, mais le contexte historique et littéraire désigne l’alliance d’Israël. Une note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche de l’enchaînement grec tout en restant naturelle. La répétition finale « et ils moururent » est conservée pour respecter la sobriété et la force rhétorique de l’original. Les marqueurs de notes sont placés sur les termes qu’ils expliquent.
