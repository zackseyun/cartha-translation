base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/016.yaml
  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
translation:
  language: fr
  text: Le royaume fut affermi devant Antiochos[a], et celui-ci entreprit de régner sur le pays d’Égypte, afin de régner sur les deux royaumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le royaume fut préparé devant Antiochos ». Le grec peut laisser entendre que son pouvoir fut assuré avant qu’il se tourne vers l’Égypte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: fut affermi
  rationale: Le passif signifie littéralement « fut préparé » ou « fut rendu prêt ». Dans ce contexte royal et politique, « fut affermi » exprime naturellement l’idée d’un royaume rendu stable ou assuré, sans imposer une précision absente du grec.
- source_word: ἡ βασιλεία
  choice: le royaume
  rationale: βασιλεία peut désigner la royauté, le règne ou le royaume. La mention finale des « deux royaumes » favorise ici le sens concret de « royaume ».
- source_word: ἐνώπιον Ἀντιόχου
  choice: devant Antiochos
  rationale: Cette traduction conserve la formulation grecque et son ambiguïté. Dans le contexte, elle peut suggérer que le royaume fut préparé ou assuré pour Antiochos; cette nuance est signalée en note.
- source_word: ὑπέλαβεν
  choice: entreprit
  rationale: Avec l’infinitif βασιλεῦσαι, le verbe indique qu’Antiochos se mit à poursuivre le projet d’exercer la royauté sur l’Égypte. « Entreprit » rend ce mouvement sans le réduire à une simple intention.
- source_word: βασιλεῦσαι
  choice: régner
  rationale: Le verbe désigne proprement l’exercice de la royauté. « Régner sur » est naturel et conserve cette dimension royale.
- source_word: γῆς Αἰγύπτου
  choice: le pays d’Égypte
  rationale: Cette formulation garde la référence territoriale explicite de γῆ, plutôt que de simplifier en « Égypte ».
- source_word: ὅπως
  choice: afin de
  rationale: La conjonction introduit ici le but recherché. « Afin de » en restitue clairement la valeur finale.
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: sur les deux royaumes
  rationale: La formulation désigne deux entités politiques distinctes, le royaume déjà gouverné par Antiochos et l’Égypte qu’il voulait ajouter à sa domination.
