revisions:
- from: Il y entra le vingt-troisième jour du deuxième mois, en l’an cent soixante et onze, au milieu des louanges, avec des branches de palmier, au son des harpes[a], des cymbales et d’autres instruments à cordes[b], avec des hymnes et des chants, parce qu’un grand ennemi avait été écrasé et chassé d’Israël.[c]
  to: Il y entra le vingt-troisième jour du deuxième mois, en l’an cent soixante et onze, avec des louanges et des branches de palmier, avec des harpes[a], des cymbales et des instruments à cordes[b], avec des hymnes et des chants, car un grand ennemi avait été écrasé hors d’Israël.[c]
  rationale: La révision maintient la numérotation, le registre narratif et les choix lexicaux prudents pour les instruments. Elle retire les ajouts non nécessaires (« autres », « chassé »), restitue plus directement les trois groupes introduits par μετά et préserve, en note, la difficulté syntaxique de ἐξ Ἰσραήλ.
