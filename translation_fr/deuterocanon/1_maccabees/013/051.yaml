  yaml_path: translation/deuterocanon/1_maccabees/013/051.yaml
  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: fr
  text: Il y entra le vingt-troisième jour du deuxième mois, en l’an cent soixante et onze, avec des louanges et des branches de palmier, avec des harpes[a], des cymbales et des instruments à cordes[b], avec des hymnes et des chants, car un grand ennemi avait été écrasé hors d’Israël.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lyres » ; l’identification exacte de l’instrument grec κινύρα est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne ici un instrument à cordes particulier, parfois rendu par « harpe », « lyre » ou « psaltérion », dont l’identification exacte est incertaine.
    reason: lexical_alternative
  - marker: c
    text: 'La formulation grecque est concise : littéralement, « parce qu’un grand ennemi avait été écrasé hors d’Israël ». La préposition peut suggérer qu’il avait été éliminé du pays.'
    reason: source_ambiguity
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: Il y entra
  rationale: Le pronom renvoie au lieu mentionné dans le contexte. « Il y entra » est naturel en français et conserve le mouvement exprimé par le grec.
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός
  choice: le vingt-troisième jour du deuxième mois
  rationale: Rend clairement en français moderne la formulation calendaire grecque, littéralement « le troisième et vingtième ».
- source_word: ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: en l’an cent soixante et onze
  rationale: Conserve exactement le numéro de l’année sans ajouter dans le texte l’identification historique de l’ère.
- source_word: μετὰ αἰνέσεως
  choice: au milieu des louanges
  rationale: αἴνεσις désigne la louange; la formulation française évoque naturellement l’accompagnement collectif de l’entrée sans réduire le terme à l’action de grâce.
- source_word: βαΐων
  choice: branches de palmier
  rationale: Expression explicite et courante pour les palmes portées dans cette célébration.
- source_word: κινύραις
  choice: harpes
  rationale: Désigne un ancien instrument à cordes, souvent assimilé à la harpe ou à la lyre; « harpes » reste accessible, avec l’incertitude signalée en note.
- source_word: κυμβάλοις
  choice: cymbales
  rationale: Équivalent français direct du nom de cet instrument de percussion.
- source_word: νάβλαις
  choice: d’autres instruments à cordes
  rationale: La νάβλα est un instrument à cordes particulier dont l’identification moderne demeure incertaine. Le terme générique évite une précision trompeuse, et « d’autres » distingue ce groupe des harpes déjà citées.
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: avec des hymnes et des chants
  rationale: Préserve les deux catégories coordonnées et leur caractère festif, sans les confondre.
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: un grand ennemi avait été écrasé et chassé d’Israël
  rationale: « Écrasé » rend συνετρίβη, tandis que « chassé d’Israël » explicite la valeur séparative de ἐξ dans un français naturel; la note conserve la possibilité d’une formulation plus littérale.
theological_decisions:
- issue: Caractère de la célébration
  choice: Employer un vocabulaire public et religieux de louange, de musique et de chant, sans ajouter de portée messianique ou liturgique ultérieure.
  alternative: Employer des termes plus techniquement cultuels, tels que « actions de grâce » ou « psaumes ».
  rationale: Le grec décrit une entrée triomphale célébrant la délivrance d’Israël, mais ne requiert ni terminologie cultuelle plus étroite ni interprétation typologique.
- issue: Sens de ἐξ Ἰσραήλ après le passif συνετρίβη
  choice: Traduire « écrasé et chassé d’Israël » afin de faire entendre à la fois la défaite et l’éloignement hors d’Israël.
  alternative: Traduire plus littéralement « écrasé hors d’Israël » ou comprendre « écrasé en Israël ».
  rationale: La syntaxe grecque est abrupte. La valeur séparative de ἐξ est vraisemblable, mais la note préserve la tournure littérale et évite de masquer complètement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique écrit; le plus-que-parfait marque naturellement que la défaite de l’ennemi motive la célébration. Les instruments antiques incertains sont rendus par des termes accessibles, avec leurs variantes en notes.
