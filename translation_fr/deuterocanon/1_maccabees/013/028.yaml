lexical_decisions:
- source_word: ἔστησεν
  choice: érigea
  rationale: Dans le contexte de monuments funéraires, « ériger » exprime naturellement l’action de dresser une construction commémorative.
- source_word: ἑπτὰ πυραμίδας
  choice: sept pyramides
  rationale: πυραμίς désigne directement une pyramide. Cette traduction conserve la forme architecturale donnée par le grec sans préciser davantage la nature des monuments.
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: les unes en face des autres
  rationale: Cette formulation française rend la disposition réciproque des sept monuments tout en évitant de donner l’impression qu’il n’y en avait que deux.
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: pour son père, sa mère
  rationale: Les datifs indiquent ici la destination commémorative. Le possessif, implicite dans le contexte, est nécessaire en français naturel.
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: ses quatre frères
  rationale: ἀδελφοῖς désigne ici les frères de Simon; le possessif explicite leur lien avec lui en français naturel.
