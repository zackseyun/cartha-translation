  verdict: revise
  source_fidelity: La traduction rend correctement ἔστησεν, ἑπτὰ πυραμίδας et les datifs commémoratifs. Toutefois, « les unes en face des autres » explicite et régularise au pluriel une formulation grecque singulière (μίαν κατέναντι τῆς μιᾶς). Cette construction est syntaxiquement et matériellement difficile avec « sept pyramides »; il convient de conserver cette étrangeté sans prétendre en résoudre l’agencement.
  naturalness: « Il érigea », « sept pyramides » et « pour son père, sa mère et ses quatre frères » sont naturels, clairs et d’un registre approprié. « L’une en face de l’autre » est inhabituel dans ce contexte, mais cette littéralité contrôlée est justifiée par l’ambiguïté du grec et est éclairée par une note.
  terminology: « Pyramides » conserve le terme architectural πυραμίδας sans interprétation supplémentaire. « Érigea » convient à l’établissement de monuments. « Frères » rend précisément ἀδελφοῖς dans ce contexte.
  issues:
