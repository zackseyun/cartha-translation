    issue: 'La formulation principale met au pluriel la relation spatiale : « les unes en face des autres ».'
    rationale: μίαν κατέναντι τῆς μιᾶς emploie deux singuliers (« l’une en face de l’autre »). Le pluriel français transforme une expression difficile en une disposition générale des sept monuments, interprétation que le grec ne formule pas explicitement.
  - severity: low
    issue: La note affirme que le grec décrit les monuments « les uns par rapport aux autres ».
    rationale: Cette explication amplifie elle aussi le singulier grec et donne l’impression que la disposition de l’ensemble est déterminée. Une note doit signaler la formulation singulière et l’incertitude d’agencement.
