  source_fidelity: 'Le texte français rend fidèlement la structure narrative grecque : Simon envoie Jonathan, fils d’Absalom, avec une force militaire importante à Joppé ; Jonathan expulse les personnes qui s’y trouvent et y demeure. « Ceux qui s’y trouvaient » conserve à juste titre l’indétermination de τοὺς ἐν αὐτῇ ὄντας. La reprise explicite de « Jonathan » dans la seconde phrase clarifie un sujet que le grec laisse implicite, sans ajout de sens.'
  naturalness: Le français est moderne, fluide et d’un registre narratif approprié. « Une troupe assez nombreuse » est idiomatique et représente de façon recevable δύναμιν ἱκανήν. La division en deux phrases améliore la lisibilité sans altérer les liens narratifs.
  terminology: Les noms « Jonathan », « Absalom » et « Joppé » sont bien établis en français biblique. « Fils d’Absalom », « troupe », « chassa » et « resta » conviennent au contexte militaire et ne surinterprètent pas le texte. La note rend compte avec prudence du double locatif ἐκεῖ ἐν αὐτῇ ; « peut-être » évite d’ériger son effet stylistique en certitude.
