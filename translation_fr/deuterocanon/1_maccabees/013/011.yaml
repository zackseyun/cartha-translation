  yaml_path: translation/deuterocanon/1_maccabees/013/011.yaml
  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: fr
  text: Il envoya Jonathan, fils d’Absalom, avec une troupe assez nombreuse à Joppé. Jonathan chassa ceux qui s’y trouvaient et y resta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « resta là, en elle ». Ce double complément de lieu souligne peut-être qu’il resta dans la ville même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: Il envoya
  rationale: Verbe narratif courant, rendu naturellement sans ajouter une nuance technique absente du grec.
- source_word: Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: Jonathan, fils d’Absalom
  rationale: La construction grecque identifie Jonathan par son père; cette formulation est claire et idiomatique en français.
- source_word: καὶ μετʼ αὐτοῦ δύναμιν ἱκανὴν
  choice: avec une troupe assez nombreuse
  rationale: δύναμις désigne ici une troupe militaire, tandis que ἱκανή exprime un effectif suffisant ou substantiel sans en préciser la taille.
- source_word: εἰς Ἰόππην
  choice: à Joppé
  rationale: La préposition marque la destination; « à Joppé » est la tournure française naturelle pour un déplacement vers une ville.
- source_word: ἐξέβαλεν
  choice: chassa
  rationale: Le verbe exprime une expulsion concrète dans un contexte militaire et politique.
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: ceux qui s’y trouvaient
  rationale: Cette formulation préserve l’imprécision du grec quant à l’identité et au statut des personnes présentes.
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: y resta
  rationale: Le pronom adverbial « y » rend naturellement le fait que Jonathan demeura dans la ville, tandis qu’une note signale le double locatif grec.
