lexical_decisions:
- source_word: Βασιλεὺς
  choice: Le roi
  rationale: Dans cette formule d’adresse épistolaire, le titre royal précédant le nom se rend naturellement en français avec l’article défini.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française courante du nom grec, qui conserve sa forme hellénique.
- source_word: Σίμωνι
  choice: à Simon
  rationale: Le datif marque le destinataire; « Simon » est la forme française traditionnelle dans ce contexte.
- source_word: ἀρχιερεῖ
  choice: le grand prêtre
  rationale: L’apposition désigne la fonction de Simon; « grand prêtre » est l’expression française établie.
- source_word: καὶ
  choice: et
  rationale: Conjonction simple reliant les deux titres de Simon.
- source_word: φίλῳ βασιλέων
  choice: ami des rois
  rationale: Cette formulation conserve le pluriel littéral de βασιλέων ainsi que la tonalité officielle du titre de cour, sans le réduire à l’interprétation « ami royal ».
