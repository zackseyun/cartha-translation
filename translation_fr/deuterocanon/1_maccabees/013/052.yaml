  text: And he established it as a yearly observance to celebrate this day. And he fortified the hill of the sanctuary beside the citadel[a], and he lived there, he and those with him.
translation:
  language: fr
  text: Il établit que, chaque année, on célébrerait ce jour. Puis il fortifia la colline du sanctuaire, près de la citadelle[a]. Lui-même et ceux qui étaient avec lui y vivaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « près de l’Akra » : le mot grec peut désigner précisément la forteresse séleucide de Jérusalem plutôt qu’une citadelle au sens général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: Il établit
  rationale: Le verbe instaure ici une pratique appelée à se répéter durablement; « établit » exprime naturellement cette portée institutionnelle.
- source_word: κατʼ ἐνιαυτὸν τοῦ ἄγειν τὴν ἡμέραν ταύτην
  choice: que, chaque année, on célébrerait ce jour
  rationale: La tournure française rend à la fois la répétition annuelle et le sens festif de ἄγειν avec ἡμέραν, sans alourdir la phrase.
- source_word: προσωχύρωσεν
  choice: fortifia
  rationale: Le composé désigne le renforcement des défenses; « fortifia » est précis et naturel dans ce contexte militaire.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: la colline du sanctuaire
  rationale: Cette traduction reste proche des termes grecs tout en évitant d’introduire dans le texte principal l’appellation technique ultérieure « mont du Temple ».
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: à côté de la citadelle
  rationale: παρά avec l’accusatif indique ici la proximité. ἄκρα peut être compris comme un nom commun, tandis que son possible emploi comme nom propre est signalé en note.
- source_word: ᾤκει
  choice: il y habita
  rationale: L’imparfait grec décrit une résidence continue; « habita » convient au registre narratif français et le pronom « y » reprend clairement le lieu.
- source_word: οἱ παρʼ αὐτοῦ
  choice: ceux qui l’accompagnaient
  rationale: Cette expression conserve l’indétermination du groupe proche de Simon sans préciser indûment s’il s’agit de sa maison, de ses compagnons ou de sa suite.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase est légèrement restructurée pour exprimer naturellement l’institution d’une commémoration annuelle. Le terme « sanctuaire » conserve la portée de ἱερόν, et la note maintient l’ambiguïté historique de ἄκρα.
