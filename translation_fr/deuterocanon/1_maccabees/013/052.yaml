    rationale: « il y habita avec ceux qui l’accompagnaient » transforme l’imparfait grec ᾤκει en événement ponctuel au passé simple et absorbe αὐτός. « Lui-même et ceux qui étaient avec lui y vivaient » conserve mieux la résidence durable et la coordination explicite.
  - severity: low
    issue: Nuance spatiale de παρά
    rationale: « À côté de » peut évoquer une contiguïté plus étroite que le grec, qui indique ici la proximité. « Près de » est plus souple et reste conforme à l’ambiguïté signalée par la note.
