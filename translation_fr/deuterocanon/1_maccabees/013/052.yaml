  verdict: revise
  source_fidelity: La commémoration annuelle, la fortification et la localisation près de l’Akra sont correctement rendues. Toutefois, l’imparfait ᾤκει décrit la résidence en cours, et αὐτός (« lui-même ») est explicitement coordonné avec « ceux qui étaient avec lui » ; la formulation révisée les restitue plus directement.
  naturalness: Le français demeure moderne et fluide. « Près de » exprime une proximité sans imposer l’adjacence stricte que pourrait suggérer « à côté de ».
  terminology: « Sanctuaire », « fortifia » et « citadelle » conviennent. La note préserve utilement la possibilité que ἄκρα soit le nom de la forteresse séleucide, l’Akra.
