revisions:
- from: Il en fit des ouvrages[a], en les entourant de hautes colonnes. Sur les colonnes, il plaça des armures comme souvenir perpétuel et, à côté des armures, des navires gravés, afin qu’ils soient vus par tous ceux qui naviguent sur la mer.
  to: Il les aménagea comme des ouvrages élaborés[a], en les entourant de grandes colonnes. Sur les colonnes, il plaça des armures comme souvenir perpétuel et, à côté des armures, des navires gravés, afin que tous ceux qui naviguent sur la mer puissent les voir.
  rationale: La révision clarifie la reprise de ταύτας, rend μεγάλους sans le limiter à la hauteur, et évite de restreindre inutilement l’objet de θεωρεῖσθαι. Elle conserve le caractère monumental et la relative indétermination de μηχανήματα.
