  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: fr
  text: Il les aménagea comme des ouvrages élaborés[a], en les entourant de grandes colonnes. Sur les colonnes, il plaça des armures comme souvenir perpétuel et, à côté des armures, des navires gravés, afin que tous ceux qui naviguent sur la mer puissent les voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec art » ; le grec peut désigner des ouvrages conçus avec ingéniosité ou élaborés.'
    reason: μηχανήματα est polysémique dans ce contexte monumental ; la note préserve l’alternative sans lui attribuer le sens moderne étroit de « machines ».
lexical_decisions:
- source_word: μηχανήματα
  choice: ouvrages
  rationale: Le terme désigne ici des réalisations construites ou élaborées; « ouvrages » convient au contexte monumental sans imposer le sens moderne de « machines ».
- source_word: στύλους μεγάλους
  choice: hautes colonnes
  rationale: Dans ce contexte architectural, στῦλος désigne une colonne; μεγάλους exprime leur caractère imposant, rendu naturellement par « hautes ».
- source_word: πανοπλίας
  choice: armures
  rationale: πανοπλία désigne l’équipement militaire complet; « armures » est clair et naturel dans cette description monumentale.
- source_word: εἰς ὄνομα αἰώνιον
  choice: comme souvenir perpétuel
  rationale: L’expression signifie littéralement « pour un nom éternel » et indique ici une commémoration durable; la formulation française rend cette fonction dans le contexte funéraire.
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: navires gravés
  rationale: ἐγγεγλυμμένα décrit des navires incisés ou sculptés dans le monument; « gravés » conserve cette idée sans préciser indûment le degré de relief.
