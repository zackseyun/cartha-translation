    issue: Référent et construction de « Il en fit des ouvrages »
    rationale: 'La formule française est ambiguë et peu idiomatique dans ce contexte : elle ne reprend pas clairement ταύτας (« ces [constructions] »). Une reprise par « Il les aménagea... » conserve le référent contextuel et la relation prédicative avec μηχανήματα.'
  - severity: low
    issue: « hautes colonnes » pour στύλους μεγάλους
    rationale: μεγάλους signifie « grands/importants » et ne porte pas exclusivement sur la hauteur. « grandes colonnes » évite cette restriction interprétative.
  - severity: low
    issue: Antécédent de « ils » dans la finale
    rationale: « ils » peut faire croire que seuls les navires représentés sont vus. « les voir » laisse plus naturellement ouverte la portée de l’observation des éléments sculptés/du monument, conformément à l’infinitif passif grec.
