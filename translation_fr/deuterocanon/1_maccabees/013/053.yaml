  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: fr
  text: Simon vit que Jean, son fils, était un homme, et il l’établit à la tête de toutes les forces. Jean habitait à Gazara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara est la forme grecque du nom du lieu plus couramment appelé Guézer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: un homme
  rationale: La formulation conserve le sens premier du grec, qui peut indiquer que Jean avait atteint l’âge adulte ou qu’il avait fait preuve des capacités d’un homme, sans trancher entre ces nuances.
- source_word: ἔθετο
  choice: il l’établit
  rationale: Dans ce contexte de nomination à une fonction, « établit » exprime naturellement l’acte de placer Jean en position d’autorité.
- source_word: ἡγούμενον τῶν δυνάμεων πάσων
  choice: à la tête de toutes les forces
  rationale: Cette tournure française idiomatique rend l’autorité militaire exprimée par le participe et son complément, tout en évitant d’ajouter un titre absent du grec.
- source_word: ᾤκει
  choice: il habitait
  rationale: L’imparfait grec décrit une résidence continue. Le pronom français préserve l’ambiguïté formelle quant à son antécédent, même si Jean est probablement visé dans le contexte.
- source_word: ἐν Γαζάροις
  choice: à Gazara
  rationale: Le nom propre suit la forme grecque du lieu; la forme plus couramment connue en français est indiquée en note.
