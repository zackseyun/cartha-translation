  yaml_path: translation/deuterocanon/1_maccabees/013/033.yaml
  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: fr
  text: Simon bâtit la place forte de Judée et l’entoura de hautes tours, de grandes murailles, de tours[a], de portes et de barres ; puis il entreposa des vivres[b] dans les places fortes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec mentionne les « tours » deux fois dans cette énumération ; la répétition est conservée.
    reason: textual_fidelity
  - marker: b
    text: 'Littéralement : « des aliments ». Dans ce contexte militaire, il s’agit de réserves de nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: bâtit
  rationale: Le verbe signifie fondamentalement « bâtir, construire ». « Bâtit » conserve cette valeur sans préciser indûment qu’il ne s’agissait que de renforcer un ouvrage déjà existant.
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: la place forte de Judée
  rationale: ὀχύρωμα désigne un ouvrage ou un lieu fortifié. « Place forte » est naturel dans ce contexte militaire et le singulier du grec est conservé.
- source_word: περιετείχισεν
  choice: l’entoura
  rationale: Le verbe évoque l’action d’entourer d’une enceinte ou de fortifications ; la liste qui suit en précise les éléments.
- source_word: πύργοις ὑψηλοῖς
  choice: de hautes tours
  rationale: Traduction directe qui conserve l’image architecturale et militaire.
- source_word: τείχεσιν μεγάλοις
  choice: de grandes murailles
  rationale: τεῖχος désigne ici une muraille défensive ; « grandes » rend sobrement μεγάλοις.
- source_word: πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: de tours, de portes et de barres
  rationale: La seconde occurrence de πύργοις est maintenue telle qu’elle figure dans le grec. Les μοχλοί sont les barres servant à bloquer les portes.
- source_word: ἔθετο βρώματα
  choice: il entreposa des vivres
  rationale: βρώματα signifie littéralement des aliments ; dans des places fortes, « vivres » exprime naturellement des réserves alimentaires.
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: dans les places fortes
  rationale: Le pluriel final est conservé malgré le singulier employé au début du verset, afin de ne pas effacer la variation du texte grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement grec tout en évitant une accumulation pesante de « et ». Le point-virgule distingue naturellement les travaux de fortification de l’entreposage des vivres.
