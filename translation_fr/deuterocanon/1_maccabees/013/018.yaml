translation:
  language: fr
  text: 'en disant : « C’est parce que je ne lui ai pas envoyé l’argent et les enfants[a] qu’il a péri[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes serviteurs ». Le terme grec peut désigner des enfants, des jeunes gens ou de jeunes serviteurs.
    reason: lexical_alternative
  - marker: b
    text: Ou « il a été perdu » ou « il a été détruit ». Le grec emploie un terme général exprimant la perte ou la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit les paroles rapportées et conserve le lien syntaxique avec le contexte précédent.
- source_word: Ὅτι
  choice: C’est parce que… que
  rationale: Cette tournure française naturelle exprime clairement la valeur causale de ὅτι sans transformer l’énoncé en simple discours indirect.
- source_word: οὐκ ἀπέστειλα
  choice: je ne lui ai pas envoyé
  rationale: Le passé composé rend naturellement l’aoriste dans ce propos rapporté et maintient la première personne.
- source_word: τὸ ἀργύριον
  choice: l’argent
  rationale: Bien que le terme désigne littéralement l’argent-métal, il s’agit ici d’une somme remise comme paiement ; « l’argent » est donc précis et naturel en français.
- source_word: τὰ παιδάρια
  choice: les enfants
  rationale: Le diminutif peut désigner des enfants, des jeunes gens ou de jeunes serviteurs. Dans le contexte immédiat, il s’agit d’enfants envoyés comme otages ; « les enfants » conserve le sens le plus direct sans préciser leur identité.
- source_word: ἀπώλετο
  choice: il a péri
  rationale: Cette forme exprime la perte ou la destruction subie. « Il a péri » rend directement le sens dans ce contexte où la vie de Jonathan est en jeu.
