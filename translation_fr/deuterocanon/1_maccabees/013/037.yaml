  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: fr
  text: Et aux anciens ainsi qu’à la nation des Juifs, salut ! Nous avons reçu la couronne d’or et le rameau de palmier[a] que vous avez envoyé. Nous sommes prêts à conclure avec vous une grande paix et à écrire aux fonctionnaires responsables afin qu’ils vous accordent des remises[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la palme » ou « la branche de palmier » ; le terme grec désigne un rameau de palmier employé dans un cadre cérémoniel ou honorifique.
    reason: lexical_alternative
  - marker: b
    text: Ces « remises » sont probablement des exemptions fiscales ou administratives, mais le grec n’en précise pas ici la nature exacte.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Dans cette adresse diplomatique, le terme désigne les dirigeants reconnus de la communauté, et non simplement des hommes âgés.
- source_word: ἔθνει Ἰουδαίων
  choice: nation des Juifs
  rationale: Cette formulation conserve le sens collectif et le ton politique officiel de l’expression grecque.
- source_word: χαίρειν
  choice: salut !
  rationale: Il s’agit de la formule épistolaire grecque habituelle ; « salut » en donne un équivalent français naturel et digne.
- source_word: στέφανον τὸν χρυσοῦν
  choice: couronne d’or
  rationale: Rendu direct et idiomatique du présent diplomatique mentionné.
- source_word: βαΐν
  choice: rameau de palmier
  rationale: Le mot désigne un rameau ou une branche de palmier, probablement employé ici comme présent cérémoniel ou honorifique.
- source_word: κεκομίσμεθα
  choice: nous avons reçu
  rationale: Le parfait exprime la réception accomplie des objets envoyés.
- source_word: ἕτοιμοί ἐσμεν
  choice: nous sommes prêts
  rationale: Formulation française claire qui traduit directement l’état de disponibilité exprimé.
- source_word: ποιεῖν ὑμῖν εἰρήνην μεγάλην
  choice: conclure avec vous une grande paix
  rationale: « Conclure » convient au contexte diplomatique, tandis que « une grande paix » conserve l’intensification inhabituelle du grec sans la réduire à une simple formule de paix.
- source_word: τοῖς ἐπὶ τῶν χρειῶν
  choice: fonctionnaires responsables
  rationale: L’expression désigne les agents chargés des affaires administratives sans préciser leur titre exact.
- source_word: ἀφεῖναι ὑμῖν ἀφέματα
  choice: qu’ils vous accordent des remises
  rationale: Le groupe cognat évoque des dispenses ou remises, vraisemblablement fiscales ou administratives, mais le grec n’en précise pas ici la nature.
