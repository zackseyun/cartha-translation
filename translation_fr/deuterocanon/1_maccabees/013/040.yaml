  yaml_path: translation/deuterocanon/1_maccabees/013/040.yaml
  text: And if any of you are fit to be enrolled among our people[a], let them be enrolled, and let there be peace between us.
translation:
  language: fr
  text: Et si certains d’entre vous sont aptes à être inscrits parmi les nôtres[a], qu’ils soient inscrits, et qu’il y ait la paix entre nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi ceux qui sont autour de nous » ; l’expression désigne probablement l’intégration au groupe ou à la communauté du locuteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: aptes
  rationale: L’adjectif exprime ici l’aptitude ou l’admissibilité dans un contexte d’inscription administrative, sans préciser davantage le statut juridique.
- source_word: γράφηναι
  choice: être inscrits
  rationale: Le verbe a ici le sens d’une inscription officielle, confirmé par l’impératif ἐγγραφέσθωσαν qui suit.
- source_word: τοὺς περὶ ἡμᾶς
  choice: parmi les nôtres
  rationale: Littéralement « parmi ceux qui sont autour de nous » ; dans ce contexte politique, l’expression désigne vraisemblablement le groupe, le parti ou la communauté du locuteur. « Les nôtres » reste naturel tout en évitant de préciser à tort « peuple ».
- source_word: ἐγγραφέσθωσαν
  choice: qu’ils le soient
  rationale: La reprise pronominale évite une répétition pesante tout en maintenant clairement l’idée d’inscription administrative.
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: qu’il y ait la paix entre nous
  rationale: Cette formulation française naturelle conserve la portée réciproque de la formule politique de paix.
