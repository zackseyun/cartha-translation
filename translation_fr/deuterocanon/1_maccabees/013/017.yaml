    reason: alternative_reading
  revision_rationale: La révision conserve les choix lexicaux solides du projet tout en évitant de trancher dans le texte français la portée de πρὸς τὸν λαόν. Le remplacement de « ils lui parlaient avec tromperie » par « ils cherchaient à le tromper » améliore la fluidité sans atténuer la ruse délibérée du grec.
