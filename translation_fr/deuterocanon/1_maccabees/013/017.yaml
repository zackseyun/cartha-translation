  text: And Simon recognized that they were speaking deceitfully to him[a], yet he sent the money and the boys[b], lest he stir up great hostility against the people.
translation:
  language: fr
  text: Simon comprit qu’ils cherchaient à le tromper. Pourtant, il envoya l’argent et les jeunes garçons, de peur de susciter une grande hostilité au sein du peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre le peuple » ou « avec le peuple ». La construction grecque πρὸς τὸν λαόν peut exprimer diversement la relation entre l’hostilité et le peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: comprit
  rationale: L’aoriste indique ici que Simon discerne leur intention. « Comprit » est naturel en français et exprime cette prise de conscience.
- source_word: δόλῳ
  choice: avec tromperie
  rationale: Le datif exprime la manière ou le moyen. « Avec tromperie » conserve explicitement la notion de ruse délibérée.
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: ils lui parlaient
  rationale: L’imparfait français rend naturellement le présent grec dans le discours indirect et l’action en cours dirigée vers Simon.
- source_word: πέμπει
  choice: il envoya
  rationale: Le présent historique grec est rendu par le passé simple, temps narratif naturel dans ce registre français.
- source_word: τὸ ἀργύριον
  choice: l’argent
  rationale: 'En français, « argent » conserve heureusement les deux valeurs possibles du grec : le métal et la somme monétaire.'
- source_word: τὰ παιδάρια
  choice: les jeunes garçons
  rationale: παιδάρια désigne des garçons ou de jeunes enfants de sexe masculin. « Jeunes garçons » évite l’ambiguïté française de « enfants » tout en gardant l’idée de jeunesse.
- source_word: μή ποτε
  choice: de peur de
  rationale: La locution introduit un résultat redouté ou un motif préventif. « De peur de » est idiomatique et digne.
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: susciter une grande hostilité
  rationale: Cette formulation rend l’image idiomatique consistant à « lever » l’hostilité sans imposer si Simon la provoquerait chez autrui ou l’assumerait lui-même.
- source_word: πρὸς τὸν λαόν
  choice: contre le peuple
  rationale: Avec ἔχθραν, πρός marque naturellement l’orientation relationnelle de l’hostilité. « Contre » suit cette direction, tout en signalant en note la souplesse réelle de la construction.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase grecque se termine par une virgule, mais le verset forme une unité intelligible. Le contraste implicite entre la lucidité de Simon et son envoi est rendu par « Pourtant ». Le marqueur [a] figure dans le texte principal.
