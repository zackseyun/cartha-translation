- from: Simon comprit qu’ils lui parlaient avec tromperie. Pourtant, il envoya l’argent et les jeunes garçons, de peur de susciter une grande hostilité contre le peuple.[a]
  to: Simon comprit qu’ils cherchaient à le tromper. Pourtant, il envoya l’argent et les jeunes garçons, de peur de susciter une grande hostilité au sein du peuple.[a]
  rationale: La révision conserve les choix lexicaux solides du projet tout en évitant de trancher dans le texte français la portée de πρὸς τὸν λαόν. Le remplacement de « ils lui parlaient avec tromperie » par « ils cherchaient à le tromper » améliore la fluidité sans atténuer la ruse délibérée du grec.
