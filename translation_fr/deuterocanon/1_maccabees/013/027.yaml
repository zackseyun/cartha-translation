  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: fr
  text: Simon construisit un monument au-dessus du tombeau de son père et de ses frères, et il l’éleva bien haut pour qu’il soit visible[a], en pierres de taille[b], à l’arrière comme à l’avant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « imposant par son aspect » ; l’expression grecque peut décrire l’apparence remarquable du monument plutôt que le but de son élévation.
    reason: lexical_alternative
  - marker: b
    text: Ou « en pierres polies ». Le mot grec désigne une pierre raclée, lissée ou autrement travaillée avec soin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: construisit
  rationale: L’aoriste de οἰκοδομέω désigne simplement l’action de bâtir; « construisit » convient naturellement à un monument funéraire.
- source_word: ἐπὶ τὸν τάφον
  choice: au-dessus du tombeau
  rationale: ἐπί avec l’accusatif exprime ici une construction élevée sur le lieu de sépulture; « au-dessus du tombeau » conserve cette relation spatiale.
- source_word: ὕψωσεν αὐτόν
  choice: il l’éleva bien haut
  rationale: ὑψόω signifie rendre haut ou élever. La formulation française exprime clairement la hauteur physique du monument.
- source_word: τῇ ὁράσει
  choice: pour qu’il soit visible
  rationale: Le datif renvoie à la vue ou à l’apparence. Dans ce contexte, il indique vraisemblablement que l’élévation rendait le monument bien visible, tout en laissant en note l’autre possibilité.
- source_word: λίθῳ ξυστῷ
  choice: en pierres de taille
  rationale: ξυστός qualifie une pierre raclée, lissée ou soigneusement travaillée. « Pierre de taille » est le terme architectural français naturel sans imposer l’idée d’un poli brillant.
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: à l’arrière comme à l’avant
  rationale: La paire d’expressions désigne les deux côtés, arrière et avant, du monument; cette tournure est claire et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Monument » explicite l’objet masculin repris par αὐτόν et convient à la construction funéraire édifiée au-dessus du tombeau. Les ambiguïtés de τῇ ὁράσει et de ξυστός sont conservées en notes.
