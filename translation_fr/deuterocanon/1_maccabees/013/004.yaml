  text: For this reason all my brothers were destroyed for the sake of Israel, and I alone was left.
translation:
  language: fr
  text: C’est pour cela que tous mes frères ont péri pour Israël, et je suis resté seul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπώλοντο
  choice: ont été mis à mort
  rationale: Dans ce contexte, le verbe évoque la mort violente des frères de Simon. Cette formulation française conserve le sens résultatif et la responsabilité extérieure suggérée par l’anglais audité, sans recourir au peu naturel « ont été détruits » pour des personnes.
- source_word: χάριν τοῦ Ἰσραήλ
  choice: pour Israël
  rationale: « Pour Israël » exprime naturellement la cause défendue ou le bénéficiaire de leur sacrifice, tout en évitant la lourdeur de « à cause d’Israël », qui pourrait suggérer qu’Israël est coupable de leur mort.
- source_word: κατελείφθην ἐγὼ μόνος
  choice: je suis resté seul
  rationale: Rend idiomatiquement le passif grec et souligne, par « seul », que Simon est l’unique frère survivant.
