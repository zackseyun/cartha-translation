  text: And he gathered all the fighting men, and hastened to finish the walls of Jerusalem, and fortified it all around.
translation:
  language: fr
  text: Il rassembla tous les hommes de guerre, se hâta d’achever les murailles de Jérusalem et la fortifia de tous côtés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: rassembla
  rationale: L’aoriste de συνάγω désigne ici le rassemblement d’hommes en vue d’une action militaire. « Rassembla » est direct, naturel et fidèle.
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: tous les hommes de guerre
  rationale: La formulation conserve la désignation explicitement masculine de ἄνδρας et la fonction militaire exprimée par πολεμιστάς. « Hommes de guerre » demeure clair et digne en français biblique moderne.
- source_word: ἐτάχυνεν τοῦ τελέσαι
  choice: se hâta d’achever
  rationale: Cette tournure rend à la fois l’empressement exprimé par ἐτάχυνεν et l’idée de mener à son terme exprimée par τελέσαι.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: les murailles de Jérusalem
  rationale: « Murailles » désigne avec précision les ouvrages défensifs entourant une ville et rend naturellement le génitif grec.
- source_word: ὠχύρωσεν αὐτὴν κυκλόθεν
  choice: la fortifia de tous côtés
  rationale: Le pronom féminin « la » reprend naturellement Jérusalem. « Fortifia » conserve la valeur militaire du verbe, tandis que « de tous côtés » exprime l’étendue circulaire indiquée par κυκλόθεν.
theological_decisions:
- issue: Désignation militaire genrée
  choice: tous les hommes de guerre
  alternative: tous les combattants
  rationale: Le grec emploie explicitement ἄνδρας, « hommes », avec πολεμιστάς. La traduction maintient cette précision au lieu de la neutraliser.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsme marqué. La phrase conserve la progression concise du grec : rassemblement des combattants, achèvement des murailles, fortification générale de la ville.'
