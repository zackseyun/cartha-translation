  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: fr
  text: Après cela, Tryphon vint pour entrer dans la ville et la détruire ; il cerna la route qui mène à Adora[a]. Simon et son camp marchaient en face de lui, dans tous les lieux où il allait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « il encercla la route qui mène à Adora ». Cela peut décrire une manœuvre militaire visant à couper ou à bloquer l’accès, sans préciser exactement comment.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi suggérer que les forces de Simon marchaient parallèlement à celles de Tryphon ou se déplaçaient en opposition à elles, en adaptant leurs mouvements aux siens.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français, fidèle à la succession indiquée par le grec.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: pour entrer dans la ville
  rationale: L’infinitif articulé exprime ici le but ; « entrer » reste proche du grec sans ajouter explicitement l’idée d’invasion.
- source_word: ἐκτρῖψαι αὐτήν
  choice: la détruire
  rationale: Dans ce contexte militaire, le verbe désigne la destruction complète ; « détruire » restitue sa force dans un registre digne et courant.
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: Il contourna par la route qui mène à Adora
  rationale: La construction grecque est difficile ; cette traduction conserve l’idée d’un mouvement circulaire lié à la route d’Adora sans imposer l’interprétation plus précise « bloqua ».
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son armée
  rationale: παρεμβολή peut désigner le camp ou les troupes qui y sont rassemblées ; dans une action de déplacement, « armée » est naturel et contextuellement clair.
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: se déplaçaient en face de lui
  rationale: Le verbe exprime un mouvement correspondant, parallèle ou opposé à celui de Tryphon ; la formulation préserve cette ambiguïté tactique.
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: partout où il allait
  rationale: Expression française naturelle qui rend la répétition du mouvement de lieu en lieu.
