lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Rend directement le verbe narratif courant « envoyer » ; avec « une réponse », le contexte épistolaire est naturel en français.
- source_word: Δημήτριος ὁ βασιλεύς
  choice: le roi Démétrios
  rationale: L’antéposition du titre est idiomatique en français moderne et conserve pleinement le référent.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: conforme à ces paroles
  rationale: Préserve la valeur de conformité de κατά et le caractère quelque peu formel de λόγοι, sans imposer que la formule introduise déjà le contenu exact de la lettre.
- source_word: ἀπεκρίθη αὐτῷ
  choice: lui envoya une réponse
  rationale: Le sens de « répondre » est conservé, tandis que l’expression française rend explicite le cadre de la correspondance indiqué par les verbes voisins.
- source_word: ἔγραψεν αὐτῷ ἐπιστολήν
  choice: lui écrivit une lettre
  rationale: Rendu direct, naturel et complet de la construction grecque.
- source_word: τοιαύτην
  choice: ainsi rédigée
  rationale: Formule française idiomatique annonçant immédiatement le texte de la lettre, tout en exprimant l’idée de « telle que voici ».
