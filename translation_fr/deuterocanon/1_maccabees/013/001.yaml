  yaml_path: translation/deuterocanon/1_maccabees/013/001.yaml
  text: And Simon heard that Tryphon was gathering a large force to come into the land of Judah and destroy it[a].
translation:
  language: fr
  text: Simon apprit que Tryphon rassemblait une armée nombreuse pour venir au pays de Juda et le détruire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays de Judée ». Le grec porte littéralement « le pays de Juda », expression qui peut désigner le territoire historiquement associé à Juda plutôt que recourir à une terminologie administrative plus tardive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce contexte, ἀκούω introduit une information parvenue à Simon. « Apprit » est naturel en français et n’ajoute pas de précision sur la manière dont il fut informé.
- source_word: συνῆγεν
  choice: rassemblait
  rationale: L’imparfait grec présente l’action comme en cours. L’imparfait français « rassemblait » en conserve l’aspect.
- source_word: δύναμιν πολλὴν
  choice: une armée nombreuse
  rationale: Dans ce contexte militaire, δύναμις désigne des forces armées. « Une armée nombreuse » est clair et idiomatique, sans préciser davantage son organisation.
- source_word: τοῦ ἐλθεῖν
  choice: pour venir
  rationale: L’infinitif articulé exprime ici le but. « Pour venir » restitue simplement ce mouvement vers le pays de Juda.
- source_word: γῆν Ἰούδα
  choice: au pays de Juda
  rationale: Cette formulation suit de près le grec et conserve la désignation historique du territoire lié à Juda, sans lui substituer une terminologie administrative plus tardive.
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: et le détruire
  rationale: Le second infinitif articulé prolonge l’expression du but. ἐκτρίβω exprime une destruction complète; « détruire » rend clairement cette intention hostile, et le pronom reprend « pays ».
