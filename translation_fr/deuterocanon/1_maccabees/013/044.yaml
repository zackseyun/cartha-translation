  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
translation:
  language: fr
  text: Ceux qui étaient dans la tour de siège sortirent de celle-ci et entrèrent dans la ville, et une grande agitation[a] se produisit dans la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand trouble » ou « un grand tumulte » ; le grec κίνημα peut désigner de manière générale une agitation ou des troubles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήλοντο
  choice: débouchèrent
  rationale: Le verbe exprime ici un mouvement hors de la tour et vers l’intérieur de la ville. « Débouchèrent dans » rend naturellement ce déplacement sans lui attribuer de motif.
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: ceux qui étaient dans la tour de siège
  rationale: ἑλέπολις désigne un engin de siège, en particulier une tour de siège. Cette formulation est claire pour le lecteur moderne et convient au contexte militaire.
- source_word: εἰς τὴν πόλιν
  choice: dans la ville
  rationale: La préposition εἰς marque le mouvement vers l’intérieur, et πόλις désigne ici la ville ou place forte.
- source_word: κίνημα μέγα
  choice: une grande agitation
  rationale: κίνημα peut évoquer un mouvement collectif, une agitation ou un trouble. « Grande agitation » conserve l’étendue du sens sans préciser indûment une émeute ou une révolte.
- source_word: ἐγένετο
  choice: se produisit
  rationale: Dans cette tournure narrative, γίνομαι signale la survenue d’un état ou d’un événement. « Se produisit » est naturel et garde la dynamique du grec.
