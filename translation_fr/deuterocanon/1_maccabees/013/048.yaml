base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: fr
  text: Il en expulsa toute impureté[a], y installa des hommes qui observent la Loi, la fortifia[b] et s’y construisit une résidence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute souillure ». Le grec peut désigner une impureté au sens large, notamment rituelle ou morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « la renforça encore » ; le verbe composé peut suggérer un renforcement supplémentaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: expulsa
  rationale: Le verbe exprime une éviction énergique; « expulsa » est naturel en français et convient au contexte de la prise d’une place forte.
- source_word: πᾶσαν ἀκαθαρσίαν
  choice: tout ce qui était impur
  rationale: Cette formulation française garde la portée large du grec, qui peut viser une souillure rituelle, morale ou cultuelle, sans en préciser indûment la nature.
- source_word: κατῴκισεν
  choice: y installa
  rationale: Le causatif indique qu’il établit des habitants dans le lieu; « installa » restitue clairement cette action.
- source_word: ἄνδρας
  choice: des hommes
  rationale: Le substantif grec est explicitement masculin et le contexte n’impose pas de le neutraliser.
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: qui mettaient la Loi en pratique
  rationale: L’expression désigne l’observance concrète et habituelle de la Loi; l’imparfait s’accorde naturellement à la perspective narrative passée.
- source_word: προσοχύρωσεν
  choice: la fortifia
  rationale: Le verbe signifie fortifier ou renforcer. Le simple « fortifia » est exact; une nuance d’accroissement éventuelle est signalée en note plutôt qu’imposée au texte.
- source_word: ᾠκοδόμησεν ἑαυτῷ ἐν αὐτῇ οἴκησιν
  choice: s’y construisit une résidence
  rationale: La tournure rend le bénéfice personnel, la localisation et l’idée d’un lieu d’habitation dans un français fluide.
theological_decisions:
- issue: Portée de ἀκαθαρσία dans un contexte de purification
  choice: tout ce qui était impur
  alternative: toute impureté; toute souillure
  rationale: Le grec ne permet pas de déterminer si l’impureté est principalement rituelle, morale ou cultuelle; la traduction conserve cette indétermination.
- issue: Rendu genré de ἄνδρας
  choice: des hommes
  alternative: des gens
  rationale: Le terme source est masculin et rien dans le contexte n’exige une formulation épicène.
translation_notes:
  register: Français international moderne, narratif et digne. « La Loi » porte la majuscule pour désigner la Loi juive. Les pronoms féminins renvoient naturellement à la ville ou à la place évoquée dans le contexte.
