  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: fr
  text: Simon conclut un accord avec eux et ne leur fit pas la guerre[a]. Il les chassa de la ville et purifia les maisons où se trouvaient les idoles[b]. Puis il y entra, tout en chantant des hymnes et en bénissant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parvint à un arrangement avec eux ». Le participe grec évoque probablement une entente qui permet d’éviter le combat.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de maisons où se trouvaient des images cultuelles idolâtres ; leur purification avait donc vraisemblablement une portée religieuse autant que matérielle.
    reason: cultural_note
  - marker: c
    text: Littéralement « en bénissant » ; le grec ne précise pas qui ou ce qui est béni. Dans ce contexte, Dieu est une possibilité vraisemblable.
    reason: textual_ambiguity
lexical_decisions:
- source_word: συνευδὼν
  choice: conclut un accord avec
  rationale: Dans ce contexte, le participe indique vraisemblablement que Simon parvient à un arrangement avec les occupants. Cette formulation conserve l’idée d’un accord pratique sans retenir le sens affectif possible de « se complaire avec ».
- source_word: ἐπολέμησεν
  choice: fit la guerre à
  rationale: Le verbe désigne un conflit armé. « Ne leur fit pas la guerre » est idiomatique et garde la portée militaire du grec.
- source_word: ἐξέβαλεν
  choice: chassa
  rationale: Le verbe exprime une expulsion énergique. « Chassa » convient au contexte politico-militaire et évite la connotation technique d’un terme administratif.
- source_word: ἐκαθάρισεν
  choice: purifia
  rationale: La présence d’idoles donne à l’action une dimension religieuse, et non seulement matérielle. « Purifia » rend cette dimension sans préciser un rite absent du texte.
- source_word: τὰ εἴδωλα
  choice: les idoles
  rationale: Il s’agit d’images cultuelles considérées comme idolâtres; « idoles » exprime naturellement leur portée religieuse.
- source_word: ὑμνῶν
  choice: en chantant des hymnes
  rationale: Le participe décrit la manière dont Simon entre dans la ville. Le verbe « chantant » explicite naturellement en français l’exécution des hymnes.
- source_word: εὐλογῶν
  choice: en bénissant Dieu
  rationale: Le participe signifie « bénissant ». En contexte de célébration religieuse, Dieu est le complément implicite le plus vraisemblable; il est explicité dans le texte, avec une note signalant que le grec ne nomme pas l’objet.
theological_decisions:
- issue: Portée cultuelle de la purification des maisons contenant des idoles
  choice: « purifia » plutôt que « nettoya »
  alternative: « nettoya » ou « assainit »
  rationale: Le lien explicite avec les idoles indique une élimination de souillure religieuse. « Purifia » préserve cette dimension sans importer de procédure rituelle particulière.
- issue: Objet implicite du participe εὐλογῶν
  choice: « en bénissant Dieu » avec note
  alternative: « en prononçant des bénédictions »
  rationale: Dans une entrée célébrée par des hymnes, bénir Dieu est le sens contextuel le plus naturel. Puisque le grec ne précise toutefois aucun complément, la note conserve cette ambiguïté formelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans archaïsmes. La syntaxe reste claire pour un lectorat général, tandis que les notes préservent l’ambiguïté de συνευδὼν et l’objet non exprimé de εὐλογῶν.
