  text: But when he came near to Baskama, he killed Jonathan, and he was buried there.
translation:
  language: fr
  text: Mais lorsqu’il approcha de Baskama, il tua Jonathan, qui fut enterré là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mais lorsqu’il
  rationale: La tournure introduit l’événement suivant avec une légère nuance de transition ou de contraste. « Mais lorsqu’il » est naturel en français narratif sans renforcer excessivement l’opposition.
- source_word: ἤγγισεν τῆς Βασκαμά
  choice: approcha de Baskama
  rationale: Le verbe ἐγγίζω exprime ici le fait de s’approcher d’un lieu. « Approcha de » restitue directement le mouvement vers Baskama.
- source_word: Βασκαμά
  choice: Baskama
  rationale: Le nom de lieu est translittéré conformément à la forme grecque.
- source_word: ἀπέκτεινεν
  choice: tua
  rationale: Le verbe signifie directement « tuer » ou « mettre à mort ». « Tua » est précis, courant et n’ajoute pas l’idée d’une exécution officielle.
- source_word: τὸν Ἰωναθάν
  choice: Jonathan
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: ἐτάφη
  choice: fut enterré
  rationale: L’aoriste passif de θάπτω signifie simplement « fut enterré ». Cette formulation reste sobre et fidèle.
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe désigne le lieu mentionné et se rend naturellement par « là ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La proposition relative « qui fut enterré là » lève seulement l’ambiguïté grammaticale que créerait en français une succession de pronoms masculins, tout en conservant Jonathan comme référent naturel du passif grec.
