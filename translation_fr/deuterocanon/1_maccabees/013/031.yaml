  text: But Tryphon was acting deceitfully with Antiochus the younger king[a], and he killed him,
translation:
  language: fr
  text: Mais Tryphon allait avec Antiochos, le jeune roi[a], en usant de tromperie, et le tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Antiochos, le roi plus jeune ». Le terme grec est comparatif (« plus jeune ») et sert à distinguer ce roi d’un autre Antiochos.'
    reason: Précise la valeur comparative de νεωτέρου sans altérer le sens explicite de μετὰ (« avec »).
lexical_decisions:
- source_word: ἐπορεύετο
  choice: agissait
  rationale: Dans cette construction, l’imparfait décrit une conduite en cours plutôt qu’un simple déplacement; « agissait » est naturel en français et conserve l’aspect duratif.
- source_word: δόλῳ
  choice: avec perfidie
  rationale: Le datif exprime la manière ou le moyen. « Avec perfidie » rend la tromperie calculée sans imposer une nuance juridique.
- source_word: μετὰ Ἀντιόχου
  choice: envers Antiochos
  rationale: Bien que μετά suivi du génitif signifie normalement « avec », le français « agir avec perfidie avec quelqu’un » est maladroit et peut suggérer sa complicité. « Envers » rend ici naturellement la relation visée par la conduite perfide, tout en signalant en note la formulation littérale.
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: le jeune roi
  rationale: Dans ce contexte, νεώτερος désigne Antiochos encore jeune. « Le jeune roi » est plus idiomatique que « le roi plus jeune », sans perdre la fonction identificatrice de l’apposition.
- source_word: ἀπέκτεινεν
  choice: il le tua
  rationale: Traduction directe et neutre du verbe; « assassina » ajouterait une qualification morale ou juridique non exprimée lexicalement.
