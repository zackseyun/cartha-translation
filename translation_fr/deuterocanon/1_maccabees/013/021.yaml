  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
translation:
  language: fr
  text: Mais ceux de la citadelle ne cessaient d’envoyer des émissaires et le pressaient instamment de venir auprès d’eux par le désert et de leur envoyer des provisions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « de venir auprès de lui » ; le contexte suggère le sens collectif « auprès d’eux », en référence à ceux de la citadelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: Mais ceux de la citadelle
  rationale: Dans 1 Maccabées, ἄκρα désigne couramment la citadelle fortifiée de Jérusalem. « Ceux de la citadelle » rend naturellement l’appartenance ou la provenance exprimée par ἐκ.
- source_word: ἀπέστελλον πρεσβεύτας
  choice: ne cessaient d’envoyer des émissaires
  rationale: L’imparfait ἀπέστελλον exprime une action répétée ou prolongée. « Émissaires » convient à des représentants chargés d’une mission officielle.
- source_word: κατεσπούδαζον
  choice: le pressaient instamment
  rationale: Le verbe exprime une insistance vive et soutenue; l’imparfait est conservé par « pressaient ».
- source_word: αὐτὸν τοῦ ἐλθεῖν ... πρὸς αὐτόν
  choice: le pressaient ... de venir auprès d’eux
  rationale: Le premier αὐτόν est l’objet de l’insistance. Le second est singulier dans le grec imprimé, mais le contexte renvoie collectivement aux gens de la citadelle; cette anomalie est signalée en note plutôt que masquée.
- source_word: διὰ τῆς ἐρήμου
  choice: par le désert
  rationale: Avec διά, l’expression indique l’itinéraire emprunté. « Par le désert » est idiomatique, concis et ne précise pas davantage la nature du terrain.
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: de leur envoyer des provisions
  rationale: Dans ce contexte militaire, τροφάς désigne des vivres ou des ressources alimentaires; « provisions » restitue naturellement ce sens.
