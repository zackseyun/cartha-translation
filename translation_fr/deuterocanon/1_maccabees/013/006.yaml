base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: fr
  text: Mais moi, je vengerai mon peuple et le sanctuaire[a], ainsi que nos femmes[b] et nos enfants, car toutes les nations se sont rassemblées pour nous exterminer, par haine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses saintes » ou « les lieux saints ». Le grec emploie un adjectif substantivé au pluriel, forme qui peut aussi se comprendre « les saints ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nos épouses ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « à cause de l’hostilité » ; ou « par animosité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mais moi
  rationale: La particule marque ici une forte opposition avec ce qui précède. « Mais moi » restitue naturellement cette rupture et souligne l’engagement personnel du locuteur.
- source_word: ἐκδικήσω
  choice: je vengerai
  rationale: Le futur exprime l’action de défendre les victimes en infligeant une juste rétribution. « Je vengerai » conserve cette force sans alourdir la phrase.
- source_word: τοῦ ἔθνους μου
  choice: mon peuple
  rationale: Dans ce contexte, ἔθνος désigne la communauté nationale juive. En français biblique moderne, « mon peuple » est plus naturel que « ma nation » tout en gardant le sens collectif.
- source_word: τῶν ἁγίων
  choice: le sanctuaire
  rationale: Le pluriel substantivé désigne vraisemblablement ici les réalités ou lieux saints, en particulier le sanctuaire du Temple. Le singulier collectif fournit le référent contextuel le plus clair.
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: nos femmes et nos enfants
  rationale: γυναῖκες peut désigner les femmes ou les épouses. Le sens large convient à l’énumération de ceux que menace l’ennemi, tandis qu’une note conserve l’autre possibilité.
- source_word: συνήχθησαν
  choice: se sont rassemblées
  rationale: L’aoriste décrit le rassemblement hostile dont les effets sont présents. Le passé composé est naturel en français et conserve cette portée.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: L’expression désigne les nations environnantes. Cette traduction reste proche du grec sans imposer le terme théologiquement plus marqué « païens ».
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: pour nous exterminer
  rationale: Le verbe exprime l’anéantissement ou l’éradication. « Exterminer » rend avec précision la violence de l’intention hostile.
- source_word: ἔχθρας χάριν
  choice: par haine
  rationale: La construction indique le motif de l’action. « Par haine » est concise, idiomatique et conserve la force causale de l’expression.
theological_decisions:
- issue: Référent de τῶν ἁγίων
  choice: le sanctuaire
  alternative: les choses saintes, les lieux saints ou les saints
  rationale: Le contexte de 1 Maccabées, centré sur le Temple, favorise une référence au sanctuaire ou à ses réalités sacrées plutôt qu’à des personnes saintes. La note maintient toutefois l’ambiguïté grammaticale du pluriel grec.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme conserve la solennité d’un discours de guerre sans archaïsmes. Les notes signalent les ambiguïtés réelles de τῶν ἁγίων, γυναικῶν et ἔχθρας χάριν.
