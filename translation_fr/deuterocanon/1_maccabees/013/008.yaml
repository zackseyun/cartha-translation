  text: And they answered with a loud voice, saying, “You are our leader in place of Judas and Jonathan your brother.”
translation:
  language: fr
  text: 'Et ils répondirent d’une voix forte : « C’est toi qui es notre chef à la place de Judas et de ton frère Jonathan. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: L’aoriste narratif est rendu directement par le passé simple, qui convient au registre narratif digne du passage.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette tournure française naturelle conserve l’image concrète de la voix et exprime la manière.
- source_word: Σὺ εἶ
  choice: C’est toi qui seras
  rationale: La construction emphatique met Simon en relief. En contexte, le présent grec sert à reconnaître sa qualité de chef; le futur français formule naturellement l’acclamation et la fonction désormais assumée, sans en faire un titre officiel.
- source_word: ἡγούμενος
  choice: chef
  rationale: Le terme désigne celui qui conduit ou gouverne. « Chef » convient au contexte politico-militaire tout en évitant les précisions excessives de « gouverneur » ou « commandant ».
- source_word: ἀντὶ
  choice: à la place de
  rationale: Cette expression conserve l’idée de remplacement ou de succession sans expliciter davantage le mode de succession.
- source_word: Ἰούδου
  choice: Judas
  rationale: Forme française traditionnelle du nom dans le contexte des Maccabées.
- source_word: Ἰωνάθου
  choice: Jonathan
  rationale: Forme française courante du nom propre.
- source_word: τοῦ ἀδελφοῦ σου
  choice: ton frère
  rationale: L’apposition génitive identifie explicitement Jonathan comme le frère de Simon et doit être conservée.
theological_decisions:
- issue: Nature de la fonction de Simon exprimée par ἡγούμενος
  choice: chef
  alternative: dirigeant ; gouverneur ; commandant
  rationale: Le grec reconnaît à Simon une autorité de direction après Judas et Jonathan, mais ne définit pas cette autorité comme strictement royale, administrative ou militaire. « Chef » en préserve l’étendue sans importer une conception dynastique ou institutionnelle.
- issue: Valeur de Σὺ εἶ dans l’acclamation
  choice: C’est toi qui seras notre chef
  alternative: Tu es notre chef
  rationale: Le présent grec peut être traduit littéralement par « tu es ». Dans ce contexte de désignation, le futur est idiomatique en français et exprime la reconnaissance d’une fonction appelée à être exercée, sans résoudre plus précisément la question de son statut institutionnel.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le ton narratif biblique sans archaïsme marqué. La parole directe est concise et solennelle.
