  text: In the one hundred seventy-first year[a], the yoke of the nations was removed from Israel.
translation:
  language: fr
  text: En l’an cent soixante et onze, le joug des nations[a] fut ôté à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs ». Le mot grec peut désigner les nations en général ou, dans l’usage juif, les non-Juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: La cent soixante et onzième année
  rationale: Il s’agit d’une formule de datation. Cette tournure française, avec l’article défini, est naturelle et conserve la valeur ordinale du grec.
- source_word: ὁ ζυγὸς
  choice: le joug
  rationale: Le terme désigne littéralement un joug et, par métaphore, une domination oppressive. « Joug » préserve cette image forte sans l’expliciter excessivement.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: ἐθνῶν peut désigner les nations en général ou, dans l’usage juif, les non-Juifs. « Des nations » reste proche du grec et évite de trancher silencieusement cette nuance.
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: à Israël
  rationale: Avec « ôter », le français idiomatique emploie « ôter quelque chose à quelqu’un ». Cette formulation exprime bien la séparation marquée par ἀπό.
- source_word: ellipse verbale après ὁ ζυγὸς τῶν ἐθνῶν
  choice: fut ôté
  rationale: Le texte grec transmis présente une phrase nominale elliptique. Le verbe est suppléé en français pour obtenir une phrase intelligible, le sens de retrait étant indiqué par ἀπό.
theological_decisions:
- issue: Rendre τῶν ἐθνῶν par « des nations » ou par « des païens »
  choice: des nations
  alternative: des païens
  rationale: Le contexte évoque la fin d’une domination étrangère, mais le substantif grec garde une amplitude lexicale réelle. Le texte principal conserve donc « nations », tandis que la note signale le sens possible de « païens » dans l’usage juif.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore historique du « joug » est conservée. Le passé simple convient au registre narratif écrit du livre, et le verbe absent de la proposition grecque elliptique est suppléé pour la clarté.
