  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: fr
  text: 'Il les encouragea et leur dit : « Vous savez vous-mêmes tout ce que mes frères, la maison de mon père et moi avons fait pour les lois et les choses saintes[a] ; vous connaissez aussi les guerres et les détresses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire ». Le grec dit littéralement « les choses saintes » ; l’expression peut désigner plus largement le sanctuaire et d’autres réalités sacrées.
    reason: Alternative lexicale ; préservation de l’ambiguïté de τῶν ἁγίων.
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: encouragea
  rationale: Dans ce contexte où Simon affermit et mobilise le peuple, « encouragea » exprime naturellement l’idée de soutien et d’exhortation sans la restreindre à un appel formel.
- source_word: Αὐτοὶ οἴδατε
  choice: Vous savez vous-mêmes
  rationale: Le pronom explicite αὐτοὶ est emphatique ; « vous-mêmes » en conserve la force en français.
- source_word: οἶκος τοῦ πατρός μου
  choice: la maison de mon père
  rationale: Cette formulation conserve l’image familiale et dynastique de l’expression grecque, tout en restant intelligible en français biblique courant.
- source_word: περὶ τῶν νόμων καὶ τῶν ἁγίων
  choice: pour les lois et les réalités saintes
  rationale: « Pour » rend l’engagement en faveur de ces choses. Le pluriel « lois » est conservé, et « réalités saintes » laisse à τὰ ἅγια sa portée large sans le réduire nécessairement au sanctuaire.
- source_word: τοὺς πολέμους
  choice: les guerres
  rationale: Équivalent direct qui conserve le pluriel et la coordination elliptique du grec.
- source_word: τὰς στενοχωρίας
  choice: les détresses
  rationale: « Détresses » rend la pression, l’épreuve et l’affliction exprimées par στενοχωρία, sans ajouter un verbe absent du grec.
- source_word: ἐποιήσαμεν
  choice: avons fait
  rationale: La tournure simple « avons fait » préserve la largeur sémantique de ποιέω et convient au regard rétrospectif porté sur des actes connus des auditeurs.
theological_decisions:
- issue: Portée de τῶν ἁγίων
  choice: les réalités saintes
  alternative: le sanctuaire
  rationale: Le neutre pluriel substantivé peut désigner le sanctuaire, mais aussi plus largement les choses, institutions ou affaires sacrées. La traduction maintient cette ouverture au lieu de choisir une seule référence.
- issue: Relation syntaxique de « les guerres et les détresses »
  choice: conserver la coordination elliptique comme objet de « savez »
  alternative: ajouter « que nous avons endurées »
  rationale: Le grec ne répète aucun verbe après ces deux substantifs. La formulation française conserve cette ellipse et évite d’introduire une interprétation absente du texte source.
translation_notes:
  register: Français moderne, international et digne. L’ordre « mes frères, la maison de mon père et moi » évite la lourdeur de « moi et… » tout en gardant tous les participants. « En leur disant » rend naturellement la succession des deux verbes grecs. L’ellipse finale est volontairement préservée.
