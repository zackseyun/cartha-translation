  verdict: revise
  source_fidelity: 'Le projet rend fidèlement les principaux éléments grecs : l’encouragement, l’emphase de « vous-mêmes », la maison paternelle, le pluriel « lois », ainsi que les guerres et les détresses. Toutefois, la coordination finale française rattache grammaticalement « les guerres et les détresses » à « tout ce que ... avons fait », alors que le grec les coordonne comme objet elliptique de « vous savez ».'
  naturalness: « Réalités saintes » est compréhensible, mais peu idiomatique dans une traduction française moderne. « Choses saintes » est à la fois plus naturel et plus proche du substantif neutre pluriel grec. Une reprise explicite de « vous connaissez » rend aussi l’ellipse grecque intelligible sans lui imposer une interprétation telle que « nous avons endurées ».
  terminology: « Maison de mon père », « lois », « guerres » et « détresses » conviennent. « Choses saintes » préserve volontairement l’ouverture de τῶν ἁγίων, qui peut inclure le sanctuaire sans s’y limiter. La note doit donc présenter « le sanctuaire » comme une possibilité, non comme le seul sens.
  issues:
