- from: 'Il les encouragea en leur disant : « Vous savez vous-mêmes tout ce que mes frères, la maison de mon père et moi avons fait pour les lois et les réalités saintes[a], ainsi que les guerres et les détresses. »'
  to: 'Il les encouragea et leur dit : « Vous savez vous-mêmes tout ce que mes frères, la maison de mon père et moi avons fait pour les lois et les choses saintes[a] ; vous connaissez aussi les guerres et les détresses. »'
  rationale: La révision dissocie les deux objets coordonnés de « vous savez » afin de rendre l’ellipse grecque dans un français clair, sans ajouter que les détresses auraient été « endurées ». Elle remplace aussi « réalités saintes » par « choses saintes », formulation plus idiomatique et plus littérale, tout en conservant la note sur la possible référence au sanctuaire.
