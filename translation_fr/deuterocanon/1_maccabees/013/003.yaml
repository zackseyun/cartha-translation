    issue: Rattachement syntaxique ambigu de « les guerres et les détresses »
    rationale: Dans « tout ce que ... avons fait pour les lois et les réalités saintes, ainsi que les guerres et les détresses », le français fait normalement des guerres et détresses un complément de « avons fait », ce qui est sémantiquement et syntaxiquement défectueux. Le grec les coordonne plutôt à l’objet de « vous savez » après une ellipse.
  - severity: low
    issue: « réalités saintes » est peu naturel
    rationale: Cette expression abstraite ne correspond pas bien au français courant et affaiblit la formulation concrète du grec. « Choses saintes » conserve la même ambiguïté sans réduire le référent au sanctuaire.
