  text: This is the tomb that he made in Modein, to this day.
translation:
  language: fr
  text: Voici le tombeau qu’il fit à Modéïn, et qui subsiste jusqu’à ce jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Voici le tombeau qu’il fit à Modéïn jusqu’à ce jour. »'
    reason: La syntaxe grecque abrégée rattache directement « jusqu’à ce jour » à l’ensemble de l’énoncé; la traduction explicite que le tombeau subsiste, sans modifier le sens.
lexical_decisions:
- source_word: τάφος
  choice: tombeau
  rationale: Le contexte décrit un monument funéraire familial; « tombeau » convient mieux que le terme plus général « tombe ».
- source_word: ἐποίησεν
  choice: fit
  rationale: Le verbe ποιέω signifie largement « faire ». Le passé simple « fit » reste proche du grec et convient au registre narratif biblique moderne.
- source_word: ἐν Μωδεεὶμ
  choice: à Modéïn
  rationale: En français, la préposition « à » est naturelle devant un nom de ville. « Modéïn » transcrit la forme grecque Μωδεείμ tout en facilitant la prononciation française.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: qui subsiste jusqu’à ce jour
  rationale: L’expression indique que le tombeau existait encore au moment de la rédaction. L’ajout explicite de « subsiste » rend naturellement en français la portée temporelle implicite de la construction grecque.
- source_word: οὗτος
  choice: Voici
  rationale: « Voici » rend naturellement l’identification démonstrative exprimée par la proposition nominale grecque sans verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le ton narratif; la légère explicitation de la dernière proposition évite en français l’impression erronée que la construction du tombeau aurait duré jusqu’au jour mentionné.
