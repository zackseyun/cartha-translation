  text: And he sent the young men and the hundred talents[a], but he broke his word and did not release Jonathan.
translation:
  language: fr
  text: Il envoya les garçons[a] et les cent talents, mais Tryphon manqua à sa parole et ne relâcha pas Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les jeunes serviteurs ». Le mot grec peut désigner des garçons ou de jeunes serviteurs ; dans ce contexte, ils sont remis comme otages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλε
  choice: envoya
  rationale: Aoriste narratif simple de ἀποστέλλω ; « envoya » est naturel et exact dans ce contexte.
- source_word: τὰ παιδάρια
  choice: les jeunes garçons
  rationale: παιδάριον désigne des garçons ou de jeunes serviteurs. Ici, il s’agit des jeunes otages exigés auparavant ; « jeunes garçons » conserve l’indication d’âge sans imposer la fonction de serviteurs.
- source_word: τὰ ἑκατὸν τάλαντα
  choice: les cent talents
  rationale: Expression monétaire directe, avec conservation de l’unité antique.
- source_word: διεψεύσατο
  choice: manqua à sa parole
  rationale: Le verbe peut exprimer la tromperie ou le fait de se montrer faux. Dans le contexte immédiat, Tryphon ne respecte pas les conditions promises après avoir reçu les otages et l’argent.
- source_word: οὐκ ἀφῆκεν
  choice: ne relâcha pas
  rationale: Jonathan étant retenu prisonnier, « relâcher » rend précisément le sens contextuel de ἀφίημι.
- source_word: τὸν Ἰωναθάν
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le nom « Tryphon », implicite dans le pronom grec, est explicité pour éviter une ambiguïté en français. La seconde phrase met en relief le contraste entre l’exécution des conditions par Simon et le manquement de Tryphon.
