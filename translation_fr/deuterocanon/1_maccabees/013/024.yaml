  text: Alors Tryphon rebroussa chemin et partit pour son pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: rebroussa chemin
  rationale: L’aoriste de ἐπιστρέφω exprime ici un retour en arrière. « Rebroussa chemin » rend clairement cette nuance directionnelle dans un français narratif naturel.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: Le verbe ἀπέρχομαι marque le départ hors de la scène. « Partit » est courant, précis et plus fluide ici que « s’en alla » après « rebroussa chemin ».
- source_word: γῆν
  choice: pays
  rationale: Dans ce contexte de destination, γῆ désigne vraisemblablement le pays ou la contrée de Tryphon. « Pays » est idiomatique en français et n’impose pas la nuance politico-administrative de « territoire ».
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif grec est rendu naturellement par « son pays ». Ajouter « propre » serait possible, mais introduirait en français une insistance que le contexte n’exige pas.
- source_word: Τρύφων
  choice: Tryphon
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et sa translittération usuelle.
