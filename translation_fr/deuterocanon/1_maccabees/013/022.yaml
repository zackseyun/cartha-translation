  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: fr
  text: Tryphon prépara toute sa cavalerie à venir. Mais cette nuit-là, il y eut une très grande quantité de neige, et il ne vint pas à cause de la neige. Il leva donc le camp et se rendit dans la région de Galaad[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « la Galaaditide », c’est-à-dire la région de Galaad.'
    reason: Précise la forme régionale du nom propre grec et justifie sa traduction explicite.
lexical_decisions:
- source_word: ἡτοίμασεν
  choice: prépara
  rationale: Rend directement l’action de préparer une force militaire, sans préciser davantage la manière.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: toute sa cavalerie
  rationale: Dans ce contexte militaire, le collectif ἵππος désigne les troupes montées ; « cavalerie » est naturel et précis en français moderne.
- source_word: ἐλθεῖν
  choice: pour avancer
  rationale: Le grec signifie littéralement « venir ». Dans ce récit de mouvement militaire, « avancer » exprime naturellement le déplacement envisagé sans lui attribuer une destination non indiquée.
- source_word: χιών πολλὴ σφόδρα
  choice: il tomba énormément de neige
  rationale: Cette formulation idiomatique conserve la forte intensification de la quantité de neige exprimée par πολλὴ σφόδρα.
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: il ne vint pas à cause de la neige
  rationale: Conserve le verbe simple du grec ainsi que le lien causal explicite, sans transformer le fait en incapacité.
- source_word: ἀπῆρεν
  choice: leva le camp
  rationale: Dans ce cadre militaire, le verbe de départ peut naturellement désigner la levée du camp avant le déplacement.
- source_word: Γαλααδῖτιν
  choice: la région de Galaad
  rationale: Le nom grec désigne le territoire de Galaad ; cette formulation est claire pour le lecteur francophone tout en conservant le toponyme biblique français traditionnel.
