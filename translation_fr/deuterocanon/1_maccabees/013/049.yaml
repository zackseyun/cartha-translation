  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: fr
  text: Mais ceux qui étaient dans la citadelle de Jérusalem étaient empêchés de sortir dans la campagne et d’acheter ou de vendre[a]. Ils eurent très faim, et beaucoup d’entre eux périrent de famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Acra de Jérusalem ». Le grec ἄκρα peut désigner une citadelle ou servir de nom traditionnel pour la place forte séleucide de Jérusalem. Le texte grec porte aussi deux fois de suite la conjonction « et » (καὶ καὶ) avant « acheter et vendre » ; cette répétition ne change pas le sens.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: citadelle
  rationale: Le terme désigne ici la place forte séleucide de Jérusalem. « Citadelle » en exprime clairement la fonction, tandis que « Acra » peut être conservé en note comme nom traditionnel.
- source_word: ἐκωλύοντο
  choice: ne pouvaient pas
  rationale: L’imparfait passif décrit une entrave durable. Cette tournure française naturelle indique qu’une force extérieure les empêchait d’agir, sans alourdir la phrase.
- source_word: ἐκπορεύεσθαι εἰς τὴν χώραν
  choice: sortir dans la campagne
  rationale: La formulation rend le mouvement hors de la forteresse vers le territoire rural environnant.
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: acheter ou vendre
  rationale: Les deux activités commerciales concrètes sont conservées. En français, « ou » convient naturellement après une négation portant sur l’une comme sur l’autre.
- source_word: ἐπείνασαν σφόδρα
  choice: souffrirent cruellement de la faim
  rationale: Cette formulation actuelle et digne exprime l’intensité de σφόδρα et la gravité de la faim dans le contexte du siège.
- source_word: ἱκανοὶ
  choice: un grand nombre
  rationale: ἱκανοί désigne une quantité considérable mais indéterminée; « un grand nombre » en conserve la nuance sans préciser davantage.
- source_word: ἀπώλοντο ... τῷ λιμῷ
  choice: moururent de famine
  rationale: Dans ce contexte, ἀπόλλυμι indique la mort, et λιμός la famine provoquée par les privations du siège.
