revisions:
- from: Les habitants de la ville montèrent sur la muraille avec leurs femmes et leurs enfants. Ils avaient déchiré leurs vêtements[b] et crièrent d’une voix forte, demandant à Simon de leur donner sa main droite[a].
  to: Les habitants de la ville montèrent sur la muraille avec leurs femmes et leurs enfants, les vêtements déchirés[b], et crièrent d’une voix forte, demandant à Simon de leur donner des gages[a].
  rationale: La révision rend l’idiome grec par une expression française naturelle et suffisamment générale, tout en en maintenant l’image littérale et les possibilités de sens dans la note. Elle restitue aussi plus précisément la valeur résultative du participe parfait.
  reviewer_model: gpt-5.6-terra
