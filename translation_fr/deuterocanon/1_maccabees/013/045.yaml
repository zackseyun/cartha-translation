review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « leur donner sa main droite » réduit le pluriel grec δεξιάς à un singulier possessif et n’exprime pas naturellement en français la formule idiomatique de l’engagement. « Des gages » rend de façon sobre sa valeur de promesse ou de garantie, sans préciser indûment la nature exacte de l’accord.
  naturalness: La formulation est claire et de registre approprié. La participiale parfaite est mieux rendue par « les vêtements déchirés », qui situe l’état visible des suppliants au moment où ils montent sur la muraille, plutôt que par un plus-que-parfait autonome qui accentue une antériorité non requise.
  terminology: « Muraille », « d’une voix forte » et « gages » conviennent au français international moderne et au contexte. La note conserve la littéralité du grec et explique l’idiome sans imposer des « conditions de paix » comme seule interprétation.
  issues:
  - severity: medium
    issue: 'Rendu de δεξιὰς ... δοῦναι au singulier : « leur donner sa main droite ».'
    rationale: Le grec porte « des mains droites » et désigne une formule d’engagement. Le singulier possessif français est à la fois moins fidèle à la forme et peu idiomatique pour ce sens. « Leur donner des gages » préserve l’idée générale de garantie ou d’engagement, que la note explicite littéralement.
  - severity: low
    issue: « Ils avaient déchiré leurs vêtements » détache et antériorise fortement le participe parfait.
    rationale: Le parfait grec décrit surtout l’état résultant au moment de l’action principale. « Les vêtements déchirés » rend naturellement cet état en français.
  revised_text: Les habitants de la ville montèrent sur la muraille avec leurs femmes et leurs enfants, les vêtements déchirés[b], et crièrent d’une voix forte, demandant à Simon de leur donner des gages[a].
  revised_footnotes:
