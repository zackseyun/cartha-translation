  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
translation:
  language: fr
  text: Les habitants de la ville montèrent sur la muraille avec leurs femmes et leurs enfants, les vêtements déchirés[b], et crièrent d’une voix forte, demandant à Simon de leur donner des gages[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur donner des mains droites ». Cette expression peut désigner l’offre d’une garantie, d’un engagement de bonne foi ou de conditions de paix.'
    reason: lexical_alternative
  - marker: b
    text: Déchirer ses vêtements était un signe habituel de deuil, de détresse ou de supplication pressante.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe exprime un déplacement vers le haut; « montèrent » restitue simplement et naturellement ce sens.
- source_word: οἱ ἐν τῇ πόλει
  choice: les habitants de la ville
  rationale: Cette formulation française naturelle rend le groupe collectif « ceux qui étaient dans la ville » sans lourdeur.
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: avec leurs femmes et leurs enfants
  rationale: Dans ce contexte de siège, le possessif exprime naturellement le lien familial suggéré par le grec.
- source_word: ἐπὶ τὸ τεῖχος
  choice: sur la muraille
  rationale: Avec le verbe « monter », la préposition indique qu’ils gagnent le sommet de l’ouvrage défensif de la ville.
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: Ils avaient déchiré leurs vêtements
  rationale: Le parfait participial décrit l’état résultant d’un geste déjà accompli. Une proposition autonome est plus fluide en français tout en conservant cet aspect.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: crièrent d’une voix forte
  rationale: Cette expression reste proche de la tournure emphatique grecque et demeure naturelle en français moderne.
- source_word: ἀξιοῦντες
  choice: demandant
  rationale: Le participe exprime ici une requête insistante; « demandant » en conserve la portée sans imposer le sens plus fort de « réclamant » ou « exigeant ».
- source_word: δεξιὰς ... δοῦναι
  choice: leur donner sa main droite
  rationale: La traduction garde dans le texte l’image concrète du grec, littéralement « donner des mains droites », tandis que la note explique sa valeur idiomatique de garantie, de bonne foi ou de paix.
theological_decisions:
- issue: Valeur idiomatique de « donner des mains droites » dans un contexte de reddition
  choice: Conserver l’image « leur donner sa main droite » dans le texte principal
  alternative: leur donner des garanties; leur accorder des conditions de paix
  rationale: Le grec emploie une image pouvant désigner un engagement de bonne foi, une garantie ou des conditions pacifiques. La conserver évite de trancher silencieusement entre ces nuances, que la note explicite.
translation_notes:
  register: Français international moderne, clair et digne. La longue phrase grecque est divisée en deux phrases pour améliorer la lisibilité sans modifier la progression des actions. Les marqueurs suivent immédiatement les expressions qu’ils expliquent.
