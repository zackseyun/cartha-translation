    reason: lexical_alternative
  - marker: b
    text: Déchirer ses vêtements était un signe habituel de deuil, de détresse ou de supplication pressante.
    reason: cultural_note
  revision_rationale: La révision rend l’idiome grec par une expression française naturelle et suffisamment générale, tout en en maintenant l’image littérale et les possibilités de sens dans la note. Elle restitue aussi plus précisément la valeur résultative du participe parfait.
