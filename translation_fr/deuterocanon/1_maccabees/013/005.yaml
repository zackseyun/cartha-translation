  yaml_path: translation/deuterocanon/1_maccabees/013/005.yaml
  text: And now[a], far be it from me to spare my life in any time of distress; for I am not better than my brothers.
translation:
  language: fr
  text: Et maintenant, loin de moi l’idée d’épargner ma vie[a] en tout temps de détresse, car je ne vaux pas mieux que mes frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de m’épargner moi-même »; littéralement « d’épargner ma vie/mon âme ». Ici, le mot grec désigne la vie plutôt que l’âme immatérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: loin de moi l’idée de
  rationale: Cette tournure française naturelle exprime le rejet énergique porté par l’optatif grec, sans reproduire littéralement « que cela ne m’arrive pas ».
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: épargner ma vie
  rationale: Dans ce contexte, ψυχή désigne la vie de Simon, non l’âme immatérielle; le génitif régi par φείδομαι exprime l’idée de préserver sa propre vie.
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: en quelque temps de détresse que ce soit
  rationale: Cette formulation rend la portée distributive de παντί et le sens de pression, d’épreuve ou de détresse de θλῖψις dans un français idiomatique.
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: car je ne vaux pas mieux
  rationale: κρείσσων peut signifier « meilleur », « plus fort » ou « supérieur ». Ici, Simon refuse de s’accorder un traitement privilégié par rapport à ses frères; « ne vaux pas mieux » rend naturellement cette comparaison.
- source_word: τῶν ἀδελφῶν μου
  choice: que mes frères
  rationale: Le récit vise les frères biologiques de Simon; « frères » est donc précis et naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la force résolue de la déclaration et la comparaison avec les frères de Simon, sans surinterprétation théologique.
