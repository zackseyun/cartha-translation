  text: And whatever we established with you stands[a], and the strongholds that you built shall remain yours.
translation:
  language: fr
  text: Tout ce que nous avons établi avec vous reste en vigueur[a], et les forteresses que vous avez bâties resteront à vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demeure valable ». Le grec laisse implicite ce qui a été établi; dans ce contexte diplomatique, il s’agit des dispositions convenues.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: tout ce que
  rationale: Le relatif neutre pluriel désigne littéralement « toutes les choses que » ou « tout ce que ». Cette formulation naturelle conserve l’objet implicite du grec sans ajouter « accords » dans le texte.
- source_word: ἐστήσαμεν
  choice: nous avons établi
  rationale: Dans ce contexte diplomatique, le verbe désigne ce qui a été fixé ou établi entre les parties; « établi » garde la formulation générale de la source.
- source_word: πρὸς ὑμᾶς
  choice: avec vous
  rationale: Avec des personnes, πρὸς exprime ici la relation entre les parties; « avec vous » convient au contexte d’un engagement diplomatique.
- source_word: ἔστηκεν
  choice: reste en vigueur
  rationale: 'Le parfait exprime un état durable: ce qui a été établi demeure valide. Cette tournure française rend naturellement la portée juridique de la métaphore grecque.'
- source_word: ὀχυρώματα
  choice: forteresses
  rationale: Le terme désigne des ouvrages ou lieux fortifiés. « Forteresses » est précis, courant et adapté au contexte.
- source_word: ᾠκοδομήσατε
  choice: vous avez bâties
  rationale: Le verbe signifie ordinairement « bâtir » ou « construire ». L’accord au féminin renvoie à « forteresses ».
- source_word: ὑπαρχέτω ὑμῖν
  choice: resteront à vous
  rationale: Dans cette déclaration administrative, la forme impérative confirme aux destinataires la possession durable des forteresses.
