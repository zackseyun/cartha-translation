lexical_decisions:
- source_word: ἔντρομος καὶ ἔκφοβος
  choice: tremblant et saisi de peur
  rationale: 'Rend les deux adjectifs coordonnés sans les réduire à une seule idée : ἔντρομος évoque le tremblement causé par l’effroi, tandis que ἔκφοβος marque une peur intense.'
- source_word: ἀνέβη εἰς Ἰερουσαλήμ
  choice: il monta à Jérusalem
  rationale: Conserve l’expression géographique et traditionnelle de la montée vers Jérusalem.
- source_word: ἤθροισεν τὸν λαόν
  choice: rassembla le peuple
  rationale: Traduction directe et naturelle du verbe ἀθροίζω, dans son emploi transitif.
