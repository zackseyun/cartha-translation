  yaml_path: translation/deuterocanon/1_maccabees/013/042.yaml
  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
translation:
  language: fr
  text: 'Le peuple d’Israël commença à écrire dans les documents et les contrats : « An un de Simon, grand prêtre éminent, général et chef des Juifs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le terme grec peut désigner soit les Juifs au sens large, soit plus précisément le peuple de Judée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: commença
  rationale: L’aoriste marque ici le début d’une pratique administrative; « commença » est naturel et précis.
- source_word: ὁ λαὸς Ἰσραήλ
  choice: le peuple d’Israël
  rationale: Cette formulation conserve explicitement le nom collectif λαός et le nom Israël.
- source_word: γράφειν
  choice: à écrire
  rationale: L’infinitif complète « commença » et garde le sens direct du verbe grec.
- source_word: ἐν ταῖς συγγραφαῖς καὶ συναλλάγμασιν
  choice: dans les documents et les contrats
  rationale: συγγραφαί désigne des écrits ou actes officiels, tandis que συναλλάγματα renvoie ici à des accords ou actes contractuels.
- source_word: Ἔτους πρώτου
  choice: An un
  rationale: Il s’agit d’une formule de datation officielle; « An un » en restitue la brièveté documentaire en français.
- source_word: ἐπὶ Σίμωνος
  choice: de Simon
  rationale: Avec le génitif, ἐπί introduit ici l’autorité ou le personnage servant à dater la nouvelle ère; « de Simon » convient à la formule « An un de Simon ».
- source_word: ἀρχιερέως μεγάλου
  choice: grand prêtre éminent
  rationale: « Grand prêtre » est le titre français établi pour ἀρχιερεύς; traduire μέγας par « éminent » évite le pléonasme apparent de « grand grand prêtre » tout en conservant l’épithète honorifique présente en grec.
- source_word: στρατηγοῦ
  choice: général
  rationale: Le terme désigne un commandant militaire et « général » en est ici l’équivalent direct.
- source_word: ἡγουμένου
  choice: chef
  rationale: Le participe substantivé désigne celui qui dirige; « chef » reste assez large pour ne pas imposer une fonction constitutionnelle précise.
- source_word: Ἰουδαίων
  choice: des Juifs
  rationale: Dans ce titre collectif, « Juifs » est le rendu français courant; « Judéens » demeure possible si l’accent est géographique ou politique.
theological_decisions:
- issue: Portée de l’ethnonyme Ἰουδαίων
  choice: des Juifs
  alternative: des Judéens
  rationale: Le contexte présente Simon comme chef d’un peuple reconnu collectivement, ce qui favorise « Juifs » en français courant. Le grec peut toutefois aussi désigner plus précisément les habitants ou le peuple de Judée; cette ambiguïté est signalée en note.
- issue: Valeur de μέγας dans ἀρχιερέως μεγάλου
  choice: grand prêtre éminent
  alternative: grand grand prêtre; grand prêtre suprême
  rationale: Le grec ajoute réellement μέγας au titre ἀρχιερεύς. « Éminent » rend cette qualification honorifique sans effacer le mot ni créer en français le maladroit « grand grand prêtre »; « suprême » préciserait excessivement une hiérarchie institutionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La citation conserve le caractère bref d’une formule officielle de datation. « Grand prêtre éminent » permet de représenter les deux éléments de ἀρχιερέως μεγάλου sans lourdeur artificielle.
