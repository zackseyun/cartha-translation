  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: fr
  text: Il régna à sa place, mit le diadème[a] de l’Asie et porta un grand coup au pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la couronne ». Le mot grec désigne plus précisément le bandeau royal, insigne de la royauté.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « causa de grands ravages dans le pays ». Le grec dit littéralement qu’il « fit un grand coup contre le pays », image exprimant un grave dommage ou un grand malheur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: régna
  rationale: L’aoriste exprime ici l’exercice de la royauté sans imposer explicitement la nuance plus forte de « devint roi ».
- source_word: ἀντʼ αὐτοῦ
  choice: à sa place
  rationale: Cette expression rend clairement l’idée de remplacement et de succession portée par ἀντί.
- source_word: περιέθετο
  choice: se ceignit
  rationale: La forme moyenne indique qu’il plaça lui-même sur sa tête l’insigne royal ; « se ceignit » conserve cette image concrète dans un registre digne.
- source_word: τὸ διάδημα
  choice: le diadème
  rationale: Le terme grec désigne précisément le bandeau royal, emblème de la royauté ; « diadème » est exact et intelligible en français.
- source_word: τῆς Ἀσίας
  choice: de l’Asie
  rationale: La traduction maintient la désignation géographique et politique du grec sans la préciser abusivement comme « Asie Mineure » ou « royaume asiatique ».
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: porta un grand coup
  rationale: Cette formulation préserve la métaphore grecque du coup tout en exprimant naturellement un grave dommage dans un contexte politique et militaire.
- source_word: ἐπὶ τῆς γῆς
  choice: au pays
  rationale: Dans ce contexte régional et politique, γῆ renvoie vraisemblablement au pays plutôt qu’à la terre entière.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « se ceignit du diadème » conserve l’image royale concrète, tandis que « porta un grand coup au pays » maintient l’expression imagée et son ampleur sans préciser indûment la nature du désastre.
