  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
translation:
  language: fr
  text: Simon envoya chercher les ossements de Jonathan, son frère, puis l’ensevelit à Modéïn, la ville de ses pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville de ses ancêtres ». Le grec dit littéralement « la ville de ses pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya chercher
  rationale: Le verbe signifie simplement « envoya », sans préciser qui fut envoyé. En français, « envoya chercher » rend naturellement l’action implicite sans ajouter explicitement des hommes absents du texte grec.
- source_word: ἔλαβεν
  choice: chercher
  rationale: Le sens de « prendre » est ici intégré à la tournure française « envoya chercher », qui exprime la récupération des ossements sans surcharger la phrase.
- source_word: τὰ ὀστᾶ
  choice: les ossements
  rationale: « Ossements » conserve le caractère concret du grec tout en convenant au registre funéraire en français moderne.
- source_word: Ἰωναθὰν
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: son frère
  rationale: Rend directement la relation familiale exprimée par le grec.
- source_word: ἔθαψεν
  choice: l’ensevelit
  rationale: « Ensevelir » est un verbe français naturel et digne pour la mise au tombeau; le pronom singulier renvoie à Jonathan, comme le grec αὐτόν.
- source_word: ἐν Μωδεεὶμ
  choice: à Modéïn
  rationale: La préposition « à » est idiomatique en français devant un nom de ville; « Modéïn » transcrit clairement la forme grecque du toponyme.
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: la ville de ses pères
  rationale: Cette formulation conserve l’image familiale et ancestrale du grec, tandis qu’une note donne l’équivalent moderne possible.
