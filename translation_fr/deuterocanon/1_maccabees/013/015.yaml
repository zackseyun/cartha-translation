  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
translation:
  language: fr
  text: Quant à l’argent que ton frère Jonathan devait au trésor royal en raison des obligations qu’il avait[a], nous retenons Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de ses besoins » ou « en raison des affaires qu’il avait ». Le terme grec peut désigner des besoins, des obligations, des affaires ou des fonctions ; le contexte ne permet pas d’en préciser la nature avec certitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: Quant à l’argent
  rationale: Περί introduit ici le sujet abordé. Dans ce contexte financier, ἀργύριον désigne l’argent dû, plutôt que le métal en tant que tel.
- source_word: εἰς τὸ βασιλικόν
  choice: au trésor royal
  rationale: Le neutre substantivé τὸ βασιλικόν désigne ici le domaine ou trésor de la royauté auquel la somme était due.
- source_word: διʼ ἃς εἶχεν χρείας
  choice: en raison des fonctions qu’il exerçait
  rationale: χρεία peut désigner des besoins, des obligations, des affaires ou des fonctions. Le contexte d’une dette envers le trésor royal favorise les charges ou fonctions officielles; «exerçait» rend naturellement εἶχεν sans surinterpréter leur nature précise.
- source_word: συνέχομεν αὐτόν
  choice: nous le retenons
  rationale: συνέχω signifie couramment tenir, maintenir sous contrainte ou détenir. Le pronom αὐτόν désigne Jonathan. Le contexte immédiat, où Jonathan est prisonnier et où sa libération est négociée, appuie le sens de rétention, non celui d’une remise de dette.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. «Quant à» conserve la mise en thème du grec; «nous le retenons» préserve la force directe du verbe et l’ambiguïté entre retenir et garder en détention, que le contexte éclaire.
