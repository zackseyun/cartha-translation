  text: And Tryphon set out from Ptolemais with a large force to enter the land of Judah[a], and Jonathan was with him in custody;
translation:
  language: fr
  text: Tryphon partit de Ptolémaïs avec une armée nombreuse pour entrer dans le pays de Juda, et Jonathan était avec lui, sous bonne garde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en détention » ou « en captivité » (grec : ἐν φυλακῇ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partit
  rationale: L’aoriste de ἀπαίρω exprime ici le départ depuis un lieu. « Partit » est naturel et n’ajoute pas une nuance militaire absente du verbe lui-même.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec une armée nombreuse
  rationale: Dans ce récit militaire, δύναμις désigne une force armée plutôt qu’une puissance abstraite. « Armée nombreuse » rend clairement le sens concret et l’importance de cette force.
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: pour entrer dans le pays de Juda
  rationale: L’infinitif indique le but du déplacement. « Entrer » conserve le sens simple du grec sans expliciter une invasion, même si le contexte est militaire.
- source_word: γῆν Ἰούδα
  choice: le pays de Juda
  rationale: Cette formulation garde l’expression géographique du grec et reste naturelle en français, sans la remplacer par le terme plus conventionnel « Judée ».
- source_word: ἐν φυλακῇ
  choice: sous bonne garde
  rationale: La locution indique que Jonathan est gardé comme prisonnier pendant le déplacement. Cette expression française est idiomatique et évite de suggérer qu’il se trouve dans un bâtiment carcéral déterminé.
