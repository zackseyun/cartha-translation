lexical_decisions:
- source_word: πολέμησον τὸν πόλεμον ἡμῶν
  choice: Mène notre combat
  rationale: La construction associe le verbe πολεμέω à son nom apparenté πόλεμος. « Mène notre combat » rend l’appel à prendre la conduite des opérations militaires, conserve l’idée que ce combat est le leur et reste naturel en français moderne.
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: tout ce que tu nous diras
  rationale: Cette tournure exprime une disposition totale à suivre les instructions que l’interlocuteur donnera. Le futur français rend naturellement la portée éventuelle et future du subjonctif grec.
- source_word: ποιήσομεν
  choice: nous ferons
  rationale: Le futur de ποιέω exprime ici l’engagement d’exécuter les directives reçues. « Nous ferons » demeure direct et fidèle sans expliciter davantage l’idée d’obéissance.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse au singulier du grec. La répétition étymologique de πολέμησον et πόλεμον n’est pas reproduite mécaniquement, car « combats notre combat » serait peu idiomatique.
