base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: fr
  text: Mais nous vous remettons les fautes commises par ignorance et les péchés jusqu’à ce jour, ainsi que l’impôt de la couronne que vous deviez[a]. Et si quelque autre taxe était perçue à Jérusalem, qu’elle ne le soit plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la couronne »; il s’agit vraisemblablement d’un impôt ou d’une contribution dus au pouvoir royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: nous vous remettons
  rationale: Dans ce décret politico-fiscal, « remettre » convient à la fois aux fautes pardonnées et aux obligations annulées, tout en conservant l’ampleur morale et juridique du verbe.
- source_word: ἀγνοήματα
  choice: les fautes commises par ignorance
  rationale: Cette formulation explicite le caractère involontaire ou ignorant de ces manquements et les distingue des ἁμαρτήματα.
- source_word: ἁμαρτήματα
  choice: les péchés
  rationale: Le terme grec porte une force morale réelle, même dans ce contexte royal; « péchés » préserve cette tension sans réduire le mot à de simples infractions administratives.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: jusqu’à ce jour
  rationale: Expression française naturelle et digne qui marque clairement la limite temporelle de la remise.
- source_word: στέφανον
  choice: l’impôt de la couronne
  rationale: Le sens littéral est « couronne », mais le contexte de dette et de perception indique une contribution royale. La formulation conserve l’image grecque tout en rendant le sens fiscal intelligible.
- source_word: ὠφείλετε
  choice: que vous deviez
  rationale: Rend naturellement l’obligation antérieure encore due qu’annule le décret.
- source_word: εἴ τι ἄλλο
  choice: si quelque autre taxe
  rationale: Le contexte fiscal permet d’expliciter le référent implicite de τι sans imposer un type précis de prélèvement.
- source_word: ἐτελωνεῖτο
  choice: était perçue
  rationale: Le verbe désigne la taxation ou la perception d’un droit; « était perçue » convient idiomatiquement à une taxe.
- source_word: μηκέτι τελωνιζέσθω
  choice: qu’elle ne le soit plus
  rationale: Préserve la tournure passive et le ton prescriptif du décret, tout en évitant une répétition lourde de « perçue ».
theological_decisions:
- issue: Force morale de ἁμαρτήματα dans un décret royal
  choice: les péchés
  alternative: les offenses; les méfaits
  rationale: Bien que le cadre soit politique, le grec emploie un terme moral fort à côté des fautes d’ignorance. « Péchés » conserve cette portée et la tension du texte.
- issue: Interprétation fiscale de στέφανον
  choice: l’impôt de la couronne
  alternative: la couronne; le tribut royal
  rationale: Une traduction strictement littérale serait obscure en français. Le contexte exige un sens fiscal, tandis que « de la couronne » maintient le lien lexical avec στέφανος.
translation_notes:
  register: Français international moderne, clair et digne. Le ton formel du décret est maintenu par « nous vous remettons » et « qu’elle ne le soit plus ». Le texte distingue les fautes dues à l’ignorance des péchés, sans effacer leur proximité.
