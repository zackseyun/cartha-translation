base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: fr
  text: Simon choisit des hommes et les envoya auprès du roi Démétrios afin que celui-ci accorde une remise en faveur du pays[a], car tous les actes de Tryphon n’étaient que des pillages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une exemption en faveur du pays » ou « un allègement pour le pays » ; le terme grec peut désigner une libération ou une remise, probablement de nature administrative ou fiscale dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: choisit
  rationale: Le moyen de ἐπιλέγω signifie ici simplement choisir ou sélectionner; « choisit » est naturel et précis.
- source_word: ἄνδρας
  choice: des hommes
  rationale: Le grec emploie le pluriel masculin désignant ici des hommes adultes, vraisemblablement choisis comme représentants.
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: les envoya auprès du roi Démétrios
  rationale: Le pronom « les » reprend naturellement les hommes choisis; « auprès de » convient à une délégation envoyée auprès d’un souverain.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: pour qu’il accorde une remise au pays
  rationale: ἄφεσις peut désigner une libération, une remise ou une exemption. Dans ce contexte politico-administratif, « remise » conserve cette portée sans préciser indûment qu’il s’agit exclusivement d’impôts.
- source_word: χώρᾳ
  choice: au pays
  rationale: χώρα désigne le pays ou le territoire; « pays » est idiomatique en français dans ce cadre politique.
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: tous les actes de Tryphon
  rationale: πράξεις désigne les actions ou actes; cette formulation garde le ton sobre du grec.
- source_word: ἦσαν ἁρπασίαι
  choice: n’étaient que pillages
  rationale: ἁρπασίαι évoque des rapines, spoliations ou pillages. La tournure française exprime naturellement la caractérisation fortement négative de l’ensemble des actes de Tryphon.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la délégation envoyée au roi et maintient l’ambiguïté de ἄφεσις au moyen d’une note, sans réduire explicitement la demande à une exemption fiscale.
