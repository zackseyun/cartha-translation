  verdict: revise
  source_fidelity: 'Le sens global est fidèlement rendu : les occupants s’adressent avec insistance à Simon au sujet de « mains droites », il accorde ce qui est demandé, les expulse, puis purifie l’Akra de ses souillures. La note a préserve correctement l’idiome grec sans le surinterpréter, et la note b identifie avec prudence le référent historique de ἄκρα.'
  naturalness: '« Ils crièrent à Simon de recevoir » est peu idiomatique en français moderne : la construction avec « crier à quelqu’un de + infinitif » est maladroite et peut gêner la compréhension du sujet implicite de « recevoir ». Une reformulation conserve à la fois la force de ἐβόησαν et le fait que Simon est celui qui doit recevoir les assurances.'
  terminology: « gages de bonne foi », « expulsa », « citadelle » et « souillures » sont appropriés. « Accorda » est plus naturel que « en donna » pour reprendre les assurances implicites, tout en évitant de préciser leur contenu. « Purifia » rend convenablement ἐκαθάρισεν et conserve la portée cultuelle de μιασμάτων.
  issues:
