  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
translation:
  language: fr
  text: Ils crièrent vers Simon, lui demandant de recevoir des gages de bonne foi[a]. Il leur en accorda, puis les expulsa de là et purifia la citadelle[b] de ses souillures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « recevoir des mains droites », expression désignant l’acceptation d’assurances ou de gages de bonne foi.'
    reason: lexical_alternative
  - marker: b
    text: Ou « l’Akra », la citadelle fortifiée de Jérusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: Ils crièrent à Simon
  rationale: Le verbe βοάω exprime un cri ou un appel lancé avec force. « Crièrent à Simon » conserve cette intensité sans réduire le geste à une simple demande.
- source_word: δεξιὰς λαβεῖν
  choice: de recevoir des gages de bonne foi[a]
  rationale: L’expression signifie littéralement « recevoir des mains droites » et désigne idiomatiquement l’acceptation d’engagements ou de garanties. La formulation retenue en communique clairement le sens tout en signalant l’image grecque en note.
- source_word: ἔδωκεν αὐτοῖς
  choice: Il leur en donna
  rationale: Le pronom « en » reprend les gages mentionnés juste avant et conserve la concision ainsi que l’objet implicite du grec.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: les expulsa de là
  rationale: ἐκβάλλω marque ici une éviction énergique. « Expulsa » convient naturellement au contexte militaire et politique.
- source_word: τὴν ἄκραν
  choice: la citadelle[b]
  rationale: ἄκρα désigne une forteresse élevée et, dans ce contexte, la place forte de Jérusalem connue comme l’Akra. Le nom commun rend le texte immédiatement intelligible, tandis que la note préserve l’identification historique.
- source_word: ἀπὸ τῶν μιασμάτων
  choice: de ses souillures
  rationale: μίασμα évoque une souillure, notamment rituelle ou religieuse. « Souillures » conserve le pluriel et la portée cultuelle du terme.
theological_decisions:
- issue: Faut-il traduire δεξιὰς λαβεῖν littéralement ou idiomatiquement ?
  choice: 'Traduction idiomatique : « recevoir des gages de bonne foi »'
  alternative: 'Traduction littérale : « recevoir des mains droites » ; explicitation possible : « accepter des garanties de sécurité »'
  rationale: Une traduction littérale serait obscure en français moderne. La solution retenue exprime un engagement formel sans préciser indûment qu’il s’agissait uniquement d’une garantie de sécurité.
- issue: Faut-il rendre τὴν ἄκραν par un nom commun ou par le nom propre « l’Akra » ?
  choice: « la citadelle » dans le texte principal
  alternative: « l’Akra »
  rationale: Le grec emploie un nom signifiant « citadelle », mais celui-ci peut désigner précisément la forteresse séleucide de Jérusalem. Le texte principal privilégie la clarté, et la note conserve cette dimension historique.
translation_notes:
  register: Français international moderne, courant et digne. La coordination grecque est légèrement structurée par une ponctuation française naturelle et par « puis », sans modifier l’enchaînement des actions. Les termes « gages de bonne foi », « expulsa », « purifia » et « souillures » préservent respectivement la portée diplomatique, coercitive et cultuelle du verset.
