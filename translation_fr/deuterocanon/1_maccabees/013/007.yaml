lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: se ranima
  rationale: Le verbe évoque ce qui reprend vie ou se rallume. « Se ranima » exprime naturellement en français le regain de vigueur et de courage du peuple, tout en conservant l’idée d’un réveil intérieur.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le sens littéral est « l’esprit »; dans ce contexte, il s’agit de l’élan intérieur ou du courage collectif. Ce choix préserve la métaphore sans la réduire explicitement au seul moral.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: de son peuple
  rationale: 'Le génitif et le pronom αὐτοῦ expriment directement l’appartenance ou la relation personnelle : « de son peuple ».'
- source_word: ἀκοῦσαι
  choice: lorsqu’ils entendirent
  rationale: L’infinitif indique ici la circonstance ou l’occasion du regain d’esprit. La proposition temporelle est idiomatique en français et rend explicite que le sujet sous-entendu est le peuple.
- source_word: τῶν λόγων τούτων
  choice: ces paroles
  rationale: λόγοι désigne les propos qui viennent d’être prononcés. « Ces paroles » convient au registre narratif biblique tout en restant actuel et naturel.
