  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: fr
  text: Et maintenant, envoie cent talents d’argent et deux de ses fils comme otages, afin qu’une fois relâché, il ne se révolte pas contre nous ; et nous le relâcherons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: cent talents d’argent
  rationale: Rend directement la somme et conserve l’unité de poids antique « talent », familière dans le contexte biblique.
- source_word: ὅμηρα
  choice: comme otages
  rationale: Le neutre pluriel désigne des personnes remises en garantie ; « comme otages » est naturel et précis en français.
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: il ne se révolte pas contre nous
  rationale: Le verbe exprime ici la défection ou la rébellion ; dans ce contexte politique, « se révolter contre nous » restitue clairement le sens.
- source_word: ἀφήσομεν αὐτόν
  choice: alors nous le relâcherons
  rationale: Le futur grec énonce la contrepartie promise. « Alors » explicite naturellement le lien logique sans changer la condition.
