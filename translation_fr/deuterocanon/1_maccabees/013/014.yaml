  yaml_path: translation/deuterocanon/1_maccabees/013/014.yaml
  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: fr
  text: 'Tryphon apprit que Simon avait pris la relève de son frère Jonathan[a] et qu’il s’apprêtait à lui faire la guerre[b]. Il lui envoya alors des émissaires pour lui dire :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « s’était levé à la place de son frère Jonathan ». Le grec peut évoquer à la fois le fait de se lever et celui d’apparaître comme successeur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « allait engager le combat contre lui ». L’expression grecque signifie entrer dans un conflit armé avec quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: apprit
  rationale: L’aoriste marque ici le moment où Tryphon prend connaissance de la situation, plutôt qu’un simple état de savoir.
- source_word: ἀνέστη ... ἀντὶ Ἰωνάθου
  choice: avait pris la relève de ... Jonathan
  rationale: Dans ce contexte politique, ἀνέστη avec ἀντί présente Simon comme celui qui s’est levé pour remplacer Jonathan. Cette formulation française exprime naturellement la succession sans préciser davantage sa nature.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: de son frère Jonathan
  rationale: La construction française rattache clairement « son frère » à Simon, conformément au grec.
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: lui faire la guerre
  rationale: L’expression grecque désigne l’entrée dans un conflit armé contre Tryphon. « Faire la guerre à quelqu’un » est idiomatique, clair et fidèle au sens hostile.
- source_word: μέλλει
  choice: s’apprêtait à
  rationale: La tournure rend l’action envisagée comme imminente ou projetée, sans en faire un fait déjà accompli.
- source_word: ἀπέστειλεν ... πρέσβεις
  choice: envoya ... des émissaires
  rationale: πρέσβεις désigne des représentants chargés d’une mission diplomatique, et non de simples messagers.
- source_word: λέγων
  choice: 'pour lui dire :'
  rationale: Le participe introduit les paroles transmises au verset suivant. Les deux-points maintiennent naturellement cette ouverture en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La succession politique est exprimée idiomatiquement par « prendre la relève », tandis que les notes conservent l’image plus littérale du grec. La phrase se termine par deux-points puisque le discours commence au verset suivant.
