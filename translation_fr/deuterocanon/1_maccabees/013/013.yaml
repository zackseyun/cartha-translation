lexical_decisions:
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans ce contexte militaire, l’aoriste de παρεμβάλλω signifie que Simon installa son camp. « Établit son camp » est naturel en français moderne tout en conservant la nuance militaire.
- source_word: ἐν Ἀδείδοις
  choice: à Adida
  rationale: Avec un nom de lieu, « à » est la préposition française idiomatique. « Adida » translittère le toponyme grec Ἀδείδοις.
- source_word: κατὰ πρόσωπον
  choice: en face de
  rationale: L’expression a ici un sens spatial et indique que le camp faisait face à la plaine. « En face de » préserve cette relation sans préciser indûment une distance.
- source_word: τοῦ πεδίου
  choice: la plaine
  rationale: πεδίον désigne couramment une étendue de terrain plat; « la plaine » convient au cadre géographique.
- source_word: δὲ
  choice: Mais
  rationale: δὲ marque une transition narrative avec une légère valeur contrastive. « Mais » la rend avec concision, conformément au contexte fourni.
