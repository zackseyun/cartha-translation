  text: And all Israel made great mourning for him[a], and they mourned for him many days.
translation:
  language: fr
  text: Tout Israël fit pour lui un grand deuil[a] et le pleura pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit pour lui une grande lamentation ». Le grec emploie une expression formée avec κόπτομαι et κοπετός pour désigner un deuil public.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψαντο
  choice: célébra … un deuil
  rationale: Le moyen de κόπτω, associé à κοπετός, forme ici une expression de lamentation publique. « Célébrer un deuil » rend l’acte collectif sans imposer le geste physique de se frapper la poitrine.
- source_word: κοπετὸν μέγαν
  choice: un grand deuil
  rationale: κοπετός désigne une lamentation ou un deuil intense, souvent public. « Un grand deuil » est naturel en français et conserve l’intensité de μέγαν.
- source_word: πᾶς Ἰσραήλ
  choice: Tout Israël
  rationale: Expression collective qui désigne le peuple dans son ensemble; la formulation française est à la fois littérale et idiomatique.
- source_word: ἐπένθησαν
  choice: ils le pleurèrent
  rationale: πενθέω exprime le deuil, particulièrement après un décès. « Pleurer quelqu’un » est une tournure française naturelle et évite la répétition immédiate de « deuil ».
- source_word: ἡμέρας πολλὰς
  choice: pendant de nombreux jours
  rationale: L’accusatif grec marque la durée; « pendant » l’explicite naturellement en français.
