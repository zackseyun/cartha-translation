  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: fr
  text: 'Et ils dirent : « Ne nous traite pas selon nos mauvaises actions, mais selon ta miséricorde. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρήσῃ
  choice: traite
  rationale: Le moyen χράομαι, construit ici avec le datif et κατά, exprime la manière d’agir envers quelqu’un. « Traiter » est naturel en français et conserve ce sens relationnel.
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: selon nos mauvaises actions
  rationale: Le pluriel πονηρίας peut désigner des manifestations concrètes du mal. « Mauvaises actions » restitue ce pluriel et sa portée morale dans un français courant, sans l’abstraire en une simple disposition intérieure.
- source_word: ἔλεός
  choice: miséricorde
  rationale: Ἔλεος désigne la miséricorde ou la compassion. « Miséricorde » convient particulièrement à cette supplication qui oppose les fautes commises au traitement clément demandé.
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: Ne nous traite pas
  rationale: La tournure négative exprime une demande directe. Cette formulation française est claire, digne et fidèle au ton suppliant.
theological_decisions:
- issue: Contraste pénitentiel entre les fautes et la miséricorde
  choice: Maintenir directement l’opposition entre un traitement conforme à leurs mauvaises actions et un traitement conforme à la miséricorde de l’interlocuteur.
  alternative: Expliciter un jugement mérité ou une miséricorde divine et alliancielle.
  rationale: Le grec formule une supplication fondée sur la miséricorde sans expliciter davantage l’identité de l’interlocuteur ni ajouter un cadre doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. Le pluriel concret « mauvaises actions » reflète τὰς πονηρίας, tandis que « miséricorde » conserve la tonalité biblique de la supplication.
