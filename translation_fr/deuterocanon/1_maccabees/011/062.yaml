base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: fr
  text: Les gens de Gaza firent appel à Jonathan, qui leur donna des garanties[b]. Il prit comme otages les fils de leurs dirigeants et les envoya à Jérusalem[a]. Puis il parcourut le pays jusqu’à Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec comporte ici, après « Jérusalem », le mot isolé « Asalim » (Ἀσαλήμ). Comme il s’intègre mal à la phrase, il pourrait s’agir d’une altération du texte ou d’un nom de lieu introduit accidentellement dans cette tradition manuscrite.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « il leur donna des mains droites », geste exprimant des engagements ou des garanties de bonne foi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν οἱ ἀπὸ Γάζης Ἰωνάθαν
  choice: Les gens de Gaza firent appel à Jonathan
  rationale: Le verbe ἀξιόω peut ici exprimer une requête ou un appel adressé à Jonathan. « Firent appel à » reste naturel en français et évite de préciser indûment qu’il s’agissait formellement d’une demande de paix.
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: qui leur donna des garanties
  rationale: Littéralement, Jonathan « leur donna des mains droites » ; dans ce contexte diplomatique, le geste exprime des engagements ou des garanties de bonne foi. La note conserve l’image grecque.
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: les fils de leurs dirigeants
  rationale: ἄρχοντες désigne les personnes qui gouvernent ou dirigent la cité. « Dirigeants » convient au contexte politique sans suggérer un titre plus précis que le grec.
- source_word: εἰς ὅμηρα
  choice: comme otages
  rationale: La tournure indique la fonction assignée aux fils des dirigeants ; « comme otages » est l’équivalent français direct et naturel.
- source_word: διῆλθεν τὴν χώραν
  choice: il parcourut le pays
  rationale: διέρχομαι avec χώρα décrit le déplacement à travers un territoire. « Parcourut le pays » rend le mouvement sans donner à χώρα le sens moderne d’un État national.
- source_word: ἕως Δαμασκοῦ
  choice: jusqu’à Damas
  rationale: Rendu spatial direct et idiomatique de ἕως suivi du nom de lieu.
- source_word: Ἀσαλήμ
  choice: omis du corps du texte et signalé en note
  rationale: Ce mot isolé, placé après « Jérusalem » dans le témoin grec fourni, ne s’intègre pas clairement à la syntaxe. Le conserver en note respecte le témoin sans introduire dans le récit un lieu ou un sens incertain.
