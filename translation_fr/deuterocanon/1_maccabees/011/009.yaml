  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: fr
  text: 'Il envoya des ambassadeurs au roi Démétrios et lui fit dire : « Viens, concluons une alliance entre nous[a]. Je te donnerai ma fille, celle qu’Alexandre a[b], et tu régneras sur le royaume de ton père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « concluons un pacte entre nous ». Le grec emploie διαθήκη, terme désignant un engagement formel, souvent rendu par « alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ma fille qu’Alexandre a ». Dans le contexte, il s’agit vraisemblablement de la fille qu’Alexandre a pour épouse, mais le grec ne l’explicite pas dans cette proposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Aoriste narratif courant de ἀποστέλλω ; « envoya » est naturel et fidèle.
- source_word: πρέσβεις
  choice: des ambassadeurs
  rationale: Le terme désigne ici des représentants diplomatiques officiels plutôt que de simples messagers.
- source_word: λέγων
  choice: et lui fit dire
  rationale: Cette tournure française rend naturellement le participe introduisant le contenu du message transmis par les ambassadeurs.
- source_word: Δεῦρο
  choice: Viens
  rationale: L’impératif garde l’invitation directe et pressante du grec.
- source_word: συνθώμεθα ... διαθήκην
  choice: concluons une alliance
  rationale: Dans ce contexte dynastique et diplomatique, l’expression désigne l’établissement d’un pacte formel ; « alliance » conserve sa portée politique sans suggérer un simple arrangement informel.
- source_word: πρὸς ἑαυτούς
  choice: entre nous
  rationale: Expression réciproque idiomatique et concise en français.
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: Je te donnerai ma fille
  rationale: La formulation préserve le langage direct d’une alliance matrimoniale sans ajouter d’explication au corps du texte.
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: celle qu’Alexandre a auprès de lui
  rationale: Cette formulation conserve l’idée minimale de ἔχει tout en évitant en français l’ambiguïté familière ou possessive de « qu’Alexandre a » ; la note explicite le contexte matrimonial.
- source_word: βασιλεύσεις
  choice: tu régneras
  rationale: Le futur verbal restitue directement l’action royale exprimée par βασιλεύω.
- source_word: τῆς βασιλείας τοῦ πατρός σου
  choice: sur le royaume de ton père
  rationale: Avec βασιλεύω, le génitif désigne naturellement le domaine sur lequel s’exerce le règne ; ici βασιλεία renvoie au royaume paternel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les termes diplomatiques restent accessibles ; le discours direct conserve la vigueur et la structure du grec sans expliciter dans le verset ce que seul le contexte matrimonial permet d’inférer.
