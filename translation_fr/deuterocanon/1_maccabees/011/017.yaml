  text: And Zabdiel the Arab cut off Alexander’s head and sent it to Ptolemy.
translation:
  language: fr
  text: Zabdiel l’Arabe trancha la tête d’Alexandre et l’envoya à Ptolémée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεῖλεν
  choice: coupa
  rationale: Avec « la tête » comme complément direct, le verbe désigne ici le fait de la détacher du corps. « Coupa la tête » exprime clairement et naturellement la décapitation en français moderne.
- source_word: Ζαβδιὴλ
  choice: Zabdiel
  rationale: Le nom propre est translittéré selon sa forme française usuelle.
- source_word: ὁ Ἀραβ
  choice: l’Arabe
  rationale: L’expression grecque est une désignation ethnique en apposition qui identifie Zabdiel ; « l’Arabe » en est le rendu français direct et idiomatique.
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: la tête d’Alexandre
  rationale: Le génitif grec est rendu naturellement par un complément introduit par « de », sans modifier la relation exprimée.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Ce verbe narratif courant correspond directement à l’action d’envoyer ; le pronom « l’ » reprend naturellement « la tête ».
- source_word: τῷ Πτολεμαίῳ
  choice: à Ptolémée
  rationale: Le grec nomme Ptolémée sans lui attribuer ici le titre de roi ; la traduction n’ajoute donc aucun titre.
