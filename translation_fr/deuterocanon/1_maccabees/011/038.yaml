translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des termes courants (« pays », « troupes », « renvoya ») tout en conservant les formulations historiques particulières du grec. Les deux ambiguïtés principales—le possible statut mercenaire des troupes étrangères et le sens dynastique des troupes « venant des pères »—sont maintenues ou explicitées en notes.
