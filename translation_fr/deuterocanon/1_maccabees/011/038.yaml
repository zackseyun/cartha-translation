base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: fr
  text: Le roi Démétrios vit que le pays était tranquille devant lui et que rien ne lui résistait. Il renvoya donc toutes ses troupes, chacune à son propre lieu, à l’exception des troupes étrangères[a] qu’il avait recrutées depuis les îles des nations. Toutes les troupes qui remontaient à ses pères[b] lui devinrent hostiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « troupes mercenaires ». Le grec désigne précisément des troupes étrangères et peut impliquer qu’elles étaient engagées contre salaire.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque, littéralement « les troupes venant des pères », est condensée. Elle désigne probablement les troupes traditionnelles associées aux prédécesseurs de Démétrios, par opposition aux troupes étrangères qu’il avait gardées.
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: le pays était tranquille devant lui
  rationale: « Pays » désigne naturellement le territoire du royaume; « était tranquille » conserve le sens politique et militaire sans affirmer une paix complète. « Devant lui » maintient l’image grecque et son rapport implicite à son autorité.
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: rien ne lui résistait
  rationale: Cette formulation française naturelle exprime l’absence continue d’opposition suggérée par la forme verbale grecque.
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: il renvoya donc toutes ses troupes
  rationale: Dans ce contexte militaire, « renvoya » rend l’idée de congédier ou de laisser repartir les unités, sans impliquer nécessairement leur dissolution définitive.
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: chacun dans son lieu
  rationale: 'Le singulier distributif du grec est préservé. « Lieu » reste ouvert: domicile, région d’origine ou lieu d’affectation.'
- source_word: ξένων δυνάμεων
  choice: troupes étrangères
  rationale: Le grec désigne des troupes non indigènes et peut évoquer des mercenaires, mais « étrangères » évite de rendre obligatoire cette nuance possible.
- source_word: ἐξενολόγησεν
  choice: avait recrutées
  rationale: Le verbe signifie recruter ou enrôler des étrangers; « recrutées » rend ce sens sans préciser indûment qu’elles avaient été engagées contre salaire.
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: dans les îles des nations
  rationale: Cette traduction conserve la construction grecque et le terme « nations », sans transformer les îles elles-mêmes en « îles étrangères ».
- source_word: ἠχθρασαν αὐτῷ
  choice: lui devinrent hostiles
  rationale: La formulation restitue la naissance ou la manifestation d’une hostilité envers Démétrios.
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: toutes les troupes héritées de ses pères
  rationale: L’expression grecque est condensée. Cette traduction fait ressortir le contraste probable entre les troupes traditionnelles de la dynastie et les troupes étrangères conservées, tout en signalant l’interprétation par une note.
