review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « héritées de ses pères » présente comme certaine une interprétation dynastique qui reste implicite dans αἱ ἀπὸ τῶν πατέρων. « Depuis les îles » rend plus exactement ἀπό, indiquant la provenance des troupes recrutées.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « Chacun dans son lieu » est cependant peu idiomatique et s’accorde mal avec « troupes » ; « chacune à son propre lieu » conserve la valeur distributive sans imposer « domicile » ou « poste ».
  terminology: « Pays », « troupes étrangères », « recrutées » et « devinrent hostiles » sont des choix justes. « Les troupes qui remontaient à ses pères » conserve l'ambiguïté de la formule grecque tout en restant intelligible en français moderne.
  issues:
  - severity: medium
    issue: « héritées de ses pères » est trop interprétatif pour αἱ ἀπὸ τῶν πατέρων.
    rationale: Le grec dit littéralement des forces « venant des pères » et peut évoquer des troupes traditionnelles ou antérieures. L’idée d’un héritage direct est plausible, mais ne doit pas être imposée dans le texte principal.
  - severity: low
    issue: « dans les îles des nations » ne rend pas pleinement la provenance marquée par ἀπό.
    rationale: Les troupes sont recrutées à partir/provenant des îles ; « depuis les îles des nations » explicite naturellement ce rapport.
  - severity: low
    issue: « chacun dans son lieu » est maladroit dans ce contexte.
    rationale: La tournure est peu naturelle avec l’antécédent féminin pluriel « troupes ». Une formulation distributive féminine améliore le français tout en conservant l’indétermination de τόπος.
