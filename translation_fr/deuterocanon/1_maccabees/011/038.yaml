revisions:
- from: Le roi Démétrios vit que le pays était tranquille devant lui et que rien ne lui résistait. Il renvoya donc toutes ses troupes, chacun dans son lieu, à l’exception des troupes étrangères[a] qu’il avait recrutées dans les îles des nations. Alors toutes les troupes héritées de ses pères[b] lui devinrent hostiles.
  to: Le roi Démétrios vit que le pays était tranquille devant lui et que rien ne lui résistait. Il renvoya donc toutes ses troupes, chacune à son propre lieu, à l’exception des troupes étrangères[a] qu’il avait recrutées depuis les îles des nations. Toutes les troupes qui remontaient à ses pères[b] lui devinrent hostiles.
