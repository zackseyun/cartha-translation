base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: fr
  text: Ptolémée entra dans Antioche et ceignit le diadème de l’Asie ; il mit deux diadèmes sur sa tête, celui de l’Asie et celui de l’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste narratif indique simplement l’entrée dans la ville ; « entra » est direct et naturel en français.
- source_word: περιέθετο
  choice: ceignit / mit sur sa tête
  rationale: Le moyen exprime le geste de placer sur soi. « Ceignit » convient au diadème dans la première proposition, tandis que « mit sur sa tête » rend concrètement la répétition explicative.
- source_word: διάδημα
  choice: diadème
  rationale: Le grec désigne précisément l’insigne royal porté autour de la tête. « Diadème » conserve la valeur historique et permet de rendre uniformément la répétition du même terme grec.
- source_word: τῆς Ἀσίας
  choice: de l’Asie
  rationale: Le texte dit simplement « de l’Asie ». La traduction n’explicite pas le royaume séleucide et préserve ainsi la formulation géographique et politique de la source.
- source_word: δύο διαδήματα
  choice: deux diadèmes
  rationale: La traduction garde le nombre et répète le même nom, comme le grec, afin de souligner le port simultané des deux insignes royaux.
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: sur sa tête
  rationale: Bien que περί puisse évoquer ce qui entoure la tête, « sur sa tête » est la formulation française naturelle pour le port de ces insignes.
theological_decisions:
- issue: Symbolisme royal des deux diadèmes
  choice: Décrire concrètement Ptolémée portant les deux diadèmes
  alternative: Expliciter qu’il revendiquait la souveraineté sur l’Asie et l’Égypte
  rationale: Le geste a une portée politique manifeste, mais le grec la communique par une action symbolique concrète. La traduction évite d’intégrer au texte une interprétation qui n’y est pas formulée.
translation_notes:
  register: Français moderne, narratif et digne. « Diadème » est légèrement soutenu mais précis, courant dans un contexte royal ancien. L’ajout de « ainsi » rend intelligible la relation entre le premier geste et le constat de deux diadèmes, sans modifier le contenu.
