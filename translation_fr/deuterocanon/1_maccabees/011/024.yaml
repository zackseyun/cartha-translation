  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: fr
  text: Il prit de l’argent, de l’or, des vêtements et beaucoup d’autres présents, puis se rendit auprès du roi à Ptolémaïs et trouva grâce à ses yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: Il prit
  rationale: Le participe aoriste introduit une action qui précède et accompagne le déplacement. Une forme verbale coordonnée rend naturellement la succession en français.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Le sens premier est le métal « argent »; son association avec l’or dans cette énumération favorise ce sens plutôt que celui de monnaie.
- source_word: χρυσίον
  choice: de l’or
  rationale: Terme matériel direct dans la liste des présents.
- source_word: ἱματισμόν
  choice: des vêtements
  rationale: Désigne des habits offerts parmi les présents; « vêtements » est courant, clair et digne en français moderne.
- source_word: ἕτερα ξένια πλείονα
  choice: beaucoup d’autres présents
  rationale: ξένια désigne ici des dons d’hospitalité ou de nature diplomatique; « présents » convient au contexte de cour. πλείονα et ἕτερα indiquent qu’ils sont nombreux et s’ajoutent aux objets déjà cités.
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: se rendit auprès du roi à Ptolémaïs
  rationale: Cette formulation conserve à la fois le mouvement vers le roi et la destination géographique, dans un français naturel.
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: trouva grâce à ses yeux
  rationale: Expression biblique française naturelle qui préserve l’image de la faveur trouvée devant le roi; le pronom renvoie à celui-ci.
