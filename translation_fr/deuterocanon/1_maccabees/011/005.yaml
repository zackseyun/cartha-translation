base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/005.yaml
  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
translation:
  language: fr
  text: Ils racontèrent au roi ce que Jonathan avait fait, afin de l’accuser[a] ; mais le roi garda le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de le blâmer » ou « afin de le dénigrer ». Le verbe grec peut désigner le blâme ou le discrédit, aussi bien qu’une accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: racontèrent
  rationale: Le verbe désigne le fait de relater ou d’exposer des événements. « Racontèrent au roi » est naturel en français et n’impose pas la nuance plus administrative de « rapportèrent ».
- source_word: ἃ ἐποίησεν Ἰωνάθαν
  choice: ce que Jonathan avait fait
  rationale: Le plus-que-parfait rend clairement l’antériorité des actes de Jonathan par rapport au récit fait au roi.
- source_word: εἰς τὸ ψογίσαι αὐτόν
  choice: afin de l’accuser
  rationale: La construction exprime le but. Dans cette scène de dénonciation auprès du roi, « accuser » convient au contexte, tandis qu’une note préserve les sens plus larges de blâme et de dénigrement.
- source_word: ἐσίγησεν
  choice: garda le silence
  rationale: Cette expression française naturelle rend l’absence de réponse du roi et peut suggérer un silence délibéré sans préciser davantage son intention.
- source_word: ὁ βασιλεύς
  choice: le roi
  rationale: Traduction habituelle et directe du titre.
