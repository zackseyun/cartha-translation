  text: Now then[a], take care to make a copy of these things, and let it be given to Jonathan, and let it be placed on the holy mountain in a prominent place.
translation:
  language: fr
  text: Maintenant donc, veillez à faire une copie de ces écrits, qu’elle soit remise à Jonathan et déposée sur la montagne sainte, dans un endroit bien en vue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Cette tournure conserve à la fois la transition et la valeur conclusive de l’expression grecque, dans un registre administratif digne.
- source_word: ἐπιμελεῖσθε
  choice: veillez à
  rationale: L’impératif moyen demande de prendre personnellement soin de l’exécution de l’ordre; « veillez à » est naturel et précis en français moderne.
- source_word: τοῦ ποιῆσαι … ἀντίγραφον
  choice: à faire une copie
  rationale: L’expression désigne la production d’une copie écrite; cette formulation est claire sans surinterpréter la nature matérielle du document.
- source_word: τούτων
  choice: de ces écrits
  rationale: Le démonstratif pluriel renvoie au contenu écrit qui précède. « Ces écrits » garde le pluriel tout en rendant explicite le contexte documentaire, sans le réduire à un seul décret.
- source_word: δοθήτω Ἰωνάθαν
  choice: qu’elle soit remise à Jonathan
  rationale: Le passif impératif est conservé par le subjonctif de directive; « remise » convient mieux qu’un simple « donnée » dans le contexte d’un document officiel.
- source_word: τεθήτω
  choice: déposée
  rationale: Le verbe décrit le placement officiel de la copie. « Déposée » est naturel dans un contexte documentaire et n’ajoute pas l’idée technique d’archivage.
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: sur la montagne sainte
  rationale: « Sur » est idiomatique en français pour un emplacement topographique; « montagne sainte » conserve la désignation grecque sans identifier explicitement le lieu.
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: dans un endroit bien en vue
  rationale: ἐπίσημος indique ici un emplacement visible, remarquable ou publiquement identifiable. « Bien en vue » exprime naturellement cette visibilité en français.
