base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/049.yaml
  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: fr
  text: 'Les habitants de la ville virent que les Juifs avaient pris le contrôle de la ville comme ils le voulaient. Ils perdirent courage et crièrent au roi en le suppliant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: les habitants de la ville
  rationale: L’expression désigne les personnes qui se trouvent dans la ville, vraisemblablement ses habitants ou ses défenseurs. Cette formulation est naturelle en français sans conserver le sens spatial littéral inadapté de ὑπό.
- source_word: κατεκράτησαν … τῆς πόλεως
  choice: en avaient pris le contrôle
  rationale: Avec le génitif, κατακρατέω exprime ici la maîtrise exercée sur la ville. Le plus-que-parfait marque naturellement l’antériorité de cette prise de contrôle par rapport à leur constat.
- source_word: ὡς ἠβούλοντο
  choice: comme ils le voulaient
  rationale: La proposition indique que la maîtrise acquise par les Juifs correspondait à leur volonté, sans préciser davantage la nature de leur projet.
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: ils perdirent courage
  rationale: Littéralement, ils « s’affaiblirent dans leurs pensées ». L’expression décrit l’effondrement de leur courage ou de leur résolution; la tournure française choisie en restitue naturellement le sens.
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα
  choice: crièrent vers le roi
  rationale: κράζω est un verbe fort, qui évoque un cri ou un appel pressant. « Vers le roi » conserve l’orientation de πρὸς sans réduire le geste à une simple démarche formelle.
- source_word: μετὰ δεήσεως
  choice: pour le supplier
  rationale: δέησις désigne une supplication ou une requête pressante. La construction verbale est claire et courante en français moderne.
- source_word: λέγοντες
  choice: ':'
  rationale: Le participe introduit les paroles rapportées au verset suivant. En français, les deux-points assurent cette liaison plus naturellement qu’un calque tel que « en disant ».
