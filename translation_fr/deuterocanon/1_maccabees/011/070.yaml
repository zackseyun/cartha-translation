base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/070.yaml
  text: Not one of them was left[a], except Mattathias son of Absalom and Judas son of Chalphi, commanders of the forces of the army.
translation:
  language: fr
  text: Pas un seul d’entre eux ne resta, à l’exception de Mattathias, fils d’Absalom, et de Judas, fils de Chalphi, chefs des forces de l’armée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de l’armée et de ses troupes ». Le grec emploie deux termes militaires, στρατιά et δυνάμεις; leur relation exacte peut être comprise et rendue de plusieurs manières.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: Pas un seul
  rationale: Cette tournure conserve l’insistance du grec sur l’absence totale de toute autre personne du groupe.
- source_word: κατελείφθη ἀπʼ αὐτῶν
  choice: d’entre eux ne resta
  rationale: Le passif grec exprime ici le fait qu’aucun autre ne demeura; cette formulation française est naturelle sans préciser indûment qu’ils auraient été «laissés derrière».
- source_word: πλὴν
  choice: à l’exception de
  rationale: Rend clairement la valeur exceptive du terme grec dans un registre digne et courant.
- source_word: Ματταθίας ὁ τοῦ Ἀψαλώμου
  choice: Mattathias, fils d’Absalom
  rationale: Dans cette formule d’identification, l’article suivi du génitif indique la filiation ou l’appartenance familiale; «fils de» est ici la traduction normale.
- source_word: Ἰούδας ὁ τοῦ Χαλφεί
  choice: Judas, fils de Chalphi
  rationale: La même construction génitivale identifie Judas par son père ou sa famille.
- source_word: ἄρχοντες
  choice: qui commandaient
  rationale: Dans ce contexte militaire, le mot désigne l’exercice du commandement; la forme verbale évite une apposition française lourde.
- source_word: τῆς στρατιᾶς τῶν δυνάμεων
  choice: les troupes de l’armée
  rationale: Le grec juxtapose deux termes militaires. Cette formulation en préserve le doublet de façon intelligible et naturelle, sans prétendre fixer plus précisément leur rapport.
