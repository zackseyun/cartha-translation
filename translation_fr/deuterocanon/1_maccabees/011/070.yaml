review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : personne d’autre ne demeura, sauf les deux hommes nommés. Toutefois, ἄρχοντες est un participe substantivé/appositif (« chefs, commandants ») et non un verbe à l’imparfait (« qui commandaient »). La formulation révisée conserve aussi plus directement la relation génitivale de τῆς στρατιᾶς τῶν δυνάμεων.'
  naturalness: « Pas un seul d’entre eux ne resta » est naturel et garde l’emphase. « Chefs des forces de l’armée » est sobre, idiomatique dans un récit militaire, et plus précis que « qui commandaient les troupes de l’armée ».
  terminology: « Mattathias », « Absalom », « Judas » et « Chalphi » sont conservés. « Chefs » rend ici ἄρχοντες sans lui attribuer une nuance politique excessive. « Forces » et « armée » maintiennent les deux termes militaires grecs; la note signale prudemment que leur rapport syntaxique exact reste discutable.
  issues:
  - severity: medium
    issue: « qui commandaient » transforme l’apposition ἄρχοντες en proposition verbale à l’imparfait.
    rationale: Le grec désigne les deux hommes comme des chefs/commandants; il n’exprime pas explicitement un procès passé ou duratif. Une apposition nominale préserve mieux la forme et la portée du texte source.
  - severity: medium
    issue: La note actuelle propose « les chefs de l’armée et de ses forces ».
    rationale: Cette paraphrase coordonne « armée » et « forces » et introduit « ses », alors que le grec les lie dans une construction génitivale dont la relation précise est incertaine. La note doit exposer l’ambiguïté sans imposer cette analyse.
  revised_text: Pas un seul d’entre eux ne resta, à l’exception de Mattathias, fils d’Absalom, et de Judas, fils de Chalphi, chefs des forces de l’armée.[a]
