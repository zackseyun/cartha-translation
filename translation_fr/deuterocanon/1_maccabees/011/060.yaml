base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: fr
  text: Jonathan partit et passa au-delà du fleuve[a] et dans les villes. Toutes les forces de Syrie se rassemblèrent auprès de lui comme alliées[b]. Il arriva à Ascalon, et les habitants de la ville vinrent à sa rencontre avec honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit seulement « le fleuve », sans le nommer ; son identification géographique demeure incertaine.
    reason: cultural_note
  - marker: b
    text: 'Autres traductions possibles : « en vue d’une alliance » ou « pour s’allier à lui ». Le grec peut exprimer le but ou le résultat de leur rassemblement auprès de Jonathan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλεν Ἰωνάθᾳ
  choice: Jonathan se mit en route
  rationale: Le contexte narratif présente Jonathan comme sujet du déplacement. « Se mit en route » rend naturellement ἐξῆλεν sans ajouter une nuance militaire que le verbe n’impose pas.
- source_word: διεπορεύετο
  choice: parcourut
  rationale: Le verbe décrit la progression de Jonathan dans la région. « Parcourut » restitue ce mouvement continu dans un français narratif naturel.
- source_word: πέραν τοῦ ποταμοῦ
  choice: la région au-delà du Fleuve
  rationale: Le grec ne nomme pas le cours d’eau. La majuscule signale l’emploi quasi géographique de « Fleuve » sans identifier explicitement l’Euphrate dans le texte.
- source_word: ἐν ταῖς πόλεσιν
  choice: ainsi que les villes
  rationale: Avec le verbe de déplacement, l’expression indique que Jonathan passa aussi par les villes. Cette formulation évite le calque peu naturel « dans les villes ».
- source_word: ἠθροίσθησαν πρὸς αὐτόν
  choice: se rallièrent à lui
  rationale: L’expression décrit des forces qui se regroupent auprès de Jonathan. « Se rallièrent » communique à la fois le rassemblement et leur soutien, sans suggérer qu’elles lui étaient hostiles.
- source_word: πᾶσαι αἱ δυνάμεις Συρίας
  choice: toutes les troupes de Syrie
  rationale: Dans ce contexte militaire, δυνάμεις désigne des forces armées. « Troupes » est clair et courant en français.
- source_word: εἰς συμμαχίαν
  choice: pour former une alliance
  rationale: La préposition εἰς peut exprimer le but ou le résultat. Cette formulation conserve l’idée d’entrée dans une alliance tout en restant idiomatique.
- source_word: Ἀσκαλῶνα
  choice: Ascalon
  rationale: « Ascalon » est la forme française traditionnelle et courante du nom de cette ville antique.
- source_word: ἀπήντησαν αὐτῷ οἱ ἐκ τῆς πόλεως
  choice: les habitants de la ville vinrent à sa rencontre
  rationale: Le grec désigne littéralement « ceux de la ville » et emploie un verbe pouvant signifier aller à la rencontre de quelqu’un. La traduction explicite naturellement les habitants comme sujet.
- source_word: ἐνδόξως
  choice: avec de grands honneurs
  rationale: L’adverbe décrit une réception honorable ou solennelle. « Avec de grands honneurs » en exprime clairement le caractère prestigieux.
