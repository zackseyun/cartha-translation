base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: fr
  text: Mais lorsqu’il approcha d’Asdod, on lui montra le temple de Dagon incendié, Asdod et les localités des alentours[a] démolies, les cadavres jetés çà et là, ainsi que ceux qu’il avait brûlés pendant la guerre ; car on en avait fait des amas[b] le long de son chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses faubourgs » ou « ses districts périphériques ».
    reason: lexical_alternative
  - marker: b
    text: 'Le sens précis du rare terme grec est incertain : il peut désigner des « amas », des « tertres » ou peut-être des « bûchers funéraires ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: approcha
  rationale: Le verbe exprime simplement le fait de se rapprocher d’un lieu ; « approcha » est naturel et précis.
- source_word: Ἄζωτον
  choice: Asdod
  rationale: « Asdod » est la forme française courante du nom biblique, plutôt qu’une translittération de la forme grecque Azôtos.
- source_word: ἱερὸν Δαγὼν
  choice: le temple de Dagon
  rationale: Dans ce contexte cultuel, ἱερόν désigne clairement le temple ou sanctuaire consacré à Dagon ; « temple » est le terme le plus accessible.
- source_word: ἐνεπυρισμένον
  choice: incendié
  rationale: Le participe parfait présente le temple dans l’état résultant de sa mise à feu. « Incendié » conserve cette idée sans préciser au-delà du grec qu’il aurait été entièrement consumé.
- source_word: τὰ περιπόλια αὐτῆς
  choice: les localités des alentours
  rationale: περιπόλια désigne les lieux habités ou districts autour de la ville. Cette formulation convient mieux au cadre ancien que « banlieues » et reste assez large.
- source_word: καθῃρημένα
  choice: démolies
  rationale: Le participe évoque ce qui a été abattu ou détruit. « Démolies » rend concrètement l’état des lieux montré au visiteur.
- source_word: τὰ σώματα ἐρριμμένα
  choice: les cadavres jetés çà et là
  rationale: Dans ce tableau de dévastation, σώματα désigne des corps sans vie, et ἐρριμμένα suggère qu’ils ont été abandonnés ou dispersés sans ordre.
- source_word: τοὺς ἐμπεπυρισμένους οὓς ἐνεπύρισε
  choice: ceux qu’il avait fait brûler
  rationale: La formulation conserve à la fois le participe désignant les personnes brûlées et le sujet singulier explicite du verbe grec, sans identifier ce sujet au-delà du contexte.
- source_word: ἐν τῷ πολέμῳ
  choice: pendant la guerre
  rationale: πόλεμος peut désigner l’ensemble du conflit plutôt qu’une seule bataille ; « pendant la guerre » en préserve la portée.
- source_word: βωμίας
  choice: amas
  rationale: Ce terme rare est incertain. « Amas » convient au contexte macabre tout en évitant de trancher en faveur de bûchers funéraires ou de tertres.
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: le long de son chemin
  rationale: L’expression indique que ces amas avaient été disposés sur l’itinéraire qu’il suivait ; la formulation française reste concrète et naturelle.
