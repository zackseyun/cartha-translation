  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: fr
  text: Mais lorsque Jonathan l’apprit, il ordonna de prendre position tout autour. Il choisit quelques-uns des anciens d’Israël et quelques-uns des prêtres, puis il l’exposa au danger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il le livra au danger ». Le grec porte un pronom masculin singulier (« lui »), dont le référent n’est pas explicite. Il peut vraisemblablement désigner Jonathan lui-même.'
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: de les encercler
  rationale: 'L’infinitif a ici un sens militaire : prendre position tout autour, cerner ou assiéger. Le sujet de l’infinitif est implicite et le pronom « les », fourni par le contexte, rend la phrase naturelle en français sans préciser davantage la forme du siège.'
- source_word: ἐπέλεξεν τῶν πρεσβυτέρων Ἰσραὴλ καὶ τῶν ἱερέων
  choice: Il choisit quelques-uns des anciens d’Israël et quelques-uns des prêtres
  rationale: 'Les génitifs après ἐπέλεξεν sont partitifs : Jonathan en choisit parmi les anciens et parmi les prêtres, et non nécessairement la totalité.'
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: s’exposa lui-même au danger
  rationale: L’expression avec δίδωμι et le datif de κίνδυνος indique l’exposition au danger. Dans la continuité du récit, Jonathan demeure le sujet le plus vraisemblable, mais la forme transmise αὐτόν signifie littéralement « lui » et non le réfléchi attendu ; cette difficulté est signalée en note.
theological_decisions:
- issue: Référence ambiguë de αὐτόν dans ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: Comprendre la proposition comme indiquant que Jonathan s’exposa lui-même au danger.
  alternative: « il l’exposa au danger », en prenant αὐτόν comme un objet masculin singulier distinct de Jonathan.
  rationale: Il s’agit d’une difficulté textuelle et syntaxique, non d’une question doctrinale. Le fil narratif favorise l’auto-exposition de Jonathan, tandis que la note conserve la formulation littérale du grec et rend visible l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. « Lorsque Jonathan l’apprit » évite la lourdeur d’un complément absent après « entendit ». « Anciens d’Israël » et « prêtres » conservent la terminologie institutionnelle traditionnelle tout en restant immédiatement compréhensibles.
