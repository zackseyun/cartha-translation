lexical_decisions:
- source_word: Ἀλέξανδρος ὁ βασιλεὺς
  choice: le roi Alexandre
  rationale: Ordre naturel en français pour le titre défini suivi du nom propre.
- source_word: ἦν ἐν Κιλικίᾳ
  choice: se trouvait en Cilicie
  rationale: Rend clairement la situation géographique dans un récit, sans ajouter une idée de mouvement.
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: alors
  rationale: Expression temporelle idiomatique et concise qui situe l’événement à l’époque évoquée.
- source_word: ὅτι
  choice: parce que
  rationale: Conserve le rapport causal explicite entre la présence d’Alexandre en Cilicie et la révolte.
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: les habitants de ces régions
  rationale: Formulation française naturelle pour le groupe humain rattaché aux lieux en question; elle explicite seulement le référent humain déjà indiqué par l’article substantivé grec.
- source_word: ἀπεστάτουν
  choice: s’étaient révoltés
  rationale: Le plus-que-parfait exprime naturellement en français la révolte qui motive la présence du roi; « se révolter » convient au contexte politique.
