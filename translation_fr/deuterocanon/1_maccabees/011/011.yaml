translation:
  language: fr
  text: Et il lui fit des reproches parce qu’il désirait son royaume[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « convoitait son royaume ». Dans ce contexte, le verbe grec traduit par « désirait » peut avoir le sens plus fort de « convoitait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  choice: lui fit des reproches
  rationale: Le verbe ψογίζω signifie blâmer, censurer ou faire des reproches. Cette formulation naturelle en français conserve la portée personnelle de l’accusation sans la renforcer en condamnation formelle.
- source_word: χάριν τοῦ
  choice: parce que
  rationale: La construction χάριν avec l’infinitif substantivé exprime ici la cause. « Parce que » la rend clairement et naturellement.
- source_word: ἐπιθυμῆσαι
  choice: désirait
  rationale: ἐπιθυμέω peut exprimer un désir neutre ou, selon le contexte, une convoitise répréhensible. « Désirait » reste proche du grec et laisse le reproche formulé dans la phrase lui donner sa coloration négative.
- source_word: τῆς βασιλείας
  choice: son royaume
  rationale: βασιλεία peut désigner le royaume, la royauté ou le règne. Dans ce contexte de rivalité politique, « royaume » est direct et idiomatique.
- source_word: αὐτὸν ... αὐτοῦ
  choice: lui ... son
  rationale: Cette formulation conserve la structure pronominale compacte du grec et son ambiguïté grammaticale, même si le contexte suggère naturellement qu’il désirait le royaume de celui qui lui faisait des reproches.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Faire des reproches » est plus naturel que « reprocher quelqu’un » et évite la force plus marquée de « réprimander ». L’ambiguïté des pronoms du grec est conservée.
