  register: Français international moderne, narratif et digne. La syntaxe a été légèrement répartie en deux phrases pour éviter une longue accumulation de coordinations, tout en maintenant l’enchaînement logique du grec. Aucun terme confessionnel ni développement interprétatif n’a été ajouté.
