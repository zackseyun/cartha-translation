base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
translation:
  language: fr
  text: Le roi d’Égypte rassembla des forces nombreuses, aussi nombreuses que le sable au bord de la mer, ainsi qu’un grand nombre de navires. Il chercha à s’emparer par la ruse du royaume d’Alexandre et à l’ajouter à son propre royaume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθροισεν
  choice: rassembla
  rationale: L’aoriste de ἀθροίζω désigne l’action de réunir ou de rassembler; « rassembla » convient naturellement à une mobilisation militaire sans la préciser davantage.
- source_word: δυνάμεις πολλὰς
  choice: des forces nombreuses
  rationale: Dans ce récit militaire, δυνάμεις désigne des forces armées. Cette formulation reste proche du grec sans réduire le sens à des troupes particulières ni suggérer plusieurs armées autonomes.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: aussi nombreuses que le sable au bord de la mer
  rationale: La comparaison biblique exprime une quantité immense. La reprise de « nombreuses » rend explicite en français que l’image porte sur l’effectif des forces, tout en conservant l’image du sable marin.
- source_word: πλοῖα πολλά
  choice: un grand nombre de navires
  rationale: Rendu direct et idiomatique de πλοῖα πολλά; « navires » convient au contexte d’une flotte royale.
- source_word: ἐζήτησεν
  choice: il chercha
  rationale: ζητέω suivi de l’infinitif exprime ici une intention poursuivie ou une tentative; « chercha à » en conserve la nuance et le ton narratif.
- source_word: κατακρατῆσαι
  choice: à s’emparer de
  rationale: κατακρατέω peut signifier dominer, maîtriser ou prendre possession. Dans le contexte d’un royaume destiné à être ajouté au sien, « s’emparer de » exprime naturellement la prise de contrôle sans en spécifier le moyen militaire.
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: du royaume d’Alexandre
  rationale: βασιλεία désigne ici le territoire ou domaine royal plutôt que la royauté abstraite.
- source_word: δόλῳ
  choice: par la ruse
  rationale: δόλος désigne la tromperie ou la manœuvre rusée. « Par la ruse » est naturel en français et n’ajoute pas la gravité particulière que pourrait suggérer « trahison ».
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: à l’ajouter à son propre royaume
  rationale: La traduction garde le sens simple de προστίθημι, « ajouter », ainsi que le pronom féminin renvoyant à βασιλεία; « propre » met clairement en relief l’opposition entre le royaume d’Alexandre et celui du roi d’Égypte.
