base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
translation:
  language: fr
  text: Après cela, Tryphon revint, et Antiochos avec lui, un tout jeune garçon[a]. Celui-ci devint roi et ceignit le diadème[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un enfant très jeune ». Le grec παιδάριον νεώτερον souligne la très grande jeunesse d’Antiochos.
    reason: lexical_alternative
  - marker: b
    text: Ou « mit le diadème ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français, qui reprend l’ensemble des événements précédents sans lourdeur.
- source_word: ἀπέστρεψεν
  choice: revint
  rationale: Rend directement l’idée de retour exprimée par le verbe dans ce contexte narratif.
- source_word: καὶ Ἀντίοχος μετʼ αὐτοῦ
  choice: accompagné d’Antiochos
  rationale: Formulation française naturelle qui conserve le fait qu’Antiochos revient avec Tryphon.
- source_word: παιδάριον νεώτερον
  choice: qui était encore un jeune garçon
  rationale: Rend la grande jeunesse d’Antiochos et la nuance de νεώτερον sans supposer une comparaison précise avec une personne déterminée.
- source_word: ἐβασίλευσεν
  choice: devint roi
  rationale: Dans la séquence avec la prise du diadème, l’aoriste décrit vraisemblablement l’accession à la royauté plutôt que la durée d’un règne.
- source_word: ἐπέθετο διάδημα
  choice: ceignit le diadème
  rationale: Conserve le terme royal précis διάδημα et rend idiomatiquement l’acte de le placer sur soi.
theological_decisions:
- issue: Valeur de ἐβασίλευσεν
  choice: devint roi
  alternative: régna
  rationale: Le contexte immédiat d’intronisation favorise une valeur ingressive, mais le verbe peut aussi désigner simplement l’exercice de la royauté.
- issue: Désignation de διάδημα
  choice: diadème
  alternative: couronne
  rationale: « Diadème » est lexicalement plus précis pour l’insigne royal hellénistique; « couronne » serait plus courant mais moins spécifique.
translation_notes:
  register: Français moderne, narratif et digne. La phrase est légèrement restructurée pour lever l’ambiguïté française sur le sujet de l’accession au trône, sans modifier le référent grec.
