translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition juridique de ce qui « revient » au roi, tout en plaçant « désormais » de façon à marquer sans ambiguïté l’entrée en vigueur de la concession. Les deux termes administratifs historiquement incertains sont maintenus dans le texte et explicités en notes.
