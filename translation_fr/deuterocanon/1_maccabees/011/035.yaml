base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: fr
  text: Et, à partir de maintenant, tout le reste de ce qui nous revient — les dîmes et les taxes qui nous sont dues, les lacs salés[a] et les couronnes qui nous reviennent[b] —, nous leur accorderons tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les marais salants » ou « les salines ». Le grec dit littéralement « les lacs de sel »; il s’agit probablement de ressources servant à produire du sel, ou des revenus qui en provenaient.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « couronnes ». Dans ce contexte fiscal, le terme peut désigner un tribut coutumier sous la forme d’une couronne, ou un versement honorifique dû au roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα τὰ ἀνήκοντα ἡμῖν
  choice: les autres biens qui nous reviennent
  rationale: « Biens » garde l’expression assez large pour englober revenus, droits et ressources royales, tandis que « qui nous reviennent » exprime leur caractère dû ou réservé au roi.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Le terme indique que la concession prend effet à partir du moment présent. Sa place près de la proposition principale évite de laisser entendre que les biens ne commencent qu’alors à appartenir au roi.
- source_word: δεκατῶν
  choice: dîmes
  rationale: Équivalent français usuel du prélèvement d’un dixième, adapté au contexte fiscal.
- source_word: τελῶν
  choice: taxes
  rationale: Terme générique clair pour les prélèvements et droits fiscaux, sans les limiter aux seuls droits de douane.
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: les lacs salés
  rationale: Rend de près l’expression grecque, littéralement « les lacs de sel », tout en laissant en note les interprétations économiques plus précises.
- source_word: στεφάνους
  choice: couronnes
  rationale: Conserve le sens littéral et l’ambiguïté historique du terme; le possible sens fiscal est expliqué en note.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: nous leur accorderons tout
  rationale: Dans ce décret royal, l’expression indique que l’ensemble de ces ressources ou droits leur est concédé. « Accorder » restitue naturellement cette portée administrative.
