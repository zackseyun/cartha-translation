  yaml_path: translation/deuterocanon/1_maccabees/011/069.yaml
  text: But the ambushes rose up from their places and joined battle[a], and all those with Jonathan fled.
translation:
  language: fr
  text: Mais les hommes embusqués[a] surgirent de leurs positions et engagèrent le combat ; tous ceux qui étaient avec Jonathan s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les embuscades » ; le grec emploie le nom de la manœuvre pour désigner les combattants cachés.'
    reason: Précision lexicale sur une métonymie du texte grec.
lexical_decisions:
- source_word: τὰ ἔνεδρα
  choice: les hommes embusqués
  rationale: Le neutre pluriel désigne littéralement les « embuscades », mais le verbe d’action ἐξανέστησαν montre qu’il s’agit ici des combattants cachés. Cette formulation explicite naturellement les agents sans modifier la scène.
- source_word: ἐξανέστησαν
  choice: surgirent
  rationale: Dans ce contexte militaire, le verbe décrit les combattants qui quittent soudain leur cachette. « Surgirent » rend à la fois le mouvement et son caractère brusque.
- source_word: ἐκ τῶν τόπων ἑαυτῶν
  choice: de leurs positions
  rationale: τόποι signifie ici les emplacements occupés par les hommes en embuscade. « Positions » convient au contexte militaire tout en restant proche du grec.
- source_word: συνῆψαν πόλεμον
  choice: engagèrent le combat
  rationale: Cette expression idiomatique décrit l’entrée effective dans l’affrontement. « Engagèrent le combat » est une formulation française naturelle et précise.
- source_word: οἱ παρὰ Ἰωνάθαν πάντες
  choice: tous ceux qui étaient avec Jonathan
  rationale: παρά indique ici les personnes qui accompagnaient Jonathan ou se trouvaient à ses côtés ; πάντες est conservé explicitement par « tous ».
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Le verbe exprime la fuite devant l’ennemi. La forme pronominale est la tournure française naturelle dans ce contexte.
