lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: mirent le feu à
  rationale: 'Cette expression française naturelle conserve la valeur causative du verbe grec : ils provoquèrent l’incendie de la ville.'
- source_word: τὴν πόλιν
  choice: la ville
  rationale: πόλις désigne normalement une ville, avec l’article défini rendu en français.
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: prirent un important butin
  rationale: σκῦλα désigne le butin pris à la guerre. Le singulier collectif « butin », qualifié d’« important », rend naturellement la grande quantité exprimée par πολλὰ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ce jour-là
  rationale: Formulation temporelle idiomatique et fidèle en français moderne.
- source_word: ἔσωσαν
  choice: sauvèrent
  rationale: Le verbe signifie sauver ou arracher à un danger. « Sauvèrent » préserve son sens large sans préciser davantage les circonstances.
- source_word: τὸν βασιλέα
  choice: le roi
  rationale: Traduction directe du groupe nominal grec défini.
