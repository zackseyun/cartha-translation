base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: fr
  text: En ces jours-là, Jonathan rassembla ceux de Judée pour faire la guerre à la citadelle de Jérusalem[a], et ils construisirent contre elle de nombreuses machines de siège.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Acra », la place forte située dans Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: rassembla
  rationale: L’aoriste de συνάγω désigne ici le rassemblement de personnes dans un but militaire. « Rassembla » est naturel et ne suggère pas une assemblée officielle.
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: ceux de Judée
  rationale: La tournure grecque est elliptique et désigne des personnes originaires ou venues de Judée. Cette formulation évite d’ajouter « hommes », absent du texte.
- source_word: τοῦ ἐκπολεμῆσαι
  choice: pour faire la guerre à
  rationale: L’infinitif articulé exprime le but, et ἐκπολεμέω indique une action militaire hostile plus forte que le simple fait de combattre.
- source_word: τὴν ἄκραν τὴν ἐν Ἱερουσαλήμ
  choice: la citadelle de Jérusalem
  rationale: ἄκρα désigne une citadelle ou place forte et, ici, la forteresse séleucide appelée l’Acra. « De Jérusalem » rend naturellement sa localisation dans la ville, tandis que le nom technique est conservé en note.
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: ils construisirent contre elle
  rationale: Avec μηχαναί, ποιέω signifie fabriquer ou construire des dispositifs militaires. « Contre elle » conserve l’orientation hostile exprimée par ἐπί.
- source_word: μηχανὰς πολλάς
  choice: de nombreuses machines de siège
  rationale: Dans le contexte de l’attaque d’une place forte, μηχαναί désigne des engins ou machines militaires destinés au siège, non de simples machines.
