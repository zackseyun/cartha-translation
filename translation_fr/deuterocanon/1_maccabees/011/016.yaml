base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: fr
  text: Alexandre s’enfuit en Arabie pour y être mis à l’abri[a] ; mais le roi Ptolémée fut élevé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour y être abrité », « pour y être caché » ou « pour y être protégé ». L’expression grecque de but peut évoquer le refuge, la dissimulation ou la protection.
    reason: lexical_alternative
  - marker: b
    text: Ou « fut exalté » ou « devint puissant ». Plus littéralement, le grec dit qu’il « fut élevé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: L’aoriste de φεύγω désigne ici une fuite dans un contexte politico-militaire ; « s’enfuit » exprime naturellement ce mouvement sans préciser davantage ses circonstances.
- source_word: Ἀραβίαν
  choice: Arabie
  rationale: Forme française usuelle de ce nom de lieu.
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: pour y être mis à l’abri
  rationale: L’infinitif articulé avec τοῦ exprime le but, tandis que le passif de σκεπάζω peut évoquer le fait d’être abrité, caché ou protégé. « Être mis à l’abri » conserve la valeur passive et convient au contexte de fuite.
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: mais le roi Ptolémée
  rationale: δέ marque ici le contraste entre la fuite d’Alexandre et l’élévation de Ptolémée.
- source_word: ὑψώθη
  choice: fut élevé
  rationale: Le passif de ὑψόω signifie littéralement « fut élevé ». Ce choix maintient ouverte la portée politique, honorifique ou générale du verbe, au lieu de la réduire à « devint puissant ».
theological_decisions:
- issue: Portée de ὑψώθη dans un contexte royal et politique
  choice: fut élevé
  alternative: devint puissant ; fut exalté
  rationale: « Fut élevé » préserve la forme passive et l’indétermination du grec. « Devint puissant » expliciterait le sens politique, tandis que « fut exalté » aurait en français une coloration religieuse ou laudative plus marquée.
translation_notes:
  register: Français international moderne, narratif et digne. « Mis à l’abri » est idiomatique tout en reflétant le passif grec ; « fut élevé » conserve volontairement l’ambiguïté du dernier verbe.
