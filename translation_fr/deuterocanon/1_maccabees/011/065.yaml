  text: And Simon encamped at Bethsura[a], and fought against it for many days, and shut it in.
translation:
  language: fr
  text: Simon établit son camp à Bethsoura et lui fit la guerre pendant de nombreux jours. Il l’encercla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mit sous blocus » ou « l’enferma ». Le verbe grec signifie « enfermer » ou « enclore » et peut décrire le fait de contenir une place pendant un siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: établit son camp devant
  rationale: Le verbe désigne l’installation d’un camp. « Devant » rend naturellement en français le contexte militaire d’une prise de position face à la place forte, sans anticiper sur l’encerclement exprimé ensuite.
- source_word: Βεθσούρᾳ
  choice: Bethsoura
  rationale: Translittération française usuelle de la forme grecque du nom de lieu.
- source_word: ἐπολέμει
  choice: lui fit la guerre
  rationale: L’imparfait grec décrit une action militaire prolongée. Cette formulation conserve la valeur générale du verbe sans la réduire à un assaut ponctuel.
- source_word: ἡμέρας πολλὰς
  choice: pendant de nombreux jours
  rationale: L’accusatif exprime ici la durée; « pendant » la rend explicitement et naturellement.
- source_word: συνέκλεισεν
  choice: l’encercla
  rationale: Le verbe signifie enfermer ou enclore. Dans ce contexte de siège, « encercla » exprime clairement le fait de contenir la place sans imposer le sens plus technique de « bloquer ».
