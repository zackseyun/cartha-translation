base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
translation:
  language: fr
  text: Il nomma aussi son frère Simon commandant[a] du territoire qui s’étend de l’Échelle de Tyr jusqu’aux frontières de l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « général ». Le grec désigne un chef militaire, sans préciser nécessairement un grade équivalent aux grades modernes.
    reason: lexical_alternative
  - marker: b
    text: L’« Échelle de Tyr » est un nom de lieu, probablement celui d’un passage ou d’un escarpement côtier près de Tyr, et non une échelle au sens propre.
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  choice: nomma
  rationale: Le verbe exprime ici l’établissement de quelqu’un dans une fonction officielle; « nomma » est naturel et précis en français moderne.
- source_word: στρατηγὸν
  choice: commandant
  rationale: Le terme désigne un chef militaire sans imposer un grade moderne trop précis; « général » reste possible.
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: de l’Échelle de Tyr
  rationale: κλίμαξ est ici un nom de lieu. La traduction littérale traditionnelle conserve le toponyme, expliqué en note.
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: jusqu’aux frontières de l’Égypte
  rationale: Cette formulation rend directement l’étendue territoriale indiquée par ἕως et ὅρια.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: son frère Simon
  rationale: Cette tournure française identifie naturellement Simon par son lien avec le sujet.
- source_word: ἀπὸ … ἕως
  choice: du territoire qui s’étend de … jusqu’à
  rationale: L’ajout explicatif « du territoire qui s’étend » rend clair en français que les limites géographiques définissent l’étendue du commandement, implicite dans le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation explicite l’étendue territoriale du commandement tout en conservant le toponyme traditionnel « Échelle de Tyr » et l’ambiguïté de στρατηγός en note.
