  text: And he turned back against them in battle[a], and routed them, and they fled.
translation:
  language: fr
  text: Puis il se retourna pour les combattre[a], les mit en déroute, et ils s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec a une tournure elliptique : « il se retourna vers eux, pour la guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: il se retourna
  rationale: Le verbe exprime ici un changement de direction vers les adversaires déjà mentionnés; « se retourna » conserve ce mouvement dans un français naturel.
- source_word: πρὸς αὐτοὺς πόλεμον
  choice: pour les combattre
  rationale: La tournure grecque est condensée et signifie littéralement quelque chose comme « vers eux, [le] combat ». La formulation verbale retenue rend clairement la reprise des hostilités sans ajouter de détail.
- source_word: ἐτροπώσατο
  choice: les mit en déroute
  rationale: Le verbe désigne le fait de faire tourner l’ennemi et de le mettre en fuite; « mit en déroute » garde cette valeur militaire précise et prépare naturellement la proposition suivante.
- source_word: ἔφυγον
  choice: ils s’enfuirent
  rationale: Ce passé simple restitue sobrement l’aoriste narratif et exprime directement leur fuite.
