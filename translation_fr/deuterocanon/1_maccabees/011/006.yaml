  text: And Jonathan met the king at Joppa with honor, and they greeted one another, and they spent the night there.
translation:
  language: fr
  text: Jonathan rencontra le roi à Joppé avec les honneurs. Ils se saluèrent mutuellement et passèrent la nuit là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήντησεν
  choice: rencontra
  rationale: L’aoriste de συναντάω désigne ici la rencontre de Jonathan avec le roi. « Rencontra » exprime naturellement l’événement sans préciser davantage qui en avait pris l’initiative.
- source_word: εἰς Ἰόππην
  choice: à Joppé
  rationale: Après un verbe de rencontre, εἰς suivi du nom de lieu peut désigner l’endroit où elle a eu lieu. « À Joppé » est idiomatique en français et conserve cette valeur.
- source_word: μετὰ δόξης
  choice: avec les honneurs
  rationale: Dans ce contexte diplomatique, δόξα évoque les marques d’honneur et le cérémonial plutôt qu’une gloire abstraite. L’expression française « avec les honneurs » rend ce sens avec naturel.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: ils se saluèrent mutuellement
  rationale: ἀσπάζομαι signifie couramment saluer ou accueillir. « Se saluèrent mutuellement » conserve explicitement la réciprocité de ἀλλήλους sans introduire le geste plus précis d’une embrassade.
- source_word: ἐκοιμήθησαν
  choice: passèrent la nuit
  rationale: Bien que κοιμάω signifie littéralement dormir, le verbe indique ici, dans un récit de déplacement, qu’ils restèrent sur place pour la nuit. « Passèrent la nuit » communique clairement cette valeur narrative.
