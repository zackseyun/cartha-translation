base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/063.yaml
  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
translation:
  language: fr
  text: Jonathan apprit que les chefs de Démétrios étaient arrivés à Qédes, en Galilée, avec des forces considérables, dans l’intention de le destituer de sa fonction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’écarter de sa charge ». L’expression grecque peut désigner le fait de retirer quelqu’un de la fonction ou du service qui lui a été confié.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce récit, l’aoriste de ἀκούω indique que Jonathan reçoit une information; « apprit » est naturel en français et rend mieux ce renseignement rapporté que le littéral « entendit ».
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: les chefs de Démétrios
  rationale: ἄρχοντες désigne des dirigeants ou officiers; le contexte militaire favorise « chefs », qui demeure moins précis que « commandants » et préserve ainsi l’étendue du terme grec.
- source_word: παρῆσαν
  choice: étaient arrivés
  rationale: Le verbe exprime leur présence sur place après leur venue; « étaient arrivés » convient au rapport rétrospectif introduit par « apprit ».
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: Qédes, en Galilée
  rationale: La précision géographique distingue cette ville des autres lieux du même nom; la graphie « Qédes » est une translittération française claire de Κῆδες.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec des forces considérables
  rationale: Dans un contexte militaire, δύναμις désigne des forces armées; « considérables » rend πολλῆς sans imposer la structure plus précise d’une armée.
- source_word: βουλόμενοι
  choice: dans l’intention de
  rationale: Le participe exprime ici la volonté et le dessein des chefs; cette tournure en rend clairement la valeur circonstancielle.
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: le destituer de sa fonction
  rationale: μεθίστημι peut signifier écarter ou déposer, tandis que χρεία peut désigner un service, une charge ou une fonction. « Destituer de sa fonction » convient au contexte politico-militaire tout en laissant la note signaler l’amplitude lexicale.
