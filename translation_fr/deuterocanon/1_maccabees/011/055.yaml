base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: fr
  text: Toutes les troupes que Démétrios avait congédiées[a] se rassemblèrent auprès de lui. Elles combattirent Démétrios, qui prit la fuite et fut mis en déroute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait renvoyées » ou « avait relevées de leur service ». Le verbe grec peut désigner le renvoi de troupes ou le fait de les éloigner de sa présence; le contexte favorise ici un renvoi militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se rassemblèrent auprès de lui
  rationale: L’aoriste passif suivi de πρὸς αὐτόν exprime le rassemblement des troupes auprès de la personne mentionnée, avec l’idée qu’elles se rallient à elle.
- source_word: δυνάμεις
  choice: troupes
  rationale: Dans ce contexte militaire, le mot désigne des forces armées; « troupes » est naturel et précis en français.
- source_word: ἀπεκρόακεν
  choice: avait congédiées
  rationale: Le verbe indique ici que Démétrios avait renvoyé ou relevé ces troupes auparavant. Le plus-que-parfait marque clairement l’antériorité.
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: Elles combattirent Démétrios
  rationale: La construction a ici un sens hostile. La répétition du nom évite l’ambiguïté des deux pronoms grecs, qui renvoient à des personnes différentes dans le contexte narratif.
- source_word: ἔφυγεν
  choice: prit la fuite
  rationale: Cette expression française rend naturellement l’action ponctuelle de fuir dans un récit de bataille.
- source_word: ἐτροπώθη
  choice: fut mis en déroute
  rationale: Le passif possède une nuance militaire plus précise que le simple fait d’être vaincu.
