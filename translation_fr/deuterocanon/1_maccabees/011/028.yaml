base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: fr
  text: Jonathan demanda au roi d’exempter d’impôts la Judée, les trois toparchies[a] et la Samarie, et il lui promit trois cents talents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une toparchie était une circonscription administrative. Le grec emploie ici un terme territorial technique plutôt qu’un mot générique signifiant « région ».
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: demanda
  rationale: Dans cette construction avec un infinitif, le verbe exprime une requête adressée au roi. « Demanda » est naturel et n’accentue pas indûment la force de la démarche.
- source_word: ποιῆσαι … ἀφορολόγητον
  choice: d’exempter d’impôts
  rationale: Cette formulation française rend naturellement l’idée de faire bénéficier les territoires mentionnés d’une exemption fiscale.
- source_word: τὰς τρεῖς τοπαρχίας
  choice: les trois toparchies
  rationale: Le terme technique ancien est conservé afin de ne pas réduire ces circonscriptions administratives à de simples régions; une note en donne le sens.
- source_word: τὴν Σαμαρῖτιν
  choice: la Samarie
  rationale: « La Samarie » est la désignation géographique française usuelle de cette région.
- source_word: ἐπηγγείλατο
  choice: il lui promit
  rationale: Le moyen grec indique ici un engagement pris par Jonathan envers le roi; « promit » en rend directement le sens.
- source_word: τάλαντα τριακόσια
  choice: trois cents talents
  rationale: Le talent, ancienne unité de poids et de valeur monétaire, est conservé plutôt que converti de manière spéculative en monnaie moderne.
