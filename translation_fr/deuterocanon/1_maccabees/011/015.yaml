base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/015.yaml
  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: fr
  text: Alexandre l’apprit et vint l’attaquer. Ptolémée sortit à sa rencontre avec une grande puissance[a] et le mit en fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec une main forte »; on peut aussi comprendre : « avec une grande force ».'
    reason: L’expression grecque conserve une image de « main forte » et peut désigner la puissance ou la force militaire avec laquelle Ptolémée agit, sans mentionner explicitement une armée.
lexical_decisions:
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans ce contexte, le verbe introduit la réaction d’Alexandre à ce qui précède. « L’apprit » est naturel en français et explicite seulement le complément implicite du grec.
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: vint l’attaquer
  rationale: Cette formulation française naturelle rend le mouvement hostile exprimé par ἐπʼ αὐτόν et la confrontation militaire exprimée par ἐν πολέμῳ, sans ajouter l’idée précise d’une bataille rangée.
- source_word: ἐξήγαγεν
  choice: sortit
  rationale: Employé absolument dans ce contexte militaire, le verbe indique que Ptolémée sortit avec ses forces; le français n’a pas besoin de rendre explicitement un objet absent du texte grec.
- source_word: ἀπήντησεν αὐτῷ
  choice: à sa rencontre
  rationale: La tournure « sortit à sa rencontre » rend naturellement l’action d’aller rencontrer l’adversaire.
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: avec une armée puissante
  rationale: Littéralement « avec une main forte », cette expression décrit ici la puissance militaire avec laquelle Ptolémée intervient. « Armée puissante » est clair dans le contexte, tandis que la note conserve l’image grecque et une autre interprétation possible.
- source_word: ἐτροπώσατο αὐτόν
  choice: le mit en fuite
  rationale: Le verbe militaire évoque le fait de retourner l’ennemi ou de le contraindre à fuir; « mit en fuite » en restitue précisément la nuance.
