  text: Give us your right hands[a], and let the Jews stop fighting against us and the city.
translation:
  language: fr
  text: « Donne-nous ta main droite[a], et que les Juifs cessent de combattre contre nous et contre la ville. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Donne-nous des mains droites ». Cette expression désigne le geste par lequel on s’engageait à faire la paix, à conclure une alliance ou à agir de bonne foi.'
    reason: cultural_note
lexical_decisions:
- source_word: Δὸς ἡμῖν δεξιάς
  choice: Tendez-nous la main droite
  rationale: L’expression grecque signifie littéralement « donne-nous des mains droites ». En français, « tendre la main droite » conserve le geste concret tout en exprimant naturellement l’offre d’un engagement de paix ou de bonne foi. Le singulier collectif est idiomatique.
- source_word: παυσάσθωσαν
  choice: que … cessent
  rationale: L’impératif aoriste à la troisième personne demande la cessation de l’action ; cette tournure est naturelle et digne en français.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Rend directement le groupe désigné par le grec, sans explicitation supplémentaire.
- source_word: πολεμοῦντες ἡμᾶς
  choice: de combattre contre nous
  rationale: Le participe présent désigne une action hostile en cours ; « combattre contre » préserve clairement cette valeur.
- source_word: καὶ τὴν πόλιν
  choice: et contre la ville
  rationale: La préposition impliquée par πολεμοῦντες est répétée en français pour éviter toute ambiguïté. Aucun possessif n’est ajouté, puisque le grec dit seulement « la ville ».
