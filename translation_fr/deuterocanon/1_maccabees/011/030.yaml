review_pass:
  verdict: revise
  source_fidelity: 'Le texte grec est une suscription épistolaire concise : « Le roi Démétrios à Jonathan, le frère, salut, et à la nation des Juifs. » Le projet rend correctement les deux destinataires et la formule χαίρειν. Toutefois, « son frère » introduit en français une relation de possession qui n''est pas explicitement exprimée par le grec, où τῷ ἀδελφῷ fonctionne naturellement comme titre apposé à Jonathan. « frère » sans possessif conserve mieux l''ambiguïté relationnelle et diplomatique.'
  naturalness: La formulation est globalement claire et de registre approprié. « Salut ! » convient à une lettre grecque, mais placé après deux-points et accompagné d'un point d'exclamation, il est un peu plus vif que la solennité de la suscription. « salut » sans point d'exclamation est plus sobre et naturel dans cette présentation.
  terminology: « Le roi Démétrios », « Jonathan », « nation » et « Juifs » sont justes et idiomatiques. La note sur « Judéens » préserve utilement l'alternative de Ἰουδαίων. La note sur « frère » doit éviter de suggérer que le grec emploie nécessairement un possessif ou de réduire indûment la possibilité d'une parenté réelle.
  issues:
  - severity: low
    issue: Possessif « son » dans « Jonathan, son frère »
    rationale: Le grec porte τῷ ἀδελφῷ, avec article, et non un possessif. Si le français peut employer « son frère » dans une adresse, « Jonathan, frère » est ici une solution épistolaire plus proche et conserve sans ajout l'ambiguïté entre parenté et titre diplomatique.
  - severity: low
    issue: Ponctuation expressive de « salut ! »
    rationale: Le point d'exclamation n'est pas requis par χαίρειν, qui est une formule conventionnelle de lettre. Une ponctuation neutre convient mieux au registre royal.
