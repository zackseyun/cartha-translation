  text: King Demetrius to Jonathan his brother[a], greetings, and to the nation of the Jews.
translation:
  language: fr
  text: 'Le roi Démétrios à Jonathan, frère[a], ainsi qu’à la nation des Juifs[b] : salut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frère » peut être une appellation diplomatique ou honorifique, sans exclure une parenté réelle.
    reason: ambiguïté contextuelle
  - marker: b
    text: Ou « des Judéens ». Le grec Ἰουδαίων peut mettre l’accent sur l’identité du peuple ou sur son lien avec la Judée.
    reason: alternative lexicale
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: Le roi Démétrios
  rationale: Le titre royal et le nom de l’expéditeur ouvrent l’adresse de la lettre. « Démétrios » suit la translittération française usuelle du grec.
- source_word: Ἰωνάθαν
  choice: Jonathan
  rationale: Forme biblique française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: τῷ ἀδελφῷ
  choice: à Jonathan, son frère
  rationale: Le datif marque le destinataire. Le possessif est nécessaire en français naturel ; « frère » conserve le terme grec sans décider s’il exprime une parenté littérale ou, plus probablement ici, une relation diplomatique honorifique.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’adresse d’une lettre hellénistique, l’infinitif χαίρειν constitue une formule de salutation. « Salut ! » en restitue de façon concise la fonction épistolaire, sans le traduire littéralement par « réjouissez-vous ».
- source_word: καὶ ἔθνει Ἰουδαίων
  choice: ainsi qu’à la nation des Juifs
  rationale: La formulation rend explicite que la salutation s’adresse également à ce second destinataire. « Nation » préserve la dimension collective et politique de ἔθνος, tandis que « Juifs » est le terme français conventionnel et naturel.
theological_decisions:
- issue: Sens de ἀδελφός dans une lettre royale
  choice: Conserver « frère » tout en signalant sa possible valeur diplomatique
  alternative: Remplacer le terme par « allié » ou le comprendre comme une parenté littérale certaine
  rationale: Le grec dit explicitement « frère », mais le contexte de correspondance royale permet une appellation politique ou honorifique. La traduction préserve donc le mot et l’ambiguïté sans affirmer une fraternité biologique.
- issue: Portée de Ἰουδαίων
  choice: « des Juifs »
  alternative: « des Judéens »
  rationale: Le grec peut désigner une identité ethnique, religieuse ou géographique. « Juifs » est ici la formulation française la plus intelligible, tandis qu’une note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée afin que les deux destinataires dépendent clairement de la formule « salut », tout en conservant la concision solennelle d’une adresse royale.
