base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/033.yaml
  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: fr
  text: Nous avons décidé de faire du bien à la nation juive, qui nous est amie et qui respecte ce qui est juste à notre égard[a], en raison de sa bienveillance envers nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui remplit ses obligations envers nous ». Le grec dit littéralement : « qui maintient les choses justes à notre égard ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: à la nation juive
  rationale: Le datif désigne le bénéficiaire de la décision. « Nation juive » rend naturellement ἔθνος τῶν Ἰουδαίων en français moderne.
- source_word: φίλοις ἡμῶν
  choice: nos amis
  rationale: Cette apposition qualifie la nation juive et conserve le ton politique et relationnel du texte.
- source_word: συντηροῦσι
  choice: qui respectent
  rationale: Le participe évoque le maintien fidèle d'une conduite ou d'engagements. « Respectent » est naturel en français et convient à la nuance juridico-politique.
- source_word: τὰ πρὸς ἡμᾶς δίκαια
  choice: ce qui est juste envers nous
  rationale: Cette formulation préserve la portée volontairement large de l'expression grecque, littéralement « les choses justes envers nous », sans la réduire à des obligations formelles.
- source_word: ἐκρίναμεν
  choice: nous avons décidé
  rationale: Dans le style officiel d'un décret royal, le verbe exprime une décision arrêtée.
- source_word: ἀγαθοποιῆσαι
  choice: de faire du bien
  rationale: Rend directement l'idée générale d'agir en bienfaiteur, sans anticiper la nature des avantages précisés par le contexte.
- source_word: χάριν
  choice: en raison de
  rationale: Introduit ici le motif de la décision favorable dans un registre digne et courant.
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: leur bienveillance à notre égard
  rationale: εὔνοια désigne une disposition favorable, éventuellement teintée de loyauté politique. « Bienveillance » conserve cette dimension sans la surdéterminer.
