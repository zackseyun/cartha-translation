review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : décision officielle de faire du bien, motivée par la bienveillance des Juifs envers l''auteur. Toutefois, « la nation juive, nos amis, qui respectent » crée une discordance de nombre en français, puisque le sujet grammatical est singulier (« nation »), alors que l''apposition et la relative sont au pluriel. La révision conserve la désignation collective du grec tout en rendant naturellement les qualificatifs relationnels.'
  naturalness: 'La formulation révisée emploie un singulier collectif cohérent : « la nation juive, qui nous est amie et qui respecte… ». Elle garde un registre officiel, clair et moderne.'
  terminology: « Nation juive » rend adéquatement ἔθνος τῶν Ἰουδαίων. « Qui nous est amie » transmet φίλοις ἡμῶν dans une construction française idiomatique sans introduire la notion plus forte d’alliance. « Ce qui est juste à notre égard » préserve l’ouverture de τὰ πρὸς ἡμᾶς δίκαια; la note signale l’interprétation possible en termes d’obligations.
  issues:
  - severity: medium
    issue: Discordance de nombre dans l’apposition et la relative
    rationale: Dans « la nation juive, nos amis, qui respectent », « nation » est singulier, tandis que « nos amis » et « respectent » sont pluriels. Le grec peut accorder les participes avec « les Juifs »; le français exige ici soit une restructuration, soit une reprise collective au singulier.
  revised_text: Nous avons décidé de faire du bien à la nation juive, qui nous est amie et qui respecte ce qui est juste à notre égard[a], en raison de sa bienveillance envers nous.
  revised_footnotes:
  - marker: a
    text: 'Ou « qui remplit ses obligations envers nous ». Le grec dit littéralement : « qui maintient les choses justes à notre égard ».'
    reason: lexical_alternative
  revision_rationale: La révision résout la discordance grammaticale sans modifier le sens. Le singulier collectif français rend la nation comme entité, tandis que « qui nous est amie » exprime la relation d’amitié politique et « sa bienveillance » reprend naturellement le référent collectif. La note conserve l’ambiguïté entre conduite juste et obligations envers l’autorité émettrice.
