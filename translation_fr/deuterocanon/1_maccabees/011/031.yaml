base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/031.yaml
  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: fr
  text: Nous vous avons aussi écrit une copie de la lettre que Lasthénès a écrite à notre parent à votre sujet[a], afin que vous la voyiez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à notre proche », « à notre compatriote » ou « à notre associé honoré ». Le grec συγγενής peut désigner un parent par le sang, mais aussi, selon le contexte, un proche, un compatriote ou un associé honoré.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: une copie de la lettre
  rationale: ἀντίγραφον désigne une copie ou une transcription d’un document, et ἐπιστολή une lettre. Cette formulation est naturelle en français moderne et convient au registre diplomatique.
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: que Lasthénès a écrite
  rationale: Le relatif renvoie directement à « lettre » et ἔγραψεν signifie proprement « a écrite ». La forme française marque normalement l’accord du participe avec le complément antéposé.
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: à notre parent
  rationale: συγγενής peut désigner un parent au sens familial, mais aussi un proche, un compatriote ou un associé honoré dans un cadre politique. « Parent » conserve le sens principal sans préciser le degré de parenté; l’ambiguïté contextuelle est signalée en note.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: περί avec le génitif signifie ici « au sujet de » ou « concernant ». La traduction n’impose pas le sens plus favorable de « en votre faveur ».
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: Nous vous avons aussi fait parvenir
  rationale: Le parfait indique une action accomplie qui demeure pertinente. Bien que γράφω signifie littéralement « écrire », appliqué à une copie adressée aux destinataires, le français idiomatique « faire parvenir » exprime naturellement l’envoi implicite sans faire croire qu’une seconde lettre a été composée.
- source_word: ὅπως ἰδῆτε
  choice: afin que vous puissiez en prendre connaissance
  rationale: La construction exprime le but. Littéralement « afin que vous voyiez », elle signifie dans ce contexte documentaire que les destinataires pourront consulter et connaître le contenu de la copie.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec un ton adapté à une correspondance diplomatique. « Lasthénès » suit la translittération française usuelle. La formulation privilégie l’idiome français tout en conservant l’ambiguïté de συγγενής dans une note.
