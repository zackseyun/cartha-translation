  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
translation:
  language: fr
  text: Jonathan et son camp campèrent près de l’eau de Gennésar[b]. De bon matin, ils se levèrent et partirent pour la plaine de Nasor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se levèrent de bon matin vers la plaine de Nasor ». Le grec exprime la destination par « vers » sans employer de verbe de déplacement distinct.'
    reason: lexical_alternative
  - marker: b
    text: Gennésar est la forme du nom dans le texte grec ici ; ce lieu est aussi connu sous le nom de Génésareth.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεμβολὴ
  choice: camp
  rationale: Dans ce récit militaire, le mot peut désigner le camp ou les troupes qui y sont réunies. « Son camp » conserve cette portée collective sans préciser indûment « armée ».
- source_word: παρενέβαλον
  choice: établirent leur campement
  rationale: Le verbe signifie dresser ou établir un camp. Cette tournure naturelle évite en français la répétition maladroite « le camp campa ».
- source_word: ἐπὶ τὸ ὕδωρ
  choice: près des eaux
  rationale: Avec le verbe de campement, l’expression indique naturellement une installation au bord ou à proximité de l’eau. Le pluriel idiomatique français convient à une étendue d’eau.
- source_word: τοῦ Γεννησάρ
  choice: de Gennésar
  rationale: La forme française translittère le toponyme Γεννησάρ du texte grec, sans l’harmoniser silencieusement avec la forme plus connue « Génésareth ».
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: De bon matin
  rationale: Le verbe et l’expression temporelle insistent ensemble sur l’heure matinale. « De bon matin » rend cette insistance de façon concise et naturelle.
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: ils partirent pour la plaine de Nasor
  rationale: εἰς indique une direction vers la plaine. Le mouvement n’est pas exprimé par un verbe distinct dans le grec, mais il est impliqué par la construction; « partirent pour » produit une phrase française claire tout en signalant la destination.
