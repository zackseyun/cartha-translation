  source_fidelity: La première proposition doit rendre le sujet coordonné « Jonathan et son camp » et le verbe παρενέβαλον sans donner l’impression que le camp « établit son propre campement ». Dans la seconde, ὤρθρισαν τὸ πρωὶ exprime explicitement le fait de se lever tôt, tandis que εἰς τὸ πεδίον Νασώρ indique la destination et implique le déplacement. La révision conserve ces deux éléments.
  naturalness: « Jonathan et son camp campèrent » est concis, naturel dans un récit historique et évite la construction maladroite « établirent leur campement ». « Ils se levèrent et partirent pour » est clair en français moderne; le verbe de déplacement explicite rend l’orientation impliquée par εἰς sans changer le sens narratif.
  terminology: « Camp », « campèrent », « eau de Gennésar » et « plaine de Nasor » respectent le registre militaire et les formes toponymiques du grec. « Gennésar » ne doit pas être harmonisé dans le texte avec « Génésareth », mais l’équivalence usuelle peut être indiquée en note.
