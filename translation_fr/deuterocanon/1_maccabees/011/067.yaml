- from: Jonathan et son camp établirent leur campement près des eaux de Gennésar[b]. De bon matin, ils partirent pour la plaine de Nasor[a].
  to: Jonathan et son camp campèrent près de l’eau de Gennésar[b]. De bon matin, ils se levèrent et partirent pour la plaine de Nasor[a].
  rationale: La révision remplace une expression de campement lourde par le verbe français direct « campèrent », rétablit explicitement le lever matinal exprimé en grec et emploie le singulier « eau » correspondant à τὸ ὕδωρ. Le départ pour la plaine explicite en français le mouvement que la construction grecque avec εἰς laisse implicite; la note le signale afin de préserver cette nuance.
