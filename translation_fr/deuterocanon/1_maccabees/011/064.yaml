  text: And he went to meet them[a], but he left his brother Simon in the country.
translation:
  language: fr
  text: Il alla à leur rencontre, mais il laissa son frère Simon dans la région.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le pays » ou « sur le territoire » ; le grec χώρα peut désigner une étendue territoriale de manière générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησεν
  choice: alla à leur rencontre
  rationale: Le verbe exprime l’action d’aller à la rencontre de quelqu’un; cette formulation garde la nuance de mouvement et s’accorde avec le datif pluriel αὐτοῖς.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom grec est au pluriel; « leur » conserve clairement ce nombre.
- source_word: κατέλιπεν
  choice: laissa
  rationale: Le verbe signifie couramment « laisser » ou « laisser derrière soi ». « Laissa » est naturel ici sans ajouter l’idée plus précise de poster quelqu’un.
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: son frère Simon
  rationale: Cette tournure française moderne conserve à la fois le lien familial et le nom propre.
- source_word: ἐν τῇ χώρᾳ
  choice: dans la région
  rationale: χώρα peut désigner un pays, un territoire ou une région. Dans ce contexte géographique et militaire, « région » évite le sens moderne potentiellement ambigu de « campagne ».
