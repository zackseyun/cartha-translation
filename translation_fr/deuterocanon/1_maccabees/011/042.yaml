base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: fr
  text: 'Démétrios envoya dire à Jonathan : « Non seulement je ferai ces choses pour toi et pour ta nation, mais bien davantage : j’accorderai de grands honneurs à toi et à ta nation, si j’en trouve une occasion favorable[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « si j’obtiens une occasion favorable » ou « si je rencontre une occasion propice ».
    reason: Le grec emploie τυγχάνω avec εὐκαιρία, exprimant l’obtention ou la rencontre d’une occasion favorable.
lexical_decisions:
- source_word: ἀπέστειλεν Δημήτριος πρὸς Ἰωνάθαν λέγων
  choice: Démétrios envoya dire à Jonathan
  rationale: La tournure française « envoya dire » exprime naturellement l’envoi d’un message introduit par λέγων, sans ajouter de messager explicitement absent du grec.
- source_word: τῷ ἔθνει σου / τὸ ἔθνος σου
  choice: ta nation
  rationale: Dans ce contexte politique, ἔθνος désigne la communauté nationale juive; « nation » en conserve mieux la dimension collective et politique que le terme plus général « peuple ».
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: mais je vous comblerai d’honneur
  rationale: Le nom et le verbe de même racine forment une expression intensive. « Combler d’honneur » rend cette insistance en français naturel tout en évitant la répétition peu idiomatique « honorer d’honneur ».
- source_word: σε καὶ τὸ ἔθνος σου
  choice: vous… toi et ta nation
  rationale: Le pronom pluriel anticipe naturellement en français les deux compléments coordonnés, ensuite explicités par « toi et ta nation ».
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: si j’en trouve une occasion favorable
  rationale: τυγχάνω avec le génitif signifie ici obtenir ou rencontrer, tandis que εὐκαιρία désigne une circonstance propice. La formulation maintient pleinement le caractère conditionnel de la promesse.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Démétrios » suit la forme française usuelle du nom grec. Le tutoiement convient à l’adresse directe d’un souverain à Jonathan et permet de distinguer clairement celui-ci de « ta nation ».
