  text: And on that day three thousand men of the foreigners fell[a], and Jonathan returned to Jerusalem.
translation:
  language: fr
  text: Ce jour-là, environ trois mille hommes parmi les étrangers tombèrent[a], puis Jonathan retourna à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « trois mille hommes ». L’expression grecque peut désigner le total atteint plutôt qu’un nombre approximatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον
  choice: tombèrent
  rationale: Le verbe signifie littéralement « tomber » et sert ici d’expression guerrière pour désigner les morts au combat, sans préciser davantage les circonstances de leur mort.
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: parmi les étrangers
  rationale: Le terme désigne des personnes appartenant à un autre peuple. Dans ce contexte, « les étrangers » évite de les identifier indûment aux Philistins, tandis que « parmi » rend naturellement la construction partitive ἐκ.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Ce jour-là
  rationale: Formulation temporelle idiomatique et fidèle en français moderne.
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: environ trois mille hommes
  rationale: La construction avec εἰς peut exprimer un total atteint ou une quantité approximative. Le texte principal adopte la lecture approximative, naturelle en français, tout en signalant l’autre possibilité en note.
- source_word: ἐπέστρεψεν
  choice: retourna
  rationale: Dans ce contexte de déplacement, le verbe indique le retour vers un lieu.
- source_word: Ἰωναθάν
  choice: Jonathan
  rationale: Forme française traditionnelle du nom propre.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française traditionnelle du nom de lieu.
