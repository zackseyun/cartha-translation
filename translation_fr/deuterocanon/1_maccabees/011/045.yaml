  yaml_path: translation/deuterocanon/1_maccabees/011/045.yaml
  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: fr
  text: Les habitants de la ville se rassemblèrent au centre de la ville, au nombre de cent vingt mille hommes[a], et ils voulaient tuer le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « douze myriades d’hommes », c’est-à-dire 120 000 hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: se rassemblèrent
  rationale: Le verbe exprime le fait de se réunir ou de s’assembler. « Se rassemblèrent » est naturel en français moderne et conserve l’action collective.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les habitants de la ville
  rationale: Littéralement, « ceux de la ville ». Dans ce contexte, « les habitants de la ville » rend clairement l’appartenance sans introduire une désignation de faction non explicitée.
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: au centre de la ville
  rationale: Cette formulation rend simplement la localisation spatiale indiquée par le grec et évite le tour plus littéraire « au milieu de la ville ».
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: au nombre d’environ cent vingt mille hommes
  rationale: δώδεκα μυριάδας signifie littéralement « douze myriades », soit 120 000. Ici, εἰς introduit l’effectif atteint; « environ » conserve la valeur idiomatique d’estimation possible de la tournure, tandis que « hommes » traduit explicitement ἄνδρας.
- source_word: ἠβούλοντο
  choice: ils voulaient
  rationale: L’imparfait de βούλομαι exprime directement la volonté ou l’intention. « Ils voulaient » n’en renforce pas indûment la portée.
- source_word: ἀνελεῖν
  choice: tuer
  rationale: Dans ce contexte, le verbe signifie ôter la vie. « Tuer » est précis, actuel et sans euphémisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ville » est conservée afin de refléter celle du grec. Le nombre est exprimé en toutes lettres dans le texte courant, avec la formulation littérale signalée en note.
