  text: 'And the king approved[a], and wrote letters to Jonathan concerning all these things, having this form:'
translation:
  language: fr
  text: 'Le roi donna son accord et écrivit à Jonathan des lettres concernant toutes ces affaires, ainsi formulées[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant cette forme ». La formule peut aussi se rendre : « dont voici la teneur ».'
