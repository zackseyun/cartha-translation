lexical_decisions:
- source_word: εὐδόκησεν
  choice: donna son accord
  rationale: Dans ce contexte administratif, le verbe exprime l’acceptation favorable des demandes précédentes. « Donna son accord » est naturel en français et évite la nuance surtout affective de « fut satisfait ».
- source_word: ἔγραψεν
  choice: écrivit
  rationale: Rend directement l’aoriste grec et convient à l’objet explicite « des lettres ».
- source_word: ἐπιστολάς
  choice: des lettres
  rationale: Préserve le pluriel explicite du grec et désigne naturellement des communications officielles écrites.
- source_word: περὶ πάντων τούτων
  choice: au sujet de toutes ces questions
  rationale: Renvoie à l’ensemble des demandes et dispositions précédemment évoquées. « Questions » convient mieux ici que le calque peu naturel « choses ».
- source_word: ἔχουσας τὸν τρόπον τοῦτον
  choice: qui se présentaient sous cette forme
  rationale: Conserve l’idée grecque de lettres « ayant cette forme » tout en annonçant naturellement, en français, le texte cité au verset suivant.
