  yaml_path: translation/deuterocanon/1_maccabees/011/007.yaml
  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: fr
  text: Jonathan alla avec le roi jusqu’au fleuve appelé Éleuthère[a], puis il retourna à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Éleuthère est le nom propre d’un fleuve qui marquait une région frontalière au nord ; le grec dit simplement : « le fleuve appelé Éleuthère ».'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: accompagna
  rationale: Dans la construction avec μετά et la limite exprimée par ἕως, le verbe décrit le déplacement de Jonathan en compagnie du roi. « Accompagna » rend naturellement l’ensemble en français sans ajouter de détail.
- source_word: μετὰ τοῦ βασιλέως
  choice: le roi
  rationale: μετά avec le génitif exprime l’accompagnement. Cette relation est intégrée idiomatiquement au verbe « accompagna ».
- source_word: ἕως τοῦ ποταμοῦ
  choice: jusqu’au fleuve
  rationale: ἕως marque ici le terme du trajet ou de l’accompagnement. « Jusqu’au » en conserve précisément la portée.
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: appelé Éleuthère
  rationale: Le participe καλουμένου signifie « appelé » ou « nommé ». Le nom géographique grec est transcrit sous sa forme française usuelle « Éleuthère », sans traduire son sens lexical.
- source_word: ἐπέστρεψεν
  choice: retourna
  rationale: L’aoriste indique ensuite le retour de Jonathan. Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: εἰς indique la destination du retour. En français, « retourner à Jérusalem » est la formulation idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression narrative du grec, avec « puis » pour rendre naturellement la coordination successive introduite par καί. Le nom du fleuve suit la forme française « Éleuthère ».
