base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: fr
  text: Nous avons donc confirmé en leur faveur les limites de la Judée ainsi que les trois districts[a] — Aphairéma, Lydda et Ramathaïm —, qui ont été rattachés à la Judée, pris sur la Samarie, avec tout ce qui s’y rattache[b], pour tous ceux qui offrent des sacrifices à Jérusalem, en remplacement des redevances royales que le roi percevait autrefois d’eux chaque année sur les produits de la terre et les fruits des arbres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici des circonscriptions administratives ; on rencontre aussi le terme technique « nomes » dans des traductions plus anciennes.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est large et peut comprendre les villages dépendants, les terres ou d’autres biens et territoires associés aux trois districts.
    reason: lexical_alternative
  - marker: c
    text: Ou « les produits des arbres ». Le terme grec peut désigner divers produits arboricoles, notamment les fruits et les fruits à coque.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: nous avons confirmé
  rationale: Le parfait de ἵστημι peut exprimer ici la mise en vigueur ou la confirmation d’une disposition royale; « confirmé » convient au contexte du décret.
- source_word: τὰ ὅρια
  choice: les limites
  rationale: Ὅρια désigne les frontières ou limites territoriales; « limites » est naturel dans ce contexte administratif.
- source_word: τοὺς τρεῖς νομοὺς
  choice: les trois districts
  rationale: Dans l’usage administratif hellénistique, νομός désigne une circonscription; « districts » transmet le sens sans recourir au terme technique « nomes ».
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: Aphairéma, Lydda et Ramathaïm
  rationale: Les noms de lieux sont translittérés à partir des formes grecques.
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: ont été rattachés à la Judée en provenance de la Samarie
  rationale: Le passif indique un transfert administratif vers la Judée depuis la Samarie, sans préciser davantage le mécanisme politique.
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: tout ce qui leur est rattaché
  rationale: L’expression est large et peut englober villages dépendants, terres ou autres dépendances; cette formulation conserve cette amplitude.
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: pour tous ceux qui offrent des sacrifices à Jérusalem
  rationale: Θυσιάζω signifie précisément offrir un sacrifice; la traduction évite de généraliser en simple « culte ».
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: en remplacement des redevances royales
  rationale: Τὰ βασιλικά désigne ici les revenus ou prélèvements dus au roi; « redevances royales » garde cette portée fiscale générale.
- source_word: ὧν ἐλάμβανεν ὁ βασιλεὺς παρʼ αὐτῶν τὸ πρότερον κατʼ ἐνιαυτόν
  choice: que le roi percevait autrefois d’eux chaque année
  rationale: L’imparfait avec τὸ πρότερον exprime une perception antérieure et habituelle; « percevait » convient au contexte fiscal.
- source_word: τῶν γενημάτων τῆς γῆς
  choice: les produits de la terre
  rationale: Γενήματα couvre largement la production ou le rendement agricole.
- source_word: τῶν ἀκροδρύων
  choice: les fruits des arbres
  rationale: Ἀκρόδρυα désigne les produits des arbres, notamment fruits et fruits à coque; la formulation française est claire tout en laissant la note préciser l’étendue du terme.
