base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/043.yaml
  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
translation:
  language: fr
  text: À présent, tu feras donc bien de nous envoyer des hommes qui combattront à mes côtés[a], car toutes mes forces m’ont abandonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui seront mes alliés »; le verbe grec peut désigner le soutien militaire apporté par un allié, rendu ici par « combattront à mes côtés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Cette expression marque à la fois la transition et la conséquence; la formulation française conserve ces deux nuances sans alourdir la demande.
- source_word: ὀρθῶς ποιήσεις
  choice: tu feras bien
  rationale: Cette tournure idiomatique recommande une action; « tu feras bien » rend naturellement la valeur de la formule grecque.
- source_word: ἀποστείλας ἡμῖν
  choice: de nous envoyer
  rationale: Le participe aoriste précise l’action recommandée, tandis que le datif indique les destinataires de l’envoi.
- source_word: ἄνδρας
  choice: des hommes
  rationale: Le grec emploie le terme général pour « hommes », et non un nom militaire technique; leur fonction guerrière ressort de la proposition suivante.
- source_word: οἳ συμμαχήσουσίν μοι
  choice: qui combattront à mes côtés
  rationale: Le verbe désigne le fait d’apporter un soutien en tant qu’allié, particulièrement dans un cadre militaire; cette traduction exprime clairement l’action sans réduire le terme à une alliance purement diplomatique.
- source_word: ἀπέστησαν
  choice: m’ont abandonné
  rationale: Dans ce contexte militaire, le verbe indique que les forces se sont détournées du locuteur ou l’ont quitté; « abandonné » préserve ce sens sans préciser indûment s’il s’agit d’une désertion formelle ou d’une révolte.
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: toutes mes forces
  rationale: Au pluriel et dans ce contexte, δυνάμεις désigne les forces militaires; « forces » conserve l’étendue du terme sans imposer une organisation précise.
