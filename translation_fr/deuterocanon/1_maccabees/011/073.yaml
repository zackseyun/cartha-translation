base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/073.yaml
  text: And those who had fled from him saw it[a], and they returned to him, and with him they pursued as far as Kadesh, as far as their camp[b], and they encamped there.
translation:
  language: fr
  text: Ceux qui s’étaient enfuis loin de lui virent cela[a] ; ils revinrent auprès de lui et poursuivirent avec lui jusqu’à Kadesh, jusqu’à leur camp[b], puis ils campèrent là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « virent » : le grec ne précise pas ce qu’ils virent et renvoie aux événements précédents.'
    reason: lexical_alternative
  - marker: b
    text: « Leur camp » désigne très probablement le camp des troupes poursuivies, mais le pronom grec ne le précise pas explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  choice: ceux qui s’étaient enfuis loin de lui
  rationale: Le participe substantivé désigne ceux qui avaient pris la fuite auparavant ; « loin de lui » rend clairement l’idée de séparation exprimée par παρά.
- source_word: ἴδον
  choice: virent cela
  rationale: Le grec ne précise pas l’objet du verbe. Le français courant en demande ici un ; « cela » renvoie sobrement aux événements précédents sans les définir davantage.
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: ils revinrent auprès de lui
  rationale: Cette formulation exprime le retour des fuyards vers celui qu’ils avaient abandonné, sans ajouter explicitement une notion d’allégeance.
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: poursuivirent avec lui
  rationale: Rend directement la poursuite menée en sa compagnie. Le passé simple convient au récit français, même si l’imparfait grec présente l’action dans son déroulement.
- source_word: ἕως Κάδης
  choice: jusqu’à Kadesh
  rationale: ἕως marque le terme spatial de la poursuite ; le nom propre est translittéré sous la forme internationale « Kadesh ».
- source_word: ἕως τῆς παρεμβολῆς αὐτῶν
  choice: jusqu’à leur camp
  rationale: παρεμβολή désigne ici un camp militaire. Le pronom « leur » conserve l’ambiguïté référentielle du grec, bien que le camp des poursuivis soit le référent le plus naturel.
- source_word: παρενέβαλον ἐκεῖ
  choice: puis ils campèrent là
  rationale: Le verbe signifie établir son camp. « Puis » explicite légèrement la progression narrative sans modifier la relation logique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre historique sans archaïsme marqué. Les répétitions de « jusqu’à » et de la famille lexicale du camp sont conservées autant que le permet un français naturel.
