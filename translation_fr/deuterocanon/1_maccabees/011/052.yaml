  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: fr
  text: Le roi Démétrios s’assit sur le trône de son royaume, et le pays demeura tranquille devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: s’assit
  rationale: L’aoriste de καθίζω évoque ici le fait de prendre place sur le trône. « S’assit » conserve sobrement l’image concrète sans expliciter davantage l’accession au pouvoir.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: le trône de son royaume
  rationale: Cette formulation préserve la construction génitive et la mention explicite du royaume, là où « son trône royal » serait plus condensé.
- source_word: ἡσύχασεν
  choice: demeura tranquille
  rationale: Le verbe exprime l’absence d’agitation ou de trouble. « Demeura tranquille » convient au contexte politique sans affirmer une paix complète que le grec n’impose pas.
- source_word: ἡ γῆ
  choice: le pays
  rationale: Dans ce récit historique, γῆ désigne le territoire soumis à l’autorité du roi plutôt que la terre entière. « Le pays » est naturel en français moderne.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Le rendu littéral conserve l’ambiguïté de la relation entre le calme du pays, la présence du roi et son autorité, sans la réduire à « sous son règne ».
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: le roi Démétrios
  rationale: L’ordre titre-nom est idiomatique en français et garde l’accent royal du grec.
