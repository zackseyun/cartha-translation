  source_fidelity: 'Le projet rend fidèlement les éléments essentiels : proximité auprès de quelqu’un, remise/livraison, règne à la place du père, rapport sur les actes de Démétrios et sur l’hostilité de ses forces, puis séjour prolongé. La double construction finale en ὅπως mérite toutefois d’être reproduite par deux propositions de but coordonnées sans la fondre en une seule.'
  naturalness: Le français est naturel et de registre narratif soutenu. « Pendant de nombreux jours » est un peu plus idiomatique que « là de nombreux jours » tout en gardant la durée et le lieu.
  terminology: « Livrer », « régner », « Démétrios », « troupes » et « hostilité » conviennent. La note doit expliquer plus exactement le redoublement grec entre le nom « hostilité » et le verbe apparenté, sans proposer un faux littéral français.
