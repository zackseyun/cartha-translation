  to: Il resta auprès de lui, afin qu’il le lui livre, afin qu’il règne à la place de son père. On lui rapporta tout ce que Démétrios avait fait, ainsi que l’hostilité que ses propres troupes lui témoignaient[a]. Et il demeura là pendant de nombreux jours.
  rationale: La révision reproduit explicitement les deux propositions de but du grec et affine la note sur le redoublement « hostilité/être hostile ». Elle conserve l’ambiguïté des pronoms, ne surinterprète pas les motivations politiques et maintient le registre du récit.
