  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: fr
  text: Il resta auprès de lui, afin qu’il le lui livre, afin qu’il règne à la place de son père. On lui rapporta tout ce que Démétrios avait fait, ainsi que l’hostilité que ses propres troupes lui témoignaient[a]. Et il demeura là pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une tournure répétitive, associant le nom « hostilité » à un verbe apparenté : littéralement, l’idée est celle de « l’hostilité que ses troupes lui manifestaient hostilement ».'
    reason: Cette note rend compte du redoublement lexical inhabituel du grec, tandis que le texte français le formule naturellement.
lexical_decisions:
- source_word: προσήδρευσεν αὐτῷ
  choice: Il resta auprès de lui
  rationale: Le verbe exprime le fait de se tenir ou de demeurer près de quelqu’un. Cette formulation conserve la proximité physique ou sociale sans préciser un motif que le grec ne rend pas explicite.
- source_word: ὅπως παραδοῖ αὐτὸν αὐτῷ
  choice: afin qu’il le lui livre
  rationale: « Livrer » convient au sens politique de παραδίδωμι. La succession des pronoms conserve l’ambiguïté des référents présente dans le grec et éclairée par le contexte immédiat.
- source_word: ὅπως βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: et qu’il règne à la place de son père
  rationale: « Régner à la place de » rend βασιλεύω et la valeur de remplacement ou de succession portée par ἀντί, sans transformer la proposition en simple succession chronologique.
- source_word: ἀπήγγειλαν αὐτῷ
  choice: On lui rapporta
  rationale: Le sujet pluriel n’étant pas identifié, le pronom indéfini français traduit naturellement l’action de transmettre un rapport tout en préservant cette indétermination.
- source_word: ὅσα συνετέλεσεν Δημήτριος
  choice: tout ce que Démétrios avait fait
  rationale: Cette traduction garde la portée générale de ὅσα et ne prête pas à συνετέλεσεν une idée de réussite ou d’approbation absente du contexte.
- source_word: τὴν ἔχθραν ἣν ἐχθραίνονσιν αὐτῷ αἱ δυνάμεις αὐτοῦ
  choice: l’hostilité que ses propres troupes lui témoignaient
  rationale: « Hostilité » exprime l’opposition active, et « ses propres troupes » rend explicite en français que les forces de Démétrios agissaient contre lui. La répétition étymologique grecque est signalée en note plutôt que reproduite lourdement.
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: il demeura là de nombreux jours
  rationale: Traduction proche de la notice temporelle grecque, dans un registre narratif digne et courant.
