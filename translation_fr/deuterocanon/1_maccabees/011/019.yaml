lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: devint roi
  rationale: Dans cette notice chronologique, l’aoriste marque naturellement l’accession de Démétrios. « Devint roi » exprime ce début de règne plus clairement que « régna », qui pourrait suggérer que tout son règne se situe durant cette seule année.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Transcription française usuelle du nom grec Δημήτριος.
- source_word: ἔτους ἑβδομοῦ καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: en l’an cent soixante-sept
  rationale: Cette formule au génitif donne une date, littéralement « de la septième, soixantième et centième année ». L’ordre français naturel des nombres est retenu, sans altérer la valeur chronologique.
