  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: fr
  text: Le roi s’enfuit dans la cour[a]. Ceux de la ville prirent possession des passages de la ville[b] et commencèrent à combattre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour intérieure » ; le grec peut désigner une cour ou un espace de cour dans un complexe royal.
    reason: lexical_alternative
  - marker: b
    text: Ou « des voies d’accès de la ville » ou « des entrées de la ville » ; le terme grec peut désigner des passages, des voies ou des routes d’accès.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: se réfugia
  rationale: Le verbe φεύγω décrit ici la fuite devant un danger. « Se réfugia » exprime naturellement en français le mouvement vers un lieu de protection, sans ajouter le détail d'une évasion.
- source_word: αὐλήν
  choice: cour
  rationale: αὐλή peut désigner une cour ou l'espace intérieur d'un complexe royal. « Cour » reste sobre et proche du grec, qui ne précise pas explicitement « palais ».
- source_word: κατελάβοντο
  choice: prirent le contrôle de
  rationale: Dans ce contexte militaire, le moyen κατελάβοντο indique la prise et la maîtrise de positions. Cette formulation est claire et moins susceptible que « saisirent » d'évoquer une prise purement matérielle.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les gens de la ville
  rationale: L'expression signifie littéralement « ceux de la ville ». « Les gens de la ville » demeure inclusive et naturelle, sans préciser indûment qu'il s'agissait uniquement d'hommes ou de soldats.
- source_word: τὰς διόδους τῆς πόλεως
  choice: les voies de passage
  rationale: δίοδος peut désigner des passages, des voies d'accès ou des itinéraires traversant un lieu. « Voies de passage » conserve cette latitude sémantique.
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: commencèrent à combattre
  rationale: La construction exprime le début d'une action guerrière. « Commencèrent à combattre » est actuelle, digne et fidèle, sans amplifier en « faire la guerre ».
