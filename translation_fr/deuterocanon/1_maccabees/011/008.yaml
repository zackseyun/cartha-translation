  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: fr
  text: Mais le roi Ptolémée prit le contrôle des villes de la côte jusqu’à Séleucie maritime, et il élaborait de mauvais desseins contre Alexandre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il réfléchissait à de mauvais desseins au sujet d’Alexandre ». Le grec signifie littéralement « au sujet d’Alexandre », mais le contexte implique une intention hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: prit le contrôle de
  rationale: Le verbe exprime l’acquisition ou l’exercice de la maîtrise. « Prit le contrôle de » convient au contexte politico-militaire sans suggérer nécessairement une souveraineté durable.
- source_word: πόλεων τῆς παραλίας
  choice: des villes de la côte
  rationale: Cette formulation naturelle conserve la structure et le sens géographique du grec.
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: jusqu’à Séleucie-sur-Mer
  rationale: L’épithète distingue cette Séleucie comme la ville maritime; « Séleucie-sur-Mer » est clair et idiomatique en français.
- source_word: διελογίζετο
  choice: il élaborait
  rationale: L’imparfait grec décrit une délibération en cours. « Élaborait » rend le processus de conception sans renforcer indûment l’idée de complot.
- source_word: λογισμοὺς πονηρούς
  choice: de mauvais desseins
  rationale: Le groupe peut désigner des calculs, projets ou intentions moralement mauvais. « Mauvais desseins » garde à la fois l’idée de projet réfléchi et sa valeur négative.
- source_word: περὶ Ἀλεξάνδρου
  choice: contre Alexandre
  rationale: La préposition signifie littéralement « au sujet d’Alexandre », mais la qualification des desseins comme mauvais leur donne ici une orientation hostile. Le texte principal explicite ce sens contextuel, tandis que la note préserve la formulation plus littérale.
