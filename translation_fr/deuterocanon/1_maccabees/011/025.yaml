  yaml_path: translation/deuterocanon/1_maccabees/011/025.yaml
  text: And some lawless men from the nation were making accusations against him[a].
translation:
  language: fr
  text: Et quelques hommes sans loi, membres du peuple, portaient plainte contre lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présentaient une requête contre lui », c’est-à-dire qu’ils déposaient une plainte auprès de l’autorité. Le verbe grec peut désigner une requête ou un recours ; dans ce contexte hostile, il est rendu par « portaient plainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  choice: portaient plainte
  rationale: Avec κατ’ αὐτοῦ, le verbe désigne ici une démarche hostile auprès d’une autorité. L’imparfait grec est rendu par l’imparfait français, qui conserve l’aspect duratif.
- source_word: κατ’ αὐτοῦ
  choice: contre lui
  rationale: κατά avec le génitif exprime ici l’opposition dirigée contre la personne.
- source_word: τινες
  choice: quelques
  rationale: Le terme désigne un sous-ensemble indéterminé, naturellement rendu par « quelques ».
- source_word: ἄνομοι
  choice: hommes sans loi
  rationale: Cette expression garde la portée à la fois morale et juridique du grec, ainsi que sa forme masculine personnelle, sans transformer le terme en catégorie doctrinale technique.
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: issus de la nation
  rationale: Le groupe indique l’origine de ces hommes au sein de la nation, vraisemblablement la nation juive dans ce contexte, sans ajouter « leur propre » ni employer le trompeur « païens ».
theological_decisions:
- issue: Portée de ἄνομοι
  choice: hommes sans loi
  alternative: hommes mauvais
  rationale: Le grec exprime plus précisément le mépris ou la transgression de la loi qu’une méchanceté générale ; la formulation retenue préserve cette tension morale et juridique.
translation_notes:
  register: Français international moderne, sobre et digne. « Portaient plainte » est idiomatique et restitue la démarche auprès d’une autorité ; « hommes sans loi » demeure volontairement proche de l’expression grecque.
