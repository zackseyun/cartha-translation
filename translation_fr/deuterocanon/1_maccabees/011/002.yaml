  source_fidelity: Le texte grec présente un aoriste pour le départ (ἐξῆλθεν), puis deux imparfaits (ἤνοιγον, συνήντων), qui décrivent l'accueil répété ou en cours dans les villes. Le complément de « ouvrir » est implicite en grec; en français, « lui ouvrirent » sans complément est trop elliptique. La relation de beau-père concerne Ptolémée et Alexandre, comme l'indique la note.
  naturalness: « Les hommes venus des villes » suggère qu'ils venaient d'ailleurs, alors que le contexte vise les habitants ou représentants des villes. « Les hommes des villes » est plus direct. L'ajout contextuel minimal « leurs portes » rend la phrase française idiomatique; la note doit signaler que le grec ne l'exprime pas.
  terminology: « Paroles de paix », « ordre » et « beau-père » rendent fidèlement les termes grecs et conviennent au registre historique. Les pronoms finaux sont formellement ambigus dans le grec comme en français; la note les identifie sans imposer une interprétation doctrinale.
  issues:
