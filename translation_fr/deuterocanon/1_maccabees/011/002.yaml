  - severity: low
    issue: « venus des villes » est spatialement imprécis
    rationale: Cette expression peut suggérer des personnes arrivées depuis les villes. « des villes » désigne plus naturellement ici les habitants ou représentants concernés.
  - severity: low
    issue: Les imparfaits grecs ne sont pas reflétés
    rationale: ἤνοιγον et συνήντων sont à l'imparfait. « ouvraient » et « venaient » conservent mieux leur valeur descriptive ou répétée dans le récit.
