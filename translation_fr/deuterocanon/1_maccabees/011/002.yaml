  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
translation:
  language: fr
  text: Il se rendit en Syrie avec des paroles de paix[a], et les hommes des villes lui ouvraient leurs portes et venaient à sa rencontre, car le roi Alexandre avait donné l’ordre d’aller à sa rencontre[b], puisqu’il était son beau-père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec des paroles pacifiques ». L’expression désigne vraisemblablement des assurances de paix.'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas ce qui était « ouvert »; le contexte suggère les portes des villes. Alexandre avait ordonné aux villes d’accueillir favorablement Ptolémée et d’aller à sa rencontre, parce que Ptolémée était son beau-père.
    reason: referent_clarification
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se rendit
  rationale: Dans ce déplacement vers la Syrie, « se rendit » exprime naturellement le mouvement narratif de l’aoriste sans ajouter de nuance étrangère.
- source_word: λόγοις εἰρηνικοῖς
  choice: avec des paroles de paix
  rationale: Cette formulation conserve le substantif λόγοι et évoque des assurances diplomatiques pacifiques, plutôt qu’une simple disposition intérieure.
- source_word: ἤνοιγον αὐτῷ
  choice: lui ouvrirent
  rationale: Le grec ne précise pas ce qui fut ouvert. La traduction maintient cette ellipse; la note indique le sens contextuel probable.
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: les hommes venus des villes
  rationale: Le masculin pluriel désigne vraisemblablement des habitants ou représentants des villes; « venus des villes » rend clairement ἀπό.
- source_word: συνήντων αὐτῷ
  choice: allèrent à sa rencontre
  rationale: Cette tournure française naturelle rend la rencontre en contexte de déplacement et convient à l’accueil organisé décrit ici.
- source_word: ἐντολή
  choice: avait donné l’ordre
  rationale: « Ordre » traduit l’autorité de la directive royale tout en restant idiomatique dans un récit historique.
- source_word: συναντᾷν αὐτῷ
  choice: d’aller à sa rencontre
  rationale: L’infinitif donne le contenu de l’ordre; la formulation conserve l’idée d’une démarche d’accueil.
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: puisqu’il était son beau-père
  rationale: πενθερός signifie précisément « beau-père ». L’ambiguïté formelle des pronoms est conservée dans le texte, tandis que la note en explicite les référents contextuels.
