  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: fr
  text: Le roi Ptolémée mourut le troisième jour[a], et ceux qui se trouvaient dans ses forteresses furent anéantis par ceux qui étaient dans les forteresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec répète « dans les forteresses » dans les deux propositions. La formulation distingue probablement ceux qui se trouvaient dans les forteresses de Ptolémée de ceux qui, dans les forteresses, se retournèrent contre eux, mais le rapport exact entre les deux groupes reste condensé dans le grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: L’aoriste indique simplement la mort; « mourut » est direct, digne et sans euphémisme.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: le troisième jour
  rationale: Cette tournure rend naturellement l’expression grecque sans préciser un point de départ que le texte ne formule pas.
- source_word: οἱ ὄντες
  choice: ceux qui se trouvaient
  rationale: Cette formulation française désigne naturellement les personnes présentes sans ajouter qu’il s’agissait exclusivement d’hommes.
- source_word: ὀχυρώμασιν
  choice: forteresses
  rationale: Le terme grec désigne des lieux fortifiés; « forteresses » conserve clairement le cadre militaire.
- source_word: ἀπώλοντο
  choice: furent anéantis
  rationale: Le verbe exprime leur destruction sous l’action d’un autre groupe, sans réduire explicitement celle-ci à une modalité précise.
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: par ceux qui étaient dans les forteresses
  rationale: « Par » marque l’agent, tandis que la répétition du lieu fortifié maintient la formulation compacte et énigmatique du grec.
