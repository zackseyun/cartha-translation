  register: Français international moderne, narratif et digne. La syntaxe grecque cumulative est légèrement répartie en deux phrases pour une lecture naturelle, sans perte de contenu. « D’une grande force » préserve l’emphase de δυνατοὺς ἰσχύι αὐτῶν sans reproduire une tournure artificiellement tautologique.
