  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
translation:
  language: fr
  text: Jonathan envoya à Antioche trois mille hommes d’une grande force. Ils se rendirent auprès du roi, et le roi se réjouit de leur arrivée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur approche » ou « de leur venue » ; le terme grec peut désigner le fait d’approcher ou de venir, mais il se rapporte probablement ici à l’arrivée des hommes de Jonathan auprès du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Verbe narratif courant et direct, correspondant naturellement à l’action d’envoyer des hommes vers une destination.
- source_word: ἄνδρας τρισχιλίους
  choice: trois mille hommes
  rationale: Conserve le sens explicite de ἄνδρας sans ajouter « soldats », même si le contexte est militaire.
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: d’une grande force
  rationale: Rend l’insistance de la tournure grecque sur leur puissance ou leur capacité, dans un français naturel et digne.
- source_word: εἰς Ἀντιοχίαν
  choice: à Antioche
  rationale: Expression française idiomatique du déplacement vers une ville.
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: ils se rendirent auprès du roi
  rationale: Exprime le mouvement vers la personne du roi sans suggérer qu’ils sont simplement entrés dans la ville.
- source_word: ηὐφράνθη
  choice: se réjouit
  rationale: Restitue clairement la joie exprimée par le verbe grec tout en maintenant un registre narratif élevé.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: de leur arrivée
  rationale: Dans cette séquence, ἔφοδος désigne le plus naturellement leur venue ou leur arrivée, tout en pouvant aussi évoquer leur approche.
