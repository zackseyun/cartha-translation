  text: And Tryphon took the elephants and gained control of Antioch[a].
translation:
  language: fr
  text: Tryphon prit les éléphants[a] et s’empara d’Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les bêtes » ; dans ce contexte militaire, il s’agit des éléphants de guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: prit
  rationale: L’aoriste de λαμβάνω avec un complément direct signifie naturellement « prit » dans ce récit politico-militaire; cette formulation reste proche du grec sans préciser à tort s’il les captura ou les reçut.
- source_word: Τρύφων
  choice: Tryphon
  rationale: Transcription française usuelle du nom grec.
- source_word: τὰ θηρία
  choice: les éléphants
  rationale: L’expression signifie littéralement « les bêtes », mais, dans ce contexte militaire hellénistique, elle désigne les éléphants de guerre. Le référent explicite évite une formulation française obscure.
- source_word: κατεκράτησεν
  choice: s’empara de
  rationale: Avec le génitif Ἀντιοχίας, κατακρατέω exprime ici la prise de maîtrise ou de contrôle sur la ville. « S’empara de » rend naturellement la portée politico-militaire du verbe.
- source_word: Ἀντιοχίας
  choice: Antioche
  rationale: Forme française traditionnelle du nom de la ville; le génitif dépend de κατακρατέω.
