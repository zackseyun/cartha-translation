base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: fr
  text: Il lui envoya des objets en or et un service de table[a], et lui accorda le droit de boire dans de la vaisselle en or[b], de porter la pourpre et de porter une agrafe en or[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Service de table » peut aussi désigner du matériel de service ou, moins probablement, du personnel de service.
    reason: lexical_alternative
  - marker: b
    text: Le même mot grec est rendu plus haut par « objets en or »; il peut aussi désigner ici de la vaisselle en or, sans préciser la forme des récipients.
    reason: lexical_alternative
  - marker: c
    text: Ou « fermoir en or » ou « broche en or »; il s’agit d’une attache de vêtement, dont la forme exacte n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: objets en or / coupes en or
  rationale: Le pluriel désigne des objets fabriqués en or. À la première occurrence, « objets en or » préserve l’étendue du terme; dans le contexte explicite de boire, « coupes en or » rend naturellement sa fonction sans imposer ce sens à la première occurrence.
- source_word: διακονίαν
  choice: un service de table
  rationale: En coordination avec les objets en or et dans ce cadre de cour, le mot désigne vraisemblablement le nécessaire ou le service lié à la table; une note conserve les autres possibilités.
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Il s’agit ici d’une prérogative officiellement accordée par le souverain. « Le droit » est naturel en français et convient mieux que « l’autorité » devant les infinitifs qui suivent.
- source_word: πίνειν ἐν χρυσώμασιν
  choice: boire dans des coupes en or
  rationale: L’expression évoque l’usage de vaisselle d’or pour boire. « Coupes » donne en français une image concrète et idiomatique adaptée au contexte.
- source_word: εἶναι ἐν πορφύρᾳ
  choice: porter la pourpre
  rationale: Cette tournure française concise exprime le port de vêtements teints en pourpre, marque de haut rang à la cour.
- source_word: πόρπην χρυσῆν
  choice: une agrafe en or
  rationale: πόρπη désigne une attache de vêtement, éventuellement ornementale. « Agrafe » est historiquement et fonctionnellement plus précis que « boucle », sans imposer la forme d’une broche.
