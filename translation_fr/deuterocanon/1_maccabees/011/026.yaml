revisions:
- from: Le roi agit envers lui comme l’avaient fait ses prédécesseurs, et il l’éleva au-dessus de tous ses Amis[a].
  to: Le roi agit à son égard comme l’avaient fait ses prédécesseurs, et il l’éleva devant tous les amis du roi[a].
  rationale: La révision conserve le sens relationnel et politique de ποιεῖν avec datif, tout en adoptant « devant » pour le sens spatial/public premier de ἐναντίον et en reléguant l’interprétation hiérarchique, également possible, à la note. Elle supprime une majuscule interprétative et clarifie que les φίλοι sont ceux du roi.
