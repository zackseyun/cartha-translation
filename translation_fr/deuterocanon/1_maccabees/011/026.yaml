    issue: Sens principal de ἐναντίον imposé comme comparatif
    rationale: « Au-dessus de » sélectionne la lecture d’élévation hiérarchique, tandis que le grec peut aussi, et lexicalement d’abord, exprimer une élévation devant les membres de la cour. Il convient de conserver l’alternative dans la traduction et la note.
  - severity: low
    issue: Majuscule non motivée à « Amis »
    rationale: Le grec ne présente pas ici un titre formel marqué. En français, « Amis » avec majuscule risque de suggérer une appellation officielle établie plutôt que le terme de cour φίλοι.
  - severity: low
    issue: Antécédent français du possessif insuffisamment clair
    rationale: Dans « tous ses Amis », « ses » peut être momentanément rattaché à Jonathan ou aux prédécesseurs; « du roi » rend explicite le référent contextuel de αὐτοῦ.
