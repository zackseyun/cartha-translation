  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: fr
  text: Le roi agit à son égard comme l’avaient fait ses prédécesseurs, et il l’éleva devant tous les amis du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au-dessus de tous les amis du roi ». Le grec peut désigner une élévation publique en présence des membres de la cour, mais le contexte peut aussi indiquer une élévation de rang au-dessus d’eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: agit envers lui
  rationale: La tournure ποιέω avec le datif désigne ici ce que le roi fit à l’égard de Jonathan. « Agit envers lui » reste proche du grec tout en étant naturel en français.
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: comme l’avaient fait ses prédécesseurs
  rationale: οἱ πρὸ αὐτοῦ désigne les rois qui l’avaient précédé. « Ses prédécesseurs » explicite sobrement ce référent et évite une formulation française pesante.
- source_word: ὕψωσεν
  choice: il l’éleva
  rationale: ὑψόω exprime une élévation d’honneur ou de rang dans ce contexte de cour. « Éleva » conserve l’image et la dignité du grec sans préciser indûment la modalité.
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: au-dessus de tous ses Amis
  rationale: Avec ὕψωσεν, la phrase peut indiquer une élévation de rang au-dessus des membres de la cour. La majuscule à « Amis » signale discrètement l’emploi comme titre de cour hellénistique, tandis que la note conserve l’autre lecture possible de ἐναντίον.
