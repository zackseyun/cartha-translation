review_pass:
  verdict: revise
  source_fidelity: La formulation « agit envers lui » rend de façon recevable ποιεῖν avec datif, et « ses prédécesseurs » identifie correctement οἱ πρὸ αὐτοῦ comme les rois antérieurs. Toutefois, ἐναντίον signifie premièrement « devant / en présence de »; dans ce contexte, une élévation de rang « au-dessus de » reste possible, mais ne doit pas être imposée sans préserver l’ambiguïté. Le possessif αὐτοῦ renvoie au roi dans le contexte de la cour.
  naturalness: « Le roi agit à son égard » est un peu plus idiomatique et fluide que « agit envers lui ». « Tous les amis du roi » évite l’ambiguïté française de « ses amis ».
  terminology: La majuscule à « Amis » n’est pas justifiée par le grec et paraît artificielle en français moderne. Le nom commun « amis » peut désigner les membres du cercle de cour; une note peut signaler la nuance institutionnelle sans en faire un titre graphique.
  issues:
