  yaml_path: translation/deuterocanon/1_maccabees/011/021.yaml
  text: And some lawless men[a], who hated their own nation, went to the king and reported to him that Jonathan was besieging the citadel.
translation:
  language: fr
  text: Quelques hommes sans loi, qui haïssaient leur propre nation, allèrent trouver le roi et lui rapportèrent que Jonathan assiégeait la citadelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Acra », la citadelle fortifiée de Jérusalem.'
    reason: Variante lexicale et identification historique possible de τὴν ἄκραν.
lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: allèrent trouver
  rationale: Dans ce contexte, le mouvement a pour but une audience auprès du roi. Cette tournure est naturelle en français et n’ajoute pas de détail substantiel.
- source_word: τινες
  choice: quelques hommes
  rationale: L’indéfini pluriel est conservé, tandis que « hommes » reprend l’apposition grecque ἄνδρες.
- source_word: μισοῦντες τὸ ἔθνος αὐτῶν
  choice: qui haïssaient leur propre nation
  rationale: La proposition relative rend naturellement le participe descriptif et « leur propre nation » conserve le sens ethnico-politique de ἔθνος ainsi que l’insistance de αὐτῶν.
- source_word: ἄνδρες παράνομοι
  choice: hommes sans loi
  rationale: Cette expression maintient la portée à la fois morale et juridique de παράνομοι sans réduire ces hommes à de simples criminels ni préciser abusivement qu’il s’agit ici de la Torah.
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe désigne la transmission d’un rapport à une autorité; « rapportèrent » convient au cadre royal.
- source_word: περικάθηται
  choice: assiégeait
  rationale: Dans le contexte militaire d’une place fortifiée, le verbe décrit l’encerclement ou l’investissement de celle-ci; « assiégeait » exprime clairement cette action.
- source_word: τὴν ἄκραν
  choice: la citadelle
  rationale: Ἄκρα désigne ici la place forte de Jérusalem. Le nom commun est clair en français; le nom historique « Acra » est conservé en note.
