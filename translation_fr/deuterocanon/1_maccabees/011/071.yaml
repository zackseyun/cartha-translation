  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
translation:
  language: fr
  text: Jonathan déchira ses vêtements[a], se mit de la terre sur la tête[b] et pria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était un signe habituel de deuil ou de profonde détresse.
    reason: cultural_note
  - marker: b
    text: Ou « de la poussière sur la tête ». Le grec emploie ici le mot « terre » (γῆ). Mettre de la terre ou de la poussière sur sa tête exprimait habituellement le deuil, la détresse ou la lamentation.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: διέρρηξεν
  choice: déchira
  rationale: L’aoriste de διαρρήγνυμι décrit ici le geste de déchirer ses vêtements sous le coup de la détresse. « Déchira » est précis et naturel en français moderne.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ses vêtements
  rationale: Ἱμάτια désigne de manière générale les habits ou vêtements. « Ses vêtements » est courant et n’introduit pas l’idée plus spécifique de robes.
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: se mit de la terre sur la tête
  rationale: Γῆ signifie littéralement « terre » ou « sol ». La tournure pronominale rend naturellement le moyen grec tout en conservant le terme concret de la source.
- source_word: προσηύξατο
  choice: pria
  rationale: L’aoriste de προσεύχομαι signifie simplement qu’il pria.
- source_word: Ἰωνάθαν
  choice: Jonathan
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
theological_decisions:
- issue: Gestes de détresse et de deuil
  choice: Conserver les gestes dans le récit sans expliciter leur portée dans le corps du texte.
  alternative: Remplacer « terre » par « poussière » et expliciter directement qu’il s’agit d’un geste de deuil.
  rationale: Le grec rapporte sobrement les gestes et la prière. Leur signification culturelle peut être indiquée en note sans imposer au texte une interprétation plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. La coordination narrative reste proche du grec, tandis que « se mit de la terre sur la tête » évite une formulation artificiellement littérale.
