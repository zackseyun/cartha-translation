revisions:
- from: Et voici qu’une armée d’étrangers vint à sa rencontre dans la plaine. Ils placèrent des hommes en embuscade contre lui dans les montagnes, tandis qu’eux-mêmes s’avançaient à sa rencontre de front.[a]
  to: Et voici qu’un camp d’étrangers vint à sa rencontre dans la plaine. Ils lui tendirent une embuscade dans les montagnes, tandis qu’eux-mêmes venaient à sa rencontre d’en face.[a]
  rationale: La révision privilégie le sens premier de παρεμβολή (« camp »), remplace l’explicitation non nécessaire « des hommes » par l’expression française usuelle « tendre une embuscade », et rend la dernière clause de façon plus proche de ἀπήντησαν ἐξ ἐναντίας tout en maintenant son ambiguïté en note.
  reviewer_model: gpt-5.6-terra
