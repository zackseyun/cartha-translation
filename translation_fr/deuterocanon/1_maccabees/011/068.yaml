base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: fr
  text: Et voici qu’un camp d’étrangers vint à sa rencontre dans la plaine. Ils lui tendirent une embuscade dans les montagnes, tandis qu’eux-mêmes venaient à sa rencontre d’en face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tandis qu’eux-mêmes venaient à sa rencontre du côté opposé ». Littéralement, le grec dit : « ils vinrent à sa rencontre depuis l’opposé / en face ».'
    reason: La locution grecque ἐξ ἐναντίας peut désigner une position opposée ou une arrivée face à lui; elle ne précise pas davantage la manœuvre.
lexical_decisions:
- source_word: παρεμβολὴ
  choice: armée
  rationale: Dans ce contexte de confrontation et de déploiement tactique, le nom désigne vraisemblablement la troupe organisée plutôt que son campement matériel. « Armée » rend clairement la force militaire en mouvement.
- source_word: ἀλλοφύλων
  choice: d’étrangers
  rationale: Le terme désigne des gens d’un autre peuple. « Étrangers » conserve cette portée générale sans les identifier à tort aux Philistins.
- source_word: ἀπήντα αὐτῷ
  choice: vint à sa rencontre
  rationale: Cette formulation française naturelle rend le mouvement exprimé par le verbe et son complément, sans déterminer à elle seule la nature exacte de l’affrontement.
- source_word: ἐν τῷ πεδίῳ
  choice: dans la plaine
  rationale: « Plaine » exprime ici un terrain ouvert et plat, en contraste direct avec les montagnes de la proposition suivante.
- source_word: ἐξέβαλον ἔνεδρον
  choice: placèrent des hommes en embuscade
  rationale: L’expression grecque signifie disposer une embuscade. L’explicitation « des hommes » évite en français l’image maladroite consistant à placer l’embuscade elle-même.
- source_word: ἐπʼ αὐτόν
  choice: contre lui
  rationale: Dans ce contexte militaire, la préposition marque l’orientation hostile de l’embuscade.
- source_word: ἐν τοῖς ὄρεσιν
  choice: dans les montagnes
  rationale: Traduction locative directe qui maintient le contraste topographique avec la plaine.
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: tandis qu’eux-mêmes s’avançaient à sa rencontre de front
  rationale: « Eux-mêmes » conserve l’emphase et le contraste avec les hommes embusqués. « De front » communique la position opposée ou frontale, tout en laissant en note la formulation plus littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La traduction conserve le contraste entre la plaine et les montagnes ainsi qu’entre les hommes placés en embuscade et le corps principal avançant de front.
