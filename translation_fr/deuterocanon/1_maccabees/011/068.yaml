review_pass:
  verdict: revise
  source_fidelity: « Armée » interprète παρεμβολή comme une force combattante plutôt que comme un camp/une troupe en ordre de marche. Cela reste possible dans le contexte, mais « camp » correspond plus directement au terme grec et au choix prudent de la piste d’audit anglaise. La dernière proposition doit conserver l’idée de rencontre/opposition (ἀπήντησαν ἐξ ἐναντίας) sans préciser indûment un axe de progression.
  naturalness: La formulation révisée demeure naturelle dans un récit historique en français moderne. « Ils lui tendirent une embuscade » est idiomatique et ne rajoute pas explicitement des hommes là où le grec parle d’une embuscade.
  terminology: « Camp d’étrangers » conserve le sens militaire de παρεμβολή et le caractère générique de ἀλλόφυλοι. « Étrangers » ne doit pas être remplacé par « Philistins », identification absente du grec.
  issues:
  - severity: medium
    issue: « une armée d’étrangers » pour παρεμβολὴ
    rationale: Le grec désigne en premier lieu un camp/une troupe campée. « Armée » restreint et explicite le référent plus que nécessaire; « camp » préserve mieux le lexique source et l’audit anglais.
  - severity: low
    issue: « s’avançaient à sa rencontre de front » pour ἀπήντησαν ἐξ ἐναντίας
    rationale: « S’avançaient » ajoute une nuance progressive et « de front » peut être compris comme la manière du combat. Le grec affirme surtout qu’ils vinrent à sa rencontre depuis le côté opposé/en face.
