base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: fr
  text: Le roi appela les Juifs à son secours. Ils se rassemblèrent tous ensemble auprès de lui, puis se déployèrent dans la ville[a]. Ce jour-là, ils tuèrent dix mille personnes dans la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « furent dispersés dans la ville » ou « se dispersèrent dans la ville »; « se déployèrent » traduit ici le sens militaire probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: L’aoriste de καλέω exprime ici simplement l’appel adressé par le roi; « appela » conserve la sobriété du récit.
- source_word: εἰς βοήθειαν
  choice: à son secours
  rationale: La locution indique que les Juifs sont appelés pour porter secours au roi. Cette formulation est naturelle en français et explicite le bénéficiaire implicite.
- source_word: ἐπισυνήχθησαν
  choice: se rassemblèrent
  rationale: Le passif à sens réfléchi décrit leur rassemblement auprès du roi; « se rassemblèrent » est courant et précis.
- source_word: πάντες ἅμα
  choice: tous ensemble
  rationale: Cette expression rend à la fois la totalité exprimée par πάντες et l’action commune ou simultanée indiquée par ἅμα.
- source_word: διεσπάρησαν
  choice: se déployèrent
  rationale: Le sens littéral est « furent dispersés » ou « se dispersèrent ». Dans ce contexte militaire, « se déployèrent » restitue probablement l’idée d’une répartition tactique dans la ville sans suggérer une fuite.
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: Équivalent français direct et moderne, sans coloration archaïque.
- source_word: εἰς μυριάδας δέκα
  choice: dix mille personnes
  rationale: Dans cet emploi, μυριάς désigne un groupe de dix mille. L’ajout de « personnes » clarifie en français que le nombre porte sur les victimes.
