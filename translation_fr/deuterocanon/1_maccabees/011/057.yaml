base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: fr
  text: 'Antiochos le Jeune écrivit à Jonathan en ces termes : « Je te confère la charge de grand prêtre, je te nomme à la tête des quatre districts et je te compte parmi les Amis du roi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les amis du roi ». Le grec désigne probablement un rang officiel à la cour de la monarchie hellénistique, et non de simples compagnons personnels.
    reason: Alternative lexicale et précision historique concernant un probable titre de cour.
lexical_decisions:
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste indique simplement l’acte d’écrire; la formule « en ces termes » rend naturellement le participe λέγων dans ce contexte épistolaire.
- source_word: ὁ νεώτερος
  choice: le Jeune
  rationale: Cette épithète distingue cet Antiochos d’un autre souverain du même nom. « Le Jeune » est une formulation française naturelle et historiquement intelligible.
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: Je t’établis dans la fonction de grand prêtre
  rationale: Dans ce contexte administratif, ἵστημι exprime l’installation officielle, tandis que ἀρχιερωσύνη désigne la charge ou la dignité de grand prêtre. Cette formulation évite le calque peu naturel « j’établis pour toi la grande-prêtrise ».
- source_word: καθίστημί σε ἐπὶ
  choice: je te nomme à la tête de
  rationale: Le verbe exprime ici la désignation d’une personne comme responsable d’un territoire. « Nommer à la tête de » en restitue clairement la portée administrative.
- source_word: τῶν τεσσάρων νομῶν
  choice: des quatre districts
  rationale: νόμοι désigne ici des circonscriptions administratives. « Districts » est précis et compréhensible, sans suggérer des provinces de plus grande étendue.
- source_word: εἶναί σε τῶν φίλων τοῦ βασιλέως
  choice: je te compte parmi les Amis du roi
  rationale: L’infinitif coordonné exprime l’octroi d’un statut supplémentaire. La tournure française explicite naturellement cette relation, et la majuscule à « Amis » signale le probable titre de cour hellénistique.
theological_decisions:
- issue: Statut des φίλοι τοῦ βασιλέως
  choice: les Amis du roi
  alternative: les amis du roi
  rationale: L’expression désigne probablement un rang officiel à la cour hellénistique plutôt que de simples relations personnelles. La majuscule conserve cette nuance sans la développer dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et fluide. Le style administratif de la lettre royale est conservé par « j’établis », « je te nomme » et « je te compte parmi ». Le marqueur de note est placé immédiatement après l’expression qu’il explique.
