  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
translation:
  language: fr
  text: Il lui confirma la charge de grand prêtre, ainsi que les autres honneurs qu’il détenait auparavant, et le fit compter parmi les premiers amis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les principaux amis ». Le grec désigne probablement un rang officiel à la cour dans l’administration séleucide.
    reason: Alternative lexicale et précision historique concernant un probable titre de cour.
lexical_decisions:
- source_word: ἐστήρισεν
  choice: confirma
  rationale: Dans ce contexte politique et administratif, le verbe exprime l’affermissement officiel d’une fonction déjà accordée plutôt qu’une première nomination.
- source_word: ἀρχιερωσύνην
  choice: la charge de grand prêtre
  rationale: Le nom désigne la fonction ou la dignité du grand prêtre. Cette formulation est naturelle en français moderne et explicite qu’il s’agit d’un office.
- source_word: τίμια
  choice: honneurs
  rationale: L’adjectif substantivé désigne ici des marques de distinction ou des prérogatives honorifiques, et non des biens matériels précieux.
- source_word: τὸ πρότερον
  choice: auparavant
  rationale: L’expression renvoie aux honneurs dont Jonathan bénéficiait déjà à une époque antérieure.
- source_word: τῶν πρώτων φίλων
  choice: parmi les premiers Amis
  rationale: La formulation relativement littérale préserve probablement le nom d’un rang officiel de la cour séleucide; la majuscule signale cet emploi institutionnel.
- source_word: ἡγεῖσθαι
  choice: le fit compter
  rationale: Dans cette construction, le verbe signifie faire considérer ou classer quelqu’un comme membre d’un groupe déterminé.
