  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
translation:
  language: fr
  text: Tandis qu’il entrait dans les villes de Ptolémaïs[a], il y postait des troupes en garnison, dans chacune d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « dans les villes Ptolémaïs ». La relation exacte entre « villes » et Ptolémaïs est condensée et incertaine. Cette expression peut désigner des villes liées à Ptolémaïs ou, selon une interprétation contextuelle, des villes relevant de Ptolémée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: À mesure que
  rationale: Introduit une transition temporelle et exprime la simultanéité progressive des actions dans ce récit.
- source_word: εἰσεπορεύετο
  choice: il entrait
  rationale: L’imparfait rend le mouvement progressif ou répété à travers plusieurs villes.
- source_word: εἰς τὰς πόλεις Πτολεμαΐς
  choice: dans les villes de Ptolémée
  rationale: La construction grecque est condensée et grammaticalement inhabituelle. En contexte, elle désigne vraisemblablement les villes relevant de Ptolémée plutôt qu’une ville unique appelée Ptolémaïs.
- source_word: ἀπετάσσε
  choice: il installait
  rationale: Dans ce contexte militaire, le verbe exprime l’affectation et le déploiement de troupes à des postes fixes.
- source_word: τὰς δυνάμεις
  choice: des troupes
  rationale: Désigne ici des forces armées organisées; « troupes » est naturel et n’implique pas plusieurs armées complètes.
- source_word: φρουράν
  choice: en garnison
  rationale: Rend la fonction assignée aux troupes et constitue la formulation militaire française la plus idiomatique.
- source_word: ἐν ἑκάστῃ πόλει
  choice: dans chacune d’elles
  rationale: Préserve la valeur distributive de ἑκάστῃ tout en évitant la répétition pesante de « ville ».
