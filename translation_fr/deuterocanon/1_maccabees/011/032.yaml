lexical_decisions:
- source_word: Βασιλεὺς
  choice: Le roi
  rationale: Titre royal placé avant le nom de l’expéditeur dans l’en-tête de la lettre.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française usuelle du nom grec, avec accentuation adaptée.
- source_word: Λασθένει
  choice: à Lasthénès
  rationale: Le datif désigne le destinataire selon la formule épistolaire grecque.
- source_word: τῷ πατρὶ
  choice: son père
  rationale: Traduction littérale de l’apposition à Lasthénès; la formulation préserve la possibilité d’un titre honorifique ou de cour sans l’imposer dans le texte.
- source_word: χαίρειν
  choice: salut !
  rationale: Équivalent français idiomatique de l’infinitif employé comme salutation dans les lettres grecques, plutôt que le calque « se réjouir ».
