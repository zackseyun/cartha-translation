  text: 'Le roi Démétrios à Lasthénès, son père[a] : salut ![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « son père » est probablement un titre honorifique ou de cour, et n’indique pas nécessairement un lien de parenté biologique.
