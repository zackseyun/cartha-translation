  source_fidelity: 'Le sens narratif est globalement fidèle : le déplacement vers Gaza, le refus d’accès, l’installation autour de la ville, l’incendie des zones périphériques et leur pillage sont tous présents. Toutefois, « mais » introduit une opposition que le grec καί n’exprime pas nécessairement; « et » est plus fidèle. « Lui en fermèrent l’accès » est compréhensible, mais moins direct et moins naturel que « lui interdirent l’accès à la ville ».'
