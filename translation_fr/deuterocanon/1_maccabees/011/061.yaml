  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: fr
  text: Puis il partit de là pour Gaza, et les habitants de Gaza lui interdirent l’accès à la ville. Il établit son camp autour de Gaza[a], incendia ses zones périphériques[b] et les pilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il l’assiégea ». Le grec dit littéralement qu’il s’installa, ou « s’assit », autour d’elle.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque rendue par « ses zones périphériques » est difficile. Elle peut désigner les zones situées autour de Gaza, notamment ses environs ou ses faubourgs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: partit
  rationale: Dans ce récit de déplacement, « partit de là pour Gaza » rend naturellement l’aoriste grec sans alourdir la phrase.
- source_word: ἀπέκλεισαν
  choice: lui en fermèrent l’accès
  rationale: Le verbe exprime l’action de barrer ou de fermer. Cette formulation française indique clairement que les habitants empêchent Jonathan d’entrer dans Gaza.
- source_word: οἱ ἀπὸ Γάζης
  choice: les habitants de Gaza
  rationale: L’expression signifie littéralement « ceux de Gaza ». « Les habitants de Gaza » reste naturelle et n’ajoute pas une précision masculine absente du contexte immédiat.
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: Il établit son camp tout autour de la ville
  rationale: La formulation conserve l’image grecque de s’installer autour de Gaza et laisse entendre le siège sans remplacer l’expression par une interprétation plus condensée.
- source_word: τὰ περίπολα αὐτῆς
  choice: ses alentours
  rationale: Le terme est difficile dans ce contexte. « Ses alentours » demeure assez large pour désigner les zones périphériques, les environs ou les faubourgs de Gaza sans trancher indûment.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: mit le feu à
  rationale: Cette tournure idiomatique française exprime pleinement l’incendie, bien qu’elle ne reproduise pas le pléonasme grec mot pour mot.
- source_word: ἐσκύλευσεν
  choice: pilla
  rationale: Terme militaire clair et actuel pour l’action d’emporter le butin d’un lieu attaqué.
