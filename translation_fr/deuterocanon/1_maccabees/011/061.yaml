  terminology: « Habitants de Gaza » est recevable pour οἱ ἀπὸ Γάζης. « Établit son camp autour de Gaza » préserve l’image de περιεκάθισεν sans imposer « assiéger ». « Zones périphériques » rend le terme difficile τὰ περίπολα de manière volontairement large; la note conserve les possibilités « environs » et « faubourgs ».
