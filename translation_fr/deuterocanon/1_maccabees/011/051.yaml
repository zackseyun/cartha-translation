  to: Ils jetèrent leurs armes et firent la paix. Les Juifs furent honorés devant le roi et devant tous ceux qui étaient dans son royaume ; ils retournèrent à Jérusalem avec beaucoup de butin.
  rationale: La révision retire l'intensification ajoutée à « honorés », rend plus directement le groupe « tous ceux qui étaient dans son royaume » et traduit πολλά par « beaucoup de ». Elle conserve la sobriété narrative, le registre moderne et la structure du grec, sans ajouter d'objet à « firent la paix ».
