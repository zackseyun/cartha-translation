  naturalness: Le français est fluide et convient à un récit historique moderne. « Furent honorés » est plus direct et naturel que « furent tenus en grand honneur » tout en restant fidèle au passif grec.
  terminology: « Armes », « firent la paix », « roi », « royaume », « Jérusalem » et « butin » sont appropriés. « Beaucoup de butin » rend plus directement πολλά sans surinterpréter son degré par « considérable ».
