base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/051.yaml
  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: fr
  text: Ils jetèrent leurs armes et firent la paix. Les Juifs furent honorés devant le roi et devant tous ceux qui étaient dans son royaume ; ils retournèrent à Jérusalem avec beaucoup de butin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: jetèrent leurs armes
  rationale: Rend directement le geste de jeter les armes, qui marque ici la cessation du combat ou la reddition, sans l'atténuer en simple dépôt.
- source_word: ἐποίησαν εἰρήνην
  choice: firent la paix
  rationale: Expression française naturelle et proche de l'idiome grec, sans ajouter de complément absent du texte.
- source_word: ἐδοξάσθησαν
  choice: furent tenus en grand honneur
  rationale: Dans ce récit historique, le passif exprime l'estime et le prestige publics plutôt qu'une glorification au sens cultuel; « grand » fait entendre la force de δοξάζω sans devenir théologique.
- source_word: ἐναντίον τοῦ βασιλέως
  choice: devant le roi
  rationale: Conserve l'image de la présence et du regard du roi, tout en pouvant évoquer son estime.
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: devant tous ceux qui se trouvaient dans son royaume
  rationale: Reproduit l'élargissement de la reconnaissance publique à l'ensemble des personnes présentes dans le royaume.
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: retournèrent à Jérusalem
  rationale: Équivalent narratif direct et idiomatique du grec.
- source_word: σκῦλα πολλά
  choice: un butin considérable
  rationale: σκῦλα désigne le butin pris à l'ennemi; cette formulation est naturelle en français moderne et rend l'abondance exprimée par πολλά.
