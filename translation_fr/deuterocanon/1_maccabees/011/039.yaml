base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: fr
  text: Tryphon avait autrefois été l’un des hommes d’Alexandre. Voyant que toutes les troupes murmuraient contre Démétrius, il se rendit auprès de Simmakouès l’Arabe, qui élevait Antiochus, le jeune enfant d’Alexandre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’enfant d’Alexandre », c’est-à-dire son fils.'
    reason: La construction grecque est elliptique; la note précise la relation filiale sans la substituer silencieusement dans le texte.
lexical_decisions:
- source_word: Τρύφων
  choice: Tryphon
  rationale: Transcription française usuelle du nom grec.
- source_word: τῶν παρὰ Ἀλεξάνδρου τὸ πρότερον
  choice: avait autrefois été l’un des hommes d’Alexandre
  rationale: L’expression désigne une ancienne appartenance à l’entourage ou au parti d’Alexandre, sans préciser le rang de Tryphon.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: toutes les troupes
  rationale: Dans ce contexte militaire, δυνάμεις désigne les forces armées; « troupes » est naturel et précis en français.
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: murmuraient contre Démétrios
  rationale: Le verbe exprime un mécontentement formulé à voix basse, et κατά marque ici l’hostilité dirigée contre Démétrios.
- source_word: ἐπορεύθη πρὸς Σιμμάκουην τὸν Ἄραβα
  choice: il se rendit auprès de Simmakouès l’Arabe
  rationale: « Se rendit auprès de » restitue naturellement le déplacement vers une personne; le nom suit de près la forme grecque de cette édition.
- source_word: ἔτρεφεν
  choice: élevait
  rationale: Le verbe signifie ici nourrir et faire grandir un enfant; « élevait » réunit naturellement les idées de soin et d’éducation.
- source_word: τὸ παιδάριον
  choice: le jeune enfant
  rationale: Le diminutif souligne le jeune âge d’Antiochos; « jeune enfant » reste digne et idiomatique.
- source_word: τὸ τοῦ Ἀλεξάνδρου
  choice: d’Alexandre
  rationale: La tournure grecque est elliptique et indique l’appartenance ou la filiation; le texte conserve sa concision et la note explicite le sens probable.
