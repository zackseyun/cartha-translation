review_pass:
  verdict: revise
  source_fidelity: La demande d’expulsion, la double désignation des personnes visées et l’hostilité militaire envers Israël sont bien rendues. Toutefois, « envoya un message » introduit un objet (« un message ») qui n’est pas exprimé par le grec, et « les hommes de la Citadelle » restreint inutilement τοὺς à des hommes tout en présentant « Citadelle » comme un nom propre dans le texte.
  naturalness: La phrase est globalement fluide et de registre narratif moderne. « Envoya demander au roi » est plus idiomatique et plus sobre que « envoya un message ... pour lui demander ». « Ceux de la citadelle » conserve une formulation naturelle sans ajouter un référent masculin.
  terminology: « Roi Démétrios », « chasser de Jérusalem », « places fortes » et « faisaient la guerre à Israël » conviennent au grec et au français moderne. La note peut conserver « l’Acra » comme identification historique plus précise de la citadelle.
  issues:
  - severity: medium
    issue: Ajout de « un message »
    rationale: ἀπέστειλεν πρὸς Δημήτριον indique que Jonathan envoya auprès/vers Démétrios, sans nommer un message. Le français peut rendre la démarche par « envoya demander » sans spécifier l’objet ou le moyen de l’envoi.
  - severity: low
    issue: « les hommes de la Citadelle » est trop spécifiant
    rationale: τοὺς ἐκ τῆς ἄκρας désigne « ceux de/de la citadelle »; le grec ne précise pas leur sexe. La majuscule donne en outre à « Citadelle » un statut de nom propre que le texte français peut réserver à l’identification expliquée en note.
  revised_text: Jonathan envoya demander au roi Démétrios de chasser de Jérusalem ceux de la citadelle[a], ainsi que ceux qui se trouvaient dans les places fortes, car ils faisaient la guerre à Israël.
