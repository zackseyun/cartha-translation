base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/041.yaml
  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: fr
  text: Jonathan envoya demander au roi Démétrios de chasser de Jérusalem ceux de la citadelle[a], ainsi que ceux qui se trouvaient dans les places fortes, car ils faisaient la guerre à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « ceux de l’Acra », la citadelle séleucide de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν ... πρὸς
  choice: envoya un message à
  rationale: Dans ce contexte, Jonathan adresse une requête au roi; cette formulation naturelle en français explicite l'acte de communication sans préciser un messager absent du grec.
- source_word: Δημήτριον τὸν βασιλέα
  choice: au roi Démétrios
  rationale: Ordre idiomatique en français moderne, tout en conservant le nom grec sous la forme Démétrios.
- source_word: ἵνα ἐκβάλῃ
  choice: pour lui demander de chasser
  rationale: Après le verbe d'envoi, ἵνα exprime ici l'objet de la démarche; « chasser » préserve la force d'expulsion de ἐκβάλλω.
- source_word: τοὺς ἐκ τῆς ἄκρας ἐξ Ἱερουσαλήμ
  choice: de chasser de Jérusalem les hommes de la Citadelle
  rationale: La construction associe l'expulsion hors de Jérusalem aux occupants ou hommes de l'ἄκρα; la majuscule signale la forteresse séleucide particulière sans imposer la translittération technique « Acra ».
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: ceux qui se trouvaient dans les places fortes
  rationale: « Places fortes » rend naturellement le pluriel de ὀχύρωμα et reste assez large pour désigner divers lieux fortifiés.
- source_word: ἦσαν γὰρ πολεμοῦντες τὸν Ἰσραήλ
  choice: car ils faisaient la guerre à Israël
  rationale: La tournure périphrastique marque une action continue; « faire la guerre à » restitue le caractère militaire organisé de πολεμέω et son complément accusatif.
