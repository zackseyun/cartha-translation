  text: For I regret giving him my daughter[a], for he sought to kill me.
translation:
  language: fr
  text: 'Car je regrette de lui avoir donné ma fille : il a en effet cherché[a] à me tuer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a essayé de me tuer ». Le verbe grec peut exprimer aussi bien le fait de chercher à faire quelque chose que celui de le tenter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: je regrette
  rationale: Le parfait à valeur présente exprime un regret actuel concernant une décision passée. « Je regrette » est naturel en français et n’ajoute pas la connotation religieuse que pourrait avoir « je me repens ».
- source_word: δοὺς αὐτῷ
  choice: de lui avoir donné
  rationale: L’infinitif passé français rend clairement l’action accomplie qui fait l’objet du regret, tout en intégrant le pronom datif αὐτῷ.
- source_word: τὴν θυγατέρα μου
  choice: ma fille
  rationale: Traduction directe et naturelle du groupe nominal grec, sans explicitation inutile.
- source_word: ἐζήτησεν
  choice: il a cherché
  rationale: Avec l’infinitif, ζητέω peut signifier chercher à faire quelque chose ou tenter de le faire. « A cherché à » conserve cette formulation et son éventuelle nuance d’intention ou d’effort.
- source_word: ἀποκτεῖναί με
  choice: à me tuer
  rationale: Rend directement l’infinitif et son objet, sans ajouter la nuance juridique ou morale de « assassiner ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les deux γάρ sont rendus respectivement par « car » et « en effet », ce qui préserve l’enchaînement explicatif sans alourdir la phrase.
