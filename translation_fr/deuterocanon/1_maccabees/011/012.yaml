base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/012.yaml
  text: And after taking his daughter away from him[a], he gave her to Demetrius; and Alexander’s attitude changed, and their hostility became evident.
translation:
  language: fr
  text: Après avoir retiré sa fille à Alexandre, il la donna à Démétrios. Le visage d’Alexandre changea[a], et leur hostilité devint manifeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi signifier qu’Alexandre changea d’attitude ou de disposition.
    reason: La formulation grecque signifie littéralement que « le visage d’Alexandre changea », image susceptible de dépasser la seule expression du visage.
lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: Après lui avoir repris sa fille
  rationale: Le participe aoriste moyen marque une action antérieure et ἀφαιρέω implique que la fille est retirée à Alexandre. « Reprendre » exprime naturellement cette dépossession, tandis que « lui » conserve la relation indiquée par αὐτοῦ.
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: il la donna à Démétrios
  rationale: La formulation conserve le sens simple de « donner » sans ajouter explicitement « en mariage », précision que le contexte suggère mais que le grec n’énonce pas ici.
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: Le visage d’Alexandre changea
  rationale: 'Cette traduction maintient l’image concrète du grec et son ambiguïté : elle peut désigner aussi bien une modification visible de l’expression qu’un changement d’attitude.'
- source_word: ἐφάνη ἡ ἔχθρα αὐτῶν
  choice: leur hostilité devint manifeste
  rationale: ἐφάνη indique que l’hostilité jusque-là moins visible se manifesta ouvertement. « Leur hostilité » rend la relation mutuelle exprimée par αὐτῶν.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction reste proche de l’image grecque tout en explicitant en note sa portée idiomatique possible.
