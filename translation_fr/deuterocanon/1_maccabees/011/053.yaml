  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: fr
  text: Il se montra trompeur dans tout ce qu’il avait dit[a], prit ses distances avec Jonathan, ne lui rendit pas les faveurs que Jonathan lui avait accordées et l’opprima durement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mentit dans tout ce qu’il avait dit » ou « agit avec déloyauté dans tout ce qu’il avait dit ». Le verbe grec peut désigner le mensonge dans les paroles ou, plus largement, une conduite trompeuse.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐψεύσατο
  choice: se montra faux
  rationale: Cette formulation conserve l’ambiguïté entre le mensonge verbal et une conduite déloyale, sans réduire le verbe au seul fait de mentir.
- source_word: πάντα ὅσα εἶπεν
  choice: dans tout ce qu’il avait dit
  rationale: Rend directement la portée globale de πάντα ὅσα et emploie le plus-que-parfait pour situer naturellement ces paroles avant la conduite rapportée.
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: s’éloigna de Jonathan
  rationale: Exprime la rupture relationnelle et la prise de distance sans renforcer indûment le sens en « devint hostile ».
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: ne lui rendit pas les bons offices
  rationale: « Rendre les bons offices » communique à la fois les actes favorables et la réciprocité portée par ἀνταποδίδωμι.
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: que Jonathan lui avait rendus
  rationale: Le nom « Jonathan » explicite le sujet contextuel de la relative; la répétition de « rendit/rendus » reproduit la réciprocité exprimée par la répétition du même verbe grec.
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: l’opprima durement
  rationale: Dans ce contexte politico-militaire, « opprima » convient à une action accablante ou coercitive; « durement » rend l’intensité de σφόδρα.
