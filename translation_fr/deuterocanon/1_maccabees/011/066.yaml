  yaml_path: translation/deuterocanon/1_maccabees/011/066.yaml
  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: fr
  text: Ils lui demandèrent d’accepter leurs engagements[a], et il leur en donna. Puis il les chassa de là, prit la ville et y établit une garnison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « recevoir des mains droites ». Cette expression désigne l’échange d’engagements ou de garanties de paix ou de fidélité, probablement symbolisé par le fait de se donner la main droite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: ils lui demandèrent
  rationale: Dans cette construction avec infinitif, le verbe exprime une demande; « demandèrent » reste naturel sans lui donner la force de « exigèrent ».
- source_word: δεξιὰς λαβεῖν
  choice: d’accepter leurs engagements
  rationale: Littéralement « recevoir des mains droites »; l’expression idiomatique désigne l’acceptation d’engagements ou de garanties, probablement scellés par un geste de la main droite.
- source_word: ἔδωκεν αὐτοῖς
  choice: il les leur accorda
  rationale: Le grec reprend elliptiquement les engagements demandés. « Les leur accorda » rend clairement et sobrement cette réponse favorable.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: il les chassa de là
  rationale: Cette formulation conserve la force de l’expulsion et la valeur spatiale de ἐκεῖθεν.
- source_word: κατελάβετο τὴν πόλιν
  choice: prit la ville
  rationale: Le moyen exprime ici la prise de possession; « prit la ville » est direct, naturel et n’ajoute aucun détail sur les modalités.
- source_word: ἔθετο ἐπʼ αὐτὴν φρουράν
  choice: y établit une garnison
  rationale: φρουρά désigne ici une force militaire chargée de garder la ville; « y établit » rend naturellement son installation dans ou sur la ville pour en assurer le contrôle.
