  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: fr
  text: Quand il apprit cela, il se mit en colère. Dès qu’il l’eut appris, il leva aussitôt le camp et se rendit à Ptolémaïs. Il écrivit à Jonathan de ne pas poursuivre le siège[a], mais de venir le rencontrer à Ptolémaïs au plus vite, afin de s’entretenir avec lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ne pas rester assis autour ». Dans ce contexte, il s’agit de maintenir le siège.'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation grecque de la rencontre est difficile : elle peut se rendre littéralement par « le rencontrer, se joindre à lui ». Le sens paraît être que Jonathan doit venir rencontrer l’auteur de la lettre pour s’entretenir avec lui.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: Quand il apprit cela / Dès qu’il l’eut appris
  rationale: La répétition du verbe grec est conservée, tandis que le passé simple puis le passé antérieur rendent naturellement en français la succession immédiate des actions.
- source_word: ὠργίσθη
  choice: il se mit en colère
  rationale: Rend le changement d’état exprimé par l’aoriste sans renforcer indûment l’intensité.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Expression française courante qui marque clairement l’immédiateté.
- source_word: ἀναζεύξας
  choice: il leva le camp
  rationale: Dans ce contexte militaire, le verbe désigne le départ d’un campement; cette expression en restitue le sens concret et idiomatique.
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: se rendit à Ptolémaïs
  rationale: Formulation narrative naturelle pour un déplacement vers la ville, sans imposer le point de vue déictique de « venir ».
- source_word: ἔγραψεν Ἰωναθὰν
  choice: Il écrivit à Jonathan
  rationale: Rend directement l’acte d’écrire et son destinataire.
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: de ne pas poursuivre le siège
  rationale: Le sens littéral de rester assis autour prend ici, dans le contexte militaire, le sens de maintenir un siège.
- source_word: ἀπαντῆσαι
  choice: de venir le rencontrer
  rationale: Exprime naturellement l’idée de se déplacer pour aller à la rencontre de quelqu’un.
- source_word: αὐτὸν αὐτῷ συνμίσγειν
  choice: afin de s’entretenir avec lui
  rationale: La construction transmise est maladroite; cette formulation conserve l’idée apparente d’une rencontre personnelle en vue d’un échange, sans préciser davantage son contenu.
- source_word: τὴν ταχίστην
  choice: au plus vite
  rationale: Équivalent français idiomatique de cette expression superlative indiquant la plus grande célérité possible.
