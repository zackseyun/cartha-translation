base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/006.yaml
  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
translation:
  language: fr
  text: Il lui donna l’autorité de rassembler des troupes, de fabriquer des armes et d’être son allié. Il ordonna aussi que les otages qui se trouvaient dans la citadelle[a] lui soient livrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Acra », la citadelle fortifiée de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ἐξουσίαν
  choice: Il lui donna l’autorité
  rationale: « Autorité » exprime ici un droit officiellement accordé dans un contexte politique et militaire, sans suggérer une puissance inhérente.
- source_word: συναγαγεῖν δυνάμεις
  choice: de rassembler des troupes
  rationale: Dans ce contexte, δυνάμεις désigne des forces militaires. « Troupes » est clair et idiomatique en français.
- source_word: κατασκευάζειν ὅπλα
  choice: de fabriquer des armes
  rationale: Avec ὅπλα, le verbe κατασκευάζειν évoque ici la préparation ou la production d’armement ; « fabriquer des armes » rend directement ce sens concret.
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: d’être son allié
  rationale: La construction grecque est compacte et chargée de pronoms ; cette formulation conserve le statut d’allié accordé ou reconnu sans ajouter d’explication absente du texte.
- source_word: τὰ ὅμηρα
  choice: les otages
  rationale: Ὅμηρα désigne normalement des personnes retenues comme garantie ; « otages » convient au cadre historique.
- source_word: ἐν τῇ ἄκρᾳ
  choice: dans la citadelle[a]
  rationale: Ἄκρα signifie « citadelle » ou « forteresse » et peut désigner plus précisément l’Acra de Jérusalem. Le terme commun reste transparent dans le texte, tandis que le nom historique est signalé en note.
- source_word: εἶπεν παραδοῦναι αὐτῷ
  choice: Il ordonna aussi que … lui soient livrés
  rationale: Après εἶπεν, l’infinitif a ici une valeur directive. La tournure française rend naturellement l’ordre et respecte la voix du contenu grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La longue coordination grecque est divisée en deux phrases pour plus de clarté, sans modifier la progression des actes accordés puis ordonnés. Le marqueur de note est placé après « citadelle », terme auquel il se rapporte.
