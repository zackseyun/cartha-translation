  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: fr
  text: 'Il en fut affligé et dit : « Qu’avons-nous fait là ? Alexandre nous a devancés en gagnant l’amitié des Juifs comme appui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθη
  choice: Il en fut affligé
  rationale: Le passif aoriste exprime ici une vive peine ou contrariété provoquée par la nouvelle; « affligé » en conserve la gravité.
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: Qu’avons-nous fait là ?
  rationale: Cette formulation française naturelle préserve l’auto-reproche rhétorique et la mise en relief de l’acte accompli.
- source_word: προέφθακεν ἡμᾶς
  choice: nous a devancés
  rationale: προφθάνω signifie arriver avant quelqu’un ou le prendre de vitesse; « devancer » convient au contexte de rivalité politique.
- source_word: φιλίαν
  choice: l’amitié
  rationale: Le sens lexical direct est « amitié » ou « relations amicales »; le contexte lui donne une portée diplomatique sans qu’il soit nécessaire de traduire explicitement par « alliance ».
- source_word: καταλαβέσθαι
  choice: en gagnant
  rationale: L’infinitif moyen exprime ici l’acquisition de relations favorables; « gagner l’amitié » est idiomatique et respecte cette nuance.
- source_word: τοῖς Ἰουδαίοις
  choice: des Juifs
  rationale: Avec « gagner l’amitié », le datif grec se rend naturellement en français par le complément « des Juifs ».
- source_word: εἰς στήριγμα
  choice: afin d’obtenir leur soutien
  rationale: 'στήριγμα désigne ce qui soutient ou affermit. Dans ce contexte politique, l’expression indique vraisemblablement le but recherché: bénéficier de l’appui des Juifs.'
