  yaml_path: translation/deuterocanon/1_maccabees/010/031.yaml
  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
translation:
  language: fr
  text: Que Jérusalem soit sainte et libre[a], ainsi que son territoire[b], ses dîmes et ses taxes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi signifier « exemptée » ou « libérée »; il peut désigner un statut de liberté ou une remise d’obligations.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses limites » ou « ses frontières ». Le mot grec peut désigner les frontières elles-mêmes ou le territoire qu’elles délimitent.
    reason: lexical_alternative
  - marker: c
    text: Ou « les droits », « les péages » ou « les droits de douane ». La coordination grecque est elliptique; elle peut indiquer que Jérusalem, son territoire et les revenus mentionnés sont exempts de ces prélèvements.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἤτω
  choice: Que … soit
  rationale: L’impératif à la troisième personne exprime ici la valeur injonctive d’un décret royal; « Que … soit » la restitue naturellement en français.
- source_word: ἁγία
  choice: sainte
  rationale: Ce terme conserve la portée religieuse et cultuelle attachée à Jérusalem.
- source_word: ἀφιεμένη
  choice: affranchie
  rationale: Le participe passif de ἀφίημι évoque ce qui est libéré ou exempté. Dans le contexte fiscal du décret, « affranchie » convient mieux au grec attesté que « consacrée », qui correspondrait plus naturellement à ἀφιερωμένη.
- source_word: τὰ ὅρια αὐτῆς
  choice: son territoire
  rationale: ὅρια peut désigner les limites elles-mêmes ou l’étendue qu’elles délimitent. Dans ce contexte administratif, « territoire » est naturel tout en laissant « limites » en note.
- source_word: αἱ δεκάται
  choice: les dîmes
  rationale: Traduction usuelle et précise de δεκάται, qui désigne des prélèvements d’un dixième.
- source_word: τὰ τέλη
  choice: les taxes
  rationale: τέλη est un terme fiscal large pouvant viser taxes, droits ou péages; « taxes » convient au texte principal, les sens plus précis étant signalés en note.
theological_decisions:
- issue: Sens de ἀφιεμένη appliqué à Jérusalem
  choice: affranchie
  alternative: mise à part / consacrée
  rationale: Le grec transmis porte ἀφιεμένη, participe de ἀφίημι, et non ἀφιερωμένη. Le contexte fiscal favorise donc l’idée de libération ou d’exemption. La note conserve toutefois l’autre compréhension possible dans l’histoire de l’interprétation.
- issue: Rapport syntaxique entre l’affranchissement, le territoire, les dîmes et les taxes
  choice: Conserver la coordination elliptique du grec
  alternative: Expliciter que Jérusalem et son territoire sont exempts des dîmes et des taxes
  rationale: La construction grecque coordonne les groupes nominaux d’une manière abrupte et son rapport exact demeure incertain. Le texte principal n’ajoute donc pas une préposition absente, tandis que la note expose la lecture fiscale probable sans l’imposer.
translation_notes:
  register: Français international moderne, sobre et digne. « Affranchie » garde une tonalité juridique adaptée au décret sans être archaïque. La phrase conserve volontairement la coordination abrupte de la source afin de ne pas résoudre silencieusement son ambiguïté syntaxique.
