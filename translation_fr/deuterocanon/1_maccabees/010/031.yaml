  terminology: « Sainte » rend ἁγία. « Libre » rend prudemment ἀφιεμένη dans son sens de libération/remise; « affranchie » est possible mais moins idiomatique ici. « Territoire », « dîmes » et « taxes » sont des équivalents appropriés; les notes conservent les sens alternatifs de ὅρια et τέλη. La note ne doit pas proposer « mise à part » ou « consacrée », qui ne correspond pas au mot grec transmis.
