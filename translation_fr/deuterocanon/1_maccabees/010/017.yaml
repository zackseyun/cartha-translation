lexical_decisions:
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω exprime ici simplement une action narrative achevée; le passé simple convient au registre soutenu d’un récit historique.
- source_word: ἐπιστολὰς
  choice: des lettres
  rationale: L’accusatif pluriel désigne explicitement plusieurs lettres. « Des lettres » est naturel en français moderne et préserve ce pluriel.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste de ἀποστέλλω signifie ici « envoya »; une formulation comme « expédia » serait inutilement marquée.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif pronominal signifie « à lui ». Le pronom français conserve la formulation du grec sans expliciter l’antécédent.
