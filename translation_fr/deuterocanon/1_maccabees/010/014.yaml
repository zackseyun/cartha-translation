  yaml_path: translation/deuterocanon/1_maccabees/010/014.yaml
  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: fr
  text: Mais à Bethsoura, quelques-uns de ceux qui avaient abandonné la Loi et les commandements furent laissés sur place, car elle leur servait de refuge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque naturellement en français le contraste ou l’exception introduite par le grec.
- source_word: Βεθσούροις
  choice: à Bethsoura
  rationale: Translittération française usuelle du nom de lieu, avec la préposition locative exigée par le contexte.
- source_word: ὑπελείφθησάν
  choice: furent laissés sur place
  rationale: Conserve la forme passive et l’idée qu’un petit groupe resta derrière, sans transformer le verbe en simple état.
- source_word: τῶν καταλειπόντων
  choice: de ceux qui avaient abandonné
  rationale: Rend le participe aoriste comme une action antérieure et volontaire, distincte du verbe passif principal.
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: la Loi et les commandements
  rationale: Préserve les deux termes grecs et leur portée religieuse, avec la majuscule à « Loi » pour la Torah.
- source_word: φυγαδευτήριον
  choice: refuge
  rationale: Exprime un lieu où l’on se met à l’abri ou d’où l’on peut échapper au danger.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Cette ville » explicite le référent implicite de « leur » sans ajouter d’interprétation doctrinale; la tournure conserve le contraste, le passif et la distinction entre la Loi et les commandements.
