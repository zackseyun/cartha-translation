  text: And those in the city[a], being afraid, opened the gates, and Jonathan took control of Joppa.
translation:
  language: fr
  text: Pris de peur, les habitants de la ville ouvrirent les portes[a], et Jonathan prit le contrôle de Joppé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ouvrirent »; le grec ne précise pas qu’il s’agit des portes, mais le contexte le laisse vraisemblablement entendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθέντες
  choice: Pris de peur
  rationale: Le participe aoriste exprime ici la circonstance qui pousse les habitants à ouvrir; cette formulation est naturelle sans préciser davantage l’intensité de leur peur.
- source_word: ἤνοιξαν
  choice: ouvrirent les portes
  rationale: Le grec dit simplement « ouvrirent », sans complément exprimé. Dans le contexte d’une ville livrée à une force extérieure, les portes sont très probablement sous-entendues; une note conserve toutefois l’ellipse grecque.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les habitants de la ville
  rationale: Littéralement « ceux de la ville »; « les habitants de la ville » transmet naturellement la référence collective sans introduire une restriction de genre.
- source_word: ἐκυρίευσεν
  choice: prit le contrôle de
  rationale: κυριεύω indique l’acquisition de la maîtrise ou de l’autorité sur un lieu; cette traduction convient au contexte militaire sans réduire nécessairement le sens à une prise d’assaut.
- source_word: Ἰόππης
  choice: Joppé
  rationale: Forme française traditionnelle et courante du nom de lieu grec Ἰόππη.
