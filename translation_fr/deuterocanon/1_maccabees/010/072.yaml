revisions:
- from: 'Demande et apprends qui je suis, et qui sont les autres qui nous prêtent main-forte. Ils disent : « Vous ne pouvez pas tenir devant nous[a], car tes pères ont été mis en déroute deux fois dans leur propre pays. »'
  to: 'Demande et apprends qui je suis et qui sont les autres qui nous prêtent main-forte. Ils disent : « Vous n’avez pas où poser le pied devant nous[a], car tes pères ont été mis en déroute deux fois dans leur propre pays. »'
  rationale: La révision conserve le sens militaire de la réplique tout en rétablissant dans le texte français l’image du pied présente dans στάσις ποδός. Elle maintient l’ambiguïté syntaxique et l’alternance des personnes du grec, sans introduire d’interprétation doctrinale ou historique supplémentaire.
