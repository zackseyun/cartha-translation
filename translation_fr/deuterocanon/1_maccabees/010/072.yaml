review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les impératifs, « les autres qui nous prêtent main-forte », le présent narratif « Ils disent », la déroute militaire et l’alternance grecque singulier/pluriel (« Demande… tes pères » / « Vous »). Toutefois, « Vous ne pouvez pas tenir devant nous » explicite le résultat de l’idiome sans conserver suffisamment son affirmation centrale : l’absence de στάσις ποδός, c’est-à-dire de place/appui où poser le pied. Une formulation française qui maintient cette image est préférable.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Vous n’avez pas où poser le pied devant nous » est idiomatique dans un défi martial et reflète plus concrètement l’image grecque, sans alourdir le texte.
  terminology: « Prêter main-forte », « mis en déroute » et « pères » sont des choix justes. « Pays » pour γῆ est acceptable dans ce contexte; « leur propre pays » restitue bien αὐτῶν. La note doit présenter l’idiome avec une littéralité française plus exacte et éviter de réduire son sens à une seule paraphrase.
  issues:
  - severity: medium
    issue: L’idiome στάσις ποδὸς est trop atténué dans le texte courant.
    rationale: « Ne pouvez pas tenir » communique l’idée de défaite, mais omet l’image explicite d’un emplacement ou appui pour le pied. « N’avez pas où poser le pied » préserve l’image et le sens d’absence de position tenable.
  - severity: low
    issue: La formulation littérale de la note est maladroite.
    rationale: « Position du pied » ne rend pas naturellement στάσις ποδός en français. « Un endroit où poser le pied » est à la fois plus intelligible et plus proche de la construction idiomatique.
