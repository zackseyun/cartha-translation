  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
translation:
  language: fr
  text: 'Demande et apprends qui je suis et qui sont les autres qui nous prêtent main-forte. Ils disent : « Vous n’avez pas où poser le pied devant nous[a], car tes pères ont été mis en déroute deux fois dans leur propre pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il n’y a pas pour vous d’endroit où poser le pied devant notre face. » L’expression signifie qu’ils ne peuvent pas tenir leur position face à leurs adversaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: Demande et apprends
  rationale: Les deux impératifs singuliers sont conservés, ainsi que la progression entre la demande d’information et la connaissance acquise.
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: les autres qui nous prêtent main-forte
  rationale: « Les autres » rend οἱ λοιποί, tandis que « prêter main-forte » exprime naturellement l’aide active dans ce contexte militaire sans préciser indûment sa forme.
- source_word: λέγουσιν
  choice: Ils disent
  rationale: Le présent et le sujet pluriel indéfini du grec sont maintenus, malgré la transition abrupte vers les personnes que l’interlocuteur doit consulter.
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: Vous ne pouvez pas tenir devant nous
  rationale: Cette formulation française exprime l’impossibilité de tenir sa position face à l’adversaire. L’image littérale du pied est signalée en note.
- source_word: ἐτροπώθησαν
  choice: ont été mis en déroute
  rationale: Le passif et la forte valeur militaire du verbe sont conservés.
- source_word: οἱ πατέρες σου
  choice: tes pères
  rationale: La traduction formelle préserve l’évocation rhétorique des pères plutôt que de généraliser en « ancêtres ».
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: dans leur propre pays
  rationale: « Leur propre pays » restitue la valeur possessive et renforce la portée provocatrice de la défaite subie sur leur territoire.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le passage du singulier (« Demande », « apprends », « tes pères ») au pluriel (« Vous ») est conservé comme dans le grec. La ponctuation en deux phrases clarifie le changement de locuteur implicite sans modifier le présent de λέγουσιν.
