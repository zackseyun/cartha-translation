  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
translation:
  language: fr
  text: Ceux de la citadelle[a] livrèrent les otages à Jonathan et les rendirent à leurs parents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἄκρα désigne la citadelle fortifiée de Jérusalem, traditionnellement appelée l’Acra.
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: livrèrent
  rationale: Le verbe signifie remettre ou livrer. « Livrèrent » exprime naturellement le transfert des otages à Jonathan sans ajouter de précision absente du grec.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: Ceux de la Citadelle
  rationale: La tournure conserve la construction grecque et désigne les occupants ou représentants de la forteresse connue dans ce contexte comme l’Acra de Jérusalem. La majuscule signale ce lieu précis.
- source_word: Ἰωναθὰν
  choice: Jonathan
  rationale: Forme française courante du nom biblique.
- source_word: τὰ ὅμηρα
  choice: les otages
  rationale: Le mot désigne ici des personnes retenues comme garanties, ce que confirme leur restitution à leurs parents dans la proposition suivante.
- source_word: ἀπέδωκαν
  choice: rendit
  rationale: Le verbe exprime l’action de rendre ce qui avait été retenu. Le singulier français reprend naturellement Jonathan comme sujet implicite, conformément au contexte immédiat et à l’accord du sens.
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: à leurs parents
  rationale: γονεῖς désigne les parents; cette traduction est exacte, naturelle et moins large que « familles ».
