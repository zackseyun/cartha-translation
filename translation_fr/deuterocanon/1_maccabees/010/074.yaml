base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: fr
  text: Mais lorsque Jonathan entendit les paroles d’Apollonius, son esprit s’agita[a]. Il choisit dix mille hommes et sortit de Jérusalem. Son frère Simon vint à sa rencontre pour aider Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fut intérieurement remué » ou « il fut agité dans son esprit ». Le grec décrit une agitation ou une mise en mouvement intérieure sans préciser l’émotion ressentie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Mais lorsque … entendit
  rationale: ὡς avec l’aoriste marque ici le moment, tandis que δέ assure une transition narrative légère; « Mais lorsque » rend les deux éléments naturellement.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: les paroles d’Apollonius
  rationale: λόγοι désigne les propos prononcés par Apollonius; « paroles » reste proche du grec sans les réduire à un simple message.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: il fut intérieurement bouleversé
  rationale: Le passif de κινέω associé à διάνοια décrit un mouvement ou une agitation intérieure sans en préciser exactement l’émotion. « Bouleversé » reste assez ouvert, et « intérieurement » représente la dimension mentale.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: Il choisit dix mille hommes
  rationale: « Choisit » rend directement ἐπέλεξεν, et « hommes » conserve le terme général ἀνδρῶν sans expliciter « soldats ».
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: sortit de Jérusalem
  rationale: Traduction directe et idiomatique du verbe de mouvement, sans ajouter l’idée explicite d’une marche militaire.
- source_word: συνήντησεν αὐτῷ
  choice: vint à sa rencontre
  rationale: Cette formulation exprime clairement le mouvement de Simon vers Jonathan impliqué par le contexte et demeure dans le champ de συναντάω.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: pour lui prêter main-forte
  rationale: La locution exprime naturellement en français le but de la rencontre dans ce contexte militaire, tout en restant plus précis que le très général « aider ».
