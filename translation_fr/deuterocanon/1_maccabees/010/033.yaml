  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: fr
  text: Toute personne juive qui a été emmenée captive du pays de Juda dans quelque partie que ce soit de mon royaume, je lui rends gratuitement sa liberté ; que tous renoncent aussi aux impôts qui pèsent sur elle et sur son bétail[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est condensé et peut aussi se comprendre : « que tous remettent les impôts, ainsi que ceux qui frappent leur bétail ». L’expression peut désigner spécifiquement les taxes imposées sur le bétail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: Toute personne juive
  rationale: Dans ce contexte administratif, ψυχή désigne une personne plutôt que l’âme intérieure. « Toute personne juive » rend naturellement la valeur distributive de πᾶσαν.
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: qui a été emmenée captive
  rationale: Le participe désigne une personne faite prisonnière et gardant le statut résultant de sa capture.
- source_word: ἀπὸ γῆς Ἰούδα
  choice: du pays de Juda
  rationale: Cette formulation rend directement γῆ, « pays, terre », et conserve le nom Juda plutôt que de l’interpréter comme « Judée ».
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: dans quelque partie que ce soit de mon royaume
  rationale: L’expression indique une dispersion en n’importe quel lieu du territoire royal ; cette tournure française en exprime clairement la portée distributive.
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: je lui rends gratuitement sa liberté
  rationale: ἀφίημι avec ἐλευθέραν exprime l’affranchissement, tandis que δωρεάν précise qu’aucun paiement ni rançon n’est exigé.
- source_word: πάντες ἀφιέτωσαν
  choice: que tous renoncent aussi
  rationale: Dans ce décret fiscal, l’impératif demande à tous ceux qui perçoivent ou imposent ces sommes d’y renoncer. Le sujet reste général, comme dans le grec.
- source_word: τοὺς φόρους
  choice: aux impôts
  rationale: φόροι désigne des taxes ou tributs ; « impôts » est ici l’équivalent administratif moderne le plus clair.
- source_word: κτηνῶν αὐτῶν
  choice: sur elle et sur son bétail
  rationale: κτῆνος désigne le bétail ou les animaux de propriété. Le français explicite le rattachement fiscal tout en signalant en note la syntaxe grecque condensée et ambiguë.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et clair. La construction détachée « Toute personne… je lui rends » conserve l’accent distributif du décret grec. « Rendre sa liberté » exprime naturellement l’affranchissement sans introduire de précision confessionnelle.
