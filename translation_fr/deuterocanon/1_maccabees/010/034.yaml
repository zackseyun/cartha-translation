review_pass:
  verdict: revise
  source_fidelity: Le décret et la liste calendérique sont fidèlement rendus. Toutefois, « établis » ajoute l’idée d’une résidence stable que le participe grec τοῖς οὖσιν (« qui se trouvent / qui sont ») n’exprime pas nécessairement.
  naturalness: La phrase est naturelle et conserve le ton prescriptif d’un décret. « Qui se trouvent dans l’ensemble de mon royaume » est à la fois idiomatique et plus exactement inclusif que « établis dans tout mon royaume ».
  terminology: « Fêtes », « sabbats », « nouvelles lunes », « jours fixés » et « exemption fiscale » conviennent. « Remise » maintient utilement la portée administrative non spécifiée de ἀφέσεως; la note explicite cette ambiguïté sans théologiser le terme.
  issues:
