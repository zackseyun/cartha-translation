base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: fr
  text: Que toutes les fêtes, les sabbats, les nouvelles lunes et les jours fixés, ainsi que les trois jours précédant une fête et les trois jours qui la suivent, soient tous des jours d’exemption fiscale et de remise[a] pour tous les Juifs qui se trouvent dans l’ensemble de mon royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dispense », « libération » ou « pardon ». Le terme grec peut désigner la levée d’obligations ; ici, il s’agit probablement d’un allègement administratif accordé pour ces jours.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἑορταὶ
  choice: fêtes
  rationale: Le terme désigne des célébrations ou jours de fête. « Fêtes » est naturel en français moderne et convient à cette liste d’observances religieuses.
- source_word: σάββατα
  choice: sabbats
  rationale: Le pluriel grec est conservé et la référence au calendrier juif reste explicite.
- source_word: νουμηνίαι
  choice: nouvelles lunes
  rationale: Le terme désigne les observances liées au début du mois lunaire ; « nouvelles lunes » est la formulation française habituelle et concise.
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: jours fixés
  rationale: Le participe indique des jours officiellement désignés ou établis. « Jours fixés » est clair et garde cette valeur sans préciser abusivement leur nature.
- source_word: ἔστωσαν
  choice: que ... soient
  rationale: Cette tournure rend la force prescriptive de l’impératif dans un décret royal tout en restant naturelle en français.
- source_word: ἀτελείας
  choice: exemption fiscale
  rationale: Dans ce contexte administratif, ἀτέλεια désigne l’exemption de taxes, tributs ou redevances. « Exemption fiscale » est précis et accessible.
- source_word: ἀφέσεως
  choice: remise
  rationale: Associé à ἀτέλεια dans un décret administratif, le mot évoque vraisemblablement une remise ou dispense d’obligations. « Remise » préserve une part de l’étendue sémantique du grec sans lui donner ici un sens exclusivement théologique.
- source_word: πᾶσι τοῖς Ἰουδαίοις
  choice: pour tous les Juifs
  rationale: Le datif indique les bénéficiaires des privilèges accordés par le décret.
- source_word: τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: établis dans tout mon royaume
  rationale: La formulation exprime naturellement que la mesure s’applique aux Juifs présents partout dans le royaume.
theological_decisions:
- issue: Sens de ἀφέσεως dans un contexte royal et administratif
  choice: remise
  alternative: dispense ; libération ; pardon
  rationale: Le passage porte sur des privilèges civils accordés lors de jours déterminés, et non directement sur le pardon des péchés. « Remise » convient donc au contexte administratif, tandis qu’une note conserve les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et lisible. La structure ample du décret est conservée, mais les enchaînements sont légèrement lissés pour une lecture naturelle. Le vocabulaire administratif évite de donner à ἀφέσεως un sens théologique que le contexte n’impose pas.
