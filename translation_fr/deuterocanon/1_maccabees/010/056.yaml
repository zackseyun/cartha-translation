  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: fr
  text: Et maintenant, je ferai pour toi ce que tu as écrit. Mais viens à ma rencontre à Ptolémaïs, afin que nous nous voyions l’un l’autre, et je m’allierai à toi par mariage[a], comme tu l’as dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je deviendrai ton parent par mariage ». Le verbe grec désigne l’établissement d’un lien de parenté par mariage; le contexte montre qu’il s’agit d’une alliance dynastique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω
  choice: je ferai
  rationale: Rend directement l’action générale de donner suite au contenu de la lettre, sans préciser davantage que le grec.
- source_word: ἃ ἔγραψας
  choice: ce que tu as écrit
  rationale: Formulation française naturelle qui renvoie fidèlement au contenu de la lettre.
- source_word: ἀπάντησον εἰς Πτολεμαΐδα
  choice: viens à ma rencontre à Ptolémaïs
  rationale: Le verbe appelle à une rencontre et εἰς exprime un mouvement vers Ptolémaïs; cette tournure conserve les deux nuances dans un français naturel.
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: afin que nous nous voyions l’un l’autre
  rationale: Conserve le verbe grec « voir » et la réciprocité explicite, plutôt que de réduire la proposition à une simple rencontre.
- source_word: ἐπιγαμβρεύσω
  choice: je m’allierai à toi par mariage
  rationale: Le verbe désigne l’établissement d’un lien de parenté par mariage. Cette formulation exprime l’alliance matrimoniale sans ajouter dans le corps du verset l’identité du conjoint.
- source_word: καθὼς εἴρηκας
  choice: comme tu l’as dit
  rationale: Rend simplement et naturellement le renvoi à la proposition antérieure.
