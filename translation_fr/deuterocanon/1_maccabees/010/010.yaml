lexical_decisions:
- source_word: ᾤκησεν
  choice: s’établit
  rationale: Le verbe οἰκέω indique ici que Jonathan résida ou prit demeure à Jérusalem; «s’établit» est naturel en français et convient au contexte narratif.
- source_word: οἰκοδομεῖν
  choice: bâtir
  rationale: Rend directement l’idée de construire, sans préciser ce que le grec laisse indéterminé.
- source_word: καινίζειν
  choice: rénover
  rationale: Exprime l’action de remettre la ville à neuf; ce choix conserve la distinction avec «bâtir» et évite d’ajouter l’idée plus précise de restauration à un état antérieur.
