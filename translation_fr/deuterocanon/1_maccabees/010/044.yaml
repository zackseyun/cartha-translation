  yaml_path: translation/deuterocanon/1_maccabees/010/044.yaml
  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
translation:
  language: fr
  text: Pour la reconstruction et la rénovation des ouvrages du sanctuaire[a], la dépense sera couverte sur le compte du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des choses saintes » ou « des lieux saints »; l’expression désigne ici le sanctuaire, c’est-à-dire l’ensemble sacré du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur l’ordre du roi ». Le grec peut renvoyer soit au compte administratif du roi, soit à sa parole faisant autorité; le contexte financier favorise ici « compte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  choice: la reconstruction
  rationale: L’infinitif substantivé désigne ici le projet de construction; dans le contexte de la restauration du Temple, « reconstruction » est plus précis que le simple « édification ».
- source_word: ἐπικαινισθῆναι
  choice: la rénovation
  rationale: Le verbe exprime l’action de renouveler ou de remettre à neuf. Associé à la reconstruction, il vise vraisemblablement la restauration matérielle plutôt qu’une nouvelle dédicace cultuelle.
- source_word: τὰ ἔργα
  choice: les ouvrages
  rationale: Le pluriel désigne les réalisations ou structures faisant l’objet des travaux. « Ouvrages » conserve cette ampleur tout en étant naturel dans un contexte de construction.
- source_word: τῶν ἁγίων
  choice: du sanctuaire
  rationale: Le pluriel substantivé peut désigner les choses ou lieux saints; dans ce contexte lié au Temple, « sanctuaire » communique naturellement la référence à l’ensemble sacré sans la réduire à des objets.
- source_word: ἡ δαπάνη
  choice: la dépense
  rationale: Le singulier collectif désigne le coût financier du projet; le français conserve directement ce singulier.
- source_word: δοθήσεται
  choice: sera couverte
  rationale: Le futur passif signifie littéralement « sera donnée/fournie ». En français financier, « la dépense sera couverte » exprime naturellement la mise à disposition des fonds.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: sur le compte du roi
  rationale: Dans un emploi administratif, λόγος peut désigner un compte ou un registre financier. La préposition ἐκ indique alors la source des fonds. Une note conserve l’autre lecture possible, « sur l’ordre du roi ».
