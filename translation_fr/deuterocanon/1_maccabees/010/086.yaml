base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: fr
  text: Jonathan partit de là et établit son camp à Ascalon. Les habitants de la ville sortirent à sa rencontre avec un grand apparat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande splendeur » ou « avec une grande gloire ». L’expression grecque souligne le caractère magnifique de la réception réservée à Jonathan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partit
  rationale: L’aoriste de ἀπαίρω indique que Jonathan quitte le lieu précédent. « Partit de là » est naturel et fidèle au mouvement exprimé.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Dans ce contexte militaire, le verbe désigne l’installation d’un camp. Cette formulation conserve la nuance sans raideur.
- source_word: Ἀσκάλωνα
  choice: Ascalon
  rationale: « Ascalon » est la forme française traditionnelle et courante du nom de cette ville antique.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les habitants de la ville
  rationale: L’expression désigne collectivement les personnes venues de la ville, sans préciser qu’il s’agit uniquement d’hommes.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: Cette tournure rend directement l’expression grecque indiquant qu’ils sortent pour aller au-devant de Jonathan.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: l’accueillirent avec de grands honneurs
  rationale: δόξα peut évoquer l’honneur, la gloire ou la splendeur. Ici, le contexte décrit une réception publique honorifique; l’ajout explicite de « l’accueillirent » rend naturellement en français la valeur circonstancielle de l’expression.
