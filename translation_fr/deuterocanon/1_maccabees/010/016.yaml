  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: fr
  text: 'Et il dit : « Trouverons-nous un seul homme pareil à lui ?[a] Et maintenant, faisons de lui notre ami[b] et notre allié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La question grecque appelle une réponse négative : « Nous ne trouverons certainement pas un homme pareil à lui, n’est-ce pas ? »'
    reason: lexical_alternative
  - marker: b
    text: Dans le langage des cours hellénistiques, « ami » pouvait aussi désigner un statut politique officiel, et non seulement une relation d’affection personnelle.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: Trouverons-nous
  rationale: Le futur de l’indicatif introduit par μή forme ici une question rhétorique qui attend une réponse négative. La formulation interrogative française préserve cette force sans expliciter dans le corps du texte la réponse sous-entendue.
- source_word: ἄνδρα
  choice: un homme
  rationale: Le grec est explicitement masculin singulier et désigne ici un individu précis de sexe masculin.
- source_word: τοιοῦτον
  choice: pareil à lui
  rationale: L’expression désigne un homme de cette qualité ou de ce genre. « Pareil à lui » est naturel en français moderne et conserve la valeur comparative.
- source_word: ἕνα
  choice: un seul
  rationale: Le numéral souligne qu’il serait difficile d’en trouver ne serait-ce qu’un autre semblable.
- source_word: ποιήσωμεν αὐτόν
  choice: faisons de lui
  rationale: Cette tournure rend naturellement en français le sens factitif de ποιέω avec un attribut, sans préciser davantage le mécanisme politique de la désignation.
- source_word: φίλον
  choice: ami
  rationale: « Ami » conserve le sens propre du terme et le distingue de σύμμαχον, tout en laissant ouverte sa possible valeur de titre politique à la cour hellénistique.
- source_word: σύμμαχον
  choice: allié
  rationale: Le mot désigne une personne unie par une alliance, notamment politique ou militaire ; « allié » en est l’équivalent français moderne le plus clair.
- source_word: ἡμῶν
  choice: notre
  rationale: Le possessif français rend directement le génitif grec et s’accorde séparément avec chacun des deux attributs.
