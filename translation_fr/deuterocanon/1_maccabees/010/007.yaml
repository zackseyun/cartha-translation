  yaml_path: translation/deuterocanon/1_maccabees/010/007.yaml
  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: fr
  text: Jonathan vint à Jérusalem et lut les lettres devant tout le peuple et ceux de la Citadelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « ceux de l’Acra », la forteresse de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: vint
  rationale: L’aoriste de ἔρχομαι décrit simplement l’arrivée de Jonathan dans le fil du récit; « vint » conserve le point de vue narratif sans ajouter la nuance plus explicite de « arriva ».
- source_word: ἀνέγνω
  choice: lut
  rationale: ἀναγινώσκω signifie « lire »; le complément εἰς τὰ ὦτα indique déjà qu’il s’agit d’une lecture audible et publique.
- source_word: τὰς ἐπιστολάς
  choice: les lettres
  rationale: ἐπιστολή désigne normalement une lettre ou une communication écrite; le pluriel défini est rendu directement.
- source_word: εἰς τὰ ὦτα
  choice: devant
  rationale: L’expression idiomatique signifie que les lettres furent lues de manière à être entendues par l’assemblée. « Devant » restitue naturellement en français le cadre d’une lecture publique sans calquer « dans les oreilles ».
- source_word: παντὸς τοῦ λαοῦ
  choice: tout le peuple
  rationale: Cette formulation naturelle conserve la totalité exprimée par παντός et la valeur collective de λαός.
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: ceux de la Citadelle
  rationale: La préposition ἐκ marque leur rattachement ou provenance; dans ce contexte, ἄκρα désigne la forteresse de Jérusalem connue comme l’Acra. « Ceux de la Citadelle » préserve ce rapport sans imposer qu’ils se trouvaient alors à l’intérieur.
