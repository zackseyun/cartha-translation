translation_notes:
  register: Français moderne, sobre et narratif. « La Citadelle » est employé comme désignation contextuelle de la forteresse; la note conserve le nom historique « Acra ». Le tour « lut les lettres devant » exprime clairement une lecture publique et reste accessible.
