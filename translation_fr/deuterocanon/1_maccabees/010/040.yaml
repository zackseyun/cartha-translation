base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/040.yaml
  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: fr
  text: Moi aussi, je donne, chaque année, quinze mille sicles d’argent, du compte du roi, des lieux qui lui appartiennent[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des revenus du roi » ou « du trésor royal ». Le grec emploie λόγος, qui peut désigner un compte, un calcul ou un relevé.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression peut désigner les districts ou les localités d’où proviennent les fonds ; littéralement : « des lieux qui appartiennent [à lui] ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi, je donne aussi
  rationale: La crase καί + ἐγώ exprime à la fois la continuité et l’insistance sur le locuteur. La formulation française conserve ces deux nuances sans lourdeur excessive.
- source_word: δίδωμι
  choice: je donne
  rationale: Le sens premier est « donner ». Dans ce contexte administratif royal, « accorder » serait possible, mais « donner » reste direct et ne précise pas indûment la nature juridique du transfert.
- source_word: κατʼ ἐνιαυτόν
  choice: chaque année
  rationale: Cette expression indique une attribution annuelle récurrente. « Chaque année » est idiomatique et clair en français moderne.
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  choice: quinze mille sicles d’argent
  rationale: « Sicle » conserve l’unité antique de poids ou de monnaie, tandis que « d’argent » rend explicitement ἀργυρίου.
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  choice: provenant des revenus du roi
  rationale: Dans ce contexte financier, λόγος peut désigner un compte, un calcul ou une rubrique de recettes. « Revenus du roi » donne un français naturel et contextuellement plausible, tout en signalant en note l’ambiguïté du grec.
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  choice: prélevés sur les territoires qui lui appartiennent
  rationale: τόποι désigne probablement les lieux, districts ou territoires d’où proviennent les fonds. Le référent implicite de « qui appartiennent » est rendu par « lui », d’après le contexte royal; « prélevés sur » explicite naturellement la provenance sans changer le sens fiscal.
