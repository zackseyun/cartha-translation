  yaml_path: translation/deuterocanon/1_maccabees/010/055.yaml
  text: And King Ptolemy answered, saying, “A good day is this, on which you returned to the land of your fathers and sat on the throne of their kingdom.”
translation:
  language: fr
  text: 'Le roi Ptolémée répondit : « Heureux le jour où tu es retourné au pays de tes pères et où tu as pris place sur le trône de leur royaume ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθὴ ἡμέρα
  choice: Heureux le jour
  rationale: Cette tournure exclamative naturelle restitue l’évaluation positive du jour sans alourdir le français par un calque comme « Bon jour que celui-ci ».
- source_word: ἀνέστρεψας
  choice: tu es retourné
  rationale: Le verbe exprime ici le retour dans le pays ancestral.
- source_word: γῆν πατέρων σου
  choice: pays de tes pères
  rationale: « Pères » conserve la référence ancestrale et le registre biblique du grec.
- source_word: ἐκάθισας ἐπὶ θρόνου
  choice: tu as pris place sur le trône
  rationale: Cette formulation française naturelle préserve l’image concrète de l’accession au trône.
- source_word: βασιλείας αὐτῶν
  choice: de leur royaume
  rationale: Le possessif pluriel renvoie littéralement aux « pères »; cette formulation préserve ce rattachement sans le réinterpréter.
