  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: fr
  text: Ptolémée quitta l’Égypte avec sa fille Cléopâtre et arriva à Ptolémaïs en l’an cent soixante-deux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’an 162 de l’ère séleucide.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: quitta
  rationale: Dans ce récit de voyage, l’aoriste de ἐξέρχομαι indique le départ hors d’Égypte. « Quitta » exprime naturellement ce mouvement en français.
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: avec sa fille Cléopâtre
  rationale: La coordination grecque présente Ptolémée et sa fille comme voyageurs. En français courant, « avec sa fille Cléopâtre » restitue clairement leur déplacement commun sans alourdir la phrase par un littéral « lui et ».
- source_word: ἦλθεν
  choice: arriva
  rationale: Dans ce contexte d’itinéraire, ἦλθεν suivi de la destination marque l’arrivée à Ptolémaïs ; « arriva » est plus idiomatique que « vint » tout en conservant le sens.
- source_word: εἰς Πτολεμαΐδα
  choice: à Ptolémaïs
  rationale: Avec un nom de ville comme destination, εἰς se rend naturellement par « à » en français.
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: en l’an cent soixante-deux
  rationale: La formule grecque donne, de façon additive, la cent-soixante-deuxième année. « En l’an cent soixante-deux » est une datation historique naturelle et précise en français.
