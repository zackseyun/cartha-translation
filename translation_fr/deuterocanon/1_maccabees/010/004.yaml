base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: fr
  text: 'Car il disait : « Prenons les devants en faisant la paix avec lui, avant qu’il ne se range aux côtés d’Alexandre contre nous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avant qu’il ne se place avec Alexandre contre nous » ; cette expression grecque désigne ici un ralliement politique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: Prenons les devants
  rationale: L’aoriste subjonctif à valeur exhortative appelle à agir avant l’autre partie. Cette tournure française naturelle conserve la nuance stratégique de προφθάνω.
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  choice: en faisant la paix avec lui
  rationale: L’infinitif substantivé indique l’action dans laquelle il faut devancer l’autre camp; « faire la paix avec lui » exprime clairement le sens diplomatique de εἰρηνεύω.
- source_word: πρὶν ἢ
  choice: avant que
  rationale: La locution introduit l’action redoutée qui pourrait se produire en premier.
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: qu’il ne se range aux côtés d’Alexandre
  rationale: Le grec dit littéralement « le placer avec Alexandre ». Dans ce contexte politique, « se ranger aux côtés de » rend l’idée d’alignement sans imposer la notion plus formelle d’un traité d’alliance.
- source_word: καθʼ ἡμῶν
  choice: contre nous
  rationale: κατά avec le génitif marque ici l’hostilité envers le camp du locuteur.
