base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/015.yaml
  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: fr
  text: Le roi Alexandre apprit les promesses que Démétrios avait envoyées à Jonathan, et on lui raconta les guerres, les actes de bravoure que Jonathan et ses frères avaient accomplis, et les peines qu’ils avaient endurées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: promesses
  rationale: Le terme désigne ici les engagements ou assurances politiques transmis par Démétrios à Jonathan; « promesses » en conserve clairement la portée sans leur donner un caractère juridique excessif.
- source_word: ἀπέστειλεν
  choice: avait fait parvenir
  rationale: Dans ce contexte, le verbe indique que Démétrios avait envoyé à Jonathan le contenu de ses promesses; cette formulation française évite de suggérer qu’il aurait envoyé les promesses comme des objets matériels.
- source_word: διηγήσαντο
  choice: On lui raconta
  rationale: Le verbe signifie exposer ou raconter les faits. Le pronom indéfini « on » préserve naturellement en français l’identité non précisée du sujet pluriel grec.
- source_word: τοὺς πολέμους
  choice: les guerres menées
  rationale: « Guerres » rend directement le pluriel grec, tandis que « menées » explicite naturellement leur relation avec Jonathan et ses frères sans les réduire à de simples batailles.
- source_word: τὰς ἀνδραγαθίας
  choice: leurs actes de bravoure
  rationale: L’expression rend la valeur élogieuse du terme, qui désigne des actions courageuses, dans un registre digne et courant.
- source_word: τοὺς κόπους οὓς ἔσχοσαν
  choice: les épreuves qu’ils avaient endurées
  rationale: Dans le contexte militaire, κόπους évoque les peines, fatigues et difficultés subies; « épreuves » avec « endurées » en restitue la portée plus largement que « travaux ».
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Il s’agit des frères de Jonathan dans la famille maccabéenne, et non de parents ou de compatriotes au sens large.
