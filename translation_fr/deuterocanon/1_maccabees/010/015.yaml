translation_notes:
  register: Français international moderne, narratif et digne. La longue coordination grecque est répartie en deux phrases pour assurer une lecture naturelle, sans supprimer aucun élément. La répétition des pronoms grecs est clarifiée par le nom « Jonathan », puisque le premier αὐτός renvoie à Jonathan et non au roi Alexandre.
