base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: fr
  text: Des hommes nuisibles venus d’Israël, des hommes sans loi, se rassemblèrent contre lui[a] pour porter plainte contre lui[b] ; mais le roi ne leur prêta aucune attention.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est une insulte exceptionnellement forte : elle peut aussi se traduire par « des hommes malfaisants » ou, plus littéralement, « des hommes pareils à un fléau ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour présenter une requête contre lui » ou « pour l’accuser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: se rassemblèrent
  rationale: 'Le passif grec a ici un sens intransitif naturel : ces hommes se réunissent en groupe dans une intention hostile.'
- source_word: ἐπʼ αὐτόν
  choice: contre lui
  rationale: Le contexte hostile et judiciaire donne à la préposition une valeur adversative plutôt que simplement directionnelle.
- source_word: ἄνδρες λοιμοί
  choice: des hommes nuisibles
  rationale: λοιμός évoque littéralement un fléau ou une peste et, appliqué à des personnes, constitue une insulte particulièrement forte. « Nuisibles » reste naturel en français moderne tout en conservant l’idée de personnes qui font du tort ; une note signale la métaphore plus vive du grec.
- source_word: ἐξ Ἰσραήλ
  choice: venus d’Israël
  rationale: Cette formulation exprime clairement leur origine ou leur appartenance au peuple d’Israël.
- source_word: ἄνδρες παράνομοι
  choice: des hommes sans loi
  rationale: παράνομος désigne ce qui va à l’encontre de la loi. « Sans loi » conserve la force rhétorique et la portée juridique ou morale du terme sans préciser de quelle loi il s’agit.
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: pour porter plainte contre lui
  rationale: Dans un cadre administratif ou judiciaire, ἐντυγχάνω avec κατά peut désigner une démarche ou une requête dirigée contre quelqu’un. « Porter plainte » restitue clairement cette démarche sans affirmer qu’une accusation formelle a nécessairement abouti.
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: ne leur prêta aucune attention
  rationale: προσέχω signifie ici écouter, prendre en considération ou donner suite. Cette tournure française moderne rend le refus du roi d’accorder du poids à leur démarche.
- source_word: ὁ βασιλεύς
  choice: le roi
  rationale: Traduction directe et usuelle du titre dans ce contexte narratif.
