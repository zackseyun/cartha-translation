translation_notes:
  register: Français international moderne, narratif et digne. La répétition « des hommes… des hommes… » est conservée parce qu’elle reproduit l’apposition emphatique du grec. Le point-virgule marque nettement le contraste introduit par καί dans la dernière proposition.
