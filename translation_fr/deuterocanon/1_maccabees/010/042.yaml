  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: fr
  text: En plus de cela, les cinq mille sicles d’argent qu’on prélevait sur les revenus, comme les années antérieures, d’après le compte annuel du sanctuaire[a], sont eux aussi remis, car ils reviennent aux prêtres qui assurent le service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « d’après le compte du sanctuaire, chaque année » ou « d’après le calcul annuel du sanctuaire ». L’expression grecque construite avec λόγος est administrative et condensée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: les cinq mille sicles d’argent
  rationale: Conserve l’unité monétaire ancienne et emploie la tournure française biblique usuelle.
- source_word: ἐλάμβανον
  choice: que l’on prélevait
  rationale: L’imparfait grec exprime une pratique habituelle; le sujet indéfini est naturellement rendu par « l’on » dans ce contexte fiscal.
- source_word: ἀπὸ τῶν χρειῶν
  choice: sur les revenus
  rationale: Dans ce contexte administratif, χρεῖαι désigne vraisemblablement des recettes ou revenus; « prélever sur » est idiomatique en français.
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: comme les années précédentes
  rationale: Rend la comparaison avec la pratique des années antérieures sans suggérer nécessairement les toutes premières années d’une période.
- source_word: τοῦ ἁγίου
  choice: du sanctuaire
  rationale: Le terme désigne ici le sanctuaire dans son cadre financier et cultuel, sans préciser indûment une partie du Temple.
- source_word: ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: chaque année … d’après le compte
  rationale: λόγος possède ici un sens administratif de compte ou de calcul. La syntaxe grecque est comprimée et permet plusieurs rattachements, signalés en note.
- source_word: ἀφίεται
  choice: sont eux aussi remis
  rationale: Dans un contexte fiscal, le verbe indique la remise ou l’annulation d’un prélèvement; « remis » garde le ton administratif.
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: car ils reviennent
  rationale: Exprime que ces fonds sont dus ou attribués de plein droit aux prêtres, plus naturellement que le simple « appartiennent ».
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: aux prêtres qui assurent le service
  rationale: Rend le service cultuel des prêtres en français moderne, sans importer un vocabulaire confessionnel particulier.
