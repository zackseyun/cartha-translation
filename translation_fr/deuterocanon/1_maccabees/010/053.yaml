  yaml_path: translation/deuterocanon/1_maccabees/010/053.yaml
  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: fr
  text: J’ai engagé le combat contre lui, et lui et son camp ont été écrasés par nous[a], et nous nous sommes assis sur le trône de son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un verbe au singulier : « lui et son camp a été écrasé par nous » ; le français emploie le pluriel avec ce sujet composé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  choice: J’ai engagé le combat contre lui
  rationale: L’expression grecque signifie entrer en combat ou engager la bataille. Cette formulation conserve l’idiome militaire tout en restant naturelle en français.
- source_word: συνετρίβη
  choice: ont été écrasés
  rationale: Le verbe exprime une défaite violente, plus forte qu’une simple défaite. Le pluriel français s’accorde naturellement avec le sujet composé « lui et son camp », alors que le grec porte un singulier.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: son camp
  rationale: Dans ce contexte militaire, παρεμβολή peut désigner le camp ou les forces qui y sont rassemblées. « Son camp » reste direct et préserve la formulation du grec.
- source_word: ὑφʼ ἡμῶν
  choice: par nous
  rationale: Cette traduction directe conserve l’expression de l’agent et la voix à la première personne du pluriel.
- source_word: ἐκαθίσαμεν
  choice: nous nous sommes assis
  rationale: Le sens concret du verbe est conservé; la mention du trône indique déjà que l’action signifie ici prendre possession du pouvoir royal.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: sur le trône de son royaume
  rationale: La formulation rend distinctement θρόνος et βασιλεία sans expliciter davantage l’identité du royaume ni la nature de l’accession au pouvoir.
