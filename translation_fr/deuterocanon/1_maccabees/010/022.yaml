lexical_decisions:
- source_word: Καὶ
  choice: (non rendu séparément)
  rationale: En français narratif moderne, commencer par « Et » est possible, mais souvent moins naturel hors contexte. Le lien avec ce qui précède reste implicite sans perte de sens.
- source_word: ἤκουσεν
  choice: entendit
  rationale: L’aoriste de ἀκούω indique ici que Démétrios prit connaissance des paroles rapportées; le passé simple convient au registre narratif digne.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française traditionnelle et courante du nom grec.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: λόγους peut désigner des paroles, des déclarations ou un message. « Ces paroles » préserve simplement la formulation grecque et le renvoi au discours précédent.
- source_word: καὶ
  choice: et…
  rationale: Le texte source fourni s’interrompt sur cette conjonction. La conserver avec des points de suspension signale honnêtement que la phrase demeure inachevée, sans inventer la suite.
