  text: And those who fell by the sword, together with those who were burned, came to eight thousand men.
translation:
  language: fr
  text: Ceux qui tombèrent sous l’épée, avec ceux qui furent brûlés, furent au nombre de huit mille hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: ceux qui tombèrent sous l’épée
  rationale: Rend naturellement le participe parfait substantivé et le datif instrumental, tout en conservant l’image du texte grec.
- source_word: σὺν τοῖς ἐμπυρισθεῖσιν
  choice: avec ceux qui furent brûlés
  rationale: Le participe passif désigne ceux qui ont péri par le feu; «furent brûlés» reste proche du grec sans préciser davantage les circonstances.
- source_word: ἐγένοντο … εἰς ἄνδρας ὀκτακισχιλίους
  choice: furent au nombre de huit mille hommes
  rationale: Cette tournure française idiomatique exprime le total atteint par les deux groupes, là où une reproduction littérale de εἰς serait peu naturelle.
