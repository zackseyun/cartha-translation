base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: fr
  text: 'Et quant au tiers des produits des semailles[a] et à la moitié des fruits des arbres qu’il me revient de percevoir, j’y renonce[c] dès aujourd’hui et désormais : ils ne seront prélevés ni sur le pays de Juda ni sur les trois districts[b] qui lui ont été rattachés, pris sur la Samarie et la Galilée, dès aujourd’hui et pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le tiers des semailles ». Il s’agit vraisemblablement du tiers de la production issue des semailles, perçu comme redevance.'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne des circonscriptions administratives.
    reason: cultural_note
  - marker: c
    text: Il s’agit de la part royale, ou des revenus fiscaux, auxquels le roi renonce.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  choice: quant au tiers des produits des semailles
  rationale: Dans ce contexte fiscal, ἀντί introduit les redevances auxquelles le roi renonce, tandis que σπορά désigne ici ce qui provient des semailles. Cette formulation conserve l’image grecque sans laisser entendre qu’un tiers des semences elles-mêmes était prélevé.
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: à la moitié des fruits des arbres
  rationale: Le grec désigne les fruits produits par les arbres. La formulation française est naturelle et évite le calque impropre « fruit ligneux ».
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: qu’il me revient de percevoir
  rationale: ἐπιβάλλω exprime ici la part qui échoit ou qui est due au roi; « percevoir » convient au contexte des prélèvements fiscaux.
- source_word: ἀφίημι
  choice: j’y renonce
  rationale: Le roi abandonne son droit à ces revenus. « J’y renonce » est accessible et précis, sans la connotation morale que pourrait avoir « pardonner ».
- source_word: τοῦ λαβεῖν
  choice: ils ne seront prélevés
  rationale: L’infinitif articulé dépend de l’idée de renonciation et vise la cessation de la perception. La tournure passive rend clairement en français l’effet concret de la remise.
- source_word: γῆς Ἰούδα
  choice: le pays de Juda
  rationale: Rendu géographique direct et usuel, plus proche du grec que « Judée ».
- source_word: τῶν τριῶν νομῶν
  choice: les trois districts
  rationale: νομός désigne ici une circonscription administrative; « districts » est clair en français moderne.
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: qui lui ont été rattachés
  rationale: Le participe décrit des districts incorporés au pays de Juda. « Rattachés » exprime naturellement ce rapport administratif.
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: pris sur la Samarie et la Galilée
  rationale: La formule indique l’origine territoriale des districts. « Pris sur » rend explicitement leur détachement de ces régions sans préciser une répartition que le grec ne donne pas.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: pour toujours
  rationale: Expression française naturelle de la durée perpétuelle indiquée par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe fiscale complexe du grec est clarifiée sans supprimer les deux catégories de prélèvement, leur origine territoriale ni le caractère permanent de la remise.
