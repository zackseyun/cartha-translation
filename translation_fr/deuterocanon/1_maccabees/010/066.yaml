lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: retourna
  rationale: Avec εἰς Ἱερουσαλήμ, le verbe indique un retour vers un lieu déjà connu. Le passé simple convient au récit historique et rend naturellement l’aoriste grec.
- source_word: μετʼ εἰρήνης
  choice: dans la paix
  rationale: Bien que μετά avec le génitif signifie littéralement « avec », « dans la paix » exprime en français naturel un retour paisible et sans danger, sans réduire le nom à un simple adverbe.
- source_word: εὐφροσύνης
  choice: la joie
  rationale: Le nom désigne la joie ou l’allégresse. « Joie » est clair, actuel et digne, tout en maintenant le parallélisme nominal avec « paix ».
- source_word: Ἰωνάθαν
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: Ἱερουσαλήμ
  choice: Jérusalem
  rationale: Forme française standard du nom de lieu.
