  text: And no one will have authority to act against or harass any of them in any matter.
translation:
  language: fr
  text: Et personne n’aura le droit d’agir contre l’un d’eux ni de l’importuner dans aucune affaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν
  choice: n’aura le droit
  rationale: Dans le contexte juridique d’un décret royal, ἐξουσία désigne ici l’autorité ou le droit d’agir. « N’aura le droit » exprime naturellement en français l’interdiction officielle, sans réduire le terme à la simple capacité.
- source_word: οὐδεὶς
  choice: personne
  rationale: Équivalent français direct et courant de l’indéfini négatif.
- source_word: πρᾶξαι
  choice: agir contre
  rationale: Le verbe πράσσω est large, mais son association avec παρενοχλεῖν et la protection accordée au groupe donnent ici à l’action une orientation hostile. « Agir contre » conserve cette largeur sans préciser indûment la nature de la mesure.
- source_word: παρενοχλεῖν
  choice: causer des difficultés
  rationale: Le verbe désigne le fait de troubler, gêner ou importuner. « Causer des difficultés » convient au registre administratif du décret et évite les connotations plus étroites que peut avoir « harceler » en français moderne.
- source_word: τινα αὐτῶν
  choice: l’un d’eux
  rationale: Le singulier indéfini τινα vise n’importe quel membre du groupe protégé. Dans la construction coordonnée, le pronom « lui » reprend naturellement ce référent.
- source_word: περὶ παντὸς πράγματος
  choice: quelle que soit l’affaire
  rationale: Cette formule rend la portée exhaustive de παντός et le sens juridique ou administratif de πρᾶγμα, tout en restant naturelle en français.
