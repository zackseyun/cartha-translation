  source_fidelity: Le projet rend correctement la structure juridique de οὐχ ἕξει ἐξουσίαν (« n’aura le droit »), l’interdiction visant toute personne (οὐδείς), ainsi que la protection de tout individu du groupe. « Agir contre » est une explicitation contextuellement justifiée de πρᾶξαι, en accord avec la traduction anglaise auditée, sans préciser la nature de l’action. La portée universelle de περὶ παντὸς πράγματος doit toutefois être formulée plus directement.
