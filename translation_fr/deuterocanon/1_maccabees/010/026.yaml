  text: Since you have kept faith with us in the treaties[a], and have remained in our friendship and have not joined our enemies, we have heard[b], and
translation:
  language: fr
  text: Puisque vous nous êtes restés fidèles dans les traités[a], que vous êtes restés dans notre amitié et que vous ne vous êtes pas ralliés à nos ennemis, nous l’avons appris, et[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous avez gardé votre loyauté envers nous dans le cadre des traités ». Dans ce contexte diplomatique, le grec πίστις peut exprimer la fidélité ou la loyauté.'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec transmis s’achève ici par « nous l’avons appris, et » ; la phrase se poursuit au verset suivant et demeure donc inachevée à cette limite de verset.
