lexical_decisions:
- source_word: ἐπεὶ
  choice: Puisque
  rationale: Introduit naturellement en français la cause sur laquelle repose la suite de la lettre.
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς
  choice: vous nous êtes restés fidèles
  rationale: Dans ce contexte diplomatique, πίστις désigne la fidélité ou la loyauté envers un partenaire; cette tournure française rend naturellement l’idée de fidélité maintenue.
- source_word: συνθήκας
  choice: dans les traités
  rationale: Le terme désigne ici des accords politiques formels; « traités » convient au contexte diplomatique.
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: vous avez maintenu notre amitié
  rationale: Le verbe exprime la persévérance dans une relation; « maintenir notre amitié » est naturel et conserve la portée relationnelle et diplomatique de φιλία.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: vous ne vous êtes pas ralliés à nos ennemis
  rationale: Le verbe évoque le fait de passer dans un autre camp ou de se joindre à lui; « se rallier à » restitue précisément cette nuance politique.
- source_word: ἠκούσαμεν
  choice: nous l’avons appris
  rationale: Dans une lettre diplomatique, le verbe signifie naturellement que l’information est parvenue à l’auteur; le pronom reprend les faits qui précèdent sans supprimer la rupture syntaxique finale.
theological_decisions:
- issue: Sens de πίστιν dans un contexte politico-diplomatique
  choice: fidèles
  alternative: foi; loyauté
  rationale: Ici, πίστις ne désigne pas explicitement la foi religieuse, mais la fidélité dans des relations conventionnelles. « Restés fidèles » rend ce sens contextuel sans introduire de lecture doctrinale.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre diplomatique. La coordination finale volontairement suspendue respecte la forme transmise du grec et le découpage du verset.
