base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: fr
  text: Le roi Alexandre vint à sa rencontre et lui donna en mariage sa fille Cléopâtre[a]. Il célébra le mariage de sa fille à Ptolémaïs, comme le font les rois[b], avec une grande magnificence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « lui donna sa fille Cléopâtre » ; dans ce contexte, le verbe grec signifie la donner en mariage.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « à la manière des rois » ou « selon la coutume des rois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  choice: vint à sa rencontre
  rationale: Le verbe exprime la rencontre et peut comporter l’idée d’aller au-devant de quelqu’un; cette tournure française naturelle conserve cette nuance sans la surcharger.
- source_word: ἐξέδοτο
  choice: donna en mariage
  rationale: Dans ce contexte, le verbe désigne explicitement l’acte de donner une fille en mariage; préciser « en mariage » évite en français toute ambiguïté indésirable.
- source_word: Κλεοπάτραν τὴν θυγατέρα αὐτοῦ
  choice: sa fille Cléopâtre
  rationale: Cet ordre est le plus naturel en français moderne tout en rendant exactement le nom suivi de son lien familial dans le grec.
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: Il célébra ses noces
  rationale: L’expression grecque signifie organiser ou célébrer le mariage; « célébrer ses noces » est actuel, digne et adapté à une cérémonie royale.
- source_word: ἐν Πτολεμαΐδι
  choice: à Ptolémaïs
  rationale: La préposition française « à » convient à un nom de ville; « Ptolémaïs » est la forme traditionnelle française du toponyme grec.
- source_word: καθὼς οἱ βασιλεῖς
  choice: comme le font les rois
  rationale: La formule conserve la comparaison grecque et suggère la manière ou la coutume royale sans choisir trop étroitement entre ces nuances.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: avec une grande magnificence
  rationale: Ici, δόξα évoque l’éclat, le faste et l’honneur de la cérémonie plutôt que la gloire au sens théologique; « magnificence » rend naturellement ce registre royal.
theological_decisions: []
