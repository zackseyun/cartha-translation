base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: fr
  text: Apollonius l’apprit. Il établit son camp avec trois mille cavaliers et une force importante, puis se rendit à Azot comme s’il était simplement de passage[a]. En même temps, il s’avança dans la plaine, car il disposait d’une cavalerie nombreuse[b] et comptait sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme s’il ne faisait que passer ». Le grec présente son déplacement comme un simple transit plutôt que comme une attaque déclarée.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le mot « cheval » collectivement pour désigner les troupes montées.
    reason: cultural_note
lexical_decisions:
- source_word: παρενέβαλεν
  choice: il établit son camp avec
  rationale: Dans ce récit militaire, le verbe désigne l’établissement d’un camp. La tournure avec « avec » rend naturellement en français la présence des troupes qui l’accompagnent.
- source_word: τρισχιλίαν ἵππον
  choice: trois mille cavaliers
  rationale: ἵππος est employé collectivement par métonymie pour des troupes montées. « Cavaliers » convient au dénombrement d’hommes en français moderne.
- source_word: δύναμιν πολλήν
  choice: une armée nombreuse
  rationale: Ici, δύναμις désigne concrètement une force militaire. « Armée nombreuse » est clair et digne, sans réduire cette force à une catégorie particulière de troupes.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: se dirigea vers Azôtos
  rationale: Cette formulation rend le mouvement vers la ville sans préciser indûment le mode de déplacement.
- source_word: ὡς διοδεύων
  choice: comme s’il ne faisait que traverser la région
  rationale: ὡς conserve la valeur d’apparence ou de prétexte, tandis que διοδεύων indique un passage à travers un territoire. La traduction laisse entendre, sans l’expliciter excessivement, que son mouvement pouvait paraître être un simple transit.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: En même temps, il avançait dans la plaine
  rationale: ἅμα marque la simultanéité et προσάγω, dans le contexte militaire, l’avancée. L’imparfait français présente la manœuvre en cours parallèlement au déplacement apparent vers Azôtos.
- source_word: πλῆθος ἵππου
  choice: une cavalerie nombreuse
  rationale: Le singulier collectif ἵππου renvoie ici à la cavalerie, et πλῆθος à son importance numérique.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: comptait sur elle
  rationale: Le parfait exprime une confiance établie. Le pronom féminin français reprend naturellement « cavalerie », comme le pronom grec reprend vraisemblablement le collectif ἵππος.
