review_pass:
  verdict: revise
  source_fidelity: 'Le sens militaire est globalement bien rendu : Apollonius campe avec 3 000 cavaliers et une force importante, feint un simple passage et avance vers/dans la plaine en se fiant à sa cavalerie. Toutefois, « vers Azôtos » atténue εἰς (« à »), l’imparfait « avançait » ne rend pas l’aoriste narratif, et « une armée nombreuse » peut indûment identifier la δύναμις comme une armée constituée plutôt que comme une force militaire importante.'
  naturalness: Le français est naturel et d’un registre narratif approprié. « Se rendit à Azot » et « s’avança dans la plaine » sont plus directs et plus fidèles à la progression narrative. « Comme s’il était simplement de passage » exprime idiomatiquement la présentation feinte de son mouvement sans ajouter « la région », absent du grec.
  terminology: « Cavalerie » rend correctement l’emploi collectif de ἵππος, et le pronom féminin « elle » a un antécédent net. « Force importante » conserve l’ampleur volontairement générale de δύναμις πολλήν. Les formes françaises usuelles « Apollonius » et « Azot » sont préférables aux translittérations « Apollonios » et « Azôtos » dans une traduction française moderne.
  issues:
  - severity: medium
    issue: Destination rendue de manière atténuée
    rationale: ἐπορεύθη εἰς Ἄζωτον indique qu’il alla à Azot ; « se dirigea vers » peut seulement indiquer une orientation sans arrivée ou entrée dans la ville.
  - severity: low
    issue: Temps verbal de la manœuvre dans la plaine
    rationale: Le grec emploie l’aoriste προσῆγεν dans la succession narrative. « Il avançait » introduit un arrière-plan duratif non exprimé ; « il s’avança » le restitue plus exactement.
  - severity: low
    issue: Désignation trop spécifique de δύναμις
    rationale: « Armée » est possible en contexte, mais δύναμις reste plus large ; « force importante » préserve l’absence de précision sur la composition de ce contingent.
  - severity: low
    issue: Formes de noms peu usuelles en français
    rationale: « Azot » est la forme française biblique courante d’Ἄζωτος, et « Apollonius » est la forme française habituelle du nom grec Ἀπολλώνιος.
  revised_text: Apollonius l’apprit. Il établit son camp avec trois mille cavaliers et une force importante, puis se rendit à Azot comme s’il était simplement de passage[a]. En même temps, il s’avança dans la plaine, car il disposait d’une cavalerie nombreuse[b] et comptait sur elle.
  revised_footnotes:
