revisions:
- from: Apollonios l’apprit. Il établit son camp avec trois mille cavaliers et une armée nombreuse, puis se dirigea vers Azôtos comme s’il ne faisait que traverser la région[a]. En même temps, il avançait dans la plaine, car il disposait d’une cavalerie nombreuse[b] et comptait sur elle.
  to: Apollonius l’apprit. Il établit son camp avec trois mille cavaliers et une force importante, puis se rendit à Azot comme s’il était simplement de passage[a]. En même temps, il s’avança dans la plaine, car il disposait d’une cavalerie nombreuse[b] et comptait sur elle.
  rationale: La révision rétablit la destination exprimée par εἰς, conserve la valeur ponctuelle des aoristes narratifs, évite de préciser au-delà du grec la nature de la δύναμις, et adopte des formes françaises usuelles pour les noms. Les notes et leurs ancres restent cohérentes avec les termes annotés.
