translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour éviter une longue coordination calquée sur le grec, tout en conservant l’ordre des actions, la simultanéité de la manœuvre et l’ambiguïté de l’apparence suggérée par ὡς.
