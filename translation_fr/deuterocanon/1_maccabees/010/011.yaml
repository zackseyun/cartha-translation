  verdict: revise
  source_fidelity: La traduction conserve les principaux éléments, mais « rebâtir » introduit l’idée de reconstruction, absente de οἰκοδομεῖν (« bâtir, construire »). La restructuration actuelle (« fortifier ... le mont Sion ») rend la phrase française plus aisée, mais éloigne quelque peu la construction grecque, où les pierres taillées et la fortification qualifient l’ouvrage à réaliser autour du mont Sion.
  naturalness: Le français est globalement naturel, mais « ceux qui exécutaient les travaux » est lourd dans ce contexte. « Aux ouvriers » est plus direct et moderne. La version révisée rend explicitement, sans confusion, l’idée de murailles construites autour du mont Sion.
  terminology: « Mont Sion » et « pierres de taille » sont des rendus appropriés de τὸ ὄρος Σιὼν et λίθων τετραγώνων. « Fortification » préserve bien εἰς ὀχύρωσιν.
