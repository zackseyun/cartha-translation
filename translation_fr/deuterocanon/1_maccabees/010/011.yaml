  text: Il dit aux ouvriers de bâtir des murailles tout autour du mont Sion avec des pierres de taille, pour en faire une fortification. Et ils firent ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν πρὸς
  choice: Il ordonna à
  rationale: Dans ce contexte de travaux prescrits par un dirigeant, la parole adressée aux ouvriers a valeur d’ordre; cette formulation est naturelle en français.
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: ceux qui exécutaient les travaux
  rationale: Rend directement les personnes chargées des ouvrages, sans introduire un corps de métier absent du grec.
- source_word: οἰκοδομεῖν
  choice: rebâtir
  rationale: Le contexte porte sur la remise en état des murailles; «rebâtir» exprime naturellement cette reconstruction.
- source_word: τὸ ὄρος Σιὼν
  choice: le mont Sion
  rationale: Traduction traditionnelle et exacte de l’expression grecque, en maintenant la désignation topographique.
- source_word: κυκλόθεν
  choice: tout autour
  rationale: Conserve l’idée d’un ouvrage encerclant ou entourant le site.
- source_word: ἐκ λίθων τετραγώνων
  choice: avec des pierres taillées au carré
  rationale: Exprime des pierres équarries, préparées pour la construction, plutôt qu’une forme géométrique absolument carrée.
- source_word: εἰς ὀχύρωσιν
  choice: de fortifier
  rationale: Intègre naturellement en français la finalité défensive indiquée par le grec.
