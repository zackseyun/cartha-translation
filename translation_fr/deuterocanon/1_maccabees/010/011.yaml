  - severity: low
    issue: La formulation actuelle transforme la construction envisagée en un simple acte de « fortifier le mont Sion ».
    rationale: Le grec associe la construction des murailles, le pourtour du mont Sion, les pierres équarries et la finalité défensive. Une formulation centrée sur des murailles autour du mont conserve plus clairement ces éléments.
