base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: fr
  text: Et tout l’excédent qu’ils n’ont pas prélevé sur les recettes, comme les années précédentes, ils le donneront désormais pour les travaux de la Maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: C’est-à-dire le Temple ; « la Maison » traduit littéralement l’expression grecque.
    reason: cultural_note
lexical_decisions:
- source_word: πλεονάζον
  choice: l’excédent
  rationale: Le participe substantivé désigne ce qui reste en plus. « L’excédent » convient au contexte administratif et financier sans préciser indûment sa nature.
- source_word: ἀπέδωσαν
  choice: n’ont pas versé
  rationale: Dans ce contexte fiscal, ἀποδίδωμι évoque la remise ou le paiement d’une somme. « Verser » est naturel en français administratif.
- source_word: χρειῶν
  choice: recettes
  rationale: Le sens courant de χρεία est « besoin », « nécessité » ou « ressources nécessaires », mais la construction financière de la phrase permet ici de comprendre les sommes perçues ou disponibles. « Recettes » rend ce sens contextuel, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: comme les années précédentes
  rationale: Dans l’opposition avec « désormais », πρῶτος renvoie vraisemblablement aux années antérieures plutôt qu’aux toutes premières années d’une période. Cette formulation est idiomatique en français.
- source_word: τὰ ἔργα
  choice: les travaux
  rationale: Le pluriel désigne les ouvrages ou projets concernant le sanctuaire. « Travaux » préserve la portée générale sans imposer « réparations » ou « construction ».
- source_word: τοῦ οἴκου
  choice: de la Maison
  rationale: « Maison » traduit littéralement οἶκος, désignation révérencielle du Temple. La majuscule signale l’emploi comme titre contextuel sans remplacer l’image grecque.
theological_decisions:
- issue: Identification de « la Maison »
  choice: Conserver « la Maison » dans le texte et préciser en note qu’il s’agit du Temple.
  alternative: Traduire directement par « le Temple ».
  rationale: Le maintien de la métaphore respecte le grec et son registre biblique, tandis que la note évite toute obscurité pour le lecteur moderne.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe administrative accessible. « Désormais » rend nettement ἀπὸ τοῦ νῦν. La répétition pronominale « ils le donneront » conserve la structure de reprise du grec tout en restant naturelle.
