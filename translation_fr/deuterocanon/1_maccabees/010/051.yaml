  text: 'Alexandre envoya des ambassadeurs à Ptolémée, roi d’Égypte, avec ce message :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste de ἀποστέλλω exprime ici simplement l’envoi; « envoya » convient au récit et au contexte diplomatique.
- source_word: πρὸς Πτολεμαῖον
  choice: à Ptolémée
  rationale: Après un verbe d’envoi, πρὸς suivi de l’accusatif désigne naturellement le destinataire.
- source_word: πρέσβεις
  choice: des ambassadeurs
  rationale: πρέσβεις désigne des représentants officiels; « ambassadeurs » restitue le cadre diplomatique et royal.
- source_word: βασιλέα Αἰγύπτου
  choice: roi d’Égypte
  rationale: Le groupe est en apposition à Ptolémée et s’exprime naturellement ainsi en français.
- source_word: κατὰ τοὺς λόγους τούτους λέγων
  choice: 'avec ce message :'
  rationale: La formule introduit le contenu du message cité au verset suivant. Cette tournure française rend l’ensemble idiomatiquement, sans le pléonasme peu naturel « avec ces paroles, disant ».
