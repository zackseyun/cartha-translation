  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: fr
  text: 'Le roi leur donna l’ordre[a] : on retira à Jonathan ses vêtements et on le revêtit de pourpre[b]. Ils firent ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Après « le roi leur donna l’ordre », les verbes grecs traduits par « on retira » et « on revêtit » sont au singulier, tandis que la dernière proposition est au pluriel. Le sens paraît être que les personnes présentes exécutèrent l’ordre du roi.
    reason: textual_variant
  - marker: b
    text: Dans ce contexte de cour, la pourpre est un signe de dignité royale ou de rang élevé.
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  choice: donna l’ordre
  rationale: Le verbe exprime un commandement faisant autorité. « Leur en donna l’ordre » est naturel en français moderne et conserve l’autorité royale.
- source_word: ἐξέδυσεν
  choice: on retira à Jonathan
  rationale: La forme grecque est au singulier, mais l’agent n’est pas nommé et le contexte désigne les personnes auxquelles le roi vient de donner l’ordre. Le pronom indéfini « on » conserve cette indétermination sans attribuer directement l’action au roi.
- source_word: ἱμάτια
  choice: vêtements
  rationale: Terme général désignant les habits. « Vêtements » est digne et courant, sans préciser abusivement qu’il s’agissait de robes.
- source_word: ἐνέδυσεν
  choice: on le revêtit
  rationale: « Revêtir » rend bien l’action de faire porter un vêtement et convient au caractère cérémoniel de la scène.
- source_word: πορφύραν
  choice: de pourpre
  rationale: Le nom grec peut désigner l’étoffe pourpre ou un vêtement de pourpre. Cette formulation concise préserve cette latitude sémantique.
- source_word: ἐποίησαν οὕτως
  choice: Ils firent ainsi
  rationale: Traduction directe et idiomatique de la proposition récapitulative, qui marque l’exécution de l’ordre royal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’emploi de « on » préserve le changement de nombre et l’agent non exprimé du grec, tandis que « Ils firent ainsi » reproduit le retour explicite au pluriel.
