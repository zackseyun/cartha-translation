    rationale: « Parce qu’ils doivent » donne au participe ὀφείλων une valeur causale non marquée, et « sont poursuivis » ne traduit pas πᾶν πρᾶγμα, qui demeure une expression large (« toute affaire ») sous la dépendance de « redevables ».
  - severity: medium
    issue: Portée excessive de « libérés de toute obligation »
    rationale: ἀπολελύσθωσαν demande une libération sans préciser grammaticalement « de toute obligation »; la mention coordonnée de tout ce qui leur appartient doit aussi rester visible dans la formulation française.
