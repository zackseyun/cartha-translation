base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: fr
  text: Tous ceux qui fuiront vers le sanctuaire de Jérusalem et dans tout son territoire[a], redevables de redevances royales ou de toute autre obligation, seront libérés, ainsi que tout ce qui leur appartient dans mon royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se réfugieront dans le Temple de Jérusalem et dans toute son enceinte ». Les termes grecs peuvent désigner plus largement l’espace du Temple ou le territoire qui lui est rattaché.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « étant redevables de choses royales et de toute affaire, qu’ils soient libérés ». L’expression peut englober des redevances, des dettes ou d’autres obligations ou réclamations juridiques.'
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: fuiront vers
  rationale: Conserve le mouvement exprimé par φεύγω sans intégrer directement dans le texte la notion interprétative de refuge, que la destination sacrée laisse néanmoins entendre.
- source_word: ἱερὸν
  choice: sanctuaire
  rationale: Désigne naturellement l’espace sacré du Temple sans le réduire au seul bâtiment.
- source_word: ὁρίοις
  choice: toute l’étendue de son territoire
  rationale: ὅρια peut désigner des limites ou le territoire qu’elles délimitent. Cette formulation française est plus naturelle que « toutes ses frontières » dans ce contexte administratif.
- source_word: βασιλικὰ
  choice: des redevances au roi
  rationale: Dans ce contexte, le substantif neutre pluriel désigne ce qui est dû au pouvoir royal, sans limiter nécessairement le sens aux seuls impôts.
- source_word: πᾶν πρᾶγμα
  choice: quelque autre affaire que ce soit
  rationale: Rend la largeur de πρᾶγμα et évite de réduire sans certitude l’expression à une dette financière.
- source_word: ἀπολελύσθωσαν
  choice: seront libérés de toute obligation
  rationale: Exprime en français le résultat juridique du parfait passif impératif dans le style d’un décret royal.
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: tout ce qu’ils possèdent
  rationale: Formulation courante et suffisamment large pour inclure l’ensemble de leurs biens sans préciser indûment leur nature.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: dans mon royaume
  rationale: Rendu direct et idiomatique du domaine soumis à l’autorité du roi.
theological_decisions:
- issue: Portée de l’asile et de la remise liés au sanctuaire de Jérusalem
  choice: Le décret libère de leurs obligations les personnes qui fuient vers le sanctuaire et protège également leurs possessions dans le royaume.
  alternative: Le décret pourrait ne viser que les dettes et prélèvements royaux, ou laisser « toute affaire » dans un sens juridique plus général.
  rationale: La construction avec ὀφείλων et ἀπολελύσθωσαν indique une libération de charges ou de poursuites, mais πᾶν πρᾶγμα demeure plus large qu’une simple dette. Le texte et la note conservent cette amplitude.
- issue: Référent et portée de « ses limites »
  choice: Le texte principal parle de toute l’étendue du territoire associé au sanctuaire de Jérusalem.
  alternative: L’expression peut viser l’enceinte du Temple, ses dépendances, ou plus largement le territoire de Jérusalem.
  rationale: Le grec ne définit pas précisément l’étendue administrative ou sacrée concernée; la note signale donc les principales possibilités sans en imposer une.
translation_notes:
  register: Français international moderne, clair et digne, avec la cadence d’un décret royal. « Redevances au roi » évite l’expression moins naturelle « taxes royales » et conserve une portée fiscale assez large. Les deux notes rendent visibles les ambiguïtés territoriale et juridique du grec.
