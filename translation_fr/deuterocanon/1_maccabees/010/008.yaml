lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: furent saisis d’une grande peur
  rationale: Le grec emploie un accusatif de même racine, littéralement « éprouvèrent une grande peur », pour intensifier l’idée. Cette formulation française en conserve la force de façon naturelle.
- source_word: ὅτε ἤκουσαν
  choice: lorsqu’ils apprirent
  rationale: Dans ce contexte, ἀκούω désigne le fait de recevoir une nouvelle. « Apprirent » rend naturellement le sens, tandis que « lorsqu’ils » conserve la relation temporelle.
- source_word: ἔδωκεν αὐτοῖς
  choice: leur avait donné
  rationale: Le plus-que-parfait marque clairement que l’octroi royal précédait la nouvelle qui provoqua leur peur.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Équivalent français direct et usuel dans ce récit historique.
- source_word: ἐξουσίαν
  choice: le pouvoir
  rationale: Le terme désigne ici une autorisation ou une compétence déléguée par le roi. « Le pouvoir de » est idiomatique en français et exprime cette capacité officiellement accordée.
- source_word: συναγαγεῖν δυνάμεις
  choice: de rassembler des troupes
  rationale: Dans ce contexte militaire, δυνάμεις désigne des forces armées; « troupes » est plus clair en français courant, et « rassembler » suit précisément συναγαγεῖν.
