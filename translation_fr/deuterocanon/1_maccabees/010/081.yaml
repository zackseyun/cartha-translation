  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: fr
  text: Mais le peuple resta en position, comme Jonathan l’avait ordonné, et leurs chevaux se fatiguèrent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « leurs chevaux ». Dans le contexte, il s’agit très probablement des chevaux de la cavalerie ennemie, qui se fatiguèrent tandis que les hommes de Jonathan restaient en position.
    reason: L’antécédent du possessif est ambigu dans la phrase grecque, bien que le contexte favorise l’armée ennemie.
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: Mais le peuple
  rationale: λαός désigne ici le peuple, compris dans le contexte comme les troupes de Jonathan. δέ marque une légère opposition ou transition narrative, rendue naturellement par « Mais ».
- source_word: ἱστήκει
  choice: resta en position
  rationale: 'Le verbe décrit un état maintenu : le peuple demeure là où Jonathan l’a placé. Cette formulation exprime plus clairement le sens contextuel que le seul « se tenait debout », sans ajouter l’idée d’un combat actif.'
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: comme Jonathan l’avait ordonné
  rationale: ἐπιτάσσω signifie « ordonner » ou « commander ». Le plus-que-parfait français situe naturellement cet ordre avant le maintien en position.
- source_word: ἐκοπίασαν
  choice: se fatiguèrent
  rationale: κοπιάω indique que les chevaux devinrent fatigués sous l’effet de l’effort, sans nécessairement signifier un épuisement complet.
- source_word: οἱ ἵπποι αὐτῶν
  choice: leurs chevaux
  rationale: Le grec emploie simplement le possessif « leurs ». Son antécédent contextuel est probablement l’armée ennemie, mais la traduction conserve l’ambiguïté grammaticale du texte source.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Resta en position » rend idiomatiquement le maintien sur place commandé par Jonathan. Le possessif ambigu du grec est conservé dans le texte et expliqué en note.
