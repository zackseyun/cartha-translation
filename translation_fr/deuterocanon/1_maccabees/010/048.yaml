  text: And Alexander the king gathered great forces and encamped opposite Demetrius.
translation:
  language: fr
  text: Le roi Alexandre rassembla de grandes forces et établit son camp en face de Démétrios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: rassembla
  rationale: L’aoriste de συνάγω décrit ici le rassemblement de forces militaires; « rassembla » est naturel et fidèle sans préciser davantage le mode de mobilisation.
- source_word: δυνάμεις μεγάλας
  choice: de grandes forces
  rationale: Dans ce récit militaire, δυνάμεις désigne des forces ou des troupes. Le pluriel et l’ampleur exprimée par μεγάλας sont conservés.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: En contexte militaire, παρεμβάλλω signifie installer ou établir un camp. Cette formulation est claire en français moderne et garde la valeur militaire du verbe.
- source_word: ἐξ ἐναντίας
  choice: en face de
  rationale: L’expression indique d’abord une position opposée; « en face de » préserve ce sens spatial sans introduire l’idée d’une attaque déjà engagée.
- source_word: Δημητρίῳ
  choice: Démétrios
  rationale: Translittération française directe du nom grec Δημήτριος, permettant de le distinguer clairement dans un texte traduit du grec.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: Le roi Alexandre
  rationale: Cette tournure est la forme naturelle et digne en français moderne pour rendre l’apposition grecque « Alexandre, le roi ».
