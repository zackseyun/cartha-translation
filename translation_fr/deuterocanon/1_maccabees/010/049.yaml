  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: fr
  text: Les deux rois engagèrent le combat. Le camp de Démétrios prit la fuite, et Alexandre le poursuivit et l’emporta sur eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe du singulier (« le poursuivit », c’est-à-dire Démétrios) au pluriel (« l’emporta sur eux », c’est-à-dire ses troupes).
    reason: Le changement de nombre dans le texte source peut surprendre en français; la note préserve et explique cette formulation sans la lisser.
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: engagèrent le combat
  rationale: L’expression grecque signifie littéralement qu’ils « joignirent le combat » ou entrèrent en guerre. « Engagèrent le combat » est naturel en français moderne et conserve le sens militaire précis.
- source_word: οἱ δύο βασιλεῖς
  choice: les deux rois
  rationale: Rend directement le sujet explicite du grec sans ajouter d’interprétation.
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: le camp de Démétrios
  rationale: παρεμβολή désigne couramment un camp ou, par métonymie, les troupes qui y sont rassemblées. « Camp » préserve cette formulation plutôt que de l’interpréter directement comme « armée ».
- source_word: ἔφυγεν
  choice: prit la fuite
  rationale: Rend simplement l’idée de fuir, sans ajouter la notion plus forte d’une déroute imposée.
- source_word: ἐδίωξεν αὐτόν
  choice: le poursuivit
  rationale: Le pronom grec est au singulier masculin et renvoie naturellement à Démétrios, nommé juste auparavant.
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: l’emporta sur eux
  rationale: L’expression indique qu’Alexandre eut le dessus sur ses adversaires. Cette traduction garde une portée plus ouverte que « les vainquit complètement ».
