base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: fr
  text: Que des Juifs soient enrôlés dans les forces du roi, jusqu’au nombre de trente mille hommes, et qu’on leur fournisse leur entretien[a], comme il convient pour toutes les forces du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs rations », « leur subsistance »; littéralement « l’hospitalité ». Ici, le grec ξενιά désigne la prise en charge matérielle accordée aux troupes.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: soient enrôlés
  rationale: Le passif impératif désigne une inscription officielle en vue du service; « enrôlés » rend clairement le contexte militaire.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: 'Le génitif a ici une valeur partitive: les hommes doivent être recrutés parmi la population juive.'
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: dans les forces du roi
  rationale: δυνάμεις désigne les forces militaires royales; cette formulation n’impose pas l’idée de plusieurs armées distinctes.
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: jusqu’au nombre de trente mille hommes
  rationale: Avec le nombre, εἰς indique la limite visée, d’où « jusqu’au nombre de » plutôt qu’un total nécessairement exact.
- source_word: δοθήσεται αὐτοῖς
  choice: qu’on leur fournisse
  rationale: Cette tournure française rend naturellement le futur passif dans le style prescriptif du décret et se coordonne avec l’impératif précédent.
- source_word: ξενιά
  choice: leur entretien
  rationale: Dans ce contexte militaire, ξενιά désigne la prise en charge matérielle accordée aux troupes, et non simplement l’hospitalité privée.
- source_word: ὡς καθῆκει
  choice: comme il convient
  rationale: La formule exprime ce qui est approprié, dû ou conforme à l’usage.
- source_word: πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: pour toutes les forces du roi
  rationale: Le datif indique ici le groupe auquel cette prise en charge revient normalement.
