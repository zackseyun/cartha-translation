  text: Et Jonathan comprit qu’une embuscade se trouvait derrière lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: comprit alors
  rationale: L’aoriste de γινώσκω exprime ici la prise de conscience de Jonathan au cours de l’action. « comprit alors » rend naturellement cette reconnaissance soudaine sans se limiter au sens statique de « savait ».
- source_word: ἔνεδρον
  choice: une embuscade
  rationale: Le nom désigne une embuscade, éventuellement les hommes placés en embuscade. « une embuscade » conserve la formulation collective et reste claire en français moderne.
- source_word: κατόπισθεν αὐτοῦ
  choice: derrière lui
  rationale: La locution situe l’embuscade à l’arrière de Jonathan. « derrière lui » en est le rendu direct et idiomatique.
- source_word: καὶ
  choice: alors
  rationale: Dans cette brève proposition narrative, καί relie l’événement à la séquence précédente. « alors » rend avec naturel cette progression sans lui attribuer une valeur causale.
- source_word: ἐστιν
  choice: se trouvait
  rationale: Le présent grec, dans le contenu de la prise de conscience exprimée après un verbe au passé, indique l’existence ou la présence de l’embuscade. Le français narratif appelle naturellement l’imparfait « se trouvait ».
