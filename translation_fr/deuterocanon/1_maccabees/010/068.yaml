  text: And Alexander the king heard, and he was greatly grieved, and he returned to Antioch.
translation:
  language: fr
  text: Le roi Alexandre l’apprit. Il en fut profondément affligé et retourna à Antioche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans cette séquence narrative, ἀκούω signifie qu’Alexandre reçoit la nouvelle évoquée par le contexte. « L’apprit » est naturel en français et rend mieux cet emploi que le calque « entendit ».
- source_word: ἐλυπήθη σφόδρα
  choice: en fut profondément affligé
  rationale: Le passif de λυπέω exprime ici une vive peine ou détresse, et σφόδρα en renforce l’intensité. « Profondément affligé » conserve cette force dans un registre digne et actuel.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: retourna à Antioche
  rationale: Dans cet emploi narratif, ἀποστρέφω indique un retour vers un lieu. « Retourna à Antioche » est l’équivalent français le plus direct et naturel.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: Le roi Alexandre
  rationale: La tournure française usuelle « le roi Alexandre » rend naturellement l’apposition grecque « Alexandre, le roi » sans modifier le sens.
