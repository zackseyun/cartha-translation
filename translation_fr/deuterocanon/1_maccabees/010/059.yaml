lexical_decisions:
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω signifie directement « écrivit ». Cette traduction n’ajoute pas explicitement le mot « lettre », absent du grec.
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: le roi Alexandre
  rationale: Cet ordre est naturel en français moderne et conserve à la fois le titre royal et le nom propre.
- source_word: Ἰωνάθῃ
  choice: à Jonathan
  rationale: Le datif désigne ici le destinataire de ce qu’Alexandre écrit.
- source_word: ἐλθεῖν
  choice: de venir
  rationale: L’infinitif de ἔρχομαι exprime le fait de venir; après « écrivit à Jonathan », la construction infinitive française restitue naturellement l’invitation ou la demande.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: L’expression désigne le mouvement vers une rencontre avec Alexandre. « Venir à sa rencontre » est idiomatique, concis et proche de la structure grecque.
