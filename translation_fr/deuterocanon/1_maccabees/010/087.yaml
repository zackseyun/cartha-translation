lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: revint
  rationale: L’aoriste indique le retour de Jonathan après le combat. « Revint » est naturel en français et ne précise pas davantage la destination.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: avec ceux qui l’accompagnaient
  rationale: Cette formulation rend l’expression idiomatique grecque sans ajouter la nuance militaire plus explicite de « ses hommes ».
- source_word: ἔχοντες
  choice: chargés de
  rationale: Le participe décrit le groupe au moment de son retour. « Chargés de » exprime naturellement qu’ils transportaient une quantité importante de prises.
- source_word: σκῦλα
  choice: butin
  rationale: Le terme désigne des biens pris à l’ennemi au combat. « Butin » est le terme français courant et précis dans ce contexte.
- source_word: πολλά
  choice: abondant
  rationale: L’adjectif conserve l’insistance quantitative du grec tout en formant avec « butin » une expression française fluide.
