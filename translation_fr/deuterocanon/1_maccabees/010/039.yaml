    issue: « liées aux choses saintes » pour le dernier τοῖς ἁγίοις
    rationale: Le grec porte un datif masculin pluriel, identique formellement à la première référence aux personnes consacrées, et non une expression neutre pour des objets ou réalités sacrées. Le contexte cultuel peut motiver une note sur une lecture liée au service sacré, mais non cette substitution dans le texte.
  - severity: low
    issue: « qui sont à Jérusalem »
    rationale: La relative est compréhensible, mais « à Jérusalem » suffit en français et reste plus proche de l’épithète prépositionnelle grecque.
