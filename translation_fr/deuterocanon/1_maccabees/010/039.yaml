  source_fidelity: 'La première occurrence de τοῖς ἁγίοις est correctement reconnue comme un masculin pluriel désignant des personnes. En revanche, rendre la seconde par «les choses saintes» dépasse ce que permet la morphologie : «choses saintes» correspondrait normalement au neutre pluriel τὰ ἅγια, non au masculin datif pluriel τοῖς ἁγίοις. La construction finale demeure difficile, mais la traduction doit conserver son référent personnel le plus immédiat tout en le signalant en note.'
  naturalness: Le français est globalement naturel et conserve le ton d’un acte de concession. «Aux personnes consacrées à Jérusalem» est plus direct que «aux personnes consacrées qui sont à Jérusalem». «Des personnes consacrées» donne à la clausule une formulation française claire sans prétendre résoudre toutes les difficultés syntaxiques du grec.
  terminology: «Ptolémaïs» est la forme française appropriée. «Personnes consacrées» est une solution recevable pour ἅγιοι dans ce contexte, sans les connotations ecclésiales plus tardives de «saints». «Territoire qui lui est rattaché» et «dépenses prioritaires» sont des rendus prudents et idiomatiques.
  issues:
