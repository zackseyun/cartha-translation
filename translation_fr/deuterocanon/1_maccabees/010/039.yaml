base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: fr
  text: J’ai donné en cadeau Ptolémaïs et le territoire qui lui est rattaché[a] aux personnes consacrées à Jérusalem, pour les dépenses prioritaires des personnes consacrées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui lui appartient » ou « le district qui en dépend ».
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition est difficile en grec. Le même terme, au masculin pluriel, que dans « les personnes consacrées à Jérusalem » y est employé. On peut aussi comprendre « pour les dépenses nécessaires aux personnes consacrées » ; le contexte peut évoquer les dépenses du service sacré.
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: Ptolémaïs
  rationale: Forme française traditionnelle du nom de lieu grec, avec accentuation adaptée au français.
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: le territoire qui lui est rattaché
  rationale: Le participe désigne ce qui est joint à la ville ou en dépend; «territoire» explicite naturellement la portée géographique ou administrative.
- source_word: δέδωκα
  choice: J’ai donné
  rationale: Le passé composé rend ici le parfait grec et présente la concession comme un acte accompli dont l’effet demeure.
- source_word: δόμι
  choice: en cadeau
  rationale: La forme transmise est inhabituelle, mais relève vraisemblablement du vocabulaire du don; cette tournure restitue le sens sans corriger silencieusement le texte.
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: aux personnes consacrées qui sont à Jérusalem
  rationale: Le masculin pluriel substantivé désigne le plus naturellement des personnes. «Personnes consacrées» évite les connotations ecclésiales ultérieures que pourrait porter «saints».
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: pour les dépenses prioritaires
  rationale: La formulation grecque est difficile; «prioritaires» conserve l’idée de dépenses venant en premier, préalablement assignées ou requises, sans imposer une précision absente du texte.
- source_word: τοῖς ἁγίοις
  choice: liées aux choses saintes
  rationale: Le dernier datif pluriel est ambigu. «Choses saintes» reste morphologiquement possible et, dans ce contexte financier, peut désigner le culte ou les réalités sacrées sans transformer directement le pluriel en «sanctuaire».
theological_decisions:
- issue: Référent des deux occurrences de τοῖς ἁγίοις
  choice: La première désigne des personnes consacrées à Jérusalem; la seconde est rendue par «les choses saintes», avec une note signalant l’autre lecture possible.
  alternative: Comprendre la dernière occurrence comme renvoyant encore aux personnes consacrées, ou l’interpréter contextuellement comme le sanctuaire et son service.
  rationale: Le premier groupe comporte un masculin pluriel personnel naturel. Dans la dernière proposition, le contexte des dépenses favorise un emploi cultuel, mais la forme grecque et la syntaxe maladroite ne permettent pas de trancher avec certitude; la traduction et la note préservent donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton administratif d’une concession royale. «Personnes consacrées» rend la référence personnelle sans employer le terme potentiellement anachronique «saints»; la note maintient l’ambiguïté de la clause finale.
