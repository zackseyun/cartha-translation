lexical_decisions:
- source_word: ἀπέλειπεν
  choice: laissa
  rationale: Rend directement l’imparfait grec dans ce contexte narratif.
- source_word: χιλίαν ἵππον
  choice: mille cavaliers
  rationale: Le singulier collectif ἵππον désigne ici une troupe montée, plutôt que mille chevaux sans indication de combattants.
- source_word: κρυπτῶς
  choice: cachés
  rationale: Dans ce contexte tactique, l’adverbe indique que les cavaliers furent laissés en position dissimulée; le français naturel transpose l’adverbe en attribut.
- source_word: κατόπισθεν αὐτῶν
  choice: derrière eux
  rationale: Conserve la référence pronominale ambiguë du grec sans en préciser artificiellement l’antécédent.
