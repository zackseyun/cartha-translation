  text: For he will remember all the wrongs that we committed against him, and against his brothers, and against his nation.
translation:
  language: fr
  text: Car il se souviendra de tous les torts que nous avons commis contre lui, contre ses frères et contre son peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθήσεται
  choice: il se souviendra
  rationale: Rend directement le futur moyen de μιμνῄσκομαι, ici au sens de garder en mémoire les actes subis.
- source_word: πάντων τῶν κακῶν
  choice: de tous les torts
  rationale: Dans ce contexte relationnel, « torts » exprime les actes mauvais commis contre quelqu’un sans surcharger le texte d’une qualification métaphysique.
- source_word: συνετελέσαμεν πρὸς αὐτόν
  choice: que nous avons causés à lui
  rationale: Le verbe indique ici des torts accomplis ou infligés envers la personne; « causés à » conserve l’idée d’un préjudice tout en restant intelligible.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Traduction directe, qui laisse ouverte la portée familiale, politique ou communautaire du terme.
- source_word: τὸ ἔθνος αὐτοῦ
  choice: son peuple
  rationale: Dans le contexte de 1 Maccabées, ἔθνος désigne le peuple auquel il appartient; « peuple » est plus naturel ici que « nation » en français moderne.
