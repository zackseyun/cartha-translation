  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: fr
  text: Je renonce aussi à mon autorité sur la citadelle de Jérusalem[a] et je donne cette autorité au grand prêtre, afin qu’il y établisse des hommes qu’il choisira lui-même pour la garder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Acra de Jérusalem », selon la translittération traditionnelle du nom de cette place forte.'
    reason: Alternative lexicale et historique pour ἄκρα.
lexical_decisions:
- source_word: ἀφίημι
  choice: Je renonce aussi à
  rationale: Dans ce contexte administratif, le verbe exprime l’abandon d’un droit ou d’une autorité, non le pardon. « Renoncer à » est naturel en français et convient à la cession qui suit.
- source_word: ἐξουσίαν
  choice: mon autorité sur
  rationale: Le terme désigne ici le droit d’exercer le pouvoir sur la citadelle. Le possessif explicite naturellement en français l’autorité que le locuteur abandonne, sans ajouter une idée étrangère au contexte.
- source_word: ἄκρας
  choice: la citadelle
  rationale: Le mot désigne la place forte de Jérusalem. « Citadelle » rend clairement le sens dans le texte principal, tandis que la translittération historique est signalée en note.
- source_word: δίδωμι
  choice: je la donne
  rationale: Le verbe exprime directement le transfert de la citadelle, ou de l’autorité sur elle, au grand prêtre. Le féminin « la » reprend naturellement « la citadelle ».
- source_word: ἀρχιερεῖ
  choice: au grand prêtre
  rationale: « Grand prêtre » est l’équivalent français courant dans le contexte religieux et politique juif.
- source_word: ὅπως ἂν καταστῇ
  choice: afin qu’il y établisse
  rationale: καθίστημι signifie ici placer ou installer des hommes dans une fonction ou un poste. « Établir » conserve cette nuance sans préciser indûment qu’il s’agit d’une nomination administrative ou d’un déploiement militaire.
- source_word: ἄνδρας
  choice: les hommes
  rationale: Le grec emploie explicitement le pluriel masculin et le contexte évoque les hommes chargés de tenir et de garder la forteresse.
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: qu’il choisira lui-même
  rationale: Le futur français convient à l’action envisagée, et « lui-même » préserve l’insistance de αὐτός sur la liberté personnelle de choix du grand prêtre.
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: pour la garder
  rationale: L’infinitif exprime le but de leur établissement dans la citadelle. « Garder » restitue sobrement la fonction de protection militaire.
theological_decisions:
- issue: Traduire ἄκρα comme nom commun ou le translittérer comme désignation historique
  choice: la citadelle
  alternative: l’Acra
  rationale: Le nom commun communique immédiatement la nature du lieu à un lectorat moderne. La note conserve la possibilité de reconnaître dans le terme la désignation historique traditionnelle de la forteresse de Jérusalem.
- issue: Référent du pronom dans « je la donne »
  choice: la citadelle
  alternative: l’autorité sur la citadelle
  rationale: Le féminin grec αὐτήν renvoie formellement à ἄκρας, « citadelle », mais l’acte décrit implique aussi le transfert de son contrôle. La traduction garde le référent grammatical sans développer ou résoudre davantage cette relation.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve le ton d’un décret royal et l’insistance sur le choix personnel du grand prêtre, tout en évitant un calque lourd de la syntaxe grecque.
