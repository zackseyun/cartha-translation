  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: fr
  text: Le roi lui rendit honneur, l’inscrivit parmi les Premiers Amis[a] et le nomma général et gouverneur de district[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « Premiers Amis » désignait probablement un rang officiel à la cour royale. On pourrait aussi traduire : « parmi les principaux amis du roi ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne le responsable administratif d’une division territoriale.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  choice: lui rendit honneur
  rationale: Dans ce contexte politique et royal, le verbe désigne l’honneur ou la distinction accordés à quelqu’un, sans la connotation théologique que pourrait suggérer « glorifier ».
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: l’inscrivit parmi les Premiers Amis
  rationale: Le verbe γράφω évoque ici l’inscription officielle à un rang. « Premiers Amis » conserve au plus près ce qui semble être un titre de cour, tout en restant intelligible en français.
- source_word: τῶν πρώτων φίλων
  choice: les Premiers Amis
  rationale: L’expression semble désigner une catégorie officielle de dignitaires proches du roi. Les majuscules signalent prudemment cet emploi titulaire sans en préciser excessivement le statut.
- source_word: στρατηγὸν
  choice: général
  rationale: Le sens militaire convient au contexte et distingue cette charge de la fonction administrative mentionnée ensuite.
- source_word: μεριδάρχην
  choice: gouverneur de district
  rationale: Le terme désigne le dirigeant d’une division territoriale. Cette formulation explicite la fonction sans imposer une équivalence administrative moderne trop précise.
