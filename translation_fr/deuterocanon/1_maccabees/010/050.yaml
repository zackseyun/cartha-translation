lexical_decisions:
- source_word: ἐστερέωσεν πόλεμον σφόδρα
  choice: Le combat fit rage
  rationale: Dans ce contexte militaire, l’expression décrit un combat qui se poursuit avec une grande intensité. « Fit rage » restitue naturellement en français la force de σφόδρα sans calquer la tournure grecque.
- source_word: ἕως ἔδυ ὁ ἥλιος
  choice: jusqu’au coucher du soleil
  rationale: Formulation française courante et fidèle à l’idée littérale que le soleil se coucha.
- source_word: ἔπεσεν
  choice: tomba
  rationale: Conserve le terme militaire sobre du grec, qui signifie ici que Démétrios fut tué au combat, sans expliciter davantage que la source.
- source_word: ὁ Δημήτριος
  choice: Démétrios
  rationale: Translittération française moderne du nom grec Δημήτριος.
