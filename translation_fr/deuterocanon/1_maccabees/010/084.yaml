  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: fr
  text: Jonathan incendia Azôtos[a] et les villes des alentours, et il s’empara de leur butin ; il incendia aussi le sanctuaire de Dagon et son sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azôtos est la forme grecque du nom de la ville appelée Ashdod dans la tradition hébraïque.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec répète « sanctuaire » : littéralement, « le sanctuaire de Dagon et son sanctuaire ». Le pronom grec est féminin et peut renvoyer à Azôtos, c’est-à-dire à la ville ; la formulation inhabituelle est conservée sans la remplacer par « ses sanctuaires ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: incendia / livra aux flammes
  rationale: Le verbe signifie « mettre le feu à, incendier ». Deux formulations françaises naturelles rendent ses deux occurrences sans en changer le sens.
- source_word: Ἄζωτον
  choice: Azôtos
  rationale: Translittération française de la forme grecque Ἄζωτος, plutôt que substitution de la forme hébraïque plus connue, Ashdod.
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: les villes des alentours
  rationale: κύκλῳ avec le génitif exprime ici la situation autour d’Azôtos.
- source_word: τὰ σκῦλα αὐτῶν
  choice: leur butin
  rationale: σκῦλα désigne les dépouilles ou le butin pris à la guerre; le possessif rend αὐτῶν.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: le sanctuaire de Dagon
  rationale: ἱερόν peut désigner le temple ou l’enceinte sacrée; « sanctuaire » convient au contexte tout en évitant de préciser indûment l’étendue du lieu.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: le sanctuaire de la ville
  rationale: Le grec répète ἱερόν et emploie un pronom féminin qui renvoie naturellement à Azôtos, la ville. La répétition est conservée plutôt que corrigée ou transformée en pluriel.
- source_word: ἐν πυρί
  choice: aux flammes
  rationale: Expression française idiomatique qui rend la valeur instrumentale et emphatique de « par/avec le feu ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique. « Quant à » clarifie la reprise syntaxique sans effacer la répétition inhabituelle du grec; « le sanctuaire de la ville » explicite seulement le référent grammatical probable d’αὐτῆς, tandis que la note maintient l’ambiguïté formelle.
