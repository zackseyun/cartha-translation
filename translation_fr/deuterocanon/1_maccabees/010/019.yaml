lexical_decisions:
- source_word: Ἰωνάθαν
  choice: Jonathan
  rationale: Translittération française usuelle du nom propre, sans chercher à le traduire.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans une formule épistolaire, l’infinitif χαίρειν sert de salutation conventionnelle ; « salut ! » en restitue naturellement la fonction.
- source_word: ἀκηκόαμεν
  choice: nous avons entendu dire
  rationale: Le parfait exprime un renseignement reçu dont l’effet demeure présent ; cette tournure est naturelle en français dans ce contexte.
- source_word: περὶ σοῦ
  choice: à ton sujet
  rationale: Rend directement la préposition περὶ suivie du génitif, dans un registre courant et digne.
- source_word: ἀνὴρ ἀγαθὸς ἰσχύϊ
  choice: un homme remarquable par ta force
  rationale: Le datif ἰσχύϊ précise sous quel rapport Jonathan est qualifié d’ἀγαθός. Cette formulation française conserve l’évaluation positive sans réduire ἀγαθός à la seule bonté morale ni transformer la locution en simple adjectif « fort ».
- source_word: καὶ
  choice: et
  rationale: La conjonction est conservée à la fin afin de représenter fidèlement le caractère incomplet de l’extrait grec fourni.
