  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: fr
  text: La cavalerie fut dispersée dans la plaine. Ils s’enfuirent à Azot et entrèrent dans Beth-Dagon, le sanctuaire de leur idole[a], pour être sauvés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Beth-Dagon, leur idole ». L’apposition grecque est très resserrée ; le sens paraît être qu’ils entrèrent dans le sanctuaire associé à leur idole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: la cavalerie
  rationale: Le singulier grec a ici un sens collectif militaire et désigne les troupes montées.
- source_word: ἐσκορπίσθη
  choice: fut dispersée
  rationale: Le passif décrit la débandade et la dispersion de la force montée sur le champ de bataille.
- source_word: ἐν τῷ πεδίῳ
  choice: dans la plaine
  rationale: πεδίον désigne naturellement une étendue de terrain plat et découvert.
- source_word: ἔφυγον εἰς Ἄζωτον
  choice: ils s’enfuirent à Azôt
  rationale: Le pluriel reprend naturellement les membres de la cavalerie dispersée; «Azôt» transcrit la forme grecque traditionnelle en français.
- source_word: Βηθδαγὼν
  choice: Beth-Dagôn
  rationale: Le nom propre est transcrit, tandis que l’apposition suivante en précise la fonction cultuelle.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: le sanctuaire de leur idole
  rationale: Littéralement, le grec dit «leur idole», mais le contexte indique un lieu dans lequel ils entrent. Cette formulation rend explicite le sanctuaire sans effacer la valeur négative de εἴδωλον.
- source_word: τοῦ σωθῆναι
  choice: afin de se sauver
  rationale: 'L’infinitif grec articulé exprime le but: ils cherchent refuge et délivrance.'
theological_decisions:
- issue: Sens de εἴδωλον dans l’apposition à Beth-Dagôn
  choice: le sanctuaire de leur idole
  alternative: leur idole
  rationale: Le terme grec porte un jugement négatif en qualifiant Dagôn d’idole, mais l’action d’entrer requiert contextuellement un lieu cultuel. Le texte principal explicite ce lieu, et la note conserve la formulation grecque resserrée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique. La syntaxe collective passe naturellement de «la cavalerie» au pronom pluriel «ils», qui vise les cavaliers.
