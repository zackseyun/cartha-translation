  source_fidelity: '« La cavalerie » rend correctement le collectif ἡ ἵππος, et « fut dispersée dans la plaine » reflète bien le passif ἐσκορπίσθη ἐν τῷ πεδίῳ. La destination d’ἔφυγον εἰς Ἄζωτον et l’entrée dans Beth-Dagon sont conservées. En revanche, τοῦ σωθῆναι est un infinitif aoriste passif : « afin de se sauver » est possible idiomatiquement, mais « pour être sauvés » reproduit plus exactement le sens de recherche de salut/protection sans suggérer inutilement qu’ils se sauvent par leurs propres moyens.'
