base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: fr
  text: 'Et voici ce qui arriva : quand ceux qui le rencontrèrent virent sa splendeur[a], telle qu’elle avait été proclamée, et qu’il était vêtu de lin[b], ils prirent tous la fuite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa gloire ». Dans ce contexte, le grec désigne probablement une magnificence royale visible plutôt qu’une gloire au sens spécifiquement théologique.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « vêtu de lin » ; le terme peut désigner une étoffe ou un vêtement de lin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 'Et voici ce qui arriva : quand'
  rationale: Rend la transition narrative et la valeur temporelle de la formule grecque dans un français naturel et digne.
- source_word: οἱ ἐντυγχάνοντες
  choice: ceux qui le rencontraient
  rationale: Le participe désigne les personnes qui entraient en contact avec lui; le pronom « le » est fourni par le contexte.
- source_word: τὴν δόξαν αὐτοῦ
  choice: sa splendeur
  rationale: Dans ce contexte royal et public, δόξα évoque vraisemblablement une magnificence visible, tout en pouvant aussi se rendre par « gloire ».
- source_word: καθὼς ἐκήρυξεν
  choice: telle qu’elle avait été proclamée
  rationale: Le verbe exprime une proclamation publique; cette tournure conserve l’impersonnalité du grec, dont le sujet n’est pas exprimé.
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: qu’il était vêtu de lin
  rationale: περιβάλλω indique ici le fait d’être vêtu ou enveloppé, et σινδών désigne une étoffe ou un vêtement de lin.
- source_word: ἔφυγον πάντες
  choice: ils prirent tous la fuite
  rationale: Rend clairement la force de l’aoriste ἔφυγον et la totalité exprimée par πάντες.
theological_decisions:
- issue: Portée de δόξα
  choice: splendeur
  alternative: gloire
  rationale: Le cadre paraît viser l’apparat royal visible plutôt qu’un sens expressément théologique, mais la note préserve l’autre traduction légitime.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « Et voici ce qui arriva » conserve la solennité de l’enchaînement grec sans produire un calque trop lourd.
