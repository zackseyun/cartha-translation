  yaml_path: translation/deuterocanon/1_maccabees/010/003.yaml
  text: And Demetrius sent letters to Jonathan with peaceful words[b][a], so as to honor him.
translation:
  language: fr
  text: Démétrios envoya à Jonathan des lettres rédigées en termes pacifiques, afin de l’honorer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le rendre grand », c’est-à-dire rehausser son rang ou son prestige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste de ἀποστέλλω exprime simplement l’envoi; « envoya » convient naturellement au contexte épistolaire.
- source_word: ἐπιστολὰς
  choice: des lettres
  rationale: L’accusatif pluriel désigne plusieurs lettres ou communications écrites; le pluriel est conservé.
- source_word: λόγοις εἰρηνικοῖς
  choice: rédigées en termes pacifiques
  rationale: Le datif décrit la teneur ou le ton des lettres. Cette formulation française naturelle conserve l’idée explicite de paroles conciliantes sans réduire la phrase à une simple salutation.
- source_word: ὥστε
  choice: afin de
  rationale: Dans ce contexte, ὥστε avec l’infinitif présente vraisemblablement le but recherché par Démétrios, tout en pouvant aussi suggérer le résultat visé.
- source_word: μεγαλῦναι
  choice: l’honorer
  rationale: Le verbe signifie littéralement « rendre grand »; dans ce contexte politique, il s’agit de conférer à Jonathan de l’honneur ou de rehausser son rang. Une note préserve le sens littéral.
- source_word: Ἰωναθὰν
  choice: Jonathan
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: Δημήτριος
  choice: Démétrios
  rationale: Translittération française usuelle du nom grec, adaptée à un registre biblique moderne.
