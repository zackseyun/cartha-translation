  text: 'so that they may be with me as help. And King Demetrius sent to the nation of the Jews, according to these words: Greetings.'
translation:
  language: fr
  text: 'afin qu’ils soient avec moi pour m’aider. Et le roi Démétrios fit parvenir au peuple juif le message suivant : « Salutations ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως ὦσιν σὺν ἐμοὶ εἰς βοήθειαν
  choice: afin qu’ils soient à mes côtés pour me venir en aide
  rationale: Rend la finalité de ὅπως et l’idée de soutien exprimée par σὺν ἐμοὶ εἰς βοήθειαν dans un français naturel, sans réduire la formule à une simple présence.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: au peuple juif
  rationale: Dans ce contexte politique et collectif, ἔθνος désigne le peuple ou la nation; « peuple juif » est idiomatique et fidèle.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: une lettre ainsi rédigée
  rationale: La formule introduit le contenu du message envoyé. L’ajout explicatif « une lettre » est naturellement impliqué par ἀπέστειλεν αὐτοῖς et évite une tournure française pesante.
- source_word: χαίρειν
  choice: Salutations !
  rationale: Formule épistolaire grecque conventionnelle ouvrant une lettre; « Salutations ! » en conserve la fonction et la concision.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom Δημήτριος est transcrit « Démétrios », au plus près de la forme grecque. La ponctuation française présente clairement la formule d’ouverture de la lettre.
