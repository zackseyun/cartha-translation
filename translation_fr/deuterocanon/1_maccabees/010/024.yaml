  text: I too will write to them words of encouragement and honor and gifts,[a]
translation:
  language: fr
  text: Moi aussi, je leur écrirai des paroles d’encouragement et d’honneur, et je leur ferai des dons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des paroles d’encouragement, d’élévation et de dons ». Le mot grec rendu par « honneur » signifie proprement « hauteur » ou « élévation » et peut évoquer une marque d’honneur ou une promotion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψω
  choice: je leur écrirai
  rationale: Le futur actif de γράφω exprime directement l’intention du locuteur; le pronom datif αὐτοῖς est naturellement placé devant le verbe en français.
- source_word: κἀγώ
  choice: moi aussi
  rationale: La crase de καί et ἐγώ porte une valeur additive et emphatique, bien rendue par « moi aussi ».
- source_word: λόγους παρακλήσεως
  choice: des paroles d’encouragement
  rationale: λόγους désigne ici le contenu écrit, tandis que παράκλησις peut évoquer encouragement, exhortation ou appel; dans ce contexte diplomatique, « encouragement » garde une tonalité favorable sans préciser excessivement.
- source_word: ὕψους
  choice: d’honneur
  rationale: Le nom signifie littéralement « hauteur, élévation »; dans un échange royal et politique, il peut désigner l’honneur ou l’élévation de rang. « Honneur » est naturel, tandis qu’une note conserve l’image littérale et l’autre possibilité.
- source_word: δομάτων
  choice: de promesse de dons
  rationale: δόματα désigne des dons. Comme ces dons font partie du contenu de ce qui sera écrit, « promesse de dons » explicite en français la relation implicite sans affirmer qu’ils sont déjà remis.
