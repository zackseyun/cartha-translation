  text: And King Demetrius heard, and he gathered very many forces, and went out to meet him in battle.
translation:
  language: fr
  text: Le roi Démétrios l’apprit. Il rassembla des forces très nombreuses et partit à sa rencontre pour le combattre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans ce contexte, le verbe introduit la réaction de Démétrios à une nouvelle rapportée au verset précédent. « L’apprit » est plus naturel en français que le calque « entendit », tout en restant fidèle au sens.
- source_word: συνήγαγεν
  choice: rassembla
  rationale: Le verbe désigne l’action de réunir des hommes; « rassembla » en conserve le sens fondamental sans préciser davantage l’organisation militaire.
- source_word: δυνάμεις
  choice: des forces
  rationale: Dans ce contexte militaire, le pluriel désigne des forces armées. « Des forces » respecte le nombre et demeure moins restrictif que « une armée ».
- source_word: πολλὰς σφόδρα
  choice: très nombreuses
  rationale: Cette formulation rend l’intensification de la quantité exprimée par σφόδρα avec πολλὰς dans un français clair et naturel.
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Le grec signifie littéralement « sortit ». Dans ce récit de mouvement militaire, « partit » restitue naturellement l’idée sans ajouter explicitement celle d’une marche.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: La locution exprime le fait d’aller rencontrer quelqu’un. Le caractère hostile est fourni par la proposition finale.
- source_word: εἰς πόλεμον
  choice: pour le combattre
  rationale: Le second εἰς indique ici la visée guerrière de la rencontre. « Pour le combattre » est idiomatique et rend clairement cette finalité sans amplifier le texte.
