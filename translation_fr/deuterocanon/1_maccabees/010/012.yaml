  text: And the foreigners who were in the strongholds that Bacchides had built fled.
translation:
  language: fr
  text: Et les étrangers qui se trouvaient dans les forteresses bâties par Bacchidès prirent la fuite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: prirent la fuite
  rationale: L’aoriste de φεύγω exprime ici une fuite ponctuelle. « Prirent la fuite » est naturel en français narratif et ne précise pas, au-delà du grec, s’il s’agit d’une déroute ou d’une évasion.
- source_word: ἀλλογενεῖς
  choice: les étrangers
  rationale: Le terme désigne des personnes appartenant à un autre peuple. « Les étrangers » conserve ce sens ethnique et politique sans introduire les connotations théologiques possibles de « les païens ».
- source_word: ὀχυρώμασιν
  choice: les forteresses
  rationale: Le mot désigne des positions fortifiées. « Forteresses » est clair, courant et approprié au contexte militaire.
- source_word: οἷς οἰκοδόμησεν
  choice: bâties par Bacchidès
  rationale: La relative grecque se rapporte aux forteresses. La tournure participiale française indique naturellement que leur construction par Bacchidès est antérieure à la fuite.
- source_word: Βακχίδης
  choice: Bacchidès
  rationale: Cette forme francisée est l’usage traditionnel et standard en français pour le nom grec Βακχίδης.
