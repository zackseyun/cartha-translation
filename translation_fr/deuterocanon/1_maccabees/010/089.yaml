  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: fr
  text: Il lui envoya une agrafe en or, comme il est d’usage d’en donner aux membres de la famille des rois, et il lui donna Akkarôn[a] ainsi que tout son territoire en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akkarôn est la forme grecque du nom de lieu plus couramment connu, d’après l’hébreu, sous le nom d’Éqrôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: une agrafe en or
  rationale: πόρπη désigne une agrafe, une broche ou un ornement servant à attacher. « Agrafe en or » reste concret sans préciser indûment la forme exacte de l’objet.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: comme il est d’usage d’en donner
  rationale: Cette formulation rend naturellement l’idée d’une coutume établie tout en conservant la construction impersonnelle du grec.
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: aux parents des rois
  rationale: Le pluriel grec désigne littéralement les parents ou proches apparentés des rois. La traduction conserve ce pluriel général sans le réduire à la parenté d’un seul roi.
- source_word: Ἀκκαρὼν
  choice: Akkarôn
  rationale: Cette translittération suit directement la forme grecque du toponyme, avec une graphie lisible en français.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: tout son territoire
  rationale: ὅρια signifie littéralement les limites et, par extension, le territoire qu’elles délimitent. Ici, « tout son territoire » exprime clairement le don de la ville avec l’ensemble de ses dépendances.
- source_word: εἰς κληρονομίαν
  choice: en héritage
  rationale: Cette expression conserve la nuance juridique et dynastique de κληρονομία dans une formulation française naturelle.
