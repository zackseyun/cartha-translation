revisions:
- from: Il lui envoya aussi une agrafe en or, comme il est d’usage d’en donner aux parents des rois, et il lui donna Akkarôn[a] ainsi que tout son territoire en héritage.
  to: Il lui envoya une agrafe en or, comme il est d’usage d’en donner aux membres de la famille des rois, et il lui donna Akkarôn[a] ainsi que tout son territoire en héritage.
  rationale: La révision remplace « parents » par une expression française non ambiguë qui couvre la parenté au sens large de συγγενεῖς, et supprime l’additif non exprimé « aussi ». Le reste du texte et la note sont conservés, car ils rendent adéquatement le grec et sont naturels en français moderne.
