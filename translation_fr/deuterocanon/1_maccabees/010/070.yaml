base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: fr
  text: 'Il envoya dire à Jonathan, le grand prêtre : « Toi seul, tu t’élèves contre nous, tandis que, par ta faute, je suis devenu un objet de risée et d’opprobre. Pourquoi donc exerces-tu ton autorité sur nous dans les montagnes[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la région montagneuse »; le grec peut désigner les montagnes ou, plus largement, le pays des collines.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς
  choice: Il envoya dire à
  rationale: Cette tournure française exprime naturellement l’envoi d’un message sans préciser, au-delà du grec, s’il fut transmis par lettre ou par messager.
- source_word: τὸν ἀρχιερέα
  choice: le grand prêtre
  rationale: « Grand prêtre » est le titre usuel en français pour ἀρχιερεύς dans le contexte juif.
- source_word: μονώτατος
  choice: Toi seul
  rationale: Le superlatif souligne ici l’exclusivité; « toi seul » en restitue clairement l’insistance.
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: tu t’élèves contre nous
  rationale: La formulation conserve à la fois l’image de l’élévation de soi et l’orientation hostile marquée par ἐπί.
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: je suis devenu un objet de risée et d’opprobre
  rationale: Cette traduction maintient les deux notions coordonnées de moquerie publique et de déshonneur dans un registre digne.
- source_word: διὰ σέ
  choice: par ta faute
  rationale: Dans cette accusation directe, la tournure rend clairement la cause imputée à Jonathan; « à cause de toi » resterait également possible.
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: exerces-tu ton autorité sur nous
  rationale: Cette expression rend précisément l’exercice d’un pouvoir sans renforcer arbitrairement le sens en « dominer ».
- source_word: ἐν τοῖς ὄρεσιν
  choice: dans les montagnes
  rationale: Traduction directe de ὄρη; selon la géographie visée, le terme peut aussi désigner la région montagneuse ou les collines.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours accusateur reste direct. La répétition de « nous » est conservée, et l’ambiguïté entre élévation orgueilleuse et soulèvement hostile demeure dans « tu t’élèves contre nous ».
