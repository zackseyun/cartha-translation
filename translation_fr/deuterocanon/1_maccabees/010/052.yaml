base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: fr
  text: Après être revenu dans mon royaume, je me suis assis sur le trône de mes pères[a], j’ai pris le pouvoir, j’ai écrasé Démétrios et je me suis rendu maître de notre pays,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trône de mes ancêtres ». Le grec dit littéralement « le trône de mes pères », expression dynastique.
    reason: Alternative lexicale et explicitation de l’idiome dynastique.
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Après
  rationale: La conjonction introduit ici les circonstances antérieures sur lesquelles s’appuie la suite de la lettre. Avec l’infinitif passé, « Après être revenu » exprime naturellement cette relation temporelle sans exclure sa portée circonstancielle.
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: être revenu dans mon royaume
  rationale: Le verbe indique un retour, et βασιλεία désigne ici le domaine royal. « Royaume » convient au cadre politique sans réduire le terme à l’exercice abstrait de la royauté.
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: je me suis assis sur le trône de mes pères
  rationale: La formulation conserve l’image concrète et dynastique du grec ainsi que la référence masculine explicite à la lignée royale.
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: j’ai pris le pouvoir
  rationale: κρατέω avec le génitif exprime la prise ou la maîtrise de l’autorité. « Prendre le pouvoir » est idiomatique en français moderne et ne précise pas indûment si cette accession était légitime ou usurpée.
- source_word: συνέτριψα τὸν Δημήτριον
  choice: j’ai écrasé Démétrios
  rationale: « Écraser » garde la vigueur martiale de συντρίβω. La forme « Démétrios » translittère directement le nom grec.
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: je me suis rendu maître de notre pays
  rationale: Le verbe marque l’établissement d’une domination effective. Cette tournure distingue élégamment cette maîtrise territoriale de la prise du pouvoir déjà exprimée, tandis que « pays » rend χώρα dans un français naturel.
theological_decisions:
- issue: Expression dynastique πατέρων μου
  choice: mes pères
  alternative: mes ancêtres
  rationale: Le grec dit littéralement « mes pères ». Cette expression dynastique souligne la succession par la lignée royale; la conserver évite d’effacer la forme et la portée historique du texte.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase reste ouverte par une virgule parce que le verset constitue la protase circonstancielle de la déclaration poursuivie au verset suivant. Le parallélisme des actions royales est conservé sans lourdeur excessive.
