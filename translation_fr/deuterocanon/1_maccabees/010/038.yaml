base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: fr
  text: Et que les trois districts[a] ajoutés à la Judée du territoire de Samarie soient rattachés à la Judée, afin d’être considérés comme ne formant qu’une seule entité[b], et afin de n’obéir à aucune autre autorité qu’à celle du grand prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nomes », terme administratif hellénistique désignant des districts.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devenir sous un seul », c’est-à-dire être considérés comme une seule unité administrative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: districts
  rationale: Dans le contexte administratif hellénistique, νόμος désigne ici une circonscription territoriale, non une loi. « Districts » est clair en français moderne, tandis que le terme technique « nomes » est signalé en note.
- source_word: προστεθέντας / προστεθήτω
  choice: ajoutés / qu’ils soient rattachés
  rationale: La répétition de προστίθημι est conservée tout en distinguant naturellement l’état antérieur (« ajoutés ») de l’ordre officiel (« soient rattachés »).
- source_word: χώρας
  choice: territoire
  rationale: Dans ce décret, χώρα désigne le domaine territorial de la Samarie; « territoire » convient mieux au cadre administratif que « pays ».
- source_word: πρὸς τὸ λογισθῆναι
  choice: afin d’être considérés
  rationale: Cette tournure rend la finalité et la nuance administrative de λογίζομαι sans lourdeur excessive.
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: comme ne formant qu’une seule entité
  rationale: La formule grecque est condensée, littéralement « devenir sous un seul ». Le choix exprime l’unification administrative sans préciser indûment l’identité de cet « un »; la forme littérale est conservée en note.
- source_word: ὑπακοῦσαι
  choice: n’obéir
  rationale: « Obéir » rend directement ὑπακούω et convient au langage d’un décret portant sur la juridiction.
- source_word: ἄλλης ἐξουσίας
  choice: aucune autre autorité
  rationale: ἐξουσία peut désigner le pouvoir ou la juridiction; « autorité » préserve ici l’étendue du terme grec.
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: qu’à celle du grand prêtre
  rationale: La reprise « celle » indique clairement que le génitif renvoie à l’autorité du grand prêtre, conformément au contexte syntaxique et administratif.
theological_decisions:
- issue: Nature du rôle du grand prêtre dans le décret
  choice: Présenter son rôle comme une autorité juridictionnelle dans le cadre administratif du décret.
  alternative: Comprendre la phrase comme une soumission religieuse et civile globale au grand prêtre.
  rationale: Le contexte porte sur le rattachement de territoires et l’autorité à laquelle ils doivent obéir. La traduction n’étend donc pas la portée du texte au-delà de ce que le décret affirme explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton juridique du décret, la répétition du rattachement territorial et l’ambiguïté de la formule grecque sur l’unité administrative.
