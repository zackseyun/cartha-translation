revisions:
- from: Quant aux trois districts[a] ajoutés à la Judée à partir du territoire de la Samarie, qu’ils soient rattachés à la Judée, afin d’être considérés comme ne formant qu’une seule entité[b] et de n’obéir à aucune autre autorité qu’à celle du grand prêtre.
  to: Et que les trois districts[a] ajoutés à la Judée du territoire de Samarie soient rattachés à la Judée, afin d’être considérés comme ne formant qu’une seule entité[b], et afin de n’obéir à aucune autre autorité qu’à celle du grand prêtre.
  rationale: La révision améliore la fidélité syntaxique en faisant ressortir les deux finalités du grec, tout en conservant les choix lexicaux administratifs du projet et l’ambiguïté relative de la formule « sous un seul » dans la note. Aucun changement théologique ou interprétatif n’est introduit.
