review_pass:
  verdict: revise
  source_fidelity: Le sens territorial et juridictionnel est globalement bien rendu. Toutefois, le grec enchaîne deux constructions finales (πρὸς τὸ ... , τοῦ μὴ ...), que la version française coordonne de façon moins nette. La révision rétablit explicitement la seconde finalité sans trancher davantage la formule condensée ὑφʼ ἕνα.
  naturalness: « Quant aux » alourdit inutilement l’énoncé décrétal, et « à partir du territoire de la Samarie » est moins idiomatique ici que « du territoire de Samarie ». La phrase révisée conserve un français moderne, administratif et lisible.
  terminology: « Districts », « territoire », « autorité » et « grand prêtre » conviennent. « Comme une seule entité » reste une explicitation administrative prudente; la note conserve la difficulté de la formule grecque.
  issues:
  - severity: low
    issue: La seconde proposition finale grecque n’est pas explicitement reprise comme telle.
    rationale: Le grec distingue πρὸς τὸ λογισθῆναι ... et τοῦ μὴ ὑπακοῦσαι. Ajouter « et afin de » reflète plus clairement cette structure et évite une coordination française légèrement heurtée entre un infinitif passif et un infinitif actif.
  - severity: low
    issue: Formulation introductive et territoriale un peu lourde.
    rationale: « Et que » correspond plus directement au style du décret, et « du territoire de Samarie » est plus naturel que « à partir du territoire de la Samarie », sans changement de sens.
  revised_text: Et que les trois districts[a] ajoutés à la Judée du territoire de Samarie soient rattachés à la Judée, afin d’être considérés comme ne formant qu’une seule entité[b], et afin de n’obéir à aucune autre autorité qu’à celle du grand prêtre.
