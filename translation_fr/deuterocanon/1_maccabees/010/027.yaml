  text: We rejoiced[a]. And now continue still to keep faith with us,
translation:
  language: fr
  text: Nous nous en sommes réjouis. Et maintenant, continuez à nous être fidèles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐχάρημεν
  choice: Nous nous en sommes réjouis
  rationale: L’aoriste de χαίρω exprime ici la joie éprouvée à la suite de ce qui précède. Le pronom « en » assure en français le lien contextuel sans préciser davantage l’objet absent de l’extrait.
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Cette formulation conserve simplement la progression épistolaire marquée par la conjonction et l’adverbe temporel.
- source_word: ἐμείνατε ἔτι
  choice: continuez à rester
  rationale: L’impératif de μένω, renforcé par ἔτι, appelle à prolonger une attitude déjà manifestée. « Continuez à rester » restitue les deux éléments sans lourdeur excessive.
- source_word: τοῦ συντηρῆσαι
  choice: à rester
  rationale: 'L’infinitif articularisé précise ici en quoi doit consister la persévérance : préserver durablement la fidélité. En français, cette idée s’intègre naturellement dans « rester fidèles » plutôt que par un calque nominal.'
- source_word: πρὸς ἡμᾶς
  choice: envers nous
  rationale: Dans ce contexte relationnel et politique, πρός marque l’orientation de la fidélité à l’égard du locuteur.
- source_word: πίστιν
  choice: fidèles
  rationale: Dans une correspondance diplomatique, πίστις désigne la fidélité ou la loyauté plutôt que la foi-croyance. La transposition adjectivale « rester fidèles » est naturelle et exacte en français.
theological_decisions:
- issue: Sens de πίστιν dans un contexte politique et diplomatique
  choice: fidèles
  alternative: gardez foi avec nous ; demeurez loyaux envers nous
  rationale: Le contexte réclame le sens relationnel de fidélité à un engagement. Traduire par « foi » risquerait en français moderne de suggérer indûment la croyance religieuse, tandis que « loyaux » explicite davantage la dimension politique. « Fidèles » préserve mieux l’étendue du terme grec.
translation_notes:
  register: Français moderne, digne et accessible, adapté au ton d’une lettre officielle. La formulation évite le calque peu idiomatique « conserver la foi envers nous » tout en maintenant l’idée de fidélité durable.
