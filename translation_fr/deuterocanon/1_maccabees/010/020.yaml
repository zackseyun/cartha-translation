  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: fr
  text: Et maintenant, nous t’avons établi aujourd’hui grand prêtre de ta nation, avec le titre d’« Ami du roi »[a] — et ils lui envoyèrent[b] un vêtement de pourpre et une couronne d’or —, pour prendre notre parti[c] et conserver l’amitié avec nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ami du roi ». L’expression grecque peut correspondre à un titre officiel de la cour hellénistique.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec passe ici du discours royal à la première personne (« nous t’avons établi ») à une narration à la troisième personne (« ils lui envoyèrent »). La traduction conserve ce changement.
    reason: textual_shift
  - marker: c
    text: Littéralement « penser ce qui est à nous »; l’expression signifie favoriser nos intérêts ou soutenir notre camp.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: nous t’avons établi
  rationale: Le parfait de καθίστημι désigne ici l’installation officielle dans une charge. « Établi » conserve la solennité de la formule royale, tandis que « grand prêtre » précise naturellement la fonction conférée.
- source_word: ἀρχιερέα
  choice: grand prêtre
  rationale: C’est le titre français usuel et précis pour la charge religieuse juive visée dans ce contexte.
- source_word: τοῦ ἔθνους σου
  choice: de ta nation
  rationale: ἔθνος désigne ici le corps national juif dans sa dimension collective et politique; « nation » préserve mieux cette portée que le terme plus général « peuple ».
- source_word: φίλον βασιλέως καλεῖσθαι
  choice: avec le titre d’« Ami du roi »
  rationale: Cette formulation française naturelle exprime à la fois l’idée d’être appelé ainsi et la probable valeur de titre honorifique à la cour hellénistique.
- source_word: πορφύραν
  choice: un vêtement de pourpre
  rationale: Le nom peut désigner la pourpre comme étoffe ou un habit de pourpre. « Vêtement » explicite sobrement l’objet envoyé sans préciser indûment sa forme.
- source_word: στέφανον χρυσοῦν
  choice: une couronne d’or
  rationale: Dans cette scène d’investiture, « couronne » rend clairement στέφανος, tandis que « d’or » suit de près l’adjectif grec.
- source_word: φρονεῖν τὰ ἡμῶν
  choice: prendre notre parti
  rationale: L’expression signifie littéralement penser ce qui est à nous, mais désigne idiomatiquement l’adhésion aux intérêts ou au camp du locuteur.
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: maintenir ton amitié avec nous
  rationale: Le groupe verbal évoque la préservation durable d’une relation diplomatique; cette formulation est fidèle et idiomatique en français.
- source_word: ἀπέστειλαν αὐτῷ
  choice: ils lui envoyèrent
  rationale: Le grec transmis passe à la troisième personne du pluriel. La traduction conserve ce changement de personne plutôt que de l’harmoniser avec le « nous » du discours royal.
theological_decisions:
- issue: Valeur de φίλον βασιλέως comme titre de cour
  choice: « Ami du roi », présenté explicitement comme un titre
  alternative: « ami du roi » au sens d’une relation personnelle
  rationale: Le contexte politique hellénistique favorise une fonction honorifique officielle. Les guillemets et la majuscule signalent cette valeur sans exclure entièrement le sens ordinaire des mots.
- issue: Changement de personne dans ἀπέστειλαν αὐτῷ
  choice: 'Maintien de la troisième personne: « ils lui envoyèrent »'
  alternative: 'Harmonisation avec le discours direct: « nous lui avons envoyé »'
  rationale: Le texte grec fourni passe effectivement de la première personne royale à une remarque narrative à la troisième personne. Le conserver respecte la texture et la tension du texte transmis.
- issue: Rapport syntaxique des infinitifs καλεῖσθαι, φρονεῖν et συντηρεῖν
  choice: Rendre le premier par une formule de titre et les deux derniers par une proposition de but introduite par « afin que »
  alternative: Conserver une série littérale d’infinitifs, au prix d’une construction française obscure
  rationale: La syntaxe grecque est abrupte. La formulation retenue rend la relation probable avec l’acte de nomination sans ajouter une condition explicite ni transformer l’énoncé en ordre direct.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve la forme d’une proclamation royale et son incise narrative inhabituelle. « Vêtement de pourpre » évite de préciser sans preuve qu’il s’agit d’une robe, et « Ami du roi » signale discrètement le vocabulaire officiel de cour.
