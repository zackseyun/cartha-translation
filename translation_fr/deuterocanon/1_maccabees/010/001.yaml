base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: fr
  text: En l’an cent soixante, Alexandre, fils d’Antiochos Épiphane, monta[a], s’empara de Ptolémaïs[b], et ils l’accueillirent ; il y devint roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mit en marche » ; le grec emploie littéralement « monta », tournure directionnelle courante qui peut désigner une avancée militaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « prit possession de Ptolémaïs ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il y régna » ; le verbe grec peut désigner soit l’accession à la royauté, soit l’exercice du règne.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: La cent soixantième année
  rationale: Rend naturellement la formule grecque de datation, littéralement « dans la soixantième et centième année ».
- source_word: ἀνέβη
  choice: monta
  rationale: Conserve l’image directionnelle conventionnelle de ἀναβαίνω, qui peut ici évoquer le déplacement ou l’avancée militaire sans l’expliciter davantage.
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: fils d’Antiochos Épiphane
  rationale: Le génitif articulé identifie idiomatiquement Alexandre par sa filiation; « Épiphane » est conservé comme épithète royale traditionnelle.
- source_word: κατελάβετο
  choice: s’empara de
  rationale: Exprime la prise de contrôle politique ou militaire indiquée par le moyen κατελάβετο, sans préciser les modalités de la prise.
- source_word: ἐπεδέξαντο αὐτόν
  choice: fut accueilli par ses habitants
  rationale: Le passif français évite un « ils » sans antécédent explicite; les habitants de Ptolémaïs sont les agents naturellement sous-entendus. « Accueilli » laisse place à la fois à l’accueil et à l’acceptation politique.
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: Il y devint roi
  rationale: Dans cette succession d’événements, l’aoriste peut marquer l’accession à la royauté. La note conserve aussi le sens possible d’exercice du règne.
