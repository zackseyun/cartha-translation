  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
translation:
  language: fr
  text: Ils se montrèrent favorables à Alexandre[a], parce qu’il était devenu pour eux l’initiateur de propositions de paix, et ils combattaient à ses côtés pendant tout ce temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils approuvèrent Alexandre ». Plus littéralement, la suite se lit : « il était devenu pour eux le chef de paroles de paix »; cette expression grecque condensée peut désigner celui qui prend l’initiative de négociations ou de propositions conciliantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: Ils approuvèrent Alexandre
  rationale: Dans cette construction, εὐδοκέω avec ἐν exprime une disposition favorable ou l’approbation envers une personne. « Approuvèrent Alexandre » est naturel et digne en français, sans calquer littéralement la préposition grecque.
- source_word: ἐγένετο
  choice: avait pris
  rationale: Associé à ἀρχηγός, le verbe exprime ici le fait qu’Alexandre s’est mis à jouer le rôle d’initiateur. Le plus-que-parfait convient à la cause antérieure introduite par ὅτι.
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  choice: avait pris pour eux l’initiative de propositions de paix
  rationale: La formule grecque, littéralement proche de « chef de paroles pacifiques », est condensée. Dans ce contexte diplomatique, elle présente Alexandre comme celui qui a engagé des démarches ou formulé des propositions de paix, tout en laissant l’alternative plus formelle en note.
- source_word: συνεμάχουν αὐτῷ
  choice: ils combattirent à ses côtés
  rationale: Le verbe composé désigne explicitement le fait de combattre avec quelqu’un comme allié; cette traduction conserve la dimension militaire.
- source_word: πάσας τὰς ἡμέρας
  choice: tout le temps
  rationale: L’expression idiomatique signifie pendant toute la période concernée. « Tout le temps » est clair en français moderne et évite le calque peu naturel « tous les jours ».
