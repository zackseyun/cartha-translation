base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: fr
  text: Certains d’entre eux seront affectés aux grandes forteresses du roi. Parmi eux, on désignera aussi des personnes dignes de confiance pour s’occuper des besoins du royaume[a]. Leurs responsables et leurs chefs seront choisis parmi eux, et ils vivront selon leurs propres lois[b], comme le roi l’a ordonné dans le pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour s’occuper des affaires du royaume ». Le terme grec peut désigner aussi bien des besoins que des affaires ou des tâches administratives.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ils marcheront selon leurs lois » : cette expression signifie qu’ils régleront leur conduite sur elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  choice: seront affectés / on désignera
  rationale: Dans ce contexte administratif et militaire, le verbe indique l’affectation à un poste ou la désignation pour une fonction. La variation française évite une répétition pesante sans changer le sens.
- source_word: ὀχυρώμασιν τοῖς μεγάλοις
  choice: aux grandes forteresses
  rationale: Le terme désigne des positions fortifiées; « forteresses » est naturel, précis et garde la portée militaire de l’expression.
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: pour s’occuper des besoins du royaume
  rationale: χρεῖαι peut désigner les besoins, les affaires ou les tâches administratives. Cette formulation reste proche du grec tout en étant idiomatique en français.
- source_word: οὖσιν εἰς πίστιν
  choice: des hommes dignes de confiance
  rationale: Dans ce cadre de service royal, πίστις exprime la fiabilité plutôt que la foi au sens théologique.
- source_word: οἱ ἐπʼ αὐτῶν
  choice: leurs responsables
  rationale: L’expression comprimée désigne ceux qui exercent une autorité sur les hommes précédemment mentionnés. « Responsables » conserve la relation hiérarchique sans la préciser excessivement.
- source_word: οἱ ἄρχοντες
  choice: leurs chefs
  rationale: ἄρχοντες désigne ici des autorités ou dirigeants. « Chefs » convient à la fois au contexte administratif et militaire.
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: ils vivront selon leurs propres lois
  rationale: Le grec emploie littéralement le verbe « aller/marcher » pour exprimer une conduite réglée par les lois. « Vivre selon » rend naturellement cet idiome.
- source_word: ἐν γῇ Ἰούδα
  choice: pour le pays de Juda
  rationale: La formulation garde l’expression géographique du grec. « Pour » rend naturellement en français la portée territoriale de l’ordre royal, exprimée en grec par ἐν.
theological_decisions:
- issue: Sens de πίστις dans l’expression οὖσιν εἰς πίστιν
  choice: dignes de confiance
  alternative: fidèles
  rationale: Le contexte porte sur l’aptitude à exercer des responsabilités royales. Il s’agit donc de fiabilité administrative, sans emploi théologique du vocabulaire de la foi.
translation_notes:
  register: Français international moderne, digne et accessible. Le style du décret royal est conservé sans tournures archaïques. Les formulations administratives restent assez larges pour préserver les ambiguïtés du grec.
