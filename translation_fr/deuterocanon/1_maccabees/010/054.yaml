  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: fr
  text: 'et établissons avec lui une relation d’amitié[a]. Maintenant, donne-moi ta fille pour femme : je deviendrai ainsi ton parent par alliance[b], et je vous donnerai, à toi et à elle, des présents dignes de toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « concluons une alliance avec lui ». Le grec dit littéralement « amitié », terme qui, dans ce contexte royal, comporte probablement une dimension diplomatique.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’entrerai par mariage dans ta famille ». Le verbe grec désigne l’établissement d’un lien de parenté par mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: établissons
  rationale: Le subjonctif d’exhortation exprime ici une proposition commune; « établissons » rend naturellement l’idée de former une relation.
- source_word: φιλίαν
  choice: des relations d’amitié
  rationale: Le nom signifie littéralement « amitié », avec une portée diplomatique probable dans ce contexte royal. Cette formulation conserve le sens lexical tout en sonnant naturellement en français.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: donne-moi ta fille pour femme
  rationale: Cette traduction garde la formulation matrimoniale et dynastique directe du grec sans en atténuer le caractère transactionnel.
- source_word: ἐπιγαμβρεύσω
  choice: je deviendrai ainsi ton parent par alliance
  rationale: Le verbe désigne l’entrée dans une relation de parenté créée par le mariage, et non simplement l’acte d’épouser la fille.
- source_word: δόματα
  choice: des présents
  rationale: Le terme grec désigne de façon générale des dons; « présents » convient au registre royal sans préciser indûment qu’il s’agit de cadeaux de mariage.
- source_word: ἄξιά σου
  choice: dignes de toi
  rationale: L’expression indique des présents à la mesure du rang et de la dignité du destinataire, tout en conservant l’adresse personnelle.
