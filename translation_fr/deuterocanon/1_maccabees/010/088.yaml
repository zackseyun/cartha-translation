  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
translation:
  language: fr
  text: Quand le roi Alexandre entendit ces paroles, il accorda encore plus d’honneur à Jonathan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il continua d’honorer Jonathan ». Le grec peut exprimer la continuation ou un surcroît d’honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: Quand
  rationale: La formule narrative introduit la suite du récit. En français moderne, « Quand » en restitue naturellement la fonction sans reproduire lourdement le tour grec « et il arriva que lorsque ».
- source_word: ἤκουσεν
  choice: entendit
  rationale: Le verbe signifie directement qu’Alexandre entendit les paroles ou le rapport qui lui fut transmis.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: « Paroles » reste proche de λόγους et convient à des propos rapportés; « ce message » serait plus interprétatif.
- source_word: Ἀλέξανδρος ὁ βασιλεὺς
  choice: le roi Alexandre
  rationale: Cet ordre est naturel en français tout en conservant le titre royal.
- source_word: προσέθετο δοξάσαι
  choice: il accorda encore plus d’honneur à
  rationale: Le tour grec exprime un ajout ou un accroissement d’honneur. Cette formulation française naturelle rend clairement l’intensification, tandis que la note conserve l’autre lecture possible de continuation.
- source_word: τὸν Ἰωναθάν
  choice: Jonathan
  rationale: Le nom propre est rendu selon sa forme française traditionnelle; l’article grec n’a pas à être représenté séparément.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure grecque littérale « il ajouta à honorer » a été idiomatisée, tout en signalant en note l’ambiguïté entre continuation et intensification.
