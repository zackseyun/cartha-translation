revisions:
- from: Il établit son camp face à Joppé, mais les gens de la ville lui en interdirent l’accès, car une garnison d’Apollonios se trouvait à Joppé. Alors ils attaquèrent la ville.[a]
  to: Il établit son camp contre Joppé, et ceux de la ville lui en interdirent l’accès, car une garnison d’Apollonios se trouvait à Joppé, et ils combattirent contre elle.[a]
  rationale: La révision rétablit une coordination neutre conforme à la répétition de καί, rend plus directement la posture militaire hostile de παρενέβαλεν ἐπί par « établit son camp contre », et évite de réduire πολεμέω à une attaque ponctuelle. La note maintient l’explicitation prudente du référent du pronom féminin sans l’intégrer de façon interprétative au texte.
