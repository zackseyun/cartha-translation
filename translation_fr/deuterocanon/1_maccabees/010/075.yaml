  yaml_path: translation/deuterocanon/1_maccabees/010/075.yaml
  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: fr
  text: Il établit son camp contre Joppé, et ceux de la ville lui en interdirent l’accès, car une garnison d’Apollonios se trouvait à Joppé, et ils combattirent contre elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom féminin « elle » renvoie vraisemblablement à Joppé, c’est-à-dire à la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: Il établit son camp face à Joppé
  rationale: Dans ce contexte militaire, παρεμβάλλω désigne l’établissement d’un camp; ἐπί avec le lieu marque ici une position hostile dirigée contre la ville. « Face à » est naturel en français tout en conservant cette nuance.
- source_word: ἀπέκλεισαν αὐτόν
  choice: lui en interdirent l’accès
  rationale: ἀποκλείω signifie fermer dehors ou empêcher d’entrer. Cette formulation explicite naturellement en français le refus d’accès à Joppé sans ajouter le détail non exprimé de portes fermées.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les gens de la ville
  rationale: La formule signifie littéralement « ceux de la ville ». « Les gens de la ville » reste collective, naturelle et ne précise pas indûment qu’il s’agissait exclusivement d’hommes ou de soldats.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: une garnison d’Apollonios
  rationale: φρουρά désigne ici une garnison militaire; le génitif indique son appartenance ou son allégeance à Apollonios.
- source_word: ἐπολέμησαν αὐτήν
  choice: ils attaquèrent la ville
  rationale: πολεμέω exprime l’action de combattre ou de faire la guerre contre. Le pronom féminin αὐτήν renvoie grammaticalement le plus naturellement à Joppé, c’est-à-dire à la ville; le référent est explicité pour éviter l’ambiguïté artificielle du français.
