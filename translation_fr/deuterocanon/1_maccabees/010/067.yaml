  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: fr
  text: En l’an cent soixante-cinq, Démétrios, fils de Démétrios, vint de Crète dans le pays de ses ancêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: La cent soixante-cinquième année
  rationale: Le grec donne la date selon l’ère séleucide au moyen de nombres additionnés. Cette formulation française est naturelle et conserve la référence chronologique sans ajouter de conversion.
- source_word: ἦλθεν
  choice: arriva
  rationale: Dans ce contexte de déplacement vers une destination, « arriva » rend naturellement le verbe narratif ἔρχομαι, sans imposer le point de vue parfois suggéré par « vint ».
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: Démétrios, fils de Démétrios
  rationale: Les noms sont translittérés selon l’usage français, et l’apposition filiale est rendue directement.
- source_word: ἐκ Κρήτης
  choice: quitta la Crète
  rationale: ἐκ indique le lieu de provenance. Associé au verbe de mouvement, « quitta la Crète » exprime clairement le point de départ en français courant.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: dans le pays de ses ancêtres
  rationale: γῆ désigne ici un territoire ou pays; « ses ancêtres » restitue naturellement le pluriel πατέρων et sa valeur ancestrale, sans réduire le sens à ses seuls parents immédiats.
