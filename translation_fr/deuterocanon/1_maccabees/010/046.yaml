base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: fr
  text: Mais lorsque Jonathan et le peuple entendirent ces paroles[a], ils ne les crurent pas et ne les acceptèrent pas, car ils se rappelèrent le grand mal qu’il avait commis en Israël[b] et combien il les avait durement opprimés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne leur firent pas confiance et ne les reçurent pas favorablement ». Le grec distingue le refus de croire ces paroles du refus de les recevoir favorablement.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre Israël ». Le grec dit littéralement « en Israël », expression qui peut désigner un mal commis au sein d’Israël ou contre Israël en tant que peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν αὐτοῖς
  choice: ils ne les crurent pas
  rationale: Dans ce contexte, le verbe exprime le refus d’ajouter foi aux paroles entendues. Cette formulation française est naturelle et conserve pour objet « ces paroles ».
- source_word: οὐδὲ ἐπεδέξαντο
  choice: et ne les acceptèrent pas
  rationale: Le verbe indique qu’ils ne reçurent pas favorablement ces paroles ou la proposition qu’elles véhiculaient. « Accepter » maintient la distinction avec le fait de ne pas croire.
- source_word: ἐμνήσθησαν
  choice: ils se souvenaient
  rationale: L’imparfait français présente ce souvenir comme le motif qui demeurait présent à leur esprit au moment de leur refus.
- source_word: τῆς κακίας τῆς μεγάλης
  choice: du grand mal
  rationale: Cette expression rend le caractère grave des actes sans réduire κακία à une seule nuance, telle que la méchanceté morale ou le préjudice subi.
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: qu’il avait commis en Israël
  rationale: Le plus-que-parfait situe les actes avant la réaction racontée. « En Israël » préserve formellement ἐν tout en laissant ouverte la possibilité d’un sens hostile à Israël.
- source_word: ἔθλιψεν αὐτοὺς σφόδρα
  choice: de la dure oppression qu’il leur avait infligée
  rationale: La formulation exprime une détresse oppressive intense et durable, et rend naturellement en français l’intensification produite par σφόδρα.
theological_decisions:
- issue: Référent du sujet implicite des actes hostiles antérieurs
  choice: Le singulier « il » est conservé.
  alternative: Employer un pluriel collectif « ils » en fonction du contexte politique plus large.
  rationale: Les verbes grecs ἐποίησεν et ἔθλιψεν sont au singulier et renvoient immédiatement à l’auteur du message; la traduction n’élargit donc pas le référent.
- issue: Portée de ἐν Ἰσραήλ
  choice: « en Israël »
  alternative: « contre Israël »
  rationale: La préposition signifie littéralement « en » et peut viser soit le lieu où le mal fut commis, soit Israël comme peuple lésé. Le texte principal conserve cette ambiguïté, et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les événements ponctuels, tandis que l’imparfait de « se souvenaient » fait ressortir le souvenir persistant qui motive le refus. Les deux négations grecques restent distinctes, sans alourdir inutilement la phrase.
