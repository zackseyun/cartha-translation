base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: fr
  text: Jonathan revêtit le vêtement sacré au septième mois de la cent soixantième année, pendant la fête des Tentes[a]. Il rassembla des troupes et fabriqua de nombreuses armes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement appelée « fête des Tabernacles ». Le grec évoque littéralement une fête de la construction de tentes ou d’abris.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: revêtit
  rationale: Le moyen de ἐνδύω exprime ici l’action de se vêtir; « revêtit » est naturel dans un registre digne et convient à un vêtement officiel ou sacerdotal.
- source_word: τὴν ἁγίαν στολήν
  choice: le vêtement sacré
  rationale: στολή désigne un vêtement ample ou d’apparat. « Vêtement sacré » rend la consécration exprimée par ἁγίαν sans préciser davantage la forme ni la fonction du vêtement.
- source_word: τῷ ἑβδόμῳ μηνὶ
  choice: au septième mois
  rationale: Le datif marque le moment; cette formulation française est directe et idiomatique.
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: de la cent soixantième année
  rationale: La construction ordinale grecque désigne l’année 160; l’ordinal français maintient la forme de datation du texte.
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: pendant la fête des Tentes
  rationale: σκηνοπηγία désigne la fête juive liée à l’installation de huttes ou d’abris temporaires. « Fête des Tentes » est clair en français moderne et traduit concrètement le terme grec.
- source_word: συνήγαγεν δυνάμεις
  choice: rassembla des troupes
  rationale: Dans ce contexte militaire, δυνάμεις désigne des forces armées; « troupes » communique ce sens sans supposer qu’il s’agissait déjà d’une armée constituée.
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: fabriqua de nombreuses armes
  rationale: κατασκευάζω peut signifier fabriquer ou préparer, et ὅπλα désigne ici des armes. « Fabriqua » conserve le sens concret le plus immédiat tout en laissant ouverte l’organisation pratique de cette production.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La proposition initiale du témoin fourni (« ἡμῶν καὶ συντηρεῖν φιλίαν πρὸς ἡμᾶς ») a été considérée comme la fin du verset précédent, conformément au découpage de 1 Maccabées 10.21 et au signalement minor_mismatch.
