  text: And each one left his place and went away to his own land.
translation:
  language: fr
  text: Chacun quitta sa place et s’en alla dans son pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: quitta
  rationale: L’aoriste de καταλείπω indique ici que chacun laisse derrière lui l’endroit où il se trouvait. « Quitta » rend naturellement ce mouvement sans renforcer indûment le sens par « abandonna ».
- source_word: ἕκαστος
  choice: chacun
  rationale: ἕκαστος exprime une distribution individuelle. « Chacun » en conserve clairement la force, sans ajouter de précision masculine absente du grec.
- source_word: τὸν τόπον αὐτοῦ
  choice: son poste
  rationale: τόπος signifie littéralement « lieu » ou « place », mais, dans ce contexte de garnisons évacuant leurs positions, « poste » exprime naturellement le lieu occupé par chacun. La portée concrète reste intacte.
- source_word: ἀπῆλθεν
  choice: retourna
  rationale: ἀπέρχομαι signifie « s’en aller ». Avec εἰς τὴν γῆν αὐτοῦ, le français idiomatique « retourna » exprime le départ vers le territoire d’origine sans alourdir la phrase par « s’en alla ».
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: dans son pays
  rationale: γῆ désigne ici le territoire d’origine de chacun. « Son pays » est naturel en français moderne et n’implique pas nécessairement l’idée contemporaine d’un État-nation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation est concise et fluide. « Poste » et « retourna » rendent explicitement le contexte et la destination impliquée, tout en restant proches du sens grec.
