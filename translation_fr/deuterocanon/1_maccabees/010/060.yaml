base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: fr
  text: Il se rendit avec éclat à Ptolémaïs[a] et rencontra les deux rois. Il leur donna de l’argent et de l’or, ainsi que de nombreux présents à leurs amis[b], et il obtint leur faveur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec gloire » ou « en grande pompe »; l’expression grecque évoque une arrivée marquée par l’honneur et la magnificence.
    reason: lexical_alternative
  - marker: b
    text: Dans le cadre d’une cour hellénistique, les « amis » peuvent désigner plus précisément des proches du roi ou des courtisans.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « trouva faveur devant eux »; on pourrait aussi traduire : « trouva grâce à leurs yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: se rendit
  rationale: Rend naturellement l’aoriste narratif de déplacement tout en intégrant clairement la destination.
- source_word: μετὰ δόξης
  choice: avec éclat
  rationale: Exprime la magnificence publique et l’honneur visible de l’arrivée sans donner à δόξα un sens théologique indu.
- source_word: Πτολεμαΐδα
  choice: Ptolémaïs
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu grec.
- source_word: ἀπήντησεν
  choice: rencontra
  rationale: Traduction concise et naturelle; le contexte permet un sens de rencontre diplomatique sans imposer l’idée précise qu’il serait sorti à leur rencontre.
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: les deux rois
  rationale: Reproduit directement l’article et le numéral grecs, qui désignent une paire déjà connue du récit.
- source_word: ἔδωκεν
  choice: donna
  rationale: Conserve le verbe courant du grec; le cadre diplomatique suffit à suggérer une remise officielle.
- source_word: ἀργύριον καὶ χρυσίον
  choice: de l’argent et de l’or
  rationale: Équivalents français usuels des deux matières précieuses.
- source_word: τοῖς φίλοις αὐτῶν
  choice: à leurs amis
  rationale: Préserve le sens lexical de φίλοι sans transformer implicitement le terme en titre officiel; le contexte hellénistique est signalé en note.
- source_word: δόματα πολλά
  choice: de nombreux présents
  rationale: « Présents » convient au registre diplomatique et évite la répétition avec le verbe « donna ».
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: obtint leur faveur
  rationale: Rend en français idiomatique le résultat de l’expression grecque littéralement « trouva faveur devant eux ».
