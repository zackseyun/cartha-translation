base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: fr
  text: 'Le roi le fit asseoir à ses côtés, puis il dit à ses hauts fonctionnaires : « Sortez avec lui au centre de la ville et proclamez que personne ne doit déposer une plainte contre lui[a], quelle que soit l’affaire, et que personne ne doit l’importuner pour quelque motif que ce soit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que personne ne doit lui adresser une requête au sujet de quelque affaire que ce soit ». Le verbe grec peut désigner le fait de s’adresser à une autorité, de présenter une requête ou de former une plainte ; ici, il a vraisemblablement une portée officielle ou juridique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: Le roi le fit asseoir à ses côtés
  rationale: Le causatif de καθίζω est rendu par « fit asseoir », tandis que « à ses côtés » exprime naturellement la proximité honorifique voulue par μετʼ αὑτοῦ.
- source_word: τοῖς ἄρχουσιν
  choice: à ses hauts fonctionnaires
  rationale: ἄρχοντες désigne ici des personnes investies d’autorité auprès du roi. « Hauts fonctionnaires » convient au cadre royal sans leur attribuer un rang militaire précis.
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: Sortez avec lui au centre de la ville
  rationale: La formulation conserve l’ordre de sortir avec Jonathan et le cadre central et public indiqué par εἰς μέσον τῆς πόλεως.
- source_word: κηρύξατε
  choice: proclamez
  rationale: « Proclamer » restitue le caractère officiel et public de κηρύσσω.
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: que personne ne doit déposer de plainte contre lui, quelle que soit l’affaire
  rationale: Avec κατά, ἐντυγχάνειν peut désigner une démarche hostile, une requête ou une plainte portée contre quelqu’un. « Déposer de plainte » rend clairement le probable contexte officiel ou judiciaire, tout en maintenant dans une note l’autre possibilité lexicale.
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω
  choice: que personne ne doit l’importuner
  rationale: « Importuner » rend la défense générale exprimée par ἐνοχλέω sans la renforcer jusqu’à une persécution ou un harcèlement systématique.
- source_word: περὶ παντὸς λόγου
  choice: pour quelque motif que ce soit
  rationale: λόγος a ici le sens de motif, raison ou affaire. Cette formulation exprime la portée exhaustive de l’interdiction et évite de répéter « affaire ».
