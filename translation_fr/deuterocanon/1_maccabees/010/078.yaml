  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: fr
  text: Il le poursuivit jusqu’à Azôt, et les armées engagèrent le combat derrière lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les armées engagèrent le combat à sa suite ». Le grec répète l’expression « derrière lui / après lui »; le rapport exact entre la poursuite et le lieu du combat reste quelque peu ambigu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: il le poursuivit
  rationale: Le verbe exprime une poursuite active dans un contexte militaire. Le pronom objet rend naturellement en français la tournure grecque littérale « poursuivit derrière/après lui ».
- source_word: εἰς Ἄζωτον
  choice: jusqu’à Azôt
  rationale: εἰς indique le mouvement vers la ville et, dans le contexte de la poursuite, « jusqu’à » en marque naturellement le terme. « Azôt » est une forme française traditionnelle du nom grec Ἄζωτος.
- source_word: συνῆψαν … εἰς πόλεμον
  choice: engagèrent le combat
  rationale: Dans ce contexte militaire, συνάπτω avec εἰς πόλεμον désigne l’entrée en combat; cette formulation est claire, concise et digne en français actuel.
- source_word: αἱ παρεμβολαί
  choice: les armées
  rationale: Le mot peut désigner des camps militaires ou, par métonymie, les forces qui y sont rassemblées. « Les armées » évite de faire combattre des lieux tout en conservant le sens militaire.
- source_word: ὀπίσω αὐτοῦ
  choice: derrière lui
  rationale: La seconde occurrence conserve la valeur spatiale possible de l’expression grecque et la séquence de la poursuite suivie du combat, sans effacer son caractère légèrement abrupt.
