  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: fr
  text: Simon déploya ses troupes et engagea le combat contre la phalange[a], car la cavalerie[b] s’était disloquée ; ils[c] furent écrasés par lui et prirent la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phalange était une formation serrée de fantassins.
    reason: historical_context
  - marker: b
    text: Littéralement « le cheval », employé collectivement pour désigner la cavalerie.
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie des verbes au pluriel sans en exprimer le sujet ; dans le contexte, il peut s’agir de la cavalerie ou, plus largement, des combattants ennemis.
    reason: ambiguity
lexical_decisions:
- source_word: ἐξέλυσεν … τὴν δύναμιν αὐτοῦ
  choice: déploya ses troupes
  rationale: Dans ce contexte militaire, le verbe désigne la mise en action des hommes de Simon. « Ses troupes » rend naturellement le collectif singulier δύναμις sans suggérer nécessairement une armée entière.
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: engagea le combat contre la phalange
  rationale: L’expression décrit l’entrée en combat contre une formation adverse. Cette formulation française conserve à la fois l’action militaire et la valeur hostile de πρὸς dans le contexte.
- source_word: φάλαγγα
  choice: phalange
  rationale: Le terme français conserve la précision historique de la formation militaire hellénistique nommée par le grec.
- source_word: ἡ … ἵππος
  choice: la cavalerie
  rationale: Littéralement « le cheval », le nom est employé collectivement pour désigner les forces montées.
- source_word: ἐξελύθη
  choice: s’était disloquée
  rationale: Le passif indique que la cavalerie avait perdu sa cohésion. « S’était disloquée » évite d’anticiper la fuite explicitement mentionnée ensuite et fait écho, en français, au déploiement initial.
- source_word: συνετρίβησαν
  choice: furent écrasés
  rationale: Le verbe exprime une défaite violente et décisive ; « écrasés » en garde la force dans un récit de bataille.
- source_word: ἀπʼ αὐτοῦ
  choice: par lui
  rationale: La préposition peut marquer ici l’agent de la défaite. La traduction reste proche du grec, tout en laissant la fuite être exprimée séparément.
- source_word: ἔφυγαν
  choice: prirent la fuite
  rationale: Cette expression courante et digne rend clairement la fuite après la défaite.
