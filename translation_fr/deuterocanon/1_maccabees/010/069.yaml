  yaml_path: translation/deuterocanon/1_maccabees/010/069.yaml
  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: fr
  text: Démétrios nomma Apollonios, qui était à la tête de la Cœlé-Syrie ; celui-ci rassembla une grande force[a] et établit son camp à Jamnia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande armée ». Le grec δύναμις peut désigner largement une force militaire, et non seulement une armée formellement constituée.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: établit
  rationale: Dans ce contexte administratif, le verbe indique que Démétrios place Apollonios dans une fonction ou confirme sa position. « Établit » conserve ce sens officiel sans préciser davantage les modalités.
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: qui était à la tête de la Cœlé-Syrie
  rationale: La tournure exprime l’autorité exercée par Apollonios sur cette région. « À la tête de » est naturel en français moderne et préserve la portée administrative de ἐπί.
- source_word: συνήγαγεν
  choice: rassembla
  rationale: Le verbe signifie réunir ou assembler. Avec « force », « rassembla » rend naturellement l’action militaire sans ajouter l’idée plus précise d’une levée de troupes.
- source_word: δύναμιν μεγάλην
  choice: une grande force
  rationale: Dans ce récit militaire, δύναμις désigne des forces armées, mais peut avoir une portée plus large qu’une armée formellement constituée. La traduction conserve cette latitude.
- source_word: παρενέβαλεν
  choice: établit son camp
  rationale: Le verbe est un terme militaire indiquant l’installation d’un camp. Cette expression est claire, actuelle et d’un registre narratif digne.
- source_word: ἐν Ἰαμνείᾳ
  choice: à Jamnia
  rationale: Pour situer un camp près d’une ville ou dans son secteur, « à Jamnia » est plus idiomatique en français que « dans Jamnia », tout en rendant correctement ἐν.
