translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement réorganisées pour éviter l’accumulation de coordinations grecques, sans modifier les rapports entre les actions. Le toponyme traditionnel « Cœlé-Syrie » est conservé.
