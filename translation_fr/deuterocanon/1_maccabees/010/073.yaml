base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/073.yaml
  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: fr
  text: Et maintenant, tu ne pourras pas résister à la cavalerie[a] ni à une force aussi considérable dans la plaine, où il n’y a ni pierre, ni caillou, ni endroit où fuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « le cheval », au singulier collectif, pour désigner la cavalerie ou les troupes montées.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: tu ne pourras pas
  rationale: Le futur de δύναμαι exprime ici une incapacité à venir; cette formulation est directe et naturelle en français.
- source_word: ὑποστῆναι
  choice: résister à
  rationale: Dans ce contexte militaire, le verbe signifie tenir face à une force adverse ou lui résister.
- source_word: τὴν ἵππον
  choice: la cavalerie
  rationale: Le singulier grec « le cheval » a ici une valeur collective et désigne les troupes montées.
- source_word: δύναμιν τοσαύτην
  choice: une force aussi considérable
  rationale: δύναμις désigne une force militaire, tandis que τοσαύτην en souligne l’importance sans imposer le sens plus étroit d’« armée ».
- source_word: ἐν τῷ πεδίῳ
  choice: dans la plaine
  rationale: πέδιον désigne un terrain plat et découvert; la traduction conserve le contraste tactique avec les éléments de terrain ensuite énumérés.
- source_word: λίθος
  choice: pierre
  rationale: Le terme général est rendu simplement et reste distinct de κόχλας.
- source_word: κόχλας
  choice: caillou
  rationale: Le mot désigne une petite pierre; « caillou » maintient en français la distinction avec λίθος, « pierre ».
- source_word: τόπος τοῦ φυγεῖν
  choice: endroit où fuir
  rationale: Cette expression rend naturellement l’idée d’un lieu permettant la fuite, sans préciser davantage s’il s’agit de retraite ou d’évasion.
