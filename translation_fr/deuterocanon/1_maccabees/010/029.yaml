  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: fr
  text: Nous vous accorderons de nombreuses remises[a] et nous vous ferons des dons. Dès maintenant, je vous libère et j’exempte tous les Juifs des impôts, de la taxe sur le sel[b] et de la contribution des « couronnes »[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de nombreuses exonérations ». L’expression grecque renvoie ici à des remises d’obligations fiscales.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut se traduire littéralement par « prix du sel » ; dans cette liste, elle désigne probablement une taxe ou une redevance liée au sel.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « des couronnes ». Dans ce contexte fiscal, le terme désigne probablement un prélèvement royal associé à des couronnes honorifiques ou à leur équivalent monétaire.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν … ἀφέματα πολλά
  choice: nous vous accorderons de nombreuses remises
  rationale: Dans ce contexte fiscal, l’expression désigne des obligations remises ou allégées. « Accorder des remises » conserve la formulation administrative sans évoquer le pardon des péchés.
- source_word: δόματα
  choice: dons
  rationale: Le terme désigne de manière générale ce qui est accordé ou offert par le roi ; « dons » est clair et suffisamment large.
- source_word: ἀπολύω
  choice: je vous libère
  rationale: Le verbe exprime ici une libération juridique. Cette traduction maintient sa distinction avec l’exemption fiscale formulée juste après.
- source_word: ἀφίημι … ἀπὸ τῶν φόρων
  choice: j’exempte … des impôts
  rationale: La construction avec ἀπό indique la dispense d’une obligation ; « exempter de » rend naturellement son sens fiscal.
- source_word: φόρων
  choice: impôts
  rationale: Dans cette liste de prélèvements publics, le terme désigne les taxes ou tributs exigés par l’autorité.
- source_word: τιμῆς τοῦ ἁλός
  choice: taxe sur le sel
  rationale: Bien que τιμή puisse littéralement évoquer le prix ou la valeur, son insertion dans une liste fiscale indique vraisemblablement un prélèvement lié au sel.
- source_word: στεφάνων
  choice: contributions dites « des couronnes »
  rationale: Le pluriel signifie littéralement « couronnes », mais peut désigner, dans les finances royales hellénistiques, des couronnes honorifiques offertes au souverain ou leur équivalent monétaire. La traduction rend explicite la nature fiscale tout en conservant l’image originale.
