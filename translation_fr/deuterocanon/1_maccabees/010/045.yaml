base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/045.yaml
  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
translation:
  language: fr
  text: et pour que les murailles de Jérusalem soient rebâties et fortifiées tout autour, les frais seront réglés sur le compte du roi[a], et pour rebâtir les murailles de Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sur ordre du roi ». L’expression grecque peut désigner soit le compte sur lequel les dépenses sont imputées, soit une décision officielle du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: soient reconstruites / reconstruire
  rationale: Le verbe désigne la construction; appliqué aux murailles dans ce contexte de restauration défensive, « reconstruire » exprime naturellement le sens probable.
- source_word: τὰ τείχη
  choice: les murailles
  rationale: « Murailles » convient précisément aux murs défensifs d’une ville ou d’un territoire et évite d’élargir le sens à l’ensemble des fortifications.
- source_word: ὀχυρῶσαι
  choice: fortifiées
  rationale: Le verbe signifie rendre solide et sûr sur le plan défensif; « fortifier » est direct et idiomatique.
- source_word: κυκλόθεν
  choice: de tous côtés
  rationale: Cette expression restitue clairement l’idée d’une fortification sur tout le pourtour.
- source_word: ἡ δαπάνη
  choice: les dépenses
  rationale: Le singulier collectif grec désigne le coût ou la dépense des travaux; le pluriel français est naturel dans ce contexte administratif.
- source_word: δοθήσεται
  choice: seront couvertes
  rationale: Littéralement « sera donnée »; avec les dépenses comme sujet, « seront couvertes » rend naturellement l’idée de financement.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: par le compte du roi
  rationale: λόγος peut ici avoir un sens comptable ou administratif. « Compte du roi » conserve cette nuance sans introduire explicitement le mot « trésor », absent du grec.
- source_word: Ἰουδαίᾳ
  choice: Judée
  rationale: Dans ce contexte hellénistique, le nom géographique désigne normalement la Judée.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La coordination finale, assez abrupte dans le grec, est conservée sans ajouter un verbe de financement absent du texte; « ainsi que » clarifie toutefois son rattachement aux dépenses.
