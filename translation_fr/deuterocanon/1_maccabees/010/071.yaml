translation_notes:
  register: Tutoiement cohérent avec le défi direct entre adversaires. Le registre demeure actuel et digne ; « maintenant donc » conserve l’enchaînement rhétorique du grec, tandis que « la force des villes » en préserve la formulation condensée.
