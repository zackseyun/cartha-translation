base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: fr
  text: Eh bien, si tu as confiance en tes forces, descends vers nous dans la plaine, et affrontons-nous là[a], car j’ai avec moi la force des villes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mettons-nous aux prises l’un avec l’autre » ; l’expression grecque évoque, dans ce contexte, une mise en présence ou une confrontation directe.
    reason: lexical_alternative
  - marker: b
    text: Ou « les forces des villes ». L’expression grecque peut désigner collectivement le soutien militaire fourni par les villes.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
  choice: tu as confiance
  rationale: Le parfait exprime une confiance établie. « Avoir confiance » est naturel en français et convient au défi lancé ici.
- source_word: δυνάμεσίν σου
  choice: tes forces
  rationale: Au pluriel et dans ce contexte militaire, δυνάμεις désigne vraisemblablement les troupes ou moyens militaires.
- source_word: κατάβηθι πρὸς ἡμᾶς
  choice: descends vers nous
  rationale: Cette formulation conserve à la fois le mouvement descendant et l’orientation vers le locuteur.
- source_word: εἰς τὸ πεδίον
  choice: dans la plaine
  rationale: πεδίον désigne ici un terrain plat et découvert, propice à un affrontement militaire.
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: affrontons-nous
  rationale: Le verbe peut évoquer le fait de se mesurer ou d’être opposé l’un à l’autre. Dans ce contexte martial, « affrontons-nous » rend naturellement la confrontation sans préciser indûment ses modalités.
- source_word: δύναμις τῶν πόλεων
  choice: la force des villes
  rationale: Le singulier collectif « force » suit la forme grecque et maintient l’ambiguïté entre puissance, ressources et forces militaires fournies par les villes.
