  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
translation:
  language: fr
  text: Mais je veux partir à travers le pays[a], afin de poursuivre[b] ceux qui ont dévasté notre pays et ravagé de nombreuses villes dans le royaume ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parcourir le pays » ; l’expression grecque κατὰ τὴν χώραν peut désigner plus généralement un déplacement à travers le territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’en prendre à » ou « punir » ; le verbe grec μετέλθω peut désigner le fait de poursuivre des coupables avec une intention hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: je veux
  rationale: Rend directement la volonté ou l’intention personnelle exprimée par le verbe, dans un français moderne et naturel.
- source_word: ἐκβῆναι
  choice: partir
  rationale: Le verbe signifie littéralement « sortir ». Dans ce contexte de déplacement à visée militaire, « partir » est plus naturel en français sans expliciter indûment une campagne.
- source_word: κατὰ τὴν χώραν
  choice: à travers le pays
  rationale: Avec un verbe de mouvement, κατά peut exprimer un parcours à travers un territoire. Cette traduction conserve cette nuance directionnelle.
- source_word: ὅπως μετέλθω
  choice: afin de poursuivre
  rationale: La proposition exprime le but. μετέρχομαι désigne ici l’action d’aller après des responsables avec une intention hostile, sans imposer le sens plus précis de châtiment judiciaire.
- source_word: τοὺς κατεφθαρκότας
  choice: ceux qui ont dévasté
  rationale: Le participe parfait désigne les auteurs d’une ruine déjà causée. « Dévasté » convient à un territoire et garde la force du grec.
- source_word: τὴν χώραν ἡμῶν
  choice: notre pays
  rationale: χώρα peut désigner un pays, un territoire ou une contrée ; « notre pays » est idiomatique dans ce contexte politique.
- source_word: τοὺς ἠρημωκότας
  choice: ravagé
  rationale: ἐρημόω signifie rendre désert ou dévaster. « Ravager des villes » exprime clairement le résultat sans lourdeur.
- source_word: πόλεις πολλὰς
  choice: de nombreuses villes
  rationale: Traduction naturelle et exacte du groupe nominal grec.
- source_word: ἐν τῇ βασιλείᾳ
  choice: dans le royaume
  rationale: Conserve la préposition locative et l’absence de possessif explicite dans le grec.
