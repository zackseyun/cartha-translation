  yaml_path: translation/deuterocanon/1_maccabees/015/027.yaml
  text: And he was not willing to accept them[a], but rejected everything that he had previously agreed to with him[b], and became estranged from him.
translation:
  language: fr
  text: Il ne voulait pas les accepter, mais il rejeta tout ce dont il était convenu auparavant avec lui et s’éloignait de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἠβούλετο
  choice: ne voulut pas
  rationale: Dans ce récit, l’imparfait exprime son refus ou son absence de volonté; cette tournure est naturelle en français et ne réduit pas δέξασθαι à une simple incapacité.
- source_word: αὐτὰ δέξασθαι
  choice: les accepter
  rationale: Le pronom neutre pluriel renvoie aux éléments offerts ou proposés dans le contexte antérieur, sans qu’il soit nécessaire de les préciser ici; « accepter » convient à ce cadre diplomatique.
- source_word: ἠθέτησεν
  choice: il rejeta
  rationale: Le verbe peut signifier rejeter, écarter ou rendre caduc. « Rejeta » exprime clairement la répudiation des accords antérieurs sans imposer un sens juridique trop technique.
- source_word: πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον
  choice: tout ce dont il était convenu auparavant avec lui
  rationale: Le moyen de συντίθημι désigne ici le fait de conclure ou d’établir un accord. « Être convenu de » restitue naturellement la valeur réciproque et diplomatique de l’expression.
- source_word: ἠλλοτριοῦτο αὐτῷ
  choice: prit ses distances avec lui
  rationale: Le verbe à l’imparfait décrit une évolution vers l’éloignement relationnel. Cette formulation française rend la rupture sans la renforcer jusqu’à l’hostilité ouverte.
