  register: Français international moderne, clair et digne. La syntaxe juridique de la concession royale est conservée, tandis que la longue coordination grecque est répartie en deux phrases pour une lecture naturelle. L’ambiguïté de τὰ ἅγια est préservée par « les lieux saints ».
