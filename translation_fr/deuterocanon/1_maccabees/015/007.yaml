  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: fr
  text: Mais Jérusalem et les lieux saints seront libres. Toutes les armes que tu as fabriquées, ainsi que les fortifications que tu as bâties et que tu contrôles, te resteront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: τὰ ἅγια
  choice: les lieux saints
  rationale: Le neutre pluriel peut désigner les espaces sacrés ou les choses saintes. Dans ce contexte de concessions concernant Jérusalem et les possessions militaires, « les lieux saints » conserve la portée spatiale probable sans réduire le terme au seul bâtiment du sanctuaire.
- source_word: ἐλεύθερα
  choice: libres
  rationale: Rend directement la liberté accordée à Jérusalem et aux lieux saints, sans préciser indûment s’il s’agit d’indépendance politique ou d’exemption d’obligations.
- source_word: ὅπλα
  choice: armes
  rationale: Désigne naturellement en français moderne le matériel destiné au combat.
- source_word: κατεσκεύασας
  choice: tu as fabriquées
  rationale: Le verbe signifie ici fabriquer ou préparer; avec « armes », « fabriquer » est clair et idiomatique.
- source_word: ὀχυρώματα
  choice: fortifications
  rationale: Désigne des ouvrages ou places fortifiés; « fortifications » garde le sens militaire sans imposer l’idée de forteresses distinctes.
- source_word: ᾠκοδόμησας
  choice: tu as bâties
  rationale: Rend directement l’action de construire des fortifications et convient au registre historique.
- source_word: ὧν κρατεῖς
  choice: que tu contrôles
  rationale: κρατέω exprime ici la possession effective ou la maîtrise de ces fortifications; « contrôler » est plus naturel que « tenir » dans ce contexte.
- source_word: μενέτω σοι
  choice: te resteront
  rationale: L’impératif grec à valeur concessive confirme le maintien de la possession. Le pluriel français s’accorde naturellement avec l’ensemble des armes et fortifications, malgré le singulier collectif du grec.
theological_decisions: []
