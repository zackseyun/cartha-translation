  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: fr
  text: Il lui ordonna de camper face à la Judée[a] ; il lui ordonna aussi de bâtir Kédrôn[b], de fortifier les villes et de combattre le peuple. Mais le roi poursuivait Tryphon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en face de la Judée ». L’expression grecque indique une position spatiale devant ou vis-à-vis de la Judée.
    reason: lexical_alternative
  - marker: b
    text: Ou « de reconstruire Kédrôn ». Le verbe grec ne précise pas si le lieu devait être construit pour la première fois ou rebâti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: il lui ordonna
  rationale: Le verbe exprime ici un ordre donné avec autorité. « Ordonna » est direct, naturel et conserve cette force.
- source_word: παρεμβάλλειν
  choice: de camper
  rationale: Dans ce contexte militaire, le verbe signifie établir un camp. « Camper » est clair en français moderne sans perdre la nuance militaire donnée par le contexte.
- source_word: κατὰ πρόσωπον τῆς Ἰουδαίας
  choice: face à la Judée
  rationale: L’expression est spatiale et indique une position en face de la Judée. Cette formulation évite de lui attribuer prématurément le sens hostile de « contre ».
- source_word: οἰκοδομῆσαι
  choice: de bâtir
  rationale: Le verbe signifie bâtir ou construire, sans préciser à lui seul s’il s’agit d’une première construction ou d’une reconstruction.
- source_word: τὴν Κεδρὼν
  choice: Kédrôn
  rationale: Translittération française du toponyme grec, avec des accents qui guident la prononciation.
- source_word: ὀχυρῶσαι
  choice: de fortifier
  rationale: Le verbe désigne l’action de renforcer militairement un lieu; « fortifier » en est l’équivalent français précis.
- source_word: τὰς πόλεις
  choice: les villes
  rationale: Traduction directe et usuelle de πόλεις, sans préciser une taille que le texte ne donne pas.
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: de combattre le peuple
  rationale: La construction exprime le but de l’ordre, tandis que πολεμεῖν désigne une action militaire hostile. En français, « combattre le peuple » rend naturellement cette idée sans qu’il soit nécessaire d’ajouter « contre ».
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Le terme désigne collectivement le peuple juif; « le peuple » conserve cette référence sans introduire le sens politique moderne de « nation ».
- source_word: ἐδίωκε
  choice: poursuivait
  rationale: L’imparfait grec présente une action en cours dans le passé; l’imparfait français en préserve l’aspect.
- source_word: Τρύφωνα
  choice: Tryphon
  rationale: Forme française traditionnelle et transparente du nom propre grec.
