  source_fidelity: La traduction rend correctement les référents, la demande territoriale, la somme et le silence final. Toutefois, « ont causé » efface l’imparfait grec ἐποίουν, qui présente le tort comme en cours, et le dernier « Mais » ne correspond pas au simple καί.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Infligeaient un grand mal au peuple et à notre pays » est idiomatique, conserve l’image d’un dommage grave et rend plus directement les datifs grecs.
  terminology: Les noms Joppé et Gazara, ainsi que « cent talents », conviennent. « Réclames » est justifié dans le contexte d’une revendication de villes.
  issues:
