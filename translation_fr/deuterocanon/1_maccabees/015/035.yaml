  yaml_path: translation/deuterocanon/1_maccabees/015/035.yaml
  text: But concerning Joppa and Gazara, you ask for them. These were inflicting great harm on the people and on our land. For these we will give one hundred talents. And he answered him not a word.
translation:
  language: fr
  text: Mais en ce qui concerne Joppé et Gazara, tu les réclames. Ces villes infligeaient un grand mal au peuple et à notre pays. Pour elles, nous donnerons cent talents. Et il ne lui répondit pas un mot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτεῖς
  choice: tu les réclames
  rationale: Dans ce contexte de négociation territoriale, « réclamer » rend mieux qu’un simple « demander » l’exigence portant sur les deux villes.
- source_word: αὗται
  choice: ces villes
  rationale: Le féminin pluriel renvoie clairement à Joppé et Gazara; expliciter « villes » produit un français naturel sans résoudre une ambiguïté réelle.
- source_word: ἐποίουν ... πληγὴν μεγάλην
  choice: ont causé un grand désastre
  rationale: L’expression désigne un dommage ou fléau considérable; « grand désastre » conserve sa force tout en restant idiomatique.
- source_word: τάλαντα ἑκατόν
  choice: cent talents
  rationale: Conservation de l’unité antique de poids et de valeur, sans conversion spéculative.
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: il ne lui répondit pas un mot
  rationale: Rend fidèlement l’idiome grec et son insistance sur l’absence totale de réponse.
