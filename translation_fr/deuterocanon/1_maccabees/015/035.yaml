    issue: Aspect de ἐποίουν
    rationale: « Ont causé » est un passé composé perfectif, alors que l’imparfait ἐποίουν décrit une action dommageable en cours ou habituelle. Il convient de rendre l’imparfait par « infligeaient ».
  - severity: low
    issue: Valeur de la conjonction finale
    rationale: Le grec porte καὶ (« et »), non une opposition. Le dernier « Mais » ajoute un contraste qui n’est pas exprimé.
  - severity: low
    issue: Relation du dommage aux destinataires
    rationale: « Parmi le peuple et dans notre pays » peut décrire le lieu plutôt que les personnes et le territoire affectés. Les datifs se rendent plus nettement par « au peuple et à notre pays ».
