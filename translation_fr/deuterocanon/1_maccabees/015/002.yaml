  yaml_path: translation/deuterocanon/1_maccabees/015/002.yaml
  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
translation:
  language: fr
  text: 'Elles contenaient la formule suivante[a] : « Le roi Antiochos, à Simon, grand prêtre et ethnarque, et à la nation des Juifs[b] : salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Elles contenaient cette formulation. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la nation des Judéens ». Le grec Ἰουδαίων peut désigner les Juifs en tant que peuple ou, dans un sens plus géographique, les Judéens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν περιέχουσαι τὸν τρόπον τοῦτον
  choice: Elles étaient rédigées ainsi
  rationale: La formule décrit le contenu des lettres mentionnées dans le contexte. Cette traduction française est naturelle tout en conservant l’idée de leur formulation; une version plus littérale est signalée en note.
- source_word: ἱερεῖ μεγάλῳ
  choice: grand prêtre
  rationale: Il s’agit du titre juif consacré en français, plutôt que du calque « prêtre grand ».
- source_word: ἐθνάρχῃ
  choice: ethnarque
  rationale: Ce terme conserve le titre politique précis du grec sans le réduire à la désignation générale « chef de la nation ».
- source_word: ἔθνει Ἰουδαίων
  choice: la nation des Juifs
  rationale: ἔθνος désigne ici un peuple constitué, tandis que Ἰουδαίων peut désigner les Juifs comme peuple; la possibilité géographique « Judéens » demeure indiquée en note.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’adresse épistolaire, χαίρειν est une formule conventionnelle de salutation. « Salut ! » en donne un équivalent français bref et digne.
theological_decisions:
- issue: Portée du terme politico-ethnique Ἰουδαίων
  choice: Juifs
  alternative: Judéens
  rationale: Dans cette adresse royale à Simon et à l’ἔθνος collectif, « Juifs » rend probablement mieux le peuple concerné sans limiter le terme aux habitants de la Judée. L’ambiguïté réelle est conservée en note.
- issue: Degré d’idiomatisme de la formule introduisant la lettre
  choice: Elles étaient rédigées ainsi
  alternative: Elles contenaient la formulation suivante
  rationale: Le français idiomatique évite le calque maladroit « elles étaient contenant », tout en exprimant la teneur documentaire de περιέχουσαι et τὸν τρόπον τοῦτον.
translation_notes:
  register: Français international moderne, naturel et digne. La formule d’adresse conserve le caractère officiel de la lettre; « ethnarque » maintient le titre historique précis.
