base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: fr
  text: Et lorsque nous aurons affermi notre royaume, nous te conférerons, ainsi qu’à ton peuple et au sanctuaire, une grande gloire, afin que votre gloire devienne manifeste sur toute la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète des mots de la même famille : littéralement, « nous te glorifierons, toi, ton peuple et le sanctuaire, d’une grande gloire, afin que votre gloire devienne manifeste ». « Sur toute la terre » peut aussi se comprendre comme « dans tout le pays » ou « dans le monde entier ».'
    reason: La note signale à la fois le jeu étymologique δοξάζω/δόξα, difficile à reproduire naturellement en français, et l’étendue géographique ambiguë de γῆ.
lexical_decisions:
- source_word: καταστήσωμεν
  choice: nous aurons affermi
  rationale: Après ὡς δ’ ἂν, l’aoriste subjonctif exprime une éventualité future envisagée comme accomplie. « Aurons affermi » convient à la consolidation politique du royaume sans préciser indûment les moyens employés.
- source_word: βασιλείαν
  choice: notre royaume
  rationale: Dans cette lettre royale, βασιλεία désigne le royaume ou le pouvoir royal du locuteur. « Royaume » conserve naturellement la portée institutionnelle et politique.
- source_word: δοξάσωμέν … δόξῃ μεγάλῃ
  choice: nous te comblerons d’honneur
  rationale: Le grec associe le verbe δοξάζω au datif δόξῃ μεγάλῃ, littéralement « glorifier d’une grande gloire ». En contexte diplomatique, « combler d’honneur » exprime idiomatiquement l’octroi éclatant d’un prestige public sans donner au verbe un sens exclusivement théologique.
- source_word: ἔθνος
  choice: ton peuple
  rationale: ἔθνος désigne ici le peuple juif comme collectivité. En français, « ton peuple » est plus naturel que « ta nation » dans cette coordination et n’impose pas la conception moderne de l’État-nation.
- source_word: ἱερὸν
  choice: le sanctuaire
  rationale: ἱερόν peut désigner le temple ou l’ensemble de son enceinte sacrée. « Sanctuaire » préserve cette amplitude référentielle.
- source_word: φανερὰν γενέσθαι
  choice: devienne manifeste
  rationale: Après ὥστε, l’infinitif indique le résultat visé. « Devienne manifeste » rend la publicité et la visibilité de cette gloire.
- source_word: τὴν δόξαν ὑμῶν
  choice: votre gloire
  rationale: Le nom δόξα est ici conservé par « gloire », qui évoque l’éclat et le renom publics tout en maintenant le lien rhétorique avec δοξάζω et δόξῃ.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: sur toute la terre
  rationale: γῆ peut signifier « terre », « pays » ou « monde ». « Sur toute la terre » conserve l’ampleur de la formule sans trancher vers un territoire particulier.
theological_decisions:
- issue: Portée religieuse ou politique du groupe δοξάζω/δόξα
  choice: Rendre le verbe et δόξῃ μεγάλῃ par l’expression diplomatique « combler d’honneur », mais τὴν δόξαν ὑμῶν par « votre gloire ».
  alternative: Employer uniformément « glorifier », « grande gloire » et « gloire ».
  rationale: Le contexte est celui d’une promesse royale d’exaltation publique, non d’un acte explicite de culte. La formulation française choisie reste digne et naturelle, tout en laissant « gloire » dans la proposition finale préserver l’écho du grec et son possible relief religieux.
translation_notes:
  register: Français international actuel, digne et accessible, avec le ton solennel d’une lettre royale. Le futur antérieur marque naturellement l’antériorité de l’établissement du royaume. Le tutoiement correspond à l’adresse personnelle au destinataire; le pluriel « votre » inclut ensuite le destinataire, son peuple et le sanctuaire.
