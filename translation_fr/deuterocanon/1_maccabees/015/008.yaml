  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: fr
  text: Et que toute dette royale, ainsi que les revenus royaux à venir[a], te soient remis dès maintenant et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les futures redevances royales » ou « ce qui reviendra au roi ». Le grec ne précise pas la catégorie exacte de ces revenus, mais indique seulement leur caractère royal et leur perception future.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικόν
  choice: toute dette royale
  rationale: Cette formulation conserve le sens général de « ce qui est dû » et le caractère royal de l’obligation, sans préciser davantage la catégorie fiscale.
- source_word: τὰ ἐσόμενα βασιλικά
  choice: les revenus royaux à venir
  rationale: Le neutre pluriel accompagné du participe futur désigne des sommes qui reviendront ultérieurement au roi. « Revenus » rend naturellement le contexte fiscal sans les réduire à une catégorie particulière de taxes.
- source_word: ἀπὸ τοῦ νῦν
  choice: dès maintenant
  rationale: Expression française actuelle et concise qui marque la prise d’effet immédiate de la remise.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: pour toujours
  rationale: Rend la durée illimitée affirmée par le décret dans une langue naturelle et solennelle.
- source_word: ἀφέσθω σοι
  choice: te soient remis
  rationale: Dans ce contexte juridique et fiscal, ἀφίημι exprime la renonciation à une créance ou à un revenu. « Remettre » convient à la remise d’une dette et garde le bénéficiaire exprimé par σοι.
