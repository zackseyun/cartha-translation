base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/023.yaml
  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: fr
  text: ainsi qu’à toutes les régions, à Sampsamé[a], aux Spartiates, à Délos, à Myndos, à Sicyone, en Carie, à Samos, en Pamphylie et en Lycie, à Halicarnasse, à Cos[b], à Sidé, à Arados, à Rhodes, à Phasélis, à Gortyne, à Cnide, à Chypre et à Cyrène.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification de Sampsamé et la forme exacte de ce nom sont incertaines; la traduction suit de près la forme grecque.
    reason: cultural_note
  - marker: b
    text: Certains de ces noms de lieux ont d’autres graphies, par exemple Kos pour Cos et Knidos pour Cnide.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: toutes les régions
  rationale: χώρα peut désigner une région, un territoire ou un pays. « régions » convient à cette liste sans évoquer des États-nations modernes.
- source_word: Σαμψάμῃ
  choice: Sampsamé
  rationale: Translittération française proche de la forme grecque au datif; l’identification et la forme conventionnelle du lieu restent incertaines.
- source_word: Σπαρτιάταις
  choice: aux Spartiates
  rationale: Le pluriel ethnique désigne les habitants de Sparte, et non simplement la ville.
- source_word: καὶ εἰς …
  choice: à / en
  rationale: Dans cette liste de destinataires, εἰς indique la destination des lettres. Le français emploie naturellement « à » devant les villes et îles, et « en » devant certaines régions.
- source_word: τὴν Καρίδα
  choice: en Carie
  rationale: Nom régional rendu selon l’usage géographique français.
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: en Pamphylie et en Lycie
  rationale: Les deux noms désignent des régions; la préposition est répétée pour une lecture française claire.
- source_word: Κῶ
  choice: Cos
  rationale: « Cos » est la forme française traditionnelle du nom de l’île grecque Κῶς.
- source_word: Ἄραδον
  choice: Arados
  rationale: La forme française « Arados » reflète le nom grec hellénisé de la cité.
- source_word: τὴν Φασηλίδα
  choice: Phasélis
  rationale: Forme française usuelle du toponyme grec.
- source_word: Κνίδον
  choice: Cnide
  rationale: « Cnide » est la forme française traditionnelle de la cité grecque Κνίδος.
