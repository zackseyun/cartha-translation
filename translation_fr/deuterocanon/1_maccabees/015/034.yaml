  text: But[a], since we have the opportunity[b], we are holding fast to the inheritance of us and of our fathers.
translation:
  language: fr
  text: Mais nous, puisque nous en avons l’occasion[a], nous restons fermement attachés à l’héritage qui est le nôtre et celui de nos pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « profitant d’un moment favorable ». Le grec désigne un moment opportun, et non simplement du temps disponible.'
    reason: lexical_alternative
