lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous
  rationale: δέ marque ici le contraste avec ce qui précède; « Mais nous » en conserve naturellement la force adversative.
- source_word: καιρὸν ἔχοντες
  choice: tant que l’occasion nous en est donnée
  rationale: καιρός désigne un moment opportun ou une occasion favorable, et non le temps en général. Cette formulation conserve aussi la valeur circonstancielle du participe.
- source_word: ἀντεχόμεθα
  choice: nous restons fermement attachés à
  rationale: Le moyen exprime une adhésion ou un maintien résolu. Cette traduction préserve cette fermeté sans réduire le sens à une revendication strictement juridique.
- source_word: τῆς κληρονομίας
  choice: l’héritage
  rationale: κληρονομία peut désigner un héritage, un patrimoine ou une possession héréditaire. « Héritage » est clair et laisse subsister la nuance territoriale et ancestrale du contexte.
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: qui est le nôtre et celui de nos pères
  rationale: Les deux génitifs dépendent du même nom κληρονομίας. La formulation française indique la continuité entre la possession présente et ancestrale sans suggérer nécessairement deux héritages distincts.
