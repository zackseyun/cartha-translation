  text: And the king appointed Cendebaeus commander of the coastal region, and gave him infantry and cavalry forces.
translation:
  language: fr
  text: Le roi nomma Kendébée commandant de la région côtière et lui donna des forces d’infanterie et de cavalerie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: nomma
  rationale: Dans ce contexte administratif, le verbe exprime la nomination officielle d’une personne à une fonction.
- source_word: Κενδεβαῖον
  choice: Kendébée
  rationale: Forme française translittérée du nom grec, qui conserve son identification tout en restant naturelle à la lecture.
- source_word: ἐπιστράτηγον
  choice: commandant
  rationale: Le terme désigne un responsable militaire placé à la tête d’un territoire; « commandant » préserve ce sens sans préciser excessivement le statut de la charge.
- source_word: τῆς παραλίας
  choice: de la région côtière
  rationale: Le génitif indique ici la juridiction territoriale du commandant; « région côtière » rend plus clairement cette idée que le simple « côte ».
- source_word: δυνάμεις πεζικὰς καὶ ἱππικὰς
  choice: des forces d’infanterie et de cavalerie
  rationale: Cette formulation rend le vocabulaire militaire et le contraste entre troupes à pied et troupes montées, tout en conservant le pluriel collectif de δυνάμεις.
- source_word: ἔδωκεν αὐτῷ
  choice: lui donna
  rationale: Traduction directe du grec, dont l’objet militaire suffit à indiquer qu’il s’agit de forces placées à sa disposition.
