  text: And it seemed good to us to receive the shield from them[a].
translation:
  language: fr
  text: Et il nous a paru bon de recevoir d’eux le bouclier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’accepter d’eux le bouclier ». Dans ce contexte diplomatique, le mot grec traduit par « bouclier » peut désigner un présent honorifique, traditionnellement compris comme un bouclier d’or.
    reason: Alternative lexicale et précision contextuelle sans ajouter au texte grec.
lexical_decisions:
- source_word: ἔδοξεν
  choice: il nous a paru bon
  rationale: Cette tournure rend l’impersonnel aoriste de δοκέω et conserve le ton formel d’une décision diplomatique, sans le réduire à « nous avons décidé ».
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom au datif désigne ceux auxquels cette conduite a paru bonne; il s’intègre naturellement à la tournure française « il nous a paru bon ».
- source_word: δέξασθαι
  choice: recevoir
  rationale: L’infinitif aoriste moyen de δέχομαι peut signifier « recevoir » ou « accepter »; « recevoir » reste proche du grec et convient au contexte d’un don diplomatique.
- source_word: τὴν ἀσπίδα
  choice: le bouclier
  rationale: ἀσπίς désigne normalement un bouclier. Le grec de ce verset ne précise pas qu’il est en or; cette donnée contextuelle ne doit donc pas être ajoutée au texte principal.
- source_word: παρʼ αὐτῶν
  choice: d’eux
  rationale: παρά avec le génitif exprime ici la provenance; « d’eux » est une formulation française concise et naturelle.
