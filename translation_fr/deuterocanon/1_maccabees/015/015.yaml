  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: fr
  text: 'Numénios et ceux qui l’accompagnaient revinrent de Rome[a], apportant des lettres adressées aux rois et aux pays, dans lesquelles était écrit ce qui suit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « vinrent… de Rome », mais le contexte indique qu’ils revenaient d’une mission accomplie là-bas ; d’où « revinrent de Rome ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: revinrent
  rationale: Le verbe signifie littéralement « vint », mais le contexte indique que Numénios et ses compagnons revenaient d’une mission à Rome. Le pluriel français s’accorde naturellement avec le sujet composé.
- source_word: οἱ παρʼ αὐτοῦ
  choice: ceux qui l’accompagnaient
  rationale: Cette expression désigne les personnes qui étaient avec Numénios, sans préciser davantage leur statut.
- source_word: ἐκ Ῥώμης
  choice: de Rome
  rationale: Rend simplement le lieu de provenance exprimé par ἐκ.
- source_word: ἔχοντες ἐπιστολάς
  choice: apportant des lettres
  rationale: 'Le participe exprime une circonstance concomitante : ils arrivent porteurs de correspondance officielle.'
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: adressées aux rois et aux pays
  rationale: Les datifs indiquent vraisemblablement les destinataires des lettres. « Pays » rend χώρα de façon claire sans imposer « régions » ou « territoires ».
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: dans lesquelles était écrit ce qui suit
  rationale: Cette formulation française naturelle introduit le contenu des lettres tout en conservant l’idée explicite d’un texte écrit.
