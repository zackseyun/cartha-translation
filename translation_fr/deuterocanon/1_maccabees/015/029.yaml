  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: fr
  text: Vous avez dévasté leur territoire[a], vous avez infligé un coup terrible au pays[b] et vous avez pris le contrôle de nombreux endroits dans mon royaume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévasté leurs frontières » ; le grec peut désigner les limites territoriales, les régions frontalières ou le territoire lui-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « causé de graves dommages au pays » ; le mot grec rendu par « coup » peut aussi signifier blessure, fléau ou dommage selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « exercé votre domination sur de nombreux endroits dans mon royaume » ; le verbe grec exprime la maîtrise ou la domination.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια αὐτῶν
  choice: leur territoire
  rationale: Dans ce contexte géopolitique, ὅρια peut désigner les frontières, les régions frontalières ou l’ensemble du territoire délimité. « Leur territoire » s’accorde naturellement avec le verbe « dévaster ».
- source_word: ἠρημώσατε
  choice: vous avez dévasté
  rationale: Le verbe exprime l’action de rendre désert ou désolé. « Dévaster » en restitue clairement la force en français actuel.
- source_word: πληγὴν μεγάλην
  choice: un coup terrible
  rationale: πληγή peut signifier coup, blessure, fléau ou dommage. Dans cette plainte militaire et territoriale, « un coup terrible » conserve l’image sans suggérer nécessairement une épidémie.
- source_word: ἐπὶ τῆς γῆς
  choice: au pays
  rationale: γῆ désigne ici le territoire touché, non la terre entière. Avec « infliger un coup », « au pays » est idiomatique et contextuellement précis.
- source_word: ἐκυριεύσατε
  choice: vous avez pris le contrôle de
  rationale: Le verbe indique l’exercice de la maîtrise ou de la domination. « Prendre le contrôle de » rend bien l’acquisition d’une domination effective sans présumer une souveraineté juridique formelle.
- source_word: τόπων πολλῶν
  choice: de nombreux endroits
  rationale: τόποι est un terme général désignant des lieux. « De nombreux endroits » reste direct sans transformer ces lieux en régions administratives.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: dans mon royaume
  rationale: βασιλεία désigne ici le domaine gouverné par le roi. « Dans mon royaume » est la formulation française la plus directe.
