  text: And he wrote these things to Demetrius the king[a], and to Attalus, and to Ariarathes, and to Arsaces,
translation:
  language: fr
  text: 'Il écrivit aussi ces choses à Démétrios, le roi, à Attale, à Ariarathe[a] et à Arsace :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici « Arathès », forme qui désigne probablement Ariarathe.
    reason: Variante de translittération et identification historique probable du nom propre Ἀράθῃ.
lexical_decisions:
- source_word: καὶ
  choice: aussi
  rationale: Dans la continuité de l’énumération précédente, « aussi » rend naturellement la valeur connective de καί sans imposer une succession temporelle.
- source_word: ταῦτα
  choice: omis comme objet explicite
  rationale: En français, « il écrivit aussi à… » exprime naturellement l’envoi de la même communication aux destinataires énumérés; reprendre « ces choses » serait lourd et peu idiomatique.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: Rend directement l’aoriste de γράφω et convient à une communication écrite adressée aux personnes citées.
- source_word: Δημητρίῳ τῷ βασιλεῖ
  choice: à Démétrios, le roi
  rationale: Le datif marque le destinataire et τῷ βασιλεῖ est en apposition au nom; la ponctuation française préserve cette structure.
- source_word: Ἀττάλῳ
  choice: à Attale
  rationale: Forme française traditionnelle du nom grec Ἄτταλος.
- source_word: Ἀράθῃ
  choice: à Ariarathe
  rationale: Le grec imprimé porte Ἀράθῃ, mais le personnage visé est vraisemblablement le roi Ariarathe; la forme française usuelle facilite son identification tout en signalant la donnée textuelle en note.
- source_word: Ἀρσάκῃ
  choice: à Arsace
  rationale: Forme française traditionnelle du nom royal grec Ἀρσάκης.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Les noms royaux suivent leurs formes françaises traditionnelles. Le deux-points final conserve le caractère ouvert de la liste, puisque le verset se poursuit dans le contexte immédiat.
