  text: And King Antiochus pursued him[a], and he came to Dora, fleeing to the seacoast.
translation:
  language: fr
  text: Le roi Antiochos le poursuivit, et celui-ci se rendit à Dora en fuyant vers le littoral.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « fuyant vers [le lieu] au bord de la mer ». La construction grecque est elliptique : elle peut désigner le littoral comme destination de la fuite ou souligner la situation maritime de Dora.'
    reason: Préserve l’ambiguïté syntaxique et géographique du groupe grec final.
lexical_decisions:
- source_word: ἐδίωξεν
  choice: poursuivit
  rationale: Dans ce contexte militaire et politique, le verbe exprime une poursuite active. « Poursuivit » en conserve la force avec naturel.
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: le roi Antiochos
  rationale: Cet ordre correspond à l’usage français courant tout en rendant explicitement le titre royal.
- source_word: ἦλθεν εἰς Δῶρα
  choice: arriva à Dôra
  rationale: Le mouvement aboutit à la ville de Dôra ; « arriva à » exprime naturellement cette entrée au terme de la fuite.
- source_word: φεύγων
  choice: dans sa fuite
  rationale: Cette tournure rend la circonstance concomitante exprimée par le participe présent grec, sans alourdir la phrase.
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: située au bord de la mer
  rationale: L’expression elliptique qualifie très probablement Dôra comme la ville située sur le littoral. Cette traduction conserve l’indication géographique dans un français clair.
