    issue: Le texte principal présente la localisation maritime de Dora comme certaine.
    rationale: La construction grecque finale est elliptique et admet au moins la lecture selon laquelle le fugitif se dirige vers le littoral. Une traduction principale doit conserver cette possibilité, tandis que la note peut signaler l’autre analyse.
  - severity: low
    issue: Graphie non usuelle « Dôra ».
    rationale: « Dora » est la forme française internationale et évite d’ajouter un signe diacritique sans fonction en français.
