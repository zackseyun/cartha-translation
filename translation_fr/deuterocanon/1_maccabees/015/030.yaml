  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
translation:
  language: fr
  text: Maintenant donc, remettez les villes dont vous vous êtes emparés, ainsi que les impôts des territoires que vous avez placés sous votre domination, au-delà des frontières de la Judée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « depuis les frontières de la Judée ». La formule grecque relative aux frontières est condensée ; la traduction donne le sens contextuel probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois l’immédiateté de νῦν et la valeur de transition ou de conséquence de οὖν, dans un registre soutenu mais actuel.
- source_word: παράδοτε
  choice: livrez
  rationale: L’impératif exige la remise de biens sous contrôle. « Livrez » reste direct sans ajouter nécessairement l’idée de restitution contenue dans « rendez ».
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: les villes dont vous vous êtes emparés
  rationale: καταλαμβάνω désigne ici la prise de possession; « s’emparer de » exprime naturellement en français la force de cette acquisition.
- source_word: τοὺς φόρους
  choice: les impôts
  rationale: φόροι peut désigner des impôts ou des tributs. « Impôts » est clair en français moderne et convient au prélèvement politique évoqué.
- source_word: τῶν τόπων
  choice: des territoires
  rationale: Dans ce contexte politique et géographique, « territoires » est plus naturel et précis que le calque « lieux », sans imposer l’idée de circonscriptions administratives formelles.
- source_word: ὧν κατεκυριεύσατε
  choice: sur lesquels vous avez pris le contrôle
  rationale: Rend l’acquisition de la maîtrise ou de la domination exprimée par κατακυριεύω, sans employer une formulation théologique ou archaïque.
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: au-delà des frontières de la Judée
  rationale: La formule grecque est condensée et syntaxiquement difficile. Cette traduction exprime le sens contextuel probable, celui de territoires situés hors de la Judée, tout en signalant l’ambiguïté dans une note.
theological_decisions:
- issue: Interprétation de la formule frontalière τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: au-delà des frontières de la Judée
  alternative: depuis les frontières de la Judée; des frontières relevant de la Judée
  rationale: Il ne s’agit pas d’un enjeu doctrinal majeur, mais d’une réelle difficulté syntaxique et géographique. Le contexte favorise une référence aux villes et aux recettes de territoires situés hors des limites propres de la Judée; la note préserve toutefois la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et direct. Le vouvoiement collectif convient à l’adresse politique. La syntaxe reste proche du grec tout en évitant les calques opaques.
