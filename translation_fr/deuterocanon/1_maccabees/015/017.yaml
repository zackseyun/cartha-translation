  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
translation:
  language: fr
  text: Les ambassadeurs des Juifs sont venus auprès de nous comme nos amis et alliés[a], renouvelant l’amitié et l’alliance qui remontent à l’origine, ayant été envoyés par Simon, le grand prêtre, et par le peuple des Juifs[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délégués » ou « envoyés » ; le terme grec désigne des représentants diplomatiques officiels.
    reason: lexical_alternative
  - marker: b
    text: « Le peuple des Juifs » peut aussi se traduire par « la nation des Juifs » ou « l’assemblée des Juifs » ; le mot grec peut désigner le peuple en tant que corps civique.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  choice: ambassadeurs
  rationale: Le terme désigne des représentants diplomatiques officiels; « ambassadeurs » exprime clairement ce rôle en français moderne.
- source_word: φίλοι ... καὶ σύμμαχοι
  choice: amis et alliés
  rationale: Cette traduction directe conserve à la fois le vocabulaire de l’amitié diplomatique et celui de l’alliance.
- source_word: ἀνανεούμενοι
  choice: afin de renouveler
  rationale: Le participe exprime ici le but de la démarche diplomatique; cette formulation est naturelle en français sans modifier le sens.
- source_word: τὴν ἐξ ἀρχῆς φιλίαν καὶ συμμαχίαν
  choice: l’amitié et l’alliance établies dès le commencement
  rationale: « Dès le commencement » rend ἐξ ἀρχῆς; « établies » explicite sobrement que ces relations remontent à leur origine, sans les présenter comme nouvelles.
- source_word: ἀπεσταλμένοι ἀπὸ
  choice: avaient été envoyés par
  rationale: Le plus-que-parfait passif restitue l’envoi antérieur à leur arrivée, et « par » exprime naturellement l’agent en français.
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: Simon, le grand prêtre
  rationale: « Grand prêtre » est l’équivalent français biblique courant de ἀρχιερεύς.
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: le peuple juif
  rationale: δῆμος désigne ici le peuple envisagé comme corps civique; « peuple juif » est naturel et lisible, tandis qu’une note conserve les nuances possibles.
