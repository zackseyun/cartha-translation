  yaml_path: translation/deuterocanon/1_maccabees/015/012.yaml
  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
translation:
  language: fr
  text: Car il savait que les malheurs s’étaient accumulés contre lui[a] et que les forces armées l’avaient abandonné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les calamités s’étaient rassemblées contre lui ». Le verbe grec évoque des maux réunis ou concentrés contre lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « les troupes l’avaient abandonné ». Le grec emploie un terme militaire qui désigne les forces ou les troupes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: il savait
  rationale: Cette forme passée de οἶδα exprime ici un état de connaissance dans le récit; « il savait » est naturel et fidèle.
- source_word: ἐπισυνῆκται
  choice: s’étaient accumulés
  rationale: Le parfait exprime un rassemblement déjà accompli dont le résultat demeure; avec κακά, « s’étaient accumulés » rend naturellement la concentration des malheurs contre lui.
- source_word: ἐπʼ αὐτόν
  choice: contre lui
  rationale: Avec κακά dans ce contexte hostile, ἐπί suivi de l’accusatif indique que les malheurs sont dirigés contre lui.
- source_word: κακά
  choice: les malheurs
  rationale: Le terme désigne ici des adversités ou calamités plutôt que le mal moral; « les malheurs » conserve sa portée générale.
- source_word: ἀφῆκαν
  choice: avaient abandonné
  rationale: L’aoriste de ἀφίημι signifie ici laisser ou délaisser; le plus-que-parfait français situe naturellement cet abandon avant la constatation exprimée par « il savait ».
- source_word: αἱ δυνάμεις
  choice: les forces armées
  rationale: Dans ce récit militaire, δυνάμεις désigne les troupes ou forces militaires. L’article est conservé sans ajouter le possessif « ses », absent du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le lien causal « car », la valeur résultative du parfait grec et l’absence de possessif explicite devant « forces armées ».
