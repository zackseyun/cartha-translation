base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: fr
  text: Sinon, donnez cinq cents talents d’argent à leur place, ainsi que cinq cents autres talents pour la destruction que vous avez causée et pour les impôts des villes[a]. Sinon, ils viendront vous faire la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tribut des villes ».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Mais sinon / Sinon
  rationale: Rend directement la condition menaçante répétée en grec. La légère variation française évite une lourdeur sans atténuer la structure de l’ultimatum.
- source_word: δότε
  choice: donnez
  rationale: L’impératif « donnez » reste proche du sens large du grec et convient à la remise d’une somme exigée.
- source_word: ἀντʼ αὐτῶν
  choice: à leur place
  rationale: Préserve l’idée de substitution sans préciser davantage le référent du pronom.
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: cinq cents talents d’argent
  rationale: Conserve l’unité monétaire antique et exprime naturellement en français la matière ou la valeur en argent.
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: les destructions que vous avez causées
  rationale: Évite en français la répétition maladroite du nom et du verbe apparentés tout en maintenant l’accusation de responsabilité.
- source_word: τῶν φόρων τῶν πόλεων
  choice: les impôts des villes
  rationale: φόροι peut désigner des impôts ou un tribut. « Impôts » est clair en français moderne, tandis que la note signale l’autre possibilité.
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: cinq cents autres talents
  rationale: Dans cette syntaxe comptable condensée, ἀλλά introduit vraisemblablement une somme supplémentaire plutôt qu’une opposition simple.
- source_word: παραγενόμενοι ἐκπολεμήσουσιν ὑμᾶς
  choice: ils viendront vous faire la guerre
  rationale: Rend naturellement la venue exprimée par le participe, suivie de l’action militaire du verbe principal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe condensée du grec est réorganisée avec retenue pour indiquer qu’une seconde somme de cinq cents talents couvre les destructions et les impôts des villes. Aucun marqueur de note n’est nécessaire puisque le texte ne comporte pas de note publiée.
