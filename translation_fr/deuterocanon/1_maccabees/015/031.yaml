  source_fidelity: 'La seconde somme est correctement comprise comme une somme supplémentaire couvrant à la fois la destruction et les φόροι des villes. Toutefois, καταφθορά est au singulier : « les destructions » ne reproduit pas le nombre du grec. « La destruction que vous avez causée » conserve l’accusation sans forcer la répétition étymologique grecque.'
