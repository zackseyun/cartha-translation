base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: fr
  text: Antiochos, fils du roi Démétrios, envoya depuis les îles de la mer des lettres à Simon, prêtre et ethnarque[a] des Juifs[b], ainsi qu’à toute la nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ethnarque » est un titre officiel désignant le dirigeant d’un peuple ou d’une nation.
    reason: cultural_note
  - marker: b
    text: Ou « Judéens »; le terme grec peut désigner le peuple juif dans un sens ethnico-religieux ou régional et politique, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Le verbe exprime simplement l’envoi; « envoya » convient naturellement avec le complément « des lettres » et rend l’aoriste grec.
- source_word: ἐπιστολάς
  choice: des lettres
  rationale: L’accusatif pluriel désigne plusieurs communications écrites; « des lettres » est le rendu français courant et précis.
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: depuis les îles de la mer
  rationale: Ce rendu conserve l’expression géographique du grec sans identifier plus précisément des îles que le texte ne nomme.
- source_word: ἱερεῖ
  choice: prêtre
  rationale: Le nom est en apposition à Simon et sans article en grec; « prêtre » est clair et respecte cette formulation.
- source_word: ἐθνάρχῃ
  choice: ethnarque
  rationale: Il s’agit d’un titre politique formel. Le conserver évite de lui substituer un modèle institutionnel plus précis, comme « gouverneur ».
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans ce contexte, le terme désigne largement le peuple dont Simon est le dirigeant. « Juifs » est naturel, tout en laissant « Judéens » comme possibilité lexicale signalée en note.
- source_word: παντὶ τῷ ἔθνει
  choice: à toute la nation
  rationale: Le datif désigne, avec Simon, un autre destinataire. « Toute la nation » maintient la dimension collective et politique de ἔθνος.
- source_word: τοῦ βασιλέως
  choice: du roi
  rationale: Le génitif grec dépend de « Démétrios »; la tournure française naturelle est « fils du roi Démétrios ».
theological_decisions:
- issue: Rendu du titre politique ἐθνάρχης
  choice: ethnarque
  alternative: dirigeant de la nation; gouverneur
  rationale: Conserver le titre historique préserve la nature exacte, mais non entièrement définie dans le verset, de la charge de Simon et n’importe pas une conception constitutionnelle étrangère au texte.
- issue: Portée de Ἰουδαῖοι
  choice: Juifs
  alternative: Judéens
  rationale: Le contexte peut comporter à la fois une dimension ethnico-religieuse et une dimension régionale ou politique. Le texte principal emploie le terme français le plus courant, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant une tournure pesante. Les formes « Antiochos » et « Démétrios » reflètent directement les noms grecs; le titre rare « ethnarque » est conservé et expliqué en note.
