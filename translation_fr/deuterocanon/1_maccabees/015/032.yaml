  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: fr
  text: Athénobios, l’ami du roi, vint à Jérusalem. Il vit la magnificence de Simon, un service de table garni d’objets d’or et d’argent[a], ainsi qu’une suite imposante. Frappé d’étonnement, il lui transmit les paroles du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « service de table » est rare et difficile. Il pourrait désigner plus précisément un service à boire ou une présentation de vaisselle précieuse en or et en argent.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος τοῦ βασιλέως
  choice: l’ami du roi
  rationale: Cette traduction formelle conserve l’expression grecque, qui peut désigner un titre de cour, sans la préciser abusivement par « courtisan » ou une autre fonction technique.
- source_word: δόξαν
  choice: la magnificence
  rationale: Dans ce contexte narratif, le mot désigne la grandeur visible et le prestige de Simon plutôt qu’une gloire au sens théologique.
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: un service de table garni d’objets d’or et d’argent
  rationale: Le rare κυλίκιον semble désigner un service ou une présentation de vaisselle, probablement liée à la boisson. « Service de table » rend le cadre somptueux tout en évitant une précision incertaine; « objets » laisse ouverte la nature exacte des articles d’or et d’argent.
- source_word: παράστασιν ἱκανήν
  choice: une suite imposante
  rationale: L’expression évoque vraisemblablement les nombreuses personnes présentes auprès de Simon et l’effet prestigieux produit par son entourage.
- source_word: ἐξίστατο
  choice: Frappé d’étonnement
  rationale: Le verbe exprime une vive stupéfaction devant ce qu’Athénobios vient de voir; cette tournure est naturelle en français et se rattache clairement à la proposition suivante.
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: il lui transmit les paroles du roi
  rationale: La formulation conserve la référence explicite aux « paroles » du roi tout en exprimant naturellement en français leur transmission à Simon.
