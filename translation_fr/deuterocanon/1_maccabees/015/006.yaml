  text: to make your own coinage for the currency of your country;[a]
translation:
  language: fr
  text: de fabriquer votre propre monnaie, qui aura cours dans votre pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de frapper votre propre monnaie pour qu’elle serve de monnaie dans votre pays ». Le grec emploie un verbe général (« faire, fabriquer ») avec des termes désignant la monnaie frappée et la monnaie ayant cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: fabriquer
  rationale: L’infinitif aoriste de ποιέω signifie largement « faire, produire ». Avec κόμμα comme complément, « fabriquer » reste naturel en français sans introduire directement le verbe technique « frapper ».
- source_word: κόμμα
  choice: monnaie
  rationale: Dans ce contexte, κόμμα désigne de la monnaie frappée ou un monnayage. Le collectif français « monnaie » convient au privilège politique accordé.
- source_word: ἴδιον
  choice: votre propre
  rationale: ἴδιον exprime ici ce qui appartient en propre au destinataire; « votre propre » en rend clairement la valeur possessive.
- source_word: νόμισμα
  choice: qui aura cours
  rationale: νόμισμα désigne la monnaie reconnue comme courante. La proposition « qui aura cours » évite de répéter « monnaie » tout en conservant la fonction monétaire explicitée par le grec.
- source_word: τῆς χώρας σου
  choice: dans votre pays
  rationale: χώρα désigne ici le territoire ou pays soumis à l’autorité du destinataire. Avec « avoir cours », le français idiomatique demande « dans votre pays ».
