  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: fr
  text: Mais il retourna auprès du roi, en colère, et lui rapporta ces paroles, la splendeur de Simon[a] et tout ce qu’il avait vu. Alors le roi entra dans une grande colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la gloire de Simon ». Le grec δόξα peut désigner l’honneur, la gloire ou une magnificence visible; ici, il renvoie probablement à l’apparat impressionnant qui entourait Simon.
    reason: Alternative lexicale préservant l’étendue sémantique de δόξα.
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: il retourna auprès du roi
  rationale: Le verbe aoriste exprime ici le mouvement de retour vers le roi; « retourna auprès de » est naturel en français et conserve la direction du récit.
- source_word: μετὰ θυμοῦ
  choice: en colère
  rationale: Cette tournure indique la manière dont il revint. « En colère » restitue clairement et naturellement la force émotionnelle de θυμός.
- source_word: ἀπήγγειλεν
  choice: lui rapporta
  rationale: Le verbe désigne la transmission au roi de ce qui avait été dit et observé; « rapporta » convient au contexte d’un compte rendu.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: λόγοι renvoie directement aux propos précédemment échangés; « ces paroles » en garde le caractère concret.
- source_word: τὴν δόξαν Σίμωνος
  choice: la splendeur de Simon
  rationale: Dans ce contexte narratif, δόξα peut évoquer la gloire, l’honneur ou la magnificence visible de Simon. « Splendeur » convient à ce que l’envoyé a pu constater, sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: πάντα ὅσα εἶδεν
  choice: tout ce qu’il avait vu
  rationale: La formulation est exhaustive et rétrospective; le plus-que-parfait situe naturellement les observations avant le compte rendu.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: le roi entra dans une grande colère
  rationale: Cette expression française naturelle rend l’intensité de la construction grecque à mots apparentés, sans produire un calque maladroit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque a été divisée en deux pour assurer une lecture fluide, tandis que « Alors » maintient l’enchaînement narratif. Le marqueur [a] figure immédiatement après l’expression concernée.
