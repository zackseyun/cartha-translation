  yaml_path: translation/deuterocanon/1_maccabees/015/013.yaml
  text: And Antiochus encamped against Dora[c][b][a], and with him were twelve myriads of fighting men and eight thousand cavalry.
translation:
  language: fr
  text: Antiochos établit son camp contre Dora[a] ; il avait avec lui douze myriades[b] de combattants et huit mille cavaliers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom du lieu est Dora en grec ; certaines traditions emploient la forme « Dor ».
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire cent vingt mille combattants. Une myriade est une unité ancienne qui vaut dix mille.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit littéralement « huit mille chevaux », expression militaire collective désignant ici des troupes montées.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: établit son camp contre
  rationale: Le verbe désigne l’installation d’un camp, et ἐπί avec le nom du lieu exprime ici un déploiement militaire hostile.
- source_word: Δῶρα
  choice: Dora
  rationale: Dora translittère directement la forme grecque Δῶρα du témoin retenu.
- source_word: δώδεκα μυριάδες
  choice: douze myriades
  rationale: Cette formulation conserve l’unité numérique grecque, une myriade valant dix mille, sans convertir silencieusement l’expression ancienne.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: combattants
  rationale: Le terme désigne des hommes engagés dans le combat ; « combattants » est naturel en français moderne dans cette énumération militaire.
- source_word: ὀκτακισχίλια
  choice: huit mille
  rationale: Traduction directe du nombre grec.
- source_word: ἵππος
  choice: cavaliers
  rationale: Bien que le grec signifie littéralement « cheval », le singulier collectif désigne ici les troupes montées.
