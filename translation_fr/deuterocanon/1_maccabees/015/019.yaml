  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: fr
  text: Il nous a donc paru bon d’écrire aux rois et aux pays[a], afin qu’ils ne cherchent pas à leur faire du mal, qu’ils ne fassent pas la guerre contre eux, contre leurs villes et contre leurs territoires[b], et qu’ils ne s’allient pas à ceux qui leur font la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le même mot, χώρα, pour les « pays » destinataires de la lettre et, plus loin, pour les « territoires » appartenant aux Juifs. « Contrées », « régions » ou « terres » sont aussi possibles selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte imprimé de Swete porte ici une lettre « A » devant « villes », ce qui paraît être une anomalie éditoriale ou de transcription. Le contexte donne naturellement : « leurs villes et leurs territoires ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  choice: Nous avons donc jugé bon
  rationale: Rend naturellement la formule officielle de décision ou d’approbation, tout en conservant son ton formel.
- source_word: γράψαι
  choice: d’écrire
  rationale: Traduction directe de l’infinitif grec; le contexte indique qu’il s’agit d’une correspondance officielle.
- source_word: τοῖς βασιλεῦσιν καὶ ταῖς χώραις
  choice: aux rois et aux pays
  rationale: « Rois » conserve la référence aux souverains; χώρα désigne ici des entités territoriales destinataires de la lettre, d’où « pays ».
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  choice: qu’ils ne cherchent pas à leur faire du mal
  rationale: Formulation française idiomatique qui garde l’idée d’une recherche active du mal à infliger, sans renforcer indûment le sens en « comploter ».
- source_word: μὴ πολεμήσωσιν αὐτοὺς
  choice: qu’ils ne fassent pas la guerre contre eux
  rationale: Convient au contexte politique et militaire et rend clairement le verbe πολεμέω.
- source_word: τὰς πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν
  choice: leurs villes et leurs territoires
  rationale: « Villes » est l’équivalent usuel de πόλεις. Dans cette seconde occurrence, χώρα désigne plus naturellement les terres placées sous leur autorité; « territoires » évite l’expression moins naturelle « leurs pays ».
- source_word: μὴ συμμαχώσιν
  choice: qu’ils ne s’allient pas
  rationale: Rend de façon concise et actuelle l’action de devenir allié ou d’apporter un soutien d’allié.
- source_word: τοῖς πολεμοῦσιν αὐτούς
  choice: à ceux qui leur font la guerre
  rationale: Le participe présent exprime des adversaires engagés dans une hostilité en cours.
