  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
translation:
  language: fr
  text: Maintenant donc, je confirme en ta faveur tous les allègements[a] que les rois qui m’ont précédé t’ont accordés, ainsi que quels que soient les autres allègements qu’il t’a accordés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « allègements » sont des concessions fiscales accordées par le roi, comme des réductions de taxes ou de redevances; il ne s’agit pas nécessairement d’une exemption complète de toute obligation.
    reason: cultural_note
  - marker: b
    text: Le texte grec se termine par un verbe au singulier, « il t’a accordés », bien que le sujet exprimé auparavant soit « les rois qui m’ont précédé ». Cette formulation inhabituelle est conservée ici; on pourrait s’attendre à « ils t’ont accordés ».
    reason: textual_variant
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois la transition temporelle et la valeur déductive de la formule grecque, dans le registre solennel d’une déclaration royale.
- source_word: ἵστημί
  choice: je confirme
  rationale: Dans ce contexte administratif, le verbe signifie mettre en vigueur ou ratifier des concessions, et non simplement « placer ».
- source_word: σοι
  choice: en ta faveur
  rationale: Exprime naturellement en français le bénéficiaire de la confirmation royale.
- source_word: πάντα τὰ ἀφαιρέματα
  choice: tous les allègements
  rationale: Le nom désigne ici vraisemblablement des réductions ou dégrèvements de charges. « Allègements » reste assez large et n’implique pas nécessairement une exemption totale.
- source_word: ἃ ἀφῆκάν σοι
  choice: que … t’ont accordés
  rationale: Rend idiomatiquement l’acte royal de concéder ces allègements tout en évitant une répétition lourde de « remettre ».
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: les rois qui m’ont précédé
  rationale: Formulation française naturelle qui conserve la relation de succession royale.
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: ainsi que tous les autres allègements
  rationale: Restitue l’ajout de concessions non précisées; dans ce contexte, ὅσα porte sur l’ensemble des autres allègements concernés.
- source_word: ἀφῆκέν σοι
  choice: qu’il t’a accordés
  rationale: Préserve le singulier inattendu du verbe dans le texte grec transmis, au lieu de l’harmoniser silencieusement avec le sujet pluriel précédent.
