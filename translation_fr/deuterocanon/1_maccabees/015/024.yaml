  text: Il en écrivit une copie à Simon, le grand prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: une copie
  rationale: Le nom désigne la copie ou le double d’un document; « une copie » est naturel en français moderne et convient au contexte administratif.
- source_word: αὐτῶν
  choice: en
  rationale: Bien que le pronom grec soit formellement au pluriel, il renvoie au contenu des écrits précédemment mentionnés. Le pronom français « en » préserve cette reprise sans imposer artificiellement un référent singulier.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: Le verbe signifie simplement « écrire ». Cette formulation reste proche du grec sans ajouter explicitement l’idée d’envoi.
- source_word: ἀρχιερεῖ
  choice: grand prêtre
  rationale: « Grand prêtre » est l’équivalent français courant et traditionnel de ἀρχιερεύς dans le contexte cultuel et politique juif.
- source_word: Σίμωνι
  choice: Simon
  rationale: « Simon » est la forme française usuelle de ce nom propre dans ce contexte historique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure « Il en écrivit une copie » rend le renvoi anaphorique du pluriel grec de manière idiomatique tout en évitant d’ajouter que la copie fut envoyée.
