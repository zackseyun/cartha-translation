    issue: Référent trop restreint du pronom « les »
    rationale: Dans « à faire des prisonniers parmi le peuple et à les tuer », « les » désigne grammaticalement les prisonniers. Le grec coordonne αἰχμαλωτίζειν τὸν λαόν et φονεύειν, le second verbe ayant pour objet implicite le peuple déjà mentionné. « à en tuer » renvoie au peuple sans imposer que les personnes tuées soient précisément celles qui ont été capturées.
  revised_text: Cendébée arriva à Jamnia et se mit à provoquer le peuple, à envahir la Judée[a], à faire des prisonniers parmi le peuple et à en tuer[b].
