  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
translation:
  language: fr
  text: Cendébée arriva à Jamnia et se mit à provoquer le peuple, à envahir la Judée[a], à faire des prisonniers parmi le peuple et à en tuer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à entrer en Judée » ; le verbe grec peut être rendu plus littéralement ainsi, mais le contexte évoque une incursion militaire hostile.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « en » renvoie au peuple ; en grec, le complément de « tuer » n’est pas répété après « faire des prisonniers parmi le peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  choice: arriva
  rationale: L’aoriste de παραγίνομαι exprime ici l’arrivée dans un lieu; « arriva » convient naturellement au récit.
- source_word: Κενδεβαῖος
  choice: Cendébée
  rationale: Forme française traditionnelle et reconnaissable du nom grec.
- source_word: Ἰαμνείαν
  choice: Jamnia
  rationale: Forme française usuelle de ce nom de lieu antique.
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: se mit à provoquer
  rationale: La tournure exprime le commencement d’une action; ἐρεθίζω signifie ici provoquer ou exciter de manière hostile, sans que le procédé soit précisé.
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Rend directement le collectif λαός et conserve sa répétition dans la proposition relative aux prisonniers.
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: à envahir la Judée
  rationale: Le verbe peut désigner le fait d’entrer dans un territoire; la capture et la mise à mort qui suivent indiquent ici une incursion militaire hostile.
- source_word: αἰχμαλωτίζειν
  choice: à faire des prisonniers parmi le peuple
  rationale: Le verbe désigne la capture de personnes en temps de guerre. Cette formulation française est naturelle sans suggérer que tout le peuple fut capturé.
- source_word: φονεύειν
  choice: à les tuer
  rationale: Le pronom reprend naturellement les personnes capturées ou visées, tandis que « tuer » restitue le sens direct du verbe sans lui ajouter une nuance juridique.
