  yaml_path: translation/deuterocanon/1_maccabees/015/033.yaml
  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: fr
  text: 'Simon lui répondit : « Nous n’avons pris aucune terre appartenant à autrui[a] et nous ne nous sommes emparés de rien qui appartienne à d’autres, mais seulement de l’héritage de nos pères, dont nos ennemis s’étaient emparés injustement[b] à une certaine époque. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « une terre étrangère ». Le grec souligne surtout qu’elle appartient à quelqu’un d’autre.'
    reason: lexical_alternative
  - marker: b
    text: Ou « sans jugement équitable », voire « sans procédure régulière ». Le mot grec peut souligner l’absence de jugement approprié aussi bien que l’injustice.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: aucune terre appartenant à autrui
  rationale: ἀλλότριος désigne ici ce qui appartient à un autre. Cette formulation exprime clairement la question de la propriété légitime, mieux que « terre étrangère », qui pourrait suggérer seulement un territoire situé à l’étranger.
- source_word: εἴλημμεν
  choice: nous n’avons pris
  rationale: Le parfait de λαμβάνω présente un acte de prise dont le résultat demeure; le passé composé français convient à cette dénégation.
- source_word: ἀλλοτρίων
  choice: rien qui appartienne à d’autres
  rationale: Le génitif pluriel substantivé reste général dans le grec. « Rien qui appartienne à d’autres » préserve cette portée sans la restreindre arbitrairement à des biens matériels ou à des étrangers au sens ethnique.
- source_word: κεκρατήκαμεν
  choice: nous ne nous sommes emparés
  rationale: κρατέω peut exprimer la maîtrise, la possession ou la prise de contrôle. « S’emparer de » convient au contexte territorial et distingue ce verbe du simple « prendre » précédent.
- source_word: κληρονομίας τῶν πατέρων ἡμῶν
  choice: l’héritage de nos pères
  rationale: La formulation conserve à la fois l’idée de possession héritée et la référence masculine explicite aux pères ou ancêtres, sans développer une interprétation théologique supplémentaire.
- source_word: ἀκρίτως
  choice: injustement
  rationale: L’adverbe peut signifier « sans jugement » ou « sans examen régulier ». « Injustement » en rend clairement la portée dans ce contexte tout en laissant la nuance juridique en note.
- source_word: ἐν τινι καιρῷ
  choice: autrefois
  rationale: L’expression indique un moment passé indéterminé, non nécessairement une durée. « Autrefois » est naturel en français et évite de préciser davantage que le grec.
- source_word: κατεκρατήθη
  choice: s’en étaient emparés
  rationale: Le passif grec décrit la prise de contrôle de l’héritage par les ennemis. La tournure active française avec reprise pronominale est plus naturelle et maintient le sens.
theological_decisions:
- issue: Nature de la revendication territoriale de Simon
  choice: mais seulement de l’héritage de nos pères
  alternative: mais seulement de notre héritage ancestral
  rationale: La traduction conserve l’argument précis du texte — la récupération d’un patrimoine hérité — sans y ajouter une justification covenantale ou nationaliste absente de cette phrase.
- issue: Référence de πατέρων
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » maintient la forme masculine explicite et la résonance familiale du grec; « nos ancêtres » serait possible mais neutraliserait cette formulation.
- issue: Force de ἀκρίτως
  choice: injustement
  alternative: sans jugement équitable
  rationale: Le choix principal communique l’illégitimité alléguée sans décider si l’auteur vise surtout une injustice morale, l’absence de jugement ou l’absence de procédure régulière; la note conserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement restructurée pour rendre naturel le contraste grec elliptique après ἀλλά. « Seulement » explicite ce contraste sans ajouter une nouvelle revendication, tandis que les notes préservent les principales ambiguïtés lexicales.
