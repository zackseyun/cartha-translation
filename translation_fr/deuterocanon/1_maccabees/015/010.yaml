  yaml_path: translation/deuterocanon/1_maccabees/015/010.yaml
  text: In the one hundred seventy-fourth year, Antiochus went out into the land of his fathers, and all the forces gathered to him, so that only a few were left with Tryphon.
translation:
  language: fr
  text: La cent soixante-quatorzième année, Antiochos partit pour le pays de ses pères, et toutes les forces se réunirent auprès de lui, si bien qu’il y avait peu de gens avec Tryphon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: La cent soixante-quatorzième année
  rationale: Cette formule française naturelle de datation conserve l’ordinal grec et n’ajoute aucune précision sur l’ère concernée.
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans ce récit historique et militaire, « partit » exprime naturellement le déplacement indiqué par ἐξῆλθεν sans préciser indûment qu’il s’agissait d’une marche militaire.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: pour le pays de ses pères
  rationale: « Pays de ses pères » reste proche du grec et conserve la référence ancestrale; « pour » rend idiomatiquement la direction du déplacement.
- source_word: συνῆλθον πρὸς αὐτὸν
  choice: se rallièrent à lui
  rationale: 'Dans le contexte, les forces ne font pas que se rassembler matériellement : elles rejoignent le camp d’Antiochos. « Se rallier » rend clairement ce mouvement d’adhésion.'
- source_word: πᾶσαι αἱ δυνάμεις
  choice: toutes les forces
  rationale: Dans un contexte militaire, δυνάμεις désigne les forces ou les troupes; « forces » conserve l’étendue du terme grec.
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: si bien qu’il ne resta que peu d’hommes avec Tryphon
  rationale: « Si bien que » marque le résultat introduit par ὥστε. La formulation française explicite naturellement que peu d’hommes demeurèrent auprès de Tryphon, tout en signalant en note la tournure grecque plus concise.
