- from: La cent soixante-quatorzième année, Antiochos partit pour le pays de ses pères, et toutes les forces se rallièrent à lui, si bien qu’il ne resta que peu d’hommes avec Tryphon.[a]
  to: La cent soixante-quatorzième année, Antiochos partit pour le pays de ses pères, et toutes les forces se réunirent auprès de lui, si bien qu’il y avait peu de gens avec Tryphon.
  rationale: La révision supprime l’explicitation narrative (« il ne resta ») et la note qui la justifiait, afin de conserver la brièveté et la portée exacte du grec. Elle remplace aussi « se rallièrent » par une expression moins interprétative, tout en maintenant un français moderne et naturel.
