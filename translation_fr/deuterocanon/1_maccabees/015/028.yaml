  yaml_path: translation/deuterocanon/1_maccabees/015/028.yaml
  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: fr
  text: 'Il lui envoya Athénobius, l’un de ses Amis[a], pour s’entretenir avec lui et lui dire : « Vous tenez Joppé, Gazara[b] et la citadelle à Jérusalem[c], des villes de mon royaume. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Amis » étaient des dignitaires de la cour royale hellénistique ; le terme ne désigne donc pas nécessairement ici de simples proches personnels.
    reason: historical_context
  - marker: b
    text: Gazara est la forme grecque du nom de lieu ; ce site est généralement identifié à Guézer.
    reason: cross_reference
  - marker: c
    text: Ou « l’Acra à Jérusalem ». Le mot grec signifie « citadelle » ou « forteresse », mais il peut aussi désigner ici, comme un nom propre, la place forte séleucide de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς αὐτόν
  choice: Il lui envoya
  rationale: Rend directement le verbe narratif et son complément, dans un français naturel et digne.
- source_word: Ἀθηνόβιον
  choice: Athénobius
  rationale: Forme française traditionnelle du nom grec, claire pour le lectorat francophone.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: l’un de ses Amis
  rationale: La majuscule signale le sens vraisemblable de titre de cour hellénistique sans transformer l’expression en un titre plus précis que le grec.
- source_word: κοινολογησόμενον αὐτῷ
  choice: pour s’entretenir avec lui
  rationale: Exprime une discussion ou une concertation sans imposer le sens plus étroit de « négocier ».
- source_word: λέγων
  choice: et lui dire
  rationale: Intègre naturellement le participe grec à la proposition de but tout en introduisant fidèlement les paroles rapportées.
- source_word: κατακρατεῖτε
  choice: vous gardez sous votre contrôle
  rationale: Conserve l’idée de maîtrise effective et la tonalité accusatrice, sans préciser indûment qu’il s’agit d’une occupation militaire.
- source_word: Ἰόππης
  choice: Joppé
  rationale: Forme française usuelle du toponyme grec.
- source_word: Γαζάρων
  choice: Gazara
  rationale: Suit la forme toponymique attestée dans le texte grec plutôt que de la remplacer dans le corps du texte par Guézer.
- source_word: τῆς ἄκρας ἐν Ἰερουσαλήμ
  choice: la citadelle de Jérusalem
  rationale: Rend le sens courant de ἄκρα et exprime idiomatiquement en français sa localisation à Jérusalem; la possibilité d’un nom historique propre est conservée en note.
- source_word: πόλεις τῆς βασιλείας μου
  choice: des villes de mon royaume
  rationale: Traduction directe du groupe en apposition et du génitif, sans explicitation supplémentaire.
