    rationale: Cette expression explicite le siège et ajoute une image absente du grec. Une formulation de convergence est plus proche du texte tout en conservant l’ambiguïté lexicale.
  - severity: low
    issue: Périphrase affaiblissante pour συνέθλιβεν
    rationale: « Soumettait ainsi la ville à une forte pression » est plus lourd et moins direct que le verbe grec. « Pressait la ville » est à la fois naturel et fidèle.
