  naturalness: Le texte révisé est fluide en français international moderne et conserve un style narratif sobre. « Par terre et par mer » est l’expression française naturelle pour les deux fronts, sans perdre le sens du grec.
  terminology: « Encercla » convient pour ἐκύκλωσεν. « Se rapprochèrent depuis la mer » rend prudemment le mouvement de convergence de συνῆψαν sans imposer un combat naval explicite. « Pressait » conserve la force militaire de συνέθλιβεν sans la périphrase affaiblissante « soumettait ... à une forte pression ».
