  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: fr
  text: Il encercla la ville[a], et les navires se rapprochèrent depuis la mer[b] ; il pressait la ville par terre et par mer, et ne laissa personne en sortir ni y entrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entoura la ville » ; le verbe grec évoque littéralement le fait de l’entourer en cercle.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut évoquer le fait de se joindre, de converger ou d’engager l’affrontement ; ici, il décrit l’action des navires depuis la mer contre la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: encercla
  rationale: Le verbe exprime concrètement l’action d’entourer; « encercla » conserve l’image militaire sans expliciter davantage le siège.
- source_word: συνῆψαν
  choice: resserraient l’étau
  rationale: Avec « les navires » pour sujet et « du côté de la mer », le verbe évoque ici leur convergence contre la ville et le resserrement du blocus naval. L’imparfait français présente cette action comme concomitante à l’encerclement.
- source_word: συνέθλιβεν
  choice: soumettait ainsi la ville à une forte pression
  rationale: Cette formulation conserve la force du verbe et rend l’aspect duratif de l’imparfait grec, tout en restant naturelle dans un contexte de siège.
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: du côté de la terre comme du côté de la mer
  rationale: La répétition de « du côté de » reflète celle de la préposition grecque et indique les deux directions depuis lesquelles la pression s’exerçait.
- source_word: οὐκ εἴασεν
  choice: ne laissait personne
  rationale: Expression française courante qui rend directement l’idée de permission refusée.
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: sortir ni entrer
  rationale: Couple de verbes naturel en français qui exprime clairement le caractère total du blocus; après une négation, « ni » convient mieux que le « et » grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple porte l’action principale, tandis que les imparfaits rendent les actions concomitantes ou continues. La métaphore courante « resserrer l’étau » clarifie la fonction des navires sans affirmer qu’un combat naval précis a eu lieu.
