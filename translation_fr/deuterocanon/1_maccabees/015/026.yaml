  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: fr
  text: Simon lui envoya deux mille hommes choisis pour combattre à ses côtés[a], ainsi que de l’argent, de l’or et du matériel en quantité suffisante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour lui prêter main-forte » ou « pour être son allié ». Le verbe grec peut désigner plus largement le soutien apporté par un allié; ici, le contexte favorise l’idée d’une assistance militaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « des fournitures en quantité suffisante ». Le terme grec est large et peut désigner du matériel, de l’équipement ou des fournitures selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent narratif direct et naturel du verbe grec.
- source_word: διαχιλίους ἄνδρας
  choice: deux mille hommes
  rationale: Rend précisément le nombre et le nom ἄνδρας sans expliciter « soldats », que le contexte suggère mais que le grec ne dit pas.
- source_word: ἐκλεκτούς
  choice: choisis
  rationale: Préserve l’idée d’hommes sélectionnés sans leur attribuer explicitement le statut de troupes d’élite.
- source_word: συμμαχῆσαι αὐτῷ
  choice: pour combattre à ses côtés
  rationale: Dans ce contexte militaire, la formule exprime clairement l’appui armé, tout en signalant en note le sens plus large d’alliance ou d’assistance.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Rend le sens concret de « métal argent », favorisé par son association avec l’or, tout en restant idiomatique en français.
- source_word: χρυσίον
  choice: de l’or
  rationale: Équivalent lexical direct.
- source_word: σκεύη ἱκανά
  choice: du matériel en quantité suffisante
  rationale: σκεύη est un terme large désignant du matériel, de l’équipement ou des fournitures; ἱκανά indique que la quantité était suffisante.
