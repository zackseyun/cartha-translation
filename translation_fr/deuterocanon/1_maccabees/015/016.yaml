  rationale: Nom propre latin rendu sous sa forme française conventionnelle, sans le traduire.
- source_word: ὕπατος
  choice: consul
  rationale: Le terme grec désigne ici la magistrature romaine de consul ; cet équivalent est historiquement précis et naturel en français.
- source_word: Ῥωμαίων
  choice: des Romains
  rationale: Le génitif pluriel est rendu explicitement et se rattache à « consul », conformément à l’identification officielle de l’auteur.
- source_word: Πτολεμαίῳ
  choice: Ptolémée
  rationale: Nom royal au datif, qui désigne le destinataire ; la forme française consacrée est retenue.
- source_word: βασιλεῖ
  choice: roi
  rationale: Titre en apposition à Ptolémée ; « au roi Ptolémée » restitue naturellement le datif grec.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’ouverture d’une lettre grecque, l’infinitif constitue une formule conventionnelle de salutation. « Salut ! » en rend la fonction sans suggérer un ordre littéral à se réjouir.
