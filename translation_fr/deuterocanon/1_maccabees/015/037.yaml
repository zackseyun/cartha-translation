lexical_decisions:
- source_word: Τρύφων
  choice: Tryphon
  rationale: Nom propre translittéré selon la forme française courante dans la tradition biblique.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition narrative comportant un léger contraste avec l’action précédente; « Mais » rend clairement cette nuance.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: monta à bord d’un navire
  rationale: Le participe aoriste d’ἐμβαίνω avec εἰς πλοῖον indique l’action de monter dans un bâtiment; cette formulation est naturelle en français moderne et conserve la succession des actions.
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: Le verbe φεύγω exprime la fuite ou l’évasion; « s’enfuit » convient au contexte de retraite précipitée.
- source_word: εἰς Ὀρθωσίαν
  choice: à Orthosia
  rationale: Avec un nom de lieu, εἰς indique la destination; en français, le mouvement vers une ville se rend naturellement avec « à ».
