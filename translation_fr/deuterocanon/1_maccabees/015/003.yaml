base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: fr
  text: Puisque certains hommes néfastes se sont emparés du royaume de nos pères[a], je veux revendiquer ce royaume afin de le rétablir tel qu’il était autrefois, et j’ai recruté un grand nombre de soldats[b] et équipé des navires de guerre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « certains fléaux se sont emparés du royaume de nos pères »; le grec emploie λοιμοί, littéralement « fléaux » ou « pestes », comme désignation métaphorique de personnes nuisibles.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi évoquer la levée de troupes étrangères ou mercenaires.
    reason: lexical_alternative
  - marker: c
    text: Ou « préparé » ou « construit des navires de guerre »; le verbe grec peut désigner aussi bien la préparation et l’équipement que la construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Puisque
  rationale: Introduit la raison donnée pour l’action du roi et rend naturellement la valeur causale du grec.
- source_word: τινες λοιμοὶ
  choice: certains hommes néfastes
  rationale: λοιμοί désigne littéralement des fléaux, mais qualifie ici métaphoriquement des personnes nuisibles; « hommes néfastes » conserve la forte nuance péjorative sans paraître archaïque.
- source_word: κατεκράτησαν
  choice: se sont emparés de
  rationale: Avec le génitif, le verbe exprime la prise de maîtrise ou de contrôle; cette formulation convient au contexte politique.
- source_word: τῆς βασιλείας τῶν πατέρων ἡμῶν
  choice: du royaume de nos pères
  rationale: Rend directement la construction grecque et conserve la dimension dynastique et ancestrale.
- source_word: βούλομαι
  choice: je veux
  rationale: Expression directe et actuelle de la volonté ou de l’intention du locuteur.
- source_word: ἀντιποιήσασθαι τῆς βασιλείας
  choice: revendiquer ce royaume
  rationale: Le moyen avec le génitif signifie faire valoir sa prétention ou son droit sur quelque chose. « Revendiquer » préserve cette nuance sans présupposer que la récupération est déjà accomplie.
- source_word: ὅπως ἀποκαταστήσω αὐτὴν
  choice: afin de le rétablir
  rationale: Rend clairement le but et l’idée de restauration; le pronom français masculin reprend « royaume ».
- source_word: ὡς ἦν τὸ πρότερον
  choice: tel qu’il était autrefois
  rationale: Formulation française naturelle exprimant le retour à l’état antérieur.
- source_word: ἐξενολόγησα
  choice: j’ai recruté
  rationale: Le verbe désigne la levée ou le recrutement de combattants, avec une possible nuance de troupes étrangères ou mercenaires laissée en note.
- source_word: πλῆθος δυνάμεων
  choice: un grand nombre de soldats
  rationale: Dans ce contexte militaire, δυνάμεις désigne des troupes; cette expression est plus naturelle en français courant que « une multitude de forces ».
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: équipé des navires de guerre
  rationale: κατασκευάζω peut signifier préparer, équiper ou construire. « Équipé » exprime ici la mise en état de combattre sans imposer l’idée de construction.
