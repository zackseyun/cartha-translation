lexical_decisions:
- source_word: ἤνεγκαν
  choice: ils apportèrent
  rationale: L’aoriste de φέρω exprime ici l’action simple d’apporter un présent diplomatique, sans imposer l’idée plus précise d’une présentation officielle.
- source_word: ἀσπίδα
  choice: un bouclier
  rationale: « Bouclier » est le terme français courant et suffisamment général pour ἀσπίς.
- source_word: χρυσῆν
  choice: en or
  rationale: Cette formulation naturelle indique que le bouclier est fait d’or, tout en s’accordant clairement avec l’expression de sa valeur.
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: d’une valeur de cinq mille mines
  rationale: Bien que la construction avec ἀπό puisse se rendre plus littéralement, le contexte d’un présent diplomatique favorise le sens de valeur ou de coût.
- source_word: μνῶν
  choice: mines
  rationale: La translittération de l’unité antique préserve la précision historique sans proposer une conversion moderne incertaine.
