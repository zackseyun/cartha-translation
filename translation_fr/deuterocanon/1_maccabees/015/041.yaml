  yaml_path: translation/deuterocanon/1_maccabees/015/041.yaml
  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: fr
  text: Il construisit Kédrôn[a] et y posta de la cavalerie[b] et des troupes, pour que, en sortant, elles patrouillent les routes de la Judée[c], comme le roi le lui avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fortifia Kédrôn ». Le verbe grec signifie d’abord « bâtir » ou « construire » ; le contexte militaire peut suggérer des travaux de fortification.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des cavaliers ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe traduit par « patrouiller » peut aussi évoquer le fait de parcourir les routes pour les contrôler, y mener des incursions ou harceler ceux qui les empruntent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: fortifia
  rationale: Le verbe signifie littéralement « bâtir » ou « aménager », mais le contexte militaire et l’installation immédiate de forces indiquent ici des travaux de fortification.
- source_word: τὴν Κεδρὼν
  choice: Kédrôn
  rationale: Le nom de lieu est translittéré d’après la forme grecque, avec une graphie adaptée au français.
- source_word: ἔταξεν
  choice: posta
  rationale: Dans ce contexte militaire, le verbe désigne l’affectation de soldats à un lieu précis.
- source_word: ἵππεις
  choice: de la cavalerie
  rationale: Le terme désigne des combattants montés ; « cavalerie » est naturel en français moderne tout en conservant le sens collectif militaire.
- source_word: δυνάμεις
  choice: des troupes
  rationale: Le terme est général et désigne ici des forces militaires sans préciser leur type.
- source_word: ὅπως
  choice: afin que
  rationale: Cette locution exprime clairement la finalité marquée par la conjonction grecque.
- source_word: ἐκπορευόμενοι
  choice: qu’elles sortent
  rationale: Le participe indique que les forces quittent leur poste pour accomplir l’action militaire qui suit.
- source_word: ἐξοδεύωσιν
  choice: patrouiller
  rationale: Avec les routes pour complément et dans un cadre militaire, le verbe évoque le fait de parcourir les voies afin de les surveiller ou de les contrôler, sans exclure une activité hostile.
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: sur les routes de la Judée
  rationale: Cette formulation française rend naturellement le déplacement le long des routes tout en conservant le complément géographique.
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: comme le roi le lui avait ordonné
  rationale: Le plus-que-parfait marque l’ordre royal antérieur, et « ordonné » convient à l’autorité militaire du roi.
