  verdict: revise
  source_fidelity: La phrase conserve correctement la condition (« si donc »), le parfait de fuite, le mouvement vers les destinataires, l’impératif de remise à Simon, son titre de grand prêtre et le possessif pluriel ambigu dans « leur loi ». Toutefois, « leur fasse justice » signifie normalement en français rendre justice en leur faveur ou les traiter équitablement; ce sens ne rend pas l’objet accusatif de ἐκδικήσει ni sa portée punitive/judiciaire dans ce contexte.
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. La substitution de « leur fasse justice » par « les punisse » évite une ambiguïté française susceptible d’inverser le sens. « Hommes malfaisants » reste naturel tout en conservant l’injure hostile sans imposer la qualification juridique de « criminels ».
  terminology: « Grand prêtre » est le titre établi pour ἀρχιερεύς. « Leur loi » préserve à juste titre le pluriel αὐτῶν et son référent non précisé. « Punisse » exprime ici de façon sûre l’exercice de sanction que permet ἐκδικέω, tandis que la note maintient les nuances « exercer la justice » et « tirer vengeance ».
