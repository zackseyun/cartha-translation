base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: fr
  text: Si donc des hommes malfaisants[a] se sont échappés de leur pays pour venir chez nous, livrez-les à Simon, le grand prêtre, afin qu’il les punisse[b] conformément à leur loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des individus nuisibles », « des fauteurs de troubles ». Le grec emploie un terme très dur, apparenté au mot « fléau », pour désigner des personnes dangereuses ou malfaisantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il exerce la justice contre eux » ou « qu’il tire vengeance d’eux ». Le verbe grec peut aussi exprimer la vengeance, mais la mention de leur loi lui donne ici un sens principalement judiciaire.
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: hommes malfaisants
  rationale: Employé pour des personnes, λοιμοί est un terme fortement péjoratif désignant des individus nuisibles ou dangereux. « Hommes malfaisants » garde cette dureté dans un français naturel, sans supposer d’emblée une qualification pénale précise.
- source_word: διαπεφεύγασιν
  choice: se sont échappés
  rationale: Le parfait exprime une fuite accomplie dont le résultat demeure; le passé composé français convient naturellement au contexte d’extradition.
- source_word: χώρας
  choice: pays
  rationale: χώρα désigne ici le territoire dont les fugitifs sont partis. « Pays » est suffisamment large et idiomatique sans préciser davantage le statut politique.
- source_word: πρὸς ἡμᾶς
  choice: pour venir chez nous
  rationale: La préposition marque ici le mouvement vers les destinataires. Cette formulation explicite naturellement en français la destination de la fuite.
- source_word: παράδοτε
  choice: livrez-les
  rationale: L’impératif ordonne le transfert des fugitifs sous l’autorité de Simon. « Livrer » est le terme français usuel dans ce contexte juridique et politique.
- source_word: ἀρχιερεῖ
  choice: grand prêtre
  rationale: « Grand prêtre » est l’équivalent français établi du titre juif ἀρχιερεύς.
- source_word: ἐκδικήσει
  choice: leur fasse justice
  rationale: ἐκδικέω peut évoquer la punition, l’exercice de la justice ou la vengeance. La tournure retenue conserve la portée judiciaire favorisée par « conformément à leur loi », tout en laissant percevoir la sévérité du verbe.
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: conformément à leur loi
  rationale: Le pronom grec est au pluriel (« leur »). La traduction le préserve au lieu de l’harmoniser avec Simon au singulier ou d’identifier explicitement le groupe visé.
theological_decisions:
- issue: Portée de ἐκδικήσει dans un contexte juridico-politique
  choice: exercice de la justice, potentiellement punitive
  alternative: qu’il les punisse / qu’il tire vengeance d’eux
  rationale: La mention de la loi encadre l’action comme une procédure judiciaire plutôt que comme une vengeance privée. « Leur fasse justice » conserve néanmoins l’ambivalence du verbe entre rendre justice et exercer une sanction.
- issue: Référent de αὐτῶν dans « leur loi »
  choice: maintien du pluriel ambigu
  alternative: sa loi / la loi des Juifs
  rationale: Le grec porte αὐτῶν, « leur », sans lever entièrement l’ambiguïté du référent. Le texte français ne doit pas la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle, la vigueur de l’ordre d’extradition et l’ambiguïté du possessif pluriel. « Hommes malfaisants » évite à la fois le calque vieilli « hommes pestilentiels » et le terme juridiquement plus précis « criminels ».
