  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: fr
  text: Mais le roi Antiochos établit son camp contre Dora pour la deuxième fois[a]. Il lançait sans relâche ses troupes contre la ville[b] et construisait des machines de siège. Il enferma Tryphon, l’empêchant d’entrer ou de sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans la deuxième » ; le nom sous-entendu n’est pas précisé. Dans ce contexte, l’expression paraît désigner une deuxième opération militaire contre Dora.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « amenant sans cesse les mains contre elle » ; « les mains » désigne ici vraisemblablement les forces engagées dans l’assaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχος δὲ ὁ βασιλεὺς
  choice: Mais le roi Antiochos
  rationale: Le δέ marque ici une transition ou un contraste léger, naturellement rendu par « Mais ». La forme française courante du nom grec est « Antiochos ».
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: établit son camp contre Dôr
  rationale: Dans ce contexte militaire, παρεμβάλλω désigne l’établissement d’un camp, tandis que ἐπί indique une action hostile dirigée contre la ville. « Dôr » suit la forme française usuelle du toponyme biblique.
- source_word: ἐν τῇ δευτέρᾳ
  choice: pour la deuxième fois
  rationale: L’expression elliptique paraît signaler une seconde opération contre la ville. Comme le substantif sous-entendu n’est pas exprimé, une note conserve l’incertitude.
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: Il lançait sans relâche ses troupes contre la ville
  rationale: διὰ παντός exprime la continuité. Le sens littéral de τὰς χεῖρας, « les mains », fonctionne ici comme une expression militaire désignant les forces engagées; « ses troupes » rend ce sens en français naturel.
- source_word: μηχανὰς ποιούμενος
  choice: construisait des machines de siège
  rationale: Dans un siège, μηχαναί désigne des engins ou machines militaires. Cette formulation est claire sans préciser un type d’engin absent du grec.
- source_word: συνέκλεισεν τὸν Τρύφωνα
  choice: Il enferma ainsi Tryphon
  rationale: συγκλείω exprime l’action d’enfermer ou de bloquer de toutes parts. « ainsi » explicite sobrement le lien de résultat avec les opérations précédentes.
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: l’empêchant d’entrer ou de sortir
  rationale: La construction à l’infinitif articulé au génitif indique ici l’empêchement résultant du blocus. Le français garde les deux mouvements mentionnés dans le grec.
