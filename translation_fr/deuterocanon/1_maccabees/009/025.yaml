translation:
  language: fr
  text: Bacchidès choisit des hommes impies et les établit comme maîtres du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirigeants du pays ». Le grec dit littéralement « maîtres du pays » et souligne leur autorité sur le territoire.
