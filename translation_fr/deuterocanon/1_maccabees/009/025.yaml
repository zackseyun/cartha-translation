lexical_decisions:
- source_word: ἐξέλεξεν
  choice: choisit
  rationale: Le passé simple rend naturellement l’aoriste dans un récit historique et conserve le sens direct de choisir ou sélectionner.
- source_word: Βακχίδης
  choice: Bacchidès
  rationale: Forme française traditionnelle et transparente du nom propre grec.
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  choice: des hommes impies
  rationale: « Impies » conserve la dimension religieuse et morale de ἀσεβεῖς, tandis que « hommes » maintient la référence masculine explicite de ἄνδρας.
- source_word: κατέστησεν
  choice: les établit
  rationale: Le verbe indique que Bacchidès les plaça dans une position officielle d’autorité; « établit » reste proche du grec tout en étant idiomatique.
- source_word: κυρίους
  choice: maîtres
  rationale: « Maîtres » préserve le sens premier de κύριοι, personnes détenant autorité et pouvoir, sans réduire explicitement le terme à une fonction administrative.
- source_word: τῆς χώρας
  choice: du pays
  rationale: χώρα désigne ici le territoire ou le pays placé sous leur autorité; le complément français avec « de » reproduit la construction grecque.
