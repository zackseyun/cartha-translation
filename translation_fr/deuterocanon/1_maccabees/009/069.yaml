  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: fr
  text: Il se mit en colère contre les hommes sans loi qui lui avaient conseillé de venir dans le pays. Ils en tuèrent beaucoup[a], et il décida de retourner dans son propre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement « ils en tuèrent beaucoup ». Toutefois, les verbes qui encadrent cette proposition sont au singulier et le fil du récit peut laisser entendre que le même chef en est le sujet ; on pourrait donc aussi comprendre : « il en tua beaucoup ».'
    reason: Ambiguïté textuelle et syntaxique concernant le nombre du verbe et l’identité du sujet.
lexical_decisions:
- source_word: ὠργίσθη
  choice: il se mit en colère
  rationale: Cette tournure naturelle rend l’aoriste de ὀργίζομαι et sa nuance d’entrée dans un état de colère sans en exagérer l’intensité.
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: les hommes qui transgressaient la Loi
  rationale: Dans le contexte de 1 Maccabées, ἄνομος désigne des hommes qui enfreignent ou rejettent la Loi. Cette formulation conserve la portée morale et juridique du grec tout en évitant le français peu naturel « hommes sans loi ».
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: qui lui avaient conseillé
  rationale: Le participe aoriste désigne ceux qui lui avaient donné ce conseil avant sa colère; le plus-que-parfait exprime clairement cette antériorité.
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: de venir dans le pays
  rationale: χώρα peut désigner un pays, une contrée ou une région. « Le pays » convient ici au cadre géographique et militaire sans ajouter de nuance théologique.
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: ils en tuèrent beaucoup
  rationale: Le texte grec fourni porte sans ambiguïté morphologique un verbe à la troisième personne du pluriel. La traduction maintient cette forme, même si son sujet et le déroulement narratif soulèvent une difficulté signalée en note.
- source_word: ἐβουλεύσατο
  choice: il décida
  rationale: Dans ce contexte, le moyen ἐβουλεύσατο exprime une résolution arrêtée plutôt qu’une simple consultation.
- source_word: τοῦ ἀπελθεῖν
  choice: de repartir
  rationale: L’infinitif exprime le contenu de la décision. « Repartir » indique naturellement qu’il quitte le pays où il était venu.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: dans son propre pays
  rationale: γῆ désigne ici le territoire ou le pays d’origine du personnage; « propre » fait ressortir la valeur du possessif et le contraste avec le pays où il était venu.
