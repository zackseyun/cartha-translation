revisions:
- from: Il se mit en colère contre les hommes qui transgressaient la Loi et qui lui avaient conseillé de venir dans le pays. Ils en tuèrent beaucoup[a], puis il décida de repartir dans son propre pays.
  to: Il se mit en colère contre les hommes sans loi qui lui avaient conseillé de venir dans le pays. Ils en tuèrent beaucoup[a], et il décida de retourner dans son propre pays.
  rationale: La révision remplace une explicitation théologique et aspectuelle non exprimée dans le grec par « hommes sans loi », tout en conservant le pluriel attesté dans la proposition problématique et sa note explicative. Elle améliore aussi légèrement l’expression du retour vers le pays d’origine.
