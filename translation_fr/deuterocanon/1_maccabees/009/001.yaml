base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
translation:
  language: fr
  text: Démétrios apprit que Nicanor et ses forces avaient mené la guerre. Il envoya alors Bacchidès et Alcime pour la seconde fois au pays de Juda, avec l’aile droite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la corne droite » ; dans le langage militaire, cette expression désigne l’aile droite de l’armée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce récit, le verbe indique que Démétrios reçoit la nouvelle; « apprit » est plus naturel en français que le littéral « entendit », sans ajouter la manière dont l’information lui est parvenue.
- source_word: ἐποίησεν ... πόλεμον
  choice: avaient engagé le combat
  rationale: L’expression grecque signifie littéralement « avaient fait la guerre ». « Engagé le combat » rend naturellement l’action militaire, sans préciser une issue que le texte ne donne pas.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: ses forces
  rationale: « Forces » conserve l’étendue possible de δυνάμεις et évite de préciser qu’il s’agit d’une armée constituée.
- source_word: προσέθετο ... ἀποστεῖλαι
  choice: Il envoya alors de nouveau
  rationale: La construction idiomatique exprime une action renouvelée ou supplémentaire. Avec ἐκ δευτέρου, « envoya alors de nouveau » est naturel et évite le calque obscur « ajouta d’envoyer ».
- source_word: ἐκ δευτέρου
  choice: de nouveau
  rationale: L’expression marque explicitement la répétition. « De nouveau » convient au français narratif; le contexte antérieur établit qu’il s’agit d’un nouvel envoi.
- source_word: γῆν Ἰούδα
  choice: au pays de Juda
  rationale: Cette formulation suit le grec « terre/pays de Juda » et n’impose pas le nom régional conventionnel « Judée ».
- source_word: τὸ δεξιὸν κέρας
  choice: l’aile droite
  rationale: κέρας signifie littéralement « corne », mais désigne ici, dans le vocabulaire militaire, une aile de l’armée.
