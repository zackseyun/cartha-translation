base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: fr
  text: 'Judas dit : « Loin de moi l’idée de faire une chose pareille : fuir devant eux ! Notre heure approche. Mourons vaillamment[a] pour nos frères et ne laissons aucun motif de reproche ternir notre gloire[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mourons avec courage » ; le terme grec évoque la vaillance, avec une image littéralement associée au courage viril.
    reason: lexical_alternative
  - marker: b
    text: Ici, « gloire » peut aussi se comprendre comme « honneur » ou « réputation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: Loin de moi l’idée de
  rationale: Cette formule française actuelle exprime avec force le refus personnel porté par l’optatif grec, sans introduire une invocation divine absente du texte.
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο, φυγεῖν ἀπʼ αὐτῶν
  choice: 'faire une chose pareille : fuir devant eux'
  rationale: La formulation conserve le substantif πρᾶγμα et présente l’infinitif φυγεῖν comme l’explication de « cette chose ». Dans le contexte militaire, « fuir devant eux » est plus naturel que « fuir loin d’eux ».
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: Notre heure approche
  rationale: καιρός désigne ici le moment décisif, vraisemblablement celui de la mort au combat. « Notre heure » garde cette solennité et cette ambiguïté. Le grec est affirmatif et ne comporte aucun équivalent de « si ».
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: Mourons vaillamment
  rationale: Le tour rend l’exhortation et la notion de courage ou de vaillance exprimée par ἀνδρίᾳ, dans un français digne et naturel.
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: pour nos frères
  rationale: χάριν suivi du génitif signifie « pour » ou « en faveur de ». Le masculin explicite est maintenu dans ce contexte militaire et fraternel.
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  choice: ne laissons aucun motif de reproche ternir notre gloire
  rationale: αἰτία peut désigner un motif, une accusation ou une cause de blâme. Le verbe « ternir » rend naturellement en français le rapport entre le reproche et δόξα dans ce contexte d’honneur, sans réduire δόξα à une seule nuance.
theological_decisions:
- issue: Portée de ἀδελφῶν dans le contexte du combat
  choice: frères
  alternative: compatriotes ; frères et sœurs
  rationale: Le grec emploie un masculin pluriel qui, dans cette scène militaire, vise directement les compagnons ou membres masculins du peuple. « Frères » respecte cette forme sans élargissement non marqué par le texte.
- issue: Sens de δόξα dans un contexte d’honneur et de honte
  choice: gloire
  alternative: honneur ; réputation
  rationale: « Gloire » maintient le lien lexical avec δόξα, tandis que la mention du reproche et le verbe « ternir » rendent perceptible le sens contextuel d’honneur ou de réputation.
- issue: Valeur de καὶ devant ἤγγικεν
  choice: 'énoncé affirmatif séparé : « Notre heure approche »'
  alternative: « Et si notre heure approche »
  rationale: Le texte grec transmis contient καὶ, non une particule conditionnelle. La traduction n’introduit donc pas une hypothèse absente de la source.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La ponctuation met en relief le refus de Judas et l’exhortation qui suit. Les deux notes sont placées immédiatement après les expressions qu’elles expliquent.
