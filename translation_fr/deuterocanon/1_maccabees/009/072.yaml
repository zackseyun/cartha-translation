  yaml_path: translation/deuterocanon/1_maccabees/009/072.yaml
  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: fr
  text: Il lui rendit les captifs qu’il avait autrefois emmenés du pays de Juda[a]. Puis il fit demi-tour et partit pour son pays, et il ne revint plus sur leur territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « la captivité », expression qui désigne ici l’ensemble des personnes emmenées captives.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque signifie qu’il ne vint plus ou qu’il cessa de venir sur leur territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: rendit
  rationale: Le verbe signifie ici rendre ce qui avait été pris; « rendit » est direct et naturel en français.
- source_word: τὴν αἰχμαλωσίαν
  choice: les captifs
  rationale: Le nom abstrait « captivité » désigne ici collectivement les personnes emmenées captives; le concret « les captifs » exprime clairement le référent.
- source_word: ᾐχμαλώτευσεν
  choice: avait autrefois emmenés
  rationale: Dans ce contexte militaire, le verbe évoque des personnes capturées puis emmenées. Le statut de captifs étant déjà exprimé par le complément, cette formulation évite une répétition lourde.
- source_word: τὸ πρότερον
  choice: autrefois
  rationale: Cette expression situe la capture à une époque antérieure à la restitution.
- source_word: ἐκ γῆς Ἰούδα
  choice: du pays de Juda
  rationale: « Pays » conserve la référence géographique explicite de γῆ, tandis que « Juda » est la forme française traditionnelle du nom.
- source_word: ἀποστρέψας ἀπῆλθεν
  choice: il rebroussa chemin et retourna
  rationale: La formulation restitue le mouvement de retour exprimé par le participe et le verbe principal, dans un français narratif fluide.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: dans son propre pays
  rationale: « Son propre pays » préserve la valeur possessive de αὐτοῦ et le sens territorial de γῆ.
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: il ne revint plus
  rationale: L’idiome προστίθημι suivi de l’infinitif exprime la répétition ou la continuation d’une action; ici, « ne revint plus » est naturel et garde cette valeur.
- source_word: εἰς τὰ ὅρια αὐτῶν
  choice: sur leur territoire
  rationale: Au pluriel, ὅρια peut désigner les limites territoriales ou la région qu’elles délimitent. « Sur leur territoire » convient naturellement au verbe de mouvement.
