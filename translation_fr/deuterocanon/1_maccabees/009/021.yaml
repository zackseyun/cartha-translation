  text: How the mighty one has fallen, he who was saving Israel.
translation:
  language: fr
  text: Comment le vaillant est tombé[a], lui qui sauvait Israël !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette formulation fait écho à la lamentation biblique : « Comment les vaillants sont-ils tombés ! » (voir 2 Samuel 1.19, 25, 27).'
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: Comment
  rationale: Introduit ici une exclamation de lamentation, non une question. « Comment » conserve la formule biblique sans ajouter « hélas ».
- source_word: ἔπεσεν
  choice: est tombé
  rationale: L’aoriste exprime la chute, ici la mort, du héros. Le passé composé convient naturellement en français à cette lamentation sur un événement accompli.
- source_word: δυνατός
  choice: le vaillant
  rationale: L’adjectif substantivé désigne un homme puissant ou valeureux. « Le vaillant » garde le singulier, la dignité poétique et la résonance de la formule de lamentation, sans préciser indûment « guerrier ».
- source_word: σώζων
  choice: lui qui sauvait
  rationale: Le participe présent décrit une action en cours ou caractéristique. L’imparfait français exprime naturellement cette continuité antérieure à sa mort.
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Le nom propre est complément direct ; le français n’emploie pas d’article dans cette construction.
theological_decisions:
- issue: Écho à la formule biblique de lamentation
  choice: « Comment le vaillant est tombé »
  alternative: « Comme il est tombé, l’homme puissant »
  rationale: Cette formulation préserve l’écho probable à la lamentation de 2 Samuel 1 ainsi que sa force exclamative, sans transformer l’allusion en citation explicite.
translation_notes:
  register: Français moderne, digne et légèrement poétique. Le point d’exclamation rend explicite la valeur exclamative de Πῶς. La formulation conserve le singulier grec et évite d’ajouter le nom de Judas.
