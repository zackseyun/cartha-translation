  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
translation:
  language: fr
  text: Jonathan l’apprit et envoya auprès de lui des émissaires[a] pour conclure la paix avec lui et leur rendre les captifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des ambassadeurs » : le terme grec désigne des représentants officiels chargés d’une mission diplomatique.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la captivité » ; le mot désigne ici collectivement les personnes emmenées captives.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprit
  rationale: L’aoriste de γινώσκω exprime ici l’accès à une information liée au contexte précédent. « L’apprit » est naturel et conserve la reprise implicite de l’objet.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent direct et idiomatique de ἀποστέλλω dans ce contexte.
- source_word: πρέσβεις
  choice: des émissaires
  rationale: Le terme désigne des représentants officiels chargés d’une mission diplomatique. « Émissaires » convient mieux en français moderne à une délégation ponctuelle qu’« ambassadeurs ».
- source_word: τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην
  choice: pour conclure la paix avec lui
  rationale: L’infinitif articulé exprime le but; συντίθεσθαι avec εἰρήνην désigne l’établissement d’un accord de paix. « Conclure la paix » garde la tonalité diplomatique sans imposer la notion plus précise de traité.
- source_word: ἀποδοῦναι
  choice: obtenir qu’il leur rende
  rationale: L’infinitif est coordonné au but de la mission. Cette formulation française explicite naturellement que les émissaires cherchent à faire rendre les captifs, sans changer le sujet logique du verbe.
- source_word: τὴν αἰχμαλωσίαν
  choice: les captifs
  rationale: Le nom abstrait « captivité » désigne ici collectivement les personnes emmenées captives. Le concret « les captifs » communique clairement le référent.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom grec ne précise pas davantage l’identité du groupe bénéficiaire; « leur » préserve cette indétermination.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise; « émissaires » rend la fonction diplomatique sans suggérer nécessairement une charge permanente. Les deux pronoms renvoyant au même interlocuteur sont conservés, et le bénéficiaire de la restitution demeure aussi indéterminé que dans le grec.
