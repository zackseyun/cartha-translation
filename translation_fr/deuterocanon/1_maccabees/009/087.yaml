  text: Jonathan returned with those who were with him[a], carrying much plunder.
translation:
  language: fr
  text: Jonathan revint avec ceux qui l’accompagnaient[a], emportant un important butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit demi-tour avec ceux qui étaient avec lui, ayant de nombreuses dépouilles ».'
    reason: Alternative plus littérale qui conserve les valeurs possibles de στρέφω, de la tournure τοῖς παρʼ αὐτοῦ et du participe ἔχοντες.
lexical_decisions:
- source_word: στρεψεν
  choice: revint
  rationale: Dans ce contexte narratif, l’aoriste de στρέφω exprime un retour ou un mouvement en sens inverse. « Revint » est naturel et conserve ce mouvement.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: avec ceux qui l’accompagnaient
  rationale: La tournure désigne le groupe qui se trouvait avec Jonathan. Cette traduction reste proche du grec sans préciser qu’il s’agissait de soldats, même si le contexte peut le suggérer.
- source_word: ἔχοντες
  choice: emportant
  rationale: Le participe indique une circonstance accompagnant le retour de Jonathan et de ses compagnons. Avec un butin matériel, « emportant » rend naturellement l’idée de possession et de transport.
- source_word: σκῦλα πολλά
  choice: un important butin
  rationale: σκῦλα désigne les dépouilles ou le butin pris lors d’un combat. « Un important butin » est clair en français moderne et rend la quantité exprimée par πολλά.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite de surinterpréter les accompagnateurs comme des soldats et emploie « butin », terme courant dans un récit de guerre.
