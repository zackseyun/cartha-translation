  yaml_path: translation/deuterocanon/1_maccabees/009/046.yaml
  text: Now then[a], cry out to heaven, so that you may be delivered from the hand of our enemies.
translation:
  language: fr
  text: Maintenant donc, criez vers le ciel[a], afin d’être délivrés de la main de nos ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Dieu » ; le grec porte « vers le ciel », expression révérencielle pouvant désigner le domaine divin ou Dieu lui-même.
    reason: alternative lexicale et explicitation de la métonymie
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Cette expression marque à la fois le moment présent et une transition logique pressante. « Maintenant donc » conserve ces deux valeurs dans un registre biblique clair.
- source_word: κεκράξατε
  choice: criez
  rationale: L’impératif aoriste de κράζω exprime ici un appel pressant adressé au ciel. « Criez » en restitue la force sans ajouter explicitement l’idée de prière.
- source_word: εἰς οὐρανόν
  choice: vers le ciel
  rationale: Le grec dit littéralement « vers le ciel ». Celui-ci peut désigner par révérence le domaine divin ou Dieu lui-même; la traduction conserve la formulation et son ambiguïté.
- source_word: ὅπως
  choice: afin de
  rationale: La conjonction introduit le but recherché. Avec l’infinitif passif français, « afin de » exprime naturellement cette valeur finale.
- source_word: διασωθῆτε
  choice: être délivrés
  rationale: Le passif de διασῴζω désigne ici le fait d’être tirés d’un danger militaire. « Être délivrés » convient au contexte sans imposer un sens sotériologique plus large.
- source_word: ἐκ χειρὸς
  choice: de la main de
  rationale: L’expression idiomatique évoque le pouvoir ou l’emprise. La conservation de l’image de la main reste naturelle et reconnaissable en français biblique.
- source_word: ἐχθρῶν ἡμῶν
  choice: nos ennemis
  rationale: Cette tournure rend directement et naturellement le génitif grec accompagné du possessif.
theological_decisions:
- issue: Faut-il rendre « ciel » littéralement ou expliciter la référence à Dieu ?
  choice: vers le ciel
  alternative: vers Dieu
  rationale: Le grec nomme le ciel, probablement comme métonymie révérencielle de Dieu ou du domaine divin, mais il ne nomme pas Dieu explicitement. La traduction préserve donc la formulation et la retenue théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’urgence de l’exhortation ainsi que l’image biblique de « la main » sans expliciter davantage la métonymie du ciel.
