  text: And Jonathan said to his brothers[a], “Let us rise now and fight for our lives, for today is not as yesterday and the day before.”
translation:
  language: fr
  text: 'Jonathan dit à ses frères : « Levons-nous maintenant et combattons pour nos vies, car aujourd’hui n’est pas comme hier et avant-hier[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « comme hier et le troisième jour », expression qui signifie ici « comme hier et avant-hier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: Levons-nous
  rationale: Le subjonctif aoriste a ici une valeur exhortative. « Levons-nous » conserve l’élan et l’urgence militaire du grec.
- source_word: πολεμήσωμεν
  choice: combattons
  rationale: Le verbe désigne l’action de livrer bataille. « Combattons » est naturel dans cette exhortation militaire.
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: pour sauver nos vies
  rationale: Dans ce contexte de danger immédiat, ψυχή désigne la vie menacée, non l’âme immatérielle. L’ajout de « sauver » explicite naturellement en français la finalité exprimée par ὑπέρ.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent direct et courant de l’adverbe temporel grec.
- source_word: ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: comme hier et avant-hier
  rationale: L’expression grecque oppose la situation présente à celle des deux jours précédents. « Hier et avant-hier » en restitue clairement le sens idiomatique.
- source_word: ἀδελφοῖς
  choice: frères
  rationale: Le grec emploie explicitement le terme masculin familial. « Frères » en conserve la forme sans préciser s’il s’agit uniquement de frères au sens propre ou aussi de proches compagnons.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’exhortation militaire reste vive, tandis que l’expression temporelle grecque est rendue idiomatiquement et accompagnée d’une note littérale.
