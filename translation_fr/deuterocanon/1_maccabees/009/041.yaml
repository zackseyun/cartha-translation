  text: And the wedding was turned into mourning[a], and the sound of their musicians into lamentation.
translation:
  language: fr
  text: Et la noce se changea en deuil, et le son de leurs musiciens[a] en lamentation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le son de leurs instruments de musique ». Le grec μουσικῶν peut désigner les musiciens ou la musique produite par des instruments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεστράφη
  choice: se changea en
  rationale: Le passif grec exprime un renversement d’état. La tournure pronominale française est naturelle et conserve le contraste soudain entre la fête et le deuil.
- source_word: ὁ γάμος
  choice: la noce
  rationale: Dans le contexte, le terme désigne la célébration publique du mariage plutôt que l’union matrimoniale elle-même. « La noce » rend cet événement de façon concise et actuelle.
- source_word: πένθος
  choice: deuil
  rationale: Le mot grec désigne le deuil suscité par la mort ou un malheur, ce qui forme ici le contraste cérémoniel précis avec la noce.
- source_word: φωνὴ
  choice: le son
  rationale: Bien que le sens premier soit « voix », le contexte musical appelle naturellement « le son » en français.
- source_word: μουσικῶν
  choice: musiciens
  rationale: Le génitif pluriel peut désigner les musiciens ou ce qui relève de la musique. Le sens personnel s’intègre directement au contexte, tandis que la lecture instrumentale est conservée en note.
- source_word: θρῆνον
  choice: lamentation
  rationale: Le nom désigne une plainte funèbre, éventuellement chantée. « Lamentation » maintient le registre solennel et le parallélisme avec « deuil ».
