base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: fr
  text: Ils combattirent Bacchidès, et il fut écrasé par eux ; ils le pressèrent avec force, car son plan et son attaque furent vains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vide » ; c’est-à-dire sans effet.'
    reason: La note signale le sens littéral de κενή tout en expliquant la traduction idiomatique « furent vains ».
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: combattirent
  rationale: Avec πρός et l’accusatif, πολεμέω exprime ici un combat dirigé contre Bacchidès. « Combattirent » rend naturellement l’action hostile en français, le complément direct suffisant à exprimer l’opposition.
- source_word: συνετρίβη
  choice: fut écrasé
  rationale: Le passif de συντρίβω évoque littéralement le fait d’être brisé ou écrasé. Dans ce contexte militaire, « fut écrasé » conserve cette image forte tout en exprimant la défaite.
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: ils le pressèrent vivement
  rationale: θλίβω signifie presser, accabler ou opprimer. Dans une scène de combat, « presser vivement » traduit la forte pression militaire, σφόδρα étant rendu par « vivement ».
- source_word: βουλή
  choice: plan
  rationale: βουλή désigne ici le dessein ou le plan conçu par Bacchidès. « Plan » est clair, courant et assez large pour ne pas préciser indûment la nature de sa stratégie.
- source_word: ἔφοδος
  choice: attaque
  rationale: ἔφοδος peut désigner une attaque, un assaut ou une avance offensive. « Attaque » convient directement au contexte militaire.
- source_word: κενή
  choice: furent vains
  rationale: κενός signifie littéralement « vide », mais prend ici le sens figuré de ce qui est sans résultat ou inutile. « Furent vains » conserve ce sens tout en formant une phrase naturelle avec les deux sujets coordonnés.
- source_word: Βακχίδην
  choice: Bacchidès
  rationale: Le nom propre grec est translittéré selon sa forme française traditionnelle.
