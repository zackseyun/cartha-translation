  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: fr
  text: Ceux de l’aile gauche[a], voyant que l’aile droite avait été écrasée, firent demi-tour et poursuivirent Judas et ceux qui étaient avec lui de près, par-derrière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « corne gauche » et « corne droite » ; dans le vocabulaire militaire grec, ces expressions désignent les ailes ou les flancs d’une armée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « firent demi-tour sur les pas de Judas et de ceux qui étaient avec lui, depuis l’arrière » ; l’expression décrit une poursuite serrée par-derrière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: aile gauche / aile droite
  rationale: κέρας signifie littéralement « corne », mais désigne ici, dans le vocabulaire militaire grec, une aile de l’armée. « Aile » est le terme français naturel dans ce contexte et conserve le parallélisme.
- source_word: συνετρίβη
  choice: avait été écrasée
  rationale: Le verbe exprime l’idée d’être brisé ou écrasé. Le plus-que-parfait rend l’antériorité de l’effondrement de l’aile droite par rapport à la réaction de l’aile gauche, sans préciser davantage la nature de sa défaite.
- source_word: ἐπέστρεψαν
  choice: firent demi-tour
  rationale: Dans ce contexte de bataille, le verbe indique un changement de direction. « Firent demi-tour » exprime clairement ce mouvement sans laisser entendre un retour vers un lieu précis.
- source_word: κατὰ πόδας … ἐκ τῶν ὄπισθεν
  choice: talonnèrent par-derrière
  rationale: κατὰ πόδας évoque une poursuite immédiate, littéralement « sur les pas » ou « aux talons », tandis que ἐκ τῶν ὄπισθεν en précise la position arrière. La formulation française conserve les deux éléments sans ajouter explicitement une attaque absente du grec.
- source_word: τῶν μετʼ αὐτοῦ
  choice: ceux qui l’accompagnaient
  rationale: Cette expression désigne simplement les personnes qui étaient avec Judas. La traduction reste générale et n’ajoute pas la précision interprétative « ses hommes ».
