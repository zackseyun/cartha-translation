  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: fr
  text: Le combat se resserra[a]. Jonathan étendit la main pour frapper Bacchidès, mais celui-ci s’écarta de lui en reculant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le combat devint plus intense ». Le verbe grec peut évoquer soit un affrontement qui se resserre, soit des combats qui s’intensifient.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il s’écarta de lui vers l’arrière ». Le grec souligne le mouvement d’évitement de Bacchidès.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν ὁ πόλεμος
  choice: Le combat se resserra
  rationale: Dans ce contexte, συνάγω employé à propos du combat évoque l’affrontement qui se resserre ou gagne en intensité. Cette formulation conserve l’image grecque sans être obscure.
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: étendit la main
  rationale: Rend directement l’expression grecque et laisse visible le geste qui précède la tentative de frapper.
- source_word: πατάξαι
  choice: pour frapper
  rationale: « Frapper » exprime naturellement la force du verbe sans archaïsme ni précision indue sur l’arme employée.
- source_word: Βακχίδην
  choice: Bacchidès
  rationale: Translittération française traditionnelle du nom grec.
- source_word: ἐξέκλινεν ἀπ᾿ αὐτοῦ εἰς τὰ ὀπίσω
  choice: celui-ci s’écarta de lui en reculant
  rationale: « S’écarta » restitue le mouvement d’évitement, tandis que « en reculant » conserve la direction vers l’arrière. « Celui-ci » identifie naturellement Bacchidès comme sujet implicite sans surinterpréter le type précis de manœuvre.
