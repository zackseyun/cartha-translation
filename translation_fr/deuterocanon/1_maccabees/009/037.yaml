  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: fr
  text: Après ces paroles, on annonça à Jonathan et à Simon, son frère, que les fils de Jambri célébraient de grandes noces et amenaient de Nadabath la mariée, fille de l’un des grands dignitaires de Canaan, avec une grande escorte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande procession ». Le grec παραπομπή peut désigner l’escorte qui accompagne ou la procession festive elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: Après ces paroles
  rationale: La formule assure la transition temporelle. « Paroles » rend λόγους au plus près tout en renvoyant naturellement à ce qui vient d’être rapporté.
- source_word: ἀπηγγέλησαν
  choice: on annonça
  rationale: Le tour impersonnel français restitue le passif grec sans introduire un sujet absent du texte.
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: à Jonathan et à Simon, son frère
  rationale: Le datif désigne les destinataires, et l’apposition identifie naturellement Simon comme le frère de Jonathan.
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: les fils de Jambri
  rationale: Cette formulation transparente conserve la désignation familiale ou clanique du grec.
- source_word: ποιοῦσιν γάμον μέγαν
  choice: célébraient de grandes noces
  rationale: ποιεῖν γάμον est une expression idiomatique désignant la célébration d’un mariage. « De grandes noces » rend μέγαν dans un français naturel et digne.
- source_word: ἄγουσι τὴν νύμφην
  choice: amenaient … la mariée
  rationale: Dans ce contexte nuptial, ἄγω exprime le déplacement de la mariée vers le lieu des noces; « amenaient » reste plus neutre que « escortaient », déjà exprimé ensuite.
- source_word: ἀπὸ Ναδαβάθ
  choice: de Nadabath
  rationale: La préposition marque le point de départ; le nom de lieu est translittéré d’après le témoin grec.
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: fille de l’un des hauts dignitaires de Canaan
  rationale: μεγιστάν désigne un personnage de très haut rang. « Hauts dignitaires » exprime clairement ce statut sans reproduire lourdement la tournure emphatique grecque.
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: avec une imposante escorte
  rationale: παραπομπή peut désigner l’escorte accompagnatrice ou la procession elle-même. « Imposante escorte » privilégie le sens concret tout en conservant l’idée de grandeur.
