  text: And they set out and went to Berea with twenty thousand men and two thousand horsemen[a].
translation:
  language: fr
  text: Ils levèrent le camp et se rendirent à Bérée avec vingt mille hommes et deux mille cavaliers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « deux mille chevaux » ; dans ce contexte militaire, l’expression désigne probablement des troupes montées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆραν
  choice: levèrent le camp
  rationale: Dans ce contexte militaire, le verbe exprime le départ d’une troupe, souvent après avoir levé le camp. Cette tournure française est naturelle sans préciser davantage les circonstances.
- source_word: ἐπορεύθησαν
  choice: se rendirent
  rationale: Le verbe courant signifie aller ou cheminer. « Se rendirent » exprime simplement le déplacement vers la destination, sans ajouter explicitement l’idée de marche militaire.
- source_word: εἰς Βερέαν
  choice: à Bérée
  rationale: εἰς suivi d’un nom de lieu marque ici la direction. « Bérée » est la forme française traditionnelle et intelligible du toponyme.
- source_word: ἐν εἴκοσι χιλιάσιν ἀνδρῶν
  choice: avec vingt mille hommes
  rationale: Dans cette construction, ἐν indique la force qui accompagne le déplacement. « Avec » rend naturellement cette valeur en français.
- source_word: δισχιλίοις ἵπποις
  choice: deux mille cavaliers
  rationale: Le grec dit littéralement « deux mille chevaux », mais, dans ce récit militaire, les chevaux désignent probablement par métonymie les troupes montées. « Cavaliers » transmet clairement ce sens tout en signalant la formulation littérale en note.
