  verdict: revise
  source_fidelity: La traduction rend correctement la progression militaire, la cavalerie, les frondeurs et les archers. Toutefois, « pour aller à leur rencontre » ajoute une nuance de mouvement (« aller ») absente de ἔστησαν εἰς συνάντησιν αὐτοῖς, qui exprime plutôt le fait de se placer ou de se ranger face à eux. La dernière proposition est une interprétation possible de la syntaxe condensée, mais la formulation française actuelle présente cette lecture comme certaine alors que l’ambiguïté mérite d’être maintenue dans le texte principal.
  naturalness: Le français est globalement clair et d’un registre narratif approprié. « Se rangèrent pour les affronter » est plus idiomatique et plus précis dans un contexte de déploiement que « prirent position pour aller à leur rencontre ». « En deux parties » est plus neutre que « en deux corps », qui peut suggérer un découpage tactique ou une unité militaire moderne non explicitée par μέρη.
  terminology: « Troupes », « cavalerie », « frondeurs » et « archers » sont des équivalents justes et naturels. Pour οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί, « tous les hommes vaillants étaient au premier rang » conserve mieux la construction et l’ambiguïté de l’original, sans décider que πρωταγωνισταί est nécessairement le sujet identifié aux hommes vaillants.
  issues:
