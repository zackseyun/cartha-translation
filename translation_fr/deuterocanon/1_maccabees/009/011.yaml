  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: fr
  text: Les troupes quittèrent le camp et se rangèrent pour les affronter. La cavalerie fut divisée en deux parties; les frondeurs et les archers marchaient devant les troupes, et tous les hommes vaillants étaient au premier rang.[a]
