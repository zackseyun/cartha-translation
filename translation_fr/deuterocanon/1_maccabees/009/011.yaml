    text: 'Ou : « tous les hommes vaillants étaient les combattants de première ligne ». L’expression grecque est condensée; πρωταγωνισταί désigne vraisemblablement ceux qui combattent au premier rang.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: ἀπῆρεν ἡ δύναμις ἀπὸ τῆς παρεμβολῆς
  choice: Les troupes quittèrent le camp
  rationale: Dans ce contexte militaire, δύναμις désigne le corps de troupes engagé. Le pluriel collectif « les troupes » rend naturellement le passage, qui passe en grec d’un verbe singulier à un verbe pluriel, tandis que « quittèrent le camp » exprime clairement leur mise en mouvement.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: prirent position pour aller à leur rencontre
  rationale: L’expression évoque une troupe qui se place en vue de l’affrontement. « Prirent position » conserve l’idée de ἔστησαν, et « aller à leur rencontre » rend εἰς συνάντησιν sans préciser davantage l’issue du face-à-face.
- source_word: ἡ ἵππος
  choice: la cavalerie
  rationale: Le singulier collectif grec désigne ici les troupes montées; « la cavalerie » est l’équivalent militaire français courant.
- source_word: ἐμερίσθη ... εἰς δύο μέρη
  choice: fut divisée en deux corps
  rationale: « Deux corps » exprime une répartition tactique en deux groupes, sans suggérer nécessairement des divisions militaires au sens technique moderne.
- source_word: οἱ σφενδονῆται καὶ οἱ τοξόται
  choice: les frondeurs et les archers
  rationale: Ce sont les termes militaires français usuels correspondant aux soldats armés respectivement de frondes et d’arcs.
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: marchaient devant les troupes
  rationale: Le verbe indique qu’ils avançaient en avant du corps principal. « Marchaient devant » conserve cette indication de position sans leur attribuer un rôle de commandement.
- source_word: οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί
  choice: les combattants de première ligne étaient tous des hommes vaillants
  rationale: πρωταγωνισταί désigne vraisemblablement ceux qui combattent au premier rang. La construction grecque est condensée; cette formulation conserve le rapport prédicatif le plus direct entre les combattants de tête et les hommes vaillants.
