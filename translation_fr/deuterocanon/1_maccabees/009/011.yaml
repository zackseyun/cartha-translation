    issue: Ajout de mouvement dans « pour aller à leur rencontre »
    rationale: ἔστησαν évoque le fait de se tenir ou de se ranger pour rencontrer l’adversaire; « aller » introduit un déplacement qui n’est pas exprimé.
  - severity: medium
    issue: Ambiguïté de la proposition finale insuffisamment préservée dans le texte principal
    rationale: La phrase grecque καὶ οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί est elliptique et admet plusieurs articulations. « Les combattants de première ligne étaient tous des hommes vaillants » privilégie une analyse prédicative; « tous les hommes vaillants étaient au premier rang » reste plus proche de l’ambiguïté également relevée dans la note anglaise.
  - severity: low
    issue: « Deux corps » est un peu plus spécifique que μέρη
    rationale: μέρη signifie simplement « parties ». « Deux parties » évite une coloration d’organisation militaire moderne tout en restant naturelle.
