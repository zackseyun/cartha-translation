  text: And Judas was encamped at Alasa, and three thousand chosen men were with him.
translation:
  language: fr
  text: Judas était campé à Alasa, et trois mille hommes d’élite étaient avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: avait établi son camp
  rationale: Le participe parfait de παρεμβάλλω exprime ici, dans un contexte militaire, l’état résultant de l’installation du camp. Cette formulation française est naturelle et conserve la valeur aspectuelle du parfait.
- source_word: ἐν Ἀλασά
  choice: à Alasa
  rationale: Devant un nom de lieu désignant l’emplacement d’un camp, « à » est idiomatique en français. Le toponyme est translittéré sans être traduit.
- source_word: τρισχίλιοι
  choice: trois mille
  rationale: Rendu direct du nombre cardinal grec.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec dit explicitement « hommes ». Le contexte militaire est clair, mais traduire par « soldats » ajouterait une précision qui n’est pas formulée.
- source_word: ἐκλεκτοὶ
  choice: d’élite
  rationale: Dans ce contexte militaire, ἐκλεκτοί désigne des hommes sélectionnés ou de choix. « Hommes d’élite » est naturel en français et exprime leur caractère choisi sans lourdeur.
- source_word: μετʼ αὐτοῦ
  choice: étaient avec lui
  rationale: Rendu direct de la présence des hommes auprès de Judas, sans ajouter l’idée qu’ils l’accompagnaient en mouvement.
