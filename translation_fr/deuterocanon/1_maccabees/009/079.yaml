  text: secrètement derrière eux[a]. Jonathan comprit qu’il s’agissait d’une embuscade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé commence ici par un fragment de phrase : « secrètement derrière eux. Jonathan comprit qu’il s’agissait d’une embuscade. » Ce début abrupt dépend vraisemblablement du contexte précédent plutôt que de constituer une phrase complète et autonome dans ce verset.'
    reason: textual_variant
lexical_decisions:
- source_word: κρυπτῶς
  choice: secrètement
  rationale: L’adverbe exprime une action menée de manière cachée. « Secrètement » est naturel et conserve le caractère clandestin de la manœuvre.
- source_word: κατόπισθεν
  choice: derrière
  rationale: Le terme a ici un sens spatial et indique une position à l’arrière, ce qui convient au contexte militaire.
- source_word: αὐτῶν
  choice: eux
  rationale: Le pronom est au génitif pluriel et renvoie donc à un groupe mentionné dans le contexte précédent.
- source_word: ἔγνω
  choice: comprit
  rationale: L’aoriste de γινώσκω peut signifier « sut », « reconnut » ou « comprit ». Ici, « comprit » rend naturellement la prise de conscience de Jonathan sans préciser davantage son mode de connaissance.
- source_word: ἔνεδρον
  choice: une embuscade
  rationale: Le substantif désigne une embuscade ou des hommes postés en embuscade. « Une embuscade » préserve cette légère latitude tout en étant idiomatique en français.
