base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/014.yaml
  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: fr
  text: Judas vit que Bacchidès et le gros de l’armée se trouvaient sur l’aile droite[a]. Alors tous les hommes au cœur vaillant se rallièrent à lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « la force principale du camp » ou « la partie la plus forte de l’armée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous ceux qui étaient courageux de cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεν
  choice: vit
  rationale: L’aoriste de ὁράω exprime ici la constatation directe de Judas dans le récit militaire, sans qu’il soit nécessaire de préciser « comprit ».
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: le gros de l’armée
  rationale: στερέωμα désigne ce qui constitue la force ou le corps solide, et παρεμβολή l’armée en ordre de bataille ou le camp. Dans ce contexte, « le gros de l’armée » désigne naturellement le corps principal et fort des troupes, tout en laissant ouverte la nuance exacte de στερέωμα.
- source_word: ἐν τοῖς δεξιοῖς
  choice: sur l’aile droite
  rationale: Le pluriel substantivé désigne le côté droit; dans cette scène de bataille, « l’aile droite » explicite naturellement sa valeur militaire.
- source_word: συνῆλθον αὐτῷ
  choice: se rallièrent à lui
  rationale: Le verbe indique que les combattants se regroupent auprès de Judas. « Se rallièrent à lui » rend à la fois le mouvement collectif et l’adhésion tactique sans ajouter l’idée qu’ils l’entouraient.
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: tous les hommes au cœur vaillant
  rationale: εὔψυχοι exprime le courage, tandis que τῇ καρδίᾳ en situe la qualité dans le cœur. « Au cœur vaillant » conserve l’image de l’original dans un français digne et intelligible; « hommes » correspond aux combattants masculins du contexte.
theological_decisions:
- issue: Référence genrée dans le contexte militaire
  choice: tous les hommes au cœur vaillant
  alternative: tous ceux qui avaient le cœur vaillant
  rationale: Le masculin pluriel désigne ici les combattants du récit. La formulation choisie conserve cette référence contextuelle sans la généraliser ni la neutraliser.
- issue: Identification de στερέωμα comme corps de troupes
  choice: le gros de l’armée
  alternative: la force principale du camp
  rationale: Le contexte immédiat est celui du dispositif de bataille. La traduction retient le sens militaire probable, tout en signalant en note que le grec peut insister plus précisément sur la partie la plus forte ou la plus ferme des troupes.
translation_notes:
  register: Français international moderne, narratif et digne. « Bacchidès » suit la forme française traditionnelle du nom. « Le gros de l’armée » et « se rallièrent » donnent une formulation militaire naturelle, tandis que « au cœur vaillant » préserve l’image de l’original.
