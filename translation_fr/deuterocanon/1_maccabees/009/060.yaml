  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: fr
  text: Il renonça à venir avec une grande force et envoya secrètement des lettres à tous ses alliés qui se trouvaient en Judée, afin qu’ils se saisissent de Jonathan et de ceux qui étaient avec lui. Mais il n’y parvint pas[a], car Jonathan et ceux qui étaient avec lui eurent connaissance de leur projet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est au singulier : « il n’y parvint pas ». Selon le contexte, il peut aussi résumer l’échec collectif des conspirateurs : « ils n’y parvinrent pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur projet leur fut connu ». Les pronoms grecs sont condensés; le contexte indique que Jonathan et ceux qui étaient avec lui découvrirent le projet de leurs adversaires.'
    reason: clarification
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: Il se mit en route
  rationale: Le verbe ἀπαίρω exprime ici le départ ou la mise en route, tandis que l’infinitif indique le mouvement envisagé. Cette formulation française rend naturellement l’ensemble sans reprendre l’interprétation « s’abstint de venir », qui cadre moins bien avec le sens usuel du verbe et avec le contexte.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec une armée nombreuse
  rationale: Dans ce récit militaire, δύναμις désigne des troupes ou une force armée. « Armée nombreuse » est idiomatique et rend la grandeur de l’effectif.
- source_word: ἀπέστειλεν ἐπιστολὰς λάθρᾳ
  choice: envoya secrètement des lettres
  rationale: λάθρᾳ indique que l’envoi fut effectué en secret; la place de « secrètement » est naturelle en français moderne.
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: à tous ses alliés de Judée
  rationale: σύμμαχοι désigne des alliés politiques ou militaires; « de Judée » identifie ici ceux qui se trouvaient dans cette région.
- source_word: ὅπως συλλάβωσι
  choice: afin qu’ils s’emparent de
  rationale: συλλαμβάνω signifie saisir ou capturer. « S’emparer de » convient à une opération clandestine sans introduire la nuance juridique particulière d’une arrestation officielle.
- source_word: τοὺς σὺν αὐτῷ
  choice: ceux qui étaient avec lui
  rationale: Cette expression conserve la généralité du grec sans préciser davantage l’identité ou le statut des personnes concernées.
- source_word: οὐκ ἠδύνατο
  choice: il n’y parvint pas
  rationale: Le verbe grec est morphologiquement au singulier et renvoie naturellement au principal instigateur, tout en pouvant résumer l’échec de l’entreprise collective.
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: Jonathan et ses compagnons eurent connaissance de leur projet
  rationale: La tournure passive grecque et ses pronoms comprimés signifient que le projet des conspirateurs fut révélé aux personnes visées. Les référents sont explicités en français pour éviter une succession de pronoms équivoques.
