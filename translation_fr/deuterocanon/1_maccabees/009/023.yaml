  source_fidelity: Le premier verbe (« surgirent ») rend bien ἐξέκυψαν. En revanche, « se multiplièrent » interprète ἀνέτειλαν comme une augmentation numérique, alors que le grec évoque plutôt le fait de se lever, de paraître ou de pousser. « Toutes les régions d’Israël » reflète plus précisément le pluriel τοῖς ὁρίοις.
  naturalness: La formulation révisée est naturelle en français narratif moderne. « Se levèrent » conserve l’image métaphorique du grec sans suggérer nécessairement une multiplication.
  terminology: « Les gens sans loi » maintient explicitement le rapport à la loi de οἱ ἄνομοι, sans imposer une lecture confessionnelle. « L’injustice » est un rendu recevable de ἀδικία.
  issues:
