base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: fr
  text: Après la mort de Judas, les gens sans loi surgirent dans toutes les régions d’Israël, et tous ceux qui commettaient l’injustice se levèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Après
  rationale: La formule narrative introduit ici la situation qui suit la mort de Judas. En français moderne, une subordonnée temporelle concise rend naturellement la transition sans reproduire lourdement « et il arriva que ».
- source_word: τελευτὴν
  choice: mort
  rationale: Dans ce contexte, le terme désigne clairement la mort de Judas plutôt qu’une simple fin abstraite.
- source_word: ἐξέκυψαν
  choice: surgirent
  rationale: Le verbe évoque une apparition soudaine ou le fait de sortir au grand jour; « surgirent » conserve cette vivacité.
- source_word: οἱ ἄνομοι
  choice: les gens sans loi
  rationale: Cette expression substantivée désigne des personnes caractérisées par leur mépris de la loi. « Les gens sans loi » reste naturel, garde le lien avec νόμος et n’ajoute pas explicitement « hommes ».
- source_word: ἐν πᾶσιν τοῖς ὁρίοις Ἰσραήλ
  choice: dans tout le territoire d’Israël
  rationale: Au pluriel, ὅρια désigne ici l’ensemble des régions ou contrées d’Israël, non seulement ses lignes frontalières. Le singulier collectif est idiomatique en français.
- source_word: ἀνέτειλαν
  choice: se multiplièrent
  rationale: Le verbe signifie littéralement « poussèrent » ou « se levèrent ». Appliqué à des personnes malfaisantes, « se multiplièrent » communique naturellement leur prolifération, même si l’image végétale devient moins explicite.
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: tous ceux qui commettaient l’injustice
  rationale: L’imparfait rend l’activité caractéristique ou répétée du participe présent; « commettre l’injustice » est plus idiomatique que « travailler l’injustice » tout en conservant la notion morale et sociale d’ἀδικία.
theological_decisions:
- issue: Rendre ἄνομοι sans atténuer sa portée liée à la loi
  choice: les gens sans loi
  alternative: les méchants
  rationale: « Sans loi » maintient le rapport lexical et conceptuel à la loi, tandis que « méchants » réduirait le terme à une qualification morale plus générale.
- issue: Portée d’ἀδικία
  choice: l’injustice
  alternative: le mal / l’iniquité
  rationale: « Injustice » conserve le sens premier du terme et laisse subsister sa portée à la fois morale et sociale; « iniquité » serait plus traditionnel mais moins courant.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite l’archaïsme « il arriva que ». Le parallélisme grec est conservé par deux groupes désignant les fauteurs de désordre, avec des verbes exprimant leur apparition puis leur prolifération.
