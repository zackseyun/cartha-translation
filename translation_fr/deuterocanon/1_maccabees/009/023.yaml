    rationale: Ce choix ajoute l’idée de prolifération numérique. Le verbe grec signifie littéralement « se lever » et, dans cette image, « surgir/pousser/apparaître »; il ne désigne pas en lui-même une multiplication.
  - severity: low
    issue: « tout le territoire » pour πᾶσιν τοῖς ὁρίοις
    rationale: Le singulier collectif est possible en français, mais « toutes les régions » reproduit plus directement le pluriel grec et évite de réduire ὅρια à une entité territoriale unique.
