  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: fr
  text: à Azôtos[a]. Ils entrèrent dans Beth-Dagon, le sanctuaire de leur idole, pour se mettre à l’abri[b]. Puis Jonathan incendia Azôtos et les villes des alentours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azôtos est le nom grec d’Ashdod.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « leur idole ». Le grec désigne probablement ici le sanctuaire de l’idole à Beth-Dagon plutôt que la seule statue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: Azôtos
  rationale: Conserve la forme grecque hellénisée du nom de lieu dans un livre transmis en grec; « Ashdod » est indiqué en note comme équivalent hébreu usuel.
- source_word: Βηθδαγὼν
  choice: Beth-Dagon
  rationale: Traite le terme comme un nom propre de lieu ou d’édifice, tout en conservant de façon transparente le nom de Dagon.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: le sanctuaire de leur idole
  rationale: Le grec dit littéralement « leur idole », mais le mouvement d’entrée dans Beth-Dagon indique vraisemblablement le sanctuaire associé à l’idole; la note préserve la formulation plus littérale et l’ambiguïté.
- source_word: τοῦ σωθῆναι
  choice: pour se mettre à l’abri
  rationale: L’infinitif articulaire exprime ici le but. Dans ce contexte de fuite militaire, il s’agit de chercher protection et sécurité, non du salut au sens religieux.
- source_word: ἐνεπύρισεν
  choice: incendia
  rationale: Exprime directement l’action de mettre le feu sans affirmer une destruction totale.
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: les villes des alentours
  rationale: Rend naturellement les villes situées autour d’Azôtos sans lourdeur.
theological_decisions:
- issue: Sens de σωθῆναι dans un contexte de fuite militaire
  choice: pour se mettre à l’abri
  alternative: pour être sauvés
  rationale: Le contexte narratif décrit une recherche de protection dans un sanctuaire païen. La traduction retient donc le sens concret de sécurité tout en évitant d’introduire une notion doctrinale de salut.
translation_notes:
  register: Français international moderne, narratif et digne. Le début fragmentaire « à Azôtos » est conservé parce que le texte source fourni commence au milieu d’une phrase. « Puis » assure une articulation naturelle du récit sans surinterpréter la conjonction grecque.
