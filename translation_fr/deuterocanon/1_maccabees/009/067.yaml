lexical_decisions:
- source_word: οἱ μετʼ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Cette formulation naturelle conserve la portée générale du grec et n’identifie pas plus précisément ces compagnons comme des soldats.
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: sortirent de la ville
  rationale: Rend directement le mouvement exprimé par le verbe et le complément prépositionnel, dans un français courant et digne.
- source_word: ἐνεπύρισαν
  choice: mirent le feu à
  rationale: Exprime clairement l’action de provoquer l’incendie, plutôt que le seul résultat suggéré par « brûlèrent ».
- source_word: τὰς μηχανάς
  choice: les machines de siège
  rationale: Dans ce contexte militaire, μηχαναί désigne des dispositifs employés contre la ville; cette traduction en communique clairement le sens historique sans imposer un type précis d’engin.
