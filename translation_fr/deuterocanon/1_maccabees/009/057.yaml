  yaml_path: translation/deuterocanon/1_maccabees/009/057.yaml
  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: fr
  text: Et Bacchidès vit qu’Alcime était mort ; il retourna auprès du roi, et le pays de Juda fut tranquille pendant deux ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: vit
  rationale: Le verbe signifie littéralement « vit » et peut, avec une proposition introduite par ὅτι, exprimer le constat d’un fait. « Vit que » reste naturel en français et proche du grec.
- source_word: ἀπέθανεν
  choice: était mort
  rationale: Le plus-que-parfait marque naturellement en français que la mort d’Alkime précède le constat de Bacchidès, sans ajouter de contenu au récit.
- source_word: ἀπέστρεψεν
  choice: retourna
  rationale: Le verbe indique que Bacchidès fit demi-tour ou revint; « retourna » convient au mouvement vers le roi exprimé par πρὸς.
- source_word: πρὸς τὸν βασιλέα
  choice: auprès du roi
  rationale: Avec un verbe de retour, « retourna auprès du roi » exprime idiomatiquement la destination personnelle sans suggérer nécessairement un lieu précis.
- source_word: ἡσύχασεν
  choice: connut le calme
  rationale: Cette formulation rend l’idée que le pays fut tranquille ou au repos, tout en évitant de renforcer le terme jusqu’à « paix », qui pourrait avoir une portée plus large.
- source_word: ἡ γῆ Ἰούδα
  choice: le pays de Juda
  rationale: « Pays » rend γῆ dans son sens territorial, et « Juda » conserve la forme biblique du nom grec Ἰούδα.
- source_word: ἔτη δύο
  choice: pendant deux ans
  rationale: « Pendant » exprime naturellement en français la durée indiquée par l’accusatif grec.
