lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, qui conserve l’enchaînement sobre du grec.
- source_word: πορευθέντες
  choice: une fois partis
  rationale: Le participe aoriste marque normalement une action antérieure à celle du verbe principal; cette tournure française exprime clairement cette succession sans lourdeur.
- source_word: συνεβουλεύσαντο
  choice: ils tinrent conseil
  rationale: Le moyen exprime ici une délibération ou concertation; «tinrent conseil» garde le caractère collectif et délibératif du verbe.
- source_word: αὐτῷ
  choice: avec lui
  rationale: Le datif désigne naturellement la personne avec laquelle ils se concertent, tout en évitant de transformer le passage en simple demande d’avis.
