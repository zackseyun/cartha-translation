base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/006.yaml
  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
translation:
  language: fr
  text: Ils virent que les troupes étaient très nombreuses et furent saisis d’une grande peur. Beaucoup s’enfuirent du camp[a], et il ne resta d’entre eux que huit cents hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se retirèrent du camp ». Le verbe grec peut évoquer aussi bien une fuite qu’un départ furtif.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων, ὅτι πολλοί εἰσιν
  choice: que les troupes étaient très nombreuses
  rationale: Dans ce contexte militaire, δυνάμεις désigne les troupes ou les forces. Cette formulation française naturelle réunit les deux expressions grecques étroitement liées, tout en conservant l’idée de leur nombre considérable.
- source_word: ἐφοβήθησαν σφόδρα
  choice: furent saisis d’une grande peur
  rationale: Cette tournure actuelle et digne rend la forte intensité exprimée par σφόδρα ainsi que le caractère soudain de l’aoriste.
- source_word: ἐξερρύησαν
  choice: s’enfuirent
  rationale: Le verbe évoque littéralement le fait de s’écouler hors d’un lieu et peut, dans ce cadre, décrire une fuite ou un départ discret. « S’enfuirent » exprime clairement la débandade militaire, tandis que la note conserve l’autre nuance possible.
- source_word: παρεμβολῆς
  choice: camp
  rationale: En contexte militaire, παρεμβολή désigne couramment le campement; « camp » est l’équivalent français le plus clair et le plus naturel.
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: il ne resta d’entre eux que huit cents hommes
  rationale: La construction restrictive grecque est rendue directement et idiomatiquement, sans modifier le nombre ni préciser davantage l’identité des hommes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition littérale « la multitude des forces, parce qu’elles étaient nombreuses » est resserrée en une phrase naturelle sans perte de sens. Le marqueur de note est placé sur le verbe concerné plutôt qu’après « troupes ».
