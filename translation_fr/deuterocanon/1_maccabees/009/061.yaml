  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: fr
  text: Ils saisirent, parmi les hommes du pays, cinquante hommes qui étaient les instigateurs du mal[a], et il les tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les chefs du mal » ; l’expression peut désigner les instigateurs d’actes mauvais ou les principaux malfaiteurs.'
    reason: alternative lexicale et ambiguïté du génitif grec
lexical_decisions:
- source_word: συνέλαβον
  choice: ils saisirent
  rationale: Le verbe exprime le fait de s’emparer de personnes. « Saisirent » garde cette force sans suggérer nécessairement une procédure judiciaire, comme le ferait « arrêtèrent ».
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: parmi les hommes du pays
  rationale: ἀπό indique ici une sélection au sein d’un groupe plus large. « Parmi les hommes du pays » est idiomatique en français et conserve la référence masculine explicite.
- source_word: τῶν ἀρχηγῶν τῆς κακίας
  choice: qui étaient les instigateurs du mal
  rationale: ἀρχηγός désigne ceux qui prennent la tête ou sont à l’origine d’une action; associé à κακία, « instigateurs du mal » rend naturellement le génitif tout en laissant ouverte la possibilité qu’il s’agisse de meneurs d’actes mauvais ou de malfaiteurs de premier plan.
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: cinquante hommes
  rationale: L’expression donne le total des personnes saisies. Le français naturel peut rendre directement le nombre sans reproduire littéralement εἰς.
- source_word: ἀπέκτεινεν
  choice: il les tua
  rationale: Le singulier du verbe grec est conservé. « Tua » en exprime le sens fondamental sans ajouter la nuance judiciaire qu’aurait « fit exécuter ».
theological_decisions:
- issue: Passage du sujet pluriel au sujet singulier dans la dernière proposition
  choice: 'Conserver le singulier : « et il les tua »'
  alternative: 'Harmoniser au pluriel : « et ils les tuèrent »'
  rationale: Le grec passe clairement de συνέλαβον (« ils saisirent ») à ἀπέκτεινεν (« il tua »). La traduction préserve cette tension grammaticale et ne précise pas l’identité du sujet singulier au-delà de ce que dit le texte.
- issue: Sens de τῶν ἀρχηγῶν τῆς κακίας
  choice: « les instigateurs du mal »
  alternative: « les principaux malfaiteurs » ou « les chefs de la méchanceté »
  rationale: Le génitif peut désigner des meneurs du mal ou des hommes au premier rang parmi ceux qui le commettent. Le texte principal adopte une formulation française naturelle, et la note conserve l’ambiguïté.
translation_notes:
  register: Français moderne, international et digne. Le récit reste direct; le passé simple convient au registre narratif biblique sans archaïsme marqué. Le changement du pluriel au singulier est volontairement maintenu.
