lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: se rassemblèrent
  rationale: L’aoriste passif de ἀθροίζω a ici un sens intransitif ou proche du moyen. « Se rassemblèrent » exprime naturellement en français l’action collective.
- source_word: πάντες
  choice: tous
  rationale: Rend directement la totalité du groupe et s’accorde naturellement avec « les amis ».
- source_word: οἱ φίλοι
  choice: les amis
  rationale: φίλοι signifie littéralement « amis ». Une nuance de partisans ou de compagnons est possible dans le contexte, mais le terme relationnel simple préserve la formulation grecque sans l’expliciter excessivement.
- source_word: Ἰούδου
  choice: de Judas
  rationale: Le génitif dépend de « amis » et se rend naturellement par le complément « de Judas ».
- source_word: εἶπον
  choice: dirent
  rationale: Rendu narratif courant de λέγω à l’aoriste, concis et idiomatique.
- source_word: τῷ Ἰωναθάν
  choice: à Jonathan
  rationale: Le datif marque le destinataire de la parole ; « Jonathan » est la forme française usuelle du nom.
