revisions:
- from: 'Ils levèrent les yeux et regardèrent : voici qu’arrivaient une procession bruyante et de nombreux bagages. Le marié sortit à leur rencontre avec ses amis et ses frères, au son des tambourins et des instruments de musique, et avec de nombreuses armes.'
  to: 'Ils levèrent les yeux et virent : voici, une clameur et beaucoup de bagages. Le marié, ses amis et ses frères sortirent à leur rencontre, avec des tambourins, des instruments de musique et de nombreuses armes.'
  rationale: La révision supprime l’ajout d’« arrivaient », rend θροῦς par le terme plus neutre « clameur » et explicite la coordination grammaticale du marié, de ses amis et de ses frères. Elle conserve l’ambiguïté de « leur » (αὐτῶν), sans identifier les personnes visées au-delà du contexte.
