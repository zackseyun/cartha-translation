  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: fr
  text: 'Ils levèrent les yeux et virent : voici, une clameur et beaucoup de bagages. Le marié, ses amis et ses frères sortirent à leur rencontre, avec des tambourins, des instruments de musique et de nombreuses armes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: une procession bruyante
  rationale: Le nom désigne d’abord un bruit confus ou une clameur ; dans ce contexte nuptial et en coordination avec les bagages, il évoque concrètement le cortège bruyant qui approche.
- source_word: ἀποσκευή πολλή
  choice: de nombreux bagages
  rationale: ἀποσκευή désigne les bagages, l’équipement ou les effets transportés ; « de nombreux bagages » conserve le sens collectif et l’ampleur indiquée par πολλή.
- source_word: ὁ νυμφίος
  choice: le marié
  rationale: Terme français courant et naturel pour l’homme qui célèbre ses noces.
- source_word: μουσικῶν
  choice: instruments de musique
  rationale: Le neutre pluriel substantivé désigne vraisemblablement ici des instruments de musique, en parallèle avec les tambourins, plutôt que des musiciens.
- source_word: ὅπλων πολλῶν
  choice: de nombreuses armes
  rationale: Rendu direct qui préserve le contraste frappant entre les réjouissances nuptiales et la présence d’armes.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Voici que » rend l’effet présentatif de ἰδού sans archaïsme excessif. La répétition sémitisante « levèrent les yeux et regardèrent » est conservée, tandis que la syntaxe est légèrement réorganisée pour éviter de faire dépendre « à leur rencontre » à la fois du marié et de ses accompagnateurs.
