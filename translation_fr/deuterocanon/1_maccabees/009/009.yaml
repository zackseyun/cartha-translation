  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: fr
  text: 'Mais ils le firent rebrousser chemin[a], en disant : « Nous en sommes absolument incapables. Sauvons plutôt nos propres vies[b] pour le moment. Puis revenons avec nos frères et combattons contre eux ; mais nous sommes peu nombreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils le détournèrent ». Le grec peut désigner le fait de faire rebrousser chemin à Judas ou, de manière figurée, de le détourner de son projet.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nos propres âmes » ; dans ce contexte de combat, le mot grec désigne la vie que l’on cherche à préserver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: ils cherchèrent à l’en détourner
  rationale: 'Le verbe est transitif : ils tentent de détourner Judas de l’action envisagée, plutôt que de se détourner physiquement de lui. La formulation française exprime naturellement ce refus de son projet sans préciser à tort qu’ils y sont parvenus.'
- source_word: Οὐ μὴ δυνώμεθα
  choice: Nous en sommes absolument incapables
  rationale: La négation renforcée οὐ μή marque ici une impossibilité affirmée avec force. « Absolument incapables » en restitue l’intensité en français courant.
- source_word: ἀλλʼ ἢ σώσωμεν τὰς ἑαυτῶν ψυχὰς
  choice: Sauvons plutôt nos propres vies
  rationale: 'Dans cette situation militaire, ψυχαί désigne les vies exposées au danger. ἀλλ’ ἤ introduit la conduite de remplacement proposée : sauver plutôt leur vie.'
- source_word: τὸ νῦν
  choice: pour le moment
  rationale: Cette expression situe le repli proposé dans la crise immédiate, sans en faire une décision définitive.
- source_word: ἐπιστρέψωμεν μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: Puis revenons avec nos frères
  rationale: ἐπιστρέφω indique un retour, et μετά avec le génitif signifie normalement « avec ». « Frères » conserve le terme grec, qui peut désigner ici les membres de leur peuple ou leurs compagnons d’armes.
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: combattons-les
  rationale: Le contexte est celui d’un affrontement armé. La construction directe est naturelle en français et conserve la force du grec.
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: mais nous sommes peu nombreux
  rationale: Le français doit expliciter la copule sous-entendue. « Mais » conserve la valeur adversative de δέ et la tension de la proposition telle qu’elle est formulée.
theological_decisions:
- issue: Sens de ψυχὰς dans un contexte de bataille
  choice: vies
  alternative: âmes
  rationale: Il s’agit de survivre au danger immédiat, non d’un enseignement sur l’âme immatérielle. « Vies » évite d’introduire une portée théologique étrangère au contexte.
- issue: Portée de ἀδελφῶν
  choice: frères
  alternative: compatriotes ou compagnons
  rationale: Le grec emploie explicitement le masculin pluriel « frères ». Le conserver respecte la forme du texte tout en laissant ouverte sa portée sociale ou militaire.
- issue: Lien logique de ἡμεῖς δὲ ὀλίγοι
  choice: mais nous sommes peu nombreux
  alternative: car nous sommes peu nombreux
  rationale: Bien que la proposition puisse servir de justification au repli, δέ est adversatif. « Mais » préserve ce lien formel et la formulation abrupte du grec au lieu de rendre explicite une causalité seulement implicite.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue garde l’urgence tactique du passage. « Frères » conserve l’expression grecque sans la neutraliser, tandis que « peu nombreux » explicite seulement ce que la phrase nominale grecque implique.
