lexical_decisions:
- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: Au premier mois
  rationale: Le génitif a ici une valeur temporelle. « Au premier mois » est naturel en français et conserve le repère chronologique.
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: de la cent cinquante-deuxième année
  rationale: Le grec exprime le nombre de manière additive (« deuxième, cinquantième et centième »). L’ordinal français standard en restitue exactement la valeur.
- source_word: παρενέβαλον
  choice: ils établirent leur camp
  rationale: Le verbe désigne l’installation d’un camp, généralement militaire. Cette formulation est claire, actuelle et garde la tonalité narrative.
- source_word: εἰς Ἱερουσαλήμ
  choice: à Jérusalem
  rationale: Après un verbe d’établissement du camp, « à Jérusalem » exprime naturellement le lieu atteint, sans imposer l’idée d’une attaque contre la ville.
