  text: And Judas fell[a], and the rest fled.
translation:
  language: fr
  text: Judas tomba[a], et les autres s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut abattu » ou « mourut ». Le grec dit « tomba », expression courante dans un récit de bataille, qui peut évoquer la mort sans la déclarer plus explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle du nom propre grec Ἰούδας ; dans ce contexte, il s’agit de Judas Maccabée.
- source_word: ἔπεσεν
  choice: tomba
  rationale: L’aoriste de πίπτω signifie littéralement « tomba ». Dans un récit de bataille, cette expression peut annoncer la mort sans la formuler explicitement ; « tomba » préserve à la fois l’image grecque et sa solennité.
- source_word: οἱ λοιποὶ
  choice: les autres
  rationale: L’expression désigne ceux qui restent à côté de la personne nommée. « Les autres » est ici plus naturel en français que « le reste » et maintient le contraste avec Judas.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Dans ce contexte militaire, φεύγω exprime la fuite devant le danger. « S’enfuirent » en donne le sens direct dans un français naturel et digne.
