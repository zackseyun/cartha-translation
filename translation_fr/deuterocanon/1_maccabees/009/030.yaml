  yaml_path: translation/deuterocanon/1_maccabees/009/030.yaml
  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: fr
  text: Maintenant donc, nous t’avons choisi aujourd’hui pour être, à sa place, notre chef et notre guide, afin de mener notre guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: nous t’avons choisi
  rationale: L’aoriste moyen exprime ici le choix d’une personne pour assumer une fonction. « Choisir » reste naturel et n’impose pas l’idée d’une procédure électorale formelle.
- source_word: ἀντʼ αὐτοῦ
  choice: à sa place
  rationale: Cette expression marque la succession dans la fonction exercée par la personne mentionnée auparavant, sans réduire celle-ci à un simple remplacement mécanique.
- source_word: ἄρχοντα
  choice: chef
  rationale: Ἄρχων désigne une personne investie d’autorité. Dans ce contexte communautaire et militaire, « chef » est idiomatique et conserve le sens général d’autorité sans introduire un titre institutionnel plus tardif.
- source_word: ἡγούμενον
  choice: guide
  rationale: Le participe substantivé désigne celui qui conduit. « Guide » distingue ce terme de ἄρχοντα et préserve la double caractérisation de la fonction.
- source_word: τοῦ πολεμῆσαι
  choice: afin de mener
  rationale: L’infinitif articulé exprime le but. Avec « guerre », le français idiomatique dit « mener la guerre » plutôt que « combattre la guerre ».
- source_word: τὸν πόλεμον ἡμῶν
  choice: notre guerre
  rationale: Πόλεμος désigne la guerre plutôt qu’une bataille isolée, et le possessif ἡμῶν rattache explicitement le conflit au groupe qui parle.
theological_decisions:
- issue: Rendu des deux titres ἄρχοντα καὶ ἡγούμενον
  choice: notre chef et notre guide
  alternative: notre dirigeant et notre commandant
  rationale: Le texte grec juxtapose deux désignations distinctes. Le rendu retenu maintient leur distinction entre autorité et conduite, sans importer un titre politique ou militaire trop technique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’insistance de νῦν οὖν et σήμερον, ainsi que l’idée de succession portée par ἀντʼ αὐτοῦ. Aucun marqueur de note n’est nécessaire.
