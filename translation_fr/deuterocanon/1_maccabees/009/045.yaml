base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: fr
  text: 'Car voici : le combat est devant nous et derrière nous, tandis que les eaux du Jourdain sont de part et d’autre[a], avec un marais et une forêt, et il n’y a aucun endroit où nous écarter[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ce côté-ci et de ce côté-là »; autre traduction possible : « des deux côtés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « où nous retirer » ou « par où nous échapper ». Le grec signifie littéralement « nous écarter » et indique ici qu’aucune voie de sortie n’est disponible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Car voici
  rationale: « Car » rend la valeur explicative de γάρ, et « voici » conserve la fonction vive d’appel à l’attention de ἰδού dans un registre digne et actuel.
- source_word: ὁ πόλεμος
  choice: le combat
  rationale: Dans cette situation militaire immédiate, « combat » désigne plus justement l’affrontement en cours que le terme plus général « guerre ».
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: devant nous et derrière nous
  rationale: Cette formulation restitue directement le contraste spatial et l’encerclement tactique exprimés par le grec.
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: les eaux du Jourdain
  rationale: Le pluriel idiomatique français garde l’accent mis par le grec sur l’eau comme obstacle, plutôt que de réduire l’expression au simple nom du fleuve.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: de part et d’autre
  rationale: Expression française naturelle qui conserve le sens distributif spatial de « de ce côté-ci et de ce côté-là ».
- source_word: ἕλος
  choice: un marais
  rationale: Rend simplement le terrain marécageux désigné par le terme grec.
- source_word: δρυμός
  choice: une forêt
  rationale: Rend clairement la zone boisée qui constitue ici un obstacle; « fourré » demeure possible selon l’étendue envisagée.
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: il n’y a aucun endroit où nous écarter
  rationale: Conserve l’image littérale du verbe ἐκκλίνω, « s’écarter, se détourner », sans préciser à tort s’il s’agit d’une retraite ou d’une fuite.
