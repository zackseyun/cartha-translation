revisions:
- from: Il fit camper trois mille cavaliers et une force considérable, puis se rendit à Azôt comme s’il ne faisait que passer. En même temps, il avançait vers la plaine, car il disposait d’une cavalerie nombreuse et mettait sa confiance en elle.[a]
  to: Il fit camper trois mille cavaliers et une force considérable, puis se rendit à Azôt comme s’il ne faisait que passer. En même temps, il menait ses troupes dans la plaine, car il disposait d’une cavalerie nombreuse et se fiait à cette force.[a]
  rationale: La révision restitue la valeur transitive de προσῆγεν en explicitant sobrement l’objet militaire implicite (« ses troupes »). Elle rend également plus fidèlement la reprise féminine αὐτήν par « cette force », en lien avec δύναμις, sans ajouter d’interprétation doctrinale ou historique. La note textuelle demeure nécessaire en raison de la coupure du texte source au milieu du mot suivant.
