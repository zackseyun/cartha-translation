  yaml_path: translation/deuterocanon/1_maccabees/009/077.yaml
  text: He encamped three thousand cavalry and a large force[a], and went to Azotus as though passing through; at the same time he was leading them into the plain[c][b], because he had a multitude of cavalry and trusted in it.
translation:
  language: fr
  text: Il fit camper trois mille cavaliers et une force considérable, puis se rendit à Azôt comme s’il ne faisait que passer. En même temps, il menait ses troupes dans la plaine, car il disposait d’une cavalerie nombreuse et se fiait à cette force.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec fourni s’interrompt au milieu du mot suivant (« καὶ κατε- ») ; la phrase se poursuit donc au-delà de cette unité de verset. Seule la partie complète est traduite ici.
    reason: textual_variant
lexical_decisions:
- source_word: παρενέβαλεν
  choice: fit camper
  rationale: Le verbe exprime ici l’établissement d’un camp. La tournure causative française rend naturellement les compléments directs grecs désignant les troupes.
- source_word: τρισχιλίαν ἵππον
  choice: trois mille cavaliers
  rationale: ἵππος est employé collectivement au sens militaire de cavalerie ou de cavaliers; avec un nombre précis, « trois mille cavaliers » est le tour français le plus naturel.
- source_word: δύναμιν πολλήν
  choice: une force considérable
  rationale: Dans ce contexte, δύναμις désigne une force militaire et non une puissance abstraite.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: se rendit à Azôt
  rationale: Cette formulation actuelle conserve le sens général de déplacement sans préciser indûment la manière de marcher.
- source_word: ὡς διοδεύων
  choice: comme s’il ne faisait que passer
  rationale: ὡς présente le passage comme une apparence, probablement destinée à tromper; la formulation française conserve cette nuance sans l’expliciter davantage.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: En même temps, il avançait vers la plaine
  rationale: Employé ici sans complément exprimé, προσάγω peut décrire une progression. Cette traduction évite d’ajouter un objet implicite tout en conservant la destination indiquée par εἰς.
- source_word: πλῆθος ἵππου
  choice: une cavalerie nombreuse
  rationale: L’expression grecque est collective; cette formulation française naturelle permet aussi de conserver un antécédent féminin singulier pour le pronom suivant.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: mettait sa confiance en elle
  rationale: Le parfait exprime une confiance établie. Le pronom féminin « elle » préserve l’ambiguïté du grec entre la force et, plus particulièrement, la cavalerie.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Azôt » suit la forme française traditionnelle du toponyme grec Ἄζωτος. La syntaxe reste claire pour un lectorat général tout en conservant l’apparence trompeuse du déplacement et l’ambiguïté du pronom final.
