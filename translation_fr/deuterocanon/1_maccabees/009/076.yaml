  source_fidelity: La traduction rend correctement la peur des habitants, l’ellipse après « ouvrirent », la prise de contrôle de Joppé et la finale inachevée du témoin. Toutefois, « l’apprit » introduit un pronom-objet absent du grec ἤκουσεν et identifie ainsi explicitement ce qu’Apollonios a entendu. Le grec laisse cet objet non exprimé, tout en se terminant sur καί (« et »).
