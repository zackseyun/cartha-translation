  text: And those from the city[a], being afraid, opened up, and Jonathan gained control of Joppa. And Apollonius heard[b], and
translation:
  language: fr
  text: Pris de peur, les gens de la ville ouvrirent[a], et Jonathan prit le contrôle de Joppé. Apollonios entendit, et[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas ce que les gens de la ville ouvrirent ; dans ce contexte, il s’agit probablement de la ville ou de ses portes.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec fourni se termine par « Apollonios entendit, et » ; il est donc incomplet à cet endroit.
