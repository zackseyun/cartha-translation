lexical_decisions:
- source_word: φοβηθέντες
  choice: Pris de peur
  rationale: Le participe aoriste exprime la peur qui motive l’action; cette tournure française rend naturellement cette nuance causale.
- source_word: ἤνοιξαν
  choice: ouvrirent
  rationale: Le grec ne précise pas ce qui fut ouvert. La traduction conserve cette ellipse au lieu d’ajouter « les portes » dans le texte principal.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les gens de la ville
  rationale: Cette expression substantivée désigne naturellement les habitants ou les défenseurs de la ville, sans préciser indûment qu’il s’agit uniquement d’hommes.
- source_word: ἐκυρίευσεν
  choice: prit le contrôle de
  rationale: Le verbe κυριεύω indique ici l’acquisition de la maîtrise ou du contrôle; cette formulation convient au contexte militaire sans réduire nécessairement le sens à une prise d’assaut.
- source_word: Ἰόππης
  choice: Joppé
  rationale: « Joppé » est la forme française traditionnelle et reconnue du nom de lieu grec Ἰόππη.
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans ce contexte, ἀκούω signifie qu’Apollonios reçut la nouvelle de l’événement. « L’apprit » est idiomatique, tandis que le pronom reprend sobrement ce qui précède.
