  yaml_path: translation/deuterocanon/1_maccabees/009/058.yaml
  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: fr
  text: 'Tous les hommes sans loi se concertèrent et dirent : « Voici, Jonathan et ceux qui sont avec lui vivent tranquilles et confiants.[a] Maintenant donc, faisons venir Bacchidès, et il les capturera tous en une seule nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habitent tranquillement, pleins de confiance ». Le grec associe le fait de résider dans le calme à un participe signifiant « confiants » ou « se fiant » à quelqu’un ou à quelque chose.
    reason: Alternative lexicale permettant de percevoir les deux éléments de l’expression grecque sans préciser l’objet implicite de la confiance.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: se concertèrent
  rationale: Le moyen exprime une délibération menée entre eux. « Se concertèrent » est naturel en français et n’ajoute pas explicitement l’idée d’un complot secret.
- source_word: οἱ ἄνομοι
  choice: les hommes sans loi
  rationale: Cette expression conserve la portée morale et politique de ἄνομοι, ceux qui vivent sans la loi ou contre elle, sans la réduire à « criminels » ni l’intensifier en « impies ».
- source_word: Ἰδοὺ
  choice: omis comme interjection autonome
  rationale: Dans le discours direct français, l’annonce immédiate est suffisamment portée par la proposition qui suit. Employer « voici que » aurait donné une tournure plus marquée et moins courante, tandis que « regardez » pourrait suggérer une perception visuelle littérale.
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: ceux qui sont avec lui
  rationale: La formulation reste générale comme le grec et ne précise pas indûment qu’il s’agit de soldats, de compagnons ou de partisans.
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν
  choice: vivent dans le calme
  rationale: La locution décrit une résidence tranquille et sans trouble. « Vivent dans le calme » rend cette situation sans affirmer nécessairement un état officiel de paix.
- source_word: πεποιθότες
  choice: confiants
  rationale: Le participe parfait exprime l’état de personnes qui ont confiance ou se sentent en sécurité. « Confiants » préserve cette nuance sans ajouter qu’elles ne soupçonnent rien.
- source_word: ἄξομεν
  choice: faisons venir
  rationale: Dans ce contexte de proposition collective, le futur grec a une valeur délibérative ou exhortative. « Faisons venir » restitue naturellement cette force.
- source_word: συλλήψεται
  choice: il les capturera
  rationale: Le verbe désigne ici le fait de saisir ou de faire prisonnier dans un contexte hostile. « Capturera » convient mieux que le terme juridiquement marqué « arrêtera ».
- source_word: ἐν νυκτὶ μιᾷ
  choice: en une seule nuit
  rationale: Cette traduction conserve l’accent placé par μία sur l’unicité et la brièveté de l’opération.
