  yaml_path: translation/deuterocanon/1_maccabees/009/027.yaml
  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: fr
  text: Il y eut une grande détresse en Israël, telle qu’il n’y en avait pas eu depuis le jour où aucun prophète ne leur était apparu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « depuis le jour où aucun prophète n’avait été vu parmi eux ». Le passif grec peut signifier « être vu » ou « apparaître ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Il y eut alors
  rationale: Cette tournure narrative naturelle rend l’apparition de la crise; « alors » marque la progression du récit sans alourdir le français.
- source_word: θλίψις μεγάλη
  choice: une grande détresse
  rationale: « Détresse » exprime une épreuve collective grave sans donner au terme une portée eschatologique technique.
- source_word: ἐν τῷ Ἰσραήλ
  choice: en Israël
  rationale: La formule conserve la valeur à la fois locale et collective de l’expression grecque.
- source_word: ἥτις οὐκ ἐγένετο
  choice: telle qu’il n’y en avait pas eu
  rationale: La construction qualitative et comparative exprime naturellement en français le caractère sans précédent de cette détresse.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: depuis le jour où
  rationale: Rendu temporel direct qui maintient le point de comparaison formulé dans le grec.
- source_word: οὐκ ὤφθη
  choice: aucun … ne leur était apparu
  rationale: Le passif de ὁράω peut signifier « être vu » ou « apparaître ». Dans ce contexte, « apparaître » est idiomatique et garde l’idée qu’un prophète se manifeste au peuple.
- source_word: προφήτης
  choice: aucun prophète
  rationale: Le singulier grec a une valeur générique. Après la négation, « aucun prophète » l’exprime clairement en français sans viser un prophète particulier.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif est conservé comme complément d’« apparaître », sans expliciter davantage si l’apparition était devant eux ou en leur sein.
theological_decisions:
- issue: Portée de l’absence de prophète
  choice: Le texte évoque historiquement une période durant laquelle aucun prophète ne s’était manifesté à Israël.
  alternative: Comprendre le singulier comme désignant un prophète particulier, ou traduire « n’avait été vu parmi eux ».
  rationale: Le singulier est vraisemblablement générique, mais la traduction n’en tire aucune doctrine générale sur la cessation de la prophétie; elle se limite au constat historique du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible tout en conservant la comparaison temporelle et l’ambiguïté du verbe grec entre « être vu » et « apparaître ».
