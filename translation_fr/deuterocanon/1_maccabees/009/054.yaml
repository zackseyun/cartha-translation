base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/054.yaml
  text: And in the one hundred and fifty-third year[a], in the second month, Alcimus ordered the wall of the inner court of the sanctuary to be torn down, and he tore down the works of the prophets[b], and began to tear it down.
translation:
  language: fr
  text: En l’an cent cinquante-trois[a], au deuxième mois, Alcime ordonna de démolir le mur de la cour intérieure du sanctuaire. Il détruisit les ouvrages des prophètes[b] et se mit à démolir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette année est comptée selon l’ère séleucide.
    reason: historical_context
  - marker: b
    text: L’expression « les ouvrages des prophètes » est littérale ; elle peut désigner des constructions ou des restaurations associées aux prophètes, mais le grec ne donne aucune précision.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: En l’an cent cinquante-trois
  rationale: Le grec donne la date selon une numération additive. Cette formulation française est naturelle et conserve le système de datation du texte sans imposer une conversion moderne incertaine.
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: au deuxième mois
  rationale: Le datif temporel indique le mois de l’événement. « Au deuxième mois » est clair et fidèle à la référence calendaire.
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime un ordre formel; « ordonna » en rend directement la force.
- source_word: καθελεῖν / καθεῖλεν / καθαιρεῖν
  choice: démolir / détruisit / démolir
  rationale: Dans ce contexte architectural, la famille verbale désigne l’action d’abattre ou de démolir. La légère variation française évite une répétition pesante tout en conservant l’unité de l’action.
- source_word: τὸ τεῖχος
  choice: le mur
  rationale: τεῖχος désigne normalement un mur important ou un mur d’enceinte; « le mur » convient au contexte du temple.
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: de la cour intérieure du sanctuaire
  rationale: Cette formulation rend naturellement la chaîne de génitifs et situe la cour dans l’espace sacré sans introduire une topographie plus précise que le grec.
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: les ouvrages des prophètes
  rationale: La formule grecque reste opaque. « Ouvrages » peut désigner des constructions ou des réalisations, sans trancher une question que le texte ne précise pas.
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: commença à le démolir
  rationale: La construction signifie « commencer à démolir ». Le pronom « le » reprend naturellement « le mur », tout en préservant la reprise quelque peu abrupte du grec.
theological_decisions:
- issue: Désignation de l’espace sacré dans τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: la cour intérieure du sanctuaire
  alternative: la cour intérieure du lieu saint
  rationale: « Sanctuaire » est idiomatique en français et peut désigner l’ensemble de l’espace sacré visé ici, sans importer une distinction cultuelle technique absente de la formulation grecque.
- issue: Référent de τὰ ἔργα τῶν προφητῶν
  choice: les ouvrages des prophètes
  alternative: les constructions réalisées par les prophètes
  rationale: Le grec n’explique ni la nature des ouvrages ni le lien exact avec les prophètes. La traduction conserve cette indétermination plutôt que d’adopter une reconstruction historique spéculative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec tout en évitant les calques lourds. Les deux propositions finales sont conservées malgré leur enchaînement abrupt, afin de ne pas lisser la progression narrative ni résoudre l’ambiguïté du texte.
