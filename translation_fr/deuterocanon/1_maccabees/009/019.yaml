  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: fr
  text: Jonathan et Simon portèrent Judas, leur frère, et l’ensevelirent dans le tombeau de ses ancêtres, à Modéïn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son frère » ; avec le sujet composé, le sens est « leur frère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: emportèrent
  rationale: Dans ce contexte funéraire, αἴρω désigne le fait de prendre et transporter le corps. « Emportèrent » est naturel en français et n’ajoute pas de précision absente du grec.
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: Jonathan et Simon
  rationale: Les noms personnels sont translittérés selon leur forme française courante.
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: leur frère Judas
  rationale: Bien que αὐτοῦ soit morphologiquement au singulier, le sujet coordonné Jonathan et Simon indique que Judas est leur frère à tous deux. Cette formulation française rend clairement la relation sans conserver un singulier trompeur.
- source_word: ἔθαψαν
  choice: l’ensevelirent
  rationale: θάπτω signifie mettre en terre ou déposer dans une sépulture. « Ensevelirent » convient au registre narratif biblique tout en restant intelligible.
- source_word: ἐν τῷ τάφῳ
  choice: dans le tombeau
  rationale: τάφος désigne ici un tombeau ou lieu de sépulture familial. « Tombeau » correspond mieux au contexte qu’une simple fosse individuelle.
- source_word: τῶν πατέρων αὐτοῦ
  choice: de ses ancêtres
  rationale: Le pluriel πατέρων peut désigner les pères au sens ancestral. « Ancêtres » exprime clairement ce sens en français moderne et évite l’ambiguïté de « ses pères ».
- source_word: ἐν Μωδεείμ
  choice: à Modéïn
  rationale: La préposition ἐν situe le tombeau à l’intérieur ou sur le territoire de la localité. « À » est l’usage français naturel devant un nom de ville. « Modéïn » transcrit la forme grecque Μωδεείμ avec une graphie française lisible.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Ancêtres » clarifie l’expression familiale, tandis que « ensevelirent » conserve une tonalité biblique courante. La seule note maintient la nuance possible de la préposition grecque devant le nom du lieu.
