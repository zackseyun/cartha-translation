base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/066.yaml
  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: fr
  text: Il frappa Odoméra, ses frères et les fils de Phasiron dans leur camp[a]. Puis il se mit à frapper et à avancer[b] avec ses forces[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans leur tente » ou « dans leur demeure »; dans ce contexte militaire, le mot peut désigner leur campement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « monter ». Dans ce contexte militaire, le verbe a probablement le sens d’« avancer ».'
    reason: lexical_alternative
  - marker: c
    text: Le grec dit littéralement « avec les forces » ou « parmi les forces », sans possessif exprimé.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐπάτεξεν
  choice: frappa
  rationale: L’aoriste de πατάσσω exprime ici un coup porté ou une attaque. « Frappa » conserve le caractère concret du verbe ainsi que sa proximité avec τύπτειν.
- source_word: Ὀδομηρὰ
  choice: Odoméra
  rationale: Le nom propre est translittéré en suivant les conventions graphiques naturelles du français.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: ἀδελφοί désigne normalement des frères; rien dans le contexte n’impose le sens élargi de « parents » ou « membres du clan ».
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: les fils de Phasiron
  rationale: La formulation littérale et traditionnelle « fils de » préserve la possibilité qu’il s’agisse de fils directs ou, selon l’usage généalogique, de descendants.
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: dans leur camp
  rationale: σκήνωμα désigne littéralement une tente ou une demeure; dans cette scène militaire et pour un groupe, « camp » rend le sens contextuel le plus probable.
- source_word: ἐξηρξατο
  choice: il se mit à
  rationale: Cette tournure française exprime naturellement l’entrée dans l’action marquée par le verbe grec.
- source_word: τύπτειν
  choice: frapper
  rationale: La répétition de « frapper » après ἐπάτεξεν reflète la répétition verbale du grec au lieu de la gommer.
- source_word: ἀναβαίνειν
  choice: avancer
  rationale: ἀναβαίνω signifie littéralement « monter »; dans un récit de combat, il peut décrire une progression ou une avancée militaire.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: avec ses forces
  rationale: Au pluriel, δυνάμεις désigne couramment des forces militaires. « Avec ses forces » est idiomatique en français, bien que le possessif reste implicite dans le grec.
