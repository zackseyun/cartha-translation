  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
translation:
  language: fr
  text: Jonathan laissa son frère Simon dans la ville, puis sortit dans la campagne et arriva avec un certain nombre d’hommes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « arriva en nombre ». L’expression est elliptique et désigne probablement un groupe ou un contingent d’hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: laissa
  rationale: L’aoriste de ἀπολείπω indique que Jonathan laissa Simon sur place tandis qu’il partait lui-même. « Laissa » rend naturellement l’action sans ajouter d’interprétation.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: son frère Simon
  rationale: Cette formulation française identifie clairement et naturellement Simon comme le frère de Jonathan.
- source_word: ἐν τῇ πόλει
  choice: dans la ville
  rationale: πόλις peut désigner une ville ou une localité; « dans la ville » conserve le contraste spatial avec la campagne.
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: sortit dans la campagne
  rationale: χώρα désigne ici le territoire ouvert hors de la ville. « La campagne » exprime clairement ce contraste en français moderne.
- source_word: ἦλθεν ἀρίθμῳ
  choice: arriva avec un certain nombre d’hommes
  rationale: L’expression grecque est elliptique. Le contexte militaire permet de comprendre qu’un groupe d’hommes accompagnait Jonathan, tout en laissant sa taille indéterminée.
