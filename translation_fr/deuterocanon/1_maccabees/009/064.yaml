  text: And he came and encamped against Bethbasi[a], and fought against it for many days, and made siege engines.
translation:
  language: fr
  text: Il arriva et établit son camp contre Bethbasi. Il combattit contre elle pendant de nombreux jours et construisit des machines de siège[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « construisit des machines » ; le terme grec désigne ici des dispositifs militaires employés lors d’un siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Il arriva
  rationale: Le participe aoriste introduit l’action suivante dans le récit; une proposition coordonnée rend naturellement la succession en français.
- source_word: παρεβάλεν ἐπὶ
  choice: établit son camp face à
  rationale: Dans ce contexte militaire, l’expression désigne l’installation d’un camp contre une place. « Face à » conserve cette idée sans assimiler prématurément l’action au siège lui-même.
- source_word: Βεθβασί
  choice: Bethbasi
  rationale: Le nom de lieu est translittéré plutôt que traduit.
- source_word: ἐπολέμησεν αὐτήν
  choice: Il l’attaqua
  rationale: Le verbe πολεμέω exprime ici une action militaire menée contre la place; « attaqua » est naturel en français et respecte la force du contexte.
- source_word: ἡμέρας πολλὰς
  choice: pendant de nombreux jours
  rationale: L’accusatif marque la durée; cette formulation la rend explicitement et naturellement.
- source_word: ἐποίησεν μηχανάς
  choice: construisit des machines de siège
  rationale: Dans le contexte d’une attaque prolongée contre une place, μηχαναί désigne des dispositifs militaires employés lors d’un siège; « machines de siège » est précis sans spécifier un type non indiqué.
