  text: φυγεῖν. Ὡς δὲ ἤκουσεν Ἰωνάθαν τῶν λόγων Ἀπολλωνίου, ἐκινήθη τῇ διανοίᾳ, καὶ ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν, καὶ ἐξῆλθεν ἐξ Ἱερουσαλήμ, καὶ συνήντησεν αὐτῷ Σίμων ὁ ἀδελφὸς αὐτοῦ ἐπὶ βοήθειαν αὐτοῦ.
