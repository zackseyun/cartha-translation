base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: fr
  text: Lorsque Jonathan entendit les paroles d’Apollonius, son esprit en fut agité. Il choisit dix mille hommes et sortit de Jérusalem. Simon, son frère, vint à sa rencontre pour lui prêter main-forte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le rejoignit pour lui porter secours ». Le grec peut désigner soit le fait de venir à la rencontre de Jonathan, soit, dans ce contexte, celui de se joindre à lui afin de l’aider.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Lorsque … entendit
  rationale: La construction introduit une proposition temporelle et marque naturellement la succession des événements.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: les paroles d’Apollonius
  rationale: « Paroles » traduit directement λόγοι sans réduire l’expression à un simple message.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: son esprit en fut agité
  rationale: Cette formulation conserve l’idée d’un mouvement intérieur de la pensée sans préciser indûment s’il s’agit de colère, de peur ou d’un autre sentiment.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: Il choisit dix mille hommes
  rationale: Traduction directe qui respecte ἀνδρῶν sans ajouter le terme « soldats », bien que le contexte soit militaire.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: sortit de Jérusalem
  rationale: Rend simplement le départ indiqué par le grec, sans ajouter l’idée explicite d’une marche militaire.
- source_word: συνήντησεν αὐτῷ
  choice: vint à sa rencontre
  rationale: Rend le sens premier de la rencontre tout en s’accordant avec le mouvement de Simon vers Jonathan.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: pour lui prêter main-forte
  rationale: 'Exprime naturellement en français le but de la rencontre : Simon vient soutenir Jonathan.'
