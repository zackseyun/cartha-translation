  text: And they remembered John their brother[a], and they went up and hid under the cover of the mountain.
translation:
  language: fr
  text: Ils se souvinrent de Jean, leur frère, puis ils montèrent et se cachèrent sous le couvert de la montagne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous l’abri de la montagne ». Le grec peut désigner ce qui couvre, un abri ou une protection.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se souvinrent
  rationale: L’aoriste de μιμνῄσκομαι signifie naturellement « se souvenir » ou « se rappeler ». Le passé simple convient au registre narratif et reste direct.
- source_word: Ἰωάνου
  choice: Jean
  rationale: « Jean » est la forme française biblique habituelle du nom grec Ἰωάνης, ici au génitif.
- source_word: τοῦ ἀδελφοῦ αὐτῶν
  choice: leur frère
  rationale: La construction au génitif identifie simplement Jean comme leur frère ; l’apposition française est naturelle et fidèle.
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe exprime un mouvement vers le haut. « Montèrent » préserve ce sens sans préciser une destination absente du grec.
- source_word: ἐκρύβησαν
  choice: se cachèrent
  rationale: La forme exprime ici l’action de se dissimuler. Le pronominal français rend clairement cette valeur.
- source_word: ὑπὸ τὴν σκέπην
  choice: sous le couvert
  rationale: σκέπη peut désigner ce qui couvre, un abri ou une protection. « Sous le couvert » conserve l’image spatiale introduite par ὑπό tout en restant idiomatique.
- source_word: τοῦ ὄρους
  choice: de la montagne
  rationale: ὄρος désigne une montagne ou une hauteur. « La montagne » est ici le rendu le plus direct du singulier défini.
