  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: fr
  text: Ils fortifièrent la ville, Bethsoura, Gazara[a] et la citadelle[b], et y installèrent des troupes et des réserves de nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara est la forme grecque du nom; ce lieu est généralement identifié à Guézer.
    reason: cross_reference
  - marker: b
    text: Ou « l’Acra », nom historique de la forteresse de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: fortifièrent
  rationale: Le verbe désigne ici le renforcement défensif de lieux; « fortifier » est le terme militaire naturel en français.
- source_word: τὴν πόλιν
  choice: la ville
  rationale: Rend directement πόλις avec son article défini, qui renvoie à une ville connue dans le contexte.
- source_word: Βεθοσούραν
  choice: Bethsoura
  rationale: Translittération française usuelle de la forme grecque du nom de lieu.
- source_word: Γάζαρα
  choice: Gazara
  rationale: Reproduit directement la forme grecque; l’identification courante avec Guézer est signalée en note.
- source_word: τὴν ἄκραν
  choice: la citadelle
  rationale: Ἄκρα désigne une hauteur fortifiée ou une citadelle et peut ici évoquer spécifiquement la forteresse séleucide de Jérusalem.
- source_word: ἔθεντο ἐν αὐταῖς δυνάμεις
  choice: y installèrent des troupes
  rationale: Dans ce contexte militaire, « installèrent des troupes » exprime naturellement le fait de placer des forces dans les places fortifiées sans préciser indûment qu’il s’agit formellement de garnisons.
- source_word: παραθέσεις βρωμάτων
  choice: des réserves de nourriture
  rationale: L’expression évoque des vivres déposés et stockés; « réserves de nourriture » est clair, naturel et fidèle.
