  text: And the earth shook from their encampments, and the battle raged from morning until evening.
translation:
  language: fr
  text: La terre trembla à cause de leurs camps, et la bataille fut engagée du matin jusqu’au soir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν παρεμβολῶν αὐτῶν
  choice: sous le mouvement de leurs camps
  rationale: La préposition ἀπό exprime ici la cause, tandis que παρεμβολαί peut désigner les camps ou les armées rangées. Cette formulation naturelle conserve l’image des camps en mouvement sans suggérer que la terre tremble simplement à distance depuis leur emplacement.
- source_word: ἐγένετο ὁ πόλεμος συνηγμένος
  choice: la bataille fit rage
  rationale: L’expression grecque, littéralement difficile (« la bataille fut rassemblée/engagée »), décrit un combat pleinement engagé et soutenu. « fit rage » rend idiomatiquement son intensité et sa durée.
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: du matin jusqu’au soir
  rationale: Rend directement l’étendue temporelle indiquée par le grec.
