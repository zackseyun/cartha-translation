  yaml_path: translation/deuterocanon/1_maccabees/009/043.yaml
  text: And Bacchides heard[a], and on the day of the Sabbaths he came as far as the banks of the Jordan with a great force.
translation:
  language: fr
  text: Bacchidès l’apprit et, le jour du sabbat[a], il vint jusqu’aux rives du Jourdain avec des forces considérables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au jour des sabbats » ; il s’agit d’un idiome judéo-grec signifiant « le jour du sabbat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: l’apprit
  rationale: Dans ce contexte narratif, ἀκούω signifie que Bacchidès reçut la nouvelle de ce qui précède. « L’apprit » est naturel en français et explicite seulement l’objet implicite du grec.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: le jour du sabbat
  rationale: Le pluriel grec σαββάτων relève ici d’un idiome judéo-grec désignant le sabbat au singulier. « Le jour du sabbat » en restitue clairement le sens en français moderne.
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: jusqu’aux rives du Jourdain
  rationale: κρηπίς peut désigner une bordure ou une rive. Dans ce cadre géographique, « rives » rend naturellement l’arrivée au bord du Jourdain tout en conservant le pluriel grec.
- source_word: ἐν δυνάμει πολλῇ
  choice: avec des forces considérables
  rationale: δύναμις possède ici un sens militaire. « Des forces considérables » désigne un contingent important sans préciser davantage que le grec sa nature exacte.
- source_word: Βακχίδης
  choice: Bacchidès
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom grec.
