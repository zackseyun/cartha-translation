lexical_decisions:
- source_word: κατόπισθεν αὐτοῦ
  choice: derrière lui
  rationale: La locution indique une position à l’arrière. Le fragment ouvre au milieu d’une phrase commencée au verset précédent; la traduction en conserve donc le caractère incomplet.
- source_word: ἐκύκλωσαν αὐτὸν τὴν παρεμβολήν
  choice: Ils encerclèrent le camp où il se trouvait
  rationale: ἐκύκλωσαν exprime l’encerclement et παρεμβολή désigne ici un camp militaire. La construction grecque est irrégulière ou condensée; cette formulation rend naturellement l’idée contextuelle sans prétendre en lever toute la difficulté.
- source_word: ἐξετίναξαν
  choice: lancèrent
  rationale: Le verbe décrit la projection ou le tir des objets désignés par σχίζας. « Lancèrent » reste suffisamment général pour ne pas imposer un mécanisme précis.
- source_word: σχίζας
  choice: traits
  rationale: Ce terme rare désigne ici des projectiles. « Traits » convient au contexte militaire et peut évoquer des flèches sans réduire indûment le champ du mot grec.
- source_word: ἐκ πρωΐθεν ἕως δείλης
  choice: depuis le petit matin jusqu’au soir
  rationale: Cette expression restitue clairement la durée de l’attaque tout au long de la journée.
- source_word: λαός
  choice: les hommes
  rationale: Dans cette scène militaire, λαός désigne le groupe humain engagé dans le combat. « Les hommes » est naturel en français narratif et évite la possible lecture civile de « le peuple », tout en n’imposant pas le terme technique « soldats ».
