  yaml_path: translation/deuterocanon/1_maccabees/009/026.yaml
  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: fr
  text: Ils recherchaient sans relâche et traquaient les amis de Judas[a]. Ils les conduisaient à Bacchidès, qui se vengeait d’eux[b], et ils les tournaient en dérision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les partisans de Judas » ou « les alliés de Judas ». Le grec dit littéralement « les amis de Judas », expression qui peut désigner ici ses soutiens politiques ou militaires.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi signifier « les punissait » ou « exerçait la justice contre eux ». Dans ce contexte hostile, il peut avoir le sens de « se venger d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν καὶ ἐξηραύνων
  choice: recherchaient sans relâche et traquaient
  rationale: Les deux imparfaits décrivent une action persistante ou répétée. La combinaison conserve le redoublement grec tout en exprimant une recherche active et hostile en français naturel.
- source_word: τοὺς φίλους Ἰούδου
  choice: les amis de Judas
  rationale: « Amis » rend directement φίλους, qui peut aussi désigner ici les partisans ou alliés de Judas; cette portée contextuelle est signalée en note.
- source_word: ἦγον αὐτοὺς πρὸς Βακχίδην
  choice: Ils les conduisaient à Bacchidès
  rationale: L’imparfait suggère des arrestations et des transferts répétés; πρός avec l’accusatif indique le mouvement vers Bacchidès.
- source_word: ἐξεδίκα αὐτούς
  choice: qui se vengeait d’eux
  rationale: Le verbe peut évoquer l’exercice de la justice, le châtiment ou la vengeance. Le contexte hostile favorise « se vengeait », sans dissimuler les autres possibilités.
- source_word: ἐνέπαιζον αὐτοῖς
  choice: ils les tournaient en dérision
  rationale: Cette expression française actuelle et digne restitue l’idée de raillerie humiliante portée par ἐμπαίζω.
