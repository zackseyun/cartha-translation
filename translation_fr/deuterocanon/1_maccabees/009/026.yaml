translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent le caractère continu ou répété des poursuites, des transferts, des représailles et des humiliations. Le changement de sujet entre « qui se vengeait » (Bacchidès, singulier dans le grec) et « ils les tournaient » (pluriel) est explicitement préservé.
