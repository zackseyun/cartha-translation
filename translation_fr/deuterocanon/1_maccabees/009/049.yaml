translation:
  language: fr
  text: Ce jour-là, environ mille hommes tombèrent aux côtés de Bacchidès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce jour-là, environ mille hommes du camp de Bacchidès tombèrent. » La tournure grecque peut exprimer l’association avec Bacchidès plutôt qu’une proximité physique ou le fait qu’il soit directement responsable de leur mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέπεσαν
  choice: tombèrent
  rationale: Dans ce contexte militaire, le verbe évoque des hommes qui tombent au combat, sans qu’il soit nécessaire d’expliciter davantage la manière de leur mort.
- source_word: παρὰ Βακχίδα
  choice: aux côtés de Bacchidès
  rationale: Cette formulation rend l’association exprimée par παρά avec l’accusatif tout en évitant d’attribuer explicitement leur mort à Bacchidès. La note conserve l’autre lecture contextuelle possible, celle de l’appartenance à son camp.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: ce jour-là
  rationale: Expression temporelle française naturelle et fidèle au datif grec.
- source_word: εἰς χιλίους ἄνδρας
  choice: environ mille hommes
  rationale: Avec un nombre, εἰς peut indiquer un total approximatif, ici de l’ordre de mille hommes.
