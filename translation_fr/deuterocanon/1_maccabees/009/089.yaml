  text: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
translation:
  language: fr
  text: une agrafe en or[a], comme il est d’usage d’en donner aux parents des rois ; et il lui donna Accaron[b] et tout son territoire en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte seulement l’adjectif féminin « en or », le nom étant sous-entendu d’après le contexte précédent. « Agrafe » est ajouté pour compléter la phrase ; « broche », « fermoir » ou « ornement » sont aussi possibles.
    reason: lexical_alternative
  - marker: b
    text: Accaron est la forme grecque du nom de lieu plus couramment appelé Éqron.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
  choice: en or
  rationale: L’adjectif féminin signifie « en or » ou « dorée » et qualifie ici un nom sous-entendu par le contexte précédent.
- source_word: '[objet sous-entendu par le contexte]'
  choice: agrafe
  rationale: Le grec ne conserve dans ce verset que l’adjectif féminin χρυσῆν. « Agrafe » fournit en français un nom féminin naturel pour ce présent honorifique, tout en laissant l’ajout interprétatif signalé en note.
- source_word: ἔθος
  choice: il est d’usage
  rationale: Cette tournure française naturelle rend l’expression idiomatique ὡς ἔθος ἐστὶν sans en affaiblir la notion de coutume établie.
- source_word: συγγενεῦσιν
  choice: parents
  rationale: « Parents » désigne ici les membres de la parenté, non les seuls père et mère ; le contexte royal rend cette acception claire et le français reste actuel.
- source_word: τῶν βασιλέων
  choice: des rois
  rationale: Rendu direct du génitif pluriel, sans transformer explicitement la parenté en titre de cour.
- source_word: Ἀκκαρὼν
  choice: Accaron
  rationale: La forme grecque du nom de lieu est translittérée en français ; la forme traditionnelle Éqron est indiquée en note.
- source_word: ὅρια
  choice: territoire
  rationale: Dans ce contexte de concession foncière, le pluriel grec désigne les terres comprises dans les limites de la ville plutôt que les seules frontières.
- source_word: εἰς κληρονομίαν
  choice: en héritage
  rationale: Cette formulation concise conserve la portée patrimoniale et durable de la concession.
