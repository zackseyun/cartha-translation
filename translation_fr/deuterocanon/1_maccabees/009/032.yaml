lexical_decisions:
- source_word: ἔγνω
  choice: l’apprit
  rationale: L’aoriste de γινώσκω exprime ici l’acquisition d’une information dans le fil du récit. « L’apprit » est naturel en français et évite le sens statique de « savait ».
- source_word: ἐζήτει
  choice: cherchait
  rationale: L’imparfait grec présente une action en cours ou une tentative persistante. L’imparfait français en conserve naturellement l’aspect.
- source_word: ἀποκτεῖναι
  choice: à le tuer
  rationale: Le verbe signifie directement « tuer »; cette formulation n’ajoute ni l’idée d’une exécution officielle ni un registre archaïque.
- source_word: Βακχίδης
  choice: Bacchidès
  rationale: Forme française traditionnelle et usuelle du nom propre grec.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin singulier renvoie au personnage masculin mentionné dans le contexte; le pronom objet français est direct et naturel.
