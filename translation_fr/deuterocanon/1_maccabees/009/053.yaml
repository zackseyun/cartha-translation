  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: fr
  text: Ils prirent comme otages les fils des dirigeants du pays et les placèrent sous garde dans la citadelle[a], à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Acra », la citadelle fortifiée de Jérusalem.
    reason: Alternative lexicale et possible emploi de ἄκρα comme nom propre.
lexical_decisions:
- source_word: ἔλαβον
  choice: ils prirent
  rationale: Verbe narratif simple; « prirent » exprime naturellement la prise en charge forcée sans accentuer au-delà du grec l’idée de capture violente.
- source_word: τοὺς υἱοὺς
  choice: les fils
  rationale: Le grec désigne explicitement les fils; le terme masculin familial est donc conservé.
- source_word: τῶν ἡγουμένων
  choice: des dirigeants
  rationale: Le participe substantivé désigne ceux qui exercent une fonction de direction, sans nécessairement évoquer un titre politique officiel.
- source_word: τῆς χώρας
  choice: du pays
  rationale: « Pays » rend naturellement χώρα dans ce contexte territorial, tout en préservant son sens assez large.
- source_word: ὁμήρα
  choice: comme otages
  rationale: ὁμήρα désigne des otages; la tournure française « prendre comme otages » exprime clairement leur fonction.
- source_word: ἔθεντο
  choice: les placèrent
  rationale: « Placèrent » convient au registre narratif soutenu et rend le geste de mise en détention.
- source_word: ἐν τῇ ἄκρᾳ
  choice: dans la citadelle
  rationale: ἄκρα peut désigner une citadelle et, ici, probablement la forteresse de Jérusalem appelée l’Acra; le texte principal privilégie le terme courant et la note conserve l’autre possibilité.
- source_word: ἐν φυλακῇ
  choice: sous garde
  rationale: Cette expression rend l’idée de détention surveillée sans préciser indûment qu’ils se trouvaient dans un bâtiment carcéral.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « prirent comme otages » est idiomatique; « dirigeants » évite de surdéterminer la fonction des hommes concernés. La note est placée après « citadelle », terme auquel elle se rapporte.
