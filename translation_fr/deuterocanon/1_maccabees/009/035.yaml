  naturalness: Le français est clair et de registre approprié. « Comme chef du groupe » rend plus directement la fonction participiale de ἡγούμενον que « pour diriger le groupe », tout en évitant d’imposer un grade militaire. « Prendre en dépôt » exprime naturellement la réception en garde.
  terminology: « Nabatéens », « groupe » et « bagages » sont appropriés. « Prendre en dépôt » conserve la nuance de garde confiée de παραθέσθαι sans la réduire à un simple entreposage.
