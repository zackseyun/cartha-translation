  yaml_path: translation/deuterocanon/1_maccabees/009/035.yaml
  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
translation:
  language: fr
  text: Il envoya son frère comme chef du groupe et demanda à ses amis nabatéens de prendre en dépôt les nombreux bagages de ce groupe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de recevoir et de garder les nombreux bagages de ce groupe ». Le verbe grec peut désigner le fait de recevoir des biens confiés afin de les garder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Le verbe narratif courant signifie « envoyer »; ce choix est direct et naturel.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Rend simplement et exactement le groupe nominal possessif grec.
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: pour diriger le groupe
  rationale: Le participe présente le frère dans une fonction de direction. « Groupe » convient mieux que « foule » à cette troupe en déplacement, sans lui attribuer un grade militaire absent du grec.
- source_word: παρεκάλεσεν
  choice: demanda
  rationale: Dans ce contexte de requête pratique, « demanda » rend naturellement le verbe, qui peut signifier prier, exhorter ou solliciter.
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: ses amis nabatéens
  rationale: Formulation française concise qui conserve à la fois l’identité nabatéenne et le lien d’amitié.
- source_word: παραθέσθαι αὐτοῖς
  choice: de garder en dépôt
  rationale: Le moyen grec évoque ici des biens remis à quelqu’un pour qu’il les reçoive et les conserve; la formulation française exprime cette garde fiduciaire sans lourdeur.
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: leurs nombreux bagages
  rationale: ἀποσκευή désigne les bagages ou effets transportés, et τὴν πολλήν en souligne la grande quantité.
