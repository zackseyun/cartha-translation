translation:
  language: fr
  text: avec ceux qui avaient été brûlés[a], soit huit mille hommes. Puis il partit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce témoin grec, le sens du verset est fragmentaire : seul subsiste l’énoncé « avec ceux qui avaient été brûlés, soit huit mille hommes. Puis il partit ». La traduction suit de près le texte conservé sans reconstruire le contexte manquant.'
    reason: textual_variant
lexical_decisions:
- source_word: σὺν
  choice: avec
  rationale: La préposition ajoute ce groupe à un nombre ou à un groupe mentionné auparavant; « avec » restitue cette relation simplement.
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: ceux qui avaient été brûlés
  rationale: Le participe aoriste passif désigne des personnes ayant subi l’action de brûler. Cette formulation reste proche du grec sans ajouter « vifs », précision possible mais non explicite.
- source_word: εἰς
  choice: soit
  rationale: Dans ce contexte numérique, εἰς introduit vraisemblablement le total atteint; « soit » donne en français naturel la valeur résultative de l’expression.
- source_word: ἄνδρας
  choice: hommes
  rationale: Le grec emploie spécifiquement ἄνδρας, terme masculin, plutôt qu’un mot générique pour des personnes.
- source_word: ὀκτακισχιλίους
  choice: huit mille
  rationale: Traduction directe du nombre cardinal.
- source_word: ἀπῆρεν
  choice: il partit
  rationale: L’aoriste exprime ici le départ. « Il partit » est naturel, clair et adapté au registre narratif.
