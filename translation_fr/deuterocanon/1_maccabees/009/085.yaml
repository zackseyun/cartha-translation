  source_fidelity: 'Le fragment grec est fidèlement rendu : σὺν est correctement traduit par « avec », le participe passif τοῖς ἐμπυρισθεῖσιν par « ceux qui avaient été brûlés » sans ajouter l’idée de « brûlés vifs », et ἄνδρας ὀκτακισχιλίους par « huit mille hommes ». « Soit » exprime de manière naturelle la valeur totalisante probable de εἰς, tout en conservant le caractère elliptique du témoin. « Puis il partit » rend correctement καὶ ἀπῆρεν dans un français narratif naturel.'
