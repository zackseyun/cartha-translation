  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: fr
  text: Il établit son camp contre Joppé, mais les habitants de la ville lui refusèrent l’entrée, car une garnison d’Apollonios se trouvait à Joppé, et ils combattirent contre elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « ils combattirent contre elle ». Après les verbes précédents au singulier, le sujet passe au pluriel ; « ils » désigne vraisemblablement le personnage désigné par « il » et ses troupes, tandis que « elle » renvoie à la ville de Joppé. Cette formulation abrupte est conservée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: établit son camp devant
  rationale: Le verbe désigne l’établissement d’un camp ou le déploiement de troupes. Avec ἐπί et l’accusatif d’une ville, « devant » exprime naturellement l’approche militaire hostile sans réduire le sens à une simple marche.
- source_word: Ἰόππην
  choice: Joppé
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: ἀπέκλεισαν αὐτόν
  choice: lui en interdirent l’accès
  rationale: Le verbe signifie fermer dehors ou empêcher d’entrer, et αὐτόν renvoie explicitement à l’homme qui commande les forces. Cette formulation rend le sens idiomatiquement en français.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: les gens de la ville
  rationale: Expression naturelle et inclusive qui désigne les personnes venant de la ville sans ajouter une précision masculine absente du grec.
- source_word: ὅτι
  choice: car
  rationale: Introduit ici la raison pour laquelle l’accès lui fut interdit.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: une garnison d’Apollonios
  rationale: Le génitif indique une garnison appartenant à Apollonios ou placée sous son autorité. L’article indéfini convient au nom grec sans article.
- source_word: ἐπολέμησαν αὐτήν
  choice: ils engagèrent le combat contre elle
  rationale: Le pluriel de ἐπολέμησαν est conservé, malgré le changement abrupt après le sujet singulier antérieur. Le pronom féminin αὐτήν renvoie le plus naturellement à la ville, πόλις étant féminin en grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Établir son camp devant » garde la valeur militaire sans archaïsme excessif. La transition au pluriel et l’ambiguïté du pronom final ne sont pas harmonisées.
