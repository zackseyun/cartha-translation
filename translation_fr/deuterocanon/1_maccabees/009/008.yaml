  yaml_path: translation/deuterocanon/1_maccabees/009/008.yaml
  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: fr
  text: 'Il perdit courage[a] et dit à ceux qui restaient : « Levons-nous et montons contre nos adversaires, si jamais nous pouvons les combattre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fut affaibli » ou « il se sentit défaillir » ; le verbe grec peut évoquer un affaiblissement physique aussi bien qu’un profond découragement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: Il perdit courage
  rationale: Le passif de ἐκλύω peut évoquer un affaiblissement physique ou un effondrement intérieur. Dans ce contexte militaire, « perdit courage » rend naturellement la défaillance de résolution tout en laissant les autres nuances en note.
- source_word: τοῖς καταλειφθεῖσιν
  choice: à ceux qui restaient
  rationale: Le participe désigne les hommes laissés ou encore présents. Cette formulation française est naturelle et ne précise pas indûment qu’ils auraient été abandonnés ou qu’ils seraient tous des survivants.
- source_word: Ἀναστῶμεν
  choice: Levons-nous
  rationale: Le subjonctif d’exhortation est rendu directement par la première personne du pluriel à l’impératif, avec le sens de se mettre debout ou en mouvement.
- source_word: ἀναβῶμεν
  choice: montons
  rationale: Le verbe conserve l’idée de monter, qu’elle soit topographique ou liée à l’avancée militaire, sans imposer une interprétation tactique plus précise.
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: nos adversaires
  rationale: ὑπεναντίος désigne ceux qui se dressent contre quelqu’un. « Adversaires » préserve cette relation d’opposition et convient au registre militaire.
- source_word: ἐὰν ἄρα
  choice: si toutefois
  rationale: La combinaison exprime une condition teintée d’incertitude. « Si toutefois » restitue en français actuel cette hésitation sans lourdeur.
- source_word: δυνώμεθα
  choice: nous pouvons
  rationale: Dans la proposition conditionnelle, le verbe exprime la capacité incertaine du groupe. « Nous pouvons » est idiomatique et fidèle.
- source_word: πολεμῆσαι
  choice: les combattre
  rationale: L’infinitif signifie combattre ou faire la guerre. Le pronom reprend clairement les adversaires et produit une phrase française naturelle.
