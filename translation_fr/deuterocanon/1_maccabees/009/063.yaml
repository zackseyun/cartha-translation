  yaml_path: translation/deuterocanon/1_maccabees/009/063.yaml
  text: And Bacchides learned of it and gathered all his forces[c][b][a], and he gave orders to those from Judea.
translation:
  language: fr
  text: Bacchidès l’apprit. Il rassembla toutes ses forces[a] et donna des ordres à ceux qui venaient de Judée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute sa multitude »; il s’agit probablement ici de l’ensemble de ses troupes ou de ses partisans.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à ceux de Judée ». Le grec dit littéralement « à ceux venant de Judée » et peut désigner des personnes originaires de Judée ou qui lui étaient associées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprit
  rationale: L’aoriste de γινώσκω exprime ici la prise de connaissance d’un fait dans la suite du récit; « l’apprit » est naturel et concis.
- source_word: συνήγαγεν
  choice: rassembla
  rationale: Le verbe désigne le fait de réunir des personnes en vue d’une action, ici dans un contexte militaire.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: toutes ses forces
  rationale: Littéralement « toute sa multitude »; dans ce contexte, l’expression désigne vraisemblablement l’ensemble des troupes ou partisans sous son commandement.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: à ceux qui venaient de Judée
  rationale: Cette formulation conserve la valeur d’origine ou de provenance de ἐκ sans réduire la phrase au sens purement locatif « en Judée ».
- source_word: παρήγγειλεν
  choice: donna des ordres
  rationale: Le verbe signifie donner des instructions ou des ordres; la formulation convient au contexte militaire.
