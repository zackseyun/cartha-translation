  text: And they avenged the blood of their brother[b][a], and returned to the hill country of the Jordan.
translation:
  language: fr
  text: Ils vengèrent le sang de leur frère[a], puis retournèrent dans la région montagneuse du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils vengèrent la vengeance du sang de leur frère », expression emphatique désignant la vengeance de sang.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vers la montagne du Jourdain ». Le grec peut désigner une montagne particulière ou, plus largement, une région montagneuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδίκησαν τὴν ἐκδίκησιν αἵματος
  choice: vengèrent le sang
  rationale: La tournure grecque à objet de même racine signifie littéralement « vengèrent la vengeance du sang ». « Vengèrent le sang » restitue naturellement l’idée de vengeance de sang tout en conservant la force du verbe.
- source_word: ἀδελφοῦ αὐτῶν
  choice: de leur frère
  rationale: Le grec emploie le singulier ἀδελφοῦ, dont le sens direct est « frère » ; rien dans le verset n’impose l’élargissement à « parent » ou « compatriote ».
- source_word: ἀπέστρεψαν
  choice: retournèrent
  rationale: Dans ce récit de déplacement, le verbe indique un retour vers un lieu ou une région antérieurement occupés.
- source_word: εἰς τὸ ὄρος τοῦ Ἰορδάνου
  choice: dans la région montagneuse du Jourdain
  rationale: ὄρος peut désigner une montagne précise, mais aussi un relief montagneux ou une région de hauteurs. Cette formulation française convient à une destination géographique régionale sans exclure l’autre lecture, signalée en note.
