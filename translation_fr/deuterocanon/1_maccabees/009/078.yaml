  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: fr
  text: Il le poursuivit jusqu’à Azot, et les troupes engagèrent le combat derrière lui. Et Apollonios laissait en arrière mille cavaliers[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni s’arrête sur « mille cavaliers » ; la phrase paraît se poursuivre au verset suivant.
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: Il le poursuivit
  rationale: Dans ce récit militaire, διώκω suivi de ὀπίσω αὐτοῦ exprime naturellement une poursuite hostile.
- source_word: εἰς Ἄζωτον
  choice: jusqu’à Azôtos
  rationale: La préposition εἰς après un verbe de poursuite marque ici le point atteint; « jusqu’à » restitue cette portée.
- source_word: συνῆψαν … εἰς πόλεμον
  choice: engagèrent le combat
  rationale: Dans un contexte militaire, συνάπτω avec εἰς πόλεμον désigne l’entrée en combat.
- source_word: αἱ παρεμβολαὶ
  choice: les troupes
  rationale: Bien que παρεμβολή signifie littéralement « camp », le pluriel désigne ici vraisemblablement les forces organisées; « troupes » est clair sans imposer une structure précise.
- source_word: ὀπίσω αὐτοῦ
  choice: derrière lui
  rationale: La valeur spatiale est conservée, ainsi que l’ambiguïté du référent masculin singulier.
- source_word: ἀπέλειπεν
  choice: avait laissé en arrière
  rationale: L’imparfait grec présente cette disposition comme antérieure ou en cours par rapport au combat; le plus-que-parfait français rend naturellement cette relation, tandis que « en arrière » garde la valeur séparative du préverbe ἀπο-.
- source_word: χιλίαν ἵππον
  choice: mille cavaliers
  rationale: ἵππος, littéralement « cheval », sert ici par métonymie à compter une force de cavalerie; « cavaliers » est le français militaire naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises proches du grec. La formulation conserve « derrière lui », dont le référent reste implicite, et signale seulement l’arrêt syntaxiquement abrupt du texte source.
