revisions:
- from: Mais Bacchidès se trouvait à l’aile droite[a]. La phalange s’approcha des deux côtés[b], et ils faisaient retentir les trompettes. Ceux qui étaient avec Judas sonnèrent eux aussi de la trompette.
  to: Mais Bacchidès se trouvait à l’aile droite[a], et la phalange s’approcha en venant des deux côtés[b] ; ils faisaient sonner les trompettes, et ceux qui étaient avec Judas firent eux aussi sonner les trompettes.
  rationale: La révision précise le complément spatial « depuis/des deux côtés » sans attribuer au texte une tactique déterminée. Elle rétablit aussi le pluriel explicite des trompettes dans la réponse des hommes avec Judas, tout en conservant l’imparfait initial, l’aoriste final et l’emphase de « eux aussi ».
