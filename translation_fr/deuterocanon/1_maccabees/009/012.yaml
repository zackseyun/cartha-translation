  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: fr
  text: Mais Bacchidès se trouvait à l’aile droite[a], et la phalange s’approcha en venant des deux côtés[b] ; ils faisaient sonner les trompettes, et ceux qui étaient avec Judas firent eux aussi sonner les trompettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la corne droite » ; il s’agit d’une expression militaire désignant l’aile ou le flanc droit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « s’approcha des deux côtés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Βακχίδης
  choice: Bacchidès
  rationale: Translittération française usuelle du nom grec, avec une forme naturelle en français.
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: à l’aile droite
  rationale: κέρας signifie littéralement « corne », mais désigne ici l’aile d’une formation militaire. « À l’aile droite » est précis et idiomatique.
- source_word: ἤγγισεν
  choice: s’approcha
  rationale: L’aoriste de ἐγγίζω exprime ici le mouvement d’approche; le passé simple convient au récit et contraste avec l’imparfait qui suit.
- source_word: ἡ φάλαγξ
  choice: la phalange
  rationale: Le terme militaire spécifique est conservé en français afin de préserver l’image de la formation de combat.
- source_word: ἐκ τῶν δύο μερῶν
  choice: des deux côtés
  rationale: Cette formulation naturelle conserve l’idée d’une approche provenant de deux côtés, sans préciser davantage la manœuvre.
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: ils faisaient retentir les trompettes
  rationale: L’imparfait grec décrit une action en cours; « faisaient retentir » rend l’emploi instrumental des trompettes et distingue cet aspect de l’aoriste suivant.
- source_word: οἱ παρὰ Ἰούδαν
  choice: ceux qui étaient avec Judas
  rationale: La formulation reste proche du grec et ne précise pas au-delà du texte s’il s’agit exclusivement de soldats ou de partisans.
- source_word: ἐσάλπισαν καὶ αὐτοὶ ταῖς σάλπιγξιν
  choice: sonnèrent eux aussi de la trompette
  rationale: « Eux aussi » conserve l’insistance de καὶ αὐτοί et présente l’action comme la réponse du camp de Judas, tandis que le passé simple rend l’aoriste.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le contraste aspectuel entre l’imparfait ἐφώνουν et l’aoriste ἐσάλπισαν est conservé par « faisaient retentir » et « sonnèrent ». Les répétitions et l’emphase du grec sont maintenues sans alourdir excessivement la phrase.
