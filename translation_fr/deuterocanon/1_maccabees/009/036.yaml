  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: fr
  text: Les fils de Jambri sortirent de Médaba, saisirent Jean et tout ce qu’il avait, puis repartirent en les emmenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie littéralement le participe « ayant », dont l’objet est sous-entendu. Il renvoie vraisemblablement à Jean et à tout ce qu’il avait ; on pourrait aussi traduire : « puis partirent en emmenant Jean avec tous ses biens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: les fils de Jambri
  rationale: Traduction formelle de υἱοί et translittération du nom propre; l’expression peut désigner les membres du clan ou de la maison de Jambri, sans se limiter nécessairement à ses fils directs.
- source_word: ἐκ Μηδαβά
  choice: de Médaba
  rationale: ἐκ exprime ici le mouvement depuis l’intérieur d’un lieu; « sortirent de Médaba » est naturel en français et conserve cette valeur.
- source_word: συνέλαβον
  choice: saisirent
  rationale: Le verbe indique une prise hostile ou une capture. « Saisirent » évite les connotations judiciaires plus précises d’« arrêtèrent ».
- source_word: Ἰωάνην
  choice: Jean
  rationale: Forme française traditionnelle correspondant au grec Ἰωάνης; une rétroversion comme « Yohanan » ne découle pas directement du texte grec.
- source_word: πάντα ὅσα εἶχεν
  choice: tout ce qu’il avait
  rationale: Cette formulation naturelle conserve la totalité exprimée par πάντα et la construction relative ὅσα εἶχεν.
- source_word: ἀπῆλθον ἔχοντες
  choice: puis repartirent en les emmenant
  rationale: Le participe ἔχοντες est elliptique et renvoie vraisemblablement à Jean ainsi qu’à tout ce qu’il possédait. La formulation française rend cette prise continue sans masquer l’ambiguïté du renvoi.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit historique. « Les fils de Jambri » conserve l’expression grecque, malgré sa possible portée clanique. Le pronom pluriel « les » maintient le renvoi collectif et l’ambiguïté concise de la dernière proposition.
