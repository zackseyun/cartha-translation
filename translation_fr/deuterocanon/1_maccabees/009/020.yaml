  text: And they mourned for him there[a], and all Israel mourned for him with great mourning, and they grieved for many days and said,
translation:
  language: fr
  text: 'Ils se lamentèrent là sur lui[a], et tout Israël le pleura avec de grandes lamentations. Ils furent en deuil pendant de nombreux jours et dirent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec accumule les termes du deuil : il répète d’abord un verbe de lamentation, emploie ensuite le nom apparenté « grande lamentation », puis un autre verbe signifiant « être en deuil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόψαντο
  choice: se lamentèrent / se lamenta
  rationale: Dans un contexte funèbre, le moyen de κόπτω désigne l’action de se lamenter ou de mener le deuil. « Se lamenter » est clair en français moderne et sa répétition reflète celle du grec sans préciser indûment un geste physique particulier.
- source_word: αὐτόν
  choice: sur lui
  rationale: Le pronom renvoie à Judas dans le contexte précédent. Avec « se lamenter », le français demande naturellement la préposition « sur ».
- source_word: ἐκεῖ
  choice: là
  rationale: Adverbe de lieu simple, rendu de façon directe et idiomatique.
- source_word: πᾶς Ἰσραήλ
  choice: tout Israël
  rationale: Cette expression collective nationale est naturelle en français biblique moderne et conserve la portée corporative du grec.
- source_word: κοπετὸν μέγαν
  choice: profondément
  rationale: Le grec emploie un complément nominal cognat, littéralement une « grande lamentation ». « Se lamenta profondément » en restitue l’intensité dans un français naturel, tandis que la note signale la reprise lexicale de l’original.
- source_word: ἔπενθουν
  choice: ils furent dans le deuil
  rationale: πενθέω appartient au même champ du deuil, tout en étant distinct de ἐκόψαντο. Cette formulation préserve cette variation et exprime un état prolongé.
- source_word: ἡμέρας πολλὰς
  choice: pendant de nombreux jours
  rationale: L’accusatif indique la durée ; cette formulation est précise et idiomatique en français.
- source_word: καὶ εἶπαν
  choice: 'et dirent :'
  rationale: La proposition introduit les paroles du verset suivant. Les deux-points français signalent naturellement cette introduction tout en conservant la coordination.
