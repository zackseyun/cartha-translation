translation_notes:
  register: Français international moderne, digne et accessible. La répétition du verbe « se lamenter » conserve l’insistance du grec ; « profondément » évite toutefois le tour peu naturel « d’une grande lamentation ». Le deux-points prépare la citation du verset suivant.
