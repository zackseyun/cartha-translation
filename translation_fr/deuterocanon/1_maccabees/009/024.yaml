  text: In those days a very great famine came about[a], and the land defected with them.
translation:
  language: fr
  text: En ces jours-là, une très grande famine survint, et le pays se rallia à eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « passa dans leur camp ». Le verbe grec indique une défection ou un passage à l’autre parti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: En ces jours-là
  rationale: Cette formule narrative courante suit de près le grec tout en restant naturelle dans un registre biblique moderne.
- source_word: ἐγενήθη
  choice: survint
  rationale: Le verbe exprime ici la survenue d’un événement; « survint » convient naturellement à une famine.
- source_word: λιμὸς μεγάλη σφόδρα
  choice: une très grande famine
  rationale: « Famine » rend λιμός, tandis que « très grande » conserve le double renforcement de μεγάλη et σφόδρα sans atténuer l’intensité.
- source_word: αὐτομόλησεν
  choice: se rallia
  rationale: Le verbe désigne le passage ou la défection vers un autre parti. « Se rallia » exprime clairement ce changement d’allégeance dans un français naturel.
- source_word: ἡ χώρα
  choice: le pays
  rationale: χώρα peut désigner le pays, le territoire ou sa population. « Le pays » conserve cette ampleur et la personnification du texte grec.
- source_word: μετʼ αὐτῶν
  choice: à eux
  rationale: Avec le verbe de changement de camp, le français idiomatique demande ici « à eux », qui rend l’idée d’un passage dans leur camp, bien que μετά avec le génitif signifie littéralement « avec eux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la personnification du « pays » et n’ajoute aucun lien causal entre la famine et le changement d’allégeance.
