lexical_decisions:
- source_word: φάλαγγα
  choice: la phalange
  rationale: Le terme désigne une ligne de bataille ou une formation militaire compacte. « Phalange » conserve ici la précision et le caractère abrupt du fragment grec.
- source_word: ἵππος
  choice: la cavalerie
  rationale: Bien qu’au singulier, ἡ ἵππος a ici un sens collectif et désigne les troupes montées.
- source_word: ἐξελύθη
  choice: se disloqua
  rationale: Le verbe évoque une formation qui se défait ou se désagrège ; « se disloqua » convient au contexte militaire sans ajouter l’idée explicite d’une déroute.
- source_word: συνετρίβησαν
  choice: furent écrasés
  rationale: Le verbe exprime une défaite violente, littéralement l’action de briser ou de fracasser.
- source_word: ἀπʼ αὐτοῦ
  choice: par lui
  rationale: Dans ce récit de combat, cette formulation attribue naturellement la défaite au référent masculin, tout en restant proche de l’expression grecque concise.
- source_word: ἐσκορπίσθη
  choice: se dispersa
  rationale: Ce choix rend directement la dispersion des troupes dans un registre militaire naturel.
- source_word: πεδίῳ
  choice: la plaine
  rationale: Dans ce contexte militaire, πεδίον désigne vraisemblablement un terrain découvert ou une plaine plutôt qu’un champ cultivé.
