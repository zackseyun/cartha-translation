  text: And the right wing was crushed before them[b][a], and he pursued after them as far as the mountain of Azotus.
translation:
  language: fr
  text: L’aile droite[a] fut écrasée devant eux, et il les poursuivit jusqu’à la montagne d’Azôt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la corne droite » ; cette image militaire désigne ici l’aile droite de l’armée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’au mont Azôt ». L’expression grecque peut désigner soit une montagne précise, soit la région montagneuse associée à Azôt.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: fut écrasée
  rationale: Le passif de συντρίβω exprime l’idée d’être brisé ou écrasé. Dans ce contexte de bataille, « fut écrasée » conserve la force de l’image sans la réduire au seul sens interprétatif de « fut mise en déroute ».
- source_word: τὸ δεξιὸν κέρας
  choice: l’aile droite
  rationale: κέρας signifie littéralement « corne », mais désigne ici métaphoriquement un côté du dispositif militaire. « L’aile droite » est l’équivalent militaire français le plus naturel.
- source_word: ἀπʼ αὐτῶν
  choice: devant eux
  rationale: Après un verbe décrivant l’effondrement au combat, ἀπό peut indiquer que l’on cède sous la pression adverse. « Devant eux » préserve cette relation sans préciser excessivement l’agentivité.
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: il les poursuivit
  rationale: L’expression idiomatique signifie se lancer à la poursuite des fuyards. Le singulier « il » suit la forme verbale grecque et renvoie vraisemblablement à Judas comme chef de ses troupes.
- source_word: ἕως Ἀζώτου ὄρους
  choice: jusqu’à la montagne d’Azôt
  rationale: Cette formulation reste proche de l’ordre grec et évite de décider avec certitude s’il s’agit d’un sommet portant ce nom ou de la zone montagneuse associée à Azôt.
