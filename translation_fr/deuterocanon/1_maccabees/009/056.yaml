  text: And Alcimus died at that time after great torment[a].
translation:
  language: fr
  text: Alcime mourut alors, dans de grands tourments[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après de grands tourments ». L’expression grecque peut décrire soit les tourments qui accompagnèrent sa mort, soit ceux qui la précédèrent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: L’aoriste de ἀποθνῄσκω rapporte simplement le décès comme un événement achevé; « mourut » convient au récit.
- source_word: Ἄλκιμος
  choice: Alkime
  rationale: « Alkime » est la forme française traditionnelle et reconnaissable de ce nom propre.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: à cette époque-là
  rationale: Cette formulation conserve la référence temporelle générale de καιρός sans lui donner un sens technique.
- source_word: μετὰ βασάνου μεγάλης
  choice: dans de grandes souffrances
  rationale: μετά avec le génitif signifie normalement « avec » et décrit ici les circonstances pénibles de la mort. Cette formulation française naturelle préserve l’intensité de βασάνος sans décider que les souffrances ont nécessairement précédé la mort.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La tournure principale suit la valeur usuelle de μετά avec le génitif, tandis que la note conserve l’ambiguïté temporelle possible.
