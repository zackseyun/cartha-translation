  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: fr
  text: Les autres récits sur Judas, sur ses guerres, sur les actes de bravoure qu’il accomplit et sur sa grandeur n’ont pas été consignés par écrit, car ils étaient extrêmement nombreux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων
  choice: les autres récits
  rationale: L’expression désigne ce qui reste ou ce qui s’ajoute aux récits déjà rapportés. « Les autres récits » restitue naturellement en français la formule récapitulative historiographique.
- source_word: πολέμων
  choice: guerres
  rationale: Le terme désigne largement les conflits militaires de Judas ; « guerres » conserve cette portée sans la limiter à des batailles particulières.
- source_word: ἀνδραγαθιῶν
  choice: actes de bravoure
  rationale: Le mot évoque des actions courageuses et valeureuses. Cette expression est claire, actuelle et conserve la valeur élogieuse du grec.
- source_word: μεγαλωσύνης
  choice: grandeur
  rationale: Dans ce contexte, le terme renvoie à la stature et à l’importance de Judas plutôt qu’à une majesté royale au sens technique.
- source_word: οὐ κατεγράφη
  choice: n’ont pas été consignés par écrit
  rationale: Le passif indique que ces récits et ces faits n’ont pas été intégrés au récit écrit. La formulation rend explicitement la notion de mise par écrit.
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: car ils étaient extrêmement nombreux
  rationale: 'La proposition donne la raison de l’absence de consignation : les éléments à rapporter étaient en très grand nombre. « Extrêmement » rend la force de σφόδρα.'
