translation:
  language: fr
  text: Le combat devint acharné, et beaucoup d’hommes des deux camps tombèrent blessés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβαρύνθη
  choice: devint acharné
  rationale: Le passif exprime littéralement l’idée que le combat « devint lourd »; dans ce contexte militaire, « devint acharné » restitue naturellement l’intensification et la violence de l’affrontement.
- source_word: ὁ πόλεμος
  choice: le combat
  rationale: Bien que πόλεμος puisse désigner la guerre, il renvoie ici à l’affrontement en cours; « le combat » convient mieux à la scène immédiate.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Le verbe garde l’image grecque habituelle du combattant qui tombe, sans préciser davantage la manière.
- source_word: τραυματίαι
  choice: blessés
  rationale: Le terme désigne des hommes blessés. La tournure « tombèrent blessés » conserve la relation entre ἔπεσαν et τραυματίαι sans transformer les blessés en morts ou en simples « pertes ».
- source_word: πολλοὶ
  choice: beaucoup d’hommes
  rationale: Le masculin pluriel substantivé désigne ici de nombreux combattants; l’ajout de « d’hommes » rend la phrase française claire et naturelle.
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: dans les deux camps
  rationale: L’expression signifie littéralement « parmi ceux-ci et parmi ceux-là » et désigne les deux groupes opposés. « Dans les deux camps » en donne le sens idiomatique et symétrique en français.
