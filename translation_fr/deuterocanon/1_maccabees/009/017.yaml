  source_fidelity: Le grec décrit l'intensification du combat (ἐβαρύνθη), puis précise que de nombreux blessés tombèrent, provenant des deux forces opposées (ἐκ τούτων καὶ ἐκ τούτων). « Le combat devint acharné » rend bien le sens contextuel. Il est préférable de rattacher explicitement « des deux camps » aux hommes plutôt qu'au lieu de leur chute.
