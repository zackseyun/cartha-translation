translation:
  language: fr
  text: … d’elle, et il s’empara de leurs dépouilles[a]. Il incendia le temple de Dagon et le temple de celle-ci[b]. Et ceux qui étaient tombés sous les coups de l’épée…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec conservé ici est incomplet au début comme à la fin. La traduction ne rend que les mots fournis; la dernière proposition reste donc inachevée.
    reason: textual_variant
  - marker: b
    text: Le grec dit littéralement « le temple de celle-ci », avec un pronom féminin dont l’antécédent n’apparaît pas clairement dans l’extrait; il pourrait s’agir d’une ville mentionnée auparavant.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῆς
  choice: d’elle
  rationale: Le pronom grec est féminin et dépend d’un élément absent au début de l’extrait. La traduction en conserve donc le genre et le caractère fragmentaire.
- source_word: ἔλαβεν τὰ σκῦλα αὐτῶν
  choice: il s’empara de leurs dépouilles
  rationale: σκῦλα désigne les dépouilles ou le butin pris à l’ennemi; «s’empara de» exprime naturellement la prise dans ce contexte militaire.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: le temple de Dagon
  rationale: ἱερόν désigne ici un édifice ou sanctuaire cultuel païen; «temple» est clair et courant en français.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: le temple de celle-ci
  rationale: «celle-ci» maintient le féminin de αὐτῆς sans imposer un antécédent qui ne figure pas explicitement dans l’extrait fourni.
- source_word: ἐνεπύρισεν ἐν πυρί
  choice: il incendia
  rationale: Cette formulation française naturelle rend l’action de livrer au feu; la redondance emphatique du grec ne peut être reproduite littéralement sans lourdeur.
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: ceux qui étaient tombés sous les coups de l’épée
  rationale: Le participe parfait présente les victimes dans l’état résultant de leur chute; l’expression française conserve le sens militaire de μαχαίρᾳ.
