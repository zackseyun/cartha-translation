  yaml_path: translation/deuterocanon/1_maccabees/009/048.yaml
  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: fr
  text: Jonathan et ceux qui étaient avec lui sautèrent dans le Jourdain et gagnèrent l’autre rive à la nage. Leurs adversaires ne traversèrent pas le Jourdain contre eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est condensée; elle peut aussi se traduire par « à leur poursuite » ou « pour les attaquer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: sautèrent dans
  rationale: Le verbe exprime un mouvement brusque, un saut dans le fleuve; le pluriel français s’impose puisque Jonathan agit avec ceux qui l’accompagnent.
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Cette formulation naturelle reste générale et n’ajoute pas une précision telle que « hommes » ou « compagnons », absente du grec.
- source_word: διεκολύμβησαν
  choice: gagnèrent … à la nage
  rationale: Le verbe composé indique explicitement une traversée effectuée en nageant; cette tournure est idiomatique en français.
- source_word: εἰς τὸ πέραν
  choice: l’autre rive
  rationale: Dans le contexte d’un fleuve, l’expression désigne naturellement la rive opposée.
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: ne traversèrent pas le Jourdain à leur poursuite
  rationale: La proposition grecque est condensée. Le contexte indique que le sujet sous-entendu est le groupe adverse; « à leur poursuite » rend naturellement le mouvement hostile exprimé par ἐπί avec l’accusatif sans affirmer qu’une attaque a effectivement commencé.
- source_word: Ἰορδάνην
  choice: le Jourdain
  rationale: C’est la forme française usuelle du nom du fleuve; il n’est pas nécessaire d’ajouter « fleuve ».
