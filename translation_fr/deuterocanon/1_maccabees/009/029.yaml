base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/029.yaml
  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: fr
  text: Depuis que ton frère Judas est mort, il n’y a pas d’homme comme lui pour partir affronter les ennemis, Bacchidès et ceux qui haïssent notre nation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte ici une tournure difficile, littéralement « et parmi ceux qui haïssent notre nation ». Le texte traduit le sens qui paraît le plus probable dans ce contexte : ces personnes font partie des adversaires à affronter.'
    reason: La préposition ἐν (« dans, parmi ») s’accorde mal avec la construction précédente; la note signale la formulation transmise et l’interprétation retenue sans masquer l’incertitude.
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: Depuis que
  rationale: Cette locution conserve à la fois la valeur temporelle et la situation présente résultant de la mort de Judas.
- source_word: ὁ ἀδελφός σου Ἰούδας
  choice: ton frère Judas
  rationale: Traduction directe et naturelle du groupe nominal grec, avec le nom traditionnel de ce personnage en français.
- source_word: τετελεύτηκεν
  choice: est mort
  rationale: Le parfait désigne une mort accomplie dont les conséquences demeurent. La formulation est claire et sans euphémisme.
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: d’homme comme lui
  rationale: Le mot ἀνήρ désigne explicitement un homme, tandis que « comme lui » préserve la comparaison sans préciser indûment en quoi consiste cette ressemblance.
- source_word: ἐξελθεῖν πρὸς τοὺς ἐχθρούς
  choice: partir affronter les ennemis
  rationale: Dans ce contexte militaire, ἐξελθεῖν évoque une sortie contre l’adversaire. Cette formulation restitue naturellement en français le mouvement et l’hostilité exprimés par πρὸς.
- source_word: Βακχίδην
  choice: Bacchidès
  rationale: Forme française traditionnelle du nom grec Βακχίδης.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: notre nation
  rationale: Ici, ἔθνος désigne le peuple juif comme collectivité nationale; « nation » en conserve la portée politique et collective.
- source_word: καὶ ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  choice: et ceux qui haïssent notre nation
  rationale: Le ἐν transmis est syntaxiquement difficile. Le texte principal exprime le sens contextuel probable en coordonnant ce groupe avec les autres adversaires, tandis que la note conserve l’ambiguïté du grec.
theological_decisions:
- issue: Traduction de ἀνήρ dans le portrait du chef militaire recherché
  choice: homme
  alternative: quelqu’un
  rationale: Le grec emploie le nom masculin précis ἀνήρ. Le rendre par « homme » respecte cette donnée sans tirer de conclusion doctrinale supplémentaire.
- issue: Portée de ἔθνος ἡμῶν
  choice: notre nation
  alternative: notre peuple
  rationale: Dans 1 Maccabées, le terme peut présenter Israël comme une collectivité à la fois politique, ethnique et religieuse. « Nation » préserve cette tension mieux que le terme plus général « peuple ».
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond au singulier grec σου. « Partir affronter » rend lisible la scène militaire sans employer un vocabulaire archaïque. La phrase demeure ouverte par une virgule dans le contexte source, mais le verset français est présenté comme une proposition complète.
