base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/007.yaml
  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: fr
  text: Judas vit que ses troupes cédaient[a], car le combat l’accablait. Il eut le cœur brisé, car il n’avait pas le temps de les rassembler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Après « Judas vit », le grec est concis et quelque peu elliptique. La traduction comprend que Judas voyait ses propres forces céder sous la pression du combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: troupes
  rationale: Dans ce contexte militaire, le terme peut désigner le camp ou, par métonymie, les forces qui le composent. « Troupes » rend clairement le sens contextuel en français moderne.
- source_word: ὅτι ἡ παρεμβολὴ αὐτοῦ
  choice: que ses troupes cédaient
  rationale: 'La formulation grecque transmise est abrupte et elliptique : aucun verbe n’accompagne explicitement « son camp ». La suite indique que Judas constate que ses forces faiblissent sous la pression du combat ; « cédaient » exprime cette implication sans préciser davantage la nature de leur recul.'
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: le combat l’accablait
  rationale: Dans la scène immédiate, πόλεμος désigne le combat plutôt que la guerre dans son ensemble. ἔθλιβεν exprime une pression pénible et continue ; « l’accablait » en donne une formulation naturelle et forte.
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: il eut le cœur brisé
  rationale: Cette formulation conserve l’image vive du cœur brisé tout en restant idiomatique et digne en français actuel.
- source_word: καιρὸν
  choice: le temps
  rationale: καιρός peut désigner le moment favorable ou l’occasion. Ici, l’urgence militaire rend « le temps » naturel, tout en laissant entendre l’absence d’occasion disponible.
- source_word: συναγαγεῖν αὐτούς
  choice: de les rassembler
  rationale: Le verbe signifie réunir ou assembler. « Rassembler » reste proche du grec sans introduire l’idée plus précise de « rallier » des soldats en déroute.
