  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: fr
  text: Jonathan, Simon et ceux qui étaient avec lui se retirèrent à Bethbasi, dans le désert. Jonathan reconstruisit ce qui avait été démoli et la fortifia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: se retirèrent
  rationale: Le verbe indique ici un retrait ou un départ à l'écart dans un contexte de conflit, sans nécessairement impliquer une fuite désordonnée.
- source_word: οἱ μετʼ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Le singulier grec αὐτοῦ est conservé afin de ne pas effacer l'ambiguïté grammaticale, même si Jonathan et Simon viennent d'être nommés ensemble.
- source_word: Βεθβασί
  choice: Beth-Basi
  rationale: Le nom de lieu est translittéré sous une forme lisible en français.
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Cette expression situe Beth-Basi; « désert » est le terme français naturel pour ἐρήμος dans ce contexte.
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: Ils en relevèrent les parties démolies
  rationale: « Relever » exprime la reconstruction, tandis que « les parties démolies » maintient le sens concret du participe substantivé sans le réduire simplement aux ruines.
- source_word: ἐστερέωσεν
  choice: la fortifièrent
  rationale: Dans ce récit militaire, le renforcement de la localité concerne vraisemblablement ses défenses; « fortifier » rend naturellement ce sens contextuel.
