lexical_decisions:
- source_word: ὑστήκει
  choice: Elle resta en position
  rationale: La forme exprime le maintien dans une position. Le sujet n’étant pas explicite dans l’extrait fourni, le pronom féminin renvoie naturellement à une réalité collective sous-entendue, tout en évitant de désigner une personne précise.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: comme Jonathan l’avait ordonné
  rationale: καθώς marque la conformité et ἐπιτάσσω un ordre; le plus-que-parfait français situe naturellement cet ordre avant le maintien en position.
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: leurs chevaux se fatiguèrent
  rationale: κοπιάω indique ici que les chevaux devinrent las sous l’effet de l’effort, sans nécessairement signifier un épuisement total.
- source_word: ἐξέλυσεν Σίμων τὴν δύναμιν αὐτοῦ
  choice: Simon déploya ses forces
  rationale: Dans ce contexte militaire, ἐξέλυσεν décrit la mise en action ou le déploiement, tandis que δύναμις désigne les troupes; le pluriel «ses forces» est idiomatique en français.
- source_word: συνῆψεν πρὸς
  choice: engagea le combat contre
  rationale: La tournure désigne l’engagement militaire avec un adversaire. «Engager le combat contre» restitue clairement ce sens narratif.
- source_word: τὴν
  choice: la
  rationale: L’extrait grec fourni s’achève sur l’article accusatif féminin singulier et demeure donc syntaxiquement incomplet; la traduction conserve cette interruption.
