base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/050.yaml
  text: 'And they returned to Jerusalem and built fortified cities in Judea: the stronghold in Jericho[a], and Emmaus, and Beth-horon, and Bethel, and Thamnatha-pharathon, and Tephon[b], with high walls and gates and bars.'
translation:
  language: fr
  text: 'Ils retournèrent à Jérusalem et bâtirent des villes fortifiées en Judée : la forteresse de Jéricho, Emmaüs, Beth-Horon, Béthel, Thémanatha-Pharathon[a] et Téphon[b], avec de hautes murailles, des portes et des verrous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thémanatha-Pharathon peut aussi être transcrit « Timnath-Pharathon », forme plus familière dans certaines traditions.
    reason: lexical_alternative
  - marker: b
    text: Téphon transcrit la forme grecque ; certaines traditions présentent une graphie différente, comme « Taphon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: ils retournèrent
  rationale: L’aoriste exprime le retour à un lieu antérieur. « Retournèrent » est naturel en français et conserve clairement ce mouvement.
- source_word: ᾠκοδόμησαν
  choice: bâtirent
  rationale: Le verbe signifie « bâtir » ou « édifier ». Le grec n’indiquant pas explicitement une reconstruction, « bâtirent » évite d’ajouter cette idée.
- source_word: πόλεις ὀχυράς
  choice: des villes fortifiées
  rationale: Cette expression désigne des villes rendues fortes pour la défense ; « villes fortifiées » est la formulation française la plus naturelle.
- source_word: τὸ ὀχύρωμα
  choice: la forteresse
  rationale: Le nom désigne ici un ouvrage ou un emplacement fortifié. « Forteresse » convient au contexte militaire et reste suffisamment général.
- source_word: Ἰερειχὼ
  choice: Jéricho
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: Ἐμμαοὺμ
  choice: Emmaüs
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: Βεθωρὼν
  choice: Beth-Horon
  rationale: Transcription française courante de ce toponyme sémitique composé.
- source_word: Βαιθὴλ
  choice: Béthel
  rationale: Forme française traditionnelle et largement reconnue.
- source_word: Θεμανάθα Φαραθὼν
  choice: Thamnatha-Pharathon
  rationale: Cette transcription suit de près la forme grecque fournie tout en réunissant les deux éléments comme un seul toponyme ; une note signale une autre forme transmise.
- source_word: Τεφών
  choice: Téphon
  rationale: Transcription directe de la forme grecque, adaptée à l’orthographe française ; une note conserve une variante attestée dans d’autres traditions.
- source_word: ἐν τείχεσιν ὑψηλοῖς
  choice: avec de hautes murailles
  rationale: La préposition décrit ici les moyens ou les éléments de fortification. « Avec de hautes murailles » est naturel et fidèle au sens.
- source_word: πύλαις καὶ μοχλοῖς
  choice: des portes et des verrous
  rationale: « Portes » rend le sens ordinaire de πύλαις, et « verrous » exprime les barres servant à les fermer et à les renforcer.
