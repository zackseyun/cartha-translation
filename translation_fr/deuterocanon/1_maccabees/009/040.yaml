  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: fr
  text: Alors, ils surgirent de l’embuscade, les attaquèrent et les tuèrent ; beaucoup tombèrent, blessés[a], tandis que les autres s’enfuirent vers la montagne. Ils prirent tout leur équipement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut désigner des blessés ou, plus largement, des victimes de combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous leurs bagages » ou « toutes leurs affaires ». Le terme grec désigne largement des objets ou du matériel ; ici, le contexte militaire favorise l’idée d’équipement personnel ou de campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτοὺς ἀπὸ τοῦ ἐνέδρου
  choice: sortant de l’embuscade, ils se dressèrent contre eux
  rationale: Cette formulation conserve l’image du surgissement hostile exprimée par ἐξανέστησαν, tout en rendant explicitement et naturellement en français la provenance indiquée par ἀπὸ τοῦ ἐνέδρου.
- source_word: ἀπέκτειναν αὐτούς
  choice: les tuèrent
  rationale: Rendu direct et moderne du verbe courant signifiant tuer.
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: beaucoup tombèrent blessés
  rationale: La traduction préserve à la fois l’idée de chute et celle de blessure, sans affirmer que tous moururent; τραυματίαι peut toutefois désigner plus largement des victimes de combat.
- source_word: οἱ ἐπίλοιποι
  choice: les autres
  rationale: Désigne naturellement ceux qui restaient après les morts et les blessés.
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: s’enfuirent vers la montagne
  rationale: Le singulier et le mouvement exprimés par le grec sont conservés, sans interpréter τὸ ὄρος comme une région montagneuse.
- source_word: πάντα τὰ σκεύη αὐτῶν
  choice: tout leur équipement
  rationale: Dans ce contexte militaire, σκεύη désigne vraisemblablement le matériel ou les effets emportés plutôt que des récipients.
