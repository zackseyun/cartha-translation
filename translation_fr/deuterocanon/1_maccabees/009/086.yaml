  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: fr
  text: Jonathan partit de là et établit son camp à Ascalon. Les gens de la ville sortirent à sa rencontre en grande pompe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’édition grecque de Swete, la ligne source est interrompue après καὶ ἐπέ-. La proposition qui se termine par « en grande pompe » est toutefois complète et permet une traduction sûre de ce segment du verset.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: De là
  rationale: Cette formule rend naturellement la transition spatiale et narrative.
- source_word: παρενέβαλεν εἰς Ἀσκάλωνα
  choice: établit son camp à Ascalon
  rationale: Le verbe désigne l’installation d’un camp, avec une nuance militaire. La préposition εἰς marque ici le lieu atteint.
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: Les gens de la ville sortirent
  rationale: Cette formulation claire conserve l’indétermination du grec sans préciser qu’il s’agissait de tous les habitants.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: à sa rencontre
  rationale: Expression française idiomatique correspondant au mouvement d’accueil exprimé en grec.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: l’accueillirent avec de grands honneurs
  rationale: Dans ce contexte de réception publique, δόξα évoque les marques d’honneur et l’éclat de l’accueil plutôt qu’une gloire abstraite. Le verbe « accueillirent » explicite en français le rapport circonstanciel sans modifier la scène.
