  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: fr
  text: Ils prirent la route de Galgala et dressèrent leur camp contre Messaloth, dans la région d’Arbèles. Ils s’en emparèrent[a], et il fit périr de nombreuses personnes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est rare et difficile. Il peut aussi signifier « s’en saisirent les premiers », « l’occupèrent d’avance » ou, plus généralement, « la prirent ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le grec dit : « il détruisit de nombreuses vies d’hommes », c’est-à-dire qu’un grand nombre de personnes furent tuées. Le verbe est au singulier après des verbes au pluriel; son sujet n’est pas précisé avec certitude.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐπορεύθησαν ὁδὸν τὴν εἰς Γάλγαλα
  choice: Ils prirent la route de Galgala
  rationale: La tournure accusative avec ὁδόν indique l’itinéraire suivi. « Prirent la route de » est idiomatique en français et conserve l’image concrète de la route.
- source_word: παρενέβαλον ἐπὶ
  choice: dressèrent leur camp contre
  rationale: Dans ce contexte militaire, παρεμβάλλω signifie établir un camp; ἐπί devant le lieu suggère ici une position hostile, vraisemblablement en vue d’une attaque.
- source_word: Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: Messaloth, dans la région d’Arbèles
  rationale: Le complément grec distingue cette Messaloth par son rattachement à Arbèles. « Dans la région de » évite de présenter avec une certitude excessive Messaloth comme un quartier intérieur de la ville.
- source_word: προκατελίβοντο
  choice: s’en emparèrent
  rationale: Le verbe composé, rare et difficile, exprime une prise ou une occupation, avec une nuance possible d’anticipation portée par προ-. Le français courant « s’en emparèrent » rend l’action principale sans imposer une interprétation incertaine; la nuance est signalée en note.
- source_word: ἀπώλεσεν ψυχὰς ἀνθρώπων πολλὰς
  choice: firent périr un grand nombre de personnes
  rationale: ψυχαί désigne ici des vies, donc des personnes, et ἀπόλλυμι exprime leur mise à mort. Cette formulation restitue naturellement l’idiome grec. Le pluriel français suit les acteurs des propositions précédentes, tandis que l’étrange passage du grec au singulier est conservé en note.
