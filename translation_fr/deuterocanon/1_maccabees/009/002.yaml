translation_notes:
  register: 'Français moderne, international et soutenu sans archaïsme. La syntaxe a été répartie en deux phrases pour rester claire à la lecture, tout en conservant la succession rapide des actions militaires. Les toponymes suivent une translittération française usuelle : Galgala, Messaloth et Arbèles.'
