    rationale: Le grec ψυχὰς ἀνθρώπων πολλὰς signifie littéralement « de nombreuses vies d’hommes », idiome pour de nombreuses personnes tuées. Le sujet singulier peut être Bacchidès, mais le texte seul ne l’établit pas; la note doit maintenir cette incertitude.
