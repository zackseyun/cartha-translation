  naturalness: Le français est naturel et de registre approprié. « Un grand nombre de personnes » est correct, mais « de nombreuses personnes » est plus direct et idiomatique dans ce récit. Le singulier « fit périr » reste également naturel, même si son sujet n’est pas explicitement identifié.
  terminology: Les noms Galgala, Messaloth et Arbèles conviennent. « Dresser leur camp contre » rend adéquatement le contexte hostile de παρενέβαλον ἐπί. « S’en emparèrent » est une solution prudente pour le verbe rare προκατελίβοντο, dont la nuance préemptive est justement signalée en note.
