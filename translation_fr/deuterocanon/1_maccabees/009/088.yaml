  text: And it happened that when Alexander the king heard these words[a], he continued to honor Jonathan, and he sent him a clasp.
translation:
  language: fr
  text: Il arriva que, lorsque le roi Alexandre entendit ces paroles, il continua d’honorer Jonathan et lui envoya une agrafe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une broche » ou « une boucle » ; le terme grec désigne un ornement servant d’attache.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Il arriva que, lorsque
  rationale: Cette tournure conserve la formule grecque de transition narrative ainsi que la valeur temporelle de ὡς, tout en restant intelligible en français actuel.
- source_word: ἤκουσεν
  choice: entendit
  rationale: Le verbe exprime ici le fait de recevoir oralement des paroles ou un message; « entendit » demeure proche du grec sans explicitation inutile.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: λόγοι peut désigner des paroles, un message ou des propos. « Ces paroles » préserve le sens littéral et l’ambiguïté naturelle du grec.
- source_word: προσέθετο δοξάσαι
  choice: continua d’honorer
  rationale: Avec un infinitif, προσέθετο exprime la poursuite ou l’ajout d’une action. Dans ce contexte royal et politique, δοξάσαι signifie accorder de l’honneur plutôt que « glorifier » au sens religieux.
- source_word: πόρπην
  choice: une agrafe
  rationale: πόρπη désigne un objet ornemental servant à attacher un vêtement, sans permettre d’en préciser sûrement la forme. « Agrafe » est général et naturel.
