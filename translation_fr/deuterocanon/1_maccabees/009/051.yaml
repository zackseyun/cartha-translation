  text: And they stationed a garrison in them to be hostile toward Israel[a].
translation:
  language: fr
  text: Ils y établirent une garnison afin d’agir en ennemis contre Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de se montrer hostiles envers Israël ». L’infinitif grec exprime le but dans lequel la garnison fut établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: ils établirent
  rationale: Dans ce contexte militaire, ἔθεντο désigne l’installation d’une force dans des lieux fortifiés. « Établirent » est naturel en français avec « une garnison ».
- source_word: φρουράν
  choice: une garnison
  rationale: Le nom désigne ici une force militaire affectée à la garde de places fortifiées; « garnison » est plus précis que « garde ».
- source_word: ἐν αὐτοῖς
  choice: y
  rationale: Le pronom renvoie aux lieux mentionnés dans le contexte précédent. Le pronom adverbial « y » restitue ce renvoi avec naturel sans préciser davantage son antécédent.
- source_word: τοῦ ἐχθραίνειν
  choice: afin d’agir en ennemis
  rationale: L’infinitif substantivé au génitif exprime le but de l’établissement de la garnison. « Agir en ennemis » conserve la valeur active de ἐχθραίνειν sans la réduire au simple état d’« être hostile » ni l’amplifier en guerre ouverte.
- source_word: τῷ Ἰσραήλ
  choice: contre Israël
  rationale: Le datif marque la cible de l’hostilité. En français, « contre Israël » est la tournure idiomatique après « agir en ennemis ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. « Ils y établirent une garnison » conserve le cadre militaire et le renvoi contextuel, tandis que « afin de » rend explicitement la relation de but exprimée en grec.
