  yaml_path: translation/deuterocanon/1_maccabees/009/034.yaml
  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: fr
  text: Bacchidès l’apprit le jour du sabbat[a]. Il se rendit lui-même, avec toute son armée, de l’autre côté du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « le jour des sabbats », tournure idiomatique qui signifie « le jour du sabbat ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au-delà du Jourdain ». L’expression grecque peut désigner la région située au-delà du fleuve ou le mouvement vers l’autre rive.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprit
  rationale: L’aoriste de γινώσκω exprime ici l’acquisition d’une information. Le pronom « l’ » restitue naturellement en français l’objet sous-entendu par le grec et renvoyant au contexte.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: le jour du sabbat
  rationale: Le pluriel grec σαββάτων appartient à une tournure idiomatique désignant le sabbat au singulier. Cette formulation française est claire et garde la précision temporelle.
- source_word: αὐτός
  choice: lui-même
  rationale: Le pronom grec est emphatique et souligne que Bacchidès prit personnellement part au déplacement.
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: toute son armée
  rationale: στράτευμα désigne ici l’ensemble des forces militaires placées sous son commandement.
- source_word: πέραν τοῦ Ἰορδάνη
  choice: de l’autre côté du Jourdain
  rationale: Avec le verbe de mouvement ἦλθεν, πέραν indique naturellement le déplacement vers la rive opposée, tout en pouvant aussi évoquer la région située au-delà du fleuve.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La division en deux phrases allège la coordination grecque sans modifier la succession des actions. « Se rendit » exprime le mouvement sans préciser, au-delà du texte, si Bacchidès traversa effectivement le fleuve depuis le point de vue du narrateur.
