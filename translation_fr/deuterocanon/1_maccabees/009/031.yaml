  text: And Jonathan took up the leadership at that time, and arose in place of Judas his brother.
translation:
  language: fr
  text: À cette époque, Jonathan assuma la direction et se leva pour prendre la place de son frère Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: assuma
  rationale: Le moyen de ἐπιδέχομαι exprime ici le fait d’accepter ou de prendre en charge une fonction; « assuma » est naturel en français dans un contexte de succession.
- source_word: ἡγεσίαν
  choice: la direction
  rationale: ἡγεσία désigne la conduite, la direction ou le commandement. « La direction » convient à la succession de Judas sans suggérer une royauté.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: À cette époque
  rationale: Rendu idiomatique et fidèle de l’indication temporelle grecque.
- source_word: ἀνέστη
  choice: prit la place
  rationale: Dans ce contexte de succession, ἀνέστη, complété par ἀντί, décrit Jonathan qui se lève pour succéder à Judas. La formulation française naturelle concentre cette idée dans « prit la place ».
- source_word: ἀντί
  choice: la place de
  rationale: ἀντί marque ici le remplacement ou la succession, sans nécessairement exprimer une opposition.
- source_word: Ἰούδου
  choice: Judas
  rationale: « Judas » est la forme française traditionnelle du nom grec Ἰούδας dans le récit des Maccabées.
