base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: fr
  text: À ce moment-là, Alcime fut frappé[a], et ses activités furent entravées. Sa bouche fut bloquée, il fut paralysé et ne put plus dire un mot ni donner des instructions au sujet de sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut terrassé » ou « fut atteint ». Le grec décrit une atteinte soudaine et grave sans en préciser la cause.
    reason: lexical_alternative
  - marker: b
    text: Ou « de sa maisonnée » ou « de ses affaires ». Le grec « maison » (οἶκος) peut désigner l’ensemble domestique et pas seulement le bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: fut frappé
  rationale: Le passif exprime une atteinte soudaine et grave, sans préciser s’il s’agit d’un jugement divin ni d’un diagnostic médical.
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: ses entreprises furent entravées
  rationale: ἔργα désigne ici vraisemblablement ses activités ou projets en cours; « entreprises » et « entravées » rendent le sens sans affirmer qu’ils cessèrent définitivement.
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: sa bouche se ferma
  rationale: Cette formulation française naturelle conserve l’image concrète d’une bouche rendue incapable de parler.
- source_word: παρελύθη
  choice: il fut paralysé
  rationale: Le verbe désigne couramment la paralysie ou une incapacité physique grave; le contexte soutient le sens fort.
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: ne put plus prononcer une seule parole
  rationale: La tournure restitue l’incapacité totale de parler et la valeur temporelle de ἔτι.
- source_word: ἐντείλασθαι
  choice: donner d’instructions
  rationale: Le verbe signifie commander ou prescrire; « donner d’instructions » convient au contexte de la gestion domestique tout en restant moins autoritaire que « donner des ordres ».
- source_word: περὶ τοῦ οἴκου αὐτοῦ
  choice: au sujet de sa maison
  rationale: « Maison » conserve la polysémie de οἶκος, qui peut désigner le bâtiment, la maisonnée ou les affaires domestiques.
theological_decisions:
- issue: Nature de l’atteinte subie par Alcime
  choice: Décrire une atteinte grave sans en nommer l’agent ni préciser sa nature médicale
  alternative: Présenter explicitement l’événement comme un jugement divin, une attaque cérébrale ou une crise
  rationale: Le grec emploie des passifs et décrit les effets, mais ce verset ne nomme pas Dieu comme agent et ne fournit aucun diagnostic précis.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque est légèrement restructurée en deux phrases pour la lisibilité, sans perdre la succession des effets. Les ambiguïtés concernant la cause de l’atteinte et le sens de « maison » sont préservées.
