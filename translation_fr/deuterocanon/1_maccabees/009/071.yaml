  yaml_path: translation/deuterocanon/1_maccabees/009/071.yaml
  text: And he accepted[a], and did according to his words, and swore to him not to seek harm against him all the days of his life.
translation:
  language: fr
  text: Il accepta, agit conformément à ses paroles et lui jura de ne pas chercher à lui faire du mal[a] tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ne pas chercher le mal contre lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδέξατο
  choice: Il accepta
  rationale: Le moyen grec exprime ici l’acceptation de la proposition ou des conditions précédemment formulées. « Il accepta » est naturel et moins interprétatif que « il donna son accord ».
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: agit conformément à ses paroles
  rationale: Cette formulation rend l’idée d’une action conforme aux paroles ou aux conditions énoncées, tout en restant claire en français moderne.
- source_word: ὤμοσεν αὐτῷ
  choice: lui jura
  rationale: Le verbe désigne un serment solennel. « Lui jura » conserve cette force sans ajouter un complément absent du grec.
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: ne pas chercher à lui faire du mal
  rationale: La tournure française exprime naturellement la volonté de nuire portée par ἐκζητέω et κακόν. Une note conserve la formulation grecque plus littérale.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: pendant tous les jours de sa vie
  rationale: Cette expression garde la durée emphatique et la cadence biblique du grec, sans remplacer celle-ci par le simple adverbe « jamais ».
theological_decisions:
- issue: Référent des pronoms masculins dans « lui » et « sa vie »
  choice: Conserver les pronoms sans expliciter les personnages
  alternative: Répéter les noms des personnages ou traduire « aussi longtemps qu’il vivrait »
  rationale: Le grec emploie αὐτῷ et αὐτοῦ sans répéter les noms. La formulation française maintient cette référence contextuelle et n’impose pas une clarification absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec, tandis que « chercher à lui faire du mal » évite une tournure artificielle. Le parallélisme des trois verbes est préservé.
