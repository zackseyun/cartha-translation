  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: fr
  text: Jonathan, Simon son frère, et tous ceux qui étaient avec lui l’apprirent[a]. Ils s’enfuirent dans le désert de Tékoa et établirent leur camp près de l’eau de la citerne d’Asfar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le surent » ou « en prirent connaissance » ; le grec ne précise pas l’objet, qui est sous-entendu d’après le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi désigner une « fosse » ou un « puits » ; l’expression « l’eau de la citerne » indique ici un point d’eau ou un réservoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: l’apprirent
  rationale: L’aoriste de γινώσκω indique ici qu’ils prennent connaissance d’un fait ou d’une menace évoqués par le contexte. Le pronom « l’ » rend naturellement en français l’objet sous-entendu en grec.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Le verbe exprime une fuite devant le danger et conserve le caractère urgent du récit.
- source_word: ἔρημον Θεκώε
  choice: le désert de Tékoa
  rationale: Dans ce contexte géographique, ἔρημος désigne une région déserte ou peu habitée. « Désert » est naturel en français et convient au cadre judéen.
- source_word: παρενέβαλον
  choice: établirent leur camp
  rationale: Cette expression française courante restitue le verbe narratif désignant l’installation d’un camp, sans lourdeur archaïque.
- source_word: ἐπὶ τὸ ὕδωρ
  choice: près de l’eau
  rationale: Avec le verbe camper, ἐπί suivi de l’accusatif situe naturellement le camp à proximité du point d’eau.
- source_word: λάκκου
  choice: citerne
  rationale: λάκκος peut désigner une fosse, un puits ou une citerne. La mention de son eau favorise ici un réservoir ou point d’eau aménagé.
- source_word: Ἀσφάρ
  choice: Asfar
  rationale: Le nom propre est translittéré en français moderne, où le φ grec est rendu par « f ».
