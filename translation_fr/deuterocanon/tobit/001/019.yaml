  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: fr
  text: Mais l’un des habitants de Ninive alla informer le roi à mon sujet[a], en disant que je les enterrais. Alors, je me cachai. Quand je compris qu’on me recherchait pour me mettre à mort[b], je me retirai par peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’un de ceux qui étaient à Ninive ». Le grec dit littéralement : « l’un de ceux à Ninive ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quand je compris qu’ils cherchaient à me tuer ». Le grec, formulé de façon condensée, dit littéralement : « qu’on me recherchait pour mourir », c’est-à-dire, dans le contexte, pour être mis à mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς δὲ
  choice: Mais … alla
  rationale: Le participe aoriste exprime naturellement l’action préalable au verbe principal; « alla informer » restitue la séquence sans lourdeur.
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: l’un des habitants de Ninive
  rationale: L’expression grecque est elliptique, littéralement « l’un de ceux qui étaient à Ninive ». « Habitants » donne en français un sens naturel, tout en signalant en note la formulation plus stricte.
- source_word: ὑπέδειξε τῷ βασιλεῖ περὶ ἐμοῦ
  choice: informer le roi à mon sujet
  rationale: Dans ce contexte, ὑποδείκνυμι désigne la communication d’un renseignement à l’autorité. « À mon sujet » correspond directement à περὶ ἐμοῦ.
- source_word: ὅτι θάπτω αὐτούς
  choice: je les enterrais
  rationale: Le présent θάπτω dans le discours indirect peut évoquer une activité en cours ou habituelle; l’imparfait français convient au cadre narratif.
- source_word: ἐκρύβην
  choice: je me cachai
  rationale: La forme passive est ici employée avec un sens intransitif ou réfléchi; le passé simple maintient le registre narratif.
- source_word: ἐπιγνοὺς
  choice: Quand je compris
  rationale: Le participe indique la prise de conscience qui précède le retrait.
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: on me recherchait pour me mettre à mort
  rationale: Cette formulation conserve le passif de ζητοῦμαι et la finalité mortelle exprimée par l’infinitif, tout en restant idiomatique en français.
- source_word: φοβηθεὶς ἀνεχώρησα
  choice: je me retirai, pris de peur
  rationale: « Se retirer » rend ἀναχωρέω sans accentuer le mouvement jusqu’à « fuir »; « pris de peur » conserve la circonstance exprimée par le participe.
theological_decisions:
- issue: Nature de la réaction de Tobit devant la persécution
  choice: « je me retirai, pris de peur »
  alternative: « je m’enfuis, effrayé »
  rationale: ἀναχωρέω exprime le retrait ou le départ et n’impose pas la nuance plus forte d’une fuite précipitée. La traduction conserve néanmoins explicitement la peur et le danger de mort.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit littéraire biblique sans archaïsme marqué. Les deux phrases brèves après la dénonciation préservent la progression vive du grec; les notes rendent visibles ses formulations elliptiques ou comprimées.
