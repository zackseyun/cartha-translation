base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/011.yaml
  text: But I kept watch over myself so as not to eat[b][a],
translation:
  language: fr
  text: Mais moi, je me suis gardé de manger,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « j’ai gardé mon âme afin de ne pas manger ». Ici, « mon âme » désigne idiomatiquement la personne elle-même. Le texte grec conservé est très bref et la phrase semble se poursuivre au verset suivant.'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Mais moi
  rationale: δέ marque ici un contraste léger avec la conduite évoquée dans le contexte, tandis que le pronom explicite ἐγώ met Tobit en relief.
- source_word: συνετήρησα
  choice: je me suis gardé
  rationale: Le verbe exprime une garde attentive; dans cette construction, le français pronominal «se garder de» rend naturellement l’idée de vigilance et de retenue personnelle.
- source_word: τὴν ψυχήν μου
  choice: me
  rationale: Bien que l’expression signifie littéralement «mon âme», ψυχή fonctionne ici de manière idiomatique pour désigner la personne elle-même, sans affirmation anthropologique technique.
- source_word: μὴ φαγεῖν
  choice: de manger
  rationale: Après «se garder de», l’infinitif français exprime naturellement l’action dont Tobit s’est abstenu; la négation est portée par la locution elle-même.
theological_decisions:
- issue: Portée anthropologique de ψυχή dans τὴν ψυχήν μου
  choice: Valeur idiomatique et réfléchie («me»), sans faire de l’âme une entité distincte dans la traduction principale
  alternative: «j’ai gardé mon âme afin de ne pas manger»
  rationale: Le contexte décrit la vigilance de Tobit concernant la nourriture, et non une doctrine élaborée de la relation entre l’âme et le corps. La note conserve toutefois la forme grecque littérale.
translation_notes:
  register: Français moderne, international et digne. «Je me suis gardé de manger» privilégie une formulation naturelle tout en conservant l’idée de vigilance délibérée portée par le grec.
