    text: 'אז אמר המלך אני אשחט את שני בני בעבור יי אולי אתרצה בם להם ויעזרני ויגע הדבר לאדרמלך ושראצר בניו ויארבו לו ויהרגוהו (בחרב בשעה שנכנס להתפלל לפני דגון טעותו) שנאמר "ואדרמלך ושראצר בניו הכוהו בחרב והמה נמלטו ארץ אררט ויהי כי מת סנחריב מלך אשור וימלוך אסרחדון בנו תחתיו" (ע"פ ישעיה לז, לח) ויפקד אסרחדון את אקיקר בן חננאל אחי על כל אשר לו ומושל בכל ארץ אשור וידבר אקיקר עלי אל המלך דברים טובים עד אשר השיבני לנינוה כי היה אקיקר אהובי וקרובי וישיבו לי את חנה אשתי ואת טוביה בני כי צוה המלך אשור לתפשם בזעפו אשר זעף עליי:'
