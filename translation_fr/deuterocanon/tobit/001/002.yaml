base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: fr
  text: qui fut emmené en captivité, au temps d’Énémessaros, roi des Assyriens, originaire de Thisbé, située à droite de Kydios de Nephtali, en Galilée, au-dessus d’Aser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les indications géographiques de ce verset sont difficiles. Le grec porte littéralement « à droite de Kydios » et « au-dessus d’Aser » ; Kydios est un lieu incertain, parfois identifié à Qédesh. Énémessaros est aussi parfois identifié au roi assyrien Salmanasar, mais le texte grec emploie ici la forme Énémessaros.
    reason: textual_and_geographic_note
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: fut emmené en captivité
  rationale: Le passif exprime une déportation forcée comme captif. Cette formulation française conserve à la fois le mouvement imposé et l’état de captivité.
- source_word: ἐν ἡμέραις
  choice: au temps de
  rationale: Expression temporelle naturelle en français moderne, sans préciser davantage que le grec s’il s’agit strictement du règne.
- source_word: Ἐνεμεσσαάρου
  choice: Énémessaros
  rationale: Translittération française de la forme grecque attestée, sans l’harmoniser avec Salmanasar.
- source_word: ἐκ Θίσβης
  choice: depuis Thisbé
  rationale: ἐκ indique ici le lieu d’origine de la déportation; « depuis » rattache clairement Thisbé au mouvement exprimé par le verbe.
- source_word: ἐκ δεξιῶν
  choice: à droite de
  rationale: La formulation littérale préserve l’incertitude sur l’orientation géographique au lieu d’imposer « au sud de ».
- source_word: Κυδίως
  choice: Kydios
  rationale: Le toponyme grec est obscur; sa translittération évite une identification conjecturale avec Qédesh.
- source_word: τῆς Νεφθαλεὶμ
  choice: de Nephtali
  rationale: Le génitif rattache Kydios à Nephtali sans obliger à préciser s’il s’agit d’une appartenance territoriale ou d’une autre relation géographique.
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: en Galilée
  rationale: Forme géographique française usuelle.
- source_word: ὑπεράνω Ἀσήρ
  choice: au-dessus d’Aser
  rationale: Rendu spatial proche du grec, qui conserve l’ambiguïté plutôt que de convertir l’expression en un point cardinal.
