base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: fr
  text: Mais moi seul, j’allais souvent à Jérusalem pour les fêtes, comme il est écrit pour tout Israël dans une prescription perpétuelle, en apportant les prémices, les dîmes des récoltes et les prémices de la tonte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec est rare. Il désigne probablement la première part provenant de la tonte des troupeaux; certains le comprennent plus largement comme les premières redevances issues de l’élevage.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: moi seul
  rationale: Rend l’emphase et le contraste implicite entre la fidélité personnelle de Tobit et la conduite des autres membres de son peuple.
- source_word: ἐπορευόμην πλεονάκις
  choice: j’allais souvent
  rationale: L’imparfait accompagné de πλεονάκις exprime une action habituelle et répétée dans le passé.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: Avec un verbe de déplacement, le français exprime naturellement aussi bien la destination que le lieu par « à Jérusalem »; la tournure grecque inhabituelle n’a pas besoin d’être reproduite.
- source_word: ταῖς ἑορταῖς
  choice: pour les fêtes
  rationale: Désigne les fêtes religieuses d’Israël et, dans ce contexte de déplacement, indique l’occasion du voyage.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule biblique naturelle qui conserve la valeur d’autorité du texte écrit.
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: dans une prescription perpétuelle
  rationale: « Prescription » exprime une disposition faisant autorité, tandis que « perpétuelle » convient au registre juridique et cultuel de αἰώνιος sans imposer une interprétation philosophique.
- source_word: ἀπαρχάς
  choice: les prémices
  rationale: Terme cultuel français établi pour la première part de la production consacrée à Dieu.
- source_word: δεκάτας τῶν γενημάτων
  choice: les dîmes des récoltes
  rationale: « Dîmes » rend précisément les parts d’un dixième; « récoltes » exprime ici clairement les produits agricoles désignés par γενήματα.
- source_word: προκουρίας
  choice: les prémices de la tonte
  rationale: Le terme grec rare désigne probablement la première part issue de la tonte des animaux; la formulation reste légèrement générale afin de ne pas préciser indûment qu’il s’agit uniquement de laine.
- source_word: ἔχων
  choice: en apportant
  rationale: Le participe indique que Tobit se rendait à Jérusalem muni de ces offrandes; « en apportant » en restitue naturellement la portée circonstancielle.
theological_decisions:
- issue: Nature de l’obéissance de Tobit
  choice: Le verset présente Tobit comme observant personnellement les obligations d’Israël relatives aux fêtes et aux offrandes liées à Jérusalem.
  alternative: Comprendre le passage comme une simple affirmation générale de piété.
  rationale: L’appel explicite à ce qui est écrit pour tout Israël, suivi d’une liste concrète d’offrandes, décrit une observance précise plutôt qu’une piété indéterminée.
- issue: Portée de αἰώνιος dans la formule juridique
  choice: perpétuelle
  alternative: éternelle; permanente
  rationale: « Perpétuelle » préserve l’idée d’une prescription durable dans le langage juridique et cultuel, sans trancher au-delà du texte la question de sa portée théologique absolue.
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait traduit l’habitude passée; le vocabulaire « fêtes », « prescription », « prémices » et « dîmes » conserve le registre biblique et cultuel sans archaïsme excessif.
