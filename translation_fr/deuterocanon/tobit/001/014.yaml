  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
translation:
  language: fr
  text: J’allais en Médie[a] et je confiai[b] dix talents d’argent à Gabaël, frère de Gabrias, à Ragès[c], en Médie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je me rendais en Médie » ou « J’allai en Médie ». L’imparfait grec peut évoquer des déplacements habituels ou répétés, plutôt qu’un seul voyage.
    reason: lexical_alternative
  - marker: b
    text: Ou « je déposai ». Le verbe grec signifie remettre quelque chose à la garde de quelqu’un, ici dans un contexte financier.
    reason: lexical_alternative
  - marker: c
    text: Le nom de cette ville est aussi transcrit « Rhagès » dans certaines traductions.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορευόμην
  choice: Je me rendais
  rationale: L’imparfait grec peut exprimer une action habituelle ou répétée. L’imparfait français conserve cette valeur sans exclure entièrement une action envisagée dans son déroulement.
- source_word: παρεθέμην
  choice: je confiai
  rationale: Le verbe désigne ici le fait de remettre une somme à la garde de quelqu’un. « Confier » rend cette relation personnelle plus naturellement que le moderne « déposer », qui pourrait évoquer à tort une institution bancaire.
- source_word: ἀργυρίου
  choice: d’argent
  rationale: Le grec nomme explicitement l’argent-métal; cette formulation préserve l’idiome monétaire ancien.
- source_word: τάλαντα δέκα
  choice: dix talents
  rationale: Le talent est une importante unité antique de poids et de valeur. La conserver évite une conversion moderne conjecturale.
- source_word: Γαβηλῷ
  choice: Gabaël
  rationale: Forme française traditionnelle et intelligible du nom grec Γαβηλ.
- source_word: τῷ ἀδελφῷ Γαβρίᾳ
  choice: frère de Gabri
  rationale: La construction grecque identifie explicitement Gabaël comme le frère de Gabri; la formulation française reste concise et fidèle.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: à Rhagès, en Médie
  rationale: « À » convient naturellement à une ville, et « en Médie » situe celle-ci dans la région indiquée par le génitif grec.
