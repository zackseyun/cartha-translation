translation_notes:
  register: Français moderne, sobre et narratif. Les noms propres suivent des formes françaises usuelles. « Je me rendais » garde la nuance aspectuelle de l’imparfait grec, tandis que « confiai » évite une connotation bancaire trop moderne. La ponctuation distingue clairement la ville de la région.
