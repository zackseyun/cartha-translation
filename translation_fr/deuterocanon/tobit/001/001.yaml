base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: fr
  text: Livre des paroles[a] de Tobit, fils de Tobiel, fils d’Ananiel, fils d’Aduel, fils de Gabaël[b], de la descendance d’Asiel, de la tribu de Nephtali,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Livre des paroles ». Cette formule de titre peut aussi se comprendre comme « récit » ou « relation ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom de cet ancêtre présente ici une forme grecque difficile. Certains témoins et certaines traditions secondaires ont des formes plus proches de « Gabiel » ou de « Bagabaël ».
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  choice: Livre des paroles
  rationale: Cette formulation conserve la tournure solennelle du titre grec et son caractère sémitisant. « Paroles » reste proche de λόγων, tout en laissant la note signaler les équivalents français plus idiomatiques.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Forme française biblique usuelle du nom, translittérée plutôt que traduite.
- source_word: τοῦ Τωβιὴλ τοῦ Ἀνανιὴλ τοῦ Ἀδουὴλ τοῦ ΒαΓαβαήλ
  choice: fils de Tobiel, fils d’Ananiel, fils d’Aduel, fils de Gabaël
  rationale: La filiation implicite dans la suite de génitifs grecs est explicitée en français. « Gabaël » normalise une forme grecque difficile sans masquer la variation textuelle, signalée en note.
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  choice: de la descendance d’Asiel
  rationale: σπέρμα signifie littéralement « semence », mais désigne ici la lignée. « Descendance » restitue naturellement ce sens généalogique en français moderne.
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: de la tribu de Nephtali
  rationale: « Tribu » est l’équivalent généalogique direct de φυλή; « Nephtali » est la forme française biblique courante.
