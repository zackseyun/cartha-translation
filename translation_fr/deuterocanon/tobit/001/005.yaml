base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: fr
  text: Toutes les tribus qui avaient apostasié offraient des sacrifices à Baal, la génisse[a], y compris la maison de mon ancêtre Nephtali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Baal, le veau ». Le mot grec désigne une jeune vache, une génisse. L’expression peut renvoyer à une image bovine associée au culte du royaume du Nord, sans en préciser exactement la relation avec Baal.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est condensée en grec : littéralement, « et la maison de Nephtali, mon père ». Dans ce contexte généalogique, « mon père » désigne Nephtali comme ancêtre de Tobit; la phrase inclut sa maison ou sa lignée parmi celles qui participaient à ce culte.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: toutes les tribus
  rationale: Dans ce contexte national et historique, φυλαί désigne les tribus d’Israël plutôt que de simples clans.
- source_word: αἱ συναποστᾶσαι
  choice: qui s’étaient détournées avec les autres
  rationale: Le participe composé exprime une défection collective. « Se détourner » rend naturellement sa portée religieuse en français, tandis que « avec les autres » conserve la nuance de συν-.
- source_word: ἔθυον
  choice: offraient des sacrifices
  rationale: L’imparfait grec indique une pratique passée habituelle ou répétée; l’imparfait français en préserve l’aspect.
- source_word: τῇ Βάαλ
  choice: à Baal
  rationale: Le datif désigne ici la divinité destinataire des sacrifices.
- source_word: τῇ δαμάλει
  choice: la génisse
  rationale: δαμάλις désigne précisément une jeune vache ou génisse. L’apposition directe avec Baal est maintenue sans préciser davantage la relation cultuelle.
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: y compris la maison de Nephtali, mon père
  rationale: La syntaxe grecque est condensée et ajoute la maison ancestrale de Tobit au groupe précédent. « Y compris » rend cette inclusion de façon naturelle, tout en conservant l’association littérale de « mon père » avec Nephtali.
theological_decisions:
- issue: Portée religieuse de συναποστᾶσαι
  choice: qui s’étaient détournées avec les autres
  alternative: qui avaient apostasié ensemble
  rationale: Le sacrifice à Baal montre qu’il s’agit d’une défection religieuse. « Se détourner » communique cette idée dans une langue courante sans introduire un terme technique, et la nuance collective du composé grec demeure explicite.
- issue: Identification de τῇ δαμάλει
  choice: Baal, la génisse
  alternative: Baal, le veau; l’image bovine associée à Baal
  rationale: Le grec met Βάαλ et δαμάλει en apposition. La traduction conserve cette formulation inhabituelle et son ambiguïté au lieu de déterminer si la génisse est un titre, une représentation cultuelle ou une association.
- issue: Relation de τοῦ πατρός μου avec Νεφθαλείμ
  choice: Nephtali, mon père
  alternative: la maison de mon père, Nephtali
  rationale: La formulation retient l’ordre relationnel le plus direct du grec, tout en signalant en note que la syntaxe finale est condensée et peut désigner la maison ancestrale de Tobit.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue la pratique répétée; les notes préservent les ambiguïtés lexicale et syntaxique sans imposer une interprétation confessionnelle.
