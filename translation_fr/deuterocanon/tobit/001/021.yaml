  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: fr
  text: Avant que cinquante jours se soient écoulés, ses deux fils le tuèrent et s’enfuirent dans les montagnes d’Ararat. Son fils Sakhérdonos[a] devint roi à sa place et nomma Akhiakharos[b], fils d’Anaël, le fils de mon frère, responsable de toute la comptabilité de son royaume et de l’ensemble de son administration.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sakhérdonos est la forme grecque du nom royal assyrien généralement rendu en français par Assarhaddon.
    reason: lexical_alternative
  - marker: b
    text: Akhiakharos est la forme grecque du nom souvent rendu par Ahikar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: Avant même que cinquante jours se soient écoulés
  rationale: Cette tournure française naturelle conserve l’insistance de l’idiome grec sur le très court délai, sans reproduire lourdement sa syntaxe littérale.
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: Rend directement et sobrement l’acte de tuer, sans ajouter la qualification morale plus précise qu’impliquerait « assassinèrent ».
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: s’enfuirent dans les montagnes d’Ararat
  rationale: « S’enfuirent » exprime clairement la fuite consécutive à la mise à mort ; « dans les montagnes » est idiomatique pour le mouvement vers cette région montagneuse.
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: devint roi à sa place
  rationale: Cette formulation exprime naturellement l’accession au trône et la succession indiquées par le grec.
- source_word: ἔταξεν
  choice: nomma
  rationale: Dans ce contexte administratif, le verbe désigne l’affectation officielle d’une personne à une fonction.
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: responsable de toute la comptabilité
  rationale: Le substantif rare renvoie à la tenue ou à la vérification des comptes ; la formulation française explicite naturellement l’autorité exercée sur cette fonction.
- source_word: διοίκησιν
  choice: administration
  rationale: Le mot désigne ici la gestion administrative plus générale, en parallèle avec la comptabilité.
- source_word: Σαχερδονός / Ἀχιάχαρον / Ἀναήλ
  choice: Sakhérdonos / Akhiakharos / Anaël
  rationale: Les noms sont translittérés d’après les formes grecques du témoin source, selon des conventions lisibles en français, plutôt qu’harmonisés avec leurs formes historiques plus courantes.
- source_word: τὸν Ἀναὴλ υἱὸν τοῦ ἀδελφοῦ μου
  choice: fils d’Anaël, lui-même fils de mon frère
  rationale: 'Cette formulation lève une ambiguïté syntaxique possible en français tout en respectant la chaîne généalogique grecque : Akhiakharos est fils d’Anaël, et Anaël est fils du frère de Tobit.'
theological_decisions:
- issue: Forme des noms personnels connus par d’autres traditions bibliques ou historiques
  choice: 'Conserver dans le texte les formes translittérées du grec : Sakhérdonos et Akhiakharos'
  alternative: 'Employer les formes françaises historiques plus familières : Assarhaddon et Ahikar'
  rationale: Le témoin traduit est grec ; conserver ses formes nominales évite d’harmoniser silencieusement le texte avec une autre tradition. Des notes donnent les équivalents usuels.
- issue: Rapport généalogique entre Akhiakharos, Anaël et le frère du narrateur
  choice: Akhiakharos est fils d’Anaël, lequel est fils du frère du narrateur
  alternative: Comprendre Anaël comme étant lui-même le frère du narrateur
  rationale: Les appositions et les cas grecs rattachent « fils de mon frère » à Anaël. La traduction explicite ce rapport pour prévenir une lecture française erronée, sans ajouter de donnée généalogique.
translation_notes:
  register: Français international actuel, digne et narratif. Le passé simple convient au récit écrit sans être archaïque. La répétition initiale de « et » du grec est allégée pour produire une phrase française fluide, tandis que l’enchaînement chronologique et administratif demeure intact. Les marqueurs de notes sont placés sur les noms auxquels les notes se rapportent, corrigeant le décalage matériel observé dans la couche anglaise.
