  text: And in the days of Enemessar I did many acts of mercy for my brothers[b][a];
translation:
  language: fr
  text: Au temps d’Énémessar, je faisais beaucoup d’actes de miséricorde envers mes frères[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup d’aumônes » ou « beaucoup d’œuvres de bienfaisance » ; le terme grec désigne souvent des gestes concrets de miséricorde, en particulier des dons aux personnes dans le besoin.
    reason: lexical_alternative
  - marker: b
    text: Ici, « mes frères » peut désigner au sens large les proches de Tobit ou les autres Israélites, et non seulement ses frères biologiques.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις
  choice: Au temps de
  rationale: Cette tournure rend naturellement l’expression temporelle grecque sans supposer explicitement qu’il s’agit du règne d’Énémessar.
- source_word: Ἐνεμεσσάρου
  choice: Énémessar
  rationale: Le nom propre est translittéré à partir de la forme grecque au génitif et adapté à l’orthographe française.
- source_word: ἐλεημοσύνας πολλὰς
  choice: beaucoup d’actes de miséricorde
  rationale: Le pluriel désigne des manifestations concrètes de compassion, souvent des aumônes, sans nécessairement se limiter à des dons d’argent.
- source_word: ἐποίουν
  choice: je faisais
  rationale: L’imparfait français restitue l’aspect imperfectif du verbe grec et suggère une pratique répétée ou habituelle durant cette période.
- source_word: τοῖς ἀδελφοῖς μου
  choice: envers mes frères
  rationale: « Frères » conserve le terme de parenté grec, qui peut désigner ici plus largement des proches ou des membres du même peuple; « envers » exprime naturellement les bénéficiaires des actes de miséricorde.
theological_decisions:
- issue: Portée de ἀδελφοῖς μου
  choice: mes frères
  alternative: mes proches; les membres de mon peuple
  rationale: Le texte principal conserve la formulation concrète et ambiguë du grec, sans décider s’il s’agit uniquement de frères biologiques ou, plus largement, de compatriotes israélites.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « je faisais » respecte l’aspect du grec. Les deux notes suivent l’ordre des expressions annotées dans le verset.
