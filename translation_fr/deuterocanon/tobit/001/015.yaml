  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: fr
  text: Quand Énémessar mourut[a], son fils Achréil devint roi à sa place. Les routes de son royaume devinrent peu sûres[b], et je ne pus plus me rendre en Médie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms royaux sont ici Énémessar et Achréil dans le témoin grec suivi pour cette traduction. D’autres traditions textuelles du livre de Tobit présentent des graphies différentes et, dans certains cas, d’autres noms.
    reason: textual_variant
  - marker: b
    text: 'Le verbe grec traduit par « devinrent peu sûres » est difficile et présente une forme inhabituelle. Le sens est déduit du contexte du voyage : les routes étaient troublées ou dangereuses, si bien que Tobit ne pouvait plus se rendre en Médie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Équivalent narratif simple et direct du verbe grec, sans euphémisme.
- source_word: ἐβασίλευσεν
  choice: devint roi
  rationale: Dans ce contexte de succession, l’aoriste désigne l’accession au trône plutôt que la durée du règne.
- source_word: ἀντʼ αὐτοῦ
  choice: à sa place
  rationale: Formule française naturelle qui exprime clairement la succession et le remplacement.
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: les routes de son royaume
  rationale: Le contexte du déplacement vers la Médie impose le sens concret de ὁδοί. L’explicitation « de son royaume » rend naturellement le lien pronominal avec le nouveau roi sans suggérer qu’il possédait personnellement les routes.
- source_word: ἠκαταστάτησαν
  choice: devinrent peu sûres
  rationale: La forme grecque est inhabituelle et difficile; le contexte indique un dérèglement ou une insécurité qui empêchait les voyages. Cette formulation exprime l’effet pratique sans prétendre que les routes étaient matériellement impraticables.
- source_word: οὐκέτι ἠδυνάσθην
  choice: je ne pus plus
  rationale: Rend avec concision l’incapacité survenue à partir de ce moment-là.
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: me rendre en Médie
  rationale: Expression idiomatique française qui conserve le sens de déplacement et la destination géographique.
