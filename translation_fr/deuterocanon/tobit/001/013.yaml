  text: And the Most High gave me favor and good standing before Enemessar[b][a], and I was his buyer.
translation:
  language: fr
  text: Le Très-Haut m’accorda faveur et belle apparence[a] aux yeux d’Énémessar, et j’étais son acheteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faveur et prestance ». Le grec μορφή désigne la forme ou l’apparence extérieure; sa nuance exacte dans ce contexte de cour reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « chargé de ses achats ». Le grec dit littéralement « acheteur » et désigne probablement ici une fonction officielle d’approvisionnement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: le Très-Haut
  rationale: Titre divin établi dans l’usage biblique français, qui conserve la valeur titulaire du grec sans la réduire au terme générique « Dieu ».
- source_word: χάριν
  choice: faveur
  rationale: Dans ce contexte de cour, le mot désigne l’accueil favorable ou la bienveillance obtenue auprès du souverain.
- source_word: μορφήν
  choice: belle apparence
  rationale: μορφή désigne d’abord la forme ou l’apparence extérieure. L’adjectif « belle » explicite la valeur positive suggérée par son association avec « faveur », tout en évitant de transformer le mot en statut social.
- source_word: ἐνώπιον
  choice: aux yeux de
  rationale: Cette tournure française naturelle rend l’idée d’être considéré favorablement en présence d’Énémessar.
- source_word: Ἐνεμεσσάρου
  choice: Énémessar
  rationale: Translittération française de la forme propre au témoin grec, sans harmonisation avec le nom historique plus familier Salmanasar.
- source_word: ἀγοραστής
  choice: acheteur
  rationale: Le nom grec signifie littéralement celui qui achète. « Acheteur » conserve ce sens et peut aussi désigner une fonction professionnelle; une note indique la nuance administrative probable.
theological_decisions:
- issue: Titre divin ὁ ὕψιστος
  choice: le Très-Haut
  alternative: Dieu
  rationale: Le titre explicite la souveraineté transcendante de Dieu et doit être conservé comme tel plutôt que remplacé par une désignation générique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’étrangeté relative de « faveur et belle apparence » afin de ne pas résoudre abusivement le sens incertain de μορφή; les notes proposent les nuances contextuelles possibles.
