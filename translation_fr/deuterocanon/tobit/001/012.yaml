  text: parce que je gardais Dieu présent à l’esprit de toute mon âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθότι
  choice: parce que
  rationale: La conjonction introduit la cause de ce qui précède. « Parce que » en conserve clairement la valeur causale en français moderne.
- source_word: ἐμεμνήμην
  choice: je me souvenais
  rationale: Le verbe μιμνῄσκομαι signifie ici garder Dieu présent à l’esprit. L’imparfait français exprime naturellement cette disposition persistante dans le contexte narratif, sans surcharger l’aspect du grec.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est le complément régi par le verbe grec ; « se souvenir de Dieu » est la construction française idiomatique correspondante.
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: de toute mon âme
  rationale: Cette tournure française naturelle rend l’idée d’une disposition intérieure totale tout en conservant le terme anthropologique ψυχή, « âme ».
theological_decisions:
- issue: Portée anthropologique de ψυχή
  choice: âme
  alternative: être tout entier
  rationale: « Âme » préserve le vocabulaire biblique et la dimension intérieure de l’expression, sans lui imposer une définition doctrinale technique. La totalité est portée par « toute ».
translation_notes:
  register: Français moderne, simple et digne. La proposition reste dépendante de la phrase précédente, comme dans le texte grec fourni ; aucune majuscule initiale ni ponctuation finale autre que le point n’altère ce lien syntaxique.
