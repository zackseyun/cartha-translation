  source_fidelity: L’imparfait français rend bien la valeur habituelle des imparfaits grecs. Les termes « fils d’Aaron », « fils de Lévi », « le dixième » et « le second dixième » respectent utilement la formulation du grec. Toutefois, « en les prélevant » introduit explicitement un geste de prélèvement qui n’est pas exprimé par πρὸς τὸ θυσιαστήριον τῶν γενημάτων ; il est préférable de rendre seulement l’origine agricole des dons.
  naturalness: Le texte est globalement clair et de registre approprié. « Prêtres, fils d’Aaron » est plus idiomatique en français que l’apposition avec article (« les fils d’Aaron »). La formulation révisée conserve une prose naturelle sans expliciter indûment le lien condensé entre l’autel et les produits.
  terminology: « Dîme » comme alternative en note est judicieux. « Assuraient le service » convient au contexte cultuel de θεραπεύω. « Vendais » est un rendu sobre et défendable de ἀπεπρατιζόμην ; la note explique avec prudence la conversion en argent suggérée par la suite.
