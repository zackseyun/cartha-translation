base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: fr
  text: Je les donnais aux prêtres, fils d’Aaron, pour l’autel, à partir des produits de la terre. Je donnais le dixième[a] aux fils de Lévi qui assuraient le service à Jérusalem. Quant au second dixième, je le vendais[b], puis j’allais chaque année à Jérusalem et j’y dépensais l’argent ainsi obtenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « la dîme » et, plus loin, « la seconde dîme ». Le grec dit littéralement « le dixième » et « le second dixième ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être compris au sens de convertir le second dixième en argent avant de se rendre à Jérusalem pour y dépenser la somme obtenue.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδουν
  choice: je donnais
  rationale: L’imparfait grec exprime ici une pratique habituelle dans le passé ; l’imparfait français la rend naturellement.
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: aux prêtres, les fils d’Aaron
  rationale: La formulation conserve explicitement l’apposition et la filiation sacerdotale du grec.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: pour l’autel, en les prélevant sur les produits de la terre
  rationale: Cette traduction rend à la fois la destination cultuelle des dons et leur provenance agricole, tout en explicitant avec mesure la relation très condensée en grec.
- source_word: τὴν δεκάτην
  choice: le dixième
  rationale: Le grec dit littéralement « le dixième ». Le terme français conserve cette forme, tandis qu’une note signale le terme usuel « dîme ».
- source_word: τοῖς υἱοῖς Λευεὶ
  choice: aux fils de Lévi
  rationale: La formulation explicite du grec est conservée plutôt que remplacée dans le texte par « aux Lévites ».
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: qui assuraient le service à Jérusalem
  rationale: Dans ce contexte cultuel, θεραπεύω désigne un service exercé ; cette expression reste claire sans préciser au-delà du texte la nature exacte de ce service.
- source_word: τὴν δευτέραν δεκάτην
  choice: le second dixième
  rationale: La traduction garde l’expression littérale et son lien verbal avec « le dixième », sans identifier plus précisément la pratique dans le corps du texte.
- source_word: ἀπεπρατιζόμην
  choice: je le vendais
  rationale: Le verbe désigne une vente ou une cession contre paiement. « Je le vendais » est direct et correspond à la suite, où la somme est dépensée à Jérusalem.
- source_word: ἐδαπάνων αὐτὰ
  choice: j’y dépensais l’argent ainsi obtenu
  rationale: Le grec emploie un pronom pluriel, mais le contexte de la vente indique ce qui est ensuite dépensé. Cette formulation française rend naturellement la continuité de l’action sans modifier son sens.
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: chaque année
  rationale: Rendu distributif simple et idiomatique.
theological_decisions:
- issue: Terminologie relative aux prélèvements cultuels
  choice: Conserver « le dixième » et « le second dixième » dans le texte.
  alternative: Employer « la dîme » et « la seconde dîme ».
  rationale: Le grec emploie littéralement le nombre ordinal substantivé. Le choix principal préserve cette formulation et évite d’imposer dans le texte une classification juridique plus précise, tandis que la note donne le terme français traditionnel.
- issue: Sens de ἀπεπρατιζόμην
  choice: Traduire par « je le vendais ».
  alternative: Traduire par « je le convertissais en argent ».
  rationale: La vente est le sens lexical direct ; la conversion en argent est fortement suggérée par la dépense qui suit, mais elle reste présentée en note comme explicitation possible.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits rendent la pratique répétée. La syntaxe grecque très coordonnée est répartie en trois phrases pour la lisibilité, sans supprimer la succession des actes.
