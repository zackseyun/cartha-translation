  terminology: « Voies de la vérité et de la justice », « œuvres de miséricorde », « mes frères » et « pays des Assyriens » sont cohérents avec un registre scripturaire moderne et respectent les termes clés. La note sur « aumônes » préserve à juste titre la possibilité du sens plus spécifique d’ἐλεημοσύνη; celle sur « frères » explique sans modifier le texte la portée probable du terme.
