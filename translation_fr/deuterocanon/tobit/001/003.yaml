base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: fr
  text: Moi, Tobit, j’ai marché dans les voies de la vérité et de la justice tous les jours de ma vie. J’ai aussi accompli de nombreuses œuvres de miséricorde[a] envers mes frères[b] et envers les gens de mon peuple qui étaient partis avec moi pour le pays des Assyriens, à Ninive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai fait beaucoup d’aumônes ». Le terme grec peut désigner précisément l’aumône, mais aussi, dans ce contexte, des actes de miséricorde plus largement.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « mes frères » désigne probablement les compatriotes ou les proches israélites de Tobit, et non seulement ses frères biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας ἐπορευόμην καὶ δικαιοσύνῃ
  choice: j’ai marché dans les voies de la vérité et de la justice
  rationale: Cette formulation conserve la métaphore éthique de la marche et des « voies », tout en rendant naturellement en français l’association de la vérité et de la justice qui caractérise la conduite de Tobit.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς μου
  choice: tous les jours de ma vie
  rationale: Équivalent français direct, naturel et complet de l’expression grecque.
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: j’ai accompli de nombreuses œuvres de miséricorde
  rationale: 'ἐλεημοσύνη peut désigner spécifiquement l’aumône, mais son pluriel avec ποιέω permet ici un sens plus large : des actes concrets de compassion. « Œuvres de miséricorde » préserve cette amplitude sans exclure l’aumône.'
- source_word: τοῖς ἀδελφοῖς μου
  choice: mes frères
  rationale: Le rendu suit directement le masculin pluriel grec. Dans ce contexte, le terme désigne vraisemblablement les compatriotes ou les proches israélites de Tobit plutôt que ses seuls frères biologiques; cette portée est signalée en note.
- source_word: τῷ ἔθνει
  choice: les gens de mon peuple
  rationale: Ce choix exprime naturellement la dimension collective et ethnique de ἔθνος en français, sans donner à « nation » un sens politique moderne trop marqué.
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: qui étaient partis avec moi
  rationale: Le grec associe l’idée d’aller ou de partir à celle d’un déplacement commun. Le français évite de forcer la nuance difficile de priorité contenue dans προ- tout en conservant le départ partagé vers l’Assyrie.
- source_word: εἰς χώραν Ἀσσυρίων εἰς Νινευή
  choice: pour le pays des Assyriens, à Ninive
  rationale: Le premier complément indique le territoire de destination et le second précise la ville. « Pays des Assyriens » reflète la construction grecque plus exactement que le simple nom « Assyrie ».
theological_decisions:
- issue: Sens de δικαιοσύνη dans l’autoportrait éthique de Tobit
  choice: justice
  alternative: droiture
  rationale: « Justice » reste le correspondant français traditionnel et suffisamment large de δικαιοσύνη, englobant ici la conduite droite devant Dieu et envers autrui. « Droiture » expliciterait davantage la dimension morale, mais réduirait une partie de l’amplitude du terme grec.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique de la marche est conservée. La phrase grecque a été divisée en deux phrases françaises afin d’éviter une coordination trop lourde, sans modifier sa progression logique.
