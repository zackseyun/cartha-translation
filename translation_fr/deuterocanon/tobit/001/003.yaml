  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : la métaphore éthique de la marche « dans les voies », l’association de ἀλήθεια et δικαιοσύνη, la durée de toute une vie, les nombreuses ἐλεημοσύναι, ainsi que le déplacement partagé vers le pays des Assyriens et Ninive. « Qui étaient partis avec moi » est une solution française recevable pour le participe προπορευθεῖσιν, dont la nuance de priorité est difficile à reproduire sans lourdeur ou surinterprétation.'
