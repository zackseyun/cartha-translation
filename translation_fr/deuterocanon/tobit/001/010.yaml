base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: fr
  text: Lorsque nous fûmes emmenés en captivité à Ninive, tous mes frères et les membres de ma parenté mangeaient de la nourriture des non-Juifs[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des pains des non-Juifs » ; ici, les « pains » désignent la nourriture ou les provisions.'
    reason: Précision sur l’expression grecque idiomatique ἐκ τῶν ἄρτων τῶν ἐθνῶν et conservation de sa formulation littérale.
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
  choice: nous fûmes emmenés captifs
  rationale: Le passif aoriste exprime une déportation forcée. Cette formulation conserve explicitement l’idée de captivité sans la réduire au sens plus large d’un simple exil.
- source_word: εἰς Νινευή
  choice: à Ninive
  rationale: Après un verbe de déplacement, εἰς indique la destination; « à Ninive » est la tournure française naturelle.
- source_word: πάντες οἱ ἀδελφοί μου
  choice: tous mes frères
  rationale: La traduction directe respecte le masculin pluriel du grec et le distingue du groupe familial plus large mentionné ensuite.
- source_word: οἱ ἐκ τοῦ γένους
  choice: les gens de ma parenté
  rationale: γένος désigne ici l’appartenance familiale ou lignagère. Cette expression française est claire et évite les connotations modernes trompeuses de « race ».
- source_word: ἤσθιον
  choice: mangeaient
  rationale: L’imparfait grec décrit naturellement une pratique suivie ou habituelle durant la captivité; l’imparfait français en restitue l’aspect.
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: de la nourriture des non-Juifs
  rationale: ἄρτοι, littéralement « pains », peut désigner ici les vivres ou la nourriture. Dans ce cadre juif de diaspora, ἐθνῶν oppose les Israélites aux autres peuples; « non-Juifs » rend clairement cette valeur sans recourir au terme moins courant « païens ».
theological_decisions:
- issue: Valeur ethnoreligieuse de ἐθνῶν
  choice: non-Juifs
  alternative: nations; païens
  rationale: Le contexte oppose les Israélites aux populations qui ne le sont pas. « Non-Juifs » exprime cette relation de façon moderne et précise, sans suggérer à lui seul un jugement moral ou une pratique idolâtre.
- issue: Faut-il expliciter une impureté alimentaire dans le texte principal ?
  choice: Ne pas ajouter « impure »
  alternative: la nourriture impure des non-Juifs
  rationale: Le grec ne qualifie pas explicitement cette nourriture d’impure. La traduction préserve donc l’implication narrative sans transformer celle-ci en affirmation explicite.
- issue: Rendre littéralement le pluriel « les pains » ou transmettre l’idiome
  choice: la nourriture
  alternative: le pain; les pains
  rationale: En contexte, le pluriel ἄρτοι renvoie vraisemblablement aux provisions alimentaires. Le choix principal privilégie la compréhension immédiate, tandis que la note conserve la forme concrète du grec.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au premier plan narratif (« fûmes emmenés »), tandis que l’imparfait (« mangeaient ») restitue la pratique habituelle indiquée par l’imparfait grec. « Les gens de ma parenté » reste accessible tout en marquant un cercle plus large que les seuls frères.
