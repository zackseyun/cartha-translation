base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: fr
  text: Lorsque j’atteignis l’âge d’homme, je pris Anna pour femme, issue de la lignée de notre clan paternel[a], et j’eus d’elle Tobie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la semence de notre clan paternel » ; l’expression désigne ici la descendance, ou lignée, du groupe familial paternel.'
    reason: lexical_alternative
  - marker: b
    text: Le nom grec Τωβίας est traditionnellement rendu en français par « Tobie » ; on trouve aussi la forme « Tobias ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: j’arrivai à l’âge d’homme
  rationale: Cette tournure française naturelle exprime l’accès à l’âge adulte masculin tout en conservant la précision de ἀνήρ.
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: je pris pour femme Anna
  rationale: La formulation garde l’image de l’idiome matrimonial grec sans être obscure ni excessivement archaïque.
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: de la lignée de notre clan paternel
  rationale: « Lignée » rend le sens généalogique de σπέρμα, tandis que « clan paternel » exprime la famille étendue issue d’un ancêtre que désigne πατριά.
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: d’elle j’engendrai
  rationale: Le sujet masculin du verbe est conservé, ainsi que la mention explicite de la mère introduite par ἐξ αὐτῆς.
- source_word: Τωβίαν
  choice: Tobie
  rationale: « Tobie » est la forme française courante et identifiable du nom grec Τωβίας.
theological_decisions:
- issue: Langage masculin marquant une étape de la vie
  choice: j’arrivai à l’âge d’homme
  alternative: je devins adulte
  rationale: Le choix maintient le caractère masculin de ἀνήρ dans ce récit autobiographique, sans lui donner une portée doctrinale supplémentaire.
- issue: Insistance sur l’appartenance familiale de l’épouse
  choice: de la lignée de notre clan paternel
  alternative: de notre famille
  rationale: Le grec souligne l’ascendance et le groupe familial paternel; la traduction conserve cette précision sans transformer le constat narratif en prescription juridique ou théologique.
translation_notes:
  register: Français international moderne, au registre narratif digne. « Arrivai à l’âge d’homme » et « pris pour femme » conservent la couleur du grec tout en restant compréhensibles; « lignée » évite le caractère artificiel de « semence » dans le texte principal.
