  yaml_path: translation/deuterocanon/tobit/001/017.yaml
  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: fr
  text: Je donnais de mon pain à ceux qui avaient faim et des vêtements à ceux qui étaient nus. Si je voyais l’un des miens mort et jeté derrière la muraille de Ninive[a], je l’enterrais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hors de la muraille de Ninive ». Le grec dit littéralement « derrière la muraille de Ninive »; il peut s’agir de corps jetés à l’extérieur de l’enceinte de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: de mon pain
  rationale: Le pluriel grec désigne littéralement des pains, mais « de mon pain » exprime naturellement en français le partage de ses propres ressources alimentaires.
- source_word: ἐδίδουν
  choice: Je donnais
  rationale: L’imparfait grec présente ici une pratique habituelle; l’imparfait français en rend directement la valeur itérative.
- source_word: τοῖς πεινῶσιν
  choice: à ceux qui avaient faim
  rationale: Cette formulation courante rend clairement le participe substantivé sans donner à « les affamés » une intensité que le grec n’impose pas.
- source_word: ἱμάτια τοῖς γυμνοῖς
  choice: des vêtements à ceux qui étaient nus
  rationale: « Vêtements » est général et actuel; « nus » conserve l’image directe du grec, qui peut désigner ceux qui manquent de vêtements.
- source_word: ἐκ τοῦ γένους μου
  choice: l’un des miens
  rationale: Cette expression laisse ouverte l’étendue du groupe de parenté ou d’appartenance évoqué par γένος, sans le réduire à la famille proche ni l’élargir explicitement à tout un peuple.
- source_word: τεθνηκότα καὶ ἐρριμμένον
  choice: mort et jeté
  rationale: Les participes décrivent quelqu’un qui se trouve déjà mort et abandonné après avoir été jeté; la traduction reste concise et respecte l’indignité de la scène.
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: derrière la muraille de Ninive
  rationale: « Derrière » traduit formellement ὀπίσω et préserve l’image grecque, tandis qu’une note signale que la localisation peut être comprise comme l’extérieur de la ville.
- source_word: ἔθαπτον αὐτόν
  choice: je l’enterrais
  rationale: L’imparfait français rend la pratique répétée exprimée dans ce résumé autobiographique.
theological_decisions:
- issue: Étendue de γένος μου
  choice: l’un des miens
  alternative: quelqu’un de ma famille; quelqu’un de mon peuple
  rationale: Le terme grec peut viser la parenté familiale ou un groupe d’appartenance plus large. « L’un des miens » maintient cette latitude sans imposer une délimitation théologique ou sociale.
translation_notes:
  register: Français moderne, digne et accessible. Les imparfaits soulignent le caractère habituel des actes de Tobit. La répétition simple de « je » conserve le ton autobiographique et direct du grec.
