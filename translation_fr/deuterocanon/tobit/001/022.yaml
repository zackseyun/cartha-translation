base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: fr
  text: Ahiachar intercéda en ma faveur, et je vins à Ninive. Ahiachar était échanson, gardien de l’anneau royal, administrateur et comptable. Sacherdonos l’établit au second rang[a]. C’était mon cousin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement une expression obscure : « fils du second » ; elle est généralement comprise comme indiquant qu’Ahiachar occupait le second rang, immédiatement après le roi.'
    reason: Formulation grecque textuellement difficile et idiomatique, dont la traduction interprétative doit être signalée.
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: intercéda en ma faveur
  rationale: Dans ce contexte narratif de cour, l’expression désigne naturellement une intervention en faveur de Tobit. Cette formulation française reste sobre sans préciser indûment la procédure.
- source_word: ἦλθον εἰς Νινευήν
  choice: je revins à Ninive
  rationale: Bien que le verbe signifie littéralement « je vins », le contexte immédiat implique le retour de Tobit à Ninive; « revins » rend naturellement ce mouvement en français.
- source_word: οἰνοχόος
  choice: échanson
  rationale: Titre français traditionnel et précis de l’officier de cour chargé de servir le vin au souverain.
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: gardien de l’anneau royal
  rationale: Littéralement « préposé à l’anneau »; dans le cadre royal, il s’agit de l’anneau servant de sceau. « Royal » explicite sobrement sa fonction institutionnelle.
- source_word: διοικητής
  choice: administrateur
  rationale: Le terme désigne celui qui gère ou administre des affaires; ce choix conserve sa portée générale.
- source_word: ἐκλογιστής
  choice: comptable
  rationale: Le mot se rapporte à l’établissement et à la vérification des comptes; « comptable » est clair et concis en français moderne.
- source_word: κατέστησεν αὐτὸν
  choice: l’avait établi
  rationale: Dans le contexte d’une charge officielle, καθίστημι exprime l’établissement ou la nomination à un rang.
- source_word: υἱὸς ἐκ δευτέρας
  choice: au second rang
  rationale: La formulation grecque est obscure et probablement idiomatique; le contexte suggère une position immédiatement inférieure à celle du roi, mais cette interprétation doit être signalée en note.
- source_word: ἐξάδελφός μου
  choice: mon cousin
  rationale: ἐξάδελφος désigne précisément un cousin plutôt qu’un parent au sens large.
