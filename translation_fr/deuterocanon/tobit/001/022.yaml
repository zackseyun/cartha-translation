  source_fidelity: « Je revins » ajoute l’idée d’un retour, absente de ἦλθον (« je vins / j’arrivai »). Le passé antérieur français « l’avait établi » transforme sans nécessité l’aoriste κατέστησεν en plus-que-parfait. Le reste rend correctement les fonctions d’Ahiachar et signale de façon adéquate la difficulté de υἱὸς ἐκ δευτέρας.
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Je vins à Ninive » est légèrement plus soutenu que « je suis venu », mais convient bien à ce récit et suit exactement le grec. « Échanson » reste un titre de cour précis et intelligible dans ce contexte.
  terminology: « Intercéda en ma faveur », « échanson », « gardien de l’anneau royal », « administrateur », « comptable » et « mon cousin » sont des équivalents recevables. « Au second rang » demeure une interprétation prudente de l’expression grecque difficile, explicitement documentée par la note.
