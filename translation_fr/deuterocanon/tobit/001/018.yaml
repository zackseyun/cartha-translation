    issue: « faisait tuer » pour ἀπέκτεινεν
    rationale: Le grec dit simplement que le roi « tua »; il ne précise pas qu’il ordonnait les exécutions. La tournure causative française ajoute une nuance qui n’est pas attestée.
  - severity: low
    issue: « revint » pour ἦλθεν
    rationale: Le verbe grec signifie « vint »; le préfixe re- introduit un retour que le texte ne formule pas.
  - severity: low
    issue: Discordance entre le singulier « quelqu’un » et « je l’enterrais » par rapport à αὐτούς
    rationale: Le grec passe du singulier indéfini à un pluriel qui envisage l’ensemble des victimes. Une formulation française explicitant la pratique habituelle rend mieux cette portée collective.
