  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
translation:
  language: fr
  text: Et si le roi Sennachérib[a] tuait quelqu’un lorsqu’il vint de Judée en fuyant, j’ensevelissais ses victimes en secret. Car, dans sa colère, il en tua beaucoup. Le roi fit rechercher les corps, mais on ne les trouva pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de l’édition Swete porte « Achreil, le roi » (Ἀχρειλ ὁ βασιλεύς), forme comprise dans ce contexte comme désignant Sennachérib.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα ἀπέκτεινεν
  choice: Et si ... faisait tuer quelqu’un
  rationale: La tournure conditionnelle indéfinie décrit une pratique répétée. « Faisait tuer » rend naturellement en français une mise à mort ordonnée par le roi, sans imposer qu’il ait tué de sa propre main.
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: le roi Sennachérib[a]
  rationale: Le contexte narratif identifie ce roi à Sennachérib. La forme inhabituelle du témoin grec est conservée en note pour assurer la transparence textuelle.
- source_word: ὅτε ἦλθεν φεύγων ἐκ τῆς Ἰουδαίας
  choice: lorsqu’il revint en fuyant la Judée
  rationale: « Revint » explicite naturellement le mouvement vers son territoire suggéré par le contexte, tandis que « en fuyant » conserve la valeur du participe φεύγων.
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: je l’enterrais en secret
  rationale: Le pluriel αὐτούς reprend collectivement les victimes envisagées au fil des cas; après « quelqu’un », le singulier distributif français est plus naturel. κλέπτων exprime ici une action clandestine, non un vol.
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: dans sa colère
  rationale: Rendu direct et courant qui n’intensifie pas indûment le grec.
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα
  choice: Le roi fit rechercher les corps
  rationale: La construction causative française rend clairement le passif grec et l’autorité royale à l’origine de la recherche.
- source_word: καὶ οὐχ εὑρέθη
  choice: mais on ne les trouva pas
  rationale: Le verbe grec singulier s’accorde normalement avec un sujet neutre pluriel; le français exige ici une reprise plurielle. « Mais » exprime naturellement le contraste contextuel.
theological_decisions:
- issue: Forme du nom du roi assyrien
  choice: Employer « Sennachérib » dans le texte et signaler « Achreil » en note.
  alternative: Conserver « Achreil, le roi » dans le texte principal.
  rationale: Il s’agit d’une difficulté textuelle et onomastique, non doctrinale. Le contexte identifie le personnage à Sennachérib, mais la note préserve honnêtement la forme attestée dans l’édition source.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait (« faisait tuer », « enterrais ») fait ressortir la pratique répétée exprimée par la condition indéfinie; le passé simple maintient la progression du récit pour les actions globales du roi.
