revisions:
- from: Et si le roi Sennachérib[a] faisait tuer quelqu’un lorsqu’il revint en fuyant la Judée, je l’enterrais en secret. En effet, dans sa colère, il en tua beaucoup. Le roi fit rechercher les corps, mais on ne les trouva pas.
  to: Et si le roi Sennachérib[a] tuait quelqu’un lorsqu’il vint de Judée en fuyant, j’ensevelissais ses victimes en secret. Car, dans sa colère, il en tua beaucoup. Le roi fit rechercher les corps, mais on ne les trouva pas.
  rationale: La révision retire la causalité ajoutée par « faisait tuer » et le sens ajouté par « revint ». « Ses victimes » rend naturellement en français le pluriel αὐτούς après le singulier indéfini τίνα, sans modifier le sens. La note textuelle est conservée, car elle documente honnêtement la divergence onomastique du témoin grec de référence.
