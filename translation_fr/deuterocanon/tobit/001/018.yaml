review_pass:
  verdict: revise
  source_fidelity: La version interprète indûment ἀπέκτεινεν (« tua ») par « faisait tuer », ce qui introduit une causalité/commande non exprimée. « Revint » ajoute également l’idée d’un retour, absente de ἦλθεν (« vint »). Le reste rend correctement l’ensevelissement clandestin, la colère du roi, la recherche des corps et leur absence.
  naturalness: Le français est globalement fluide et de registre narratif approprié. La correction proposée conserve une formulation moderne et clarifie le lien entre la victime singulière et la pratique habituelle de Tobit sans ajouter de détail historique.
  terminology: « Sennachérib » est la forme française usuelle; la note signale de façon adéquate la forme Ἀχρειλ du texte de Swete. « Ensevelir en secret » rend bien ἔθαψα ... κλέπτων.
  issues:
