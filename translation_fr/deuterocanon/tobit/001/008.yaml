base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: fr
  text: Et je donnais la troisième part[a] à ceux à qui elle revenait, comme me l’avait ordonné Débora, la mère de mon père[b], car mon père m’avait laissé orphelin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « la troisième »; le nom « part » est sous-entendu en grec et se comprend d’après le contexte.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire sa grand-mère paternelle.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec dit littéralement : « j’ai été laissé orphelin par mon père »; il s’agit ici de la perte de son père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: la troisième part
  rationale: Le féminin substantivé renvoie implicitement, d’après le contexte, à une part ou portion. Le français demande ici d’expliciter le nom pour rester naturel.
- source_word: ἐδίδουν
  choice: je donnais
  rationale: L’imparfait grec décrit une pratique habituelle passée; l’imparfait français en conserve naturellement la valeur.
- source_word: οἷς καθήκει
  choice: à ceux à qui elle revenait
  rationale: Cette formulation rend l’idée de ce qui convient, appartient ou est dû, sans préciser davantage l’identité des bénéficiaires.
- source_word: καθὼς ἐνετείλατο
  choice: comme me l’avait ordonné
  rationale: Le verbe exprime un commandement ou une consigne ferme. Le plus-que-parfait marque naturellement l’antériorité de l’ordre en français.
- source_word: Δεββώρα
  choice: Débora
  rationale: Forme française biblique usuelle du nom grec Δεββώρα.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: la mère de mon père
  rationale: La traduction conserve l’expression concrète du grec au lieu de la remplacer silencieusement par « ma grand-mère ».
- source_word: διότι
  choice: car
  rationale: Introduit avec naturel en français la raison pour laquelle Débora avait autorité pour lui donner cette consigne.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: mon père m’avait laissé orphelin
  rationale: Cette tournure française reste proche de la construction grecque tout en évitant le calque maladroit « j’avais été laissé orphelin par mon père »; le contexte indique la perte du père.
