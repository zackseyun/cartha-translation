  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: fr
  text: Tous mes biens furent pillés, et il ne me resta rien, sauf Anna, ma femme, et Tobit, mon fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase indique qu’après le pillage de ses biens, seuls sa femme et son fils étaient encore auprès de Tobit ; elle ne les présente pas comme ses possessions.
    reason: Clarification du rapport grammatical entre les biens pillés et les personnes restées auprès de Tobit.
lexical_decisions:
- source_word: διηρπάγη
  choice: furent pillés
  rationale: Le passif exprime la prise violente des biens par d’autres. « Furent pillés » conserve cette idée de spoliation mieux que le plus neutre « furent saisis ».
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: tous mes biens
  rationale: L’expression désigne l’ensemble des biens matériels de Tobit. « Tous mes biens » est naturel, précis et rend la totalité marquée par πάντα.
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: il ne me resta rien
  rationale: Cette tournure française idiomatique restitue le passif impersonnel grec et l’insistance de οὐδέν sur l’absence totale de biens restants.
- source_word: πλὴν
  choice: sauf
  rationale: « Sauf » introduit naturellement les seules personnes demeurées auprès de Tobit après la spoliation.
- source_word: Ἄννας
  choice: Anna
  rationale: Cette forme suit directement le nom grec Ἄννα et son usage français courant.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Le texte grec porte ici Τωβεὶτ. « Tobit » reproduit cette forme plutôt que la forme traditionnelle différente « Tobias ».
theological_decisions:
- issue: La femme et le fils après la mention des biens pillés
  choice: Conserver la construction grecque « il ne me resta rien, sauf Anna… et Tobit… » tout en l’éclairant par une note.
  alternative: 'Reformuler : « seules les personnes d’Anna… et de Tobit… me restèrent » ou « seuls Anna… et Tobit… restèrent avec moi ».'
  rationale: La formulation retenue préserve la structure et la force du grec sans laisser entendre, grâce à la note, que la femme et le fils sont comptés parmi les biens matériels.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les appositions « ma femme » et « mon fils » reproduisent clairement la structure grecque.
