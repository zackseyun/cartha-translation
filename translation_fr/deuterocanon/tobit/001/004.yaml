- from: Lorsque j’étais dans mon pays, au pays d’Israël, et que j’étais encore jeune, toute la tribu de mon ancêtre Nephtali s’éloigna de la maison de Jérusalem[a], choisie parmi toutes les tribus d’Israël pour que toutes les tribus y offrent des sacrifices. Le temple, demeure du Très-Haut, fut consacré et construit pour toutes les générations[b].
  to: Lorsque j’étais dans mon pays, au pays d’Israël, alors que j’étais encore jeune, toute la tribu de mon ancêtre Nephtali se détourna de la maison de Jérusalem[a], choisie parmi toutes les tribus d’Israël pour que toutes les tribus y offrent des sacrifices. Le temple, demeure du Très-Haut, fut consacré et construit pour toutes [les générations][b].
