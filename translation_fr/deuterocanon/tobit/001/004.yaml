base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: fr
  text: Lorsque j’étais dans mon pays, au pays d’Israël, alors que j’étais encore jeune, toute la tribu de mon ancêtre Nephtali se détourna de la maison de Jérusalem[a], choisie parmi toutes les tribus d’Israël pour que toutes les tribus y offrent des sacrifices. Le temple, demeure du Très-Haut, fut consacré et construit pour toutes [les générations][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec distingue ici la « maison de Jérusalem » du « temple » mentionné ensuite. La première expression désigne vraisemblablement le sanctuaire de Jérusalem de manière générale.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec conservé se termine de manière abrupte par « pour toutes ». Les mots entre crochets, « les générations », constituent une restitution d’après le sens probable et la tradition textuelle plus longue de Tobit.
    reason: textual_variant
lexical_decisions:
- source_word: χώρα
  choice: pays
  rationale: Dans « ἐν τῇ χώρᾳ μου », « mon pays » exprime naturellement la patrie de Tobit, ensuite précisée par « au pays d’Israël ».
- source_word: νεωτέρου μου ὄντος
  choice: j’étais encore jeune
  rationale: Cette formulation française courante rend la proposition temporelle et l’âge de Tobit sans lourdeur.
- source_word: ἀπέστη
  choice: s’éloigna
  rationale: Le verbe exprime ici une rupture avec le sanctuaire de Jérusalem. « S’éloigna » en conserve la gravité religieuse sans imposer le terme doctrinal plus technique « apostasier ».
- source_word: τοῦ Νεφθαλεὶμ τοῦ πατρός μου
  choice: de mon ancêtre Nephtali
  rationale: « Ancêtre » évite de faire de Nephtali le père immédiat de Tobit et rend le rapport tribal exprimé par πατήρ dans ce contexte généalogique.
- source_word: οἶκος Ἱεροσολύμων
  choice: maison de Jérusalem
  rationale: La traduction formelle maintient l’expression grecque et ne la confond pas avec ναός, « temple », employé ensuite dans le verset.
- source_word: ἐκλεγείσης
  choice: choisie
  rationale: Le participe passif qualifie la maison de Jérusalem comme le lieu choisi parmi les tribus d’Israël.
- source_word: εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
  choice: pour que toutes les tribus y offrent des sacrifices
  rationale: Cette tournure rend clairement le but et explicite la valeur locative impliquée par le choix du sanctuaire.
- source_word: ναός
  choice: temple
  rationale: « Temple » est l’équivalent français direct et permet de préserver la distinction avec « maison de Jérusalem ».
- source_word: κατασκήνωσις
  choice: demeure
  rationale: « Demeure du Très-Haut » exprime l’habitation divine sans suggérer à tort que le texte désigne nécessairement le tabernacle mobile.
- source_word: ὑψίστου
  choice: Très-Haut
  rationale: C’est le titre divin biblique usuel en français.
- source_word: ἡγιάσθη
  choice: fut consacré
  rationale: Le passif indique que le temple fut mis à part comme saint; le passé simple convient au récit et à l’aoriste grec.
- source_word: ᾠκοδομήθη
  choice: fut ... construit
  rationale: Le choix conserve le sens architectural concret du verbe grec.
- source_word: εἰς πάσας
  choice: pour toutes les générations
  rationale: Le texte grec transmis s’interrompt après un adjectif féminin pluriel incomplet. « Générations » fournit prudemment le nom sous-entendu selon le contexte et la tradition textuelle plus longue, avec signalement en note.
theological_decisions:
- issue: Nature de l’abandon du sanctuaire par la tribu de Nephtali
  choice: s’éloigna de la maison de Jérusalem
  alternative: aposta loin de la maison de Jérusalem
  rationale: Le grec indique une défection cultuelle réelle, mais « s’éloigna » laisse au contexte sa portée religieuse sans importer un vocabulaire doctrinal ultérieur.
- issue: Choix de Jérusalem comme lieu des sacrifices
  choice: choisie parmi toutes les tribus d’Israël pour que toutes les tribus y offrent des sacrifices
  alternative: choisie d’entre toutes les tribus d’Israël comme lieu de sacrifice pour elles toutes
  rationale: La formulation préserve l’affirmation du choix du sanctuaire central ainsi que la répétition emphatique de « toutes les tribus », sans préciser explicitement l’agent divin, absent de la proposition grecque.
- issue: Durée assignée au temple dans la finale lacunaire
  choice: pour toutes les générations
  alternative: pour toutes
  rationale: La finale grecque est grammaticalement incomplète. Le complément retenu donne un sens cohérent appuyé par la tradition longue, tout en étant clairement identifié comme une restitution textuelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsmes excessifs. Les répétitions significatives du grec sont conservées, tandis que la syntaxe est réorganisée pour rester immédiatement compréhensible.
