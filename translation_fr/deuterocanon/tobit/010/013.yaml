revisions:
- from: Après cela, Tobie poursuivit sa route en bénissant Dieu, parce qu’il avait fait réussir son voyage[a]. Il ne cessait aussi de bénir Ragouël et Edna, sa femme. Il continua son chemin jusqu’à ce qu’ils approchent de Ninive[b].
  to: Après cela, Tobie aussi poursuivit sa route en bénissant Dieu, car Dieu avait fait réussir son voyage[a]. Il ne cessait aussi de bénir Ragouël et sa femme Edna. Il continua son chemin jusqu’à ce qu’ils approchent de Ninive[b].
