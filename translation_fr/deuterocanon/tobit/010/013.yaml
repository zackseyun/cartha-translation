  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: fr
  text: Après cela, Tobie aussi poursuivit sa route en bénissant Dieu, car Dieu avait fait réussir son voyage[a]. Il ne cessait aussi de bénir Ragouël et sa femme Edna. Il continua son chemin jusqu’à ce qu’ils approchent de Ninive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il avait fait prospérer sa route » ; cette expression grecque signifie que Dieu avait accordé le succès à son voyage.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec transmis présente ici une construction difficile : le verbe « ils approchèrent » est au pluriel, tandis que le pronom αὐτόν (« le/lui ») est au singulier. La traduction exprime le sens narratif apparent : les voyageurs approchèrent de Ninive.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français moderne; le singulier collectif « cela » reprend idiomatiquement les événements précédents.
- source_word: ἐπορεύετο
  choice: poursuivit sa route / continua son chemin
  rationale: L’imparfait grec exprime un déplacement en cours. Ces formulations rendent la continuité du voyage sans lourdeur.
- source_word: εὐλογῶν τὸν θεόν
  choice: en bénissant Dieu
  rationale: « Bénir » conserve le vocabulaire biblique et le lien lexical avec κατευλόγει.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: parce qu’il avait fait réussir son voyage
  rationale: L’expression grecque associant εὐοδόω à ὁδός signifie que Dieu a accordé le succès au voyage; la formulation française restitue naturellement cet idiome.
- source_word: κατευλόγει
  choice: Il ne cessait aussi de bénir
  rationale: Cette tournure rend la valeur durative ou répétée de l’imparfait et la force du préverbe κατα- sans exagération.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Ragouël et Edna, sa femme
  rationale: La construction appositive désigne Edna comme la femme de Ragouël. La ponctuation préserve cette lecture tout en restant naturelle.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: jusqu’à ce qu’ils approchent de Ninive
  rationale: Le verbe pluriel indique les voyageurs, tandis que le pronom singulier rend le grec transmis syntaxiquement difficile. Le texte principal donne le sens narratif apparent, et la note signale l’irrégularité.
theological_decisions:
- issue: Agent du succès du voyage
  choice: Dieu a fait réussir le voyage de Tobie
  alternative: Dieu a rendu sa route prospère, ou a favorisé plus généralement son entreprise
  rationale: Le sujet sous-entendu de εὐώδωσεν est Dieu, nommé immédiatement auparavant. La traduction conserve clairement cette attribution providentielle sans l’amplifier.
translation_notes:
  register: Français international moderne, digne et accessible. « Tobie », « Ragouël » et « Ninive » suivent les formes françaises bibliques usuelles; « Edna » est conservé. Les deux occurrences de « bénir » maintiennent l’écho lexical du grec.
