base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/002.yaml
  text: he said[a], “Could it be that he has been delayed? Or could it be that Gabael has died, and no one is giving him the money?”
translation:
  language: fr
  text: 'Il dit : « Se pourrait-il qu’il ait été couvert de honte[a] ? Ou bien Gabaël serait-il mort, et personne ne donnerait l’argent à Tobie ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « a été couvert de honte ». L’expression peut évoquer un échec, un affront ou un autre contretemps humiliant, sans en préciser la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: il disait
  rationale: Dans ce contexte d’inquiétude exprimée, l’imparfait français introduit naturellement les paroles répétées ou prolongées de Tobit, bien que l’aoriste grec puisse aussi se rendre par « il dit ».
- source_word: Μή ποτε
  choice: Se pourrait-il que
  rationale: Cette tournure exprime une possibilité redoutée sous forme de question anxieuse, sans transformer le soupçon en affirmation.
- source_word: κατῄσχυνται
  choice: ait été couvert de honte
  rationale: Le parfait passif de καταισχύνω désigne normalement le fait d’avoir été humilié ou couvert de honte. Cette traduction conserve le sens lexical et l’imprécision du grec quant à l’événement concret.
- source_word: ἀπέθανεν
  choice: serait-il mort
  rationale: Le conditionnel passé interrogatif rend idiomatiquement en français l’hypothèse inquiétante introduite par μή ποτε.
- source_word: Γαβαήλ
  choice: Gabaël
  rationale: Translittération française du nom grec, sans le confondre avec Gabriel.
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: personne lui remette l’argent
  rationale: ἀργύριον désigne ici la somme déposée. « Remettre l’argent » est naturel dans le contexte tout en évitant de préciser davantage les modalités de la transaction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation interrogative préserve l’inquiétude et l’incertitude du grec ; la note maintient l’ambiguïté de κατῄσχυνται sans imposer le sens interprétatif « retardé ».
