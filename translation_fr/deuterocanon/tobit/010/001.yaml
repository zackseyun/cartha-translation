base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: fr
  text: Son père, Tobit, comptait chaque jour. Lorsque les jours du voyage furent écoulés et qu’ils n’arrivaient toujours pas[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne venaient toujours pas ». L’imparfait grec indique qu’une fois passé le temps attendu pour le voyage, ils n’étaient toujours pas arrivés. Dans le contexte, il s’agit de leur retour qui tarde. La tradition sémitique parallèle développe la scène en évoquant le décompte des jours et des nuits ainsi que la détresse des parents ; le texte suit ici la forme grecque plus brève.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο
  choice: comptait
  rationale: Avec « chaque jour », le verbe désigne ici le décompte concret du temps qui passe plutôt qu’une réflexion abstraite.
- source_word: ἑκάστης ἡμέρας
  choice: les jours, un à un
  rationale: Cette formulation française naturelle conserve la valeur distributive du grec et souligne l’attente quotidienne.
- source_word: ἐπληρώθησαν
  choice: fut écoulée
  rationale: À propos d’une durée, cette expression rend naturellement l’idée que le temps attendu était arrivé à son terme, sans connotation théologique indue.
- source_word: αἱ ἡμέραι τῆς πορείας
  choice: la durée prévue du voyage
  rationale: Le grec évoque les jours nécessaires au trajet; cette formulation explicite naturellement en français qu’il s’agit du délai attendu.
- source_word: οὐκ ἤρχοντο
  choice: ils n’arrivaient toujours pas
  rationale: L’imparfait grec exprime une attente qui demeure insatisfaite après l’expiration du délai prévu. « Arrivaient » préserve le mouvement vers le lieu où se trouve Tobit, sans ajouter explicitement l’idée de retour.
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: Son père Tobit
  rationale: Cette tournure française claire restitue l’apposition grecque et identifie sans lourdeur le père du personnage attendu.
