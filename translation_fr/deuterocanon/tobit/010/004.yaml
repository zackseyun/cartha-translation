  yaml_path: translation/deuterocanon/tobit/010/004.yaml
  text: Then his wife said to him[a], “The child has perished, because he has been delayed.” And she began to mourn for him and said,
translation:
  language: fr
  text: 'Alors sa femme lui dit : « L’enfant est mort, puisqu’il tarde tant. » Et elle se mit à le pleurer[a] et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec répète le pronom (« lui, lui »), peut-être pour insister ou par répétition de copiste.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: est mort
  rationale: Dans ce contexte, la mère tire de la longue absence de son fils la conclusion qu’il a péri. « Est mort » exprime naturellement en français moderne la force du verbe, sans préciser la manière de mourir.
- source_word: τὸ παιδίον
  choice: l’enfant
  rationale: Le diminutif παιδίον désigne ici Tobias du point de vue affectif de sa mère. « L’enfant » conserve le terme grec et convient au registre émotionnel.
- source_word: διότι κεχρόνικεν
  choice: puisqu’il tarde tant
  rationale: Le parfait de χρονίζω indique que l’absence se prolonge. « Il tarde tant » rend idiomatiquement cette durée excessive et le lien causal exprimé par διότι, sans suggérer nécessairement qu’une cause extérieure l’a retardé.
- source_word: ἤρξατο θρηνεῖν
  choice: elle se mit à le pleurer
  rationale: La tournure exprime le commencement d’une lamentation funèbre. « Se mit à le pleurer » est naturel, digne et indique qu’elle le tient déjà pour mort.
- source_word: αὐτὸν αὐτὸν
  choice: le
  rationale: Le double αὐτόν du texte transmis est difficile à reproduire naturellement et peut relever de l’insistance ou d’une répétition de copiste. Le texte français lisse la répétition, qui est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde l’intensité de la conclusion maternelle; « puisqu’il tarde tant » évite le tour peu idiomatique « parce qu’il a été retardé » et préserve l’idée d’une absence prolongée.
