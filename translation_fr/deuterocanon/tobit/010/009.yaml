  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: fr
  text: 'Mais son beau-père lui dit : « Reste avec moi. J’enverrai des messagers auprès de ton père, et ils lui feront connaître ce qui te concerne.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « J’enverrai auprès de ton père, et ils lui feront connaître ce qui te concerne. » L’objet de « j’enverrai » n’est pas exprimé; le verbe suivant est au pluriel et suggère des personnes envoyées, sans les identifier.'
    reason: Le grec laisse implicite ce qui est envoyé, tandis que le pluriel de « ils feront connaître » appelle en français l’explicitation minimale « des messagers ».
lexical_decisions:
- source_word: ὁ πενθερός
  choice: son beau-père
  rationale: Le terme désigne le père par alliance ; dans le contexte, il s’agit de Ragouël, beau-père de Tobie.
- source_word: Μεῖνον παρʼ ἐμοί
  choice: Reste avec moi
  rationale: Cette formulation rend directement l’impératif et la proximité exprimée par παρʼ ἐμοί dans un français naturel.
- source_word: κἀγὼ ἐξαποστελῶ
  choice: J’enverrai des gens
  rationale: Le grec ne précise pas ici l’objet de « j’enverrai », mais le verbe suivant est au pluriel. « des gens » explicite sobrement les personnes envoyées sans les qualifier davantage.
- source_word: πρὸς τὸν πατέρα σου
  choice: auprès de ton père
  rationale: « Auprès de » convient à l’envoi de personnes vers le père et garde la valeur relationnelle et directionnelle de πρός.
- source_word: δηλώσουσιν αὐτῷ
  choice: ils lui feront connaître
  rationale: Le pluriel grec est conservé et δήλοω est rendu par l’idée de faire connaître ou d’informer.
- source_word: τὰ κατὰ σέ
  choice: ta situation
  rationale: L’expression désigne ce qui concerne l’interlocuteur. « ta situation » est concise, naturelle et moins lourde qu’une traduction littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le dialogue reste direct ; l’explicitation « des gens » résout seulement l’ellipse grammaticale nécessaire en français, tandis que la note conserve la forme inhabituelle du grec.
