  yaml_path: translation/deuterocanon/tobit/010/012.yaml
  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: fr
  text: 'Il dit à sa fille : « Honore tes beaux-parents : désormais, ils sont tes parents. Puissé-je entendre dire du bien de toi ! » Puis il l’embrassa. Edna dit à Tobie : « Frère bien-aimé, que le Seigneur du ciel te ramène[a] et qu’il m’accorde de voir tes enfants nés de Sara, ma fille, afin que je me réjouisse devant le Seigneur. Voici que je te confie ma fille comme un dépôt[b] : ne lui cause pas de chagrin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te rétablisse ». Le verbe grec peut désigner le fait de ramener quelqu’un, de le rétablir ou de le restaurer.
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire : « je place ma fille sous ta garde ». Le grec emploie littéralement l’image d’un bien confié en dépôt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα τοὺς πενθερούς σου
  choice: Honore tes beaux-parents
  rationale: « Honore » conserve la portée éthique de τιμάω, tandis que « beaux-parents » désigne naturellement en français les parents du conjoint.
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: Puissé-je entendre dire du bien de toi
  rationale: Cette tournure française rend le souhait et l’expression idiomatique grecque concernant la bonne réputation ou les bonnes nouvelles de quelqu’un.
- source_word: ἀδελφὲ ἀγαπητέ
  choice: Frère bien-aimé
  rationale: Rend les deux éléments grecs et conserve l’adresse familiale affectueuse.
- source_word: ἀποκαταστήσει σε
  choice: que le Seigneur du ciel te ramène
  rationale: Dans ce contexte de départ, le verbe évoque naturellement le retour; une note conserve son sens plus large de rétablissement ou de restauration.
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: qu’il m’accorde de voir tes enfants nés de Sara, ma fille
  rationale: Formulation française naturelle qui respecte σου παιδία et l’origine exprimée par ἐκ Σάρρας sans introduire une idée étrangère d’agence.
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: afin que je me réjouisse devant le Seigneur
  rationale: Conserve le but exprimé par ἵνα, le sens de joie de εὐφρανθῶ et la formulation religieuse « devant le Seigneur ».
- source_word: ἰδοὺ παρατίθεμαί σοι τὴν θυγατέρα μου ἐν παρακαταθήκῃ
  choice: Voici que je te confie ma fille comme un dépôt
  rationale: « Je te confie » rend clairement παρατίθεμαι; « comme un dépôt » maintient la métaphore juridique et fiduciaire de παρακαταθήκη, expliquée en note.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: ne lui cause pas de chagrin
  rationale: Rend explicitement la valeur causative de λυπέω dans un français courant et digne.
theological_decisions:
- issue: Rendu de κύριος dans le titre divin ὁ κύριος τοῦ οὐρανοῦ
  choice: le Seigneur du ciel
  alternative: le Maître du ciel
  rationale: « Seigneur » est le rendu français traditionnel, naturel et non sectaire de κύριος dans un titre divin; le complément « du ciel » suit directement le génitif grec.
- issue: Portée de ἀποκαταστήσει dans la bénédiction d’Edna
  choice: te ramène
  alternative: te rétablisse
  rationale: Le contexte du voyage favorise l’idée d’un retour, mais le texte grec peut également évoquer un rétablissement plus général; la note préserve cette amplitude sans la trancher dogmatiquement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement familial est naturel dans la scène. Les formulations « Puissé-je » et « Frère bien-aimé » gardent la solennité de la bénédiction, tandis que les notes explicitent deux métaphores ou ambiguïtés grecques sans les effacer.
