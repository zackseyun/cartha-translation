lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction poursuit simplement le récit; « Et » en conserve la valeur connective sans ajouter de nuance causale.
- source_word: ἐλυπεῖτο
  choice: il était attristé
  rationale: L’imparfait de λυπέω exprime ici un état de tristesse qui se prolonge. « Était attristé » en rend naturellement la valeur imperfective et la charge émotionnelle sans préciser indûment la cause.
- source_word: λίαν
  choice: profondément
  rationale: λίαν marque un degré élevé. Avec « attristé », l’adverbe « profondément » donne en français moderne une formulation naturelle et digne, tout en conservant l’intensité du grec.
