base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: fr
  text: 'Alors Ragouël se leva et donna à Tobie Sara, sa femme, ainsi que la moitié de ses biens : des esclaves[a], du bétail et de l’argent. Après les avoir bénis, il les laissa partir en disant : « Le Dieu du ciel vous accordera la réussite[b], mes enfants, avant que je meure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des corps »; dans cette liste de biens, le terme désigne des personnes réduites en esclavage.'
    reason: Précision lexicale et historique sur σώματα.
  - marker: b
    text: 'Le futur grec peut aussi avoir ici la valeur d’une bénédiction : « Que le Dieu du ciel vous accorde la réussite. »'
    reason: Préservation de l’ambiguïté entre affirmation et souhait dans Εὐοδώσει.
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste de ἀνίστημι introduit ici l’action suivante; « se leva » est naturel et proche du grec.
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: donna à Tobie Sara, sa femme
  rationale: Le pronom αὐτῷ est explicité par « à Tobie » pour éviter une succession obscure de pronoms en français. « Sa femme » conserve le statut matrimonial exprimé par le grec.
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: la moitié de ses biens
  rationale: ὑπάρχοντα désigne globalement ce que Ragouël possède; « biens » convient à la liste qui suit.
- source_word: σώματα
  choice: esclaves
  rationale: Littéralement « corps », le terme figure dans une liste de biens et désigne des personnes réduites en esclavage. « Esclaves » rend clairement la réalité sociale sans l’atténuer; la formulation littérale est signalée en note.
- source_word: κτήνη
  choice: bétail
  rationale: Le mot désigne les animaux domestiques possédés; « bétail » est courant et précis dans ce contexte patrimonial.
- source_word: ἀργύριον
  choice: argent
  rationale: ἀργύριον signifie littéralement « argent » au sens du métal et, par extension, de la richesse monétaire; le français conserve naturellement les deux possibilités.
- source_word: εὐλογήσας αὐτοὺς
  choice: Après les avoir bénis
  rationale: Cette tournure rend l’antériorité circonstancielle du participe aoriste par rapport au départ.
- source_word: ἐξαπέστειλεν
  choice: il les laissa partir
  rationale: Dans cette scène de congé familial, la formule française exprime naturellement le fait de les renvoyer pour leur voyage, sans la nuance potentiellement dure de « chassa » ou « renvoya ».
- source_word: Εὐοδώσει ὑμᾶς
  choice: vous accordera la réussite
  rationale: Le futur grec est conservé comme futur dans le texte principal. εὐοδόω évoque la réussite ou le bon déroulement, notamment d’un voyage, sans devoir limiter ici la bénédiction au trajet.
- source_word: τέκνα
  choice: mes enfants
  rationale: Le grec dit littéralement « enfants » au vocatif. En français, « mes enfants » est la forme idiomatique d’une adresse affectueuse de ce type; le possessif n’introduit pas une affirmation doctrinale ou généalogique nouvelle.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: le Dieu du ciel
  rationale: Cette traduction formelle préserve le titre divin juif et sa portée théologique.
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: avant que je meure
  rationale: La proposition temporelle est traduite directement, en maintenant son rattachement inhabituel à la bénédiction ou à la promesse précédente.
theological_decisions:
- issue: Valeur du futur Εὐοδώσει dans une formule de bénédiction
  choice: Le Dieu du ciel vous accordera la réussite
  alternative: Que le Dieu du ciel vous accorde la réussite
  rationale: La forme grecque est un futur et peut se lire comme une assurance, même si le contexte de bénédiction permet aussi une valeur optative. Le texte principal conserve la forme prédictive, tandis que la note préserve la valeur de souhait sans trancher silencieusement.
- issue: Désignation des personnes par σώματα dans une liste de biens
  choice: esclaves
  alternative: serviteurs; littéralement « corps »
  rationale: Puisque ces personnes sont énumérées parmi les biens transmis, « esclaves » communique la réalité sociale du passage avec plus de justesse que l’euphémisme « serviteurs ». La note conserve néanmoins l’expression singulière du grec.
translation_notes:
  register: Français international actuel, narratif et digne. Les noms propres suivent les formes françaises usuelles « Ragouël », « Tobie » et « Sara ». La phrase conserve l’étrangeté de « avant que je meure » au lieu de réorganiser ou d’expliquer le lien syntaxique. Les deux notes sont appelées explicitement dans le texte principal.
