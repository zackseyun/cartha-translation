  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: fr
  text: 'Elle lui répondit : « Tais-toi ! Ne me trompe pas. Mon enfant est perdu[a]. » Chaque jour, elle sortait et se rendait sur la route par laquelle il était parti. Le jour, elle ne mangeait pas de pain, et la nuit, elle ne cessait de pleurer Tobie, son fils, jusqu’à ce que prennent fin les quatorze jours de noces[b] que Ragouël avait juré de lui faire passer là-bas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon enfant a péri. » Le grec peut désigner quelqu’un qui est perdu ou qui a péri ; il exprime ici la conclusion angoissée de la mère, et non une confirmation du narrateur.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les quatorze jours du mariage ». Il s’agit de la période des célébrations nuptiales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Tais-toi !
  rationale: L’impératif abrupt impose le silence; cette formulation est naturelle en français moderne et conserve la force émotionnelle de la réplique.
- source_word: μὴ πλάνα με
  choice: Ne me donne pas de faux espoirs
  rationale: Dans ce contexte, Anne refuse les paroles rassurantes qu’elle tient pour trompeuses. La traduction exprime naturellement cet effet sans imputer nécessairement une tromperie délibérée.
- source_word: ἀπώλετο
  choice: est perdu
  rationale: Le verbe peut évoquer la perte ou la mort. « Est perdu » préserve l’ambiguïté et présente la parole comme la conclusion désespérée de la mère, non comme une confirmation du narrateur.
- source_word: τὸ παιδίον μου
  choice: mon enfant
  rationale: Cette expression conserve la tendresse maternelle et évite de répéter par avance « son fils » dans la suite du verset.
- source_word: καθʼ ἡμέραν
  choice: Chaque jour
  rationale: Équivalent temporel courant et précis.
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: elle sortait sur la route par laquelle il était parti
  rationale: La formulation rend le mouvement répété d’Anne vers l’itinéraire emprunté par Tobie, dans un français lisible.
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: Le jour, elle ne mangeait pas de pain
  rationale: Le concret « pain » est maintenu plutôt que généralisé en « nourriture »; l’imparfait exprime l’action répétée.
- source_word: οὐ διέλιμπανεν θρηνοῦσα
  choice: elle ne cessait de pleurer
  rationale: La tournure restitue l’aspect continu de l’imparfait accompagné du participe, tout en restant naturelle et digne.
- source_word: Τωβείαν τὸν υἱὸν αὐτῆς
  choice: Tobie, son fils
  rationale: Le nom est rendu selon sa forme française traditionnelle, et l’apposition explicite le lien familial comme en grec.
- source_word: συνετελέσθησαν
  choice: prennent fin
  rationale: Cette expression française naturelle indique l’achèvement de la période fixée sans lourdeur passive.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: les quatorze jours de noces
  rationale: Le contexte vise la durée des célébrations nuptiales; « jours de noces » reste proche du grec et intelligible.
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: que Ragouël avait juré de lui faire passer là-bas
  rationale: Le grec est comprimé. La formulation rattache clairement les quatorze jours au séjour que Ragouël avait imposé par serment, sans ajouter un verbe de résidence absent du texte.
theological_decisions:
- issue: Le sort de Tobie dans la plainte de sa mère
  choice: « Mon enfant est perdu » avec une note signalant aussi le sens possible « a péri »
  alternative: « Mon enfant est mort » ou « Mon enfant a péri »
  rationale: Le grec ἀπώλετο laisse ouverte la nuance entre être perdu et avoir péri. Il faut préserver cette ambiguïté et ne pas transformer la crainte de la mère en constat objectif du narrateur.
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent la répétition et la durée du deuil. La réplique initiale demeure brusque, tandis que le reste du verset conserve un rythme sobre. Les deux marqueurs de note [a] et [b] figurent dans le texte.
