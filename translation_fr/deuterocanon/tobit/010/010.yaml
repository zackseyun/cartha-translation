  text: 'Et Tobias dit[a] : « Renvoie-moi auprès de mon père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un présent historique : littéralement, « Tobias dit ». Le français le conserve dans le fil du récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le grec emploie un présent historique, mais le passé simple est naturel dans ce récit français et maintient la progression narrative.
- source_word: Ἐξαπόστειλόν
  choice: Renvoie-moi
  rationale: L’impératif exprime ici l’action de laisser repartir Tobias vers son père. « Renvoie-moi » conserve l’idée d’un départ autorisé et orienté, sans la connotation moderne souvent négative de « congédie-moi ».
- source_word: πρὸς τὸν πατέρα μου
  choice: auprès de mon père
  rationale: πρός avec l’accusatif marque le mouvement vers une personne. « Auprès de mon père » est idiomatique et n’ajoute ni « maison » ni un adverbe tel que « de nouveau ».
- source_word: Τωβείας
  choice: Tobias
  rationale: La forme traditionnelle française « Tobias » distingue ici le fils de Tobit et translittère conventionnellement le nom grec.
