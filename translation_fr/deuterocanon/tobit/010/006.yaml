  text: And Tobit said to her[a], “Be quiet; do not be anxious. Be well.”
translation:
  language: fr
  text: 'Et Tobit lui dit : « Tais-toi, ne t’inquiète pas[a]. Porte-toi bien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « n’aie pas de parole / d’affaire ». Dans ce contexte, l’expression signifie probablement « ne t’inquiète pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Tais-toi
  rationale: L’impératif appelle littéralement au silence. « Tais-toi » conserve sa brièveté et sa force, même si, en français moderne, la formule peut paraître plus abrupte que dans ce contexte d’apaisement.
- source_word: μὴ λόγον ἔχε
  choice: ne t’inquiète pas
  rationale: Littéralement « n’aie pas de parole / d’affaire », la tournure est idiomatique et, dans le contexte, vise l’inquiétude d’Anna. La note conserve la formulation grecque et son ambiguïté lexicale.
- source_word: ὑγίαινε
  choice: Porte-toi bien
  rationale: L’impératif de ὑγιαίνω évoque la santé et le bon état. « Porte-toi bien » garde cette nuance sans réduire l’expression à un simple encouragement psychologique.
- source_word: λέγει αὐτῇ
  choice: lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit littéraire français.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Le nom propre suit la forme française usuelle dans ce livre.
