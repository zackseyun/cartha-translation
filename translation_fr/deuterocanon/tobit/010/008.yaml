  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
translation:
  language: fr
  text: 'Alors Tobie dit à Ragouël : « Laisse-moi partir, car mon père et ma mère n’espèrent plus me revoir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’attendent plus à me revoir ». Le verbe grec peut exprimer aussi bien l’espoir que l’attente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Alors … dit
  rationale: δέ assure ici une transition narrative légère plutôt qu’une opposition ; « Alors » rend naturellement la progression du récit.
- source_word: Τωβείας
  choice: Tobie
  rationale: Forme française traditionnelle et courante du nom grec Τωβείας.
- source_word: τῷ Ῥαγουὴλ
  choice: à Ragouël
  rationale: Le datif désigne le destinataire de la parole ; « Ragouël » est une translittération française claire du nom grec.
- source_word: Ἐξαπόστειλόν με
  choice: Laisse-moi partir
  rationale: L’impératif demande à Ragouël d’autoriser et d’organiser le départ. La formulation française évite la nuance de rejet que pourrait suggérer « Renvoie-moi », tout en conservant la franchise de la demande.
- source_word: ὅτι
  choice: car
  rationale: Introduit directement la raison de la demande dans un registre narratif naturel et digne.
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: mon père et ma mère
  rationale: Conserve la mention explicite des deux parents au lieu de la condenser en « mes parents ».
- source_word: οὐκέτι
  choice: ne … plus
  rationale: Rend précisément la cessation exprimée par οὐκέτι.
- source_word: ἐλπίζουσιν
  choice: n’espèrent plus
  rationale: ἐλπίζω peut exprimer l’espoir ou l’attente. « N’espèrent plus » est naturel dans ce contexte d’angoisse et conserve la dimension affective du verbe.
- source_word: ὄψεσθαί με
  choice: me revoir
  rationale: Bien que le grec dise littéralement « me voir », le contexte implique que ses parents l’ont déjà vu et craignent qu’il ne revienne jamais ; « revoir » est donc l’expression idiomatique française.
