translation:
  language: fr
  text: Ne me soucie-je pas, mon enfant, de t’avoir laissé partir, toi, la lumière de mes yeux ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μέλει μοι
  choice: Cela ne me tient-il pas à cœur
  rationale: L’expression impersonnelle μέλει μοι indique que quelque chose importe profondément à la personne ou la préoccupe. La tournure interrogative conserve la question rhétorique grecque et « tenir à cœur » en rend naturellement la force affective en français.
- source_word: τέκνον
  choice: mon enfant
  rationale: τέκνον est ici un terme familial et affectueux. « Mon enfant » est idiomatique en français et conserve la tendresse sans préciser davantage le sexe.
- source_word: ἀφῆκά σε
  choice: de t’avoir laissé partir
  rationale: Dans ce contexte, ἀφίημι désigne le fait d’avoir permis à quelqu’un de partir. L’infinitif passé exprime l’acte accompli dont les conséquences affectives demeurent présentes.
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: toi, la lumière de mes yeux
  rationale: La traduction conserve la métaphore affectueuse du grec. Le pronom détaché « toi » rattache clairement l’apposition à l’enfant et donne à la phrase un mouvement naturel en français.
