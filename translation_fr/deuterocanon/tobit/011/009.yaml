  text: And Anna ran up and fell on the neck of her son[a], and said to him, “I have seen you, child.”
translation:
  language: fr
  text: 'Et Anne accourut, se jeta au cou de son fils[a] et lui dit : « Je t’ai vu, mon enfant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tomba sur le cou de son fils » ; expression désignant une étreinte pleine d’émotion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμοῦσα
  choice: accourut
  rationale: Le participe de προστρέχω exprime un mouvement rapide vers quelqu’un. « Accourut » restitue avec naturel et vivacité cette course à la rencontre de son fils.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  choice: se jeta au cou
  rationale: Cette expression idiomatique décrit une étreinte pleine d’émotion. « Se jeta au cou » conserve l’image grecque tout en étant idiomatique en français moderne.
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: de son fils
  rationale: υἱός désigne précisément le fils, et non un enfant au sens général.
- source_word: Εἶδόν σε
  choice: Je t’ai vu
  rationale: L’aoriste de ὁράω constate ici avec émotion que la rencontre attendue s’est accomplie. Le passé composé garde cette valeur sans transformer le verbe en « retrouver ».
- source_word: παιδίον
  choice: mon enfant
  rationale: παιδίον est ici une adresse maternelle affectueuse. En français, « mon enfant » rend naturellement cette apostrophe, même si le possessif n’est pas exprimé formellement en grec.
