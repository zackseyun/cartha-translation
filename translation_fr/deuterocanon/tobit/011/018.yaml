  text: And there was joy for all his brothers in Nineveh[a]. And Ahikar came, and Nasbas his cousin[b],
translation:
  language: fr
  text: Et il y eut de la joie pour tous ses frères à Ninive[a]. Ahikar arriva, ainsi que Nasbas, son cousin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses proches » ou « les membres de sa parenté » ; le grec « ses frères » peut désigner plus largement des parents.
    reason: lexical_alternative
  - marker: b
    text: Dans le texte grec, le verset se termine par « ainsi que Nasbas, son cousin, » et la phrase se poursuit directement au verset suivant.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο χαρὰ
  choice: furent dans la joie
  rationale: Cette tournure française naturelle exprime l’apparition d’un état de joie sans alourdir le récit par un calque de « il y eut ».
- source_word: πᾶσι τοῖς ἐν Νινευὴ
  choice: tous … qui se trouvaient à Ninive
  rationale: La formulation conserve la portée exhaustive de πᾶσι et rattache clairement l’indication de lieu aux personnes concernées.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: ses frères
  rationale: Le rendu littéral respecte le masculin pluriel du grec, tout en signalant en note le sens familial plus large que peut prendre ἀδελφοί.
- source_word: παρεγένετο
  choice: arriva
  rationale: Le verbe indique ici la venue ou l’arrivée d’Ahikar dans la scène; « arriva » est précis et idiomatique en français narratif.
- source_word: Ἀχιάχαρος
  choice: Ahikar
  rationale: Cette forme française reconnaissable représente le nom grec sans conserver une translittération excessivement hellénisée.
- source_word: Νασβὰς
  choice: Nasbas
  rationale: La forme suit directement le texte grec de Swete, malgré les variantes du nom dans les autres témoins de Tobit.
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: son cousin
  rationale: ἐξάδελφος désigne précisément un cousin; il n’est donc pas nécessaire de généraliser en « parent ».
theological_decisions:
- issue: Portée de ἀδελφοῖς αὐτοῦ
  choice: ses frères
  alternative: ses proches ou les membres de sa parenté
  rationale: Le grec dit littéralement « ses frères », mais le terme peut avoir un sens de parenté plus large. Le texte principal conserve la forme explicite de la source et la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, simple et digne. La coordination « ainsi que » rend naturelle l’arrivée conjointe des deux personnages, tandis que la virgule finale et la note maintiennent la continuité syntaxique du texte grec avec le verset suivant.
