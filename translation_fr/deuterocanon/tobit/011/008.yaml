  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: fr
  text: Enduis-lui les yeux de bile[a]. Quand elle le piquera[b], il les frottera et fera tomber les voiles blanchâtres[c] ; alors il te verra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de fiel ». Le mot grec désigne la bile, employée ici comme substance médicinale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « quand il aura été mordu » ; le grec emploie une image vive pour la sensation de piqûre ou de brûlure dans les yeux.'
    reason: lexical_alternative
  - marker: c
    text: Ou « les taches blanches » ou « les plaques blanchâtres ». Le terme désigne des opacités de l’œil, sans correspondre nécessairement au diagnostic moderne de la cataracte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: Enduis-lui
  rationale: L’impératif de ἐγχρίω demande d’appliquer une substance en l’étalant ou en frottant. « Enduis-lui les yeux » est direct, naturel en français et plus précis ici que le religieux « oins ».
- source_word: χολὴν
  choice: bile
  rationale: χολή désigne la bile ou le fiel. « Bile » exprime clairement, en français moderne, la substance animale employée ici comme remède.
- source_word: δηχθεὶς
  choice: Quand elle le piquera
  rationale: Le participe évoque littéralement le fait d’être mordu, donc une sensation vive de piqûre ou de brûlure. La formulation française garde cette image corporelle sans devenir obscure.
- source_word: διατρίψει
  choice: il les frottera
  rationale: Le verbe indique un frottement appuyé ou prolongé. Le pronom « les » reprend naturellement « les yeux », objet implicite en grec.
- source_word: ἀποβαλεῖται
  choice: fera tomber
  rationale: Le futur moyen présente le père comme se débarrassant des opacités par le frottement. « Fera tomber » conserve son rôle actif sans imposer un vocabulaire médical moderne.
- source_word: τὰ λευκώματα
  choice: les pellicules blanches
  rationale: Le terme désigne des formations ou opacités blanchâtres de l’œil. « Pellicules blanches » reste concret et compréhensible, sans diagnostiquer précisément des cataractes.
- source_word: ὄψεταί σε
  choice: il te verra
  rationale: Le grec affirme simplement qu’il verra son interlocuteur. La traduction n’ajoute pas explicitement qu’il « retrouvera la vue », même si le contexte l’implique.
