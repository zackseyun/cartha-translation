  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: fut célébré
  rationale: L’aoriste passif de ἄγω désigne ici la tenue ou la célébration d’un événement. « Fut célébré » restitue naturellement en français la valeur passive et festive de l’expression.
- source_word: ὁ γάμος
  choice: le mariage
  rationale: γάμος peut désigner le mariage, les noces ou la fête nuptiale. La durée de sept jours et la mention de la joie orientent vers la célébration nuptiale; en français, « le mariage fut célébré » exprime ce sens sans surcharge.
- source_word: Τωβεία
  choice: de Tobie
  rationale: Le génitif du nom propre marque l’appartenance. « Tobie » est la forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: μετʼ εὐφροσύνης
  choice: dans la joie
  rationale: La préposition μετά avec le génitif exprime l’accompagnement. « Dans la joie » rend le caractère joyeux et festif dans un français naturel et digne.
- source_word: ἑπτὰ ἡμέρας
  choice: pendant sept jours
  rationale: L’accusatif indique la durée. « Pendant sept jours » en explicite clairement la valeur temporelle.
