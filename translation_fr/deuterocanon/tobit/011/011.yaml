  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάβετο
  choice: saisit
  rationale: Le moyen de ἐπιλαμβάνομαι signifie ici prendre ou saisir quelqu’un. « Saisit » conserve l’action physique concrète sans préciser indûment s’il le soutient ou l’étreint.
- source_word: προσέπασεν
  choice: appliqua
  rationale: Le verbe désigne l’action de mettre ou d’étendre une substance sur une surface. « Appliqua » convient naturellement à l’emploi médicinal du remède.
- source_word: χολήν
  choice: fiel
  rationale: χολή désigne la bile ou le fiel. « Fiel » conserve le terme traditionnel et le registre narratif du remède tiré du poisson, tandis que « bile » serait plus clinique.
- source_word: ὀφθαλμούς
  choice: yeux
  rationale: Équivalent français courant et exact de ὀφθαλμοί dans ce contexte.
- source_word: λέγων
  choice: en disant
  rationale: Cette tournure restitue le participe présent grec et maintient la phrase ouverte sur les paroles qui suivent.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition grecque de « son père » est allégée par « lui » afin d’éviter une lourdeur sans perdre le référent. Le deux-points signale que les paroles suivent au verset suivant.
