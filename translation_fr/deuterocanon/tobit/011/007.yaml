  text: And Raphael said[a], “I know that your father will open his eyes.”
translation:
  language: fr
  text: 'Et Raphaël dit[a] : « Je sais que ton père ouvrira les yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton père retrouvera la vue ». Le grec dit littéralement : « ouvrira les yeux », expression qui désigne ici le rétablissement de la vue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίσταμαι
  choice: Je sais
  rationale: Le verbe exprime ici une connaissance assurée. « Je sais » est direct, naturel et ne renforce pas indûment le degré de certitude.
- source_word: ἀνοίξει
  choice: ouvrira
  rationale: Le futur actif a pour sujet « ton père ». La traduction conserve donc la construction active du grec plutôt que de la transformer en passif.
- source_word: τοὺς ὀφθαλμούς
  choice: les yeux
  rationale: En français, dans la locution « ouvrir les yeux », l’article défini est idiomatique lorsque le possesseur est déjà le sujet de la phrase.
- source_word: ὁ πατήρ σου
  choice: ton père
  rationale: Cette expression désigne sans ambiguïté le père de l’interlocuteur ; le tutoiement convient au dialogue entre les personnages.
- source_word: Ῥαφαήλ
  choice: Raphaël
  rationale: « Raphaël » est la forme française traditionnelle et courante de ce nom.
theological_decisions:
- issue: Expression idiomatique de la guérison de la cécité
  choice: Conserver « ton père ouvrira les yeux » dans le texte principal
  alternative: ton père retrouvera la vue ; les yeux de ton père s’ouvriront
  rationale: Le grec emploie une construction active qui signifie en contexte le rétablissement de la vue. La formulation littérale préserve à la fois cette construction et l’effet narratif, tandis que la note explicite le sens contextuel.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple « dit » convient à la narration biblique écrite sans être archaïque ; le discours direct reste naturel et accessible.
