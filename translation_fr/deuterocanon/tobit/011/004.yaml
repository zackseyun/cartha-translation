  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
translation:
  language: fr
  text: Mais prends dans ta main le fiel du poisson[a]. Ils poursuivirent leur route, et le chien les suivit derrière eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bile du poisson ». Le grec χολή peut désigner le fiel ou la bile.
    reason: lexical_alternative
  - marker: b
    text: La tradition parallèle de forme sémitique présente ici un récit beaucoup plus développé, centré sur l’application du fiel du poisson aux yeux du père de Tobie. Le texte principal suit la formulation grecque plus courte.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: prends
  rationale: L’impératif aoriste de λαμβάνω exprime ici un ordre direct; « prends » est le rendu français le plus naturel.
- source_word: παρὰ χεῖρα
  choice: en main
  rationale: Dans ce contexte, l’expression indique que Tobie doit prendre ou garder la substance à portée de main; « prends en main » rend concrètement l’instruction sans suggérer qu’il faut conduire quelqu’un par la main.
- source_word: χολὴν τοῦ ἰχθύος
  choice: le fiel du poisson
  rationale: χολή peut désigner le fiel ou la bile. « Le fiel du poisson » conserve le terme traditionnel et convient à la substance tirée du poisson dans ce récit, tandis qu’une note signale l’autre rendu possible.
- source_word: ἐπορεύθησαν
  choice: ils poursuivirent leur route
  rationale: Le verbe décrit leur déplacement dans la suite du voyage. Cette formulation française naturelle exprime la continuation sans ajouter de détail absent du grec.
- source_word: συνῆλθεν
  choice: les accompagna
  rationale: συνέρχομαι évoque ici le fait d’aller avec eux. « Les accompagna » préserve mieux cette nuance que le simple verbe « suivre ».
- source_word: ὁ κύων
  choice: le chien
  rationale: L’article désigne le chien déjà connu dans le récit.
- source_word: ὀπίσωθεν αὐτῶν
  choice: en restant derrière eux
  rationale: Cette expression rend explicitement la position du chien derrière les voyageurs tout en s’intégrant naturellement au verbe « accompagna ».
