base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: fr
  text: Tobit sortit à la rencontre de sa belle-fille[a], dans la joie et en bénissant Dieu, à la porte de Ninive. Ceux qui le voyaient marcher s’étonnaient[b], parce qu’il voyait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner une « jeune mariée » ou une « belle-fille ». Ici, il s’agit de Sara, l’épouse du fils de Tobit.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec porte ici le nom Tōbeias, forme qui peut évoquer Tobias. Cependant, le contexte désigne le père, Tobit : les témoins s’étonnent qu’il voie.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Aoriste narratif simple exprimant le fait de sortir pour aller à la rencontre de quelqu’un.
- source_word: Τωβείας
  choice: Tobit
  rationale: Malgré la forme grecque Tōbeias, le contexte désigne le père guéri, puisque les témoins s’étonnent de le voir désormais capable de voir.
- source_word: εἰς συνάντησιν
  choice: à la rencontre de
  rationale: Expression française naturelle correspondant à l’idée d’aller accueillir quelqu’un.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: sa belle-fille
  rationale: νύμφη peut signifier « jeune mariée » ou « belle-fille » ; ici, Sara est l’épouse de son fils et donc sa belle-fille.
- source_word: χαίρων καὶ εὐλογῶν τὸν θεόν
  choice: tout joyeux et bénissant Dieu
  rationale: Cette formulation conserve les deux participes et rend à la fois l’état de joie et l’action de bénir Dieu.
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: près de la porte de Ninive
  rationale: πρός avec le datif situe la scène à proximité de la porte ; « près de » conserve cette nuance spatiale.
- source_word: ἐθαύμαζον
  choice: étaient dans l’étonnement
  rationale: L’imparfait grec décrit la réaction prolongée des témoins ; cette expression est claire et digne en français moderne.
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: ceux qui le voyaient marcher
  rationale: Rend directement la construction participiale décrivant les personnes qui l’observent pendant qu’il se déplace.
- source_word: ὅτι ἔβλεψεν
  choice: parce qu’il voyait
  rationale: Rendu proche du grec, sans expliciter davantage le rétablissement de la vue, que le contexte narratif permet de comprendre.
theological_decisions:
- issue: Identification du personnage désigné par Τωβείας
  choice: Tobit, le père guéri
  alternative: Tobias, le fils
  rationale: La forme grecque du nom pourrait être comprise comme Tobias, mais la remarque finale sur sa capacité à voir désigne naturellement Tobit, précédemment aveugle. Une note signale la difficulté textuelle sans brouiller le récit.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative demeure proche du grec, tout en évitant les tournures archaïques. Les notes préservent l’ambiguïté lexicale de νύμφη et la difficulté liée à la forme du nom propre.
