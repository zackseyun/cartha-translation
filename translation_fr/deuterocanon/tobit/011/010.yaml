  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: fr
  text: « Désormais, je peux mourir[a]. » Et tous les deux pleurèrent. Puis Tobit sortit en direction de la porte et trébucha, mais son fils accourut vers lui,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Désormais, je mourrai. » Cette manière de parler exprime qu’un profond désir est maintenant comblé et que la personne est prête à mourir en paix.'
    reason: alternative lexicale et explicitation de l’idiome
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: Désormais
  rationale: Cette expression temporelle signifie « à partir de maintenant ». « Désormais » est naturel et concis dans cette déclaration émotive.
- source_word: ἀποθανοῦμαι
  choice: je peux mourir
  rationale: La forme grecque est un futur, littéralement « je mourrai », mais le contexte de retrouvailles indique une disponibilité à mourir en paix après l’accomplissement d’un profond désir, plutôt qu’une prédiction de mort imminente.
- source_word: ἔκλαυσαν
  choice: pleurèrent
  rationale: Rend directement l’aoriste de κλαίω dans un registre narratif digne et courant.
- source_word: ἀμφότεροι
  choice: tous les deux
  rationale: Exprime explicitement que les deux personnes concernées pleurent.
- source_word: ἐξήρχετο
  choice: sortit
  rationale: L’imparfait grec décrit le mouvement en cours; le passé simple convient au déroulement narratif français sans alourdir la phrase.
- source_word: πρὸς τὴν θύραν
  choice: en direction de la porte
  rationale: Préserve la valeur directionnelle de πρός avec l’accusatif.
- source_word: προσεκόπτεν
  choice: trébucha
  rationale: προσκόπτω signifie heurter un obstacle ou trébucher; ce choix est clair et naturel dans le contexte de la cécité de Tobit.
- source_word: προσέδραμεν αὐτῷ
  choice: accourut vers lui
  rationale: Exprime le mouvement rapide vers Tobit indiqué par le verbe grec, tout en conservant la direction explicite.
theological_decisions:
- issue: Valeur de la déclaration ἀποθανοῦμαι
  choice: « je peux mourir »
  alternative: « je mourrai » ou « que je meure maintenant »
  rationale: Le futur grec demeure signalé en note, tandis que le texte principal rend l’usage idiomatique lié à un désir désormais comblé. Il ne faut pas transformer cette parole émotive en annonce certaine d’une mort imminente.
- issue: Continuité du sujet narratif
  choice: Tobit est celui qui sort et trébuche
  alternative: Les recensions plus longues présentent différemment certains détails du contexte immédiat.
  rationale: La traduction suit ici le texte grec fourni de Swete, où Τωβεὶτ est explicitement le sujet de ἐξήρχετο et de προσεκόπτεν.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique sans archaïsme marqué. La virgule finale est conservée parce que le verset se poursuit syntaxiquement dans le suivant.
