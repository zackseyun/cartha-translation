  text: And she noticed him coming and said to his father[a], “Look, my son is coming, and the man who went with him.”
translation:
  language: fr
  text: 'Elle l’aperçut qui arrivait et dit à son père : « Regarde, mon fils arrive, et l’homme qui a voyagé avec lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προενόησεν
  choice: aperçut
  rationale: Dans ce contexte visuel, le verbe indique qu’elle le distingue alors qu’il arrive. « Aperçut » reste proche de l’acte de perception sans imposer explicitement l’idée plus précise de reconnaissance.
- source_word: ἐρχόμενον
  choice: qui arrivait
  rationale: Le participe présent décrit le fils en train de venir vers eux ; « qui arrivait » est naturel dans le récit français.
- source_word: Ἰδοὺ
  choice: Regarde
  rationale: L’impératif restitue l’exclamation déictique et son immédiateté en français moderne.
- source_word: ὁ υἱός μου
  choice: mon fils
  rationale: Traduction directe du groupe nominal possessif.
- source_word: ὁ ἄνθρωπος
  choice: l’homme
  rationale: Le grec emploie explicitement le nom générique « homme », plutôt qu’un terme relationnel comme « compagnon ».
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: qui est parti avec lui
  rationale: Le participe aoriste renvoie au départ antérieur en voyage ; cette formulation conserve cette perspective rétrospective.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: à son père
  rationale: Le référent naturel du possessif est le fils aperçu, conformément à la syntaxe et à la scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Aperçut » préserve la nuance perceptive de προενόησεν sans transformer avec certitude la perception en reconnaissance. La coordination « ainsi que » rend clairement visible le second voyageur tout en évitant une phrase artificiellement elliptique.
