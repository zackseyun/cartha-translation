base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: fr
  text: 'Raphaël dit à Tobie : « Ne sais-tu pas, mon frère, dans quel état tu as laissé ton père ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: Ne sais-tu pas
  rationale: Cette traduction conserve le sens courant de γινώσκω et la forme de la question rhétorique, tout en laissant possible une nuance de rappel ou de prise de conscience.
- source_word: ἀδελφέ
  choice: mon frère
  rationale: Le vocatif exprime ici une adresse chaleureuse. « Mon frère » est idiomatique en français et préserve l’image fraternelle sans supposer nécessairement un lien biologique.
- source_word: πῶς ἀφῆκες
  choice: dans quel état tu as laissé
  rationale: Dans ce contexte, πῶς porte vraisemblablement sur la condition du père au moment du départ. Le français littéral « comment tu as laissé » serait ambigu et pourrait suggérer la manière de prendre congé; « dans quel état » rend naturellement l’implication du grec sans préciser explicitement la cécité.
- source_word: τὸν πατέρα σου
  choice: ton père
  rationale: Équivalent direct et naturel du groupe nominal grec.
theological_decisions:
- issue: Rapport entre le texte grec bref et la tradition sémitique parallèle
  choice: Conserver la question concise du grec, en exprimant seulement que πῶς vise l’état du père.
  alternative: « Tu sais que ton père est aveugle… »
  rationale: Le grec de référence n’explicite ni la cécité ni la guérison à venir. La tradition parallèle éclaire l’implicite, mais son développement ne doit pas être introduit dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation « dans quel état » évite le calque peu idiomatique « comment tu as laissé ton père » tout en préservant l’implicite et la tension du texte grec.
