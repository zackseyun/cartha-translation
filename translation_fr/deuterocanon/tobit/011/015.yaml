  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: fr
  text: car tu m’as frappé[a] et tu as eu compassion de moi. Voici, je vois Tobie, mon fils ! Son fils entra tout joyeux et raconta à son père les grandes choses qui lui étaient arrivées en Médie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu m’as flagellé » ou « tu m’as durement affligé » ; le verbe grec peut évoquer des coups violents, une flagellation ou, plus largement, un châtiment douloureux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: tu m’as frappé
  rationale: Le verbe μαστιγόω évoque littéralement l’action de fouetter ou de flageller, mais peut désigner plus largement une dure affliction. « Tu m’as frappé » conserve l’attribution directe de l’épreuve à Dieu sans imposer l’image d’une flagellation littérale.
- source_word: ἠλέησάς με
  choice: tu as eu compassion de moi
  rationale: Rend naturellement ἐλεέω et maintient le contraste explicite entre la souffrance infligée et la compassion reçue.
- source_word: ἰδοὺ
  choice: Voici
  rationale: Interjection déictique vive et digne, adaptée à la découverte immédiate rendue possible par le retour de la vue.
- source_word: βλέπω
  choice: je vois
  rationale: Traduction directe qui exprime à la fois le rétablissement de la vue et la reconnaissance du fils.
- source_word: χαίρων
  choice: dans la joie
  rationale: Restitue l’état exprimé par le participe tout en donnant une tournure française naturelle.
- source_word: ἀπήγγειλεν
  choice: raconta
  rationale: Le verbe signifie transmettre un récit ou un rapport. « Raconta » convient au contexte familial et narratif.
- source_word: τὰ μεγάλα
  choice: les grandes choses
  rationale: Cette formulation laisse ouverte la nature exacte de ces événements remarquables, sans les définir explicitement comme des actes divins.
- source_word: τὰ γενόμενα αὐτῷ
  choice: qui lui étaient arrivées
  rationale: Expression française naturelle qui conserve la référence aux événements vécus par Tobie.
- source_word: ἐν τῇ Μηδείᾳ
  choice: en Médie
  rationale: Désignation française standard de la région antique appelée Μηδεία.
theological_decisions:
- issue: Action divine dans la souffrance et dans la compassion
  choice: 'Conserver l’adresse directe à Dieu : « tu m’as frappé et tu as eu compassion de moi »'
  alternative: « tu m’as éprouvé et tu as eu compassion de moi »
  rationale: Le grec attribue directement à Dieu aussi bien le coup ou l’affliction que la compassion. La traduction maintient cette tension théologique au lieu d’atténuer la première affirmation.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici » conserve la vivacité de l’exclamation sans archaïsme marqué. Le nom Τωβείαν est rendu par la forme française traditionnelle « Tobie ».
