revisions:
- from: Après cela, Tobie poursuivit sa route en bénissant Dieu, parce qu’il avait fait réussir son voyage[a]. Il ne cessait aussi de bénir Ragouël et Edna, sa femme. Il poursuivit sa route jusqu’à ce qu’ils approchent de Ninive[b].
  to: Après cela, Tobie aussi poursuivit sa route, bénissant Dieu parce que Dieu avait fait réussir son voyage[a], et il continuait à bénir Ragouël et Edna, sa femme. Il poursuivit sa route jusqu’à ce qu’ils approchent de Ninive[b].
  rationale: La révision explicite Dieu comme sujet de l’action de faire réussir le voyage, tout en conservant le sens idiomatique du grec. Elle rend « aussi » à Tobie, où l’ajout est le plus naturel, et conserve l’imparfait de κατευλόγει par « continuait à bénir ». La formulation finale maintient volontairement le singulier de « Il poursuivit » et le pluriel de « ils approchent », conformément au texte grec difficile, avec une note qui en préserve l’incertitude.
  reviewer_model: gpt-5.6-terra
