base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: fr
  text: Après cela, Tobie aussi poursuivit sa route, bénissant Dieu parce que Dieu avait fait réussir son voyage[a], et il continuait à bénir Ragouël et Edna, sa femme. Il poursuivit sa route jusqu’à ce qu’ils approchent de Ninive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce qu’il avait rendu sa route prospère », expression signifiant que Dieu avait accordé la réussite à son voyage.'
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase est difficile en grec. Elle signifie probablement « jusqu’à ce qu’ils approchent de Ninive » ; on pourrait aussi comprendre « jusqu’à ce qu’il approche de Ninive ».
    reason: textual_uncertainty
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français moderne; le singulier collectif rend ici sans lourdeur le pluriel grec littéral «après ces choses».
- source_word: ἐπορεύετο
  choice: poursuivit sa route
  rationale: L’imparfait grec décrit un déplacement en cours. Cette formulation conserve l’idée de continuité et convient aux deux occurrences.
- source_word: εὐλογῶν τὸν θεόν
  choice: en bénissant Dieu
  rationale: «Bénir» garde le sens direct du verbe grec et son registre biblique, sans le réduire à «louer».
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: parce qu’il avait fait réussir son voyage
  rationale: Le grec emploie un idiome signifiant littéralement que Dieu a rendu sa route prospère; cette expression française en communique clairement le sens et la causalité divine.
- source_word: κατευλόγει
  choice: Il ne cessait aussi de bénir
  rationale: Cette tournure rend la valeur durative ou répétée de l’imparfait et la force du composé verbal.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Ragouël et Edna, sa femme
  rationale: L’apposition grecque identifie naturellement Edna comme la femme de Ragouël. La ponctuation française clarifie ce lien.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: jusqu’à ce qu’ils approchent de Ninive
  rationale: La proposition transmise est syntaxiquement difficile, mais le verbe pluriel ἤγγισαν est conservé. Le contexte du voyage indique vraisemblablement l’approche de Ninive.
theological_decisions:
- issue: Traduction de θεός
  choice: Dieu
  alternative: le dieu
  rationale: Dans ce récit, le terme désigne le Dieu d’Israël; la majuscule est donc l’usage français normal, sans ajout doctrinal.
- issue: Sujet et sens de la proposition difficile ἤγγισαν αὐτὸν εἰς Νινευή
  choice: Il poursuivit sa route jusqu’à ce qu’ils approchent de Ninive.
  alternative: 'Il poursuivit sa route jusqu’à ce qu’il approche de Ninive; ou: jusqu’à ce qu’ils s’approchent de lui à Ninive.'
  rationale: Le premier verbe est singulier, tandis que ἤγγισαν est pluriel et que αὐτόν rend la syntaxe irrégulière. Le texte principal respecte ce changement de nombre et retient le sens de déplacement le mieux appuyé par le contexte, tandis que la note signale l’incertitude.
translation_notes:
  register: 'Français international moderne, naturel et digne, avec un léger registre biblique dans «bénir Dieu». Les noms sont rendus selon des formes françaises courantes: Tobie, Ragouël, Edna et Ninive. Les marqueurs [a] et [b] figurent dans le texte principal.'
