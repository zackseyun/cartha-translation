lexical_decisions:
- source_word: ἐλεπίσθη
  choice: se détachèrent
  rationale: Le verbe évoque une matière qui se détache comme une pellicule ou des écailles. « Se détachèrent » est naturel en français et conserve l’image physique sans préciser un mécanisme médical.
- source_word: κανθῶν
  choice: coins
  rationale: Dans ce contexte anatomique, le terme désigne les angles ou coins des yeux. « Coins » est clair et courant.
- source_word: ὀφθαλμῶν
  choice: yeux
  rationale: Équivalent français usuel du terme anatomique grec.
- source_word: λευκώματα
  choice: pellicules blanches
  rationale: Le nom désigne des opacités blanchâtres des yeux. « Pellicules blanches » rend leur aspect visible et s’accorde avec l’idée qu’elles se détachent.
- source_word: ἰδών
  choice: Quand il vit
  rationale: Le participe a ici une valeur temporelle, rendue naturellement par une proposition introduite par « quand ».
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: il se jeta à son cou
  rationale: Cette expression conventionnelle décrit une étreinte pleine d’émotion. La tournure française conserve l’image du cou tout en étant idiomatique.
