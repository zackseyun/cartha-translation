base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/003.yaml
  text: Let us run on ahead of your wife and prepare the house[a].
translation:
  language: fr
  text: Courons devant ta femme et préparons la maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « ta femme ». Le contexte plus large du récit pourrait conduire à attendre la mention d’un autre membre de la famille, mais la traduction suit ici le texte grec conservé.
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: Courons devant
  rationale: 'L’aoriste subjonctif a ici une valeur exhortative : « courons en avant ». « Courons » conserve le mouvement vif exprimé par le verbe grec.'
- source_word: ἔμπροσθεν
  choice: devant
  rationale: L’adverbe indique que les sujets doivent prendre de l’avance. En français, « courir devant » rend simplement cette idée avec le verbe de mouvement.
- source_word: τῆς γυναικός σου
  choice: ta femme
  rationale: Dans cette relation exprimée avec le possessif σου, γυνή désigne l’épouse. Le texte grec conservé porte bien « ta femme ».
- source_word: ἑτοιμάσωμεν
  choice: préparons
  rationale: Ce second subjonctif exhortatif est parallèle au premier. « Préparons » est direct, naturel et adapté au registre narratif.
- source_word: τὴν οἰκίαν
  choice: la maison
  rationale: οἰκία peut désigner la maison ou la maisonnée ; puisqu’il s’agit de préparer le lieu avant une arrivée, le bâtiment est ici le sens le plus probable.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’exhortation vive du grec est conservée par deux impératifs à la première personne du pluriel. Le tutoiement correspond au singulier σου.
