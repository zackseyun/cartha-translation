    issue: « Puis » est légèrement interprétatif.
    rationale: Le grec καὶ ὡς introduit simplement la scène et sa circonstance temporelle ; « Puis » souligne une succession que le texte ne formule pas explicitement.
  - severity: low
    issue: Tournure « de ce que » lourde.
    rationale: Elle est compréhensible, mais « parce que » est plus naturel en français moderne tout en conservant le lien causal introduit par ὅτι.
