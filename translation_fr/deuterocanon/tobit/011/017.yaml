revisions:
- from: 'Tobit rendait grâce devant eux de ce que Dieu leur avait fait miséricorde. Puis, lorsqu’il s’approcha de Sara, sa belle-fille, il la bénit en disant : « Puisses-tu arriver en bonne santé, ma fille ! Béni soit Dieu, qui t’a conduite jusqu’à nous, et ton père et ta mère[a]. »'
  to: 'Tobit rendait grâce devant eux parce que Dieu leur avait fait miséricorde. Et lorsque Tobit s’approcha de Sara, sa belle-fille, il la bénit en disant : « Puisses-tu arriver en bonne santé, ma fille ! Béni soit Dieu, qui t’a conduite jusqu’à nous, et ton père et ta mère[a]. »'
  rationale: 'Révision limitée à l’enchaînement narratif et à la fluidité syntaxique : « Et lorsque » rend plus exactement καὶ ὡς, et « parce que » modernise la construction causale. La phrase finale demeure volontairement elliptique, avec une note qui signale l’ambiguïté du témoin grec.'
