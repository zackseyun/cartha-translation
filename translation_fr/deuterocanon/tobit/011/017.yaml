  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: fr
  text: 'Tobit rendait grâce devant eux parce que Dieu leur avait fait miséricorde. Et lorsque Tobit s’approcha de Sara, sa belle-fille, il la bénit en disant : « Puisses-tu arriver en bonne santé, ma fille ! Béni soit Dieu, qui t’a conduite jusqu’à nous, et ton père et ta mère[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec s’achève brusquement par « et ton père et ta mère ». On peut comprendre qu’une suite est sous-entendue, par exemple « et bénis soient ton père et ta mère », mais ce verbe ne figure pas dans ce témoin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: rendait grâce
  rationale: Dans ce contexte, le verbe exprime la reconnaissance publique de l’action miséricordieuse de Dieu, et non la confession d’une faute.
- source_word: ἠλέησεν αὐτοὺς
  choice: leur avait fait miséricorde
  rationale: Cette formulation conserve le poids religieux de ἐλεέω et l’antériorité de l’action divine par rapport à l’action de grâce de Tobit.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: sa belle-fille
  rationale: νύμφη peut désigner une jeune épouse ou une belle-fille ; ici, Sara est l’épouse du fils de Tobit, donc « belle-fille » exprime précisément la relation envisagée.
- source_word: κατευλόγησεν
  choice: il la bénit
  rationale: Le verbe composé peut avoir une nuance intensive, mais le français naturel « bénir » suffit sans surtraduction.
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: Puisses-tu arriver en bonne santé
  rationale: L’optatif exprime un souhait ou une bénédiction ; la traduction conserve à la fois l’idée d’arrivée et celle de bonne santé.
- source_word: θύγατερ
  choice: ma fille
  rationale: Le français emploie naturellement le possessif dans cette interpellation familiale affectueuse, bien qu’il ne soit pas explicitement exprimé en grec.
- source_word: εὐλογητὸς ὁ θεός
  choice: Béni soit Dieu
  rationale: Formule française naturelle de bénédiction, fidèle au prédicat grec εὐλογητός.
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: qui t’a conduite jusqu’à nous
  rationale: Le féminin est requis par le référent Sara ; « jusqu’à nous » rend le mouvement vers la famille et son résultat présent.
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: et ton père et ta mère
  rationale: La traduction maintient la formulation abrupte du témoin grec sans ajouter un verbe absent du texte.
theological_decisions:
- issue: Sens de ἐξωμολογεῖτο à propos de l’action de Dieu
  choice: action de grâce publique
  alternative: confession
  rationale: La proposition introduite par ὅτι porte sur la miséricorde accordée par Dieu ; elle indique une reconnaissance pleine de gratitude, non un aveu de faute.
- issue: Syntaxe de la formule finale
  choice: conserver littéralement « et ton père et ta mère »
  alternative: expliciter « et bénis soient ton père et ta mère »
  rationale: Le témoin grec ne répète aucun verbe après la mention de Dieu. L’ajout d’une bénédiction explicite résoudrait une ambiguïté que le texte transmis laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « rendait grâce » suit l’aspect du grec, tandis que « Puis » assure un enchaînement narratif naturel. La tournure optative « Puisses-tu » conserve la valeur de souhait de la bénédiction.
