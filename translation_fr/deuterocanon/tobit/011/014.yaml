  yaml_path: translation/deuterocanon/tobit/011/014.yaml
  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: fr
  text: 'Elle pleura et dit : « Tu es béni, ô Dieu, ton nom est béni pour toujours[a], et tous tes saints anges sont bénis ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « pour les âges » ; cette expression signifie ici « pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: elle pleura
  rationale: Le verbe signifie « pleurer ». Sa forme grecque ne marque pas le genre, mais le contexte narratif identifie Anna comme sujet.
- source_word: Εὐλογητὸς εἶ
  choice: tu es béni
  rationale: Cette formulation conserve le caractère déclaratif de la bénédiction adressée directement à Dieu, sans lui donner artificiellement la valeur d’un souhait.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Dans cette formule de bénédiction, le groupe nominal désigne la personne directement invoquée ; « ô Dieu » rend naturellement cette adresse solennelle.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: Expression biblique usuelle qui évoque l’identité révélée et l’honneur de Dieu, sans nécessiter d’explicitation.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: L’expression idiomatique grecque, littéralement « pour les âges », exprime ici la perpétuité.
- source_word: εὐλογημένοι
  choice: sont bénis
  rationale: L’adjectif poursuit la série de déclarations introduite par « tu es béni » ; une tournure optative comme « soient bénis » serait possible en français, mais moins proche de la syntaxe grecque.
- source_word: πάντες οἱ ἅγιοι ἄγγελοί σου
  choice: tous tes saints anges
  rationale: ἅγιοι qualifie directement ἄγγελοι ; « saints anges » respecte cette relation syntaxique et le registre biblique.
theological_decisions:
- issue: Formule doxologique adressée à Dieu
  choice: 'Conserver le vocabulaire de la bénédiction : « tu es béni »'
  alternative: « Tu es loué » ou « loué sois-tu »
  rationale: La répétition de formes issues de εὐλογητός structure la doxologie. Le français « béni » maintient ce lien lexical et théologique sans remplacer la bénédiction par une simple formulation de louange.
translation_notes:
  register: Français moderne, clair et digne, avec une tonalité de prière. La formulation déclarative « tu es béni » évite l’ambiguïté modale de « béni sois-tu », tandis que « ô Dieu » et « saints anges » préservent l’élévation du passage.
