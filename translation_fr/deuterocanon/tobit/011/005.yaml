lexical_decisions:
- source_word: ἐκάθητο
  choice: était assise
  rationale: L’imparfait de κάθημαι décrit une posture qui se prolonge; « était assise » restitue naturellement cet aspect en français.
- source_word: περιβλεπομένη
  choice: guettant
  rationale: Le participe exprime un regard attentif et scrutateur. « Guettant » convient à l’attente vigilante d’Anne sans imposer une nuance d’inquiétude.
- source_word: εἰς τὴν ὁδόν
  choice: sur la route
  rationale: ὁδός désigne ici la route par laquelle son fils doit revenir. Avec « guetter », « sur la route » indique naturellement la direction de son regard.
- source_word: τὸν παῖδα αὐτῆς
  choice: le retour de son fils
  rationale: παῖς désigne ici son fils, Tobie. La construction grecque est elliptique; l’ajout de « le retour de » explicite en français ce qu’Anne guette, sans modifier le sens contextuel.
