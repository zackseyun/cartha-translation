  text: And Anna sat watching the road for her son,[a]
translation:
  language: fr
  text: Anne était assise, guettant la route dans l’attente de son fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « regardant attentivement vers la route, son fils »; la construction est condensée et signifie qu’elle guettait la route dans l’attente de son fils.'
