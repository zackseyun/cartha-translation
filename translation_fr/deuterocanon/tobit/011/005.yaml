review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : ἐκάθητο est bien rendu par l’imparfait « était assise », περιβλεπομένη exprime une observation attentive, et παῖς désigne ici son fils. Toutefois, « sur la route » peut en français situer Anne physiquement sur la route, alors que εἰς τὴν ὁδόν indique la direction de son regard. L’explicitation « le retour de » est contextuellement juste, mais « dans l’attente de son fils » rend plus directement l’ellipse grecque sans ajouter inutilement un objet nominal absent du texte.'
  naturalness: « Anne était assise, guettant la route dans l’attente de son fils » est idiomatique, narratif et clair en français moderne. Il évite l’ambiguïté locative de « guettant sur la route ».
  terminology: « Anne » est la forme française usuelle du nom. « Fils » convient à παῖς dans ce contexte. « Guettant » restitue de manière naturelle la vigilance de περιβλεπομένη sans imposer une interprétation psychologique.
