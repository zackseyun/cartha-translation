  text: Take courage[a], father. Then, when they had come together, he rubbed his eyes[b],
translation:
  language: fr
  text: « Courage[a], mon père ! » Puis, lorsqu’ils se retrouvèrent[b], il lui frotta les yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « Prends courage, père. » Le français emploie naturellement « mon père » dans cette adresse filiale. On pourrait aussi traduire : « Aie courage, mon père. »'
