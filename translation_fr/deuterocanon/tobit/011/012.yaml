lexical_decisions:
- source_word: Θάρσει
  choice: Courage
  rationale: L’impératif exprime ici l’encouragement et la réassurance. « Courage ! » est naturel en français moderne tout en conservant la force de l’exhortation.
- source_word: πάτερ
  choice: père
  rationale: Le vocatif grec ne comporte pas de possessif explicite. « Père » maintient cette forme d’adresse directe sans ajouter « mon ».
- source_word: ὡς δὲ
  choice: Puis, quand
  rationale: Cette articulation introduit l’action suivante avec une valeur temporelle et narrative.
- source_word: συνεδήχθησαν
  choice: ils se furent rejoints
  rationale: Cette formulation rend l’idée qu’ils se sont retrouvés ensemble sans préciser davantage la nature exacte de la rencontre.
- source_word: διέτριψε
  choice: il lui frotta
  rationale: Le verbe désigne l’action de frotter. La construction française avec le pronom indirect est idiomatique pour une partie du corps.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: les yeux
  rationale: Dans « il lui frotta les yeux », le pronom « lui » rend le possesseur indiqué par αὐτοῦ, tandis que l’article défini est la tournure naturelle en français.
