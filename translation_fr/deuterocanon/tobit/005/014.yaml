base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: fr
  text: 'Il lui dit : « Que tout aille bien pour toi, frère[a] ! Ne m’en veux pas d’avoir cherché à connaître ta tribu et ta famille. Tu es bien mon frère, issu d’une belle et bonne lignée. Je connaissais en effet Ananias et Jathan, les fils de Shémaïa le Grand, car nous allions ensemble à Jérusalem pour adorer, en apportant les premiers-nés et les dîmes des récoltes. Ils ne se sont pas égarés dans l’égarement de nos frères[b]. Tu es issu d’une bonne racine, frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Puisses-tu venir en bonne santé, frère ! » Il s’agit d’une formule conventionnelle souhaitant santé et bien-être ; selon le contexte, elle peut aussi se comprendre comme « Puisses-tu arriver sain et sauf » ou « Bon voyage ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « nos frères » peut désigner les membres du même peuple ou les compatriotes, et non uniquement des frères biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: Que tout aille bien pour toi
  rationale: La formule grecque souhaite littéralement que l’interlocuteur « vienne en bonne santé ». Cette tournure française naturelle préserve l’idée générale de bien-être sans trancher à tort entre salutation et souhait de bon voyage; la note signale le sens littéral.
- source_word: φυλήν
  choice: tribu
  rationale: Le terme désigne ici l’appartenance tribale, importante dans le cadre généalogique israélite.
- source_word: πατριάν
  choice: famille
  rationale: Le mot peut désigner la maison ancestrale ou la lignée paternelle. « Famille » reste clair en français moderne, tandis que le contexte conserve la portée généalogique.
- source_word: τυγχάνεις ἀδελφός μου
  choice: en fait, tu es mon frère
  rationale: τυγχάνεις marque le constat résultant de l’enquête. « En fait » exprime naturellement cette découverte, et « frère » conserve le langage de parenté de la source.
- source_word: καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: d’une lignée belle et noble
  rationale: γενεά renvoie ici à l’ascendance. Le double qualificatif est maintenu plutôt que réduit à un seul; « noble » rend la valeur morale et honorable de ἀγαθός dans ce contexte.
- source_word: κοινῶς
  choice: ensemble
  rationale: L’adverbe indique que les personnes accomplissaient en commun le pèlerinage à Jérusalem.
- source_word: προσκυνεῖν
  choice: adorer
  rationale: Dans le contexte du pèlerinage cultuel à Jérusalem, le verbe désigne l’acte d’adoration, sans qu’il soit nécessaire d’expliciter le geste de prosternation.
- source_word: τὰ πρωτότοκα
  choice: les premiers-nés
  rationale: La traduction conserve le terme cultuel général sans préciser animaux ou autres biens au-delà de ce qu’énonce le grec.
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: la dîme des récoltes
  rationale: Le grec emploie le pluriel « les dîmes », mais le français cultuel formule naturellement le prélèvement comme « la dîme ». γενήματα désigne ici les produits ou rendements agricoles.
- source_word: ἐπλανήθησαν ἐν τῇ πλάνῃ
  choice: se sont laissé entraîner dans l’égarement
  rationale: Cette formulation restitue le passif et garde la répétition étymologique grecque sous une forme française intelligible.
- source_word: ἐκ ῥίζης καλῆς
  choice: issu d’une bonne racine
  rationale: L’image généalogique de la racine est préservée, malgré son caractère moins idiomatique, parce qu’elle porte la texture symbolique du passage.
theological_decisions:
- issue: Langage généalogique et identité collective
  choice: Conserver « frère », « tribu », « famille », « lignée » et « racine »
  alternative: Uniformiser par « parent », « parenté » ou « bonne famille »
  rationale: Le verset relie ascendance, identité israélite et fidélité cultuelle. Maintenir la variété des images familiales évite d’aplanir cette dimension sociale et théologique.
- issue: « L’égarement de nos frères »
  choice: Conserver « nos frères » avec une note précisant son sens collectif possible
  alternative: Traduire directement « nos compatriotes » ou « les autres Israélites »
  rationale: ἀδελφοί peut désigner des frères au sens large, parents ou membres du même peuple. Le texte principal garde le terme source et la note empêche une lecture limitée aux frères biologiques.
- issue: Nature de l’égarement
  choice: Ne pas préciser la faute ou le courant religieux visé
  alternative: Expliciter une apostasie ou un culte particulier
  rationale: Le grec parle seulement de πλάνη, « égarement/erreur ». Une précision doctrinale dépasserait l’information du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative demeure proche du grec, avec quelques ajustements idiomatiques. Les noms propres suivent des formes françaises transparentes; les termes de parenté et l’image de la racine sont délibérément conservés.
