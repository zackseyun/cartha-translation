base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
translation:
  language: fr
  text: 'Il lui donna le document écrit et lui dit : « Cherche-toi un homme qui fera le voyage avec toi. Je lui donnerai un salaire tant que je vivrai. Puis va chercher l’argent[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’argent » ou « l’argent métal ». Dans ce contexte, il s’agit de la somme qui avait été déposée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: le document écrit
  rationale: Le terme désigne un écrit fait de la main de quelqu’un. Dans ce contexte, il s’agit du document lié au dépôt, sans que le grec permette d’en préciser avec certitude la forme juridique.
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: Cherche-toi un homme
  rationale: Cette formulation conserve le singulier masculin explicite ἄνθρωπον et rend naturellement l’idée de trouver un compagnon pour le voyage.
- source_word: συμπορεύσεταί σοι
  choice: qui fera le voyage avec toi
  rationale: Le verbe composé exprime le fait d’aller ou de voyager ensemble; cette traduction garde à la fois le déplacement et l’accompagnement.
- source_word: μισθὸν
  choice: un salaire
  rationale: μισθός désigne la rémunération accordée pour un travail ou un service, ici celui du compagnon de voyage.
- source_word: ἕως ζῶ
  choice: tant que je vivrai
  rationale: Cette expression française naturelle conserve la durée et l’engagement personnel exprimés par le grec.
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: Puis pars retirer l’argent
  rationale: Le participe πορευθείς est rendu par une coordination idiomatique. Dans le contexte d’une somme déposée, « retirer » exprime naturellement λάβε, tandis que « argent » rend le sens monétaire de ἀργύριον.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche du grec tout en étant naturelle. « Document écrit » évite de préciser indûment s’il s’agissait d’un reçu, d’une reconnaissance de dette ou d’un autre type d’attestation; le témoin sémitique indirect confirme néanmoins son lien avec l’identification du dépôt.
