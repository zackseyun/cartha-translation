  - severity: low
    issue: « Ils se mirent ainsi d’accord »
    rationale: Cette expression suggère quelque peu un processus de négociation. Le grec εὐδόκησαν οὕτως exprime plus directement le consentement ou l’approbation de la proposition précédente.
  - severity: medium
    issue: « le chien du jeune homme »
    rationale: Le grec τοῦ παιδαρίου est un diminutif et présente Tobie comme un garçon. Son âge et son rôle dans le récit ne justifient pas d’élever le terme à « jeune homme ».
  - severity: low
    issue: « Dieu, qui demeure dans le ciel »
    rationale: Le rendu est compréhensible, mais « Dieu, qui habite au ciel » est plus naturel en français international moderne et conserve la description grecque.
