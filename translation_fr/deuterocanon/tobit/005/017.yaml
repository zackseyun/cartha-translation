  source_fidelity: Le sens général est bien rendu, y compris les souhaits au pluriel et la double action de sortir puis partir. Toutefois, « le jeune homme » atténue le diminutif παιδάριον, qui désigne ici Tobie comme un garçon/un jeune garçon. « Ils y consentirent » rend aussi plus directement εὐδόκησαν οὕτως que « Ils se mirent ainsi d’accord ».
  naturalness: Le français est globalement naturel et de registre narratif digne. « Dieu, qui habite au ciel » est plus idiomatique en français actuel que « qui demeure dans le ciel », sans perte de sens.
  terminology: « Ange » est approprié dans le contexte narratif de Tobit, tout en conservant en note l’alternative lexicale « messager ». « Garçon » traduit plus fidèlement παιδάριον que « jeune homme ».
