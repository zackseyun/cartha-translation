  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: fr
  text: 'Ils y consentirent. Puis il dit à Tobie : « Prépare-toi pour le voyage, et que votre voyage se déroule bien[a]. » Son fils prépara ce qui était nécessaire pour le voyage. Son père lui dit alors : « Pars avec cet homme. Que Dieu, qui habite au ciel, fasse réussir votre voyage, et que son ange[b] vous accompagne. » Tous deux sortirent et se mirent en route, et le chien du garçon partit avec eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe de l’impératif singulier « prépare-toi » à un souhait formulé au pluriel, qui peut inclure Tobie et son compagnon.
    reason: grammatical_ambiguity
  - marker: b
    text: Le mot grec peut aussi signifier « messager » ; dans le contexte de Tobit, il désigne très probablement un ange.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν οὕτως
  choice: Ils se mirent ainsi d’accord
  rationale: Dans le contexte, le verbe exprime l’approbation de l’arrangement proposé. Cette formulation française rend naturellement l’idée d’un accord conclu.
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: Prépare-toi pour le voyage
  rationale: L’impératif appelle Tobie à se préparer au départ; « voyage » rend ici le sens contextuel de ὁδός.
- source_word: εὐοδωθεῖητε
  choice: que votre voyage se déroule bien
  rationale: L’optatif exprime un souhait de réussite pendant le déplacement. Le possessif « votre » conserve la forme plurielle du grec, malgré l’impératif singulier qui précède.
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: ce qui était nécessaire pour le voyage
  rationale: La formule désigne les préparatifs ou affaires nécessaires sans préciser leur nature.
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: Dieu, qui demeure dans le ciel
  rationale: Cette traduction conserve la tournure descriptive et le registre digne de l’expression grecque.
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: fasse réussir votre voyage
  rationale: La formulation rend clairement le souhait que Dieu accorde une issue favorable au voyage, tout en gardant le pluriel grec.
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: que son ange vous accompagne
  rationale: Dans le cadre narratif de Tobit, ἄγγελος désigne très probablement un être céleste; « accompagne » exprime naturellement l’idée de voyager avec eux.
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: Tous deux sortirent et se mirent en route
  rationale: Cette formulation conserve les deux mouvements exprimés en grec — sortir et partir — sans produire une redondance maladroite en français.
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: le chien du jeune homme
  rationale: Tobie est assez âgé pour entreprendre ce voyage et se marier; « jeune homme » convient mieux au contexte que « garçon », tout en rendant παιδάριον.
theological_decisions:
- issue: Sens de ἄγγελος
  choice: ange
  alternative: messager
  rationale: Le mot peut désigner un messager en général, mais la trame de Tobit indique ici un envoyé céleste. La note conserve néanmoins l’alternative lexicale.
translation_notes:
  register: Français international actuel, naturel et digne. Le texte conserve les pluriels du grec dans les bénédictions, rend la répétition narrative sans lourdeur et évite le tour archaïque « prospérer le chemin ».
