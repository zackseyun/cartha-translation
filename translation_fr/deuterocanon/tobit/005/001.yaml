base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/001.yaml
  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: fr
  text: 'Tobie lui répondit[a] : « Père, je ferai tout ce que tu m’as commandé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin parallèle de forme sémitique précise : « Tobie répondit à son père… tout ce que tu m’as commandé, mon père, je le ferai. » Le principal témoin grec dit plus simplement « lui répondit » et emploie l’apostrophe « Père ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: répondit
  rationale: Le participe narratif introduit la parole; un verbe conjugué au passé simple donne en français un récit naturel et concis.
- source_word: Τωβίας
  choice: Tobie
  rationale: « Tobie » est la forme française traditionnelle et immédiatement reconnaissable du nom grec Τωβίας.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom grec est conservé sans expliciter son référent; l’apostrophe « Père » indique naturellement qu’il s’agit du père de Tobie.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif grec ne comporte pas de possessif. « Père » le rend directement, sans importer le « mon père » du témoin sémitisant parallèle.
- source_word: ποιήσω
  choice: je ferai
  rationale: Le futur exprime ici l’intention ferme d’obéir; « je ferai » est direct et idiomatique.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Cette tournure française rend naturellement la totalité visée par la combinaison grecque, sans lourdeur littérale.
- source_word: ἐντέταλσαί μοι
  choice: tu m’as commandé
  rationale: Le passé composé exprime l’ordre déjà donné et toujours pertinent. La construction avec « m’ » est idiomatique en français.
