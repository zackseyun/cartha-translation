  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: fr
  text: 'Tobit lui dit : « Mon frère, de quelle tribu et de quel pays es-tu ? Indique-le-moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφέ
  choice: Mon frère
  rationale: Vocatif fraternel naturel en français, sans présumer ici un lien de parenté biologique.
- source_word: φυλῆς
  choice: tribu
  rationale: Équivalent direct qui conserve la dimension d’appartenance tribale.
- source_word: πατρίδος
  choice: pays
  rationale: Dans cette question sur l’origine, « pays » exprime naturellement le lieu d’appartenance ou la terre natale, tout en évitant le registre moderne plus politique de « patrie ».
- source_word: ὑπόδειξόν μοι
  choice: Indique-le-moi
  rationale: Conserve l’idée de faire connaître ou de préciser, portée par ὑποδείκνυμι, dans un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La répétition grecque de ἐκ ποίας est rendue par « de quelle… et de quel… », et la demande finale reste distincte plutôt que d’être absorbée dans la question.
