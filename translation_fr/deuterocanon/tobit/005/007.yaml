  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
translation:
  language: fr
  text: 'Tobie lui dit[a] : « Attends-moi, et je parlerai à mon père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec est bref : « Tobie lui dit : “Attends-moi, et je parlerai à mon père.” » Une tradition parallèle de forme sémitique développe la scène : Tobie informe son père de l’homme qu’il a trouvé, puis ressort pour l’appeler. Le texte principal suit le grec ; la note signale cette forme plus développée.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: Attends-moi ici
  rationale: Dans ce contexte, l’impératif aoriste de ὑπομένω demande à l’homme de rester sur place pendant que Tobie va parler à son père. « Attends-moi ici » exprime naturellement cette idée en français moderne.
- source_word: ἐρῶ τῷ πατρί
  choice: le temps que j’en parle à mon père
  rationale: Le futur de λέγω signifie littéralement « je dirai à mon père ». Le contexte implique que Tobie va informer son père au sujet de l’homme rencontré ; « j’en parle à mon père » rend ce sens sans préciser davantage le contenu que ne le fait le grec.
- source_word: Τωβίας
  choice: Tobie
  rationale: « Tobie » est la forme française traditionnelle et courante du nom, claire pour le lectorat francophone.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la brièveté du grec tout en explicitant idiomatiquement que l’homme doit attendre sur place. Le pronom « en » indique le sujet de la conversation sans importer les détails du témoin parallèle dans le texte principal.
