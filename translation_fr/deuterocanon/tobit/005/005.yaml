base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: fr
  text: 'Il lui dit : « Puis-je aller avec toi à Raguès, en Médie[a] ? Connais-tu bien les lieux ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans Raguès de Médie ». Dans ce contexte de voyage, la préposition grecque indique vraisemblablement la destination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθῆναι μετὰ σοῦ
  choice: aller avec toi
  rationale: Cette formulation naturelle rend directement l’idée de déplacement et d’accompagnement exprimée par l’infinitif πορευθῆναι et μετὰ σοῦ.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: jusqu’à Raguès, en Médie
  rationale: Bien que ἐν signifie normalement « dans/à », le contexte de déplacement appelle ici un sens de destination. « Jusqu’à » exprime clairement le terme du voyage, tandis que « en Médie » situe la ville.
- source_word: Ῥάγοις
  choice: Raguès
  rationale: « Raguès » est une forme française établie et aisément prononçable du nom grec Ῥάγοις.
- source_word: ἔμπειρος εἶ τῶν τόπων
  choice: Connais-tu bien la région ?
  rationale: ἔμπειρος indique une connaissance acquise ou une familiarité pratique. Le pluriel τῶν τόπων désigne ici les lieux du trajet ou des environs; « la région » est idiomatique en français moderne sans perdre le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le dialogue reste direct; « Raguès » suit l’usage français, et « la région » évite la tournure peu idiomatique « connaître les lieux ».
