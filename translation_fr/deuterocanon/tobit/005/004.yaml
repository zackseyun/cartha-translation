base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: fr
  text: Il alla chercher un homme et trouva Raphaël, qui était un ange, sans savoir que Raphaël était un ange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: Il partit
  rationale: Le verbe πορεύομαι signifie ici aller ou se mettre en route. « Il partit » convient naturellement à l’enchaînement narratif.
- source_word: ζητῆσαι
  choice: chercher
  rationale: L’infinitif a une valeur de but et décrit la recherche d’un compagnon de voyage.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le grec emploie le singulier ἄνθρωπον; dans ce contexte, Tobie cherche un compagnon de voyage masculin.
- source_word: εὗρεν
  choice: trouva
  rationale: Traduction narrative directe et naturelle de εὑρίσκω.
- source_word: Ῥαφαήλ
  choice: Raphaël
  rationale: Forme française usuelle du nom propre.
- source_word: ἄγγελος
  choice: ange
  rationale: Même si ἄγγελος peut aussi désigner un messager, le narrateur identifie ici Raphaël comme un être angélique.
- source_word: οὐκ ᾔδει
  choice: il ne le savait pas
  rationale: Le complément reste implicite en grec; le pronom « le » reprend naturellement en français le fait que Raphaël était un ange.
theological_decisions:
- issue: Identité de Raphaël comme ἄγγελος
  choice: Traduire ἄγγελος par « ange » dans le texte principal.
  alternative: messager
  rationale: 'Dans l’univers narratif de Tobit, Raphaël est un être céleste et non un simple envoyé humain. « Ange » exprime donc le sens contextuel sans effacer l’ironie dramatique: le narrateur connaît son identité, mais le personnage l’ignore.'
translation_notes:
  register: Français moderne, international et digne. La coordination simple du grec est conservée sans lourdeur. Aucun marqueur de note n’est nécessaire, puisque « messager » n’est pas ici une ambiguïté contextuelle déterminante et qu’une note risquerait de suggérer à tort une identité purement humaine.
