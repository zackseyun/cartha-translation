  verdict: revise
  source_fidelity: « Il partit » peut convenir dans le contexte, mais ἐπορεύθη signifie directement « il alla »; « Il alla chercher » reproduit plus exactement le mouvement suivi du but exprimé par ζητῆσαι. La proposition finale doit exprimer que Tobie ignorait l’identité angélique de Raphaël. « Sans savoir que Raphaël était un ange » rend explicitement, sans ajout de sens, l’objet implicite de οὐκ ᾔδει.
  naturalness: La phrase révisée est naturelle en français moderne et conserve la progression narrative simple du grec. La reprise explicite de « Raphaël » évite l’ambiguïté possible de « il ne le savait pas », qui peut être comprise comme une méconnaissance de la personne plutôt que de sa nature angélique.
  terminology: '« Raphaël » et « ange » sont les formes françaises usuelles et correspondent au contexte narratif de Ῥαφαήλ et ἄγγελος. Une note sur « messager » n’est pas nécessaire ici : le contexte fixe clairement le référent comme un être angélique, et aucun ancrage de note n’est présent dans le texte français.'
