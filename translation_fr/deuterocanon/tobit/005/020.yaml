  text: For as it has been given to us by the Lord to live, this is enough for us.
translation:
  language: fr
  text: Puisque le Seigneur nous a accordé de vivre, cela nous suffit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  choice: En effet, puisque
  rationale: « En effet » restitue la valeur explicative de γάρ, tandis que « puisque » rend ὡς comme introduction du fondement de l’affirmation.
- source_word: δέδοται ἡμῖν
  choice: il nous a été donné
  rationale: Le parfait passif exprime un don accordé dont l’effet demeure. La tournure française conserve à la fois le passif et le destinataire.
- source_word: ζῇν
  choice: de vivre
  rationale: L’infinitif est rendu verbalement, sans le transformer en nom abstrait.
- source_word: παρὰ τοῦ κυρίου
  choice: par le Seigneur
  rationale: παρά avec le génitif indique ici la source du don; avec le passif, « par le Seigneur » est naturel et fidèle.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie au fait d’avoir reçu de vivre, sans préciser davantage ce que le grec laisse implicite.
- source_word: ἱκανὸν ἡμῖν ὑπάρχει
  choice: cela nous suffit
  rationale: Cette formulation française naturelle rend l’idée de suffisance exprimée par ἱκανόν et ὑπάρχει, tout en maintenant le bénéficiaire ἡμῖν.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte attribue à Dieu le don de vivre. « Seigneur » est le terme révérenciel usuel pour κύριος et n’ajoute aucune précision absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure explicative et le passif du grec sont conservés, malgré une légère solennité de la tournure « il nous a été donné… de vivre ».
