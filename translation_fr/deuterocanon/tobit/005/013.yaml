  text: to learn your family line and your name. But he said[a], “I am Azarias, son of the great Ananias, of your brothers.”
translation:
  language: fr
  text: 'connaître ta lignée et ton nom. Il répondit : « Je suis Azarias, fils d’Ananias le Grand, de ta parenté[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de tes frères »; le mot grec peut désigner plus largement des parents ou des membres du même groupe familial.'
    reason: Préciser le sens littéral et préserver l’ambiguïté du terme de parenté.
lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: connaître
  rationale: L’infinitif exprime ici l’acquisition d’informations permettant d’identifier l’interlocuteur; « connaître » s’insère naturellement dans la phrase commencée au verset précédent.
- source_word: γένος
  choice: lignée
  rationale: Dans ce contexte généalogique, γένος désigne l’origine ou la ligne familiale, non une espèce ni une race.
- source_word: ὄνομα
  choice: nom
  rationale: Équivalent direct et naturel du terme grec.
- source_word: Ἐγὼ Ἀζαρίας
  choice: Je suis Azarias
  rationale: La forme française « Azarias » suit la forme grecque du nom sans l’hébraïser.
- source_word: Ἀνανίου
  choice: fils d’Ananias
  rationale: Le génitif patronymique grec est rendu explicitement selon l’usage naturel du français.
- source_word: τοῦ μεγάλου
  choice: le Grand
  rationale: L’adjectif est conservé comme épithète honorifique, sans l’interpréter comme « l’Ancien » ou « l’illustre ».
- source_word: τῶν ἀδελφῶν σου
  choice: de ta parenté
  rationale: Le pluriel ἀδελφοί peut désigner ici le cercle familial élargi. « De ta parenté » restitue ce sens en français actuel tout en laissant ouverte l’étendue exacte du lien.
theological_decisions:
- issue: Portée du terme de parenté ἀδελφῶν
  choice: de ta parenté
  alternative: l’un de tes frères
  rationale: Le contexte porte sur la lignée et l’identification familiale. Traduire littéralement par « frères » pourrait suggérer à tort des frères germains, tandis que « parenté » conserve le sens familial plus large possible sans préciser davantage le lien.
- issue: Rattachement syntaxique de τῶν ἀδελφῶν σου
  choice: formulation elliptique « de ta parenté »
  alternative: Ananias le Grand, l’un de tes parents
  rationale: Le génitif peut être entendu en relation avec Ananias ou avec l’identification familiale d’Azarias. La formulation retenue évite de trancher silencieusement ce rattachement.
translation_notes:
  register: Français moderne, sobre et digne. Le fragment initial demeure syntaxiquement lié au verset précédent. Les noms propres suivent les formes grecques traditionnelles « Azarias » et « Ananias ».
