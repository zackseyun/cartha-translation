  text: But how will I be able to get the money[b][a], since I do not know him?
translation:
  language: fr
  text: Mais comment pourrai-je récupérer l’argent[a], puisque je ne le connais pas[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « l’argent-métal » ; il s’agit ici d’une somme confiée en dépôt.
    reason: lexical_alternative
  - marker: b
    text: 'La tradition sémitique parallèle développe la pensée : « Comment pourrai-je prendre l’argent à Gabaël ? Il ne me reconnaîtra pas, et moi, je ne le reconnaîtrai pas… » Elle précise ainsi que les deux hommes ne se connaissent pas.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La particule introduit l’objection pratique de Tobie en réponse aux instructions précédentes.
- source_word: πῶς δυνησομαι
  choice: comment pourrai-je
  rationale: Cette formulation conserve à la fois l’interrogation sur le moyen et la valeur future de la capacité exprimée par δύναμαι.
- source_word: λαβεῖν
  choice: récupérer
  rationale: Dans le contexte d’une somme confiée en dépôt, « récupérer » rend naturellement l’idée de prendre ou recevoir de nouveau l’argent.
- source_word: τὸ ἀργύριον
  choice: l’argent
  rationale: ἀργύριον peut désigner l’argent-métal ou une somme d’argent ; ici, le contexte financier justifie le terme courant « l’argent ».
- source_word: καὶ
  choice: puisque
  rationale: Le simple lien par « et » exprime ici la raison de la difficulté. « Puisque » rend cette relation de façon naturelle en français sans modifier le fond de la question.
- source_word: οὐ γινώσκω αὐτόν
  choice: je ne le connais pas
  rationale: La formulation conserve le sens ordinaire du grec et laisse le contexte préciser qu’il s’agit de ne pas connaître personnellement l’homme concerné.
