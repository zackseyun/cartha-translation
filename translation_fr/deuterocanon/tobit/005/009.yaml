base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: fr
  text: 'Il entra et dit à son père : « Voici, j’ai trouvé quelqu’un qui fera route avec moi. » Son père lui répondit : « Fais-le venir auprès de moi, afin que je sache de quelle tribu il est[a] et s’il est digne de confiance pour aller avec toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque renvoie à son appartenance à l’une des tribus d’Israël.
    reason: cultural_note
  - marker: b
    text: 'Ou : « s’il est fiable pour voyager avec toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Il entra
  rationale: Le participe aoriste marque une action antérieure ou concomitante étroitement liée au verbe principal. Une coordination simple est naturelle en français narratif et respecte la séquence.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » conserve la fonction présentative et l’immédiateté de la particule grecque dans un registre biblique actuel sans être archaïque.
- source_word: εὕρηκα
  choice: j’ai trouvé
  rationale: 'Le passé composé rend naturellement le parfait grec et son résultat présent : le compagnon recherché est désormais trouvé.'
- source_word: ὃς συμπορεύσεταί μοι
  choice: quelqu’un qui fera route avec moi
  rationale: Cette formulation rend explicitement l’idée d’un déplacement accompli ensemble, tout en restant idiomatique et digne.
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: Appelle-le auprès de moi
  rationale: La traduction conserve l’idée grecque d’appeler quelqu’un à venir auprès du locuteur, sans introduire le sens causatif plus fort de « fais-le venir ».
- source_word: ἐπιγνῶ
  choice: afin que je sache
  rationale: Dans ce contexte, le verbe exprime le fait de parvenir à une connaissance assurée de l’identité et de la fiabilité de l’homme.
- source_word: ποίας φυλῆς ἐστίν
  choice: de quelle tribu il est
  rationale: φυλή désigne ici l’appartenance tribale israélite; il convient de ne pas l’aplatir en « famille » ou « lignée ».
- source_word: πιστὸς
  choice: digne de confiance
  rationale: Le contexte porte sur la fiabilité pratique et morale d’un compagnon de voyage. Cette expression évite de donner au mot une portée doctrinale étrangère au passage.
- source_word: τοῦ πορευθῆναι μετὰ σοῦ
  choice: pour partir avec toi
  rationale: La formulation indique clairement le domaine dans lequel l’homme doit être digne de confiance et évite de répéter « faire route ».
theological_decisions:
- issue: Portée sociale de φυλή
  choice: tribu
  alternative: clan, lignée familiale
  rationale: Le grec nomme explicitement la tribu et le cadre israélite donne à cette appartenance ancestrale une importance narrative qu’une généralisation ferait disparaître.
- issue: Sens contextuel de πιστός
  choice: digne de confiance
  alternative: fidèle, fiable
  rationale: Il s’agit d’évaluer un compagnon de voyage. « Digne de confiance » préserve la dimension morale du terme sans transformer la phrase en affirmation doctrinale sur la foi.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici » maintient la vivacité du discours direct; « fera route » est courant tout en convenant au registre biblique. Les pronoms ont été légèrement explicités (« Son père ») pour éviter une ambiguïté référentielle peu naturelle en français.
