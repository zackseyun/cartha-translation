  source_fidelity: 'Le texte français rend fidèlement les trois actions successives du grec : « il l’appela », « il entra » et « ils se saluèrent ». « Celui-ci » identifie naturellement en français le nouvel acteur tout en conservant la référence contextuelle du pronom grec, sans lui attribuer de nom ni de rôle supplémentaire.'
  naturalness: La formulation est sobre, fluide et adaptée à un récit en français international moderne. « Se saluèrent » rend la réciprocité sans lourdeur. La ponctuation en deux phrases reste naturelle, même si le grec enchaîne les actions par καί.
  terminology: « Appela », « entra » et « se saluèrent » sont des équivalents justes et non surinterprétatifs de ἐκάλεσεν, εἰσῆλθεν et ἠσπάσαντο ἀλλήλους. Le choix évite à bon droit « convoqua », « invita » et « s’embrassèrent ».
