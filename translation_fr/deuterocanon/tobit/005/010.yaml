  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: fr
  text: Il l’appela[a]. Celui-ci entra, et ils se saluèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec est ici très bref : « Il l’appela. Celui-ci entra, et ils se saluèrent. » Une tradition du livre de Tobit transmise sous une forme sémitique présente un dialogue plus développé dans cette partie du récit, mais le texte principal suit le témoin grec retenu pour cette traduction.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Le verbe καλέω désigne ici simplement l’action d’appeler quelqu’un. « Convoqua » serait trop officiel, et « invita » préciserait indûment l’intention.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à l’homme mentionné dans le contexte. Le pronom français suffit sans expliciter son identité.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Le verbe signifie qu’il pénétra dans le lieu où se trouvait celui qui l’avait appelé. « Entra » est naturel, précis et digne en français narratif.
- source_word: ἠσπάσαντο
  choice: se saluèrent
  rationale: ἀσπάζομαι signifie couramment saluer ou accueillir. « S’embrassèrent » introduirait un geste physique que le grec n’impose pas.
- source_word: ἀλλήλους
  choice: se
  rationale: La réciprocité exprimée par ἀλλήλους est rendue naturellement en français par la forme pronominale « se saluèrent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et sobre. « Celui-ci » clarifie le changement de sujet entre « il appela » et « entra » sans ajouter d’identité absente du grec. La ponctuation française répartit naturellement les trois actions très brèves du texte source.
