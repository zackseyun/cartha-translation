  yaml_path: translation/deuterocanon/tobit/005/015.yaml
  text: But tell me, what wages shall I give you? A drachma a day, and your necessities, as for my own son?
translation:
  language: fr
  text: 'Mais dis-moi : quel salaire te donnerai-je[a] ? Une drachme par jour, plus ce dont tu as besoin, comme à mon fils ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « combien te paierai-je ? » Le grec demande directement quelle rémunération Tobit lui donnera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθὸν
  choice: salaire
  rationale: Le terme désigne la rémunération accordée pour un travail ou un service ; « salaire » convient naturellement au contexte d’engagement.
- source_word: δραχμὴν τῆς ἡμέρας
  choice: Une drachme par jour
  rationale: Le génitif exprime ici un tarif journalier. La traduction conserve l’unité monétaire antique sans lui substituer une valeur moderne.
- source_word: τὰ δέοντά σοι
  choice: ce dont tu auras besoin
  rationale: L’expression désigne les choses nécessaires à la personne. Cette formulation française est naturelle et n’impose pas une précision absente du grec, telle que les vivres ou les frais.
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: comme à mon propre fils
  rationale: 'ὡς καί établit une comparaison : Tobit pourvoira aux besoins de son compagnon comme à ceux de son fils. « propre » rend clairement la portée familiale de la comparaison.'
- source_word: τίνα σοὶ ἔσομαι ... διδόναι
  choice: quel salaire devrai-je te donner
  rationale: La construction au futur avec l’infinitif exprime ce que Tobit devra ou entend donner. La formulation garde la question directe tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et accessible. La ponctuation met en relief l’offre formulée en deux éléments : une rémunération journalière et la prise en charge des besoins. Le point d’interrogation final conserve la forme interrogative du grec, dont la seconde proposition peut se comprendre comme une offre soumise à l’accord de l’interlocuteur.'
