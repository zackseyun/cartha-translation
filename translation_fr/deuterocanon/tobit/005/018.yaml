base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: fr
  text: 'Mais Anne, sa mère, pleura et dit à Tobit : « Pourquoi as-tu envoyé notre enfant loin de nous ? N’est-il pas le bâton de notre main[a], quand il entre et sort devant nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le bâton de notre main ». La métaphore exprime l’idée de soutien ou d’appui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: se mit à pleurer
  rationale: L’aoriste de κλαίω exprime ici les pleurs d’Anne. Cette tournure française rend naturellement l’entrée dans l’action sans affaiblir l’émotion.
- source_word: ἐξαπέστειλας
  choice: as-tu envoyé … au loin
  rationale: Le composé ἐξαποστέλλω indique l’envoi loin de soi. « Envoyer au loin » restitue la douleur causée par le départ, plus clairement que le simple « envoyer ».
- source_word: τὸ παιδίον ἡμῶν
  choice: notre enfant
  rationale: παιδίον désigne un enfant ou un jeune garçon. « Notre enfant » conserve la nuance affective maternelle sans remplacer le nom grec par « fils ».
- source_word: ῥάβδος τῆς χειρὸς ἡμῶν
  choice: le bâton sur lequel s’appuie notre main
  rationale: La formulation conserve l’image concrète du bâton tout en rendant intelligible en français sa fonction métaphorique de soutien. Le littéral « le bâton de notre main » serait obscur et peu naturel.
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: lui qui allait et venait
  rationale: La construction décrit les mouvements habituels de l’enfant. « Aller et venir » est l’équivalent français naturel de l’expression grecque « entrer et sortir » dans ce contexte.
- source_word: ἐνώπιον ἡμῶν
  choice: sous nos yeux
  rationale: Cette expression rend naturellement l’idée de présence contenue dans ἐνώπιον ἡμῶν et s’accorde avec le souvenir de ses allées et venues.
