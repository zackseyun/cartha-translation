    issue: La métaphore est développée dans le texte principal.
    rationale: « Le bâton sur lequel s’appuie notre main » explicite la fonction du bâton et ne correspond plus directement à « le bâton de notre main ». Cette explicitation convient mieux à une note.
  - severity: medium
