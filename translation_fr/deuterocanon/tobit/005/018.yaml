    rationale: « Allait et venait sous nos yeux » est idiomatique, mais ἐν τῷ εἰσπορεύεσθαι ... καὶ ἐκπορεύεσθαι ἐνώπιον ἡμῶν dit littéralement son entrée et sa sortie « devant nous ». Une formulation plus proche conserve l’image et l’ambiguïté de l’idiome.
