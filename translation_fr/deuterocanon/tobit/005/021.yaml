  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: fr
  text: 'Tobit lui dit : « Ne t’inquiète pas, ma sœur[a]. Il reviendra sain et sauf, et tes yeux le verront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ma sœur » traduit littéralement la manière dont Tobit s’adresse ici à sa femme. Cette expression familiale entre époux ne signifie pas qu’ils sont frère et sœur biologiques.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: Ne t’inquiète pas
  rationale: L’expression signifie littéralement « n’aie pas de parole / d’affaire », mais fonctionne ici comme une formule rassurante adressée à une personne bouleversée. « Ne t’inquiète pas » en rend naturellement le sens en français moderne.
- source_word: ἀδελφή
  choice: ma sœur
  rationale: Le grec porte littéralement « sœur ». L’ajout idiomatique du possessif est naturel dans l’adresse française et conserve cette désignation familiale entre époux sans la remplacer par l’interprétation « ma femme ».
- source_word: ὑγιαίνων
  choice: sain et sauf
  rationale: Le participe exprime le fait d’être en bonne santé ou en bon état. Dans le contexte d’un voyage, « sain et sauf » communique naturellement que le fils reviendra sans dommage.
- source_word: ἐλεύσεται
  choice: il reviendra
  rationale: Le verbe signifie littéralement « il viendra ». Puisqu’il s’agit du retour du fils auprès de ses parents, « reviendra » explicite en français la direction impliquée par le contexte.
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: tes yeux le verront
  rationale: La formulation conserve la mention explicite des yeux, ainsi que la force concrète et affective de la promesse grecque.
