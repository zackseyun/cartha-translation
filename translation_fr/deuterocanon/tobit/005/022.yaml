  yaml_path: translation/deuterocanon/tobit/005/022.yaml
  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: fr
  text: Car un bon ange l’accompagnera, son voyage se déroulera bien, et il reviendra en bonne santé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ange
  rationale: Dans le contexte narratif de Tobit, il s’agit d’un être céleste et non d’un simple messager humain.
- source_word: ἀγαθὸς
  choice: bon
  rationale: Ce choix rend simplement l’adjectif grec, qui qualifie le caractère ou l’action bienfaisante de l’ange, sans surinterprétation.
- source_word: συνπορεύσεται
  choice: l’accompagnera
  rationale: Le verbe signifie aller avec quelqu’un. « L’accompagnera » est naturel en français moderne et conserve l’idée du trajet fait ensemble.
- source_word: εὐοδωθήσεται
  choice: se déroulera bien
  rationale: Le passif exprime l’issue favorable du voyage. Cette formulation française est idiomatique tout en gardant l’idée que la route sera prospère ou réussie.
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: son voyage
  rationale: Bien que ὁδός puisse désigner la route ou le chemin, le contexte de déplacement invite à comprendre ici l’ensemble du voyage.
- source_word: ὑποστρέψει
  choice: il reviendra
  rationale: Le verbe signifie couramment revenir ou retourner; « il reviendra » convient naturellement au contexte.
- source_word: ὑγιαίνων
  choice: en bonne santé
  rationale: Le participe souligne l’état de santé au retour; cette expression en conserve le sens précis sans l’élargir à la sécurité en général.
theological_decisions:
- issue: Nature de ἄγγελος dans le contexte
  choice: ange céleste
  alternative: messager au sens générique
  rationale: Dans l’univers narratif de Tobit, cette parole concerne la protection divine assurée par un compagnon angélique. « Ange » reflète le référent vraisemblable sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste simple et rassurante, avec un niveau de langue accessible; aucune note n’est nécessaire.
