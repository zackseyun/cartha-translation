  source_fidelity: La seconde moitié rend correctement l’optatif γένοιτο et l’image dépréciative de περίψημα. En revanche, « notre priorité » explicite fortement l’ellipse grecque et efface la répétition volontaire ἀργύριον ... ἀργυρίῳ. Le pluriel exhortatif (« Ne faisons pas ») n’est pas exigé par la forme grecque, dont l’infinitif est idiomatique et condensé. Une formulation française plus directe peut conserver l’incertitude de l’expression tout en donnant son sens contextuel.
  naturalness: Le français du projet est fluide et de registre approprié. Toutefois, « qu’il ne soit que rebut » est moins naturel sans article, et « à côté de notre enfant » est légèrement raide dans cette phrase. « Ne laissons pas l’argent primer » et « du rebut en comparaison de notre enfant » sont modernes, nets et dignes.
  terminology: « Argent » convient à ἀργύριον, qui peut désigner l’argent-métal ou l’argent comme richesse. « Rebut » rend bien περίψημα, avec une force suffisante sans archaïsme. La note doit indiquer que la répétition « argent ... argent » est conservée dans le grec et que son analyse précise demeure difficile; elle ne doit pas présenter une paraphrase contextuelle comme le sens littéral incontestable.
