translation:
  language: fr
  text: Ne laissons pas l’argent primer[a], mais qu’il soit du rebut en comparaison de notre enfant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète littéralement « argent » et emploie un verbe signifiant « devancer » : « Que l’argent ne devance pas l’argent. » La formule est condensée et difficile; dans le contexte, elle signifie vraisemblablement que l’argent ne doit pas l’emporter sur la valeur de l’enfant.'
    reason: La note préserve la répétition et l’ambiguïté de l’expression grecque tout en expliquant le sens contextuel de la traduction.
lexical_decisions:
- source_word: ἀργύριον τῷ ἀργυρίῳ μὴ φθάσαι
  choice: Ne faisons pas de l’argent notre priorité
  rationale: La formule grecque, très condensée, répète « argent » et emploie φθάνω, « arriver avant, devancer ». Dans ce contexte, elle invite à ne pas laisser les considérations financières passer avant l’enfant. Cette formulation française en exprime naturellement la portée sans lui attribuer un mécanisme économique précis.
- source_word: ἀλλά
  choice: mais, rendu par le point-virgule et « qu’il ne soit que »
  rationale: L’opposition entre la priorité refusée à l’argent et sa dépréciation est clairement marquée en français par la construction de la phrase.
- source_word: περίψημα
  choice: rebut
  rationale: Le mot désigne ce qu’on essuie ou enlève, des raclures ou des déchets. « Rebut » conserve l’image fortement dépréciative dans un registre digne et actuel.
- source_word: τοῦ παιδίου ἡμῶν
  choice: à côté de notre enfant
  rationale: Le génitif grec est elliptique. « À côté de » rend explicite la comparaison de valeur tout en évitant de préciser indûment si l’argent est dépensé pour l’enfant ou abandonné à cause de lui.
- source_word: γένοιτο
  choice: qu’il ne soit que
  rationale: Le souhait exprimé par l’optatif est rendu par le subjonctif français. « Ne… que » souligne que l’argent doit être tenu pour insignifiant en comparaison de l’enfant.
theological_decisions:
- issue: Valeur relative de l’argent et de l’enfant dans une expression grecque elliptique
  choice: L’argent ne doit pas devenir la priorité et doit être tenu pour du rebut à côté de l’enfant.
  alternative: « Que l’argent ne devance pas l’argent, mais qu’il devienne le rebut de notre enfant. »
  rationale: Le grec souligne la valeur incomparable de l’enfant sans formuler une doctrine générale sur la richesse. La traduction conserve cette tension concrète et affective, tandis que la note signale l’étrangeté de la formulation littérale.
translation_notes:
  register: Français international moderne, simple et digne. Le pluriel exhortatif convient à la résolution exprimée dans le discours. « Rebut » maintient la vigueur de l’image grecque sans archaïsme, et la note préserve la formulation inhabituelle de l’original.
