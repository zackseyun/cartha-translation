  - severity: low
    issue: Article omis devant « rebut »
    rationale: En français courant, « qu’il ne soit que rebut » est possible dans un style très condensé, mais « qu’il soit du rebut » est plus naturel et rend plus souplement l’attribution exprimée par γένοιτο.
  - severity: low
