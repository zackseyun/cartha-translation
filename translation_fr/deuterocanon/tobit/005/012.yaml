  text: And he said to him[a], “Are you seeking a tribe and a family line, or a hired man who will go with your son?” And Tobit said to him, “I want to know[c][b], brother,”
translation:
  language: fr
  text: 'Il lui dit : « Est-ce une tribu et une lignée que tu cherches, ou bien un homme engagé qui accompagnera ton fils ? » Tobit lui répondit : « Je veux le savoir, frère[a]. »'
  philosophy: optimal-equivalence
  footnotes:
