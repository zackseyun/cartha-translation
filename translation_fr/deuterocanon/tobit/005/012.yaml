    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλὴν
  choice: une tribu
  rationale: Le terme désigne une appartenance tribale; « tribu » en conserve clairement la dimension sociale et généalogique.
- source_word: πατριὰν
  choice: une lignée
  rationale: Le mot renvoie à la parenté fondée sur la descendance. « Lignée » rend naturellement cette identité généalogique en français.
- source_word: μίσθιον
  choice: un homme à gages
  rationale: Le terme désigne un homme engagé contre rémunération. « Homme à gages » est précis et évite la connotation péjorative que pourrait prendre « mercenaire ».
- source_word: συμπορεύσεται
  choice: qui accompagnera
  rationale: Le verbe signifie aller ou voyager avec quelqu’un; « accompagnera » est naturel dans ce contexte de voyage.
- source_word: Βούλομαι
  choice: Je veux le savoir
  rationale: La réponse grecque est elliptique, littéralement « Je veux, frère ». « Le savoir » reprend sans ambiguïté l’objet implicite de la question précédente.
- source_word: ἀδελφέ
  choice: frère
  rationale: Le sens littéral est conservé; ici, le mot sert aussi de formule courtoise d’adresse.
