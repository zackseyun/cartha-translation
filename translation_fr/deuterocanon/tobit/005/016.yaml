  text: And I will add more to your wages[a], if you return in good health.
translation:
  language: fr
  text: Et j’ajouterai encore à ton salaire, si vous revenez en bonne santé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si vous revenez étant en bonne santé ». Le grec souligne le bon état physique des voyageurs à leur retour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: j’ajouterai encore
  rationale: Cette tournure rend directement l’idée d’un supplément ajouté au salaire convenu, tout en restant naturelle en français.
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: à ton salaire
  rationale: Le datif σοι et la construction ἐπὶ τὸν μισθόν indiquent qu’un supplément sera ajouté à la rémunération destinée à l’interlocuteur.
- source_word: ἐὰν
  choice: si
  rationale: La conjonction introduit simplement la condition dont dépend la promesse.
- source_word: ὑγιαίνοντες
  choice: en bonne santé
  rationale: Le participe désigne le fait d’être bien portant; cette formulation conserve explicitement la dimension corporelle plutôt que de la remplacer par la seule idée de sécurité.
- source_word: ἐπιστρέψητε
  choice: vous revenez
  rationale: Dans le contexte d’un voyage, le verbe signifie revenir. Le pluriel grec est préservé par « vous », après le singulier « ton », puisque la condition concerne les voyageurs.
theological_decisions: []
translation_notes:
  register: 'Français moderne, simple et digne. Le passage du singulier « ton » au pluriel « vous » reproduit le changement de nombre du grec : la promesse est adressée à une personne, tandis que le retour en bonne santé concerne plusieurs voyageurs.'
