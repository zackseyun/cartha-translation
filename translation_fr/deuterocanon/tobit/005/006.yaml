base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: fr
  text: 'L’ange lui dit : « J’irai avec toi. Je connais bien le chemin[a] et j’ai logé chez Gabaël, notre frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je suis expérimenté quant au chemin »; autrement dit, « je connais bien l’itinéraire ».'
    reason: La formulation grecque condensée souligne une connaissance pratique du trajet.
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: J’irai avec toi
  rationale: Le futur de πορεύομαι exprime ici l’engagement d’accompagner Tobie; « aller avec » est direct et naturel en français.
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: Je connais bien le chemin
  rationale: La tournure grecque exprime une connaissance pratique, acquise par l’expérience, du trajet. Cette formulation française en restitue clairement le sens sans rendre l’expression artificiellement littérale.
- source_word: ὁδός
  choice: le chemin
  rationale: Dans ce contexte de voyage, ὁδός désigne le chemin ou l’itinéraire à suivre; « le chemin » est naturel et garde l’image concrète du grec.
- source_word: παρὰ Γαβαὴλ
  choice: chez Gabaël
  rationale: Avec un nom de personne et un verbe d’hébergement, παρά indique que le séjour a eu lieu auprès de cette personne, donc chez elle.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: notre frère
  rationale: La traduction conserve le terme familial du grec, qui peut désigner ici un frère au sens large, notamment un compatriote ou un membre du même peuple, sans trancher davantage.
- source_word: ηὐλίσθην
  choice: j’ai logé
  rationale: L’aoriste de αὐλίζομαι indique le fait d’avoir pris logement ou passé la nuit chez quelqu’un; « j’ai logé » convient au registre du voyage et reste idiomatique.
theological_decisions:
- issue: Sens de ὁ ἄγγελος
  choice: l’ange
  alternative: le messager
  rationale: Dans le récit de Tobit, le personnage est un être angélique, et « ange » est ici le sens contextuel naturel de ἄγγελος.
- issue: Portée de « notre frère »
  choice: Conserver la désignation littérale
  alternative: notre parent / notre compatriote
  rationale: Le grec ne précise pas la nature exacte du lien. « Notre frère » préserve donc l’ambiguïté entre fraternité proprement dite et appartenance communautaire.
translation_notes:
  register: Français international moderne, simple et digne. Les phrases brèves rendent naturellement les propositions coordonnées du grec. Le nom Gabaël suit une translittération française courante, et les guillemets français sont employés.
