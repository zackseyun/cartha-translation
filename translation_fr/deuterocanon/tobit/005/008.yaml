  text: And he said to him[a], “Go, and do not delay.”
translation:
  language: fr
  text: 'Et il lui dit : « Va, et ne tarde pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύου
  choice: Va
  rationale: L’impératif de πορεύομαι exprime ici l’ordre simple de partir. « Va » conserve la brièveté et le caractère direct du grec.
- source_word: μὴ χρονίσῃς
  choice: ne tarde pas
  rationale: χρονίζω peut signifier tarder, s’attarder ou prendre du temps. « Ne tarde pas » est naturel en français moderne et préserve l’interdiction sans archaïsme.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux impératifs, sans qu’il soit nécessaire de lui donner un sens temporel plus marqué.
- source_word: εἶπεν αὐτῷ
  choice: il lui dit
  rationale: Cette formule narrative traduit directement le grec tout en laissant l’identité du sujet dépendre du contexte, comme dans le texte source.
