  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: fr
  text: Raphaël se rendit chez Gabaël et y passa la nuit. Il lui remit le document écrit[a]. Gabaël sortit alors les sacs d’argent scellés[b] et les lui remit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la reconnaissance de dette » ou « le billet de dette ». Le grec χειρόγραφον peut désigner un document écrit attestant une obligation financière.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les sacs dans les sceaux », c’est-à-dire les sacs d’argent dont les sceaux étaient encore intacts.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: partit
  rationale: Dans ce récit de voyage, l’aoriste indique simplement que Raphaël se mit en route; « partit » est naturel et concis.
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: passa la nuit chez Gabaël
  rationale: αὐλίζομαι signifie couramment passer la nuit ou loger, et παρά avec une personne désigne ici le séjour chez elle.
- source_word: τὸ χειρόγραφον
  choice: le document écrit
  rationale: χειρόγραφον désigne un écrit attestant ici la créance ou le dépôt. Cette formulation reste claire sans imposer un terme juridique trop précis.
- source_word: προήνεγκεν
  choice: sortit
  rationale: Le verbe exprime le fait d’apporter ou de produire les sacs en réponse à la présentation du document; « sortit » convient à l’action concrète.
- source_word: τὰ θυλάκια
  choice: les sacs d’argent
  rationale: θυλάκια désigne de petits sacs ou bourses; le contexte établit qu’ils contiennent l’argent déposé.
- source_word: ἐν ταῖς σφραγῖσιν
  choice: encore scellés
  rationale: La tournure littérale, « dans/avec les sceaux », indique que les sacs portent toujours leurs sceaux intacts; cette traduction en exprime naturellement le sens.
- source_word: ἔδωκεν αὐτῷ
  choice: les lui remit
  rationale: Le pronom objet est explicité en français par « les », qui renvoie aux sacs d’argent; « remit » convient à la restitution du dépôt.
