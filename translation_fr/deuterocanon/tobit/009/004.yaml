  text: And my father is counting the days, and if I delay long, he will be greatly distressed.
translation:
  language: fr
  text: Et mon père compte les jours ; si je tarde longtemps, il sera profondément affligé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ
  choice: compte
  rationale: Le présent grec décrit une action en cours. En français, « compte les jours » exprime naturellement le fait qu’il suit avec inquiétude le temps qui passe.
- source_word: τὰς ἡμέρας
  choice: les jours
  rationale: Traduction directe de l’objet défini, qui conserve l’expression naturelle « compter les jours ».
- source_word: χρονίσω
  choice: je tarde
  rationale: Le subjonctif aoriste après ἐὰν présente une éventualité future. « Si je tarde » garde le sujet à la première personne sans suggérer qu’une cause extérieure le retient.
- source_word: μέγα
  choice: longtemps
  rationale: Employé adverbialement avec χρονίσω, μέγα indique une longue durée. « Tarder longtemps » est clair et idiomatique en français moderne.
- source_word: ὀδυνηθήσεται
  choice: il sera affligé
  rationale: Le verbe désigne ici une vive souffrance affective. « Être affligé » rend cette douleur avec un registre digne et accessible.
- source_word: λίαν
  choice: profondément
  rationale: L’adverbe intensifie nettement la souffrance du père. « Profondément » s’associe naturellement à « affligé » et conserve cette force.
