lexical_decisions:
- source_word: ηυλογησεν
  choice: Il bénit
  rationale: L’aoriste de εὐλογέω désigne naturellement ici l’action de bénir. « Il loua » modifierait le sens et supposerait normalement Dieu comme objet.
- source_word: τους αιωνας
  choice: pour toujours
  rationale: Dans cette formule, l’expression grecque exprime une durée sans fin. « Pour toujours » est clair, naturel et digne en français moderne.
theological_decisions:
- issue: Forme textuelle de la bénédiction
  choice: 'Traduire sobrement le texte principal : « Il les bénit pour toujours. »'
  alternative: Certains témoins ajoutent des éléments, notamment « d’une bénédiction pure et sainte », ainsi que « tous » et « tous les » dans la formule temporelle.
  rationale: Les ajouts signalés dans l’apparat ne doivent pas être incorporés silencieusement au texte principal. La variante substantielle est conservée en note, tandis que les variantes mineures n’altèrent pas le sens fondamental.
translation_notes:
  register: Français international moderne, simple et digne. Le pronom « les » restitue l’objet implicite requis par le français sans ajouter le « tous » attesté seulement dans une variante.
