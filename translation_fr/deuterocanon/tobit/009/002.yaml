base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: fr
  text: Prends avec toi un serviteur et deux chameaux, puis va à Raguès, en Médie, chez Gabaël. Rapporte-moi l’argent[a] et amène-le-moi aux noces[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « l’argent » au sens du métal; il s’agit ici de la somme confiée à Gabaël.
    reason: lexical_alternative
  - marker: b
    text: Ou « au festin de noces ». Le terme grec peut désigner le mariage lui-même ou le banquet qui le célèbre.
    reason: lexical_alternative
  - marker: c
    text: La tradition sémitique parallèle développe ce récit en ajoutant des serviteurs et des précisions concernant la maison de Gabaël; le texte grec suivi ici est plus court.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: Prends avec toi
  rationale: Expression française naturelle qui rend directement l’idée d’emmener quelqu’un et des animaux comme compagnons de voyage.
- source_word: παῖδα
  choice: un serviteur
  rationale: Dans ce contexte de voyage, le mot désigne vraisemblablement un serviteur ou un accompagnateur plutôt qu’un enfant; le statut juridique d’esclave n’est pas souligné.
- source_word: δύο καμήλους
  choice: deux chameaux
  rationale: Traduction directe du grec.
- source_word: πορεύθητι ἐν Ῥάγοις τῆς Μηδείας
  choice: va à Raguès, en Médie
  rationale: Avec le verbe de mouvement, la tournure indique ici la destination. « En Médie » situe naturellement la ville en français.
- source_word: παρὰ Γαβαήλ
  choice: chez Gabaël
  rationale: Avec une personne comme complément après un verbe de mouvement, παρά indique qu’il faut se rendre auprès d’elle, vraisemblablement à son domicile, sans ajouter explicitement « maison » au texte grec.
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: Rapporte-moi l’argent
  rationale: ἀργύριον signifie littéralement « argent » au sens du métal, mais désigne ici la somme confiée à Gabaël; κόμισαι exprime le fait de la ramener.
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: et amène-le avec toi
  rationale: Le pronom renvoie à Gabaël. « Amène-le » rend le mouvement d’une personne vers le locuteur, et « avec toi » explicite naturellement son accompagnement.
- source_word: εἰς τὸν γάμον
  choice: aux noces
  rationale: γάμος peut désigner le mariage ou sa célébration. « Aux noces » conserve cette latitude tout en convenant à l’invitation de Gabaël.
