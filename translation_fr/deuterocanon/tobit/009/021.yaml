translation:
  language: fr
  text: Tobit, son père, comptait les jours, jour après jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette page est particulièrement complexe et semble reprendre en double certains éléments du contexte voisin. Cette proposition forme une unité claire et est traduite directement; la suite de la page présente des formes textuelles qui se chevauchent.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλογίζετο
  choice: comptait
  rationale: L’imparfait exprime une action continue ou répétée. Le contexte précise que Tobit comptait les jours jusqu’au retour attendu de son fils.
- source_word: ἑκάστης ἡμέρας
  choice: les jours, jour après jour
  rationale: Cette formulation française rend clairement la répétition quotidienne et donne à « comptait » son complément naturel, sans anticiper les détails de la suite.
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  choice: Tobit, son père
  rationale: La virgule marque l’apposition grecque et identifie sans ambiguïté Tobit comme le père de Tobie.
