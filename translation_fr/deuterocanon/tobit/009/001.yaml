  text: And Tobiah called Raphael and said to him[a], “Azariah[b], brother,”
translation:
  language: fr
  text: 'Tobie appela Raphaël et lui dit[a] : « Azarias[b], mon frère, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raphaël est ici appelé « Azarias », nom sous lequel il voyage avec Tobie.
    reason: cross_reference
  - marker: b
    text: Dans une tradition textuelle plus longue, les instructions de Tobie à Azarias/Raphaël suivent immédiatement ; le texte grec suivi ici ne conserve dans ce verset que le début de l’adresse.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: L’aoriste de καλέω introduit ici la parole directe. « Appela » est naturel et ne renforce pas indûment le sens comme pourrait le faire « convoqua ».
- source_word: Τωβίας
  choice: Tobie
  rationale: « Tobie » est la forme française courante du nom dans ce livre et convient à un français moderne et accessible.
- source_word: Ῥαφαήλ
  choice: Raphaël
  rationale: Forme française usuelle du nom propre grec.
- source_word: Ἀζαρία
  choice: Azarias
  rationale: Le texte grec montre que Tobie s’adresse à Raphaël sous le nom qu’il emploie durant son voyage. « Azarias » est la forme française usuelle.
- source_word: ἀδελφέ
  choice: mon frère
  rationale: Le vocatif signifie littéralement « frère » et fonctionne ici comme une adresse chaleureuse. « Mon frère » est idiomatique en français sans transformer le terme en simple « ami ».
