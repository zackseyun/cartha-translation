- source_word: μετα / μετ
  choice: avec
  rationale: μετά devant une voyelle peut apparaître sous la forme μετ᾽; la leçon d’apparat signale donc une variation de forme. Faute de contexte syntaxique suffisant, le sens probable « avec » est documenté mais n’est pas intégré au texte traduit.
