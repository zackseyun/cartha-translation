  text: And they rose early together and came to the wedding[a], and Tobias blessed his wife.
translation:
  language: fr
  text: Ils se levèrent tôt ensemble et se rendirent aux noces[a], puis Tobias bénit sa femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au mariage » ou « au festin de noces ». Le grec γάμος peut désigner le mariage lui-même ou sa célébration.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρευσαν
  choice: se levèrent tôt
  rationale: Le verbe exprime le fait de se lever ou d’être debout de bonne heure; cette formulation conserve la nuance temporelle sans supposer explicitement un départ.
- source_word: κοινῶς
  choice: ensemble
  rationale: L’adverbe indique une action accomplie en commun; « ensemble » est naturel et clair en français.
- source_word: ἦλθοσαν
  choice: arrivèrent
  rationale: Dans ce contexte de déplacement vers les noces, « arrivèrent » rend naturellement l’aboutissement exprimé par « vinrent », sans dépendre du point de vue spatial du narrateur.
- source_word: γάμον
  choice: mariage
  rationale: γάμος peut désigner le mariage ou sa célébration. « Mariage » garde cette amplitude sémantique, tandis qu’une note signale l’autre nuance possible.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Le verbe signifie ici « bénir »; la traduction reste simple et ne précise ni formule ni rite absents du grec.
- source_word: Τωβείας
  choice: Tobias
  rationale: « Tobias » est la forme française traditionnelle correspondant au grec Τωβείας dans le livre de Tobit.
- source_word: γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte conjugal, γυνή désigne clairement l’épouse.
theological_decisions:
- issue: Nature de l’action de Tobias envers Sara dans εὐλόγησεν ... τὴν γυναῖκα αὐτοῦ
  choice: Tobias bénit sa femme
  alternative: Tobias prononça une bénédiction sur sa femme
  rationale: Le texte rapporte une bénédiction sans en indiquer la forme ni le contenu. La formulation retenue préserve cette indétermination et n’importe aucune pratique rituelle ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination finale est rendue par « puis » pour une narration fluide, sans ajouter de contenu causal. Le marqueur [a] figure bien dans le texte principal.
