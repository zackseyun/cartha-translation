- source_word: ὠμόμοκεν
  choice: a juré
  rationale: Le parfait grec présente un serment accompli dont l’effet demeure; le passé composé l’exprime idiomatiquement en français.
- source_word: ὁ Ῥαγουὴλ
  choice: Ragouël
  rationale: Transcription française courante du nom grec, avec tréma pour signaler la prononciation séparée des voyelles.
- source_word: μὴ ἐξελθεῖν με
  choice: de ne pas me laisser partir
  rationale: Rend naturellement, dans le contexte, l’interdiction de départ impliquée par le serment. Le grec dit plus littéralement « que je ne sorte pas ».
