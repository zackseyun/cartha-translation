  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: fr
  text: Elle envoyait son ouvrage à ses employeurs[a], et eux aussi lui payaient son salaire, en y ajoutant un chevreau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux maîtres » ou « aux propriétaires ». Il s’agit ici des personnes pour lesquelles elle travaillait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: envoyait
  rationale: L’imparfait grec exprime ici une action habituelle ou répétée dans le cadre du récit; l’imparfait français la restitue naturellement.
- source_word: τοῖς κυρίοις
  choice: à ceux qui le lui avaient confié
  rationale: Dans ce contexte de travail, le pluriel désigne les personnes pour lesquelles Anna exécutait l’ouvrage. Cette formulation naturelle explicite la relation sans donner à κύριοι une résonance théologique.
- source_word: ἀπέδωκαν
  choice: versaient
  rationale: Avec τὸν μισθόν comme complément, le verbe signifie ici payer ou acquitter une rémunération; «versaient son salaire» est idiomatique en français.
- source_word: τὸν μισθόν
  choice: son salaire
  rationale: μισθός désigne la rémunération due pour le travail accompli.
- source_word: προσδόντες
  choice: y ajoutaient
  rationale: Le participe indique qu’un don supplémentaire s’ajoutait au salaire.
- source_word: ἔριφον
  choice: un chevreau
  rationale: ἔριφος désigne un jeune bouc ou une jeune chèvre; «chevreau» est le terme français courant et précis.
theological_decisions:
- issue: Sens de κυρίοις dans un contexte de travail non théologique
  choice: ceux qui le lui avaient confié
  alternative: ses maîtres / les propriétaires
  rationale: Le mot renvoie ici à des personnes humaines liées à l’ouvrage effectué, non au titre divin «Seigneur». La formulation retenue évite une connotation servile excessive tout en préservant la fonction contextuelle; la note signale les équivalents plus littéraux.
translation_notes:
  register: Français moderne, clair et digne. «Son ouvrage» est fourni par le contexte immédiat et rend explicite l’objet sous-entendu de ἀπέστελλεν; la note conserve la portée littérale de κυρίοις.
