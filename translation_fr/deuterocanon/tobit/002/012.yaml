  source_fidelity: Le sens général est bien rendu, y compris les imparfaits habituels et le supplément d’un chevreau. Toutefois, « ensuite » n’est pas exprimé par le grec, et « ceux qui le lui avaient confié » introduit à la fois l’idée non explicite de la remise préalable de l’ouvrage et un plus-que-parfait absent du texte. Le terme κυρίοις doit garder, avec une note, sa marge entre « maîtres » et « propriétaires » dans ce contexte de travail.
  naturalness: La phrase est naturelle, mais « à ses employeurs » est plus direct et idiomatique que la périphrase proposée. « Lui payaient son salaire » est courant et convient au registre.
  terminology: « Chevreau » rend précisément ἔριφον. « Employeurs » rend fonctionnellement κυρίοις dans le contexte sans lui attribuer de sens théologique; la note conserve les possibilités littérales « maîtres » et « propriétaires ».
