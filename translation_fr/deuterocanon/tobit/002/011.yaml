  rationale: Le verbe exprime l’exercice d’un travail, probablement rémunéré, sans préciser à lui seul un métier particulier.
- source_word: ἐν τοῖς γυναικείοις
  choice: des travaux de femmes
  rationale: La formule renvoie vraisemblablement au domaine des tâches habituellement accomplies par les femmes, tout en évitant de préciser indûment un artisanat particulier.
