    issue: Rendu de ἀνέλυσα θάψας
    rationale: «Après être parti l’enterrer» présente le départ comme préalable et orienté vers l’ensevelissement, alors que θάψας marque l’ensevelissement comme achevé. Le contexte soutient «après l’avoir enterré, je rentrai». Cette correction évite de modifier la chronologie de l’action.
