  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: fr
  text: Cette nuit-là même, après l’avoir enterré, je rentrai et me couchai, en état d’impureté[a], près du mur de la cour, le visage découvert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «souillé». Il s’agit ici d’une impureté rituelle liée à l’ensevelissement, et non nécessairement d’une faute morale.
    reason: Préciser la valeur cultuelle de μεμιαμμένος et signaler une autre traduction possible.
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: Cette nuit-là même
  rationale: La tournure démonstrative et intensive souligne qu’il s’agit précisément de cette nuit-là; cette formulation est naturelle en français moderne.
- source_word: ἀνέλυσα θάψας
  choice: après être parti l’enterrer
  rationale: La séquence indique un départ lié à l’ensevelissement accompli; l’infinitif avec pronom objet explicite naturellement en français la personne sous-entendue par le contexte.
- source_word: ἐκοιμήθην
  choice: je me couchai
  rationale: Le contexte décrit l’endroit et la posture avant l’incident suivant; «se coucher» rend concrètement l’action sans affirmer davantage sur la durée du sommeil.
- source_word: μεμιαμμένος
  choice: en état d’impureté
  rationale: Le participe parfait exprime un état résultant de l’ensevelissement. «Impureté» conserve ici la dimension rituelle sans suggérer nécessairement une faute morale.
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: près du mur de la cour
  rationale: Rendu spatial direct et idiomatique; «cour» convient au cadre domestique.
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: le visage découvert
  rationale: Le grec nomme explicitement le visage, et non la tête. La formulation française reste concise et prépare l’incident qui suit.
theological_decisions:
- issue: Nature de l’impureté résultant de l’ensevelissement
  choice: en état d’impureté
  alternative: souillé; impur
  rationale: Le contexte renvoie à une impureté rituelle liée à l’ensevelissement, non nécessairement à une culpabilité morale. Le choix préserve cette distinction sans l’expliciter excessivement dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; la syntaxe reste claire pour un lectorat général. Le marqueur [a] figure immédiatement après l’expression concernée.
