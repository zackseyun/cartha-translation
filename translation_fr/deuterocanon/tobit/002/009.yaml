  source_fidelity: La traduction de μεμιαμμένος comme «en état d’impureté» rend bien l’état d’impureté rituelle. En revanche, «après être parti l’enterrer» inverse ou brouille la relation du participe aoriste θάψας («après l’avoir enterré») avec ἀνέλυσα. Dans le contexte narratif, ἀνέλυσα se comprend naturellement comme un retour après l’ensevelissement.
  naturalness: Le français est globalement naturel et le passé simple convient au récit. «Après l’avoir enterré, je rentrai et me couchai» est plus clair, plus idiomatique et restitue mieux l’enchaînement narratif. «Le visage découvert» est une apposition française naturelle qui conserve l’information du grec.
  terminology: «Impureté» est le terme approprié pour éviter une lecture de faute morale. La note explique utilement sa portée rituelle. «Cour» convient pour αὐλή dans ce contexte domestique.
  issues:
