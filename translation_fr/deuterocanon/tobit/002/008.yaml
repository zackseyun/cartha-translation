base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: fr
  text: 'Et les voisins se moquaient de lui[a] en disant : « Il n’a plus peur d’être mis à mort à cause de cette affaire ! Il s’est enfui, et voilà qu’il enterre de nouveau les morts. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'D’autres traditions textuelles de Tobit présentent ici un contenu très différent. La rétroversion hébraïque indirecte fait parler Anne : elle évoque les actes de bonté et de justice de Tobit, qui ne lui sont d’aucun secours dans sa détresse et sa honte, au lieu de rapporter les moqueries des voisins au sujet de l’ensevelissement des morts.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: les voisins
  rationale: Le substantif pluriel désigne naturellement les personnes du voisinage ; « les voisins » est clair et idiomatique.
- source_word: ἐνέγελων
  choice: se moquaient de lui
  rationale: L’imparfait exprime une raillerie en cours ou répétée ; le complément « de lui » rend explicite en français la cible indiquée par le contexte.
- source_word: Οὐκέτι φοβεῖται
  choice: Il n’a donc plus peur
  rationale: Cette formulation actuelle conserve l’idée qu’il a cessé de craindre ; « donc » fait entendre la pointe sarcastique sans modifier le contenu de l’accusation.
- source_word: φονευθῆναι
  choice: d’être mis à mort
  rationale: L’infinitif passif désigne le fait d’être tué. « Mis à mort » convient à la menace encourue sans préciser indûment sa nature juridique.
- source_word: περὶ τοῦ πράγματος τούτου
  choice: pour cela
  rationale: Dans ce contexte, περί peut indiquer le motif ou l’affaire en cause ; « pour cela » est naturel et garde la référence à l’acte déjà connu.
- source_word: ἀπέδρα
  choice: Il s’est enfui
  rationale: L’aoriste rappelle sa fuite antérieure ; « s’est enfui » est précis, courant et plus digne que « a pris la fuite » ou « s’est sauvé ».
- source_word: καὶ ἰδοὺ
  choice: et voilà que
  rationale: Cette tournure française rend l’effet présentatif et frappant de ἰδού dans la raillerie.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend directement la répétition de l’action, dans un registre naturel.
- source_word: θάπτει τοὺς νεκρούς
  choice: il enterre les morts
  rationale: Après « voilà que », le présent français met naturellement sous les yeux l’action reprise.
theological_decisions:
- issue: Choix entre le témoin grec et la tradition sémitique indirecte
  choice: Le texte principal suit le grec, où les voisins raillent Tobit parce qu’il recommence à enterrer les morts.
  alternative: La rétroversion hébraïque indirecte présente Anne reprochant à Tobit que ses actes de bonté et de justice ne lui servent pas dans sa détresse et sa honte.
  rationale: Le grec de l’édition indiquée constitue ici le témoin source principal. Le texte hébreu cité est une rétroversion moderne issue d’un manuscrit araméen et ne doit donc pas supplanter le grec, bien qu’il atteste une divergence textuelle importante.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde le ton sarcastique des voisins grâce à « donc » et « voilà que », sans archaïsme. La ponctuation française est employée.
