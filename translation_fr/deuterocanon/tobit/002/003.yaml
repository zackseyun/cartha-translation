base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: fr
  text: 'Il arriva et dit : « Père, l’un des nôtres[a] a été étranglé et jeté sur la place du marché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelqu’un de notre parenté ». Le grec emploie γένος, terme qui peut désigner la famille, le groupe de parenté ou le peuple auquel on appartient.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Il arriva
  rationale: Le participe aoriste, antérieur au verbe principal, est rendu par une proposition coordonnée naturelle en français narratif.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif est conservé sans ajouter le possessif « mon », absent du grec.
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: l’un des nôtres
  rationale: γένος peut désigner la parenté, le groupe d’origine ou le peuple. « L’un des nôtres » garde cette amplitude et convient à l’appartenance communautaire évoquée ici.
- source_word: ἐστραγγαλωμένος
  choice: a été étranglé
  rationale: Le participe parfait passif indique une mort par strangulation; cette traduction évite de préciser sans preuve une pendaison.
- source_word: ἔρριπται
  choice: jeté
  rationale: Le parfait passif de ῥίπτω exprime que le corps a été jeté et demeure là. Le français coordonne naturellement les deux passifs sous « a été ».
- source_word: ἐν τῇ ἀγορᾷ
  choice: sur la place du marché
  rationale: ἀγορά désigne la place publique où se tient le marché. Cette formulation restitue à la fois le lieu civique et sa fonction commerciale.
theological_decisions:
- issue: Portée de γένος ἡμῶν
  choice: 'Appartenance communautaire ou ethnique : « l’un des nôtres »'
  alternative: 'Parenté familiale plus étroite : « quelqu’un de notre parenté »'
  rationale: Le contexte concerne un membre du peuple de Tobit à ensevelir, sans établir qu’il s’agit d’un proche parent. La formulation retenue préserve la largeur sémantique du grec sans exclure la parenté.
translation_notes:
  register: Français moderne, sobre et narratif. Le passif maintient l’absence d’agent dans le grec; « place du marché » rend le cadre public de l’ἀγορά sans archaïsme.
