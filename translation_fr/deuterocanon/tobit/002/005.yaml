base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: fr
  text: À mon retour, je me lavai[a], puis je mangeai mon pain[b] dans la tristesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « je me lavai ». Dans ce contexte, il s’agit probablement du lavage effectué après avoir contracté une impureté au contact d’un mort ; la tradition sémitique parallèle rend ce cadre de pureté plus explicite.
    reason: cultural_note
  - marker: b
    text: Ou « mon repas ». Le grec dit littéralement « mon pain », expression qui peut aussi désigner plus largement la nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: À mon retour
  rationale: Le participe aoriste marque une action antérieure aux verbes principaux. Cette tournure restitue naturellement la succession temporelle sans surtraduire le mouvement comme un simple demi-tour.
- source_word: ἐλουσάμην
  choice: je me lavai
  rationale: La voix moyenne indique naturellement que Tobit se lave lui-même. Le contexte suggère un lavage lié à l’impureté contractée au contact d’un mort, mais le grec ne dit pas explicitement « je me purifiai ».
- source_word: ἤσθιον
  choice: je mangeai
  rationale: Dans cette séquence narrative, l’imparfait grec peut être rendu par le passé simple français. Le texte présente l’action sans exiger que son déroulement soit souligné.
- source_word: τὸν ἄρτον μου
  choice: mon pain
  rationale: ἄρτος désigne littéralement le pain, tout en pouvant représenter plus largement la nourriture ou le repas. « Mon pain » conserve l’image concrète du grec.
- source_word: ἐν λύπῃ
  choice: dans la tristesse
  rationale: λύπη exprime la tristesse, le chagrin ou l’affliction. « Dans la tristesse » reste proche de la construction grecque et convient au contexte de deuil.
theological_decisions:
- issue: Faut-il expliciter le caractère rituel du lavage ?
  choice: Conserver « je me lavai » dans le texte principal.
  alternative: « je me purifiai » ou « je pris un bain de purification »
  rationale: Le contexte et la tradition sémitique parallèle orientent vers un lavage après contact avec un mort, mais le grec n’explicite pas la purification rituelle. La traduction préserve cette retenue et apporte le contexte en note.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation conserve la sobriété du grec et place chaque appel de note immédiatement après l’expression concernée.
