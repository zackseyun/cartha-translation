base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: fr
  text: 'Je vis beaucoup de nourriture[a] et je dis à mon fils : « Va, et amène l’un de nos frères[b] que tu trouveras dans le besoin et qui se souvient du Seigneur. Vois, je t’attends[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreux mets »; le mot grec désigne des aliments préparés servis au cours d’un repas.
    reason: lexical_alternative
  - marker: b
    text: Ici, « nos frères » désigne les membres du peuple de Tobit, et non seulement ses frères biologiques.
    reason: cultural_note
  - marker: c
    text: La fin de la phrase est inhabituelle dans la tradition manuscrite grecque; le sens paraît être que Tobit reste sur place en attendant le retour de son fils.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: je vis
  rationale: L’aoriste de θεάομαι exprime ici simplement la perception. « Je vis » suit naturellement la progression du récit sans archaïsme inutile.
- source_word: ὄψα πολλά
  choice: une grande quantité de nourriture
  rationale: ὄψα désigne des aliments préparés ou des mets servis au repas. Cette formulation française est claire et n’impose pas un menu précis; les autres possibilités sont signalées en note.
- source_word: Βάδισον
  choice: Va
  rationale: Dans cet ordre adressé au fils, l’impératif « Va » rend idiomatiquement βαδίζω; « Marche » serait trop littéral.
- source_word: ἄγαγε
  choice: amène
  rationale: L’impératif de ἄγω demande au fils de conduire une personne auprès de Tobit. « Amène » rend explicitement ce mouvement vers le locuteur.
- source_word: ὃν ἐὰν εὕρῃς
  choice: celui … que tu trouveras
  rationale: 'La construction relative avec ἐάν reste indéfinie : il ne s’agit pas d’une personne déjà déterminée, mais de celle que le fils pourra trouver.'
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: de nos frères
  rationale: Le terme familial masculin est conservé, tandis qu’une note précise qu’il désigne ici les membres du même peuple et non seulement des frères biologiques.
- source_word: ἐνδεής
  choice: dans le besoin
  rationale: Cette expression couvre le manque et la pauvreté sans réduire le sens à l’insuffisance d’argent.
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: qui se souvient du Seigneur
  rationale: La traduction garde le sens transparent de μέμνηται, « se souvenir de, garder présent à l’esprit », ainsi que « Seigneur » pour κύριος.
- source_word: ἰδοὺ μένω σε
  choice: Voici, je t’attends
  rationale: La formulation conserve ἰδού et le présent de μένω tout en donnant à μένω σε le sens contextuel d’attendre le retour du fils. L’étrangeté du grec transmis est signalée en note.
theological_decisions:
- issue: Traduction de κύριος dans la formule de piété
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κύριος et non le tétragramme hébreu. « Le Seigneur » traduit donc directement le témoin principal sans reconstruire un autre texte sous-jacent.
- issue: Portée de ἀδελφῶν ἡμῶν
  choice: nos frères
  alternative: les gens de notre peuple
  rationale: Le contexte vise vraisemblablement les membres du peuple de Tobit, mais le texte emploie un terme masculin de parenté. Le texte principal le conserve et la note en explicite la portée communautaire.
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste au passé simple, tandis que le discours direct emploie des impératifs et un présent naturels. « Voici » conserve la particule de présentation grecque malgré une légère étrangeté, expliquée en note.
