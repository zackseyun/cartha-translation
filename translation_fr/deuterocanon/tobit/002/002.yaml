    rationale: La construction grecque ὃν ἐὰν εὕρῃς désigne toute personne qui pourrait être trouvée. « L’un de nos frères que tu trouveras » le marque plus naturellement et sans suggérer une personne déterminée.
  - severity: low
    issue: Formulation légèrement lourde et peu idiomatique
    rationale: « Une grande quantité de nourriture » et « Voici, je t’attends » sont compréhensibles, mais « beaucoup de nourriture » et « Vois, je t’attends » correspondent mieux au français international moderne sans perdre le sens du grec.
