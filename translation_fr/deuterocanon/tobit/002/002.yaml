  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : Tobit voit des mets en abondance, envoie son fils chercher un membre nécessiteux de leur communauté qui se souvient du Seigneur, puis déclare qu’il l’attend. La relative indéfinie ὃν ἐὰν εὕρῃς est toutefois plus nettement exprimée par « l’un de nos frères que tu trouveras » que par « celui de nos frères que tu trouveras ».'
  naturalness: Le français est clair et de registre approprié. « Une grande quantité de nourriture » est un peu lourd pour ὄψα πολλά; « beaucoup de nourriture » est plus idiomatique. « Voici, je t’attends » est possible mais peu naturel en français moderne; « Vois, je t’attends » conserve la valeur présentative de ἰδού tout en étant plus fluide. La note maintient à juste titre la réserve sur la tournure grecque.
  terminology: « Seigneur » rend correctement κύριος. « Nos frères » préserve le terme de parenté masculin du grec, et la note explique adéquatement son sens communautaire. « Dans le besoin » rend bien ἐνδεής.
