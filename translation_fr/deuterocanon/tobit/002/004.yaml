  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: fr
  text: Et moi, avant d’avoir goûté quoi que ce soit, je me levai d’un bond et l’emportai dans une pièce, jusqu’à ce que le soleil se couche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεύσασθαί
  choice: avoir goûté
  rationale: Conserve l’image concrète du verbe grec; « quoi que ce soit » explicite naturellement en français l’objet sous-entendu dans le contexte du repas.
- source_word: ἀναπηδήσας
  choice: je me levai d’un bond
  rationale: Rend le mouvement soudain et énergique exprimé par le participe grec.
- source_word: ἀνειλόμην
  choice: l’emportai
  rationale: Dans ce contexte funéraire, le verbe indique que Tobit prend le corps et le met à l’écart; « emporter » reste concret sans ajouter l’idée d’ensevelissement.
- source_word: εἰς τι οἴκημα
  choice: dans une pièce
  rationale: Rend l’indéfini τι et le sens contextuel d’un espace intérieur, sans préciser une fonction absente du grec.
