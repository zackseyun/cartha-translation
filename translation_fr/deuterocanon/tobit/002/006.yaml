base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: fr
  text: 'Je me suis souvenu de la prophétie d’Amos[a], comme il l’avait dit : « Vos fêtes seront changées en deuil, et toutes vos réjouissances en lamentation. » Et j’ai pleuré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La parole citée fait écho à Amos 8.10 dans la tradition de la Septante.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: je me suis souvenu
  rationale: Le verbe déponent a ici un sens actif. Le passé composé donne une narration naturelle en français moderne tout en exprimant directement le rappel à la mémoire.
- source_word: προφητείας
  choice: prophétie
  rationale: Le singulier désigne ici la parole prophétique précise d’Amos qui est ensuite citée.
- source_word: Στραφήσονται
  choice: seront changées
  rationale: Le futur passif exprime le renversement que subiront les fêtes, sans préciser explicitement l’agent de cette transformation.
- source_word: ἑορταὶ
  choice: fêtes
  rationale: Ce terme courant convient aux célébrations collectives et religieuses sans donner au mot un sens uniquement alimentaire.
- source_word: πένθος
  choice: deuil
  rationale: Le mot évoque un deuil manifesté publiquement, en contraste direct avec les fêtes.
- source_word: εὐφροσύναι
  choice: réjouissances
  rationale: Le pluriel désigne les manifestations et les occasions de joie; « réjouissances » conserve cette dimension collective et festive.
- source_word: θρῆνον
  choice: lamentations
  rationale: Le terme désigne l’expression solennelle du deuil plutôt qu’une simple tristesse intérieure.
- source_word: ἔκλαυσα
  choice: j’ai pleuré
  rationale: Cette formulation simple et digne rend directement l’aoriste narratif et la réaction de Tobit.
theological_decisions:
- issue: Forme de la citation intégrée d’Amos
  choice: 'Conserver une citation prophétique directe adressée à un « vous » pluriel : « Vos fêtes seront changées en deuil, et toutes vos réjouissances en lamentations. »'
  alternative: 'Reformuler à la voix active, par exemple : « Je changerai vos fêtes en deuil », conformément à d’autres formes textuelles d’Amos 8.10.'
  rationale: Le grec de Tobit présente explicitement un futur passif et cite la parole comme une adresse directe au pluriel. La traduction conserve donc la formulation propre à ce témoin sans l’harmoniser avec une autre tradition textuelle d’Amos.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé assure une narration accessible; la citation garde un ton prophétique plus solennel. Le parallélisme entre « fêtes / deuil » et « réjouissances / lamentations » est conservé.
