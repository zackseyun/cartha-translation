  text: And I wept. And when the sun had set[a], I went and dug and buried him.
translation:
  language: fr
  text: Et je pleurai. Quand le soleil se fut couché, je partis, puis je creusai et l’enterrai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα
  choice: je pleurai
  rationale: L’aoriste de κλαίω exprime ici l’action de pleurer; le passé simple convient au récit et préserve la force émotionnelle sans préciser un deuil rituel.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: quand le soleil se fut couché
  rationale: Le plus-que-parfait marque naturellement en français que le coucher du soleil précède le départ et l’ensevelissement.
- source_word: ᾠχόμην
  choice: je partis
  rationale: Le verbe indique que le narrateur s’en alla; « je partis » est naturel et légèrement plus précis que « j’allai » sans ajouter de destination.
- source_word: ὀρύξας
  choice: puis je creusai
  rationale: Le participe aoriste indique une action antérieure ou étroitement liée à l’ensevelissement. Aucun complément tel que « une tombe » n’est exprimé dans le grec; le français conserve donc cette implicitation.
- source_word: ἔθαψα αὐτόν
  choice: je l’enterrai
  rationale: Rendu direct et courant de θάπτω avec le pronom masculin αὐτόν.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple maintient la concision solennelle du récit. La coordination grecque est légèrement fluidifiée par « puis », tout en conservant l’ordre des actions et sans expliciter l’objet de « creuser ».
