  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: fr
  text: Je ne savais pas qu’il y avait des moineaux dans le mur[a]. Alors que j’avais les yeux ouverts, les moineaux laissèrent tomber dans mes yeux des fientes chaudes, et des opacités blanches se formèrent dans mes yeux[b]. Je consultai alors des médecins, mais ils ne purent rien pour moi. Ahikar subvint à mes besoins jusqu’à mon départ pour l’Élymaïde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de petits oiseaux » ; le mot grec peut désigner plus généralement de petits oiseaux, bien que « moineaux » soit ici le sens le plus probable.
    reason: lexical_alternative
  - marker: b
    text: Le grec parle de formations ou d’opacités blanches dans les yeux. On les comprend souvent comme une affection semblable à la cataracte, mais le texte ne donne pas de diagnostic médical précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: moineaux
  rationale: Le diminutif grec désigne couramment des moineaux, tout en pouvant s’appliquer plus largement à de petits oiseaux; la note conserve cette latitude.
- source_word: ἐν τῷ τοίχῳ
  choice: dans le mur
  rationale: Cette formulation suit directement le grec et peut évoquer des oiseaux logés dans une cavité du mur sans préciser davantage.
- source_word: ἀνεῳγότων
  choice: Comme j’avais les yeux ouverts
  rationale: Rend naturellement la valeur circonstancielle du génitif absolu tout en conservant l’état décrit.
- source_word: ἀφώδευσαν ... θερμὰ
  choice: laissèrent tomber leurs excréments encore chauds
  rationale: Le verbe grec est concret et désigne la défécation; cette tournure reste claire et digne sans en atténuer le sens. «Encore chauds» exprime ici naturellement θερμά.
- source_word: λευκώματα
  choice: taches blanches
  rationale: Le terme désigne des formations ou opacités blanches de l’œil sans fournir un diagnostic médical moderne précis.
- source_word: ἰατρούς
  choice: médecins
  rationale: Équivalent français courant, précis et adapté au registre narratif.
- source_word: οὐκ ὠφέλησάν με
  choice: ils ne purent rien pour moi
  rationale: Rend idiomatiquement l’idée que leurs soins ne lui apportèrent aucun bénéfice, sans préciser le traitement.
- source_word: ἔτρεφέν με
  choice: pourvut à mes besoins
  rationale: τρέφω peut signifier nourrir ou entretenir; dans ce contexte de dépendance, la formulation française conserve cette portée générale.
- source_word: Ἀχειαχάρος
  choice: Ahikar
  rationale: Forme française usuelle du nom de ce personnage dans la tradition du livre de Tobit.
- source_word: Ἐλυμαΐδα
  choice: l’Élymaïde
  rationale: Forme française traditionnelle et reconnaissable du nom géographique grec.
theological_decisions:
- issue: Nature de l’affection oculaire de Tobit
  choice: Décrire des «taches blanches» sans établir de diagnostic
  alternative: Traduire par «cataractes» ou par un autre terme médical précis
  rationale: Le grec décrit des formations blanches sur les yeux, mais ne permet pas d’identifier avec certitude une affection selon la nosologie moderne.
translation_notes:
  register: Français international moderne, narratif et digne. Le récit à la première personne et l’enchaînement des propositions sont conservés, avec une syntaxe naturelle. Les termes médicaux restent descriptifs plutôt que diagnostiques.
