  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: fr
  text: 'Mais lorsqu’elle vint auprès de moi, elle se mit à crier. Je lui dis : « D’où vient ce chevreau ? Ne serait-il pas volé ? Rends-le à ses propriétaires, car il n’est pas permis de manger ce qui a été volé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο κράζειν
  choice: elle se mit à crier
  rationale: La tournure marque le début d’une parole forte. « Se mit à crier » en conserve l’intensité sans préciser s’il s’agit de colère, de détresse ou de protestation.
- source_word: Πόθεν τὸ ἔριφον;
  choice: D’où vient ce chevreau ?
  rationale: πόθεν interroge sur la provenance, et ἔριφον désigne un jeune bouc ou une jeune chèvre. « Chevreau » est le terme français naturel et précis.
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: Ne serait-il pas volé ?
  rationale: κλεμμάιον désigne une chose volée. La question introduite par μή exprime ici le soupçon; le conditionnel français rend naturellement cette nuance sans transformer le soupçon en certitude.
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: Rends-le à ses propriétaires
  rationale: ἀπόδος ordonne de restituer, et κυρίοις désigne ici les personnes auxquelles appartient l’animal. « Propriétaires » évite le sens théologique que pourrait suggérer « seigneurs ».
- source_word: θεμιτὸν
  choice: permis
  rationale: Le mot désigne ce qui est admis par la règle, la coutume ou le droit. Dans la formulation négative, « il n’est pas permis » restitue clairement sa portée morale et normative en français moderne.
- source_word: φαγεῖν κλεψιμαῖον
  choice: manger ce qui a été volé
  rationale: Cette formulation idiomatique conserve la portée générale de l’expression grecque sans réduire celle-ci à une catégorie particulière de nourriture.
theological_decisions:
- issue: Portée morale et normative de θεμιτὸν dans l’objection de Tobit
  choice: car il n’est pas permis de manger ce qui a été volé
  alternative: car il n’est pas juste de manger ce qui a été volé
  rationale: « Il n’est pas permis » maintient la force normative du grec, tandis que « il n’est pas juste » déplacerait légèrement l’accent vers une appréciation morale plus générale. La traduction n’identifie pas cette norme à un système juridique ultérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste vif sans devenir familier. Aucun renvoi n’est nécessaire pour ἔριφον, puisque « chevreau » est précis et non ambigu en français; le marqueur de la couche anglaise était en outre rattaché à un emplacement qui ne correspondait pas au contenu de sa note.
