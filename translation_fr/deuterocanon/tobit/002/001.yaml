base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: fr
  text: Quand je rentrai chez moi et qu’Anna, ma femme, et Tobie, mon fils, me furent rendus, lors de la fête de la Pentecôte, qui est la sainte fête des sept semaines[a], on me prépara un bon repas[b]. Je m’allongeai à table pour manger[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Pentecôte » est ici la fête juive des Semaines, célébrée sept semaines après la Pâque.
    reason: alternative_reading
  - marker: b
    text: 'La tradition sémitique parallèle présente ici un texte plus développé : Tobie est envoyé inviter un parent pauvre à partager le repas. Cet élément ne figure pas dans la formulation grecque plus courte traduite ici.'
    reason: textual_variant
  - marker: c
    text: 'Le grec dit littéralement : « je m’allongeai pour manger » ; cette expression évoque la coutume antique de prendre les repas allongé à table.'
    reason: cultural_note
lexical_decisions:
- source_word: κατῆλθον εἰς τὸν οἶκόν μου
  choice: je fus descendu chez moi
  rationale: Conserve la nuance directionnelle de κατέρχομαι tout en rendant οἶκος naturellement par « chez moi » dans ce contexte de retour au domicile.
- source_word: ἀπεδόθη μοι
  choice: m’eurent été rendus
  rationale: Le passif de ἀποδίδωμι exprime le fait qu’Anna et Tobie ont été rendus à Tobit; le plus-que-parfait marque naturellement l’antériorité par rapport au repas.
- source_word: Ἄννα ἡ γυνή μου
  choice: Anna, ma femme
  rationale: Translittère directement la forme grecque du nom et traduit l’apposition sans ajout.
- source_word: Τωβίας ὁ υἱός μου
  choice: Tobie, mon fils
  rationale: « Tobie » est la forme française moderne usuelle du nom biblique, distincte et naturelle pour le lectorat francophone.
- source_word: ἐν τῇ πεντηκοστῇ ἑορτῇ
  choice: lors de la fête de la Pentecôte
  rationale: Maintient le terme grec πεντηκοστή, tandis que l’explication qui suit l’identifie clairement comme la fête juive des Semaines.
- source_word: ᾗ ἐστιν ἁγία ἑπτὰ ἑβδομάδων
  choice: qui est la sainte fête des sept semaines
  rationale: Le grec transmis est quelque peu elliptique; l’ajout de « fête » en français explicite le nom sous-entendu sans résoudre davantage la formulation.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: on me prépara un bon repas
  rationale: Rend idiomatiquement l’expression littérale « un bon repas advint pour moi » et conserve la valeur de καλόν.
- source_word: ἀνέπεσα τοῦ φαγεῖν
  choice: je m’allongeai à table pour manger
  rationale: Exprime la posture antique du repas portée par ἀναπίπτω; « à table » empêche de comprendre un simple coucher.
theological_decisions:
- issue: Désignation de πεντηκοστή dans un récit juif
  choice: la fête de la Pentecôte ... la sainte fête des sept semaines
  alternative: la fête des Semaines
  rationale: La traduction retient le terme explicite du grec et son explication immédiate, évitant de donner à « Pentecôte » un sens exclusivement chrétien.
- issue: Portée de la tradition sémitique parallèle plus longue
  choice: traduire uniquement la formulation grecque courte dans le corps du texte
  alternative: inclure l’envoi de Tobie auprès d’un parent pauvre
  rationale: Le grec de Swete fourni comme ancrage principal ne contient pas cet épisode; la divergence est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; « chez moi » et « bon repas » restent accessibles. Les appositions préservent la structure grecque sans lourdeur excessive.
