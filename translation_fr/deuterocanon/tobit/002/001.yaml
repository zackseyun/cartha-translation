  to: Quand je rentrai chez moi et qu’Anna, ma femme, et Tobie, mon fils, me furent rendus, lors de la fête de la Pentecôte, qui est la sainte fête des sept semaines[a], on me prépara un bon repas[b]. Je m’allongeai à table pour manger[c].
  rationale: La révision améliore la lisibilité moderne et la syntaxe sans modifier le sens du grec. Elle conserve le nom grec de la fête avec son explication immédiate, ne verse pas dans le texte grec le supplément de la tradition sémitique parallèle et sépare les notes afin que chaque appel soit correctement ancré.
