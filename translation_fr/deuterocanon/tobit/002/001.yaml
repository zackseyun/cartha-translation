review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : le retour au domicile, la restitution d’Anna et de Tobie, la fête des sept semaines, le repas et la posture de repas sont tous conservés. « Je fus descendu chez moi » est toutefois ambigu et peu naturel en français actuel, où il peut suggérer une descente physique ou une tournure passive. « Je rentrai chez moi » rend clairement la situation narrative, sans prétendre surcharger la nuance directionnelle de κατῆλθον.'
  naturalness: Le passé simple convient au registre narratif. La coordination « Anna ... ainsi que Tobie ... m’eurent été rendus » est lourde et son accord s’accorde mal avec « ainsi que ». Une coordination explicite et le passé simple sont plus fluides. Les deux informations de note actuellement réunies sous le seul appel b doivent recevoir des ancres distinctes, chacune au point du texte auquel elle se rapporte.
  terminology: « Anna », « Tobie », « ma femme », « mon fils », « fête de la Pentecôte » et « la sainte fête des sept semaines » sont appropriés. « Tobie » est la forme française biblique courante. « M’allongeai à table » conserve utilement la posture exprimée par ἀνέπεσα ; la note culturelle la précise.
  issues:
  - severity: medium
    issue: Tournure « je fus descendu chez moi »
    rationale: Bien que grammaticalement possible dans un style ancien, elle est ambiguë et peu idiomatique en français international moderne. Le grec situe Tobit à son retour à la maison ; « je rentrai chez moi » le rend naturellement.
  - severity: medium
    issue: Accord et lourdeur de « Anna ... ainsi que Tobie ... m’eurent été rendus »
    rationale: « Ainsi que » entraîne habituellement l’accord avec le premier terme et alourdit la phrase. « Anna ... et Tobie ... me furent rendus » rend sans ambiguïté les deux personnes visées.
  - severity: medium
    issue: Une seule note b couvre deux sujets et la variante textuelle n’a pas d’ancre propre
    rationale: La variante sémitique concerne le repas, tandis que la précision sur le fait de s’allonger concerne ἀνέπεσα. Des appels séparés permettent des ancres exactes et des raisons de note distinctes.
