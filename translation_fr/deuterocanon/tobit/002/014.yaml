  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: fr
  text: 'Mais elle répondit[a] : « On me l’a donné en cadeau en plus de mon salaire. » Je ne la croyais pas et je lui disais de le rendre à ses propriétaires[b] ; j’en rougissais devant elle[c]. Alors elle me répondit : « Où sont tes actes de compassion et tes œuvres de justice[d] ? Vois : tout ce qui te concerne est connu[e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On me l’a donné avec mon salaire » ou « comme salaire ». Le grec rattache le cadeau à sa rémunération sans préciser entièrement la nature de ce lien.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à ses maîtres » ; dans ce contexte, il s’agit de ceux à qui l’animal appartient.'
    reason: lexical_alternative
  - marker: c
    text: Le grec évoque le fait de rougir, expression qui peut marquer la honte ou l’embarras.
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « tes aumônes et tes actes de justice ».'
    reason: lexical_alternative
  - marker: e
    text: 'Littéralement, formule condensée : « voici, toutes choses sont connues avec toi ». Elle peut aussi se comprendre : « tout est manifeste à ton sujet ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: Δῶρον
  choice: cadeau
  rationale: Le nom désigne un don ou un présent ; « cadeau » est naturel dans ce contexte domestique.
- source_word: ἐπὶ τῷ μισθῷ
  choice: en plus de mon salaire
  rationale: La locution rattache le cadeau au salaire et peut indiquer un supplément ; le contexte favorise cette lecture sans exclure les autres nuances, signalées en note.
- source_word: οὐκ ἐπίστευον αὐτῇ … ἔλεγον
  choice: je ne la croyais pas et je lui disais
  rationale: Les imparfaits peuvent exprimer une attitude et une insistance duratives ; leur valeur est conservée par les imparfaits français.
- source_word: ἀποδιδόναι αὐτὸ τοῖς κυρίοις
  choice: le rendre à ses propriétaires
  rationale: ἀποδίδωμι signifie restituer ; κύριοι désigne ici ceux auxquels l’animal appartient, plutôt que des « seigneurs » au sens religieux.
- source_word: ἠρυθρίων πρὸς αὐτήν
  choice: j’en rougissais devant elle
  rationale: Le verbe évoque littéralement le fait de rougir et, par extension, la honte ; la formulation française garde cette image et son ambiguïté affective.
- source_word: ἐλεημοσύναι
  choice: actes de compassion
  rationale: Le terme peut viser les aumônes ou, plus largement, les œuvres de miséricorde ; « actes de compassion » demeure clair et concret.
- source_word: δικαιοσύναι
  choice: œuvres justes
  rationale: Le pluriel renvoie ici à des actes concrets de justice ou de droiture, non à un statut théologique abstrait.
- source_word: γνωστὰ πάντα μετὰ σοῦ
  choice: tout ce qui te concerne est connu
  rationale: La formule grecque est condensée et ambiguë ; cette traduction reste proche sans préciser indûment par qui ni de quelle manière cela est connu.
theological_decisions:
- issue: Portée de δικαιοσύναι au pluriel
  choice: œuvres justes
  alternative: œuvres de justice / actes de droiture
  rationale: Le contexte oppose la piété revendiquée de Tobit à son comportement présent. Le pluriel désigne vraisemblablement des actes concrets, sans imposer une notion confessionnelle particulière de la justice.
- issue: Sens de la réplique finale d’Anna
  choice: tout ce qui te concerne est connu
  alternative: tout est manifeste à ton sujet / on voit bien ce qu’il en est de toi
  rationale: Le grec ne nomme ni l’agent qui connaît ni l’objet exact de cette connaissance. La formulation retenue préserve cette tension au lieu d’y introduire explicitement le jugement de Dieu ou celui du public.
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent la durée ou l’insistance des verbes grecs. « Vois » conserve la force de ἰδού sans l’archaïsme de « voici » employé isolément comme interjection. Les notes rendent visibles les principales ambiguïtés lexicales et syntaxiques.
