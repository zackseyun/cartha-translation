  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: fr
  text: 'Ragouël se leva, alla creuser une tombe et se dit : « Pourvu que celui-ci ne meure pas lui aussi ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit une suite narrative et désigne ici le fait de se lever ; « se leva » est naturel et digne en français.
- source_word: ἐπορεύθη
  choice: alla
  rationale: Le verbe signifie simplement qu’il se rendit quelque part. « Alla » respecte le grec sans expliciter « dehors », absent du texte source.
- source_word: ὤρυξεν
  choice: creuser
  rationale: 'Après « alla », l’infinitif français exprime naturellement l’action coordonnée du grec : il alla et creusa.'
- source_word: τάφον
  choice: une tombe
  rationale: Avec le verbe « creuser », « tombe » désigne naturellement la fosse funéraire envisagée.
- source_word: Μὴ καὶ
  choice: Pourvu que… ne… pas… lui aussi
  rationale: Dans ce discours de crainte, μή avec le subjonctif exprime l’appréhension d’un événement redouté. Cette tournure française préserve cette nuance sans transformer la phrase en simple constat de possibilité.
- source_word: οὗτος
  choice: celui-ci
  rationale: Le démonstratif désigne Tobias comme le nouvel époux, après les précédents ; « celui-ci » conserve sa valeur démonstrative.
- source_word: ἀποθάνῃ
  choice: ne meure pas
  rationale: Le subjonctif aoriste dépend de μή et présente la mort comme une éventualité redoutée.
