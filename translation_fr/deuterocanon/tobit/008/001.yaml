base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
translation:
  language: fr
  text: Quand ils eurent fini de dîner, ils firent entrer Tobia[a] auprès d’elle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme française retenue ici est « Tobia ». On emploie aussi souvent « Tobie » ou « Tobias » dans les traductions françaises.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit simplement : « ils firent entrer Tobia auprès d’elle ». La tradition sémitique parallèle développe la scène en mentionnant la préparation de la chambre, l’entrée du couple et la fermeture de la porte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Quand
  rationale: Introduit naturellement en français l’événement suivant et conserve la relation temporelle; l’enchaînement narratif porté par δέ n’exige pas ici un « et » explicite.
- source_word: συνετέλεσαν δειπνοῦντες
  choice: ils eurent fini de dîner
  rationale: Rend l’achèvement du repas avant l’action suivante. Le passé antérieur convient au récit littéraire et reste clair en français moderne.
- source_word: εἰσήγαγον
  choice: ils conduisirent
  rationale: Conserve le sujet pluriel implicite du grec sans chercher à identifier les personnes concernées. « Conduisirent » exprime l’idée de mener quelqu’un auprès d’une autre personne.
- source_word: Τωβείαν
  choice: Tobia
  rationale: Translittère le nom grec en distinguant le fils de son père, plutôt que d’employer la forme française traditionnelle « Tobie », susceptible de désigner les deux personnages.
- source_word: πρὸς αὐτήν
  choice: auprès d’elle
  rationale: Rend le mouvement vers la femme dans ce contexte sans ajouter explicitement l’idée d’un rapport conjugal, que le grec ne formule pas.
theological_decisions:
- issue: Forme du nom Τωβείαν
  choice: Tobia
  alternative: Tobie; Tobias
  rationale: « Tobia » suit de près la forme du nom grec et sa base sémitique, tout en évitant de confondre le fils avec Tobit. La forme traditionnelle française « Tobie » et la forme gréco-latine « Tobias » sont signalées en note.
- issue: Portée de πρὸς αὐτήν dans la scène nuptiale
  choice: auprès d’elle
  alternative: pour être avec elle; dans sa chambre
  rationale: La traduction conserve la sobriété et l’ambiguïté du grec, qui indique la destination relationnelle sans préciser davantage la nature de la rencontre ni nommer la chambre.
translation_notes:
  register: Français narratif moderne, clair et digne. Le passé antérieur marque naturellement l’action achevée avant le passé simple. La formulation évite d’identifier le sujet pluriel absent du texte et n’ajoute aucun détail au bref récit grec.
