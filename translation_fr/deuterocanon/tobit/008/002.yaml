base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
translation:
  language: fr
  text: En entrant[a], il se souvint des paroles de Raphaël. Il prit les cendres de l’encens, posa dessus le cœur et le foie du poisson, puis les fit fumer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pendant qu’il avançait ». Le participe grec peut désigner plus généralement un déplacement, mais le contexte immédiat favorise ici l’idée d’entrer dans la chambre.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενος
  choice: En entrant
  rationale: Le participe exprime un déplacement en cours. Dans le contexte immédiat de la chambre nuptiale, le sens d’entrée est naturel, tout en laissant en note la traduction plus générale.
- source_word: ἐμνήσθη
  choice: il se souvint
  rationale: Cette formulation française courante rend directement l’aoriste et maintient le lien avec les instructions antérieures.
- source_word: λόγων Ῥαφαήλ
  choice: des paroles de Raphaël
  rationale: « Paroles » conserve le sens lexical sans expliciter indûment qu’il s’agit d’instructions, ce que le contexte indique déjà.
- source_word: τέφραν τῶν θυμιαμάτων
  choice: les cendres de l’encens
  rationale: Rendu français naturel du résidu produit par l’encens brûlé; le génitif précise la provenance des cendres.
- source_word: ἐπέθηκεν
  choice: posa dessus
  rationale: Le verbe signifie poser sur; « dessus » reprend clairement les cendres sans lourdeur.
- source_word: καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ
  choice: le cœur et le foie du poisson
  rationale: Cette coordination française naturelle conserve les deux organes et rattache sans ambiguïté l’ensemble au poisson.
- source_word: ἐκάπνισεν
  choice: les fit fumer
  rationale: Le causatif rend l’action de produire de la fumée sans introduire un vocabulaire rituel plus technique que le grec.
theological_decisions:
- issue: Rapport entre la recension grecque courte et la tradition sémitique ou longue dans cette scène
  choice: Traduire strictement l’action donnée par le grec, tout en rendant πορευόμενος par « En entrant » selon le contexte de la chambre nuptiale.
  alternative: Employer le rendu plus général « Pendant qu’il avançait », ou développer le verset d’après la scène de prière de la recension longue.
  rationale: Le grec fourni demeure le texte de base. Le contexte et la tradition parallèle soutiennent le sens d’une entrée, mais ne justifient pas l’ajout du contenu propre à la recension longue.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe est fluide, les objets concrets sont conservés et aucun vocabulaire confessionnel ou rituel non exigé par le grec n’est ajouté.
