lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative courante, conservée pour marquer l’enchaînement du récit.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste de εἰσέρχομαι indique simplement l’entrée dans un lieu; « entra » est direct et naturel dans un récit.
- source_word: ἡ παιδίσκη
  choice: la servante
  rationale: παιδίσκη désigne ici une jeune femme de condition servile. « La servante » exprime clairement sa fonction en français moderne sans imposer un âge précis que le contexte immédiat ne met pas en avant.
- source_word: ἀνοίξασα
  choice: après avoir ouvert
  rationale: Le participe aoriste exprime normalement une action antérieure à celle du verbe principal; cette tournure française en restitue naturellement la succession.
- source_word: τὴν θύραν
  choice: la porte
  rationale: Dans ce cadre domestique, θύρα désigne naturellement une porte plutôt qu’un portail.
