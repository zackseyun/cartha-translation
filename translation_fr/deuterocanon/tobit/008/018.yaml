  text: Puis il ordonna aux serviteurs de combler la tombe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: il ordonna
  rationale: L’aoriste de κελεύω exprime ici un ordre donné avec autorité. « Il ordonna » est naturel, précis et digne en français moderne.
- source_word: τοῖς οἰκέταις
  choice: aux serviteurs
  rationale: οἰκέτης désigne un serviteur appartenant à une maisonnée. « Aux serviteurs » convient au contexte sans imposer une précision sociale que le passage ne développe pas.
- source_word: χῶσαι
  choice: de combler
  rationale: L’infinitif de χόω signifie amonceler de la terre, recouvrir ou remplir. Avec « tombe », « combler » décrit clairement le fait de remettre la terre dans la fosse, et non d’y ensevelir quelqu’un.
- source_word: τὸν τάφον
  choice: la tombe
  rationale: τάφος peut désigner une tombe ou un tombeau. Le contexte évoque une fosse préparée pour un ensevelissement; « tombe » est donc le terme français le plus naturel.
