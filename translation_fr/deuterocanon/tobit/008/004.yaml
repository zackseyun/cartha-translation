base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: fr
  text: 'Quand ils eurent été enfermés tous les deux ensemble[a], Tobie se leva du lit et dit : « Lève-toi, ma sœur[b], et prions afin que le Seigneur ait pitié de nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « enfermés ensemble ». Il s’agit du couple enfermé ensemble dans la chambre.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici « sœur » comme forme d’adresse à son épouse, dans le cadre du langage de parenté propre au récit.
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: eurent été enfermés… ensemble
  rationale: Le passif et la valeur de clôture du verbe sont conservés, de même que l’antériorité par rapport à l’action suivante.
- source_word: ἀμφότεροι
  choice: tous les deux
  rationale: Cette expression française naturelle maintient l’insistance du grec sur les deux personnes.
- source_word: ἀνέστη
  choice: se leva
  rationale: Équivalent narratif naturel de l’aoriste dans ce contexte.
- source_word: κλίνης
  choice: lit
  rationale: Dans la chambre nuptiale, « lit » est le sens contextuel le plus clair.
- source_word: Ἀνάστηθι
  choice: Lève-toi
  rationale: L’impératif est rendu directement en français moderne, en écho à l’action de Tobie.
- source_word: ἀδελφή
  choice: ma sœur
  rationale: Le vocatif grec signifie littéralement « sœur ». L’ajout idiomatique du possessif est naturel en français dans l’adresse directe, sans remplacer l’image de parenté.
- source_word: προσευξώμεθα
  choice: prions
  rationale: Le subjonctif d’exhortation à la première personne du pluriel se rend naturellement par « prions ».
- source_word: ἐλεήσῃ
  choice: ait pitié de nous
  rationale: Formulation française courante qui exprime fidèlement l’action miséricordieuse demandée au Seigneur.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rendu traditionnel, clair et non confessionnel de κύριος dans ce contexte.
theological_decisions:
- issue: Le vocatif ἀδελφή adressé par Tobie à son épouse
  choice: Conserver « ma sœur » dans le texte principal
  alternative: Employer « ma femme », « ma chère » ou omettre l’expression de parenté
  rationale: Le grec porte explicitement « sœur ». Cette désignation de parenté doit être préservée malgré son étrangeté possible pour le lecteur moderne; une note précise son emploi narratif sans en effacer la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La construction passive inhabituelle est maintenue pour refléter le grec, tandis que le passé antérieur marque clairement la succession narrative. La ponctuation française et les espaces typographiques sont respectées.
