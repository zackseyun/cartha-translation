  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: fr
  text: 'Edna dit à sa femme : « Envoie une des servantes, et qu’elles aillent voir[a] s’il est vivant. Mais, sinon, afin que nous puissions l’enterrer et que personne ne le sache. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte « qu’elles aillent voir », au pluriel, bien qu’Edna vienne de dire : « Envoie une des servantes. » La traduction conserve ce pluriel au lieu de le ramener au singulier.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  choice: Envoie
  rationale: L’impératif simple rend directement ἀπόστειλον dans un français naturel.
- source_word: μίαν τῶν παιδισκῶν
  choice: une des servantes
  rationale: παιδίσκη désigne ici une jeune femme au service de la maison. « Servante » exprime clairement sa fonction domestique sans préciser davantage son statut juridique.
- source_word: ἰδέτωσαν
  choice: qu’elles aillent voir
  rationale: Le grec transmis emploie un impératif à la troisième personne du pluriel, malgré « une des servantes ». Le pluriel est donc conservé, tandis que « aillent voir » exprime naturellement l’idée d’une vérification.
- source_word: εἰ ζῇ
  choice: s’il est vivant
  rationale: Cette formulation française convient au fait de vérifier l’état de l’homme après la nuit de noces.
- source_word: ἵνα θάψωμεν αὐτόν
  choice: que nous puissions l’enterrer
  rationale: La construction garde la valeur visée par ἵνα avec le subjonctif, sans transformer le propos en simple futur.
- source_word: μηδεὶς γνῷ
  choice: sans que personne le sache
  rationale: Cette tournure idiomatique conserve le subjonctif et l’intention de garder l’inhumation secrète.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le pluriel inattendu du texte grec est maintenu et signalé. La formulation « Édna dit à sa femme » suit sans correction le sujet et le possessif du texte grec fourni.
