base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: fr
  text: 'Tu es béni, car tu m’as rempli de joie : il ne m’est pas arrivé ce que je supposais[a] ; au contraire, tu as agi envers nous selon ta grande miséricorde. Tu es béni, car tu as eu miséricorde de deux enfants uniques[b]. Aie miséricorde d’eux, Maître, et accorde-leur d’achever leur vie[c] en bonne santé, avec joie et miséricorde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que je soupçonnais » ou « ce que je redoutais ». Le verbe grec peut exprimer une supposition ou un soupçon ; le contexte peut évoquer une attente inquiète.
    reason: lexical_alternative
  - marker: b
    text: Chacun des deux membres du couple était enfant unique dans sa famille.
    reason: cultural_note
  - marker: c
    text: Littéralement « mène leur vie à son accomplissement ». Le grec emploie le singulier collectif « vie » ; on pourrait aussi traduire « leurs vies » ou « qu’ils achèvent leur vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Tu es béni
  rationale: Formule de bénédiction adressée à Dieu, rendue dans un français actuel et digne sans la transformer en impératif de louange.
- source_word: ηὔφρανάς με
  choice: tu m’as rempli de joie
  rationale: Exprime clairement la valeur causative de εὐφραίνω et son intensité affective.
- source_word: ὑπενόουν
  choice: je redoutais
  rationale: Dans ce contexte d’attente anxieuse, le verbe désigne ce que le locuteur envisageait avec appréhension; une note conserve les sens plus neutres possibles.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: selon ton immense compassion
  rationale: Préserve l’idée de norme ou de mesure portée par κατά et l’intensité de πολὺ; « compassion » convient au champ d’ἔλεος et se répète naturellement dans le verset.
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: tu as agi envers nous
  rationale: Rend l’expression grecque volontairement large sans préciser indûment la nature de l’action divine.
- source_word: ἠλέησας
  choice: tu as eu compassion de
  rationale: Formulation française directe qui maintient le lien lexical avec ἔλεος.
- source_word: δύο μονογενεῖς
  choice: ces deux enfants uniques
  rationale: Dans le contexte narratif, chacun des deux membres du couple est l’enfant unique de ses parents; cette traduction évite une connotation christologique étrangère au passage.
- source_word: δέσποτα
  choice: Maître
  rationale: Préserve la distinction lexicale avec κύριος et exprime l’autorité souveraine impliquée par le titre.
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: conduis leur vie jusqu’à son terme
  rationale: Conserve le singulier collectif « leur vie » et exprime une prière pour que leur existence atteigne son plein terme.
- source_word: ἐν ὑγείᾳ μετὰ εὐφροσύνης καὶ ἐλέους
  choice: dans la santé, la joie et la compassion
  rationale: Rend simplement les trois conditions ou accompagnements souhaités et maintient la répétition d’ἔλεος.
theological_decisions:
- issue: Titre divin δέσποτα
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: « Maître » garde la nuance d’autorité et distingue δέσποτα de κύριος sans imposer une formulation confessionnelle particulière.
- issue: Sens de μονογενεῖς
  choice: deux enfants uniques
  alternative: deux êtres uniques; deux enfants seuls-engendrés
  rationale: Le récit parle du statut familial de Tobias et Sara, chacun étant enfant unique, non d’une unicité métaphysique.
- issue: Portée du singulier ζωὴν
  choice: leur vie jusqu’à son terme
  alternative: leurs vies jusqu’à leur terme; accorde-leur d’achever leur vie
  rationale: Le singulier collectif grec est maintenu, tout en signalant en note qu’une formulation distributive est possible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe de prière et la répétition de « compassion » préservent le ton liturgique et le fil lexical d’ἔλεος. Les ambiguïtés de ὑπενόουν et du singulier collectif ζωὴν sont conservées au moyen de notes.
