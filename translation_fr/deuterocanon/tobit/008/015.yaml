lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Puis elle sortit
  rationale: Le participe aoriste marque une action préalable ou concomitante au verbe principal. En français narratif, la coordination avec « puis » rend naturellement la succession sans alourdir la phrase.
- source_word: ἀπήγγειλεν
  choice: annonça
  rationale: ἀπαγγέλλω signifie rapporter ou annoncer une nouvelle. « Annonça » convient au contexte et garde un registre narratif digne.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif pluriel désigne les destinataires de l’annonce et se rend naturellement par le pronom indirect « leur ».
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de l’annonce.
- source_word: ζῇ
  choice: il était vivant
  rationale: Le présent grec signifie littéralement « il vit » ou « il est vivant ». Après un verbe de déclaration au passé, l’imparfait français est idiomatique; le sujet masculin implicite est précisé par « il » d’après le contexte.
