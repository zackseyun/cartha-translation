  text: And he held a wedding feast for them for fourteen days[a].
translation:
  language: fr
  text: Et il célébra pour eux des noces pendant quatorze jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il organisa pour eux un festin de noces qui dura quatorze jours ». Le grec γάμος peut désigner aussi bien les noces elles-mêmes que le festin ou les réjouissances qui les accompagnent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: célébra
  rationale: Avec γάμον pour complément, ποιέω forme une expression idiomatique signifiant organiser ou célébrer des noces. « Célébra » est naturel en français tout en restant proche du grec.
- source_word: αὐτοῖς
  choice: pour eux
  rationale: Le datif désigne ici les bénéficiaires de la célébration, c’est-à-dire les nouveaux mariés d’après le contexte.
- source_word: γάμον
  choice: des noces
  rationale: γάμος peut désigner le mariage lui-même ou les festivités qui l’accompagnent. La durée de quatorze jours favorise le sens de célébration nuptiale, tandis que « noces » conserve une part de l’ambiguïté du grec.
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: pendant quatorze jours
  rationale: Le génitif exprime la durée ; « pendant quatorze jours » est la formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Des noces » convient à une célébration prolongée et préserve mieux que « festin de noces » l’étendue sémantique du grec γάμος.
