base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: fr
  text: 'Alors Ragouël bénit Dieu en disant : « Béni sois-tu, ô Dieu, en toute bénédiction ! Que tes saints[a] et toutes tes créatures[b] te bénissent ; que tous tes anges et ceux que tu as choisis[c] te bénissent pour toujours ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes êtres saints ».'
    reason: Le grec peut désigner des êtres humains, des êtres célestes, ou les deux ; le texte ne précise pas leur identité.
  - marker: b
    text: 'Ou : « toute ta création ».'
    reason: Le grec emploie un pluriel, qui peut se rendre par les êtres créés ou, collectivement, par la création.
  - marker: c
    text: 'Ou : « tes élus ».'
    reason: « Ceux que tu as choisis » rend le sens de ἐκλεκτοί sans privilégier les connotations doctrinales possibles de « élus ».
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσάν
  choice: bénit / Béni sois-tu / bénissent
  rationale: La répétition de la même famille lexicale préserve l’unité et la tonalité liturgique du grec, là où « loua » affaiblirait ce lien.
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: par toute bénédiction
  rationale: Cette formulation conserve la portée globale de πάσῃ et rend de manière intelligible la tournure grecque avec ἐν, sans en préciser excessivement la relation logique.
- source_word: οἱ ἅγιοί σου
  choice: ceux qui sont saints à tes yeux
  rationale: Cette expression reste compréhensible en français moderne et évite que « tes saints » soit entendu exclusivement au sens ecclésiastique ultérieur. Elle ne tranche pas entre êtres humains et célestes.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: toutes tes créatures
  rationale: Le pluriel français correspond au pluriel grec et désigne naturellement l’ensemble des êtres ou réalités créés.
- source_word: οἱ ἐκλεκτοί σου
  choice: ceux que tu as choisis
  rationale: Cette formulation transparente rend le sens de ἐκλεκτοί sans importer les connotations doctrinales que peut porter le substantif « élus ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français naturel de la formule doxologique exprimant la durée sans fin.
theological_decisions:
- issue: Identité de « ceux qui sont saints à tes yeux » et de « ceux que tu as choisis » dans une énumération qui mentionne aussi les anges
  choice: Conserver des désignations générales sans identifier ces groupes plus précisément.
  alternative: Les interpréter soit comme des êtres célestes, soit comme les fidèles humains.
  rationale: Le grec ne définit pas explicitement ces groupes et nomme déjà les anges séparément ; la traduction maintient donc cette ouverture.
translation_notes:
  register: Français international moderne, digne et légèrement liturgique. Les impératifs à valeur de souhait (« Que… bénissent ») rendent les formes grecques de bénédiction, tandis que les termes désignant les êtres saints et choisis restent volontairement ouverts.
