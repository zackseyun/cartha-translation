  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
translation:
  language: fr
  text: puis, après avoir pris la moitié de ses biens, te rendre auprès de ton père en bonne santé[a] ; et le reste, quand ma femme et moi serons morts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « vers le père » ; le contexte d’adresse directe indique qu’il s’agit de ton père.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est condensée en grec : littéralement, « quand je mourrai, et ma femme ». Le sens paraît être que le reste sera transmis après la mort des deux époux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα
  choice: après avoir pris
  rationale: Le participe aoriste exprime naturellement une action antérieure à πορεύεσθαι ; cette formulation en conserve clairement l’enchaînement.
- source_word: τὸ ἥμισυ
  choice: la moitié
  rationale: Équivalent quantitatif direct et idiomatique en français.
- source_word: τῶν ὑπαρχόντων αὐτοῦ
  choice: de ses biens
  rationale: ὑπάρχοντα désigne les biens ou possessions ; « ses biens » reste proche du grec et naturel en français.
- source_word: πορεύεσθαι
  choice: partir
  rationale: Dans ce contexte de retour auprès du père, « partir » rend naturellement le mouvement exprimé par l’infinitif.
- source_word: μετὰ ὑγείας
  choice: en bonne santé
  rationale: La formule préserve la référence explicite à la santé et au bien-être, sans la réduire à la seule idée de sécurité.
- source_word: πρὸς τὸν πατέρα
  choice: chez ton père
  rationale: Le grec dit littéralement « vers le père » sans possessif ; l’adresse directe permet de rendre naturellement le référent par « ton père », tandis que « chez » convient à la destination personnelle.
- source_word: τὰ λοιπά
  choice: le reste
  rationale: Rend simplement la part restante des biens.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: quand ma femme et moi serons morts
  rationale: 'Le grec est elliptique : le verbe à la première personne du singulier est suivi de « et ma femme ». La formulation française explicite sobrement que le décès des deux époux est envisagé.'
