  yaml_path: translation/deuterocanon/tobit/008/007.yaml
  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: fr
  text: Et maintenant, Seigneur, ce n’est pas par immoralité sexuelle que je prends pour femme cette sœur qui est la mienne[a], mais en vérité[b]. Ordonne que nous recevions miséricorde et que nous vieillissions ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le langage de parenté du livre, « sœur » peut désigner une proche parente qui peut légitimement devenir son épouse; on pourrait aussi traduire : « cette parente qui est la mienne ».'
    reason: cultural_note
  - marker: b
    text: 'La formule grecque est condensée. On peut aussi rendre la fin du verset : « Ordonne d’avoir pitié de moi et d’elle, afin que nous vieillissions ensemble. » La demande de miséricorde et celle de vieillir ensemble sont étroitement liées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Adresse directe à Dieu dans une prière; « Seigneur » est naturel, digne et conforme à l’usage biblique français.
- source_word: πορνείαν
  choice: débauche
  rationale: Le terme désigne ici une conduite ou une motivation sexuelle illicite. « Débauche » conserve la réprobation morale tout en s’insérant naturellement après « par »; le contexte oppose ce motif à une intention vraie et droite.
- source_word: λαμβάνω
  choice: je prends pour femme
  rationale: Le sens littéral est « prendre », mais le contexte matrimonial appelle en français l’explicitation idiomatique « prendre pour femme ».
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: cette sœur qui est la mienne
  rationale: Cette formulation conserve l’étrange mais importante désignation de Sarah comme « sœur », c’est-à-dire proche parente dans le langage du récit, tout en restant intelligible en français.
- source_word: ἐπʼ ἀληθείας
  choice: dans la vérité
  rationale: Rendu formel qui préserve l’ambiguïté entre vérité, sincérité et droiture, sans réduire l’expression à une seule motivation psychologique.
- source_word: ἐπίταξον
  choice: Ordonne
  rationale: L’impératif signifie proprement « ordonne » ou « commande ». Le conserver respecte la vigueur singulière de la demande adressée à Dieu.
- source_word: ἐλεῆσαί με καὶ αὐτὴν
  choice: qu’il nous soit fait miséricorde
  rationale: La syntaxe grecque peut être comprise comme demandant que miséricorde soit faite à Tobias et à Sarah. Cette tournure garde les deux personnes comme objets de la miséricorde et dépend naturellement de « Ordonne ».
- source_word: συγκαταγηρᾶσαι
  choice: que nous vieillissions ensemble
  rationale: Le verbe composé exprime directement le fait de parvenir ensemble à la vieillesse; la première personne du pluriel rend naturellement en français l’union de Tobias et Sarah.
theological_decisions:
- issue: Sens de « sœur » dans une prière nuptiale
  choice: Conserver « sœur » dans le texte et expliquer qu’il s’agit du langage de parenté du récit.
  alternative: « parente » ou « proche parente »
  rationale: Le grec dit explicitement « cette sœur qui est la mienne ». Remplacer ce terme dans le texte effacerait la texture familiale et juridique du récit; une note permet d’éviter un contresens moderne.
- issue: Portée de la demande de miséricorde
  choice: Comprendre με καὶ αὐτήν comme les deux bénéficiaires de la miséricorde, puis coordonner la demande de vieillir ensemble.
  alternative: « Ordonne d’avoir pitié de moi et de vieillir avec elle » ou « accorde-moi miséricorde, et que nous vieillissions ensemble »
  rationale: La construction grecque est compacte et quelque peu difficile. Le rendu choisi évite de faire de Sarah le sujet grammatical du verbe « avoir pitié » et préserve la prière en faveur des deux époux, sans masquer l’ambiguïté syntaxique, signalée en note.
- issue: Contraste entre πορνεία et ἀλήθεια
  choice: « par débauche … mais dans la vérité »
  alternative: « par désir charnel … mais avec sincérité »
  rationale: Le texte oppose une motivation sexuelle répréhensible à la vérité. Le rendu retenu ne transforme pas explicitement πορνεία en simple désir ni ἀλήθεια en seule sincérité subjective.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. La formulation garde la solennité de la prière et certaines aspérités significatives du grec (« sœur », « dans la vérité », « Ordonne »), avec des notes pour guider le lecteur.
