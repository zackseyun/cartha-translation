  naturalness: La prière est globalement soutenue et lisible. « Immoralité sexuelle » est plus précis et plus actuel que « débauche ». « Que nous recevions miséricorde » est plus naturel que l’impersonnel « qu’il nous soit fait miséricorde », tout en gardant la tonalité biblique.
