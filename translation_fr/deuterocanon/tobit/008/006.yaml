base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: fr
  text: 'C’est toi qui as fait Adam, et tu lui as donné Ève, son épouse, comme aide et soutien. C’est d’eux qu’est née la descendance humaine[a]. Tu as dit : « Il n’est pas bon que l’homme soit seul[b] ; faisons-lui une aide qui lui soit semblable. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence des humains » ; cette image évoque la postérité ou la descendance.'
    reason: lexical_alternative
  - marker: b
    text: Cette phrase fait écho à Genèse 2.18.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: tu as fait
  rationale: Rend directement ποιέω sans introduire la nuance plus spécialisée de « créer » ; la tournure emphatique « C’est toi qui » restitue le pronom exprimé σὺ.
- source_word: βοηθὸν Εὔαν στήριγμα τὴν γυναῖκα αὐτοῦ
  choice: Ève pour l’aider et le soutenir, elle qui était sa femme
  rationale: Exprime les fonctions de βοηθός et στήριγμα en français naturel, tout en maintenant l’apposition qui identifie Ève comme la femme d’Adam.
- source_word: ἐκ τούτων ἐγενήθη
  choice: C’est d’eux qu’est née
  rationale: Le masculin pluriel « d’eux » renvoie naturellement au couple Adam et Ève ; « est née » conserve l’idée de venue à l’existence portée par γίνομαι.
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: la descendance humaine
  rationale: Conserve le sens généalogique de σπέρμα sans employer en français l’expression peu naturelle « semence des humains ».
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: Il n’est pas bon que l’homme soit seul
  rationale: Suit étroitement le grec et garde l’écho reconnaissable de Genèse 2.18 ; dans ce contexte, « l’homme » désigne Adam.
- source_word: ποιήσωμεν
  choice: faisons
  rationale: Rend le subjonctif exhortatif à la première personne du pluriel et préserve la formulation de l’allusion à la Genèse.
- source_word: βοηθὸν ὅμοιον αὐτῷ
  choice: une aide qui lui soit semblable
  rationale: Traduit simplement ὅμοιος, « semblable », sans importer la notion plus interprétative de correspondance provenant de l’arrière-plan hébreu.
theological_decisions:
- issue: Portée anthropologique de ἀνθρώπων
  choice: descendance humaine
  alternative: race humaine ; semence des humains
  rationale: Le syntagme vise l’ensemble de l’humanité issue du premier couple. « Descendance humaine » préserve la dimension généalogique et évite les ambiguïtés modernes de « race ».
- issue: Écho intertextuel de Genèse 2.18
  choice: 'Maintenir une formulation proche de la Genèse : « Il n’est pas bon que l’homme soit seul ; faisons-lui une aide… »'
  alternative: Employer une paraphrase contemporaine plus libre
  rationale: La prière reprend explicitement le récit de la création ; une formulation proche permet au lecteur d’entendre cette reprise sans résoudre davantage le rapport entre les textes.
- issue: Valeur de ὅμοιον αὐτῷ
  choice: qui lui soit semblable
  alternative: qui lui corresponde
  rationale: Le témoin grec exprime directement la similitude. « Qui lui corresponde » peut refléter l’hébreu de Genèse 2.18, mais dépasserait ici la formulation grecque transmise.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe privilégie des formulations naturelles tout en gardant l’emphase de σὺ, l’image généalogique de σπέρμα et l’écho verbal à Genèse 2.18.
