base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: fr
  text: Mais lorsque le démon sentit l’odeur, il s’enfuit jusqu’aux régions les plus hautes de l’Égypte[a], et l’ange le lia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « jusqu’aux régions les plus reculées de l’Égypte », ou, comme désignation géographique : « en Haute-Égypte ».'
    reason: Le superlatif grec ἀνώτατα permet une nuance spatiale (« les plus hautes »), une idée d’éloignement, ou une référence à la Haute-Égypte.
lexical_decisions:
- source_word: ὠσφράνθη
  choice: sentit
  rationale: 'L’aoriste déponent a ici un sens actif : le démon perçoit l’odeur. « Sentit » est naturel et concis en français.'
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: Le récit présente un être spirituel hostile et personnel. « Démon » rend directement le terme grec.
- source_word: τῆς ὀσμῆς
  choice: l’odeur
  rationale: Le mot désigne ici l’odeur concrète produite par les organes de poisson brûlés, sans suggérer qu’elle soit agréable.
- source_word: ἔφυγεν
  choice: il s’enfuit
  rationale: Le verbe exprime une fuite devant ce qui menace ou repousse.
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: vers les régions les plus hautes de l’Égypte
  rationale: Cette formulation conserve le sens premier du superlatif ἀνώτατα sans imposer le toponyme technique « Haute-Égypte »; une note signale les nuances géographiques possibles.
- source_word: ἔδησεν
  choice: ligota
  rationale: Le verbe δέω signifie attacher ou lier. « Ligota » exprime clairement ici l’action concrète de maîtriser le démon.
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: Le défini renvoie à l’ange déjà connu dans le récit, sans le nommer dans cette proposition.
theological_decisions:
- issue: Nature de δαιμόνιον dans le récit
  choice: « le démon », comme être spirituel hostile et personnel
  alternative: « l’esprit mauvais »
  rationale: Le personnage sent, fuit et se fait ligoter par l’ange. « Démon » conserve sans l’atténuer la représentation surnaturelle du texte.
- issue: Portée géographique de εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: conserver une expression relativement littérale dans le texte et signaler les autres compréhensions en note
  alternative: « jusqu’aux régions les plus reculées de l’Égypte » ou « en Haute-Égypte »
  rationale: Le grec évoque littéralement les parties les plus hautes de l’Égypte, mais peut être compris comme une indication de l’éloignement ou comme une référence géographique à la Haute-Égypte. La traduction ne tranche pas silencieusement.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et narrative. « Ligota » est plus concret et courant que « lia » dans ce contexte, tout en conservant la force de l’action grecque.
