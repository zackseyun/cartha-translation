  rationale: Avec le complément « chez lui », « rentra » exprime naturellement le déplacement vers la demeure de Ragouël. Le contexte spatial est porté conjointement par ἦλθεν et εἰς τὴν οἰκίαν ἑαυτοῦ.
- source_word: Ῥαγουὴλ
