  rationale: Translittération française traditionnelle et directement reconnaissable du nom grec Ῥαγουήλ.
- source_word: εἰς τὴν οἰκίαν ἑαυτοῦ
  choice: chez lui
  rationale: Expression idiomatique française qui rend le mouvement vers la propre demeure du sujet, sans emphase contrastive indue sur le réflexif ἑαυτοῦ.
