base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: fr
  text: 'Tobie commença à dire : « Béni sois-tu, Dieu de nos pères, et béni soit ton nom saint et glorieux pour toujours ! Que les cieux et toutes tes œuvres[a] te bénissent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes tes créatures ». Le grec peut désigner largement tout ce que Dieu a créé, et non seulement les êtres vivants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο Τωβίας λέγειν
  choice: Tobie commença à dire
  rationale: Rend directement l’idiome grec ἄρχομαι suivi de l’infinitif et marque le début de la prière. « Tobie » est la forme française usuelle du nom.
- source_word: Εὐλογητὸς εἶ
  choice: Béni sois-tu
  rationale: Formule française naturelle et liturgique pour une bénédiction adressée directement à Dieu.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Dieu de nos pères
  rationale: Conserve le terme masculin πατέρων et la formule biblique traditionnelle sans neutraliser le lien ancestral.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: ton nom saint et glorieux
  rationale: Préserve les deux qualificatifs attributifs dans un ordre naturel en français.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française courante qui communique la durée perpétuelle de l’idiome grec.
- source_word: εὐλογησάτωσάν σε
  choice: Que ... te bénissent
  rationale: Le subjonctif introduit par « que » rend naturellement en français la valeur jussive de l’impératif grec.
- source_word: οἱ οὐρανοὶ
  choice: les cieux
  rationale: Conserve le pluriel grec et le registre élevé de la prière.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: toutes tes œuvres
  rationale: κτίσεις désigne ici l’ensemble pluriel des réalités créées. « Œuvres » est naturel dans une invitation poétique à la louange et reste assez large pour englober toute la création.
theological_decisions:
- issue: Langage ancestral genré dans la formule de prière
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec porte explicitement πατέρων. La traduction conserve cette désignation masculine traditionnelle sans l’élargir silencieusement.
- issue: Étendue de κτίσεις dans la louange cosmique
  choice: toutes tes œuvres
  alternative: toutes tes créatures ; toute ta création
  rationale: Le pluriel grec peut viser toutes les réalités que Dieu a créées, et non seulement les êtres vivants. « Œuvres » maintient cette ampleur ainsi que l’accord pluriel avec le verbe, sans personnifier exclusivement des créatures animées.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère élévation liturgique adaptée à la prière. La ponctuation exclamative restitue l’élan de bénédiction sans ajouter de contenu.
