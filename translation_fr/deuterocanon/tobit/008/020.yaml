  yaml_path: translation/deuterocanon/tobit/008/020.yaml
  text: And Raguel said to him under oath[a], before the days of the wedding were completed, that he should not leave unless the fourteen days of the wedding were fulfilled,
translation:
  language: fr
  text: Ragouël lui déclara sous serment[a], avant que les jours des noces soient achevés, qu’il ne devait pas partir tant que les quatorze jours des noces ne seraient pas accomplis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faisant serment ». L’adverbe grec indique que Ragouël liait cette instruction par un serment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι
  choice: avant que … soient achevés
  rationale: Cette tournure exprime clairement l’antériorité par rapport à l’achèvement de la période des noces et conserve la valeur passive de l’infinitif grec.
- source_word: τὰς ἡμέρας τοῦ γάμου
  choice: les jours des noces
  rationale: « Noces » désigne naturellement en français la célébration nuptiale envisagée sur plusieurs jours, sans réduire γάμος à la seule cérémonie.
- source_word: ἐνόρκως
  choice: sous serment
  rationale: L’adverbe indique que Ragouël donne cette instruction en la liant par un serment; « sous serment » est concis, idiomatique et digne.
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: qu’il ne devait pas partir
  rationale: L’infinitive rapporte le contenu de l’instruction solennelle. Dans ce contexte, « partir » rend naturellement l’idée de quitter le lieu.
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: tant que … ne seraient pas accomplis
  rationale: La formulation française exprime la limite temporelle impliquée par la condition grecque (« à moins que / jusqu’à ce que ») tout en maintenant l’idée d’accomplissement.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: les quatorze jours des noces
  rationale: La traduction conserve explicitement le nombre et rattache clairement toute la période à la célébration nuptiale.
