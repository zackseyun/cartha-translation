  to: Car ils ont désobéi à tes commandements, et tu nous as livrés au pillage, à la captivité et à la mort, pour être un sujet de proverbe et de mépris[a] parmi toutes les nations au milieu desquelles nous avons été dispersés.
  rationale: La révision remplace une expression française moins idiomatique par « un sujet de proverbe et de mépris », qui rend de manière transparente παραβολὴν ὀνειδισμοῦ. Elle maintient le passif de la dispersion, l’opposition entre « ils » et « nous », et l’attribution explicite à Dieu de l’acte de livrer.
