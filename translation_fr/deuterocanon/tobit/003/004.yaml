  terminology: « Commandements », « livrés », « pillage », « captivité », « mort », « nations » et « dispersés » sont des choix appropriés. « Sujet de proverbe et de mépris » conserve les deux éléments de παραβολὴν ὀνειδισμοῦ sans imposer une interprétation confessionnelle.
