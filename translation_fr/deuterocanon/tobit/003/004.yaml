base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: fr
  text: Car ils ont désobéi à tes commandements, et tu nous as livrés au pillage, à la captivité et à la mort, pour être un sujet de proverbe et de mépris[a] parmi toutes les nations au milieu desquelles nous avons été dispersés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet de mépris » ou « la risée de tous ». Le grec associe l’idée d’un proverbe ou d’une formule proverbiale à celle de l’opprobre public.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήκουσαν
  choice: ils n’ont pas obéi
  rationale: Le verbe exprime le refus ou le manquement à écouter et à obéir. Cette formulation française est naturelle et maintient le sujet à la troisième personne, distinct du « nous » qui suit.
- source_word: τῶν ἐντολῶν σου
  choice: à tes commandements
  rationale: « Commandements » conserve la portée religieuse et covenantale du terme grec.
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: tu nous as livrés à
  rationale: Cette tournure exprime clairement l’action divine de remettre le peuple à ces malheurs, sans atténuer l’agentivité du texte.
- source_word: διαρπαγήν
  choice: pillage
  rationale: Le nom désigne l’action de piller ou le fait d’être livré comme proie; « pillage » est précis et courant.
- source_word: αἰχμαλωσίαν
  choice: captivité
  rationale: Le terme grec désigne directement la condition de captif plutôt que l’exil au sens large.
- source_word: θάνατον
  choice: mort
  rationale: Rendu direct du sens ordinaire du mot grec.
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: un sujet de mépris proverbial
  rationale: La formulation conserve à la fois l’idée de parole proverbiale ou de repoussoir public et celle d’opprobre, tout en restant intelligible en français moderne.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: parmi toutes les nations
  rationale: « Nations » convient au cadre de la dispersion et évite d’importer la nuance plus marquée de « païens ».
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: au milieu desquelles nous avons été dispersés
  rationale: Cette traduction rattache explicitement le relatif aux nations et préserve le passif ainsi que le résultat durable de la dispersion.
theological_decisions:
- issue: Confession collective et action divine dans le jugement
  choice: Conserver « ils n’ont pas obéi » puis « tu nous as livrés »
  alternative: Employer « nous n’avons pas obéi » ou atténuer l’action divine par « nous avons été livrés »
  rationale: Le grec distingue ceux qui ont désobéi, à la troisième personne, de la communauté incluse dans « nous », tout en attribuant explicitement à Dieu l’acte de livrer. La traduction garde cette tension.
- issue: Langage public de la honte
  choice: un sujet de mépris proverbial
  alternative: un objet de mépris; la fable et l’opprobre
  rationale: Le choix maintient les deux composantes de l’expression grecque sans réduire celle-ci à un simple objet de mépris; la note signale des équivalents plus idiomatiques.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. La syntaxe demeure proche du grec tout en évitant le calque peu naturel « un proverbe de mépris ». Le participe français « faisant de nous » rend la dernière conséquence de « tu nous as livrés » avec fluidité.
