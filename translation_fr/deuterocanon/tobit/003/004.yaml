  source_fidelity: Le projet rend correctement la distinction grecque entre « ils » (παρήκουσαν) et « nous » (ἡμᾶς), ainsi que l’action explicite de Dieu (« tu nous as livrés »). « Au milieu desquelles nous avons été dispersés » reflète bien ἐν οἷς ἐσκορπίσμεθα. Toutefois, « faisant de nous un sujet de mépris proverbial » rend moins nettement la construction parallèle introduite par εἰς et ne reproduit qu’imparfaitement la composante de « proverbe/byword » de παραβολὴν.
