  text: And the prayer of both was heard before the Glory[a].
translation:
  language: fr
  text: Et la prière de tous deux fut entendue devant la Gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la gloire de Dieu » ou « en présence de la Gloire ». Dans cette proposition, le grec ne nomme pas explicitement Dieu.
    reason: Alternative lexicale et préservation de l’implicite théologique du grec.
lexical_decisions:
- source_word: εἰσηκούσθη
  choice: fut entendue
  rationale: Le passif d’εἰσακούω indique couramment qu’une prière a été accueillie favorablement. « Fut entendue » reste proche du grec sans préciser qu’une réponse a déjà été donnée.
- source_word: προσευχὴ
  choice: prière
  rationale: « Prière » est le sens usuel et convient naturellement au contexte.
- source_word: ἀμφοτέρων
  choice: de tous deux
  rationale: Le génitif renvoie aux deux personnes mentionnées dans le contexte. « De tous deux » est concis et conserve cette référence collective.
- source_word: ἐνώπιον
  choice: devant
  rationale: La préposition signifie « devant » ou « en présence de ». « Devant » rend sobrement la formulation grecque.
- source_word: τῆς δόξης
  choice: la Gloire
  rationale: Le grec emploie l’article défini. Dans ce contexte révérenciel, « la Gloire » évoque vraisemblablement la présence glorieuse de Dieu sans nommer explicitement Dieu, comme dans le texte source.
theological_decisions:
- issue: Faut-il expliciter que « la Gloire » désigne Dieu ou sa présence ?
  choice: la Gloire
  alternative: la gloire de Dieu ; la présence glorieuse de Dieu
  rationale: Le grec ne nomme pas explicitement Dieu dans cette proposition. La formulation retenue préserve la métonymie révérencielle et l’indétermination formelle du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La majuscule à « Gloire » signale son emploi révérenciel probable, tandis que la note conserve l’ambiguïté du grec.
