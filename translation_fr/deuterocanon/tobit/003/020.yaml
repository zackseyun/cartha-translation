base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
translation:
  language: fr
  text: Et maintenant, je t’informe des dix talents d’argent que j’ai déposés chez Gabaël, fils de Gabrias, à Ragès, en Médie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « je te montre » ou « je te signale » ; le verbe grec peut désigner le fait d’attirer l’attention sur quelque chose, sans impliquer nécessairement qu’on le présente matériellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: je t’informe
  rationale: Dans ce contexte, le verbe attire l’attention du destinataire sur l’existence du dépôt plutôt qu’il ne décrit nécessairement une présentation matérielle; « je t’informe » rend naturellement cette valeur en français.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: les dix talents d’argent
  rationale: Cette formulation conserve l’unité antique et la matière, sans conversion moderne qui introduirait une précision trompeuse.
- source_word: παρεθέμην
  choice: j’ai déposés chez
  rationale: Le moyen exprime ici la remise d’une somme à quelqu’un pour qu’il la garde; « déposer chez » convient au contexte sans suggérer une institution bancaire moderne.
- source_word: Γαβαήλῳ
  choice: Gabaël
  rationale: Translittération française usuelle du nom grec, avec tréma pour distinguer les voyelles.
- source_word: τῷ τοῦ Γαβρεία
  choice: fils de Gabri
  rationale: L’article suivi du génitif d’un nom propre indique ici la filiation; la forme française « fils de » l’explicite idiomatiquement.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: à Ragès, en Médie
  rationale: Cette formulation française naturelle conserve le toponyme antique et situe clairement la ville dans la Médie.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec tout en évitant un calque. Les noms propres suivent des formes françaises transparentes, et l’unité antique « talent » est conservée.
