base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: fr
  text: 'parce qu’elle avait été donnée en mariage à sept hommes et qu’Asmodée, le mauvais démon, les avait tués avant qu’ils puissent s’unir à elle comme à leurs épouses.[a] Elles lui dirent : « Ne comprends-tu pas que tu étouffes tes maris ? Tu en as déjà eu sept et tu n’as tiré profit d’aucun d’eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant qu’ils n’aient de relations avec elle ». Le grec évoque l’union conjugale par un euphémisme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδομένη ἀνδράσιν ἑπτά
  choice: avait été donnée en mariage à sept hommes
  rationale: Le parfait passif de δίδωμι conserve l’idée qu’elle a été donnée, tandis que « en mariage » explicite naturellement en français le sens conjugal de ἀνδράσιν dans ce contexte.
- source_word: Ἀσμοδαῖος τὸ πονηρὸν δαιμόνιον
  choice: Asmodée, le démon mauvais
  rationale: « Asmodée » est la forme française traditionnelle du nom propre. « Le démon mauvais » rend explicitement le nom δαιμόνιον et l’adjectif πονηρόν sans les fondre en une désignation plus vague.
- source_word: ἀπέκτεινεν
  choice: avait tués
  rationale: Le plus-que-parfait français situe clairement ces morts avant les paroles rapportées et s’accorde avec la construction causale rétrospective.
- source_word: πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: avant qu’ils ne s’unissent à elle comme à une épouse
  rationale: Cette formulation française conserve la retenue de l’euphémisme grec tout en indiquant assez clairement l’union conjugale. Le singulier collectif « une épouse » est idiomatique en français, bien que γυναιξίν soit morphologiquement pluriel.
- source_word: Οὐ συνιεῖς
  choice: Ne comprends-tu pas
  rationale: Rend directement l’interrogation accusatrice et le sens courant de συνίημι.
- source_word: ἀποπνίγουσά σου τοὺς ἄνδρας
  choice: tu étouffes tes maris
  rationale: « Étouffer » restitue l’image violente de ἀποπνίγω et convient naturellement au présent accusateur en français.
- source_word: ἤδη ἑπτὰ ἔσχες
  choice: Tu en as déjà eu sept
  rationale: Le pronom « en » reprend naturellement « tes maris » tout en conservant la brièveté du grec, où le nom est sous-entendu.
- source_word: ἑνὸς αὐτῶν οὐκ ὠνάσθης
  choice: tu n’as tiré profit d’aucun d’eux
  rationale: Rend le sens de tirer bénéfice ou avantage exprimé par ὀνίναμαι, sans préciser indûment la nature du profit évoqué dans l’insulte.
theological_decisions:
- issue: Euphémisme relatif à l’union conjugale
  choice: avant qu’ils ne s’unissent à elle comme à une épouse
  alternative: avant qu’ils n’aient de relations avec elle
  rationale: Le grec évoque l’union sexuelle conjugale de manière indirecte. Le texte principal préserve cette pudeur et la note signale explicitement le sens, sans résoudre l’expression en formulation crue.
- issue: Identification des locutrices de εἶπαν
  choice: Elles lui dirent
  alternative: Ils lui dirent / On lui dit
  rationale: La forme grecque ne marque pas le genre, mais le contexte narratif immédiat fournit des locutrices féminines. Le français exige ici un choix de genre; « elles » maintient cette continuité narrative sans ajout doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec, tandis que « donnée en mariage », « s’unissent » et la reprise pronominale « en » assurent une lecture naturelle. L’insulte reste directe et violente sans être amplifiée.
