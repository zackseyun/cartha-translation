  text: Tell me to release me from the earth[a], so that I may no longer hear reproach.
translation:
  language: fr
  text: Dis que je sois délivrée de la terre[a], afin que je n’entende plus l’opprobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que je sois libérée de la terre » ou « que je sois retirée de la terre ». L’expression grecque est une demande indirecte d’être délivrée de la vie terrestre.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὸν
  choice: Dis-moi
  rationale: L’impératif aoriste de λέγω introduit ici le contenu de la demande exprimé par l’infinitif. « Dis-moi » conserve la tournure inhabituelle du grec et évite de préciser excessivement par « ordonne ».
- source_word: ἀπολῦσαί με
  choice: de me délivrer
  rationale: ἀπολύω signifie relâcher, libérer ou laisser partir. Dans cette prière où la mort est souhaitée indirectement, « délivrer » rend l’idée d’une libération sans expliciter davantage que le grec.
- source_word: ἀπὸ τῆς γῆς
  choice: de la terre
  rationale: γῆ peut désigner la terre, le sol ou le pays. « De la terre » reste proche de la formulation grecque et préserve son expression indirecte d’un départ de la vie terrestre.
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: afin que je n’entende plus
  rationale: La coordination des infinitifs exprime ici le résultat recherché. « Afin que » donne en français une phrase naturelle, tandis que « ne… plus » rend précisément μηκέτι.
- source_word: ὀνειδισμόν
  choice: les outrages
  rationale: ὀνειδισμός couvre le reproche, l’insulte et l’opprobre. « Les outrages » convient au contexte de paroles humiliantes et sonne naturel en français contemporain.
theological_decisions:
- issue: Expression indirecte d’un souhait de mort dans une prière à Dieu
  choice: me délivrer de la terre
  alternative: me retirer de la terre
  rationale: Le grec demande littéralement d’être libérée de la terre, formulation qui semble évoquer indirectement la mort. Le texte principal conserve cette image et sa tension au lieu de la remplacer par une demande explicite de mourir.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe légèrement marquée de « Dis-moi de… » est maintenue pour refléter εἰπὸν suivi de l’infinitif; le reste de la phrase est lissé afin de demeurer naturel.
