  naturalness: Le français est globalement moderne, digne et accessible. « Frère proche » est volontairement peu idiomatique, mais la note justifie ce littéralisme prudent. En revanche, « ordonne de porter ton regard sur moi » est grammaticalement et stylistiquement heurté en français ; « ordonne que tu poses ton regard sur moi » conserve l’étrangeté rhétorique de l’impératif grec tout en étant clair.
  terminology: Les choix terminologiques sont cohérents. « Souillé », « captivité », « héritera de lui », « épouse », « pitié » et « insultes » conviennent au registre. Les notes emploient un vocabulaire sobre et ne surinterprètent pas le passage.
