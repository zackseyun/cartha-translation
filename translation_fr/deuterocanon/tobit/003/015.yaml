revisions:
- from: Et je n’ai souillé ni mon nom ni le nom de mon père dans le pays de ma captivité. Je suis l’unique enfant de mon père, et il n’a pas d’enfant qui héritera de lui, ni de frère proche[a], et il n’a pas non plus de fils pour que je me garde pour lui comme épouse[c]. J’en ai déjà perdu sept[b] ; pourquoi devrais-je vivre ? Mais si tu ne juges pas bon de me faire mourir, ordonne de porter ton regard sur moi et d’avoir pitié de moi, et fais que je n’entende plus d’insultes.
  to: Et je n’ai souillé ni mon nom ni le nom de mon père dans le pays de ma captivité. Je suis l’unique enfant de mon père, et il n’a pas d’enfant qui héritera de lui, ni de frère proche[a], et il n’a pas non plus de fils pour que je me garde pour lui comme épouse[c]. J’en ai déjà perdu sept[b] ; pourquoi devrais-je vivre ? Mais si tu ne juges pas bon de me faire mourir, ordonne que tu poses ton regard sur moi et que tu aies pitié de moi, et que je n’entende plus d’insultes.
  rationale: 'La seule révision nécessaire rend la dernière requête grammaticalement intelligible en français : Dieu est explicitement le sujet de « poses ton regard » et « aies pitié ». La tournure « ordonne que tu... » maintient délibérément la force inhabituelle de ἐπίταξον, plutôt que de la réduire à une paraphrase dévotionnelle telle que « daigne ». Le texte conserve par ailleurs les ambiguïtés de la clause familiale et l’implicite des sept personnes perdues.'
