base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: fr
  text: Et je n’ai souillé ni mon nom ni le nom de mon père dans le pays de ma captivité. Je suis l’unique enfant de mon père, et il n’a pas d’enfant qui héritera de lui, ni de frère proche[a], et il n’a pas non plus de fils pour que je me garde pour lui comme épouse[c]. J’en ai déjà perdu sept[b] ; pourquoi devrais-je vivre ? Mais si tu ne juges pas bon de me faire mourir, ordonne que tu poses ton regard sur moi et que tu aies pitié de moi, et que je n’entende plus d’insultes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proche parent ». Le grec dit littéralement « frère proche » et peut désigner ici, plus largement, un proche parent masculin de la lignée familiale.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de ses sept maris dans le contexte du récit, mais le grec dit ici seulement « sept ».
    reason: contextual_clarification
  - marker: c
    text: La proposition concernant le « frère proche », le « fils » et le mariage est difficile tant du point de vue du texte que de la syntaxe grecque. La traduction en conserve donc la formulation sans en fixer le sens avec plus de certitude que la source ne le permet.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐμόλυνα
  choice: j’ai souillé
  rationale: « Souiller » conserve la portée morale de μολύνω et convient à la déclaration d’innocence de Sara sans préciser indûment une impureté rituelle.
- source_word: ὄνομα
  choice: nom
  rationale: Le grec répète littéralement « nom ». En contexte, le terme évoque aussi l’honneur et la réputation de la famille, mais le maintien de l’image respecte la formulation source.
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: pays de ma captivité
  rationale: Cette formulation proche du grec garde le cadre de la diaspora et la tonalité douloureuse de la prière ; « pays de mon exil » serait plus idiomatique mais moins direct.
- source_word: μονογενής
  choice: l’unique enfant
  rationale: Le mot désigne ici le seul enfant d’un père. Cette traduction naturelle évite aussi les associations théologiques étrangères au contexte que pourrait susciter « unique engendrée ».
- source_word: κληρονομήσει αὐτόν
  choice: héritera de lui
  rationale: Le français ne peut guère employer naturellement « l’héritera ». « Hériter de lui » exprime clairement le rapport d’héritier sans transformer le texte en paraphrase juridique.
- source_word: ἀδελφὸς ἐγγύς
  choice: frère proche
  rationale: La traduction garde les deux éléments du grec et son étrangeté relative. Le sens plus large probable de parent masculin proche est signalé en note plutôt qu’imposé au texte.
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: je me garde pour lui comme épouse
  rationale: Cette formulation rend l’idée de se préserver ou se réserver, tout en maintenant le pronom masculin dont le référent demeure difficile dans la syntaxe grecque.
- source_word: ἀπώλοντό μοι ἑπτά
  choice: j’en ai déjà perdu sept
  rationale: Cette tournure française exprime naturellement la perte personnelle marquée par μοι. Elle ne précise pas « maris » dans le texte principal, puisque le grec dit seulement « sept ».
- source_word: δοκεῖ σοι
  choice: tu ne juges pas bon
  rationale: La formulation exprime ce qui paraît bon ou convenable à Dieu, avec un registre digne et naturel en français.
- source_word: ἀποκτεῖναί με
  choice: me faire mourir
  rationale: Cette expression convient à une prière solennelle et évite la brutalité de « me tuer », sans atténuer la demande de mort.
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμέ
  choice: ordonne de porter ton regard sur moi
  rationale: Le tour conserve l’impératif inhabituel du grec et l’image biblique du regard divin porté sur la personne qui supplie.
- source_word: ὀνειδισμόν
  choice: insultes
  rationale: Dans ce contexte, le mot désigne les paroles humiliantes ou outrageantes qu’elle entend. « Insultes » est courant et direct ; « opprobre » serait plus abstrait et archaïsant.
theological_decisions:
- issue: Identification des sept personnes perdues
  choice: Conserver « sept » sans ajouter « maris » dans le texte principal.
  alternative: « J’ai déjà perdu sept maris. »
  rationale: Le récit permet d’identifier clairement les sept comme les maris de Sara, mais ce verset grec n’emploie pas le nom « maris ». Une note donne l’information contextuelle sans l’introduire dans le texte.
- issue: Interprétation de la difficile proposition de parenté et de mariage
  choice: Traduire de près « ni de frère proche… ni de fils… pour que je me garde pour lui comme épouse ».
  alternative: Généraliser en « aucun proche parent pour lequel je puisse me réserver comme épouse ».
  rationale: La syntaxe et les référents pronominaux sont difficiles. La traduction retenue préserve cette tension et les éléments du grec sans définir avec une certitude excessive le rapport familial ou juridique envisagé.
- issue: Forme de la demande adressée à Dieu
  choice: Maintenir l’idée inhabituelle d’ordonner qu’il porte son regard et fasse miséricorde.
  alternative: Lisser en « daigne me regarder avec pitié ».
  rationale: Le lissage serait idiomatique, mais effacerait la force particulière de ἐπίταξον. La formulation française demeure compréhensible tout en restant proche de la rhétorique de la source.
translation_notes:
  register: 'Français international moderne, digne et accessible, avec tutoiement de Dieu conforme à l’adresse directe de la prière. Le texte privilégie une équivalence optimale : syntaxe française naturelle lorsqu’elle n’efface pas une difficulté réelle, et maintien mesuré de l’étrangeté dans la clause de parenté.'
