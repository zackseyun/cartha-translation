base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: fr
  text: Tu es juste, Seigneur, et toutes tes œuvres et toutes tes voies sont miséricorde et vérité[a]. Pour toujours, tu rends un jugement vrai et juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont des actes de miséricorde et fidélité ». Le grec emploie un pluriel pouvant désigner des manifestations de la miséricorde; « vérité » peut aussi avoir ici le sens de « fidélité ».
    reason: Préserver les nuances lexicales de ἐλεημοσύναι et ἀλήθεια.
lexical_decisions:
- source_word: Δίκαιος
  choice: juste
  rationale: Adjectif attribut exprimant le caractère moral de Dieu; « juste » est naturel en français et conserve aussi la dimension judiciaire du terme.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif adressé à Dieu; « Seigneur » est le correspondant français usuel de κύριος dans ce contexte.
- source_word: ἔργα
  choice: œuvres
  rationale: Rend le terme général désignant tout ce que Dieu accomplit, sans le réduire à des actes particuliers.
- source_word: ὁδοί
  choice: voies
  rationale: Conserve l’image biblique des manières d’agir et de gouverner de Dieu.
- source_word: ἐλεημοσύναι
  choice: miséricorde
  rationale: Dans ce prédicat appliqué aux voies de Dieu, le mot désigne la miséricorde manifestée plutôt que l’aumône au sens humain étroit. Le pluriel grec peut aussi être explicité par « actes de miséricorde », signalé en note.
- source_word: ἀλήθεια
  choice: vérité
  rationale: Correspondance lexicale directe qui préserve la formulation grecque; la nuance possible de fidélité est conservée en note.
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  choice: un jugement vrai et juste
  rationale: 'Maintient les deux adjectifs et leur portée distincte: conformité à la vérité et justice du jugement.'
- source_word: κρίνεις
  choice: tu rends un jugement
  rationale: Expression française naturelle qui rend explicitement le complément interne κρίσιν sans l’aplatir en simple décision.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression idiomatique d’une durée permanente, rattachée à l’exercice du jugement divin.
theological_decisions:
- issue: Sens de ἀλήθεια dans l’association avec la miséricorde
  choice: vérité
  alternative: fidélité
  rationale: « Vérité » suit directement le grec, tandis que « fidélité » exprime une nuance relationnelle possible sans devoir être imposée au texte principal.
- issue: Portée de ἐλεημοσύναι appliqué aux œuvres et aux voies de Dieu
  choice: miséricorde
  alternative: actes de miséricorde
  rationale: Le français abstrait reproduit la force prédicative solennelle de la phrase. La variante explicite le pluriel grec et sa référence aux manifestations concrètes de la miséricorde.
translation_notes:
  register: Français international moderne, clair et digne. La première proposition conserve le parallélisme de la prière; la seconde est légèrement réordonnée pour rendre naturellement en français l’insistance temporelle de εἰς τὸν αἰῶνα.
