  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: fr
  text: 'Elle pria près de la fenêtre et dit : « Béni sois-tu, Seigneur mon Dieu ! Béni soit pour toujours ton nom saint et digne d’honneur ! Que toutes tes œuvres te bénissent[a] pour toujours ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te louent ». Le grec reprend ici le même groupe de mots lié à la bénédiction que plus haut dans le verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  choice: pria
  rationale: Le verbe exprime une supplication adressée à Dieu. « Pria » est naturel dans ce contexte et conserve l’idée essentielle sans accentuer indûment la détresse.
- source_word: πρὸς τῇ θυρίδι
  choice: près de la fenêtre
  rationale: θυρίς désigne une fenêtre ou une ouverture ; ici, πρός avec le datif indique naturellement la proximité.
- source_word: Εὐλογητὸς εἶ
  choice: Béni sois-tu
  rationale: Cette formulation française courante dans la prière rend l’adjectif doxologique et l’adresse directe à Dieu.
- source_word: Κύριε ὁ θεός μου
  choice: Seigneur mon Dieu
  rationale: « Seigneur » est l’équivalent établi de κύριος dans une invocation divine, et « mon Dieu » rend directement la relation possessive.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: ton nom saint et digne d’honneur
  rationale: ἔντιμος exprime ce qui est honoré, estimé ou précieux. « Digne d’honneur » est idiomatique et maintient l’idée de révérence sans ajouter celle de gloire.
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Ces expressions idiomatiques indiquent une durée sans fin ; une même traduction préserve le parallélisme du verset.
- source_word: εὐλογησάτωσάν σε
  choice: Que … te bénissent
  rationale: Le subjonctif à valeur injonctive rend l’impératif grec à la troisième personne et conserve le lien lexical avec « Béni ».
- source_word: πάντα τὰ ἔργα σου
  choice: toutes tes œuvres
  rationale: « Œuvres » garde l’amplitude de ἔργα, qui peut englober les actes de Dieu et ce qu’il a créé.
theological_decisions:
- issue: Traduction de κύριος dans l’adresse directe à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte est une prière adressée à Dieu ; « Seigneur » correspond à l’usage biblique français courant sans imposer d’interprétation supplémentaire.
- issue: Langage de bénédiction adressé à Dieu
  choice: Que toutes tes œuvres te bénissent
  alternative: Que toutes tes œuvres te louent
  rationale: Le grec reprend le même groupe lexical que dans les deux propositions précédentes. « Bénissent » préserve cette cohésion, tandis que « louent » explicite le sens possible lorsque les œuvres de Dieu s’adressent à lui.
translation_notes:
  register: Français international moderne, naturel et digne, avec un registre de prière soutenu mais accessible. La ponctuation exclamative fait entendre la progression doxologique sans modifier le contenu.
