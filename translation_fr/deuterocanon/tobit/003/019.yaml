base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: fr
  text: En tout temps, bénis le Seigneur Dieu et demande-lui que tes chemins deviennent droits, et que tous tes sentiers et tes projets réussissent. Car aucun peuple n’a de conseil[a] ; mais le Seigneur lui-même donne tous les biens, et il abaisse qui il veut, comme il le veut[b]. Et maintenant, mon enfant, souviens-toi de mes commandements, et qu’ils ne soient pas effacés de ton cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « aucun peuple n’a de conseil ». Cette formule concise peut signifier qu’aucun peuple ne possède par lui-même un conseil sûr ou la capacité de bien diriger ses projets.'
    reason: alternative_reading
  - marker: b
    text: 'Le relatif grec est grammaticalement neutre (« ce que »), mais il peut ici désigner une personne : « celui qu’il veut ».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: En tout temps
  rationale: Expression française naturelle qui conserve la portée distributive de la formule grecque.
- source_word: εὐλόγει
  choice: bénis
  rationale: Reproduit directement l’impératif grec et maintient l’idiome biblique de la bénédiction adressée à Dieu.
- source_word: Κύριον τὸν Θεόν
  choice: le Seigneur Dieu
  rationale: Rend naturellement la suite des titres grecs et réserve « Seigneur » au titre divin κύριος.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: demande-lui
  rationale: Le français exprime idiomatiquement par le pronom indirect la demande adressée à Dieu ; la provenance indiquée par παρά reste implicite dans cette construction.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: que tes chemins deviennent droits
  rationale: Suit la valeur littérale de γένωνται, « deviennent », sans imposer une lecture passive ; « chemins » conserve l’image de la conduite et du parcours de vie.
- source_word: πᾶσαι αἱ τρίβοι καὶ βουλαὶ εὐοδωθῶσιν
  choice: que tous tes sentiers et tes projets réussissent
  rationale: « Sentiers » distingue τρίβοι de ὁδοί, tandis que « projets » rend ici βουλαί comme desseins personnels ; « réussissent » exprime clairement l’issue favorable portée par εὐοδωθῶσιν.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: aucun peuple ne possède en lui-même la capacité de bien décider
  rationale: La formulation grecque est abrupte. Cette traduction en explicite le contraste avec le Seigneur, sans faire de βουλή une simple absence de tout projet humain.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: donne tous les biens
  rationale: Rendu concis qui conserve l’étendue de πάντα et l’idée générale des bienfaits accordés par Dieu.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: il abaisse qui il veut
  rationale: Le contexte permet de comprendre le relatif neutre grec avec une portée personnelle. « Abaisse » conserve la force de ταπεινοῖ sans atténuer l’affirmation de souveraineté divine.
- source_word: παιδίον
  choice: mon enfant
  rationale: Forme d’adresse naturelle et affectueuse en français, adaptée à l’exhortation d’un père.
- source_word: μνημόνευε τῶν ἐντολῶν μου
  choice: souviens-toi de mes commandements
  rationale: Rend directement l’impératif et le terme ἐντολαί, ici les prescriptions transmises par le père.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: qu’ils ne s’effacent pas de ton cœur
  rationale: Conserve l’image de l’effacement ainsi que le cœur comme siège de la mémoire et de la volonté.
theological_decisions:
- issue: Titre divin κύριος dans une exhortation sapientielle deutérocanonique
  choice: le Seigneur
  alternative: le Maître
  rationale: Le contexte désigne Dieu par un titre révérenciel ; « le Seigneur Dieu » est l’équivalent français biblique naturel, sans ajout confessionnel.
- issue: Souveraineté divine dans ὃ ἐὰν θέλῃ ταπεινοῖ, καθὼς βούλεται
  choice: il abaisse qui il veut, comme il le veut
  alternative: il abaisse ce qu’il veut, selon son dessein
  rationale: La traduction retient la lecture personnelle suggérée par le contexte tout en conservant sans l’adoucir la tension entre le don de tous les biens et l’action divine d’abaisser.
- issue: Portée de πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: aucun peuple ne possède en lui-même la capacité de bien décider
  alternative: aucun peuple n’a de conseil
  rationale: L’ajout explicatif « en lui-même » fait ressortir le contraste avec le Seigneur comme source des biens, sans nier absolument toute faculté humaine de délibération ; l’incertitude de la formule est signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement convient à l’adresse intime d’un père à son enfant. Les images bibliques des chemins, des sentiers, du cœur, de la bénédiction et de l’abaissement sont conservées, tandis que la proposition particulièrement elliptique sur le conseil des peuples est légèrement explicitée et accompagnée d’une note.
