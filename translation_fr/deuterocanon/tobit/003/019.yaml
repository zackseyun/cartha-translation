revisions:
- from: En tout temps, bénis le Seigneur Dieu et demande-lui que tes chemins deviennent droits, et que tous tes sentiers et tes projets réussissent. Car aucun peuple ne possède en lui-même la capacité de bien décider[a] ; mais le Seigneur lui-même donne tous les biens, et il abaisse qui il veut, comme il le veut[b]. Et maintenant, mon enfant, souviens-toi de mes commandements, et qu’ils ne s’effacent pas de ton cœur.
  to: En tout temps, bénis le Seigneur Dieu et demande-lui que tes chemins deviennent droits, et que tous tes sentiers et tes projets réussissent. Car aucun peuple n’a de conseil[a] ; mais le Seigneur lui-même donne tous les biens, et il abaisse qui il veut, comme il le veut[b]. Et maintenant, mon enfant, souviens-toi de mes commandements, et qu’ils ne soient pas effacés de ton cœur.
  rationale: La révision rétablit dans le texte la formulation concise et ambiguë du grec concernant le « conseil » des peuples, en laissant l’explication interprétative à la note. Elle rapproche aussi la dernière exhortation de la voix passive grecque. Les autres choix du projet sont conservés, y compris la lecture personnelle de « qui il veut », explicitement signalée en note.
