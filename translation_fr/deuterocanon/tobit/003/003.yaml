base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: fr
  text: Souviens-toi de moi et porte ton regard sur moi. Ne me punis pas pour mes péchés ni pour mes fautes commises par ignorance[a], ni pour ceux de mes ancêtres[b], qu’ils ont commis devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne des fautes commises par ignorance, sans pleine connaissance ou involontairement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mes pères ». La proposition « qu’ils ont commis devant toi » renvoie le plus naturellement à leurs péchés, mais elle peut aussi être comprise comme récapitulant l’ensemble des fautes mentionnées.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: μνήσθητί μου
  choice: Souviens-toi de moi
  rationale: L’impératif, dans le langage de la prière, demande à Dieu de prendre favorablement en considération celui qui prie. La formulation directe conserve la diction biblique tout en restant naturelle.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: porte ton regard sur moi
  rationale: Cette expression renforce l’appel à l’attention divine. « Porte ton regard sur moi » est actuel, digne et plus soutenu que « regarde-moi ».
- source_word: μὴ ἐκδίκῃς
  choice: Ne me punis pas
  rationale: ἐκδικέω peut évoquer la vengeance ou l’exercice d’une justice punitive. Avec les péchés comme objet, « punir » exprime clairement la rétribution demandée de ne pas infliger, sans suggérer une vengeance passionnelle.
- source_word: τὰς ἁμαρτίας μου
  choice: mes péchés
  rationale: « Péchés » conserve le poids moral et théologique habituel de ἁμαρτία.
- source_word: τοῖς ἀγνοήμασίν μου
  choice: mes fautes commises par ignorance
  rationale: ἀγνόημα désigne une faute commise sans pleine connaissance ou de manière involontaire. Cette traduction rend la nuance sans réduire ces actes à de simples erreurs.
- source_word: τῶν πατέρων μου
  choice: ceux de mes ancêtres
  rationale: Le grec dit littéralement « mes pères », mais le contexte vise les générations antérieures. « Ancêtres » est immédiatement clair en français moderne et le pronom « ceux » reprend les péchés ou manquements sous-entendus.
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: qu’ils ont commis devant toi
  rationale: Le pluriel ἥμαρτον renvoie le plus naturellement aux ancêtres. En français, « commettre » reprend idiomatiquement les péchés sous-entendus, tandis que « devant toi » préserve la portée relationnelle et judiciaire de l’expression.
theological_decisions:
- issue: Portée de la proposition relative ἃ ἥμαρτον ἐνώπιόν σου
  choice: La proposition renvoie principalement aux péchés des ancêtres.
  alternative: Elle peut être comprise plus largement comme récapitulant toutes les fautes précédemment mentionnées.
  rationale: Le verbe grec au pluriel renvoie le plus naturellement au groupe pluriel le plus proche, « mes ancêtres ». La traduction maintient ainsi la distinction entre les fautes personnelles de Tobit et celles des générations antérieures, tout en signalant l’autre portée possible en note.
- issue: Valeur de μὴ ἐκδίκῃς
  choice: Exprimer la sanction divine par « Ne me punis pas ».
  alternative: « Ne tire pas vengeance de mes péchés » ou « Ne me demande pas compte de mes péchés ».
  rationale: Le contexte pénitentiel porte sur la juste rétribution des péchés. « Punir » est clair et non confessionnel; une note conserve la nuance plus littérale de vengeance ou de justice exercée.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement de Dieu conforme à l’usage biblique français courant. La formulation évite l’archaïsme tout en conservant le caractère solennel de la prière.
