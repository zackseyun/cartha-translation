  source_fidelity: Le texte français rend fidèlement les impératifs μνήσθητί et ἐπίβλεψον, ainsi que la demande négative μὴ ἐκδίκῃς dans son contexte pénitentiel. « Ne me punis pas pour » exprime naturellement la requête de ne pas subir la rétribution des péchés. La distinction entre péchés personnels, fautes par ignorance et péchés ancestraux est conservée. La relative finale est correctement comprise comme visant principalement les péchés commis par les ancêtres.
