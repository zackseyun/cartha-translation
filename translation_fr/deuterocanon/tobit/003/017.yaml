base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: fr
  text: 'du grand Raphaël. Il fut envoyé pour les guérir tous les deux : pour enlever les voiles blancs qui couvraient les yeux de Tobit, pour donner Sara, fille de Ragouël, comme épouse à Tobias, fils de Tobit, et pour enchaîner Asmodée, le mauvais démon, car c’était à Tobias qu’il revenait d’hériter d’elle[a]. À ce moment même, Tobit revint et entra chez lui, et Sara, fille de Ragouël, descendit de sa pièce à l’étage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « car Tobias avait le droit de l’épouser ». Le grec dit littéralement « hériter d’elle », selon le cadre juridique et familial du récit.'
    reason: Alternative lexicale explicitant un idiome juridico-matrimonial inhabituel sans l’effacer du texte principal.
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  choice: du grand Raphaël
  rationale: Le génitif fragmentaire est conservé, car il rattache explicitement cette proposition au contexte précédent. Le nom est translittéré selon l’usage français.
- source_word: ἀπεστάλη
  choice: Il fut envoyé
  rationale: Le passif laisse l’auteur de l’envoi implicite, comme dans le grec, sans expliciter une désignation divine absente du texte.
- source_word: ἰάσασθαι τοὺς δύο
  choice: pour les guérir tous les deux
  rationale: La portée de « guérir » couvre les interventions en faveur de Tobit et de Sara, conformément à la construction grecque.
- source_word: λεπίσαι τὰ λευκώματα
  choice: enlever les voiles blancs qui couvraient les yeux de Tobit
  rationale: Cette formulation rend l’idée d’ôter les opacités blanches sans imposer le diagnostic moderne précis de la cataracte. « Voiles blancs » reste compréhensible en français courant.
- source_word: δοῦναι ... γυναῖκα
  choice: donner Sara ... comme épouse à Tobias
  rationale: La formule conserve l’action de « donner » et précise naturellement en français le sens matrimonial de γυναῖκα.
- source_word: δῆσαι Ἀσμοδαῖον τὸ πονηρὸν δαιμόνιον
  choice: enchaîner Asmodée, le démon mauvais
  rationale: « Enchaîner » exprime ici naturellement l’idée de lier et de neutraliser; « démon mauvais » suit directement le grec sans atténuer la qualification morale.
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: c’était à Tobias qu’il revenait d’hériter d’elle
  rationale: La formulation préserve le vocabulaire successoral inhabituel du grec ainsi que l’idée d’un droit ou d’une priorité juridique, tout en restant syntaxiquement lisible en français.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: À ce moment même
  rationale: Rend l’insistance du grec sur la simultanéité des événements.
- source_word: ἐπιστρέψας Τωβείτ εἰσῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: Tobit revint et entra chez lui
  rationale: La séquence de retour et d’entrée est maintenue dans un français naturel.
- source_word: κατέβη ἐκ τοῦ ὑπερῴου αὐτῆς
  choice: descendit de sa chambre à l’étage
  rationale: « Chambre à l’étage » communique clairement la position haute de la pièce sans recourir à l’expression vieillie « chambre haute ».
theological_decisions:
- issue: Portée de la mission de Raphaël
  choice: Raphaël est envoyé pour guérir Tobit et Sara tous les deux, les actions suivantes explicitant cette guérison au sens large.
  alternative: Limiter la guérison à la maladie des yeux de Tobit et considérer séparément la délivrance de Sara.
  rationale: L’infinitif ἰάσασθαι régit « les deux » puis la série d’actions. La traduction garde donc l’unité de la mission sans réduire la guérison au seul aspect physique.
- issue: Sens de κληρονομῆσαι αὐτήν appliqué à Sara
  choice: Conserver dans le texte l’expression « hériter d’elle ».
  alternative: Traduire directement « avoir le droit de l’épouser » ou « être le parent prioritaire pour l’épouser ».
  rationale: Le grec emploie explicitement le langage de l’héritage dans un cadre matrimonial et familial. Le texte principal préserve cette tension juridique, tandis que la note en donne le sens idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms Tobit et Tobias sont distingués afin de refléter les deux formes grecques et d’éviter l’ambiguïté traditionnelle de « Tobie ». Le début fragmentaire « du grand Raphaël » est volontairement conservé puisqu’il prolonge la phrase du verset précédent.
