- from: Et maintenant, nombreux et vrais sont les jugements que tu portes à mon égard au sujet de mes péchés et de ceux de mes pères[a], parce que nous n’avons pas obéi à tes commandements ; en effet, nous n’avons pas marché dans la vérité devant toi[b].
  to: Et maintenant, tes jugements sont nombreux et vrais dans la manière dont tu agis envers moi au sujet de mes péchés et de ceux de mes pères[a], car nous n’avons pas obéi à tes commandements ; en effet, nous n’avons pas marché dans la vérité[b] devant toi.
