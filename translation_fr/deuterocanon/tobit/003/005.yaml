base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: fr
  text: Et maintenant, tes jugements sont nombreux et vrais dans la manière dont tu agis envers moi au sujet de mes péchés et de ceux de mes pères[a], car nous n’avons pas obéi à tes commandements ; en effet, nous n’avons pas marché dans la vérité[b] devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « mes pères » désigne ici les ancêtres du locuteur.
    reason: clarification
  - marker: b
    text: « Marcher dans la vérité » est une manière biblique de parler d’une vie vécue avec vérité et fidélité devant Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: jugements
  rationale: Dans cette prière de confession, le terme désigne les décisions ou interventions judiciaires de Dieu. « Jugements » en conserve le sens formel sans le réduire aux seules condamnations.
- source_word: ἀληθιναί
  choice: vrais
  rationale: C’est l’équivalent lexical le plus direct. Dans le contexte, le mot affirme aussi que les jugements de Dieu sont fondés et droits, mais « vrais » préserve la formulation grecque et son écho avec ἀληθείᾳ.
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: que tu portes à mon égard
  rationale: La construction grecque est difficile et probablement idiomatique. Cette formulation française rattache naturellement l’action divine aux « jugements » tout en évitant de lui donner explicitement un sens hostile comme « contre moi ».
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: au sujet de mes péchés et de ceux de mes pères
  rationale: « Au sujet de » rend περί sans trancher trop fortement entre le thème et le motif causal. « Ceux » explicite en français l’ellipse grecque du mot « péchés ».
- source_word: ἐντολάς
  choice: commandements
  rationale: Ce terme usuel garde la portée morale et liée à l’alliance du grec.
- source_word: οὐκ ἐποιήσαμεν τὰς ἐντολάς σου
  choice: nous n’avons pas obéi à tes commandements
  rationale: Le grec dit littéralement « nous n’avons pas fait tes commandements ». En français actuel, « obéir à » exprime naturellement l’accomplissement demandé sans modifier le sens.
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: nous n’avons pas marché dans la vérité
  rationale: La traduction conserve la métaphore biblique de la marche et l’étendue sémantique de « vérité », qui peut inclure fidélité et droiture. Elle maintient aussi le lien lexical avec « vrais » au début du verset.
- source_word: ἐνώπιόν σου
  choice: devant toi
  rationale: Formulation concise et naturelle qui exprime une conduite vécue sous le regard et en présence de Dieu.
theological_decisions:
- issue: Faut-il qualifier explicitement les jugements de Dieu de « justes » plutôt que de « vrais » ?
  choice: vrais
  alternative: justes
  rationale: Le contexte implique la justice des interventions divines, mais le grec porte ἀληθιναί, « vrais ». La traduction conserve ce terme afin de ne pas remplacer par une interprétation la formulation du texte.
- issue: La mention des péchés des pères affirme-t-elle une culpabilité héréditaire ?
  choice: mes péchés et ceux de mes pères
  alternative: nos péchés ancestraux
  rationale: Le grec juxtapose les péchés personnels du locuteur et ceux de ses pères. Cette formulation préserve la dimension familiale et collective de la confession sans développer une doctrine de culpabilité héritée que le verset n’explicite pas.
- issue: Faut-il résoudre « marcher dans la vérité » en « vivre fidèlement » ?
  choice: marché dans la vérité
  alternative: vécu fidèlement
  rationale: La formulation retenue préserve à la fois l’image de la conduite comme marche et l’ambivalence féconde de ἀλήθεια entre vérité, sincérité et fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe initiale légèrement solennelle conserve l’accent grec sur le grand nombre et la vérité des jugements divins. Les expressions bibliques « mes pères » et « marcher dans la vérité » sont maintenues, avec des notes pour en faciliter la compréhension.
