lexical_decisions:
- source_word: λυπηθεὶς (λυπέω)
  choice: attristé
  rationale: Le participe aoriste passif exprime l’état de celui qui éprouve de la peine. « Attristé » le rend directement, sans ajouter un degré d’intensité absent du grec.
- source_word: ἔκλαυσα (κλαίω)
  choice: je pleurai
  rationale: « Pleurer » rend précisément l’action exprimée et convient au registre narratif et solennel du passage.
- source_word: προσηυξάμην (προσεύχομαι)
  choice: je priai
  rationale: Traduction idiomatique et directe du verbe grec, sans intensification ajoutée.
- source_word: μετʼ ὀδύνης
  choice: dans l’angoisse
  rationale: ὀδύνη désigne une douleur profonde. « Dans l’angoisse » restitue cette intensité tout en s’intégrant naturellement à la phrase.
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit le contenu de la prière qui suit.
- source_word: Καὶ
  choice: Alors
  rationale: À l’ouverture de cet épisode, « Alors » marque naturellement en français la continuité narrative portée par καί, sans alourdir la phrase.
