  text: And being grieved[a], I wept, and I prayed in anguish, saying,
translation:
  language: fr
  text: 'Attristé[a], je pleurai et priai dans l’angoisse, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec est ici bref : « Attristé, je pleurai et priai dans l’angoisse, en disant ». Une tradition de forme sémitique développe beaucoup plus longuement la lamentation dans les lignes qui suivent ; cette phrase d’ouverture reste bien attestée par le grec.'
