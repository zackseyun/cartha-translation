  text: On that same day it happened to Sarah, the daughter of Raguel, in Ecbatana of Media, that she too was reproached by her father's maidservants,
translation:
  language: fr
  text: Ce même jour, il arriva aussi à Sara, fille de Ragouël, à Ecbatane en Médie, d’être insultée[a] par les servantes de son père,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’être l’objet de reproches » ou « d’être tournée en dérision » ; le verbe grec peut désigner des reproches humiliants ou des injures.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ αὐτῇ ἡμέρᾳ
  choice: Ce même jour
  rationale: Formulation narrative naturelle en français, qui conserve le lien temporel et la valeur démonstrative de αὐτῇ.
- source_word: συνέβη
  choice: il arriva
  rationale: Rend la tournure impersonnelle grecque dans un registre narratif digne, sans archaïsme marqué.
- source_word: τῇ θυγατρὶ Ῥαγουὴλ Σάρρᾳ
  choice: à Sara, fille de Ragouël
  rationale: Respecte le datif régi par συνέβη et conserve l’identification familiale dans un ordre idiomatique français.
- source_word: ἐν Ἐκβατάνοις τῆς Μηδείας
  choice: à Ecbatane en Médie
  rationale: Situe clairement la ville dans la région, conformément au sens du génitif géographique.
- source_word: καὶ ταύτην
  choice: aussi à Sara … d’être
  rationale: Place « aussi » avec l’événement parallèle subi par Sara, tout en reprenant naturellement son référent en français.
- source_word: ὀνειδισθῆναι
  choice: d’être couverte de reproches
  rationale: Exprime le fait de subir des reproches insultants sans réduire le verbe à la seule moquerie.
- source_word: ὑπὸ παιδισκῶν πατρὸς αὐτῆς
  choice: par les servantes de son père
  rationale: Conserve le sexe et le statut domestique des personnes désignées, dans une formulation française actuelle.
