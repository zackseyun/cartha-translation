  text: You know, Lord, that I am pure from every sin and from a man,
translation:
  language: fr
  text: Tu sais, Seigneur, que je suis pure de tout péché et de toute relation avec un homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « et d’un homme »; l’expression est elliptique.'
    reason: Signaler la formulation littérale et préserver l’ambiguïté du texte source malgré l’explicitation nécessaire en français.
lexical_decisions:
- source_word: καθαρά
  choice: pure
  rationale: Le féminin « pure » correspond à la locutrice et conserve la dimension morale et rituelle possible du terme grec.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de tout péché
  rationale: Rend directement la construction grecque et la portée générale de πάσης.
- source_word: ἀνδρός
  choice: de toute relation avec un homme
  rationale: Le grec dit elliptiquement « d’un homme ». En français courant, l’explicitation minimale de la relation sous-entendue rend la déclaration intelligible sans réduire celle-ci à un acte précis.
theological_decisions:
- issue: Nature de la pureté revendiquée
  choice: Conserver ensemble l’absence de péché et l’absence de relation avec un homme
  alternative: Interpréter explicitement la phrase comme une revendication de virginité ou d’absence de rapports sexuels
  rationale: La formulation grecque est elliptique et ne précise pas la nature exacte de la relation; la traduction évite donc d’imposer une interprétation plus étroite.
translation_notes:
  register: Prière formulée dans un français moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Dieu et à l’usage biblique français courant.
