base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: fr
  text: « Pourquoi nous fouettes-tu ? S’ils sont morts[a], va les rejoindre ! Que nous ne voyions jamais de toi ni fils ni fille ! »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le sens implicite : « va mourir avec eux ». Le grec dit seulement « va les rejoindre », mais il est question de ses maris morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  choice: fouettes
  rationale: Le verbe désigne littéralement l’action de fouetter ou de flageller. « Fouettes » conserve la violence de l’accusation tout en restant naturel en français moderne.
- source_word: βάδιζε μετʼ αὐτῶν
  choice: va les rejoindre
  rationale: L’impératif signifie littéralement aller ou marcher avec eux. En français, « va les rejoindre » exprime naturellement l’ordre tout en laissant implicite, comme le grec, qu’il s’agit de rejoindre les maris morts.
- source_word: μὴ ἴδωμέν
  choice: Puissions-nous ne jamais voir
  rationale: Le subjonctif aoriste avec μή exprime ici un souhait hostile, proche d’une malédiction. Cette tournure en restitue la force avec dignité.
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: voir de toi ni fils ni fille
  rationale: Le génitif σου peut marquer la possession ou l’origine. Dans ce contexte de descendance refusée à Sara, « de toi » fait ressortir l’idée d’enfants issus d’elle; la coordination négative française appelle « ni… ni ».
- source_word: εἰς τὸν αἰῶνα
  choice: jamais
  rationale: Dans cette imprécation, « jamais » rend idiomatiquement la négation prolongée exprimée par la locution grecque, sans l’inutile redondance de « jamais… pour toujours ».
theological_decisions:
- issue: Sens implicite de « va avec eux »
  choice: « va les rejoindre » maintient dans le texte l’allusion à la mort sans ajouter explicitement le verbe « mourir ».
  alternative: « va mourir avec eux »
  rationale: Les maris morts sont clairement visés par le contexte, mais le grec dit seulement « va avec eux ». La traduction conserve donc l’implication hostile sans transformer celle-ci en affirmation explicite.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement reflète le singulier insultant des verbes grecs. Les guillemets signalent la parole rapportée; l’exclamation restitue la violence de la raillerie.
