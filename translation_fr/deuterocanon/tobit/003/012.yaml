  text: And now[a], Lord, I have set my eyes and my face toward you.
translation:
  language: fr
  text: Et maintenant, Seigneur, j’ai tourné mes yeux et mon visage vers toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « j’ai donné mes yeux et mon visage vers toi ». Le grec emploie probablement cette expression corporelle de façon idiomatique pour dire que la personne se tourne vers Dieu dans la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Transition directe qui marque l’étape présente de la prière.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος, rendu naturellement par le titre divin usuel en français.
- source_word: τοὺς ὀφθαλμούς μου
  choice: mes yeux
  rationale: La traduction littérale conserve l’image corporelle associée à l’orientation de la prière.
- source_word: τὸ πρόσωπόν μου
  choice: mon visage
  rationale: Le sens concret convient au parallélisme avec « mes yeux » et préserve l’image du grec.
- source_word: εἰς σὲ
  choice: vers toi
  rationale: Cette formulation exprime clairement l’orientation indiquée par εἰς dans ce contexte.
- source_word: δέδωκα
  choice: je tourne
  rationale: Le parfait de δίδωμι signifie littéralement « j’ai donné », mais l’expression semble désigner ici le fait de s’orienter vers Dieu. Le présent français rend naturellement l’état résultant, tandis que la note conserve la formulation plus littérale.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Ô Seigneur
  rationale: « Seigneur » est une adresse moderne, digne et fidèle au vocatif grec, sans qu’il soit nécessaire d’ajouter « Ô ».
translation_notes:
  register: Français international moderne, simple et digne. Le texte maintient l’image concrète des yeux et du visage, tout en rendant idiomatiquement l’orientation vers Dieu.
