  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: fr
  text: Demande conseil à toute personne avisée, et ne méprise aucun conseil utile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: conseil / conseil
  rationale: Le nom désigne un avis destiné à guider une décision. « Conseil » est naturel en français et la répétition conserve le parallélisme lexical du grec sans lourdeur excessive.
- source_word: παρὰ παντὸς φρονίμου
  choice: à toute personne avisée
  rationale: παρά avec le génitif marque ici la source du conseil. En français, « demander conseil à quelqu’un » exprime naturellement cette relation. Le substantif adjectival grec est générique; « personne avisée » n’ajoute aucune restriction masculine.
- source_word: ζήτησον
  choice: Demande
  rationale: Dans ce contexte, ζητέω appelle la recherche active d’un conseil. L’expression idiomatique « demander conseil » rend cette force plus naturellement que « chercher un conseil ».
- source_word: μὴ καταφρονήσῃς
  choice: ne méprise
  rationale: καταφρονέω exprime le mépris ou le dédain, et non la simple négligence. « Ne méprise » en maintient la vigueur morale.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: aucun conseil utile
  rationale: Avec la défense, « aucun » rend naturellement la portée distributive de πάσης. « Utile » transmet directement χρησίμης.
theological_decisions:
- issue: Portée générique de φρονίμου
  choice: toute personne avisée
  alternative: tout homme sage
  rationale: Le grec emploie un adjectif substantivé générique, sans nom explicitement masculin. La traduction conserve cette portée sans introduire une précision de sexe absente du texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. L’impératif au singulier est conservé. « Avisée » communique ici la prudence et le discernement pratique de φρόνιμος.
