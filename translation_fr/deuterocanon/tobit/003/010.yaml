  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: fr
  text: 'En entendant cela, elle fut profondément affligée, au point de vouloir se pendre. Mais elle dit : « Je suis l’unique enfant de mon père. Si je fais cela, ce sera pour lui un déshonneur, et je ferai descendre sa vieillesse dans la douleur jusqu’à l’Hadès[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le séjour des morts » ou « la tombe ». Le grec porte « l’Hadès ».
    reason: Alternative lexicale destinée à éclairer le terme grec sans le réduire à une conception doctrinale particulière.
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: En entendant cela
  rationale: Le participe aoriste exprime ici la circonstance temporelle. « Cela » reprend naturellement le démonstratif neutre pluriel grec sans préciser davantage ce que Sara vient d’entendre.
- source_word: ἐλυπήθη σφόδρα
  choice: elle fut profondément affligée
  rationale: λυπέω désigne une vive douleur morale, et σφόδρα en renforce l’intensité. Cette formulation reste digne et naturelle en français moderne.
- source_word: ὥστε ἀπάγξασθαι
  choice: au point de vouloir se pendre
  rationale: La construction avec ὥστε présente le résultat extrême de son affliction. « Vouloir » indique l’acte envisagé sans laisser entendre qu’il a été accompli ni transformer le texte en résolution formelle.
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: Je suis l’unique enfant de mon père
  rationale: L’expression signifie qu’elle est la seule enfant de son père. Le grec dit simplement « une/seule » et ne répète pas explicitement « fille » ; « enfant » préserve cette formulation.
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: ce sera pour lui un déshonneur
  rationale: ὄνειδος évoque l’opprobre, la honte ou le déshonneur social. Cette tournure conserve la relation grammaticale avec le père sans expliquer outre mesure la nature du déshonneur.
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: je ferai descendre sa vieillesse
  rationale: La traduction conserve l’image grecque selon laquelle l’acte de Sara ferait descendre la vieillesse de son père vers le séjour des morts.
- source_word: μετʼ ὀδύνης
  choice: dans la douleur
  rationale: ὀδύνη peut désigner une douleur physique ou morale. Le contexte favorise une douleur chargée de chagrin, tandis que la formulation française garde une part de cette amplitude.
- source_word: εἰς ᾅδου
  choice: jusqu’à l’Hadès
  rationale: Le grec nomme explicitement l’Hadès. Garder ce terme évite de le confondre avec l’enfer au sens doctrinal plus tardif et préserve l’imagerie du texte source.
theological_decisions:
- issue: Sens de ᾅδης dans ce contexte grec deutérocanonique
  choice: l’Hadès
  alternative: le séjour des morts ; la tombe
  rationale: Le texte source emploie explicitement ᾅδης. « L’Hadès » maintient ce terme grec et son ambiguïté relative, sans imposer l’idée plus précise de lieu de châtiment associée à « l’enfer ». Les équivalents fonctionnels sont signalés en note.
translation_notes:
  register: 'Français international moderne, sobre et digne. La syntaxe reste accessible tout en conservant l’image sémitisante transmise par le grec : faire descendre la vieillesse du père dans la douleur jusqu’à l’Hadès. Le connecteur « Mais » rend le contraste logique entre l’impulsion suicidaire et la considération qui la retient, bien que le grec emploie littéralement « et ».'
