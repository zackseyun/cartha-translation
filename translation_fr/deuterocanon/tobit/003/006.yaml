base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: fr
  text: Et maintenant, agis envers moi comme il te plaît. Ordonne que tu reprennes mon esprit, afin que je sois délivré et que je devienne poussière[a]. Car il vaut mieux pour moi mourir que vivre, puisque j’ai entendu des reproches mensongers et qu’une grande tristesse m’habite. Ordonne que je sois dès maintenant délivré de cette détresse pour aller au lieu éternel[b]. Ne détourne pas ton visage de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que je devienne terre » ; il s’agit ici d’une image de la mort.'
    reason: lexical_alternative
  - marker: b
    text: « Le lieu éternel » désigne de manière générale le lieu des morts ; le grec n’emploie pas ici de terme doctrinal plus précis.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: comme il te plaît
  rationale: Cette tournure française naturelle exprime l’action conforme à ce qui plaît à Dieu, sans affaiblir la soumission à sa volonté.
- source_word: ἐπίταξον
  choice: Ordonne
  rationale: L’impératif demande directement à Dieu de donner un ordre souverain; « Ordonne » en conserve la force et la solennité.
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: que mon esprit soit repris
  rationale: « Esprit » traduit explicitement πνεῦμα. Le passif et « repris » rendent l’idée de prise en charge sans transformer la formule en affirmation doctrinale détaillée sur l’état après la mort.
- source_word: ἀπολυθῶ / ἀπολυθῆναι
  choice: que je sois délivré
  rationale: La répétition de « délivré » conserve celle du verbe grec et son image d’une libération, employée ici comme périphrase de la mort.
- source_word: γένωμαι γῆ
  choice: que je devienne poussière
  rationale: Le grec dit littéralement « que je devienne terre ». Dans ce contexte de mort, « poussière » communique naturellement l’image biblique de la condition mortelle; la formulation littérale est signalée en note.
- source_word: λυσιτελεῖ μοι
  choice: il vaut mieux pour moi
  rationale: Cette expression idiomatique française rend clairement l’idée de ce qui est préférable ou avantageux dans la comparaison entre mourir et vivre.
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: de fausses accusations
  rationale: ὀνειδισμός désigne des reproches, outrages ou insultes. Dans ce contexte, « fausses accusations » exprime naturellement les propos déshonorants et mensongers subis par Tobit.
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: une grande tristesse m’habite
  rationale: Cette formulation française actuelle préserve l’intensité et la dimension intérieure de la proposition grecque.
- source_word: τῆς ἀνάγκης
  choice: de cette détresse
  rationale: Dans cette prière de lamentation, ἀνάγκη évoque une situation oppressante et pénible plutôt qu’une simple nécessité abstraite.
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: pour aller au lieu éternel
  rationale: « Lieu éternel » reste proche du grec. « Pour aller » rend naturellement en français le mouvement exprimé par εἰς, sans nommer plus précisément la destination.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: Ne détourne pas de moi ton visage
  rationale: Cette formulation conserve directement l’image biblique du visage divin qui ne doit pas se détourner du suppliant.
theological_decisions:
- issue: Le vocabulaire anthropologique dans la demande de mourir
  choice: que mon esprit soit repris
  alternative: que ma vie me soit retirée
  rationale: Le texte grec emploie explicitement πνεῦμα, « esprit ». Le conserver évite de réduire le terme à la seule vie biologique, tout en n’imposant aucune doctrine élaborée sur la condition de l’esprit après la mort.
- issue: La destination après la mort
  choice: le lieu éternel
  alternative: le séjour des morts; la demeure éternelle; le tombeau
  rationale: Le grec ne nomme ni l’Hadès, ni le ciel, ni le tombeau. La traduction maintient donc son expression générale et sa tension théologique, sans préciser ce que le texte laisse indéterminé.
translation_notes:
  register: Français international moderne, naturel et digne. La prière demeure directe et solennelle. Les répétitions importantes du grec sont conservées, tandis que les constructions sont légèrement adaptées pour rester immédiatement compréhensibles.
