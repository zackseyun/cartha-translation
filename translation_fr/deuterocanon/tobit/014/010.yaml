revisions:
- from: 'Enterre-moi comme il convient, et enterre ta mère avec moi. Ensuite, ne restez plus à Ninive. Mon enfant, vois ce qu’Adam[a] a fait à Ahikar, qui l’avait élevé : il l’a fait passer de la lumière aux ténèbres, et voilà comment il l’a payé en retour ! Mais Ahikar fut sauvé, tandis qu’Adam reçut ce qu’il méritait et descendit lui-même dans les ténèbres. Manassès pratiqua l’aumône[b] et fut sauvé du piège mortel qu’Adam lui avait tendu ; mais Adam tomba dans ce piège et périt.'
  to: 'Enterre-moi comme il convient, et ta mère avec moi. Ne restez plus à Ninive. Mon enfant, vois ce qu’Adam[a] a fait à Ahikar, qui l’avait élevé : comment il l’a fait passer de la lumière aux ténèbres, et tout ce qu’il lui a rendu en retour. Mais Ahikar fut sauvé, tandis qu’Adam reçut sa rétribution et descendit lui-même dans les ténèbres. Manassès pratiqua l’aumône[b] et fut sauvé du piège mortel qu’Adam lui avait tendu ; mais Adam tomba dans le piège et périt.'
  rationale: La révision enlève l’ajout stylistique « voilà comment » et l’exclamation, traduit ὅσα par « tout ce que », et rend la rétribution sans introduire la notion interprétative de mérite. Elle maintient le nom Adam conformément au grec, avec sa note explicative, ainsi que l’aumône et sa note lexicale.
