base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: fr
  text: 'Enterre-moi comme il convient, et ta mère avec moi. Ne restez plus à Ninive. Mon enfant, vois ce qu’Adam[a] a fait à Ahikar, qui l’avait élevé : comment il l’a fait passer de la lumière aux ténèbres, et tout ce qu’il lui a rendu en retour. Mais Ahikar fut sauvé, tandis qu’Adam reçut sa rétribution et descendit lui-même dans les ténèbres. Manassès pratiqua l’aumône[b] et fut sauvé du piège mortel qu’Adam lui avait tendu ; mais Adam tomba dans le piège et périt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cet Adam est le courtisan perfide du récit d’Ahikar, et non le premier homme de la Genèse. Dans d’autres formes de cette tradition, son nom est Nadab ou Nadan.
    reason: Clarification du nom propre et signalement de la tradition textuelle sans remplacer la leçon grecque.
  - marker: b
    text: 'Ou : « fit œuvre de miséricorde ». Dans le livre de Tobit, le terme grec désigne souvent plus précisément le don fait aux pauvres.'
    reason: Préservation de l’étendue sémantique de ἐλεημοσύνη et de son sens contextuel fréquent.
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: Enterre-moi comme il convient
  rationale: La tournure rend naturellement l’impératif et la valeur de καλῶς, qui demande des funérailles accomplies de manière convenable, sans ajouter explicitement l’idée d’honneur.
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  choice: ne restez plus à Ninive
  rationale: Dans ce contexte, αὐλίζομαι dépasse la seule idée de passer la nuit et concerne le fait de demeurer dans la ville. Le pluriel grec est conservé par « restez ».
- source_word: τέκνον
  choice: Mon enfant
  rationale: Cette apostrophe affectueuse est idiomatique en français. Le possessif, implicite dans la relation familiale, évite la sécheresse de « Enfant » sans préciser le sexe.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Le texte grec de Swete porte explicitement Ἀδὰμ. Le nom est donc translittéré plutôt que remplacé silencieusement par Nadab ; une note prévient la confusion avec l’Adam de la Genèse.
- source_word: Ἀχιαχάρῳ / Ἀχιάχαρον
  choice: Ahikar
  rationale: « Ahikar » est une forme française lisible et reconnaissable du nom connu par la tradition sapientielle, tout en restant proche du référent grec.
- source_word: τῷ θρέψαντι αὐτόν
  choice: qui l’avait élevé
  rationale: Le participe de τρέφω désigne ici la prise en charge et l’éducation d’Adam par Ahikar, et non sa seule nourriture.
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: de la lumière aux ténèbres
  rationale: La formulation conserve l’opposition métaphorique forte et les articles du grec dans un français naturel.
- source_word: ὅσα ἀνταπέδωκεν αὐτῷ
  choice: voilà comment il l’a payé en retour !
  rationale: La tournure française exprime l’indignation exclamative portée par ὅσα et garde l’idée d’une réponse ingrate, sans préciser au-delà du texte la nature exacte du mal commis.
- source_word: τὸ ἀνταπόδομα ἀπεδόθη
  choice: reçut ce qu’il méritait
  rationale: Cette expression idiomatique transmet la rétribution correspondante soulignée par la répétition du groupe ἀνταποδ-, même si elle ne reproduit pas la forme passive grecque.
- source_word: ἐλεημοσύνην
  choice: pratiqua l’aumône
  rationale: Dans Tobit, ἐλεημοσύνη désigne fréquemment le don charitable concret. « Pratiquer l’aumône » est naturel et préserve le singulier collectif grec ; le sens plus large est signalé en note.
- source_word: ἐσώθη
  choice: fut sauvé
  rationale: Le passif est conservé sans nommer l’agent. Dans le récit immédiat, il s’agit d’une délivrance face à un danger mortel.
- source_word: παγίδος θανάτου
  choice: piège mortel
  rationale: 'Cette traduction concise rend l’effet du génitif θανάτου : le piège expose Manassès à la mort.'
theological_decisions:
- issue: Portée de « fut sauvé »
  choice: Conserver « fut sauvé » dans son sens narratif immédiat
  alternative: « fut délivré » ou lecture explicite en termes de salut spirituel
  rationale: Le contexte décrit une délivrance hors d’un complot mortel. La traduction garde néanmoins le terme théologiquement chargé sans imposer une doctrine du salut éternel étrangère à la phrase.
- issue: Valeur de ἐλεημοσύνη
  choice: « pratiqua l’aumône »
  alternative: « fit œuvre de miséricorde »
  rationale: L’aumône est un thème concret et récurrent de Tobit. La note maintient cependant la possibilité lexicale plus large d’actes de compassion.
- issue: Agent implicite du salut d’Ahikar
  choice: 'Passif sans agent : « Ahikar fut sauvé »'
  alternative: « Dieu sauva Ahikar »
  rationale: Le grec ne nomme pas l’agent de ἔσωσεν dans la formulation transmise. Ne pas ajouter « Dieu » préserve cette retenue et l’éventuelle tension théologique.
- issue: Identification d’Ἀδὰμ
  choice: Garder « Adam » avec une note explicative
  alternative: Normaliser le nom en « Nadab » ou « Nadan »
  rationale: La source grecque fournie porte Ἀδὰμ. La conservation du nom respecte le témoin textuel, tandis que la note empêche une fausse identification avec le premier homme et renseigne sur les formes connues dans d’autres traditions.
translation_notes:
  register: Français international actuel, digne et accessible. Les phrases restent narratives et directes. Les images de la lumière, des ténèbres et du piège sont conservées. Les noms suivent des formes lisibles en français, mais « Adam » reproduit délibérément la leçon de la source grecque avec clarification en note.
