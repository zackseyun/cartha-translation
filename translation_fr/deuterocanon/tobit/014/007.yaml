id: TOB.14.7
reference: Tobit 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: lxx-swete-1909
  text: καὶ εὐλογήσουσιν πάντα τὰ ἔθνη Κύριον. καὶ ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ, καὶ ὑψώσει Κύριος τὸν λαὸν αὐτοῦ· καὶ χαρήσονται πάντες οἱ ἀγαπῶντες Κύριον τὸν θεὸν ἐν ἀληθείᾳ καὶ δικαιοσύνῃ, ποιοῦντες ἔλεος τοῖς ἀδελφοῖς ἡμῶν.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: fr
  text: Toutes les nations béniront le Seigneur. Son peuple rendra grâce à Dieu[a], et le Seigneur exaltera son peuple. Tous ceux qui aiment le Seigneur Dieu dans la vérité et la justice[b] se réjouiront, pratiquant la miséricorde envers nos frères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « confessera » ou « louera », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « la droiture » ; le mot grec peut désigner la justice ou la conduite droite.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « nos frères » ; le terme peut désigner plus largement les proches ou les membres de la communauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: béniront
  rationale: Le verbe signifie littéralement « bénir » ou « dire du bien de ». Avec le Seigneur comme objet, « béniront » conserve la formulation biblique sans la réduire à la seule idée de louange.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette traduction directe préserve la portée universelle de l’expression sans imposer ici le sens plus contrastif de « païens ».
- source_word: ἐξομολογήσεται
  choice: rendra grâce
  rationale: Dans le grec biblique, le verbe peut exprimer l’aveu, la reconnaissance, l’action de grâce ou la louange. Le contexte d’adoration favorise ici « rendra grâce ».
- source_word: ὑψώσει
  choice: exaltera
  rationale: « Exalter » conserve à la fois l’image d’élévation et l’idée de conférer honneur et dignité.
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: dans la vérité et la justice
  rationale: La formulation garde la préposition commune aux deux noms et laisse ouverte la nuance de manière ou de sphère dans laquelle Dieu est aimé.
- source_word: ποιοῦντες ἔλεος
  choice: pratiquant la miséricorde
  rationale: Cette expression française naturelle conserve la valeur active de la tournure sémitisante, littéralement « faisant miséricorde ».
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: envers nos frères
  rationale: Le rendu suit le masculin pluriel explicite du grec, tout en signalant en note sa possible portée représentative au sein de la parenté ou de la communauté.
theological_decisions:
- issue: Traduction de Κύριος
  choice: Seigneur
  alternative: le SEIGNEUR
  rationale: « Seigneur » est le correspondant français direct et traditionnel de κύριος; le grec de cette édition ne permet pas à lui seul d’imposer la typographie « SEIGNEUR ».
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français courant de δικαιοσύνη et préserve sa largeur sémantique. Dans ce contexte moral et dévotionnel, « droiture » reste une possibilité.
- issue: Portée de ἀδελφοῖς
  choice: frères
  alternative: frères et sœurs / membres de notre communauté
  rationale: Le texte grec porte le masculin pluriel « frères ». Celui-ci peut toutefois désigner de façon représentative les proches ou les membres de la communauté, possibilité conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe coordonnée du grec est conservée, de même que le participe final, qui décrit la conduite de ceux qui aiment Dieu et se réjouissent.
