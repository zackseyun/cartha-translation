  yaml_path: translation/deuterocanon/tobit/014/008.yaml
  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
translation:
  language: fr
  text: Et maintenant, mon enfant[a], pars de Ninive, car ce qu’a dit le prophète Jonas arrivera certainement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon fils » ; le grec emploie un terme d’adresse filiale qui peut se traduire de l’une ou l’autre manière selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: mon enfant
  rationale: Terme d’adresse filiale. « Mon enfant » est naturel en français et explicite la relation affectueuse sans préciser le sexe au-delà du grec.
- source_word: ἄπελθε
  choice: pars
  rationale: L’impératif aoriste appelle un départ effectif. « Pars » est direct, courant et solennel sans être archaïque.
- source_word: ἀπὸ Νινευή
  choice: de Ninive
  rationale: ἀπό exprime l’éloignement hors de la ville; avec « partir », « de Ninive » est la formulation française idiomatique.
- source_word: πάντως
  choice: certainement
  rationale: L’adverbe souligne avec force la certitude de l’accomplissement.
- source_word: ἔσται
  choice: arrivera
  rationale: Dans le contexte d’une annonce prophétique, « arrivera » rend naturellement le sens événementiel du littéral « sera ».
- source_word: ἃ ἐλάλησεν
  choice: ce qu’a annoncé
  rationale: Le verbe λαλέω signifie parler ou dire; ici, « annoncer » exprime naturellement le contenu d’une parole prophétique sans en préciser le détail.
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: le prophète Jonas
  rationale: Rend directement le titre et le nom dans l’ordre naturel du français.
theological_decisions:
- issue: Certitude de l’accomplissement de la parole concernant Ninive
  choice: « ce qu’a annoncé le prophète Jonas arrivera certainement »
  alternative: « ce qu’a dit le prophète Jonas s’accomplira à coup sûr »
  rationale: La formulation maintient l’affirmation emphatique du texte quant à l’avenir, sans ajouter d’interprétation sur le moment, la forme ou le mécanisme de cet accomplissement.
translation_notes:
  register: Français international moderne, clair et digne. « Pars » évite le caractère plus administratif de « quitte » et l’archaïsme de « va-t’en »; « arrivera certainement » conserve l’insistance prophétique.
