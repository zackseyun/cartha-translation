base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: fr
  text: Avant de mourir, il apprit la nouvelle de la destruction de Ninive, que Nabuchodonosor et Assuérus avaient emmenée en captivité[a]. Avant de mourir, il se réjouit de Ninive. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement que Nabuchodonosor et Assuérus avaient « emmené Ninive en captivité ». Cette formulation est conservée, bien que l’identification historique de ces souverains par rapport à la chute de Ninive soit discutée.
    reason: La note signale à la fois l’image inhabituelle du texte source et la difficulté historique, sans corriger ni harmoniser le grec dans le corps du texte.
lexical_decisions:
- source_word: ἤκουσεν
  choice: il apprit
  rationale: Le verbe signifie littéralement « il entendit », mais, devant l’annonce d’un événement, « il apprit » exprime naturellement en français qu’il en reçut la nouvelle.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν / πρὸ τοῦ ἀποθανεῖν
  choice: avant de mourir
  rationale: Cette formulation française claire conserve les deux indications temporelles répétées dans le grec.
- source_word: ἀπωλίαν
  choice: destruction
  rationale: Dans ce contexte, le nom désigne la ruine ou l’anéantissement de Ninive ; « destruction » en rend directement le sens.
- source_word: ᾐχμαλώτισεν
  choice: avaient emmenée en captivité
  rationale: Le verbe a pour sens fondamental « faire captif, emmener en captivité ». La formulation conserve l’image inhabituelle appliquée à la ville elle-même au lieu de l’aplanir en simple « conquérir ».
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Il s’agit de la forme française biblique courante du nom.
- source_word: Ἀσύηρος
  choice: Assuérus
  rationale: Il s’agit de la forme française biblique courante du nom.
- source_word: ἐχάρη
  choice: il se réjouit
  rationale: Cette expression rend fidèlement le verbe grec tout en gardant un registre digne et naturel.
- source_word: ἐπὶ Νινευή
  choice: au sujet de Ninive
  rationale: Avec le verbe « se réjouir », ἐπί peut indiquer l’objet ou l’occasion de la joie. Cette traduction conserve la relative indétermination du grec sans expliciter davantage le motif.
- source_word: ἀμήν
  choice: Amen
  rationale: Le terme figure explicitement dans le témoin grec et est donc conservé.
theological_decisions:
- issue: Identification historique des conquérants nommés dans le texte grec
  choice: Conserver « Nabuchodonosor et Assuérus » sans harmonisation historique.
  alternative: Remplacer ces noms par ceux de souverains associés à la chute de Ninive dans certaines reconstructions historiques.
  rationale: La traduction doit représenter le témoin grec tel qu’il est transmis et ne pas corriger silencieusement sa formulation à partir d’une reconstruction extérieure.
- issue: Objet exact de la joie exprimée par ἐπὶ Νινευή
  choice: Traduire « il se réjouit au sujet de Ninive ».
  alternative: Expliciter « il se réjouit de la chute de Ninive » ou « de la destruction de Ninive ».
  rationale: Le contexte relie vraisemblablement cette joie à la destruction de la ville, mais la préposition grecque ne formule pas elle-même ce rapport de façon aussi explicite ; la traduction préserve donc cette légère ambiguïté.
translation_notes:
  register: Français moderne international, clair et digne. La répétition de « avant de mourir », présente dans le grec, est maintenue. La tournure légèrement inhabituelle « au sujet de Ninive » vise à préserver l’indétermination de ἐπὶ Νινευή.
