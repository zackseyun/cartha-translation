  naturalness: « Il apprit la nouvelle de la destruction de Ninive » est plus naturel en français moderne que « il apprit la destruction de Ninive ». « Il se réjouit au sujet de Ninive » est grammatical, mais peu naturel avec « se réjouir » et affaiblit la relation positive exprimée par le verbe et ἐπί. « Il se réjouit de Ninive » est idiomatique tout en demeurant concis et contextuellement ouvert.
  terminology: Les formes « Ninive », « Nabuchodonosor » et « Assuérus » sont les formes bibliques françaises usuelles. « Emmenée en captivité » conserve délibérément l’image surprenante du grec appliquée à la ville, sans harmonisation historique. La note est appropriée et son ancre est correctement placée après l’expression concernée.
