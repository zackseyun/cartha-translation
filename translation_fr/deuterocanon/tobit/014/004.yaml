base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: fr
  text: 'Va en Médie, mon enfant, car je suis convaincu que ce que le prophète Jonas a annoncé au sujet de Ninive s’accomplira : elle sera renversée. Mais, en Médie, il y aura plutôt la paix, pour un temps[a]. Nos frères seront dispersés hors de la bonne terre, Jérusalem sera dévastée, et la maison de Dieu qui s’y trouve sera consumée par le feu[b] ; elle restera dévastée jusqu’à un temps.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec contient un comparatif, littéralement « plutôt davantage de paix jusqu’à un temps ». Il peut évoquer une sécurité relative en Médie plutôt qu’une paix complète.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Dieu » désigne le temple de Jérusalem.
    reason: historical_clarification
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: Va en Médie
  rationale: L’impératif aoriste exprime un départ commandé vers une destination. « Va en Médie » est naturel en français et conserve le nom géographique traditionnel.
- source_word: τέκνον
  choice: mon enfant
  rationale: Le vocatif exprime ici l’affection familiale. « Mon enfant » conserve cette tendresse sans préciser « fils » au-delà du terme grec.
- source_word: πέπεισμαι
  choice: je suis convaincu
  rationale: Le parfait marque un état de conviction établi ; cette tournure française en rend naturellement la force présente.
- source_word: ὅσα ἐλάλησεν Ἰωνᾶς ὁ προφήτης περὶ Νινευὴ
  choice: ce qu’a annoncé le prophète Jonas au sujet de Ninive
  rationale: « Annoncé » convient au discours prophétique tout en restant courant. Le relatif collectif « ce que » rend le contenu des paroles.
- source_word: καταστραφήσεται
  choice: elle sera renversée
  rationale: Le futur passif de καταστρέφω évoque le renversement et la ruine de la ville ; « renversée » conserve cette image prophétique.
- source_word: ἐν δὲ τῇ Μηδείᾳ ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: En Médie, en revanche, il y aura davantage de paix jusqu’à un certain temps
  rationale: « En revanche » rend δέ, tandis que « davantage de paix » maintient la valeur comparative de μᾶλλον, souvent lissée dans les traductions. « Jusqu’à un certain temps » préserve la limite temporelle sans supposer explicitement un temps fixé par Dieu.
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: nos frères
  rationale: Traduction directe du masculin pluriel, désignant ici les membres du même peuple.
- source_word: σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς
  choice: seront dispersés loin de la bonne terre
  rationale: « Dispersés » rend le passif et le motif de la dispersion ; « loin de » explicite idiomatiquement l’éloignement exprimé par ἀπό. « Bonne terre » préserve la formulation biblique sans la réduire à la fertilité.
- source_word: Ἰεροσόλυμα ἔσται ἔρημος
  choice: Jérusalem sera dévastée
  rationale: Dans ce contexte de jugement, ἔρημος décrit une ville dévastée et abandonnée plutôt qu’un désert au sens géographique.
- source_word: ὁ οἶκος τοῦ θεοῦ ἐν αὐτῇ κατακαήσεται
  choice: la maison de Dieu qui s’y trouve sera entièrement brûlée
  rationale: « Maison de Dieu » conserve l’expression source ; « entièrement brûlée » rend la force intensive de κατακαίω.
- source_word: ἔρημος ἔσται μέχρι χρόνου
  choice: elle restera dévastée jusqu’à un certain temps
  rationale: Le sujet le plus naturel est Jérusalem. « Restera » exprime en français l’état prolongé, et « jusqu’à un certain temps » maintient l’indétermination de χρόνος.
theological_decisions:
- issue: Rapport entre la conviction de Tobit et la prophétie de Jonas
  choice: '« ce qu’a annoncé le prophète Jonas […] s’accomplira : elle sera renversée »'
  alternative: '« je suis convaincu de tout ce qu’a dit le prophète Jonas […] : elle sera renversée »'
  rationale: La formulation choisie clarifie la syntaxe en présentant le renversement comme l’accomplissement du discours prophétique, sans ajouter d’explication doctrinale.
- issue: Portée de μᾶλλον dans l’annonce concernant la Médie
  choice: « il y aura davantage de paix »
  alternative: « il y aura la paix pendant un certain temps »
  rationale: La traduction conserve explicitement le comparatif grec et suggère ainsi une sécurité relative, non nécessairement une paix absolue.
- issue: Référent de « la maison de Dieu »
  choice: Conserver « la maison de Dieu » dans le texte et identifier le temple en note
  alternative: Traduire directement « le temple de Dieu »
  rationale: La formulation source porte une valeur théologique et imagée qu’il convient de préserver ; la note donne au lecteur le référent historique sans remplacer l’expression grecque.
- issue: Référent du dernier ἔρημος
  choice: « elle restera dévastée », en référence à Jérusalem
  alternative: « ce lieu restera dévasté » ou rattachement à la maison de Dieu
  rationale: Le féminin singulier ἔρημος s’accorde naturellement avec Jérusalem telle qu’elle est construite dans la phrase grecque, tandis que « maison » est masculin en grec.
translation_notes:
  register: Français international moderne, digne et accessible. Les enchaînements prophétiques restent sobres. Le comparatif inhabituel de μᾶλλον et les deux limites temporelles ont été conservés afin de ne pas effacer l’ambiguïté du grec.
