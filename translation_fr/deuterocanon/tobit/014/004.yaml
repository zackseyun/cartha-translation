revisions:
- from: 'Va en Médie, mon enfant, car je suis convaincu que ce qu’a annoncé le prophète Jonas au sujet de Ninive s’accomplira : elle sera renversée. En Médie, en revanche, il y aura davantage de paix jusqu’à un certain temps[a]. Nos frères seront dispersés loin de la bonne terre, Jérusalem sera dévastée, et la maison de Dieu qui s’y trouve sera entièrement brûlée[b] ; elle restera dévastée jusqu’à un certain temps.'
  to: 'Va en Médie, mon enfant, car je suis convaincu que ce que le prophète Jonas a annoncé au sujet de Ninive s’accomplira : elle sera renversée. Mais, en Médie, il y aura plutôt la paix, pour un temps[a]. Nos frères seront dispersés hors de la bonne terre, Jérusalem sera dévastée, et la maison de Dieu qui s’y trouve sera consumée par le feu[b] ; elle restera dévastée jusqu’à un temps.'
  rationale: La révision évite de transformer le comparatif implicite μᾶλλον en une comparaison quantitative explicite. Elle remplace deux tournures temporelles peu naturelles par des équivalents français qui maintiennent la différence entre la paix temporaire en Médie et la désolation qui dure jusqu’à un temps indéterminé. Le reste du texte demeure proche du projet, avec une formulation plus idiomatique de κατακαήσεται.
