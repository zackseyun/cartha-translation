  verdict: revise
  source_fidelity: 'La traduction rend fidèlement l’ordre, la conviction de Tobit, l’annonce concernant Ninive, la dispersion, la désolation de Jérusalem et l’incendie de la maison de Dieu. Une révision est toutefois préférable pour μᾶλλον : « davantage de paix » introduit un comparatif quantitatif français plus précis que le grec, dont le comparant demeure implicite et peut exprimer une paix relative. Les deux expressions temporelles gagnent aussi à être formulées plus naturellement sans les confondre.'
  naturalness: « Jusqu’à un certain temps » est peu idiomatique en français moderne. « Pour un temps » et « jusqu’à un temps » conservent respectivement les limites temporelles de ἕως καιροῦ et μέχρι χρόνου dans un registre biblique moderne et lisible.
  terminology: « Médie », « Jonas », « Ninive », « nos frères », « la bonne terre » et « la maison de Dieu » sont appropriés. « Consumée par le feu » rend naturellement le passif intensif κατακαήσεται, sans remplacer l’expression source par « temple » dans le texte.
