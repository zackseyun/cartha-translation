base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: fr
  text: Et maintenant, mes enfants, voyez ce que fait l’aumône et comment la justice[a] délivre. Tandis qu’il disait cela, sa vie prit fin sur son lit.[b] Il avait cent cinquante-huit ans, et il l’ensevelit avec honneur.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ». Le mot grec peut désigner la justice ou la conduite droite selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « son âme défaillit » ou « son âme s’éteignit » : tournure grecque désignant la mort.'
    reason: lexical_alternative
  - marker: c
    text: 'On pourrait s’attendre à « ils l’ensevelirent avec honneur », mais le témoin grec suivi ici emploie un verbe au singulier : « il l’ensevelit avec honneur ».'
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  choice: mes enfants
  rationale: Le vocatif désigne affectueusement des descendants ou de jeunes auditeurs. « Mes enfants » est naturel en français et n’en précise pas inutilement le genre.
- source_word: ἴδετε
  choice: voyez
  rationale: L’impératif pluriel garde la force directe de l’exhortation grecque.
- source_word: ἐλεημοσύνη
  choice: l’aumône
  rationale: Dans Tobit, le terme renvoie concrètement au don fait aux nécessiteux, et non à la seule disposition intérieure de compassion.
- source_word: ποιεῖ
  choice: fait
  rationale: 'Ce verbe simple conserve la formulation ouverte du grec : les auditeurs sont invités à constater ce que produit ou accomplit l’aumône.'
- source_word: δικαιοσύνη
  choice: la justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et peut ici englober la conduite droite; « droiture » reste une possibilité contextuelle.
- source_word: ῥύεται
  choice: délivre
  rationale: Le verbe exprime l’action d’arracher au danger ou de sauver, sans préciser ici la nature exacte de la délivrance.
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: sa vie prit fin
  rationale: L’expression grecque décrit sa mort. Cette formulation française claire évite de transformer l’idiome en affirmation anthropologique plus précise.
- source_word: κλίνη
  choice: lit
  rationale: « Lit » est le sens courant et approprié dans le récit de sa mort.
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: Il avait cent cinquante-huit ans
  rationale: Formulation idiomatique en français moderne pour indiquer l’âge.
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: il l’ensevelit avec honneur
  rationale: Le singulier du témoin grec est conservé, malgré un sujet implicite dont l’identité dépend du contexte. « Avec honneur » décrit dignement la manière de l’ensevelir.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: la justice
  alternative: la droiture
  rationale: Le mot grec peut désigner la justice ou la conduite juste. « Justice » préserve sa portée morale et théologique sans le réduire à la justice judiciaire; la note signale l’autre nuance possible.
- issue: Idiotisme de mort ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: sa vie prit fin
  alternative: son âme le quitta
  rationale: Le grec signifie littéralement que son âme défaillit ou lui fit défaut, mais sert ici à annoncer sa mort. Le texte principal communique l’événement sans imposer une conception particulière de la séparation de l’âme et du corps.
- issue: Sujet implicite de ἔθαψεν
  choice: il l’ensevelit
  alternative: on l’ensevelit / ils l’ensevelirent
  rationale: Le verbe du témoin grec fourni est au singulier. La traduction conserve cette donnée même si l’identité du sujet n’est pas exprimée dans le verset.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Le rythme sentencieux de l’exhortation est conservé, de même que le singulier difficile de la dernière proposition. Les notes rendent visibles l’ambiguïté de δικαιοσύνη, l’idiotisme grec décrivant la mort et la difficulté du sujet implicite.
