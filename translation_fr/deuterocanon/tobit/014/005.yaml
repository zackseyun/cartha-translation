base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: fr
  text: Et de nouveau, Dieu aura compassion d’eux et les ramènera dans le pays. Ils bâtiront la maison, mais elle ne sera pas comme la précédente, jusqu’à ce que les temps de l’âge soient accomplis[a]. Après cela, ils reviendront de leurs captivités[b] et bâtiront Jérusalem dignement. La maison de Dieu sera glorieusement bâtie en elle, comme les prophètes ont parlé d’elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les temps de l’âge » peut désigner les temps fixés qui conduisent à un accomplissement plus complet de l’œuvre de Dieu ; le grec demeure volontairement ouvert.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie le pluriel « captivités », qui peut évoquer plusieurs lieux ou épisodes d’exil.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec parle de Jérusalem au féminin : « en elle » et « d’elle ».'
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Marque la reprise de l’action miséricordieuse de Dieu après le jugement et l’exil.
- source_word: ἐλεήσει
  choice: aura compassion de
  rationale: Exprime la miséricorde divine dans un français actuel et digne, sans atténuer la portée religieuse du verbe.
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: les ramènera dans le pays
  rationale: Rend le sens causatif du retour tout en conservant l’article défini du grec, qui ne dit pas explicitement « leur pays ».
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: ils bâtiront la maison
  rationale: Conserve l’expression grecque « la maison » plutôt que d’expliciter immédiatement « le Temple »; la suite précise qu’il s’agit de la maison de Dieu.
- source_word: οὐχ οἷος ὁ πρότερος
  choice: mais elle ne sera pas comme la précédente
  rationale: Rend clairement la comparaison avec la première maison et fait entendre la nuance concessive dans un français naturel.
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: jusqu’à ce que les temps de l’âge soient accomplis
  rationale: Préserve l’expression temporelle et eschatologique volontairement ouverte du grec, sans la réduire à un système interprétatif précis.
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: de leurs captivités
  rationale: Maintient le pluriel explicite, susceptible d’évoquer plusieurs lieux ou épisodes de captivité.
- source_word: ἐντίμως
  choice: dignement
  rationale: Rend l’idée d’une reconstruction honorable et digne, dans un français plus naturel que « honorablement ».
- source_word: ἐν αὐτῇ
  choice: en elle
  rationale: Conserve le pronom féminin renvoyant à Jérusalem et l’effet de personnification de la ville.
- source_word: ἐνδόξως
  choice: avec gloire
  rationale: Préserve la résonance de δόξα et ne réduit pas le terme à la seule splendeur architecturale.
- source_word: καθὼς ἐλάλησαν περὶ αὐτῆς οἱ προφῆται
  choice: comme les prophètes ont parlé d’elle
  rationale: Rend simplement la référence aux paroles prophétiques tout en maintenant le féminin appliqué à Jérusalem.
theological_decisions:
- issue: Sens de καιροὶ τοῦ αἰῶνος
  choice: les temps de l’âge
  alternative: les temps fixés / les temps éternels
  rationale: Le grec est suggestif sur le plan eschatologique, mais demeure imprécis. La formulation retenue conserve cette tension plutôt que d’imposer une chronologie doctrinale.
- issue: Référent de « la maison »
  choice: la maison
  alternative: le Temple
  rationale: Le contexte désigne bien le Temple, mais le grec emploie d’abord l’expression biblique « la maison ». La conserver respecte la progression du texte, qui parle ensuite de « la maison de Dieu ».
- issue: Personnification de Jérusalem
  choice: en elle / d’elle
  alternative: y / à son sujet
  rationale: Les formes féminines grecques renvoient à Jérusalem. Leur maintien conserve l’image de la ville personnifiée sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec lorsque cette proximité porte une nuance importante, notamment pour « la maison », « les temps de l’âge » et la personnification féminine de Jérusalem; ailleurs, des formulations idiomatiques comme « dignement » assurent la fluidité.
