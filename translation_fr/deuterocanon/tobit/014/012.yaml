source:
  edition: lxx-swete-1909
  text: Καὶ ὅτε ἀπέθανεν Ἅννα, ἔθαψεν αὐτὴν μετὰ τοῦ πατρὸς αὐτοῦ· ἀπῆλθεν δὲ Τωβίας μετὰ τῆς γυναικὸς αὐτοῦ καὶ τῶν υἱῶν αὐτοῦ εἰς Ἐκβάτανα πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: fr
  text: Quand Anna mourut, il[a] l’enterra avec son père. Puis Tobias partit avec sa femme et ses fils pour Ecbatane, chez Ragouël, son beau-père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « il l’enterra avec son père ». Le sujet de « l’enterra » n’est pas exprimé; dans la proposition suivante, le grec nomme explicitement Tobias.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: L’aoriste de ἀποθνῄσκω exprime simplement la mort; « mourut » est direct, sobre et adapté au récit.
- source_word: ἔθαψεν
  choice: l’enterra
  rationale: Le verbe θάπτω signifie « enterrer »; le pronom objet reprend naturellement Anna en français.
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: avec son père
  rationale: μετά avec le génitif signifie « avec ». Dans ce contexte funéraire, la formule peut évoquer une sépulture commune ou le même lieu d’inhumation; la traduction conserve cette latitude sans préciser « à côté de ».
- source_word: ἀπῆλθεν
  choice: partit
  rationale: ἀπέρχομαι marque le départ. « Partit » rend naturellement le déplacement qui suit l’enterrement.
- source_word: γυναικὸς
  choice: femme
  rationale: Dans ce contexte familial et possessif, γυνή désigne l’épouse; « sa femme » est l’expression française courante.
- source_word: υἱῶν
  choice: fils
  rationale: Le grec désigne explicitement des fils et non, de façon générale, des enfants.
- source_word: Ἐκβάτανα
  choice: Ecbatane
  rationale: « Ecbatane » est la forme française traditionnelle et reconnue du nom de cette ville.
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: chez Ragouël, son beau-père
  rationale: πρός avec une personne indique ici le mouvement vers elle; « chez » est idiomatique en français. πενθερός signifie « beau-père ».
theological_decisions:
- issue: Sujet de la proposition concernant l’enterrement
  choice: 'Conserver un pronom sujet non explicité par un nom: « il l’enterra », puis nommer explicitement Tobias dans la proposition suivante.'
  alternative: Identifier le sujet implicite comme Tobias dès la première proposition.
  rationale: Le grec ne formule aucun sujet avec ἔθαψεν, puis emploie explicitement Τωβίας avec ἀπῆλθεν. La traduction et la note préservent cette différence au lieu de trancher silencieusement l’identité du sujet implicite.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms sont rendus par des formes françaises lisibles proches du grec: Anna, Tobias, Ecbatane et Ragouël. « Chez Ragouël » évite la tournure moins naturelle « vers Ragouël » tout en conservant l’idée de destination.'
