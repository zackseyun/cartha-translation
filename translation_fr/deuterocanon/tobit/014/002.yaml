  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: fr
  text: Il avait cinquante-huit ans lorsqu’il perdit la vue[a] et, huit ans plus tard, il la recouvra. Il accomplissait des œuvres de miséricorde[b] et continuait à craindre Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « il perdit les vues », puis emploie l’expression « il vit de nouveau » ; il s’agit d’un idiome désignant la perte puis le recouvrement de la vue.
    reason: lexical_alternative
  - marker: b
    text: Ou « il faisait l’aumône » ; le terme grec peut désigner précisément l’aumône ou, plus largement, des œuvres de miséricorde.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit seulement « continuait à craindre » ; « Dieu » est sous-entendu par le contexte de piété.
    reason: implicit_content
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτὼ
  choice: Il avait cinquante-huit ans
  rationale: Tournure française naturelle pour exprimer l’âge, correspondant directement à l’idiome grec.
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: il perdit la vue
  rationale: Le grec dit littéralement qu’il « perdit les vues »; « perdre la vue » restitue naturellement l’idiome sans le réduire à une simple atteinte des yeux.
- source_word: μετὰ ἔτη ὀκτὼ
  choice: huit ans plus tard
  rationale: Expression temporelle française fluide et fidèle à « après huit ans ».
- source_word: ἀνέβλεψεν
  choice: il la recouvra
  rationale: Dans un contexte de cécité, le verbe signifie retrouver la vue. Le pronom reprend clairement « la vue » et évite une répétition lourde.
- source_word: ἐποίει ἐλεημοσύνας
  choice: Il accomplissait des œuvres de miséricorde
  rationale: L’imparfait rend l’action habituelle ou continue de ἐποίει. « Œuvres de miséricorde » conserve la portée possible du terme, qui peut désigner l’aumône en particulier ou des actes de compassion plus largement.
- source_word: προσεθέτο φοβεῖσθαι
  choice: continua à craindre Dieu
  rationale: La construction exprime la continuation ou l’ajout d’une pratique. L’objet de « craindre » n’est pas exprimé dans le grec conservé; « Dieu » est explicité en français d’après le contexte de piété, avec une note signalant cet ajout.
theological_decisions:
- issue: Objet implicite de φοβεῖσθαι
  choice: continua à craindre Dieu
  alternative: continua à craindre; persévéra dans la crainte
  rationale: Dans ce résumé de la piété de Tobit, la crainte vise naturellement Dieu. Le français appelle ici un complément pour éviter une formulation énigmatique, mais la note préserve le fait que « Dieu » n’est pas explicitement écrit dans le texte grec fourni.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « accomplissait » rend la valeur durative de l’imparfait grec, tandis que « continua » reflète la construction additive de προσεθέτο. Les notes rendent visibles l’idiome relatif à la vue, l’étendue sémantique de ἐλεημοσύνας et l’objet implicite de « craindre ».
