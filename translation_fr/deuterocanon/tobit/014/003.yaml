  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: fr
  text: 'Il était devenu très vieux et il appela son fils et ses petits-fils[a]. Il lui dit : « Mon enfant, prends tes fils. Vois, je suis devenu vieux et je suis sur le point de quitter la vie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « son fils et les fils de celui-ci », c’est-à-dire son fils et ses petits-fils.'
    reason: lexical_alternative
  - marker: b
    text: Le grec exprime littéralement l’idée d’être sur le point de « s’en aller de la vie », avec une tournure imagée; c’est une manière de dire que sa mort est proche.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: Il était devenu très vieux
  rationale: μεγάλως intensifie le vieillissement; le plus-que-parfait convient au récit français et présente l’état acquis avant les actions suivantes. δέ est rendu par la simple continuité narrative, sans connecteur artificiel.
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: son fils et ses petits-fils
  rationale: La répétition littérale de « ses fils » après « son fils » désigne naturellement les fils de ce dernier. « Ses petits-fils » explicite en français moderne la relation voulue; une note conserve la forme grecque.
- source_word: Τέκνον
  choice: Mon enfant
  rationale: τέκνον est une adresse filiale affectueuse. « Mon enfant » est idiomatique, digne et chaleureux en français, sans durcir le terme en « fils ».
- source_word: λάβε τοὺς υἱούς σου
  choice: prends tes fils avec toi
  rationale: Le sens premier de λάβε est « prends ». L’ajout idiomatique « avec toi » rend clairement l’idée de les emmener ou de les prendre sous sa conduite sans imposer une destination absente du grec.
- source_word: ἰδοὺ
  choice: Vois
  rationale: « Vois » attire solennellement l’attention tout en restant actuel; « voici » s’insérerait moins naturellement devant une proposition personnelle.
- source_word: γεγήρακα
  choice: je suis devenu vieux
  rationale: Le parfait grec exprime un état présent issu du vieillissement. Le passé composé français en garde la valeur résultative.
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: je suis sur le point de quitter la vie
  rationale: Cette expression inhabituelle signifie littéralement qu’il est tourné vers le fait de s’éloigner de la vie. Le rendu français conserve l’imminence et l’euphémisme de la mort sans reproduire maladroitement l’idée de courir.
theological_decisions:
- issue: Expression euphémique de la mort imminente
  choice: je suis sur le point de quitter la vie
  alternative: je vais mourir
  rationale: Le grec ne recourt pas au verbe direct « mourir », mais à une périphrase. Le français préserve donc cette retenue et la tension de l’image sans obscurcir le sens.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation est allégée par rapport à la parataxe grecque. « Mon enfant » garde la chaleur de l’adresse; « quitter la vie » conserve l’euphémisme solennel sans archaïsme.
