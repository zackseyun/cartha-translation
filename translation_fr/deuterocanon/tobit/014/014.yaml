lexical_decisions:
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Le verbe aoriste désigne directement la mort. « Mourut » est sobre, précis et sans euphémisme.
- source_word: ἐτῶν ἑκατὸν ἑπτὰ
  choice: à l’âge de cent sept ans
  rationale: Ce génitif d’âge indique l’âge au moment de la mort. Cette formulation est naturelle et digne en français moderne.
- source_word: ἐν Ἐκβατάνοις
  choice: à Ecbatane
  rationale: Avec un nom de ville, le français emploie naturellement « à ». « Ecbatane » est la forme française traditionnelle du toponyme.
- source_word: τῆς Μηδείας
  choice: en Médie
  rationale: Le génitif précise la région à laquelle appartient la ville. « En Médie » exprime clairement et naturellement cette localisation en français.
