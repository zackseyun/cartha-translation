  yaml_path: translation/deuterocanon/tobit/014/006.yaml
  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: fr
  text: Et toutes les nations se tourneront véritablement vers le Seigneur Dieu pour le craindre[a] ; elles enterreront leurs idoles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reviendront véritablement pour craindre le Seigneur Dieu ». Le verbe grec peut signifier « se tourner » ou « revenir » ; il exprime ici un mouvement sincère vers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette expression désigne ici l’ensemble des peuples et en conserve la portée universelle, sans introduire artificiellement une opposition entre Juifs et non-Juifs.
- source_word: ἐπιστρέψουσιν
  choice: se tourneront
  rationale: Le verbe exprime le fait de se tourner ou de revenir. « Se tourneront » maintient la métaphore biblique sans imposer le terme doctrinal plus technique « se convertiront ».
- source_word: ἀληθινῶς
  choice: véritablement
  rationale: L’adverbe souligne le caractère réel et sincère de ce mouvement vers Dieu. « Véritablement » en préserve clairement la force.
- source_word: φοβεῖσθαι
  choice: pour le craindre
  rationale: Le sens direct est « craindre ». Cette formulation conserve le langage biblique de la crainte de Dieu ainsi que sa tension entre crainte, respect et soumission.
- source_word: Κύριον τὸν θεόν
  choice: le Seigneur Dieu
  rationale: La formulation suit directement le groupe grec, sans ajouter de possessif absent du texte.
- source_word: κατορύξουσιν
  choice: enterreront
  rationale: Le verbe évoque l’action d’enfouir ou de mettre sous terre. « Enterreront » restitue cette image concrète et convient au rejet des idoles.
- source_word: τὰ εἴδωλα αὐτῶν
  choice: leurs idoles
  rationale: Dans ce contexte religieux, « idoles » est le terme français précis ; « images » serait trop neutre et « faux dieux » plus interprétatif.
theological_decisions:
- issue: Faut-il atténuer φοβεῖσθαι en traduisant par « révérer » ?
  choice: pour le craindre
  alternative: pour le révérer
  rationale: Le grec emploie explicitement le langage biblique de la crainte de Dieu. Le conserver évite d’aplanir sa portée théologique, qui comprend respect, soumission et crainte révérencielle.
- issue: ἐπιστρέψουσιν doit-il être rendu par un vocabulaire formel de conversion ?
  choice: se tourneront véritablement vers le Seigneur Dieu
  alternative: se convertiront véritablement au Seigneur Dieu
  rationale: Le texte présente une image de mouvement ou de retour. « Se tourneront » garde cette métaphore visible et n’importe pas une terminologie doctrinale plus technique.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « vers le Seigneur Dieu pour le craindre » rend explicite le lien syntaxique entre le mouvement exprimé par ἐπιστρέψουσιν et l’infinitif φοβεῖσθαι, tout en conservant la métaphore et le vocabulaire théologique du grec.
