lexical_decisions:
- source_word: ἐπαύσατο
  choice: cessa
  rationale: L’aoriste moyen de παύω indique ici que l’action prend fin. « Cessa » restitue sobrement cette valeur tout en conservant la construction du grec.
- source_word: ἐξομολογούμενος
  choice: de rendre grâce
  rationale: Le participe peut désigner la confession ou l’expression publique de reconnaissance et de louange. Dans le contexte de la bénédiction qui précède, « rendre grâce » exprime naturellement le sens cultuel sans effacer l’autre possibilité, signalée en note.
- source_word: Τωβείτ
  choice: Tobit
  rationale: « Tobit » est la forme française établie et immédiatement reconnaissable du nom propre grec Τωβείτ.
theological_decisions:
- issue: Sens de ἐξομολογούμενος dans ce contexte de prière
  choice: rendre grâce
  alternative: confesser
  rationale: Le passage clôt les paroles de bénédiction et de louange de Tobit, ce qui favorise l’idée d’action de grâce. La polysémie réelle du terme grec est néanmoins préservée dans la note plutôt que résolue sans indication.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la syntaxe grecque tout en étant naturelle ; « rendre grâce » convient au registre biblique courant sans archaïsme marqué.
