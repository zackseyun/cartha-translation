  text: Et Tobit cessa de rendre grâce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de confesser », si ἐξομολογούμενος est pris au sens pénitentiel ; ici, le contexte favorise l’idée de louange ou d’action de grâce.
