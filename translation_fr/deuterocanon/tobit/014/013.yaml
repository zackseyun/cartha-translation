base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/013.yaml
  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: fr
  text: Il atteignit une vieillesse honorable et ensevelit ses beaux-parents avec honneur[a]. Il hérita de leurs biens ainsi que de ceux de son père Tobit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec éclat » ou « glorieusement ». Le grec peut évoquer des funérailles célébrées avec splendeur et dignité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγήρασεν
  choice: atteignit une vieillesse
  rationale: Cette formulation française naturelle rend le processus exprimé par γηράσκω, « devenir vieux, vieillir », dans ce récit rétrospectif.
- source_word: ἐντίμως
  choice: honorable
  rationale: L’adjectif intégré à l’expression « une vieillesse honorable » restitue le sens d’honneur et d’estime de l’adverbe grec sans produire la tournure peu naturelle « vieillit honorablement ».
- source_word: ἔθαψεν
  choice: ensevelit
  rationale: « Ensevelir » est un équivalent direct, digne et courant dans le registre biblique moderne de l’acte de mettre au tombeau.
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: ses beaux-parents
  rationale: Le pluriel désigne ici les parents de son épouse; « beaux-parents » est précis et naturel en français.
- source_word: ἐνδόξως
  choice: avec éclat
  rationale: Ce choix préserve la nuance propre de δόξα — gloire, splendeur, éclat — et la distingue de ἐντίμως, tout en convenant à des funérailles remarquables.
- source_word: ἐκληρονόμησεν
  choice: hérita
  rationale: Le verbe français exprime directement l’acquisition de biens par héritage.
- source_word: τὴν οὐσίαν αὐτῶν
  choice: leurs biens
  rationale: Dans ce contexte patrimonial, οὐσία désigne les biens ou la fortune; « biens » est clair, large et idiomatique.
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: ainsi que de ceux de son père Tobit
  rationale: Le pronom « ceux » reprend naturellement « biens » et rend explicite l’héritage provenant aussi de Tobit, son père.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction différencie ἐντίμως (« honorable ») de ἐνδόξως (« avec éclat »), et place le marqueur immédiatement après l’expression concernée.
