  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: fr
  text: Mais toi, observe la Loi et les prescriptions, et deviens miséricordieux et juste, afin que tout aille bien pour toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: observe
  rationale: Dans le contexte de la Loi, le verbe signifie garder fidèlement en mettant en pratique; « observe » est naturel et précis en français.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: La majuscule indique ici la Loi donnée à Israël, sans ajouter de précision absente du grec.
- source_word: τὰ προστάγματα
  choice: les prescriptions
  rationale: Le terme désigne des ordres ou dispositions prescrites; « prescriptions » le distingue de la désignation plus générale de la Loi.
- source_word: γενοῦ
  choice: deviens
  rationale: L’impératif aoriste de γίνομαι exprime bien l’idée de devenir, qu’il convient de préserver plutôt que de l’aplatir en « sois ».
- source_word: φιλελεήμων
  choice: miséricordieux
  rationale: Le mot qualifie une personne portée à exercer la compassion et la miséricorde.
- source_word: δίκαιος
  choice: juste
  rationale: Équivalent direct qui conserve la portée morale et religieuse du terme grec.
- source_word: ἵνα σοι καλῶς ἦν
  choice: afin que tout aille bien pour toi
  rationale: Cette formulation idiomatique rend le souhait de bien-être ou de réussite exprimé par la tournure grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement conserve l’adresse personnelle du grec. La formulation maintient l’exhortation à devenir miséricordieux et juste, sans expliciter davantage le rapport entre cette conduite et le bien-être promis.
