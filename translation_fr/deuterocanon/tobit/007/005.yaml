base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/005.yaml
  text: They said[a], “He is alive and well.” And Tobiah said[b], “He is my father.”
translation:
  language: fr
  text: 'Ils répondirent : « Il est vivant et en bonne santé. » Tobie dit : « C’est mon père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Dans cet échange, « répondre » rend naturellement la valeur contextuelle de « ils dirent », sans ajouter de contenu à la réponse.
- source_word: ζῇ
  choice: Il est vivant
  rationale: Le présent de ζάω indique ici que le père de Tobie est toujours en vie.
- source_word: ὑγιαίνει
  choice: en bonne santé
  rationale: ὑγιαίνω signifie être sain ou bien portant. Cette expression française courante conserve pleinement le sens du grec.
- source_word: Πατήρ μου ἐστιν
  choice: C’est mon père
  rationale: Cette tournure idiomatique rend exactement l’identification exprimée par le grec, littéralement « Il est mon père ».
- source_word: Τωβίας
  choice: Tobie
  rationale: « Tobie » est la forme française établie du nom porté ici par le fils, naturelle et immédiatement reconnaissable pour le lectorat francophone.
theological_decisions:
- issue: Forme française du nom Τωβίας
  choice: Tobie
  alternative: Tobias ou Tobiya
  rationale: Le choix n’a pas d’incidence doctrinale. « Tobie » est la forme française usuelle, tandis que « Tobias » suit plus directement la forme grecque et « Tobiya » reflète davantage l’arrière-plan sémitique.
translation_notes:
  register: Français moderne, courant et digne. Le dialogue reste bref et direct. « Il est vivant et en bonne santé » préserve les deux affirmations coordonnées du grec, tandis que « C’est mon père » évite une formulation inutilement raide.
