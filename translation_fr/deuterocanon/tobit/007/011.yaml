  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: fr
  text: 'J’ai donné mon enfant à sept hommes[a], et chaque fois qu’ils entraient chez elle, ils mouraient pendant la nuit. Mais maintenant, prends courage. Tobie dit[b] : « Je ne goûterai à rien ici avant que vous n’ayez réglé cette affaire et conclu un accord avec moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « sept hommes » ; le contexte indique qu’il s’agit des hommes auxquels elle avait été donnée en mariage. On pourrait donc aussi traduire « sept maris ».
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est difficile dans ce témoin grec. La traduction en donne le sens apparent : Tobie refuse de manger tant que l’affaire matrimoniale n’a pas été réglée et qu’un accord n’a pas été conclu avec lui.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: mon enfant
  rationale: Le grec signifie littéralement « mon enfant » ou « mon jeune enfant ». Dans le contexte, il s’agit de Sara, la fille de Ragouël, mais « mon enfant » conserve la formulation familiale et affectueuse sans explicitation superflue.
- source_word: ἑπτὰ ἀνδράσιν
  choice: à sept hommes
  rationale: ἀνήρ peut désigner un homme ou un mari. Le contexte est matrimonial, mais le texte dit simplement « sept hommes » ; cette formulation est donc conservée, avec une note signalant l’autre traduction possible.
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: chaque fois qu’ils entraient auprès d’elle
  rationale: Cette formulation maintient l’euphémisme grec associé à l’union conjugale, sans le rendre explicite ni l’aplatir en simple mouvement physique.
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: ils mouraient pendant la nuit
  rationale: L’imparfait exprime ici ce qui se produisait de façon répétée, tandis que ὑπὸ νύκτα situe les décès au cours de la nuit.
- source_word: ἀλλὰ τὸ νῦν ἔχων ἡδέως γίνου
  choice: Mais maintenant, prends courage
  rationale: La tournure transmise est maladroite, mais elle constitue manifestement une invitation à retrouver une disposition confiante ou joyeuse. « Prends courage » est naturel, digne et adapté au contexte.
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: Je ne goûterai à rien ici
  rationale: γεύομαι signifie littéralement « goûter » et peut, par extension, désigner le fait de manger. Le futur français rend naturellement le refus portant sur l’action imminente.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: avant que vous n’ayez établi et conclu l’affaire avec moi
  rationale: 'Les deux formes verbales grecques sont difficiles dans ce témoin. La traduction conserve une structure à deux verbes tout en exprimant le sens contextuel probable : officialiser et mener à terme l’accord matrimonial avec Tobie.'
