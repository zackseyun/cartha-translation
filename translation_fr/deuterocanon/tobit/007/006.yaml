  text: And Raguel sprang up, kissed him warmly, and wept.
translation:
  language: fr
  text: Ragouël se leva d’un bond, l’embrassa avec effusion[a] et pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « l’embrassa avec effusion » est plus expressif que le simple verbe « donner un baiser » et évoque une affection marquée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεπήδησεν
  choice: se leva d’un bond
  rationale: Le verbe exprime un mouvement soudain et vif. Cette tournure naturelle en français conserve l’élan émotionnel sans suggérer nécessairement un saut.
- source_word: κατεφίλησεν
  choice: l’embrassa affectueusement
  rationale: Le composé intensif désigne un baiser marqué par l’affection, parfois prolongé ou répété. « Embrasser affectueusement » en rend la force sans ajouter explicitement plusieurs gestes.
- source_word: ἔκλαυσε
  choice: pleura
  rationale: Rendu direct et courant du verbe grec dans ce récit chargé d’émotion.
- source_word: Ῥαγουὴλ
  choice: Ragouël
  rationale: Translittération française usuelle de la forme grecque, avec tréma pour signaler la séparation des voyelles.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin renvoie, dans le contexte, à Tobie, le fils de Tobit.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La coordination simple du grec est conservée, tandis que « se leva d’un bond » restitue la soudaineté du mouvement. Le témoin hébreu indirect fourni ne correspond pas au contenu de ce verset grec et, étant une rétroversion tardive, ne détermine pas la traduction.
