base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
translation:
  language: fr
  text: 'Et il leur dit : « Connaissez-vous Tobit, notre frère[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre parent » ou « notre proche parent ». Le grec dit « notre frère », probablement comme terme de parenté plutôt que pour désigner un frère au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Et il leur dit
  rationale: Rend directement la coordination narrative et l’aoriste grec dans un français biblique naturel et actuel.
- source_word: Γινώσκετε
  choice: Connaissez-vous
  rationale: Dans ce contexte, le verbe demande si les interlocuteurs connaissent personnellement Tobit ; cette formulation interrogative est idiomatique en français.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Forme française traditionnelle et couramment reconnue du nom propre grec.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: notre frère
  rationale: Conserve l’image familiale explicite du grec, tout en signalant en note qu’il peut s’agir d’un terme de parenté au sens large.
theological_decisions:
- issue: Portée du terme ἀδελφός
  choice: notre frère
  alternative: notre parent / notre proche parent
  rationale: Le grec dit littéralement « frère », mais le contexte permet un emploi élargi désignant un membre de la parenté ou du groupe familial. Le texte principal préserve cette tension sans la résoudre, et la note explicite l’autre sens possible.
translation_notes:
  register: Français moderne, clair et digne. L’inversion « Connaissez-vous » convient au dialogue soutenu sans paraître archaïque ; la ponctuation française est respectée.
