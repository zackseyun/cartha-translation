  text: 'Elle fit comme il l’avait dit et y conduisit sa fille. Elle pleura, recueillit les larmes de sa fille et lui dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: Elle fit ce qu’il lui avait dit
  rationale: Le sujet, non exprimé en grec, est naturellement Edna, à qui Ragouël vient de donner ses instructions. Le plus-que-parfait français rend clairement l’antériorité implicite sans alourdir la narration.
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: conduisit sa fille dans la chambre
  rationale: εἰσήγαγεν signifie faire entrer ou conduire à l’intérieur. « Dans la chambre » explicite le référent immédiat de ἐκεῖ, la chambre préparée au verset précédent, tandis que « sa fille » identifie naturellement Sarah dans ce contexte.
- source_word: ἔκλαυσεν
  choice: Elle se mit à pleurer
  rationale: Le verbe singulier poursuit le sujet Edna. Cette formulation française exprime naturellement l’entrée dans l’action narrative.
- source_word: ἀπεδέξατο τὰ δάκρυα
  choice: accueillit les larmes
  rationale: Le verbe ἀποδέχομαι évoque ici l’accueil compatissant plutôt qu’une réception matérielle. L’image du texte grec est conservée.
- source_word: τῆς θυγατρὸς αὐτῆς
  choice: de sa fille
  rationale: Le féminin αὐτῆς renvoie naturellement à Edna, mère de Sarah. Le français « sa fille » reproduit fidèlement cette relation.
- source_word: εἶπεν αὐτῇ
  choice: lui dit
  rationale: Formule française naturelle qui conserve l’adresse à Sarah et introduit la parole du verset suivant.
theological_decisions:
- issue: Identification du sujet des verbes au singulier
  choice: 'Edna est le sujet : « Elle fit… Elle se mit à pleurer… accueillit… »'
  alternative: Ragouël serait le sujet, comme le suppose la couche de consultation anglaise.
  rationale: Le grec n’exprime pas le sujet de ces verbes, mais le contexte immédiatement antérieur présente Edna comme destinataire de l’ordre de préparer la chambre et d’y conduire Sarah. En outre, le féminin αὐτῆς dans « les larmes de sa fille » confirme naturellement qu’Edna demeure le sujet. Cette lecture suit donc prioritairement la syntaxe et le contexte de la source grecque.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset reste fluide tout en conservant l’image expressive d’« accueillir les larmes ». « Dans la chambre » reprend explicitement le lieu mentionné juste auparavant afin d’éviter un « là » peu naturel et ambigu en français.
