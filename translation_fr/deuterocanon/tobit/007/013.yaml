  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
translation:
  language: fr
  text: 'Il appela Sara, sa fille, la prit par la main et la donna pour femme à Tobie. Puis il dit : « Voici : conformément à la loi de Moïse, prends-la[a] et conduis-la auprès de ton père. » Et il les bénit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçois-la ». Le verbe grec peut exprimer le fait de prendre ou de recevoir ; le commandement suivant indique déjà le déplacement vers le père de Tobie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν Σάρραν τὴν θυγατέρα αὐτοῦ
  choice: Il appela Sara, sa fille
  rationale: « Appela » rend directement ἐκάλεσεν sans lui donner la solennité supplémentaire de « convoqua ». L’apposition « sa fille » reproduit clairement la relation exprimée par le grec.
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: la prit par la main
  rationale: Cette formulation française naturelle conserve le geste concret par lequel le père prend sa fille par la main.
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: la donna pour femme à Tobie
  rationale: Dans ce contexte matrimonial, παρέδωκεν désigne le fait de donner officiellement Sara en mariage, et non de la « livrer » dans un sens hostile. « Pour femme » préserve la fonction prédicative de γυναῖκα.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » garde la fonction d’appel à l’attention du marqueur grec tout en restant digne et actuel.
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: conformément à la loi de Moïse
  rationale: La formulation conserve explicitement le nom de Moïse et exprime naturellement en français le fondement légal de l’acte.
- source_word: κομίζου
  choice: prends-la
  rationale: L’impératif peut évoquer le fait de prendre, de recevoir ou d’accueillir la jeune femme. « Prends-la » s’insère naturellement dans la séquence, tandis que le verbe suivant exprime son déplacement vers le père de Tobie.
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: conduis-la auprès de ton père
  rationale: « Conduis-la » conserve l’idée de mener quelqu’un avec soi; « auprès de ton père » exprime la destination sans suggérer à tort que le locuteur s’y trouve déjà.
- source_word: εὐλόγησεν αὐτούς
  choice: il les bénit
  rationale: Rendu direct de l’action de bénir, sans explicitation doctrinale ajoutée.
theological_decisions:
- issue: Référence à la loi de Moïse dans un récit deutérocanonique
  choice: Conserver explicitement « conformément à la loi de Moïse »
  alternative: conformément à notre loi; conformément à la loi
  rationale: Le grec nomme expressément Moïse. La traduction maintient cette affirmation narrative sans l’atténuer ni ajouter de jugement sur le statut historique ou canonique du livre.
translation_notes:
  register: Français international moderne, narratif et digne. Les tours archaïques ont été évités, tout en conservant le caractère juridique et cérémoniel de la scène. Le marqueur de note est placé après « prends-la », terme auquel porte réellement la variante lexicale.
