  yaml_path: translation/deuterocanon/tobit/007/015.yaml
  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: fr
  text: 'Et ils commencèrent à manger. Puis Ragouël appela Edna, sa femme, et lui dit : « Ma sœur[a], prépare l’autre chambre[b] et fais-la entrer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sœur ». Il s’agit ici d’une manière familière et affectueuse de s’adresser à son épouse.
    reason: cultural_note
  - marker: b
    text: Ou « l’autre pièce intérieure ». Le mot grec peut désigner une chambre ou une pièce retirée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: ils commencèrent à manger
  rationale: Rend directement la construction ingressive ἄρχομαι + infinitif et le sens courant de ἐσθίω.
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Convient au cadre familial sans la nuance formelle ou autoritaire de « convoqua ».
- source_word: Ἀδελφή
  choice: Ma sœur
  rationale: Conserve la forme de parenté employée comme adresse familière à l’épouse; l’ajout naturel de « ma » en français explicite la relation sans en changer le sens.
- source_word: ἑτοίμασον
  choice: prépare
  rationale: Impératif simple, actuel et fidèle au sens de mise en état.
- source_word: τὸ ἕτερον ταμεῖον
  choice: l’autre chambre
  rationale: ταμεῖον peut désigner une pièce intérieure ou une chambre; dans le contexte nuptial, « chambre » est naturel tout en gardant la possibilité d’une pièce retirée.
- source_word: εἴσαγε αὐτήν
  choice: fais-la entrer
  rationale: Exprime naturellement en français le causatif de mouvement « conduire ou faire entrer » sans ajouter un complément absent du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe narrative reste proche du grec, tandis que « fais-la entrer » évite une formulation maladroite. Les deux notes rendent visibles la formule conjugale littérale et l’étendue de sens de ταμεῖον.
