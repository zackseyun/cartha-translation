  text: And he conveyed the matter to Raguel. And Raguel said to Tobiah, “Eat, drink, and be glad, for it is fitting for you to take my child; but I will explain the truth.”
translation:
  language: fr
  text: 'Il lui fit part de l’affaire. Ragouël dit alors à Tobie : « Mange, bois et réjouis-toi, car c’est à toi qu’il revient de prendre ma fille. Toutefois, je vais t’exposer la vérité. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: lui fit part de l’affaire
  rationale: L’expression désigne ici la communication du sujet ou de la demande à Ragouël ; « l’affaire » est naturel en français et conserve la portée contextuelle de λόγος.
- source_word: ἡδέως γίνου
  choice: sois dans la joie
  rationale: Rend l’invitation à se réjouir avec une formulation française actuelle et digne, sans la connotation d’excès que pourrait avoir « sois joyeux » dans ce contexte de repas.
- source_word: καθήκει
  choice: il revient
  rationale: Exprime ce qui convient ou appartient légitimement à quelqu’un, sans transformer l’énoncé en obligation stricte.
- source_word: τὸ παιδίον μου
  choice: ma fille
  rationale: Dans le contexte matrimonial, le référent féminin est clair ; « ma fille » est idiomatique là où le grec emploie littéralement « mon enfant ».
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: je vais te révéler la vérité
  rationale: ὑποδείκνυμι signifie faire connaître ou exposer ; « révéler » rend ici l’annonce d’un fait encore caché, tandis que « la vérité » conserve directement ἀλήθεια.
theological_decisions:
- issue: Portée de καθήκει dans l’affirmation matrimoniale
  choice: « c’est à toi qu’il revient »
  alternative: « il convient que tu prennes »
  rationale: Le choix préserve l’idée d’une convenance ou d’un droit approprié sans préciser davantage le fondement juridique ou providentiel que le verset ne formule pas.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent les formes françaises courantes « Ragouël » et « Tobie ». Aucun ajout explicatif ni particularisme confessionnel.
