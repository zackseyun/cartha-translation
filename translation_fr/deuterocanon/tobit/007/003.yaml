    issue: « parmi les captifs de Ninive » ne reflète pas clairement la seconde préposition ἐκ.
    rationale: Le grec qualifie les interlocuteurs comme τῶν αἰχμαλώτων ἐκ Νινευή, avec ἐκ répété. « Parmi les » introduit une relation de classement ou de localisation qui n’est pas exprimée explicitement et « de Ninive » reste équivoque en français. « Des captifs venus de Ninive » reproduit mieux le mouvement/origine indiqué, tout en laissant le contexte expliquer leur statut.
  - severity: low
    issue: La note b décrit improprement la traduction littérale comme « les captifs de Ninive ».
    rationale: Le grec comporte ἐκ, dont la valeur première est « de, hors de ». La note doit présenter la difficulté syntaxique et contextuelle sans qualifier « de Ninive » de littéral de manière insuffisamment précise.
