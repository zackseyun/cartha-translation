translation_notes:
  register: Français international moderne, naturel et digne. « Ragouël » et « Nephtali » suivent des formes françaises bibliques usuelles. La syntaxe évite le calque peu naturel « des fils de Nephtali » dans le corps du texte, tout en le signalant en note.
