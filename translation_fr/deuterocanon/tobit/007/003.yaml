base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: fr
  text: 'Ragouël leur demanda : « D’où êtes-vous, frères ? » Ils lui répondirent : « Nous sommes des descendants de Nephtali[a], des captifs venus de Ninive[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de Nephtali » ; c’est-à-dire de ses descendants ou de sa tribu.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « des captifs hors de Ninive » ou « des captifs de Ninive ». La préposition peut situer leur provenance ; dans le contexte, il peut s’agir des déportés qui vivaient à Ninive.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρώτησεν
  choice: demanda
  rationale: Verbe narratif courant qui rend directement l’action de poser une question.
- source_word: Πόθεν ἐστέ
  choice: D’où êtes-vous ?
  rationale: Formulation française naturelle et concise pour une question portant sur l’origine.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve le masculin explicite du grec et la chaleur de cette formule d’adresse.
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: des descendants de Nephtali
  rationale: Dans ce contexte tribal, υἱοί désigne les descendants plutôt que les fils immédiats; cette formulation est claire en français moderne tout en préservant le lien généalogique.
- source_word: τῶν αἰχμαλώτων
  choice: parmi les captifs
  rationale: Préserve l’idée coercitive de personnes emmenées en captivité, sans réduire le terme à un exil volontaire ou générique.
- source_word: ἐκ Νινευή
  choice: de Ninive
  rationale: Rend formellement la préposition ἐκ. Le rapport exact avec Ninive demeure toutefois délicat, puisque le contexte peut viser des captifs qui s’y trouvent plutôt que des personnes qui en sont originaires.
