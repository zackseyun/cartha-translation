  source_fidelity: La première proposition (« des descendants de Nephtali ») rend fidèlement ἐκ τῶν υἱῶν Νεφθαλεὶ dans son sens tribal. « Frères » conserve l’interpellation grecque. Toutefois, « parmi les captifs de Ninive » transforme la seconde désignation en appartenance à un groupe local et atténue la répétition de ἐκ (« de / hors de »). « Des captifs venus de Ninive » rend plus directement le complément grec sans prétendre trancher au-delà du texte la situation exacte de ces captifs.
  naturalness: Le français est fluide, moderne et d’un registre narratif approprié. « D’où êtes-vous ? » est naturel dans ce contexte. La légère révision proposée reste idiomatique.
  terminology: « Ragouël » et « Nephtali » sont des formes bibliques françaises usuelles. « Captifs » maintient à juste titre la force de αἰχμάλωτοι, plutôt que de le neutraliser en « exilés ».
  issues:
