  naturalness: Le français est globalement naturel, clair et d’un registre approprié. « Il fut rempli de tristesse » est toutefois une intensification qui ne correspond pas précisément à ἐλυπήθη et sonne plus lourd que nécessaire. « Il fut attristé » est direct et naturel.
