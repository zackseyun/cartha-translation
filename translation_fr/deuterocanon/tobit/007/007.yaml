base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: fr
  text: 'Il lui dit[a] : « C’est le fils de cet homme honorable et bon. » Lorsqu’il apprit que Tobit avait perdu la vue[b], il fut attristé et pleura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : littéralement, « celui de l’homme honorable et bon ». Le terme « fils » est suppléé d’après le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « avait perdu ses yeux », c’est-à-dire qu’il avait perdu la vue.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: C’est le fils d’un homme honorable et bon
  rationale: Le grec est elliptique et omet le nom de la relation familiale. Le contexte permet de suppléer « fils » tout en signalant cet ajout en note. « Honorable et bon » distingue naturellement les deux adjectifs grecs sans répétition maladroite.
- source_word: καλοῦ
  choice: honorable
  rationale: Dans la coordination avec ἀγαθοῦ, καλός évoque ici une qualité estimable ou honorable plutôt qu’une simple répétition de « bon ».
- source_word: ἀγαθοῦ
  choice: bon
  rationale: Rend directement la valeur morale générale de ἀγαθός dans un français courant et digne.
- source_word: ἀκούσας
  choice: Lorsqu’il apprit
  rationale: La proposition temporelle restitue naturellement en français le participe aoriste grec et « apprit » convient à l’annonce d’une nouvelle.
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: avait perdu la vue
  rationale: Le grec dit concrètement « avait perdu ses yeux », mais cette expression suggérerait en français une perte physique des yeux. « Perdu la vue » transmet clairement le sens contextuel; la formulation littérale est conservée en note.
- source_word: ἐλυπήθη
  choice: il fut rempli de tristesse
  rationale: Cette formulation naturelle conserve la force émotionnelle du verbe, qui exprime le chagrin éprouvé.
- source_word: ἔκλαυσεν
  choice: pleura
  rationale: Équivalent français direct, courant et digne du verbe grec.
theological_decisions:
- issue: Formule d’identification elliptique au début du verset
  choice: C’est le fils d’un homme honorable et bon
  alternative: C’est celui de l’homme honorable et bon
  rationale: Le texte grec transmis est abrupt et ne nomme pas explicitement la relation. « Fils » est une explicitation contextuelle minimale nécessaire à un français intelligible, sans enjeu doctrinal; la note préserve l’ellipse du texte source.
- issue: Expression concrète de la cécité de Tobit
  choice: avait perdu la vue
  alternative: avait perdu ses yeux
  rationale: La traduction idiomatique évite de faire croire à une perte anatomique tout en conservant en note l’image concrète du grec. Aucun sens théologique supplémentaire n’est imposé.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple; « honorable et bon » préserve les deux termes élogieux du grec. Les deux difficultés textuelles sont indiquées sans alourdir le corps du verset.
