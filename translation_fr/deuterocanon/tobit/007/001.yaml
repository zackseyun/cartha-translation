base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: fr
  text: Il arriva à Ecbatane et parvint à la maison de Ragouël. Sara vint aussi à sa rencontre et le salua ; lui les salua[a]. Puis il les fit entrer dans la maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe du singulier (« Sara le salua ») au pluriel (« lui les salua »). Le témoin sémitique parallèle présente lui aussi une scène d’arrivée et de salutations chez Ragouël, avec des différences de formulation et de détail.
    reason: textual_detail
  - marker: b
    text: Le grec emploie un verbe au singulier, mais ne précise pas qui les fait entrer dans la maison.
    reason: ambiguity
lexical_decisions:
- source_word: ἦλθεν
  choice: arriva
  rationale: Le verbe de mouvement introduit l’entrée à Ecbatane ; « arriva » est naturel en français narratif.
- source_word: παρεγένετο
  choice: se rendit
  rationale: Après « arriva », cette formulation marque le déplacement jusqu’à la destination précise sans répéter le même verbe.
- source_word: οἰκίαν
  choice: maison
  rationale: Le mot désigne ici le lieu d’habitation concret, tout en pouvant évoquer implicitement le foyer.
- source_word: ὑπήντησεν
  choice: vint à sa rencontre
  rationale: Le verbe exprime une rencontre, souvent le fait d’aller au-devant de quelqu’un ; cette traduction le distingue du salut qui suit.
- source_word: ἐχαιρέτισεν
  choice: salua
  rationale: Équivalent direct et actuel du verbe grec de salutation.
- source_word: αὐτὸς αὐτούς
  choice: lui, à son tour, les salua
  rationale: La tournure conserve le contraste entre le singulier du sujet et le pluriel de l’objet, tout en rendant clairement la réciprocité en français.
- source_word: εἰσήγαγεν
  choice: fit entrer
  rationale: Cette expression française rend naturellement l’action de conduire ou de faire entrer des personnes dans la maison.
- source_word: Ἐκβάτανα
  choice: Ecbatane
  rationale: Forme française traditionnelle et courante du nom de la ville antique.
- source_word: Ῥαγουήλ
  choice: Ragouël
  rationale: Transcription française usuelle de la forme grecque, avec tréma pour signaler la séparation des voyelles.
- source_word: Σάρρα
  choice: Sara
  rationale: Forme française traditionnellement employée pour ce personnage de Tobit, distincte sans nécessité de la forme biblique « Sara » elle-même standard en français.
theological_decisions:
- issue: Référent du sujet dans la dernière proposition
  choice: « il les fit entrer », sans nommer le sujet
  alternative: « Ragouël les fit entrer » ou une tournure passive
  rationale: Le verbe grec est au singulier, mais son sujet n’est pas exprimé. Le pronom préserve cette indétermination au lieu d’identifier explicitement l’hôte.
- issue: Alternance des pronoms singulier et pluriel dans la scène des salutations
  choice: Conserver « le salua » puis « les salua »
  alternative: Harmoniser les deux compléments au singulier ou au pluriel
  rationale: Le grec passe explicitement de αὐτόν au singulier à αὐτούς au pluriel. Cette variation possiblement tendue doit être conservée plutôt que corrigée silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent simples et accessibles. « À son tour » explicite seulement la réciprocité déjà portée par la construction grecque, tandis que les changements de nombre et l’identité implicite du dernier sujet sont préservés.
