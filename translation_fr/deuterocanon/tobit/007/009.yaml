  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: fr
  text: 'Ils immolèrent un bélier du troupeau et servirent de nombreux plats. Puis Tobie dit à Raphaël : « Azarias, mon frère, parle de ce dont tu parlais pendant le voyage, et que l’affaire soit menée à son terme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν
  choice: immolèrent
  rationale: Le verbe désigne ici l’abattage de l’animal pour le repas, avec une possible nuance sacrificielle que « immoler » permet de conserver sans la préciser davantage.
- source_word: κριὸν προβάτων
  choice: un bélier du troupeau
  rationale: Rend directement le mâle adulte et son appartenance au petit bétail.
- source_word: παρέθηκαν ὄψα πλείονα
  choice: servirent de nombreux plats
  rationale: Expression française naturelle pour la présentation d’une nourriture abondante; ὄψα peut désigner les mets ou plats servis.
- source_word: Ἀζαρία ἀδελφέ
  choice: Azarias, mon frère
  rationale: Le vocatif affectueux est rendu idiomatiquement en français; la forme traditionnelle française du nom est conservée.
- source_word: λάλησον ὑπὲρ ὧν ἔλεγες
  choice: parle de ce dont tu parlais
  rationale: Conserve la formulation générale et la reprise verbale du grec, sans expliciter prématurément le sujet de la conversation.
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: que l’affaire soit menée à son terme
  rationale: Préserve le passif injonctif et le sens d’achèvement de τελεσθήτω, tout en rendant πρᾶγμα par un terme volontairement général.
theological_decisions:
- issue: Nuance potentiellement sacrificielle de ἔθυσαν
  choice: immolèrent
  alternative: abattirent
  rationale: « Immoler » maintient la nuance cultuelle possible du verbe grec sans affirmer qu’un sacrifice rituel précis a eu lieu.
- issue: Nature de τὸ πρᾶγμα
  choice: l’affaire
  alternative: le projet
  rationale: Le grec reste général dans ce verset; « l’affaire » évite d’expliciter ici une demande matrimoniale au-delà du texte.
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve la répétition du verbe « parler » ainsi que l’indétermination de « l’affaire », tout en employant une syntaxe naturelle à l’oral direct.
