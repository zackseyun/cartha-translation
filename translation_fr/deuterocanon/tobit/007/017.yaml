base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: fr
  text: « Courage, mon enfant ! Que le Seigneur du ciel et de la terre t’accorde sa faveur[a] à la place de cette peine qui est la tienne. Courage, ma fille ! »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce » ; le grec χάρις peut avoir l’un ou l’autre sens ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: Courage
  rationale: L’impératif exprime un encouragement direct dans la détresse. « Courage ! » est naturel, actuel et conserve la répétition grecque.
- source_word: τέκνον
  choice: mon enfant
  rationale: Terme affectueux et non spécifiquement masculin. En français, le possessif est idiomatique dans cette forme d’adresse et n’introduit pas ici de distinction de sens.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans cette prière juive, κύριος est un titre divin, rendu selon l’usage biblique établi.
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: du ciel et de la terre
  rationale: Cette expression conserve le mérisme biblique désignant l’ensemble de la création.
- source_word: δῴη
  choice: Que … t’accorde
  rationale: L’optatif exprime un souhait ou une prière. Cette tournure restitue naturellement cette valeur en français.
- source_word: σοι χάριν
  choice: t’accorde sa faveur
  rationale: χάρις désigne ici vraisemblablement une faveur ou un bienfait accordé par Dieu. « Faveur » évite de donner automatiquement au mot un sens théologique technique, tout en conservant « grâce » en note comme possibilité réelle.
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: à la place de cette peine qui est la tienne
  rationale: ἀντί marque le remplacement ou l’échange. La formulation préserve aussi l’insistance personnelle de σου ταύτης sans devenir trop lourde.
- source_word: θύγατερ
  choice: ma fille
  rationale: L’adresse finale est explicitement féminine et affectueuse. Le français idiomatique appelle ici le possessif.
theological_decisions:
- issue: Sens de χάρις dans une prière adressée à Dieu
  choice: faveur
  alternative: grâce
  rationale: Le contexte est celui d’une bénédiction adressée à une jeune femme affligée, non d’un exposé doctrinal. « Faveur » exprime clairement le bienfait divin demandé, tandis que « grâce » demeure une traduction lexiquement possible et est signalée en note.
translation_notes:
  register: Français moderne, digne et oralement naturel. Les exclamations rendent la force des deux encouragements. Les formes « mon enfant » et « ma fille » sont idiomatiques en français pour une adresse affectueuse, même si le grec ne comporte pas de possessif explicite.
