lexical_decisions:
- source_word: Ἔδνα
  choice: Edna
  rationale: Nom propre translittéré selon la forme française usuelle.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte familial, γυνή désigne clairement l’épouse de Ragouël.
- source_word: Σάρρα
  choice: Sara
  rationale: Forme française courante du nom propre biblique.
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: sa fille
  rationale: Désignation familiale directe, rendue naturellement en français.
- source_word: ἔκλαυσαν
  choice: pleurèrent
  rationale: L’aoriste indique simplement l’action de pleurer, sans imposer l’idée qu’elle commence ou se prolonge.
- source_word: ὑπεδέξαντο
  choice: accueillirent
  rationale: Dans ce contexte d’hospitalité, le verbe signifie recevoir favorablement, donc accueillir.
- source_word: αὐτοὺς
  choice: les
  rationale: Pronom objet renvoyant aux visiteurs.
- source_word: προθύμως
  choice: de tout cœur
  rationale: Cette expression naturelle transmet la disposition empressée, volontaire et chaleureuse exprimée par l’adverbe grec.
