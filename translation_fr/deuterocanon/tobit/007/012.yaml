  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: fr
  text: 'Ragouël dit : « Dès maintenant, prends-la conformément à la décision.[a] Tu es son frère,[b] et elle est à toi. Que le Dieu miséricordieux vous fasse réussir au mieux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément au jugement » ou « conformément à la sentence ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « frère » est un terme de parenté qui désigne un proche parent ayant qualité pour l’épouser selon la coutume familiale, et non son frère au sens strict.
    reason: cultural_note
lexical_decisions:
- source_word: Κομίζου
  choice: prends-la
  rationale: L’impératif moyen invite Tobie à recevoir et prendre Sara avec lui comme épouse. « Prends-la » conserve la force directe du grec et reste naturel en français.
- source_word: ἀπὸ τοῦ νῦν
  choice: Dès maintenant
  rationale: Cette expression temporelle marque le commencement immédiat de la nouvelle situation matrimoniale.
- source_word: κατὰ τὴν κρίσιν
  choice: conformément à la décision
  rationale: κρίσις peut désigner un jugement, une décision ou une sentence. « Décision » préserve la nuance formelle sans préciser indûment la nature du cadre juridique.
- source_word: ἀδελφὸς
  choice: frère
  rationale: Le terme grec signifie littéralement « frère », mais peut s’employer plus largement pour un proche parent. Le texte principal conserve le mot source, avec une note explicative.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Ce terme rend directement l’idée de celui qui fait miséricorde et convient au registre d’une bénédiction.
- source_word: εὐοδώσει
  choice: accorde la plus grande réussite
  rationale: εὐοδόω signifie faire réussir, donner une issue favorable ou conduire heureusement. Cette formulation française restitue naturellement le verbe avec son complément superlatif.
- source_word: τὰ κάλλιστα
  choice: la plus grande réussite
  rationale: Le neutre pluriel superlatif signifie littéralement « les meilleures choses ». Avec εὐοδώσει, la formulation choisie exprime une réussite excellente sans réduire la bénédiction à des biens matériels.
theological_decisions:
- issue: Terme de parenté dans un contexte matrimonial
  choice: Conserver « frère » dans le texte principal et expliquer son sens familial élargi en note.
  alternative: Traduire directement par « proche parent » ou « parent ».
  rationale: Le témoin grec porte ἀδελφός. Garder « frère » respecte sa formulation et son langage de parenté, sans suggérer qu’il s’agit nécessairement d’un frère au sens strict.
- issue: Valeur du futur dans la bénédiction
  choice: 'Rendre le futur grec par un souhait : « Que le Dieu miséricordieux… »'
  alternative: 'Employer une déclaration au futur : « Le Dieu miséricordieux vous accordera… »'
  rationale: Bien que le grec emploie le futur de l’indicatif, le contexte donne à la phrase la force pragmatique d’une bénédiction. La tournure optative française rend naturellement cet acte de parole tout en signalant son interprétation.
- issue: Portée de τὰ κάλλιστα
  choice: Exprimer une réussite excellente sans définir précisément quels biens sont visés.
  alternative: Traduire littéralement « fera prospérer pour vous les meilleures choses ».
  rationale: Le grec reste général. La traduction évite d’importer une conception matérielle particulière de la prospérité.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le discours direct conserve la solennité juridique et familiale du passage. « Ragouël » suit une translittération française usuelle du nom grec Ῥαγουήλ.
