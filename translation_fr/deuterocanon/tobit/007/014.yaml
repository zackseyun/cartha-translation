  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
translation:
  language: fr
  text: Puis il appela Edna, sa femme. Prenant un document, il rédigea un contrat de mariage[a], et ils le scellèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un accord écrit » ou simplement « un contrat ». Le terme grec désigne un acte juridique écrit ; « contrat de mariage » est retenu en raison du contexte immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Le verbe signifie simplement « appeler » ou « faire venir ». « Appela » reste naturel et fidèle sans renforcer inutilement le degré de formalité.
- source_word: Ἔδναν
  choice: Edna
  rationale: Le nom propre est conservé sous sa forme française usuelle.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte conjugal, γυνή désigne clairement l’épouse; « sa femme » est l’expression française courante.
- source_word: λαβὼν βιβλίον
  choice: Il prit un document
  rationale: βιβλίον peut désigner un livre, un rouleau ou un écrit. Puisqu’il sert ici à établir et à sceller un acte juridique, « document » en exprime naturellement la fonction.
- source_word: ἔγραψεν συγγραφήν
  choice: rédigea un contrat de mariage
  rationale: συγγραφή désigne un accord écrit ou un contrat. Le contexte immédiat permet de préciser qu’il s’agit d’un contrat de mariage, tandis que « rédigea » rend idiomatiquement l’action de mettre l’acte par écrit.
- source_word: ἐσφραγίσαντο
  choice: ils y apposèrent leurs sceaux
  rationale: La forme verbale est à la troisième personne du pluriel et décrit concrètement l’apposition de sceaux. Cette formulation française rend clairement le sujet pluriel et le geste juridique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination grecque est répartie en deux phrases pour une lecture naturelle. Le pluriel de ἐσφραγίσαντο est conservé sans préciser l’identité des personnes qui ont apposé leurs sceaux.
