base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: fr
  text: 'Ragouël appela Edna, sa femme, et lui dit : « Ma sœur[a], prépare l’autre pièce[b] et fais-la entrer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ma sœur » est ici une manière ancienne pour Ragouël de s’adresser à sa femme ; cela n’indique pas nécessairement un lien biologique entre eux.
    reason: cultural_note
  - marker: b
    text: Le mot grec peut désigner une pièce intérieure ou une chambre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφή
  choice: Ma sœur
  rationale: Le vocatif désigne ici l’épouse de Ragouël. « Ma sœur » conserve cette forme d’adresse familiale ancienne tout en étant plus naturelle en français que le simple « Sœur ».
- source_word: ἑτοίμασον
  choice: prépare
  rationale: L’impératif signifie rendre prêt ; « prépare » est direct, courant et adapté au contexte.
- source_word: τὸ ἕτερον ταμεῖον
  choice: l’autre chambre
  rationale: ταμεῖον peut désigner une pièce intérieure ou une chambre. Dans ce contexte nuptial, « chambre » est précis et naturel, tandis que ἕτερον est rendu par « autre ».
- source_word: εἴσαγε αὐτήν
  choice: fais-la entrer
  rationale: Cette formulation restitue naturellement en français l’idée de conduire ou de faire entrer Sara dans la chambre, sans ajouter un complément de lieu absent du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le dialogue conserve la forme d’adresse ancienne, explicitée en note, et emploie « chambre » pour rendre clairement le cadre du récit.
