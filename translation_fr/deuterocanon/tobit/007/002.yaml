base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: fr
  text: 'Edna dit à sa femme[a] : « Comme le jeune Tobit ressemble à mon neveu[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte : « Edna dit à sa femme ». Dans le parallèle sémitique, c’est Ragouël qui parle à Edna, sa femme. Le contexte peut indiquer une irrégularité dans la transmission du texte.'
    reason: textual_variant
  - marker: b
    text: Ou « mon cousin ». Le terme grec peut désigner plus largement un proche parent masculin, bien que « neveu » en soit un sens plus précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: dit
  rationale: Le passé simple convient au registre narratif français; la conjonction καί n’a pas besoin d’être rendue mécaniquement dans ce verset isolé.
- source_word: Ἔδνα
  choice: Edna
  rationale: Translittération usuelle du nom propre grec.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: à sa femme
  rationale: Dans ce contexte, γυνή désigne clairement l’épouse, et le possessif αὐτοῦ est conservé malgré l’incohérence apparente.
- source_word: Ὡς ὅμοιος
  choice: Comme … ressemble
  rationale: Cette tournure exclamative naturelle restitue à la fois ὡς et l’idée de forte ressemblance portée par ὅμοιος.
- source_word: ὁ νεανίσκος
  choice: ce jeune homme
  rationale: « Jeune homme » est une traduction moderne et digne; le démonstratif rend naturellement la valeur contextuelle de l’article grec.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Forme française courante du nom personnel correspondant au grec Τωβεΐτ.
- source_word: τῷ ἀνεψιῷ μου
  choice: mon neveu
  rationale: ἀνεψιός peut désigner un neveu ou, plus largement, un cousin ou proche parent masculin; « neveu » en retient le sens plus précis tout en signalant l’alternative en note.
theological_decisions:
- issue: Identification du locuteur et référence du possessif
  choice: 'Suivre le grec tel qu’il est transmis : Edna parle « à sa femme ».'
  alternative: Ragouël dit à Edna, sa femme.
  rationale: Le grec nomme explicitement Ἔδνα comme sujet et porte τῇ γυναικὶ αὐτοῦ, « à sa femme ». Cette formulation est difficile dans le contexte, tandis que le parallèle sémitique indirect fait parler Ragouël à Edna. Le texte principal conserve donc la tension du témoin grec sans correction silencieuse, et la note expose l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’étrangeté du grec concernant Edna et « sa femme », sans l’aplanir; les deux appels de note figurent immédiatement après les éléments concernés.
