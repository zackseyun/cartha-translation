  naturalness: « Rues », « Alléluia », « louange » et « Béni soit Dieu » sont naturels dans un registre biblique moderne et international. « En disant » préserve la progression du grec tout en restant lisible. L’étrangeté de « a élevé tous les siècles » est voulue et doit rester explicitée.
  terminology: Les termes liturgiques et doxologiques sont appropriés. « Tous les siècles » est recevable pour αἰῶνας, tout en conservant une étrangeté proche de celle du grec. La note doit proposer l’équivalent idiomatique « pour toujours » ou « à travers tous les âges », non « dans tous les siècles », qui demeure ambigu et peu idiomatique dans ce sens.
