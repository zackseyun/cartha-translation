  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: fr
  text: 'Et toutes ses rues diront[a] : « Alléluia et louange ! », en disant : « Béni soit Dieu, qui a élevé tous les siècles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens plus idiomatique pour la dernière proposition : « Béni soit Dieu, qui est exalté pour toujours » ou « qui est exalté à travers tous les âges ». Le grec dit littéralement : « qui a élevé tous les siècles », expression inhabituelle.'
    reason: Signaler une compréhension idiomatique possible de la dernière expression tout en conservant dans le texte principal la syntaxe et l’ambiguïté du grec.
lexical_decisions:
- source_word: ῥῦμαι
  choice: rues
  rationale: ῥύμη désigne une rue, une ruelle ou une voie urbaine. « Rues » est naturel en français moderne et conserve la personnification de la ville.
- source_word: ἀλληλουιά
  choice: Alléluia
  rationale: Le grec garde la forme liturgique translittérée ; « Alléluia » en est l'équivalent traditionnel et immédiatement reconnaissable en français.
- source_word: αἴνεσιν
  choice: louange
  rationale: Le nom signifie « louange ». Le singulier préserve la forme grecque et convient à l'acclamation coordonnée avec « Alléluia ».
- source_word: Εὐλογητός
  choice: Béni soit
  rationale: Dans une formule doxologique appliquée à Dieu, « Béni soit Dieu » est une expression française naturelle et digne, qui rend la force acclamative du grec.
- source_word: ὕψωσεν
  choice: a élevé
  rationale: ὑψόω signifie élever, hausser ou exalter. « A élevé » reste proche du sens premier sans imposer une interprétation supplémentaire.
- source_word: πάντας τοὺς αἰῶνας
  choice: tous les siècles
  rationale: La formule grecque, inhabituelle, signifie littéralement « tous les âges ». « Tous les siècles » en conserve la dimension temporelle et l'étrangeté relative dans un français biblique compréhensible.
theological_decisions:
- issue: Sens de πάντας τοὺς αἰῶνας dans la dernière proposition
  choice: tous les siècles
  alternative: pour toujours / dans tous les siècles
  rationale: Le texte grec présente grammaticalement les siècles comme l'objet de « a élevé ». La traduction principale conserve cette formulation surprenante au lieu de la transformer silencieusement en affirmation selon laquelle Dieu est élevé éternellement ; la lecture temporelle idiomatique est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La personnification des rues et la répétition de l'acte de parole sont maintenues. La tournure inhabituelle de la clause finale est volontairement préservée et expliquée en note.
