  terminology: « Seigneur Dieu », « présents » et « Roi du ciel » conviennent au registre et au contexte. « Vers le nom du Seigneur Dieu » maintient volontairement l’idiome directionnel du grec sans en imposer une interprétation cultuelle étroite.
