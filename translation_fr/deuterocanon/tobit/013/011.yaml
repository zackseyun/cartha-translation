  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: fr
  text: De nombreuses nations viendront de loin vers le nom du Seigneur Dieu, portant des présents dans leurs mains, des présents pour le Roi du ciel ; des générations et des générations t’apporteront l’allégresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des générations de générations te donneront l’exultation ».'
    reason: La note signale la construction répétitive, très littérale et sémitisante du grec, derrière la formulation française plus naturelle.
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: De nombreuses nations
  rationale: « Nations » conserve la portée internationale du grec sans imposer trop fortement l’opposition ultérieure entre Juifs et non-Juifs.
- source_word: μακρόθεν ἥξει
  choice: viendront de loin
  rationale: Cette formulation française naturelle garde à la fois le mouvement d’approche et l’idée d’une origine lointaine.
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: vers le nom du Seigneur Dieu
  rationale: Le tour directionnel inhabituel du grec est conservé afin de maintenir l’image biblique d’une démarche de pèlerinage et de révérence, sans la réduire explicitement à « adorer » ou à « honorer ».
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: portant des présents dans leurs mains
  rationale: « Portant » rend naturellement le participe concomitant, tandis que « dans leurs mains » préserve l’image concrète du texte.
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: des présents pour le Roi du ciel
  rationale: La répétition de « présents » reproduit l’insistance du grec ; « pour » exprime naturellement le destinataire indiqué par le datif.
- source_word: γενεαὶ γενεῶν
  choice: de génération en génération
  rationale: Ce tour idiomatique et solennel exprime en français la succession continue suggérée par la construction sémitisante littérale « générations de générations ».
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: elles t’apporteront la joie
  rationale: « Apporter la joie » rend clairement l’idée de donner une cause de réjouissance à la ville personnifiée. Le sujet pronominal reprend naturellement les générations, comprises collectivement.
theological_decisions:
- issue: Référent du pronom σοι
  choice: Maintenir l’adresse à la deuxième personne, comprise dans le contexte comme Jérusalem/Sion personnifiée
  alternative: Nommer explicitement Jérusalem ou comprendre plus largement Israël
  rationale: Le contexte s’adresse directement à Jérusalem. Le simple pronom « t’ » préserve cette adresse poétique sans ajouter le nom de la ville dans le verset.
- issue: Portée de « vers le nom du Seigneur Dieu »
  choice: Conserver l’idiome biblique de l’approche vers le nom divin
  alternative: Expliciter par « pour adorer le Seigneur Dieu » ou « attirées par la renommée du Seigneur Dieu »
  rationale: Le grec peut évoquer une démarche cultuelle ou la renommée divine, mais il dit littéralement « vers le nom ». La traduction maintient cette amplitude théologique.
translation_notes:
  register: Français international moderne, digne et poétique. « Présents » convient au contexte d’offrandes et évite la tonalité familière de « cadeaux ». La majuscule à « Roi » marque ici le titre divin sans surcharger le texte.
