lexical_decisions:
- source_word: εὐλόγει
  choice: Bénis
  rationale: Impératif présent singulier de εὐλογέω. « Bénis » conserve l’image biblique consistant à dire du bien de Dieu et, dans ce contexte, à le louer; « loue » serait naturel mais réduirait légèrement l’étendue du terme.
- source_word: τὸν θεὸν
  choice: Dieu
  rationale: L’objet grec avec article se rend naturellement par « Dieu » en français, sans article.
- source_word: τὸν βασιλέα
  choice: le Roi
  rationale: Apposition qui attribue à Dieu le titre royal; la majuscule signale ici un titre divin sans ajouter de contenu au grec.
- source_word: τὸν μέγαν
  choice: grand
  rationale: μέγας signifie directement « grand ». « Puissant » insisterait davantage sur la force et serait plus interprétatif.
theological_decisions:
- issue: Rendu du titre royal divin
  choice: le grand Roi
  alternative: le grand roi
  rationale: Le grec place « le roi, le grand » en apposition à Dieu. « Le grand Roi » en restitue naturellement la portée de titre divin sans résoudre ni développer davantage l’énoncé.
translation_notes:
  register: Français moderne, simple et digne. La formulation brève conserve l’impératif singulier et la structure appositionnelle du grec. La virgule finale est maintenue puisque le segment fourni semble se poursuivre.
