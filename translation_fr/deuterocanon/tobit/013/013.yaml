  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
translation:
  language: fr
  text: Réjouis-toi et exulte à cause des fils des justes[a], car ils seront rassemblés et béniront le Seigneur des justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants des justes ». Le grec dit « fils », terme qui peut désigner plus largement les enfants ou les descendants.
    reason: Alternative lexicale et portée possible du masculin pluriel grec.
lexical_decisions:
- source_word: χάρηθι
  choice: Réjouis-toi
  rationale: L’impératif exprime directement la joie et forme un couple naturel avec l’impératif plus intense qui suit.
- source_word: ἀγαλλίασαι
  choice: exulte
  rationale: « Exulte » conserve l’intensification et le registre élevé de cette invitation à une joie débordante.
- source_word: ἐπὶ
  choice: au sujet de
  rationale: Avec le datif, la préposition indique ici les personnes qui sont l’objet ou le motif de la joie; cette formulation préserve cette relation sans la réduire explicitement à une cause.
- source_word: τοῖς υἱοῖς τῶν δικαίων
  choice: des fils des justes
  rationale: Le grec emploie le masculin pluriel « fils ». La formulation française reste proche du texte, tandis qu’une portée plus large, « enfants » ou descendants, est signalée en note.
- source_word: συναχθήσονται
  choice: ils seront rassemblés
  rationale: Le futur passif est conservé, ainsi que la nuance communautaire et restauratrice du rassemblement.
- source_word: εὐλογήσουσιν
  choice: béniront
  rationale: « Bénir » rend le sens ordinaire du verbe et maintient le registre biblique, sans le réduire à « louer ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος fonctionne comme un titre divin révérenciel.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: Le génitif est maintenu tel quel afin de préserver la formulation grecque inhabituelle et son ambiguïté relationnelle.
theological_decisions:
- issue: Portée genrée et collective de τοῖς υἱοῖς τῶν δικαίων
  choice: les fils des justes
  alternative: les enfants des justes
  rationale: Le texte grec dit explicitement « fils », mais le terme peut désigner plus largement les enfants ou descendants. Le texte principal conserve la forme masculine, et la note préserve l’autre portée possible.
- issue: Sens de τὸν κύριον τῶν δικαίων
  choice: le Seigneur des justes
  alternative: le Seigneur juste / le Seigneur, le Juste
  rationale: La lecture la plus directe fait de « des justes » un complément au génitif. Les autres traductions exigeraient une autre analyse syntaxique qui n’est pas imposée par le grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux impératifs est conservé, avec une progression de « réjouis-toi » à « exulte ». La syntaxe demeure proche du grec sans sacrifier la clarté.
