  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
translation:
  language: fr
  text: Car Jérusalem sera bâtie[a] en saphir et en émeraude ; tes murailles, en pierres précieuses, et tes tours et tes ouvrages avancés[b], en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « sera rebâtie ». Le grec dit simplement « sera bâtie », mais le contexte de restauration peut suggérer une reconstruction.'
    reason: lexical_alternative
  - marker: b
    text: « Ouvrages avancés » désigne des fortifications défensives placées en avant de l’enceinte ; on pourrait aussi traduire par « remparts » ou « bastions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: sera bâtie
  rationale: Le futur passif signifie simplement « sera bâtie ». Le contexte peut évoquer une reconstruction, mais le grec ne l’explicite pas.
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: en saphir et en émeraude
  rationale: Les datifs indiquent ici la matière employée ; « en » rend naturellement cette construction en français.
- source_word: λίθῳ ἐντίμῳ
  choice: en pierres précieuses
  rationale: Le singulier grec peut avoir une valeur collective. Le pluriel est idiomatique en français et conserve l’image de matériaux précieux.
- source_word: τὰ τείχη σου
  choice: tes murailles
  rationale: 'Le possessif de deuxième personne est explicite : le discours s’adresse directement à Jérusalem. « Murailles » convient au contexte urbain défensif.'
- source_word: οἱ πύργοι
  choice: tes tours
  rationale: Le possessif sous-entendu par la coordination est repris en français pour la clarté, et « tours » est l’équivalent courant dans ce contexte.
- source_word: οἱ προμαχῶνες
  choice: tes ouvrages avancés
  rationale: Le terme désigne des fortifications placées en avant pour défendre une enceinte. « Ouvrages avancés » est précis et moderne, sans le réduire aux seuls créneaux.
- source_word: χρυσίῳ καθαρῷ
  choice: en or pur
  rationale: Le datif exprime la matière, et « or pur » rend directement καθαρῷ.
theological_decisions:
- issue: Imagerie de la restauration glorieuse de Jérusalem
  choice: Conserver la promesse poétique d’une Jérusalem bâtie avec des matériaux somptueux sans préciser si l’image est littérale ou symbolique.
  alternative: Interpréter explicitement la description comme une architecture littérale ou, au contraire, comme une pure métaphore de la gloire restaurée.
  rationale: Le grec présente l’image sans imposer l’une de ces interprétations ; la traduction doit préserver cette ouverture.
translation_notes:
  register: Français international moderne, clair et soutenu. L’adresse directe à Jérusalem est maintenue par « tes ». Les ellipses après le point-virgule rendent la coordination grecque sans alourdir la phrase.
