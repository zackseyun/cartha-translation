review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement l’ensemble du verset grec, y compris la section qui ne figure pas dans l’extrait anglais. Une correction est nécessaire pour μεθʼ ὑμῶν, qui signifie littéralement « avec vous » plutôt que « pour vous ». Le dernier impératif ἐπιστρέψατε ne comporte pas de complément exprimé ; « Revenez » évite donc d’ajouter « vers lui », tout en laissant le contexte l’indiquer.
  naturalness: Le français est globalement moderne, clair et d’un registre biblique sobre. « Revenir à lui / revenir vers vous » et « Voyez ce qu’il fera avec vous » conservent les reprises du grec tout en restant naturels. « Pratiquez la justice » est plus idiomatique et plus proche de ποιήσατε δικαιοσύνην que « faites ce qui est juste ».
  terminology: « Le Seigneur de la justice », « le Roi des siècles », « rendre grâce », « miséricorde » et « pécheurs » conviennent au registre et aux termes grecs. La note sur « faire la vérité » préserve utilement le sémitisme de ποιεῖν ἀλήθειαν. La note relative à θελήσει ὑμᾶς conserve l’ambiguïté sans imposer d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: « Voyez ce qu’il fera pour vous » traduit μεθʼ ὑμῶν de manière trop orientée vers le bénéfice.
    rationale: μετά avec le génitif signifie ici « avec ». Le contexte peut être favorable, mais « pour vous » spécifie une finalité ou un bénéfice que le grec ne formule pas.
  - severity: low
    issue: « Tournez-vous vers lui, pécheurs » ajoute un complément absent de l’impératif final ἐπιστρέψατε.
    rationale: Le mouvement vers Dieu ressort du contexte, mais le grec laisse le complément implicite. « Revenez, pécheurs » est plus exact et garde l’exhortation concise.
  - severity: low
    issue: « Faites ce qui est juste » atténue le nom δικαιοσύνην.
    rationale: ποιήσατε δικαιοσύνην appelle plus directement à pratiquer la justice ou la droiture. « Pratiquez la justice » rend le nom grec et demeure naturel en français.
