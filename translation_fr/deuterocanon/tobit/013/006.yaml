base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: fr
  text: 'Si vous revenez à lui de tout votre cœur et de toute votre âme, afin de faire ce qui est vrai devant lui[a], alors il reviendra vers vous et ne vous cachera certainement pas son visage. Voyez ce qu’il fera avec vous, et rendez-lui grâce de tout votre être[b]. Bénissez le Seigneur de la justice[c] et exaltez le Roi des siècles[d]. Pour ma part, dans le pays de ma captivité, je lui rends grâce et je fais connaître sa puissance et sa grandeur aux nations pécheresses. Revenez, pécheurs, et pratiquez la justice devant lui. Qui sait s’il vous accordera sa faveur et vous fera miséricorde[e] ?


    [a] Littéralement : « faire la vérité devant lui » ; cette expression peut aussi signifier « agir avec fidélité devant lui ».


    [b] Littéralement : « de tout votre corps ».


    [c] Ou : « le Seigneur de la droiture ».


    [d] Ou : « le Roi éternel ».


    [e] Littéralement : « s’il vous voudra et vous fera miséricorde » ; le premier membre exprime ici le fait de regarder quelqu’un avec faveur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire la vérité devant lui » ; cette expression peut aussi signifier « agir avec fidélité devant lui ».'
    reason: La construction grecque d’allure sémitique admet une nuance de vérité vécue ou de fidélité.
  - marker: b
    text: 'Littéralement : « de tout votre corps ».'
    reason: La note préserve le terme concret σῶμα derrière la formulation française globale.
  - marker: c
    text: 'Ou : « le Seigneur de la droiture ».'
    reason: δικαιοσύνη peut évoquer aussi bien la justice que la rectitude morale.
  - marker: d
    text: 'Ou : « le Roi éternel ».'
    reason: Le génitif pluriel « des siècles » peut fonctionner comme une expression de l’éternité.
  - marker: e
    text: 'Littéralement : « s’il vous voudra et vous fera miséricorde » ; le premier membre exprime ici le fait de regarder quelqu’un avec faveur.'
    reason: La tournure littérale est ambiguë et peu idiomatique en français ; la note rend visible cette difficulté.
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: Si vous vous tournez ... alors il se tournera
  rationale: La répétition du même verbe grec exprime la réciprocité entre le retour humain vers Dieu et le retour favorable de Dieu ; la répétition de « se tourner » la conserve en français.
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: de tout votre cœur et de toute votre âme
  rationale: Cette formule biblique familière exprime une consécration totale tout en restant naturelle en français contemporain.
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: faire ce qui est vrai devant lui
  rationale: Cette formulation garde le lien explicite avec ἀλήθεια sans reproduire dans le texte principal le calque peu naturel « faire la vérité » ; la nuance de fidélité est signalée en note.
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: ne vous cachera certainement pas son visage
  rationale: « Certainement pas » rend la négation grecque fortement emphatique, tandis que l’image biblique du visage est conservée.
- source_word: θεάσασθε ἃ ποιήσει μεθʼ ὑμῶν
  choice: Voyez ce qu’il fera pour vous
  rationale: Le verbe appelle à constater attentivement l’action divine ; dans ce contexte favorable, « pour vous » rend naturellement μεθʼ ὑμῶν.
- source_word: ἐξομολογήσασθε / ἐξομολογοῦμαι
  choice: rendez-lui grâce / je lui rends grâce
  rationale: Dans ce chant de louange, le verbe désigne l’action de grâce ou la louange plutôt que la confession des péchés ; le même choix conserve l’écho entre les deux emplois.
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: de tout votre être
  rationale: La traduction idiomatique exprime l’engagement total et incarné ; le sens littéral « de tout votre corps » est conservé en note.
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: le Seigneur de la justice
  rationale: « Justice » couvre ici la rectitude morale et l’action juste de Dieu, et forme en français un titre divin naturel ; « droiture » reste possible et figure en note.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: le Roi des siècles
  rationale: La formulation préserve le pluriel grec et le ton doxologique traditionnel sans être archaïque.
- source_word: ἐν τῇ γῇ τῆς αἰχμαλωσίας μου
  choice: sur la terre où je suis captif
  rationale: Cette traduction claire conserve l’idée de captivité ou d’exil personnel sans imposer un terme technique absent du grec.
- source_word: ἔθνεσιν ἁμαρτωλῶν
  choice: à des nations pécheresses
  rationale: Le génitif grec caractérise vraisemblablement les nations par le péché ; cette formulation garde la sévérité du texte sans l’atténuer.
- source_word: ποιήσατε δικαιοσύνην ἐνώπιον αὐτοῦ
  choice: faites ce qui est juste devant lui
  rationale: La tournure rend l’appel concret à une conduite juste et maintient le parallèle avec « faire ce qui est vrai devant lui ».
- source_word: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: Qui sait s’il vous accordera sa faveur
  rationale: Le grec dit littéralement « s’il vous voudra », expression difficile en français ; dans le parallélisme avec la miséricorde, elle désigne vraisemblablement un accueil favorable. La littéralité est documentée en note.
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: vous fera miséricorde
  rationale: Ici ἐλεημοσύνη désigne la compassion miséricordieuse de Dieu, et non l’aumône humaine.
theological_decisions:
- issue: Relation entre le retournement humain et le retournement de Dieu
  choice: Conserver la structure conditionnelle et la répétition de « se tourner »
  alternative: Interpréter le second verbe comme « vous restaurera » ou « reviendra vers vous »
  rationale: Le texte présente volontairement une réciprocité sans expliquer systématiquement le rapport entre repentance humaine et grâce divine ; la traduction n’ajoute donc aucun ordre théologique absent du grec.
- issue: Portée de δικαιοσύνη dans le titre divin
  choice: justice
  alternative: droiture
  rationale: « Justice » conserve en français la dimension morale et judiciaire du terme, tandis que la note préserve l’autre nuance possible sans réduire le titre à une doctrine particulière.
- issue: Incertitude de τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: Qui sait s’il vous accordera sa faveur
  alternative: Qui sait s’il voudra de vous
  rationale: La question maintient l’incertitude rhétorique du grec et ne transforme pas l’espérance de miséricorde en certitude automatique ; la note donne le tour littéral.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve le rythme exhortatif et doxologique, les images bibliques du visage et du retournement, ainsi que les répétitions structurantes du grec. Les calques obscurs sont évités dans le corps du texte mais documentés en notes.
