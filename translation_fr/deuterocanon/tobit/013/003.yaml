  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: fr
  text: Rendez-lui grâce[a], fils d’Israël, devant les nations, car c’est lui-même qui nous a dispersés parmi elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Reconnaissez-le » ou « Louez-le » ; le verbe grec peut exprimer notamment la reconnaissance, l’action de grâce et la louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Rendez-lui grâce
  rationale: Dans le grec biblique, le verbe peut exprimer l’aveu, la reconnaissance, l’action de grâce ou la louange. Ici, l’appel à proclamer publiquement l’action de Dieu devant les nations favorise « rendez-lui grâce », tout en conservant les autres possibilités en note.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: fils d’Israël
  rationale: Reproduit directement le masculin pluriel grec et sa valeur d’interpellation, sans ajouter un « ô » peu naturel en français moderne.
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: devant les nations
  rationale: Préserve le sens public de « devant, en présence de » et évite de confondre cette expression avec le complément suivant, « parmi elles ».
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français la raison de l’exhortation.
- source_word: αὐτὸς
  choice: c’est lui-même qui
  rationale: Rend l’emphase du pronom grec sans lui attribuer une idée d’exclusivité absente du texte.
- source_word: διέσπειρεν ἡμᾶς ἐν αὐτοῖς
  choice: nous a dispersés parmi elles
  rationale: Attribue clairement à Dieu l’acte passé de dispersion et reprend grammaticalement « les nations » par le pronom féminin pluriel « elles ».
theological_decisions:
- issue: Attribution de la dispersion d’Israël à Dieu
  choice: car c’est lui-même qui nous a dispersés parmi elles
  alternative: car il nous a lui-même dispersés parmi elles
  rationale: Le grec attribue explicitement la dispersion à Dieu et souligne le sujet. La formulation retenue maintient cette affirmation et sa tension théologique sans l’atténuer ni l’expliquer.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif pluriel est direct ; la tournure emphatique « c’est lui-même qui » restitue nettement αὐτός. Le mot « nations » conserve le vocabulaire biblique tout en restant courant.
