base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: fr
  text: Car c’est lui qui frappe et qui fait miséricorde ; il fait descendre dans l’Hadès et il en fait remonter[a], et personne n’échappera à sa main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le séjour des morts ». Grec : « dans l’Hadès ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖ
  choice: frappe
  rationale: Le verbe évoque littéralement l’action de fouetter ou de châtier. « Frappe » conserve sa force et sa portée générale sans limiter l’image à un supplice physique précis.
- source_word: ἐλεᾷ
  choice: fait miséricorde
  rationale: Cette expression claire et bibliquement digne rend l’exercice concret de la compassion divine et maintient le contraste avec « frappe ».
- source_word: κατάγει
  choice: fait descendre
  rationale: Le causatif français correspond au mouvement exprimé par le grec et préserve le parallélisme antithétique avec ἀνάγει.
- source_word: εἰς ᾅδην
  choice: dans l’Hadès
  rationale: Le grec nomme explicitement l’Hadès, le séjour des morts. Le maintien du terme dans le texte évite de le réduire à la seule tombe.
- source_word: ἀνάγει
  choice: en fait remonter
  rationale: « En » explicite naturellement en français que la remontée se fait depuis l’Hadès, tout en laissant ouverte la nature exacte de ce retour.
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: personne n’échappera
  rationale: Formulation française naturelle qui conserve la force catégorique et la valeur future du grec.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: à sa main
  rationale: La traduction conserve l’image biblique concrète de la main comme expression de la puissance et de l’autorité.
theological_decisions:
- issue: Sens de la descente dans l’Hadès et de la remontée
  choice: Formulation générale de la souveraineté de Dieu sur la mort et le séjour des morts, sans préciser s’il s’agit d’une délivrance du danger mortel ou d’un retour d’entre les morts.
  alternative: Lire le verset soit comme une restauration après une mort imminente, soit comme une affirmation explicite de la résurrection.
  rationale: Les verbes opposés expriment nettement la maîtrise divine sur la vie et la mort, mais le texte ne contraint pas à choisir entre une délivrance imagée et une remontée effective du séjour des morts.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que l’image biblique de la main. « Hadès » maintient la référence grecque, tandis que la note donne l’équivalent explicatif courant.
