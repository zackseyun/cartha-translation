base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: fr
  text: Oh ! Heureux ceux qui t’aiment ! Ils se réjouiront de ta paix. Heureux tous ceux que tes épreuves[a] ont attristés, car ils se réjouiront à ton sujet lorsqu’ils verront toute ta gloire ; et mon âme se réjouira pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coups », « fléaux » ou « châtiments ». Le mot grec peut désigner littéralement des coups de fouet ou, au sens figuré, des souffrances qui frappent quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: heureux
  rationale: « Heureux » est la formule française naturelle des béatitudes et conserve ici l’idée d’un état digne d’être célébré, sans réduire le terme à une émotion passagère.
- source_word: οἱ ἀγαπῶντές σε
  choice: ceux qui t’aiment
  rationale: Rend naturellement le participe présent substantivé et sa portée relationnelle continue.
- source_word: χάρησονται
  choice: ils se réjouiront
  rationale: Correspond au futur grec et maintient le motif répété de la joie dans le verset.
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: de ta paix
  rationale: Avec le verbe « se réjouir », « de » exprime naturellement en français le motif ou l’occasion de la joie ; la paix désigne le bien-être restauré de la ville personnifiée.
- source_word: ὅσοι ἐλυπήθησαν ἐπὶ ταῖς μάστιξίν σου
  choice: tous ceux que tes épreuves ont attristés
  rationale: Cette construction française rend clairement la douleur éprouvée à cause des coups ou malheurs subis par la destinataire, tout en évitant une formulation passive lourde.
- source_word: μάστιξίν
  choice: épreuves
  rationale: Le mot peut désigner des coups de fouet, des fléaux ou, au figuré, des souffrances. « Épreuves » convient au contexte des malheurs de Jérusalem sans imposer l’image littérale du fouet ni une interprétation disciplinaire.
- source_word: ἐπὶ σοὶ χαρήσονται
  choice: ils se réjouiront à ton sujet
  rationale: Préserve le fait que la destinataire elle-même est l’objet ou le motif de la joie, sans transformer explicitement la préposition en « en toi ».
- source_word: θεασάμενοι
  choice: lorsqu’ils verront
  rationale: 'Rend le participe aoriste par une proposition temporelle naturelle : la vue de la gloire accompagne et motive leur joie.'
- source_word: πᾶσαν τὴν δόξαν σου
  choice: toute ta gloire
  rationale: Conserve directement la totalité exprimée par πᾶσαν et le langage élevé de δόξα.
- source_word: εὐφρανθήσεται
  choice: se réjouira
  rationale: Rend la joie intense du verbe en français courant et maintient l’écho thématique avec les deux occurrences de χαίρω.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française actuelle et naturelle de la durée indéfinie ou perpétuelle.
- source_word: ἡ ψυχή μου
  choice: mon âme
  rationale: Préserve le registre personnel et poétique ainsi que l’expression explicite de l’être intérieur.
theological_decisions:
- issue: Référent des pronoms féminins de la deuxième personne
  choice: La ville de Jérusalem ou Sion personnifiée est directement interpellée, sans être nommée dans le verset.
  alternative: Les pronoms pourraient être compris plus largement comme visant le peuple de Dieu.
  rationale: Le contexte immédiat de l’hymne s’adresse à Jérusalem et évoque sa paix, ses épreuves et sa gloire. La traduction maintient simplement « tu/ta » afin de ne pas ajouter dans le corps du texte un référent absent du grec.
- issue: Valeur de μάστιξίν
  choice: Terme général désignant les souffrances ou épreuves subies par la ville.
  alternative: « coups de fouet », « fléaux » ou « châtiments » pourraient expliciter une image de frappe ou une dimension punitive.
  rationale: Le grec autorise ces nuances sans imposer à lui seul une lecture exclusivement littérale ou disciplinaire. Le texte principal conserve donc une formulation ouverte, et la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, digne et poétique. L’exclamation initiale ὦ est rendue par « Oh ! », puis la ponctuation exclamative soutient les deux proclamations de bonheur. La répétition de « se réjouir » est conservée pour faire entendre l’insistance du grec.
