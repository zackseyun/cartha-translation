review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’adresse à Jérusalem, le sujet divin implicite, la causalité des œuvres et la compassion renouvelée. Toutefois, « frappera » atténue μαστιγώσει, qui évoque explicitement le fouet/la flagellation, et « pour les œuvres » est moins net en français que l’expression causale « à cause des œuvres ».
  naturalness: Le français est globalement fluide et de registre approprié. Une ponctuation par deux-points rend mieux l’apostrophe suivie de la déclaration, sans ajouter l’intensité interprétative du point d’exclamation. « Il te flagellera » reste un français moderne intelligible et reproduit la force imagée du grec.
  terminology: « Le Saint » est un rendu recevable de ἁγίου, dont le référent divin est très probable dans le contexte sans être grammaticalement imposé. « Enfants » est approprié dans les deux occurrences pour le sens collectif de υἱοί; « justes » rend correctement le substantif pluriel δικαίων.
  issues:
