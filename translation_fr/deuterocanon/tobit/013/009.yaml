    issue: « Il te frappera » affaiblit μαστιγώσει.
    rationale: Le verbe grec désigne proprement l’action de fouetter/flageller, même lorsqu’il fonctionne comme image de châtiment. « Flagellera » préserve cette vigueur sans modifier le sens.
  - severity: low
    issue: « pour les œuvres » est causalement moins précis en français.
    rationale: Avec un châtiment, « à cause des œuvres » exprime sans ambiguïté la valeur causale de ἐπὶ τὰ ἔργα.
  - severity: low
    issue: Le point d’exclamation ajoute une coloration expressive non requise par le grec.
    rationale: Les deux-points structurent naturellement l’adresse suivie de la prédication et restent plus sobres.
