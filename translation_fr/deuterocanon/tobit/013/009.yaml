base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: fr
  text: 'Jérusalem, ville du Saint[a] : il te flagellera à cause des œuvres de tes enfants[b], et, de nouveau, il aura compassion des enfants des justes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ville d’un saint » ; le génitif grec peut être compris plus généralement, mais, dans ce contexte, il désigne très probablement Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « fils » dans les deux expressions ; « enfants » rend ici le sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: πόλις ἁγίου
  choice: ville du Saint
  rationale: L’apposition est conservée, et le génitif ἁγίου est compris comme désignant probablement Dieu, sans transférer la sainteté à la ville elle-même.
- source_word: μαστιγώσει
  choice: il te frappera
  rationale: Le verbe évoque littéralement la flagellation et, par extension, un châtiment sévère. « Frappera » garde une image forte en français actuel sans introduire nécessairement l’instrument du fouet.
- source_word: ἐπὶ τὰ ἔργα
  choice: pour les œuvres
  rationale: La préposition exprime ici le motif ou la cause. Cette formulation reste proche du grec tout en étant intelligible.
- source_word: τῶν υἱῶν σου
  choice: de tes enfants
  rationale: Bien que le grec dise formellement « fils », le pluriel désigne collectivement ceux qui appartiennent à Jérusalem.
- source_word: πάλιν
  choice: de nouveau
  rationale: Marque le retournement qui fait succéder la compassion au châtiment.
- source_word: ἐλεήσει
  choice: il aura compassion
  rationale: Expression française naturelle qui rend l’exercice actif de la miséricorde divine.
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: des enfants des justes
  rationale: « Enfants » rend la portée collective de υἱούς, tandis que « les justes » conserve δικαίων comme substantif pluriel.
theological_decisions:
- issue: Sujet implicite de « frappera » et « aura compassion »
  choice: Le pronom « il » renvoie à Dieu, le Saint.
  alternative: Laisser le sujet indéterminé ou considérer seulement Jérusalem comme centre grammatical de l’énoncé.
  rationale: Les verbes grecs n’expriment pas séparément leur sujet, mais le contexte du jugement et de la compassion, ainsi que « ville du Saint », indique très probablement Dieu comme agent. Le français exige ici de rendre le sujet explicite.
- issue: Portée du langage familial masculin
  choice: Employer « enfants » dans les deux occurrences.
  alternative: Employer « fils ».
  rationale: Dans cette adresse poétique à Jérusalem, υἱοί désigne collectivement sa population ou sa descendance, et non nécessairement les seuls hommes.
translation_notes:
  register: Français international moderne, digne et poétique. L’exclamation après l’apostrophe souligne l’adresse directe à Jérusalem. « Œuvres » conserve le lien lexical avec le grec, tandis que « frappera » maintient la vigueur de l’image sans donner au français une tournure excessivement archaïque.
