  yaml_path: translation/deuterocanon/tobit/013/007.yaml
  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: fr
  text: J’exalte mon Dieu, et mon âme se réjouit du Roi du ciel[a] ; elle exultera de sa grandeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition grecque est elliptique : littéralement, « et mon âme au Roi du ciel ». La traduction supplée « se réjouit du » pour exprimer le sens poétique probable dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑψῶ
  choice: J’exalte
  rationale: Le verbe exprime l’élévation et, dans ce contexte hymnique, l’exaltation de Dieu. « J’exalte » reste concis, digne et proche du grec.
- source_word: ψυχή
  choice: mon âme
  rationale: Le grec nomme explicitement l’âme. La traduction conserve cette formulation poétique et dévotionnelle plutôt que de la réduire à « je ».
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: le Roi du ciel
  rationale: Cette formulation conserve le titre divin et rend clairement le rapport génitif.
- source_word: ἀγαλλιάσεται
  choice: elle exultera
  rationale: Le futur exprime une joie intense. « Exultera » préserve à la fois le temps verbal et le registre élevé du chant.
- source_word: μεγαλοσύνην
  choice: grandeur
  rationale: « Grandeur » est le sens le plus direct et le plus large du nom, adapté au contexte de louange.
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: et mon âme se réjouit dans le Roi du ciel
  rationale: Le membre grec est elliptique et ne comporte pas de verbe exprimé. « Se réjouit dans » fournit en français le sens poétique probable d’après le contexte, sans dissimuler l’ellipse, signalée en note.
theological_decisions:
- issue: Membre médian elliptique sans verbe explicite
  choice: Comprendre le membre comme l’expression poétique de la joie de l’âme dans le Roi du ciel
  alternative: Traduire plus littéralement « et mon âme au Roi du ciel » ou comprendre « mon âme est pour le Roi du ciel »
  rationale: Le texte transmis est syntaxiquement condensé. Le contexte hymnique favorise une idée de joie ou de louange, mais la note maintient visible l’ambiguïté réelle au lieu de présenter le verbe suppléé comme certain.
translation_notes:
  register: Français international moderne, naturel et digne, avec un registre hymnique. Le point-virgule distingue le dernier mouvement au futur, et le pronom « elle » reprend clairement « mon âme ».
