  text: τὸν θεόν μου ὑψῶ, καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ, καὶ ἀγαλλιάσεται τὴν μεγαλοσύνην αὐτοῦ.
