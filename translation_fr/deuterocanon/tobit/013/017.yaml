  text: And the streets of Jerusalem will be paved with beryl and carbuncle and stones from Suphir[a].
translation:
  language: fr
  text: Les rues de Jérusalem seront pavées de béryl, d’escarboucle et de pierre de Souphir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre d’Ophir », si Σουφείρ est compris comme le nom de lieu Ophir plutôt que transcrit directement d’après le témoin grec.
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: rues
  rationale: Le terme désigne ici les voies larges ou espaces ouverts de la ville. « Rues » est naturel en français moderne et convient à cette évocation de la splendeur urbaine.
- source_word: βηρύλλῳ
  choice: béryl
  rationale: Nom traditionnel de cette pierre précieuse, qui préserve l’image minérale sans imposer une identification moderne plus précise.
- source_word: ἄνθρακι
  choice: escarboucle
  rationale: Dans un contexte de pierres précieuses, ἄνθραξ désigne une gemme rouge et ardente plutôt que du charbon. « Escarboucle » est l’équivalent français traditionnel et précis dans ce registre.
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: pierres de Souphir
  rationale: La formule indique des pierres provenant du lieu nommé Σουφείρ. « Souphir » transcrit directement la forme de ce témoin grec, tandis que le pluriel français s’accorde naturellement avec l’énumération des matériaux.
- source_word: ψηφολογηθήσονται
  choice: seront pavées
  rationale: Le verbe évoque la pose de petites pierres, notamment pour un pavement ou une mosaïque. « Seront pavées » exprime clairement le sens architectural sans technicité excessive.
