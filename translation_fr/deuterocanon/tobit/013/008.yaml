translation:
  language: fr
  text: Que tous parlent et lui rendent grâce à Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reconnaissent » ou « le louent » ; selon le contexte, le verbe grec peut exprimer chacun de ces actes liés au culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  choice: Que tous parlent
  rationale: L’impératif grec à la troisième personne du pluriel appelle chacun à prendre la parole. « Parlent » reste volontairement général, sans préciser un contenu que le grec n’explicite pas.
- source_word: πάντες
  choice: tous
  rationale: L’adjectif employé comme substantif exprime simplement et avec concision l’universalité de l’appel.
- source_word: ἐξομολογείσθωσαν
  choice: lui rendent grâce
  rationale: Dans la langue biblique et dans ce contexte hymnique, le verbe peut désigner l’action de confesser, de louer ou de rendre grâce. « Rendre grâce » exprime naturellement ici sa portée cultuelle, tandis que les autres sens sont conservés en note.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif renvoie à Dieu et se rend naturellement en français par le pronom complément indirect « lui ».
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: Avec un nom de ville, « à Jérusalem » est l’équivalent français moderne et idiomatique de la construction grecque avec ἐν.
theological_decisions:
- issue: Sens de ἐξομολογείσθωσαν dans un contexte de culte
  choice: lui rendent grâce
  alternative: se confessent à lui ; le louent
  rationale: Le contexte doxologique de Tobit 13 favorise l’idée d’action de grâce, mais le champ sémantique du verbe permet aussi la confession ou la louange. La note maintient cette ambiguïté réelle sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, sobre et liturgique. La construction conserve les deux impératifs coordonnés et la brièveté du grec, tout en employant l’expression idiomatique « rendre grâce ».
