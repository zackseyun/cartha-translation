  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: fr
  text: Il nous châtiera pour nos injustices, puis il aura de nouveau compassion de nous et nous rassemblera de toutes les nations parmi lesquelles vous serez dispersés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe ici de « nous/nos » à « vous serez dispersés ». Certaines traductions harmonisent en disant « nous serons dispersés », mais le changement de personne du texte source est conservé.
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσει
  choice: châtiera
  rationale: Le verbe évoque littéralement la flagellation, mais il désigne ici un châtiment divin sévère. « Châtiera » en conserve la force métaphorique dans un français naturel et digne.
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: pour nos injustices
  rationale: La préposition a ici une valeur causale. « Injustices » conserve le pluriel et le sens de fautes ou d'actes contraires à la justice, sans généraliser en « péchés ».
- source_word: πάλιν
  choice: de nouveau
  rationale: L'expression marque la reprise de l'action miséricordieuse après le châtiment et rend clairement le renversement.
- source_word: ἐλεήσει
  choice: aura compassion de nous
  rationale: Cette formulation française exprime naturellement l'action de faire miséricorde tout en conservant son objet implicite, ici les personnes châtiées.
- source_word: συνάξει
  choice: rassemblera
  rationale: Le verbe exprime le rassemblement du peuple dispersé et convient directement au contexte de restauration.
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: de toutes les nations
  rationale: « Nations » désigne ici les peuples et territoires au milieu desquels Israël a été dispersé, sans imposer une opposition technique entre Juifs et non-Juifs.
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: parmi lesquelles vous aurez été dispersés
  rationale: La tournure identifie les nations comme les lieux de dispersion. Le futur antérieur français rend la forme grecque éventuelle dans le cadre de la perspective future du verset, tout en préservant le passage à la deuxième personne du pluriel.
theological_decisions:
- issue: Passage de la première personne du pluriel à la deuxième personne du pluriel dans la dernière proposition
  choice: 'Conserver le changement : « nous… nos… nous… vous aurez été dispersés »'
  alternative: 'Harmoniser à la première personne : « parmi lesquelles nous aurons été dispersés »'
  rationale: Le grec passe explicitement de ἡμᾶς/ἡμῶν à σκορπισθῆτε. Le conserver respecte la forme rhétorique du texte et évite de résoudre silencieusement sa tension grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. « Châtiera » évite l'image trop concrète et potentiellement trompeuse de « flagellera », tout en gardant la sévérité de μαστιγώσει. La note explicite le changement de personne sans le corriger.
