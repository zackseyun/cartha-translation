review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les actions principales et conserve à juste titre le passage rhétorique de la première personne du pluriel à la deuxième personne. Toutefois, « vous aurez été dispersés » introduit un futur antérieur (une antériorité achevée) qui n’est pas exprimé par σκορπισθῆτε, aoriste subjonctif passif dans une proposition indéfinie avec ἐάν. Le futur simple rend plus sobrement la perspective future du contexte, sans ajouter cette antériorité.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Parmi lesquelles vous serez dispersés » est naturel et plus direct que le futur antérieur du projet.
  terminology: « Châtiera », « injustices », « aura de nouveau compassion », « rassemblera » et « nations » sont des choix acceptables. « Châtiera » est un peu moins imagé que le grec « flagellera/scourgera », mais conserve dans ce contexte le sens d’un châtiment divin sévère sans produire une formulation française inutilement concrète.
  issues:
  - severity: medium
    issue: Futur antérieur injustifié dans la dernière proposition
    rationale: « Vous aurez été dispersés » présente la dispersion comme antérieure et achevée par rapport au rassemblement. Le grec οὗ ἐὰν σκορπισθῆτε emploie un aoriste subjonctif avec ἐάν, exprimant une éventualité/indétermination dans une perspective future (« là où / parmi lesquelles vous serez dispersés »), sans imposer le futur antérieur.
  revised_text: Il nous châtiera pour nos injustices, puis il aura de nouveau compassion de nous et nous rassemblera de toutes les nations parmi lesquelles vous serez dispersés.[a]
  revised_footnotes:
  - marker: a
    text: Le grec passe ici de « nous/nos » à « vous serez dispersés ». Certaines traductions harmonisent en disant « nous serons dispersés », mais le changement de personne du texte source est conservé.
    reason: alternative_reading
