revisions:
- from: Célèbre dignement le Seigneur et bénis le Roi des siècles, afin que sa demeure soit de nouveau bâtie chez toi dans la joie, qu’il réjouisse chez toi les captifs et qu’il aime chez toi les malheureux, de génération en génération, pour toujours.[a]
  to: Rends grâce au Seigneur comme il convient et bénis le Roi des siècles, afin que sa tente soit de nouveau bâtie pour toi dans la joie, afin qu’il réjouisse en ton sein les captifs et qu’il aime en ton sein les affligés, pour toutes les générations de l’âge.[a]
  rationale: La révision rétablit les distinctions spatiales et datives du grec, conserve l’image de la tente et maintient le sujet divin implicite des infinitifs dans une syntaxe française lisible. La note finale conserve l’ambiguïté et la coloration sémitisante de l’expression temporelle.
