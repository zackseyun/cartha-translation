base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: fr
  text: Rends grâce au Seigneur comme il convient et bénis le Roi des siècles, afin que sa tente soit de nouveau bâtie pour toi dans la joie, afin qu’il réjouisse en ton sein les captifs et qu’il aime en ton sein les affligés, pour toutes les générations de l’âge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour toutes les générations de l’âge » (ou « du siècle »). Cette expression sémitisante désigne une durée qui s’étend à travers toutes les générations.'
    reason: Le grec εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος conserve une formulation temporelle inhabituelle et à portée durable ; la note en donne le rendu littéral sans la réduire à une interprétation unique.
lexical_decisions:
- source_word: ἐξομολόγου ... ἀγαθῶς
  choice: Célèbre dignement
  rationale: Dans ce contexte hymnique, ἐξομολογέομαι exprime la louange ou l’action de grâce adressée au Seigneur; ἀγαθῶς qualifie la manière de le faire. « Célèbre dignement » est naturel en français tout en conservant cette nuance adverbiale.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: le Roi des siècles
  rationale: Rendu formel de l’expression grecque, qui présente Dieu comme souverain de toutes les ères.
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: sa demeure
  rationale: σκηνή signifie littéralement « tente », mais désigne ici la demeure divine, probablement le sanctuaire; « demeure » préserve la portée sans imposer explicitement « Temple ».
- source_word: ἐν σοὶ
  choice: chez toi
  rationale: L’expression répétée s’adresse vraisemblablement à Jérusalem et signifie « en ton sein »; « chez toi » est idiomatique et conserve la personnification de la ville.
- source_word: τοὺς ταλαιπώρους
  choice: les malheureux
  rationale: Le terme désigne ceux qui connaissent la détresse ou l’affliction; « malheureux » rend largement cet état sans en préciser indûment la cause.
- source_word: εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος
  choice: de génération en génération, pour toujours
  rationale: Cette formulation française restitue à la fois la succession de toutes les générations et la portée durable de αἰών.
theological_decisions:
- issue: Référent de σκηνή
  choice: demeure
  alternative: tente / Temple
  rationale: Le grec dit littéralement « tente », avec une probable référence cultuelle au sanctuaire de Jérusalem. « Demeure » maintient cette dimension théologique sans identifier plus précisément que le texte ne le fait.
- issue: Sujet des infinitifs εὐφρᾶναι et ἀγαπήσαι
  choice: 'Dieu demeure le sujet implicite: « qu’il réjouisse… et qu’il aime… »'
  alternative: Comprendre les infinitifs autrement ou les rattacher à la demeure
  rationale: La continuité syntaxique et sémantique favorise Dieu comme sujet implicite, conformément à la prière adressée au Seigneur et au Roi des siècles.
- issue: Portée de ἐν σοὶ
  choice: « chez toi » se rapporte à la ville personnifiée
  alternative: « en toi » appliqué à un individu
  rationale: Le contexte du cantique s’adresse à Jérusalem; la traduction conserve néanmoins la deuxième personne du singulier du grec.
translation_notes:
  register: Français moderne, international et digne, avec une cadence hymnique. La répétition de « chez toi » est maintenue afin de refléter l’anaphore grecque et l’adresse à Jérusalem.
