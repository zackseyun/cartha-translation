  source_fidelity: 'Révision nécessaire : σοι (« pour toi ») dans la première proposition ne correspond pas à « chez toi », tandis que les deux occurrences de ἐν σοί sont plus exactement rendues par « en ton sein ». σκηνή est littéralement une « tente » ; « demeure » atténue inutilement cette image. Les infinitifs εὐφρᾶναι et ἀγαπήσαι gardent Dieu pour sujet implicite dans la construction de but.'
  naturalness: « Rends grâce au Seigneur comme il convient » est naturel dans un registre biblique moderne et rend mieux l’adresse cultuelle que « Célèbre dignement ». « En ton sein » convient à l’apostrophe poétique à Jérusalem et évite la confusion entre σοι et ἐν σοί.
  terminology: « Roi des siècles » conserve l’expression grecque. « Tente » respecte σκηνή sans trancher, dans le texte même, entre tente et sanctuaire. « Affligés » est plus précis que « malheureux » pour ταλαιπώρους.
