  text: All who hate you are accursed; all who love you will be blessed forever.
translation:
  language: fr
  text: Maudits sont tous ceux qui te haïssent ; bénis seront pour toujours tous ceux qui t’aiment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: maudits
  rationale: L’adjectif exprime l’état de ceux qui sont sous une malédiction. « Maudits » conserve la force solennelle de la déclaration et reste naturel en français.
- source_word: μισοῦντές
  choice: ceux qui te haïssent
  rationale: Le participe substantivé désigne les personnes qui haïssent la destinataire. « Haïssent » rend directement le contraste avec « aiment ».
- source_word: εὐλογημένοι
  choice: bénis
  rationale: Dans ce contexte, l’adjectif passif désigne ceux qui reçoivent une bénédiction, et non simplement des éloges.
- source_word: ἀγαπῶντές
  choice: ceux qui t’aiment
  rationale: Le participe substantivé est rendu directement et maintient l’opposition symétrique entre haïr et aimer.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée permanente ; « pour toujours » est clair et actuel.
- source_word: ἔσονται
  choice: seront
  rationale: Le futur explicite du grec est conservé dans la seconde proposition, tandis que la première, sans verbe exprimé, demeure une déclaration nominale au présent.
theological_decisions:
- issue: Portée des déclarations de bénédiction et de malédiction envers Jérusalem/Sion, interpellée par « te »
  choice: Conserver sans atténuation le langage direct de bénédiction et de malédiction
  alternative: Affaiblir les termes pour n’exprimer que l’approbation ou la désapprobation sociales
  rationale: Les mots grecs portent une forte valeur de malédiction et de bénédiction. La traduction préserve ce poids théologique sans le réduire à un simple sentiment humain.
translation_notes:
  register: Français moderne, international et digne. L’ordre marqué « Maudits sont… ; bénis seront… » reproduit le parallélisme solennel du grec tout en restant intelligible. Le pronom féminin « te » renvoie dans le contexte à Jérusalem/Sion.
