base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: fr
  text: 'Alors Tobit écrivit une prière d’allégresse et dit : « Béni soit le Dieu vivant pour toujours. Et son règne[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec s’achève abruptement par « et son règne », sans prédicat explicite. Certaines traductions sous-entendent un prédicat, par exemple « béni soit », ou rattachent ces mots à « pour toujours ». La formulation fragmentaire est conservée ici afin de ne rien ajouter à ce que la source dit explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  choice: écrivit
  rationale: L’imparfait grec introduit ici la mise par écrit de la prière. Le passé simple convient au récit français et reste plus direct que « composa ».
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  choice: une prière d’allégresse
  rationale: Cette formulation naturelle conserve le caractère joyeux et exultant de la prière sans surinterpréter la préposition εἰς.
- source_word: Εὐλογητὸς
  choice: Béni soit
  rationale: Formule doxologique française courante, qui rend la valeur de l’adjectif grec dans une proclamation de louange.
- source_word: ὁ θεὸς ὁ ζῶν
  choice: le Dieu vivant
  rationale: Expression biblique française naturelle et fidèle à la construction attributive grecque.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent idiomatique moderne de l’expression grecque marquant une durée sans fin.
- source_word: βασιλεία
  choice: règne
  rationale: Dans cette doxologie, « règne » exprime naturellement l’exercice de la royauté divine. « Royaume » demeure possible, mais peut évoquer davantage un domaine qu’une souveraineté.
theological_decisions:
- issue: Interprétation de la proposition finale sans verbe καὶ ἡ βασιλεία αὐτοῦ
  choice: 'Conserver l’ellipse : « et son règne »'
  alternative: « et béni soit son règne » ; « et son règne dure pour toujours » ; « et son royaume »
  rationale: Le grec s’achève brusquement sans prédicat explicite. La traduction maintient cette tension au lieu d’ajouter une affirmation que le texte source ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. L’ellipse finale du grec est volontairement conservée et signalée en note.
