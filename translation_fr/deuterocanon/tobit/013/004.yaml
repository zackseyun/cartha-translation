base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: fr
  text: Là, faites connaître sa grandeur[a] et exaltez-le devant tout être vivant[b] ; car lui, il est notre Seigneur, notre Dieu et notre Père pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « montrez sa majesté ». Le verbe grec peut signifier « montrer » ou « faire connaître », et le nom peut aussi se traduire par « majesté ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant tout vivant ». L’expression est large, même si le contexte vise surtout tous les êtres humains en vie.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour tous les siècles », expression qui souligne une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Là
  rationale: Adverbe de lieu qui renvoie au cadre de l’exil parmi les nations évoqué au verset précédent, sans l’expliciter davantage.
- source_word: ὑποδείξατε
  choice: faites connaître
  rationale: L’impératif pluriel peut signifier « montrer », « indiquer » ou « faire connaître ». Ici, il s’agit de rendre publiquement manifeste la grandeur de Dieu.
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: sa grandeur
  rationale: μεγαλοσύνη désigne la grandeur ou la majesté. « Grandeur » est clair, naturel et suffisamment ample.
- source_word: ὑψοῦτε αὐτόν
  choice: exaltez-le
  rationale: Dans un contexte de louange, ὑψόω exprime l’action d’élever en honneur ; « exalter » conserve cette image et convient au registre.
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: devant tout être vivant
  rationale: Rend la formulation distributive et large du grec, littéralement « devant tout vivant », sans la limiter explicitement aux seuls humains.
- source_word: καθότι
  choice: car
  rationale: Introduit la raison des exhortations précédentes de façon concise et naturelle.
- source_word: κύριος ἡμῶν
  choice: notre Seigneur
  rationale: Rend directement le titre κύριος et le possessif grec dans le contexte confessionnel.
- source_word: καὶ θεὸς αὐτὸς πατὴρ ἡμῶν
  choice: et lui-même est Dieu, notre Père
  rationale: Conserve l’insistance de αὐτός et la juxtaposition grecque de « Dieu » et « notre Père », au lieu de lisser entièrement leur relation syntaxique.
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française idiomatique d’une durée sans fin ; la formulation littérale « pour tous les siècles » est signalée en note.
theological_decisions:
- issue: Relation entre « notre Seigneur », « Dieu » et « notre Père »
  choice: « il est notre Seigneur, et lui-même est Dieu, notre Père »
  alternative: « il est notre Seigneur, notre Dieu et notre Père »
  rationale: Le grec répète αὐτός et présente θεός puis πατὴρ ἡμῶν dans une construction resserrée. La traduction retenue garde cette insistance et une part de la tension syntaxique, sans nier que les titres se rapportent au même être.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs pluriels sont conservés. La ponctuation maintient la progression confessionnelle du grec sans imposer une reformulation doctrinale plus systématique.
