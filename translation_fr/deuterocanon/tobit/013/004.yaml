  source_fidelity: 'La première partie rend fidèlement les impératifs pluriels, l’adverbe de lieu, la grandeur divine et la portée volontairement large de « devant tout vivant ». La conclusion du projet est moins fidèle et ambiguë : « Dieu, notre Père » ne rend pas clairement l’accumulation des prédicats avec le possessif compris dans la tradition textuelle et l’audit anglais. Une coordination explicite conserve les trois titres sans trancher au-delà du grec.'
  naturalness: Le français est globalement moderne, digne et fluide. « Lui-même est Dieu, notre Père » paraît cependant raide et peut laisser entendre que seul « Père » est qualifié par « notre ». « Car lui, il est notre Seigneur, notre Dieu et notre Père » exprime naturellement l’insistance tout en évitant cette ambiguïté.
  terminology: « Seigneur », « grandeur », « exaltez-le » et « pour toujours » sont appropriés au registre et aux termes grecs. « Notre Dieu et notre Père » maintient les titres théologiques sans ajout interprétatif.
