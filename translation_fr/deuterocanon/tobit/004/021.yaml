base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: fr
  text: Et n’aie pas peur, mon enfant, parce que nous sommes devenus pauvres. Tu as beaucoup[a], si tu crains Dieu, te détournes de tout péché et fais ce qui est agréable à ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup est à ta disposition ». L’expression grecque peut désigner ce que l’on possède ou ce qui est disponible pour quelqu’un.
    reason: Alternative lexicale préservant l’étendue sémantique de ὑπάρχει σοι.
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: n’aie pas peur
  rationale: Cette défense à l’impératif est rendue par une expression naturelle en français moderne, sans affaiblir la force de l’exhortation.
- source_word: παιδίον
  choice: mon enfant
  rationale: Le vocatif exprime une adresse familiale et affectueuse. En français, « mon enfant » est la formulation naturelle dans ce contexte, même si le possessif n’est pas exprimé séparément en grec.
- source_word: ἐπτωχεύσαμεν
  choice: nous sommes devenus pauvres
  rationale: L’aoriste de πτωχεύω évoque l’entrée dans un état de pauvreté, et non la simple description d’une situation stable.
- source_word: ὑπάρχει σοι πολλὰ
  choice: tu as beaucoup
  rationale: Cette tournure peut exprimer la possession ou ce qui est disponible pour quelqu’un. « Tu as beaucoup » reste concise et conserve l’indétermination de la nature de ce bien.
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: si tu crains Dieu
  rationale: « Craindre Dieu » conserve le poids traditionnel et théologique de l’expression, qui implique une crainte révérencielle.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: te détournes de tout péché
  rationale: La formulation rend naturellement l’idée de s’éloigner volontairement de toute forme de péché.
- source_word: ποιήσῃς τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: fais ce qui est agréable à ses yeux
  rationale: Cette expression française naturelle réunit l’idée de faire ce qui plaît à Dieu et celle d’agir sous son regard.
theological_decisions:
- issue: Le sens de « tu as beaucoup » dans un contexte de pauvreté
  choice: Conserver une affirmation large concernant ce que le fils possède ou ce qui lui est disponible dans une vie marquée par la crainte de Dieu et l’éloignement du péché.
  alternative: Y voir soit la promesse précise d’une abondance matérielle, soit une référence exclusivement morale ou spirituelle.
  rationale: Le grec ne précise pas la nature de ce « beaucoup ». La traduction évite donc aussi bien d’en faire une garantie de prospérité matérielle que de le spiritualiser entièrement.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe conditionnelle française place sous le même « si » les trois actions coordonnées : craindre Dieu, se détourner du péché et faire ce qui lui est agréable.'
