base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: fr
  text: 'Il se dit[a] : « J’ai demandé la mort ; pourquoi n’appellerais-je pas Tobie, mon fils, afin de lui donner des instructions avant de mourir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition sémitique parallèle développe cette pensée : Tobit appelle Tobie afin de l’informer, avant sa mort, au sujet de l’argent déposé auprès de Gabaël.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: Il se dit en lui-même
  rationale: Cette formulation conserve l’image grecque d’une parole intérieure tout en restant claire en français moderne ; « il pensa » serait plus fluide, mais moins formellement proche.
- source_word: ᾐτησάμην θάνατον
  choice: J’ai demandé la mort
  rationale: Le passé composé renvoie à la demande antérieure de Tobit et en souligne la pertinence présente. Le verbe signifie « demander » ; traduire par « prier pour mourir » expliciterait davantage que le grec.
- source_word: τί οὐ καλῶ
  choice: pourquoi n’appellerais-je pas
  rationale: Le conditionnel rend naturellement en français la question délibérative par laquelle Tobit envisage puis adopte une ligne de conduite.
- source_word: Τωβείαν τὸν υἱόν μου
  choice: Tobie, mon fils
  rationale: « Tobie » est la forme française courante du nom. L’apposition détachée est idiomatique et respecte le lien explicite de filiation.
- source_word: ὑποδείξω
  choice: lui donner mes instructions
  rationale: Dans ce contexte testamentaire, le verbe désigne le fait d’indiquer à son fils ce qu’il doit savoir ou faire. Cette traduction garde une portée générale sans introduire dans le texte grec la mention précise de l’argent présente dans la tradition parallèle.
- source_word: πρὶν ἀποθανεῖν με
  choice: avant de mourir
  rationale: Formulation française simple et naturelle de la proposition temporelle grecque, avec le même sujet que le verbe principal.
theological_decisions:
- issue: Influence de la tradition sémitique parallèle sur le sens de ὑποδείξω
  choice: Conserver dans le texte principal l’idée générale de donner des instructions avant la mort.
  alternative: 'Préciser : « afin de lui parler de l’argent avant de mourir ».'
  rationale: Le témoin grec de référence ne précise pas le contenu des instructions. La tradition sémitique parallèle éclaire le contexte, mais son développement au sujet du dépôt confié à Gabaël ne doit pas être introduit silencieusement dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « se dit en lui-même » garde la texture de l’expression grecque, tandis que « donner mes instructions » exprime naturellement la portée contextuelle de ὑποδείξω sans surinterprétation.
