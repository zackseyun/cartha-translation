  yaml_path: translation/deuterocanon/tobit/004/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a].
translation:
  language: fr
  text: Et maintenant, je te fais connaître les dix talents d’argent que j’ai déposés chez Gabaël, fils de Gabrias, à Ragès, en Médie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te montre » ou « je t’indique » ; le verbe grec peut signifier montrer, signaler ou faire connaître, sans impliquer que l’argent soit matériellement présenté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: je te fais connaître
  rationale: Dans ce contexte, le verbe indique que Tobit révèle ou signale à son fils l’existence de la somme, plutôt qu’il ne lui montre matériellement l’argent. « Faire connaître » rend naturellement cette valeur en français.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: les dix talents d’argent
  rationale: Cette formulation conserve le montant, le métal et l’unité ancienne sans conversion moderne.
- source_word: παρεθέμην
  choice: j’ai déposés chez
  rationale: Le moyen grec désigne ici une somme confiée à quelqu’un pour être gardée. « Déposer chez » exprime clairement ce rapport personnel sans suggérer nécessairement une institution bancaire.
- source_word: Γαβαήλῳ
  choice: Gabaël
  rationale: Le nom propre est translittéré d’après la forme grecque et reçoit le tréma usuel en français pour distinguer les voyelles.
- source_word: τῷ τοῦ Γαβρεία
  choice: fils de Gabrias
  rationale: La construction grecque identifie Gabaël par son père; le mot « fils » doit être explicité en français.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: à Ragès, en Médie
  rationale: Cette tournure française naturelle conserve le nom antique de la ville et situe celle-ci dans la Médie.
