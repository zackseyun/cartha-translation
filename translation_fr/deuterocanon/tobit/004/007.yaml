  naturalness: La révision propose une syntaxe française moderne et fluide, tout en conservant le registre parental, sobre et exhortatif. « Ne donne pas à regret » est l'équivalent naturel de l'idiome grec dans ce contexte; la note conserve l'image littérale de l’œil.
