base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: fr
  text: Avec ce que tu possèdes, fais l’aumône. Ne donne pas à regret lorsque tu fais l’aumône.[a] Ne détourne pas ton visage de toute personne pauvre,[b] et le visage de Dieu ne se détournera certainement pas de toi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que ton œil ne soit pas envieux ». Cette expression évoque ici le fait de donner à regret, avec mesquinerie ou mauvaise grâce.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie un masculin singulier à valeur générique et distributive : « de tout pauvre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et la présence de Dieu ne se détournera pas de toi ». Le grec dit littéralement « le visage de Dieu », en écho à « ton visage » dans la proposition précédente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: Avec ce que tu possèdes
  rationale: La formule désigne les biens ou moyens dont on dispose. Cette traduction est naturelle en français moderne et conserve l’idée de donner à partir de ses ressources réelles.
- source_word: ποίει ἐλεημοσύνην
  choice: fais l’aumône
  rationale: Dans ce contexte, ἐλεημοσύνη désigne l’aide matérielle concrète accordée aux nécessiteux. « Faire l’aumône » est idiomatique et permet de conserver la répétition grecque.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: Que ton regard ne soit pas réticent
  rationale: Le grec emploie l’image de l’œil pour évoquer une disposition réticente, mesquine ou chagrine au moment de donner. « Regard » préserve l’image corporelle tout en restant compréhensible.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: lorsque tu fais l’aumône
  rationale: La construction infinitive a ici une valeur temporelle; cette formulation la rend simplement et naturellement.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: Ne détourne ton visage
  rationale: Le maintien de « visage » préserve le parallélisme délibéré avec « le visage de Dieu » dans la proposition suivante.
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: d’aucun pauvre
  rationale: Le masculin singulier grec a une portée distributive et générique. En français, le substantif « pauvre » conserve cette forme sans limiter nécessairement le propos aux hommes.
- source_word: οὐ μὴ ἀποστραφῇ
  choice: ne se détournera certainement pas
  rationale: La tournure οὐ μή exprime une négation renforcée. « Certainement pas » rend cette intensité, tandis que la forme pronominale respecte le parallélisme du détournement.
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: le visage de Dieu
  rationale: La traduction littérale maintient la reprise de πρόσωπον et la réciprocité rhétorique entre le visage humain et celui de Dieu.
theological_decisions:
- issue: Langage anthropomorphique concernant Dieu
  choice: le visage de Dieu
  alternative: la présence de Dieu
  rationale: Le grec emploie πρόσωπον dans les deux propositions. Garder « visage » préserve la symétrie littéraire et la tension théologique sans expliquer l’image à la place du texte.
- issue: Portée du masculin singulier πτωχοῦ
  choice: d’aucun pauvre
  alternative: d’aucune personne pauvre
  rationale: Le masculin singulier est distributif et générique. « Aucun pauvre » suit de près la forme source et demeure naturel en français, sans imposer une restriction sexuelle absente du contexte.
- issue: Force de la promesse exprimée par οὐ μή
  choice: ne se détournera certainement pas
  alternative: ne se détournera pas
  rationale: L’ajout de « certainement » rend la négation grecque renforcée sans transformer la promesse en paraphrase doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse paternelle au fils. La répétition de « faire l’aumône » et le double emploi de « visage » reproduisent les principaux effets rhétoriques du grec.
