base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: fr
  text: Et maintenant, mon enfant, aime tes frères. Ne t’élève pas dans ton cœur au-dessus de tes frères ni des fils et des filles de ton peuple, de manière à prendre parmi eux une femme pour toi[a]. Car l’orgueil mène à la ruine et à beaucoup de désordre, et l’oisiveté, à l’appauvrissement et à un grand dénuement[b] ; l’oisiveté est en effet la mère de la famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Ne sois pas hautain envers tes frères ni envers les fils et les filles de ton peuple lorsque tu prends parmi eux une femme pour toi. » La syntaxe grecque est resserrée, et le rapport entre l’avertissement contre l’orgueil et la clause concernant le mariage reste ambigu.'
    reason: alternative_reading
  - marker: b
    text: Le mot grec peut aussi être rendu par « paresse » ou, plus littéralement mais moins probablement ici, par « inutilité ». La mention de l’appauvrissement, du dénuement et de la famine favorise le sens d’une inactivité improductive.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: mon enfant
  rationale: Interpellation familiale et affectueuse naturelle en français. Le possessif, idiomatique dans cette adresse parentale, n’ajoute pas ici de contenu doctrinal.
- source_word: ἀγάπα
  choice: aime
  rationale: Impératif direct qui conserve la simplicité et la force de ἀγαπάω.
- source_word: ἀδελφούς
  choice: frères
  rationale: Respecte le masculin pluriel grec, tandis que la suite mentionne explicitement les fils et les filles du peuple.
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: ne t’élève pas dans ton cœur au-dessus de
  rationale: Rend l’exaltation orgueilleuse exprimée par le verbe tout en conservant l’image anthropologique du cœur et la relation marquée par ἀπό.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: de manière à prendre parmi eux une femme pour toi
  rationale: Conserve l’infinitif grec et son lien syntaxique ambigu avec l’avertissement précédent, sans remplacer entièrement l’idiome par « épouser ».
- source_word: ἀπώλεια
  choice: ruine
  rationale: Exprime l’issue désastreuse dans ce contexte sapientiel sans lui imposer une portée eschatologique.
- source_word: ἀκαταστασία πολλή
  choice: beaucoup de désordre
  rationale: Formulation ample qui peut couvrir le bouleversement pratique et social.
- source_word: ἀχρειότης
  choice: oisiveté
  rationale: Le dénuement et la famine orientent ici vers l’inactivité improductive plutôt que vers la simple inutilité abstraite.
- source_word: ἐλάττωσις
  choice: appauvrissement
  rationale: Traduit l’idée de diminution dans le contexte économique créé par le dénuement et la famine.
- source_word: ἔνδεια μεγάλη
  choice: un grand dénuement
  rationale: Rend fortement l’idée de manque et de privation dans un registre digne et actuel.
theological_decisions:
- issue: Rapport entre l’avertissement contre l’orgueil et la clause sur le mariage
  choice: La traduction maintient le lien entre l’orgueil envers les siens et le fait de prendre une femme parmi eux, sans préciser davantage la relation logique.
  alternative: Comprendre le passage comme un commandement direct d’épouser une femme de son propre peuple, ou comme une mise en garde contre l’arrogance au moment d’en choisir une.
  rationale: La syntaxe grecque est resserrée et permet plusieurs articulations. Une note expose cette ambiguïté au lieu de la résoudre selon une doctrine particulière.
translation_notes:
  register: Français international moderne, naturel et digne, avec une tonalité sapientielle. La ponctuation clarifie les propositions sans effacer l’ambiguïté de la construction grecque ; les termes « ruine », « dénuement » et « famine » conservent la gravité proverbiale du verset.
