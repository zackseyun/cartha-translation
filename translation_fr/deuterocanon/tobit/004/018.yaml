  text: Seek counsel from every wise man, and do not despise any useful advice.
translation:
  language: fr
  text: Demande conseil à toute personne avisée, et ne méprise aucun conseil utile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout conseil utile ». Le grec reprend ici le même mot traduit par « conseil » au début du verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  choice: conseil
  rationale: Le nom désigne un avis ou un conseil que l’on reçoit; « conseil » convient naturellement comme complément de « demander » et conserve l’idée d’une orientation réfléchie.
- source_word: παρὰ παντὸς φρονίμου
  choice: à toute personne avisée
  rationale: παρά avec le génitif indique la source. φρόνιμος désigne quelqu’un d’avisé, prudent ou sensé; la formulation française exprime naturellement la portée générale du masculin grec substantivé.
- source_word: ζήτησον
  choice: demande
  rationale: Dans ce contexte, ζητέω appelle à rechercher activement un conseil. « Demande conseil » est une tournure française directe et idiomatique qui conserve la force de l’impératif.
- source_word: μὴ καταφρονήσῃς
  choice: ne méprise
  rationale: καταφρονέω signifie traiter avec mépris ou dédain. « Ne méprise » maintient la vigueur morale de l’avertissement, plutôt que de l’affaiblir en « ne néglige pas ».
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: aucun conseil utile
  rationale: Sous la négation, « aucun » rend naturellement la portée distributive de πάσης. χρησίμης qualifie le conseil d’utile ou de profitable.
theological_decisions: []
