  text: For you are storing up a good treasure for yourself for a day of need[a].
translation:
  language: fr
  text: Car tu amasses pour toi un bon trésor en vue d’un jour de détresse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le jour du besoin », « pour un temps de détresse » ou « pour un jour d’épreuve ». L’expression grecque est large et peut désigner un besoin pressant ou une situation difficile.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: trésor
  rationale: Le nom désigne ce qui est mis en réserve. « Trésor » convient naturellement avec θησαυρίζεις et maintient l’image de l’accumulation sans lui donner un sens strictement financier.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve la valeur explicative du lien avec l’exhortation précédente dans un registre digne et courant.
- source_word: ἀγαθὸν
  choice: bon
  rationale: L’adjectif qualifie simplement et largement ce qui est mis en réserve, sans réduire son sens à la valeur monétaire.
- source_word: θησαυρίζεις
  choice: tu amasses
  rationale: Le verbe exprime l’action de mettre en réserve ou d’accumuler un trésor. « Tu amasses » est naturel en français et garde la métaphore active ainsi que le présent.
- source_word: σεαυτῷ
  choice: pour toi
  rationale: Le datif réfléchi marque le bénéficiaire de l’action. « Pour toi » est direct et idiomatique.
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: en vue d’un jour de détresse
  rationale: La formule peut évoquer un besoin pressant, une épreuve ou une situation difficile. « En vue d’un jour de détresse » préserve cette ampleur et rend clairement l’orientation vers une circonstance future.
theological_decisions:
- issue: Portée métaphorique du trésor amassé par l’aumône
  choice: Conserver l’image d’un trésor amassé sans préciser le mécanisme théologique.
  alternative: Parler explicitement d’un mérite acquis ou d’une récompense céleste, ou limiter le sens à une provision matérielle pour une difficulté future.
  rationale: Le grec affirme qu’un bon trésor est mis en réserve pour un jour de détresse, mais n’explicite ni sa nature ni le mécanisme de sa valeur future. La traduction maintient donc la tension du texte sans imposer une doctrine.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse personnelle du contexte. « Amasses » évite une tournure artificielle comme « thésaurises », tandis que la note conserve l’étendue sémantique de ἀνάγκη.
