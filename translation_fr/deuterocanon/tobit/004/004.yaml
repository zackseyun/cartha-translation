base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: fr
  text: Fais ce qui lui plaît et ne lui cause pas de chagrin. Souviens-toi, mon enfant, qu’elle a affronté bien des dangers à cause de toi lorsqu’elle te portait dans son ventre[a]. Quand elle mourra, enterre-la auprès de moi, dans la même tombe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle a vu bien des dangers à cause de toi dans le ventre »; il s’agit des dangers qu’elle a connus en te portant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans une seule tombe ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: Fais ce qui lui plaît
  rationale: Cette formulation rend directement ce qui est agréable à la mère, dans un français naturel et actuel.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: ne lui cause pas de chagrin
  rationale: λυπέω désigne le fait d’attrister ou de causer de la peine. Cette expression conserve le poids affectif de l’exhortation sans employer le potentiellement ambigu « ne l’afflige pas ».
- source_word: μνήσθητι, παιδίον
  choice: Souviens-toi, mon enfant
  rationale: παιδίον est ici une adresse affectueuse. En français, « mon enfant » est la forme vocative naturelle; le possessif relève de l’usage idiomatique et non d’une précision doctrinale ajoutée.
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: elle a affronté bien des dangers
  rationale: Littéralement, elle « a vu » beaucoup de dangers; dans ce contexte, l’expression signifie qu’elle les a connus ou affrontés. « Bien des dangers » restitue naturellement πολλούς.
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: à cause de toi lorsqu’elle te portait dans son ventre
  rationale: ἐπὶ σοὶ indique ici que les dangers étaient liés à l’enfant, tandis que ἐν τῇ κοιλίᾳ renvoie à la période où la mère le portait. La formulation explicite ce rapport sans déplacer la responsabilité vers une faute de l’enfant.
- source_word: ὅταν ἀποθάνῃ
  choice: Quand elle mourra
  rationale: ὅταν avec le subjonctif exprime ici un événement futur attendu; le futur français est naturel dans cette instruction.
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: enterre-la auprès de moi
  rationale: παρά avec le datif exprime la proximité. « Auprès de moi » convient au contexte funéraire et reste digne.
- source_word: ἐν ἑνὶ τάφῳ
  choice: dans la même tombe
  rationale: Littéralement « dans une seule tombe », l’expression demande que les deux défunts partagent le même lieu d’inhumation. « Dans la même tombe » est la formulation française la plus claire.
theological_decisions:
- issue: Adresse familiale παιδίον
  choice: mon enfant
  alternative: enfant; mon petit
  rationale: Le grec n’exprime pas formellement le possessif, mais le vocatif français appelle naturellement « mon enfant ». Cette option conserve la tendresse sans préciser le sexe par « mon fils ».
- issue: Valeur idiomatique de « voir beaucoup de dangers »
  choice: elle a affronté bien des dangers
  alternative: elle a vu bien des dangers; elle a connu bien des dangers
  rationale: La traduction retenue communique l’expérience réelle des périls maternels tout en signalant en note l’image littérale du grec; elle n’ajoute aucune interprétation doctrinale.
- issue: Portée de ἐν ἑνὶ τάφῳ
  choice: dans la même tombe
  alternative: dans une seule tombe
  rationale: Les deux formulations expriment une sépulture commune. « La même tombe » est plus idiomatique en français, tandis que la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif au tutoiement correspond au discours intime d’un père à son enfant. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
