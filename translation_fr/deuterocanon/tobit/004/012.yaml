base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: fr
  text: 'Garde-toi, mon enfant, de toute immoralité sexuelle. Prends d’abord une femme issue de la descendance de tes pères. Ne prends pas une femme étrangère qui ne soit pas de la tribu de ton père, car nous sommes fils des prophètes[a]. Souviens-toi, mon enfant, de Noé, d’Abraham, d’Isaac et de Jacob, nos pères depuis les temps anciens : tous ont pris femme parmi leurs frères[b], ils ont été bénis dans leurs enfants, et leur descendance héritera du pays[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous descendons des prophètes ». Le grec dit littéralement : « nous sommes fils des prophètes ».'
    reason: alternative_reading
  - marker: b
    text: Ici, « frères » désigne les membres de leur parenté ou de leur clan, non leurs frères au sens littéral.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « héritera d’une terre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: Veille sur toi-même
  rationale: Cette tournure française naturelle conserve l’idée de vigilance personnelle et la force réfléchie de l’expression grecque.
- source_word: παιδίον
  choice: mon enfant
  rationale: Dans cette adresse paternelle, « mon enfant » rend naturellement la tendresse du diminutif grec; le possessif, idiomatique en français, explicite la relation déjà donnée par le contexte.
- source_word: ἀπὸ πάσης πορνείας
  choice: pour te garder de toute immoralité sexuelle
  rationale: Après « veille sur toi-même », cette formulation évite une construction française maladroite tout en conservant l’étendue morale de πορνεία.
- source_word: γυναῖκα πρῶτον λάβε
  choice: Avant tout, prends une femme
  rationale: « Prendre une femme » conserve l’expression matrimoniale du grec, tandis que « avant tout » rend l’accent de πρῶτον sans imposer une chronologie artificielle.
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: parmi les descendants de tes pères
  rationale: Dans ce contexte généalogique, σπέρμα désigne la lignée ou la descendance; « descendants » est actuel et intelligible.
- source_word: γυναῖκα ἀλλοτρίαν
  choice: une femme étrangère
  rationale: La traduction garde l’altérité exprimée par ἀλλοτρίαν; une note précise qu’il s’agit ici de l’appartenance familiale et tribale.
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: nous sommes fils des prophètes
  rationale: La formulation inhabituelle du grec est conservée afin de ne pas résoudre silencieusement son rapport à la liste des patriarches; la note indique le sens généalogique possible.
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: depuis les temps anciens
  rationale: Cette expression française digne et claire attribue aux pères mentionnés une ancienneté reculée sans employer une tournure archaïque.
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: parmi leurs frères
  rationale: Le terme grec « frères » est conservé formellement; une note explique son sens collectif de parenté ou de clan dans ce contexte matrimonial.
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: ils ont été bénis dans leurs enfants
  rationale: Cette traduction maintient l’ambiguïté de ἐν, qui peut indiquer la sphère, le moyen ou la manifestation de la bénédiction.
- source_word: κληρονομήσει γῆν
  choice: héritera du pays
  rationale: Dans ce cadre ancestral, γῆ évoque naturellement le pays promis; l’absence d’article en grec permet toutefois aussi « une terre », signalé en note.
theological_decisions:
- issue: Sens de « nous sommes fils des prophètes » dans une liste de patriarches
  choice: Conserver « nous sommes fils des prophètes » dans le texte
  alternative: « nous descendons des prophètes »
  rationale: Le grec est distinctif et théologiquement tendu puisque Noé, Abraham, Isaac et Jacob suivent immédiatement. La traduction principale en garde la forme, tandis que la note présente le sens généalogique possible sans l’imposer.
- issue: Langage de parenté dans l’instruction matrimoniale
  choice: Conserver « parmi leurs frères » avec une note explicative
  alternative: « parmi leurs proches » ou « dans leur parenté »
  rationale: Le grec emploie explicitement ἀδελφοί. Dans le contexte, il ne peut désigner des frères au sens littéral comme conjointes, mais le groupe familial ou clanique; la note préserve les deux niveaux.
- issue: Portée de γῆ
  choice: Traduire « le pays » et signaler l’alternative
  alternative: « une terre » ou « la terre »
  rationale: L’arrière-plan des patriarches favorise le pays promis, mais le grec anarthre γῆ demeure susceptible d’une lecture moins déterminée. Une note conserve cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les expressions généalogiques marquées du grec (« fils des prophètes », « parmi leurs frères ») tout en les éclairant par des notes. La ponctuation organise la longue phrase grecque sans en modifier la progression argumentative.
