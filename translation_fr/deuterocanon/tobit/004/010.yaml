  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: fr
  text: Car l’aumône délivre de la mort et ne laissera pas entrer dans les ténèbres[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dons faits aux pauvres » ou « les œuvres de miséricorde » ; le grec désigne ici concrètement l’aide donnée aux personnes dans le besoin.
    reason: lexical_alternative
  - marker: b
    text: « Les ténèbres » évoquent probablement le domaine de la mort ou une profonde obscurité ; le grec conserve une image concise dont la portée reste ouverte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: l’aumône
  rationale: Dans l’usage juif hellénistique et dans ce contexte, le nom désigne concrètement l’aide matérielle donnée aux personnes dans le besoin. « L’aumône » conserve ce sens précis, plutôt que la seule disposition intérieure de miséricorde.
- source_word: ἐκ θανάτου
  choice: de la mort
  rationale: La préposition ἐκ marque l’arrachement ou la délivrance hors de la mort. « Délivre de la mort » est naturel en français et reste proche de la construction grecque.
- source_word: ῥύεται
  choice: délivre
  rationale: Le verbe exprime le fait d’arracher à un danger ou d’en délivrer. « Délivre » convient au registre biblique sans transformer l’énoncé en formulation doctrinale plus large.
- source_word: οὐκ ἐάσει
  choice: ne laissera pas
  rationale: Le futur de ἐάω exprime ici l’empêchement ou le refus de permettre. « Ne laissera pas » rend clairement le futur et demeure naturel en français moderne.
- source_word: εἰσελθεῖν
  choice: entrer
  rationale: L’infinitif signifie simplement « entrer ». Le sujet indéfini implicite se rend naturellement en français sans ajouter « quelqu’un ».
- source_word: εἰς τὸ σκότος
  choice: dans les ténèbres
  rationale: « Les ténèbres » est l’expression française idiomatique et digne correspondant à l’image définie du grec, tout en laissant ouverte sa portée exacte.
theological_decisions:
- issue: La possibilité que l’énoncé soit compris comme affirmant que l’aumône mérite le salut
  choice: Conserver sans atténuation l’affirmation directe selon laquelle l’aumône délivre de la mort.
  alternative: Limiter « la mort » à un danger temporel, ou traduire par « peut délivrer de la mort ».
  rationale: Le grec formule une déclaration catégorique. La traduction ne doit ni l’affaiblir ni lui imposer une harmonisation doctrinale ultérieure.
- issue: La référence exacte des « ténèbres »
  choice: Maintenir l’image concise « les ténèbres » sans en préciser le référent dans le texte.
  alternative: Expliciter « le séjour des morts », « la mort » ou « les ténèbres du jugement ».
  rationale: Le grec laisse l’image ouverte; elle peut évoquer le domaine de la mort, une profonde obscurité ou une dimension eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. « L’aumône » garde le sens concret du grec; « ne laissera pas entrer » évite un pronom indéfini lourd tout en conservant la portée générale de l’énoncé. Les marqueurs [a] et [b] sont placés immédiatement après l’expression qu’ils éclairent.
