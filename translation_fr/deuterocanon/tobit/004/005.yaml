base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: fr
  text: Tous les jours, mon enfant, souviens-toi du Seigneur notre Dieu. Ne souhaite pas transgresser ses commandements. Pratique la justice[a] tous les jours de ta vie et ne marche pas dans les voies de l’injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pratique la droiture […] ne marche pas dans les voies de l’injustice ». Les termes grecs peuvent évoquer à la fois la droiture personnelle et la justice envers autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Tous les jours
  rationale: Rend naturellement la durée continue exprimée par le grec et conserve la répétition avec « tous les jours de ta vie ».
- source_word: παιδίον
  choice: mon enfant
  rationale: Le vocatif affectueux désigne ici l’enfant auquel le père s’adresse. En français, « mon enfant » est la formule d’adresse naturelle; le possessif est idiomatique plutôt qu’une addition de contenu.
- source_word: μνημόνευε
  choice: souviens-toi
  rationale: L’impératif présent appelle une attention durable et fidèle. « Souviens-toi » garde la formulation directe et sa portée religieuse et éthique.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: du Seigneur notre Dieu
  rationale: Formulation française naturelle qui conserve le titre révérenciel et le possessif pluriel du grec.
- source_word: μὴ θελήσῃς παραβῆναι
  choice: Ne consens pas à transgresser
  rationale: « Consentir à » exprime la volonté impliquée par θελήσῃς sans suggérer un simple désir affectif; « transgresser » rend explicitement παραβῆναι.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ses commandements
  rationale: « Commandements » convient au registre religieux et éthique et reste courant en français biblique moderne.
- source_word: δικαιοσύνην ποίει
  choice: Pratique la justice
  rationale: L’expression grecque signifie littéralement « fais la justice ». « Pratique la justice » exprime une conduite habituelle et permet de conserver l’opposition lexicale avec ἀδικία; la note signale la portée également morale de δικαιοσύνη.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: tous les jours de ta vie
  rationale: Rendu idiomatique et proche du grec, qui maintient l’insistance temporelle.
- source_word: μὴ πορευθῇς
  choice: ne marche pas
  rationale: Conserve la métaphore biblique de la marche comme manière de vivre et s’accorde avec « voies ».
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: dans les voies de l’injustice
  rationale: Préserve le pluriel métaphorique et l’opposition δικαιοσύνη / ἀδικία.
theological_decisions:
- issue: Traduction de l’opposition δικαιοσύνη / ἀδικία
  choice: justice / injustice
  alternative: droiture / injustice; ce qui est juste / ce qui est injuste
  rationale: En français, « justice / injustice » conserve clairement l’opposition lexicale et peut englober les dimensions personnelles et sociales. Toutefois, δικαιοσύνη possède aussi une portée morale et religieuse plus large; celle-ci est explicitée en note sans réduire le texte à une seule dimension.
- issue: Portée de l’interdiction μὴ θελήσῃς παραβῆναι
  choice: Ne consens pas à transgresser
  alternative: Ne cherche pas à transgresser; ne veuille pas transgresser
  rationale: Le grec vise expressément la volonté engagée dans la désobéissance. Le rendu choisi préserve cette tension sans transformer l’énoncé en simple interdiction de l’acte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les impératifs, la répétition temporelle et la métaphore de la marche. « Mon enfant » est une adresse française naturelle et affectueuse; « Ne consens pas » maintient la composante volontaire du grec.
