translation:
  language: fr
  text: Répands ton pain sur la tombe des justes[a], et n’en donne pas aux pécheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auprès de la tombe des justes ». L’expression peut évoquer un geste de charité accompli lors de funérailles ou en mémoire des morts, mais le grec est conservé littéralement ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχεον
  choice: Répands
  rationale: L’impératif conserve l’image concrète de « verser » ou « répandre », sans la remplacer par une interprétation générale comme « donne généreusement ».
- source_word: τοὺς ἄρτους σου
  choice: tes pains
  rationale: Le pluriel grec désigne concrètement des pains. Le français permet ce pluriel naturel et préserve ainsi l’image matérielle du texte.
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: sur la tombe des justes
  rationale: Cette traduction suit directement la construction spatiale grecque. L’expression étant inhabituelle et son arrière-plan culturel incertain, elle n’est pas paraphrasée dans le texte principal.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: « Les justes » est l’équivalent biblique français naturel de δικαίων et garde sa portée morale et religieuse.
- source_word: καὶ μὴ δῷς
  choice: et n’en donne pas
  rationale: « Et » rend directement καί. Le pronom « en » reprend naturellement les pains en français tout en conservant la brièveté de l’interdiction.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: aux pécheurs
  rationale: « Pécheurs » est l’équivalent courant et théologiquement transparent de ἁμαρτωλοῖς.
theological_decisions:
- issue: Interprétation de l’instruction funéraire
  choice: Conserver dans le texte principal l’image littérale de pains répandus « sur la tombe des justes ».
  alternative: « auprès de la tombe des justes » ou une paraphrase évoquant un repas funéraire ou une aumône commémorative
  rationale: Le grec est concret mais l’usage visé demeure incertain. La traduction ne tranche donc pas entre les différentes pratiques funéraires ou commémoratives possibles.
- issue: Portée de l’interdiction concernant les pécheurs
  choice: Rendre l’objet implicite par « en », qui renvoie aux pains.
  alternative: « et ne donne rien aux pécheurs »
  rationale: Le grec omet l’objet dans la seconde proposition. En français, « en » maintient clairement le lien avec les pains sans élargir l’interdiction au-delà du contexte immédiat.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse personnelle du contexte. « Répands » maintient l’image forte du grec; « tes pains » conserve son pluriel concret.
