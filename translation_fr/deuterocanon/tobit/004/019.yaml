base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: fr
  text: En tout temps, bénis le Seigneur Dieu et demande-lui que tes chemins deviennent droits et que tous tes sentiers et tes projets prospèrent.[a] Car aucune nation n’a de conseil ;[b] c’est le Seigneur lui-même qui donne tous les biens, et il abaisse qui il veut, comme il le veut. Et maintenant, mon enfant, souviens-toi de mes commandements et qu’ils ne soient pas effacés de ton cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que tous tes sentiers et tes desseins prospèrent ». Le grec βουλαί peut désigner des projets, des desseins ou des conseils.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aucune nation n’a de conseil ». La formulation grecque est abrupte; elle peut évoquer l’absence, chez les peuples, d’un conseil ultime, par contraste avec le Seigneur qui donne les biens et abaisse qui il veut.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: En tout temps
  rationale: Expression française naturelle qui conserve la portée temporelle générale du grec.
- source_word: εὐλόγει
  choice: bénis
  rationale: Rend directement le verbe grec et maintient l’idiome biblique.
- source_word: Κύριον τὸν Θεόν
  choice: le Seigneur Dieu
  rationale: Reproduit les deux titres sans ajouter le possessif « ton », absent du grec.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: demande-lui
  rationale: Formulation française idiomatique qui indique clairement que la demande est adressée à Dieu.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: de rendre droits tes chemins
  rationale: Conserve l’image des chemins droits tout en exprimant naturellement l’action divine demandée.
- source_word: τρίβοι
  choice: sentiers
  rationale: Préserve l’image concrète et le parallélisme avec « chemins ».
- source_word: βουλαὶ
  choice: projets
  rationale: Dans la première occurrence, le mot désigne naturellement les desseins ou projets pratiques d’une personne.
- source_word: εὐοδωθῶσιν
  choice: faire réussir
  rationale: Exprime clairement l’issue favorable visée par le verbe dans un français actuel.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: aucune nation ne possède la sagesse nécessaire pour décider par elle-même
  rationale: Rend intelligible la proposition grecque abrupte tout en maintenant son contraste entre l’insuffisance du conseil humain et l’action souveraine du Seigneur.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: donne tous les biens
  rationale: Traduction directe qui conserve la totalité exprimée par πάντα.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: il abaisse qui il veut
  rationale: Interprète le relatif comme personnel, lecture cohérente dans le contexte, sans atténuer l’affirmation de souveraineté divine.
- source_word: παιδίον
  choice: mon enfant
  rationale: Rend l’adresse affectueuse dans un français naturel ; « mon » est implicite dans la relation du locuteur à son fils.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: qu’ils ne soient pas effacés de ton cœur
  rationale: Préserve la métaphore forte de l’effacement ainsi que la référence au cœur.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre français biblique naturel ici et désigne Dieu dans le contexte.
- issue: Souveraineté divine dans πᾶν ἔθνος οὐκ ἔχει βουλήν ... ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: Maintenir le contraste entre l’insuffisance décisionnelle des nations et le Seigneur qui donne les biens et abaisse qui il veut.
  alternative: Atténuer en disant seulement que le jugement humain est faillible.
  rationale: Le grec formule une affirmation forte. La traduction en conserve la tension sans y ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores bibliques des chemins droits, des sentiers et de l’effacement du cœur sont conservées. La proposition grecque abrupte sur les nations est explicitée avec prudence dans le texte et documentée en note.
