lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve la référence définie du grec.
- source_word: ἐμνήσθη
  choice: se souvint
  rationale: Le verbe grec exprime ici le fait de se rappeler; le passé simple convient au registre narratif digne.
- source_word: περὶ τοῦ ἀργυρίου
  choice: de l’argent
  rationale: ἀργύριον désigne littéralement l’argent métal, mais couramment aussi une somme monétaire; « l’argent » conserve en français cette double portée sans lourdeur.
- source_word: ὃ παρέθετο
  choice: qu’il avait confié
  rationale: Le verbe παρατίθημι indique ici qu’une somme a été remise à la garde d’une personne; « confié » restitue cette relation sans imposer le cadre bancaire moderne suggéré par « déposé ».
- source_word: Γαβαήλῳ
  choice: à Gabaël
  rationale: Translittération française claire de la forme grecque du nom propre, avec le datif rendu par « à ».
- source_word: ἐν Ῥάγοις τῆς Μηδίας
  choice: à Raguès en Médie
  rationale: La préposition « à » convient à une ville; « en Médie » indique naturellement la région. « Raguès » donne en français une prononciation proche de la forme grecque Ῥάγοις.
