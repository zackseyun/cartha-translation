  text: For almsgiving is a good gift for all who do it before the Most High[a].
translation:
  language: fr
  text: Car l’aumône est un beau don pour tous ceux qui la pratiquent devant le Très-Haut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bonne offrande » ; le mot grec peut désigner un don en général et, dans certains contextes, une offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῶρον
  choice: don
  rationale: Le nom grec désigne couramment un don et peut, selon le contexte, désigner une offrande. « Don » conserve ici le sens général sans imposer une nuance cultuelle.
- source_word: ἀγαθόν
  choice: précieux
  rationale: Dans l’expression française « un don précieux », ce choix exprime naturellement la valeur positive portée par ἀγαθόν, plutôt que la qualité morale d’un don « bon ».
- source_word: ἐλεημοσύνη
  choice: aumône
  rationale: Le terme désigne concrètement le don fait aux personnes dans le besoin. « Aumône » est précis et plus directement équivalent que « charité », qui peut évoquer une disposition générale.
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: pour tous ceux qui la pratiquent
  rationale: Le grec dit littéralement « pour tous ceux qui la font ». « La pratiquent » est naturel en français pour une conduite éthique répétée et conserve la participation active des personnes concernées.
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: devant le Très-Haut
  rationale: « Devant » préserve la relation exprimée par ἐνώπιον, tandis que « le Très-Haut » rend le titre divin traditionnel sans explicitation ajoutée.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle l’aumône est un don précieux
  choice: Conserver une appréciation positive de l’aumône sans préciser s’il s’agit d’un mérite, d’une récompense céleste ou d’une offrande cultuelle.
  alternative: Interpréter explicitement le don comme une récompense céleste ou comme une offrande faite à Dieu.
  rationale: Le grec affirme simplement la valeur de l’aumône pour ceux qui la pratiquent devant le Très-Haut. La traduction ne doit pas développer une doctrine que le texte n’énonce pas.
translation_notes:
  register: Français moderne, digne et accessible. « Pratiquent » convient à une conduite habituelle ; « devant le Très-Haut » conserve la formulation révérencielle et la perspective divine du grec.
