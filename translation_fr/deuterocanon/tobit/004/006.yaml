base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
translation:
  language: fr
  text: Car si tu pratiques la vérité[a], tu réussiras dans tes entreprises[b], et tous ceux qui pratiquent la justice réussiront eux aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si tu agis avec vérité ». L’expression grecque désigne une conduite marquée par la vérité et la fidélité.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le grec dit de manière condensée : « il y aura des réussites dans tes œuvres ». Il s’agit du bon aboutissement de ce que l’on entreprend, pas nécessairement de prospérité matérielle.'
    reason: compressed_greek
lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  choice: si tu pratiques la vérité
  rationale: La tournure grecque est condensée. Dans ce contexte d’exhortation, « si » rend naturellement sa portée conditionnelle, tandis que « pratiquer la vérité » conserve le caractère éthique et habituel de l’expression.
- source_word: εὐοδίαι ἔσονται ἐν τοῖς ἔργοις σου
  choice: tu réussiras dans tes entreprises
  rationale: Le grec exprime une issue favorable dans ce que le destinataire accomplit. Cette formulation française est naturelle et évite de limiter la réussite à la prospérité matérielle.
- source_word: πᾶσι τοῖς ποιοῦσι
  choice: tous ceux qui pratiquent
  rationale: Le participe désigne les personnes dont la conduite se caractérise par cette action régulière.
- source_word: τὴν δικαιοσύνην
  choice: la justice
  rationale: En français biblique courant, « justice » couvre ici la conduite droite et conforme à ce qui est juste, sans réduire le terme au seul domaine judiciaire.
theological_decisions:
- issue: Portée de δικαιοσύνη
  choice: la justice
  alternative: la droiture
  rationale: « Justice » est le correspondant français traditionnel et large de δικαιοσύνη; dans ce contexte éthique, il inclut la droiture de la conduite. La note signale cette nuance afin de ne pas imposer un sens exclusivement juridique.
- issue: Lien entre conduite vraie et réussite
  choice: énoncé sapientiel conditionnel sans garantie matérialiste explicite
  alternative: promesse absolue de prospérité matérielle
  rationale: εὐοδίαι désigne le succès ou le bon déroulement des entreprises. La traduction conserve l’affirmation du texte sans préciser que cette réussite serait nécessairement financière.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse personnelle du père à son fils. « Entreprises » désigne ici ce que l’on entreprend, sans connotation exclusivement commerciale.
