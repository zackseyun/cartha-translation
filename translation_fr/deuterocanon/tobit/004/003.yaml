base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: fr
  text: 'Puis il l’appela et lui dit : « Mon enfant, si je meurs, enterre-moi. Ne néglige pas ta mère[a] ; honore-la tous les jours de ta vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne laisse pas ta mère de côté » ou « ne te désintéresse pas d’elle ». La tradition sémitique parallèle emploie une expression plus forte, proche de « ne l’abandonne pas ».
    reason: Alternative lexicale préservant l’étendue de sens de μὴ ὑπερίδῃς et signalant, sans l’importer dans le texte principal, la nuance plus forte de la tradition parallèle.
lexical_decisions:
- source_word: καλέσας
  choice: Puis il l’appela
  rationale: Le participe aoriste introduit la parole de Tobit. Une proposition coordonnée rend naturellement la succession narrative en français.
- source_word: Παιδίον
  choice: Mon enfant
  rationale: Ce vocatif exprime une adresse familiale et affectueuse. En français courant, « Mon enfant » est plus naturel que le calque « Enfant », même si le possessif n’est pas exprimé en grec ; « fils » serait plus précis que le terme grec lui-même.
- source_word: ἐὰν ἀποθάνω
  choice: si je meurs
  rationale: La construction conditionnelle avec le subjonctif aoriste signifie formellement « si je meurs ». Elle préserve ici la formulation grecque sans la transformer en « quand je mourrai ».
- source_word: θάψον με
  choice: enterre-moi
  rationale: Impératif direct, simple et idiomatique, correspondant au sens ordinaire du verbe.
- source_word: μὴ ὑπερίδῃς
  choice: Ne néglige pas
  rationale: Le verbe peut signifier ne pas tenir compte de quelqu’un, le laisser de côté ou le négliger. Dans ce contexte de devoir filial, « ne néglige pas » exprime clairement la portée pratique sans adopter d’emblée le sens plus fort de la tradition sémitique parallèle.
- source_word: τίμα
  choice: honore-la
  rationale: « Honorer » conserve la force éthique du commandement et son écho au langage biblique relatif aux parents, tout en restant actuel.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: tous les jours de ta vie
  rationale: Cette formulation proche du grec est naturelle en français et conserve la portée solennelle et complète de l’ordre.
theological_decisions:
- issue: Emploi de la tradition sémitique parallèle, plus développée que le texte grec cité
  choice: Le texte principal suit étroitement le grec et rend μὴ ὑπερίδῃς par « Ne néglige pas » ; la tradition parallèle sert seulement à éclairer la nuance dans une note.
  alternative: Introduire les éléments supplémentaires de la tradition longue, ou traduire directement par le plus fort « ne l’abandonne pas ».
  rationale: Le texte grec de Swete est l’ancrage principal. La rétroversion hébraïque issue d’un manuscrit araméen témoigne d’une tradition plus ample, mais elle ne doit pas ajouter au texte principal des propositions absentes de la ligne grecque ni en effacer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation répartit les impératifs en phrases brèves pour assurer une lecture naturelle, sans modifier leur enchaînement. « Mon enfant » restitue idiomatiquement la tendresse du vocatif grec.
