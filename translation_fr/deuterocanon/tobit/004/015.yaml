base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: fr
  text: Ce que tu détestes[a], ne le fais à personne. Ne bois pas de vin jusqu’à l’ivresse, et que l’ivresse ne t’accompagne pas sur ton chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce qui t’est odieux, ne le fais à personne. »'
    reason: Alternative lexicale reflétant la possibilité de comprendre ὃ μισεῖς comme ce qui est odieux au destinataire plutôt que simplement ce qu’il déteste.
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: ce que tu détestes
  rationale: La proposition relative a une portée générale et proverbiale. « Ce que tu détestes » conserve l’adresse au singulier et la force de μισέω dans un français naturel.
- source_word: μηδενὶ … ποίησης
  choice: ne le fais à personne
  rationale: Cette formulation rend clairement la défense et la portée universelle de μηδενί, tandis que le pronom « le » reprend naturellement la proposition relative en français.
- source_word: οἶνον εἰς μέθην μὴ πίῃς
  choice: ne bois pas de vin jusqu’à l’ivresse
  rationale: « Jusqu’à l’ivresse » exprime le résultat ou le degré indiqué par εἰς μέθην sans atténuer la référence précise à l’état d’ivresse.
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: que l’ivresse ne t’accompagne pas
  rationale: Cette tournure conserve la personnification grecque de l’ivresse qui va avec quelqu’un, tout en étant idiomatique et digne en français.
- source_word: ἐν τῇ ὁδῷ σου
  choice: sur ton chemin
  rationale: « Sur ton chemin » préserve l’image concrète du déplacement ainsi que sa possible portée figurée sur la conduite de la vie.
theological_decisions:
- issue: Formulation de la maxime éthique
  choice: Ce que tu détestes, ne le fais à personne.
  alternative: Ce qui t’est odieux, ne le fais à personne.
  rationale: Le grec présente négativement un principe de réciprocité. La traduction choisie reste proche de sa structure et conserve l’ambiguïté entre une aversion personnelle et ce qui est jugé odieux, tandis que la variante en note explicite l’autre nuance possible.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement conserve l’adresse grecque au singulier. La seconde phrase maintient la personnification de l’ivresse et l’image du chemin sans imposer une lecture exclusivement littérale ou figurée.
