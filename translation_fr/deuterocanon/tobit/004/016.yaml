  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: fr
  text: Donne de ton pain à celui qui a faim, et de tes vêtements à ceux qui sont nus. Tout ce que tu as en surplus, donne-le en aumône, et ne donne pas à contrecœur lorsque tu fais l’aumône.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « que ton œil ne soit pas envieux quand tu fais l’aumône » ; c’est-à-dire, ne donne pas à contrecœur.
    reason: La note conserve l’image de l’œil présente dans le grec et explicite son sens idiomatique dans ce contexte.
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου πεινῶντι
  choice: Donne de ton pain à celui qui a faim
  rationale: « Pain » conserve l’image concrète de ἄρτος, tandis que « celui qui a faim » rend naturellement en français le participe substantivé singulier πεινῶντι.
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: et de tes vêtements à ceux qui sont nus
  rationale: « Vêtements » est courant et fidèle à ἱμάτια. « Ceux qui sont nus » garde la formulation directe de γυμνοῖς sans préciser s’il s’agit d’une nudité totale ou d’un habillement insuffisant.
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: Tout ce que tu as en surplus
  rationale: Cette tournure française exprime clairement ce qui est en excédent ou au-delà du besoin, sens contextuel de περισσεύω, sans imposer l’idée plus étroite de restes.
- source_word: ποίει ἐλεημοσύνην
  choice: donne-le en aumône
  rationale: 'Le français naturel demande ici d’expliciter que le surplus sert à l’aumône. « Aumône » conserve la portée concrète de ἐλεημοσύνη : un don fait aux nécessiteux.'
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: que ton regard ne soit pas réticent
  rationale: La traduction garde l’image de l’œil sous la forme française naturelle « regard », tandis que « réticent » communique l’idée de donner à contrecœur ou avec regret.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: lorsque tu fais l’aumône
  rationale: La construction ἐν + infinitif articulé a une valeur temporelle. « Faire l’aumône » est une expression française établie et précise.
theological_decisions:
- issue: Sens de ἐλεημοσύνη
  choice: aumône
  alternative: acte de compassion / charité
  rationale: Dans cette exhortation sur le partage avec les pauvres, le terme désigne concrètement un don matériel. « Aumône » préserve cette spécificité sans réduire le passage à un sentiment général de compassion.
- issue: Image de l’œil dans μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: conserver l’image sous la forme « que ton regard ne soit pas réticent »
  alternative: ne donne pas à contrecœur / ne regrette pas de donner
  rationale: La formulation retenue maintient l’image corporelle et la tension rhétorique du grec tout en restant compréhensible. La note explicite son sens idiomatique sans effacer l’image du texte principal.
translation_notes:
  register: 'Français moderne, international et digne, avec tutoiement singulier conforme à l’adresse paternelle du contexte. La formulation privilégie une équivalence optimale : images concrètes conservées lorsque possible, syntaxe rendue naturelle en français.'
