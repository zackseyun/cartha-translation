base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: fr
  text: 'Que le salaire de toute personne qui travaille pour toi ne passe pas la nuit chez toi : paie-le-lui immédiatement. Si tu sers Dieu, tu en recevras la récompense. Veille sur toi-même, mon enfant, dans tout ce que tu fais, et montre-toi discipliné dans toute ta conduite.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς ἀνθρώπου
  choice: toute personne
  rationale: ἄνθρωπος désigne ici l’être humain sans imposer le sexe masculin ; « toute personne » est naturel et inclusif en français moderne.
- source_word: μὴ αὐλισθήτω
  choice: ne passe pas la nuit
  rationale: Le verbe évoque le fait de loger ou demeurer pour la nuit ; appliqué au salaire, cette formulation française conserve l’image du paiement retenu jusqu’au lendemain.
- source_word: παραυτίκα
  choice: immédiatement
  rationale: Rend directement l’idée d’un paiement effectué sur-le-champ, sans délai.
- source_word: πρόσεχε σεαυτῷ
  choice: veille sur toi-même
  rationale: Reproduit l’exhortation à être attentif à soi et à sa manière d’agir.
- source_word: παιδίον
  choice: mon enfant
  rationale: Dans cette adresse paternelle, « mon enfant » exprime naturellement l’affection et l’exhortation, sans infantiliser inutilement.
- source_word: ἴσθι πεπαιδευμένος
  choice: montre-toi discipliné
  rationale: Le participe parfait peut évoquer une personne formée, instruite ou disciplinée ; ici, le contexte moral de la conduite favorise « discipliné ».
- source_word: ἀναστροφῇ
  choice: conduite
  rationale: Le mot désigne la manière de vivre ou de se comporter ; « conduite » convient au registre sapientiel.
theological_decisions:
- issue: Rétribution liée au service de Dieu
  choice: « Si tu sers Dieu, il te sera rendu »
  alternative: « Si tu travailles pour Dieu, il te le rendra »
  rationale: Le passif ἀποδοθήσεταί ne nomme pas explicitement celui qui rendra, et le sujet implicite de la chose rendue reste ouvert. La traduction conserve cette indétermination et évite d’expliciter une doctrine précise de la récompense.
translation_notes:
  register: Français international moderne, clair et digne, avec tutoiement cohérent avec l’adresse paternelle. La structure sentencieuse du grec est conservée sans raideur excessive.
