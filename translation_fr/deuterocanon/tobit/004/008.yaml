  yaml_path: translation/deuterocanon/tobit/004/008.yaml
  text: As much as you have[a], according to your abundance, give alms from it; and if you have little, do not be afraid to give alms according to that little.
translation:
  language: fr
  text: Selon l’abondance de tes biens, fais l’aumône à partir d’eux ; si tu as peu, n’aie pas peur de faire l’aumône selon tes modestes moyens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς σοι ὑπάρχει
  choice: Selon ce que tu possèdes
  rationale: La tournure indique que le don doit être mesuré d’après les ressources dont dispose la personne. « Posséder » rend naturellement ὑπάρχει dans ce contexte matériel.
- source_word: κατὰ τὸ πλῆθος
  choice: en proportion de leur abondance
  rationale: κατά avec l’accusatif exprime ici une mesure ou une proportion, tandis que πλῆθος évoque la quantité abondante des biens.
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: donne de tes biens en aumône
  rationale: ἐλεημοσύνη désigne concrètement l’aumône, et ἐξ αὐτῶν indique que le don est prélevé sur les biens possédés.
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: si tu as peu
  rationale: Cette formulation française concise conserve le contraste direct entre abondance et faibles ressources.
- source_word: κατὰ τὸ ὀλίγον
  choice: en proportion de ce peu
  rationale: Le second κατά reprend l’idée de proportion et maintient le parallélisme rhétorique avec la première moitié du verset.
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: n’aie pas peur de donner en aumône
  rationale: Cette traduction conserve le sens premier de φοβοῦ sans le réduire à une simple hésitation et exprime naturellement l’action concrète de faire l’aumône.
theological_decisions:
- issue: Sens de ἐλεημοσύνη
  choice: aumône / donner en aumône
  alternative: charité / acte de miséricorde
  rationale: Dans Tobit, le terme renvoie à la pratique concrète du don aux personnes dans le besoin. « Aumône » préserve cette précision ainsi que la continuité thématique du livre.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse personnelle du père à son fils. La répétition de « en proportion » conserve le parallélisme du grec et son insistance sur un don adapté aux moyens de chacun.
