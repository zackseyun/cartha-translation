base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
translation:
  language: fr
  text: Tandis qu’ils poursuivaient leur route[a], ils arrivèrent le soir au Tigre et campèrent là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec court dit simplement qu’ils atteignirent le Tigre le soir et campèrent là. La tradition sémitique et la recension longue développent aussitôt la scène en introduisant l’épisode du poisson raconté ensuite.
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδόν
  choice: tandis qu’ils poursuivaient leur route
  rationale: Le participe présent exprime une action en cours, et l’expression « poursuivre leur route » rend naturellement en français moderne l’idée de voyager sur le chemin.
- source_word: ἦλθον ἑσπέρας
  choice: ils arrivèrent le soir
  rationale: La tournure grecque situe leur arrivée au moment du soir. « Le soir » conserve cette indication temporelle sans imposer le sens plus précis d’une arrivée accomplie avant la tombée de la nuit.
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: au Tigre
  rationale: Avec un verbe de mouvement, ἐπί indique ici l’arrivée auprès du fleuve. En français, le nom « le Tigre » suffit naturellement à désigner le fleuve.
- source_word: ηὐλίζοντο
  choice: campèrent
  rationale: Le verbe désigne le fait de prendre ses quartiers pour la nuit, souvent en plein air pendant un voyage. « Campèrent » convient au cadre situé près du fleuve.
- source_word: ἐκεῖ
  choice: là
  rationale: Cet adverbe locatif est rendu directement et naturellement par « là ».
