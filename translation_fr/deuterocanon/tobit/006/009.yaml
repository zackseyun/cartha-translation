- source_word: χολή
  choice: fiel
  rationale: Terme français traditionnel et précis pour la bile ou le fiel du poisson dans ce contexte.
- source_word: ἐγχρῖσαι
  choice: applique-le sur
  rationale: L’infinitif a une valeur prescriptive dans la suite des indications données; « appliquer » rend naturellement l’action d’enduire sans la durcir en « frotter ».
