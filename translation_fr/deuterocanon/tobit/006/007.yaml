  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: fr
  text: 'Et le jeune homme dit à l’ange : « Azarias, mon frère, à quoi servent le foie, le cœur et la bile du poisson ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: le jeune homme
  rationale: Dans le récit, Tobie est assez âgé pour voyager et agir de manière autonome. « Le jeune homme » exprime sa jeunesse sans donner l’impression qu’il s’agit d’un petit enfant.
- source_word: τῷ ἀγγέλῳ
  choice: à l’ange
  rationale: ἄγγελος peut désigner un messager, mais le contexte de Tobit présente ce compagnon comme un être angélique, et le grec emploie explicitement ce terme ici.
- source_word: Ἀζαρία
  choice: Azarias
  rationale: Forme française biblique établie du nom grec Ἀζαρία.
- source_word: ἀδελφέ
  choice: mon frère
  rationale: Le vocatif signifie littéralement « frère » et sert ici d’adresse familière ou respectueuse. L’ajout naturel du possessif en français ne transforme pas cette expression en affirmation de parenté.
- source_word: τί ἐστιν
  choice: à quoi servent
  rationale: Littéralement « qu’est-ce que… ? », mais la question porte, dans ce contexte, sur l’utilité des parties prélevées sur le poisson. Cette formulation rend naturellement le sens en français.
- source_word: τὸ ἧπαρ
  choice: le foie
  rationale: Sens anatomique courant.
- source_word: ἡ καρδία
  choice: le cœur
  rationale: Sens anatomique courant.
- source_word: ἡ χολή
  choice: la bile
  rationale: χολή désigne la bile ou le fiel. « Bile » est ici le terme anatomique moderne, précis et immédiatement compréhensible.
- source_word: τοῦ ἰχθύος
  choice: du poisson
  rationale: Le génitif indique que ces parties proviennent du poisson.
theological_decisions:
- issue: L’adresse ἀδελφέ faite au compagnon angélique
  choice: « mon frère » est conservé comme forme directe d’adresse
  alternative: « mon ami », ou omission de l’adresse
  rationale: Le verset n’affirme pas une parenté littérale avec l’ange ; il emploie une formule sociale familière. Conserver « frère » respecte la tension et la transparence lexicales sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La formulation interrogative est idiomatique, tandis que les termes anatomiques restent précis. Ponctuation française et forme onomastique « Azarias » conformes à l’usage biblique francophone.
