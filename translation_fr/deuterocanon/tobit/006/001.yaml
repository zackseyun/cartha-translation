translation:
  language: fr
  text: Et elle cessa de pleurer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec suivi ici est très bref : « Et elle cessa de pleurer. » Une tradition apparentée aux témoins sémitiques poursuit ce verset par le récit du voyage (« le jeune homme se mit en route… »), mais ce texte ne figure pas dans le témoin grec principal traduit ici.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction relie simplement cette proposition au contexte précédent. « Et » en conserve la valeur narrative sans expliciter davantage le rapport logique.
- source_word: ἐπαύσατο
  choice: cessa
  rationale: L’aoriste moyen de παύω indique ici l’arrêt d’une action en cours. « Cessa » est naturel dans ce registre narratif et s’associe idiomatiquement à l’infinitif français.
- source_word: κλαίουσα
  choice: de pleurer
  rationale: Le participe présent de κλαίω désigne l’action de pleurer, alors en cours puis interrompue. La construction française « cessa de pleurer » rend clairement cette relation aspectuelle.
