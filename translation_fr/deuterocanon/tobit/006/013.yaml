  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: fr
  text: 'Et maintenant, écoute-moi : je parlerai à son père et, quand nous serons revenus de Rhagès, nous célébrerons le mariage. Car je sais que Ragouël ne la donnera certainement pas à un autre homme : ce serait contraire à la loi de Moïse[a] ; sinon, il encourrait la mort. En effet, c’est à toi, plutôt qu’à tout autre homme, qu’il revient de recevoir l’héritage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « selon la loi de Moïse ». Dans cette construction difficile, la clause suivante indique que donner Sara à un autre homme violerait la Loi et rendrait Ragouël passible de mort.
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: 'Le grec dit littéralement : « car il te revient de recevoir l’héritage plus que tout homme », tournure qui exprime ici le droit prioritaire de Tobie sur tout autre homme.'
    reason: idiome comparatif
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: écoute-moi
  rationale: L’impératif appelle ici une attention réelle, et non la simple perception auditive ; « écoute-moi » est direct et naturel.
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: je parlerai à son père
  rationale: Cette formulation suit simplement le futur grec sans préciser davantage le contenu de l’entretien.
- source_word: ὅταν ὑποστρέψωμεν ἐκ Ῥάγων
  choice: quand nous serons revenus de Rhagès
  rationale: ὅταν avec le subjonctif renvoie à une éventualité future ; le futur antérieur français exprime naturellement l’antériorité du retour par rapport au mariage.
- source_word: ποιήσωμεν τὸν γάμον
  choice: nous célébrerons le mariage
  rationale: L’expression grecque signifie littéralement « faire le mariage ». Dans ce contexte, elle désigne l’accomplissement ou la célébration du mariage ; le futur français rend naturellement la suite prévue.
- source_word: οὐ μὴ δῷ
  choice: ne la donnera certainement pas
  rationale: La construction οὐ μή avec le subjonctif constitue une négation emphatique, rendue par « certainement pas ».
- source_word: ἀνδρὶ ἑτέρῳ
  choice: à un autre homme
  rationale: ἀνήρ peut désigner un homme ou un mari. Puisqu’il s’agit ici d’un futur mariage, « un autre homme » reste proche du grec sans anticiper le statut de mari.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: conformément à la loi de Moïse
  rationale: κατά signifie normalement « selon, conformément à ». Placée après la proposition négative, l’expression indique que la loi interdit à Ragouël de donner sa fille à un autre homme. Une note signale l’autre manière d’expliciter la relation syntaxique.
- source_word: ἢ ὀφειλέσει θάνατον
  choice: autrement, il sera passible de mort
  rationale: Littéralement, il « devra la mort ». Dans ce contexte juridique, l’expression indique qu’il encourrait la mort ; « passible de mort » conserve la force légale sans donner à entendre que sa mort serait immédiatement certaine.
- source_word: τὴν κληρονομίαν
  choice: l’héritage
  rationale: Le grec emploie l’article défini sans possessif explicite. « L’héritage » respecte cette formulation tout en restant clair dans le contexte.
- source_word: σοὶ καθήκει λαβεῖν
  choice: c’est à toi qu’il revient de recevoir
  rationale: καθήκει exprime ce qui convient ou revient à quelqu’un. Cette tournure française maintient à la fois l’idée de convenance et celle de droit prioritaire.
- source_word: ἢ πάντα ἄνθρωπον
  choice: plutôt qu’à tout autre homme
  rationale: Le grec transmis est abrupt, littéralement « que tout homme ». Le contexte appelle une comparaison de priorité entre Tobie et les autres hommes susceptibles d’épouser Sara.
theological_decisions:
- issue: Portée juridique de l’obligation de Ragouël selon la loi de Moïse
  choice: La loi de Moïse fonde le refus de donner Sara à un autre homme ; agir autrement rendrait Ragouël passible de mort.
  alternative: Traduire « il ne la donnera pas à un autre homme contrairement à la loi de Moïse », en faisant porter explicitement l’idée de violation sur le don lui-même.
  rationale: Le sens contextuel est que Ragouël est juridiquement tenu de respecter la priorité de Tobie. La traduction conserve toutefois le sens ordinaire de κατὰ, « conformément à », et laisse la proposition négative porter l’interdiction, plutôt que de transformer directement la préposition en « contrairement à ».
- issue: Nature du droit de Tobie sur l’héritage
  choice: Tobie possède une priorité pour recevoir l’héritage, exprimée sans définir davantage le mécanisme juridique ou familial.
  alternative: 'Formuler de manière plus absolue : « tu as le droit de prendre possession de l’héritage ».'
  rationale: καθήκει indique ce qui revient ou convient à Tobie, mais le verset n’expose pas toutes les modalités de ce droit. La formulation retenue évite de surdéterminer la nature exacte de la revendication.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent les formes françaises usuelles « Rhagès » et « Ragouël ». La ponctuation clarifie l’enchaînement juridique sans supprimer l’ambiguïté du grec, laquelle est documentée en note.
