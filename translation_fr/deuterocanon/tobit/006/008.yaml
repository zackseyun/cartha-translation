  source_fidelity: 'Le sens général est fidèlement rendu : les organes sont le cœur et le foie, le texte distingue « démon » et « esprit mauvais », et la cessation du tourment est conservée. Toutefois, ἀνθρώπου ἢ γυναικός est indéfini (« un homme ou une femme »), tandis que « l’homme ou la femme » peut en français prendre une valeur générique moins directement référentielle. La formulation du verbe καπνίσαι peut aussi être plus directe : il s’agit de faire fumer les organes, c’est-à-dire de les brûler afin qu’ils dégagent de la fumée.'
