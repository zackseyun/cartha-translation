  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: fr
  text: 'Il lui répondit : « Le cœur et le foie : si un démon ou un esprit mauvais tourmente quelqu’un, fais-les fumer[a] devant un homme ou une femme, et cette personne ne sera plus tourmentée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais-les brûler afin qu’ils dégagent de la fumée ». Le verbe grec désigne ici le fait de faire fumer ces organes en les brûlant.'
    reason: alternative lexicale
lexical_decisions:
- source_word: καρδία
  choice: cœur
  rationale: Le mot désigne ici littéralement l’organe du poisson, associé au foie, et non le siège figuré des pensées ou des émotions.
- source_word: ἧπαρ
  choice: foie
  rationale: Le sens anatomique littéral convient au contexte, qui porte sur l’usage des organes du poisson.
- source_word: ἐάν τινα ὀχλῇ
  choice: si ... tourmente quelqu’un
  rationale: ὀχλέω exprime ici une action pénible ou oppressive. « Tourmenter » est naturel dans le contexte d’une action démoniaque sans en préciser indûment la nature.
- source_word: δαιμόνιον
  choice: démon
  rationale: Ce choix préserve la distinction établie par le grec entre δαιμόνιον et πνεῦμα πονηρόν.
- source_word: πνεῦμα πονηρόν
  choice: esprit mauvais
  rationale: Traduction directe qui maintient le parallélisme avec « démon » sans confondre les deux expressions.
- source_word: ταῦτα δὲ καπνίσαι
  choice: fais-les brûler pour produire de la fumée
  rationale: L’infinitif a ici une valeur impérative après la réponse. καπνίσαι évoque le fait de produire de la fumée en brûlant les organes; la formulation française explicite naturellement ce mécanisme.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rendu concis et idiomatique pour une action accomplie en présence de la personne concernée.
- source_word: ἀνθρώπου ἢ γυναικός
  choice: l’homme ou la femme
  rationale: Le grec nomme explicitement l’homme et la femme. L’article défini en français renvoie naturellement à la personne tourmentée déjà évoquée.
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: ne sera plus tourmentée
  rationale: La tournure rend la forte négation grecque et reprend le même verbe français que dans la proposition précédente.
theological_decisions:
- issue: Nature de l’affirmation concernant l’oppression démoniaque et le remède prescrit
  choice: Présenter directement, comme le fait le récit, le démon ou l’esprit mauvais et l’usage de la fumée des organes.
  alternative: Réinterpréter le passage dans la traduction comme un symbolisme purement médical ou folklorique.
  rationale: Le grec formule sans atténuation l’affliction par un démon ou un esprit mauvais et prescrit de faire fumer les organes. La traduction conserve la vision du texte sans l’approuver ni la rationaliser par ajout.
- issue: Expression sexuée dans ἀνθρώπου ἢ γυναικός
  choice: Conserver explicitement « l’homme ou la femme ».
  alternative: Employer seulement « la personne » dans la première occurrence.
  rationale: Le texte source distingue expressément l’homme et la femme; cette distinction doit demeurer visible. « Cette personne » dans la conclusion évite un pronom masculin ambigu tout en renvoyant aux deux possibilités.
translation_notes:
  register: Français moderne international, clair et digne. « Il lui répondit » rend naturellement εἶπεν αὐτῷ dans ce dialogue. L’impératif singulier « fais » correspond à l’interlocuteur de Raphaël; « cette personne » évite la lourdeur de « il ou elle » tout en conservant l’explicitation antérieure « l’homme ou la femme ».
