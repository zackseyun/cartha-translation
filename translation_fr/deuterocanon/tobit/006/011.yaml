  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: fr
  text: 'L’ange dit au jeune homme : « Frère, aujourd’hui, nous logerons chez Ragouël. Il est ton parent et il a une fille nommée Sarra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: au jeune homme
  rationale: Le terme peut désigner un garçon ou un jeune homme. Dans le contexte, Tobie est en âge de voyager et de se marier ; « jeune homme » évite donc une nuance trop enfantine.
- source_word: Ἀδελφέ
  choice: Frère
  rationale: Le vocatif est conservé comme forme d’adresse fraternelle, sans le réduire à un simple « ami » ni ajouter un possessif absent du grec.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel en français moderne.
- source_word: αὐλισθησόμεθα
  choice: nous logerons
  rationale: Le verbe désigne le fait de prendre gîte ou de passer la nuit. « Nous logerons » respecte cette portée sans préciser indûment qu’ils camperont dehors.
- source_word: παρὰ Ῥαγουήλῳ
  choice: chez Ragouël
  rationale: Avec le datif, παρά indique ici l’accueil auprès de Ragouël, vraisemblablement dans sa maison. « Chez Ragouël » est l’expression française la plus naturelle.
- source_word: συγγενής σού
  choice: de ta parenté
  rationale: Le grec exprime un lien de parenté sans en préciser le degré. Cette formulation conserve cette indétermination et convient à la reprise pronominale αὐτός.
- source_word: θυγάτηρ
  choice: une fille
  rationale: Rend directement le lien familial exprimé par le grec.
- source_word: ὄνομα Σάρρα
  choice: nommée Sarra
  rationale: Formulation française naturelle qui restitue fidèlement la construction grecque indiquant le nom.
