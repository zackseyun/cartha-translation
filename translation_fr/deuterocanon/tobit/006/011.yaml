translation_notes:
  register: Français international moderne, clair et digne. La ponctuation scinde légèrement l’enchaînement grec afin d’obtenir une parole naturelle sans modifier ses rapports logiques. Les graphies « Ragouël » et « Sarra » suivent des formes françaises bibliques usuelles.
