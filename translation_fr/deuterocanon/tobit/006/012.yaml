base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: fr
  text: Je parlerai d’elle afin qu’elle te soit donnée pour femme, car son héritage te revient[a], et toi seul fais partie de sa parenté[b] ; et la jeune femme est belle et sensée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son héritage t’appartient » ou « le droit à son héritage te revient ». Le grec évoque un droit ou une obligation juridique liée à la parenté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toi seul es de sa famille » ou « toi seul es de sa lignée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: Je parlerai d’elle
  rationale: Le futur de λαλέω avec περὶ suivi du génitif signifie naturellement « parler de/au sujet de quelqu’un ». Le contexte peut impliquer une démarche en sa faveur, mais le grec ne l’explicite pas.
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: afin qu’elle te soit donnée pour femme
  rationale: L’infinitif articulé avec τοῦ exprime ici le but. La tournure conserve la voix passive et rend naturellement εἰς γυναῖκα dans un registre biblique actuel et digne.
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: son héritage te revient
  rationale: ἐπιβάλλει exprime ici qu’en vertu du lien de parenté, l’héritage échoit légalement au destinataire. « Te revient » garde cette portée juridique sans l’alourdir.
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: toi seul es de sa parenté
  rationale: γένος désigne ici la famille ou la parenté. « De sa parenté » est naturel en français et maintient le lien de parenté pertinent pour le mariage et l’héritage.
- source_word: τὸ κοράσιον
  choice: la jeune femme
  rationale: κοράσιον peut désigner une fille ou une jeune femme. Le contexte matrimonial favorise « jeune femme », qui évite une connotation enfantine.
- source_word: καλὸν
  choice: belle
  rationale: Dans la description d’une future épouse, καλός renvoie naturellement à la beauté physique.
- source_word: φρόνιμόν
  choice: sensée
  rationale: φρόνιμος évoque le bon jugement et la sagesse pratique. « Sensée » est clair, actuel et n’exagère pas la portée du terme.
theological_decisions:
- issue: Formulation du rapport entre mariage, parenté et héritage
  choice: car son héritage te revient, et toi seul es de sa parenté
  alternative: car son héritage t’appartient, et toi seul appartiens à sa famille
  rationale: Le texte fonde le projet de mariage sur une logique juridique et sociale liée à la parenté. La traduction conserve ce lien sans identifier plus précisément que le grec la coutume ou le statut légal en cause.
translation_notes:
  register: Français international moderne, clair et digne. « Pour femme » conserve la concision et la tonalité du grec sans archaïsme marqué. La ponctuation en deux phrases évite une coordination finale lourde tout en maintenant la progression de l’énoncé.
