  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: fr
  text: 'Mais l’ange lui dit : « Saisis le poisson. » Alors le jeune garçon attrapa le poisson et le lança sur la terre ferme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: Saisis le poisson
  rationale: L’impératif exprime l’action de prendre fermement le poisson; « saisir » est direct, naturel et digne.
- source_word: τὸ παιδάριον
  choice: le jeune garçon
  rationale: Le diminutif désigne ici le jeune compagnon; cette formulation conserve l’indication d’âge sans donner une nuance affective excessive.
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: le lança sur la terre ferme
  rationale: Le verbe ἀναβάλλω décrit ici le mouvement par lequel le poisson est projeté ou remonté hors de l’eau; « lança » restitue la vigueur de l’action, et « terre ferme » explicite naturellement le contraste avec l’eau.
