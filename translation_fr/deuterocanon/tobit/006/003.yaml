  language: en
  yaml_path: translation/deuterocanon/tobit/006/003.yaml
  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: fr
  text: Le jeune homme descendit pour se laver. Alors, un poisson bondit hors du fleuve et voulut avaler le jeune homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tenta d’avaler le jeune homme ». Le verbe grec peut exprimer la volonté ou l’intention ; dans ce contexte, il peut aussi se rendre par une tentative d’attaque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: le jeune homme
  rationale: Le diminutif παιδάριον peut désigner un garçon, un enfant ou un jeune serviteur. Ici, Tobie est assez âgé pour voyager et agir de manière autonome ; « le jeune homme » convient donc au contexte sans le présenter comme un petit enfant.
- source_word: κατέβη
  choice: descendit
  rationale: Le verbe exprime un déplacement vers le bas, ici en direction de l’eau. « Descendit » restitue ce mouvement avec concision.
- source_word: περικλύσασθαι
  choice: pour se laver
  rationale: L’infinitif moyen indique que le jeune homme se lave lui-même. Cette formulation reste naturelle et n’impose pas l’idée d’une immersion complète.
- source_word: ἀνεπήδησεν
  choice: bondit
  rationale: Le verbe décrit un mouvement brusque vers le haut. « Bondit » conserve la vivacité de la scène.
- source_word: ἰχθύς
  choice: un poisson
  rationale: Le nom est sans article et le poisson apparaît ici pour la première fois ; l’article indéfini convient donc.
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: hors du fleuve
  rationale: La préposition marque l’origine du bond. « Hors du fleuve » rend clairement le mouvement depuis l’eau ; « fleuve » convient à un grand cours d’eau sans ajouter son nom.
- source_word: ἐβουλήθη
  choice: voulut
  rationale: Le verbe exprime la volonté ou l’intention. « Voulut » en conserve la valeur propre sans transformer explicitement cette intention en tentative accomplie.
- source_word: καταπεῖν
  choice: avaler
  rationale: Le verbe signifie littéralement avaler ou engloutir. « Avaler » est direct et n’intensifie pas indûment l’image comme pourrait le faire « dévorer ».
