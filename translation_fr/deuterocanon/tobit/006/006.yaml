base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: fr
  text: Le jeune homme fit ce que l’ange lui avait dit. Puis ils firent griller le poisson et le mangèrent. Tous deux poursuivirent leur route jusqu’à ce qu’ils s’approchent d’Ecbatane.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec indique qu’ils s’approchèrent d’Ecbatane, sans nécessairement dire qu’ils y étaient déjà arrivés.
    reason: Précision lexicale sur ἤγγισαν et préservation de la nuance d’approche.
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: le jeune homme
  rationale: Bien que παιδάριον puisse désigner un garçon ou un enfant, Tobie est ici un voyageur en âge de se marier. « Le jeune homme » convient donc au contexte sans effacer l’idée de jeunesse.
- source_word: ἐποίησεν
  choice: fit
  rationale: Rend simplement l’action accomplie conformément aux paroles de l’ange.
- source_word: ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: ce que l’ange lui avait dit
  rationale: Formulation française naturelle qui conserve le sens de paroles données, sans renforcer indûment le verbe en « ordonner ».
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες
  choice: Puis ils firent griller le poisson
  rationale: Le participe grec est rendu par une action coordonnée fluide en français. « Faire griller » exprime la cuisson directe suggérée par ὀπτάω.
- source_word: ἔφαγον
  choice: et le mangèrent
  rationale: Le pronom explicite naturellement en français que le poisson est l’objet sous-entendu du verbe grec.
- source_word: ὥδευον
  choice: poursuivirent leur route
  rationale: Cette expression rend le déplacement continu indiqué par l’imparfait grec dans un français actuel et narratif.
- source_word: ἀμφότεροι
  choice: Tous deux
  rationale: Préserve explicitement le fait que Tobie et l’ange continuent ensemble.
- source_word: ἕως ἤγγισαν
  choice: jusqu’à ce qu’ils s’approchent
  rationale: Conserve la notion d’approche portée par ἐγγίζω sans faire croire qu’ils sont déjà entrés dans la ville.
- source_word: ἐν Ἐκβατάνοις
  choice: d’Ecbatane
  rationale: Le nom traditionnel français « Ecbatane » est employé. Avec le verbe « s’approcher », la préposition française « de » exprime naturellement la proximité malgré la construction grecque inhabituelle avec ἐν.
