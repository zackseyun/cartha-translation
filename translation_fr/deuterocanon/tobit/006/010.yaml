lexical_decisions:
- source_word: Ὡς δὲ
  choice: Lorsqu’
  rationale: Dans ce récit, ὡς avec δέ marque une transition temporelle vers l’événement suivant. « Lorsqu’ » rend naturellement ce lien sans alourdir la phrase.
- source_word: προσήγγισαν
  choice: ils approchèrent
  rationale: Cet aoriste indique qu’ils se rapprochèrent d’un lieu. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: τῇ Ῥάγῃ
  choice: de Ragès
  rationale: Le datif désigne ici le lieu dont ils s’approchent. En français, « approcher de » exprime naturellement ce rapport; le nom propre est translittéré sous la forme française traditionnelle « Ragès ».
