  source_fidelity: 'Le sens fondamental est fidèlement rendu : Tobie est le seul fils, il craint de mourir comme les hommes précédents, le démon aime Sara et nuit à ceux qui s’approchent d’elle, et la mort de Tobie ferait mourir ses parents de chagrin sans autre fils pour les ensevelir. « Le seul fils » est justifié par le contexte immédiat. La formulation révisée rend plus naturellement le mouvement exprimé par εἰσελθών sans expliciter indûment la chambre nuptiale.'
  naturalness: '« En entrant auprès d’elle » n’est pas idiomatique en français international moderne : on entre dans un lieu, tandis qu’on va ou se rend auprès d’une personne. De même, « faire descendre ... la vie ... jusqu’à leur tombe » reproduit trop mécaniquement l’image grecque et alourdit fortement la phrase française. Une expression idiomatique conserve l’idée causative de mener les parents à la mort, tandis que la note maintient l’image littérale.'
  terminology: « Démon », « l’aime », « fait du mal », « ceux qui s’approchent d’elle » et « ensevelir » conviennent au registre et au grec. Les notes conservent avec justesse le caractère possessif de φιλεῖ et l’arrière-plan matrimonial contextuel, sans l’intégrer de force au texte.
