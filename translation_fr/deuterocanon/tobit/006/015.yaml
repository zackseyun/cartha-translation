  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: fr
  text: « Et maintenant, je suis le seul fils de mon père, et j’ai peur de mourir si je vais auprès d’elle, comme ceux qui m’ont précédé, car un démon l’aime[a] et ne fait de mal à personne, sauf à ceux qui s’approchent d’elle[b]. Et maintenant, j’ai peur de mourir et de conduire, à cause de moi, mon père et ma mère dans la douleur au tombeau[c] ; ils n’ont pas d’autre fils pour les ensevelir. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « un démon l’aime ». Le contexte présente cet amour comme un attachement possessif et malveillant.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit, dans le contexte, des hommes qui s’approchent d’elle pour l’épouser.
    reason: contextual_note
  - marker: c
    text: 'Littéralement : « faire descendre la vie de mon père et de ma mère dans la douleur jusqu’à leur tombe » ; cette image signifie qu’il craint de les faire mourir de chagrin à cause de lui.'
    reason: cultural_note
lexical_decisions:
- source_word: μόνος ... τῷ πατρί
  choice: le seul fils de mon père
  rationale: Le grec dit littéralement qu’il est « seul pour son père ». La suite précise que ses parents n’ont pas d’autre fils ; la formulation française explicite donc naturellement cette relation sans modifier le sens contextuel.
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: j’ai peur qu’en entrant auprès d’elle, je meure
  rationale: Cette formulation rend naturellement la construction de crainte avec μή et conserve le lien entre son entrée auprès de Sara et la mort redoutée, sans expliciter davantage la chambre nuptiale.
- source_word: οἱ πρότεροι
  choice: ceux qui m’ont précédé
  rationale: L’expression désigne les hommes venus avant Tobie, dans le contexte les précédents maris de Sara. La traduction reste assez générale pour préserver la formulation elliptique du grec.
- source_word: δαιμόνιον
  choice: un démon
  rationale: Le terme désigne ici un être spirituel hostile personnel dans le cadre narratif du livre ; « démon » en est l’équivalent français direct.
- source_word: φιλεῖ αὐτήν
  choice: l’aime
  rationale: Le verbe signifie normalement « aimer » ou « éprouver de l’affection pour ». Le rendu littéral préserve l’étrangeté et la tension de l’attachement possessif du démon.
- source_word: ἀδικεῖ
  choice: fait du mal
  rationale: Dans ce contexte de morts provoquées, l’expression française communique clairement le tort concret causé tout en restant proche du sens de « léser, faire du tort ».
- source_word: τῶν προσαγόντων αὐτῇ
  choice: ceux qui s’approchent d’elle
  rationale: Le rendu préserve la portée assez large du participe grec, tout en laissant le contexte matrimonial déterminer de quelle approche il s’agit.
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: faire descendre ... la vie de mon père et de ma mère ... jusqu’à leur tombe
  rationale: La traduction conserve l’image grecque de la vie des parents menée à la tombe, plutôt que de la remplacer entièrement par une paraphrase.
- source_word: μετ’ ὀδύνης
  choice: dans la douleur
  rationale: Cette expression rend l’angoisse et le profond chagrin indiqués par ὀδύνη, avec un registre naturel et digne.
- source_word: ὃς θάψει αὐτούς
  choice: pour les ensevelir
  rationale: L’infinitif français exprime naturellement la fonction attendue de l’autre fils, à savoir accomplir le devoir filial de sépulture.
theological_decisions:
- issue: Nature du δαιμόνιον
  choice: un démon personnel qui s’attache à Sara et fait du mal aux hommes qui s’approchent d’elle
  alternative: un mauvais esprit compris de manière plus générale
  rationale: Le récit présente cet être comme un agent personnel qui aime et fait du mal. « Démon » conserve cette représentation narrative sans lui ajouter une explication doctrinale.
- issue: Sens de φιλεῖ αὐτήν appliqué au démon
  choice: « l’aime », en conservant la formulation surprenante du grec
  alternative: « est attaché à elle » ou « la désire »
  rationale: Le texte attribue explicitement au démon l’action d’aimer Sara. Une paraphrase atténuerait ou préciserait indûment la tension du texte ; une note indique cependant le caractère possessif et malveillant de cet attachement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe conserve les répétitions de la crainte et l’image forte de la descente à la tombe. Les formulations « un démon l’aime » et « ceux qui s’approchent d’elle » maintiennent volontairement l’étrangeté et la relative indétermination du grec.
