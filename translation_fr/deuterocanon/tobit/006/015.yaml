revisions:
- from: « Et maintenant, je suis le seul fils de mon père, et j’ai peur qu’en entrant auprès d’elle, je meure comme ceux qui m’ont précédé, car un démon l’aime[a] et ne fait de mal à personne, sauf à ceux qui s’approchent d’elle[b]. Maintenant, j’ai peur de mourir et de faire descendre, à cause de moi, la vie de mon père et de ma mère dans la douleur jusqu’à leur tombe[c] ; et ils n’ont pas d’autre fils pour les ensevelir. »
  to: « Et maintenant, je suis le seul fils de mon père, et j’ai peur de mourir si je vais auprès d’elle, comme ceux qui m’ont précédé, car un démon l’aime[a] et ne fait de mal à personne, sauf à ceux qui s’approchent d’elle[b]. Et maintenant, j’ai peur de mourir et de conduire, à cause de moi, mon père et ma mère dans la douleur au tombeau[c] ; ils n’ont pas d’autre fils pour les ensevelir. »
  rationale: La révision ne modifie pas le sens du passage. Elle remplace deux calques grecs peu naturels par des formulations françaises courantes, tout en préservant l’ambiguïté de l’approche de Sara dans le texte et l’image littérale de la descente au tombeau dans la note.
