  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: fr
  text: 'Alors le jeune homme dit à l’ange : « Azarias, mon frère, j’ai entendu dire que la jeune fille a été donnée en mariage à sept hommes[a] et qu’ils ont tous été empêchés[b] dans la chambre nuptiale. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sept maris ». Le grec dit littéralement « à sept hommes » ; dans ce contexte, elle leur a été donnée en mariage.
    reason: lexical_alternative
  - marker: b
    text: La formulation grecque, très concise, emploie un verbe d’empêchement ou d’obstacle. Dans le contexte du récit, ces hommes n’ont pas pu consommer le mariage, car ils sont morts dans la chambre nuptiale.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: le jeune homme
  rationale: Même si παιδάριον peut désigner un garçon ou un enfant, Tobie est ici en âge de se marier. « Le jeune homme » convient donc au contexte sans donner au personnage une apparence trop enfantine.
- source_word: τῷ ἀγγέλῳ
  choice: à l’ange
  rationale: Dans le récit, Azarias est bien un être angélique; « ange » est donc le sens contextuel naturel de ἄγγελος.
- source_word: Ἀζαρία ἀδελφέ
  choice: Azarias, mon frère
  rationale: Le vocatif ἀδελφέ est conservé. Le possessif « mon », idiomatique en français dans l’adresse directe, exprime la relation chaleureuse sans imposer une fraternité biologique.
- source_word: ἀκήκοα
  choice: j’ai entendu dire
  rationale: Cette tournure française rend naturellement le parfait grec et introduit bien le contenu rapporté.
- source_word: τὸ κοράσιον
  choice: la jeune fille
  rationale: κοράσιον désigne une fille ou une jeune femme. « La jeune fille » est actuel, digne et adapté au contexte matrimonial.
- source_word: δεδόσθαι
  choice: avait été donnée
  rationale: Le verbe δίδωμι est gardé plutôt que remplacé par « mariée ». Le plus-que-parfait respecte la concordance naturelle des temps après « j’ai entendu dire ».
- source_word: ἑπτὰ ἀνδράσιν
  choice: à sept hommes
  rationale: ἀνήρ peut signifier « homme » ou « mari ». « Hommes » reste au plus près du grec et laisse le contexte matrimonial préciser leur rôle.
- source_word: πάντας
  choice: tous
  rationale: Le pronom renvoie clairement aux sept hommes déjà mentionnés.
- source_word: ἐν τῷ νυμφῶνι
  choice: dans la chambre nuptiale
  rationale: νυμφών désigne la pièce nuptiale; « chambre nuptiale » est une expression française claire et consacrée.
- source_word: ἀποκωλῦσαι
  choice: avaient été empêchés
  rationale: Le grec emploie un verbe signifiant empêcher ou tenir à l’écart, dans une formulation syntaxiquement abrupte. Cette traduction en conserve la retenue sans introduire directement l’idée de mise à mort.
theological_decisions:
- issue: Faut-il expliciter le sort des précédents maris de Sara?
  choice: Traduire sobrement par « avaient tous été empêchés » dans le texte principal.
  alternative: « avaient tous été tués », « étaient tous morts » ou « avaient été empêchés de s’unir à elle »
  rationale: Le contexte narratif indique que les hommes meurent avant de consommer leur mariage, mais ce membre de phrase emploie un verbe d’empêchement et non un verbe explicite de mort. La traduction préserve cette tension, tandis que la note éclaire le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe du discours direct reste naturelle, tandis que l’expression volontairement incomplète « avaient été empêchés » reflète la concision et l’ambiguïté du grec; la note fournit l’explication narrative sans la faire entrer dans le texte principal.
