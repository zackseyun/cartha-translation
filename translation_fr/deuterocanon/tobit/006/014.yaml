  naturalness: Le français est clair et digne. « Donnée à sept hommes » peut toutefois paraître abrupt ou ambigu hors de son contexte matrimonial ; « donnée en mariage à sept hommes » rend le sens idiomatiquement sans surinterpréter. Le passé composé convient mieux dans le discours indirect après « j’ai entendu dire ».
  terminology: « Azarias », « mon frère », « jeune fille » et « chambre nuptiale » conviennent. « Hommes » préserve l’ambiguïté de ἀνδράσιν, tandis que « en mariage » explicite seulement la valeur contextuelle de δεδόσθαι. « Empêchés » maintient la retenue du verbe grec ; la note peut signaler le contexte narratif sans faire de la mort le sens lexical direct du membre de phrase.
