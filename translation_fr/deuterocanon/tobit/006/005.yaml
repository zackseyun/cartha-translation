base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: fr
  text: 'Et l’ange lui dit : « Ouvre le poisson, puis prends le cœur, le foie et le fiel[a], et mets-les en lieu sûr. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la bile ».'
    reason: Alternative lexicale possible pour le grec χολή.
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: Ouvre
  rationale: Dans ce contexte, l’impératif signifie ouvrir le poisson en le découpant afin d’en retirer certains organes. « Ouvre le poisson » est naturel en français et exprime clairement l’action sans technicité inutile.
- source_word: τὸν ἰχθύν
  choice: le poisson
  rationale: Rendu direct du groupe nominal grec défini.
- source_word: λαβὼν
  choice: puis prends
  rationale: Le participe aoriste indique une action qui précède la mise de côté. La coordination avec « puis » restitue clairement et naturellement la succession des gestes.
- source_word: τὴν καρδίαν
  choice: le cœur
  rationale: Terme anatomique français usuel et exact.
- source_word: τὸ ἧπαρ
  choice: le foie
  rationale: Terme anatomique français usuel et exact.
- source_word: τὴν χολὴν
  choice: le fiel
  rationale: χολή peut désigner le fiel ou la bile. « Fiel » maintient le vocabulaire narratif traditionnel sans préciser indûment la vésicule biliaire; la variante « bile » est signalée en note.
- source_word: θὲς ἀσφαλῶς
  choice: mets-les soigneusement de côté
  rationale: Le verbe commande de conserver ensemble les éléments prélevés, tandis que l’adverbe exprime leur mise en sûreté. Cette formulation française suggère naturellement leur conservation pour un usage ultérieur.
theological_decisions:
- issue: Identification de ὁ ἄγγελος
  choice: l’ange
  alternative: le messager
  rationale: Bien que ἄγγελος puisse signifier « messager », le personnage est présenté dans le récit de Tobit comme un être angélique. « L’ange » rend donc le sens narratif sans ajouter d’affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Ouvre » est compris contextuellement comme l’ouverture du poisson par incision; « mets-les soigneusement de côté » rend de façon idiomatique l’idée de conservation sûre.
