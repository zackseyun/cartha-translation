  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: fr
  text: 'Mais l’ange lui dit : « Ne te souviens-tu pas des paroles que ton père t’a dites en t’ordonnant de prendre une femme de ta parenté ? Maintenant, écoute-moi, frère : elle sera ta femme. Ne tiens aucun compte du démon[a], car cette nuit même, elle te sera donnée pour femme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne te préoccupe aucunement du démon. » Le grec emploie littéralement une expression signifiant : « ne tiens aucun compte du démon ».'
    reason: La tournure grecque est idiomatique et peut exprimer l’idée de ne pas tenir compte du démon ou de ne pas s’en inquiéter.
lexical_decisions:
- source_word: μέμνησαι
  choice: Ne te souviens-tu pas
  rationale: Le parfait grec a ici une valeur présente. Cette question est naturelle en français et conserve l’appel explicite au souvenir.
- source_word: λόγων ὧν ἐνετείλατό σοι ὁ πατήρ σου
  choice: des paroles de ton père, lorsqu’il t’a ordonné
  rationale: La formulation garde λόγων (« paroles ») et la force prescriptive de ἐνετείλατο, tout en évitant une relative peu naturelle en français.
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: de prendre une femme
  rationale: Cette expression reste proche de l’idiome matrimonial grec et convient au cadre familial du récit.
- source_word: ἐκ τοῦ γένους σου
  choice: dans ta parenté
  rationale: γένος désigne ici le groupe familial ou la lignée. « Dans ta parenté » exprime ce lien sans préciser à tort une tribu ou une ethnie.
- source_word: ἄκουσόν μου
  choice: écoute-moi
  rationale: L’impératif appelle à écouter et, dans le contexte, à tenir compte de l’assurance donnée par l’ange, sans rendre explicitement le verbe par « obéis-moi ».
- source_word: ἀδελφέ
  choice: frère
  rationale: Le vocatif est conservé littéralement comme terme d’adresse chaleureux.
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: elle sera ta femme
  rationale: Cette formulation française rend naturellement l’idiome grec exprimant le statut matrimonial à venir.
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: Ne tiens aucun compte du démon
  rationale: L’expression signifie littéralement ne tenir aucun « mot » ou « compte » du démon. La tournure retenue reste proche de cette image tout en étant idiomatique en français.
- source_word: δαιμονίου
  choice: démon
  rationale: Le terme grec désigne explicitement un démon ; le choix conserve cette précision surnaturelle.
- source_word: τὴν νύκτα ταύτην
  choice: cette nuit même
  rationale: La formulation est naturelle et souligne l’immédiateté du grec.
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: elle te sera donnée pour femme
  rationale: Le passif explicite et la formule matrimoniale du grec sont tous deux préservés.
theological_decisions:
- issue: Formules matrimoniales et obligation liée à la parenté
  choice: Conserver « prendre une femme », « elle sera ta femme » et « donnée pour femme », avec « dans ta parenté ».
  alternative: Employer partout des formulations plus générales telles que « épouser » et « une parente ».
  rationale: Le grec répète γυναῖκα et emploie une formule matrimoniale passive. La traduction maintient le cadre social et familial du passage sans l’approuver ni le désapprouver implicitement.
- issue: Désignation de la menace surnaturelle
  choice: Traduire δαιμόνιον par « démon ».
  alternative: Traduire par « esprit mauvais ».
  rationale: Le texte source nomme explicitement un démon. Une expression plus générale réduirait sa précision lexicale et théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct demeure chaleureux mais ferme. Les répétitions matrimoniales et le passif final sont maintenus en raison de leur importance dans le grec.
