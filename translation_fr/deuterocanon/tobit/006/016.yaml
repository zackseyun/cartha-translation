review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris les formules matrimoniales répétées, le passif final (« elle te sera donnée ») et la désignation explicite du démon. Toutefois, « des paroles de ton père, lorsqu’il t’a ordonné » transforme la relative grecque (« les paroles que ton père t’a commandées / ordonnées ») en une indication temporelle et ne rend pas clairement que l’ordre s’adressait à Tobie.
  naturalness: Le registre est globalement naturel et digne. « Des paroles que ton père t’a dites en t’ordonnant... » est plus clair et plus idiomatique que la construction avec « lorsqu’il ». La formule « ne tiens aucun compte du démon » est naturelle dans ce contexte.
  terminology: « Parenté », « frère », « démon », « ta femme » et « donnée pour femme » conviennent au grec et au français moderne international. « Prendre une femme de ta parenté » conserve sans l’atténuer le cadre matrimonial et familial du texte.
  issues:
  - severity: medium
    issue: La relation syntaxique entre « paroles » et l’ordre du père est imprécise.
    rationale: λόγων ὧν ἐνετείλατό σοι ὁ πατήρ σου désigne les paroles que le père a adressées à Tobie en lui donnant cet ordre. « Lorsqu’il t’a ordonné » se lit plutôt comme une circonstance temporelle et laisse « paroles de ton père » sans relative explicative.
  - severity: low
    issue: Le littéral de la note est formulé de manière peu française.
    rationale: « N’aie aucun mot/compte du démon » n’explicite pas correctement en français le génitif grec. Une paraphrase littérale signalant « aucun compte à tenir du démon » est plus intelligible tout en indiquant l’idiome.
