revisions:
- from: 'Mais l’ange lui dit : « Ne te souviens-tu pas des paroles de ton père, lorsqu’il t’a ordonné de prendre une femme dans ta parenté ? Maintenant, écoute-moi, frère : elle sera ta femme. Ne tiens aucun compte du démon[a], car cette nuit même, elle te sera donnée pour femme. »'
  to: 'Mais l’ange lui dit : « Ne te souviens-tu pas des paroles que ton père t’a dites en t’ordonnant de prendre une femme de ta parenté ? Maintenant, écoute-moi, frère : elle sera ta femme. Ne tiens aucun compte du démon[a], car cette nuit même, elle te sera donnée pour femme. »'
  rationale: La révision explicite que les « paroles » sont celles par lesquelles le père a donné son ordre à Tobie, sans modifier le sens ni le registre. Elle conserve les choix fidèles du projet concernant la parenté, le démon, les formules matrimoniales et le passif final. La note est reformulée afin d’être compréhensible en français sans prétendre reproduire mécaniquement une construction grecque non idiomatique.
