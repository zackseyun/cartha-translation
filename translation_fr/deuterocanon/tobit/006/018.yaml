  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: fr
  text: Alors le démon en sentira l’odeur et s’enfuira ; il ne reviendra plus jamais[a]. Mais quand tu t’approcheras d’elle[b], levez-vous tous les deux et criez vers le Dieu miséricordieux ; il vous sauvera et aura pitié de vous. N’aie pas peur, car elle avait été préparée pour toi depuis toujours[c]. Tu la sauveras, elle ira avec toi, et je pense que tu auras d’elle des enfants. Lorsque Tobias entendit ces paroles, il l’embrassa, et son âme s’attacha très fortement à elle[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne reviendra pas pour le siècle du siècle », expression grecque insistante indiquant ici un non-retour définitif.'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte de la nuit de noces, « s’approcher d’elle » désigne l’approche conjugale de Sara par son mari.
    reason: cultural_note
  - marker: c
    text: 'Ou : « depuis l’éternité », « depuis longtemps » ou « dès les temps anciens ». L’expression grecque peut évoquer aussi bien une antiquité reculée qu’un horizon éternel.'
    reason: alternative_reading
  - marker: d
    text: 'Littéralement : « son âme se colla à elle ». Cette image exprime un attachement profond et durable, et non une simple émotion passagère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  choice: en sentira l’odeur
  rationale: Le verbe désigne concrètement le fait de sentir une odeur. Cette formulation naturelle conserve le lien avec les organes du poisson mentionnés dans le contexte.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: Le terme grec désigne directement un démon ; ce choix est précis et courant en français biblique moderne.
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: il ne reviendra plus jamais
  rationale: Cette tournure française exprime naturellement et avec force le non-retour définitif indiqué par l’idiome grec emphatique.
- source_word: προσπορεύῃ αὐτῇ
  choice: tu t’approcheras d’elle comme de ta femme
  rationale: Le verbe signifie s’approcher, mais le contexte nuptial lui donne ici un sens conjugal. La formulation française rend ce sens sans crudité et sans le masquer.
- source_word: ἐγέρθητε ἀμφότεροι
  choice: levez-vous tous les deux
  rationale: Impératif direct, rendu dans un français actuel tout en gardant la solennité de l’instruction.
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: criez vers le Dieu miséricordieux
  rationale: Le verbe βοάω évoque un appel pressant ou un cri. « Criez vers » en préserve l’urgence davantage que le terme plus général « priez ».
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: il vous sauvera et aura pitié de vous
  rationale: La coordination des deux verbes est conservée. « Sauvera » maintient la portée immédiate et la résonance théologique du grec sans les confondre.
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: elle t’était destinée depuis toujours
  rationale: Le passif de préparation exprime ici une disposition antérieure en faveur de Tobias. « Destinée » est naturel dans le contexte matrimonial, tandis que la note préserve l’amplitude temporelle et l’ambiguïté du grec.
- source_word: σὺ αὐτὴν σώσεις
  choice: tu la sauveras
  rationale: Le même verbe σῴζω est traduit comme dans la proposition précédente. Le contexte indique une délivrance de la menace mortelle du démon.
- source_word: πορεύσεται μετὰ σοῦ
  choice: elle partira avec toi
  rationale: Cette formulation rend naturellement le mouvement futur avec Tobias, probablement lors de son retour.
- source_word: ὑπολαμβάνω
  choice: je pense
  rationale: Le verbe marque ici une estimation ou une attente personnelle. « Je pense » est direct, naturel et ne transforme pas cette parole en certitude absolue.
- source_word: ἐξ αὐτῆς παιδία
  choice: tu auras d’elle des enfants
  rationale: Cette tournure française claire désigne les enfants issus de leur union.
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: son âme s’attacha très fortement à elle
  rationale: La traduction conserve l’image vive de l’âme qui se lie ou adhère profondément à une personne, plutôt que de la réduire à une émotion passagère.
theological_decisions:
- issue: Portée de ἀπὸ τοῦ αἰῶνος concernant la préparation de Sara pour Tobias
  choice: depuis toujours
  alternative: depuis l’éternité ; depuis longtemps ; dès les temps anciens
  rationale: L’expression peut viser une antiquité reculée ou un horizon éternel. « Depuis toujours » garde une forte portée providentielle sans trancher excessivement entre ces nuances ; la note signale les possibilités.
- issue: Sens de « tu la sauveras »
  choice: conserver le verbe « sauver » dans son contexte narratif de délivrance
  alternative: tu la délivreras ; tu la préserveras
  rationale: Le contexte immédiat concerne la délivrance de Sara face à la menace mortelle du démon. Le terme « sauver » respecte la répétition grecque sans importer une doctrine ultérieure du salut.
- issue: Nature de la relation exprimée par προσπορεύῃ αὐτῇ
  choice: expliciter sobrement l’approche conjugale
  alternative: quand tu t’approcheras d’elle ; quand tu iras vers elle
  rationale: Le contexte de la nuit de noces rend le sens conjugal probable. L’explicitation évite une obscurité trompeuse, tandis que la note précise la valeur de l’idiome.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression grecque tout en évitant les calques peu naturels. Les termes « démon », « Dieu miséricordieux », « sauver » et « âme » conservent la densité religieuse du texte. Les ambiguïtés temporelles et conjugales sont signalées en notes plutôt que résolues de manière confessionnelle.
