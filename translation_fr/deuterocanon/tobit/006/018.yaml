- from: 'Alors le démon en sentira l’odeur et s’enfuira ; il ne reviendra plus jamais[a]. Mais quand tu t’approcheras d’elle comme de ta femme[b], levez-vous tous les deux et criez vers le Dieu miséricordieux : il vous sauvera et aura pitié de vous. N’aie pas peur, car elle t’était destinée depuis toujours[c]. Tu la sauveras, elle partira avec toi, et je pense que tu auras d’elle des enfants. Lorsque Tobias entendit ces paroles, il l’embrassa, et son âme s’attacha très fortement à elle[d].'
  to: Alors le démon en sentira l’odeur et s’enfuira ; il ne reviendra plus jamais[a]. Mais quand tu t’approcheras d’elle[b], levez-vous tous les deux et criez vers le Dieu miséricordieux ; il vous sauvera et aura pitié de vous. N’aie pas peur, car elle avait été préparée pour toi depuis toujours[c]. Tu la sauveras, elle ira avec toi, et je pense que tu auras d’elle des enfants. Lorsque Tobias entendit ces paroles, il l’embrassa, et son âme s’attacha très fortement à elle[d].
  rationale: La révision conserve la syntaxe et le registre du projet tout en rétablissant « préparée pour toi », correspondant directement au participe grec ἡτοίμασμένη. Elle retire l’ajout interprétatif « comme de ta femme » du corps du texte, dont la note explique suffisamment le contexte conjugal, et rend πορεύσεται par « ira avec toi », formulation plus neutre et plus proche du grec. Les ancres de notes restent toutes présentes et correctement associées.
