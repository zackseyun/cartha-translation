  naturalness: Le français est globalement moderne, clair et digne. « T’approcher d’elle comme de ta femme » est cependant moins naturel et plus explicite que nécessaire. « Elle ira avec toi » est plus direct que « elle partira avec toi » pour πορεύσεται μετὰ σοῦ.
  terminology: « démon », « Dieu miséricordieux », « sauvera » et « âme » rendent convenablement les termes religieux du grec sans surinterprétation doctrinale. La note sur l’expression temporelle doit accompagner une traduction qui conserve le verbe « préparer ».
