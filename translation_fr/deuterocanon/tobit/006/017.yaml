  yaml_path: translation/deuterocanon/tobit/006/017.yaml
  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: fr
  text: Et lorsque tu entreras dans la chambre nuptiale, prends de la cendre d’encens[a], mets dessus une partie du cœur et du foie du poisson, puis fais fumer le tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la cendre d’aromates brûlés ». Le terme grec peut désigner l’encens ou, plus largement, des substances aromatiques employées pour produire une fumée odorante.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « produis de la fumée ». Il s’agit de faire monter de la fumée à partir de la cendre sur laquelle ont été posées des parties du cœur et du foie du poisson, et non simplement de « brûler » le tout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: chambre nuptiale
  rationale: Désigne la pièce réservée aux époux et au lit conjugal. « Chambre nuptiale » est une formulation française naturelle et digne qui conserve clairement le cadre matrimonial.
- source_word: λήμψῃ
  choice: prends
  rationale: Dans cette suite d’instructions, le verbe exprime l’action concrète de prendre une matière afin de l’utiliser.
- source_word: τέφραν θυμιαμάτων
  choice: de la cendre d’encens
  rationale: τέφρα signifie « cendre », tandis que θυμιαμάτων renvoie à l’encens ou à des substances aromatiques brûlées. Cette formulation conserve l’image concrète sans introduire un encensoir absent du grec.
- source_word: ἐπιθήσεις
  choice: mets dessus
  rationale: Le verbe signifie poser ou mettre sur. « Dessus » renvoie naturellement à la cendre déjà mentionnée.
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: une partie du cœur et du foie du poisson
  rationale: 'ἀπό a ici une valeur partitive : seule une portion de chacun de ces organes doit être placée sur la cendre.'
- source_word: καπνίσεις
  choice: fais fumer le tout
  rationale: Le verbe désigne précisément le fait de produire de la fumée ou de procéder à une fumigation, plutôt que simplement « brûler ». La formulation française exprime clairement l’action sans en anticiper l’effet.
theological_decisions:
- issue: Nature de l’action rituelle ou médicinale exprimée par καπνίσεις
  choice: Décrire concrètement la production de fumée.
  alternative: Interpréter l’action comme une offrande brûlée ou comme un acte explicite d’exorcisme.
  rationale: Le grec décrit ici l’acte matériel. Son effet est exposé dans la suite du récit ; il ne convient donc pas de l’introduire par interprétation dans ce verset.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Les impératifs rendent naturellement la suite d’instructions grecques. « Puis » explicite uniquement l’enchaînement des gestes, sans ajouter d’interprétation théologique.
