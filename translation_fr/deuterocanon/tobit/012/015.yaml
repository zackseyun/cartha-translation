  yaml_path: translation/deuterocanon/tobit/012/015.yaml
  text: I am Raphael[a], one of the seven holy angels who present the prayers of the holy ones and enter before the glory of the Holy One.
translation:
  language: fr
  text: « Je suis Raphaël, l’un des sept anges saints qui présentent les prières des saints[a] et entrent en présence de la gloire du Saint. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ceux qui sont saints » ; littéralement, le grec emploie ici l’adjectif « saints » comme nom.'
    reason: Signaler la transparence lexicale et éviter que « les saints » soit nécessairement compris selon une catégorie ecclésiastique ultérieure.
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: Raphaël
  rationale: Forme française traditionnelle du nom propre grec, avec le tréma qui en indique la prononciation.
- source_word: εἷς ἐκ τῶν ἑπτὰ
  choice: l’un des sept
  rationale: Rend naturellement en français l’expression partitive tout en conservant le nombre précis.
- source_word: ἁγίων ἀγγέλων
  choice: anges saints
  rationale: Reproduit directement les deux éléments du grec sans atténuer la qualification de sainteté.
- source_word: προσαναφέρουσιν
  choice: présentent
  rationale: Exprime l’action d’apporter les prières jusque dans la présence divine sans imposer l’image sacrificielle que pourrait suggérer « offrent ».
- source_word: τὰς προσευχὰς
  choice: les prières
  rationale: Équivalent français courant et direct de προσευχή.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Le substantif adjectival grec désigne littéralement les saints ou ceux qui sont saints. La formulation française reste concise, tandis que la note signale l’autre explicitation possible.
- source_word: εἰσπορεύονται ἐνώπιον
  choice: entrent devant
  rationale: Conserve à la fois le mouvement d’entrée et l’idée de se présenter devant quelqu’un, plutôt que de réduire l’expression à une présence statique.
- source_word: τῆς δόξης
  choice: la gloire
  rationale: Maintient le substantif grec et l’image de la gloire divine sans le paraphraser comme simple présence.
- source_word: τοῦ ἁγίου
  choice: du Saint
  rationale: Le masculin singulier substantivé renvoie très probablement à Dieu comme titre révérenciel; la majuscule française le signale sans ajouter le nom de Dieu.
theological_decisions:
- issue: Référence de τοῦ ἁγίου dans la formule finale
  choice: Titre divin rendu par « le Saint »
  alternative: Comprendre l’expression comme une désignation révérencielle moins explicitement titulaire, ou comme liée implicitement à « gloire »
  rationale: La scène de cour céleste indique naturellement que les anges entrent devant la gloire de Dieu. « Le Saint » conserve toutefois la forme substantivée et la retenue du grec, sans développer l’expression.
- issue: Référence de τῶν ἁγίων
  choice: « des saints »
  alternative: « de ceux qui sont saints » ou « des êtres saints »
  rationale: Le grec ne précise pas davantage l’identité des personnes qualifiées de saintes. La traduction garde cette indétermination au lieu d’introduire une catégorie ecclésiastique plus tardive ou de préciser arbitrairement le référent.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’imagerie de la cour céleste et le mouvement d’entrée exprimé par le grec. « Anges saints » est légèrement solennel mais clair et fidèle; « le Saint » est maintenu comme titre divin concis.
