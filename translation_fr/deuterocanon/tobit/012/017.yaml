  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: fr
  text: 'Et il leur dit : « N’ayez pas peur. La paix sera avec vous[a]. Mais bénissez Dieu pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la paix pour vous sera ». On pourrait aussi comprendre : « vous aurez la paix » ou, comme formule de bénédiction, « que la paix soit avec vous ».'
    reason: La construction grecque au futur avec le datif peut être rendue de plusieurs façons en français; la traduction principale conserve explicitement le futur.
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Cette tournure idiomatique en français moderne rend naturellement l’impératif négatif de φοβέομαι.
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: La paix sera avec vous
  rationale: Le futur ἔσται est conservé comme assurance, tandis que « avec vous » exprime naturellement le datif ὑμῖν sans transformer la phrase en simple souhait.
- source_word: τὸν δὲ θεὸν
  choice: Mais bénissez Dieu
  rationale: '« Mais » rend le léger contraste marqué par δέ : au lieu de céder à la peur, ils doivent bénir Dieu.'
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: « Bénir » maintient la correspondance lexicale et le registre biblique de l’action dirigée vers Dieu; « louer » reste une possibilité sémantique.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française moderne et claire pour une durée sans fin.
theological_decisions:
- issue: Valeur de la déclaration de paix
  choice: 'Une assurance au futur : « La paix sera avec vous »'
  alternative: 'Une salutation ou bénédiction : « Que la paix soit avec vous »'
  rationale: Le grec emploie explicitement le futur ἔσται. La traduction le conserve afin de présenter la parole comme une assurance après l’interdiction d’avoir peur, sans effacer la proximité avec une formule de paix.
translation_notes:
  register: 'Français international moderne, naturel et digne. La ponctuation clarifie les trois mouvements de la phrase : défense d’avoir peur, assurance de paix, puis appel à bénir Dieu.'
