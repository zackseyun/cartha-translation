translation:
  language: fr
  text: Et tous deux furent bouleversés et tombèrent face contre terre, car ils eurent peur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: furent bouleversés
  rationale: Le passif de ταράσσω exprime ici un trouble soudain et profond. « Furent bouleversés » reste naturel en français sans anticiper ni redoubler la peur explicitement mentionnée à la fin du verset.
- source_word: οἱ δύο
  choice: tous deux
  rationale: Cette formulation française rend naturellement le numéral substantivé et désigne ensemble Tobit et Tobias.
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: tombèrent face contre terre
  rationale: L’expression grecque décrit une chute ou prosternation le visage tourné vers le sol. « Face contre terre » restitue clairement la posture physique sans lui attribuer explicitement une valeur cultuelle.
- source_word: ἐφοβήθησαν
  choice: ils eurent peur
  rationale: L’aoriste de φοβέομαι exprime leur réaction de peur. Le passé simple convient au récit et traduit l’événement sans intensification indue.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la cause de leur chute. « Car » exprime clairement ce rapport dans un registre narratif digne et courant.
theological_decisions:
- issue: Nature de la réaction à la révélation de Raphaël
  choice: Le verset décrit une chute face contre terre causée par la peur, sans employer de vocabulaire explicite d’adoration.
  alternative: On peut comprendre cette posture comme une prosternation révérencielle devant un ange.
  rationale: Le grec indique expressément qu’ils tombèrent face contre terre parce qu’ils eurent peur. La traduction conserve à la fois la posture et sa cause déclarée, sans imposer une interprétation cultuelle absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. « Tous deux » est plus idiomatique que « les deux » dans ce contexte; « face contre terre » conserve l’image concrète de la prosternation.
