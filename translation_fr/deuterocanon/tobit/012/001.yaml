base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: fr
  text: 'Puis Tobit appela son fils Tobias et lui dit : « Vois, mon enfant[a] : il faut donner un salaire à l’homme qui t’a accompagné, et il faut lui en donner davantage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « enfant » ; la formulation sémitique parallèle porte « mon fils ». Le texte principal suit le vocatif grec tout en gardant la nuance familiale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Verbe narratif courant indiquant que Tobit fait venir son fils ou s’adresse à lui; « appela » reste naturel et proche du grec.
- source_word: Ὅρα
  choice: Vois
  rationale: L’impératif attire l’attention sur ce qui suit. « Vois » conserve la formulation directe du grec, sans développer en « veille à ».
- source_word: τέκνον
  choice: mon enfant
  rationale: Le grec emploie le vocatif affectueux « enfant », et non le terme précis « fils ». L’ajout naturel du possessif en français exprime l’adresse familiale sans changer le référent.
- source_word: μισθὸν
  choice: un salaire
  rationale: Dans ce contexte, le mot désigne la rémunération due au compagnon pour son service, plutôt qu’une récompense générale.
- source_word: τῷ ἀνθρώπῳ
  choice: à l’homme
  rationale: Le grec est masculin singulier et renvoie au compagnon masculin de Tobias.
- source_word: τῷ συνελθόντι σοι
  choice: qui t’a accompagné
  rationale: Rend naturellement le participe désignant celui qui est allé avec Tobias, tout en conservant l’idée d’accompagnement durant le voyage.
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: il faut y ajouter quelque chose pour lui
  rationale: La tournure impersonnelle « il faut » préserve la nécessité exprimée par δεῖ. « Y ajouter quelque chose » indique un supplément au salaire sans en préciser le montant.
