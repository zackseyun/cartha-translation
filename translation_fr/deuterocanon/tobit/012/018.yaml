  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: fr
  text: Car ce n’est pas par une faveur de ma part[a], mais par la volonté de votre Dieu. C’est pourquoi bénissez-le pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par ma propre grâce ». Le grec χάρις peut signifier « grâce », « faveur » ou « bienveillance » ; ici, il renvoie probablement à l’initiative ou à la bienveillance personnelle de Raphaël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: faveur
  rationale: Dans ce contexte narratif, χάρις désigne vraisemblablement la faveur ou la bienveillance personnelle de Raphaël. « Une faveur de ma part » est naturel en français et évite de donner d’emblée au mot un sens doctrinal plus marqué.
- source_word: ἐμαυτοῦ
  choice: de ma part
  rationale: Le réfléchi souligne que Raphaël n’attribue pas son intervention à sa propre initiative ou bienveillance. Cette tournure française restitue naturellement cette insistance.
- source_word: θελήσει
  choice: volonté
  rationale: θέλημα exprime ici la volonté ou l’intention de Dieu ; « volonté » est le correspondant direct et idiomatique.
- source_word: τοῦ θεοῦ ὑμῶν
  choice: de votre Dieu
  rationale: Le génitif marque une relation possessive et conserve l’adresse directe à Tobit et aux siens.
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: ὅθεν introduit la conséquence exhortative de l’affirmation précédente ; « C’est pourquoi » rend clairement ce lien logique en français moderne.
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif appelle les destinataires à bénir Dieu. « Bénissez » préserve le registre biblique et le sens lexical, sans le réduire à la seule idée de louange.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée sans fin ; « pour toujours » est fidèle et naturel en français.
theological_decisions:
- issue: Sens de χάρις dans le refus par Raphaël de s’attribuer l’initiative
  choice: Raphaël affirme que ce qui s’est produit ne vient pas d’une faveur personnelle de sa part, mais de la volonté de Dieu.
  alternative: Raphaël affirme que ce n’est pas par sa propre grâce, mais par la volonté de Dieu.
  rationale: χάρις peut signifier « grâce », « faveur » ou « bienveillance ». Le contexte met surtout en relief l’action déléguée de Raphaël, sans développer une doctrine de la grâce. Le texte principal emploie donc « faveur », tandis que la note conserve l’autre possibilité lexicale.
- issue: Ellipse verbale de la proposition grecque
  choice: 'Conserver une formulation générale : « ce n’est pas par… »'
  alternative: 'Expliciter : « je n’ai pas agi par… » ou « je suis venu non par… »'
  rationale: Le grec ne précise pas ici le verbe ou l’action sous-entendue. La formulation retenue préserve cette indétermination au lieu de choisir silencieusement entre l’action, la venue ou l’aide de Raphaël.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « une faveur de ma part » est plus naturelle que le calque « ma propre faveur », tandis que « bénissez-le » maintient le registre biblique. L’ellipse du grec est volontairement conservée.
