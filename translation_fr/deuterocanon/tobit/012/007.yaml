review_pass:
  verdict: revise
  source_fidelity: Le premier impératif est bien affirmatif dans le texte grec fourni (ὀκνεῖτε, sans μή) ; il faut donc conserver cette difficulté plutôt que suivre sans réserve la négation de la piste anglaise. En revanche, « rendre hommage » restreint indûment ἐξομολογεῖσθαι, qui évoque ici la reconnaissance ou la louange publique, avec des nuances possibles d’action de grâce ou de confession.
  naturalness: « Hésitez à le reconnaître publiquement » est plus idiomatique et plus proche du champ sémantique grec que « Hésitez à lui rendre hommage ». L’impératif affirmatif demeure volontairement déroutant, conformément au texte transmis, et la note l’explicite. Le reste est naturel dans un registre biblique sobre et actuel.
  terminology: « Secret d’un roi », « œuvres de Dieu », « faites le bien » et « le mal ne vous trouvera pas » rendent fidèlement le grec. « Avec éclat » est une solution française recevable pour ἐνδόξως ; la note conserve les nuances « avec honneur » et « glorieusement ».
  issues:
  - severity: medium
    issue: « Rendre hommage » pour ἐξομολογεῖσθαι
    rationale: Cette expression peut suggérer une déférence cérémonielle et ne rend pas clairement la reconnaissance, l’action de grâce ou la louange publique exprimées par le verbe grec. « Le reconnaître publiquement » préserve mieux l’amplitude lexicale et le lien avec la révélation des œuvres de Dieu.
  - severity: low
    issue: Formulation des alternatives dans la note a
    rationale: « Faire confession » n’est pas idiomatique en français moderne dans ce contexte. La note peut signaler « confesser » parmi les possibilités sans imposer un sens de confession des péchés.
  revised_text: Hésitez à le reconnaître publiquement[a]. Il est bon de cacher le secret d’un roi, mais de révéler avec éclat[b] les œuvres de Dieu. Faites le bien, et le mal ne vous trouvera pas.
  revised_footnotes:
  - marker: a
    text: 'Le grec transmis dit littéralement : « Hésitez à le reconnaître publiquement », sans négation. Le contexte peut faire attendre : « N’hésitez pas ». Le verbe peut aussi signifier « rendre grâce », « louer ouvertement » ou « confesser ».'
    reason: textual_and_lexical_difficulty
  - marker: b
    text: 'Ou : « avec honneur » ou « glorieusement ».'
    reason: lexical_alternative
  revision_rationale: La révision conserve l’impératif affirmatif difficile du grec de Swete, sans le corriger d’après le contexte ou la traduction anglaise. Elle remplace seulement une expression française trop étroite par « le reconnaître publiquement », qui rend plus justement ἐξομολογεῖσθαι tout en laissant les autres nuances attestées en note. Les ancres de note correspondent respectivement au verbe difficile et à l’adverbe ἐνδόξως.
