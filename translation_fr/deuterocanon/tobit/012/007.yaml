base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: fr
  text: Hésitez à lui rendre hommage[a]. Il est bon de cacher le secret d’un roi, mais de révéler avec éclat[b] les œuvres de Dieu. Faites le bien, et le mal ne vous trouvera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis dit littéralement : « Hésitez à lui rendre hommage », sans négation. Le contexte peut faire attendre : « N’hésitez pas ». « Rendre hommage » peut aussi se traduire par « reconnaître publiquement », « rendre grâce », « louer ouvertement » ou « faire confession ».'
    reason: textual_and_lexical_difficulty
  - marker: b
    text: 'Ou : « avec honneur » ou « d’une manière glorieuse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: Hésitez
  rationale: 'Le texte grec transmis porte un impératif affirmatif, sans négation : « hésitez » ou « montrez-vous réticents ». Bien que cette formulation soit difficile dans le contexte, la traduction ne supplée pas silencieusement un μή (« ne… pas »).'
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: à lui rendre hommage
  rationale: Le verbe peut exprimer l’aveu, la reconnaissance publique, l’action de grâce ou la louange. « Rendre hommage » convient au contexte où il est question de faire connaître les œuvres de Dieu, sans évoquer spécifiquement la confession des péchés.
- source_word: μυστήριον βασιλέως
  choice: le secret d’un roi
  rationale: Ici, μυστήριον désigne vraisemblablement une affaire confidentielle, non un mystère théologique. La formulation française est claire et proverbiale.
- source_word: καλὸν κρύψαι
  choice: Il est bon de cacher
  rationale: Cette tournure rend directement l’évaluation morale et la construction infinitive générale du grec.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: les œuvres de Dieu
  rationale: « Œuvres » demeure transparent et garde la formulation biblique courante, tout en désignant les actes accomplis par Dieu.
- source_word: ἀνακαλύπτειν
  choice: révéler
  rationale: Le verbe signifie littéralement découvrir ou dévoiler et forme un contraste net avec « cacher ».
- source_word: ἐνδόξως
  choice: avec éclat
  rationale: Cette expression française naturelle conserve l’idée d’une divulgation glorieuse et publique. Le sens « avec honneur » reste possible et est signalé en note.
- source_word: ἀγαθὸν ποιήσατε
  choice: Faites le bien
  rationale: Formulation française simple et directe qui garde la force de l’impératif éthique.
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: le mal ne vous trouvera pas
  rationale: La traduction conserve l’image frappante du grec plutôt que de préciser le mal comme un malheur ou un dommage.
theological_decisions:
- issue: Impératif affirmatif ὀκνεῖτε sans négation
  choice: Hésitez
  alternative: N’hésitez pas
  rationale: Le texte grec fourni dit littéralement « hésitez » et ne contient pas μή. Le contexte semble pourtant appeler l’exhortation contraire, ce qui explique la traduction traditionnelle « n’hésitez pas ». La difficulté textuelle et théologique est conservée dans le texte et explicitée en note au lieu d’être résolue tacitement.
- issue: Sens de ἐξομολογεῖσθαι αὐτῷ
  choice: lui rendre hommage
  alternative: le reconnaître publiquement ; lui rendre grâce ; le louer ouvertement ; lui faire confession
  rationale: Le contexte de la proclamation des œuvres divines favorise la reconnaissance publique, la gratitude ou la louange plutôt qu’une confession de péchés. La note maintient toutefois l’étendue sémantique du verbe.
- issue: Portée de ἐνδόξως
  choice: avec éclat
  alternative: avec honneur ; d’une manière glorieuse
  rationale: L’adverbe peut exprimer soit la gloire entourant la proclamation des œuvres de Dieu, soit la manière honorable et convenable de les révéler. Le texte retient une expression naturelle qui garde une coloration doxologique, et la note préserve l’autre nuance.
translation_notes:
  register: Français international actuel, sobre et digne. Le parallélisme proverbial entre « cacher » et « révéler » est maintenu. La formulation difficile du premier impératif suit le grec fourni plutôt que la correction contextuelle de la couche anglaise ; une note donne au lecteur les éléments nécessaires.
