base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/011.yaml
  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: fr
  text: 'Je ne vous cacherai absolument rien[a]. J''ai en effet dit : « Il est bon de cacher le secret d''un roi, mais de révéler glorieusement les œuvres de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucune parole » ou « aucune affaire ».'
    reason: La formulation grecque πᾶν ῥῆμα peut désigner toute parole ou toute chose dont il est question.
  - marker: b
    text: 'Ou : « avec honneur » ou « d''une manière honorable ».'
    reason: L'adverbe grec peut exprimer la gloire ou l'honneur attaché à la manière de faire connaître les œuvres de Dieu.
lexical_decisions:
- source_word: οὐ μὴ κρύψω ἀφʼ ὑμῶν πᾶν ῥῆμα
  choice: Je ne vous cacherai absolument rien
  rationale: La double négation οὐ μή donne une forte valeur négative orientée vers l’avenir. En contexte, πᾶν ῥῆμα signifie que Raphaël ne taira rien; cette formulation française est plus naturelle que le littéral « aucune parole ».
- source_word: εἴρηκα δὴ
  choice: Car je l’ai bien dit
  rationale: Le passé composé rend naturellement le parfait grec, tandis que « bien » restitue l’insistance de δή. « Car » explicite le lien discursif suggéré par la maxime qui suit.
- source_word: μυστήριον βασιλέως
  choice: le secret d’un roi
  rationale: Dans cette maxime, μυστήριον désigne une affaire confidentielle, sans imposer le sens théologique ultérieur de « mystère ».
- source_word: κρύψαι καλόν
  choice: Il est bon de garder
  rationale: Cette tournure conserve la portée générale de la maxime. « Garder le secret » est idiomatique en français et rend l’idée de dissimulation exprimée par κρύψαι.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: les œuvres de Dieu
  rationale: « Œuvres » conserve l’ampleur de ἔργα ainsi que sa résonance biblique, tout en restant compréhensible en français moderne.
- source_word: ἀνακαλύπτειν
  choice: révéler
  rationale: Le verbe signifie dévoiler ou faire connaître et forme un contraste net avec « garder le secret ».
- source_word: ἐνδόξως
  choice: avec honneur
  rationale: L’adverbe peut signifier d’une manière glorieuse ou honorable. « Avec honneur » décrit naturellement la manière convenable de faire connaître les œuvres de Dieu sans ajouter qu’elles seraient elles-mêmes glorifiées.
theological_decisions:
- issue: Sens de μυστήριον dans une maxime de sagesse
  choice: secret
  alternative: mystère
  rationale: Le contexte concerne une information royale confidentielle et ne requiert pas le sens doctrinal ou apocalyptique de « mystère ».
- issue: Portée de ἐνδόξως
  choice: avec honneur
  alternative: glorieusement
  rationale: Le grec permet les deux nuances. Le choix retenu présente l’adverbe comme décrivant la manière digne de révéler les œuvres de Dieu, sans trancher en faveur d’une notion plus forte de gloire.
translation_notes:
  register: Français international moderne, digne et lisible. La maxime garde une structure équilibrée; « garder le secret » et « révéler » rendent clairement son contraste. Tous les marqueurs de note figurent dans le texte.
