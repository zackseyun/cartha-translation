  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: fr
  text: Et maintenant, rendez grâce à Dieu[a], car je monte vers celui qui m’a envoyé. Mettez par écrit dans un livre tout ce qui s’est accompli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaissez Dieu » ou « louez Dieu » ; le verbe grec peut désigner une reconnaissance exprimée par l’action de grâce ou la louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: rendez grâce
  rationale: Avec Dieu comme complément au datif, le verbe désigne ici naturellement la reconnaissance exprimée par l’action de grâce ou la louange, plutôt que la confession des péchés.
- source_word: ἀναβαίνω
  choice: je monte
  rationale: Le présent exprime l’action imminente et conserve le mouvement ascendant ainsi que sa portée céleste, sans ajouter l’idée interprétative de retour.
- source_word: τὸν ἀποστείλαντά με
  choice: celui qui m’a envoyé
  rationale: Cette proposition relative rend naturellement le participe grec sans préciser davantage l’identité de celui qui envoie.
- source_word: γράψατε
  choice: mettez par écrit
  rationale: L’impératif demande de consigner les événements; cette formulation française est claire et naturelle tout en restant proche du sens de γράφω.
- source_word: πάντα τὰ συντελεσθέντα
  choice: tout ce qui s’est accompli
  rationale: Le participe parfait passif présente des faits menés à leur terme; « s’est accompli » préserve mieux cette nuance que le simple « est arrivé ».
- source_word: εἰς βιβλίον
  choice: dans un livre
  rationale: La formule désigne la consignation dans un document écrit; « livre » reste accessible et n’impose pas le support plus précis d’un rouleau.
theological_decisions:
- issue: Portée de la déclaration de Raphaël sur sa montée vers celui qui l’a envoyé
  choice: Conserver l’idée d’une montée vers « celui qui m’a envoyé » sans identifier explicitement ce dernier dans cette proposition.
  alternative: Traduire « je retourne auprès de Dieu qui m’a envoyé ».
  rationale: Le contexte implique Dieu comme envoyeur, mais le grec maintient ici la désignation indirecte et parle de montée, non explicitement de retour.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel est rendu par « rendez » et « mettez ». Deux phrases remplacent le point-virgule grec afin d’assurer une lecture naturelle sans modifier la logique du verset.
