  text: But those who sin are enemies of their own life[a].
translation:
  language: fr
  text: Mais ceux qui pèchent sont ennemis de leur propre vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ennemis de leur propre âme ». Le mot grec a un sens assez large, mais « vie » est ici la traduction la plus directe.
    reason: Alternative lexicale pour ζωή, signalant une traduction traditionnelle possible sans la privilégier.
lexical_decisions:
- source_word: οἱ ... ἁμαρτάνοντες
  choice: ceux qui pèchent
  rationale: Le participe présent substantivé désigne les personnes qui commettent le péché. « Ceux qui pèchent » conserve la valeur verbale de l’expression grecque et reste naturel en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec l’affirmation précédente ; « Mais » le rend clairement.
- source_word: πολέμιοί
  choice: ennemis
  rationale: Le terme exprime l’hostilité et s’emploie ici comme attribut ; « ennemis » en est l’équivalent français direct et idiomatique.
- source_word: τῆς ἑαυτῶν ζωῆς
  choice: de leur propre vie
  rationale: Le réfléchi ἑαυτῶν souligne que leur hostilité se retourne contre ce qui leur appartient en propre, et ζωή désigne normalement la vie. Le singulier collectif du grec est conservé naturellement.
theological_decisions:
- issue: Sens de ζωή dans ce contexte moral et sapientiel
  choice: vie
  alternative: âme
  rationale: Le grec emploie ζωή, dont le sens ordinaire est « vie ». Ici, le terme peut englober la vie et le bien-être de la personne sans formuler une anthropologie technique. « Vie » évite donc d’introduire une distinction doctrinale absente du texte.
translation_notes:
  register: Français moderne, international et digne. La formulation est concise et proverbiale, tout en restant proche de la syntaxe et des images du grec.
