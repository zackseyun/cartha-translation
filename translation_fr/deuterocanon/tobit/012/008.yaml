  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: fr
  text: La prière avec le jeûne, l’aumône et la justice est une bonne chose. Mieux vaut peu avec justice que beaucoup avec injustice. Il est bon de faire l’aumône plutôt que d’amasser de l’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸν
  choice: est une bonne chose / Mieux vaut
  rationale: Le premier emploi garde l’évaluation simple « bon »; dans la comparaison introduite par ἢ, le français naturel appelle « mieux vaut », sans supposer un comparatif grec explicite.
- source_word: προσευχὴ μετὰ νηστείας
  choice: la prière accompagnée du jeûne
  rationale: « Accompagnée de » exprime l’association marquée par μετά sans préciser indûment le rapport entre la prière et le jeûne.
- source_word: ἐλεημοσύνης / ποιῆσαι ἐλεημοσύνην
  choice: de l’aumône / faire l’aumône
  rationale: « Aumône » désigne précisément le don aux nécessiteux et permet de conserver le lien lexical entre les deux occurrences.
- source_word: δικαιοσύνης / ἀδικίας
  choice: justice / injustice
  rationale: Dans ces maximes portant sur les pratiques et les biens, « justice / injustice » est naturel en français et conserve l’opposition lexicale et éthique.
- source_word: τὸ ὀλίγον / πολὺ
  choice: peu de biens / beaucoup
  rationale: Le grec substantive des quantités sans nom exprimé. « De biens » explicite sobrement ce qui est possédé, comme le suggère la maxime et sa conclusion sur l’or.
- source_word: καλὸν
  choice: Il est beau
  rationale: Cette formulation distingue καλόν de ἀγαθόν et préserve sa nuance de beauté ou de noblesse morale.
- source_word: θησαυρίσαι χρυσίον
  choice: amasser de l’or
  rationale: « Amasser » rend l’idée d’accumuler ou de mettre en réserve, sans ajouter la connotation nécessairement péjorative de « thésauriser » ou « entasser ».
theological_decisions:
- issue: Portée de δικαιοσύνη / ἀδικία
  choice: justice / injustice
  alternative: droiture / absence de droiture; conduite juste / conduite injuste
  rationale: Le contexte sapientiel et pratique permet aussi une portée personnelle et morale. « Justice / injustice » conserve toutefois la polysémie du grec et son opposition formelle, sans imposer une lecture strictement juridique ni confessionnelle.
- issue: Référent implicite de τὸ ὀλίγον et πολὺ
  choice: biens possédés ou acquis
  alternative: quantité indéterminée, sans complément explicite
  rationale: Le voisinage de « l’or » favorise une lecture matérielle, mais le grec ne précise ni le nom ni explicitement le mode d’acquisition. La formulation française rend la maxime intelligible tout en signalant cette ellipse en note.
translation_notes:
  register: Français international moderne, digne et proverbial. Le rythme ternaire de la première proposition est conservé. « Faire l’aumône » est courant et précis; « Il est beau » maintient la nuance propre de καλόν. Le marqueur [a] figure dans le texte principal.
