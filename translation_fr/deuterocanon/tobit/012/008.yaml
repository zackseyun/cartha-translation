revisions:
- from: La prière accompagnée du jeûne, de l’aumône et de la justice est une bonne chose. Mieux vaut peu de biens acquis avec justice que beaucoup acquis dans l’injustice.[a] Il est beau de faire l’aumône plutôt que d’amasser de l’or.
  to: La prière avec le jeûne, l’aumône et la justice est une bonne chose. Mieux vaut peu avec justice que beaucoup avec injustice. Il est bon de faire l’aumône plutôt que d’amasser de l’or.
  rationale: La révision retire l’ajout interprétatif concernant des biens prétendument acquis et conserve l’ellipse voulue de la maxime grecque. Elle emploie des formulations modernes et proverbiales, maintient les répétitions importantes (« aumône », « justice / injustice ») et ne requiert pas de note, puisque l’ambiguïté est désormais préservée dans le texte même.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:03Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « peu de biens acquis avec justice que beaucoup acquis dans l’injustice » ajoute à l’ellipse grecque un référent matériel (« biens ») et un mode d’obtention (« acquis ») que le texte ne précise pas. La note le reconnaît, mais elle ne neutralise pas cette précision indue dans le texte principal. Le reste rend fidèlement les trois maximes, y compris le lien entre les deux occurrences d’ἐλεημοσύνη.
  naturalness: Le français est globalement fluide et d’un registre sapientiel approprié. « Mieux vaut peu avec justice que beaucoup avec injustice » est à la fois naturel et suffisamment elliptique. « Il est bon de faire l’aumône » est plus idiomatique en français moderne international que « Il est beau de faire l’aumône », tout en rendant correctement l’évaluation positive de καλόν.
  terminology: « Aumône / faire l’aumône » rend précisément ἐλεημοσύνη et maintient la répétition lexicale. « Justice / injustice » est un choix français recevable pour δικαιοσύνη / ἀδικία dans ce contexte, sans réduire nécessairement ces termes au domaine judiciaire. « Amasser de l’or » rend bien θησαυρίσαι χρυσίον.
  issues:
  - severity: medium
    issue: Ajout de « biens acquis » dans la comparaison centrale.
    rationale: τὸ ὀλίγον et πολὺ sont employés sans nom ni verbe d’acquisition. Le texte français ne doit pas expliciter comme certain ce que la note identifie elle-même comme indéterminé.
  - severity: low
    issue: « Il est beau de faire l’aumône » est moins naturel dans le français moderne visé.
    rationale: Cette tournure est compréhensible, mais « Il est bon de faire l’aumône » exprime naturellement l’évaluation de καλόν sans imposer une distinction stylistique trop marquée avec ἀγαθόν.
  revised_text: La prière avec le jeûne, l’aumône et la justice est une bonne chose. Mieux vaut peu avec justice que beaucoup avec injustice. Il est bon de faire l’aumône plutôt que d’amasser de l’or.
