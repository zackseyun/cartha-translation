  text: And they stood up[a], and they did not see him.
translation:
  language: fr
  text: Ils se levèrent et ne le virent pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne le virent plus ». Le grec dit littéralement : « ils ne le virent pas »; dans le contexte, cela peut laisser entendre qu’il avait disparu de leur vue, sans le déclarer explicitement.'
    reason: alternative_lexical_contextual
lexical_decisions:
- source_word: ἀνέστησαν
  choice: ils se relevèrent
  rationale: L’aoriste de ἀνίστημι décrit ici un mouvement physique simple. « Se relevèrent » est naturel en français narratif et convient lorsque les personnages passent d’une position abaissée à la station debout.
- source_word: οὐκ εἶδον
  choice: ils ne le virent plus
  rationale: Le grec dit littéralement qu’ils ne le virent pas. En français, « ne le virent plus » exprime naturellement le constat qu’il n’était désormais plus visible, sans préciser le mécanisme de sa disparition.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin singulier renvoie à Raphaël ; le pronom objet français « le » restitue directement cette référence.
theological_decisions:
- issue: Faut-il expliciter la disparition miraculeuse sous-entendue ?
  choice: 'Conserver le point de vue des observateurs : « ils ne le virent plus »'
  alternative: « il disparut à leurs yeux »
  rationale: Le grec rapporte ce que les personnages constatent sans décrire explicitement comment Raphaël devient invisible. La traduction préserve cette retenue et n’ajoute aucun mécanisme au récit.
translation_notes:
  register: Français moderne, simple et digne. « Alors » assure naturellement l’enchaînement narratif ; « mais » rend l’opposition contextuelle entre le fait de se relever et celui de ne plus voir Raphaël.
