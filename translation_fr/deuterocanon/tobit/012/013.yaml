base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: fr
  text: 'Et lorsque tu n’as pas hésité à te lever et à laisser ton repas[b] pour aller envelopper le mort[a], le bien que tu faisais ne m’a pas échappé : j’étais avec toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préparer le mort pour son ensevelissement ». Le verbe grec peut désigner le fait d’envelopper un corps ou, plus largement, de le disposer pour l’ensevelissement.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec traduit par « repas » peut désigner un repas principal ; le moment exact de la journée n’est pas précisé ici.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: tu n’as pas hésité
  rationale: Cette expression naturelle en français rend l’absence d’hésitation ou de réticence et souligne la promptitude de l’action.
- source_word: ἀναστῆναι
  choice: à te lever
  rationale: Le verbe désigne ici concrètement le fait de se lever pendant le repas.
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: à laisser ton repas
  rationale: « Repas » évite de préciser indûment l’heure, puisque ἄριστον peut désigner un repas principal sans que le moment exact soit certain dans ce passage.
- source_word: ὅπως ἀπελθὼν
  choice: pour aller
  rationale: Cette tournure française exprime naturellement le but marqué par la construction grecque.
- source_word: περιστείλῃς τὸν νεκρόν
  choice: envelopper le mort
  rationale: περιστέλλω peut désigner l’action d’envelopper ou d’arranger un corps. Cette traduction reste proche du grec sans élargir l’action à l’ensemble de l’ensevelissement.
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  choice: le bien que tu faisais ne m’a pas échappé
  rationale: La formulation rend l’idiome de λανθάνω tout en conservant la valeur verbale et morale du participe ἀγαθοποιῶν.
- source_word: σὺν σοὶ ἤμην
  choice: j’étais avec toi
  rationale: Traduction directe qui préserve l’affirmation narrative de la présence de Raphaël.
theological_decisions:
- issue: Nature de la présence et de l’observation de Raphaël
  choice: Le texte affirme simplement que la bonne action de Tobit n’a pas échappé à Raphaël et que celui-ci était avec lui.
  alternative: Formuler le verset de manière à suggérer une doctrine plus générale de la connaissance, de la garde ou de la médiation angéliques.
  rationale: Le grec ne dépasse pas l’affirmation liée à cette scène. La traduction n’importe donc aucune conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste claire pour un large lectorat, tandis que « envelopper le mort » conserve la précision et l’ambiguïté du grec. Les deux appels de note figurent dans le texte principal.
