lexical_decisions:
- source_word: ἐκάλεσεν
  choice: appela
  rationale: L’aoriste de καλέω désigne ici simplement l’action d’appeler quelqu’un. « Appela » convient naturellement au récit sans ajouter l’idée plus formelle de convocation.
- source_word: τὸν ἄγγελον
  choice: l’ange
  rationale: Ἄγγελος peut désigner un messager ou un ange, mais le contexte de Tobit 12 identifie le personnage comme un être céleste ; « l’ange » rend donc au mieux son identité narrative.
- source_word: Λάβε
  choice: Prends
  rationale: L’impératif de λαμβάνω est ici direct et concerne la part offerte en rémunération. « Prends » est naturel en français moderne.
- source_word: τὸ ἥμισυ
  choice: la moitié
  rationale: L’expression désigne une moitié de l’ensemble mentionné ; « la moitié » est la formulation française idiomatique.
- source_word: πάντων
  choice: de tout
  rationale: Le génitif pluriel πάντων a une portée générale. Devant la proposition relative ὧν, « de tout ce que » constitue l’enchaînement français le plus naturel.
- source_word: ὧν
  choice: ce que
  rationale: Le pronom relatif introduit une proposition dont l’extrait grec fourni ne conserve pas la suite. « Ce que » restitue naturellement πάντων ὧν tout en laissant la phrase inachevée.
