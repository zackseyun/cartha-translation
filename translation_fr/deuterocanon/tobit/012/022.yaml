  text: And they acknowledged his great and wondrous works[b][a], because an angel of the Lord had appeared to them.
translation:
  language: fr
  text: Et ils célébraient ses grandes œuvres merveilleuses, racontant comment un ange du Seigneur leur était apparu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendaient grâce pour ses grandes œuvres merveilleuses », « reconnaissaient ouvertement ses grandes œuvres merveilleuses » ou « proclamaient ses grandes œuvres merveilleuses ». Le verbe grec peut exprimer la reconnaissance publique, l’action de grâce ou la louange selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un ange du Seigneur ». Le grec n’impose pas ici le sens défini « l’ange du Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: ils proclamaient
  rationale: Le verbe exprime ici une reconnaissance déclarée publiquement; avec pour objet les œuvres divines, « proclamaient » est naturel en français et conserve l’idée d’une déclaration ouverte sans la connotation moderne d’un aveu fautif.
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: ses œuvres grandes et merveilleuses
  rationale: « Œuvres » correspond directement à ἔργα; les adjectifs coordonnés rendent μεγάλα et θαυμαστά dans un registre digne et accessible.
- source_word: ὡς
  choice: puisque
  rationale: Dans ce contexte, ὡς peut introduire le motif de leur proclamation. « Puisque » restitue cette valeur causale tout en laissant la note signaler d’autres analyses possibles.
- source_word: ὤφθη αὐτοῖς
  choice: leur était apparu
  rationale: Le passif ὤφθη est idiomatiquement rendu par « apparut » dans les récits de manifestation; le plus-que-parfait français marque que l’apparition précède leur proclamation.
- source_word: ἄγγελος Κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise l’indéfini et évite d’imposer l’identification plus spécifique que pourrait suggérer « l’ange du Seigneur ».
theological_decisions:
- issue: Valeur définie ou indéfinie de ἄγγελος Κυρίου
  choice: un ange du Seigneur
  alternative: l’ange du Seigneur
  rationale: Le grec est sans article devant ἄγγελος. L’indéfini préserve cette formulation sans introduire une identification théologique que le texte n’exige pas.
- issue: Nuance de ἐξωμολογοῦντο appliqué aux œuvres de Dieu
  choice: ils proclamaient
  alternative: ils rendaient grâce pour / reconnaissaient ouvertement / célébraient
  rationale: Le contexte vise une déclaration reconnaissante des actes divins. « Proclamaient » conserve l’extériorité de cette reconnaissance sans décider qu’il s’agit exclusivement d’action de grâce ou de louange.
translation_notes:
  register: Français international moderne, digne et lisible. « Proclamaient » évite le sens pénitentiel ou judiciaire que « confessaient » évoque souvent aujourd’hui. La syntaxe reste proche du grec tout en étant naturelle en français.
