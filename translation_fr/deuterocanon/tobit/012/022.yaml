revisions:
- from: Et ils proclamaient ses œuvres grandes et merveilleuses,[a] puisqu’un ange du Seigneur leur était apparu.[b]
  to: Et ils célébraient ses grandes œuvres merveilleuses, racontant comment un ange du Seigneur leur était apparu.[a][b]
  rationale: La révision évite de trancher la valeur de ὡς en faveur de la causalité et adopte une formulation française moderne pour la déclaration célébrant les œuvres divines. Elle conserve l’indéfini de ἄγγελος et le plus-que-parfait narratif pour l’apparition antérieure.
