    issue: « puisqu’un ange du Seigneur leur était apparu » impose une lecture causale de ὡς.
    rationale: 'Dans cette construction, ὡς peut introduire notamment le contenu ou la manière: ils rapportaient/commentaient comment l’ange leur était apparu. La causalité n’est pas impossible, mais elle ne doit pas être imposée dans le texte courant.'
  - severity: low
    issue: « ses œuvres grandes et merveilleuses » est d’une syntaxe adjectivale marquée en français moderne.
    rationale: L’antéposition de « grandes » rend l’expression plus naturelle sans perdre les deux qualificatifs grecs.
