  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
translation:
  language: fr
  text: Pendant tous ces jours-là, je vous apparaissais[a], mais je n’ai ni mangé ni bu ; vous contempliez une vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pendant tous ces jours-là, je vous suis apparu ». Les imparfaits grecs peuvent souligner la durée de l’apparition et de la contemplation, ou être rendus plus simplement en français comme des faits passés.'
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Tous les jours
  rationale: Rend directement l’expression temporelle grecque et convient à la durée indiquée par l’imparfait qui suit.
- source_word: ὠπτανόμην ὑμῖν
  choice: je me montrais à vous
  rationale: L’imparfait exprime une manifestation prolongée au cours de cette période. « Se montrer » rend naturellement en français l’idée d’apparaître ou d’être rendu visible.
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: je n’ai ni mangé ni bu
  rationale: Préserve la double négation équilibrée du grec, avec un passé composé naturel dans le récit français.
- source_word: ἀλλὰ
  choice: mais ; ce que
  rationale: La construction française marque la correction contrastive du grec sans ajouter une explication absente du texte.
- source_word: ὅρασιν
  choice: une vision
  rationale: Conserve explicitement la catégorie visionnaire désignée par le grec, sans la réduire à une simple impression trompeuse.
- source_word: ὑμεῖς ἐθεωρεῖτε
  choice: ce que vous contempliez
  rationale: « Contempler » reflète la perception attentive portée par θεωρέω, tandis que l’imparfait « contempliez » préserve l’aspect continu.
theological_decisions:
- issue: Nature de la présence visible et des actes de Raphaël
  choice: Raphaël affirme qu’il se manifestait visiblement sans manger ni boire réellement, et qualifie de vision ce que ses interlocuteurs contemplaient.
  alternative: Réduire l’énoncé à l’idée que tout cela leur semblait seulement réel.
  rationale: Le grec oppose explicitement la manifestation de Raphaël à l’absence de nourriture et de boisson, puis emploie ὅρασιν. La formulation conserve cette tension surnaturelle sans développer une doctrine particulière de la corporéité angélique.
translation_notes:
  register: Français international moderne, digne et accessible. « Je me montrais » préserve l’aspect duratif sans la lourdeur de « j’étais en train de vous apparaître » ; « ce que vous contempliez, c’était une vision » produit un contraste naturel et maintient l’accent grec sur les observateurs.
