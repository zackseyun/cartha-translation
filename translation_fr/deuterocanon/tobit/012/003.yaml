  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: fr
  text: Car il m’a ramené auprès de toi en bonne santé, il a guéri ma femme, rapporté mon argent et, de même, il t’a guéri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγώχεν
  choice: a ramené
  rationale: Le parfait de ἄγω exprime ici le fait d’avoir conduit ou ramené Tobias auprès de son père ; le contexte du retour justifie « ramené ».
- source_word: ὑγιῆ
  choice: en bonne santé
  rationale: Rend directement l’idée d’être sain, bien portant, sans ajouter la notion distincte de sécurité.
- source_word: ἐθεράπευσεν
  choice: a guéri
  rationale: Le verbe désigne ici une guérison concrète, tant pour la femme de Tobias que pour Tobit.
- source_word: ἤνεγκεν
  choice: a rapporté
  rationale: Dans le contexte de l’argent récupéré puis ramené, « rapporté » est naturel et précis.
- source_word: ὁμοίως
  choice: de même
  rationale: Conserve explicitement le parallèle entre les deux guérisons.
