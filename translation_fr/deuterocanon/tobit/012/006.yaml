base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: fr
  text: 'Puis il les appela tous les deux à l’écart et leur dit : « Bénissez Dieu et rendez-lui grâce ; proclamez sa grandeur et rendez-lui grâce devant tous les vivants pour ce qu’il a fait avec vous.[a] Il est bon de bénir Dieu et d’exalter son nom, en faisant connaître avec honneur le récit des œuvres de Dieu ; et ne…[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « pour ce qu’il a fait pour vous ». Le grec dit littéralement « avec vous ».'
    reason: lexical_alternative
  - marker: b
    text: Le témoin grec fourni s’interrompt ici après « et ne… » ; la suite de l’interdiction se trouve au verset suivant.
    reason: textual_variant
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: il les appela tous les deux à l’écart
  rationale: Rend naturellement le participe narratif, les deux destinataires et l’idée d’un entretien privé, sans suggérer nécessairement une action clandestine.
- source_word: Εὐλογεῖτε τὸν θεόν
  choice: Bénissez Dieu
  rationale: Conserve l’idiome biblique de la bénédiction adressée à Dieu plutôt que de le réduire au seul verbe « louer ».
- source_word: ἐξομολογεῖσθε
  choice: rendez-lui grâce
  rationale: Dans ce contexte de reconnaissance publique des bienfaits divins, le verbe exprime l’action de grâce et l’aveu reconnaissant, non la confession des péchés.
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: proclamez sa grandeur
  rationale: La formulation française exprime l’attribution publique de grandeur à Dieu tout en conservant le substantif μεγαλωσύνη.
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: devant tous les vivants
  rationale: Reproduit l’étendue publique et universelle de la formule grecque dans un registre biblique intelligible.
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: pour ce qu’il a fait avec vous
  rationale: Préserve la valeur littérale de μετά, « avec », sans imposer la lecture contextuellement possible « pour vous ».
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: exalter son nom
  rationale: Expression biblique française établie qui garde l’image d’élévation et le sens d’honneur public.
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ
  choice: le récit des œuvres de Dieu
  rationale: Rend en français courant l’expression grecque comprimée, où λόγους désigne les paroles ou le récit portant sur les œuvres divines.
- source_word: ἐντίμως ὑποδεικνύντες
  choice: en faisant connaître avec honneur
  rationale: Conserve à la fois l’idée de manifestation ou de proclamation et la manière honorable, respectueuse, indiquée par ἐντίμως.
- source_word: καὶ μὴ
  choice: et ne…
  rationale: Le témoin fourni s’interrompt après le début de la prohibition ; l’ellipse signale honnêtement cette incomplétude.
theological_decisions:
- issue: Bénédiction adressée à Dieu
  choice: Bénissez Dieu
  alternative: Louez Dieu
  rationale: « Bénissez » maintient l’idiome théologique propre à εὐλογεῖτε sans le remplacer par un terme plus général.
- issue: Valeur de ἐξομολογεῖσθε
  choice: rendez-lui grâce
  alternative: confessez-le / louez-le
  rationale: Les actes de Dieu sont ici reconnus publiquement avec gratitude ; « rendre grâce » correspond le mieux au mouvement du passage.
- issue: Action de Dieu exprimée avec μετά
  choice: ce qu’il a fait avec vous
  alternative: ce qu’il a fait pour vous
  rationale: 'La traduction retient l’ambiguïté réelle de la préposition : l’action peut être comprise comme accomplie avec eux ou, par implication contextuelle, en leur faveur.'
translation_notes:
  register: Français international moderne, digne et accessible. Le texte garde les expressions bibliques « bénir Dieu » et « exalter son nom », tout en reformulant naturellement les syntagmes grecs comprimés. Les marqueurs [a] et [b] figurent dans le texte principal.
