base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: fr
  text: L’aumône délivre de la mort, et elle purifiera de tout péché. Ceux qui font des aumônes et des œuvres de justice seront remplis de vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront rassasiés de vie ».'
    reason: Le verbe πίμπλημι, ici au futur passif avec le génitif, peut exprimer le fait d’être rempli ou d’être rassasié de quelque chose.
lexical_decisions:
- source_word: ἐλεημοσύνη / ἐλεημοσύνας
  choice: l’aumône / l’aumône
  rationale: Dans ce contexte, le terme désigne concrètement les dons faits aux personnes dans le besoin. « L’aumône » conserve ce sens précis, là où « charité » pourrait évoquer une disposition plus générale.
- source_word: ῥύεται
  choice: délivre
  rationale: Le verbe exprime la délivrance hors d’un danger. « Délivre de la mort » est naturel en français et ne précise pas au-delà du grec la nature de cette délivrance.
- source_word: ἀποκαθαριεῖ
  choice: purifiera de
  rationale: Le composé exprime une purification qui ôte ce qui souille. La tournure française « purifier de tout péché » rend naturellement cette idée, sans atténuer l’affirmation du texte.
- source_word: πᾶσαν ἁμαρτίαν
  choice: tout péché
  rationale: Cette formulation conserve la portée globale de πᾶσαν avec le singulier ἁμαρτίαν.
- source_word: ποιοῦντες
  choice: pratiquent
  rationale: Le participe indique une conduite active et habituelle. « Pratiquent » convient naturellement aux deux réalités coordonnées.
- source_word: δικαιοσύνας
  choice: la justice
  rationale: Le pluriel grec renvoie ici vraisemblablement à des actes justes ou à une conduite droite. « La justice », mise en parallèle avec « l’aumône » après « pratiquent », garde le terme biblique tout en faisant entendre sa dimension concrète.
- source_word: πλησθήσονται ζωῆς
  choice: seront remplis de vie
  rationale: 'La formulation préserve l’image du passif grec et laisse ouverte la portée de « vie » : durée de vie, vitalité ou plénitude de bénédiction.'
theological_decisions:
- issue: Rapport entre l’aumône, la délivrance de la mort et la purification du péché
  choice: Conserver l’affirmation directe selon laquelle l’aumône délivre de la mort et purifiera de tout péché.
  alternative: Reformuler comme un principe général sur les bienfaits de la générosité, ou préciser que l’aumône n’agit que comme expression de la repentance.
  rationale: Le grec énonce directement cette relation. La traduction en préserve la tension théologique sans lui ajouter une explication doctrinale absente du verset.
- issue: Sens de δικαιοσύνας dans ce contexte sapientiel
  choice: Traduire par « la justice » dans une construction qui évoque sa mise en pratique.
  alternative: « les actes justes » ou « la conduite droite »
  rationale: Le pluriel grec suggère des actes concrets, mais « la justice » maintient le terme biblique et demeure clair avec le verbe « pratiquent ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en évitant des formulations artificielles. Le présent de « délivre » et le futur de « purifiera » reproduisent l’alternance temporelle du texte source.
