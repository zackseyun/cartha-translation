- from: L’aumône délivre de la mort, et elle purifiera de tout péché. Ceux qui pratiquent l’aumône et la justice seront remplis de vie[a].
  to: L’aumône délivre de la mort, et elle purifiera de tout péché. Ceux qui font des aumônes et des œuvres de justice seront remplis de vie[a].
  rationale: La révision conserve l’affirmation directe et théologiquement exigeante du grec, sans l’expliquer ni l’atténuer. Elle restitue les deux pluriels de la seconde phrase par « des aumônes et des œuvres de justice » et corrige l’explication lexicale de la note, tout en maintenant l’image ouverte de personnes « remplies de vie ».
