  source_fidelity: La première proposition rend fidèlement ἐλεημοσύνη, ἐκ θανάτου ῥύεται et ἀποκαθαριεῖ πᾶσαν ἁμαρτίαν, y compris l’alternance présent/futur. Dans la dernière proposition, le grec emploie deux pluriels (ἐλεημοσύνας καὶ δικαιοσύνας), qui désignent des actes concrets ; « l’aumône et la justice » les généralise davantage.
  naturalness: « L’aumône délivre de la mort » et « purifiera de tout péché » sont naturels dans un registre biblique moderne. « Font des aumônes et des œuvres de justice » rend plus explicitement et naturellement la portée pratique des deux pluriels grecs que « pratiquent l’aumône et la justice ».
  terminology: '« Aumône » garde la spécificité du don fait aux nécessiteux. « Œuvres de justice » préserve le lien avec δικαιοσύνη tout en rendant son pluriel et son sens pratique dans ce contexte, sans réduire le terme à l’administration de la justice. La note doit corriger l’identification du verbe grec : πλησθήσονται relève de πίμπλημι, non de πληρόω.'
