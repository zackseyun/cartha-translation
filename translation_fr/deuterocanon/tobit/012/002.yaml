  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
translation:
  language: fr
  text: 'Il dit : « Père, je ne perds rien à lui donner la moitié de ce que j’ai rapporté.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec peut se rendre : « je ne subis aucun tort après lui avoir donné la moitié de ce que j’ai apporté ». Dans le contexte, Tobie affirme qu’une telle rémunération ne le léserait pas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ
  choice: Père
  rationale: Vocatif direct adressé par Tobie à son père. En français, « Père » sans possessif conserve la sobriété et l’immédiateté du grec.
- source_word: οὐ βλάπτομαι
  choice: je ne perds rien
  rationale: La forme exprime ici l’absence de préjudice ou de perte. Cette tournure française naturelle convient au contexte d’une rémunération prélevée sur les biens rapportés.
- source_word: δοὺς αὐτῷ
  choice: à lui donner
  rationale: Le participe aoriste indique la circonstance liée au verbe principal; l’infinitif précédé de « à » exprime naturellement en français le fait de donner sans imposer une valeur temporelle trop précise.
- source_word: τὸ ἥμυσυ
  choice: la moitié
  rationale: Équivalent français courant du substantif neutre grec désignant la moitié.
- source_word: ὧν ἐνήνοχα
  choice: de ce que j’ai rapporté
  rationale: Le parfait grec présente une action accomplie dont le résultat demeure. « Rapporté » convient au retour de voyage et peut désigner l’argent ou les biens ramenés, sans préciser au-delà du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La phrase conserve l’ambiguïté référentielle de « ce que » et évite de préciser « argent » ou « biens », que le grec ne nomme pas explicitement.
