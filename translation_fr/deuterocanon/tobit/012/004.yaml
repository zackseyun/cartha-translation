  yaml_path: translation/deuterocanon/tobit/012/004.yaml
  text: And the elder said, “It is justified for him.”
translation:
  language: fr
  text: 'Et le vieillard dit : « Cela lui revient de droit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: le vieillard
  rationale: Rend directement le substantif grec désignant l’homme âgé, sans ajouter un nom absent de cette phrase.
- source_word: Δικαιοῦται αὐτῷ
  choice: Cela lui revient de droit
  rationale: Exprime naturellement en français l’idée impersonnelle que la chose en question est légitimement due à cette personne, tout en évitant de transformer αὐτῷ en sujet personnel.
theological_decisions:
- issue: Sujet implicite de Δικαιοῦται
  choice: Conserver une formulation impersonnelle avec « cela »
  alternative: « Il est justifié » ou « Il y a droit »
  rationale: Le grec ne dit pas que la personne est déclarée juste ; le datif αὐτῷ désigne plutôt le bénéficiaire. « Cela lui revient de droit » préserve donc le sens sans introduire une affirmation doctrinale sur sa justification.
translation_notes:
  register: Français moderne, sobre et digne. La tournure idiomatique « revient de droit » clarifie le caractère légitime de ce qui est dû tout en restant proche de la syntaxe grecque.
