  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: fr
  text: Et maintenant, Dieu m’a envoyé pour te guérir, ainsi que Sara, ta belle-fille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sara, la jeune épouse de ton fils ». Le grec νύμφη peut désigner une jeune épouse ou une belle-fille.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Cette formulation conserve à la fois le lien avec ce qui précède et la transition temporelle.
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: Dieu m’a envoyé
  rationale: Le passé composé exprime naturellement en français une mission accomplie dont l’effet se poursuit dans la situation présente.
- source_word: ἰάσασθαί σε
  choice: pour te guérir
  rationale: « Guérir » rend le sens large de ἰάομαι et convient à l’affliction de Tobit sans la préciser davantage.
- source_word: καὶ τὴν νύμφην σου Σάρραν
  choice: ainsi que Sara, ta belle-fille
  rationale: Le second complément dépend également de « guérir ». Puisque Raphaël s’adresse à Tobit et que Sara est l’épouse de son fils, « belle-fille » exprime clairement la relation probable; l’autre sens possible de νύμφη est conservé en note.
theological_decisions:
- issue: Sens de νύμφη dans la relation entre Tobit et Sara
  choice: ta belle-fille
  alternative: ta jeune épouse, ou la jeune épouse de ton fils
  rationale: νύμφη peut désigner une jeune épouse ou une belle-fille. Dans le contexte, Tobit est l’interlocuteur et Sara a épousé son fils; « belle-fille » évite donc de laisser entendre qu’elle serait l’épouse de Tobit, tout en signalant l’ambiguïté lexicale dans la note.
translation_notes:
  register: Français moderne, courant et digne. « Ainsi que » permet de coordonner naturellement Sara avec le pronom objet « te » sans alourdir la phrase par la répétition de « guérir ».
