    rationale: En français courant, « mémorial » évoque d’abord un monument ou une commémoration. « Souvenir » rend naturellement μνημόσυνον, tandis que la note maintient la possible connotation cultuelle.
  - severity: low
    issue: « présent à tes côtés » est légèrement explicatif
    rationale: συμπαρήμην σοι signifie directement « j’étais avec toi / auprès de toi ». « À tes côtés » peut suggérer plus nettement un soutien ou une solidarité ; « auprès de toi » reste proche et naturel.
