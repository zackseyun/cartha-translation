base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: fr
  text: Et maintenant, lorsque toi et Sara, ta jeune épouse, vous priiez, j’ai présenté le souvenir de votre prière devant le Saint.[a] Et lorsque tu enterrais les morts, j’étais moi aussi auprès de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Saint » désigne ici Dieu. Le grec peut aussi évoquer un « mémorial » de votre prière, avec une possible résonance cultuelle, comparable à celle d’une offrande commémorative.
    reason: Précise le référent contextuel de « le Saint » et conserve la nuance lexicale et cultuelle possible de μνημόσυνον.
lexical_decisions:
- source_word: νῦν
  choice: maintenant
  rationale: Adverbe temporel courant, qui marque naturellement la transition dans le discours.
- source_word: προσηύξω
  choice: vous priiez
  rationale: L’imparfait français rend l’action en cours évoquée dans la proposition temporelle, malgré l’aoriste grec.
- source_word: νύμφη
  choice: jeune épouse
  rationale: νύμφη peut désigner une mariée ou une jeune épouse. Dans ce contexte suivant le mariage, « jeune épouse » est naturel et conserve la nuance sans laisser entendre que la cérémonie est encore en cours.
- source_word: προσήγαγον
  choice: j’ai présenté
  rationale: Le verbe exprime l’action d’amener ou de présenter quelque chose devant quelqu’un; « présenté » convient bien à l’introduction de la prière dans la présence divine.
- source_word: μνημόσυνον
  choice: le mémorial
  rationale: Ce choix conserve la formulation religieuse et l’éventuelle résonance cultuelle du terme, sans préciser davantage que le grec s’il s’agit d’un souvenir ou d’une offrande commémorative.
- source_word: τῆς προσευχῆς ὑμῶν
  choice: de votre prière
  rationale: Le singulier du grec est conservé; le possessif pluriel renvoie à Tobie et Sara.
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: devant le Saint
  rationale: Rend littéralement le titre substantivé et préserve sa solennité. Le contexte indique qu’il s’agit de Dieu.
- source_word: ἐθάπτες
  choice: tu enterrais
  rationale: L’imparfait grec suggère une action répétée ou habituelle; l’imparfait français en garde la valeur aspectuelle.
- source_word: τοὺς νεκρούς
  choice: les morts
  rationale: Formulation française directe, naturelle et fidèle.
- source_word: ὡσαύτως
  choice: également
  rationale: Marque clairement la correspondance avec l’action précédente dans une tournure française actuelle.
- source_word: συμπαρήμην σοι
  choice: j’étais présent à tes côtés
  rationale: Exprime la présence accompagnatrice contenue dans le verbe composé, sans ajouter l’idée plus forte de soutien ou d’intervention.
theological_decisions:
- issue: Référent de τοῦ ἁγίου (« le Saint »)
  choice: Dieu, désigné par le titre « le Saint »
  alternative: un être céleste saint ou une présence angélique
  rationale: Raphaël affirme avoir présenté la prière dans la présence divine. Le titre grec est conservé sans remplacer le référent par le nom « Dieu », tandis qu’une note explicite l’identification contextuelle.
- issue: Portée cultuelle de μνημόσυνον
  choice: « le mémorial », sans explicitation dans le corps du texte
  alternative: « le souvenir » ou « l’offrande commémorative »
  rationale: Le terme peut évoquer un souvenir porté devant Dieu et possiblement une catégorie cultuelle. La traduction maintient cette tension plutôt que de choisir une interprétation étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est maintenu dans l’adresse singulière à Tobie, tandis que « votre » et « vous priiez » incluent Tobie et Sara. La syntaxe conserve le parallélisme des deux propositions temporelles grecques.
