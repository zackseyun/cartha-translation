base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: fr
  text: N’as-tu pas eu honte, toi qui es un homme, ô le plus bestial des êtres, de couper les langues à tes semblables[a], issus des mêmes éléments[b], puis, après l’avoir ainsi mutilé, de le torturer ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui éprouvent les mêmes souffrances » ou « qui sont sujets aux mêmes passions ». Le grec peut désigner le partage des mêmes expériences, affections ou conditions.
    reason: lexical_alternative
  - marker: b
    text: L’expression « issus des mêmes éléments » reprend un terme philosophique grec évoquant la constitution matérielle commune des êtres humains.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: N’as-tu pas eu honte
  rationale: La question de reproche conserve la force morale du verbe grec et demeure naturelle en français.
- source_word: ἄνθρωπος ὢν
  choice: toi qui es un homme
  rationale: La tournure met en relief la contradiction entre l’humanité du destinataire et sa conduite bestiale.
- source_word: θηριωδέστατε
  choice: être plus bestial que tous
  rationale: Le superlatif vocatif et l’image animale sont tous deux conservés dans une formulation française intelligible.
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: des êtres qui partagent la même condition
  rationale: Cette formulation préserve l’idée d’une commune condition ou vulnérabilité humaine sans limiter le terme aux seules souffrances présentes.
- source_word: ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: qui sont issus des mêmes éléments
  rationale: « Éléments » maintient la terminologie philosophique relative à la constitution matérielle commune des humains.
- source_word: γλωττοτομῆσαι
  choice: couper la langue
  rationale: Le verbe composé désigne la mutilation de la langue; l’expression française rend directement la violence de l’acte.
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  choice: puis, après l’avoir ainsi mutilé
  rationale: « Mutilé » convient au contexte immédiat, tandis que le pronom singulier respecte le passage grec du groupe à l’individu torturé.
- source_word: βασανίσαι
  choice: de le torturer
  rationale: Dans ce contexte de martyre, le verbe désigne clairement une torture physique sévère.
theological_decisions:
- issue: Contraste anthropologique entre ἄνθρωπος ὢν et θηριωδέστατε
  choice: Conserver explicitement l’opposition entre l’homme et la bête.
  alternative: « bien que tu sois humain, homme d’une extrême cruauté »
  rationale: L’accusation repose sur l’ironie d’un homme qui agit de façon bestiale; conserver l’image respecte la rhétorique sans ajouter de thèse doctrinale.
- issue: Sens de στοιχεῖα dans la constitution humaine
  choice: Traduire par « éléments » dans le texte principal.
  alternative: « composants fondamentaux » ou « même constitution matérielle »
  rationale: Le mot grec porte une nuance philosophique authentique que « éléments » préserve sans l’expliciter excessivement.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La question accusatrice et le contraste rhétorique entre humanité et bestialité sont maintenus. Les deux notes signalent l’étendue sémantique de ὁμοιοπαθεῖς et la portée philosophique de στοιχεῖα.
