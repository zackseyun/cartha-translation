revisions:
- from: N’as-tu pas eu honte, toi qui es un homme, être plus bestial que tous, de couper la langue à des êtres qui partagent la même condition[a] et qui sont issus des mêmes éléments[b], puis, après l’avoir ainsi mutilé, de le torturer ?
  to: N’as-tu pas eu honte, toi qui es un homme, ô le plus bestial des êtres, de couper les langues à tes semblables[a], issus des mêmes éléments[b], puis, après l’avoir ainsi mutilé, de le torturer ?
  rationale: La révision corrige la construction française de l’apostrophe superlative, restitue le pluriel de l’acte de mutilation et conserve le changement intentionnel du pluriel (« tes semblables ») au singulier (« l’avoir », « le »). Les notes restent ancrées aux expressions qu’elles expliquent et préservent l’ouverture sémantique du grec.
