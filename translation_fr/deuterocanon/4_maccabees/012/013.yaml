review_pass:
  verdict: revise
  source_fidelity: La syntaxe et les référents grecs sont globalement bien reconnus, notamment le pluriel de γλωττοτομῆσαι et le retour au singulier τοῦτον. Toutefois, « couper la langue » perd le pluriel explicite (« les langues »), et « être plus bestial que tous » ne rend ni le vocatif ni le superlatif de façon grammaticalement intégrée en français.
  naturalness: 'La phrase actuelle est grammaticalement défectueuse : « toi qui es un homme, être plus bestial que tous » juxtapose un infinitif sans construction possible. Une apostrophe vocative permet de conserver l’invective tout en produisant une phrase française moderne et naturelle.'
  terminology: « éléments » conserve à juste titre στοιχεῖα, avec une note explicative adéquate. « Tes semblables » rend naturellement ὁμοιοπαθεῖς dans cette invective fondée sur la commune condition humaine, sans réduire indûment le mot à une seule acception. La note maintient les possibilités « mêmes souffrances » et « mêmes passions ».
  issues:
  - severity: high
    issue: Construction syntaxique de l’invective
    rationale: « être plus bestial que tous » est un infinitif isolé après « toi qui es un homme » et ne peut pas fonctionner comme la traduction du vocatif θηριωδέστατε. Il faut une apostrophe ou une apposition nominale.
  - severity: medium
    issue: Pluriel de γλωττοτομῆσαι
    rationale: Le grec vise explicitement « les langues » (γλώττας sous-entendu dans le composé, avec objet pluriel τοὺς ὁμοιοπαθεῖς). « Couper la langue » neutralise ce pluriel.
  - severity: low
    issue: Rendu de ὁμοιοπαθεῖς
    rationale: « Des êtres qui partagent la même condition » reste compréhensible, mais « tes semblables » est plus idiomatique et fait mieux ressortir l’appel rhétorique à l’humanité commune, sans supprimer l’ambiguïté documentée en note.
  revised_text: N’as-tu pas eu honte, toi qui es un homme, ô le plus bestial des êtres, de couper les langues à tes semblables[a], issus des mêmes éléments[b], puis, après l’avoir ainsi mutilé, de le torturer ?
  revised_footnotes:
  - marker: a
    text: Ou « qui éprouvent les mêmes souffrances » ou « qui sont sujets aux mêmes passions ». Le grec peut désigner le partage des mêmes expériences, affections ou conditions.
    reason: lexical_alternative
  - marker: b
    text: L’expression « issus des mêmes éléments » reprend un terme philosophique grec évoquant la constitution matérielle commune des êtres humains.
    reason: cultural_note
  revision_rationale: La révision corrige la construction française de l’apostrophe superlative, restitue le pluriel de l’acte de mutilation et conserve le changement intentionnel du pluriel (« tes semblables ») au singulier (« l’avoir », « le »). Les notes restent ancrées aux expressions qu’elles expliquent et préservent l’ouverture sémantique du grec.
