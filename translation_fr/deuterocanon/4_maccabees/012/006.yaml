  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: fr
  text: Tout en les exhortant ainsi, il fit venir la mère du jeune homme afin que, pris de pitié pour elle qui avait été privée de tant de fils, il la persuade de rendre docile celui qui lui restait, pour son salut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour sa délivrance ». Ici, le mot grec désigne très probablement le fait d’échapper à la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν
  choice: insistant
  rationale: Le participe décrit la pression verbale persistante exercée dans le contexte; « insister » est naturel en français et n’adoucit pas la scène.
- source_word: μετεπέμψατο
  choice: il fit venir
  rationale: Le moyen grec signifie faire appeler ou envoyer chercher quelqu’un; « fit venir » rend naturellement l’action sans préciser un degré de contrainte absent du verbe.
- source_word: τοῦ παιδός
  choice: du jeune homme
  rationale: Dans ce récit, παῖς désigne le dernier des frères; « jeune homme » convient mieux que « garçon » au registre narratif et n’impose pas un âge trop bas.
- source_word: ἐλεήσας
  choice: pris de pitié pour elle
  rationale: Cette formule exprime le motif de compassion attribué au tyran sans donner au terme une coloration théologique excessive.
- source_word: στερηθεῖσαν
  choice: privée de
  rationale: Le participe passif indique qu’elle a été dépouillée de ses fils; « privée de » conserve cette voix et la violence implicite de la situation.
- source_word: παρορμήσειεν
  choice: il l’amène à
  rationale: Le verbe signifie pousser ou inciter quelqu’un à agir. « Amener à » restitue le mouvement persuasif sans réduire le terme à une simple demande.
- source_word: εὐπειθῆ ποιῆσαι
  choice: rendre docile
  rationale: L’expression vise à rendre le fils disposé à céder. « Docile » garde la nuance de soumission recherchée sans présenter cette obéissance comme moralement bonne.
- source_word: τὸν περιλειπόμενον
  choice: celui qui lui restait
  rationale: Cette formulation française naturelle désigne clairement le seul fils encore présent, sans ajouter explicitement « en vie », qui n’apparaît pas dans le mot lui-même.
- source_word: σωτηρίαν
  choice: pour qu’il soit sauvé
  rationale: La tournure verbale française garde la notion grecque de salut ou de délivrance et demeure naturelle; le contexte l’oriente vers une sauvegarde physique, tout en laissant perceptible l’étendue sémantique du terme.
theological_decisions:
- issue: Portée de σωτηρία dans le contexte du martyre
  choice: « pour qu’il soit sauvé », compris d’abord comme échapper à l’exécution
  alternative: « pour son salut » ou « pour sa délivrance »
  rationale: La scène concerne la tentative de préserver physiquement le dernier fils s’il cède. La formulation retenue évite toutefois de fermer entièrement la polysémie de σωτηρία; la note précise le sens contextuel le plus probable.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe maintient que le tyran veut pousser la mère à rendre son dernier fils docile, tout en évitant d’attribuer une valeur morale positive à cette docilité.
