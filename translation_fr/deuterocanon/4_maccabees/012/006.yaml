revisions:
- from: Tout en insistant ainsi, il fit venir la mère du jeune homme afin que, pris de pitié pour elle, privée de tant de fils, il l’amène à rendre docile, pour qu’il soit sauvé[a], celui qui lui restait.
  to: Tout en les exhortant ainsi, il fit venir la mère du jeune homme afin que, pris de pitié pour elle qui avait été privée de tant de fils, il la persuade de rendre docile celui qui lui restait, pour son salut[a].
  rationale: La révision remet le complément « celui qui lui restait » à sa place naturelle après « rendre docile » et remplace la proposition détachée « pour qu’il soit sauvé » par « pour son salut », qui reflète plus directement le nom grec σωτηρία tout en laissant la note préciser le sens contextuel de délivrance physique. « Tout en les exhortant ainsi » rend explicitement le participe παρακαλῶν dans son cadre narratif sans modifier le sens.
