review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : il fait venir la mère afin de la pousser à obtenir la soumission du dernier fils en vue de son salut/délivrance. Toutefois, la construction actuelle (« il l’amène à rendre docile, pour qu’il soit sauvé[a], celui qui lui restait ») sépare maladroitement l’objet de « rendre docile » et rend moins nette la relation syntaxique présente dans le grec.'
  naturalness: La phrase proposée est compréhensible, mais son ordre des constituants est peu naturel en français moderne. Placer « celui qui lui restait » immédiatement après « rendre docile » résout l’ambiguïté et améliore nettement la lisibilité.
  terminology: « Exhorter », « fit venir », « pris de pitié », « privée de tant de fils » et « rendre docile » conviennent au registre et au grec. « Salut » conserve l’amplitude lexicale de σωτηρία ; la note indique justement que le contexte vise très probablement la délivrance de la mort, sans imposer un sens doctrinal.
  issues:
  - severity: medium
    issue: Ordre syntaxique de l’infinitif et de son complément d’objet
    rationale: 'Dans « rendre docile, pour qu’il soit sauvé, celui qui lui restait », le complément d’objet est rejeté après une incise finale, ce qui alourdit la phrase et brouille l’enchaînement : la mère doit rendre docile le fils qui reste, en vue de son salut.'
