  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
translation:
  language: fr
  text: Mais toi, tu te lamenteras amèrement d’avoir mis à mort, sans motif[b], les champions de la vertu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les athlètes de la vertu » ou « ceux qui combattent pour la vertu » ; le terme grec évoque des concurrents engagés dans une lutte et possède ici une valeur honorifique.
    reason: lexical_alternative
  - marker: b
    text: Ou « injustement » ou « sans justification ». Le grec signifie littéralement « sans cause ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Rend le contraste marqué et l’adresse directe au tyran, tout en restant naturel en français.
- source_word: κακῶς οἰμώξεις
  choice: tu te lamenteras dans ta misère
  rationale: οἰμώζω désigne une lamentation douloureuse, tandis que κακῶς en accentue le caractère misérable ou funeste. Cette formulation conserve les deux éléments sans réduire κακῶς au seul sens de « vivement ».
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστάς
  choice: les champions de la vertu
  rationale: ἀγωνιστής évoque celui qui lutte dans une épreuve ou un combat. « Champions » en garde ici la valeur honorifique et l’image de la lutte morale.
- source_word: ἀναίτιως
  choice: sans motif
  rationale: Conserve l’idée littérale d’une absence de cause ou de justification, sans trancher explicitement entre « injustement » et « sans raison ».
- source_word: ἀποκτεῖναι
  choice: d’avoir fait mourir
  rationale: L’infinitif aoriste renvoie à l’acte accompli qui motive la lamentation. « D’avoir fait mourir » exprime clairement ce rapport en français et convient à une mise à mort ordonnée par le tyran.
theological_decisions:
- issue: Sens moral et philosophique de ἀρετή dans le contexte du martyre
  choice: vertu
  alternative: excellence morale
  rationale: « Vertu » maintient le vocabulaire éthique hellénistique de 4 Maccabées sans y importer une définition théologique postérieure.
- issue: Portée de ἀναίτιως
  choice: sans motif
  alternative: injustement
  rationale: Le grec peut signaler l’absence de cause, de culpabilité ou de justification. La traduction retenue préserve cette ouverture tout en laissant entendre le caractère injustifiable de l’exécution.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le ton demeure accusateur et solennel ; « dans ta misère » garde la force de κακῶς sans employer l’adverbe français peu naturel « misérablement » avec « se lamenter ».
