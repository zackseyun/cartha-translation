lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: réjouis
  rationale: Le participe exprime la joie suscitée par la promesse; la tournure participiale française conserve son lien avec le verbe principal.
- source_word: μάλιστα
  choice: particulièrement
  rationale: L’adverbe souligne fortement le motif de leur joie sans imposer un contraste absent du texte.
- source_word: ἐπαγγελίᾳ
  choice: promesse
  rationale: Le terme désigne ici l’engagement annoncé par le jeune homme; « promesse » est direct et naturel.
- source_word: τοῦ παιδός
  choice: du jeune homme
  rationale: παῖς peut désigner un enfant, un garçon, un serviteur ou un jeune; dans ce contexte narratif, « jeune homme » évite de suggérer à tort un très jeune enfant.
- source_word: ταχέως
  choice: rapidement
  rationale: L’adverbe indique qu’ils agissent sans tarder; « rapidement » en garde le sens premier.
- source_word: ἔλυσαν
  choice: détachèrent
  rationale: λύω signifie délier ou détacher; dans le contexte de la torture, le verbe évoque concrètement la libération de ses liens.
