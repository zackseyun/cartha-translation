  text: But if you are persuaded[a], you will be a friend, and you will have charge of the affairs of the kingdom.
translation:
  language: fr
  text: Mais si tu te laisses convaincre[a], tu seras un ami et tu seras chargé des affaires du royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si tu cèdes » ou « si tu obéis ».'
    reason: Le participe grec peut, dans ce contexte, évoquer non seulement le fait d’être convaincu, mais aussi celui de se laisser persuader au point d’acquiescer.
lexical_decisions:
- source_word: πεισθεὶς
  choice: si tu te laisses convaincre
  rationale: Le participe aoriste passif est employé ici avec une valeur conditionnelle. Cette formulation française naturelle conserve l’idée de persuasion sans expliciter davantage la soumission ou l’obéissance.
- source_word: φίλος
  choice: un ami du roi
  rationale: Le sens premier est « ami », mais, dans ce contexte de cour, il s’agit vraisemblablement du statut d’« Ami » du souverain. L’ajout « du roi » rend le référent implicite intelligible sans employer le terme potentiellement trompeur « favori ».
- source_word: ἔσῃ
  choice: tu deviendras
  rationale: Le futur de εἰμί signifie littéralement « tu seras ». En français, « tu deviendras » exprime naturellement l’accès promis à un nouveau statut dans ce contexte.
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: des affaires du royaume
  rationale: La tournure désigne les affaires relevant du pouvoir royal ou du royaume. « Affaires du royaume » est idiomatique et garde la portée administrative.
- source_word: ἀφήγησιν
  choice: tu seras chargé
  rationale: Le nom désigne ici la direction ou la conduite des affaires. La phrase française verbalise la construction elliptique grecque et rend l’idée d’une responsabilité administrative déléguée sans la surdéterminer.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse grecque au singulier. La formulation conserve la promesse de statut à la cour et de responsabilité politique, tout en évitant un vocabulaire administratif trop technique.
