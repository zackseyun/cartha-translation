  text: I will not renounce the testimony of my brothers[a].
translation:
  language: fr
  text: Je ne renierai pas le témoignage de mes frères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce dont mes frères ont témoigné »; dans ce contexte, le terme évoque aussi leur mort en martyrs.
    reason: Alternative lexicale et conservation de la résonance liée au martyre.
lexical_decisions:
- source_word: Οὐκ
  choice: ne… pas
  rationale: Négation directe portant sur le verbe.
- source_word: ἀπαντυμολοῶ
  choice: je ne renierai pas
  rationale: Le verbe exprime ici le refus de désavouer ou de répudier sous la contrainte. « Renier » est naturel en français et convient à la détermination du locuteur face à la persécution.
- source_word: μαρτυρίας
  choice: témoignage
  rationale: « Témoignage » conserve le sens lexical direct tout en laissant résonner, sans l’expliciter abusivement, le contexte de mise à mort pour la fidélité.
- source_word: τῶν ἀδελφῶν μου
  choice: de mes frères
  rationale: Dans le récit, il s’agit des frères du locuteur; la formulation masculine précise est donc appropriée.
theological_decisions:
- issue: Faut-il rendre μαρτυρίας par un terme explicitement lié au martyre ?
  choice: témoignage
  alternative: martyre; témoignage rendu
  rationale: Le contexte associe fortement ce témoignage à la mort des frères, mais le substantif grec garde son sens ordinaire de « témoignage ». Traduire par « martyre » lèverait une ambiguïté significative et importerait dans le texte une interprétation plus explicite que l’original.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur « je ne renierai pas » exprime une résolution ferme; « frères » désigne ici les frères masculins du locuteur.
