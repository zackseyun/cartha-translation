  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: fr
  text: Mais j’invoque le Dieu de mes ancêtres[a], afin qu’il fasse miséricorde à mon peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu de mes pères » ou « le Dieu ancestral ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à ma nation », « aux miens » ou, plus littéralement, « à ma lignée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: j’invoque
  rationale: Le verbe exprime ici un appel fervent adressé à Dieu. « J’invoque » est naturel dans le registre de la prière et demeure proche du grec.
- source_word: πατρῷον θεόν
  choice: le Dieu de mes ancêtres
  rationale: L’adjectif désigne ce qui appartient aux pères ou aux ancêtres. Cette formulation moderne conserve la portée historique et communautaire sans suggérer simplement un Dieu « paternel ».
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but ou la teneur de l’appel; « afin que » en maintient clairement la nuance.
- source_word: ἐλέως γένηται
  choice: qu’il fasse miséricorde
  rationale: La tournure prédicative demande que Dieu se montre miséricordieux. Cette expression française est idiomatique et n’implique pas que son caractère doive changer.
- source_word: τῷ γένει μου
  choice: à mon peuple
  rationale: γένος peut désigner la parenté, la lignée, le peuple ou la nation. Dans ce contexte d’intercession solidaire, « mon peuple » rend naturellement la portée collective tout en évitant les connotations modernes trompeuses de « race ».
theological_decisions:
- issue: Portée de τῷ γένει μου
  choice: mon peuple
  alternative: ma nation; les miens; ma lignée
  rationale: Le contexte favorise l’ensemble du peuple juif, mais le grec conserve une nuance possible de parenté ou de lignée; celle-ci est signalée en note.
- issue: Sens de πατρῷον θεόν
  choice: le Dieu de mes ancêtres
  alternative: le Dieu de mes pères; le Dieu ancestral
  rationale: « Dieu de mes ancêtres » garde la résonance ancestrale et historique de l’expression tout en étant immédiatement compréhensible en français international moderne.
translation_notes:
  register: Français moderne, digne et accessible. « J’invoque » maintient le registre de la prière; « fasse miséricorde » conserve la solennité biblique sans être archaïque. Les marqueurs suivent immédiatement les expressions concernées.
