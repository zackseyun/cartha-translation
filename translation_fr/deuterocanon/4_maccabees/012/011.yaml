base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: fr
  text: « Homme sacrilège, dit-elle, tyran le plus impie de tous les méchants, n’as-tu pas eu honte, après avoir reçu de Dieu les biens et la royauté, de tuer ses serviteurs et de torturer ceux qui s’exercent à la piété[a] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « les pratiquants de la piété » ou, plus littéralement, « les ascètes de la piété ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: Homme sacrilège
  rationale: Le vocatif ἀνόσιος dénonce celui qui viole ce qui est saint. « Sacrilège » conserve cette forte portée religieuse et morale dans un français actuel.
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: tyran le plus impie de tous les méchants
  rationale: Cette formulation garde l’accumulation injurieuse du grec, le superlatif ἀσεβέστατε et l’expression de classe πάντων τῶν πονηρῶν, sans les aplanir.
- source_word: οὐκ ᾐδέσθης
  choice: n’as-tu pas eu honte
  rationale: La question rhétorique exprime un reproche moral; cette tournure est naturelle et directe en français.
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ καὶ τὴν βασιλείαν
  choice: après avoir reçu de Dieu les biens et la royauté
  rationale: « Après avoir reçu » restitue la valeur antérieure du participe. « Les biens » préserve l’indétermination de τὰ ἀγαθὰ, tandis que « la royauté » désigne ici la dignité ou le pouvoir royal plutôt qu’un territoire.
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: ses serviteurs
  rationale: θεράπων désigne ceux qui servent Dieu sans préciser une fonction cultuelle ou institutionnelle particulière.
- source_word: κατακτείνειν
  choice: tuer
  rationale: Le verbe signifie mettre à mort; « tuer » reste direct sans ajouter la coloration plus forte de « massacrer ».
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: ceux qui s’exercent à la piété
  rationale: Cette traduction rend l’idée de pratique et d’entraînement portée par ἀσκητής, tout en évitant d’importer le sens technique plus tardif d’« ascète ».
- source_word: στρεβλοῦν
  choice: torturer
  rationale: Le verbe évoque une torture, notamment par torsion ou étirement; le terme général français convient puisque l’instrument n’est pas précisé.
theological_decisions:
- issue: Rendu de εὐσέβεια dans le contexte du martyre juif
  choice: piété
  alternative: attachement à Dieu
  rationale: « Piété » rend le terme grec de vertu religieuse sans le réduire à une simple observance extérieure. La formulation verbale « s’exercent à » en précise ici le caractère actif et discipliné.
- issue: Rendu de θεράποντας pour ceux qui appartiennent au service de Dieu
  choice: serviteurs
  alternative: ceux qui le servent
  rationale: « Serviteurs » conserve la relation à Dieu sans supposer un ministère ou un office religieux déterminé.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’apostrophe véhémente et l’accumulation rhétorique du grec, tout en restant intelligible à la lecture publique.
