  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: fr
  text: Mais toi, il te punira aussi dans la vie présente[a], et après ta mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « tant maintenant, dans cette vie, qu’après ta mort, il te punira ».'
    reason: La corrélation καὶ … καὶ peut être rendue plus explicitement par « tant… que… », tandis que νῦν peut recevoir la valeur adverbiale « maintenant ».
lexical_decisions:
- source_word: σὲ δὲ
  choice: Mais toi
  rationale: Le pronom placé en tête met fortement l’interlocuteur en relief, tandis que δὲ marque ici le contraste avec ce qui précède.
- source_word: καὶ … καὶ
  choice: aussi … et
  rationale: 'Les deux occurrences étendent et coordonnent la portée temporelle du châtiment : dès la vie présente, puis après la mort. Cette formulation reste naturelle en français tout en conservant cette double portée.'
- source_word: ἐν τῷ νῦν βίῳ
  choice: dans la vie présente
  rationale: Expression française claire qui maintient le contraste entre l’existence actuelle et ce qui suit la mort.
- source_word: θανόντα
  choice: après ta mort
  rationale: Le participe aoriste, accordé avec l’interlocuteur, a ici une valeur temporelle. « Après ta mort » l’exprime naturellement sans réduire l’affirmation à l’instant du décès.
- source_word: τιμωρήσεται
  choice: il te punira
  rationale: Le futur moyen à la troisième personne du singulier exprime une action punitive dont le sujet demeure implicite dans cette proposition. Le pronom « il » préserve cette agence sans nommer davantage le sujet.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: il te punira
  alternative: tu seras puni
  rationale: Le grec emploie une troisième personne du singulier au moyen, et non un passif. La traduction conserve donc un agent personnel implicite, sans l’identifier dans ce verset.
- issue: Portée temporelle du châtiment
  choice: dans la vie présente, et après ta mort
  alternative: maintenant dans cette vie et une fois mort
  rationale: Le texte affirme les deux horizons temporels sans atténuer la perspective d’un châtiment postérieur à la mort ni préciser sa nature.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond à σὲ. La formulation garde l’accent contrastif sur « toi » et laisse l’identité du sujet implicite dépendre du contexte.
