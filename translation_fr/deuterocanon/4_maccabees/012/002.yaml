revisions:
- from: 'Le tyran eut pitié de lui : bien que ses frères l’aient cruellement maltraité, il le voyait déjà chargé de chaînes[a],'
  to: Le tyran eut pitié de lui, bien que ses frères l’eussent cruellement maltraité, en voyant déjà les chaînes autour de lui[a],
  rationale: La correction essentielle rétablit l’accord syntaxique du participe κακισθείς avec « le tyran ». Elle ne cherche pas à harmoniser la formulation étonnante avec le contexte narratif ni avec l’audit anglais. Le participe ὁρῶν conserve aussi le tyran pour sujet, tandis que « lui » renvoie à l’antécédent de la relative, celui dont le tyran a pitié.
