  yaml_path: translation/deuterocanon/4_maccabees/012/002.yaml
  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
translation:
  language: fr
  text: Le tyran eut pitié de lui, bien que ses frères l’eussent cruellement maltraité, en voyant déjà les chaînes autour de lui[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant les chaînes autour de lui » ; autres traductions possibles : « enchaîné » ou « les chaînes passées autour de lui ».'
    reason: La construction grecque décrit concrètement les liens disposés autour de la personne et permet plusieurs formulations françaises.
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: eut pitié de lui
  rationale: Le participe exprime la pitié ou la compassion. Cette tournure est naturelle et conserve la valeur circonstancielle du grec.
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: Le terme porte ici un jugement moral sur le souverain persécuteur; « tyran » en maintient la force rhétorique.
- source_word: καίπερ
  choice: bien que
  rationale: Cette conjonction rend clairement la concession marquée par καίπερ.
- source_word: δεινῶς … κακισθείς
  choice: ses frères l’aient cruellement maltraité
  rationale: L’ensemble évoque un traitement particulièrement dur sans préciser davantage la forme des sévices. La voix passive grecque est transposée activement pour produire un français fluide.
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: ses frères
  rationale: Dans ce récit, ἀδελφοί désigne les frères masculins du jeune homme; le possessif français restitue αὐτοῦ naturellement.
- source_word: ὁρῶν
  choice: il le voyait
  rationale: Le sujet reste le tyran. Une proposition coordonnée évite l’ambiguïté qu’aurait en français un participe tel que « le voyant ».
- source_word: ἤδη
  choice: déjà
  rationale: Le mot indique que cet état était désormais réalisé.
- source_word: τὰ δεσμὰ περικείμενον
  choice: chargé de chaînes
  rationale: Cette expression naturelle garde l’image de chaînes placées autour de lui, sans réduire nécessairement δεσμά à une seule chaîne.
theological_decisions:
- issue: Terme de parenté masculin ἀδελφῶν
  choice: frères
  alternative: frères et sœurs
  rationale: Le contexte narratif concerne des frères masculins; une formulation inclusive modifierait le référent.
- issue: Titre évaluatif τύραννος
  choice: le tyran
  alternative: le roi
  rationale: Le grec emploie une désignation moralement chargée, qu’il ne convient pas de neutraliser.
- issue: Agent de κακισθείς
  choice: ses frères l’aient cruellement maltraité
  alternative: il ait été cruellement maltraité par ses frères
  rationale: Les deux constructions attribuent grammaticalement les mauvais traitements aux frères, même si le contexte plus large peut rendre cette formulation surprenante. La traduction conserve donc la tension du texte transmis plutôt que de corriger implicitement son sens.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule parce que le verset grec est syntaxiquement rattaché à la suite. Le deux-points clarifie le rapport entre la pitié du tyran et les circonstances observées, sans résoudre la difficulté contextuelle posée par « ses frères ».
