  - marker: a
    text: 'Littéralement : « ayant les chaînes autour de lui » ; autres traductions possibles : « enchaîné » ou « les chaînes passées autour de lui ».'
    reason: La construction grecque décrit concrètement les liens disposés autour de la personne et permet plusieurs formulations françaises.
  revision_rationale: La correction essentielle rétablit l’accord syntaxique du participe κακισθείς avec « le tyran ». Elle ne cherche pas à harmoniser la formulation étonnante avec le contexte narratif ni avec l’audit anglais. Le participe ὁρῶν conserve aussi le tyran pour sujet, tandis que « lui » renvoie à l’antécédent de la relative, celui dont le tyran a pitié.
