  text: And after praying these things[a], he threw himself onto the frying pans; and so he died.
translation:
  language: fr
  text: Après avoir fait cette prière, il se jeta sur les poêles, et c’est ainsi qu’il mourut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il rendit » ou « il remit », sous-entendu : sa vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: Après avoir fait cette prière
  rationale: Le participe aoriste κατευξάμενος présente la prière comme antérieure à l’action principale; ταῦτα renvoie au contenu des paroles précédentes. Cette formulation française restitue naturellement les deux éléments.
- source_word: ἑαυτὸν ἔρριψεν
  choice: il se jeta
  rationale: Le pronom réfléchi et le verbe ῥίπτω expriment un mouvement volontaire et énergique, sans qu’il soit nécessaire de le renforcer par « se précipita ».
- source_word: κατὰ τῶν τηγάνων
  choice: sur les poêles
  rationale: κατά avec le génitif indique ici un mouvement sur ou contre les instruments de torture; τηγάνων désigne des poêles. Le contexte indique qu’elles servent au supplice, mais le qualificatif « brûlantes » n’est pas explicite dans ce verset.
- source_word: οὕτως ἀπέδωκεν
  choice: c’est ainsi qu’il mourut
  rationale: Employé absolument dans ce récit de martyre, ἀπέδωκεν signifie qu’il rendit la vie, donc qu’il mourut. La traduction explicite le sens sans préciser indûment « l’âme » ou « l’esprit ».
theological_decisions:
- issue: Sens elliptique de ἀπέδωκεν dans le récit du martyre
  choice: il mourut
  alternative: il rendit [la vie / l’âme / l’esprit]
  rationale: Le complément de ἀπέδωκεν n’est pas exprimé en grec. « Il mourut » transmet le résultat certain tout en évitant d’ajouter une conception particulière de ce qui aurait été « rendu ».
translation_notes:
  register: Français moderne, sobre et narratif. « Poêles » conserve l’image concrète du grec, malgré son caractère inhabituel comme instrument de torture. Le marqueur de note est placé après « mourut », puisqu’il explique ἀπέδωκεν.
