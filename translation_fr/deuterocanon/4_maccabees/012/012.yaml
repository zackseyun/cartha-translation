base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/012.yaml
  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: fr
  text: En retour de ces actes, la justice divine te réserve un feu plus dense[a] et éternel, ainsi que des tourments qui ne te laisseront pas aller pendant l’âge tout entier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus épais ». Le terme grec signifie littéralement « plus dense » ; dans ce contexte, il peut évoquer un feu plus intense.'
    reason: Le qualificatif grec est inhabituel appliqué au feu et plusieurs compréhensions sont possibles.
  - marker: b
    text: 'L’expression grecque peut aussi se comprendre : « pour toute l’éternité » ou « à jamais ».'
    reason: Le nom αἰών peut désigner un âge, une durée indéfinie ou l’éternité selon le contexte.
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: En retour de ces actes
  rationale: Exprime la rétribution indiquée par ἀντί avec le relatif, sans réduire la formule à une simple cause.
- source_word: ταμιεύεταί
  choice: te réserve
  rationale: Rend naturellement en français l’idée de mettre en réserve ou d’accumuler en vue d’un usage futur.
- source_word: πυκνοτέρῳ
  choice: plus dense
  rationale: Conserve l’image inhabituelle du comparatif grec plutôt que de l’interpréter silencieusement comme « plus ardent » ou « plus intense ».
- source_word: αἰωνίῳ
  choice: éternel
  rationale: Rendu usuel et contextuellement approprié de l’adjectif appliqué au feu.
- source_word: εἰς ὅλον τὸν αἰῶνα
  choice: durant tout l’âge
  rationale: Préserve la formulation temporelle grecque et sa relation tendue avec « éternel », sans uniformiser les deux expressions.
- source_word: οὐκ ἀνήσουσί σε
  choice: ne te relâcheront pas
  rationale: Conserve l’image de tourments qui ne desserrent pas leur prise et maintient le sujet pluriel suggéré par la proposition relative.
theological_decisions:
- issue: Rapport entre αἰωνίῳ et εἰς ὅλον τὸν αἰῶνα
  choice: « éternel » puis « durant tout l’âge »
  alternative: « éternel » puis « pour toute l’éternité »
  rationale: La traduction retenue évite de rendre deux expressions grecques distinctes par le même vocabulaire et préserve leur éventuelle nuance.
- issue: Nature du feu décrit par πυκνοτέρῳ
  choice: « plus dense »
  alternative: « plus intense » ou « plus ardent »
  rationale: Le grec décrit littéralement une plus grande densité ou épaisseur; une reformulation en intensité thermique introduirait une interprétation non explicitée.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse polémique au singulier. La syntaxe reste claire tout en conservant les deux formulations temporelles distinctes et l’image singulière d’un feu « plus dense ».
