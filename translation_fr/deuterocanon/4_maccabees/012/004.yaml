base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: fr
  text: '« Tu vois l’issue de la folie de tes frères[a] : à cause de leur désobéissance, ils ont été torturés[b] et sont morts. Quant à toi, si tu n’obéis pas[c], malheureux, toi aussi tu mourras avant ton heure, après avoir été torturé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fin » ou « le résultat de la folie de tes frères ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut désigner plus précisément le fait d’être étiré ou disloqué sur un chevalet de torture.
    reason: cultural_note
  - marker: c
    text: Littéralement « si tu ne te laisses pas persuader » ; dans ce contexte, il s’agit de se soumettre à l’ordre donné.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  choice: l’issue
  rationale: Dans ce contexte, le nom désigne l’aboutissement visible de la conduite des frères. « L’issue » exprime naturellement la conséquence tout en laissant entendre leur fin tragique.
- source_word: ἀπονοίας
  choice: folie
  rationale: Le terme exprime ici, dans la bouche du persécuteur, une absence de jugement ou une conduite jugée insensée. « Folie » conserve la violence de cette appréciation hostile.
- source_word: ἀπείθειαν
  choice: désobéissance
  rationale: Le mot désigne leur refus de se soumettre à l’ordre reçu. « Désobéissance » convient à la situation coercitive et prépare le verbe « obéir » dans la phrase suivante.
- source_word: στρεβλωθέντες
  choice: ils ont été torturés
  rationale: Le participe peut évoquer plus précisément l’étirement ou la torsion sur un chevalet, mais le terme général « torturés » évite de préciser dans le texte principal un instrument qui n’est pas explicitement nommé.
- source_word: τεθήκασιν
  choice: gisent morts
  rationale: Le parfait exprime ici l’état résultant de la mort. « Gisent morts » conserve davantage l’image et la valeur d’état du grec qu’un simple « sont morts ».
- source_word: πεισθείης
  choice: tu n’obéis pas
  rationale: Le verbe signifie littéralement « être persuadé », mais il désigne ici le fait de céder et de se conformer à l’ordre du roi. « Obéir » rend cette portée pratique sans supprimer l’alternative littérale, signalée en note.
- source_word: ταλαί
  choice: malheureux
  rationale: 'Il s’agit vraisemblablement d’une apostrophe au vocatif, exprimant le mépris ou une pitié hostile : « malheureux ! ». Cette lecture respecte la forme grecque plutôt que de transformer le mot en adverbe qualifiant la torture.'
- source_word: βασανισθεὶς
  choice: après avoir été torturé
  rationale: Le participe aoriste indique que la torture précède la mort annoncée. La tournure française explicite naturellement cette relation temporelle.
- source_word: πρὸ ὥρας
  choice: avant ton heure
  rationale: Cette expression idiomatique désigne une mort prématurée. « Avant ton heure » est naturel en français et conserve l’image temporelle du grec.
theological_decisions:
- issue: Appréciation hostile de la conduite des frères
  choice: « la folie de tes frères » est maintenu comme jugement du personnage qui parle
  alternative: « l’égarement » ou « l’imprudence de tes frères »
  rationale: Le verset rapporte les paroles menaçantes du persécuteur. La traduction conserve son jugement méprisant sans le présenter comme l’évaluation du narrateur.
- issue: Sens de πεισθείης dans un contexte de contrainte
  choice: « si tu n’obéis pas »
  alternative: « si tu ne te laisses pas persuader »
  rationale: Le contexte vise la soumission concrète à l’ordre du roi. La note préserve toutefois le sens plus littéral et l’ambiguïté entre persuasion et obéissance.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse grecque au singulier et au ton menaçant. L’ordre des propositions reste proche du grec, tandis que « après avoir été torturé » est placé en fin de phrase pour rendre clairement l’antériorité du participe sans alourdir la syntaxe.
