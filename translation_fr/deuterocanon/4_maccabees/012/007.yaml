lexical_decisions:
- source_word: δὲ
  choice: mais
  rationale: La particule marque ici une transition légère; « mais » conserve la nuance possible de contraste sans la renforcer excessivement.
- source_word: προτρεψαμένης
  choice: l’ayant encouragé
  rationale: Le participe de προτρέπω exprime une incitation active. « Encouragé » est naturel en français moderne et convient au geste de la mère sans imposer la force plus solennelle d’« exhorté ».
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: en hébreu
  rationale: φωνή désigne ici la langue employée pour parler. « En hébreu » rend l’expression clairement et naturellement.
- source_word: ὡς ἐροῦμεν
  choice: comme nous le raconterons
  rationale: Le futur introduit une remarque de l’auteur annonçant un récit ultérieur; « raconterons » convient mieux au contexte narratif que le littéral « dirons ».
- source_word: μετὰ μικρὸν ὕστερον
  choice: un peu plus loin
  rationale: L’expression renvoie à un passage prochain du récit; cette formulation française est idiomatique et conserve la perspective textuelle.
