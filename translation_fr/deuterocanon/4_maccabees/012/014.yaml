  text: But those who died nobly fulfilled their godliness toward God;[a]
translation:
  language: fr
  text: Mais ceux qui sont morts avec noblesse ont pleinement accompli leur piété envers Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur attachement respectueux à Dieu ».
