lexical_decisions:
- source_word: ἀλλ᾽
  choice: Mais
  rationale: Marque le contraste avec le contexte précédent de façon concise et naturelle.
- source_word: οἱ μὲν
  choice: ceux
  rationale: Le groupe désigne les personnes concernées; μέν amorce un contraste que le français peut laisser implicite ici.
- source_word: εὐγενῶς
  choice: avec noblesse
  rationale: Rend la manière honorable et courageuse dont ils sont morts, sans suggérer une noblesse de naissance.
- source_word: ἀποθανόντες
  choice: qui sont morts
  rationale: La proposition relative rend naturellement en français le participe aoriste et son action accomplie.
- source_word: ἐπλήρωσαν
  choice: ont mené à son accomplissement
  rationale: Conserve l’idée de porter quelque chose à sa pleine mesure ou à son achèvement.
- source_word: τὴν ... εὐσέβειαν
  choice: leur attachement respectueux
  rationale: Exprime ici la dévotion fidèle et révérencieuse manifestée dans la conduite, dans un français actuel et accessible.
- source_word: εἰς τὸν θεόν
  choice: à Dieu
  rationale: Indique l’orientation et l’objet de cet attachement religieux.
theological_decisions:
- issue: Traduction de εὐσέβεια dans le contexte du martyre
  choice: attachement respectueux à Dieu
  alternative: piété envers Dieu
  rationale: Cette formulation conserve la tension entre révérence intérieure et fidélité concrète sans donner au terme un sens doctrinal technique. « Piété » demeure l’équivalent traditionnel et plus concis.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « avec noblesse » évite l’ambiguïté sociale de « noblement », tandis que « mené à son accomplissement » préserve la force de ἐπλήρωσαν.
