  text: He sent for him to come nearer[a], and tried to encourage him, saying,
translation:
  language: fr
  text: 'Il le fit venir plus près[a] et essayait de l’encourager, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il le convoqua plus près de lui et cherchait à le réconforter, en disant : »'
    reason: « Convoqua » peut rendre μετεπέμψατο, tandis que « réconforter » est une autre nuance possible de παρηγορεῖν; « cherchait à » souligne l’aspect en cours de l’imparfait ἐπειρᾶτο.
lexical_decisions:
- source_word: πλησιέστερον
  choice: approcher
  rationale: Le comparatif adverbial exprime une plus grande proximité. Avec μετεπέμψατο, « fit approcher » rend naturellement en français le mouvement vers celui qui appelle.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom masculin singulier à l’accusatif, renvoyant au fils interpellé dans le contexte.
- source_word: μετεπέμψατο
  choice: fit approcher
  rationale: Le moyen de μεταπέμπω signifie « faire venir, envoyer chercher, convoquer ». Associé à πλησιέστερον, « fit approcher » restitue de façon concise l’appel à venir plus près.
- source_word: παρηγορεῖν
  choice: encourager
  rationale: Dans ce contexte d’exhortation face à l’épreuve, « encourager » convient mieux que le sens plus affectif de « consoler », tout en conservant la portée générale du verbe.
- source_word: ἐπειρᾶτο
  choice: essaya
  rationale: L’imparfait grec présente une tentative en cours. Le passé simple « essaya » s’intègre au récit français, tandis que l’infinitif qui suit conserve l’idée de tentative.
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit les paroles par lesquelles se réalise la tentative d’encouragement; « en disant » maintient ce lien syntaxique.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formulation principale privilégie une narration naturelle sans effacer la valeur comparative de πλησιέστερον; la note conserve les autres nuances possibles de convocation, de réconfort et d’action en cours.
