  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: fr
  text: « Relâche-moi[a], dit-il, afin que je parle au roi et à tous les amis qui sont avec lui. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Libère-moi ». Le verbe grec peut désigner le fait de relâcher ou de libérer quelqu’un d’une contrainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  choice: Relâche-moi
  rationale: L’impératif aoriste de ἀπολύω exprime ici une demande directe d’être libéré d’une contrainte. « Relâche-moi » est naturel en français et n’ajoute aucune nuance juridique absente du grec.
- source_word: φησίν
  choice: dit-il
  rationale: Présent historique qui donne de la vivacité au récit ; le présent français le restitue naturellement.
- source_word: εἴπω
  choice: afin que je parle
  rationale: Le subjonctif aoriste après l’impératif exprime le but. Avec des destinataires au datif, « parler à » rend idiomatiquement le grec sans supposer le contenu précis du discours.
- source_word: τῷ βασιλεῖ
  choice: au roi
  rationale: Datif désignant le destinataire de la parole.
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: à tous les amis qui sont avec lui
  rationale: Cette formulation rend πᾶσιν, conserve explicitement σὺν αὐτῷ et traduit directement φίλοι par « amis », tout en laissant ouverte sa possible valeur de proches ou d’associés royaux.
