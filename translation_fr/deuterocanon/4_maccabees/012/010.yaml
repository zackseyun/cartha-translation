lexical_decisions:
- source_word: δραμὼν
  choice: il courut
  rationale: Le participe aoriste de τρέχω exprime ici un déplacement rapide précédant le verbe principal. Une proposition coordonnée est plus naturelle en français moderne tout en conservant la vivacité du récit.
- source_word: ἐπὶ πλησίον
  choice: tout près de
  rationale: La tournure associe mouvement et proximité. « Tout près de » rend clairement la proximité atteinte; le mouvement est déjà porté par « courut ».
- source_word: τῶν τηγάνων
  choice: des poêles
  rationale: τήγανον désigne une poêle ou un récipient plat servant à cuire. Dans ce récit, ces objets chauffés servent d’instruments de torture; « poêles » demeure l’équivalent français le plus direct.
- source_word: ἔφη
  choice: dit
  rationale: Verbe introducteur de discours courant, rendu naturellement par « dit » avant la citation qui suit.
