  text: But this line of reasoning is utterly ridiculous[a], for reason evidently does not prevail over its own passions[b], but over bodily ones.
translation:
  language: fr
  text: 'Mais ce raisonnement est tout à fait ridicule[a] : en effet, la raison ne paraît pas maîtriser ses propres passions, mais celles du corps[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « cet argument » : le grec λογισμός peut désigner un raisonnement, la faculté rationnelle ou l’argument avancé.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les passions ou les appétits corporels ; en grec, l’adjectif est employé substantivement.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιδῇ γελοῖος
  choice: tout à fait ridicule
  rationale: L’expression restitue l’intensité de l’adverbe κομιδῇ et la force polémique de γελοῖος dans un français naturel et digne.
- source_word: λογισμός (première occurrence)
  choice: raisonnement
  rationale: Dans la première proposition, le terme désigne le raisonnement ou l’argument soumis à la critique.
- source_word: λογισμός (seconde occurrence)
  choice: raison
  rationale: Dans la seconde proposition, le même terme désigne plutôt la faculté rationnelle dont on évalue la maîtrise sur les passions.
- source_word: τῶν ἑαυτοῦ παθῶν
  choice: ses propres passions
  rationale: πάθη désigne ici les passions ou impulsions; le réfléchi ἑαυτοῦ est explicitement conservé.
- source_word: φαίνεται ἐπικρατεῖν
  choice: ne paraît pas maîtriser
  rationale: « Paraît » préserve la valeur apparente ou constatée de φαίνεται, tandis que « maîtriser » exprime clairement la domination indiquée par ἐπικρατεῖν.
- source_word: τῶν σωματικῶν
  choice: celles du corps
  rationale: L’adjectif substantivé renvoie, par contraste, aux passions corporelles; cette formulation française conserve l’ellipse sans lourdeur.
theological_decisions:
- issue: Contraste philosophique entre la raison et les passions
  choice: Distinguer « raisonnement » dans la première proposition et « raison » dans la seconde.
  alternative: Traduire uniformément λογισμός par « raison » ou par « raisonnement ».
  rationale: Le contexte permet un glissement entre l’argument critiqué et la faculté rationnelle. La variation française rend ce glissement intelligible sans imposer une anthropologie doctrinale particulière.
- issue: Portée des « passions corporelles »
  choice: Traduire τῶν σωματικῶν par « celles du corps », en le rapportant aux passions.
  alternative: « les réalités corporelles » ou « les passions corporelles ».
  rationale: Le féminin pluriel reprend naturellement « passions » en français et maintient l’opposition du texte sans préciser davantage la nature de ces passions.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La ponctuation par deux-points rend le lien explicatif marqué par γάρ. Les deux sens contextuels de λογισμός sont distingués tout en étant signalés en note.
