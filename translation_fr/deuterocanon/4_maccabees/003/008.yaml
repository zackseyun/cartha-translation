  yaml_path: translation/deuterocanon/4_maccabees/003/008.yaml
  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
translation:
  language: fr
  text: Alors, le soir venu, en sueur et très épuisé, il arriva à la tente royale[a], autour de laquelle toute l’armée de ses ancêtres avait établi son camp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la tente du roi ». L’adjectif grec signifie « royal » et peut désigner plus précisément la tente du souverain dans le camp.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit que toute l’armée de ses ancêtres avait campé autour de la tente. Le parfait peut souligner que l’armée se trouvait déjà installée au moment de son arrivée.
    reason: translation_clarity
lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  choice: Alors, le soir venu
  rationale: Le génitif absolu exprime la circonstance temporelle; « le soir venu » est naturel et conserve l’idée que le soir était déjà arrivé. δὴ renforce légèrement la transition narrative, rendue par « Alors ».
- source_word: ἱδρῶν
  choice: en sueur
  rationale: Le participe présent décrit l’état physique du sujet à son arrivée; « en sueur » est idiomatique, précis et vivant.
- source_word: σφόδρα κεκμηκώς
  choice: très épuisé
  rationale: σφόδρα intensifie le participe parfait κεκμηκώς, qui décrit un état de fatigue résultant d’un effort antérieur.
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: à la tente royale
  rationale: βασίλειος signifie « royal » et σκηνή « tente »; cette formulation directe convient au cadre militaire sans transformer la tente en palais.
- source_word: περὶ ἣν
  choice: autour de laquelle
  rationale: περί indique ici une disposition spatiale entourant la tente.
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: toute l’armée de ses ancêtres
  rationale: La tournure grecque est condensée. « Ses ancêtres » rend προγόνων sans préciser une identification historique absente du texte.
- source_word: ἐστρατοπέδευκεν
  choice: avait établi son camp
  rationale: Le parfait grec présente le campement comme un état résultant déjà en place lors de l’arrivée; le plus-que-parfait français marque clairement cette antériorité.
theological_decisions:
- issue: Référent de « ses ancêtres » dans le récit historique
  choice: Conserver l’expression généalogique générale « ses ancêtres » sans identifier de personnages précis.
  alternative: « ses aïeux » ou une identification explicite de l’armée ancestrale
  rationale: Le grec τῶν προγόνων ne nomme pas les ancêtres concernés. La traduction maintient cette indétermination et n’ajoute aucune reconstruction historique ou doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. « En sueur » reste courant sans être familier; « avait établi son camp » restitue naturellement l’état résultant exprimé par le parfait grec.
