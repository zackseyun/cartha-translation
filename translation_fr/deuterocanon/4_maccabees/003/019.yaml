  text: And now the time also calls us to the demonstration of the history of rational self-control.
translation:
  language: fr
  text: Mais voici que le moment nous appelle à la démonstration, par le récit historique, de la raison qui se maîtrise elle-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤδη δὲ καὶ ὁ καιρός
  choice: Mais le moment est maintenant venu
  rationale: Rend naturellement l’idée que le temps opportun appelle désormais l’orateur à passer à la démonstration; δέ marque ici la transition.
- source_word: ἡμᾶς καλεῖ
  choice: est venu de présenter
  rationale: Transposition idiomatique de «nous appelle», qui exprime en français actuel le passage requis à l’étape suivante du discours sans alourdir la phrase.
- source_word: ἐπὶ τὴν ἀπόδειξιν
  choice: présenter … la preuve
  rationale: ἀπόδειξις désigne une démonstration ou preuve annoncée dans le cadre argumentatif de l’ouvrage.
- source_word: τῆς ἱστορίας
  choice: par le récit des faits
  rationale: Le génitif peut lier le récit à la démonstration. Cette formulation conserve le rôle probant du récit historique sans produire l’expression française obscure «démonstration de l’histoire».
- source_word: τοῦ σώφρονος λογισμοῦ
  choice: de ce que peut accomplir la raison maîtresse d’elle-même
  rationale: σώφρων qualifie ici le λογισμός comme pondéré, discipliné et capable de maîtrise de soi; la formulation explicite la portée argumentative dans un français naturel.
theological_decisions:
- issue: Rapport entre la démonstration, le récit et la raison maîtrisée
  choice: Le récit des faits sert à prouver ce que peut accomplir la raison maîtresse d’elle-même.
  alternative: «la démonstration de l’histoire de la raison maîtresse d’elle-même»
  rationale: La syntaxe grecque est compacte et quelque peu ambiguë. Le contexte rhétorique favorise l’idée que les faits historiques vont fournir la démonstration, plutôt que celle d’une histoire appartenant abstraitement à la raison.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la transition rhétorique vers la partie narrative tout en évitant un calque opaque de la chaîne de génitifs grecque.
