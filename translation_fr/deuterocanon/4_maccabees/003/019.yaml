- from: Mais le moment est maintenant venu de présenter, par le récit des faits, la preuve de ce que peut accomplir la raison maîtresse d’elle-même.
  to: Mais voici que le moment nous appelle à la démonstration, par le récit historique, de la raison qui se maîtrise elle-même.
