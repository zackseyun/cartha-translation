  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: fr
  text: Mais lui aussi, brûlant de soif, jugea que tenir la boisson pour l’équivalent du sang constituerait un danger extrêmement redoutable pour son âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une formulation condensée : littéralement, « la boisson étant tenue pour l’équivalent du sang ».'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: διαπυρούμενος
  choice: dévoré
  rationale: Dans le contexte de la soif, le participe évoque une chaleur ardente et intense. « Dévoré par la soif » conserve cette image avec naturel en français moderne.
- source_word: ἐλογίσατο
  choice: estima
  rationale: Le verbe exprime ici une délibération rationnelle. « Estima » garde cette idée sans alourdir la phrase.
- source_word: πάνδεινον
  choice: absolument redoutable
  rationale: Le composé renforce fortement δεινός ; l’adverbe « absolument » restitue cette intensification dans un français naturel et digne.
- source_word: κίνδυνον τῇ ψυχῇ
  choice: un danger […] pour son âme
  rationale: ψυχή désigne ici l’être intérieur exposé à un dommage moral, plutôt que la seule vie physique.
- source_word: λογισθὲν ἰσοδύναμον
  choice: était considérée comme équivalente
  rationale: Cette formulation respecte le participe passif et la notion d’égalité de valeur ou de portée, tout en laissant subsister la concision du grec.
- source_word: τὸ ποτόν
  choice: la boisson
  rationale: Équivalent direct et courant du substantif grec désignant ce qui devait être bu.
- source_word: αἵματι
  choice: au sang
  rationale: Traduction littérale nécessaire à la comparaison éthique formulée dans le verset.
theological_decisions:
- issue: Sens de ψυχή dans ce contexte d’exhortation morale
  choice: âme
  alternative: vie
  rationale: Le raisonnement porte sur un péril moral intérieur, et non simplement sur la survie physique. « Âme » préserve toutefois l’amplitude du terme sans lui imposer une définition doctrinale ultérieure.
- issue: Portée de la comparaison entre la boisson et le sang
  choice: la boisson était considérée comme équivalente au sang
  alternative: boire revenait à consommer du sang
  rationale: Le grec formule une équivalence de manière condensée. Le texte principal la maintient sans expliciter davantage l’arrière-plan de l’interdit du sang.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La construction « Et lui » garde le contraste marqué par ὁ δέ ; « dévoré par la soif » restitue l’image vive sans archaïsme.
