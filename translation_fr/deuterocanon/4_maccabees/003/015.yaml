  terminology: « Âme », « boisson » et « sang » sont appropriés. « Jugea » rend bien la délibération exprimée par ἐλογίσατο sans imposer une lecture doctrinale. L’expression « tenir la boisson pour l’équivalent du sang » maintient la formulation éthique condensée du grec.
