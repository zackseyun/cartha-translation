  source_fidelity: 'Le sens général est bien rendu : le participe exprime l’ardeur de la soif, ἐλογίσατο une appréciation réfléchie, et la comparaison avec le sang est conservée. Toutefois, « si la boisson était considérée » transforme plus nettement le participe grec λογισθέν en proposition conditionnelle. Une tournure participiale française permet de conserver plus directement l’évaluation de la boisson comme équivalente au sang.'
