  source_fidelity: 'Révision nécessaire : Νικάνορα est « Nicanor », non « Nicator ». De plus, « en vint à » ajoute une idée de développement progressif absente du grec. La relation consécutive de ὥστε est mieux rendue par « au point que ».'
