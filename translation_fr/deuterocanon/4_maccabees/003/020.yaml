  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: fr
  text: En effet, nos pères jouissaient d’une paix profonde grâce à leur respect des lois[a] et prospéraient, au point que même Séleucos Nicanor, le roi d’Asie, leur affecta des fonds pour le service sacré et approuva leur organisation politique[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce au bon ordre qui régnait parmi eux » ou « grâce à leur observance de la Loi ». Le terme grec désigne une vie ordonnée sous l’autorité de la loi et peut sous-entendre ici la fidélité à la loi juive.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur constitution » ou « leur ordre civique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: une paix profonde
  rationale: Conserve l’image grecque de la profondeur tout en offrant une expression française naturelle et soutenue.
- source_word: διὰ τὴν εὐνομίαν
  choice: grâce à leur respect des lois
  rationale: εὐνομία désigne une vie bien ordonnée sous l’autorité de la loi. Cette formulation reste assez large pour ne pas réduire explicitement le terme à la seule observance de la Torah.
- source_word: ἔπραττον καλῶς
  choice: ils prospéraient
  rationale: L’expression idiomatique signifie qu’ils allaient bien ou connaissaient une situation favorable; « prospéraient » convient au contexte.
- source_word: ἀφορίσαι
  choice: réserver
  rationale: Le verbe exprime ici l’affectation de ressources à un usage déterminé.
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: des fonds pour le service sacré
  rationale: « Fonds » convient à une allocation officielle, tandis que « service sacré » préserve l’étendue de ἱερουργία sans la limiter indûment à une fonction particulière.
- source_word: τὴν πολιτίαν αὐτῶν
  choice: leur organisation politique
  rationale: πολιτεία peut désigner la constitution ou l’ordre civique d’une communauté; cette traduction est intelligible en français moderne et maintient cette dimension publique.
- source_word: ἀποδέχεσθαι
  choice: approuver
  rationale: Le verbe marque une acceptation favorable, ici celle du souverain envers l’ordre politique de la communauté.
- source_word: Σέλευκον τὸν Νικάνορα
  choice: Séleucos Nicator
  rationale: Emploie les formes françaises usuelles du nom royal et de l’épithète.
theological_decisions:
- issue: Portée de εὐνομία par rapport à l’identité juive
  choice: « respect des lois », sans mention explicite de la loi de Moïse
  alternative: « bonne organisation » ou « observance de la Loi »
  rationale: Dans le contexte juif, la fidélité à la Loi peut être sous-entendue, mais le nom grec désigne plus largement le bon ordre et le respect du droit. La traduction conserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. La construction garde le lien causal et la phrase inachevée du grec, qui se poursuit au verset suivant. Les imparfaits rendent l’état durable des pères, tandis que « en vint à » exprime naturellement le résultat introduit par ὥστε.
