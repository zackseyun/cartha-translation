  terminology: « Respect des lois » rend de façon appropriée l’amplitude de εὐνομία, sans réduire le terme à l’observance explicite de la Torah. « Service sacré » conserve l’étendue de ἱερουργία, et « organisation politique » est une formulation moderne recevable pour πολιτεία.
