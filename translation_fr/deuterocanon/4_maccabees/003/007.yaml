  text: For when David, attacking the foreigners throughout the whole day, killed many of them along with the soldiers of the nation,
translation:
  language: fr
  text: En effet, tandis que David attaquait les étrangers[a] durant toute la journée, il en tua beaucoup avec les soldats de la nation[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Philistins ». Le grec porte littéralement « les étrangers » (ἀλλόφυλοι), terme souvent employé dans le grec biblique pour désigner les Philistins, sans utiliser ici leur nom ethnique propre.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec les soldats de son peuple ». Le grec dit littéralement « avec les soldats de la nation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ γὰρ
  choice: En effet, tandis que
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que la construction avec « tandis que » exprime la circonstance temporelle introduite par ἐπεί et portée par le participe qui suit.
- source_word: διʼ ὅλης ἡμέρας
  choice: durant toute la journée
  rationale: Cette expression naturelle conserve l’insistance du grec sur toute la durée de la journée.
- source_word: προσβάλλων
  choice: attaquait
  rationale: Le verbe désigne ici une action hostile ou militaire. L’imparfait français présente cette attaque comme l’action en cours pendant laquelle David en tua beaucoup.
- source_word: τοῖς ἀλλοφύλοις
  choice: les étrangers
  rationale: Le terme désigne littéralement des gens appartenant à un autre peuple. Dans le grec biblique, il sert souvent à désigner les Philistins, mais ce nom ethnique précis n’est pas employé ici.
- source_word: ὁ Δαυεὶδ
  choice: David
  rationale: Forme française usuelle du nom propre.
- source_word: πολλοὺς αὐτῶν ἀπέκτεινεν
  choice: il en tua beaucoup
  rationale: Rend directement l’acte de tuer et reprend naturellement en français le groupe précédemment nommé.
- source_word: μετὰ τῶν τοῦ ἔθνους στρατιωτῶν
  choice: avec les soldats de la nation
  rationale: Conserve l’accompagnement exprimé par μετά et le caractère non explicité de τοῦ ἔθνους, sans ajouter dans le texte principal le possessif « son » absent du grec.
