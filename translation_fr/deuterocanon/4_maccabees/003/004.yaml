base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/004.yaml
  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: fr
  text: Aucun de vous ne peut extirper la perversité[a] ; mais la raison peut vous venir en aide pour que vous ne cédiez pas à cette perversité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la malveillance », « la méchanceté » ou « une disposition mauvaise ». Le grec désigne un mauvais état moral plutôt qu’un seul acte mauvais.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour ne pas être courbés par cette perversité », c’est-à-dire pour ne pas lui céder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειάν / τῇ κακοηθείᾳ
  choice: la perversité / cette perversité
  rationale: Le terme désigne ici une disposition morale mauvaise, et non simplement un acte isolé. « Perversité » garde cette portée générale; le démonstratif dans la seconde proposition rend la reprise marquée par l’article grec.
- source_word: τις ὑμῶν
  choice: aucun de vous
  rationale: 'τις est le sujet de δύναται et ὑμῶν est partitif : littéralement, « quelqu’un parmi vous ne peut pas », tournure qui, avec la négation, se rend naturellement par « aucun de vous ne peut ». Cette analyse évite de rattacher à tort τις ὑμῶν au nom κακοήθειαν.'
- source_word: οὐ δύναται ἐκκόψαι
  choice: ne peut extirper
  rationale: ἐκκόπτω signifie littéralement « couper, retrancher ». « Extirper » conserve l’image d’une suppression à la racine tout en étant naturel avec « perversité ».
- source_word: τὸ μὴ καμφθῆναι
  choice: pour que vous ne cédiez pas
  rationale: Le passif de κάμπτω signifie littéralement « ne pas être courbé ». Dans ce contexte moral, il exprime le fait de ne pas plier ou céder; la formulation française explicite naturellement le sujet sous-entendu.
- source_word: ὁ λογισμὸς
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός est un terme majeur désignant la faculté de jugement rationnel et moral. « La raison » convient au registre argumentatif sans en faire un nom propre.
- source_word: συμμαχῆσαι
  choice: venir en aide
  rationale: Le verbe évoque l’aide apportée par un allié, voire le fait de combattre à ses côtés. « Venir en aide » garde l’idée d’un soutien actif sans imposer en français une métaphore militaire trop lourde.
theological_decisions:
- issue: Capacité de la raison face à la perversité
  choice: Le texte affirme qu’aucun être humain interpellé ne peut extirper la perversité, tandis que la raison peut l’aider à ne pas y céder.
  alternative: On pourrait faire de « la raison » le sujet des deux propositions et traduire qu’elle ne peut extirper aucun mauvais penchant, mais qu’elle peut aider à lui résister.
  rationale: Dans la première proposition, τις ὑμῶν est grammaticalement le sujet de οὐ δύναται ἐκκόψαι; ὁ λογισμός n’apparaît comme sujet que dans la seconde. La traduction maintient donc à la fois l’impuissance à supprimer la disposition mauvaise et la capacité réelle de la raison à soutenir la résistance, sans extrapolation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Extirper » préserve l’image forte de ἐκκόπτω; « venir en aide » restitue la nuance d’assistance alliée de συμμαχῆσαι. Les marqueurs [a] et [b] figurent dans le texte principal.
