  text: And after courageously finding the spring[a], they filled the king’s drink from it.
translation:
  language: fr
  text: Après avoir courageusement trouvé la source, ils y puisèrent de l’eau pour le roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec dit qu’ils « remplirent la boisson pour le roi » à partir de la source. Cette expression ne précise pas le récipient ; le datif peut aussi se comprendre comme « la boisson du roi ».
    reason: La construction grecque avec « remplir » et « boisson » est inhabituelle en français. La note conserve cette particularité et l’ambiguïté du datif sans ajouter de récipient.
lexical_decisions:
- source_word: ἀνευράμενοι
  choice: après avoir trouvé
  rationale: Le participe aoriste marque une action accomplie avant le verbe principal ; cette tournure rend clairement la succession des actions.
- source_word: θαρραλέως
  choice: courageusement
  rationale: L’adverbe exprime le courage ou la hardiesse manifestés dans la recherche.
- source_word: τὴν πηγὴν
  choice: la source
  rationale: Dans ce récit, πηγή désigne naturellement une source d’eau.
- source_word: ἐξ αὐτῆς
  choice: y
  rationale: Le pronom renvoie à la source ; « y » est la reprise la plus naturelle en français.
- source_word: ἐγέμισαν … τὸ ποτόν
  choice: ils puisèrent de quoi faire boire
  rationale: Le grec dit littéralement qu’ils « remplirent la boisson », expression peu naturelle en français. La formulation choisie communique l’action de prendre à la source l’eau destinée à être bue, sans introduire un récipient absent du texte.
- source_word: τῷ βασιλεῖ
  choice: le roi
  rationale: 'Le datif indique ici le bénéficiaire ou destinataire : ce qu’ils puisent est destiné au roi.'
