base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/017.yaml
  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
translation:
  language: fr
  text: Car une raison maîtresse d’elle-même est capable de vaincre les contraintes des passions et d’éteindre les ardeurs des désirs impétueux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner des désirs aiguillonnants ou frénétiques, et pas seulement des désirs sexuels.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς
  choice: est capable de
  rationale: L’adjectif prédicatif exprime ici la capacité; cette tournure est naturelle en français moderne.
- source_word: σώφρων νοῦς
  choice: l’intelligence qui se maîtrise
  rationale: νοῦς désigne la faculté de penser et de raisonner, tandis que σώφρων souligne sa maîtrise de soi. Cette formulation conserve les deux éléments sans employer l’expression peu naturelle « intelligence maîtresse d’elle-même ».
- source_word: νικῆσαι
  choice: vaincre
  rationale: Le verbe garde la forte image d’un combat remporté contre la pression des passions.
- source_word: τὰς τῶν παθῶν ἀνάγκας
  choice: les contraintes imposées par les passions
  rationale: ἀνάγκαι désigne les pressions contraignantes exercées par les πάθη; « contraintes » évite de réduire le sens aux seules compulsions psychologiques.
- source_word: σβέσαι
  choice: éteindre
  rationale: Le verbe signifie éteindre un feu et prolonge directement l’image de la chaleur contenue dans φλεγμονάς.
- source_word: τὰς τῶν οἴστρων φλεγμονάς
  choice: les ardeurs des impulsions
  rationale: φλεγμοναί évoque des chaleurs ou inflammations, rendu idiomatiquement par « ardeurs »; οἶστροι désigne ici des élans pressants, voire frénétiques, plus largement que le seul désir sexuel.
theological_decisions:
- issue: Portée anthropologique de νοῦς
  choice: « intelligence », comprise comme faculté rationnelle capable de maîtrise de soi
  alternative: « raison » ou « esprit »
  rationale: Le contexte affirme le pouvoir directeur de la faculté rationnelle sur les passions. « Intelligence » reste accessible sans transformer le verset en thèse doctrinale plus précise que le grec.
- issue: Portée morale de οἴστρων
  choice: « impulsions »
  alternative: « désirs », « frénésies » ou « convoitises »
  rationale: Le terme grec peut évoquer l’aiguillon, l’élan violent ou la frénésie. « Impulsions » en préserve la largeur et n’impose pas une interprétation exclusivement sexuelle.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination grecque est conservée, ainsi que les images de victoire et d’extinction. La formulation évite le calque maladroit « brûlures des aiguillons ».
