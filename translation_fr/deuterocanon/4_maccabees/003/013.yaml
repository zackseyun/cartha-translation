  text: And after escaping the notice of the gate guards[a], they kept going through, having made their way through the whole camp of the enemy.
translation:
  language: fr
  text: Sans être remarqués par les gardes postés aux portes, ils continuaient à traverser tout le camp ennemi, après avoir trouvé un passage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de la phrase grecque est très condensée : littéralement, « ayant trouvé, à travers tout le camp des ennemis ». Le grec n’exprime pas ce qui fut trouvé; « un passage » est une explicitation contextuelle du sens probable, à savoir qu’ils purent avancer à travers le camp ennemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαθόντες
  choice: Sans être remarqués par
  rationale: Le participe aoriste de λανθάνω avec un complément à l’accusatif exprime ici le fait d’échapper à l’attention de quelqu’un. Cette formulation française est naturelle et conserve l’idée d’un passage inaperçu.
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: les sentinelles des portes
  rationale: ἀκροφύλακες désigne des gardes ou des guetteurs affectés aux portes. « Sentinelles » convient au contexte militaire et « des portes » conserve le rapport exprimé par le génitif.
- source_word: διεξῄεσαν
  choice: ils poursuivaient leur chemin à travers
  rationale: L’imparfait grec présente le déplacement dans son déroulement, tandis que le verbe composé exprime une progression à travers un espace. La tournure choisie rend ces deux nuances en français courant.
- source_word: εὑράμενοι
  choice: après avoir trouvé un passage
  rationale: Le participe signifie littéralement « ayant trouvé », mais son complément reste implicite dans cette formulation grecque resserrée. « Un passage » explicite avec prudence ce que le contexte de déplacement paraît supposer.
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: à travers tout le camp ennemi
  rationale: La préposition κατά avec l’accusatif reçoit ici un sens spatial ou distributif couvrant l’ensemble du camp. « Camp ennemi » rend idiomatiquement le génitif substantivé τῶν πολεμίων.
