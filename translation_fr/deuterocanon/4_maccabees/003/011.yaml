  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
translation:
  language: fr
  text: Mais un désir déraisonnable de l’eau qui se trouvait chez les ennemis[a], se resserrant sur lui, le desséchait et, tout en le relâchant[b], le brûlait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’eau dans le camp des ennemis ». Le grec dit littéralement que l’eau était « chez les ennemis » ou « parmi les ennemis ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’image est condensée : le désir est présenté comme une force qui se resserre sur lui et le dessèche, tout en le « relâchant » ou le déliant, puis en le brûlant. Le sens exact de ce relâchement reste imagé.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque simplement le contraste avec ce qui précède.
- source_word: τις ἀλόγιστος ἐπιθυμία
  choice: un désir déraisonnable
  rationale: L’article indéfini rend naturellement τις, tandis que « déraisonnable » maintient l’opposition centrale du livre entre la raison et les passions.
- source_word: τοῦ παρὰ τοῖς πολεμίοις ὕδατος
  choice: de l’eau qui se trouvait chez les ennemis
  rationale: Rend le génitif dépendant de « désir » et la localisation exprimée par παρά avec le datif, sans préciser plus que le grec s’il s’agit de leur camp ou de leur possession.
- source_word: ἐπιτείνουσα
  choice: le tenaillait
  rationale: Exprime naturellement la pression intense exercée sur lui par le désir personnifié, tout en conservant la vigueur de l’image.
- source_word: συνέφρυγε
  choice: le desséchait
  rationale: Évoque directement l’effet corporel de la soif et le sens de dessèchement ou de flétrissement du verbe.
- source_word: λύουσα
  choice: tout en relâchant ses forces
  rationale: Conserve l’idée littérale de relâchement tout en rendant intelligible son effet corporel probable, celui d’un affaiblissement.
- source_word: κατέφλεγεν
  choice: le consumait
  rationale: Préserve l’image intense d’une chaleur qui brûle entièrement, dans un français digne et idiomatique.
theological_decisions:
- issue: Vocabulaire de l’opposition entre raison et passion dans 4 Maccabées
  choice: « déraisonnable » pour ἀλόγιστος
  alternative: « irrationnel » ou « insensé »
  rationale: « Déraisonnable » garde le lien explicite avec la raison sans le sens technique ou clinique que « irrationnel » peut prendre en français moderne; « insensé » atténuerait davantage l’opposition conceptuelle.
- issue: Image paradoxale des effets du désir et de la soif
  choice: Conserver conjointement la pression, le dessèchement, le relâchement des forces et la brûlure
  alternative: Harmoniser les images en une simple description de l’affaiblissement causé par la soif
  rationale: Le grec accumule volontairement des images corporelles tendues, voire opposées; les harmoniser effacerait sa densité rhétorique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La personnification du désir et la tension des images corporelles ont été maintenues sans calque syntaxique excessif.
