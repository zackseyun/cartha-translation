  source_fidelity: 'Le sens fondamental est bien rendu : le désir est qualifié d’ἀλόγιστος, porte sur l’eau « chez/parmi les ennemis », et il exerce successivement ses effets de dessèchement et de brûlure. Toutefois, « relâchant ses forces » explicite un objet (« ses forces ») absent du grec. λύουσα garde une image plus directe de déliaison/relâchement appliquée à « lui »; il convient de ne pas fixer l’interprétation physiologique dans le texte principal.'
