  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
translation:
  language: fr
  text: Personne ne peut extirper la colère de votre âme, mais il est possible de venir en aide à la colère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « il est possible de se servir de la colère » ou « de l’orienter vers de bonnes fins ». Le grec dit littéralement : « venir en aide à la colère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: la colère / à la colère
  rationale: θύμος désigne ici la colère ou l’élan passionnel. La répétition du même terme en grec est conservée en français afin de maintenir le lien et la tension entre les deux propositions.
- source_word: ἐκκόψαι
  choice: extirper
  rationale: Le verbe signifie littéralement « couper, retrancher ». « Extirper » restitue naturellement en français l’image d’un élément que l’on enlève de l’intérieur sans réduire le sens à un simple « supprimer ».
- source_word: ὑμῶν τῆς ψυχῆς
  choice: de votre âme
  rationale: ψυχή désigne ici l’être intérieur, siège des mouvements passionnels. « Votre âme » demeure proche du grec et le possessif français peut s’adresser à plusieurs personnes, comme ὑμῶν.
- source_word: δυνατὸν βοηθῆσαι
  choice: il est possible de venir en aide
  rationale: βοηθέω signifie « aider, secourir, venir en aide ». Cette formulation conserve le sens premier et l’étrangeté délibérée de la proposition grecque.
theological_decisions:
- issue: Sens de la proposition τῷ θυμῷ δυνατὸν βοηθῆσαι
  choice: Conserver littéralement l’idée de « venir en aide à la colère ».
  alternative: « agir sur la colère », « maîtriser la colère » ou « orienter la colère vers le bien »
  rationale: Le grec attribue à θυμός le datif régi par βοηθέω et formule une affirmation concise, paradoxale. Une paraphrase plus explicite trancherait une ambiguïté que le verset lui-même ne résout pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Extirper » préserve l’image vive du grec; la dernière proposition reste volontairement inhabituelle afin de ne pas effacer son ambiguïté.
