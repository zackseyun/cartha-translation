  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: fr
  text: et de terrasser, dans la lutte, les douleurs du corps, aussi extrêmes soient-elles, et, par la noblesse et la bonté de la raison, de rejeter avec mépris[a] toutes les emprises des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie littéralement « cracher au loin » ; il évoque ici un rejet marqué par le mépris.
    reason: Préserver l’image vive et la nuance de dédain de ἀποπτύσαι, qu’une traduction française littérale rendrait maladroitement.
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: douleurs
  rationale: Le terme désigne ici les souffrances physiques; « douleurs » est naturel et précis dans le contexte du corps.
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: si extrêmes soient-elles
  rationale: Cette tournure concessive rend l’intensité exceptionnelle des douleurs tout en produisant un français fluide.
- source_word: καταπαλαῖσαι
  choice: terrasser à la lutte
  rationale: Le verbe évoque une victoire remportée dans un corps-à-corps; cette formulation conserve l’image athlétique au lieu de l’aplanir en simple « vaincre ».
- source_word: καλοκἀγαθίας
  choice: noblesse morale
  rationale: Le mot réunit les notions de noblesse et de bonté ou d’excellence morale; « noblesse morale » en restitue la densité sans périphrase pesante.
- source_word: λογισμοῦ
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle appelée à gouverner les passions; « raison » maintient ce terme clé avec clarté.
- source_word: ἀποπτύσαι
  choice: rejeter avec mépris
  rationale: Le verbe signifie littéralement « cracher au loin » et exprime figurativement un rejet dédaigneux; la traduction transmet cette force dans un français naturel, tandis que l’image concrète est signalée en note.
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: toute domination des passions
  rationale: ἐπικρατεία exprime la suprématie ou le pouvoir dominant. Le singulier collectif français « toute domination » rend naturellement le pluriel grec et le pouvoir exercé par les passions.
theological_decisions:
- issue: Sens philosophiquement chargé de λογισμός
  choice: raison
  alternative: jugement rationnel
  rationale: « Raison » conserve le terme directeur de l’argument du livre, selon lequel la raison pieuse gouverne les passions, sans imposer un vocabulaire philosophique inutilement technique.
- issue: Rapport entre la καλοκἀγαθία du λογισμός et le rejet des passions
  choice: grâce à la noblesse morale de la raison
  alternative: en raison de l’excellence morale de la raison
  rationale: Le génitif grec est inhabituel dans cette construction. La formulation choisie suit le rapport instrumental ou causal suggéré par le contexte sans développer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. L’image de la lutte est conservée dans « terrasser à la lutte »; l’image moins naturelle du crachat est rendue idiomatiquement dans le texte et explicitée en note.
