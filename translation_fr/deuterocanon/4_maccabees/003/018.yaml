  source_fidelity: La structure infinitive et l’image agonistique de καταπαλαῖσαι sont conservées. Toutefois, « noblesse morale » réduit la double portée de καλοκἀγαθία (noblesse/beauté et bonté/excellence), et « toute domination » atténue le pluriel πάσας ... ἐπικρατείας. La révision rend ces deux éléments plus explicitement sans surinterpréter le génitif instrumental τῆς καλοκἀγαθίας τοῦ λογισμοῦ.
  naturalness: « Terrasser, dans la lutte » est plus idiomatique et conserve l’image de combat. « Toutes les emprises des passions » est naturel en français moderne et exprime bien les diverses formes de maîtrise exercées par les passions.
  terminology: « Raison » convient à λογισμός dans le contexte de 4 Maccabées. « Noblesse et bonté » restitue plus complètement καλοκἀγαθία que « noblesse morale ». « Rejeter avec mépris » est une équivalence française juste et sobre pour le figuré expressif de ἀποπτύσαι.
