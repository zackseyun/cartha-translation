    rationale: Cette expression française est recevable, mais elle fusionne et réduit les deux dimensions du terme grec. « Noblesse et bonté » préserve mieux la coordination sémantique attestée par le composé.
  - severity: low
    issue: Le pluriel πάσας τὰς ... ἐπικρατείας est rendu par le singulier collectif « toute domination ».
    rationale: Le singulier est possible en français, mais « toutes les emprises » reflète plus directement le pluriel grec et le pouvoir contraignant des passions.
  - severity: low
    issue: L’ancre de note est placée à la fin du groupe nominal plutôt qu’auprès de « rejeter avec mépris ».
    rationale: La note explique ἀποπτύσαι; la placer immédiatement après son équivalent français améliore la précision de l’ancrage.
