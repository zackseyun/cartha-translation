  text: But the king[a], though very thirsty, even though he had abundant springs, was not able through them to relieve his thirst.
translation:
  language: fr
  text: Mais le roi, qui avait extrêmement soif, ne pouvait, bien qu’il eût des sources abondantes, soulager sa soif par leur moyen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « guérir sa soif ». Le verbe grec signifie normalement « guérir » ou « soigner » et conserve sans doute ici une métaphore médicale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Mais le roi
  rationale: δέ marque ici une transition légèrement contrastive; « Mais » maintient le lien avec le contexte précédent.
- source_word: ὡς μάλιστα διψῶν
  choice: malgré sa soif extrême
  rationale: ὡς μάλιστα intensifie fortement le participe διψῶν. Cette formulation française exprime à la fois l’intensité et la valeur concessive contextuelle.
- source_word: καίπερ ἀφθόνους ἔχων πηγάς
  choice: bien qu’il dispose de sources abondantes
  rationale: καίπερ introduit clairement la concession; ἀφθόνους indique l’abondance et πηγάς désigne des sources d’eau.
- source_word: οὐκ ἠδύνατο
  choice: ne peut
  rationale: Le présent de narration est naturel en français dans ce récit et rend directement l’incapacité exprimée par l’imparfait grec.
- source_word: διʼ αὐτῶν
  choice: par elles
  rationale: Le pronom renvoie aux sources et conserve la valeur instrumentale de διά avec le génitif.
- source_word: ἰάσασθαι τὴν δίψαν
  choice: apaiser sa soif
  rationale: « Apaiser sa soif » est naturel en français tout en restant plus proche de l’idée de remède ou de soulagement portée par ἰάομαι que le tour figé « étancher sa soif »; une note signale la métaphore médicale grecque.
