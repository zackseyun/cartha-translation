    rationale: 'Le grec présente d’abord le roi comme ayant extrêmement soif (ὡς μάλιστα διψῶν), puis introduit la concession par καίπερ : il avait des sources abondantes, mais ne pouvait pas s’en servir pour soulager/« guérir » sa soif. « Malgré sa soif extrême » inverse cette articulation logique.'
