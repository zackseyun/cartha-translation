  text: For reason is not the uprooter of the passions[b][a], but their adversary.
translation:
  language: fr
  text: Car la raison n’est pas celle qui déracine les passions[a], mais leur adversaire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un nom d’agent : littéralement, « celle qui déracine les passions ». Il conserve l’image d’un arrachage avec les racines.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, la raison n’élimine pas entièrement les passions, mais s’oppose à elles.
    reason: clarification
lexical_decisions:
- source_word: λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, le terme désigne la faculté de délibération rationnelle qui gouverne la conduite. « La raison » est naturel en français et conserve sa portée philosophique.
- source_word: ἐκριζωτής
  choice: ne déracine pas
  rationale: Le grec emploie un nom d’agent, littéralement « celui qui déracine ». Une formulation verbale est plus naturelle en français moderne tout en conservant l’image concrète du déracinement.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans ce contexte éthique et philosophique, πάθη désigne les passions ou mouvements affectifs qui sollicitent la personne, plutôt que de simples sentiments ou souffrances.
- source_word: ἀνταγωνιστής
  choice: elle lutte contre elles
  rationale: Le terme désigne celui qui combat ou rivalise avec un adversaire. Cette formulation rend clairement l’opposition active sans suggérer que les passions sont totalement supprimées.
theological_decisions:
- issue: Rapport entre la raison et les passions
  choice: La raison ne supprime pas les passions, mais lutte contre elles.
  alternative: La raison n’est pas celle qui déracine les passions, mais leur adversaire.
  rationale: 'La traduction maintient l’affirmation philosophique du texte : la raison s’oppose aux passions sans nécessairement les anéantir. Elle n’importe ni idéal d’impassibilité absolue ni catégorie théologique ultérieure.'
translation_notes:
  register: Français international moderne, clair et digne. La phrase verbale évite le substantif peu idiomatique « déracineuse » tout en préservant l’image grecque dans le texte et en explicitant sa forme littérale en note.
