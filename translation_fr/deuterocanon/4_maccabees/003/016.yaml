  text: Therefore[a], setting reason against desire, he poured out the drink as a libation to God.
translation:
  language: fr
  text: C’est pourquoi, opposant la raison au désir, il versa la boisson en libation à Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il versa la boisson à Dieu ». Le verbe grec désigne l’action de verser une libation, c’est-à-dire une offrande liquide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit ici la conséquence tirée de l’argument précédent; cette tournure exprime naturellement le lien logique en français.
- source_word: ἀντιθεὶς
  choice: opposant
  rationale: Le participe aoriste d’ἀντίθημι décrit la mise en opposition délibérée de la raison et du désir; « opposant » reste concret et fluide.
- source_word: τῇ ἐπιθυμίᾳ
  choice: au désir
  rationale: ἐπιθυμία désigne largement le désir, avec ici une dimension appétitive; « désir » préserve cette amplitude sans restreindre le terme à l’appétit physique.
- source_word: τὸν λογισμόν
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle ou le jugement raisonné qui gouverne les passions; « la raison » rend clairement le contraste philosophique.
- source_word: ἔσπεισεν
  choice: versa … en libation
  rationale: σπένδω désigne spécifiquement l’action de verser une offrande liquide; « en libation » rend explicite cette valeur cultuelle portée par le verbe.
- source_word: τὸ πόμα
  choice: la boisson
  rationale: Le nom signifie littéralement « boisson »; la notion d’offrande vient du verbe, ce qui permet de conserver la distinction lexicale du grec.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif indique le destinataire de l’acte cultuel; « à Dieu » est direct et idiomatique.
theological_decisions:
- issue: Valeur cultuelle de σπένδω appliqué à τὸ πόμα
  choice: Présenter l’acte comme une libation versée à Dieu.
  alternative: 'Traduire plus littéralement et plus implicitement: « il versa la boisson à Dieu ».'
  rationale: Le verbe grec porte lui-même la notion de libation. La rendre explicite permet au lecteur moderne de percevoir l’acte religieux sans ajouter de contenu théologique étranger au texte.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le contraste philosophique entre la raison et le désir ainsi que la portée cultuelle du geste, sans technicité excessive.
