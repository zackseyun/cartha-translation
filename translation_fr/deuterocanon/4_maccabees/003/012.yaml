  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
translation:
  language: fr
  text: C’est pourquoi, tandis que les défenseurs s’indignaient du désir du roi, deux jeunes soldats résolus[a], saisis de honte devant ce désir, revêtirent leur armure complète et, prenant une cruche[b], franchirent les palissades ennemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « deux jeunes hommes, des soldats endurants » ; la construction grecque permet de regrouper les termes de plusieurs façons.'
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne une cruche ou un récipient, probablement destiné à transporter de l’eau.
    reason: cultural_note
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Marque naturellement la conséquence de ce qui précède.
- source_word: τῶν ὑπερασπιστῶν
  choice: les défenseurs
  rationale: Rend le sens général de ceux qui défendent, sans préciser indûment qu’il s’agit de gardes du corps.
- source_word: ἐπὶ τῇ τοῦ βασιλέως ἐπιθυμίᾳ
  choice: du désir du roi / devant ce désir
  rationale: « Désir » conserve la neutralité de ἐπιθυμία; la reprise évite une lourde répétition tout en gardant le référent explicite.
- source_word: σχετλιάζόντων
  choice: s’indignaient
  rationale: Exprime le vif mécontentement à nuance morale du participe grec.
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: deux jeunes soldats pleins de courage
  rationale: Regroupe naturellement en français les désignations étroitement liées; καρτεροί évoque la fermeté, l’endurance et le courage.
- source_word: καταιδεσθέντες
  choice: saisis de honte devant
  rationale: Conserve la réaction de honte indiquée par le grec sans trancher plus précisément sa motivation.
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: revêtirent leur armure complète
  rationale: Rend le moyen « s’équiper de l’armure complète » dans un français militaire naturel.
- source_word: κάλπιν
  choice: une cruche
  rationale: Désigne un récipient ou une cruche, probablement destiné à l’eau; le texte grec ne mentionne toutefois pas explicitement l’eau.
- source_word: ὑπερέβησαν
  choice: franchirent
  rationale: Exprime clairement l’action de passer au-delà d’un obstacle.
- source_word: τοὺς τῶν πολεμίων χάρακας
  choice: les retranchements ennemis
  rationale: χάρακες désigne ici des ouvrages défensifs de campagne, possiblement des palissades.
