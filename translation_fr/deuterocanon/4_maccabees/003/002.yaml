base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/002.yaml
  text: For example[a], reason cannot cut off any one of your desires, but reason can make it possible not to be enslaved to desire.
translation:
  language: fr
  text: Par exemple, la raison ne peut retrancher aucun de vos désirs, mais elle peut faire en sorte qu’on ne soit pas asservi au désir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « mais la raison peut permettre de ne pas être asservi au désir ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: οἷον
  choice: Par exemple
  rationale: Introduit naturellement l’illustration qui suit, en conservant la valeur exemplificative du grec.
- source_word: ἐπιθυμίαν
  choice: un désir
  rationale: Le singulier grec est conservé; «désir» rend le terme sans l’intensifier comme le feraient «passion» ou «convoitise».
- source_word: ἐκκόψαι
  choice: retrancher
  rationale: Conserve l’image vive de couper ou d’ôter, tout en restant digne et compréhensible en français moderne.
- source_word: δουλωθῆναι
  choice: être asservi
  rationale: Préserve explicitement la métaphore de l’esclavage exprimée par le passif grec.
- source_word: τῇ ἐπιθυμίᾳ
  choice: au désir
  rationale: Maintient le lien lexical avec la première occurrence d’ἐπιθυμία et la valeur générique du nom abstrait.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Rend le terme philosophique central de 4 Maccabées par son équivalent français courant et précis.
- source_word: παρασχέσθαι
  choice: peut faire en sorte
  rationale: Exprime naturellement l’idée que la raison peut procurer ou rendre possible le fait de ne pas être asservi.
theological_decisions:
- issue: Rapport entre la raison et le désir
  choice: La raison n’élimine pas le désir, mais elle peut faire en sorte que la personne ne lui soit pas asservie.
  alternative: La raison peut garantir qu’on ne soit pas soumis au désir.
  rationale: La formulation conserve la distinction morale et philosophique du texte entre supprimer le désir et refuser sa domination, sans attribuer à la raison un pouvoir plus absolu que ne le fait le grec.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de «désir» et la métaphore de l’asservissement sont maintenues afin de préserver la structure et la tension du grec.
