lexical_decisions:
- source_word: οἱ μὲν οὖν ἄλλοι πάντες
  choice: Quant à tous les autres
  rationale: « Tous les autres » rend la totalité du groupe restant. La tournure « Quant à » restitue naturellement en français la transition, avec une possible nuance de contraste, portée par μὲν οὖν, sans lui imposer une forte valeur logique.
- source_word: ἐπὶ τὸ δεῖπνον
  choice: au repas
  rationale: δεῖπνον désigne le repas principal. Avec ἐπί et l’accusatif, l’expression indique ici que les personnes se trouvaient là pour le repas ou y prenaient part. « Au repas » reste bref et naturel, tout en conservant cette légère latitude.
- source_word: ἦσαν
  choice: étaient
  rationale: L’imparfait de εἰμί exprime simplement l’état ou la présence. « Étaient » évite d’ajouter l’idée non explicitée qu’ils s’étaient réunis ou qu’ils étaient arrivés.
