  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
translation:
  language: fr
  text: C’est alors que certains, s’étant soulevés contre la concorde commune[a], tirèrent parti des malheurs de multiples façons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant provoqué une révolte contre la concorde commune ». Le verbe grec peut avoir un sens politique plus marqué que « se soulever ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « firent usage des malheurs de multiples façons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: C’est alors que
  rationale: Cette tournure française exprime naturellement la valeur temporelle de τότε et l’insistance de δή.
- source_word: τινες
  choice: certains
  rationale: Le terme conserve le caractère indéfini du pluriel grec sans préciser l’identité des personnes.
- source_word: νεωτερίσαντες πρὸς τὴν κοινὴν ὁμόνοιαν
  choice: s’étant soulevés contre la concorde commune
  rationale: Dans ce contexte, νεωτερίζω évoque une agitation ou une révolte dirigée contre la concorde partagée; « se soulever » en garde la portée politique sans la surinterpréter.
- source_word: πολυτρόπως
  choice: de multiples façons
  rationale: Cette expression rend clairement la pluralité des manières indiquée par l’adverbe.
- source_word: ἐχρήσαντο συμφοραῖς
  choice: tirèrent parti des malheurs
  rationale: χράομαι avec le datif signifie « faire usage de »; « tirer parti de » restitue ici l’emploi opportuniste des συμφοραί, qui sont des malheurs ou des calamités.
