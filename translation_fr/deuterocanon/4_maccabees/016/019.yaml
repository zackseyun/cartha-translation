  text: And because of this, you ought to endure every pain for the sake of God.
translation:
  language: fr
  text: Et c’est pourquoi vous devez endurer toute souffrance pour Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: Cette locution reprend le raisonnement précédent et en exprime naturellement la conséquence en français.
- source_word: ὀφίλετε
  choice: vous devez
  rationale: Le verbe marque ici une obligation morale dans le cadre d’une exhortation. « Vous devez » garde cette force sans évoquer une contrainte matérielle.
- source_word: πάντα πόνον
  choice: toute souffrance
  rationale: Dans le contexte du martyre, πόνος désigne la douleur ou la souffrance endurée. « Toute souffrance » est naturel en français et conserve la portée globale de πάντα.
- source_word: ὑπομένειν
  choice: endurer
  rationale: Le verbe exprime le fait de tenir ferme sous l’épreuve; « endurer » restitue ce sens avec concision.
- source_word: διὰ τὸν θεόν
  choice: pour Dieu
  rationale: Avec l’accusatif, la tournure indique ici le motif ou la cause au sens d’un engagement envers Dieu. « Pour Dieu » reste sobre et évite de laisser entendre explicitement que Dieu serait l’auteur de la souffrance.
theological_decisions:
- issue: Force de l’obligation morale exprimée par ὀφίλετε
  choice: « vous devez », comme obligation exhortative
  alternative: « il vous faut » ou « vous êtes tenus de »
  rationale: Le contexte appelle les destinataires à une endurance fidèle. « Vous devez » exprime clairement l’obligation morale sans transformer l’exhortation en nécessité absolue.
- issue: Valeur de διὰ τὸν θεόν
  choice: « pour Dieu », indiquant le motif de l’endurance
  alternative: « à cause de Dieu »
  rationale: La traduction retenue préserve l’orientation de la souffrance vers Dieu tout en évitant l’ambiguïté française selon laquelle Dieu causerait directement la souffrance.
translation_notes:
  register: Français moderne, courant et digne. La formulation reste concise et exhortative, avec « souffrance » adapté au contexte de persécution et de martyre.
