base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/024.yaml
  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: fr
  text: Par ces paroles, la mère de sept enfants[a], encourageant chacun de ses fils, les persuada de mourir plutôt que de transgresser le commandement de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « la mère de sept ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: Par ces paroles
  rationale: διά avec le génitif exprime ici le moyen. « Par ces paroles » conserve cette valeur instrumentale dans un français naturel et digne.
- source_word: ἡ ἑπτάμητωρ
  choice: la mère de sept enfants
  rationale: Le composé désigne une femme mère de sept enfants. En français, « enfants » évite l’incomplétude de « mère de sept », tandis que la mention suivante précise qu’il s’agit de ses fils.
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: chacun de ses fils
  rationale: La tournure distributive souligne l’attention portée individuellement à chaque fils. Le possessif est naturel en français compte tenu du sujet.
- source_word: παρακαλοῦσα
  choice: encourageant
  rationale: Dans ce contexte, le participe évoque à la fois l’exhortation et le soutien moral apporté aux fils devant la mort.
- source_word: ἔπεισε
  choice: les persuada
  rationale: Le verbe πείθω signifie persuader ou convaincre. Le pronom pluriel reprend naturellement chacun des fils considéré collectivement.
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: de mourir plutôt que de transgresser
  rationale: La construction comparative exprime clairement la préférence de la mort à la désobéissance. « Transgresser » maintient la gravité morale et juridique du grec.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: le commandement de Dieu
  rationale: Cette formulation conserve la portée religieuse et scripturaire de ἐντολή sans ajouter de précision doctrinale.
theological_decisions:
- issue: Rendu de l’épithète ἑπτάμητωρ
  choice: la mère de sept enfants
  alternative: la mère de sept fils
  rationale: Le composé ne contient pas explicitement le mot « fils », bien que celui-ci apparaisse immédiatement après. « Enfants » rend le sens nécessaire en français sans anticiper entièrement la formulation suivante.
- issue: Registre de παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ
  choice: transgresser le commandement de Dieu
  alternative: désobéir au commandement de Dieu
  rationale: « Transgresser » préserve la solennité morale et légale de l’expression grecque, sans résoudre ni amplifier sa portée théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe participiale du grec est conservée sans raideur excessive, et le vocabulaire maintient la solennité du contexte martyrial.
