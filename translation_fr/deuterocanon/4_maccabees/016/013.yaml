base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/013.yaml
  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: fr
  text: Mais, avec un esprit dur comme le diamant, et faisant résonner jusque dans l’immortalité le nombre de ses fils[a], elle les exhortait avec d’autant plus d’insistance à s’avancer vers la mort par piété envers Dieu, tout en les suppliant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renvoyant comme un écho le nombre de ses fils vers l’immortalité ». Le participe grec est rare et métaphorique ; l’image exacte peut évoquer une résonance, un choc en retour ou une mise en regard.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: dur comme le diamant
  rationale: L’adjectif évoque une dureté extrême, impossible à briser. Cette expression française conserve l’image concrète tout en restant immédiatement compréhensible.
- source_word: νοῦν
  choice: l’esprit
  rationale: Dans ce contexte, νοῦς désigne la faculté intérieure de penser et de vouloir. « L’esprit » conserve cette amplitude sans réduire le mot à la seule « résolution ».
- source_word: ἀντικτυποῦσα
  choice: faisant résonner
  rationale: Le participe est rare et son image demeure difficile à préciser. « Faisant résonner » conserve l’idée d’un choc ou d’un écho en retour sans transformer la métaphore en explication doctrinale.
- source_word: εἰς ἀθανασίαν
  choice: jusque dans l’immortalité
  rationale: εἰς exprime ici une orientation ou un aboutissement. « Jusque dans » s’accorde naturellement avec l’image de la résonance tout en maintenant l’immortalité comme horizon.
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: le nombre de ses fils
  rationale: La traduction reste proche de la formulation grecque. Le possessif est fourni naturellement par le contexte.
- source_word: μᾶλλον
  choice: avec d’autant plus d’insistance
  rationale: Cette tournure restitue la force comparative et l’intensification de l’exhortation.
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: par piété envers Dieu
  rationale: εὐσέβεια désigne une conduite de fidèle dévotion. La précision « envers Dieu » rend explicite en français moderne l’orientation religieuse du terme sans lui imposer un sens confessionnel particulier.
- source_word: ἐπὶ τὸν θάνατον ... προετρέπετο
  choice: elle les exhortait ... à aller à la mort
  rationale: La formulation conserve le mouvement vers la mort exprimé par ἐπί et la force exhortative du verbe.
- source_word: ἱκετεύουσα
  choice: tout en les suppliant
  rationale: Le participe ajoute à l’exhortation une supplication pressante et pathétique, que cette tournure rend distinctement.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété envers Dieu
  alternative: fidélité à Dieu ; attachement à Dieu
  rationale: La traduction garde la dimension de dévotion et de conduite religieuse du terme grec. Elle évite de réduire celui-ci à une simple qualité morale ou de lui attribuer un contenu doctrinal ultérieur.
- issue: Interprétation de καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν
  choice: faisant résonner jusque dans l’immortalité le nombre de ses fils
  alternative: renvoyant comme un écho le nombre de ses fils vers l’immortalité ; opposant le nombre de ses fils à l’immortalité
  rationale: Le grec offre une métaphore dense et inhabituelle, susceptible d’évoquer un choc, une réponse ou un écho. Le texte principal préserve cette étrangeté et l’orientation vers l’immortalité, tandis que la note signale l’incertitude sans expliquer à outrance le rapport entre la mort des fils et l’immortalité.
translation_notes:
  register: Français international actuel, digne et lisible. L’image du diamant rend concrètement la fermeté intérieure de la mère. La proposition sur le nombre des fils demeure volontairement insolite afin de respecter l’ambiguïté du grec, avec une note placée immédiatement après cette proposition.
