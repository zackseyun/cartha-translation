  text: who[a], even if I were not to die, would bury some one of my sons. But with this lament the holy and God-fearing mother bewailed none of them,
translation:
  language: fr
  text: moi qui[a], même à ma mort, n’aurai aucun de mes fils pour m’ensevelir. Pourtant, la mère sainte et respectueuse de Dieu ne se lamenta sur aucun d’eux par cette plainte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe brusquement du récit à la première personne, comme s’il citait directement la pensée ou les paroles de la mère.
    reason: Le marqueur explique le changement de personne conservé dans la traduction.
lexical_decisions:
- source_word: ἣ
  choice: moi qui
  rationale: Le pronom relatif féminin renvoie à la mère mentionnée dans le contexte, tandis que les verbes à la première personne présentent ses propres paroles ou pensées. « Moi qui » conserve ce passage abrupt à la première personne.
- source_word: οὐδʼ ἂν ἀποθάνω
  choice: même à ma mort
  rationale: 'Dans cette proposition hypothétique ou temporelle, οὐδέ porte naturellement sur l’ensemble de l’idée : même si/quand elle meurt, aucun fils ne sera là pour l’ensevelir. Cette formulation française évite de lire à tort οὐδέ comme la simple négation du verbe « mourir ».'
- source_word: θάπτοντα τῶν υἱῶν ἕξω τινά
  choice: n’aurai aucun de mes fils pour m’ensevelir
  rationale: 'ἕξω est ici le futur de ἔχω (« j’aurai »), et non le nombre « six ». Le participe θάπτοντα complète τινά : elle n’aura aucun de ses fils pour accomplir son ensevelissement.'
- source_word: ἀλλὰ
  choice: Pourtant
  rationale: Le terme introduit le contraste entre la plainte qu’on pourrait attendre d’une mère et la maîtrise qu’elle manifeste.
- source_word: τούτῳ τῷ θρήνῳ
  choice: par cette plainte
  rationale: θρῆνος désigne une lamentation funèbre ou une plainte de deuil ; « cette plainte » renvoie naturellement aux paroles qui précèdent.
- source_word: οὐδένα ὀλοφύρετο
  choice: ne se lamenta sur aucun d’eux
  rationale: Le verbe exprime une lamentation de deuil. La négation absolue et l’objet masculin singulier sont rendus de manière idiomatique en français.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: la mère sainte et respectueuse de Dieu
  rationale: « Sainte » conserve l’élévation religieuse de ἱερά ; « respectueuse de Dieu » rend explicitement l’orientation théocentrique de θεοσεβής dans un français actuel.
theological_decisions:
- issue: Sens de θεοσεβής
  choice: respectueuse de Dieu
  alternative: pieuse ; craignant Dieu
  rationale: Le choix garde la référence explicite à Dieu et l’idée de révérence sans donner à « crainte » le sens moderne dominant de peur.
- issue: Passage à la première personne
  choice: moi qui… n’aurai
  alternative: elle qui… n’aurait
  rationale: Les formes ἀποθάνω et ἕξω sont à la première personne. La traduction conserve donc la voix de la mère au lieu d’harmoniser silencieusement le passage à la troisième personne.
- issue: Portée de la négation dans οὐδʼ ἂν ἀποθάνω… ἕξω τινά
  choice: même à ma mort, n’aurai aucun
  alternative: même si je ne mourais pas, j’aurais quelqu’un
  rationale: La syntaxe et le contexte soutiennent une négation portant sur le fait d’avoir un fils pour l’ensevelir, non sur sa mort elle-même. La tension pathétique vient de ce qu’après la mort de ses fils, personne ne restera pour ensevelir leur mère.
translation_notes:
  register: 'Français international moderne, digne et lisible. La phrase reste liée au contexte antérieur, comme dans le grec, et se termine par une virgule puisque la proposition se poursuit probablement au verset suivant. Le faux rapprochement de ἕξω avec « six » a été évité : il s’agit du futur « j’aurai ».'
