review_pass:
  verdict: revise
  source_fidelity: La version proposée reconnaît justement ἕξω comme le futur de ἔχω (« j’aurai ») et θάπτοντα comme décrivant un fils qui ensevelirait sa mère. Toutefois, « même à ma mort » efface la valeur conditionnelle/hypothétique de οὐδʼ ἂν ἀποθάνω, et « moi qui » transforme sans justification le relatif féminin ἣ en pronom de première personne. Le texte grec transmis est abrupt et mêle un relatif féminin avec des formes de première personne ; cette difficulté doit être maintenue et signalée, non résolue par une reformulation qui en modifie la structure.
  naturalness: 'La phrase française peut rester digne et naturelle tout en conservant l’aspérité du grec, par une incise introductive suivie d’un discours direct : « Elle qui : “Même si je mourais…” » Cette présentation rend intelligible le changement de personne sans prétendre lever l’ambiguïté syntaxique du témoin grec.'
  terminology: « sainte et craignant Dieu » est plus idiomatique et plus précis dans un registre biblique moderne que « sainte et respectueuse de Dieu ». « Se lamenta sur aucun d’eux » rend correctement ὀλοφύρετο et conserve le ton soutenu.
  issues:
  - severity: high
    issue: La condition exprimée par οὐδʼ ἂν ἀποθάνω est remplacée par « même à ma mort ».
    rationale: Cette expression temporelle ne rend ni ἄν ni la forme verbale conditionnelle/hypothétique. « Même si je mourais » conserve la valeur sans imposer une résolution doctrinale ou textuelle.
  - severity: high
    issue: « moi qui » ne correspond pas directement au relatif féminin ἣ.
    rationale: Le relatif renvoie à la mère à la troisième personne, alors que les verbes grecs ἀποθάνω et ἕξω sont à la première personne. Il faut préserver cette rupture, par exemple en marquant des paroles représentées de la mère.
  - severity: medium
    issue: « respectueuse de Dieu » est moins naturel et moins idiomatique que nécessaire pour θεοσεβής.
    rationale: « Craignant Dieu » garde la référence explicite à Dieu, exprime la révérence plutôt que la peur dans ce registre, et correspond au vocabulaire biblique français courant.
  revised_text: 'Elle qui[a] : « Même si je mourais, je n’aurais aucun de mes fils pour m’ensevelir. » Pourtant, la mère sainte et craignant Dieu ne se lamenta sur aucun d’eux par cette plainte,'
  revised_footnotes:
  - marker: a
    text: Le grec associe abruptement un relatif féminin renvoyant à la mère à des verbes de première personne (« si je mourais », « je n’aurais »). La traduction le présente comme des paroles ou une pensée de la mère, sans supprimer cette rupture de personne.
    reason: Préserver et expliquer l’alternance de personne du texte grec transmis.
  revision_rationale: 'La révision conserve le sens central : la mère envisage qu’aucun de ses fils ne restera pour l’ensevelir, mais elle ne les pleure pas de cette manière. Elle rétablit la condition hypothétique, rend la fonction de θάπτοντα par « pour m’ensevelir », et traite explicitement, plutôt que de la masquer, l’alternance abrupte entre le relatif féminin et la première personne. La virgule finale est maintenue conformément à la ponctuation et à la continuité du passage source.'
