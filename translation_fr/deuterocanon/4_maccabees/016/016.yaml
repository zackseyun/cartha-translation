  text: you were saying to the children in the Hebrew language[a], “O children, noble is the contest to which, having been called for the testimony of the nation[b], you must struggle earnestly.”
translation:
  language: fr
  text: 'tu disais à tes fils en hébreu : « Mes fils, noble est le combat auquel vous avez été appelés pour le témoignage de la nation. Luttez-y avec ardeur ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγες
  choice: tu disais
  rationale: L’imparfait grec présente la parole comme en cours ou répétée dans la scène évoquée; l’imparfait français en conserve naturellement l’aspect.
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: à tes fils / Mes fils
  rationale: Dans le contexte, une mère s’adresse à ses enfants de sexe masculin. « Fils » exprime précisément le lien familial; au vocatif, « Mes fils » est naturel en français et rend la force relationnelle de l’adresse.
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: en hébreu
  rationale: Expression française actuelle et naturelle pour indiquer la langue employée, sans perdre le sens du grec.
- source_word: γενναῖος ὁ ἀγών
  choice: noble est le combat
  rationale: « Noble » conserve la valeur morale de γενναῖος, tandis que « combat » rend clairement l’image de l’ἀγών et convient à l’exhortation au martyre.
- source_word: ἐφʼ ὃν κληθέντες
  choice: auquel vous avez été appelés
  rationale: La proposition relative française restitue clairement l’idée que l’appel a pour but ce combat, sans conserver un participe lourd.
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: pour le témoignage de la nation
  rationale: « Témoignage » garde la portée publique de διαμαρτυρία, et « de la nation » suit le génitif grec sans ajouter « notre ».
- source_word: ἐναγωνίσασθε
  choice: Luttez-y avec ardeur !
  rationale: L’impératif aoriste appelle à s’engager résolument dans le combat. « Y » rappelle ἀγών et « avec ardeur » exprime l’intensité du verbe composé.
theological_decisions:
- issue: Identité des destinataires désignés par παισίν / παῖδες
  choice: fils
  alternative: enfants
  rationale: Le contexte narratif identifie les destinataires comme les fils de la mère. Ce choix préserve la précision masculine et le lien familial sans introduire d’interprétation doctrinale.
- issue: Sens de διαμαρτυρία dans l’exhortation au martyre
  choice: témoignage
  alternative: attestation
  rationale: « Témoignage » maintient la dimension publique et possiblement juridique du terme sans lui imposer un sens chrétien technique ultérieur.
- issue: Rapport du génitif τοῦ ἔθνους
  choice: de la nation
  alternative: rendu contextuel « de notre nation »
  rationale: La traduction conserve l’expression grecque, qui ne comporte pas de possessif, et laisse ouverte la relation exacte entre la nation et le témoignage.
translation_notes:
  register: Français international moderne, digne et oralement naturel. L’inversion « noble est le combat » conserve la mise en relief solennelle du grec; la dernière injonction reste énergique sans archaïsme.
