revisions:
- from: C’est pour lui que notre père Abraham s’empressa d’immoler Isaac, son fils, l’ancêtre du peuple[a] ; et Isaac, voyant la main de son père, armée d’un glaive, s’abattre sur lui, ne recula pas[b].
  to: C’est pour lui que notre père Abraham s’empressa d’égorger Isaac, son fils, l’ancêtre du peuple[a], et Isaac, voyant la main paternelle, armée d’un glaive, s’abattre sur lui, ne recula pas[b].
  rationale: La révision évite d’ajouter au verbe grec une qualification sacrificielle explicite, tout en préservant son caractère volontairement violent. Elle maintient l’ambiguïté contextuelle de « pour lui », l’apposition désignant Isaac comme ancêtre du peuple, et le sujet Isaac dans la proposition finale. « Main paternelle » rend plus exactement πατρῴαν ; les notes restent ancrées aux mêmes expressions et proposent des alternatives françaises naturelles.
