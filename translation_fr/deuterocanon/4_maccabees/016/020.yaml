  yaml_path: translation/deuterocanon/4_maccabees/016/020.yaml
  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: fr
  text: C’est pour lui que notre père Abraham s’empressa d’égorger Isaac, son fils, l’ancêtre du peuple[a], et Isaac, voyant la main paternelle, armée d’un glaive, s’abattre sur lui, ne recula pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son fils, qui deviendrait le père du peuple ». Le mot grec composé désigne l’ancêtre ou le fondateur d’un peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne broncha pas » ; « ne se déroba pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: C’est pour lui que
  rationale: Cette tournure conserve le rapport de motivation exprimé par διά avec l’accusatif et laisse l’antécédent dépendre du contexte précédent, sans le préciser artificiellement.
- source_word: ἔσπευδεν
  choice: s’empressa
  rationale: Le verbe peut exprimer à la fois la hâte et l’empressement. « S’empressa » est naturel en français soutenu et garde la dimension volontaire de l’acte.
- source_word: σφαγιάσαι
  choice: d’immoler
  rationale: Le verbe désigne une mise à mort, notamment dans un cadre sacrificiel. « Immoler » préserve ici ensemble la violence et la nuance sacrificielle, sans recourir au plus général « tuer ».
- source_word: τὸν ἐθνοπάτορα υἱόν
  choice: Isaac, son fils, l’ancêtre du peuple
  rationale: ἐθνοπάτωρ qualifie le fils et désigne le fondateur ou ancêtre d’un peuple. L’apposition française rend clairement qu’il s’agit d’Isaac, sans faire d’Abraham le référent syntaxique de ce titre.
- source_word: πατρῴαν χεῖρα
  choice: la main de son père
  rationale: Dans la scène vue par Isaac, l’expression désigne concrètement la main paternelle d’Abraham. Cette formulation est plus naturelle et moins ambiguë en français que « la main ancestrale », tout en respectant la relation exprimée.
- source_word: ξιφηφόρον
  choice: armée d’un glaive
  rationale: L’adjectif signifie littéralement « porte-glaive ». Appliqué à la main, « armée d’un glaive » produit une image française claire et conserve le registre élevé.
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: s’abattre sur lui
  rationale: La tournure rend le mouvement descendant et menaçant du participe grec avec une expression française vive et idiomatique.
- source_word: οὐκ ἔπτηξεν
  choice: ne recula pas
  rationale: Le verbe évoque le fait de se dérober ou de se recroqueviller sous l’effet de la peur. « Ne recula pas » associe la peur surmontée à la fermeté volontaire, tout en restant accessible.
theological_decisions:
- issue: Rendre l’allusion à Abraham et Isaac sans substituer au grec une formulation traditionnelle de la Genèse
  choice: « s’empressa d’immoler Isaac »
  alternative: « se prépara à offrir Isaac »
  rationale: Le grec emploie un verbe vif de mise à mort et souligne la résolution d’Abraham. La traduction retenue garde cette force au lieu de l’atténuer ou d’importer une formule plus familière mais moins exacte.
- issue: Antécédent de διʼ ὃν
  choice: Conserver le masculin contextuel avec « C’est pour lui que » sans nommer l’antécédent
  alternative: « C’est pour cette raison que »
  rationale: Le relatif grec est masculin singulier et renvoie au contexte antérieur. Nommer son référent ou le transformer en simple rapport logique résoudrait indûment une dépendance contextuelle présente dans le texte.
- issue: Sujet implicite de οὐκ ἔπτηξεν
  choice: Rendre explicite « Isaac » dans la seconde proposition
  alternative: Conserver seulement « il ne recula pas »
  rationale: La syntaxe grecque fait d’Isaac, objet de σφαγιάσαι, le sujet logique de « voyant » et de « ne recula pas ». La répétition de son nom évite en français moderne une ambiguïté possible avec Abraham sans modifier le sens.
translation_notes:
  register: Français moderne, digne et narratif. « Immoler » et « glaive » maintiennent la solennité ainsi que la violence sacrificielle de la phrase, tandis que la syntaxe explicite le changement de sujet nécessaire à une lecture française fluide.
