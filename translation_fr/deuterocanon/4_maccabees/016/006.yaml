  source_fidelity: La draft rend correctement la lamentation réflexive (Ὦ μελέα ἔγωγε), l’intensification de πολλάκις τρισαθλία, les sept enfants mis au monde et le paradoxe final du parfait γεγένημαι. Toutefois, « Bien que » impose une concession là où ἥτις est d’abord un relatif explicatif (« moi qui »).
  naturalness: « Tant de fois trois fois misérable » est difficilement idiomatique en français moderne dans cet ordre. La répétition emphatique peut être conservée avec une ponctuation qui rend la formulation volontairement expressive. « Je ne suis plus mère de personne » est plus naturel que « je ne suis plus la mère d’aucun », tout en gardant le sens de deuil résultant.
  terminology: « Malheureuse », « misérable », « mis au monde » et « enfants » conviennent. La note sur « fils » préserve justement l’ambiguïté lexicale de παῖδας, tout en indiquant le contexte narratif.
