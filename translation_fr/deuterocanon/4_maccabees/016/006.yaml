base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: fr
  text: Ô malheureuse que je suis, moi, trois fois misérable, tant et tant de fois[b] ! Moi qui ai mis au monde sept enfants[c], je ne suis plus mère de personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « tant de fois trois fois misérable », expression qui intensifie fortement la douleur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sept fils ». Le mot grec peut désigner des enfants ou des fils; dans le contexte, il s’agit de garçons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: Malheureuse que je suis, moi
  rationale: L’exclamation exprime une lamentation sur soi-même; « moi » rend l’insistance de ἔγωγε sans alourdir excessivement la phrase.
- source_word: πολλάκις τρισαθλία
  choice: tant de fois trois fois misérable
  rationale: Cette formulation conserve l’image grecque inhabituelle de « trois fois misérable » et l’intensification apportée par πολλάκις.
- source_word: ἥτις
  choice: Bien que
  rationale: Dans ce contexte, le relatif introduit le contraste douloureux entre les sept naissances et la perte présente; la valeur concessive est rendue naturellement en français.
- source_word: ἑπτὰ παῖδας
  choice: sept enfants
  rationale: παῖδας peut désigner des enfants ou des fils. « Enfants » préserve l’étendue lexicale du terme, tandis qu’une note signale que le contexte parle de fils.
- source_word: τεκοῦσα
  choice: j’aie mis au monde
  rationale: Rend explicitement et naturellement le sens maternel de l’aoriste de τίκτω.
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: je ne suis plus la mère d’aucun
  rationale: Le parfait exprime l’état résultant de la perte. « Ne suis plus » rend ce résultat en français naturel tout en maintenant le paradoxe avec les naissances.
theological_decisions:
- issue: Sens de la lamentation maternelle après la mort de ses fils
  choice: 'La phrase est rendue comme le paradoxe du deuil : après avoir mis au monde sept enfants, elle se considère désormais comme la mère d’aucun.'
  alternative: « Je suis devenue la mère d’aucun » reproduirait plus formellement γεγένημαι, mais serait peu naturel et potentiellement obscur en français.
  rationale: Le parfait grec marque un état présent résultant, et le contraste entre maternité passée et privation présente doit demeurer sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et fortement expressif. La tournure conserve l’intensification singulière du grec sans archaïsme, et « ne suis plus » communique clairement l’état de deuil résultant.
