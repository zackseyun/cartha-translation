  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: fr
  text: Ô sept grossesses vaines, et sept périodes de dix mois inutiles[a], et soins nourriciers sans fruit, et pénibles allaitements[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dix mois » reflète une manière ancienne de compter la durée normale d’une grossesse.
    reason: cultural_note
  - marker: b
    text: Le grec enchaîne quatre groupes nominaux exclamatifs, sans verbe conjugué. Il distingue les soins donnés au nourrisson du fait de le nourrir au lait.
    reason: translation_note
lexical_decisions:
- source_word: μάταιοι κυοφορίαι
  choice: grossesses vaines
  rationale: Le nom désigne le fait de porter un enfant dans le sein maternel. « Grossesses » est le terme français moderne le plus clair, tandis que « vaines » exprime le sentiment tragique que tout cela a abouti à une perte, sans suggérer que les fils eux-mêmes étaient sans valeur.
- source_word: ἀνόνητοι ἑπτὰ δεκάμηνοι
  choice: sept périodes inutiles de dix mois
  rationale: Le grec parle littéralement de réalités « de dix mois » qui n’ont procuré aucun avantage. « Périodes […] de dix mois » conserve cet ancien mode de calcul de la grossesse sans introduire dans le texte une explication étrangère à la lamentation.
- source_word: ἄκαρποι τιθηνίαι
  choice: soins nourriciers sans fruit
  rationale: τιθηνίαι évoque les soins donnés au nourrisson, notamment le fait de le nourrir et de l’élever. Cette formulation le distingue de γαλακτοτροφίαι et rend la métaphore de ἄκαρποι sans laisser entendre une stérilité biologique.
- source_word: ταλαίπωροι γαλακτοτροφίαι
  choice: pénibles allaitements
  rationale: Le composé désigne le fait de nourrir au lait. « Allaitements » est naturel en français et « pénibles » communique la souffrance et le malheur exprimés par ταλαίπωροι.
theological_decisions:
- issue: La série d’exclamations sans verbe
  choice: Conserver une suite condensée de groupes nominaux exclamatifs.
  alternative: 'Développer en propositions complètes : « Mes sept grossesses ont été vaines… »'
  rationale: Le grec ne comporte aucun verbe conjugué et enchaîne quatre exclamations. La forme retenue préserve le rythme abrupt de la lamentation et n’ajoute pas de jugement explicatif.
- issue: L’expression ancienne « de dix mois »
  choice: La traduire littéralement et l’expliquer en note.
  alternative: Employer « grossesses arrivées à terme ».
  rationale: La formulation grecque reflète un mode ancien de compter la durée d’une grossesse. La conserver respecte la particularité culturelle du texte plutôt que de la normaliser silencieusement.
- issue: L’absence de possessif dans le grec
  choice: Ne pas ajouter « mes ».
  alternative: « Ô mes sept grossesses vaines… »
  rationale: Le contexte indique clairement que la mère parle de ses propres grossesses, mais le grec maintient une formulation nominale dépouillée. L’absence de possessif préserve cette compression rhétorique.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme marqué. La répétition de « et » reproduit l’accumulation douloureuse du grec; l’exclamation finale rend la force des vocatifs.
