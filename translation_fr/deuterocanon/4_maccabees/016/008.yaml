  yaml_path: translation/deuterocanon/4_maccabees/016/008.yaml
  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: fr
  text: C’est en vain[a], mes enfants, que j’ai enduré pour vous tant de douleurs de l’accouchement et les soucis plus pénibles encore de votre éducation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pour rien » ; la suite peut aussi se traduire : « tant de douleurs de l’enfantement et les soucis plus pénibles encore qu’a demandés votre éducation ».'
    reason: Signale des possibilités lexicales pour μάτην, ὠδῖνας, φροντίδας et ἀνατροφῆς sans modifier le sens général.
lexical_decisions:
- source_word: μάτην
  choice: en vain
  rationale: Exprime la futilité apparente des souffrances maternelles; cette tournure est concise, naturelle et solennelle en français.
- source_word: ἐφʼ ὑμῖν
  choice: pour vous
  rationale: Indique que les souffrances ont été endurées à cause des enfants et en leur faveur, ce que « pour vous » rend naturellement.
- source_word: ὦ παῖδες
  choice: mes enfants
  rationale: παῖδες désigne ici les enfants auxquels leur mère s’adresse. « Mes » explicite en français la relation maternelle évidente dans le contexte, sans préciser inutilement « fils ».
- source_word: πολλὰς ... ὠδῖνας
  choice: tant de douleurs de l’accouchement
  rationale: Préserve l’image concrète des douleurs maternelles; « tant de » rend idiomatiquement l’intensité rhétorique de πολλὰς dans cette plainte.
- source_word: ὑπέμεινα
  choice: j’ai enduré
  rationale: Rend l’aoriste et l’idée de supporter des souffrances avec constance.
- source_word: χαλεπωτέρας
  choice: plus pénibles encore
  rationale: 'Conserve le comparatif: les soucis liés à l’éducation sont présentés comme plus éprouvants encore que les douleurs de l’accouchement.'
- source_word: φροντίδας
  choice: soucis
  rationale: Désigne les préoccupations et le poids mental durable associés à l’éducation des enfants; « soucis » est naturel et garde cette dimension affective.
- source_word: ἀνατροφῆς
  choice: de votre éducation
  rationale: Rend le processus d’élever et de former les enfants. Ici, « éducation » est plus fluide et digne que « élevage » et moins périphrastique que « le fait de vous élever ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et oralement naturel. L’apostrophe grecque est rendue par « mes enfants », plus idiomatique que « ô enfants ». Le comparatif est maintenu explicitement par « plus pénibles encore ».
