  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: fr
  text: J’ai donc montré que non seulement des hommes ont maîtrisé les passions, mais que même une femme a méprisé[a] les tortures les plus terribles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a tenu pour rien les tortures les plus terribles » ; ou : « a fait peu de cas des tortures les plus terribles ».'
    reason: Alternative lexicale pour ὑπερεφρόνησεν, qui peut exprimer aussi bien le mépris que le fait de considérer une chose comme négligeable.
lexical_decisions:
- source_word: ἀπέδειξα
  choice: J’ai montré
  rationale: Le verbe signifie « montrer, démontrer, prouver ». Le passé composé convient à cette récapitulation argumentative sans donner au propos une tonalité excessivement technique.
- source_word: οὖν
  choice: donc
  rationale: La particule introduit la conclusion tirée de ce qui précède.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans 4 Maccabées, πάθη désigne les passions ou impulsions intérieures que la raison maîtrise, et non ici des souffrances extérieures.
- source_word: ἄνδρες
  choice: des hommes
  rationale: Le grec désigne spécifiquement des hommes et les met en contraste avec « une femme ».
- source_word: ἐπεκράτησαν
  choice: ont maîtrisé
  rationale: Le verbe exprime l’idée de prendre le dessus sur quelque chose et d’en acquérir la maîtrise.
- source_word: γυνή
  choice: une femme
  rationale: Le singulier sans article présente la mère comme un exemple, tandis que « femme » préserve le contraste sexué du grec.
- source_word: τῶν μεγίστων βασάνων
  choice: les tortures les plus terribles
  rationale: βάσανοι désigne des tortures ou tourments dans ce contexte de martyre; cette formulation française rend naturellement le superlatif μεγίστων.
- source_word: ὑπερεφρόνησεν
  choice: a méprisé
  rationale: Le verbe signifie considérer comme négligeable ou indigne d’attention; « mépriser » en donne une traduction directe, tandis que la note préserve une nuance possible.
theological_decisions:
- issue: Sens anthropologique de πάθη dans 4 Maccabées
  choice: les passions
  alternative: les émotions; les souffrances
  rationale: La thèse centrale du livre porte sur la domination des passions par la raison. Traduire ici par « souffrances » brouillerait cette opposition entre impulsions intérieures et tortures extérieures.
- issue: Contraste entre ἄνδρες et γυνή
  choice: des hommes… une femme
  alternative: des êtres humains… une femme
  rationale: Le contraste genré appartient à l’argument rhétorique du verset et doit être conservé sans neutralisation.
- issue: Force de ὑπερεφρόνησεν face aux tortures
  choice: a méprisé
  alternative: a tenu pour rien; a fait peu de cas de
  rationale: « A méprisé » conserve la vigueur du verbe, tandis que les autres formulations mettent davantage en relief l’idée de considérer les tortures comme négligeables.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le mouvement conclusif du grec ainsi que le contraste rhétorique entre les hommes et la femme.
