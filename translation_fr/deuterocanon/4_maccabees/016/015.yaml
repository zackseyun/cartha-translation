  text: For even when you were arrested with your children, you stood watching Eleazar being tortured, and—
translation:
  language: fr
  text: Car même lorsque tu as été arrêtée avec tes enfants, tu te tenais là, debout, à regarder Éléazar qu’on torturait, et —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελήμφθης
  choice: tu as été arrêtée
  rationale: Le verbe signifie ici « être saisi, arrêté ». Le féminin est imposé par la destinataire, la mère.
- source_word: μετὰ τῶν παίδων
  choice: avec tes enfants
  rationale: Dans ce contexte, παῖδες désigne ses enfants; « enfants » est plus naturel et exact que « garçons » ou « fils » pris isolément.
- source_word: εἱστήκεις
  choice: tu es restée là
  rationale: Le plus-que-parfait grec de ἵστημι décrit une posture maintenue; cette formulation française exprime le fait de se tenir présente sans lourdeur.
- source_word: ὁρῶσα
  choice: à regarder
  rationale: 'Le participe présent marque une action simultanée et soutenue: elle demeure là en regardant la scène.'
- source_word: βασανιζόμενον
  choice: se faire torturer
  rationale: Le participe passif indique qu’Éléazar subissait la torture; la tournure est naturelle en français contemporain.
