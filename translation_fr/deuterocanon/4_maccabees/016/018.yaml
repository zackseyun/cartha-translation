  text: Do not let the younger men be terrified by the tortures. Remember that for the sake of the God of the world you have partaken of this[a], and have enjoyed life;
translation:
  language: fr
  text: Ne laissez pas les jeunes hommes être terrifiés par les tortures. Souvenez-vous que, pour le Dieu du monde, vous avez eu part à cela et que vous avez joui de la vie ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: les plus jeunes
  rationale: Le comparatif substantivé désigne les membres les plus jeunes du groupe. Cette formulation naturelle conserve la référence sans préciser davantage qu’ils sont frères ou jeunes hommes.
- source_word: καταπλαγῆναι
  choice: être terrifiés
  rationale: L’infinitif aoriste passif exprime le fait d’être saisi d’une peur intense ou bouleversé d’effroi.
- source_word: τὰς βασάνους
  choice: par les tortures
  rationale: Dans ce récit de martyre, βάσανος désigne les supplices infligés; « tortures » est direct et adapté au contexte.
- source_word: ἀναμνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif aoriste appelle les destinataires à se remettre délibérément quelque chose en mémoire.
- source_word: διὰ τὸν θεὸν
  choice: grâce à Dieu
  rationale: διά avec l’accusatif marque ici la cause ou l’auteur ultime du bien reçu. « Grâce à Dieu » rend naturellement cette relation dans le contexte.
- source_word: τοῦ κόσμου μετελάβετε
  choice: vous avez eu part au monde
  rationale: 'μεταλαμβάνω régit couramment le génitif. Le parallélisme avec τοῦ βίου ἀπελαύσατε favorise le rattachement de τοῦ κόσμου au verbe : avoir reçu une part dans le monde ou dans l’existence terrestre.'
- source_word: τοῦ βίου ἀπελαύσατε
  choice: vous avez joui de la vie
  rationale: ἀπολαύω avec le génitif signifie jouir de quelque chose ou en recevoir les bienfaits.
theological_decisions:
- issue: Rattachement syntaxique de τοῦ κόσμου
  choice: 'Rattacher « du monde » à μετελάβετε : « vous avez eu part au monde »'
  alternative: 'Rattacher « du monde » à θεόν : « pour le Dieu du monde, vous avez eu part à cela »'
  rationale: Les deux rattachements sont grammaticalement possibles, mais le parallélisme entre τοῦ κόσμου μετελάβετε et τοῦ βίου ἀπελαύσατε appuie fortement le premier. Une note conserve l’autre lecture sans transformer « Dieu du monde » en une paraphrase doctrinale comme « souverain du monde ».
translation_notes:
  register: Français international moderne, digne et accessible. Le premier membre est formulé comme une exhortation autonome conformément au sens contextuel transmis, bien que l’extrait grec commence par une construction infinitive qui dépend vraisemblablement du contexte précédent. Le point-virgule final est conservé, car la pensée se poursuit.
