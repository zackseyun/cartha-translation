revisions:
- from: Les lions autour de Daniel n’étaient pas aussi féroces, et la fournaise embrasée contre Mishaël, même avec son feu le plus violent, ne brûlait pas autant que l’amour de ses enfants embrasait[a] la nature de cette mère lorsqu’elle voyait ses sept fils torturés.
  to: Les lions qui entouraient Daniel n’étaient pas aussi féroces, et la fournaise qui brûlait contre Mishaël d’un feu très violent n’était pas aussi ardente que ne brûlait, en cette mère, l’amour qu’elle portait à ses enfants, lorsqu’elle voyait ses sept fils torturés[a].
  rationale: 'La révision rétablit la direction de la métaphore : l’amour maternel, ou sa nature propre, brûle en la mère sous ses yeux, plutôt que d’embraser une nature distincte. Elle maintient l’ambiguïté lexicale signalée en note, l’intensité du feu et la mention explicite des tortures.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:03:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'La syntaxe du projet inverse le rapport exprimé par le grec : c’est la « nature/force de l’amour pour les enfants » qui est comparée aux lions et au feu de la fournaise, et non cet amour qui embrase la nature de la mère. La révision conserve l’image ignée et le superlatif, tout en rendant Μισαήλ comme la personne visée par la fournaise.'
  naturalness: La phrase révisée emploie une comparaison française lisible (« n’étaient pas aussi… que… ») sans aplanir la construction rhétorique. « L’amour qu’elle portait à ses enfants brûlait » est plus naturel que « l’amour de ses enfants embrasait la nature de cette mère » et évite l’ambiguïté selon laquelle les enfants aimeraient leur mère.
  terminology: « Mishaël », « fournaise », « feu très violent » et « torturés » sont appropriés. « L’amour qu’elle portait à ses enfants » rend φιλοτεκνία sans imposer une interprétation doctrinale ou psychologique plus précise.
  issues:
  - severity: high
    issue: Inversion du sujet et de l’objet dans la proposition finale
    rationale: Le texte grec présente φύσις, qualifiée par φιλοτεκνίας, comme le sujet du verbe à imagerie de feu. Le projet fait de « l’amour » l’agent qui embrase « la nature » de la mère, ce qui modifie la relation syntaxique et l’image.
  - severity: medium
    issue: « l’amour de ses enfants » est ambigu en français
    rationale: Cette formule peut désigner l’amour que ses enfants lui portent. « L’amour qu’elle portait à ses enfants » rend explicitement l’affection maternelle indiquée par φιλοτεκνία.
  - severity: medium
    issue: La comparaison française attribue « ne brûlait pas autant » à la fournaise
    rationale: Le grec compare la sauvagerie des lions et l’ardeur de la fournaise à l’embrasement intérieur. Une structure parallèle avec « n’étaient pas aussi… que » exprime plus exactement les deux membres de la comparaison.
  revised_text: Les lions qui entouraient Daniel n’étaient pas aussi féroces, et la fournaise qui brûlait contre Mishaël d’un feu très violent n’était pas aussi ardente que ne brûlait, en cette mère, l’amour qu’elle portait à ses enfants, lorsqu’elle voyait ses sept fils torturés[a].
  revised_footnotes:
