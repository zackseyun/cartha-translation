  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: fr
  text: Les lions qui entouraient Daniel n’étaient pas aussi féroces, et la fournaise qui brûlait contre Mishaël d’un feu très violent n’était pas aussi ardente que ne brûlait, en cette mère, l’amour qu’elle portait à ses enfants, lorsqu’elle voyait ses sept fils torturés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que ne brûlait en cette mère la nature de son amour pour ses enfants ». Le verbe grec, rare, prolonge vraisemblablement l’image du feu et évoque son tourment intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: les lions autour de Daniel
  rationale: L’expression désigne les lions qui entouraient Daniel dans l’épisode bien connu; cette formulation reste proche du grec et naturelle en français.
- source_word: ἄγριοι
  choice: féroces
  rationale: Dans ce contexte, le terme souligne la violence dangereuse des lions plutôt que leur caractère simplement sauvage.
- source_word: Μισαὴλ
  choice: Mishaël
  rationale: Translittération française usuelle du nom hébreu reflété par la forme grecque.
- source_word: ἐκφλεγομένη κάμινος
  choice: la fournaise embrasée
  rationale: Cette expression concise conserve l’image d’une fournaise en pleine combustion.
- source_word: λαβροτάτῳ πυρί
  choice: avec son feu le plus violent
  rationale: La formulation rend la valeur superlative de λαβροτάτῳ et l’intensité déchaînée du feu.
- source_word: φιλοτεκνίας
  choice: l’amour de ses enfants
  rationale: Le nom désigne l’affection d’une mère pour ses propres enfants; le possessif explicite naturellement cette relation en français.
- source_word: πειράλειεν
  choice: embrasait
  rationale: Le verbe rare prolonge vraisemblablement l’image du feu pour exprimer l’expérience intérieure de la mère; « embrasait » maintient ce lien rhétorique avec la fournaise.
- source_word: ἐκείνη φύσις
  choice: la nature de cette mère
  rationale: Le démonstratif renvoie à la mère évoquée dans le contexte. L’ajout explicite de « mère » évite l’opacité de « cette nature » sans modifier le référent.
- source_word: ὁρῶσα
  choice: lorsqu’elle voyait
  rationale: Le participe circonstanciel présente la vue des tortures comme le cadre temporel de son embrasement intérieur.
- source_word: βασανιζομένους
  choice: torturés
  rationale: Dans le contexte du martyre, le verbe désigne des sévices physiques et non une simple détresse.
theological_decisions:
- issue: Métaphore du feu appliquée à l’état intérieur de la mère
  choice: Conserver l’image de l’embrasement intérieur provoqué par l’amour maternel.
  alternative: Dire simplement qu’elle était tourmentée ou profondément bouleversée.
  rationale: La comparaison associe expressément les lions, la fournaise et l’expérience de la mère. Maintenir la métaphore respecte la tension rhétorique du grec sans réduire son état à une émotion générique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La comparaison grecque, très condensée et irrégulière, est légèrement restructurée afin de distinguer naturellement la férocité des lions et l’intensité du feu, tout en conservant le mouvement rhétorique vers l’embrasement intérieur de la mère.
