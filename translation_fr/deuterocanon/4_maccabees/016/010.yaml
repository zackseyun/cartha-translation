  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
translation:
  language: fr
  text: Ah ! moi, femme aux nombreux et beaux[a] enfants, veuve et seule, tout en pleurs[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remarquables ». Le grec peut évoquer la beauté des enfants ou l’excellence de leurs qualités.
    reason: lexical_alternative
  - marker: b
    text: Ou « objet de tant de lamentations ». Le grec peut décrire celle qui se lamente abondamment ou celle dont le sort suscite de nombreuses lamentations.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὦ
  choice: Ah !
  rationale: L’interjection introduit ici une plainte. « Ah ! » en restitue naturellement la force douloureuse en français, sans ajouter le complément explicatif « malheur à moi ».
- source_word: πολύπαις
  choice: aux nombreux enfants
  rationale: Le composé désigne une femme qui a beaucoup d’enfants. Cette tournure adjectivale préserve la concision de l’exclamation grecque.
- source_word: καλλίπαις
  choice: aux … beaux enfants
  rationale: Le composé peut évoquer la beauté des enfants ou, plus largement, leurs belles qualités. « Beaux » conserve cette ouverture sémantique, explicitée en note.
- source_word: γυνή
  choice: femme
  rationale: Traduction directe de γυνή, préférable ici à « mère », puisque la maternité est déjà exprimée par les deux adjectifs composés.
- source_word: χήρα
  choice: veuve
  rationale: Équivalent direct et naturel du statut exprimé par χήρα.
- source_word: μόνη
  choice: seule
  rationale: Le mot souligne l’isolement de la femme après la mort des siens.
- source_word: πολύθρηνος
  choice: tout en pleurs
  rationale: Cette expression française rend de manière concise l’abondance de la lamentation et convient à la plainte directe, tout en signalant en note l’ambiguïté de la forme grecque.
