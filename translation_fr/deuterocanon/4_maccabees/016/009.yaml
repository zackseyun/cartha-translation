  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: fr
  text: Ô mes enfants, les uns non mariés, les autres mariés mais sans enfants[a] ! Je ne verrai pas vos enfants et je ne serai pas non plus tenue pour heureuse lorsque je serai appelée grand-mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec ἄνοιντοι, rare, signifie probablement « sans enfants » ou « sans descendance » ; l’idée est que même ceux qui étaient mariés ne lui laisseraient pas de petits-enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: Ô mes enfants !
  rationale: L’apostrophe exprime une vive lamentation maternelle. « Mes enfants » rend naturellement παῖδες sans préciser « fils », nuance que le grec n’impose pas ici.
- source_word: ἄγαμοι
  choice: ne se sont pas mariés
  rationale: Le terme désigne ceux qui sont demeurés non mariés. Cette formulation s’intègre naturellement à l’opposition avec ceux qui se sont mariés.
- source_word: γαμήσαντες
  choice: se sont mariés
  rationale: Le participe aoriste indique qu’une partie des enfants avait contracté mariage.
- source_word: ἄνοιντοι
  choice: sont restés sans enfants
  rationale: Ce mot rare paraît désigner ici l’absence de descendance chez ceux qui se sont mariés, comme le confirme la phrase suivante. La formulation évite la connotation biologique plus étroite de « stériles ».
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: Je ne verrai pas vos enfants
  rationale: Traduction directe qui maintient le vocabulaire familial et désigne les petits-enfants espérés par la mère.
- source_word: μάμμη
  choice: grand-mère
  rationale: Équivalent français courant du terme familial grec.
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: appelée grand-mère, je ne serai pas non plus proclamée heureuse
  rationale: 'La traduction conserve les deux passifs : être appelée grand-mère et être déclarée ou reconnue heureuse. « Proclamée heureuse » rend la valeur sociale de μακαρίζω sans réduire l’expression à un sentiment intérieur.'
