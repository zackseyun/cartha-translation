  - severity: low
    issue: « proclamée heureuse » est une formulation moins naturelle pour μακαρισθήσομαι.
    rationale: Le verbe évoque ici le fait d’être regardée, dite ou tenue pour heureuse. « Tenue pour heureuse » conserve cette reconnaissance sociale sans suggérer une proclamation officielle.
