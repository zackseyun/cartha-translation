base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: fr
  text: Si donc même une femme — une femme âgée et mère d’enfants — a supporté les tortures jusqu’à la mort tout en voyant ses enfants pousser de grands cris[a], la raison pieuse est maîtresse des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de cette proposition est très condensé. On pourrait aussi comprendre : « tout en étant témoin des souffrances de ses enfants ». Le verbe employé évoque plus littéralement des cris retentissants ou des lamentations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: Si donc
  rationale: Rend la transition à la fois conditionnelle et déductive, dans un français naturel.
- source_word: γυνὴ καὶ γεραιὰ καὶ ἐπὶ παιδῶν μήτηρ
  choice: une femme — une femme âgée et mère d’enfants —
  rationale: Conserve l’accumulation rhétorique qui souligne son sexe, son grand âge et sa condition de mère, sans réduire παῖδες à « fils ».
- source_word: ὑπέμεινεν
  choice: a supporté
  rationale: Exprime l’endurance ferme sous l’épreuve; « enduré » serait également possible, mais « supporté les tortures » est plus naturel ici en français courant.
- source_word: τὰς μέχρι θανάτου βασάνους
  choice: les tortures jusqu’à la mort
  rationale: βασάνοι désigne ici des supplices infligés, et μέχρι θανάτου en marque l’étendue ultime.
- source_word: ὁρῶσα τῶν τέκνων ὁλολυγμένων
  choice: tout en voyant ses enfants pousser de grands cris
  rationale: Suit directement la valeur de ὁλολύζω, qui évoque des cris retentissants ou des lamentations, tout en donnant une syntaxe française intelligible.
- source_word: αὐτοκράτωρ τῶν παθῶν
  choice: maîtresse des passions
  rationale: Préserve l’image d’une autorité souveraine exercée sur les passions, thème central de l’ouvrage.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: Rend le terme programmatique comme une raison formée et orientée par la piété envers Dieu, sans l’assimiler à la seule rationalité abstraite.
theological_decisions:
- issue: Sens philosophique et religieux de ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison inspirée par la piété
  rationale: La formulation concise conserve ensemble les dimensions rationnelle et religieuse du concept, sans expliquer excessivement le rapport entre elles.
- issue: Autorité de la raison sur τὰ πάθη
  choice: est maîtresse des passions
  alternative: exerce une autorité souveraine sur les passions
  rationale: La traduction maintient l’affirmation forte du texte selon laquelle la raison pieuse domine les passions, sans préciser davantage la nature ou les limites de cette domination.
translation_notes:
  register: Français international actuel, digne et accessible. Les tirets mettent en relief l’accumulation descriptive du grec. « Raison pieuse » et « passions » conservent le vocabulaire philosophique structurant de 4 Maccabées.
