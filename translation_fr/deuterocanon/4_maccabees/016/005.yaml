  yaml_path: translation/deuterocanon/4_maccabees/016/005.yaml
  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: fr
  text: 'Réfléchissez aussi à ceci : si cette femme avait manqué de courage, bien qu’elle fût mère, elle aurait poussé des lamentations sur eux et aurait peut-être parlé ainsi :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: Réfléchissez aussi à ceci
  rationale: L’infinitif invite l’auditoire à prendre en considération un argument supplémentaire. L’impératif français restitue naturellement cette valeur exhortative.
- source_word: δειλόψυχος
  choice: avait manqué de courage
  rationale: Le composé désigne un manque de courage ou de fermeté intérieure. Cette formulation est naturelle et moins accusatrice que « avait été lâche ».
- source_word: ἡ γυνή
  choice: cette femme
  rationale: Le nom désigne ici la femme déjà évoquée, tandis que μήτηρ οὖσα précise séparément sa qualité de mère.
- source_word: καίπερ μήτηρ οὖσα
  choice: bien qu’elle fût mère
  rationale: « Bien que » conserve nettement la valeur concessive de καίπερ et l’accent rhétorique placé sur la maternité.
- source_word: ὠλοφύρετο ἂν ἐπʼ αὐτοῖς
  choice: elle se serait lamentée sur eux
  rationale: Le verbe évoque une lamentation de deuil, possiblement audible. « Se lamenter sur eux » demeure digne et idiomatique en français.
- source_word: ἴσως ἂν ταῦτα οὕτως εἶπεν
  choice: aurait peut-être parlé ainsi
  rationale: La formulation conserve le caractère hypothétique et introduit directement le discours imaginé qui suit.
theological_decisions:
- issue: Tension entre l’affection maternelle naturelle et la fermeté raisonnée
  choice: 'Conserver la proposition comme un contraste hypothétique : si elle avait manqué de courage, malgré sa qualité de mère, elle se serait lamentée.'
  alternative: Expliciter que l’affection maternelle produit normalement la lamentation.
  rationale: Le grec laisse cette tension dans la rhétorique du passage sans formuler de jugement doctrinal supplémentaire. La traduction évite donc d’ajouter une explication morale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé du subjonctif « fût » est retenu dans la locution courante « bien qu’elle fût mère » pour préserver une tonalité digne; aucune note n’est nécessaire.
