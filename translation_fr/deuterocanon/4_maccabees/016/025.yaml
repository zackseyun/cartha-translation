  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: fr
  text: 'Et plus encore, en voyant ceci : après être morts pour Dieu, ils vivent pour lui[a], tout comme Abraham, Isaac et Jacob, ainsi que tous les patriarches —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils vivent aux yeux de Dieu ». Le grec dit littéralement : « ils vivent pour Dieu » ou « ils vivent à Dieu ».'
    reason: Préserver l’ambiguïté du datif τῷ θεῷ, dont le sens relationnel ne correspond pas exactement à une seule tournure française naturelle.
lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: Et plus encore
  rationale: Rend la valeur à la fois additive et emphatique de l’expression dans un français naturel.
- source_word: ταῦτα ἰδόντες
  choice: en voyant ceci
  rationale: Conserve la construction participiale et comprend le pluriel grec ταῦτα collectivement, comme renvoyant à la réalité considérée.
- source_word: διὰ τὸν θεόν
  choice: pour Dieu
  rationale: 'Dans ce contexte de martyre, διά avec l’accusatif exprime naturellement la cause ou le motif : mourir à cause de son attachement à Dieu.'
- source_word: ἀποθανόντες
  choice: après être morts
  rationale: Le participe aoriste présente une action antérieure à celle du verbe principal et se rend clairement ainsi en français.
- source_word: ζῶσιν τῷ θεῷ
  choice: ils vivent pour lui
  rationale: Le pronom renvoie clairement à Dieu et « pour lui » conserve autant que possible la relation exprimée par le datif grec sans préciser indûment le mode de cette vie.
- source_word: ὥσπερ
  choice: tout comme
  rationale: Introduit clairement et naturellement la comparaison.
- source_word: οἱ πατριάρχαι
  choice: les patriarches
  rationale: Terme français courant et précis pour les ancêtres fondateurs désignés ici.
theological_decisions:
- issue: La vie après la mort des justes martyrs dans leur relation à Dieu
  choice: ils vivent pour lui
  alternative: ils vivent auprès de Dieu / ils sont vivants aux yeux de Dieu
  rationale: Le texte affirme qu’ils vivent dans une relation à Dieu, en les comparant à Abraham, Isaac, Jacob et aux patriarches. La formulation retenue préserve le datif et l’affirmation de leur vie sans transformer celle-ci en description précise de leur état ou de leur lieu.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux-points explicitent la valeur de « ceci » sans ajouter de contenu. Le tiret final est conservé parce que le verset forme une unité syntaxique ouverte sur la suite.
