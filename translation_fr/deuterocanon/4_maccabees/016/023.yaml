  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
translation:
  language: fr
  text: Car[a], tout en sachant que la piété envers Dieu n’a rien d’irrationnel, ils n’ont pas reculé devant les souffrances.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « sachant qu’être pieux n’est pas irrationnel, ne pas résister aux souffrances ». La formulation grecque est très resserrée et peut être représentée plus formellement de cette manière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλόγιστον
  choice: n’a rien d’irrationnel
  rationale: L’adjectif signifie « irrationnel », « contraire à la raison ». La tournure française avec négation préserve le rapport entre piété et raison qui structure le passage, sans affaiblir l’expression grecque.
- source_word: εἰδότας
  choice: tout en sachant
  rationale: Le participe accusatif fournit l’arrière-plan de l’action. « Tout en sachant » restitue naturellement sa valeur circonstancielle et la nuance concessive perceptible dans le contexte.
- source_word: εὐσεβεῖν
  choice: la piété envers Dieu
  rationale: Le verbe désigne le fait de vivre avec piété ou de manifester de la révérence. L’ajout « envers Dieu » explicite la portée religieuse du terme en français moderne sans lui imposer une doctrine particulière.
- source_word: μὴ ἀνθίστασθαι
  choice: ils n’ont pas reculé devant
  rationale: Le sens premier est « ne pas résister, ne pas s’opposer ». Avec les souffrances comme complément, « ne pas reculer devant » exprime idiomatiquement l’endurance courageuse, tandis que la traduction plus formelle est signalée en note.
- source_word: τοῖς πόνοις
  choice: les souffrances
  rationale: πόνος peut désigner la peine, la douleur ou l’épreuve. « Souffrances » convient au contexte du martyre tout en évitant l’intensification interprétative de « tortures ».
theological_decisions:
- issue: Rapport entre la piété et la raison
  choice: La phrase affirme que la piété envers Dieu n’a rien d’irrationnel.
  alternative: « sachant qu’il est irrationnel d’être pieux et de ne pas résister aux souffrances »
  rationale: La syntaxe grecque est très resserrée. La lecture retenue s’accorde le mieux avec l’argument du livre sur la raison pieuse et l’endurance des martyrs. La note conserve toutefois la formulation plus littérale et rend visible l’ambiguïté grammaticale au lieu de la dissimuler.
translation_notes:
  register: Français international moderne, digne et accessible. « Piété envers Dieu » garde la portée religieuse de εὐσεβεῖν ; « n’ont pas reculé devant » donne une expression française naturelle au contexte du martyre. La note documente la syntaxe comprimée et l’alternative plus formelle.
