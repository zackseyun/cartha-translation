  yaml_path: translation/deuterocanon/4_maccabees/016/004.yaml
  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: fr
  text: Mais la mère éteignit, par son raisonnement pieux, des passions si nombreuses et si puissantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste appuyé avec le contexte précédent, sans surinterpréter sa portée.
- source_word: τῷ λογισμῷ τῆς εὐσεβείας
  choice: par le raisonnement inspiré par la piété
  rationale: 'Conserve la valeur instrumentale du datif et les deux composantes de l’expression : la délibération rationnelle et la dévotion envers Dieu. « Inspiré par » exprime naturellement en français le rapport du génitif sans le réduire à un simple adjectif.'
- source_word: κατέσβεσε
  choice: éteignit
  rationale: Préserve la métaphore vive du verbe grec, qui signifie éteindre ou étouffer comme on éteint un feu.
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: si nombreuses et si fortes
  rationale: Rend la double insistance grecque sur le nombre et l’intensité dans un français naturel. « Fortes » convient aux passions tout en évitant l’expression peu idiomatique « si grandes ».
- source_word: πάθη
  choice: passions
  rationale: 'Maintient le vocabulaire philosophique central de 4 Maccabées : les mouvements affectifs que le raisonnement pieux maîtrise, plutôt que les souffrances extérieures.'
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Suit simplement l’article et le nom grecs sans ajouter le possessif « leur ».
theological_decisions:
- issue: Sens de λογισμῷ τῆς εὐσεβείας
  choice: par le raisonnement inspiré par la piété
  alternative: par le raisonnement de la piété
  rationale: La formulation retenue maintient l’union entre raison et dévotion envers Dieu tout en restant naturelle en français. Elle ne transforme pas la raison en autonomie pure ni la piété en irrationalité.
- issue: Valeur de πάθη dans le contexte
  choice: passions
  alternative: souffrances
  rationale: Le vocabulaire et le thème philosophique de l’ouvrage favorisent les émotions ou impulsions maîtrisées par la raison. Une note signale toutefois l’autre sens lexical possible sans effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en relief le moyen de cette maîtrise, comme le grec. Le passé simple convient au registre narratif et littéraire du passage.
