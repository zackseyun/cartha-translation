review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement l’adversatif, le moyen instrumental, la métaphore d’« éteindre » et les πάθη comme passions. Toutefois, « inspiré par la piété » interprète plus précisément le génitif τῆς εὐσεβείας que ne le permet le grec, qui qualifie plus sobrement le raisonnement comme pieux/de piété.
  naturalness: La proposition actuelle est globalement naturelle, mais « raisonnement inspiré par la piété » est explicatif. « Son raisonnement pieux » est plus direct et idiomatique dans un français moderne tout en conservant les deux notions.
  terminology: « Raisonnement », « piété », « éteignit » et « passions » conviennent au vocabulaire philosophique et religieux de 4 Maccabées. « Puissantes » rend naturellement la grandeur ou l’ampleur des passions, sans restreindre τηλικαῦτα à une seule nuance.
  issues:
  - severity: medium
    issue: « inspiré par la piété » surinterprète le rapport génitival
    rationale: Le grec dit littéralement « le raisonnement de la piété ». La formulation proposée suggère que la piété est la source inspiratrice du raisonnement, relation possible mais non explicitée par le texte. « Raisonnement pieux » préserve mieux la concision et l’ambiguïté du grec.
  - severity: low
    issue: Note lexicale superflue et potentiellement trompeuse
    rationale: Bien que πάθη puisse, dans certains contextes, se rapporter aux souffrances, le contexte immédiat de 4 Maccabées vise clairement les passions ou impulsions que maîtrise le raisonnement. Une note sur cette autre possibilité risque d’introduire une ambiguïté non active ici.
  revised_text: Mais la mère éteignit, par son raisonnement pieux, des passions si nombreuses et si puissantes.
  revised_footnotes: []
  revision_rationale: La révision évite d’expliciter indûment la relation entre le raisonnement et la piété, tout en gardant le vocabulaire directeur de l’ouvrage. Elle conserve l’intensification double de τοσαῦτα καὶ τηλικαῦτα dans une formulation française naturelle. La note est retirée, car le sens contextuel de « passions » ne requiert pas ici d’alternative lexicale.
