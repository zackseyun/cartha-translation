  text: So you also[a], having the same faith toward God[b], do not be distressed.
translation:
  language: fr
  text: Ainsi donc, vous aussi, qui avez la même foi en Dieu[a], ne vous troublez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la même confiance envers Dieu ». Le grec πίστις peut aussi évoquer la confiance ou la fidélité selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne vous affligez pas », « ne vous irritez pas » ou « ne vous laissez pas gagner par l’amertume ». Le verbe grec peut exprimer le trouble ou la peine, l’irritation, voire l’amertume.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Ainsi donc, vous aussi
  rationale: Cette formulation naturelle conserve la continuité de καί, la valeur conclusive de οὖν et l’insistance portée par ὑμεῖς.
- source_word: τὴν αὐτὴν πίστιν
  choice: la même foi
  rationale: Dans cette exhortation, πίστις désigne la disposition envers Dieu que les destinataires partagent avec les martyrs; « foi » en préserve la portée religieuse sans exclure la nuance de confiance.
- source_word: πρὸς τὸν θεόν
  choice: en Dieu
  rationale: Bien que πρός exprime littéralement une orientation ou une relation envers Dieu, « foi en Dieu » est l’expression française idiomatique et traduit clairement cette relation.
- source_word: ἔχοντες
  choice: puisque vous avez
  rationale: Le participe circonstanciel est rendu par une proposition causale naturelle en français, qui fait de cette foi commune le fondement de l’exhortation.
- source_word: μὴ χαλεπαίνητε
  choice: ne vous laissez pas gagner par l’amertume
  rationale: χαλεπαίνω peut exprimer l’irritation, la peine ou l’aigreur. Dans le contexte de souffrance et de deuil, cette formulation garde la dimension affective et la possible nuance d’aigreur sans réduire le verbe à la seule colère.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: confiance; fidélité
  rationale: Le contexte évoque avant tout une disposition confiante et ferme envers Dieu, partagée avec les martyrs. « Foi » conserve la densité théologique du terme et sa largeur sémantique; la nuance de confiance est signalée en note.
- issue: Portée de χαλεπαίνω
  choice: se laisser gagner par l’amertume
  alternative: s’affliger; s’irriter; se laisser bouleverser
  rationale: Le verbe autorise plusieurs réactions négatives, allant de la peine à l’irritation. Le texte principal retient une formulation adaptée au contexte sans faire de la colère le seul sens possible, et la note maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale grecque est explicitée par « puisque », plus naturelle en français. Le vouvoiement pluriel rend l’adresse collective explicite.
