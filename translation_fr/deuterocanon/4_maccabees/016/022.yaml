  naturalness: La rédaction est globalement naturelle. « Vous aussi, qui avez… » rend souplement le participe en français sans imposer son lien logique précis. « Ne vous troublez pas » est idiomatique dans un registre exhortatif moderne et laisse place aux nuances du grec, précisées en note.
  terminology: « Foi en Dieu » est l’expression française courante pour πίστις πρὸς τὸν θεόν et préserve le terme théologique sans surtraduire la préposition. La note conserve à juste titre « confiance » et « fidélité » comme possibilités contextuelles.
