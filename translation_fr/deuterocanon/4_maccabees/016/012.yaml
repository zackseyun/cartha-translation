- from: Elle ne cherchait pas non plus à détourner l’un d’eux de sa voie pour qu’il ne meure pas, et elle ne s’affligea pas lorsqu’ils mouraient.
  to: Elle ne cherchait pas non plus à empêcher l’un d’eux de mourir, et elle ne s’affligea pas lorsqu’ils mouraient.
  rationale: Suppression de l’ajout interprétatif « de sa voie ». La formulation « chercher à empêcher ... de mourir » conserve l’idée d’une tentative de prévenir la mort, tandis que le singulier « l’un d’eux » maintient la portée distributive. Aucun renvoi de note n’est requis par le texte fourni.
