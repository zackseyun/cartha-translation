review_pass:
  verdict: revise
  source_fidelity: La première proposition traduit bien la négation, l’imparfait de ἀπέτρεπεν et la portée distributive de αὐτῶν τινα. Toutefois, « de sa voie » introduit un complément absent du grec et spécifie indûment ce dont chacun aurait été détourné. La correction rend explicitement le sens contextuel de prévention sans ajouter l’idée d’une voie particulière. La seconde proposition préserve correctement l’aoriste ἐλυπήθη et la simultanéité de ὡς ἀποθνῃσκόντων.
  naturalness: La phrase corrigée est naturelle en français international moderne. Le contraste des temps (« ne cherchait pas » / « ne s’affligea pas ») reflète utilement l’imparfait puis l’aoriste grecs. « Lorsqu’ils mouraient » est clair et digne, tout en exprimant la circonstance contemporaine.
  terminology: « Empêcher l’un d’eux de mourir » est une formulation française idiomatique qui rend, dans ce contexte, l’idée de détourner/dissuader en vue d’éviter la mort, sans suggérer une réussite effective grâce à « cherchait à ». « S’affliger » convient à ἐλυπήθη et n’impose pas le sens plus étroit d’un deuil après la mort.
  issues:
  - severity: medium
    issue: Ajout de « de sa voie »
    rationale: Le grec dit seulement qu’elle ne détournait aucun d’eux afin qu’il ne meure pas; il ne mentionne ni « voie », ni chemin, ni ligne de conduite. Cet ajout concrétise de manière interprétative un complément que le texte laisse non exprimé.
  revised_text: Elle ne cherchait pas non plus à empêcher l’un d’eux de mourir, et elle ne s’affligea pas lorsqu’ils mouraient.
