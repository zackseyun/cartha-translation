  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: fr
  text: Elle ne cherchait pas non plus à empêcher l’un d’eux de mourir, et elle ne s’affligea pas lorsqu’ils mouraient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: ne cherchait pas … à détourner
  rationale: L’imparfait peut présenter une conduite continue ou répétée. « Cherchait à détourner » exprime ici l’effort de dissuasion sans laisser entendre qu’elle aurait effectivement empêché leur mort.
- source_word: αὐτῶν τινα
  choice: l’un d’eux
  rationale: L’expression partitive désigne un membre quelconque du groupe. Sous la négation, « ne… l’un d’eux » garde naturellement en français la portée de « aucun d’eux » tout en restant proche de la construction grecque.
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: pour qu’il ne meure pas
  rationale: La proposition exprime le but. Le singulier français s’accorde avec « l’un d’eux » et conserve le sens distributif de la formulation grecque.
- source_word: ἐλυπήθη
  choice: elle ne s’affligea pas
  rationale: Le verbe exprime la peine ou la douleur. « S’affliger » convient au registre digne du passage sans limiter le sens à un deuil postérieur au décès.
- source_word: ὡς ἀποθνῃσκόντων
  choice: lorsqu’ils mouraient
  rationale: Le génitif absolu situe la réaction de la mère pendant la mort de ses fils; l’imparfait rend l’aspect en cours du participe présent.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Expliciter le sujet par « elle », qui désigne la mère.
  alternative: Conserver autant que possible un sujet implicite.
  rationale: Le grec n’exprime pas le sujet, mais le contexte immédiat l’identifie à la mère. Le français exige normalement son explicitation; cela clarifie la phrase sans ajouter une interprétation doctrinale.
- issue: Portée de l’absence d’affliction
  choice: Conserver l’énoncé direct « elle ne s’affligea pas » sans expliquer son état intérieur.
  alternative: Atténuer en disant qu’elle ne se laissa pas accabler ou qu’elle ne manifesta pas sa peine.
  rationale: Le grec affirme directement qu’elle ne s’affligea pas au moment où ils mouraient. Une reformulation psychologique résoudrait indûment la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe parallèle « ne… pas non plus… et… ne… pas » reproduit les deux membres négatifs du grec sans tournure archaïque.
