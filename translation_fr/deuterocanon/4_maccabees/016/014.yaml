base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: fr
  text: Ô mère, soldat de la piété envers Dieu[a], bien qu’âgée et femme, par ton endurance tu as vaincu même un tyran, et tu t’es montrée plus forte qu’un homme, en actes comme en paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévouement à Dieu ». Le grec εὐσέβεια peut désigner la piété, la révérence ou l’attachement religieux.
    reason: alternative lexicale
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: piété envers Dieu
  rationale: εὐσέβεια exprime ici la révérence et l’attachement religieux dirigés vers Dieu. « Piété envers Dieu » reste proche du grec tout en étant intelligible en français moderne.
- source_word: στρατιῶτι
  choice: soldat
  rationale: Le datif appositionnel présente métaphoriquement la mère comme un soldat engagé dans le combat de la piété; « soldat » conserve directement l’image militaire.
- source_word: πρεσβῦτι καὶ γυνή
  choice: malgré ton grand âge et ta condition de femme
  rationale: Cette formulation explicite la valeur concessive de la juxtaposition grecque et préserve les deux éléments rhétoriques opposés à sa victoire, l’âge et le sexe.
- source_word: διὰ καρτερίαν
  choice: par ton endurance
  rationale: καρτερία désigne la fermeté qui tient bon sous l’épreuve; « endurance » conserve ici la valeur instrumentale de διά.
- source_word: καὶ τύραννον ἐνίκησας
  choice: tu as vaincu même un tyran
  rationale: ἐνίκησας indique une victoire effective. « Même » rend l’effet emphatique de καί devant τύραννον.
- source_word: ἔργοις δυνατωτέρα καὶ λόγοις
  choice: plus forte… en actes comme en paroles
  rationale: La traduction maintient le comparatif δυνατωτέρα et le parallélisme entre ἔργοις et λόγοις dans un ordre français naturel.
- source_word: εὑρέθης ἂν ἀνδρός
  choice: tu t’es montrée plus forte qu’un homme
  rationale: « Tu t’es montrée » rend idiomatiquement εὑρέθης dans le sens de « tu as été reconnue/prouvée ». Le contraste explicite entre la femme et l’homme est conservé.
theological_decisions:
- issue: Portée religieuse de εὐσέβεια
  choice: piété envers Dieu
  alternative: dévouement à Dieu
  rationale: « Piété » conserve l’étendue sémantique de la révérence et de la conduite fidèle, tandis que « envers Dieu » indique clairement son orientation sans en faire un terme doctrinal plus précis que le grec.
- issue: Comparaison sexuée dans la dernière proposition
  choice: conserver « femme » et « homme »
  alternative: neutraliser par « plus forte que quiconque »
  rationale: Le grec construit délibérément son éloge sur le contraste entre γυνή et ἀνήρ. Le neutraliser effacerait un élément central de la rhétorique du verset.
- issue: Valeur de ἄν avec εὑρέθης
  choice: ne pas ajouter une nuance hypothétique explicite
  alternative: « on aurait pu te trouver plus forte »
  rationale: Dans cette phrase rhétorique, ἄν ne justifie pas nécessairement une condition irréelle autonome en français. « Tu t’es montrée » transmet naturellement le constat élogieux tout en évitant une hypothèse artificielle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe solennelle « Ô mère » et l’image militaire sont conservées; la syntaxe est légèrement réorganisée pour une lecture française naturelle sans atténuer le contraste rhétorique entre l’âge, la condition de femme et la force manifestée.
