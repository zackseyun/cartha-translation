base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: fr
  text: Daniel le juste fut jeté aux lions ; Ananias, Azarias et Misaël[a] furent projetés dans une fournaise de feu[b], et ils tinrent bon à cause de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il s’agit des noms hébreux des trois jeunes hommes, souvent connus sous leurs noms babyloniens : Shadrak, Méshak et Abed-Nego.'
    reason: alternative_reading
  - marker: b
    text: On traduit souvent « dans une fournaise ardente ». Le grec dit plus littéralement « dans une fournaise de feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé sert d’épithète à Daniel. « Le juste » conserve sa portée morale et religieuse dans une formulation française naturelle et digne.
- source_word: εἰς λέοντας
  choice: aux lions
  rationale: Avec ἐβλήθη, l’expression décrit Daniel livré aux lions. « Jeté aux lions » est idiomatique sans ajouter la « fosse », absente du grec.
- source_word: ἐβλήθη
  choice: fut jeté
  rationale: L’aoriste passif de βάλλω est rendu simplement et avec la force voulue par « fut jeté ».
- source_word: ἀπεσφενδονήθησαν
  choice: furent projetés
  rationale: Ce verbe évoque une projection violente et est plus expressif que le simple βάλλω employé auparavant ; « furent projetés » maintient cette nuance sans formulation artificielle.
- source_word: εἰς κάμινον πυρὸς
  choice: dans une fournaise de feu
  rationale: Cette formulation conserve explicitement κάμινος et πυρός. Elle reste compréhensible tout en suivant de près l’expression grecque, plutôt que de la réduire à « fournaise ».
- source_word: ὑπέμειναν
  choice: ils tinrent bon
  rationale: Employé absolument, le verbe exprime une endurance ferme sous l’épreuve. « Tinrent bon » est courant, énergique et n’exige pas l’ajout d’un complément absent du texte.
- source_word: διὰ τὸν θεόν
  choice: à cause de Dieu
  rationale: διά avec l’accusatif indique ici le motif ou la raison de leur endurance. La traduction conserve cette relation sans préciser davantage si Dieu en est la cause, l’objet de leur fidélité ou la raison ultime.
theological_decisions:
- issue: Noms des trois jeunes hommes
  choice: Ananias, Azarias et Misaël
  alternative: Shadrak, Méshak et Abed-Nego
  rationale: Le grec donne leurs noms hébreux sous leur forme grecque. La traduction les conserve au lieu de leur substituer les noms babyloniens plus familiers dans certaines traditions.
- issue: Valeur morale et religieuse de δίκαιος appliqué à Daniel
  choice: le juste
  alternative: l’homme juste
  rationale: « Le juste » rend directement l’adjectif substantivé et préserve son caractère d’épithète, sans introduire une lecture doctrinale particulière.
- issue: Rapport exprimé par διὰ τὸν θεόν
  choice: à cause de Dieu
  alternative: pour Dieu
  rationale: La formulation retenue garde la valeur causale ou motivante de διά avec l’accusatif et évite de réduire explicitement le sens à la seule finalité ou à la fidélité.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le passé simple convient au récit bref. « Tinrent bon » apporte une vigueur naturelle, tandis que « fournaise de feu » conserve délibérément la tournure concrète du grec.
