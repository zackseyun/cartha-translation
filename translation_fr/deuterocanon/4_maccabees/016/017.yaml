  text: willingly for the ancestral law[a]. For it is shameful that this old man should endure the pains that come because of godliness[b], but you—
translation:
  language: fr
  text: de bon cœur pour la Loi de nos ancêtres. Il serait en effet honteux que ce vieillard endure les souffrances dues à sa fidélité envers Dieu[a], tandis que vous…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa piété ». Le grec εὐσέβεια désigne ici la révérence et la fidélité manifestées envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: La phrase reste inachevée dans ce verset et se poursuit au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: προθύμως
  choice: de bon cœur
  rationale: L’adverbe exprime une disposition volontaire et empressée. « De bon cœur » conserve cette nuance dans un français naturel sans exagérer l’intensité émotionnelle.
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: pour la Loi de nos ancêtres
  rationale: ὑπέρ avec le génitif signifie ici « pour » ou « en faveur de », tandis que πατρίος désigne ce qui est transmis par les ancêtres. Cette formulation est claire et convient au contexte maccabéen.
- source_word: αἰσχρόν
  choice: honteux
  rationale: Le terme exprime la honte ou le déshonneur moral et soutient l’appel exhortatif du passage.
- source_word: τὸν μὲν γέροντα τοῦτον
  choice: que ce vieillard
  rationale: γέρων désigne directement un homme âgé. « Ce vieillard » est digne et maintient le contraste rhétorique marqué par μέν…δέ.
- source_word: ὑπομεῖναι
  choice: endure
  rationale: Le verbe évoque le fait de tenir ferme sous l’épreuve. « Endurer » restitue précisément cette persévérance dans la souffrance.
- source_word: τὰς … ἀλγηδόνας
  choice: les souffrances
  rationale: ἀλγηδών désigne des douleurs ou des souffrances. « Souffrances » convient au contexte sans renforcer indûment le terme en « tortures ».
- source_word: διὰ τὴν εὐσέβειαν
  choice: dues à sa fidélité envers Dieu
  rationale: διά avec l’accusatif exprime ici la cause. εὐσέβεια désigne une révérence fidèle envers Dieu, manifestée notamment par l’observance de sa Loi ; la formulation rend explicite cette orientation sans la réduire à une simple pratique extérieure.
theological_decisions:
- issue: Rendu de εὐσέβεια dans un contexte de martyre
  choice: fidélité envers Dieu
  alternative: piété
  rationale: « Fidélité envers Dieu » rend accessible la dimension de révérence et d’attachement concret à Dieu présente dans εὐσέβεια. « Piété » reste une traduction possible, mais peut évoquer en français moderne une dévotion plus étroite ou seulement intérieure.
- issue: Maintien du contraste inachevé μέν…δέ
  choice: « tandis que vous… »
  alternative: compléter la pensée à partir du verset suivant
  rationale: Le texte fourni s’interrompt après ὑμᾶς δέ. L’ellipse et les points de suspension préservent la tension syntaxique sans importer dans ce verset les mots du suivant.
translation_notes:
  register: Français international moderne, sobre et exhortatif. Le début du verset étant lui-même la suite d’une phrase antérieure, la traduction commence par une minuscule. La majuscule à « Loi » signale ici la Loi ancestrale d’Israël sans ajouter de précision absente du grec.
