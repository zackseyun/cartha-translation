    reason: alternative_reading
  revision_rationale: La révision allège « manière de vivre juste » en « vie juste » et évite l’ajout interprétatif « ainsi » ainsi que la voix passive dans la dernière proposition. Elle maintient le rythme ternaire, les termes moraux essentiels et l’ambiguïté relative de la clausule grecque.
