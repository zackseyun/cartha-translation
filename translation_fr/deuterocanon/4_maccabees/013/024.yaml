base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: fr
  text: Ils avaient entre eux une concorde plus solide[a]. En effet, formés par la même Loi, exercés aux mêmes vertus et élevés dans une vie juste, ils se rapprochèrent davantage les uns des autres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une unité de pensée plus ferme ».'
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition est très comprimée en grec et sa syntaxe est difficile. Elle exprime vraisemblablement que leur formation commune dans la Loi, les vertus et une vie juste resserra leur union.
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον
  choice: plus solide
  rationale: Le comparatif exprime ici une plus grande fermeté ou stabilité; « plus solide » qualifie naturellement la concorde en français.
- source_word: ὁμόνοιαν
  choice: concorde
  rationale: Le terme désigne l’unité de pensée et l’accord mutuel. « Concorde » conserve cette nuance relationnelle dans un registre digne et actuel.
- source_word: νόμῳ τῷ αὐτῷ
  choice: par la même Loi
  rationale: Dans 4 Maccabées, νόμος renvoie normalement à la Loi juive ancestrale. La majuscule rend ce référent probable sans ajouter « de Moïse » ou « Torah » au texte.
- source_word: παιδευθέντες
  choice: formés
  rationale: Le participe passif englobe l’éducation, l’instruction et la discipline morale; « formés » restitue cette amplitude avec concision.
- source_word: ἐξασκήσαντες
  choice: exercés
  rationale: Le verbe évoque la pratique assidue et l’entraînement. « Exercés aux mêmes vertus » conserve la métaphore de la discipline morale.
- source_word: ἀρετάς
  choice: vertus
  rationale: Dans le discours moral hellénistique, le mot désigne les qualités ou excellences morales; « vertus » est l’équivalent français le plus direct.
- source_word: συντραφέντες
  choice: élevés
  rationale: Le verbe décrit le fait d’avoir été nourris et élevés; le contexte communique déjà la dimension d’une formation partagée.
- source_word: τῷ δικαίῳ ... βίῳ
  choice: dans une manière de vivre juste
  rationale: Cette formulation exprime un mode de vie conforme à la justice tout en restant naturelle en français moderne.
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: ils furent ainsi rapprochés davantage les uns des autres
  rationale: La clause grecque est fortement comprimée et sa construction est difficile. La tournure passive française exprime prudemment le résultat contextuel de leur formation commune sans lui attribuer une cause étrangère au passage.
theological_decisions:
- issue: Référent de « Loi » dans un récit juif de martyrs
  choice: La « même Loi » désigne vraisemblablement la Loi juive commune qui a formé les frères.
  alternative: Une loi morale prise au sens général.
  rationale: Dans 4 Maccabées, νόμος renvoie régulièrement à la Loi ancestrale d’Israël. Le texte traduit reste bref et n’ajoute aucune précision confessionnelle.
- issue: Rapport entre formation morale et unité fraternelle
  choice: La formation commune dans la Loi, les vertus et une vie juste est présentée comme ayant resserré leur concorde.
  alternative: Comprendre la dernière proposition comme une action accomplie par les frères sur eux-mêmes.
  rationale: La syntaxe finale est comprimée et possiblement perturbée; le contexte privilégie l’idée d’un rapprochement mutuel sans préciser excessivement le mécanisme causal.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme ternaire des participes grecs est conservé. « Concorde » maintient la dimension d’accord intérieur et mutuel, tandis que la note signale la difficulté réelle de la clause finale.
