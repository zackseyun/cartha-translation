revisions:
- from: Ils avaient entre eux une concorde plus solide[a]. En effet, formés par la même Loi, exercés aux mêmes vertus et élevés dans une manière de vivre juste, ils furent ainsi rapprochés davantage les uns des autres[b].
  to: Ils avaient entre eux une concorde plus solide[a]. En effet, formés par la même Loi, exercés aux mêmes vertus et élevés dans une vie juste, ils se rapprochèrent davantage les uns des autres[b].
  rationale: La révision allège « manière de vivre juste » en « vie juste » et évite l’ajout interprétatif « ainsi » ainsi que la voix passive dans la dernière proposition. Elle maintient le rythme ternaire, les termes moraux essentiels et l’ambiguïté relative de la clausule grecque.
