  text: For[a], having formed a sacred chorus of piety, they kept encouraging one another, saying,
translation:
  language: fr
  text: 'Car, ayant formé un chœur sacré de piété[a], ils s’encourageaient mutuellement en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un chœur saint de piété ». Le grec associe l’imagerie cultuelle d’un « chœur sacré » au terme εὐσέβεια, qui désigne ici la piété, c’est-à-dire une fidélité dévouée envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: sacré
  rationale: Le terme désigne ce qui appartient au domaine religieux ou est consacré; « sacré » conserve ici l’imagerie cultuelle.
- source_word: εὐσεβείας
  choice: de piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la fidélité respectueuse et dévouée envers Dieu. « Piété » rend naturellement cette vertu religieuse centrale sans la réduire à la seule révérence.
- source_word: στήσαντες
  choice: après avoir formé
  rationale: Avec χορόν, le participe aoriste de ἵστημι évoque la constitution ou la disposition d’un chœur; la tournure marque aussi l’antériorité par rapport à l’encouragement mutuel.
- source_word: χορὸν
  choice: chœur
  rationale: « Chœur » préserve l’image grecque d’un groupe uni dans une expression collective, sans préciser indûment qu’il s’agit d’une chorale moderne.
- source_word: παρεθάρσυνον
  choice: ne cessaient de s’encourager
  rationale: L’imparfait exprime une action prolongée ou répétée; cette formulation en restitue la valeur durative.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Équivalent réciproque naturel et adapté à un groupe de plusieurs personnes.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe introduit directement les paroles qui suivent tout en reliant naturellement les deux propositions.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: fidélité envers Dieu; révérence
  rationale: « Piété » conserve la dimension religieuse et morale du terme, centrale dans 4 Maccabées, sans résoudre son champ sémantique en faveur de la seule révérence ou de la seule fidélité.
- issue: Portée de l’image ἱερὸν…χορὸν
  choice: chœur sacré de piété
  alternative: saint chœur de piété; chœur consacré à la piété
  rationale: La formulation maintient l’association grecque inhabituelle entre l’imagerie cultuelle du chœur et la vertu de piété, sans transformer la métaphore en affirmation institutionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la métaphore rhétorique du chœur ainsi que la valeur continue de l’imparfait grec; les deux-points annoncent les paroles du verset suivant.
