lexical_decisions:
- source_word: ἀσκήσεως
  choice: discipline
  rationale: Le nom désigne un exercice ou un entraînement assidu. « Discipline » convient au contexte moral sans lui imposer le sens technique plus tardif de l’ascétisme.
- source_word: ἐν νόμῳ θεοῦ
  choice: sous la loi de Dieu
  rationale: Cette formulation naturelle situe leur discipline dans le cadre et sous l’autorité de la loi divine, tout en conservant la portée de ἐν.
- source_word: φιλαδελφίας
  choice: affection fraternelle
  rationale: Le terme désigne ici l’attachement entre frères; « affection fraternelle » garde cette dimension familiale précise.
- source_word: συμπαθούσης
  choice: dans une sympathie partagée
  rationale: Le participe exprime une communauté de sentiments et de compassion. La tournure française rattache cette disposition à leur affection fraternelle sans l’effacer.
- source_word: καθεστηκυίας
  choice: s’était établie
  rationale: Le parfait décrit un état désormais établi. Le plus-que-parfait français rend naturellement ce résultat acquis.
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: les sept frères
  rationale: Le grec emploie explicitement le masculin et renvoie aux sept frères du récit.
- source_word: συνπα-
  choice: s’unirent—
  rationale: Le témoin fourni s’interrompt au milieu d’un mot composé commençant par συνπα-. La traduction reste donc prudente et provisoire; le tiret signale matériellement l’interruption.
theological_decisions:
- issue: Langage genré désignant les membres de la fratrie
  choice: les sept frères
  alternative: les sept membres de la fratrie
  rationale: Le texte grec est explicitement masculin et le récit concerne sept frères; il n’y a pas lieu de neutraliser cette donnée.
- issue: Fin de verset tronquée
  choice: traduction provisoire suivie d’un tiret et d’une note
  alternative: reconstituer le verbe complet d’après une autre édition
  rationale: Le texte source fourni se termine par συνπα-. La traduction signale honnêtement cette lacune au lieu de présenter une reconstitution comme certaine.
translation_notes:
  register: Français moderne, digne et accessible. Le début fragmentaire est conservé, puisqu’il prolonge la phrase du verset précédent. « Ainsi donc » rend l’enchaînement appuyé de οὕτως δὴ τοίνυν sans lourdeur excessive.
