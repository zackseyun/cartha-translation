translation:
  language: fr
  text: amenés à pleine maturité dans leur âme, mis au monde après des périodes de même durée, buvant du lait aux mêmes sources[a], et, depuis lors, élevés ensemble[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « aux mêmes sources » : le grec maintient une vive image maternelle sans nommer explicitement les seins.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi rattacher cette expression aux « sources » et comprendre : « par lesquelles ils sont nourris ou élevés ensemble ». La forme singulière du relatif favorise toutefois la lecture temporelle « depuis lors ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  choice: conduits à la pleine maturité de l’âme
  rationale: Cette formulation conserve la valeur passive de τελεσφορηθέντες et son idée d’un développement mené à son terme, sans employer « perfectionnés », qui risquerait d’introduire une nuance théologique étrangère au contexte.
- source_word: διὰ τῶν ἴσων ... χρόνων
  choice: au terme de durées égales
  rationale: L’expression évoque vraisemblablement les mêmes durées de gestation pour les frères. « Durées égales » respecte le pluriel grec tout en restant intelligible en français.
- source_word: ἀποτεχθέντες
  choice: mis au monde
  rationale: Le participe passif désigne l’enfantement. « Mis au monde » restitue naturellement en français l’image maternelle et la voix passive.
- source_word: γαλακτοποτοῦντες
  choice: buvant le lait
  rationale: Le verbe composé signifie boire du lait. Cette traduction directe permet à πηγῶν de porter séparément l’image des « sources ».
- source_word: πηγῶν
  choice: sources
  rationale: Le nom désigne littéralement des sources ou fontaines et évoque ici, sans les nommer explicitement, les seins maternels.
- source_word: ἀφʼ οὗ
  choice: depuis lors
  rationale: Le relatif est au singulier malgré l’antécédent possible πηγῶν, qui est pluriel. La lecture temporelle « depuis lors » rend donc mieux la forme transmise, tout en laissant signaler l’autre analyse en note.
- source_word: συντρέφονται
  choice: sont élevés ensemble
  rationale: Le préverbe συν- exprime la communauté, et τρέφω peut désigner aussi bien la nourriture que l’éducation ou la croissance. « Sont élevés ensemble » conserve ici cette dimension plus large.
