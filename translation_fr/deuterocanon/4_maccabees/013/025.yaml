  text: For their shared commitment to noble goodness intensified their harmony with one another.
translation:
  language: fr
  text: Car leur unité de pensée dans la noblesse morale renforçait leur concorde mutuelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car leur accord dans la vertu fortifiait l’unité qui les liait les uns aux autres. »'
    reason: Variante lexicale possible pour ὁμόγνοια, καλοκἀγαθία et ὁμόνοια.
lexical_decisions:
- source_word: ὁμόγνοια
  choice: unité de pensée
  rationale: Le terme désigne le fait de partager une même manière de penser. Cette traduction conserve la proximité sémantique avec ὁμόνοια sans confondre les deux termes.
- source_word: καλοκἀγαθίας
  choice: noblesse morale
  rationale: καλοκἀγαθία réunit les idées de noblesse et de bonté en désignant l’excellence du caractère. « Noblesse morale » exprime ce sens de façon naturelle et concise.
- source_word: ἐπέτεινεν
  choice: renforçait
  rationale: Le verbe signifie littéralement étendre ou tendre davantage et, au sens figuré ici, rendre plus forte leur concorde.
- source_word: ὁμόνοιαν
  choice: concorde
  rationale: Le mot exprime l’entente et l’unité entre des personnes. « Concorde » garde un registre digne et permet de le distinguer de l’« unité de pensée » exprimée par ὁμόγνοια.
- source_word: πρὸς ἀλλήλους
  choice: mutuelle
  rationale: L’adjectif rend avec naturel la relation réciproque indiquée par la locution grecque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation maintient la distinction et le parallélisme entre ὁμόγνοια, l’unité intérieure de pensée, et ὁμόνοια, la concorde relationnelle.
