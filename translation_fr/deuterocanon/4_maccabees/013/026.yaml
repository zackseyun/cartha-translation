  text: For along with godliness she made brotherly love even more desirable to them.
translation:
  language: fr
  text: Car, avec la piété, elle rendait l’amour fraternel plus désirable à leurs yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: en même temps que
  rationale: La préposition exprime l’accompagnement et associe la formation de l’amour fraternel à celle de la piété.
- source_word: εὐσεβείᾳ
  choice: la piété envers Dieu
  rationale: Dans 4 Maccabées, le terme désigne une fidélité pieuse orientée vers Dieu. L’explicitation « envers Dieu » évite que « piété » soit compris comme une simple vertu humaine ou une pratique extérieure.
- source_word: ποθεινοτέραν
  choice: plus désirable
  rationale: Le comparatif de ποθεινός qualifie ce qui suscite le désir ou l’attachement. « Plus désirable » conserve directement sa force comparative, sans ajouter un intensif absent du grec.
- source_word: αὐτοῖς
  choice: à leurs yeux
  rationale: 'Le datif indique ici leur appréciation : elle faisait que l’amour fraternel leur paraisse plus désirable.'
- source_word: κατεσκεύαζεν
  choice: elle rendait
  rationale: Avec l’attribut comparatif ποθεινοτέραν, le verbe signifie qu’elle faisait devenir l’amour fraternel plus désirable. L’imparfait « rendait » préserve l’action continue ou répétée.
- source_word: φιλαδελφίαν
  choice: l’amour fraternel
  rationale: Dans ce contexte, le mot concerne l’affection unissant des frères au sens familial concret; l’expression française est naturelle et fidèle.
theological_decisions:
- issue: Portée religieuse de εὐσέβεια
  choice: la piété envers Dieu
  alternative: la piété; la révérence
  rationale: L’ajout « envers Dieu » exprime l’orientation théologique du terme dans l’ouvrage sans introduire de précision confessionnelle.
- issue: Force du comparatif ποθεινοτέραν
  choice: plus désirable
  alternative: encore plus désirable; plus chère
  rationale: Le grec porte un comparatif, mais aucun élément distinct ne correspond nécessairement à « encore ». La formulation retenue préserve la comparaison sans intensification ajoutée.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve le lien causal initial, l’action progressive de la mère exprimée par l’imparfait et la dimension familiale concrète de φιλαδελφία.
