  text: Let us not fear the one who seems to kill[a].
translation:
  language: fr
  text: Ne craignons pas celui qui semble tuer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui paraît tuer » ; autre sens possible : « celui que l’on croit capable de tuer ». Le grec met l’accent sur ce qui n’est qu’apparent.'
    reason: Alternative lexicale et préservation de l’ambiguïté de δοκοῦντα.
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: Ne craignons pas
  rationale: Le subjonctif exhortatif à la première personne du pluriel, précédé de μή, appelle naturellement en français l’exhortation « Ne craignons pas ».
- source_word: τὸν δοκοῦντα
  choice: celui qui semble
  rationale: δοκέω signifie ici le plus naturellement « sembler » ou « paraître ». Cette formulation conserve l’ambiguïté du grec sans préciser indûment si la personne paraît tuer, passe pour tuer ou semble en avoir le pouvoir.
- source_word: ἀποκτενεῖν
  choice: tuer
  rationale: L’infinitif signifie directement « tuer » ou « mettre à mort ». « Tuer » est actuel, sobre et aussi direct que le grec.
theological_decisions:
- issue: 'Portée de τὸν δοκοῦντα ἀποκτενεῖν : pouvoir apparent ou simple apparence de tuer'
  choice: celui qui semble tuer
  alternative: celui qui paraît tuer ; celui que l’on croit capable de tuer
  rationale: Le texte présente le persécuteur sous l’angle de l’apparence, mais la construction ne précise pas explicitement s’il semble accomplir l’acte ou s’il est seulement réputé en avoir le pouvoir. La traduction principale maintient cette tension, et la note signale les autres nuances possibles.
translation_notes:
  register: Français moderne, international et digne. L’exhortation est concise, et l’ordre des idées suit étroitement le grec.
