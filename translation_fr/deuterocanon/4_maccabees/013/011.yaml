lexical_decisions:
- source_word: Θάρρει
  choice: Courage
  rationale: L’impératif exprime un encouragement à affronter l’épreuve avec assurance. En français actuel, « Courage ! » est une exhortation naturelle, concise et énergique.
- source_word: ἀδελφέ
  choice: mon frère
  rationale: Le vocatif masculin singulier désigne ici un frère au sens familial. L’ajout idiomatique de « mon » convient à l’adresse directe en français sans modifier la relation exprimée.
- source_word: Εὐγενῶς
  choice: avec noblesse
  rationale: L’adverbe qualifie la manière de résister ou de persévérer, avec une nuance morale et honorable que « avec noblesse » conserve mieux que le seul « courageusement ».
- source_word: καρτέρησον
  choice: Tiens bon
  rationale: Cet impératif appelle à une endurance ferme sous la souffrance. « Tiens bon » rend cette exhortation de manière naturelle et directe en français moderne.
- source_word: ὁ μέν ... ὁ δέ
  choice: L’un ... l’autre
  rationale: Cette construction corrélative distingue deux locuteurs successifs sans expliciter un nom absent du grec.
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec est rendu par l’imparfait français, qui s’intègre naturellement à la scène et laisse ouverte une éventuelle nuance durative.
