  text: And one said[a], “Take courage, brother,” while another said, “Endure nobly.”
translation:
  language: fr
  text: 'L’un disait[a] : « Courage, mon frère ! », tandis que l’autre disait : « Endure noblement ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un disait … mais l’autre … ». La construction grecque présente deux locuteurs successifs.'
