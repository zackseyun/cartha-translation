base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: fr
  text: Comment donc ne pas reconnaître chez ces hommes la maîtrise des passions liée à une noble réflexion[a], puisqu’ils n’ont pas été détournés de leur résolution, même par les souffrances causées par le feu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « la maîtrise des passions propre à l’eulogistia ». Ce terme grec rare peut évoquer une réflexion juste ou noble; selon l’interprétation, il peut aussi renvoyer à une disposition bénie ou à la piété. Il désigne ici la maîtrise vertueuse manifestée par les frères.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: Comment donc ne pas reconnaître
  rationale: La question rhétorique exprime qu’un tel constat s’impose. Cette formulation française en conserve la force sans reproduire lourdement la construction grecque.
- source_word: τούτοις
  choice: chez ces hommes
  rationale: Le datif désigne les personnes chez qui cette qualité doit être reconnue.
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: la maîtrise des passions qui relève d’une disposition bénie
  rationale: παθοκρατία désigne la domination exercée sur les passions, tout en pouvant inclure ici la résistance à la souffrance. Le rare εὐλογιστία évoque vraisemblablement une disposition bonne, noble ou bénie; la traduction conserve cette relative indétermination.
- source_word: οἱ ... οὐκ ἐπεστράφησαν
  choice: eux que ... n’ont pas détournés de leur résolution
  rationale: Le passif exprime l’échec des supplices à les faire changer de voie. L’ajout « de leur résolution » explicite naturellement en français le complément implicite, sans préciser davantage l’objet de leur fidélité.
- source_word: τῶν μὲν διὰ πυρὸς ἀλγηδόνων
  choice: même les souffrances infligées par le feu
  rationale: ἀλγηδόνες désigne les douleurs ou souffrances, et διὰ πυρός présente le feu comme leur moyen. « Même » rend la valeur emphatique de μέν dans cette proposition, liée au contexte.
theological_decisions:
- issue: Sens de la formule rare τῆς εὐλογιστίας παθοκρατίαν
  choice: Une maîtrise des passions liée à une disposition bénie
  alternative: La domination sur la souffrance propre à la piété; la maîtrise des passions qui vient d’un noble raisonnement
  rationale: Le contexte de 4 Maccabées met en avant la domination des passions par une raison vertueuse et fidèle à Dieu, mais la morphologie et la rareté d’εὐλογιστία ne permettent pas d’imposer ici un terme doctrinal précis. Le texte et la note gardent donc ouvertes les nuances de bénédiction, de noblesse morale et de piété.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le mouvement rhétorique du grec et son vocabulaire philosophico-moral, tandis que la note signale honnêtement l’incertitude attachée à εὐλογιστία.
