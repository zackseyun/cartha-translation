  - severity: low
    issue: Rendu de la proposition relative οἱ ... οὐκ ἐπεστράφησαν
    rationale: « eux que ... n’ont pas détournés » est possible, mais « puisqu’ils n’ont pas été détournés » reflète plus nettement le passif grec et le lien justificatif avec l’affirmation précédente.
