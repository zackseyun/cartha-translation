review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les termes principaux, mais « le danger … réside dans un tourment éternel » attribue au danger une localisation abstraite moins directe que la construction grecque κίνδυνος … κείμενος … τοῖς παραβαίνουσι, qui présente le danger comme se trouvant/attendant les transgresseurs dans le tourment. La portée de μέγας sur les deux substantifs coordonnés doit aussi être explicitée ou clairement maintenue.
  naturalness: Le français est globalement soutenu et accessible. Toutefois, « le danger … réside dans un tourment éternel » est moins idiomatique et moins net que « le danger qui … attend ceux qui transgressent ».
  terminology: « combat », « âme », « transgressent », « commandement de Dieu » et « tourment éternel » sont des choix précis et appropriés. Aucun terme théologique ne requiert de note.
  issues:
  - severity: medium
    issue: Relation entre le danger, le tourment et les transgresseurs
    rationale: « réside dans » déplace la construction vers une affirmation selon laquelle le danger aurait son siège dans le tourment. κείμενος, avec le datif τοῖς παραβαίνουσι, est rendu plus directement par un danger qui attend les transgresseurs; l’adjunct ἐν αἰωνίῳ βασάνῳ indique le cadre du tourment éternel.
  - severity: low
    issue: Portée de « grand »
    rationale: Le grec coordonne « combat de l’âme » et « danger » sous μέγας. Répéter « grand est » en français évite que la grandeur ne paraisse ne qualifier que le combat.
  revised_text: Car le combat de l’âme est grand, et grand est le danger qui, dans un tourment éternel, attend ceux qui transgressent le commandement de Dieu.
