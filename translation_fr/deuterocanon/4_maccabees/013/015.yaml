  yaml_path: translation/deuterocanon/4_maccabees/013/015.yaml
  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: fr
  text: Car le combat de l’âme est grand, et grand est le danger qui, dans un tourment éternel, attend ceux qui transgressent le commandement de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγὼν
  choice: combat
  rationale: Rend l’idée d’une lutte ou d’une épreuve intense tout en conservant la métaphore du grec.
- source_word: ψυχῆς
  choice: de l’âme
  rationale: Conserve le génitif grec et son champ sémantique sans le réduire à la seule vie physique.
- source_word: κίνδυνος … κείμενος
  choice: le danger qui attend … réside
  rationale: Exprime naturellement la situation menaçante indiquée par κείμενος, sans imposer le sens plus précis de « réservé » ou « mis en réserve ».
- source_word: ἐν αἰωνίῳ βασάνῳ
  choice: dans un tourment éternel
  rationale: Préserve directement la durée exprimée par αἰωνίῳ et la souffrance sévère désignée par βάσανος.
- source_word: παραβαίνουσι
  choice: transgressent
  rationale: Terme français précis pour le fait de franchir la limite fixée par un commandement.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: le commandement de Dieu
  rationale: Suit le singulier du grec et conserve la relation génitive explicite.
theological_decisions:
- issue: Nature et durée du châtiment
  choice: tourment éternel
  alternative: châtiment durable
  rationale: Le grec associe explicitement βάσανος à αἰώνιος; la traduction conserve cette affirmation et sa tension théologique sans l’atténuer ni la développer.
- issue: Rapport entre le danger et le tourment
  choice: le danger … réside dans un tourment éternel
  alternative: un tourment éternel est réservé
  rationale: κείμενος décrit d’abord ce qui se trouve ou réside dans une situation; « réservé » ajouterait plus nettement une idée de mise en réserve que le texte n’exige pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure coordonnée du grec est conservée, avec un léger réagencement pour rendre clairement que le danger concerne ceux qui transgressent le commandement.
