lexical_decisions:
- source_word: ἐν ᾗ
  choice: où
  rationale: Le relatif féminin singulier renvoie à un antécédent féminin dans le contexte précédent. « où » conserve naturellement ce lien sans préciser davantage l’antécédent absent du fragment.
- source_word: ἀδελφοὶ
  choice: ces frères
  rationale: Le grec emploie explicitement le masculin pluriel et désigne ici des frères au sens familial. Le démonstratif rend la construction française plus naturelle dans ce fragment relatif.
- source_word: τὸν ἴσον ... χρόνον
  choice: pendant la même durée
  rationale: Cette formulation exprime clairement l’égalité de durée indiquée par le grec.
- source_word: κατοικήσαντες
  choice: avaient vécu
  rationale: Le participe désigne le fait d’habiter ou de vivre; le plus-que-parfait s’intègre naturellement à la série participiale dépendant du contexte antérieur.
- source_word: ἐν τῷ αὐτῷ χρόνῳ
  choice: en même temps
  rationale: Expression française naturelle qui conserve l’idée de simultanéité.
- source_word: πλασθέντες
  choice: avaient été formés
  rationale: Le passif garde l’image d’une formation, vraisemblablement prénatale, sans en préciser l’agent.
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος
  choice: du même sang
  rationale: Conserve l’image concrète du grec et l’idée d’une origine biologique commune.
- source_word: αὐξηθέντες
  choice: avaient grandi
  rationale: Rend simplement le développement ou la croissance exprimés par le participe.
- source_word: διὰ τῆς αὐτῆς
  choice: par la même…
  rationale: Le témoin fourni s’interrompt après l’adjectif féminin; la traduction maintient donc l’inachèvement sans suppléer de substantif.
