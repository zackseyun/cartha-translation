  yaml_path: translation/deuterocanon/4_maccabees/013/006.yaml
  text: For just as towers on harbor breakwaters[a], beating back the threats of the waves, provide a calm harbor for those sailing in,
translation:
  language: fr
  text: Car de même que les tours dressées sur les brise-lames des ports[a] repoussent les assauts des vagues et offrent un havre paisible à ceux qui y entrent par mer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les tours avancées des ports »; l’expression grecque peut désigner des tours situées sur des ouvrages faisant saillie, tels que des môles ou des brise-lames.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Car, de même que
  rationale: Rend à la fois la valeur explicative de γάρ et l’introduction de la comparaison par καθάπερ.
- source_word: προβλῆτες λιμένων πύργοι
  choice: les tours dressées sur les brise-lames des ports
  rationale: Préserve l’image concrète de tours associées aux ouvrages avancés qui protègent les ports, dans un français moderne et intelligible.
- source_word: τὰς κυμάτων ἀπειλάς
  choice: les assauts des vagues
  rationale: « Assauts » exprime naturellement en français la menace personnifiée et la force offensive des vagues.
- source_word: ἀνακόπτοντες
  choice: repoussent
  rationale: Le verbe rend l’action énergique d’arrêter et de refouler les vagues.
- source_word: γαληνὸν παρέχουσιν
  choice: offrent un havre paisible
  rationale: γαληνός évoque le calme de la mer; « offrent » donne une tournure française naturelle avec l’objet τὸν ὅρμον.
- source_word: τοῖς εἰσπλέουσιν
  choice: à ceux qui y entrent par mer
  rationale: Explicite sans lourdeur le mouvement d’entrée dans le havre par navigation.
- source_word: τὸν ὅρμον
  choice: un havre
  rationale: ὅρμος peut désigner un port, un mouillage ou un havre; « havre » évite la répétition de « ports » tout en conservant l’idée d’un abri maritime.
