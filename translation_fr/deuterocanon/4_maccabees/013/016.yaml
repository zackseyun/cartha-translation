  text: Therefore, let us arm ourselves with the mastery over passions that comes from godly reason.
translation:
  language: fr
  text: Ainsi donc, armons-nous de la maîtrise des passions que procure la raison divine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la maîtrise des passions de la raison divine ».'
    reason: Le génitif grec peut exprimer la source de cette maîtrise ou la caractériser comme appartenant à la raison divine.
lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: armons-nous
  rationale: Le subjonctif d’exhortation à la première personne du pluriel invite à s’équiper pour le combat moral; « armons-nous » conserve naturellement la métaphore militaire.
- source_word: τοιγαροῦν
  choice: ainsi donc
  rationale: Cette particule introduit une conclusion tirée de ce qui précède; « ainsi donc » en restitue la valeur déductive et exhortative.
- source_word: τῇ ... παθοκρατίᾳ
  choice: de la maîtrise des passions
  rationale: Le datif indique ce dont on s’arme. « Maîtrise des passions » exprime le pouvoir exercé sur elles sans suggérer leur simple suppression.
- source_word: τοῦ θείου λογισμοῦ
  choice: que donne la raison tournée vers Dieu
  rationale: 'Le génitif peut exprimer la source ou l’appartenance : cette maîtrise procède du λογισμός qualifié de θεῖος. La formulation choisie rend clairement la dimension religieuse et morale sans diviniser la faculté rationnelle elle-même; la note conserve la construction plus formelle.'
- source_word: θείου
  choice: tournée vers Dieu
  rationale: Dans ce contexte judéo-hellénistique, θεῖος caractérise une raison conforme à Dieu ou liée à lui. Cette tournure française évite les possibles connotations métaphysiques de « raison divine ».
- source_word: λογισμοῦ
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement rationnel et moral qui gouverne les passions; « raison » est ici le terme français le plus clair et le plus concis.
theological_decisions:
- issue: Rendu de θεῖος λογισμός dans le contexte moral et religieux de 4 Maccabées
  choice: la raison tournée vers Dieu
  alternative: la raison divine
  rationale: Le choix principal souligne une rationalité orientée par la relation à Dieu, sans laisser entendre que la raison humaine serait elle-même d’essence divine. L’alternative, plus littérale, reste possible.
- issue: Rapport du génitif τοῦ θείου λογισμοῦ à παθοκρατίᾳ
  choice: la maîtrise que donne la raison tournée vers Dieu
  alternative: la maîtrise des passions propre à la raison divine
  rationale: Le génitif peut se comprendre comme indiquant la source, l’agent ou l’appartenance. Le texte principal retient une relation de provenance, tout en signalant dans la note la lecture attributive plus formelle.
translation_notes:
  register: Français international moderne, digne et exhortatif. La formulation conserve la métaphore militaire et le terme conceptuel central « maîtrise des passions », tout en explicitant avec prudence la portée religieuse de θεῖος λογισμός.
