  text: For just as those enslaved to their passions ate delicacies—for we said that they had been conquered by these things—[a]
translation:
  language: fr
  text: Car, tout comme ceux qui, asservis à leurs passions, se sont nourris de mets raffinés — car nous disions qu’ils avaient été vaincus par ces choses-là —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont mangé une nourriture luxueuse » ou « ont vécu dans le raffinement » ; le verbe grec, rare, évoque une consommation délicate, recherchée et indulgente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, tout comme
  rationale: Cette formulation conserve à la fois la valeur explicative de γάρ et la comparaison introduite par ὥσπερ, dans un français naturel.
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: ceux qui s’étaient rendus esclaves de leurs passions
  rationale: Le choix préserve la métaphore forte de l’esclavage exprimée par δουλόω. Dans le cadre moral et philosophique de 4 Maccabées, πάθη désigne les passions plutôt que les souffrances.
- source_word: ἡμεροφάγησαν
  choice: mangeaient des mets raffinés
  rationale: Ce verbe rare évoque une alimentation délicate, recherchée ou luxueuse. « Mets raffinés » garde l’idée de consommation indulgente sans élargir le sens à tout un mode de vie.
- source_word: ἐλέγομεν γὰρ
  choice: car nous disions
  rationale: L’imparfait grec est rendu par l’imparfait français, qui convient à ce rappel explicatif inséré dans la phrase.
- source_word: τούτοις νενικῆσθαι
  choice: qu’ils avaient été vaincus par elles
  rationale: Le plus-que-parfait passif rend l’état résultant exprimé par l’infinitif parfait νενικῆσθαι. Le pronom féminin « elles » renvoie naturellement aux passions.
theological_decisions:
- issue: Sens moral et psychologique de πάθη
  choice: passions
  alternative: souffrances, émotions ou désirs
  rationale: L’argument de 4 Maccabées oppose la raison aux passions dans un cadre philosophique et éthique. « Passions » maintient cette tension conceptuelle sans ajouter de doctrine ultérieure.
- issue: Force de δουλωθέντες
  choice: s’étaient rendus esclaves
  alternative: étaient soumis ou asservis
  rationale: La métaphore de l’esclavage est importante dans le contraste entre maîtrise et défaite. La tournure pronominale reflète le passif grec tout en restant idiomatique en français.
- issue: Référent de τούτοις
  choice: elles, c’est-à-dire les passions
  alternative: ces choses, pouvant englober les passions et les raffinements alimentaires
  rationale: L’accord naturel en français rattache le pronom aux « passions », référent le plus proche et conceptuellement central, tout en reconnaissant que le démonstratif grec est moins explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation par tirets marque l’explication parenthétique. La phrase demeure ouverte, comme dans le grec, puisqu’elle introduit une comparaison poursuivie par le contexte.
