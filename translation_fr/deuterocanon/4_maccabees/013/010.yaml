  text: Let us not be cowardly in demonstrating our piety[a].
translation:
  language: fr
  text: Ne nous montrons pas lâches quand il s’agit de démontrer notre piété[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne perdons pas courage lorsqu’il s’agit de donner la preuve de notre piété. »'
    reason: Le verbe peut exprimer le fait de manquer de courage, et ἀπόδειξις peut se rendre par « démonstration » ou « preuve ».
lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  choice: Ne nous montrons pas lâches
  rationale: Le subjonctif délibératif à la première personne du pluriel exprime ici une exhortation négative. « Se montrer lâches » conserve la portée morale forte du verbe tout en étant naturel en français.
- source_word: πρὸς
  choice: quand il s’agit de
  rationale: Avec l’accusatif, la préposition marque ici le rapport à l’action évoquée. Cette tournure française rend clairement le domaine dans lequel les locuteurs ne doivent pas céder à la lâcheté.
- source_word: τὴν τῆς εὐσεβίας ἀπόδειξιν
  choice: démontrer notre piété
  rationale: ἀπόδειξις désigne une démonstration ou une preuve, tandis que εὐσέβεια évoque la dévotion respectueuse envers Dieu manifestée par une conduite fidèle. La formulation verbale est fluide; « notre » explicite en français que les locuteurs doivent manifester leur propre piété.
theological_decisions:
- issue: Sens de εὐσέβεια dans une exhortation au martyre
  choice: piété
  alternative: fidélité à Dieu
  rationale: « Piété » conserve la dimension religieuse et pratique du terme grec sans réduire celui-ci à un sentiment intérieur ni introduire une interprétation confessionnelle particulière.
- issue: Portée de ἀπόδειξις
  choice: démontrer
  alternative: donner la preuve de
  rationale: « Démontrer » préserve l’idée d’une manifestation probante de la piété. L’expression peut viser à la fois la conduite visible et l’épreuve qui en atteste l’authenticité, sans trancher davantage.
translation_notes:
  register: Français international moderne, exhortatif et digne. La formulation évite l’archaïsme tout en maintenant la vigueur morale de l’original.
