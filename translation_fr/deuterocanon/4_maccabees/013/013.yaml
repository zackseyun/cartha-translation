  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: fr
  text: 'C’est à cause de sa piété qu’Isaac a tenu bon[a]. Et chacun d’eux, tandis qu’ils se regardaient tous les uns les autres, radieux et très courageux, disait : « Consacrons-nous de tout cœur à Dieu, lui qui nous a donné la vie[b], et mettons nos corps au service de la garde de la Loi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est en raison de son attachement à Dieu qu’Isaac a tenu bon ». Le grec εὐσέβεια désigne la piété, c’est-à-dire le respect et le dévouement envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « lui qui a donné les âmes » ou « les vies ». Le mot grec ψυχή peut signifier « âme » ou « vie » ; ici, il s’agit vraisemblablement de la vie reçue de Dieu.
    reason: lexical_alternative
  - marker: c
    text: Ou « employons nos corps à garder la Loi ». Le grec conserve l’image d’une garde vigilante plutôt que d’employer le simple terme « obéir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  choice: à cause de sa piété
  rationale: « Piété » rend le dévouement respectueux envers Dieu exprimé par εὐσέβεια. L’ajout de « sa » est exigé par le français et rapporte naturellement cette qualité à Isaac.
- source_word: ὑπέμεινεν
  choice: a tenu bon
  rationale: Le verbe décrit l’endurance ferme dans l’épreuve. « A tenu bon » est naturel, actuel et conserve cette idée sans préciser indûment la forme de la souffrance.
- source_word: ἐφορῶντες
  choice: regardait les autres
  rationale: La formulation rend le regard mutuel des frères indiqué par ἀλλήλους, sans ajouter explicitement une fonction d’encouragement que le grec laisse implicite.
- source_word: φαιδροὶ
  choice: le visage rayonnant
  rationale: L’adjectif évoque l’éclat ou la sérénité visible du visage. Cette expression garde mieux l’image que le simple adjectif « joyeux ».
- source_word: μάλα θαρραλέοι
  choice: pleins de courage
  rationale: Cette tournure française naturelle exprime la forte intensité donnée par μάλα et la hardiesse de θαρραλέοι.
- source_word: ἀφιερώσωμεν
  choice: Consacrons-nous
  rationale: Le verbe exprime la mise à part ou l’offrande de soi à Dieu. « Consacrons-nous » convient au ton solennel et rend le réfléchi explicité dans le contexte grec.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de tout cœur
  rationale: Expression française idiomatique qui conserve l’idée d’un engagement provenant de la totalité du cœur.
- source_word: τῷ δόντι τὰς ψυχάς
  choice: lui qui nous a donné la vie
  rationale: ψυχή peut désigner l’âme ou la vie. Dans ce contexte de don reçu de Dieu et de disponibilité au martyre, « la vie » rend le sens sans imposer une anthropologie particulière.
- source_word: χρήσωμεν ... τὰ σώματα
  choice: mettons nos corps au service de
  rationale: Cette formulation rend l’idée de faire usage de ses corps dans un but déterminé, tout en restant plus naturelle en français que « utilisons nos corps ».
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: de la garde de la Loi
  rationale: « Garde » préserve l’image de vigilance contenue dans φυλακή au lieu de la réduire à la seule notion d’obéissance. La majuscule à « Loi » signale ici la Loi donnée à Israël.
theological_decisions:
- issue: Portée de εὐσέβεια comme vertu religieuse centrale
  choice: piété
  alternative: attachement à Dieu
  rationale: « Piété » désigne de façon concise le respect et le dévouement envers Dieu manifestés par une conduite fidèle. La note maintient ouverte la nuance d’attachement fidèle.
- issue: Sens de ψυχή dans l’expression τῷ δόντι τὰς ψυχάς
  choice: la vie
  alternative: nos âmes
  rationale: Le contexte présente Dieu comme celui qui donne la vie que les frères sont prêts à lui offrir. « Nos âmes » demeure possible lexicalement, mais risquerait de suggérer une distinction métaphysique que ce passage n’exige pas.
- issue: Métaphore de φυλακή appliquée à la Loi
  choice: la garde de la Loi
  alternative: l’observance de la Loi
  rationale: La traduction retenue conserve l’image d’une garde vigilante et ne résout pas cette image en une simple notion d’observance.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la solennité de l’exhortation sans archaïsmes. La syntaxe grecque accumulative a été légèrement réorganisée pour rendre clairement le regard mutuel et la parole collective, sans effacer la mention de chacun ni celle de tous ensemble.
