  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
translation:
  language: fr
  text: Il est impossible d’ignorer l’autorité de la raison[a], car ils ont été plus forts que la passion et les douleurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’esprit » ou « de l’intelligence ». Le terme grec peut désigner la pensée, l’intelligence ou la faculté de comprendre ; ici, il souligne probablement le jugement rationnel qui gouverne les passions.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: Il est impossible de ne pas reconnaître
  rationale: 'La tournure rend naturellement la construction impersonnelle et le sens de παριδεῖν : passer outre à une réalité manifeste, la négliger ou ne pas en tenir compte.'
- source_word: τὴν ἡγεμονίαν
  choice: l’autorité
  rationale: Ἡγεμονία désigne la direction ou le pouvoir de gouverner. « Autorité » exprime ici de façon naturelle la fonction directrice de la raison sans suggérer une souveraineté politique.
- source_word: τῆς διανοίας
  choice: de la raison
  rationale: Dans l’argument philosophique de 4 Maccabées, διάνοια désigne la faculté rationnelle qui gouverne les passions. « Raison » est plus précis ici que le terme général « esprit ».
- source_word: ἐπεκράτησαν
  choice: ils ont été plus forts que
  rationale: Le verbe signifie être plus fort, prendre le dessus ou l’emporter. Cette formulation conserve la comparaison implicite et souligne ce que leur endurance a démontré.
- source_word: πάθους
  choice: la passion
  rationale: Dans cet ouvrage, πάθος renvoie principalement à la passion ou à l’impulsion affective que la raison doit maîtriser. Le singulier français conserve le singulier collectif et le registre philosophique du grec.
- source_word: πόνων
  choice: les douleurs
  rationale: Πόνοι désigne ici les douleurs physiques endurées dans les supplices. Le pluriel français suit celui du grec sans préciser davantage la nature des souffrances.
theological_decisions:
- issue: Rendre διάνοια dans la thèse anthropologique et philosophique du livre
  choice: la raison
  alternative: l’esprit / l’intelligence
  rationale: « Raison » met en évidence la faculté de jugement qui exerce une autorité sur les passions, sans introduire de catégorie doctrinale ultérieure. « Esprit » reste lexicalement possible, mais serait plus large et moins précis dans ce contexte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le raisonnement démonstratif du grec et son contraste entre la passion intérieure et les douleurs physiques.
