base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: fr
  text: 'Et Jacob t’accueillera[a], et tous les pères feront ton éloge. Chaque fois que l’un de leurs frères était arraché, ceux qui restaient lui disaient : « Ne nous couvre pas de honte, frère, et ne démens pas ceux qui sont morts avant nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te recevra ».
    reason: lexical_alternative
  - marker: b
    text: 'Le tour grec peut aussi s’exprimer ainsi : « ne rends pas faux ceux qui sont morts auparavant » ; c’est-à-dire, ne contredis pas leur témoignage par ta conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: t’accueillera
  rationale: Le futur moyen de ὑποδέχομαι exprime ici l’accueil réservé à quelqu’un. « Accueillera » rend naturellement la réception honorable envisagée, tandis que la note conserve « recevra » comme possibilité plus formelle.
- source_word: οἱ πατέρες
  choice: les pères
  rationale: Cette traduction littérale préserve le titre honorifique donné aux ancêtres patriarcaux, sans remplacer dans le texte leur désignation traditionnelle par une explicitation.
- source_word: ἐπαινέσουσιν
  choice: feront ton éloge
  rationale: ἐπαινέω signifie louer ou faire l’éloge. Cette formulation est naturelle en français et s’accorde avec le complément personnel implicite dans la coordination.
- source_word: ἐνὶ ἑκάστῳ
  choice: Chaque fois que l’un
  rationale: Dans cette construction distributive, l’expression décrit ce qui se répétait pour chacun des frères successivement. « Chaque fois que l’un » restitue clairement cette valeur.
- source_word: τῶν ἀποσπωμένων
  choice: était arraché aux autres
  rationale: Le participe de ἀποσπάω évoque le fait de retirer ou d’arracher quelqu’un à un groupe. « Arraché aux autres » conserve la force coercitive du terme sans préciser au-delà du grec la manière dont il était emmené.
- source_word: οἱ περιλειπόμενοι
  choice: ceux qui restaient
  rationale: Le participe désigne les frères encore présents à ce moment-là, sans laisser entendre qu’ils survivraient finalement.
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: Ne nous couvre pas de honte
  rationale: Cette expression française naturelle rend la honte et le déshonneur publics exprimés par καταισχύνω.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: et ne démens pas ceux qui sont morts avant nous
  rationale: 'Le verbe ψεύω peut ici signifier rendre faux ou démentir. La formulation conserve la tension de l’expression grecque : le frère ne doit pas, par sa conduite, contredire le témoignage de ceux qui l’ont précédé dans la mort.'
theological_decisions:
- issue: Identité de Jacob dans la scène d’accueil posthume
  choice: Le nom désigne personnellement le patriarche Jacob.
  alternative: Jacob pourrait être compris collectivement comme une désignation d’Israël.
  rationale: La coordination avec « tous les pères » favorise l’identification au patriarche parmi les ancêtres honorés. La traduction garde toutefois simplement le nom propre, sans ajouter d’explication interprétative dans le corps du texte.
- issue: Sens de « ne démens pas ceux qui sont morts avant nous »
  choice: L’exhortation demande au frère de ne pas contredire par sa conduite le témoignage des martyrs déjà morts.
  alternative: On peut rendre plus littéralement l’expression par « ne rends pas faux ceux qui sont morts avant nous », ou plus interprétativement par « ne trahis pas ceux qui sont morts avant nous ».
  rationale: « Ne démens pas » préserve l’image de la vérité ou de la fausseté attachée au témoignage des morts, sans réduire le sens à un mensonge verbal ni imposer l’interprétation plus précise de la trahison.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est requis par les formes grecques adressées à chaque frère individuellement. La répétition distributive est rendue idiomatiquement, et la formulation inhabituelle avec ψεύσῃ est maintenue autant que possible plutôt que résolue en paraphrase.
