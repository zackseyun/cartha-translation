base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: fr
  text: Mais de même, bien que la nature, l’habitude et les dispositions vertueuses resserraient les liens d’affection fraternelle qui les unissaient[a], ceux qui restaient tinrent bon par piété en voyant leurs frères, qui inspiraient la compassion, être torturés jusqu’à la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les affections fraternelles » ou « les liens de la fraternité ». Le grec évoque les attachements affectifs propres à la relation entre frères.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « voyant leurs frères, pris en pitié, torturés jusqu’à la mort ». Le grec enchaîne plusieurs participes dans une construction condensée ; il ne précise pas qui éprouvait cette compassion.'
    reason: source_syntax
lexical_decisions:
- source_word: συνηθείας
  choice: la vie partagée
  rationale: Dans ce contexte familial, le terme évoque moins une simple « coutume » que la familiarité née de la fréquentation habituelle et de la vie commune. Cette formulation française exprime naturellement cette force de rapprochement.
- source_word: τὰ τῆς ἀδελφότητος φίλτρα
  choice: les liens d’affection fraternelle
  rationale: φίλτρα désigne ici les puissants attachements affectifs propres à la fraternité, non des « charmes » au sens littéral. « Liens d’affection fraternelle » conserve à la fois l’idée de lien et sa dimension émotionnelle.
- source_word: συναξόντων
  choice: resserrent entre eux
  rationale: Le participe décrit plusieurs facteurs qui réunissent les frères et renforcent leur attachement mutuel. « Resserrer » convient idiomatiquement aux liens affectifs, tandis que « entre eux » rend la portée relationnelle de αὐτοῖς.
- source_word: ἀνέσχοντο
  choice: tinrent bon
  rationale: Le verbe exprime ici l’endurance ferme devant une épreuve émotionnelle extrême. « Tinrent bon » est naturel en français moderne et n’impose pas l’idée plus particulière qu’ils auraient seulement réprimé leurs sentiments.
- source_word: εὐσέβειαν
  choice: piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la dévotion respectueuse envers Dieu et sa loi. « Piété » maintient ce vocabulaire moral et théologique central sans ajout confessionnel.
- source_word: οἱ ὑπολελειμμένοι
  choice: ceux qui restaient
  rationale: Il s’agit des frères qui n’avaient pas encore été mis à mort. Cette traduction évite « survivants », qui pourrait laisser entendre qu’ils échapperaient finalement au supplice.
- source_word: κατοικτιζομένους
  choice: qui inspiraient la compassion
  rationale: Le participe passif présente les frères suppliciés comme objets de pitié. Cette tournure française en restitue le sens sans l’expression maladroite « qui étaient pris en pitié ».
- source_word: μέχρι θανάτου βασανιζομένους
  choice: être torturés jusqu’à la mort
  rationale: La formulation conserve l’idée explicite d’un supplice qui se poursuit jusqu’à la mort, sans déterminer davantage si μέχρι marque seulement la limite ou le résultat.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: fidélité à Dieu / révérence
  rationale: '« Piété » préserve le motif propre au livre : l’endurance procède d’une dévotion révérencieuse envers Dieu et sa loi. La traduction n’explicite pas davantage ce que le grec laisse dans ce terme synthétique.'
- issue: Force du langage de la fraternité
  choice: frères / liens d’affection fraternelle
  alternative: proches / affection familiale
  rationale: ἀδελφούς et ἀδελφότητος désignent expressément les frères et la relation fraternelle. Les termes masculins précis sont donc maintenus plutôt que généralisés à la famille.
- issue: Nature de l’endurance exprimée par ἀνέσχοντο
  choice: tinrent bon
  alternative: supportèrent / se maîtrisèrent
  rationale: Le contexte permet de comprendre soit l’endurance de la souffrance émotionnelle, soit la maîtrise de l’élan fraternel qui aurait pu les faire céder. « Tinrent bon » conserve cette tension sans trancher artificiellement.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la structure argumentative et la densité du grec, tout en allégeant les participes par une syntaxe française naturelle. « Tinrent bon » maintient l’ambiguïté entre endurance et maîtrise de soi.
