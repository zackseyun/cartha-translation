base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: fr
  text: Ainsi, le noble discernement des jeunes hommes, aux sept tours[a], ayant fortifié le havre de la piété, a vaincu le dérèglement des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le bon jugement des jeunes hommes, forteresse aux sept bastions » ; plus explicitement : « la ferme résolution des sept jeunes hommes ». L’expression grecque, fortement imagée, fait vraisemblablement allusion aux sept frères.'
    reason: La formule grecque ἑπτάπυργος ... εὐλογιστία est exceptionnellement dense. La note conserve l’image défensive et indique une lecture plus explicite, sans la substituer au texte.
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: aux sept tours
  rationale: Le composé signifie littéralement « pourvu de sept tours ». Cette image défensive évoque vraisemblablement les sept frères et reste cohérente avec le havre fortifié et la victoire finale.
- source_word: εὐλογιστία
  choice: juste discernement
  rationale: Ce nom rare désigne ici une faculté de réflexion moralement droite et digne d’éloge. « Juste discernement » conserve le lien avec le thème de la raison qui maîtrise les passions, sans lui donner artificiellement le sens de « béatitude ».
- source_word: νεανίσκων
  choice: jeunes hommes
  rationale: Le masculin pluriel désigne les frères; cette expression est claire, actuelle et précise.
- source_word: ὀχυρώσασα
  choice: après avoir fortifié
  rationale: Le participe a une valeur antérieure et prolonge l’imagerie militaire. Cette tournure française en rend clairement le rapport avec le verbe principal.
- source_word: λιμένα
  choice: havre
  rationale: Le mot désigne un port ou un refuge sûr. « Havre » convient au langage figuré et s’associe naturellement à l’idée de protection.
- source_word: εὐσεβείας
  choice: piété
  rationale: Dans 4 Maccabées, le terme exprime le respect fidèle envers Dieu, notamment par l’obéissance à sa loi. « Piété » est concis, théologiquement pertinent et naturel en français.
- source_word: παθῶν
  choice: passions
  rationale: Dans le cadre philosophique du livre, il s’agit des affects et impulsions que la raison doit gouverner, non simplement des souffrances.
- source_word: ἀκολασίαν
  choice: dérèglement
  rationale: Le terme dénote l’absence de maîtrise, l’excès et l’indiscipline. « Dérèglement » garde cette portée générale sans suggérer uniquement l’inconduite sexuelle.
- source_word: ἐνίκησεν
  choice: a vaincu
  rationale: Le verbe exprime une victoire nette et parachève l’imagerie de fortification. Le passé composé reste naturel en français moderne.
theological_decisions:
- issue: Sens de l’expression très figurée ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία
  choice: le juste discernement aux sept tours des jeunes hommes
  alternative: le noble jugement des jeunes hommes, forteresse aux sept bastions; plus explicitement, la ferme résolution des sept jeunes hommes
  rationale: Le grec personnifie la qualité rationnelle et morale manifestée par les frères comme un ouvrage défensif à sept tours. Le texte principal conserve cette métaphore inhabituelle au lieu de la réduire à une paraphrase; la note en indique des lectures possibles.
- issue: Portée de εὐσεβεία
  choice: piété
  alternative: fidélité envers Dieu; attachement à Dieu
  rationale: Le mot unit ici révérence envers Dieu et fidélité pratique à sa loi. « Piété » préserve cette dimension religieuse sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore militaire et portuaire est maintenue; le passé composé évite une solennité archaïsante. Le tour volontairement insolite « aux sept tours » reflète l’étrangeté rhétorique du grec et est éclairé par une note.
