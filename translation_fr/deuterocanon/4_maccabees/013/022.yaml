  rationale: La révision rétablit les « âmes » comme sujet de l’intensification, améliore l’idiomaticité de la relation quotidienne et évite l’ajout de « tout », tout en conservant le sens familial, le registre élevé et les possibilités lexicales signalées par les notes.
