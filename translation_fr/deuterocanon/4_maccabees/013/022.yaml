  yaml_path: translation/deuterocanon/4_maccabees/013/022.yaml
  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: fr
  text: Les âmes des frères sont affectueuses dans leurs embrassements[a] ; elles se fortifient davantage par leur vie en commun[b], par leur fréquentation quotidienne et par le reste de leur éducation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les âmes fraternelles, affectueuses dans leurs embrassements ». La formulation grecque est condensée et permet de rattacher de diverses manières « fraternelles » à « âmes ».'
    reason: lexical_alternative
  - marker: b
    text: « La vie en commun » peut aussi se comprendre comme « la compagnie mutuelle » ou « le fait d’avoir été élevés ensemble ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les autres aspects de leur formation » ou « le reste de leur instruction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: dans leurs embrassements
  rationale: Le nom désigne l’action de serrer dans les bras. La tournure française conserve cette image concrète tout en rendant intelligible la formulation grecque très resserrée.
- source_word: φιλάδελφοι ψυχαί
  choice: les âmes des frères sont pleines d’affection
  rationale: φιλάδελφοι exprime l’amour fraternel et qualifie ψυχαί. Dans le contexte précis des sept frères, « des frères » respecte le référent masculin, tandis que « pleines d’affection » restitue naturellement la valeur affective de l’adjectif.
- source_word: ψυχαί
  choice: âmes
  rationale: « Âmes » préserve le registre élevé ainsi que la référence à la vie intérieure et affective des frères.
- source_word: αὔξονται σφοδρότερον
  choice: cette affection grandit avec encore plus de force
  rationale: Le grec parle d’un accroissement en intensité. La reprise explicite de « cette affection » rend en français le lien logique que la formulation grecque laisse condensé.
- source_word: διὰ συντροφίας
  choice: grâce à la vie partagée
  rationale: συντροφία peut désigner la vie commune, la compagnie ou le fait d’avoir été élevés ensemble. « Vie partagée » conserve cette amplitude dans le cadre familial.
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: à la proximité familière de chaque jour
  rationale: L’expression évoque une fréquentation habituelle et quotidienne. Ce choix rend à la fois la proximité et l’accoutumance mutuelle.
- source_word: τῆς ἄλλης παιδίας
  choice: à tout le reste de leur éducation
  rationale: Le terme peut désigner l’éducation, la formation ou l’ensemble du processus éducatif. « Éducation » convient au contexte familial sans réduire le sens à l’instruction scolaire.
theological_decisions:
- issue: Langage familial genré dans le récit des sept frères
  choice: frères
  alternative: frères et sœurs
  rationale: Le passage vise concrètement les sept frères du récit. Le masculin traduit donc le référent narratif plutôt que d’énoncer une généralité excluant les femmes.
- issue: Référent implicite de l’accroissement
  choice: cette affection grandit
  alternative: elles grandissent
  rationale: Le sujet grammatical grec est « les âmes », mais le contexte décrit manifestement l’intensification de leur attachement fraternel. L’explicitation française rend ce mouvement sans lui donner une portée doctrinale supplémentaire.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le terme élevé « âmes » et l’image concrète des embrassements, tout en explicitant avec mesure l’affection qui s’intensifie. Les notes signalent la compression syntaxique et les principales possibilités lexicales du grec.
