  verdict: revise
  source_fidelity: 'Le grec contient deux exhortations coordonnées, la répétition intentionnelle d’ἀδελφ- (« fraternellement / frères »), la référence explicite aux trois jeunes gens « en Syrie », et un syntagme rare et textuellement difficile, τῆς ἰσοπαίδος καμίνου. Le projet rend bien l’ensemble, mais « comparable à la leur » crée en français une référence possessive maladroite : la fournaise méprisée est précisément celle que les jeunes gens affrontent. Une formulation qui explicite seulement la comparaison avec leur épreuve préserve mieux l’incertitude sans prétendre déterminer la nuance exacte de ἰσοπαίδος.'
  naturalness: « Mourons en frères, frères » conserve la répétition rhétorique sans l’ajout non exprimé de « mes ». « Une fournaise comparable à leur épreuve » est plus idiomatique et évite l’impression tautologique de « comparable à la leur ».
  terminology: « Loi » convient ici pour νόμος dans le cadre de la fidélité à la Loi juive. « Jeunes gens », « fournaise » et « ont méprisé » sont exacts, modernes et de registre soutenu approprié.
  issues:
