    issue: Référent ambigu et peu naturel de « comparable à la leur »
    rationale: Le possessif féminin renvoie normalement à « fournaise », de sorte que les jeunes gens sembleraient mépriser une fournaise comparable à leur propre fournaise. Le grec est difficile, mais la note elle-même situe la comparaison au niveau de l’épreuve ; « comparable à leur épreuve » évite cette tautologie tout en restant prudent.
  - severity: low
    issue: Ajout de « mes » dans l’apostrophe
    rationale: ἀδελφοί est répété sans possessif. « Mes frères » est possible en français, mais « frères » reproduit plus exactement l’insistance concise du grec et s’accorde avec « en frères ».
