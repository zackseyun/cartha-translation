base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: fr
  text: Mourons en frères, frères, pour la Loi ; imitons les trois jeunes gens en Syrie[a], qui ont méprisé une fournaise comparable à leur épreuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des trois jeunes Juifs de Daniel 3. Le grec dit ici « en Syrie », et non « à Babylone », cadre plus familier du récit de Daniel.
    reason: cross_reference
  - marker: b
    text: L’adjectif grec employé ici est rare et difficile à interpréter ; il semble présenter la fournaise comme comparable à l’épreuve qu’ont affrontée les trois jeunes gens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: en frères
  rationale: L’adverbe décrit la manière de mourir et souligne la solidarité fraternelle, reprise immédiatement dans l’apostrophe « mes frères ».
- source_word: ἀποθάνωμεν
  choice: Mourons
  rationale: Le subjonctif aoriste a une valeur exhortative ; l’impératif français à la première personne du pluriel en rend naturellement la force.
- source_word: ἀδελφοί
  choice: mes frères
  rationale: Il s’agit ici de frères de sexe masculin dans le récit. L’ajout idiomatique de « mes » distingue clairement l’apostrophe de l’expression précédente sans effacer la répétition grecque.
- source_word: περὶ τοῦ νόμου
  choice: pour la Loi
  rationale: περί avec le génitif indique ici la cause défendue ou le motif du sacrifice. La majuscule signale la Loi mosaïque dans ce contexte.
- source_word: μιμησώμεθα
  choice: imitons
  rationale: Rend directement le second subjonctif d’exhortation et conserve l’appel explicite à prendre les trois jeunes gens pour modèles.
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: les trois jeunes gens en Syrie
  rationale: La formulation suit le grec transmis, qui situe explicitement les jeunes gens « en Syrie », sans l’harmoniser avec le cadre babylonien plus familier de Daniel 3.
- source_word: τῆς ἰσοπαίδος καμίνου
  choice: une fournaise comparable à la leur
  rationale: L’adjectif ἰσοπαίδος est rare et difficile. La formulation française conserve prudemment l’idée probable d’une correspondance avec l’épreuve des trois jeunes gens, sans lui attribuer une précision absente ou incertaine.
- source_word: κατεφρόνησαν
  choice: ont méprisé
  rationale: Le verbe exprime le dédain ou le fait de tenir pour négligeable ; « mépriser » en garde la vigueur rhétorique.
theological_decisions:
- issue: Allusion à Daniel 3 et indication géographique
  choice: les trois jeunes gens en Syrie
  alternative: les trois jeunes gens à Babylone
  rationale: Le grec porte ἐπὶ τῆς Συρίας. La traduction respecte cette formulation, même si Daniel 3 situe l’épisode à Babylone, et signale la tension en note plutôt que d’harmoniser le texte.
- issue: Genre grammatical et référents de ἀδελφοί
  choice: mes frères
  alternative: mes frères et sœurs
  rationale: Dans la scène, les interlocuteurs sont des frères au sens littéral ; une formulation inclusive modifierait les référents narratifs.
- issue: Interprétation de l’adjectif rare ἰσοπαίδος
  choice: comparable à la leur
  alternative: d’un tourment égal
  rationale: Le sens exact du terme est incertain. La traduction retenue exprime la comparaison suggérée par l’allusion aux trois jeunes gens tout en évitant d’affirmer que l’égalité porte précisément sur l’intensité du tourment.
translation_notes:
  register: Français international moderne, digne et exhortatif. La répétition « en frères, mes frères » reproduit l’insistance fraternelle du grec sans lourdeur excessive. Le point-virgule maintient les deux exhortations dans un même mouvement.
