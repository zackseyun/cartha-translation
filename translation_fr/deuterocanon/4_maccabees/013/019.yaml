  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: fr
  text: Et vous n’ignorez pas les liens affectifs propres à la nature humaine[a], que la providence divine et souverainement sage a répartis à ceux qui sont engendrés par leurs pères, les ayant implantés dans le sein maternel ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les affections naturelles de l’être humain » ou « les attachements humains ». Ici, le grec φίλτρα désigne de puissants liens d’affection, et non des charmes magiques au sens propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε δὲ
  choice: Et vous n’ignorez pas
  rationale: Cette formulation conserve la négation rhétorique et l’adresse directe, tout en restant naturelle dans un registre français soutenu.
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: les liens affectifs propres à la nature humaine
  rationale: φίλτρα désigne ici de puissants attachements affectifs, non des charmes magiques. « Liens affectifs » exprime leur force relationnelle, tandis que « propres à la nature humaine » rend le génitif ἀνθρωπότητος sans réduire celui-ci à l’humanité collective.
- source_word: ἡ θεία καὶ πάνσοφος πρόνοια
  choice: la providence divine et souverainement sage
  rationale: « Providence » maintient la portée philosophique et théologique de πρόνοια. « Souverainement sage » rend πάνσοφος en français naturel sans ajouter explicitement « de Dieu », absent du grec.
- source_word: ἔμερισεν
  choice: a répartis
  rationale: Le verbe évoque une distribution ordonnée ou mesurée ; « répartir » en restitue clairement le sens.
- source_word: τοῖς γεννωμένοις διὰ τῶν πατέρων
  choice: entre ceux qui naissent par l’intermédiaire des pères
  rationale: Cette traduction conserve le participe passif et la référence explicite au rôle des pères dans la génération, malgré l’étrangeté relative de l’expression en français moderne.
- source_word: διὰ τῆς μητρῴας ... γαστρός
  choice: par le sein maternel
  rationale: « Sein maternel » rend ici γαστήρ au sens de matrice ou ventre où l’enfant est porté, et préserve le contraste avec les pères.
- source_word: φυτεύσασα
  choice: qu’elle a implantés
  rationale: « Implanter » conserve l’image végétale de φυτεύω tout en convenant naturellement au contexte de la conception et du sein maternel. Le pronom renvoie sans ambiguïté à la providence.
theological_decisions:
- issue: Portée de πρόνοια dans le contexte judéo-hellénistique
  choice: providence
  alternative: prévoyance
  rationale: « Providence » rend l’idée d’un gouvernement divin ordonné tout en gardant la résonance philosophique du terme, sans préciser davantage un système doctrinal.
- issue: Distinction entre les rôles paternel et maternel dans le langage de la génération
  choice: conserver « par l’intermédiaire des pères » et « par le sein maternel »
  alternative: généraliser en « par leurs parents »
  rationale: Le grec distingue explicitement les pères et le sein maternel. La traduction maintient cette distinction plutôt que de la neutraliser.
- issue: Rapport syntaxique de φυτεύσασα à la providence
  choice: rendre la providence comme sujet de l’implantation des liens affectifs
  alternative: comprendre l’expression comme une simple description impersonnelle de leur présence dans le sein maternel
  rationale: Le participe féminin φυτεύσασα s’accorde avec πρόνοια et son objet naturel demeure le relatif neutre pluriel renvoyant à φίλτρα ; la traduction conserve donc cette construction.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu, adapté au caractère rhétorique de 4 Maccabées. La phrase conserve la structure ample du grec et son point-virgule final, qui indique la poursuite du discours.
