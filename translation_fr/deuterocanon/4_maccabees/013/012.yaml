  verdict: revise
  source_fidelity: Le projet conserve correctement δέ (« Mais »), l’impératif pluriel, πόθεν, la conjonction disjonctive ἤ et l’image concrète de la « main ». Toutefois, « vous devez être égorgés » introduit une modalité déontique qui n’est pas exprimée par l’infinitif σφαγιασθῆναι. Une tournure française d’infinitif dépendant de « Souvenez-vous » restitue plus prudemment la construction difficile du grec sans en résoudre l’ambiguïté.
  naturalness: '« Mais lui répétait » est peu idiomatique en français moderne dans ce contexte : « Mais il disait » est naturel et rend l’imparfait sans surinterpréter nécessairement une répétition. La seconde proposition demeure volontairement abrupte, comme le grec, mais « de la main de quel père être égorgés » se lit mieux en français que l’ajout de « vous devez ».'
  terminology: « Souvenez-vous », « d’où vous êtes » et « être égorgés » sont appropriés. « D’où vous êtes » est plus proche de πόθεν ἐστέ que « d’où vous venez » tout en laissant ouverte l’allusion contextuelle à l’origine ou à l’ascendance. « Par la main de quel père » garde l’agent instrumental et la force de χειρί.
