translation:
  language: fr
  text: 'Mais il disait : « Souvenez-vous d’où vous êtes[a], ou[b] par la main de quel père être égorgés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « d’où vous êtes » ; elle peut désigner le lieu d’origine, mais le contexte peut aussi renvoyer à l’ascendance familiale.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec transmis porte « ou » et enchaîne abruptement avec l’infinitif « être égorgés » : littéralement, « ou par la main de quel père être égorgés ». Certaines traductions rendent la liaison par « et » ou explicitent la construction pour faciliter le sens ; le texte conserve ici la formulation reçue.'
    reason: textual_syntactical_ambiguity
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: Mais lui répétait
  rationale: L’imparfait ἔλεγεν présente une parole prolongée ou répétée. « Répétait » restitue cet aspect, tandis que δέ marque ici un changement de locuteur ou un contraste.
- source_word: Μνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif appelle directement les destinataires à se rappeler leur origine.
- source_word: πόθεν ἐστέ
  choice: d’où vous venez
  rationale: πόθεν désigne d’abord la provenance. Dans ce contexte familial, l’expression peut aussi évoquer l’ascendance; « d’où vous venez » conserve cette ouverture sans réduire le sens à un lieu géographique.
- source_word: ἢ
  choice: ou
  rationale: Le grec transmis porte la conjonction disjonctive ἢ. La traduction la conserve au lieu de l’harmoniser silencieusement en « et », malgré l’enchaînement difficile.
- source_word: τίνος πατρὸς χειρὶ
  choice: par la main de quel père
  rationale: Le datif χειρί exprime ici l’intermédiaire ou l’agent tout en gardant l’image concrète de la « main »; τίνος πατρός interroge l’identité ou la qualité du père.
- source_word: σφαγιασθῆναι
  choice: être égorgés
  rationale: Le verbe évoque une mise à mort violente, souvent formulée comme un égorgement ou un abattage. « Être égorgés » en garde la force sans imposer à lui seul une interprétation cultuelle.
theological_decisions:
- issue: Portée de πόθεν ἐστέ
  choice: « d’où vous venez », formulation ouverte pouvant viser à la fois la provenance et l’ascendance
  alternative: « de qui vous descendez »
  rationale: Le contexte favorise une allusion à l’identité familiale, mais πόθεν exprime littéralement l’origine sans nommer explicitement un ancêtre. La traduction maintient cette ambiguïté.
- issue: Valeur de ἢ dans une phrase syntaxiquement difficile
  choice: Conserver « ou »
  alternative: « et »
  rationale: Remplacer ἢ par une coordination résoudrait la difficulté, mais s’écarterait du texte grec fourni. Le maintien de « ou » rend visible la tension du texte transmis.
- issue: Force de σφαγιασθῆναι
  choice: « être égorgés »
  alternative: « être mis à mort » ou « être immolés »
  rationale: « Mis à mort » affaiblirait le terme, tandis qu’« immolés » pourrait accentuer indûment une lecture sacrificielle. « Égorgés » exprime la violence concrète du verbe.
translation_notes:
  register: Français moderne, soutenu mais accessible. « Lui répétait » conserve l’insistance de l’imparfait; « être égorgés » maintient la dureté de l’image. La syntaxe légèrement insolite de la seconde proposition est assumée et accompagnée d’une note, afin de ne pas masquer la difficulté du grec transmis.
