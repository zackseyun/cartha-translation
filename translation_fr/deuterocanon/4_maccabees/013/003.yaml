  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: fr
  text: Mais maintenant, il n’en est pas ainsi ; au contraire, grâce au raisonnement[a] que Dieu approuve, ils ont triomphé des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à la raison approuvée par Dieu ». Le terme grec peut aussi se traduire par « raison », « raisonnement » ou « jugement rationnel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Cette formulation concise conserve à la fois la valeur temporelle de νυνί et le contraste marqué par δέ.
- source_word: οὐχ οὕτως
  choice: il n’en est pas ainsi
  rationale: La tournure française préserve l’expression elliptique du grec sans expliciter abusivement l’élément de comparaison.
- source_word: ἀλλὰ
  choice: au contraire
  rationale: Après la négation, cette locution rend clairement la correction introduite par ἀλλά.
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: grâce au raisonnement que Dieu approuve
  rationale: « Raisonnement » exprime ici l’activité du jugement moral et rationnel, thème central de 4 Maccabées. « Grâce à » rend naturellement le datif instrumental, et la proposition relative donne un français fluide.
- source_word: παρὰ θεῷ
  choice: que Dieu approuve
  rationale: Avec ἐπαινουμένῳ, l’expression désigne le plus naturellement Dieu comme celui qui porte une appréciation favorable. « Approuve » est idiomatique et évite la lourdeur de « loué par Dieu » appliqué à un raisonnement.
- source_word: περιεγένοντο
  choice: ils ont triomphé de
  rationale: Le verbe exprime une supériorité victorieuse sur une force adverse ; « triompher de » restitue cette nuance en français actuel et digne.
- source_word: τῶν παθῶν
  choice: des passions
  rationale: Dans 4 Maccabées, πάθη désigne les impulsions ou affects que le jugement rationnel maîtrise, plutôt que les seules souffrances extérieures. « Passions » conserve le vocabulaire philosophique du livre.
theological_decisions:
- issue: Traduction du terme programmatique λόγισμος dans 4 Maccabées
  choice: raisonnement
  alternative: raison ; jugement rationnel
  rationale: « Raisonnement » maintient la dimension active du discernement moral sans réduire le terme à une faculté abstraite ni imposer une terminologie philosophique trop technique.
- issue: Sens de παρὰ θεῷ avec ἐπαινουμένῳ
  choice: que Dieu approuve
  alternative: loué devant Dieu ; tenu en estime auprès de Dieu
  rationale: La construction présente très probablement Dieu comme l’auteur de l’appréciation favorable, tout en ne disant rien de plus que l’approbation divine exprimée par le texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le point-virgule conserve l’articulation serrée entre la négation et la correction. Le vocabulaire philosophique de « raisonnement » et « passions » est maintenu tout en restant accessible.
