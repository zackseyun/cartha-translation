lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: L’adverbe exprime ici la manière ou la conséquence et conserve sous cette forme sa force de liaison concise.
- source_word: παθόντας
  choice: après que nous aurons souffert
  rationale: Le participe aoriste de πάσχω désigne le fait de subir une souffrance. La proposition temporelle rend naturellement en français le rapport participial avec ἡμᾶς, tout en laissant ouverte la relation exacte avec la suite lacunaire.
- source_word: ἡμᾶς
  choice: nous
  rationale: Le pronom accusatif appartient à la construction participiale grecque; une proposition personnelle avec « nous » est plus idiomatique en français.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle du nom du patriarche.
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple, sans précision supplémentaire imposée par le fragment.
- source_word: Ἰσαὰκ
  choice: Isaac
  rationale: Forme française traditionnelle du nom du patriarche.
theological_decisions:
- issue: Texte source fragmentaire ou discordant
  choice: Traduire seulement le fragment grec fourni et signaler son interruption par un tiret.
  alternative: Reconstruire une phrase complète à partir d’autres éditions ou du contexte.
  rationale: Le témoin fourni est signalé comme présentant une discordance majeure. La traduction reste donc ancrée dans le grec transmis, sans introduire silencieusement une reconstruction susceptible d’infléchir le sens théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur antérieur convient à l’orientation probable du propos, mais la syntaxe demeure volontairement suspendue; le tiret rend visible l’état fragmentaire du texte.
