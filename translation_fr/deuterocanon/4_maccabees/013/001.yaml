revisions:
- from: Ainsi donc, puisque les sept frères ont tenu pour rien les souffrances allant jusqu’à la mort[a], il est reconnu de toutes parts que la raison pieuse[b] règne souverainement sur les passions[c].
  to: Ainsi donc, puisque les sept frères ont tenu pour rien les souffrances allant jusqu’à la mort[a], il est reconnu de toutes parts que la raison pieuse[b] a pleine maîtrise sur les passions[c].
  rationale: La révision resserre le rendu de αὐτόδεσπότος sur l’idée de maîtrise entière, sans ajouter l’image du règne, et corrige une alternative de note qui risquait de transformer la borne « jusqu’à la mort » en lien causal. Le reste du texte et des notes est fidèle, naturel et terminologiquement cohérent.
