base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: fr
  text: Ainsi donc, puisque les sept frères ont tenu pour rien les souffrances allant jusqu’à la mort[a], il est reconnu de toutes parts que la raison pieuse[b] a pleine maîtrise sur les passions[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont méprisé les souffrances jusqu’à la mort » ou « ont considéré comme peu de chose les souffrances endurées jusqu’à la mort ».'
    reason: lexical_alternative
  - marker: b
    text: '« La raison pieuse » désigne ici la raison façonnée par la révérence envers Dieu ; on pourrait aussi traduire : « la raison guidée par la piété ».'
    reason: lexical_alternative
  - marker: c
    text: Dans l’argument moral et philosophique du livre, les « passions » sont les désirs, penchants ou impulsions susceptibles de dominer la personne, et non les sentiments en général.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: Ainsi donc
  rationale: Cette combinaison marque une conclusion tirée de l’argument précédent. « Ainsi donc » en restitue naturellement la force déductive.
- source_word: τῶν μέχρι θανάτου πόνων
  choice: les souffrances allant jusqu’à la mort
  rationale: πόνοι désigne ici les douleurs ou souffrances endurées, tandis que μέχρι θανάτου indique qu’elles atteignent leur extrême limite dans la mort.
- source_word: ὑπερεφρόνησαν
  choice: ont tenu pour rien
  rationale: Le verbe exprime le fait de considérer ces souffrances comme indignes d’arrêter ou d’effrayer les frères. Cette formulation conserve l’idée de dédain sans suggérer qu’ils ne les ressentaient pas.
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: les sept frères
  rationale: Le masculin pluriel renvoie précisément aux sept frères du récit.
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: il est reconnu de toutes parts
  rationale: Le passif exprime une reconnaissance commune, et ἀπανταχόθεν souligne qu’elle vient de tous côtés.
- source_word: αὐτόδεσπότος
  choice: règne souverainement
  rationale: Cet adjectif rare exprime une maîtrise qui s’exerce de plein droit. La tournure verbale française transmet cette autorité propre sur les passions sans lourdeur littérale.
- source_word: τῶν παθῶν
  choice: sur les passions
  rationale: Dans l’argument moral et philosophique du livre, πάθη désigne les passions ou impulsions qui tendent à dominer la personne, et non simplement les émotions en général.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: λογισμός désigne la faculté de raisonner ou le jugement rationnel, qualifié par εὐσεβής comme orienté par la révérence envers Dieu. « Raison pieuse » conserve les deux dimensions du terme-clé.
theological_decisions:
- issue: Traduction de l’expression programmatique εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison guidée par la piété; le raisonnement pieux
  rationale: Le livre ne parle pas de la raison humaine prise isolément, mais d’une raison façonnée par la révérence envers Dieu. « Raison pieuse » préserve de manière concise cette articulation sans préciser davantage la relation théologique.
- issue: Sens éthique et philosophique de πάθη
  choice: les passions
  alternative: les impulsions; les penchants
  rationale: « Passions » maintient le vocabulaire conceptuel du livre et laisse subsister l’étendue du terme grec, qui ne se réduit ni aux émotions ni aux seules souffrances.
- issue: Portée de αὐτόδεσπότος
  choice: règne souverainement sur
  alternative: est maîtresse de; exerce par elle-même sa maîtrise sur
  rationale: La traduction exprime la pleine autorité attribuée à la raison pieuse tout en évitant de transformer l’adjectif en affirmation doctrinale dépassant l’argument moral du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression argumentative du grec, son affirmation générale et ses termes philosophiques centraux, tout en évitant les formulations archaïques ou excessivement techniques.
