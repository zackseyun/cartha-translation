base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: fr
  text: 'Quand les gardes du corps eurent disposé les roues, les appareils à disloquer les articulations, les instruments de torsion, les crochets[a], les catapultes[b], les chaudrons, les poêles à frire, les étaux à doigts, les mains de fer, les coins et les braises ardentes du feu, le tyran prit la parole et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms d’instruments dans ce verset sont rares ou techniques; certaines traductions sont donc approximatives. On pourrait aussi comprendre « appareils à briser les membres » pour « appareils à disloquer les articulations », « chevalets de torture » pour « instruments de torsion » et « presse-doigts » pour « étaux à doigts ».
    reason: lexical_alternative
  - marker: b
    text: Le texte grec porte bien « catapultes », élément inhabituel dans cette liste. La traduction conserve le terme transmis au lieu de le remplacer conjecturalement par un autre instrument de torture.
    reason: alternative_reading
lexical_decisions:
- source_word: τροχούς
  choice: les roues
  rationale: Le sens premier est « roues ». Le contexte permet de comprendre qu’il s’agit d’instruments de torture, sans qu’il soit nécessaire de le préciser dans le corps du texte.
- source_word: ἀρθρενβόλους
  choice: les appareils à disloquer les articulations
  rationale: Ce composé rare désigne vraisemblablement des instruments agissant sur les articulations ou les membres. Cette formulation explicite leur fonction probable sans prétendre identifier précisément l’appareil.
- source_word: στρεβλωτήριά
  choice: les instruments de torsion
  rationale: Le terme appartient à la famille d’un verbe signifiant tordre ou torturer. « Instruments de torsion » reste proche de cette image tout en étant compréhensible.
- source_word: τροχαντῆρας
  choice: les crochets
  rationale: Ce terme technique rare paraît désigner des instruments munis de crochets. Le choix sobre de « crochets » évite une précision incertaine.
- source_word: καταπέλτας
  choice: les catapultes
  rationale: C’est le sens ordinaire du mot grec. Malgré son caractère surprenant dans cette liste, le texte transmis est conservé plutôt que corrigé par conjecture.
- source_word: λέβητας
  choice: les chaudrons
  rationale: Le mot désigne de grands récipients métalliques pouvant servir à faire bouillir; « chaudrons » convient naturellement au contexte.
- source_word: τήγανά
  choice: les poêles
  rationale: Le terme désigne des récipients plats que l’on chauffe. « Poêles » est l’équivalent français moderne le plus direct.
- source_word: δακτυλήθρας
  choice: les étaux à doigts
  rationale: Le terme, formé sur le mot « doigt », désigne ici un instrument de torture appliqué aux doigts. « Étaux à doigts » exprime cette fonction sans limiter arbitrairement l’instrument aux pouces.
- source_word: χεῖρας σιδηρᾶς
  choice: les mains de fer
  rationale: La traduction littérale conserve l’image frappante du grec, même si l’expression peut désigner des instruments servant à saisir ou à déchirer.
- source_word: σφῆνας
  choice: les coins
  rationale: « Coins » est le sens lexical normal; le texte ne précise ni leur forme exacte ni la manière dont ils étaient employés.
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: les braises ardentes du feu
  rationale: La formule rend l’idée de braises encore vives et conserve la répétition expressive de la mention du feu.
- source_word: οἱ δορυφόροι
  choice: les gardes du corps
  rationale: Littéralement « porteurs de lance », le mot désigne couramment, dans un cadre royal, les gardes rapprochés du souverain.
- source_word: ὑπολαβὼν … ἔφη
  choice: prit la parole et dit
  rationale: Dans ce contexte, le participe introduit la prise de parole du tyran. Cette tournure française restitue naturellement l’enchaînement narratif.
theological_decisions:
- issue: Désignation rhétoriquement chargée du souverain par τύραννος
  choice: le tyran
  alternative: le roi / le souverain
  rationale: Le grec porte un jugement explicite sur le caractère oppressif du dirigeant. « Tyran » préserve cette qualification morale au lieu de la neutraliser.
translation_notes:
  register: Français international moderne, digne et lisible. La longue énumération du grec est conservée, ainsi que ses images concrètes et ses incertitudes techniques; les formulations explicatives restent brèves afin de ne pas alourdir excessivement le verset.
