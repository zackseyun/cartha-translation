  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: fr
  text: Croyez-moi donc[a], et vous recevrez des fonctions dirigeantes dans la conduite de mes affaires, si vous reniez l’ordonnance ancestrale de votre manière de vivre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Croyez donc » ou « Ayez donc confiance ». Le complément « moi » est implicite dans la formulation française.'
    reason: πιστεύσατε peut exprimer la croyance ou la confiance; le contexte de l’exhortation royale permet d’expliciter en français le destinataire implicite de cette confiance.
  - marker: b
    text: 'Ou : « l’institution ancestrale de votre vie en société ».'
    reason: πολιτεία peut désigner la manière de vivre, la vie civique ou l’organisation d’une communauté, et θεσμός une ordonnance, une règle ou une institution.
lexical_decisions:
- source_word: πιστεύσατε
  choice: Faites-moi confiance
  rationale: L’impératif signifie littéralement « croyez » ou « ayez confiance ». Dans cette adresse du roi, le complément « moi » est implicite et doit être exprimé en français naturel. Cette traduction reste plus proche du grec que le simple « obéissez ».
- source_word: ἀρχὰς … ἡγεμονικὰς
  choice: des fonctions de commandement
  rationale: ἀρχή désigne ici une charge ou fonction d’autorité, et ἡγεμονικός en précise le caractère dirigeant.
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: dans l’administration de mes affaires
  rationale: L’expression indique une autorité exercée sur les affaires relevant du roi ; « administration » rend naturellement cette responsabilité sans la limiter à un domaine précis.
- source_word: θεσμόν
  choice: la règle
  rationale: Le terme peut désigner une ordonnance, une institution ou une norme établie. « Règle » convient au contexte tout en évitant de préciser indûment s’il s’agit d’une loi écrite.
- source_word: πολιτείας
  choice: manière de vivre
  rationale: Dans ce contexte, le mot renvoie au mode de vie collectif régi par les coutumes ancestrales, plutôt qu’à la seule citoyenneté ou à un régime politique.
theological_decisions:
- issue: Nature de l’exigence royale
  choice: renier la règle ancestrale qui régit leur manière de vivre
  alternative: renier leur religion ancestrale
  rationale: Le grec ne nomme pas explicitement la religion. La formulation retenue conserve la portée globale et civique de πολιτεία sans réduire ni élargir le propos par une interprétation confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le ton persuasif et autoritaire du roi. Les notes signalent les principales ambiguïtés lexicales sans surcharger le texte.
