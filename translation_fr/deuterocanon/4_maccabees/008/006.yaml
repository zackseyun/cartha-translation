base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: fr
  text: Je vous exhorte à jouir de mon amitié[b] en vous ralliant à moi[a] ; car, tout comme j’ai le pouvoir de punir ceux qui désobéissent à mes ordres, j’ai aussi celui de faire du bien à ceux qui m’obéissent volontiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en me cédant », « en consentant à ce que je demande » ou « en vous rangeant à mon avis ». Le participe grec est difficile, mais il appelle clairement à se conformer à la volonté de celui qui parle.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte royal, « mon amitié » peut aussi désigner « ma faveur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Je vous exhorte
  rationale: Dans ce discours royal, le verbe exprime une vive exhortation, et non une simple demande. Cette tournure reste naturelle et soutenue en français moderne.
- source_word: συνείξαντάς μοι
  choice: en vous ralliant à moi
  rationale: Le participe, d’interprétation délicate, appelle manifestement les destinataires à céder ou à se conformer à la volonté du souverain. « Vous rallier à moi » exprime cette conformité sans imposer l’idée plus forte d’une soumission absolue.
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: à jouir de mon amitié
  rationale: ἀπολαύω signifie jouir de quelque chose ou en bénéficier, tandis que φιλία conserve ici à la fois une dimension personnelle et une nuance politico-patronale.
- source_word: δύναμιν
  choice: le pouvoir
  rationale: Le terme désigne ici une capacité effective, appuyée par l’autorité du souverain.
- source_word: κολάζειν
  choice: punir
  rationale: Le contexte oppose une sanction royale à l’octroi de bienfaits ; « punir » rend clairement la force du verbe.
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: ceux qui désobéissent à mes ordres
  rationale: ἀπειθέω exprime le refus d’obéir, et ἐπιτάγματα désigne des ordres ou commandements imposés par l’autorité.
- source_word: εὐεργετεῖν
  choice: faire du bien à
  rationale: Le verbe signifie accorder des bienfaits. Cette traduction conserve sa portée générale sans préciser indûment la nature de la faveur.
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: ceux qui m’obéissent volontiers
  rationale: Le composé εὐπειθέω évoque une obéissance prompte ou consentante. « Volontiers » restitue cette nuance plus naturellement que « bien » en français.
theological_decisions:
- issue: Nature de la φιλία offerte par le souverain
  choice: amitié
  alternative: faveur, bienveillance
  rationale: « Amitié » préserve le sens lexical et personnel de φιλία, tout en laissant percevoir dans le contexte la faveur qu’un souverain accorde à ses fidèles, sans remplacer le terme par une interprétation exclusivement politique.
- issue: Degré de contrainte exprimé par συνείξαντάς μοι
  choice: en vous ralliant à moi
  alternative: en me cédant, en vous soumettant à moi, en vous rangeant à mon avis
  rationale: Le grec exige une forme de conformité au souverain, mais son expression exacte demeure difficile. Le texte principal évite de trancher en faveur de la notion théologiquement ou politiquement plus chargée de « soumission ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme entre punir les désobéissants et faire du bien aux obéissants. La reprise « j’ai aussi celui de » explicite en français l’ellipse grecque tout en maintenant la structure rhétorique.
