lexical_decisions:
- source_word: γῆρας
  choice: la vieillesse
  rationale: Le nom désigne la vieillesse ou l’âge avancé. Le rendu littéral conserve le caractère abrupt du fragment grec, qui prolonge vraisemblablement la proposition précédente.
- source_word: ἐνθυμηθῶμεν
  choice: réfléchissons au fait que
  rationale: Le subjonctif exhortatif à la première personne du pluriel invite à une réflexion sérieuse. Cette tournure est naturelle en français et introduit clairement la proposition en ὅτι.
- source_word: ἀπειθοῦντες
  choice: si nous désobéissons
  rationale: Bien qu’il s’agisse formellement d’un participe présent, le contexte lui donne naturellement une valeur conditionnelle, rendue explicitement en français.
- source_word: τεθνηξόμεθα
  choice: nous mourrons
  rationale: Le futur de θνῄσκω exprime simplement la conséquence annoncée ; « nous mourrons » est direct, actuel et fidèle.
