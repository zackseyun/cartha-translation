  text: Let us have mercy on our own youth[a], and let us pity our mother’s old age,
translation:
  language: fr
  text: Ayons pitié de nos jeunes années, et ayons compassion de la vieillesse de notre mère[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « ce qui est de la mère », le nom restant sous-entendu dans ce témoin. « Vieillesse » est ajouté d’après le contexte comme sens le plus probable.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: Ayons pitié
  rationale: Le subjonctif exhortatif à la première personne du pluriel appelle à la compassion. « Ayons pitié » conserve directement cette nuance sans introduire l’idée plus forte d’« épargner ».
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: nos jeunes années
  rationale: ἡλικία peut désigner l’âge, une étape de la vie ou la jeunesse. Dans le contexte de ces jeunes frères, « nos jeunes années » exprime naturellement leur jeunesse tout en rendant le pluriel grec.
- source_word: κατοικτειρήσωμεν
  choice: ayons compassion
  rationale: Ce second subjonctif exhortatif exprime une profonde compassion. Cette formulation française reste claire et digne, tout en maintenant le parallélisme avec la première proposition.
- source_word: τὸ τῆς μητρὸς
  choice: la vieillesse de notre mère
  rationale: Dans le texte transmis par Swete, l’article neutre introduit une expression elliptique dont le nom reste implicite. Le contexte rend « vieillesse » vraisemblable, mais cet ajout interprétatif est signalé en note.
