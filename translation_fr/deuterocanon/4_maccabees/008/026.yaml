base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: fr
  text: Les tortures font mourir ceux qui les redoutent.[a] D’où un tel esprit de dispute s’est-il insinué en nous, et pourquoi cette endurance qui mène à la mort nous plaît-elle, alors qu’il nous est possible de vivre sans trouble en obéissant au roi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de cette phrase est syntaxiquement difficile. Selon une autre analyse, ces mots se rattachent à la question qui suit et évoquent la possibilité d’obéir au roi par crainte des tortures mortelles.
    reason: textual_variant
lexical_decisions:
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: Les tortures font mourir ceux qui les redoutent
  rationale: 'Dans le texte grec ponctué de Swete, τὰ βασανιστήρια peut être le sujet neutre pluriel du verbe singulier θανατοῖ, et φοβηθέντας son objet substantivé : « les tortures font mourir ceux qui ont pris peur ». Cette analyse respecte la ponctuation de l’édition tout en signalant la difficulté syntaxique.'
- source_word: πόθεν ἡμῖν ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: D’où nous vient donc un tel esprit de contestation
  rationale: πόθεν interroge ici l’origine ou la cause. φιλονεικία désigne un goût de la dispute ou de la confrontation; « esprit de contestation » conserve le jugement hostile du locuteur. La formulation française rend naturellement l’idée de cette disposition profondément introduite en eux portée par ἐντέτηκεν.
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: cette endurance qui mène à la mort
  rationale: καρτερία exprime l’endurance ou la fermeté, tandis que θανατηφόρος indique une issue mortelle. Cette formulation préserve la caractérisation négative sans transformer la fermeté en vertu explicitement approuvée.
- source_word: ἀρέσκει
  choice: nous plaît-elle
  rationale: Le verbe exprime ce qui plaît ou attire; le pronom « nous » explicite en français le bénéficiaire déjà fourni par ἡμῖν.
- source_word: παρὸν
  choice: alors qu’il nous est possible
  rationale: Le participe marque une possibilité disponible et introduit le contraste entre l’endurance mortelle et une vie paisible.
- source_word: μετὰ ἀταραξίας ζῆν
  choice: vivre sans trouble
  rationale: ἀταραξία désigne l’absence de trouble ou d’agitation. « Sans trouble » reste clair, digne et proche du sens grec.
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: en obéissant au roi
  rationale: Avec le datif de la personne, πείθομαι peut signifier se laisser persuader ou obéir. Dans ce contexte politique, l’obéissance exprime clairement la soumission demandée.
theological_decisions:
- issue: Caractérisation de la fermeté des frères dans le discours hostile
  choice: « esprit de contestation » et « endurance qui mène à la mort »
  alternative: « zèle » et « courage jusqu’à la mort »
  rationale: Le locuteur cherche à discréditer leur refus d’obéir. La traduction conserve son point de vue hostile sans substituer à ses mots l’évaluation positive que l’ensemble du livre peut porter sur les martyrs.
- issue: Rapport entre la crainte des tortures et l’obéissance au roi
  choice: Conserver la phrase initiale comme proposition indépendante selon la ponctuation de Swete
  alternative: 'Rattacher le segment initial à la question : « si, par crainte des tortures mortelles, nous obéissons au roi »'
  rationale: Le témoin fourni place un point après βασανιστήρια et permet d’analyser τὰ βασανιστήρια comme sujet de θανατοῖ. Comme la syntaxe reste difficile, l’autre rattachement est signalé en note plutôt que silencieusement imposé.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique garde le ton dépréciatif du locuteur. « Vivre sans trouble » évite à la fois un vocabulaire trop technique et l’idée plus large de paix politique.
