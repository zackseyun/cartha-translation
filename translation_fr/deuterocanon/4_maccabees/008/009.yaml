  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: fr
  text: Après avoir changé de mode de vie, profitez de votre jeunesse. Car si, par votre désobéissance, vous me mettez en colère[a], vous me forcerez à faire périr chacun de vous sous d’effroyables châtiments et sous la torture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « si vous agissez avec colère envers moi par votre désobéissance ». La tournure grecque est difficile ; le texte traduit le sens qui paraît le plus probable dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: après avoir changé de manière de vivre
  rationale: Le participe évoque l’adoption d’un autre mode de vie ou régime. Cette formulation reste proche du grec sans introduire explicitement l’idée de repentance.
- source_word: ἐντρυφήσατε
  choice: profitez de
  rationale: Dans cet appel adressé à de jeunes hommes, le verbe invite à jouir de leur jeunesse. « Profitez de » est naturel et moins moralement chargé que « livrez-vous aux plaisirs ».
- source_word: ταῖς νεότησιν ὑμῶν
  choice: votre jeunesse
  rationale: Le pluriel grec se rend naturellement en français par le singulier collectif désignant la période de la jeunesse.
- source_word: ὀργίλως … διαθῆσθε
  choice: vous me mettez en colère
  rationale: La tournure grecque est difficile. Dans le contexte de la menace qui suit, elle paraît indiquer que leur désobéissance amènera le roi à agir avec colère.
- source_word: ἀπειθείας
  choice: désobéissance
  rationale: Rendu direct du refus d’obéir, sans l’intensifier en « rébellion ».
- source_word: δειναῖς κολάσεσιν
  choice: sous d’effroyables châtiments
  rationale: La formulation exprime la sévérité des peines et s’intègre naturellement à la menace en français.
- source_word: βασάνων
  choice: au moyen de tortures
  rationale: Le terme désigne ici des tortures judiciaires servant de moyen pour faire mourir.
- source_word: ἀπολέσαι
  choice: faire périr
  rationale: Le verbe signifie détruire ou tuer. « Faire périr » exprime clairement la mise à mort tout en conservant la nuance factitive du contexte.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: chacun de vous
  rationale: Cette formulation française conserve la force distributive de l’expression grecque.
theological_decisions:
- issue: Interprétation de ἐὰν ὀργίλως με διαθῆσθε
  choice: si, par votre désobéissance, vous me mettez en colère
  alternative: si vous agissez avec colère envers moi par votre désobéissance
  rationale: La syntaxe grecque permet difficilement une traduction française univoque. Le contexte favorise l’idée que la désobéissance provoque la colère du tyran, mais une note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve le ton menaçant du souverain. « Car » rend la valeur explicative de ἐπεὶ, tandis que la note signale honnêtement l’ambiguïté de la proposition conditionnelle.
