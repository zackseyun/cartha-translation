  yaml_path: translation/deuterocanon/4_maccabees/008/010.yaml
  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: fr
  text: 'Ayez donc pitié de vous-mêmes : même moi, votre ennemi, j’ai pitié de vous à cause de votre âge.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de votre jeunesse ». Le terme grec peut désigner plus précisément l’étape de la vie où l’on se trouve.
    reason: Alternative lexicale préservant la nuance possible de ἡλικία.
lexical_decisions:
- source_word: κατελεήσατε
  choice: Ayez pitié
  rationale: L’impératif aoriste appelle les jeunes gens à éprouver de la compassion envers eux-mêmes; cette expression est naturelle et conserve la force affective de l’appel.
- source_word: ἑαυτούς
  choice: de vous-mêmes
  rationale: Le pronom réfléchi exprime une compassion tournée vers leur propre personne.
- source_word: οὓς
  choice: vous dont
  rationale: Le relatif reprend «vous-mêmes» et permet, en français idiomatique, de construire le second verbe avec «avoir pitié de».
- source_word: ὁ πολέμιος
  choice: votre ennemi
  rationale: Le grec dit littéralement «l’ennemi»; le rapport au groupe interpellé est implicite et se rend naturellement par le possessif en français.
- source_word: ἔγωγε
  choice: même moi
  rationale: 'Cette formulation restitue l’insistance rhétorique du pronom: celui qui parle affirme les plaindre bien qu’il soit leur ennemi.'
- source_word: τῆς ἡλικίας
  choice: à cause de votre âge
  rationale: ἡλικία désigne l’âge ou l’étape de la vie. La formulation large préserve l’ambiguïté lexicale, tandis que le sens contextuel plus précis est signalé en note.
theological_decisions:
- issue: Nuance précise de ἡλικία
  choice: à cause de votre âge
  alternative: à cause de votre jeunesse
  rationale: Le grec permet le sens général d’«âge» comme celui, plus contextuel, de «jeunesse». Le texte principal conserve la portée la moins restrictive sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La reprise «vous dont… j’ai pitié» maintient le relatif grec sans lourdeur excessive; l’emphase «même moi» conserve la tension rhétorique.
