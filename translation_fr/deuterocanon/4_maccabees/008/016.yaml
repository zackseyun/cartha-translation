  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: fr
  text: 'Et par leur noblesse d’âme[a], ils renversèrent sa tyrannie. Pourtant, réfléchissons : si certains d’entre eux avaient été faibles de cœur et sans courage viril[b], quelles paroles auraient-ils employées ? N’auraient-ils pas employé les paroles suivantes ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur noble disposition », « leur qualité digne d’éloge » ou, peut-être, « leur courage digne d’éloge ». Le terme grec est rare et désigne vraisemblablement ici une qualité morale louable, plutôt qu’une bénédiction prononcée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « non virils ». Le grec emploie un terme marqué par l’idéal masculin antique de la vertu; on pourrait aussi traduire « sans courage » ou « lâches ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: par leur noblesse
  rationale: Le substantif rare εὐλογιστία semble désigner ici une qualité digne de louange grâce à laquelle les martyrs triomphent de la tyrannie. « Noblesse » conserve cette valeur morale et élogieuse sans introduire explicitement le « courage », absent du terme grec.
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: ils renversèrent sa tyrannie
  rationale: καταλύω exprime ici la ruine ou le renversement figuré d’un pouvoir oppressif. « Renversèrent » convient naturellement à « tyrannie » et garde toute la force du grec.
- source_word: καίτοι λογισώμεθα
  choice: Et pourtant, réfléchissons
  rationale: καίτοι marque une transition concessive, tandis que le subjonctif exhortatif λογισώμεθα invite l’auteur et ses lecteurs à envisager ensemble une hypothèse.
- source_word: δειλόψυχοι
  choice: faibles de cœur
  rationale: Le composé signifie littéralement que l’on est faible ou lâche dans son âme. « Faibles de cœur » en restitue l’image intérieure sans réduire le mot à un simple synonyme de ἄνανδροι.
- source_word: ἄνανδροι
  choice: sans virilité
  rationale: Le mot grec est explicitement marqué par l’idéal masculin de courage. « Sans virilité » préserve cette rhétorique genrée tout en restant intelligible en français moderne.
- source_word: ποίοις ἂν ἐχρήσαντο λόγοις
  choice: quelles paroles auraient-ils employées ?
  rationale: χράομαι avec le datif signifie ici « se servir de »; « employer des paroles » exprime naturellement ce qu’ils auraient dit dans cette situation hypothétique.
- source_word: οὐχὶ τούτοις;
  choice: N’auraient-elles pas été celles-ci ?
  rationale: Le démonstratif annonce les paroles du passage suivant. La reprise par le pronom féminin renvoie clairement à « paroles » et conserve la question rhétorique.
theological_decisions:
- issue: Langage genré de la vertu dans ἄνανδροι
  choice: sans virilité
  alternative: sans courage
  rationale: Le texte formule la lâcheté au moyen d’une catégorie masculine propre à sa rhétorique morale. La traduction conserve ce trait historique au lieu de le neutraliser, sans en tirer une affirmation doctrinale supplémentaire.
- issue: Sens de la qualité εὐλογιστία
  choice: noblesse
  alternative: heureuse disposition / courage digne d’éloge
  rationale: Le mot rare permet plusieurs nuances élogieuses. « Noblesse » préserve volontairement une certaine amplitude sémantique et évite d’identifier sans preuve cette qualité au seul courage ou à une bénédiction prononcée.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le passé simple convient au mouvement narratif, tandis que « réfléchissons » rend directement l’exhortation argumentative. La ponctuation met en relief l’expérience de pensée et les deux questions qui l’introduisent.
