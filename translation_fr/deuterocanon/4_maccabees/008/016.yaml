review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la structure argumentative et les questions rhétoriques. « Par leur noblesse » est défendable pour εὐλογιστία, terme rare désignant une qualité estimable/noble; « noblesse d’âme » explicite utilement cette portée morale sans la réduire à une bénédiction ou au seul courage. La dernière question grecque reprend l’action d’« employer » les propos annoncés; elle ne fait pas de λόγοι le sujet. Il convient donc de conserver les frères comme sujet implicite.
  naturalness: Le français est soutenu et globalement naturel. « Sans virilité » peut suggérer en français moderne une caractéristique physique ou sexuelle plutôt que le reproche moral antique. « Sans courage viril » rend plus clairement la valeur rhétorique de ἄνανδροι. « N’auraient-ils pas employé les paroles suivantes ? » est idiomatique et restitue exactement l’ellipse grecque.
  terminology: « Tyrannie », « réfléchir » et « paroles » conviennent. La note sur le terme genré doit signaler que la formulation est antique, tout en évitant de présenter « non virils » comme une citation littérale française. La note sur εὐλογιστία doit garder les possibilités lexicales sans l’orienter indûment vers une bénédiction prononcée.
  issues:
  - severity: medium
    issue: Reprise syntaxique de οὐχὶ τούτοις
    rationale: τούτοις est un datif masculin/neutre dépendant de ἐχρήσαντο sous-entendu (« n’auraient-ils pas employé ceux-ci ? »), non un sujet féminin renvoyant à « paroles ». La formulation française actuelle modifie la construction de la question.
  - severity: low
    issue: Sens moderne potentiel de « sans virilité »
    rationale: Cette expression risque d’évoquer d’abord une absence de masculinité physique. « Sans courage viril » conserve la qualification masculine de l’idéal de courage visé par ἄνανδροι et reste intelligible.
  - severity: low
    issue: Nuance de εὐλογιστία
    rationale: « Noblesse d’âme » exprime plus naturellement en français la qualité morale et intérieure que le terme rare semble désigner dans ce contexte, tout en laissant ouverte sa nuance précise.
