lexical_decisions:
- source_word: μεταλαβόντες
  choice: après avoir adopté
  rationale: Le participe aoriste de μεταλαμβάνω peut signifier « prendre part à » ou « recevoir une part de ». Avec le génitif Ἑλληνικοῦ βίου, il exprime ici l’entrée dans une manière de vivre ou son adoption. « Après avoir adopté » rend naturellement en français cette action antérieure.
- source_word: Ἑλληνικοῦ
  choice: grec
  rationale: L’adjectif désigne directement ce qui est grec ou hellénique. « Grec » est le terme courant et clair en français moderne.
- source_word: βίου
  choice: mode de vie
  rationale: βίος désigne ici une manière de vivre, et non la vie biologique. « Mode de vie » restitue la portée culturelle et pratique du terme sans registre familier.
