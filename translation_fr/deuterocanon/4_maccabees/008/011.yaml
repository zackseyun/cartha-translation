  yaml_path: translation/deuterocanon/4_maccabees/008/011.yaml
  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: fr
  text: 'Et j’ai pitié de votre beauté. Ne réfléchissez-vous pas à ceci : si vous désobéissez, rien d’autre ne vous attend que de mourir au milieu des supplices[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mourir avec des tortures » ; il s’agit d’une mort accompagnée de supplices.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐμορφίας
  choice: beauté
  rationale: Le nom désigne la beauté physique. « Beauté » est naturel, digne et convient à l’appel manipulateur du tyran.
- source_word: οἰκτείρομαι
  choice: j’ai pitié de
  rationale: Cette tournure exprime directement la compassion affichée par le locuteur sans atténuer son ton manipulateur.
- source_word: διαλογιεῖσθε
  choice: ne réfléchissez-vous pas
  rationale: Le verbe invite à examiner ou raisonner; la question rhétorique française garde cette nuance délibérative.
- source_word: ἀπειθήσασιν
  choice: si vous désobéissez
  rationale: Le participe est rendu par une proposition conditionnelle adaptée à l’adresse directe. Aucun complément « me » n’est ajouté, puisqu’il n’est pas explicite en grec.
- source_word: ἀπόκειται
  choice: vous attend
  rationale: Le verbe indique ce qui est réservé ou destiné à quelqu’un; « vous attend » exprime naturellement l’issue menaçante.
- source_word: στρεβλῶν
  choice: torture
  rationale: Le pluriel grec renvoie aux supplices, notamment par torsion. En français, l’expression idiomatique « mourir sous la torture » restitue clairement le sens collectif.
- source_word: ἀποθανεῖν
  choice: mourir
  rationale: L’infinitif signifie simplement « mourir »; le contexte de torture fournit déjà la violence de la mort.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la menace rhétorique du locuteur, sans ajouter le complément implicite « me » après « désobéissez ».
