lexical_decisions:
- source_word: τί
  choice: Pourquoi
  rationale: Dans cette question rhétorique délibérative, τί a naturellement le sens de « pourquoi ? ».
- source_word: ἐξάγομεν ἑαυτοὺς
  choice: nous arracher
  rationale: Le grec signifie littéralement « nous faire sortir ». « Nous arracher à » exprime naturellement en français l’éloignement volontaire d’une condition de vie, sans alourdir la phrase.
- source_word: τοῦ ἡδίστου βίου
  choice: à la vie la plus agréable
  rationale: 'Le superlatif ἡδίστου qualifie βίου : « la vie la plus agréable » reste proche du grec et se comprend immédiatement.'
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux verbes.
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: nous priver nous-mêmes
  rationale: ἀποστερέω signifie ici « priver ». Le complément de la privation n’est pas exprimé dans le texte grec transmis.
