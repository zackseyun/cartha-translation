  text: But the young men[a], who were about to be tortured, said none of these things, nor did they even think them.
translation:
  language: fr
  text: Mais les jeunes hommes qui allaient être torturés ne dirent rien de tout cela et n’y pensèrent même pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et n’envisagèrent même rien de tel ». Le verbe grec peut signifier penser intérieurement à quelque chose ou l’envisager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec ce qui précède, dans un français courant et digne.
- source_word: τούτων οὐδὲν
  choice: rien de tout cela
  rationale: Rend naturellement l’expression partitive et renvoie aux propos évoqués dans le contexte précédent.
- source_word: οἱ νεανίαι
  choice: les jeunes hommes
  rationale: Désigne sans ambiguïté les frères comme de jeunes hommes; cette formulation reste naturelle en français international.
- source_word: βασανίζεσθαι μέλλοντες
  choice: qui allaient être torturés
  rationale: Exprime l’imminence indiquée par μέλλω et la violence physique de βασανίζω dans ce contexte de martyre.
- source_word: εἶπον
  choice: ne dirent
  rationale: Rend directement l’aoriste narratif dans la négation portée par οὐδέν.
- source_word: οὐδὲ ἐνεθυμήθησαν
  choice: et n’en eurent même pas la pensée
  rationale: Exprime l’activité mentale intérieure de ἐνθυμέομαι tout en conservant le renforcement de οὐδέ et le parallélisme entre parole et pensée.
theological_decisions:
- issue: Intensité de βασανίζεσθαι dans le contexte du martyre
  choice: être torturés
  alternative: être tourmentés / être mis à l’épreuve
  rationale: Le contexte décrit des sévices physiques judiciaires; « torturés » en restitue la gravité sans ajouter d’interprétation doctrinale.
- issue: Portée de ἐνεθυμήθησαν
  choice: n’en eurent même pas la pensée
  alternative: n’envisagèrent même rien de tel
  rationale: Le grec peut désigner le fait de penser intérieurement ou d’envisager. La formulation retenue préserve l’idée forte que ces propos ne furent pas même conçus mentalement.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve le contraste initial, l’imminence de la torture et le parallélisme entre ce que les jeunes hommes n’ont ni dit ni pensé.
