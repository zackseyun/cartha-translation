  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
translation:
  language: fr
  text: 'Quand le tyran les vit entourer leur mère, placée au milieu, comme dans un chœur[a], il fut impressionné par eux[b] et, frappé d’étonnement devant leur prestance et leur noble origine, il leur sourit, puis les fit approcher et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme dans une ronde » : le mot grec peut désigner un chœur, notamment un groupe disposé pour une danse.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque peut aussi signifier plus sobrement : « il les remarqua » ou « il prit note d’eux ».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: οὓς ἰδὼν ὁ τύραννος
  choice: Quand le tyran les vit
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « Tyran » conserve le jugement défavorable porté par le narrateur sur le souverain persécuteur.
- source_word: καθάπερ ἐν χορῷ
  choice: comme dans un chœur
  rationale: χορῷ évoque un chœur organisé, qui pouvait aussi former une ronde dansée. Le calque intelligible « chœur » maintient l’image sans la réduire à une simple danse.
- source_word: περιέχοντας μέσην τὴν μητέρα
  choice: entourer leur mère, placée au milieu
  rationale: 'La formulation exprime clairement la disposition spatiale : les fils entourent leur mère, qui occupe la place centrale.'
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  choice: il fut frappé par eux
  rationale: Cette expression difficile indique au minimum qu’ils produisirent une impression sur lui. La formulation retenue garde une certaine intensité tout en laissant la note signaler le sens plus faible possible.
- source_word: τῆς εὐπρεπείας
  choice: leur prestance
  rationale: « Prestance » réunit l’idée de belle apparence et de maintien digne dans un français actuel et soutenu.
- source_word: τῆς εὐγενίας
  choice: leur noble origine
  rationale: εὐγένεια désigne normalement ici la noblesse de naissance ou de lignée. « Noble origine » est plus naturel en français moderne que « noble naissance ».
- source_word: ἐκπλαγεὶς
  choice: Émerveillé
  rationale: Le participe marque une forte réaction d’étonnement admiratif devant les qualités mentionnées. « Émerveillé » convient au sourire qui suit, sans effacer l’intensité.
- source_word: προσεμειδίασεν αὐτοῖς
  choice: il leur sourit
  rationale: Formulation française naturelle exprimant un sourire dirigé vers les jeunes hommes.
- source_word: πλησίον καλέσας ἔφη
  choice: puis les fit approcher et dit
  rationale: Cette tournure rend naturellement l’enchaînement participial et prépare le discours direct du verset suivant.
