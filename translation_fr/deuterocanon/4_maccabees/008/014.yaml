  yaml_path: translation/deuterocanon/4_maccabees/008/014.yaml
  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: fr
  text: 'Ils les placèrent devant eux.[a] Mais le tyran prit la parole et dit : « Jeunes gens, ayez peur : la justice que vous révérez vous sera clémente[b] si vous enfreignez la loi sous la contrainte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le complément de « placèrent » est sous-entendu en grec et doit être repris du contexte précédent.
    reason: ellipse_contextuelle
  - marker: b
    text: Ou « le jugement » ou « la peine que vous révérez vous sera favorable ». Le grec δίκη peut désigner la justice, le jugement ou la peine.
    reason: alternative_lexicale
lexical_decisions:
- source_word: προέθεσαν
  choice: Ils les placèrent devant eux
  rationale: Le verbe signifie mettre ou placer devant quelqu’un. Son complément, sous-entendu dans l’extrait grec, est repris par le pronom « les » afin de conserver l’enchaînement avec le contexte précédent.
- source_word: ὑπολαβών
  choice: prit la parole
  rationale: Dans un dialogue narratif, le participe peut signaler que quelqu’un reprend ou prend la parole. Cette formulation naturelle n’impose pas l’idée plus précise d’une interruption.
- source_word: τύραννος
  choice: tyran
  rationale: Le terme grec porte une appréciation négative que le mot français « tyran » conserve, contrairement à « roi » ou « dirigeant ».
- source_word: Μειράκια
  choice: Jeunes gens
  rationale: L’apostrophe désigne les frères comme des jeunes hommes sans leur donner le caractère trop enfantin de « garçons ».
- source_word: φοβήθητε
  choice: ayez peur
  rationale: L’impératif a une force directe et exhortative, rendue sans atténuation.
- source_word: δίκην
  choice: justice
  rationale: Avec σέβεσθε, le mot désigne vraisemblablement la justice ou l’ordre moral qu’ils révèrent, tout en gardant des sens possibles comme jugement ou peine.
- source_word: σέβεσθε
  choice: vous révérez
  rationale: Le verbe exprime un profond respect religieux ou moral sans exiger le sens plus fort de « adorer ».
- source_word: ἵλεως
  choice: clémente
  rationale: L’adjectif décrit une disposition favorable ou miséricordieuse. « Clémente » convient naturellement à la justice personnifiée.
- source_word: διʼ ἀνάγκην
  choice: sous la contrainte
  rationale: L’expression présente la coercition extérieure comme circonstance atténuante invoquée par le tyran.
- source_word: παρανομήσασιν
  choice: si vous enfreignez la loi
  rationale: Le participe désigne le fait d’agir contre la loi. Une proposition conditionnelle rend clairement en français la situation prospective évoquée par le tyran.
theological_decisions:
- issue: Sens de δίκη dans l’argument moral du tyran
  choice: justice
  alternative: jugement ou peine
  rationale: La justice peut être révérée comme principe moral et se montrer clémente. Une note maintient toutefois l’étendue sémantique du grec sans trancher silencieusement.
- issue: Rapport entre contrainte et transgression
  choice: Formulation conditionnelle attribuée au raisonnement du tyran
  alternative: « envers vous qui aurez enfreint la loi sous la contrainte »
  rationale: Le grec associe la clémence alléguée au fait de transgresser sous la contrainte. La traduction préserve cet argument comme parole du tyran, sans l’approuver ni en faire une affirmation doctrinale du narrateur.
translation_notes:
  register: Français international actuel, clair et digne. « Prit la parole » conserve la dynamique du dialogue sans surinterpréter ὑπολαβών comme une interruption certaine. La ponctuation met en relief l’argument du tyran, tandis que les notes signalent l’ellipse initiale et l’ambiguïté de δίκη.
