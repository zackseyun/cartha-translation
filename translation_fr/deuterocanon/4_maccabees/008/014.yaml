  source_fidelity: 'La traduction rend bien le mouvement général, l''adresse aux jeunes gens, la contrainte et la transgression de la loi. Cependant, « même » n''a pas d''équivalent dans le grec : δίκη est simplement le sujet de « sera clémente ». L''ellipse initiale peut être conservée avec une note contextuelle; le pronom « les » dépend nécessairement du contexte antérieur absent de l''extrait.'
  naturalness: Le français est actuel, clair et d'un registre approprié. « Ayez peur » est direct et naturel dans cette apostrophe. « La justice que vous révérez vous sera clémente » convient à la personnification de δίκη.
  terminology: « Tyran », « jeunes gens », « justice », « révérer », « clémente », « sous la contrainte » et « enfreindre la loi » sont des choix justes. La note sur δίκη préserve utilement l'ambiguïté entre justice, jugement et peine; l'ajout de « peine » dans l'alternative explicite mieux la plage sémantique signalée.
