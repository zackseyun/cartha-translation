base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/003.yaml
  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: fr
  text: Quand le tyran eut donné ces ordres, sept frères furent amenés[a] avec leur mère âgée. Ils étaient beaux, modestes, nobles et charmants à tous égards[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « se présentèrent tandis qu’on les conduisait » ; le grec associe leur arrivée au fait qu’ils étaient menés sous contrainte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pleins de grâce en toute chose » ou « aimables à tous égards ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: Quand ... eut donné ces ordres
  rationale: Le génitif absolu indique une action antérieure. « Donner ces ordres » restitue naturellement en français la force directive de διατάσσω.
- source_word: τοῦ τυράννου
  choice: le tyran
  rationale: τύραννος est ici une désignation péjorative, et non un simple titre politique neutre.
- source_word: παρῆσαν ἀγόμενοι
  choice: furent amenés
  rationale: Cette formulation idiomatique exprime à la fois leur arrivée et le fait qu’ils étaient conduits sous contrainte.
- source_word: μετὰ γεραιᾶς μητρός
  choice: avec leur mère âgée
  rationale: γεραιός désigne un âge avancé; « âgée » convient au registre digne du récit.
- source_word: ἑπτὰ ἀδελφοί
  choice: sept frères
  rationale: Le grec emploie le masculin et désigne précisément sept frères.
- source_word: καλοί
  choice: beaux
  rationale: Dans cette description personnelle, καλός évoque naturellement la beauté ou la belle apparence.
- source_word: αἰδήμονες
  choice: réservés
  rationale: Le terme exprime la retenue, la pudeur et le sens des convenances. « Réservés » est naturel sans réduire le mot à la timidité.
- source_word: γενναῖοι
  choice: nobles
  rationale: γενναῖος peut évoquer la noblesse de caractère aussi bien que le courage; « nobles » maintient cette amplitude dans la liste de qualités.
- source_word: ἐν παντὶ χαρίεντες
  choice: aimables à tous égards
  rationale: χαρίεις évoque l’agrément, le charme et la grâce dans la manière d’être; ἐν παντί en étend la portée à tous les domaines.
theological_decisions:
- issue: Caractérisation rhétorique d’Antiochos par τύραννος
  choice: le tyran
  alternative: le roi; le souverain
  rationale: Le texte grec porte lui-même un jugement moral par ce terme chargé. Le conserver respecte le cadrage de l’auteur sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque a été divisée en deux pour éviter une accumulation lourde, tout en conservant l’ordre du récit et la liste complète des qualités.
