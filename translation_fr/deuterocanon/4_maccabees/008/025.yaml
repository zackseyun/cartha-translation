translation:
  language: fr
  text: Pas même la loi elle-même ne nous [contraint] volontairement —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec fourni est syntaxiquement incomplet : littéralement, « pas même la loi elle-même, volontairement, nous ». Le verbe entre crochets est un supplément éditorial destiné à rendre le fragment lisible; il ne figure pas dans le texte grec transmis ici. Le rattachement exact de « volontairement » demeure incertain.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδὲ
  choice: Même… ne… pas
  rationale: Cette tournure rend naturellement en français la négation emphatique « pas même », tout en permettant de conserver l’ordre général du fragment.
- source_word: αὐτὸς
  choice: elle-même
  rationale: Avec « la loi », le pronom a une valeur intensive et souligne la loi en tant que telle.
- source_word: ὁ νόμος
  choice: la loi
  rationale: Le groupe nominal désigne simplement « la loi » ; la minuscule convient puisque le fragment transmis n’impose pas à lui seul un emploi titulaire.
- source_word: ἑκουσίως
  choice: de notre plein gré
  rationale: L’adverbe signifie « volontairement, de plein gré ». Cette formulation française naturelle conserve son rapport probable avec « nous », sans prétendre lever entièrement l’incertitude syntaxique.
- source_word: ἡμᾶς
  choice: nous
  rationale: Pronom personnel à l’accusatif, rendu directement par « nous ».
theological_decisions:
- issue: Syntaxe fragmentaire ou incomplète du témoin grec fourni
  choice: Conserver les mots attestés et signaler entre crochets le complément verbal éditorial
  alternative: « La loi elle-même ne nous [force] pas non plus à agir volontairement »
  rationale: Le texte fourni, « οὐδὲ αὐτὸς ὁ νόμος ἑκουσίως ἡμᾶς », ne constitue pas une proposition grecque complète. La traduction reste intelligible grâce à un verbe suppléé, mais les crochets et la note empêchent de présenter cette reconstruction comme pleinement attestée. L’expression paradoxale entre contrainte et libre volonté est maintenue plutôt que résolue doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’insistance de αὐτός et rend ἑκουσίως par une expression idiomatique, tout en signalant explicitement que la syntaxe et le rattachement exact de l’adverbe demeurent incertains.
