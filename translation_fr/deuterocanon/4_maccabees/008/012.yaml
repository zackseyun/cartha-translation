  text: And as he said these things[a], he ordered the instruments of torture to be brought forward, so that even through fear he might persuade them to eat defiled food.
translation:
  language: fr
  text: Pendant qu’il disait cela, il ordonna que les instruments de torture soient placés devant eux, afin de les persuader, fût-ce par la peur, de manger de la nourriture souillée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de manger des aliments impurs » ou « de consommer une nourriture souillée ». Le verbe grec désigne le fait de manger ce qui souille ou rend rituellement impur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: Pendant qu’il disait cela
  rationale: Le participe présent exprime ici la concomitance avec l’ordre donné; cette tournure est naturelle en français et conserve le lien temporel.
- source_word: ἐκέλευσεν
  choice: il ordonna
  rationale: Rend directement l’idée d’un ordre ferme.
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: que les instruments de torture soient placés devant eux
  rationale: La formulation rend à la fois la mise en avant et l’exposition des objets devant les personnes visées; « eux » explicite le repère implicite sans modifier le sens.
- source_word: τὰ βασανιστήρια
  choice: les instruments de torture
  rationale: Le pluriel peut désigner les moyens matériels de torture présentés pour intimider, plutôt que les souffrances prises abstraitement.
- source_word: ὅπως
  choice: afin de
  rationale: Introduit clairement la proposition de but.
- source_word: καὶ διὰ τοῦ φόβου
  choice: même par la peur
  rationale: Dans ce contexte d’escalade, καί a vraisemblablement une valeur intensive; « même » la restitue sans transformer la persuasion en contrainte explicite.
- source_word: πείσειεν
  choice: les persuader
  rationale: Conserve le sens ordinaire de πείθω, malgré le contexte coercitif; « contraindre » irait au-delà du verbe grec.
- source_word: μιεροφαγῆσαι
  choice: de manger des aliments qui les rendraient impurs
  rationale: Le verbe composé désigne le fait de manger ce qui souille ou rend impur. La formulation française exprime clairement l’effet religieux et moral de cette consommation sans supposer que les aliments seraient matériellement contaminés.
theological_decisions:
- issue: Sens de μιεροφαγῆσαι dans le contexte du martyre juif
  choice: de manger des aliments qui les rendraient impurs
  alternative: de manger des aliments impurs; de consommer une nourriture souillée
  rationale: Le contexte concerne des aliments interdits par la Loi. La traduction retenue préserve l’idée que leur consommation entraîne une souillure religieuse, tout en maintenant en note les formulations plus compactes possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant une tournure participiale lourde. Le terme « persuader » maintient la tension du texte entre persuasion et intimidation.
