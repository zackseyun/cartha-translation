  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
translation:
  language: fr
  text: Mais lorsqu’ils entendirent les tentatives de persuasion[a] et virent les choses terribles[b], non seulement ils n’eurent pas peur, mais ils argumentèrent même, en philosophes, contre le tyran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les moyens de les gagner » ou « les séductions ». Le terme grec désigne ce qui cherche à amener quelqu’un à céder.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, ces « choses terribles » sont probablement les tortures ou les horreurs placées sous leurs yeux.
    reason: contextual_clarification
  - marker: c
    text: 'Le verbe grec peut se rendre littéralement par « philosopher contre » : il souligne leur résistance raisonnée au tyran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: les tentatives de persuasion
  rationale: Le nom désigne ici les moyens employés pour les amener à céder. Cette formulation conserve l’idée d’une pression persuasive sans la réduire à de simples paroles ni supposer nécessairement des promesses séduisantes.
- source_word: δεινά
  choice: les choses terribles
  rationale: L’adjectif substantivé reste large en grec. Le contexte évoque les tortures et les horreurs montrées aux jeunes hommes, mais la traduction principale préserve cette amplitude sémantique.
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: non seulement ils n’eurent pas peur
  rationale: Cette tournure naturelle en français conserve la structure emphatique du grec.
- source_word: ἀντεφιλοσόφησαν
  choice: ils argumentèrent même en philosophes contre
  rationale: Le verbe composé, rare, exprime une réponse philosophique opposée à l’interlocuteur. La formulation garde à la fois l’idée d’argumentation raisonnée et la valeur adversative du préfixe ἀντι-.
- source_word: τῷ τυράννῳ
  choice: le tyran
  rationale: Le grec porte explicitement le jugement moral « tyran », et non le titre neutre « roi ».
theological_decisions:
- issue: Rendu du vocabulaire lié à la philosophie dans 4 Maccabées
  choice: Conserver explicitement l’image des jeunes hommes argumentant « en philosophes »
  alternative: Dire simplement qu’ils « répondirent au tyran » ou « raisonnèrent avec lui »
  rationale: L’auteur présente intentionnellement leur résistance comme l’exercice d’une raison formée par la philosophie. Une formulation générique effacerait un trait essentiel de son argument, tandis que « contre » préserve l’opposition exprimée par le verbe composé.
translation_notes:
  register: Français international moderne, clair et digne. « N’eurent pas peur » évite une tournure pesante, tandis que « argumentèrent en philosophes contre le tyran » assume une légère coloration littéraire afin de préserver le vocabulaire philosophique caractéristique de l’ouvrage.
