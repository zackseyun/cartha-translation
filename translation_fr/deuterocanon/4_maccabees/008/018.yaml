  text: Why do we delight ourselves in empty schemes and dare a death-bringing disobedience?[a][b]
translation:
  language: fr
  text: Pourquoi nous réjouir de projets vides et oser commettre une désobéissance qui entraîne la mort[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une désobéissance porteuse de mort » ; autre traduction possible : « une désobéissance mortelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Pourquoi
  rationale: Dans cette question rhétorique à valeur d’exhortation, τί demande la raison d’une telle conduite.
- source_word: βουλήμασιν κενοῖς
  choice: de projets sans consistance
  rationale: βουλήμασιν désigne des projets ou desseins, tandis que κενοῖς les présente comme vides, dépourvus de valeur ou d’efficacité. « Sans consistance » conserve l’image tout en étant naturel en français.
- source_word: ἑαυτοὺς εὐφραινόμεν
  choice: nous réjouir
  rationale: L’expression signifie littéralement « nous réjouissant nous-mêmes ». Le pronominal français conserve naturellement le sens réfléchi et l’ironie morale.
- source_word: θανατηφόρον
  choice: qui mène à la mort
  rationale: Le composé signifie « qui porte ou apporte la mort ». Cette formulation française est claire et conserve le rapport explicite à la mort.
- source_word: ἀπειθίαν
  choice: désobéissance
  rationale: Le mot désigne le refus d’obéir; « désobéissance » évite de renforcer indûment le sens par « rébellion ».
- source_word: τολμῶμεν
  choice: oser
  rationale: Le verbe exprime l’audace de s’engager dans une conduite répréhensible; « oser » en restitue directement la force.
theological_decisions:
- issue: Caractérisation morale de ἀπειθία
  choice: désobéissance
  alternative: rébellion ou défiance
  rationale: Le grec condamne un refus d’obéir conduisant à la mort, sans imposer à lui seul le sens plus fortement chargé de « rébellion ».
translation_notes:
  register: Français international moderne, digne et direct. La tournure infinitive après « Pourquoi » rend naturellement la délibération rhétorique à la première personne du pluriel. « Projets sans consistance » préserve l’idée de desseins vides sans employer l’expression plus ambiguë « vains projets ».
