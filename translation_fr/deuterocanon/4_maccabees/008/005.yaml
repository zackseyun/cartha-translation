base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: fr
  text: Jeunes gens, j’admire chaleureusement la beauté de chacun de vous et, tenant en très haute estime un si grand nombre de frères, je vous conseille non seulement de ne pas devenir fous de la même folie que le vieillard qui a déjà été torturé, mais aussi—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni s’interrompt ici après « mais aussi » ; la phrase se poursuit au verset suivant.
    reason: textual_structure
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: Jeunes gens
  rationale: L’expression interpelle directement de jeunes hommes. « Jeunes gens » est naturel en français moderne et convient au groupe masculin décrit par le contexte.
- source_word: φιλοφρόνως
  choice: avec bienveillance
  rationale: L’adverbe exprime une disposition aimable, cordiale ou favorable. « Avec bienveillance » restitue ce ton flatteur sans l’exagérer.
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν
  choice: de chacun de vous
  rationale: Cette formulation conserve la valeur distributive appuyée du grec tout en restant idiomatique en français.
- source_word: θαυμάζω τὸ κάλλος
  choice: j’admire la beauté
  rationale: Dans cette louange rhétorique, θαυμάζω peut signifier admirer ou s’émerveiller devant; « j’admire » rend clairement la valeur élogieuse, et κάλλος désigne ici la beauté.
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν
  choice: un si grand nombre de frères
  rationale: La tournure rend naturellement l’idée d’un groupe nombreux tout en conservant « frères », exact dans ce contexte de fils de la même mère.
- source_word: ὑπερτιμῶν
  choice: tenant en si haute estime
  rationale: Le participe exprime une estime ou une valorisation très élevée; cette tournure française en garde l’intensité et se rattache clairement au groupe de frères.
- source_word: οὐ μόνον συμβουλεύω
  choice: je vous conseille non seulement
  rationale: συμβουλεύω signifie conseiller ou exhorter. « Je vous conseille » convient au discours persuasif du locuteur sans renforcer indûment le verbe.
- source_word: μὴ μανῆναι ... μανίαν
  choice: de ne pas vous abandonner à la même folie
  rationale: Le grec associe le verbe « devenir fou » au nom « folie ». Une répétition strictement apparentée serait peu naturelle en français; cette formulation conserve l’accusation provocatrice de folie et l’idée d’y céder.
- source_word: τῷ προβασανισθέντι γέροντι
  choice: le vieillard qui a déjà été torturé
  rationale: Le participe passif situe la torture du vieillard avant le moment du discours. « Déjà » exprime cette antériorité sans préciser davantage la relation temporelle.
- source_word: ἀλλὰ καὶ
  choice: mais aussi—
  rationale: Le texte fourni s’interrompt au milieu de la construction corrélative. Le tiret signale que la phrase continue sans ajouter de contenu absent de ce verset.
theological_decisions:
- issue: Sens de ἀδελφῶν dans ce contexte familial masculin
  choice: frères
  alternative: frères et sœurs / membres de la fratrie
  rationale: Le contexte présente plusieurs fils qui sont frères entre eux; le masculin n’est donc pas générique et doit être conservé.
- issue: Clause inachevée à la fin du verset
  choice: conserver « mais aussi— »
  alternative: compléter ou lisser la phrase
  rationale: Le texte grec transmis ici se termine par ἀλλὰ καὶ et appelle la suite. La traduction préserve cette suspension au lieu de fournir implicitement le contenu du verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. Le ton bienveillant est volontairement flatteur, conformément à la rhétorique du locuteur. La syntaxe reste assez soutenue pour le discours royal, mais évite les calques peu naturels.
