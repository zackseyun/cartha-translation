base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: fr
  text: « Malheureux que nous sommes, et vraiment insensés ! Alors que le roi nous presse et nous appelle à recevoir un bienfait, ne devrions-nous pas nous laisser convaincre par lui[a] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne devrions-nous pas lui obéir ? » Le grec πεισθείημεν peut signifier se laisser persuader et, par extension, céder ou obéir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: Malheureux que nous sommes
  rationale: Cette exclamation idiomatique en français exprime la détresse et le blâme contenus dans Ὦ τάλανες sans recourir à une tournure archaïque.
- source_word: λίαν ἀνόητοι
  choice: vraiment insensés
  rationale: « Vraiment » rend l’intensité de λίαν, tandis qu’« insensés » conserve le jugement sévère porté par ἀνόητοι.
- source_word: βασιλέως
  choice: le roi
  rationale: Le contexte désigne un roi précis ; l’article défini convient donc en français.
- source_word: παρακαλοῦντος
  choice: nous presse
  rationale: Le verbe exprime ici une exhortation insistante visant à obtenir l’adhésion.
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: nous appelle à recevoir un bienfait
  rationale: La formulation rend l’appel accompagné d’une faveur promise, sans préciser davantage la nature de celle-ci.
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: ne devrions-nous pas nous laisser convaincre par lui ?
  rationale: La question rhétorique et délibérative est rendue naturellement en français. « Se laisser convaincre » préserve le sens premier de πείθομαι tout en laissant entendre l’idée de céder ou d’obéir.
