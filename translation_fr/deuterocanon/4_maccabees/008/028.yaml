  text: For they were contemptuous of sufferings[b][a], and masters of pains.
translation:
  language: fr
  text: Car ils méprisaient les souffrances[a] et étaient maîtres de leurs douleurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « regardaient les souffrances avec mépris ». Le grec exprime plus qu’une simple indifférence : ils les regardaient de haut.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « étaient maîtres des douleurs » ; le grec souligne leur maîtrise sur elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  choice: méprisaient
  rationale: Le terme exprime une attitude forte de dédain, le fait de regarder les souffrances de haut, et non une simple indifférence.
- source_word: τῶν παθῶν
  choice: les souffrances
  rationale: Dans ce contexte de martyre, πάθη désigne ce qui est subi, plutôt que des passions intérieures.
- source_word: αὐτοκράτορες
  choice: dominaient
  rationale: Le mot évoque l’exercice d’un pouvoir ou d’une maîtrise sur quelque chose. Le verbe « dominer » restitue cette idée dans un français naturel.
- source_word: τῶν ἀλγηδόνων
  choice: la douleur
  rationale: ἀλγηδών désigne la douleur, notamment corporelle. Le singulier collectif est idiomatique en français et conserve la distinction avec « les souffrances ».
theological_decisions:
- issue: Rapport entre la maîtrise de soi et la souffrance corporelle dans le contexte du martyre
  choice: Le verset affirme qu’ils méprisaient les souffrances et dominaient la douleur, sans expliciter le fondement philosophique de cette maîtrise.
  alternative: Développer la phrase pour évoquer l’impassibilité ou le triomphe de la raison sur les passions.
  rationale: Le grec reste concis et descriptif. La traduction ne lui ajoute ni système philosophique ni interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La coordination concise du grec est conservée. « Dominaient la douleur » est plus naturel que le calque « étaient maîtres des douleurs », tandis que la note signale la formulation littérale.
