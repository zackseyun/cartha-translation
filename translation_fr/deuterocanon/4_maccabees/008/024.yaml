  text: of the sweet world[a]. Let us not force necessity[b], nor let us boast in our own torture-rack.
translation:
  language: fr
  text: du monde si doux. Ne forçons pas la nécessité[a] et ne nous glorifions pas vainement de notre propre chevalet de torture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne hâtons pas l’inévitable » ou « Ne faisons pas violence à la nécessité ». L’expression grecque est condensée et peut inviter à ne pas précipiter l’épreuve inévitable.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « notre propre chevalet ». Le mot grec désigne un instrument de torture.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: du monde si doux
  rationale: Cette formulation conserve l’image de la douceur et le génitif du fragment grec, tout en sonnant plus naturellement en français moderne que « du doux monde ». Le contexte évoque l’attrait de la vie dans le monde présent.
- source_word: μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Ne forçons pas la nécessité
  rationale: Le tour volontairement resserré reproduit l’expression grecque ambiguë, où βιάζομαι évoque l’action de contraindre ou de faire violence, et ἀνάγκη la nécessité, la contrainte ou l’inévitable.
- source_word: μηδὲ κενοδοξήσωμεν
  choice: et ne nous glorifions pas vainement
  rationale: Le verbe désigne une gloire vaine ou une prétention sans fondement. Cette traduction garde explicitement l’idée de vanité tout en restant naturelle.
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: de notre propre chevalet de torture
  rationale: στρέβλη désigne ici un instrument de torture, notamment le chevalet. « De » rend idiomatiquement le rapport exprimé par ἐπί avec le datif après le verbe de glorification, et « propre » conserve le réfléchi ἑαυτῶν.
theological_decisions:
- issue: Sens de l’exhortation μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Conserver la formule « Ne forçons pas la nécessité » et expliciter son ambiguïté en note.
  alternative: « Ne hâtons pas l’inévitable » ou « Ne faisons pas violence à la nécessité »
  rationale: Dans le contexte du martyre, l’expression peut inviter à ne pas précipiter ou aggraver volontairement l’épreuve inévitable, mais le grec reste condensé et peut aussi évoquer la résistance à la contrainte. Le texte principal ne tranche donc pas silencieusement.
- issue: Portée de la vaine gloire liée au supplice
  choice: « ne nous glorifions pas vainement de notre propre chevalet de torture »
  alternative: « ne recherchons pas une vaine gloire dans notre propre supplice »
  rationale: Le choix maintient la référence concrète à l’instrument de torture et l’avertissement moral contre toute recherche de gloire dans le martyre, sans transformer cet avertissement en affirmation doctrinale plus large.
translation_notes:
  register: Français international moderne, digne et accessible. Le début demeure un fragment syntaxique, conformément au découpage du verset grec. L’étrangeté mesurée de « forçons la nécessité » est intentionnelle afin de préserver l’ambiguïté de l’original.
