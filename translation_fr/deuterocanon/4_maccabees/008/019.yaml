base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: fr
  text: Ne craindrons-nous pas les tortures, frères, et ne prendrons-nous pas en compte les menaces des supplices, et ne fuirons-nous pas cette vaine gloire et cette arrogance funeste ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: Ne craindrons-nous pas
  rationale: Le futur grec a ici la force d’une question rhétorique et délibérative. La tournure française en conserve à la fois la forme interrogative et la portée exhortative.
- source_word: ἄνδρες ἀδελφοί
  choice: frères
  rationale: L’apostrophe désigne explicitement les frères masculins du récit. « Frères » est naturel en français et restitue l’adresse familiale sans calquer lourdement ἄνδρες.
- source_word: τὰ βασανιστήρια
  choice: les tortures
  rationale: Le terme désigne les tortures ou les sévices infligés. « Les tortures » est direct et n’impose pas le sens plus précis d’« instruments de torture ».
- source_word: λογιούμεθα
  choice: ne prendrons-nous pas en compte
  rationale: Le verbe exprime ici le fait de considérer sérieusement ou de tenir compte de quelque chose. Cette formulation française est claire et s’intègre à la série de questions rhétoriques.
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: les menaces des supplices
  rationale: La construction désigne les menaces liées aux tourments annoncés. « Supplices » évite une répétition immédiate de « tortures » tout en conservant la gravité du terme.
- source_word: φεύξομεν
  choice: ne fuirons-nous pas
  rationale: Le sens concret de « fuir » préserve l’image énergique d’un rejet moral, plus vivement que « éviter ».
- source_word: τὴν κενοδοξίαν ταύτην
  choice: cette vaine gloire
  rationale: κενοδοξία évoque une gloire vide, sans substance. « Vaine gloire » est intelligible, digne et proche de l’image grecque.
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: cette arrogance funeste
  rationale: ὀλεθροφόρος qualifie ce qui apporte la ruine ou la destruction, tandis que ἀλαζονία désigne l’arrogance ou la prétention. « Arrogance funeste » rend naturellement leur association sans réduire le sens à la seule mort physique.
theological_decisions:
- issue: Question rhétorique couvrant trois verbes coordonnés
  choice: Conserver une seule séquence interrogative, avec la négation reprise devant chaque verbe en français
  alternative: 'Transformer la phrase en déclaration ou en exhortation directe : « Nous ne craindrons pas… mais nous fuirons… »'
  rationale: La ponctuation et la syntaxe grecques présentent une question rhétorique. La conserver maintient la tension de l’appel adressé aux frères sans résoudre implicitement la relation logique entre la crainte, la prise en compte des menaces et la fuite de l’orgueil.
- issue: Apostrophe masculine ἄνδρες ἀδελφοί
  choice: Employer « frères »
  alternative: Employer « frères et sœurs » ou « hommes, frères »
  rationale: Dans le contexte narratif, l’orateur s’adresse à ses frères. Une formulation inclusive effacerait cette référence masculine, tandis que le calque « hommes, frères » serait peu naturel en français.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La reprise de « ne… pas » clarifie la coordination en français et maintient la force de la question rhétorique. « Supplices » distingue élégamment βασάνων de βασανιστήρια sans modifier le champ sémantique.
