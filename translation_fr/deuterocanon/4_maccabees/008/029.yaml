base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/029.yaml
  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
translation:
  language: fr
  text: 'Ainsi, dès que le tyran eut cessé de les presser de manger des aliments qui les rendraient impurs[a], tous dirent ensemble, d’une seule voix, comme si leur parole venait d’une même âme[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manger une nourriture souillée » ou « manger des aliments impurs ». Le terme grec désigne le fait de manger une nourriture dont la consommation entraîne une souillure religieuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « comme venant de la même âme » : une image exprimant leur parfaite unité de volonté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit la conséquence ou la suite de la scène précédente dans un français narratif naturel.
- source_word: ἅμα τῷ παύσασθαι
  choice: dès que … eut cessé
  rationale: Rend la concomitance immédiate exprimée par la construction grecque, tout en s’intégrant naturellement au récit.
- source_word: τὸν τύραννον
  choice: le tyran
  rationale: Conserve la désignation péjorative et la force rhétorique du grec, plutôt que de la neutraliser par « roi » ou « dirigeant ».
- source_word: συμβουλεύοντα αὐτοῖς
  choice: de les presser
  rationale: Dans ce contexte coercitif, « presser » rend naturellement l’insistance du tyran sans réduire son action à un simple conseil bienveillant.
- source_word: μιεροφαγῆσαι
  choice: manger des aliments qui les rendraient impurs
  rationale: 'Explicite en français la portée cultuelle du rare verbe composé : consommer une nourriture entraînant une souillure religieuse, sans préciser davantage la nature des aliments.'
- source_word: πάντες … ὁμοῦ
  choice: tous … ensemble
  rationale: Préserve à la fois la totalité du groupe et la simultanéité de sa réponse.
- source_word: διὰ μιᾶς φωνῆς
  choice: d’une seule voix
  rationale: Expression française idiomatique correspondant à l’unité de leur prise de parole.
- source_word: ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  choice: comme si elle venait d’une même âme
  rationale: Conserve l’image anthropologique de l’âme et rattache naturellement en français cette image à la voix commune.
- source_word: εἶπον
  choice: dirent
  rationale: Verbe narratif simple qui introduit les paroles du verset suivant.
theological_decisions:
- issue: Portée cultuelle de μιεροφαγῆσαι
  choice: manger des aliments qui les rendraient impurs
  alternative: manger une nourriture souillée ; manger des aliments impurs
  rationale: Le choix retenu indique que la consommation entraînerait une impureté religieuse, sans laisser entendre nécessairement que les aliments seraient matériellement contaminés ni importer une terminologie confessionnelle ultérieure.
- issue: Nuance anthropologique de ψυχή
  choice: une même âme
  alternative: un même esprit ; une même pensée
  rationale: « Âme » maintient l’image forte du grec et l’unité intérieure de leur résolution, au lieu de réduire ψυχή à la seule pensée.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé antérieur marque nettement l’action immédiatement achevée avant leur réponse. La formulation conserve les images du « tyran », de la « voix » unique et de l’« âme » commune, tout en explicitant avec mesure la portée religieuse de μιεροφαγῆσαι.
