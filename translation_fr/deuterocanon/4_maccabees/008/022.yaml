  yaml_path: translation/deuterocanon/4_maccabees/008/022.yaml
  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
translation:
  language: fr
  text: Mais la justice divine[a], elle aussi, nous pardonnera d’avoir eu peur du roi sous la contrainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement divin » ou « le châtiment divin ». Le mot grec δίκη peut désigner la justice, le jugement ou la peine.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγνώσεται
  choice: nous pardonnera
  rationale: Le futur moyen de συγγιγνώσκω exprime ici l’idée d’accorder son pardon ou de tenir compte des circonstances. « Nous pardonnera » convient au complément personnel ἡμῖν et au cadre moral et judiciaire.
- source_word: ἡ θεία δίκη
  choice: la justice divine
  rationale: δίκη peut désigner la justice, le jugement ou la peine. « La justice divine » conserve l’étendue du terme grec et sa personnification dans la phrase, sans réduire le sens au seul châtiment.
- source_word: διʼ ἀνάγκην
  choice: sous la contrainte
  rationale: Cette expression indique que la peur du roi résulte d’une nécessité imposée. « Sous la contrainte » rend naturellement cette circonstance sans ajouter une condition absente du grec.
- source_word: τὸν βασιλέα
  choice: du roi
  rationale: βασιλεύς signifie directement « roi » dans ce contexte.
- source_word: φοβηθεῖσιν
  choice: d’avoir eu peur
  rationale: Le participe aoriste passif, accordé avec le pronom implicite « nous », présente la peur comme la circonstance au sujet de laquelle le pardon est attendu. L’infinitif passé français restitue clairement ce rapport.
theological_decisions:
- issue: Faut-il rendre δίκη par « justice », « jugement » ou « châtiment » dans cette affirmation concernant le pardon divin ?
  choice: la justice divine
  alternative: le jugement divin ; le châtiment divin
  rationale: '« Justice divine » maintient la tension du texte : la justice de Dieu peut tenir compte de la contrainte et accorder son pardon. Cette formulation n’impose pas une interprétation exclusivement punitive.'
translation_notes:
  register: 'Français moderne, digne et accessible. La tournure « elle aussi » rend καί et souligne que même la justice divine est invoquée comme susceptible de pardonner. La phrase reste déclarative et causale : le grec ne comporte pas de mot équivalent à « si ».'
