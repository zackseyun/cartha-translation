base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/001.yaml
  text: For since in the first trial the notorious tyrant was defeated[a], being unable to compel the old man to eat defiling food,
translation:
  language: fr
  text: En effet, puisque, lors de la première épreuve, le tyran bien connu avait été vaincu, n’ayant pas réussi à contraindre le vieillard à manger des aliments qui rendent impur[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à manger de la viande souillée» ou «à manger des aliments interdits». Le verbe grec, rare, évoque la consommation d’une nourriture considérée comme rendant impur selon la loi juive.
    reason: Alternative lexicale pour un verbe grec rare dont le sens exact admet plusieurs formulations.
lexical_decisions:
- source_word: Ἐπειδὴ γὰρ
  choice: En effet, puisque
  rationale: La combinaison introduit une explication tout en exprimant la cause; cette formulation rend γάρ et ἐπειδή sans alourdir excessivement le français.
- source_word: κατὰ τὴν πρώτην πεῖραν
  choice: lors de la première épreuve
  rationale: πεῖρα peut désigner une tentative ou une mise à l’épreuve; «épreuve» convient au contexte du martyre et demeure naturel.
- source_word: ἐνικήθη
  choice: avait été vaincu
  rationale: Le passif de νικάω exprime clairement l’échec du tyran; le plus-que-parfait s’accorde à la subordination causale et à l’antériorité narrative.
- source_word: περιφανὴς
  choice: bien connu
  rationale: L’adjectif indique ici que le tyran est en vue, manifeste ou renommé. «Bien connu» préserve cette idée de notoriété sans imposer une valeur exclusivement laudative ou péjorative.
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: «Tyran» conserve la force politique et morale de τύραννος.
- source_word: μὴ δυνηθεὶς
  choice: n’ayant pas réussi
  rationale: Le participe explique en quoi consistait la défaite du tyran. Cette tournure est naturelle en français et conserve le lien participial.
- source_word: ἀναγκάσαι
  choice: à contraindre
  rationale: «Contraindre» rend directement la coercition exprimée par ἀναγκάζω dans un registre digne et courant.
- source_word: γέροντα
  choice: le vieillard
  rationale: Le nom renvoie, dans le contexte, à l’homme âgé déjà connu. «Vieillard» est précis et convient au registre narratif.
- source_word: μαιροφαγῆσαι
  choice: à manger des aliments qui rendent impur
  rationale: Ce verbe rare désigne la consommation d’une nourriture tenue pour souillante, notamment au regard de la loi juive. La formulation conserve l’accent sur l’impureté sans limiter explicitement le référent à la viande.
theological_decisions:
- issue: Nature de la nourriture évoquée par μαιροφαγῆσαι
  choice: manger des aliments qui rendent impur
  alternative: manger de la viande souillée; manger des aliments interdits
  rationale: Le choix retenu préserve la dimension d’impureté liée à la Torah sans préciser davantage que le grec s’il s’agit nécessairement de viande ni réduire le sens à la seule interdiction juridique.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule, conformément au texte source, qui se poursuit au verset suivant. «Bien connu» maintient l’ambivalence possible de περιφανής mieux que «notoire», souvent nettement péjoratif en français.
