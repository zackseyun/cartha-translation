base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/002.yaml
  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: fr
  text: Alors, profondément bouleversé, il ordonna qu’on fasse venir d’autres Hébreux du même âge[a]. S’ils acceptaient de manger de la viande de cuisse[b], il fallait les relâcher et les reconduire ; mais s’ils s’y opposaient, il fallait les torturer plus cruellement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se comprendre comme « d’autres parmi la classe d’âge des Hébreux »; elle comporte explicitement une référence à l’âge.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « manger de la cuisse ». Le contexte concerne une nourriture interdite, souvent comprise comme de la viande de porc, mais la forme grecque transmise ici nomme la cuisse.
    reason: textual_lexical_ambiguity
  - marker: c
    text: Littéralement « plus amèrement », c’est-à-dire avec davantage de dureté ou de cruauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφόδρα περιπαθὼς
  choice: profondément bouleversé
  rationale: L’expression indique qu’il est très fortement affecté sur le plan émotionnel, sans préciser de façon certaine s’il s’agit de colère, de détresse ou d’agitation.
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: d’autres Hébreux du même âge
  rationale: ἡλικία renvoie ici à l’âge ou à la classe d’âge. Cette formulation française explicite naturellement que les nouvelles personnes appartiennent au même groupe d’âge que celles du contexte.
- source_word: ἀγαγεῖν
  choice: qu’on fasse venir
  rationale: Dans ce contexte de comparution forcée devant le souverain, « faire venir » rend naturellement l’infinitif causatif dépendant de l’ordre.
- source_word: μηροφαγοῖεν
  choice: acceptaient de manger de la viande de cuisse
  rationale: Le texte grec transmis associe μηρός, « cuisse », à l’idée de manger. La traduction suit cette forme attestée au lieu d’importer directement la notion de porc; « acceptaient » rend la portée conditionnelle et coercitive du contexte.
- source_word: ἀπολύειν ἀγώντας
  choice: les relâcher et les reconduire
  rationale: ἀπολύειν signifie les libérer ou les laisser partir. Le participe ἀγώντας est syntaxiquement difficile; la traduction conserve l’idée d’une conduite ou d’un accompagnement lors de leur départ, tout en signalant l’incertitude en note.
- source_word: ἀντιλέγοιεν
  choice: s’y opposaient
  rationale: Le verbe signifie littéralement parler contre, contredire ou faire objection. « S’y opposer » convient au refus exprimé face à l’ordre.
- source_word: πικρότερον
  choice: plus cruellement
  rationale: Le comparatif signifie littéralement « plus amèrement »; appliqué à la torture, il décrit une cruauté ou une dureté accrue tout en gardant la valeur comparative.
- source_word: βασανίζειν
  choice: torturer
  rationale: Dans le récit de persécution et de martyre, le verbe désigne clairement l’infliction de tortures physiques.
theological_decisions:
- issue: Nature précise de l’émotion du souverain dans περιπαθὼς
  choice: une émotion intense, rendue par « profondément bouleversé »
  alternative: « profondément agité » ou « pris d’une violente colère »
  rationale: Le grec affirme l’intensité de l’émotion sans imposer à lui seul la colère comme sentiment précis. La traduction évite donc de déterminer le mobile plus que ne le fait le texte.
- issue: Nature de l’aliment désigné par μηροφαγοῖεν
  choice: 'suivre la forme grecque transmise: « manger de la viande de cuisse »'
  alternative: « manger du porc » ou « manger une nourriture impure »
  rationale: Même si le contexte général concerne des aliments interdits et si d’autres interprétations textuelles sont possibles, la leçon fournie désigne formellement la cuisse. La note préserve l’enjeu sans corriger silencieusement le texte.
translation_notes:
  register: Français international actuel, digne et narratif. La syntaxe est simplifiée en deux phrases pour rester claire à l’oral comme à l’écrit. Les termes « bouleversé », « s’y opposaient » et « plus cruellement » préservent l’intensité du grec sans archaïsme. La difficulté de ἀπολύειν ἀγώντας est rendue prudemment, sans présenter une reconstruction incertaine comme certaine.
