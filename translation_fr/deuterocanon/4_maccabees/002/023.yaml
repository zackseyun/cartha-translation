  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: fr
  text: Et il lui donna une loi selon laquelle, en se conduisant en citoyen[a], il exercerait une royauté empreinte de maîtrise de soi, juste, bonne et courageuse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en menant sa vie civique » ; le participe grec évoque la conduite d’une personne en tant que membre de la cité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il régnerait sur un royaume » ; le mot grec peut désigner aussi bien l’exercice de la royauté que le royaume ou le règne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: il lui
  rationale: 'Le datif désigne la personne mentionnée auparavant et complète naturellement ἔδωκεν : « il lui donna ».'
- source_word: νόμον
  choice: une loi
  rationale: Le nom sans article désigne ici une règle ou une loi donnée au souverain.
- source_word: καθʼ ὃν
  choice: selon laquelle
  rationale: Cette formulation rattache clairement à la loi la manière dont le souverain doit mener sa vie publique.
- source_word: πολιτευόμενος
  choice: en se conduisant en citoyen
  rationale: 'Le participe de πολιτεύομαι conserve une nuance civique : vivre et se comporter comme membre de la cité, même lorsqu’il s’agit du souverain.'
- source_word: βασιλεύσειε
  choice: il exercerait
  rationale: L’optatif exprime ici une perspective ou un résultat envisagé après le don de la loi ; le conditionnel français convient à cette valeur.
- source_word: βασιλείαν
  choice: une royauté
  rationale: βασιλεία peut désigner le royaume ou l’exercice du pouvoir royal. Avec ἀνδρείαν et les autres qualités morales, « royauté » permet plus naturellement de qualifier le mode de gouvernement.
- source_word: σώφρονά
  choice: maîtrisée
  rationale: σώφρων évoque la modération, la maîtrise de soi et la santé du jugement, thème majeur de 4 Maccabées. « Maîtrisée » qualifie ici une royauté gouvernée avec retenue.
- source_word: δικαίαν
  choice: juste
  rationale: Dans ce contexte civique et politique, « juste » exprime directement l’équité du gouvernement.
- source_word: ἀγαθήν
  choice: bonne
  rationale: Le terme grec est large ; « bonne » en conserve la portée sans la préciser excessivement.
- source_word: ἀνδρείαν
  choice: courageuse
  rationale: Le mot désigne le courage comme vertu. « Courageuse » évite une formulation genrée devenue trompeuse en français moderne.
theological_decisions:
- issue: La nuance civique de πολιτευόμενος appliquée au souverain
  choice: Conserver l’idée de se conduire en citoyen.
  alternative: « en vivant conformément à la loi » ou « en administrant l’État »
  rationale: Le grec présente le souverain comme soumis à une norme civique plutôt que comme simple administrateur ou détenteur absolu du pouvoir. La traduction préserve cette tension sans en tirer une doctrine politique supplémentaire.
- issue: Le sens de βασιλείαν
  choice: « une royauté », entendu comme exercice du pouvoir royal
  alternative: « un royaume » ou « un règne »
  rationale: Le grec autorise le domaine gouverné aussi bien que la fonction royale. La série de vertus, notamment le courage, s’applique naturellement ici à la manière d’exercer la royauté, mais l’autre lecture demeure possible et est signalée en note.
- issue: Le sens politique de δικαίαν
  choice: « juste »
  alternative: « droite »
  rationale: « Juste » rend la qualité éthique et publique de la royauté sans déplacer le verset vers un vocabulaire confessionnel plus marqué.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la structure argumentative du grec. « Royauté maîtrisée » est volontairement concise et fait écho au thème de la maîtrise des passions dans 4 Maccabées ; les notes maintiennent les ambiguïtés civique et politique du texte source.
