base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/016.yaml
  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: fr
  text: En effet, la raison qui se maîtrise[a] repousse toutes ces passions mauvaises, tout comme elle repousse aussi la colère ; car elle domine aussi sur celle-ci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’intelligence qui sait se maîtriser ». L’expression grecque associe la faculté de raisonner à la mesure et à la maîtrise de soi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόηθη
  choice: mauvaises
  rationale: Dans ce contexte éthique, l’adjectif qualifie les passions comme moralement mauvaises ou nuisibles. « Mauvaises » reste clair, direct et n’ajoute pas une nuance pathologique absente du grec.
- source_word: πάθη
  choice: passions
  rationale: Le mot désigne ici les impulsions et affects susceptibles d’échapper au contrôle de la raison. « Passions » conserve la portée philosophique du terme dans 4 Maccabées.
- source_word: ὁ σώφρων νοῦς
  choice: la raison maîtresse d’elle-même
  rationale: « Raison » rend νοῦς dans l’argument philosophique du livre, tandis que « maîtresse d’elle-même » exprime la retenue, la mesure et la maîtrise de soi contenues dans σώφρων.
- source_word: ἀπωθεῖται
  choice: repousse
  rationale: Le verbe exprime l’action d’écarter activement. « Repousse » est naturel en français et préserve la force de l’image.
- source_word: θυμόν
  choice: la colère
  rationale: Dans cette énumération des passions à maîtriser, θυμός désigne clairement la colère plutôt que l’ardeur ou le courage.
- source_word: δεσπόζει
  choice: domine
  rationale: Le verbe indique l’exercice d’une autorité ou d’une maîtrise. « Domine » rend cette relation de contrôle avec force et naturel.
theological_decisions:
- issue: Portée anthropologique et philosophique de ὁ σώφρων νοῦς
  choice: la raison maîtresse d’elle-même
  alternative: l’intelligence tempérante ; la raison prudente
  rationale: La formulation retenue maintient ensemble la faculté rationnelle désignée par νοῦς et la maîtrise disciplinée exprimée par σώφρων, sans réduire le syntagme à la simple prudence intellectuelle ni lui imposer une doctrine anthropologique particulière.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de l’idée de maîtrise dans « maîtresse d’elle-même » puis « domine » reflète la progression du grec entre la qualité de la raison et son autorité effective sur la colère.
