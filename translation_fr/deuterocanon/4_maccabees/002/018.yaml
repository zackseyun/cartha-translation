  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: fr
  text: En effet, comme je l’ai dit, la raison maîtresse d’elle-même est capable de l’emporter sur les passions, d’en réorienter certaines et même d’en réduire d’autres à l’impuissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων νοῦς
  choice: la raison maîtresse d’elle-même
  rationale: Dans ce contexte philosophique, l’expression désigne la faculté rationnelle caractérisée par la maîtrise de soi et la justesse du jugement. Cette formulation garde ensemble les deux termes grecs sans réduire σώφρων à la seule prudence pratique.
- source_word: κατὰ τῶν παθῶν ἀριστεῦσαι
  choice: l’emporter sur les passions
  rationale: ἀριστεύω exprime ici la supériorité victorieuse, tandis que πάθη désigne les passions ou impulsions. « L’emporter sur » restitue naturellement l’idée de domination sans exagérer la métaphore militaire.
- source_word: μεταθεῖναι
  choice: réorienter
  rationale: Le verbe évoque un déplacement ou un changement de direction. « Réorienter » marque que certaines passions sont transformées ou dirigées autrement plutôt que supprimées.
- source_word: ἀκυρῶσαι
  choice: réduire à l’impuissance
  rationale: Le verbe signifie rendre sans effet ou sans pouvoir. Cette traduction française exprime clairement la neutralisation envisagée et maintient le contraste avec la simple réorientation.
- source_word: τὰ μὲν αὐτῶν … τὰ δὲ καί
  choice: certaines … et même … d’autres
  rationale: La structure corrélative distingue deux traitements des passions, le second étant présenté comme plus radical par καί.
theological_decisions:
- issue: Rapport entre la raison et les passions
  choice: Présenter la raison comme capable de gouverner, réorienter et neutraliser les passions
  alternative: Parler plus généralement de l’esprit dominant les émotions
  rationale: Le verset s’inscrit dans une argumentation juive hellénistique sur la maîtrise rationnelle des passions. La traduction conserve ce cadre anthropologique et philosophique sans y importer de catégories doctrinales ultérieures.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La phrase conserve la progression rhétorique du grec : victoire générale sur les passions, réorientation de certaines, neutralisation plus radicale d’autres.'
