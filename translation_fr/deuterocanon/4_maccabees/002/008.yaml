  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: fr
  text: 'Ainsi donc, même si quelqu’un aime l’argent, en réglant sa vie sur la Loi, il contraint sa propre conduite : il prête sans intérêt à ceux qui sont dans le besoin et, lorsque vient la septième année[a], il renonce au remboursement du prêt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « lorsque viennent les septaines » ou « les semaines ». L’expression renvoie ici au cycle légal de remise des dettes lors de la septième année.
    reason: cross_reference
  - marker: b
    text: Ou « il assume la perte sur le prêt ». Le participe grec peut souligner la perte financière qu’entraîne l’abandon de la créance.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  choice: Ainsi donc
  rationale: La locution introduit une conséquence immédiate de l’argument précédent. « Ainsi donc » conserve à la fois la valeur déductive et l’enchaînement marqué par γοῦν.
- source_word: τῷ νόμῳ πολιτευόμενος
  choice: en réglant sa vie sur la Loi
  rationale: πολιτεύομαι désigne ici la conduite ou la manière de vivre, tandis que le datif indique la norme qui gouverne cette conduite. Cette formulation est naturelle en français sans suggérer simplement une condition juridique.
- source_word: φιλάργυρός
  choice: aime l’argent
  rationale: Le grec désigne littéralement une personne attachée à l’argent. La tournure verbale est claire et actuelle, tout en évitant de renforcer le sens par « cupide ».
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: il fait violence à sa propre disposition
  rationale: βιάζεται exprime une contrainte énergique exercée sur son propre τρόπος, ici sa disposition ou son penchant habituel. La traduction conserve la force de l’expression grecque.
- source_word: τοῖς δεομένοις
  choice: à ceux qui sont dans le besoin
  rationale: Dans ce contexte de prêt charitable, le participe désigne ceux qui manquent du nécessaire ou ont besoin d’aide.
- source_word: δανείζων χωρὶς τόκων
  choice: il prête sans intérêt
  rationale: τόκος désigne l’intérêt produit par un prêt. « Sans intérêt » est le terme moderne précis.
- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: lorsque vient le cycle des sept
  rationale: Le pluriel ἑβδομάδων signifie littéralement « semaines » ou « groupes de sept ». Le contexte légal évoque le cycle sabbatique, mais la formulation garde visible l’expression inhabituelle du grec au lieu de la réduire sans signalement à « la septième année ».
- source_word: τὸ δάνειον ... χρεοκοπούμενος
  choice: il renonce au remboursement du prêt
  rationale: χρεοκοπούμενος peut mettre l’accent sur la perte assumée relativement au prêt. La formulation exprime concrètement l’abandon de la créance sans imposer le vocabulaire technique d’une annulation formelle.
theological_decisions:
- issue: Allusion à la remise des dettes lors du cycle sabbatique
  choice: Le texte principal conserve l’image grecque du « cycle des sept », tandis que la note indique l’allusion probable à la septième année.
  alternative: Traduire directement « lorsque vient la septième année » et « il annule la dette ».
  rationale: Le contexte rend très probable une allusion à la loi de remise des dettes, mais τῶν ἑβδομάδων est pluriel et χρεοκοπούμενος peut souligner la perte supportée par le prêteur. La traduction préserve cette tension plutôt que de transformer l’allusion en formulation juridique entièrement explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « La Loi » désigne ici la loi biblique. La structure en deux actes concrets — prêter sans intérêt et renoncer au remboursement — reste proche du mouvement de la phrase grecque.
