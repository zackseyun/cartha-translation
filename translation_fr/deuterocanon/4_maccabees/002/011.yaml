  text: and he masters affection for his wife[a], reproving her because of lawlessness;
translation:
  language: fr
  text: et il maîtrise son affection pour sa femme[a], en lui reprochant sa conduite contraire à la loi ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « il prend le dessus sur son affection pour sa femme ». Le verbe grec peut exprimer le fait de l’emporter sur quelque chose ou d’en avoir la maîtrise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: maîtrise
  rationale: Le verbe exprime le fait de prendre le dessus ou d’exercer une domination. « Maîtrise » convient à l’argument du passage sur le pouvoir de la raison, tout en restant naturel en français.
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: son affection pour sa femme
  rationale: γαμετή désigne l’épouse, et φιλία évoque ici l’attachement affectueux au sein du mariage. « Affection » évite de préciser excessivement la nature de cet attachement.
- source_word: διὰ παρανομίαν
  choice: à cause de sa transgression
  rationale: παρανομία désigne un acte contraire à la loi. « Transgression » conserve cette portée morale et juridique sans la réduire à une simple illégalité civile.
- source_word: ἀπελέγχων
  choice: en la reprenant
  rationale: Le participe indique qu’il relève et blâme une faute. « Reprendre » restitue ce sens moral dans une langue française actuelle et digne.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom féminin renvoie naturellement à γαμετήν, « sa femme ».
theological_decisions:
- issue: La maîtrise de la raison sur l’affection conjugale
  choice: Le texte affirme qu’il maîtrise même son affection pour sa femme lorsque sa conduite doit être reprise.
  alternative: Comprendre plus faiblement qu’il ne fait que contenir ou modérer son affection.
  rationale: ἐπικρατεῖ exprime normalement le fait de prendre le dessus. Cette formulation garde la force de l’argument éthique du passage sans y importer de catégorie doctrinale ultérieure.
- issue: Référent implicite du sujet masculin
  choice: Conserver le sujet implicite par « il », conformément au contexte immédiat du passage.
  alternative: Expliciter le sujet comme « la raison » ou « celui qui vit selon la raison ».
  rationale: Le verset grec ne répète pas le substantif sujet. L’expliciter ici risquerait de trancher dans le seul verset une référence fournie par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « même » rend la portée argumentative de καί dans cette série. « Transgression » maintient la dimension de conduite contraire à la loi, tandis que « reprendre » évite le registre vieilli de « réprouver ».
