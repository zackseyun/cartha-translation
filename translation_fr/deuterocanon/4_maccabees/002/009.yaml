base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: fr
  text: 'Même si quelqu’un est avare, il est maîtrisé par la Loi grâce à la raison : il ne tire pas profit des récoltes non moissonnées et ne repasse pas dans les vignes pour grappiller.[a] Dans les autres domaines aussi, on peut reconnaître ceci : la raison domine les passions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ne recueillant pas les raisins restés dans les vignes » ; le verbe grec évoque le fait de repasser dans les vignes pour ramasser ce qui reste après une première vendange.
    reason: Précision lexicale sur le verbe grec rare rendu par « repasser dans les vignes pour grappiller ».
lexical_decisions:
- source_word: φειδωλός
  choice: avare
  rationale: Dans ce contexte, le terme désigne une personne portée à retenir les biens et à vouloir tirer tout le profit possible de ses récoltes. « Économe » serait trop positif, tandis que « avare » exprime clairement l’impulsion que la Loi réfrène.
- source_word: κρατεῖται
  choice: la Loi le maîtrise
  rationale: Le passif grec indique que la personne est tenue sous l’autorité de la Loi. La tournure active est naturelle en français et maintient la Loi comme agent explicite.
- source_word: διὰ τὸν λογισμόν
  choice: par le moyen de la raison
  rationale: λογισμός désigne ici la faculté de jugement rationnel par laquelle la Loi gouverne la conduite. Cette formulation conserve à la fois le rôle instrumental de la raison et le fil philosophique du livre.
- source_word: ἐπικαρπούμενος τοὺς ἀμήτους
  choice: il ne glane pas après les moissons
  rationale: L’expression évoque le fait de revenir prendre le produit laissé après la récolte. « Glaner après les moissons » rend clairement l’image agricole et son lien avec les prescriptions qui réservent les restes aux nécessiteux.
- source_word: ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: ne grappille pas une seconde fois les vignes
  rationale: Le verbe rare désigne le ramassage des grappes restant après une première vendange. « Grappiller une seconde fois » restitue l’idée de repasser dans la vigne.
- source_word: ἐπὶ τῶν ἑτέρων
  choice: dans les autres domaines aussi
  rationale: La formule étend le raisonnement à d’autres cas que les règles agricoles qui viennent d’être citées.
- source_word: ἐπιγνῶναι
  choice: reconnaître
  rationale: L’infinitif exprime ici le fait de discerner une conclusion générale à partir des exemples donnés.
- source_word: παθῶν
  choice: les passions
  rationale: Dans le cadre moral et philosophique de 4 Maccabées, πάθη désigne les impulsions qui doivent être gouvernées, non les émotions en général. « Passions » conserve cette portée.
- source_word: ὁ λογισμὸς κρατῶν
  choice: la raison domine
  rationale: La construction présente la raison comme exerçant son autorité sur les passions. « Domine » garde la force de κρατῶν sans ajouter l’image plus marquée d’un maître personnel.
theological_decisions:
- issue: Portée philosophique et anthropologique de λογισμός
  choice: la raison
  alternative: le jugement rationnel
  rationale: '« La raison » est accessible et permet de conserver le terme directeur de l’argument : la faculté rationnelle, instruite par la Loi, gouverne les passions. La traduction n’impose pas une catégorie philosophique ultérieure plus précise que le grec.'
- issue: Portée morale de πάθη
  choice: les passions
  alternative: les désirs
  rationale: Le texte vise un ensemble d’impulsions susceptibles d’être maîtrisées, dont l’avarice fournit ici un exemple. « Passions » préserve cette ampleur et la tension morale du passage.
- issue: Référence de νόμος
  choice: la Loi
  alternative: la loi
  rationale: Les prescriptions relatives aux moissons et aux vignes renvoient à la Loi donnée à Israël. La majuscule française rend cette référence identifiable, sans préciser davantage ce que le verset laisse implicite.
translation_notes:
  register: 'Français international actuel, digne et lisible. La phrase conserve la structure argumentative du grec : exemple concret, puis conclusion générale. « Glaner » et « grappiller » maintiennent le parallélisme agricole tout en restant compréhensibles grâce à la note.'
