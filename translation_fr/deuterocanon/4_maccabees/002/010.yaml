  text: For the law also prevails over affection toward parents[a], not betraying virtue on account of them[b];
translation:
  language: fr
  text: Car la Loi l’emporte aussi sur l’affection envers les parents[a], sans trahir la vertu à cause d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bienveillance envers les parents » ou « l’attachement aux parents ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour eux » ou « par égard pour eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: la Loi
  rationale: L’article grec et le contexte désignent ici la Loi juive comme autorité morale; la majuscule clarifie cette référence sans ajouter de précision absente du texte.
- source_word: εὐνοίας
  choice: l’affection
  rationale: Dans πρὸς γονεῖς εὐνοίας, le terme désigne une disposition bienveillante envers les parents. « Affection » est naturel en français tout en évitant de surtraduire par « obéissance ».
- source_word: κρατεῖ
  choice: l’emporte sur
  rationale: κρατέω exprime ici la prééminence ou la maîtrise. « L’emporte sur » restitue la priorité éthique de la Loi dans un français actuel.
- source_word: μὴ καταπροδιδοὺς
  choice: sans trahir
  rationale: Le participe négatif indique que la vertu n’est pas livrée ou sacrifiée. « Sans trahir » conserve la force du composé καταπροδίδωμι et s’intègre naturellement à la phrase.
- source_word: ἀρετήν
  choice: la vertu
  rationale: ἀρετή est un terme éthique majeur de 4 Maccabées; « vertu » en préserve le registre philosophique et moral.
- source_word: δι᾽ αὐτούς
  choice: à cause d’eux
  rationale: διά avec l’accusatif marque ici la cause ou le motif. Le pronom renvoie naturellement aux parents, tout en gardant la formulation concise de l’original.
theological_decisions:
- issue: Rapport entre la Loi et l’affection filiale
  choice: La Loi l’emporte sur l’affection envers les parents lorsque la fidélité à la vertu est en jeu.
  alternative: La Loi maîtrise ou règle l’affection filiale, sans que le texte suppose nécessairement un conflit direct.
  rationale: κρατεῖ exprime une supériorité réelle, tandis que le participe négatif montre que l’affection parentale ne doit pas conduire à trahir la vertu. La traduction maintient cette priorité sans généraliser au-delà du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « La Loi » conserve la portée religieuse et morale de ὁ νόμος; « l’emporte sur » exprime clairement la hiérarchie éthique sans lourdeur. Les deux notes signalent les nuances possibles de εὔνοια et de δι᾽ αὐτούς.
