  terminology: « Âme » convient pour ψυχή dans ce contexte; « désirs » reste non moralement chargé pour ἐπιθυμίαι; « beauté » préserve l’ouverture de κάλλος; et « participation » correspond à μετουσία sans imposer une lecture théologique.
