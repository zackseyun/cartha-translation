  yaml_path: translation/deuterocanon/4_maccabees/002/001.yaml
  text: And what is surprising if the desires of the soul are nullified in relation to participation in beauty?[a]
translation:
  language: fr
  text: Et quoi d’étonnant si les désirs de l’âme sont réduits à l’impuissance pour ce qui est de la participation à la beauté ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « à l’égard de la participation à la beauté ». La tournure grecque est abstraite; « partage de ce qui est beau » est une autre possibilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: quoi d’étonnant
  rationale: Cette tournure idiomatique conserve la force de la question rhétorique grecque dans un français actuel.
- source_word: ἐπιθυμίαι
  choice: désirs
  rationale: Le terme désigne largement les désirs ou impulsions, sans les qualifier d’emblée de mauvais ni les réduire aux appétits corporels.
- source_word: ψυχῆς
  choice: de l’âme
  rationale: Dans le cadre philosophique et anthropologique du livre, « âme » préserve le champ conceptuel de ψυχή mieux que « esprit » ou « vie ».
- source_word: ἀκυροῦνται
  choice: sont réduits à l’impuissance
  rationale: Le passif exprime ici le fait d’être privé d’effet ou de force. Cette formulation est plus naturelle en français que « sont annulés » à propos de désirs.
- source_word: πρὸς τὴν τοῦ κάλλους μετουσίαν
  choice: lorsqu’il s’agit de participer à la beauté
  rationale: Cette formulation rend explicitement et naturellement le rapport abstrait marqué par πρὸς, tout en conservant les notions de participation et de beauté.
- source_word: κάλλους
  choice: beauté
  rationale: « Beauté » rend directement κάλλος sans préciser indûment s’il s’agit ici de beauté morale, esthétique ou idéale.
- source_word: μετουσίαν
  choice: participer
  rationale: La forme verbale française exprime naturellement l’idée de participation portée par le substantif grec μετουσία.
theological_decisions:
- issue: Sens anthropologique de ψυχή dans un contexte judéo-hellénistique
  choice: âme
  alternative: être intérieur
  rationale: « Âme » maintient le vocabulaire anthropologique et philosophique du passage sans le ramener à une catégorie psychologique moderne.
- issue: Portée morale ou esthétique de κάλλος
  choice: beauté
  alternative: ce qui est beau
  rationale: Le grec nomme la beauté sans déterminer explicitement sa nature. La traduction conserve cette ouverture au lieu d’introduire « noblesse » ou « beauté morale ».
- issue: Nature de l’action exprimée par ἀκυροῦνται
  choice: sont réduits à l’impuissance
  alternative: sont annulés
  rationale: Le choix retient l’idée de désirs privés d’efficacité, sans suggérer nécessairement leur disparition complète.
translation_notes:
  register: Français moderne, digne et accessible. La question rhétorique est conservée ; la construction abstraite grecque est légèrement explicitée dans le texte, avec sa forme plus littérale signalée en note.
