  source_fidelity: Le rendu de ἀκυροῦνται par « sont réduits à l’impuissance » exprime bien la perte d’efficacité, et « désirs de l’âme », « participation » et « beauté » respectent le vocabulaire philosophique du grec. En revanche, « lorsqu’il s’agit de participer » convertit le rapport abstrait πρὸς τὴν ... μετουσίαν en circonstance conditionnelle et remplace le substantif « participation » par un infinitif. « Pour ce qui est de la participation à la beauté » conserve mieux la relation sans la surinterpréter.
