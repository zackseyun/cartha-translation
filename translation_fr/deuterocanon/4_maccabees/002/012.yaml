  text: and it masters love for children[a], punishing them for their wickedness; and it rules over attachment to friends, reproving them for their evil.
translation:
  language: fr
  text: Elle maîtrise aussi l’affection pour les enfants[a], qu’elle punit à cause de leur méchanceté ; elle domine également l’attachement aux amis, qu’elle reprend à cause de leur perversité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « l’affection des enfants » et, plus loin, « la fréquentation habituelle des amis » ; il s’agit ici de l’affection ou de l’attachement envers ses enfants et ses amis.
    reason: Le grec emploie des génitifs et un terme, συνήθεια, qui peut évoquer aussi bien la fréquentation familière que l’intimité ou l’attachement qui en découle.
lexical_decisions:
- source_word: κυριεύει
  choice: maîtrise
  rationale: Le verbe exprime l’exercice d’une autorité souveraine. « Maîtrise » conserve l’idée de domination tout en restant naturel dans le contexte de la maîtrise des affections.
- source_word: τῆς τέκνων φιλίας
  choice: l’affection pour les enfants
  rationale: Le génitif désigne vraisemblablement l’affection dirigée vers les enfants, notamment ses propres enfants, plutôt que l’amour éprouvé par eux. « Affection » rend ici φιλία sans suggérer une simple amitié entre égaux.
- source_word: διὰ κακίαν αὐτῶν
  choice: à cause de leur méchanceté
  rationale: διά avec l’accusatif indique la cause du châtiment. « Méchanceté » exprime la faute morale de façon claire et actuelle.
- source_word: κολάζων
  choice: qu’elle punit
  rationale: Le participe indique ici l’action de punir ou de châtier. Une proposition relative rend clairement en français que le pronom renvoie aux enfants.
- source_word: τῆς φίλων συνηθείας
  choice: l’attachement aux amis
  rationale: συνήθεια peut désigner la fréquentation habituelle, l’intimité ou le lien qui en résulte. « Attachement » communique naturellement la force affective que le raisonnement domine.
- source_word: δεσπόζει
  choice: domine
  rationale: Le verbe est parallèle à κυριεύει et marque une autorité forte. « Domine » maintient cette intensité tout en variant naturellement le vocabulaire.
- source_word: διὰ πονηρίας
  choice: à cause de leur perversité
  rationale: πονηρία évoque la méchanceté ou la perversité morale. « Perversité » distingue légèrement ce terme de κακία sans atténuer sa portée.
- source_word: ἐξελέγχων
  choice: qu’elle reprend
  rationale: Le verbe peut signifier convaincre de faute, confondre ou réprimander. Avec des personnes pour objet, « reprendre » exprime clairement la réprobation sans imposer un cadre judiciaire.
theological_decisions:
- issue: Sujet sous-entendu des verbes
  choice: Le pronom « Elle » reprend le sujet féminin établi par le contexte français, la raison, sans le répéter explicitement.
  alternative: Répéter « la raison » ou employer une tournure sans sujet explicite.
  rationale: 'Le grec de ce verset n’énonce pas de nouveau sujet : celui-ci se poursuit depuis le contexte. Le pronom respecte cette continuité sans ajouter une précision absente du verset.'
- issue: Rapport entre maîtrise des affections et punition des proches
  choice: La traduction conserve l’affirmation selon laquelle la raison maîtrise l’affection en punissant ou en reprenant les proches lorsqu’ils agissent mal.
  alternative: Paraphraser en disant que la raison supprime toute affection envers les enfants et les amis.
  rationale: Le texte décrit la domination exercée sur les affections naturelles, non leur abolition. Il faut préserver cette tension morale sans l’interpréter selon une doctrine particulière.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme des deux propositions est conservé, avec « maîtrise » et « domine ». Les relatives explicites évitent l’ambiguïté référentielle des participes grecs tout en gardant leur lien logique avec les verbes principaux.
