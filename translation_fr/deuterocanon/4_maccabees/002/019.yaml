  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: fr
  text: 'Pourquoi, en effet, notre très sage père Jacob reproche-t-il à Siméon, à Lévi et aux leurs d’avoir massacré les Sichémites dans leur ensemble, sans se laisser guider par la raison[a], en disant : « Maudite soit leur colère ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est resserrée. L’expression peut se rapporter au massacre : ils n’ont pas agi sous la conduite de la raison. Elle peut aussi qualifier le reproche de Jacob : il ne les blâme pas sans raison. Le contexte favorise l’idée que son blâme est justifié.'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Cette parole reprend Genèse 49.7.
    reason: renvoi intertextuel
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: Pourquoi, en effet
  rationale: Cette tournure conserve à la fois la valeur interrogative de διὰ τί et le lien explicatif ou inférentiel marqué par ἐπεί, dans un français naturel.
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακώβ
  choice: notre très sage père Jacob
  rationale: πάνσοφος est un éloge appuyé de la sagesse. « Très sage » restitue cette emphase sans donner artificiellement à Jacob un attribut d’omniscience.
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: Siméon, Lévi et les leurs
  rationale: La construction οἱ περὶ suivie de noms peut désigner les personnes nommées avec leur groupe ou leurs compagnons. Cette formulation française inclut Siméon et Lévi sans déterminer plus précisément la composition du groupe.
- source_word: αἰτιᾶται
  choice: reproche
  rationale: Le verbe exprime ici le blâme ou la réprobation de Jacob. « Reprocher à » s’intègre naturellement à la construction infinitive française.
- source_word: μὴ λογισμῷ
  choice: sans se laisser guider par la raison
  rationale: 'Le datif λογισμῷ indique ici le principe directeur ou le moyen : le massacre n’a pas été gouverné par la raison. La formulation demeure proche du sens tout en évitant le calque français obscur « non par la raison ».'
- source_word: τοὺς Σικιμίτας
  choice: les Sichémites
  rationale: Gentilé traditionnel et précis pour les habitants de Sichem dans le récit de la Genèse.
- source_word: ἐθνηδόν
  choice: comme un peuple tout entier
  rationale: L’adverbe présente les Sichémites collectivement, comme un groupe ethnique ou un peuple, plutôt que comme quelques individus isolés.
- source_word: ἀποσφάξαντας
  choice: avoir massacré
  rationale: Le verbe composé est violent et dénote une mise à mort sanglante ; « massacrer » en garde la force sans registre familier.
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: Maudite soit leur colère !
  rationale: La formulation garde la force imprécatoire de ἐπικατάρατος et rend θυμός par le terme direct « colère », conformément à l’écho de Genèse 49.7.
theological_decisions:
- issue: Rapport entre le blâme de Jacob, le massacre et la raison dans μὴ λογισμῷ
  choice: Rattacher « sans se laisser guider par la raison » à l’acte de massacrer.
  alternative: 'Comprendre la formule comme portant sur le blâme de Jacob : il ne les blâme pas sans raison.'
  rationale: La proximité de μὴ λογισμῷ avec le participe ἀποσφάξαντας et l’argument du contexte sur la raison qui maîtrise les passions favorisent le rattachement au massacre. La syntaxe grecque reste toutefois assez resserrée pour que l’autre analyse mérite d’être signalée en note.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La question rhétorique est rendue avec fluidité ; le vocabulaire garde la vigueur du grec sans archaïsme. Les espaces avant les deux-points et le point d’exclamation suivent la typographie française.
