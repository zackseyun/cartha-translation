  yaml_path: translation/deuterocanon/4_maccabees/002/024.yaml
  text: How then, someone might say, if reason rules over the passions, does it not also rule over forgetfulness and ignorance?
translation:
  language: fr
  text: Comment donc, pourrait-on dire, si la raison maîtrise les passions, ne maîtrise-t-elle pas l’oubli et l’ignorance ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Comment donc
  rationale: Cette formule introduit avec naturel une objection dans le raisonnement tout en conservant la force interrogative du grec.
- source_word: εἴποι τις ἄν
  choice: pourrait-on dire
  rationale: L’optatif accompagné de ἄν présente l’intervention hypothétique d’un interlocuteur ; la tournure impersonnelle française en rend bien la nuance.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans l’argument philosophique de 4 Maccabées, πάθη désigne les passions ou impulsions que la raison est censée dominer. « Passions » maintient ce vocabulaire conceptuel.
- source_word: ὁ λογισμὸς
  choice: la raison
  rationale: Ici, λογισμός désigne la faculté de jugement rationnel au cœur de l’argument du livre. « La raison » est à la fois précis, courant et digne.
- source_word: κρατεῖ
  choice: maîtrise
  rationale: κρατέω exprime l’exercice d’une domination ou d’un contrôle. « Maîtriser » convient aux passions comme à l’oubli et à l’ignorance, et permet de conserver la répétition grecque.
- source_word: λήθης
  choice: l’oubli
  rationale: λήθη désigne l’oubli ou la perte de mémoire. « L’oubli » est l’équivalent abstrait le plus naturel en français moderne.
- source_word: ἀγνοίας
  choice: l’ignorance
  rationale: ἀγνοία signifie directement « ignorance » et forme avec « l’oubli » le couple abstrait du texte grec.
theological_decisions:
- issue: Sens anthropologique et philosophique de πάθη et λογισμός dans 4 Maccabées
  choice: Traduire πάθη par « passions » et λογισμός par « raison »
  alternative: Traduire πάθη par « émotions » et λογισμός par « jugement rationnel »
  rationale: Le verset s’inscrit dans l’argument continu de 4 Maccabées sur la maîtrise des passions par la raison. Ces choix préservent ce cadre conceptuel sans lui imposer une doctrine confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, sobre et argumentatif. La répétition de « maîtrise » reproduit le parallélisme du grec. Aucun équivalent de « aussi » n’est ajouté, puisque le texte grec attesté n’en comporte pas et que la relation logique demeure claire en français.
