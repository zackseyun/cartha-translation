  text: And do not think it strange that reason can prevail even over hostility for the sake of the law[b][a],
translation:
  language: fr
  text: Et ne trouvez pas étonnant que la raison puisse l’emporter même sur l’hostilité à cause de la Loi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « là où aussi la raison peut l’emporter sur l’hostilité à cause de la Loi ». La construction grecque est concise ; « paradoxal » est aussi possible au lieu d’« étonnant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  choice: ne trouvez pas
  rationale: Dans la tournure évaluative avec un attribut, « ne trouvez pas étonnant » est naturel en français et rend l’interdiction de porter ce jugement.
- source_word: παράδοξον
  choice: étonnant
  rationale: Le terme désigne ici ce qui va contre l’attente ou surprend ; « étonnant » reste courant sans donner au mot le sens technique moderne de « paradoxal ».
- source_word: ὅπου
  choice: que
  rationale: Bien que son sens premier soit « où », ὅπου introduit ici, dans une construction comprimée, la circonstance qui ne doit pas étonner. « Que » rend cette relation idiomatiquement en français.
- source_word: ἔχθραν
  choice: l’hostilité
  rationale: Le mot peut désigner l’inimitié ou l’hostilité. « Hostilité » conserve sa portée relationnelle sans le réduire au seul sentiment de haine.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement rationnel qui maîtrise les passions. « La raison » est concis et cohérent avec ce thème majeur.
- source_word: ἐπικρατεῖν δύναται
  choice: puisse l’emporter même sur
  rationale: Cette formulation exprime à la fois la capacité indiquée par δύναται et la supériorité exprimée par ἐπικρατεῖν ; « même » restitue la force de καί devant ἔχθραν.
- source_word: διὰ τὸν νόμον
  choice: à cause de la Loi
  rationale: διά avec l’accusatif exprime ici la cause ou le motif. « À cause de » préserve cette relative ambiguïté mieux qu’une formulation qui imposerait exclusivement le but.
- source_word: νόμον
  choice: la Loi
  rationale: Dans le contexte de 4 Maccabées, il s’agit de la Loi juive ; la majuscule signale cette référence reconnue sans ajouter de précision absente du grec.
theological_decisions:
- issue: Sens philosophique et théologique de λογισμός
  choice: la raison
  alternative: le raisonnement ; le jugement rationnel
  rationale: « La raison » maintient l’affirmation caractéristique de l’ouvrage selon laquelle la raison pieuse peut dominer les passions, sans importer une terminologie philosophique plus tardive.
- issue: Force de διὰ τὸν νόμον
  choice: à cause de la Loi
  alternative: pour la Loi ; par attachement à la Loi
  rationale: Le grec marque la cause ou le motif sans préciser davantage. La traduction retenue conserve cette ouverture, tandis que « par attachement à » expliciterait une disposition qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure concise et conserve l’affirmation philosophique du grec ainsi que l’ambiguïté causale ou motivationnelle de διὰ τὸν νόμον.
