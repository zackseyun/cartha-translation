  text: And at that time he also enthroned the holy ruling mind over all things through the senses;[a]
translation:
  language: fr
  text: Et alors, il intronisa aussi, par l’intermédiaire des sens, l’intelligence sacrée comme souveraine de toutes choses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la raison sacrée qui gouverne ». Le grec νοῦς désigne ici la faculté rationnelle et morale, et αἰσθητήρια peut désigner les sens ou les facultés de perception.
    reason: Précise les termes anthropologiques importants sans trancher au-delà du grec ni transformer une paraphrase en variante.
lexical_decisions:
- source_word: τηνικαῦτα
  choice: alors
  rationale: L’adverbe marque une étape dans l’argumentation; « alors » est naturel et conserve la valeur temporelle.
- source_word: περὶ πάντων
  choice: au-dessus de tout
  rationale: Avec l’image d’intronisation exprimée par ἐνεθρόνισεν, la locution indique vraisemblablement l’autorité ou la prééminence plutôt qu’un simple sujet de réflexion.
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  choice: l’intelligence sacrée comme souveraine
  rationale: νοῦς désigne ici la faculté rationnelle et morale; « intelligence » reste accessible. ἡγεμόνα exprime la fonction dirigeante, rendue par « comme souveraine », tandis que « sacrée » préserve la portée de ἱερόν.
- source_word: διὰ τῶν αἰσθητηρίων
  choice: par l’intermédiaire des sens
  rationale: La formule rend la valeur instrumentale de διά et le sens de αἰσθητήρια comme organes ou facultés de perception.
- source_word: ἐνεθρόνισεν
  choice: établit … comme souveraine
  rationale: Cette tournure française exprime l’installation dans une position d’autorité; elle sacrifie le calque « intronisa » afin d’éviter une formulation maladroite, tout en maintenant l’image royale grâce à « souveraine ».
theological_decisions:
- issue: νοῦς comme faculté rationnelle et morale dans 4 Maccabées
  choice: intelligence
  alternative: raison
  rationale: « Intelligence » peut désigner la faculté de comprendre et de gouverner, sans réduire νοῦς au seul raisonnement abstrait. La note conserve l’autre traduction possible.
- issue: Portée de περὶ πάντων dans l’image de gouvernement
  choice: au-dessus de tout
  alternative: à l’égard de tout
  rationale: L’association avec l’établissement d’un souverain favorise une lecture de domination ou de préséance, mais l’alternative plus relationnelle reste linguistiquement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’autorité royale de l’image tout en évitant le tour peu naturel « introniser l’intelligence par les sens ».
