  text: nor cutting down the cultivated plants of enemies[a], but preserving those of foes who have been destroyed, and raising up what has fallen.
translation:
  language: fr
  text: sans non plus abattre les plantes cultivées des ennemis, mais en préservant celles des adversaires pour ceux qui ont péri[a], et en relevant ce qui est tombé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en prenant le participe grec comme actif : « pour ceux qui ont détruit [quelque chose] ». Le complément et le lien avec « celles des adversaires » restent implicites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: sans non plus
  rationale: Le participe grec poursuit une série liée au contexte antérieur; « sans non plus » rend la coordination négative sans transformer le fragment en proposition indépendante.
- source_word: δενδροτομῶν
  choice: abattre
  rationale: Le verbe désigne l’action de couper des arbres ou des végétaux ligneux. « Abattre » est naturel ici tout en conservant l’image agricole.
- source_word: τὰ ἥμερα ... φυτά
  choice: les plantes cultivées
  rationale: ἥμερα désigne ce qui est domestiqué ou cultivé, tandis que φυτά reste plus large que le seul mot « arbres ».
- source_word: τῶν πολεμίων
  choice: des ennemis
  rationale: Le génitif indique simplement l’appartenance; « ennemis » convient au contexte d’hostilité ou de guerre.
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: les plantes de leurs adversaires
  rationale: Le substantif φυτά peut être sous-entendu après l’article neutre pluriel. « Adversaires » distingue légèrement ἐχθρῶν de πολεμίων sans leur imposer une différence technique.
- source_word: τοῖς ἀπολέσασιν
  choice: pour ceux qui les ont perdues
  rationale: Le participe aoriste actif peut signifier « ceux qui ont perdu ». Le pronom reprend naturellement les plantes; cette traduction respecte la voix active, contrairement à « ceux qui ont péri ».
- source_word: διασώζων
  choice: en préservant
  rationale: Le verbe signifie sauver à travers un danger, garder intact ou préserver.
- source_word: τὰ πεπτωκότα
  choice: ce qui est tombé
  rationale: Le participe parfait substantivé demeure général dans le grec; la traduction conserve cette largeur.
- source_word: συνεγείρων
  choice: en relevant
  rationale: Le verbe évoque le fait de relever ou de remettre debout; « relevant » garde l’image concrète et sa possible portée restauratrice.
theological_decisions:
- issue: Conduite envers les biens ou cultures des ennemis
  choice: Présenter une conduite de retenue qui préserve les cultures ennemies et relève ce qui est tombé.
  alternative: Comprendre le passage plus largement comme la sauvegarde des biens d’ennemis déjà vaincus ou détruits.
  rationale: Le vocabulaire décrit clairement l’abstention de détruire et une action de préservation ou de relèvement. La formulation retenue maintient cette portée éthique sans ajouter la notion de propriétaires morts, absente du grec.
- issue: Sens de τοῖς ἀπολέσασιν
  choice: « pour ceux qui les ont perdues »
  alternative: « pour ceux qui les ont détruites »
  rationale: La forme est active et peut exprimer soit la perte, soit la destruction. Dans cette construction, la perte des plantes par leurs détenteurs fournit le sens contextuel le plus cohérent, mais l’autre valeur lexicale est signalée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe participiale est conservée parce que le verset est un fragment dépendant du contexte précédent. La répétition de « plantes » explicite l’ellipse grecque tout en évitant de transformer celles-ci en « biens » de manière trop générale.
