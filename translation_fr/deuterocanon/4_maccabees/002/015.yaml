base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/015.yaml
  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
translation:
  language: fr
  text: 'Et il apparaît que la raison l’emporte même sur les passions plus violentes : l’amour du pouvoir, la vaine gloire, la vantardise, l’arrogance et l’envie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « envie » peut aussi évoquer une malveillance jalouse, voire le « mauvais œil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: même les passions les plus violentes
  rationale: Avec κρατεῖν, l’expression désigne le champ sur lequel s’exerce la maîtrise de la raison. πάθη renvoie ici aux passions, et βιαιοτέρων à leur force particulière.
- source_word: κρατεῖν
  choice: domine
  rationale: Le verbe exprime la supériorité et la maîtrise de la raison sur les passions; « domine » est naturel et précis en français.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, le terme désigne la faculté rationnelle ou le jugement raisonné; « la raison » conserve clairement le registre philosophique.
- source_word: φαίνεται
  choice: l’on voit
  rationale: Cette tournure garde l’idée que la maîtrise de la raison apparaît comme manifeste ou constatable.
- source_word: φιλαρχίας
  choice: l’amour du pouvoir
  rationale: Le composé exprime le désir de commander ou d’occuper le premier rang; cette formulation est transparente en français moderne.
- source_word: κενοδοξίας
  choice: la vaine gloire
  rationale: Cette expression rend les deux éléments du composé grec, littéralement une gloire vide, tout en restant idiomatique.
- source_word: ἀλαζονίας
  choice: la vantardise
  rationale: Le mot évoque l’affirmation prétentieuse et fanfaronne de soi; « vantardise » le distingue de l’arrogance qui suit.
- source_word: μεγαλαυχίας
  choice: l’arrogance
  rationale: Le terme renvoie à une orgueilleuse exaltation de soi. « Arrogance » préserve la distinction avec la vantardise.
- source_word: βασκανίας
  choice: l’envie
  rationale: « Envie » rend le sens central dans cette liste de vices, tandis qu’une note conserve les nuances de malveillance et de mauvais œil.
theological_decisions:
- issue: Rendu du terme philosophique clé ὁ λογισμός
  choice: la raison
  alternative: le jugement rationnel; le raisonnement
  rationale: « La raison » exprime sans surcharge technique la faculté qui, dans l’argument du livre, maîtrise les passions.
- issue: Différenciation des vices apparentés κενοδοξία, ἀλαζονία et μεγαλαυχία
  choice: vaine gloire, vantardise, arrogance
  alternative: vanité, prétention, orgueil
  rationale: Le grec accumule des termes proches mais distincts; le français conserve cette progression au lieu de les réduire à une seule notion d’orgueil.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le registre philosophique et l’accumulation rhétorique des cinq passions, sans archaïsme inutile.
