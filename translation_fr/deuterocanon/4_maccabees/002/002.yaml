  text: Accordingly[a], the self-controlled Joseph is praised[b], because by reason he mastered love of pleasure.
translation:
  language: fr
  text: 'C’est pourquoi Joseph, maître de lui-même, est loué : par l’exercice de sa raison[a], il a dominé l’amour du plaisir[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une expression difficile, qui juxtapose des termes pouvant signifier « raisonnement » et « intelligence » ou « pensée ». La traduction en donne le sens conjoint : l’exercice de la faculté rationnelle.'
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: Ou « l’attrait du plaisir » ou « la recherche du plaisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτῃ γοῦν
  choice: C’est donc en cela que
  rationale: La formule reprend le raisonnement précédent et désigne le point précis qui vaut à Joseph d’être loué. Cette tournure conserve à la fois la valeur démonstrative de ταύτῃ et la nuance conclusive de γοῦν.
- source_word: ὁ σώφρων
  choice: maître de lui-même
  rationale: Dans ce contexte, σώφρων caractérise celui qui gouverne ses passions. « Maître de lui-même » exprime naturellement cette maîtrise intérieure sans réduire le terme à la seule prudence intellectuelle.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Forme française traditionnelle du nom propre.
- source_word: ἐπαινεῖται
  choice: est loué
  rationale: Rend directement le passif présent grec.
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: par l’exercice de sa raison
  rationale: La leçon grecque est syntaxiquement difficile et juxtapose des termes relevant du raisonnement et de l’intelligence. La traduction exprime leur sens conjoint comme une activité rationnelle, tout en signalant la difficulté en note.
- source_word: περιεκράτησεν
  choice: il a dominé
  rationale: Le verbe indique qu’il a pris le dessus et exercé sa maîtrise sur une passion. « Dominer » convient à cette relation sans suggérer que le désir a totalement disparu.
- source_word: τῆς ἡδυπαθείας
  choice: l’amour du plaisir
  rationale: ἡδυπάθεια désigne l’attachement au plaisir ou la recherche complaisante du plaisir. « L’amour du plaisir » en conserve la portée générale et morale, sans limiter le terme au seul désir sexuel.
theological_decisions:
- issue: Le rapport entre la raison et les passions dans l’argument de 4 Maccabées
  choice: Présenter Joseph comme dominant l’amour du plaisir par l’exercice de sa raison.
  alternative: Traduire plus abstraitement par « grâce au raisonnement, il a maîtrisé le désir de plaisir ».
  rationale: Le verset illustre la thèse éthique de l’ouvrage selon laquelle la raison peut gouverner les passions. La formulation retenue préserve cette tension sans introduire de catégorie doctrinale ultérieure ni prétendre que la passion est supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure explicative avec deux-points garde le mouvement argumentatif du grec. « Maître de lui-même » et « exercice de sa raison » rendent le vocabulaire éthique central sans jargon philosophique excessif.
