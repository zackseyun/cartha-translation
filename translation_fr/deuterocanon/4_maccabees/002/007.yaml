  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: fr
  text: En effet, comment un homme qui, par habitude, ne mange qu’une seule sorte d’aliment[a], qui est glouton et ivrogne, peut-il être rééduqué, s’il n’est pas évident que la raison maîtrise les passions ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « difficile sur la nourriture » ou « friand de mets particuliers » : le mot grec est rare et son sens précis est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: En effet
  rationale: Introduit la question rhétorique qui étaye l’argument précédent et marque naturellement le lien explicatif en français.
- source_word: τίνα τρόπον
  choice: comment
  rationale: Équivalent français idiomatique de « de quelle manière » dans une question.
- source_word: μονοφάγος
  choice: ne mange qu’une seule sorte d’aliment
  rationale: Rend le sens morphologiquement direct de ce terme grec rare sans trancher silencieusement en faveur des interprétations « difficile sur la nourriture » ou « friand de mets particuliers ».
- source_word: τὸ ἦθος
  choice: par habitude
  rationale: Exprime une disposition acquise ou une conduite habituelle plutôt qu’un état ponctuel.
- source_word: γαστρίμαργος
  choice: glouton
  rationale: Terme courant et précis pour une personne dominée par un appétit excessif.
- source_word: μέθυσος
  choice: ivrogne
  rationale: Désigne une personne caractérisée par l’ivrognerie, et non simplement quelqu’un qui est momentanément ivre.
- source_word: μεταπαιδεύεται
  choice: peut-il être rééduqué
  rationale: Conserve la nuance pédagogique du verbe, qui évoque une nouvelle formation conduisant à un changement de conduite; la modalité française convient à la question portant sur le moyen de cette transformation.
- source_word: δῆλον
  choice: évident
  rationale: Équivalent naturel de l’idée de ce qui est manifeste ou clairement établi.
- source_word: κύριός
  choice: maîtrise
  rationale: Le prédicat exprime ici l’autorité effective de la raison sur les passions, sans employer un titre divin; la formulation verbale est naturelle en français.
- source_word: παθῶν
  choice: les passions
  rationale: Préserve le terme moral et philosophique désignant les appétits ou mouvements qui doivent être gouvernés.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Rend le terme philosophique central de 4 Maccabées pour la faculté rationnelle qui gouverne.
theological_decisions:
- issue: Sens de κύριος dans un contexte philosophique non divin
  choice: la raison maîtrise les passions
  alternative: la raison est maîtresse des passions
  rationale: Le contexte décrit la domination pratique de la raison, non un titre divin. La tournure verbale française transmet clairement cette relation sans ajouter de connotation théologique.
- issue: Masculin générique de τις ὢν
  choice: un homme qui
  alternative: quelqu’un qui
  rationale: Le grec présente l’exemple au masculin singulier; « un homme » en conserve la forme représentative.
- issue: Ambiguïté du rare μονοφάγος
  choice: sens littéral dans le texte avec variantes en note
  alternative: difficile sur la nourriture / friand de mets particuliers
  rationale: Le composé peut être compris littéralement comme l’habitude de ne manger qu’un type d’aliment, tandis que les données lexicales permettent des nuances de sélectivité ou de recherche de mets particuliers. La note préserve cette incertitude.
