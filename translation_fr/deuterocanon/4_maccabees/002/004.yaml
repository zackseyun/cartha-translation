  text: And reason is seen to prevail not only over the frenzy that drives pleasure[a], but also over every desire.
translation:
  language: fr
  text: Or, la raison se révèle capable de dominer non seulement l’impulsion frénétique de la recherche du plaisir[a], mais aussi tout désir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’aiguillonnement de la recherche du plaisir » ou « l’entraînement frénétique vers les plaisirs ». L’expression grecque est rare, très condensée et métaphorique ; elle évoque une excitation comme sous l’effet d’un aiguillon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, le terme désigne la faculté rationnelle, notamment la raison disciplinée sur le plan moral; « la raison » conserve sa portée philosophique et reste naturel en français.
- source_word: φαίνεται
  choice: se montre capable de
  rationale: Cette formulation rend le caractère manifeste exprimé par le verbe, tout en s’articulant naturellement avec l’infinitif ἐπικρατεῖν, sans réduire le propos à une simple apparence trompeuse.
- source_word: ἐπικρατεῖν
  choice: maîtriser
  rationale: Le verbe exprime ici la supériorité effective et la domination exercée sur les impulsions; « maîtriser » convient au rapport entre la raison et les désirs.
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: l’aiguillon frénétique de la recherche du plaisir
  rationale: La formule grecque, rare et condensée, associe l’idée d’un aiguillon qui pousse avec celle d’une agitation proche de la frénésie, liée à l’amour du plaisir ou à la complaisance envers celui-ci.
- source_word: πάσης ἐπιθυμίας
  choice: tout désir
  rationale: Cette traduction préserve à la fois le sens large de ἐπιθυμία et la portée universelle de πάσης.
theological_decisions:
- issue: Affirmation anthropologique et philosophique de la maîtrise des passions par la raison
  choice: La raison est présentée comme effectivement capable de maîtriser l’impulsion vers le plaisir ainsi que tout désir.
  alternative: La raison semble seulement l’emporter, sans que sa maîtrise soit affirmée comme réelle.
  rationale: Dans ce contexte argumentatif, φαίνεται indique ce qui se manifeste ou se constate. La traduction conserve cette nuance sans affaiblir la thèse centrale du livre ni lui ajouter des catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Or » marque la progression de l’argument. La métaphore grecque de l’aiguillon et de la frénésie est maintenue dans le texte, avec des formulations plus explicites en note.
