lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: Car si… ne… pas
  rationale: Conserve la valeur explicative de γάρ et la structure conditionnelle de εἰ μή dans un français naturel.
- source_word: ἐδύνατο
  choice: n’était pas capable de
  rationale: L’imparfait de δύναμαι exprime ici la capacité dans une condition contraire aux faits; cette tournure s’accorde avec le résultat au conditionnel passé.
- source_word: τῶν θυμῶν
  choice: les passions
  rationale: Le pluriel de θυμός peut désigner les mouvements affectifs ou impulsions passionnelles; dans l’argument philosophique de 4 Maccabées, « passions » restitue mieux cette portée que le seul sens de « colères ».
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle ou le jugement raisonné qui gouverne les affects; « la raison » est précis, naturel et cohérent avec ce thème.
- source_word: κρατεῖν
  choice: maîtriser
  rationale: κρατέω exprime la domination exercée sur quelque chose; « maîtriser » rend clairement l’idée de contrôle effectif.
- source_word: οὐκ ἂν εἶπεν
  choice: il n’aurait pas parlé
  rationale: ἄν avec l’aoriste exprime ici le résultat irréel; le conditionnel passé français en conserve la force.
- source_word: οὕτως
  choice: ainsi
  rationale: Renvoie à la manière ou au contenu des paroles précédentes; « ainsi » est concis et idiomatique.
theological_decisions:
- issue: Sens philosophique et anthropologique de λογισμός
  choice: la raison
  alternative: la faculté de raisonner
  rationale: « La raison » préserve le concept central de l’ouvrage sans alourdir la formulation ni réduire λογισμός à une simple activité mentale.
- issue: Étendue sémantique de θυμοί
  choice: les passions
  alternative: les colères
  rationale: Bien que θυμός puisse désigner la colère, le pluriel s’inscrit ici dans une réflexion plus large sur les mouvements affectifs soumis à la raison; « passions » maintient cette portée sans la limiter.
