  text: For the law says[a], then, “You shall not desire your neighbor’s wife, nor anything that belongs to your neighbor.”
translation:
  language: fr
  text: 'La Loi dit en effet : « Tu ne désireras pas la femme de ton prochain, ni rien de ce qui lui appartient. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne convoiteras pas la femme de ton prochain, ni rien de ce qui est à ton prochain. »'
    reason: Variante lexicale qui conserve le sens traditionnel de ἐπιθυμέω et reproduit plus formellement la construction possessive grecque.
lexical_decisions:
- source_word: λέγει γοῦν ὁ νόμος
  choice: La Loi dit en effet
  rationale: Le présent λέγει introduit la citation comme une parole toujours valable. γοῦν a ici une valeur confirmative ou déductive; « en effet » relie naturellement la citation à l’argument précédent. La majuscule à « Loi » signale ici la Loi mosaïque.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Tu ne désireras pas
  rationale: ἐπιθυμέω désigne le fait de désirer vivement ou de convoiter. « Désirer » reste transparent en français moderne et maintient le lien lexical avec le thème des désirs et des passions dans le contexte; « convoiter » est donné en variante.
- source_word: τὴν γυναῖκα τοῦ πλησίον σου
  choice: la femme de ton prochain
  rationale: γυνή prend ici le sens d’« épouse/femme » en raison de la relation possessive et de l’écho au Décalogue. « La femme de ton prochain » est une formulation française naturelle et reconnaissable.
- source_word: οὐδὲ ὅσα τῷ πλησίον σού ἐστιν
  choice: ni rien de ce qui lui appartient
  rationale: Le neutre pluriel ὅσα a une portée globale, rendue idiomatiquement par « rien de ce qui ». Le datif possessif avec ἐστιν est exprimé naturellement par « appartient », et le pronom « lui » évite une répétition lourde sans perdre le référent.
theological_decisions:
- issue: Traduction de ἐπιθυμήσεις dans cette citation du Décalogue
  choice: Tu ne désireras pas
  alternative: Tu ne convoiteras pas
  rationale: Le grec peut exprimer soit le désir en général, soit la convoitise dirigée vers ce qui appartient à autrui. « Désireras » préserve le lien avec l’analyse des passions menée par l’auteur, tandis que la variante traditionnelle « convoiteras » est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier respecte la forme du commandement grec. La ponctuation française encadre la citation; la formulation conserve le caractère scripturaire sans archaïsme excessif.
