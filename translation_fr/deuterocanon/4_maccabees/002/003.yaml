  text: For while he was still young and in the prime of life for sexual union[a], he nullified by reason the sting of the passions.
translation:
  language: fr
  text: Car, jeune et dans toute la vigueur de l’âge, apte à l’union sexuelle, il réduisit à néant par la raison l’aiguillon des passions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’excitation des passions » ou « la frénésie des passions ». Le terme grec οἶστρον peut évoquer une piqûre, un aiguillon ou une impulsion violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: νέος
  choice: jeune
  rationale: L’adjectif désigne la jeunesse. « Jeune » convient naturellement à la construction avec ὢν sans expliciter davantage que le grec.
- source_word: ἀκμάζων
  choice: dans la pleine vigueur de l’âge
  rationale: Le participe évoque le fait d’être à son apogée, dans toute sa vigueur physique; cette formulation conserve ce sens dans un registre actuel et digne.
- source_word: πρὸς συνουσιασμόν
  choice: pour l’union sexuelle
  rationale: Dans ce contexte, l’expression concerne la capacité et la disposition aux rapports sexuels. « Union sexuelle » reste explicite sans être clinique ni crue.
- source_word: ἠκύρωσεν
  choice: réduisit à néant
  rationale: Le verbe signifie rendre sans effet ou invalide. « Réduisit à néant » exprime énergiquement l’action décisive exercée sur l’impulsion des passions.
- source_word: τῷ λογισμῷ
  choice: par la raison
  rationale: λόγισμος est un terme central de 4 Maccabées pour la faculté rationnelle qui gouverne les passions. « La raison » en préserve clairement la portée éthique et philosophique.
- source_word: οἶστρον
  choice: l’aiguillon
  rationale: Le mot peut désigner un taon, puis métaphoriquement une excitation mordante, un aiguillon ou une frénésie. « Aiguillon » conserve la métaphore d’une force qui pique et pousse à agir.
- source_word: τῶν παθῶν
  choice: des passions
  rationale: Dans l’argument éthique de l’ouvrage, πάθη désigne les passions et appétits que la raison doit maîtriser. « Passions » maintient ce vocabulaire sans le réduire aux seules émotions.
theological_decisions:
- issue: Rendre le terme éthique et philosophique λόγισμος conformément au thème directeur de 4 Maccabées
  choice: la raison
  alternative: le jugement rationnel
  rationale: Le livre affirme la maîtrise des passions par une raison pieuse. « La raison » conserve cette tension centrale tout en évitant d’introduire une distinction philosophique ou confessionnelle étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire moral et philosophique de l’ouvrage ainsi que la métaphore vive de l’aiguillon. Le marqueur de note est placé après « l’aiguillon des passions », expression à laquelle la note se rapporte.
