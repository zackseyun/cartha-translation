translation:
  language: fr
  text: Car, lorsque Dieu a façonné l’être humain, il a implanté en lui ses passions et ses dispositions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁπηνίκα
  choice: lorsque
  rationale: La conjonction introduit ici le moment où Dieu a façonné l’être humain; « lorsque » convient naturellement au contexte ponctuel marqué par l’aoriste.
- source_word: κατεσκεύασεν
  choice: a façonné
  rationale: Le verbe exprime l’idée de préparer ou de former avec intention. « A façonné » est naturel en français et conserve cette nuance sans employer « créer », terme théologique plus spécifique qui n’est pas celui du grec.
- source_word: τὸν ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier avec article a une portée générique. « L’être humain » désigne clairement l’humanité représentée collectivement sans donner au masculin français une portée sexuée indue.
- source_word: τὰ πάθη
  choice: ses passions
  rationale: Dans le cadre philosophique de 4 Maccabées, πάθη désigne les mouvements affectifs ou impulsions que la raison doit gouverner, plutôt que des souffrances subies.
- source_word: τὰ ἤθη
  choice: ses dispositions
  rationale: ἤθη renvoie ici aux traits ou tendances du caractère. « Dispositions » garde cette portée anthropologique sans réduire le terme à des habitudes ou à des manières sociales.
- source_word: περιεφύτευσεν
  choice: a implanté en lui
  rationale: Le verbe conserve une image de plantation ou d’insertion. « A implanté en lui » la rend clairement et explicite en français le lieu implicite de l’implantation.
theological_decisions:
- issue: Les passions et les dispositions comme éléments implantés par Dieu dans l’être humain
  choice: Affirmer directement que Dieu les a implantées en l’être humain.
  alternative: Atténuer l’énoncé en parlant seulement de facultés neutres ou de capacités à éprouver des passions.
  rationale: Le grec attribue explicitement à Dieu l’implantation des πάθη et des ἤθη. La traduction conserve cette tension anthropologique et théologique sans la résoudre ni l’adoucir.
translation_notes:
  register: Français international moderne, digne et accessible. « Façonné » préserve l’idée d’une formation délibérée tout en restant idiomatique; la phrase suit de près la structure et la portée du grec.
