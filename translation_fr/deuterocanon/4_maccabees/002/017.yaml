base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/017.yaml
  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: fr
  text: Bien que Moïse se soit mis en colère contre Dathan et Abiron[a], il n’agit en rien contre eux sous l’emprise de la colère ; au contraire, par la raison, il maîtrisa sa colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Forme grecque du nom traditionnellement rendu par « Abiram ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par son jugement rationnel, il gouverna sa colère ». Le grec souligne la maîtrise de la passion par la raison, thème central de 4 Maccabées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος
  choice: se soit mis en colère
  rationale: Le participe indique que Moïse éprouva réellement de la colère. Cette tournure française naturelle en conserve la force sans suggérer qu’il agit sous son impulsion.
- source_word: γέ τοι
  choice: bien que
  rationale: 'Dans ce contexte fortement contrastif, les particules introduisent une concession : Moïse était en colère, mais ne se laissa pas diriger par elle.'
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: contre Dathan et Abiron
  rationale: κατά marque ici l’orientation hostile de la colère. « Abiron » reproduit la forme grecque Ἀβειρών plutôt que de la normaliser selon la forme traditionnelle « Abiram ».
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: il n’agit en rien contre eux sous l’emprise de la colère
  rationale: Le datif θυμῷ exprime la manière ou le ressort de l’action. « Sous l’emprise de » rend clairement que la colère n’a pas gouverné sa conduite, tout en évitant la répétition peu naturelle de « colère » avec le membre précédent.
- source_word: λογισμῷ
  choice: par la raison
  rationale: 'λογισμός est un terme directeur de 4 Maccabées : la faculté rationnelle qui gouverne les passions. « La raison » est à la fois accessible et suffisamment philosophique.'
- source_word: τὸν θυμὸν διήτησεν
  choice: il maîtrisa sa colère
  rationale: Dans l’argument du livre, διαιτάω décrit ici l’exercice d’une direction ou d’un contrôle sur la passion. « Maîtrisa » exprime ce gouvernement rationnel sans prétendre que la colère n’existait pas.
theological_decisions:
- issue: Rendre λογισμός sans affaiblir le thème du gouvernement rationnel des passions
  choice: par la raison
  alternative: par son jugement rationnel
  rationale: « Par la raison » conserve le terme conceptuel central du livre dans un français courant et digne ; l’autre formulation explicite davantage, mais introduit une précision absente du grec.
- issue: Rapport entre la colère éprouvée et la conduite de Moïse
  choice: Moïse éprouve la colère, mais la maîtrise par la raison
  alternative: Moïse réprime ou élimine sa colère
  rationale: Le grec maintient la tension entre l’existence réelle de la passion et son gouvernement rationnel. La traduction ne doit ni nier la colère ni suggérer qu’elle commande l’action.
- issue: Forme du nom Ἀβειρών
  choice: Abiron
  alternative: Abiram
  rationale: La forme principale suit directement le grec de la source. Une note fournit la forme traditionnelle française afin d’aider le lecteur à identifier le personnage.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule met en relief l’opposition argumentative. « Sous l’emprise de la colère » évite une formulation raide tout en préservant le contraste entre passion éprouvée et action gouvernée par la raison.
