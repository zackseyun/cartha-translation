base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: fr
  text: Pourtant, lorsque la Loi nous ordonne de ne pas convoiter, je pourrais vous convaincre bien davantage que la raison peut maîtriser les désirs, tout comme elle maîtrise aussi les passions qui font obstacle à la justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  choice: convoiter / les désirs
  rationale: Le verbe, dans l’allusion au commandement, est rendu par « convoiter », formulation française naturelle du précepte; le nom pluriel désigne plus largement les désirs, d’où « les désirs ».
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans l’argument philosophique de 4 Maccabées, λογισμός désigne la faculté rationnelle qui gouverne les passions.
- source_word: κρατεῖν
  choice: maîtriser
  rationale: Exprime l’idée de dominer ou tenir sous contrôle sans suggérer nécessairement la suppression complète.
- source_word: δικαιοσύνης
  choice: la justice
  rationale: Rendu direct et contextuellement approprié de δικαιοσύνη, qui désigne ici la conduite juste.
- source_word: τῶν κωλυτικῶν … παθῶν
  choice: les passions qui font obstacle
  rationale: Reproduit clairement la fonction entravante exprimée par l’adjectif κωλυτικός.
theological_decisions:
- issue: Portée du pouvoir de la raison sur les passions
  choice: « est capable de maîtriser »
  alternative: « domine » ou « supprime »
  rationale: Le grec δύναται … κρατεῖν affirme une capacité de maîtrise; il ne dit ni qu’elle s’exerce toujours effectivement ni que les passions sont abolies.
- issue: Lien entre le commandement de la Loi et l’argument rationnel
  choice: « puisque la Loi nous dit de ne pas convoiter »
  alternative: « quand la Loi nous a dit de ne pas désirer »
  rationale: Cette formulation garde le lien argumentatif et la valeur durable du commandement, sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français moderne, clair et soutenu. La répétition grecque entre le verbe ἐπιθυμεῖν et le nom ἐπιθυμιῶν est partiellement différenciée (« convoiter » / « désirs ») afin de conserver à la fois l’écho du commandement et la portée générale de l’argument. « À plus forte raison » rend idiomatiquement πολὺ πλέον.
