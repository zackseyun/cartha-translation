base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: fr
  text: '« Regarde, ma langue est brisée : coupe-la ! Car ce n’est pas ainsi que tu extirperas notre[a] jugement raisonné[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « notre jugement raisonné », et non « mon ». Ce pluriel peut exprimer la solidarité du martyr avec ses frères et leur résolution commune.
    reason: alternative_reading
  - marker: b
    text: Le verbe grec évoque littéralement le fait de couper la langue. Employé ici de façon figurée avec « jugement raisonné », il affirme que cette mutilation ne peut extirper leur résolution rationnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Regarde
  rationale: Interpellation directe et naturelle en français moderne, qui conserve la force déictique de l’interjection.
- source_word: κέχλασται
  choice: est brisée
  rationale: Le parfait exprime l’état présent résultant d’une violence déjà subie. « Est brisée » reste transparent sans préciser indûment la nature exacte des blessures.
- source_word: ἡ γλῶσσα
  choice: ma langue
  rationale: Le grec emploie l’article, mais le contexte désigne clairement la langue du locuteur ; le possessif est idiomatique en français.
- source_word: τέμνε
  choice: coupe-la
  rationale: L’impératif vise la langue qui vient d’être mentionnée. Le pronom explicite l’objet sans imposer nécessairement la nuance plus précise de « coupe-la entièrement ».
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: Car même ainsi, tu ne… pas
  rationale: 'Cette tournure française rend le moyen envisagé et son inefficacité emphatique : même en accomplissant cette mutilation, le persécuteur n’atteindra pas son but.'
- source_word: τὸν λογισμὸν
  choice: jugement raisonné
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de raisonner et la détermination morale qui gouverne les passions. « Jugement raisonné » conserve ces deux dimensions sans recourir à un jargon technique.
- source_word: ἡμῶν
  choice: notre
  rationale: Le texte grec transmis porte le pluriel. Celui-ci est conservé malgré le locuteur singulier, puisqu’il peut exprimer sa solidarité avec ses frères et leur résolution commune.
- source_word: γλωσσοτομήσεις
  choice: retrancheras
  rationale: Le composé évoque littéralement l’ablation de la langue, mais prend ici pour objet λογισμός. « Retrancheras » maintient l’image violente de l’excision tout en restant intelligible appliqué au jugement raisonné.
theological_decisions:
- issue: Sens de λογισμός dans le cadre philosophique et religieux de 4 Maccabées
  choice: jugement raisonné
  alternative: raison ; résolution rationnelle
  rationale: Le choix exprime à la fois l’activité rationnelle et la fermeté morale, sans réduire le terme à l’intellect abstrait ni introduire une terminologie doctrinale ultérieure.
- issue: Pluriel ἡμῶν dans la parole d’un locuteur singulier
  choice: notre jugement raisonné
  alternative: mon jugement raisonné
  rationale: Le pluriel de la source est préservé plutôt qu’harmonisé avec le contexte immédiat. Il peut marquer la solidarité du martyr avec ses frères, mais le texte ne l’explicite pas, d’où la note.
translation_notes:
  register: Français international moderne, direct et digne. La violence de l’image est conservée sans archaïsme. Le tutoiement correspond à l’adresse directe au persécuteur et le deux-points souligne le défi lancé après le constat.
