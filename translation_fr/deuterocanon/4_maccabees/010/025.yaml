base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
translation:
  language: fr
  text: Ou bien ne semble-t-il pas mauvais que nous rendions un culte au Créateur de toutes choses et que nous vivions selon sa loi vertueuse ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Ou bien ne trouvez-vous pas mauvais… ? » La question rhétorique grecque peut mettre en cause le jugement moral de l’adversaire.'
    reason: alternative lexicale et portée rhétorique
lexical_decisions:
- source_word: κακὸν
  choice: mauvais
  rationale: Le terme porte ici un jugement moral. « Mauvais » conserve cette portée tout en s’intégrant naturellement à la tournure « semble-t-il mauvais ».
- source_word: οὐ δοκεῖ
  choice: ne semble-t-il pas
  rationale: Cette traduction garde la formulation impersonnelle du grec et la force de la question rhétorique, sans ajouter explicitement un destinataire.
- source_word: τὸν πάντων κτίστην
  choice: le Créateur de toutes choses
  rationale: κτίστης désigne le créateur ou fondateur, et πάντων étend ici son œuvre à la totalité de ce qui existe. Cette expression est claire et digne en français.
- source_word: εὐσεβοῦμεν
  choice: nous rendions un culte
  rationale: Le verbe exprime la révérence pieuse envers une divinité. Avec le Créateur comme objet, « rendre un culte » communique précisément cette dévotion religieuse.
- source_word: κατὰ
  choice: selon
  rationale: Avec l’accusatif, κατά indique ici la conformité à une norme. « Selon » est direct et idiomatique.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: sa loi vertueuse
  rationale: ἔναρετος qualifie ce qui possède une excellence morale. « Vertueuse » préserve cette caractérisation éthique explicite de la loi, malgré son caractère légèrement marqué en français.
- source_word: ζῶμεν
  choice: nous vivions
  rationale: Le présent désigne ici la manière de mener sa vie. « Vivre selon » exprime naturellement cette conduite durable.
theological_decisions:
- issue: Référent et portée de la question rhétorique
  choice: La formulation demande s’il paraît mauvais d’adorer le Créateur et de vivre selon sa loi, sans nommer explicitement celui qui porte ce jugement.
  alternative: « Ou bien ne trouvez-vous pas mauvais… ? », qui explicite l’adversaire sous-entendu.
  rationale: Le grec ne contient aucun pronom explicite de deuxième personne. La tournure impersonnelle préserve cette donnée ainsi que la tension rhétorique, tandis que la note signale la lecture visant le jugement de l’adversaire.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « que nous » clarifie la coordination. « Loi vertueuse » est volontairement conservé pour rendre la qualification morale explicite du grec.
