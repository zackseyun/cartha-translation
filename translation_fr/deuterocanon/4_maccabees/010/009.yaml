lexical_decisions:
- source_word: μέλλων
  choice: Comme il était sur le point de
  rationale: Le participe de μέλλω exprime ici l’imminence et a une valeur circonstancielle temporelle. Cette tournure naturelle en français conserve le lien avec le verbe principal.
- source_word: ἀποθνήσκειν
  choice: mourir
  rationale: L’infinitif signifie simplement « mourir ». Bien que le contexte soit celui d’une mise à mort, la proposition ne précise pas elle-même l’agent; il convient donc de ne pas l’expliciter.
- source_word: ἔφη
  choice: il dit
  rationale: Verbe introducteur de discours courant, rendu de façon naturelle et digne en français moderne.
- source_word: δὲ
  choice: Comme
  rationale: La particule δέ fait légèrement progresser le récit. En français, son rôle de liaison est suffisamment porté par la proposition circonstancielle initiale; ajouter « et » alourdirait la phrase.
