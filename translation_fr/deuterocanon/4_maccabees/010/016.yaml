base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: fr
  text: 'Vas-y, tyran : inflige-moi tes tortures, afin que, même par elles, tu apprennes que je suis le frère de ceux qui ont été torturés avant moi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ceux qui ont été torturés auparavant ». Le participe grec indique qu’ils ont subi la torture avant celui qui parle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπιθι
  choice: Vas-y
  rationale: L’impératif constitue ici un défi lancé au tyran. « Vas-y » restitue naturellement en français moderne cette provocation résolue.
- source_word: τύραννε
  choice: tyran
  rationale: Le vocatif direct conserve à la fois la désignation politique et la condamnation morale du terme grec.
- source_word: βασάνοις
  choice: avec tes tortures
  rationale: Le datif désigne ici les moyens ou actes de torture. Le possessif, implicite dans l’adresse au tyran, rend la tournure idiomatique sans modifier le référent.
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: afin que, même par elles, tu apprennes
  rationale: « Afin que » marque le but; « même » rend la valeur emphatique de καί, et « par elles » présente les tortures comme le moyen de cette prise de conscience.
- source_word: ἀδελφός
  choice: le frère
  rationale: Le masculin singulier est maintenu dans ce contexte familial où le locuteur s’identifie à ses frères déjà torturés. L’article défini est idiomatique en français avec le complément qui suit.
- source_word: τῶν προβασανισθέντων
  choice: de ceux qui ont été torturés avant moi
  rationale: Le participe passif avec le préfixe προ- exprime l’antériorité. « Avant moi » explicite naturellement le repère temporel fourni par le locuteur.
theological_decisions:
- issue: Terme de parenté masculin ἀδελφός dans le récit du martyre familial
  choice: le frère
  alternative: l’un des enfants de la même famille
  rationale: Le grec est explicitement masculin singulier et le contexte présente un homme affirmant sa solidarité familiale avec les frères torturés avant lui; une neutralisation ferait perdre cette précision.
translation_notes:
  register: Français international moderne, direct et digne. « Vas-y » garde la force provocatrice de l’impératif sans devenir familier au point de banaliser la scène; la syntaxe demeure claire et proche du grec.
