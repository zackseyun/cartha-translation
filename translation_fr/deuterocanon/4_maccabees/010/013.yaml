  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: fr
  text: « Ne sombre pas, toi aussi, dans la même folie que tes frères ; laisse-toi plutôt convaincre par le roi et sauve-toi. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανῇς … τὴν αὐτὴν μανίαν
  choice: sombre … dans la même folie
  rationale: Le grec associe le verbe « devenir fou » au nom apparenté « folie ». Cette formulation française naturelle conserve l’insistance de cette répétition sans produire une tournure artificielle.
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: laisse-toi plutôt convaincre par le roi
  rationale: Le participe passif de πείθω peut évoquer le fait de se laisser persuader ou d’obéir. « Laisse-toi convaincre » respecte ici la forme passive et préserve cette nuance sans réduire le sens à la seule obéissance.
- source_word: σῶζε σεαυτόν
  choice: sauve-toi
  rationale: Impératif direct et idiomatique, correspondant exactement à l’appel à préserver sa propre vie.
