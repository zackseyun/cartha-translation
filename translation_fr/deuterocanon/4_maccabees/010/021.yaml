  verdict: revise
  source_fidelity: 'La menace conserve correctement Dieu comme sujet de μετελεύσεται et l’image de la poursuite divine. « Sans tarder » est possible, mais « rapidement » rend plus directement la valeur adverbiale de ταχέως. Surtout, ἐκτέμνεις désigne l’action de couper ou retrancher : « arraches » peut décrire l’ablation, mais ne restitue pas explicitement la coupe exprimée par le verbe grec.'
  naturalness: La formulation révisée est directe et naturelle en français moderne. « La langue qui chante les hymnes divins » évite la redondance un peu lourde de « chante les mélodies des hymnes », tout en gardant la fonction chantante de μελῳδόν.
