  issues:
  - severity: medium
    issue: « tu arraches » pour ἐκτέμνεις
    rationale: Le grec ἐκτέμνω signifie littéralement couper/trancher hors de, dans ce contexte couper la langue. « Arracher » change le mode concret de mutilation et ne rend pas la composante de coupe.
  - severity: low
    issue: « les mélodies des hymnes divins » pour μελῳδὸν ... τῶν θείων ὕμνων
    rationale: La formulation française est intelligible, mais elle introduit une redondance (« chante les mélodies des hymnes »). Le grec qualifie la langue comme musicale ou chantante en rapport avec les hymnes divins; « la langue qui chante les hymnes divins » le rend plus naturellement.
