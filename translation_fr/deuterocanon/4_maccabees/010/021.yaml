  yaml_path: translation/deuterocanon/4_maccabees/010/021.yaml
  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
translation:
  language: fr
  text: Mais Dieu te poursuivra rapidement[a], car tu coupes la langue qui chante les hymnes divins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu te punira rapidement » ou « Dieu viendra rapidement à ta poursuite ». Le verbe grec évoque le fait d’aller après quelqu’un ou de le poursuivre, ici dans un contexte de jugement divin.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: sans tarder
  rationale: Rend la rapidité de l’intervention divine sans réduire l’adverbe à la seule idée d’un moment futur proche.
- source_word: μετελεύσεται
  choice: te poursuivra
  rationale: Le moyen futur de μετέρχομαι peut signifier aller après quelqu’un ou le poursuivre. Dans cette menace, le jugement est implicite, mais l’image de la poursuite reste explicite.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction directe du sujet grec.
- source_word: τὴν ... γλῶτταν
  choice: la langue
  rationale: Conserve la réalité physique et violente de la mutilation décrite.
- source_word: τῶν θείων ὕμνων
  choice: des hymnes divins
  rationale: Préserve le caractère élevé de l’expression grecque et le lien adjectival entre θείων et ὕμνων.
- source_word: μελῳδόν
  choice: qui chante les mélodies
  rationale: Déploie naturellement en français l’adjectif grec qualifiant la langue comme productrice de chant mélodieux.
- source_word: ἐκτέμνεις
  choice: tu arraches
  rationale: Dans le contexte de l’ablation de la langue, « arracher » exprime naturellement et avec force l’action présente, sans l’atténuer.
theological_decisions:
- issue: Portée de la rétribution divine dans μετελεύσεται ὁ θεός
  choice: Dieu poursuivra le persécuteur
  alternative: Dieu te punira sans tarder ; Dieu se lancera sans tarder à ta poursuite
  rationale: Le contexte implique un jugement punitif, mais le texte principal conserve l’image grecque de Dieu allant après le tyran au lieu de la remplacer par la notion plus abstraite de punition.
translation_notes:
  register: Français moderne, digne et direct. La violence concrète de la scène ainsi que l’expression poétique sur la langue qui chante sont conservées ; l’ambiguïté entre poursuite et punition est signalée en note.
