lexical_decisions:
- source_word: περίειλκον
  choice: ils leur arrachaient
  rationale: L’imparfait décrit une action violente en cours ou répétée dans cette scène de torture. « Arracher » exprime naturellement en français l’enlèvement forcé de membres ou de parties du corps, sans préciser davantage le procédé.
- source_word: δακτύλους
  choice: les doigts
  rationale: Sens anatomique courant et direct.
- source_word: βραχίονας
  choice: les bras
  rationale: « Bras » est le sens usuel et la formulation la plus naturelle, même si le terme peut parfois désigner plus précisément une partie du bras.
- source_word: σκέλη
  choice: les jambes
  rationale: Équivalent anatomique courant en français moderne; « tibias » ou « jarrets » seraient trop précis ou moins naturels.
- source_word: ἀγκῶνας
  choice: les coudes
  rationale: Le terme désigne couramment les coudes ou l’articulation du bras. « Coudes » conserve l’énumération concrète et saisissante du grec.
