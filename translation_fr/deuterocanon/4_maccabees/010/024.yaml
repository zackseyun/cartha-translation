  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
translation:
  language: fr
  text: « Ô homme odieux, misanthrope, qu’avons-nous fait pour que tu nous aies exposés de cette façon[a] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « ayant fait quoi ? » Le participe pluriel se rapporte à « nous ». Le verbe peut aussi signifier « présenter » ou « placer devant » ; « exposer » convient au contexte.'
    reason: syntax_and_lexical_alternative
lexical_decisions:
- source_word: μισάρετε
  choice: homme odieux
  rationale: Le vocatif exprime une vive réprobation. « Homme odieux » restitue l’injure avec force dans un français naturel, sans lui donner artificiellement une valeur superlative.
- source_word: μισάνθρωπε
  choice: ennemi des humains
  rationale: Le composé désigne littéralement quelqu’un qui hait les êtres humains. « Ennemi des humains » est plus immédiatement compréhensible que « misanthrope » et conserve la portée accusatrice du vocatif.
- source_word: τί δρῶντες
  choice: qu’avons-nous fait
  rationale: 'Le participe présent au nominatif pluriel se rapporte logiquement aux personnes désignées par ἡμᾶς : « nous, ayant fait quoi ? » Il ne décrit donc pas l’action de l’interlocuteur singulier. La tournure française exprime naturellement cette demande de motif.'
- source_word: ἡμᾶς
  choice: nous
  rationale: Pronom de la première personne du pluriel, objet de προθεῖς et référent logique du participe pluriel δρῶντες.
- source_word: προθεῖς
  choice: tu nous exposes
  rationale: Le participe aoriste de προτίθημι signifie « placer devant », « présenter » ou, dans ce contexte de persécution, « exposer ». Le présent français s’intègre naturellement à la question portant sur la conduite en cours, tandis que la note signale la variante plus formelle.
- source_word: τοῦτον τὸν τρόπον
  choice: ainsi
  rationale: 'Cette expression indique la manière : « de cette façon ». « Ainsi » est concis, naturel et fidèle.'
