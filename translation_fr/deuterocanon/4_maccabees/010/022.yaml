  text: I am not about to refuse[a], tyrant, the torture for the sake of virtue.
translation:
  language: fr
  text: Je n’ai pas l’intention, tyran, de me dérober à la torture pour la vertu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Je ne refuserai pas, tyran, la torture pour la vertu. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Je ne compte pas
  rationale: Avec l’infinitif, μέλλω peut exprimer l’intention ou l’imminence. « Je ne compte pas » rend ici la détermination présente et tournée vers l’avenir, sans réduire l’expression à un simple futur.
- source_word: τύραννε
  choice: tyran
  rationale: Le vocatif interpelle directement le souverain persécuteur par un terme moralement chargé; « tyran » est l’équivalent français naturel et transparent.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: me dérober à la torture
  rationale: βασανισμός désigne la torture ou un tourment sévère. Avec παραιτεῖσθαι et πρὸς, la tournure française « se dérober à la torture » exprime naturellement le refus d’éviter l’épreuve imminente.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: subie pour la vertu
  rationale: ὑπέρ indique ici la cause défendue ou le motif du supplice, tandis que ἀρετή désigne la vertu ou l’excellence morale. « Pour la vertu » conserve la concision et la portée éthique du grec.
- source_word: παραιτεῖσθαι
  choice: me dérober
  rationale: Le moyen peut signifier refuser, décliner ou chercher à éviter. Dans ce contexte, « me dérober » rend clairement la résolution de ne pas esquiver la torture.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’apostrophe accusatrice « tyran » et la tension entre l’épreuve imposée et l’adhésion volontaire du locuteur, sans préciser davantage le contenu de « la vertu ».
