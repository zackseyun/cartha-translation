  text: I will not renounce the noble kinship of our brotherhood[a].
translation:
  language: fr
  text: Je ne renierai pas le noble lien de parenté qui nous unit comme frères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne renierai pas la noble parenté de notre fraternité. »'
    reason: Alternative plus formelle qui reproduit plus directement la construction grecque, au prix d’une expression moins naturelle en français.
lexical_decisions:
- source_word: οὐκ ἐξόμνυμαι
  choice: Je ne renierai pas
  rationale: Le verbe moyen ἐξόμνυμαι peut signifier nier, désavouer, renier ou abjurer. Ici, « renier » exprime naturellement le refus de désavouer un lien familial, sans imposer l’idée explicite d’une formule de serment.
- source_word: τὴν ... συγγένειαν
  choice: le ... lien de parenté
  rationale: συγγένεια désigne la parenté ou le lien familial. « Lien de parenté » est idiomatique en français et fait ressortir la relation familiale concrète.
- source_word: εὐγενῆ
  choice: noble
  rationale: εὐγενής peut évoquer aussi bien la noblesse de naissance que la noblesse morale. « Noble » conserve cette amplitude.
- source_word: τῆς ἀδελφότητος
  choice: qui nous unit comme frères et sœur
  rationale: ἀδελφότης désigne ici la relation fraternelle au sein de la fratrie des martyrs. Cette formulation française rend le lien entre les membres de cette fratrie et tient compte de la présence de leur sœur, sans réduire le mot à une fraternité associative.
theological_decisions:
- issue: Portée familiale et genre de ἀδελφότης
  choice: frères et sœur
  alternative: fraternité / lien entre frères et sœur
  rationale: Dans le contexte immédiat, il s’agit d’une fratrie réelle comprenant des frères et leur sœur. La formulation explicite cette référence contextuelle sans transformer le terme en notion générale de camaraderie.
translation_notes:
  register: Français international moderne, digne et direct. « Renier » convient à la pression exercée pour faire désavouer la solidarité familiale; « lien de parenté » évite la lourdeur de « parenté de la fraternité ».
