  text: When bloodthirsty and murderous and most savage Antiochus heard these things[a], he ordered his tongue to be cut out.
translation:
  language: fr
  text: Après avoir entendu cela, Antiochos, assoiffé de sang, meurtrier et le plus cruel[a], ordonna qu’on lui coupe la langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un adjectif superlatif rare, que l’on pourrait aussi traduire par « extrêmement sauvage » ou « extrêmement féroce ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le neutre pluriel renvoie globalement aux propos qui précèdent. En français narratif, « cela » exprime naturellement cette reprise sans la limiter aux seules paroles.
- source_word: ἀκούσας
  choice: En entendant
  rationale: Le participe aoriste marque une action antérieure ou immédiatement circonstancielle; cette tournure temporelle est naturelle en français.
- source_word: αἱμοβόρος
  choice: assoiffé de sang
  rationale: Cette expression française courante conserve l’image forte du composé grec, qui dépeint Antiochos comme avide d’effusion de sang.
- source_word: φονώδης
  choice: meurtrier
  rationale: L’adjectif caractérise une disposition portée au meurtre; « meurtrier » est direct, intelligible et conserve la sévérité du grec.
- source_word: πανμμερώτατος
  choice: d’une cruauté extrême
  rationale: Cette formulation rend la valeur superlative de cet adjectif rare et s’intègre naturellement à la série de qualificatifs, tout en évitant le français peu idiomatique « le plus sauvage » sans terme de comparaison.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe désigne l’émission d’un ordre; « ordonna » convient au registre narratif et restitue sa force.
- source_word: τὴν γλῶτταν αὐτοῦ
  choice: lui … la langue
  rationale: La construction possessive grecque se rend naturellement en français par le pronom indirect « lui » avec l’article défini devant une partie du corps. Le pronom renvoie à la victime, non à Antiochos.
- source_word: ἐκτεμεῖν
  choice: qu’on … coupe
  rationale: L’infinitif signifie retrancher ou exciser. La tournure avec « qu’on » indique naturellement que l’ordre doit être exécuté par d’autres.
