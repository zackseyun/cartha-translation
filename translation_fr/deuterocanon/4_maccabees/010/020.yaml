review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien compris : ὑπὲρ τοῦ θεοῦ exprime la cause ou la loyauté (« Pour Dieu »), ἡδέως la disposition volontaire (« volontiers »), et ἀκρωτηριαζόμεθα une mutilation subie. Toutefois, « nous nous laissons ... mutiler » introduit plus explicitement une idée de consentement actif que le passif grec ne porte à lui seul ; cette idée est déjà suffisamment exprimée par ἡδέως.'
  naturalness: La formulation proposée est compréhensible, mais « se laisser mutiler les membres du corps » est lourde et peu idiomatique. Une construction avec « accepter que l’on nous mutile les membres » est plus naturelle en français moderne tout en conservant la volonté marquée par l’adverbe.
  terminology: « Pour Dieu » est une traduction sobre et fidèle de ὑπὲρ τοῦ θεοῦ dans ce contexte. « Membres » convient pour μέλη et « mutiler » rend correctement ἀκρωτηριάζω sans imposer l’idée plus forte de démembrement. Le possessif « nos » est requis par l’usage français et est implicitement porté par la première personne du pluriel.
  issues:
  - severity: medium
    issue: « Nous nous laissons ... mutiler » explicite indûment un consentement actif.
    rationale: Le grec emploie un passif (« nous sommes mutilés ») qualifié par ἡδέως (« volontiers »). La tournure réflexive française déplace légèrement l’énoncé vers l’autorisation donnée à un agent, plutôt que vers la mutilation endurée avec empressement.
  - severity: low
    issue: « les membres du corps » est peu naturel dans cette construction.
    rationale: En français, lorsque le possesseur est le sujet affecté, « nos membres » est plus idiomatique et ne modifie pas le sens.
  revised_text: Pour Dieu, nous acceptons volontiers que l’on nous mutile les membres.
