  text: For the sake of God[a], we gladly have the limbs of our body mutilated.
translation:
  language: fr
  text: Pour Dieu, nous acceptons volontiers que l’on nous mutile les membres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέως
  choice: volontiers
  rationale: L’adverbe exprime ici une disposition consentante et résolue. « Volontiers » est naturel en français et évite la nuance potentiellement déplacée de plaisir que pourrait suggérer « avec joie » dans ce contexte de torture.
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: pour Dieu
  rationale: Avec le génitif, ὑπέρ indique ici la cause ou la loyauté au nom de laquelle la souffrance est acceptée. « Pour Dieu » conserve la brièveté et l’ambiguïté légitime de l’expression grecque.
- source_word: τὰ τοῦ σώματος μέλη
  choice: les membres du corps
  rationale: μέλη désigne concrètement les membres corporels; la tournure française maintient l’article grec sans ajouter un possessif absent du texte.
- source_word: ἀκρωτηριαζόμεθα
  choice: nous nous laissons volontiers mutiler
  rationale: Le présent passif décrit les locuteurs subissant une mutilation. « Nous nous laissons… mutiler » rend à la fois le passif et l’acceptation volontaire exprimée par ἡδέως, sans imposer l’idée plus précise d’un démembrement complet.
theological_decisions:
- issue: Souffrance endurée pour Dieu dans le contexte du martyre
  choice: pour Dieu
  alternative: pour l’amour de Dieu / au nom de Dieu
  rationale: La traduction indique une souffrance acceptée par fidélité à Dieu, sans suggérer que les martyrs se substituent à Dieu ni introduire une doctrine ultérieure de représentation ou d’expiation.
translation_notes:
  register: Français moderne, sobre et digne. La phrase garde la force corporelle du grec et son affirmation collective au présent, tout en évitant une formulation artificielle ou excessivement clinique.
