  yaml_path: translation/deuterocanon/4_maccabees/010/002.yaml
  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: fr
  text: 'Mais il s’écria : « Ne savez-vous pas que le même père m’a semé avec ceux qui sont morts[a], que la même mère m’a mis au monde et que j’ai été élevé selon les mêmes principes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « m’a semé avec ceux qui sont morts ». Le grec emploie l’image des semailles pour parler de la génération par le père.
    reason: La métaphore est inhabituelle en français et peut nécessiter une clarification, tout en devant être conservée dans le texte.
lexical_decisions:
- source_word: ἀναβοήσας
  choice: s’écria
  rationale: Le participe exprime une prise de parole forte et soudaine ; « s’écria » en restitue naturellement l’intensité.
- source_word: ἀγνοεῖτε
  choice: Ne savez-vous pas
  rationale: Cette question rhétorique formule un reproche ; cette tournure est naturelle en français actuel sans durcir indûment le propos.
- source_word: αὐτός … πατήρ
  choice: le même père
  rationale: Dans le parallèle avec « la même mère », αὐτός souligne l’identité du père commun aux frères.
- source_word: τοῖς ἀποθανοῦσιν
  choice: avec ceux qui sont morts
  rationale: Le participe aoriste substantivé désigne ici ceux qui ont subi la mort, vraisemblablement les frères déjà exécutés ; « avec » rend l’association exprimée par le datif.
- source_word: ἔσπειρεν
  choice: m’a semé
  rationale: Le choix conserve l’image agricole explicite employée pour la génération humaine, malgré son caractère inhabituel en français.
- source_word: ἐγέννησεν
  choice: m’a mis au monde
  rationale: Cette expression française actuelle rend clairement l’action maternelle d’enfanter.
- source_word: ἀνετράφην
  choice: j’ai été élevé
  rationale: Le passif concerne la formation reçue pendant l’enfance et la jeunesse.
- source_word: ἐπὶ τοῖς αὐτοῖς δόγμασιν
  choice: selon les mêmes principes
  rationale: « Selon » rend l’idée de fondement normatif, et « principes » désigne ici les convictions communes qui ont façonné l’éducation des frères.
theological_decisions:
- issue: Portée de la métaphore ἔσπειρεν appliquée au père
  choice: Conserver littéralement « m’a semé » et expliquer l’image en note.
  alternative: « m’a engendré »
  rationale: La formulation grecque associe délibérément la génération paternelle à l’ensemencement. La conserver respecte l’image du texte sans la transformer en formulation doctrinale.
- issue: Référence temporelle de τοῖς ἀποθανοῦσιν
  choice: « ceux qui sont morts »
  alternative: « ceux qui doivent mourir » ou « les mortels »
  rationale: La forme grecque est un participe aoriste, non un participe présent, et renvoie naturellement aux frères déjà morts dans le contexte. Cette traduction évite d’élargir le propos à l’ensemble des mortels.
- issue: Sens de δόγμασιν
  choice: « principes »
  alternative: « enseignements » ou « prescriptions »
  rationale: Le contexte met l’accent sur une formation morale et religieuse commune. « Principes » conserve cette portée sans réduire le terme à des décrets juridiques ni lui imposer un sens dogmatique ultérieur.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « S’écria » évite la lourdeur de « cria et dit ». La tournure inhabituelle « m’a semé » est maintenue en raison de l’image grecque et accompagnée d’une note.
