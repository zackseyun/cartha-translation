  source_fidelity: Le projet rend correctement la question rhétorique, l’identité du père et de la mère, la métaphore agricole de ἔσπειρεν, ainsi que l’éducation fondée sur les mêmes δόγματα. Le participe aoriste τοῖς ἀποθανοῦσιν désigne bien « ceux qui sont morts »; il ne faut pas le niveler en « ceux qui meurent » comme le fait la piste anglaise. La formulation « avec ceux qui sont morts » conserve prudemment l’association exprimée par le datif.
