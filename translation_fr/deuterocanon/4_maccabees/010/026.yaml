  text: But these things from you are not worthy even of tortures,[a]
translation:
  language: fr
  text: Mais ces choses venant de vous ne sont pas dignes de tortures.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais ces choses de vous ne sont pas dignes de tortures. » Le grec ὑμῶν est elliptique ; il peut se comprendre comme « venant de vous », « de votre part » ou « qui sont à vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Introduit un contraste net avec ce qui précède ; « Mais » est ici la tournure française la plus naturelle et concise.
- source_word: ταῦτα
  choice: ce que vous faites
  rationale: Le démonstratif neutre pluriel désigne globalement les actes évoqués. Cette formulation française rend naturellement son association avec le génitif ὑμῶν, sans préciser davantage la nature de ces actes.
- source_word: ὑμῶν
  choice: vous faites
  rationale: 'Le génitif est idiomatique et condensé : il peut signifier « de votre part », « venant de vous » ou, dans ce contexte, « ce que vous faites ». L’ambiguïté est signalée en note.'
- source_word: βασάνων
  choice: torture
  rationale: Dans ce récit de martyre, βάσανος désigne la torture concrètement infligée, et non une simple détresse. Le français emploie naturellement le singulier collectif dans l’expression « le nom de torture ».
- source_word: ἄξια
  choice: ne mérite même pas le nom de
  rationale: ἄξια suivi du génitif signifie « digne de » ou « méritant ». La formulation idiomatique exprime ici que les sévices en question ne peuvent même pas être qualifiés de torture ; « même » explicite la force rhétorique du propos.
