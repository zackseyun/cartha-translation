- from: Mais moi, je me suis avancé de mon plein gré, afin qu’en me tuant moi aussi, tu sois passible, devant la justice céleste[a], d’un châtiment pour un plus grand nombre de méfaits.
  to: Mais moi, je me suis avancé de mon plein gré, afin qu’en me tuant moi aussi, tu encourres de la part de la justice céleste[a] un châtiment pour un plus grand nombre de méfaits.
  rationale: La révision remplace la construction maladroite « être passible, devant …, d’un châtiment » par « encourir de la part de … un châtiment ». Elle rend plus directement le verbe judiciaire grec ὀφλήσῃς et la fonction de τῇ οὐρανίᾳ δίκῃ, tout en préservant l’ambiguïté théologique et le sens comparatif de « pour un plus grand nombre de méfaits ».
