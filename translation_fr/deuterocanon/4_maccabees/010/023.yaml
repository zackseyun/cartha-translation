base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: fr
  text: Mais moi, je me suis avancé de mon plein gré, afin qu’en me tuant moi aussi, tu encourres de la part de la justice céleste[a] un châtiment pour un plus grand nombre de méfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice du ciel » ou « le jugement céleste ». Le grec ne nomme pas explicitement Dieu ici, mais évoque une justice transcendante associée au ciel.
    reason: Alternative lexicale et préservation de la retenue théologique du grec.
lexical_decisions:
- source_word: παρῆλθον
  choice: je me suis avancé
  rationale: Dans ce contexte, le locuteur se présente volontairement au tyran et à ses bourreaux. « Je me suis avancé » exprime ce mouvement délibéré sans retenir le sens contextuellement trompeur de « je suis passé ».
- source_word: ἀπʼ ἐμαυτοῦ
  choice: de mon plein gré
  rationale: Cette expression souligne que l’initiative vient du locuteur lui-même. « De mon plein gré » est naturel en français et marque clairement le caractère volontaire de l’acte.
- source_word: κατακτείνας
  choice: en me tuant
  rationale: Le participe aoriste exprime ici le moyen ou la circonstance liée au verbe principal. La tournure française « en me tuant » conserve ce rapport sans imposer une succession temporelle trop précise.
- source_word: ὀφλήσῃς
  choice: tu sois passible
  rationale: Dans ce cadre judiciaire, le verbe désigne le fait de devenir redevable ou exposé à une peine. « Être passible » rend cette responsabilité pénale de façon idiomatique.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: devant la justice céleste
  rationale: δίκη peut désigner la justice, le jugement ou la sanction. « Devant la justice céleste » préserve l’idée d’une autorité transcendante sans nommer explicitement Dieu.
- source_word: τιμωρίαν
  choice: un châtiment
  rationale: Le terme désigne une conséquence punitive. « Châtiment » convient au registre solennel du passage et conserve sa force judiciaire et morale.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: pour un plus grand nombre de méfaits
  rationale: ἀδίκημα désigne un acte injuste ou une faute, tandis que πλειόνων évoque ici l’accumulation des infractions. La traduction garde cette valeur comparative et le ton moral et judiciaire.
theological_decisions:
- issue: Traduction de τῇ οὐρανίᾳ δίκῃ dans un contexte de jugement moral transcendant
  choice: la justice céleste
  alternative: la justice du ciel ; le jugement céleste ; la justice divine
  rationale: Le grec renvoie à une justice liée au ciel sans nommer explicitement Dieu. « Justice céleste » respecte cette retenue et laisse subsister la personnification ou l’abstraction de δίκη, tandis que « justice divine » expliciterait davantage que le texte source.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant le ton judiciaire et solennel du discours. Le redoublement emphatique de αὐτός et ἀπʼ ἐμαυτοῦ est rendu par « Mais moi » et « de mon plein gré ».
