  text: if indeed you had human feelings, and had hope from God for deliverance.
translation:
  language: fr
  text: si vraiment tu avais des sentiments humains[a] et si tu espérais une délivrance de la part de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des aspirations humaines » ou « des attachements humains ». L’expression grecque, très resserrée, évoque la sensibilité et les liens affectifs ordinaires des êtres humains.
    reason: lexical_alternative
  - marker: b
    text: Ou « le salut ». Le mot grec peut désigner aussi bien une délivrance immédiate qu’un salut de portée plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: si vraiment
  rationale: La particule renforce la condition. « Si vraiment » conserve la portée rhétorique sans transformer la proposition en affirmation causale.
- source_word: ἠσθάνου
  choice: tu étais sensible
  rationale: Le verbe αἰσθάνομαι exprime ici la perception ou la sensibilité. Cette tournure française convient à l’appel affectif formulé avec πόθων.
- source_word: ἀνθρώπους πόθων
  choice: aux affections humaines
  rationale: L’expression grecque transmise est très resserrée et présente une difficulté de forme; le contexte appelle l’idée d’attachements ou de sentiments propres aux êtres humains. « Affections humaines » garde cette dimension affective sans la réduire à de simples émotions passagères.
- source_word: ἐλπίδα
  choice: l’espoir
  rationale: « Espoir » est naturel dans cette phrase et rend l’attente confiante exprimée par ἐλπίς.
- source_word: παρὰ θεῷ
  choice: venant de Dieu
  rationale: La construction avec παρά et le datif peut marquer la relation ou la proximité auprès de Dieu. Dans ce contexte, le français exprime naturellement Dieu comme la source attendue de la délivrance, sans exclure l’idée d’un espoir placé en lui.
- source_word: σωτηρίου
  choice: d’une délivrance
  rationale: Le terme peut désigner le salut ou une délivrance concrète. « Délivrance » convient à la menace immédiate de souffrance et de mort tout en laissant la portée plus large être signalée en note.
theological_decisions:
- issue: Portée de σωτηρίου dans le contexte du martyre
  choice: d’une délivrance
  alternative: du salut
  rationale: Le contexte immédiat évoque le secours face aux souffrances et à la mort, mais le mot grec peut aussi porter une signification plus large. Le texte retient « délivrance » et la note préserve l’autre possibilité.
- issue: Relation exprimée par παρὰ θεῷ
  choice: venant de Dieu
  alternative: auprès de Dieu / en Dieu
  rationale: La préposition autorise plusieurs nuances relationnelles. La traduction choisie s’accorde avec l’attente d’un secours divin sans imposer une formulation doctrinale plus précise que le grec.
translation_notes:
  register: Français international moderne, digne et direct. La phrase garde la force conditionnelle de l’interpellation. « Affections humaines » est employé au sens d’attachements et de sentiments humains, non au sens médical.
