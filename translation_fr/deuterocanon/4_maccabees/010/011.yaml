  text: But because of your ungodliness and blood-guilt[a], you will endure unending torments.
translation:
  language: fr
  text: Mais toi, à cause de ton impiété et de tes crimes de sang[a], tu endureras des tourments sans fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « culpabilité du sang » ou « meurtres qui souillent ». Le terme grec associe le sang versé au caractère souillant du meurtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσέβειαν
  choice: impiété
  rationale: Le terme désigne un manque de respect envers Dieu et une conduite contraire à la piété. « Impiété » conserve clairement cette portée religieuse et morale en français.
- source_word: μιαιφονίαν
  choice: crimes de sang
  rationale: Cette expression française naturelle évoque les meurtres et le sang versé, tout en permettant à la note de conserver la nuance de souillure portée par le composé grec.
- source_word: ἀκαταλύτους
  choice: sans fin
  rationale: L’adjectif qualifie ce qui ne peut être aboli ni mené à son terme. Avec « tourments », « sans fin » exprime clairement leur caractère interminable sans déplacer l’accent vers leur seule intensité.
- source_word: καρτερήσεις
  choice: tu endureras
  rationale: Le futur de καρτερέω exprime ici le fait de supporter durablement une épreuve. « Tu endureras » en conserve la force et la valeur temporelle.
- source_word: βασάνους
  choice: tourments
  rationale: Dans ce contexte, le mot désigne de graves souffrances infligées. « Tourments » en préserve la sévérité sans réduire nécessairement le sens à la torture physique.
theological_decisions:
- issue: Portée morale et religieuse de l’accusation adressée au tyran
  choice: « impiété » et « crimes de sang »
  alternative: « absence de piété » et « meurtres qui souillent »
  rationale: La formulation retenue maintient à la fois l’offense envers Dieu et la gravité du sang versé. La note explicite la nuance de souillure sans alourdir ni résoudre abusivement le texte principal.
- issue: Durée des tourments
  choice: « tourments sans fin »
  alternative: « tourments incessants »
  rationale: Le grec décrit des tourments qui ne sont pas abolis ou menés à leur terme. « Sans fin » rend directement cette valeur, tandis qu’« incessants » pourrait surtout suggérer l’absence d’interruption.
translation_notes:
  register: Français international moderne, direct et digne. L’apostrophe « Mais toi » conserve l’emphase du pronom grec. « Crimes de sang » reste compréhensible au grand public tout en gardant un registre solennel adapté au contexte.
