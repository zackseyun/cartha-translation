lexical_decisions:
- source_word: τούτου
  choice: celui-ci
  rationale: Le démonstratif renvoie au frère mentionné juste avant et conserve la valeur déictique du grec.
- source_word: θανόντος
  choice: Après que celui-ci fut mort
  rationale: Le participe aoriste dans un génitif absolu marque une action achevée antérieure à la suivante.
- source_word: ἀδελφοπρεπῶς
  choice: d’une manière digne de ses frères
  rationale: Cette formulation rend l’idée rare d’une mort qui convient à l’un de ces frères et qui est à la hauteur de leur conduite, sans réduire le terme au simple sens de « fraternellement ».
- source_word: τὸν τέταρτον
  choice: le quatrième
  rationale: Comme en grec, le nom « frère » reste implicite, le contexte indiquant clairement qu’il s’agit du quatrième frère.
- source_word: ἐπεσπῶντο
  choice: ils traînèrent en avant
  rationale: Le verbe exprime un mouvement imposé vers l’avant; « traînèrent » en restitue la contrainte physique.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit les paroles qui suivent et maintient le lien syntaxique avec l’action principale.
