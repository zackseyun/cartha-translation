  text: And when this one had died in a manner worthy of his brothers[a], they dragged forward the fourth, saying,
translation:
  language: fr
  text: 'Quand celui-ci eut trouvé une mort digne de ses frères[a], ils traînèrent le quatrième devant eux, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
