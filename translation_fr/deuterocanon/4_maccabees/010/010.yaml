  yaml_path: translation/deuterocanon/4_maccabees/010/010.yaml
  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: fr
  text: Quant à nous, ô tyran le plus impur qui soit, nous souffrons tout cela à cause de la formation et de la vertu de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de la formation et de la vertu qui viennent de Dieu » ou « à cause d’une formation et d’une vertu selon Dieu ». Le grec place « de Dieu » après les deux noms et peut qualifier l’un et l’autre.'
    reason: ambiguïté du génitif θεοῦ
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: Quant à nous
  rationale: Cette tournure française marque naturellement la mise en contraste portée par μέν, sans inventer le second terme du contraste.
- source_word: ὦ μιαρώτατε τύραννε
  choice: ô tyran impur entre tous
  rationale: μιαρώτατε est un superlatif évoquant la souillure ou l’impureté, notamment morale et religieuse. « Impur entre tous » conserve cette nuance ainsi que la force de l’invective.
- source_word: διὰ παιδείαν
  choice: à cause de la formation
  rationale: Avec l’accusatif, διά exprime ici le motif ou la cause. παιδεία désigne une éducation formatrice, une discipline ou un entraînement moral; « formation » convient au contexte sans se limiter à l’instruction scolaire.
- source_word: καὶ ἀρετὴν
  choice: et de la vertu
  rationale: ἀρετή désigne ici la vertu ou l’excellence morale; « vertu » est précis, concis et adapté au registre éthique du passage.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est conservé explicitement afin de ne pas trancher silencieusement entre l’appartenance, l’origine et la qualification par rapport à Dieu.
- source_word: ταῦτα πάσχομεν
  choice: nous souffrons tout cela
  rationale: La formulation rend directement πάσχομεν et le démonstratif pluriel ταῦτα, qui renvoie aux supplices subis.
theological_decisions:
- issue: Rapport de θεοῦ avec παιδείαν καὶ ἀρετήν
  choice: Conserver « de Dieu » après les deux noms coordonnés.
  alternative: « à cause de la formation et de la vertu qui viennent de Dieu » ou « à cause d’une formation et d’une vertu selon Dieu »
  rationale: 'Le génitif postposé peut porter sur les deux noms et exprimer divers rapports: appartenance, origine ou caractérisation. La traduction principale préserve cette tension, tandis que la note signale les principales compréhensions possibles sans imposer une lecture doctrinale.'
translation_notes:
  register: Français moderne, digne et accessible. « Ô » maintient l’adresse solennelle et véhémente; « impur entre tous » conserve la connotation de souillure de μιαρώτατε sans réduire l’expression au sens général d’« abject ».
