base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: fr
  text: Par la mort bienheureuse de mes frères, par la destruction éternelle du tyran et par la vie sans fin des pieux[a], je ne renierai pas la noble fraternité qui m’unit à mes frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des personnes pieuses ». Le grec désigne ceux qui vivent dans la piété et le respect de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « la noble fraternité ». Dans le contexte, cette expression désigne le lien du locuteur avec ses frères.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: J’en jure par
  rationale: Avec l’accusatif, μὰ introduit une formule solennelle de serment. « J’en jure par » en restitue clairement la force en français actuel.
- source_word: μακάριον ... θάνατον
  choice: mort bienheureuse
  rationale: μακάριος exprime ici une condition bénie et honorable, et non un simple bonheur subjectif.
- source_word: τῶν ἀδελφῶν μου
  choice: de mes frères
  rationale: Le masculin grec et le contexte désignent les frères du locuteur.
- source_word: αἰώνιον ... ὄλεθρον
  choice: perdition éternelle
  rationale: ὄλεθρος désigne la destruction, la ruine ou la perdition. « Perdition » convient au contraste eschatologique avec la vie, sans en préciser davantage la nature.
- source_word: ἀΐδιον ... βίον
  choice: vie sans fin
  rationale: ἀΐδιος exprime une durée perpétuelle. « Sans fin » conserve cette idée tout en distinguant en français les deux adjectifs grecs proches, αἰώνιος et ἀΐδιος.
- source_word: τῶν εὐσεβῶν
  choice: des hommes pieux
  rationale: εὐσεβής désigne ceux qui manifestent respect et piété envers Dieu. « Hommes pieux » est direct, intelligible et adapté au registre du passage.
- source_word: οὐκ ἀρνήσομαι
  choice: je ne renierai pas
  rationale: ἀρνέομαι peut signifier nier, désavouer ou renier. Ici, le locuteur refuse de désavouer sa solidarité fraternelle.
- source_word: τὴν εὐγένῃ ἀδελφότητα
  choice: le noble lien fraternel qui m’unit à eux
  rationale: ἀδελφότης exprime la fraternité ou le lien entre frères, tandis que εὐγενής évoque la noblesse de naissance ou de caractère. Cette formulation évite que « fraternité » soit comprise comme une organisation et explicite seulement la relation déjà donnée par le contexte.
theological_decisions:
- issue: Contraste eschatologique entre le tyran et les hommes pieux
  choice: Conserver directement la perdition éternelle du tyran et la vie sans fin des hommes pieux.
  alternative: Comprendre le contraste comme une simple opposition morale, ou l’expliciter selon un système doctrinal détaillé de récompense et de châtiment après la mort.
  rationale: Le grec affirme un contraste durable entre ὄλεθρος αἰώνιος et βίος ἀΐδιος, mais n’en décrit pas ici les modalités. La traduction maintient cette tension sans l’atténuer ni la développer.
translation_notes:
  register: Français moderne, solennel et accessible. La formule initiale conserve le caractère de serment. « Perdition éternelle » et « vie sans fin » rendent les deux adjectifs grecs de durée, proches mais distincts, sans imposer une différence doctrinale précise.
