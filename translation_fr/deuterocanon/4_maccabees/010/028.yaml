  yaml_path: translation/deuterocanon/4_maccabees/010/028.yaml
  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
translation:
  language: fr
  text: 'Regarde maintenant : toi qui es étranger à Dieu[a], tu fais la guerre à ceux qui font preuve de piété envers Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éloigné de Dieu » ; littéralement « étant étranger à Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui agissent avec piété envers Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ἰδὲ
  choice: Regarde maintenant
  rationale: L’impératif ἰδέ appelle vivement l’attention, tandis que νῦν situe l’interpellation dans l’immédiat. Cette formulation conserve le ton direct sans archaïsme.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: toi qui es étranger à Dieu
  rationale: ἀλλότριος suivi du génitif exprime le fait d’être étranger à quelqu’un, de ne pas lui appartenir. La proposition relative rend naturellement en français la valeur circonstancielle du participe ὢν sans définir davantage la nature de cet éloignement.
- source_word: πολεμεῖς
  choice: tu fais la guerre à
  rationale: Le verbe désigne une hostilité assimilée à la guerre. « Faire la guerre à » en garde l’image et la force, plus nettement que le simple verbe « combattre ».
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  choice: ceux qui font preuve de piété envers Dieu
  rationale: Le participe εὐσεβοῦντας décrit une conduite pieuse ou révérencieuse, et εἰς τὸν θεόν en indique l’orientation. La traduction conserve cette construction sans réduire la piété au seul culte.
theological_decisions:
- issue: Portée relationnelle de ἀλλότριος θεοῦ
  choice: étranger à Dieu
  alternative: éloigné de Dieu
  rationale: « Étranger à Dieu » suit de près l’expression grecque et maintient sa tension relationnelle et théologique. « Éloigné » serait plus idiomatique, mais atténuerait l’idée de non-appartenance portée par ἀλλότριος.
- issue: Nature de la piété exprimée par εὐσεβοῦντας
  choice: font preuve de piété envers Dieu
  alternative: adorent Dieu avec respect
  rationale: Le grec décrit plus largement une conduite pieuse envers Dieu et ne désigne pas nécessairement un acte cultuel précis. La formulation retenue évite donc d’ajouter la notion plus particulière d’adoration.
translation_notes:
  register: Français moderne, direct et digne. L’adresse à la deuxième personne et l’image guerrière conservent la vigueur accusatrice du grec ; la formulation de la piété reste volontairement large.
