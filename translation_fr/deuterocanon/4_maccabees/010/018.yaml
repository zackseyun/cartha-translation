  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
translation:
  language: fr
  text: 'Mais il dit : « Même si tu m’enlèves l’organe de la parole[a], Dieu entend ceux qui gardent le silence. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’instrument de la voix ». L’expression désigne probablement l’organe ou les organes corporels qui servent à parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: Même si tu m’enlèves
  rationale: Κἂν (καὶ ἐάν) introduit ici une concession, rendue naturellement par « même si ». Le contexte et la deuxième personne permettent d’expliciter en français le bénéficiaire implicite de l’action par « m’ ».
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: l’organe de la parole
  rationale: ὄργανον désigne un instrument ou un organe, et φωνή la voix ou l’expression vocale. Cette formulation conserve l’image corporelle sans identifier plus précisément la langue ou l’appareil vocal.
- source_word: σιωπώντων
  choice: ceux qui gardent le silence
  rationale: Le participe présent substantivé exprime des personnes qui se taisent ou demeurent silencieuses. « Gardent le silence » est naturel et maintient l’aspect duratif.
- source_word: ἀκούει
  choice: entend
  rationale: Le sens direct d’ἀκούω est conservé. Le paradoxe selon lequel Dieu entend des personnes silencieuses demeure intact.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Équivalent français usuel du sujet grec.
theological_decisions:
- issue: Dieu entend-il les personnes silencieuses ou leurs prières inexprimées ?
  choice: Dieu entend ceux qui gardent le silence
  alternative: Dieu entend les prières silencieuses
  rationale: Le grec nomme les personnes qui se taisent, non leurs prières. La traduction ne précise donc pas ce qui n’est qu’une implication possible.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond au singulier ἀφέλῃς dans cette adresse personnelle. La métaphore corporelle et le paradoxe final sont préservés.
