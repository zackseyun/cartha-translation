  source_fidelity: La traduction rend bien l’opposition σῶμα/ψυχή et le caractère concret de κολαστήριον. Toutefois, « il répondit » n’est pas exprimé dans le grec de ce verset et constitue un ajout narratif. De plus, « vous ne pourriez pas l’atteindre » affaiblit et reformule le futur négatif ἅψεσθε ; « vous ne la toucherez pas » est plus direct et plus proche du texte.
  naturalness: « En réponse à cela » est naturel en français moderne sans introduire un verbe narratif absent. « Appliquez-le à mon corps » est idiomatique dans le contexte d’un instrument de supplice. La reprise pronominale « la » renvoie clairement à « mon âme ».
  terminology: « Instrument de supplice », « corps » et « âme » sont appropriés. La note conservant « vie » comme possibilité pour ψυχή préserve l’ambiguïté lexicale sans effacer le contraste explicite avec le corps. « Toucher » rend sobrement ἅπτεσθαι et évite de surinterpréter l’inaccessibilité de l’âme.
