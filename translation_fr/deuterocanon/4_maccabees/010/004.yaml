  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: fr
  text: 'En réponse à cela : « Si vous avez quelque instrument de supplice, appliquez-le à mon corps ; car mon âme[a], même si vous le voulez, vous ne la toucherez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie ». Le grec ψυχή peut désigner la vie ou l’âme ; « âme » souligne ici son opposition au corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: À cela, il répondit
  rationale: L’expression introduit ici une réplique. L’ajout explicite de « il répondit » rend naturellement en français la fonction discursive du grec sans modifier le contenu de la réponse.
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: Si vous avez quelque instrument de supplice
  rationale: κολαστήριον désigne concrètement un moyen ou instrument servant à punir ou torturer. « Instrument de supplice » convient au contexte du martyre et évite le caractère trop abstrait de « châtiment ».
- source_word: προσαγάγετε τῷ σώματί μου
  choice: appliquez-le à mon corps
  rationale: Le verbe ordonne de faire porter l’instrument sur le corps. « Appliquez-le à » exprime clairement cette mise en œuvre en français actuel.
- source_word: τῆς γὰρ ψυχῆς μου
  choice: car mon âme
  rationale: ψυχή peut signifier « vie » ou « âme », mais son opposition explicite à σῶμα, « corps », favorise ici « âme » tout en laissant l’autre possibilité en note.
- source_word: οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: même si vous le vouliez, vous ne pourriez pas l’atteindre
  rationale: La tournure française exprime la concession et l’impossibilité affirmée. « Atteindre » rend ἅπτομαι de façon naturelle lorsqu’il s’agit d’une âme soustraite au pouvoir des persécuteurs.
theological_decisions:
- issue: Sens de ψυχή dans son opposition à σῶμα
  choice: âme
  alternative: vie
  rationale: « Âme » conserve la distinction anthropologique marquée entre ce qui peut subir les supplices corporels et ce que les persécuteurs ne peuvent atteindre. Une note maintient l’ambiguïté lexicale réelle de ψυχή.
- issue: Modalité de οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: même si vous le vouliez, vous ne pourriez pas l’atteindre
  alternative: même si vous le voulez, vous ne l’atteindrez pas
  rationale: Le conditionnel français rend idiomatiquement l’impossibilité associée à la concession, sans préciser la source ou la nature théologique de cette inviolabilité.
translation_notes:
  register: Français international moderne, solennel mais direct. La formulation garde la vigueur provocatrice du martyr et l’opposition structurante entre le corps et l’âme, sans ajouter d’explication confessionnelle.
