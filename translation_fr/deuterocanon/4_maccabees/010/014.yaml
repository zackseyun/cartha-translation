  yaml_path: translation/deuterocanon/4_maccabees/010/014.yaml
  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: fr
  text: 'Mais il leur dit : « Le feu que vous dirigez contre moi n’est pas assez brûlant pour me faire céder par lâcheté[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faire de moi un lâche ». Le verbe grec peut aussi évoquer étymologiquement l’idée d’agir sans la vaillance attendue d’un homme.'
    reason: Alternative lexicale; la note conserve avec prudence la nuance étymologique possible sans la présenter comme le sens littéral du verbe.
lexical_decisions:
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: Mais il leur dit
  rationale: δέ introduit ici une réplique contrastée; « Mais » rend naturellement ce mouvement.
- source_word: καυστικώτερον
  choice: assez brûlant
  rationale: Dans la construction οὐχ οὕτω ... ὥστε, l’adjectif exprime un degré de chaleur insuffisant pour produire le résultat annoncé. « Pas assez brûlant pour » est idiomatique en français tout en conservant l’image concrète du feu.
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: le feu que vous dirigez contre moi
  rationale: Cette formulation conserve le feu littéral du supplice et la force hostile de κατʼ ἐμοῦ, sans laisser entendre que le feu serait une simple disposition intérieure.
- source_word: δειλανδρῆσαι
  choice: me faire agir en lâche
  rationale: Le verbe signifie rendre lâche ou amener quelqu’un à manquer de courage. Cette traduction garde la valeur causative et met l’accent sur la conduite sous la torture, sans reproduire inutilement la nuance étymologique genrée.
theological_decisions:
- issue: La nuance de δειλανδρῆσαι peut être rendue par la lâcheté ou, plus littéralement et étymologiquement, par un manque de virilité.
  choice: me faire agir en lâche
  alternative: faire de moi un lâche; me rendre lâche; me faire manquer de virilité
  rationale: Le contexte porte sur le courage moral du martyr. La formulation choisie exprime clairement l’enjeu sans transformer l’étymologie masculine du mot en affirmation doctrinale sur la masculinité; une note préserve toutefois cette nuance.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche du grec, tandis que « pas assez… pour » rend naturellement la construction de degré et de résultat.
