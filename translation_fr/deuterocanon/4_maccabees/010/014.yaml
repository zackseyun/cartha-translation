    text: 'Ou : « faire de moi un lâche ». Le verbe grec peut aussi évoquer étymologiquement l’idée d’agir sans la vaillance attendue d’un homme.'
    reason: Alternative lexicale; la note conserve avec prudence la nuance étymologique possible sans la présenter comme le sens littéral du verbe.
