  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: fr
  text: Après avoir enduré cette mort digne d’être célébrée[a], on amena le troisième. De nombreuses personnes le pressaient vivement de goûter à cette nourriture[b] pour qu’il ait la vie sauve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’adjectif grec évoque littéralement une mort « digne d’être chantée », c’est-à-dire célébrée avec éloge.
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas ici ce qu’il devait goûter ; d’après le contexte, il s’agit de la nourriture interdite. Le verbe peut aussi être rendu par « goûter de cette nourriture ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: digne d’être célébrée
  rationale: L’adjectif évoque littéralement ce qui mérite d’être chanté et loué. « Digne d’être célébrée » conserve la solennité élogieuse du grec tout en restant naturel en français moderne.
- source_word: θάνατον
  choice: mort
  rationale: Le nom désigne directement la mort et maintient l’accent sur la fin honorable du martyr.
- source_word: καρτερήσαντος
  choice: eut enduré
  rationale: Le verbe exprime une endurance ferme face aux souffrances. Le passé antérieur marque naturellement l’antériorité dans cette narration soutenue.
- source_word: ὁ τρίτος ἤγετο
  choice: on amena le troisième
  rationale: Le passif grec indique que le troisième frère est conduit sur les lieux. La tournure française est claire sans préciser une destination absente du texte.
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: Beaucoup insistaient vivement auprès de lui
  rationale: Cette formulation rend à la fois le grand nombre de personnes (ὑπὸ πολλῶν) et l’intensité ou la répétition de leurs exhortations (πολλά).
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: pour qu’il sauve sa vie en goûtant à cette nourriture
  rationale: Dans ce contexte, σώζοιτο signifie préserver sa vie. L’objet de « goûter » est implicite en grec; « cette nourriture » l’explicite sobrement d’après le contexte immédiat.
theological_decisions:
- issue: Élévation martyrologique dans ἀοίδιμον θάνατον
  choice: mort digne d’être célébrée
  alternative: mort renommée; mort mémorable; mort digne d’être chantée
  rationale: Le grec fait l’éloge de la mort du frère précédent. Cette traduction préserve le registre honorifique sans introduire une catégorie doctrinale étrangère au texte.
- issue: Sens de σώζοιτο
  choice: sauve sa vie
  alternative: soit sauvé; échappe à la mort
  rationale: Le contexte indique la préservation de la vie physique par un acte de conformité. « Sauve sa vie » évite de suggérer ici un salut spirituel que le grec n’impose pas.
- issue: Objet implicite de ἀπογευσάμενος
  choice: cette nourriture
  alternative: en goûtant; en y goûtant
  rationale: Le grec omet l’objet parce qu’il est connu du contexte. Le français gagne en clarté avec une explicitation minimale, signalée en note.
translation_notes:
  register: Français moderne, digne et narratif. Le passé antérieur convient à l’ouverture temporelle dans un registre littéraire accessible. La seconde phrase évite une accumulation lourde de participes tout en conservant l’intensité rhétorique de πολλά ὑπὸ πολλῶν.
