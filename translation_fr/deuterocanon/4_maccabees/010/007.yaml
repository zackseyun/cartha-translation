  text: And since they were in no way able to strangle him[a], they dragged off the skin with the very tips of his fingers and flayed him, and immediately they led him to the wheel.
translation:
  language: fr
  text: Et comme ils ne parvenaient d’aucune manière à l’étrangler, ils lui arrachèrent la peau avec les extrémités mêmes de ses doigts[a] et l’écorchèrent; puis ils le conduisirent aussitôt à la roue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec le bout des doigts ». La tournure grecque est exceptionnellement graphique et peut indiquer que la peau fut arrachée jusque sur les extrémités des doigts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μηδένα τρόπον
  choice: d’aucune manière
  rationale: Cette tournure négative exprime une incapacité totale; la formulation française reste naturelle tout en conservant son intensité.
- source_word: ἰσχύοντες
  choice: ils ne parvenaient
  rationale: Avec l’infinitif qui suit, le participe exprime ici la capacité ou la réussite plutôt que la seule force physique.
- source_word: ἄγξαι
  choice: à l’étrangler
  rationale: Le verbe désigne la constriction de la gorge; « étrangler » est le terme français courant et précis dans ce contexte.
- source_word: περισύραντες
  choice: ils lui arrachèrent
  rationale: Le participe évoque une peau tirée ou enlevée avec violence. Le pronom « lui » rend idiomatiquement en français l’atteinte portée à son corps.
- source_word: τὸ δέρμα
  choice: la peau
  rationale: Équivalent direct, clair et approprié au sens corporel.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: avec les extrémités mêmes de ses doigts[a]
  rationale: La traduction conserve la préposition σύν (« avec »), la redondance emphatique de ἄκραις…κορυφαῖς et le caractère graphique de la phrase, sans imposer une relation spatiale absente du grec.
- source_word: ἀπεσκύθισον
  choice: l’écorchèrent
  rationale: Le verbe signifie enlever la peau, écorcher ou scalper. « Écorchèrent » convient au contexte corporel large et évite de limiter sans certitude l’action au cuir chevelu.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Rend clairement la succession immédiate des actions en français moderne.
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: ils le conduisirent à la roue
  rationale: Rend directement le mouvement vers la roue, instrument de supplice.
