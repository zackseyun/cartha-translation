  source_fidelity: Le texte rend fidèlement la construction καὶ + participe et l’incapacité totale exprimée par κατὰ μηδένα τρόπον ἰσχύοντες ἄγξαι. « Étrangler », « arracher la peau », « écorcher » et « conduire ... à la roue » correspondent au sens du grec. La formulation « avec les extrémités mêmes de ses doigts » conserve prudemment σύν (« avec ») et l’insistance graphique de la double expression ἄκραις... κορυφαῖς, sans transformer cette relation en « depuis » ou « jusqu’à », interprétations plus étroites.
