  yaml_path: translation/deuterocanon/4_maccabees/010/005.yaml
  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: fr
  text: Mais, ulcérés par le franc-parler de cet homme[a], ils lui déboîtaient les mains et les pieds au moyen d’instruments conçus pour disloquer les articulations ; puis, les arrachant de leurs articulations en faisant levier[b], ils le démembraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ayant supporté avec amertume le franc-parler de cet homme ». Le mot grec évoque ici une parole ouverte et courageuse, ainsi que la vive hostilité qu’elle provoque.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie des termes rares pour les instruments appliqués aux articulations et pour l’arrachement des membres, ce qui souligne la brutalité de la torture.
    reason: cultural_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: exaspérés par
  rationale: L’expression signifie littéralement qu’ils ont « supporté avec amertume » la hardiesse de l’homme. En contexte, elle décrit leur réaction de vive hostilité ; « exaspérés par » l’exprime naturellement sans réduire πικρῶς à une simple manière d’agir.
- source_word: παρρησίαν
  choice: hardiesse
  rationale: Le nom désigne ici une parole ouverte et courageuse. « Hardiesse » conserve à la fois l’idée d’assurance et celle de franchise, tandis que la note signale explicitement la dimension du franc-parler.
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: au moyen d’instruments conçus pour disloquer les articulations
  rationale: Ce composé rare désigne des appareils agissant violemment sur les articulations. Cette formulation reste claire en français moderne tout en préservant la précision et la brutalité de l’image.
- source_word: ἐξήρθρουν
  choice: ils lui déboîtaient
  rationale: Le verbe signifie mettre hors de l’articulation. « Déboîter » est le terme français courant et précis ; l’imparfait rend l’aspect duratif ou répété du grec.
- source_word: ἐξ ἁρμῶν
  choice: de leurs jointures
  rationale: ἁρμός désigne le point d’assemblage ou l’articulation. « Jointures » maintient l’image anatomique et convient aux mains et aux pieds mentionnés juste avant.
- source_word: ἀναμοχλεύοντες
  choice: les arrachant … à coups de levier
  rationale: Le participe évoque l’action de soulever ou d’extraire en faisant levier. La traduction conserve cette violence mécanique sans employer un terme technique obscur.
- source_word: ἐξέμελιζον
  choice: ils le démembraient
  rationale: Le verbe exprime l’arrachement des membres ou le démembrement. Le pronom « le » rend explicite la victime comme objet de cette mutilation complète, conformément au contexte.
theological_decisions:
- issue: Degré d’explicitation de la violence
  choice: 'Conserver les détails anatomiques et mécaniques de la torture : mains, pieds, articulations, effet de levier et démembrement.'
  alternative: Atténuer la description par un terme général comme « ils le mutilaient ».
  rationale: Le grec décrit délibérément et avec précision les sévices infligés au martyr. Une traduction fidèle ne doit ni adoucir cette violence ni ajouter des détails étrangers au texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le mouvement progressif du grec et son imagerie corporelle explicite. « Exaspérés par » privilégie l’idiome français, tandis que la note préserve la formulation littérale et l’ambiguïté de la construction grecque.
