  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: fr
  text: Ô mère de la nation[a], vengeresse de la Loi, défenseure de la piété, victorieuse du combat à travers tes affections maternelles[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mère du peuple » ou « mère de la race » : le grec ἔθνος peut désigner une nation, un peuple ou un groupe ethnique.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « victorieuse du combat à travers les entrailles ». Le grec σπλάγχνα (« entrailles ») désigne figurément les affections profondes, ici la tendresse maternelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: mère
  rationale: Le vocatif direct appelle la traduction simple et naturelle « mère ».
- source_word: ἔθνους
  choice: de la nation
  rationale: ἔθνος peut désigner une nation, un peuple ou un groupe ethnique. « Nation » conserve ici la portée publique et représentative de l'éloge.
- source_word: ἔκδικε
  choice: vengeresse
  rationale: Le terme désigne celle qui fait justice ou prend la défense d'une cause lésée. « Vengeresse » en conserve la vigueur, sans réduire le mot à la simple idée de protectrice.
- source_word: τοῦ νόμου
  choice: de la Loi
  rationale: Le génitif présente la Loi comme la cause vengée. La majuscule signale ici la Loi religieuse d'Israël.
- source_word: ὑπερασπίστεια
  choice: défenseure
  rationale: Ce féminin rare désigne celle qui protège ou défend activement. « Défenseure » est actuel, précis et parallèle à « vengeresse ».
- source_word: τῆς εὐσεβείας
  choice: de la fidélité à Dieu
  rationale: Dans ce contexte, εὐσέβεια exprime une dévotion respectueuse envers Dieu qui se manifeste dans la conduite. Cette formulation est plus claire en français courant que « piété », tout en évitant un sens doctrinal technique.
- source_word: διὰ σπλάγχνων
  choice: au cœur même de tes affections maternelles
  rationale: σπλάγχνα désigne littéralement les entrailles, puis les sentiments profonds et la compassion. Le contexte rend maternelle cette affection; la formulation garde l'idée d'un combat qui traverse ces sentiments sans faire d'eux l'instrument de la victoire.
- source_word: ἀγῶνος
  choice: combat
  rationale: ἀγών évoque à la fois la compétition athlétique et l'épreuve morale. « Combat » restitue naturellement ces deux dimensions dans ce contexte.
- source_word: ἀθλοφόρε
  choice: toi qui as remporté le prix
  rationale: Le mot désigne la personne qui emporte le prix d'une compétition. Une proposition relative rend l'image athlétique plus naturellement que le substantif français peu idiomatique « lauréate » dans cette série d'apostrophes.
theological_decisions:
- issue: Rendu de εὐσέβεια dans le contexte du martyre
  choice: fidélité à Dieu
  alternative: piété; attachement respectueux à Dieu
  rationale: L'expression réunit dévotion envers Dieu et conduite fidèle à la Loi, sans importer un sens chrétien technique ultérieur.
- issue: Interprétation de διὰ σπλάγχνων ἀγῶνος
  choice: le combat livré au cœur même de tes affections maternelles
  alternative: le combat à travers tes affections maternelles; le combat de tes sentiments profonds
  rationale: La tournure grecque est dense et quelque peu ambiguë. Le choix proposé fait ressortir le conflit avec la tendresse maternelle sans prétendre que celle-ci serait simplement le moyen de la victoire.
translation_notes:
  register: Registre élevé et hymnique, conforme à la série d'apostrophes grecques, mais exprimé dans un français moderne. « Ô » et l'exclamation finale préservent l'intensité rhétorique; les féminins « vengeresse » et « défenseure » rendent explicitement les formes grecques féminines.
