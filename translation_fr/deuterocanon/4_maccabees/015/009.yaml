base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/009.yaml
  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: fr
  text: 'Et ce n’est pas tout : à cause de la noblesse de caractère de ses fils et de leur obéissance à la Loi, elle éprouvait pour eux une affection maternelle encore plus grande.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καί
  choice: Et ce n’est pas tout
  rationale: Cette tournure marque l’ajout insistant d’un nouvel élément plutôt qu’une simple opposition. La formulation française restitue naturellement cette progression.
- source_word: καλοκἀγαθίαν
  choice: noblesse de caractère
  rationale: Le terme désigne l’excellence morale et la qualité noble d’une personne. Cette expression est claire en français moderne et évite l’ambiguïté sociale de « noblesse » employé seul.
- source_word: εὐπείθειαν
  choice: obéissance
  rationale: Avec πρὸς τὸν νόμον, le mot exprime une disposition à se conformer à la loi. « Obéissance » en donne ici le sens direct et naturel.
- source_word: νόμον
  choice: la Loi
  rationale: Dans ce contexte, le terme renvoie à la loi ancestrale d’Israël. La majuscule conventionnelle permet de signaler ce référent précis sans développer le texte.
- source_word: μείζω
  choice: encore plus grande
  rationale: Le comparatif est intensifié naturellement en français par « encore », conformément au mouvement argumentatif du passage.
- source_word: φιλοστοργίαν
  choice: affection maternelle
  rationale: Le nom désigne l’affection naturelle au sein de la famille. Comme le sujet est la mère et l’objet ses fils, « affection maternelle » explicite sobrement la relation donnée par le contexte.
theological_decisions:
- issue: Explicitation de la nuance maternelle de φιλοστοργία
  choice: affection maternelle
  alternative: affection familiale ; tendre affection
  rationale: Le mot grec est plus largement familial, mais son application est ici sans ambiguïté celle d’une mère envers ses fils. L’explicitation clarifie la scène sans ajouter de contenu doctrinal.
- issue: Identification de νόμος
  choice: la Loi
  alternative: la loi
  rationale: Le contexte vise la loi ancestrale à laquelle les fils demeurent fidèles. La majuscule française rend cette référence spécifique, tout en conservant le terme simple du grec.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le rapport causal et le renforcement comparatif du grec, sans archaïsme ni technicité inutile.
