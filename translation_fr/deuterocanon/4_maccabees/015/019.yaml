revisions:
- from: Tu n’as pas non plus pleuré lorsqu’un troisième fils rendait son dernier souffle[a], ni quand tu voyais les yeux de chacun, pareils à ceux d’un taureau[b], fixer les tortures et le même supplice, tandis que leurs narines annonçaient d’avance leur mort[c].
  to: Tu n’as pas non plus pleuré lorsqu’un troisième fils rendait son dernier souffle[a], ni quand tu voyais les yeux de chacun fixer les tortures et le même supplice avec un regard de taureau[b], tandis que leurs narines présageaient leur mort[c].
  rationale: La traduction est révisée uniquement pour rattacher l’image du taureau à l’acte de regarder plutôt qu’à l’apparence physique des yeux, et pour alléger la formulation du présage de mort. Les ambiguïtés du grec et l’image frappante des narines sont préservées.
