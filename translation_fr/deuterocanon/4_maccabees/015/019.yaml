    issue: Portée de l’image ταυρηδόν
    rationale: « Pareils à ceux d’un taureau » suggère que les yeux ressemblent physiquement à des yeux de taureau. Le grec exprime plutôt une manière bovine de regarder. Une formulation qui rattache l’image au regard est plus fidèle.
  - severity: low
    issue: Redondance de « annonçaient d’avance »
    rationale: Le préfixe de προσημειόω peut justifier l’idée d’anticipation, mais « présager » l’exprime naturellement en français sans alourdir la phrase.
