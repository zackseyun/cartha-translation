base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: fr
  text: Tu n’as pas non plus pleuré lorsqu’un troisième fils rendait son dernier souffle[a], ni quand tu voyais les yeux de chacun fixer les tortures et le même supplice avec un regard de taureau[b], tandis que leurs narines présageaient leur mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tandis qu’un troisième mourait ». Le début grec est elliptique ; « fils » est sous-entendu par le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la manière d’un taureau ». L’image semble décrire la manière ferme ou farouche dont les fils regardaient les tortures.
    reason: cultural_note
  - marker: c
    text: Image littérale du grec, qui peut évoquer la respiration visible de personnes proches de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: lorsqu’un troisième fils rendait son dernier souffle
  rationale: Le grec est elliptique et omet « fils », clairement fourni par le contexte. ἀποψύχω évoque l’expiration de la vie ; « rendre son dernier souffle » conserve cette image en français naturel.
- source_word: θεωροῦσα
  choice: quand tu voyais
  rationale: Le participe décrit la mère observant directement ses fils. Cette tournure s’intègre naturellement à l’interpellation rhétorique.
- source_word: ταυρηδόν
  choice: pareils à ceux d’un taureau
  rationale: L’adverbe signifie littéralement « à la manière d’un taureau ». La formulation rattache l’image aux yeux et à leur manière ferme ou farouche de regarder, sans expliciter davantage sa portée.
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας
  choice: fixer les tortures
  rationale: βάσανοι peut désigner les tortures ou les tourments. « Fixer » rend ici le regard dirigé vers ce qui se trouve devant eux.
- source_word: τὸν αὐτὸν αἰκισμόν
  choice: le même supplice
  rationale: αἰκισμός désigne un traitement cruel, des sévices ou une torture. « Le même supplice » préserve l’idée que chacun subit une cruauté semblable.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: leurs narines annonçaient d’avance leur mort
  rationale: La traduction conserve l’image corporelle frappante du grec. προσημειόω indique ou annonce par avance, probablement à travers la respiration visible des mourants.
- source_word: οὐκ ἔκλαυσας
  choice: Tu n’as pas non plus pleuré
  rationale: κλαίω est le verbe courant pour pleurer. La négation maintient l’étonnement rhétorique devant la maîtrise de soi de la mère.
theological_decisions:
- issue: Sujet sous-entendu dans l’ouverture elliptique
  choice: Ajout de « fils » après « un troisième »
  alternative: Conserver « lorsqu’un troisième rendait son dernier souffle »
  rationale: Le nom est absent du grec, mais le contexte immédiat concerne les fils de la mère. L’ajout clarifie le référent sans introduire de contenu doctrinal.
- issue: Portée de l’image du taureau
  choice: Rattacher l’image aux yeux des fils
  alternative: L’appliquer plus largement à leur attitude sous la torture
  rationale: ταυρηδόν se trouve au plus près de la description des yeux et du regard. La traduction garde ce lien syntaxique tout en laissant ouverte la nuance exacte de l’image.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve l’adresse directe à la mère, la répétition négative et les images saisissantes du regard de taureau et des narines annonçant la mort.
