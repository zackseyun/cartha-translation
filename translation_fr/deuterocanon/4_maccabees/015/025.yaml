  text: For just as[a], in her own soul as in a council chamber, she saw fearsome counselors—nature and birth and love for her children and the torture of her children—
translation:
  language: fr
  text: Car, de même que dans une salle de conseil, elle voyait dans son âme de redoutables conseillers — la nature, l’enfantement, l’amour de ses enfants et leur supplice[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le chevalet de torture de ses enfants » ; l’instrument désigne ici, par métonymie, le supplice qu’ils subissaient.'
    reason: alternative lexicale
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Car, de même que
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « de même que » maintient la comparaison introduite par καθάπερ, laquelle se poursuit au-delà de ce fragment.
- source_word: ἐν βουλευτηρίῳ
  choice: comme dans une salle de conseil
  rationale: βουλευτήριον désigne le lieu où siège et délibère un conseil. L’ajout de « comme » rend clairement la métaphore en français sans en modifier le contenu.
- source_word: τῇ ἑαυτῆς ψυχῇ
  choice: dans son âme
  rationale: ψυχή désigne ici l’être intérieur, siège de la délibération. « Âme » en préserve la portée anthropologique, et « son » rend naturellement ἑαυτῆς.
- source_word: δεινοὺς … συμβούλους
  choice: de redoutables conseillers
  rationale: δεινός évoque ce qui est terrible ou redoutable; « conseillers » maintient l’image cohérente de la salle du conseil.
- source_word: φύσιν
  choice: la nature
  rationale: Le terme peut viser la constitution ou l’élan naturel. « La nature » conserve cette ampleur sans réduire le sens à un instinct particulier.
- source_word: γένεσιν
  choice: l’enfantement
  rationale: Dans ce contexte maternel, γένεσις évoque la naissance comme fait d’avoir mis au monde les enfants. « L’enfantement » exprime ce lien plus nettement que le seul mot « naissance ».
- source_word: φιλοτεκνίαν
  choice: l’amour de ses enfants
  rationale: Le mot désigne l’affection portée à ses propres enfants. Cette formulation est naturelle et reste lexicalement proche du grec.
- source_word: τέκνων στρέβλαν
  choice: leur supplice
  rationale: στρέβλα désigne littéralement un instrument de torture, notamment le chevalet, mais fonctionne vraisemblablement ici par métonymie pour le supplice subi par les enfants. Le pronom « leur » évite une répétition lourde sans obscurcir le référent.
