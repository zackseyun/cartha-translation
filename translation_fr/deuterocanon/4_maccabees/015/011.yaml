base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/011.yaml
  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
translation:
  language: fr
  text: Mais pourtant, bien que tant d’élans d’amour maternel aient entraîné la mère vers la compassion, les tortures de toutes sortes n’ont pu, sous l’effet d’aucun d’eux, détourner sa raison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jugement rationnel ». Le terme grec désigne la faculté de raisonner et de juger rationnellement, un thème majeur de 4 Maccabées.
    reason: Alternative lexicale pour λογισμός, terme philosophique central.
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Mais malgré tout
  rationale: Rend la transition fortement concessive et emphatique du grec dans un français naturel.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: bien que tant d’élans de tendresse maternelle
  rationale: φιλοτεκνία désigne ici l’amour d’une mère pour ses enfants; «élans» exprime les puissants mouvements affectifs sans les réduire à de simples considérations.
- source_word: εἰς συμπάθειαν ἑλκόντων τὴν μητέρα
  choice: aient poussé cette mère à la compassion
  rationale: Préserve le mouvement exprimé par ἕλκω et rend συμπάθεια par la compassion éprouvée devant les souffrances de ses enfants. «Cette mère» est idiomatique dans le contexte tout en gardant la référence définie du grec.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: aucune de ces formes de torture
  rationale: Le pronom reprend le sujet immédiatement exprimé, «les tortures de toutes sortes»; la formulation française clarifie cette relation sans ajouter de contenu.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: son jugement raisonnable
  rationale: λογισμός est le jugement exercé par la faculté rationnelle, thème central de 4 Maccabées. Cette expression conserve mieux la dimension active et philosophique que «raison» seule.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: ces formes de torture
  rationale: Dans la construction française retenue, l’idée de diversité portée par παντοίκιλοι est exprimée par «formes»; «torture» convient au contexte du martyre.
- source_word: ἴσχυσαν μετατρέψαι
  choice: n’a réussi à détourner
  rationale: Rend l’incapacité ou l’absence de puissance effective exprimée par ἰσχύω, ainsi que l’idée de déviation contenue dans μετατρέπω.
theological_decisions:
- issue: Sens philosophique de λογισμός
  choice: son jugement raisonnable
  alternative: sa raison; sa résolution
  rationale: Le livre affirme la maîtrise des passions par le λογισμός. «Jugement raisonnable» maintient cette portée rationnelle sans transformer le terme en simple fermeté volontaire ni importer une catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forte concession du grec et son contraste entre affection maternelle, compassion et jugement rationnel.
