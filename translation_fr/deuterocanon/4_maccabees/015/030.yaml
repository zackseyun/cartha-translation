review_pass:
  verdict: revise
  source_fidelity: Le contraste lexical entre ἀρρένων (« mâles ») et ἀνδρῶν (« hommes »), ainsi que le jeu avec ἀνδρειοτέρα (« plus virile / plus courageuse »), est bien maintenu. En revanche, πρὸς introduit le domaine de la comparaison (« dans / quant à »), non le moyen ou la cause ; « par ta force d’âme » est donc moins précis. καρτερία est mieux rendu ici par « fermeté », ce qui le distingue de ὑπομονή, « endurance ».
  naturalness: L’exclamation directe et solennelle est naturelle. « Dans ta fermeté » et « dans ton endurance » expriment clairement les deux domaines comparés sans alourdir la phrase. « Plus virile que les hommes » demeure marqué en français, mais c’est précisément l’effet rhétorique voulu par le grec et il est explicité en note.
  terminology: « Mâles », « hommes » et « plus virile » préservent les distinctions et le jeu étymologique du grec. La note doit présenter « plus courageuse » comme une possibilité interprétative sans effacer le terme volontairement genré du texte.
  issues:
  - severity: medium
    issue: Valeur de πρὸς rendue par « par »
    rationale: Dans les deux membres, πρὸς marque le point de vue ou le domaine de la comparaison. « Par ta force d’âme / par ton endurance » peut suggérer le moyen ou la cause ; « dans ta fermeté / dans ton endurance » est plus fidèle.
  - severity: low
    issue: « Force d’âme » pour καρτερία
    rationale: Cette expression est défendable, mais « fermeté » rend plus directement la ténacité persévérante de καρτερία et permet de la distinguer de ὑπομονή (« endurance »).
  revised_text: Ô toi, plus noble que les mâles dans ta fermeté, et plus virile que les hommes dans ton endurance !
  revised_footnotes:
