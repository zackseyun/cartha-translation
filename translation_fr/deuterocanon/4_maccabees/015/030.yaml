  text: O more noble than males in courage[a], and more manly than men in endurance.
translation:
  language: fr
  text: Ô toi, plus noble que les mâles dans ta fermeté, et plus virile que les hommes dans ton endurance !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρρένων
  choice: mâles
  rationale: Le terme désigne fondamentalement les êtres de sexe masculin. « Mâles » maintient sa distinction intentionnelle d’avec ἀνδρῶν, rendu ensuite par « hommes ».
- source_word: πρὸς καρτερίαν
  choice: par ta force d’âme
  rationale: καρτερία évoque la fermeté courageuse et la capacité à tenir bon. « Force d’âme » exprime naturellement en français cette vertu morale sans la confondre avec la seule audace.
- source_word: γενναιοτέρα
  choice: plus noble
  rationale: Le comparatif peut exprimer la noblesse morale autant que la vaillance. « Plus noble » conserve cette élévation et suit de près la forme comparative.
- source_word: ἀνδρῶν
  choice: hommes
  rationale: ἀνήρ désigne ici les hommes adultes et porte les connotations de la virilité que reprend immédiatement ἀνδρειοτέρα.
- source_word: πρὸς ὑπομονὴν
  choice: par ton endurance
  rationale: ὑπομονή désigne la persévérance patiente sous l’épreuve. « Endurance » convient au contexte du martyre et préserve la concision de la comparaison.
- source_word: ἀνδρειοτέρα
  choice: plus virile
  rationale: L’adjectif, formé sur ἀνήρ (« homme »), signifie à la fois viril et courageux. « Plus virile » conserve le jeu rhétorique explicite avec « hommes », malgré son caractère volontairement marqué.
theological_decisions:
- issue: Rhétorique genrée dans l’éloge de la mère
  choice: 'Conserver explicitement la comparaison : « plus noble que les mâles » et « plus virile que les hommes »'
  alternative: Neutraliser en disant, par exemple, « plus courageuse que les hommes »
  rationale: Le grec renverse délibérément les attentes de son milieu en présentant une femme comme surpassant les hommes dans des vertus culturellement associées au masculin. Neutraliser le vocabulaire effacerait une tension essentielle du propos.
translation_notes:
  register: Exclamation solennelle et directe. L’ajout de « toi » rend naturel en français le vocatif grec ὦ avec les comparatifs au féminin. Le contraste volontairement marqué entre « mâles », « virile » et « hommes » est maintenu.
