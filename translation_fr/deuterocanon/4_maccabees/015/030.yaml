revisions:
- from: Ô toi, plus noble que les mâles par ta force d’âme, et plus virile[a] que les hommes par ton endurance !
  to: Ô toi, plus noble que les mâles dans ta fermeté, et plus virile que les hommes dans ton endurance !
  rationale: La révision rend πρὸς par « dans », conformément à sa fonction de préciser le domaine de chaque comparaison. Elle remplace « force d’âme » par « fermeté » pour rendre καρτερία de manière plus directe et préserver sa nuance propre face à ὑπομονή (« endurance »). Le contraste rhétorique genré et l’ambiguïté sémantique de ἀνδρειοτέρα sont conservés, sans ajouter d’interprétation doctrinale.
