  yaml_path: translation/deuterocanon/4_maccabees/015/021.yaml
  text: Not in this way do siren songs or swanlike voices with feminine sound draw those who hear[a], as the voices of children calling to their mother amid tortures.
translation:
  language: fr
  text: Ni les chants de Sirènes ni les voix de cygnes au timbre féminin[a] n’attirent autant ceux qui les entendent que les voix d’enfants appelant leur mère au milieu des tortures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mélodies de Sirènes et les voix semblables à celles des cygnes ». Le grec emploie des images poétiques classiques pour évoquer des sons irrésistiblement attirants.
    reason: lexical_alternative
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: chants de sirènes
  rationale: Cette formulation naturelle conserve l’allusion mythologique aux Sirènes et à leur chant irrésistible.
- source_word: κύκνιοι ... φωναί
  choice: voix de cygnes
  rationale: L’adjectif grec signifie « de cygne » ou « semblable à celle d’un cygne »; la formulation retenue préserve l’image poétique sans l’alourdir.
- source_word: πρὸς θηλυκίαν
  choice: aux accents féminins
  rationale: Cette expression rend la qualité féminine attribuée aux voix tout en évitant le français obscur d’un calque tel que « vers la féminité ».
- source_word: ἐφέλκονται
  choice: attirent
  rationale: Le verbe exprime le fait d’attirer vers soi; « attirent » convient au pouvoir de séduction des sons évoqués.
- source_word: τέκνων φωναί
  choice: les voix d’enfants
  rationale: Rendu direct du génitif grec, avec une cadence naturelle en français.
- source_word: μετὰ βασάνων
  choice: au milieu des tortures
  rationale: La locution exprime les circonstances dans lesquelles les enfants appellent et maintient le pluriel du grec.
- source_word: μητέρα φωνούντων
  choice: appelant leur mère
  rationale: Le participe signifie ici appeler ou crier vers quelqu’un; le possessif implicite est explicité naturellement en français.
theological_decisions:
- issue: Comparaison rhétorique fondée sur des images mythologiques et poétiques
  choice: Conserver dans le texte les Sirènes et les cygnes
  alternative: Généraliser en parlant de chants enchanteurs et de belles voix
  rationale: La vigueur du contraste dépend de ces images classiques opposées aux appels des enfants torturés; les conserver respecte le grec sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure comparative « n’attirent autant… que » restitue naturellement la construction grecque οὐχ οὕτως… ὡς, tandis que « aux accents féminins » conserve sans surinterprétation la formulation inhabituelle πρὸς θηλυκίαν.
