base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: fr
  text: Alors, combien terribles et nombreux furent les tourments infligés à la mère[a], pendant que ses fils étaient torturés par les roues et les fers brûlants[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mère fut-elle tourmentée de tourments ? » Le grec répète des mots de la même racine pour renforcer l’expression.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « instruments à cautériser » ou « fers à marquer ». Il s’agit d’instruments brûlants servant à cautériser ou à brûler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις καὶ πόσαις
  choice: combien terribles et nombreux
  rationale: Les deux adjectifs interrogatifs s’accordent avec βασάνοις et qualifient l’ampleur ainsi que le nombre des tourments. Cette formulation conserve la force rhétorique tout en restant naturelle en français.
- source_word: τότε
  choice: alors
  rationale: Marque à la fois le moment du récit et la transition rhétorique.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Respecte l’article grec sans ajouter de possessif explicite; le contexte indique de quelle mère il s’agit.
- source_word: τῶν υἱῶν βασανιζομένων
  choice: pendant que ses fils étaient torturés
  rationale: Le génitif absolu exprime la simultanéité. Le possessif, naturel en français, explicite la relation déjà évidente dans le contexte.
- source_word: τροχοῖς
  choice: par les roues
  rationale: Rend directement le pluriel grec sans l’interpréter comme un autre dispositif précis tel qu’un chevalet.
- source_word: καυτηρίοις
  choice: par les fers brûlants
  rationale: Désigne des instruments servant à brûler ou cautériser. « Fers brûlants » est clair pour le lectorat moderne sans restreindre le sens aux seuls fers à marquer.
- source_word: ἐβασανίζετο βασάνοις
  choice: furent les tourments infligés à
  rationale: Reproduire littéralement « fut tourmentée de tourments » serait lourd en français. La restructuration conserve l’intensité et la relation étymologique est signalée en note.
theological_decisions:
- issue: Nature de la souffrance de la mère
  choice: Le texte affirme que la mère subit des tourments réels et intenses en voyant torturer ses fils, sans préciser qu’elle fut elle-même soumise aux roues et aux fers brûlants.
  alternative: Comprendre qu’elle fut elle-même torturée physiquement au moyen d’instruments comparables.
  rationale: La syntaxe rattache directement les roues et les fers brûlants aux fils. Le vocabulaire de la torture décrit néanmoins avec force ce que subit la mère; la traduction ne réduit donc pas son épreuve à une émotion légère et n’en précise pas davantage le mécanisme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique grecque est conservée. La formulation évite une répétition maladroite en français tout en en signalant la force dans la note.
