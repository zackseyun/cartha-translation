base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: fr
  text: Ô ! Comment pourrais-je dépeindre[a] les sentiments d’affection des parents pour leurs enfants, sentiments qui impriment la ressemblance de l’âme et de la forme dans la petite et merveilleuse image qu’est l’enfant[b] ? Surtout parce que les mères sont plus sensibles que les pères envers leurs enfants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présenter » ou « faire le portrait de » ; le verbe grec appartient à un registre rhétorique élevé.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec associe l’action d’imprimer ou de sceller à une « image d’enfant » : l’enfant est décrit comme portant une ressemblance intérieure et extérieure de ses parents.'
    reason: metaphor_clarification
  - marker: c
    text: Littéralement « envers ceux qui sont nés ». La grammaire grecque compare ici les mères aux pères ; elle ne dit pas que les mères rendent les pères plus sensibles.
    reason: source_syntax
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: pourrais-je dépeindre
  rationale: Le verbe, rare et de registre rhétorique, demande comment représenter adéquatement des dispositions ou des sentiments. « Dépeindre » conserve cette force expressive en français naturel.
- source_word: φιλότεκνα γονέων πάθη
  choice: les tendres sentiments des parents pour leurs enfants
  rationale: φιλότεκνα précise que les πάθη sont tournés vers les propres enfants des parents. Cette formulation rend clairement l’affection parentale sans la connotation négative que pourrait avoir « passions ».
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: la ressemblance de l’âme et de la forme
  rationale: La traduction maintient explicitement le parallèle grec entre la ressemblance intérieure (ψυχή) et extérieure (μορφή), sans transformer le passage en affirmation anthropologique technique.
- source_word: παιδοχαρακτῆρα
  choice: cette petite et merveilleuse empreinte qu’est l’enfant
  rationale: Le composé évoque une marque ou une figure imprimée. « Empreinte » maintient la métaphore qui se prolonge dans ἐναποσφραγίζοντα, tandis que l’explicitation « qu’est l’enfant » rend l’image intelligible.
- source_word: ἐναποσφραγίζοντα
  choice: qui impriment
  rationale: Le verbe signifie apposer ou enfoncer l’empreinte d’un sceau. « Imprimer » conserve directement cette image.
- source_word: συμπαθεστέρας
  choice: plus sensibles
  rationale: Le comparatif exprime une plus grande réceptivité affective ou compassion envers les enfants. « Plus sensibles à » est idiomatique et garde l’idée de sympathie profonde.
- source_word: τοῖς γεννηθεῖσιν
  choice: à ceux qui sont nés d’eux
  rationale: Le participe désigne littéralement « ceux qui sont nés » et renvoie aux enfants. La formulation conserve cette expression tout en explicitant le lien parental.
theological_decisions:
- issue: Portée anthropologique de « la ressemblance de l’âme et de la forme »
  choice: Conserver dans le texte la double ressemblance, intérieure et extérieure
  alternative: Paraphraser par « leur caractère et leur apparence »
  rationale: Le grec nomme expressément ψυχή et μορφή. Les maintenir respecte la rhétorique du texte sans imposer une définition doctrinale particulière de l’âme.
- issue: Identification du terme de comparaison dans la dernière proposition
  choice: Les mères sont plus sensibles que les pères envers les enfants
  alternative: Les mères rendent les pères plus sensibles envers leurs enfants
  rationale: 'Dans la construction accusatif-infinitif, τὰς μητέρας et συμπαθεστέρας sont tous deux féminins accusatifs et vont ensemble, tandis que τῶν πατέρων est un génitif de comparaison : les mères sont donc « plus sensibles que les pères », et non la cause d’une sensibilité accrue chez ceux-ci.'
translation_notes:
  register: Français international actuel, digne et légèrement soutenu afin de conserver l’exclamation rhétorique et la métaphore du sceau. La phrase a été divisée en deux pour rester intelligible, sans effacer le lien logique marqué par μάλιστα διὰ τό.
