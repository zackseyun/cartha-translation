  yaml_path: translation/deuterocanon/4_maccabees/015/005.yaml
  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
translation:
  language: fr
  text: Car, plus les mères sont fragiles d’âme[a] et ont plus d’enfants, plus elles aiment leurs enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faibles de caractère » ou « peu courageuses ». Le grec évoque littéralement une faiblesse de l’âme, dont la nuance exacte peut aller de la fragilité affective au manque de courage.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « aimant davantage leurs enfants ». Le mot grec exprime une affection particulière pour ses propres enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: plus… plus…
  rationale: Cette construction corrélative exprime une proportion et se rend naturellement en français par « plus… plus… ».
- source_word: ἀσθενόψυχοι
  choice: fragiles d’âme
  rationale: Ce choix conserve l’image du composé grec, qui désigne une faiblesse de l’âme ou du courage, sans réduire le sens à la seule lâcheté.
- source_word: πολυγονώτεραι
  choice: fécondes
  rationale: L’adjectif comparatif évoque le fait d’avoir une nombreuse descendance. Dans la corrélation française, « plus… fécondes » porte naturellement la valeur comparative sans ajouter un second « plus » devant chaque adjectif coordonné.
- source_word: ὑπάρχουσιν
  choice: sont
  rationale: Le verbe sert ici de copule aux deux adjectifs et se traduit simplement par « sont ».
- source_word: αἱ μητέρες
  choice: les mères
  rationale: Traduction directe du groupe nominal grec.
- source_word: φιλοτεκνώτεραι
  choice: aiment leurs enfants
  rationale: Le composé exprime une affection particulière pour ses enfants. Avec « plus », cette formulation française restitue clairement le comparatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure proportionnelle du grec est préservée. « Fragiles d’âme » garde l’image ancienne tout en restant intelligible, et les notes signalent l’éventail sémantique sans trancher abusivement.
