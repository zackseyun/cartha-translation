  source_fidelity: 'La phrase française rend correctement la structure principale : « la raison pieuse » est le sujet, elle fortifie les σπλάγχνα de la mère au sein même des souffrances, puis s’efforce de mettre de côté la φιλοτεκνία πρόσκαιρος. Cependant, le possessif « ses » dans « ses affections profondes » peut grammaticalement renvoyer à « la raison », alors que αὐτῆς désigne la mère. La révision rend ce référent explicite.'
  naturalness: Le registre est moderne et digne. « Rendant courageuses ses affections profondes » est toutefois légèrement lourd et présente l’ambiguïté référentielle signalée. « Ayant affermi les profondes affections de cette mère » est plus fluide et garde la valeur causative du participe grec.
  terminology: « Raison pieuse » est un rendu fidèle et naturel de εὐσεβὴς λογισμός. « Profondes affections » rend bien σπλάγχνα au sens figuré. « Amour passager pour ses enfants » conserve le contraste de πρόσκαιρον sans déclarer que l’amour maternel est mauvais en soi. Les notes sont ajustées pour ne pas attribuer au grec un possessif qui n’y est pas exprimé dans cette expression.
  issues:
