    rationale: La note « son amour passager des enfants » présente « son » comme s’il appartenait à la formulation grecque de τὴν πρόσκαιρον φιλοτεκνίαν. Il vaut mieux donner une glose sans possessif et expliquer ensuite le référent contextuel.
