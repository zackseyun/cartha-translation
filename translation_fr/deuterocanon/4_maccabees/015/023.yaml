revisions:
- from: Mais la raison pieuse[a], rendant courageuses ses affections profondes au cœur même de ces souffrances, s’efforçait de passer outre à son amour passager pour ses enfants[b].
  to: Mais la raison pieuse[a], ayant affermi les profondes affections de cette mère au cœur même de ces souffrances, s’efforçait de ne pas tenir compte de son amour passager pour ses enfants[b].
  rationale: La révision identifie explicitement la mère comme celle dont les affections sont fortifiées, éliminant une ambiguïté produite par le possessif français. « Ayant affermi » maintient la valeur causative et antérieure du participe ἀνδρειώσας. « Ne pas tenir compte de » rend de façon claire et idiomatique le sens volontaire de παροδεῖν. Les notes conservent les alternatives utiles tout en distinguant la glose lexicale de l’interprétation contextuelle.
