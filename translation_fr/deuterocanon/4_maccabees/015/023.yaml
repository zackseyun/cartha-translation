base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
translation:
  language: fr
  text: Mais la raison pieuse[a], ayant affermi les profondes affections de cette mère au cœur même de ces souffrances, s’efforçait de ne pas tenir compte de son amour passager pour ses enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la raison guidée par la piété ». Cette expression clé de 4 Maccabées désigne la raison gouvernée par la révérence envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’affection passagère pour les enfants ». Le texte oppose ici l’attachement maternel lié à la vie présente à une fidélité qui demeure dans la souffrance.
    reason: lexical_clarification
lexical_decisions:
- source_word: σπλάγχνα
  choice: ses affections profondes
  rationale: Le terme désigne littéralement les entrailles, mais, par extension, le siège des sentiments les plus intimes. « Affections profondes » garde cette force affective sans produire une image anatomique peu naturelle en français.
- source_word: εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: 'Expression directrice de 4 Maccabées : il s’agit de la raison gouvernée par le respect et la fidélité envers Dieu. « Raison pieuse » préserve ses dimensions rationnelle et religieuse.'
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: au cœur même de ces souffrances
  rationale: Dans ce contexte, πάθη désigne les souffrances ou supplices, et non les passions intérieures. « Même » restitue l’insistance de αὐτοῖς τοῖς.
- source_word: ἀνδρειώσας
  choice: rendant courageuses
  rationale: Le participe signifie rendre brave ou courageux. Cette formulation conserve la valeur causative et s’accorde avec les affections profondes comme objet.
- source_word: ἐτέτεινεν
  choice: s’efforçait
  rationale: L’imparfait exprime un effort soutenu et tendu. « S’efforçait » rend cette tension de manière naturelle en français.
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: son amour passager pour ses enfants
  rationale: φιλοτεκνία désigne l’attachement aux enfants, tandis que πρόσκαιρον le caractérise comme temporel ou momentané. « Passager » conserve le contraste sans présenter l’amour maternel comme mauvais en soi.
- source_word: παροδεῖν
  choice: passer outre à
  rationale: Le verbe signifie passer à côté, dépasser ou ne pas tenir compte. « Passer outre à » exprime ici le dépassement volontaire de l’élan maternel.
theological_decisions:
- issue: Rendu de l’expression programmatique εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison guidée par la piété
  rationale: Le choix concis maintient ensemble la raison et la révérence envers Dieu, sans introduire de catégorie philosophique ou doctrinale étrangère au texte.
- issue: Portée de πρόσκαιρον appliqué à l’amour maternel
  choice: son amour passager pour ses enfants
  alternative: son attachement temporaire à ses enfants
  rationale: L’adjectif établit un contraste entre l’attachement lié à la vie présente et la fidélité durable dans l’épreuve; il ne condamne pas l’amour parental en lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde clairement « la raison pieuse » comme sujet actif, préserve l’intensité affective et la tension du grec, tout en évitant une littéralité anatomique ou une condamnation implicite de l’amour maternel.
