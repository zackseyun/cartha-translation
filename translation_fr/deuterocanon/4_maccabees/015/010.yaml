base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: fr
  text: Car ils étaient justes, maîtres d’eux-mêmes, courageux, nobles de cœur et pleins d’amour pour leurs frères. Ils aimaient tant leur mère que, tout en observant jusqu’à la mort les prescriptions de la Loi[a], ils lui obéissaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ordonnances légales » ou « les coutumes prescrites par la Loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: justes
  rationale: Dans cette énumération de vertus, le terme exprime la droiture morale et religieuse. « Justes » est naturel en français biblique moderne sans réduire le sens au domaine juridique.
- source_word: σώφρονες
  choice: maîtres d’eux-mêmes
  rationale: Le mot désigne la retenue, la modération et la maîtrise des désirs. Cette tournure française en communique clairement le sens.
- source_word: ἀνδρεῖοι
  choice: courageux
  rationale: Le terme désigne ici le courage; cette traduction évite les connotations masculines inutiles d’un rendu littéral tel que « virils ».
- source_word: μεγαλόψυχοι
  choice: nobles de cœur
  rationale: Le composé évoque littéralement la grandeur d’âme. « Nobles de cœur » conserve cette élévation morale dans une langue accessible.
- source_word: φιλάδελφοι
  choice: pleins d’amour pour leurs frères
  rationale: Le contexte concerne les sept frères eux-mêmes; le rendu conserve donc la référence familiale masculine précise du grec.
- source_word: φιλόμητρος
  choice: ils aimaient tant leur mère
  rationale: L’adjectif exprime une affection loyale envers la mère. La tournure verbale s’intègre naturellement à la construction consécutive οὕτως ὥστε.
- source_word: μέχρι θανάτου
  choice: jusqu’à la mort
  rationale: L’expression marque la limite extrême jusqu’à laquelle ils observaient les prescriptions.
- source_word: τὰ νόμιμα
  choice: les prescriptions de la Loi
  rationale: Dans ce contexte maccabéen, l’expression renvoie aux règles prescrites par la Loi ancestrale, sans se limiter à une catégorie rituelle ou civile.
- source_word: φυλάσσοντας
  choice: observant
  rationale: Avec τὰ νόμιμα, le participe signifie respecter ou mettre en pratique des prescriptions.
- source_word: πείθεσθαι αὐτῇ
  choice: ils lui obéissaient
  rationale: Le moyen-passif de πείθω peut signifier se laisser persuader ou obéir. Dans le contexte de l’exhortation maternelle et de la loyauté filiale, « obéir » convient au mouvement de la phrase.
theological_decisions:
- issue: Précision du terme familial φιλάδελφοι
  choice: pleins d’amour pour leurs frères
  alternative: pleins d’amour pour les membres de leur fratrie
  rationale: Le récit parle de frères au sens littéral. Le masculin précis du contexte est conservé plutôt que neutralisé.
- issue: Portée morale et religieuse de δίκαιοι
  choice: justes
  alternative: droits
  rationale: « Justes » maintient la tonalité éthique et religieuse de leur fidélité sous la persécution, tandis que « droits » serait possible mais moins étroitement lié au vocabulaire biblique.
- issue: Relation entre obéissance maternelle et fidélité à la Loi
  choice: tout en observant jusqu’à la mort les prescriptions de la Loi, ils lui obéissaient
  alternative: ils lui obéissaient en observant jusqu’à la mort les prescriptions de la Loi
  rationale: Le rendu conserve la coexistence, dans le grec, de leur obéissance à leur mère et de leur observation de la Loi, sans faire de la mère une autorité opposée à celle-ci ni préciser davantage le rapport logique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque longue est divisée en deux pour la lisibilité, sans modifier sa progression logique. « Nobles de cœur » garde l’image de la grandeur d’âme sans employer le plus soutenu « magnanimes ».
