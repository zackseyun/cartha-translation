  yaml_path: translation/deuterocanon/4_maccabees/015/014.yaml
  text: As she watched each one being tortured and burned[a], the mother did not change because of her piety.
translation:
  language: fr
  text: En voyant chacun d’eux torturé et brûlé[a], la mère ne changea pas en raison de sa piété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torturé sur le chevalet et brûlé ». Le participe grec traduit par « torturé » peut désigner plus précisément une torture par torsion ou étirement sur un instrument.
    reason: alternative lexicale
lexical_decisions:
- source_word: καθʼ ἓν
  choice: chacun d’eux
  rationale: L’expression distributive présente les fils pris individuellement. « Chacun d’eux » est naturel en français et laisse au contexte l’idée de succession.
- source_word: στρεβλούμενον
  choice: torturé
  rationale: Le participe désigne l’action de torturer, éventuellement par torsion ou sur un chevalet. « Torturé » transmet clairement le sens général, tandis qu’une note conserve la possibilité plus précise.
- source_word: φλεγόμενον
  choice: brûlé
  rationale: Le participe évoque le fait d’être livré aux flammes ou brûlé. « Brûlé » s’accorde naturellement avec « torturé » tout en maintenant la violence de l’image.
- source_word: ὁρῶσα
  choice: En voyant
  rationale: Le participe circonstanciel exprime ici la simultanéité. « En voyant » rend sobrement le témoignage visuel continu de la mère.
- source_word: μήτηρ
  choice: la mère
  rationale: Le grec dit simplement « la mère » avec l’article. Cette formulation demeure fidèle et le contexte identifie clairement la mère des fils.
- source_word: οὐ μετεβάλετο
  choice: ne changea pas
  rationale: Le verbe signifie changer ou modifier sa position. La traduction conserve cette formulation ouverte sans préciser indûment qu’elle vacilla, renonça ou changea de résolution.
- source_word: διὰ τὴν εὐσέβειαν
  choice: en raison de sa piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la dévotion respectueuse envers Dieu, manifestée par la fidélité et l’obéissance. « Piété » maintient ce vocabulaire moral et théologique central.
theological_decisions:
- issue: Traduction de εὐσέβεια dans le contexte juif hellénistique du martyre
  choice: piété
  alternative: attachement respectueux à Dieu
  rationale: « Piété » conserve la portée de vertu religieuse du terme et sa cohérence dans l’ouvrage, sans le réduire à un sentiment ni développer explicitement ce que le grec laisse condensé.
- issue: Nature du changement nié par οὐ μετεβάλετο
  choice: ne changea pas
  alternative: ne fléchit pas
  rationale: Le grec ne précise pas expressément l’objet du changement. La formulation retenue préserve cette ouverture, tandis que « ne fléchit pas » interpréterait plus directement le verbe comme un manque de fermeté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle; le choix « ne changea pas » conserve volontairement l’ambiguïté de l’expression source.
