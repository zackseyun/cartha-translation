  text: I did not recognize the salvation that was saving seven sons for a little while[a].
translation:
  language: fr
  text: Je n’ai pas reconnu le salut qui sauvait sept fils pour peu de temps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je n’ai pas reconnu la délivrance qui préservait sept fils pendant un court moment. »'
    reason: Alternative lexicale explicitant le sens concret et temporaire de σωτηρία et σώζουσαν.
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: Je n’ai pas reconnu
  rationale: Le verbe ἐπιγινώσκω exprime ici le fait de reconnaître ou de discerner pleinement. « Je n’ai pas reconnu » conserve cette nuance sans réduire le propos à une simple incompréhension intellectuelle.
- source_word: τὴν σώζουσαν … σωτηρίαν
  choice: le salut qui sauvait
  rationale: Cette formulation conserve la répétition étymologique de σώζω et σωτηρία, ainsi que la valeur durative du participe présent. La répétition, marquée mais intelligible en français, maintient le poids rhétorique et théologique du grec.
- source_word: ἑπτὰ υἱοὺς
  choice: sept fils
  rationale: υἱούς désigne précisément des fils. Aucun possessif n’est ajouté, puisqu’il est absent du texte grec.
- source_word: πρὸς ὀλίγον χρόνον
  choice: pour un peu de temps
  rationale: La formulation rend directement la durée limitée indiquée par le grec et préserve le contraste entre ce salut temporaire et la mort des fils.
theological_decisions:
- issue: Portée de σωτηρία dans le contexte du martyre
  choice: salut, avec la précision qu’il ne sauvait que pour un peu de temps
  alternative: délivrance ou préservation temporaire
  rationale: Le contexte met au premier plan une sauvegarde terrestre et provisoire, mais σωτηρία peut porter une résonance plus large. Garder « salut » tout en conservant la limitation temporelle évite de supprimer cette tension.
translation_notes:
  register: 'Français moderne, international et digne. La répétition « salut qui sauvait » est volontaire : elle reproduit le jeu lexical grec, malgré son caractère légèrement marqué en français.'
