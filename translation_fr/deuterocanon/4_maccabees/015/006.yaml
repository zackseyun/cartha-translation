  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who through seven pregnancies had her affection for them deeply planted within her;
translation:
  language: fr
  text: Mais de toutes les mères, la mère des sept[a] fut celle qui aimait le plus ses enfants, elle en qui l’affection qu’elle leur portait s’était implantée au fil de sept grossesses ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mère des sept ». Le contexte indique qu’il s’agit de ses sept fils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: celle qui aimait le plus ses enfants
  rationale: Le comparatif, associé à « de toutes les mères », prend ici une valeur superlative. Cette formulation française exprime clairement l’affection exceptionnelle de la mère pour ses enfants.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: la mère des sept
  rationale: Le grec dit littéralement « la mère des sept » sans préciser « fils ». Le contexte permet d’identifier les sept comme ses fils, précision laissée en note afin de ne pas l’ajouter au texte.
- source_word: κυοφορίαις
  choice: au fil de sept grossesses
  rationale: κυοφορία désigne la grossesse ou la gestation. « Au fil de » rend naturellement l’idée que cette affection s’est développée à travers ces sept expériences maternelles.
- source_word: ἐπιφυτευομένην
  choice: s’était profondément enracinée
  rationale: Le participe conserve l’image végétale de quelque chose qui est planté ou greffé. « Enracinée » donne en français une métaphore naturelle et forte, tandis que « profondément » explicite son implantation durable.
- source_word: φιλοστοργίαν
  choice: l’affection
  rationale: Le terme désigne une affection tendre et naturelle, notamment familiale. Le contexte maternel suffit à en préciser la nature sans ajouter « maternelle » au grec.
- source_word: πρὸς αὐτούς
  choice: qu’elle leur portait
  rationale: La tournure française idiomatique « porter de l’affection à quelqu’un » restitue l’orientation de cette affection vers les sept enfants.
