  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: fr
  text: Ô raison[a], tyran des passions ! Ô piété, pour une mère plus désirable que ses enfants[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est très condensé et rhétorique. On peut aussi ponctuer : « Ô raison, tyran des passions, et ô piété, pour une mère plus désirable que ses enfants ! »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « plus ardemment désirée » ou « plus chère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμέ
  choice: raison
  rationale: Le vocatif désigne la faculté rationnelle qui maîtrise les passions, thème central de 4 Maccabées. « Raison » est plus naturel en français que « raisonnement » dans cette apostrophe.
- source_word: τέκνων παθῶν
  choice: des passions liées aux enfants
  rationale: Les deux génitifs forment une expression très condensée. Cette formulation conserve le lien avec les enfants sans décider s’il s’agit de passions éprouvées par eux ou d’attachements dont ils sont l’objet.
- source_word: τύραννε
  choice: tyran
  rationale: Le terme garde la métaphore forte et paradoxale de la domination absolue exercée par la raison.
- source_word: εὐσέβεια
  choice: piété
  rationale: Dans ce contexte juif, le mot exprime la fidélité respectueuse envers Dieu et sa loi. « Piété » conserve cette dimension religieuse sans explicitation doctrinale ajoutée.
- source_word: μητρί
  choice: pour une mère
  rationale: Le datif indique ici le point de vue ou l’évaluation de la mère.
- source_word: ποθεινοτέρα
  choice: plus désirable
  rationale: Le comparatif exprime ce qui suscite davantage le désir ou l’aspiration. « Plus désirable » reste proche du grec tout en étant intelligible en français.
theological_decisions:
- issue: Sens religieux de εὐσέβεια dans le cadre du martyre juif
  choice: piété
  alternative: fidélité à Dieu
  rationale: « Piété » rend le terme religieux sans développer dans le texte une précision qui, bien que contextuellement juste, n’est pas explicitement formulée dans ce verset.
- issue: Rapport entre les passions et les enfants dans l’apostrophe initiale
  choice: des passions liées aux enfants
  alternative: des passions des enfants
  rationale: Le grec est fortement condensé. La traduction principale préserve l’ambiguïté entre les passions éprouvées par les enfants et les attachements ou émotions suscités par eux, particulièrement pertinents dans le contexte maternel.
translation_notes:
  register: Apostrophe solennelle et vive, dans un français moderne et accessible. Le rythme abrupt du grec est conservé, tandis que « liées aux enfants » évite de trancher une relation génitive ambiguë.
