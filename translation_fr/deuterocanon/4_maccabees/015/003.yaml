translation:
  language: fr
  text: elle a aimé davantage la piété, qui sauve pour la vie éternelle selon Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « selon Dieu » peut aussi évoquer ce qui est conforme à la volonté ou à la norme de Dieu.
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: εὐσέβειαν
  choice: la piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la dévotion respectueuse envers Dieu qui se manifeste par une conduite fidèle. « Piété » conserve cette valeur thématique.
- source_word: μᾶλλον
  choice: davantage
  rationale: L’adverbe comparatif exprime ici une préférence par rapport à l’attachement naturel évoqué dans le contexte, sans qu’il soit nécessaire d’ajouter explicitement le terme de la comparaison.
- source_word: ἠγάπησεν
  choice: a aimé
  rationale: Le verbe signifie directement « aimer » ; la notion de préférence est déjà portée par μᾶλλον.
- source_word: τὴν σώζουσαν
  choice: qui sauve
  rationale: Le participe présent attributif se rapporte à « la piété ». La proposition relative française en rend directement le sens et l’aspect actif.
- source_word: εἰς αἰώνιον ζωὴν
  choice: pour la vie éternelle
  rationale: εἰς indique ici le but ou l’aboutissement. « Pour la vie éternelle » est naturel en français tout en maintenant cette orientation.
- source_word: κατὰ θεόν
  choice: selon Dieu
  rationale: Cette traduction volontairement resserrée conserve l’ambiguïté de la formule grecque, qui peut évoquer la conformité à la volonté ou à la norme de Dieu.
theological_decisions:
- issue: Portée et sens de κατὰ θεόν par rapport à la piété qui sauve
  choice: selon Dieu
  alternative: conformément à la volonté de Dieu ; selon la norme de Dieu
  rationale: La formule grecque est concise et ne précise pas exactement le rapport envisagé. La traduction ne tranche donc pas entre la volonté, la norme ou l’approbation de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec, notamment dans « selon Dieu », afin de ne pas dissiper une ambiguïté réelle du texte source.
