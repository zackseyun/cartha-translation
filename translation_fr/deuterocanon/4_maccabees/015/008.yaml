  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
translation:
  language: fr
  text: À cause de sa crainte de Dieu, elle ne tint aucun compte du salut passager de ses enfants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la délivrance passagère de ses enfants ». Ici, le mot grec traduit par « salut » désigne leur sauvegarde physique pour un temps, non le salut éternel.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸν πρὸς τὸν θεὸν φόβον
  choice: À cause de sa crainte de Dieu
  rationale: διά avec l’accusatif exprime ici la cause. « Crainte de Dieu » est une tournure française naturelle qui conserve la force de φόβος et son orientation vers Dieu, sans la réduire à une simple peur servile.
- source_word: ὑπερεῖδεν
  choice: elle ne tint aucun compte de
  rationale: Le verbe indique qu’elle passe outre à cette considération et ne lui accorde pas de poids face à une fidélité supérieure. Cette expression évite de suggérer une simple inattention.
- source_word: τὴν τῶν τέκνων πρόσκαιρον σωτηρίαν
  choice: du salut passager de ses enfants
  rationale: σωτηρία peut désigner le salut, la délivrance ou la préservation. « Salut » maintient l’écho lexical et l’ambiguïté du grec, tandis que « passager » précise qu’il s’agit ici d’une sauvegarde physique limitée dans le temps. Le possessif est naturel dans le contexte maternel.
theological_decisions:
- issue: Sens de φόβος à l’égard de Dieu
  choice: crainte de Dieu
  alternative: respect révérenciel pour Dieu
  rationale: « Crainte de Dieu » conserve une catégorie biblique forte et laisse subsister la tension entre peur, révérence et déférence pieuse, au lieu de la résoudre par « respect ».
- issue: Sens de σωτηρία dans le contexte
  choice: salut passager
  alternative: délivrance passagère
  rationale: 'L’adjectif πρόσκαιρον situe la σωτηρία dans l’ordre temporel : il s’agit de préserver momentanément la vie des enfants. Garder « salut » préserve néanmoins la portée lexicale du terme grec; la note écarte ici une lecture exclusivement spirituelle ou éternelle.'
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la causalité du grec, le poids biblique de « crainte de Dieu » et l’ambivalence lexicale de σωτηρία, explicitée sans être effacée par la note.
