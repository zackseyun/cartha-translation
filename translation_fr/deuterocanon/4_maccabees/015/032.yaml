base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: fr
  text: Ainsi, toi aussi, gardienne de la Loi, bien qu’encerclée de toutes parts par le déluge des passions[a] et pressée par les vents violents — les tortures de tes fils —, tu as courageusement enduré les tempêtes de la piété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le déluge des émotions ». Dans 4 Maccabées, le grec πάθη est un terme clé pour les passions ou les émotions que la raison doit maîtriser.
    reason: lexical_alternative
  - marker: b
    text: Ou « les tempêtes de l’attachement à Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοφύλαξ
  choice: gardienne de la Loi
  rationale: Le composé désigne celle qui garde et observe la Loi. « Gardienne » conserve le sens actif et le féminin imposé par le contexte.
- source_word: πανταχόθεν … περικυκλουμένῃ
  choice: encerclée de toutes parts
  rationale: Cette formulation naturelle restitue à la fois l’idée d’encerclement et celle d’une pression venant de toutes les directions.
- source_word: τῷ τῶν παθῶν … κατακλυσμῷ
  choice: le déluge des passions
  rationale: πάθη appartient au vocabulaire central de 4 Maccabées, où la raison pieuse maîtrise les passions. « Déluge » maintient la forte métaphore de κατακλυσμός.
- source_word: καρτεροῖς ἀνέμοις
  choice: des vents violents
  rationale: καρτερός évoque ici la force et la rudesse; « violents » convient à l’image de la tempête.
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: les tortures de tes fils
  rationale: βάσανοι désigne les tortures infligées aux fils. La formulation française est directe et non ambiguë dans ce contexte.
- source_word: συνεχομένη
  choice: assaillie
  rationale: Le participe exprime le fait d’être pressée ou accablée. « Assaillie » s’intègre naturellement à la métaphore des vents.
- source_word: γενναίως ὑπέμεινας
  choice: tu as courageusement enduré
  rationale: La traduction rend la vaillance exprimée par γενναίως et la persévérance sous l’épreuve exprimée par ὑπέμεινας.
- source_word: τοὺς τῆς εὐσεβείας χειμῶνας
  choice: les tempêtes de la piété
  rationale: χειμών désigne ici métaphoriquement une tempête. εὐσέβεια renvoie à la fidélité révérencieuse envers Dieu; « piété » est naturel et précis en français biblique moderne.
theological_decisions:
- issue: Sens de πάθη dans le contexte philosophique et martyrologique
  choice: passions
  alternative: émotions; souffrances
  rationale: Le thème directeur de 4 Maccabées est la maîtrise des πάθη par la raison pieuse. « Passions » garde ce lien conceptuel, tandis que « souffrances » déplacerait le terme vers les épreuves extérieures déjà évoquées par les tortures.
- issue: Sens de εὐσέβεια
  choice: piété
  alternative: attachement à Dieu; fidélité religieuse
  rationale: Le mot désigne une révérence envers Dieu qui se manifeste dans la fidélité. « Piété » préserve cette densité sans ajouter de précision confessionnelle.
- issue: Rapport entre les tortures des fils et les vents
  choice: comparaison explicitée par « comme par »
  alternative: 'apposition directe: « assaillie par les vents violents des tortures de tes fils »'
  rationale: Le grec met les tortures en apposition métaphorique aux vents. L’explicitation légère évite en français une chaîne nominale obscure sans résoudre davantage l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore filée du déluge, des vents et des tempêtes est conservée. La majuscule à « Loi » signale la Loi de Moïse dans ce contexte.
