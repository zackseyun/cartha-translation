base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: fr
  text: Tout en voyant la perte de ses sept enfants et la diversité complexe des supplices, cette mère courageuse, après les avoir tous embrassés[a], les laissa partir à cause de sa foi en Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi signifier « les avoir tous salués » ou « leur avoir à tous fait ses adieux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de sa confiance en Dieu » ou « à cause de sa fidélité envers Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ … ὁρῶσα
  choice: Bien qu’elle ait vu
  rationale: La tournure concessive rend l’action de la mère malgré ce dont elle a été témoin, dans un français naturel.
- source_word: ἑπτὰ τέκνων
  choice: ses sept enfants
  rationale: « Enfants » respecte la portée générale de τέκνα, même si le contexte plus large les présente comme ses fils.
- source_word: ἀπώλειαν
  choice: périr
  rationale: La transposition verbale exprime naturellement en français la destruction mortelle dont les enfants sont victimes, sans réduire le terme à une simple séparation.
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: toute la diversité complexe des tortures
  rationale: Cette formulation conserve à la fois la multiplicité et la complexité des supplices, tout en restant intelligible.
- source_word: ἀπάσασα
  choice: après les avoir tous embrassés
  rationale: Le contexte maternel permet le sens affectueux d’« embrasser »; l’antériorité du participe est rendue explicitement, tandis que les autres sens possibles sont signalés en note.
- source_word: ἡ γενναία μήτηρ
  choice: cette mère courageuse
  rationale: γενναία loue ici sa noblesse morale et surtout son courage; « courageuse » est direct et naturel en français actuel.
- source_word: ἐξελυσεν
  choice: les laissa partir
  rationale: 'L’expression conserve l’image du relâchement ou du dessaisissement: elle ne les retient pas, mais consent à les livrer à leur destinée.'
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: à cause de sa foi en Dieu
  rationale: « À cause de » rend la valeur causale de διά avec l’accusatif; « foi en Dieu » est plus idiomatique en français que « foi envers Dieu », tout en gardant la relation dirigée vers Dieu.
theological_decisions:
- issue: Portée de πίστις
  choice: foi en Dieu
  alternative: confiance en Dieu; fidélité envers Dieu
  rationale: « Foi » conserve le terme théologique sans trancher silencieusement entre confiance et fidélité; ces nuances contextuellement possibles sont maintenues en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la concession initiale et le contraste entre l’horreur observée et la résolution de la mère, tout en évitant une formulation trop littérale ou artificielle.
