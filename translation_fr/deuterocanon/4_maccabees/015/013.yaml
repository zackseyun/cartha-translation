base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
translation:
  language: fr
  text: Ô nature sacrée[a], affections des parents, tendre affection envers les parents, soins nourriciers, et passions indomptables des mères[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lien naturel ». Le grec φύσις peut désigner la nature elle-même ou l’ordre naturel qui se manifeste dans les liens familiaux.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « passions » désigne ici des émotions ou des affections puissantes, et non nécessairement des désirs désordonnés.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: nature sacrée
  rationale: « Nature sacrée » traduit directement l’apostrophe solennelle et laisse φύσις désigner à la fois la nature et l’ordre naturel qui se manifeste dans les liens familiaux.
- source_word: φίλτρα γονέων
  choice: amour des parents
  rationale: 'Dans ce contexte familial, φίλτρα évoque l’amour et les liens affectifs plutôt que son sens possible de « charmes » ou de « philtres ». Le génitif reste naturellement ambigu : il peut faire entendre l’amour éprouvé par les parents ou l’amour qui leur est attaché.'
- source_word: γονεύσιν φιλοστόργε
  choice: tendre affection envers les parents
  rationale: φιλοστόργος exprime une affection naturelle et tendre au sein de la famille ; le datif γονεύσιν indique ici les parents comme destinataires de cette affection.
- source_word: τροφεῖα
  choice: soins qui élèvent les enfants
  rationale: Le terme appartient au champ de l’entretien et de l’éducation reçus durant l’enfance. Cette formulation concrète le sens dans un français courant sans le réduire au seul allaitement.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: sentiments indomptables des mères
  rationale: ἀδάμαστα signifie « indomptables, invincibles » et πάθη désigne ici de puissants mouvements affectifs. « Sentiments » évite la connotation moderne souvent négative de « passions », tandis qu’« indomptables » conserve la force de l’expression.
theological_decisions:
- issue: La phrase décrit-elle une doctrine de l’ordre familial sanctifié ou constitue-t-elle une apostrophe rhétorique aux liens naturels de la famille ?
  choice: Une apostrophe rhétorique qui célèbre la dignité et la puissance des affections familiales naturelles.
  alternative: Une affirmation doctrinale selon laquelle l’ordre familial serait en lui-même sanctifié.
  rationale: Le Ὦ initial et l’accumulation de termes affectifs donnent au verset la forme d’une exclamation solennelle. « Sacrée » conserve l’évaluation de l’auteur sans transformer cette figure rhétorique en définition doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. L’exclamation unique conserve le mouvement accumulatif de l’apostrophe grecque ; la répétition de « parents » est maintenue pour distinguer l’amour parental de l’affection dirigée envers eux.
