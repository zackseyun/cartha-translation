  naturalness: La série nominale est volontairement solennelle et elliptique, comme le grec. « Soins nourriciers » est plus idiomatique, plus concis et plus parallèle aux autres membres de l’énumération que « soins qui élèvent les enfants ».
  terminology: « Nature sacrée », « tendre affection envers les parents » et « passions indomptables des mères » rendent respectivement φύσις ἱερά, γονεύσιν φιλοστόργε et μητέρων ἀδάμαστα πάθη sans imposer de lecture doctrinale. La note explique utilement « passions » dans son sens affectif non péjoratif.
