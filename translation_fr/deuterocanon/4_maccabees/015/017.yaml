  text: O mother[a], now tested by pains more bitter than the birth pangs for them.
translation:
  language: fr
  text: Ô mère, maintenant éprouvée par des souffrances plus amères que les douleurs de leur naissance[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les douleurs de l’enfantement liées à eux » ; il s’agit des douleurs qu’elle a ressenties en les mettant au monde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικροτέρων
  choice: plus amères
  rationale: Le comparatif de πικρός conserve ici la métaphore de l’amertume et la force pathétique de l’expression grecque.
- source_word: μήτηρ
  choice: mère
  rationale: Le nom est employé en apostrophe directe; « mère » est l’équivalent français simple et naturel.
- source_word: πόνων
  choice: souffrances
  rationale: Dans ce contexte d’épreuve extrême, « souffrances » rend mieux l’étendue de πόνοι que « douleurs », tout en évitant une répétition avec les douleurs de l’enfantement.
- source_word: πειρασθεῖσα
  choice: éprouvée
  rationale: Le participe exprime à la fois l’expérience de la souffrance et la mise à l’épreuve; « éprouvée » préserve cette double nuance.
- source_word: ἤπερ
  choice: que
  rationale: La particule introduit le second terme de la comparaison commandée par « plus amères ».
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: les douleurs de leur naissance
  rationale: ὠδῖνες désigne les douleurs de l’enfantement, et ἐπ’ αὐτοῖς les rattache aux fils. Cette formulation française exprime naturellement les douleurs ressenties lorsqu’elle les a mis au monde, sans alourdir la phrase.
