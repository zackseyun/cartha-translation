  text: une mère tenant en main deux jetons de vote pour ses enfants[a], l’un mortel et l’autre salvateur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux votes »; plus littéralement, « deux cailloux », puisque ψῆφος désignait à l’origine un caillou utilisé pour voter.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύο
  choice: deux
  rationale: Le cardinal grec détermine directement ψήφους.
- source_word: ψήφους
  choice: suffrages
  rationale: ψῆφος désigne d’abord le petit caillou servant à voter, puis le vote ou suffrage lui-même. « Suffrages » conserve ici l’image d’une décision solennelle tout en restant naturel en français.
- source_word: κρατοῦσα
  choice: tenant en main
  rationale: Le participe présent exprime une possession concrète et active; cette formulation préserve l’image des cailloux ou jetons de vote.
- source_word: μήτηρ
  choice: une mère
  rationale: Le nom sans article est rendu naturellement en français par un groupe nominal indéfini.
- source_word: θανατηφόρον
  choice: porteur de mort
  rationale: Cette expression restitue étroitement le sens de l’adjectif composé, « qui apporte la mort », et maintient le parallélisme avec « porteur de salut ».
- source_word: σωτήριον
  choice: de salut
  rationale: Dans l’expression parallèle « porteur de salut », le terme garde sa portée ouverte entre préservation, délivrance et salut, sans réduire d’avance la tension propre au contexte du martyre.
- source_word: ὑπὲρ τέκνων
  choice: pour ses enfants
  rationale: « Pour » rend avec naturel la relation de la décision maternelle à ses enfants, sans préciser excessivement s’il s’agit de représentation, d’intérêt ou de décision à leur sujet.
theological_decisions:
- issue: Portée de σωτήριον dans le contexte du martyre
  choice: porteur de salut
  alternative: salvateur / porteur de délivrance
  rationale: « Salut » conserve l’amplitude du grec, qui peut évoquer préservation, délivrance ou salut au sens plus fort. La traduction ne tranche donc pas une question théologique que ce membre de phrase laisse ouverte.
translation_notes:
  register: Français moderne, digne et lisible. « Tenant en main » maintient l’image concrète, tandis que « suffrages » évite l’étrangeté de « tenir deux votes » sans effacer la métaphore judiciaire ou délibérative.
