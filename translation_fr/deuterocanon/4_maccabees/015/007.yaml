translation:
  language: fr
  text: et, à cause des nombreuses douleurs de l’enfantement qu’elle avait éprouvées pour chacun d’eux, contrainte de ressentir de la compassion pour eux,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠδῖνας
  choice: douleurs de l’enfantement
  rationale: Le terme désigne proprement les douleurs de l’accouchement. Dans le contexte de la mère et de ses fils, cette traduction conserve l’image maternelle précise plutôt que de l’atténuer en « souffrances ».
- source_word: τὰς καθʼ ἕκαστον αὐτῶν
  choice: qu’elle avait éprouvées pour chacun d’eux
  rationale: La tournure distributive rattache les douleurs maternelles à chacun des fils. Le sujet féminin, implicite dans le grec, est explicité en français pour rendre la phrase naturelle.
- source_word: συμπάθειαν
  choice: de la compassion
  rationale: Le mot exprime le fait de partager affectivement la souffrance d’autrui; « compassion » est ici clair, actuel et digne.
- source_word: ἠναγκασμένην
  choice: contrainte
  rationale: Le participe féminin accusatif est conservé sous forme participiale afin de respecter la syntaxe fragmentaire du verset et son lien avec le contexte précédent.
theological_decisions:
- issue: Origine des douleurs évoquées
  choice: Les douleurs de l’enfantement éprouvées par la mère pour chacun de ses fils
  alternative: Les souffrances endurées par chacun des fils
  rationale: Le sens propre de ὠδῖνας et la construction καθʼ ἕκαστον αὐτῶν favorisent les douleurs maternelles associées à chaque enfant. Traduire qu’elles furent subies par les fils introduirait un sujet que le grec n’exprime pas.
translation_notes:
  register: Français international moderne, naturel et soutenu. La virgule finale et la construction participiale maintiennent le caractère syntaxiquement dépendant de ce segment dans son contexte.
