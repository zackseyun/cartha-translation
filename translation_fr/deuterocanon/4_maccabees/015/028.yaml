  text: But the daughter remembered the steadfastness of Abraham, who feared God.
translation:
  language: fr
  text: Mais la fille se souvint de la constance d’Abraham, qui craignait Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du pieux Abraham » ou « d’Abraham, qui révère Dieu ».'
    reason: Alternative lexicale et syntaxique pour θεοσεβοῦς, adjectif attributif qualifiant Abraham.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque un contraste avec le contexte précédent ; « Mais » est l’équivalent français le plus direct et naturel.
- source_word: θεοσεβοῦς
  choice: qui craignait Dieu
  rationale: L’adjectif qualifie Abraham comme révérencieux envers Dieu. La proposition relative conserve explicitement la référence à Dieu et produit une formulation française naturelle.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: καρτερίας
  choice: constance
  rationale: Le nom désigne la fermeté et l’endurance résolue dans l’épreuve. « Constance » convient à l’exemplarité morale d’Abraham sans réduire le sens à la seule durée.
- source_word: θυγάτηρ
  choice: la fille
  rationale: Le grec emploie le nom avec l’article, sans possessif explicite. « La fille » respecte cette formulation et n’ajoute pas « sa ».
- source_word: ἐμνήσθη
  choice: se souvint
  rationale: L’aoriste de μιμνῄσκομαι signifie se souvenir ou se rappeler. Le passé simple convient au registre narratif digne du passage.
theological_decisions:
- issue: Rendre θεοσεβοῦς en conservant la référence explicite à Dieu
  choice: qui craignait Dieu
  alternative: le pieux Abraham ; Abraham, respectueux de Dieu
  rationale: Le composé grec contient explicitement θεο- (« Dieu »). La traduction retenue garde cette référence et présente Abraham comme modèle de révérence envers Dieu, tout en signalant les autres constructions possibles.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple maintient le ton narratif. « La fille » conserve l’absence de possessif du grec ; « constance » exprime une endurance ferme sans surinterprétation.
