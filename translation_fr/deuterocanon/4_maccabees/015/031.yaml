  source_fidelity: « Sur le déluge » atténue le cadre exprimé par ἐν (« dans/au milieu du déluge ») et peut évoquer une position au-dessus des eaux plutôt que le fait d’y être emportée. « Emportée au milieu du déluge » rend clairement le participe passif κοσμοφορουμένη dans son contexte. « Qui remplissait le monde » reflète de près κοσμοπληθεῖ sans ajouter l’idée, possible mais plus interprétative, de submersion.
  naturalness: La formulation révisée est naturelle en français international soutenu. « Car, de même que » est plus idiomatique et moins redondant que « Car, tout comme ». La virgule finale est conservée, car la comparaison se poursuit dans le verset suivant.
  terminology: « L’arche de Noé », « déluge » et « vagues » sont exacts et usuels. « Résista fermement » transmet de façon idiomatique καρτερῶς ὑπήνεγκεν, soit l’endurance ferme face aux flots.
