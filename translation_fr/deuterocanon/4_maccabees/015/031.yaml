  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: fr
  text: Car, de même que l’arche de Noé, emportée au milieu du déluge qui remplissait le monde, résista fermement aux vagues,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Car, tout comme
  rationale: Introduit explicitement la comparaison tout en conservant la valeur explicative de γάρ.
- source_word: ἡ Νῶε κιβωτός
  choice: l’arche de Noé
  rationale: Désignation biblique consacrée et immédiatement compréhensible.
- source_word: ἐν τῷ κοσμοπληθεῖ κατακλυσμῷ
  choice: sur le déluge qui submergeait le monde
  rationale: Rend naturellement l’ampleur universelle exprimée par le composé κοσμοπληθεῖ; « sur » s’accorde avec l’image de l’arche portée par les eaux.
- source_word: κοσμοφορουμένη
  choice: portée
  rationale: Conserve la forme passive et le mouvement de l’arche sans imposer une analyse trop précise du composé rare.
- source_word: καρτερῶς ὑπήνεγκεν
  choice: résista fermement
  rationale: Exprime à la fois l’endurance résolue de καρτερῶς et l’idée de tenir sous l’assaut portée par ὑπήνεγκεν.
- source_word: τοὺς κλύδωνας
  choice: aux vagues
  rationale: Traduction claire des eaux agitées ou des lames; elle s’intègre naturellement avec « résista ».
theological_decisions:
- issue: Portée typologique de l’image du déluge
  choice: Maintenir la comparaison avec l’arche de Noé sans l’expliciter théologiquement
  alternative: Développer l’image comme symbole du martyre ou du salut
  rationale: Le texte établit une analogie d’endurance, mais n’en formule pas ici une interprétation doctrinale détaillée.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La virgule finale est conservée puisque le verset forme une proposition comparative appelée à se poursuivre.
