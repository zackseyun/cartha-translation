    rationale: La note présente « qui remplissait le monde » comme une simple alternative alors que cette formulation reflète plus directement κοσμοπληθεῖ; son commentaire sur un rattachement syntaxique différent n’est pas nécessaire pour le grec de ce verset. La révision l’intègre au texte et supprime une note devenue redondante.
