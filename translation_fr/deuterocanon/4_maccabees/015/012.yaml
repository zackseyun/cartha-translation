  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: fr
  text: Mais la mère exhortait chacun de ses fils, l’un après l’autre[a], ainsi que tous ensemble, à mourir par piété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun séparément ». Le grec oppose l’exhortation adressée à chaque fils individuellement à celle qui s’adresse à tous comme groupe.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour la piété » ou « dans la piété ». Le grec qualifie la mort par l’εὐσέβεια, terme qui peut désigner la piété ou la dévotion respectueuse envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mais
  rationale: Marque une légère opposition ou relance par rapport au contexte précédent; « Mais » reste naturel sans surcharger l’emphase.
- source_word: καθʼ ἕνα παῖδα
  choice: chacun de ses fils séparément
  rationale: καθʼ ἕνα a une valeur distributive (« un par un », « chacun séparément »), tandis que παῖδα désigne ici l’un des fils de la mère.
- source_word: ὁμοῦ πάντας
  choice: tous ensemble
  rationale: Préserve à la fois la totalité exprimée par πάντας et l’idée de groupe exprimée par ὁμοῦ.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Traduction directe et naturelle du groupe nominal grec.
- source_word: ἐπὶ ... προέτρεπεν
  choice: encourageait ... à aller vers
  rationale: προτρέπω exprime une exhortation ou un encouragement, et ἐπί avec l’accusatif indique ici le but vers lequel elle les poussait.
- source_word: τὸν ... θάνατον
  choice: la mort
  rationale: Le grec dit simplement « la mort »; le contexte de martyre ne doit pas remplacer lexicalement ce terme.
- source_word: τῆς εὐσεβείας
  choice: par fidélité à Dieu
  rationale: Dans ce contexte, εὐσέβεια désigne une piété ou un respect fidèle envers Dieu. Cette formulation française actuelle explicite sobrement la dimension religieuse du terme sans lui donner un sens confessionnel technique.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: fidélité à Dieu
  alternative: piété; respect envers Dieu
  rationale: Le génitif relie la mort à l’attachement religieux qui la motive ou la caractérise. « Par fidélité à Dieu » rend ce rapport de manière intelligible tout en signalant en note l’autre construction possible.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait restitue l’aspect imperfectif de προέτρεπεν. La répétition contrastée « chacun... séparément / tous ensemble » conserve la structure rhétorique grecque.
