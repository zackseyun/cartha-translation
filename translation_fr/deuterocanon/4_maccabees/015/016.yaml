lexical_decisions:
- source_word: σάρκας
  choice: chairs
  rationale: Le pluriel concret de σάρξ conserve ici la violence de l’image et évite d’atténuer le texte par « corps ».
- source_word: ὥσπερ
  choice: comme
  rationale: Rend simplement et naturellement la comparaison introduite par ὥσπερ.
- source_word: προσωπεῖα
  choice: masques
  rationale: Le terme désigne normalement des masques, notamment de théâtre, plutôt que de simples visages; cette traduction préserve l’image saisissante du grec.
- source_word: προκειμένας
  choice: étalées
  rationale: Le participe de πρόκειμαι décrit ce qui est disposé ou exposé à la vue. « Étalées » convient au caractère concret de la scène sans ajouter un complément absent du fragment grec.
theological_decisions: []
translation_notes:
  register: Formulation brève, concrète et digne. Le pluriel inhabituel « chairs » est maintenu pour correspondre au pluriel grec et préserver la force viscérale de l’image. Le possessif « leurs » est fourni par le contexte français, tandis que « devant eux » n’est pas ajouté, car il n’apparaît pas explicitement dans le fragment grec transmis.
