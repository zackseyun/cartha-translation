  text: a mother[a], with two things set before her—piety[b], and the temporary safety of her seven sons according to the tyrant’s promise—
translation:
  language: fr
  text: 'une mère devant laquelle deux choix se présentaient : la fidélité à Dieu[a] et la sauvegarde temporaire[b] de ses sept fils, conformément à la promesse du tyran —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la piété » ou « le respect de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: La promesse du tyran portait sur la préservation momentanée de leur vie; le grec peut aussi signifier « délivrance » ou « salut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: une mère
  rationale: Le nom sans article s’insère ici en apposition dans le mouvement de la phrase; l’indéfini est naturel en français, même si le contexte permet d’identifier cette mère.
- source_word: δυεῖν προκειμένων
  choice: devant laquelle deux choix se présentaient
  rationale: La construction circonstancielle indique que deux possibilités étaient placées devant elle. « Choix » explicite naturellement l’enjeu de la décision sans supprimer l’image de ce qui se présente à elle.
- source_word: εὐσεβείας
  choice: la fidélité à Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la piété concrète et loyale envers Dieu. Cette formulation actuelle exprime l’orientation religieuse du terme et convient au contexte du martyre.
- source_word: τῆς ἑπτὰ υἱῶν σωτηρίας προσκαίρου
  choice: la sauvegarde temporaire de ses sept fils
  rationale: σωτηρία désigne ici la préservation de la vie promise par le tyran, tandis que πρόσκαιρος souligne son caractère passager. « Sauvegarde » conserve l’idée de préservation sans suggérer le salut éternel.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: conformément à la promesse du tyran
  rationale: κατά avec l’accusatif marque ici la conformité à ce que le tyran avait promis; « promesse » rend directement ὑπόσχεσις.
theological_decisions:
- issue: Traduction de εὐσέβεια dans le contexte du martyre
  choice: la fidélité à Dieu
  alternative: la piété
  rationale: Le terme oppose l’attachement loyal à Dieu à la préservation physique proposée par le tyran. « Fidélité à Dieu » rend explicite cette orientation tout en restant naturelle en français moderne.
- issue: Traduction de σωτηρία dans un contexte de préservation terrestre
  choice: la sauvegarde temporaire
  alternative: le salut temporaire
  rationale: Il s’agit de la survie momentanée des fils selon la promesse du tyran, et non du salut au sens théologique. La traduction évite donc une association doctrinale indue.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset étant un fragment syntaxique qui se poursuit dans le contexte, le tiret final est conservé. Les deux termes grecs au génitif sont rendus comme les deux choix placés devant la mère.
