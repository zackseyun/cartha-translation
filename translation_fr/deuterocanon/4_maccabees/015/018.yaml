  text: O only woman who gave birth to godliness in its fullness[a][b].
translation:
  language: fr
  text: Ô femme, seule à avoir enfanté la piété tout entière[a][b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ô femme unique » ou « Ô toi, la seule des femmes ». Le grec souligne qu’elle se distingue de toutes les autres femmes à cet égard.
    reason: lexical_alternative
  - marker: b
    text: Ou « la dévotion tout entière ». Le grec εὐσέβεια désigne la piété, c’est-à-dire une attitude de respect et de dévouement envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ô
  rationale: Marque l’interpellation au vocatif et conserve le ton rhétorique élevé du grec.
- source_word: μόνη γύναι
  choice: femme, la seule
  rationale: Exprime la singularité fortement soulignée par μόνη tout en restant naturel en français; le contexte présente cette femme comme unique en son genre.
- source_word: τὴν εὐσέβειαν
  choice: une fidélité envers Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la fidélité dévote et respectueuse orientée vers Dieu; cette formulation explicite cette orientation sans réduire le terme à un simple sentiment religieux.
- source_word: ὁλόκληρον
  choice: entière
  rationale: Rend l’idée d’intégrité, de totalité et d’absence de partage portée par ὁλόκληρος.
- source_word: ἀποκυήσασα
  choice: avoir enfanté
  rationale: Préserve l’image explicite de l’accouchement, essentielle à la rhétorique maternelle du passage.
theological_decisions:
- issue: Métaphore de l’enfantement appliquée à εὐσέβεια
  choice: 'Conserver littéralement l’image: « avoir enfanté une fidélité entière envers Dieu »'
  alternative: avoir fait naître une parfaite piété
  rationale: Le grec emploie délibérément le vocabulaire de l’enfantement. Maintenir cette métaphore respecte le rôle maternel développé dans le contexte et évite de la remplacer par l’idée plus abstraite de « produire ».
- issue: Portée religieuse de εὐσέβεια
  choice: fidélité envers Dieu
  alternative: piété
  rationale: Le terme peut être rendu par « piété », mais il évoque ici une conduite de dévouement fidèle envers Dieu. La traduction choisie en fait ressortir la direction théologique sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Ô » et l’exclamation conservent l’apostrophe solennelle; « enfanter » maintient l’image maternelle marquante du grec.
