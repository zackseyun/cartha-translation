base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/032.yaml
  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: fr
  text: Car, si les passions avaient triomphé de la raison, je leur aurais rendu témoignage de leur victoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de leur domination » ou « de leur suprématie ».'
    reason: Le grec ἐπικρατία peut désigner la victoire, la domination ou la prépondérance.
lexical_decisions:
- source_word: πάθη
  choice: les passions
  rationale: Dans le cadre moral et philosophique de 4 Maccabées, le terme désigne les mouvements affectifs ou impulsions opposés à la raison, et non des souffrances extérieures.
- source_word: λογισμοῦ
  choice: la raison
  rationale: Le mot désigne ici la faculté de jugement rationnel. « La raison » conserve clairement le contraste structurant avec « les passions ».
- source_word: κεκράτηκει
  choice: avaient triomphé de
  rationale: Le verbe exprime le fait de l’emporter sur quelqu’un ou de le dominer. Le plus-que-parfait français rend la valeur accomplie du plus-que-parfait grec.
- source_word: ἀπεδόμην
  choice: je leur aurais rendu
  rationale: ἀποδίδωμι signifie rendre, accorder ou attribuer. Avec μαρτυρίαν, « rendre témoignage » est naturel en français et conserve l’image testimoniale.
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: Ce choix préserve la nuance de témoignage ou d’attestation présente dans le grec.
- source_word: ἐπικρατίας
  choice: leur victoire
  rationale: Le nom désigne la prépondérance, la domination ou le fait de l’emporter. Dans cette condition irréelle, la victoire serait celle des passions sur la raison; le possessif explicite cette relation sans introduire l’idée absente du grec d’une maîtrise de soi du locuteur.
theological_decisions:
- issue: Opposition anthropologique entre les passions et la raison
  choice: Conserver les catégories philosophiques explicites « passions » et « raison »
  alternative: « Si mes désirs avaient eu raison de mon jugement »
  rationale: La formulation retenue maintient l’opposition conceptuelle du texte sans l’assimiler à des catégories doctrinales ultérieures ni réduire sa portée à une expérience purement individuelle.
- issue: Référent de la domination exprimée par ἐπικρατίας
  choice: La victoire des passions
  alternative: La maîtrise de soi du locuteur
  rationale: Le datif τούτοις renvoie aux passions, qui recevraient le témoignage si elles avaient triomphé de la raison. Le grec ne comporte aucun possessif équivalant à « ma »; comprendre ici la maîtrise de soi du locuteur rendrait la condition difficilement cohérente.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « rendre témoignage » conserve la couleur judiciaire du grec, tandis que « triompher de » exprime naturellement le rapport de force entre les passions et la raison.
