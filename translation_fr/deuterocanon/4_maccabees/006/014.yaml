  yaml_path: translation/deuterocanon/4_maccabees/006/014.yaml
  text: Why are you irrationally destroying yourself with these evils[a], Eleazar?
translation:
  language: fr
  text: Pourquoi, contre toute raison, te détruis-tu par ces maux[a], Éléazar ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ces maux » ou « à cause de ces maux » ; le datif grec peut indiquer le moyen ou la circonstance. Dans le contexte, il s’agit des souffrances infligées à Éléazar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette question de reproche, τί demande la raison ou le motif de l’action.
- source_word: τοῖς κακοῖς τούτοις
  choice: par ces maux
  rationale: Le datif peut exprimer le moyen ou la circonstance. « Maux » conserve l’étendue de κακά sans préciser abusivement « tortures » ou « souffrances ».
- source_word: σεαυτόν
  choice: toi-même
  rationale: Le pronom réfléchi est l’objet direct de ἀπόλλυες et reçoit ici sa valeur emphatique naturelle.
- source_word: ἀλογίστως
  choice: contre toute raison
  rationale: Cette formulation française naturelle exprime une conduite dépourvue de raison et maintient le lien avec le thème majeur du livre, l’opposition entre raison et passions.
- source_word: ἀπόλλυες
  choice: te détruis-tu
  rationale: Le verbe actif avec le réfléchi présente Éléazar, dans le reproche de son interlocuteur, comme causant sa propre perte; le présent français rend l’action en cours dans la scène.
- source_word: Ἐλεάζαρ
  choice: Éléazar
  rationale: Forme française usuelle du nom propre biblique.
theological_decisions:
- issue: Sens de κακοῖς dans le contexte du martyre d’Éléazar
  choice: maux
  alternative: souffrances; supplices; tortures
  rationale: Le grec reste plus large qu’un terme technique désignant la torture. « Maux » préserve cette portée tout en laissant le contexte indiquer les traitements infligés à Éléazar.
- issue: Point de vue exprimé par le verbe réfléchi
  choice: te détruis-tu toi-même
  alternative: te laisses-tu détruire
  rationale: Le texte formule l’accusation du locuteur au moyen d’un verbe actif et d’un objet réfléchi. La traduction ne transforme donc pas cette accusation en construction passive, sans pour autant l’endosser comme jugement du narrateur.
translation_notes:
  register: Français international moderne, clair et digne. « Contre toute raison » est plus idiomatique que « irrationnellement » tout en conservant le vocabulaire conceptuel de la raison. L’ordre des mots garde la force du reproche et l’adresse finale à Éléazar.
