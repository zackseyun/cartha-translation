- source_word: τὰ τοῦ γήρως αὐτοῦ
  choice: les marques de son grand âge
  rationale: L’expression grecque elliptique désigne ce qui caractérise ou manifeste son âge avancé; cette formulation explicite l’idiome sans en réduire le sens au seul fait de la vieillesse.
- source_word: τὰ μὲν
  choice: certains
  rationale: μέν annonce le premier terme d’un contraste poursuivi dans la suite. « certains » prépare naturellement le terme correspondant sans alourdir le fragment.
