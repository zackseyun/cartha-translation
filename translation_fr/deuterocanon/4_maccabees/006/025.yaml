  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
translation:
  language: fr
  text: Là[a], tandis qu’ils le brûlaient à l’aide d’instruments ingénieusement conçus pour faire le mal[b], ils se ruaient sur lui[c] et lui versaient dans les narines des liquides nauséabonds[d].
