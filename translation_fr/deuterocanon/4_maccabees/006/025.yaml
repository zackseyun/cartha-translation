  footnotes:
  - marker: a
    text: Ou « Alors » ou « À cet endroit-là ». Le mot grec peut marquer le lieu de la scène ou servir de transition dans le récit.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque souligne que ces instruments avaient été habilement conçus pour faire le mal.
    reason: lexical_clarification
  - marker: c
