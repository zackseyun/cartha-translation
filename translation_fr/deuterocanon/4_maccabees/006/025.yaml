lexical_decisions:
- source_word: ἔνθα
  choice: Là
  rationale: L’adverbe situe vivement l’action dans la scène qui vient d’être décrite. « Là » conserve cette valeur spatiale, tout en pouvant servir de transition narrative.
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: avec des instruments de torture conçus avec une cruelle ingéniosité
  rationale: ὄργανα désigne des instruments ou dispositifs, tandis que κακότεχνος évoque une habileté mise au service du mal. Dans ce contexte, la formulation rend à la fois leur fonction tortionnaire et leur conception malveillante.
- source_word: καταφλέγοντες
  choice: tandis qu’ils le brûlaient
  rationale: Le verbe exprime une brûlure intense. La tournure avec « tandis que » restitue naturellement le participe grec et la simultanéité des sévices.
- source_word: ὑπερίπτοσαν
  choice: ils se ruèrent sur lui
  rationale: Le verbe décrit un mouvement violent par lequel on bondit ou se précipite sur quelqu’un. « Se ruèrent sur lui » est idiomatique en français et conserve la force de l’assaut.
- source_word: δυσώδεις χυλούς
  choice: des liquides nauséabonds
  rationale: δυσώδης signifie « malodorant, fétide » et χυλός peut désigner un jus, un bouillon ou une préparation liquide. « Liquides » préserve ici l’étendue du terme sans imposer une consistance précise.
- source_word: εἰς τοὺς μυκτῆρας αὐτοῦ κατέχεον
  choice: lui versèrent dans les narines
  rationale: μυκτῆρες désigne précisément les narines. Le verbe à l’imparfait décrit l’action de verser ; le passé simple convient au récit français, sans exclure une action prolongée.
