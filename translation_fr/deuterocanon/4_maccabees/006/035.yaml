  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: fr
  text: Même si cela est ridicule, je démontre non seulement que la raison a pris le dessus sur les douleurs, mais aussi qu’elle maîtrise les plaisirs et ne leur cède pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: Même si cela paraît ridicule
  rationale: La tournure grecque est elliptique. « Cela » restitue naturellement l’implicite en français, tandis que « paraît ridicule » conserve la concession sans transformer γελοῖον en jugement catégorique.
- source_word: ἀλγηδόνων
  choice: douleurs
  rationale: Le nom désigne directement les expériences douloureuses. « Tourments » renforcerait indûment le terme sous l’influence du contexte de torture.
- source_word: ἐπιδείκνυμι
  choice: je démontre
  rationale: Le verbe exprime ici une mise en évidence, voire une démonstration publique, ce qui convient à la portée rhétorique de la déclaration.
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: que la raison a pris le dessus
  rationale: Le parfait indique une maîtrise effectivement acquise. « A pris le dessus » rend cette victoire de façon naturelle tout en gardant l’idée de domination.
- source_word: τὸν λογισμόν
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle qui gouverne les passions. « La raison » est clair, concis et respecte la portée philosophique du terme.
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: qu’elle maîtrise les plaisirs
  rationale: κρατεῖν exprime la domination ou la maîtrise. Cette formulation préserve le parallèle avec la victoire sur les douleurs sans répétition maladroite.
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: et ne leur cède pas
  rationale: ὑπείκειν signifie céder ou se soumettre. La formulation française conserve l’image d’une résistance ferme aux plaisirs.
theological_decisions:
- issue: Traduction de λογισμός dans le contexte philosophique et religieux du martyre
  choice: la raison
  alternative: le jugement rationnel
  rationale: « La raison » maintient le terme directeur de l’argument du livre sans introduire un jargon philosophique plus étroit ni résoudre la tension entre faculté rationnelle et discernement pieux.
- issue: Degré d’intensité donné à ἀλγηδόνων dans le contexte de la torture
  choice: douleurs
  alternative: tourments
  rationale: Le contexte implique des souffrances extrêmes, mais le mot lui-même signifie plus simplement « douleurs ». La traduction évite donc une intensification contextuelle non imposée par le lexème.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure argumentative et le parallélisme entre douleurs et plaisirs sont conservés; l’ellipse initiale grecque est légèrement explicitée par « cela » pour obtenir une phrase française naturelle.
