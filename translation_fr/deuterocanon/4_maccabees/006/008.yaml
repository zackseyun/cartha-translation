  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: fr
  text: Et voilà que l’un des gardes cruels[a], bondissant contre ses flancs, le frappait à coups de pied pour le forcer à se relever alors qu’il tombait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « porte-lances » ; le terme désigne ici des gardes armés au service du souverain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάξ
  choice: à coups de pied
  rationale: L’adverbe signifie « avec le talon, à coups de pied » et précise la manière dont le garde frappait. Ce sens concret convient à la construction λάξ…ἔτυπτεν.
- source_word: γέ τοι
  choice: Et même
  rationale: La combinaison apporte une insistance à la progression du récit. « Et même » en restitue naturellement la force sans alourdir la phrase.
- source_word: τῶν πικρῶν
  choice: cruels
  rationale: Appliqué à des personnes dans cette scène de torture, πικρός décrit leur dureté impitoyable plutôt qu’une amertume littérale.
- source_word: δορυφόρων
  choice: gardes
  rationale: Le mot désigne littéralement des « porte-lances », puis des gardes armés ou gardes du corps. « Gardes » exprime clairement leur fonction, tandis que la note conserve l’image grecque.
- source_word: κενεῶνας
  choice: flancs
  rationale: Le terme vise les parties creuses des côtés du corps. « Flancs » est précis, naturel dans ce contexte physique et plus évocateur que « côtés ».
- source_word: ἐναλλόμενος
  choice: s’élançant contre
  rationale: Le participe évoque un mouvement brusque et énergique dirigé contre la victime. Cette formulation préserve la violence dynamique de la scène.
- source_word: ἔτυπτεν
  choice: ne cessait de lui donner
  rationale: L’imparfait grec présente des coups répétés ou continus. Avec « des coups de pied », « ne cessait de lui donner » rend naturellement cet aspect itératif.
- source_word: ὅπως ἐξανίσταιτο πίπτων
  choice: afin qu’il se relève chaque fois qu’il tombait
  rationale: 'La proposition exprime le but des coups : contraindre la victime à se remettre debout lorsqu’elle s’effondrait. « Chaque fois » explicite naturellement la valeur répétée suggérée par les imparfaits et le participe dans cette scène.'
theological_decisions:
- issue: Risque de comprendre ἐξανίσταιτο comme une allusion à la résurrection
  choice: se relever physiquement après être tombé
  alternative: se relever avec une possible résonance de résurrection
  rationale: Le contexte immédiat décrit une torture visant à remettre la victime debout. Le français « se relever » exprime directement ce mouvement physique sans introduire une affirmation théologique absente du passage.
translation_notes:
  register: Français international moderne, digne et narratif. La formulation garde la brutalité concrète et le mouvement de la scène, tout en évitant un calque obscur. L’imparfait et « ne cessait de » rendent la répétition des coups.
