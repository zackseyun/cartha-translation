review_pass:
  verdict: revise
  source_fidelity: 'Le texte grec contient λάξ (« à coups de pied / du talon »), que le brouillon restitue bien dans la proposition principale. En revanche, « chaque fois » ajoute une répétition distributive qui n’est pas exprimée par πίπτων, lequel décrit plus directement l’action simultanée : « alors qu’il tombait ». La valeur de but de ὅπως ἐξανίσταιτο est conservée par « pour le forcer à se relever ».'
  naturalness: La formulation révisée est naturelle en français moderne et garde le caractère vif et violent de la scène. « Bondissant contre ses flancs » rend le mouvement énergique de ἐναλλόμενος sans le réduire à une simple localisation des coups.
  terminology: « Gardes cruels » convient pour τῶν πικρῶν δορυφόρων. La note sur δορυφόροι (« porte-lances ») est exacte et utile. « Se relever » rend ici le relèvement physique sans introduire de connotation de résurrection.
  issues:
  - severity: medium
    issue: « chaque fois qu’il tombait »
    rationale: Le grec πίπτων est un participe présent et signifie « alors qu’il tombait / en tombant ». « Chaque fois » explicite une itération non marquée lexicalement et affaiblit la simultanéité dramatique du grec.
  - severity: low
    issue: Rendu discursif de γέ τοι par « Et même »
    rationale: « Et même » est possible, mais son lien logique reste peu clair en français isolé. « Et voilà que » introduit plus idiomatiquement l’intervention soudaine et emphatique dans la narration, sans prétendre rendre chaque particule mot à mot.
  revised_text: Et voilà que l’un des gardes cruels[a], bondissant contre ses flancs, le frappait à coups de pied pour le forcer à se relever alors qu’il tombait.
  revised_footnotes:
