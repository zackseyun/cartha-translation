revisions:
- from: 'Et même, l’un des gardes cruels[a], s’élançant contre ses flancs, ne cessait de lui donner des coups de pied afin qu’il se relève chaque fois qu’il tombait.


    [a] Littéralement : « porte-lances » ; le terme désigne ici des gardes armés au service du souverain.'
  to: Et voilà que l’un des gardes cruels[a], bondissant contre ses flancs, le frappait à coups de pied pour le forcer à se relever alors qu’il tombait.
  rationale: La révision conserve les coups de pied explicitement indiqués par λάξ, le mouvement brusque d’ἐναλλόμενος, et l’aspect duratif de l’imparfait ἔτυπτεν. Elle remplace l’ajout interprétatif « chaque fois » par « alors qu’il tombait », qui rend la simultanéité du participe πίπτων, et exprime clairement le but coercitif de la proposition en ὅπως.
