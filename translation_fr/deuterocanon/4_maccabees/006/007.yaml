  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: fr
  text: Et tandis qu’il tombait à terre, parce que son corps ne pouvait supporter les douleurs, il gardait sa raison[a] droite et inflexible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jugement rationnel » ; le terme grec désigne ici la raison comprise comme faculté de jugement moral réfléchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων
  choice: tandis qu’il tombait
  rationale: Le participe présent exprime une action simultanée à celle du verbe principal et fait ressortir, sans ajouter une concession explicite, le contraste entre l’effondrement du corps et la fermeté de la raison.
- source_word: εἰς τὸ ἔδαφος
  choice: à terre
  rationale: Expression française naturelle pour désigner la surface sur laquelle il tombe dans cette scène de supplice.
- source_word: ἀπὸ τοῦ μὴ φέρειν
  choice: parce que… ne pouvait supporter
  rationale: Cette construction indique ici la cause de la chute; une proposition causale rend clairement et naturellement le grec.
- source_word: τὸ σῶμα
  choice: son corps
  rationale: Le possessif est idiomatique en français puisque le contexte désigne sans ambiguïté le corps du supplicié.
- source_word: τὰς ἀλγηδόνας
  choice: les douleurs
  rationale: Le terme désigne de fortes douleurs physiques; « douleurs » reste direct, digne et moins amplifié que « souffrances atroces ».
- source_word: ὀρθὸν εἶχεν
  choice: il gardait… droite
  rationale: La formulation conserve l’image d’une raison maintenue droite malgré l’affaissement physique.
- source_word: ἀκλινῆ
  choice: inflexible
  rationale: Le mot signifie littéralement que la raison ne penche ni ne cède; « inflexible » préserve cette fermeté métaphorique en français naturel.
- source_word: τὸν λογισμόν
  choice: sa raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle ou le jugement raisonné qui maîtrise les passions; « raison » conserve la portée philosophique récurrente du terme.
theological_decisions:
- issue: Portée philosophique de λογισμός
  choice: sa raison
  alternative: son jugement rationnel
  rationale: « Raison » rend avec concision le concept central de l’ouvrage sans le réduire au simple esprit ni développer excessivement le texte. La note conserve l’autre nuance possible.
translation_notes:
  register: Français moderne, international et digne. La syntaxe maintient le contraste concret entre le corps qui tombe et la raison qui demeure droite, tout en évitant d’expliciter une concession absente de la forme grecque.
