lexical_decisions:
- source_word: ὁ Ἐλεάζαρος
  choice: Éléazar
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: ὥσπερ
  choice: comme si
  rationale: Cette locution introduit naturellement en français une comparaison portant sur l’effet produit par le conseil.
- source_word: πικρότερον
  choice: plus cruellement
  rationale: Le comparatif adverbial exprime ici une souffrance accrue; « plus cruellement » conserve la force de l’image tout en étant idiomatique.
- source_word: διὰ τῆς συμβουλίας
  choice: ce conseil l’avait
  rationale: διά avec le génitif présente le conseil comme le moyen ou la cause du tourment; cette tournure française rend ce rapport sans lourdeur.
- source_word: αἰκισθείς
  choice: torturé
  rationale: Le participe passif désigne des sévices ou un traitement brutal; dans le contexte du martyre, « torturé » restitue son intensité.
- source_word: ἀνεβόησεν
  choice: s’écria
  rationale: Le verbe indique une exclamation forte; « s’écria » convient au ton narratif solennel et appelle naturellement les paroles qui suivent.
