  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: fr
  text: Car il serait déraisonnable qu’après avoir vécu toute notre vie jusqu’à la vieillesse dans la vérité et préservé selon la Loi la réputation qui s’y attache, nous changions maintenant de conduite,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  choice: déraisonnable
  rationale: Rend naturellement l’idée de ce qui est contraire à la raison, dans le contexte de l’argument moral.
- source_word: πρὸς ἀλήθειαν ζήσαντες
  choice: avoir vécu dans la vérité
  rationale: Préserve l’expression grecque et sa portée éthique sans préciser davantage ce que recouvre « vérité ».
- source_word: τὸν μέχρι γήρως βίον
  choice: toute notre vie jusqu’à la vieillesse
  rationale: Exprime l’ensemble de la vie menée jusqu’à l’âge avancé, conformément au sens de βίον et de μέχρι γήρως.
- source_word: νομίμως
  choice: conformément à la Loi
  rationale: Dans ce contexte de fidélité juive, le terme renvoie vraisemblablement à une conduite conforme à la Loi, plutôt qu’au seul sens civil de « légalement ».
- source_word: τὴν ἐπ’ αὐτῶν δόξαν
  choice: la réputation qui en découle
  rationale: δόξα désigne ici la considération acquise; le pluriel αὐτῶν peut renvoyer à la vie dans la vérité et à ses actes, que le français reprend globalement.
- source_word: μεταβαλοίμεθα
  choice: nous changions maintenant de conduite
  rationale: Rend le changement moral ou pratique impliqué, sans le réduire à un simple déplacement ni expliciter une apostasie au-delà du texte.
theological_decisions:
- issue: Portée de νομίμως
  choice: conformément à la Loi
  alternative: légitimement / selon la loi
  rationale: La majuscule signale la Torah dans le cadre du refus de transgresser les commandements, tout en conservant la notion de conformité normative.
- issue: Nature du changement final
  choice: changions de conduite
  alternative: changions de voie / changions d’avis
  rationale: Le contexte suggère un abandon pratique de la fidélité antérieure, mais le texte ne nomme pas explicitement l’apostasie; la formulation choisie conserve cette retenue.
translation_notes:
  register: Français moderne, soutenu mais accessible. La phrase demeure ouverte par une virgule, conformément à la syntaxe du passage qui se poursuit au verset suivant.
