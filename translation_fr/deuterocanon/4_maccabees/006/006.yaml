  yaml_path: translation/deuterocanon/4_maccabees/006/006.yaml
  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: fr
  text: Mais non, non, non ! Les yeux levés bien haut vers le ciel, le vieillard exposait sa chair aux fouets[a] ; il ruisselait de sang[b], et ses flancs étaient transpercés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendait sa chair visible sous les fouets ». Le verbe grec peut décrire le fait de montrer ou de rendre manifeste.
    reason: lexical_alternative
  - marker: b
    text: Ou « était inondé de sang ». L’expression grecque évoque un écoulement continu ou un corps sur lequel le sang ruisselle.
    reason: lexical_alternative
  - marker: c
    text: Ou « ses côtes étaient blessées ». Le mot grec peut désigner les flancs ou, plus précisément, la région des côtes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: Mais non, non, non !
  rationale: La triple répétition marque une rupture particulièrement vive et emphatique. Cette formulation en restitue la force mieux qu’un simple « mais, mais, mais » en français.
- source_word: ὑψηλοὺς ἀντείνας εἰς τὸν οὐρανὸν τοὺς ὀφθαλμούς
  choice: Les yeux levés bien haut vers le ciel
  rationale: La tournure exprime le geste concret de lever les yeux. « Vers le ciel » conserve l’orientation sans préciser davantage la portée religieuse du geste.
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  choice: exposait sa chair aux fouets
  rationale: Le verbe présente la chair comme rendue visible ou livrée sous la flagellation. « Exposait » préserve cette nuance tout en donnant une phrase naturelle.
- source_word: τὰς σάρκας
  choice: sa chair
  rationale: Dans ce contexte de torture physique, le terme désigne littéralement les tissus corporels ; « chair » en conserve la vigueur concrète.
- source_word: ὁ γέρων
  choice: le vieillard
  rationale: Le mot souligne l’âge avancé de l’homme. « Vieillard » est ici concis, digne et adapté au registre narratif.
- source_word: κατερρεῖτο τῷ αἵματι
  choice: il ruisselait de sang
  rationale: La forme imperfective décrit un écoulement continu ou le corps couvert par le sang qui coule. La formulation française garde cette image dynamique.
- source_word: τὰ πλευρὰ
  choice: ses flancs
  rationale: Le terme peut désigner les côtés du torse ou, plus précisément, la région des côtes. « Flancs » préserve l’étendue anatomique du grec.
- source_word: κατετιτρώσκετο
  choice: étaient transpercés
  rationale: L’imparfait passif évoque des blessures infligées de façon continue ou répétée. « Transpercés » rend la violence du verbe sans ajouter l’instrument.
theological_decisions:
- issue: Sens littéral ou métaphorique de σάρκας
  choice: « sa chair », au sens corporel littéral
  alternative: « son corps » ou « sa peau »
  rationale: La scène décrit explicitement une torture physique. Il n’y a donc pas lieu d’attribuer ici à σάρξ un sens moral ou théologique.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsme. Les imparfaits maintiennent l’aspect continu de la scène, tandis que les points-virgules évitent une coordination trop lourde.
