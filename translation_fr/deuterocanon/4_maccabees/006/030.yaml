  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: fr
  text: Après avoir dit cela, l’homme saint affronta noblement les tortures[a] et, grâce à la raison, il résista à cause de la Loi jusqu’aux tortures mortelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « affronta les tortures » est rare et difficile. Il peut évoquer le fait d’aller au-devant de la mort ou de faire directement face à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Rend naturellement en français l’antériorité exprimée par le participe aoriste, sans lourdeur.
- source_word: ὁ ἱερὸς ἀνὴρ
  choice: l’homme saint
  rationale: Préserve le masculin explicite de ἀνήρ et la valeur religieuse et morale de ἱερός.
- source_word: εὐγενῶς
  choice: noblement
  rationale: Conserve la dignité morale et la tonalité rhétorique de l’adverbe grec.
- source_word: ταῖς βασάνοις ἐναντεθάνει
  choice: affronta noblement les tortures
  rationale: Le verbe rare semble exprimer une rencontre avec la mort ou l’épreuve dans une opposition directe. « Affronta » restitue cette confrontation sans préciser abusivement le mécanisme exact.
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: jusque dans les tourments qui menaient à la mort
  rationale: Exprime l’étendue extrême de l’endurance et rend intelligible le génitif θανάτου dans un français actuel.
- source_word: ἀντέστη
  choice: il tint ferme
  rationale: Communique à la fois la résistance et la constance exprimées par ἀνθίστημι.
- source_word: τῷ λογισμῷ
  choice: par la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement raisonnable qui maîtrise les passions; cette formulation préserve ce thème central.
- source_word: διὰ τὸν νόμον
  choice: à cause de la Loi
  rationale: Rend clairement la cause ou le motif de sa fermeté. La majuscule signale ici la Loi juive déterminée par l’article grec et le contexte.
theological_decisions:
- issue: Sens philosophique de λογισμός
  choice: par la raison
  alternative: par son jugement raisonné
  rationale: « La raison » conserve le concept moral et psychologique central du livre sans lui imposer une terminologie philosophique ultérieure.
- issue: Rapport exprimé par διὰ τὸν νόμον
  choice: à cause de la Loi
  alternative: pour la Loi
  rationale: La préposition διά avec l’accusatif exprime d’abord le motif ou la cause. « À cause de » évite de trancher en faveur d’un sens exclusivement militant ou substitutif.
- issue: Référence masculine de ἀνήρ
  choice: l’homme
  alternative: la personne
  rationale: ἀνήρ désigne explicitement un homme adulte; la traduction conserve cette donnée du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le rythme solennel du récit de martyre, tout en évitant les calques opaques. « Loi » porte une majuscule puisqu’il s’agit ici de la Loi juive.
