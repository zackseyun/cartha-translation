lexical_decisions:
- source_word: αἰσχρὸν
  choice: il serait honteux
  rationale: Exprime clairement le déshonneur moral envisagé, dans un français actuel et digne.
- source_word: ἐπιβιώσομεν
  choice: prolonger quelque peu notre vie
  rationale: Rend l’idée de continuer à vivre au-delà de la menace présente, sans réduire le verbe à la seule notion abstraite de survie.
- source_word: ὀλίγον χρόνον
  choice: quelque peu
  rationale: Intégré à la locution « prolonger quelque peu notre vie », cet élément conserve l’accent mis sur la faible durée gagnée.
- source_word: καταγελώμενοι
  choice: être tournés en ridicule
  rationale: Restitue le participe passif et la dérision publique continue avec une expression française naturelle.
- source_word: πρὸς ἀπάντων
  choice: par tous
  rationale: Préserve sans ajout la portée universelle de la réprobation sociale.
- source_word: ἐπὶ δειλίᾳ
  choice: à cause de notre lâcheté
  rationale: Indique le motif de la dérision et conserve la forte condamnation morale portée par δειλία dans ce contexte.
