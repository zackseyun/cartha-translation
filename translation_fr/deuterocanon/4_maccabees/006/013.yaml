  text: Some of the king’s men[a], being moved by sympathy because of their long acquaintance with him, and others approaching him in admiration of his endurance, were saying[b],
translation:
  language: fr
  text: 'Certains des gens du roi, touchés de compassion à cause de leurs liens de longue date avec lui[a], et d’autres, s’approchant de lui avec admiration pour son endurance[b], lui disaient :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de leur familiarité avec lui ». Le grec peut désigner une association habituelle, une familiarité ou des relations anciennes.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec émerveillement devant sa fermeté ». Le mot grec désigne une persévérance résolue dans l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμπαθείᾳ
  choice: émus de compassion
  rationale: Cette tournure française naturelle exprime l’état affectif ou la manière d’agir indiqués par la préposition ἐν, sans réduire συμπάθεια à une simple politesse.
- source_word: τῆς συνηθείας
  choice: en raison de leur longue fréquentation avec lui
  rationale: συνήθεια peut désigner la familiarité née d’une association habituelle. « Longue fréquentation » rend cette relation durable sans l’intensifier jusqu’à l’amitié intime.
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: pleins d’admiration devant son endurance
  rationale: La formule restitue l’émerveillement admiratif suscité par la καρτερία, c’est-à-dire la capacité à tenir ferme sous l’épreuve.
- source_word: προσίοντες αὐτῷ
  choice: qui s’approchaient de lui
  rationale: Le verbe indique simplement un mouvement vers Éléazar; l’imparfait français s’accorde avec la scène narrative et le participe grec.
- source_word: τινες τῶν τοῦ βασιλέως
  choice: certains hommes du roi
  rationale: L’expression désigne des personnes rattachées au roi ou à son entourage, sans préciser leur fonction. « Hommes du roi » conserve cette indétermination.
- source_word: ἔλεγον
  choice: lui disaient
  rationale: L’imparfait grec présente la parole en cours et introduit directement son contenu au verset suivant; l’imparfait français en conserve l’aspect.
theological_decisions: []
