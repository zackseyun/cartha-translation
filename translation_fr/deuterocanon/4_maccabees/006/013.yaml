  source_fidelity: 'Le sens de la répartition est bien rendu : certains membres de l''entourage royal éprouvent de la compassion en raison de relations anciennes avec lui, tandis que d''autres s''approchent avec admiration pour son endurance. Le présent participe προσίοντες est mieux conservé par « s’approchant » que par une relative à l’imparfait. « Hommes du roi » est possible, mais « des gens du roi » rend plus naturellement en français l’indétermination de τινες τῶν τοῦ βασιλέως.'
  naturalness: '« Leur longue fréquentation avec lui » n''est pas idiomatique en français international moderne : on fréquente quelqu''un, mais on n''a pas une « fréquentation avec » quelqu''un. « Leurs liens de longue date avec lui » est naturel et ne force pas le sens jusqu''à l''amitié.'
