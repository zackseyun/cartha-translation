base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/017.yaml
  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: fr
  text: Ne pensons pas si bassement, nous qui sommes les enfants d’Abraham, que, perdant courage, nous jouions une scène indigne de nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὕτως κακῶς φρονήσαιμεν
  choice: Gardons-nous […] de tomber dans un raisonnement si mauvais
  rationale: Le souhait négatif à l’optatif devient une exhortation naturelle en français. φρονεῖν concerne ici la manière de penser ou la disposition d’esprit, plutôt qu’une simple pensée isolée.
- source_word: οἱ Ἀβραὰμ παῖδες
  choice: nous qui sommes les enfants d’Abraham
  rationale: Rend explicitement l’apposition grecque et conserve la filiation identitaire exprimée par παῖδες.
- source_word: μαλακοψυχήσαντας
  choice: manquer de courage
  rationale: Exprime l’affaiblissement intérieur ou la pusillanimité sans employer un archaïsme.
- source_word: ὑποκρίνασθαι
  choice: faire semblant d’accomplir
  rationale: Le verbe peut évoquer le fait de jouer un rôle, mais dans le contexte il indique surtout la simulation d’un acte; cette formulation préserve cette nuance sans imposer la métaphore théâtrale.
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα
  choice: un acte indigne de nous
  rationale: ἀπρεπές signifie inconvenant ou indigne, tandis que δρᾶμα désigne ici une action accomplie, avec une possible coloration scénique.
theological_decisions:
- issue: Identité comme enfants d’Abraham
  choice: Conserver littéralement « les enfants d’Abraham »
  alternative: « les descendants d’Abraham »
  rationale: Le grec παῖδες permet une expression filiale et identitaire; rien dans le verset n’exige de réduire celle-ci à la seule descendance biologique.
- issue: Nature de l’acte envisagé
  choice: Présenter l’acte comme simulé
  alternative: « jouer une scène honteuse » ou « accomplir un acte indigne »
  rationale: ὑποκρίνασθαι marque la feinte ou le jeu d’un rôle. La traduction évite de transformer la simulation en accomplissement réel tout en conservant la tension morale du passage.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’exhortation « Gardons-nous » restitue le ton solennel de l’optatif grec; la syntaxe reste naturelle et évite une lecture artificiellement théâtrale de δρᾶμα et ὑποκρίνασθαι.
