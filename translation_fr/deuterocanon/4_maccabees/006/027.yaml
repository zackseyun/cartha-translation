  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
translation:
  language: fr
  text: 'Tu le sais, ô Dieu : bien qu’il me soit possible d’être sauvé[a], je meurs dans des tourments brûlants à cause de la Loi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’échapper », « d’être délivré » ou « d’avoir la vie sauve » ; ici, il s’agit d’abord de la possibilité d’échapper physiquement à la torture et à la mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour la Loi ». Il meurt en raison de sa fidélité à la Loi mosaïque sous la persécution.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα, θεέ
  choice: Tu le sais, ô Dieu
  rationale: Le pronom sujet emphatique et le vocatif sont conservés dans une adresse directe et solennelle. « Le » annonce naturellement en français le contenu de la déclaration qui suit.
- source_word: παρὸν μοι
  choice: bien qu’il me soit possible
  rationale: L’expression indique qu’une possibilité demeure ouverte au martyr. La tournure concessive explicite le contraste présent dans le contexte sans ajouter la manière dont il pourrait échapper.
- source_word: σῴζεσθαι
  choice: d’être sauvé
  rationale: Ce choix conserve l’étendue sémantique du verbe grec, tout en laissant la note préciser qu’il s’agit d’abord ici d’un salut physique, c’est-à-dire d’échapper à la mort.
- source_word: βασάνοις καυστικαῖς
  choice: dans des tourments brûlants
  rationale: « Tourments » rend la violence de βασάνοις, tandis que « brûlants » traduit directement le caractère ardent ou cautérisant exprimé par καυστικαῖς.
- source_word: ἀποθνῄσκω
  choice: je meurs
  rationale: Le présent français garde l’immédiateté dramatique du présent grec.
- source_word: διὰ τὸν νόμον
  choice: à cause de la Loi
  rationale: La formulation reste proche de la valeur causale de διά avec l’accusatif. La majuscule à « Loi » signale, conformément au contexte, la Loi mosaïque sans développer davantage l’interprétation.
theological_decisions:
- issue: Sens de σῴζεσθαι dans le contexte du martyre
  choice: Le salut physique est le sens premier, avec la traduction « être sauvé »
  alternative: « échapper », « être délivré » ou « avoir la vie sauve »
  rationale: Le contraste porte sur une possibilité réelle d’éviter la torture et la mort. « Être sauvé » préserve néanmoins la formulation large du grec sans imposer un sens doctrinal ultérieur.
- issue: Portée de διὰ τὸν νόμον
  choice: Cause liée à la fidélité à la Loi, rendue par « à cause de la Loi »
  alternative: « pour la Loi » ou « par fidélité à la Loi »
  rationale: La traduction retenue conserve la relation causale exprimée en grec. La note indique la fidélité du martyr sans l’insérer explicitement dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocatif « ô Dieu » maintient le ton solennel de la prière, tandis que la syntaxe reste naturelle. Les notes préservent l’ambiguïté lexicale de « sauver » et la nuance possible de « pour la Loi ».
