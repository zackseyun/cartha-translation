  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: fr
  text: Et nous deviendrions nous-mêmes un modèle d’impiété pour les jeunes, afin que nous devenions un exemple du fait de manger des aliments souillés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύπος
  choice: modèle
  rationale: Le terme peut désigner un modèle, un type ou un exemple. « Modèle » reste naturel en français et maintient une distinction avec παράδειγμα, rendu par « exemple ».
- source_word: ἀσεβείας
  choice: impiété
  rationale: Le mot désigne un manque de respect envers Dieu, et non une simple faute morale. « Impiété » en conserve clairement la portée religieuse dans un registre digne.
- source_word: τοῖς νέοις
  choice: pour les jeunes
  rationale: Le grec peut viser les jeunes en général ou de jeunes hommes. « Les jeunes » préserve cette ouverture sans préciser indûment le sexe.
- source_word: παράδειγμα
  choice: exemple
  rationale: « Exemple » est le sens courant du terme et permet de ne pas confondre lexicalement παράδειγμα avec τύπος.
- source_word: μιαροφαγίας
  choice: consommation d’aliments souillés
  rationale: Ce nom composé évoque le fait de manger ce qui est souillé ou impur. Cette formulation française est intelligible et conserve le caractère concret de l’acte sans le réduire à une catégorie technique de pureté rituelle.
- source_word: γενοίμεθα / γενώμεθα
  choice: deviendrions / servir d’exemple
  rationale: Le conditionnel traduit la potentialité du premier subjonctif; « afin de servir » restitue naturellement la valeur finale de ἵνα avec le second.
theological_decisions:
- issue: Portée religieuse de ἀσεβείας
  choice: impiété
  alternative: irrévérence envers Dieu
  rationale: « Impiété » conserve de façon concise la dimension religieuse et morale du grec, sans réduire le propos à une conduite socialement répréhensible.
- issue: Degré de précision de μιαροφαγίας
  choice: consommation d’aliments souillés
  alternative: consommation d’aliments impurs
  rationale: « Souillés » reste proche de μιαρός et évite de transformer implicitement le terme en désignation technique d’une catégorie rituelle déterminée, même si le contexte concerne des aliments interdits.
translation_notes:
  register: Français moderne international, clair et digne. La structure rhétorique répétée du grec est conservée par « deviendrions… afin de servir », tandis que « modèle » et « exemple » rendent les deux substantifs distincts.
