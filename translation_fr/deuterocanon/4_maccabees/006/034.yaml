  yaml_path: translation/deuterocanon/4_maccabees/006/034.yaml
  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: fr
  text: Et il est juste que nous reconnaissions que la maîtrise appartient à la raison[a], puisqu’elle l’emporte même sur les douleurs venues de l’extérieur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la raison détient le pouvoir » ou « la raison est souveraine ». Le grec souligne la force dominante de la raison.
    reason: lexical_alternative
  - marker: b
    text: Ou « les douleurs extérieures ». L’expression désigne des douleurs venant du dehors, probablement notamment les souffrances corporelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν
  choice: il est juste
  rationale: 'L’expression impersonnelle δίκαιόν ἐστιν porte ici une appréciation morale : « il est juste » la restitue clairement sans l’affaiblir en simple convenance.'
- source_word: ὁμολογεῖν
  choice: que nous reconnaissions
  rationale: Dans ce raisonnement, ὁμολογεῖν désigne l’adhésion déclarée à une conclusion, non une confession de faute.
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: que la maîtrise appartient à la raison
  rationale: 'Cette formulation conserve l’idée de force dominante ou de pouvoir souverain exprimée par κράτος, tout en suivant naturellement le génitif τοῦ λογισμοῦ : la maîtrise appartient à la raison.'
- source_word: λογισμοῦ
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de juger et de gouverner rationnellement. « Raison » est concis, naturel et garde la portée philosophique du terme.
- source_word: ὅπου γε καὶ
  choice: puisqu’elle… même
  rationale: Dans ce contexte, la locution introduit avec insistance la preuve de l’affirmation précédente ; « puisque » exprime le rapport justificatif et « même » rend l’emphase.
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: sur les douleurs venues de l’extérieur
  rationale: La traduction garde le sens littéral d’ἔξωθεν, « de l’extérieur », sans réduire explicitement ces douleurs aux seules souffrances corporelles.
- source_word: ἐπικρατεῖ
  choice: elle l’emporte… sur
  rationale: ἐπικρατέω exprime le fait de prévaloir ou d’exercer sa supériorité sur quelque chose. « L’emporter sur » est idiomatique et conserve cette relation de domination.
theological_decisions:
- issue: Portée philosophique et anthropologique de λογισμός
  choice: la maîtrise appartient à la raison
  alternative: la raison est souveraine
  rationale: Le texte affirme le pouvoir directeur de la raison face à la souffrance. La formulation retenue préserve cette force sans transformer la raison en souverain personnel ni importer une anthropologie confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe argumentative est maintenue, ainsi que le contraste entre la maîtrise intérieure de la raison et les douleurs provenant de l’extérieur.
