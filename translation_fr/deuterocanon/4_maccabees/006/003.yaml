lexical_decisions:
- source_word: ἔπειτα
  choice: Ensuite
  rationale: Adverbe marquant l’étape suivante du supplice; « Ensuite » restitue clairement la progression du récit.
- source_word: περιαγκωνίσαντες
  choice: après lui avoir immobilisé les bras
  rationale: Ce participe aoriste rare, formé sur ἀγκών (« coude, bras »), paraît désigner une contrainte exercée sur les bras ou les coudes. « Immobilisé les bras » exprime l’action sans préciser abusivement la technique employée.
- source_word: ἑκατέρωθεν
  choice: de chaque côté
  rationale: L’adverbe indique que la contrainte est exercée des deux côtés; cette formulation est naturelle en français et conserve la dimension bilatérale.
- source_word: μάστιξιν
  choice: à coups de fouet
  rationale: Le datif instrumental pluriel de μάστιξ désigne les instruments du supplice. « À coups de fouet » est courant, précis et immédiatement compréhensible.
- source_word: κατήκιζον
  choice: ils le torturaient
  rationale: L’imparfait présente un mauvais traitement prolongé. Dans le contexte d’une flagellation, « torturaient » en rend la gravité et l’aspect duratif.
