lexical_decisions:
- source_word: ὑπέμενεν τοὺς πόνους
  choice: supportait les souffrances
  rationale: Le verbe ὑπομένω exprime le fait d’endurer avec constance; πόνοι désigne ici les souffrances infligées.
- source_word: περιεφρόνει τῆς ἀνάγκης
  choice: méprisait la contrainte
  rationale: περιφρονέω signifie traiter avec mépris ou tenir pour négligeable; ἀνάγκη évoque ici la pression coercitive exercée sur le martyr.
- source_word: διεκαρτέρει τοὺς αἰκισμούς
  choice: résistait aux tortures
  rationale: διακαρτερέω souligne une endurance ferme et prolongée; αἰκισμοί désigne des sévices ou tortures. « Résistait aux tortures » rend naturellement l’idée sans atténuer leur violence.
