  yaml_path: translation/deuterocanon/4_maccabees/006/005.yaml
  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: fr
  text: Mais Éléazar, d’une grande noblesse d’âme et véritablement de noble naissance, comme s’il subissait la torture dans un rêve[a], ne se laissait détourner en rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme s’il était torturé dans un rêve ». Le grec emploie une comparaison et n’affirme pas qu’Éléazar rêvait littéralement.'
    reason: Précision sur la portée comparative de l’expression grecque et variante de formulation.
lexical_decisions:
- source_word: μεγαλόφρων
  choice: d’une grande noblesse d’âme
  rationale: L’adjectif exprime la grandeur morale et la noblesse intérieure. Cette formulation française conserve cette dimension sans la confondre avec la naissance sociale.
- source_word: εὐγενής
  choice: de noble naissance
  rationale: Le terme renvoie proprement à une bonne ou noble origine. Ce choix maintient sa distinction par rapport à μεγαλόφρων, qui décrit la noblesse d’âme.
- source_word: ὡς ἀληθῶς
  choice: véritablement
  rationale: L’adverbe renforce l’affirmation concernant la noble naissance d’Éléazar, avec une formulation naturelle et digne en français.
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: comme s’il … dans un rêve
  rationale: Cette tournure rend explicitement la comparaison grecque sans présenter le rêve comme un état littéral.
- source_word: βασανιζόμενος
  choice: subissait la torture
  rationale: Dans ce contexte de martyre, le participe désigne des sévices physiques réels. « Subissait la torture » est clair et concret.
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: en aucune manière
  rationale: L’expression marque une négation totale et s’accorde naturellement avec « ne se laissait détourner ».
- source_word: μετετρέπετο
  choice: ne se laissait détourner
  rationale: Le verbe indique qu’Éléazar ne déviait pas de sa résolution. Cette traduction conserve la valeur passive tout en restant idiomatique.
theological_decisions:
- issue: Caractérisation de l’endurance d’Éléazar sous la torture
  choice: 'La scène est rendue par une comparaison : Éléazar endure la torture comme si elle avait lieu dans un rêve, tout en demeurant inébranlable.'
  alternative: Comprendre l’image comme insistant principalement sur le caractère irréel ou lointain de la souffrance.
  rationale: ὥσπερ introduit explicitement une comparaison. La traduction préserve l’image et son ouverture rhétorique sans affirmer qu’Éléazar rêvait réellement ni lui attribuer une théorie particulière de la souffrance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La distinction entre noblesse intérieure et noble naissance est maintenue, ainsi que la construction comparative et la valeur passive du verbe final.
