  text: Be merciful to your nation[b][a], being satisfied with our punishment on their behalf.
translation:
  language: fr
  text: Sois favorable à ton peuple[a], en te contentant de la peine que nous subissons pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ta nation »; ou : « Sois favorable à ton peuple, considérant comme suffisante la peine que nous subissons pour lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: Sois favorable
  rationale: Cette tournure grecque exprime un appel à la clémence bienveillante de Dieu. « Sois favorable » reste naturel et digne, sans donner à ἵλεως un sens technique excessif.
- source_word: τῷ ἔθνει σου
  choice: à ton peuple
  rationale: Dans ce contexte d’intercession pour la communauté d’alliance, « peuple » est plus naturel en français que « nation », tout en conservant la portée collective de ἔθνος.
- source_word: ἀρκεσθεὶς
  choice: considère comme suffisante
  rationale: Le participe demande que Dieu tienne la peine des martyrs pour suffisante. Cette formulation exprime clairement la valeur contextuelle de ἀρκέω sans suggérer une satisfaction émotionnelle.
- source_word: τῇ ἡμετέρᾳ ... δίκῃ
  choice: la peine que nous subissons
  rationale: δίκη désigne ici la peine ou le châtiment subi. L’ajout explicatif « que nous subissons » produit un français naturel et évite que « notre peine » soit compris comme du chagrin.
- source_word: περὶ αὐτῶν
  choice: pour lui
  rationale: περί avec le génitif possède ici une force intercessive et représentative. « Pour lui » préserve cette relation sans imposer un modèle doctrinal ultérieur; le singulier reprend le collectif « peuple ».
theological_decisions:
- issue: Portée représentative de la souffrance des martyrs dans περὶ αὐτῶν
  choice: La peine est présentée comme subie « pour » le peuple, dans un sens intercessif et représentatif.
  alternative: « à son sujet », qui conserverait un sens plus général de référence.
  rationale: Le contexte immédiat invite à comprendre que les martyrs demandent que leur souffrance compte en faveur du peuple. La traduction maintient cette tension sans définir le mécanisme théologique de cette représentation.
translation_notes:
  register: Français international moderne, sobre et priant. L’impératif « Sois » conserve l’adresse directe; « considère comme suffisante » rend explicitement l’idée de suffisance portée par le participe grec.
