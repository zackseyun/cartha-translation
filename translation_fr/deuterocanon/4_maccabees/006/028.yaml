  source_fidelity: 'Le sens général est fidèle : ἵλεως γενοῦ est bien une supplication de faveur, τῷ ἔθνει σου peut être rendu naturellement par « ton peuple », et la peine des locuteurs est présentée comme suffisante en relation avec ce peuple. Toutefois, le participe aoriste passif ἀρκεσθείς exprime plus directement le fait de se contenter d’une peine tenue pour suffisante. La coordination de deux impératifs (« Sois… et considère… ») atténue cette relation participiale.'
  naturalness: « Sois favorable à ton peuple » est naturel, sobre et adapté à une prière. « En te contentant de la peine que nous subissons pour lui » est également idiomatique en français international moderne et rend plus directement la construction grecque que « considère comme suffisante ».
