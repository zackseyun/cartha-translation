  yaml_path: translation/deuterocanon/4_maccabees/006/011.yaml
  text: His face indeed was sweating, and he was breathing very hard, and he was being admired even by the very men who were torturing him because of his courage.
translation:
  language: fr
  text: Certes, son visage était en sueur, il haletait fortement[a], et même ceux-là mêmes qui le torturaient l’admiraient pour son courage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « respirait très péniblement ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec souligne que son courage suscitait l’admiration jusqu’à chez ceux-là mêmes qui le torturaient.
    reason: emphatic_wording
lexical_decisions:
- source_word: ἱδρῶν … τὸ πρόσωπον
  choice: Son visage ruisselait de sueur
  rationale: Le participe présent décrit une transpiration continue. Cette tournure française est naturelle et rend l’expression grecque où le visage est le siège de la transpiration.
- source_word: γέ τοι
  choice: pourtant
  rationale: Dans le contexte, la combinaison de particules souligne le contraste entre l’épuisement physique visible et le courage qui suscite l’étonnement. « Pourtant » restitue naturellement cette force discursive.
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: il haletait fortement
  rationale: Le verbe désigne une respiration pénible ou haletante, et l’adverbe l’intensifie. « Haletait fortement » reste précis et compréhensible.
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: même ceux qui le torturaient
  rationale: 'Le pronom intensif et l’article mettent en relief l’identité surprenante des observateurs : ses propres tortionnaires. « Même » conserve cette insistance sans alourdir la phrase.'
- source_word: ἐθαυμάζετο
  choice: étaient frappés par
  rationale: L’imparfait passif exprime l’étonnement admiratif qu’il suscitait. Cette formulation française transmet cette réaction sans suggérer une vénération.
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: par son courage
  rationale: εὐψυχία désigne ici la fermeté ou le courage devant l’épreuve. « Courage » est direct, digne et fidèle.
