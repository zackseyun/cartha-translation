  text: Therefore, it is agreed that godly reason is master of the passions.
translation:
  language: fr
  text: Ainsi donc, de l’aveu de tous, la raison pieuse maîtrise les passions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: de l’aveu de tous
  rationale: L’adverbe indique que la conclusion est reconnue ou admise. Cette tournure française naturelle conserve l’idée d’un constat commun.
- source_word: οὖν
  choice: ainsi donc
  rationale: La particule introduit la conclusion déduite de l’argument précédent; « ainsi donc » en marque clairement la portée logique.
- source_word: δεσπότης ἐστίν
  choice: maîtrise
  rationale: Le grec exprime l’autorité souveraine ou la domination. Le verbe « maîtrise » restitue naturellement en français l’idée que la raison exerce son contrôle, sans donner ici à « maître » une résonance théologique étrangère au contexte.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans l’argument moral et philosophique de 4 Maccabées, πάθη désigne les passions ou impulsions que la raison gouverne. « Passions » est précis et traditionnel sans réduire le terme aux seules émotions.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: λογισμός désigne ici la faculté de raisonner, tandis que εὐσεβής la qualifie par la piété et la révérence envers Dieu. « Raison pieuse » préserve ces deux dimensions dans une expression concise.
theological_decisions:
- issue: Sens de εὐσεβής appliqué à λογισμός
  choice: pieuse
  alternative: inspirée par la piété; respectueuse de Dieu
  rationale: Le texte ne présente pas une raison autonome, mais une raison caractérisée par la piété. « Pieuse » garde cette qualification religieuse sans préciser au-delà du grec comment la piété façonne la raison.
- issue: Rapport entre la raison et les passions
  choice: la raison pieuse maîtrise les passions
  alternative: la raison pieuse est maîtresse des passions
  rationale: Le prédicat nominal grec affirme une autorité effective de la raison sur les passions. La formulation verbale est plus naturelle en français moderne tout en préservant cette affirmation, sans suggérer nécessairement leur suppression.
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve le caractère conclusif de la phrase et son vocabulaire philosophico-religieux, tout en évitant une syntaxe inutilement académique.
