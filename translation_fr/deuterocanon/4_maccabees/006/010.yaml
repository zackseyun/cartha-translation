  yaml_path: translation/deuterocanon/4_maccabees/006/010.yaml
  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: fr
  text: Et, tel un courageux athlète[a], le vieillard, tout en recevant des coups, triomphait de ceux qui le torturaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tel un noble athlète ».'
    reason: Alternative lexicale pour γενναῖος, qui peut exprimer la noblesse de caractère aussi bien que le courage.
lexical_decisions:
- source_word: καθάπερ
  choice: tel
  rationale: Introduit naturellement en français une comparaison directe, tout en conservant la solennité de l’image.
- source_word: γενναῖος
  choice: courageux
  rationale: Dans ce contexte de résistance sous la torture, le terme exprime avant tout la bravoure; « noble » reste possible, mais pourrait suggérer le rang social en français courant.
- source_word: ἀθλητής
  choice: athlète
  rationale: Conserve sans l’expliciter la métaphore grecque de la compétition athlétique.
- source_word: τυπτόμενος
  choice: tout en recevant des coups
  rationale: Rend le participe présent passif et l’action continue, sans ajouter explicitement une valeur concessive qui demeure implicite dans le contraste.
- source_word: ἐνίκα
  choice: triomphait
  rationale: L’imparfait français correspond à l’aspect duratif de l’imparfait grec et maintient l’image d’une victoire dans l’épreuve.
- source_word: τοὺς βασανίζοντας
  choice: ceux qui le torturaient
  rationale: Rend explicitement le participe substantivé et le sens de βασανίζω dans le contexte du supplice; le pronom « le » est fourni par le contexte.
- source_word: ὁ γέρων
  choice: le vieillard
  rationale: Désigne clairement l’homme âgé et préserve le contraste rhétorique entre son âge et sa victoire athlétique, sans suggérer une fonction officielle.
theological_decisions:
- issue: Présentation métaphorique du martyre comme victoire athlétique
  choice: Maintenir directement l’image de l’athlète et du triomphe.
  alternative: Paraphraser par « supportait héroïquement les coups et résistait à ses tortionnaires ».
  rationale: Le grec décrit explicitement l’endurance du vieillard comme une victoire dans une compétition. Conserver cette tension paradoxale respecte la portée morale et rhétorique du texte sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Tel un courageux athlète » garde le ton élevé; « triomphait » préserve la métaphore de la victoire, tandis que « tout en recevant des coups » restitue l’action simultanée sans surinterpréter le participe.
