  yaml_path: translation/deuterocanon/4_maccabees/006/024.yaml
  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: fr
  text: Quand ils virent avec quelle grandeur d’âme il faisait face aux pressions[a], et qu’il ne changeait même pas d’attitude à l’égard de la compassion pour eux[b], ils le conduisirent au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux contraintes ». Le grec désigne ici les pressions coercitives exercées sur lui, et non de simples nécessités.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « à l’égard de leur compassion/pitié ». La construction grecque laisse ouverte la relation exacte entre la compassion et « eux ».
    reason: ambiguity
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: face aux pressions
  rationale: Dans ce contexte de martyre, ἀνάγκας désigne les contraintes coercitives exercées sur lui plutôt que de simples nécessités. « Face aux pressions » rend naturellement la relation exprimée par πρός sans préciser excessivement la forme des sévices.
- source_word: μεγαλοφρονοῦντα
  choice: avec quelle grandeur d’âme
  rationale: Le participe exprime l’élévation morale, la noblesse d’esprit ou la magnanimité. « Grandeur d’âme » conserve cette nuance et convient à un registre français digne et courant.
- source_word: μηδὲ … μεταβαλλόμενον
  choice: sans même se laisser fléchir
  rationale: Le tour rend la négation renforcée par μηδέ et le changement de disposition impliqué par μεταβάλλω. Dans ce contexte, « se laisser fléchir » exprime idiomatiquement qu’il ne modifie pas sa résolution.
- source_word: πρὸς τὸν οἰκτιρμὸν αὐτῶν
  choice: par leur compassion
  rationale: Le groupe prépositionnel peut indiquer la réaction à la compassion manifestée par ceux qui le conduisent. Cette lecture s’accorde à la syntaxe de αὐτῶν comme génitif possessif/subjectif, tout en laissant l’ambiguïté signalée en note.
- source_word: ἐπὶ τὸ πῦρ αὐτὸν ἦγον
  choice: ils le conduisirent au feu
  rationale: ἄγω signifie mener ou conduire, et ἐπὶ avec l’accusatif marque ici le mouvement vers le feu sans imposer qu’il y soit immédiatement jeté.
