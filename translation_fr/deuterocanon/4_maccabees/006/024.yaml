translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le mouvement participial du grec tout en l’exprimant de façon idiomatique. Les termes « grandeur d’âme » et « se laisser fléchir » maintiennent la dimension morale sans introduire d’interprétation confessionnelle.
