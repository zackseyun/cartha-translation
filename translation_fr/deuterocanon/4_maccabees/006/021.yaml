  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: fr
  text: Et serions-nous méprisés par le tyran comme des hommes sans courage[a], sans défendre notre loi divine jusqu’à la mort ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des lâches ». Le terme grec est masculin et genré, littéralement lié à l’absence de virilité ; il exprime un manque de courage.'
    reason: Conserver l’alternative idiomatique tout en signalant avec précision la forme et la portée rhétorique du terme grec.
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: nous laisserions-nous mépriser
  rationale: Le passif exprime le fait d’être tenu en mépris. Dans cette question rhétorique, « nous laisserions-nous mépriser » est naturel en français et fait ressortir l’éventualité rejetée par le locuteur.
- source_word: τοῦ τυράννου
  choice: par le tyran
  rationale: τύραννος désigne ici un souverain cruel et oppresseur ; « tyran » conserve cette appréciation morale.
- source_word: ἄνανδροι
  choice: comme des hommes sans courage
  rationale: Cette formulation garde à la fois l’idée de lâcheté et la dimension masculine explicite du terme grec, sans employer le français ambigu ou peu naturel « non virils ».
- source_word: τὸν θεῖον ἡμῶν νόμον
  choice: notre loi divine
  rationale: L’adjectif θεῖον qualifie la loi comme divine, tandis que ἡμῶν marque son appartenance communautaire ; l’ordre français est naturel et fidèle.
- source_word: μέχρι θανάτου
  choice: jusqu’à la mort
  rationale: La locution indique que la défense de la loi doit être poursuivie au point d’accepter la mort.
- source_word: προασπίσαιμεν
  choice: défendre
  rationale: Le verbe évoque étymologiquement l’action de protéger avec un bouclier et signifie ici prendre la défense de la loi.
theological_decisions:
- issue: Dimension genrée de l’insulte ἄνανδροι
  choice: comme des hommes sans courage
  alternative: comme des lâches
  rationale: Le texte principal conserve la rhétorique masculine du grec tout en exprimant clairement son sens, le manque de courage. La note donne l’équivalent français plus direct mais non genré.
- issue: Portée de μέχρι θανάτου
  choice: jusqu’à la mort
  alternative: même au prix de notre mort
  rationale: « Jusqu’à la mort » préserve la concision et la portée exacte de la limite exprimée, sans préciser davantage si la mort est certaine ou seulement acceptée comme conséquence.
translation_notes:
  register: Français moderne, soutenu mais accessible. La question rhétorique et le contraste implicite μέν…δέ sont rendus par la structure « nous laisserions-nous… sans défendre… ? ». Le marqueur [a] figure dans le texte principal.
