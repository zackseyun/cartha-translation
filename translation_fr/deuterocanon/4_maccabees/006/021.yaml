  naturalness: Le français est globalement naturel et de registre soutenu. « Serions-nous méprisés » est plus direct et plus idiomatique ici que « nous laisserions-nous mépriser ».
  terminology: « Tyran », « loi divine », « jusqu’à la mort » et « défendre » rendent fidèlement le grec. « Hommes sans courage » conserve le référent masculin, tandis que la note explicite avec justesse le caractère genré et le sens de manque de courage de ἄνανδροι.
