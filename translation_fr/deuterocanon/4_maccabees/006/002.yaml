  text: And first they stripped the old man[a], adorned with the dignity of godliness.
translation:
  language: fr
  text: Ils commencèrent par déshabiller le vieillard, paré de la dignité liée à la piété.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la noble tenue associée à la piété ».'
    reason: La construction grecque peut désigner plus précisément la grâce, la dignité ou la tenue convenable associée à la piété.
lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: Ils commencèrent par
  rationale: Cette tournure française naturelle conserve l’idée de la première étape d’une série, exprimée par καὶ πρῶτον μὲν.
- source_word: περιέδυσαν
  choice: déshabiller
  rationale: Le verbe désigne l’action d’enlever les vêtements de quelqu’un. « Déshabiller » exprime directement l’acte subi par le vieillard sans ajouter un complément absent du grec.
- source_word: τὸν γεραιὸν
  choice: le vieillard
  rationale: « Vieillard » rend directement l’âge avancé tout en convenant au registre narratif digne du passage.
- source_word: ἐκκεκοσμημένον
  choice: que parait
  rationale: Le participe évoque quelqu’un qui a été orné ou paré. La proposition relative permet de conserver l’image en français avec une syntaxe fluide.
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: la dignité liée à la piété
  rationale: « Dignité » rend la tenue noble et convenable exprimée par εὐσχημοσύνη, tandis que « liée à » respecte la relation assez souple marquée par περὶ sans la préciser excessivement.
- source_word: εὐσέβειαν
  choice: piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la fidélité révérencieuse envers Dieu et sa loi. « Piété » est le terme français courant et théologiquement approprié dans ce contexte.
theological_decisions:
- issue: Portée de la notion d’εὐσέβεια dans 4 Maccabées
  choice: piété
  alternative: attachement à Dieu
  rationale: « Piété » conserve la dimension religieuse et éthique du terme grec sans réduire celui-ci à un sentiment intérieur. L’alternative explicite davantage le rapport à Dieu, mais interprète plus fortement le mot.
- issue: Relation entre εὐσχημοσύνη et εὐσέβεια
  choice: la dignité liée à la piété
  alternative: la noble tenue qui caractérise la piété
  rationale: Le grec établit une relation entre la dignité ou la belle tenue et la piété sans en définir exactement la nature. La traduction principale maintient cette souplesse plutôt que d’imposer un lien causal ou possessif.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le contraste saisissant entre le déshabillage humiliant du vieillard et la dignité spirituelle qui continue de le parer.
