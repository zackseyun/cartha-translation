  source_fidelity: 'Le texte principal rend fidèlement καθαρσόν (« purification »), αἷμα (« sang »), ψυχή (« vie ») et l’idée d’échange contenue dans ἀντίψυχον. Toutefois, le français « en échange de la leur » est syntaxiquement ambigu : « la leur » peut se rapporter au sang plutôt qu’à la vie, alors que le grec oppose explicitement la vie du locuteur à celles d’« eux ».'
  naturalness: La phrase est naturelle, sobre et adaptée à une prière solennelle. La reformulation « en échange de leurs vies » lève l’ambiguïté tout en restant fluide en français international moderne.
  terminology: « Purification » conserve avec justesse la portée cultuelle de καθαρσόν sans surinterpréter par « expiation ». « Vie » convient à ψυχή dans ce contexte. La note a doit proposer une véritable alternative lexicale (« purification/cleansing »), plutôt que « moyen de purification », qui introduit un élément instrumental absent du grec.
  issues:
  - severity: medium
    issue: Ambiguïté référentielle de « la leur »
    rationale: Dans « prends ma vie en échange de la leur », le possessif féminin peut grammaticalement renvoyer à « purification » ou à « vie ». Le grec τὴν ἐμὴν ψυχήν / αὐτῶν exprime une opposition vie pour vies. « Leurs vies » rend ce référent explicite.
  - severity: low
    issue: Alternative de la note a trop interprétative
    rationale: « Leur moyen de purification » ajoute l’idée de moyen/instrument, non exprimée par καθαρσόν. « Leur purification » ou « leur purification rituelle » conserve plus exactement la construction prédicative et la nuance cultuelle.
  - severity: low
    issue: 'Formulation de la note b : « contre-vie »'
    rationale: Bien que motivé par la composition du grec, « contre-vie » n’est pas une expression française usuelle. Une littéralité expliquée par « en échange de leurs vies » est plus claire et reste fidèle au sens substitutif.
