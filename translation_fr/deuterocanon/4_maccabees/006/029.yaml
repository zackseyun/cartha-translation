  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: fr
  text: Fais de mon sang leur purification[a], et prends ma vie en échange de leurs vies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur purification rituelle ». Le grec καθαρσόν peut désigner une purification ou un nettoyage au sens cultuel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « prends ma vie comme échange pour leurs vies » ; l’expression présente une vie donnée en échange d’autres vies. « Comme rançon pour eux » est possible, mais plus interprétatif.
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσὸν
  choice: purification
  rationale: Le terme a ici une valeur prédicative avec ποίησον et peut exprimer une purification rituelle. « Purification » conserve la portée cultuelle sans imposer la notion théologique plus déterminée d’« expiation ».
- source_word: αἷμα
  choice: sang
  rationale: Traduction directe requise par le contexte sacrificiel de la prière.
- source_word: ἀντίψυχον
  choice: en échange de la leur
  rationale: Le composé exprime qu’une vie est donnée à la place d’autres vies. Cette formulation préserve l’idée d’échange et de substitution sans ajouter nécessairement la nuance commerciale de « rançon ».
- source_word: ψυχήν
  choice: vie
  rationale: Dans ce contexte de martyre, ψυχή désigne la vie livrée plutôt que spécifiquement l’âme immatérielle.
- source_word: λάβε
  choice: prends
  rationale: L’impératif direct convient à la supplication adressée à Dieu et restitue simplement le grec.
theological_decisions:
- issue: Langage sacrificiel et substitutif dans la prière du martyr
  choice: Conserver explicitement les notions de purification et d’échange de vie
  alternative: Fais que mon sang les purifie, et reçois mon âme comme rançon pour eux
  rationale: Le grec associe nettement une purification cultuelle au don substitutif de la vie. La traduction garde cette tension sans l’atténuer ni la systématiser au moyen de catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe impérative préserve la force de la prière; « la leur » reprend collectivement la vie des personnes désignées par « leur ».
