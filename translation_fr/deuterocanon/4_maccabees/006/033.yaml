  yaml_path: translation/deuterocanon/4_maccabees/006/033.yaml
  text: But now[a], since reason has conquered the passions[b], we rightly assign to it the authority of leadership.
translation:
  language: fr
  text: Mais maintenant, puisque la raison[a] a vaincu les passions, nous lui attribuons à juste titre l’autorité de gouverner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement rationnel ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « l’autorité de la direction » ou « de la domination ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Mais maintenant
  rationale: Cette formulation marque la transition et la légère opposition introduites par δέ, tout en restant naturelle en français.
- source_word: λογισμοῦ
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement rationnel appelée à diriger les passions. « La raison » est concis, clair et adapté au cadre philosophique du livre.
- source_word: τὰ πάθη
  choice: les passions
  rationale: Le terme désigne ici les impulsions et affections que la raison maîtrise, plutôt que les souffrances. « Les passions » préserve le contraste éthique central du livre.
- source_word: νικήσαντος
  choice: a vaincu
  rationale: Le participe aoriste présente la victoire de la raison comme acquise; une proposition introduite par « puisque » rend naturellement le rapport circonstanciel en français.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie à « la raison ». Le français emploie naturellement « lui » avec le verbe « attribuer », sans imposer une personnification plus forte que celle du grec.
- source_word: προσηκόντως
  choice: à juste titre
  rationale: L’expression rend l’idée de convenance et de légitimité portée par l’adverbe, dans un français actuel et digne.
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: l’autorité de gouverner
  rationale: Cette formulation conserve à la fois l’idée d’autorité ou de droit contenue dans ἐξουσία et celle de direction ou de gouvernement contenue dans ἡγεμονία.
- source_word: προσνέμομεν
  choice: nous lui attribuons
  rationale: Le verbe signifie assigner, accorder ou attribuer. « Attribuer » convient au constat argumentatif selon lequel la raison reçoit la fonction qui lui revient.
theological_decisions:
- issue: Cadre anthropologique et philosophique de λογισμός et πάθη
  choice: Traduire λογισμός par « la raison » et πάθη par « les passions »
  alternative: Traduire λογισμός par « le jugement rationnel » et πάθη par « les émotions » ou « les souffrances »
  rationale: 'Le verset reprend la thèse centrale de 4 Maccabées: la raison disciplinée peut dominer les passions. Ces choix maintiennent ce cadre conceptuel sans assimiler toutes les émotions à des réalités mauvaises ni importer une anthropologie confessionnelle ultérieure.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve la structure argumentative du grec et ses termes philosophiques clés, tout en évitant une tournure excessivement littérale.
