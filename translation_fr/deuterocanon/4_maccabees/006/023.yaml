  text: But you[a], the tyrant’s bodyguards, why do you delay?
translation:
  language: fr
  text: Mais vous, les gardes du corps[a] du tyran, pourquoi tardez-vous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « porteurs de lance » ; c’est-à-dire les gardes armés ou les gardes du corps du tyran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δορυφόροι
  choice: vous, les gardes du corps
  rationale: Le nom désigne littéralement des « porteurs de lance », mais ici les hommes armés chargés de protéger et de servir le tyran. « Gardes du corps » exprime naturellement leur fonction; le pronom « vous » rend l'interpellation directe impliquée par la question.
- source_word: τοῦ τυράννου
  choice: du tyran
  rationale: Le complément du nom rend naturellement le génitif grec et « tyran » conserve la valeur politique et morale défavorable de τύραννος.
- source_word: τί μέλλετε;
  choice: pourquoi tardez-vous ?
  rationale: Employé absolument dans cette vive interpellation, μέλλω exprime le retard ou l'hésitation à agir, plutôt qu'une simple action future.
- source_word: οἱ δὲ
  choice: Mais vous
  rationale: « Mais » conserve la transition adversative de δέ, tandis que « vous » transforme naturellement la construction formellement nominale en interpellation directe en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La question conserve le ton de défi impatient du grec, sans expliciter l'action attendue.
