  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
translation:
  language: fr
  text: Après qu’il eut ainsi répondu aux tentatives de persuasion[a] du tyran en s’y opposant, les gardes[b] s’avancèrent et traînèrent Éléazar avec cruauté[c] vers les supplices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux exhortations » ou « aux appels » ; le terme grec désigne ici les paroles par lesquelles le tyran cherchait à le faire céder.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les porte-lances », c’est-à-dire les gardes armés du souverain.
    reason: lexical_alternative
  - marker: c
    text: Ou « durement » ; l’adverbe grec souligne la brutalité de leur conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: ainsi
  rationale: Rend naturellement la locution adverbiale de manière tout en conservant sa valeur démonstrative.
- source_word: ἀντιρρητορεύσαντα
  choice: répondu … en s’y opposant
  rationale: Exprime à la fois la prise de parole en réponse et son caractère explicitement opposé, sans surdéterminer la scène comme un débat formel.
- source_word: παρηγορίαις
  choice: tentatives de persuasion
  rationale: Dans ce contexte, le terme désigne les paroles par lesquelles le tyran cherche à obtenir l’obéissance d’Éléazar, plutôt qu’une consolation bienveillante.
- source_word: δορυφόροι
  choice: gardes
  rationale: Le mot signifie littéralement « porte-lances », mais désigne ici les gardes armés attachés au tyran.
- source_word: παραστάντες
  choice: s’avancèrent
  rationale: Rend le mouvement des gardes qui viennent prendre part à l’action dans la séquence narrative.
- source_word: πικρῶς
  choice: avec cruauté
  rationale: Restitue dans un français naturel la dureté sévère exprimée par l’adverbe dans le traitement infligé à Éléazar.
- source_word: ἔσυραν
  choice: traînèrent
  rationale: Conserve l’idée d’une traction forcée et violente.
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: vers les supplices
  rationale: Préserve le pluriel et l’orientation vers la torture sans imposer qu’il s’agisse précisément d’une chambre ou uniquement d’instruments.
- source_word: τὸν Ἐλεάζαρον
  choice: Éléazar
  rationale: Forme française usuelle du nom propre.
