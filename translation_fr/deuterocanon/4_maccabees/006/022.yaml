  text: In response to this[a], you, O children of Abraham, die nobly for the sake of godliness.
translation:
  language: fr
  text: En réponse à cela, vous, enfants d’Abraham, mourez noblement pour la piété envers Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour l’attachement respectueux à Dieu ». Le grec désigne une dévotion envers Dieu qui s’exprime par une conduite fidèle. La forme du verbe grec peut aussi se comprendre comme un indicatif : « vous mourez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Face à cela
  rationale: Cette tournure naturelle marque la réaction attendue à ce qui vient d’être dit, sans préciser excessivement s’il s’agit de paroles ou d’événements.
- source_word: ὑμεῖς μέν
  choice: vous
  rationale: Le pronom explicite garde l’emphase de ὑμεῖς. La nuance de mise en relief portée par μέν ressort de l’adresse directe, sans ajout lourd comme « pour votre part ».
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: enfants d’Abraham
  rationale: « Enfants » conserve l’image familiale et l’appartenance à la lignée d’Abraham. Le français moderne n’exige pas de rendre ὦ par l’interjection solennelle « ô ».
- source_word: εὐγενῶς
  choice: noblement
  rationale: Le terme exprime la dignité morale et la grandeur d’âme, sans réduire le sens au seul courage.
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: par piété envers Dieu
  rationale: Dans ce contexte juif, εὐσέβεια désigne une dévotion respectueuse envers Dieu qui se traduit par une conduite fidèle. « Par » rend naturellement le motif du sacrifice exprimé par ὑπέρ.
- source_word: τελευτᾶτε
  choice: mourez
  rationale: La forme peut, morphologiquement, être un présent de l’indicatif ou un impératif. Dans cette exhortation directe, l’impératif « mourez » correspond le mieux à la force rhétorique du passage.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété envers Dieu
  alternative: fidélité respectueuse envers Dieu
  rationale: « Piété envers Dieu » maintient ensemble la révérence religieuse et la conduite fidèle, sans introduire un concept confessionnel ultérieur. La note explicite ce sens, car « piété » peut parfois être compris trop étroitement en français moderne.
- issue: Valeur verbale de τελευτᾶτε
  choice: 'impératif : « mourez »'
  alternative: 'indicatif : « vous mourez »'
  rationale: L’adresse aux enfants d’Abraham et la tonalité exhortative favorisent l’impératif, tout en reconnaissant que la forme grecque isolée est également compatible avec l’indicatif.
translation_notes:
  register: Style actuel, digne et exhortatif. « Enfants d’Abraham » garde la portée familiale et scripturaire; l’absence de « ô » évite une solennité devenue artificielle en français courant.
