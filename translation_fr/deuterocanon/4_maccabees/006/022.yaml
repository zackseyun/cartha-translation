    rationale: La forme grecque est morphologiquement ambiguë entre indicatif présent et impératif présent. Même si le contexte favorise l’exhortation, cette décision doit être signalée plutôt que tenue pour certaine.
  - severity: low
    issue: « Face à cela » est moins précis pour πρὸς ταῦτα.
    rationale: La locution introduit une réponse ou une réaction à ce qui précède; « En réponse à cela » le rend plus nettement.
  - severity: medium
    issue: « par piété envers Dieu » affaiblit légèrement la valeur de ὑπὲρ τῆς εὐσεβείας.
    rationale: « Par » décrit volontiers le motif personnel, tandis que ὑπέρ présente la piété comme la cause ou l’enjeu pour lequel on meurt. « Pour la piété envers Dieu » garde cette orientation.
