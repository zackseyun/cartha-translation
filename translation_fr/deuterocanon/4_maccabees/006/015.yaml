  text: We will set out some roasted foods[a], but you, by pretending to taste pork, save yourself.
translation:
  language: fr
  text: Nous te présenterons des aliments cuits ; mais toi, fais semblant de goûter du porc et sauve ta vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡψημένων
  choice: cuits
  rationale: Le participe désigne des aliments préparés par la cuisson sans imposer ici un mode précis. « Cuits » préserve cette portée mieux que « rôtis ».
- source_word: βρωμάτων
  choice: aliments
  rationale: βρῶμα désigne ce qui se mange, et non nécessairement de la viande. « Aliments » conserve ce sens général.
- source_word: παραθήσομεν
  choice: nous te présenterons
  rationale: Dans un contexte de repas, παρατίθημι signifie placer ou présenter quelque chose devant quelqu’un. L’ajout explicite de « te » rend naturellement en français le destinataire sous-entendu.
- source_word: ὑποκρινόμενος
  choice: fais semblant
  rationale: Le participe exprime l’action de feindre. La tournure impérative française restitue son lien avec l’ordre σώθητι.
- source_word: τῶν ὑείων
  choice: du porc
  rationale: L’adjectif substantivé renvoie à des aliments provenant du porc. « Du porc » est clair et idiomatique en français contemporain.
- source_word: ἀπογεύσασθαι
  choice: d’avoir goûté
  rationale: L’infinitif aoriste signifie goûter ou prendre un peu de quelque chose. L’infinitif passé convient après « faire semblant » et présente la dégustation comme l’acte simulé.
- source_word: σώθητι
  choice: sauve-toi
  rationale: Dans ce contexte, l’impératif appelle Éléazar à préserver sa vie. « Sauve-toi » exprime cette survie physique immédiate sans introduire un sens doctrinal étranger au passage.
theological_decisions:
- issue: Désignation de l’aliment interdit dans le contexte du martyre juif
  choice: du porc
  alternative: de la viande de porc
  rationale: « Du porc » nomme directement l’aliment interdit et garde une formulation naturelle, sans atténuer l’enjeu de fidélité à la Loi.
- issue: Portée de σώθητι
  choice: sauve-toi
  alternative: sois sauvé
  rationale: Le contexte concerne la préservation immédiate de la vie. La forme pronominale française évite de suggérer ici une notion théologique de salut que le contexte n’exige pas.
translation_notes:
  register: Français moderne, direct et digne. Le contraste μὲν…δέ est rendu par le point-virgule et la reprise emphatique « toi ». Aucun marqueur de note n’est nécessaire, puisque les choix retenus peuvent être exprimés clairement dans le texte.
