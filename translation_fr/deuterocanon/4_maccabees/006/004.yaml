  text: “Obey the king’s commands,” another herald cried out[a].
translation:
  language: fr
  text: « Obéis aux ordres du roi ! » cria un héraut d’un autre endroit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cria un autre héraut ». Plus littéralement, le grec présente un héraut criant « d’un autre endroit »; il peut s’agir d’un autre héraut, mais l’expression souligne d’abord la provenance de l’appel.'
    reason: ambiguïté syntaxique et alternative lexicale
lexical_decisions:
- source_word: Πείσθητι
  choice: Obéis
  rationale: Bien que la forme puisse littéralement signifier « laisse-toi persuader », le contexte d’une injonction à se conformer aux directives royales appelle naturellement « obéis » en français.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: aux ordres du roi
  rationale: « Ordres » rend clairement l’autorité des ἐντολαί royales et constitue une formulation française naturelle.
- source_word: ἑτέρωθεν
  choice: depuis un autre côté
  rationale: Cette expression conserve la valeur spatiale de l’adverbe, « d’un autre côté / d’un autre endroit », sans conclure nécessairement qu’il s’agit d’un autre héraut.
- source_word: κῆρυκος
  choice: un héraut
  rationale: κῆρυξ désigne un proclamateur officiel; « héraut » en garde la précision institutionnelle.
- source_word: ἐπιβοῶντος
  choice: cria
  rationale: Le participe exprime un appel lancé à haute voix; « cria » est direct, actuel et adapté à la proclamation rapportée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. L’impératif et le point d’exclamation rendent la vigueur de l’injonction. La traduction principale préserve la nuance spatiale de ἑτέρωθεν, tandis que la note signale l’interprétation possible « un autre héraut ».
