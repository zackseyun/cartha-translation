base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: fr
  text: Mais moi, je me suis avancé de mon plein gré[a], afin qu’après m’avoir tué moi aussi, tu encourres, de la part de la justice céleste[b], un châtiment pour davantage de méfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me suis présenté de ma propre initiative » ou « je me suis avancé de moi-même ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la justice du ciel » ; l’expression peut aussi évoquer le jugement céleste.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: Mais moi, je me suis avancé de mon plein gré
  rationale: αὐτός renforce l’initiative personnelle, tandis que ἀπʼ ἐμαυτοῦ exprime une démarche volontaire. La tournure française réunit naturellement ces deux nuances.
- source_word: παρῆλθον
  choice: je me suis avancé
  rationale: Dans ce contexte, le verbe décrit le fait de s’avancer volontairement pour se présenter au tyran; «se suis avancé» reste naturel et concret.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit ici le but recherché par le locuteur.
- source_word: κἀμὲ κατακτείνας
  choice: après m’avoir tué moi aussi
  rationale: κἀμέ conserve la valeur additive «moi aussi», et le participe aoriste marque une action antérieure à celle du verbe principal.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: pour davantage d’actes injustes
  rationale: La formulation rend la responsabilité liée à des méfaits supplémentaires, sans transformer indûment ἀδίκημα en terme pénal technique.
- source_word: ὀφλήσῃς
  choice: tu aies à subir
  rationale: Le verbe évoque une dette ou une responsabilité encourue. Avec «un châtiment», cette tournure française exprime clairement l’obligation punitive qui en résulte.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: de la part de la justice céleste
  rationale: Le datif désigne l’instance à laquelle le tyran devient redevable ou dont vient le châtiment. Cette expression préserve l’idée de justice transcendante sans imposer une personnification complète.
- source_word: τιμωρίαν
  choice: un châtiment
  rationale: Le terme désigne une sanction rétributive; «châtiment» convient au registre solennel du passage tout en restant compréhensible.
theological_decisions:
- issue: Sens de τῇ οὐρανίᾳ δίκῃ
  choice: la justice céleste
  alternative: la justice du ciel; le jugement céleste
  rationale: «Justice céleste» maintient l’ambiguïté entre la justice divine comme ordre moral, comme instance judiciaire et comme justice partiellement personnifiée, sans préciser davantage que le grec.
translation_notes:
  register: Français international moderne, digne et direct. Le discours conserve le ton de défi du martyr ainsi que la dimension juridique et rétributive de la phrase grecque.
