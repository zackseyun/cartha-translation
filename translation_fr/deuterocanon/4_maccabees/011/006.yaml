translation:
  language: fr
  text: Mais ces choses venant de vous ne sont pas dignes de tortures.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais ces choses de vous ne sont pas dignes de tortures. » Le grec ὑμῶν peut indiquer ici la provenance (« venant de vous ») ou, plus généralement, une relation (« de vous »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Conjonction adversative marquant le contraste avec la déclaration précédente; « Mais » est ici naturel et concis.
- source_word: ταῦτα
  choice: ce qui
  rationale: Le démonstratif neutre pluriel désigne globalement les actes ou paroles en question. « Ce qui » rend naturellement cette référence en français sans en préciser indûment le contenu.
- source_word: ὑμῶν
  choice: vient de vous
  rationale: Le génitif peut exprimer ici la provenance ou la relation. « Vient de vous » transmet le sens contextuel probable tout en conservant l’ambiguïté littérale dans la note.
- source_word: βασάνων
  choice: de telles tortures
  rationale: Dans ce récit de martyre, βάσανος désigne des supplices physiques. « Tortures » convient au contexte; « de telles » rend idiomatique en français la relation avec ce qui précède sans identifier davantage les supplices.
- source_word: ἄξια
  choice: ne mérite pas
  rationale: ἄξιος suivi du génitif exprime ce qui est digne ou mérite quelque chose. La tournure verbale est plus naturelle en français courant que « n’est pas digne de » dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation principale privilégie le sens contextuel probable du génitif ὑμῶν, tandis que la note conserve son ambiguïté grammaticale. Aucun enjeu théologique particulier n’est tranché.
