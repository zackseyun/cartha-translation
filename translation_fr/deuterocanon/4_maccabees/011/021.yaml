  text: For godly understanding is unconquerable[a], O tyrant.
translation:
  language: fr
  text: Car la connaissance pieuse est invincible, ô tyran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’intelligence pieuse » ou « la connaissance empreinte de piété ». L’expression grecque unit la piété envers Dieu à la connaissance ou à l’intelligence raisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνίκητος
  choice: invincible
  rationale: L’adjectif signifie « qui ne peut être vaincu ». « Invincible » est naturel, digne et conserve ici la force prédicative du grec.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication ou la justification de ce qui précède; « car » en rend directement la fonction argumentative.
- source_word: ὦ τύραννε
  choice: ô tyran
  rationale: La particule vocative ὦ marque une interpellation solennelle. « Ô tyran » conserve à la fois l’adresse directe et la portée polémique de τύραννος.
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: la connaissance qui vient de la piété
  rationale: ἐπιστήμη désigne la connaissance ou l’intelligence raisonnée, tandis que εὐσεβής la caractérise par la piété et le respect dû à Dieu. Cette formulation française conserve les deux dimensions sans imposer un terme philosophique trop étroit.
theological_decisions:
- issue: Rendu de l’expression programmatique εὐσεβὴς ἐπιστήμη
  choice: la connaissance qui vient de la piété
  alternative: l’intelligence pieuse; la connaissance inspirée par la piété
  rationale: Le texte unit connaissance rationnelle et piété sans préciser entièrement leur rapport. « Qui vient de » exprime leur lien de façon naturelle, tandis que la note préserve des rendus plus formels et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocatif « ô tyran » garde la solennité et la vigueur de l’interpellation grecque; la phrase reste concise comme l’original.
