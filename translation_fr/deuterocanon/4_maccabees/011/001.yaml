  text: And when this one also had died under torture[a], the fifth came forward, saying,
translation:
  language: fr
  text: 'Lorsque celui-ci aussi mourut sous les tortures, le cinquième fit signe[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « donna un signe » ; le grec ne précise ni la nature du signe ni son destinataire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Lorsque
  rationale: Introduit naturellement en français l’événement suivant tout en conservant la relation temporelle exprimée par ὡς ; la transition portée par δέ ressort de l’enchaînement narratif.
- source_word: καὶ οὗτος
  choice: celui-ci, lui aussi
  rationale: Le démonstratif renvoie au frère qui vient d’être mentionné, et « lui aussi » souligne qu’il subit le même sort que les précédents.
- source_word: ταῖς βασάνοις καταικισθεὶς
  choice: après avoir été soumis à de cruelles tortures
  rationale: Cette formulation réunit naturellement la mention des tortures et l’idée de traitement brutal exprimée par le participe, sans réduire celui-ci au seul fait de mourir.
- source_word: ἐναπέθανεν
  choice: mourut
  rationale: Rend directement l’aoriste narratif ; la construction « lorsque… après avoir été… » indique clairement que les tortures précèdent l’intervention du cinquième.
- source_word: ὁ πέμπτος
  choice: le cinquième
  rationale: Conserve l’ordinal substantivé du grec ; le contexte permet de comprendre qu’il s’agit du cinquième frère.
- source_word: παρεσήμαινεν
  choice: fit signe
  rationale: Préserve l’idée d’un signe ou d’une indication sans préciser arbitrairement le geste, son destinataire ou son contenu.
- source_word: λέγων
  choice: en disant
  rationale: Rend le participe qui introduit directement les paroles du personnage au verset suivant.
