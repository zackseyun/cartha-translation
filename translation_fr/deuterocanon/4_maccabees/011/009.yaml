  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les gardes interviennent pendant qu’il parle, le lient, puis le traînent vers l’appareil. Toutefois, « l’attachèrent » peut suggérer qu’ils l’ont fixé à un objet, alors que δήσαντες signifie d’abord qu’ils l’ont lié. « Le ligotèrent » rend plus exactement cette action préalable. « De telles paroles » reflète aussi plus directement le pluriel τοιαῦτα λέγοντα.'
  naturalness: La phrase est naturelle et de registre sobre. La révision proposée conserve sa concision tout en évitant l’ambiguïté française de « attacher quelqu’un ».
  terminology: « Gardes » convient à δορυφόροι dans ce contexte. « Instrument de torture » est une solution prudente et idiomatique pour καταπέλτης, dont le sens ordinaire est « catapulte » mais dont le référent précis est incertain ici. La note préserve utilement cette incertitude sans imposer l’identification à une roue.
