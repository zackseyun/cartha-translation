  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: fr
  text: Pendant qu’il disait de telles paroles, les gardes le ligotèrent et le traînèrent jusqu’à l’instrument de torture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne habituellement une « catapulte ». Ici, il s’agit d’un appareil de torture, parfois identifié à une roue de supplice.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  choice: cela
  rationale: Le neutre pluriel renvoie globalement aux paroles qui précèdent. En français courant, « disait cela » restitue naturellement cette référence sans en préciser indûment le contenu.
- source_word: λέγοντα
  choice: Pendant qu’il disait
  rationale: Le participe présent indique que la parole était en cours lorsque les gardes se saisirent de lui.
- source_word: οἱ δορυφόροι
  choice: les gardes
  rationale: Le terme signifie littéralement « porte-lances », mais désigne couramment des gardes armés ou des gardes du corps. « Les gardes » convient au contexte et évite de supposer qu’ils protégeaient personnellement le souverain.
- source_word: δήσαντες
  choice: l’attachèrent
  rationale: 'Le participe aoriste exprime une action préalable au déplacement forcé : ils l’immobilisent en le liant, puis le traînent.'
- source_word: εἵλκον
  choice: le traînèrent
  rationale: Le verbe à l’imparfait décrit un déplacement imposé avec force ; « traîner » en conserve la violence.
- source_word: καταπέλτην
  choice: l’instrument de torture
  rationale: Le sens ordinaire est « catapulte », mais le contexte décrit un appareil de supplice. La nature exacte de l’appareil reste incertaine ; une désignation générique dans le texte évite de présenter comme assurée l’identification traditionnelle à la roue.
theological_decisions:
- issue: Identification de καταπέλτην dans le contexte du supplice
  choice: instrument de torture
  alternative: catapulte ; roue de supplice
  rationale: Le contexte impose un appareil de torture plutôt qu’une machine de guerre, mais le grec ne permet pas d’identifier avec certitude sa forme. Le texte principal conserve cette prudence, tandis que la note signale le sens littéral et l’interprétation traditionnelle.
translation_notes:
  register: Français moderne, international et digne. La phrase garde la succession nette des actions et la brutalité de « traînèrent », tout en préservant l’incertitude lexicale concernant l’appareil.
