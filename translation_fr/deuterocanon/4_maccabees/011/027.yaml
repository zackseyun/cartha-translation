base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: fr
  text: Car nos gardes sont placés au-dessus de nous, non pour un tyran, mais pour la loi divine. Voilà pourquoi notre raison est invincible[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre jugement raisonné ne peut être vaincu ». Le mot grec traduit par « raison » est un terme essentiel de 4 Maccabées pour désigner la faculté rationnelle qui gouverne les passions.
    reason: Préciser la portée du terme philosophique λογισμός et signaler une autre formulation possible.
lexical_decisions:
- source_word: τυράννου
  choice: tyran
  rationale: « Tyran » conserve la valeur négative de τύραννος et le contraste entre un pouvoir humain oppressif et la loi divine.
- source_word: θείου νόμου
  choice: loi divine
  rationale: Cette traduction suit directement l’expression adjectivale grecque, sans la reformuler plus explicitement en « loi de Dieu ».
- source_word: προεστήκασιν ἡμῶν
  choice: veillent sur nous
  rationale: Le parfait de προΐστημι exprime ici une position établie de garde ou de protection à l’égard des personnes désignées par ἡμῶν. « Veillent sur nous » restitue naturellement cette relation en français.
- source_word: οἱ δορυφόροι
  choice: les gardes
  rationale: Le mot désigne littéralement des porteurs de lance, puis des gardes armés. « Gardes » rend leur fonction sans imposer un type précis d’armement.
- source_word: διὰ τοῦτο
  choice: voilà pourquoi
  rationale: Cette tournure française marque clairement la conséquence tirée de l’affirmation précédente.
- source_word: ἀνίκητον
  choice: invincible
  rationale: « Invincible » exprime directement ce qui ne peut être vaincu ou dominé et convient au registre philosophique du passage.
- source_word: λογισμόν
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne notamment la faculté rationnelle ou le jugement raisonné qui gouverne les passions. « Raison » préserve ce terme directeur de l’œuvre.
theological_decisions:
- issue: Rapport des gardes au tyran ou à la loi divine
  choice: ne sont pas ceux d’un tyran, mais ceux de la loi divine
  alternative: ne servent pas un tyran, mais la loi divine
  rationale: Le grec établit une appartenance ou une relation d’autorité au moyen des génitifs τυράννου et θείου νόμου. La formulation retenue maintient cette relative indétermination au lieu de préciser qu’il s’agit nécessairement d’un service actif.
- issue: Portée de λογισμός
  choice: notre raison est invincible
  alternative: nous possédons une faculté de raisonnement que rien ne peut vaincre
  rationale: La formulation concise conserve la tension philosophique du texte et évite de réduire λογισμός soit à une pensée ponctuelle, soit à l’esprit humain dans son ensemble.
translation_notes:
  register: Français international moderne, clair et digne. « Ceux d’un tyran… ceux de la loi divine » conserve le parallélisme grec, tandis que « veillent sur nous » rend idiomatiquement la fonction exprimée par προΐστημι.
