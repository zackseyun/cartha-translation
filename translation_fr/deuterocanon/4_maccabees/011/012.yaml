base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: fr
  text: « C’est bien, disait-il, le tyran, malgré lui, nous accorde des faveurs — oui, c’est bien — en nous donnant l’occasion, par des souffrances plus nobles, de manifester notre constance envers notre Loi. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλῶς … καλῶς
  choice: C’est bien … oui, c’est bien
  rationale: La répétition exprime une approbation ironique et appuyée. La conserver respecte l’insistance du grec tout en restant naturelle en français.
- source_word: ἔλεγεν
  choice: disait-il
  rationale: L’imparfait grec est rendu par l’imparfait français, qui convient à cette incise narrative.
- source_word: ἄκων ὁ τύραννος
  choice: malgré lui, le tyran
  rationale: 'Le nominatif ὁ τύραννος se rattache naturellement au participe ἄκων et au verbe χαρίζῃ : c’est le tyran qui, contre son gré, procure ces bienfaits. Cette analyse suit directement la syntaxe grecque plutôt que la ponctuation interprétative de la couche anglaise.'
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: nous accorde des faveurs
  rationale: 'Cette formulation française garde le jeu étymologique autant que possible et surtout l’ironie : les supplices infligés deviennent involontairement des faveurs pour les martyrs.'
- source_word: διὰ γενναιοτέρων πόνων
  choice: par des souffrances plus nobles
  rationale: πόνοι désigne ici les épreuves douloureuses, tandis que le comparatif γενναιοτέρων les qualifie de plus nobles ou plus dignes, et non simplement de plus intenses.
- source_word: ἐπιδείξασθαι παρέχων
  choice: puisqu’il nous donne l’occasion … de manifester
  rationale: 'Le participe παρέχων indique comment le tyran leur accorde ces faveurs : il leur fournit l’occasion de rendre visible leur persévérance.'
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: notre persévérance par fidélité à notre Loi
  rationale: καρτερία évoque la fermeté durable sous l’épreuve. La tournure εἰς τὸν νόμον indique l’orientation de cette constance vers la Loi ; « par fidélité à » exprime clairement cette relation sans réduire la formule à une simple endurance physique.
theological_decisions:
- issue: Sens et graphie de νόμος dans le contexte du martyre juif
  choice: notre Loi
  alternative: notre loi
  rationale: Le mot renvoie ici à la Loi divine et ancestrale à laquelle les martyrs demeurent fidèles. La majuscule française identifie naturellement ce référent précis sans ajouter de contenu confessionnel.
- issue: Identification de la personne agissant « malgré elle »
  choice: Le tyran accorde malgré lui des faveurs aux martyrs
  alternative: Le tyran parle lui-même à contrecœur
  rationale: La construction grecque ἄκων ὁ τύραννος χάριτας ἡμῖν χαρίζῃ fait du tyran le sujet qui procure involontairement les faveurs. L’incise ἔλεγεν renvoie au martyr qui prononce la phrase. Cette lecture maintient l’ironie théologique du passage sans attribuer au tyran l’aveu exprimé.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation rend lisible l’incise « disait-il » et l’ironie de la double approbation, sans effacer la répétition grecque. « Persévérance par fidélité à notre Loi » privilégie une formulation idiomatique tout en conservant l’orientation exprimée par εἰς.
