  text: Six young men have overthrown your tyranny.
translation:
  language: fr
  text: Nous, six jeunes hommes, avons renversé ta tyrannie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ μειράκια
  choice: six jeunes hommes
  rationale: Le numéral et le diminutif désignent six personnes de sexe masculin encore jeunes. « Jeunes hommes » exprime leur jeunesse sans leur donner une tonalité enfantine que pourrait suggérer « garçons ».
- source_word: κατελύσαμέν
  choice: nous avons renversé
  rationale: L’aoriste de καταλύω présente l’action comme accomplie. « Avons renversé » convient à la tyrannie prise pour objet et conserve la force triomphale de la déclaration.
- source_word: σου
  choice: ta
  rationale: Le génitif de la deuxième personne du singulier indique ici la possession et correspond naturellement au tutoiement adressé au tyran.
- source_word: τὴν τυραννίδα
  choice: tyrannie
  rationale: τυραννίς désigne le pouvoir tyrannique ou la domination oppressive. « Tyrannie » en est l’équivalent français direct et naturel.
theological_decisions:
- issue: Portée de l’aoriste dans cette déclaration lancée au persécuteur
  choice: « nous avons renversé »
  alternative: « nous renversâmes » ; « nous avons mis fin à »
  rationale: Le passé composé rend naturellement en français moderne l’action accomplie affirmée par l’aoriste. La formulation maintient la revendication rhétorique d’une victoire déjà acquise sur la tyrannie, sans préciser s’il s’agit d’un renversement politique ou d’une défaite morale.
translation_notes:
  register: Français moderne, direct et digne. L’ajout de « Nous sommes » rend explicite la valeur prédicative du groupe nominal grec placé en tête et évite l’ambiguïté peu naturelle de « Six jeunes hommes avons… ». Le tutoiement conserve l’adresse singulière et provocatrice au tyran.
