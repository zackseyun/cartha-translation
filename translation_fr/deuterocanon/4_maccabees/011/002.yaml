  text: I am not about to shrink back[a], tyrant, from the torture for the sake of virtue.
translation:
  language: fr
  text: Je ne vais pas reculer[a], tyran, devant la torture pour la vertu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne vais pas refuser la torture pour la vertu. » Le verbe grec peut signifier décliner ou refuser, mais il évoque ici le fait de ne pas se dérober devant la souffrance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Je ne vais pas
  rationale: Avec l’infinitif, μέλλω exprime ici une intention immédiate et résolue. « Je ne vais pas » garde la vivacité et la fermeté de la déclaration.
- source_word: τύραννε
  choice: tyran
  rationale: Le vocatif interpelle directement le souverain par un terme moralement chargé et ouvertement accusateur.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: devant la torture
  rationale: Avec παραιτεῖσθαι rendu par « reculer », « devant » constitue la tournure française naturelle. « Torture » restitue précisément βασανισμός dans ce contexte de martyre.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: pour l’amour de la vertu
  rationale: Cette expression française indique que l’attachement à la vertu motive l’acceptation de la torture, tout en conservant la portée éthique et philosophique de ἀρετή.
- source_word: παραιτεῖσθαι
  choice: reculer
  rationale: Le verbe peut signifier refuser ou décliner, mais, dans ce contexte, il évoque le fait de ne pas se dérober devant la souffrance. « Reculer » rend cette nuance sans suggérer un mouvement physique nécessaire.
theological_decisions:
- issue: Sens de ἀρετή dans le contexte philosophique du martyre
  choice: vertu
  alternative: excellence
  rationale: « Vertu » préserve le registre éthique central de 4 Maccabées, où la raison pieuse se manifeste par la fermeté morale dans la souffrance, sans préciser davantage que le grec.
translation_notes:
  register: Français moderne, direct et digne. L’apostrophe « tyran » conserve la force provocatrice du vocatif grec. La formulation garde le vocabulaire philosophique de la « vertu » sans l’expliciter doctrinalement.
