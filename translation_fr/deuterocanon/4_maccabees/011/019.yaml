  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les broches chauffées sont appliquées au dos, les flancs sont percés, puis les entrailles sont brûlées. « À partir de là » affaiblit toutefois le lien littéral avec ἀπ’ αὐτοῦ (« de lui / depuis lui ») et sonne peu naturel dans cette construction. « Contre son dos » rend plus exactement προσέφερον que « sur son dos ».'
  naturalness: Le registre est digne et moderne, et l’imparfait « brûlaient » restitue bien l’aspect duratif de διέκαιον. La formulation révisée améliore la collocation française (« appliquer contre ») et remplace « à partir de là » par une tournure plus fluide, tout en signalant en note l’ambiguïté du grec.
  terminology: « Broches pointues », « flancs » et « entrailles » sont appropriés et conservent la précision concrète et le registre soutenu du passage. « Faire rougir au feu » est une bonne restitution de πυρώσαντες.
