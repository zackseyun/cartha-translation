  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
translation:
  language: fr
  text: Puis ils firent rougir au feu des broches pointues et les appliquèrent contre son dos ; après lui avoir transpercé les flancs, ils lui brûlaient les entrailles de l’intérieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de lui » ou « depuis lui ». L’expression grecque est obscure ; elle peut indiquer que le feu atteignait les entrailles à travers les ouvertures pratiquées dans ses flancs.'
    reason: ambiguïté textuelle et lexicale
lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: des broches pointues
  rationale: ὀβελίσκος désigne une petite broche ou tige métallique, et ὀξύς en souligne la pointe. « Broches pointues » conserve la nature probable de l’instrument sans généraliser en « pointes ».
- source_word: πυρώσαντες
  choice: ils firent rougir au feu
  rationale: Le participe indique une action antérieure et πυρόω signifie porter au feu, rendre brûlant. Cette formulation exprime plus nettement l’intense chauffage du métal que le simple « chauffèrent ».
- source_word: τοῖς νώτοις προσέφερον
  choice: les appliquèrent sur son dos
  rationale: προσφέρω signifie ici porter contre ou appliquer. « Appliquer sur » reste précis sans ajouter explicitement l’idée de pression.
- source_word: τὰ πλευρὰ διαπείραντες
  choice: après lui avoir transpercé les flancs
  rationale: πλευρά désigne les côtés ou les flancs, tandis que διαπείρω exprime une perforation traversante. « Flancs » convient au registre anatomique et « transpercé » restitue la force du verbe.
- source_word: τὰ σπλάγχνα
  choice: les entrailles
  rationale: Dans ce contexte corporel, σπλάγχνα désigne les organes internes. « Entrailles » en préserve la force concrète et le registre solennel.
- source_word: διέκαιον
  choice: ils lui brûlaient
  rationale: L’imparfait grec décrit l’action en cours. L’imparfait français en conserve l’aspect duratif au sein de la scène de torture.
- source_word: ἀπʼ αὐτοῦ
  choice: à partir de là
  rationale: Le grec signifie littéralement « depuis lui/cela » et son référent spatial demeure difficile. « À partir de là » conserve cette imprécision mieux qu’une explicitation telle que « de l’intérieur ».
