  - severity: medium
    issue: « à partir de là » pour ἀπ’ αὐτοῦ
    rationale: Cette expression est maladroite ici et transforme le pronom grec, littéralement « de lui / depuis lui », en un déictique spatial déterminé. Une formulation idiomatique peut exprimer la lecture contextuelle tout en maintenant l’incertitude du référent et de la relation spatiale dans la note.
