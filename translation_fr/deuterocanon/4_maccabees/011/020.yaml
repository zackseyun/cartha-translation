  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: fr
  text: 'Mais tandis qu’on le torturait, lui qui menait une vie consacrée[a], il disait : « En raison de notre fidélité à Dieu, nous, frères si nombreux appelés à nous exercer dans les souffrances, n’avons pas été vaincus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est inhabituelle. Littéralement, elle évoque un « âge » ou une « existence » conforme au sacré. Le mot grec peut désigner un âge, une durée de vie ou une manière de vivre; « menait une vie consacrée » privilégie cette dernière possibilité. On pourrait aussi comprendre « d’un âge saint » ou « d’une existence consacrée ».
    reason: Alternative lexicale préservant l’ambiguïté de ἱεροπρεποῦς αἰῶνος.
lexical_decisions:
- source_word: βασανιζόμενος
  choice: tandis qu’on le torturait
  rationale: Le participe présent passif exprime une action en cours; dans ce contexte de martyre, le verbe désigne concrètement la torture physique.
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: lui qui appartenait à une existence consacrée
  rationale: L’expression grecque est inhabituelle. « Existence » permet à αἰών de désigner la durée ou le mode de vie, tandis que « consacrée » rend le caractère sacré exprimé par ἱεροπρεπής sans imposer le sens temporel peu naturel d’« âge saint ».
- source_word: εὐσέβειαν
  choice: attachement à Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la fidélité respectueuse envers Dieu, manifestée notamment par l’obéissance à sa Loi. Cette formulation est claire en français moderne et conserve l’orientation vers Dieu.
- source_word: γυμνασίαν πόνων
  choice: s’exercer dans les souffrances
  rationale: La formulation maintient l’image de l’entraînement contenue dans γυμνασία tout en rendant πόνων par « souffrances »; elle évite de transformer explicitement l’exercice en « combat ».
- source_word: ἀδελφοὶ
  choice: frères
  rationale: Il s’agit ici des frères biologiques du martyr, et non d’un groupe générique mixte.
- source_word: κληθέντες
  choice: ont été appelés
  rationale: Le passif préserve la notion d’appel ou de convocation sans identifier celui qui appelle.
- source_word: οὐκ ἐνικήθημεν
  choice: nous n’avons pas été vaincus
  rationale: Le passif conserve l’image de victoire et de défaite ainsi que l’accent mis sur l’échec des persécuteurs à les dominer.
theological_decisions:
- issue: Sens de ἱεροπρεποῦς αἰῶνος
  choice: Une caractérisation de l’existence consacrée du martyr
  alternative: « appartenant à un âge saint » ou « menant une vie sainte »
  rationale: Le grec peut évoquer un âge, une durée de vie ou une manière d’exister. Le texte retient une expression intelligible mais encore ouverte, et la note signale les principales possibilités sans trancher davantage.
- issue: Portée de εὐσέβεια
  choice: « attachement à Dieu »
  alternative: « piété » ou « respect de Dieu »
  rationale: Ce choix exprime la fidélité religieuse qui motive les martyrs sans réduire le terme à une simple disposition intérieure ni introduire une formulation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images de l’exercice et de la victoire ainsi que l’ambiguïté de l’expression grecque relative à l’existence consacrée.
