    issue: Formulation française peu naturelle de ἱεροπρεποῦς αἰῶνος
    rationale: « appartenait à une existence consacrée » n’est pas idiomatique et suggère une relation d’appartenance qui n’est pas exprimée directement par le grec. Une formulation de vie consacrée est plus naturelle, avec une note qui conserve les autres possibilités.
  - severity: low
    issue: Lien syntaxique de « Puisque, par attachement à Dieu »
    rationale: Cette construction est lourde et peut faire de la fidélité à Dieu la seule cause de l’absence de défaite. « En raison de notre fidélité à Dieu » suit plus souplement l’expression grecque, dont la portée exacte demeure condensée.
