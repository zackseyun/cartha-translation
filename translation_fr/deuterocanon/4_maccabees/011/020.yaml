revisions:
- from: 'Mais tandis qu’on le torturait, lui qui appartenait à une existence consacrée[a], il disait : « Puisque, par attachement à Dieu, tant de frères ont été appelés à s’exercer dans les souffrances, nous n’avons pas été vaincus. »'
  to: 'Mais tandis qu’on le torturait, lui qui menait une vie consacrée[a], il disait : « En raison de notre fidélité à Dieu, nous, frères si nombreux appelés à nous exercer dans les souffrances, n’avons pas été vaincus. »'
  rationale: La révision améliore l’idiomaticité française et la cohérence syntaxique tout en conservant la violence concrète de la torture, le vocabulaire d’entraînement et de victoire, ainsi que l’ambiguïté lexicalement réelle de ἱεροπρεποῦς αἰῶνος dans la note.
