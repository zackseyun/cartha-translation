review_pass:
  verdict: revise
  source_fidelity: Le sens de βασανιζόμενος, de l’image athlétique de γυμνασία πόνων, du passif de κληθέντες et de celui de οὐκ ἐνικήθημεν est conservé. « Puisque » affaiblissait toutefois la structure rhétorique et rendait imprécis le rapport de διὰ τὴν εὐσέβειαν à la proposition principale. La formulation révisée conserve une relation causale sans la surdéfinir. Pour ἱεροπρεποῦς αἰῶνος, la note maintient explicitement l’ambiguïté entre durée/âge et manière de vivre.
  naturalness: « Lui qui appartenait à une existence consacrée » est peu idiomatique en français moderne. « Lui qui menait une vie consacrée » est naturel et digne; la note empêche que cette explicitation stylistique soit prise pour une résolution définitive du grec inhabituel. La reprise « nous, frères si nombreux » rend plus clairement le lien entre ἀδελφοὶ τοσοῦτοι et le « nous » du locuteur.
  terminology: « Fidélité à Dieu » rend naturellement εὐσέβεια dans le contexte de 4 Maccabées, avec sa dimension de dévotion concrète, sans imposer une interprétation confessionnelle. « S’exercer dans les souffrances » maintient l’image d’entraînement de γυμνασία. « Vaincus » préserve l’imagerie de victoire de νικάω.
  issues:
