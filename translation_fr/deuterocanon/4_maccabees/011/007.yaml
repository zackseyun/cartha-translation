  text: si du moins tu avais conscience des désirs humains et si tu avais auprès de Dieu l’espérance du salut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπερ
  choice: si du moins
  rationale: Rend la condition appuyée, avec sa nuance de doute ou de mise en cause.
- source_word: ἠσθάνου
  choice: tu comprenais
  rationale: Le verbe signifie percevoir ou avoir conscience de quelque chose; «comprendre» est naturel ici sans réduire le propos à une simple sensation.
- source_word: ἀνθρώπους πόθων
  choice: les désirs humains
  rationale: Le texte imprimé paraît présenter une difficulté grammaticale; cette traduction suit le sens contextuel probable, conforme à la lecture «ἀνθρωπίνων πόθων» attestée dans la tradition éditoriale.
- source_word: ἐλπίδα εἶχες παρὰ θεῷ σωτηρίου
  choice: si tu espérais que Dieu te sauverait
  rationale: Exprime naturellement en français l'espérance placée auprès de Dieu en vue du salut ou de la délivrance, sans préciser indûment sa modalité.
theological_decisions:
- issue: Sens de σωτηρίου
  choice: te sauverait
  alternative: te délivrerait
  rationale: «Sauver» conserve la largeur sémantique du grec, qui peut désigner ici la délivrance sans exclure la portée religieuse.
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme conditionnel grec est conservé; la formulation évite le tour peu naturel «avoir une espérance auprès de Dieu de salut».
