  yaml_path: translation/deuterocanon/4_maccabees/011/013.yaml
  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: fr
  text: 'Après la mort de celui-ci, on amena le sixième, un jeune homme. Le tyran lui demanda s’il voulait être relâché à condition de manger. Il répondit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ καὶ τούτου
  choice: Après la mort de celui-ci
  rationale: Rend naturellement le génitif absolu et renvoie au frère précédent sans ajouter explicitement « frère » ni préciser la nature de sa mort.
- source_word: ὁ ἕκτος
  choice: le sixième
  rationale: Conserve l’ordinal substantivé du grec; le contexte identifie le sixième de la fratrie.
- source_word: ἤγετο
  choice: on amena
  rationale: L’imparfait passif de ἄγω décrit ici la conduite du jeune homme devant le tyran; la tournure française active indéfinie est naturelle et garde l’agent implicite.
- source_word: μειρακίσκος
  choice: un jeune homme
  rationale: Désigne un jeune individu de sexe masculin; « jeune homme » est actuel, clair et digne, contrairement à « garçon » ou « adolescent », plus précis quant à l’âge.
- source_word: πυνθανομένου τοῦ τυράννου
  choice: Le tyran lui demanda
  rationale: Transpose le second génitif absolu en proposition principale naturelle et conserve la désignation moralement chargée τύραννος.
- source_word: εἰ βούλοιτο
  choice: s’il voulait
  rationale: Préserve la valeur volitive de βούλομαι et le caractère indirect de la question.
- source_word: φαγὼν ἀπολύεσθαι
  choice: manger pour être relâché
  rationale: Exprime le lien entre l’acte de manger et la libération promise, sans ajouter l’objet alimentaire que ce verset ne formule pas.
- source_word: ὁ δὲ ἔφη
  choice: 'Il répondit :'
  rationale: Dans cet échange, « répondit » restitue naturellement la réaction à la question et les deux-points maintiennent l’ouverture vers le verset suivant.
theological_decisions:
- issue: Caractérisation morale du dirigeant par τύραννος
  choice: le tyran
  alternative: le roi / le souverain
  rationale: Le terme grec porte une appréciation négative qu’il ne faut pas atténuer.
- issue: Identification de ce qui doit être mangé
  choice: ne pas préciser l’objet
  alternative: manger la nourriture interdite / la viande sacrificielle
  rationale: Le contexte plus large permet de comprendre l’allusion, mais le grec de ce verset ne nomme aucun aliment.
- issue: Lien logique entre manger et être libéré
  choice: manger pour être relâché
  alternative: être relâché s’il mangeait
  rationale: La formulation choisie préserve la finalité ou le résultat pratique attaché au participe, sans trancher plus finement que ne le permet la construction.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe légèrement restructurée pour éviter deux génitifs absolus lourds en français, tout en conservant les référents, l’évaluation portée par « tyran » et la phrase inachevée qui introduit la réponse du verset suivant.
