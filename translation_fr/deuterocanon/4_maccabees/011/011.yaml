lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον καί
  choice: De cette manière aussi
  rationale: Rend l’expression comparative ou continuative et conserve la valeur connective de καί dans un français naturel.
- source_word: πνεῦμα
  choice: esprit
  rationale: Préserve la dimension intérieure et animatrice du terme grec, ainsi que son contraste avec le corps, sans la réduire à la psychologie ni au seul souffle physique.
- source_word: στενοχωρούμενος
  choice: oppressé
  rationale: Exprime l’idée d’être serré, acculé ou mis à l’étroit tout en restant idiomatique en français; la note conserve le sens plus concret de constriction.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent direct et naturel de la référence corporelle.
- source_word: ἀγχόμενος
  choice: étranglé
  rationale: Rend vivement la constriction de la gorge ou l’étouffement suggérés par le verbe, sans transformer le participe en résultat accompli.
theological_decisions:
- issue: Distinction anthropologique entre πνεῦμα et σῶμα
  choice: Maintenir la paire « esprit » et « corps »
  alternative: Rendre πνεῦμα par « souffle » ou « pensée »
  rationale: Le grec juxtapose les dimensions intérieure et corporelle de la souffrance. Cette traduction maintient cette tension sans imposer une anthropologie doctrinale plus élaborée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation participiale et fragmentaire est conservée parce que le verset s’inscrit syntaxiquement dans son contexte immédiat.
