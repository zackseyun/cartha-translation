  yaml_path: translation/deuterocanon/4_maccabees/011/004.yaml
  text: O hateful and misanthropic man[b][a], what have we done that you are ravaging us in this way?
translation:
  language: fr
  text: Ô homme odieux, ennemi des humains[a], qu’avons-nous fait pour que tu nous ravages ainsi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toi qui hais les humains » ou « misanthrope ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi signifier « dévaster », « détruire » ou « mettre à sac » ; il évoque une destruction violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ô
  rationale: Conserve l’exclamation vocative et le ton vivement accusateur de l’apostrophe.
- source_word: μισάρετε
  choice: homme odieux
  rationale: Rend cette forte injure par une expression française naturelle sans préciser indûment ce que l’homme est censé haïr.
- source_word: μισάνθρωπε
  choice: ennemi des humains
  rationale: Exprime clairement l’idée d’une personne hostile aux êtres humains, tout en maintenant le parallélisme avec la première injure.
- source_word: τί δράσαντες
  choice: qu’avons-nous fait
  rationale: Restitue idiomatiquement la construction participiale qui demande quel acte pourrait justifier un tel traitement.
- source_word: πορθεῖς
  choice: tu nous ravages
  rationale: Préserve l’image forte d’une dévastation violente appliquée ici aux victimes de la torture.
- source_word: τοῦτον … τὸν τρόπον
  choice: ainsi
  rationale: Rend de manière concise et naturelle l’expression grecque désignant la façon dont elles sont maltraitées.
