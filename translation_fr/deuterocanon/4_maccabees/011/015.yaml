  yaml_path: translation/deuterocanon/4_maccabees/011/015.yaml
  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
translation:
  language: fr
  text: Car, puisque nous sommes nés et avons été élevés pour les mêmes choses[a], nous devons pareillement mourir pour les mêmes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vue des mêmes réalités » ou « pour les mêmes principes ». Le grec reprend dans les deux propositions une expression générale qui signifie littéralement « les mêmes choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: pour les mêmes choses
  rationale: Dans ce contexte, εἰς indique l’orientation ou le but. Cette formulation conserve l’expression large du grec et son parallélisme avec ὑπὲρ τῶν αὐτῶν.
- source_word: γενηθέντες
  choice: sommes nés
  rationale: Dans ce cadre familial et biographique, « sommes nés » est la formulation française naturelle.
- source_word: τραφέντες
  choice: avons été élevés
  rationale: Le verbe évoque ici l’éducation et la formation reçues, et non seulement la nourriture.
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: pour les mêmes choses
  rationale: « Pour » exprime l’engagement en faveur de réalités communes tout en maintenant la répétition délibérée du grec.
- source_word: ἀποθνήσκειν
  choice: mourir
  rationale: Le verbe ne précise pas en lui-même l’agent de la mort ; « mourir » en préserve donc la portée.
- source_word: ὀφείλομεν
  choice: nous devons
  rationale: Cette expression rend clairement et naturellement l’obligation morale indiquée par le grec.
- source_word: ὁμοίως
  choice: pareillement
  rationale: L’adverbe souligne la correspondance entre une naissance et une éducation communes, d’une part, et une mort pour les mêmes réalités, d’autre part.
theological_decisions:
- issue: Faut-il préciser l’objet implicite par « principes », « causes » ou « lois » ?
  choice: Conserver « les mêmes choses » dans les deux propositions.
  alternative: Employer « les mêmes principes », « les mêmes causes » ou « les mêmes lois ».
  rationale: Le grec répète une expression neutre et générale sans en préciser l’objet. Le contexte renvoie à des engagements communs liés à la Loi, mais les expliciter ici réduirait une ambiguïté authentique du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition du grec sont conservés, malgré leur caractère légèrement marqué en français, afin de ne pas préciser abusivement le référent.
