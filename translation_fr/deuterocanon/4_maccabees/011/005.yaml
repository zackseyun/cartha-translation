base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: fr
  text: Ou bien ne semble-t-il pas mauvais[a] que nous rendions un culte au Créateur de toutes choses et vivions selon sa noble loi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « condamnable » ou « mal ». Le grec κακόν peut désigner ce qui est mauvais, blâmable ou injuste.
    reason: lexical_alternative
  - marker: b
    text: Ou « son excellente loi » ou « sa loi vertueuse ». Le grec ἔναρετος qualifie ce qui possède une excellence morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: mauvais
  rationale: Le terme qualifie ici, dans une question rhétorique, ce qui serait moralement mauvais ou condamnable. « Mauvais » conserve cette portée sans imposer le sens plus substantiel de « le mal ».
- source_word: οὐ δοκεῖ
  choice: ne semble-t-il pas
  rationale: Cette tournure rend le jugement ou l'apparence exprimés par δοκέω et conserve la forme interrogative du grec.
- source_word: τὸν πάντων κτίστην
  choice: le Créateur de toutes choses
  rationale: κτίστης désigne le créateur ou fondateur, et πάντων lui donne ici une portée universelle. La majuscule convient au titre divin en français.
- source_word: εὐσεβοῦμεν
  choice: nous rendions un culte
  rationale: Avec le Créateur pour objet, le verbe exprime une révérence religieuse active. « Rendre un culte » est clair et naturel, sans réduire le terme à une simple attitude intérieure.
- source_word: κατὰ
  choice: selon
  rationale: Avec l'accusatif, κατά indique ici la conformité à une norme.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: sa noble loi
  rationale: ἔναρετος attribue à la loi une excellence morale. « Noble » est plus idiomatique en français que « vertueuse » appliqué à une loi, tout en préservant son éloge éthique.
- source_word: ζῶμεν
  choice: vivions
  rationale: Le verbe désigne ici la manière de conduire sa vie; le complément introduit par « selon » en précise la norme.
theological_decisions:
- issue: Sens cultuel de εὐσεβοῦμεν à l'égard du Créateur
  choice: nous rendions un culte
  alternative: nous révérions
  rationale: Le complément divin donne au verbe une orientation explicitement religieuse. La traduction retenue exprime cette dévotion sans ajouter de pratique particulière.
- issue: Force argumentative de ἢ et de la question négative
  choice: Ou bien ne semble-t-il pas mauvais… ?
  alternative: Ou bien est-ce un mal… ?
  rationale: « Ou bien » maintient le lien avec l'argument précédent, tandis que la tournure négative conserve la formulation rhétorique du grec sans ajouter un destinataire non exprimé.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe interrogative et le « Ou bien » préservent la continuité argumentative. Le subjonctif coordonné (« rendions… vivions ») est naturel après la tournure interrogative négative.
