lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le neutre pluriel grec renvoie aux paroles précédentes. En français courant, « cela » reprend naturellement l’ensemble de ce qui vient d’être dit sans en modifier le sens.
- source_word: εἰπόντα
  choice: Après qu’il eut dit
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure française, soutenue mais naturelle dans un récit, conserve clairement cette succession.
- source_word: παρῆγον
  choice: on le conduisit
  rationale: L’imparfait grec de παράγω décrit le fait de mener quelqu’un vers un lieu ou un objet. Le pronom indéfini « on » rend naturellement le sujet pluriel non exprimé, tandis que « conduisit » convient au déplacement imposé dans ce contexte.
- source_word: ἐπὶ
  choice: à
  rationale: Avec un mouvement vers un objet, ἐπί indique ici la destination. « À » reste plus prudent que « sur », puisque le texte dit qu’il est conduit vers l’instrument sans préciser encore qu’il y est placé.
- source_word: τὸν τροχόν
  choice: la roue
  rationale: τροχός signifie littéralement « roue ». La traduction conserve ce terme simple, tandis que la note précise sa fonction dans le récit.
