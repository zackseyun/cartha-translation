base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: fr
  text: en attirant toi aussi contre toi un grand vengeur[a], inventeur de supplices et ennemi de ceux qui sont véritablement pieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un puissant esprit vengeur » : le grec peut désigner un vengeur personnel ou une puissance de rétribution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγαν
  choice: grand
  rationale: L’adjectif intensifie ἀλάστορα; « grand » en conserve simplement la force.
- source_word: σοι
  choice: contre toi
  rationale: Avec προσβαλλὼν, le datif exprime ici le résultat hostile que le tyran fait venir sur lui-même.
- source_word: προσβαλλὼν
  choice: en attirant
  rationale: Le participe évoque le fait de faire venir ou de lancer contre quelqu’un; « attirer contre toi » est naturel en français dans le contexte d’une rétribution provoquée.
- source_word: καὶ αὐτὸς
  choice: toi aussi
  rationale: Cette expression met le sujet en relief et conserve la valeur additive de καί sans la confondre avec le pronom datif σοι.
- source_word: ἀλάστορα
  choice: vengeur
  rationale: Le mot peut désigner un vengeur personnel ou une puissance vengeresse; le choix principal reste volontairement sobre, et l’autre nuance est signalée en note.
- source_word: καινοτόμε τῶν βασάνων
  choice: inventeur de supplices
  rationale: L’apostrophe dénonce celui qui imagine des formes nouvelles de torture; « supplices » convient au contexte du martyre.
- source_word: πολέμιε
  choice: ennemi
  rationale: Le vocatif constitue une dénonciation personnelle directe.
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: de ceux qui révèrent véritablement Dieu
  rationale: εὐσεβέω exprime ici la piété ou la révérence religieuse; mentionner Dieu rend clairement en français l’orientation religieuse implicite du verbe grec.
theological_decisions:
- issue: Sens religieux de εὐσεβούντων
  choice: ceux qui révèrent véritablement Dieu
  alternative: ceux qui pratiquent véritablement la piété
  rationale: La formulation choisie exprime la révérence dirigée vers Dieu en français courant, sans introduire de terminologie confessionnelle.
- issue: Nature de ἀλάστωρ
  choice: un grand vengeur
  alternative: un puissant esprit vengeur
  rationale: Le grec permet une figure personnelle aussi bien qu’une puissance de rétribution; le texte principal ne précise pas davantage sa nature, tandis que la note conserve l’ambiguïté.
translation_notes:
  register: Français moderne, soutenu mais accessible. La construction participiale initiale est conservée parce que le verset forme syntaxiquement la suite de la phrase précédente. Les deux apostrophes finales gardent la vigueur polémique du grec.
