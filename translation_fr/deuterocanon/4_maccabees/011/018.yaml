  text: On it, while being stretched out with measured care and disjointed, he was being burned underneath.
translation:
  language: fr
  text: Sur cet instrument, tandis qu’on l’étirait méthodiquement[a] et qu’on lui disloquait les articulations[b], il était brûlé par-dessous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec soin » ou « de façon réglée » ; l’adverbe grec souligne le caractère délibéré et méthodique du supplice.
    reason: lexical_alternative
  - marker: b
    text: Ou « on lui disloquait les vertèbres » ou « on lui arrachait les membres de leurs articulations » ; le verbe grec peut désigner la dislocation violente des jointures ou des vertèbres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ οὗ
  choice: Sur cet instrument
  rationale: La locution renvoie à l’objet de torture mentionné dans le contexte précédent. Cette formulation rend clairement l’anaphore en français sans préciser davantage la nature de l’objet.
- source_word: κατατεινόμενος
  choice: tandis qu’on l’étirait
  rationale: Le participe passif décrit le corps tiré et tendu sur l’instrument de torture. La tournure active indéfinie avec « on » est naturelle en français et conserve la simultanéité.
- source_word: εὐμελῶς
  choice: méthodiquement
  rationale: L’adverbe évoque une action ordonnée, réglée et délibérée. « Méthodiquement » exprime avec naturel la précision glaçante avec laquelle le supplice est exécuté.
- source_word: ἐκσφονδυλιζόμενος
  choice: on lui disloquait les articulations
  rationale: Le verbe désigne une violente dislocation des jointures ou des vertèbres. La traduction garde cette violence corporelle tout en laissant ouverte l’étendue anatomique exacte.
- source_word: ὑπεκαίετο
  choice: il était brûlé par-dessous
  rationale: L’imparfait passif indique un supplice en cours, tandis que le préverbe ὑπο- marque que le feu agissait depuis le dessous.
