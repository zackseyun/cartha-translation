translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve la succession des deux participes grecs et l’action continue du verbe principal, sans atténuer la violence du supplice ni préciser au-delà du grec la nature exacte de l’instrument ou des articulations atteintes.
