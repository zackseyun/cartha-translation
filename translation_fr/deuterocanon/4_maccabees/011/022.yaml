  naturalness: « Je serai placé avec mes frères » est plus idiomatique et clair en français moderne que « je serai déposé auprès de mes frères ». Il maintient une formulation digne et laisse au contexte martyrial, plutôt qu’au choix lexical seul, le soin de faire entendre la nuance funèbre.
