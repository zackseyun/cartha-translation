  text: I too[a], armed with noble virtue, will be laid to rest with my brothers[b],
translation:
  language: fr
  text: Moi aussi, armé d’une noble vertu[a], je serai placé avec mes frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une noblesse morale » ou « d’une excellence morale » ; le terme grec désigne un caractère moral noble.
    reason: lexical_alternative
  - marker: b
    text: Ou « je serai mis avec mes frères » ; le passif grec peut avoir un sens plus général, mais il évoque probablement ici le fait de les rejoindre dans la mort.
    reason: alternative_reading
lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: d’une noble vertu
  rationale: Le datif indique ce dont le locuteur est armé. Le terme désigne la noblesse morale et l’excellence du caractère, plutôt qu’un simple raffinement social.
- source_word: καθωπλισμένος
  choice: armé
  rationale: Le participe de καθοπλίζω conserve ici une métaphore militaire forte; « armé » est à la fois fidèle, concis et naturel.
- source_word: τεθήσομαι
  choice: je serai déposé
  rationale: Ce futur passif de τίθημι signifie littéralement être mis ou placé. Dans le contexte du martyre, « déposé » peut évoquer la mort sans effacer la voix passive ni imposer explicitement l’idée d’ensevelissement.
- source_word: κἀγώ
  choice: moi aussi
  rationale: La crase marque l’inclusion emphatique du locuteur dans le sort de ses frères; « moi aussi » rend naturellement cette solidarité.
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: auprès de mes frères
  rationale: μετά suivi du génitif exprime l’accompagnement. « Auprès de mes frères » convient à l’idée d’être placé avec eux tout en restant naturel en français.
theological_decisions:
- issue: Sens du passif τεθήσομαι dans le contexte du martyre
  choice: « je serai déposé auprès de mes frères », avec une nuance de mort laissée implicite
  alternative: « je serai placé avec mes frères » ou « je reposerai auprès de mes frères »
  rationale: Le contexte suggère que le locuteur va rejoindre dans la mort ses frères martyrisés, mais le verbe grec demeure général. La traduction retenue conserve le passif et la tonalité funèbre sans préciser indûment l’ensevelissement.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore de l’armement est conservée. « Déposé auprès de » maintient la solennité et la voix passive tout en laissant subsister l’ambiguïté du verbe grec.
