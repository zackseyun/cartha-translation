  yaml_path: translation/deuterocanon/4_maccabees/011/026.yaml
  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
translation:
  language: fr
  text: Ton feu est froid pour nous, les catapultes[a] ne causent aucune douleur, et ta violence est impuissante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les instruments de torture ». Le grec καταπέλται désigne littéralement des « catapultes », mais peut ici renvoyer plus largement à des appareils de supplice.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  choice: ton feu
  rationale: Rendu concret et direct de l’image de l’instrument de supplice.
- source_word: ψυχρὸν ἡμῖν
  choice: est froid pour nous
  rationale: Conserve le paradoxe rhétorique du grec et rend naturellement le datif de référence.
- source_word: ἄπονοι
  choice: ne nous font pas souffrir
  rationale: Exprime en français courant la valeur prédicative « sans douleur, qui ne cause pas de souffrance », tout en précisant que les locuteurs en sont les bénéficiaires.
- source_word: οἱ καταπέλται
  choice: tes catapultes
  rationale: Retient le sens lexical premier de καταπέλται. Le possessif, implicite dans l’adresse et parallèle aux deux autres membres, rend la phrase française plus cohérente.
- source_word: ἀδύνατος ἡ βία σου
  choice: ta violence est impuissante
  rationale: Préserve la force morale de βία et le défi paradoxal exprimé par ἀδύνατος.
theological_decisions:
- issue: Paradoxe rhétorique dans la déclaration des martyrs
  choice: Conserver directement les affirmations selon lesquelles le feu est froid et la violence impuissante.
  alternative: Atténuer le paradoxe en disant que le feu « semble frais » ou que la violence « reste sans effet ».
  rationale: Le grec formule un défi saisissant concernant l’inefficacité des supplices. Le rendre directement préserve la tension sans transformer l’énoncé en explication.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement convient à l’adresse provocatrice au tyran. La structure ternaire et les images concrètes du grec sont conservées.
