  text: So if it seems good to you to torture those who do not eat defiling food[a], torture us.
translation:
  language: fr
  text: Ainsi donc, s’il te paraît bon de torturer ceux qui n’ont pas mangé de nourriture qui souille[a], torture-nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « ceux qui n’ont pas mangé de souillure » ; dans ce contexte, il s’agit de ceux qui n’ont pas consommé une nourriture qui souille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστʼ
  choice: Ainsi
  rationale: Introduit la conséquence tirée de l’argument précédent, dans un français naturel et soutenu.
- source_word: εἰ σοὶ δοκεῖ
  choice: s’il te paraît bon
  rationale: Conserve la tournure grecque exprimant ce qui paraît bon ou convenable au destinataire, plutôt que de l’aplatir en « si tu penses ».
- source_word: βασανίζειν
  choice: de torturer
  rationale: Dans ce contexte de martyre, le verbe désigne des sévices physiques infligés délibérément.
- source_word: μὴ μεμοφαγοῦντας
  choice: ceux qui refusent de manger des aliments qui rendent impur
  rationale: La formulation explicite l’aliment sous-entendu et exprime la souillure liée à sa consommation. « Refusent de manger » rend naturellement, dans le contexte, l’abstention volontaire des martyrs.
- source_word: βασάνιζε
  choice: torture-nous
  rationale: L’impératif reprend le même verbe avec force. Le complément « nous », implicite en grec mais évident dans l’adresse, est nécessaire à la clarté idiomatique du français.
theological_decisions:
- issue: Faut-il expliciter ce qui n’est pas mangé dans μὴ μεμοφαγοῦντας ?
  choice: Expliciter par « des aliments qui rendent impur »
  alternative: « ceux qui ne mangent pas de souillure » ou « ceux qui ne mangent pas »
  rationale: Le contexte porte sur le refus d’une nourriture interdite et source de souillure. L’explicitation évite une formulation obscure sans préciser au-delà de ce qu’exige le contexte.
- issue: Faut-il donner un complément explicite à l’impératif final ?
  choice: « torture-nous »
  alternative: « torture »
  rationale: Le grec laisse le complément implicite, mais les locuteurs qui lancent ce défi en sont manifestement l’objet. Le français demande ici de l’exprimer pour rester naturel et intelligible.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement convient à l’adresse singulière au persécuteur et préserve la vigueur du défi. La répétition de « torturer » reproduit l’insistance rhétorique du grec.
