  text: Now look[a], being alien to God[b], you are making war against those who are devout toward God.
translation:
  language: fr
  text: 'Maintenant, regarde : étranger à Dieu[a], tu fais la guerre à ceux qui font preuve de piété envers Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éloigné de Dieu » ou « n’appartenant pas à Dieu ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui pratiquent la piété envers Dieu ».'
    reason: literal_rendering
lexical_decisions:
- source_word: νῦν
  choice: Maintenant
  rationale: Marque le moment présent et introduit directement l’accusation.
- source_word: ἰδὲ
  choice: regarde
  rationale: L’impératif appelle avec force l’interlocuteur à considérer sa conduite ; « regarde » est direct et actuel, sans l’archaïsme de « voici ».
- source_word: ἀλλότριος ὢν θεοῦ
  choice: étranger à Dieu
  rationale: Cette formulation conserve l’idée vive d’une non-appartenance ou d’une séparation par rapport à Dieu, sans la transformer en catégorie doctrinale technique.
- source_word: πολεμεῖς
  choice: tu fais la guerre à
  rationale: Le verbe exprime une hostilité active et martiale ; cette traduction en maintient l’intensité.
- source_word: τοὺς εὐσεβοῦντας
  choice: ceux qui font preuve de piété
  rationale: Le participe présent désigne ceux qui manifestent effectivement et continuellement leur respect religieux.
- source_word: εἰς τὸν θεόν
  choice: envers Dieu
  rationale: La préposition indique ici l’objet vers lequel s’oriente la piété ; « envers » est idiomatique en français.
theological_decisions:
- issue: Portée relationnelle de ἀλλότριος θεοῦ
  choice: étranger à Dieu
  alternative: éloigné de Dieu ; n’appartenant pas à Dieu
  rationale: Dans le contexte, l’expression qualifie la position hostile du tyran par rapport à Dieu. « Étranger à Dieu » préserve la force relationnelle et morale du grec sans préciser indûment la nature théologique de cette séparation.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la répétition de « Dieu » ainsi que l’intensité martiale de l’accusation.
