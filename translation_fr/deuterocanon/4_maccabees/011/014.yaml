  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: fr
  text: Pour ma part, je suis plus jeune que mes frères par l’âge, mais leur égal par l’intelligence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: par l’âge
  rationale: ἡλικία désigne ici l’âge chronologique, comme l’indique la comparaison entre frères et l’opposition avec διανοίᾳ.
- source_word: νεώτερος
  choice: plus jeune
  rationale: Le comparatif exprime que le locuteur a moins d’années que ses frères.
- source_word: ἀδελφῶν
  choice: mes frères
  rationale: Dans le contexte narratif, le pluriel masculin désigne précisément les frères du locuteur.
- source_word: διανοίᾳ
  choice: par l’intelligence
  rationale: διανοία renvoie ici à la faculté de comprendre et de juger; « intelligence » rend naturellement en français le domaine dans lequel le locuteur affirme l’égalité.
- source_word: ἡλικιώτης
  choice: leur égal
  rationale: Dans l’opposition rhétorique avec la jeunesse physique, le terme exprime la parité quant à la διανοία, et non une identité littérale d’âge.
theological_decisions:
- issue: Sens de ἡλικιώτης en contraste avec νεώτερος
  choice: égalité avec ses frères sur le plan de l’intelligence
  alternative: leur pair en maturité ou en jugement
  rationale: Une égalité d’âge contredirait la première proposition. La construction oppose l’âge chronologique au niveau de compréhension, tout en laissant ouverte la nuance entre capacité intellectuelle et maturité de jugement.
translation_notes:
  register: Formulation française actuelle, sobre et digne. Le parallélisme « par l’âge… par l’intelligence » conserve la structure antithétique du grec; « Pour ma part » restitue la mise en relief de Ἐγώ sans lourdeur.
