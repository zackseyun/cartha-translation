base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: fr
  text: 'Car tu n’as pu ni faire fléchir notre raison ni nous contraindre à manger de la viande[a] : n’est-ce pas là ta défaite ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, il s’agit de viande interdite par la Loi juive. Le terme grec signifie littéralement « consommation de viande ».
    reason: Précision lexicale et contextuelle.
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε
  choice: tu n’as pu
  rationale: Cette tournure française naturelle conserve l’accent de la construction grecque sur l’incapacité effective de l’interlocuteur.
- source_word: μεταπεῖσαι τὸν λογισμὸν ἡμῶν
  choice: faire fléchir notre raison
  rationale: μεταπείθω implique amener quelqu’un à changer par la persuasion. « Faire fléchir » exprime ici cette tentative sans confondre la persuasion avec la contrainte, tandis que « notre raison » préserve le terme conceptuel central λογισμός.
- source_word: βιάσασθαι
  choice: contraindre
  rationale: Le verbe désigne le recours à la force et forme avec la persuasion un contraste rhétorique net.
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: à manger de la viande
  rationale: Le substantif rare μεμοφαγία désigne littéralement la consommation de viande. La traduction garde ce sens lexical dans le texte, et la note en précise la portée narrative.
- source_word: οὐ κατάλυσίς ἐστιν σου;
  choice: n’est-ce pas là ta défaite ?
  rationale: Dans cette question provocatrice, κατάλυσις évoque la ruine ou le renversement de l’adversaire ; « défaite » en restitue clairement la force en français actuel.
theological_decisions:
- issue: Rendre λογισμός dans le cadre philosophique de 4 Maccabées
  choice: notre raison
  alternative: notre jugement raisonné ; notre résolution
  rationale: « Raison » maintient le vocabulaire conceptuel majeur du livre, où la raison pieuse résiste aux passions, sans réduire ici le terme à la seule volonté.
- issue: Préciser ou non le caractère interdit de la viande dans μεμοφαγία
  choice: manger de la viande
  alternative: manger de la viande interdite ; manger des aliments souillés
  rationale: Le mot grec nomme littéralement la consommation de viande, tandis que le contexte indique que cette viande est interdite par la Loi. Une note conserve cette précision sans l’introduire silencieusement dans le texte.
translation_notes:
  register: Français moderne, direct et digne. La structure corrélative « ni… ni… » rend l’opposition entre persuasion et coercition, et la question finale conserve le ton de défi.
