  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
translation:
  language: fr
  text: sachant que la raison guidée par la piété[a] est maîtresse des passions[b], et non seulement des passions intérieures, mais aussi des douleurs extérieures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la raison pieuse ». L’expression grecque, centrale dans 4 Maccabées, désigne une raison façonnée par la révérence envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le grec distingue les πάθη, les « passions », des πόνοι, les douleurs ou souffrances, notamment celles qui viennent de l’extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: sachant
  rationale: Le participe présent conserve le lien syntaxique avec le contexte antérieur sans trancher entre une nuance strictement causale ou circonstancielle.
- source_word: τῶν παθῶν
  choice: des passions
  rationale: πάθη est ici un terme philosophique désignant les passions ou mouvements intérieurs soumis au gouvernement de la raison. « Passions » préserve aussi la distinction avec πόνοι, les douleurs ou souffrances.
- source_word: δεσπότης
  choice: est maîtresse de
  rationale: Cette formulation rend l’idée d’autorité et de maîtrise tout en s’accordant naturellement avec le nom féminin « raison ».
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison guidée par la piété
  rationale: Cette expression naturelle en français conserve à la fois la dimension rationnelle de λογισμός et l’orientation religieuse de εὐσεβής, sans réduire le concept à un rationalisme profane.
- source_word: τῶν ἔνδοθεν
  choice: des souffrances intérieures
  rationale: L’expression substantivée désigne ce qui est éprouvé au-dedans et s’oppose directement aux douleurs extérieures. L’ajout de « souffrances » explicite en français l’ellipse grecque.
- source_word: τῶν ἔξωθεν πόνων
  choice: des douleurs extérieures
  rationale: Cette traduction rend πόνοι par un terme de douleur subie et reproduit clairement l’opposition entre l’intérieur et l’extérieur.
theological_decisions:
- issue: Traduction de l’expression programmatique ὁ εὐσεβὴς λογισμός
  choice: la raison guidée par la piété
  alternative: la raison pieuse
  rationale: Le choix retenu indique que la raison dont parle l’auteur est façonnée par la révérence religieuse, tout en restant idiomatique en français. Il évite d’y voir la raison humaine considérée indépendamment de toute relation à Dieu.
- issue: Rapport entre les passions intérieures et les douleurs extérieures
  choice: maintenir la distinction entre « passions », « souffrances intérieures » et « douleurs extérieures »
  alternative: uniformiser l’ensemble sous le terme « souffrances »
  rationale: Le grec emploie πάθη puis πόνοι et construit une opposition entre ce qui vient du dedans et ce qui vient du dehors. La traduction conserve cette tension au lieu d’aplatir le vocabulaire.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure participiale est conservée, ainsi que l’opposition intérieure-extérieure. Les marqueurs [a] et [b] figurent dans le texte dans leur ordre d’apparition.
