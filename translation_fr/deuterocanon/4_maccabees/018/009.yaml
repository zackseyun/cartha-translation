  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: fr
  text: 'Mais quand ceux-ci furent devenus adultes, leur père mourut. Heureux fut cet homme : après avoir connu la vie d’un père comblé par ses enfants[a], il n’eut pas à souffrir le temps où il en serait privé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi évoquer la vie de quelqu’un qui a de bons enfants ou qui est heureusement pourvu d’enfants.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire, selon le contexte, la période où il aurait été privé de ses enfants après leur mort.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: furent devenus adultes
  rationale: Le génitif absolu marque ici l’accès accompli à l’âge adulte; cette formulation garde la valeur temporelle et demeure naturelle en français.
- source_word: ἐτελεύτησεν
  choice: mourut
  rationale: Le verbe désigne couramment la mort; « mourut » est clair, digne et sans euphémisme superflu.
- source_word: μακάριος
  choice: Heureux
  rationale: Le terme qualifie une condition enviable ou privilégiée. « Heureux » convient ici à une appréciation de son sort sans imposer l’idée explicite d’une bénédiction divine.
- source_word: εὐτεκνίας
  choice: d’un père comblé par ses enfants
  rationale: Le nom exprime la condition favorable de celui qui a des enfants, avec une nuance positive portant possiblement sur leur nombre ou leur qualité. La formulation française conserve cette valeur appréciative.
- source_word: βίον ἐπιστήσας
  choice: après avoir connu la vie
  rationale: ἐπιστήσας signifie ici avoir connu ou fait l’expérience d’une condition de vie; « après avoir connu » rend sobrement cette expérience antérieure.
- source_word: ἀτεκνίας
  choice: où il en serait privé
  rationale: Le nom désigne l’absence d’enfants. Dans le contexte narratif, il s’agit vraisemblablement d’en être privé par leur mort; le pronom reprend « ses enfants » sans alourdir la phrase.
- source_word: οὐκ ὠδυνήθη
  choice: il n’eut pas à souffrir
  rationale: Le verbe évoque une douleur ou une profonde affliction; cette tournure exprime qu’il n’a pas vécu cette épreuve.
- source_word: καιρόν
  choice: le temps
  rationale: καιρός désigne une période déterminée ou une circonstance marquante; « le temps où » en restitue ici naturellement la portée qualitative.
theological_decisions:
- issue: Nature du bonheur du père par rapport à la mort ultérieure de ses fils
  choice: Le père est déclaré heureux parce qu’il est mort avant de connaître la douleur d’être privé de ses enfants.
  alternative: Le verset opposerait simplement le fait d’avoir des enfants à l’absence d’enfants, sans allusion précise à leur mort.
  rationale: Le contexte immédiat porte sur la mort des fils. La traduction laisse entendre cette relation narrative tout en plaçant son explicitation dans une note, afin de ne pas rendre le texte principal plus précis que le grec.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme en deux phrases conserve la progression du grec. « Heureux » évite de surdéterminer μακάριος, tandis que les notes préservent l’étendue sémantique de εὐτεκνία et l’implication narrative de ἀτεκνία.
