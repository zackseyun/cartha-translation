  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: fr
  text: Il nous racontait aussi Abel, tué par Caïn, Isaac en train d’être offert en holocauste[a], et Joseph en prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec emploie ici le langage de l’holocauste, sacrifice entièrement consumé. Il évoque l’offrande d’Isaac en Genèse 22, sans dire que ce sacrifice fut mené à son terme.
    reason: Préserver le vocabulaire sacrificiel grec et l’aspect en cours du participe, sans laisser entendre qu’Isaac a effectivement été immolé et brûlé.
lexical_decisions:
- source_word: ἀνεγίνωσκεν δὲ ἡμῖν
  choice: Il nous racontait aussi
  rationale: L’imparfait exprime une action répétée ou habituelle. ἀναγινώσκω peut signifier « lire », mais ici « raconter » rend naturellement l’évocation d’exemples scripturaires sans imposer l’idée d’une lecture matérielle. δέ est rendu par « aussi », qui assure la continuité du propos.
- source_word: τὸν ἀναιρεθέντα Ἄβελ ὑπὸ Κάϊν
  choice: comment Abel avait été tué par Caïn
  rationale: ἀναιρέω désigne ici la mise à mort violente. « avait été tué » est clair, digne et idiomatique en français moderne; la tournure avec « comment » intègre naturellement l’accusatif grec après « racontait ».
- source_word: τὸν ὁλοκαυτούμενον Ἰσαάκ
  choice: comment Isaac avait été offert en holocauste
  rationale: Le verbe grec appartient au vocabulaire sacrificiel de l’holocauste. « offert en holocauste » conserve cette évocation de Genèse 22, tandis que la note précise qu’Isaac ne fut pas effectivement immolé.
- source_word: τὸν ἐν φυλακῇ Ἰωσήφ
  choice: comment Joseph avait été emprisonné
  rationale: La formulation verbale est plus naturelle en français qu’un calque tel que « Joseph en prison » et restitue clairement sa détention.
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: Abel / Caïn / Isaac / Joseph
  rationale: Les noms suivent leurs formes françaises bibliques usuelles.
theological_decisions:
- issue: Langage sacrificiel appliqué à Isaac
  choice: offert en holocauste
  alternative: en train d’être offert en holocauste / offert tout entier
  rationale: La traduction maintient le terme sacrificiel fort du grec et son lien avec Genèse 22, sans prétendre qu’Isaac fut finalement mis à mort; la note prévient cette lecture erronée.
- issue: Valeur de ἀνεγίνωσκεν
  choice: racontait
  alternative: lisait
  rationale: Le contexte permet soit une lecture à haute voix, soit le récit des exemples scripturaires. « Racontait » suit la valeur contextuelle probable sans ajouter un support écrit absent du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « comment » donne une construction fluide à l’énumération, et l’imparfait « racontait » conserve l’aspect duratif ou habituel du grec.
