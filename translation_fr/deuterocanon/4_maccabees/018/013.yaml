  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: fr
  text: Il exaltait aussi Daniel dans la fosse aux lions[a], et le proclamait heureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une fosse de lions » ; on peut aussi traduire : « dans la tanière des lions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: exaltait
  rationale: Le verbe δοξάζω peut signifier glorifier, honorer ou exalter. Avec Daniel comme complément, « exaltait » conserve la force élogieuse du grec tout en évitant que « glorifiait » suggère nécessairement un culte rendu à Daniel.
- source_word: ἐν λάκκῳ λεόντων
  choice: dans la fosse aux lions
  rationale: λάκκος désigne littéralement une fosse ou une citerne. « Fosse aux lions » est naturel en français et reste proche de l’expression grecque, plus précisément que la formulation traditionnelle « fosse aux lions » elle-même ne requiert aucune adaptation supplémentaire.
- source_word: ἐμακάριζεν
  choice: le proclamait heureux
  rationale: μακαρίζω signifie déclarer, proclamer ou estimer quelqu’un heureux ou bienheureux. « Proclamait heureux » garde la valeur verbale et laudative sans donner au verbe un sens liturgique.
- source_word: καὶ ... καί
  choice: aussi ... et
  rationale: Les deux καί ont une fonction cumulative et emphatique. En français, répéter « aussi » serait lourd ; « aussi ... et » restitue naturellement l’enchaînement sans perdre la seconde affirmation.
- source_word: ὃν
  choice: le
  rationale: Le relatif grec reprend Daniel. La coordination française « et le proclamait heureux » exprime clairement cette reprise avec un style plus naturel que « lequel ».
theological_decisions:
- issue: Portée du langage d’honneur appliqué à Daniel
  choice: Traduire δοξάζω par « exaltait », en maintenant un éloge appuyé de Daniel sans expliciter un acte de culte.
  alternative: « glorifiait » ou, de façon plus atténuée, « honorait »
  rationale: Le grec emploie un langage élevé à propos d’un exemplaire humain. « Exaltait » préserve cette intensité et la tension du texte, tout en étant moins spontanément cultuel en français moderne que « glorifiait ».
translation_notes:
  register: Français moderne, digne et accessible. L’imparfait restitue l’aspect imperfectif des deux verbes grecs. La formulation privilégie une équivalence optimale, avec une légère restructuration de la proposition relative pour obtenir un français naturel.
