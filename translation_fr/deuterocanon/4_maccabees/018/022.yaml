  text: for which divine justice has pursued[a], and will pursue, the accursed one.
translation:
  language: fr
  text: À cause de ces actes, la justice divine a poursuivi et poursuivra le maudit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme souillé » ou « l’être abominable » ; le terme grec est rare et exprime une forte condamnation morale et religieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: À cause de ces actes
  rationale: La préposition ὑπέρ suivie du relatif exprime ici la cause du jugement. L’explicitation « ces actes » renvoie naturellement aux faits mentionnés dans le contexte, tout en conservant la valeur du pluriel ὧν.
- source_word: ἡ θεία δίκη
  choice: la justice divine
  rationale: δίκη peut désigner la justice, le châtiment ou la vengeance. « La justice divine » maintient à la fois la dimension judiciaire et la force rétributive de l’expression, sans en réduire le sens au seul châtiment.
- source_word: μετῆλθεν καὶ μετελεύσεται
  choice: a poursuivi et poursuivra
  rationale: Les deux formes du même verbe expriment une action punitive passée puis future. La répétition de « poursuivre » reproduit le parallélisme rhétorique grec avec concision.
- source_word: τὸν ἀλιόστορα
  choice: le maudit
  rationale: Ce terme grec rare exprime une forte condamnation morale et religieuse, possiblement liée à la souillure ou à l’abomination. « Le maudit » est naturel et vigoureux, tandis que l’incertitude lexicale est signalée en note.
theological_decisions:
- issue: Rendre δίκη dans un contexte de rétribution divine
  choice: la justice divine
  alternative: le châtiment divin ; la vengeance divine
  rationale: « La justice divine » préserve la tension entre la justice comme principe et son action punitive, sans imposer une lecture théologique plus étroite centrée exclusivement sur la vengeance ou le châtiment.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve le parallélisme temporel du grec. Le marqueur de note est placé sur le terme rare auquel la note se rapporte.
