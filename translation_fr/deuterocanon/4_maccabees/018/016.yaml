  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: fr
  text: 'Il nous citait ce proverbe de Salomon : « C’est un arbre de vie pour tous ceux qui font sa volonté[a]. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif grec est masculin et son référent n’est pas précisé. Le contexte favorise une référence à Dieu ; il peut aussi renvoyer à Salomon.
    reason: alternative_reading
  - marker: b
    text: Cette parole fait écho à Proverbes 3.18, sous une forme adaptée.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: citait … sous forme de proverbe
  rationale: Le verbe exprime l’action de citer ou d’évoquer quelqu’un de manière proverbiale. Cette formulation française conserve la fonction rhétorique tout en restant naturelle.
- source_word: τὸν Σαλομῶντα
  choice: Salomon
  rationale: Le nom propre est rendu sous sa forme française traditionnelle; l’accusatif désigne Salomon comme l’autorité citée.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif indique les destinataires auxquels cette citation proverbiale était présentée.
- source_word: τὸν λέγοντα
  choice: lui qui dit
  rationale: Cette tournure garde le présent du participe substantivé et rattache clairement la parole à Salomon.
- source_word: Ξύλον ζωῆς
  choice: un arbre de vie
  rationale: Cette expression reprend le langage sapientiel de Proverbes 3.18; l’article indéfini est naturel en français dans cette construction attributive.
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: pour tous ceux qui font
  rationale: La formulation rend simplement et directement l’universalité de πᾶσιν et l’action concrète exprimée par ποιοῦσιν.
- source_word: αὐτοῦ τὸ θέλημα
  choice: sa volonté
  rationale: En contexte, le possessif renvoie vraisemblablement à Dieu. Le français conserve toutefois formellement l’ambiguïté du possessif, explicitée en note.
theological_decisions:
- issue: Référent de αὐτοῦ dans la citation
  choice: sa volonté, compris comme la volonté de Dieu
  alternative: la volonté de celui-ci / sa propre volonté, avec un référent impersonnel ou lié à l’arbre de vie
  rationale: Le contexte du martyre et de la fidélité favorise une référence à Dieu, mais la forme grecque ne nomme pas explicitement son référent. La note préserve cette ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tandis que « sous forme de proverbe » explicite naturellement la valeur rare du verbe grec sans transformer Salomon lui-même en proverbe.
