  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
translation:
  language: fr
  text: 'Car elle n’oubliait pas le chant qu’avait enseigné Moïse[a], qui enseigne : « Moi, je ferai mourir et je ferai vivre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette phrase fait écho au Chant de Moïse en Deutéronome 32.39. Certaines traductions de ce passage portent : « Je fais mourir et je fais vivre » ; ici, les verbes grecs sont au futur : « je ferai mourir et je ferai vivre ».'
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδήν
  choice: chant
  rationale: « Chant » est le terme français courant et naturel, sans ajouter l’idée particulière de louange que le grec n’explicite pas.
- source_word: ἐδίδαξεν
  choice: avait enseigné
  rationale: Le plus-que-parfait situe naturellement en français l’enseignement de Moïse avant le souvenir évoqué, tout en conservant le sens simple d’« enseigner ».
- source_word: οὐκ ἐπελάθετο
  choice: n’avait pas oublié
  rationale: Cette traduction directe conserve le motif de la mémoire et convient au contexte narratif passé.
- source_word: τὴν διδάσκουσαν
  choice: celui qui enseigne
  rationale: Le participe féminin renvoie au chant et le personnifie légèrement. En français, « chant » étant masculin, « celui » reprend clairement ce nom et préserve cette force.
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: Moi, je ferai mourir et je ferai vivre
  rationale: « Moi » rend l’insistance du pronom Ἐγώ. Les deux futurs sont conservés, et le parallélisme causatif de la déclaration est exprimé dans un français naturel et digne.
- source_word: γάρ
  choice: Car
  rationale: « Car » marque brièvement que cette phrase explique l’affirmation précédente.
theological_decisions:
- issue: Formulation de la déclaration divine citée du Chant de Moïse
  choice: Moi, je ferai mourir et je ferai vivre
  alternative: Moi, je tue et je fais vivre
  rationale: Le texte grec de ce verset emploie explicitement le futur. La traduction suit donc sa formulation immédiate sans l’harmoniser avec des versions au présent de Deutéronome 32.39, et conserve l’affirmation forte de la souveraineté divine.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « avait… avait » reste claire et naturelle, tandis que « celui qui enseigne » conserve la légère personnification du chant présente en grec.
