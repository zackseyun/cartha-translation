  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: fr
  text: C’est pour cela que, ayant, par piété, livré leurs corps à ces souffrances, ils furent non seulement admirés par les humains, mais aussi jugés dignes d’une part divine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une part venant de Dieu » ou « d’une participation au divin ». L’expression grecque, très concise, peut désigner soit une part accordée par Dieu, soit une participation à ce qui est divin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: En récompense de cela
  rationale: La locution établit ici un rapport de conséquence ou de rétribution avec ce qui précède. Cette formulation conserve plus précisément la nuance de contrepartie que le simple « C’est pourquoi ».
- source_word: διὰ τὴν εὐσέβειαν
  choice: par piété
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la fidélité révérencieuse envers Dieu et sa Loi. « Piété » est concis, naturel dans ce registre et explicitement religieux.
- source_word: προεμενοι τὰ σώματα τοῖς πόνοις
  choice: avaient livré leur corps aux souffrances
  rationale: Le participe exprime l’abandon ou la remise de soi aux épreuves. « Livré » rend cette idée sans imposer une interprétation sacrificielle; le singulier collectif « leur corps » est idiomatique en français.
- source_word: ἐκείνοι
  choice: ces hommes
  rationale: ἐκείνοι est un pronom démonstratif masculin nominatif pluriel et désigne les martyrs; il ne qualifie pas πόνοις, qui est au datif pluriel.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: Le grec oppose l’estime humaine à l’approbation divine sans viser uniquement les hommes de sexe masculin. Cette formulation rend le contraste avec précision.
- source_word: ἐθαυμάσθησαν
  choice: furent admirés
  rationale: Le passif indique qu’ils suscitèrent admiration et émerveillement. « Admirés » est clair et naturel.
- source_word: θείας μερίδος
  choice: d’une part divine
  rationale: L’expression concise peut évoquer soit une part accordée par Dieu, soit une participation à ce qui est divin. La traduction conserve volontairement cette ambiguïté.
- source_word: κατηξιώθησαν
  choice: jugés dignes
  rationale: Le verbe exprime une reconnaissance ou une déclaration de dignité. « Jugés dignes » en maintient la portée évaluative.
theological_decisions:
- issue: Sens de θείας μερίδος
  choice: une part divine
  alternative: une part venant de Dieu; une participation au divin
  rationale: Le grec ne précise pas s’il s’agit d’une part attribuée par Dieu ou d’une participation à la réalité divine. Le texte principal préserve cette tension plutôt que de la résoudre en « récompense céleste » ou en une doctrine particulière.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la structure corrélative « non seulement… mais aussi ». Le démonstratif grec ἐκείνοι est correctement rattaché aux martyrs plutôt qu’aux souffrances.
