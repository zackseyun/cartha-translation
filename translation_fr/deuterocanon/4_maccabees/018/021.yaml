  text: He mutilated the pupils of their eyes, cut out their tongues, and killed them with various tortures.
translation:
  language: fr
  text: Il mutila les pupilles de leurs yeux, leur coupa la langue et les tua au moyen de diverses tortures.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: les pupilles de leurs yeux
  rationale: Dans ce contexte anatomique, κόρας désigne les pupilles. La formulation conserve la précision et l’explicitation du grec, malgré une légère redondance naturelle également présente dans la source.
- source_word: ἐπήρωσεν
  choice: mutila
  rationale: Le verbe exprime l’idée de rendre infirme, de mutiler ou d’aveugler. « Mutila » reste proche de sa portée lexicale sans préciser indûment la manière exacte dont les yeux furent endommagés.
- source_word: γλώσσας ἐξέτεμεν
  choice: leur coupa la langue
  rationale: ἐκτέμνω signifie couper et retrancher. Cette tournure française, au singulier distributif, est naturelle et rend clairement la violence physique de l’acte.
- source_word: βασάνοις ποικίλαις
  choice: au moyen de diverses tortures
  rationale: Le datif a une valeur instrumentale. « Diverses tortures » restitue directement ποικίλαις et βασάνοις.
- source_word: ἀπέκτεινεν
  choice: les tua
  rationale: Traduction directe, moderne et sans atténuation du verbe grec courant signifiant tuer; le pronom objet est naturellement fourni par le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La formulation préserve la brutalité explicite du grec sans ajouter de détails sur la méthode de mutilation.
