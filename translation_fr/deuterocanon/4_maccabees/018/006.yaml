  yaml_path: translation/deuterocanon/4_maccabees/018/006.yaml
  text: 'Then indeed, having set out from Jerusalem, he encamped against the Persians. And the mother of the seven boys was saying these things also to each one of her children:'
translation:
  language: fr
  text: 'Alors, après avoir quitté Jérusalem, il établit son camp contre les Perses. La mère des sept garçons disait aussi ceci à chacun de ses enfants :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: Alors
  rationale: « Alors » exprime naturellement la succession narrative; l’insistance de δή reste légère dans ce contexte et ne demande pas un lourd « alors vraiment ».
- source_word: ὑπάρας ἀπὸ τῶν Ἱεροσολύμων
  choice: après avoir quitté Jérusalem
  rationale: La tournure marque clairement l’action antérieure au verbe principal et rend explicitement le point de départ introduit par ἀπό.
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  choice: il établit son camp contre les Perses
  rationale: La formulation conserve le cadre militaire du verbe et la visée hostile de ἐπί avec l’accusatif.
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: la mère des sept garçons
  rationale: παῖδες désigne ici les sept enfants mâles; « garçons » préserve cette précision tout en gardant le ton familial.
- source_word: Ἔλεγεν
  choice: disait
  rationale: L’imparfait français correspond naturellement à l’aspect imperfectif du grec, sans imposer à lui seul une répétition insistante.
- source_word: καὶ ταῦτα
  choice: aussi ceci
  rationale: « Aussi » conserve la valeur additive de καί, tandis que « ceci » annonce naturellement les paroles qui suivent.
- source_word: ἑνὶ ἑκάστῳ τοῖς τέκνοις
  choice: à chacun de ses enfants
  rationale: « Chacun » rend la distribution individualisée de ἑνὶ ἑκάστῳ, et « ses enfants » traduit le terme relationnel plus large τέκνα.
theological_decisions:
- issue: Variation des termes familiaux genrés
  choice: « garçons » pour παῖδες et « enfants » pour τέκνοις
  alternative: Employer « fils » aux deux endroits, ou « enfants » aux deux endroits
  rationale: Le grec emploie deux termes différents. Cette variation française indique correctement que les sept sont de sexe masculin tout en préservant la portée familiale plus large de τέκνα.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant l’antériorité du participe, le contexte militaire et l’imparfait du discours maternel.
