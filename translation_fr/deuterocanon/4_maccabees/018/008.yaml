base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: fr
  text: Le ravageur du désert, le destructeur dans la plaine, ne m’a pas corrompue ; le serpent non plus, ravageur par la tromperie, n’a pas porté atteinte à la pureté de ma virginité[a]. Mais je suis restée avec mon mari[b] durant le temps de ma pleine vigueur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec accumule dans les deux membres des termes voisins de ravage et de destruction. La syntaxe, particulièrement dense autour de « serpent », associe celui-ci à la tromperie sans développer davantage l’image.
    reason: Préserver la densité lexicale et l’ambiguïté de l’image grecque.
  - marker: b
    text: Ou « avec un homme ». Le mot grec peut désigner soit un homme, soit un mari ; le contexte favorise ici « mon mari ».
    reason: Signaler une ambiguïté lexicale réelle.
lexical_decisions:
- source_word: διέφθειρέν
  choice: m’a corrompue
  rationale: Le verbe peut exprimer la destruction ou la corruption. Dans ce contexte de chasteté et en parallèle avec l’atteinte à la virginité, « corrompue » conserve à la fois la portée morale et l’idée de ruine sans préciser indûment la forme du mal subi.
- source_word: λυμεὼν … φθορεὺς
  choice: ravageur … destructeur
  rationale: Les deux noms grecs voisins sont maintenus afin de préserver l’accumulation insistante de termes de destruction, plutôt que de les fondre en un seul mot.
- source_word: τῆς ἐρημίας … ἐν πεδίῳ
  choice: du désert … dans la campagne
  rationale: « Désert » rend le lieu désolé évoqué par ἐρημία, tandis que « campagne » traduit naturellement πεδίον dans ce contexte, qui peut aussi désigner une plaine ou un champ.
- source_word: ἐλυμήνατό
  choice: n’a pas porté atteinte à
  rationale: Le verbe désigne ici une action qui ravage ou profane. Cette expression s’accorde naturellement avec « la pureté » tout en évitant de rendre explicite une modalité sexuelle que le grec laisse implicite.
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: la pureté de ma virginité
  rationale: Le pluriel substantivé τὰ ἁγνά désigne ce qui est pur ou chaste ; le singulier abstrait est idiomatique en français et conserve l’accent sur la chasteté.
- source_word: λυμεὼν ἀπάτης ὄφις
  choice: le serpent … ravageur par la tromperie
  rationale: Cette formulation conserve le serpent, le motif du ravageur et le rôle de la tromperie, sans développer l’allusion probable au serpent trompeur au-delà des mots grecs.
- source_word: χρόνον ἀκμῆς
  choice: durant les années de ma pleine maturité
  rationale: ἀκμή désigne l’apogée ou la pleine vigueur de la vie. La formulation française exprime une période prolongée sans la réduire strictement à la jeunesse.
- source_word: σὺν ἀνδρί
  choice: avec mon mari
  rationale: ἀνήρ peut signifier « homme » ou « mari ». Le contexte autobiographique de virginité puis de vie conjugale favorise « mari », tandis qu’une note signale l’ambiguïté lexicale.
theological_decisions:
- issue: Allusion possible au serpent trompeur et affirmation de pureté sexuelle
  choice: Conserver « le serpent » et « par la tromperie » sans expliciter davantage l’allusion.
  alternative: Employer une formulation plus ordinaire comme « un serpent trompeur », ou identifier explicitement le serpent d’Éden.
  rationale: ὄφις et ἀπάτη portent eux-mêmes cette résonance littéraire et théologique. La traduction la laisse perceptible sans imposer une identification doctrinale que le verset ne formule pas expressément.
- issue: Sens conjugal ou générique de ἀνήρ
  choice: Retenir « mon mari » dans le texte et signaler « un homme » en note.
  alternative: Traduire directement « avec un homme ».
  rationale: Le contexte rend le sens conjugal très probable, mais le nom grec demeure lexicalement ambigu ; la note préserve cette possibilité sans rendre le texte principal artificiel.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le parallélisme et l’accumulation des termes de destruction ont été conservés autant que le permet une syntaxe française naturelle. « Pleine maturité » évite aussi bien l’archaïsme que la réduction du terme grec à la seule jeunesse.
