  text: À lui soit la gloire pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: À lui
  rationale: Le pronom relatif au datif renvoie à Dieu dans le contexte antérieur. En français, « À lui » rend naturellement l’attribution doxologique, là où « auquel » serait grammaticalement lourd et peu idiomatique.
- source_word: ἡ δόξα
  choice: la gloire
  rationale: « La gloire » est l’équivalent usuel et précis de δόξα dans une formule de louange.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette formule française traditionnelle demeure claire et digne, tout en conservant la structure intensive de l’expression grecque plutôt qu’en la réduisant simplement à « pour toujours ».
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération liturgique reçue préserve la fonction solennelle de conclusion et d’assentiment.
theological_decisions:
- issue: Proposition doxologique sans verbe exprimé
  choice: À lui soit la gloire
  alternative: À lui appartient la gloire
  rationale: Le grec ne comporte aucun verbe. Le subjonctif français « soit » restitue l’attribution ou le souhait doxologique sans transformer explicitement la formule en affirmation de possession.
- issue: Valeur référentielle de ᾧ
  choice: À lui
  alternative: auquel
  rationale: Le masculin singulier renvoie au référent divin du contexte. « À lui » explicite seulement le genre déjà marqué en grec et produit une doxologie française naturelle, sans nommer davantage le référent.
translation_notes:
  register: Français moderne, solennel et accessible. La formulation conserve la cadence liturgique et l’intensité de l’idiome grec.
