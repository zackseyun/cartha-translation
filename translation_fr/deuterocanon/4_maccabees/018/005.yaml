revisions:
- from: Et le tyran Antiochos a été puni jusque sur la terre, et il subit un châtiment éternel[a] ; car il n’a absolument pas réussi à contraindre les habitants de Jérusalem à adopter les pratiques de peuples étrangers et à renoncer au mode de vie ancestral de leur peuple,
  to: Et le tyran Antiochos a aussi été puni sur terre, et il est châtié éternellement[a] ; car il n’a absolument pas réussi à contraindre les habitants de Jérusalem à adopter les pratiques de peuples étrangers et à se détourner des coutumes ancestrales de leur peuple,
  rationale: La révision préserve l’ellipse grecque relative au châtiment durable, tout en maintenant une formulation française naturelle. Elle rend plus directement la punition terrestre et clarifie avec sobriété l’abandon forcé des coutumes ancestrales du peuple.
