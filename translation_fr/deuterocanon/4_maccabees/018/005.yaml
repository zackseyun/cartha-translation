base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: fr
  text: Et le tyran Antiochos a aussi été puni sur terre, et il est châtié éternellement[a] ; car il n’a absolument pas réussi à contraindre les habitants de Jérusalem à adopter les pratiques de peuples étrangers et à se détourner des coutumes ancestrales de leur peuple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit qu’il « est châtié avec des choses éternelles », sans préciser le nom auquel se rapporte « éternelles ». On peut aussi traduire : « il subit des peines éternelles » ou « il est puni pour l’éternité ».'
    reason: Le grec présente une expression elliptique ; la formulation du texte principal évite d’imposer un nom sous-entendu.
lexical_decisions:
- source_word: τύραννος
  choice: tyran
  rationale: Le grec porte un jugement moral sur le pouvoir oppressif d’Antiochos ; « tyran » conserve cette force, contrairement à « roi » ou « dirigeant ».
- source_word: τετιμώρηται
  choice: a été puni
  rationale: Le parfait présente une punition accomplie dont le résultat demeure pertinent.
- source_word: ἀϊδίων κολάζεται
  choice: il subit un châtiment éternel[a]
  rationale: Cette formulation française naturelle exprime le châtiment durable opposé à la punition terrestre ; la note signale que le grec laisse le nom qualifié par « éternel » sous-entendu.
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: il n’a absolument pas réussi
  rationale: La tournure rend l’insistance de la double négation grecque tout en s’accordant naturellement avec l’infinitif qui suit.
- source_word: ἀναγκάσαι
  choice: contraindre
  rationale: Le verbe exprime l’emploi de la force ou de la coercition.
- source_word: τοὺς Ἱεροσολυμείτας
  choice: les habitants de Jérusalem
  rationale: Expression claire et courante pour désigner la population de la ville.
- source_word: ἀλλοφυλῆσαι
  choice: adopter les pratiques de peuples étrangers
  rationale: Le verbe évoque l’assimilation à d’autres peuples ; « pratiques » rend ici sa dimension culturelle et religieuse sans la réduire à un changement de résidence.
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: renoncer au mode de vie ancestral de leur peuple
  rationale: La formulation conserve à la fois l’idée d’éloignement d’un mode de vie, la dimension ancestrale et la mention du peuple portée par le texte transmis, sans reproduire une construction grecque obscure en français.
theological_decisions:
- issue: Nature du châtiment postérieur à la punition terrestre d’Antiochos
  choice: Le texte affirme un châtiment éternel sans en préciser la forme.
  alternative: « il est puni pour l’éternité » ou « il subit des peines éternelles »
  rationale: Le grec oppose la punition sur terre à une punition qualifiée d’éternelle, mais emploie l’adjectif de manière elliptique. La traduction exprime l’affirmation centrale tout en rendant l’ellipse transparente dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. « Antiochos » suit la forme française usuelle du nom grec. La virgule finale est conservée parce que la phrase se poursuit au verset suivant.
