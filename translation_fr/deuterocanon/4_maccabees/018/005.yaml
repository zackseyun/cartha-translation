review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour ne pas fixer dans le texte principal le nom sous-entendu par l’adjectif grec ἀϊδίων. « Il est châtié éternellement » constitue une formulation française idiomatique qui rend l’affirmation sans imposer le singulier « un châtiment ». « Aussi sur terre » rend plus directement καὶ ἐπὶ γῆς. La seconde proposition conserve l’éloignement forcé des pratiques ancestrales et la référence au peuple ancestral.
  naturalness: 'Le français révisé est moderne, fluide et d’un registre soutenu accessible. « Se détourner des coutumes ancestrales de leur peuple » est plus naturel que « renoncer au mode de vie ancestral de leur peuple » tout en gardant les deux éléments du grec : les ancêtres et le peuple.'
  terminology: « Tyran », « Antiochos », « habitants de Jérusalem » et « contraindre » sont appropriés. La note maintient l’ellipse de ἀϊδίων et évite de présenter « châtiment » comme le seul nom possible.
  issues:
  - severity: medium
    issue: Le texte principal introduit le singulier « un châtiment éternel » pour l’expression elliptique ἀϊδίων κολάζεται.
    rationale: Le grec qualifie sans l’expliciter le complément de κολάζεται. Bien que la note relève l’ellipse, le singulier dans le corps du texte en réduit inutilement l’ambiguïté. Une tournure adverbiale française permet de ne pas choisir un nom sous-entendu.
  - severity: low
    issue: « jusque sur la terre » est moins direct et naturel que « aussi sur terre ».
    rationale: καὶ ἐπὶ γῆς signifie que la punition a eu lieu également sur terre ; « aussi sur terre » l’exprime sans nuance spatiale superflue.
  - severity: low
    issue: « renoncer au mode de vie ancestral de leur peuple » est un peu lourd et interprète largement la formulation condensée τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι.
    rationale: « se détourner des coutumes ancestrales de leur peuple » conserve la référence aux coutumes, aux ancêtres et au peuple, dans une formulation française plus exacte et naturelle.
  revised_text: Et le tyran Antiochos a aussi été puni sur terre, et il est châtié éternellement[a] ; car il n’a absolument pas réussi à contraindre les habitants de Jérusalem à adopter les pratiques de peuples étrangers et à se détourner des coutumes ancestrales de leur peuple,
