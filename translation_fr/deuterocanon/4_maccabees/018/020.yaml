base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: fr
  text: Qu’il fut amer, ce jour-là — et pourtant non amer[a] —, lorsque l’amer tyran des Grecs, ayant allumé un feu dans les terribles chaudrons et, dans sa colère bouillonnante, conduit les sept jeunes garçons vers la catapulte[b], puis de nouveau à ses tortures,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec juxtapose « amer » et « non amer ». Le jour fut amer par les souffrances endurées, mais non amer sous un autre rapport que le contexte associe à la fidélité et à l’honneur des martyrs.
    reason: Préserver et éclairer le paradoxe rhétorique sans le résoudre dans le texte.
  - marker: b
    text: Ou « vers le chevalet de torture » ou « vers la machine de supplice ». Le mot grec désigne normalement une catapulte ou une machine semblable, mais il semble évoquer ici un dispositif employé pour torturer.
    reason: Signaler l’alternative lexicale probable dans ce contexte.
lexical_decisions:
- source_word: πικρᾶς … πικρᾶς … πικρὸς
  choice: amer … ne le fut pas … cruel
  rationale: « Amer » conserve le paradoxe appliqué au jour. Pour le tyran, « cruel » rend le sens contextuel de πικρός sans produire en français l’expression peu naturelle « le tyran amer »; la répétition grecque est donc partiellement sacrifiée à l’intelligibilité.
- source_word: Ἑλλήνων τύραννος
  choice: le tyran des Grecs
  rationale: Le génitif Ἑλλήνων est conservé sans décider si le tyran est grec, règne sur les Grecs ou leur est associé d’une autre manière.
- source_word: πῦρ φλέξας
  choice: après avoir allumé le feu
  rationale: Le participe aoriste exprime ici naturellement une action antérieure; cette formulation reste concrète et vive.
- source_word: λέβησι ὠμοῖς
  choice: dans les terribles chaudrons
  rationale: λέβης désigne un chaudron ou une chaudière. Dans ce contexte, ὠμός caractérise leur emploi cruel; « terribles » évite la personnification plus heurtée de « cruels chaudrons ».
- source_word: ζέουσινν θυμοῖς
  choice: dans une colère bouillonnante
  rationale: La formulation rend l’image de l’ébullition et son écho avec les chaudrons, tout en donnant en français une expression idiomatique de la fureur.
- source_word: ἐπὶ τὸν καταπέλτην
  choice: jusqu’à la catapulte
  rationale: Le sens lexical ordinaire de καταπέλτης est retenu dans le texte, tandis qu’une note signale son probable emploi comme instrument de torture dans ce passage.
- source_word: τὰς βασάνους αὐτοῦ
  choice: ses tortures
  rationale: « Tortures » rend le sens concret de βάσανοι dans la scène, et le possessif traduit αὐτοῦ sans préciser davantage son rapport aux supplices.
- source_word: τοὺς ἑπτὰ παῖδας
  choice: les sept jeunes garçons
  rationale: παῖδες peut désigner des enfants, des garçons, des fils ou de jeunes serviteurs. « Jeunes garçons » exprime ici l’âge et le sexe sans remplacer le terme par « fils », que le grec n’emploie pas explicitement.
theological_decisions:
- issue: Paradoxe de καὶ οὐ πικρᾶς
  choice: et pourtant il ne le fut pas
  alternative: et non amer
  rationale: Le texte affirme simultanément l’amertume et la non-amertume du jour. La traduction maintient cette tension sans expliquer dans le corps du texte en quel sens le jour ne fut pas amer.
- issue: Sens de καταπέλτης dans le contexte du martyre
  choice: catapulte
  alternative: chevalet de torture; machine de supplice
  rationale: 'Le sens lexical courant reste visible, mais la note préserve l’incertitude contextuelle: il peut s’agir ici d’un dispositif destiné à étirer ou torturer les victimes.'
translation_notes:
  register: Français international actuel, soutenu mais accessible. La phrase demeure volontairement inachevée, comme le fragment grec fourni, et se termine par une virgule. Les images de l’amertume et de l’ébullition sont conservées autant que le permet un français naturel.
