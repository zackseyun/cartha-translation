    rationale: Le grec qualifie le jour de πικρός à deux reprises puis le tyran de πικρός. Même si « amer tyran » est inhabituel, le conserver dans une formulation littéraire préserve mieux le jeu rhétorique sans imposer une interprétation supplémentaire.
  - severity: low
    issue: τότε n’est pas explicitement rendu.
    rationale: « Ce jour-là » restitue le démonstratif temporel et améliore l’ancrage du récit.
  - severity: low
    issue: La coordination de « après avoir allumé ... et ... conduit » est légèrement lourde.
    rationale: Deux participes français coordonnés (« ayant allumé ... et ... conduit ») suivent plus nettement les deux participes aoristes grecs.
