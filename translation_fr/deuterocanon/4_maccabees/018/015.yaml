  text: David sang to us[a], the hymn-writer, saying[b], “Many are the afflictions of the righteous.”
translation:
  language: fr
  text: 'David, l’auteur d’hymnes[a], nous chantait : « Nombreuses sont les détresses des justes. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « David, le psalmiste, nous chantait : “Nombreuses sont les détresses des justes.” »'
    reason: lexical_alternative
  - marker: b
    text: Cette citation fait écho au Psaume 33.20 dans la Septante (Psaume 34.20 dans de nombreuses éditions françaises).
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: l’auteur de chants
  rationale: Le terme désigne littéralement celui qui compose des hymnes ou des chants. Cette formulation conserve l’image grecque tout en restant naturelle en français; ici, elle est mise en apposition à David.
- source_word: ἐμελῴδει
  choice: chantait
  rationale: Le verbe évoque l’action de chanter ou de psalmodier une mélodie. « Chantait » est clair, naturel et convient à l’évocation d’un chant sacré.
- source_word: ἡμῖν
  choice: nous
  rationale: 'Le datif indique les destinataires du chant : David chantait pour eux ou à leur intention. La construction française « nous chantait » exprime naturellement ce rapport.'
- source_word: Δαυεὶδ
  choice: David
  rationale: Forme française traditionnelle du nom propre.
- source_word: Πολλαὶ
  choice: Nombreuses sont
  rationale: Cette tournure conserve l’ordre emphatique et le registre sentencieux de la citation grecque.
- source_word: αἱ θλίψεις
  choice: les détresses
  rationale: θλίψεις désigne des pressions, épreuves, afflictions ou situations de détresse. « Détresses » demeure compréhensible et digne, sans réduire le terme à de simples difficultés.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: Le génitif pluriel désigne les personnes qui sont justes. « Les justes » est concis et conserve le registre scripturaire.
theological_decisions:
- issue: Rapport entre ὑμνογράφος et David
  choice: « l’auteur de chants » est placé en apposition à « David »
  alternative: « le psalmiste David »
  rationale: Malgré la formulation grecque comprimée, David est présenté comme le compositeur du chant cité, et non comme le sujet d’un chant composé par quelqu’un d’autre. La traduction garde le sens lexical du terme sans le remplacer entièrement par le titre traditionnel « psalmiste ».
- issue: Portée de τῶν δικαίων
  choice: la catégorie collective « les justes » est conservée
  alternative: « les personnes justes »
  rationale: La formulation substantivée maintient la tension scripturaire entre la justice des personnes évoquées et les nombreuses détresses qu’elles subissent, sans préciser davantage la nature de cette justice.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe identifie explicitement David comme l’auteur de chants afin d’éviter le contresens selon lequel il chanterait au sujet d’un autre auteur. Le tour « Nombreuses sont » conserve la solennité et l’accent initial du grec.
