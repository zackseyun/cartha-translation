  source_fidelity: 'Le texte français rend fidèlement les trois propositions grecques : l’état de virginité pure, le fait de ne pas « dépasser/franchir » le cadre de la maison paternelle, puis la garde continue de la « côte » bâtie. « Je gardais » restitue bien l’imparfait ἐφύλασσον, et « qui avait été bâtie » rend de manière recevable le participe parfait passif ᾠκοδομημένην tout en conservant l’écho volontairement étrange à Genèse 2.22.'
