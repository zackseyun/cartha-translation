  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: fr
  text: Car je suis restée vierge et pure, je n’ai pas franchi les limites de la maison de mon père[a] ; je gardais la côte qui avait été bâtie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « je n’ai pas quitté la maison de mon père » ou « je n’ai pas transgressé les limites de la maison de mon père ». Elle peut évoquer à la fois le fait de rester dans le foyer paternel et une conduite moralement retenue.'
    reason: alternative_reading
  - marker: b
    text: Ou « le côté qui avait été bâti ». Cette expression fait vraisemblablement écho à la création de la femme à partir du côté ou de la côte d’Adam en Genèse 2.22 ; elle sert ici d’image discrète de la chasteté préservée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: je suis restée
  rationale: Le verbe signifie littéralement « je suis devenue » ou « j’ai été », mais le contexte évoque le maintien de la virginité jusqu’au mariage. « Je suis restée » exprime naturellement cet état continu sans suggérer qu’elle serait devenue vierge.
- source_word: παρθένος ἁγνή
  choice: vierge et pure
  rationale: παρθένος désigne une vierge, tandis que ἁγνή exprime ici la pureté morale et sexuelle. La coordination française conserve clairement les deux termes grecs.
- source_word: οὐχ ὑπερέβην
  choice: je n’ai pas franchi les limites
  rationale: ὑπερβαίνω signifie dépasser ou franchir. L’ajout idiomatique de « les limites » rend compréhensible en français l’image des bornes de la maison tout en laissant ouverte sa portée concrète et morale.
- source_word: πατρικὸν οἶκον
  choice: la maison de mon père
  rationale: Cette formulation naturelle désigne à la fois la demeure et le foyer paternel. Le possessif est explicité conformément au contexte à la première personne.
- source_word: ἐφύλασσον
  choice: je gardais
  rationale: L’imparfait grec décrit une conduite continue. « Je gardais » préserve le sens de veiller sur quelque chose et la métaphore de la chasteté conservée.
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: la côte qui avait été bâtie
  rationale: πλευρά peut signifier « côté » ou « côte ». « Côte », associé au verbe « bâtir », conserve l’écho précis à la création de la femme en Genèse 2.22 ainsi que l’étrangeté voulue de l’image. Le plus-que-parfait rend l’état résultant du participe parfait passif.
theological_decisions:
- issue: Interprétation de l’allusion à la Genèse dans « la côte qui avait été bâtie »
  choice: Conserver l’image dans le texte principal sans l’expliciter comme une périphrase désignant la chasteté.
  alternative: Paraphraser par « je préservais ma chasteté » ou traduire πλευρά par « côté ».
  rationale: Le grec emploie une expression littéraire inhabituelle qui reprend vraisemblablement Genèse 2.22. Maintenir cette métaphore respecte l’allusion et évite d’imposer une explicitation sexuelle absente de la formulation.
- issue: Portée de l’expression concernant la maison paternelle
  choice: Traduire par « je n’ai pas franchi les limites de la maison de mon père » et signaler son ambiguïté en note.
  alternative: Comprendre exclusivement « je n’ai pas quitté la maison de mon père » ou « je n’ai pas transgressé les règles de la maison de mon père ».
  rationale: L’expression grecque peut évoquer aussi bien le fait de rester dans le foyer paternel que le respect moral de ses limites. La traduction et la note préservent cette double portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme autobiographique du grec. « Côte » et « bâtie » maintiennent volontairement l’allusion scripturaire et son caractère énigmatique, tandis que les notes exposent les principales ambiguïtés sans les résoudre dans le texte.
