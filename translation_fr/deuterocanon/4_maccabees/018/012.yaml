  yaml_path: translation/deuterocanon/4_maccabees/018/012.yaml
  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: fr
  text: Elle nous parlait de Phinéas, le zélé[a], et elle vous instruisait au sujet de Hanania, d’Azaria et de Mishaël, ceux qui étaient dans le feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Phinéas, l’homme zélé ». Le terme grec souligne le zèle qui le caractérisait.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ceux qui étaient dans le feu, Hanania, Azaria et Mishaël ». Les trois jeunes hommes sont désignés par l’épreuve de la fournaise.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν ἡμῖν τὸν ζηλωτὴν Φινεές
  choice: Elle nous parlait de Phinéas, l’homme plein de zèle
  rationale: Le verbe ἔλεγεν a pour sujet implicite la mère évoquée dans le contexte, tandis que Φινεές est à l’accusatif et constitue le contenu de ses paroles. L’imparfait français « parlait » rend l’aspect duratif ou habituel du grec.
- source_word: ζηλωτὴν
  choice: l’homme plein de zèle
  rationale: Le nom caractérise Phinéas par son zèle exemplaire. Cette formulation française est naturelle et évite que « le Zélote » soit compris comme le nom du parti politique postérieur.
- source_word: ἐδίδασκεν ὑμᾶς
  choice: elle vous instruisait
  rationale: Le pronom ὑμᾶς est le complément de ἐδίδασκεν. L’imparfait « instruisait » conserve la valeur continue ou répétée de l’enseignement.
- source_word: τοὺς ἐν πυρὶ
  choice: ceux qui étaient dans le feu
  rationale: L’expression substantivée désigne les trois jeunes hommes par l’épreuve qu’ils ont traversée; la relative garde explicitement cette fonction identificatrice.
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: Ananias, Azarias et Misaël
  rationale: Ces formes suivent l’usage français traditionnel pour les noms grecs de ces trois jeunes hommes dans les livres deutérocanoniques.
theological_decisions:
- issue: Fonction rhétorique des figures exemplaires
  choice: La mère instruisait ses fils en leur rappelant Phinéas et les trois jeunes hommes dans le feu.
  alternative: Comprendre que Phinéas parlait lui-même et que les trois jeunes hommes enseignaient eux-mêmes.
  rationale: Les formes accusatives Φινεές, Ἀνανίαν, Ἀζαρίαν et Μισαήλ les présentent comme objets du discours et de l’enseignement, non comme sujets des verbes. Le souvenir de leur conduite sert ainsi d’instruction, sans qu’il soit nécessaire de leur attribuer une parole directe dans ce verset.
- issue: Sujet implicite des deux verbes
  choice: Rendre explicitement le sujet féminin par « elle », en référence à la mère dans le contexte.
  alternative: Laisser le sujet indéterminé ou attribuer les verbes aux personnages nommés.
  rationale: Le grec permet l’omission du pronom sujet, mais le contexte fournit la mère comme sujet naturel. Le français exige ici son expression pour éviter une lecture grammaticalement erronée.
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits rendent l’action habituelle ou prolongée. La répétition de « elle » clarifie le sujet implicite grec, et « au sujet de » explicite en français la construction à double accusatif sans transformer les personnages évoqués en sujets des verbes.
