  source_fidelity: 'La syntaxe grecque comporte deux constructions à double accusatif : la mère « parlait à nous de Phinéas » et « vous enseignait [au sujet] des trois jeunes hommes ». Le projet rend correctement le sujet féminin implicite, les imparfaits et la fonction des personnages comme objets de l''enseignement. Une mise à jour des noms est toutefois préférable : bien que le grec emploie des formes hellénisées, il s''agit des trois jeunes hommes de Daniel, couramment nommés en français moderne Hanania, Azaria et Mishaël.'
