base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/001.yaml
  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: fr
  text: Ô enfants, descendants de la postérité d’Abraham[a], Israélites, obéissez à cette loi et vivez dans la piété à tous égards[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque, littéralement proche de « descendants des semences abrahamiques », est inhabituellement redoublée et souligne avec force l’identité ancestrale.
    reason: lexical_alternative
  - marker: b
    text: Ou « conduisez-vous pieusement de toute manière ». Le verbe désigne une conduite empreinte de respect envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Ô
  rationale: Conserve l’interpellation solennelle et la force rhétorique du vocatif grec.
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι
  choice: descendants de la lignée d’Abraham
  rationale: Rend l’ascendance abrahamique dans un français naturel tout en maintenant l’idée de descendance; une note signale l’expression grecque inhabituellement redoublée et son pluriel.
- source_word: παῖδες
  choice: enfants
  rationale: Terme collectif et filial approprié à l’adresse, sans restreindre inutilement le groupe aux seuls hommes.
- source_word: Ἰσραηλεῖται
  choice: Israélites
  rationale: Désignation ethnique conventionnelle et directe.
- source_word: πείθεσθε
  choice: obéissez
  rationale: Avec la loi au datif, le verbe appelle ici à s’y conformer concrètement plutôt qu’à être seulement persuadé.
- source_word: τῷ νόμῳ τούτῳ
  choice: à cette loi
  rationale: Reproduit le démonstratif et désigne, dans le contexte, la loi ancestrale d’Israël sans ajouter « Torah » au texte.
- source_word: πάντα τρόπον
  choice: à tous égards
  rationale: Expression française idiomatique qui communique l’étendue complète de la conduite demandée.
- source_word: εὐσεβεῖτε
  choice: vivez dans la piété
  rationale: Exprime une conduite durable, respectueuse de Dieu et conforme à la piété, plutôt qu’un simple sentiment intérieur.
theological_decisions:
- issue: Référent de « cette loi »
  choice: La loi ancestrale d’Israël, c’est-à-dire la Torah
  alternative: Une loi morale au sens général
  rationale: L’adresse explicite aux Israélites et le contexte de 4 Maccabées orientent vers la loi d’Israël, mais le texte principal conserve simplement le mot « loi » comme le grec.
- issue: Portée de εὐσεβεῖτε
  choice: Une manière de vivre pieuse qui honore Dieu
  alternative: Une simple attitude de respect ou une observance cultuelle étroite
  rationale: Le verbe grec embrasse une conduite religieuse concrète; « vivez dans la piété » en préserve la portée sans lui imposer une définition confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le « Ô » conserve l’élan oratoire; la longue série de vocatifs et d’appositions est maintenue. « Piété » est employé au sens large de conduite qui honore Dieu, avec une note pour prévenir une lecture trop étroite.
