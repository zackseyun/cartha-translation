review_pass:
  verdict: revise
  source_fidelity: La formulation « descendants de la lignée d’Abraham » transmet l’idée générale, mais elle atténue le redoublement rhétorique du grec, qui associe explicitement « descendants » (ἀπόγονοι) et « semences/postérité » (σπερμάτων). « Descendants de la postérité d’Abraham » préserve mieux ces deux éléments tout en restant idiomatique. Le reste rend fidèlement les vocatifs, l’impératif d’obéissance et l’appel à une conduite pieuse.
  naturalness: Le français est soutenu, clair et adapté à une adresse solennelle. « Ô », « Israélites » et « à tous égards » conviennent. « Vivez dans la piété » est naturel dans ce registre. La note a doit toutefois employer « semences » plutôt que « descendances » pour correspondre au mot grec signalé.
  terminology: « Enfants », « Israélites », « cette loi » et « piété » sont des choix appropriés. Le texte ne doit pas ajouter « Torah », bien que ce soit le référent contextuel probable. « Postérité » rend mieux σπέρματα que « lignée » et permet de conserver l’effet d’accumulation ancestrale.
  issues:
  - severity: medium
    issue: Atténuation du redoublement ancestral dans « descendants de la lignée d’Abraham »
    rationale: Le grec dit littéralement, avec une formulation accumulative, « descendants des semences/postérité abrahamiques ». « Lignée » condense l’expression et ne reflète plus explicitement le rapport entre ἀπόγονοι et σπέρματα.
  - severity: low
    issue: La note a paraphrase σπερμάτων par « descendances »
    rationale: σπέρματα signifie proprement « semences » et, par extension, « postérité/descendance ». « Descendances » est moins précis et moins naturel ici.
  revised_text: Ô enfants, descendants de la postérité d’Abraham[a], Israélites, obéissez à cette loi et vivez dans la piété à tous égards[b].
