translation:
  language: fr
  text: lui qui, lorsqu’il était encore avec nous, vous enseignait[a] la loi et les prophètes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous instruisait » ; l’imparfait grec peut présenter une action passée qui se prolongeait ou se répétait habituellement.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la loi et les prophètes » désigne les Écritures sacrées d’Israël, notamment la Torah et les écrits prophétiques.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Le pronom relatif renvoie à l’antécédent du contexte précédent. « Lui qui » convient à ce fragment de phrase et en préserve le lien syntaxique.
- source_word: ἐδίδασκεν
  choice: vous enseignait
  rationale: L’imparfait français rend naturellement l’imparfait grec et laisse ouverte une valeur durative ou habituelle.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom grec est un objet direct pluriel ; le français « vous » conserve cette adresse au pluriel.
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: lorsqu’il était encore avec nous
  rationale: Cette proposition temporelle naturelle en français conserve ἔτι (« encore ») et σὺν ἡμῖν (« avec nous »).
- source_word: τὸν νόμον
  choice: la loi
  rationale: Dans cette association traditionnelle, le terme désigne la Torah, tout en restant traduit sans ajout explicatif dans le corps du texte.
- source_word: καὶ τοὺς προφήτας
  choice: et les prophètes
  rationale: La traduction directe préserve l’association scripturaire consacrée avec « la loi » et peut désigner les écrits prophétiques ou leur témoignage autorisé.
theological_decisions:
- issue: Faut-il mettre une majuscule à « loi » et à « prophètes » comme désignations techniques de divisions scripturaires ?
  choice: la loi et les prophètes
  alternative: la Loi et les Prophètes
  rationale: Le grec désigne clairement les Écritures d’Israël, mais ne marque pas typographiquement des noms propres. Les minuscules évitent d’ajouter une interprétation éditoriale, tandis que la note explicite le sens scripturaire.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « enseignait » conserve sans la trancher la nuance durative ou habituelle du grec. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
