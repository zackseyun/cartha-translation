base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: fr
  text: Mais les fils d’Abraham, avec leur mère qui a remporté le prix du combat[a], rejoignent[b] le lieu de leurs pères, ayant reçu de Dieu des âmes pures et immortelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque relève de l’image du combat athlétique et du prix remporté; on pourrait aussi traduire : « leur mère victorieuse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec peut souligner le fait de se joindre à une compagnie; autre traduction possible : « se joignent à la compagnie de leurs pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: les fils d’Abraham
  rationale: Le groupe désigne ici les frères martyrs, tous de sexe masculin. « Fils d’Abraham » exprime naturellement leur appartenance à la descendance d’Abraham.
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: avec leur mère qui a remporté le prix du combat
  rationale: ἀθλοφόρος appartient au vocabulaire de la compétition et du prix remporté. Cette formulation conserve l’image athlétique sans recourir au calque peu naturel « porteuse de victoire ».
- source_word: συναγελιᾶζονται
  choice: rejoignent
  rationale: Le verbe évoque le fait de se joindre à une compagnie ou de vivre en communauté. « Rejoignent » rend ce mouvement vers la compagnie des ancêtres en accord avec εἰς.
- source_word: εἰς πατέρων χῶρον
  choice: le séjour de leurs pères
  rationale: χῶρος désigne un lieu ou un espace. « Séjour » convient ici à la destination post mortem sans préciser davantage sa nature; le possessif, implicite dans le rapport familial, est nécessaire en français courant.
- source_word: ψυχὰς ἁγνὰς καὶ ἀθανάτους
  choice: des âmes pures et immortelles
  rationale: Dans ce contexte de récompense après le martyre, ψυχαί a le sens d’« âmes »; les deux adjectifs sont rendus directement, sans atténuer l’affirmation du texte.
- source_word: ἀπειληφότες παρὰ τοῦ θεοῦ
  choice: après avoir reçu de Dieu
  rationale: Le participe parfait indique un don reçu dont le résultat demeure; παρά avec le génitif marque Dieu comme source.
theological_decisions:
- issue: Nature du « séjour des pères »
  choice: le séjour de leurs pères
  alternative: la demeure de leurs pères; la compagnie de leurs pères
  rationale: Le grec évoque un lieu ancestral et, par le verbe, une communauté, mais ne le nomme ni ciel, ni paradis, ni sein d’Abraham. La traduction conserve cette réserve.
- issue: Sens anthropologique de ψυχὰς ἁγνὰς καὶ ἀθανάτους
  choice: des âmes pures et immortelles
  alternative: des vies pures et immortelles
  rationale: Le contexte post mortem favorise « âmes ». La formulation maintient néanmoins l’énoncé tel quel, sans élaborer une doctrine plus précise de l’état des morts.
translation_notes:
  register: Français international moderne, digne et accessible. « Séjour » conserve la retenue de l’image eschatologique; « le prix du combat » maintient la métaphore athlétique dans une expression française naturelle.
