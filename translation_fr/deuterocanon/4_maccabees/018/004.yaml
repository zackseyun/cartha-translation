review_pass:
  verdict: revise
  source_fidelity: 'La proposition « chassa entièrement les ennemis par un siège » explicite comme sens principal un résultat d’expulsion que ἐκπεπολιόρκηκε peut suggérer, mais dont la base lexicale demeure « assiéger », avec une valeur intensive. Le parfait grec est aussi mieux rendu par le passé composé français. Le reste suit bien le grec : διʼ αὐτούς garde la causalité, εἰρήνευσεν est correctement rendu, et εὐνομία est bien représentée par « le bon ordre ».'
  naturalness: Le français est globalement naturel et de registre soutenu accessible. « Elle a entièrement assiégé les ennemis » est plus fidèle et plus direct que « les chassa ... par un siège », tout en demeurant intelligible dans un contexte militaire antique.
  terminology: « Grâce à eux », « la nation », « le bon ordre » et « la patrie » conviennent au contexte et au français international moderne. La note b doit présenter le sens d’expulsion comme une possibilité interprétative, plutôt que comme la traduction littérale opposée à une formulation principale qui l’adoptait déjà.
