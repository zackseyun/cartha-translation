base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: fr
  text: Et grâce à eux, la nation connut la paix[a] et, après avoir rétabli le bon ordre dans la patrie, elle a entièrement assiégé les ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur intermédiaire » ; le grec peut exprimer la cause ou l’instrumentalité.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec est intensif et formé sur le verbe « assiéger » ; il peut aussi évoquer l’issue du siège : « elle a entièrement chassé les ennemis par un siège ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ αὐτοὺς
  choice: grâce à eux
  rationale: διά avec l’accusatif exprime ici naturellement la cause, tout en pouvant laisser entendre leur rôle d’intermédiaires. « Grâce à eux » convient au résultat bénéfique décrit dans le verset.
- source_word: εἰρήνευσεν
  choice: connut la paix
  rationale: Le verbe signifie vivre ou se trouver en paix. Cette formulation française évite de suggérer nécessairement la conclusion d’un traité.
- source_word: τὸ ἔθνος
  choice: la nation
  rationale: Le terme désigne ici collectivement la communauté nationale juive et conserve une portée à la fois humaine et politique.
- source_word: εὐνομίαν
  choice: le bon ordre
  rationale: εὐνομία évoque un ordre public fondé sur de bonnes lois; « le bon ordre » en garde l’étendue sans le réduire à la seule légalité ou à l’administration.
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: dans la patrie
  rationale: La phrase situe le rétablissement de l’ordre dans la terre ancestrale. « Patrie » préserve la nuance affective et collective de πατρίς.
- source_word: ἀνανεωσάμενος
  choice: après avoir rétabli
  rationale: Le participe aoriste présente ce renouvellement comme antérieur ou étroitement lié à l’action suivante. « Rétabli » est idiomatique pour un ordre auparavant compromis.
- source_word: ἐκπεπολιόρκηκε
  choice: chassa entièrement les ennemis par un siège
  rationale: 'Le parfait de ἐκπολιορκέω, formé sur πολιορκέω, peut exprimer l’aboutissement intensif d’un siège: forcer l’ennemi à sortir ou l’en déloger. La traduction garde à la fois le procédé militaire et son résultat, tandis que la note signale la lecture plus littérale possible.'
- source_word: τοὺς πολεμίους
  choice: les ennemis
  rationale: Équivalent français direct et naturel dans ce contexte militaire.
theological_decisions:
- issue: Rôle causal des martyrs dans la délivrance nationale
  choice: Le texte affirme que la paix de la nation est venue grâce à eux, sans définir ici plus précisément le mécanisme théologique de cette causalité.
  alternative: « Par leur intermédiaire » mettrait davantage en avant l’instrumentalité.
  rationale: Le grec attribue réellement aux martyrs un rôle causal dans la paix et le rétablissement national. Il ne faut ni atténuer cette affirmation ni introduire dans ce seul verset une doctrine sacrificielle plus développée tirée du contexte voisin.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif soutenu du passage. La syntaxe conserve l’enchaînement causal et militaire du grec sans ajouter d’explication doctrinale.
