    issue: Le verbe ἐκπεπολιόρκηκε est rendu par « chassa entièrement ... par un siège ».
    rationale: Cette traduction choisit un aboutissement possible du verbe intensif composé d’« assiéger », mais dépasse sa formulation plus immédiatement littérale. Une traduction principale fondée sur « assiéger » et une note signalant l’interprétation résultative préservent mieux la marge sémantique.
  - severity: low
    issue: La valeur du parfait grec disparaît dans « chassa ».
    rationale: Le passé composé (« a entièrement assiégé ») permet de distinguer plus naturellement le parfait de l’aoriste précédent (« connut »), sans alourdir le français.
  revised_text: Et grâce à eux, la nation connut la paix[a] et, après avoir rétabli le bon ordre dans la patrie, elle a entièrement assiégé les ennemis[b].
