  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: fr
  text: 'Il invoquait le témoignage d’Ézéchiel[a], qui dit[b] : « Ces os desséchés revivront-ils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Allusion à Ézéchiel 37.3, dans la vision de la vallée remplie d’ossements desséchés.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction possible : « confirmait les paroles d’Ézéchiel » ou « prenait Ézéchiel à témoin ». Le verbe grec a un sens testimonial difficile à rendre par une seule expression française.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: invoquait le témoignage de
  rationale: 'Le verbe, au moyen, a ici une valeur testimoniale : le sujet fait appel à Ézéchiel pour étayer son propos. Cette formulation française est naturelle tout en conservant l’idée d’un témoignage invoqué.'
- source_word: τὸν Ἰεζεκιὴλ
  choice: Ézéchiel
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: τὸν λέγοντα
  choice: qui dit
  rationale: Le participe présent introduit une citation scripturaire. Le présent « dit » respecte cette forme et convient à une formule de citation en français.
- source_word: Εἰ ζήσεται
  choice: revivront-ils ?
  rationale: Dans ce contexte, εἰ introduit une interrogation indirecte ou délibérative reprise comme question directe. « Revivre » exprime naturellement le retour à la vie d’ossements desséchés sans ajouter de conclusion doctrinale.
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: ces os desséchés
  rationale: Cette tournure rend naturellement le nom, l’adjectif attributif et le démonstratif, tout en conservant l’écho reconnaissable à la vision d’Ézéchiel 37.
theological_decisions:
- issue: Portée de l’allusion à Ézéchiel et à la vie rendue aux ossements
  choice: 'Conserver la citation sous forme de question : « Ces os desséchés revivront-ils ? »'
  alternative: Développer explicitement la citation comme une affirmation de la résurrection.
  rationale: Le texte invoque l’image d’Ézéchiel comme témoignage d’espérance face à la mort, mais il la formule comme une question. La traduction préserve cette tension sans préciser davantage la doctrine visée.
- issue: Rapport du sujet à l’autorité prophétique
  choice: « invoquait le témoignage d’Ézéchiel »
  alternative: « confirmait Ézéchiel » ou « prenait Ézéchiel à témoin »
  rationale: Le grec est lexicalement difficile. La formulation retenue exprime un appel au témoignage prophétique sans suggérer qu’Ézéchiel serait personnellement présent ni que le sujet validerait son autorité.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur interrogatif « revivront-ils ? » est idiomatique et garde la force de l’image prophétique. La formulation évite aussi l’ambiguïté peu naturelle de « rendre témoignage à Ézéchiel ».
