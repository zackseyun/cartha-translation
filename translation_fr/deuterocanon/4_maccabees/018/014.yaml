  text: And he kept reminding you of the Scripture of Isaiah that says[a], “Even if you pass through fire, a flame will not burn you.”
translation:
  language: fr
  text: 'Et il continuait à vous rappeler l’Écriture d’Ésaïe, qui dit[a] : « Même si tu traverses le feu, une flamme ne te brûlera pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La citation fait écho à Ésaïe 43,2. Ici, 4 Maccabées suit sa propre formulation grecque : « une flamme ne te brûlera pas ».'
    reason: Renvoi et signalement de la formulation particulière de la citation.
lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: il continuait à vous rappeler
  rationale: L’imparfait grec présente l’action comme prolongée ou répétée. Cette tournure en restitue l’aspect sans alourdir la phrase.
- source_word: γραφὴν
  choice: l’Écriture
  rationale: Dans ce contexte juif, γραφή désigne un écrit sacré, et non un écrit quelconque.
- source_word: τὴν λέγουσαν
  choice: qui dit
  rationale: Le participe attributif introduit la citation et se rend naturellement en français par une proposition relative.
- source_word: Κἂν
  choice: Même si
  rationale: La contraction de καὶ ἐάν introduit ici une condition à valeur concessive.
- source_word: διὰ πυρὸς διέλθῃς
  choice: tu traverses le feu
  rationale: Cette formulation directe conserve l’image du passage à travers le feu et le tutoiement singulier du grec.
- source_word: φλὸξ
  choice: une flamme
  rationale: Le singulier sans article est rendu par un indéfini, ce qui maintient la distinction entre le feu et la flamme.
- source_word: οὐ κατακαύσει σε
  choice: ne te brûlera pas
  rationale: Le verbe peut signifier brûler entièrement ou consumer, mais « brûler » exprime clairement ici la protection promise sans renforcer indûment le grec.
theological_decisions:
- issue: Formulation de la citation d’Ésaïe
  choice: Traduire la citation selon le texte grec propre à 4 Maccabées
  alternative: Harmoniser la citation avec une formulation française traditionnelle d’Ésaïe 43.2
  rationale: La traduction reste fondée sur le texte de 4 Maccabées, dont la formulation diffère légèrement de celle transmise dans certaines versions d’Ésaïe.
- issue: Valeur aspectuelle de ὑπεμίμνησκεν
  choice: Exprimer la continuité par « continuait à vous rappeler »
  alternative: Employer simplement « vous rappela » ou « vous rappelait »
  rationale: Cette formulation fait entendre la durée ou la répétition suggérée par l’imparfait grec, sans préciser davantage la fréquence.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple, et le tutoiement singulier de la citation grecque est conservé.
