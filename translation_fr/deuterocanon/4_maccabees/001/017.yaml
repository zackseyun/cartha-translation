base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/017.yaml
  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
translation:
  language: fr
  text: 'Voici donc ce qu’est l’éducation[a] que donne la loi : par elle, nous apprenons ce qui relève du divin avec révérence et ce qui relève de l’humain de manière utile[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la formation » ou « la discipline ». Le grec παιδεία désigne une éducation qui forme la personne, notamment sur le plan moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « les réalités divines ... les réalités humaines ». Le grec oppose ici deux catégories très larges. « De manière utile » peut aussi se rendre par « de façon avantageuse » ou « bénéfique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη δὴ τοίνυν
  choice: Voici donc en quoi consiste
  rationale: Cette formulation française rend la transition récapitulative et légèrement emphatique de l’expression grecque sans produire un calque lourd.
- source_word: ἡ τοῦ νόμου παιδεία
  choice: l’éducation donnée par la loi
  rationale: παιδεία désigne une éducation formatrice, qui comprend instruction et discipline morale. « Donnée par la loi » explicite naturellement en français le génitif de source ou d’agent sans en changer le sens.
- source_word: διʼ ἧς
  choice: par elle
  rationale: Le relatif renvoie à l’éducation donnée par la loi et exprime le moyen.
- source_word: τὰ θεῖα
  choice: ce qui relève du divin
  rationale: Le neutre pluriel désigne largement les réalités ou questions divines; cette expression préserve cette amplitude sans ajouter « Dieu » au grec.
- source_word: σεμνῶς
  choice: avec révérence
  rationale: L’adverbe évoque une attitude grave, digne et respectueuse, ici envers le divin.
- source_word: τὰ ἀνθρώπινα
  choice: ce qui relève de l’humain
  rationale: Cette formulation maintient le contraste catégoriel général avec τὰ θεῖα sans le réduire aux seules affaires sociales.
- source_word: συμφερόντως
  choice: d’une manière profitable
  rationale: Le terme signifie de façon utile, avantageuse ou bénéfique. « Profitable » conserve cette orientation pratique et éthique.
- source_word: μανθάνομεν
  choice: nous apprenons
  rationale: Le présent français rend directement la portée générale du présent grec.
theological_decisions:
- issue: Référent et graphie de νόμος
  choice: la loi
  alternative: la Loi
  rationale: Le contexte de 4 Maccabées renvoie à la loi juive, mais le grec porte simplement νόμος. La minuscule préserve la forme du texte et évite de préciser davantage que lui.
- issue: Portée de τὰ θεῖα
  choice: ce qui relève du divin
  alternative: les choses de Dieu
  rationale: Le grec emploie un adjectif substantivé neutre et ne nomme pas explicitement Dieu; la traduction conserve donc sa formulation générale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le parallélisme entre le divin et l’humain ainsi que les deux adverbes, tout en adoptant une syntaxe française naturelle.
