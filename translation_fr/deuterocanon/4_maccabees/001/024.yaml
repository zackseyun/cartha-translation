  text: Anger is a passion shared by pleasure and pain, if one reflects on the occasion when it came upon him.
translation:
  language: fr
  text: La colère est une passion commune au plaisir et à la douleur, si l’on réfléchit au moment où elle l’a saisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: la colère
  rationale: Dans ce contexte d’analyse des passions, le terme désigne la colère plutôt que, plus largement, l’ardeur ou l’élan vital.
- source_word: κοινὸν πάθος
  choice: une passion commune
  rationale: Cette formulation conserve l’idée que la colère appartient à la fois au domaine du plaisir et à celui de la douleur, sans préciser davantage la nature de ce rapport.
- source_word: περιέπεσεν
  choice: a saisis
  rationale: Le verbe exprime ici le fait que la colère survient à quelqu’un ou s’empare de lui ; « saisir » rend cette irruption naturellement en français.
theological_decisions:
- issue: Rapport de la colère au plaisir et à la douleur
  choice: commune au plaisir et à la douleur
  alternative: partagée par le plaisir et la douleur
  rationale: Le génitif grec permet une relation générale. La traduction retenue préserve cette relative indétermination et évite de personnifier inutilement le plaisir et la douleur.
translation_notes:
  register: Français moderne, sobre et philosophique. Le passage du singulier indéfini grec à « l’on… nous » est idiomatique en français et garde la portée générale de l’énoncé.
