  text: And within pleasure there is also a malicious disposition[a], being the most versatile of all the passions.
translation:
  language: fr
  text: Dans le plaisir se trouve aussi une disposition vicieuse, la plus multiforme de toutes les passions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celle qui revêt le plus de formes de toutes les passions ». Le grec peut évoquer la multiplicité de ses formes, de ses tours ou de ses détours.'
    reason: Alternative lexicale pour πολυτροπωτάτη, dont la nuance imagée ne se laisse pas rendre par un seul équivalent français.
lexical_decisions:
- source_word: ἐν δὲ τῇ ἡδονῇ
  choice: Dans le plaisir
  rationale: La préposition ἐν avec le datif situe cette disposition dans la catégorie du plaisir; « dans le plaisir » conserve cette relation classificatoire en français naturel.
- source_word: κακοήθης διάθεσις
  choice: la disposition vicieuse
  rationale: διάθεσις désigne une disposition ou tendance, tandis que κακοήθης lui donne une qualification morale mauvaise. « Vicieuse » convient mieux ici que « malveillante », qui évoquerait surtout une intention de nuire.
- source_word: πολυτροπωτάτη
  choice: celle qui revêt le plus de formes
  rationale: Le superlatif de πολύτροπος exprime la multiplicité des formes, des tours ou des modes. Cette formulation française est claire et garde l'idée centrale sans employer le rare « multiforme ».
- source_word: πάντων τῶν παθῶν
  choice: parmi toutes les passions
  rationale: Dans l'argument éthique et philosophique du livre, πάθη désigne les passions ou impulsions que la raison doit gouverner; « passions » préserve ce cadre.
- source_word: οὖσα
  choice: celle qui
  rationale: La proposition relative restitue naturellement en français la relation descriptive du participe οὖσα avec « disposition », sans lui imposer une valeur causale.
theological_decisions:
- issue: Sens de πάθη dans le cadre philosophique juif hellénistique
  choice: passions
  alternative: émotions
  rationale: « Passions » maintient la tension éthique entre la raison et les impulsions affectives, tandis qu'« émotions » serait plus général et moralement plus neutre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du raisonnement grec tout en évitant le calque lourd « étant la plus multiforme ».
