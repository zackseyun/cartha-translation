base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: fr
  text: Car pourquoi, lorsque nous sommes attirés vers les aliments interdits, nous détournons-nous des plaisirs qu’ils procurent ? N’est-ce pas parce que la raison peut maîtriser les désirs[a] ? Pour ma part, je le pense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les appétits » ; le terme grec peut désigner plus particulièrement les impulsions corporelles, notamment dans ce contexte alimentaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Car pourquoi
  rationale: Introduit une question rhétorique explicative tout en conservant le lien avec l’argument précédent.
- source_word: κινούμενοι πρὸς
  choice: lorsque nous sommes attirés vers
  rationale: Rend le mouvement intérieur vers l’objet et conserve la nuance passive du participe, dans un français naturel.
- source_word: τὰς ἀπειρημένας τροφάς
  choice: les aliments interdits
  rationale: Désigne clairement les aliments dont la consommation est prohibée dans le contexte.
- source_word: ἀποτρεπόμεθα
  choice: nous détournons-nous
  rationale: Préserve l’image d’un mouvement par lequel on se détourne volontairement de quelque chose.
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: des plaisirs qu’ils procurent
  rationale: Exprime naturellement en français les plaisirs provenant de ces aliments.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Rend le terme central désignant la faculté rationnelle qui gouverne les mouvements du désir dans 4 Maccabées.
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: maîtriser les désirs
  rationale: « Maîtriser » exprime la supériorité effective indiquée par ἐπικρατεῖν, tandis que « désirs » garde une portée assez large.
- source_word: ἐγὼ μὲν οἶμαι
  choice: Pour ma part, je le pense
  rationale: Conserve l’accent personnel et la conclusion affirmative, avec une légère réserve rhétorique.
theological_decisions:
- issue: Portée philosophique et anthropologique de λογισμός
  choice: la raison
  alternative: le jugement rationnel
  rationale: « La raison » transmet clairement l’idée de la faculté rationnelle capable de gouverner les désirs, sans introduire une catégorie doctrinale ultérieure.
- issue: Force de ἐπικρατεῖν à l’égard des désirs
  choice: maîtriser
  alternative: l’emporter sur
  rationale: « Maîtriser » convient au thème du gouvernement des passions, sans suggérer leur disparition ni résoudre davantage la tension du texte.
