  text: but it also is shown to rule over the passions that hinder righteousness[a], such as malice, and over the passions that hinder courage—anger, pain, and fear.
translation:
  language: fr
  text: 'mais elle se révèle aussi capable de maîtriser les passions qui font obstacle à la justice[a], comme la malveillance, ainsi que les passions qui font obstacle au courage : la colère, la douleur et la peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύειν
  choice: maîtriser
  rationale: Le verbe exprime l’exercice d’une domination ou d’un contrôle. « Maîtriser » est naturel en français dans le contexte du pouvoir de la raison sur les passions.
- source_word: ἀναφαίνεται
  choice: se révèle capable de
  rationale: Le verbe signifie que quelque chose apparaît ou devient manifeste. Avec l’infinitif κυριεύειν, cette formulation rend clairement ce qui se révèle au cours de l’argumentation.
- source_word: ἐμποδιστικῶν
  choice: qui font obstacle à
  rationale: La proposition relative restitue naturellement l’idée de passions qui entravent la vertu concernée.
- source_word: παθῶν
  choice: passions
  rationale: Dans ce contexte philosophique, le terme désigne les mouvements affectifs susceptibles de gouverner la conduite, et non des souffrances extérieures.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans une liste de vertus grecques, δικαιοσύνη désigne naturellement la vertu de justice. La variante « droiture » est conservée en note pour préserver l’étendue morale possible du terme.
- source_word: κακοηθείας
  choice: malveillance
  rationale: Le nom désigne une mauvaise disposition morale ou une intention nuisible. « Malveillance » rend cette idée en français actuel sans archaïsme.
- source_word: ἀνδρείας
  choice: courage
  rationale: Dans le vocabulaire grec des vertus, le terme désigne le courage ou la bravoure; « courage » est clair, actuel et non genré.
- source_word: θυμοῦ
  choice: colère
  rationale: Dans cette série de passions qui entravent le courage, le sens négatif de « colère » convient mieux que celui d’ardeur ou de fougue.
- source_word: πόνου
  choice: douleur
  rationale: Parmi les passions opposées au courage, « douleur » est le sens le plus direct, tout en laissant ouverte la dimension de peine ou de souffrance.
- source_word: φόβου
  choice: peur
  rationale: Le terme grec désigne simplement la peur; rien dans le contexte n’impose un terme plus intense comme « terreur ».
theological_decisions:
- issue: Traduction de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Le passage s’inscrit dans une présentation philosophique des vertus cardinales, où « justice » est le terme français le plus précis. « Droiture » demeure possible si l’on comprend plus largement la qualité morale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure parallèle du grec est conservée, tandis que « se révèle capable de maîtriser » explicite naturellement le rapport entre ἀναφαίνεται et l’infinitif κυριεύειν.
