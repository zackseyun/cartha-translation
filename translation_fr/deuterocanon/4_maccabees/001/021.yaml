translation:
  language: fr
  text: Il y a aussi d’anciennes suites de passions concernant le plaisir et la douleur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y a aussi d’anciennes séries de passions relatives au plaisir et à la douleur. »'
    reason: 'Alternative lexicale : « séries » pour ἀκολουθίαι et « relatives à » pour περί.'
lexical_decisions:
- source_word: παλαιαὶ
  choice: anciens
  rationale: L’adjectif qualifie des enchaînements établis depuis longtemps; « anciens » conserve explicitement cette profondeur temporelle.
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: au sujet du plaisir et de la douleur
  rationale: περί avec l’accusatif indique ici le domaine ou l’objet concerné, sans imposer une relation causale.
- source_word: παθῶν
  choice: de passions
  rationale: Dans le cadre philosophique de 4 Maccabées, πάθη désigne les passions ou impulsions que la raison doit maîtriser; « passions » en garde la nuance technique.
- source_word: ἀκολουθίαι
  choice: enchaînements
  rationale: Le terme évoque des éléments qui se suivent selon un ordre. « Enchaînements » est naturel en français et évite de transformer cette succession en causalité certaine.
theological_decisions:
- issue: Sens philosophique et anthropologique de πάθη
  choice: passions
  alternative: émotions; affections
  rationale: « Passions » préserve le vocabulaire philosophique du livre concernant les impulsions soumises à la raison, tandis qu’« émotions » serait plus général et moderne.
- issue: Nature du lien exprimé par ἀκολουθίαι
  choice: enchaînements
  alternative: suites; séries; conséquences
  rationale: Le grec affirme une succession ou une relation ordonnée, mais ne tranche pas explicitement en faveur d’un rapport de cause à effet; « conséquences » résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre de la phrase est légèrement réorganisé pour éviter que « anciennes » ne semble qualifier les passions elles-mêmes plutôt que les enchaînements.
