  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: fr
  text: Mais distinguons[a] ce qu’est la raison[b], ce qu’est une passion[c], combien il existe de sortes de passions, et si la raison les domine toutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « examinons » ou « déterminons ». Le verbe grec peut souligner l’action de distinguer des catégories aussi bien que celle de les déterminer.
    reason: lexical_alternative
  - marker: b
    text: Ou « le raisonnement » ou « le jugement rationnel ».
    reason: lexical_alternative
  - marker: c
    text: Ou « un mouvement affectif » ou « une impulsion ». Le terme grec possède ici un sens philosophique et ne désigne pas la souffrance.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: examinons
  rationale: Le subjonctif d’exhortation invite les lecteurs à une recherche commune. « Examinons » est naturel en français et convient à la démarche de définition et de distinction qui ouvre l’argument.
- source_word: λογισμός
  choice: raison
  rationale: Dans 4 Maccabées, le terme désigne la faculté de jugement rationnel au cœur de la thèse de l’ouvrage. « Raison » conserve clairement et sobrement cette portée philosophique.
- source_word: πάθος
  choice: passion
  rationale: Dans ce contexte philosophique, le mot désigne un mouvement affectif plutôt qu’une souffrance. « Passion » maintient le contraste éthique ancien avec la raison, sans le réduire à la seule émotion.
- source_word: πόσα παθῶν εἰδέα
  choice: combien il existe de sortes de passions
  rationale: εἰδέα désigne ici des sortes ou catégories. Cette formulation rend la visée classificatoire dans un français actuel et accessible.
- source_word: ἐπικρατεῖ
  choice: domine
  rationale: Le verbe exprime la prééminence ou la maîtrise. « Domine » préserve cette idée forte sans imposer le sens plus mécanique de « contrôle ».
- source_word: τούτων
  choice: les ... toutes
  rationale: Le pronom renvoie aux passions précédemment mentionnées. La reprise pronominale française évite une lourdeur tout en conservant l’idée de totalité.
theological_decisions:
- issue: Rendre l’opposition philosophique entre λογισμός et πάθος
  choice: la raison ... une passion / les passions
  alternative: le jugement rationnel ... une émotion / les impulsions
  rationale: Le couple choisi conserve la tension philosophique structurante de 4 Maccabées entre la faculté rationnelle et les mouvements affectifs, sans la reformuler dans un vocabulaire psychologique moderne trop étroit.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure interrogative indirecte suit la progression du grec. « Examinons » rend naturellement l’exhortation commune tout en laissant percevoir la démarche de distinction conceptuelle.
