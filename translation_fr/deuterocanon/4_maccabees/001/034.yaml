base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: fr
  text: Ainsi donc, bien que nous désirions des animaux aquatiques, des oiseaux et des quadrupèdes — toutes sortes d’aliments qui nous sont interdits par la Loi —, nous nous en abstenons en raison de la maîtrise exercée par la raison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de la maîtrise de la raison ». Dans cet ouvrage, il s’agit de la raison disciplinée par la Loi, qui domine les désirs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Ainsi donc
  rationale: Cette locution marque nettement la conclusion tirée de l’argument précédent, dans un français naturel.
- source_word: ἐνύδρων
  choice: animaux aquatiques
  rationale: Le terme désigne largement les animaux vivant dans l’eau, sans se limiter aux poissons.
- source_word: ἐπιθυμοῦντες
  choice: bien que nous désirions
  rationale: La valeur concessive ressort du contraste avec « nous nous en abstenons » et reconnaît la réalité du désir.
- source_word: ὀρνέων
  choice: oiseaux
  rationale: Équivalent courant et non archaïque du nom grec.
- source_word: τετραπόδων
  choice: quadrupèdes
  rationale: Terme français précis et intelligible pour les animaux à quatre pieds, qui conserve la catégorie grecque.
- source_word: παντοίων βρωμάτων
  choice: toutes sortes d’aliments
  rationale: Cette formulation rend la portée générale et s’intègre naturellement à l’apposition explicative.
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: qui nous sont interdits par la Loi
  rationale: Rend clairement l’interdiction alimentaire établie conformément à la Loi; la majuscule indique ici la Loi mosaïque dans le contexte juif.
- source_word: ἀπέχομεθα
  choice: nous nous en abstenons
  rationale: Le pronom reprend les aliments mentionnés et le verbe exprime exactement le renoncement volontaire.
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: en raison de la maîtrise exercée par la raison
  rationale: La formulation explicite que la raison exerce une puissance de domination, plutôt que de suggérer principalement sa propre maîtrise de soi.
theological_decisions:
- issue: Sens de λόγισμος dans l’argument philosophique et théologique de 4 Maccabées
  choice: la raison
  alternative: le jugement rationnel
  rationale: « La raison » conserve le terme clé de l’ouvrage dans une langue concise, sans réduire sa portée au simple intellect; le contexte montre qu’il s’agit d’une raison disciplinée et formée par la Loi.
- issue: Rapport exprimé par ἐπικράτεια entre la raison et les désirs
  choice: la maîtrise exercée par la raison
  alternative: la suprématie de la raison
  rationale: Le choix maintient l’affirmation centrale selon laquelle la raison domine les désirs, tout en évitant de préciser au-delà du grec la manière exacte dont cette domination s’exerce.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue progression argumentative du grec, avec des tirets pour rendre lisible l’apposition. « Quadrupèdes » est précis sans être excessivement technique; « Loi » est employé au sens de la Loi mosaïque.
