  text: But prudence is the most sovereign of all, and from it reason indeed gains mastery over the passions.
translation:
  language: fr
  text: Mais la sagesse pratique est souveraine entre toutes, et c’est d’elle que la raison tire la maîtrise des passions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυριωτάτη
  choice: souveraine
  rationale: Le superlatif exprime l’autorité ou la prééminence suprême; « souveraine » conserve cette force dans un français digne et naturel.
- source_word: φρόνησις
  choice: sagesse pratique
  rationale: Dans ce contexte philosophique, φρόνησις désigne le discernement appliqué à la conduite plutôt que la simple prudence au sens de précaution.
- source_word: λογισμός
  choice: raison
  rationale: « Raison » rend ici la faculté rationnelle qui gouverne les passions, conformément à l’argument du livre.
- source_word: παθῶν
  choice: passions
  rationale: « Passions » conserve le sens philosophique d’affections ou d’impulsions subies, sans les réduire aux seules émotions.
- source_word: ἐπικρατεῖ
  choice: tire sa maîtrise sur
  rationale: Cette tournure exprime la domination effective de la raison tout en rattachant explicitement cette capacité à la sagesse pratique.
theological_decisions:
- issue: Rapport entre la sagesse pratique et la maîtrise rationnelle des passions
  choice: « c’est d’elle que la raison tire sa maîtrise »
  alternative: « grâce à elle, la raison maîtrise les passions »
  rationale: Le choix conserve la relation d’origine marquée par ἐξ ἧς et évite de simplifier le texte en une relation seulement instrumentale.
