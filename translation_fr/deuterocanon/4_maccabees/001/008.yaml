  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: fr
  text: Mais je pourrais le démontrer bien davantage encore par la vaillance d’Éléazar, des sept frères et de leur mère, qui sont morts pour la vertu.
