lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: Mais… bien davantage encore
  rationale: Rend la forte progression comparative du grec tout en gardant une tournure française naturelle.
- source_word: ἀποδείξαιμι
  choice: je pourrais le démontrer
  rationale: Préserve la valeur potentielle de l’optatif et le sens argumentatif de « démontrer ».
- source_word: ἀνδραγαθείας
  choice: vaillance
  rationale: Exprime ici le courage noble et exemplaire manifesté face à la mort, sans limiter le terme à la seule bravoure physique.
- source_word: ὑπὲρ ἀρετῆς
  choice: pour la vertu
  rationale: Traduction concise qui conserve la portée morale générale de ἀρετή et l’idée d’une mort consentie en sa faveur.
- source_word: ἑπτὰ ἀδελφῶν
  choice: des sept frères
  rationale: Dans ce contexte familial, « frères » restitue naturellement ἀδελφῶν.
theological_decisions:
- issue: Portée de ἀρετή
  choice: la vertu
  alternative: la fidélité à la Loi
  rationale: Le grec dit explicitement ἀρετή. Une explicitation en « fidélité à la Loi » réduirait la portée philosophique du propos et importerait une interprétation contextuelle dans le texte.
