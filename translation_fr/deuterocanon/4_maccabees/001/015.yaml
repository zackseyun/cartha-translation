  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
translation:
  language: fr
  text: Ainsi donc, la raison est un esprit qui, avec une vie droite, donne la préférence à la parole de la sagesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le principe de la sagesse » ou « le discours de la sagesse ». Le grec λόγος peut signifier « parole », « discours », « exposé raisonné » ou « principe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  choice: la raison
  rationale: Dans cette définition philosophique, le terme désigne la faculté de délibération rationnelle. « La raison » est naturel et conserve la portée conceptuelle du grec.
- source_word: νοῦς
  choice: un esprit
  rationale: Le mot désigne ici la faculté mentale. « Esprit » convient à une définition générale sans imposer le registre plus technique d’« intellect ».
- source_word: μετὰ ὀρθοῦ βίου
  choice: dans une vie droite
  rationale: La tournure associe la raison à une manière de vivre moralement droite. « Dans une vie droite » rend l’accompagnement exprimé par μετά tout en restant idiomatique en français.
- source_word: προτιμῶν
  choice: qui donne la préférence à
  rationale: Le participe exprime une préférence active. Cette formulation garde explicitement la valeur comparative du verbe grec.
- source_word: τὸν σοφίας λόγον
  choice: la parole de la sagesse
  rationale: « Parole » conserve l’ouverture sémantique de λόγος, qui peut désigner une parole, un discours, un exposé raisonné ou un principe, sans trancher excessivement le sens.
theological_decisions:
- issue: Rendre la définition éthique et philosophique sans surdéterminer λόγος
  choice: la parole de la sagesse
  alternative: le discours de la sagesse ; le principe de la sagesse
  rationale: Le grec reste susceptible de plusieurs nuances. La traduction principale préserve cette tension et la note signale les principales possibilités sans importer un sens philosophique ou doctrinal plus tardif.
translation_notes:
  register: Français international moderne, digne et accessible. La structure définitoire du grec est conservée, tandis que « Ainsi donc » rend la transition fortement marquée par μὲν δὴ τοίνυν.
