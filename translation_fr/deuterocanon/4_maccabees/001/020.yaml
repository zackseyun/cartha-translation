base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/020.yaml
  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: fr
  text: Les deux catégories les plus englobantes parmi les passions sont le plaisir et la douleur[a] ; chacune est aussi naturellement liée à l’âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les deux natures les plus englobantes des passions sont le plaisir et la douleur. » La formulation grecque est condensée ; φύσεις peut être rendu plus littéralement par « natures » plutôt que par « catégories ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθῶν
  choice: des passions
  rationale: Dans ce contexte philosophique, πάθος désigne les mouvements affectifs ou passions, et non simplement les souffrances.
- source_word: φύσεις
  choice: catégories
  rationale: Bien que φύσεις signifie littéralement « natures », le propos classe ici les passions sous deux grandes rubriques. « Catégories » exprime clairement cette valeur taxinomique.
- source_word: περιεκτικώταται
  choice: les plus englobantes
  rationale: Le superlatif désigne les catégories qui embrassent ou comprennent le plus largement les autres passions.
- source_word: ἡδονή τε καὶ πόνος
  choice: le plaisir et la douleur
  rationale: Ce couple antithétique est usuel dans le discours éthique grec ; « douleur » rend ici πόνος plus naturellement que « peine » ou « effort ».
- source_word: ἑκάτερον
  choice: l’un comme l’autre
  rationale: 'Cette formulation française conserve la valeur distributive : chacun des deux éléments précédemment nommés.'
- source_word: περὶ τὴν ψυχὴν πέφυκεν
  choice: se rapporte aussi, par nature, à l’âme
  rationale: La tournure rend l’état naturel exprimé par πέφυκεν et la relation assez générale indiquée par περὶ, sans transformer celle-ci en localisation précise.
theological_decisions:
- issue: Sens anthropologique de ψυχή
  choice: âme
  alternative: vie ; être intérieur
  rationale: Dans ce développement philosophique sur les passions, ψυχή désigne l’intériorité humaine plutôt que la seule vie biologique. « Âme » conserve le terme anthropologique traditionnel sans préciser davantage sa nature.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde la classification philosophique du grec ainsi que la relation volontairement générale entre ces passions et l’âme.
