  yaml_path: translation/deuterocanon/4_maccabees/001/029.yaml
  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
translation:
  language: fr
  text: À l’égard de chacune d’elles, la raison à l’œuvre en tout[a], qui purifie à fond, élague, entrelace, arrose et transforme de toutes les manières[b], dompte les matières premières des caractères et des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la raison qui agit de toutes les manières ». L’adjectif grec est rare et souligne l’efficacité globale de la raison.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec accumule des verbes évoquant différents travaux manuels et de culture : purifier, élaguer, entrelacer, arroser et transformer. Cette série présente la raison comme façonnant la matière intérieure de la personne.'
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: Pour chacun d’eux
  rationale: La tournure rend la valeur distributive de ἕκαστος et le renvoi du relatif à ce qui précède, tout en évitant une syntaxe française artificielle.
- source_word: ὁ πανεγώργος λογισμός
  choice: la raison à l’œuvre en tout
  rationale: λόγισμός désigne ici la faculté rationnelle qui gouverne les passions. L’expression conserve la force active et globale de l’adjectif rare πανεγώργος.
- source_word: περικαθαίρων
  choice: qui purifie à fond
  rationale: Le préfixe περι- donne ici à l’action une portée complète ou intensive.
- source_word: ἀποκνίζων
  choice: élague
  rationale: Le verbe évoque l’enlèvement de ce qui est superflu ou rugueux; « élague » s’accorde avec les images de façonnage et de culture.
- source_word: περιπλέκων
  choice: entrelace
  rationale: Le choix conserve l’image concrète d’un travail qui enroule ou tresse la matière.
- source_word: ἐπάρδων
  choice: redresse
  rationale: « Redresse » exprime le mouvement vers le haut tout en s’intégrant naturellement à la série d’actions formatrices.
- source_word: πάντα τρόπον μεταχέων
  choice: transforme de toutes les manières
  rationale: La formulation traduit l’étendue de πάντα τρόπον et l’idée de refaçonner ou de couler autrement portée par μεταχέων.
- source_word: ἐξημεροῖ
  choice: dompte
  rationale: Le verbe signifie rendre doux, apprivoiser ou civiliser; « dompte » maintient l’image d’une matière intérieure indocile soumise à la raison.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: les matières premières des caractères et des passions
  rationale: Le pluriel « matières premières » préserve la métaphore de ὕλη, matière à façonner. « Caractères » et « passions » maintiennent la distinction entre dispositions morales et mouvements affectifs.
theological_decisions:
- issue: Sens de λογισμός dans l’argument philosophique et théologique de 4 Maccabées
  choice: raison
  alternative: jugement rationnel
  rationale: « Raison » désigne clairement et sans ajout confessionnel la faculté qui gouverne les passions conformément à la piété dans l’argument du livre.
- issue: Sens de πάθη
  choice: passions
  alternative: émotions
  rationale: Dans ce contexte, le mot vise les mouvements affectifs ou impulsions intérieures soumis à la maîtrise rationnelle, et non des souffrances extérieures.
- issue: Rapport syntaxique de ὧν ἕκαστος avec la proposition
  choice: Pour chacun d’eux
  alternative: Chacun d’eux
  rationale: Le grec conserve un renvoi distributif à l’énumération précédente. La solution retenue préserve ce lien sans prétendre préciser un antécédent absent du verset ni produire une phrase française disloquée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue série verbale du grec est conservée, avec une syntaxe française fluide. Les images concrètes de façonnage sont maintenues sans les harmoniser en une seule métaphore.
