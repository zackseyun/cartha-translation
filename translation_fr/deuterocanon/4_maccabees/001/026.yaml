  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
translation:
  language: fr
  text: Contre l’âme se dressent l’arrogance, l’amour de l’argent, l’amour des honneurs, l’esprit de rivalité et l’envie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le mauvais œil » : le terme grec peut désigner une envie malveillante censée porter atteinte à autrui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μὲν ψυχῆς
  choice: Contre l’âme se dressent
  rationale: κατά avec le génitif exprime ici une orientation hostile envers l’âme. L’ajout idiomatique « se dressent » permet de rendre cette relation en français naturel tout en préservant la portée adversative de la liste.
- source_word: ἀλαζονία
  choice: l’arrogance
  rationale: Le terme désigne une prétention orgueilleuse et fanfaronne. « Arrogance » est clair, actuel et convient à une liste de vices.
- source_word: φιλαργυρία
  choice: l’amour de l’argent
  rationale: Cette expression conserve la forme transparente du composé grec, littéralement l’amour de l’argent, sans l’élargir d’emblée à toute forme d’avidité.
- source_word: φιλοδοξία
  choice: l’amour des honneurs
  rationale: Le mot désigne l’attachement à l’honneur, à la réputation ou à la gloire. Le pluriel « honneurs » est idiomatique en français et garde la valeur morale négative du contexte.
- source_word: φιλονεικία
  choice: l’esprit de rivalité
  rationale: Le terme évoque une disposition à rivaliser, contester et provoquer des querelles. « Esprit de rivalité » est naturel et rend cette disposition durable.
- source_word: βασκανία
  choice: l’envie
  rationale: Dans cette liste de vices, « envie » rend clairement le sens principal, tandis que la nuance culturelle du mauvais œil ou de la malveillance envieuse est conservée en note.
