base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/032.yaml
  text: Among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
translation:
  language: fr
  text: Parmi les désirs, les uns sont de l’âme et les autres du corps ; et il apparaît que la raison domine les uns comme les autres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et la raison l’emporte manifestement sur les deux catégories. »'
    reason: Alternative lexicale et syntaxique pour ἐπικρατεῖ φαίνεται.
lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: désirs
  rationale: « Désirs » conserve la portée générale du terme grec et convient à la classification philosophique du passage sans lui imposer un sens exclusivement négatif.
- source_word: ψυχικαί
  choice: de l’âme
  rationale: Ce choix préserve la catégorie anthropologique grecque et son opposition explicite à ce qui relève du corps, sans la réduire au seul domaine mental.
- source_word: σωματικαί
  choice: du corps
  rationale: Cette formulation naturelle répond parallèlement à « de l’âme » et rend clairement la distinction du texte.
- source_word: λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, le terme désigne la faculté rationnelle ou le jugement raisonné ; « la raison » est concis, courant et adapté à l’argument philosophique.
- source_word: ἐπικρατεῖ
  choice: domine
  rationale: Le verbe exprime la supériorité effective, la maîtrise ou le fait de l’emporter. « Domine » rend cette force sans introduire de vocabulaire doctrinal ultérieur.
- source_word: φαίνεται
  choice: il apparaît que
  rationale: Cette tournure conserve la valeur de manifestation ou de constat portée par le grec, tout en laissant ouverte la nuance entre apparence argumentative et évidence.
theological_decisions:
- issue: Distinction anthropologique entre ψυχικαί et σωματικαί
  choice: les désirs « de l’âme » et ceux « du corps »
  alternative: les désirs psychiques et les désirs physiques
  rationale: Le verset propose une classification philosophique sans développer ni définir ici un dualisme doctrinal. La traduction maintient les catégories du grec sans les accentuer.
- issue: Portée de λογισμὸς ἐπικρατεῖ φαίνεται
  choice: « il apparaît que la raison domine »
  alternative: « la raison l’emporte manifestement »
  rationale: Le choix principal exprime la maîtrise de la raison tout en rattachant explicitement φαίνεται à l’ensemble de l’affirmation. L’alternative, signalée en note, met davantage l’accent sur le caractère manifeste du constat.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « les uns… les autres » reprend nettement les deux catégories, tandis que la note préserve l’autre manière naturelle de rendre la relation entre ἐπικρατεῖ et φαίνεται.
