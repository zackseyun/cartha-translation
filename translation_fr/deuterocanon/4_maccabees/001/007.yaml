  yaml_path: translation/deuterocanon/4_maccabees/001/007.yaml
  text: So then[b][a], from many angles and in many ways I could show you that devout reason is master of the passions.
translation:
  language: fr
  text: Ainsi donc, je pourrais vous montrer, de bien des côtés et sous divers angles[a], que la raison pieuse[b] est maîtresse des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bien des façons et de divers côtés ». Les deux adverbes grecs soulignent la multiplicité et la diversité des lignes d’argumentation.
    reason: lexical_alternative
  - marker: b
    text: Ou « la raison guidée par la piété ». Cette expression, centrale dans 4 Maccabées, associe la raison à la révérence envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν … καὶ ἀλλαχόθεν
  choice: sous bien des angles et de différentes manières
  rationale: Les deux adverbes coordonnés soulignent la diversité des points de départ ou des lignes d’argumentation. Cette formulation naturelle en français maintient leur effet cumulatif sans les réduire à une seule idée.
- source_word: ἔχοιμʼ ἂν
  choice: je pourrais
  rationale: L’optatif accompagné de ἄν exprime ici une possibilité; « je pourrais » en rend clairement et sobrement la valeur.
- source_word: ἐπιδεῖξαι
  choice: montrer
  rationale: Le verbe signifie montrer ou démontrer. « Montrer » convient au contexte argumentatif sans renforcer indûment le sens jusqu’à « prouver ».
- source_word: αὐτοκράτωρ
  choice: maîtresse
  rationale: Le terme exprime la pleine autorité ou la domination. Comme « raison » est féminin en français, « maîtresse des passions » conserve naturellement la métaphore de gouvernement.
- source_word: παθῶν
  choice: des passions
  rationale: Dans le cadre philosophique de 4 Maccabées, le mot désigne les mouvements affectifs et impulsions que la raison gouverne. « Passions » est plus précis ici que le terme général « émotions ».
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: Cette expression programmatique unit l’exercice de la raison à la révérence envers Dieu. « Raison pieuse » conserve de façon concise ses dimensions rationnelle et religieuse, sans introduire une explication absente du texte.
theological_decisions:
- issue: Traduction de l’expression programmatique ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison guidée par la piété
  rationale: La traduction retenue préserve le lien direct entre raison et piété ainsi que la concision du grec. L’alternative est plus explicite, mais elle pourrait laisser entendre que le texte énonce précisément un rapport de direction ou de causalité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la progression rhétorique du grec; « maîtresse des passions » maintient sa métaphore d’autorité.
