base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: fr
  text: Car la raison est le guide des vertus et la maîtresse des passions. Je montrerai donc d’abord, par les actes répressifs de la maîtrise de soi,[a] que la raison est souveraine sur les passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par les actes qui mettent un frein aux passions, propres à la maîtrise de soi ». Le grec exprime de manière dense les actes inhibiteurs de la maîtrise de soi; il ne désigne pas des actes qui feraient obstacle à celle-ci.'
    reason: Précise la relation syntaxique et sémantique de κωλυτικῶν τῆς σωφροσύνης ἔργων sans alourdir le texte.
lexical_decisions:
- source_word: λογισμός
  choice: la raison
  rationale: Dans le cadre philosophique de 4 Maccabées, le terme désigne la faculté rationnelle qui gouverne la conduite.
- source_word: ἡγεμών
  choice: dirige
  rationale: Rend naturellement l’idée de direction ou de conduite exercée sur les vertus, sans surcharger le français d’un titre nominal.
- source_word: αὐτοκράτωρ
  choice: maîtrise
  rationale: Exprime l’autorité souveraine de la raison sur les passions dans un français courant et digne.
- source_word: πάθη
  choice: les passions
  rationale: Conserve le terme philosophique traditionnel pour les affects ou impulsions.
- source_word: κωλυτικῶν τῆς σωφροσύνης ἔργων
  choice: des actes qui font obstacle à la maîtrise de soi
  rationale: 'Respecte le génitif objectif et le sens littéral de κωλυτικός : il s’agit d’actes qui entravent la maîtrise de soi, plutôt que d’actes de maîtrise de soi qui retiennent autre chose.'
- source_word: σωφροσύνη
  choice: la maîtrise de soi
  rationale: Dans ce contexte éthique, le terme renvoie à la modération et au contrôle de soi.
- source_word: αὐτοδέσποτος
  choice: exerce son propre pouvoir
  rationale: Préserve l’idée d’un pouvoir détenu et exercé par la raison elle-même, tout en évitant le peu naturel « autogouvernante sur ».
theological_decisions:
- issue: Portée du pouvoir de la raison sur les passions
  choice: « exerce son propre pouvoir sur les passions »
  alternative: « est souveraine sur les passions »
  rationale: La formulation retenue conserve l’élément αὐτο- et l’affirmation forte du texte sans introduire une souveraineté absolue de coloration théologique.
- issue: Rapport entre les actes et la maîtrise de soi
  choice: les actes font obstacle à la maîtrise de soi
  alternative: « les actes restrictifs de la maîtrise de soi »
  rationale: La syntaxe grecque indique le plus naturellement des actes qui empêchent la σωφροσύνη; l’alternative pourrait inverser le rapport logique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « la raison » est conservée pour la clarté argumentative. La ponctuation sépare les deux étapes du raisonnement grec.
