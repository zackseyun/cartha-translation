  yaml_path: translation/deuterocanon/4_maccabees/001/018.yaml
  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: fr
  text: Les formes de la sagesse sont la prudence, la justice[a], le courage et la maîtrise de soi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ». Ici, le contexte est une liste de vertus ; c’est pourquoi « justice » a été retenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴδεα
  choice: formes
  rationale: Le terme désigne ici les formes constitutives sous lesquelles la sagesse se manifeste. « Formes » reste proche du grec et convient au registre philosophique.
- source_word: καθεστᾶσιν
  choice: sont
  rationale: Dans cette construction énumérative, le verbe a une valeur copulative et indique une identité établie. « Sont » est naturel et fidèle.
- source_word: φρόνησις
  choice: prudence
  rationale: Dans cette liste de vertus, le mot désigne le jugement pratique avisé. « Prudence » conserve le sens et le registre philosophique classiques.
- source_word: δικαιοσύνη
  choice: justice
  rationale: Le contexte est celui des vertus cardinales grecques ; « justice » exprime donc mieux la catégorie éthique visée que « droiture », tout en laissant cette autre nuance en note.
- source_word: ἀνδρία
  choice: courage
  rationale: Il s’agit du terme classique désignant la vertu de courage. Ce choix est clair en français moderne et évite de surtraduire l’étymologie masculine du mot grec.
- source_word: σωφροσύνη
  choice: maîtrise de soi
  rationale: Le terme évoque la retenue disciplinée et la modération morale. « Maîtrise de soi » est plus immédiatement compréhensible aujourd’hui que « tempérance ».
theological_decisions:
- issue: Traduction de δικαιοσύνη dans une liste philosophique de vertus
  choice: justice
  alternative: droiture
  rationale: Le contexte immédiat présente les vertus cardinales plutôt qu’un enseignement spécifiquement axé sur la relation d’alliance ou la justification. « Justice » correspond donc mieux au sens éthique grec, tandis que « droiture » est conservé en note afin de préserver l’étendue sémantique biblique du terme.
translation_notes:
  register: Français international moderne, clair et digne. La formulation concise conserve la structure de la liste grecque et son registre éthique et philosophique.
