  yaml_path: translation/deuterocanon/4_maccabees/001/003.yaml
  text: if[a], then, reason is evidently able to prevail over the passions that hinder self-control, both gluttony and desire,
translation:
  language: fr
  text: si donc la raison se montre capable de dominer les passions qui font obstacle à la maîtrise de soi[a], notamment la gourmandise et le désir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les passions qui entravent ceux qui se maîtrisent ». La formulation grecque est condensée et peut se comprendre plus littéralement ainsi.'
    reason: Alternative syntaxique et lexicale pour τῶν σωφρονούντων.
lexical_decisions:
- source_word: εἰ ἄρα
  choice: si donc
  rationale: Conserve à la fois la valeur conditionnelle de εἰ et la nuance déductive ou connective de ἄρα, dans une tournure française naturelle.
- source_word: τῶν σωφρονούντων
  choice: qui font obstacle à la maîtrise de soi
  rationale: La construction grecque est condensée et difficile. Cette formulation rattache fonctionnellement σωφροσύνη aux passions qui l’entravent, tout en signalant en note la lecture plus formelle.
- source_word: κωλυτικῶν παθῶν
  choice: les passions qui font obstacle
  rationale: κωλυτικός exprime ce qui empêche ou entrave; πάθη désigne ici les passions ou impulsions.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement raisonné; « la raison » en restitue clairement la portée philosophique.
- source_word: φαίνεται ἐπικρατεῖν
  choice: se montre capable de dominer
  rationale: La formule rend la valeur démonstrative de φαίνεται et la supériorité exprimée par ἐπικρατεῖν, sans réduire le propos à une simple apparence incertaine.
- source_word: γαστριμαργίας
  choice: la gourmandise
  rationale: Le terme désigne l’excès dans l’appétit, spécialement alimentaire. « Gourmandise » est l’équivalent français traditionnel et intelligible ici.
- source_word: ἐπιθυμίας
  choice: le désir
  rationale: ἐπιθυμία possède un sens large de désir ou de convoitise; le contexte immédiat ne justifie pas de le restreindre au désir sexuel.
theological_decisions:
- issue: Sens philosophique et anthropologique de λογισμός
  choice: la raison
  alternative: le jugement rationnel; la faculté rationnelle
  rationale: Le passage affirme la prééminence de la raison disciplinée sur les passions. « La raison » préserve cette thèse sans lui imposer une terminologie philosophique ou confessionnelle ultérieure.
- issue: Rapport syntaxique de τῶν σωφρονούντων avec κωλυτικῶν παθῶν
  choice: compris fonctionnellement comme la maîtrise de soi à laquelle les passions font obstacle
  alternative: « les passions qui entravent ceux qui se maîtrisent » ou, plus littéralement, « les passions faisant obstacle des gens maîtres d’eux-mêmes »
  rationale: Le grec transmis est fortement condensé et permet difficilement une formulation française à la fois littérale et limpide. Le texte principal explicite le sens contextuel probable; la note conserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par une virgule, conformément au caractère conditionnel du fragment grec et à sa continuation contextuelle. « Maîtrise de soi » rend clairement l’idée de σωφροσύνη, tandis que « gourmandise » et « désir » conservent la portée générale des exemples.
