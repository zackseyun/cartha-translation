base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: fr
  text: Il m’incombe donc de louer les hommes qui, en ce temps-là, sont morts avec leur mère pour la noblesse et la bonté[a] et, quant aux honneurs, de les déclarer bienheureux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la vertu ». Le grec καλοκἀγαθία réunit les idées de noblesse et de bonté ou d’excellence morale.
    reason: lexical_alternative
  - marker: b
    text: La formule grecque finale est très condensée; elle semble indiquer qu’au-delà de louer leurs vertus, l’orateur leur rend aussi l’honneur de les déclarer bienheureux.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεστί μοι
  choice: Il m’incombe
  rationale: L’expression impersonnelle marque une obligation ou une responsabilité assignée; cette tournure conserve le ton soutenu de l’exorde tout en restant naturelle en français.
- source_word: ἐπαινεῖν
  choice: de louer
  rationale: Rend directement l’action d’exalter publiquement les vertus des martyrs, sans amplification.
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: les hommes qui ... sont morts
  rationale: La proposition relative traduit naturellement le participe grec, tandis que « hommes » conserve la référence masculine explicite aux fils.
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: en ce temps-là
  rationale: L’expression renvoie à la période historique dont parle l’auteur; « en ce temps-là » est idiomatique et évite l’ambiguïté temporelle de « maintenant ».
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: pour la noblesse et la bonté
  rationale: καλοκἀγαθία unit les notions de noblesse et de bonté ou excellence morale. Le doublet français laisse percevoir les deux composantes de cet idéal éthique.
- source_word: μετὰ τῆς μητρός
  choice: avec leur mère
  rationale: Le contexte identifie ces hommes comme les fils morts avec leur mère; le possessif explicite naturellement ce rapport en français.
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: et, quant aux honneurs, de les déclarer bienheureux
  rationale: La formule grecque est elliptique et difficile. Cette traduction conserve la distinction rhétorique entre l’éloge de leurs vertus et l’honneur consistant à proclamer leur bonheur, sans masquer la compression du texte.
theological_decisions:
- issue: Sens de καλοκἀγαθία dans le contexte du martyre
  choice: la noblesse et la bonté
  alternative: la vertu; l’excellence morale
  rationale: Le terme relève de l’idéal moral hellénistique et associe qualité noble et bonté éthique. Le doublet évite d’en faire prématurément un terme théologique technique.
- issue: Référence masculine de ἄνδρας
  choice: les hommes
  alternative: ceux; les personnes
  rationale: Le grec désigne explicitement les fils par un nom masculin; la traduction ne neutralise donc pas cette référence.
- issue: Portée de μακαρισμός
  choice: les déclarer bienheureux
  alternative: les honorer d’une bénédiction; les proclamer heureux
  rationale: μακαρισμός désigne ici l’action de tenir ou proclamer quelqu’un bienheureux, non l’acte de lui conférer une bénédiction. « Bienheureux » maintient la portée religieuse et honorifique sans préciser davantage leur état.
translation_notes:
  register: Français international moderne, digne et soutenu sans archaïsme. La construction rhétorique du grec est conservée autant que le permet une syntaxe française claire; la difficulté de la proposition finale est signalée en note.
