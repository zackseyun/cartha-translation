  text: and[a], in relation to the body, omnivorousness and gluttony and eating alone.
translation:
  language: fr
  text: et, en ce qui concerne le corps, le fait de manger de tout, la gloutonnerie et le fait de manger seul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fait de ne manger qu’une seule sorte d’aliment » ou « un régime composé d’un seul type d’aliment ». Le grec μονοφαγία permet ce sens plus littéral d’après les éléments qui le composent, bien que « manger seul » convienne bien au contexte de cette liste de vices.
    reason: Alternative lexicale reflétant une ambiguïté réelle du grec.
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: et, en ce qui concerne le corps
  rationale: κατά avec l’accusatif indique ici le domaine auquel se rapportent les comportements énumérés. « En ce qui concerne le corps » garde cette fonction classificatoire; δέ assure la liaison avec le contexte précédent.
- source_word: παντοφαγία
  choice: le fait de manger de tout
  rationale: Le composé désigne l’habitude de manger toutes sortes de choses. Cette formulation est plus immédiatement compréhensible en français moderne que « omnivorisme » et ne la confond pas avec la seule consommation excessive.
- source_word: λαμαργία
  choice: la gloutonnerie
  rationale: Le mot désigne l’avidité ou l’excès dans la nourriture. « Gloutonnerie » est le terme français courant et précis dans une liste de vices.
- source_word: μονοφαγία
  choice: le fait de manger seul
  rationale: Dans cette liste éthique, le sens social de manger à l’écart ou pour soi-même est plausible. La composition du mot permet toutefois aussi le sens de ne manger qu’une seule sorte d’aliment, conservé en note.
theological_decisions:
- issue: Sens de μονοφαγία
  choice: le fait de manger seul
  alternative: le fait de ne manger qu’une seule sorte d’aliment
  rationale: Le contexte d’une liste de comportements corporels favorise probablement l’interprétation d’une pratique alimentaire solitaire et antisociale, mais la morphologie grecque laisse subsister l’autre lecture; l’ambiguïté est donc explicitement préservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure ternaire de la liste grecque est maintenue, avec des formulations nominales naturelles; le terme technique rare « omnivorisme » est évité.
