revisions:
- from: Car les passions suscitées par les désirs sont contenues et repoussées par l’esprit maître de lui-même ; et tous les mouvements du corps sont gouvernés par la raison.[a]
  to: Car les passions liées aux désirs sont tenues en échec, refoulées par l’esprit maître de lui-même ; et tous les mouvements du corps sont animés d’émulation par la raison.[a]
  rationale: La révision rend plus directement la tension lexicale de φιλοτιμοῦνται, tout en conservant une phrase lisible. Elle distingue aussi plus nettement ἀντέχεται (« tenues en échec ») du participe ἀνακαμπτόμενα (« refoulées »), et évite de présenter comme certaine une relation causale que le génitif grec laisse plus ouverte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:03:14Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition restitue bien l’idée de passions retenues et ramenées en arrière par un esprit capable de maîtrise de soi. En revanche, « sont gouvernés » affaiblit nettement φιλοτιμοῦνται, verbe inhabituel qui conserve une nuance d’ardeur, d’émulation ou de recherche de l’honneur ; cette nuance ne devrait pas être reléguée entièrement à la note.
  naturalness: La révision proposée demeure naturelle en français international moderne. « Tenues en échec » et « refoulées » évitent la coordination un peu redondante de « contenues et repoussées ». « Animés d’émulation » rend explicitement l’étrangeté voulue du second membre sans devenir opaque.
  terminology: « Esprit maître de lui-même », « passions », « mouvements du corps » et « raison » sont appropriés au registre de la psychologie morale judéo-hellénistique. « Émulation » permet de refléter φιλοτιμοῦνται sans introduire une doctrine ultérieure.
  issues:
  - severity: medium
    issue: « sont gouvernés » pour φιλοτιμοῦνται
    rationale: Cette traduction rend l’idée contextuelle générale de direction rationnelle, mais elle efface la valeur lexicale distinctive du verbe, liée à l’ardeur et à l’honneur. La note ne compense pas pleinement cette perte dans le texte.
  - severity: low
    issue: « passions suscitées par les désirs »
    rationale: Le grec dit plus littéralement « les passions des désirs » ; « suscitées » est possible, mais pose une relation causale plus explicite. « Liées aux désirs » est plus sobre tout en restant français naturel.
  revised_text: Car les passions liées aux désirs sont tenues en échec, refoulées par l’esprit maître de lui-même ; et tous les mouvements du corps sont animés d’émulation par la raison.[a]
