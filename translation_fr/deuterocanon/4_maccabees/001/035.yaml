base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: fr
  text: Car les passions liées aux désirs sont tenues en échec, refoulées par l’esprit maître de lui-même ; et tous les mouvements du corps sont animés d’émulation par la raison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les mouvements du corps sont orientés vers l’honneur par la raison ». Le verbe grec, inhabituel ici, évoque le fait d’aspirer avec zèle ou de rechercher l’honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέχεται
  choice: sont contenues
  rationale: Le verbe exprime ici la résistance ou la retenue exercée sur les passions. « Sont contenues » indique qu’elles sont maîtrisées, non supprimées.
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: les passions suscitées par les désirs
  rationale: 'La formulation rend la relation génitive naturelle en français tout en conservant les deux niveaux de la psychologie morale grecque : les désirs et les passions qu’ils suscitent.'
- source_word: ὑπὸ τοῦ σώφρονος νοὸς
  choice: par l’esprit maître de lui-même
  rationale: σώφρων associe maîtrise de soi, mesure et santé du jugement. Cette expression française restitue ici sa dimension morale et intellectuelle.
- source_word: ἀνακαμπτόμενα
  choice: repoussées
  rationale: Le participe évoque littéralement ce qui est ramené ou courbé en arrière. « Repoussées » conserve l’image d’un mouvement arrêté et inversé.
- source_word: φιλοτιμοῦνται
  choice: sont gouvernés
  rationale: Le verbe, inhabituel avec les mouvements du corps comme sujet, signifie normalement aspirer avec zèle ou rechercher l’honneur. Dans ce contexte, « sont gouvernés » exprime clairement l’action directrice de la raison, tandis qu’une note préserve la valeur lexicale surprenante.
- source_word: κινήματα
  choice: mouvements
  rationale: « Mouvements » garde la portée assez large du grec, qui peut désigner aussi bien des motions corporelles que des impulsions.
- source_word: λογισμοῦ
  choice: la raison
  rationale: Terme central de l’argument du livre, λογισμός désigne ici la faculté de raisonner et le jugement rationnel. « La raison » est précis, naturel et philosophiquement approprié.
theological_decisions:
- issue: Psychologie morale et maîtrise des passions
  choice: La raison contient les passions et gouverne les mouvements corporels.
  alternative: Expliciter ces passions comme des manifestations d’une « nature pécheresse ».
  rationale: Le grec emploie les catégories de la psychologie morale judéo-hellénistique. La traduction n’ajoute donc aucune catégorie doctrinale ultérieure et ne présente pas non plus les passions comme anéanties.
- issue: Valeur inhabituelle de φιλοτιμοῦνται
  choice: Employer « sont gouvernés » dans le texte et signaler en note le sens lié à l’honneur et à l’aspiration zélée.
  alternative: 'Traduire directement : « sont orientés vers l’honneur par la raison » ou « aspirent avec zèle sous l’action de la raison ».'
  rationale: La construction grecque est singulière et demeure sémantiquement tendue. Le texte principal reste intelligible, tandis que la note conserve l’autre lecture sans la trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Esprit maître de lui-même » évite le tour technique « intellect tempérant », tandis que « mouvements du corps » préserve l’étendue de l’expression grecque. La ponctuation maintient les deux propositions coordonnées du verset.
