  text: Therefore[a], just as pleasure and pain are two growths of the body and the soul, many passions are offshoots of these[b];
translation:
  language: fr
  text: Ainsi donc, puisque le plaisir et la douleur sont deux plantes du corps et de l’âme[a], les passions en sont de nombreux rejetons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux pousses du corps et de l’âme ». Le grec emploie une image végétale dans toute la phrase.
    reason: lexical_alternative
  - marker: b
    text: Ou « émotions » ou « mouvements affectifs » ; ici, le mot grec désigne les passions que la raison doit gouverner. Le terme rendu par « rejetons » prolonge l’image végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οὖν
  choice: Ainsi donc, de même que
  rationale: « Ainsi donc » conserve la continuité déductive marquée par οὖν, tandis que « de même que » introduit explicitement la comparaison de καθάπερ.
- source_word: δυοῖν
  choice: deux
  rationale: 'Le duel grec désigne précisément deux réalités : le plaisir et la douleur.'
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: du corps et de l’âme
  rationale: Les génitifs rattachent les deux pousses au corps et à l’âme. « Âme » rend directement ψυχή et maintient le cadre anthropologique du passage.
- source_word: φυτῶν
  choice: pousses
  rationale: Le terme signifie littéralement des plantes ou ce qui pousse. « Pousses » garde l’image végétale et prépare naturellement « ramifications ».
- source_word: ἡδονῆς τε καὶ πόνου
  choice: le plaisir et la douleur
  rationale: Cette paire française est directe, naturelle et bien établie dans le vocabulaire philosophique.
- source_word: τῶν παθῶν
  choice: passions
  rationale: Dans l’argument philosophique de l’ouvrage, πάθη désigne les passions ou mouvements affectifs que la raison doit gouverner.
- source_word: παραφυάδες
  choice: ramifications
  rationale: Le mot désigne des pousses latérales ou rejetons. « Ramifications » prolonge clairement la métaphore végétale et exprime la dérivation à partir du plaisir et de la douleur.
theological_decisions:
- issue: Sens anthropologique de ψυχή dans σώματος καὶ ψυχῆς
  choice: corps et âme
  alternative: corps et vie
  rationale: Le couple conceptuel formé avec σώματος et le contexte philosophique favorisent « âme ». Cette formulation préserve le cadre de l’auteur sans lui imposer une définition doctrinale ultérieure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore végétale est conservée par « pousses » et « ramifications ». La construction reste volontairement proche du raisonnement grec tout en étant naturelle en français.
