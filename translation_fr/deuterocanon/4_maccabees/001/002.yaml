base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: fr
  text: Car ce discours est en effet nécessaire pour la connaissance[a] et digne de la plus haute vertu — je veux dire la prudence[b] —, dont il contient l’éloge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la compréhension ». Le grec εἰς ἐπιστήμην peut exprimer l’une ou l’autre nuance.
    reason: lexical_alternative
  - marker: b
    text: Ou « sagesse pratique ». Le grec φρόνησις désigne le discernement moral appliqué à l’action.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: nécessaire
  rationale: Le terme exprime une nécessité, et non une simple utilité; « nécessaire » en conserve directement la force.
- source_word: εἰς ἐπιστήμην
  choice: à la connaissance
  rationale: ἐπιστήμη désigne ici une connaissance réfléchie ou méthodique. « À la connaissance » reste proche du grec, tandis que « à la compréhension » demeure possible.
- source_word: λόγος
  choice: discours
  rationale: Dans ce contexte rhétorique et philosophique, λόγος désigne le développement raisonné entrepris par l’auteur, plutôt qu’une parole isolée.
- source_word: τῆς μεγίστης ἀρετῆς
  choice: de la plus grande des vertus
  rationale: ἀρετή appartient au vocabulaire moral de la vertu ou de l’excellence. La formulation française marque naturellement le rang suprême attribué à cette vertu.
- source_word: φρονήσεως
  choice: prudence
  rationale: φρόνησις désigne le discernement moral et pratique. « Prudence » est le terme philosophique français usuel, sans réduire le mot à la simple circonspection.
- source_word: περιέχει ἔπαινον
  choice: contient un éloge
  rationale: La locution indique que le discours renferme une louange structurée de la vertu nommée; « un éloge » convient au registre rhétorique et reste naturel en français.
theological_decisions:
- issue: Rendre le vocabulaire philosophique de la vertu sans lui imposer des catégories doctrinales ultérieures
  choice: Employer « vertu » et « prudence » dans leur sens moral et philosophique
  alternative: Employer des termes plus larges comme « excellence » et « sagesse pratique »
  rationale: Le prologue de 4 Maccabées adopte un registre philosophique. Ces choix préservent son cadre conceptuel sans y introduire de contenu confessionnel supplémentaire.
- issue: Rapport syntaxique entre ἄξιος, τῆς μεγίστης ἀρετῆς et περιέχει ἔπαινον
  choice: Rendre l’ensemble par « contient un éloge de la plus grande des vertus »
  alternative: « contient un éloge digne de la plus grande vertu »
  rationale: La syntaxe grecque est serrée et permet d’entendre ἄξιος avec l’idée d’éloge. Le texte principal suit le sens contextuel le plus clair, centré sur la louange de la φρόνησις, sans développer une tournure française obscure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Car » conserve le lien argumentatif avec ce qui précède; « vraiment » rend la valeur insistante de καὶ γάρ. Le tiret met naturellement en relief l’explication « je veux dire la prudence ».
