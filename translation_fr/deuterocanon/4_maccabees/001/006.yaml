base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: fr
  text: En effet, la raison ne maîtrise pas ses propres passions[a], mais celles qui s’opposent à la justice[b], au courage, à la maîtrise de soi et à la prudence. Elle les maîtrise, non pour les supprimer, mais pour ne pas leur céder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses propres passions ». Le grec peut laisser entendre les passions propres à la personne dont la raison est la faculté directrice.'
    reason: ambiguïté du référent du pronom réfléchi
  - marker: b
    text: 'Ou : « à la droiture ».'
    reason: alternative lexicale pour δικαιοσύνη
lexical_decisions:
- source_word: λογισμός
  choice: la raison
  rationale: Terme philosophique central du livre, désignant la faculté de délibération rationnelle; « raison » est à la fois précis, naturel et concis en français.
- source_word: κρατεῖ
  choice: maîtrise / exerce sa maîtrise
  rationale: Le verbe exprime la domination ou l’ascendant exercé sur quelque chose. La variation française évite une répétition lourde tout en maintenant la métaphore directrice.
- source_word: πάθη
  choice: passions
  rationale: Dans ce contexte éthique, le mot désigne des mouvements affectifs ou impulsions, non des souffrances. « Passions » conserve le vocabulaire philosophique.
- source_word: τῶν τῆς δικαιοσύνης καὶ ἀνδρείας καὶ σωφροσύνης καὶ φρονήσεως ἐναντίων
  choice: celles qui s’opposent à la justice, au courage, à la maîtrise de soi et à la prudence
  rationale: Le féminin « celles » reprend naturellement « passions » et rend explicite la relation avec les quatre vertus sans ajouter une catégorie étrangère au texte.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans cette liste hellénistique de vertus, « justice » correspond mieux au cadre éthique que « droiture », tout en laissant cette dernière comme possibilité en note.
- source_word: ἀνδρείας
  choice: courage
  rationale: Équivalent moderne et non genré de la vertu grecque de bravoure ou de force morale.
- source_word: σωφροσύνης
  choice: maîtrise de soi
  rationale: Exprime clairement la discipline intérieure et la modération visées par le terme dans un contexte éthique.
- source_word: φρονήσεως
  choice: prudence
  rationale: Conserve le sens de sagesse pratique et le registre traditionnel d’une liste de vertus.
- source_word: καταλῦσαι
  choice: les supprimer
  rationale: Le verbe signifie défaire, abolir ou éliminer. « Supprimer » rend clairement l’idée sans suggérer une destruction physique.
- source_word: μὴ εἴξαι
  choice: ne pas leur céder
  rationale: Formulation française directe et idiomatique pour le refus de se laisser dominer par les passions.
theological_decisions:
- issue: Sens de δικαιοσύνη dans une liste hellénistique de vertus
  choice: justice
  alternative: droiture
  rationale: Le contexte associe le terme au courage, à la maîtrise de soi et à la prudence, ce qui favorise « justice » dans le cadre des vertus cardinales. « Droiture » reste sémantiquement possible et est signalé en note.
- issue: Référent du réfléchi ἑαυτοῦ
  choice: ses propres passions, avec maintien de l’ambiguïté
  alternative: les passions propres à la personne
  rationale: Grammaticalement, le réfléchi se rattache le plus directement à « la raison », mais l’expression est conceptuellement tendue et peut viser les passions de l’être humain dont la raison est la faculté directrice. Le texte principal conserve le réfléchi au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La seconde phrase explicite le sujet « elle » et reprend la notion de maîtrise afin de rendre en français la construction elliptique grecque, sans résoudre l’ambiguïté portant sur « ses propres passions ».
