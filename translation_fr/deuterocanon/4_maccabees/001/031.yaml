  text: Self-control, then, is mastery over desires.
translation:
  language: fr
  text: La maîtrise de soi est donc la maîtrise des désirs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: maîtrise de soi
  rationale: Dans cette définition éthique, le terme désigne la vertu qui gouverne les impulsions et les désirs. « Maîtrise de soi » est naturel en français moderne et convient mieux ici que « tempérance », plus étroit ou vieilli, ou « prudence », qui déplace le sens.
- source_word: δὴ τοίνυν
  choice: donc
  rationale: L’association des particules marque une transition conclusive avec une légère insistance. « Donc » rend clairement cette articulation sans alourdir la phrase.
- source_word: ἐστὶν
  choice: est
  rationale: Copule simple employée dans une définition formelle.
- source_word: ἐπικράτεια
  choice: domination
  rationale: Le nom exprime le fait de prévaloir sur quelque chose ou d’exercer sur lui son autorité. « Domination » conserve cette force, tandis que répéter « maîtrise » produirait une formulation moins élégante en français.
- source_word: τῶν ἐπιθυμιῶν
  choice: des désirs
  rationale: Le génitif indique ce sur quoi s’exerce la domination. « Désirs » garde ici le sens éthique général du grec, sans le restreindre aux convoitises ou aux passions.
