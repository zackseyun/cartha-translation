base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: fr
  text: Comment donc, diraient peut-être certains, si la raison maîtrise les passions, ne domine-t-elle pas aussi l’oubli et l’ignorance ? En essayant de dire cela, ils se rendent ridicules.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est ridicule d’essayer de dire cela. » La construction grecque peut présenter le jugement de façon impersonnelle ou l’appliquer aux objecteurs eux-mêmes.'
    reason: Lecture alternative de γελοῖον ἐπιχειροῦντες λέγειν.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Comment donc
  rationale: Introduit sous forme interrogative une objection dans le fil de l’argumentation, sans expliciter davantage que le grec.
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: diront peut-être certains
  rationale: Rend naturellement en français l’objection éventuelle exprimée par ἴσως avec l’optatif et ἄν, tout en conservant le caractère indéfini des interlocuteurs.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans l’argument philosophique de 4 Maccabées, πάθη désigne les passions ou impulsions que la raison est appelée à gouverner, et non ici des souffrances subies.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Désigne la faculté de délibération rationnelle au cœur de la thèse du livre. « La raison » est précis, concis et naturel en français.
- source_word: κρατεῖ
  choice: maîtrise
  rationale: Exprime l’exercice d’un pouvoir sur les passions et convient au vocabulaire éthique du passage.
- source_word: λήθης καὶ ἀγνοίας
  choice: l’oubli et l’ignorance
  rationale: Reproduit directement les deux déficiences mentales nommées dans le grec, sans les interpréter davantage.
- source_word: οὐ δεσπόζει
  choice: ne domine-t-elle pas aussi
  rationale: « Dominer » conserve la force de δεσπόζω et permet de distinguer légèrement ce verbe de κρατέω. « Aussi » explicite en français la relation logique avec la proposition précédente.
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: En essayant de soutenir cela, ils se rendent ridicules
  rationale: Rattache le participe aux objecteurs implicites et restitue la tonalité polémique. « Soutenir » convient mieux qu’un simple « dire » à l’énoncé d’une objection argumentative.
theological_decisions:
- issue: Terminologie anthropologique et philosophique
  choice: Traduire λογισμός par « raison » et πάθη par « passions »
  alternative: « pensée rationnelle » et « émotions »
  rationale: Le couple retenu préserve le cadre philosophique constant du livre sans réduire les πάθη à toutes les émotions ni introduire une anthropologie confessionnelle particulière.
- issue: Portée de γελοῖον dans la construction participiale
  choice: 'Appliquer le ridicule aux objecteurs : « ils se rendent ridicules »'
  alternative: 'Construction impersonnelle : « il est ridicule d’essayer de soutenir cela »'
  rationale: Le participe pluriel ἐπιχειροῦντες se rattache naturellement aux personnes indéfinies qui viennent d’être évoquées, mais la formulation grecque permet une présentation impersonnelle du jugement ; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le vocabulaire « raison », « passions », « maîtrise » et « domine » maintient la dignité et la précision philosophique du passage, tandis que la question conserve le mouvement vivant d’une objection anticipée.
