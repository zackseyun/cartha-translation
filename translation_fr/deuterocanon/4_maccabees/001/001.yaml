base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: fr
  text: M’apprêtant à démontrer une thèse des plus philosophiques — à savoir si la raison pieuse est maîtresse absolue des passions[a] —, je vous conseillerais à juste titre de prêter volontiers attention à la philosophie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exerce une maîtrise souveraine sur les passions ».'
    reason: alternative_lexical
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: une démonstration des plus philosophiques
  rationale: λόγος désigne ici le propos argumenté que l’auteur va exposer, tandis que le superlatif φιλοσοφώτατον est rendu par la tournure française naturelle « des plus philosophiques ».
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: puisque je vais présenter
  rationale: La construction avec μέλλων exprime l’intention imminente; ἐπιδείκνυσθαι évoque une présentation visant à établir ou démontrer la thèse. Le nom « démonstration » porte ici cette dernière nuance.
- source_word: εἰ
  choice: si
  rationale: Dans cette interrogation indirecte, le français emploie naturellement « si », sans lui donner un sens conditionnel.
- source_word: αὐτόδεσποτός
  choice: est souveraine sur
  rationale: Le composé exprime une maîtrise indépendante et entière. « Souveraine sur » conserve cette force tout en restant idiomatique avec « les passions ».
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans le contexte philosophique hellénistique, πάθη désigne les passions ou mouvements affectifs soumis à la maîtrise de la raison.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: « Raison » rend la faculté rationnelle exprimée par λογισμός, et « pieuse » maintient la dimension religieuse de εὐσεβής sans la développer par interprétation.
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν ὀρθῶς
  choice: j’aurais raison de vous conseiller
  rationale: Cette formulation rend à la fois la courtoisie de l’optatif avec ἄν et l’évaluation exprimée par ὀρθῶς.
- source_word: ὅπως προθύμως προσέχητε
  choice: de prêter une attention empressée
  rationale: « Prêter attention » rend προσέχω, et « empressée » conserve l’idée de disposition ardente et volontaire portée par προθύμως.
- source_word: τῇ φιλοσοφίᾳ
  choice: à la philosophie
  rationale: La formulation directe conserve le cadre philosophique explicite donné par l’auteur.
theological_decisions:
- issue: Préserver ensemble les dimensions rationnelle et religieuse de εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison guidée par la piété
  rationale: La traduction retenue reste proche de la formulation grecque et ne précise pas artificiellement la relation entre raison et piété.
- issue: Exprimer la portée forte de αὐτόδεσποτος sans trancher au-delà du texte la nature exacte de cette maîtrise
  choice: est souveraine sur les passions
  alternative: est absolument maîtresse des passions
  rationale: « Souveraine sur » exprime la pleine autorité affirmée par le composé grec, tandis que la note conserve une autre analyse lexicale possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La période rhétorique du grec est conservée, avec des tirets pour rendre explicite la thèse annoncée sans transformer son interrogation indirecte en affirmation.
