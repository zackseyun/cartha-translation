  text: Desire comes before pleasure, and after pleasure, joy.
translation:
  language: fr
  text: Ainsi donc, avant le plaisir vient le désir, et après le plaisir, la joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία
  choice: désir
  rationale: Dans cette analyse des passions, « désir » rend naturellement le sens général de l’élan qui précède le plaisir, sans lui imposer ici une connotation nécessairement mauvaise.
- source_word: ἡδονή
  choice: plaisir
  rationale: Équivalent direct et courant, adapté au contraste temporel établi par le verset.
- source_word: χαρά
  choice: joie
  rationale: Rend directement l’état affectif qui suit le plaisir dans l’enchaînement décrit.
- source_word: πρὸ μὲν οὖν … μετὰ δὲ
  choice: Ainsi donc, avant… et après…
  rationale: Conserve l’articulation logique de οὖν et le parallélisme contrastif μὲν…δέ dans un français naturel.
- source_word: ἐστιν
  choice: vient
  rationale: Le présent existentiel grec est rendu idiomatiquement afin d’exprimer l’ordre dans lequel surviennent les affects; « il y a » serait plus formel mais moins fluide.
