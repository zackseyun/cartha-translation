review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend fidèlement les éléments essentiels : le comparatif (« encore plus admirables »), le courage et l’endurance, les tortionnaires, le renversement de la tyrannie contre la nation, la victoire sur le tyran et la purification de la patrie. Toutefois, « ils permirent ainsi que » affaiblit et reformule inutilement le rapport causal de αἴτιοι κατέστησαν et alourdit le résultat introduit par ὥστε.'
  naturalness: Le registre est globalement naturel et soutenu. Une formulation plus directe permet de conserver la longue articulation rhétorique du grec sans la redondance de « ils permirent ainsi que, grâce à eux ». « Ceux qui les torturaient » rend également le participe grec sans introduire une antériorité non nécessaire par le plus-que-parfait.
  terminology: « Courage », « endurance », « tyrannie », « nation », « tyran », « patrie » et « purifiée » conviennent au français international moderne et au registre élevé du passage. « Purifiée » maintient délibérément l’ambiguïté morale, rituelle et nationale de καθαρσθῆναι.
  issues:
  - severity: medium
    issue: La tournure « ils permirent ainsi que, grâce à eux, leur patrie soit purifiée » est causalement redondante et moins directe que le grec.
    rationale: αἴτιοι κατέστησαν exprime qu’ils devinrent la cause du renversement, et ὥστε introduit le résultat. « Ils furent la cause …, si bien que … fut purifiée par eux » restitue ces liens sans ajouter l’idée plus faible de simple permission.
  - severity: low
    issue: « Ceux qui les avaient torturés » impose une antériorité que le participe aoriste ne requiert pas dans ce contexte.
    rationale: Le grec désigne les agents des tortures; « ceux qui les torturaient » est idiomatique et ne surspécifie pas la chronologie.
