- from: 'Car ces hommes devinrent encore plus admirables, non seulement aux yeux de tous pour leur courage et leur endurance, mais aussi aux yeux de ceux qui les avaient torturés. Ils furent à l’origine du renversement de la tyrannie exercée contre la nation : en triomphant du tyran par leur endurance, ils permirent ainsi que, grâce à eux, leur patrie soit purifiée[a].'
