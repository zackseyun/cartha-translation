base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: fr
  text: 'Car ces hommes devinrent encore plus admirables, non seulement aux yeux de tous en raison de leur courage et de leur endurance, mais aussi aux yeux de ceux qui les torturaient. Ils furent la cause du renversement de la tyrannie contre la nation : ayant vaincu le tyran par leur endurance, ils firent en sorte que leur patrie soit purifiée par eux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nettoyée de toute souillure ». Le verbe grec peut évoquer une purification morale ou rituelle, ainsi qu’une restauration nationale.
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: encore plus admirables
  rationale: Le comparatif est conservé, et « admirables » exprime naturellement l’estime morale suscitée par leur conduite.
- source_word: ἀνδρίᾳ
  choice: courage
  rationale: Dans ce contexte, le terme désigne la vaillance plutôt que la masculinité au sens littéral.
- source_word: ὑπομονῇ
  choice: endurance
  rationale: Le même terme est employé aux deux occurrences afin de conserver le motif de la constance sous la souffrance.
- source_word: αἰκισαμένων
  choice: ceux qui les avaient torturés
  rationale: Le participe évoque les sévices brutaux infligés aux martyrs; « torturés » en restitue clairement la force.
- source_word: αἴτιοι κατέστησαν
  choice: ils furent à l’origine
  rationale: Cette expression française actuelle transmet l’idée qu’ils devinrent la cause du résultat qui suit.
- source_word: καταλυθῆναι
  choice: du renversement
  rationale: Appliqué à une tyrannie, le terme indique qu’elle est abattue ou supprimée.
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: la tyrannie exercée contre la nation
  rationale: « Exercée contre » explicite naturellement l’orientation hostile de κατά, tandis que « nation » conserve le sens collectif de ἔθνος.
- source_word: νικήσαντες τὸν τύραννον
  choice: en triomphant du tyran
  rationale: La tournure conserve l’image de victoire tout en exprimant le moyen par lequel le renversement s’est accompli.
- source_word: ὥστε καθαρσθῆναι
  choice: ils permirent ainsi que … soit purifiée
  rationale: La formulation rend la conséquence exprimée par ὥστε avec l’infinitif, sans la réduire à une simple intention.
- source_word: πατρίδα
  choice: leur patrie
  rationale: « Patrie » est le correspondant français naturel et soutenu de πατρίς; le possessif explicite le rapport à leur terre natale déjà inhérent au grec.
theological_decisions:
- issue: Nature de la purification de la patrie par les martyrs
  choice: soit purifiée
  alternative: soit délivrée; soit nettoyée de toute souillure
  rationale: « Purifiée » préserve les résonances politiques, morales et éventuellement rituelles du grec καθαρσθῆναι, sans imposer un mécanisme expiatoire précis qui n’est pas formulé dans ce seul verset.
translation_notes:
  register: Français international moderne, digne et rhétoriquement soutenu. La phrase grecque très longue est divisée en deux pour assurer sa lisibilité; les liens de cause, de moyen et de conséquence demeurent explicites.
