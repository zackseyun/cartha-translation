- source_word: θείων καὶ ἀνθρωπίνων πραγμάτων
  choice: des réalités divines et humaines
  rationale: « Réalités » exprime ici le sens large de πράγματα avec naturel et dignité, sans réduire le propos aux seules affaires pratiques.
- source_word: τῶν τούτων αἰτίων
  choice: de leurs causes
  rationale: Le démonstratif τούτων renvoie aux réalités divines et humaines; « causes » préserve le sens philosophique de αἴτια.
