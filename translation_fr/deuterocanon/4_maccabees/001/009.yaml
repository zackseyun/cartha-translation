  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: fr
  text: Car tous ceux-là, ayant méprisé la souffrance jusqu’à la mort[a], ont démontré que la raison l’emporte sur les passions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la souffrance qui va jusqu’à la mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le jugement raisonné a la maîtrise des passions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαντες … οὗτοι
  choice: tous ceux-ci
  rationale: Rend à la fois la totalité exprimée par ἅπαντες et la valeur démonstrative de οὗτοι, dont le référent est fourni par le contexte.
- source_word: πόνον
  choice: la souffrance
  rationale: Dans le contexte des supplices et de la mort, πόνος désigne la souffrance endurée plutôt que le travail ou l’effort.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: Conserve la portée extrême de l’expression grecque sans expliciter davantage que le texte le contexte du martyre.
- source_word: ὑπεριδόντες
  choice: ont méprisé
  rationale: Le verbe exprime le fait de regarder une chose comme négligeable ou de ne pas se laisser arrêter par elle. « Mépriser » garde la force de cette attitude, tout en restant idiomatique.
- source_word: ἐπεδείξαντο
  choice: ont démontré
  rationale: Le verbe présente leur conduite comme une preuve à l’appui de la thèse philosophique de l’ouvrage.
- source_word: περικρατεῖ
  choice: domine
  rationale: Exprime clairement la supériorité et la maîtrise exercées sur les passions, sans ajouter une notion étrangère au texte.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: « Passions » conserve le sens philosophique des affects et impulsions que la raison est appelée à maîtriser.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: Terme central de 4 Maccabées, λογισμός désigne ici la faculté de jugement rationnel et discipliné. « La raison » est concis, naturel et n’importe aucune catégorie théologique ultérieure.
theological_decisions:
- issue: Rendre le terme philosophique ὁ λογισμός sans lui imposer une catégorie théologique postérieure.
  choice: la raison
  alternative: le jugement raisonné
  rationale: Le passage affirme la maîtrise des passions par la faculté rationnelle disciplinée. « La raison » préserve cette thèse philosophique sans assimiler λογισμός à la révélation divine ou à la conscience.
- issue: Déterminer si le contexte du martyre doit être explicité dans ἕως θανάτου πόνον.
  choice: la souffrance jusqu’à la mort
  alternative: la souffrance qui va jusqu’à la mort
  rationale: Le grec indique l’extrémité de la souffrance, sans nommer expressément le martyre dans cette proposition. La formulation retenue laisse le contexte apporter cette précision.
- issue: Préserver la portée possible de ἕως θανάτου par rapport à la souffrance endurée.
  choice: jusqu’à la mort
  alternative: même au prix de la mort
  rationale: La construction grecque peut être comprise comme une souffrance poussée jusqu’à la mort ou comme une endurance qui ne recule pas devant la mort. Le texte principal reste proche de la forme grecque et la note signale l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement argumentatif du grec avec « Car » et « ont démontré ». « Passions » maintient le vocabulaire philosophique de l’ouvrage; les notes rendent visibles les principales nuances lexicales sans alourdir le texte.
