  source_fidelity: 'Le sens général est fidèle : le verset affirme que l’endurance de ces personnes face à la souffrance jusqu’à la mort démontre la supériorité du λογισμός sur les passions. Cependant, « même au prix de la mort » ne constitue pas une alternative suffisamment directe à ἕως θανάτου, qui qualifie la souffrance dans cette construction.'
  naturalness: « Tous ceux-ci » est grammatical, mais « tous ceux-là » est plus naturel en français moderne lorsque le démonstratif renvoie à des personnes ou exemples déjà mentionnés. La reprise de la participiale grecque par « ayant méprisé » rend également plus nettement la relation entre leur attitude et la démonstration qui suit.
  terminology: « La raison » et « les passions » rendent bien les termes philosophiques λογισμός et πάθη. « L’emporte sur » exprime naturellement περικρατεῖ sans atténuer l’idée de maîtrise supérieure.
