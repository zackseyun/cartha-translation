translation:
  language: fr
  text: Avant la douleur vient la peur ; après la douleur, la tristesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ
  choice: avant
  rationale: La préposition temporelle indique ce qui précède la douleur ; « avant » est l’équivalent français le plus direct et naturel.
- source_word: πόνου / πόνον
  choice: douleur
  rationale: πόνος peut désigner la peine, l’effort ou la souffrance ; dans cette brève succession entre peur préalable et tristesse ultérieure, « douleur » rend clairement le sens expérientiel.
- source_word: φόβος
  choice: peur
  rationale: « Peur » est le terme courant et neutre correspondant à φόβος, sans l’intensification qu’impliquerait « effroi ».
- source_word: μετὰ
  choice: après
  rationale: Avec l’accusatif, la préposition exprime ici la succession temporelle.
- source_word: λύπη
  choice: tristesse
  rationale: λύπη peut évoquer la tristesse, le chagrin ou l’affliction. « Tristesse » conserve une portée générale et naturelle, adaptée à la formulation aphoristique.
theological_decisions: []
translation_notes:
  register: Formulation brève, sentencieuse et actuelle. L’ajout idiomatique de « vient » dans le premier membre évite une tournure nominale raide en français, tout en préservant la succession temporelle et le parallélisme du grec.
