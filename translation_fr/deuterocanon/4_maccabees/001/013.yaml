  text: So then[a], let us examine whether reason is master over the passions.
translation:
  language: fr
  text: Examinons donc si la raison est maîtresse des passions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζητοῦμεν
  choice: Examinons
  rationale: Le présent à la première personne du pluriel introduit ici l’examen de la question. L’impératif inclusif français rend naturellement cette valeur délibérative.
- source_word: δὴ τοίνυν
  choice: donc
  rationale: La combinaison de particules marque une transition assortie d’une conséquence. « Donc » en restitue sobrement la force dans un français actuel.
- source_word: αὐτοκράτωρ
  choice: maîtrise
  rationale: Le terme exprime l’exercice d’une pleine autorité. La tournure verbale « maîtrise » est naturelle en français et conserve l’idée de domination sans connotation politique excessive.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans ce contexte moral hellénistique, πάθη désigne les passions ou mouvements affectifs soumis à la raison, et non simplement des émotions neutres.
- source_word: ὁ λογισμός
  choice: la raison
  rationale: λογισμός désigne ici la faculté ou l’exercice du jugement rationnel qui gouverne la thèse de l’ouvrage. « La raison » est précis, concis et idiomatique.
theological_decisions:
- issue: Sens philosophique et anthropologique de λογισμός dans son rapport aux πάθη
  choice: la raison maîtrise les passions
  alternative: le jugement rationnel exerce une autorité souveraine sur les passions
  rationale: La formulation retenue maintient l’affirmation centrale concernant le pouvoir directeur de la raison sur les passions, sans importer de catégories théologiques ultérieures ni réduire πάθη à de simples émotions.
translation_notes:
  register: Français international moderne, clair et digne. La phrase interrogative indirecte du grec est conservée. Aucun appel de note n’est nécessaire, puisque les principales nuances lexicales sont suffisamment rendues dans le texte.
