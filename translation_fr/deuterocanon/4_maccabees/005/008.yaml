base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: fr
  text: Car il est insensé de ne pas jouir des choses agréables qui sont sans reproche[a], et injuste de se détourner des bienfaits de la nature.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des plaisirs irréprochables ».'
    reason: Alternative lexicale pour τῶν χωρὶς ὀνείδους ἡδέων, qui peut être rendu soit par une expression développée, soit par une formule nominale condensée.
lexical_decisions:
- source_word: ἀνόητον
  choice: insensé
  rationale: Le terme exprime un manque de bon sens ou de discernement. « Insensé » conserve cette portée intellectuelle et morale dans un registre digne.
- source_word: ἀπολαύειν
  choice: jouir de
  rationale: Dans ce contexte, l’infinitif désigne le fait de goûter ou de profiter de ce qui est agréable. « Jouir de » rend directement cette idée.
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: des choses agréables qui sont sans reproche
  rationale: Cette formulation garde distinctement l’idée de plaisir exprimée par ἡδέων et la restriction morale de χωρὶς ὀνείδους, sans transformer la phrase en approbation générale de tout plaisir.
- source_word: ἄδικον
  choice: injuste
  rationale: Le mot porte un jugement éthique fort; « injuste » le conserve mieux que le plus général « mauvais ».
- source_word: ἀποστρέφεσθαι
  choice: se détourner de
  rationale: La forme moyenne évoque le fait de se détourner soi-même de quelque chose; cette traduction préserve l’image verbale grecque.
- source_word: τὰς τῆς φύσεως χάριτας
  choice: les bienfaits de la nature
  rationale: χάριτας désigne ici des avantages ou faveurs accordés par la nature. « Bienfaits » est naturel en français et évite les connotations théologiques que pourrait prendre « grâces ».
theological_decisions:
- issue: Caractérisation morale des plaisirs naturels
  choice: Le verset affirme qu’il existe des choses agréables moralement irréprochables dont on peut jouir.
  alternative: Rendre l’expression de façon plus condensée par « les plaisirs irréprochables ».
  rationale: Le grec qualifie explicitement les choses agréables par χωρὶς ὀνείδους. La traduction maintient à la fois leur caractère plaisant et la limite morale posée, sans faire du verset une approbation indistincte du plaisir.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation suit de près l’argument grec tout en restant immédiatement compréhensible; « bienfaits de la nature » évite une ambiguïté théologique indue autour de « grâces ».
