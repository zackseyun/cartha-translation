  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
translation:
  language: fr
  text: Mais si certains refusaient de manger des aliments qui rendent impur[a], qu’ils soient torturés sur la roue[b], puis mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de manger des aliments souillés » ou « de consommer une viande qui rend impur ». Le verbe grec exprime à lui seul l’idée de manger ce qui entraîne une souillure rituelle; aucun complément d’objet distinct n’est formulé ici.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rompus sur la roue ». Le participe grec désigne un supplice pratiqué au moyen d’une roue, sans en préciser ici toutes les modalités.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: Mais si certains
  rationale: Introduit un cas conditionnel supplémentaire. « Certains » rend naturellement l’indéfini pluriel τινες sans transformer la proposition en généralité absolue.
- source_word: μὴ θέλοιεν
  choice: refusaient
  rationale: Dans ce contexte de contrainte, « refusaient » exprime en français courant l’absence de volonté indiquée par θέλω, tout en gardant la valeur éventuelle du mode grec.
- source_word: μιεροφαγῆσαι
  choice: de manger des aliments qui rendent impur
  rationale: Le verbe composé désigne le fait de manger ce qui souille sur le plan rituel. L’objet n’étant pas exprimé séparément en grec, « aliments » est ajouté pour obtenir une formulation française naturelle sans préciser indûment qu’il s’agit de viande.
- source_word: τούτους
  choice: qu’ils
  rationale: Le pronom reprend les personnes mentionnées dans la condition; la tournure passive française évite une reprise lourde comme « que ceux-là ».
- source_word: τροχισθέντας
  choice: soient torturés sur la roue
  rationale: Le participe renvoie à un supplice infligé au moyen d’une roue. « Torturés sur la roue » reste précis sans imposer le détail plus interprétatif « rompus sur la roue ».
- source_word: ἀναιρεθῆναι
  choice: puis mis à mort
  rationale: Le verbe signifie ici faire périr. « Mis à mort » convient au ton de décret; « puis » explicite la relation naturelle entre le supplice et l’exécution, sans changer l’issue commandée.
theological_decisions:
- issue: Nature de la souillure exprimée par μιεροφαγῆσαι
  choice: aliments qui rendent impur
  alternative: aliments souillés / nourriture impure
  rationale: La formulation retenue conserve la force rituelle et active du verbe grec sans définir selon une tradition confessionnelle précise la catégorie des aliments concernés.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe claire adaptée au ton coercitif du décret. « Rendre impur » garde la dimension rituelle; « torture sur la roue » évite un archaïsme tout en restant historiquement concret.
