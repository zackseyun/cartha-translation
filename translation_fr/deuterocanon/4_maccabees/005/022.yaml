  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: fr
  text: Mais tu tournes notre philosophie en dérision, comme si nous ne vivions pas selon elle avec discernement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de manière raisonnable » ou « avec un jugement sain ». Le nom grec est rare et évoque ici une conduite fondée sur une saine réflexion.
    reason: lexical_alternative
lexical_decisions:
- source_word: χλευάζεις
  choice: tu tournes… en dérision
  rationale: Le verbe exprime la raillerie méprisante. Cette tournure française est naturelle et conserve la force de l’interpellation directe.
- source_word: φιλοσοφίαν
  choice: philosophie
  rationale: Le terme désigne ici la conception juive d’une vie gouvernée par la raison et la piété. Le conserver respecte la manière dont l’auteur présente lui-même cette voie de vie.
- source_word: ὥσπερ
  choice: comme si
  rationale: La conjonction introduit ici l’hypothèse dépréciative prêtée à l’interlocuteur.
- source_word: εὐλογιστίας
  choice: avec discernement
  rationale: Dans ce contexte, le nom rare se rattache au jugement bien raisonné ou à la saine réflexion. « Avec discernement » rend cette idée en français courant sans transformer le terme en simple bonheur subjectif.
- source_word: ἐν αὐτῇ βιούντων
  choice: nous ne vivions pas selon elle
  rationale: Littéralement, le grec évoque le fait de « vivre en elle ». En français, « vivre selon elle » exprime naturellement une existence conduite conformément à cette philosophie.
theological_decisions:
- issue: Sens de φιλοσοφία dans 4 Maccabées
  choice: Conserver « philosophie » dans le texte principal.
  alternative: « manière de vivre » ou « enseignement »
  rationale: L’auteur présente délibérément la piété juive comme une philosophie. Garder ce terme préserve son cadre rhétorique sans lui substituer une catégorie confessionnelle.
- issue: Sens de εὐλογιστίας
  choice: Rendre le terme par « avec discernement ».
  alternative: « de manière raisonnable » ou « avec un jugement sain » ; la consultation anglaise propose « dans le bonheur / la félicité ».
  rationale: La formation lexicale et la construction οὐ μετὰ εὐλογιστίας favorisent ici l’idée d’une conduite réfléchie ou raisonnable. La note conserve des équivalents possibles sans imposer la lecture moins probable de la félicité.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement conserve le singulier grec et le ton de confrontation. La phrase reste proche de la structure grecque tout en évitant le calque peu naturel « vivre en elle ».
