  text: C’est pourquoi, assurément, nous ne jugeons nullement bon de transgresser la loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit la conclusion tirée de l’argument précédent et conserve clairement la valeur inférentielle du grec.
- source_word: δὴ
  choice: vraiment
  rationale: Rend la valeur de renforcement de la particule sans alourdir excessivement l’énoncé.
- source_word: κατʼ οὐδένα τρόπον
  choice: en aucune manière
  rationale: Exprime la négation absolue de façon naturelle et digne en français.
- source_word: παρανομεῖν
  choice: transgresser la loi
  rationale: Rend le fait d’agir contrairement à la loi et maintient la portée juridique et morale du verbe.
- source_word: ἀξιοῦμεν
  choice: nous estimons qu’il convient
  rationale: Dans cette construction avec l’infinitif, le verbe exprime un jugement réfléchi sur ce qui est convenable ou juste.
theological_decisions:
- issue: Nature de la « loi » dans le contexte
  choice: la loi
  alternative: la Loi
  rationale: Le grec ne précise pas explicitement ici qu’il s’agit de la Loi mosaïque. Le contexte renvoie à la loi ancestrale juive, mais la minuscule préserve la formulation générique du verset sans imposer une identification typographique.
translation_notes:
  register: Français international moderne, clair et soutenu. La tournure « il ne convient en aucune manière de » conserve à la fois le jugement exprimé par ἀξιοῦμεν et la négation catégorique, tout en évitant une formulation française maladroite.
