  text: So do not suppose this to be a small sin[a], if we were to eat polluted food.
translation:
  language: fr
  text: Ne pense donc pas que ce serait un péché sans gravité[a] si nous venions à manger des aliments souillés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un petit péché, si nous mangions ce qui est impur ». Le verbe grec exprime en un seul mot le fait de manger une nourriture rendue impure ou profanée.'
    reason: 'Alternative lexicale et syntaxique : elle conserve plus littéralement l’adjectif grec « petit » et l’objet implicite du verbe, tout en maintenant la condition.'
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  choice: Ne considère donc pas
  rationale: νομίζω introduit ici un jugement d'appréciation; « considérer » rend naturellement l'avertissement de ne pas minimiser la faute. οὖν est rendu par « donc ».
- source_word: μικρὰν ... ἁμαρτίαν
  choice: un péché sans gravité
  rationale: L'expression française transmet directement l'idée d'un péché tenu pour petit ou peu grave, tout en conservant le lien explicite entre μικράν et ἁμαρτίαν.
- source_word: ταύτην
  choice: le fait que
  rationale: Le démonstratif annonce l'acte précisé par la proposition suivante. « le fait que » explicite ce rapport sans ajouter de contenu.
- source_word: εἰ
  choice: que nous mangions
  rationale: Dans cette construction, εἰ précise en quoi consisterait le péché envisagé. Le subjonctif français maintient la valeur éventuelle sans alourdir la phrase.
- source_word: μιεροφαγήσαμεν
  choice: nous mangions des aliments souillés
  rationale: Le verbe composé condense l'idée de manger ce qui est rendu impur ou profané. « aliments » est ajouté comme complément implicite, et « souillés » conserve la dimension religieuse de l'impureté.
theological_decisions:
- issue: Degré d'explicitation de l'impureté dans μιεροφαγήσαμεν
  choice: manger des aliments souillés
  alternative: manger ce qui est impur
  rationale: Le contexte concerne une consommation interdite pour des raisons de sainteté religieuse, et non une simple contamination matérielle. « souillés » garde cette portée tout en restant compréhensible; la note conserve l'autre formulation possible.
- issue: Rapport syntaxique de εἰ avec ταύτην ἁμαρτίαν
  choice: le fait que nous mangions
  alternative: si nous mangions
  rationale: Le grec peut être reproduit plus littéralement par une condition, mais la tournure française choisie présente naturellement la proposition comme l'acte désigné par « ce péché », sans trancher autrement la gravité morale affirmée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l'adresse au singulier du grec et évite un vocabulaire confessionnel spécialisé.
