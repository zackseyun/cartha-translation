    rationale: En français, cette expression peut évoquer une valeur positive ou commerciale plutôt que l’équivalence de force exprimée par ἰσοδύναμον. Une alternative qui conserve « revient au même » tout en variant παρανομεῖν est plus claire.
  - severity: low
