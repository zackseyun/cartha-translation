  text: For to break the law in small matters and in great matters is equivalent[a].
translation:
  language: fr
  text: Car enfreindre la Loi dans les petites choses comme dans les grandes revient au même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « transgresser la Loi dans les petites choses comme dans les grandes revient au même ».'
    reason: Alternative lexicale pour παρανομεῖν ; « transgresser » conserve la portée juridique et morale sans introduire l’ambiguïté de « même valeur ».
lexical_decisions:
- source_word: παρανομεῖν
  choice: désobéir à la Loi
  rationale: Le verbe signifie agir contrairement à la loi. « Désobéir à la Loi » est clair en français moderne et conserve ici la portée juridique et morale du terme.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: dans les petites choses comme dans les grandes
  rationale: Les adjectifs neutres substantivés opposent les choses de peu d’importance aux choses importantes. Cette formulation naturelle conserve l’antithèse concise du grec.
- source_word: ἰσοδύναμόν
  choice: revient au même
  rationale: L’adjectif exprime une égalité de force ou de valeur. « Revient au même » rend fermement l’équivalence affirmée sans préciser indûment qu’elle concernerait toutes les conséquences ou tous les degrés de gravité.
- source_word: γὰρ
  choice: Car
  rationale: « Car » garde la fonction explicative qui relie cette affirmation au raisonnement précédent.
theological_decisions:
- issue: Équivalence morale des violations mineures et majeures
  choice: Le verset affirme que désobéir à la Loi dans les petites choses comme dans les grandes revient au même.
  alternative: Toute désobéissance constitue une violation de la Loi, sans que toutes les violations soient nécessairement aussi graves sous tous les rapports.
  rationale: Le grec ἰσοδύναμόν ἐστιν formule une équivalence forte, mais n’en définit pas précisément l’étendue. La traduction conserve cette tension sans imposer une doctrine d’identité absolue des peines ou des conséquences.
translation_notes:
  register: Français international moderne, clair et digne. La majuscule à « Loi » indique qu’il s’agit ici de la loi religieuse en cause dans le contexte; la formulation demeure concise et garde la force de l’assertion grecque.
