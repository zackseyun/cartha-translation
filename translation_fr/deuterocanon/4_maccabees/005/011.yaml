  text: and you will scatter the nonsense of your reasonings[a], and, taking up a mind worthy of your age, you will philosophize about the truth of what is beneficial[b],
translation:
  language: fr
  text: et tu dissiperas le non-sens de tes raisonnements[a], et, en adoptant un esprit digne de ton âge, tu philosopheras sur la vérité de ce qui est avantageux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu chasseras la folie de tes pensées » ou « tu disperseras les sottises de tes arguments ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie « philosopher », c’est-à-dire se livrer à une réflexion philosophique ; le vocabulaire est ici intentionnellement philosophique et ne signifie pas seulement « réfléchir ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: tu dissiperas
  rationale: Le futur grec exprime l’action de disperser ou de chasser. « Dissiper » conserve l’image tout en s’employant naturellement en français avec des pensées confuses ou absurdes.
- source_word: τὸν λῆρον τῶν λογισμῶν
  choice: les absurdités de tes raisonnements
  rationale: λῆρος désigne ce qui est insensé, vain ou absurde, tandis que λογισμός peut désigner un raisonnement, une pensée ou un argument. Le pluriel français évite la tournure peu naturelle « l’absurdité de tes raisonnements » sans effacer la nuance intellectuelle.
- source_word: ἄξιον τῆς ἡλικίας
  choice: digne de ton âge
  rationale: Cette formulation reste proche du grec et évoque une disposition conforme au grand âge de l’interlocuteur, sans introduire explicitement la notion interprétative de maturité.
- source_word: ἀναλαβὼν νοῦν
  choice: adoptant une manière de penser
  rationale: ἀναλαμβάνω signifie ici prendre ou adopter, et νοῦς l’esprit, l’intelligence ou la disposition mentale. Cette tournure française restitue idiomatiquement l’idée d’assumer un état d’esprit approprié.
- source_word: φιλοσοφήσεις
  choice: tu philosopheras
  rationale: Le verbe désigne explicitement l’activité philosophique. Le conserver respecte le vocabulaire conceptuel intentionnel de 4 Maccabées.
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: sur la vérité de ce qui est avantageux
  rationale: συμφέρον désigne ce qui est utile, profitable ou avantageux. La traduction garde la construction dense et la possible tension entre vérité et intérêt véritable.
theological_decisions:
- issue: Terminologie philosophique de 4 Maccabées
  choice: Conserver explicitement « raisonnements », la disposition mentale et « philosopher »
  alternative: Employer un vocabulaire moral plus général, comme « pensées », « bon sens » et « réfléchir »
  rationale: L’ouvrage présente intentionnellement la fidélité juive au moyen de catégories philosophiques. Maintenir ce registre évite de réduire son cadre conceptuel à une simple exhortation morale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation relie les deux futurs comme les étapes successives de l’exhortation. « Manière de penser » rend l’expression grecque plus naturelle sans supprimer sa dimension intellectuelle.
