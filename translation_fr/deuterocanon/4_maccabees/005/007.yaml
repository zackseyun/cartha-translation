  yaml_path: translation/deuterocanon/4_maccabees/005/007.yaml
  text: For why do you loathe the eating of the flesh of this animal[a], though nature has graciously made it most excellent?
translation:
  language: fr
  text: Pourquoi donc as-tu en horreur de manger la chair de cet animal[a], alors que la nature en a fait un mets excellent entre tous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « l’action de manger la chair de cet animal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: Pourquoi donc
  rationale: « Pourquoi » exprime l’interrogation directe, tandis que « donc » restitue la valeur argumentative de γάρ sans alourdir la phrase.
- source_word: τῆς φύσεως
  choice: la nature
  rationale: Le sens ordinaire de φύσις convient au raisonnement du locuteur, qui invoque la nature comme source de la qualité attribuée à cet aliment.
- source_word: κεχαρισμένης
  choice: en a fait
  rationale: Le participe parfait indique ici un bienfait ou une qualité accordée avec un résultat durable. Cette tournure française restitue naturellement le résultat sans donner à χαρίζομαι une portée théologique étrangère au contexte.
- source_word: καλλίστην
  choice: quelque chose d’excellent
  rationale: Le superlatif de καλός exprime ici une qualité supérieure, vraisemblablement alimentaire. « Excellent » conserve le ton élogieux; la tournure évite de faire artificiellement porter l’adjectif sur l’action de manger.
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: manger la chair de cet animal
  rationale: σαρκοφαγία signifie littéralement la consommation de chair. L’infinitif substantivé donne en français moderne une formulation concrète et naturelle, tout en conservant la référence explicite à la chair de l’animal.
- source_word: βδελύττεις
  choice: as-tu en horreur
  rationale: Le verbe marque une forte répulsion. « Avoir en horreur » garde cette intensité et convient au registre soutenu de l’interpellation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une tournure interrogative argumentative. Le discours conserve la forte répulsion exprimée par le grec et l’appel rhétorique à la nature, sans ajouter de précision doctrinale.
