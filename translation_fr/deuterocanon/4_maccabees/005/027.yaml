- from: Mais, en tyran, non seulement tu nous forces à violer la Loi, mais encore à manger, afin de tourner aussi en dérision cette consommation souillée qui nous est si odieuse.[a]
  to: Mais, en tyran, non seulement tu nous forces à violer la Loi, mais encore à manger, pour pouvoir encore nous railler par cette abominable souillure par la nourriture.[a]
  rationale: La révision remplace « aussi » par « encore » afin de rendre ἔτι, et clarifie la fonction de la souillure alimentaire comme moyen de railler les victimes. Elle conserve la force superlative de ἐχθίστῃ par « abominable », la référence implicite à la Torah par « la Loi », et l’ambiguïté lexicale de μιεροφαγία dans la note.
