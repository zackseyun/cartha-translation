base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: fr
  text: Mais, en tyran, non seulement tu nous forces à violer la Loi, mais encore à manger, pour pouvoir encore nous railler par cette abominable souillure par la nourriture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme grec est rare et réunit les idées de consommation de nourriture et de souillure rituelle ou morale. On pourrait aussi traduire : « cette manière impure de manger », « cette consommation souillée » ou « cette souillure alimentaire ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: τυραννικὸν
  choice: en tyran
  rationale: L’adjectif neutre est employé de manière adverbiale pour caractériser la conduite oppressive de l’interlocuteur. « En tyran » est naturel en français et conserve l’accusation directe.
- source_word: ἀναγκάζεις
  choice: tu nous forces
  rationale: Le présent exprime ici une contrainte actuelle; « forcer » rend clairement la coercition.
- source_word: παρανομεῖν
  choice: violer la Loi
  rationale: Le verbe signifie agir contrairement à la loi. Dans le contexte, il s’agit de la Loi juive; la majuscule française l’indique sobrement sans ajouter « de Dieu » ou « ancestrale ».
- source_word: ἐσθίειν
  choice: manger
  rationale: Traduction simple et directe de l’infinitif.
- source_word: ὅπως
  choice: afin de
  rationale: La conjonction introduit le but recherché par le tyran.
- source_word: ἐχθίστῃ ἡμῶν
  choice: qui nous est si odieuse
  rationale: Le superlatif exprime une aversion extrême. « Si odieuse » est idiomatique et rattache naturellement le génitif ἡμῶν à l’appréciation des victimes.
- source_word: μιεροφαγίᾳ
  choice: consommation souillée
  rationale: Ce composé rare associe l’acte de manger à la souillure rituelle ou morale. La formulation française garde ces deux composantes sans réduire le terme à la simple consommation d’un aliment interdit.
- source_word: ἔτι
  choice: aussi
  rationale: Le mot marque ici une indignité supplémentaire venant s’ajouter à la contrainte de transgresser et de manger.
- source_word: ἐγγελάσῃς
  choice: tourner en dérision
  rationale: Le verbe signifie rire de, railler ou tourner en dérision. Avec le datif qui suit, la consommation souillée est présentée comme l’objet de la moquerie.
theological_decisions:
- issue: Référent de la « Loi » dans παρανομεῖν
  choice: « violer la Loi », sans complément ajouté
  alternative: « violer la loi de Dieu » ou « transgresser la loi ancestrale »
  rationale: Le contexte maccabéen désigne clairement la Torah, mais le grec ne précise ni « de Dieu » ni « ancestrale ». La traduction garde cette sobriété.
- issue: Objet de la moquerie exprimée par ἐγγελάσῃς
  choice: Le tyran tourne en dérision la consommation souillée, qui est odieuse aux victimes.
  alternative: Le tyran se moque des victimes au moyen de cette consommation souillée.
  rationale: Le datif τῇ… μιεροφαγίᾳ peut être régi directement par ἐγγελάσῃς, tandis que ἡμῶν se rattache naturellement à ἐχθίστῃ. Cette lecture suit au plus près la construction grecque sans exclure la portée humiliante dirigée contre les victimes.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement convient à l’apostrophe accusatrice adressée au tyran. « Mais encore » maintient une légère solennité sans archaïsme, et « en tyran » conserve la vigueur rhétorique de l’ouverture grecque.
