  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: fr
  text: Car elle nous enseigne à faire preuve de maîtrise de soi, afin que nous dominions tous les plaisirs et les désirs, et à pratiquer le courage, afin que nous endurions volontairement toute souffrance ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: la maîtrise de soi
  rationale: Dans ce contexte éthique, le terme désigne la discipline intérieure qui permet de gouverner ses inclinations. « Maîtrise de soi » est clair et prépare naturellement la proposition sur les plaisirs et les désirs.
- source_word: ἐκδιδάσκει
  choice: enseigne
  rationale: Le composé peut évoquer un enseignement approfondi, mais « enseigne » exprime sobrement le sens dans un français naturel.
- source_word: κρατεῖν
  choice: dominions
  rationale: Le verbe exprime le fait d’avoir autorité ou maîtrise sur quelque chose. « Dominions » conserve cette force active.
- source_word: ἡδονῶν
  choice: plaisirs
  rationale: Le terme grec désigne ici les plaisirs en général ; le préciser comme sensuel restreindrait indûment sa portée.
- source_word: ἐπιθυμιῶν
  choice: désirs
  rationale: « Désirs » garde l’étendue du terme grec sans lui imposer un sens exclusivement sexuel ou nécessairement mauvais.
- source_word: ἀνδρείαν
  choice: courage
  rationale: Dans le vocabulaire éthique hellénistique, le mot désigne la vertu du courage. Cette traduction évite le littéralisme genré de « virilité ».
- source_word: ἐξασκεῖν
  choice: exerce au courage
  rationale: Le verbe indique la formation active et suivie à une vertu. La tournure « exercer au courage » rend cette idée et maintient l’enseignement comme sujet implicite.
- source_word: πόνον
  choice: souffrance
  rationale: Dans le contexte du martyre, le terme englobe la peine et la douleur endurées. « Souffrance » est plus naturel ici que « peine » et plus large que la seule douleur physique.
- source_word: ἑκουσίως
  choice: volontairement
  rationale: L’adverbe souligne que l’endurance est consentie, de son propre gré.
- source_word: ὑπομένειν
  choice: supportions
  rationale: Le verbe signifie demeurer ferme sous une épreuve ou l’endurer. « Supporter » s’emploie naturellement avec « souffrance ».
theological_decisions:
- issue: Traduction des termes grecs désignant les vertus dans un contexte philosophique et martyrial
  choice: Employer les termes éthiques français courants « maîtrise de soi » et « courage ».
  alternative: Employer « tempérance » et « force d’âme » ou le littéral genré « virilité ».
  rationale: Les termes retenus transmettent les vertus grecques avec clarté, sans archaïsme, restriction confessionnelle ni connotation masculine indue.
- issue: Valeur des deux constructions ὥστε avec infinitif
  choice: Les rendre par « afin que » avec le subjonctif.
  alternative: Les rendre comme un résultat factuel par « de sorte que » ou comme une simple explication par « c’est-à-dire ».
  rationale: Dans ce contexte pédagogique, les propositions expriment le but ou l’effet visé de l’enseignement. « Afin que » préserve cette orientation sans transformer le résultat en accomplissement automatique.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La structure parallèle du grec est conservée : enseignement de la maîtrise de soi, puis exercice au courage, chacun suivi de son effet visé.'
