base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: fr
  text: Et pourtant, même si notre loi n’était pas réellement divine, comme tu le supposes — bien que nous la considérions, nous, comme divine —, même dans ce cas tu n’aurais pas le droit d’annuler l’honneur que nous vaut notre piété.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre réputation de piété ». L’expression grecque peut désigner l’honneur ou la bonne réputation qui repose sur la révérence envers Dieu.
    reason: Alternative lexicale pour τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν.
lexical_decisions:
- source_word: καίτοι
  choice: Et pourtant
  rationale: Introduit avec force une concession et un contraste dans un français naturel.
- source_word: κατὰ ἀλήθειαν
  choice: réellement
  rationale: Rend l’expression adverbiale au sens de « en réalité », sans lourdeur littérale.
- source_word: ὁ νόμος ἡμῶν
  choice: notre loi
  rationale: Désigne ici la loi juive; la minuscule respecte l’absence de distinction graphique correspondante en grec.
- source_word: θεῖος
  choice: divine
  rationale: Conserve exactement l’affirmation grecque sur le caractère divin de la loi, sans l’expliciter en « donnée par Dieu ».
- source_word: ὑπολαμβάνεις
  choice: tu le supposes
  rationale: Exprime le jugement attribué à l’interlocuteur avec la nuance rhétorique légèrement critique du contexte.
- source_word: νομίζομεν
  choice: nous la considérons, nous
  rationale: Marque clairement le contraste entre l’opinion de l’interlocuteur et celle du locuteur.
- source_word: οὐδὲ οὕτως ἔχων
  choice: même dans ce cas
  rationale: Transpose naturellement la construction participiale qui reprend l’hypothèse concédée.
- source_word: ἦν ... ἀκυρῶσαι
  choice: tu n’aurais pas le droit d’annuler
  rationale: 'Rend la nuance d’illégitimité ou d’absence d’autorité portée par la construction, ainsi que le sens d’ἀκυρόω: priver de validité ou d’effet.'
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: l’honneur que nous vaut notre piété
  rationale: Préserve à la fois la réputation honorable exprimée par δόξα et son fondement dans l’εὐσέβεια, avec une formulation française idiomatique.
theological_decisions:
- issue: Statut de la loi comme θεῖος
  choice: « divine », sans développement supplémentaire
  alternative: « venant de Dieu » ou « donnée par Dieu »
  rationale: Le grec formule une concession rhétorique sur le caractère divin de la loi. « Divine » conserve le degré exact de l’affirmation sans importer une formulation doctrinale plus développée.
- issue: Sens d’εὐσέβεια
  choice: « piété »
  alternative: « attachement à Dieu », « religion » ou « dévotion »
  rationale: Dans 4 Maccabées, εὐσέβεια est une vertu centrale associant révérence envers Dieu et fidélité religieuse; « piété » maintient cette catégorie morale et religieuse.
- issue: Portée de δόξα liée à la piété
  choice: « l’honneur que nous vaut notre piété »
  alternative: « notre réputation de piété »
  rationale: Le choix principal exprime le statut honorable fondé sur la piété, tout en signalant en note l’autre nuance légitime, davantage centrée sur la réputation.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement reflète l’adresse grecque au singulier. Les tirets isolent la concession interne afin de rendre lisible la syntaxe grecque dense sans supprimer sa tension rhétorique.
