  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: fr
  text: Mes pères m’accueilleront comme un combattant[a], moi qui n’ai pas craint les contraintes que tu m’imposes, jusqu’à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le terme ἀγών, « combat, lutte, épreuve », dans une construction elliptique et inhabituelle. Il peut évoquer l’accueil du locuteur comme combattant, ou plus largement comme celui qui a soutenu victorieusement l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγών᾽
  choice: pour le combat
  rationale: La forme élidée représente vraisemblablement l’accusatif ἀγῶνα, « combat, lutte, épreuve, concours ». « Pour le combat » conserve l’image agonistique et l’étrangeté de la construction grecque sans transformer explicitement le locuteur en « champion ».
- source_word: οἱ πατέρες
  choice: mes pères
  rationale: Dans ce contexte, il s’agit des ancêtres du locuteur. « Mes pères » conserve l’expression masculine et ancestrale du grec, tandis que « mes ancêtres » serait plus explicatif.
- source_word: προσδέξονται
  choice: m’accueilleront
  rationale: Le verbe exprime ici une réception favorable; « accueillir » rend mieux cette nuance que le plus neutre « recevoir ».
- source_word: μὴ φοβηθέντα
  choice: moi qui n’ai pas craint
  rationale: Le participe aoriste qualifie με. Cette tournure française maintient son lien grammatical avec le locuteur sans imposer exclusivement une valeur causale.
- source_word: σου τὰς μέχρι θανάτου ἀνάγκας
  choice: les contraintes que tu m’imposes, jusqu’à la mort
  rationale: ἀνάγκαι désigne des pressions ou contraintes coercitives, et μέχρι θανάτου en marque l’étendue extrême. La formulation française rend explicite le rapport possessif de σου tout en gardant la portée potentiellement ambiguë de « jusqu’à la mort ».
theological_decisions:
- issue: Identité des « pères » et accueil après la mort
  choice: Conserver « mes pères » et leur accueil futur sans développer la scène.
  alternative: Expliciter « mes ancêtres m’accueilleront après ma mort ».
  rationale: Le contexte suggère un accueil par les ancêtres après l’endurance fidèle, mais le verset ne formule pas une doctrine détaillée de l’au-delà. La traduction reste donc au niveau de son affirmation.
- issue: Valeur de l’image agonistique
  choice: Traduire ἀγῶνα par « le combat » et signaler l’ambiguïté en note.
  alternative: « comme un champion » ou « comme un combattant ».
  rationale: Le grec nomme le combat ou l’épreuve plutôt que directement le combattant. Une lecture honorifique est possible dans le contexte, mais ne doit pas être imposée dans le texte principal.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « moi qui » préserve le lien participial du grec; « mes pères » maintient l’expression ancestrale sans l’expliciter excessivement.
