lexical_decisions:
- source_word: σὺ δέ
  choice: Mais toi
  rationale: δέ introduit ici un contraste, tandis que le pronom explicite σὺ met l’interlocuteur en relief ; « Mais toi » rend naturellement ces deux nuances.
- source_word: μοι
  choice: tu me sembles
  rationale: Le datif μοι avec δοκεῖς indique le point de vue du locuteur ; son sens est intégré naturellement à la tournure française « tu me sembles ».
- source_word: ἀνοητότερον
  choice: de façon encore plus insensée
  rationale: Le comparatif employé adverbialement exprime un manque plus grand de discernement ou de bon sens. « Insensée » reste ferme sans prendre la coloration injurieuse que pourrait avoir « stupide ».
- source_word: ποιήσειν
  choice: agir
  rationale: Dans la construction avec δοκεῖς, l’infinitif désigne la conduite envisagée. « Agir » est plus naturel en français que le calque général « faire ».
- source_word: δοκεῖς
  choice: tu me sembles
  rationale: Dans cette construction, δοκεῖς exprime l’apparence ou l’évaluation du locuteur, non l’opinion de l’interlocuteur.
