  text: He permitted us to eat the things suited to our souls[a], but he forbade us to eat flesh that is opposed to them.
translation:
  language: fr
  text: Il nous a permis de manger ce qui convient à nos âmes[a], mais il nous a interdit de manger de la chair qui leur est contraire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est apparenté à nos âmes » ; la suite peut se traduire : « de la chair qui s’oppose à elles ». Le grec souligne un rapport de convenance ou d’opposition avec l’âme.'
    reason: 'Alternative lexicale : les participes futurs grecs peuvent suggérer une orientation ou un effet attendu; le présent français rend naturellement cette relation sans lui attribuer une valeur temporelle trop précise.'
lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: ce qui devait convenir
  rationale: Le participe futur passif exprime ce qui se trouverait en affinité ou en convenance avec les âmes. « Devait convenir » conserve cette orientation future sans imposer une théorie philosophique précise.
- source_word: ψυχαῖς
  choice: à nos âmes
  rationale: Dans ce contexte, ψυχή porte une valeur morale et psychologique plutôt que le seul sens de vie biologique. « Âmes » maintient cette portée anthropologique.
- source_word: ἐπέτρεψεν
  choice: a permis
  rationale: Rend directement la permission donnée dans le cadre des prescriptions alimentaires.
- source_word: ἐναντιωθησόμενα
  choice: qui devaient leur être contraires
  rationale: Le participe futur passif désigne ce qui serait en opposition avec les âmes. Cette formulation préserve à la fois l'opposition et la nuance temporelle.
- source_word: ἐκώλυσεν
  choice: a interdit
  rationale: Dans le parallélisme avec « a permis », le verbe exprime ici une prohibition effective.
- source_word: σαρκοφαγεῖν
  choice: de manger les chairs
  rationale: Le verbe signifie littéralement « manger de la chair ». Le pluriel français « les chairs » rattache naturellement le complément relatif τὰ δέ aux aliments carnés distingués dans la phrase.
theological_decisions:
- issue: Portée anthropologique de ψυχαῖς dans son rapport aux prescriptions alimentaires
  choice: Conserver « âmes » et le contraste entre ce qui leur convient et ce qui leur est contraire
  alternative: Employer « vies » ou « personnes », ou reformuler en termes de santé corporelle
  rationale: Le grec présente une convenance ou une opposition par rapport à la dimension intérieure et morale de l'être humain. La traduction préserve cette affirmation sans la développer selon une anthropologie confessionnelle particulière.
- issue: Valeur des participes futurs οἰκειωθησόμενα et ἐναντιωθησόμενα
  choice: Rendre l'orientation future par « devait convenir » et « devaient leur être contraires »
  alternative: Employer simplement « ce qui convient » et « ce qui leur est contraire »
  rationale: Le futur peut suggérer les effets ou le rapport attendu des aliments aux âmes. Le conserver évite d'aplatir une nuance réelle du texte, tout en laissant ouverte sa portée exacte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme « a permis… a interdit » est conservé, ainsi que le vocabulaire anthropologique du texte grec.
