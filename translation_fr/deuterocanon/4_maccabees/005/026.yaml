    rationale: Les participes futurs peuvent exprimer une orientation ou une conséquence attendue, mais l'imparfait français suggère ici indûment une obligation passée ou une hypothèse. Le présent général conserve la relation de convenance et d'opposition sans surtraduire la nuance temporelle.
  - severity: medium
    issue: « Les chairs » n'est pas idiomatique pour σαρκοφαγεῖν
    rationale: Le grec désigne l'action de manger de la chair. En français moderne, « manger de la chair » est à la fois plus naturel et plus proche du lexème grec que « manger les chairs ».
