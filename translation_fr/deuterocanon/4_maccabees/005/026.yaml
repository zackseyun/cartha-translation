review_pass:
  verdict: revise
  source_fidelity: Le contraste entre ce qui est en affinité avec les âmes et ce qui leur est contraire est bien identifié. Toutefois, les imparfaits « devait/devaient » introduisent en français une valeur hypothétique ou rétrospective qui ne rend pas naturellement les participes futurs grecs dans cette formulation. « Les chairs » est en outre peu idiomatique ici; σαρκοφαγεῖν signifie « manger de la chair » / « manger de la viande ».
  naturalness: La phrase est compréhensible, mais « ce qui devait convenir » et « les chairs qui devaient leur être contraires » sont lourds et artificiels en français moderne. Une formulation au présent gnomique rend plus naturellement la relation morale exprimée par les participes.
  terminology: « Âmes », « a permis » et « a interdit » conviennent au registre et préservent la portée anthropologique sans ajout doctrinal. « Chair » est préférable à « les chairs » pour rendre σαρκοφαγεῖν de manière littérale et idiomatique.
