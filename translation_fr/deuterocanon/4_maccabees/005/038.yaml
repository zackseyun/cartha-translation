base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: fr
  text: Car tu tyranniseras les impies ; mais tu n’auras aucune prise sur mes raisonnements[a] au sujet de la piété, ni par des paroles ni par des actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes jugements raisonnés ». Le grec λογισμός est un terme clé de 4 Maccabées pour désigner la délibération rationnelle qui guide la conduite morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβῶν
  choice: les impies
  rationale: Le génitif pluriel désigne les personnes sur lesquelles s’exerce la tyrannie. « Les impies » maintient le contraste religieux avec εὐσέβεια sans réduire le terme à un simple manque de croyance.
- source_word: τυραννήσεις
  choice: tu exerceras ta tyrannie sur
  rationale: Cette formulation française rend la domination oppressive exprimée par le verbe apparenté à τύραννος, plutôt qu’un gouvernement neutre, tout en conservant le futur grec.
- source_word: τῶν δὲ ἐμῶν ... λογισμῶν
  choice: mais ... de mes raisonnements
  rationale: '« Raisonnements » préserve le rôle conceptuel de λογισμός dans 4 Maccabées : la délibération rationnelle qui oriente la conduite morale.'
- source_word: περὶ τῆς εὐσεβείας
  choice: au sujet de la piété
  rationale: « Piété » exprime la fidélité respectueuse envers Dieu et sa loi, tout en conservant la portée religieuse et l’ambiguïté relative du grec.
- source_word: δεσπόσεις
  choice: tu ne te rendras maître de
  rationale: Cette tournure rend l’idée de maîtrise ou de domination et fait ressortir l’opposition entre le pouvoir extérieur du tyran et son incapacité à maîtriser les convictions raisonnées du locuteur.
- source_word: οὔτε λόγοις ... οὔτε δι᾽ ἔργων
  choice: ni par des paroles ni par des actes
  rationale: La traduction conserve le parallélisme négatif grec et la distinction entre les moyens verbaux et les moyens concrets d’imposer sa volonté.
theological_decisions:
- issue: Rendre l’opposition éthique et religieuse entre ἀσεβής et εὐσέβεια
  choice: impies / piété
  alternative: irréligieux / attachement à Dieu
  rationale: « Impies / piété » maintient une opposition lexicale claire et la dimension religieuse du passage, sans préciser davantage que le grec la nature exacte de cette piété.
- issue: Préserver la place de la raison morale dans l’argument de 4 Maccabées
  choice: mes raisonnements
  alternative: mes convictions raisonnées
  rationale: « Raisonnements » conserve le lien direct avec la délibération rationnelle, tandis que « convictions » mettrait davantage l’accent sur le résultat de cette délibération et atténuerait le terme clé du livre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le futur et la structure concessive-oppositive sont conservés. « Exercer sa tyrannie » et « se rendre maître de » distinguent la domination oppressive extérieure de la maîtrise intérieure que le tyran ne peut obtenir.
