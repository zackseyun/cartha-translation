  text: nor will I disregard the sacred oaths of the fathers to keep the law[b][a],
translation:
  language: fr
  text: je ne négligerai pas non plus les serments sacrés des ancêtres[a] concernant l’observance de la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pères » ou « des aïeux ». Le grec désigne les générations antérieures sans employer ici de pronom équivalant à « nos ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la loi ancestrale juive; on pourrait aussi écrire « la Loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε … οὐ παρήσω
  choice: je ne négligerai pas non plus
  rationale: La tournure française rend naturellement la négation coordonnée qui poursuit une série précédente. « Négliger » exprime ici le fait de laisser de côté ou de ne pas tenir compte des serments.
- source_word: ἱεροὺς … ὅρκους
  choice: les serments sacrés
  rationale: « Serments » rend précisément ὅρκους, tandis que « sacrés » conserve le poids religieux de ἱερούς.
- source_word: τῶν προγόνων
  choice: des ancêtres
  rationale: Le génitif désigne les générations antérieures sans pronom possessif explicite. « Des ancêtres » est naturel en français moderne et n’ajoute pas « nos ».
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: concernant l’observance de la loi
  rationale: Cette formulation conserve la valeur de contenu ou d’objet de περί avec l’infinitif substantivé. « Observance » rend le sens de fidélité pratique porté par φυλάσσω dans ce contexte.
- source_word: τὸν νόμον
  choice: la loi
  rationale: Le contexte renvoie à la loi juive ancestrale, mais le grec n’impose ni explicitation ni majuscule; la formulation simple préserve cette sobriété.
theological_decisions:
- issue: Portée de τῶν προγόνων
  choice: des ancêtres
  alternative: des pères / des aïeux
  rationale: « Ancêtres » transmet clairement la référence ancestrale en français actuel. La note conserve les possibilités plus littérales ou plus soutenues sans introduire le possessif « nos », absent du grec.
- issue: Référent de τὸν νόμον
  choice: la loi
  alternative: la Loi / la loi ancestrale
  rationale: Le contexte permet de reconnaître la loi juive, mais le texte principal ne précise pas davantage que le grec et ne tranche pas typographiquement par une majuscule.
- issue: Relation entre les serments et l’observance de la loi
  choice: concernant l’observance de la loi
  alternative: faits pour observer la loi
  rationale: La formulation retenue préserve la nuance de περί avec l’infinitif substantivé, qui peut désigner le contenu ou l’objet des serments, sans surdéterminer leur formulation exacte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien avec une série négative antérieure grâce à « non plus » et évite d’ajouter un possessif absent du grec.
