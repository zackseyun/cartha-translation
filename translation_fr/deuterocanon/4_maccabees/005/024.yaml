base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: fr
  text: Elle forme aussi à la justice[a], de sorte que l’on agisse avec équité dans toute sa conduite, et elle enseigne la piété, de sorte que l’on rende, d’une manière digne de sa grandeur, un culte au seul Dieu qui est réellement Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la droiture ». Le grec δικαιοσύνη peut désigner aussi bien la justice que la rectitude morale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne vénérer que le Dieu qui est ». L’expression souligne qu’il est réellement Dieu, par opposition aux faux dieux.'
    reason: literal_rendering
lexical_decisions:
- source_word: δικαιοσύνην
  choice: justice
  rationale: En français, « justice » exprime naturellement ici la rectitude morale et la conduite juste; « droiture » demeure une nuance possible, signalée en note.
- source_word: παιδεύει
  choice: forme
  rationale: Le verbe désigne une éducation morale qui façonne la conduite, ce que « forme » rend avec naturel.
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: dans toute sa conduite
  rationale: ἤθη renvoie aux habitudes, au caractère et aux comportements; cette formulation française exprime l’ensemble de la vie morale sans lourdeur.
- source_word: ἰσονομεῖν
  choice: agir avec équité
  rationale: Le verbe évoque l’égalité de traitement ou l’impartialité; « agir avec équité » en restitue la portée éthique.
- source_word: εὐσεβείαν
  choice: piété
  rationale: Le terme désigne la dévotion respectueuse envers Dieu; « piété » est précis et idiomatique dans ce contexte.
- source_word: σέβειν
  choice: rendre un culte
  rationale: Avec Dieu pour objet, le verbe exprime ici la vénération religieuse et non un simple respect.
- source_word: μόνον τὸν ὄντα θεὸν
  choice: au seul Dieu qui existe véritablement
  rationale: Cette traduction conserve l’accent mis sur l’existence réelle de Dieu, par opposition aux faux dieux, tout en restant naturelle en français.
- source_word: μεγαλοπρεπῶς
  choice: d’une manière digne de sa grandeur
  rationale: L’adverbe évoque une manière majestueuse, conforme à la grandeur divine; la formulation évite l’expression peu naturelle « avec magnificence ».
theological_decisions:
- issue: Sens de δικαιοσύνη dans ce contexte éthique
  choice: justice
  alternative: droiture
  rationale: Le contexte associe cette vertu à l’équité dans la conduite. « Justice » préserve ce lien, tandis que la note maintient la nuance plus générale de rectitude morale.
- issue: Portée de μόνον τὸν ὄντα θεὸν
  choice: le seul Dieu qui existe véritablement
  alternative: le seul vrai Dieu; littéralement, le Dieu qui est
  rationale: Le grec insiste sur l’être réel de Dieu en contraste avec les faux dieux. La traduction conserve cet accent sans l’assimiler à une formule doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétée « de sorte que » reflète les deux propositions consécutives introduites par ὥστε; les formulations idiomatiques évitent un calque lourd tout en conservant les nuances éthiques et théologiques du grec.
