  source_fidelity: 'Le texte rend bien la formation morale (παιδεύει), la justice (δικαιοσύνη), l’équité (ἰσονομεῖν), la piété et le culte dû à Dieu. Une légère révision est nécessaire pour rendre plus exactement l’accent de τὸν ὄντα θεόν : il ne signifie pas littéralement « le seul Dieu qui est », mais « le Dieu qui est/existe », avec μόνον portant sur l’exclusivité du culte. La formulation révisée conserve cette opposition implicite aux faux dieux.'
