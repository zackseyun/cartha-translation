  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: fr
  text: Mais nous, Antiochos, convaincus par une loi divine, réglons notre conduite sur elle et estimons qu’aucune contrainte n’est plus forte que l’obéissance à notre loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θείῳ
  choice: divine
  rationale: L’adjectif qualifie νόμῳ et exprime le caractère ou l’origine divine de la loi, sans préciser davantage.
- source_word: πεπεισμένοι
  choice: convaincus
  rationale: Le participe parfait passif indique une conviction acquise qui demeure; « convaincus » est naturel en français et conserve cet état résultant.
- source_word: νόμῳ
  choice: loi
  rationale: Dans ce contexte, νόμος désigne la Loi juive; « loi » en est le rendu français le plus clair et traditionnel.
- source_word: πολιτευόμεθα
  choice: réglons notre conduite sur elle
  rationale: Le verbe désigne ici la manière de vivre ou de se conduire au sein d’un ordre collectif; cette formulation exprime une conduite normée par la loi.
- source_word: οὐδεμίαν ἀνάγκην
  choice: aucune contrainte
  rationale: Dans le contexte de la coercition exercée par Antiochos, ἀνάγκη renvoie à une pression contraignante plutôt qu’à une nécessité abstraite.
- source_word: βιαιοτέραν
  choice: plus forte
  rationale: Le comparatif exprime une force coercitive supérieure; « plus forte » s’accorde naturellement avec « contrainte » tout en préservant la comparaison.
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: que notre obéissance à notre loi
  rationale: εὐπείθεια exprime la disposition à obéir et la docilité; « obéissance » en restitue clairement la portée morale.
theological_decisions:
- issue: Caractérisation de la Loi mosaïque
  choice: une loi divine
  alternative: la loi divine / une loi venant de Dieu
  rationale: L’expression grecque θείῳ νόμῳ est sans article et peut être qualitative ou indéfinie. « Une loi divine » en préserve la forme et affirme son caractère divin sans préciser indûment s’il s’agit surtout de sa qualité ou de son origine.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste ferme et solennelle, adaptée à une déclaration adressée au souverain, sans archaïsmes. « Antiochos » suit la forme française usuelle du nom grec.
