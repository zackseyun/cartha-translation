  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: fr
  text: Je ne te déshonorerai pas non plus, ô raison philosophique[a], et je ne te renierai pas, sacerdoce digne d’honneur et connaissance de la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque, très ramassée, peut aussi se traduire par « raison éprise de sagesse ».
    reason: Alternative lexicale pour φιλόσοφε λόγε.
  - marker: b
    text: Ou « maîtrise de la Loi ». Littéralement, νομοθεσία peut aussi évoquer la législation ou l’établissement de la Loi.
    reason: Préserver l’étendue de sens de νομοθεσίας ἐπιστήμη sans attribuer à νομοθεσία un sens plus spécifique que le grec ne l’exige.
lexical_decisions:
- source_word: καταισχυνῶ
  choice: je ne te déshonorerai pas
  rationale: Le futur de καταισχύνω exprime ici le fait de couvrir de honte ou de porter atteinte à l’honneur de ce qui est interpellé. « Déshonorer » restitue naturellement cette dimension en français.
- source_word: φιλόσοφε λόγε
  choice: ô raison philosophique
  rationale: Le vocatif compact associe λόγος, « raison », à l’adjectif φιλόσοφος. Cette formulation garde l’adresse personnifiée et les deux composantes du grec sans transformer λόγος en simple « philosophie ».
- source_word: ἑξαρνήσομαί
  choice: je ne te renierai pas
  rationale: ἐξαρνέομαι désigne un désaveu ou une répudiation forte. « Renier » convient à l’engagement personnel exprimé par le locuteur.
- source_word: ἱεροσύνη τιμία
  choice: sacerdoce digne d’honneur
  rationale: ἱεροσύνη désigne le sacerdoce ou la fonction sacerdotale, tandis que τιμία en souligne la valeur et l’honneur. La tournure française maintient cette adresse solennelle.
- source_word: νομοθεσίας ἐπιστήμη
  choice: connaissance de la Loi
  rationale: ἐπιστήμη indique une connaissance sûre ou une maîtrise; νομοθεσία peut désigner la législation ou le don de la loi. Dans le contexte juif de l’ouvrage, « la Loi » rend clairement la référence tout en signalant en note le sens plus littéral.
theological_decisions:
- issue: Personnification des réalités auxquelles le locuteur s’adresse
  choice: Conserver les apostrophes directes à la raison philosophique, au sacerdoce et à la connaissance de la Loi
  alternative: Reformuler comme un refus général d’abandonner la philosophie et la tradition juive
  rationale: Les vocatifs et les pronoms de deuxième personne donnent à ces réalités abstraites une présence rhétorique. La traduction maintient cette personnification et ne réduit pas la tension entre raison philosophique, sacerdoce et Loi.
- issue: Portée de νομοθεσία
  choice: la Loi
  alternative: la législation ou le don de la Loi
  rationale: Le contexte rend vraisemblable une référence à la Loi juive, mais le sens institutionnel ou actif de νομοθεσία demeure possible; la note conserve cette latitude.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. L’apostrophe « ô » conserve la solennité rhétorique du vocatif grec; « Loi » prend une majuscule pour indiquer la référence contextuelle à la Loi juive.
