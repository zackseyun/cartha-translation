  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: fr
  text: Je n’aurai pas pitié de ma propre vieillesse au point d’abolir, par mon propre acte, la loi de mes ancêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως … ὥστε
  choice: pas … au point de
  rationale: 'Cette tournure française exprime naturellement le degré suivi de son résultat envisagé : « pas à ce point… que ».'
- source_word: οἰκτειρήσω
  choice: je n’aurai pas pitié
  rationale: Le verbe désigne la pitié ou la compassion. Cette traduction conserve l’attitude affective exprimée, sans la réduire à l’idée pratique d’épargner.
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: ma propre vieillesse
  rationale: « Vieillesse » rend γῆρας, tandis que « propre » maintient l’insistance réflexive de ἐμαυτοῦ.
- source_word: με διʼ ἐμαυτοῦ
  choice: par mon propre acte
  rationale: La formule souligne que le locuteur serait lui-même l’agent responsable. Cette expression est claire et idiomatique en français.
- source_word: τὸν πάτριον νόμον
  choice: la loi de mes ancêtres
  rationale: πάτριος qualifie ce qui vient des pères ou des ancêtres. La formulation française exprime clairement l’héritage reçu sans ajouter de terminologie confessionnelle.
- source_word: καταλῦσαι
  choice: abolir
  rationale: Le verbe signifie ici mettre à bas ou priver la loi de son autorité par son propre comportement. « Abolir » conserve la force du terme grec.
theological_decisions:
- issue: Sens de πάτριον νόμον dans le contexte du martyre juif
  choice: la loi de mes ancêtres
  alternative: la loi ancestrale
  rationale: La formulation retenue préserve l’idée d’une loi religieuse héritée des pères, tout en restant naturelle et intelligible en français moderne, sans préciser davantage que le grec.
translation_notes:
  register: Français moderne international, digne et direct. La structure « pas… au point de » conserve le rapport grec de degré et de résultat. La répétition « ma propre / mon propre » maintient l’insistance du texte sur la responsabilité personnelle.
