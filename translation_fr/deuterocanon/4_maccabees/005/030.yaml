  text: You will not even gouge out my eyes and melt my inward parts[a].
translation:
  language: fr
  text: Tu ne pourrais même pas m’arracher les yeux ni faire fondre mes entrailles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes organes internes ». Le terme grec désigne les organes situés à l’intérieur du corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: Tu ne pourrais pas davantage
  rationale: La particule ἄν avec le futur à valeur modale exprime ici une éventualité rejetée avec force; cette tournure française conserve la nuance de « même dans ce cas, tu ne pourrais pas » sans réduire l’expression à un simple futur.
- source_word: ἐκκόψεις
  choice: m’arracher
  rationale: Le verbe signifie couper ou retrancher. Avec les yeux pour complément, « arracher » restitue naturellement en français la violence concrète de l’image.
- source_word: τὰ ὄμματα
  choice: les yeux
  rationale: Le nom désigne ici simplement les yeux; le possessif grec est rendu par le pronom objet « m’ » selon l’usage idiomatique français pour les parties du corps.
- source_word: τὰ σπλάγχνα
  choice: mes entrailles
  rationale: Le terme désigne les organes internes. « Entrailles » est précis, intelligible et adapté au registre violent du passage, tout en conservant l’alternative plus générale en note.
- source_word: τήξεις
  choice: faire fondre
  rationale: Le verbe signifie faire fondre, liquéfier ou consumer. La traduction littérale préserve l’image saisissante et l’étrangeté du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse singulière au tyran. La construction modale conserve l’ambiguïté de οὐδ’ ἄν, qui peut évoquer soit une impossibilité emphatique, soit une hypothèse rejetée.
