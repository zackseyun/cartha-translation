review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le participe aoriste de προσκυνέω introduit le moyen/la condition de l’action future, et « ta propre vieillesse » rend correctement τὸ σεαυτοῦ γῆρας. Cependant, « te soumettant » interprète le verbe comme une simple soumission et atténue son sens premier de geste d’hommage/prosternation. Une formulation qui conserve cette dimension tout en restant idiomatique est préférable.'
  naturalness: La phrase est fluide en français moderne. « En te pliant à mon appel bienveillant » est plus naturel que de faire directement d’un « appel » l’objet d’une prosternation, tout en gardant une image de déférence plus proche du grec.
  terminology: « Exhortation bienveillante » rend bien παρηγορία comme appel persuasif et φιλάνθρωπος comme l’auto-présentation bienveillante du locuteur. La note doit présenter « se prosterner » et « rendre hommage » comme des possibilités du verbe, sans laisser entendre que l’appel lui-même est nécessairement l’objet français de ces gestes.
  issues:
