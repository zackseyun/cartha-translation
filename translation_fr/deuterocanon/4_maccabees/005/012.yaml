  text: and by bowing down to my humane persuasion[a], you will have pity on your own old age.
translation:
  language: fr
  text: et, en te pliant à mon exhortation bienveillante[a], tu auras pitié de ta propre vieillesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi évoquer le fait de se prosterner ou de rendre hommage ; dans le contexte plus large d’une apostasie imposée, il peut également avoir une nuance d’adoration.
    reason: alternative lexicale et ambiguïté théologique de προσκυνέω
lexical_decisions:
- source_word: προσκυνήσας
  choice: en te soumettant
  rationale: Le participe aoriste exprime ici le moyen par lequel le vieillard épargnerait sa vieillesse. Le verbe peut évoquer le fait de se prosterner, de rendre hommage ou d’adorer; «te soumettant» rend naturellement l’obéissance exigée sans exclure la portée religieuse du contexte.
- source_word: μου
  choice: mon
  rationale: Le génitif marque simplement que l’appel émane du roi.
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: mon appel bienveillant
  rationale: παρηγορία désigne ici une exhortation persuasive plutôt qu’une consolation, tandis que φιλάνθρωπος présente cet appel comme humain ou bienveillant selon la rhétorique du locuteur, sans valider cette prétention.
- source_word: οἰκτειρήσεις
  choice: tu auras pitié de
  rationale: Le futur de οἰκτείρω signifie éprouver ou manifester de la pitié; la formulation directe conserve l’ironie de l’appel à se préserver soi-même.
- source_word: τὸ σεαυτοῦ γῆρας
  choice: ta propre vieillesse
  rationale: γῆρας signifie «vieillesse», et le réfléchi emphatique σεαυτοῦ est rendu par «propre».
theological_decisions:
- issue: Portée de προσκυνέω dans un contexte d’apostasie imposée
  choice: te soumettant
  alternative: en te prosternant; en rendant hommage; en adorant
  rationale: L’objet grammatical est ici l’«appel» du roi, ce qui favorise l’idée de céder ou de se soumettre. Toutefois, προσκυνέω peut désigner une prosternation, un hommage ou un acte d’adoration; la note conserve cette ambiguïté importante dans le contexte religieux.
translation_notes:
  register: Français international moderne, digne et accessible. «Appel bienveillant» restitue la présentation flatteuse que le roi donne de sa propre coercition sans l’entériner. La construction participiale grecque est rendue par un gérondif de moyen.
