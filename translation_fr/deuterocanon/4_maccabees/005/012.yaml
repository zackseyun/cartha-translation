    issue: Atténuation de προσκυνήσας dans le texte principal
    rationale: « Se soumettre » exprime l’issue attendue, mais ne conserve pas suffisamment la nuance de déférence, de prosternation ou d’hommage portée par προσκυνέω. « Se plier à » est idiomatique dans ce contexte et garde davantage cette image sans imposer « adorer ».
  - severity: low
    issue: Formulation imprécise de l’alternative dans la note
    rationale: « En te prosternant devant mon appel » et surtout « en lui rendant hommage » sont peu naturels, car les gestes visent normalement une personne ou une autorité plutôt qu’un appel. La note doit décrire les sens lexicaux possibles sans créer cette difficulté syntaxique.
