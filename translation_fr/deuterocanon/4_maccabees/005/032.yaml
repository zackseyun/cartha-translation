lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: En réponse à cela
  rationale: 'Cette tournure rend naturellement la fonction discursive de l’expression grecque : l’ordre est donné en réaction aux paroles qui précèdent.'
- source_word: τροχοὺς
  choice: les roues
  rationale: Le grec désigne littéralement des roues. Le contexte indique des instruments de torture, mais traduire par « chevalets » préciserait davantage que le texte source.
- source_word: εὐτρέπιζε
  choice: prépare
  rationale: L’impératif demande de mettre les instruments en état de servir ; « prépare » est direct et naturel en français moderne.
- source_word: τὸ πῦρ
  choice: le feu
  rationale: Traduction concrète et directe du groupe nominal grec défini.
- source_word: ἔκφυσα
  choice: souffle sur
  rationale: Le verbe évoque l’action de souffler sur le feu pour en accroître l’intensité ; cette formulation conserve l’image grecque.
- source_word: σφοδρότερον
  choice: avec encore plus de force
  rationale: Cette expression rend la valeur comparative de l’adverbe et l’intensification de l’action de souffler.
