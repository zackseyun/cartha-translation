  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: fr
  text: Si, en te glorifiant vainement au sujet de la vérité, tu continues à mépriser même moi, au prix de ton propre châtiment[a], ne vas-tu pas te réveiller de votre philosophie creuse[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tes propres dépens » ou « en attirant le châtiment sur toi ». La tournure grecque indique que ce mépris aura pour conséquence le châtiment de l’interlocuteur lui-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « philosophie bavarde » ou « philosophie futile ». L’adjectif grec peut qualifier des paroles vides, sottes ou verbeuses. Le possessif est au pluriel en grec, alors que l’interlocuteur était jusque-là désigné au singulier.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: te glorifiant vainement
  rationale: Le participe exprime une gloire ou une prétention vaine et sans fondement. Cette formulation conserve sa valeur verbale et son caractère péjoratif.
- source_word: περὶ τὸ ἀληθές
  choice: au sujet de la vérité
  rationale: La tournure garde le rapport explicite à « la vérité » sans préciser abusivement que l’interlocuteur prétend la posséder.
- source_word: ἔτι κἀμοῦ
  choice: tu continues à me mépriser, même moi
  rationale: « Continues » rend ici ἔτι dans un français naturel, tandis que « même moi » restitue l’insistance de la crase κἀμοῦ.
- source_word: καταφρονήσεις
  choice: mépriser
  rationale: Le verbe désigne un regard ou un traitement empreint de mépris ; « mépriser » en conserve la force avec concision.
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: pour ton propre châtiment
  rationale: Cette traduction assez formelle maintient l’idée que le mépris aura pour conséquence le châtiment de l’interlocuteur, tout en laissant en note des formulations françaises plus explicites.
- source_word: οὐκ ἐξυπνώσεις
  choice: ne vas-tu pas te réveiller
  rationale: La question appelle une réponse affirmative et conserve la métaphore du réveil hors de l’illusion.
- source_word: φλυάρου φιλοσοφίας
  choice: philosophie creuse
  rationale: φλύαρος peut évoquer un discours vide, futile ou bavard. « Creuse » communique naturellement en français le jugement dépréciatif sans réduire le terme à la seule prolixité.
- source_word: ὑμῶν
  choice: votre
  rationale: Le pluriel grec est conservé, malgré les verbes et possessifs singuliers qui précèdent ; ce changement de nombre peut élargir le reproche au groupe ou au courant auquel appartient l’interlocuteur.
theological_decisions:
- issue: Portée rhétorique du reproche
  choice: Une vive interpellation morale qui conserve la métaphore du réveil et le vocabulaire philosophique
  alternative: Paraphraser par « revenir à la raison et abandonner votre philosophie absurde »
  rationale: Le texte emploie le langage de la philosophie dans une polémique morale juive. La traduction garde cette tension sans introduire de catégories philosophiques ou théologiques ultérieures.
- issue: Alternance entre le singulier et le pluriel
  choice: Conserver « te/ton » puis « votre »
  alternative: Uniformiser en « ta philosophie » pour faciliter la lecture
  rationale: Le grec passe réellement du singulier dans l’adresse et le châtiment à un possessif pluriel pour la philosophie. L’uniformisation effacerait une possible extension du reproche au parti de l’interlocuteur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement rend l’adresse grecque au singulier ; le passage inattendu à « votre » préserve le pluriel final. La ponctuation maintient la longue condition suivie de la question rhétorique.
