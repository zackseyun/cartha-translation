base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/002.yaml
  text: He ordered the guards to drag away each one of the Hebrews and force them to taste pork and meat sacrificed to idols[b][a];
translation:
  language: fr
  text: Il ordonnait aux gardes[a] de traîner à l’écart chacun des Hébreux et de les forcer à goûter de la viande de porc et des aliments sacrifiés aux idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gardes du corps »; littéralement « porteurs de lance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « viandes sacrifiées aux idoles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκέλευεν
  choice: Il ordonnait
  rationale: L’imparfait grec présente l’ordre comme une action en cours ou répétée dans le récit; « ordonnait » en conserve la force d’autorité.
- source_word: τοῖς δορυφόροις
  choice: aux gardes
  rationale: Le terme désigne littéralement des porteurs de lance et, par fonction, des gardes ou gardes du corps. « Gardes » est clair et naturel dans ce contexte coercitif.
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: chacun des Hébreux
  rationale: Cette formulation conserve la valeur distributive et insistante de ἕνα ἕκαστον ainsi que la désignation explicite « Hébreux ».
- source_word: περισπᾶσθαι
  choice: de traîner à l’écart
  rationale: Le verbe exprime l’action de tirer ou d’entraîner quelqu’un hors de sa place. « Traîner à l’écart » rend à la fois le déplacement et la contrainte physique.
- source_word: κρεῶν ὑείων
  choice: de la viande de porc
  rationale: Cette expression moderne et précise rend directement la viande provenant du porc, sans archaïsme.
- source_word: εἰδωλοθύτων
  choice: des aliments sacrifiés aux idoles
  rationale: Le substantif désigne ce qui a été offert ou sacrifié aux idoles. « Aliments » préserve sa portée possible sans imposer qu’il s’agisse uniquement de viande.
- source_word: ἀναγκάζειν
  choice: de les forcer
  rationale: Le verbe marque une contrainte effective; « forcer » en restitue clairement la violence.
- source_word: ἀπογεύεσθαι
  choice: à goûter
  rationale: Le verbe signifie goûter ou prendre de quelque chose. « Goûter » respecte la précision du grec et souligne qu’une participation même minime était imposée.
theological_decisions:
- issue: Désignation Ἐβραίων
  choice: Hébreux
  alternative: Juifs
  rationale: Le grec emploie explicitement « Hébreux »; conserver ce terme respecte la texture ethnique et historique du passage sans l’harmoniser.
- issue: Degré de participation exprimé par ἀπογεύεσθαι
  choice: goûter
  alternative: manger; prendre part à
  rationale: « Goûter » maintient l’idée qu’une quantité même minime pouvait constituer la transgression imposée, sans transformer le geste en consommation complète.
- issue: Portée de εἰδωλοθύτων
  choice: aliments sacrifiés aux idoles
  alternative: viandes sacrifiées aux idoles
  rationale: Le mot peut désigner plus largement ce qui est offert aux idoles. La traduction ne restreint donc pas inutilement le référent à la viande, tout en signalant l’alternative en note.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’imparfait narratif, la contrainte physique et l’insistance distributive, tout en évitant les tournures archaïques.
