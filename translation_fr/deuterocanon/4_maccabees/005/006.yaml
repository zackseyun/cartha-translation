base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: fr
  text: '« Avant de commencer à te torturer, vieillard, je voudrais te donner ce conseil : afin qu’après avoir goûté de la chair de porc, tu puisses sauver ta vie.[a] Car je respecte ton âge et tes cheveux blancs, que tu portes depuis si longtemps ; pourtant, tu ne me sembles pas philosopher en pratiquant la religion des Juifs.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que, après avoir goûté de la chair de porc, tu te sauves » ; il s’agit ici de préserver sa vie.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie le verbe « philosopher », terme récurrent dans ce livre pour parler de la raison, de la sagesse et de la manière de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: Avant de commencer à te torturer
  rationale: La tournure française exprime naturellement la relation temporelle de πρίν et rend βάσανοι comme des actes de torture dirigés contre l’interlocuteur.
- source_word: ὦ πρεσβῦτα
  choice: vieillard
  rationale: Le vocatif désigne ici un homme âgé, non un détenteur de fonction. « Vieillard » conserve l’adresse directe et rude tout en restant digne dans ce contexte littéraire.
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: je voudrais te donner ce conseil
  rationale: Le conditionnel de politesse rend la nuance tentative de l’optatif avec ἄν.
- source_word: ὅπως ἀπογευσάμενος τῶν ὑείων σώζοιο
  choice: goûte un peu de porc, afin de sauver ta vie
  rationale: ἀπογεύομαι indique le fait de goûter, tandis que τὰ ὕεια désigne la chair de porc. Dans le contexte, σώζοιο concerne la préservation de la vie face à la torture et à la mort.
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: Car je respecte ton âge et tes cheveux blancs
  rationale: αἰδέομαι exprime ici la déférence ou le respect, et πολιὰ désigne les cheveux blanchis par l’âge.
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: Pourtant, après les avoir portés si longtemps
  rationale: Le relatif féminin singulier renvoie grammaticalement à πολιάν, mais le français emploie naturellement le pluriel pour « cheveux blancs ». La durée exprimée par τοσοῦτον χρόνον est conservée.
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: tu ne me sembles pas philosopher
  rationale: Le verbe explicite « philosopher » préserve le vocabulaire récurrent de la philosophie et de la raison dans 4 Maccabées.
- source_word: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ
  choice: en pratiquant la religion des Juifs
  rationale: χράομαι avec le datif peut signifier pratiquer ou suivre, et θρησκεία désigne ici la pratique religieuse ou la religion.
theological_decisions:
- issue: Portée de σώζοιο
  choice: sauver ta vie
  alternative: te sauver
  rationale: Le contexte est celui de l’évitement immédiat de la torture et de la mort. La traduction précise donc la préservation physique sans introduire une notion de salut spirituel.
- issue: Portée de φιλοσοφεῖν
  choice: conserver le verbe « philosopher »
  alternative: agir avec sagesse / être raisonnable
  rationale: Le langage philosophique structure l’argument de 4 Maccabées. Le conserver évite d’effacer cette tension, même si l’accusateur conteste ironiquement que la fidélité juive constitue une vraie philosophie.
- issue: Rapport entre pratique juive et philosophie
  choice: « philosopher en pratiquant la religion des Juifs »
  alternative: « être sage puisque tu pratiques la religion des Juifs »
  rationale: La construction grecque associe la manière de philosopher à l’usage ou à la pratique de la religion juive, du point de vue hostile du locuteur. La traduction ne résout pas cette tension en reformulant le jugement.
translation_notes:
  register: Français international actuel, clair et digne. Le discours direct garde la condescendance menaçante du locuteur. « Vieillard » et « philosopher » ont été retenus pour préserver respectivement la force du vocatif et le vocabulaire thématique du livre.
