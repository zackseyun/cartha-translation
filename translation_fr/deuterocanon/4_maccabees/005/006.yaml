  to: '« Avant de commencer à te torturer, vieillard, je voudrais te donner ce conseil : afin qu’après avoir goûté de la chair de porc, tu puisses sauver ta vie.[a] Car je respecte ton âge et tes cheveux blancs, que tu portes depuis si longtemps ; pourtant, tu ne me sembles pas philosopher en pratiquant la religion des Juifs.[b] »'
