revisions:
- from: Mais, tandis qu’on en arrêtait beaucoup, le premier que l’on fit sortir du troupeau[a] fut un Hébreu du nom d’Éléazar. Prêtre de naissance et versé dans la Loi[b], il était avancé en âge et, en raison de son âge, connu de beaucoup de gens de l’entourage du tyran. On lui ouvrit la bouche.
  to: Mais, après que beaucoup eurent été arrêtés, un Hébreu nommé Éléazar, le premier du groupe[a], de lignée sacerdotale et versé dans la Loi[b], avancé en âge et connu de beaucoup de gens de l’entourage du tyran à cause de son âge, prit la parole.
  rationale: La révision élimine l’agent ajouté au dernier membre et restitue l’idiome d’entrée en parole. Elle rend aussi plus fidèlement l’idée de priorité parmi le groupe et l’origine sacerdotale d’Éléazar, sans modifier le sens du passage ni les deux ancrages de notes.
