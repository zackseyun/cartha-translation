translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe grecque très appositionnelle a été répartie en deux phrases pour assurer la lisibilité. La majuscule à « Loi » indique ici la Loi juive. Le passif final, souvent aplani dans les traductions, est maintenu afin de ne pas effacer la possible contrainte physique.
