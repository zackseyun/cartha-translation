  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: fr
  text: Mais, après que beaucoup eurent été arrêtés, un Hébreu nommé Éléazar, le premier du groupe[a], de lignée sacerdotale et versé dans la Loi[b], avancé en âge et connu de beaucoup de gens de l’entourage du tyran à cause de son âge, prit la parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du troupeau ». Le grec emploie cette image pour désigner le groupe des Hébreux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « expert dans la Loi ». Le grec présente Éléazar comme savant en matière de Loi, et non comme un professionnel du droit au sens moderne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντων
  choice: tandis qu’on en arrêtait beaucoup
  rationale: Le participe au génitif absolu évoque une saisie collective et forcée. « Arrêtait » est naturel en français et convient au contexte, sans préciser excessivement la manière de l’arrestation.
- source_word: εἷς πρῶτος ἐκ τῆς ἀγέλης
  choice: le premier que l’on fit sortir du troupeau
  rationale: Cette formulation rend l’idée d’un homme pris en premier parmi le groupe tout en conservant l’image concrète de ἀγέλη, « troupeau ».
- source_word: Ἑβραῖος
  choice: un Hébreu
  rationale: Le grec désigne explicitement Éléazar comme Hébreu ; cette traduction évite de remplacer le terme par une désignation plus interprétative.
- source_word: τὸ γένος ἱερεύς
  choice: prêtre de naissance
  rationale: La tournure indique son origine ou son ascendance sacerdotale. « Prêtre de naissance » reste concise et proche de la structure grecque.
- source_word: τὴν ἐπιστήμην νομικός
  choice: versé dans la Loi
  rationale: La phrase caractérise sa compétence et son savoir relatifs à la Loi. « Versé dans la Loi » est idiomatique, digne, et n’évoque pas à tort un juriste au sens professionnel moderne.
- source_word: τὴν ἡλικίαν προήκων
  choice: avancé en âge
  rationale: Expression française naturelle et digne pour désigner un homme parvenu à un âge avancé.
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: connu de beaucoup de gens de l’entourage du tyran
  rationale: La locution grecque désigne les personnes qui entourent le tyran, c’est-à-dire son entourage ou son cercle.
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: on lui ouvrit la bouche
  rationale: La forme grecque est passive et indique littéralement que sa bouche était ouverte, vraisemblablement sous la contrainte. La traduction conserve ce détail plutôt que de le transformer en l’idiome actif « il ouvrit la bouche ».
