  source_fidelity: 'La révision corrige surtout le dernier membre : ἠνῴχετο τὸ στόμιον αὐτοῦ ne permet pas d’introduire un agent indéfini (« On lui ouvrit la bouche »). Dans ce contexte narratif, l’expression décrit Éléazar qui commence à parler. « Prendre la parole » rend l’idiome sans ajouter l’idée d’une contrainte physique. « De lignée sacerdotale » exprime plus exactement τὸ γένος ἱερεύς, qui concerne l’origine familiale.'
  naturalness: Le texte révisé conserve un français narratif moderne et soutenu, tout en évitant « le premier que l’on fit sortir », qui ajoutait une action de faire sortir absente du grec. La construction appositionnelle reste lisible.
  terminology: « Hébreu », « Loi », « tyran » et « lignée sacerdotale » sont conservés. « Versé dans la Loi » rend naturellement la compétence relative à la Loi sans évoquer la profession juridique moderne.
