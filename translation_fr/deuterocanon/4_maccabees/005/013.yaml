base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: fr
  text: 'Car réfléchis aussi à ceci : même s’il existe quelque puissance qui veille sur cette religion[a], elle te pardonnerait la transgression commise sous la contrainte en toutes ces choses.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une puissance tutélaire de cette religion ». Le grec ne précise pas l’identité de cette puissance.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle te tiendrait pour excusable pour la transgression commise par nécessité en toutes ces choses ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: réfléchis
  rationale: L’impératif appelle à une réflexion consciente; « réfléchis » est naturel et conserve la force exhortative.
- source_word: θρησκείας
  choice: religion
  rationale: Le terme désigne ici, dans la bouche du persécuteur, l’ensemble de la religion et des pratiques juives, envisagées de l’extérieur.
- source_word: ἐποπτικὴ δύναμις
  choice: une puissance qui veille sur
  rationale: Cette formulation française rend l’idée de surveillance ou de protection sans identifier la puissance à Dieu ni préciser sa nature.
- source_word: συγγνωμονήσειέν
  choice: elle te pardonnerait
  rationale: L’optatif dans cette construction conditionnelle exprime une conséquence éventuelle; « pardonnerait » en restitue clairement la portée.
- source_word: παρανομίᾳ
  choice: la transgression
  rationale: Le mot désigne un acte contraire à la loi; « transgression » conserve ici la dimension juridique et morale sans la généralité plus abstraite de « mépris de la loi ».
- source_word: διʼ ἀνάγκην
  choice: sous la contrainte
  rationale: L’expression renvoie à un acte imposé plutôt que volontaire; cette tournure est idiomatique en français.
- source_word: ἐπὶ πᾶσιν
  choice: dans toutes ces circonstances
  rationale: La formule est comprise globalement en référence aux actes exigés dans le contexte; « circonstances » produit un français naturel tout en laissant la portée exacte légèrement ouverte.
theological_decisions:
- issue: Nature de la « puissance qui veille »
  choice: Une puissance non identifiée qui veille sur la religion juive
  alternative: Dieu lui-même, une puissance providentielle générique ou un gardien surnaturel de cette religion
  rationale: Le grec ne nomme pas Dieu et présente même l’existence de cette puissance comme hypothétique. La traduction conserve donc cette indétermination et la tension théologique du propos.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve le raisonnement hypothétique et persuasif du persécuteur, sans expliciter l’identité de la puissance évoquée.
