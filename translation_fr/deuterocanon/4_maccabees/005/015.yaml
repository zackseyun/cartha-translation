lexical_decisions:
- source_word: λαβὼν
  choice: ayant obtenu
  rationale: Le participe aoriste indique la circonstance antérieure à l’action principale. Avec ἐξουσίαν, « ayant obtenu » exprime naturellement en français l’autorisation accordée dans ce contexte.
- source_word: τοῦ λέγειν
  choice: de parler
  rationale: L’infinitif substantivé précise le domaine de l’autorisation; « la permission de parler » est idiomatique en français.
- source_word: ἐξουσίαν
  choice: la permission
  rationale: Dans ce contexte de prise de parole, ἐξουσία désigne vraisemblablement la liberté ou l’autorisation de parler plutôt qu’un pouvoir officiel.
- source_word: ἤρξατο
  choice: il commença
  rationale: Rend directement le sens inchoatif de ἄρχομαι suivi de l’infinitif.
- source_word: δημηγορεῖν
  choice: à s’adresser à l’assemblée
  rationale: Le verbe évoque une allocution publique devant un groupe assemblé; cette formulation conserve la nuance civique sans connotation péjorative.
- source_word: οὕτως
  choice: en ces termes
  rationale: La locution introduit naturellement en français le contenu du discours qui suit.
