lexical_decisions:
- source_word: καὶ
  choice: Quand
  rationale: Le lien avec le participe aoriste est rendu par une proposition temporelle naturelle en français. La coordination grecque n’exige pas ici un « et » distinct.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom accusatif masculin singulier renvoie à l’homme mentionné dans le contexte.
- source_word: ἰδὼν
  choice: vit
  rationale: Le participe aoriste circonstanciel exprime une action antérieure ou concomitante au verbe principal ; « quand … vit » restitue naturellement cette relation narrative.
- source_word: ὁ Ἀντίοχος
  choice: Antiochos
  rationale: Le nom propre est donné sous sa forme française courante, sans reproduire l’article grec devant le nom.
- source_word: ἔφη
  choice: il dit
  rationale: Verbe narratif courant introduisant des paroles ; « il dit » est naturel et conserve le sujet explicite requis en français.
