    rationale: οὐχ οὕτως ... ὥστε appelle en français une structure telle que « ne ... pas si ... que ». La formulation « ne suis pas vieux et viril au point que » peut se lire comme une simple négation coordonnée plutôt que comme la négation du degré requis pour la conséquence.
  - severity: low
    issue: « Reste jeune » surinterprète légèrement νεάζειν.
    rationale: Le grec dit que la raison « est/devient jeune » sans marquer explicitement la continuité impliquée par « reste ». « Être jeune » conserve l’ambiguïté aspectuelle du texte.
