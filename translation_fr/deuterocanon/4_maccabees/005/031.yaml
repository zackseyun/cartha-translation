  text: I am not so old and manly that[a], for the sake of godliness, my reason should not be youthful.
translation:
  language: fr
  text: Je ne suis pas si vieux et si viril que, par piété envers Dieu[a], ma raison ne puisse être jeune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par dévotion envers Dieu ». Le terme grec désigne une attitude de respect et de fidélité envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: vieux
  rationale: Dans la construction prédicative οὐχ οὕτως εἰμὶ γέρων, « vieux » rend directement l’âge avancé et forme naturellement le contraste avec « jeune ».
- source_word: ἀνδρῶδης
  choice: viril
  rationale: Le terme est explicitement masculin et évoque ici la vigueur et la fermeté propres à l’homme adulte; « viril » en conserve la force rhétorique sans le réduire à la seule maturité.
- source_word: εὐσέβειαν
  choice: piété envers Dieu
  rationale: Dans ce contexte juif de fidélité sous la persécution, εὐσέβεια désigne une dévotion respectueuse orientée vers Dieu. L’ajout explicatif « envers Dieu » évite que « piété » soit compris comme une simple qualité morale.
- source_word: νεάζειν
  choice: reste jeune
  rationale: Le verbe signifie être ou se montrer jeune. « Reste jeune » exprime naturellement en français le contraste métaphorique entre la vieillesse du locuteur et la jeunesse persistante de sa faculté raisonnante.
- source_word: λογισμόν
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement raisonné qui gouverne les passions; « raison » en préserve la portée philosophique mieux que le terme plus large « esprit ».
- source_word: ὥστε μοι ... μὴ νεάζειν τὸν λογισμόν
  choice: au point que ... ma raison ne reste pas jeune
  rationale: La tournure « au point que » restitue la conséquence exprimée par ὥστε avec l’infinitif, tandis que la négation demeure liée à l’ensemble « je ne suis pas ... au point que ».
theological_decisions:
- issue: Rendu de εὐσέβεια dans un contexte juif de martyre
  choice: piété envers Dieu
  alternative: attachement respectueux à Dieu; dévotion envers Dieu
  rationale: Cette formulation garde le terme traditionnel « piété » tout en rendant explicite son orientation théologique, sans introduire une doctrine confessionnelle particulière.
- issue: Force masculine de ἀνδρῶδης
  choice: viril
  alternative: vigoureux; mûr
  rationale: Le grec emploie un terme masculin marqué. « Viril » conserve cette dimension et la tension rhétorique entre l’âge avancé, la vigueur adulte et une raison encore jeune.
- issue: Rapport entre l’âge physique et la raison
  choice: la raison « reste jeune »
  alternative: la raison « soit jeune »; la raison « retrouve sa jeunesse »
  rationale: Le texte affirme métaphoriquement la jeunesse de la raison sous l’effet de la piété, sans préciser nettement s’il s’agit d’une continuité ou d’un renouvellement. « Reste jeune » convient au contexte, tandis que la note signale une autre nuance possible.
translation_notes:
  register: Français international moderne, digne et intelligible. La phrase conserve la formulation paradoxale et le vocabulaire philosophique du passage. « Viril » est maintenu en raison du caractère explicitement masculin du grec; « piété envers Dieu » explicite sobrement la portée religieuse de εὐσέβεια.
