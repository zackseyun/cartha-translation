  source_fidelity: 'Le sens fondamental est bien rendu : le locuteur nie que son âge et sa virilité puissent empêcher la jeunesse métaphorique de son λογισμός, en rapport avec l’εὐσέβεια. Toutefois, « reste jeune » ajoute l’idée de permanence, que νεάζειν n’exprime pas explicitement. La construction française initiale (« Je ne suis pas vieux et viril au point que ») ne restitue pas avec assez de netteté la corrélation οὐχ οὕτως ... ὥστε.'
  naturalness: « Je ne suis pas si vieux et si viril que... » est une formulation moderne, claire et idiomatique qui rend la tournure consécutive grecque. « Que ma raison ne puisse être jeune » explicite naturellement, en français, la conséquence niée sans imposer une durée implicite.
  terminology: « Viril » conserve la force masculine et rhétorique de ἀνδρῶδης. « Raison » est approprié pour λογισμός dans le vocabulaire philosophique de 4 Maccabées. « Piété envers Dieu » est fidèle à εὐσέβεια dans ce contexte et la note offre une alternative recevable.
  issues:
