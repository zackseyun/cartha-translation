  text: For through either one, the law takes equal pride.
translation:
  language: fr
  text: Car, par l’un comme par l’autre, la Loi se glorifie également.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « par chacun des deux, la Loi se glorifie pareillement ». Le grec désigne expressément deux réalités et personnifie la Loi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: par l’un comme par l’autre
  rationale: ἑκάτερος renvoie précisément à deux réalités déjà évoquées et les envisage distributivement. Cette tournure française exprime naturellement que chacune des deux est concernée.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit l’explication ou la justification de l’affirmation précédente; « car » en conserve clairement la fonction.
- source_word: ὡς ὁμοίως
  choice: également
  rationale: L’expression souligne l’égalité entre les deux cas. « Également » en restitue le sens sans reproduire lourdement la formulation grecque.
- source_word: ὁ νόμος
  choice: la Loi
  rationale: Dans ce contexte, νόμος désigne la Loi juive, la Torah. La majuscule signale ce référent précis selon l’usage français courant.
- source_word: ὑπερηφανεῖται
  choice: tire fierté
  rationale: Le verbe exprime ici la fierté ou l’exultation et personnifie la Loi. « Tire fierté » conserve cette image dans un français actuel et digne.
theological_decisions:
- issue: Personnification de la Loi
  choice: « la Loi tire également fierté »
  alternative: « la Loi est également honorée par les deux »
  rationale: Le grec présente explicitement la Loi comme le sujet du verbe exprimant la fierté. Maintenir cette personnification préserve la force rhétorique du texte plutôt que de la convertir en une idée passive d’honneur rendu.
translation_notes:
  register: Français international moderne, sobre et digne. « Par l’un comme par l’autre » est idiomatique tout en conservant la référence distributive à deux éléments; la personnification originale de la Loi est maintenue.
