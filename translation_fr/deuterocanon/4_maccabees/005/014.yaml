lexical_decisions:
- source_word: ἔκθεσμον
  choice: en violation de la Loi
  rationale: Le terme désigne ce qui est contraire à la norme ou à la loi. Dans ce contexte juif, il s’agit de la Loi qui interdit cette consommation ; la majuscule rend cette référence sans ajouter une précision absente du grec.
- source_word: σαρκοφαγίαν
  choice: manger de la viande
  rationale: Expression française naturelle qui conserve le sens concret de « consommation de chair », ici la viande interdite.
- source_word: ἐποτρύνοντος
  choice: le poussait
  rationale: Rend l’idée d’exhortation insistante ou de pression exercée par le tyran.
- source_word: λόγον ᾔτησεν
  choice: demanda la parole
  rationale: Locution idiomatique française correspondant à la demande d’autorisation de parler.
theological_decisions:
- issue: Nature de l’interdit exprimé par ἔκθεσμον
  choice: en violation de la Loi
  alternative: illégalement / de manière contraire à la loi
  rationale: Le contexte concerne les prescriptions alimentaires de la Loi juive. Cette formulation explicite la portée contextuelle du mot sans préciser au-delà du texte quelle viande est en cause.
translation_notes:
  register: Français international moderne, clair et digne. La tournure circonstancielle grecque est rendue par « Tandis que », et les noms propres suivent l’usage français biblique courant.
