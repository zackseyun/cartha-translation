  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: fr
  text: Tu ne souilleras pas non plus ma bouche, rendue vénérable par la vieillesse, ni l’âge d’une vie conforme à la Loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιαινεῖς
  choice: souilleras
  rationale: Le verbe exprime une profanation ou une souillure, ici celle de la bouche par l’acte interdit.
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: ma bouche, rendue vénérable par la vieillesse
  rationale: Cette formulation naturelle conserve la valeur de σεμνόν et prend γήρως comme génitif de cause ou de caractérisation lié à la dignité de la bouche.
- source_word: νομίμου βίου
  choice: d’une vie conforme à la Loi
  rationale: νόμιμος désigne ici une existence réglée par la Loi; la majuscule explicite le contexte de fidélité à la loi juive sans ajouter une doctrine particulière.
- source_word: ἡλικίαν
  choice: les années
  rationale: Dans ce contexte de vieillesse et de vie entière, le terme renvoie à l’âge ou aux années accumulées; «les années» est idiomatique en français.
theological_decisions:
- issue: Portée de νόμιμος
  choice: conforme à la Loi
  alternative: respectueuse de la loi
  rationale: Le contexte maccabéen vise vraisemblablement la fidélité à la Loi de Moïse; «conforme à la Loi» garde cet ancrage religieux sans préciser davantage.
translation_notes:
  register: Français moderne, digne et direct. La coordination négative répétée du grec est conservée par «pas non plus… ni». Aucun marqueur de note n’est nécessaire.
