  text: I will not deny you[a], O law-trained discipline, nor will I spare you[b], beloved self-control.
translation:
  language: fr
  text: Je ne te serai pas infidèle[a], loi éducatrice, et je ne te ménagerai pas[b], maîtrise de soi bien-aimée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne te tromperai pas », « je ne me montrerai pas faux envers toi » ou « je ne te trahirai pas ». Le verbe grec peut désigner le fait de mentir, mais aussi celui de se montrer faux envers une personne.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec s’adresse directement à des réalités personnifiées : littéralement, « loi, éducateur » et « maîtrise de soi bien-aimée ». « Je ne te ménagerai pas » conserve l’image rhétorique du texte.'
    reason: cultural_note
lexical_decisions:
- source_word: ψεύσομαί σε
  choice: je ne te serai pas infidèle
  rationale: Avec un complément de personne, ψεύδομαι peut exprimer le fait de se montrer faux envers quelqu’un. Cette formulation française convient à la promesse de fidélité sans réduire le verbe au simple fait de prononcer un mensonge.
- source_word: παιδευτὰ νόμε
  choice: loi éducatrice
  rationale: Les deux vocatifs forment une apostrophe personnifiée. « Loi éducatrice » restitue avec naturel la fonction formatrice exprimée par παιδευτά tout en gardant νόμος explicite.
- source_word: φείσομαί σε
  choice: je ne te ménagerai pas
  rationale: φείδομαι signifie épargner ou ménager. Le rendu conserve l’image volontairement hardie de l’auteur, qui s’adresse directement à la maîtrise de soi personnifiée.
- source_word: φίλη ἐγκράτεια
  choice: maîtrise de soi bien-aimée
  rationale: ἐγκράτεια désigne la domination exercée sur ses désirs et ses impulsions. « Maîtrise de soi » est courant et précis; « bien-aimée » maintient l’affection et le registre élevé de φίλη.
theological_decisions:
- issue: Personnification de la Loi et de la maîtrise de soi
  choice: Conserver l’adresse directe à la « loi éducatrice » et à la « maîtrise de soi bien-aimée ».
  alternative: Transformer l’apostrophe en une affirmation abstraite sur l’obéissance à la Loi et la pratique de la maîtrise de soi.
  rationale: Les vocatifs grecs présentent explicitement ces réalités comme des interlocutrices personnifiées. Le maintien de cette figure respecte la rhétorique et la tension morale du texte sans y ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe poétique est conservée sans le « ô », peu naturel ici en français courant soutenu. « Loi » prend une minuscule conformément à l’usage général, sans préjuger de sa portée théologique.
