  yaml_path: translation/deuterocanon/4_maccabees/005/001.yaml
  text: So then[a], when the tyrant Antiochus had taken his seat with his council on a certain high place, and their fully armed troops were standing around on every side,
translation:
  language: fr
  text: Le tyran Antiochos avait donc pris place avec les membres de son conseil en un lieu surélevé[a], tandis que leurs troupes, entièrement armées, se tenaient tout autour,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur une hauteur ». L’expression grecque désigne un emplacement élevé, pas nécessairement un « haut lieu » cultuel.'
    reason: La formulation peut désigner diverses sortes d’emplacements élevés; la note prévient aussi une lecture cultuelle injustifiée.
lexical_decisions:
- source_word: Προκαθίσας
  choice: avait pris place
  rationale: Cette formulation naturelle présente Antiochos assis en position d’autorité et conserve la valeur d’antériorité du participe dans la mise en scène.
- source_word: γέ τοι
  choice: donc
  rationale: La particule composée marque avec insistance la transition dans le récit; « donc » en restitue sobrement la fonction discursive.
- source_word: μετὰ τῶν συνέδρων
  choice: avec les membres de son conseil
  rationale: Le terme désigne ceux qui siègent avec Antiochos dans un conseil. Cette expression est plus précise en français que le collectif « avec son conseil ».
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: Le grec porte un jugement explicitement négatif sur Antiochos; il ne convient pas de l’atténuer par « roi » ou « souverain ».
- source_word: Ἀντίοχος
  choice: Antiochos
  rationale: La forme française « Antiochos » suit directement le nom grec et l’usage courant pour ce personnage.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: en un lieu surélevé
  rationale: La phrase désigne un emplacement élevé sans lui attribuer nécessairement une fonction cultuelle. « Un » rend l’indéfini τινος.
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: leurs troupes
  rationale: Le pluriel possessif αὐτῶν est conservé plutôt que ramené silencieusement au seul Antiochos.
- source_word: παρεστηκότων
  choice: se tenaient
  rationale: Le participe décrit les troupes debout et présentes autour du groupe; « se tenaient » restitue naturellement cette posture.
- source_word: κυκλόθεν
  choice: tout autour
  rationale: Cette expression française rend l’idée d’un encerclement de tous côtés.
- source_word: εὐόπλων
  choice: entièrement armées
  rationale: L’adjectif indique que les troupes disposent pleinement de leur armement et contribue à l’atmosphère menaçante de la scène.
theological_decisions:
- issue: Jugement porté sur Antiochos par le terme τύραννος
  choice: Conserver « le tyran » dans le texte principal
  alternative: « le souverain » ou « le roi »
  rationale: Le terme source est délibérément péjoratif. Le rendre par un titre neutre effacerait l’évaluation morale exprimée par l’auteur.
translation_notes:
  register: Français international moderne, naturel et digne. La structure demeure une proposition circonstancielle ouverte, conformément à la virgule finale du texte source. Le marqueur de note [a] est placé immédiatement après l’expression qu’il explique.
