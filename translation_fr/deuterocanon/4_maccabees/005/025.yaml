  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: fr
  text: C’est pourquoi nous ne mangeons rien de souillé[a]. En effet, puisque nous croyons que la Loi a été établie par Dieu, nous savons que le Créateur du monde, lorsqu’il donne la Loi[b], tient aussi compte de notre nature.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « nous ne mangeons pas ce qui est souillé ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre le grec ainsi : « le Créateur du monde, lorsqu’il légifère, éprouve aussi de la sympathie pour nous conformément à la nature ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
  choice: nous ne mangeons rien de souillé
  rationale: Le verbe composé désigne le fait de manger ce qui est souillé. Cette formulation naturelle en français conserve l’idée de souillure sans imposer une catégorie rituelle plus précise que le grec.
- source_word: πιστεύοντες
  choice: puisque nous croyons
  rationale: Le participe a ici une valeur causale et explique le refus exprimé dans la proposition précédente.
- source_word: καθέστασθαι
  choice: a été établie
  rationale: L’infinitif parfait présente la Loi comme instituée et demeurant en vigueur.
- source_word: νόμον
  choice: la Loi
  rationale: L’article renvoie à la Loi divine déterminée qui régit la conduite d’Israël; la majuscule rend cette référence conventionnelle clairement en français.
- source_word: συμπαθεῖ
  choice: tient compte de
  rationale: Le verbe exprime la sympathie ou la considération envers quelqu’un. « Tient compte de » est idiomatique et convient à l’activité législative, tout en évitant le sens moderne trop affectif de « sympathiser ».
- source_word: κατὰ φύσιν
  choice: de notre nature
  rationale: Associée à ἡμῖν et συμπαθεῖ, l’expression indique que le Créateur légifère avec considération pour ce que nous sommes par nature, sans exclure la lecture plus littérale « conformément à la nature ».
- source_word: νομοθετῶν
  choice: lorsqu’il donne la Loi
  rationale: Le participe décrit le Créateur dans son activité législatrice. Cette expression est naturelle en français et maintient le lien avec « la Loi ».
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: le Créateur du monde
  rationale: Traduction directe du titre grec, qui en conserve la portée cosmique et théologique.
theological_decisions:
- issue: Portée du refus alimentaire
  choice: Le locuteur refuse de manger ce qui est souillé.
  alternative: « Nous ne nous souillons pas en mangeant » ou « nous ne mangeons pas d’aliments souillants ».
  rationale: Le verbe composé porte lui-même l’idée de manger ce qui est souillé; la formulation retenue préserve cette force sans ajouter une précision doctrinale.
- issue: Rapport entre la législation divine et la nature
  choice: En donnant la Loi, le Créateur tient compte de notre nature.
  alternative: « Lorsqu’il légifère, le Créateur du monde éprouve de la sympathie pour nous conformément à la nature. »
  rationale: Le datif ἡμῖν oriente συμπαθεῖ vers la considération accordée aux humains, tandis que κατὰ φύσιν peut qualifier cette considération ou la manière de légiférer. Une note conserve l’autre construction possible.
translation_notes:
  register: Français international moderne, digne et accessible. « La Loi » est employé pour la loi divine déterminée. La phrase demeure proche de la structure argumentative grecque, tout en évitant un calque peu naturel de συμπαθεῖ.
