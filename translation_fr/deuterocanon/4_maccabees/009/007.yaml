  - severity: low
    issue: Rendu interprétatif de εὐσέβεια par « attachement à Dieu »
    rationale: Le choix est compatible avec le contexte, mais « fidélité à Dieu » exprime plus précisément la persévérance religieuse qui motive la persécution, sans réduire εὐσέβεια à un sentiment d’attachement.
