  source_fidelity: 'Le sens général est bien rendu : le tyran est défié, la mise à mort est envisagée comme conséquence de l’εὐσέβεια, et la torture ne constitue pas un véritable tort. « Vas-y » est toutefois plus relâché que l’impératif grec πεῖραζε dans cette déclaration solennelle. « Attachement à Dieu » explicite légitimement le contexte, mais « fidélité à Dieu » rend plus directement la constance religieuse visée par εὐσέβεια.'
  naturalness: Le français est fluide, mais « Vas-y » relève d’un registre oral familier qui détonne avec l’apostrophe « tyran » et le martyrologe rhétorique. « Essaie donc » garde le défi tout en restant plus digne et international.
  terminology: « Mettre à mort » rend clairement θανατώσεις τὰς ... ψυχὰς sans imposer une lecture doctrinale de ψυχή comme « âme » distincte. « Fidélité à Dieu » est une formulation moderne, naturelle et contextuellement fidèle pour εὐσέβεια.
