  yaml_path: translation/deuterocanon/4_maccabees/009/007.yaml
  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: fr
  text: Essaie donc, tyran ! Même si tu nous mets à mort à cause de notre fidélité à Dieu, ne pense pas qu’en nous torturant, tu nous fais du mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεῖραζε
  choice: Vas-y
  rationale: Dans cette apostrophe provocatrice au tyran, l’impératif signifie « essaie donc / poursuis », rendu naturellement par « Vas-y ».
- source_word: τὰς ἡμῶν ψυχὰς ... θανατώσεις
  choice: tu nous ôtes la vie
  rationale: Bien que ψυχή puisse désigner l’âme, avec θανατόω le sens contextuel est celui de faire mourir, d’ôter la vie. Cette formulation évite l’expression peu naturelle « tuer nos vies » sans introduire une doctrine de l’âme.
- source_word: διὰ τὴν εὐσέβειαν
  choice: à cause de notre attachement à Dieu
  rationale: Dans le contexte de 4 Maccabées, εὐσέβεια désigne la fidélité religieuse envers Dieu; « attachement à Dieu » est clair, actuel et conserve la motivation religieuse.
- source_word: βλάπτειν
  choice: tu nous fais du mal
  rationale: Rend directement l’idée de nuire ou de causer un tort.
theological_decisions:
- issue: Sens de ψυχή dans l’expression θανατώσεις τὰς ἡμῶν ψυχὰς
  choice: tu nous ôtes la vie
  alternative: tu fais mourir nos âmes
  rationale: Le verbe θανατόω oriente ici ψυχή vers la vie terrestre des martyrs. Traduire par « âmes » risquerait d’impliquer que le tyran peut détruire l’âme, alors que le propos porte sur leur mise à mort et sur l’impossibilité de leur causer un tort véritable.
- issue: Portée de εὐσέβεια
  choice: notre attachement à Dieu
  alternative: notre piété
  rationale: « Piété » est possible mais peut paraître vague ou désigner une pratique dévotionnelle; le contexte vise la fidélité à Dieu qui motive leur résistance.
translation_notes:
  register: Français moderne, digne et oralement énergique. L’apostrophe « tyran » et l’exclamation conservent le défi du grec; la seconde phrase reste sobre et intelligible.
