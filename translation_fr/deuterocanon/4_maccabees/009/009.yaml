  source_fidelity: 'Le sens général est bien rendu : l’apostrophe adversative, la responsabilité liée à μιεροφονία, la rétribution divine, le tourment éternel et le feu sont tous conservés. Toutefois, « que tu commets contre nous » introduit un présent explicite absent du grec et alourdit l’expression du génitif ἡμῶν. « Dont nous sommes victimes » rend plus directement le rapport des victimes tout en ne fixant pas indûment le moment de l’acte. « Par l’effet de » est explicatif mais moins direct que la relation d’agent ou de cause exprimée par ὑπό.'
  naturalness: Le texte est globalement solennel et naturel. La phrase révisée rend l’accusation plus idiomatique en français moderne et place l’attribution à la justice divine dans une relative claire. « Subiras pleinement » conserve de façon acceptable l’intensification associée à αὐτάρκη.
  terminology: « Meurtre sacrilège » est un bon rendu compact de μιεροφονία, avec une note qui maintient l’autre orientation possible, le meurtre de personnes saintes ou consacrées. « Tourment éternel » rend βάσανον et αἰώνιον sans imposer de système doctrinal. « Par le feu » préserve la valeur instrumentale possible de διὰ πυρός.
