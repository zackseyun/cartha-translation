  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: fr
  text: Mais toi, à cause du meurtre sacrilège dont nous sommes victimes[a], tu subiras pleinement un tourment éternel par le feu, infligé par la justice divine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «du meurtre de personnes saintes [ou consacrées]».
    reason: lexical_alternative
  - marker: b
    text: Ou «un tourment éternel au moyen du feu» ou «dans le feu».
    reason: lexical_alternative
lexical_decisions:
- source_word: μιεροφονίαν
  choice: meurtre sacrilège que tu commets contre nous
  rationale: Le composé rare désigne un meurtre marqué par le sacrilège, ici celui des frères consacrés à Dieu. La formulation explicite la valeur objective du génitif ἡμῶν tout en conservant la dimension religieuse du terme.
- source_word: αὐτάρκη καρτερήσεις
  choice: tu subiras pleinement
  rationale: καρτερέω exprime le fait d’endurer avec constance ou de supporter; αὐτάρκη renforce ici l’idée d’une peine subie dans toute sa mesure. «Subiras pleinement» rend cette intensification sans suggérer que le tourment serait simplement «suffisant» au sens courant.
- source_word: θείας δίκης
  choice: par l’effet de la justice divine
  rationale: δίκη peut désigner la justice, le jugement ou la rétribution. Cette formulation conserve à la fois la causalité exprimée par ὑπό et la portée judiciaire du syntagme.
- source_word: αἰώνιον βάσανον
  choice: un tourment éternel
  rationale: βάσανος désigne un supplice ou tourment sévère, tandis que αἰώνιος en indique ici la durée. Le rendu reste fort sans substituer une formulation doctrinale technique.
- source_word: διὰ πυρός
  choice: par le feu
  rationale: διά avec le génitif indique ici le moyen ou l’instrument du tourment; «par le feu» en offre un rendu direct et naturel.
theological_decisions:
- issue: Nature et durée de la peine
  choice: un tourment éternel par le feu
  alternative: un supplice perpétuel dans le feu
  rationale: La traduction maintient la force judiciaire de δίκη, la sévérité de βάσανος et la durée exprimée par αἰώνιος, sans préciser davantage la nature métaphysique de la peine.
- issue: Qualification du meurtre
  choice: meurtre sacrilège que tu commets contre nous
  alternative: meurtre de personnes saintes
  rationale: μιεροφονία peut mettre l’accent soit sur le caractère sacrilège de l’acte, soit sur la sainteté de ses victimes. Le texte principal retient le premier sens et la note préserve le second.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe «Mais toi» conserve l’opposition emphatique de σὺ δέ. La phrase demeure solennelle et accusatrice, conformément au contexte de martyre.
