- from: Mais toi, à cause du meurtre sacrilège que tu commets contre nous[a], tu subiras pleinement, par l’effet de la justice divine, un tourment éternel par le feu[b].
  to: Mais toi, à cause du meurtre sacrilège dont nous sommes victimes[a], tu subiras pleinement un tourment éternel par le feu, infligé par la justice divine[b].
  rationale: La révision supprime l’ajout temporel de la relative « que tu commets », rend plus nettement le génitif ἡμῶν comme les victimes du meurtre, et formule plus naturellement le rôle de la justice divine. Elle corrige aussi la qualification inexacte de la note b, tout en préservant les ambiguïtés lexicales de μιεροφονία et de διὰ πυρός.
