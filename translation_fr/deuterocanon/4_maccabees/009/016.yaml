lexical_decisions:
- source_word: δορυφόρων
  choice: gardes
  rationale: Dans ce contexte royal et coercitif, le terme désigne les gardes armés qui entourent le souverain; « gardes » est naturel et précis en français moderne.
- source_word: Ὁμολόγησον
  choice: Accepte
  rationale: L’impératif demande ici au martyr de consentir à manger; « accepte » rend la valeur contextuelle sans introduire le sens religieux moderne de « confesse ».
- source_word: φαγεῖν
  choice: de manger
  rationale: L’infinitif complète directement l’idée de consentement exprimée par Ὁμολόγησον.
- source_word: ἀπαλλαγῇς
  choice: être relâché
  rationale: Le passif exprime la libération de la contrainte ou de la détention; « être relâché » conserve cette nuance concrète.
