lexical_decisions:
- source_word: ἐμολύνετο
  choice: était souillée
  rationale: « Souillée » conserve la force de contamination du verbe grec, tandis qu’une note signale le sens concret possible de « tachée ».
- source_word: πάντοθεν αἵματι
  choice: de sang de tous côtés
  rationale: Cette formulation rend naturellement l’étendue spatiale indiquée par πάντοθεν et le datif αἵματι.
- source_word: ὁ τροχός
  choice: la roue
  rationale: Équivalent direct, clair dans le contexte de l’instrument de torture.
- source_word: ὁ σωρὸς τῆς ἀνθρακιᾶς
  choice: le tas de braises
  rationale: « Braises » évoque naturellement un amas de charbons ardents sans préciser davantage que le grec.
- source_word: ἐσβέννυτο
  choice: s’éteignait
  rationale: L’imparfait français restitue le procès en cours exprimé par l’imparfait grec.
- source_word: τοῖς τῶν ἰχώρων ... σταλαγμοῖς
  choice: sous les gouttes de liquide provenant des plaies
  rationale: Le grec ἰχώρ désigne un liquide s’écoulant des blessures. Cette traduction reste intelligible sans employer le terme français rare et mythologiquement marqué « ichor ».
- source_word: αἱ σάρκες
  choice: les chairs
  rationale: Le pluriel « les chairs » respecte le pluriel grec et rend le caractère macabre de la scène avec une expression française naturelle.
- source_word: περιέρεον
  choice: ruisselaient
  rationale: Le verbe exprime un écoulement continu autour des axes; « ruisselaient » restitue cette image de façon concise et vive.
- source_word: περὶ τοὺς ἄξονας
  choice: autour des axes
  rationale: Traduction spatiale directe de la préposition et du substantif pluriel.
- source_word: τοῦ ὀργάνου
  choice: de l’appareil
  rationale: « Appareil » désigne clairement le dispositif mécanique de torture tout en restant proche du sens général d’ὄργανον.
