  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
translation:
  language: fr
  text: 'La roue était souillée de sang de tous côtés[a], et le tas de braises s’éteignait sous l’effet des gouttes de liquide provenant des plaies[b], et les chairs s’écoulaient autour des axes de l’appareil.


    [a] Ou : « était tachée de sang de tous côtés ». Le verbe grec peut exprimer une souillure ou une contamination, mais aussi, dans ce contexte concret, l’idée d’une tache.


    [b] Littéralement : « sous les gouttes des ichors ». Le terme grec désigne ici le liquide qui s’écoule des plaies.'
  philosophy: optimal-equivalence
  footnotes:
