    issue: Parallélisme syntaxique et rattachement de ὡς
    rationale: Dans « s’irrita contre eux, non seulement comme contre des hommes…, mais il entra aussi en fureur comme contre des ingrats », la construction « non seulement… mais il… » est déséquilibrée et le premier « contre eux » précède une qualification qui devrait porter explicitement sur la manière dont le tyran les considérait. La correction rattache les deux qualifications aux deux réactions de colère.
