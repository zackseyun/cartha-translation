  verdict: revise
  source_fidelity: La traduction rend correctement le génitif absolu, « le tyran », les deux qualifications masculines plurielles et l’opposition « non seulement… mais aussi ». Toutefois, « s’irrita contre eux, non seulement comme contre… » dissocie maladroitement le premier mouvement de colère de la qualification introduite par ὡς, et la seconde proposition n’explicite plus « contre eux ».
  naturalness: 'Le français du projet est globalement soutenu et actuel, mais le parallélisme actuel est syntaxiquement déséquilibré : « non seulement comme contre…, mais il entra… ». Une reformulation avec « en les tenant pour » rend naturellement la perspective imputée au tyran et conserve la structure rhétorique.'
