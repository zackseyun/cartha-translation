  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: fr
  text: Quand ils eurent dit cela[a], le tyran ne s’irrita pas seulement contre eux en les tenant pour des hommes qui refusaient d’obéir, mais il se mit aussi en colère contre eux en les tenant pour des ingrats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus brièvement : « non seulement contre des désobéissants, mais aussi contre des ingrats ». Le grec emploie des formes masculines plurielles sans nom exprimé ; la traduction précise « des hommes » d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα αὐτῶν εἰπόντων
  choice: Quand ils eurent dit cela
  rationale: Le génitif absolu à participe aoriste reçoit une valeur temporelle naturelle. « Cela » reprend collectivement les paroles précédentes sans surcharger la formulation.
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: Le terme grec porte ici un jugement défavorable sur le souverain oppresseur; « roi » ou « dirigeant » en atténuerait la force.
- source_word: ἐχαλέπαινεν
  choice: s’irrita contre eux
  rationale: L’imparfait exprime une colère en cours ou persistante. Le complément « contre eux », implicite dans la construction grecque avec κατὰ, rend la phrase claire en français.
- source_word: ὡς κατὰ ἀπειθούντων
  choice: comme contre des hommes qui refusaient d’obéir
  rationale: ὡς présente la manière dont le tyran les considérait plutôt qu’une affirmation neutre du narrateur. Le participe masculin pluriel désigne les frères, et ἀπειθέω marque ici le refus d’obéir.
- source_word: ὠργίσθη
  choice: il entra aussi en fureur
  rationale: L’aoriste de ὀργίζομαι marque ici une vive réaction de colère. Cette formulation distingue naturellement ce verbe de l’imparfait ἐχαλέπαινεν tout en conservant l’intensification rhétorique.
- source_word: ὡς καὶ κατὰ ἀχαρίστων
  choice: mais il entra aussi en fureur comme contre des ingrats
  rationale: « Ingrats » conserve l’accusation morale portée par ἀχάριστος, tandis que « comme contre » préserve le point de vue attribué au tyran par ὡς.
