  text: So[a], when they were ordered to do so, the torturers brought forward the eldest of them, and after tearing open his tunic, they bound his hands and arms on both sides with straps.
translation:
  language: fr
  text: C’est pourquoi, après en avoir reçu l’ordre, les tortionnaires[a] amenèrent leur aîné. Après avoir déchiré sa tunique, ils lui lièrent les mains et les bras avec des courroies, de part et d’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec rendu par « tortionnaires » présente ici une forme textuellement et lexicalement inhabituelle ; le contexte indique clairement qu’il s’agit des hommes du roi chargés d’exécuter la torture.
    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit la conséquence narrative de ce qui précède, dans un français naturel mais soutenu.
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: l’aîné des frères
  rationale: Le superlatif désigne le plus âgé du groupe; le contexte identifie clairement celui-ci comme la fratrie.
- source_word: κελευσθέντες
  choice: sur l’ordre qui leur fut donné
  rationale: Rend le participe aoriste passif comme une circonstance préalable sans préciser qui donna l’ordre, conformément au grec.
- source_word: οἱ μιστισταί
  choice: les tortionnaires
  rationale: Le terme transmis est inhabituel, mais le contexte désigne les hommes chargés d’infliger la torture.
- source_word: παρήγαγον
  choice: amenèrent
  rationale: Exprime le fait de conduire la victime en avant ou sur les lieux de la torture.
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: Après avoir déchiré sa tunique
  rationale: χίτων désigne une tunique; le participe indique une action préalable et violente.
- source_word: διέδησαν
  choice: attachèrent
  rationale: Rend l’idée de lier solidement tout en s’accordant naturellement avec les courroies mentionnées ensuite.
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: les mains et les bras
  rationale: Conserve sans surinterprétation les deux parties du corps nommées dans le grec.
- source_word: ἱμᾶσιν
  choice: avec des courroies
  rationale: ἱμάς désigne une lanière ou courroie, souvent de cuir; « courroies » est clair en français actuel.
- source_word: ἑκατέρωθεν
  choice: de part et d’autre
  rationale: Préserve l’indication bilatérale sans imposer une reconstruction précise du dispositif.
