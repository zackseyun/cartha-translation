  verdict: revise
  source_fidelity: 'La traduction rend fidèlement la progression narrative et les éléments matériels : ordre reçu, présentation de l’homme le plus âgé, tunique déchirée, mains et bras liés par des courroies des deux côtés. Toutefois, « l’aîné des frères » introduit « frères », qui n’est pas exprimé dans ce verset (αὐτῶν, « d’entre eux / leur »), même si le contexte peut l’indiquer.'
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Après en avoir reçu l’ordre » est plus direct et idiomatique que « sur l’ordre qui leur fut donné », tout en conservant l’agent non exprimé.
  terminology: « Tortionnaires », « tunique » et « courroies » conviennent. « Lièrent » restitue plus directement διέδησαν que « attachèrent ». La note signale correctement la difficulté textuelle et lexicale de μιστισταί sans la résoudre de façon excessive.
