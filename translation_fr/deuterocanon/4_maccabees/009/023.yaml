  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: fr
  text: '« Imitez-moi, frères, dit-il sur le chevalet de torture[a] : ne désertez pas, alors que je n’abandonne pas le combat, et ne reniez pas, à cause de moi, la fraternité du courage. Menez le combat sacré et noble pour la fidélité à Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les tortures ». Le grec évoque probablement plus précisément le chevalet de torture.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour la piété ». Ici, le mot grec désigne la dévotion fidèle envers Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: sur le chevalet de torture
  rationale: La forme transmise est difficile, mais le contexte évoque concrètement l’instrument de torture; cette traduction conserve cette image sans réduire l’expression à la seule idée générale de souffrance.
- source_word: Μιμήσασθέ με
  choice: Imitez-moi
  rationale: L’impératif appelle directement les frères à prendre le supplicié pour modèle.
- source_word: ἀδελφοί
  choice: frères
  rationale: Dans le récit, le locuteur s’adresse à ses frères au sens propre; le masculin contextuel doit donc être conservé.
- source_word: μὴ λειπὼν τὸν ἀγῶνα λειποτακτήσητε
  choice: Puisque je n’ai pas abandonné le combat, ne désertez pas en l’abandonnant vous-mêmes
  rationale: Le participe peut porter une nuance causale ou circonstancielle, tandis que λειποτακτέω appartient au registre militaire. La formulation française maintient le contraste et associe le combat à la désertion sans ajouter un « poste » absent du grec.
- source_word: ἐξομόσησθέ μου
  choice: ne reniez pas, à cause de moi
  rationale: Le verbe exprime une répudiation ou un reniement. Le génitif μου est conservé avec une formulation causale naturelle, tout en laissant subsister une certaine ambiguïté syntaxique.
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: la fraternité du courage
  rationale: La traduction préserve à la fois le lien fraternel et la fermeté courageuse exprimée par εὐψυχία.
- source_word: ἱερὰν καὶ εὐγενῆ στρατείαν στρατεύσασθε
  choice: Menez le combat sacré et noble
  rationale: Le grec emploie un nom et un verbe apparentés pour renforcer l’image militaire. Une répétition étymologique serait lourde en français; « mener le combat » en restitue naturellement la vigueur.
- source_word: περὶ τῆς εὐσεβείας
  choice: pour la fidélité à Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne la dévotion fidèle envers Dieu, vécue jusque dans l’obéissance sous la persécution. Cette formulation est claire en français moderne et explicite la référence divine.
theological_decisions:
- issue: Portée de εὐσέβεια dans le contexte du martyre
  choice: fidélité à Dieu
  alternative: piété
  rationale: « Fidélité à Dieu » rend la dévotion active et persévérante visée ici, tandis que « piété » peut aujourd’hui évoquer une religiosité plus étroite ou seulement intérieure.
- issue: Sens de ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: Il s’agit ici de frères au sens narratif et familial, non d’une assemblée mixte générique.
- issue: Lien syntaxique de μου avec ἐξομόσησθέ
  choice: à cause de moi
  alternative: ne reniez pas ma fraternité du courage
  rationale: Le génitif peut être compris de plusieurs manières. La traduction retient la valeur « à cause de moi », attestée par le contexte de l’exemple fraternel, sans transformer le locuteur en possesseur explicite de la fraternité.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire militaire du passage est maintenu par « désertez » et « combat », sans ajouter des éléments non exprimés dans le grec. La ponctuation transforme la longue exhortation grecque en phrases françaises lisibles.
