  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
translation:
  language: fr
  text: par laquelle notre providence juste et ancestrale, devenue favorable[a] au peuple, puisse punir le tyran maudit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bienveillante » ou « propice » ; le grec exprime une disposition favorable.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi évoquer ce qui est funeste, maudit, ou associé à une vengeance vengeresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἧς
  choice: par laquelle
  rationale: διά suivi du relatif au génitif exprime ici le moyen. Le féminin du relatif est conservé sans préciser dans ce verset isolé quel est son antécédent.
- source_word: ἵλεως
  choice: favorable
  rationale: Le terme désigne une disposition bienveillante ou propice. « Favorable » s’accorde naturellement avec le complément « à notre peuple » sans réduire le sens à la seule compassion.
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: notre providence juste et ancestrale
  rationale: « Providence » garde le registre théologique de πρόνοια sans ajouter explicitement « divine ». « Ancestrale » rend πάτριος, qui renvoie aux pères et à la tradition reçue, plutôt qu’à une qualité paternelle.
- source_word: τῷ ἔθνει
  choice: à notre peuple
  rationale: Le datif dépend de l’idée d’être favorable. Dans ce contexte collectif juif, « notre peuple » est plus naturel en français que « la nation » et explicite sans ambiguïté la relation indiquée par le contexte et le possessif de la proposition.
- source_word: γενηθεῖσα
  choice: devenue
  rationale: Le participe aoriste de γίνομαι présente la providence comme étant devenue ou s’étant montrée favorable, tout en conservant la construction participiale.
- source_word: τιμωρήσειεν
  choice: puisse punir
  rationale: Le subjonctif introduit par « puisse » restitue la valeur souhaitée ou potentielle de l’optatif, mieux qu’un futur catégorique.
- source_word: τὸν ἀλάστορα τύραννον
  choice: le tyran maudit
  rationale: ἀλάστωρ est une désignation fortement réprobatrice pouvant évoquer un être maudit, funeste ou lié à la vengeance. « Maudit » rend clairement la condamnation sans transformer le tyran en agent légitime de vengeance.
theological_decisions:
- issue: Référence de « notre providence juste et ancestrale »
  choice: Conserver « providence » sans ajouter « de Dieu »
  alternative: Expliciter « la providence de Dieu » ou comprendre une providence impersonnelle
  rationale: Le contexte favorise une évocation révérencieuse de la sollicitude providentielle liée à la foi des ancêtres d’Israël, mais le grec ne nomme pas Dieu dans cette proposition. La formulation maintient cette tension.
- issue: Valeur modale de l’optatif τιμωρήσειεν
  choice: Exprimer le souhait ou la possibilité par « puisse punir »
  alternative: Employer l’indicatif « punira » ou le conditionnel « punirait »
  rationale: L’optatif dans ce contexte rhétorique ou proche de la prière ne garantit pas simplement un résultat futur; « puisse » en préserve la nuance.
translation_notes:
  register: Français moderne, sobre et soutenu. La syntaxe conserve le mouvement de la proposition grecque et son caractère de souhait. La minuscule à « providence » évite d’expliciter plus que le grec son caractère divin.
