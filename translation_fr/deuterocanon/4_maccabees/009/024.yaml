    issue: Ajout du possessif dans « à notre peuple »
    rationale: Le grec porte τῷ ἔθνει (« au peuple / à la nation »). Le possessif ἡμῶν appartient à πρόνοια, non à ἔθνει. Il convient de ne pas déplacer ou ajouter ce possessif.
  - severity: low
    issue: Formulation de la note b
    rationale: Dire seulement que le mot peut qualifier « une figure vengeresse » peut faire comprendre que le tyran est qualifié comme agent de vengeance. La note devrait indiquer plus précisément la plage sémantique funeste, maudite ou liée à une vengeance vengeresse, sans trancher au-delà du grec.
