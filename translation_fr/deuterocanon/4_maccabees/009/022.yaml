lexical_decisions:
- source_word: ἀλλʼ
  choice: mais
  rationale: Conjonction adversative marquant le contraste avec la description précédente.
- source_word: ὥσπερ
  choice: comme s’il
  rationale: Introduit une comparaison sans présenter la transformation comme une affirmation littérale dépourvue de nuance.
- source_word: ἐν πυρί
  choice: dans le feu
  rationale: Conserve l’image et le sens locatif les plus immédiats, sans exclure une nuance instrumentale.
- source_word: μετασχηματιζόμενος
  choice: était transformé
  rationale: Rend le participe présent moyen-passif et son idée de changement d’état ou de forme dans un français naturel.
- source_word: εἰς ἀφθαρσίαν
  choice: pour parvenir à l’incorruptibilité
  rationale: La préposition εἰς exprime l’aboutissement de la transformation; «incorruptibilité» préserve l’étendue sémantique et la portée eschatologique de ἀφθαρσία.
- source_word: ὑπέμεινεν
  choice: supporta
  rationale: Exprime l’endurance ferme sous la souffrance tout en restant idiomatique.
- source_word: εὐγενῶς
  choice: noblement
  rationale: Préserve la qualité morale et rhétorique du comportement soulignée par l’adverbe.
- source_word: τὰς
  choice: les…
  rationale: Le texte grec transmis ici s’interrompt sur l’article défini féminin pluriel; une suspension signale honnêtement l’objet manquant au lieu d’ajouter un démonstratif absent.
theological_decisions:
- issue: Portée de εἰς ἀφθαρσίαν dans le contexte du martyre
  choice: pour parvenir à l’incorruptibilité
  alternative: pour parvenir à l’immortalité / à l’état impérissable
  rationale: ἀφθαρσία désigne l’absence de corruption ou de destruction et peut inclure l’immortalité, mais ne doit pas être réduit sans nécessité à la seule durée infinie de la vie.
- issue: Statut de la transformation introduite par ὥσπερ
  choice: comme s’il était transformé
  alternative: tandis qu’il était transformé
  rationale: La comparaison grecque maintient une nuance rhétorique; la traduction évite d’en faire une définition doctrinale explicite du processus subi par le martyr.
translation_notes:
  register: Français moderne, digne et rhétorique. L’imparfait dans « était transformé » rend le processus contemporain de l’endurance; les points de suspension indiquent l’interruption matérielle du grec fourni.
