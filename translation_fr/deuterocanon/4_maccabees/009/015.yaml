base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: fr
  text: Tyran, le plus souillé de tous, ennemi de la justice céleste[a], homme au cœur cruel, ce n’est pas pour avoir commis un meurtre que tu me tortures de cette manière, ni pour avoir agi avec impiété, mais parce que je défends la loi divine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du jugement céleste ». Le mot grec peut désigner aussi bien la justice au sens large que le jugement ou le châtiment judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερώτατε
  choice: souillé entre tous
  rationale: Le superlatif vocatif exprime une souillure morale et religieuse extrême. Cette formulation conserve l’invective tout en restant naturelle et digne en français.
- source_word: τῆς οὐρανίου δίκης
  choice: de la justice céleste
  rationale: δίκη peut désigner la justice, le jugement ou le châtiment judiciaire. « Justice céleste » maintient ici le sens moral et judiciaire large sans le réduire à un verdict précis.
- source_word: ὠμόφρον
  choice: homme au cœur cruel
  rationale: Le composé qualifie une disposition intérieure dure et cruelle. « Au cœur cruel » rend cette orientation intérieure dans un français idiomatique.
- source_word: καταικίζεις
  choice: tu me tortures
  rationale: Dans ce contexte de sévices physiques, le verbe désigne des mauvais traitements violents; « tortures » en restitue clairement la force.
- source_word: ἀνδροφονήσαντά
  choice: avoir commis un meurtre
  rationale: Le participe dénote l’homicide criminel. La formulation française exprime précisément la négation d’une culpabilité de meurtre.
- source_word: ἀσεβήσαντα
  choice: avoir agi avec impiété
  rationale: Le verbe concerne une conduite impie envers Dieu ou les réalités sacrées. Cette traduction garde explicitement sa dimension religieuse.
- source_word: θείου νόμου
  choice: la loi divine
  rationale: Traduction proche de l’adjectif θείου, adaptée au registre élevé du passage sans explicitation supplémentaire.
- source_word: προασπίζοντα
  choice: je défends
  rationale: Le verbe signifie se porter au-devant pour protéger ou défendre. « Je défends » est direct et convient au contraste de type judiciaire.
theological_decisions:
- issue: Sens de δίκη dans « ennemi de la justice céleste »
  choice: 'Sens moral et judiciaire large : « justice »'
  alternative: « jugement céleste » ou « châtiment venu du ciel »
  rationale: Le grec permet plusieurs nuances. Le texte principal conserve la portée générale de l’ordre juste et de la rétribution célestes, tandis que la note signale l’autre lecture possible sans préciser indûment son moment ou son mécanisme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe conserve la vigueur rhétorique du grec; les deux négations parallèles et le contraste final sont maintenus.
