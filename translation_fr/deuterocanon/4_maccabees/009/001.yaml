  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: fr
  text: « Qu’attends-tu[a], tyran ? Car nous sommes prêts à mourir plutôt qu’à enfreindre les commandements de nos pères[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi hésites-tu ? » L’expression grecque peut évoquer l’attente, le retard ou l’hésitation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nos commandements ancestraux », c’est-à-dire les commandements transmis par les générations précédentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: Qu’attends-tu
  rationale: Dans cette question rhétorique, μέλλω exprime le fait de tarder ou d’hésiter à agir. « Qu’attends-tu ? » restitue naturellement le défi lancé au tyran tout en préservant l’ambiguïté de l’expression grecque dans une note.
- source_word: ὦ τύραννε
  choice: tyran
  rationale: τύραννος est ici péjoratif et désigne un souverain oppresseur. L’apostrophe française sans « ô » demeure directe, forte et naturelle en français contemporain.
- source_word: ἑτοῖμοι
  choice: prêts
  rationale: ἑτοῖμοι désigne la disposition ou la préparation à agir. « Prêts » est l’équivalent français direct dans ce contexte.
- source_word: ἀποθνήσκειν
  choice: à mourir
  rationale: Le verbe signifie simplement « mourir ». Bien que le contexte soit celui d’une mise à mort, le grec n’emploie pas ici une forme explicitement passive.
- source_word: ἢ
  choice: plutôt que
  rationale: Dans cette opposition, ἢ introduit l’option refusée au profit de la mort. « Plutôt que » exprime clairement ce contraste en français.
- source_word: παραβαίνειν
  choice: enfreindre
  rationale: παραβαίνω signifie franchir une limite prescrite, donc transgresser ou violer un commandement. « Enfreindre » conserve le registre éthique et juridique sans paraître archaïque.
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: les commandements de nos pères
  rationale: πατρίους qualifie ce qui vient des pères et se transmet par héritage. Cette formulation reste proche du grec et conserve son image familiale et ancestrale.
theological_decisions:
- issue: Portée de l’expression πατρίους ἡμῶν
  choice: les commandements de nos pères
  alternative: nos commandements ancestraux
  rationale: Le grec présente ces commandements comme reçus des pères. La traduction retenue préserve cette formulation masculine et familiale sans identifier plus précisément leur corpus ni résoudre la tension entre origine ancestrale et autorité divine.
translation_notes:
  register: Français international moderne, digne et direct. L’apostrophe « tyran » garde la force accusatrice du grec sans recourir au « ô » littéraire. La coordination causale est rendue par « Car », qui convient au ton solennel du discours.
