  text: As he was stretched over it[a], the noble young man was being disjointed.
translation:
  language: fr
  text: Pendant qu’il était étiré sur cet instrument, les articulations du noble jeune homme se déboîtaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, le grec dit que le jeune homme « devenait disloqué » ou « se trouvait hors de ses articulations ». L’imparfait souligne une dislocation corporelle progressive sous la torture.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ὃν
  choice: sur cet instrument
  rationale: Dans le contexte de la torture et avec κατατεινόμενος, l’expression a un sens spatial et renvoie à l’instrument mentionné auparavant. « Sur cet instrument » est naturel en français et rend l’antécédent implicite intelligible.
- source_word: κατατεινόμενος
  choice: pendant qu’il était étiré
  rationale: Le participe présent passif décrit une action subie et concomitante. « Était étiré » conserve la force passive et l’idée d’une tension exercée sur le corps.
- source_word: εὐγενὴς
  choice: noble
  rationale: Le terme peut évoquer à la fois la naissance et la qualité morale. « Noble » maintient cette amplitude sans la limiter au rang social.
- source_word: νεανίας
  choice: jeune homme
  rationale: Expression moderne et directe qui indique l’âge sans ajouter de connotation militaire ou excessivement littéraire.
- source_word: ἔξαρθρος ἐγίνετο
  choice: les articulations […] se déboîtaient
  rationale: ἔξαρθρος signifie littéralement « hors de ses articulations », tandis que l’imparfait ἐγίνετο présente un processus en cours. Cette formulation française exprime clairement la dislocation progressive sans aller jusqu’au démembrement.
