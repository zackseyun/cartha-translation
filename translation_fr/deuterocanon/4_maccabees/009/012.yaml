  yaml_path: translation/deuterocanon/4_maccabees/009/012.yaml
  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
translation:
  language: fr
  text: Mais, à force de le frapper à coups de fouet sans rien obtenir, ils se fatiguèrent et le placèrent sur la roue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
