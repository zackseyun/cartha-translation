lexical_decisions:
- source_word: τύπτοντες ταῖς μάστιξιν
  choice: à le frapper à coups de fouet
  rationale: Le participe τύπτοντες exprime des coups répétés, et μάστιξ désigne ici un fouet servant à la flagellation. Cette formulation est claire et naturelle en français moderne.
- source_word: ἐκοπίασαν
  choice: ils se furent épuisés
  rationale: Le verbe indique la fatigue causée par un effort prolongé. Le plus-que-parfait français rend naturellement l’action achevée avant la mise sur la roue.
- source_word: μηδὲν ἀνύοντες
  choice: sans rien obtenir
  rationale: L’expression signifie que leurs efforts ne produisaient pas le résultat recherché, sans préciser davantage ce résultat.
- source_word: ἀνέβαλον αὐτὸν ἐπὶ τὸν τροχόν
  choice: ils le mirent sur la roue
  rationale: La tournure rend simplement le déplacement de la victime jusque sur l’instrument, sans surinterpréter la manière précise dont elle y fut placée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la progression du grec ainsi que l’indétermination de « sans rien obtenir ». Le signalement anglais associait ses marqueurs à des segments incompatibles avec le contenu des notes; le marqueur a donc été placé directement après « roue », seul endroit pertinent pour la note culturelle.
