base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: fr
  text: Mais tu cherches à nous effrayer en nous menaçant d’une mort sous la torture, comme si tu n’avais pas tiré leçon d’Éléazar il y a peu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme si tu n’avais rien appris d’Éléazar récemment ». La formulation est rhétorique et sarcastique : elle ne nie pas littéralement qu’il ait été témoin de l’exemple d’Éléazar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: tu cherches à nous effrayer
  rationale: Le présent actif exprime l’action de provoquer la peur. La tournure conative convient à la réplique de ceux qui refusent précisément de céder à l’intimidation.
- source_word: βασάνων
  choice: torture
  rationale: Dans ce récit de martyre, le terme désigne les sévices employés pour donner la mort. Le singulier collectif français « sous la torture » rend naturellement le pluriel grec sans le réduire à une souffrance vague.
- source_word: θάνατον
  choice: une mort
  rationale: Le nom grec désigne directement la mort dont ils sont menacés; l’article indéfini s’intègre naturellement à la construction française.
- source_word: ἀπειλῶν
  choice: en nous menaçant
  rationale: Le participe précise le moyen par lequel le tyran cherche à les effrayer; le gérondif français conserve ce rapport instrumental.
- source_word: διὰ τῶν βασάνων
  choice: sous la torture
  rationale: διά avec le génitif indique ici le moyen par lequel la mort serait infligée. Cette expression est idiomatique en français et garde le lien entre torture et mise à mort.
- source_word: πρὸ βραχέως
  choice: il y a peu
  rationale: L’expression temporelle signifie qu’un bref laps de temps s’est écoulé; « il y a peu » est actuel, concis et digne.
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: tiré leçon d’Éléazar
  rationale: παρά avec le génitif indique la source de l’apprentissage. « Tirer leçon de » fait naturellement référence à l’exemple récent d’Éléazar sans préciser abusivement la nature de cet enseignement.
theological_decisions:
- issue: Valeur de la comparaison rhétorique introduite par ὥσπερ οὐχί
  choice: comme si tu n’avais pas tiré leçon d’Éléazar il y a peu
  alternative: bien que tu aies reçu, il y a peu, la leçon d’Éléazar
  rationale: Le grec présente sarcastiquement le tyran comme agissant à l’encontre de ce que l’exemple d’Éléazar aurait dû lui apprendre. La traduction conserve cette comparaison ironique sans la transformer en proposition concessive explicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au tyran. La phrase conserve le ton de défi et l’ironie du grec.
