base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: fr
  text: Car nous couvririons à juste titre nos ancêtres de honte si nous ne faisions pas de l’obéissance à la Loi notre conseillère et notre discernement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car nous aurions à juste titre honte devant nos ancêtres si nous ne recourions pas à l’obéissance à la Loi pour nous conseiller et nous éclairer. »'
    reason: Le grec peut décrire soit le déshonneur infligé aux ancêtres, soit la honte éprouvée devant eux. La relation exacte entre « conseillère » et « discernement » permet également cette formulation plus idiomatique.
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: nous couvririons … de honte
  rationale: Le moyen/passif peut exprimer la honte ressentie ou le déshonneur infligé. Avec l’accusatif τοὺς προγόνους, cette formulation française retient dans le texte principal le sens causatif de déshonorer les ancêtres, tout en signalant l’autre analyse en note.
- source_word: τοὺς προγόνους
  choice: nos ancêtres
  rationale: Traduction actuelle et naturelle qui désigne les générations antérieures sans archaïsme.
- source_word: εἰκότως
  choice: à juste titre
  rationale: Rend l’idée de ce qui est juste, approprié ou fondé en raison.
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: de l’obéissance à la Loi
  rationale: εὐπείθεια désigne une disposition à obéir. La majuscule à « Loi » signale ici la Loi reçue par Israël, selon le contexte, sans ajouter de précision absente du grec.
- source_word: συμβούλῳ
  choice: notre conseillère
  rationale: Le datif prédicatif avec χράομαι présente l’obéissance comme ce à quoi l’on recourt en qualité de conseillère; le féminin s’accorde naturellement avec « obéissance ».
- source_word: γνώσει
  choice: notre discernement
  rationale: Dans ce contexte moral et en coordination avec συμβούλῳ, γνῶσις évoque une compréhension pratique ou une capacité de discernement plutôt qu’un simple savoir théorique.
- source_word: χρησαίμεθα
  choice: si nous ne faisions pas de …
  rationale: Cette tournure française rend idiomatiquement l’emploi de χράομαι avec un complément indiquant la fonction attribuée à ce dont on se sert.
theological_decisions:
- issue: Rapport moral aux ancêtres dans αἰσχυνόμεθα … τοὺς προγόνους
  choice: L’infidélité à la Loi couvrirait les ancêtres de honte.
  alternative: Les locuteurs auraient honte devant leurs ancêtres s’ils n’obéissaient pas à la Loi.
  rationale: L’accusatif τοὺς προγόνους peut désigner ceux que l’on déshonore, lecture cohérente avec l’appel à préserver l’héritage ancestral. Toutefois, l’emploi moyen de αἰσχύνομαι avec l’accusatif peut aussi exprimer la honte éprouvée devant quelqu’un; cette ambiguïté réelle est conservée en note.
- issue: Fonction de l’obéissance à la Loi
  choice: L’obéissance est personnifiée comme « notre conseillère » et qualifiée de « notre discernement ».
  alternative: Recourir à l’obéissance à la Loi pour recevoir conseil et intelligence.
  rationale: La formulation retenue suit de près les datifs συμβούλῳ καὶ γνώσει et préserve la tension de l’expression grecque sans réduire la Loi elle-même à une faculté humaine ni développer une doctrine absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Couvrir de honte » explicite le sens causatif retenu sans être archaïque. La construction légèrement marquée « notre conseillère et notre discernement » conserve la personnification et la densité du grec; la note fournit une lecture alternative plus idiomatique.
