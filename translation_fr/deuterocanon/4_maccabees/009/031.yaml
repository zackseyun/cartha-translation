translation:
  language: fr
  text: Car moi, j’allège la douleur par les plaisirs agréables que procure la vertu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι ... ἡδοναῖς
  choice: par les joies
  rationale: Le datif a une valeur instrumentale. Le redoublement apparent de termes de même famille souligne le caractère agréable de ces joies; en français, «par les joies» l’exprime naturellement sans lourdeur.
- source_word: διὰ τὴν ἀρετήν
  choice: que procure la vertu
  rationale: διά avec l’accusatif indique ici le rapport causal ou médiateur entre la vertu et les joies. «Que procure la vertu» conserve ce rapport sans le réduire à «pour la vertu».
- source_word: ἀρετήν
  choice: vertu
  rationale: Dans le cadre moral et philosophique de 4 Maccabées, «vertu» rend directement l’excellence éthique et la fermeté du personnage.
- source_word: τὸν πόνον
  choice: la douleur
  rationale: πόνος peut désigner la peine, l’effort ou la souffrance; dans cette scène de torture, «douleur» convient au mal physique immédiat.
- source_word: ἐπικουφίζομαι
  choice: j’allège
  rationale: Le verbe évoque l’action de rendre plus léger. «J’allège» préserve cette image et la voix moyenne à valeur personnelle.
theological_decisions:
- issue: Portée morale et philosophique de ἀρετή
  choice: vertu
  alternative: excellence
  rationale: «Vertu» maintient le sens éthique propre au discours de 4 Maccabées, sans lui ajouter une interprétation confessionnelle.
- issue: Paradoxe entre joie vertueuse et douleur
  choice: conserver explicitement «les joies» face à «la douleur»
  alternative: adoucir en parlant de «réconfort»
  rationale: Le grec juxtapose délibérément plaisir et souffrance; la traduction préserve cette tension plutôt que de l’expliquer ou de la neutraliser.
translation_notes:
  register: Français moderne, sobre et digne. La phrase reste concise et conserve le contraste rhétorique du grec entre les joies issues de la vertu et la douleur corporelle.
