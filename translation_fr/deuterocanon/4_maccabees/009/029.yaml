  text: How sweet every kind of death is for our ancestral godliness! And he spoke to the tyrant,[a]
translation:
  language: fr
  text: '« Comme toute manière de mourir est douce à cause de notre piété ancestrale ! » Et il dit au tyran :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς ἡδὺς
  choice: Comme … est douce
  rationale: La tournure exclamative française rend naturellement l’intensité de Ὡς et conserve l’image paradoxale de la douceur appliquée à la mort.
- source_word: πᾶς τρόπος θανάτου
  choice: toute manière de mourir
  rationale: Cette formulation garde la valeur distributive de πᾶς et rend τρόπος θανάτου dans un français courant, sans atténuer la diversité des formes de mort envisagées.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διὰ exprime ici la cause ou le motif. « À cause de » explicite ce rapport sans imposer une lecture supplémentaire.
- source_word: τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: la piété héritée de nos ancêtres
  rationale: « Piété » exprime la dévotion religieuse de εὐσέβεια, tandis que « héritée de nos ancêtres » restitue le caractère ancestral de πάτριον plus clairement que le seul adjectif « ancestrale ».
- source_word: ἔφη τε
  choice: Puis il dit
  rationale: « Il dit » est le rendu direct de ἔφη. Dans cette phrase qui introduit les paroles suivantes, τε marque une transition de liaison que « puis » rend naturellement.
- source_word: πρὸς τὸν τύραννον
  choice: au tyran
  rationale: « Tyran » conserve la portée péjorative de τύραννος appliqué au souverain persécuteur.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: fidélité religieuse
  rationale: « Piété » conserve l’idée de respect et de dévotion envers Dieu, manifestés par l’attachement à la tradition ancestrale. « Fidélité religieuse » expliciterait un aspect contextuel, mais réduirait l’étendue sémantique du terme grec.
translation_notes:
  register: Français moderne, digne et oralement naturel. L’exclamation conserve le paradoxe rhétorique du grec. Les guillemets et les deux-points signalent que le verset passe de l’exclamation du narrateur ou du martyr à une parole adressée au tyran, laquelle se poursuit dans le contexte suivant.
