base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: fr
  text: « Ne penses-tu pas, ô tyran, le plus cruel de tous, que tu es maintenant torturé plus que moi, en voyant le raisonnement orgueilleux[a] de ta tyrannie vaincu par notre endurance à cause de notre piété[b] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pensée orgueilleuse » ou « la mentalité arrogante ». Le grec λογισμός peut désigner le raisonnement, la pensée ou la disposition qui dirige l’action.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la piété envers Dieu. La formule grecque peut aussi se rendre par « notre endurance en raison de notre attachement à Dieu » ou « notre endurance pour notre piété ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: Ne penses-tu pas
  rationale: Cette tournure rend directement la question rhétorique et conserve son ton de défi.
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: ô toi, le plus cruel de tous les tyrans
  rationale: Le superlatif ὠμότατε exprime une cruauté extrême. Cette formulation française naturelle rend aussi πάντων, dont le complément « les tyrans » est explicité par le contexte.
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: que tu es maintenant torturé plus que moi
  rationale: Le passif de βασανίζω désigne le fait de torturer ou de tourmenter. « Torturé » maintient le renversement ironique entre la souffrance physique du martyr et le tourment du tyran.
- source_word: ὁρῶν
  choice: en voyant
  rationale: Le participe présent garde le lien circonstanciel, possiblement causal, entre ce que voit le tyran et son propre tourment.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: le raisonnement orgueilleux de ta tyrannie
  rationale: « Raisonnement » conserve le lien de λογισμός avec le thème majeur de la raison dans 4 Maccabées, tandis que « orgueilleux » rend ὑπερήφανον sans atténuation.
- source_word: ὑπὸ τῆς ... ἡμῶν ὑπομονῆς
  choice: vaincu par notre endurance
  rationale: ὑπομονή désigne la constance patiente sous l'épreuve. « Endurance » convient au contexte de torture et préserve l'image d'un combat remporté.
- source_word: διὰ τὴν εὐσέβειαν
  choice: inspirée par la piété
  rationale: La proposition indique que l'endurance vient de l'attachement pieux à Dieu. « Inspirée par » exprime cette motivation sans réduire εὐσέβεια à une pratique rituelle.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: attachement à Dieu ; respect de Dieu
  rationale: « Piété » exprime la fidélité respectueuse envers Dieu qui motive l'endurance. La note précise ce sens afin d'éviter celui d'une simple dévotion extérieure.
- issue: Valeur de λογισμός dans un livre centré sur la raison
  choice: raisonnement
  alternative: pensée ; mentalité ; résolution
  rationale: « Raisonnement » préserve l'écho au thème récurrent de la raison dans 4 Maccabées, tout en laissant entendre ici la logique arrogante qui soutient la tyrannie.
translation_notes:
  register: Français international moderne, soutenu mais aisément compréhensible. L'interpellation solennelle « ô toi » conserve la vigueur du vocatif grec sans archaïsme excessif. La phrase garde la longue question rhétorique et le renversement ironique de l'original.
