  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: fr
  text: Pour la vertu, ils sont invincibles[a]. Tandis qu’il prononçait encore ces paroles, ils disposèrent du feu sous lui et, en accentuant l’action de la roue[b], ils augmentèrent encore la tension[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur de la vertu » ou « parce qu’ils souffrent pour la vertu ». L’expression grecque peut désigner la cause que l’on défend ou celle pour laquelle on endure l’épreuve.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la roue employée comme instrument de torture.
    reason: cultural_note
  - marker: c
    text: Le dernier verbe grec est difficile. Il indique que les bourreaux accroissaient encore la traction ou la contrainte exercée sur le supplicié.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: Pour la vertu
  rationale: Ὑπέρ avec le génitif exprime ici la cause défendue ou celle pour laquelle on endure l’épreuve. La formulation française, volontairement concise, conserve l’ambiguïté entre « en faveur de la vertu » et « à cause de la vertu », explicitée en note.
- source_word: ἀνίκητοι
  choice: invincibles
  rationale: L’adjectif signifie « qui ne peuvent être vaincus ». « Invincibles » est naturel en français et garde toute la force de l’affirmation grecque.
- source_word: ταῦτα λέγων ἔτι
  choice: Tandis qu’il prononçait encore ces paroles
  rationale: Le participe présent associé à ἔτι présente la parole comme toujours en cours au moment où les tortionnaires interviennent; « ces paroles » rend le pluriel ταῦτα de manière idiomatique.
- source_word: πῦρ ἐπέστρωσαν
  choice: ils étalèrent du feu sous lui
  rationale: Le verbe évoque l’action d’étendre ou de disposer une couche. « Sous lui » est fourni par la scène de torture et rend l’action intelligible, sans ajouter l’idée non certaine d’un feu supplémentaire.
- source_word: διερεθίζοντες τὸν τροχόν
  choice: en intensifiant l’action de la roue
  rationale: Διερεθίζω évoque le fait d’exciter, d’activer ou d’accroître l’effet de quelque chose. Cette traduction évite de préciser sans preuve qu’ils faisaient tourner la roue, tout en exprimant l’aggravation du supplice.
- source_word: προσεπικατέτεινον
  choice: ils augmentèrent encore la tension
  rationale: Ce composé intensif difficile indique vraisemblablement qu’ils accroissaient encore la traction ou la contrainte exercée par la roue. La traduction conserve l’escalade sans déterminer à tort si l’objet tendu est la roue, les liens ou le supplicié.
theological_decisions:
- issue: Traduction de ἀρετή dans le cadre philosophique et religieux du martyre
  choice: vertu
  alternative: excellence morale
  rationale: « Vertu » maintient le vocabulaire moral et philosophique caractéristique de 4 Maccabées, sans le remplacer par une expression doctrinale plus étroite.
- issue: Identification explicite du τροχός comme instrument de torture
  choice: la roue
  alternative: la roue de torture
  rationale: Le grec dit simplement « la roue ». Le texte principal conserve ce terme, tandis que la note précise son emploi dans la scène.
translation_notes:
  register: Français international moderne, sobre et digne. La première proposition conserve la concision rhétorique du grec. Les termes techniques du supplice restent compréhensibles sans description graphique excessive; les notes signalent les ambiguïtés réelles du texte source.
