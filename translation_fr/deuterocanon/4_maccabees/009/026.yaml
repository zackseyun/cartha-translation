  to: Après que tous eurent admiré sa force d’âme, les gardes amenèrent le deuxième après le premier selon l’âge. Après avoir ajusté des mains de fer munies de griffes acérées[a], ils l’attachèrent aux instruments de torture et à la catapulte[b].
