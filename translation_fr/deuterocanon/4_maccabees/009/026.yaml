  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: fr
  text: Après que tous eurent admiré sa force d’âme, les gardes amenèrent le deuxième après le premier selon l’âge. Après avoir ajusté des mains de fer munies de griffes acérées[a], ils l’attachèrent aux instruments de torture et à la catapulte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des mains de fer aux ongles acérés ». Il s’agit vraisemblablement d’instruments métalliques pourvus de pointes ou de crochets ; le grec ne précise pas exactement comment ils étaient disposés.'
    reason: cultural_note
  - marker: b
    text: 'Ou peut-être : « à la machine de torture ». Le mot grec désigne normalement une catapulte, mais il peut évoquer ici un appareil mécanique servant au supplice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμασάντων
  choice: tandis que tous admiraient
  rationale: Le génitif absolu exprime la réaction générale qui accompagne et précède l’action principale. « Admiraient » rend ici l’étonnement admiratif suscité par l’endurance du martyr.
- source_word: καρτεροψυχίαν
  choice: force d’âme
  rationale: Le composé désigne la fermeté intérieure et l’endurance courageuse sous la souffrance. « Force d’âme » est naturel, digne et conserve cette double nuance.
- source_word: δορυφόροι
  choice: gardes
  rationale: Le terme signifie littéralement « porte-lances », mais peut désigner des gardes ou des membres d’une escorte royale. Le contexte privilégie leur fonction narrative.
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: celui qui venait juste après le premier par l’âge
  rationale: La formule classe le frère selon l’âge. Cette traduction explicite naturellement qu’il s’agit du deuxième dans cet ordre sans ajouter une précision absente du grec sur la naissance.
- source_word: σιδηρᾶς ... χεῖρας
  choice: des mains de fer
  rationale: Le grec dit littéralement « mains de fer ». L’image est conservée plutôt que remplacée par « griffes », puisque les griffes ou ongles pointus sont nommés séparément.
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: munies de griffes acérées
  rationale: ὄνυξ peut désigner un ongle, une griffe ou une serre. Dans ce dispositif de torture, « griffes acérées » évoque clairement les projections pointues des mains métalliques.
- source_word: ἐναρμοσάμενοι
  choice: après lui avoir ajusté
  rationale: Le participe indique que les instruments sont adaptés ou fixés sur lui avant qu’il soit attaché. Le complément « lui » évite d’affirmer plus précisément que le grec à quelle partie du corps ils étaient ajustés.
- source_word: ὀργάνοις
  choice: instruments de torture
  rationale: ὄργανα signifie généralement « instruments » ou « dispositifs » ; le contexte permet d’expliciter leur fonction afin d’éviter une formulation française trop vague.
- source_word: καταπέλτῃ
  choice: catapulte
  rationale: Le sens ordinaire est « catapulte » ou « machine de jet ». Le contexte peut viser un appareil mécanique de torture, mais la traduction principale préserve le terme explicite et inhabituel du grec.
- source_word: προσεδήσαν
  choice: ils l’attachèrent
  rationale: Le verbe signifie attacher ou lier à quelque chose. « Attachèrent » convient aux deux compléments désignant les appareils.
