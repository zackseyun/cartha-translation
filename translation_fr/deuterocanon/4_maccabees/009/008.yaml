  text: For through this suffering and endurance[a], we will indeed carry off the prizes of virtue,
translation:
  language: fr
  text: Car, par cette souffrance et cette persévérance, nous remporterons les prix de la vertu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « nous gagnerons les récompenses de l’excellence morale ». Le grec emploie le langage des concours : littéralement, « nous emporterons les prix de la vertu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς μὲν γὰρ
  choice: Car… nous
  rationale: « Car » rend la valeur explicative de γάρ. Le pronom sujet, exprimé en français, restitue l’accent porté par ἡμεῖς; μὲν prépare un contraste dans la suite sans qu’il soit nécessaire de le surtraduire ici.
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  choice: par cette souffrance
  rationale: « Souffrance » exprime l’épreuve pénible désignée par κακοπάθεια; « par » conserve ici la valeur instrumentale de διά, et « cette » celle du démonstratif τῆσδε.
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: Le terme désigne la capacité à tenir bon dans l’épreuve. « Persévérance » est naturel en français moderne et conserve cette dimension active.
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: les prix de la vertu
  rationale: ἆθλα appartient au langage des concours et désigne les prix obtenus; « prix » maintient cette métaphore. « Vertu » rend le vocabulaire éthique de ἀρετή sans lui imposer une catégorie doctrinale ultérieure.
- source_word: οἴσομεν
  choice: nous remporterons
  rationale: Avec ἆθλα, le futur de φέρω signifie idiomatiquement emporter ou gagner des prix. « Remporter » est naturel en français et préserve l’image du concours.
theological_decisions:
- issue: Sens de ἀρετή dans le contexte du martyre juif hellénistique
  choice: vertu
  alternative: excellence morale
  rationale: « Vertu » correspond au vocabulaire éthique structurant de 4 Maccabées et maintient la concision du grec; « excellence morale » explicite justement le sens, mais atténue le caractère terminologique du mot.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve l’explication introduite par γάρ, l’instrumentalité de διά et l’image agonistique de prix remportés. La virgule finale reflète le fait que la phrase se poursuit dans le contexte.
