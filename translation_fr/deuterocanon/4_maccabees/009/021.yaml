revisions:
- from: Bien que la charpente de ses os fût déjà brûlée de toutes parts[a], le jeune homme, au cœur noble et semblable à Abraham, ne poussa aucun gémissement.
  to: Bien que sa structure osseuse fût déjà fondue de toutes parts[a], le jeune homme, noble de cœur et semblable à Abraham, ne poussa aucun gémissement.
  rationale: La révision privilégie le sens lexical premier de περιτετηγμένον (« fondue »), tout en conservant « brûlée » comme alternative contextuellement défendable. Elle améliore l’idiomaticité de πῆγμα τῶν ὀστέων et clarifie la portée de l’adjectif « semblable à Abraham ».
