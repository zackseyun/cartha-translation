  source_fidelity: 'Le participe parfait περιτετηγμένον est plus directement rendu par « fondue de toutes parts » : il évoque l’état résultant d’une action de chaleur autour de la structure osseuse. « Brûlée » est contextuellement possible, mais atténue la valeur spécifique de τήκω (« fondre »). La correction conserve l’image corporelle forte du grec sans ajouter de détail doctrinal ou narratif.'
  naturalness: « Charpente de ses os » est compréhensible, mais « structure osseuse » est plus idiomatique en français international moderne. La reformulation de l’apposition évite aussi que « semblable à Abraham » puisse, syntaxiquement, sembler qualifier seulement « cœur ».
  terminology: « Noble de cœur » rend avec naturel μεγαλόφρων, tandis que « semblable à Abraham » conserve la valeur caractérisante de Ἀβραμιαῖος sans transformer l’expression en catégorie technique. « Ne poussa aucun gémissement » restitue bien οὐκ ἐστέναξεν.
  issues:
