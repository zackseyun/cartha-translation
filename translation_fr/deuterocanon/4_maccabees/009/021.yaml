    issue: Le rendu principal « brûlée de toutes parts » de περιτετηγμένον est moins précis que son alternative signalée en note.
    rationale: Le verbe grec apparenté à τήκω porte plus proprement l’idée d’être fondu ou liquéfié sous l’effet de la chaleur. Dans une traduction d’équivalence optimale, « fondue de toutes parts » doit être le texte principal; « brûlée » peut figurer comme alternative.
  - severity: low
    issue: « Charpente de ses os » est une formulation moins naturelle et moins cohérente avec la note, qui parle d’« ossature ».
    rationale: « Structure osseuse » exprime clairement πῆγμα τῶν ὀστέων en français contemporain, tout en préservant l’image d’une armature corporelle.
  - severity: low
    issue: L’enchaînement « au cœur noble et semblable à Abraham » crée une légère ambiguïté syntaxique.
    rationale: Il peut laisser croire que c’est le cœur qui est semblable à Abraham. « Noble de cœur, semblable à Abraham » attribue sans ambiguïté les deux qualifications au jeune homme.
  revised_text: Bien que sa structure osseuse fût déjà fondue de toutes parts[a], le jeune homme, noble de cœur et semblable à Abraham, ne poussa aucun gémissement.
