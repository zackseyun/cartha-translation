  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
translation:
  language: fr
  text: Bien que sa structure osseuse fût déjà fondue de toutes parts[a], le jeune homme, noble de cœur et semblable à Abraham, ne poussa aucun gémissement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « brûlée de toutes parts ». Le grec emploie une image saisissante : la structure des os est affectée de tous côtés par une chaleur intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετηγμένον
  choice: brûlée de toutes parts
  rationale: Le participe parfait exprime l’état produit par une chaleur intense agissant tout autour. Dans ce contexte de supplice par le feu, « brûlée de toutes parts » est naturel tout en conservant l’image grecque; la nuance littérale possible de fusion est signalée en note.
- source_word: πῆγμα
  choice: charpente
  rationale: Le mot désigne ce qui est fixé, assemblé ou solidement constitué. Avec « des os », « charpente » restitue concrètement l’ossature du corps.
- source_word: μεγαλόφρων
  choice: au cœur noble
  rationale: L’adjectif décrit grandeur d’âme, courage et dignité intérieure. « Au cœur noble » est actuel, intelligible et adapté au registre élevé du récit.
- source_word: Ἀβραμιαῖος
  choice: semblable à Abraham
  rationale: Cet adjectif caractérise le jeune homme par référence à Abraham. Cette formulation française exprime clairement la ressemblance sans lui donner le sens technique moderne d’« abrahamique ».
- source_word: νεανίας
  choice: jeune homme
  rationale: Rendu courant et précis du terme grec désignant un homme jeune.
- source_word: οὐκ ἐστέναξεν
  choice: ne poussa aucun gémissement
  rationale: στενάζω désigne un gémissement ou soupir causé par la souffrance. Dans cette scène de torture, la formulation choisie exprime naturellement l’absence de plainte audible.
theological_decisions:
- issue: Valeur de l’adjectif Ἀβραμιαῖος
  choice: semblable à Abraham
  alternative: abrahamique; descendant d’Abraham
  rationale: Dans le contexte, l’expression loue la disposition et l’endurance du martyr en les rapprochant de celles d’Abraham; elle ne se borne pas à indiquer une ascendance. La traduction conserve cette caractérisation sans préciser davantage la nature exacte de la ressemblance.
translation_notes:
  register: Français international moderne, digne et narratif. L’imparfait du subjonctif « fût » après « bien que » maintient un registre littéraire approprié sans archaïsme lexical excessif. L’image corporelle concrète et la sobriété de la réaction du martyr sont préservées.
