base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/028.yaml
  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: fr
  text: 'Les bêtes semblables à des léopards le tirèrent par les tendons avec leurs mains de fer[a] et lui arrachèrent toute la chair jusqu’à la barbe[b], ainsi que la peau de la tête[c]. Mais lui, supportant avec fermeté cette terrible douleur, disait :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque dit littéralement « mains de fer ». Elle peut évoquer des instruments métalliques ou renforcer l’image de la cruauté des bêtes.
    reason: ambiguïté de l’image
  - marker: b
    text: Ou « jusqu’au menton ». Le mot grec peut désigner le menton ou la région de la barbe.
    reason: alternative lexicale
  - marker: c
    text: Ou « le cuir chevelu ». Le grec dit plus littéralement « la peau de la tête ».
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων ... ἐπισπασάμενοι
  choice: le tirèrent par les tendons
  rationale: τένων désigne les tendons ou les nerfs, et ἀπό indique ici le point de prise ou de départ. « Par les tendons » conserve le détail anatomique et s’intègre naturellement au verbe de traction.
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: avec leurs mains de fer
  rationale: Traduction directe de l’image grecque, sans décider s’il s’agit métaphoriquement de griffes ou concrètement d’instruments métalliques.
- source_word: μέχρι γε τῶν γενείων
  choice: jusqu’au menton
  rationale: γενεῖον désigne le menton ou la région de la barbe. « Jusqu’au menton » exprime clairement l’étendue anatomique, tandis qu’une note conserve l’autre possibilité.
- source_word: τὴν σάρκα πᾶσαν
  choice: toute la chair
  rationale: Le sens est physique et concret; cette formulation française garde toute la violence de la scène.
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: la peau de la tête
  rationale: Traduction proche de δορά, « peau », qui évite de restreindre d’emblée le sens au seul cuir chevelu.
- source_word: οἱ παρδάλιοι θῆρες
  choice: les bêtes semblables à des léopards
  rationale: παρδάλιος est adjectival et qualifie θῆρες; la traduction préserve donc la comparaison plutôt que d’identifier simplement les bourreaux à des léopards.
- source_word: ἀπέσυραν
  choice: arrachèrent
  rationale: Le verbe exprime l’action de tirer ou d’enlever. Dans ce contexte de chair et de peau retirées, « arrachèrent » est naturel et précis.
- source_word: ταύτην βαρέως τὴν ἀλγηδόνα καρτερῶν
  choice: supportant avec fermeté cette terrible douleur
  rationale: βαρέως marque ici le caractère accablant ou cruel de la douleur, tandis que καρτερῶν exprime l’endurance ferme. La formulation répartit clairement ces deux valeurs.
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec introduit une parole qui suit; l’imparfait français en conserve l’aspect narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La syntaxe est légèrement réorganisée pour être naturelle, tout en conservant les images violentes, l’ambiguïté des « mains de fer » et la distinction entre la gravité de la douleur et la fermeté avec laquelle elle est endurée.
