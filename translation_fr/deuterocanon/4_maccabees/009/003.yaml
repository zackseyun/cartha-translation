  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: fr
  text: « Conseiller de l’iniquité[a], tyran, ne nous hais pas plus qu’eux ; aie pitié de nous. »[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec, très resserré, peut aussi se comprendre : « Conseiller, tyran de l’iniquité ».'
    reason: ambiguïté du rattachement du génitif παρανομίας
  - marker: b
    text: 'Littéralement, la fin se lit approximativement : « ne nous haïssant pas plus qu’eux, aie pitié de nous ». La comparaison peut aussi être rattachée à la demande de pitié : « aie pitié de nous plus que d’eux ».'
    reason: ambiguïté syntaxique du rattachement de ὑπὲρ αὐτούς
lexical_decisions:
- source_word: σύμβουλε
  choice: Conseiller
  rationale: Vocatif singulier de σύμβουλος. « Conseiller » rend directement le titre employé comme interpellation.
- source_word: τύραννε
  choice: tyran
  rationale: Le vocatif désigne le souverain persécuteur et conserve la forte charge négative du grec.
- source_word: παρανομίας
  choice: de l’iniquité
  rationale: Le génitif exprime ici la transgression de la loi avec une portée morale. « Iniquité » est plus naturel et plus dense que « illégalité » dans cette apostrophe solennelle.
- source_word: μὴ … μισῶν
  choice: ne nous hais pas
  rationale: La construction prohibitive avec le participe est rendue par un impératif négatif naturel en français.
- source_word: ὑπὲρ αὐτούς
  choice: plus qu’eux
  rationale: Avec l’accusatif, ὑπέρ peut marquer la comparaison. Sa position immédiatement après μισῶν favorise son rattachement à « haïr », tout en laissant subsister une ambiguïté dans la formulation grecque comprimée.
- source_word: ἐλέα
  choice: aie pitié de nous
  rationale: L’impératif de ἐλεέω appelle la compassion. « Aie pitié de nous » est idiomatique, digne et fidèle à la force de la supplication.
theological_decisions:
- issue: Rattachement de ὑπὲρ αὐτούς
  choice: 'La comparaison porte dans le texte principal sur μισῶν : « ne nous hais pas plus qu’eux »; la demande de pitié suit comme impératif distinct.'
  alternative: « Ne nous hais pas ; aie pitié de nous plus que d’eux » ou « ne nous hais pas à cause d’eux ; aie pitié de nous ».
  rationale: L’ordre des mots rattache naturellement la locution comparative au participe μισῶν. Comme le grec transmis est très comprimé et admet d’autres segmentations, la note conserve les principales possibilités sans trancher artificiellement.
- issue: Rapport de παρανομίας avec les vocatifs
  choice: « Conseiller de l’iniquité, tyran »
  alternative: « Conseiller, tyran de l’iniquité » ou « conseiller du tyran inique ».
  rationale: La construction juxtapose deux vocatifs suivis d’un génitif et reste syntaxiquement serrée. Le choix retenu suit une lecture possible et bien attestée de l’apostrophe, tandis que la note signale l’autre rattachement plausible sans transformer σύμβουλε en « conseiller du tyran ».
translation_notes:
  register: Français international moderne, avec une apostrophe solennelle mais intelligible. Le tutoiement convient à l’adresse directe et accusatrice au tyran. La ponctuation distingue les deux vocatifs et les deux mouvements de la supplication.
