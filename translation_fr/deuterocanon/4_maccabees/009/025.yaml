  text: And after saying this[a], the devout young man breathed his last.
translation:
  language: fr
  text: Après avoir dit cela, le pieux jeune homme rendit l’âme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie une expression qui signifie qu’il mourut, avec le mot traduit par « âme », qui peut aussi désigner la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπών
  choice: Après avoir dit cela
  rationale: Le participe aoriste marque ici naturellement l’antériorité immédiate. Cette formulation française exprime clairement la succession des actions sans lourdeur.
- source_word: ὁ ἱεροπρεπὴς νεανίας
  choice: le pieux jeune homme
  rationale: ἱεροπρεπής décrit une personne dont l’attitude convient aux réalités sacrées. « Pieux » restitue de façon naturelle cette qualité religieuse sans laisser entendre qu’il exerçait une fonction sacerdotale.
- source_word: ἀπέρρηξεν τὴν ψυχήν
  choice: rendit l’âme
  rationale: Cette locution grecque désigne la mort. L’expression française courante « rendre l’âme » conserve à la fois le caractère idiomatique de la phrase et la présence de ψυχή, sans transformer le verset en définition anthropologique.
theological_decisions:
- issue: Sens de ψυχή dans la locution décrivant la mort
  choice: âme, dans l’expression idiomatique « rendit l’âme »
  alternative: vie, comme dans « perdit la vie »; ou simplement « mourut »
  rationale: Le contexte décrit la mort du jeune homme, mais le grec emploie explicitement ψυχή. La locution française retenue conserve cet élément tout en restant une manière ordinaire de dire qu’une personne meurt; la note prévient une lecture excessivement technique.
translation_notes:
  register: Français international moderne, sobre et digne. « Pieux » est naturel dans un récit religieux; « rendit l’âme » garde la solennité du passage tout en demeurant immédiatement compréhensible.
