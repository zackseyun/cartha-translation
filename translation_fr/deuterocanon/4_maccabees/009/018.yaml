lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: à travers toutes les tortures
  rationale: Avec le génitif, διὰ peut exprimer le moyen ou le passage à travers une épreuve. « À travers toutes les tortures » conserve l’image d’un parcours complet des supplices et rend explicitement le pluriel grec.
- source_word: πείσω
  choice: je vous convaincrai
  rationale: Le futur actif de πείθω signifie ici « persuader » ou « convaincre ». « Convaincre » convient à une démonstration produite par l’endurance sous la torture.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom est un accusatif pluriel, objet direct de πείσω. Le français « vous » préserve le nombre sans préciser davantage les destinataires.
- source_word: μόνοι
  choice: seuls
  rationale: μόνοι exprime l’exclusivité et s’accorde avec le groupe masculin pluriel οἱ παῖδες.
- source_word: οἱ παῖδες Ἑβραίων
  choice: les fils des Hébreux
  rationale: Dans ce contexte, παῖδες désigne les frères martyrs. « Fils » conserve la référence masculine ainsi que la construction familiale et ethnique du génitif, sans réduire le terme au seul sens d’« enfants ».
theological_decisions:
- issue: Rendu genré de παῖδες
  choice: fils
  alternative: enfants ou jeunes gens
  rationale: Le contexte vise des frères de sexe masculin. « Fils » rend cette donnée et maintient le lien exprimé avec « les Hébreux », tandis que « enfants » serait moins précis et « jeunes Hébreux » aplanirait la construction grecque.
- issue: Clause grecque syntaxiquement inachevée
  choice: ne pas compléter le sens absent
  alternative: ajouter un prédicat tiré du verset suivant
  rationale: Le texte transmis s’arrête après « les fils des Hébreux » et paraît se poursuivre au verset suivant. La traduction conserve cette tension textuelle au lieu d’introduire des mots non exprimés dans la clause fournie.
translation_notes:
  register: Français moderne, international et digne. La tournure reste volontairement suspendue, conformément à l’état de la clause grecque fournie.
