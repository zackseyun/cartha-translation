  text: Car, à travers toutes les tortures, je vous convaincrai que seuls les fils des Hébreux[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « les fils des Hébreux » ; autres traductions possibles : « les jeunes Hébreux » ou « les enfants des Hébreux ».'
