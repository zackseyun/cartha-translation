base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/032.yaml
  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: fr
  text: Mais toi, tu es tourmenté[a] par les menaces de ton impiété ; et tu n’échapperas pas, tyran immonde, aux châtiments de la colère divine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es tourmenté au milieu des menaces de ton impiété ». L’expression grecque est condensée et le rapport exact entre les menaces, l’impiété et le tourment reste ambigu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανίζῃ
  choice: tu es tourmenté
  rationale: Le présent moyen-passif est rendu au présent passif, sans le transformer en futur. « Tourmenté » exprime le sens courant de βασανίζω tout en conservant l’étrangeté de la formulation grecque.
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: par les menaces de ton impiété
  rationale: ἀπειλαί désigne bien des « menaces », et ἐν peut ici introduire la circonstance ou le moyen. Le possessif « ton » explicite naturellement en français le lien avec l’impiété du tyran, clairement interpellé.
- source_word: ἀσεβείας
  choice: impiété
  rationale: « Impiété » conserve la portée religieuse et morale de ἀσέβεια dans un registre français actuel et digne.
- source_word: μιερώτατε
  choice: immonde
  rationale: Le terme grec superlatif évoque une souillure extrême, morale et possiblement cultuelle. « Immonde » restitue la force de l’invective sans ajouter une catégorie doctrinale.
- source_word: τύραννε
  choice: tyran
  rationale: Équivalent direct qui garde la condamnation politique et morale du grec.
- source_word: τὰς … δίκας
  choice: aux châtiments
  rationale: Dans ce contexte judiciaire, le pluriel δίκας désigne les peines infligées en juste rétribution. La construction française « échapper aux châtiments » est idiomatique.
- source_word: θείας ὀργῆς
  choice: de la colère divine
  rationale: Cette traduction conserve l’adjectif θεῖος, plutôt que de remplacer explicitement celui-ci par le nom de Dieu.
theological_decisions:
- issue: Référent de θείας ὀργῆς
  choice: la colère divine
  alternative: la colère de Dieu
  rationale: Le grec emploie l’adjectif « divine ». La traduction maintient cette formulation et laisse implicite, comme le texte source, la référence à Dieu.
- issue: Valeur temporelle et voix de βασανίζῃ
  choice: 'présent passif : « tu es tourmenté »'
  alternative: 'futur passif : « tu seras tourmenté » ; moyen : « tu te tourmentes »'
  rationale: La forme grecque est au présent moyen-passif. Le présent passif respecte le plus directement la morphologie et évite d’anticiper sur la menace future exprimée explicitement dans la proposition suivante.
translation_notes:
  register: Français international moderne, ferme et digne. Le point-virgule conserve l’enchaînement des deux déclarations. « Tyran immonde » garde la violence de l’apostrophe grecque, tandis que la note préserve l’ambiguïté de la première proposition.
