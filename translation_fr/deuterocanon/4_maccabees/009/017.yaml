  source_fidelity: 'Le sens du grec est globalement bien rendu : le martyr défie les tortionnaires, qualifiés métaphoriquement de « membres d’un démon », et énumère les sévices. « Raison » traduit adéquatement λογισμός dans le vocabulaire moral de 4 Maccabées. La formulation révisée maintient l’image et le mouvement de ἆξαι (« entraîner ») sans ajouter de complément interprétatif.'
  naturalness: '« Mais lui dit » n’est pas idiomatique en français moderne : il faut « Mais il dit ». « Entraîner ma raison » est plus naturel que « détourner ma raison » tout en restant proche de l’idée grecque de conduire/entraîner hors de sa ferme disposition.'
  terminology: « Méthode », « membres d’un démon », « raison », « chairs » et « articulations » conservent un registre digne, direct et suffisamment littéral. « Méthode » est plus usuel que « procédé » dans cette apostrophe, sans réduire τρόπος à une technique particulière.
