  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: fr
  text: 'Mais il dit : « Votre méthode n’est pas assez puissante, vous, membres d’un démon, pour entraîner ma raison. Coupez mes membres, brûlez mes chairs et disloquez mes articulations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρόπος
  choice: votre procédé
  rationale: Dans ce contexte de torture, τρόπος désigne la manière d’agir ou le moyen employé. « Procédé » est naturel en français et conserve la nuance de méthode mise en œuvre.
- source_word: ὦ μεροὶ δαῖμον
  choice: membres d’un démon
  rationale: Rend littéralement l’apostrophe grecque, qui présente les tortionnaires comme les membres corporels d’un démon, sans l’atténuer en simple injure.
- source_word: τὸν λογισμόν
  choice: ma raison
  rationale: λογισμός désigne ici la faculté rationnelle qui gouverne le martyr et résiste aux souffrances; « raison » est clair et cohérent avec le thème de l’ouvrage.
- source_word: ἆξαι
  choice: détourner
  rationale: L’infinitif de ἄγω exprime ici l’idée d’entraîner ou d’écarter la raison de sa résolution; « détourner » rend ce mouvement sans préciser abusivement sa destination.
- source_word: τέμνετέ μου μέλη
  choice: Découpez mes membres
  rationale: τέμνω signifie couper; « découpez » préserve l’impératif violent et le jeu de reprise avec μέλη après l’apostrophe « membres d’un démon ».
- source_word: πυροῦτε τὰς σάρκας
  choice: brûlez mes chairs
  rationale: Le pluriel grec σάρκας est conservé par le pluriel français « chairs », registre soutenu mais courant dans une scène de supplice.
- source_word: στρεβλοῦτε τὰ ἄρθρα
  choice: disloquez mes articulations
  rationale: στρεβλόω signifie tordre ou soumettre à la torsion; appliqué aux articulations, « disloquez » donne en français une image corporelle précise et naturelle.
theological_decisions:
- issue: Portée de λογισμός dans la théologie morale de 4 Maccabées
  choice: ma raison
  alternative: mon raisonnement / ma résolution
  rationale: « Raison » conserve la notion centrale de faculté rationnelle sans la réduire à un raisonnement ponctuel ni l’assimiler entièrement à la volonté.
- issue: Image démonologique de μεροὶ δαῖμον
  choice: membres d’un démon
  alternative: instruments d’un démon
  rationale: Le texte emploie explicitement μέρη, « membres/parties ». La traduction garde cette métaphore corporelle et son ambiguïté plutôt que de l’interpréter comme une simple instrumentalité.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs restent abrupts, conformément au défi lancé par le martyr. La formulation conserve l’image frappante des tortionnaires comme « membres d’un démon » et le contraste avec ses propres membres corporels.
