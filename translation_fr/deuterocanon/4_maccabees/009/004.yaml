  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: fr
  text: Car nous jugeons que ta pitié à l’égard de notre survie contraire à la Loi est plus terrible que la mort elle-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta pitié au sujet de notre délivrance contraire à la Loi ». La formulation grecque peut désigner la pitié liée à leur préservation, celle-ci étant qualifiée de contraire à la Loi, sans préciser davantage le lien exact.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλεπώτερον
  choice: plus cruelle
  rationale: Le comparatif exprime ici quelque chose de plus dur, pénible ou terrible. « Plus cruelle » rend naturellement la force morale de l’affirmation sans la limiter à la douleur physique.
- source_word: νομίζομεν
  choice: nous estimons
  rationale: Le verbe exprime un jugement réfléchi ou une appréciation; « nous estimons » convient à un registre moderne et digne.
- source_word: ἔλεον
  choice: ta pitié
  rationale: Dans ce contexte, il s’agit de la compassion du persécuteur qui propose d’épargner leur vie. « Pitié » conserve cette nuance mieux que « miséricorde », potentiellement plus théologique.
- source_word: παρανόμῳ
  choice: au mépris de la Loi
  rationale: L’adjectif désigne ce qui est contraire à la loi. La formulation indique clairement que leur préservation exigerait la transgression de la Loi ancestrale.
- source_word: σωτηρίᾳ
  choice: nous sauver
  rationale: Le nom désigne ici la préservation physique ou la délivrance de la mort, non le salut au sens doctrinal. La tournure verbale est naturelle en français.
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: qui vise à nous sauver au mépris de la Loi
  rationale: La proposition relative rend clairement le rapport entre la pitié et la préservation proposée, tout en maintenant que cette préservation serait obtenue par une conduite contraire à la Loi.
theological_decisions:
- issue: Faut-il rendre σωτηρία par un terme explicitement théologique ?
  choice: nous sauver, au sens de préserver de la mort
  alternative: notre salut
  rationale: Le passage parle d’échapper à la mort au prix d’une transgression, et non du salut dans un sens doctrinal. Le contexte physique et juridique doit rester premier.
- issue: Faut-il comprendre παράνομος comme une absence générale de légalité ou comme une transgression de la Loi ancestrale ?
  choice: au mépris de la Loi
  alternative: de manière illégale
  rationale: Le contexte de 4 Maccabées porte sur la fidélité à la Loi. La majuscule signale ce référent sans ajouter de doctrine étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au persécuteur. La formulation conserve la vigueur du contraste avec « la mort elle-même » et évite de donner à σωτηρία un sens doctrinal absent du contexte.
