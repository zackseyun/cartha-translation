revisions:
- from: Car nous estimons que ta pitié, qui vise à nous sauver au mépris de la Loi, est plus cruelle que la mort elle-même[a].
  to: Car nous jugeons que ta pitié à l’égard de notre survie contraire à la Loi est plus terrible que la mort elle-même[a].
  rationale: 'La révision conserve la structure et l’ambiguïté du grec : la pitié est liée à la survie des interlocuteurs, laquelle est décrite comme contraire à la Loi. Elle évite d’ajouter que le persécuteur les sauverait explicitement « en les faisant transgresser » et emploie « plus terrible », plus large que « plus cruelle » pour χαλεπώτερον.'
