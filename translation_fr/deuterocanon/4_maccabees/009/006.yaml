revisions:
- from: Mais si les vieillards des Hébreux ont enduré les tortures et sont morts à cause de leur piété, il serait plus juste encore que nous, les jeunes, mourions en méprisant les tortures par lesquelles tu veux nous contraindre, celles-là mêmes que le vieux maître a vaincues.
  to: Mais si les vieillards des Hébreux sont morts après avoir enduré des tortures à cause de leur piété, nous, les jeunes, devrions mourir à plus juste titre, en méprisant les tortures que tu nous imposes, celles que le maître âgé a lui aussi vaincues.
  rationale: La révision conserve la structure conditionnelle et l’argument a fortiori du grec, ainsi que le motif de la piété. Elle retire l’ajout implicite de volonté dans la description de la coercition et emploie un équivalent plus neutre pour le maître âgé.
