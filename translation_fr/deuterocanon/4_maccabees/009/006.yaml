base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: fr
  text: Mais si les vieillards des Hébreux sont morts après avoir enduré des tortures à cause de leur piété, nous, les jeunes, devrions mourir à plus juste titre, en méprisant les tortures que tu nous imposes, celles que le maître âgé a lui aussi vaincues.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέροντες
  choice: les vieillards
  rationale: Le terme désigne ici des hommes âgés; « vieillards » conserve cette indication concrète mieux que « anciens », qui pourrait suggérer une fonction officielle.
- source_word: εὐσέβειαν
  choice: piété
  rationale: « Piété » rend le respect et la fidélité envers Dieu exprimés par εὐσέβεια dans ce contexte.
- source_word: ὑπεριδόντες
  choice: en méprisant
  rationale: Le participe exprime le fait de regarder les tortures comme négligeables et de ne pas se laisser dominer par elles; « mépriser » en garde la force.
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  choice: les tortures par lesquelles tu veux nous contraindre
  rationale: 'Cette formulation française explicite naturellement le génitif grec: les tortures servent aux mesures coercitives du tyran, sans ajouter une idée étrangère au contexte.'
- source_word: παιδευτὴς γέρων
  choice: le vieux maître
  rationale: παιδευτής désigne celui qui forme ou instruit; « maître » est naturel dans le récit et γέρων est conservé par « vieux ».
- source_word: ἐνίκησεν
  choice: a vaincues
  rationale: Le verbe signifie littéralement remporter la victoire; la formulation conserve l'image selon laquelle l'endurance du maître a triomphé des tortures.
theological_decisions:
- issue: Motif de la mort des vieillards
  choice: « sont morts à cause de leur piété »
  alternative: « sont morts par piété »
  rationale: La préposition διά avec l'accusatif marque ici la cause. Cette traduction évite de faire de la piété l'instrument de leur mort tout en gardant le lien théologique explicite du grec.
- issue: Comparatif δικαιότερον
  choice: « il serait plus juste encore »
  alternative: « à plus forte raison devrions-nous »
  rationale: Le choix conserve explicitement le langage de justice du comparatif grec, plutôt que de le réduire à un simple raisonnement de convenance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la progression rhétorique et la tension du comparatif grec, avec un ordre légèrement adapté pour rester naturel en français.
