  text: And when they asked whether he wished to eat before being tortured[a], they heard his noble resolve,
translation:
  language: fr
  text: Lorsqu’ils lui demandèrent s’il voulait manger avant d’être torturé, ils entendirent sa noble résolution[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa noble intention » ou « sa noble disposition d’esprit » ; le grec γνώμη peut désigner une intention, une résolution ou une manière de penser.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ εἰ
  choice: Comme
  rationale: Dans ce contexte narratif, la tournure introduit la circonstance liée à la question. « Comme » rend naturellement le participe qui suit sans transformer l’énoncé en hypothèse.
- source_word: φαγεῖν
  choice: manger
  rationale: L’infinitif signifie simplement « manger »; aucune explicitation supplémentaire n’est nécessaire.
- source_word: βούλοιτο
  choice: voulait
  rationale: L’imparfait convient à la question indirecte au passé et conserve la nuance de volonté.
- source_word: πρὶν βασανίζεσθαι
  choice: avant d’être torturé
  rationale: Dans ce récit de martyre, βασανίζω désigne la torture physique. Cette formulation est claire et directe en français moderne.
- source_word: πυνθανόμενοι
  choice: ils lui demandaient
  rationale: Le participe exprime ici une demande ou une enquête. Le pronom « lui » explicite en français le complément implicite fourni par le contexte.
- source_word: τὴν εὐγενῆ γνώμην
  choice: sa noble résolution
  rationale: γνώμη peut désigner la pensée, l’intention ou la décision arrêtée. Ici, « résolution » exprime le ferme dessein manifesté par sa réponse, tandis que « noble » rend εὐγενῆ sans imposer un sens social.
- source_word: ἤκουσαν
  choice: ils entendirent
  rationale: L’aoriste est rendu par un passé simple narratif, dans un registre digne et naturel.
theological_decisions:
- issue: Sens de γνώμη dans un contexte de martyre
  choice: résolution
  alternative: pensée; intention; disposition d’esprit
  rationale: « Résolution » met en valeur la détermination morale du martyr sans ajouter de notion doctrinale étrangère. Une note conserve l’étendue sémantique du grec.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif littéraire. La virgule finale est conservée parce que le verset se prolonge syntaxiquement dans le suivant.
