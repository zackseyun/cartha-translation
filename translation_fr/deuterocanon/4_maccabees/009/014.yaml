lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: chaque membre
  rationale: La tournure distributive désigne toutes les parties du corps l’une après l’autre. Avec « on lui brisait », « chaque membre » rend ce sens corporel et progressif dans un français naturel.
- source_word: κλώμενος
  choice: tandis qu’on lui brisait
  rationale: Le participe présent passif décrit le supplice en cours. La construction française active indéfinie exprime clairement qu’il subit cette action sans ajouter d’agent absent du grec.
- source_word: κατηγόρει
  choice: il continuait à les accuser
  rationale: L’imparfait grec marque ici une action prolongée. « Accuser » conserve le sens fondamental du verbe et laisse au contexte la nuance de dénonciation ou de reproche.
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit directement les paroles qui suivent et maintient la phrase ouverte sur le verset suivant.
