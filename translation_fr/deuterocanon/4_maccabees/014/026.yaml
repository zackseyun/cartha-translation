  yaml_path: translation/deuterocanon/4_maccabees/014/026.yaml
  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
translation:
  language: fr
  text: Mais, de toutes les mères[a], la mère des sept devint la plus attachée à ses enfants, elle en qui, au fil de sept grossesses, l’affection pour eux s’était profondément enracinée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus attachée à ses enfants que les autres ». Le grec emploie un comparatif qui, dans le contexte de « toutes les mères », a ici une valeur superlative.
    reason: lexical_alternative
lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: Mais, de toutes les mères
  rationale: Le génitif partitif signifie « de toutes les mères ». δέ marque ici une transition légèrement contrastive, rendue naturellement par « mais ».
- source_word: ἐγένετο
  choice: devint
  rationale: « Devint » conserve la valeur dynamique de ἐγένετο plutôt que de le réduire à une simple copule.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: la mère des sept
  rationale: Le grec dit littéralement « la mère des sept » sans répéter « fils » ; le contexte permet à cette formulation concise de rester claire.
- source_word: φιλοτεκνοτέρα
  choice: la plus attachée à ses enfants
  rationale: Le comparatif, associé à « de toutes les mères », prend naturellement en français une valeur superlative. « Attachée » exprime la vive affection envers ses enfants sans suggérer seulement l’accomplissement d’un devoir.
- source_word: ἥτις
  choice: elle en qui
  rationale: Cette tournure restitue la valeur explicative de ἥτις et permet d’exprimer naturellement l’image de l’affection implantée en elle.
- source_word: ἑπτὰ κυοφορίας
  choice: au fil de sept grossesses
  rationale: κυοφορία désigne la grossesse ou la gestation. « Au fil de » conserve l’idée d’un attachement développé à travers ces expériences successives.
- source_word: τὴν πρὸς αὐτοὺς ... φιλοστοργίαν
  choice: l’affection pour eux
  rationale: φιλοστοργία désigne une affection familiale tendre et naturelle ; le contexte maternel est déjà explicite, sans qu’il faille ajouter « maternelle ».
- source_word: ἐπιφυτευομένην
  choice: s’était profondément enracinée
  rationale: La formulation française préserve la métaphore végétale d’une affection implantée et établie en elle, tout en rendant idiomatiquement le participe grec.
