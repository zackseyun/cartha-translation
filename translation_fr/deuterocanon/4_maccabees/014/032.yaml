base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: fr
  text: Ô nature sacrée ! Ô tendresse des parents, amour filial envers eux, soins nourriciers[a] et sentiments invincibles des mères[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éducation » ou « soins reçus pour être élevé » ; le grec évoque l’entretien, la nourriture et l’éducation.
    reason: lexical_alternative
  - marker: b
    text: Ou « émotions indomptables des mères » ; le grec peut aussi signifier « souffrances invincibles », bien que ce sens soit moins probable ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: nature sacrée
  rationale: Conserve l’appel général à la nature et à l’ordre naturel des liens familiaux, dans un registre élevé mais clair.
- source_word: φίλτρα γονέων
  choice: tendresse des parents
  rationale: φίλτρα peut désigner littéralement des charmes d’amour, mais évoque ici plus naturellement les marques d’affection et les liens affectifs parentaux.
- source_word: γονεύσιν φιλοστόργε
  choice: amour filial envers eux
  rationale: L’expression évoque la tendre affection familiale dirigée vers les parents; « filial » rend explicitement cette orientation tout en évitant une formulation grecque trop littérale.
- source_word: τροφεῖα
  choice: soins nourriciers
  rationale: Le mot appartient au champ de la nourriture et de l’éducation reçues, et peut aussi évoquer ce qui est dû en retour pour ces soins. La traduction principale garde l’image concrète sans trancher entièrement cette nuance.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: sentiments invincibles des mères
  rationale: πάθη désigne ici vraisemblablement les émotions puissantes liées à l’attachement maternel; ἀδάμαστα souligne qu’elles ne se laissent ni dompter ni vaincre.
theological_decisions:
- issue: Portée de l’invocation aux liens familiaux
  choice: Présenter le verset comme une exclamation devant la force sacrée des liens naturels et de l’affection maternelle
  alternative: Comprendre πάθη principalement comme les souffrances endurées par les mères
  rationale: Le contexte et l’accumulation de termes affectifs favorisent les émotions maternelles, mais la note conserve l’ambiguïté possible de πάθη sans lui imposer une interprétation doctrinale.
translation_notes:
  register: Ponctuation exclamative et répétition de « Ô » pour restituer l’apostrophe solennelle et l’accumulation rhétorique. Français moderne international, digne et accessible.
