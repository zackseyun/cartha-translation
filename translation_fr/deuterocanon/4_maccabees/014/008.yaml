  yaml_path: translation/deuterocanon/4_maccabees/014/008.yaml
  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
translation:
  language: fr
  text: Ainsi, les jeunes hommes dansaient autour du groupe des sept[a] et en faisaient le tour, réduisant à néant la peur des tortures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne littéralement un ensemble de sept; il s’agit ici des sept frères, et non d’une semaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit naturellement en français la manière ou le résultat de ce qui précède.
- source_word: περὶ τὴν ἑβδομάδα
  choice: autour du groupe des sept
  rationale: Ἑβδομάς désigne ici l'ensemble formé par les sept frères, et non une semaine. « Groupe des sept » rend ce sens collectif sans obscurité.
- source_word: χορεύοντες
  choice: dansaient
  rationale: Le participe évoque une danse, probablement circulaire; l'idée de mouvement autour est déjà exprimée par περί et ἐκύκλουν.
- source_word: οἱ μεῖρακες
  choice: les jeunes hommes
  rationale: Désigne de jeunes personnes de sexe masculin; ce choix est exact, actuel et digne.
- source_word: ἐκύκλουν
  choice: en faisaient le tour
  rationale: L'imparfait grec exprime un mouvement circulaire en cours. Cette formulation conserve le second élément de mouvement sans la lourdeur de « encerclaient ».
- source_word: τὸν βασάνων φόβον
  choice: la peur des tortures
  rationale: Βάσανοι renvoie ici aux tortures infligées; la construction française préserve le rapport génitif sans préciser indûment s'il s'agit de les subir.
- source_word: καταλύοντες
  choice: réduisant à néant
  rationale: Exprime l'action de défaire, détruire ou rendre inopérante la peur, avec la force décisive du verbe grec.
theological_decisions:
- issue: Sens de ἑβδομάδα
  choice: référence collective au groupe des sept frères
  alternative: la semaine
  rationale: Dans le contexte du martyre des sept frères, le substantif désigne naturellement leur groupe. Le sens calendaire ne convient pas à la scène.
translation_notes:
  register: Français international moderne, clair et digne. La coordination de deux verbes à l’imparfait restitue les deux actions grecques, tandis que « réduisant à néant » conserve la force de καταλύοντες.
