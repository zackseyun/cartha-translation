base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: fr
  text: Comment pourrais-je décrire l’ardeur des parents qui aiment leurs enfants, cette ardeur qui imprime merveilleusement la ressemblance de l’âme et de la forme dans la petite figure d’un enfant, surtout parce que les pères rendent les mères plus sensibles envers ceux qui sont nés ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: Comment pourrais-je décrire
  rationale: La tournure interrogative exprime la difficulté rhétorique à mettre en mots ce qui suit; « décrire » rend clairement le verbe rare ἠθολογέω sans lui imposer un sens technique.
- source_word: φιλοτέκνα γονέων αἴθη
  choice: les élans d’amour des parents pour leurs enfants
  rationale: αἴθη évoque des ardeurs ou des mouvements affectifs intenses; « élans d’amour » est naturel en français et conserve l’intensité de l’expression qualifiée par φιλοτέκνα.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: la ressemblance de l’âme et de la forme
  rationale: La traduction maintient le contraste entre la réalité intérieure (ψυχή) et la forme extérieure (μορφή), sans réduire ψυχή au seul caractère.
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: dans la petite empreinte qu’est l’enfant
  rationale: Le composé rare παιδοχαρακτήρ appartient au champ de l’empreinte et s’accorde avec le verbe de scellement; cette formulation conserve l’image tout en restant intelligible.
- source_word: θαυμάσιον ἐναποσφραγίζοντα
  choice: qui impriment merveilleusement
  rationale: ἐναποσφραγίζω désigne l’action d’apposer ou d’imprimer un sceau. θαυμάσιον est rendu adverbialement, lecture syntaxiquement plausible qui évite de le rattacher artificiellement au féminin ὁμοιότητα.
- source_word: μάλιστα διὰ τὸ
  choice: surtout parce que
  rationale: Rend directement l’intensification et le rapport causal de la construction grecque.
- source_word: τῶν πατέρων ... τὰς μητέρας καθιστᾶναι συμπαθεστέρας
  choice: les pères rendent les mères plus sensibles
  rationale: La formulation conserve le rapport causal étonnant et quelque peu obscur du grec, au lieu de l’expliquer ou de le corriger.
- source_word: τοῖς γεννηθεῖσιν
  choice: envers ceux qui sont nés
  rationale: Traduction formellement proche du participe substantivé, qui laisse ouverte la nuance entre nouveau-nés, enfants et descendance.
theological_decisions:
- issue: Rapport entre les pères, les mères et les enfants dans la dernière proposition
  choice: Conserver littéralement l’idée que les pères rendent les mères plus sensibles envers ceux qui sont nés
  alternative: Expliciter que les mères aiment davantage leurs propres enfants à cause de leur lien avec les pères
  rationale: Le grec formule un lien causal inhabituel sans en préciser le mécanisme; l’expliciter résoudrait indûment son ambiguïté et pourrait importer une interprétation anthropologique absente du texte.
translation_notes:
  register: Français moderne, soutenu mais accessible. La longue question rhétorique et l’image du sceau sont conservées. « Âme » et « forme » maintiennent la distinction intérieure/extérieure du grec, tandis que la dernière proposition demeure volontairement énigmatique.
