base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: fr
  text: et, bien que les nombreuses souffrances endurées par chacun d’eux l’aient contrainte à éprouver de la compassion pour eux, elle ne tint pas compte, par crainte de Dieu, de la délivrance temporaire de ses enfants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la préservation temporaire » ou « du salut provisoire ». Ici, le mot grec désigne vraisemblablement le fait d’échapper immédiatement au supplice et de rester en vie, sans nécessairement parler du salut au sens théologique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠδῖνας
  choice: souffrances
  rationale: Le terme désigne des douleurs aiguës, voire des tourments. Dans ce contexte de martyre, « souffrances » exprime naturellement ce que chacun des fils endure sans imposer l’image particulière des douleurs de l’accouchement.
- source_word: συμπάθειαν
  choice: compatir avec eux
  rationale: Le nom exprime le fait de partager la souffrance ou les sentiments d’autrui. La tournure verbale est naturelle en français et conserve l’identification affective de la mère à ses fils.
- source_word: ὑπερείδειν
  choice: ne pas tenir compte de
  rationale: Le verbe indique qu’elle passe outre cette considération et ne lui accorde pas la priorité. Cette formulation préserve le contraste sans suggérer une absence d’amour maternel.
- source_word: πρόσκαιρον σωτηρίαν
  choice: la délivrance temporaire
  rationale: σωτηρία peut désigner le salut, la délivrance ou la préservation. Ici, il s’agit de soustraire les enfants au supplice et de préserver leur vie pour un temps; « délivrance temporaire » évite une lecture exclusivement sotériologique.
- source_word: φόβον
  choice: crainte
  rationale: « Crainte de Dieu » rend directement φόβος tout en pouvant inclure, en français biblique courant, la révérence et le respect mêlé de saisissement.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: par chacun d’eux
  rationale: Cette formulation conserve la valeur distributive du grec et individualise les souffrances des fils.
- source_word: ἠναγκασμένην ... ἔχειν
  choice: l’aient contrainte à compatir
  rationale: La construction exprime le caractère irrésistible de sa compassion maternelle; le français relie naturellement cette contrainte aux nombreuses souffrances.
theological_decisions:
- issue: Sens de σωτηρία dans le contexte du martyre
  choice: délivrance physique temporaire
  alternative: salut temporaire; préservation temporaire
  rationale: Le contexte immédiat porte sur la possibilité d’échapper au supplice et de survivre, non sur une affirmation explicite concernant le salut spirituel. La traduction conserve toutefois la portée générale de σωτηρία au moyen d’une note.
- issue: Portée de φόβος envers Dieu
  choice: crainte de Dieu
  alternative: respect de Dieu; révérence envers Dieu
  rationale: Le grec emploie explicitement le vocabulaire de la crainte. Le conserver maintient la tension entre la compassion maternelle et la fidélité à Dieu sans réduire φόβος au seul respect.
- issue: Rapport entre compassion maternelle et fidélité
  choice: la compassion est réelle mais ne détermine pas son choix
  alternative: elle surmonte ou supprime sa compassion
  rationale: Le grec affirme qu’elle est contrainte de compatir, puis qu’en raison de sa crainte de Dieu elle passe outre la délivrance provisoire. La traduction évite de laisser entendre que son attachement maternel disparaît.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure contrastive du grec tout en évitant une syntaxe trop lourde. « Crainte de Dieu » maintient le poids théologique du texte; « délivrance temporaire » rend naturellement la survie immédiate visée dans le contexte.
