  text: For even among birds[a], some, making their nests on houses, protect their young.
translation:
  language: fr
  text: En effet, même parmi les oiseaux[a], certains font leur nid sur les maisons et protègent leurs petits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les oiseaux apprivoisés (ou domestiques), qui font leur nid sur les maisons, protègent leurs petits » ; le lieu peut aussi se comprendre comme « dans les toits des maisons ».'
    reason: Cette note conserve la nuance de ἥμερα (« apprivoisés, domestiques ») et signale l’ambiguïté de localisation associée à κατὰ τὰς οἰκίας et ὀροφοποιοῦντα.
lexical_decisions:
- source_word: πετεινῶν
  choice: oiseaux
  rationale: Le terme désigne ici de façon générale les créatures ailées; « oiseaux » est le terme français naturel et précis dans ce contexte.
- source_word: ἥμερα
  choice: ceux qui vivent auprès des humains
  rationale: L’adjectif signifie « apprivoisés », « domestiques » ou « familiers ». La formulation retenue exprime naturellement leur proximité avec l’habitat humain sans suggérer nécessairement qu’ils ont été dressés individuellement.
- source_word: κατὰ τὰς οἰκίας
  choice: sur les maisons
  rationale: Avec le verbe composé qui évoque la construction ou l’établissement d’un nid dans la partie couverte d’un bâtiment, la préposition situe les oiseaux au niveau des maisons. « Sur les maisons » conserve la généralité du grec; la note signale l’autre compréhension possible, « dans les toits ».
- source_word: ὀροφοποιοῦντα
  choice: font leur nid
  rationale: Dans ce contexte ornithologique, le composé lié au toit décrit l’action de construire ou d’établir un nid. « Font leur nid » est idiomatique et évite l’étrange traduction littérale « font un toit ».
- source_word: προασπίζει
  choice: protègent
  rationale: Le verbe signifie défendre ou couvrir comme d’un bouclier. « Protègent » convient à l’action parentale tout en gardant l’idée de défense.
- source_word: νεοττῶν
  choice: leurs petits
  rationale: Le nom désigne les jeunes oiseaux ou oisillons. « Leurs petits » est clair, naturel et suffisamment large.
