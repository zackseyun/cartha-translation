base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/031.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: fr
  text: Mais la mère exhortait chacun de ses fils, l’un après l’autre[a], et tous ensemble, à mourir par piété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chacun de ses fils séparément ». Littéralement : « selon chacun » ou « un par un ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne une dévotion révérente et un attachement fidèle envers Dieu.
    reason: lexical_explanation
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mais
  rationale: Introduit une légère opposition ou relance par rapport au contexte précédent, sans alourdir la phrase française avec « mais aussi ».
- source_word: καθʼ ἕνα παῖδα
  choice: chacun de ses fils, un par un
  rationale: καθʼ ἕνα exprime une distribution individuelle. Dans ce récit, παῖδα désigne les enfants mâles de la mère ; « fils » rend donc clairement la relation familiale.
- source_word: ὁμοῦ πάντας
  choice: tous ensemble
  rationale: Conserve le contraste entre l’exhortation adressée à chacun séparément et celle adressée collectivement à tous.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Suit directement le grec articulé tout en restant naturel en français.
- source_word: ἐπὶ ... προέτρεπεν
  choice: exhortait ... à
  rationale: προτρέπω exprime une incitation pressante ; la construction française avec « à » rend naturellement l’orientation vers l’issue mentionnée.
- source_word: τὸν ... θάνατον
  choice: mourir
  rationale: La verbalisation est idiomatique en français et conserve la force directe de l’orientation vers la mort.
- source_word: τῆς εὐσεβείας
  choice: par fidélité à Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne une piété active, faite de respect religieux et de fidélité envers Dieu. Cette formulation explicite la portée religieuse du terme sans lui imposer un sens doctrinal ultérieur.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: par fidélité à Dieu
  alternative: par piété
  rationale: « Fidélité à Dieu » communique clairement l’attachement religieux qui motive l’acceptation de la mort. « Piété » est plus formellement proche, mais peut aujourd’hui évoquer une simple dévotion personnelle ou une attitude affectée ; la note conserve cette possibilité lexicale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation maintient le parallélisme entre l’exhortation individuelle et collective, ainsi que le lien entre la mort et la fidélité religieuse.
