base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: fr
  text: Car même les abeilles[a], à l’époque où elles produisent la cire, se défendent contre ceux qui s’approchent ; elles frappent de leur aiguillon[b], comme avec du fer, ceux qui s’approchent de leur couvain[c], et le défendent jusqu’à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps de la production de cire » ou « à l’époque où elles construisent leurs rayons » ; le grec évoque précisément la production de cire ou la formation des rayons, et non simplement celle du miel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec le κέντρον » ; dans ce contexte, ce mot désigne naturellement l’aiguillon.
    reason: lexical_alternative
  - marker: c
    text: Le grec désigne leur « couvain », dans une image de protection de la progéniture ; la comparaison est rhétorique plutôt qu’une description zoologique technique.
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Car même
  rationale: Introduit avec insistance un exemple à l’appui de l’argument ; « Car même » rend naturellement cette valeur en français.
- source_word: μέλισσαι
  choice: les abeilles
  rationale: Équivalent zoologique direct et courant.
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: à l’époque où elles produisent la cire
  rationale: κηρογονία désigne spécifiquement la production de cire ou la formation des rayons ; cette formulation reste proche du grec tout en étant claire.
- source_word: ἐπαμύνονται
  choice: se défendent
  rationale: Le verbe exprime une résistance défensive ; au premier emploi, l’absence d’objet explicite favorise la tournure pronominale.
- source_word: τοὺς προσιόντας
  choice: ceux qui s’approchent
  rationale: Rend sans ajout d’hostilité le participe présent désignant ceux qui viennent près.
- source_word: καθάπερ σιδήρῳ
  choice: comme avec du fer
  rationale: Conserve la comparaison frappante du grec sans en préciser indûment la portée.
- source_word: τῷ κέντρῳ
  choice: au moyen de leur aiguillon
  rationale: Dans le contexte des abeilles, κέντρον désigne naturellement l’organe qui pique.
- source_word: πλήσσουσι
  choice: elles frappent
  rationale: Équivalent direct qui préserve la vigueur de l’image.
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: de leur couvain
  rationale: « Couvain » est le terme français naturel pour l’ensemble des œufs, larves et nymphes d’une colonie, tout en conservant l’image de la progéniture protégée.
- source_word: ἐπαμύνονται ἕως θανάτου
  choice: le défendent jusqu’à la mort
  rationale: Le couvain fournit l’antécédent contextuel naturel ; « jusqu’à la mort » reproduit directement l’intensité de l’expression grecque.
