  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: fr
  text: Mais les animaux qui font leur nid sur les sommets des montagnes, dans les crevasses des ravins, dans les cavités des arbres et aux extrémités de ces lieux mettent bas et empêchent quiconque de s’approcher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « et à leurs extrémités » ; le pronom peut renvoyer collectivement aux lieux mentionnés, et « extrémités » peut aussi désigner leurs parties les plus élevées.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: Quant à ceux qui, sur les sommets des montagnes
  rationale: Le neutre pluriel substantivé est rendu par « ceux qui »; « sur les sommets » exprime naturellement la valeur locative de κατά avec l’accusatif.
- source_word: φαράγγων ἀπορρῶγας
  choice: dans les crevasses des ravins
  rationale: ἀπορρώξ désigne une fissure, une crevasse ou une paroi rompue; cette formulation conserve l’image d’un relief escarpé.
- source_word: δένδρων ὀπὰς
  choice: dans les cavités des arbres
  rationale: ὀπή signifie trou, ouverture ou cavité; « cavités » convient au contexte de nidification sans préciser indûment leur forme.
- source_word: τὰς τούτων ἄκρας
  choice: à leurs extrémités
  rationale: La traduction garde le sens littéral et l’ambiguïté du pronom, qui peut renvoyer collectivement aux lieux mentionnés.
- source_word: νοσσοποιούμενα
  choice: font leur nid
  rationale: Le participe désigne l’action de construire ou d’établir un nid; l’expression est idiomatique en français moderne.
- source_word: ἀποτίκτει
  choice: ils mettent bas
  rationale: Le verbe signifie enfanter ou produire des petits; « mettre bas » convient ici aux animaux évoqués.
- source_word: τὸν προσιόντα κωλύει
  choice: tiennent à distance celui qui s’approche
  rationale: La formulation restitue le sens concret de κωλύει dans le contexte de la protection du nid, tout en conservant le singulier générique du participe.
