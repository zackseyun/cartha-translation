  text: O most holy seven of harmonious brothers[a], for just as in the creation of the world the days are concerned with godliness[b],
translation:
  language: fr
  text: Ô très saint groupe de sept frères unis[a] ! En effet, de même que, lors de la création du monde, les jours ont rapport à la piété[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ô très sainte heptade de frères en accord ». Le grec désigne collectivement les sept frères.'
