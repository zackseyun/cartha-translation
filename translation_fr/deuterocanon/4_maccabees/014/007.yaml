lexical_decisions:
- source_word: πανάγιε
  choice: très saint
  rationale: Le vocatif singulier qualifie collectivement le groupe des sept. « Très saint » restitue la forte valeur intensive de πανάγιος dans un français digne et naturel.
- source_word: συμφώνων
  choice: vivant dans l’unité
  rationale: Le terme exprime l’accord et la concorde entre les frères. Cette formulation conserve l’idée d’unisson sans employer le peu naturel « harmonieux » pour des personnes.
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le masculin pluriel désigne explicitement les sept frères du récit.
- source_word: ἑβδομάς
  choice: groupe de sept
  rationale: Le substantif désigne un ensemble de sept. « Groupe de sept » rend clairement sa valeur collective, là où « septénaire » serait technique.
- source_word: κοσμοποιίας
  choice: création du monde
  rationale: Le composé grec désigne la formation du cosmos; cette expression française en conserve clairement la portée.
- source_word: ἡμέραι
  choice: jours
  rationale: Équivalent direct du nom grec.
- source_word: περὶ τὴν εὐσέβειαν
  choice: se rapportent à la piété
  rationale: La construction grecque est condensée et son lien exact avec les jours est éclairé par la suite de la comparaison. « Se rapportent à » évite de préciser excessivement ce rapport, tandis que « piété » rend la vertu religieuse et morale centrale du livre.
theological_decisions:
- issue: Traduction de εὐσέβεια
  choice: piété
  alternative: fidélité envers Dieu
  rationale: « Piété » conserve la dimension à la fois religieuse et éthique du terme sans réduire celui-ci à un simple sentiment dévotionnel. L’alternative explicite davantage son orientation, mais interprète plus fortement.
- issue: Comparaison inachevée à la fin du verset
  choice: maintenir la proposition ouverte avec une virgule
  alternative: compléter la comparaison à partir du verset suivant
  rationale: Le grec introduit ici par καθάπερ une comparaison dont l’aboutissement vient ensuite. La conserver inachevée respecte la syntaxe et la tension du texte source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe exclamative conserve le ton élevé du grec. La formulation évite le terme savant « heptade » dans le texte principal, tout en le signalant en note.
