  yaml_path: translation/deuterocanon/4_maccabees/014/022.yaml
  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
translation:
  language: fr
  text: 'une mère, ayant devant elle deux réalités : la piété envers Dieu[a] et la sauvegarde provisoire de ses sept fils, selon la promesse du tyran[b] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la crainte de Dieu ». Le grec εὐσέβεια désigne ici une dévotion fidèle et révérencieuse envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « la délivrance temporaire ». Le grec évoque ici la préservation provisoire de la vie promise par le tyran, et non nécessairement le salut dans un sens théologique plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: une mère
  rationale: Le nom sans article reprend la mère dans le fil de la phrase ; l’indéfini est naturel en français sans imposer une détermination absente du grec.
- source_word: δυεῖν προκειμένων
  choice: placée devant deux choix
  rationale: La tournure circonstancielle présente deux réalités offertes comme termes d’une alternative ; cette formulation conserve l’image de ce qui est placé devant elle tout en restant idiomatique.
- source_word: εὐσεβείας
  choice: le respect de Dieu
  rationale: Dans 4 Maccabées, εὐσέβεια désigne une fidélité révérencieuse orientée vers Dieu. « Respect de Dieu » est clair en français moderne et évite que « piété » soit compris comme une simple pratique dévote.
- source_word: σωτηρίας προσκαίρου
  choice: la sauvegarde temporaire
  rationale: Dans ce contexte, σωτηρία désigne le fait d’être préservé d’une mort immédiate, tandis que πρόσκαιρος souligne le caractère provisoire de cette préservation.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: de ses sept fils
  rationale: Le possessif, implicite dans le contexte, est requis par l’usage naturel du français et identifie les fils comme ceux de la mère.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: conformément à la promesse du tyran
  rationale: 'κατά avec l’accusatif exprime ici la conformité ou le fondement : cette sauvegarde correspond à ce que le tyran avait promis.'
theological_decisions:
- issue: Rendu de εὐσέβεια dans le contexte du martyre
  choice: le respect de Dieu
  alternative: la piété
  rationale: Le choix explicite l’orientation vers Dieu propre au terme dans l’ouvrage, sans réduire celui-ci à une religiosité générale ni ajouter une doctrine particulière.
- issue: Rendu de σωτηρία dans ce contexte
  choice: la sauvegarde temporaire
  alternative: le salut temporaire
  rationale: Il s’agit de la conservation provisoire de la vie promise par le tyran. « Sauvegarde » évite les connotations eschatologiques que « salut » pourrait introduire ici.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure un fragment syntaxique lié à son contexte, comme dans le grec ; le point-virgule final en signale la continuité.
