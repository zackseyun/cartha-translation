  source_fidelity: 'Le grec présente la mère avec « deux choses placées devant elle » : εὐσέβεια et la σωτηρία provisoire de ses sept fils, conditionnée par la promesse du tyran. « Placée devant deux choix » inverse légèrement l’image syntaxique : ce sont les deux réalités qui sont placées devant elle. « Respect de Dieu » est ambigu en français, pouvant se comprendre comme le respect que Dieu manifeste; « piété envers Dieu » rend plus clairement l’orientation de εὐσέβεια.'
  naturalness: 'La phrase révisée conserve le fragment solennel et le point-virgule de continuité, tout en employant une construction française naturelle : « ayant devant elle deux réalités ».'
  terminology: « Piété envers Dieu » correspond au sens religieux et éthique de εὐσέβεια sans imposer une interprétation confessionnelle. « Sauvegarde provisoire » exprime la préservation physique et temporaire visée par σωτηρία πρόσκαιρος.
