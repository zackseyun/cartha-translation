  yaml_path: translation/deuterocanon/4_maccabees/014/023.yaml
  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: fr
  text: Elle a aimé davantage la piété[a], celle qui sauve en vue de la vie éternelle selon Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’attachement respectueux à Dieu » ; le mot grec désigne une dévotion envers Dieu qui se traduit dans la conduite.
    reason: lexical_alternative
  - marker: b
    text: L’expression « selon Dieu » peut aussi se comprendre comme « conformément à la volonté de Dieu » ou « au jugement de Dieu ». Le grec ne précise pas clairement à quel élément de la phrase elle se rattache.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: la piété
  rationale: Dans ce contexte juif hellénistique, εὐσέβεια désigne un attachement révérencieux à Dieu qui se manifeste dans la conduite. « Piété » en conserve les dimensions religieuse et éthique.
- source_word: μᾶλλον ἠγάπησεν
  choice: a aimé davantage
  rationale: Cette formulation rend distinctement le sens fondamental de ἀγαπάω, « aimer », et la comparaison exprimée par μᾶλλον, sans remplacer le verbe par l'interprétation « préférer ».
- source_word: τὴν σώζουσαν
  choice: celle qui sauve
  rationale: L'article et le participe féminin reprennent εὐσέβειαν. « Celle qui sauve » restitue clairement cette construction attributive en français.
- source_word: εἰς αἰώνιον ζωὴν
  choice: en vue de la vie éternelle
  rationale: εἰς exprime ici la visée ou l'aboutissement. « En vue de » conserve cette orientation sans employer une tournure française archaïque ou laisser entendre un déplacement spatial.
- source_word: κατὰ θεόν
  choice: selon Dieu
  rationale: 'La formule volontairement concise reste proche du grec et préserve son ouverture : elle peut évoquer la volonté, la norme ou le jugement de Dieu.'
theological_decisions:
- issue: Portée et sens de κατὰ θεόν
  choice: selon Dieu
  alternative: conformément à la volonté de Dieu ; au jugement de Dieu
  rationale: Le grec ne précise ni si l'expression qualifie la piété, son action salvatrice ou la vie éternelle, ni si κατά renvoie surtout à la volonté, à la norme ou au jugement de Dieu. La traduction conserve cette tension plutôt que de la résoudre.
- issue: Sujet grammatical non exprimé dans ce verset
  choice: Elle
  alternative: Il ; omission du pronom dans une reformulation
  rationale: La forme verbale grecque n'indique pas le genre, mais le contexte immédiat a pour sujet la mère des sept fils. Le féminin assure la continuité narrative sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « celle qui sauve » clarifie le lien avec « la piété », tandis que « selon Dieu » conserve la formulation ramassée et l'ambiguïté réelles du grec.
