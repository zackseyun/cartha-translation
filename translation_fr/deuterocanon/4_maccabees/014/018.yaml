  text: And why is it necessary to point out[a], by means of the irrational animals[b], the affection for their children?
translation:
  language: fr
  text: Et pourquoi faut-il démontrer, par les animaux dépourvus de raison[a], l’affection qu’ils portent à leurs petits[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par les animaux sans raison ». Ou : « au moyen des animaux privés de raison ». Le grec souligne qu’ils ne possèdent pas la raison, par contraste avec les êtres humains.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la tendresse envers leur descendance » ou « l’affection envers leur progéniture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δεῖ
  choice: pourquoi faut-il
  rationale: Cette tournure idiomatique conserve la force de la question rhétorique et laisse entendre que cette démonstration est superflue.
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: par l’exemple des animaux dépourvus de raison
  rationale: La préposition διά présente les animaux comme le moyen de la démonstration. « Dépourvus de raison » maintient le contraste grec entre les animaux et la rationalité humaine sans employer le terme français ambigu « irrationnels ».
- source_word: ἐπιδεικνύναι
  choice: démontrer
  rationale: Le verbe signifie ici faire voir ou établir quelque chose au moyen d’un exemple.
- source_word: συμπάθειαν
  choice: affection
  rationale: Dans ce contexte parental, le mot désigne un attachement tendre plutôt que la « sympathie » au sens moderne courant.
- source_word: πρὸς τὰ τέκνα
  choice: envers leur progéniture
  rationale: τέκνα désigne ici les descendants ou petits des animaux. « Progéniture » permet de conserver une formulation commune aux êtres humains et aux animaux, tandis que le possessif est explicité par le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde la forme rhétorique du grec. « Par l’exemple de » rend explicite la fonction illustrative des animaux sans atténuer le contraste philosophique porté par ἀλόγων.
