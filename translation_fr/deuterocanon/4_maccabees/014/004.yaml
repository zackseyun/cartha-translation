  text: None of the seven young men became cowardly[a], nor did they shrink back from death;
translation:
  language: fr
  text: Aucun des sept jeunes hommes ne se montra lâche et ne recula devant la mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’hésita pas face à la mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  choice: Aucun des sept jeunes hommes
  rationale: La construction partitive avec ἐκ signifie « aucun parmi les sept ». « Jeunes hommes » rend le masculin μειρακίων sans leur donner la connotation enfantine de « garçons ».
- source_word: ἐδειλίασεν
  choice: ne se montra lâche
  rationale: δειλιάω exprime le fait de manquer de courage ou d’agir lâchement. Cette formulation conserve la nuance morale du grec tout en restant naturelle en français.
- source_word: οὐδὲ
  choice: et ne
  rationale: Après « aucun… ne », « et ne » coordonne naturellement les deux prédicats négatifs en français, sans suggérer que la première proposition pourrait être affirmative.
- source_word: πρὸς τὸν θάνατον ὤκνησεν
  choice: ne recula devant la mort
  rationale: ὀκνέω peut exprimer l’hésitation ou le recul. Avec πρὸς τὸν θάνατον, « reculer devant la mort » restitue clairement l’idée de ne pas se dérober face à elle.
theological_decisions:
- issue: Forme singulière appliquée aux sept jeunes hommes
  choice: Conserver le singulier distributif au moyen de « Aucun… ne se montra… et ne recula »
  alternative: 'Employer une formulation plurielle : « Les sept jeunes hommes ne se montrèrent pas lâches et ne reculèrent pas devant la mort »'
  rationale: Les verbes grecs sont au singulier parce qu’ils dépendent de οὐδεὶς, « aucun ». Le français permet de garder cette structure et son insistance sur chacun des sept sans créer de discordance grammaticale.
translation_notes:
  register: Français moderne, digne et direct. La structure singulière distributive du grec est conservée naturellement. « Jeunes hommes » est internationalement compréhensible et évite tant l’archaïsme de « jeunes gens » que la connotation enfantine de « garçons ».
