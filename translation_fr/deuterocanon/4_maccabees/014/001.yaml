  yaml_path: translation/deuterocanon/4_maccabees/014/001.yaml
  text: Moreover[a], by urging them on to torture, they sought that they should not only despise the pains, but also master the emotions of brotherly affection for their brothers.
translation:
  language: fr
  text: De plus, en les poussant à subir la torture, ils cherchaient à les amener non seulement à mépriser les douleurs, mais aussi à maîtriser les passions[a] de leur affection fraternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les élans » ou « les émotions ». Le grec πάθη désigne ici des mouvements affectifs intenses liés à l’affection fraternelle, que le texte présente comme devant être maîtrisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέτι
  choice: De plus
  rationale: Marque naturellement l’ajout d’un nouvel élément dans la progression de l’argument.
- source_word: ἐπὶ τὸν αἰκισμόν
  choice: vers la torture
  rationale: Dans ce contexte de martyre, αἰκισμός désigne des sévices physiques cruels; « torture » en restitue clairement la gravité.
- source_word: ἐποτρύνοντες
  choice: en les poussant
  rationale: Rend le participe et son idée d’incitation active, tout en conservant une syntaxe française fluide.
- source_word: ὡς μὴ μόνον ... ἀλλὰ καί
  choice: ils voulaient qu’ils parviennent non seulement à… mais aussi à
  rationale: Exprime la visée indiquée par ὡς avec l’infinitif sans transformer cette nuance en résultat certain.
- source_word: τῶν ἀλγηδόνων
  choice: les douleurs
  rationale: Terme direct et digne pour les souffrances physiques infligées pendant la torture.
- source_word: περιφρονῆσαι
  choice: mépriser
  rationale: Conserve la force du verbe, qui présente les douleurs comme tenues pour négligeables.
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: leur amour fraternel pour leurs frères
  rationale: Préserve l’insistance explicite et quelque peu répétitive du grec sur l’amour entre frères.
- source_word: παθῶν
  choice: les élans
  rationale: « Élans » désigne ici les mouvements affectifs intenses liés à l’amour fraternel, sans réduire πάθη aux seules émotions modernes ni imposer un jargon philosophique.
- source_word: κρατῆσαι
  choice: maîtriser
  rationale: 'Correspond au thème central du livre: exercer une domination sur les mouvements affectifs plutôt que les supprimer.'
theological_decisions:
- issue: Sens de πάθη dans le cadre moral et philosophique de 4 Maccabées
  choice: les élans
  alternative: les passions; les émotions
  rationale: Le terme désigne des mouvements affectifs soumis à la maîtrise de la raison. « Élans » reste accessible et convient particulièrement à l’affection familiale évoquée ici, tandis que la note conserve les autres possibilités.
- issue: Rapport entre la maîtrise morale et l’amour fraternel
  choice: maîtriser les élans de leur amour fraternel
  alternative: vaincre leur amour fraternel
  rationale: Le grec porte sur la maîtrise des πάθη associés à la φιλαδελφία, non sur l’abolition ou la condamnation de l’amour fraternel lui-même.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve la forte insistance familiale du grec et la tension entre amour fraternel et maîtrise des mouvements affectifs sous la torture.
