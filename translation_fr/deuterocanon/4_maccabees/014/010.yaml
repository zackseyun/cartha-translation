  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
translation:
  language: fr
  text: Qu’y aurait-il de plus douloureux que cela ? Car la force du feu, vive et brève, détruisit[a] rapidement les corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désagrégea rapidement les corps ». Le verbe grec peut signifier « dissoudre », « désagréger » ou « détruire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: Qu’y aurait-il de plus douloureux que cela ?
  rationale: La tournure conserve la question rhétorique et rend naturellement le comparatif ἐπαλγέστερον, qui exprime une douleur plus grande.
- source_word: ὀξεῖα
  choice: vive
  rationale: Dans la description de l’action du feu, « vive » restitue l’idée d’acuité et d’intensité de ὀξεῖα sans produire en français la formulation peu naturelle « une force tranchante ».
- source_word: σύντομος
  choice: brève
  rationale: Le terme signifie ici que l’action du feu est de courte durée; « brève » préserve cette valeur distincte de ταχέως, qui exprime ensuite la rapidité.
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: la force du feu
  rationale: « Force » rend clairement δύναμις comme puissance agissante du feu et forme une expression française naturelle.
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: détruisit rapidement les corps
  rationale: διέλυσε peut désigner la désagrégation ou la destruction. « Détruisit » reste sobre et moins interprétatif que « consuma », tandis que « rapidement » rend explicitement ταχέως.
