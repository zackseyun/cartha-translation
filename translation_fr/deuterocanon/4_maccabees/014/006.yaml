  - severity: low
    issue: Ajout de « subie »
    rationale: Le grec qualifie la mort comme étant « pour elle » (ὑπὲρ αὐτῆς), sans adjectif ou participe équivalent à « subie »; l’ajout est évitable.
  - severity: low
