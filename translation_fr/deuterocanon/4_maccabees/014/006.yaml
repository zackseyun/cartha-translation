base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: fr
  text: Car, de même que les mains et les pieds se meuvent en harmonie avec les directives de l’âme, de même ces jeunes gens saints, comme mus par l’âme immortelle de la piété[a], ont consenti à la mort pour elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du respect dû à Dieu » pour « de la piété » (εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: 'Le grec reprend la même famille de mots : les membres se meuvent « en harmonie » (συμφώνως) et les jeunes gens « consentent » à la mort (συνεφώνησαν), soulignant l’unité de leur résolution.'
    reason: wordplay
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  choice: de même que… de même
  rationale: Cette tournure française restitue clairement les deux membres de la comparaison grecque.
- source_word: συμφώνως
  choice: en harmonie avec
  rationale: L’expression désigne l’accord des mouvements du corps avec la direction de l’âme et prépare l’écho avec συνεφώνησαν.
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: les directives de l’âme
  rationale: « Directives » exprime la conduite ou l’orientation exercée par l’âme sans durcir le terme en « ordres ».
- source_word: ἱεροὶ μειρᾶκες
  choice: ces jeunes gens saints
  rationale: « Jeunes gens » rend naturellement μειρᾶκες, tandis que « saints » conserve leur qualification religieuse et morale.
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: comme sous l’impulsion de l’âme immortelle de la piété
  rationale: La formulation maintient la comparaison et la personnification sans transformer l’image en affirmation métaphysique technique.
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  choice: avec la mort subie pour elle
  rationale: Cette traduction conserve l’orientation vers la mort endurée en faveur de la piété, le pronom « elle » reprenant celle-ci.
- source_word: συνεφώνησαν
  choice: se sont accordés avec
  rationale: Le verbe reprend le vocabulaire de l’harmonie employé plus tôt et présente la résolution commune des jeunes gens.
theological_decisions:
- issue: Personnification de la piété comme dotée d’une « âme immortelle »
  choice: Conserver littéralement l’image comparative de « l’âme immortelle de la piété ».
  alternative: 'Interpréter : « mus par une âme immortelle, c’est-à-dire par la piété » ou « par l’esprit immortel de la piété ».'
  rationale: Le grec laisse subsister une image rhétorique dense. La traduction évite d’en faire soit une définition doctrinale de l’âme, soit une simple abstraction explicitée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure comparative et l’image de l’âme qui dirige les membres sont conservées; la répétition du vocabulaire de l’accord est rendue autant que le permet un français naturel.
