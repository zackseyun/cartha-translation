  source_fidelity: La comparaison καθάπερ… οὕτως est conservée, de même que l’image rhétorique de la « piété » dotée d’une âme immortelle. Toutefois, « se sont accordés avec la mort subie pour elle » ne rend pas idiomatiquement συνεφώνησαν πρὸς τὸν … θάνατον et ajoute inutilement « subie ». « Ont consenti à la mort pour elle » exprime de façon exacte leur assentiment à la mort en faveur de la piété.
  naturalness: La révision remplace une construction française peu naturelle (« s’accorder avec la mort ») par une formulation soutenue mais claire et internationale. « Comme mus par » rend naturellement l’agent figuré introduit par ὑπό.
  terminology: '« Piété » est un rendu établi et adéquat de εὐσέβεια dans ce contexte. « Jeunes gens saints » conserve à la fois μειρᾶκες et ἱεροί. La note sur le jeu de mots est rectifiée : le français ne répète pas exactement la même famille lexicale, mais le grec le fait.'
