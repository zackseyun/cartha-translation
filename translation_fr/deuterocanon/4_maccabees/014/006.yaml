revisions:
- from: En effet, de même que les mains et les pieds se meuvent en harmonie avec les directives de l’âme, de même ces jeunes gens saints, comme sous l’impulsion de l’âme immortelle de la piété[a], se sont accordés avec la mort subie pour elle[b].
  to: Car, de même que les mains et les pieds se meuvent en harmonie avec les directives de l’âme, de même ces jeunes gens saints, comme mus par l’âme immortelle de la piété[a], ont consenti à la mort pour elle[b].
  rationale: La révision corrige la principale maladresse idiomatique tout en conservant la structure comparative, la personnification volontairement dense de la piété et l’orientation de la mort « pour elle ». Elle ne transforme pas l’image en énoncé doctrinal. La note b explique désormais correctement l’écho lexical grec sans prétendre à une identité de famille de mots en français.
