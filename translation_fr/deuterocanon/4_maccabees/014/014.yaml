  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
translation:
  language: fr
  text: Car même les animaux dépourvus de raison[a] éprouvent envers leur progéniture[b] une sympathie et une affection comparables à celles des êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les animaux sans raison ». Le grec souligne le contraste entre les êtres dépourvus de faculté rationnelle et les êtres humains.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ce qui naît d’eux », c’est-à-dire leur propre progéniture.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Car même
  rationale: Dans le contexte, la tournure introduit un argument à l’appui et porte une nuance emphatique, plutôt qu’un sens strictement locatif.
- source_word: τὰ ἄλογα ζῷα
  choice: les animaux dépourvus de raison
  rationale: Cette formulation naturelle conserve le contraste grec entre les animaux sans faculté rationnelle et les êtres humains, sans la connotation moderne de comportement absurde que pourrait avoir « irrationnels ».
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: envers les petits nés d’eux
  rationale: « Les petits » désigne clairement la progéniture animale, tandis que « nés d’eux » maintient l’explicitation du grec.
- source_word: συνπίθειαν
  choice: sympathie
  rationale: Le terme exprime une communauté de sentiment ou une sensibilité à ce qu’éprouve l’autre. « Sympathie » en garde le sens direct, distinct de l’affection familiale exprimée ensuite.
- source_word: στοργὴν
  choice: affection
  rationale: Le mot désigne particulièrement l’attachement naturel au sein de la famille, ici celui des parents envers leur progéniture.
- source_word: ὁμοίαν … τοῖς ἀνθρώποις
  choice: semblables à celles des êtres humains
  rationale: Le pluriel français accorde clairement la comparaison aux deux noms, « sympathie » et « affection », et « êtres humains » rend le grec générique sans restriction masculine.
