  yaml_path: translation/deuterocanon/4_maccabees/014/005.yaml
  text: But all of them[a], as though running on a road to immortality, were hurrying toward death through tortures[b],
translation:
  language: fr
  text: Mais tous, comme s’ils couraient sur une route menant à l’immortalité[a], se hâtaient vers la mort à travers les tortures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur le chemin de l’immortalité ».'
    reason: Variante idiomatique de la métaphore ἐπʼ ἀθανασίας ὁδόν.
  - marker: b
    text: 'Ou : « à travers les tourments ».'
    reason: βασάνων peut désigner des tortures infligées ou, plus largement, de cruels tourments.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec ce qui précède, de manière naturelle en français moderne.
- source_word: πάντες
  choice: tous
  rationale: Désigne collectivement l’ensemble du groupe déjà évoqué, sans ajouter un pronom absent du grec.
- source_word: ὥσπερ
  choice: comme si
  rationale: Introduit une comparaison et préserve le caractère imagé de l’énoncé.
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: sur une route menant à l’immortalité
  rationale: Conserve l’image d’un trajet et rend naturellement la relation entre la route et l’immortalité, sans remplacer le terme théologique par une interprétation.
- source_word: τρέχοντες
  choice: couraient
  rationale: Rend directement le participe de τρέχω et maintient l’image du mouvement rapide.
- source_word: ἐπὶ τὸν ... θάνατον
  choice: vers la mort
  rationale: Exprime la direction indiquée par ἐπί avec l’accusatif et prolonge l’image du déplacement.
- source_word: διὰ τῶν βασάνων
  choice: à travers les tortures
  rationale: Préserve à la fois l’idée du passage par les souffrances infligées et leur rôle dans la marche vers la mort.
- source_word: ἔσπευδον
  choice: se hâtaient
  rationale: L’imparfait rend l’action en cours, tandis que « se hâtaient » exprime l’empressement du verbe grec dans un registre digne et actuel.
theological_decisions:
- issue: Sens de ἀθανασία dans le contexte du martyre
  choice: immortalité
  alternative: vie éternelle
  rationale: Le nom grec signifie directement l’absence de mort ou l’immortalité. « Vie éternelle » expliciterait théologiquement le terme et réduirait sa portée propre; la traduction conserve donc « immortalité ».
translation_notes:
  register: Français international moderne, fluide et digne. La métaphore continue de la course et du trajet est maintenue; « se hâtaient » évite un ton trop familier tout en restant compréhensible.
