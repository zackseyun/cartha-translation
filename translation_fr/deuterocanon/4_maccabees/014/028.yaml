base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: fr
  text: 'Mais ce n’était pas tout : c’était aussi en raison de l’excellence morale[a] de ses fils et de leur obéissance à la Loi[b] qu’elle éprouvait pour eux une affection maternelle encore plus grande.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « noblesse de caractère » ; le terme grec associe bonté morale et noblesse de caractère.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la Loi juive ancestrale, la Torah.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: 'Mais ce n’était pas tout : en raison aussi de'
  rationale: Cette tournure rend la transition forte et l’ajout d’un nouveau motif, sans reproduire lourdement l’enchaînement grec.
- source_word: καλοκἀγαθίαν
  choice: noble vertu
  rationale: L’expression associe excellence morale et noblesse de caractère; « noble vertu » conserve ces deux nuances dans un français naturel.
- source_word: τῶν υἱῶν
  choice: de ses fils
  rationale: Le grec désigne explicitement des fils, et le possessif est naturellement fourni par le contexte maternel.
- source_word: εὐπείθειαν
  choice: obéissance
  rationale: Le terme exprime une disposition volontaire à se conformer; « obéissance » convient clairement avec le complément « à la Loi ».
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Dans le contexte de 4 Maccabées, il s’agit de la Loi juive ancestrale, et la majuscule aide à signaler ce référent précis.
- source_word: μείζω
  choice: encore plus grande
  rationale: Cette formulation conserve le comparatif et sa force d’intensification par rapport à ce qui précède.
- source_word: φιλοστοργίαν
  choice: affection maternelle
  rationale: Le mot désigne une profonde affection familiale naturelle; le contexte permet de préciser son caractère maternel.
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: elle éprouvait pour eux
  rationale: Cette formulation française idiomatique restitue l’idée de posséder ou ressentir une affection à leur égard.
theological_decisions:
- issue: Référence de « la Loi »
  choice: La Loi juive ancestrale, c’est-à-dire la Torah
  alternative: La loi au sens moral général
  rationale: Dans 4 Maccabées, la fidélité des martyrs est régulièrement définie par leur attachement à la Loi ancestrale; le contexte exclut donc une simple légalité morale générique.
- issue: Terme familial genré
  choice: fils
  alternative: enfants
  rationale: Le grec emploie le masculin spécifique υἱῶν et le contexte concerne les sept fils de la mère; « fils » préserve cette précision.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe rhétorique du grec est assouplie sans effacer l’ajout emphatique; « affection maternelle » explicite sobrement le lien familial fourni par le contexte.
