  source_fidelity: La proposition rend correctement l’impératif « voyez », le caractère complexe de πολυπλόκος et la portée générale de l’affection parentale. Toutefois, « communion de sentiments » s’éloigne de συμπάθεια (« sympathie », « compassion », fait de ressentir avec) et efface trop nettement l’image des σπλάγχνα, les « entrailles » comme siège de la compassion profonde.
  naturalness: « La compassion qui vient des entrailles » est idiomatique dans un registre soutenu mais accessible et conserve l’image affective antique sans recourir à une formulation anatomique inutilement lourde. « Attire » exprime naturellement la force de ἕλκουσα.
  terminology: « L’affection qu’un parent porte à ses enfants » rend explicitement, sans restriction maternelle, la valeur de φιλοτεκνίας στοργή. La note conserve à juste titre « amour maternel » comme possibilité contextuelle, non comme sens exclusif. « Compassion » rend ici mieux συμπάθεια que « communion de sentiments ».
