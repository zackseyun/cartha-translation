  text: But see how intricate the affection of love for children is[a], drawing everything toward the sympathy of the inward parts.
translation:
  language: fr
  text: 'Mais voyez combien l’affection qu’un parent porte à ses enfants est complexe[a] : elle attire tout vers la compassion qui vient des entrailles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour maternel » dans ce contexte, qui parle de la mère des sept frères ; le terme grec désigne toutefois plus largement l’affection d’un parent pour ses enfants.
    reason: 'Alternative lexicale et précision contextuelle : le contexte immédiat est maternel, tandis que le terme grec conserve une portée parentale générale.'
lexical_decisions:
- source_word: θεωρεῖτε
  choice: voyez
  rationale: L’impératif pluriel invite directement les destinataires à observer et à considérer ce qui vient d’être exposé.
- source_word: πολυπλόκος
  choice: complexe
  rationale: Le terme évoque ce qui présente de multiples entrelacements; « complexe » restitue cette idée naturellement en français moderne.
- source_word: φιλοτεκνίας στοργή
  choice: l’affection pour ses enfants
  rationale: L’expression désigne l’attachement naturel d’un parent envers ses enfants. Cette formulation reste générale, comme le grec, bien que le contexte immédiat concerne une mère.
- source_word: ἕλκουσα πάντα
  choice: elle entraîne tout
  rationale: Le participe exprime la force d’attraction exercée par cette affection; « entraîne » conserve le mouvement métaphorique sans suggérer nécessairement la violence.
- source_word: τὴν τῶν σπλάγχνων συμπάθειαν
  choice: une profonde communion de sentiments
  rationale: σπλάγχνα désigne littéralement les entrailles, siège figuré des émotions profondes, tandis que συμπάθεια exprime le fait de ressentir avec autrui. La formulation française rend ensemble la profondeur viscérale et le partage affectif.
theological_decisions:
- issue: Portée de φιλοτεκνία dans le contexte de la mère des sept frères
  choice: affection pour ses enfants
  alternative: amour maternel
  rationale: Le contexte est maternel, mais le substantif grec désigne plus largement l’amour d’un parent pour ses enfants. La traduction ne restreint donc pas indûment sa portée.
- issue: Valeur de πάντα
  choice: tout
  alternative: tous
  rationale: Le neutre pluriel est conservé dans sa généralité. Le texte ne précise pas explicitement s’il s’agit de toutes les facultés, de tous les sentiments ou de toutes choses.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore anatomique des « entrailles » est rendue idiomatiquement par « profonde », tandis que « communion de sentiments » préserve l’idée grecque de ressentir avec autrui.
