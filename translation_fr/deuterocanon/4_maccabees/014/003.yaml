lexical_decisions:
- source_word: ἱερὰς
  choice: sacrées
  rationale: Le terme qualifie ce qui relève du divin ou lui est consacré. « Sacrées » conserve ici le registre élevé du grec.
- source_word: ἐναρμόστους
  choice: harmonieuses
  rationale: L’adjectif évoque ce qui est bien ajusté et forme un ensemble harmonieux ; « harmonieuses » en préserve aussi la résonance musicale.
- source_word: περὶ τῆς εὐσεβείας
  choice: au sujet de la piété
  rationale: La préposition περὶ indique le thème ou le domaine concerné. Dans 4 Maccabées, εὐσέβεια désigne la fidélité révérencieuse envers Dieu, avec ses dimensions religieuse et morale ; « piété » est le terme français le plus naturel dans ce contexte.
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: des sept frères
  rationale: Le récit parle de sept enfants mâles d’une même famille ; « frères » est précis et idiomatique.
- source_word: συμφωνίας
  choice: concordes
  rationale: Le grec porte ici une forme plurielle et exprime l’unité d’accord ou de résolution. Le pluriel inhabituel « concordes » préserve cette donnée du texte source ainsi que son style rhétorique élevé.
theological_decisions:
- issue: Sens de εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: fidélité envers Dieu
  rationale: « Piété » maintient la notion englobante de dévouement révérencieux à Dieu et d’obéissance à sa loi sans réduire le terme à une seule pratique religieuse. La paraphrase « fidélité envers Dieu » explicite davantage le sens, mais atténue le terme-clé récurrent de l’ouvrage.
translation_notes:
  register: Fragment syntaxique conservé comme dans la source fournie, avec initiale minuscule. Registre soutenu mais intelligible. Le pluriel marqué « concordes » suit le grec συμφωνίας plutôt que le singulier adopté par la couche anglaise de consultation.
