base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: fr
  text: Et ne trouvez pas étonnant que la raison ait pris le dessus sur ces hommes au milieu des tortures, puisque même l’esprit d’une femme a méprisé des douleurs plus diverses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des souffrances plus variées »; selon le contexte, l’expression peut aussi être comprise comme « des douleurs plus cruelles ».
    reason: La combinaison πολυτροπωτέρων ἀλγηδόνων souligne littéralement la diversité ou le caractère multiforme des douleurs, mais peut contextuellement évoquer des souffrances aggravées.
lexical_decisions:
- source_word: θαυμαστόν / ἡγεῖσθε
  choice: trouvez… étonnant
  rationale: La tournure française « trouver étonnant » rend naturellement le jugement exprimé par ἡγεῖσθε avec l’attribut θαυμαστόν.
- source_word: λογισμός
  choice: la raison
  rationale: « La raison » conserve le terme philosophique central de 4 Maccabées sans lui ajouter une qualification absente de ce verset.
- source_word: περιεκράτησεν
  choice: ait pris le dessus sur
  rationale: Cette expression rend l’idée d’une domination décisive tout en restant naturelle en français courant.
- source_word: τῶν ἀνδρῶν ἐκείνων
  choice: ces hommes
  rationale: Le démonstratif et la référence masculine explicite sont conservés avec une formulation idiomatique.
- source_word: ἐν ταῖς βασάνοις
  choice: au milieu des tortures
  rationale: Dans ce contexte de martyre, βάσανοι désigne des souffrances infligées; « tortures » en exprime clairement la nature.
- source_word: ὅπου γε καί
  choice: puisque même
  rationale: La locution introduit un argument renforcé; « puisque même » en reproduit la valeur explicative et emphatique.
- source_word: γυναικὸς νοῦς
  choice: l’esprit d’une femme
  rationale: « Esprit » rend ici la faculté intérieure de pensée et de résolution, tandis que le singulier féminin explicite du grec est préservé.
- source_word: πολυτροπωτέρων
  choice: plus diverses
  rationale: Le comparatif renvoie d’abord à la multiplicité ou à la variété des formes de douleur, plutôt qu’à leur seule intensité.
- source_word: ὑπερεφρόνησεν
  choice: a méprisé
  rationale: Le verbe exprime le fait de tenir les douleurs pour inférieures à soi, de les dédaigner; « mépriser » en conserve la force.
- source_word: ἀλγηδόνων
  choice: douleurs
  rationale: « Douleurs » est l’équivalent direct et naturel du nom grec dans ce contexte.
theological_decisions:
- issue: Valeur philosophique de λογισμός dans le récit du martyre
  choice: la raison
  alternative: le jugement rationnel
  rationale: Le choix préserve l’affirmation caractéristique du livre selon laquelle la raison domine les souffrances et les passions, sans importer une terminologie doctrinale ultérieure.
- issue: Contraste explicite entre les hommes et une femme
  choice: ces hommes… l’esprit d’une femme
  alternative: ces personnes… son esprit
  rationale: Le grec marque délibérément le contraste entre ἀνδρῶν et γυναικός; le neutraliser effacerait une donnée rhétorique du texte.
- issue: Portée de πολυτροπωτέρων
  choice: plus diverses
  alternative: plus cruelles
  rationale: Le grec met vraisemblablement l’accent sur des douleurs plus variées ou multiformes. L’alternative contextuelle d’une intensité supérieure est signalée en note plutôt qu’intégrée silencieusement au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste rhétorique du grec et son vocabulaire philosophique, avec une note pour l’ambiguïté du comparatif final.
