base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: fr
  text: Mais néanmoins, bien que tant d’éléments liés à l’amour de ses enfants[a] aient attiré la mère vers la compassion, les supplices, si variés fussent-ils, ne purent, en aucune de ces circonstances[b], détourner sa raison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se rendre par « tant de mouvements d’affection maternelle ». Elle évoque la force de l’amour d’une mère pour ses enfants.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « en aucun d’eux ». L’antécédent du pronom n’est pas entièrement explicite ; la traduction conserve donc une formulation circonstancielle sans le préciser davantage.
    reason: textual_ambiguity
  - marker: c
    text: Ou « son jugement rationnel », voire « sa résolution ». Dans ce livre, le terme grec désigne régulièrement la raison qui gouverne les émotions.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Mais malgré tout
  rationale: Rend à la fois l’opposition et la concession appuyée, dans un français actuel et soutenu.
- source_word: καίπερ
  choice: bien que
  rationale: Exprime naturellement la valeur concessive du participe grec.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: tant de sentiments liés à l’amour de ses enfants
  rationale: Le grec désigne de manière assez large les réalités ou mouvements affectifs associés à l’amour des enfants; « sentiments liés à » évite de préciser excessivement leur nature.
- source_word: φιλοτεκνίαν
  choice: l’amour de ses enfants
  rationale: Désigne l’affection d’un parent pour ses enfants; le possessif est naturel en français puisque le sujet est la mère.
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: aient entraîné la mère vers la compassion
  rationale: Conserve l’image d’une force affective qui tire ou entraîne, tandis que « compassion » exprime ici la participation à la souffrance d’autrui.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: les supplices de toute sorte
  rationale: παντοίκιλοι souligne la diversité des supplices; cette formulation est idiomatique sans affaiblir leur violence.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: dans le cas d’aucun d’eux
  rationale: Reproduit prudemment la tournure grecque et conserve l’incertitude sur l’antécédent exact du pronom, probablement les fils.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: sa raison
  rationale: λογισμός est un terme directeur de 4 Maccabées et désigne la faculté rationnelle qui gouverne les émotions.
- source_word: ἴσχυσαν μετατρέψαι
  choice: ne réussirent … à détourner
  rationale: Rend l’idée que les supplices n’eurent pas la force de faire dévier ou changer sa raison.
theological_decisions:
- issue: Sens philosophique de λογισμός
  choice: sa raison
  alternative: sa résolution; son jugement rationnel
  rationale: « Raison » préserve le vocabulaire philosophique central du livre, qui met en scène la maîtrise des émotions par la faculté rationnelle, sans réduire ici le mot à la seule fermeté de volonté.
- issue: Antécédent de αὐτῶν dans ἐπʼ οὐδενὸς αὐτῶν
  choice: conserver le pronom « eux » et signaler l’interprétation probable en note
  alternative: pour aucun de ses fils; sous aucun de ces supplices
  rationale: La référence grammaticale n’est pas entièrement explicite. Le contexte favorise les fils, mais une traduction plus déterminée supprimerait une ambiguïté réelle du grec.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu. La période grecque est conservée en une seule phrase, avec une syntaxe clarifiée sans effacer son ambiguïté pronominale ni la portée philosophique de « raison ».
