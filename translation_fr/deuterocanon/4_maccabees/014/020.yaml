  text: But motherly affection for her children did not move the mother of the young men, who was of one spirit with Abraham.
translation:
  language: fr
  text: Mais l’affection pour ses enfants ne fit pas fléchir la mère des jeunes hommes, qui avait la même disposition qu’Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mère des jeunes hommes, d’une même âme qu’Abraham ». On pourrait aussi traduire : « la mère des jeunes hommes, semblable à Abraham par sa disposition ».'
    reason: La tournure ὁμόψυχον τὴν Ἀβραάμ est dense et peut exprimer une communauté d’âme, d’esprit ou de disposition.
lexical_decisions:
- source_word: μετεκίνησεν
  choice: ne fit pas fléchir
  rationale: Le verbe évoque un déplacement hors d’une position. Dans ce contexte, il s’agit de détourner la mère de sa fermeté; « ne fit pas fléchir » rend naturellement cette résistance sans effacer la métaphore.
- source_word: συμπάθεια τέκνων
  choice: l’affection pour ses enfants
  rationale: συμπάθεια exprime ici un attachement affectif profond. Le contexte maternel permet de comprendre τέκνων comme « ses enfants », même si le possessif n’est pas explicite en grec.
- source_word: ὁμόψυχον
  choice: qui partageait les dispositions d’Abraham
  rationale: L’adjectif désigne une communauté d’âme, de pensée ou de disposition. Cette formulation française exprime la conformité intérieure avec Abraham sans suggérer une identité littérale d’esprit.
- source_word: τῶν νεανιῶν μητέρα
  choice: la mère des jeunes hommes
  rationale: νεανίαι désigne de jeunes hommes; cette traduction est claire et actuelle tout en conservant le rapport génitif.
theological_decisions:
- issue: Portée de la comparaison avec Abraham
  choice: La mère partage les dispositions intérieures d’Abraham.
  alternative: La mère est semblable à Abraham ou appartient à sa descendance.
  rationale: ὁμόψυχον caractérise une communauté de disposition ou d’âme, et non explicitement un lien généalogique. La traduction conserve cette solidarité morale et spirituelle sans en préciser davantage la nature.
translation_notes:
  register: Français international moderne, digne et accessible. « Ne fit pas fléchir » rend la fermeté suggérée par le contexte; « dispositions » évite l’ambiguïté potentiellement ontologique de « un même esprit ».
