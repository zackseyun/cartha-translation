base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: fr
  text: Car ils étaient justes, maîtres d’eux-mêmes, courageux, nobles de cœur et aimant leurs frères, et ils étaient si attachés à leur mère qu’ils lui obéissaient, jusqu’à la mort, en observant les prescriptions de la Loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lois ancestrales », « les coutumes ancestrales » ou « les ordonnances » ; le grec emploie un pluriel qui désigne les exigences légales qu’ils étaient résolus à observer.
    reason: Alternative lexicale et précision sur le pluriel grec de τὰ νόμιμα.
lexical_decisions:
- source_word: δίκαιοί
  choice: justes
  rationale: Dans cette liste de vertus, le terme désigne la droiture morale; « justes » en conserve la portée éthique et religieuse.
- source_word: σώφρονες
  choice: maîtres d’eux-mêmes
  rationale: Le mot évoque la modération disciplinée et la maîtrise de soi; cette formulation est claire en français actuel.
- source_word: ἀνδρεῖοι
  choice: courageux
  rationale: Le sens contextuel est celui de la bravoure; « courageux » évite une traduction inutilement genrée.
- source_word: μεγαλόψυχοι
  choice: nobles de cœur
  rationale: Le composé évoque la grandeur d’âme; cette expression garde l’élévation morale tout en restant accessible.
- source_word: φιλάδελφοι
  choice: pleins d’affection fraternelle
  rationale: Le terme exprime l’amour entre frères et convient précisément aux frères dont parle le récit.
- source_word: φιλόμητρος
  choice: ils aimaient leur mère
  rationale: Le terme indique un profond attachement à la mère; la tournure verbale s’intègre naturellement à la proposition de résultat.
- source_word: οὕτως, ὥστε
  choice: au point de
  rationale: Cette construction exprime un degré qui entraîne un résultat; « au point de » le rend naturellement.
- source_word: μέχρι θανάτου
  choice: même jusqu’à la mort
  rationale: L’expression marque l’extrême limite de leur obéissance et de leur fidélité.
- source_word: τὰ νόμιμα
  choice: les prescriptions de la Loi
  rationale: Le pluriel grec désigne les obligations ou observances légales juives; cette traduction garde la pluralité tout en explicitant leur rapport à la Loi.
- source_word: φυλάσσοντας
  choice: en observant
  rationale: Dans un contexte légal et religieux, φυλάσσω signifie respecter ou observer des prescriptions.
- source_word: πείθεσθαι αὐτῇ
  choice: lui obéir
  rationale: Avec le datif d’une personne, πείθομαι peut signifier « obéir »; ce sens convient à la loyauté filiale décrite ici.
theological_decisions:
- issue: Sens de τὰ νόμιμα dans le contexte du martyre juif
  choice: les prescriptions de la Loi
  alternative: les coutumes prescrites; les ordonnances; les lois ancestrales
  rationale: Le contexte renvoie à la fidélité aux obligations religieuses juives sous la persécution. La formulation choisie conserve le pluriel grec et la référence à la Loi sans imposer dans le texte principal la nuance possible d’ancestralité.
- issue: Portée familiale de φιλάδελφοι
  choice: pleins d’affection fraternelle
  alternative: aimant leurs frères
  rationale: Le récit concerne des frères et le grec exprime spécifiquement l’affection entre eux; la traduction ne neutralise donc pas ce lien familial.
translation_notes:
  register: Français international moderne, digne et accessible. La liste des vertus conserve son rythme, tandis que la seconde phrase explicite naturellement la construction grecque de degré et de résultat. Le marqueur [a] est placé immédiatement après l’expression qu’il précise.
