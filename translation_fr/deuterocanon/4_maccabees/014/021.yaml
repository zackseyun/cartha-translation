base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: fr
  text: Ô raison, tyran des passions des enfants[a] ! Et, pour une mère, la piété envers Dieu[b] est plus désirable que ses enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des passions des enfants » ; le génitif peut désigner les passions qui agitent les enfants. L’image présente la raison comme dominant ces passions.'
    reason: clarification_grammaticale
  - marker: b
    text: 'Ou simplement : « la piété ». Ici, le terme grec désigne la dévotion et la fidélité envers Dieu.'
    reason: précision_lexicale
lexical_decisions:
- source_word: λογισμέ
  choice: raison
  rationale: Le vocatif désigne ici la faculté de jugement rationnel qui maîtrise les passions, thème central de 4 Maccabées. « Raison » conserve cette portée philosophique dans un français clair et concis.
- source_word: τέκνων
  choice: des enfants
  rationale: τέκνα désigne les enfants sans préciser leur sexe. La seconde occurrence est rendue par « ses enfants » pour exprimer naturellement en français le lien implicite avec la mère.
- source_word: παθῶν
  choice: passions
  rationale: Dans 4 Maccabées, πάθη désigne les mouvements affectifs et les impulsions soumis au gouvernement de la raison, plutôt que les seules souffrances.
- source_word: τύραννε
  choice: tyran
  rationale: Le vocatif emploie une image forte de domination absolue. « Tyran » préserve cette vigueur rhétorique, même si le mot possède aussi une connotation négative en français.
- source_word: εὐσέβεια
  choice: piété envers Dieu
  rationale: εὐσέβεια exprime ici la fidélité révérencieuse dirigée vers Dieu. L'explicitation « envers Dieu » évite que « piété » soit comprise comme une simple qualité religieuse vague.
- source_word: μητρί
  choice: pour une mère
  rationale: Le datif indique la personne pour laquelle la comparaison vaut. « Pour une mère » est idiomatique en français et respecte la portée générale de l'absence d'article.
- source_word: ποθεινοτέρα
  choice: plus désirable
  rationale: Le comparatif exprime ce qui est davantage désiré ou ardemment souhaité. « Plus désirable » est naturel tout en conservant la force comparative.
theological_decisions:
- issue: Portée religieuse de εὐσέβεια dans le contexte du martyre
  choice: piété envers Dieu
  alternative: piété
  rationale: Le contexte oppose l'attachement maternel à la fidélité à Dieu. L'explicitation rend cette orientation divine sans introduire de terminologie confessionnelle particulière.
- issue: Rapport entre la piété et l'amour maternel
  choice: la piété envers Dieu est plus désirable que ses enfants
  alternative: la mère aime la piété envers Dieu plus que ses enfants
  rationale: La formulation retenue préserve la construction comparative du grec et sa tension frappante, sans la transformer en affirmation psychologique plus explicite sur l'amour de la mère.
translation_notes:
  register: Style élevé et exclamatif, adapté à l'apostrophe rhétorique du grec, mais vocabulaire moderne et intelligible. La coordination initiale « Et » est conservée afin de respecter l'élan de l'original.
