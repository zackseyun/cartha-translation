translation:
  language: fr
  text: Car la mère des sept jeunes hommes supporta les tortures infligées à chacun de ses enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément peut-être : « les supplices au chevalet infligés à chacun de ses enfants », car le terme grec peut désigner une torture par torsion ou au chevalet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: mère
  rationale: Équivalent direct et naturel, qui maintient le lien familial essentiel au pathétique et à l’argument du passage.
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: des sept jeunes hommes
  rationale: νεανίσκων désigne des hommes jeunes. « Jeunes hommes » conserve l’âge et la référence masculine sans anticiper le lien filial exprimé ensuite par τέκνων.
- source_word: ὑπήνεγκεν
  choice: supporta
  rationale: Le verbe exprime le fait de porter et d’endurer une souffrance. « Supporta » convient au registre narratif soutenu et demeure clair en français moderne.
- source_word: στρέβλας
  choice: tortures
  rationale: Le terme peut désigner plus précisément des supplices par torsion ou au chevalet, mais aussi des tortures de façon générale. « Tortures » préserve cette latitude sémantique dans le texte principal.
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: infligées à chacun de ses enfants
  rationale: 'Cette formulation rend naturellement la valeur distributive de ἐφʼ ἑνὶ ἑκάστῳ : les tortures atteignent chacun des enfants pris individuellement. « Enfants » maintient ici la perspective maternelle de τέκνων.'
