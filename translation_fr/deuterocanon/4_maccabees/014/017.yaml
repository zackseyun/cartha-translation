  rationale: La révision retire l’explicitation non textuelle « le danger » et, par conséquent, la note qui justifiait cet ajout. Elle maintient l’ambiguïté du complément implicite par « l’empêcher », préserve l’image du vol circulaire, rend στοργή par « affection naturelle » et adopte le conditionnel pour la construction hypothétique. Aucun enjeu doctrinal n’est impliqué.
