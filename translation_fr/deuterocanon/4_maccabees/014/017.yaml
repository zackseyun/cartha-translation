review_pass:
  verdict: revise
  source_fidelity: La précision « le danger » ajoute un objet que le grec αφήνει implicite (κωλύειν sans complément exprimé). Il convient de conserver l’ellipse au moyen de « l’empêcher », dépendant du contexte. Le conditionnel rend mieux la valeur hypothétique de δύναιντο que les imparfaits indicatifs du projet. « De tous côtés autour d’eux » restitue κυκλόθεν αὐτῶν sans remplacer d’emblée le référent par « leurs petits ».
  naturalness: Le texte proposé est globalement clair, mais « souffrant dans leur affection pour eux » est peu idiomatique en français moderne, et l’enchaînement à l’imparfait (« elles volaient… elles venaient ») atténue la relation conditionnelle. La révision emploie une formulation française plus fluide tout en maintenant les participes comme actions concomitantes.
  terminology: « Affection naturelle » rend sobrement στοργή, sans imposer « maternelle », qui relève du contexte. « Appelant » conserve la nuance sans forcer « rappeler » au sens d’un retour. « Enfants » traduit directement τέκνα; l’image aviaire demeure portée par « voleraient ».
  issues:
  - severity: medium
    issue: Ajout de « le danger »
    rationale: Le grec ne fournit aucun complément à κωλύειν. Même signalé en note, « le danger » spécifie le référent implicite et dépasse la formulation source.
  - severity: medium
    issue: Mode verbal de la phrase hypothétique
    rationale: Les imparfaits indicatifs français présentent les actions comme narratives ou habituelles. Le conditionnel dans l’apodose exprime plus fidèlement l’hypothèse introduite par εἰ ... δύναιντο.
  - severity: low
    issue: Formulation « souffrant dans leur affection »
    rationale: Cette construction est calquée sur le grec et peu naturelle. « Affligées par leur affection naturelle » communique la douleur liée à στοργή dans un français courant et soutenu.
  revised_text: Mais même si elles ne pouvaient l’empêcher, elles voleraient de tous côtés autour d’eux, affligées par leur affection naturelle et les appelant de leur voix ; elles viendraient en aide à leurs enfants de toutes les manières possibles.
