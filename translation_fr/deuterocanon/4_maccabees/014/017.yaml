  text: But even if they could not prevent it[a], flying around them on every side, grieving in their affection, and calling to them in their own voice, they would help their children in whatever way they could.
translation:
  language: fr
  text: Mais même si elles ne pouvaient l’empêcher, elles voleraient de tous côtés autour d’eux, affligées par leur affection naturelle et les appelant de leur voix ; elles viendraient en aide à leurs enfants de toutes les manières possibles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κωλύειν
  choice: empêcher le danger
  rationale: Le verbe signifie empêcher ou arrêter. Le complément n’étant pas exprimé en grec, « le danger » explicite sobrement ce que le contexte implique, sans préciser la nature de la menace.
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: elles volaient tout autour de leurs petits
  rationale: Cette formulation conserve l’image aviaire explicite de créatures volant de tous côtés autour de leur progéniture, tout en restant naturelle en français.
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: souffrant dans leur affection pour eux
  rationale: ἀλγέω exprime la douleur, tandis que στοργή désigne l’affection naturelle, notamment familiale. La traduction conserve ces deux éléments sans introduire explicitement « maternelle », que le contexte fournit.
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: les rappelant de leur propre voix
  rationale: ἀνακαλέομαι peut signifier appeler ou rappeler. « Rappeler » préserve la nuance possible du préverbe ἀνα-, tandis que « de leur propre voix » maintient l’image des cris caractéristiques des animaux.
- source_word: καθʼ ὃν δύναται τρόπον
  choice: par tous les moyens possibles
  rationale: Cette expression idiomatique rend l’idée d’une aide apportée de toute manière restant à leur portée.
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: venaient en aide à leurs petits
  rationale: βοηθέω signifie venir en aide. Dans l’image animale immédiate, « petits » est plus naturel que « enfants » pour τέκνα, tout en conservant le rapport parent-progéniture.
theological_decisions:
- issue: Image de mères animales volant autour de leurs petits
  choice: Conserver explicitement l’image aviaire et traduire τέκνα par « petits ».
  alternative: Atténuer la métaphore en disant qu’elles « entouraient leurs enfants ».
  rationale: Le grec emploie sans ambiguïté un verbe signifiant voler autour. Garder cette image respecte la comparaison rhétorique et ne la transforme pas en affirmation abstraite sur l’affection maternelle.
- issue: Référent implicite de κωλύειν
  choice: Rendre l’objet sous-entendu par « le danger » et signaler l’ellipse en note.
  alternative: Employer un pronom comme « l’empêcher », dépendant davantage du contexte précédent.
  rationale: Le grec laisse le complément non exprimé. « Le danger » offre une phrase française autonome tout en maintenant une certaine généralité et en signalant l’implicite au lecteur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’imparfait déploie les actions concomitantes des participes grecs dans une narration naturelle. Le singulier grec de δύναται et βοηθεῖ, probablement distributif après des pluriels neutres, est rendu au pluriel selon l’usage français.
