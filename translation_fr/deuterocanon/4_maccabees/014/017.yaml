revisions:
- from: Mais même si elles ne pouvaient pas empêcher le danger[a], elles volaient tout autour de leurs petits, souffrant dans leur affection pour eux et les rappelant de leur propre voix ; ainsi, elles venaient en aide à leurs petits par tous les moyens possibles.
