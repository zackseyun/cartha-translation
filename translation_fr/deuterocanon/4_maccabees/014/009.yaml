  yaml_path: translation/deuterocanon/4_maccabees/014/009.yaml
  text: Now we[a], hearing of the affliction of those young men, shudder; but they, not only seeing it, and not only hearing the immediate word of threat, but also suffering it,
translation:
  language: fr
  text: Maintenant, nous frémissons en entendant parler de la détresse de ces jeunes hommes ; eux, en revanche, non seulement la voyaient, non seulement entendaient la parole de menace proférée sur-le-champ[a], mais encore la subissaient,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole menaçante prononcée dans l’instant » ; l’expression grecque souligne le caractère immédiat de la menace.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: détresse
  rationale: Le mot désigne ici l’épreuve accablante vécue par les jeunes hommes. « Détresse » conserve sa portée physique et morale sans lui donner un sens théologique technique.
- source_word: νεανιῶν
  choice: jeunes hommes
  rationale: Le masculin et l’indication d’âge sont pertinents dans le contexte des frères torturés ; cette expression est claire en français moderne.
- source_word: φρίττομεν
  choice: nous frémissons
  rationale: Le verbe exprime une réaction physique de peur et d’horreur. « Frémir » en restitue la force dans un registre digne et naturel.
- source_word: ὁρῶντες
  choice: la voyaient
  rationale: Cette formulation maintient le contraste entre voir, entendre et subir directement la détresse.
- source_word: παραχρῆμα
  choice: proférée sur-le-champ
  rationale: L’adverbe souligne que la menace leur était adressée dans l’immédiat, sur les lieux mêmes.
- source_word: ἀπειλῆς λόγον
  choice: la parole de menace
  rationale: Cette traduction conserve le substantif λόγος et le caractère singulier de l’expression grecque, plutôt que de la réduire simplement à « la menace ».
- source_word: πάσχοντες
  choice: la subissaient
  rationale: 'Le participe constitue le point culminant : ils ne percevaient pas seulement la détresse, ils en faisaient personnellement l’expérience.'
theological_decisions: []
