  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
translation:
  language: fr
  text: Car plus les mères sont faibles d’âme et fécondes, plus elles aiment leurs enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « plus aimantes envers leurs enfants » ou « aimant davantage leurs enfants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: plus… plus…
  rationale: Cette construction corrélative française rend naturellement la progression comparative du grec.
- source_word: ἀσθενέψυχοι
  choice: faibles d’âme
  rationale: Ce choix conserve l’image du composé grec, qui désigne une faiblesse intérieure, sans la réduire à la lâcheté ni la préciser comme une simple fragilité émotionnelle.
- source_word: πολυγονώτεραι
  choice: fécondes
  rationale: Le terme grec qualifie celles qui engendrent beaucoup. « Fécondes » est concis, naturel et s’intègre à la structure comparative.
- source_word: ὑπάρχουσιν
  choice: sont
  rationale: Le verbe a ici une fonction copulative et se traduit simplement par « être ».
- source_word: αἱ μητέρες
  choice: les mères
  rationale: Traduction directe du nom grec au pluriel.
- source_word: φιλοτεκνότεραι
  choice: aiment leurs enfants
  rationale: Cette formulation française naturelle exprime le sens comparatif de l’adjectif, littéralement « davantage aimantes envers leurs enfants », dans la construction « plus… plus… ».
