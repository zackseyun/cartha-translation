  yaml_path: translation/deuterocanon/4_maccabees/007/018.yaml
  text: But all who care for godliness with their whole heart[b][a], these alone are able to master the passions of the flesh.
translation:
  language: fr
  text: Mais tous ceux qui se soucient de la piété de tout leur cœur, eux seuls peuvent maîtriser les passions de la chair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les passions charnelles » ou « les passions liées à la chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: Mais
  rationale: Marque l’opposition avec l’argument précédent de manière naturelle en français.
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Désigne de façon inclusive l’ensemble des personnes répondant à la condition énoncée.
- source_word: τῆς εὐσεβείας
  choice: de la piété
  rationale: Dans 4 Maccabées, εὐσέβεια évoque la dévotion et la fidélité envers Dieu et sa loi ; « piété » conserve ce sens religieux sans ajouter une interprétation confessionnelle.
- source_word: προνοοῦσιν
  choice: ont le souci de
  rationale: Rend l’attention active et réfléchie exprimée par le verbe, dans un français naturel et digne.
- source_word: ἐξ ὅλης καρδίας
  choice: de tout cœur
  rationale: Expression française idiomatique qui traduit l’engagement entier indiqué par le grec.
- source_word: οὗτοι μόνοι
  choice: eux seuls
  rationale: Préserve l’insistance et la restriction explicites du texte grec.
- source_word: δύνανται κρατεῖν
  choice: peuvent maîtriser
  rationale: Exprime la capacité d’exercer une domination sur les passions, avec plus de force que le simple fait de les modérer.
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: les passions de la chair
  rationale: Conserve à la fois le vocabulaire moral de πάθη et le terme anthropologique σάρξ, sans les réduire d’emblée aux péchés ni au seul corps physique.
theological_decisions:
- issue: Sens de σάρξ dans un contexte éthique et anthropologique
  choice: chair
  alternative: corps ; nature pécheresse
  rationale: Le passage associe les passions à la dimension charnelle de l’être humain, mais ne justifie ni de neutraliser σάρξ en « corps » ni de lui imposer la lecture doctrinalement plus chargée de « nature pécheresse ».
- issue: Portée de εὐσέβεια
  choice: piété
  alternative: fidélité envers Dieu ; respect de Dieu
  rationale: « Piété » garde la densité religieuse du terme grec et permet au contexte de préciser son rapport à Dieu et à sa loi, sans explicitation excessive.
translation_notes:
  register: Français international moderne, clair et digne. La reprise emphatique « eux seuls » respecte la structure grecque ; « de tout cœur » évite une formulation littérale lourde.
