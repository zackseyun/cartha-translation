base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: fr
  text: Toi, père, tu as confirmé notre fidélité à la Loi par tes actes de persévérance, pour la gloire[a] ; en parlant avec respect de la sainteté, tu ne l’as pas abolie, et par tes actes tu as attesté les enseignements de la philosophie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la gloire ». L’expression grecque peut indiquer le but ou le résultat.
    reason: lexical_alternative
  - marker: b
    text: Ou « les paroles » ou « les raisonnements de la philosophie ». Le mot grec peut avoir chacun de ces sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: père
  rationale: Vocatif singulier direct, sans possessif dans le grec ; « père » conserve cette forme d’adresse.
- source_word: εὐνομίαν
  choice: fidélité à la Loi
  rationale: Dans ce contexte, le terme désigne une conduite conforme au bon ordre de la Loi, et non la simple légalité abstraite.
- source_word: διὰ τῶν ὑπομονῶν
  choice: par nos persévérances
  rationale: διά avec le génitif exprime ici le moyen. Le pluriel grec et le possessif de première personne sont conservés malgré leur caractère inhabituel dans le contexte.
- source_word: εἰς δόξαν
  choice: pour la gloire
  rationale: La formulation garde ouverte la valeur de but ou de résultat de εἰς.
- source_word: ἐκύρωσας
  choice: tu as confirmé
  rationale: Le verbe indique que la fidélité à la Loi a été validée ou établie par l’endurance.
- source_word: ἁγιαστίαν
  choice: la sainteté
  rationale: Équivalent français naturel du nom désignant l’état ou le caractère saint.
- source_word: σεμνολογήσας
  choice: après avoir parlé avec dignité de
  rationale: Cette traduction préserve explicitement l’idée de parole digne ou solennelle, sans réduire le participe à « honorer ».
- source_word: οὐ κατέλυσας
  choice: tu ne l’as pas abolie
  rationale: Le pronom reprend « la sainteté » ; καταλύω exprime ici l’idée de détruire, invalider ou renverser.
- source_word: ἐπιστοποίησας
  choice: tu as attesté
  rationale: Le verbe signifie confirmer ou rendre crédible par une preuve ; les actes servent ici d’attestation.
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: les enseignements de la philosophie
  rationale: λόγοι peut désigner des paroles, des raisonnements ou des enseignements ; « enseignements » est naturel en français tout en signalant l’ambiguïté en note.
theological_decisions:
- issue: Sens de φιλοσοφία dans 4 Maccabées
  choice: philosophie
  alternative: sagesse ; enseignement raisonné
  rationale: L’ouvrage emploie consciemment le vocabulaire philosophique hellénistique ; « philosophie » en préserve le cadre conceptuel.
- issue: Référent de διὰ τῶν ὑπομονῶν
  choice: nos persévérances
  alternative: ta persévérance
  rationale: Le texte grec porte l’article et le nom au pluriel, sans possessif explicite. Dans la continuité de « notre fidélité », la première personne est retenue, sans corriger silencieusement le texte selon le destinataire singulier.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset conserve la syntaxe rhétorique de l’apostrophe et le pluriel surprenant « nos persévérances », tout en employant « fidélité à la Loi » pour rendre concrètement εὐνομία dans son contexte juif.
