  source_fidelity: 'La traduction rend fidèlement les termes principaux : εὐνομία (« fidélité à la Loi »), ἁγιαστία (« sainteté »), ἐκύρωσας (« confirmé »), ἐπιστοποίησας (« attesté ») et φιλοσοφία (« philosophie »). Toutefois, « nos persévérances » ajoute un possessif de première personne qui n’est pas dans le grec. Le possessif ἡμῶν détermine εὐνομίαν, non ὑπομονῶν. Dans l’apostrophe au père, le moyen est naturellement son endurance ; le pluriel grec peut être rendu idiomatiquement par « actes de persévérance ».'
  naturalness: Le français est globalement digne et clair. « Après avoir parlé avec dignité de la sainteté » alourdit cependant la phrase et attribue au participe une antériorité temporelle qui n’est pas nécessaire. « En parlant avec respect de la sainteté » conserve la valeur participiale avec une formulation plus naturelle. « Tes actes de persévérance » est plus idiomatique que « tes persévérances » tout en gardant le pluriel.
  terminology: « Fidélité à la Loi » convient bien dans ce contexte pour εὐνομία, avec une majuscule à « Loi » justifiée par le cadre de la Loi ancestrale. « Enseignements de la philosophie » est une option naturelle pour λόγοι ; la note conserve utilement « paroles » et « raisonnements ».
