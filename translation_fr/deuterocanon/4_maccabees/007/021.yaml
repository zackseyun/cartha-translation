lexical_decisions:
- source_word: ἐπεὶ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve le lien argumentatif.
- source_word: τίς
  choice: qui
  rationale: Pronom interrogatif ouvrant une question rhétorique dont la suite se trouve dans le contexte.
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  choice: réglant toute sa conduite sur la philosophie
  rationale: Exprime la conformité à la norme complète que constitue ici la philosophie, dans un français naturel; « conduite » explicite la portée pratique suggérée par φιλοσοφῶν.
- source_word: εὐσεβῶς φιλοσοφῶν
  choice: la pratique avec piété
  rationale: Rend la philosophie comme mode de vie et conserve la manière religieuse exprimée par l’adverbe.
- source_word: πεπιστευκὼς θεῷ
  choice: met sa confiance en Dieu
  rationale: Le parfait grec décrit une confiance établie; le présent français convient à la série participiale et exprime une disposition durable.
theological_decisions:
- issue: Portée de πιστεύω avec le datif θεῷ
  choice: met sa confiance en Dieu
  alternative: croit Dieu
  rationale: Le contexte de piété et d’endurance favorise l’idée de confiance sans imposer une formulation doctrinale étrangère au passage.
- issue: Sens pratique de φιλοσοφῶν
  choice: la pratique
  alternative: philosophe
  rationale: Dans 4 Maccabées, la philosophie désigne une discipline vécue autant qu’une activité intellectuelle; « pratiquer » conserve cette portée morale.
translation_notes:
  register: Français moderne, digne et accessible. Le verset étant syntaxiquement incomplet dans l’extrait grec fourni, la virgule finale est conservée pour signaler que la question rhétorique se poursuit.
