    rationale: Ce n’est pas une littéralité assurée du grec, mais une identification possible de l’instrument. La note doit expliciter l’incertitude sans qualifier cette identification de littérale.
  revised_text: Par l’esprit de la raison et par une raison semblable à celle d’Isaac, il réduisit à l’impuissance l’instrument de torture aux multiples têtes[a].
