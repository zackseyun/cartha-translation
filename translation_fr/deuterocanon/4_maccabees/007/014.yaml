    issue: « Chevalet de torture » surdétermine στρέβλα.
    rationale: Le mot grec renvoie à un instrument de torture, souvent compris comme un chevalet ou une roue, mais sa forme exacte n’est pas établie avec une certitude qui autoriserait à fixer « chevalet » dans le texte principal. La note actuelle reconnaît elle-même cette incertitude.
  - severity: low
