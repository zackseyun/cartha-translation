  text: by the spirit of reason[a], and by Isaac-like reason he nullified the many-headed wheel.
translation:
  language: fr
  text: Par l’esprit de la raison et par une raison semblable à celle d’Isaac, il réduisit à l’impuissance l’instrument de torture aux multiples têtes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec στρέβλα désigne un instrument de torture; il peut s’agir d’un chevalet ou d’une roue, mais la forme précise de l’appareil reste incertaine.
    reason: Préserver l’incertitude lexicale de στρέβλα tout en signalant les principales identifications possibles.
lexical_decisions:
- source_word: πνεύματι
  choice: esprit
  rationale: Le terme désigne ici la force intérieure qui anime la raison, sans indication qu’il s’agisse de l’Esprit divin. « Esprit » conserve la métaphore grecque.
- source_word: λογισμοῦ / λογισμῷ
  choice: raison
  rationale: La répétition de λογισμός, notion centrale de 4 Maccabées, est conservée afin de faire entendre l’insistance sur la raison disciplinée qui domine les passions et la souffrance.
- source_word: Ἰσακείῳ
  choice: semblable à celle d’Isaac
  rationale: L’adjectif exprime une ressemblance avec Isaac plutôt qu’une simple possession. Cette formulation française naturelle préserve l’allusion sans l’expliciter davantage.
- source_word: πολυκέφαλον
  choice: aux multiples têtes
  rationale: Cette traduction maintient l’image vive et inhabituelle du composé grec, sans la rationaliser.
- source_word: στρέβλαν
  choice: chevalet de torture
  rationale: Le mot désigne un appareil servant à tordre ou étirer le supplicié. « Chevalet de torture » exprime clairement sa fonction, tandis qu’une note signale l’incertitude sur sa forme exacte.
- source_word: ἠκύρωσεν
  choice: rendit inopérant
  rationale: Le verbe signifie invalider, priver d’effet ou rendre inefficace. La traduction indique que l’instrument échoua à produire l’effet recherché.
theological_decisions:
- issue: Nature de « l’esprit » dans τῷ πνεύματι τοῦ λογισμοῦ
  choice: La force intérieure qui anime la raison humaine
  alternative: Une référence à l’Esprit divin
  rationale: Le contexte exalte la maîtrise des souffrances par la raison. Rien dans la formulation immédiate n’impose une référence au Saint-Esprit.
- issue: Portée de l’allusion à Isaac
  choice: Une raison semblable à celle d’Isaac
  alternative: La raison appartenant à Isaac
  rationale: La forme adjectivale grecque marque la ressemblance et présente Isaac comme modèle, tout en laissant implicite la nature précise de cette ressemblance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure parallèle des deux compléments instrumentaux et la répétition de « raison » sont conservées. Le passé simple convient au registre narratif et solennel du passage.
