base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: fr
  text: Et, sachant qu’endurer toute souffrance pour la vertu est une bénédiction, ne maîtriserait-il pas les passions par piété envers Dieu[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par dévotion envers Dieu ». Le terme grec désigne la révérence et la dévotion envers Dieu.
    reason: Préciser la portée religieuse de εὐσέβεια et signaler une autre traduction naturelle.
lexical_decisions:
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe de οἶδα expose le fondement de la question rhétorique tout en conservant la formulation compacte du grec.
- source_word: διὰ τὴν ἀρετήν
  choice: au nom de la vertu
  rationale: ἀρετή désigne ici l’excellence morale. Cette tournure exprime le motif qui conduit à accepter la souffrance sans réduire la vertu à une simple cause mécanique.
- source_word: πάντα πόνον
  choice: toute souffrance
  rationale: πόνος peut désigner la peine, la douleur ou l’épreuve. « Toute souffrance » est naturel en français et garde la portée collective de l’expression grecque.
- source_word: ὑπομένειν
  choice: endurer
  rationale: Le verbe exprime le fait de tenir ferme sous l’épreuve et de la supporter avec constance.
- source_word: μακάριόν ἐστιν
  choice: il est bienheureux
  rationale: μακάριος porte une appréciation positive qui dépasse le simple avantage ou la bonne fortune; « bienheureux » conserve sa tonalité morale et religieuse.
- source_word: περικρατήσειεν
  choice: ne maîtriserait-il pas
  rationale: Le verbe évoque le fait de prendre le dessus ou d’acquérir la maîtrise. Le conditionnel français rend naturellement la question rhétorique avec ἄν et l’optatif.
- source_word: τῶν παθῶν
  choice: les passions
  rationale: Dans 4 Maccabées, πάθη est un terme éthique important désignant les passions ou mouvements intérieurs qui doivent être dominés, plutôt que les souffrances extérieures.
- source_word: διὰ τὴν εὐσέβειαν
  choice: par piété envers Dieu
  rationale: εὐσέβεια désigne ici la dévotion respectueuse orientée vers Dieu. L’ajout explicatif « envers Dieu » évite que « piété » soit compris comme une simple compassion humaine.
theological_decisions:
- issue: Articulation entre vertu, passions et dévotion religieuse
  choice: Conserver « vertu », « passions » et « piété envers Dieu »
  alternative: Employer « excellence », « émotions » et « dévotion »
  rationale: Ces choix maintiennent ensemble le cadre éthique hellénistique et l’orientation religieuse juive du propos, sans présenter toute émotion comme mauvaise ni effacer la référence à Dieu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique et la terminologie éthique du passage sont préservées; « bienheureux » maintient la force évaluative de μακάριος.
