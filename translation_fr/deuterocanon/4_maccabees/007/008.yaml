  yaml_path: translation/deuterocanon/4_maccabees/007/008.yaml
  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: fr
  text: Tels doivent être ceux qui donnent corps à la loi[a] par leur propre sang et qui la défendent, au prix d’une noble sueur et de souffrances jusqu’à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « établissent la loi » ou « maintiennent la loi ». Le verbe grec peut signifier faire, produire ou réaliser ; ici, il évoque vraisemblablement des hommes qui rendent la loi effective et la confirment par leur fidélité, plutôt que des hommes qui la promulguent.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτους
  choice: Tels
  rationale: Le démonstratif qualifie le genre d’hommes évoqué dans le contexte. « Tels » est concis, naturel et conserve la valeur exemplaire de l’expression grecque.
- source_word: δεῖ εἶναι
  choice: doivent être
  rationale: Cette formulation rend directement l’idée de nécessité exprimée par δεῖ, sans l’affaiblir en simple conseil.
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: ceux qui donnent corps à la loi
  rationale: 'Le verbe δημιουργέω signifie fondamentalement faire, produire ou réaliser. Ici, les fidèles ne légifèrent pas : par leur conduite et leur sacrifice, ils rendent la loi concrètement effective. « Donnent corps à » conserve cette dimension active tout en évitant le contresens « fabriquent la loi ».'
- source_word: ἰδίῳ αἵματι
  choice: par leur propre sang
  rationale: Le datif indique le moyen. « Par leur propre sang » maintient la force corporelle et sacrificielle de l’expression.
- source_word: γενναίῳ ἱδρῶτι
  choice: par une noble sueur
  rationale: La traduction conserve l’image concrète et saisissante de la sueur ainsi que la valeur de courage et de noblesse portée par γενναῖος, plutôt que de l’abstraire en « effort » ou « labeur ».
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: au milieu de souffrances allant jusqu’à la mort
  rationale: πάθη désigne ici les souffrances endurées. La formulation conserve μέχρι comme indication d’une limite atteignant la mort, sans préciser davantage si la mort est déjà subie ou constitue l’ultime terme de l’endurance.
- source_word: ὑπερασπίζοντας
  choice: qui la défendent
  rationale: Le participe exprime l’action de défendre ou de combattre en faveur de quelque chose. Le pronom « la » reprend naturellement « la loi », objet implicite de cette seconde proposition.
theological_decisions:
- issue: Sens de δημιουργοῦντας τὸν νόμον
  choice: ceux qui donnent corps à la loi
  alternative: ceux qui établissent la loi ; ceux qui maintiennent la loi ; ceux qui font la loi
  rationale: Le contexte célèbre des hommes dont la fidélité jusque dans la souffrance confirme et réalise la loi par les actes. « Font la loi » suggérerait à tort qu’ils en sont les législateurs, tandis que « donnent corps à » préserve l’idée de réalisation active sans trancher trop étroitement entre établissement et maintien.
- issue: Portée de μέχρι θανάτου
  choice: allant jusqu’à la mort
  alternative: jusqu’à en mourir ; jusqu’au seuil de la mort
  rationale: Le grec indique la mort comme terme extrême, mais la construction ne demande pas de préciser ici si tous meurent effectivement. La traduction garde cette tension.
- issue: Désignation de la loi
  choice: la loi
  alternative: la Loi
  rationale: La minuscule suit sobrement le nom commun grec articulé et évite d’imposer une convention typographique théologique, tout en laissant le contexte juif déterminer qu’il s’agit de la loi ancestrale et divine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve les images corporelles fortes du sang et de la sueur ainsi que le parallélisme des participes grecs. « Une noble sueur » est volontairement marqué afin de préserver la métaphore concrète de l’original.
