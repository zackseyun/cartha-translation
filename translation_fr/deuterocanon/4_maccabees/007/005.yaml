  yaml_path: translation/deuterocanon/4_maccabees/007/005.yaml
  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: fr
  text: Car le père Éléazar, déployant sa pensée comme un promontoire escarpé[a], brisa autour de lui les flots déchaînés des passions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une falaise à pic » ou « une hauteur abrupte ». L’image grecque est celle d’un promontoire rocheux escarpé qui s’avance face à la mer.
    reason: lexical_alternative
  - marker: b
    text: Ici, les « passions » sont les impulsions ou les désirs désordonnés, un thème central de 4 Maccabées, qui oppose leur emprise à la maîtrise de la pensée.
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: une falaise à pic
  rationale: L’expression évoque une hauteur rocheuse escarpée qui s’avance et résiste aux flots. « Falaise à pic » restitue cette image avec naturel en français.
- source_word: διάνοιαν
  choice: sa pensée
  rationale: Le mot désigne ici la faculté intérieure et rationnelle d’Éléazar. « Pensée » préserve la métaphore concrète sans expliciter abusivement par « raison » ou « résolution ».
- source_word: ἐκτείνας
  choice: déployant
  rationale: Le participe indique qu’Éléazar étend sa pensée à la manière d’un promontoire rocheux. « Déployant » conserve ce mouvement métaphorique dans un français idiomatique.
- source_word: περιέκλασεν
  choice: brisa tout autour de lui
  rationale: Le verbe composé associe l’idée de briser à une portée environnante. Cette formulation maintient à la fois la violence des vagues et la valeur spatiale de περι-.
- source_word: μαινομένους
  choice: en furie
  rationale: Le participe qualifie les flots comme déchaînés ou frénétiques. « En furie » s’intègre naturellement à l’image de la tempête.
- source_word: παθῶν
  choice: passions
  rationale: Dans 4 Maccabées, le terme désigne les impulsions et affects susceptibles d’échapper au gouvernement de la pensée. « Passions » conserve sa portée philosophique sans le réduire aux seules émotions.
- source_word: κλύδωνας
  choice: vagues déferlantes
  rationale: Le nom désigne des vagues agitées ou de fortes lames. « Vagues déferlantes » en exprime clairement le mouvement et la puissance.
theological_decisions:
- issue: Contraste anthropologique entre la pensée et les passions
  choice: « pensée » et « passions »
  alternative: « raison » et « émotions »
  rationale: Le grec met en scène une faculté intérieure résistant aux passions par une métaphore maritime, sans formuler ici une doctrine abstraite. Les termes retenus préservent cette tension et évitent d’assimiler toutes les émotions à un mal.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve l’image étendue du rocher opposé aux vagues ainsi que la valeur spatiale du verbe grec.
