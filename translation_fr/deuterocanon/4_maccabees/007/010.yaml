base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/010.yaml
  text: O Eleazar[a], elder stronger than torments, old man more intense than fire[b], and king greater than sufferings.
translation:
  language: fr
  text: Ô vieillard plus fort que les tortures[a], vieil homme plus vigoureux que le feu, et roi plus grand que les souffrances, Éléazar[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tourments ». Dans ce contexte, le grec peut désigner plus précisément des tortures ou des supplices.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie une suite d’apostrophes métaphoriques et solennelles. « Roi » célèbre ici la supériorité d’Éléazar sur les souffrances ; ce n’est pas l’affirmation d’une fonction politique.
    reason: cultural_note
lexical_decisions:
- source_word: βασάνων
  choice: tortures
  rationale: Dans ce récit de martyre, le terme désigne concrètement les supplices infligés à Éléazar ; « tortures » est plus précis que le plus général « tourments ».
- source_word: βιαιότερε
  choice: plus fort que
  rationale: Le comparatif signifie littéralement « plus violent » ou « plus puissant ». Ici, il exalte la force d’Éléazar, qui surpasse celle des tortures ; « plus fort que » restitue naturellement cette portée en français.
- source_word: γέρων
  choice: vieillard
  rationale: Le mot désigne un homme âgé. « Vieillard » conserve l’adresse directe et solennelle, tout en permettant de distinguer ce terme du suivant.
- source_word: πυρός
  choice: feu
  rationale: Traduction littérale, avec une probable allusion au supplice par le feu.
- source_word: εὐτονώτερε
  choice: plus vigoureux que
  rationale: Le comparatif exprime la vigueur, la tension ou la fermeté. « Plus vigoureux que » conserve cette image inhabituelle sans la réduire à la seule intensité thermique du feu.
- source_word: πρεσβῦτα
  choice: ancien
  rationale: Ce second terme d’adresse désigne lui aussi un homme âgé. « Ancien » maintient le parallélisme tout en évitant de répéter « vieillard ».
- source_word: παθῶν
  choice: souffrances
  rationale: Dans le contexte des supplices et du feu, le mot renvoie aux souffrances subies plutôt qu’aux passions intérieures.
- source_word: μέγιστε
  choice: plus grand que
  rationale: Le superlatif accompagné du génitif prend ici une valeur comparative, dans le prolongement des deux comparatifs précédents.
- source_word: βασιλεῦ
  choice: roi
  rationale: Le vocatif est conservé littéralement. Il s’agit d’une acclamation métaphorique qui présente Éléazar comme dominant les souffrances.
- source_word: Ἐλεαζάρ
  choice: Éléazar
  rationale: Forme française traditionnelle du nom propre, maintenue à la fin comme dans le grec.
theological_decisions:
- issue: Portée métaphorique des titres adressés à Éléazar
  choice: 'Conserver les trois apostrophes honorifiques : « vieillard », « ancien » et « roi ».'
  alternative: 'Paraphraser : « toi qui es plus fort que les tortures, plus ardent que le feu et supérieur aux souffrances ».'
  rationale: Le grec accumule des vocatifs poétiques et paradoxaux. Les maintenir préserve l’exaltation rhétorique sans transformer « roi » en fonction politique ni expliciter abusivement la nature de sa maîtrise.
- issue: Valeur de εὐτονώτερε dans la comparaison avec le feu
  choice: « plus vigoureux que le feu »
  alternative: « plus intense que le feu » ou « plus ardent que le feu »
  rationale: Le terme met d’abord en avant la vigueur ou la fermeté. La traduction retenue conserve l’étrangeté expressive du grec et évite d’assimiler sans preuve la vigueur morale d’Éléazar à la chaleur du feu.
translation_notes:
  register: Français moderne, solennel et poétique. L’ordre des apostrophes et la place finale du nom suivent le grec. La distinction entre γέρων et πρεσβῦτα est rendue par « vieillard » et « ancien », deux termes proches dont l’accumulation participe à l’éloge.
