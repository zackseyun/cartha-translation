  yaml_path: translation/deuterocanon/4_maccabees/007/016.yaml
  text: If[a], then, an old man despised tortures even to the point of death because of piety, then surely pious reason is ruler over the passions.
translation:
  language: fr
  text: Si donc un vieillard a méprisé les tortures allant jusqu’à la mort par piété[a], il est incontestable que la raison pieuse est maîtresse des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de la piété » ou « pour la piété ». Le grec peut exprimer ici aussi bien la cause que le but poursuivi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: un vieillard
  rationale: Le nom désigne ici un homme âgé. « Un vieillard » conserve le masculin singulier et convient au registre digne du récit.
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: les tortures allant jusqu’à la mort
  rationale: βάσανοι désigne des tourments physiques sévères, tandis que μέχρι θανάτου en marque l’étendue extrême, jusqu’à la mort.
- source_word: περιεφρόνησεν
  choice: a méprisé
  rationale: Le verbe exprime le fait de tenir pour peu de chose ou de regarder avec dédain. « A méprisé » en préserve la force rhétorique.
- source_word: διʼ εὐσέβειαν
  choice: par piété
  rationale: εὐσέβεια désigne la dévotion respectueuse envers Dieu. « Par piété » reste concise et peut porter en français une nuance tant causale que motivante.
- source_word: ὁμολογουμένως
  choice: il est incontestable que
  rationale: L’adverbe présente la conclusion comme reconnue ou admise. Cette tournure française restitue clairement la force de l’inférence.
- source_word: ἡγεμὼν
  choice: maîtresse
  rationale: Dans ce contexte philosophique, le terme exprime l’autorité directrice et la domination. Accordé avec « raison », « maîtresse » rend cette souveraineté intérieure sans connotation politique indue.
- source_word: τῶν παθῶν
  choice: des passions
  rationale: πάθη désigne ici les passions ou impulsions affectives que la raison gouverne, terme central de l’argument philosophique de l’ouvrage.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  rationale: Cette formule programmatique unit la faculté rationnelle à la révérence envers Dieu. « La raison pieuse » conserve la structure et la tension conceptuelle du grec.
theological_decisions:
- issue: Traduction de la formule philosophico-théologique ὁ εὐσεβὴς λογισμός
  choice: la raison pieuse
  alternative: la raison guidée par la piété
  rationale: La traduction retenue préserve l’expression compacte du grec et les deux dimensions, rationnelle et dévotionnelle, sans introduire de catégorie doctrinale postérieure.
- issue: Valeur de διʼ εὐσέβειαν
  choice: par piété
  alternative: à cause de sa piété / pour préserver sa piété
  rationale: La préposition peut exprimer la cause ou une motivation orientée vers un but. Le texte principal emploie une formule française suffisamment ouverte, et la note explicite l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire philosophique récurrent est conservé dans « raison pieuse », « maîtresse » et « passions », sans rendre la phrase inutilement technique.
