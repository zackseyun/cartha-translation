  source_fidelity: 'La formulation « pour Dieu » est inadéquate avec « mourir » en français moderne : elle signifie normalement mourir pour la cause de Dieu. Le grec emploie deux fois le datif θεῷ/τῷ θεῷ dans une opposition rhétorique entre ne pas mourir et vivre ; « aux yeux de Dieu » exprime lisiblement la relation ou le point de vue sans décider davantage la portée théologique. La reprise explicite de l''antithèse pour les patriarches rend l''ellipse grecque intelligible et correspond à son sens comparatif.'
  naturalness: Le texte actuel est globalement lisible, mais « ils ne meurent pas pour Dieu » et « vivent pour Dieu » appellent en français l'idée de dévouement ou de martyre. La révision emploie une tournure moderne et naturelle, tout en gardant le début en dépendance syntaxique.
  terminology: « Ceux qui croient » et « nos patriarches Abraham, Isaac et Jacob » sont justes. « Aux yeux de Dieu » convient ici mieux que « pour Dieu » ; la note conserve les possibilités « devant Dieu » et relationnelle sans imposer une interprétation doctrinale.
