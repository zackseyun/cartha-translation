  text: those who believe that they do not die to God[a], but live to God, just as our patriarchs Abraham, Isaac, and Jacob.
translation:
  language: fr
  text: ceux qui croient qu’aux yeux de Dieu ils ne meurent pas[a] ; car nos patriarches Abraham, Isaac et Jacob non plus ne sont pas morts, mais vivent à ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Dieu » ou « dans leur relation à Dieu » ; le datif grec peut exprimer la relation ou le point de vue. Il est répété avec « vivent ».
    reason: Préserver l’ambiguïté du datif θεῷ / τῷ θεῷ et signaler que « aux yeux de Dieu » rend les deux occurrences sans le sens français ambigu de « pour Dieu ».
lexical_decisions:
- source_word: οἱ πιστεύοντες
  choice: ceux qui croient
  rationale: Le participe présent substantivé désigne les personnes qui croient et conserve la continuité syntaxique avec le contexte précédent.
- source_word: θεῷ / τῷ θεῷ
  choice: pour Dieu
  rationale: Le datif exprime ici vraisemblablement la relation ou le point de vue. « Pour Dieu » reste compact, permet la répétition rhétorique du grec et n’impose pas une explication doctrinale.
- source_word: οὐκ ἀποθνήσκουσιν
  choice: ils ne meurent pas
  rationale: Rendu direct du présent de ἀποθνῄσκω, sans l’affaiblir en « ne périssent pas ».
- source_word: ὥσπερ γὰρ
  choice: car il en va de même de
  rationale: Cette formulation française rend à la fois la valeur explicative de γάρ et la comparaison introduite par ὥσπερ, tout en explicitant sobrement l’ellipse de la proposition comparative.
- source_word: οἱ πατριάρχαι ἡμῶν
  choice: nos patriarches
  rationale: « Patriarches » conserve la désignation historique précise des ancêtres Abraham, Isaac et Jacob.
- source_word: ἀλλὰ ζῶσιν
  choice: mais vivent
  rationale: Le contraste marqué par ἀλλά est maintenu. Dans la proposition comparative elliptique, « ils ne sont pas morts » est suppléé afin que l’antithèse soit intelligible en français.
theological_decisions:
- issue: Sens du datif θεῷ / τῷ θεῷ à propos de la mort et de la vie
  choice: pour Dieu
  alternative: devant Dieu ; aux yeux de Dieu ; par rapport à Dieu
  rationale: Le datif peut indiquer le point de vue ou la relation à Dieu. Le texte principal garde une expression brève et théologiquement ouverte ; la note signale les autres compréhensions possibles.
- issue: Relation des patriarches à l’opposition « mourir / vivre »
  choice: 'La comparaison elliptique est développée ainsi : « ils ne sont pas morts, mais vivent pour Dieu »'
  alternative: Rattacher « tout comme nos patriarches » uniquement à « vivent pour Dieu »
  rationale: La suite ὥσπερ γὰρ … ἀλλά présente une syntaxe abrégée. Le développement retenu fait porter la comparaison sur l’antithèse entière sans expliquer la nature de cette vie ni nier la mort physique des patriarches de manière doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le début en minuscule et la tournure « ceux qui croient » conservent le caractère syntaxiquement dépendant du verset. La phrase grecque étant elliptique autour de la comparaison avec les patriarches, le français explicite seulement les éléments nécessaires à l’intelligibilité.
