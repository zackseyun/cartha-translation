  text: O you who are in harmony with the law and a philosopher of the divine way of life[a][b].
translation:
  language: fr
  text: Ô toi qui es en accord avec la loi[a] et philosophe d'une vie divine[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en harmonie avec la loi ». Le mot grec évoque l’accord ou la consonance.
    reason: lexical_alternative
  - marker: b
    text: Ou « philosophe de la vie pieuse » ou « philosophe d'une manière de vivre consacrée à Dieu ». L’expression grecque peut désigner une vie caractérisée par la dévotion envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ô toi
  rationale: La particule vocative introduit une apostrophe solennelle. « Ô toi » conserve ce ton élevé tout en permettant de rendre naturellement en français l’adjectif vocatif qui suit.
- source_word: σύμφωνε
  choice: qui es en harmonie avec
  rationale: σύμφωνος évoque littéralement l’accord ou la consonance. Cette formulation garde l’image de l’harmonie et convient à une personne dont la vie s’accorde avec la loi.
- source_word: νόμου
  choice: la loi
  rationale: Le génitif dépend de σύμφωνε. Dans ce contexte juif, il s’agit naturellement de la loi ancestrale ou divine, mais la minuscule évite d’en faire explicitement un titre absent du grec.
- source_word: καὶ
  choice: ','
  rationale: En français, la juxtaposition après « Ô toi qui… » rend plus naturellement les deux qualifications coordonnées par καί, sans en changer la relation additive.
- source_word: φιλόσοφε
  choice: philosophe
  rationale: Le vocatif désigne directement la personne comme philosophe. Le terme français garde le vocabulaire philosophique caractéristique de 4 Maccabées.
- source_word: θείου βίου
  choice: de la manière divine de vivre
  rationale: βίος peut désigner la vie comme manière de vivre. « Manière divine de vivre » conserve cette nuance pratique tout en laissant à « divine » son amplitude, sans préciser excessivement « consacrée à Dieu ».
theological_decisions:
- issue: Sens de θείου βίου
  choice: la manière divine de vivre
  alternative: la vie pieuse ; une manière de vivre consacrée à Dieu
  rationale: La formule grecque est dense et peut évoquer soit une vie qualifiée de divine, soit une conduite caractérisée par la piété. La traduction retenue conserve l’adjectif « divine » et le sens comportemental de βίος sans résoudre cette tension.
- issue: Présentation de νόμου
  choice: la loi
  alternative: la Loi
  rationale: Le contexte renvoie vraisemblablement à la loi juive, mais le grec ne fournit aucun indice typographique. La minuscule permet de conserver le référent sans introduire une convention confessionnelle.
translation_notes:
  register: Apostrophe solennelle et rhétorique, conforme au style élevé du passage. Le français reste actuel et intelligible, tout en conservant l’image grecque de l’harmonie et le vocabulaire explicitement philosophique.
