  yaml_path: translation/deuterocanon/4_maccabees/007/001.yaml
  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: fr
  text: Car la raison de notre père Éléazar, telle un excellent pilote, gouvernait le navire de la piété[a] sur la mer des passions[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « piété » désigne le respect et l’attachement envers Dieu qui se manifestent par une conduite fidèle.
    reason: lexical_clarification
  - marker: b
    text: Le mot grec désigne ici vraisemblablement les passions ou les impulsions affectives, thème central de 4 Maccabées, plutôt que les seules souffrances.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Car… telle
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « telle » introduit naturellement en français la comparaison marquée par ὥσπερ.
- source_word: ἄριστος κυβερνήτης
  choice: un excellent pilote
  rationale: « Pilote » désigne ici celui qui dirige le navire et reste plus courant que « timonier », tout en préservant l’image nautique; « excellent » rend la valeur qualitative de ἄριστος.
- source_word: ὁ … λογισμός
  choice: la raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté de jugement rationnel qui maîtrise les passions. « La raison » est idiomatique en français et convient mieux ici que « le raisonnement », qui évoquerait surtout une suite d’arguments.
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: de notre père Éléazar
  rationale: La formulation conserve le titre familial honorifique du grec sans préciser davantage la nature de cette paternité.
- source_word: πηδαλιουχῶν
  choice: gouvernait
  rationale: Dans le contexte maritime, « gouverner un navire » signifie le diriger au gouvernail et restitue l’action continue du participe sans alourdir la phrase.
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: le navire de la piété
  rationale: « Piété » exprime la dévotion respectueuse envers Dieu et la conduite fidèle qu’implique εὐσέβεια, tout en maintenant la métaphore du navire.
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: sur la mer des passions
  rationale: « Mer » conserve l’image de πέλαγος dans un français naturel. Dans cet ouvrage, πάθη renvoie principalement aux passions ou impulsions affectives que la raison doit maîtriser.
theological_decisions:
- issue: Sens moral et philosophique de λογισμός
  choice: la raison
  alternative: le raisonnement; le jugement rationnel
  rationale: Le passage personnifie la faculté rationnelle d’Éléazar comme pilote. « La raison » garde cette force morale et psychologique sans réduire le terme à une argumentation ponctuelle ni lui imposer un système philosophique postérieur.
- issue: Portée religieuse de εὐσέβεια
  choice: la piété
  alternative: la fidélité envers Dieu; l’attachement à Dieu
  rationale: « Piété » préserve la densité religieuse du terme grec, qui associe respect de Dieu et conduite fidèle. La note prévient une lecture limitée à des pratiques dévotionnelles.
- issue: Sens de πάθη
  choice: les passions
  alternative: les souffrances; les émotions
  rationale: Le thème directeur de 4 Maccabées est la maîtrise des passions par la raison. La traduction conserve toutefois le terme traditionnel et sa tension morale plutôt que de préciser dans le corps du texte qu’elles sont nécessairement désordonnées.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La métaphore nautique est conservée dans son ensemble. La virgule finale respecte le caractère syntaxiquement inachevé de ce segment, dont la comparaison se poursuit dans le contexte.
