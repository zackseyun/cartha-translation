lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Marque avec concision le lien conclusif ou la manière par rapport au récit précédent.
- source_word: ὁ Ἀαρωνίδης
  choice: descendant d’Aaron
  rationale: Le terme désigne un membre de la lignée d’Aaron; cette formulation est claire en français moderne, contrairement au rare « Aaronide ».
- source_word: Ἐλεάζαρος
  choice: Éléazar
  rationale: Forme française usuelle du nom biblique.
- source_word: διὰ τοῦ πυρὸς ὑπερτηκόμενος
  choice: bien que consumé par le feu
  rationale: Le participe évoque l’action destructrice d’une chaleur intense, jusqu’à fondre ou dépérir; « consumé par le feu » restitue cette image avec naturel.
- source_word: οὐ μετετράπη
  choice: ne changea pas
  rationale: Exprime ici qu’Éléazar ne se détourna pas intérieurement sous la torture.
- source_word: τὸν λογισμόν
  choice: sa résolution
  rationale: Dans le contexte, λογισμός désigne sa détermination raisonnée et ferme, tout en conservant un lien avec le thème majeur de la raison dans l’ouvrage.
theological_decisions:
- issue: La portée de λογισμός dans un ouvrage consacré à la maîtrise des passions par la raison
  choice: sa résolution
  alternative: sa raison; son dessein raisonné; son raisonnement
  rationale: « Résolution » exprime naturellement la fermeté morale et intellectuelle d’Éléazar dans cette phrase. Une note signale toutefois la portée philosophique de λογισμός afin de ne pas effacer l’ambiguïté thématique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif; la tournure concessive rend explicitement la relation contextuelle portée par le participe grec.
