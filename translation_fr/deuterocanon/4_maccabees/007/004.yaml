revisions:
- from: Jamais une ville assiégée n’a résisté à des machines de guerre nombreuses et variées comme cet homme d’une sainteté parfaite qui, tandis que les sévices et les chevalets de torture[a] embrasaient son âme sacrée, ébranla ceux qui l’assiégeaient, grâce à la raison qui défend la piété[b].
  to: Jamais une ville assiégée n’a résisté à de nombreuses et diverses machines de siège autant que cet homme très saint qui, tandis que son âme sacrée était brûlée par les tortures et les instruments de torture[a], ébranla ceux qui l’assiégeaient grâce à la raison qui défend la piété[b].
  rationale: La révision retire l'identification non assurée de στρέβλαις à des « chevalets » et reformule la proposition participiale pour rendre explicitement et naturellement l'homme — et son âme sacrée — comme soumis au fait d'être brûlé par les tortures. Elle maintient l'ambiguïté de διὰ et l'image militaire qui assimile les persécuteurs à des assiégeants.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:03:25Z'
review_pass:
  verdict: revise
  source_fidelity: La comparaison de siège, la qualification intensive de l'homme, l'image de l'âme soumise au feu des supplices, l'effet sur les assiégeants et le rôle de la raison défendant la piété sont tous conservés. Toutefois, « chevalets » identifie trop précisément στρέβλαις, dont le référent matériel demeure incertain, et la formulation « les sévices et les chevalets ... embrasaient son âme » transforme de façon un peu libre la construction participiale grecque.
  naturalness: Le français est globalement soutenu et lisible, mais « embrasaient son âme » avec les sévices et les chevalets comme sujets est moins naturel et peut suggérer indûment que les appareils sont eux-mêmes des sources de feu. « Était brûlée par les tortures et les instruments de torture » rend plus directement le participe passif πυρπολούμενος.
  terminology: « Machines de siège », « âme sacrée », « raison » et « piété » conviennent au registre et aux termes directeurs. « Très saint » restitue naturellement πανάγιος sans faire de « sainteté parfaite » une explicitation interprétative. « Instruments de torture » préserve l'incertitude de στρέβλαις dans le texte même.
  issues:
  - severity: medium
    issue: « Chevalets de torture » est trop spécifique pour στρέβλαις.
    rationale: Le mot grec désigne des moyens ou appareils de torture liés à la torsion, mais l'appareil exact est disputé. La note reconnaît cette incertitude; le texte principal ne devrait donc pas la trancher.
  - severity: low
    issue: « Les sévices et les chevalets de torture embrasaient son âme » est une réexpression peu directe de πυρπολούμενος.
    rationale: Le grec présente l'homme comme étant brûlé, tandis que son âme est qualifiée de sacrée. Une formulation passive française conserve plus clairement cette relation et évite une personnification quelque peu maladroite des instruments.
