base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: fr
  text: Jamais une ville assiégée n’a résisté à de nombreuses et diverses machines de siège autant que cet homme très saint qui, tandis que son âme sacrée était brûlée par les tortures et les instruments de torture[a], ébranla ceux qui l’assiégeaient grâce à la raison qui défend la piété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instruments de torsion » ou, plus généralement, « appareils de torture ». Le mot grec ne permet pas d’identifier avec certitude l’appareil employé.
    reason: lexical_alternative
  - marker: b
    text: Ou « par la raison qui défend la piété » ou « à cause de la raison qui défend la piété ». La construction grecque peut présenter la raison comme le moyen ou comme la cause de sa résistance.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: πόλις
  choice: ville
  rationale: Le cadre explicite du siège militaire appelle le terme courant « ville ».
- source_word: μηχανήμασιν
  choice: machines de guerre
  rationale: Dans le contexte de πολιορκουμένη et πολιορκοῦντας, il s’agit de machines employées lors d’un siège; cette formulation est claire sans ajouter un type précis d’engin.
- source_word: ἀντέσχεν
  choice: a résisté
  rationale: Le verbe exprime la résistance soutenue d’une ville attaquée et maintient naturellement l’image du siège.
- source_word: πανάγιος
  choice: d’une sainteté parfaite
  rationale: Cette expression rend la force intensive de πανάγιος dans un français digne, tout en évitant que « très saint » soit compris comme un titre ecclésiastique.
- source_word: ἱερὰν ψυχὴν
  choice: âme sacrée
  rationale: La traduction conserve le registre sacral de ἱεράν et la dimension intérieure de ψυχή dans le raisonnement moral du livre.
- source_word: αἰκισμοῖς
  choice: sévices
  rationale: Le mot désigne des traitements cruels et dégradants; « sévices » convient au contexte de torture sans atténuer sa violence.
- source_word: στρέβλαις
  choice: chevalets de torture
  rationale: Le terme évoque vraisemblablement des appareils qui tordent ou étirent le corps. Une note maintient l’incertitude sur leur forme exacte.
- source_word: πυρπολούμενος
  choice: embrasaient
  rationale: Cette tournure française conserve l’image violente du feu tout en exprimant naturellement ce que les supplices font subir à l’âme sacrée.
- source_word: ἐκίνησεν
  choice: ébranla
  rationale: Le verbe indique qu’il mit ses assaillants en mouvement ou les troubla; « ébranla » rend cet effet sans préciser indûment leur réaction.
- source_word: τοὺς πολιορκοῦντας
  choice: ceux qui l’assiégeaient
  rationale: La formulation applique explicitement aux tortionnaires la métaphore militaire développée dans toute la phrase.
- source_word: λογισμόν
  choice: raison
  rationale: Dans 4 Maccabées, λογισμός désigne la faculté rationnelle qui gouverne les passions; « raison » permet de préserver ce terme directeur.
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: qui défend la piété
  rationale: Le participe présent exprime l’action constante de la raison en faveur de l’attachement révérencieux et fidèle à Dieu.
theological_decisions:
- issue: Sens de εὐσέβεια
  choice: piété
  alternative: fidélité envers Dieu
  rationale: « Piété » conserve la portée religieuse et morale du grec sans réduire le terme à un sentiment intérieur; la solution plus explicite reste possible, mais interprète davantage.
- issue: Fonction de λογισμός dans le livre
  choice: raison
  alternative: jugement rationnel
  rationale: Le choix garde le vocabulaire philosophique central de 4 Maccabées sans transformer la faculté rationnelle en une simple décision ou résolution.
- issue: Valeur de διὰ τὸν… λογισμόν
  choice: grâce à la raison
  alternative: à cause de la raison / par la raison
  rationale: Le groupe prépositionnel présente la raison comme ce par quoi l’homme ébranle ses assaillants. « Grâce à » exprime ici le moyen ou le facteur favorable, sans trancher plus finement entre moyen et cause.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue comparaison et l’image cohérente du siège sont conservées. Les expressions « embrasaient son âme » et « ébranla » maintiennent la vigueur rhétorique du grec; les notes signalent les deux principales incertitudes lexicales et syntaxiques.
