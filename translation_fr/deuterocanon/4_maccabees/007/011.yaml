  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
translation:
  language: fr
  text: Car, de même que le père Aaron, armé de l’encensoir, courut à travers la foule du peuple et vainquit l’ange porteur de feu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ange du feu » ; peut-être « l’ange destructeur ». L’expression fait probablement allusion à l’intervention d’Aaron lors du fléau raconté en Nombres 16.
    reason: Signaler les autres compréhensions possibles de ἐμπυριστής et l’allusion biblique probable sans les imposer dans le texte.
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Car, de même que
  rationale: « Car » restitue la valeur explicative de γάρ, tandis que « de même que » conserve la comparaison introduite par ὥσπερ.
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: notre père Aaron
  rationale: πατήρ présente Aaron comme un père ancestral. En français, « notre père Aaron » exprime naturellement cette valeur honorifique et évite que « le père Aaron » soit compris comme un titre sacerdotal moderne.
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: armé de l’encensoir
  rationale: Le datif est instrumental, et « armé » maintient l’image martiale de καθωπλισμένος tout en désignant clairement l’objet cultuel.
- source_word: διὰ τοῦ ἔθνοπλήθους ἐπιτρέχων
  choice: courut à travers la foule du peuple
  rationale: Cette formulation rend le déplacement rapide de ἐπιτρέχων et la multitude compacte évoquée par ἔθνοπλήθους, dans un français fluide.
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: l’ange porteur de feu
  rationale: La traduction conserve l’association explicite de l’ange avec le feu sans l’identifier directement à « l’ange destructeur », interprétation probable mais plus précise que le grec.
- source_word: ἐνίκησεν
  choice: vainquit
  rationale: « Vainquit » préserve le langage de victoire de νικάω ainsi que le registre élevé du passage.
theological_decisions:
- issue: Identité de l’ange dans l’allusion à l’intervention d’Aaron lors du fléau
  choice: l’ange porteur de feu
  alternative: l’ange destructeur
  rationale: Le grec associe explicitement l’ange au feu, mais ne le qualifie pas directement de destructeur. La traduction principale maintient cette formulation et laisse l’identification interprétative en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la virgule finale parce que le verset introduit une comparaison qui se poursuit dans le contexte.
