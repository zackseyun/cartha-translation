  yaml_path: translation/deuterocanon/4_maccabees/007/020.yaml
  text: Therefore[a], nothing is opposed by the fact that some appear to be ruled by passions because of weak reason.
translation:
  language: fr
  text: Le fait que certains paraissent dominés par les passions à cause de la faiblesse de leur raison ne s’oppose donc en rien à ce qui précède.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le fait que certains paraissent dominés par les passions à cause d’un raisonnement faible ne contredit donc en rien ce qui précède. »'
    reason: La construction peut être explicitée de plusieurs manières en français, et λογισμός peut désigner la raison comme faculté ou l’exercice du raisonnement.
lexical_decisions:
- source_word: οὐδὲν
  choice: en rien
  rationale: 'L’accusatif neutre a ici une valeur adverbiale : il indique que l’apparente exception ne s’oppose en aucune manière à l’argument précédent.'
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conclusion tirée du raisonnement précédent.
- source_word: ἐναντιοῦται
  choice: ne s’oppose … à cela
  rationale: Le verbe exprime l’opposition. « À cela » explicite en français le renvoi contextuel à la thèse précédente, sans définir davantage celle-ci.
- source_word: τὸ φαίνεσθαί τινας
  choice: le fait que certains paraissent
  rationale: L’infinitif articulé forme le sujet de la proposition; « paraissent » conserve la distinction entre apparence et réalité.
- source_word: παθοκρατεῖσθαι
  choice: dominés par les passions
  rationale: Le composé décrit des personnes sous le pouvoir des passions; « dominés » restitue naturellement cette image de maîtrise.
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: à cause de la faiblesse de leur raison
  rationale: διά avec l’accusatif indique ici la cause. Cette formulation française conserve le contraste philosophique entre la raison et les passions tout en évitant l’expression peu naturelle « raison faible ».
theological_decisions:
- issue: Contraste anthropologique et philosophique entre la raison et les passions
  choice: « raison » et « dominés par les passions »
  alternative: « raisonnement » et « sous l’emprise des émotions »
  rationale: Le passage développe la capacité de la raison à gouverner les passions. Les termes retenus préservent ce cadre conceptuel sans lui ajouter une catégorie doctrinale ultérieure.
- issue: Fonction syntaxique de οὐδὲν
  choice: 'Valeur adverbiale : « en rien »'
  alternative: 'Valeur substantivale : « rien ne s’oppose »'
  rationale: 'L’infinitif articulé τὸ φαίνεσθαι constitue naturellement le sujet de ἐναντιοῦται; οὐδὲν précise alors l’étendue de l’opposition. Cette analyse produit aussi un sens argumentatif cohérent : l’apparente exception ne réfute pas la thèse précédente.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure conserve le caractère argumentatif du grec et sa nuance d’apparence, tout en rendant explicite le complément contextuel nécessaire en français.
