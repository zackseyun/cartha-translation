  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: fr
  text: Ô vieillesse bénie, chevelure blanche vénérable et vie conforme à la Loi, que le sceau fidèle de la mort[a] a menée à son accomplissement !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est très condensée. Elle peut aussi se comprendre comme : « que la mort, sceau fidèle — ou véritable —, a menée à son accomplissement ». La mort peut ainsi être comprise comme le sceau qui confirme de façon certaine une telle vie.'
    reason: ambiguïté lexicale et métaphorique
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: heureuse vieillesse
  rationale: « Heureuse » exprime ici une condition digne d’éloge et d’envie, non un simple sentiment de bonheur, tout en gardant le ton élevé de l’exclamation.
- source_word: σεμνῆς πολιᾶς
  choice: vénérables cheveux blancs
  rationale: σεμνός évoque la dignité qui inspire le respect, et πολιᾶ désigne les cheveux blanchis par l’âge. Cette formulation conserve l’image concrète et solennelle.
- source_word: βίου νομίμου
  choice: vie conforme à la Loi
  rationale: Dans le contexte de 4 Maccabées, νόμιμος renvoie vraisemblablement à une vie réglée par la Loi juive. La majuscule rend cette référence contextuelle sans développer le grec.
- source_word: πιστὴ σφραγὶς
  choice: sceau sûr
  rationale: πιστός qualifie ici le sceau comme fiable, certain ou authentique. « Sûr » convient mieux à cet objet en français moderne que le littéral mais ambigu « fidèle », tout en préservant la métaphore.
- source_word: θανάτου
  choice: de la mort
  rationale: Le génitif grec est conservé afin de ne pas décider trop vite si la mort constitue elle-même le sceau ou si elle en caractérise la nature.
- source_word: ἐτελείωσεν
  choice: a menée à son accomplissement
  rationale: Le verbe signifie achever, accomplir ou porter à la perfection. Cette traduction garde l’idée de pleine réalisation sans imposer un sens théologique technique.
theological_decisions:
- issue: Portée de βίου νομίμου dans le contexte du martyre juif
  choice: vie conforme à la Loi
  alternative: vie respectueuse de la loi ; vie légitime
  rationale: Le thème central du livre est la fidélité à la Loi ancestrale. « Conforme à la Loi » rend cette portée probable plus clairement que « légitime », sans ajouter une précision absente du texte.
- issue: Valeur de τελειόω appliqué à la vie achevée par la mort
  choice: menée à son accomplissement
  alternative: rendue parfaite ; achevée
  rationale: La formulation maintient la tension entre achèvement biographique et accomplissement exemplaire par le martyre, sans transformer le verbe en affirmation doctrinale technique.
- issue: Rapport métaphorique entre le sceau et la mort
  choice: le sceau sûr de la mort
  alternative: la mort, sceau sûr ; le sceau fidèle qu’est la mort
  rationale: Le génitif θανάτου est formellement conservé dans le texte. La note signale les principales manières de comprendre cette métaphore grecque très condensée.
translation_notes:
  register: Français moderne, soutenu mais accessible. L’exclamation et la triple louange sont conservées. « Cheveux blancs » maintient l’image grecque sans archaïsme ; « menée » s’accorde avec « vie », antécédent du relatif.
