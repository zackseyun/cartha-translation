  yaml_path: translation/deuterocanon/4_maccabees/007/017.yaml
  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: fr
  text: 'Mais peut-être certains diraient-ils : « Tous ne parviennent pas à maîtriser leurs passions[a], parce que tous n’ont pas un jugement rationnel avisé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prennent pas le dessus sur leurs passions » ou « ne dominent pas leurs passions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une raison prudente » ou « un jugement rationnel sensé ». Le grec emploie ici un terme clé qui désigne la raison ou le jugement rationnel dans l’argumentation de 4 Maccabées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: Mais peut-être certains diraient-ils
  rationale: Cette formulation rend à la fois le caractère hypothétique de l’optatif avec ἄν et la nuance de possibilité exprimée par ἴσως, tout en introduisant naturellement une objection supposée.
- source_word: τῶν παθῶν
  choice: leurs passions
  rationale: Dans l’argument de 4 Maccabées, πάθη désigne les passions, émotions ou désirs que la raison doit gouverner, plutôt que des souffrances subies. Le possessif implicite donne une tournure française naturelle.
- source_word: οὐ πάντες περικρατοῦσιν
  choice: Tous ne parviennent pas à maîtriser
  rationale: περικρατέω exprime ici le fait de prendre le dessus et d’acquérir la maîtrise. « Parvenir à maîtriser » en restitue l’aspect dynamique sans alourdir la phrase.
- source_word: φρόνιμον
  choice: avisée
  rationale: φρόνιμος qualifie une sagesse pratique, un jugement sensé ou prudent. « Avisée » conserve cette nuance éthique et intellectuelle.
- source_word: τὸν λογισμόν
  choice: une raison
  rationale: λογισμός est un terme central de l’ouvrage pour la faculté de raisonnement ou le jugement rationnel. « Raison » reste clair et naturel en français.
- source_word: φρόνιμον ἔχουσιν τὸν λογισμόν
  choice: ont une raison avisée
  rationale: La construction décrit la qualité de la raison possédée, non la simple présence ou absence de toute faculté rationnelle.
theological_decisions:
- issue: Rapport entre la raison humaine et la maîtrise des passions
  choice: Le texte attribue l’échec à maîtriser les passions au fait que la raison de tous n’est pas avisée.
  alternative: Comprendre que tous ne mettent pas leur raison en œuvre avec sagesse, plutôt que de dire qu’ils ne possèdent pas une raison avisée.
  rationale: Le grec ἔχουσιν avec l’adjectif prédicatif φρόνιμον qualifie le λογισμός. La traduction préserve cette affirmation sans l’amplifier jusqu’à nier que certains êtres humains possèdent toute capacité rationnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le conditionnel inversé conserve le ton rhétorique d’une objection possible. « Raison avisée » maintient la teneur philosophique du passage sans imposer une interprétation confessionnelle.
