  text: In no way did he turn aside the rudders of godliness[a], until he sailed into the harbor of victory over death.
translation:
  language: fr
  text: Il ne détourna en aucune manière les gouvernails de la fidélité à Dieu, jusqu’à ce qu’il navigue jusqu’au port de la victoire sur la mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement mais moins probablement dans ce contexte : « le port de la victoire de la mort ». La suite de génitifs en grec est condensée.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατʼ οὐδένα τρόπον
  choice: en aucune manière
  rationale: Rend avec force la négation emphatique grecque dans un français actuel et digne.
- source_word: μετέτρεψεν
  choice: ne détourna
  rationale: Le verbe exprime l’idée de tourner ou de dévier; « détourna » maintient ici l’image d’un changement de cap.
- source_word: τοὺς τῆς εὐσεβείας οἴακας
  choice: les gouvernails de la fidélité à Dieu
  rationale: « Gouvernails » conserve le pluriel et la métaphore maritime de οἴακας. Dans ce contexte, εὐσέβεια désigne une conduite pieuse et loyale envers Dieu; « fidélité à Dieu » en communique clairement la portée relationnelle et religieuse.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Équivalent temporel naturel qui marque le terme de sa persévérance.
- source_word: ἔπλευσεν ἐπὶ ... λιμένα
  choice: il atteigne, après avoir navigué, le port
  rationale: Cette formulation préserve explicitement l’action de naviguer tout en exprimant naturellement en français l’arrivée au port.
- source_word: τὸν τῆς θανάτου νίκης λιμένα
  choice: le port de la victoire sur la mort
  rationale: La chaîne de génitifs est condensée. Dans le contexte élogieux du martyre enduré avec fermeté, cette lecture rend le port comme l’aboutissement d’une victoire remportée sur la mort, sans effacer l’autre analyse grammaticalement possible, signalée en note.
theological_decisions:
- issue: Interprétation de τὸν τῆς θανάτου νίκης λιμένα
  choice: le port de la victoire sur la mort
  alternative: le port de la victoire de la mort
  rationale: Le contexte présente l’endurance jusqu’au martyre comme une victoire, ce qui favorise la première lecture. La construction grecque reste toutefois assez compacte pour permettre formellement la seconde; la note conserve cette ambiguïté au lieu de la supprimer.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La métaphore maritime filée est conservée par « gouvernails », « navigué » et « port »; le pluriel concret du grec est maintenu.
