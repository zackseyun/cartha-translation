  text: And yet[a], most astonishingly, though he was an old man, with the pains of his body already loosened, and his flesh relaxed, and even his sinews worn out, he renewed his youth.
translation:
  language: fr
  text: Et pourtant, chose tout à fait étonnante, bien qu’il fût un vieil homme, ses forces corporelles étant déjà affaiblies, sa chair relâchée et même ses tendons épuisés, il retrouva sa jeunesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il redevint jeune » ou « il retrouva une vigueur juvénile ». Le verbe grec évoque un retour à la jeunesse ou à sa vigueur.
    reason: Précise les possibilités de traduction de l’image verbale sans imposer un sens purement littéral ou uniquement figuré.
lexical_decisions:
- source_word: καίτοι
  choice: Et pourtant
  rationale: Introduit avec force une concession et un retournement rhétorique; cette formulation est naturelle et soutenue en français.
- source_word: τὸ θαυμασιώτατον
  choice: chose des plus étonnantes
  rationale: Rend l’expression superlative substantivée sans la réduire à un simple adverbe et met en relief le point culminant de la phrase.
- source_word: γέρων ὤν
  choice: bien qu’il fût un vieillard
  rationale: Le participe prend ici une valeur concessive; «vieillard» conserve le contraste appuyé entre son grand âge et le regain qui suit.
- source_word: λελυμένων ἤδη τῶν τοῦ σώματος πόνων
  choice: que les forces de son corps se fussent déjà relâchées
  rationale: Dans cette description des effets de l’âge, πόνοι désigne vraisemblablement les capacités actives ou les forces corporelles plutôt que des douleurs; «se fussent relâchées» conserve l’image de λύω, tout en restant idiomatique.
- source_word: περικεχαλασμένων δὲ τῶν σαρκῶν
  choice: que sa chair fût devenue flasque
  rationale: σάρξ est ici strictement physique; «chair» en garde le sens concret, tandis que «devenue flasque» exprime l’état résultant de χαλάω.
- source_word: κεκμηκότων δὲ καὶ τῶν νεύρων
  choice: et que même ses tendons fussent épuisés
  rationale: Dans une description anatomique ancienne, νεῦρα renvoie aux tendons ou aux nerfs physiques, non aux «nerfs» au sens psychologique moderne; κεκμηκότων exprime leur épuisement.
- source_word: ἀνενέασεν
  choice: il redevint jeune
  rationale: Rend directement le verbe signifiant retrouver la jeunesse ou la vigueur juvénile, sans décider si le propos décrit littéralement un rajeunissement ou, dans le contexte, un regain de vigueur.
theological_decisions:
- issue: Sens de σάρξ dans un contexte non paulinien de vieillissement corporel
  choice: chair
  alternative: corps; muscles
  rationale: Le mot décrit ici la réalité physique de la chair relâchée, sans connotation de nature pécheresse; le terme littéral convient donc.
- issue: Portée du rajeunissement exprimé par ἀνενέασεν
  choice: il redevint jeune
  alternative: il retrouva une vigueur juvénile
  rationale: La formulation choisie préserve la force et l’ambiguïté de l’image grecque, sans la limiter d’emblée à un changement d’apparence ni à un simple regain psychologique.
