  text: For only the wise and self-controlled man is courageous[a], master of the passions.
translation:
  language: fr
  text: Car seul l’homme[a] sage et maître de lui-même est courageux, maître des passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne » ou « celui qui » ; le grec emploie ici le masculin singulier dans un sens générique.
    reason: Alternative lexicale et précision sur le genre grammatical de l’expression grecque.
lexical_decisions:
- source_word: μόνος
  choice: seul
  rationale: Placée en tête du groupe nominal, cette formulation exprime nettement l’exclusivité affirmée par la maxime.
- source_word: σοφὸς
  choice: sage
  rationale: Dans ce contexte éthique et philosophique, le mot désigne la sagesse morale et intellectuelle.
- source_word: σώφρων
  choice: maître de lui-même
  rationale: Cette expression française actuelle met en valeur la maîtrise de soi et la retenue disciplinée impliquées par le terme.
- source_word: ἀνδρεῖός
  choice: courageux
  rationale: Le terme exprime le courage ou la vaillance; « courageux » est naturel et évite de renforcer artificiellement sa nuance étymologiquement masculine.
- source_word: τῶν παθῶν
  choice: des passions
  rationale: Dans 4 Maccabées, πάθη désigne couramment les passions et impulsions que la raison doit gouverner, plutôt que de simples émotions ou des souffrances extérieures.
- source_word: κύριος
  choice: maître
  rationale: Dans ce contexte non divin, le mot indique l’autorité et la domination exercées sur les passions; « maître » conserve sa force nominale.
- source_word: ἀνδρεῖός ἐστιν τῶν παθῶν κύριος
  choice: est courageux, maître des passions
  rationale: La virgule maintient la formulation grecque ramassée et présente « maître des passions » comme un second prédicat sans ajouter une relation explicative absente du texte.
- source_word: ὁ σοφὸς καὶ σώφρων
  choice: l’homme sage et maître de lui-même
  rationale: Les adjectifs masculins substantivés désignent ici génériquement la personne qui possède ces qualités; « l’homme » conserve la forme masculine du grec, avec une note signalant la portée générique.
theological_decisions:
- issue: Expression générique au masculin dans une maxime éthique
  choice: l’homme
  alternative: la personne; celui qui est sage et maître de lui-même
  rationale: Le grec emploie l’article et des adjectifs substantivés au masculin singulier. La traduction garde ce marquage tout en précisant en note qu’il est générique.
- issue: Sens de κύριος dans un contexte non divin
  choice: maître
  alternative: celui qui domine; souverain
  rationale: Il ne s’agit pas ici d’un titre divin, mais de la maîtrise exercée sur les passions. « Maître » rend directement cette idée sans suggérer une adresse au Seigneur.
translation_notes:
  register: Français international moderne, sobre et digne. La construction concise et appositionnelle conserve le caractère sentencieux du grec. La répétition de « maître » fait écho au lien conceptuel entre la maîtrise de soi et la domination des passions.
