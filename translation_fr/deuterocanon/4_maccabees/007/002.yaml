lexical_decisions:
- source_word: κατακλυζόμενος
  choice: submergé
  rationale: Le participe évoque une inondation ou un déluge. « Submergé » garde cette image tout en restant naturel en français.
- source_word: ἀπειλαῖς
  choice: menaces
  rationale: Le terme désigne ici les menaces verbales par lesquelles le tyran cherche à contraindre le martyr.
- source_word: καταντλούμενος
  choice: englouti sous
  rationale: Dans ce contexte, le verbe prolonge l’image d’une masse d’eau qui s’abat sur quelqu’un. « Englouti sous » exprime l’envahissement violent et s’accorde naturellement avec les vagues qui suivent.
- source_word: βασάνων
  choice: supplices
  rationale: Dans le contexte du martyre, le mot désigne des souffrances graves infligées délibérément. « Supplices » conserve cette intensité sans réduire le sens à une seule technique de torture.
- source_word: τρικυμίαις
  choice: vagues déchaînées
  rationale: Le nom évoque une mer violemment agitée ou des vagues de tempête. « Vagues déchaînées » rend clairement cette image en français moderne.
- source_word: τοῦ τυράννου
  choice: du tyran
  rationale: Cette tournure rend directement le génitif grec et conserve le jugement moral porté par le titre « tyran ».
