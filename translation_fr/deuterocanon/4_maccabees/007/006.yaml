revisions:
- from: Ô prêtre digne du sacerdoce, tu n’as pas souillé tes dents sacrées et tu n’as pas associé à la consommation d’aliments impurs[a] ton ventre, qui avait accueilli la piété envers Dieu et la pureté.
  to: Ô prêtre digne du sacerdoce, tu n’as pas souillé tes dents sacrées, ni fait participer ton ventre, qui avait accueilli la piété envers Dieu et la pureté, à une consommation souillante[a].
  rationale: La révision rend la relation syntaxique exprimée par ἐκοινώνησας plus idiomatique et remplace une formulation qui spécifiait les aliments par une expression portant sur l’acte alimentaire souillant. Elle maintient l’imagerie corporelle, le registre cultuel et la nuance signalée en note.
