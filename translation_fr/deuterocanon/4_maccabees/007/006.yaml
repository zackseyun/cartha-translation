  yaml_path: translation/deuterocanon/4_maccabees/007/006.yaml
  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: fr
  text: Ô prêtre digne du sacerdoce, tu n’as pas souillé tes dents sacrées, ni fait participer ton ventre, qui avait accueilli la piété envers Dieu et la pureté, à une consommation souillante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à une manière sacrilège de manger ». Le terme grec rare désigne la participation à une consommation qui entraîne une souillure rituelle ou morale.
    reason: Alternative lexicale liée à l’ambiguïté de μιεροφαγίᾳ.
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: Ô prêtre digne du sacerdoce
  rationale: Conserve à la fois l’adresse au prêtre et l’éloge emphatique de sa dignité sacerdotale.
- source_word: ἐμίανας
  choice: souillé
  rationale: Exprime la contamination cultuelle et morale dans un français biblique actuel et naturel.
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: tes dents sacrées
  rationale: Maintient l’image corporelle frappante et le registre cultuel du grec.
- source_word: θεοσέβειαν
  choice: la piété envers Dieu
  rationale: Rend explicitement l’idée de dévotion respectueuse envers Dieu sans la réduire à une qualité vague.
- source_word: καθαρισμόν
  choice: la pureté
  rationale: Dans ce contexte, le mot désigne la pureté cultuelle et morale liée à la fidélité alimentaire.
- source_word: χωρήσασαν γαστέρα
  choice: ton ventre, qui avait accueilli
  rationale: χωρέω peut signifier contenir, recevoir ou faire place à; «avait accueilli» préserve l’image tout en restant naturel.
- source_word: ἐκοινώνησας
  choice: tu n’as pas associé
  rationale: 'Préserve la nuance factitive ou associative: le prêtre n’a pas fait participer son ventre à l’acte impur.'
- source_word: μιεροφαγίᾳ
  choice: la consommation d’aliments impurs
  rationale: Le composé rare désigne le fait de manger ce qui souille; cette formulation rend clairement l’acte alimentaire et sa portée cultuelle.
theological_decisions:
- issue: Application du langage de pureté cultuelle aux membres du corps et à l’alimentation
  choice: Conserver les «dents sacrées» et le ventre qui accueille la piété envers Dieu et la pureté
  alternative: Paraphraser comme un simple refus de manger des aliments impurs
  rationale: Le grec emploie volontairement une imagerie corporelle vive pour célébrer la fidélité du martyr; la conserver évite d’aplanir la tension rhétorique et théologique.
- issue: Sens précis du rare μιεροφαγίᾳ
  choice: la consommation d’aliments impurs
  alternative: le fait de manger d’une manière sacrilège / une nourriture qui souille
  rationale: Le terme peut viser tant l’acte de manger que ce qui est mangé. Le texte principal privilégie une formulation intelligible qui garde ces deux dimensions proches, tandis que la note signale l’autre nuance.
translation_notes:
  register: Français moderne, international et digne. L’apostrophe «Ô» et l’expression «dents sacrées» conservent l’intensité rhétorique et l’étrangeté voulue de l’original, tandis que la syntaxe est légèrement réorganisée pour rester claire.
