  text: For this reason indeed[a], even young men, by philosophizing according to the reasoning of piety[b], overcame more severe tortures.
translation:
  language: fr
  text: C’est bien pour cette raison que même de jeunes hommes, en philosophant[a] selon le raisonnement de la piété[b], ont triomphé de tortures plus sévères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « en pratiquant la philosophie » ou « en vivant en philosophes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par un raisonnement pieux » ou « grâce à une raison guidée par la piété ». Cette expression, centrale dans 4 Maccabées, associe l’exercice de la raison à la révérence envers Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό γε τοι
  choice: C’est bien pour cette raison
  rationale: La tournure exprime une conclusion fondée sur ce qui précède, tandis que « bien » restitue naturellement la valeur emphatique de γε τοι.
- source_word: μειρακίσκοι
  choice: de jeunes hommes
  rationale: Le terme désigne de jeunes personnes de sexe masculin, vraisemblablement des adolescents ou de très jeunes hommes.
- source_word: τῷ τῆς εὐσεβείας λογισμῷ
  choice: selon le raisonnement de la piété
  rationale: « Raisonnement » conserve la portée délibérative de λογισμός, terme central du livre, et « piété » exprime l’attachement respectueux envers Dieu contenu dans εὐσέβεια. « Selon » rend ici la norme ou la direction donnée à leur démarche philosophique, sans exclure entièrement une nuance de moyen.
- source_word: φιλοσοφοῦντες
  choice: en philosophant
  rationale: Cette formulation garde le vocabulaire philosophique explicite de l’auteur et la valeur circonstancielle du participe grec.
- source_word: χαλεπωτέρων βασανιστηρίων
  choice: de tortures plus cruelles
  rationale: Le comparatif χαλεπωτέρων indique que ces tortures étaient plus pénibles ou plus terribles que celles évoquées auparavant; « plus cruelles » est naturel et vigoureux en français.
- source_word: ἐπεκράτησαν
  choice: ont triomphé de
  rationale: Le verbe exprime le fait de l’emporter sur quelque chose ou de se montrer plus fort; « triompher de » convient à la victoire morale sur les tortures.
theological_decisions:
- issue: Relation entre le raisonnement et la piété dans la formule programmatique du livre
  choice: selon le raisonnement de la piété
  alternative: par un raisonnement pieux; grâce à une raison guidée par la piété
  rationale: La formulation retenue maintient ensemble le raisonnement rationnel et la piété envers Dieu, sans réduire l’un à l’autre ni imposer une systématisation théologique ultérieure. La note conserve les lectures instrumentales possibles du datif grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « en philosophant » est volontairement conservé malgré son caractère légèrement soutenu, car il reflète un élément explicite et thématique du grec. Les deux marqueurs de note figurent dans le texte.
