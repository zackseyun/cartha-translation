translation:
  language: fr
  text: Car il disait qu’il avait péché, au point de mériter même la mort, et que, s’il était sauvé, il célébrerait[a] devant tous les êtres humains la félicité du lieu saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il chanterait devant tous les êtres humains la félicité du lieu saint ». Le verbe grec évoque une louange de type hymnique, sans nécessairement désigner un chant au sens littéral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec présente la parole dans son déroulement; l’imparfait français convient naturellement au récit et ne force ni la répétition ni la ponctualité.
- source_word: ἡμαρτηκώς
  choice: qu’il avait péché
  rationale: Le participe parfait exprime un acte accompli dont les conséquences demeurent; le plus-que-parfait français restitue clairement cette antériorité.
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: au point de mériter même la mort
  rationale: Cette tournure française rend la conséquence introduite par ὥστε et la notion de mérite négatif exprimée par ἄξιος, tandis que « même » représente le καί intensif.
- source_word: πᾶσίν τε ἀνθρώποις
  choice: devant tous les humains
  rationale: Le datif désigne les destinataires ou l’auditoire de la célébration. « Devant » souligne la dimension publique sans limiter ἀνθρώποις aux hommes de sexe masculin.
- source_word: ὑμνήσειεν
  choice: il célébrerait
  rationale: L’optatif en discours indirect devient naturellement un conditionnel en français. « Célébrer » conserve l’idée de louange solennelle ou hymnique sans imposer un chant littéral.
- source_word: σωθεὶς
  choice: s’il était sauvé
  rationale: Le participe aoriste passif porte ici une valeur conditionnelle. « Sauvé » conserve l’étendue sémantique du grec, tout en laissant le contexte indiquer qu’il s’agit d’être préservé de la mort.
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: la félicité du lieu saint
  rationale: « Félicité » exprime la condition bienheureuse désignée par μακαριότης, et « lieu saint » suit directement ἱεροῦ τόπου sans remplacer l’expression par une interprétation plus précise comme « sanctuaire ».
theological_decisions:
- issue: Portée de σωθεὶς
  choice: Conserver « sauvé » dans le texte, avec le sens contextuel d’être préservé de la mort
  alternative: Traduire explicitement « s’il échappait à la mort » ou « s’il était délivré »
  rationale: Le récit vise vraisemblablement une délivrance temporelle, mais le verbe grec reste assez large. La traduction retenue préserve cette amplitude sans importer une doctrine ultérieure du salut.
- issue: Nature de la μακαριότης du lieu saint
  choice: « la félicité du lieu saint »
  alternative: « le bonheur du lieu saint » ou « l’état bienheureux du sanctuaire »
  rationale: La formulation garde l’attribution surprenante de la félicité au lieu lui-même, au lieu de la reformuler comme la bénédiction éprouvée par ceux qui s’y trouvent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Félicité » est légèrement littéraire, mais rend avec précision μακαριότης; « célébrer » demeure naturel dans un contexte de louange publique. Le marqueur de note [a] figure dans le texte principal.
