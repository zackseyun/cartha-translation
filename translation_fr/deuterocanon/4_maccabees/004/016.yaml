base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: fr
  text: Il destitua Onias de la charge de grand prêtre et nomma Jason, frère d’Onias, grand prêtre, celui-ci promettant de donner[a], si cette fonction lui était confiée, trois mille six cent soixante talents par an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de payer » ; le grec dit simplement « de donner » et laisse au contexte le soin de faire comprendre le caractère corrupteur de ce versement.
    reason: Alternative lexicale et préservation de l’implicite moral du texte source.
lexical_decisions:
- source_word: καταλύσας
  choice: destitua
  rationale: Dans ce contexte institutionnel, le verbe désigne la révocation d’Onias de sa fonction, non une destruction au sens littéral.
- source_word: τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: Onias de la charge de grand prêtre
  rationale: Cette formulation française exprime clairement qu’Onias est privé de sa fonction sacerdotale.
- source_word: κατέστησεν ἀρχιερέα
  choice: établit … comme grand prêtre
  rationale: « Établir comme » rend l’installation officielle dans la fonction tout en conservant un registre digne et naturel.
- source_word: ὑποσχόμενον δώσειν
  choice: avait promis de donner
  rationale: Le participe se rapporte à Jason et présente sa promesse comme la condition ayant conduit à sa nomination. « Donner » conserve la sobriété lexicale du grec sans qualifier explicitement la somme de pot-de-vin.
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: si cette charge lui était confiée
  rationale: La tournure passive évite l’ambiguïté des pronoms français tout en préservant la condition et le sens institutionnel de ἀρχή.
- source_word: κατʼ ἐνιαυτόν
  choice: par an
  rationale: Expression française actuelle et concise d’un versement annuel.
- source_word: τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: trois mille six cent soixante talents
  rationale: Le montant exact et l’unité monétaire ancienne sont conservés.
theological_decisions:
- issue: Caractérisation morale du versement promis par Jason
  choice: Décrire la transaction sans employer « pot-de-vin » dans le texte principal.
  alternative: Traduire de manière interprétative par « promit de payer » ou « acheta la charge » selon le contexte.
  rationale: Le grec dit seulement que Jason promit de donner une somme annuelle si la charge lui était confiée. Le caractère corrupteur de la transaction ressort du contexte, mais n’est pas nommé explicitement dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque a été divisée en deux pour éviter une accumulation lourde et pour identifier sans ambiguïté Jason comme l’auteur de la promesse, sans ajouter de contenu interprétatif.
