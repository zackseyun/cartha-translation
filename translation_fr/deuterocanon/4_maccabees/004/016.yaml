- from: Il destitua Onias de la charge de grand prêtre et établit Jason, son frère, comme grand prêtre. Jason avait promis de donner[a] trois mille six cent soixante talents par an si cette charge lui était confiée.
  to: Il destitua Onias de la charge de grand prêtre et nomma Jason, frère d’Onias, grand prêtre, celui-ci promettant de donner[a], si cette fonction lui était confiée, trois mille six cent soixante talents par an.
  rationale: 'La révision rapproche la syntaxe française de l''enchaînement grec : la promesse de Jason est maintenue comme élément concomitant et motivant sa nomination, sans ajouter une qualification morale. Elle rend aussi explicitement le lien familial entre Jason et Onias et améliore l''idiome de la nomination.'
