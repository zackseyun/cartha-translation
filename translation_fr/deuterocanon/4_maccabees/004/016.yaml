  source_fidelity: 'Le sens institutionnel de καταλύσας et κατέστησεν est bien rendu, de même que le montant annuel. Une légère révision est nécessaire : le participe présent ὑποσχόμενον est mieux conservé par « promettant » que par le plus-que-parfait « avait promis », et αὐτοῦ désigne Onias ; « frère d’Onias » lève une ambiguïté française possible.'
  naturalness: « Nomma … grand prêtre » est plus naturel et plus précis en français moderne que « établit … comme grand prêtre ». La phrase unique reste fluide tout en maintenant le lien direct entre la nomination et la promesse.
  terminology: « Destitua », « charge de grand prêtre », « nomma grand prêtre », « talents » et « par an » conviennent au registre et au contexte. La note conserve à juste titre « donner » dans le texte et présente « payer » comme possibilité contextuelle sans introduire « pot-de-vin » dans le verset.
