  text: And since he was in no way able to break the goodwill of the nation by means of decrees[a], but saw all his threats and punishments being nullified[b],
translation:
  language: fr
  text: Et puisqu’il ne parvenait en aucune manière à briser, par ses décrets[a], la loyauté de la nation, mais voyait au contraire toutes ses menaces et ses punitions réduites à néant[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ses édits ». Le grec δόγματα désigne des décrets ou ordonnances officiels.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec répète le groupe verbal καταλύω : il ne parvenait pas à « briser » la loyauté de la nation, tandis que ses propres menaces et punitions étaient elles-mêmes rendues inefficaces ou défaites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit ici la circonstance avec une nuance causale, tout en reliant cette proposition à la suite du récit.
- source_word: κατὰ μηδένα τρόπον
  choice: d’aucune manière
  rationale: Rend avec naturel l’insistance de la négation grecque.
- source_word: ἴσχυεν καταλῦσαι
  choice: ne parvenait ... à briser
  rationale: Dans cette construction avec l’infinitif, ἰσχύω exprime la capacité; « parvenir à » convient à une tentative persistante qui échoue.
- source_word: διὰ τῶν δογμάτων
  choice: par ses décrets
  rationale: δόγματα désigne ici des décisions officielles ou édits; le possessif est implicite dans le contexte de l’action du dirigeant.
- source_word: τὴν τοῦ ἔθνους εὔνοιαν
  choice: la loyauté de la nation
  rationale: Dans ce contexte de résistance nationale à des mesures coercitives, εὔνοια exprime une disposition favorable et fidèle; « loyauté » est plus idiomatique que « bienveillance » avec « nation », sans préciser abusivement son objet.
- source_word: πάσας τὰς ἑαυτοῦ ἀπειλὰς καὶ τιμωρίας
  choice: toutes ses menaces et ses sanctions
  rationale: Rend directement les deux moyens de coercition; « sanctions » convient au caractère officiel de τιμωρίαι et évite une formulation pesante.
- source_word: ἑώρα καταλυομένας
  choice: voyait ... réduites à néant
  rationale: Exprime le fait que ses mesures perdaient tout effet et fait écho au premier καταλύω, rendu par « briser ».
