  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: fr
  text: Alors qu’Apollonios montait avec une force armée pour s’emparer de l’argent, des anges montés à cheval se manifestèrent[a] depuis le ciel, leurs armes étincelant de tous côtés, et leur inspirèrent une grande peur et un grand effroi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi suggérer qu’ils se manifestèrent d’avance ou ouvertement ; le contexte ne permet pas de préciser davantage la nuance du préverbe προ-.
    reason: Ambiguïté lexicale de προυφάνησαν.
lexical_decisions:
- source_word: ἀνιόντος
  choice: montait
  rationale: Le génitif absolu décrit le déplacement d’Apollonios vers le lieu visé. « Montait » conserve le sens premier du verbe sans préciser davantage la topographie.
- source_word: καθωπλισμένης στρατιᾶς
  choice: une armée en armes
  rationale: Cette expression française naturelle rend à la fois στρατιά, « armée », et le fait qu’elle est équipée pour le combat.
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: pour s’emparer des fonds
  rationale: ἁρπαγή exprime une prise violente ou un pillage, tandis que χρήματα désigne ici des biens financiers ou des fonds, plutôt que l’argent comme métal.
- source_word: ἔφιπποι ἄγγελοι
  choice: des anges montés à cheval
  rationale: La formulation explicite à la fois l’identité angélique des figures et l’image concrète exprimée par ἔφιπποι.
- source_word: οὐρανόθεν προυφάνησαν
  choice: apparurent devant eux, venant du ciel
  rationale: « Venant du ciel » garde la portée surnaturelle de οὐρανόθεν. « Apparurent devant eux » rend naturellement la manifestation soudaine et visible, tout en évitant de faire de προ- une indication chronologique plus précise que ne l’exige le contexte.
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: leurs armes lançaient des éclairs tout autour d’eux
  rationale: La tournure restitue l’image lumineuse et enveloppante du participe, avec les armes comme moyen ou source de l’éclat.
- source_word: πολὺν αὐτοῖς φόβον τε καὶ τρόμον ἐνιόντες
  choice: ils leur inspiraient une peur et un effroi immenses
  rationale: « Inspiraient » exprime idiomatiquement l’action de faire pénétrer la peur en eux. Le doublet « peur et effroi » conserve l’intensification de φόβος et τρόμος.
theological_decisions:
- issue: Portée de οὐρανόθεν dans le récit d’une intervention surnaturelle
  choice: venant du ciel
  alternative: venant du firmament
  rationale: « Ciel » laisse au terme sa portée théologique naturelle dans une scène où les êtres manifestés sont explicitement des anges, sans développer une doctrine absente du verset.
- issue: Identification et apparence des figures célestes
  choice: des anges montés à cheval
  alternative: des cavaliers — des anges
  rationale: Le grec qualifie directement les anges de ἔφιπποι. La traduction retenue évite l’ambiguïté d’une apposition et préserve clairement l’image martiale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure ample comme en grec, mais le point-virgule clarifie l’enchaînement des participes. « Apollonios » suit une translittération française courante du nom grec.
