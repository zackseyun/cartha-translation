revisions:
- from: Alors qu’Apollonios montait avec une armée en armes pour s’emparer des fonds, des anges montés à cheval apparurent devant eux, venant du ciel[a] ; leurs armes lançaient des éclairs tout autour d’eux, et ils leur inspiraient une peur et un effroi immenses.
