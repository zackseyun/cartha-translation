  rationale: La révision remplace deux tournures françaises lourdes, évite d’imposer à προυφάνησαν une nuance spatiale incertaine et conserve dans une note l’ambiguïté pertinente. Elle maintient l’identité explicite des êtres célestes comme anges montés à cheval, l’origine céleste, l’éclat de leurs armes et le doublet intensif « peur et effroi ».
