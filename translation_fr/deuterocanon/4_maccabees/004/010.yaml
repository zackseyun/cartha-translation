    rationale: « Apparurent devant eux » interprète le préverbe προ- comme une localisation devant les soldats. Cette valeur n’est pas certaine ; il est préférable de rendre simplement la manifestation et de signaler en note les nuances possibles du préverbe.
  - severity: low
    issue: Expression « une armée en armes »
    rationale: La formule est redondante en français moderne. « Une force armée » conserve l’idée d’une troupe équipée pour le combat sans lourdeur.
  - severity: low
    issue: Image des armes formulée comme sujet autonome
    rationale: « Leurs armes lançaient des éclairs » est possible, mais le grec présente les anges comme les agents du participe. « Leurs armes étincelant de tous côtés » préserve plus directement l’image participiale.
  revised_text: Alors qu’Apollonios montait avec une force armée pour s’emparer de l’argent, des anges montés à cheval se manifestèrent[a] depuis le ciel, leurs armes étincelant de tous côtés, et leur inspirèrent une grande peur et un grand effroi.
  revised_footnotes:
