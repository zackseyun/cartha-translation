  text: And the one who had been saved unexpectedly went away, to report to the king the things that had happened to him.
translation:
  language: fr
  text: Quant à celui qui avait été sauvé de façon inattendue, il partit raconter au roi ce qui lui était arrivé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  choice: de façon inattendue
  rationale: L’adverbe exprime le caractère surprenant et contraire à l’attente de sa survie, sans imposer explicitement une nuance miraculeuse.
- source_word: διασωθεὶς
  choice: avait été sauvé
  rationale: Le participe aoriste passif indique qu’il avait été tiré sain et sauf d’un danger; cette formulation conserve la voix passive du grec.
- source_word: ᾤχετο
  choice: il partit
  rationale: Le verbe marque ici le départ; « il partit » est naturel, sobre et dignifié en français moderne.
- source_word: δηλώσων
  choice: raconter
  rationale: 'Le participe futur exprime le but du départ: faire connaître au roi les événements vécus. « Raconter » convient naturellement avec « ce qui lui était arrivé ».'
- source_word: τὰ συμβάντα αὐτῷ
  choice: ce qui lui était arrivé
  rationale: Cette tournure idiomatique rend l’expression substantivée grecque et son datif d’expérience sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La construction « Quant à celui… » restitue l’opposition portée par μέν, même si le correspondant δέ n’apparaît pas dans ce verset. Aucun marqueur de note n’est requis.
