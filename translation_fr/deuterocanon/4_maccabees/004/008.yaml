  text: They were preventing him as much as they could[b][a]. But with threats Apollonius was going to the temple.
translation:
  language: fr
  text: Ils lui faisaient obstacle autant qu’ils le pouvaient. Mais Apollonios se dirigeait vers le Temple[a] en proférant des menaces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner l’ensemble de l’enceinte du Temple, et non seulement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷόν τε ἦν
  choice: autant qu’ils le pouvaient
  rationale: L’expression idiomatique marque la limite de leurs possibilités; cette formulation est naturelle en français tout en conservant l’idée de capacité.
- source_word: ἐκώλυον
  choice: ils lui faisaient obstacle
  rationale: L’imparfait grec décrit une opposition en cours sans nécessairement indiquer qu’elle a pleinement réussi. « Faire obstacle » préserve mieux cette nuance que « empêcher ».
- source_word: μετὰ ἀπειλῆς
  choice: en proférant des menaces
  rationale: La tournure exprime la manière ou l’accompagnement. Le pluriel français est idiomatique, bien que le grec emploie le singulier collectif.
- source_word: ἀπῄει
  choice: se dirigeait
  rationale: L’imparfait présente le déplacement en cours; dans la construction avec εἰς, « se dirigeait vers » rend naturellement le mouvement vers sa destination.
- source_word: εἰς τὸ ἱερόν
  choice: vers le Temple
  rationale: ἱερόν désigne couramment l’ensemble du complexe du Temple. « Temple » reste la formulation française la plus naturelle, avec une note signalant l’étendue possible du terme.
- source_word: ὁ Ἀπολλώνιος
  choice: Apollonios
  rationale: Le nom grec est translittéré sous une forme française proche de l’original.
