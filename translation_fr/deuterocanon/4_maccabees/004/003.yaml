review_pass:
  verdict: revise
  source_fidelity: La traduction doit corriger deux points principaux. Le datif τοῖς τοῦ βασιλέως πράγμασιν décrit plus naturellement un lien avec les affaires du roi qu’une hostilité à ses intérêts ; l’anglais de contrôle adopte ici une interprétation adversative qui n’est pas imposée par le grec. De plus, γαζοφυλακίοις désigne des salles ou dépôts du trésor, plutôt que des « trésors » au sens des richesses elles-mêmes. La leçon transmise est néanmoins syntaxiquement difficile, notamment parce que ἥκω est à la première personne ; la note doit conserver cette difficulté sans la résoudre par une affirmation injustifiée.
  naturalness: « De nombreuses dizaines de milliers en fonds privés » n’est pas une construction française naturelle. « De nombreuses myriades de fonds privés », explicité en note, conserve la formulation quantitative grecque tout en restant lisible. « Déposés dans les salles du trésor » est plus idiomatique et précis que « amassées dans les trésors ».
  terminology: « Temple » convient pour τὸ ἱερόν et prend légitimement une majuscule dans ce contexte. « Fonds privés » et « ne relevant pas du Temple » rendent la distinction entre des dépôts de particuliers et les ressources du sanctuaire, sans imposer plus que ne le fait ἐπικοινωνούσας. « Le roi Séleucos » est naturel en français.
  issues:
  - severity: high
    issue: « hostile aux intérêts du roi » ne correspond pas de manière sûre à τοῖς τοῦ βασιλέως πράγμασιν.
    rationale: La construction suggère un rapport aux affaires du roi, non une opposition. L’audit anglais retient « hostile », mais cette valeur n’est pas établie par le texte fourni. La difficulté de ἥκω doit être signalée en note.
  - severity: medium
    issue: « de nombreuses dizaines de milliers en fonds privés » est maladroit et sémantiquement flou.
    rationale: Le grec parle de nombreuses myriades de sommes ou de fonds privés. La révision conserve la valeur de μυριάς sans introduire la préposition française non idiomatique « en ».
  - severity: medium
    issue: « dans les trésors » peut désigner les richesses plutôt que les lieux de dépôt.
    rationale: γαζοφυλάκια renvoie à des chambres, dépôts ou salles du trésor. « Salles du trésor » évite cette ambiguïté.
  revised_text: Simon, lié aux affaires du roi[a], rapporta que de nombreuses myriades de fonds privés[b] avaient été déposées dans les salles du trésor de Jérusalem, sans relever du Temple[c], et qu’ils revenaient au roi Séleucos.
  revised_footnotes:
  - marker: a
    text: 'La formulation grecque est difficile : le texte transmis porte littéralement « Simon, étant lié aux affaires du roi, je suis arrivé », avec ἥκω à la première personne. On peut aussi comprendre la relation comme « engagé dans les affaires du roi » ou « attaché à la cause du roi ».'
    reason: Conserver l’anomalie grammaticale du texte transmis et les nuances possibles de τοῖς τοῦ βασιλέως πράγμασιν, sans lui attribuer un sens hostile non assuré.
  - marker: b
    text: 'Littéralement : « de nombreuses myriades de sommes privées » ; une myriade vaut dix mille.'
    reason: Conserver la valeur numérique de μυριάδες et le caractère privé des χρημάτων.
  - marker: c
    text: 'Ou : « sans être mises en commun avec le Temple » ou « sans être rattachées au Temple ».'
    reason: ἐπικοινωνέω peut exprimer la mise en commun, la participation ou le rattachement ; la formulation principale indique la distinction d’avec les biens du sanctuaire.
  revision_rationale: La révision remplace l’interprétation non assurée « hostile aux intérêts du roi » par une formulation relationnelle plus proche du grec et documente l’irrégularité de la leçon transmise. Elle améliore aussi l’expression française du montant, rend γαζοφυλάκια par un terme locatif précis, et conserve l’ambiguïté de la relation des fonds au Temple ainsi que la portée de la prétention royale.
