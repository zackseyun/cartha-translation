base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: fr
  text: Simon, hostile aux intérêts du roi[a], dénonça que de nombreuses dizaines de milliers en fonds privés[b] avaient été amassées dans les trésors de Jérusalem sans appartenir au Temple[c], et qu’elles revenaient au roi Séleucos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile et très condensé. On pourrait aussi comprendre : « engagé dans les affaires du roi » ou « lié à la cause du roi ».'
    reason: Incertitude textuelle et lexicale autour de Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω.
  - marker: b
    text: 'Littéralement : « de nombreuses myriades de sommes privées » ; une myriade vaut dix mille.'
    reason: Conserver la valeur numérique et la formulation inhabituelle du grec.
  - marker: c
    text: 'Ou : « sans être mises en commun avec le Temple » ou « sans être rattachées au Temple ».'
    reason: ἐπικοινωνέω peut exprimer la mise en commun, la participation ou le rattachement.
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: Simon, hostile aux intérêts du roi
  rationale: La formulation grecque transmise est très condensée et grammaticalement difficile, notamment à cause de ἥκω. Dans le contexte de la dénonciation, elle présente Simon dans un rapport d’opposition aux intérêts royaux. La note conserve l’incertitude de l’expression.
- source_word: μηνύων
  choice: dénonça
  rationale: Le participe signifie faire connaître ou signaler, souvent dans le cadre d’une accusation. « Dénonça » rend ici la portée accusatrice du geste de Simon.
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: de nombreuses dizaines de milliers en fonds privés
  rationale: « Dizaines de milliers » conserve la valeur numérique de μυριάδας, tandis que « fonds privés » indique que l’argent appartenait à des particuliers plutôt qu’au Temple.
- source_word: ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις
  choice: dans les trésors de Jérusalem
  rationale: γαζοφυλάκια désigne les locaux ou dépôts du trésor. La formulation française reste concise et ne précise pas davantage leur emplacement institutionnel.
- source_word: τεθησαυρίσθαι
  choice: avaient été amassées
  rationale: Le parfait infinitif décrit des sommes mises en réserve et demeurant entreposées.
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: sans appartenir au Temple
  rationale: La phrase distingue ces fonds privés des biens communs ou propres au sanctuaire. « Sans appartenir au Temple » exprime cette exclusion patrimoniale tout en signalant en note les autres nuances possibles.
- source_word: προσήκειν
  choice: revenaient
  rationale: Dans ce contexte de revendication financière, le verbe exprime le droit allégué du roi sur ces sommes. « Revenaient » rend cette prétention sans affirmer abstraitement une propriété incontestée.
- source_word: Σελεύκῳ τῷ βασιλεῖ
  choice: au roi Séleucos
  rationale: Ordre naturel en français moderne pour le titre suivi du nom propre.
theological_decisions:
- issue: Nature des fonds conservés à Jérusalem
  choice: Les fonds sont présentés comme des dépôts privés, distincts des biens du Temple.
  alternative: Ils pourraient être compris plus largement comme des fonds qui n’étaient ni partagés avec le sanctuaire ni affectés à son usage.
  rationale: ἰδιωτικῶν χρημάτων qualifie explicitement l’argent de privé, et μὴ ἐπικοινωνούσας τῷ ἱερῷ nie son appartenance commune ou son rattachement au Temple. La traduction maintient cette distinction, essentielle à la logique de la revendication royale.
translation_notes:
  register: Français international moderne, narratif et digne. « Temple » prend une majuscule puisqu’il désigne ici le sanctuaire de Jérusalem. La syntaxe évite de présenter comme certaine l’interprétation difficile de la première proposition et conserve par des notes les ambiguïtés financières et institutionnelles.
