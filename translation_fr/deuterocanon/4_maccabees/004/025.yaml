  yaml_path: translation/deuterocanon/4_maccabees/004/025.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: fr
  text: Ainsi, puisque le peuple méprisait ses décrets, il contraignait lui-même, par la torture, chacun de ce peuple, après lui avoir fait goûter des aliments impurs, à renier[a] le judaïsme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à renier sous serment le judaïsme ». Le verbe grec peut comporter la nuance d’un désaveu formulé sous serment.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: décrets
  rationale: Dans ce contexte politique, le terme désigne les décisions officielles imposées par le souverain.
- source_word: κατεφρονεῖτο ὑπὸ τοῦ λαοῦ
  choice: le peuple méprisait
  rationale: Cette tournure française naturelle conserve la valeur durative de l’imparfait et le sens fort de mépris ou de dédain.
- source_word: διὰ βασάνων
  choice: par la torture
  rationale: Le singulier collectif est idiomatique en français et exprime clairement le moyen de coercition, tandis que le grec pluriel peut évoquer des supplices répétés ou variés.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: chaque membre de la nation
  rationale: Cette formulation restitue l’insistance distributive sur chaque individu sans la lourdeur de « chacun de la nation ».
- source_word: μιερῶν ... τροφῶν
  choice: des aliments qui rendaient impur
  rationale: Cette expression communique la souillure rituelle et religieuse impliquée par μιερός, sans réduire le terme à une simple qualité matérielle des aliments.
- source_word: ἀπογευομένους
  choice: à goûter
  rationale: Le participe s’intègre à la contrainte exercée sur chaque personne; la coordination française rend clairement la succession des actes imposés.
- source_word: ἐξόμνυσθαι
  choice: à renier sous serment
  rationale: ἐξόμνυμι comporte ici une forte nuance de désaveu juré; la rendre dans le texte principal préserve cet élément lexical que le simple « renier » pourrait perdre.
- source_word: τὸν Ἰουδαϊσμόν
  choice: le judaïsme
  rationale: Équivalent direct qui maintient ensemble l’appartenance religieuse, les pratiques et le mode de vie juifs sans réduire le terme à une seule dimension.
theological_decisions:
- issue: Portée de τὸν Ἰουδαϊσμόν
  choice: le judaïsme
  alternative: la manière de vivre juive
  rationale: « Le judaïsme » reste lexicalement transparent et ne limite pas l’apostasie forcée aux seules croyances ni à la seule identité ethnique.
- issue: Nuance de serment dans ἐξόμνυσθαι
  choice: renier sous serment
  alternative: renier
  rationale: Le composé verbal peut exprimer un désaveu accompagné d’un serment. Cette nuance est suffisamment probable pour figurer dans le texte, tandis que la note signale la traduction plus générale.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la relation causale, l’action coercitive personnelle du souverain et la progression entre profanation alimentaire et reniement. Le singulier collectif « la torture » est plus naturel en français que « les tortures ».
