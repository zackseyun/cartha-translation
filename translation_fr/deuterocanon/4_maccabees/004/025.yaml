revisions:
- from: Puisque donc le peuple méprisait ses décrets, lui-même contraignait par la torture chaque membre de la nation à goûter des aliments qui rendaient impur, puis à renier sous serment[a] le judaïsme.
  to: Ainsi, puisque le peuple méprisait ses décrets, il contraignait lui-même, par la torture, chacun de ce peuple, après lui avoir fait goûter des aliments impurs, à renier[a] le judaïsme.
  rationale: La révision rend le participe grec par une circonstance temporelle et maintient « renier » comme sens principal d’un verbe dont la nuance juratoire reste possible. Elle améliore également la fluidité française et remplace une périphrase causale par « aliments impurs », qui exprime naturellement la souillure rituelle en jeu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:03:15Z'
review_pass:
  verdict: revise
  source_fidelity: La phrase grecque présente ἀπογευομένους (« après avoir goûté / ayant goûté ») comme un participe circonstanciel lié aux personnes que le souverain contraignait à ἐξόμνυσθαι (« renier / abjurer »). La coordination française « à goûter…, puis à renier » transforme ce rapport en deux infinitifs également régis et ajoute une succession explicite. « Après leur avoir fait goûter » restitue clairement la coercition implicite dans le contexte sans modifier l’objet direct de ἠνάγκαζεν. La nuance de serment de ἐξόμνυσθαι demeure possible, mais n’est pas assez certaine pour être imposée dans le texte principal.
  naturalness: « Puisque donc » est possible mais moins fluide que « Ainsi, puisque ». « Chacun de ce peuple » est naturel et rend l’insistance distributive sans le ton administratif de « chaque membre de la nation ». « Des aliments impurs » est idiomatique et conserve le sens rituel de μιερός; « des aliments qui rendaient impur » est plus lourd et fait porter inutilement l’accent sur un effet causal.
  terminology: « Décrets » rend bien δόγματα dans ce contexte politique, et « le judaïsme » est l’équivalent transparent de τὸν Ἰουδαϊσμόν. « Impurs » convient ici au caractère rituellement souillant des aliments. La note doit présenter « renier sous serment » comme l’alternative, non l’inverse.
  issues:
  - severity: medium
    issue: La construction « à goûter…, puis à renier » ne reflète pas précisément le participe ἀπογευομένους.
    rationale: Le grec n’emploie qu’un infinitif explicite, ἐξόμνυσθαι; le fait de goûter est circonstanciel. Une formulation avec « après leur avoir fait goûter » évite de restructurer la syntaxe et la relation entre les actes.
  - severity: medium
    issue: La nuance « sous serment » est affirmée dans le texte principal alors qu’elle est lexiquement possible mais discutée.
    rationale: Pour préserver l’ambiguïté du composé ἐξόμνυσθαι, « renier » doit rester dans le texte, avec la nuance juratoire en note.
  - severity: low
    issue: La note inverse le rapport entre la traduction principale et l’alternative.
    rationale: Elle introduit « renier le judaïsme » comme alternative alors que cette formulation n’est pas celle du texte principal actuel.
  revised_text: Ainsi, puisque le peuple méprisait ses décrets, il contraignait lui-même, par la torture, chacun de ce peuple, après lui avoir fait goûter des aliments impurs, à renier[a] le judaïsme.
  revised_footnotes:
  - marker: a
    text: Ou « à renier sous serment le judaïsme ». Le verbe grec peut comporter la nuance d’un désaveu formulé sous serment.
    reason: lexical_alternative
