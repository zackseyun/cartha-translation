translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque a été divisée en deux pour éviter une apposition finale lourde et rendre sans ambiguïté la description d’Antiochos. Le point-virgule final de l’extrait source est rendu par une ponctuation française complète, sans préjuger de la continuité du contexte.
