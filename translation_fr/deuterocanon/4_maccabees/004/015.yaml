  yaml_path: translation/deuterocanon/4_maccabees/004/015.yaml
  text: When Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
translation:
  language: fr
  text: Après la mort du roi Séleucos, son fils Antiochos Épiphane lui succéda au pouvoir. C’était un homme arrogant et redoutable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arrogant et terrifiant ». Le mot grec traduit par « redoutable » peut aussi signifier « terrible » ou « effrayant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τελευτήσαντος δὲ Σελεύκου τοῦ βασιλέως
  choice: Après la mort du roi Séleucos
  rationale: Le génitif absolu aoriste exprime une action antérieure. Cette tournure française restitue naturellement la relation temporelle; δέ assure ici une transition légère qu’il n’est pas nécessaire de rendre par un marqueur autonome.
- source_word: διάδεχεται
  choice: lui succéda
  rationale: Le verbe désigne l’accession par succession. Le passé simple convient au registre narratif et le pronom « lui » explicite naturellement que le fils succède à son père.
- source_word: τὴν ἀρχήν
  choice: au pouvoir
  rationale: Dans ce contexte, ἀρχή désigne l’autorité souveraine ou le gouvernement. « Au pouvoir » est idiomatique et n’impose pas le sens plus précis de « royaume ».
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Antiochos Épiphane
  rationale: Les formes françaises établies des noms et de l’épithète historiques sont employées plutôt qu’une traduction littérale de Ἐπιφανής.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le nom grec est explicitement masculin et introduit la caractérisation d’Antiochos.
- source_word: ὑπερήφανος
  choice: arrogant
  rationale: Dans cette caractérisation défavorable, « arrogant » exprime plus clairement le sens négatif de hauteur orgueilleuse que le français moderne « fier », potentiellement positif.
- source_word: δεινός
  choice: redoutable
  rationale: Le mot peut signifier terrible, effrayant, dangereux ou impressionnant. « Redoutable » conserve sa portée menaçante sans la réduire à une seule nuance.
