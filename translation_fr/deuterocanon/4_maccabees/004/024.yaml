  text: so that even women[a], because they had circumcised their children, were thrown down headlong with their infants, though they knew beforehand that they would suffer this.
translation:
  language: fr
  text: si bien que même des femmes, parce qu’elles avaient circoncis leurs enfants, furent précipitées[a] avec leurs nourrissons, tout en sachant d’avance qu’elles subiraient ce sort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent jetées violemment vers le bas ». Le verbe grec évoque le fait de précipiter violemment quelqu’un depuis une hauteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit le résultat de ce qui précède et conserve la valeur consécutive de la conjonction.
- source_word: γυναῖκας
  choice: des femmes
  rationale: Désigne directement les femmes concernées; le contexte indique qu’il s’agit de mères, sans que le grec emploie ce terme.
- source_word: ὅτι
  choice: parce que
  rationale: 'Exprime ici la cause de leur supplice: elles avaient fait circoncire leurs enfants.'
- source_word: περιέτεμον τὰ παιδία
  choice: elles avaient circoncis leurs enfants
  rationale: Le plus-que-parfait marque naturellement en français l’acte antérieur qui motive le supplice; «enfants» ne précise pas le sexe au-delà du grec.
- source_word: μετὰ τῶν βρεφῶν
  choice: avec leurs nourrissons
  rationale: βρέφη désigne de très jeunes enfants; le possessif est clairement impliqué par le contexte.
- source_word: κατακρημνίζεσθαι
  choice: furent précipitées
  rationale: Le verbe exprime une projection violente vers le bas, vraisemblablement depuis une hauteur, sans que le texte précise le lieu.
- source_word: προειδυίας
  choice: tout en sachant d’avance
  rationale: Le participe se rapporte aux femmes et souligne qu’elles connaissaient préalablement la conséquence de leur acte, sans imposer une valeur concessive plus forte que la forme grecque.
- source_word: τοῦτο πείσονται
  choice: qu’elles subiraient ce sort
  rationale: πάσχω signifie ici subir ou éprouver; «ce sort» renvoie naturellement au supplice annoncé.
theological_decisions:
- issue: Contexte religieux et historique de la circoncision sous la persécution
  choice: Traduire directement «avaient circoncis leurs enfants».
  alternative: «avaient marqué leurs enfants du signe de l’alliance»
  rationale: La formulation directe préserve le lien explicite entre la pratique juive de la circoncision et la persécution, sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. «Furent précipitées» conserve la violence et le mouvement descendant du grec; la note explicite l’image possible de l’escarpement. Le marqueur [a] est placé après le groupe verbal concerné.
