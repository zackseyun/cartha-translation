  verdict: revise
  source_fidelity: La traduction rend correctement la condamnation de Simon, l’autorité royale, le but de la venue et la notion de fonds privés. Toutefois, « déposés dans » ajoute au texte grec une relation de dépôt qui n’est pas explicitement exprimée par le génitif τοῦ γαζοφυλακίου. Il convient de conserver « du trésor », formulation qui préserve l’ambiguïté de la relation.
  naturalness: Le français est globalement naturel et de registre narratif soutenu. « Une armée extrêmement redoutable » est plus direct et idiomatique que « une armée des plus redoutables », tout en conservant la portée métaphorique de βαρυτάτου.
  terminology: « Simon le maudit », « sur les ordres du roi », « fonds privés » et « trésor » sont appropriés. « Trésor » ne doit pas être précisé comme trésor du Temple dans le texte principal, puisque le grec ne le dit pas ici.
