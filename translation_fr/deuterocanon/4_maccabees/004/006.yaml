    rationale: Le grec dit littéralement « les fonds privés du trésor ». Le génitif peut certes évoquer des fonds conservés dans un trésor, mais « déposés » explicite une modalité qui n’est pas formulée dans le verset et réduit l’ambiguïté à préserver.
  - severity: low
