  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
translation:
  language: fr
  text: avec Simon le maudit et une armée extrêmement redoutable[a]. S’étant avancé, il déclara être venu sur les ordres du roi afin de prendre les fonds privés du trésor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une armée extrêmement nombreuse » ou « une force des plus imposantes ». Le grec qualifie littéralement l’armée de « très lourde », image pouvant évoquer sa puissance, son caractère oppressif ou son importance.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner des fonds privés conservés dans le trésor, et non nécessairement l’ensemble des biens du trésor.
    reason: cultural_note
lexical_decisions:
- source_word: καταράτου
  choice: le maudit
  rationale: L’adjectif exprime une forte condamnation et désigne celui qui est sous une malédiction ou digne d’être maudit.
- source_word: βαρυτάτου στρατοῦ
  choice: une armée des plus redoutables
  rationale: Le superlatif de βαρύς appliqué à στρατός évoque métaphoriquement une force militaire pesante, oppressive ou formidable. « Redoutable » conserve cette portée sans produire le calque peu naturel « très lourde ».
- source_word: προσελθών
  choice: S’étant avancé
  rationale: Le participe aoriste indique une démarche d’approche antérieure ou concomitante à la déclaration.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: sur les ordres du roi
  rationale: Le datif indique ici l’autorité ou le motif de sa venue; cette formulation est naturelle en français administratif et narratif.
- source_word: ἥκειν ἔλεγεν
  choice: il déclara être venu
  rationale: L’infinitif en discours indirect après ἔλεγεν exprime ce qu’il affirmait au sujet de sa venue et de sa présence.
- source_word: ὅπως ... λάβοι
  choice: afin de prendre
  rationale: ὅπως avec le subjonctif introduit le but; « afin de » restitue clairement cette valeur.
- source_word: τὰ ἰδιωτικὰ ... χρήματα
  choice: les fonds privés
  rationale: ἰδιωτικός oppose ces sommes aux biens publics ou sacrés, tandis que χρήματα désigne ici de l’argent ou des fonds.
- source_word: τοῦ γαζοφυλακίου
  choice: déposés dans le trésor
  rationale: Le génitif peut être rendu naturellement comme indiquant les fonds se trouvant dans le trésor. « Déposés » explicite sobrement la relation sans identifier ces fonds au trésor tout entier.
theological_decisions:
- issue: Faut-il préciser qu’il s’agit du trésor du Temple ?
  choice: le trésor
  alternative: le trésor du Temple
  rationale: Le contexte général concerne le Temple de Jérusalem, mais γαζοφυλάκιον ne comporte pas ici cette précision. Le texte principal conserve donc l’expression non spécifiée.
- issue: Relation entre les fonds privés et le trésor
  choice: les fonds privés déposés dans le trésor
  alternative: les fonds privés du trésor
  rationale: Cette formulation rend explicite que les sommes privées sont conservées dans le trésor, plutôt que de suggérer qu’elles appartiennent nécessairement à celui-ci; la note maintient la prudence interprétative.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste soutenue sans archaïsme. « Armée des plus redoutables » préserve la métaphore de poids sous une forme idiomatique; « trésor » demeure non spécifié conformément au grec.
