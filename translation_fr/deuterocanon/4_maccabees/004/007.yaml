  text: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
translation:
  language: fr
  text: Alors que le peuple s’indignait de ce projet et s’y opposait, on jugeait tout à fait terrible que ceux qui avaient confié leurs biens en dépôt au trésor sacré[a] en soient privés, puisque[b]
  philosophy: optimal-equivalence
