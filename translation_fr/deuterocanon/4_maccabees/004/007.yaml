review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : réaction hostile de la population, jugement quant à la gravité d’une dépossession, et causalité laissée volontairement en suspens. Toutefois, le génitif absolu grec distingue grammaticalement « le peuple » du sujet pluriel sous-entendu de νομίσαντες. La formulation française actuelle (« le peuple …, ils estimèrent ») crée un antécédent ambigu et une rupture de construction. Une tournure impersonnelle conserve l’indétermination du sujet sans lui attribuer indûment le jugement.'
  naturalness: Le registre est moderne et approprié, mais « Comme le peuple …, ils estimèrent » est peu naturel en français soutenu, car « ils » n’a pas d’antécédent grammatical clair. « Alors que …, on jugeait » rend la phrase lisible tout en préservant l’absence d’identification explicite du sujet principal. « Biens … confiés en dépôt » est également plus idiomatique et plus explicite que « confié leurs dépôts ».
  terminology: « Peuple », « projet », « trésor sacré » et « privés » sont des choix recevables. « Trésor sacré » traduit directement ἱερῷ θησαυρῷ sans imposer « Temple » dans le corps du texte. La note culturelle doit signaler que l’identification au trésor du sanctuaire relève du contexte, plutôt que de présenter Jérusalem comme une précision contenue dans l’expression grecque elle-même.
  issues:
  - severity: medium
    issue: Antécédent ambigu de « ils »
    rationale: Le grec emploie un génitif absolu pour « le peuple » puis un participe nominatif pluriel sans sujet exprimé. Faire suivre « le peuple » de « ils estimèrent » suggère en français, sans l’établir grammaticalement, que le peuple est le sujet du jugement. Une formulation impersonnelle préserve l’ambiguïté textuelle.
  - severity: low
    issue: Note a formulée comme une identification directe
    rationale: « Trésor du sanctuaire de Jérusalem » est contextuallement plausible, mais τῷ ἱερῷ θησαυρῷ signifie littéralement « au trésor sacré ». La note doit distinguer le libellé grec de l’éclairage contextuel.
