lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: le peuple
  rationale: Dans ce contexte, ἔθνος désigne collectivement la population juive. « Le peuple » est plus naturel en français actuel que « la nation », sans introduire l’idée de peuples non juifs.
- source_word: πρὸς τὸν λόγον
  choice: de ce projet
  rationale: λόγος peut désigner une parole, une affaire ou une proposition. Ici, il s’agit du projet concernant les fonds conservés dans le trésor du sanctuaire.
- source_word: σχετλιάζοντος
  choice: s’indignait
  rationale: Le verbe exprime une vive indignation. « S’indignait » restitue cette réaction avec dignité et naturel, sans exagération ajoutée.
- source_word: ἀντιλέγοντός τε
  choice: et s’y opposait
  rationale: ἀντιλέγω signifie parler contre ou s’opposer. Le pronom « y » reprend clairement le projet et évite une tournure lourde.
- source_word: πάνδεινον εἶναι νομίσαντες
  choice: ils estimèrent qu’il serait absolument terrible
  rationale: πάνδεινον renforce fortement δεινός, tandis que νομίσαντες exprime un jugement. Cette formulation conserve à la fois l’intensité et le discours indirect.
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: ceux qui avaient confié leurs dépôts
  rationale: παρακαταθήκη désigne un bien remis en dépôt pour être gardé, et πιστεύω construit ainsi signifie « confier ». La formulation préserve l’idée de confiance et de dépôt.
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: au trésor sacré
  rationale: ἱερός qualifie le trésor comme appartenant au domaine sacré. Le contexte indique le trésor du sanctuaire, mais la traduction garde la formulation du grec.
- source_word: στερηθήσονται
  choice: en soient privés
  rationale: Le passif de στερέω signifie être privé de quelque chose. « En soient privés » renvoie sans ambiguïté aux dépôts.
- source_word: ὡς
  choice: puisque
  rationale: ὡς introduit ici la justification qui se poursuit au verset suivant. « Puisque » rend ce lien tout en laissant volontairement la phrase en suspens.
theological_decisions:
- issue: Désignation du trésor lié au sanctuaire
  choice: trésor sacré
  alternative: trésor du Temple
  rationale: « Trésor sacré » traduit directement ἱερῷ θησαυρῷ et conserve la portée cultuelle du grec. « Trésor du Temple » expliciterait correctement le contexte, mais préciserait ce que le texte formule de manière plus générale.
translation_notes:
  register: Français international moderne, fluide et digne. Le mouvement de la longue phrase grecque est conservé, notamment sa conclusion suspendue. Les marqueurs de notes ont été placés sur les expressions qu’ils expliquent.
