  rationale: La révision résout la rupture d’antécédent en français sans identifier un sujet que le grec ne nomme pas dans cette proposition. Elle conserve l’intensité de πάνδεινον, le passif de στερηθήσονται et la suspension voulue après ὡς. La note sur le trésor est nuancée afin de ne pas confondre la formulation grecque et son contexte narratif.
