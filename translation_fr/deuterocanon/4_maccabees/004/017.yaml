  text: And he permitted him to serve as high priest and to lead the nation[a].
translation:
  language: fr
  text: Mais il lui permit d’exercer la fonction de grand prêtre et de diriger la nation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de gouverner la nation ». Le verbe grec peut désigner la direction exercée par un chef.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: permit
  rationale: Le verbe exprime ici l’autorisation accordée à quelqu’un d’exercer les deux fonctions mentionnées, sans imposer l’idée plus précise d’une nomination officielle.
- source_word: ἀρχιερασθαι
  choice: exercer la fonction de grand prêtre
  rationale: L’infinitif désigne l’exercice de la charge de grand prêtre. Cette formulation française rend la fonction, et non le simple port d’un titre.
- source_word: τοῦ ἔθνους
  choice: la nation
  rationale: Dans ce contexte juif, ἔθνος désigne le peuple considéré comme corps national et politique.
- source_word: ἀφηγεῖσθαι
  choice: diriger
  rationale: Le verbe évoque la conduite exercée par un chef. « Diriger » conserve la dimension d’autorité sans durcir le sens jusqu’à « régner ».
theological_decisions:
- issue: Étendue de l’autorité qui lui est accordée
  choice: Une autorisation portant à la fois sur la fonction de grand prêtre et sur la direction de la nation
  alternative: 'Comprendre le second infinitif dans un sens plus explicitement politique : « gouverner la nation »'
  rationale: Les deux infinitifs grecs dépendent du même verbe d’autorisation. La traduction conserve côte à côte les dimensions religieuse et civique sans préciser davantage la nature du pouvoir politique.
translation_notes:
  register: Français moderne, international et digne. « Exercer la fonction de grand prêtre » est clair pour un large lectorat; « diriger la nation » préserve la portée civique du grec tout en laissant en note l’équivalent plus politique « gouverner ».
