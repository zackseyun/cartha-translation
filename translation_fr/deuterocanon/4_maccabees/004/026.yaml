base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: fr
  text: Ainsi, puisque le peuple méprisait ses décrets, lui-même contraignait, par des tortures, chacun des membres de la nation, après leur avoir fait goûter des aliments impurs[a], à renier le judaïsme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des aliments souillés » ou « des aliments qui souillent ». Le terme grec souligne la souillure rituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « à abjurer le judaïsme ». Le verbe grec peut évoquer un reniement formulé sous serment.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: décrets
  rationale: Le terme désigne ici les décisions officielles et contraignantes du souverain.
- source_word: κατεφρονεῖτο
  choice: étaient méprisés
  rationale: L’imparfait passif exprime un rejet continu teinté de mépris, plus fort qu’une simple désobéissance.
- source_word: διὰ βασάνων
  choice: par la torture
  rationale: La locution indique le moyen coercitif employé; le singulier collectif est naturel en français.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: chaque membre de la nation
  rationale: Cette formulation française restitue l’insistance distributive sans lourdeur et conserve la dimension nationale de ἔθνος.
- source_word: μιερῶν ... τροφῶν
  choice: des aliments qui rendaient impur
  rationale: Cette expression rend clairement la souillure rituelle impliquée par μιερός sans réduire le sens à une catégorie alimentaire technique.
- source_word: ἀπογευομένους
  choice: après lui avoir fait goûter
  rationale: Le participe se rapporte aux personnes contraintes et marque une action antérieure au reniement; la tournure causative explicite naturellement que le souverain les forçait à goûter ces aliments.
- source_word: ἐξόμνυσθαι
  choice: à renier
  rationale: Le verbe exprime une répudiation solennelle, possiblement sous serment; « renier » est actuel et convient à l’objet « le judaïsme ».
- source_word: τὸν Ἰουδαϊσμόν
  choice: le judaïsme
  rationale: Le terme conserve l’ampleur du grec, qui englobe religion, pratiques et identité communautaire.
theological_decisions:
- issue: Portée de τὸν Ἰουδαϊσμόν
  choice: le judaïsme
  alternative: la religion juive / le mode de vie juif
  rationale: « Le judaïsme » évite de réduire le terme soit à la seule religion, soit aux seules pratiques, et préserve son ampleur identitaire et communautaire.
- issue: Force de μιερῶν τροφῶν
  choice: des aliments qui rendaient impur
  alternative: des aliments impurs / souillés
  rationale: La formulation retenue met en évidence l’effet de souillure rituelle sans imposer une terminologie confessionnelle ou trop technique.
- issue: Force de ἐξόμνυσθαι
  choice: à renier
  alternative: à abjurer sous serment
  rationale: Le texte principal conserve une expression française naturelle, tandis que la note signale la possible nuance de serment sans la surdéterminer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée pour lever l’ambiguïté française sur l’auteur de l’action de goûter, tout en gardant l’insistance sur la coercition individuelle et la séquence des actes.
