revisions:
- from: Puisque donc ses décrets étaient méprisés par le peuple, il contraignait lui-même, par la torture, chaque membre de la nation, après lui avoir fait goûter des aliments qui rendaient impur[a], à renier le judaïsme[b].
  to: Ainsi, puisque le peuple méprisait ses décrets, lui-même contraignait, par des tortures, chacun des membres de la nation, après leur avoir fait goûter des aliments impurs[a], à renier le judaïsme[b].
  rationale: La révision corrige l’accord défectueux, améliore l’idiomaticité française et restitue plus explicitement le pluriel de « tortures » ainsi que la distributivité du grec. Les ancres de notes restent placées sur les expressions concernées, et la note a conserve l’alternative qui souligne la force rituelle de μιερός.
