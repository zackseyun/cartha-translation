  text: He also sought out the nation and led it into every kind of lawlessness[a].
translation:
  language: fr
  text: Il rechercha aussi la nation[a] et l’entraîna dans toutes sortes de comportements contraires à la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit la nation pour cible ». Le verbe grec exprime une recherche active et déterminée; dans ce contexte, elle peut avoir une portée hostile.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut évoquer le fait d’amener un peuple à adopter une certaine manière de vivre ou de se conduire, et non seulement de le pousser à des actes isolés.
    reason: lexical_explanation
lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: prit … pour cible
  rationale: Le verbe composé exprime une recherche active et déterminée. Dans ce contexte hostile, « prendre pour cible » donne un sens naturel en français sans préciser une forme particulière de persécution.
- source_word: τὸ ἔθνος
  choice: la nation
  rationale: Le singulier collectif garde la dimension à la fois ethnique et politique du grec, sans ajouter « juive », qui reste implicite dans le contexte.
- source_word: ἐξεπολίτευσεν
  choice: lui fit adopter un mode de vie
  rationale: Formé sur πολιτεύω, le verbe touche à la conduite collective ou à la manière de vivre en société. Cette tournure française rend sa valeur causative sans le réduire à des actes isolés.
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: fait de toutes sortes de pratiques contraires à la Loi
  rationale: παρανομία désigne ce qui enfreint la loi; dans ce contexte juif, la majuscule à « Loi » laisse percevoir la Loi ancestrale. « Toutes sortes de pratiques » rend la portée étendue de πᾶσαν dans un français naturel.
theological_decisions:
- issue: Portée de παρανομία dans le contexte de la Loi juive
  choice: pratiques contraires à la Loi
  alternative: mépris de toute loi
  rationale: Le choix conserve le lien probable avec la Loi ancestrale sans préciser des commandements particuliers ni réduire le terme à une notion générale de criminalité.
- issue: Nature de l’action exprimée par ἐξεπολίτευσεν
  choice: imposition d’un mode de vie collectif
  alternative: incitation à commettre des actes illégaux isolés
  rationale: La formation du verbe sur πολιτεύω suggère une transformation de la conduite publique ou du mode de vie; la traduction garde cette dimension sociale sans introduire une théorie politique particulière.
translation_notes:
  register: Français international actuel, digne et accessible. « Mode de vie » restitue naturellement la dimension collective du verbe grec; « pratiques contraires à la Loi » maintient son ancrage juif sans explicitation confessionnelle.
