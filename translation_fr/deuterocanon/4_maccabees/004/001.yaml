  register: Français international moderne, narratif et digne. La longue période grecque est divisée en deux phrases pour assurer la clarté, sans supprimer les liens logiques. Les pronoms sont explicités lorsque nécessaire afin d’éviter toute confusion entre Simon et Onias.
