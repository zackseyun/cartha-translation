  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: fr
  text: En effet, un certain Simon, qui s’opposait à Onias — un homme noble et bon, qui avait autrefois exercé à vie la charge de grand prêtre —, ne parvenant pas, malgré toutes les calomnies qu’il proférait contre lui, à lui nuire dans les affaires de la nation[a], s’en alla en fugitif[b], avec l’intention de trahir sa patrie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se comprendre « à propos de la nation » ou, éventuellement, « en faveur de la nation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en exilé » ; le grec φυγάς peut désigner soit une personne bannie ou exilée, soit une personne en fuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: s’opposait à
  rationale: Le verbe exprime une opposition active, probablement teintée de rivalité politique. Cette formulation reste naturelle sans imposer un sens institutionnel trop précis.
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: qui avait autrefois exercé la fonction de grand prêtre à vie
  rationale: « Autrefois » rend ποτε, tandis que « à vie » conserve explicitement la durée attachée à l’exercice de la grande prêtrise.
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: un homme noble et bon
  rationale: Cette formule garde le caractère élogieux et moral du doublet grec dans un français digne et accessible.
- source_word: διαβάλων
  choice: malgré toutes ses calomnies
  rationale: διαβάλλω désigne ici des accusations malveillantes ou diffamatoires. La tournure française exprime à la fois leur caractère répété et leur inefficacité.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: dans les affaires concernant la nation
  rationale: La valeur exacte de ὑπέρ est délicate dans ce contexte. Cette traduction situe le tort recherché dans la sphère des affaires nationales sans affirmer que Simon agissait au bénéfice de la nation.
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: il ne parvenait pas à lui nuire
  rationale: La construction exprime l’incapacité de Simon à faire du mal à Onias; cette formulation est idiomatique en français.
- source_word: φυγὰς ᾤχετο
  choice: il quitta le pays en fugitif
  rationale: φυγάς peut désigner aussi bien un fugitif qu’un exilé. « En fugitif » préserve ici l’idée d’une fuite, tandis que la note signale l’autre possibilité.
- source_word: τὴν πατρίδα προδώσων
  choice: avec l’intention de trahir sa patrie
  rationale: Le participe futur exprime le but ou l’intention. « Patrie » conserve la résonance ancestrale et civique de πατρίς.
