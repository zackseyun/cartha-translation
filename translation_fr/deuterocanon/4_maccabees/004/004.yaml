lexical_decisions:
- source_word: τούτων ἕκαστα
  choice: chacun de ces faits
  rationale: Cette formulation conserve la valeur distributive de ἕκαστα avec le génitif τούτων et convient naturellement à un récit.
- source_word: γνούς
  choice: après avoir appris
  rationale: Le participe aoriste exprime une circonstance antérieure aux actions principales; cette tournure la rend clairement en français.
- source_word: κηδεμονίας
  choice: dévouement
  rationale: Dans l’expression εἰς τὸν βασιλέα, le mot désigne ici une sollicitude ou un attachement affiché envers le roi. « Dévouement » reste naturel sans imposer le sens technique de tutelle.
- source_word: ἐπαινεί
  choice: félicita
  rationale: Le présent historique grec est rendu par le passé simple, adapté à une narration littéraire française; « félicita » exprime l’approbation adressée à Simon.
- source_word: ἀναβὰς
  choice: se rendit auprès de
  rationale: Bien que le verbe signifie littéralement « monter », il sert couramment à évoquer un déplacement. En l’absence d’un repère géographique explicite dans le verset, cette formulation française évite une lourdeur.
- source_word: κατήμηνυε
  choice: lui signala l’existence de
  rationale: Le verbe peut signifier informer, signaler ou dénoncer. La formulation retenue garde l’idée d’une révélation faite à Séleucos sans accentuer indûment la nuance accusatrice.
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: le trésor où étaient déposées les richesses
  rationale: Cette expression rend θησαυρός comme un dépôt ou trésor et χρήματα comme des biens ou richesses, tout en restant claire en français courant.
- source_word: ὁ Ἀπολλώνιος
  choice: Apollonios
  rationale: Translittération française usuelle du nom grec.
- source_word: Σίμωνι
  choice: Simon
  rationale: Forme française traditionnelle et courante du nom.
- source_word: Σέλευκον
  choice: Séleucos
  rationale: Translittération française usuelle du nom grec.
