base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: fr
  text: Alors Apollonius, tombé à demi-mort sur le parvis inerte du sanctuaire[a], tendait les mains vers le ciel et suppliait avec larmes les Hébreux de prier pour lui, afin qu’ils apaisent l’armée céleste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enceinte du sanctuaire ». Le terme grec désigne un espace sacré délimité.
    reason: lexical_alternative
  - marker: b
    text: Ou « la troupe céleste » ou « l’armée du ciel ». Le grec ne précise pas exactement qui cette expression désigne.
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν
  choice: tombé
  rationale: Le participe aoriste marque une chute antérieure à la supplication; « tombé » restitue simplement cette succession.
- source_word: ἡμιθανὴς
  choice: à demi mort
  rationale: Rend de près le composé grec tout en conservant son expression vive.
- source_word: ἄψυχον
  choice: inerte
  rationale: Le mot signifie littéralement « sans vie »; « inerte » convient à un espace matériel et maintient le contraste avec Apollonios mourant.
- source_word: τοῦ ἱεροῦ περίβολον
  choice: le parvis du sanctuaire
  rationale: περίβολος désigne ici l’espace délimité de l’ensemble sacré; « parvis » est naturel en français, tandis que la note conserve l’alternative plus formelle « enceinte ».
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανὸν
  choice: tendait les mains vers le ciel
  rationale: Expression française naturelle qui conserve le geste et sa direction.
- source_word: μετὰ δακρύων ... παρεκάλει
  choice: suppliait avec larmes
  rationale: Le contexte appelle un verbe de supplication intense; « avec larmes » garde la sobriété et la dignité du grec.
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: de prier pour lui
  rationale: Bien que περὶ αὐτοῦ signifie littéralement « à son sujet », la construction exprime ici naturellement une prière d’intercession en sa faveur.
- source_word: ἐξευμενίσωνται
  choice: afin qu’ils apaisent
  rationale: Le verbe signifie rendre favorable ou apaiser; ce choix évite d’introduire un vocabulaire doctrinal technique.
- source_word: τὸν ἐπουράνιον ... στρατόν
  choice: l’armée céleste
  rationale: στρατός signifie « armée » ou « troupe »; cette traduction reste proche du grec sans identifier plus précisément son référent.
theological_decisions:
- issue: Référent de « l’armée céleste »
  choice: Conserver l’expression collective sans préciser s’il s’agit d’êtres angéliques, d’une puissance céleste ou d’une désignation révérencielle de Dieu.
  alternative: Identifier explicitement les anges ou Dieu.
  rationale: Le grec ne précise pas davantage le référent; la traduction maintient donc son ambiguïté théologique.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve l’image frappante du mourant étendu sur un parvis « inerte », ainsi que l’indétermination du référent céleste.
