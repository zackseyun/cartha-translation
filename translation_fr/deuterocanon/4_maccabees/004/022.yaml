  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: fr
  text: 'Après les avoir dévastés[a], il promulgua un décret : s’il apparaissait que certains d’entre eux vivaient conformément à la loi de leurs ancêtres, ils seraient mis à mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soumis » ou « pillés ».
    reason: Le verbe grec peut désigner aussi bien le ravage ou le pillage d’un territoire que sa réduction par la force.
lexical_decisions:
- source_word: ἐπόρθησεν
  choice: avait dévastés
  rationale: Le verbe évoque une conquête violente pouvant aller jusqu’au ravage ou au pillage. « Dévaster » conserve cette force, que « soumettre » atténuerait.
- source_word: δόγμα ἔθετο
  choice: promulgua un décret
  rationale: Cette tournure désigne l’établissement officiel d’une décision ayant force d’autorité ; « promulguer un décret » est naturel en français moderne.
- source_word: φαίνοιεν
  choice: s’il apparaissait que
  rationale: Le verbe signifie littéralement « apparaître, se montrer ». Cette formulation préserve sa nuance probatoire sans imposer le sens plus précis d’une arrestation en flagrant délit.
- source_word: πολιτευόμενοι
  choice: vivaient conformément à
  rationale: Le participe décrit une manière durable de se conduire ou d’organiser sa vie selon une norme. Cette traduction rend clairement ce sens sans conserver artificiellement la coloration civique du verbe grec.
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: à la loi de leurs ancêtres
  rationale: πάτριος désigne ce qui est hérité des pères ou des ancêtres. La formulation exprime le caractère transmis de cette loi sans introduire de terminologie confessionnelle ultérieure.
- source_word: θάνοιεν
  choice: ils seraient mis à mort
  rationale: Le verbe signifie formellement « mourir », mais, dans un décret prescrivant une peine, le français exprime naturellement la mise à mort imposée par l’autorité.
theological_decisions:
- issue: Désignation de la loi juive héritée (πατρίῳ νόμῳ)
  choice: la loi de leurs ancêtres
  alternative: la loi ancestrale
  rationale: Cette expression garde le lien explicite avec les générations antérieures et l’identité religieuse transmise, sans importer une interprétation doctrinale particulière.
- issue: Valeur pénale de θάνοιεν
  choice: ils seraient mis à mort
  alternative: ils mourraient
  rationale: Le contexte d’un décret royal indique une peine infligée. La traduction rend cette implication contextuelle tout en évitant de préciser un mode d’exécution absent du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe juridique demeure claire, tandis que « s’il apparaissait que » conserve l’ambiguïté du grec entre visibilité publique et constat administratif.
