  text: while the priests[a], with women and children, were in the temple imploring God to defend the place that was being treated with contempt,
translation:
  language: fr
  text: tandis que les prêtres, avec des femmes et des enfants, suppliaient Dieu dans le Temple de défendre ce lieu qu’on traitait avec mépris[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce lieu méprisé » ou « ce lieu déshonoré ». L’expression grecque présente le lieu sacré comme objet de mépris.
    reason: Alternative lexicale et préservation de la nuance du participe passif grec.
lexical_decisions:
- source_word: τῶν δὲ ἱερέων
  choice: tandis que les prêtres
  rationale: Le génitif absolu présente une action d’arrière-plan, et δέ marque ici une transition légère. « Tandis que » rend naturellement cette relation sans introduire un contraste appuyé.
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: avec des femmes et des enfants
  rationale: Le grec ne précise pas que les femmes étaient les épouses des prêtres; la traduction évite donc d’ajouter un lien familial absent du texte.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne couramment l’ensemble du complexe du Temple. La majuscule signale ici le Temple de Jérusalem sans restreindre le sens au sanctuaire intérieur.
- source_word: ἱκετευόντων
  choice: suppliaient
  rationale: Le verbe exprime une demande pressante et fervente; « suppliaient » est à la fois naturel, digne et précis.
- source_word: ὑπερασπίσαι
  choice: de défendre
  rationale: 'L’infinitif exprime l’action demandée à Dieu: prendre la défense du lieu menacé.'
- source_word: τοῦ καταφρονουμένου τόπου
  choice: ce lieu qu’on traitait avec mépris
  rationale: Le participe passif indique que le lieu subissait le mépris. Cette formulation conserve l’action en cours et évite de réduire le sens au seul état de « lieu méprisé ».
theological_decisions:
- issue: Référent de τόπος (« lieu »)
  choice: Le lieu renvoie probablement au site sacré du Temple menacé de profanation.
  alternative: La ville dans son ensemble, ou plus étroitement le sanctuaire intérieur.
  rationale: La mention immédiate des prêtres priant dans le Temple favorise le site du Temple comme référent, mais la traduction garde le mot général « lieu » afin de ne pas préciser au-delà du grec.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase demeure syntaxiquement ouverte par une virgule finale, conformément au caractère subordonné du verset grec dans son contexte. Le marqueur de note est placé après l’expression qu’il explique.
