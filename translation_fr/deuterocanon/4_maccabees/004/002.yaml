lexical_decisions:
- source_word: ὅθεν
  choice: donc
  rationale: Le terme introduit ici la conséquence de ce qui précède ; « donc » exprime naturellement ce lien en français.
- source_word: ἥκων πρὸς
  choice: se rendit auprès de
  rationale: Cette formulation française rend le mouvement vers Apollonios exprimé par le participe ἥκων et la préposition πρός, sans lourdeur participiale.
- source_word: στρατηγόν
  choice: gouverneur
  rationale: Dans ce contexte administratif, le titre désigne le responsable placé à la tête des territoires mentionnés ; « gouverneur » est clair et idiomatique.
- source_word: ἔλεγεν
  choice: lui dit
  rationale: L’imparfait grec introduit le discours qui suit. Le passé simple français est la tournure narrative naturelle pour ouvrir une citation, tandis que « lui » explicite le destinataire déjà exprimé en grec par le mouvement vers Apollonios.
