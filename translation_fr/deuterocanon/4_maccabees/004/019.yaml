  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
translation:
  language: fr
  text: si bien qu’il fit non seulement construire un gymnase sur la citadelle même de notre patrie[a], mais abolit aussi la tutelle du Temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur l’Acra même de notre patrie », si ἄκρα désigne ici spécifiquement la forteresse de Jérusalem appelée l’Acra.
    reason: alternative_reading
  - marker: b
    text: Ou « la garde » ou « l’administration du Temple ». Le grec parle de la suppression de sa tutelle protectrice ou administrative, non de la destruction du Temple lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit ici le résultat des actions précédentes et s’enchaîne naturellement en français.
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: non seulement… mais… aussi
  rationale: Reproduit la construction corrélative et son équilibre rhétorique.
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: dans la citadelle même
  rationale: ἄκρα désigne une citadelle ou hauteur fortifiée; « même » rend l’insistance de αὐτῇ. La préposition française « dans » convient naturellement à l’implantation d’un établissement au sein du site.
- source_word: τῆς πατρίδος ἡμῶν
  choice: de notre patrie
  rationale: « Patrie » conserve le sens de terre ancestrale et la tonalité collective de πατρίς dans un français actuel et digne.
- source_word: γυμνάσιον
  choice: gymnase
  rationale: Désigne l’institution hellénistique d’éducation et d’entraînement, et non une simple salle de sport moderne; le terme français maintient cette spécificité dans le contexte.
- source_word: κατασκευάσαι
  choice: fit construire
  rationale: Le causatif français rend naturellement l’infinitif dépendant du contexte et évite d’affirmer qu’il construisit personnellement l’édifice.
- source_word: καταλῦσαι
  choice: abolit
  rationale: Avec une institution ou charge pour objet, le verbe signifie supprimer ou abolir plutôt que détruire matériellement.
- source_word: κηδεμονίαν
  choice: tutelle
  rationale: Exprime une responsabilité officielle de garde, de protection et d’administration sans préciser davantage la structure institutionnelle.
- source_word: τοῦ ἱεροῦ
  choice: du Temple
  rationale: ἱερόν renvoie ici au Temple de Jérusalem; la majuscule signale ce référent historique précis sans ajouter de contenu doctrinal.
theological_decisions:
- issue: Valeur historique et cultuelle de ἄκρα à Jérusalem
  choice: Traduction descriptive par « citadelle »
  alternative: « Acra », comme nom propre de la forteresse de Jérusalem
  rationale: Le nom grec conserve son sens commun de citadelle, mais le contexte peut viser le site historiquement appelé l’Acra. Le texte principal reste immédiatement intelligible et la note préserve l’autre possibilité.
- issue: Portée de κηδεμονία τοῦ ἱεροῦ
  choice: « la tutelle du Temple », comprise comme sa garde ou son administration protectrice
  alternative: « la surveillance », « la garde » ou « l’administration du Temple »
  rationale: La formulation évite de faire de καταλῦσαι une destruction physique du Temple et ne définit pas plus précisément que le grec la fonction supprimée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Gymnase » est conservé comme terme historique hellénistique; la note implicite du contexte doit empêcher de le réduire au sens contemporain de salle de sport. Les deux marqueurs apparaissent dans le texte dans l’ordre [a], [b].
