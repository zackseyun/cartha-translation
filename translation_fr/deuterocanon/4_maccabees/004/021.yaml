  source_fidelity: 'La structure narrative et les référents sont bien rendus : la guerre contre Ptolémée se déroule en Égypte, la nouvelle de la mort supposée du personnage provoque la joie des habitants de Jérusalem, puis celui-ci marche contre eux. Toutefois, φήμη est lexicalement neutre et le grec ne qualifie pas explicitement cette information de « rumeur » ; le texte français doit préserver cette absence d’évaluation.'
  naturalness: Le français est fluide et d’un registre narratif moderne approprié. « Il apprit aussi » rend explicitement et naturellement la valeur connective de τε. « Nouvelle » est plus neutre et plus idiomatique ici que « rumeur ».
