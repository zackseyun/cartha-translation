  yaml_path: translation/deuterocanon/4_maccabees/004/021.yaml
  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
translation:
  language: fr
  text: En effet, pendant qu’il faisait la guerre à Ptolémée en Égypte, il apprit aussi qu’une nouvelle selon laquelle il était mort s’était répandue et que les habitants de Jérusalem s’en réjouissaient au plus haut point. Il marcha donc rapidement contre eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ γὰρ πολεμῶν ἦν
  choice: En effet, pendant qu’il faisait la guerre
  rationale: La tournure rend à la fois la valeur explicative de γάρ, le cadre temporel de ἐπειδή et l’action continue exprimée par la construction périphrastique πολεμῶν ἦν.
- source_word: κατʼ Αἴγυπτον Πτολεμαίῳ
  choice: à Ptolémée en Égypte
  rationale: Ptolémée est présenté comme l’adversaire personnel, tandis que κατʼ Αἴγυπτον indique naturellement le théâtre égyptien de la guerre.
- source_word: ἠκούσέν τε
  choice: il apprit
  rationale: Dans ce contexte, ἀκούω signifie recevoir une information. La liaison portée par τε est rendue naturellement par l’enchaînement de la phrase plutôt que par un « aussi » potentiellement artificiel.
- source_word: φήμης διαδοθείσης περὶ τοῦ τεθνάναι αὐτόν
  choice: qu’une rumeur annonçant sa mort s’était répandue
  rationale: φήμη peut désigner une nouvelle, un bruit ou une rumeur. « Rumeur » convient à l’annonce erronée de sa mort, tandis que le plus-que-parfait marque l’antériorité du génitif absolu.
- source_word: ὡς ἔνι μάλιστα χαίροιεν
  choice: s’en réjouissaient au plus haut point
  rationale: Cette formulation française naturelle conserve l’intensité superlative de l’expression ὡς ἔνι μάλιστα et la joie exprimée par χαίρω.
- source_word: οἱ Ἱεροσολυμεῖται
  choice: les habitants de Jérusalem
  rationale: Rend clairement le gentilé grec dans un français moderne et courant.
- source_word: ταχέως ἐπʼ αὐτοὺς ἀνέζευξεν
  choice: Il marcha donc rapidement contre eux
  rationale: ἀναζεύγνυμι est ici un terme de déplacement militaire; « marcha contre eux » conserve le caractère hostile de l’avancée, et « donc » explicite la conséquence narrative impliquée.
