  yaml_path: translation/deuterocanon/4_maccabees/004/020.yaml
  text: Because of these things[a], divine justice, having become indignant, made war against Antiochus himself.
translation:
  language: fr
  text: À cause de ces actes, la justice divine[a], saisie d’indignation, fit la guerre à Antiochos lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement divin » ou « le châtiment divin » ; le grec δίκη peut désigner la justice en action, la sanction judiciaire ou la rétribution.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: À cause de ces actes
  rationale: L’expression a ici une valeur causale et renvoie aux agissements précédemment rapportés. « Ces actes » rend ce renvoi de façon naturelle et précise.
- source_word: ἀγανακτήσασα
  choice: saisie d’indignation
  rationale: Le participe exprime une vive indignation et reste étroitement lié à l’action principale. Cette tournure préserve la personnification et le registre soutenu.
- source_word: ἡ θεία δίκη
  choice: la justice divine
  rationale: δίκη peut désigner la justice, le jugement ou la sanction rétributive. « La justice divine » conserve ici l’abstraction personnifiée sans l’identifier explicitement à Dieu ni la réduire à une simple peine.
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: Antiochos lui-même
  rationale: La formulation grecque met fortement Antiochos en relief. « Lui-même » restitue cette insistance avec naturel.
- source_word: ἐπολέμησεν
  choice: fit la guerre à
  rationale: Le verbe conserve une image guerrière forte. « Fit la guerre à » maintient la personnification active de la justice divine et la solennité du passage.
theological_decisions:
- issue: Personnification de δίκη
  choice: Présenter « la justice divine » comme un agent qui s’indigne et fait la guerre
  alternative: Traduire plus concrètement par « le châtiment divin » ou plus explicitement par « la justice de Dieu »
  rationale: Le grec personnifie δίκη sans la désigner directement comme Dieu. La traduction retenue préserve cette tension littéraire et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton élevé, la personnification et l’image guerrière du grec sans devenir artificiellement archaïque.
