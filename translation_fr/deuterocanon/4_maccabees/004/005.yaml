  text: and after taking authority over them[a], he quickly came into our homeland
translation:
  language: fr
  text: Après avoir obtenu l’autorité sur eux, il se rendit rapidement dans notre patrie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé de ce verset paraît incomplet : après « rapidement dans notre patrie », il ne comporte aucun verbe conjugué explicite. « Il se rendit » est ajouté pour rendre la proposition intelligible d’après le contexte.'
    reason: textual_variant
lexical_decisions:
- source_word: λαβὼν
  choice: Après avoir reçu
  rationale: Le participe aoriste marque ici une action antérieure au déplacement. « Après avoir reçu » rend naturellement cette succession et convient mieux à l’autorité conférée que « pris », sans exclure l’idée d’une prise de pouvoir.
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: autorité sur eux
  rationale: ἐξουσία désigne l’autorité, le pouvoir ou la compétence accordée; περὶ αὐτῶν indique ici les personnes sur lesquelles elle s’exerce.
- source_word: ταχὺ
  choice: rapidement
  rationale: L’adverbe exprime la rapidité sans imposer l’immédiateté plus forte que pourrait suggérer « aussitôt ».
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: dans notre patrie
  rationale: πατρίς désigne la terre ou le pays d’origine. « Notre patrie » conserve la nuance collective et affective du grec dans un registre français digne et naturel.
