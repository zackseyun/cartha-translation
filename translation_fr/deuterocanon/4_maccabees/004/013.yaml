review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « ne finisse par penser » ajoute une idée de processus ou d’aboutissement qui n’est pas exprimée par ποτέ (« un jour », « jamais/à quelque moment »). La révision restitue plus directement cette éventualité. « Tué » convient contextuellement pour ἀνηρῆσθαι.
  naturalness: La phrase révisée conserve une période soutenue mais lisible en français moderne. « Bien qu’il eût par ailleurs craint » rend naturellement la concession portant sur l’appréhension antérieure ou concomitante, sans l’ambiguïté un peu heurtée de « bien que, par ailleurs, il craignît ».
  terminology: « Grand prêtre », « justice divine », « Séleucos » et « Apollonios » sont appropriés. « À son sujet » préserve avec justesse l’ouverture de περὶ αὐτοῦ.
  issues:
  - severity: medium
    issue: « ne finisse par penser »
    rationale: ποτε indique qu’une telle pensée pourrait survenir « un jour » ; il n’implique pas que le roi en viendrait progressivement ou finalement à cette conclusion. La formulation ajoute donc une nuance non attestée.
