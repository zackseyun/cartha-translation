base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: fr
  text: Accablé par ces paroles, le grand prêtre Onias, bien qu’il eût par ailleurs craint que le roi Séleucos ne pense un jour qu’Apollonios avait été tué à la suite d’un complot humain, et non par la justice divine, fit une prière à son sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pria quelque chose à son sujet ». Le grec ne précise pas nettement si Onias pria pour Apollonios ou au sujet de l’affaire qui le concernait.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαχθεὶς τοῖς λόγοις
  choice: Accablé par ces paroles
  rationale: Le participe exprime le poids pénible des paroles précédentes. « Accablé » restitue cette détresse dans un français naturel, et le datif garde ici sa valeur causale.
- source_word: εὐλαβηθεὶς μὴ ποτε νομίσειεν
  choice: il craignît que… ne finisse par penser
  rationale: Dans ce contexte, le verbe désigne une appréhension prudente plutôt que la piété. La tournure choisie rend la crainte d’une conclusion que le roi pourrait finir par tirer.
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: à la suite d’un complot humain
  rationale: ἐπιβουλή évoque un dessein hostile ou un complot. Cette formulation française conserve le contraste entre l’action humaine et la justice divine.
- source_word: θείας δίκης
  choice: la justice divine
  rationale: Le choix garde le nom abstrait δίκη et l’adjectif θείας, sans expliciter « Dieu » au-delà de la formulation grecque.
- source_word: ἀνηρῆσθαι
  choice: avait été tué
  rationale: Dans ce contexte, le parfait passif de ἀναιρέω désigne la mise à mort d’Apollonios. « Avait été tué » est clair, direct et fidèle au sens contextuel.
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: fit une prière à son sujet
  rationale: La formulation conserve l’indétermination de τι et ne tranche pas entre une prière en faveur d’Apollonios et une prière portant plus largement sur son cas.
theological_decisions:
- issue: Portée de θείας δίκης
  choice: « la justice divine »
  alternative: « le jugement de Dieu »
  rationale: Le grec affirme une causalité ou une justice divine, mais emploie l’adjectif « divine » plutôt que le nom de Dieu. La traduction maintient cette formulation et la tension avec le complot humain.
- issue: Référent et portée de περὶ αὐτοῦ
  choice: « à son sujet »
  alternative: « pour lui » ou « au sujet de cette affaire »
  rationale: Le grec laisse ouverte la question de savoir si Onias prie en faveur d’Apollonios ou plus généralement à propos de lui et de sa situation. La traduction ne résout pas cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le nom royal est transcrit « Séleucos » et le nom « Apollonios » selon une forme proche du grec. La longue phrase grecque est conservée sans la rendre artificiellement archaïque.
