revisions:
- from: Accablé par ces paroles, le grand prêtre Onias, bien que, par ailleurs, il craignît que le roi Séleucos ne finisse par penser qu’Apollonios avait été tué à la suite d’un complot humain et non par la justice divine, fit une prière à son sujet.[a]
  to: Accablé par ces paroles, le grand prêtre Onias, bien qu’il eût par ailleurs craint que le roi Séleucos ne pense un jour qu’Apollonios avait été tué à la suite d’un complot humain, et non par la justice divine, fit une prière à son sujet.[a]
  rationale: La révision remplace l’idée ajoutée de « finir par » par « un jour », qui rend ποτέ sans surinterprétation. Elle ajuste également la construction concessive pour une syntaxe française plus fluide tout en maintenant la relation logique du grec et l’ambiguïté de la prière.
