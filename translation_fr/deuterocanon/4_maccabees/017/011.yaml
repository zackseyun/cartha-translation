  source_fidelity: Le grec affirme avec emphase que l’ἀγών « devenu/advenu par eux » était θεῖος. « Combat », « divin » et « en vérité » rendent correctement les termes essentiels. « À travers eux » est toutefois un calque peu idiomatique en français et rend moins nettement la valeur instrumentale ou agentive de διά avec le génitif.
