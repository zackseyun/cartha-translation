  text: For truly the contest that came about through them was divine[a].
translation:
  language: fr
  text: Car, en vérité, le combat qui s’est accompli par leur intermédiaire était divin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le combat divin accompli par eux ». La tournure grecque peut souligner soit que le combat s’est accompli par leur intermédiaire, soit qu’il a été accompli par eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: en vérité
  rationale: Cette locution conserve l’affirmation solennelle et emphatique de l’adverbe grec dans un français digne et naturel.
- source_word: ἀγών
  choice: combat
  rationale: Dans le contexte de l’endurance des martyrs, le mot évoque une épreuve publique ou athlétique. « Combat » garde cette intensité mieux que le terme plus faible « lutte ».
- source_word: θεῖος
  choice: divin
  rationale: L’adjectif qualifie directement le combat comme relevant du divin ou marqué par lui, sans préciser davantage la relation à Dieu.
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: qui s’est réalisé à travers eux
  rationale: Le parfait participial indique un événement parvenu à sa réalisation, tandis que διά avec le génitif présente ces personnes comme intermédiaires ou agents sans en faire nécessairement la source ultime.
theological_decisions:
- issue: Le rôle des martyrs dans διʼ αὐτῶν
  choice: Le combat s’est réalisé « à travers eux », ce qui met en valeur leur participation instrumentale tout en laissant ouverte la source de son caractère divin.
  alternative: « le combat divin qu’ils ont mené » ou « le combat divin qui s’est déroulé dans leur cas »
  rationale: 'La formulation retenue préserve la tension du grec : le combat est divin, mais il advient par l’intermédiaire des martyrs. Elle évite de transformer implicitement leur rôle instrumental en causalité ultime.'
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « En vérité » convient au ton rhétorique du passage; « s’est réalisé à travers eux » conserve délibérément une légère étrangeté afin de préserver l’ambiguïté de la formulation grecque.
