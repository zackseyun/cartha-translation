  source_fidelity: Le sens général est bien rendu, mais « il aurait été juste » affaiblit la nuance d’appropriation/dignité de ἄξιον ἦν et « pour servir de mémorial » est moins idiomatique et moins précis que l’expression française « en souvenir ». La double valeur additive de καί est plus clairement rendue par « même » et « aussi ».
