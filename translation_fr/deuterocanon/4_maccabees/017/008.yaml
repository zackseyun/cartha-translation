  yaml_path: translation/deuterocanon/4_maccabees/017/008.yaml
  text: 'For it would indeed have been fitting to inscribe even these words on his very tombstone, spoken as a memorial for those of the nation:'
translation:
  language: fr
  text: 'Car il aurait en effet été approprié d’inscrire même sur l’épitaphe elle-même[a] ces paroles aussi, adressées à ceux de la nation, en souvenir :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le monument funéraire lui-même ». Le grec peut désigner l’inscription funéraire ou le monument qui la porte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξιον ἦν
  choice: il aurait été juste
  rationale: L’expression impersonnelle indique ce qui aurait été approprié ou digne d’être fait; cette formulation rend naturellement sa valeur rhétorique.
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  choice: sur l’épitaphe elle-même
  rationale: αὐτοῦ s’accorde avec le neutre ἐπιταφίου et marque ici l’insistance (« elle-même »), plutôt qu’une possession (« son »). ἐπιτάφιον peut désigner l’inscription funéraire ou le monument qui la porte.
- source_word: ἀναγράψαι
  choice: d’inscrire
  rationale: Le verbe désigne une mise par écrit publique ou durable et convient particulièrement au contexte funéraire.
- source_word: καὶ ταῦτα
  choice: aussi … ces paroles
  rationale: Le démonstratif annonce vraisemblablement le contenu cité ensuite; « paroles » explicite sans lourdeur ce qu’implique λεγόμενα.
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: à l’intention de ceux de la nation
  rationale: La formule désigne ceux qui appartiennent à la nation, ici le peuple juif, sans ajouter le possessif non exprimé « notre ».
- source_word: εἰς μνείαν
  choice: pour servir de mémorial
  rationale: La locution exprime la finalité commémorative tout en évitant de préciser indûment l’objet exact du souvenir.
- source_word: λεγόμενα
  choice: prononcées
  rationale: Le participe qualifie les paroles et conserve leur caractère d’énoncé, même si elles sont envisagées comme inscription.
