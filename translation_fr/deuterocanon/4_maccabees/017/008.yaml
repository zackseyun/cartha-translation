    rationale: « Pour servir de mémorial » est peu naturel en français pour des paroles et peut faire de ces paroles un objet mémoriel. « En souvenir » exprime naturellement la finalité commémorative sans déterminer plus précisément la relation syntaxique discutée avec le datif.
