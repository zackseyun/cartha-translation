  text: and that the tyrant should be punished and the homeland should be purified[a].
translation:
  language: fr
  text: et que le tyran soit puni et que la patrie soit purifiée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nettoyée ». Le grec peut évoquer une purification rituelle, morale ou nationale.
    reason: lexical_alternative
lexical_decisions:
- source_word: τύραννον
  choice: le tyran
  rationale: 'Le terme est polémique et moralement chargé : il désigne ici un souverain oppresseur, plutôt que simplement « le roi ».'
- source_word: τιμωρηθῆναι
  choice: soit puni
  rationale: L’infinitif aoriste passif exprime le châtiment subi par le tyran. Cette formulation garde la portée judiciaire et rétributive sans préciser indûment l’idée de vengeance.
- source_word: πατρίδα
  choice: la patrie
  rationale: πατρίς désigne la terre ancestrale ou le pays auquel on appartient. « La patrie » conserve en français moderne sa résonance collective et affective.
- source_word: καθαρισθῆναι
  choice: purifiée
  rationale: Le verbe peut évoquer une purification rituelle, morale ou nationale. « Purifiée » maintient cette ampleur de sens et le registre soutenu du passage.
theological_decisions:
- issue: Portée de la purification de la patrie
  choice: « la patrie purifiée » laisse ouvertes les dimensions rituelle, morale et nationale
  alternative: « la patrie délivrée de toute souillure » ou « la patrie nettoyée »
  rationale: Le contexte permet d’entendre davantage qu’une simple libération politique, mais le grec ne précise ni la nature exacte de la souillure ni le mécanisme de la purification. La traduction préserve donc cette tension.
translation_notes:
  register: Français international actuel, digne et concis. La coordination et la construction elliptique prolongent naturellement la phrase précédente. « Patrie » convient ici mieux que « pays », qui atténuerait la résonance ancestrale de πατρίς.
