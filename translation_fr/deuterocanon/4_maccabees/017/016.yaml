  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
translation:
  language: fr
  text: Qui n’a pas admiré les athlètes de la loi de vérité[a] ? Qui n’a pas été frappé de stupeur ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les athlètes de la véritable loi ». L’expression grecque peut être comprise comme un génitif (« la loi de vérité ») ou comme qualifiant la loi de véritable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασαν
  choice: a admiré
  rationale: Le verbe exprime ici à la fois l’émerveillement et l’admiration. « Admiré » convient naturellement à des personnes louées pour leur endurance et garde la force rhétorique de la question.
- source_word: ἀθλητάς
  choice: les athlètes
  rationale: Le terme désigne littéralement des concurrents dans une épreuve. Conserver « athlètes » préserve l’image sportive employée pour leur combat vertueux.
- source_word: νομοθεσίας
  choice: législation
  rationale: Le nom grec désigne la législation, l’établissement des lois ou l’ordre légal qui en résulte. « Législation » rend le substantif plus précisément que le simple mot « loi », malgré son registre soutenu.
- source_word: ἀληθείας
  choice: de vérité
  rationale: Le génitif est conservé afin de ne pas trancher silencieusement entre une relation à la vérité et une valeur qualificative équivalant à « véritable ».
- source_word: ἐξεπλάγησαν
  choice: a été frappé de stupeur
  rationale: Cette expression rend la réaction intense portée par le verbe et la distingue de l’admiration exprimée dans la première question.
- source_word: τίνες
  choice: Qui
  rationale: Dans ces questions rhétoriques, le singulier générique « Qui » est idiomatique en français et exprime la portée universelle du propos.
theological_decisions:
- issue: Image des fidèles comme ἀθλητάς
  choice: Maintenir explicitement la métaphore sportive avec « athlètes ».
  alternative: « champions », « combattants »
  rationale: Le grec présente leur fidélité comme une épreuve athlétique. Une formulation militaire ou purement honorifique interpréterait davantage l’image.
- issue: Rapport entre ἀληθείας et νομοθεσίας
  choice: « la législation de vérité »
  alternative: « la véritable législation »
  rationale: Le génitif grec peut désigner une législation liée à la vérité ou qualifier la législation comme véritable. La traduction principale garde cette tension, et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, digne et rhétorique. « Législation de vérité » est volontairement plus formel et moins courant afin de conserver la structure et l’ambiguïté du grec; la note fournit la lecture adjectivale naturelle.
