  text: and that the tyrant should be punished and the homeland purified.
translation:
  language: fr
  text: et que le tyran soit puni et la patrie purifiée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: le tyran
  rationale: Dans ce contexte, le terme désigne le souverain oppresseur qui persécute les fidèles. « Tyran » en conserve directement la force morale et politique.
- source_word: τιμωρηθῆναι
  choice: soit puni
  rationale: L’infinitif aoriste passif exprime ici, dans la construction dépendant du contexte précédent, le châtiment infligé au tyran. Le subjonctif français rend naturellement cette dépendance tout en conservant le passif.
- source_word: πατρίδα
  choice: la patrie
  rationale: πατρίς désigne la terre ancestrale ou le pays auquel on appartient. « Patrie » garde cette dimension collective et affective sans réduire le terme au seul territoire.
- source_word: καθαρισθῆναι
  choice: purifiée
  rationale: Le passif exprime une purification dont la portée peut être rituelle, morale et collective. « Purifiée » préserve mieux cette amplitude que le seul nettoyage matériel.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: Les deux καί coordonnent deux résultats parallèles. Leur reprise simple respecte la structure concise du grec.
theological_decisions:
- issue: Nature de la purification de la patrie
  choice: « la patrie purifiée », avec un sens volontairement large
  alternative: « la patrie nettoyée » ou « le peuple purifié », qui privilégieraient respectivement l’enlèvement d’une souillure ou la communauté humaine
  rationale: Le grec ne limite pas la purification à un domaine exclusivement rituel, moral, politique ou territorial. La formulation choisie conserve cette tension symbolique.
translation_notes:
  register: Français moderne, concis et digne. Le fragment conserve son caractère syntaxiquement dépendant du contexte précédent grâce à l’ouverture « et que ».
