  rationale: La révision rend l’addition portée par καὶ αὐτή et préserve l’indétermination du sujet de ψαύσειεν. Elle maintient la réserve narrative introduite par « certains des gardes disaient », ainsi que le sens concret et violent de l’acte, sans ajouter d’interprétation doctrinale.
