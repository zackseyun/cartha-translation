base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: fr
  text: Certains des gardes disaient aussi que, alors qu’elle aussi allait être saisie pour être mise à mort, elle se jeta sur le bûcher afin que personne ne touche aucune partie de son corps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit présente cet acte comme ce que certains gardes disaient, et non comme une affirmation directe et sans réserve du narrateur.
    reason: alternative_reading
lexical_decisions:
- source_word: δορυφόρων
  choice: gardes
  rationale: Le terme désigne littéralement des porteurs de lance et, par extension, des gardes ou gardes du corps. « Gardes » exprime naturellement leur fonction dans ce contexte sans ajouter explicitement « du roi », absent du verset grec.
- source_word: συλλαμβάνεσθαι πρὸς θάνατον
  choice: être saisie pour être mise à mort
  rationale: « Être saisie » conserve la force physique du passif, tandis que « pour être mise à mort » rend clairement la finalité exprimée par πρὸς θάνατον dans un français naturel.
- source_word: ψαύσειέν τι τοῦ σώματος αὐτῆς
  choice: qu’ils ne touchent aucune partie de son corps
  rationale: Cette formulation restitue la valeur partitive de τι τοῦ σώματος et l’idée d’empêcher tout contact physique.
- source_word: ἑαυτὴν ἔρριψεν
  choice: elle se jeta
  rationale: Le verbe décrit un geste volontaire et énergique; « se jeta » est idiomatique, sobre et fidèle.
- source_word: κατὰ τῆς πυρᾶς
  choice: sur le bûcher
  rationale: πυρά désigne ici un bûcher, et κατά avec le génitif indique le mouvement vers celui-ci ou sur celui-ci.
theological_decisions:
- issue: Statut narratif de l’acte final de la mère
  choice: Présenter l’événement comme le témoignage rapporté de certains gardes
  alternative: Énoncer directement l’acte comme un fait affirmé sans distance narrative
  rationale: L’introduction ἔλεγον ... τινές (« certains ... disaient ») attribue explicitement cette version à une partie des gardes. La traduction maintient cette réserve sans atténuer la violence ni le caractère délibéré de l’acte.
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe suit le mouvement de la phrase grecque tout en évitant le calque. « Gardes » est préféré à « porteurs de lance », trop littéral dans le corps du texte; la nuance institutionnelle demeure implicite dans le contexte.
