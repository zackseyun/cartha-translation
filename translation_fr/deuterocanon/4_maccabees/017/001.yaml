    rationale: ψαύσειεν est un optatif aoriste actif à la troisième personne du singulier, sans antécédent nominal explicite. « Personne ne touche » conserve l’idée qu’elle voulait empêcher tout contact, sans identifier grammaticalement les gardes comme sujet.
