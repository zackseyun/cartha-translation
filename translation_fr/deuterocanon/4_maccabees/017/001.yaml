  verdict: revise
  source_fidelity: 'Révision sûre nécessaire : αὐτή a ici une valeur additive (« elle aussi »), plus précise que « elle-même ». De plus, ψαύσειεν est au singulier sans sujet explicite ; « afin que personne ne touche » restitue naturellement cette indétermination sans introduire le pluriel défini « ils ».'
  naturalness: « Certains des gardes » est plus idiomatique et reflète exactement τινὲς τῶν δορυφόρων. « Allait être saisie » rend avec naturel l’imminence de ἔμελλεν ... συλλαμβάνεσθαι. Le reste conserve un registre moderne, sobre et digne.
  terminology: « Gardes », « être saisie », « mise à mort » et « bûcher » sont appropriés. La note maintient correctement le caractère de témoignage rapporté, sans transformer le propos en affirmation directe du narrateur.
