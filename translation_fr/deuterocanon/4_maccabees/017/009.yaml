  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: fr
  text: Ici sont ensevelis un prêtre âgé, une femme âgée et sept enfants, victimes de la violence d’un tyran qui voulait abolir l’organisation civique des Hébreux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la constitution des Hébreux » ou « le mode de vie des Hébreux ». Le terme grec désigne l’organisation de la vie commune d’un peuple, et non simplement ses croyances privées.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντάφθα
  choice: Ici
  rationale: L’adverbe désigne le lieu de sépulture et conserve la concision solennelle d’une inscription funéraire.
- source_word: γέρων ἱερεύς
  choice: un prêtre âgé
  rationale: Cette formulation rend l’âge avancé avec dignité, sans la nuance potentiellement familière de « vieux prêtre ».
- source_word: γυνὴ γεραιά
  choice: une femme âgée
  rationale: Le rendu maintient le parallélisme avec « un prêtre âgé ».
- source_word: ἑπτὰ παῖδες
  choice: sept enfants
  rationale: παῖδες peut désigner des enfants, des garçons ou des fils. « Enfants » préserve ici la largeur lexicale du terme grec sans préciser davantage leur âge ni leur lien familial.
- source_word: ἐγκεκήδευνται
  choice: sont ensevelis
  rationale: Le parfait passif exprime l’état présent résultant de l’ensevelissement; « sont ensevelis » convient au caractère commémoratif du passage.
- source_word: διὰ τυράννου βίαν
  choice: victimes de la violence d’un tyran
  rationale: διά avec l’accusatif indique la cause. Cette tournure française relie naturellement leur ensevelissement à la violence qui a causé leur mort, sans attribuer au tyran l’acte matériel de les ensevelir.
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: l’organisation civique des Hébreux
  rationale: πολιτεία désigne l’ordre collectif et institutionnel d’un peuple, ici sa vie commune régie par ses lois; « organisation civique » conserve cette dimension sans réduire le terme à une croyance privée.
- source_word: καταλῦσαι
  choice: abolir
  rationale: Le verbe convient à la suppression projetée d’un ordre civique ou institutionnel.
- source_word: θέλοντος
  choice: qui voulait
  rationale: La proposition relative rend clairement le participe génitif qualifiant le tyran et exprime son intention.
theological_decisions:
- issue: Portée de πολιτεία dans le contexte du martyre juif
  choice: l’organisation civique des Hébreux
  alternative: la constitution des Hébreux; le mode de vie des Hébreux
  rationale: Le terme englobe l’organisation commune, politique et légale du peuple, et non seulement sa religion privée. Le texte principal garde cette dimension collective, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et solennel. La formulation conserve l’allure d’une inscription funéraire. Le relatif « qui voulait » se rapporte sans ambiguïté au tyran; la note attachée à « organisation civique des Hébreux » explicite la polysémie de πολιτεία.
