translation:
  language: fr
  text: Mais la piété envers Dieu remporta la victoire, couronnant ses propres athlètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεοσέβεια
  choice: la piété envers Dieu
  rationale: Cette expression rend explicitement l’orientation vers Dieu du nom grec, tout en restant claire en français moderne. « Piété » seul pourrait être compris plus largement.
- source_word: ἐνίκα
  choice: remportait la victoire
  rationale: L’imparfait grec présente la victoire dans le déroulement du récit. Cette formulation conserve aussi l’image du concours qui structure toute la phrase.
- source_word: τοὺς ἑαυτῆς
  choice: ses propres
  rationale: Le réfléchi souligne que les athlètes appartiennent à la piété personnifiée. Le français permet de garder naturellement cette relation sans ajouter un pronom féminin appuyé.
- source_word: ἀθλητάς
  choice: athlètes
  rationale: Le terme maintient directement la métaphore de la compétition sportive présente dans le grec.
- source_word: στεφανοῦσα
  choice: en couronnant
  rationale: Le participe exprime la manière ou l’action concomitante par laquelle la piété manifeste sa victoire. « Couronner » conserve l’image de la couronne remise au vainqueur.
theological_decisions:
- issue: Personnification de θεοσέβεια
  choice: Conserver la personnification par « la piété envers Dieu » comme sujet agissant qui remporte la victoire et couronne ses athlètes.
  alternative: Employer « le respect de Dieu » ou expliciter fortement une figure féminine.
  rationale: Le grec personnifie la dévotion envers Dieu sans exiger que le français accentue son genre grammatical. La formulation retenue préserve la tension poétique et l’imagerie du concours sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Style bref, solennel et accessible. La reprise lexicale « remportait la victoire » est naturelle dans ce contexte et met en relief l’imagerie athlétique du grec.
