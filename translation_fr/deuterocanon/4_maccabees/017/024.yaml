  yaml_path: translation/deuterocanon/4_maccabees/017/024.yaml
  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: fr
  text: Il[c] les rendit nobles et courageux dans les combats à pied et les opérations de siège[a] ; et, après avoir ravagé[b], il vainquit tous les ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le combat à pied et le siège ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie « ravager », « dévaster » ou « mettre à sac » et s’emploie souvent à propos de villes ou de places fortes ; ici, son objet n’est pas exprimé.
    reason: lexical_alternative
  - marker: c
    text: Le grec ne nomme pas explicitement le sujet. Le participe qui suit et le verbe final sont toutefois au masculin singulier ; « il » en conserve l’identité non précisée sans l’identifier à partir du contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: Cela les rendit
  rationale: Avec le double accusatif αὐτοὺς γενναίους καὶ ἀνδρείους, le verbe a ici une valeur résultative ou causative. « Cela » garde le sujet non nommé sans lui attribuer une identité précise.
- source_word: γενναίους
  choice: nobles
  rationale: « Nobles » conserve la nuance de grandeur morale de γενναῖος et évite de faire de ce terme un simple synonyme de ἀνδρείους.
- source_word: ἀνδρείους
  choice: courageux
  rationale: Ce choix exprime clairement la vaillance guerrière sans reprendre la connotation masculine littérale qu’aurait une traduction vieillie comme « virils ».
- source_word: εἰς πεζομαχίαν
  choice: dans les combats à pied
  rationale: πεζομαχία désigne littéralement le combat mené à pied. Cette formulation est précise, naturelle et moins technique que « combat d’infanterie ».
- source_word: πολιορκίαν
  choice: les opérations de siège
  rationale: Le nom désigne l’activité militaire consistant à assiéger. « Opérations de siège » s’accorde naturellement avec le pluriel français « combats ».
- source_word: ἐκπορθήσας
  choice: après avoir tout dévasté
  rationale: Le participe exprime une dévastation ou une mise à sac. L’objet n’étant pas exprimé en grec, « tout » permet une formulation française idiomatique sans préciser arbitrairement des villes ou des forteresses.
- source_word: ἐνίκησεν
  choice: il vainquit
  rationale: Le passé simple convient au récit élevé et militaire, et « vainquit » rend directement l’idée de victoire sur des adversaires.
- source_word: πάντας τοὺς πολεμίους
  choice: tous les ennemis
  rationale: La traduction suit exactement le groupe grec sans ajouter le possessif « ses », absent du texte.
theological_decisions:
- issue: Référent du sujet implicite de ἔσχεν et passage aux formes masculines singulières ἐκπορθήσας et ἐνίκησεν
  choice: Employer d’abord le neutre démonstratif « Cela », puis conserver le passage abrupt à « il » dans la dernière proposition.
  alternative: Identifier explicitement le premier sujet comme « la raison », « la mère » ou un autre référent tiré du contexte, et uniformiser le sujet de toute la phrase.
  rationale: Le grec comprime le raisonnement et ne nomme pas le sujet immédiat de ἔσχεν, avant un participe et un verbe au masculin singulier. La traduction conserve cette tension au lieu d’imposer une identification contextuelle.
- issue: Objet sous-entendu de ἐκπορθήσας
  choice: Ne pas nommer de villes ou de forteresses dans le texte principal ; traduire « après avoir tout dévasté » et signaler la portée militaire du verbe en note.
  alternative: Traduire « après avoir mis les villes à sac » ou « après avoir dévasté leurs places fortes ».
  rationale: Le verbe évoque souvent la mise à sac de villes ou de places fortes, mais aucun objet n’est exprimé dans cette proposition. Le préciser dans le texte principal résoudrait une ellipse authentique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple maintient la dignité du récit. « Combats à pied » reste concret et compréhensible ; « opérations de siège » restitue le registre militaire. La ponctuation met en évidence le changement de sujet sans le résoudre.
