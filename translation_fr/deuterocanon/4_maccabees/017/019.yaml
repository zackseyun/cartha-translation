  yaml_path: translation/deuterocanon/4_maccabees/017/019.yaml
  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: fr
  text: Ainsi donc, eux aussi, rendus saints par Dieu[a], ont été honorés non seulement de cet honneur, mais aussi parce que, grâce à eux, les ennemis n’ont pas triomphé de notre nation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendus saints grâce à Dieu » ; le grec emploie διά avec le génitif, qui peut exprimer le moyen ou l’action d’un agent.
    reason: lexical_alternative
  - marker: b
    text: 'Dans le grec, « notre nation » et « les ennemis » sont tous deux à l’accusatif dans une proposition infinitive ; l’identification formelle du sujet n’est donc pas entièrement explicite. Le contexte, notamment la punition du tyran mentionnée ensuite, favorise le sens retenu : les ennemis n’ont pas vaincu notre nation.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἁγιασθέντες
  choice: rendus saints
  rationale: Le participe aoriste passif de ἁγιάζω décrit un état de sainteté conféré. « Rendus saints » conserve clairement le passif sans imposer le sens cultuel plus étroit que pourrait suggérer « consacrés ».
- source_word: διὰ θεοῦ
  choice: par Dieu
  rationale: διά suivi du génitif peut marquer l’agent. En français actuel, « par Dieu » exprime naturellement cette action divine; « par l’intermédiaire de Dieu » introduirait une médiation que le contexte n’exige pas.
- source_word: τετίμηνται
  choice: ont été honorés
  rationale: Le parfait passif de τιμάω présente l’honneur reçu comme ayant un résultat durable. Le passé composé passif est ici naturel et fidèle.
- source_word: ταύτῃ τῇ τιμῇ
  choice: de cet honneur
  rationale: Cette formulation conserve le lien lexical entre τετίμηνται et τιμή. La préposition « de » convient idiomatiquement après « honorer ».
- source_word: τῷ διʼ αὐτοὺς
  choice: parce que, grâce à eux
  rationale: L’article substantivant la proposition introduit un motif supplémentaire de leur honneur. « Parce que » en rend la valeur causale, tandis que « grâce à eux » conserve la causalité positive de διά.
- source_word: τὸ ἔθνος ἡμῶν
  choice: notre nation
  rationale: ἔθνος désigne ici la communauté nationale juive. « Notre nation » garde cette dimension collective et historique.
- source_word: τοὺς πολεμίους
  choice: les ennemis
  rationale: L’article grec désigne un groupe déterminé par le contexte. « Les ennemis » est direct et naturel.
- source_word: μὴ ἐπικρατῆσαι
  choice: n’ont pas triomphé de
  rationale: ἐπικρατέω exprime l’idée de l’emporter, de dominer ou de prendre le dessus. « Ne pas triompher de » rend clairement l’échec des ennemis sans ajouter l’idée d’une permission explicitement refusée.
theological_decisions:
- issue: Portée de ἁγιασθέντες dans le contexte du martyre
  choice: Les martyrs sont dits « rendus saints » par l’action de Dieu.
  alternative: Ils auraient été « consacrés » à Dieu dans un sens plus précisément cultuel.
  rationale: Le contexte affirme leur sainteté et leur honneur, mais ne contraint pas à comprendre une consécration rituelle ou sacerdotale. La traduction maintient l’affirmation théologique sans la préciser au-delà du grec.
- issue: Agent exprimé par διὰ θεοῦ
  choice: « par Dieu »
  alternative: « par l’intermédiaire de Dieu » ou « grâce à Dieu »
  rationale: Le génitif après διά permet une valeur d’agence. « Par Dieu » est la formulation française la plus sobre et ne transforme pas cette agence en simple circonstance favorable.
- issue: Rapport entre la nation et les ennemis dans la proposition infinitive
  choice: Les ennemis n’ont pas triomphé de la nation.
  alternative: Notre nation n’a pas laissé les ennemis l’emporter, ou notre nation n’a pas triomphé des ennemis.
  rationale: La construction à l’accusatif et à l’infinitif est formellement difficile, puisque les deux groupes nominaux sont à l’accusatif. Le contexte de délivrance nationale et la compréhension traditionnelle favorisent l’échec des ennemis; une note signale toutefois l’ambiguïté syntaxique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « honorés… honneur » est conservée parce qu’elle reproduit le lien lexical du grec. « Ainsi donc » rend les particules καὶ… οὖν sans alourdir excessivement la phrase.
