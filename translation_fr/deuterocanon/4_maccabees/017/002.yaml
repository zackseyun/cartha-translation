base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: fr
  text: Ô mère, toi qui, avec tes sept enfants, as brisé la violence du tyran, réduit à néant ses mauvais desseins et manifesté la noblesse de la foi[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le courage de la foi », voire « la noblesse de la fidélité » ; l’expression grecque peut évoquer aussi bien la noblesse manifestée par la foi que la courageuse constance d’un attachement fidèle.
    reason: Alternative lexicale et ambiguïté sémantique de γενναιότης et πίστις.
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: Ô mère
  rationale: Conserve l’apostrophe directe et le ton élevé de l’exclamation grecque, dans un français littéraire mais encore naturel.
- source_word: σὺν ἑπτὰ παισίν
  choice: avec tes sept enfants
  rationale: παῖς peut désigner un enfant ou un fils. « Enfants » respecte la forme lexicale, tandis que le possessif, implicite dans l’adresse à la mère et clair en contexte, est naturel en français.
- source_word: καταλύσασα
  choice: as brisé
  rationale: Le verbe exprime l’idée d’abattre, de détruire ou de mettre fin à une puissance. « Briser » convient idiomatiquement à la violence oppressive évoquée ici.
- source_word: τὴν τοῦ τυράννου βίαν
  choice: la violence du tyran
  rationale: βία désigne la force coercitive ou la violence. « Violence » rend clairement la brutalité oppressive du tyran sans surinterprétation.
- source_word: ἀκυρώσασα
  choice: réduit à néant
  rationale: Le verbe signifie rendre sans effet ou invalider. Cette expression française communique naturellement l’anéantissement pratique des desseins du tyran.
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: ses projets mauvais
  rationale: ἐπινοία désigne un dessein, un projet ou une machination. « Projets mauvais » reste proche du grec et évite d’ajouter une nuance de dissimulation qui n’est pas nécessaire.
- source_word: ἐπιδείξασα
  choice: manifesté
  rationale: Le participe évoque le fait de montrer publiquement ou de faire apparaître clairement; « manifesté » convient au registre élogieux du passage.
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: la noblesse de la foi
  rationale: γενναιότης peut évoquer la noblesse morale, la grandeur d’âme ou le courage. « Noblesse » maintient la construction génitive et l’ambiguïté quant à la qualité attribuée à la foi ou manifestée par elle.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité
  rationale: « Foi » est la traduction française la plus directe et naturelle ici. Le contexte de persécution permet aussi d’entendre la fidélité ou la constance dans l’attachement religieux, possibilité signalée en note sans imposer une lecture doctrinale.
- issue: Portée de γενναιότης dans τὴν τῆς πίστεως γενναιότητα
  choice: la noblesse de la foi
  alternative: le courage de la foi
  rationale: Le terme grec couvre la noblesse morale et le courage. Le texte principal conserve « noblesse », plus formellement proche et suffisamment ouvert; la note préserve les autres nuances réelles.
translation_notes:
  register: Apostrophe élogieuse, solennelle et rythmée. La série des trois participes grecs est rendue par trois verbes coordonnés au passé composé. Le point d’exclamation restitue la force de l’adresse, la phrase grecque étant une exclamation nominale prolongée.
