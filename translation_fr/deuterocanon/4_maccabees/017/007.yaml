base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: fr
  text: Mais s’il nous était possible, à la manière d’un peintre, de représenter la piété qui marque ton histoire, ceux qui contempleraient une mère de sept enfants endurer, par piété, des tortures de toutes sortes jusqu’à la mort ne frémiraient-ils pas ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: Mais s’il nous était possible
  rationale: La tournure rend l’hypothèse irréelle exprimée par ἔξον avec ἦν; « possible » conserve ici l’ouverture entre capacité et permission sans alourdir le français.
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: à la manière d’un peintre, de représenter
  rationale: ζωγραφέω évoque une représentation picturale et vivante. Le grec est elliptique; « à la manière d’un peintre » explicite naturellement la comparaison sans abandonner la métaphore visuelle.
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: la piété qui marque ton histoire
  rationale: εὐσέβεια désigne la révérence fidèle envers Dieu, bien rendue par « piété ». ἱστορία est ici l’histoire ou le récit de la mère; « qui marque » exprime naturellement le génitif grec sans transformer « histoire » en discipline historique moderne.
- source_word: οὐκ ἂν ἔφριττον
  choice: ne frémiraient-ils pas ?
  rationale: La question rhétorique et la valeur potentielle de ἄν sont conservées. « Frémir » rend la réaction physique d’effroi portée par φρίσσω.
- source_word: οἱ θεωροῦντες
  choice: ceux qui contempleraient
  rationale: θεωρέω désigne ici ceux qui regardent attentivement la scène représentée; « contempler » maintient le lien avec l’image picturale.
- source_word: μητέρα ἑπτὰ τέκνων
  choice: une mère de sept enfants
  rationale: τέκνα est le terme général pour les enfants, même si le contexte narratif permet de savoir qu’il s’agit de fils.
- source_word: διʼ εὐσέβειαν
  choice: par piété
  rationale: διά avec l’accusatif exprime la cause ou le motif. La répétition de « piété » conserve celle d’εὐσέβεια et son importance thématique.
- source_word: ποικίλας βασάνους
  choice: des tortures de toutes sortes
  rationale: ποικίλας souligne la diversité des supplices; dans ce contexte de martyre, βάσανοι désigne clairement des tortures.
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: endurer … jusqu’à la mort
  rationale: « Endurer » restitue la persévérance sous l’épreuve exprimée par ὑπομένω, tandis que « jusqu’à la mort » conserve la limite ou l’extension indiquée par μέχρι.
theological_decisions:
- issue: Traduction d’εὐσέβεια dans le contexte du martyre
  choice: piété
  alternative: fidélité envers Dieu; attachement à Dieu
  rationale: « Piété » est un terme français actuel et digne qui conserve à la fois la révérence religieuse et la conduite fidèle. Le même mot est répété dans les deux occurrences afin de préserver l’insistance théologique du grec sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue question rhétorique et la métaphore picturale du grec sont maintenues. Le tutoiement rend le singulier σου, adressé à la mère dans l’apostrophe du passage.
