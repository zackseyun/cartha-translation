base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/003.yaml
  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: fr
  text: Car, de même que, comme un toit solidement établi sur la colonne que formaient tes enfants[a], tu as courageusement supporté, sans fléchir, le séisme provoqué par les tortures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes fils ». Le grec peut désigner des enfants, des fils ou des garçons selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Car, de même que
  rationale: Rend à la fois la valeur explicative de γάρ et la comparaison introduite par καθάπερ, tout en respectant le caractère continu de la phrase.
- source_word: στέγη
  choice: toit
  rationale: Conserve l’image architecturale concrète du grec plutôt que de l’atténuer en « abri » ou « protection ».
- source_word: ἐπὶ τοῦ στύλου τῶν παίδων
  choice: sur la colonne que formaient tes enfants
  rationale: La formulation française explicite sobrement la relation métaphorique entre la colonne et les enfants, évitant l’ambiguïté peu naturelle de « la colonne des enfants » sans supprimer l’image.
- source_word: γενναίως
  choice: courageusement
  rationale: Exprime clairement la vaillance devant les tortures; « noblement » serait possible, mais moins directement lié à l’endurance.
- source_word: ἱδρυμένη
  choice: solidement établi
  rationale: Le participe décrit le toit comme fermement posé ou fixé; l’accord au masculin suit « toit » en français.
- source_word: ἀκλινῶς
  choice: sans fléchir
  rationale: Préserve l’idée concrète de ne pas s’incliner tout en exprimant naturellement la constance morale.
- source_word: ὑπήνεγκας
  choice: tu as supporté
  rationale: Rend l’idée de porter et d’endurer sous une forte pression, tout en convenant à l’objet métaphorique « séisme ».
- source_word: τὸν διὰ τῶν βασάνων σεισμόν
  choice: le séisme provoqué par les tortures
  rationale: Conserve « séisme » et présente les tortures comme le moyen ou la cause de l’ébranlement métaphorique; cette formulation est plus intelligible en français que « le séisme à travers les tortures ».
theological_decisions:
- issue: Description métaphorique de la mère et de ses enfants au moyen d’une construction soumise à un séisme
  choice: Maintenir les termes architecturaux « toit », « colonne » et « séisme »
  alternative: Paraphraser la mère comme protectrice de ses enfants demeurée ferme dans leurs souffrances
  rationale: Le grec développe une image dense dont la tension ne doit pas être remplacée par son interprétation. La traduction laisse donc au lecteur le soin de saisir la portée de la métaphore.
- issue: Sens de τῶν παίδων dans le récit des martyrs
  choice: tes enfants
  alternative: tes fils
  rationale: Le contexte désigne les fils de la mère, mais παῖδες est lexicalement plus large. « Enfants » conserve cette amplitude et exprime naturellement leur relation avec elle.
translation_notes:
  register: Français moderne, international et digne. La proposition reste ouverte à la suite du discours, comme le suggère la construction comparative du verset. L’ordre des éléments a été légèrement adapté pour une lecture naturelle, sans aplanir la métaphore architecturale.
