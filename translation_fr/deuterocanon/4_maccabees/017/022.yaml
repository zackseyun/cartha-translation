  terminology: « Mort expiatoire » est une solution française solide et non confessionnellement surdéterminée pour τοῦ ἱλαστηρίου θανάτου. La note conserve à bon droit « propitiatoire » et mentionne prudemment le sens cultuel possible du substantif apparenté dans d’autres contextes. « Rançon » garde la valeur d’échange d’ἀντίψυχον sans expliciter indûment un mécanisme doctrinal.
