  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: fr
  text: comme s’ils étaient devenus une rançon pour le péché de la nation[a], et que, par le sang de ces hommes pieux et par leur mort expiatoire[b], la providence divine préserva Israël, auparavant maltraité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une vie donnée en échange pour le péché de la nation » ; le terme grec évoque ce qui est donné en échange d’une vie.
    reason: Alternative lexicale pour ἀντίψυχον, préservant la valeur d’échange ou de substitution.
  - marker: b
    text: Ou « leur mort propitiatoire » ; le terme grec peut désigner ce qui réalise l’expiation ou la propitiation et, dans certains contextes, le propitiatoire du sanctuaire.
    reason: Le champ sémantique de ἱλαστήριος/ἱλαστήριον est discuté ; la note préserve les principales nuances sans assimiler ici la mort à l’objet cultuel.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: une rançon
  rationale: Le terme désigne ce qui est donné en échange d’une vie. « Rançon » exprime avec concision cette valeur compensatoire, tandis que la note conserve une formulation plus littérale.
- source_word: ἁμαρτίας
  choice: le péché
  rationale: Le mot garde ici son sens moral et religieux; « péché » convient mieux que le terme affaibli « faute ».
- source_word: εὐσεβῶν
  choice: hommes pieux
  rationale: L’adjectif qualifie des personnes qui manifestent leur révérence envers Dieu. « Hommes pieux » est naturel dans ce contexte et explicite le substantif sous-entendu.
- source_word: ἱλαστηρίου
  choice: expiatoire
  rationale: Employé comme adjectif de « mort », le terme indique que leur mort produit l’expiation. « Expiatoire » est idiomatique en français et n’impose pas le sens concret de « propitiatoire » comme objet cultuel.
- source_word: θανάτου
  choice: mort
  rationale: Le nom désigne directement la mort des martyrs comme moyen de la délivrance d’Israël.
- source_word: θεία πρόνοια
  choice: la providence divine
  rationale: Cette expression française usuelle rend fidèlement la sollicitude providentielle attribuée au divin sans ajouter une désignation absente du grec.
- source_word: προκακωθέντα
  choice: qui avait auparavant été maltraité
  rationale: La proposition relative rend le participe passif ainsi que la valeur temporelle du préfixe προ-, sans forcer une nuance concessive qui n’est pas explicitement marquée.
- source_word: διέσωσεν
  choice: sauva
  rationale: Le verbe composé exprime la délivrance et la préservation au travers d’un danger. « Sauva » est clair et naturel ici dans le cadre de la délivrance nationale.
theological_decisions:
- issue: Sens de ἱλαστηρίου dans le contexte sacrificiel de la mort des martyrs
  choice: leur mort expiatoire
  alternative: leur mort propitiatoire; leur mort qui servit de moyen d’expiation
  rationale: Le contexte attribue à leur mort un effet relatif au péché. « Expiatoire » rend cette fonction sans trancher plus précisément entre élimination du péché et apaisement, et la note signale les autres nuances possibles.
- issue: Portée substitutive de ἀντίψυχον γεγονότας
  choice: comme s’ils étaient devenus une rançon pour le péché de la nation
  alternative: comme s’ils étaient devenus une vie donnée en échange pour le péché de la nation
  rationale: Le grec emploie un langage d’échange ou de substitution, mais ὥσπερ (« comme si/comme ») maintient une comparaison. La traduction conserve à la fois cette réserve et la force de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste formelle en raison du raisonnement théologique du passage. « Hommes pieux » évite l’ambiguïté d’un simple adjectif substantivé, et « qui avait auparavant été maltraité » respecte l’ordre temporel du grec.
