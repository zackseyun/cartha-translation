  to: comme s’ils étaient devenus une rançon pour le péché de la nation[a], et que, par le sang de ces hommes pieux et par leur mort expiatoire[b], la providence divine préserva Israël, auparavant maltraité.
  rationale: La révision rétablit la construction comparative et coordonnée du grec en remplaçant le point par une virgule et en introduisant « et que ». Elle choisit aussi « préserva » pour reproduire la nuance de διέσωσεν. Les autres choix sont maintenus, notamment « rançon » et « mort expiatoire », qui sont fidèles, naturels et théologiquement non surinterprétatifs.
