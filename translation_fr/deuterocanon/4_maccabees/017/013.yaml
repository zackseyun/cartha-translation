  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
translation:
  language: fr
  text: Éléazar menait la lutte[a] ; la mère des sept fils luttait comme une athlète ; et les frères luttaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une succession de verbes du registre de la lutte et de l’épreuve : Éléazar « menait la lutte » ou devançait les autres dans le combat, la mère « luttait en athlète », et les frères « luttaient ». La traduction conserve cette image commune en variant légèrement les formulations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προηγωνίζετο
  choice: prenait la tête dans le combat
  rationale: L’imparfait de προαγωνίζομαι présente Éléazar comme celui qui lutte en avant des autres et leur ouvre la voie. Cette formulation conserve à la fois l’idée d’antériorité ou de prééminence et l’image du combat.
- source_word: ἐνήθλει
  choice: luttait en athlète
  rationale: Le verbe ἀθλέω appartient explicitement au domaine de l’épreuve athlétique. « Luttait en athlète » garde cette image tout en restant naturel dans le contexte du martyre.
- source_word: ἠγωνίζοντο
  choice: étaient aux prises
  rationale: ἀγωνίζομαι peut désigner le fait de concourir, de lutter ou de combattre. « Étaient aux prises » exprime une lutte soutenue sans transformer nécessairement la scène en affrontement armé littéral.
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: la mère des sept fils
  rationale: παῖδες peut signifier « enfants », mais le récit présente ici sept enfants de sexe masculin ; « fils » est donc précis dans ce contexte.
- source_word: ἀδελφοὶ
  choice: les frères
  rationale: Le masculin pluriel désigne ici les sept fils, qui sont frères ; la traduction conserve cette précision.
theological_decisions:
- issue: Maintien de la métaphore de la lutte
  choice: Conserver dans les trois propositions le champ lexical du combat et de l’épreuve athlétique
  alternative: Ramener les trois verbes à des expressions générales telles que « endurer » ou « souffrir courageusement »
  rationale: Le grec varie délibérément trois verbes liés à la compétition et à la lutte afin de présenter le martyre comme un noble combat. La traduction maintient cette rhétorique sans préciser indûment s’il s’agit d’une compétition sportive ou d’un combat au sens large.
translation_notes:
  register: Français moderne, courant et digne. La structure ternaire et les imparfaits du grec sont conservés ; les formulations variées évitent une répétition lourde tout en maintenant l’unité de l’image.
