  rationale: La révision se limite à remplacer « Grâce à elle » par « En raison de laquelle », afin de reproduire plus exactement le rapport causal de διʼ ἣν sans renforcer sa nuance. Les notes existantes sont conservées, car elles balisent adéquatement les deux expressions dont l’interprétation demeure ouverte.
