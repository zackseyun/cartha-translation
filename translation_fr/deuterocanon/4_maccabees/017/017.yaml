base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/017.yaml
  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: fr
  text: De fait, le tyran lui-même et tout leur conseil furent saisis d’admiration devant leur endurance. En raison de laquelle, ils se tiennent maintenant auprès du trône divin[a] et vivent l’âge bienheureux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le trône divin ». Le verbe grec accompagné du datif peut évoquer soit une position auprès du trône, soit la présence devant lui.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vivent l’âge bienheureux »; dans ce contexte, l’expression évoque vraisemblablement un état de bonheur éternel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  choice: De fait, le tyran lui-même
  rationale: « De fait » rend la force affirmative des particules γέ τοι, tandis que « lui-même » conserve l’insistance portée par αὐτός.
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: Le terme τύραννος caractérise ici Antiochos de manière hostile et ne constitue pas un simple titre politique neutre.
- source_word: ὅλον τὸ συνέδριον αὐτῶν
  choice: tout leur conseil
  rationale: « Conseil » désigne clairement l’assemblée ou le tribunal associé au tyran, sans préciser outre mesure sa structure institutionnelle; « leur » conserve le pluriel du grec αὐτῶν.
- source_word: ἐξεθαύμασαν
  choice: furent saisis d’admiration
  rationale: Cette tournure française exprime l’étonnement intense du verbe renforcé ἐκθαυμάζω tout en laissant paraître l’admiration suscitée par l’endurance des martyrs.
- source_word: ὑπομονήν
  choice: endurance
  rationale: Dans ce contexte de martyre, le mot désigne la persévérance ferme sous la souffrance; « endurance » est naturel, concis et moralement chargé.
- source_word: διʼ ἣν
  choice: Grâce à elle
  rationale: La formule reprend l’endurance et exprime son rôle causal dans la récompense qui suit, sans développer davantage la relation théologique.
- source_word: τῷ θείῳ ... θρόνῳ
  choice: du trône divin
  rationale: L’adjectif θείῳ signifie littéralement « divin »; cette formulation évite de rendre le texte plus explicite qu’il ne l’est.
- source_word: παρεστήκασιν
  choice: se tiennent maintenant auprès de
  rationale: Le parfait décrit leur état présent dans la proximité ou au service du trône. « Auprès de » préserve cette image, tandis qu’une note signale la lecture possible « devant ».
- source_word: τὸν μακάριον ... αἰῶνα
  choice: l’âge bienheureux
  rationale: Cette traduction formellement proche conserve l’expression singulière du grec sans la convertir directement en une formulation doctrinale telle que « l’éternité bienheureuse ».
- source_word: βιοῦσιν
  choice: vivent
  rationale: Le verbe simple « vivre » correspond directement à βιοῦσιν et maintient le caractère concret de l’affirmation.
theological_decisions:
- issue: Nature de la récompense des martyrs après la mort
  choice: Ils sont présentés comme se tenant dès maintenant auprès du trône divin et vivant l’âge bienheureux.
  alternative: Ils se tiennent devant le trône divin et jouissent de l’éternité bienheureuse.
  rationale: Le grec emploie un langage orienté vers le présent, νῦν avec le parfait παρεστήκασιν et le présent βιοῦσιν. La traduction conserve cette revendication de réhabilitation posthume et son imagerie sans la systématiser selon des catégories doctrinales ultérieures.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l’emphase initiale, l’intensité de l’étonnement et l’expression inhabituelle « l’âge bienheureux ». Les notes maintiennent ouvertes les ambiguïtés spatiale et eschatologique du grec.
