base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/004.yaml
  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: fr
  text: Prends donc courage[a], ô mère à l’âme sainte, en gardant noblement, avec Dieu en vue, l’espérance de la persévérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tiens bon ». L’expression grecque est une exhortation à la confiance et au courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρρει
  choice: Prends courage
  rationale: L’impératif appelle directement à la confiance et à la fermeté; cette tournure est naturelle en français moderne.
- source_word: τοιγαροῦν
  choice: donc
  rationale: La particule marque une conclusion tirée de ce qui précède.
- source_word: μῆτηρ ἱερόψυχε
  choice: ô mère à l’âme sainte
  rationale: Cette formulation française traite ἱερόψυχε comme un qualificatif de la mère et conserve les deux éléments du composé, la sainteté et l’âme, sans laisser entendre qu’il s’agit de l’âme d’une autre personne.
- source_word: ἐλπίδα τῆς ὑπομονῆς
  choice: l’espérance de la persévérance
  rationale: Le génitif grec reste volontairement ouvert quant au rapport exact entre l’espérance et la persévérance; la formulation française conserve cette densité plutôt que de l’expliciter arbitrairement.
- source_word: γενναίως ἔχουσα
  choice: toi qui gardes noblement
  rationale: La proposition relative rend clairement le participe féminin; « gardes » reste proche de ἔχω et « noblement » préserve la valeur morale de γενναίως sans répéter le mot « courage ».
- source_word: πρὸς θεόν
  choice: avec Dieu en vue
  rationale: Cette expression conserve l’orientation vers Dieu exprimée par πρός sans la transformer en « espérance en Dieu », lecture possible mais plus déterminée.
theological_decisions:
- issue: Portée de ἱερόψυχε dans l’apostrophe
  choice: mère à l’âme sainte
  alternative: mère dont l’âme est consacrée
  rationale: Le composé qualifie le caractère intérieur et sacré de la mère; « sainte » maintient explicitement la dimension religieuse de ἱερο-.
- issue: Rapport de πρὸς θεόν avec l’espérance et la persévérance
  choice: avec Dieu en vue
  alternative: en Dieu
  rationale: Le grec exprime une orientation vers Dieu, mais ne dit pas simplement ἐν θεῷ. La traduction évite donc de préciser davantage que la source la nature de ce rapport.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « ô mère » conserve le ton solennel du discours sans archaïsme excessif. La formulation maintient les ambiguïtés du génitif et de l’orientation exprimée par πρός.
