base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: fr
  text: La lune ne se tient pas dans le ciel avec les étoiles avec autant de majesté que toi qui, après avoir guidé[a] vers la piété tes sept fils, pareils aux étoiles, te tiens honorée devant Dieu et as été établie dans le ciel avec eux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir éclairé tes sept fils, pareils aux étoiles, pour les conduire à la piété ». Le verbe grec peut évoquer le fait de conduire à la lumière ou d’éclairer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « tu as été affermie dans le ciel avec eux ». Ici, « ciel » peut prolonger l’image des astres tout en évoquant l’honneur céleste de la mère avec ses fils.'
    reason: alternative_reading
lexical_decisions:
- source_word: σελήνη
  choice: la lune
  rationale: Terme céleste direct ; l’article défini est naturel en français dans cette comparaison.
- source_word: σεμνὴ καθεστήκεν
  choice: se tient avec autant de majesté
  rationale: Rend la dignité éclatante de σεμνή et l’état établi exprimé par le parfait καθεστήκεν, tout en conservant la comparaison rhétorique.
- source_word: ἰσαστέρους
  choice: pareils aux étoiles
  rationale: Le composé signifie que les fils sont comparables ou égaux aux étoiles ; « pareils aux étoiles » est clair et naturel sans suggérer leur nombre.
- source_word: φωταγωγήσασα
  choice: après avoir conduit
  rationale: Le verbe peut évoquer l’action de conduire à la lumière ou d’éclairer. « Conduit vers la piété » exprime naturellement ici la direction spirituelle, tandis que la note conserve l’image lumineuse.
- source_word: πρὸς τὴν εὐσέβειαν
  choice: vers la piété
  rationale: Dans ce contexte, εὐσέβεια désigne la révérence fidèle envers Dieu manifestée par l’obéissance.
- source_word: ἔντιμος καθεστήκας θεῷ
  choice: tu as acquis de l’honneur auprès de Dieu
  rationale: Exprime le nouvel état honorable indiqué par le parfait et le rapport à Dieu marqué par le datif, sans introduire l’idée plus précise d’une récompense ou d’un jugement.
- source_word: ἐστήρισαι
  choice: tu as été affermie
  rationale: Conserve la valeur passive et l’idée de stabilité durable du verbe, plutôt que de réduire la formulation à un simple déplacement.
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  choice: dans le ciel avec eux
  rationale: « Ciel » préserve en français l’ambivalence entre la voûte céleste de l’image et la demeure céleste suggérée par le contexte des martyrs.
theological_decisions:
- issue: Sens de οὐρανός dans la proposition finale
  choice: ciel
  alternative: séjour céleste / paradis
  rationale: Le français « ciel » garde la continuité avec l’image de la lune et des étoiles tout en permettant le sens céleste ou eschatologique du dernier membre, sans trancher plus précisément que le grec.
- issue: Nature de l’honneur de la mère devant Dieu
  choice: de l’honneur auprès de Dieu
  alternative: honorée par Dieu
  rationale: Le datif θεῷ permet de comprendre « aux yeux de Dieu » ou « auprès de Dieu » ; la traduction évite d’imposer explicitement l’agent de l’honneur.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure comparative et l’imagerie astrale sont maintenues ; les deux emplois de « ciel » préservent le passage possible du ciel visible à la réalité céleste.
