  to: La lune ne se tient pas dans le ciel avec les étoiles avec autant de majesté que toi qui, après avoir guidé[a] vers la piété tes sept fils, pareils aux étoiles, te tiens honorée devant Dieu et as été établie dans le ciel avec eux.[b]
