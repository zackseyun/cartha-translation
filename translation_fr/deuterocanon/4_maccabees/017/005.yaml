  naturalness: Le texte révisé reste soutenu mais naturel en français international. La comparaison est rendue sans ajout emphatique, et la répétition de « ciel » maintient l’imagerie ainsi que l’ambivalence contextuelle.
  terminology: « Piété » convient à εὐσέβεια dans ce contexte. « Fils » respecte le référent masculin. « Ciel » conserve délibérément l’ambivalence de οὐρανός ; « honorée devant Dieu » évite de faire de Dieu l’agent explicite de l’honneur.
