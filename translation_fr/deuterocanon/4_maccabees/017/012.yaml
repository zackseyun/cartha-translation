revisions:
- from: Car alors, la vertu présidait au concours pour ceux qui faisaient leurs preuves par leur persévérance ; la victoire se trouvait dans l’incorruptibilité, dans une vie de longue durée[a].
  to: Car alors, la vertu présidait au concours où ceux qui faisaient leurs preuves par leur endurance ; la victoire consistait dans l’incorruptibilité, dans une vie de longue durée[a].
  rationale: La révision est limitée à la syntaxe et à l’idiomaticité françaises. Elle conserve le sens actif, possiblement réfléchi dans l’usage, de δοκιμάζουσι (« faisaient leurs preuves »), l’imagerie athlétique de ἀθλοθετεῖν et l’ambiguïté délibérément préservée de ζωὴ πολυχρόνιος.
