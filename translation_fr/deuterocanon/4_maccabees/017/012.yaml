  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: fr
  text: Car alors, la vertu présidait au concours où ceux qui faisaient leurs preuves par leur endurance ; la victoire consistait dans l’incorruptibilité, dans une vie de longue durée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la vie éternelle ». Le grec dit littéralement « dans une vie de longue durée » ; l’expression voisine « dans l’incorruptibilité » peut toutefois suggérer une vie sans fin.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: présidait au concours
  rationale: Le verbe rare appartient au vocabulaire des compétitions et présente la vertu comme l’organisatrice ou l’arbitre qui préside à l’épreuve. Cette formulation conserve l’image athlétique sans recourir à un terme technique obscur.
- source_word: ἀρετή
  choice: la vertu
  rationale: Le terme désigne ici l’excellence morale et il est personnifié. « La vertu » est l’équivalent français le plus direct et le plus naturel.
- source_word: διʼ ὑπομονῆς
  choice: par leur persévérance
  rationale: Ὑπομονή exprime l’endurance ferme au milieu de l’épreuve. « Persévérance » rend naturellement en français la valeur instrumentale de διά.
- source_word: δοκιμάζουσι
  choice: ceux qui faisaient leurs preuves
  rationale: La forme grecque est un participe actif au datif pluriel. Cette traduction respecte mieux cette morphologie que le passif « ceux qui étaient mis à l’épreuve », tout en convenant au contexte où les martyrs démontrent leur fidélité par leur endurance.
- source_word: τὸ νῖκος
  choice: la victoire
  rationale: Le nom prolonge l’image du concours et se traduit directement par « victoire ».
- source_word: ἐν ἀφθαρσίᾳ
  choice: dans l’incorruptibilité
  rationale: Ἀφθαρσία peut désigner ce qui ne se corrompt ni ne périt et, par extension, l’immortalité. « Incorruptibilité » garde la portée du terme grec sans imposer explicitement cette dernière interprétation.
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: dans une vie de longue durée
  rationale: Πολυχρόνιος signifie littéralement « de longue durée ». La traduction conserve cette expression inhabituelle plutôt que de la remplacer sans indication par le terme théologiquement plus précis « éternelle ».
theological_decisions:
- issue: 'La portée de ζωῇ πολυχρονίῳ : longue durée ou éternité'
  choice: une vie de longue durée
  alternative: la vie éternelle
  rationale: Le grec parle littéralement d’une vie qui dure longtemps et n’emploie pas le terme habituel pour « éternel ». Toutefois, l’association avec ἀφθαρσία et le contexte de la récompense des martyrs peuvent donner à l’expression un sens de vie sans fin ; cette possibilité est donc signalée en note.
- issue: Le sens actif ou passif de δοκιμάζουσι
  choice: ceux qui faisaient leurs preuves
  alternative: ceux qui étaient mis à l’épreuve
  rationale: La forme transmise est grammaticalement active. Le contexte permet de comprendre que ces personnes subissent une épreuve, mais traduire directement au passif effacerait une tension réelle entre la morphologie et le contexte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La personnification de la vertu et l’image du concours sont conservées. L’imparfait donne à la scène une valeur narrative naturelle, tandis que la formulation nominale de la seconde proposition est légèrement explicitée par « se trouvait ».
