review_pass:
  verdict: revise
  source_fidelity: « Poursuivait la lutte » rend globalement l’imparfait et l’idée de conflit, mais ajoute une nuance de continuation que le grec n’exprime pas lexicalement. Le verbe ἀντηγωνίζετο signifie ici « luttait / était aux prises », avec l’adversaire laissé implicite. La note actuelle décrit de façon imprécise le littéral (« rivalisait dans la lutte »).
  naturalness: La phrase est intelligible et le registre convient. « Luttait » est plus direct, plus naturel et plus proche du grec que « poursuivait la lutte ». « Observaient » restitue mieux θεωρέω dans son sens de regard attentif de spectateurs que « regardaient ».
  terminology: « Le tyran » convient. « Le monde » et « la vie des humains » préservent la personnification rhétorique et la référence collective de ὁ τῶν ἀνθρώπων βίος. Aucun ajout théologique n’est introduit.
  issues:
  - severity: medium
    issue: Nuance ajoutée par « poursuivait la lutte »
    rationale: Cette expression suggère explicitement la continuation d’une lutte déjà engagée. L’imparfait grec présente l’action comme en cours, mais ne comporte pas le verbe « poursuivre ». « Luttait » conserve l’aspect sans cette précision supplémentaire.
  - severity: medium
    issue: Note explicative lexicalement imprécise
    rationale: « Rivalisait dans la lutte » ne représente pas naturellement ἀντηγωνίζετο. Il faut signaler simplement l’idée d’affrontement et l’absence d’adversaire exprimé dans la proposition grecque.
  revised_text: Le tyran luttait[a] ; mais le monde et la vie des humains observaient.
