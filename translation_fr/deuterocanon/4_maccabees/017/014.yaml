  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: fr
  text: Le tyran luttait[a] ; mais le monde et la vie des humains observaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec évoque une lutte ou un affrontement. L’adversaire n’est pas exprimé dans cette proposition, mais il ressort du contexte.
    reason: Précise le sens du verbe et l’objet implicite sans l’ajouter au texte principal.
lexical_decisions:
- source_word: ὁ τύραννος
  choice: le tyran
  rationale: « Tyran » conserve la valeur nettement péjorative du terme grec et convient au dirigeant oppresseur du contexte.
- source_word: ἀντηγωνίζετο
  choice: poursuivait la lutte
  rationale: L’imparfait exprime une action continue, tandis que le préverbe ἀντι- marque l’affrontement. Cette formulation française demeure naturelle sans ajouter dans le texte un complément d’objet que le grec laisse implicite.
- source_word: ὁ δὲ κόσμος
  choice: mais le monde
  rationale: δέ introduit ici un contraste entre l’action du tyran et le regard des témoins. La personnification de κόσμος est conservée.
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: la vie des humains
  rationale: Cette traduction maintient l’expression collective et élevée du grec, ainsi que sa personnification, dans un français moderne et inclusif.
- source_word: ἐθεώρει
  choice: regardaient
  rationale: L’imparfait rend l’observation prolongée. Le pluriel est naturel en français avec les deux sujets coordonnés, « le monde » et « la vie des humains ».
theological_decisions:
- issue: Personnification du monde et de la vie des humains en tant que spectateurs
  choice: Conserver les deux sujets personnifiés dans le texte principal.
  alternative: 'Reformuler de manière abstraite : « le monde de la vie humaine observait ».'
  rationale: Le grec met en scène un spectacle de portée universelle en présentant le monde et la vie humaine comme témoins. Garder cette image préserve sa force rhétorique sans lui imposer une interprétation théologique supplémentaire.
- issue: Complément implicite de ἀντηγωνίζετο
  choice: Ne pas ajouter « contre eux » dans le texte principal, mais signaler en note que l’adversaire ressort du contexte.
  alternative: 'Traduire : « poursuivait la lutte contre eux ».'
  rationale: Le contexte permet de comprendre que le tyran lutte contre les martyrs, mais le grec ne les nomme pas dans cette proposition. L’absence de complément préserve donc l’implicite de l’original.
translation_notes:
  register: Français international moderne, digne et légèrement élevé. Le point-virgule rend l’équilibre rhétorique des deux propositions. « La vie des humains » évite le masculin générique tout en conservant la portée collective et personnifiée de l’expression grecque.
