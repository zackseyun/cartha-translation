base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/023.yaml
  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
translation:
  language: fr
  text: Car le tyran Antiochos, voyant leur courage viril[a], leur vertu et leur persévérance dans les tortures, donna publiquement leur persévérance en exemple à ses soldats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bravoure ». Le terme grec désigne traditionnellement un courage associé à l’idéal masculin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνδρίαν
  choice: courage viril
  rationale: Le syntagme rend à la fois l'idée de courage et la coloration explicitement masculine du terme grec, sans employer le français peu naturel « virilité » dans cette énumération morale.
- source_word: ἀρετὴν
  choice: vertu
  rationale: Dans ce contexte éthique, le mot désigne la qualité ou l'excellence morale; « vertu » est naturel et précis.
- source_word: βασάνοις
  choice: tortures
  rationale: Dans ce récit de martyre, le terme renvoie aux sévices infligés, et non à de simples épreuves.
- source_word: ὑπομονὴν
  choice: persévérance
  rationale: Le mot exprime la constance tenace sous la souffrance. Le même choix est conservé aux deux occurrences.
- source_word: ἀφιδὼν
  choice: ayant considéré
  rationale: Cette formulation rend le participe et suggère qu'Antiochos a observé et reconnu leurs qualités, plutôt qu'une simple perception visuelle.
- source_word: ἀνεκήρυξεν
  choice: présenta publiquement
  rationale: Le verbe implique une déclaration publique; avec le complément « comme un exemple », cette tournure est idiomatique en français.
- source_word: ὑπόδειγμα
  choice: un exemple
  rationale: Le terme désigne un modèle proposé à l'imitation.
- source_word: στρατιώτας
  choice: soldats
  rationale: Il s'agit directement des militaires placés sous l'autorité d'Antiochos.
theological_decisions:
- issue: Coloration masculine du terme éthique ἀνδρία
  choice: courage viril
  alternative: courage; bravoure; virilité
  rationale: « Courage viril » conserve la dimension masculine présente dans le grec tout en restant intelligible et digne. « Courage » seul la neutraliserait, tandis que « virilité » risquerait en français moderne d'évoquer surtout la masculinité physique ou sexuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la répétition de « persévérance » présente dans le grec et conserve la valeur causale de γάρ par « Car ».
