  text: These also vindicated the nation[a], looking to God and enduring torments even to death.
translation:
  language: fr
  text: Eux aussi ont obtenu justice pour la nation[a], en tournant leurs regards vers Dieu et en supportant les tortures jusqu’à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont vengé la nation » ou « ont fait reconnaître le droit de la nation ». Le verbe grec peut évoquer la vengeance, la justice rendue ou la réhabilitation; dans ce contexte de martyre, il ne suppose pas nécessairement des représailles exercées par les martyrs.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ καὶ
  choice: Eux aussi
  rationale: Reprend naturellement les personnes évoquées dans le contexte tout en conservant la valeur additive de καί.
- source_word: ἐξεδίκησαν
  choice: ont obtenu justice pour
  rationale: Le verbe peut exprimer l’action de venger ou de faire justice. Dans ce contexte de martyre non violent, cette formulation conserve la dimension judiciaire sans suggérer que les martyrs ont exercé eux-mêmes des représailles.
- source_word: τὸ ἔθνος
  choice: la nation
  rationale: Désigne ici le peuple juif considéré comme une collectivité nationale; « nation » maintient cette portée corporative.
- source_word: εἰς θεὸν ἀφορῶντες
  choice: en tournant leurs regards vers Dieu
  rationale: Rend l’orientation explicite du regard et de l’attention vers Dieu, sans ajouter une interprétation doctrinale.
- source_word: τὰς βασάνους
  choice: les tortures
  rationale: Dans le récit du martyre, le terme désigne des sévices infligés, et non de simples souffrances ou tourments intérieurs.
- source_word: μέχρι θανάτου
  choice: jusqu’à la mort
  rationale: Exprime directement la limite extrême jusqu’à laquelle ils ont persévéré.
- source_word: ὑπομείναντες
  choice: en supportant
  rationale: Traduit l’endurance ferme sous l’épreuve et s’intègre naturellement à la construction participiale française.
theological_decisions:
- issue: Portée de ἐξεδίκησαν dans le contexte du martyre
  choice: Leur endurance a obtenu justice pour la nation.
  alternative: Ils ont vengé la nation; ils ont réhabilité la nation.
  rationale: Le grec garde une nuance judiciaire ou rétributive. « Obtenir justice » évite de présenter les martyrs comme les auteurs d’une vengeance violente, tout en laissant ouverte la manière exacte dont leur martyre agit en faveur de la nation devant Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les deux participes grecs sous forme de groupes en « en », ainsi que l’ambiguïté judiciaire de ἐξεδίκησαν grâce à la note.
