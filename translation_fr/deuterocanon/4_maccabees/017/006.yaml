  text: For your childbearing was from Abraham the child[a].
translation:
  language: fr
  text: Car ta maternité remontait à Abraham, le serviteur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enfant ». Le mot grec peut désigner soit un enfant, soit un serviteur ; dans ce contexte, « serviteur » est probablement le sens visé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦ γὰρ
  choice: Oui, car
  rationale: ἦ renforce ici l’affirmation, tandis que γάρ introduit son explication. « Oui, car » restitue ces deux nuances dans un français naturel.
- source_word: ἡ παιδοποιία σου
  choice: ta fécondité
  rationale: παιδοποιία désigne le fait d’engendrer ou de mettre au monde des enfants. Dans cette adresse à la mère, « ta fécondité » reste concret tout en s’intégrant naturellement à l’idée d’une origine remontant à Abraham.
- source_word: ἀπὸ Ἀβραὰμ
  choice: venait d’Abraham
  rationale: ἀπό marque ici l’origine; « venait de » exprime simplement la filiation ou la source.
- source_word: τοῦ παιδός
  choice: le serviteur
  rationale: παῖς peut désigner un enfant ou un serviteur. Appliqué à Abraham dans ce contexte révérencieux, « serviteur » est probablement le sens visé, sans la connotation sociale plus forte d’« esclave ».
theological_decisions:
- issue: Sens de παῖς appliqué à Abraham
  choice: Abraham, le serviteur
  alternative: Abraham, l’enfant
  rationale: Le titre évoque vraisemblablement Abraham comme serviteur de Dieu. L’ambiguïté lexicale réelle est néanmoins conservée dans une note plutôt que résolue sans indication.
translation_notes:
  register: Français moderne, digne et accessible. La formulation concise conserve le lien d’origine avec Abraham et signale l’ambiguïté de παῖς sans ajouter « de Dieu » au texte principal.
