translation:
  language: fr
  text: 'Car Moïse dit : « Et tous ceux qui ont été consacrés[a] sont sous tes mains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui ont été sanctifiés » ou « tous les saints ». Le participe grec désigne ceux qui ont été rendus saints ou mis à part.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sous tes mains ». Cette image peut évoquer la puissance, la protection ou l’autorité de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: dit
  rationale: Le présent grec introduisant une citation se rend naturellement en français par le présent littéraire « dit ».
- source_word: οἱ ἡγιασμένοι
  choice: ceux qui ont été consacrés
  rationale: Le participe parfait passif désigne des personnes rendues saintes ou mises à part; cette formulation conserve à la fois le sens passif et le résultat durable.
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: sous tes mains
  rationale: La traduction garde le pluriel et l’image concrète du grec sans réduire la métaphore à la puissance, à la protection ou à l’autorité.
theological_decisions:
- issue: Formulation de la citation attribuée à Moïse
  choice: Maintenir une citation directe et son image des personnes placées « sous tes mains »
  alternative: 'Paraphraser : « tous les saints sont en ton pouvoir »'
  rationale: Le texte présente explicitement Moïse comme locuteur et conserve une image dont la portée peut inclure puissance, garde ou autorité; la traduction ne tranche pas entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la citation et l’image concrète des « mains » sont préservées; « consacrés » rend explicitement la valeur passive du participe grec.
