  text: Bless the Lord[a], sun and moon; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Soleil et lune, bénissez le Seigneur ; chantez ses louanges et exaltez-le souverainement pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour les siècles ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle le soleil et la lune à bénir Dieu. « Bénissez » conserve la texture répétitive et liturgique du cantique, tout en restant naturel en français biblique moderne.
- source_word: ἥλιος καὶ σελήνη
  choice: soleil et lune
  rationale: Les deux astres sont directement interpellés. Leur placement en tête rend clairement le vocatif et donne au verset un mouvement poétique naturel.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte hymnique juif, κύριος désigne Dieu. « Le Seigneur » est la traduction française usuelle sans ajouter une convention typographique absente du grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime une louange chantée. Cette formulation restitue sa nuance musicale avec clarté.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préverbe intensif ὑπερ- appelle une expression plus forte que le simple « exaltez ». « Au plus haut » préserve cette intensité sans lourdeur excessive.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée perpétuelle. « Pour toujours » est clair et naturel, tandis que la traduction plus formelle est signalée en note.
theological_decisions:
- issue: Traduction de κύριος dans un cantique deutérocanonique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le grec porte κύριος sans convention graphique correspondant aux petites capitales. « Le Seigneur » désigne fidèlement Dieu sans importer une distinction typographique fondée sur un autre texte source.
- issue: Portée temporelle de εἰς τοὺς αἰῶνας
  choice: pour toujours
  alternative: pour les siècles
  rationale: La traduction principale rend la valeur idiomatique de perpétuité, tandis que la note conserve la forme plurielle concrète du grec et l’ambiguïté propre au langage des « siècles ».
translation_notes:
  register: Français international moderne, digne et poétique. L’ordre « Soleil et lune » clarifie l’apostrophe. Le parallélisme liturgique et l’intensité du verbe composé sont conservés sans archaïsmes.
