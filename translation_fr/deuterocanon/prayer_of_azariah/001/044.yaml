base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/044.yaml
  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur[a], gelée et froid ; chantez ses louanges et exaltez-le par-dessus tout, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Louez le Seigneur, gelée et froid ». L’impératif grec εὐλογεῖτε peut se traduire par « bénissez » ou, plus généralement, par « louez » ; « bénissez » est retenu pour préserver le refrain du cantique.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à bénir, c’est-à-dire à célébrer le Seigneur. « Bénissez » conserve le refrain liturgique et la structure répétée du cantique.
- source_word: ῥῖγος
  choice: gelée
  rationale: Le terme désigne le froid vif ou la gelée. « Gelée » le distingue naturellement de ψῦχος en français.
- source_word: καὶ
  choice: et
  rationale: Conjonction simple reliant les deux phénomènes naturels interpellés.
- source_word: ψῦχος
  choice: froid
  rationale: Le mot désigne le froid ou la froidure. « Froid » est le terme moderne le plus direct et forme avec « gelée » une paire distincte.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rendu français habituel de κύριος dans cette adresse liturgique.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime une louange chantée. Cette formulation restitue sa dimension musicale dans un français naturel.
- source_word: καὶ ὑπερυψοῦτε
  choice: et exaltez-le par-dessus tout
  rationale: Le verbe composé exprime une exaltation portée au plus haut degré. « Par-dessus tout » rend l’intensification sans lourdeur excessive.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom objet renvoie au Seigneur ; il est naturellement intégré à « exaltez-le ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression idiomatique marquant une durée sans fin ; « pour toujours » est clair, actuel et adapté au registre doxologique.
theological_decisions:
- issue: Traduction de κύριος dans un hymne grec deutérocanonique
  choice: le Seigneur
  alternative: Seigneur
  rationale: « Le Seigneur » est la formulation française naturelle avec le verbe « bénir » et ne tranche aucune question théologique au-delà du texte.
- issue: Portée de εὐλογεῖτε dans l’appel adressé à la création
  choice: Bénissez
  alternative: Louez
  rationale: « Bénissez » préserve la formulation liturgique répétée du cantique, tandis que la note signale le sens plus général possible de louange.
translation_notes:
  register: Français international moderne, digne et liturgique. La syntaxe parallèle de l’original est conservée, avec des formulations idiomatiques qui maintiennent la distinction entre ῥῖγος et ψῦχος ainsi que la nuance musicale de ὑμνεῖτε.
