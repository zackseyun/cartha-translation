base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/019.yaml
  text: Do not put us to shame[a], but show us mercy according to your gentleness and according to the abundance of your mercy[b],
translation:
  language: fr
  text: Ne nous couvre pas de honte, mais agis envers nous avec miséricorde, selon ta clémence[a] et selon l’abondance de ta miséricorde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douceur bienveillante » ou « indulgence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταισχύνῃς
  choice: couvre pas de honte
  rationale: Le verbe signifie « faire honte, déshonorer ». La tournure « couvrir de honte » est naturelle et digne en français, sans renforcer le sens jusqu’à « humilier ».
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: agis envers nous avec miséricorde
  rationale: Cette formulation conserve la construction concrète, littéralement « fais miséricorde avec nous », tout en donnant un français naturel. « Fais-nous miséricorde » serait également possible, mais relève d’un registre plus traditionnel.
- source_word: ἐπιείκειάν
  choice: clémence
  rationale: Dans cette supplication, le mot évoque la modération bienveillante, l’indulgence ou la douceur dans l’exercice du jugement. « Clémence » exprime précisément cette nuance sans la confondre avec ἔλεος.
- source_word: πλῆθος
  choice: abondance
  rationale: Le nom exprime ici une très grande quantité. « Abondance » s’emploie naturellement avec « miséricorde » et préserve l’idée de profusion.
- source_word: ἐλέους
  choice: miséricorde
  rationale: Dans le contexte d’une prière pénitentielle, « miséricorde » rend la compassion accordée à ceux qui implorent Dieu et maintient la force suppliante du grec.
theological_decisions:
- issue: Distinction entre ἐπιείκεια et ἔλεος dans la description des qualités divines
  choice: clémence et miséricorde
  alternative: douceur et compassion
  rationale: 'Le grec emploie deux termes apparentés mais distincts. Les différencier préserve la double portée de l’appel : Dieu est prié d’agir conformément à sa modération bienveillante et à sa miséricorde abondante.'
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « selon » ainsi que celle de « miséricorde » sont conservées afin de respecter le parallélisme et l’insistance du grec.
