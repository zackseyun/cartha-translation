base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, grands animaux marins[a] et tout ce qui se meut dans les eaux ; chantez ses louanges et exaltez-le au plus haut point pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monstres marins » ou « baleines ». Le grec κήτη est un terme large désignant de grands êtres aquatiques.
    reason: 'Alternative lexicale : κήτη peut désigner de grandes créatures marines, notamment des baleines, ou des monstres marins selon le contexte.'
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel est rendu directement et conserve le refrain liturgique, sans le réduire au sens plus général de « louez ».
- source_word: κήτη
  choice: grands animaux marins
  rationale: Le terme grec désigne largement de grands êtres aquatiques et peut aussi évoquer des monstres marins ou, traditionnellement, des baleines. Cette formulation naturelle préserve son caractère générique et sa dimension.
- source_word: πάντα τὰ κινούμενα
  choice: vous tous qui vous mouvez
  rationale: La tournure vocative explicite l’adresse aux êtres aquatiques tout en conservant la totalité et le mouvement exprimés par le participe grec.
- source_word: ἐν τοῖς ὕδασι
  choice: dans les eaux
  rationale: Le pluriel du grec est conservé et convient au registre biblique français.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte hymnique juif, κύριος est le titre divin usuel ; « Seigneur » le rend sans supposer directement la présence du tétragramme dans le texte grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette expression française naturelle conserve la nuance proprement musicale du verbe grec.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le souverainement
  rationale: Le préfixe intensif ὑπερ- appelle une exaltation au plus haut degré ; « souverainement » restitue cette force dans un registre hymnique digne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression idiomatique traduit ici la durée perpétuelle du refrain.
theological_decisions:
- issue: Traduction du titre divin κύριος dans un cantique deutérocanonique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le témoin grec porte κύριον et non le tétragramme. « Le Seigneur » traduit donc le texte attesté sans introduire une distinction typographique fondée sur un original hébreu non présent ici.
translation_notes:
  register: Français international moderne, digne et hymnique. Le parallélisme impératif et le refrain sont maintenus ; l’adresse directe est rendue explicitement pour une lecture naturelle.
