  text: And deliver us according to your wonders, and give glory to your name, O Lord;
translation:
  language: fr
  text: Et délivre-nous selon tes merveilles[a], et donne gloire à ton nom, Seigneur[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon tes œuvres merveilleuses ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « donne gloire à ton nom » conserve l’idiome biblique ; on pourrait aussi comprendre : « fais éclater la gloire de ton nom » ou « glorifie ton nom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελοῦ
  choice: délivre-nous
  rationale: L’aoriste impératif de ἐξαιρέω exprime ici une demande de secours adressée à Dieu. « Délivre-nous » est naturel dans une prière et conserve l’idée d’une intervention salvatrice.
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: selon tes merveilles
  rationale: 'κατά avec l’accusatif indique la conformité ou la mesure : le salut demandé doit correspondre aux interventions extraordinaires de Dieu. « Tes merveilles » reste proche du grec et peut désigner ses actes merveilleux.'
- source_word: δὸς δόξαν
  choice: donne gloire
  rationale: La traduction directe de l’impératif et de son complément préserve la formulation audacieuse de la prière, sans l’interpréter d’emblée comme « fais éclater la gloire » ou « glorifie ».
- source_word: τῷ ὀνόματί σου
  choice: à ton nom
  rationale: Le datif marque le destinataire de la gloire. La formulation conserve l’idiome biblique du « nom » comme expression de l’identité révélée et de l’honneur de Dieu.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif est rendu par une apostrophe directe. En français moderne, « Seigneur ! » garde la dignité de la prière sans nécessiter l’interjection archaïsante « ô ».
theological_decisions:
- issue: Sens des « merveilles » divines
  choice: tes merveilles
  alternative: tes œuvres merveilleuses
  rationale: Le grec peut désigner les prodiges eux-mêmes ou les actes extraordinaires de Dieu. Le choix retenu préserve cette amplitude sémantique plutôt que de la réduire à une catégorie précise d’actions.
- issue: Gloire donnée au nom divin
  choice: donne gloire à ton nom
  alternative: fais éclater la gloire de ton nom
  rationale: La formulation retenue conserve l’idiome et la tension du grec, où Dieu est prié de donner gloire à son propre nom. L’alternative explicite davantage l’effet visé, mais ajoute une interprétation.
- issue: Rendu du vocatif κύριε
  choice: Seigneur
  alternative: ô Seigneur
  rationale: « Seigneur » identifie Dieu conformément au texte et marque directement l’adresse, tandis que l’absence de « ô » maintient un français actuel et digne.
translation_notes:
  register: Français international moderne, au registre priant et digne. La coordination répétée par « et » suit le mouvement simple du grec. L’expression « donne gloire à ton nom » est volontairement conservée malgré son caractère moins courant, afin de ne pas effacer l’idiome théologique du texte source.
