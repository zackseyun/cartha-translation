  text: Bless the Lord[a], fire and heat; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, feu et chaleur brûlante[a] ; chantez ses louanges et exaltez-le très haut pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chaleur ardente ».'
    reason: Alternative lexicale pour καῦμα, qui désigne une chaleur intense ou brûlante.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle les éléments interpellés à bénir le Seigneur. « Bénissez » conserve la formulation liturgique récurrente et le lien lexical direct avec le grec.
- source_word: πῦρ
  choice: feu
  rationale: Équivalent français direct et naturel pour cette réalité créée personnifiée dans le cantique.
- source_word: καῦμα
  choice: chaleur brûlante
  rationale: Le terme désigne une forte chaleur, une chaleur ardente. Cette expression le distingue clairement de πῦρ tout en rendant son intensité.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend naturellement κύριος comme titre divin sans introduire explicitement le nom divin hébreu absent du texte grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime une louange chantée ; cette formulation française en conserve la nuance musicale.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: La formulation restitue la forte valeur intensive du verbe composé sans devenir obscure ou pesante.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française idiomatique qui rend ici la durée sans fin exprimée par la locution grecque.
theological_decisions:
- issue: Traduction de κύριος dans un refrain liturgique deutérocanonique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: « Le Seigneur » suit directement le titre grec et l’usage chrétien français courant, sans faire apparaître typographiquement le tétragramme que le texte grec ne donne pas.
translation_notes:
  register: Français moderne, digne et chantant. Le parallélisme impératif du refrain est conservé, avec une ponctuation qui maintient l’apostrophe adressée au feu et à la chaleur brûlante.
