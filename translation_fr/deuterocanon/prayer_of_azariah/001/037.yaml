base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Eaux et tout ce qui est au-dessus du ciel[a], bénissez le Seigneur ; chantez ses louanges et exaltez-le très haut pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre collectivement : « toutes les réalités qui sont au-dessus du ciel » ; ici, « ciel » peut désigner le ciel visible ou la sphère céleste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel invite les éléments de la création à bénir le Seigneur. « Bénissez » conserve la formulation liturgique récurrente, contrairement au terme plus général « louez ».
- source_word: ὕδατα
  choice: Eaux
  rationale: Le pluriel grec est conservé et convient à l’apostrophe poétique adressée aux éléments cosmiques.
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: tout ce qui est au-dessus du ciel
  rationale: Le neutre pluriel substantivé désigne collectivement toutes les réalités situées au-dessus du ciel. Cette formulation est naturelle en français tout en respectant le singulier οὐρανοῦ du témoin grec.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Traduction française usuelle du titre divin κύριος, sans introduire une convention typographique liée au tétragramme absent du texte grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime spécifiquement la louange chantée ; cette tournure en garde la nuance musicale dans un français courant.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: La tournure rend la valeur intensive du composé grec tout en restant intelligible et digne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain doxologique, cette expression transmet naturellement en français la durée indéfinie exprimée par le pluriel grec.
theological_decisions:
- issue: Traduction de κύριος dans un cantique grec deutérocanonique
  choice: le Seigneur
  alternative: SEIGNEUR
  rationale: Le texte source porte κύριον et non directement le nom divin hébreu ; « le Seigneur » suit donc le témoin grec sans importer la convention des petites capitales.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsmes. L’ordre a été légèrement réorganisé afin de rendre explicite l’apostrophe aux eaux et aux réalités célestes, conformément à la syntaxe grecque.
