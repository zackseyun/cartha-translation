base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/050.yaml
  text: Bless the Lord, lightnings and clouds; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Éclairs et nuages, bénissez le Seigneur ; chantez ses louanges et exaltez-le au plus haut pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: Rend directement l’impératif grec et conserve la formule liturgique répétée du cantique.
- source_word: ἀστραπαὶ
  choice: éclairs
  rationale: Le pluriel grec désigne les éclairs comme phénomènes célestes personnifiés et appelés à louer Dieu.
- source_word: νεφέλαι
  choice: nuages
  rationale: Équivalent français courant et précis du pluriel grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Exprime naturellement en français l’action de célébrer quelqu’un par un hymne.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Préserve la force intensive du préfixe grec ὑπερ- sans recourir au tour peu naturel « surexaltez ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Formulation française naturelle de l’expression temporelle grecque, qui signifie ici une louange sans fin.
theological_decisions:
- issue: Sens de « bénir » lorsque des éléments de la création ont Dieu pour objet
  choice: bénissez le Seigneur
  alternative: louez le Seigneur
  rationale: Le grec emploie explicitement εὐλογεῖτε. La traduction conserve donc la tension biblique selon laquelle la création « bénit » Dieu, plutôt que de l’aplanir en simple louange.
- issue: Intensité de ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  alternative: exaltez-le souverainement
  rationale: Ce choix garde l’intensification du verbe grec dans une langue actuelle, sans lui ajouter une qualification doctrinale étrangère au texte.
translation_notes:
  register: Style poétique, liturgique et dignifié, avec apostrophe initiale naturelle en français moderne. Le parallélisme des impératifs et l’élan cumulatif du grec sont conservés.
