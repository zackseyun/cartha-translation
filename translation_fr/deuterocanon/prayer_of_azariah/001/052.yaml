base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/052.yaml
  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, montagnes et collines ; chantez ses louanges et exaltez-le souverainement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à bénir le Seigneur. « Bénissez » conserve le vocabulaire liturgique et le refrain du cantique sans réduire le verbe à « louez ».
- source_word: ὄρη καὶ βουνοί
  choice: montagnes et collines
  rationale: Cette formulation naturelle et transparente distingue les deux reliefs et préserve leur parallélisme poétique.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Le grec porte κύριον. « Le Seigneur » en est l’équivalent français usuel dans ce contexte doxologique grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée. Cette tournure restitue clairement sa dimension musicale en français moderne.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préfixe intensif ὑπερ- demande davantage que le simple « exaltez ». « Au plus haut » rend cette intensification de manière naturelle et solennelle.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom objet renvoie au Seigneur ; le pronom français masculin singulier convient naturellement.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain liturgique, l’expression désigne une durée sans fin. « Pour toujours » est clair, actuel et fidèle au sens idiomatique.
theological_decisions:
- issue: Traduction de κύριος dans une doxologie issue du texte grec
  choice: le Seigneur
  alternative: l’Éternel
  rationale: La source porte κύριος et non le tétragramme hébreu. « Le Seigneur » traduit directement le grec sans importer une convention propre aux textes hébreux.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsme. La syntaxe conserve l’adresse directe aux montagnes et aux collines ainsi que les trois impératifs du grec.
