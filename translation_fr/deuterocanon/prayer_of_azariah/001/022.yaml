  text: let them know that you alone are the Lord God and glorious over all the inhabited earth[a].
translation:
  language: fr
  text: Qu’ils sachent que toi seul, tu es le Seigneur Dieu et que tu es glorieux dans toute la terre habitée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le monde entier ». Le grec οἰκουμένη désigne la terre ou le monde habité.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώτωσαν
  choice: Qu’ils sachent
  rationale: L’impératif aoriste à la troisième personne du pluriel a ici une valeur jussive, rendue naturellement en français par « Qu’ils sachent ».
- source_word: σὺ
  choice: toi… tu
  rationale: Le pronom grec explicite est emphatique. La dislocation « toi… tu », naturelle en français moderne, conserve cette insistance.
- source_word: Κύριος θεὸς
  choice: le Seigneur Dieu
  rationale: Rend les deux désignations divines sans les dissocier; « Seigneur » est le titre révérenciel usuel de κύριος dans ce contexte de prière juive grecque.
- source_word: μόνος
  choice: seul
  rationale: « Toi seul » exprime clairement l’exclusivité affirmée par μόνος tout en conservant une syntaxe française naturelle.
- source_word: ἔνδοξος
  choice: glorieux
  rationale: L’adjectif décrit la gloire ou la majesté de Dieu; « glorieux » conserve cette prédication sans la réduire à la réputation ni à un honneur conféré.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: dans toute la terre habitée
  rationale: οἰκουμένη désigne littéralement la terre habitée. « Dans toute » rend ici naturellement en français la portée universelle de ἐπί avec l’accusatif, sans imposer exclusivement l’idée de domination.
theological_decisions:
- issue: Exclusivité divine exprimée par μόνος avec Κύριος θεὸς
  choice: toi seul, tu es le Seigneur Dieu
  alternative: tu es le seul Seigneur Dieu
  rationale: La formulation choisie préserve l’accent porté par le pronom explicite σὺ et exprime l’exclusivité divine sans transformer « Seigneur Dieu » en un titre composé rigide.
- issue: Coordination de καὶ ἔνδοξος
  choice: et que tu es glorieux
  alternative: et glorieux
  rationale: La répétition française de « que tu es » rend clairement les deux prédications coordonnées par καί, tout en évitant une construction peu naturelle associant directement le groupe nominal « le Seigneur Dieu » et l’adjectif « glorieux ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure jussive est conservée; l’emphase du pronom grec et les deux prédications coordonnées restent perceptibles. « Terre habitée » garde la nuance concrète de οἰκουμένη, avec une variante plus idiomatique en note.
