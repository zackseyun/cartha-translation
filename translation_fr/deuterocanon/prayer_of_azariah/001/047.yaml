translation:
  language: fr
  text: Bénissez le Seigneur, givre et neige ; chantez ses louanges et exaltez-le très haut pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles ».'
