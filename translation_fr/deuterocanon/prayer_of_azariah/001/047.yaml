lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel conserve le refrain liturgique et l’appel adressé aux éléments de la création.
- source_word: πάχναι
  choice: givre
  rationale: Le terme désigne le gel blanc ou la gelée blanche ; « givre » est précis, courant et naturel dans cette adresse poétique.
- source_word: χιόνες
  choice: neige
  rationale: Bien que le grec emploie le pluriel, le français désigne naturellement ce phénomène par le nom collectif singulier « neige ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Traduction française habituelle et contextuellement appropriée de κύριος dans ce texte grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette formulation naturelle en français préserve la dimension explicitement chantée du verbe.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: La locution rend la force intensive du verbe, qui signifie exalter souverainement ou au plus haut degré.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression idiomatique française correspondant ici à la durée perpétuelle du refrain.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κύριος, sans élément imposant ici la typographie réservée au nom divin hébreu.
- issue: Portée du pronom dans le second impératif
  choice: ses louanges
  alternative: chantez des hymnes
  rationale: Le complément « ses » explicite en français naturel que le chant est adressé au Seigneur, comme l’indiquent le contexte et le pronom αὐτόν qui suit, sans modifier le référent.
translation_notes:
  register: Français moderne, digne et adapté à la lecture publique. La structure exhortative et le parallélisme liturgique sont préservés ; la ponctuation distingue l’adresse aux éléments naturels des impératifs.
