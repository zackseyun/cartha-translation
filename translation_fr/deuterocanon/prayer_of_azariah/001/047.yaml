  source_fidelity: Le texte rend fidèlement les deux impératifs pluriels adressés au givre et à la neige, ainsi que la progression « bénissez / chantez des hymnes / exaltez ». « Le Seigneur » correspond bien à τὸν κύριον, et « pour toujours » rend idiomatiquement εἰς τοὺς αἰῶνας. La note conserve utilement la formulation plus littérale de la finale.
