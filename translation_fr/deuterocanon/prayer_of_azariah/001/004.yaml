  text: For you are righteous in all that you have done to us, and all your works are true, and your ways are straight, and all your judgments are true.
translation:
  language: fr
  text: Car tu es juste dans tout ce que tu nous as fait, toutes tes œuvres sont vraies, tes voies sont droites et tous tes jugements sont vrais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: juste
  rationale: Dans ce contexte, l’adjectif qualifie la parfaite rectitude morale de Dieu dans sa manière d’agir. « Juste » est naturel en français et garde la portée judiciaire et éthique du grec.
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: dans tout ce que tu nous as fait
  rationale: Cette formulation rend directement la construction grecque et maintient sans l’atténuer l’action de Dieu envers les locuteurs.
- source_word: ἔργα
  choice: œuvres
  rationale: « Œuvres » correspond directement aux actes de Dieu et demeure courant dans le registre biblique français.
- source_word: ἀληθινὰ / ἀληθιναί
  choice: vraies / vrais
  rationale: Le même adjectif grec qualifie les œuvres et les jugements de Dieu. La répétition de « vrai » conserve le parallélisme et peut exprimer à la fois vérité et fiabilité.
- source_word: ὁδοί
  choice: voies
  rationale: « Voies » conserve l’image biblique des chemins pour désigner la manière d’agir de Dieu.
- source_word: εὐθεῖαι
  choice: droites
  rationale: « Droites » préserve la métaphore spatiale du grec tout en suggérant naturellement la rectitude.
- source_word: κρίσεις
  choice: jugements
  rationale: Le terme désigne ici les décisions ou verdicts de Dieu; « jugements » est précis, naturel et théologiquement non restrictif.
theological_decisions:
- issue: La justice de Dieu face aux souffrances subies par les locuteurs
  choice: Maintenir l’affirmation directe selon laquelle Dieu est juste dans tout ce qu’il leur a fait.
  alternative: Employer une formulation indirecte laissant entendre que Dieu a seulement permis ces événements.
  rationale: Le grec dit explicitement « ce que tu nous as fait ». La traduction conserve cette tension théologique au lieu d’atténuer l’action divine.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle du grec est conservée sans produire une syntaxe archaïque; la répétition finale de « vrai » est volontaire.
