base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/059.yaml
  text: Bless the Lord[a], sons of men; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, vous, fils des hommes[a] ; chantez ses louanges et exaltez-le hautement pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « enfants des humains » ou « êtres humains ». Littéralement : « fils des hommes ».'
    reason: L’expression grecque est formellement masculine, mais peut désigner collectivement l’ensemble des êtres humains.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel de εὐλογέω conserve ici sa force liturgique et doxologique ; « bénissez » rend le grec plus directement que le terme plus général « louez ».
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: vous, fils des hommes
  rationale: Cette expression masculine signifie idiomatiquement les êtres humains. « Fils des hommes » préserve l’image et la forme du grec ; « vous » rend l’apostrophe naturelle en français.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » est l’équivalent français naturel de κύριος dans ce contexte liturgique grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: ὑμνέω désigne une louange chantée ; cette formulation en exprime clairement la dimension musicale et doxologique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préfixe intensif ὑπερ- appelle une expression plus forte que le simple verbe « exalter » ; « au plus haut » reste naturel et solennel.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans cette formule doxologique, l’expression signifie une durée sans fin ; « pour toujours » est clair et idiomatique en français moderne.
theological_decisions:
- issue: Rendu de κύριος
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κύριος. « Le Seigneur » le traduit directement sans réintroduire dans le corps du texte une forme hébraïque qui n’y figure pas explicitement.
- issue: Portée de l’expression anthropologique masculine
  choice: fils des hommes
  alternative: êtres humains
  rationale: Le grec emploie une expression masculine mais idiomatiquement collective. Le texte principal en conserve l’image et l’ambiguïté de forme, tandis que la note précise sa portée possible.
translation_notes:
  register: Français international moderne, digne et liturgique. Le parallélisme des impératifs est maintenu, et « chantez ses louanges » explicite sans lourdeur la nuance musicale de ὑμνέω.
