base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/051.yaml
  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Que la terre bénisse le Seigneur ; qu’elle chante des hymnes et l’exalte hautement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: Que… bénisse
  rationale: L’impératif à la troisième personne prend naturellement en français la forme « que » suivie du subjonctif. « Bénisse » conserve le registre biblique et l’appel liturgique adressé à la création.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Dans cette séquence cosmique, γῆ désigne la terre comme élément de la création, non un territoire particulier.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » est le titre français établi et convient au contexte doxologique.
- source_word: ὑμνείτω
  choice: qu’elle le célèbre par ses chants
  rationale: Cette formulation naturelle rend à la fois l’idée de louange et la nuance chantée de ὑμνέω, sans suggérer nécessairement une forme moderne précise de cantique.
- source_word: ὑπερυψούτω
  choice: l’exalte souverainement
  rationale: Le composé intensif appelle davantage que le simple « exalter ». « Souverainement » exprime ici un degré suprême dans un registre digne et idiomatique.
- source_word: αὐτὸν
  choice: le / l’
  rationale: Le pronom objet renvoie au Seigneur et il est répété devant chacun des deux verbes coordonnés pour assurer la clarté du français.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression rend naturellement en français la durée indéfinie de la formule doxologique grecque.
theological_decisions:
- issue: Traduction de κύριος dans un hymne grec deutérocanonique
  choice: le Seigneur
  alternative: le Maître
  rationale: Le contexte est celui d’une louange liturgique adressée à Dieu ; « le Seigneur » est le titre biblique français usuel, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme exhortatif du grec est conservé par la répétition de « que ». La ponctuation en point-virgule maintient les deux membres étroitement liés.
