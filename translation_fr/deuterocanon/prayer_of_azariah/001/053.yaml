base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/053.yaml
  text: Bless the Lord, all things that grow on the earth; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Vous toutes, plantes qui poussez sur la terre, bénissez le Seigneur ; chantez des hymnes en son honneur et exaltez-le hautement, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à bénir le Seigneur et conserve le caractère liturgique du refrain.
- source_word: πάντα τὰ φυόμενα
  choice: vous toutes, plantes qui poussez
  rationale: Le participe substantivé désigne collectivement tout ce qui croît ou germe. « Plantes » rend naturellement cette réalité en français, tandis que l’apostrophe avec « vous » permet de conserver l’impératif pluriel.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: ἐπί avec le génitif exprime ici la localisation ; « sur la terre » en donne le sens direct.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Cette traduction respecte l’article grec et la formulation liturgique adressée au Dieu d’Israël, sans introduire un nom divin absent du texte.
- source_word: ὑμνεῖτε
  choice: chantez sa louange
  rationale: Le verbe comporte l’idée de louer par un chant ou un hymne. Cette formulation est naturelle en français moderne et garde la nuance musicale.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préfixe intensif de ce verbe composé appelle une expression plus forte que le simple « exaltez » ; « par-dessus tout » restitue cette intensification sans lourdeur excessive.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain liturgique, l’expression idiomatique désigne une durée sans fin ; « pour toujours » est clair et naturel.
theological_decisions:
- issue: Traduction de κύριος dans le refrain liturgique deutérocanonique
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le grec porte l’article dans τὸν κύριον. « Le Seigneur » le reflète et n’introduit pas le tétragramme, qui ne figure pas dans le texte grec.
translation_notes:
  register: Français international moderne, digne et liturgique. L’apostrophe « Vous toutes » personnifie explicitement la végétation, comme le fait la série d’impératifs adressés à la création, tout en évitant une tournure collective au singulier qui effacerait le pluriel grec.
