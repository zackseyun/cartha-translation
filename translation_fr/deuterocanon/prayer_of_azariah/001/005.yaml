base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: fr
  text: Tu as rendu des jugements conformes à la vérité dans tout ce que tu as fait venir sur nous et sur ta ville sainte, Jérusalem, la ville de nos pères. Car c’est selon la vérité et la justice[a] que tu as fait toutes ces choses, à cause de nos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon la vérité et le jugement ». Le terme grec peut désigner le jugement ou la justice ; il appartient à la même famille de mots que « jugements » au début du verset.
    reason: Alternative lexicale et préservation de la répétition judiciaire du grec.
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: des jugements conformes à la vérité
  rationale: Cette formulation conserve le caractère judiciaire de κρίματα et rend clairement le génitif ἀληθείας comme la norme à laquelle ces jugements sont conformes.
- source_word: ἐποίησας
  choice: tu as rendu / tu as fait
  rationale: Avec « jugements », le français idiomatique dit « rendre des jugements » ; avec « toutes ces choses », « faire » convient naturellement. Cette variation découle des compléments différents du même verbe grec.
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν
  choice: dans tout ce que tu as fait venir sur nous
  rationale: « Faire venir sur » exprime le sens causatif d’ἐπάγω sans préciser au-delà du grec la nature des malheurs ou du châtiment.
- source_word: πόλιν σου τὴν ἁγίαν
  choice: ta ville sainte
  rationale: Équivalent français naturel et traditionnel qui conserve la portée religieuse de ἁγίαν.
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: Jérusalem, la ville de nos pères
  rationale: L’apposition explicite naturellement en français le lien ancestral exprimé par le grec.
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: selon la vérité et la justice
  rationale: « Selon » exprime ici la norme de l’action divine. « Justice » rend naturellement κρίσις dans ce contexte, tout en laissant en note l’autre possibilité, plus strictement judiciaire.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: à cause de nos péchés
  rationale: διά avec l’accusatif indique explicitement la cause ; cette traduction est claire et conserve la force confessionnelle de la phrase.
theological_decisions:
- issue: Maintien du langage judiciaire appliqué aux actes de Dieu
  choice: Conserver « jugements » dans la première proposition et « justice » dans la seconde, avec une note signalant « jugement ».
  alternative: Employer partout des formulations générales comme « ce qui est juste », ou répéter littéralement « jugement ».
  rationale: Le texte confesse que les calamités subies sont des actes judiciaires conformes à la vérité et motivés par les péchés du peuple. « Justice » est plus naturel dans la seconde locution française, tandis que la note préserve la répétition et l’ambiguïté lexicales du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans conserver des tournures artificielles ; la ponctuation divise la longue période en deux phrases pour la clarté.
