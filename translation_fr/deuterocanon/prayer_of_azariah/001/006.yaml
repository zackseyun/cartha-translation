  text: for we have sinned in all things[a], and we have acted lawlessly by turning away from you, and we have sinned greatly in all things.
translation:
  language: fr
  text: Car nous avons péché en toutes choses, nous avons agi contre ta loi en nous détournant de toi, et nous avons gravement péché[a] en toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec employé ici est plus fort que celui traduit plus haut par « nous avons péché ». Autre traduction possible : « nous avons péché très gravement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: nous avons péché
  rationale: L’aoriste de ἁμαρτάνω exprime ici l’aveu d’actes accomplis. Le passé composé convient au ton confessionnel en français moderne.
- source_word: ἐν πᾶσι
  choice: en toutes choses
  rationale: Cette formulation conserve la portée globale et l’indétermination de l’expression grecque, qui peut viser l’ensemble des domaines ou des actes.
- source_word: ἠνομήσαμεν
  choice: nous avons agi au mépris de ta loi
  rationale: Le verbe ἀνομέω désigne une conduite contraire à la loi. Cette traduction préserve cette dimension sans employer le peu naturel « agir illégalement » dans un contexte religieux.
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: en nous détournant de toi
  rationale: L’infinitif précise en quoi consiste la conduite contraire à la loi. « Se détourner » rend à la fois la rupture relationnelle et l’éloignement exprimés par le grec.
- source_word: ἐξημάρτομεν
  choice: nous avons gravement péché
  rationale: Le composé intensif est plus fort que le premier ἡμάρτομεν. L’adverbe « gravement » rend cette intensification clairement et naturellement.
theological_decisions:
- issue: Maintien de la différence entre ἡμάρτομεν et le verbe intensif ἐξημάρτομεν
  choice: Traduire d’abord « nous avons péché », puis « nous avons gravement péché ».
  alternative: Traduire les deux verbes simplement par « nous avons péché ».
  rationale: Le grec intensifie le second aveu. Conserver cette progression respecte la force rhétorique et théologique de la confession sans préciser indûment la nature de la gravité.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement est conservé dans l’adresse à Dieu, conformément à l’usage biblique français courant. « Au mépris de ta loi » garde la référence à la loi tout en évitant une tournure artificielle.
