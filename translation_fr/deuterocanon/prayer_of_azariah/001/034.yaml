base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Toutes les œuvres du Seigneur, bénissez le Seigneur ; chantez sa louange et exaltez-le hautement pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les âges » ; cette expression grecque désigne ici une louange qui dure à jamais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel garde la force liturgique et doxologique de εὐλογέω, tout en restant naturel en français biblique moderne.
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: vous toutes, œuvres du Seigneur
  rationale: Cette formulation rend explicite l’apostrophe vocative adressée à la totalité des œuvres du Seigneur, sans réduire ἔργα aux seules créatures.
- source_word: Κυρίου / τὸν κύριον
  choice: du Seigneur / le Seigneur
  rationale: « Seigneur » est l’équivalent français naturel de κύριος ici ; les deux formes respectent respectivement le génitif et le complément direct grecs.
- source_word: ὑμνεῖτε
  choice: chantez sa louange
  rationale: Le verbe ὑμνέω évoque une louange chantée. Cette expression en transmet la nuance hymnique plus clairement que le simple verbe « louez ».
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préfixe intensif de ὑπερυψόω est préservé par « au plus haut », dans un registre élevé mais compréhensible.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain hymnique, l’expression idiomatique indique une durée sans fin ; « pour toujours » est sa formulation française la plus naturelle.
theological_decisions:
- issue: Traduction de κύριος dans un hymne grec deutérocanonique
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le grec porte κύριος sans permettre, à lui seul, d’imposer ici la convention typographique « SEIGNEUR ». « Seigneur » conserve l’adresse liturgique et évite d’ajouter une précision absente de la forme grecque.
- issue: Portée de πάντα τὰ ἔργα Κυρίου
  choice: œuvres du Seigneur
  alternative: créatures du Seigneur
  rationale: « Œuvres » préserve l’étendue du terme ἔργα et l’ambiguïté entre ce que Dieu a créé et l’ensemble de ses accomplissements, alors que « créatures » restreindrait le sens.
translation_notes:
  register: Français international moderne, digne et liturgique. L’ordre de l’apostrophe est légèrement explicité par « Vous toutes » afin que le vocatif soit immédiatement intelligible. Le parallélisme des trois impératifs est conservé.
