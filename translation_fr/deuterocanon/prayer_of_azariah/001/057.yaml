base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Vous tous, oiseaux du ciel, bénissez le Seigneur ; chantez ses louanges et exaltez-le par-dessus tout pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel conserve l’appel liturgique récurrent et distingue ce verbe de ὑμνεῖτε.
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: vous tous, oiseaux du ciel
  rationale: πετεινά peut désigner les oiseaux ou, plus largement, les créatures ailées ; « oiseaux du ciel » est naturel en français et convient à ce catalogue de la création.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Le grec porte κύριον ; « le Seigneur » en est le titre français direct, sans substituer dans le texte grec le tétragramme hébreu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime une louange chantée ; cette formulation actuelle préserve la nuance musicale sans suggérer nécessairement une forme particulière de cantique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préverbe intensif ὑπερ- demande davantage que le simple « exaltez » ; « par-dessus tout » restitue cette force dans un français naturel.
- source_word: αὐτὸν
  choice: ses / le
  rationale: Le pronom renvoie au Seigneur. En français, il est rendu idiomatiquement par le possessif dans « ses louanges », puis explicitement par « le » dans « exaltez-le ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression idiomatique de durée perpétuelle, rendue clairement en français moderne.
theological_decisions:
- issue: Traduction de κύριος dans cette exhortation doxologique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: La source grecque présente κύριος et non le tétragramme lui-même. « Le Seigneur » respecte donc directement le texte disponible sans ajouter une mise en forme liée au nom divin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’inversion lourde a été évitée ; « Vous tous » clarifie que le vocatif englobe l’ensemble des oiseaux. La cadence parallèle du refrain est conservée.
