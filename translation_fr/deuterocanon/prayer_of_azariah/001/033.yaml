  yaml_path: translation/deuterocanon/prayer_of_azariah/001/033.yaml
  text: Blessed are you in the firmament of heaven, and praised and glorified forever.
translation:
  language: fr
  text: Béni sois-tu dans la voûte du ciel, digne de louange et glorifié pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: voûte
  rationale: Dans l’expression « στερέωμα τοῦ οὐρανοῦ », « voûte du ciel » rend naturellement l’image cosmologique du firmament sans recourir au terme français plus technique et vieilli « firmament ».
- source_word: ὑμνητός
  choice: digne de louange
  rationale: L’adjectif verbal exprime que Dieu doit être célébré ou loué; cette formulation conserve sa valeur adjectivale et s’accorde avec « glorifié ».
- source_word: δεδοξασμένος
  choice: glorifié
  rationale: Le participe parfait passif de δοξάζω est rendu directement, en conservant le parallélisme liturgique.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française courante et digne pour la durée indéfinie formulée littéralement « pour les âges ».
theological_decisions:
- issue: Statut de ὑμνητός
  choice: digne de louange
  alternative: loué
  rationale: Le grec emploie un adjectif verbal plutôt qu’un participe indiquant simplement une action accomplie; la traduction retenue préserve cette nuance sans ajouter de doctrine.
translation_notes:
  register: Formulation liturgique, actuelle et solennelle. Le tutoiement suit l’adresse directe singulière du grec et l’usage français courant dans la prière biblique.
