base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/010.yaml
  text: And now we cannot open our mouth[a]; shame and reproach have come upon your servants and those who revere you.
translation:
  language: fr
  text: 'Et maintenant, nous ne pouvons pas ouvrir la bouche : la honte et l’opprobre sont tombés sur tes esclaves[a] et sur ceux qui te révèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes serviteurs ». Le grec dit littéralement « tes esclaves », ce qui souligne leur appartenance et leur entière subordination à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: ouvrir la bouche
  rationale: Cette expression idiomatique évoque directement la capacité ou la liberté de parler. Le français naturel emploie la même image.
- source_word: αἰσχύνη
  choice: la honte
  rationale: « Honte » rend directement l’état d’humiliation exprimé par le terme grec.
- source_word: ὄνειδος
  choice: l’opprobre
  rationale: « Opprobre » conserve la dimension publique du blâme et forme avec « honte » une paire française digne et précise.
- source_word: ἐγενήθη
  choice: sont tombés sur
  rationale: Dans ce contexte, cette tournure française exprime naturellement la situation pénible qui atteint les personnes visées, sans reproduire maladroitement le sens littéral « sont devenus ».
- source_word: δούλων σου
  choice: tes esclaves
  rationale: Le grec désigne des personnes appartenant à un maître et placées sous son autorité. « Esclaves » préserve cette force, malgré sa rudesse en français moderne.
- source_word: τῶν σεβομένων σε
  choice: ceux qui te révèrent
  rationale: Le verbe exprime une vénération respectueuse et pieuse ; « révèrent » évite de réduire le sens soit à la peur, soit au seul culte.
theological_decisions:
- issue: Désignation des fidèles comme δοῦλοι de Dieu
  choice: tes esclaves
  alternative: tes serviteurs
  rationale: « Esclaves » maintient l’idée de dépendance et d’appartenance présente dans le grec. L’alternative traditionnelle, plus douce en français religieux, est signalée en note sans effacer la tension du texte.
translation_notes:
  register: Français moderne, solennel mais accessible. La locution « ouvrir la bouche » conserve l’image grecque tout en restant idiomatique. « Opprobre » relève d’un registre soutenu approprié à la prière. La répétition de « sur » clarifie que les deux groupes sont atteints par la honte et l’opprobre.
