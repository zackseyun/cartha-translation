base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: fr
  text: Comme les sacrifices entièrement consumés de béliers et de taureaux, comme des dizaines de milliers d’agneaux gras, qu’ainsi notre sacrifice soit aujourd’hui devant toi et fasse expiation devant toi[a] ; car ceux qui ont placé leur confiance en toi ne connaissent pas la honte. Et qu’il soit pleinement accompli devant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « derrière toi », expression inhabituelle dans ce contexte. Elle est généralement comprise ici au sens de « devant toi » ou « en ta présence ». Le verbe traduit par « fasse expiation » peut aussi évoquer l’idée de rendre propice ou d’être agréé.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est condensé : littéralement, « accomplir pleinement derrière toi ». Le verbe exprime l’accomplissement ou l’achèvement ; le sujet n’est pas répété, mais se rapporte vraisemblablement au sacrifice. L’expression « derrière toi », également présente plus haut, est difficile et peut être comprise idiomatiquement comme « devant toi » ou « en ta présence ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: sacrifices entièrement consumés
  rationale: Le terme désigne des offrandes entièrement consumées par le feu. Cette formulation française en explicite la nature sacrificielle sans employer « holocaustes », mot aujourd’hui susceptible d’évoquer d’abord un autre référent.
- source_word: κριῶν καὶ ταύρων
  choice: béliers et taureaux
  rationale: Ces équivalents précis et courants conviennent à l’énumération d’animaux sacrificiels.
- source_word: μυριάσιν
  choice: dizaines de milliers
  rationale: Le grec évoque littéralement des myriades, c’est-à-dire des unités de dix mille ; la formulation retenue communique clairement cette ampleur.
- source_word: ἀρνῶν πιόνων
  choice: agneaux gras
  rationale: πίων signifie gras, bien nourri ou de choix. « Agneaux gras » conserve directement l’image d’animaux de grande valeur sacrificielle.
- source_word: θυσία
  choice: sacrifice
  rationale: Le contexte cultuel et la comparaison avec les animaux offerts appellent le terme précis « sacrifice » plutôt que le plus général « offrande ».
- source_word: ἐξιλάσαι
  choice: serve d’expiation
  rationale: Le verbe appartient au champ de l’expiation et de l’apaisement. Cette tournure garde son poids sacrificiel tout en restant naturelle en français.
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: ceux qui ont mis leur confiance en toi
  rationale: Le participe parfait exprime une confiance placée en Dieu et qui demeure ; le passé composé français rend cette nuance mieux qu’un simple présent.
- source_word: τελειῶσαι ὄπισθέν σου
  choice: que nous te suivions pleinement
  rationale: La construction est très condensée. ὄπισθέν σου signifie littéralement « derrière toi » et peut exprimer l’action de suivre, tandis que τελειῶσαι apporte l’idée d’accomplissement ou de plénitude. La traduction conserve ainsi le mouvement de suite et l’idée de totalité sans reproduire une expression française obscure.
theological_decisions:
- issue: Portée sacrificielle de ἐξιλάσαι
  choice: serve d’expiation en ta présence
  alternative: soit agréé devant toi / te rende propice
  rationale: « Expiation » préserve le langage cultuel explicite du verbe sans préciser davantage le mécanisme théologique. La note signale aussi la possibilité contextuelle d’une demande d’agrément.
- issue: Sens de τελειῶσαι ὄπισθέν σου
  choice: que nous te suivions pleinement
  alternative: qu’il soit mené à son accomplissement devant toi
  rationale: Le grec associe un verbe d’accomplissement à l’expression littérale « derrière toi ». Celle-ci peut naturellement évoquer le fait de suivre Dieu, mais la syntaxe comprimée permet aussi de rattacher l’accomplissement au sacrifice. Le texte principal retient la lecture relationnelle sans dissimuler l’autre analyse.
translation_notes:
  register: Français international moderne, solennel mais accessible. La longue comparaison sacrificielle est conservée, avec une ponctuation qui clarifie la prière. Le choix « sacrifices entièrement consumés » évite une translittération potentiellement trompeuse, tandis que les deux notes rendent visibles les difficultés réelles de ὄπισθέν σου et de la syntaxe finale.
