revisions:
- from: Comme avec des béliers et des taureaux offerts en sacrifices entièrement consumés, et comme avec des dizaines de milliers d’agneaux gras, qu’ainsi notre sacrifice soit aujourd’hui devant toi et serve d’expiation en ta présence[a] ; car il n’y a pas de honte pour ceux qui ont mis leur confiance en toi. Et que nous te suivions pleinement[b].
  to: Comme les sacrifices entièrement consumés de béliers et de taureaux, comme des dizaines de milliers d’agneaux gras, qu’ainsi notre sacrifice soit aujourd’hui devant toi et fasse expiation devant toi[a] ; car ceux qui ont placé leur confiance en toi ne connaissent pas la honte. Et qu’il soit pleinement accompli devant toi[b].
  rationale: 'La correction nécessaire porte sur la clause finale : elle doit demander que le sacrifice soit accompli ou mené à son terme, et non que les priants suivent Dieu. La note correspondante est refondue afin de documenter honnêtement la formulation grecque difficile, sans faire de l’idée de « suivre » une alternative textuellement fondée. Les autres choix sont conservés avec des ajustements mineurs de formulation pour une syntaxe française naturelle et une correspondance plus étroite avec le parallèle grec.'
  reviewer_model: gpt-5.6-terra
