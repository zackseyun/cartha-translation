translation:
  language: fr
  text: Ne nous livre pas entièrement[a], à cause de ton nom, et ne romps pas ton alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à la fin »; l’expression peut aussi signifier « totalement » ou « pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie littéralement « disperser » ou « éparpiller ». Avec « alliance », il peut exprimer l’idée de la rompre ou de l’annuler.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς ἡμᾶς
  choice: Ne nous livre pas
  rationale: « Livrer » rend directement παραδίδωμι et conserve l’idée que le peuple serait abandonné au pouvoir de la destruction ou de ses ennemis, sans préciser ce que le grec laisse implicite.
- source_word: εἰς τέλος
  choice: entièrement
  rationale: Dans cette supplication, l’expression peut marquer l’aboutissement ou la totalité. « Entièrement » en exprime naturellement la portée idiomatique, tandis que la traduction plus littérale est signalée en note.
- source_word: διὰ τὸ ὄνομά σου
  choice: à cause de ton nom
  rationale: Cette formulation sobre conserve le lien causal exprimé par διά et l’appel au nom de Dieu, sans expliciter davantage la notion de réputation ou d’honneur.
- source_word: μὴ διασκεδάσῃς
  choice: ne disperse pas
  rationale: Le verbe signifie concrètement « disperser » ou « éparpiller ». Malgré l’image inhabituelle appliquée à une alliance, ce choix la préserve plutôt que de la remplacer silencieusement par une conclusion juridique.
- source_word: τὴν διαθήκην
  choice: ton alliance
  rationale: Dans ce contexte biblique, διαθήκη désigne l’alliance de Dieu avec son peuple; « alliance » est le terme français établi et précis.
theological_decisions:
- issue: Portée de εἰς τέλος dans la demande adressée à Dieu
  choice: entièrement
  alternative: jusqu’au bout; pour toujours
  rationale: Le contexte permet une nuance de totalité ou d’issue finale. Le texte principal exprime la totalité sans transformer la supplication en affirmation exclusivement temporelle; la note maintient l’ambiguïté.
- issue: Image de l’alliance « dispersée »
  choice: ne disperse pas ton alliance
  alternative: ne romps pas ton alliance; n’annule pas ton alliance
  rationale: « Rompre » et « annuler » sont plus idiomatiques en français, mais déterminent plus précisément l’effet juridique ou relationnel. La formulation retenue conserve l’image concrète et surprenante du grec, les interprétations usuelles étant données en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Ne nous livre pas » garde la force concrète du grec; « ne disperse pas ton alliance » assume volontairement une image inhabituelle, éclairée par une note plutôt que lissée dans le texte.
