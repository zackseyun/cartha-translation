base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: fr
  text: Tu es béni, toi qui regardes les abîmes[a], assis sur les chérubins[b], digne de louange et hautement exalté pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les profondeurs ». Le pluriel grec évoque les abîmes cosmiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « trônant au-dessus des chérubins ». Le grec dit plus littéralement « assis sur les chérubins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: Tu es béni
  rationale: Cette formulation conserve l’indicatif grec et l’adresse directe à Dieu, sans transformer la bénédiction en souhait.
- source_word: ὁ ἐπιβλέπων
  choice: toi qui regardes
  rationale: Le participe substantivé décrit celui qui porte son regard sur les profondeurs; «regardes» préserve le sens visuel sans ajouter l’idée de protection providentielle.
- source_word: ἀβύσσους
  choice: les abîmes
  rationale: Le pluriel est conservé, ainsi que l’imagerie cosmique des profondeurs abyssales.
- source_word: καθήμενος
  choice: assis
  rationale: Rendu direct du participe grec; «siégeant» ou «trônant» expliciterait une nuance royale seulement implicite.
- source_word: ἐπὶ χερουβεὶν
  choice: sur les chérubins
  rationale: «Sur» rend simplement ἐπί et maintient l’image biblique sans préciser indûment «au-dessus de».
- source_word: αἰνετὸς
  choice: digne de louange
  rationale: L’adjectif exprime que Dieu mérite la louange, plutôt que le seul fait qu’il est effectivement loué.
- source_word: ὑπερυψούμενος
  choice: exalté au plus haut
  rationale: Cette expression rend la forte élévation portée par le préfixe ὑπερ- tout en restant naturelle en français doxologique.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français courant de la formule doxologique exprimant la perpétuité.
theological_decisions:
- issue: Image du trône divin associée aux chérubins
  choice: assis sur les chérubins
  alternative: trônant au-dessus des chérubins
  rationale: Le grec dit littéralement «assis sur les chérubins». La traduction retenue préserve cette formulation sans introduire explicitement le trône ni fixer la relation spatiale comme «au-dessus de».
- issue: Valeur de αἰνετός dans la doxologie
  choice: digne de louange
  alternative: loué
  rationale: 'Le choix garde la valeur évaluative de l’adjectif: Dieu mérite la louange. «Loué» pourrait plutôt décrire l’action de ceux qui le célèbrent.'
translation_notes:
  register: Français international moderne, digne et liturgique. La syntaxe reste accessible tout en conservant la succession doxologique et les images du texte grec.
