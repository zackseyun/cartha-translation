  yaml_path: translation/deuterocanon/prayer_of_azariah/001/008.yaml
  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: fr
  text: Et maintenant, tout ce que tu as fait venir sur nous et tout ce que tu as fait à notre égard, tu l’as fait selon un jugement véritable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un jugement juste », « avec un jugement véritable » ou « en toute justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Rend directement la conjonction et l’adverbe temporel, qui introduisent la reconnaissance présente des actes de Dieu.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Expression française naturelle qui conserve la portée globale de la formule grecque, répétée dans les deux propositions parallèles.
- source_word: ἐπήγαγες
  choice: tu as fait venir sur
  rationale: Préserve l’idée de faire survenir quelque chose sur les locuteurs sans préciser davantage qu’il s’agit d’un châtiment ou d’une calamité.
- source_word: ἐποίησας ἡμῖν
  choice: tu nous as fait
  rationale: Rend simplement le verbe et le datif dans ce contexte défavorable, sans l’infléchir vers le sens opposé de « fait pour nous ».
- source_word: ἐν ἀληθινῇ κρίσει
  choice: selon un jugement véritable
  rationale: « Selon » exprime naturellement en français la norme ou le caractère du jugement; « véritable » correspond à ἀληθινῇ sans remplacer implicitement ce terme par « juste ».
- source_word: ἐποίησας
  choice: tu l’as fait
  rationale: Le pronom reprend naturellement en français l’ensemble des actes précédemment énumérés et conserve l’affirmation directe de l’action divine.
theological_decisions:
- issue: Caractérisation des actes de Dieu envers les locuteurs
  choice: Les événements survenus sont explicitement attribués à Dieu et déclarés accomplis selon un jugement véritable.
  alternative: « par un juste jugement » ou « avec justice »
  rationale: Le texte grec maintient ensemble l’action divine et sa qualification par ἀληθινῇ κρίσει. La traduction ne diminue pas cette attribution et n’élabore pas non plus une doctrine de la rétribution au-delà du verset.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du parallélisme grec tout en étant naturelle; le tutoiement correspond à l’adresse directe à Dieu dans le contexte de la prière.
