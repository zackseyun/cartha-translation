base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/058.yaml
  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, quadrupèdes et bêtes de la terre ; chantez ses louanges et exaltez-le hautement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: Impératif pluriel qui appelle les créatures à bénir le Seigneur ; ce choix préserve le refrain liturgique et le distingue de ὑμνεῖτε.
- source_word: τετράποδα
  choice: quadrupèdes
  rationale: Rend directement « les êtres à quatre pieds » dans un français courant, précis et adapté à une énumération poétique.
- source_word: θηρία τῆς γῆς
  choice: bêtes de la terre
  rationale: Conserve l'expression concrète et cosmique du grec sans préciser indûment qu'il s'agit seulement d'animaux sauvages.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rendu français usuel de κύριος dans une adresse hymnique à Dieu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Exprime la dimension proprement hymnique du verbe, plus précisément que le simple « louez ».
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le composé intensif appelle une exaltation suprême ; cette formulation naturelle maintient sa force.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Rend idiomatiquement la durée perpétuelle du refrain doxologique.
theological_decisions:
- issue: Rendu de κύριος dans une adresse hymnique deutérocanonique à Dieu
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » correspond à l'usage biblique français et au contexte d'adoration, sans introduire une nuance étrangère.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme impératif et la distinction entre bénir, chanter les louanges et exalter sont conservés.
