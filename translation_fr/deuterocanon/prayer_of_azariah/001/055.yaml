  text: Bless the Lord, seas and rivers; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Mers et fleuves, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à bénir le Seigneur. « Bénissez » conserve la formulation liturgique et la construction avec un complément d’objet direct.
- source_word: θάλασσαι
  choice: mers
  rationale: Le pluriel grec est conservé et maintient la personnification poétique de plusieurs étendues marines.
- source_word: ποταμοί
  choice: fleuves
  rationale: « Fleuves » est un équivalent français naturel dans ce couple poétique avec « mers » et convient aux grands cours d’eau évoqués par ποταμοί.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: κύριος fonctionne ici comme titre divin ; « le Seigneur » suit directement le texte grec sans introduire le tétragramme.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe désigne l’action de célébrer par un hymne ou un chant. Cette formulation rend explicitement sa nuance musicale en français courant.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le composé intensif exprime une exaltation suprême. « Au plus haut » restitue cette force tout en gardant une formulation française digne et naturelle.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain liturgique, « pour toujours » exprime naturellement la durée indéfinie de la formule grecque.
theological_decisions:
- issue: Traduction de κύριος comme titre divin
  choice: le Seigneur
  alternative: le Maître ; le SEIGNEUR
  rationale: Le texte grec porte κύριον et non le tétragramme. « Le Seigneur » demeure donc la traduction la plus directement fondée sur la source, sans capitalisation interprétative supplémentaire.
translation_notes:
  register: Style hymnique, direct et solennel. L’apostrophe initiale « Mers et fleuves » rend naturellement en français l’appel adressé à la création. Le parallélisme des deux impératifs et l’intensité du refrain sont préservés.
