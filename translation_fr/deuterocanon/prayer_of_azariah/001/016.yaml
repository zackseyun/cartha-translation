lexical_decisions:
- source_word: ἀλλʼ
  choice: mais
  rationale: Marque le contraste avec l’absence d’offrandes sacrificielles évoquée auparavant.
- source_word: ἐν
  choice: avec
  rationale: Exprime ici la condition ou la manière dans laquelle l’accueil est demandé; « avec » est naturel en français.
- source_word: ψυχῇ
  choice: âme
  rationale: Préserve la portée anthropologique et dévotionnelle du terme ainsi que sa distinction avec πνεύματι.
- source_word: συντετριμμένῃ
  choice: brisée
  rationale: Rend l’image d’un état de brisement, exprimé par le participe parfait passif, sans la réduire d’emblée à la seule notion de contrition.
- source_word: πνεύματι
  choice: esprit
  rationale: Désigne ici la disposition intérieure et conserve le parallélisme avec « âme ».
- source_word: τεταπεινωμένῳ
  choice: humilié
  rationale: Reflète l’état d’abaissement exprimé par le parfait passif; le contexte pénitentiel donne au mot le sens d’un esprit abaissé devant Dieu.
- source_word: προσδεχθείημεν
  choice: puissions-nous être accueillis
  rationale: Rend l’optatif passif comme une prière exprimant le souhait d’un accueil favorable.
theological_decisions:
- issue: Parallélisme anthropologique entre ψυχή et πνεῦμα
  choice: Conserver la distinction par « âme » et « esprit »
  alternative: Fondre les deux termes dans une expression générale telle que « être intérieur »
  rationale: Le grec emploie deux mots distincts en parallèle; les maintenir préserve la texture littéraire et l’ambiguïté anthropologique du texte.
- issue: Image pénitentielle de συντετριμμένῃ
  choice: Traduire par « brisée »
  alternative: « contrite »
  rationale: « Brisée » reste plus près de l’image grecque de ce qui a été brisé ou broyé, tandis que « contrite » en explicite le sens pénitentiel.
- issue: Valeur de τεταπεινωμένῳ
  choice: Traduire par « humilié »
  alternative: « abaissé » ou « rendu humble »
  rationale: Le parfait passif décrit un esprit placé dans un état d’abaissement. « Humilié » garde cette force passive, sans préciser si cet état est imposé ou volontaire.
translation_notes:
  register: Français moderne, digne et priant. La tournure optative « puissions-nous » conserve la valeur de supplication; « être accueillis » est plus relationnel et idiomatique que « être acceptés ».
