  text: Mais puissions-nous être accueillis avec une âme brisée et un esprit abaissé ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une âme contrite et un esprit rendu humble ».'
