base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/032.yaml
  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
translation:
  language: fr
  text: Béni sois-tu sur le trône de ton royaume[a], hautement loué et souverainement exalté pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le trône de ta royauté ». Le mot grec peut désigner le royaume, la royauté ou le règne.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  choice: Béni
  rationale: Adjectif attribut dans une formule liturgique de bénédiction. « Béni sois-tu » rend naturellement en français l’adresse doxologique sans réduire le terme au seul sens de « loué ».
- source_word: ἐπὶ θρόνου
  choice: sur le trône
  rationale: Rend directement la valeur locative de ἐπί avec le génitif et conserve l’image concrète du trône.
- source_word: τῆς βασιλείας σου
  choice: de ton royaume
  rationale: βασιλεία peut désigner le royaume, la royauté ou le règne. « Royaume » forme ici une expression naturelle avec « trône », tandis qu’une note préserve l’autre nuance principale.
- source_word: ὑπερυμνητός
  choice: digne de la plus haute louange
  rationale: Le composé intensif exprime une louange suprême. Cette formulation est idiomatique, digne et distingue clairement ce terme du participe suivant.
- source_word: ὑπερυψωμένος
  choice: souverainement élevé
  rationale: Rend la forte valeur intensive du composé et son registre doxologique sans développer l’image au-delà du grec.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français naturel de l’expression idiomatique qui marque la perpétuité.
theological_decisions:
- issue: Adresse doxologique et image du trône
  choice: 'Adresse directe à Dieu : « Béni sois-tu sur le trône de ton royaume »'
  alternative: « Béni es-tu sur le trône de ta royauté »
  rationale: Le grec associe directement la bénédiction de Dieu au trône de sa βασιλεία. Le texte conserve cette image sans ajouter explicitement « toi qui sièges » ou « intronisé », absents de la formulation source.
translation_notes:
  register: Français international moderne, liturgique et digne. Le parallélisme des deux adjectifs intensifs grecs est conservé par deux expressions distinctes, sans harmoniser leurs nuances.
