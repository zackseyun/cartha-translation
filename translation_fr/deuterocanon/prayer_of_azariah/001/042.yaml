base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/042.yaml
  text: Bless the Lord[a], all spirits; sing praise and highly exalt him forever.
translation:
  language: fr
  text: Tous les esprits, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif « bénissez » conserve la force liturgique de εὐλογεῖτε et la structure répétitive du cantique, sans le réduire au simple verbe « louer ».
- source_word: πάντα τὰ πνεύματα
  choice: vous tous, esprits
  rationale: Le groupe est pris comme un vocatif adressé à l’ensemble des esprits. La tournure explicite l’apostrophe de façon naturelle en français, tout en signalant en note le sens possible de « vents ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte doxologique juif grec, κύριος est le titre révérenciel usuel désignant Dieu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette expression française restitue la dimension chantée de ὑμνεῖτε plus clairement que le seul verbe « louez ».
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: La formulation rend l’intensification portée par le préfixe ὑπερ- tout en restant compréhensible et digne en français moderne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française courante qui communique naturellement l’idée de durée perpétuelle.
theological_decisions:
- issue: Sens de πνεύματα dans l’appel hymnique
  choice: esprits
  alternative: vents
  rationale: « Esprits » est le sens direct dans cette formulation et peut désigner des êtres ou puissances spirituels. Toutefois, πνεῦμα peut aussi signifier « vent » ; cette ambiguïté lexicale réelle est donc conservée en note plutôt que tranchée silencieusement.
- issue: Rendu de κύριος comme titre divin
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » correspond à l’usage de κύριος comme titre divin dans la Septante et évite d’introduire une nuance de domination que le contexte n’exige pas.
translation_notes:
  register: Français international moderne, liturgique et digne. L’apostrophe « Vous tous, esprits » clarifie le vocatif grec ; le parallélisme des impératifs et l’intensité de ὑπερυψοῦτε sont préservés.
