  text: Bless the Lord[a], light and darkness; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Lumière et ténèbres, bénissez le Seigneur ; chantez ses louanges et exaltez-le au plus haut pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel s’adresse à la lumière et aux ténèbres. « Bénissez » conserve la force liturgique et doxologique du verbe sans le réduire au seul sens de « louez ».
- source_word: φῶς καὶ σκότος
  choice: Lumière et ténèbres
  rationale: Cette paire de contraires cosmiques est rendue directement, avec des noms sans article qui conviennent à l’apostrophe poétique en français.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Complément de l’impératif ; « le Seigneur » est la formulation française naturelle et traditionnelle pour κύριος dans ce contexte liturgique.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée ou hymnique ; cette expression en garde la dimension musicale en français courant.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préfixe intensif appelle une exaltation suprême. « Au plus haut » rend cette intensité dans une langue naturelle et digne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette formule doxologique exprime idiomatiquement une durée perpétuelle. La traduction littérale est signalée en note afin de préserver la forme grecque sous-jacente.
theological_decisions:
- issue: Rendu de κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’article grec et la syntaxe française après « bénissez » favorisent « le Seigneur », sans ajouter d’identification doctrinale absente du verset.
- issue: Portée temporelle de εἰς τοὺς αἰῶνας
  choice: pour toujours
  alternative: pour les siècles
  rationale: « Pour toujours » communique clairement la portée perpétuelle de la formule en français moderne, tandis que la note conserve son expression littérale et sa coloration liturgique.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsme. L’ordre de l’apostrophe grecque est conservé, et la répétition des impératifs maintient le mouvement exhortatif du cantique.
