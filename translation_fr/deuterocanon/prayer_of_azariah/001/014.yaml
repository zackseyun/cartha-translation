base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: fr
  text: Car, Maître, nous avons été réduits au-dessous de toutes les nations[a], et aujourd’hui nous sommes humiliés sur toute la terre[b] à cause de nos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons été rendus plus petits que toutes les nations ». Le verbe grec peut évoquer une diminution de nombre, de condition ou d’importance.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans tout le pays ». Le grec γῆ peut signifier « pays » ou « terre »; la comparaison avec toutes les nations favorise ici le sens le plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: Maître
  rationale: Le vocatif de δεσπότης exprime une autorité souveraine et se distingue de κύριος. « Maître » conserve cette nuance et l’adresse directe.
- source_word: ἐσμικρύνθημεν
  choice: nous avons été réduits
  rationale: Le verbe signifie être rendu petit, diminué ou amoindri. La formulation française suggère ici une diminution de condition ou d’importance sans la limiter au nombre.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: au-dessous de toutes les nations
  rationale: Après l’idée comparative portée par ἐσμικρύνθημεν, παρά marque la comparaison. « Au-dessous de » exprime naturellement l’abaissement relatif aux autres nations.
- source_word: ταπεινοὶ
  choice: humiliés
  rationale: Dans ce contexte de jugement et de disgrâce, l’adjectif décrit une condition d’abaissement subie plutôt qu’une vertu intérieure d’humilité.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: sur toute la terre
  rationale: γῆ peut désigner le pays ou la terre entière. Le contexte des nations favorise la portée large, tout en laissant l’autre sens en note.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent français direct et actuel de l’adverbe temporel.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: à cause de nos péchés
  rationale: διά avec l’accusatif exprime ici la cause; cette formulation conserve clairement l’aveu de culpabilité.
theological_decisions:
- issue: Titre divin δέσποτα
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: Le grec emploie δεσπότης et non κύριος. « Maître » préserve la distinction lexicale et la forte nuance d’autorité sans importer une formulation confessionnelle particulière.
translation_notes:
  register: Français moderne, digne et accessible. La structure causale, l’adresse divine et la confession collective sont conservées. « Réduits au-dessous de » évite le tour peu idiomatique « devenus plus petits que » dans le texte principal, tandis que la note maintient l’image grecque et son ambiguïté.
