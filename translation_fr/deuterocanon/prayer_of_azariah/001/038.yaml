  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
translation:
  language: fr
  text: Que toute puissance bénisse le Seigneur[a] ; chantez ses louanges et exaltez-le au plus haut point, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que toutes les puissances bénissent le Seigneur. » Le grec emploie le singulier, qui peut avoir un sens distributif ou collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογείτω
  choice: Que… bénisse
  rationale: L’impératif grec à la troisième personne est rendu naturellement en français par « Que… bénisse », tout en conservant sa force d’exhortation.
- source_word: πᾶσα ἡ δύναμις
  choice: toute puissance
  rationale: Cette formulation suit le singulier grec et peut se comprendre dans un sens distributif ou collectif, sans préciser indûment s’il s’agit de forces, de puissances créées ou d’une armée.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rendu français usuel de κύριος employé comme titre divin.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe désigne une louange chantée ; cette expression en conserve la nuance musicale dans un français naturel.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préfixe intensif ὑπερ- est exprimé par « par-dessus tout », formulation claire qui préserve l’idée d’exaltation suprême.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent idiomatique moderne de l’expression grecque indiquant une durée perpétuelle.
theological_decisions:
- issue: Portée de πᾶσα ἡ δύναμις
  choice: toute puissance
  alternative: toutes les puissances
  rationale: Le singulier du grec est conservé dans le texte principal. Une note signale la lecture distributive au pluriel, sans identifier ces puissances à une catégorie particulière d’êtres.
- issue: Rendu de κύριος
  choice: le Seigneur
  alternative: Seigneur
  rationale: Avec le complément direct du verbe « bénir », l’article défini donne l’expression française naturelle et respecte l’emploi du titre divin.
translation_notes:
  register: Français moderne, digne et liturgique. Le parallélisme exhortatif est maintenu, avec une formulation immédiatement compréhensible et sans interprétation confessionnelle ajoutée.
