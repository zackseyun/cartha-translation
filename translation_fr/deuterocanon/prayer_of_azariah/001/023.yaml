  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
translation:
  language: fr
  text: Les serviteurs du roi qui les avaient jetés dans la fournaise ne cessaient de l’alimenter de naphte[a], de poix, d’étoupe et de sarments[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bitume » ; le mot grec désigne une substance pétrolière très inflammable.
    reason: lexical_alternative
  - marker: b
    text: Ou « branchages » ; le terme grec peut désigner spécialement des rameaux de vigne coupés servant de combustible.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διέλειπον
  choice: ne cessaient d’alimenter
  rationale: L’imparfait accompagné de la négation exprime une action continue. Cette tournure française restitue naturellement l’idée qu’ils poursuivaient sans relâche leur action.
- source_word: οἱ ἐμβάλλοντες αὐτοὺς
  choice: qui les avaient jetés dedans
  rationale: Le participe désigne les mêmes serviteurs comme ceux qui avaient jeté les trois hommes dans la fournaise. Le plus-que-parfait rend clairement ce rapport narratif en français.
- source_word: ὑπηρέται τοῦ βασιλέως
  choice: les serviteurs du roi
  rationale: ὑπηρέται désigne des subordonnés au service du roi sans imposer un rang administratif précis. « Serviteurs » est clair et suffisamment large.
- source_word: καίοντες τὴν κάμινον
  choice: d’alimenter la fournaise
  rationale: Littéralement, le grec évoque le fait de faire brûler ou chauffer la fournaise. En français, « alimenter la fournaise » exprime naturellement l’action d’y ajouter continuellement des combustibles.
- source_word: ἀφθάλτῳ
  choice: naphte
  rationale: Le terme désigne une substance pétrolière très inflammable. « Naphte » le distingue de la poix mentionnée ensuite, tandis que l’autre identification possible est signalée en note.
- source_word: πίσσῃ
  choice: poix
  rationale: Équivalent direct d’une matière résineuse ou goudronneuse combustible, et terme français courant dans les traductions de ce contexte.
- source_word: στιππύῳ
  choice: étoupe
  rationale: Le mot désigne des déchets fibreux, notamment de lin, employés comme amadou ou combustible. « Étoupe » est le terme français précis.
- source_word: κληματίδα
  choice: sarments
  rationale: Le nom peut désigner spécialement des rameaux de vigne coupés et utilisés comme combustible. « Sarments » rend ce sens concret et naturel en français.
