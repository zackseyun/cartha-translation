base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: fr
  text: Vous tous qui révérez le Seigneur, bénissez le Dieu des dieux ; chantez ses louanges et rendez-lui grâce, car sa miséricorde demeure éternellement, et pour les siècles des siècles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car son amour fidèle dure éternellement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel conserve la force liturgique de εὐλογέω et la structure récurrente du cantique. L’objet « le Seigneur », implicite dans cette injonction, est explicité naturellement en français.
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: vous tous qui révérez le Seigneur
  rationale: σέβομαι exprime ici une révérence religieuse pouvant inclure le culte. « Révérez » rend le verbe grec plus directement que « craignez », qui évoquerait plutôt φοβέω.
- source_word: τὸν θεὸν τῶν θεῶν
  choice: le Dieu des dieux
  rationale: Cette formulation transparente conserve le titre biblique et son tour superlatif sans en atténuer la portée.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe désigne une louange chantée ; cette expression est naturelle en français moderne et en préserve la nuance musicale.
- source_word: ἐξομολογεῖσθε
  choice: rendez-lui grâce
  rationale: Dans ce contexte hymnique, le verbe signifie remercier ou proclamer publiquement la louange. « Rendez-lui grâce » convient au refrain qui suit.
- source_word: ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  choice: car sa miséricorde demeure éternellement
  rationale: « Miséricorde » rend directement ἔλεος. Le verbe « demeure », bien qu’implicite en grec, exprime naturellement en français la permanence indiquée par εἰς τὸν αἰῶνα.
- source_word: καὶ εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: La formule française traditionnelle reste intelligible et reproduit l’intensification solennelle de l’expression grecque.
theological_decisions:
- issue: Sens cultuel de σεβόμενοι
  choice: vous tous qui révérez le Seigneur
  alternative: vous tous qui adorez le Seigneur ; vous tous qui craignez le Seigneur
  rationale: Le grec désigne une attitude de révérence religieuse, éventuellement manifestée dans le culte. « Révérez » préserve cette amplitude sans substituer à σέβομαι le vocabulaire propre à la crainte.
- issue: Portée de ἔλεος
  choice: miséricorde
  alternative: amour fidèle ; bonté
  rationale: Puisque la source immédiate est grecque, « miséricorde » est le rendu lexical le plus direct. « Amour fidèle » demeure une possibilité interprétative, mais préciserait ici une nuance que le terme grec ne rend pas à lui seul obligatoire.
translation_notes:
  register: Français international moderne, solennel et liturgique sans archaïsmes inutiles. Le parallélisme et la progression vers « les siècles des siècles » sont conservés.
