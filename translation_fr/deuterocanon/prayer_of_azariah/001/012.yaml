  - severity: medium
    issue: Rendu de τὸν ἅγιόν σου
    rationale: « Celui qui t’est consacré » explicite une composante possible de ἅγιος, mais remplace le titre grec « ton saint » par une paraphrase interprétative. « Ton saint » est compréhensible dans ce contexte et maintient le lexique du texte.
