  source_fidelity: La demande négative et l’objet (« ne retire pas de nous ta miséricorde ») rendent fidèlement μὴ ἀποστήσῃς ... ἀφ’ ἡμῶν. « À cause de » peut exprimer le motif invoqué par διά + accusatif. En revanche, « celui que tu as aimé » affaiblit la valeur résultative de ἠγαπημένον (« bien-aimé »), et « celui qui t’est consacré » interprète ἅγιόν σου au lieu de conserver l’appellation « ton saint ».
  naturalness: La phrase est naturelle et convient à une prière au tutoiement. Les appositions brèves « ton bien-aimé » et « ton saint » sont à la fois plus idiomatiques dans ce registre et plus proches du parallélisme grec.
  terminology: « Miséricorde » et « serviteur » sont appropriés. « Bien-aimé » rend naturellement le participe passif ἠγαπημένον. « Saint » conserve le terme ἅγιος sans lui imposer un sens ecclésiastique; le contexte patriarcal et la note identifiante écartent toute confusion.
