base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: fr
  text: Ne retire pas de nous ta miséricorde[a], à cause d’Abraham, ton bien-aimé, d’Isaac, ton serviteur, et d’Israël, ton saint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’éloigne pas de nous ta miséricorde ».
    reason: lexical_alternative
  - marker: b
    text: « Israël » désigne ici le patriarche Jacob sous le nom d’Israël.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: retire
  rationale: Avec « ta miséricorde » comme complément, le verbe exprime ici le fait d’enlever ou de retirer. « Retirer » est naturel dans une prière et conserve la portée relationnelle du grec.
- source_word: τὸ ἔλεός
  choice: ta miséricorde
  rationale: ἔλεος désigne la miséricorde ou la compassion. « Miséricorde » convient au registre digne de la prière sans ajouter une nuance absente du grec.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διὰ présente ici les patriarches comme fondement de la supplication. « À cause de » préserve cette valeur tout en évitant de préciser davantage le mécanisme théologique de l’appel.
- source_word: τὸν ἠγαπημένον ὑπὸ σοῦ
  choice: celui que tu as aimé
  rationale: Cette formulation rend explicitement la construction passive et l’agent « par toi », avec un français courant et digne.
- source_word: δοῦλόν
  choice: serviteur
  rationale: Dans ce titre honorifique appliqué à Isaac, l’idée de service fidèle est au premier plan; « esclave » accentuerait excessivement le statut social.
- source_word: τὸν ἅγιόν σου
  choice: celui qui t’est consacré
  rationale: Le substantif adjectival désigne Israël comme mis à part pour Dieu. « Celui qui t’est consacré » exprime cette relation plus naturellement en français que « ton saint », qui pourrait prêter à confusion.
- source_word: Ἰσραὴλ
  choice: Israël
  rationale: Le texte grec emploie le nom d’alliance du patriarche Jacob; il convient de le conserver plutôt que de l’harmoniser avec « Jacob ».
theological_decisions:
- issue: Traduction de δοῦλος comme titre patriarcal
  choice: serviteur
  alternative: esclave
  rationale: Dans l’apposition « Isaac, ton serviteur », le terme fonctionne comme un titre de dévouement envers Dieu; « serviteur » rend cette fonction sans effacer que δοῦλος peut ailleurs signifier « esclave ».
- issue: Portée de l’appel aux patriarches introduit par διὰ
  choice: à cause d’Abraham… d’Isaac… et d’Israël
  alternative: pour l’amour d’Abraham… d’Isaac… et d’Israël
  rationale: Le grec invoque les patriarches comme motif de la demande. « À cause de » garde cette relation ouverte sans suggérer que la miséricorde leur serait accordée à eux plutôt qu’au peuple.
- issue: Sens de ἅγιος appliqué à Israël/Jacob
  choice: celui qui t’est consacré
  alternative: ton saint
  rationale: Le choix fait ressortir l’idée de mise à part pour Dieu et évite la possible lecture ecclésiastique ou canonique du mot français « saint ».
translation_notes:
  register: Français international moderne, au tutoiement cohérent avec la prière. Syntaxe solennelle mais accessible; répétition des appositions conservée pour refléter la structure grecque.
