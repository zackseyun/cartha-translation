  source_fidelity: 'Le grec contient trois optatifs passifs coordonnés, bien rendus par la série de souhaits en français. « Ceux qui font du mal à tes serviteurs » transmet naturellement οἱ ἐνδεικνύμενοι ... κακά τοῖς δούλοις σου, et « leur force soit brisée » rend fidèlement ἡ ἰσχὺς αὐτῶν συντριβείη. En revanche, « dans toute leur puissance » ne rend pas de façon satisfaisante ἀπὸ πάσης τῆς δυναστείας : la préposition ἀπό crée une construction difficile, dont une valeur concessive (« malgré ») est une interprétation française plus plausible que la simple sphère exprimée par « dans ».'
