base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your servants be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: fr
  text: Que tous ceux qui font du mal à tes serviteurs[a] soient couverts de honte ; qu’ils soient déshonorés malgré toute leur puissance[b], et que leur force soit brisée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « tes esclaves », terme qui souligne leur entière appartenance à Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'La construction grecque avec ἀπό est difficile. On peut aussi comprendre : « dans toute leur puissance » ou « déchus de toute leur domination ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐντραπείησαν
  choice: soient couverts de honte
  rationale: L’optatif aoriste passif exprime ici un souhait ou une demande. « Être couverts de honte » rend la disgrâce demandée plutôt qu’un simple sentiment intérieur.
- source_word: οἱ ἐνδεικνύμενοι … κακά
  choice: ceux qui font du mal
  rationale: L’expression grecque signifie littéralement « ceux qui montrent des maux » envers quelqu’un. En français actuel, « faire du mal » exprime naturellement l’action hostile sans la limiter à une forme précise de préjudice.
- source_word: τοῖς δούλοις σου
  choice: à tes serviteurs
  rationale: Dans une prière adressée à Dieu, « serviteurs » est naturel, digne et fait entendre à la fois le service et l’appartenance. Une note conserve le sens social plus fort de δοῦλος.
- source_word: καταισχυνθείησαν
  choice: qu’ils soient déshonorés
  rationale: Ce choix distingue ce second verbe de ἐντραπείησαν et rend sa dimension publique de honte et de disgrâce.
- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: dans toute leur puissance
  rationale: La préposition ἀπό rend la construction difficile et permet plusieurs relations possibles avec δυναστεία. La formulation retenue donne un sens français intelligible sans introduire l’idée plus précise de tyrannie.
- source_word: ἡ ἰσχὺς αὐτῶν συντριβείη
  choice: que leur force soit brisée
  rationale: Cette formulation conserve l’image forte de συντρίβω et poursuit naturellement la série de souhaits exprimés par les optatifs passifs.
theological_decisions:
- issue: Sens de δοῦλοι pour désigner ceux qui appartiennent à Dieu
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: « Serviteurs » convient au registre de la prière en français moderne et évite que le lecteur entende d’abord l’institution humaine de l’esclavage. La note signale néanmoins que le grec δοῦλοι exprime plus fortement l’appartenance et la dépendance envers Dieu.
- issue: Rapport entre la honte des adversaires et leur puissance
  choice: déshonorés dans toute leur puissance
  alternative: déshonorés malgré toute leur puissance ; déchus de toute leur domination
  rationale: La construction ἀπὸ πάσης τῆς δυναστείας est ambiguë. Le texte principal ne précise donc pas si leur puissance constitue la sphère de leur disgrâce, n’empêche pas celle-ci, ou leur est retirée.
translation_notes:
  register: Français international actuel, au registre digne d’une prière. Le parallélisme des trois demandes est conservé, avec deux termes distincts pour les deux verbes grecs liés à la honte.
