  terminology: « Serviteurs » est un choix français naturel dans cette adresse à Dieu pour δοῦλοι, sans effacer le sens plus fort d’appartenance, qui est signalé exactement en note. « Puissance » convient à δυναστεία, tandis que la note doit conserver les autres analyses possibles de la construction avec ἀπό.
