base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/035.yaml
  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, anges du Seigneur ; chantez des hymnes et exaltez-le souverainement, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif « bénissez » conserve le sens doxologique et le registre liturgique de εὐλογεῖτε ; dans ce contexte, bénir le Seigneur signifie proclamer sa grandeur.
- source_word: ἄγγελοι
  choice: anges
  rationale: Dans cet appel cosmique à la louange, il s’agit des êtres célestes, non de messagers humains.
- source_word: Κυρίου / τὸν κύριον
  choice: du Seigneur / le Seigneur
  rationale: « Seigneur » est le rendu naturel de κύριος dans cette invocation liturgique.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette formulation française naturelle préserve explicitement la dimension chantée de ὑμνέω sans suggérer nécessairement une forme musicale particulière.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: La locution restitue la valeur intensive du composé ὑπερυψόω tout en restant digne et intelligible en français moderne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain, l’expression idiomatique grecque marque une durée perpétuelle ; « pour toujours » est son équivalent français courant.
theological_decisions:
- issue: Sens doxologique de εὐλογεῖτε lorsque Dieu en est l’objet
  choice: Bénissez le Seigneur
  alternative: Louez le Seigneur
  rationale: « Bénissez » suit plus étroitement le verbe grec et maintient le langage biblique selon lequel les créatures bénissent Dieu, sans impliquer qu’elles lui confèrent un bienfait.
- issue: Rendu de κύριος dans l’hymne grec deutérocanonique
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte cultuel désigne Dieu et appelle naturellement le titre traditionnel « Seigneur ».
translation_notes:
  register: Français international moderne, liturgique mais accessible. Le parallélisme impératif du grec est conservé, ainsi que l’intensité de ὑπερυψοῦτε. La ponctuation distingue l’interpellation « anges du Seigneur » du premier impératif.
