base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: fr
  text: 'Alors Azarias se leva et pria ainsi ; ouvrant la bouche, il rendait grâce[a] au Seigneur avec ses compagnons, au milieu du feu, tandis que la fournaise était chauffée avec une grande intensité par les Chaldéens. Et ils dirent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il confessait » ou « il louait » ; selon le contexte, le verbe grec peut exprimer la confession, l’action de grâce ou la louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: se leva
  rationale: Le participe aoriste de ἵστημι marque ici l’action narrative qui précède la prière. « Se leva » est naturel en français et conserve cette progression.
- source_word: προσηύξατο οὕτως
  choice: pria ainsi
  rationale: Rend directement le verbe usuel de la prière et introduit naturellement les paroles qui suivent.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: Ouvrant la bouche
  rationale: Conserve la tournure solennelle du grec au lieu de la réduire à « il dit ».
- source_word: ἐξωμολογεῖτο
  choice: il rendait grâce
  rationale: Dans le grec biblique, le verbe peut désigner l’action de confesser, de louer ou de rendre grâce. « Rendait grâce » convient à une adresse à Dieu, tandis que les autres nuances sont conservées en note.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος est le titre révérenciel de Dieu.
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: avec ses compagnons
  rationale: Exprime simplement l’accompagnement et prépare le passage soudain au pluriel à la fin du verset.
- source_word: ἐν μέσῳ τῷ πυρί
  choice: au milieu du feu
  rationale: Traduction directe, claire et imagée de la locution grecque.
- source_word: ὑποκαιομένης τῆς καμίνου ὑπὸ τῶν Χαλδαίων σφόδρα
  choice: tandis que la fournaise était fortement attisée par les Chaldéens
  rationale: La proposition conserve le génitif absolu, la forme passive, les agents expressément nommés et l’intensité de σφόδρα. « Attisée » rend concrètement l’action de chauffer ou d’alimenter le feu.
- source_word: καὶ εἶπαν
  choice: 'Et ils dirent :'
  rationale: Le pluriel transmis est maintenu malgré son caractère abrupt après le sujet singulier ; il s’accorde avec la mention des compagnons et introduit une parole commune.
theological_decisions:
- issue: Sens de ἐξωμολογεῖτο dans une prière mêlant louange, reconnaissance de la justice divine et confession du péché
  choice: il rendait grâce
  alternative: il confessait ; il louait
  rationale: Le champ sémantique du verbe en grec biblique ne se laisse pas réduire avec certitude à une seule de ces nuances. Le texte principal retient une formulation naturelle dans l’adresse à Dieu, et la note préserve les autres lectures légitimes sans trancher la tension du contexte.
- issue: Passage du singulier Azarias au pluriel dans καὶ εἶπαν
  choice: Et ils dirent
  alternative: Et il dit
  rationale: Le pluriel appartient au texte grec fourni et présente la prière ou le chant comme une parole partagée avec les compagnons ; il ne doit pas être harmonisé silencieusement au singulier.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste narrative et solennelle sans archaïsmes. Le deux-points final signale que les paroles annoncées suivent au verset suivant.
