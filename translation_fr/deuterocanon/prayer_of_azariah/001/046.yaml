  text: Bless the Lord, frost and cold; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Givre et froid, bénissez le Seigneur ; chantez ses louanges et exaltez-le très haut à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à célébrer Dieu. « Bénissez » conserve la force liturgique de εὐλογέω et la répétition propre à ce cantique.
- source_word: πάγος
  choice: givre
  rationale: πάγος peut désigner la glace ou le givre. Associé à ψῦχος dans cette litanie cosmique, « givre » exprime naturellement le phénomène atmosphérique tout en restant distinct du froid en général.
- source_word: ψῦχος
  choice: froid
  rationale: Le nom désigne le froid ou la froidure. « Froid » est le terme moderne le plus direct et forme avec « givre » un couple clair.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » rend directement κύριος dans ce cantique grec et convient au registre liturgique du passage.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque spécifiquement le chant d’un hymne de louange. Cette formulation restitue la nuance musicale dans un français courant et digne.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préverbe intensif ὑπερ- renforce l’idée d’exaltation. « Au plus haut » préserve cette intensité sans lourdeur excessive.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans le refrain, cette expression idiomatique marque la durée sans fin. « Pour toujours » est naturel en français moderne.
theological_decisions:
- issue: Traduction de κύριος dans un cantique grec deutérocanonique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte source porte κύριον sans élément interne imposant ici la forme typographique associée au nom divin hébreu. « Le Seigneur » traduit directement le grec sans ajouter une précision absente.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsme. Le parallélisme impératif et l’intensification du refrain grec sont conservés.
