base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: fr
  text: Hanania, Azaria et Mishaël, bénissez le Seigneur ! Chantez ses louanges et exaltez-le par-dessus tout pour toujours. Car il nous a délivrés du séjour des morts[a], il nous a sauvés de la main de la mort, il nous a arrachés du milieu de la flamme ardente et nous a libérés du feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie « Hadès », c’est-à-dire le domaine des morts. Ou « de la tombe ».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel conserve la force liturgique de l’appel à bénir le Seigneur; « louez » serait possible, mais recouvrirait davantage le verbe suivant.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte liturgique juif grec, κύριος fonctionne comme titre divin; « le Seigneur » est l’équivalent français naturel et traditionnel.
- source_word: ὑμνεῖτε
  choice: Chantez ses louanges
  rationale: Cette formulation naturelle en français exprime explicitement la dimension chantée du verbe ὑμνέω.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le composé intensif demande davantage que le simple « exaltez »; « par-dessus tout » restitue cette intensification dans un français idiomatique et digne.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français courant de la formule doxologique exprimant une durée perpétuelle.
- source_word: ἐξείλετο
  choice: a délivrés
  rationale: Le verbe désigne le retrait hors d’un danger; « délivrés » convient au registre d’action de grâce tout en restant distinct des verbes suivants.
- source_word: ἐξ ᾅδου
  choice: du séjour des morts
  rationale: Cette expression rend le domaine des morts désigné par ᾅδης sans suggérer seulement une tombe individuelle ni importer les connotations mythologiques que « Hadès » peut avoir pour le lectorat français.
- source_word: ἔσωσεν
  choice: a sauvés
  rationale: Équivalent direct de σώζω; dans le contexte, il s’agit concrètement d’un salut face à un péril mortel.
- source_word: ἐκ χειρὸς θανάτου
  choice: de la main de la mort
  rationale: La formulation conserve l’image grecque et sa personnification frappante de la puissance de la mort.
- source_word: ἐρρύσατο
  choice: a arrachés
  rationale: « Arrachés » exprime vivement le sauvetage hors du danger et évite de répéter « délivrés ».
- source_word: ἐκ μέσου καιομένης φλογός
  choice: du milieu de la flamme ardente
  rationale: La formulation préserve l’idée d’un sauvetage opéré depuis l’intérieur même de la flamme en combustion.
- source_word: ἐλυτρώσατο
  choice: a libérés
  rationale: λυτρόω signifie ici faire sortir libre d’un péril. « Libérés » garde le sens concret sans imposer l’idée française moderne d’un paiement, absente de l’énoncé.
theological_decisions:
- issue: Sens de ᾅδης dans l’action de grâce pour une délivrance d’un danger mortel
  choice: du séjour des morts
  alternative: de la tombe; de l’Hadès
  rationale: Le grec nomme le domaine des morts, non simplement la mort. « Séjour des morts » préserve cette portée tout en restant clair en français; la note signale l’alternative plus étroite « tombe ».
- issue: Portée de λυτρόω dans la délivrance du feu
  choice: nous a libérés
  alternative: nous a rachetés
  rationale: Le contexte immédiat décrit une délivrance concrète du feu. « Libérés » laisse subsister la résonance de délivrance sans transformer implicitement le verset en affirmation d’un mécanisme de rançon.
translation_notes:
  register: Français international moderne, liturgique et digne, avec des impératifs directs et un parallélisme soutenu. Les noms sont translittérés selon les formes grecques du passage. La répétition des actions divines est conservée, tandis que des verbes français distincts rendent la variété lexicale grecque.
