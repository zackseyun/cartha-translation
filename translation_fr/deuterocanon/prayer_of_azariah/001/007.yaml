  text: And we have not obeyed the commands of your law, nor kept them, nor done as you commanded us, so that it might go well with us.
translation:
  language: fr
  text: Nous n’avons pas obéi aux commandements de ta loi, ni ne les avons observés, ni n’avons agi comme tu nous l’as commandé, afin que tout aille bien pour nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: aux commandements de ta loi
  rationale: « Commandements » rend naturellement ἐντολαί dans un contexte juridique et conserve le lien explicite avec la loi de Dieu.
- source_word: ὑπηκούσαμεν
  choice: avons obéi
  rationale: Rend directement l’idée d’écouter en se soumettant à une autorité.
- source_word: συνετηρήσαμεν
  choice: avons observés
  rationale: Dans le contexte de la loi, « observer » exprime le fait de garder fidèlement les commandements.
- source_word: ἐποιήσαμεν
  choice: avons agi
  rationale: Évite une répétition française maladroite de « faire » tout en conservant le sens de mise en pratique.
- source_word: ἵνα εὖ ἡμῖν γένηται
  choice: afin que tout aille bien pour nous
  rationale: Reproduit la proposition finale grecque et sa formulation générale sans préciser indûment la nature du bien-être.
theological_decisions:
- issue: Rapport entre obéissance et bien-être
  choice: Conserver « afin que », qui présente le bien-être comme la finalité du commandement
  alternative: « de sorte que tout aille bien pour nous » ou « pour notre bien »
  rationale: ἵνα marque ici naturellement le but. La traduction ne transforme pas cette relation en garantie mécanique de prospérité et préserve la tension du texte.
translation_notes:
  register: Français moderne, international et digne. La triple confession négative du grec est conservée, avec une coordination naturelle; « ta » maintient l’adresse directe à Dieu.
