base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: fr
  text: Béni es-tu, Seigneur, Dieu de nos pères, toi qui es loué et souverainement exalté pour toujours ! Béni est ton nom saint et glorieux[a], suprêmement loué et souverainement exalté à travers tous les âges !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le saint nom de ta gloire ». La construction grecque est condensée et peut aussi se comprendre comme qualifiant le nom de saint et de glorieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς εἶ
  choice: Béni es-tu
  rationale: Conserve l’adresse directe et la formule doxologique grecque sans la transformer en souhait ou en impératif.
- source_word: Κύριε ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Seigneur, Dieu de nos pères
  rationale: « Seigneur » est le rendu usuel de Κύριε ; « nos pères » maintient l’expression familiale et traditionnelle explicitement masculine du grec.
- source_word: αἰνετὸς
  choice: loué
  rationale: Rend naturellement l’adjectif prédicatif dans la suite des proclamations de louange.
- source_word: ὑπερυψούμενος
  choice: souverainement exalté
  rationale: Exprime la force intensive du composé grec tout en conservant sa valeur doxologique ; le même rendu est repris aux deux occurrences.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française idiomatique de la durée indéfinie indiquée par le grec.
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: ton nom saint et glorieux
  rationale: Restitue les idées de sainteté et de gloire dans un français naturel, tout en signalant en note la construction grecque plus condensée.
- source_word: ὑπεραινετὸν
  choice: suprêmement loué
  rationale: Distingue ce terme intensif de αἰνετός et conserve la valeur renforcée du préfixe ὑπερ-.
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: à travers tous les âges
  rationale: Rend explicitement ἅπαντας, « tous », et maintient la distinction avec la première expression temporelle.
theological_decisions:
- issue: Formule traditionnelle de bénédiction ou prédication directe
  choice: Béni es-tu, Seigneur
  alternative: Béni soit le Seigneur
  rationale: Le grec s’adresse directement à Dieu à la deuxième personne et ne formule pas un souhait à la troisième personne.
- issue: Traduction de πατέρων
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie un pluriel masculin et reprend une formule biblique familiale et d’alliance ; « nos pères » la conserve sans élargissement interprétatif.
- issue: Rapport entre le nom, la gloire et la sainteté
  choice: ton nom saint et glorieux
  alternative: le saint nom de ta gloire
  rationale: Le texte principal privilégie un français intelligible sans effacer la construction littérale, conservée en note afin de ne pas résoudre excessivement le rapport génitif.
translation_notes:
  register: Français international moderne, solennel et doxologique. L’inversion « Béni es-tu » conserve la cadence liturgique sans archaïsme pronominal. Les deux phrases exclamatives rendent l’élan de la louange.
