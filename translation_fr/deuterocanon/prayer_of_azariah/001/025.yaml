  text: and it swept through and burned up those Chaldeans whom it found around the furnace[a].
translation:
  language: fr
  text: Le feu se propagea et brûla les Chaldéens qu’il trouva autour de la fournaise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le feu passa à travers et incendia les Chaldéens qu’il trouva autour de la fournaise. » Les verbes grecs peuvent recevoir une traduction plus formelle ; le texte principal souligne la progression destructive du feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: elle se répandit
  rationale: Le verbe exprime un mouvement à travers un espace. Dans le contexte du feu, « se répandit » rend naturellement ce déplacement avec sa force destructrice, sans ajouter l’idée absente d’une intervention distincte.
- source_word: ἐνεπύρισεν
  choice: consumant
  rationale: Le verbe signifie mettre le feu ou embraser. Ici, « consumant » exprime avec naturel l’effet destructeur du feu; la note conserve une traduction plus formelle.
- source_word: οὓς εὗρεν
  choice: ceux ... qu’elle trouva
  rationale: 'Cette formulation préserve la relative grecque et sa portée: le feu atteint les personnes qu’il rencontre.'
- source_word: περὶ τὴν κάμινον
  choice: autour de la fournaise
  rationale: περί avec l’accusatif a ici un sens spatial; « autour de » est direct et idiomatique.
- source_word: τῶν Χαλδαίων
  choice: ceux des Chaldéens
  rationale: 'Le génitif partitif est conservé: il s’agit de ceux, parmi les Chaldéens, que le feu trouva là. « Chaldéens » maintient le terme historique du grec sans le remplacer par « Babyloniens ».'
