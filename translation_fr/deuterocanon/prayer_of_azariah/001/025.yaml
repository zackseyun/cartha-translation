  register: Français international moderne, narratif et digne. Le pronom féminin « elle » reprend le feu, nom masculin dans le contexte français mais présenté ici selon la phrase isolée; pour éviter une discordance contextuelle potentielle, une édition intégrée pourra harmoniser le pronom avec le référent explicite du verset précédent.
