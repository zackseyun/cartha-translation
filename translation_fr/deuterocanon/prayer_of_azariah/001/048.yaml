translation:
  language: fr
  text: Nuits et jours, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle les nuits et les jours, personnifiés, à bénir le Seigneur. « Bénissez » conserve la résonance liturgique de εὐλογέω et le distingue de ὑμνεῖτε.
- source_word: νύκτες καὶ ἡμέραι
  choice: nuits et jours
  rationale: Les vocatifs grecs sont au pluriel. Cette formulation préserve le nombre et l’adresse poétique directe aux éléments de la création.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » est l’équivalent français naturel de κύριος dans cette doxologie grecque.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée. Cette expression idiomatique en français moderne en garde la nuance musicale.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le
  rationale: « Exaltez » exprime l’élévation et la glorification portées par le verbe intensif. L’intensité du composé est aussi soutenue par le registre solennel du refrain, sans recourir à une tournure française pesante.
- source_word: εἰς τοὺς αἰῶνας
  choice: à jamais
  rationale: Dans ce refrain liturgique, l’expression désigne une durée perpétuelle. « À jamais » est naturel, digne et poétique.
theological_decisions:
- issue: Traduction de κύριος dans une doxologie liturgique grecque
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte source porte κύριος et non le tétragramme hébreu. « Le Seigneur » traduit directement le grec sans importer une convention propre à la restitution de YHWH.
translation_notes:
  register: Langue poétique, liturgique et contemporaine. L’ordre « Nuits et jours » met clairement en relief le vocatif français. Le parallélisme impératif et la personnification cosmique sont conservés.
