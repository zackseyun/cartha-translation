base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/040.yaml
  text: Bless the Lord, stars of heaven; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, étoiles du ciel ; chantez ses louanges et exaltez-le souverainement pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel conserve l’appel liturgique à bénir Dieu et la structure répétitive du cantique, sans le réduire au seul sens de « louer ».
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: étoiles du ciel
  rationale: « Étoiles » traduit directement ἄστρα, tandis que « du ciel » rend naturellement le génitif singulier τοῦ οὐρανοῦ dans un registre poétique.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans cette adresse doxologique à Dieu, κύριος fonctionne comme titre divin ; « le Seigneur » est sa traduction française usuelle sans importer la convention typographique propre au nom divin hébreu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée. Cette formulation française actuelle préserve à la fois la dimension musicale et cultuelle.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le composé intensif exprime une exaltation portée au plus haut degré ; cette tournure garde cette force sans devenir obscure ou pesante.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain liturgique, l’expression idiomatique indique une durée perpétuelle ; « pour toujours » est clair, naturel et digne en français moderne.
theological_decisions:
- issue: Traduction de κύριος dans une adresse hymnique deutérocanonique à Dieu
  choice: le Seigneur
  alternative: le SEIGNEUR ; le Maître
  rationale: Le témoin grec porte κύριον. « Le Seigneur » traduit directement le titre divin, tandis que « le SEIGNEUR » importerait une convention liée au tétragramme hébreu que le texte grec n’explicite pas.
translation_notes:
  register: Français international moderne, poétique et liturgique, avec impératifs au pluriel. La formulation reste accessible tout en conservant le parallélisme et l’intensité du refrain grec.
