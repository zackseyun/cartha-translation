base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/063.yaml
  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur[a], esprits et âmes des justes ; chantez ses louanges et exaltez-le au plus haut point pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Louez le Seigneur » ; le verbe grec peut exprimer aussi bien l’action de bénir que celle de louer dans ce contexte liturgique.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les âges » ; il s’agit d’une formule doxologique courante exprimant une durée perpétuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel « bénissez » conserve la force liturgique et doxologique du grec. « Louez » est possible, mais plus général.
- source_word: πνεύματα
  choice: esprits
  rationale: Le sens courant « esprits » convient à l’association explicite avec ψυχαί, sans préciser la nature de ces esprits.
- source_word: ψυχαὶ
  choice: âmes
  rationale: « Âmes » rend distinctement le second terme de la paire grecque et demeure naturel dans ce contexte poétique et liturgique.
- source_word: δικαίων
  choice: des justes
  rationale: Le génitif se rapporte à l’ensemble « esprits et âmes ». « Des justes » exprime avec concision le sens moral et religieux du terme.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » est le rendu français établi de κύριος dans ce contexte liturgique juif grec.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette formulation restitue la dimension musicale et hymnique du verbe tout en restant idiomatique en français moderne.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut point
  rationale: Le complément « au plus haut point » rend l’intensification portée par le préfixe ὑπερ- sans lourdeur excessive.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans cette formule doxologique, « pour toujours » communique naturellement l’idée de durée sans fin exprimée littéralement par « pour les âges ».
theological_decisions:
- issue: Association anthropologique des « esprits » et des « âmes »
  choice: 'Maintenir distinctement les deux termes : « esprits et âmes des justes »'
  alternative: Les fondre en une seule expression, par exemple « âmes des justes », ou les interpréter comme « les justes, corps et âme »
  rationale: Le grec nomme explicitement πνεύματα et ψυχαί. La traduction préserve cette dualité lexicale sans en déduire une doctrine particulière sur la composition de l’être humain.
translation_notes:
  register: Français moderne, digne et liturgique. La syntaxe suit de près le mouvement du grec, tandis que « chantez ses louanges » et « au plus haut point » assurent une expression naturelle et claire.
