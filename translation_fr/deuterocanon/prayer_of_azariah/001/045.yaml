base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/045.yaml
  text: Bless the Lord, dews and showers; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Rosées et chutes de neige, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δρόσοι
  choice: rosées
  rationale: Reproduit directement le pluriel grec et conserve l’apostrophe poétique aux phénomènes naturels.
- source_word: νιφετοί
  choice: giboulées
  rationale: Le terme grec désigne des précipitations neigeuses ou des bourrasques de neige ; « giboulées » rend naturellement cette idée en français sans réduire le mot à la seule neige au sol.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Rend l’idée de célébrer par un hymne dans une expression française courante et digne.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Conserve la force intensive du préfixe ὑπερ- plutôt que de traduire par le simple verbe « exalter ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française naturelle correspondant à la portée temporelle de la formule grecque.
theological_decisions:
- issue: Référent de τὸν κύριον
  choice: le Seigneur
  alternative: Yahvé / l’Éternel
  rationale: Le grec porte le titre κύριος sans nom divin explicite ; « le Seigneur » traduit donc formellement le texte fourni sans rétroversion théologique.
- issue: Portée de αὐτόν
  choice: ses louanges… exaltez-le
  alternative: louez-le… exaltez-le
  rationale: Le pronom renvoie sans ambiguïté au Seigneur ; la reformulation possessive dans le premier membre reste naturelle en français et maintient ce référent.
translation_notes:
  register: Style poétique, liturgique et impératif, avec apostrophe directe aux éléments de la création. Français moderne international ; rythme ternaire conservé et aucune note nécessaire.
