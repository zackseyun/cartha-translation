base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: fr
  text: Et en ce temps, il n’y a ni dirigeant, ni prophète, ni chef, ni holocauste, ni sacrifice, ni offrande, ni encens, ni lieu où présenter devant toi les prémices[a] et trouver miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrir des fruits » ou « présenter devant toi les produits de la terre ». L’expression grecque est rare; « les prémices » tient compte du contexte cultuel.
    reason: Alternative lexicale pour τοῦ καρπῶσαι, dont le sens précis est incertain.
lexical_decisions:
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: en ce temps
  rationale: Formulation française naturelle et solennelle qui conserve la portée immédiate de la lamentation.
- source_word: ἄρχων
  choice: dirigeant
  rationale: Terme large désignant une personne investie d’une autorité publique; il reste distinct de « chef » pour ἡγούμενος.
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français usuel et précis.
- source_word: ἡγούμενος
  choice: chef
  rationale: Rend l’idée d’une personne qui conduit ou dirige sans répéter « dirigeant » ni préciser indûment une fonction politique.
- source_word: ὁλοκαύτωσις
  choice: holocauste
  rationale: Terme cultuel français traditionnel pour une offrande entièrement consumée par le feu; il demeure distinct du terme général « sacrifice ».
- source_word: θυσία
  choice: sacrifice
  rationale: Équivalent général et naturel du terme cultuel grec.
- source_word: προσφορά
  choice: offrande
  rationale: Désigne clairement ce qui est présenté à Dieu, sans recourir à un vocabulaire ecclésiastique spécialisé.
- source_word: θυμίαμα
  choice: encens
  rationale: Équivalent concis et courant dans un contexte cultuel.
- source_word: τοῦ καρπῶσαι
  choice: présenter […] les prémices
  rationale: Le verbe rare, formé sur καρπός, reçoit ici un sens cultuel lié aux produits de la terre; « prémices » convient au contexte, tout en signalant l’incertitude dans une note.
- source_word: ἐνώπιόν σου
  choice: devant toi
  rationale: Conserve directement l’image spatiale et relationnelle du grec.
- source_word: εὑρεῖν ἔλεος
  choice: trouver miséricorde
  rationale: Préserve l’expression verbale du grec et son registre biblique sans la paraphraser par « recevoir ».
theological_decisions:
- issue: Énumération des autorités et des actes cultuels absents
  choice: Conserver séparément chacun des termes de la liste.
  alternative: Résumer par une formule comme « ni autorités ni sacrifices ».
  rationale: L’accumulation exprime toute l’ampleur de la privation; la condenser affaiblirait la lamentation et effacerait des distinctions présentes dans le grec.
- issue: Sens cultuel de τοῦ καρπῶσαι
  choice: « présenter les prémices » avec une note signalant l’ambiguïté lexicale
  alternative: « offrir », « offrir des fruits » ou « présenter les produits de la terre »
  rationale: Le vocabulaire sacrificiel environnant favorise une référence à une offrande issue des récoltes, mais le mot grec inhabituel ne permet pas d’imposer ce degré de précision sans mentionner les autres possibilités.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « ni » reproduit la force rhétorique de l’énumération grecque. « Holocauste » est employé dans son sens cultuel ancien d’offrande entièrement brûlée.
