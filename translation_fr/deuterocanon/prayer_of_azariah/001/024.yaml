  text: And the flame spread above the furnace to forty-nine cubits,[a]
translation:
  language: fr
  text: Et la flamme s’élevait au-dessus de la fournaise jusqu’à quarante-neuf coudées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une unité de longueur courante dans l’Antiquité, correspondant approximativement à la distance entre le coude et le bout des doigts.
    reason: cultural_note
lexical_decisions:
- source_word: διείχετο
  choice: s’élevait
  rationale: Dans ce contexte et avec la mesure qui suit, l’imparfait décrit l’extension de la flamme en hauteur. « S’élevait » est naturel en français et conserve l’aspect duratif.
- source_word: ἡ φλὸξ
  choice: la flamme
  rationale: Le grec emploie explicitement un nom singulier ; « la flamme » en est l’équivalent direct et imagé.
- source_word: ἐπάνω τῆς καμίνου
  choice: au-dessus de la fournaise
  rationale: ἐπάνω suivi du génitif indique une position ou une extension au-dessus de quelque chose. « Au-dessus de la fournaise » est précis et idiomatique.
- source_word: ἐπὶ πήχεις τεσσαράκοντα ἐννέα
  choice: jusqu’à quarante-neuf coudées
  rationale: La tournure exprime ici l’étendue, vraisemblablement verticale, de la flamme. « Jusqu’à » rend clairement cette limite tout en conservant l’unité ancienne.
