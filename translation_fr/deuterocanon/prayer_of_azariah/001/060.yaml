base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/060.yaml
  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Israël, bénissez le Seigneur[a] ; chantez ses louanges et exaltez-le hautement, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « louez le Seigneur ». Dans ce contexte de culte, le grec εὐλογεῖτε peut aussi avoir ce sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel conserve l’image biblique de la bénédiction adressée à Dieu; dans ce contexte liturgique, il signifie aussi « louez ».
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Le nom est pris comme une apostrophe collective. Le placer en tête rend l’appel direct naturel en français sans ajouter d’interjection absente du grec.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend directement κύριος dans cette adresse à Dieu, sans supposer derrière le texte grec une forme hébraïque particulière.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque explicitement la louange chantée; cette formulation est idiomatique et conserve la dimension hymnique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préverbe intensif ὑπερ- demande davantage que le simple verbe « exalter »; « par-dessus tout » exprime cette élévation suprême dans un français naturel.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans ce refrain doxologique, l’expression désigne une durée sans fin; « pour toujours » en donne le sens idiomatique.
theological_decisions:
- issue: Sens de la bénédiction adressée à Dieu
  choice: bénissez le Seigneur
  alternative: louez le Seigneur
  rationale: « Bénissez » préserve l’expression biblique et la réciprocité lexicale du verbe, tandis que la note signale son sens laudatif dans le culte.
- issue: Rendu de κύριος dans un hymne deutérocanonique adressé à Dieu
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: La source grecque porte κύριον. « Le Seigneur » traduit cette forme sans introduire typographiquement le tétragramme.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe parallèle et l’impératif pluriel maintiennent le rythme hymnique; la ponctuation distingue l’apostrophe à Israël des trois exhortations.
