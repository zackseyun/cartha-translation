base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/041.yaml
  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Toute pluie et toute rosée[a], bénissez le Seigneur ; chantez ses louanges et exaltez-le souverainement pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre collectivement : « la pluie et la rosée ». Le grec peut désigner chaque pluie et chaque rosée, ou l’ensemble de la pluie et de la rosée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à bénir le Seigneur. « Bénissez » conserve le vocabulaire et la structure répétitive de la litanie.
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: toute pluie et toute rosée
  rationale: Cette formulation française garde la portée distributive possible de πᾶς avec des noms singuliers, tout en restant claire dans une adresse poétique aux éléments naturels.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: « Le Seigneur » rend directement κύριος dans ce contexte liturgique grec, sans introduire une forme typographique destinée à représenter explicitement le nom divin hébreu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée ; cette expression naturelle en français en conserve la nuance musicale.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préverbe intensif de ὑπερυψόω est rendu par « au plus haut », formulation digne et intelligible qui maintient l’idée d’exaltation suprême.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression rend naturellement en français la valeur idiomatique durable de la formule grecque.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source porte κύριος. « Le Seigneur » le traduit sans imposer que le terme représente ici explicitement le tétragramme.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsmes. L’ordre de l’adresse puis de l’impératif demeure proche du grec, tandis que « chantez ses louanges » et « au plus haut » assurent une formulation naturelle.
