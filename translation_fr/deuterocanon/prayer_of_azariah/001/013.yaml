base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/013.yaml
  text: just as you spoke to them[a], saying that their offspring would be multiplied like the stars of heaven in number and like the sand by the shore of the sea.
translation:
  language: fr
  text: comme tu le leur as déclaré en disant que tu rendrais leur descendance[a] aussi nombreuse que les étoiles du ciel et que le sable au bord de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence », terme qui reprend la formulation de la promesse faite aux ancêtres.
    reason: Préserver l’image grecque et son écho intertextuel tout en employant un français naturel dans le texte.
lexical_decisions:
- source_word: ἐλάλησας πρὸς αὐτοὺς
  choice: tu le leur as déclaré
  rationale: Le verbe λαλέω désigne ici la parole adressée aux ancêtres. « Déclaré » conserve la solennité de la promesse, tandis que « leur » rend πρὸς αὐτούς et que « le » annonce son contenu.
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit le contenu de la parole divine et peut être conservé naturellement en français.
- source_word: πολυπληθῦναι τὸ σπέρμα αὐτῶν
  choice: tu rendrais leur descendance aussi nombreuse
  rationale: L’infinitif aoriste actif πολυπληθῦναι a Dieu pour sujet implicite et τὸ σπέρμα pour objet. Cette formulation française exprime clairement l’accroissement promis sans transformer l’actif grec en passif.
- source_word: τὸ σπέρμα αὐτῶν
  choice: leur descendance
  rationale: « Descendance » exprime en français moderne le sens collectif de σπέρμα dans la promesse faite aux ancêtres. Une note signale l’image littérale de la « semence » et son écho scripturaire.
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: aussi nombreuse que les étoiles du ciel
  rationale: Le datif τῷ πλήθει précise le nombre ou la multitude. La comparaison intégrée à « aussi nombreuse que » est idiomatique et fidèle au sens.
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: que le sable au bord de la mer
  rationale: χείλος signifie littéralement « lèvre » ou « bord » ; dans cette expression, « au bord de la mer » rend naturellement l’emplacement du sable.
theological_decisions:
- issue: Vocabulaire de l’alliance dans σπέρμα
  choice: descendance, avec une note sur le sens littéral « semence »
  alternative: semence
  rationale: « Descendance » est immédiatement compréhensible et garde le sens collectif voulu. La note préserve l’écho lexical aux promesses faites aux ancêtres sans imposer au texte courant un emploi français artificiel.
translation_notes:
  register: Français moderne, digne et fluide. La phrase conserve la structure de rappel de la parole divine, tout en explicitant le sujet implicite de l’infinitif grec. Le verset commence par une minuscule puisqu’il prolonge syntaxiquement la phrase précédente.
