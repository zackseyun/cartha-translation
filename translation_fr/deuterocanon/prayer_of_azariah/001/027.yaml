base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/027.yaml
  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: fr
  text: Et il rendit l’intérieur de la fournaise semblable à un vent de rosée sifflant[a] ; le feu ne les toucha pas du tout, ne les fit pas souffrir et ne les gêna pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semblable à un souffle de rosée » ou « à un esprit de rosée ». Le mot grec πνεῦμα peut signifier « vent », « souffle » ou « esprit ».
    reason: Préserver l’étendue sémantique de πνεῦμα et l’ambiguïté de l’expression πνεῦμα δρόσου.
lexical_decisions:
- source_word: ἐποίησε
  choice: rendit
  rationale: Dans cette construction avec « semblable à », « rendit » exprime naturellement le fait de donner à l’intérieur de la fournaise un nouvel état, sans préciser le mécanisme du miracle.
- source_word: τὸ μέσον τῆς καμίνου
  choice: l’intérieur de la fournaise
  rationale: Le substantif μέσον désigne ici l’espace intérieur de la fournaise. Cette formulation est claire et idiomatique en français moderne.
- source_word: ὡς πνεῦμα δρόσου
  choice: semblable à un vent chargé de rosée
  rationale: Dans ce contexte physique, πνεῦμα désigne vraisemblablement un courant d’air ou un vent. « Chargé de rosée » conserve l’image concrète et rafraîchissante de δρόσου sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: διασυρίζον
  choice: qui sifflait
  rationale: Le participe évoque le bruit ou le mouvement sifflant d’un courant d’air traversant un espace. La proposition relative est naturelle en français et garde la vivacité de l’image.
- source_word: οὐχ ἥψατο αὐτῶν τὸ καθόλου
  choice: ne les toucha absolument pas
  rationale: « Toucher » rend directement ἅπτομαι, tandis que « absolument pas » restitue l’insistance de τὸ καθόλου.
- source_word: ἐλύπησεν
  choice: ne les fit pas souffrir
  rationale: Le verbe peut exprimer la douleur, la peine ou l’affliction. Dans l’épreuve physique de la fournaise, « faire souffrir » reste large et naturel.
- source_word: παρηνώχλησεν αὐτοῖς
  choice: ne les incommoda en rien
  rationale: Le verbe désigne le fait de gêner, importuner ou causer du tort. « Incommoder » le distingue de la souffrance exprimée par le verbe précédent, et « en rien » renforce la négation en français idiomatique.
theological_decisions:
- issue: Référent du sujet implicite de ἐποίησε
  choice: Conserver le pronom « il » sans nommer l’agent.
  alternative: Préciser « Dieu » ou « l’ange ».
  rationale: Le grec maintient un sujet singulier implicite, identifiable par le contexte. Le traduire simplement par « il » préserve la continuité du récit et évite de résoudre dans ce verset ce que le texte n’explicite pas ici.
- issue: Sens de πνεῦμα dans le contexte du miracle
  choice: Traduire par « vent » dans le texte principal.
  alternative: « souffle » ou « esprit » de rosée.
  rationale: L’image immédiate est celle d’un courant d’air frais au milieu de la fournaise. « Vent » convient donc au contexte concret, tandis qu’une note conserve les autres sens authentiques de πνεῦμα sans imposer une interprétation spirituelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement narratif du grec, son image sensorielle et ses trois négations successives, tout en évitant des tournures archaïques comme « au milieu de la fournaise » ou « ne les affligea point ».
