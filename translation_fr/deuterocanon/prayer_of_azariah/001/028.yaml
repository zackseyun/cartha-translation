base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/028.yaml
  text: 'Then the three[a], as with one mouth, were singing hymns and glorifying and blessing God in the furnace, saying:'
translation:
  language: fr
  text: 'Alors les trois, comme d’une seule bouche[a], chantaient des hymnes, glorifiaient et bénissaient Dieu dans la fournaise en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une seule voix ». Le grec dit littéralement « comme d’une seule bouche », image qui souligne la parfaite unité des trois dans leur louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la transition temporelle et narrative.
- source_word: οἱ τρεῖς
  choice: les trois
  rationale: Préserve l’expression concise du grec sans ajouter « hommes » ou « jeunes gens ».
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: comme d’une seule bouche
  rationale: Conserve l’image concrète du grec et souligne l’unité complète de leur louange.
- source_word: ὕμνουν
  choice: chantaient des hymnes
  rationale: Rend la valeur imperfective de l’action en cours et le sens propre du verbe lié au chant d’hymnes.
- source_word: ἐδόξαζον
  choice: glorifiaient
  rationale: Maintient la distinction lexicale avec les verbes voisins de louange et de bénédiction.
- source_word: εὐλόγουν
  choice: bénissaient
  rationale: Préserve le verbe distinct du grec plutôt que de fondre les trois actions dans le seul terme « louaient ».
- source_word: τὸν θεὸν
  choice: Dieu
  rationale: Forme française naturelle, sans article dans cette construction.
- source_word: ἐν τῇ καμίνῳ
  choice: dans la fournaise
  rationale: « Fournaise » est le terme usuel et contextuellement approprié dans ce récit.
- source_word: λέγοντες
  choice: en disant
  rationale: Introduit naturellement en français les paroles qui suivent tout en rattachant le participe aux actions précédentes.
