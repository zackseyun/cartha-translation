base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/001.yaml
  text: Thus Hananiah and Azariah and Mishael prayed[b][a], and they sang praise to the Lord when the king ordered them to be thrown into the furnace.
translation:
  language: fr
  text: Ainsi donc, Hanania, Azaria et Mishaël[a] prièrent et chantèrent les louanges du Seigneur lorsque le roi ordonna qu’ils soient jetés dans la fournaise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec donne ici les noms hébreux Hanania, Azaria et Mishaël, et non leurs noms babyloniens Shadrak, Méshak et Abed-Nego.
    reason: cross_reference
  - marker: b
    text: 'Ou : « dans le four »; le mot grec peut désigner une fournaise ou un four.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Ainsi donc
  rationale: « Ainsi » exprime la manière ou renvoie à la prière qui suit, tandis que « donc » conserve la valeur connective de οὖν.
- source_word: προσηύξατο
  choice: prièrent
  rationale: Le verbe signifie simplement « prier ». Le singulier grec malgré les trois noms est rendu naturellement par le pluriel en français.
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: Hanania, Azaria et Mishaël
  rationale: Ces formes françaises usuelles correspondent aux noms hébreux représentés par le grec, plutôt qu’aux noms babyloniens des trois jeunes gens.
- source_word: ὕμνησαν
  choice: chantèrent les louanges
  rationale: Cette expression française naturelle préserve à la fois l’idée de chant et celle de louange contenues dans ὑμνέω.
- source_word: τῷ κυρίῳ
  choice: du Seigneur
  rationale: Dans la tournure française « chanter les louanges du Seigneur », le complément avec « de » rend naturellement le datif grec et κύριος désigne ici Dieu.
- source_word: ὅτε
  choice: lorsque
  rationale: La conjonction indique une relation temporelle sans imposer à elle seule le sens plus précis d’« après que ».
- source_word: προσέταξεν ἐμβληθῆναι
  choice: ordonna qu’ils soient jetés
  rationale: Cette formulation conserve l’ordre royal ainsi que la voix passive de l’infinitif grec, sans préciser qui devait exécuter l’ordre.
- source_word: εἰς τὴν κάμινον
  choice: dans la fournaise
  rationale: « Fournaise » convient au contexte du récit et au registre biblique actuel; κάμινος peut aussi désigner un four.
theological_decisions:
- issue: Traduction de κύριος lorsqu’il désigne Dieu
  choice: Seigneur
  alternative: maître
  rationale: Le contexte de prière et de louange montre que κύριος désigne Dieu; « Seigneur » conserve l’usage scripturaire et théologique sans réduire le titre à une relation sociale.
- issue: Forme des noms des trois jeunes gens
  choice: Hanania, Azaria et Mishaël
  alternative: Ananias, Azarias et Misaël; Shadrak, Méshak et Abed-Nego
  rationale: Le texte grec emploie ici les formes correspondant à leurs noms hébreux, non leurs noms babyloniens. Les formes françaises retenues rendent cette distinction visible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant une coordination lourde des trois noms. « Fournaise » maintient le cadre traditionnel du récit, avec l’autre sens possible signalé en note.
