  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
translation:
  language: fr
  text: Rendez grâce au Seigneur, car il est bon, car sa miséricorde demeure pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son amour fidèle demeure pour toujours ». Le grec dit littéralement : « sa miséricorde est pour toujours » ; dans ce refrain liturgique, l’expression peut aussi évoquer la fidélité constante de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Rendez grâce
  rationale: Dans cette formule liturgique, le verbe exprime l’action de remercier et de louer, non la confession des péchés. « Rendez grâce » est naturel, digne et fidèle à cet emploi.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Rend directement le grec κύριος sans substituer au texte grec le nom divin hébreu sous-jacent à des formules psalmiques parallèles.
- source_word: χρηστός
  choice: bon
  rationale: « Bon » convient à la formule doxologique et conserve la portée générale de χρηστός, qui peut aussi évoquer la bonté bienveillante.
- source_word: εἰς τὸν αἰῶνα
  choice: demeure pour toujours
  rationale: La tournure grecque signifie littéralement « pour l’éternité ». Le verbe « demeure », ajouté dans cette proposition sans verbe exprimé, donne en français une formulation naturelle de la permanence.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sa miséricorde
  rationale: ἔλεος désigne directement la miséricorde. Le refrain biblique peut aussi suggérer un amour fidèle, nuance conservée en note sans remplacer le sens grec principal.
theological_decisions:
- issue: Portée covenantale possible de ἔλεος dans le refrain liturgique
  choice: sa miséricorde demeure pour toujours
  alternative: son amour fidèle demeure pour toujours
  rationale: Le texte principal suit le sens direct du grec ἔλεος, tandis que la note préserve la nuance plus large d’amour fidèle que la formule liturgique peut porter.
translation_notes:
  register: Français international moderne, liturgique et accessible. La répétition de « car » reproduit la structure grecque et le rythme du refrain.
