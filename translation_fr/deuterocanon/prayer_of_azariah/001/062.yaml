base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/062.yaml
  text: Bless the Lord[a], servants[b]; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Bénissez le Seigneur, vous, ses serviteurs[a] ; chantez ses louanges et exaltez-le très haut, pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le mot grec peut désigner des personnes au service d’un maître ou des personnes en condition d’esclavage.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel appelle les adorateurs à dire du bien du Seigneur et à le louer. « Bénissez » conserve le sens lexical et le registre liturgique du grec.
- source_word: δοῦλοι
  choice: serviteurs
  rationale: Dans cette interpellation liturgique, « serviteurs » est naturel en français et exprime l’appartenance au service du Seigneur, sans trancher indûment entre service volontaire et condition servile.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce contexte doxologique, κύριος est un titre divin ; « le Seigneur » en est l’équivalent français établi.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe désigne la louange chantée. Cette formulation en restitue explicitement la dimension musicale dans un français idiomatique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préfixe intensif de ce verbe composé demande davantage que le simple « exaltez ». « Par-dessus tout » rend cette intensification avec naturel et dignité.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression idiomatique désigne une durée sans fin. « Pour toujours » est clair et naturel, tandis que sa forme plus littérale est signalée en note.
theological_decisions:
- issue: Sens de δοῦλοι dans l’adresse aux adorateurs de Dieu
  choice: serviteurs
  alternative: esclaves
  rationale: Le grec peut désigner aussi bien des personnes au service d’un maître que des personnes en condition d’esclavage. Le contexte hymnique ne précise pas leur statut juridique ; « serviteurs » préserve donc l’ambiguïté contextuelle, et la note maintient l’autre valeur lexicale possible.
translation_notes:
  register: Français moderne, international et digne, avec une cadence liturgique. L’ajout idiomatique « vous ses » marque clairement que « serviteurs » est une apostrophe, comme dans le grec, sans modifier le référent.
