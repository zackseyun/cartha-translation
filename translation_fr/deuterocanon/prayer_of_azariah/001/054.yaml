  text: Bless the Lord, rains and springs; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Pluies et sources, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel appelle les éléments de la création à honorer Dieu par la louange. « Bénissez » conserve le verbe récurrent et la forme liturgique du cantique.
- source_word: ὄμβροι
  choice: pluies
  rationale: Le nom pluriel désigne les pluies ou averses venues du ciel. « Pluies » respecte le pluriel grec et convient à l’énumération des réalités créées.
- source_word: πηγαί
  choice: sources
  rationale: Le terme désigne des points d’où jaillit naturellement l’eau. « Sources » est le mot français courant et naturel dans ce contexte cosmique.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Le syntagme est le complément des impératifs. « Le Seigneur » restitue naturellement l’article grec et la désignation liturgique du Dieu d’Israël.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe exprime la louange chantée. Cette formulation française rend explicitement sa dimension musicale et doxologique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le
  rationale: Le verbe intensif signifie élever ou exalter souverainement. En français, « exaltez-le » garde la dignité liturgique sans produire une tournure lourde; l’intensité est portée par le contexte hymnique.
- source_word: εἰς τοὺς αἰῶνας
  choice: à jamais
  rationale: Cette locution exprime une durée sans fin. « À jamais » est une équivalence française naturelle, concise et adaptée au registre poétique.
theological_decisions:
- issue: Traduction de κύριος dans un hymne deutérocanonique adressé au Dieu d’Israël
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le choix conserve l’article du grec et la formule liturgique française habituelle, sans introduire une convention typographique propre aux textes traduits directement du tétragramme hébreu.
translation_notes:
  register: Français international moderne, poétique et liturgique. L’antéposition « Pluies et sources » rend l’apostrophe grecque avec clarté. Le parallélisme des trois impératifs est préservé, avec une ponctuation fluide pour le chant.
