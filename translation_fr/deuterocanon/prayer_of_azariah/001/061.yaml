base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/061.yaml
  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
translation:
  language: fr
  text: Prêtres, bénissez le Seigneur[a] ; chantez ses louanges[b] et exaltez-le au plus haut point pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « louez le Seigneur ». Le verbe grec peut avoir ce sens général, mais « bénissez » conserve la formulation liturgique répétée dans ce chant.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « chantez des hymnes ». Le verbe grec désigne explicitement une louange chantée.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel conserve le vocabulaire liturgique récurrent du grec ; « louez » serait possible, mais atténuerait la distinction avec le verbe suivant.
- source_word: ἱερεῖς
  choice: Prêtres
  rationale: Vocatif pluriel adressé directement aux prêtres ; la forme française sans article rend naturellement cette interpellation.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend directement κύριος dans cette source grecque, sans introduire la convention typographique « l’Éternel » ou « le SEIGNEUR » liée au tétragramme hébreu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Cette expression française naturelle conserve explicitement la dimension chantée de ὑμνέω, sans laisser entendre qu’il s’agit nécessairement d’un genre moderne appelé « hymne ».
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le complément intensif « par-dessus tout » restitue la force renforcée du composé grec ὑπερυψόω tout en restant compréhensible en français actuel.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans cette formule doxologique, « pour toujours » exprime naturellement la durée indéfinie de l’idiome grec.
theological_decisions:
- issue: Traduction de κύριος dans une exhortation doxologique
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte source est grec et porte κύριος, non le tétragramme hébreu ; « le Seigneur » suit donc directement la forme transmise sans imposer une convention propre aux traductions de l’hébreu.
- issue: Rapport entre la bénédiction humaine et Dieu
  choice: bénissez le Seigneur
  alternative: louez le Seigneur
  rationale: Le français biblique peut dire que des humains « bénissent » Dieu au sens de le célébrer. Ce choix préserve la formulation liturgique grecque sans résoudre l’expression en simple louange.
translation_notes:
  register: Français international moderne, digne et liturgique. L’apostrophe « Prêtres » est concise et naturelle. Le parallélisme des impératifs ainsi que l’intensité du refrain grec sont conservés sans archaïsmes.
