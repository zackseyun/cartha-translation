  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: fr
  text: Et maintenant, nous continuons à te suivre de tout notre cœur, nous te craignons et nous cherchons ta face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous cherchons ta présence ». Le grec dit littéralement « nous cherchons ta face », expression biblique qui signifie rechercher la présence ou la faveur de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien exprimé par καί et l’immédiateté temporelle de νῦν, sans imposer une opposition absente du grec.
- source_word: ἐξακολουθοῦμεν
  choice: nous continuons à te suivre
  rationale: Le verbe composé peut exprimer le fait de continuer à suivre. Le complément « te » est implicite dans le contexte et nécessaire en français naturel.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: de tout notre cœur
  rationale: Expression française naturelle correspondant à l’idiome biblique d’un attachement entier et sans partage, tout en gardant le singulier collectif « cœur ».
- source_word: φοβούμεθά σε
  choice: nous te craignons
  rationale: Rend directement le langage de la crainte employé à propos de Dieu et préserve sa tension avec la révérence, sans l’atténuer dans le texte principal.
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: nous cherchons ta face
  rationale: Conserve l’image littérale et la résonance biblique de l’expression grecque; son sens idiomatique, chercher la présence ou la faveur de Dieu, est signalé en note.
theological_decisions:
- issue: Sens de φοβούμεθά σε à propos de Dieu
  choice: nous te craignons
  alternative: nous te révérons
  rationale: Le grec emploie explicitement le vocabulaire de la crainte. Le rendre par « craignons » maintient l’ambivalence théologique entre crainte et profond respect.
- issue: Sens de ζητοῦμεν τὸ πρόσωπόν σου
  choice: nous cherchons ta face
  alternative: nous cherchons ta présence
  rationale: Le texte principal garde l’idiome concret du grec plutôt que de le remplacer par son interprétation; la note fournit le sens idiomatique possible.
