  yaml_path: translation/deuterocanon/prayer_of_azariah/001/003.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and glorified is your name forever[b],
translation:
  language: fr
  text: Tu es béni, Seigneur, Dieu de nos pères[a] ; ton nom est digne de louange et glorifié pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu de nos ancêtres ». Le grec dit littéralement « de nos pères », expression biblique liée à l’alliance, conservée dans le texte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour les âges », expression qui désigne une durée perpétuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: béni
  rationale: Adjectif attribut dans une formule liturgique adressée directement à Dieu. « Béni » conserve le registre doxologique, tandis que « Tu es » rend l’indicatif grec εἶ sans le transformer en souhait.
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος employé ici comme titre divin dans une adresse directe.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Dieu de nos pères
  rationale: Expression biblique d’alliance qui rend explicitement le masculin πατέρων. En français, l’absence d’article après l’apostrophe « Seigneur » est naturelle.
- source_word: αἰνετὸν
  choice: digne de louange
  rationale: L’adjectif exprime le fait de mériter la louange. Cette formulation évite de le confondre avec un participe passif signifiant simplement « loué ».
- source_word: δεδοξασμένον
  choice: glorifié
  rationale: Le participe parfait passif de δοξάζω désigne le nom comme ayant reçu la gloire ou l’honneur ; « glorifié » en conserve la portée et la forme passive.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: Rend directement la métonymie biblique du nom de Dieu, sans explicitation interprétative.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français idiomatique de l’expression grecque littéralement « dans les âges », qui marque une durée perpétuelle.
theological_decisions:
- issue: Rendu de l’expression d’alliance τῶν πατέρων ἡμῶν
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec dit littéralement « nos pères ». Le texte principal conserve cette expression biblique masculine, tandis qu’une note signale l’équivalent inclusif possible en français actuel.
- issue: Valeur de la proposition nominale αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου
  choice: ton nom est digne de louange et glorifié
  alternative: que ton nom soit loué et glorifié
  rationale: Le grec énonce une affirmation doxologique plutôt qu’un souhait ou un impératif. L’indicatif français préserve cette nuance ainsi que la différence entre l’adjectif αἰνετόν et le participe passif δεδοξασμένον.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsme. La syntaxe reste naturelle tout en conservant l’affirmation à l’indicatif du grec et le parallélisme doxologique.
