base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/030.yaml
  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: fr
  text: Béni sois-tu dans le temple de ta sainte gloire, hautement loué et souverainement glorieux pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: Béni sois-tu
  rationale: Formule française naturelle et digne qui rend directement la bénédiction adressée à Dieu.
- source_word: ἐν τῷ ναῷ τῆς ἁγίας δόξης σου
  choice: dans le temple de ta sainte gloire
  rationale: Conserve la construction grecque et son association étroite entre le temple et la sainte gloire divine.
- source_word: ὑπερυμνητός
  choice: digne de toute louange
  rationale: Exprime l'idée d'une louange suprême sans employer une tournure française artificielle comme « surloué ».
- source_word: ὑπερένδοξος
  choice: souverainement glorieux
  rationale: Rend l'intensification du composé grec et maintient l'adjectif de qualité plutôt qu'une forme passive telle que « glorifié ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent idiomatique courant de la formule grecque exprimant la perpétuité.
theological_decisions:
- issue: Sens de ὑπερένδοξος
  choice: souverainement glorieux
  alternative: souverainement glorifié
  rationale: Le grec décrit Dieu comme extrêmement glorieux; il ne dit pas principalement qu'il reçoit l'action d'être glorifié.
- issue: Rapport de la gloire au temple
  choice: le temple de ta sainte gloire
  alternative: ton temple saint et glorieux
  rationale: La traduction retenue préserve le génitif grec et évite de redistribuer les qualificatifs entre le temple et la gloire.
translation_notes:
  register: Français international moderne, liturgique sans archaïsme marqué. Le parallélisme est conservé avec une formulation claire et solennelle.
