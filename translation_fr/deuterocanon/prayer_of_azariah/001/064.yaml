  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Vous qui êtes pieux et humbles de cœur, bénissez le Seigneur ; chantez ses louanges et exaltez-le hautement, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel garde le sens liturgique de dire du bien du Seigneur et de le louer, tout en préservant la formulation traditionnelle.
- source_word: ὅσιοι
  choice: fidèles
  rationale: Dans cette adresse à des personnes, le terme désigne ceux qui sont pieux, attachés à Dieu. « Fidèles » est naturel en français moderne et évite l’ambiguïté de « saints », qui pourrait évoquer un statut canonique.
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: humbles de cœur
  rationale: Cette tournure française courante exprime directement l’humilité comme disposition intérieure.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rendu usuel de κύριος dans ce contexte d’adoration adressée à Dieu.
- source_word: ὑμνεῖτε
  choice: chantez ses louanges
  rationale: Le verbe évoque une louange chantée ou hymnique ; cette formulation en conserve la dimension musicale et liturgique.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le par-dessus tout
  rationale: Le préfixe intensif ὑπερ- demande davantage que le simple verbe « exalter » ; « par-dessus tout » rend cette force de manière naturelle.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Dans le refrain liturgique, cette expression idiomatique grecque indique une durée perpétuelle.
theological_decisions:
- issue: Sens de ὅσιοι appliqué aux adorateurs
  choice: fidèles
  alternative: saints, pieux
  rationale: « Fidèles » conserve l’idée de piété et d’attachement à Dieu sans transformer le mot en catégorie ecclésiastique technique. « Pieux » serait exact mais peut paraître moins direct ; « saints » est possible, mais plus susceptible d’être compris comme un titre.
- issue: Rendu de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » est le titre français naturel dans une exhortation liturgique adressée à Dieu et n’ajoute aucune précision doctrinale étrangère au grec.
translation_notes:
  register: Style poétique et liturgique, mais en français international actuel. L’adresse initiale est placée avant l’impératif pour éviter une lecture où « le Seigneur » semblerait être le complément de « fidèles et humbles de cœur ». Le parallélisme des trois impératifs est maintenu.
