base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: fr
  text: Mais l’ange du Seigneur descendit dans la fournaise avec ceux qui étaient autour d’Azaria[a] et chassa hors de la fournaise la flamme du feu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les compagnons d’Azaria ». Le grec dit plus littéralement « ceux qui étaient autour d’Azaria ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais
  rationale: δέ assure la progression narrative avec une légère valeur contrastive par rapport au danger précédent ; « Mais » la restitue sans l’accentuer excessivement.
- source_word: ἄγγελος Κυρίου
  choice: l’ange du Seigneur
  rationale: L’article grec et le génitif Κυρίου sont rendus par la formulation française naturelle et traditionnelle « l’ange du Seigneur ».
- source_word: συνκατέβη ... ἅμα
  choice: descendit ... avec
  rationale: Le verbe composé exprime une descente accompagnée, et ἅμα souligne l’association ; « descendit ... avec » conserve les deux éléments sans lourdeur.
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  choice: ceux qui entouraient Azaria
  rationale: Cette formulation reste proche du grec, littéralement « ceux autour d’Azaria », tout en étant intelligible ; le sens probable de « compagnons » est signalé en note.
- source_word: κάμινον
  choice: fournaise
  rationale: Dans le contexte de Daniel, « fournaise » est le terme français consacré et convient à un feu intense.
- source_word: ἐξετίναξεν
  choice: chassa ... hors de
  rationale: Le verbe évoque une expulsion énergique, littéralement secouer ou projeter au-dehors ; « chassa hors de » en conserve la force et le mouvement.
- source_word: τὴν φλόγα τοῦ πυρός
  choice: la flamme du feu
  rationale: Le rendu suit la construction génitive grecque et en préserve l’expression imagée, sans la lisser en « brasier ».
- source_word: ἐκ τῆς καμίνου
  choice: hors de la fournaise
  rationale: ἐκ marque un mouvement depuis l’intérieur vers l’extérieur, clairement exprimé par « hors de ».
theological_decisions:
- issue: Traduction de Κυρίου
  choice: Seigneur
  alternative: l’Éternel ; Maître
  rationale: « Seigneur » rend naturellement κύριος dans ce récit grec et n’impose pas la convention typographique associée au tétragramme hébreu.
- issue: Identité de « l’ange du Seigneur »
  choice: Conserver l’expression sans préciser l’identité de l’ange
  alternative: L’interpréter comme une théophanie ou comme un ange créé ordinaire
  rationale: Le verset ne donne aucune identification plus précise ; la traduction maintient donc la tension théologique du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La syntaxe demeure proche du grec tout en restant naturelle.
