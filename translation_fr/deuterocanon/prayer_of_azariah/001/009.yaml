- from: Tu nous as livrés aux mains de nos ennemis qui ne respectent aucune loi, de rebelles odieux, et à un roi injuste, plus mauvais que tout autre sur la terre.[a]
  to: Tu nous as livrés aux mains de nos ennemis, des rebelles sans loi et extrêmement hostiles, et à un roi injuste, plus mauvais que tout autre sur la terre.[a]
  rationale: La révision rattache clairement les qualificatifs grecs aux « ennemis » et rend plus explicitement leur hostilité intense. Elle conserve le choix non confessionnel de « rebelles », la comparaison finale et la note signalant l’autre manière idiomatique de rendre le superlatif.
