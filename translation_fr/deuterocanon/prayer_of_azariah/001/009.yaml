base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/009.yaml
  text: And you gave us into the hands of our lawless enemies, hateful rebels, and to an unjust and most wicked king in all the earth.
translation:
  language: fr
  text: Tu nous as livrés aux mains de nos ennemis, des rebelles sans loi et extrêmement hostiles, et à un roi injuste, plus mauvais que tout autre sur la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le plus mauvais de toute la terre ».'
    reason: La fin du verset peut être comprise comme une comparaison explicite ou comme l’expression d’un superlatif à l’échelle de toute la terre.
lexical_decisions:
- source_word: παρέδωκας
  choice: tu nous as livrés
  rationale: Le verbe exprime le fait de remettre quelqu’un au pouvoir d’autrui; « livrer » est naturel et précis dans ce contexte.
- source_word: ἀνόμων
  choice: qui ne respectent aucune loi
  rationale: Cette formulation rend le sens de « sans loi / transgresseurs de la loi » dans un français courant, sans employer l’ambigu « impies ».
- source_word: ἐχθίστων ἀποστατῶν
  choice: de rebelles odieux
  rationale: ἀποστάτης désigne ici ceux qui se révoltent ou font défection; « rebelles » préserve ce sens sans imposer la notion plus étroite d’apostasie religieuse. « Odieux » restitue la forte valeur superlative de ἐχθίστων dans un français naturel.
- source_word: πονηροτάτῳ
  choice: plus mauvais que tout autre
  rationale: Le superlatif intensif est rendu par une comparaison explicite, en accord avec la construction introduite par παρά.
theological_decisions:
- issue: Portée de ἀποστατῶν
  choice: rebelles
  alternative: apostats
  rationale: Le grec peut évoquer la rébellion ou la défection; le contexte ne justifie pas de réduire le terme à l’abandon formel d’une foi.
- issue: Sens de παρὰ πᾶσαν τὴν γῆν
  choice: plus mauvais que tout autre sur la terre
  alternative: le plus mauvais de toute la terre
  rationale: La préposition παρά avec l’accusatif peut marquer une comparaison. La traduction principale conserve cette force, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’accumulation solennelle du grec tout en explicitant « sans loi » par une tournure immédiatement compréhensible.
