  text: Bless the Lord, O heavens; sing praise to him and highly exalt him forever.
translation:
  language: fr
  text: Cieux, bénissez le Seigneur ; chantez sa louange et exaltez-le au plus haut point pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bénissez
  rationale: L’impératif pluriel est rendu directement et conserve la structure liturgique répétitive du cantique.
- source_word: οὐρανοί
  choice: Cieux
  rationale: Le pluriel vocatif désigne les cieux directement interpellés ; en français, l’apostrophe se comprend naturellement sans ajouter « ô ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend κύριος selon son sens usuel dans cette adresse hymnique à Dieu, sans suggérer qu’un tétragramme hébreu figure dans le texte grec.
- source_word: ὑμνεῖτε
  choice: chantez sa louange
  rationale: Le verbe évoque une louange chantée ; cette formulation est naturelle en français moderne et garde la dimension musicale.
- source_word: ὑπερυψοῦτε
  choice: exaltez-le au plus haut
  rationale: Le préverbe intensif ὑπερ- appelle une exaltation portée au degré suprême ; la formulation conserve cette force sans lourdeur excessive.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent idiomatique français de la formule exprimant une durée perpétuelle.
theological_decisions:
- issue: Traduction de κύριος dans une adresse hymnique grecque à Dieu
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: La source grecque porte κύριον et non le nom divin hébreu ; « le Seigneur » respecte donc le témoin effectivement traduit sans introduire un arrière-plan textuel non explicite.
translation_notes:
  register: Français international moderne, poétique et liturgique. L’apostrophe « Cieux » garde l’élévation du registre sans l’archaïsme marqué de « ô cieux ». Le parallélisme des trois impératifs est conservé.
