  source_fidelity: 'Le sens général suit fidèlement le grec : consommation totale, dépôt des aliments devant Bel, dispersion de la cendre, fermeture et scellement au moyen de l’anneau royal. L’imparfait initial (« les consommaient ») est défendable dans le contexte narratif. Une explicitation légère du sujet pluriel final rend toutefois mieux la succession des actions sans modifier le sens.'
  naturalness: '« Daniel donna alors un ordre à ses jeunes serviteurs : ils apportèrent… » est un peu heurté en français, car les deux propositions ne sont pas reliées de manière assez nette. « ordonna … d’apporter » est plus naturel. Le pronom « ils » après plusieurs acteurs peut aussi être clarifié.'
  terminology: « Bel », « temple », « aliments », « jeunes serviteurs », « cendre » et « anneau du roi » conviennent. « Anneau » garde la sobriété du grec, sans ajouter inutilement « sigillaire ».
