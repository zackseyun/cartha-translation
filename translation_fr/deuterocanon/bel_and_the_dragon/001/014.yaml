  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
translation:
  language: fr
  text: Et ils les consommaient entièrement. Quand ces hommes furent sortis, le roi déposa les aliments devant Bel. Daniel ordonna alors à ses jeunes serviteurs d’apporter de la cendre, et ils la répandirent dans tout le temple, en présence du roi seul[a]. Puis Daniel et ses serviteurs sortirent, fermèrent la porte, la scellèrent avec l’anneau du roi et s’en allèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sous les yeux du roi uniquement ». Le grec souligne que la cendre fut répandue devant le roi, sans qu’un autre groupe soit présent.'
    reason: ambiguïté syntaxique et précision lexicale
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: et ils les consommaient entièrement
  rationale: L’imparfait ἀνήλουν exprime ici l’action habituelle des prêtres évoquée par le contexte; « consommer » convient aux aliments, et « entièrement » rend l’intensité de διόλου.
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: déposa les aliments devant Bel
  rationale: « Déposa… devant » conserve le geste de présentation rituelle de παρέθηκεν, tandis que « les aliments » rend naturellement le pluriel τὰ βρώματα.
- source_word: ἐπέταξεν
  choice: donna alors un ordre
  rationale: Cette expression française actuelle garde la force directive du verbe sans produire une coordination maladroite avec l’action suivante.
- source_word: τοῖς παιδαρίοις αὐτοῦ
  choice: à ses jeunes serviteurs
  rationale: παιδαρίοις peut désigner de jeunes garçons ou de jeunes assistants; le contexte de service justifie « jeunes serviteurs » tout en conservant l’indication d’âge.
- source_word: τέφραν
  choice: de la cendre
  rationale: En français, le singulier collectif « de la cendre » est l’expression idiomatique pour cette matière répandue sur le sol.
- source_word: κατέσποραν ὅλον τὸν ναόν
  choice: la répandirent dans tout le temple
  rationale: « Répandre » exprime la dispersion de la cendre; « dans tout le temple » restitue l’étendue indiquée par ὅλον.
- source_word: ἐνώπιον τοῦ βασιλέως μόνου
  choice: en présence du roi seul
  rationale: La formulation suit de près le grec et préserve la possible portée de μόνου, qui souligne que le roi était l’unique témoin de cette opération.
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: la scellèrent avec l’anneau du roi
  rationale: Le moyen du scellement est l’anneau royal; « anneau du roi » reste clair et n’ajoute pas au grec la précision explicative « sigillaire ».
