  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/007.yaml
  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: fr
  text: '« Boit-il chaque jour ? » Et Daniel dit en riant : « Ne te laisse pas tromper, ô roi ! Celui-ci est d’argile à l’intérieur et de bronze à l’extérieur, et il ne…[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni pour ce verset s’interrompt après « et il ne… » (καὶ οὐ) ; la phrase demeure donc inachevée dans l’extrait source utilisé ici.
    reason: textual_variant
lexical_decisions:
- source_word: πίνει
  choice: Boit-il
  rationale: Le verbe signifie « boire ». La tournure interrogative avec inversion est naturelle en français écrit et n’ajoute aucun complément absent du grec.
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: chaque jour
  rationale: Expression distributive courante, rendue directement et naturellement.
- source_word: γελάσας
  choice: en riant
  rationale: Le participe aoriste indique la manière ou la circonstance dans laquelle Daniel parle. « En riant » reste fluide sans affaiblir le verbe en « souriant ».
- source_word: Μὴ πλανῶ
  choice: Ne te laisse pas tromper
  rationale: Cette défense met en avant la tromperie dont le roi est victime dans le contexte. Le singulier correspond à l’adresse directe au roi.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif est conservé par une formule française solennelle et immédiatement compréhensible.
- source_word: οὗτος
  choice: Celui-ci
  rationale: Le démonstratif désigne l’objet présent sans ajouter « dieu » ou « idole », termes que le grec n’emploie pas ici.
- source_word: ἔσωθέν ἐστι πηλός
  choice: est d’argile à l’intérieur
  rationale: Rend clairement la composition interne de la statue tout en conservant le contraste spatial du grec.
- source_word: ἔξωθεν δὲ χαλκός
  choice: de bronze à l’extérieur
  rationale: « Bronze » convient à χαλκός dans le contexte d’un objet ancien et évite « laiton », historiquement moins approprié.
- source_word: καὶ οὐ
  choice: et il ne…
  rationale: Le texte grec fourni s’interrompt après la conjonction et la négation. La traduction conserve donc explicitement cette phrase inachevée sans inventer son verbe ni ajouter l’idée de « jamais ».
theological_decisions:
- issue: Fin fragmentaire du témoin grec fourni
  choice: Traduire uniquement les mots conservés et signaler l’interruption par des points de suspension
  alternative: Compléter la phrase d’après d’autres éditions ou d’après le contexte
  rationale: Le témoin transmis s’arrête à καὶ οὐ. Le maintien de la rupture respecte la primauté de la source fournie et évite d’introduire une formulation non attestée dans cet extrait.
translation_notes:
  register: Français moderne, clair et digne. L’inversion interrogative et « ô roi » maintiennent une légère solennité narrative sans rendre l’ensemble archaïque. Le tutoiement correspond à l’adresse directe au singulier dans le grec.
