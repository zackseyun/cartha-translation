  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/030.yaml
  text: And the king saw that they were pressing him very hard, and being compelled, he handed Daniel over to them.
translation:
  language: fr
  text: Le roi vit qu’ils exerçaient sur lui une très forte pression et, contraint, il leur livra Daniel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: faisaient … pression sur lui
  rationale: Le présent exprime une pression insistante et continue, plutôt qu’une simple demande; cette tournure est naturelle en français moderne.
- source_word: σφόδρα
  choice: très fortement
  rationale: L’adverbe intensifie nettement la pression exercée sur le roi sans préciser une forme de contrainte que le grec ne donne pas.
- source_word: ἀναγκασθείς
  choice: contraint
  rationale: Le participe passif indique que le roi agit sous la contrainte extérieure; « contraint » conserve cette nuance sans supposer une violence physique.
- source_word: παρέδωκεν
  choice: livra
  rationale: Le verbe décrit la remise de Daniel au pouvoir d’autrui; « livra » rend ce transfert de manière concise et idiomatique.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Degré de contrainte exercée sur le roi
  choice: Le roi agit sous une forte pression qui le contraint à livrer Daniel.
  alternative: Le roi est simplement persuadé, ou bien physiquement forcé.
  rationale: L’association de ἐπείγουσιν, de σφόδρα et de ἀναγκασθείς présente une pression intense aboutissant à une action contrainte, sans en définir précisément la nature.
translation_notes:
  register: Français moderne, clair et digne. La construction légèrement resserrée conserve la succession du constat, de la contrainte et de la remise de Daniel.
