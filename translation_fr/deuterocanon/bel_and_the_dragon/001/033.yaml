base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/033.yaml
  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: fr
  text: Le prophète Habacuc était en Judée[a]. Il avait préparé un ragoût[b] et émietté des pains[c] dans un plat, puis il se rendait aux champs pour les apporter aux moissonneurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Juda ». Le grec Ἰουδαία peut désigner la Judée ou, selon le contexte, Juda.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un mets bouilli » ; « ragoût » rend naturellement le plat préparé.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec emploie le pluriel : « des pains ».'
    reason: translation_clarification
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Habacuc
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: ὁ προφήτης
  choice: le prophète
  rationale: L’article grec désigne Habacuc comme le prophète connu, plutôt que comme un prophète indéterminé.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: en Judée
  rationale: Dans ce grec hellénistique, le terme désigne naturellement la région de Judée; « Juda » demeure possible et est signalé en note.
- source_word: ἥψησεν ἕψεμα
  choice: avait préparé un ragoût
  rationale: Le verbe et le nom évoquent un mets cuit, vraisemblablement bouilli. Cette formulation française est naturelle sans préciser indûment les ingrédients.
- source_word: ἐνέθρυψεν ἄρτους
  choice: émietté des pains
  rationale: « Émietté » rend l’action de briser en petits morceaux, tandis que le pluriel « des pains » conserve le pluriel grec.
- source_word: εἰς σκάφην
  choice: dans un plat
  rationale: Le récipient sert ici à contenir et transporter la nourriture. « Plat » reste naturel et évite les connotations trompeuses de « auge ».
- source_word: εἰς τὸ πεδίον
  choice: aux champs
  rationale: La présence des moissonneurs favorise le sens agricole; le pluriel français est idiomatique pour la destination.
- source_word: ἀπενέγκαι
  choice: pour l’apporter
  rationale: L’infinitif exprime le but du déplacement, et le pronom reprend naturellement le mets préparé.
- source_word: τοῖς θερισταῖς
  choice: aux moissonneurs
  rationale: Équivalent français précis et courant pour ceux qui font la moisson.
