  text: Why do you not bow down to Bel? But he said[a], “Because I do not revere idols made by hands, but the living God, who created heaven and”
translation:
  language: fr
  text: '« Pourquoi ne te prosternes-tu pas devant Bel ? » Il répondit : « Parce que je ne vénère pas les idoles faites de main humaine, mais le Dieu vivant, qui a créé le ciel et[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni pour ce verset s’interrompt au milieu de la phrase, après « et » (καί). La traduction conserve donc cette proposition inachevée sans ajouter de mots tirés du contexte.
    reason: textual_variant
lexical_decisions:
- source_word: προσκυνεῖς
  choice: te prosternes-tu devant
  rationale: Le verbe désigne un geste de prosternation ou d’hommage révérenciel. Cette formulation conserve à la fois la dimension physique et la portée cultuelle sans réduire le sens au seul état intérieur.
- source_word: σέβομαι
  choice: je ne vénère pas
  rationale: Le verbe exprime la révérence ou le culte. « Vénérer » distingue ce terme de προσκυνέω tout en rendant clairement l’honneur religieux refusé aux idoles.
- source_word: εἴδωλα
  choice: les idoles
  rationale: Dans ce contexte cultuel et polémique, il s’agit d’images auxquelles un statut divin est attribué ; « idoles » en rend directement la force.
- source_word: χειροποίητα
  choice: faites de main humaine
  rationale: L’expression souligne la fabrication humaine, en contraste avec le Dieu vivant et créateur. Cette tournure est naturelle en français moderne tout en préservant l’opposition.
- source_word: τὸν ζῶντα θεόν
  choice: le Dieu vivant
  rationale: L’article et le contraste avec les idoles désignent le Dieu véritable connu du locuteur. La formulation est naturelle et conserve la portée théologique du grec.
- source_word: κτίσαντα
  choice: qui a créé
  rationale: Le participe caractérise Dieu par son œuvre créatrice ; « créé » restitue plus précisément cette idée que le verbe général « fait ».
- source_word: τὸν οὐρανὸν
  choice: le ciel
  rationale: Le singulier grec se rend naturellement par « le ciel » dans une formule de création en français.
theological_decisions:
- issue: Phrase inachevée dans l’extrait grec fourni
  choice: Conserver une proposition inachevée se terminant par « et »
  alternative: Compléter, par exemple, avec « la terre » d’après le contexte ou une autre délimitation textuelle
  rationale: Le texte grec fourni s’arrête à καί (« et »). La traduction respecte donc cette limite au lieu d’introduire silencieusement des mots absents de la source transmise.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct ; « se prosterner devant » et « vénérer » préservent la distinction entre les deux verbes grecs. La note signale explicitement l’interruption matérielle de l’extrait source.
