lexical_decisions:
- source_word: ἀναβοήσας
  choice: s’écriant
  rationale: Le participe aoriste exprime un cri vigoureux; « s’écriant » en conserve l’intensité sans préciser indûment l’émotion.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Rend naturellement en français l’expression grecque indiquant une forte intensité sonore.
- source_word: Μέγας εἶ
  choice: Tu es grand
  rationale: Formulation française naturelle et solennelle; l’attribut « grand » demeure nettement mis en relief par la brièveté de l’exclamation.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans cette adresse à Dieu, « Seigneur » est le titre divin français usuel.
- source_word: ὁ θεὸς
  choice: le Dieu
  rationale: L’article grec est ici rendu dans l’apposition « Seigneur, le Dieu », ce qui respecte la structure du texte source.
- source_word: τοῦ
  choice: du
  rationale: L’article génitif grec, contracté en français avec « de », indique une expression laissée inachevée dans le texte source fourni.
theological_decisions:
- issue: Traduction de κύριος dans une adresse divine
  choice: Seigneur
  alternative: Maître
  rationale: Le personnage s’adresse au Dieu d’Israël; « Seigneur » préserve le titre divin habituel sans introduire une nuance étrangère.
- issue: Traitement du texte source incomplet se terminant par τοῦ
  choice: Conserver la proposition inachevée en français
  alternative: Ajouter la suite probable d’après le contexte ou une tradition textuelle voisine
  rationale: La primauté du témoin grec fourni exige de ne pas reconstituer silencieusement les mots absents; la note signale clairement l’inachèvement.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation marque l’apposition dans « Seigneur, le Dieu ». Le guillemet ouvrant reste sans fermeture parce que l’extrait source s’interrompt au milieu de la parole.
