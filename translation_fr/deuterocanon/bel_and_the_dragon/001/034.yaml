base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/034.yaml
  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: fr
  text: 'Un ange du Seigneur dit à Habacuc : « Porte à Babylone le repas que tu as[a] à Daniel, qui est dans la fosse aux lions[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nourriture », « le déjeuner » ou « le repas de midi » ; le terme grec désigne un repas sans en préciser à lui seul l’heure exacte.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement, « la tanière des lions ». Le grec dit plus littéralement « la fosse des lions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise l’indéfini « un ange ». « Seigneur » est le titre naturel de Dieu dans cette expression.
- source_word: Ἀμβακοὺμ
  choice: Habacuc
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: Ἀπένεγκε
  choice: Apporte
  rationale: L’impératif demande de transporter le repas jusqu’à Daniel. « Apporte » exprime naturellement cette destination sans ajouter de détail absent du grec.
- source_word: τὸ ἄριστον
  choice: le repas
  rationale: Le terme désigne un repas, souvent pris le matin ou vers le milieu de la journée selon l’époque et le contexte. « Repas » évite de préciser indûment l’heure.
- source_word: ὃ ἔχεις
  choice: que tu as
  rationale: Traduction directe de la proposition relative, sans explicitation superflue.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: La préposition εἰς avec un nom de lieu exprime ici la destination.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: dans la fosse aux lions
  rationale: λάκκος désigne concrètement une fosse. Dans le contexte, le groupe indique le lieu où se trouve Daniel; « fosse aux lions » est à la fois fidèle et idiomatique en français.
theological_decisions:
- issue: Traduction de κύριος dans l’expression ἄγγελος Κυρίου
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce récit, κύριος désigne le Dieu d’Israël. « Seigneur » conserve le titre divin usuel sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe place la destination avant le complément d’objet afin de garder Daniel et son lieu étroitement liés, tout en restant naturelle à l’oral comme à l’écrit.
