  text: '« À qui appartiennent ces empreintes de pas ? » Et le roi dit : « Je vois les empreintes de pas d’hommes, de femmes et d’enfants. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος
  choice: À qui sont
  rationale: Le génitif interrogatif exprime ici l’appartenance ou l’identité. « À qui sont » est naturel en français et conserve la question directe.
- source_word: ἴχνη
  choice: empreintes
  rationale: Le nom désigne les marques laissées par les pieds. Dans ce contexte où elles sont visibles, « empreintes » est précis et idiomatique.
- source_word: ταῦτα
  choice: ces
  rationale: Le démonstratif renvoie aux empreintes présentes sous les yeux des personnages.
- source_word: εἶπεν
  choice: répondit
  rationale: Le grec signifie littéralement « dit », mais puisque les paroles du roi répondent directement à une question, « répondit » rend naturellement la relation discursive sans modifier le sens.
- source_word: Ὁρῶ
  choice: Je vois
  rationale: Traduction directe du verbe de perception au présent.
- source_word: ἀνδρῶν
  choice: d’hommes
  rationale: Le terme désigne ici des personnes adultes de sexe masculin, distinguées des femmes et des enfants.
- source_word: γυναικῶν
  choice: de femmes
  rationale: Dans cette énumération, le sens général « femmes » convient mieux que le sens relationnel « épouses ».
- source_word: παιδίων
  choice: d’enfants
  rationale: Le terme désigne des enfants, sans qu’il soit nécessaire de préciser davantage leur âge.
