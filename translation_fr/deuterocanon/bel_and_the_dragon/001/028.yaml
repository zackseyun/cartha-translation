  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: fr
  text: 'Lorsque les Babyloniens l’apprirent, ils s’indignèrent, se rassemblèrent contre le roi et dirent : « Le roi est devenu juif[a] ! Il a renversé Bel, tué le dragon et massacré les prêtres. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « judéen ». Le mot grec peut désigner une identité ethnico-religieuse (« juif ») ou une appartenance géographique et politique (« judéen »).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσαν
  choice: Lorsque … l’apprirent
  rationale: La tournure introduit une transition narrative. En français moderne, « Lorsque … l’apprirent » en restitue naturellement le sens sans suraccentuer l’immédiateté; le pronom « l’ » reprend les événements précédents, objet sous-entendu du verbe grec.
- source_word: οἱ Βαβυλώνιοι
  choice: les Babyloniens
  rationale: Désignation ethnique et civique directe, naturelle en français.
- source_word: ἠγανάκτησαν
  choice: ils s’indignèrent
  rationale: Le verbe exprime une vive indignation; ce choix conserve cette nuance sans anticiper l’hostilité manifestée ensuite.
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: se rassemblèrent contre le roi
  rationale: La formulation rend à la fois le mouvement collectif et l’opposition au roi, sans introduire l’idée plus précise d’un complot secret.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: Le roi est devenu juif
  rationale: Dans ce contexte, l’accusation vise l’alignement du roi sur le peuple et la religion de Daniel. L’ambiguïté possible avec l’identité judéenne est conservée en note.
- source_word: τὸν Βὴλ κατέσπασεν
  choice: Il a renversé Bel
  rationale: κατασπάω évoque l’action d’abattre ou de démolir. « Renversé » convient à l’image cultuelle désignée directement par le nom Bel.
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: tué le dragon
  rationale: Rendu direct et courant du verbe ἀποκτείνω dans cette accusation.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: massacré les prêtres
  rationale: Le verbe κατασφάζω désigne une mise à mort violente; « massacré » en préserve la force.
theological_decisions:
- issue: Sens de Ἰουδαῖος
  choice: juif
  alternative: judéen
  rationale: Le contexte suggère principalement une accusation d’appartenance ou d’alignement ethnico-religieux. Toutefois, le mot grec peut aussi porter un sens géographique ou politique; la note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, narratif et digne. La formule grecque initiale est allégée pour éviter un calque pesant, tandis que les verbes de réaction collective et de violence conservent leur intensité.
