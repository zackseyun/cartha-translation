translation:
  language: fr
  text: 'la terre et qui exerce sa souveraineté sur toute chair. Le roi lui dit : « Bel ne te paraît-il pas être un dieu vivant ? Ne vois-tu pas combien il mange et[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec fourni s’interrompt après « et ». La traduction conserve donc cette fin ouverte sans compléter la phrase à partir d’une autre source.
    reason: textual_variant
lexical_decisions:
- source_word: γῆν
  choice: la terre
  rationale: Dans cette évocation du Dieu créateur, γῆ désigne la terre plutôt qu’un territoire particulier.
- source_word: ἔχοντα πάσης σαρκὸς κυρίαν
  choice: qui exerce sa souveraineté sur toute chair
  rationale: Cette formulation française naturelle exprime l’autorité souveraine indiquée par le grec tout en conservant l’expression biblique « toute chair » et son étendue potentiellement large.
- source_word: δοκεῖ σοι
  choice: ne te paraît-il pas
  rationale: Le verbe δοκεῖ présente la question sous l’angle de ce qui paraît évident à Daniel ; la tournure interrogative négative conserve sa force rhétorique.
- source_word: ζῶν θεός
  choice: un dieu vivant
  rationale: L’absence d’article et le fait que le roi parle de Bel appellent l’indéfini « un », sans importer le titre confessionnel « le Dieu vivant ».
- source_word: ὅσα ἐσθίει
  choice: combien il mange
  rationale: Dans ce contexte, ὅσα souligne la quantité censée prouver que Bel est vivant, plutôt qu’une liste des aliments consommés.
theological_decisions:
- issue: Portée de πάσης σαρκὸς dans la description de la souveraineté divine
  choice: toute chair
  alternative: tous les êtres humains ; toute créature vivante
  rationale: L’expression biblique est conservée afin de ne pas réduire son champ à l’humanité seule ni de l’étendre explicitement à tous les animaux.
- issue: Statut de Bel dans l’expression ζῶν θεός
  choice: un dieu vivant
  alternative: le Dieu vivant ; un dieu qui vit
  rationale: Le grec ne présente pas ici Bel sous le titre confessionnel « le Dieu vivant » ; la traduction maintient le point de vue du roi sans l’approuver.
