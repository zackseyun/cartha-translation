lexical_decisions:
- source_word: ἐπελάβετο
  choice: le saisit
  rationale: Le verbe exprime ici une prise ferme et soudaine; « saisit » rend cette vigueur sans ajouter de violence étrangère au contexte.
- source_word: ἄγγελος Κυρίου
  choice: l’ange du Seigneur
  rationale: Le contexte désigne un être céleste; « Seigneur » traduit Κυρίου sans importer dans ce témoin grec le tétragramme hébreu.
- source_word: τῆς κορυφῆς αὐτοῦ
  choice: par le sommet du crâne
  rationale: κορυφή désigne le sommet ou la partie supérieure de la tête. Cette formulation française conserve la précision corporelle du grec.
- source_word: βαστάσας τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: le portant par les cheveux
  rationale: βαστάζω décrit ici le transport, tandis que κόμη désigne les cheveux de la tête; la mention de la tête serait redondante en français.
- source_word: ἔθηκεν αὐτὸν
  choice: le déposa
  rationale: Dans ce déplacement miraculeux, « déposa » exprime naturellement l’action de placer l’homme à destination.
- source_word: ἐπάνω τοῦ λάκκου
  choice: au-dessus de la fosse
  rationale: La traduction maintient la relation spatiale sans préciser si l’homme se trouve sur le bord ou suspendu au-dessus.
- source_word: ἐν τῷ ῥοίζῳ τοῦ
  choice: dans le bruit impétueux du…
  rationale: ῥοῖζος évoque un bruit de souffle, de course ou de déplacement rapide. L’article génitif final τοῦ reste sans complément dans l’extrait fourni; les points de suspension rendent visible cette interruption.
theological_decisions:
- issue: Traduction de κύριος dans ἄγγελος Κυρίου
  choice: Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le témoin grec porte Κυρίου et non le nom divin hébreu. « Seigneur » respecte donc directement la forme de la source sans lui imposer une rétroversion.
- issue: Fin incomplète de l’extrait grec
  choice: Conserver la phrase interrompue et la signaler par des points de suspension et une note
  alternative: Compléter la phrase à partir d’autres éditions ou du contexte
  rationale: L’extrait source s’arrête à τοῦ, article au génitif dont le complément manque. Le texte principal ne doit pas fournir silencieusement des mots absents.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant la répétition corporelle du grec et son indication spatiale. Les points de suspension ne reconstruisent pas la lacune, mais en rendent la présence immédiatement perceptible.
