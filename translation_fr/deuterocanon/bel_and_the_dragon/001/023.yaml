lexical_decisions:
- source_word: δράκων
  choice: dragon
  rationale: « Dragon » est le correspondant français direct du grec dans ce récit et peut désigner une grande créature de type serpent.
- source_word: μέγας
  choice: grand
  rationale: « Grand » conserve la portée du grec, qui peut évoquer la taille aussi bien que le caractère imposant de la créature.
- source_word: ἐσέβοντο
  choice: lui rendaient un culte
  rationale: Dans ce contexte religieux, cette tournure exprime clairement la vénération cultuelle sans suggérer un simple respect.
- source_word: οἱ Βαβυλώνιοι
  choice: les Babyloniens
  rationale: Traduction naturelle et directe de la désignation du peuple.
theological_decisions:
- issue: Nature du rapport des Babyloniens au dragon
  choice: La relation est présentée comme un culte religieux.
  alternative: Les Babyloniens le vénéraient.
  rationale: Le contexte fait du dragon un objet de dévotion cultuelle. « Rendre un culte » explicite cette valeur sans ajouter d'affirmation étrangère au grec.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination simple et la tournure narrative conservent la sobriété du grec.
