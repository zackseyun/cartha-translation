  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/021.yaml
  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: fr
  text: Alors le roi se mit en colère et fit arrêter les prêtres, leurs femmes et leurs enfants. Ils lui montrèrent les portes secrètes par lesquelles ils entraient habituellement pour consommer ce qui se trouvait sur la table.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: se mit en colère
  rationale: Rend naturellement le participe aoriste et son sens ingressif dans le récit, sans exagérer l’intensité de la colère.
- source_word: συνέλαβεν
  choice: fit arrêter
  rationale: Dans ce contexte d’enquête royale et de fraude dévoilée, le verbe désigne une mise aux arrêts plutôt qu’une simple saisie physique.
- source_word: ἱερεῖς
  choice: prêtres
  rationale: Équivalent français courant et précis; le contexte indique déjà qu’il s’agit des prêtres de Bel.
- source_word: τὰς γυναῖκας καὶ τὰ τέκνα αὐτῶν
  choice: leurs femmes et leurs enfants
  rationale: Le regroupement familial et le possessif favorisent le sens d’épouses pour γυναῖκας; τέκνα désigne les enfants sans distinction de sexe.
- source_word: τὰς κρυπτὰς θύρας
  choice: les portes secrètes
  rationale: Expression concrète et idiomatique pour des accès dissimulés servant à la fraude.
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: par lesquelles ils entraient habituellement
  rationale: L’imparfait exprime ici une pratique répétée; «habituellement» rend explicitement cette valeur coutumière.
- source_word: ἐδαπάνων
  choice: consommer
  rationale: Le verbe signifie dépenser ou épuiser; appliqué à ce qui est disposé sur la table, «consommer» conserve sa portée tout en convenant au contexte.
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: ce qui se trouvait sur la table
  rationale: Rend le groupe nominal neutre sans ajouter explicitement «nourriture», bien que celle-ci soit impliquée par le contexte.
theological_decisions:
- issue: Sens de γυναῖκας dans l’énumération familiale
  choice: leurs femmes
  alternative: les femmes
  rationale: Le possessif αὐτῶν et l’association avec les enfants indiquent vraisemblablement les épouses des prêtres, sans enjeu doctrinal ajouté.
- issue: Portée judiciaire de συνέλαβεν
  choice: fit arrêter
  alternative: saisit
  rationale: L’action du roi suit la découverte d’une fraude; la formulation choisie communique clairement la dimension judiciaire en français moderne.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant la valeur habituelle de l’imparfait grec et sans préciser au-delà du texte la nature de ce qui était posé sur la table.
