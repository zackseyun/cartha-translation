  text: and forty sheep and six measures of wine. And the king revered him and went every day to bow down to him[a], but Daniel bowed down to his God. And the king said to him,
translation:
  language: fr
  text: 'et quarante moutons et six mesures de vin. Le roi le vénérait et allait chaque jour se prosterner devant lui[a], mais Daniel se prosternait devant son Dieu. Le roi lui dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorer » ; ici comme pour l’action de Daniel, le verbe grec peut désigner soit le fait de se prosterner, soit l’adoration, selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: quarante moutons
  rationale: πρόβατα désigne couramment les moutons ou, plus largement, le petit bétail ; « moutons » est ici le terme français naturel et suffisamment général.
- source_word: οἴνου μετρηταὶ ἕξ
  choice: six mesures de vin
  rationale: μετρητής est une mesure de capacité pour les liquides. « Mesures » conserve la quantification sans imposer une équivalence moderne incertaine.
- source_word: ἐσέβετο αὐτόν
  choice: le vénérait
  rationale: σέβομαι exprime la révérence ou le culte. « Vénérait » préserve cette nuance tout en distinguant ce verbe de προσκυνέω dans la proposition suivante.
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: allait chaque jour
  rationale: L’imparfait grec décrit une pratique habituelle ; l’imparfait français rend naturellement cette répétition quotidienne.
- source_word: προσκυνεῖν αὐτῷ
  choice: se prosterner devant lui
  rationale: προσκυνέω peut désigner l’acte de se prosterner ou l’adoration. Cette formulation conserve le geste cultuel sans trancher toute sa portée théologique.
- source_word: προσεκύνει τῷ θεῷ αὐτοῦ
  choice: se prosternait devant son Dieu
  rationale: La reprise du même verbe français que pour προσκυνεῖν maintient le contraste littéraire voulu entre le roi et Daniel.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Équivalent français usuel de βασιλεύς.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Faut-il rendre les verbes cultuels par le terme explicite « adorer » ?
  choice: Employer « vénérait » pour ἐσέβετο et « se prosterner » pour les deux occurrences de προσκυνέω.
  alternative: Employer « adorait » pour la relation du roi à Bel et pour celle de Daniel à Dieu.
  rationale: Le grec emploie d’abord σέβομαι, puis reprend προσκυνέω pour le roi et Daniel. La traduction choisie respecte cette différence lexicale et la symétrie narrative, tout en laissant ouverte la nuance entre prosternation et adoration.
translation_notes:
  register: Français international moderne, fluide et digne. « Tandis que » rend clairement le contraste marqué par δέ. La phrase demeure un fragment lié au verset précédent, d’où l’initiale en minuscule.
