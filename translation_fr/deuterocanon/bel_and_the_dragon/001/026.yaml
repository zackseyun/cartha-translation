  text: But you[a], O king, give me authority, and I will kill the dragon without sword or staff. And the king said, “I give it to you.”
translation:
  language: fr
  text: 'Mais toi, ô roi, donne-moi l’autorité, et je tuerai le dragon sans épée ni bâton. Le roi répondit : « Je te la donne[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je te l’accorde », c’est-à-dire l’autorité que Daniel vient de demander.'
    reason: Variante lexicale permettant de rendre δίδωμι de manière plus idiomatique dans le contexte d’une autorisation royale.
lexical_decisions:
- source_word: σὺ δέ
  choice: Mais toi
  rationale: δέ marque ici une transition ou un contraste, tandis que le pronom explicite σὺ met fortement le roi en relief. « Mais toi » conserve ces deux nuances.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif grec est explicite. « Ô roi » en restitue la solennité sans introduire le titre moderne « Votre Majesté ».
- source_word: δός μοι ἐξουσίαν
  choice: donne-moi l’autorité
  rationale: ἐξουσία désigne ici une autorité ou un droit délégué par le roi. « Autorité » garde cette dimension officielle, plutôt que de réduire la demande à une simple capacité.
- source_word: ἀποκτενῶ
  choice: je tuerai
  rationale: Le futur exprime directement l’action de mettre à mort. « Tuer » est clair, moderne et sans embellissement inutile.
- source_word: τὸν δράκοντα
  choice: le dragon
  rationale: δράκων désigne la créature vénérée dans ce récit. « Dragon » est la traduction habituelle et respecte la force du terme grec.
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: sans épée ni bâton
  rationale: ἄνευ porte sur les deux noms. En français, « sans… ni… » exprime naturellement cette double exclusion. ῥάβδος peut désigner un bâton, une verge ou une massue; « bâton » conserve ici l’ouverture lexicale sans imposer qu’il s’agisse uniquement d’une arme.
- source_word: Δίδωμί σοι
  choice: Je te la donne
  rationale: La réponse reprend implicitement l’autorité demandée, nom féminin en français. Le pronom « la » rend cette ellipse avec clarté tout en restant proche du verbe grec δίδωμι.
