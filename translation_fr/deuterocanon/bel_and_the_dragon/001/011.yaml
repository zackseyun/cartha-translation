base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: fr
  text: 'Le roi entra avec Daniel dans la maison de Bel[a]. Les prêtres de Bel dirent : « Voici, nous sortons. Mais toi, ô roi, dispose la nourriture et, après avoir mélangé le vin, place-le, puis ferme la porte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « temple de Bel ». Le grec dit littéralement « maison de Bel », expression pouvant désigner le sanctuaire d’une divinité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ εἰς τὸν οἶκον τοῦ Βήλ
  choice: Le roi entra avec Daniel dans la maison de Bel
  rationale: Le verbe de mouvement est sous-entendu dans le grec transmis; « entra » rend naturellement εἰς dans ce contexte. « maison de Bel » conserve le terme concret οἶκος, tout en signalant en note son sens cultuel.
- source_word: Ἰδοὺ ἡμεῖς ἀποτρέχομεν ἔξω
  choice: Voici, nous sortons
  rationale: Ἰδού attire l’attention; « Voici » convient au registre direct et digne. ἀποτρέχομεν ἔξω indique ici que les prêtres quittent les lieux; « sortons » évite de suraccentuer l’idée de course.
- source_word: σύ δέ, βασιλεῦ
  choice: Mais toi, ô roi
  rationale: Le pronom explicite et δέ marquent le contraste avec les prêtres; le vocatif est conservé dans une forme française solennelle mais intelligible.
- source_word: παράθες τὰ βρώματα
  choice: dispose les aliments
  rationale: παράθες signifie placer devant ou présenter, et βρώματα désigne les choses à manger. « dispose les aliments » convient au repas cultuel sans ajouter l’idée d’un service à table.
- source_word: τὸν οἶνον κεράσας θές
  choice: puis mélange le vin et dépose-le
  rationale: Le participe aoriste κεράσας exprime une action précédant l’impératif θές. La coordination française rend clairement la séquence pratique sans effacer la préparation du vin par mélange.
- source_word: ἀπόκλεισον τὴν θύραν
  choice: ferme la porte
  rationale: ἀποκλείω signifie fermer ou condamner l’accès; « ferme » reste exact sans introduire une serrure absente du grec.
theological_decisions:
- issue: Sens cultuel de οἶκος τοῦ Βήλ
  choice: maison de Bel
  alternative: temple de Bel
  rationale: Le contexte désigne bien le sanctuaire de Bel, mais le grec emploie littéralement « maison ». Le texte principal conserve cette image, tandis que la note donne l’équivalent contextuel.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs. Le nom Daniel suit sa forme française usuelle; « Bel » est conservé comme nom de la divinité.
