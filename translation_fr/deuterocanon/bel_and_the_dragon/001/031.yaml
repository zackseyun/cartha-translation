lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais ils
  rationale: δέ marque ici une progression avec une légère nuance de contraste; « Mais ils » la conserve naturellement.
- source_word: ἔβαλον
  choice: jetèrent
  rationale: L’aoriste de βάλλω exprime une action énergique; « jetèrent » est précis et naturel.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: dans la fosse aux lions
  rationale: λάκκος désigne une fosse ou un trou; « fosse aux lions » rend le génitif de façon idiomatique tout en restant proche du grec.
- source_word: ἦν ἐκεῖ
  choice: il y resta
  rationale: Littéralement « il était là »; dans ce contexte duratif, « il y resta » exprime naturellement le séjour sans en modifier le sens.
- source_word: ἡμέρας ἕξ
  choice: six jours
  rationale: L’accusatif indique une durée; avec « resta », le français exprime celle-ci naturellement sans ajouter « pendant ».
