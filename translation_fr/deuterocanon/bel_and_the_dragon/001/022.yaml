base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/022.yaml
  text: And the king killed them[a], and he gave Bel over to Daniel[b], and he destroyed him and his temple.
translation:
  language: fr
  text: Le roi les mit à mort, puis il livra Bel à Daniel[a], et il le détruisit, ainsi que son temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement que le roi « donna Bel comme livré », c’est-à-dire qu’il le remit au pouvoir de Daniel.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie des pronoms masculins : littéralement, « il le détruisit, lui et son temple ». Ils peuvent renvoyer à Bel comme divinité nommée ou à son idole. Le sujet de « détruisit » n’est pas exprimé en grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: mit à mort
  rationale: Le verbe signifie « tuer, faire mourir ». « Mit à mort » convient au fait que le roi ordonne ou accomplit une exécution, tout en restant naturel en français moderne.
- source_word: ἔδωκεν ... ἔκδοτον
  choice: livra ... à
  rationale: Cette construction exprime la remise de quelqu’un ou de quelque chose au pouvoir d’un autre. « Livra Bel à Daniel » rend l’idée avec concision et naturel.
- source_word: τὸν Βὴλ
  choice: Bel
  rationale: Le nom de la divinité est translittéré selon l’usage français.
- source_word: κατέστρεψεν
  choice: détruisit
  rationale: Le verbe désigne la destruction ou la ruine et s’applique ici à Bel comme à son temple.
- source_word: τὸ ἱερὸν
  choice: temple
  rationale: Dans ce contexte cultuel, « temple » est le terme français le plus direct et le plus naturel.
- source_word: αὐτὸν ... αὐτοῦ
  choice: le ... son
  rationale: Les pronoms grecs sont masculins et renvoient grammaticalement à Bel. Les formes françaises « le » et « son » préservent cette référence sans ajouter d’affirmation sur la nature de la divinité.
theological_decisions:
- issue: Genre personnel ou référence à l’idole dans les pronoms désignant Bel
  choice: Employer « le » et « son », conformément au masculin grammatical de Bel en grec.
  alternative: Répéter « Bel » ou reformuler par « la statue » et « son temple ».
  rationale: Le texte grec emploie des pronoms masculins. Le français peut les conserver naturellement sans trancher explicitement si Bel désigne la divinité, son image ou l’idole matérielle.
- issue: Sujet implicite du verbe « détruisit »
  choice: Rendre Daniel explicite par « celui-ci ».
  alternative: Conserver « il », qui pourrait grammaticalement renvoyer au roi ou à Daniel.
  rationale: Le sujet grec n’est pas exprimé, mais Daniel est le référent immédiat et celui à qui Bel vient d’être livré. « Celui-ci » donne une narration française claire, en accord avec le déroulement du récit.
translation_notes:
  register: Français moderne, narratif et digne. « Mit à mort » reflète le contexte d’une exécution royale; « livra » restitue l’idiome grec; les pronoms masculins maintiennent la forme du texte sans imposer une interprétation ontologique de Bel.
