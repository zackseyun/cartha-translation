lexical_decisions:
- source_word: οἱ δὲ ἱερεῖς
  choice: Mais les prêtres
  rationale: δέ marque ici une transition narrative avec une légère opposition; « Mais » la restitue naturellement. L’article grec est rendu par « les ».
- source_word: ἦλθον
  choice: vinrent
  rationale: L’aoriste de ἔρχομαι exprime simplement l’arrivée dans le récit; « vinrent » convient au registre narratif digne.
- source_word: τὴν νύκτα
  choice: pendant la nuit
  rationale: L’accusatif temporel indique le moment de l’action. « Pendant la nuit » est naturel et précis en français moderne.
- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: selon leur coutume
  rationale: ἔθος désigne une pratique habituelle; cette formulation reste proche du grec sans être lourde.
- source_word: καὶ αἱ γυναῖκες
  choice: ainsi que les femmes
  rationale: καί coordonne les femmes aux prêtres comme sujets de « vinrent ». « Ainsi que » rend cette coordination clairement en français. γυναῖκες peut désigner des femmes ou des épouses; le terme non interprétatif « femmes » préserve l’ambiguïté.
