  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/010.yaml
  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
translation:
  language: fr
  text: 'Daniel dit au roi : « Qu’il en soit selon ta parole[a]. » Les prêtres de Bel étaient au nombre de soixante-dix, sans compter les femmes et les enfants[b]. Et il vint[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression signifie que Daniel accepte la proposition du roi. On pourrait aussi traduire : « Qu’il en soit comme tu l’as dit. »'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « en plus des femmes et des enfants » ; ceux-ci ne sont pas compris dans le nombre de soixante-dix.'
    reason: lexical_alternative
  - marker: c
    text: Le verset se termine par « Et il vint » ; le grec ne précise ici ni qui vient ni vers quel lieu.
    reason: textual_clarity
lexical_decisions:
- source_word: Γινέσθω κατὰ τὸ ῥῆμά σου
  choice: Qu’il en soit selon ta parole
  rationale: Le verbe à l’impératif exprime ici l’assentiment de Daniel à la proposition du roi. Cette formulation française conserve à la fois la force de l’impératif et le tour formel « selon ta parole », sans transformer ῥῆμα en « ordre ».
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: les prêtres de Bel
  rationale: Rendu direct du titre cultuel et du génitif d’association avec la divinité Bel.
- source_word: ἑβδομήκοντα
  choice: au nombre de soixante-dix
  rationale: Le cardinal est rendu directement ; la tournure française s’intègre naturellement à la construction existentielle grecque.
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: sans compter les femmes et les enfants
  rationale: ἐκτός exclut les femmes et les enfants du total de soixante-dix, sans indiquer qu’ils étaient absents.
- source_word: καὶ ἦλθεν
  choice: Et il vint
  rationale: Le grec emploie le verbe général ἔρχομαι et ne précise dans ce verset ni l’identité explicite du sujet ni sa destination. Le rendu évite donc d’ajouter « entra » ou un complément de lieu.
