  text: for this expense[a], you will die; but if you show that Bel eats them, Daniel will die, because he has blasphemed against Bel. And
translation:
  language: fr
  text: pour cette dépense, vous mourrez ; mais si vous montrez que Bel les mange, Daniel mourra, parce qu’il a blasphémé contre Bel. Et[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec se termine ici par « Et » : la phrase se poursuit au verset suivant.'
    reason: Découpage du texte source
lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: pour cette dépense
  rationale: Le nom δαπάνη désigne une dépense ou un coût. La préposition « pour » donne en français une articulation naturelle à ce fragment tout en conservant son lien avec les provisions mentionnées dans le contexte.
- source_word: ἀποθανεῖσθε
  choice: vous mourrez
  rationale: Le futur exprime ici une menace ou une sentence judiciaire. « Vous mourrez » en garde directement la force sans archaïsme.
- source_word: δείξητε
  choice: vous montrez
  rationale: Le verbe signifie montrer ou démontrer. « Montrez » reste proche du grec et convient au défi probatoire lancé dans le récit.
- source_word: κατεσθίει
  choice: mange
  rationale: Le verbe peut avoir une nuance intensive, mais « mange » est ici idiomatique et évite de renforcer inutilement le ton par « dévore ».
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: il a blasphémé contre Bel
  rationale: « Blasphémer » conserve la nature religieuse de l’accusation, tandis que « contre » rend la direction hostile exprimée par εἰς sans affirmer que Bel est réellement divin.
- source_word: καὶ
  choice: Et
  rationale: Le καὶ final relie explicitement ce fragment à la suite. Il est donc conservé malgré la phrase laissée en suspens dans ce découpage.
theological_decisions:
- issue: Emploi de « blasphémer » à propos d’une divinité païenne
  choice: il a blasphémé contre Bel
  alternative: il a tenu des propos sacrilèges contre Bel
  rationale: Le terme grec peut désigner une parole outrageante ou impie dirigée contre une divinité. Le rendre par « blasphémé » restitue l’accusation formulée par les adorateurs de Bel sans valider la divinité de celui-ci.
