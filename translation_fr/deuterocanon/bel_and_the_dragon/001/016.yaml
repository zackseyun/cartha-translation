  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/016.yaml
  text: And their children too[a], and they ate up everything and drank it all. Then the king rose early in the morning, and Daniel with him.
translation:
  language: fr
  text: 'Et leurs enfants aussi : ils mangèrent tout et burent tout. Puis le roi se leva tôt, le matin[a], et Daniel avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète l’idée du matin : littéralement, « se leva tôt, le matin ».'
    reason: La note signale le redoublement temporel de ὤρθρισεν et πρωί, conservé de façon légèrement marquée dans le texte français.
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: leurs enfants
  rationale: τέκνα désigne les enfants sans les limiter aux fils. Dans ce fragment qui poursuit une énumération, καί est naturellement rendu par « ainsi que ».
- source_word: κατέφαγον πάντα
  choice: Ils mangèrent tout
  rationale: Le composé καταφαγεῖν exprime une consommation complète; avec πάντα, « mangèrent tout » restitue clairement cette totalité en français naturel.
- source_word: ἐξέπιον
  choice: burent tout
  rationale: Le verbe signifie boire entièrement, jusqu’au bout. La répétition de « tout » rend explicite la consommation totale et conserve le parallélisme.
- source_word: ὤρθρισεν … πρωί
  choice: se leva de bon matin
  rationale: L’expression idiomatique française réunit le sens de ὤρθρισεν, se lever tôt, et le renforcement temporel πρωί.
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: Daniel avec lui
  rationale: La tournure nominale concise du grec est conservée sans ajouter un verbe absent du texte.
