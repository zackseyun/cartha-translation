  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/035.yaml
  text: And Habakkuk said[a], “Lord, I have not seen Babylon, and I do not know the pit.”
translation:
  language: fr
  text: 'Et Habacuc dit : « Seigneur, je n’ai pas vu Babylone et je ne connais pas la fosse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repaire » ou « la citerne » ; le mot grec désigne généralement une cavité et renvoie ici au lieu où Daniel est retenu.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Habacuc
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif de κύριος s’adresse ici à Dieu ; « Seigneur » est l’équivalent français naturel et consacré.
- source_word: Βαβυλῶνα
  choice: Babylone
  rationale: Forme française usuelle du nom de la ville.
- source_word: οὐχ ἑώρακα
  choice: je n’ai pas vu
  rationale: Le parfait de ὁράω exprime ici l’absence d’une expérience antérieure pertinente ; le passé composé français en conserve sobrement la portée.
- source_word: τὸν λάκκον
  choice: la fosse
  rationale: λάκκος désigne de manière générale une cavité, une fosse ou une citerne ; « fosse » reste direct et évite de préciser indûment la nature du lieu.
- source_word: οὐ γινώσκω
  choice: je ne connais pas
  rationale: Le présent de γινώσκω exprime ici l’absence de connaissance ou de familiarité avec le lieu.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte identifie Dieu comme destinataire ; « Seigneur » est la formulation française normale sans ajouter de précision doctrinale.
translation_notes:
  register: Français moderne, naturel et digne. La syntaxe brève de la réplique est conservée, ainsi que la distinction entre ne pas avoir vu Babylone et ne pas connaître la fosse.
