  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: fr
  text: Daniel[a], il n’y en a pas d’autre que toi. Puis il le hissa. Quant à ceux qui avaient causé sa perte, il les jeta dans la fosse[b], et ils furent aussitôt dévorés devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec commence abruptement par : « Daniel, et il n’y en a pas d’autre que toi », sans verbe introducteur; cette phrase prolonge probablement les paroles du verset précédent. Certaines traductions ajoutent une formule telle que « le roi dit ».'
    reason: textual_variant
  - marker: b
    text: Ou « dans la tanière ». Le mot grec désigne littéralement une fosse; dans ce contexte, il s’agit de la fosse aux lions.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: il n’y en a pas d’autre que toi
  rationale: Cette formulation française naturelle conserve l’exclusivité emphatique de πλὴν σοῦ avec ἄλλος, sans préciser au-delà du grec la nature de l’éloge adressé à Daniel.
- source_word: ἀνέσπασεν
  choice: il le fit remonter
  rationale: Le verbe exprime le mouvement consistant à tirer quelqu’un vers le haut. « Fit remonter » convient à l’extraction de la fosse et reste fluide en français moderne.
- source_word: τοὺς ... αἰτίους τῆς ἀπωλείας αὐτοῦ
  choice: ceux qui avaient causé sa perte
  rationale: Cette tournure rend à la fois l’action causale et la responsabilité exprimées par αἴτιος. « Sa perte » préserve la portée de ἀπώλεια sans la réduire explicitement à la mort.
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: il les jeta dans la fosse
  rationale: « Jeta » restitue la force de ἐμβάλλω et « fosse » le sens concret de λάκκος, sans substituer dans le texte principal le terme contextuel « tanière ».
- source_word: κατεβρώθησαν
  choice: ils furent ... dévorés
  rationale: Le passif français conserve la voix du grec et évoque naturellement l’action des lions.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: « Aussitôt » rend avec concision l’immédiateté indiquée par l’adverbe grec.
- source_word: ἐνώπιον αὐτοῦ
  choice: sous ses yeux
  rationale: Cette expression idiomatique rend le fait que la scène se déroule en sa présence. Dans le contexte, le pronom renvoie au roi.
theological_decisions:
- issue: Syntaxe abrupte au début du témoin grec
  choice: Conserver l’adresse directe à Daniel sans ajouter de verbe introducteur ni identifier explicitement le locuteur.
  alternative: Ajouter une formule telle que « Le roi dit » pour lisser la transition.
  rationale: Le texte grec commence abruptement par « Daniel, et il n’y en a pas d’autre que toi », vraisemblablement comme suite du discours du verset précédent. Ajouter un locuteur dans le corps du texte résoudrait une difficulté que le témoin ne résout pas lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation marque naturellement l’éloge direct, tandis que « Quant à » articule le contraste narratif. Les deux marqueurs de note figurent bien dans le texte principal.
