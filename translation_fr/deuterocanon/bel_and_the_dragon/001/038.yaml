base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: fr
  text: '« Prends le repas[a] que Dieu t’a envoyé. » Daniel dit : « Car tu t’es souvenu de moi, ô Dieu, et tu n’as pas abandonné ceux qui t’aiment. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la meilleure portion » ou « la nourriture de choix » ; le grec τὸ ἄριστον peut désigner un repas ou ce qu’il y a de meilleur à manger.
    reason: Alternative lexicale permettant de conserver l’étendue de sens du grec.
lexical_decisions:
- source_word: λάβε
  choice: Prends
  rationale: L’impératif aoriste de λαμβάνω exprime ici un ordre direct ; « Prends » est naturel dans le contexte de la remise de nourriture.
- source_word: τὸ ἄριστον
  choice: le repas
  rationale: Employé comme substantif, ἄριστον peut désigner un repas, tout en pouvant évoquer ce qu’il y a de meilleur ou une portion de choix. Le contexte immédiat de nourriture apportée favorise « le repas », et la note conserve les autres nuances possibles.
- source_word: ἀπέστειλέν
  choice: t’a envoyé
  rationale: 'Le passé composé rend naturellement en français l’action accomplie dont le résultat est présent : le repas est maintenant arrivé.'
- source_word: ὁ θεός
  choice: Dieu
  rationale: Équivalent français courant de θεός dans ce contexte.
- source_word: Ἐμνήσθης
  choice: tu t’es souvenu de moi
  rationale: Le verbe déponent signifie ici que Dieu a gardé Daniel en mémoire et a agi en sa faveur ; cette formulation préserve l’image grecque sans l’expliciter davantage.
- source_word: ἐγκατέλιπες
  choice: tu n’as pas abandonné
  rationale: Le verbe exprime l’idée de laisser derrière soi ou de délaisser. « Abandonné » est fort, actuel et naturel en français.
- source_word: τοὺς ἀγαπῶντάς
  choice: ceux qui t’aiment
  rationale: Le participe substantivé signifie « ceux qui aiment » ; puisque Daniel s’adresse directement à Dieu, le complément implicite est naturellement rendu par « t’ » en français.
theological_decisions:
- issue: Complément implicite de « ceux qui aiment »
  choice: ceux qui t’aiment
  alternative: ceux qui aiment Dieu
  rationale: Dans l’adresse directe « ô Dieu », le référent implicite de l’amour est Dieu lui-même. La deuxième personne conserve cette adresse et n’ajoute aucune précision doctrinale.
translation_notes:
  register: Français moderne international, simple et digne. Le passé composé convient au récit et à la prière, tandis que « ô Dieu » conserve la solennité de l’invocation sans archaïsme excessif.
