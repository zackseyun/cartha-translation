  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/024.yaml
  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: fr
  text: 'Le roi dit à Daniel : « Tu ne peux pas dire que celui-ci n’est pas un dieu vivant ; prosterne-toi devant lui.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Adore-le ». Le verbe grec peut désigner le fait de se prosterner en signe d’hommage ou d’adorer, notamment lorsqu’il s’agit d’une divinité.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: Tu ne peux pas dire
  rationale: Rend directement la négation de δύναμαι avec l’infinitif, sans préciser à tort s’il s’agit d’une incapacité, d’une interdiction ou d’une impossibilité rhétorique.
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: celui-ci n’est pas un dieu vivant
  rationale: « Un dieu vivant » convient au point de vue du roi païen parlant de Bel. La minuscule évite d’assimiler cette expression au titre biblique du vrai Dieu.
- source_word: προσκύνησον αὐτῷ
  choice: Prosterne-toi donc devant lui
  rationale: « Se prosterner devant » conserve le geste concret de προσκυνέω tout en laissant le contexte exprimer sa portée cultuelle. « Donc » rend naturellement en français l’enchaînement injonctif introduit par καί, sans en faire une causalité fortement marquée.
- source_word: ὁ βασιλεὺς
  choice: Le roi
  rationale: L’article désigne le roi déjà connu dans le récit.
- source_word: τῷ Δανιὴλ
  choice: à Daniel
  rationale: Le datif marque ici le destinataire des paroles.
theological_decisions:
- issue: Faut-il rendre θεὸς ζῶν comme un titre du vrai Dieu ?
  choice: un dieu vivant
  alternative: le Dieu vivant
  rationale: Le roi parle de Bel comme d’une divinité. « Le Dieu vivant » importerait dans ses paroles une confession israélite que le contexte n’autorise pas.
- issue: Faut-il expliciter προσκυνέω par « adorer » ?
  choice: se prosterner devant lui
  alternative: l’adorer
  rationale: Le verbe peut désigner une prosternation d’hommage ou un acte d’adoration. Le contexte est religieux, mais la formulation concrète préserve mieux l’étendue sémantique du grec.
translation_notes:
  register: Français international actuel, naturel et digne. Le discours direct emploie « tu », conforme à l’adresse personnelle du roi à Daniel. La ponctuation en deux phrases évite un point-virgule lourd tout en conservant la progression de l’énoncé grec.
