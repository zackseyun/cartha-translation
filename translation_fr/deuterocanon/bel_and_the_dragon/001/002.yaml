base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/002.yaml
  text: And Cyrus the Persian received his kingdom[a], and Daniel was a companion of the king and honored above all his friends.
translation:
  language: fr
  text: Cyrus le Perse reçut son royaume, et Daniel était un compagnon du roi et était honoré plus que tous les amis du roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les courtisans » ou « les proches collaborateurs » ; dans un contexte royal, les « amis » peuvent désigner les proches associés du roi à la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: reçut
  rationale: Le verbe indique ici l’entrée en possession du pouvoir royal sans préciser s’il s’agit d’un héritage, d’une conquête ou d’un autre mode d’accession.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: son royaume
  rationale: βασιλεία peut désigner le royaume, la royauté ou le règne. « Son royaume » reste naturel en français et préserve l’ambiguïté entre pouvoir royal et domaine gouverné.
- source_word: συνβιωτής
  choice: un proche compagnon
  rationale: Ce terme rare évoque littéralement quelqu’un qui partage la vie d’un autre; dans ce contexte de cour, il exprime une association personnelle étroite avec le roi sans imposer l’idée d’une cohabitation.
- source_word: ἔνδοξος
  choice: honoré
  rationale: Dans ce contexte, le mot décrit Daniel comme estimé et tenu en honneur plutôt que « glorieux », formulation moins naturelle ici.
- source_word: ὑπὲρ πάντας τοὺς φίλους αὐτοῦ
  choice: plus que tous ses amis
  rationale: Cette formulation rend directement la comparaison grecque. « Amis » conserve le terme lexical, tandis qu’une note signale son possible sens courtisan.
theological_decisions:
- issue: Nuance courtisane de φίλοι
  choice: amis
  alternative: courtisans ou proches collaborateurs
  rationale: Le grec dit littéralement « amis », mais le terme peut désigner, dans un cadre royal hellénistique, les proches associés du souverain, voire un rang de cour. Le texte garde le sens lexical et la note préserve la nuance institutionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Proche compagnon » rend la rareté et la force relationnelle de συνβιωτής; la note évite d’effacer la nuance possible de titre ou de fonction attachée à φίλοι.
