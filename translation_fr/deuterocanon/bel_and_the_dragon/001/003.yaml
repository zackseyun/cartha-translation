  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: fr
  text: Il y avait chez les Babyloniens une idole nommée Bel. Chaque jour, on dépensait pour elle douze artabes[a] de farine fine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’artabe était une ancienne unité de capacité dont la valeur variait selon les régions et les époques.
    reason: L’unité antique est inconnue de nombreux lecteurs et ne peut être convertie avec certitude en une mesure moderne unique.
lexical_decisions:
- source_word: εἴδωλον
  choice: idole
  rationale: Équivalent français direct, naturel et exact dans ce contexte cultuel.
- source_word: τοῖς Βαβυλωνίοις
  choice: chez les Babyloniens
  rationale: Rend naturellement l’idée qu’elle se trouvait parmi eux, sans suggérer qu’elle appartenait à chaque Babylonien.
- source_word: ἐδαπανῶντο εἰς αὐτόν
  choice: on dépensait pour elle
  rationale: Conserve le sens de dépense ou de consommation au bénéfice de l’idole, avec le pronom féminin exigé en français par « idole ».
- source_word: σεμιδάλεως
  choice: farine fine
  rationale: Désigne une farine de qualité supérieure et finement moulue.
- source_word: ἀρτάβαι δώδεκα
  choice: douze artabes
  rationale: Conserve l’unité de mesure antique, dont la valeur exacte variait selon les lieux et les époques.
theological_decisions:
- issue: Référence pronominale à Bel
  choice: pour elle
  alternative: pour lui
  rationale: Le grec emploie un pronom masculin en accord avec Bel, mais le français appelle naturellement le féminin après « une idole »; ce choix ne change pas l’identité du référent.
translation_notes:
  register: Français moderne, clair et digne. Deux phrases remplacent la longue coordination grecque afin d’assurer une lecture naturelle sans perdre aucune information.
