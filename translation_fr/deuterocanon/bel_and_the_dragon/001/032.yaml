base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/032.yaml
  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: fr
  text: Il y avait sept lions dans la fosse. Chaque jour, on leur donnait deux corps[a] et deux moutons ; mais alors, on ne leur donna rien, afin qu’ils dévorent Daniel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux cadavres » ; le grec dit littéralement « deux corps », et le contexte indique qu’ils servaient de nourriture aux lions.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκῳ
  choice: fosse
  rationale: Le terme grec désigne littéralement une fosse ou une cavité ; « fosse » reste plus proche du texte que l’expression interprétative « fosse aux lions ».
- source_word: ἑπτὰ λέοντες
  choice: sept lions
  rationale: Traduction directe du nombre et du nom.
- source_word: ἐδίδοτο αὐτοῖς τὴν ἡμέραν
  choice: Chaque jour, on leur donnait
  rationale: L’imparfait exprime une pratique habituelle, et l’actif indéfini avec « on » est naturel en français tout en conservant l’agent non précisé.
- source_word: δύο σώματα
  choice: deux corps
  rationale: σώματα signifie littéralement « corps ». Dans ce contexte alimentaire, il peut s’agir de cadavres, mais la traduction principale préserve le terme plus général du grec.
- source_word: δύο πρόβατα
  choice: deux moutons
  rationale: « Moutons » désigne naturellement ici les animaux donnés en nourriture, sans préciser leur sexe.
- source_word: τότε δὲ οὐκ ἐδόθη αὐτοῖς
  choice: mais cette fois, on ne leur donna rien
  rationale: « Cette fois » rend naturellement le contraste temporel de τότε avec la ration quotidienne habituelle ; « rien » explicite en français l’objet sous-entendu de la construction passive négative.
- source_word: ἵνα καταφάγωσιν
  choice: afin qu’ils dévorent
  rationale: « Afin que » conserve la valeur finale de ἵνα, tandis que « dévorer » rend la force intensive de καταφάγωσιν dans le contexte des lions.
- source_word: τὸν Δανιήλ
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Finalité de la privation de nourriture
  choice: afin qu’ils dévorent Daniel
  alternative: si bien qu’ils pourraient dévorer Daniel
  rationale: 'Le grec ἵνα exprime normalement ici le but : la ration est retenue intentionnellement pour que les lions dévorent Daniel. La traduction conserve cette finalité sans identifier davantage ceux qui prennent cette décision.'
translation_notes:
  register: Français moderne, clair et digne. Les deux propositions grecques ont été réparties en deux phrases pour une lecture naturelle. Le passé simple marque l’action ponctuelle qui contraste avec l’imparfait de l’approvisionnement habituel.
