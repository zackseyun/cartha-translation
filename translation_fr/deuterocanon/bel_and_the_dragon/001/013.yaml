lexical_decisions:
- source_word: κατεφρόνουν
  choice: n’en faisaient aucun cas
  rationale: L’imparfait exprime leur attitude persistante. Cette tournure naturelle conserve l’idée de tenir la mesure prise pour négligeable, sans imposer comme objet précis une personne méprisée.
- source_word: πεποιήκεσαν
  choice: avaient aménagé
  rationale: Le plus-que-parfait rend l’action antérieure qui explique leur assurance; « aménagé » convient à la création intentionnelle d’un passage.
- source_word: ὑπὸ τὴν τράπεζαν κεκρυμμένην εἴσοδον
  choice: sous la table une entrée cachée
  rationale: La formulation suit clairement les rapports spatiaux du grec et conserve le terme non interprétatif « table ».
- source_word: διʼ αὐτῆς
  choice: par laquelle
  rationale: Le pronom féminin renvoie naturellement à l’entrée; la tournure française évite toute ambiguïté de référent.
- source_word: εἰσεπορεύοντο
  choice: ils entraient habituellement
  rationale: L’imparfait décrit vraisemblablement une pratique répétée; l’adverbe explicite cette valeur coutumière en français moderne.
