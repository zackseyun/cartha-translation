  text: toi. Et Daniel se leva et mangea[a], et l’ange de Dieu s’en alla—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec de ce verset est tronqué au dernier mot (ἀπε-). Le tiret final indique donc une phrase incomplète; le sens attendu est que l’ange de Dieu s’en alla ou partit.
    reason: textual_variant
lexical_decisions:
- source_word: σε
  choice: toi
  rationale: Pronom personnel de deuxième personne du singulier à l’accusatif. Ce fragment achève une parole commencée au verset précédent; « toi » en conserve la dépendance syntaxique.
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste de ἀνίστημι indique ici que Daniel se lève avant d’accomplir l’action principale.
- source_word: ἔφαγεν
  choice: mangea
  rationale: L’aoriste de ἐσθίω appelle un passé narratif simple; le passé simple convient au registre soutenu du récit biblique.
- source_word: ἄγγελος
  choice: ange
  rationale: Le contexte présente un être céleste agissant de la part de Dieu; « ange » rend naturellement ce sens.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif détermine « ange »; « l’ange de Dieu » est la formulation française directe et habituelle.
- source_word: ἀπε-
  choice: s’en alla—
  rationale: L’extrait s’interrompt après le début d’un mot désignant très probablement le départ. Le tiret signale honnêtement que la forme verbale finale n’est pas entièrement conservée dans l’extrait fourni.
theological_decisions:
- issue: Sens de ἄγγελος dans un récit deutérocanonique mettant en scène une intervention surnaturelle
  choice: ange
  alternative: messager
  rationale: Le personnage est présenté dans le contexte comme un être céleste au service de Dieu. « Ange » maintient cette portée sans la réduire ni ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient la cadence narrative. « Puis » rend l’enchaînement de καί après le fragment initial, tandis que le second « et » restitue δέ sans introduire un contraste absent du grec.
