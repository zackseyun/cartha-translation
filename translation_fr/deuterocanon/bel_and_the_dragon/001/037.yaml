translation:
  language: fr
  text: 'Alors Habacuc cria[a] : « Daniel, Daniel, prends le repas que Dieu t’a envoyé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne grecque fournie est tronquée après « Daniel, Daniel » et se termine par une lettre isolée. La suite de la traduction reprend la continuation habituelle de ce verset dans la forme théodotionique de Bel et le Dragon : Habacuc annonce à Daniel le repas que Dieu lui a envoyé.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐβόησεν
  choice: cria
  rationale: Le verbe désigne ici un appel lancé d’une voix forte. « Cria » en conserve l’intensité tout en restant naturel dans ce récit.
- source_word: Ἀμβακοὺμ
  choice: Habacuc
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du prophète.
- source_word: λέγων
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent un verbe de proclamation, sans rendre lourdement le participe grec par « en disant ».
- source_word: Δανιὴλ Δανιήλ
  choice: Daniel, Daniel
  rationale: La répétition du vocatif est conservée, car elle exprime l’insistance de l’appel direct.
- source_word: Β
  choice: prends le repas que Dieu t’a envoyé
  rationale: La ligne grecque fournie est tronquée après l’appel répété et se termine par une lettre isolée. Cette formulation reprend la suite habituelle du verset dans la forme théodotionique, tout en signalant cette reconstruction dans une note.
theological_decisions:
- issue: Traitement du texte source tronqué
  choice: Donner la suite narrative habituelle, selon laquelle Dieu a envoyé un repas à Daniel, et signaler explicitement la lacune du texte fourni.
  alternative: 'Ne traduire que la portion conservée : « Alors Habacuc cria : “Daniel, Daniel…” »'
  rationale: Cette solution fournit un verset utilisable conformément au courant complet de Théodotion indiqué dans les données, sans dissimuler que la ligne grecque effectivement fournie ne contient pas toute la proposition.
translation_notes:
  register: Français international moderne, simple et digne. « Alors » assure la continuité narrative; « repas » est courant et précis. La syntaxe française évite le calque participial « en disant ».
