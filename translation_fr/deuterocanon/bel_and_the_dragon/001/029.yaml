base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/029.yaml
  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
translation:
  language: fr
  text: 'Ils allèrent trouver le roi et lui dirent : « Livre-nous Daniel[a] ; sinon, nous te tuerons, toi et toute ta maison[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Remets-nous Daniel » ; le verbe grec exprime ici l’idée de le livrer en leur pouvoir.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « maison » désigne les membres de la maisonnée ou de la famille du roi, et non simplement le bâtiment.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐλθόντες πρὸς τὸν βασιλέα
  choice: Ils allèrent trouver le roi
  rationale: Le participe aoriste indique le déplacement préalable vers le roi. Cette tournure française naturelle conserve la succession des actions.
- source_word: Παράδος ἡμῖν τὸν Δανιήλ
  choice: Livre-nous Daniel
  rationale: L’impératif aoriste de παραδίδωμι exige que Daniel soit remis en leur pouvoir. « Livre-nous » est direct, idiomatique et conserve la force de la demande.
- source_word: εἰ δὲ μή
  choice: sinon
  rationale: « Sinon » rend naturellement en français la condition négative qui introduit l’ultimatum.
- source_word: ἀποκτενοῦμέν σε
  choice: nous te tuerons
  rationale: Le futur de ἀποκτείνω exprime une menace directe de mort. « Tuerons » reste simple et n’ajoute aucune nuance judiciaire.
- source_word: τὸν οἶκόν σου
  choice: toute ta maison
  rationale: Dans ce contexte, οἶκος désigne vraisemblablement les personnes rattachées à la maison du roi. La tournure biblique française « toute ta maison » conserve toutefois l’étendue et la légère ambiguïté du grec.
theological_decisions:
- issue: Portée de οἶκος dans la menace
  choice: toute ta maison
  alternative: toute ta maisonnée / toute ta famille
  rationale: Le contexte favorise les membres de la maison plutôt que le bâtiment, mais « maison » préserve mieux l’amplitude du terme grec, qui peut englober famille, maisonnée et maison dynastique. La note explicite ce sens sans le réduire aux seuls parents de sang.
translation_notes:
  register: Français moderne, direct et digne. Le discours conserve la brutalité de l’ultimatum. « Livre-nous Daniel » convient à la menace sans registre inutilement soutenu ; « toute ta maison » garde la portée collective et l’ambiguïté traditionnelle de οἶκος, précisées en note.
