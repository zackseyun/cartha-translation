    issue: Alternative finale insuffisamment explicite
    rationale: Le grec oppose la mort des prêtres à celle de Daniel, avec ellipse du verbe après ἢ. La formulation révisée restitue clairement cette seconde conséquence sans ajouter de sens.
  - severity: medium
    issue: « ment contre nous » est peu idiomatique
    rationale: Cette expression reproduit trop littéralement le grec. Le contexte permet « nous accuse faussement », tandis que la note signale que le grec peut aussi désigner des mensonges dirigés contre eux.
  - severity: low
    issue: Instrument de scellement
    rationale: « Avec ton anneau » est la construction française usuelle pour exprimer τῷ δακτυλίῳ σου.
