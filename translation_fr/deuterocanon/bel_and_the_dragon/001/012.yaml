  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/012.yaml
  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
translation:
  language: fr
  text: Et scelle-la avec ton anneau. Puis, lorsque tu viendras le matin, si tu ne trouves pas que tout a été mangé par Bel, nous mourrons — ou bien Daniel, qui nous accuse faussement[a], mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi désigner quelqu’un qui ment à leur sujet ou qui profère des mensonges contre eux, avec une nuance d’accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον
  choice: scelle-la
  rationale: L’impératif exprime l’action d’apposer un sceau; le pronom reprend naturellement la porte dans le contexte immédiat.
- source_word: τῷ δακτυλίῳ σου
  choice: de ton anneau
  rationale: δάκτυλιος désigne un anneau, ici employé pour sceller; «anneau» reste fidèle sans expliciter inutilement «chevalière».
- source_word: ἐλθὼν πρωὶ
  choice: quand tu viendras le matin
  rationale: Le participe circonstanciel est rendu par une proposition temporelle naturelle, tandis que πρωί est conservé par «le matin».
- source_word: πάντα βεβρωμένα
  choice: que tout a été mangé
  rationale: Le parfait passif indique qu’au moment de la constatation, tout se trouvera déjà consommé.
- source_word: ὑπὸ τοῦ Βήλ
  choice: par Bel
  rationale: Le grec nomme directement Bel, sans ajouter «le dieu».
- source_word: ἀποθανούμεθα
  choice: nous mourrons
  rationale: Le futur est rendu directement; dans le contexte, il énonce la conséquence convenue.
- source_word: ὁ ψευδόμενος καθʼ ἡμῶν
  choice: qui ment contre nous
  rationale: Cette formulation proche du grec préserve la force adversative de κατά et l’ambiguïté entre mensonge dirigé contre eux et fausse accusation.
theological_decisions:
- issue: Nature de l’accusation portée contre Daniel
  choice: qui ment contre nous
  alternative: qui nous accuse faussement
  rationale: Le tour ψεύδομαι avec κατά peut évoquer un mensonge dirigé contre quelqu’un ou une accusation mensongère. Le texte principal conserve cette tension, et la note donne l’équivalent accusatoire naturel.
translation_notes:
  register: Français moderne, courant et digne. Tutoiement maintenu entre les interlocuteurs selon le contexte narratif. La tournure volontairement serrée «ment contre nous» est accompagnée d’une note afin de préserver l’ambiguïté du grec.
