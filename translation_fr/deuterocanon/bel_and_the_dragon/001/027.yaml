base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/027.yaml
  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
translation:
  language: fr
  text: 'Daniel prit de la poix, de la graisse et des poils, les fit cuire ensemble et en confectionna des galettes. Il les mit dans la gueule du dragon ; après les avoir mangées, le dragon éclata. Daniel dit alors : « Voyez vos objets de culte ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos choses sacrées » ou « ce que vous vénérez » ; le grec désigne des réalités tenues en révérence ou faisant l’objet d’un culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: de la poix
  rationale: Le grec désigne une matière résineuse ou bitumineuse. « Poix » est précis, traditionnel et reste compréhensible en français moderne.
- source_word: στῖρ
  choice: de la graisse
  rationale: Le terme désigne de la graisse animale ; « graisse » conserve la portée générale sans préciser indûment « suif ».
- source_word: τρίχας
  choice: des poils
  rationale: Dans une liste d’ingrédients d’origine probablement animale, « poils » est plus naturel que « cheveux » et rend littéralement le pluriel grec.
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: les fit cuire ensemble
  rationale: ἕψω peut signifier faire bouillir ou cuire. « Faire cuire ensemble » restitue l’opération et le mélange sans imposer un procédé culinaire plus précis que le contexte.
- source_word: μάζας
  choice: des galettes
  rationale: μᾶζα désigne une masse pétrie ou une galette. « Galettes » évoque naturellement les portions façonnées avant d’être données au dragon.
- source_word: εἰς τὸ στόμα τοῦ δράκοντος
  choice: dans la gueule du dragon
  rationale: « Gueule » est le terme français naturel pour la bouche d’un animal et conserve δράκων comme « dragon » dans ce récit.
- source_word: φαγὼν διερράγη ὁ δράκων
  choice: après les avoir mangées, le dragon éclata
  rationale: Le participe aoriste exprime ici l’antériorité, et διερράγη une rupture violente. L’accord de « mangées » renvoie naturellement aux galettes.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: ce que vous vénérez
  rationale: Cette formulation française rend les choses tenues en révérence ou adorées, tout en évitant d’ajouter le terme interprétatif « idoles ».
theological_decisions:
- issue: Rendu de τὰ σεβάσματα ὑμῶν dans une polémique contre le culte du dragon
  choice: ce que vous vénérez
  alternative: vos objets de culte ; vos choses sacrées ; vos idoles
  rationale: Le grec vise ce qui fait l’objet de révérence ou de culte sans employer explicitement le mot « idoles ». La formulation retenue préserve cette largeur sémantique et laisse l’ironie polémique ressortir du récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Poix » est maintenu pour sa précision matérielle ; « gueule » est idiomatique sans être familier dans le cas d’un animal. La phrase finale conserve l’exclamation et la force ironique du grec.
