  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/025.yaml
  text: And Daniel said[a], “I will bow down to the Lord my God, because he is the living God.”
translation:
  language: fr
  text: 'Et Daniel dit : « Je me prosternerai devant le Seigneur mon Dieu[a], parce que c’est lui qui est le Dieu vivant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’adorerai le Seigneur mon Dieu. » Le verbe grec peut désigner le fait de se prosterner ou celui de rendre un culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: je me prosternerai devant
  rationale: Le verbe désigne concrètement l’action de se prosterner en signe de révérence et, dans ce contexte, de rendre un culte. Cette formulation conserve à la fois le geste et sa portée religieuse sans réduire le terme à une notion abstraite.
- source_word: Κυρίῳ τῷ θεῷ μου
  choice: le Seigneur mon Dieu
  rationale: Les deux groupes au datif désignent ensemble celui devant qui Daniel se prosternera. « Le Seigneur mon Dieu » est une formulation française naturelle et fidèle.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la raison de la déclaration de Daniel.
- source_word: οὗτός ἐστιν θεὸς ζῶν
  choice: c’est lui, le Dieu vivant
  rationale: Le démonstratif οὗτος est conservé avec sa valeur emphatique, importante dans le contraste avec l’idole. « Le Dieu vivant » rend naturellement θεὸς ζῶν comme confession de l’unicité et de la vie véritable de Dieu.
theological_decisions:
- issue: Portée cultuelle de προσκυνέω
  choice: je me prosternerai devant
  alternative: j’adorerai
  rationale: Le choix principal préserve le geste concret exprimé par le grec tout en laissant le contexte indiquer qu’il s’agit d’un acte de culte. Une note signale explicitement l’autre traduction possible.
- issue: Force de οὗτος dans l’affirmation sur Dieu
  choice: c’est lui, le Dieu vivant
  alternative: il est le Dieu vivant
  rationale: La tournure retenue maintient l’insistance démonstrative du grec et le contraste théologique entre le Seigneur et Bel, sans ajouter d’explication étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Se prosterner devant » est idiomatique et conserve l’image corporelle du grec; la reprise « c’est lui » garde l’emphase du démonstratif.
