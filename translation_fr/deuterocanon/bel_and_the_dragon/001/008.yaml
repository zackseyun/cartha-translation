lexical_decisions:
- source_word: βέβρωκεν οὐδέποτε
  choice: n’a jamais mangé
  rationale: Le parfait βέβρωκεν, nié par οὐδέποτε, exprime une action qui ne s’est jamais produite jusqu’au moment présent. « N’a jamais mangé » est naturel et fidèle.
- source_word: θυμωθεὶς
  choice: se mit en colère
  rationale: Le participe aoriste marque ici la colère qui précède et motive l’action du roi, sans imposer l’intensité plus forte de « devint furieux ».
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Traduction directe et usuelle du titre.
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Rend simplement l’acte de faire venir les prêtres; « convoqua » serait également possible, mais plus administratif.
- source_word: τοὺς ἱερεῖς αὐτοῦ
  choice: ses prêtres
  rationale: ἱερεῖς désigne des prêtres et αὐτοῦ exprime leur rattachement au roi ou à son culte.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Formule française naturelle qui conserve les deux éléments du grec.
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: Si vous ne me dites pas
  rationale: Reproduit clairement la condition introduite par ἐὰν μή avec le subjonctif.
- source_word: τίς ὁ κατεσθίων
  choice: qui mange
  rationale: Le participe présent substantivé désigne celui qui est en train de manger ou mange habituellement. « Qui mange » reste naturel et laisse l’objet inachevé suivre.
- source_word: τὴν
  choice: la
  rationale: L’article accusatif féminin est conservé malgré l’interruption de l’extrait, afin de signaler que la phrase et son complément se poursuivent au verset suivant.
