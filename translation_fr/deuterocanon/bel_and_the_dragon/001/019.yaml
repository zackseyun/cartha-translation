  text: Not even one. And Daniel laughed[a], and held the king back from going inside, and said, “Now look at the floor, and take notice.”
translation:
  language: fr
  text: 'Pas un seul. Daniel rit, retint le roi pour l’empêcher d’entrer et lui dit : « Regarde donc le sol et rends-toi compte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « sache » ou « reconnais » ; ici, il s’agit d’observer attentivement et de comprendre ce que montre le sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: Pas un seul
  rationale: Cette formulation concise conserve la négation emphatique et abrupte du grec, sans expliciter davantage son référent.
- source_word: ἐγέλασεν
  choice: se mit à rire
  rationale: Le verbe signifie simplement « rire » ; cette traduction n’ajoute ni moquerie ni atténuation.
- source_word: ἐκράτησεν
  choice: retint
  rationale: Dans cette construction de prévention, le verbe indique que Daniel empêche physiquement ou concrètement le roi d’avancer, sans nécessairement suggérer la violence.
- source_word: τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  choice: pour l’empêcher d’entrer
  rationale: L’infinitif articulé exprime ici ce que Daniel empêche ; la formulation est naturelle en français actuel.
- source_word: Ἴδε δὴ
  choice: Regarde donc
  rationale: L’impératif appelle l’attention, tandis que δή lui donne une force immédiate que « donc » rend naturellement.
- source_word: τὸ ἔδαφος
  choice: le sol
  rationale: Dans la pièce du temple, « sol » désigne naturellement la surface que le roi doit examiner.
- source_word: γνῶθι
  choice: rends-toi compte
  rationale: L’impératif invite le roi à percevoir et reconnaître ce que révèle l’examen du sol, tout en gardant implicite l’objet de cette prise de conscience.
