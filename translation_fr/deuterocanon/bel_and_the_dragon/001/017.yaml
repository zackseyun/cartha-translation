  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
translation:
  language: fr
  text: 'Il dit : « Les sceaux sont-ils intacts, Daniel ? » Celui-ci répondit : « Ils sont intacts, ô roi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σῶοι
  choice: intacts
  rationale: L’adjectif signifie « sains, saufs, en bon état ». Appliqué aux sceaux, « intacts » exprime naturellement qu’ils n’ont pas été brisés ni altérés.
- source_word: αἱ σφραγῖδες
  choice: les sceaux
  rationale: Le terme désigne ici les sceaux ou empreintes servant à garantir que l’entrée n’a pas été ouverte.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif grec marque une adresse directe et solennelle ; « ô roi » en conserve la force sans ajouter de nuance possessive.
- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: Il dit… Celui-ci répondit
  rationale: Le premier verbe introduit une question et le second sa réponse. Cette légère variation est naturelle en français tout en préservant la succession narrative du grec.
