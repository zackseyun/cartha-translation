  text: And King Astyages was gathered to his fathers,[a]
translation:
  language: fr
  text: Le roi Astyage fut réuni à ses pères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « fut ajouté à ses pères »; expression biblique signifiant qu’il mourut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ΚΑΙ
  choice: Le
  rationale: En tête d’un nouveau récit autonome, καί peut rester non traduit en français naturel; « Et » serait possible, mais plus dépendant d’un contexte antérieur.
- source_word: ὁ βασιλεὺς Ἀστυάγης
  choice: le roi Astyage
  rationale: L’article grec est rendu naturellement en français devant le titre suivi du nom propre; « Astyage » est la forme française traditionnelle du nom.
- source_word: προσετέθη
  choice: fut réuni
  rationale: Le passif de προστίθημι signifie littéralement « fut ajouté »; avec « à ses pères », il forme un idiome biblique relatif à la mort. « Fut réuni » conserve l’image et sa dignité sans la réduire au simple verbe « mourut ».
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: à ses pères
  rationale: Cette formulation conserve l’image grecque et l’écho biblique; « à ses ancêtres » serait plus immédiatement transparent, mais moins proche du texte.
theological_decisions:
- issue: Sens de l’idiome funéraire προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: fut réuni à ses pères
  alternative: mourut; fut ajouté à ses pères
  rationale: Le rendu retenu préserve l’idiome biblique et son évocation d’une réunion aux générations précédentes, sans préciser davantage ce que le grec laisse implicite.
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au récit écrit et maintient un registre digne. L’ouverture grecque καί n’est pas rendue, car un « Et » initial serait moins naturel dans ce verset autonome et n’apporte ici aucune nuance temporelle nécessaire.
