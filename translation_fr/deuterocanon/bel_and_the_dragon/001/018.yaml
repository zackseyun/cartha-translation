  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/018.yaml
  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: fr
  text: 'Et il arriva qu’au moment où les portes furent ouvertes, le roi regarda la table et s’écria d’une voix forte : « Tu es grand, Bel, et il n’y a chez toi aucune tromperie ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: Et il arriva que
  rationale: Conserve la formule de transition narrative grecque dans un français digne et intelligible, sans recourir à une tournure archaïque comme « il advint ».
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  choice: au moment où les portes furent ouvertes
  rationale: Rend la simultanéité temporelle de la construction avec ἅμα sans accentuer indûment l’immédiateté par « dès que ».
- source_word: ἐπιβλέψας ὁ βασιλεὺς ἐπὶ τὴν τράπεζαν
  choice: le roi regarda la table
  rationale: Transpose naturellement le participe grec en verbe conjugué et conserve le sens visuel simple, sans ajouter l’idée d’un examen minutieux ni préciser qu’il s’agit d’une table d’offrandes.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: s’écria d’une voix forte
  rationale: Reproduit à la fois la force du verbe et la mention explicite de la voix forte dans un français idiomatique.
- source_word: Μέγας εἶ, Βήλ
  choice: Tu es grand, Bel
  rationale: Conserve l’apostrophe directe et solennelle ainsi que la translittération usuelle du nom divin.
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: il n’y a chez toi aucune tromperie
  rationale: « Tromperie » couvre le sens de δόλος sans le restreindre à la fraude matérielle; « chez toi » reflète παρὰ σοὶ tout en restant naturel en français.
theological_decisions:
- issue: La déclaration du roi sur Bel pourrait être formulée comme si le narrateur l’approuvait.
  choice: La parole est conservée telle quelle dans le discours direct du roi.
  alternative: Ajouter une réserve indiquant qu’il ne s’agit que de l’impression du roi.
  rationale: Le grec rapporte directement l’exclamation du roi. Ne pas ajouter de commentaire préserve l’ironie dramatique et la tension théologique du récit sans transformer cette parole en affirmation du narrateur.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme marqué. La syntaxe conserve la transition narrative du grec, tandis que les actions sont formulées avec clarté. Aucun ajout explicatif n’est nécessaire dans le texte ni en note.
