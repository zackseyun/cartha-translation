base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: fr
  text: Il plaça aussitôt Habacuc à sa place[a]. Le septième jour, le roi vint faire le deuil de Daniel. Il s’approcha de la fosse[b], regarda à l’intérieur, et voici que Daniel était assis là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers son lieu » ou « à son lieu ». La préposition grecque indique une direction ; après le verbe, le français rend naturellement l’arrivée dans ce lieu par « à sa place ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « tanière ». Le grec emploie un terme général pour une fosse ou une cavité, non un mot désignant spécialement une tanière de lions.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: remit
  rationale: Le verbe indique ici que l’agent fait revenir Habacuc à un lieu déterminé. « Remit » exprime sobrement ce rétablissement dans son lieu, sans préciser davantage le mode du transport.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: L’adverbe marque l’immédiateté; « aussitôt » est naturel et fidèle au rythme narratif.
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: à l’endroit qui était le sien
  rationale: Cette formulation conserve l’idée du lieu propre à Habacuc sans introduire explicitement « chez lui » ou « d’où il venait », notions plausibles mais non formulées telles quelles dans le grec.
- source_word: πενθῆσαι
  choice: faire le deuil de
  rationale: L’infinitif exprime le but de la venue du roi et suppose qu’il croit Daniel mort; « faire le deuil de » rend clairement cette lamentation funèbre.
- source_word: λάκκον
  choice: fosse
  rationale: Le terme grec désigne une cavité ou une fosse et n’est pas, en lui-même, le terme spécialisé pour une tanière de lions.
- source_word: ἐνέβλεψεν
  choice: regarda à l’intérieur
  rationale: Dans ce contexte, le roi dirige son regard dans la fosse. Cette tournure est claire en français moderne sans renforcer le verbe en « scruta ».
- source_word: ἰδοὺ
  choice: et voici que
  rationale: La formule garde l’effet de découverte soudaine et la vivacité narrative du grec.
- source_word: καθήμενος
  choice: était assis là
  rationale: Le participe décrit la posture de Daniel; « là » explicite naturellement en français sa présence dans la fosse sans modifier le sens.
theological_decisions:
- issue: Le deuil du roi pour Daniel
  choice: faire le deuil de Daniel
  alternative: pleurer Daniel
  rationale: Le récit présente le roi comme venant dans l’attente de trouver Daniel mort. La traduction préserve cette perspective narrative sans expliquer ni atténuer la tension créée par la survie de Daniel.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat, tout en conservant l’immédiateté, le but funèbre de la visite et l’effet de surprise introduit par ἰδοὺ.
