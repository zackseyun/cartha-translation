  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: fr
  text: Il renvoya[a] tous les objets que Cyrus avait retirés de Babylone ; et tout ce que Cyrus avait dit de faire, il ordonna lui-même qu’on le fasse et qu’on l’envoie à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « expédia » ; le contexte de la restitution des objets du temple permet de comprendre ici « renvoya ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: renvoya
  rationale: Le verbe signifie littéralement « envoya au-dehors » ou « expédia ». Le contexte de la restitution des objets du temple permet de rendre ici le mouvement comme un renvoi, sans masquer l’alternative dans la note.
- source_word: πάντα τὰ σκεύη
  choice: tous les objets
  rationale: σκεύη désigne des objets, récipients ou ustensiles ; dans ce contexte, il s’agit des objets destinés au temple. « Objets » est naturel et n’ajoute pas au texte le qualificatif « sacrés ».
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: que Cyrus avait mis à part pour les retirer de Babylone
  rationale: Cette formulation conserve l’idée de séparation exprimée par χωρίζω et la provenance indiquée par ἀπό, tout en évitant l’expression française peu naturelle « séparés de Babylone ».
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: tout ce que Cyrus avait dit de faire
  rationale: La tournure garde la formulation grecque condensée et la valeur de l’infinitif ποιῆσαι.
- source_word: καὶ αὐτὸς
  choice: il ... lui-même
  rationale: Le pronom αὐτός est emphatique ; « lui-même » en restitue l’insistance.
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime un ordre formel et administratif ; « ordonna » en conserve clairement la force.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: qu’on le fasse et qu’on l’envoie à Jérusalem
  rationale: La construction française impersonnelle rend naturellement les deux infinitifs dépendant de « ordonna » et conserve leur parallélisme ainsi que la direction vers Jérusalem.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « faire » est maintenue parce qu’elle reflète la formulation grecque, tandis que la construction avec « qu’on » évite une phrase artificiellement passive.
