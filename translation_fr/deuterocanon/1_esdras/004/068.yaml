- from: 'Et maintenant, ô roi, mon seigneur, voilà ce que je sollicite et ce que je te demande ; ce sera là une marque de grandeur de ta part. Je t’en prie donc : accomplis le vœu[a] que j’ai fait au Roi du ciel, afin qu’il se réalise par ta parole[b].'
  to: 'Et maintenant, ô roi, mon seigneur, voilà ce que je sollicite et ce que je te demande ; ce sera là une marque de grandeur de ta part. Je t’en prie donc : accomplis le vœu[a] que j’ai fait au Roi du ciel, afin qu’il soit accompli par ta parole[b].'
  rationale: La révision remplace seulement « afin qu’il se réalise » par « afin qu’il soit accompli ». Elle rend ainsi plus explicitement le δεύτερο ποιῆσαι, tout en évitant de trancher au-delà du texte le rattachement précis de l’infinitif final. Les notes et leurs ancres sont conservées et correspondent aux termes signalés.
