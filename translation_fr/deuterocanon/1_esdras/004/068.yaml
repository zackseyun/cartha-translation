base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: fr
  text: 'Et maintenant, ô roi, mon seigneur, voilà ce que je sollicite et ce que je te demande ; ce sera là une marque de grandeur de ta part. Je t’en prie donc : accomplis le vœu[a] que j’ai fait au Roi du ciel, afin qu’il soit accompli par ta parole[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner une prière ; associé ici au verbe de même famille, il évoque plus probablement un vœu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ta bouche », c’est-à-dire par ton ordre ou ton autorisation exprimée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ
  choice: je sollicite
  rationale: Dans cette requête adressée à la cour, le verbe exprime une demande respectueuse. « Solliciter » conserve le ton formel et permet de le distinguer de αἰτοῦμαι.
- source_word: αἰτοῦμαί
  choice: je te demande
  rationale: Le verbe courant « demander » rend clairement la seconde formulation de la requête tout en préservant le redoublement rhétorique grec.
- source_word: ἡ μεγαλωσύνη ἡ παρὰ σοῦ
  choice: une marque de grandeur de ta part
  rationale: Cette formulation française naturelle conserve l’idée d’une grandeur ou magnanimité émanant du roi, sans réduire explicitement le terme à une simple faveur.
- source_word: δέομαι
  choice: je t’en prie
  rationale: Cette expression intensifie l’appel par rapport aux deux verbes précédents, tout en gardant un registre digne et actuel.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: accomplis le vœu
  rationale: Le grec dit littéralement « faire le vœu ». En français, « accomplir le vœu » exprime naturellement la mise à exécution de ce qui a été voué.
- source_word: ἣν ηὐξάμην
  choice: que j’ai fait
  rationale: Avec « le vœu », l’expression française « faire un vœu » restitue le lien cognat entre εὐχή et ηὐξάμην sans lourdeur.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: au Roi du ciel
  rationale: Traduction directe du titre divin, avec la majuscule signalant qu’il désigne Dieu dans ce contexte.
- source_word: ἐκ στόματός σου
  choice: par ta parole
  rationale: Le grec dit littéralement « de ta bouche ». Ici, la bouche représente la déclaration, l’ordre ou l’autorisation orale du roi ; « par ta parole » conserve l’image sous une forme française idiomatique.
theological_decisions:
- issue: Référent du « Roi du ciel »
  choice: Titre divin désignant Dieu
  alternative: Un roi céleste au sens indéterminé
  rationale: Dans ce cadre juif, le titre distingue le Dieu céleste du roi terrestre auquel le locuteur s’adresse.
- issue: Sens de εὐχή / ηὐξάμην
  choice: Langage du vœu
  alternative: Langage de la prière ou de la demande
  rationale: La reprise du substantif εὐχή par le verbe cognat ηὐξάμην favorise ici le sens d’un engagement voué, tout en laissant l’autre sens lexical signalé en note.
- issue: Rapport du dernier infinitif ποιῆσαι avec la proposition
  choice: 'But ou résultat attendu : le vœu doit se réaliser par la parole royale'
  alternative: Engagement personnel du locuteur à accomplir le vœu au moyen de la parole du roi
  rationale: La syntaxe grecque est resserrée et permet plus d’un rattachement. La traduction retient le déroulement contextuel le plus naturel sans identifier davantage le contenu concret du vœu.
translation_notes:
  register: Français international moderne, respectueux et solennel sans archaïsmes. « Ô roi, mon seigneur » rend le double vocatif grec de façon idiomatique ; le tutoiement correspond à l’adresse directe au souverain dans ce registre biblique.
