base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: fr
  text: Et que tous ceux qui montent de Babylonie[a] pour bâtir la ville aient la liberté[b], eux et leurs enfants, ainsi que tous les prêtres qui montent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le nom de la région, « Babylonie », plutôt que celui de la ville, « Babylone ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que la liberté leur appartienne ». Il peut s’agir d’une liberté ou d’une exemption accordée par décret, sans que sa nature exacte soit précisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: tous ceux qui montent
  rationale: Le participe substantivé a une portée distributive. Dans le contexte du retour vers Jérusalem, « monter » conserve l’expression géographique biblique tout en restant naturel en français.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: de Babylonie
  rationale: Le grec emploie le nom de la région, Βαβυλωνία, et non celui de la ville, Βαβυλών.
- source_word: κτίσαι τὴν πόλιν
  choice: pour bâtir la ville
  rationale: κτίζω peut signifier fonder, établir ou bâtir. « Bâtir » respecte le texte sans expliciter par « rebâtir » ce que le contexte peut seulement laisser entendre.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: aient la liberté
  rationale: Cette formulation française exprime naturellement le contenu du décret. Le grec dit plus littéralement que la liberté doit leur appartenir.
- source_word: ἐλευθερίαν
  choice: la liberté
  rationale: Le terme désigne largement la liberté ou l’affranchissement. Le contexte administratif peut suggérer une exemption, mais le verset n’en précise pas la nature.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: eux et leurs enfants
  rationale: La tournure maintient l’extension explicite du privilège aux bénéficiaires et à leurs enfants, sans restreindre τέκνα aux fils.
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: ainsi que tous les prêtres qui montent
  rationale: La formule étend le même bénéfice à tous les prêtres concernés et reprend le verbe « monter », comme le grec reprend le participe.
theological_decisions:
- issue: Nature de la liberté accordée (ἐλευθερία)
  choice: Conserver le sens général de « liberté ».
  alternative: Préciser « exemption », notamment fiscale, ou « immunité civique ».
  rationale: Le verset ne définit pas la portée juridique exacte de cette liberté. Une traduction générale préserve l’ambiguïté du grec et évite d’introduire une interprétation administrative particulière.
translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale « Et que » conserve le lien avec le décret énoncé dans le contexte. La syntaxe a été légèrement réorganisée afin d’éviter une tournure artificielle tout en maintenant l’ensemble des bénéficiaires et l’ambiguïté juridique de ἐλευθερία.
