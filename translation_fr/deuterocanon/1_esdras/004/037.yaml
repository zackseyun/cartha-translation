base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: fr
  text: Le vin est injuste, le roi est injuste, les femmes sont injustes, et tous les êtres humains ainsi que toutes leurs œuvres sont injustes — tout ce qui est de cette sorte. Il n’y a en eux aucune vérité, et ils périront dans leur injustice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: injuste / injustes
  rationale: La répétition structure toute la déclaration. « Injuste » conserve le champ de ce qui est contraire à la justice ou à l’ordre droit et convient au vin, aux personnes et aux œuvres.
- source_word: οἶνος
  choice: le vin
  rationale: Équivalent direct et naturel du grec, avec l’article défini correspondant à la formulation proverbiale.
- source_word: βασιλεύς
  choice: le roi
  rationale: L’article grec soutient la détermination, et le contexte immédiat vise le roi devant lequel le discours est prononcé.
- source_word: γυναῖκες
  choice: les femmes
  rationale: Sens ordinaire du pluriel grec ; « les épouses » serait possible dans certains contextes, mais n’est pas exigé ici.
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: tous les êtres humains
  rationale: L’expression grecque, littéralement « tous les fils des hommes », est un idiome d’allure sémitique désignant collectivement l’humanité. Le français naturel exprime ici sa portée générique.
- source_word: ἔργα
  choice: œuvres
  rationale: Équivalent direct qui peut englober aussi bien les actes que leurs productions.
- source_word: πάντα τὰ τοιαῦτα
  choice: tout ce qui est de cette sorte
  rationale: Conserve la valeur récapitulative et généralisante du grec sans réduire la formule aux seuls éléments déjà nommés.
- source_word: ἀλήθεια
  choice: vérité
  rationale: Rendu direct qui maintient le contraste explicite entre vérité et injustice.
- source_word: ἀπολοῦνται
  choice: ils périront
  rationale: Rend naturellement le futur moyen/passif sans imposer un agent extérieur qui n’est pas exprimé.
theological_decisions:
- issue: Expression anthropologique masculine à portée générique
  choice: tous les êtres humains
  alternative: tous les fils des hommes
  rationale: La formule grecque est littéralement masculine, mais idiomatique et collective. « Tous les êtres humains » transmet clairement sa référence à l’humanité entière en français moderne, sans suggérer qu’elle exclut les femmes, déjà mentionnées dans la proposition.
- issue: Répétition du vocabulaire de ἄδικος
  choice: injuste
  alternative: impie / mauvais / faux
  rationale: « Injuste » préserve la répétition rhétorique et le lien avec ἀδικία à la fin du verset, sans introduire un sens confessionnel plus étroit ni résoudre le rapport tendu entre injustice et absence de vérité.
- issue: Référent du pronom dans καὶ οὐκ ἔστιν ἐν αὐτοῖς ἀλήθεια
  choice: Il n’y a en eux aucune vérité
  alternative: Il n’y a en toutes ces choses aucune vérité
  rationale: Le masculin pluriel αὐτοῖς peut renvoyer aux sujets personnels précédemment énumérés, tandis que le contexte plus large pourrait englober l’ensemble de la liste. Le pronom français conserve cette ambiguïté relative.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition insistante de « injuste » est maintenue, ainsi que la correspondance lexicale avec « injustice ». La syntaxe reste solennelle sans être archaïque.
