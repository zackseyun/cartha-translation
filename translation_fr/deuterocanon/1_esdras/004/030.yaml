  text: and taking the crown from the king’s head and putting it on herself[a]; and she struck the king with her left hand.
translation:
  language: fr
  text: Elle enlevait le diadème de la tête du roi et se le posait sur la tête, et elle frappait le roi de la main gauche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « giflait le roi de la main gauche ».'
    reason: Le verbe grec peut désigner soit un coup en général, soit plus précisément une gifle.
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: enlevait
  rationale: Le participe décrit une action de retrait dans une scène en cours. « Enlevait » est naturel en français et exprime clairement qu’elle retire le diadème de la tête du roi.
- source_word: διάδημα
  choice: diadème
  rationale: « Diadème » désigne précisément l’insigne royal porté sur la tête et reste compréhensible en français moderne.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: se le posait sur la tête
  rationale: Le contexte indique qu’après avoir retiré le diadème au roi, elle le place sur sa propre tête. La tournure pronominale française rend ce sens clairement et naturellement.
- source_word: ἐράπιζεν
  choice: frappait
  rationale: Le verbe désigne un coup porté, souvent de la main et possiblement une gifle. « Frappait » conserve l’étendue de sens sans préciser plus que le grec.
- source_word: τῇ ἀριστερᾷ
  choice: de la main gauche
  rationale: Le datif instrumental désigne le moyen du coup. Le substantif « main », sous-entendu en grec, doit être explicité pour obtenir un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les participes grecs ont été rendus par des verbes conjugués à l’imparfait afin de produire une phrase naturelle tout en conservant l’action en cours ; « puis » marque sobrement le passage à l’action suivante.
