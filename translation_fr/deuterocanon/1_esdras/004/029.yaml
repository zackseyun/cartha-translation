  text: They were watching him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: fr
  text: Je le regardais[a], ainsi qu’Apamé, fille de l’illustre[b] Bartakos, la concubine du roi, assise à la droite du roi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme grecque peut aussi, prise isolément, signifier « ils regardaient » ; le contexte favorise ici « je regardais ».
