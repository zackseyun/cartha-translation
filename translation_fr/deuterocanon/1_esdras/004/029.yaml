    reason: alternative lexicale
lexical_decisions:
- source_word: ἐθεώρουν
  choice: Je regardais
  rationale: La forme imparfaite exprime une observation en cours. La terminaison peut être morphologiquement la première personne du singulier ou la troisième du pluriel; dans le discours environnant, la première personne convient au locuteur.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin accusatif est conservé sans remplacer explicitement son antécédent par « le roi ».
- source_word: Ἀπάμην
  choice: Apamé
  rationale: Translittération française naturelle du nom grec à partir de sa forme accusative.
- source_word: Βαρτάκου
  choice: Bartakos
  rationale: Le nominatif grec sous-jacent est rendu par une translittération directe adaptée au français.
- source_word: τοῦ θαυμαστοῦ
  choice: de l’illustre
  rationale: L’adjectif qualifie Bartakos comme un homme remarquable ou renommé; « illustre » est idiomatique et ne le transforme pas en titre officiel.
- source_word: παλλακήν
  choice: concubine
  rationale: Le terme désigne une compagne ou épouse de rang secondaire; « concubine » est historiquement précis et évite les connotations modernes de « maîtresse ».
- source_word: καθημένην
  choice: assise
  rationale: Le participe présent décrit la posture d’Apamé; « assise » s’intègre naturellement à l’apposition française.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: à la droite du roi
  rationale: Expression française naturelle et fidèle indiquant sa position auprès du roi.
theological_decisions:
- issue: Sujet de ἐθεώρουν
  choice: 'Première personne du singulier : « Je regardais »'
  alternative: 'Troisième personne du pluriel : « Ils regardaient »'
  rationale: La forme grecque isolée permet les deux analyses, mais le contexte du discours à la première personne favorise nettement « je ». La possibilité morphologique concurrente est signalée en note plutôt que supprimée.
- issue: Valeur de τοῦ θαυμαστοῦ
  choice: 'Épithète descriptive : « l’illustre Bartakos »'
  alternative: « l’admirable Bartakos » ou « Bartakos le remarquable »
  rationale: Le grec contient bien un qualificatif, mais rien n’impose d’y voir un titre officiel. « Illustre » rend ici l’idée d’une personne remarquable ou renommée.
translation_notes:
  register: Français international moderne, narratif et digne. La virgule finale est maintenue parce que le verset forme une proposition inachevée qui se poursuit au verset suivant. Les appositions suivent de près la structure grecque sans rendre la phrase artificiellement archaïque.
