  text: And he sat in the council chamber[a], and the letter was read before them. And he said, “Call the young men, and they will explain their words.” And they were called, and they entered.
translation:
  language: fr
  text: 'Il prit place dans la salle du conseil[a], et l’écrit fut lu devant eux. Puis il dit : « Faites venir les jeunes hommes ; ils expliqueront eux-mêmes leurs paroles. » On les appela, et ils entrèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salle d’audience » ou « tribunal ». Le mot grec désigne un lieu officiel où l’on entend une affaire ou délibère, sans permettre d’en préciser exactement la nature institutionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: prit place
  rationale: Rend naturellement l’aoriste narratif tout en conservant l’idée qu’il s’assoit, sans ajouter de solennité excessive.
- source_word: χρηματιστηρίῳ
  choice: salle du conseil
  rationale: Le terme désigne un lieu officiel de délibération ou d’audience. « Salle du conseil » convient au cadre royal sans imposer le sens moderne précis de « tribunal ».
- source_word: ἀνεγνώσθη
  choice: fut lu
  rationale: Rend directement l’aoriste passif. La lecture à voix haute ressort du contexte, mais n’est pas explicitée dans le grec.
- source_word: γράμμα
  choice: l’écrit
  rationale: Dans ce contexte, il s’agit d’un texte écrit soumis par les jeunes hommes. « L’écrit » reste plus général et plus sûr que « la lettre », qui pourrait suggérer une correspondance.
- source_word: νεανίσκους
  choice: les jeunes hommes
  rationale: Désigne les concurrents masculins du récit et se comprend aisément en français moderne.
- source_word: αὐτοὶ δηλώσουσιν
  choice: ils expliqueront eux-mêmes
  rationale: δηλόω signifie rendre clair ou expliquer, tandis que le pronom intensif αὐτοί est conservé par « eux-mêmes ».
- source_word: λόγους
  choice: leurs paroles
  rationale: Rend le sens courant de λόγοι sans préciser indûment s’il s’agit de déclarations, d’arguments ou de formulations écrites.
- source_word: ἐκλήθησαν
  choice: on les fit donc venir
  rationale: Formulation française naturelle du passif dans ce contexte ; « donc » rend la progression portée par καί sans alourdir la phrase.
- source_word: εἰσῆλθοσαν
  choice: ils entrèrent
  rationale: Équivalent direct et soutenu de l’aoriste de εἰσέρχομαι.
