  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
translation:
  language: fr
  text: 'Il cessa de parler ; alors tout le peuple s’écria, puis tous dirent : « Grande est la vérité, et elle l’emporte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle est la plus forte » ou « elle triomphe ». Le verbe grec peut exprimer la supériorité, la victoire ou le fait de l’emporter.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: il cessa de parler
  rationale: Cette tournure rend naturellement en français la cessation exprimée par le verbe de silence suivi de l’infinitif articulé.
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Le syntagme désigne l’ensemble du peuple rassemblé et conserve la valeur collective du grec.
- source_word: ἐφώνησεν
  choice: s’écria
  rationale: Le verbe exprime ici une acclamation publique; le singulier français s’accorde avec le nom collectif « peuple ».
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: Grande est la vérité
  rationale: L’ordre marqué préserve le caractère élevé et proverbial de l’acclamation grecque.
- source_word: ὑπερισχύει
  choice: elle l’emporte
  rationale: Le verbe indique que la vérité se montre supérieure ou victorieuse; « l’emporte » garde cette force sans préciser indûment l’objet de la comparaison.
theological_decisions:
- issue: Portée de ἡ ἀλήθεια dans l’acclamation
  choice: la vérité
  alternative: vérité
  rationale: L’article grec est conservé, ce qui présente la vérité comme une réalité reconnue sans lui imposer une interprétation doctrinale particulière.
- issue: Nuance de ὑπερισχύει
  choice: elle l’emporte
  alternative: elle est la plus forte / elle triomphe
  rationale: La formulation retenue préserve l’idée ouverte de supériorité ou de victoire inhérente au verbe grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement élevée de « Grande est la vérité » est conservée pour restituer la forme solennelle de l’acclamation.
