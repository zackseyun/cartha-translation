base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: fr
  text: « Hommes, les femmes ne sont-elles pas fortes ? La terre est grande, le ciel est haut, et le soleil est rapide dans sa course[a], car il tourne dans le cercle du ciel et revient en courant à sa place en un jour.[b] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rapide sur son parcours » ; le grec représente le soleil avançant rapidement dans sa course.
    reason: lexical_alternative
  - marker: b
    text: Le verset emploie le langage courant de l’observation pour décrire le déplacement quotidien du soleil dans le ciel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Hommes
  rationale: Vocatif pluriel direct et explicitement masculin. « Hommes » conserve la forme rhétorique grecque sans l'adoucir en « Messieurs ».
- source_word: ἰσχυραὶ
  choice: fortes
  rationale: Équivalent direct et naturel pour la force ou la puissance dans l'argument sur ce qui est le plus fort.
- source_word: γυναῖκες
  choice: les femmes
  rationale: Le sens ordinaire est « femmes » ; rien n'impose ici le sens plus restreint d'« épouses ».
- source_word: μεγάλη ἡ γῆ
  choice: La terre est grande
  rationale: La construction prédicative est rendue dans un ordre français naturel, et γῆ désigne ici la terre entière dans un cadre cosmique.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: le ciel est haut
  rationale: « Haut » restitue simplement ὑψηλός, tandis que « ciel » convient mieux que « paradis » au contexte cosmologique.
- source_word: ταχὺς τῷ δρόμῳ
  choice: rapide dans sa course
  rationale: La formule conserve l'idée de vitesse ainsi que l'image d'un déplacement sur un parcours, dans un français actuel.
- source_word: στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: il parcourt le cercle du ciel
  rationale: Dans ce contexte de mouvement, « parcourt » exprime naturellement le trajet circulaire sans imposer un modèle astronomique technique ; « cercle » maintient l'image de κύκλος.
- source_word: πάλιν ἀποτρέχει
  choice: revient en courant
  rationale: Le préverbe marque le mouvement de retour et le verbe conserve l'image vive de la course.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: à sa place
  rationale: « Place » est l'équivalent large et naturel, sans techniciser l'image en parlant de « position » ou de « station ».
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: en un seul jour
  rationale: « Un seul jour » rend la valeur emphatique de μιᾷ dans ce contexte.
theological_decisions:
- issue: Description cosmologique du mouvement du soleil
  choice: Conserver la description phénoménologique de sa course quotidienne
  alternative: Reformuler selon les catégories scientifiques modernes comme un mouvement apparent
  rationale: Le grec décrit le soleil selon l'observation ordinaire et dans une rhétorique poétique. La traduction ne corrige ni ne systématise cette représentation.
translation_notes:
  register: Français international moderne, clair et digne. La structure rhétorique est préservée, mais l'ordre des mots est adapté à l'usage français. Les images de la course et du cercle sont maintenues sans introduire de terminologie astronomique moderne.
