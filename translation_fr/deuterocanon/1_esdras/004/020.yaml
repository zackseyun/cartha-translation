  source_fidelity: Le texte conserve correctement les trois emplois de ποιεῖ (« rend / fait »), l’image de « tous les cœurs », le refus de considérer roi ou satrape, et le sens monétaire de τάλαντα. « Tout le monde » est une interprétation contextuellement plausible de πάντα devant « parler » et ne doit pas être remplacé par un inanimé français impossible. La formulation « en talents » est toutefois trop peu idiomatique et risque d’évoquer les aptitudes modernes plutôt que des unités monétaires.
