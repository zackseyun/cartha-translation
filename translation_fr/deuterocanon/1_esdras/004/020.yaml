  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: fr
  text: Il rend tous les cœurs riches, il ne se souvient ni du roi ni du satrape, et il fait parler tout le monde en termes de talents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le talent désigne ici une unité antique de poids, employée aussi comme unité de valeur monétaire, et non une aptitude naturelle. Autrement dit : il fait parler tout le monde en termes d’argent ou de sommes d’argent.'
    reason: 'Précision lexicale : « talents » a ici un sens monétaire, et la paraphrase explicite l’expression française sans effacer le terme du texte.'
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: rend tous les cœurs riches
  rationale: Cette formulation conserve l’image anthropologique du cœur et la construction causative de ποιεῖ avec l’adjectif πλουσίας, tout en restant naturelle en français.
- source_word: οὐ μέμνηται
  choice: ne se souvient ni
  rationale: Le choix maintient l’image littérale de la mémoire. Dans le contexte, le sens peut aller jusqu’à « ne tenir aucun compte de », mais cette nuance n’est pas imposée au texte.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: ni du roi ni du satrape
  rationale: « Satrape » conserve la couleur historique précise du titre perse plutôt que de le généraliser en « gouverneur ».
- source_word: πάντα
  choice: tout le monde
  rationale: Bien que πάντα soit formellement neutre pluriel, l’infinitif λαλεῖν, « parler », favorise ici un référent collectif humain. La note conserve l’autre possibilité syntaxique.
- source_word: διὰ ταλάντων ποιεῖ λαλεῖν
  choice: fait parler tout le monde en talents
  rationale: La formulation garde la construction causative répétée avec ποιεῖ et le terme monétaire ancien « talents », sans lui attribuer le sens moderne d’aptitudes naturelles.
theological_decisions:
- issue: Sujet sous-entendu repris du contexte
  choice: Employer le pronom « il » sans répéter « le vin »
  alternative: Rendre explicite le sujet par « le vin »
  rationale: Le grec omet ici le sujet, repris du contexte. Le pronom masculin français permet de conserver cette continuité sans ajouter le nom absent du verset.
- issue: Référent de πάντα avec λαλεῖν
  choice: 'Comprendre le collectif comme humain : « tout le monde »'
  alternative: 'Comprendre πάντα comme objet de « parler » : « parler de tout »'
  rationale: L’acte de parler suggère naturellement des personnes, mais la syntaxe grecque admet une autre analyse; celle-ci est donc signalée en note plutôt qu’effacée.
translation_notes:
  register: Français international actuel, sobre et digne. La répétition de « il » et de la construction causative reproduit le parallélisme grec; « satrape » maintient le cadre historique.
