  yaml_path: translation/deuterocanon/1_esdras/004/074.yaml
  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: fr
  text: et, sur l’autel, fournir chaque jour les holocaustes[a], conformément au commandement qu’ils ont reçu, en offrir dix-sept[b], ainsi que dix talents supplémentaires chaque année[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « fournir » est inhabituel ici ; il peut aussi se comprendre au sens d’« offrir » ou de « procurer » les holocaustes.
    reason: lexical_alternative
  - marker: b
    text: Le grec ne répète pas explicitement ce qui doit être offert au nombre de dix-sept ; il s’agit vraisemblablement des sacrifices requis chaque jour.
    reason: alternative_reading
  - marker: c
    text: Le talent était une importante unité de poids, souvent employée pour les métaux précieux ; le texte ne précise pas ici de quelle matière il s’agit.
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  choice: autel
  rationale: Terme cultuel français courant et exact pour l’autel des sacrifices.
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Terme biblique établi pour des sacrifices entièrement consumés par le feu ; le contexte empêche ici le sens historique moderne du mot.
- source_word: καρποῦσθαι
  choice: fournir
  rationale: Le verbe est inhabituel dans ce contexte et peut exprimer l’idée de procurer ou de fournir ; ce choix conserve cette particularité plutôt que de le confondre avec προσφέρειν.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Formulation naturelle qui rend clairement la régularité quotidienne.
- source_word: καθὰ ἔχουσιν ἐντολήν
  choice: conformément au commandement qu’ils ont reçu
  rationale: Rend l’idée d’une obligation en vigueur issue d’un commandement antérieur.
- source_word: ἑπτὰ καὶ δέκα
  choice: dix-sept
  rationale: Expression idiomatique du nombre en français moderne.
- source_word: προσφέρειν
  choice: en offrir
  rationale: Dans le contexte sacrificiel, offrir exprime naturellement l’acte de présenter devant l’autel ; le pronom « en » relie le nombre aux holocaustes sans masquer l’ellipse grecque, signalée en note.
- source_word: ἄλλα τάλαντα δέκα
  choice: dix talents supplémentaires
  rationale: Rend la valeur additive de ἄλλα sans préciser à tort la matière ou la nature de ces talents.
- source_word: κατ’ ἐνιαυτόν
  choice: chaque année
  rationale: Équivalent français clair et actuel de la périodicité annuelle.
theological_decisions:
- issue: Référent implicite de « dix-sept »
  choice: Le relier grammaticalement aux holocaustes par « en offrir dix-sept », tout en signalant l’ellipse.
  alternative: Laisser « offrir dix-sept » sans complément, ou préciser « dix-sept holocaustes ».
  rationale: Le grec ne répète pas l’objet de προσφέρειν. Le pronom donne une phrase française intelligible, tandis que la note préserve l’incertitude formelle du texte.
translation_notes:
  register: Français international moderne, digne et lisible. « Holocaustes » conserve la terminologie sacrificielle biblique établie. La syntaxe maintient le caractère fragmentaire de ce membre de phrase, qui se poursuit dans son contexte.
