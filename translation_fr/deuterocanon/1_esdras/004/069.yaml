  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: fr
  text: Alors le roi Darius se leva, l’embrassa et écrivit en sa faveur des lettres à tous les administrateurs, gouverneurs locaux, généraux et satrapes, afin qu’ils facilitent son voyage, ainsi que celui de tous ceux qui montaient avec lui pour rebâtir Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν
  choice: l’embrassa
  rationale: Le verbe exprime un geste d’affection appuyé; « l’embrassa » est naturel et digne en français sans surinterpréter la manière exacte.
- source_word: οἰκονόμους
  choice: administrateurs
  rationale: Dans cette liste de responsables impériaux, le terme désigne des gestionnaires ou administrateurs; ce choix évite le sens domestique moderne d’« intendants ».
- source_word: τοπάρχας
  choice: gouverneurs locaux
  rationale: Rend clairement l’idée de dirigeants territoriaux locaux dans un français accessible.
- source_word: προπέμψωσιν
  choice: lui assurent le passage
  rationale: Dans le contexte de lettres adressées aux autorités, le verbe implique qu’elles facilitent et soutiennent la poursuite du voyage, plutôt qu’un simple accompagnement cérémoniel.
- source_word: ἀναβαίνοντας
  choice: montaient
  rationale: Conserve l’image biblique et géographique de la montée vers Jérusalem.
- source_word: οἰκοδομῆσαι
  choice: rebâtir
  rationale: Bien que le verbe signifie littéralement « bâtir », le contexte historique est celui du rétablissement de Jérusalem; « rebâtir » l’exprime naturellement.
