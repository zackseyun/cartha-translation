  text: He also wrote out the provision and the priestly robe[a]—specifying in what they are to minister in it.
translation:
  language: fr
  text: Il mit aussi par écrit la provision et le vêtement sacerdotal[a], indiquant dans quoi ils accompliraient leur service en elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du grec est très condensée : littéralement, « dans quoi ils accompliraient leur service en elle ». Le pronom féminin « en elle » renvoie probablement au vêtement sacerdotal, mais l’articulation exacte de « dans quoi » et de ce pronom demeure incertaine.'
    reason: Ambiguïté syntaxique de ἐν τίνι … ἐν αὐτῇ ; la note explique l’ellipse sans ajouter un référent absent du texte.
lexical_decisions:
- source_word: ἔγραψεν
  choice: mit aussi par écrit
  rationale: L’aoriste de γράφω indique ici qu’il consigna ces dispositions par écrit; cette tournure française convient au contexte administratif.
- source_word: χορηγίαν
  choice: les dispositions concernant les fournitures
  rationale: χορηγία désigne ce qui est fourni pour permettre un service. La formulation garde une portée matérielle assez large sans la réduire à une somme d’argent.
- source_word: ἱερατικὴν στολήν
  choice: le vêtement sacerdotal
  rationale: στολή désigne un vêtement distinctif ou d’apparat. « Vêtement sacerdotal » est naturel, digne et moins marqué par le vocabulaire ecclésiastique ultérieur que « ornement liturgique ».
- source_word: ἐν τίνι
  choice: avec quoi
  rationale: L’expression grecque est très condensée. Dans ce contexte, elle renvoie probablement à l’équipement ou à la tenue dans lesquels le service doit être accompli; « avec quoi » conserve une certaine indétermination.
- source_word: λατρεύσουσιν
  choice: ils accompliraient leur service dans le Temple
  rationale: λατρεύω désigne ici le service cultuel. L’ajout explicatif « dans le Temple » rend ce sens en français sans employer le verbe ambigu « adorer ».
- source_word: ἐν αὐτῇ
  choice: dans le Temple
  rationale: Le pronom féminin peut grammaticalement reprendre στολή, mais cette lecture produit avec ἐν τίνι une redondance difficile. Dans le contexte, il peut renvoyer elliptiquement au lieu du service; la note signale l’ambiguïté.
theological_decisions:
- issue: Référent de ἐν αὐτῇ et articulation de ἐν τίνι … ἐν αὐτῇ
  choice: Comprendre la fin comme précisant avec quel équipement les prêtres accompliraient leur service dans le Temple.
  alternative: « dans quel vêtement ils y accompliraient leur service » ou, très littéralement, « dans quoi ils accompliraient leur service en lui/elle »
  rationale: Le grec transmis est comprimé et potentiellement irrégulier. La traduction principale vise une phrase française intelligible tout en évitant de présenter l’interprétation comme certaine; l’ambiguïté réelle est conservée dans la note.
translation_notes:
  register: Français international moderne, simple et digne. « Service dans le Temple » explicite la valeur cultuelle de λατρεύω; la note préserve l’incertitude syntaxique du grec.
