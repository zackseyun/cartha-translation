  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: fr
  text: Il écrivit des lettres à tous les gouverneurs locaux de Cœlé-Syrie et de Phénicie, ainsi qu’à ceux du Liban[a], pour faire transporter du bois de cèdre du Liban à Jérusalem, afin qu’ils bâtissent la ville avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de district » ; le grec emploie un terme désignant les dirigeants de territoires locaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: gouverneurs locaux
  rationale: Le terme désigne les dirigeants de territoires ou districts locaux. « Gouverneurs locaux » exprime clairement la fonction administrative sans recourir au calque opaque « toparques ».
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: de Cœlé-Syrie
  rationale: Il s’agit du nom historique d’une région à l’époque hellénistique, et non d’une simple description géographique.
- source_word: ἔγραψεν ἐπιστολάς
  choice: il écrivit des lettres
  rationale: Le grec nomme explicitement l’acte d’écrire; l’envoi des lettres est implicite, mais ne remplace pas le sens verbal exprimé.
- source_word: μεταφέρειν
  choice: pour faire transporter
  rationale: Dans le contexte d’un ordre adressé à des gouverneurs, cette formulation rend naturellement l’infinitif de but et indique l’acheminement du matériau sans supposer que les destinataires le porteraient eux-mêmes.
- source_word: ξύλα κέδρινα
  choice: du bois de cèdre
  rationale: La locution désigne du bois de cèdre destiné à la construction; cette expression est naturelle et précise en français courant.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: afin qu’ils bâtissent
  rationale: ὅπως suivi du subjonctif exprime ici le but. « Afin que » conserve nettement cette valeur dans un registre digne et naturel.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: μετά avec le génitif exprime normalement l’accompagnement. La traduction préserve cette relation sans lui substituer l’idée de bâtir « pour lui ».
- source_word: τὴν πόλιν
  choice: la ville
  rationale: Le texte désigne explicitement la ville, c’est-à-dire Jérusalem, et non le Temple.
theological_decisions:
- issue: Objet du projet de construction
  choice: la ville
  alternative: le Temple
  rationale: Bien que le bois de cèdre du Liban puisse évoquer la construction du Temple, le grec porte explicitement τὴν πόλιν, « la ville ». La traduction ne l’harmonise donc pas avec un autre projet.
translation_notes:
  register: Français international moderne, clair et digne. « Cœlé-Syrie » conserve le nom historique de la région. La répétition « du Liban » suit le grec et évite toute ambiguïté sur l’origine du bois.
