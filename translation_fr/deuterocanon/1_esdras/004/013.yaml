  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: fr
  text: Quand le roi se réveilla, ils prirent le document, le lui remirent, et il le lut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il le lut à voix haute » ; le verbe grec peut avoir ce sens selon le contexte, mais le texte ne le précise pas ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη ὁ βασιλεύς
  choice: Quand le roi se réveilla
  rationale: Le passif aoriste de ἐξεγείρω peut avoir ici un sens intransitif, « se réveiller » ou « se lever ». Dans le contexte narratif, « se réveilla » est naturel sans imposer l’idée qu’une autre personne l’aurait réveillé.
- source_word: λαβόντες
  choice: ils prirent
  rationale: Le participe aoriste exprime une action qui accompagne et précède la remise du document. Une forme verbale coordonnée rend naturellement la succession des actions en français.
- source_word: τὸ γράμμα
  choice: le document
  rationale: γράμμα désigne ici un écrit présenté au roi. « Document » convient mieux qu’« une lettre » à cet écrit de cour, tout en laissant ouverte sa forme précise.
- source_word: ἔδωκαν αὐτῷ
  choice: le lui remirent
  rationale: « Remettre » exprime idiomatiquement en français le fait de donner un document à son destinataire, tout en restant fidèle à ἔδωκαν αὐτῷ.
- source_word: ἀνέγνω
  choice: il le lut
  rationale: Le verbe signifie « lire » et peut, selon le contexte, désigner une lecture à voix haute. Comme le grec ne précise pas ici que la lecture était audible, la traduction retient le sens non marqué.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Le lui remirent » évite la lourdeur de « le lui donnèrent » pour un document. Le marqueur de note est placé après le verbe concerné.
