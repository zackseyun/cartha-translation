  yaml_path: translation/deuterocanon/1_esdras/004/072.yaml
  text: and that all the land they possess should be tax-free for them[b][a]; and that the Chaldeans should leave the villages of the Jews that they hold.
translation:
  language: fr
  text: et que tout le territoire qu’ils détiendront soit exonéré d’impôts en leur faveur[a] ; et que les Chaldéens abandonnent les villages des Juifs qu’ils détiennent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soit pour eux exempt de tribut ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qu’ils tiennent fermement » ; il s’agit ici de villages maintenus sous leur contrôle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν
  choice: territoire
  rationale: Dans ce contexte juridico-administratif, « territoire » rend naturellement l’étendue de terre concernée sans en faire nécessairement un État.
- source_word: κρατήσουσιν
  choice: dont ils prendront possession
  rationale: Le futur de κρατέω exprime ici la possession ou la maîtrise à venir du territoire ; le futur français conserve cette valeur, parfois atténuée dans la couche anglaise.
- source_word: ἀφορολόγητον
  choice: exempt d’impôt
  rationale: Cette formulation moderne et digne exprime clairement l’exemption fiscale ou tributaire.
- source_word: ὑπάρχειν
  choice: soit pour eux
  rationale: Dans la série de dispositions du décret, le subjonctif français rend la force prescriptive de l’infinitif et rattache l’exemption à leurs bénéficiaires.
- source_word: Χαλδαῖοι
  choice: Chaldéens
  rationale: Le texte grec emploie explicitement cet ethnonyme ; il convient de le conserver plutôt que de l’harmoniser avec « Babyloniens ».
- source_word: ἀφίουσι
  choice: libèrent
  rationale: Dans ce contexte, ἀφίημι signifie renoncer à la possession ou relâcher son emprise ; « libèrent » rend mieux cette idée que le simple « quittent ».
- source_word: κώμας
  choice: villages
  rationale: « Villages » est l’équivalent courant et précis de κώμας.
- source_word: διακρατοῦσιν
  choice: tiennent sous leur pouvoir
  rationale: Le composé indique une maîtrise maintenue ; cette expression rend explicitement l’idée de contrôle sans impliquer nécessairement un droit de propriété.
theological_decisions:
- issue: Force juridico-administrative des propositions infinitives dans le décret royal
  choice: 'Employer des subjonctifs coordonnés : « soit » et « libèrent »'
  alternative: 'Employer des infinitifs plus littéraux : « être exempt » et « libérer »'
  rationale: Le subjonctif est idiomatique après les dispositions françaises d’un décret et conserve leur caractère prescriptif sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la continuité d’une liste de dispositions introduites par « et que ». Le futur de κρατήσουσιν est préservé, et « Chaldéens » suit directement le grec.
