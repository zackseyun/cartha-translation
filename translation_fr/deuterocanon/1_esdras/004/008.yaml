  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: fr
  text: Et alors, après que chacun eut écrit sa propre déclaration, ils les scellèrent et les placèrent sous l’oreiller[a] du roi Darius,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le repose-tête du roi Darius ». Le mot grec προσκεφάλαιον peut désigner un oreiller ou un repose-tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: alors
  rationale: Adverbe temporel qui marque l’étape suivante du récit ; « alors » est naturel et préserve l’enchaînement.
- source_word: γράψαντες
  choice: après que … eut écrit
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux ; cette tournure rend clairement la succession des actions.
- source_word: ἕκαστος
  choice: chacun
  rationale: Rend directement la valeur distributive du grec.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: sa propre déclaration
  rationale: Dans le contexte du concours, λόγος désigne l’énoncé écrit soumis par chacun ; « déclaration » conserve ce sens sans imposer l’idée plus précise d’une argumentation formelle.
- source_word: ἐσφραγίσαντο
  choice: ils les scellèrent
  rationale: Le contexte fournit comme objet les déclarations écrites ; le pronom « les » l’explicite naturellement en français.
- source_word: ἔθηκαν
  choice: les placèrent
  rationale: Verbe narratif simple, rendu dans un registre digne et courant.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: sous l’oreiller
  rationale: προσκεφάλαιον désigne un support destiné à la tête, souvent un oreiller ; une note conserve l’autre possibilité, « repose-tête ».
- source_word: Δαρείου τοῦ βασιλέως
  choice: du roi Darius
  rationale: Formulation idiomatique en français qui conserve le titre royal et le lien génitif avec l’oreiller.
