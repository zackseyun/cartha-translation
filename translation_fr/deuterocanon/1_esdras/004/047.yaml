translation_notes:
  register: Français international moderne, narratif et digne. Les titres administratifs sont traduits lorsqu’un équivalent clair existe; « satrapes » est conservé comme titre perse établi. La phrase maintient la distinction entre l’accompagnement du bénéficiaire des lettres et celui de tout son groupe.
