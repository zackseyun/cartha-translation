base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/047.yaml
  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: fr
  text: Alors le roi Darius se leva, l’embrassa et écrivit pour lui des lettres à tous les intendants, aux gouverneurs régionaux, aux généraux et aux satrapes, afin qu’ils l’accompagnent[a], lui et tous ceux qui étaient avec lui et qui montaient bâtir Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les aident à poursuivre leur route » ; le verbe grec peut inclure l’idée de fournir une aide pour le voyage, et non seulement celle d’un accompagnement personnel.
    reason: lexical_alternative
  - marker: b
    text: Certains traduisent « rebâtir Jérusalem » d’après le contexte général, mais le verbe grec employé ici signifie simplement « bâtir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans un récit.
- source_word: ἀναστὰς
  choice: se leva
  rationale: Rend concrètement le participe aoriste sans alourdir la phrase.
- source_word: κατεφίλησεν
  choice: l’embrassa
  rationale: En français actuel, « embrasser » exprime naturellement le geste du baiser; le préverbe peut suggérer un geste chaleureux sans exiger une amplification.
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: écrivit pour lui des lettres
  rationale: Le datif indique ici que les lettres sont rédigées en sa faveur; l’indéfini est plus idiomatique en français.
- source_word: οἰκονόμους
  choice: intendants
  rationale: Désigne des responsables de l’administration de biens ou de ressources et convient mieux que le terme plus étroit « trésoriers ».
- source_word: τοπάρχας
  choice: gouverneurs régionaux
  rationale: Traduit la fonction de dirigeants de territoires locaux sans recourir au calque rare « toparques ».
- source_word: στρατηγοὺς
  choice: généraux
  rationale: Équivalent français direct du titre militaire dans cette énumération officielle.
- source_word: σατράπας
  choice: satrapes
  rationale: Conserve le titre administratif perse précis, bien établi en français.
- source_word: ἵνα προπέμψωσιν
  choice: afin qu’ils accompagnent
  rationale: Le verbe indique qu’on fait avancer quelqu’un en l’accompagnant ou en l’aidant pour son voyage; « accompagnent » convient au soutien officiel envisagé.
- source_word: τοὺς μετʼ αὐτοῦ πάντας
  choice: tous ceux qui étaient avec lui
  rationale: Reproduit clairement l’inclusion de l’ensemble du groupe.
- source_word: ἀναβαίνοντας
  choice: qui montaient
  rationale: Préserve l’idiome biblique du déplacement vers Jérusalem ainsi que la valeur participiale.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: bâtir Jérusalem
  rationale: Suit le verbe grec simple « bâtir » sans introduire explicitement l’idée contextuelle de reconstruction.
