  text: and on the altar they should offer burnt offerings every day[a], as they have the command to offer seventeen, and another ten talents yearly.
translation:
  language: fr
  text: Et que, sur l’autel, on offre chaque jour des holocaustes[a], comme ils ont reçu l’ordre d’en offrir dix-sept, plus dix talents par an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de ce verset est difficile et paraît abrégé ou altéré en plusieurs endroits, notamment autour du verbe rendu par « offre » et dans l’articulation entre la mention de « dix-sept » et celle de « dix talents par an ». La traduction en restitue le sens général sans prétendre lever toutes les incertitudes.
    reason: textual_variant
lexical_decisions:
- source_word: θυσιαστήριον
  choice: autel
  rationale: Terme cultuel usuel et naturel en français pour l’autel des sacrifices.
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Terme biblique français établi pour des sacrifices entièrement consumés par le feu; le contexte exclut le sens historique moderne du mot.
- source_word: καρποῦσθαι
  choice: qu’on offre
  rationale: Le verbe transmis est inhabituel ici; dans ce contexte sacrificiel, « offrir » restitue le sens probable sans reproduire littéralement une formulation grecque obscure.
- source_word: καθʼ ἡμέραν
  choice: chaque jour
  rationale: Rend clairement la valeur distributive de l’expression grecque dans un français courant.
- source_word: ἐντολήν
  choice: commandement
  rationale: Exprime le caractère autoritatif de la directive tout en conservant le registre biblique.
- source_word: ἑπτὰ καὶ δέκα
  choice: dix-sept
  rationale: Forme numérique idiomatique en français, correspondant littéralement à « sept et dix ».
- source_word: προσφέρειν
  choice: offrir
  rationale: Verbe sacrificiel naturel, sans préciser ce que le texte grec comprimé laisse sous-entendu.
- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: plus dix talents par an
  rationale: Préserve la valeur additive probable de ἄλλα et la mesure en talents, sans déterminer davantage le rapport syntaxique obscur entre les deux quantités.
