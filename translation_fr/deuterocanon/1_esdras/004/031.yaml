  yaml_path: translation/deuterocanon/1_esdras/004/031.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: fr
  text: En outre, le roi la regardait fixement, la bouche ouverte. Si elle rit de lui[a], il rit aussi ; mais si elle s’irrite contre lui, il la flatte pour qu’elle se réconcilie avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si elle rit avec lui, il rit aussi. » Le datif grec peut être compris de l’une ou l’autre manière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: En outre
  rationale: Cette tournure française naturelle conserve la valeur additive du grec sans alourdir la phrase.
- source_word: χάσκων τὸ στόμα
  choice: bouche bée
  rationale: Cette expression actuelle et imagée rend l’idée de regarder la bouche ouverte, avec étonnement ou fascination.
- source_word: ἐθεώρει αὐτήν
  choice: la contemplait
  rationale: L’imparfait traduit l’action prolongée, tandis que « contemplait » exprime le regard soutenu suggéré par le contexte.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: Si elle rit avec lui, il rit
  rationale: La répétition de « rire » conserve celle de γελάω. Le datif αὐτῷ peut évoquer le fait de rire avec lui, pour lui ou à ses dépens ; le choix principal retient le sens relationnel le plus naturel dans ce contexte, avec une note signalant l’ambiguïté.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: elle se fâche contre lui
  rationale: Le grec exprime ici une réaction d’amertume ou de colère dirigée contre le roi. Cette formulation est claire et naturelle en français moderne.
- source_word: κολακεύει αὐτὴν
  choice: il la flatte
  rationale: « Flatter » est l’équivalent direct et courant de κολακεύω et rend la tentative intéressée de regagner sa faveur.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: pour qu’elle se réconcilie avec lui
  rationale: La formulation conserve le but exprimé par ὅπως et l’idée d’un rétablissement de la relation.
