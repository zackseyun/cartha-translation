  text: and that all the land that they hold should be tax-free for them[a]; and that the Chaldeans should leave the villages of the Jews that they occupy;
translation:
  language: fr
  text: que tout le territoire qu’ils posséderont soit pour eux exempt d’impôts[a], et que les Chaldéens abandonnent les villages des Juifs qu’ils occupent ;
  philosophy: optimal-equivalence
