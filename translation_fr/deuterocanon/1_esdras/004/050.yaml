lexical_decisions:
- source_word: χώραν
  choice: territoire
  rationale: Dans ce contexte administratif, χώρα désigne une étendue de terre ou un territoire, sans nécessairement constituer une entité politique.
- source_word: κρατήσουσιν
  choice: dont ils prendraient possession
  rationale: Le futur κρατήσουσιν exprime ici la possession ou la maîtrise à venir du territoire ; le conditionnel s’intègre à la teneur du décret rapporté.
- source_word: ἀφορολόγητον
  choice: exempt d’impôts
  rationale: Le terme désigne directement l’exemption de taxes ou de tribut ; cette formulation est claire en français moderne.
- source_word: ὑπάρχειν
  choice: soit
  rationale: Dans cette construction infinitive dépendant du décret, le verbe indique l’état prescrit du territoire.
- source_word: Χαλδαῖοι
  choice: Chaldéens
  rationale: Cette traduction directe préserve la désignation ethnique explicite du grec, plutôt que de l’élargir en « Babyloniens ».
- source_word: ἀφίουσι
  choice: libèrent
  rationale: Le verbe signifie ici relâcher ou abandonner ce que l’on détient ; « libèrent » exprime la restitution des villages sans imposer le seul sens d’un départ physique.
- source_word: κώμας
  choice: villages
  rationale: κώμη désigne normalement un village ou une implantation rurale.
- source_word: διακρατοῦσιν
  choice: qu’ils occupent
  rationale: Le composé exprime une possession ou une maîtrise maintenue ; « occupent » convient à des villages détenus par un autre groupe.
