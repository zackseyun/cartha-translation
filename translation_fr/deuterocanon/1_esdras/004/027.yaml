  text: And many were destroyed and were led astray and sinned because of women[a].
translation:
  language: fr
  text: Et beaucoup périrent, s’égarèrent et péchèrent à cause des femmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause des épouses ». Le grec peut désigner soit des femmes, soit des épouses selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement l’adjectif substantivé grec et conserve sa portée quantitative indéfinie.
- source_word: ἀπώλοντο
  choice: périrent
  rationale: Le verbe exprime ici une ruine grave; « périrent » reste concis et n’impose pas nécessairement une construction passive absente de la forme grecque.
- source_word: ἐσφάλησαν
  choice: s’égarèrent
  rationale: La forme passive/intransitive de σφάλλω évoque le fait de dévier ou de tomber dans l’erreur; « s’égarèrent » convient au contexte moral sans introduire explicitement un agent trompeur.
- source_word: ἡμάρτοσαν
  choice: péchèrent
  rationale: Équivalent français direct de ἁμαρτάνω dans un contexte moral et religieux.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la cause; cette tournure française est directe et idiomatique.
- source_word: τὰς γυναῖκας
  choice: les femmes
  rationale: γυνή peut signifier « femme » ou « épouse ». Le propos général favorise « les femmes », tandis que l’autre sens est signalé en note.
theological_decisions:
- issue: Formulation causale susceptible de paraître hostile aux femmes
  choice: à cause des femmes
  alternative: à cause de leurs femmes / de leurs épouses
  rationale: Le grec formule explicitement la cause au moyen de διά suivi de l’accusatif. La traduction conserve cette tension rhétorique sans l’atténuer ni l’accentuer; l’ambiguïté lexicale de γυναῖκας est indiquée en note.
translation_notes:
  register: Français moderne, international et digne. La coordination brève des trois aoristes est conservée, avec des verbes au passé simple adaptés au registre narratif biblique.
