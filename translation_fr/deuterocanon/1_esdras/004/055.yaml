  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: fr
  text: Il écrivit aussi d’accorder aux Lévites un soutien matériel[a] jusqu’au jour où la maison[b] serait achevée et Jérusalem bâtie[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la provision », « l’allocation » ou « l’approvisionnement ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « la maison » désigne le Temple.
    reason: cross_reference
  - marker: c
    text: Ou « Jérusalem rebâtie ». Le grec dit simplement « bâtie », bien que le contexte soit celui d’une restauration.
    reason: lexical_alternative
  - marker: d
    text: La formulation grecque après « jusqu’au jour » est quelque peu difficile dans le texte transmis. Le sens paraît être que ce soutien devait se poursuivre jusqu’à l’achèvement du Temple et à la construction de Jérusalem.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: il écrivit … qu’on fournisse
  rationale: Le verbe introduit ici le contenu d’une directive écrite. Cette formulation française exprime l’ordre sans préciser un destinataire que le grec ne nomme pas.
- source_word: δοῦναι
  choice: qu’on fournisse
  rationale: L’infinitif dépend de ἔγραψεν et indique ce qui est ordonné. Le subjonctif rend naturellement en français la valeur prescriptive de la directive.
- source_word: τὴν χορηγίαν
  choice: les ressources nécessaires
  rationale: χορηγία désigne ce qui est fourni pour assurer un service ou un entretien. La traduction retenue évoque une aide matérielle suivie sans en déterminer abusivement la forme.
- source_word: τοῖς Λευείταις
  choice: aux Lévites
  rationale: Le datif désigne les bénéficiaires de la prestation.
- source_word: ἕως τῆς ἡμέρας
  choice: jusqu’au jour où
  rationale: Cette tournure conserve le repère temporel explicite du grec tout en étant idiomatique en français.
- source_word: ᾖ ἐπιτελεσθῇ
  choice: serait achevée
  rationale: Malgré la syntaxe difficile du texte transmis, le passage envisage comme terme futur l’achèvement de la maison.
- source_word: ὁ οἶκος
  choice: la maison
  rationale: La traduction garde l’image littérale du grec; dans le contexte, cette «maison» est le Temple.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jérusalem bâtie
  rationale: Le grec dit littéralement «être bâtie». «Rebâtie» conviendrait au contexte de restauration, mais expliciterait une nuance non exprimée par le verbe lui-même.
theological_decisions:
- issue: Référent de «la maison»
  choice: Conserver «la maison» dans le texte, avec une note indiquant qu’il s’agit du Temple.
  alternative: Traduire directement par «le Temple».
  rationale: Dans le contexte d’Esdras, «la maison» désigne le Temple de Jérusalem. Garder le terme source préserve l’expression biblique sans rendre le référent inaccessible.
- issue: Construction ou reconstruction de Jérusalem
  choice: Traduire οἰκοδομηθῆναι par «bâtie».
  alternative: Employer «rebâtie».
  rationale: Le contexte concerne une restauration, mais le grec emploie simplement le verbe «bâtir». La note préserve l’interprétation contextuelle possible sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure prescriptive «qu’on fournisse» rend la directive royale, tandis que «les ressources nécessaires» demeure assez large pour ne pas limiter χορηγία à une forme précise d’aide.
