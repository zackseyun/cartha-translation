lexical_decisions:
- source_word: Ἄνδρες
  choice: Hommes
  rationale: Vocatif pluriel de ἀνήρ. « Hommes » conserve l’adresse masculine directe et la force rhétorique du grec.
- source_word: πῶς ὑπερισχύει
  choice: comme … est puissant
  rationale: Dans cette exclamation, πῶς marque le degré, tandis que ὑπερισχύει exprime une puissance supérieure. Cette tournure est naturelle en français et n’ajoute aucun complément absent du grec.
- source_word: ὁ οἶνος
  choice: le vin
  rationale: Équivalent lexical direct.
- source_word: πάντας τοὺς ἀνθρώπους
  choice: tous ceux
  rationale: ἄνθρωπος peut désigner les êtres humains de manière générique. Après l’adresse masculine initiale, « tous ceux » évite une répétition lourde tout en conservant ici l’accord masculin du discours grec.
- source_word: τοὺς πίοντας αὐτόν
  choice: qui en boivent
  rationale: Le participe présent substantivé exprime une réalité générale. En français, « en » reprend naturellement « du vin ».
- source_word: πλανᾷ τὴν διάνοιαν
  choice: Il égare l’esprit
  rationale: πλανάω signifie égarer ou détourner, et διάνοια désigne l’esprit ou la faculté de penser. La formulation préserve l’image et la déstabilisation intellectuelle exprimées par le grec.
