  source_fidelity: Le texte rend fidèlement l’exclamation πῶς ὑπερισχύει (« comme le vin est puissant ! »), puis l’action de πλανᾷ sur τὴν διάνοιαν (« il égare l’esprit »). « Tous ceux qui en boivent » exprime naturellement le groupe désigné par πάντας τοὺς ἀνθρώπους τοὺς πίοντας αὐτόν, sans imposer une interprétation doctrinale ou historique.
