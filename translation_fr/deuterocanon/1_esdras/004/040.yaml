base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: fr
  text: Et dans son jugement, il n’y a rien d’injuste. Et elle est, à travers tous les âges[a], la force, la royauté, l’autorité et la majesté. Béni soit le Dieu de vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de tous les âges » ; cette expression indique la portée de toute l’affirmation et peut se rendre plus idiomatiquement par « pour toujours ».'
    reason: La note conserve la formulation littérale du grec tout en expliquant la valeur temporelle et la portée syntaxique de l’expression.
lexical_decisions:
- source_word: κρίσις
  choice: jugement
  rationale: Dans l’expression ἐν τῇ κρίσει αὐτῆς, « jugement » conserve la nuance judiciaire tout en restant naturel en français.
- source_word: ἄδικον
  choice: injuste
  rationale: Le terme désigne ce qui n’est ni juste ni droit; « injuste » répond directement au contexte judiciaire de κρίσις.
- source_word: ἰσχύς
  choice: force
  rationale: « Force » rend directement la vigueur exprimée par le nom et permet de la distinguer de ἐξουσία.
- source_word: βασίλειον
  choice: royauté
  rationale: Dans cette énumération abstraite et doxologique, « royauté » exprime le pouvoir ou la dignité royale plus naturellement que le nom concret « royaume ».
- source_word: ἐξουσία
  choice: autorité
  rationale: « Autorité » exprime un pouvoir légitime et maintient la distinction avec ἰσχύς, « force ».
- source_word: μεγαλειότης
  choice: majesté
  rationale: « Majesté » convient au registre de louange et exprime la grandeur exaltée du terme grec.
- source_word: τῶν πάντων αἰώνων
  choice: de tous les âges
  rationale: Cette formulation reproduit de près le génitif grec et en préserve l’image temporelle sans le réduire silencieusement à une simple locution adverbiale.
- source_word: εὐλογητός
  choice: Béni soit
  rationale: Dans cette acclamation doxologique, « Béni soit » rend naturellement la formule de louange.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: le Dieu de vérité
  rationale: 'Le génitif est conservé: Dieu est caractérisé par la vérité, sans transformer l’expression en « le vrai Dieu ».'
theological_decisions:
- issue: Référent des féminins αὐτῆς et αὕτη
  choice: Les pronoms féminins renvoient à la vérité personnifiée dans le contexte; la traduction emploie donc « son » puis « elle ».
  alternative: Répéter « la vérité » et atténuer ainsi la personnification.
  rationale: Le grec poursuit l’éloge personnifié de la vérité. Garder les pronoms rend visible cet effet littéraire et évite d’aplanir le texte.
- issue: Fonction de αὕτη devant l’énumération
  choice: Rendre directement « elle est la force, la royauté, l’autorité et la majesté ».
  alternative: Traduire « à elle appartiennent la force… » ou « telle est la force… ».
  rationale: Le grec présente αὕτη comme sujet de la proposition nominale. « Elle est » suit cette structure plus étroitement et laisse intacte la force de l’identification.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition initiale de « Et » est maintenue pour refléter l’enchaînement grec. Le marqueur de note a été placé après « de tous les âges », expression qu’il explique, plutôt qu’après « injuste ».
