  text: 'And they said to them[a], “Report to us about what has been written.” And the first, the one who had spoken about the strength of wine, began and said thus:'
translation:
  language: fr
  text: 'Ils leur dirent : « Rendez-nous compte de ce qui a été écrit. » Alors le premier, celui qui avait parlé de la puissance[a] du vin, commença ainsi :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la force du vin ». Le mot grec peut désigner la force ou la puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατέ
  choice: Rendez-nous compte
  rationale: L’impératif pluriel de ἀπαγγέλλω exprime ici un compte rendu adressé publiquement aux juges; cette tournure conserve le caractère formel de la scène.
- source_word: περὶ τῶν γεγραμμένων
  choice: de ce qui a été écrit
  rationale: La formulation rend la préposition περὶ ainsi que le participe parfait passif, sans préciser indûment qui a écrit les déclarations.
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: le premier, celui qui avait parlé
  rationale: Le redoublement de l’article est conservé par une apposition, tandis que le plus-que-parfait situe naturellement la déclaration avant la prise de parole présente.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: de la puissance du vin
  rationale: ἰσχύς désigne la force, la puissance ou la capacité d’action; « puissance » convient au concours comparant ce qui exerce le plus grand pouvoir.
- source_word: καὶ ἔφη οὕτως
  choice: commença ainsi
  rationale: En français, la formule qui introduit immédiatement un discours direct se rend naturellement de cette manière; elle exprime οὕτως sans reproduire lourdement la coordination grecque.
