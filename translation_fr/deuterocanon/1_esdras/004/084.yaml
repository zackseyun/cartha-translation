  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: fr
  text: Ils bénirent le Dieu de leurs pères, parce qu’il leur avait accordé soulagement et libération.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « repos et liberté ». Les termes grecs peuvent désigner l’apaisement d’une détresse et la délivrance ou la mise en liberté.
    reason: Alternative lexicale qui préserve l’étendue de sens de ἄνεσις et ἄφεσις.
lexical_decisions:
- source_word: εὐλόγησαν
  choice: bénirent
  rationale: Lorsque Dieu est l’objet, « bénir » conserve l’expression biblique et le sens de louange adressée à Dieu.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: le Dieu de leurs pères
  rationale: Cette formulation biblique traditionnelle maintient le lien avec les générations d’Israël qui les ont précédés, sans le réduire à une simple divinité ancestrale.
- source_word: ἔδωκεν
  choice: avait accordé
  rationale: Le plus-que-parfait indique naturellement en français que leur bénédiction répond à un bienfait déjà reçu ; « accordé » convient idiomatiquement à ce que Dieu donne ici.
- source_word: ἄνεσιν
  choice: soulagement
  rationale: Le terme désigne un relâchement de la pression ou de la détresse ; « soulagement » exprime clairement ce sens en français actuel.
- source_word: ἄφεσιν
  choice: libération
  rationale: Dans ce contexte historique, le terme évoque la délivrance ou la mise en liberté plutôt que le pardon des péchés.
theological_decisions:
- issue: Sens de ἄφεσιν dans un contexte historique non cultuel
  choice: libération
  alternative: pardon, remise ou liberté
  rationale: Bien que le mot puisse désigner le pardon ou la remise, le contexte porte sur une délivrance historique. « Libération » préserve ce sens sans introduire une interprétation sotériologique non explicitée par le verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « le Dieu de leurs pères » conserve le registre biblique traditionnel, tandis que « soulagement et libération » reste immédiatement compréhensible.
