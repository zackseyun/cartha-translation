  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: fr
  text: Et lorsqu’ils se réveillent des effets du vin[a], ils ne se souviennent pas de ce qu’ils ont fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils se relèvent du vin »; autrement dit, ils reviennent à eux après en avoir subi les effets.'
    reason: La tournure grecque est concise et peut évoquer soit le réveil, soit le fait de se relever après les effets du vin.
lexical_decisions:
- source_word: ὅταν
  choice: lorsque
  rationale: Introduit une proposition temporelle de portée générale; « lorsque » convient au registre biblique moderne sans alourdir la phrase.
- source_word: ἀπὸ τοῦ οἴνου
  choice: des effets du vin
  rationale: Le grec dit littéralement « du vin », mais l’expression désigne ici l’état provoqué par le vin dont ils émergent. Cette formulation rend naturellement ce sens en français sans imposer le terme plus précis « ivresse ».
- source_word: ἐγερθῶσιν
  choice: ils se réveillent
  rationale: Dans ce contexte, le verbe évoque le réveil ou le retour à soi après les effets du vin; « se réveillent » est plus idiomatique que « se lèvent du vin ».
- source_word: οὐ μέμνηται
  choice: ils ne se souviennent pas
  rationale: Bien que la forme grecque transmise soit au singulier, le sujet contextuel est pluriel; l’accord français au pluriel exprime naturellement le sens collectif ou distributif.
- source_word: ἃ ἔπραξαν
  choice: de ce qu’ils ont fait
  rationale: Rend simplement et naturellement la proposition relative grecque, avec le passé composé usuel en français moderne.
