  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
translation:
  language: fr
  text: Il écrivit que l’on fournisse un soutien aux Lévites jusqu’au jour où la Maison[a] serait achevée et où Jérusalem serait bâtie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Temple ». Le grec dit littéralement « la maison », expression qui désigne couramment le Temple dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « rebâtie ». Le contexte est celui d’une restauration, mais le verbe grec signifie simplement « bâtir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: Il ordonna par écrit
  rationale: Dans ce contexte administratif, le verbe introduit une directive écrite. Cette formulation en rend la force sans réduire l’expression à un simple acte de rédaction.
- source_word: δοῦναι
  choice: que l’on fournisse
  rationale: L’infinitif dépend de ἔγραψεν et exprime le contenu de la directive. La tournure française rend naturellement cette relation.
- source_word: τὴν χορηγίαν
  choice: de quoi subvenir à leurs besoins
  rationale: χορηγία désigne les ressources ou l’entretien fournis. Cette expression reste assez large pour ne pas préciser indûment la nature de l’aide.
- source_word: τοῖς Λευείταις
  choice: aux Lévites
  rationale: Le datif indique les bénéficiaires de ce qui doit être fourni.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: jusqu’au jour où
  rationale: Cette formulation française naturelle conserve la limite temporelle exprimée par le grec.
- source_word: ἐπιτελεσθῇ
  choice: serait achevée
  rationale: Le passif exprime l’achèvement de la construction. Le conditionnel s’intègre naturellement au discours indirect français après un verbe principal au passé.
- source_word: ὁ οἶκος
  choice: la Maison
  rationale: Le grec dit littéralement « la maison », désignation contextuelle du Temple. La majuscule aide à signaler ce référent tout en conservant l’image du texte source.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jérusalem bâtie
  rationale: Le verbe signifie simplement « être bâtie ». Le contexte permet « rebâtie », mais cette nuance n’est pas morphologiquement explicite dans le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le caractère administratif de la directive, tout en explicitant naturellement la notion générale de soutien matériel. Les notes préservent les possibilités lexicales de « maison/Temple » et « bâtie/rebâtie ».
