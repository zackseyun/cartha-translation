base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: fr
  text: Et il écrivit des lettres à tous les gouverneurs[a] de Cœlé-Syrie[b] et de Phénicie, ainsi qu’à ceux du Liban, pour faire transporter du bois de cèdre du Liban à Jérusalem, afin qu’ils bâtissent la ville avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dirigeants de district » ; grec : « toparques ».'
    reason: lexical_alternative
  - marker: b
    text: La Cœlé-Syrie est le nom historique de la région dans le texte grec.
    reason: cultural_note
lexical_decisions:
- source_word: τοπάρχαις
  choice: gouverneurs
  rationale: Le terme désigne des dirigeants territoriaux. « Gouverneurs » est clair en français moderne, tandis que « toparques » serait plus technique et moins immédiatement compréhensible.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: de Cœlé-Syrie
  rationale: Il s’agit du nom historique d’une région. La forme française « Cœlé-Syrie » préserve cette désignation propre au lieu de la réduire à « Syrie ».
- source_word: Φοινίκῃ
  choice: de Phénicie
  rationale: « Phénicie » est la forme française courante du nom de cette région.
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: à ceux qui se trouvaient au Liban
  rationale: Le grec ne répète pas explicitement le titre des responsables. Cette formulation conserve le caractère général du référent sans préciser indûment leur fonction.
- source_word: μεταφέρειν
  choice: pour faire transporter
  rationale: Dans le contexte des lettres administratives, l’infinitif exprime ce qui doit être exécuté. « Faire transporter » rend naturellement l’ordre portant sur l’acheminement du matériau.
- source_word: ξύλα κέδρινα
  choice: du bois de cèdre
  rationale: Cette expression française courante désigne clairement le bois destiné à la construction sans imposer la forme précise de rondins ou de poutres.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: pour qu’ils bâtissent
  rationale: La proposition exprime le but. « Pour qu’ils bâtissent » conserve cette valeur et rend naturellement le subjonctif grec.
- source_word: μετʼ αὐτοῦ
  choice: avec lui
  rationale: La formulation directe préserve l’idée de participation commune sans préciser davantage l’identité ou la nature de cette collaboration.
- source_word: τὴν πόλιν
  choice: la ville
  rationale: Le grec nomme explicitement « la ville ». La traduction ne remplace donc pas ce terme par « le Temple » ou « la maison de Dieu ».
theological_decisions:
- issue: Étendue du projet de reconstruction
  choice: la ville
  alternative: le Temple ou la maison de Dieu, par harmonisation avec des récits parallèles de restauration
  rationale: Le texte grec porte explicitement τὴν πόλιν, « la ville ». Cette formulation est conservée sans harmonisation avec d’autres passages centrés sur la reconstruction du Temple.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure administrative du passage tout en évitant le terme technique opaque « toparques ». « Bâtissent » maintient un registre biblique naturel sans archaïsme marqué.
