    rationale: « Ceux qui se trouvaient au Liban » introduit une coloration temporaire ou descriptive que le grec ne porte pas. « Ceux du Liban » conserve le référent volontairement général et la concision de τοῖς ἐν τῷ Λιβάνῳ.
