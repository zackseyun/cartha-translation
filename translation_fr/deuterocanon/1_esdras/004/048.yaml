  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les destinataires, le bois de cèdre, Jérusalem et la construction de la ville sont tous conservés. Toutefois, « aussi » rend καί de manière moins directe que la simple coordination narrative « Et », et « ceux qui se trouvaient au Liban » ajoute une nuance circonstancielle absente du grec τοῖς ἐν τῷ Λιβάνῳ.'
