    rationale: Le grec commence par καὶ ἔγραψεν, « Et il écrivit ». « Il écrivit aussi » est possible contextuellement, mais « Et il écrivit » suit plus exactement la coordination du texte source sans suggérer une addition emphatique.
  - severity: low
