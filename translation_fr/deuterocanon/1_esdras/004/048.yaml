revisions:
- from: Il écrivit aussi des lettres à tous les gouverneurs[a] de Cœlé-Syrie[b] et de Phénicie, ainsi qu’à ceux qui se trouvaient au Liban, pour faire transporter du bois de cèdre du Liban à Jérusalem et pour qu’ils bâtissent la ville avec lui.
  to: Et il écrivit des lettres à tous les gouverneurs[a] de Cœlé-Syrie[b] et de Phénicie, ainsi qu’à ceux du Liban, pour faire transporter du bois de cèdre du Liban à Jérusalem, afin qu’ils bâtissent la ville avec lui.
  rationale: La révision rend explicitement la coordination initiale du grec et élimine l’ajout léger de nuance dans « ceux qui se trouvaient ». Elle maintient l’ambiguïté du référent au Liban, la visée des lettres, et surtout « la ville », sans harmonisation avec des traditions parallèles portant sur le Temple.
