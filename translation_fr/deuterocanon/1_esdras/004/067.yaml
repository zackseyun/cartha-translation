  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: fr
  text: Et toi, tu as fait le vœu de reconstruire le temple que les Judéens ont incendié lorsque la Judée a été dévastée par les Chaldéens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « que les Judéens ont incendié ». D’après des récits historiques parallèles, on pourrait s’attendre à lire : « que les Chaldéens [ou les Babyloniens] ont incendié » ; mais le texte grec conservé porte explicitement « les Judéens ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: tu as fait le vœu
  rationale: Le verbe εὔχομαι exprime ici un engagement solennel. « Faire le vœu » conserve cette force plus précisément que le simple « promettre ».
- source_word: οἰκοδομῆσαι
  choice: de reconstruire
  rationale: Le sens lexical est « construire », mais le temple ayant été incendié, « reconstruire » exprime naturellement l'action de le rétablir sans dépasser le contexte.
- source_word: τὸν ναὸν
  choice: le temple
  rationale: Dans ce contexte historique, ναός désigne l'édifice du temple de Jérusalem; « temple » est le terme français courant et précis.
- source_word: ἐνεπύρισαν
  choice: avaient incendié
  rationale: Le verbe signifie mettre le feu à, incendier. Le plus-que-parfait français clarifie que cet incendie précède le vœu, sans ajouter l'idée d'une destruction totale.
- source_word: οἱ Ἰουδαῖοι
  choice: les Judéens
  rationale: Le grec nomme explicitement les habitants ou le peuple de la Judée. « Judéens » maintient ici la nuance ethnogéographique et évite de corriger le texte en fonction des récits parallèles.
- source_word: ἐρημώθη
  choice: fut dévastée
  rationale: Le passif exprime la mise en désolation d'un territoire. « Fut dévastée » est naturel, digne et fidèle au sens.
- source_word: Χαλδαίων
  choice: les Chaldéens
  rationale: Le grec emploie précisément ce nom historique; le rendre ainsi plutôt que par « Babyloniens » garde visible la formulation de la source.
theological_decisions:
- issue: Attribution historique de l'incendie du temple
  choice: Conserver « que les Judéens avaient incendié » conformément au grec transmis.
  alternative: Écrire « qui avait été incendié » ou attribuer l'incendie aux Chaldéens/Babyloniens d'après les traditions historiques parallèles.
  rationale: οἱ Ἰουδαῖοι est explicitement le sujet de ἐνεπύρισαν dans le texte grec fourni. La traduction préserve cette difficulté historique au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. « Faire le vœu » garde la solennité de l’engagement; « Judéens » et « Chaldéens » préservent les désignations historiques du grec. La ponctuation place l’appel initial « et toi » dans le mouvement de la phrase.
