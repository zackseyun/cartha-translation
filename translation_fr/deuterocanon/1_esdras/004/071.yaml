base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
translation:
  language: fr
  text: 'Il écrivit à tous les Juifs qui montaient du royaume vers la Judée au sujet de leur liberté[a] : aucun dignitaire, satrape, gouverneur de district ou intendant ne devait venir à leurs portes[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de leur exemption » ou « en faveur de leur liberté ». Le grec emploie le mot courant pour « liberté », mais, dans ce contexte administratif, il peut désigner un privilège légal ou une immunité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne devait pas venir contre leurs portes ». L’expression peut indiquer que les autorités ne devaient pas se présenter à leur domicile ni y faire valoir des exigences contre eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: il écrivit
  rationale: Rend directement l’aoriste de γράφω sans ajouter au verbe l’idée explicite de décret, que seul le contexte administratif suggère.
- source_word: τοῖς ἀναβαίνουσιν
  choice: qui montaient
  rationale: Conserve l’image biblique et géographique de la montée vers la Judée, plutôt que de la réduire à un simple retour.
- source_word: τῆς βασιλείας
  choice: du royaume
  rationale: Équivalent direct de βασιλεία; le contexte permet de comprendre qu’il s’agit du domaine impérial du roi.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: au sujet de leur liberté
  rationale: Préserve le sens ordinaire d’ἐλευθερία et l’ambiguïté de ὑπέρ, tout en laissant ouverte la possibilité d’une franchise ou immunité juridique.
- source_word: πάντα δυνατὸν
  choice: aucun dignitaire
  rationale: Dans cette énumération administrative, δυνατός désigne vraisemblablement tout personnage puissant ou détenteur d’autorité. « Dignitaire » est naturel et distinct des titres qui suivent.
- source_word: σατράπην
  choice: satrape
  rationale: Conserve le titre administratif perse historiquement précis.
- source_word: τοπάρχην
  choice: gouverneur de district
  rationale: Exprime clairement la fonction locale du τοπάρχης sans employer le terme français rare « toparque ».
- source_word: οἰκονόμον
  choice: intendant
  rationale: Rend la fonction de gestionnaire ou administrateur portée par οἰκονόμος dans ce contexte officiel.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: ne devait venir s’en prendre à leurs portes
  rationale: Maintient l’image concrète des portes et la nuance hostile possible d’ἐπέρχομαι, sans préciser abusivement la nature des démarches ou exactions interdites.
theological_decisions:
- issue: Portée de la liberté accordée par l’autorité royale
  choice: au sujet de leur liberté
  alternative: au sujet de leur exemption
  rationale: Le passage traite vraisemblablement d’un privilège ou d’une immunité administrative, et non de liberté spirituelle; toutefois, le grec emploie le terme général « liberté », qu’il convient de conserver dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme d’un acte administratif et la phrase reste ouverte, conformément à la virgule finale du texte source et à la continuité probable avec le verset suivant.
