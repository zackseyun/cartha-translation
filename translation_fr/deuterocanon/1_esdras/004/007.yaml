  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: fr
  text: Et le deuxième siégera auprès de Darius à cause de sa sagesse[a], et il sera appelé parent de Darius[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera assis » ou « prendra place » auprès de Darius. Le verbe grec évoque d’abord le fait d’être assis; la nuance de rang ou de proximité découle du contexte royal.'
    reason: lexical_alternative
  - marker: b
    text: « Parent » peut désigner un membre de la famille ou être un titre honorifique signalant une étroite association avec Darius.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: le deuxième
  rationale: L’ordinal substantivé désigne le deuxième des hommes dont il est question, probablement selon le rang obtenu.
- source_word: καθιεῖται
  choice: siégera auprès de
  rationale: Le verbe exprime le fait de s’asseoir ou d’être installé à une place. Dans ce cadre royal, « siégera auprès de » rend naturellement la place d’honneur sans préciser indûment qu’il s’agit d’une nomination officielle.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: à cause de sa sagesse
  rationale: 'διά avec l’accusatif a ici une valeur causale : sa sagesse motive l’honneur accordé.'
- source_word: συγγενής
  choice: parent
  rationale: Le mot désigne une personne apparentée, mais peut aussi fonctionner dans un cadre de cour comme un titre honorifique marquant une étroite association.
- source_word: κληθήσεται
  choice: sera appelé
  rationale: Le futur passif est conservé littéralement et laisse ouverte la question de savoir si l’appellation est familiale, officielle ou honorifique.
