  yaml_path: translation/deuterocanon/1_esdras/004/065.yaml
  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: fr
  text: 'Alors il dit au roi : « Souviens-toi du vœu que j’ai fait de rebâtir Jérusalem, le jour où tu as reçu ton royaume[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Souviens-toi de la prière que j’ai faite pour rebâtir Jérusalem, le jour où tu as reçu ton royaume. » Les mots grecs employés peuvent désigner soit un vœu, soit une prière ; ici, le contexte favorise l’idée d’un engagement pris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste exprime un appel direct au roi. « Souviens-toi » est naturel, actuel et digne.
- source_word: τὴν εὐχὴν ἣν ηὐξάμην
  choice: du vœu que j’ai fait
  rationale: Le couple nom-verbe peut relever du vœu ou de la prière. Ici, l’infinitif qui suit précise un engagement concret ; la formulation française évite la répétition maladroite « le vœu que j’ai voué ».
- source_word: οἰκοδομῆσαι
  choice: de rebâtir
  rationale: Le verbe signifie littéralement « bâtir », mais, dans le contexte de la restauration de Jérusalem, « rebâtir » explicite naturellement l’action visée sans modifier son référent.
- source_word: παρέλαβες
  choice: tu as reçu
  rationale: Le verbe désigne ici l’accession à la royauté ou la réception du pouvoir, sans nécessairement suggérer une prise violente.
- source_word: τὸ βασίλειόν σου
  choice: ton royaume
  rationale: Cette traduction directe reste naturelle en français tout en pouvant évoquer, dans le contexte, l’exercice de la royauté.
theological_decisions:
- issue: Sens de εὐχή / ηὐξάμην
  choice: Un vœu formulé par le locuteur
  alternative: Une prière faite par le locuteur
  rationale: Le grec permet les deux nuances. Le contexte d’un acte concret à accomplir favorise « vœu », mais l’autre possibilité est conservée en note afin de ne pas supprimer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Syntaxe directe adaptée à un récit ancien. « Rebâtir » rend explicitement le contexte de restauration ; l’ambiguïté entre vœu et prière est préservée en note.
