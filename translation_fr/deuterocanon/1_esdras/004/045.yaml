  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: fr
  text: Et toi, tu as fait le vœu de reconstruire le temple que les Judéens ont incendié lorsque la Judée fut dévastée par les Chaldéens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit : « que les Judéens ont incendié ». Cette lecture difficile diffère du récit plus connu, selon lequel le temple fut incendié par les Chaldéens, c’est-à-dire les Babyloniens.'
    reason: Signaler sans l’harmoniser une attribution historique inattendue dans le texte grec.
lexical_decisions:
- source_word: εὔξω
  choice: tu as fait le vœu
  rationale: Le verbe εὔχομαι, suivi ici d’un infinitif d’action, exprime naturellement un engagement solennel plutôt qu’une simple prière.
- source_word: οἰκοδομῆσαι
  choice: de reconstruire
  rationale: Le verbe signifie littéralement « construire », mais le contexte d’un temple précédemment incendié implique clairement sa reconstruction.
- source_word: τὸν ναὸν
  choice: le temple
  rationale: « Temple » est le terme français courant et précis dans ce contexte relatif au sanctuaire de Jérusalem.
- source_word: ἐνεπύρισαν
  choice: ont incendié
  rationale: Le verbe indique l’action de mettre le feu. « Incendier » est précis sans affirmer davantage que le texte quant à l’étendue de la destruction.
- source_word: οἱ Ἰουδαῖοι
  choice: les Judéens
  rationale: Dans ce cadre historique et géographique, « Judéens » conserve le rapport à la Judée et traduit le sujet explicite du grec sans harmonisation.
- source_word: ἐρημώθη
  choice: fut dévastée
  rationale: Cette formulation rend naturellement le passif exprimant la mise en désolation ou la ruine du pays.
- source_word: τῶν Χαλδαίων
  choice: les Chaldéens
  rationale: Le grec nomme expressément les Chaldéens; ce terme est donc conservé plutôt que remplacé par « Babyloniens ».
theological_decisions:
- issue: Attribution de l’incendie du temple aux Judéens
  choice: Conserver « le temple que les Judéens ont incendié » conformément au grec transmis.
  alternative: « le temple que les Chaldéens ont incendié » ou « le temple incendié par les Babyloniens »
  rationale: Le texte grec fait explicitement de οἱ Ἰουδαῖοι le sujet de ἐνεπύρισαν. Cette lecture difficile est maintenue sans être corrigée d’après le récit historique plus familier; une note signale clairement la tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé rend directement l’engagement antérieur, tandis que « fut dévastée » maintient un ton narratif solennel. La lecture difficile du grec est conservée dans le corps du texte et expliquée en note.
