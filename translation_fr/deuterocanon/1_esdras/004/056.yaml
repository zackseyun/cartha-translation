  text: And to all who guarded the city[a], he wrote that allotments and wages should be given to them.
translation:
  language: fr
  text: Et il écrivit que l’on donne à tous ceux qui gardaient la ville des lots[a] et une solde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des parts » ou « des portions ». Le terme grec peut désigner des lots, notamment ce qui est attribué par tirage au sort, ou une part assignée.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: qui gardaient
  rationale: Le participe désigne ceux qui assuraient la garde ou la protection de la ville; l’imparfait convient naturellement à cette fonction continue.
- source_word: πόλιν
  choice: la ville
  rationale: L’article grec est conservé, sans préciser l’identité de la ville au-delà du texte.
- source_word: ἔγραψε δοῦναι
  choice: il écrivit qu’il fallait leur donner
  rationale: Cette formulation conserve explicitement l’acte d’écrire tout en exprimant naturellement en français le contenu administratif de l’infinitif δοῦναι.
- source_word: κλήρους
  choice: des parts attribuées
  rationale: κλῆρος peut désigner des lots, des parts ou des portions assignées. « Parts attribuées » rend le sens distributif sans préciser, au-delà du grec, qu’il s’agirait nécessairement de terres.
- source_word: ὀψώνια
  choice: une solde
  rationale: Dans un contexte de garde ou de service, ὀψώνια désigne couramment la rémunération, notamment militaire. « Une solde » est idiomatique et plus contextuel que « salaires », tout en laissant en note l’autre nuance possible de vivres.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et administratif. Le marqueur de note est placé après « parts attribuées », expression à laquelle la variante lexicale se rapporte. La tournure évite de transformer « il écrivit » en un verbe plus interprétatif comme « il décréta ».
