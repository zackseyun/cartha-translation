  text: And he took the letters and went out to Babylon[a], and reported to all his brothers.
translation:
  language: fr
  text: Il prit les lettres, partit pour Babylone et informa tous ses frères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les membres de son peuple »; le grec dit littéralement « tous ses frères ».
    reason: Préciser la portée possible du terme ἀδελφοῖς sans remplacer son sens littéral dans le texte principal.
lexical_decisions:
- source_word: ἔλαβεν
  choice: prit
  rationale: L’aoriste de λαμβάνω indique ici qu’il prit ou reçut les lettres; « prit » s’intègre naturellement à la succession narrative.
- source_word: τὰς ἐπιστολάς
  choice: les lettres
  rationale: ἐπιστολή désigne couramment une lettre ou une communication écrite; le pluriel défini est rendu directement.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: partit pour Babylone
  rationale: ἐξέρχομαι exprime le fait de sortir ou de partir, et εἰς marque ici la destination. « Partit pour » restitue les deux éléments en français naturel.
- source_word: ἀπήγγειλεν
  choice: informa
  rationale: ἀπαγγέλλω signifie annoncer, rapporter ou faire savoir. Comme le grec n’exprime pas le contenu annoncé, « informa » permet une formulation française naturelle sans le préciser.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: tous ses frères
  rationale: Cette traduction conserve le sens littéral de ἀδελφοῖς et rend explicitement πᾶσιν. Dans le contexte, le terme peut aussi désigner plus largement ses proches ou les membres de son peuple.
theological_decisions:
- issue: Portée collective de ἀδελφοῖς
  choice: frères
  alternative: compatriotes / membres de son peuple
  rationale: Le texte grec emploie le masculin pluriel « frères ». La traduction principale conserve cette désignation sans trancher sa portée exacte; une note signale son possible emploi communautaire ou ethnique.
translation_notes:
  register: Français moderne, sobre et narratif. « Partit pour » évite le calque peu naturel « sortit vers ». « Informa » respecte l’absence d’objet exprimé après ἀπήγγειλεν tout en donnant une phrase idiomatique.
