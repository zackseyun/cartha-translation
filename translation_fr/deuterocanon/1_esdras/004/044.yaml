    rationale: « Ainsi que tous les objets pris à Jérusalem » ne traduit pas l’infinitif qui prescrit leur envoi et laisse le français syntaxiquement incomplet.
  - severity: medium
    issue: La répétition de ηὔξατο est effacée
    rationale: Le grec dit deux fois « fit le vœu »; une seule construction coordonnée lisse une particularité syntaxique importante du texte source.
  - severity: low
    issue: « pris à Jérusalem » est moins exact que « emportés de Jérusalem »
    rationale: ἐξ Ἰερουσαλήμ marque la provenance; « emportés de » rend mieux ce mouvement sans ajouter de circonstance.
