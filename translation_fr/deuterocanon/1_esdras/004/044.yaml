  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: fr
  text: et que tous les objets emportés de Jérusalem soient renvoyés, ceux que Cyrus avait mis à part lorsqu’il fit le vœu de détruire Babylone et fit le vœu de les envoyer là-bas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est condensé et répète littéralement « fit le vœu ». « Là-bas » désigne probablement Jérusalem, mais le texte grec ne le précise pas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: σκεύη
  choice: objets
  rationale: Dans ce contexte, le mot désigne les objets ou ustensiles du temple. « Objets » est naturel en français et n’ajoute pas une précision absente de ce fragment.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: pris à Jérusalem
  rationale: Le participe passif désigne les objets emportés de Jérusalem; « pris à Jérusalem » reste proche du grec sans préciser ici les circonstances.
- source_word: ἐκπέμψαι
  choice: envoyer
  rationale: L’infinitif signifie littéralement « envoyer au-dehors ». Le grec de ce vers est syntaxiquement comprimé; la valeur de retour ressort de la destination implicite sans devoir être ajoutée deux fois.
- source_word: ἐχώρισεν
  choice: avait mis à part
  rationale: Le verbe signifie séparer ou réserver. « Mettre à part » conserve cette nuance sans transformer l’acte en simple décision administrative.
- source_word: ηὔξατο
  choice: fit le vœu
  rationale: Le verbe peut signifier prier ou faire un vœu. Avec les infinitifs qui suivent, « faire le vœu » rend au mieux la solennité et l’étrangeté de la formulation grecque.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: abattre Babylone
  rationale: ἐκκόπτω signifie littéralement couper ou retrancher et peut, avec une ville comme objet, exprimer sa destruction. « Abattre » est idiomatique tout en gardant l’image forte du grec.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: les envoyer là-bas
  rationale: Le grec omet l’objet, mais celui-ci se comprend comme les objets mentionnés. « Là-bas » préserve la référence concise et quelque peu ambiguë de ἐκεῖ.
theological_decisions:
- issue: Portée de la répétition de ηὔξατο et syntaxe comprimée
  choice: Rendre une seule construction française coordonnant les deux infinitifs sous « fit le vœu »
  alternative: Répéter « fit le vœu » devant « de les envoyer là-bas »
  rationale: Le grec répète le verbe, mais une répétition littérale serait très lourde en français. La coordination conserve les deux objets du vœu sans résoudre l’étrangeté historique par « décida ».
- issue: Référent de « là-bas »
  choice: Conserver « là-bas » et expliquer la destination probable en note
  alternative: Traduire explicitement « les renvoyer à Jérusalem »
  rationale: La destination est vraisemblablement Jérusalem, mais le grec dit seulement ἐκεῖ. Le texte principal maintient donc cette concision et la note signale l’interprétation probable.
translation_notes:
  register: Français moderne, digne et lisible. La tournure garde la formulation inhabituelle du grec sans l’harmoniser avec un récit historique plus fluide. Le marqueur [a] figure dans le texte principal.
