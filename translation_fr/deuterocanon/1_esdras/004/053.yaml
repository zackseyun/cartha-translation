  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: fr
  text: Et que tous ceux qui montent de Babylonie pour bâtir la ville aient la liberté[a], eux comme leurs enfants, ainsi que tous les prêtres qui montent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’affranchissement »; dans le contexte de ce décret royal, le terme peut inclure des privilèges juridiques ou l’exemption de certaines obligations, sans que le grec en précise la portée exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: montent
  rationale: Dans le contexte du retour d’exil, le verbe évoque la montée vers Jérusalem. « Montent » conserve cette nuance géographique et religieuse.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: de Babylonie
  rationale: Le grec emploie le nom de la région, Βαβυλωνία, et non simplement celui de la ville de Babylone.
- source_word: κτίσαι τὴν πόλιν
  choice: pour bâtir la ville
  rationale: κτίζω peut signifier fonder ou bâtir. Même si le contexte est celui d’une restauration, le grec ne précise pas explicitement « rebâtir ».
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: aient la liberté
  rationale: Cette tournure française rend naturellement la disposition du décret tout en conservant le substantif général « liberté ».
- source_word: ἐλευθερίαν
  choice: liberté
  rationale: Le terme désigne largement la liberté. Dans ce contexte administratif, il peut recouvrir des privilèges juridiques ou des exemptions, mais sa portée exacte n’est pas définie.
- source_word: τέκνοις
  choice: enfants
  rationale: « Enfants » est le sens direct de τέκνα; « descendants » élargirait inutilement la portée du terme.
- source_word: ἱερεῦσι
  choice: prêtres
  rationale: Équivalent français direct et usuel du terme grec désignant les prêtres.
