base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever’s statement appears wiser than the other’s, Darius the king will give him great gifts and great honors of victory[b],
translation:
  language: fr
  text: Que chacun de nous prononce une parole qui l’emportera[a] ; et celui dont la déclaration paraîtra plus sage que celle de l’autre recevra du roi Darius de grands présents et de grandes récompenses de victoire[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une déclaration qui se révélera la plus forte ». Le grec λόγος peut désigner une parole, une déclaration ou un argument dans ce concours.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque désigne des honneurs ou des récompenses accordés pour une victoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Que chacun de nous prononce
  rationale: Le subjonctif délibératif ou exhortatif à la première personne du pluriel est naturellement rendu par « Que chacun de nous… ». « Prononce » convient au cadre d’un concours de paroles.
- source_word: ἕνα λόγον
  choice: une parole
  rationale: λόγος peut désigner une parole, une déclaration ou un argument. « Une parole » reste proche de la formulation grecque, tandis que la note signale une autre lecture contextuelle possible.
- source_word: ὃς ὑπερισχύσει
  choice: qui l’emportera
  rationale: ὑπερισχύω exprime l’idée d’être plus fort ou de prévaloir. « L’emportera » est idiomatique dans le contexte d’une compétition.
- source_word: φανῇ
  choice: paraîtra
  rationale: 'Le verbe garde ici la nuance d’une appréciation ou d’un jugement : la déclaration sera reconnue ou apparaîtra comme plus sage.'
- source_word: τὸ ῥῆμα αὐτοῦ
  choice: sa déclaration
  rationale: ῥῆμα désigne ici ce qui a été dit. « Déclaration » évite une répétition lourde de « parole » et explicite sobrement la fonction du propos.
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: plus sage que celle de l’autre
  rationale: Le comparatif porte sur le propos de l’un par rapport à celui de l’autre. L’ajout du pronom « celle » rend en français l’ellipse grecque sans en modifier le sens.
- source_word: δώσει αὐτῷ Δαρεῖος ὁ βασιλεὺς
  choice: recevra du roi Darius
  rationale: La transformation active-passive produit un français plus fluide tout en conservant Darius comme source du don et le vainqueur comme bénéficiaire.
- source_word: δωρεὰς μεγάλας
  choice: de grands présents
  rationale: δωρεά désigne des dons ou présents. « Présents » convient au registre royal et demeure immédiatement compréhensible.
- source_word: ἐπινίκια μεγάλα
  choice: de grandes récompenses de victoire
  rationale: ἐπινίκια renvoie à ce qui est accordé ou célébré à l’occasion d’une victoire. « Récompenses de victoire » conserve cette nuance sans préciser indûment leur nature.
