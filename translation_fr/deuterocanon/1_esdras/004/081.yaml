  yaml_path: translation/deuterocanon/1_esdras/004/081.yaml
  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
translation:
  language: fr
  text: De toi viennent la victoire et la sagesse ; à toi appartient la gloire, et moi, je suis ton serviteur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur de ta maison ». Le grec désigne précisément un serviteur attaché à une maison.
    reason: alternative lexicale
lexical_decisions:
- source_word: Παρά σοῦ
  choice: De toi viennent
  rationale: Avec le génitif, παρά marque ici la source. La tournure « De toi viennent » exprime naturellement en français que la victoire et la sagesse procèdent de la personne interpellée.
- source_word: νίκη
  choice: la victoire
  rationale: Équivalent direct et courant du nom grec νίκη.
- source_word: ἡ σοφία
  choice: la sagesse
  rationale: Rendu usuel de σοφία ; le contexte n’impose pas un sens plus restreint comme « habileté » ou « prudence ».
- source_word: σὴ ἡ δόξα
  choice: à toi appartient la gloire
  rationale: Cette formulation conserve la possession emphatique exprimée par l’adjectif possessif grec tout en restant naturelle et digne en français moderne.
- source_word: οἰκέτης
  choice: serviteur
  rationale: Le terme désigne plus précisément un serviteur attaché à une maison. « Serviteur » convient au registre élevé du passage, tandis que la nuance domestique est signalée en note.
theological_decisions:
- issue: Référent de la deuxième personne
  choice: Maintenir l’adresse directe sans identifier la personne interpellée.
  alternative: Préciser qu’il s’agit de Dieu, ou du roi dans le cadre narratif immédiat.
  rationale: Le grec emploie des pronoms de deuxième personne sans nommer ici leur référent. La traduction préserve cette indétermination et la tension interprétative du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la phrase grecque est conservé sans produire une syntaxe artificielle ; « et moi, je » restitue l’emphase de ἐγώ.
