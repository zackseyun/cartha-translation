  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: fr
  text: et de se revêtir de pourpre, de boire dans des récipients en or[a], de dormir sur de l’or[b], d’avoir un char au harnachement d’or[c], un turban de fin lin et un collier autour du cou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec parle d’objets en or utilisés pour boire, sans préciser s’il s’agit de coupes ou d’un autre type de récipient.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dormir sur de l’or ». Il s’agit probablement d’un lit ou d’une couche ornée d’or, mais le grec ne nomme pas ce meuble.'
    reason: lexical_alternative
  - marker: c
    text: Le terme grec peut désigner plus précisément les mors ou les brides d’or, ou plus largement le harnachement doré du char.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: se revêtir de pourpre
  rationale: Le moyen περιβαλέσθαι exprime l’action de mettre sur soi; «se revêtir de pourpre» conserve cette valeur et rend πορφύραν comme étoffe ou vêtement pourpre sans ajouter explicitement une idée de royauté.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: boire dans des récipients en or
  rationale: χρυσώματα désigne ici des objets d’or employés pour boire, sans préciser s’il s’agit de coupes, de gobelets ou d’un autre type de récipient. La formulation française reste naturelle sans surdéterminer l’objet.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: dormir sur de l’or
  rationale: La formulation grecque est elliptique et ne nomme ni lit ni couche. La traduction conserve cette expression frappante plutôt que d’introduire dans le texte un meuble seulement implicite.
- source_word: ἅρμα χρυσοχάλινον
  choice: un char au harnachement d’or
  rationale: Le composé χρυσοχάλινον associe l’or aux mors, aux brides ou, plus largement, au harnachement du char. «Harnachement» rend l’image avec naturel tout en évitant une précision excessive.
- source_word: κίδαριν βυσσίνην
  choice: un turban de fin lin
  rationale: κίδαρις désigne une coiffure de type turban, et βύσσινος une étoffe de lin fin; cette formulation est claire et fidèle aux deux éléments.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: un collier autour du cou
  rationale: μανιάκη désigne un ornement porté au cou, qui peut être compris comme collier, torque ou collerette. «Collier» est le terme moderne le plus immédiatement intelligible, tandis que la préposition est rendue explicitement.
