  text: and to all the satraps and generals and local rulers under him[a], from India to Ethiopia, throughout the one hundred twenty-seven satrapies.
translation:
  language: fr
  text: et à tous les satrapes, généraux et chefs de district qui relevaient de son autorité, depuis l’Inde jusqu’à l’Éthiopie, dans les cent vingt-sept satrapies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les cent vingt-sept provinces ». Le grec emploie le terme administratif « satrapies », apparenté au mot « satrapes » utilisé plus haut.
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: satrapes
  rationale: Le titre administratif perse est conservé par translittération, ce qui maintient sa précision historique et son lien lexical avec « satrapies ».
- source_word: στρατηγοῖς
  choice: généraux
  rationale: Le terme désigne ici des chefs militaires; « généraux » est naturel en français moderne et les distingue des autres autorités énumérées.
- source_word: τοπάρχαις
  choice: chefs de district
  rationale: Cette expression accessible désigne les responsables de territoires plus restreints sans recourir au rare « toparques ».
- source_word: τοῖς ὑπʼ αὐτόν
  choice: qui étaient sous son autorité
  rationale: La formulation explicite naturellement en français la relation de subordination politique indiquée par le grec.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: depuis l’Inde jusqu’à l’Éthiopie
  rationale: Cette tournure restitue clairement la formule grecque exprimant l’étendue géographique.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: dans les cent vingt-sept satrapies
  rationale: « Satrapies » préserve le terme administratif perse et l’écho étymologique avec « satrapes »; « dans » reste proche de ἐν sans imposer une nuance distributive plus forte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe fragmentaire commençant par « et à » est conservée parce que le verset poursuit grammaticalement la phrase précédente. Le vocabulaire administratif historique est maintenu tout en rendant τοπάρχαις par une expression courante.
