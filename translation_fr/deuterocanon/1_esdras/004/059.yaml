  text: saying[a], “From you are victory, and from you is wisdom, and yours is the glory, and I am your servant.”
translation:
  language: fr
  text: 'disant : « De toi viennent la victoire, et de toi vient la sagesse ; à toi appartient la gloire, et moi, je suis ton serviteur.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur de maison » ; le terme grec peut aussi avoir le sens plus fort d’« esclave ».
    reason: Alternative lexicale pour οἰκέτης, dont le champ sémantique va du serviteur domestique à l’esclave.
lexical_decisions:
- source_word: λέγων
  choice: disant
  rationale: Le participe présent introduit directement les paroles rapportées et conserve la structure du grec.
- source_word: Παρὰ σοῦ
  choice: De toi viennent
  rationale: παρά avec le génitif marque ici la source ou l’origine. L’ajout de « viennent », requis par le français idiomatique, fait comprendre que la victoire et la sagesse procèdent de la personne à qui l’on s’adresse.
- source_word: νίκη
  choice: la victoire
  rationale: Le nom désigne directement la victoire ; cette traduction est naturelle et précise dans ce contexte de louange.
- source_word: σοφία
  choice: la sagesse
  rationale: σοφία a ici son sens courant de sagesse, sans indication contextuelle imposant un sens plus spécialisé comme l’habileté.
- source_word: σὴ ἡ δόξα
  choice: à toi appartient la gloire
  rationale: Cette formulation française naturelle conserve l’affirmation emphatique de possession portée par l’adjectif possessif grec.
- source_word: οἰκέτης
  choice: serviteur
  rationale: Le terme désigne un serviteur de maison et peut impliquer l’état d’esclave. « Serviteur » convient au registre solennel et à la déclaration de soumission, tandis que la note conserve la portée lexicale plus forte.
theological_decisions:
- issue: Portée de οἰκέτης dans une déclaration de soumission
  choice: serviteur
  alternative: serviteur de maison ; esclave
  rationale: Le contexte exprime l’appartenance et l’humilité devant Dieu. « Serviteur » préserve cette relation sans déterminer plus que le contexte le statut juridique, tandis qu’une note signale que le grec peut porter le sens plus fort d’« esclave ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « de toi » ainsi que les coordinations sont conservées pour restituer le rythme doxologique du grec ; « et moi, je » rend l’emphase de ἐγὼ.
