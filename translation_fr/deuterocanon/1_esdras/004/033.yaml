  text: Then the king and the nobles looked at one another[a], and he began to speak about the truth.
translation:
  language: fr
  text: Alors le roi et les grands se regardèrent les uns les autres, et il commença à parler de la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: les grands
  rationale: Le terme désigne les personnages de haut rang entourant le roi. « Les grands » est une expression française naturelle et digne qui conserve leur statut éminent sans préciser indûment qu’il s’agit de nobles au sens héréditaire.
- source_word: ἔβλεπον
  choice: se regardèrent
  rationale: Avec l’expression réciproque qui suit, le verbe se rend naturellement en français par « se regarder ». Le passé simple convient à la progression narrative, même si l’imparfait grec peut aussi suggérer une action en cours.
- source_word: εἷς τὸν ἕτερον
  choice: les uns les autres
  rationale: Cette tournure réciproque grecque correspond idiomatiquement à « les uns les autres » pour un groupe comprenant le roi et plusieurs grands.
- source_word: ἤρξατο λαλεῖν
  choice: il commença à parler
  rationale: Traduction directe de la construction indiquant le début de la prise de parole; le pronom conserve l’ambiguïté contextuelle du sujet masculin singulier.
- source_word: περὶ τῆς ἀληθείας
  choice: de la vérité
  rationale: 'L’article grec invite à conserver la détermination : il s’agit de « la vérité », thème précis du discours qui commence.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Les grands » évite l’acception potentiellement trop étroite de « nobles » tout en désignant clairement les hauts personnages de la cour. L’ambiguïté du pronom « il » est conservée comme dans le grec.
