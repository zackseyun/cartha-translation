  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: fr
  text: et que, pour la construction du Temple, vingt talents[a] soient accordés chaque année jusqu’à ce qu’il soit achevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le talent était une importante unité de poids de l’Antiquité, souvent employée pour les métaux précieux et l’évaluation de sommes d’argent.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομήν
  choice: construction
  rationale: Le nom désigne ici les travaux ou le projet de construction; « pour la construction » est naturel et précis en français.
- source_word: ἱεροῦ
  choice: Temple
  rationale: Dans ce contexte de restauration, ἱερόν désigne le Temple; la majuscule signale l’édifice cultuel de Jérusalem.
- source_word: δοθῆναι
  choice: soient accordés
  rationale: L’infinitif aoriste passif exprime l’octroi prévu des fonds; « soient accordés » convient au registre administratif sans préciser indûment le mode de versement.
- source_word: κατʼ ἐνιαυτόν
  choice: chaque année
  rationale: Cette expression indique une attribution annuelle récurrente.
- source_word: τάλαντα εἴκοσι
  choice: vingt talents
  rationale: Le talent est une ancienne unité de poids servant notamment à évaluer les métaux précieux et les sommes; le terme traditionnel est conservé et expliqué en note.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: jusqu’à ce qu’il soit achevé
  rationale: La construction marque la durée jusqu’à l’achèvement des travaux; le pronom renvoie naturellement au Temple, et « achevé » rend explicitement le terme du processus de construction.
