  text: And he sent out and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[c][b],
translation:
  language: fr
  text: Il fit envoyer, puis convoqua tous les grands de Perse et de Médie, ainsi que les satrapes, les chefs militaires, les dirigeants de district et les hauts fonctionnaires.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le dernier terme grec peut aussi se traduire par « gouverneurs » ou, dans certains contextes, par « consuls ». Ici, « hauts fonctionnaires » convient au cadre administratif perse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: Après avoir envoyé des messagers
  rationale: Le participe aoriste signifie littéralement « ayant envoyé ». Dans ce contexte, l’envoi de messagers est implicitement lié à la convocation; l’explicitation donne en français une séquence naturelle sans confondre cet acte avec le verbe principal.
- source_word: ἐκάλεσεν
  choice: il convoqua
  rationale: Le contexte royal appelle un verbe plus précis que « appela » et plus contraignant que « invita ».
- source_word: μεγιστᾶνας
  choice: les grands
  rationale: Le terme désigne les personnages de très haut rang. « Les grands » est une expression française historique et intelligible qui ne précise pas indûment leur titre.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: de Perse et de Médie
  rationale: Forme française usuelle des deux noms géographiques coordonnés.
- source_word: σατράπας
  choice: les satrapes
  rationale: Ce titre administratif perse bien établi en français préserve la couleur historique.
- source_word: στρατηγοὺς
  choice: les chefs militaires
  rationale: Le terme peut désigner des généraux ou des commandants. « Chefs militaires » conserve cette latitude fonctionnelle dans une liste administrative.
- source_word: τοπάρχας
  choice: les dirigeants de district
  rationale: Le mot désigne ceux qui gouvernent une localité ou un district; cette formulation moderne en communique le sens sans imposer le terme technique opaque « toparques ».
- source_word: ὑπάτους
  choice: les hauts fonctionnaires
  rationale: Le mot peut désigner des personnages placés au plus haut rang et, en contexte romain, des consuls. Ici, dans un cadre administratif perse, « hauts fonctionnaires » évite l’anachronisme tout en maintenant le statut élevé.
