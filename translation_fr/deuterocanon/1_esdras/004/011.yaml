  text: The other wrote[a], “The king prevails.”
translation:
  language: fr
  text: 'L’autre écrivit : « Le roi l’emporte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le roi est le plus fort. » Le verbe grec peut signifier être plus fort ou l’emporter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: L’autre
  rationale: Avec l’article, ἕτερος désigne ici l’autre participant, dans la succession des réponses. « L’autre » reste naturel et n’impose pas explicitement la numérotation « le deuxième ».
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω indique simplement l’action accomplie dans la suite narrative. Le passé simple convient au registre narratif français et « inscrivit » préciserait indûment le support.
- source_word: Ὑπερισχύει
  choice: l’emporte
  rationale: ὑπερισχύω peut exprimer le fait d’être plus fort ou de prévaloir. « L’emporte » restitue la formule concise et le sens comparatif implicite sans limiter la supériorité à la force physique.
- source_word: ὁ βασιλεύς
  choice: Le roi
  rationale: βασιλεύς désigne précisément le roi. L’article est naturellement conservé dans cette affirmation générale formulée dans le cadre du concours.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. Le passé simple maintient la tonalité narrative, tandis que « l’emporte » donne à l’énoncé sa force proverbiale tout en préservant l’ambiguïté lexicale dans la note.
