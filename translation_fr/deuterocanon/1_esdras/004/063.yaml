  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
translation:
  language: fr
  text: de monter et de reconstruire Jérusalem et le Temple sur lequel son nom avait été invoqué[a] ; et ils célébraient avec de la musique[b] et dans la joie pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « le Temple qui porte son nom ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi désigner ici les musiciens ou les instruments de musique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: monter
  rationale: Conserve l’idiome biblique et géographique de la montée à Jérusalem, sans le réduire à l’idée de retour.
- source_word: οἰκοδομῆσαι
  choice: reconstruire
  rationale: Le contexte de restauration après destruction justifie « reconstruire », bien que le verbe puisse simplement signifier « construire ».
- source_word: ἱερὸν
  choice: le Temple
  rationale: Dans ce contexte, le terme désigne le complexe du Temple de Jérusalem ; la majuscule identifie naturellement ce lieu précis.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: sur lequel son nom avait été invoqué
  rationale: Cette formulation demeure proche de la tournure grecque d’origine sémitique et préserve l’association du nom divin au Temple sans l’aplanir en simple possession.
- source_word: ἐκωθωνίζοντο
  choice: ils célébrèrent
  rationale: Le verbe rare désigne ici une réjouissance festive. « Célébrèrent » évite aussi bien la familiarité que la nuance péjorative de débauche.
- source_word: μετὰ μουσικῶν
  choice: dans la musique
  rationale: Le grec peut renvoyer de manière large à un accompagnement musical, voire aux musiciens ou aux instruments ; cette traduction garde cette relative indétermination.
- source_word: χαρᾶς
  choice: joie
  rationale: Équivalent direct, naturel et adapté au contexte festif.
- source_word: ἡμέρας ἑπτά
  choice: pendant sept jours
  rationale: Exprime clairement en français la durée indiquée par l’accusatif grec.
theological_decisions:
- issue: Formule du nom divin appliquée au Temple
  choice: sur lequel son nom avait été invoqué
  alternative: qui porte son nom
  rationale: 'La traduction retenue conserve la formule biblique et sa tension : elle indique l’association particulière du Temple au nom divin sans transformer explicitement cette association en simple appellation ni en affirmation sur la résidence de Dieu.'
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le caractère de fragment infinitif du verset source. « Le Temple » identifie le sanctuaire de Jérusalem, tandis que les notes signalent les principales ambiguïtés lexicales sans surcharger le texte.
