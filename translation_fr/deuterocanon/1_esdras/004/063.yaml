  source_fidelity: 'La phrase conserve les éléments essentiels du grec : montée à Jérusalem, reconstruction de Jérusalem et du Temple, formule du nom divin, célébration musicale et durée de sept jours. Toutefois, « pour reconstruire » relie trop étroitement la reconstruction au seul mouvement de monter, alors que le grec coordonne deux infinitifs. « Dans la musique » n’est pas idiomatique en français moderne. L’imparfait grec ἐκωθωνίζοντο est mieux rendu par un imparfait français dans ce contexte narratif.'
