  text: to go up and rebuild Jerusalem and the temple on which his name had been called; and they celebrated with music and joy for seven days.
translation:
  language: fr
  text: de monter pour reconstruire Jérusalem et le Temple sur lequel son nom avait été invoqué[a] ; et ils célébrèrent avec de la musique et de la joie pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur lequel son nom avait été appelé » ou « qui était appelé de son nom ». Le grec reprend une formule sémitique exprimant que le Temple appartient à Dieu et lui est associé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: monter
  rationale: Conserve le sens concret de l’infinitif grec et l’usage traditionnel de « monter » à Jérusalem, sans expliciter un retour d’exil que le verbe ne formule pas.
- source_word: οἰκοδομῆσαι
  choice: reconstruire
  rationale: Le verbe signifie littéralement « construire » ; dans le contexte de la restauration de Jérusalem et du Temple après leur destruction, « reconstruire » en exprime naturellement la portée.
- source_word: τὸ ἱερὸν
  choice: le Temple
  rationale: Le terme désigne ici le sanctuaire de Jérusalem, probablement le complexe du Temple ; « le Temple » est l’équivalent français le plus naturel.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: sur lequel son nom avait été invoqué
  rationale: Cette formulation conserve l’image sémitisante de l’invocation du nom divin sur le Temple et son antériorité, sans la réduire à une simple dénomination.
- source_word: ἐκωθωνίζοντο
  choice: ils firent la fête
  rationale: Ce verbe rare évoque une célébration festive. « Firent la fête » est actuel et clair, tandis que la musique et la joie empêchent une lecture purement profane.
- source_word: μετὰ μουσικῶν
  choice: dans la musique
  rationale: Le pluriel génitif peut évoquer la musique, les musiciens ou des prestations musicales. Cette tournure naturelle maintient une certaine indétermination sans préciser abusivement les exécutants.
- source_word: χαρᾶς
  choice: joie
  rationale: Équivalent direct, courant et conforme au registre biblique français.
- source_word: ἡμέρας ἑπτά
  choice: pendant sept jours
  rationale: La préposition « pendant » rend explicitement et naturellement en français la durée exprimée par l’accusatif grec.
theological_decisions:
- issue: Formule du nom divin appliquée au Temple
  choice: sur lequel son nom avait été invoqué
  alternative: qui portait son nom
  rationale: Le choix retenu préserve la formule biblique selon laquelle le nom divin est appelé ou invoqué sur un lieu, expression susceptible d’indiquer à la fois appartenance, présence et association, sans trancher entre ces nuances.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la construction infinitive du fragment fourni. La majuscule à « Temple » identifie naturellement le sanctuaire de Jérusalem. Le point-virgule distingue la mission de reconstruction de la célébration qui suit.
