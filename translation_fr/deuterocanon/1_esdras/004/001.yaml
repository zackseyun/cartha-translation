  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: fr
  text: Le roi Darius donna un grand banquet à tous ceux qui étaient sous son autorité, à tous les gens de sa maison et à tous les hauts dignitaires de Médie et de Perse,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: un grand banquet
  rationale: δοχή désigne ici une réception avec repas ou un banquet. Dans ce cadre royal, « grand banquet » rend naturellement à la fois la nature et l'ampleur de l'événement.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: à tous ceux qui étaient sous son autorité
  rationale: Cette formulation conserve le rapport hiérarchique exprimé littéralement par « sous lui » sans réduire nécessairement le groupe aux seuls sujets politiques.
- source_word: οἰκογενέσιν αὐτοῦ
  choice: à tous les gens de sa maison
  rationale: οἰκογενεῖς peut inclure l'ensemble des personnes rattachées à la maison royale, et pas seulement la famille proche. « Les gens de sa maison » maintient cette ampleur en français courant.
- source_word: μεγιστᾶσιν
  choice: hauts dignitaires
  rationale: Le terme désigne les personnages les plus importants ou de rang élevé. « Hauts dignitaires » convient au contexte de cour sans imposer une noblesse héréditaire.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: de Médie et de Perse
  rationale: Les deux génitifs sont des désignations géographiques et politiques dépendant de « hauts dignitaires ».
