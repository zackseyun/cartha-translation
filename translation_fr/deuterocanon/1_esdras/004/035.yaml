  text: Celui qui fait ces choses n’est-il pas grand ? Et la vérité est grande et plus forte que tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μέγας ὃς ταῦτα ποιεῖ
  choice: Celui qui fait ces choses n’est-il pas grand ?
  rationale: La question grecque introduite par οὐχί attend une réponse affirmative. « Celui qui » rend naturellement le participe sous-entendu par la relative substantivée, tandis que « ces choses » conserve la référence au contexte.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: Équivalent direct et usuel de ἀλήθεια, avec conservation de l’article défini.
- source_word: ἰσχυροτέρα παρὰ πάντα
  choice: plus forte que tout
  rationale: Le comparatif ἰσχυροτέρα avec παρά est rendu par « plus forte que ». Le neutre pluriel πάντα a ici une portée globale, naturellement exprimée en français par « tout ».
theological_decisions:
- issue: Personnification possible de la vérité
  choice: Conserver « la vérité » sans explicitation ni personnification ajoutée
  alternative: « Vérité » avec une majuscule, ou une formulation explicitement personnelle
  rationale: Le grec emploie simplement l’article et le nom commun. La traduction préserve ainsi la portée rhétorique et l’éventuelle personnification sans l’imposer.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée par « Et » reproduit l’élan rhétorique du grec sans alourdir la phrase.
