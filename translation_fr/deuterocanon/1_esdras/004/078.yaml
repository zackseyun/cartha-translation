  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
translation:
  language: fr
  text: Et il prescrivit par écrit de donner à tous ceux qui gardaient la ville des lots[a] et une solde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des parts » ou « des portions attribuées ». Le grec peut désigner ce qui leur était assigné, éventuellement par tirage au sort.
    reason: lexical_alternative
  - marker: b
    text: Ou « une rémunération » ou « des rations ». Le terme grec peut désigner les provisions ou la rétribution accordées pour un service.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: gardaient
  rationale: Le participe désigne ceux qui assuraient la garde ou la surveillance de la ville. « G gardaient » est direct et naturel dans ce contexte.
- source_word: πόλιν
  choice: ville
  rationale: πόλις désigne normalement une ville, et le contexte n’impose pas un terme plus faible.
- source_word: ἔγραψε
  choice: prescrivit par écrit
  rationale: Le verbe signifie littéralement « écrivit », mais l’infinitif δοῦναι en exprime ici la teneur directive. Cette formulation française conserve le caractère écrit de l’instruction sans produire la tournure peu naturelle « il écrivit de donner ».
- source_word: δοῦναι αὐτοῖς
  choice: de donner à tous ceux
  rationale: L’infinitif dépend de ἔγραψε et énonce le contenu de l’instruction; αὐτοῖς renvoie explicitement aux gardiens mentionnés auparavant.
- source_word: κλήρους
  choice: lots
  rationale: κλῆρος peut désigner un lot, une part ou une portion attribuée, éventuellement par tirage au sort. « Lots » conserve cette latitude, explicitée en note.
- source_word: ὀψώνια
  choice: une solde
  rationale: Dans un contexte de service de garde, ὀψώνια désigne naturellement la rémunération ou les provisions versées pour le service. « Une solde » convient au contexte sans exclure les nuances signalées en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « prescrivit par écrit » rend la valeur directive de ἔγραψε avec l’infinitif tout en maintenant explicitement l’idée d’un écrit. Les notes préservent l’étendue sémantique de κλήρους et de ὀψώνια.
