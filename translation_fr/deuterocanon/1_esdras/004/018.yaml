base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich.
translation:
  language: fr
  text: Il fait que le roi et l’orphelin, l’esclave et l’homme libre, le pauvre et le riche pensent de la même manière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιεῖ
  choice: Il fait que
  rationale: Cette tournure rend naturellement en français la valeur causative du présent grec, sans préciser davantage le sujet fourni par le contexte.
- source_word: τὴν διάνοιαν μίαν
  choice: pensent de la même manière
  rationale: Le grec dit littéralement qu’il rend leur pensée ou leur disposition « une ». Cette formulation idiomatique conserve l’idée d’un même état d’esprit sans imposer une union métaphysique.
- source_word: βασιλέως
  choice: roi
  rationale: Équivalent direct et usuel du grec, sans généralisation en « dirigeant ».
- source_word: ὀρφανοῦ
  choice: orphelin
  rationale: Rend directement le statut social désigné par ὀρφανός dans cette série de contrastes.
- source_word: οἰκέτου
  choice: esclave
  rationale: Même si le terme peut désigner un serviteur domestique, son opposition explicite à l’homme libre met ici au premier plan le statut servile.
- source_word: ἐλευθέρου
  choice: homme libre
  rationale: Expression française naturelle désignant une personne de condition libre, en contraste avec l’esclave.
- source_word: πένητος
  choice: pauvre
  rationale: Équivalent courant qui préserve l’opposition sociale concise avec le riche.
- source_word: πλουσίου
  choice: riche
  rationale: Équivalent direct et parallèle à « pauvre » dans la construction rhétorique.
theological_decisions:
- issue: Les oppositions de statut social sont nivelées par un antécédent non exprimé dans ce verset, sans que le mécanisme soit expliqué.
  choice: Conserver le pronom « Il » et rendre sobrement l’identité de pensée entre les groupes opposés.
  alternative: Expliciter le référent contextuel ou interpréter plus fortement l’expression comme une union profonde des esprits.
  rationale: Le grec de ce verset ne nomme pas de nouveau le sujet et affirme seulement qu’il rend la διάνοια une. La traduction évite donc d’ajouter une explication théologique ou psychologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation idiomatique évite le calque peu naturel « rend la pensée une », tout en conservant le parallélisme social et la tension du grec.
