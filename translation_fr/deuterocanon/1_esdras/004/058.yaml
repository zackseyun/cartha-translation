  text: And when the young man went out[a], lifting up his face toward heaven, in the direction of Jerusalem, he blessed the King of heaven[b],
translation:
  language: fr
  text: Quand le jeune homme sortit, il leva son visage vers le ciel, en direction de Jérusalem[a], et bénit le Roi du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tourné vers Jérusalem ». L’expression grecque peut indiquer une orientation vers Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: Ou « loua le Roi du ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: Quand ... fut sorti
  rationale: La proposition temporelle introduit l’action qui suit. Le passé antérieur exprime naturellement en français la sortie accomplie avant le geste et la bénédiction.
- source_word: ὁ νεανίσκος
  choice: le jeune homme
  rationale: νεανίσκος désigne couramment un homme jeune; cette formulation moderne n’ajoute ni statut de serviteur ni nuance enfantine.
- source_word: ἄρας τὸ πρόσωπον
  choice: il leva le visage
  rationale: La tournure verbale française rend naturellement le participe grec et conserve le geste corporel de prière ou de louange.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: Dans ce contexte religieux, οὐρανός désigne le ciel comme domaine divin; «vers» exprime l’orientation du visage.
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: en direction de Jérusalem
  rationale: La formule garde le sens spatial probable sans imposer une pratique liturgique plus précise que ne le permet le grec.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: εὐλογέω appliqué à Dieu conserve ici l’idiome biblique de la bénédiction, tout en laissant «loua» comme autre traduction possible.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: le Roi du ciel
  rationale: Le complément au datif est rendu comme objet direct selon l’usage français de «bénir». La majuscule marque un titre divin sans modifier le sens du génitif grec.
theological_decisions:
- issue: Sens de la bénédiction adressée à Dieu
  choice: bénit le Roi du ciel
  alternative: loua le Roi du ciel
  rationale: Le verbe grec peut désigner la bénédiction ou la louange lorsqu’il a Dieu pour objet. «Bénit» préserve l’expression biblique et sa texture théologique, tandis que la note signale l’autre valeur possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit l’enchaînement grec tout en transformant le participe en verbe conjugué pour une lecture naturelle. Le marqueur [a] est placé après «Jérusalem», expression qu’il explicite.
