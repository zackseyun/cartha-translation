  text: And many were driven out of their own minds because of women[a], and became servants because of them;
translation:
  language: fr
  text: Beaucoup ont perdu l’usage de leur propre raison à cause des femmes[a], et sont devenus esclaves à cause d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont perdu la raison » ou « se sont égarés dans leurs pensées ». Le grec décrit une perte de jugement sain, sans désigner nécessairement la folie au sens clinique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενοήθησαν
  choice: ont perdu leur bon sens
  rationale: Le verbe exprime la perte d’un jugement sain ou le fait de devenir déraisonnable. Cette formulation française reste naturelle et évite de suggérer nécessairement une maladie mentale.
- source_word: ταῖς ἰδίαις διανοίαις
  choice: dans leurs propres raisonnements
  rationale: Le datif précise la sphère de la pensée où se produit cette perte de discernement, tout en conservant l’insistance de ἰδίαις sur ce qui leur est propre.
- source_word: διὰ τὰς γυναῖκας
  choice: à cause des femmes
  rationale: διά suivi de l’accusatif exprime ici la cause.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne une condition d’assujettissement marquée; « esclaves » en conserve la force mieux que « serviteurs ».
- source_word: ἐγένοντο
  choice: sont devenus
  rationale: Rendu direct et idiomatique de la construction avec attribut du sujet.
- source_word: διʼ αὐτάς
  choice: à cause d’elles
  rationale: Le pronom renvoie aux femmes et la répétition de « à cause de » conserve le parallélisme causal du grec.
