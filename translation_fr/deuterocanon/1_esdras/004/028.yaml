  yaml_path: translation/deuterocanon/1_esdras/004/028.yaml
  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: fr
  text: Et maintenant, ne me croyez-vous pas ? Le roi n’est-il pas grand par son pouvoir ? Tous les pays ne craignent-ils pas de le toucher[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toutes les contrées ne redoutent-elles pas de le toucher ? » Le grec χῶραι peut désigner des pays, des contrées ou des régions ; le verbe traduit par « craignent » implique aussi une prudence mêlée de crainte.'
    reason: Alternative lexicale reflétant l’étendue de sens de χῶραι et εὐλαβοῦνται.
lexical_decisions:
- source_word: πιστεύετέ
  choice: croyez
  rationale: 'Le verbe a ici pour objet la personne qui parle : il s’agit d’ajouter foi à ses propos. « Croire » convient donc mieux que « faire confiance ».'
- source_word: μέγας
  choice: grand
  rationale: Le terme exprime directement la grandeur et l’importance du roi, sans préciser davantage la nature de sa puissance.
- source_word: ἐξουσίᾳ
  choice: autorité
  rationale: Le mot désigne l’autorité ou le pouvoir légitime du roi. « Autorité » préserve ici la notion de prérogative souveraine.
- source_word: χῶραι
  choice: pays
  rationale: Le pluriel désigne des territoires ou des contrées. « Pays » est naturel en français moderne, sans imposer nécessairement l’idée contemporaine d’État-nation.
- source_word: εὐλαβοῦνται
  choice: craignent
  rationale: Le verbe évoque une crainte qui incite à la prudence et à la retenue. « Craignent » conserve la force de la question rhétorique.
- source_word: ἅψασθαι
  choice: de le toucher
  rationale: Le verbe signifie littéralement « toucher » ou « saisir ». La traduction concrète préserve l’ambiguïté entre le simple contact et l’idée de porter la main sur le roi.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les trois questions rhétoriques et la répétition de la négation grecque sont conservées. « Toucher » maintient volontairement l’image concrète et son possible sens hostile.
