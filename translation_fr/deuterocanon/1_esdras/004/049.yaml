revisions:
- from: 'Il écrivit aussi à tous les Juifs qui montaient du royaume vers la Judée, au sujet de leur liberté[a] : aucun homme puissant, aucun satrape, aucun toparque[b] ni aucun intendant ne devait venir s’en prendre à eux jusque devant leurs portes[c].'
