  register: Français international moderne, soutenu mais accessible. Les titres administratifs précis « satrape » et « toparque » sont conservés, tandis que la tournure négative est réorganisée pour être naturelle en français. L’ambiguïté de πάντα δυνατὸν et l’image des portes sont maintenues ou signalées en note.
