  rationale: La révision supprime les précisions non exprimées par le grec, conserve l’incertitude de πάντα δυνατὸν et restitue plus directement l’image des portes, tout en gardant un français moderne et compréhensible. Les notes signalent les principales ambiguïtés sans les trancher.
