base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
translation:
  language: fr
  text: 'Il écrivit à tous les Juifs qui montaient du royaume vers la Judée, au sujet de la liberté[a] : aucune personne investie d’autorité, aucun satrape, aucun toparque[b] ni aucun intendant ne devait se présenter à leurs portes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « concernant la liberté ». Le grec ne précise pas explicitement à qui cette liberté se rapporte ; il peut s’agir de la liberté des Juifs ou des franchises qui leur étaient accordées.
    reason: lexical_alternative
  - marker: b
    text: Un toparque était le dirigeant d’un district ou d’une localité.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « ne devait pas venir contre leurs portes ». L’expression signifie probablement qu’on ne devait pas les importuner chez eux ni exercer de pressions ou de réquisitions à leur encontre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: il écrivit
  rationale: Le verbe signifie simplement « écrire ». Le contexte peut évoquer un acte officiel, mais le grec ne précise pas qu’il s’agit d’un décret.
- source_word: τοῖς ἀναβαίνουσιν
  choice: qui montaient
  rationale: Cette traduction conserve l’image géographique et religieuse de la montée vers la Judée, sans la réduire au seul sens de « retourner ».
- source_word: ἀπὸ τῆς βασιλείας
  choice: du royaume
  rationale: βασιλεία désigne directement un royaume ou un domaine royal ; « empire » serait ici plus interprétatif.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: au sujet de leur liberté
  rationale: ὑπέρ peut introduire l’objet de l’écrit. Le possessif, implicite en grec, est explicité naturellement en français d’après les Juifs concernés.
- source_word: πάντα δυνατὸν
  choice: aucun homme puissant
  rationale: La construction négative française rend clairement l’interdiction. L’expression grecque difficile désigne probablement toute personne détenant du pouvoir, mais elle peut aussi être comprise plus administrativement.
- source_word: σατράπην
  choice: satrape
  rationale: Ce titre administratif perse précis est bien établi en français et ne nécessite pas de paraphrase.
- source_word: τοπάρχην
  choice: toparque
  rationale: Le terme technique grec est conservé afin de ne pas le confondre avec le satrape ; une note en explique le sens.
- source_word: οἰκονόμον
  choice: intendant
  rationale: Dans ce contexte administratif, « intendant » exprime naturellement la fonction de gestionnaire ou d’administrateur.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: ne devait venir s’en prendre à eux jusque devant leurs portes
  rationale: La formulation conserve l’image concrète des portes et la nuance hostile de ἐπέρχομαι, tout en rendant l’expression idiomatique en français.
