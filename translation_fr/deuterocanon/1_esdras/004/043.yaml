  text: Then he said to the king[a], “Remember the vow that you vowed to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: fr
  text: 'Alors il dit au roi : « Souviens-toi du vœu[a] que tu as fait de rebâtir Jérusalem, le jour où tu as reçu ton royaume. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la prière par laquelle tu t’es engagé » ; le nom grec peut désigner une prière ou un vœu, mais sa reprise par le verbe apparenté et le contexte favorisent ici l’idée d’un engagement solennel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: Souviens-toi
  rationale: L’impératif aoriste exprime ici un appel direct au roi. « Souviens-toi » est naturel, clair et fidèle à la force de l’impératif grec.
- source_word: εὐχὴν ἣν ηὔξω
  choice: du vœu que tu as fait
  rationale: Le nom εὐχή et le verbe apparenté ηὔξω forment une reprise insistante. Dans ce contexte, ils désignent vraisemblablement un engagement solennel du roi; la formulation française évite la répétition peu naturelle « le vœu que tu as voué ».
- source_word: οἰκοδομῆσαι
  choice: de rebâtir
  rationale: Le verbe signifie littéralement « bâtir », mais Jérusalem ayant été détruite, « rebâtir » rend clairement le sens restauratif impliqué par le contexte.
- source_word: τὴν Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: ἐν τῇ ἡμέρᾳ ᾗ
  choice: le jour où
  rationale: Cette tournure temporelle est naturelle en français moderne et conserve la mention explicite du jour.
- source_word: τὸ βασίλειόν σου παρέλαβες
  choice: tu as reçu ton royaume
  rationale: παραλαμβάνω indique ici l’entrée en possession du pouvoir royal. La traduction reste proche du grec sans préciser davantage le mode d’accession.
theological_decisions:
- issue: Sens de εὐχή dans le contexte royal
  choice: vœu
  alternative: prière
  rationale: Le nom εὐχή, repris par le verbe apparenté ηὔξω, peut relever du champ de la prière ou du vœu. Le contexte d’un engagement antérieur du roi favorise « vœu », tout en conservant l’autre possibilité dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au roi dans un contexte ancien et évite la pluralisation absente du grec. La phrase conserve l’ordre narratif et la tension lexicale entre « vœu » et « prière ».
