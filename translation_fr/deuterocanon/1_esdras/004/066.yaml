  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
translation:
  language: fr
  text: et que tous les objets emportés de Jérusalem soient renvoyés là-bas[a] — ceux que Cyrus avait mis à part lorsqu’il fit le vœu d’abattre Babylone[b], et qu’il fit le vœu de les y envoyer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « soient envoyés là-bas »; l’idée de retour est déduite du contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de retrancher Babylone »; le verbe grec signifie littéralement « couper » ou « retrancher » et peut ici avoir le sens de « détruire ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « lorsqu’il pria d’abattre Babylone et de les y envoyer ». Le verbe grec peut signifier « faire un vœu » ou « prier ».'
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: objets
  rationale: Dans ce contexte lié au temple, le terme désigne les objets ou ustensiles sacrés. « Objets » reste naturel et suffisamment large sans préciser davantage que le grec.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: pris à Jérusalem
  rationale: Le participe indique que ces objets avaient été emportés de Jérusalem; « pris à Jérusalem » rend simplement la provenance et l’action.
- source_word: ἐκπέμψαι
  choice: soient renvoyés
  rationale: L’infinitif signifie littéralement « envoyer », mais le contexte indique le retour à Jérusalem d’objets qui en avaient été pris. « Renvoyés » exprime naturellement cette restitution implicite.
- source_word: ἃ ἐχώρισεν
  choice: ceux que Cyrus avait mis à part
  rationale: χωρίζω signifie ici séparer ou réserver des objets dans un but particulier. « Mettre à part » conserve cette nuance sans lui imposer un sens rituel.
- source_word: ηὔξατο
  choice: fit le vœu
  rationale: Avec les infinitifs qui suivent, le verbe désigne vraisemblablement un vœu ou un engagement solennel; la possibilité du sens « pria » est conservée en note.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: d’abattre Babylone
  rationale: ἐκκόπτω signifie littéralement « couper, retrancher » et peut, à propos d’une ville, exprimer sa destruction. « Abattre » conserve une part de l’image grecque tout en restant intelligible en français.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: de les y envoyer
  rationale: Le grec dit littéralement « envoyer là-bas ». Le pronom « les », requis en français pour la clarté, reprend les objets mis à part.
theological_decisions:
- issue: Sens de ηὔξατο dans l’action de Cyrus
  choice: fit le vœu
  alternative: pria
  rationale: La construction avec un infinitif favorise le sens d’un vœu ou d’un engagement solennel, mais le verbe peut aussi signifier « prier »; cette ambiguïté est signalée.
- issue: Expression du retour impliqué par ἐκπέμψαι
  choice: soient renvoyés là-bas
  alternative: soient envoyés là-bas
  rationale: Le contexte indique que les objets pris à Jérusalem doivent y retourner, même si le grec n’exprime pas explicitement l’idée de retour.
- issue: Portée de ἐκκόψαι appliqué à Babylone
  choice: abattre Babylone
  alternative: retrancher Babylone; détruire Babylone
  rationale: « Abattre » rend le résultat destructeur tout en préservant davantage l’image de « couper » que le simple verbe « détruire ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère coordonné du grec tout en explicitant par « les » le complément de « envoyer ». Les notes maintiennent les ambiguïtés lexicales réelles sans surcharger le texte principal.
