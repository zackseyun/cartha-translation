  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
translation:
  language: fr
  text: Ils mangèrent et burent, puis, une fois rassasiés, ils se retirèrent. Mais le roi Darius se retira dans sa chambre à coucher, dormit, puis se réveilla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: Ils mangèrent et burent
  rationale: Les deux aoristes expriment simplement les actions successives de manger et de boire; cette formulation est naturelle et fidèle en français moderne.
- source_word: ἐμπλησθέντες
  choice: une fois rassasiés
  rationale: Le participe indique qu’ils avaient mangé et bu à satiété. « Rassasiés » rend naturellement cette idée sans l’alourdir.
- source_word: ἀνέλυσαν
  choice: ils se retirèrent
  rationale: Dans le contexte de la fin d’un repas, le verbe signifie qu’ils quittèrent les lieux. « Se retirèrent » convient au cadre de cour et reste idiomatique.
- source_word: κοιτῶνα
  choice: chambre à coucher
  rationale: Le terme désigne la pièce destinée au sommeil. Cette expression moderne et claire n’ajoute pas une précision non présente dans le grec.
- source_word: ἐκοιμήθη
  choice: dormit
  rationale: L’aoriste affirme simplement que Darius dormit; « dormit » est la traduction la moins interprétative.
- source_word: ἔξυπνος ἐγένετο
  choice: se réveilla
  rationale: L’expression signifie littéralement « devint éveillé ». « Se réveilla » en donne l’équivalent français naturel.
