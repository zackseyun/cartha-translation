lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: le jeune homme
  rationale: Rend directement le nom grec, qui désigne un homme jeune.
- source_word: ἄρας τὸ πρόσωπον
  choice: il leva le visage
  rationale: Conserve l’image corporelle du grec tout en donnant une syntaxe française naturelle.
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: en direction de Jérusalem
  rationale: Exprime l’orientation vers Jérusalem sans imposer l’idée moins probable d’une opposition.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Correspond au verbe grec et préserve ici le sens de louange adressée à Dieu.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: le Roi du ciel
  rationale: Reproduit le titre divin grec dans une formulation française traditionnelle et intelligible.
theological_decisions:
- issue: Sens de la bénédiction adressée au Roi du ciel
  choice: bénit le Roi du ciel
  alternative: loua le Roi du ciel
  rationale: La traduction formelle conserve εὐλόγησεν et la tension idiomatique biblique selon laquelle un être humain peut « bénir » Dieu, sans la réduire silencieusement à la louange.
- issue: Orientation par rapport à Jérusalem
  choice: en direction de Jérusalem
  alternative: face à Jérusalem
  rationale: ἔναντιον indique ici vraisemblablement l’orientation spatiale; cette formulation évite de suggérer une opposition à la ville tout en restant prudente.
translation_notes:
