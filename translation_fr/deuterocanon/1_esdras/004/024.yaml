  yaml_path: translation/deuterocanon/1_esdras/004/024.yaml
  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
translation:
  language: fr
  text: 'Alors le deuxième, celui qui avait parlé de la force du roi, se mit à parler : « Messieurs, les êtres humains ne l’emportent-ils pas, en dominant la terre, la mer et tout ce qu’elles contiennent ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἤρξατο ... λαλεῖν
  choice: Alors ... se mit à parler
  rationale: « Se mit à parler » rend naturellement l’inchoatif grec ἤρξατο avec l’infinitif. « Alors » marque la progression du récit sans alourdir la phrase.
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: L’ordinal substantivé désigne le deuxième intervenant dans la suite du débat.
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: celui qui avait parlé de la force du roi
  rationale: Le plus-que-parfait situe cette prise de parole avant l’intervention présente. « Force » conserve le sens concret de ἰσχύς et le thème du concours.
- source_word: Ὦ ἄνδρες
  choice: Messieurs
  rationale: Dans le cadre d’un débat public entre hommes, « Messieurs » constitue une interpellation française actuelle et naturelle, sans l’archaïsme de « Ô hommes ».
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: les êtres humains ne l’emportent-ils pas
  rationale: La question négative grecque appelle une réponse affirmative. « L’emporter » exprime la supériorité indiquée par ὑπερισχύω, tandis que « les êtres humains » rend la portée générale de οἱ ἄνθρωποι.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: en dominant la terre, la mer
  rationale: « En dominant » restitue la construction participiale et évite d’imposer explicitement une valeur causale. « Dominer » exprime l’exercice de la maîtrise propre à κατακρατέω.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tout ce qu’elles contiennent
  rationale: Cette formulation idiomatique renvoie clairement à la terre et à la mer tout en conservant la portée exhaustive du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La construction participiale est conservée par « en dominant », afin de ne pas transformer explicitement le rapport en causalité. La distinction entre ἄνδρες, interpellation masculine, et ἄνθρωποι, désignation générale de l’humanité, est maintenue par « Messieurs » et « les êtres humains ».
