  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
translation:
  language: fr
  text: Tu es béni, toi qui m’as donné la sagesse ; et je te rends grâce[a], Maître des pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te reconnais » ou « je te loue ». Le verbe grec désigne une reconnaissance ou une confession publique et prend probablement ici le sens d’une action de grâce dans la prière.
    reason: lexical_alternative
  - marker: b
    text: Ou « Souverain des pères ». Le grec emploie δέσποτα, terme distinct de κύριος (« Seigneur »).
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: béni
  rationale: Adjectif prédicatif employé dans une bénédiction adressée à Dieu ; « béni » conserve la formulation doxologique sans la réduire à « loué ».
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: toi qui m’as donné la sagesse
  rationale: La relative qualifie directement l’interlocuteur. Le passé composé rend naturellement l’aoriste grec dans cette prière suscitée par un don accompli et toujours pertinent.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Équivalent français courant et précis de σοφία dans ce contexte.
- source_word: ὁμολογῶ
  choice: je te rends grâce
  rationale: Avec le datif σοὶ dans une prière, le verbe exprime ici une reconnaissance déclarée, vraisemblablement sous forme d’action de grâce. Une note conserve les autres nuances possibles.
- source_word: δέσποτα
  choice: Maître
  rationale: « Maître » préserve mieux que « Seigneur » la distinction lexicale entre δεσπότης, qui souligne l’autorité souveraine, et κύριος.
- source_word: τῶν πατέρων
  choice: de nos pères
  rationale: Dans cette adresse traditionnelle à Dieu, l’expression désigne naturellement les pères du peuple auquel appartient l’orant. Le possessif explicite en français la relation implicite, tout en maintenant le masculin de πατέρων.
theological_decisions:
- issue: Traduction du titre divin δέσποτα
  choice: Maître
  alternative: Souverain ; Seigneur
  rationale: « Maître » conserve le sens d’autorité propre à δεσπότης et évite de le confondre avec le titre κύριος.
- issue: Référent de τῶν πατέρων
  choice: de nos pères
  alternative: des pères ; de nos ancêtres
  rationale: Le contexte de prière rend idiomatique la référence aux pères du peuple de l’orant. « Pères » préserve toutefois la forme masculine du grec ; une note signale que le possessif n’est pas exprimé.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation conserve les deux membres de la prière. « Maître » porte une majuscule comme titre divin en adresse directe.
