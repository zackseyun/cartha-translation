  rationale: La révision rend la requête plus naturelle en français moderne et respecte la distinction grecque entre les verbes de demande. Elle conserve le vœu comme étant celui du roi, conformément à ηὔξω, et rétablit le rattachement de « ἐκ στόματός σου » à l’accomplissement demandé. L’ambiguïté précise de cette expression est signalée en note plutôt que résolue de façon excessive.
