base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: fr
  text: Et maintenant, voici ce que je demande, seigneur le roi, et ce que je sollicite de toi ; c’est là la grandeur qui vient de toi. Je te supplie donc d’accomplir, par ta parole[a], le vœu que tu as fait au Roi du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire depuis/par ta bouche ». L’expression évoque l’accomplissement du vœu par la parole ou le décret du roi.'
    reason: La tournure grecque est inhabituelle en français. La note explicite sa valeur sans transformer la parole du roi en un objet ajouté au texte.
lexical_decisions:
- source_word: ἀξιῶ
  choice: je réclame
  rationale: Le verbe peut exprimer le fait de demander ou de revendiquer. « Je réclame » conserve ici une nuance plus ferme que αἰτοῦμαί, tout en restant approprié à une requête adressée au roi.
- source_word: κύριε βασιλεῦ
  choice: seigneur roi
  rationale: Vocatif respectueux adressé au souverain humain. La minuscule distingue ce titre de l’appellation divine « Roi du ciel ».
- source_word: αἰτοῦμαί σε
  choice: ce que je te demande
  rationale: La formulation française rend naturellement le complément de personne σε et maintient le redoublement rhétorique avec ἀξιῶ.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: la grandeur qui viendra de toi
  rationale: Cette traduction conserve le sens premier de μεγαλωσύνη et présente la faveur royale comme procédant du roi, sans réduire explicitement le terme à la générosité.
- source_word: δέομαι
  choice: je te supplie
  rationale: Le verbe intensifie la requête ; « supplier » restitue le ton pressant et respectueux.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: d’accomplir le vœu
  rationale: Dans ce contexte, εὐχή désigne un engagement solennel plutôt qu’une simple prière, et ποιεῖν indique sa mise à exécution.
- source_word: ἣν ηὔξω
  choice: que tu as fait
  rationale: 'ηὔξω est à la deuxième personne du singulier : le vœu a été fait par le roi auquel le locuteur s’adresse. Cela corrige le contresens « que j’ai fait » de la couche anglaise.'
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: au Roi du ciel
  rationale: Titre divin transparent, mis en contraste avec le roi terrestre interpellé dans la phrase.
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: en réalisant ce qui est sorti de ta bouche
  rationale: La tournure grecque est littéralement « faire depuis ta bouche ». Le français explicite seulement le complément implicite de « réaliser » et conserve l’image d’une parole royale prononcée.
theological_decisions:
- issue: Référent de « Roi du ciel »
  choice: Titre désignant Dieu, distinct du roi humain auquel le discours est adressé.
  alternative: Comprendre l’expression comme une qualification du roi terrestre.
  rationale: Le texte oppose clairement le « seigneur roi » présent à celui envers qui ce roi a pris un engagement, le « Roi du ciel ».
- issue: Auteur du vœu
  choice: Le roi humain a fait le vœu.
  alternative: Le locuteur aurait lui-même fait le vœu.
  rationale: La forme grecque ηὔξω est une deuxième personne du singulier. La traduction respecte cette donnée grammaticale malgré la lecture divergente de la couche anglaise.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement convient à la syntaxe biblique de l’adresse singulière et permet de suivre clairement les pronoms grecs. La formulation garde la répétition solennelle des verbes de demande et distingue par les majuscules le roi humain du « Roi du ciel ».
