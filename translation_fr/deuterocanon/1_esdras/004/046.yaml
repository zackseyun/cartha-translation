    rationale: Le texte « en réalisant ce qui est sorti de ta bouche » ajoute un contenu nominal absent du grec et déplace le sens vers l’exécution d’une parole déjà prononcée. Il faut garder l’expression comme manière d’accomplir le vœu, avec une note explicative.
  - severity: low
    issue: Registre de « je réclame »
    rationale: Dans cette supplique adressée au souverain, « réclamer » peut évoquer l’exigence ou la revendication. ἀξιῶ est ici une demande, redoublée par αἰτοῦμαί.
  - severity: low
    issue: Tour « qui viendra de toi »
    rationale: Le présent grec ἡ παρὰ σοῦ se rend plus directement par « qui vient de toi » ; le futur introduit une nuance temporelle non exprimée.
