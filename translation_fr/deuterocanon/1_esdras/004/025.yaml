  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
translation:
  language: fr
  text: Mais le roi est plus puissant qu’eux, il exerce son autorité sur eux et il est leur maître ; quoi qu’il leur dise, ils lui obéissent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils l’écoutent » ou « ils tiennent compte de ses paroles ». Le verbe grec appartient littéralement au vocabulaire de l’écoute, mais il implique ici l’obéissance à l’ordre du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Mais le roi
  rationale: Dans le fil de l’argumentation, δέ marque ici une légère opposition ; « mais » la rend naturellement, tandis que βασιλεύς signifie simplement « roi ».
- source_word: ὑπερισχύει
  choice: est plus puissant qu’eux
  rationale: Le verbe exprime une supériorité de force. Cette formulation conserve explicitement la valeur comparative impliquée par le contexte et le complément αὐτῶν.
- source_word: κυριεύει αὐτῶν
  choice: exerce son autorité sur eux
  rationale: κυριεύω désigne l’exercice de la seigneurie ou du pouvoir. Cette expression est claire en français moderne et évite de confondre entièrement ce verbe avec δεσπόζω.
- source_word: δεσπόζει αὐτῶν
  choice: les tient sous sa domination
  rationale: δεσπόζω évoque une maîtrise plus absolue. « Sous sa domination » préserve cette intensité et maintient la progression par rapport à κυριεύει.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: quoi qu’il leur dise
  rationale: La construction avec ἐάν exprime l’indétermination. « Quoi qu’il leur dise » est naturel et fidèle à cette portée.
- source_word: ἐνακούουσιν
  choice: ils lui obéissent
  rationale: Bien que le verbe appartienne au champ lexical de l’écoute, le contexte de l’autorité royale lui donne ici le sens d’écouter en se conformant, donc d’obéir.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La triple progression grecque — supériorité, exercice de l’autorité, domination — est conservée sans répétition artificielle. Le marqueur [a] est placé après la proposition qu’il précise.
