  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: fr
  text: 'Ils dirent : « Lorsque le roi se lèvera, on lui remettra le document. Celui dont le roi et les trois grands dignitaires de Perse jugeront le discours le plus sage recevra la victoire, comme il est écrit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθῇ
  choice: se lèvera
  rationale: Le verbe désigne ici le fait que le roi se lève, vraisemblablement après son sommeil, sans qu’il soit nécessaire de préciser davantage.
- source_word: τὸ γράμμα
  choice: le document
  rationale: Dans ce contexte, γράμμα désigne l’écrit destiné à être remis au roi. « Le document » est naturel en français et n’implique pas une lettre privée.
- source_word: κρίνῃ
  choice: jugeront
  rationale: Le verbe exprime l’évaluation et la décision prises par le roi et les dignitaires au sujet des réponses du concours.
- source_word: μεγιστᾶνες
  choice: grands dignitaires
  rationale: Le terme désigne de hauts personnages de la cour perse. « Grands dignitaires » rend clairement leur rang élevé en français moderne.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: les propos les plus sages
  rationale: λόγος renvoie ici à ce que chaque concurrent a exposé, tandis que le comparatif σοφώτερος prend naturellement en français une valeur superlative puisque plusieurs concurrents sont comparés.
- source_word: τὸ νῖκος
  choice: la victoire
  rationale: νῖκος désigne directement la victoire accordée au gagnant du concours.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Cette formule rend le parfait passif et indique que les modalités ou la récompense figurent dans l’écrit.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque très imbriquée a été légèrement restructurée en deux phrases pour rendre clairement le jugement collectif et l’attribution de la victoire, sans résoudre au-delà du contexte la portée de λόγος.
