  text: and they do not remember[a], while they are drinking, to show affection to friends and brothers, and before long they draw swords.
translation:
  language: fr
  text: Et, quand ils boivent, ils oublient[a] de se montrer affectueux[b] envers leurs amis et leurs frères ; peu après, ils dégainent des épées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici le singulier (« il ne se souvient pas »), puis passe au pluriel dans les verbes suivants.
    reason: grammatical_ambiguity
  - marker: b
    text: Ou « de se montrer amicaux ». Le verbe grec peut désigner plus largement une conduite affectueuse ou amicale, et non nécessairement un geste précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: ils oublient
  rationale: Le grec emploie littéralement « ne se souvient pas » au singulier, mais les verbes qui suivent sont au pluriel. Le pluriel produit en français une généralisation naturelle, tandis qu’une note signale l’irrégularité grammaticale du texte source.
- source_word: ὅταν πίνωσιν
  choice: quand ils boivent
  rationale: ὅταν avec le subjonctif exprime ici une circonstance générale ou répétée. « Quand ils boivent » est naturel et conserve cette valeur.
- source_word: φιλιάζειν
  choice: se montrer affectueux
  rationale: Le verbe désigne un comportement affectueux ou amical, sans imposer l’idée d’un baiser littéral.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: envers leurs amis et leurs frères
  rationale: Cette formulation rend directement les deux groupes relationnels désignés par les datifs grecs.
- source_word: μετʼ οὐ πολὺ
  choice: peu après
  rationale: Expression française concise qui restitue le bref intervalle indiqué par l’idiome grec.
- source_word: σπῶνται μαχαίρας
  choice: ils dégainent des épées
  rationale: Avec μαχαίρας, σπάω décrit l’action de tirer une arme de son fourreau. « Dégainer » est précis et idiomatique en français.
