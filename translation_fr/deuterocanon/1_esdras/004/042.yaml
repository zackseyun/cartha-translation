  rationale: La seule correction nécessaire concerne le rendu de συγγενής μου. « De ma parenté » est plus clair et plus idiomatique que « mon parent » en français international moderne, tout en gardant l’ambiguïté voulue entre parenté et dignité honorifique. « Parce que » rend explicitement, sans présupposition superflue, la valeur causale de ὃν τρόπον. La note b est légèrement resserrée afin de ne pas présenter « tout près » comme un sens littéral plus précis que ne l’exige le grec.
