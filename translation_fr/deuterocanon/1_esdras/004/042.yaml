  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Demande ce que tu veux de plus que ce qui a été écrit[a], et nous te le donnerons, parce que tu as été reconnu plus sage. Tu siégeras à mes côtés[b] et tu seras appelé de ma parenté[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que tu souhaites en plus de ce qui a été écrit ». L’expression renvoie probablement aux récompenses déjà consignées par écrit.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque indique qu’il siégera auprès du roi; elle marque une place d’honneur à la cour.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « membre de ma parenté ». Dans ce contexte, cette appellation exprime la faveur du roi et l’élévation de statut, sans nécessairement désigner un lien de sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  choice: Demande
  rationale: L’impératif aoriste moyen constitue ici une invitation ou un ordre direct du roi. « Demande » est naturel et conserve cette force.
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: ce que tu veux de plus que ce qui a été écrit
  rationale: Cette formulation garde la proposition relative ouverte, la valeur comparative de πλείω et la référence indéterminée aux choses déjà mises par écrit, sans préciser à tort leur contenu.
- source_word: δώσομέν σοι
  choice: nous te le donnerons
  rationale: Le futur de δίδωμι est rendu simplement; le pronom « le » reprend ce qui sera demandé.
- source_word: ὃν τρόπον
  choice: puisque
  rationale: Dans ce contexte, la locution introduit le motif de la faveur royale. « Puisque » exprime clairement cette valeur causale.
- source_word: εὑρέθης σοφώτερος
  choice: tu as été reconnu plus sage
  rationale: « Reconnu » restitue naturellement le passif de εὑρίσκω dans le sens d’une appréciation établie, tandis que « plus sage » préserve le comparatif sans en expliciter le terme sous-entendu.
- source_word: ἐχόμενός μου καθήσῃ
  choice: tu siégeras à mes côtés
  rationale: Avec le génitif, ἐχόμενος indique la proximité. Dans un cadre royal, « siéger à mes côtés » exprime à la fois la place voisine et l’honneur de cour.
- source_word: συγγενής μου κληθήσῃ
  choice: tu seras appelé mon parent
  rationale: συγγενής désigne une personne apparentée. « Parent » conserve l’image familiale et demeure naturel en français moderne, sans affirmer nécessairement un nouveau lien biologique.
theological_decisions:
- issue: Portée du titre familial συγγενής μου
  choice: mon parent
  alternative: mon proche; membre de ma parenté
  rationale: Le grec emploie explicitement un terme de parenté dans un contexte d’élévation royale. « Ami » introduirait un titre politique absent du texte; « parent » préserve la tension entre langage familial et statut honorifique.
- issue: Comparaison implicite dans σοφώτερος
  choice: plus sage
  alternative: le plus sage; plus sage que les autres
  rationale: Le grec est comparatif et ne nomme pas le terme de comparaison. La traduction le laisse donc implicite au lieu de transformer le mot en superlatif ou d’ajouter un groupe de comparaison.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours royal reste direct et solennel sans archaïsmes. « Siéger » convient au contexte de cour, tandis que « parent » est plus courant aujourd’hui que « homme de ma parenté » ou « mon allié ».
