  source_fidelity: « Partit pour Babylone » exprime seulement le départ en direction de Babylone, tandis que ἐξῆλθεν εἰς Βαβυλῶνα décrit le déplacement accompli vers cette ville. « Se rendit à Babylone » rend plus exactement le sens narratif en français naturel. « Fit son rapport à tous ses frères » conserve de manière acceptable l’absence de contenu explicite après ἀπήγγειλεν.
