  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: fr
  text: Il prit les lettres, se rendit à Babylone et fit son rapport à tous ses frères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas explicitement ce qu’il leur rapporta; le contenu est sous-entendu par le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: prit
  rationale: L’aoriste de λαμβάνω exprime ici simplement l’action de prendre les lettres dans la suite du récit.
- source_word: τὰς ἐπιστολάς
  choice: les lettres
  rationale: ἐπιστολή désigne couramment une lettre; le pluriel français rend directement le texte grec et convient à des communications officielles.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: partit pour Babylone
  rationale: Cette formulation française naturelle exprime le départ vers la destination indiquée, sans alourdir le récit par un calque de «sortit».
- source_word: ἀπήγγειλεν
  choice: fit son rapport
  rationale: ἀπαγγέλλω signifie rapporter ou annoncer. La tournure conserve ici l’absence de complément direct explicite tout en restant idiomatique en français.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: à tous ses frères
  rationale: Cette traduction suit littéralement le terme familial ἀδελφοί sans l’élargir implicitement à «compatriotes» ou «parents».
