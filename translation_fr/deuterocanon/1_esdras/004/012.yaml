  verdict: revise
  source_fidelity: 'La seconde proposition du brouillon atténue légèrement la relation syntaxique : ὑπὲρ δὲ πάντα se rattache naturellement à νικᾷ et signifie que la vérité remporte la victoire « sur tout / sur toutes choses », plutôt qu’une simple priorité (« par-dessus tout »). La première proposition exprime bien l’idée de prévaloir, mais « plus fortes » sans complément comparatif est moins idiomatique en français.'
  naturalness: « Les femmes l’emportent » est une formulation moderne, proverbiale et naturelle qui rend Ὑπερισχύουσιν sans introduire un comparant sous-entendu. « La vérité l’emporte sur tout » rend explicitement et avec fluidité la portée universelle de la victoire.
  terminology: « La vérité » conserve l’article et la personnification de ἡ ἀλήθεια. Le vocabulaire de l’emporter maintient l’image de victoire sans imposer d’interprétation doctrinale.
  issues:
