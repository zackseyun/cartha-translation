  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: fr
  text: 'Le troisième écrivit : « Les femmes l’emportent, mais la vérité l’emporte sur tout. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Le troisième
  rationale: L’article suivi de l’ordinal est substantivé et désigne le troisième participant; cette formulation est concise et naturelle.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: Le verbe signifie directement « écrire » et introduit ici la proposition rédigée par le troisième participant.
- source_word: Ὑπερισχύουσιν
  choice: sont plus fortes
  rationale: Le verbe exprime la supériorité en force ou le fait de l’emporter; le comparatif français convient au caractère proverbial de l’énoncé.
- source_word: αἱ γυναῖκες
  choice: les femmes
  rationale: Dans ce propos général, γυναῖκες désigne les femmes plutôt que les épouses.
- source_word: ὑπὲρ δὲ πάντα
  choice: mais par-dessus tout
  rationale: 'La locution marque une comparaison culminante: au-dessus de toute autre réalité. « Par-dessus tout » en préserve la portée tout en restant idiomatique.'
- source_word: νικᾷ
  choice: triomphe
  rationale: Le présent énonce une vérité générale; « triomphe » conserve l’image de victoire portée par νικάω et s’emploie naturellement avec « la vérité ».
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: L’article grec et la personnification de l’abstraction sont naturellement rendus par « la vérité » en français.
theological_decisions:
- issue: Rendu de la maxime culminante sur ἡ ἀλήθεια
  choice: la vérité triomphe
  alternative: la vérité l’emporte sur tout
  rationale: « Triomphe » maintient la métaphore de la victoire sans réduire la phrase à une simple comparaison abstraite; « par-dessus tout » conserve séparément la portée de ὑπὲρ πάντα.
translation_notes:
  register: Français international moderne, courant et digne. La tournure proverbiale est conservée, ainsi que la progression entre la force attribuée aux femmes et le triomphe suprême de la vérité.
