    rationale: En français, « par-dessus tout » peut surtout signifier « avant tout / principalement ». Dans le grec, ὑπὲρ πάντα qualifie la victoire de la vérité sur tout ce qui lui est opposé ou comparé. « Sur tout » rend cette relation sans ambiguïté.
  - severity: low
    issue: Comparatif implicite dans « Les femmes sont plus fortes »
    rationale: Cette expression appelle habituellement un terme de comparaison en français. Le verbe « l’emportent » restitue directement la valeur de prévalence de Ὑπερισχύουσιν et reste conforme au contexte proverbial.
