  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: fr
  text: La vérité demeure et est forte pour toujours ; elle vit et l’emporte pour toujours et à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: L’article est conservé et la vérité demeure le sujet mis en relief dans cette déclaration culminante.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » exprime avec dignité la permanence continue, sans archaïsme excessif.
- source_word: ἰσχύει
  choice: reste forte
  rationale: Cette formulation exprime la force persistante de la vérité tout en distinguant ce verbe de κρατεῖ.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Équivalent français naturel de cette expression temporelle grecque.
- source_word: ζῇ
  choice: vit
  rationale: Le verbe direct préserve la personnification frappante de la vérité.
- source_word: κρατεῖ
  choice: l’emporte
  rationale: « L’emporte » rend ici l’idée de domination ou de victoire active et reste distinct de ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: pour l’éternité
  rationale: Cette expression française soutenue traduit l’intensification finale sans reproduire une tournure grecque peu naturelle.
theological_decisions:
- issue: Personnification de la vérité
  choice: Conserver les prédicats personnels « vit » et « l’emporte »
  alternative: 'Dépersonnaliser : « la vérité perdure et garde sa puissance »'
  rationale: Le grec attribue explicitement à la vérité le fait de vivre et de dominer. La personnification rhétorique est donc préservée sans y ajouter d’identification doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé, de même que la progression entre permanence, force, vie et victoire. Le point-virgule rend lisible la structure en deux membres.
