  yaml_path: translation/deuterocanon/1_esdras/004/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act thus? And he fell silent after speaking in this way.
translation:
  language: fr
  text: « Hommes[a], le vin ne l’emporte-t-il pas, puisqu’il contraint à agir ainsi ? » Après avoir parlé ainsi, il se tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Messieurs, le vin n’est-il pas le plus fort, puisqu’il force à agir ainsi ? » Le grec emploie une question rhétorique; le verbe peut aussi se rendre par « être plus fort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Hommes
  rationale: Le vocatif grec s’adresse directement à plusieurs hommes. « Hommes » en conserve la forme masculine et solennelle, malgré son caractère un peu marqué en français moderne.
- source_word: οὐχ ὑπερισχύει ὁ οἶνος
  choice: le vin n’est-il pas le plus fort
  rationale: ὑπερισχύει exprime une force supérieure ou le fait de l’emporter. Dans le contexte du concours portant sur ce qui est le plus fort, cette formulation française rend clairement la comparaison implicite.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: puisqu’il contraint à agir ainsi
  rationale: ἀναγκάζει indique la contrainte; le grec ne précise pas l’objet humain du verbe, et l’infinitif français permet de conserver cette indétermination sans ajouter « les gens » ou « quelqu’un ».
- source_word: καὶ ἐσίγησεν
  choice: il se tut
  rationale: L’aoriste signale que l’orateur cesse de parler; « il se tut » est naturel, concis et narratif.
- source_word: οὕτως εἴπας
  choice: Après avoir parlé ainsi
  rationale: Le participe aoriste marque une action antérieure à celle du verbe principal, tandis que οὕτως renvoie à la manière ou au contenu de son discours.
