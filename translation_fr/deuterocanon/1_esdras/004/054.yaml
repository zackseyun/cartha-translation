translation:
  language: fr
  text: Il écrivit aussi au sujet de la provision et du vêtement sacerdotal, dans lequel ils accomplissent leur service[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est ici maladroit : littéralement, « la provision et le vêtement sacerdotal, en quoi ils accomplissent leur service en elle ». Le premier pronom est ambigu, et le pronom féminin final renvoie probablement au vêtement; la formulation peut être abrégée ou textuellement instable.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: Il consigna aussi par écrit
  rationale: L’aoriste de γράφω signifie qu’il écrivit ou mit par écrit. Dans ce contexte administratif, « consigna par écrit » exprime naturellement l’idée sans transformer explicitement l’acte en décret.
- source_word: χορηγίαν
  choice: les dispositions concernant les fournitures
  rationale: χορηγία désigne ce qui est fourni pour assurer un service. « Fournitures » conserve une portée matérielle assez large, tandis que « dispositions concernant » permet à ἔγραψεν de régir naturellement le complément en français.
- source_word: ἱερατικὴν στολήν
  choice: le vêtement sacerdotal
  rationale: στολή désigne un vêtement distinctif ou d’apparat. Le singulier grec est maintenu; « vêtement sacerdotal » est clair, digne et moins précis à tort que « robe ».
- source_word: ἐν τίνι
  choice: dans lequel
  rationale: La locution renvoie vraisemblablement au vêtement sacerdotal et indique la tenue dans laquelle le service est accompli.
- source_word: λατρεύουσιν
  choice: ils accomplissent leur service
  rationale: Dans ce contexte lié au sacerdoce et au sanctuaire, λατρεύω désigne le service cultuel. Cette formulation reste compréhensible sans réduire le terme au seul acte d’adoration.
- source_word: ἐν αὐτῇ
  choice: '[sens intégré à « dans lequel »]'
  rationale: Le pronom féminin renvoie très probablement à στολή. Le grec cumule ἐν τίνι et ἐν αὐτῇ de manière redondante; le français n’en exprime qu’une fois le rapport locatif, et la note signale cette difficulté.
theological_decisions:
- issue: Portée cultuelle de λατρεύουσιν
  choice: « ils accomplissent leur service » dans un contexte sacerdotal
  alternative: « ils adorent » ou « ils rendent un culte »
  rationale: La mention du vêtement sacerdotal oriente vers l’exercice du service au sanctuaire. La traduction choisie préserve cette nuance fonctionnelle sans introduire une distinction confessionnelle.
- issue: Référent du pronom féminin αὐτῇ
  choice: Le rapport est rattaché au « vêtement sacerdotal »
  alternative: Conserver mot à mot la répétition « dans lequel ils servent en lui »
  rationale: L’accord féminin soutient le renvoi à στολή, mais la construction grecque est maladroite ou comprimée. Le texte principal adopte un français intelligible et la note conserve l’incertitude textuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation administrative « consigna par écrit les dispositions » convient au contexte, tandis que la note préserve l’étrangeté réelle du texte grec sans l’imposer lourdement au lecteur.
