revisions:
- from: Il consigna aussi par écrit les dispositions concernant les fournitures et le vêtement sacerdotal dans lequel ils accomplissent leur service[a].
  to: Il écrivit aussi au sujet de la provision et du vêtement sacerdotal, dans lequel ils accomplissent leur service[a].
