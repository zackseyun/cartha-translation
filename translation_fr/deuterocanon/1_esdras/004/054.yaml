review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement le sens général de γράφω, χορηγία, στολή et λατρεύω. Toutefois, « consigna aussi par écrit les dispositions concernant les fournitures » développe indûment le grec : le texte dit simplement qu’il écrivit au sujet de la provision et du vêtement sacerdotal. La construction finale ἐν τίνι … ἐν αὐτῇ est effectivement difficile; le texte principal peut en retenir le rattachement vraisemblable au vêtement, à condition que la note signale aussi l’ambiguïté du premier pronom et la redondance finale.'
  naturalness: « Il écrivit aussi au sujet de… » est plus direct, naturel et proportionné que la paraphrase administrative « consigna… les dispositions concernant ». « Ils accomplissent leur service » convient à un registre moderne et soutenu. La note formule l’anomalie sans imposer une reconstruction.
  terminology: « Provision » respecte le singulier de χορηγία et demeure suffisamment large. « Vêtement sacerdotal » est exact pour ἱερατικὴ στολή. « Accomplissent leur service » restitue adéquatement le service cultuel de λατρεύω sans surinterprétation doctrinale.
  issues:
  - severity: medium
    issue: Paraphrase administrative et pluriel ajoutés pour χορηγία
    rationale: « Les dispositions concernant les fournitures » ajoute l’idée de dispositions administratives et transforme le singulier χορηγία en fournitures plurielles. « Au sujet de la provision » est plus fidèle tout en restant idiomatique.
  - severity: low
    issue: La note décrit insuffisamment l’ambiguïté de ἐν τίνι
    rationale: Le relatif/indéfini τίνι est formellement neutre et la séquence avec ἐν αὐτῇ est anormale. La note ne devrait pas présenter « dans lequel » comme la seule donnée littérale ni identifier avec trop d’assurance l’antécédent.
  revised_text: Il écrivit aussi au sujet de la provision et du vêtement sacerdotal, dans lequel ils accomplissent leur service[a].
  revised_footnotes:
  - marker: a
    text: 'Le grec est ici maladroit : littéralement, « la provision et le vêtement sacerdotal, en quoi ils accomplissent leur service en elle ». Le premier pronom est ambigu, et le pronom féminin final renvoie probablement au vêtement; la formulation peut être abrégée ou textuellement instable.'
