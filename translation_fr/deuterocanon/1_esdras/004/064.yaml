  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Demande ce que tu veux, au-delà de ce qui est écrit, et nous te le donnerons, puisque tu as été reconnu plus sage. Tu siégeras près de moi et tu seras appelé mon parent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείω τῶν γεγραμμένων
  choice: en plus de ce qui a été écrit
  rationale: Rend directement l’idée d’une demande dépassant les promesses ou dispositions déjà consignées, sans préciser ce que le grec laisse implicite.
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: puisque tu t’es montré plus sage
  rationale: L’expression idiomatique traduit le constat établi par l’épreuve; « plus sage » conserve le comparatif grec dont le terme de comparaison reste sous-entendu.
- source_word: ἐχόμενός μου καθήσῃ
  choice: tu siégeras à mes côtés
  rationale: Formulation française naturelle qui préserve l’idée de proximité immédiate auprès du roi et la valeur honorifique du futur.
- source_word: συγγενής μου κληθήσῃ
  choice: tu seras appelé mon parent
  rationale: « Parent » conserve la notion large de parenté ou d’appartenance à la parentèle royale, sans imposer un degré précis de relation.
