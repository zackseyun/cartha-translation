revisions:
- from: Il renvoya tous les objets que Cyrus avait retirés de Babylone[a]. Et tout ce que Cyrus avait dit de faire, il ordonna lui-même de le faire et de l’envoyer à Jérusalem.
  to: Il renvoya tous les ustensiles que Cyrus avait mis à part de Babylone[a]. Et tout ce que Cyrus avait dit de faire, il ordonna lui aussi de le faire et de l’envoyer à Jérusalem.
  rationale: La révision rend le caractère cultuel probable de σκεύη, conserve l’ambiguïté lexicale de χωρίζω avec ἀπό dans la note, et restitue la force additive de καὶ αὐτός. La construction coordonnée des infinitifs et la référence pronominale large sont maintenues afin de ne pas préciser au-delà du grec la portée de « faire » et « envoyer ».
