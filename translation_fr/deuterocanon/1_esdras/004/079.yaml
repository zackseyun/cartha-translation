  yaml_path: translation/deuterocanon/1_esdras/004/079.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: fr
  text: Il renvoya tous les ustensiles que Cyrus avait mis à part de Babylone[a]. Et tout ce que Cyrus avait dit de faire, il ordonna lui aussi de le faire et de l’envoyer à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait séparés de Babylone » ou « avait retirés de Babylone ». Le verbe grec peut exprimer l’idée de séparer, de mettre à part ou de retirer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: renvoya
  rationale: Le verbe signifie littéralement « envoya au loin »; dans le contexte du retour à Jérusalem d’objets emportés, « renvoya » exprime naturellement le mouvement de restitution sans alourdir la phrase.
- source_word: πάντα τὰ σκεύη
  choice: tous les objets
  rationale: σκεύη désigne des objets ou ustensiles, ici liés au sanctuaire. « Objets » reste naturel en français moderne et évite de restreindre indûment la catégorie à des récipients.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: que Cyrus avait retirés de Babylone
  rationale: χωρίζω peut signifier séparer, mettre à part ou éloigner. Avec ἀπό et un lieu, « retirer de Babylone » rend clairement la provenance tout en laissant une note signaler les autres nuances possibles.
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: tout ce que Cyrus avait dit de faire
  rationale: Cette formulation conserve la généralité de ποιεῖν et le rapport infinitif après « dire », sans transformer explicitement les paroles de Cyrus en ordre.
- source_word: καὶ αὐτὸς ἐπέταξεν
  choice: il ordonna lui-même
  rationale: « Lui-même » préserve l’emphase de αὐτός, tandis que « ordonna » convient à l’acte d’autorité royale exprimé par ἐπιτάσσω.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: de le faire et de l’envoyer à Jérusalem
  rationale: Les deux infinitifs coordonnés sont maintenus. Les pronoms renvoient collectivement à « tout ce que », comme le permet le français, sans préciser davantage la nature des choses concernées.
