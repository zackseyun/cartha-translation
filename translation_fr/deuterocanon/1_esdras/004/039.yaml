  yaml_path: translation/deuterocanon/1_esdras/004/039.yaml
  text: and with her there is no partiality or favoritism[a], but she does what is just rather than all that is unjust and wicked; and all approve of her works[b],
translation:
  language: fr
  text: Elle ne fait preuve ni de favoritisme ni de distinction[a] ; au contraire, elle fait ce qui est juste, à l’écart de tout ce qui est injuste et mauvais[b]. Et tous approuvent ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « favoritisme » signifie littéralement « recevoir des visages », c’est-à-dire favoriser certaines personnes. Le mot rendu par « distinction » peut aussi évoquer une préférence.
    reason: lexical_alternative
  - marker: b
    text: 'Les adjectifs grecs peuvent aussi désigner des personnes : « à l’écart de tous ceux qui sont injustes et mauvais ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: λαμβάνειν πρόσωπα
  choice: favoritisme
  rationale: L’expression signifie littéralement « recevoir des visages », idiome qui désigne le fait de favoriser certaines personnes. « Favoritisme » en rend clairement le sens en français moderne.
- source_word: διάφορα
  choice: distinction
  rationale: Dans ce contexte, le terme évoque des différences ou distinctions établies entre les personnes. Le singulier collectif après « ni » est naturel en français.
- source_word: τὰ δίκαια
  choice: ce qui est juste
  rationale: Cette formulation rend naturellement le neutre pluriel grec tout en conservant sa portée morale et judiciaire.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: loin de toute injustice et de toute méchanceté
  rationale: « Loin de » préserve la valeur de séparation de ἀπό. Les adjectifs substantivés peuvent désigner ce qui est injuste et mauvais, sans obliger le français à trancher en faveur de personnes injustes.
- source_word: εὐδοκοῦσι
  choice: approuvent
  rationale: Le verbe exprime ici une appréciation favorable des œuvres de la vérité ; « approuvent » convient au contexte moral.
- source_word: αὐτὴν / αὐτῆς
  choice: elle / ses
  rationale: Les pronoms renvoient à « la vérité », nom féminin personnifié dans le contexte. Le féminin maintient cette personnification en français.
theological_decisions:
- issue: Personnification de la vérité
  choice: Conserver les pronoms féminins « elle » et « ses »
  alternative: Employer une tournure impersonnelle
  rationale: Le grec personnifie la vérité au féminin dans le contexte ; le français permet de préserver naturellement cet effet littéraire sans lui imposer une interprétation doctrinale.
- issue: Portée de ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: Exprimer la séparation d’avec toute injustice et toute méchanceté
  alternative: Comprendre « contre tous les hommes injustes et mauvais » ou « plutôt que tout ce qui est injuste et mauvais »
  rationale: La syntaxe est resserrée et admet plusieurs analyses. La traduction principale conserve la valeur séparative de ἀπό, tandis que la note signale l’autre lecture possible sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Auprès d’elle » conserve la tournure relationnelle du grec, tandis que « fait au contraire » explicite sobrement le contraste. La personnification féminine de la vérité est maintenue.
