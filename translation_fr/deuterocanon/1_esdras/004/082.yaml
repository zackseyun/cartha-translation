  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: fr
  text: Tu es béni, toi qui m’as donné la sagesse ; et je te rends grâce[a], Maître des pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te reconnais » ou « je te célèbre ». Le verbe grec peut exprimer une reconnaissance déclarée, une confession ou une louange ; ici, le contexte d’une bénédiction adressée à Dieu conduit à traduire « je te rends grâce ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: Tu es béni
  rationale: Cette formulation conserve l’adjectif prédicatif et la copule explicite de l’adresse doxologique grecque, tout en restant naturelle en français biblique moderne.
- source_word: ἔδωκάς μοι σοφίαν
  choice: tu m’as donné la sagesse
  rationale: Le passé composé exprime un don accompli dont l’effet demeure présent ; « sagesse » est l’équivalent direct et usuel de σοφία.
- source_word: σοὶ ὁμολογῶ
  choice: je te rends grâce
  rationale: Dans cette prière de bénédiction, ὁμολογῶ exprime une reconnaissance ouverte adressée à Dieu. « Je te rends grâce » en communique naturellement la portée cultuelle sans suggérer un aveu de faute.
- source_word: δέσποτα
  choice: Maître
  rationale: « Maître » préserve la nuance d’autorité absolue propre à δεσπότης et évite de confondre ce titre avec κύριος, habituellement rendu par « Seigneur ».
- source_word: τῶν πατέρων
  choice: des pères
  rationale: Le grec ne comporte aucun possessif explicite. Cette traduction conserve donc l’ambiguïté au lieu d’ajouter « nos » et maintient le lien formel avec πατέρων.
theological_decisions:
- issue: Titre divin δέσποτα
  choice: Maître
  alternative: Seigneur ; Souverain
  rationale: « Maître » maintient la distinction lexicale avec κύριος ainsi que l’idée d’autorité souveraine, sans introduire les associations particulières de « Seigneur ».
- issue: Sens de ὁμολογῶ dans la prière
  choice: je te rends grâce
  alternative: je te reconnais ; je te célèbre ; je te confesse
  rationale: Le contexte est celui d’une bénédiction prononcée après le don de la sagesse. La traduction retenue exprime cette reconnaissance cultuelle, tandis qu’une note conserve l’étendue sémantique du verbe grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de l’adresse directe est conservée, avec un point-virgule pour rendre clairement les deux propositions. « Des pères », bien que légèrement solennel, évite d’ajouter au grec le possessif « nos ».
