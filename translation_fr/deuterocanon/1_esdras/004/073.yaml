lexical_decisions:
- source_word: οἰκοδομή
  choice: construction
  rationale: Dans l’expression εἰς τὴν οἰκοδομήν, « construction » désigne naturellement en français le projet auquel les fonds sont affectés.
- source_word: ἱερόν
  choice: Temple
  rationale: ἱερόν désigne ici le Temple comme édifice ou ensemble sacré. « Temple » est le terme courant et clair dans ce contexte de reconstruction.
- source_word: δοθῆναι
  choice: soient donnés
  rationale: L’infinitif aoriste passif s’inscrit dans la formulation d’une décision administrative implicite ; le subjonctif passif français en restitue naturellement la portée.
- source_word: κατ’ ἐνιαυτόν
  choice: chaque année
  rationale: Cette expression distributive indique un versement annuel récurrent.
- source_word: τάλαντα εἴκοσι
  choice: vingt talents
  rationale: Le talent est une ancienne unité de poids servant aussi à exprimer une valeur monétaire ; conserver le terme traditionnel évite une conversion spéculative.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: jusqu’à ce qu’il soit construit
  rationale: La construction avec μέχρι marque la durée jusqu’à l’achèvement ; le pronom renvoie naturellement au Temple sans expliciter davantage que le grec.
