  text: and for the building of the temple[a], that twenty talents be given each year until it is built[b];
translation:
  language: fr
  text: et que, pour la construction du Temple, vingt talents[a] soient donnés chaque année jusqu’à ce qu’il soit construit ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
