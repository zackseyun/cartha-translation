  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: fr
  text: Toute la terre invoque la vérité, et le ciel la bénit. Toutes les œuvres sont ébranlées et tremblent, et avec elle il n’y a rien d’injuste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici un pronom de forme masculine ou neutre (« avec lui » ou « avec cela »), après les formes féminines qui désignent la vérité. Le contexte renvoie très probablement encore à la vérité.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: Toute la terre
  rationale: Associé au « ciel », γῆ désigne ici la terre dans son ensemble plutôt qu’un territoire particulier.
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: invoque la vérité
  rationale: Avec l’accusatif, καλεῖ peut exprimer l’appel ou l’invocation. Le grec ne contient aucun terme signifiant « bienheureuse » ou « bénie » ; « appelle la vérité bénie » ajouterait donc un complément absent du texte source.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: le ciel la bénit
  rationale: Le pronom féminin renvoie directement à ἀλήθεια, nom féminin, et entretient la personnification poétique de la vérité.
- source_word: πάντα τὰ ἔργα
  choice: toutes les œuvres
  rationale: « Œuvres » conserve le sens large de ἔργα et son caractère cosmique, sans expliciter de façon certaine qu’il s’agit des choses créées.
- source_word: σείεται καὶ τρέμει
  choice: sont ébranlées et tremblent
  rationale: Le premier verbe est rendu avec sa valeur médio-passive, tandis que le second exprime le tremblement ; le français exige ici l’accord au pluriel avec « toutes les œuvres ».
- source_word: μετʼ αὐτοῦ
  choice: auprès d’elle
  rationale: La préposition μετά avec le génitif indique l’association ou la proximité. Le référent contextuel le plus naturel est la vérité, personnifiée au féminin en français, malgré la forme masculine ou neutre du pronom grec transmis.
- source_word: ἄδικον οὐθέν
  choice: rien d’injuste
  rationale: Cette formulation garde la valeur adjectivale littérale et le contraste moral du grec sans lui imposer un vocabulaire doctrinal plus chargé.
theological_decisions:
- issue: Personnification de la vérité
  choice: Conserver les pronoms féminins « la » et « elle »
  alternative: Employer des tournures dépersonnalisées comme « cela » ou répéter « la vérité »
  rationale: Le grec reprend ἀλήθεια par un pronom féminin dans la deuxième proposition. Le français permet de conserver naturellement cette personnification sans affirmer que la Vérité constitue une personne distincte.
- issue: Référent de μετʼ αὐτοῦ
  choice: Comprendre le pronom comme renvoyant contextuellement à la vérité, tout en signalant sa discordance grammaticale
  alternative: Traduire littéralement « auprès de lui » ou « avec lui », en laissant le référent indéterminé
  rationale: Le contexte immédiat porte entièrement sur la vérité et ne fournit aucun antécédent masculin clair. Cependant, la forme grecque transmise reste masculine ou neutre ; la note préserve cette difficulté au lieu de la masquer.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La ponctuation en deux phrases clarifie le mouvement poétique. « Invoque » suit directement le grec transmis et évite d’ajouter l’idée de « déclarer bénie », absente de la formulation source.
