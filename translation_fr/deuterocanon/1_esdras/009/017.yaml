  naturalness: Le français est naturel et de registre approprié. « Au plus tard à la nouvelle lune » rend plus clairement la valeur de terme de ἕως, sans alourdir la phrase.
  terminology: « Femmes étrangères » est une traduction claire et neutre de γυναῖκας ἀλλογενεῖς dans ce contexte. « Affaire » et « menée à son terme » conviennent au cadre d’examen administratif. La note doit éviter de présenter le parallèle hébreu comme supprimant toute difficulté du grec.
