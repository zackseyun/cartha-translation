base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: fr
  text: L’affaire concernant les hommes qui avaient pris des femmes étrangères fut menée à son terme au plus tard à la nouvelle lune du premier mois[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec est difficile : le participe signifie plus littéralement « les hommes qui avaient été rassemblés », et sa construction avec la suite de la phrase est problématique. Le parallèle hébreu soutient le sens contextuel « les hommes qui avaient pris des femmes étrangères », retenu dans le texte.'
    reason: alternative_reading
  - marker: b
    text: La « nouvelle lune du premier mois » désigne le premier jour du premier mois dans le calendrier lunaire.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: fut menée à son terme
  rationale: Cette tournure conserve la valeur passive de l’expression grecque et exprime clairement l’achèvement de l’affaire.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: l’affaire concernant les hommes
  rationale: Le neutre pluriel avec κατά désigne idiomatiquement ce qui concerne ces hommes, ici dans le cadre d’un examen officiel; le singulier collectif « l’affaire » est naturel en français.
- source_word: τοὺς ἐπισυναχθέντας
  choice: qui avaient pris
  rationale: Le grec transmis signifie normalement « qui avaient été rassemblés », formulation difficile dans ce contexte. Le parallèle hébreu et l’objet « des femmes étrangères » soutiennent le sens contextuel « qui avaient pris », tout en signalant la difficulté en note.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: des femmes étrangères
  rationale: ἀλλογενής désigne une personne appartenant à un autre peuple. « Femmes étrangères » est clair, digne et correspond au parallèle hébreu נָשִׁים נָכְרִיּוֹת.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: à la nouvelle lune du premier mois
  rationale: νουμηνία désigne la nouvelle lune, qui marque le premier jour du mois. Avec l’idée d’achèvement, « à » indique naturellement le terme temporel sans remplacer l’image calendaire grecque.
