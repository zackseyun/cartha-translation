  source_fidelity: 'Le sens général suit fidèlement le grec : l’ellipse temporelle, la gravité du péché, le rôle des dirigeants, les femmes « d’un autre peuple » et la comparution à un temps fixé sont bien rendus. « Prennent position », toutefois, évoque en français moderne l’adoption d’un avis plutôt que le fait de se tenir en fonction ou de se présenter dans un cadre administratif. La formulation finale « qui leur aura été fixé » précise indûment une attribution individuelle et future que le grec condensé ne permet pas d’affirmer.'
  naturalness: Le français est globalement naturel et adapté à un registre biblique moderne. « Se tiennent en place » rend plus idiomatiquement la fonction administrative des chefs sans suggérer une prise de position idéologique. « À un moment fixé » est fluide et conserve la réserve imposée par la syntaxe grecque difficile.
  terminology: « Chefs de la communauté », « localités », « femmes étrangères » et « péché » conviennent au grec et au français international moderne. « Femmes étrangères » garde le libellé du texte sans ajouter d’explication ethnique ou doctrinale.
