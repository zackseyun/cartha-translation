base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/012.yaml
  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
translation:
  language: fr
  text: pas même en deux jours[a], car nous avons gravement péché dans ces affaires. Que les chefs de la communauté se tiennent en place, et que tous ceux de nos localités[b] qui ont des femmes étrangères viennent à un moment fixé[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas même deux » ; le contexte indique qu’il est question de deux jours.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « villes ». Le mot grec désigne ici les lieux ou communautés où le peuple habitait.'
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie une formule condensée, littéralement proche de « ayant pris/reçu du temps ». Le sens contextuel est vraisemblablement celui d’une venue à un moment fixé.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  choice: pas même en deux jours
  rationale: L’expression grecque est elliptique et se rattache au contexte temporel précédent. Cette formulation restitue le sens sans masquer la tournure condensée.
- source_word: ἐπὶ πλεῖον ἡμάρτομεν
  choice: nous avons gravement péché
  rationale: Avec le verbe « pécher », ἐπὶ πλεῖον indique ici l’ampleur ou la gravité de la faute.
- source_word: ἐν τούτοις
  choice: dans ces affaires
  rationale: Le démonstratif renvoie aux unions avec des femmes étrangères dont traite le passage.
- source_word: στήτωσαν
  choice: prennent position
  rationale: Le verbe signifie littéralement « qu’ils se tiennent debout ». Dans ce cadre administratif, « prendre position » conserve l’image d’une présence officielle sans imposer le sens plus précis d’une nomination.
- source_word: οἱ προηγούμενοι τοῦ πλήθους
  choice: les chefs de la communauté
  rationale: προηγούμενοι désigne ceux qui dirigent ou marchent en tête, et πλήθος le corps collectif du peuple réuni. « Communauté » est plus naturel ici que « multitude » en français moderne.
- source_word: οἱ ἐκ τῶν κατοικιῶν ἡμῶν
  choice: ceux de nos localités
  rationale: κατοικίαι désigne ici les lieux habités ou communautés de résidence, non les maisons individuelles.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: des femmes étrangères
  rationale: ἀλλογενής signifie « appartenant à un autre peuple ». Le contexte établit qu’il s’agit de leurs épouses, mais « femmes étrangères » reste proche de la formulation grecque.
- source_word: παραγενηθήτωσαν
  choice: viennent
  rationale: Le verbe signifie venir ou se présenter. « Viennent » est simple et naturel, tandis que le contexte indique la comparution administrative.
- source_word: λαβόντες χρόνου
  choice: au moment qui leur aura été fixé
  rationale: La formule grecque, littéralement proche de « ayant reçu du temps », est comprimée. Elle indique vraisemblablement qu’un temps déterminé est attribué à chacun.
theological_decisions:
- issue: Caractérisation morale de la faute
  choice: nous avons gravement péché dans ces affaires
  alternative: nous avons commis beaucoup de tort dans ces affaires
  rationale: ἡμάρτομεν exprime explicitement le péché et non une simple irrégularité administrative. La traduction maintient cette portée morale et religieuse sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le fragment commence et se termine au milieu d’une phrase, comme la délimitation fournie. Les termes administratifs restent naturels sans effacer les ellipses du grec.
