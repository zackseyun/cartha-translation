base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/009.yaml
  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: fr
  text: Accomplissez sa volonté[a] et séparez-vous des nations du pays et des étrangers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu d’Esdras 10 mentionne plus précisément des femmes étrangères ; ici, 1 Esdras emploie le terme plus général « étrangers ».
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: Faites
  rationale: L’impératif aoriste appelle une action résolue. « Faites » est direct, naturel et convient à la construction avec « sa volonté ».
- source_word: τὸ θέλημα αὐτοῦ
  choice: sa volonté
  rationale: Rend fidèlement l’expression grecque courante et conserve sa portée théologique sans la développer.
- source_word: χωρίσθητε
  choice: séparez-vous
  rationale: 'La forme moyenne/passive a ici une valeur exhortative réfléchie : les destinataires doivent prendre leurs distances.'
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: des nations du pays
  rationale: « Nations » préserve le sens large de ἔθνη sans introduire le vocabulaire plus tardif de « païens »; dans ce contexte, γῆ désigne le territoire local, d’où « pays ».
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: des étrangers
  rationale: Le grec désigne largement les personnes d’origine étrangère et ne précise pas ici qu’il s’agit de femmes; « étrangers » maintient cette portée.
theological_decisions:
- issue: Rapport entre le texte grec général et le parallèle hébreu d’Esdras 10, centré sur les femmes étrangères
  choice: 'Conserver dans le texte la formulation large du grec : « des nations du pays et des étrangers ».'
  alternative: « des peuples du pays et des femmes étrangères »
  rationale: Le grec de 1 Esdras est le témoin principal et ne limite pas explicitement le commandement aux femmes ou aux épouses. La note signale toutefois la précision apportée par le parallèle hébreu, sans l’introduire dans le texte grec.
translation_notes:
  register: Français moderne, direct et digne. La coordination et les impératifs suivent étroitement le grec tout en restant naturels. « Pays » est préféré à « terre » pour indiquer le territoire concerné; la répétition de « des » conserve les deux groupes distingués dans la source.
