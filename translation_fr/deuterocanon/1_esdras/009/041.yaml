base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: fr
  text: Il lisait dans le vaste espace devant le portail du Temple[a], depuis l’aube jusqu’à midi, en présence des hommes et des femmes. Tous prêtèrent toute leur attention à la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la place dégagée devant le portail du Temple ». Le grec décrit un endroit large ou spacieux sans en préciser davantage la configuration.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils donnèrent tout leur esprit à la loi », c’est-à-dire qu’ils lui prêtèrent une attention entière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: Il lisait
  rationale: L’imparfait grec présente une action qui se prolonge pendant toute la période indiquée. Le contexte public laisse entendre une lecture audible, sans qu’il soit nécessaire d’ajouter explicitement « à haute voix ».
- source_word: ἐν τῷ πρὸ τοῦ ἱεροῦ πυλῶνος εὐρυχώρῳ
  choice: dans le vaste espace devant le portail du Temple
  rationale: εὐρύχωρος désigne ici un lieu large ou spacieux. « Vaste espace » reste proche du grec sans préciser indûment qu’il s’agissait d’une place ou d’une cour. πρὸ avec le génitif situe cet espace devant le portail lié au Temple.
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: depuis l’aube jusqu’à midi
  rationale: Cette formulation rend directement les deux limites temporelles et s’accorde naturellement avec la valeur durative de l’imparfait.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: en présence des hommes et des femmes
  rationale: La traduction conserve la mention explicite des deux groupes et rend naturellement le sens spatial et public de ἐνώπιον.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  choice: Tous accordaient toute leur attention
  rationale: L’expression signifie littéralement qu’ils donnaient tout leur esprit à la loi. La formulation française exprime clairement leur attention entière. L’imparfait français harmonise l’attention continue de l’auditoire avec la lecture prolongée, bien que le grec emploie ici l’aoriste.
- source_word: εἰς τὸν νόμον
  choice: à la loi
  rationale: Le grec dit simplement « la loi », sans ajouter « livre » ni employer un titre formel. La minuscule évite de surinterpréter tout en laissant le contexte identifier la loi sacrée qui était lue.
theological_decisions:
- issue: Statut de νόμος comme titre de la Torah
  choice: la loi
  alternative: la Loi
  rationale: Le contexte peut viser la Torah mosaïque, mais le grec ne marque pas explicitement un titre. La minuscule préserve cette sobriété lexicale.
- issue: Désignation sexuée de l’auditoire
  choice: les hommes et les femmes
  alternative: la foule / tout le peuple
  rationale: Le texte grec nomme expressément les hommes et les femmes. Les conserver évite de généraliser ou de neutraliser ce détail.
translation_notes:
  register: Français international moderne, clair et digne. « Portail » distingue naturellement πυλών d’une simple porte, tandis que « Temple » explicite le cadre cultuel de ἱερός sans introduire un nom propre absent du grec. Les deux phrases allègent une longue coordination grecque tout en maintenant la progression entre la lecture et l’attention de l’auditoire.
