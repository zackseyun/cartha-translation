base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: fr
  text: 'Toute l’assemblée s’écria : « Amen, amen ! » Ils levèrent les mains, tombèrent à terre et adorèrent Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: s’écria
  rationale: Le verbe exprime ici une réponse collective prononcée à haute voix et avec force; « s’écria » rend cette acclamation publique sans ajouter explicitement l’idée d’un hurlement.
- source_word: πᾶν τὸ πλῆθος
  choice: Toute l’assemblée
  rationale: Dans ce cadre liturgique, « assemblée » désigne naturellement l’ensemble du peuple réuni et évite la connotation parfois désordonnée de « foule ».
- source_word: Ἀμήν, ἀμήν
  choice: Amen, amen !
  rationale: La forme liturgique traditionnelle convient à une réponse communautaire; la répétition du grec est conservée.
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: ils levèrent les mains
  rationale: Cette formulation française naturelle exprime le geste dirigé vers le haut; l’orientation est déjà inhérente au verbe « lever ».
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: tombèrent face contre terre
  rationale: L’expression rend clairement la prosternation corporelle jusqu’au sol dans ce contexte d’adoration, sans la réduire à une simple inclinaison.
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Puisque l’acte est adressé à Dieu et que la posture vient d’être décrite séparément, « adorèrent » conserve pleinement la portée religieuse du verbe.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif désigne le destinataire de l’adoration; en français, « adorer Dieu » est la tournure directe et naturelle.
theological_decisions:
- issue: Rapport entre la prosternation et προσκυνέω
  choice: Décrire d’abord la posture par « tombèrent face contre terre », puis rendre προσκυνέω par « adorèrent Dieu ».
  alternative: « se prosternèrent devant Dieu »
  rationale: Le grec présente à la fois le mouvement corporel et l’acte religieux. Les distinguer évite d’effacer soit la posture, soit la portée théologique de l’adoration.
- issue: Rapport entre le témoin grec et le parallèle massorétique fourni
  choice: Suivre exclusivement la scène liturgique attestée par le grec pour le texte principal.
  alternative: Introduire des éléments du parallèle hébreu approximatif.
  rationale: Le parallèle hébreu fourni ne correspond pas au contenu immédiat du verset grec. Le grec, complet et de haute confiance, demeure donc l’ancrage de la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La ponctuation met en relief l’acclamation collective et la succession des gestes.
