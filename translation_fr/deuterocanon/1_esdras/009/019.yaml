base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: fr
  text: 'Parmi les fils de Josué, fils de Josédec, et ses frères : Maélas[a], Éléazar, Joribos et Joadanos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec donne ici les noms Maélas, Joribos et Joadanos. Dans le parallèle hébreu approximatif d’Esdras 10.18, 20-21, les noms correspondants diffèrent, ce qui reflète le rapport assez libre entre 1 Esdras et le texte massorétique dans ces listes.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: La préposition ἐκ introduit ici certains membres d’un groupe dans le cadre d’une liste. « Parmi les fils de » exprime naturellement cette valeur partitive en français.
- source_word: Ἰησοῦ
  choice: Josué
  rationale: Dans le contexte d’Esdras, Ἰησοῦ représente le nom du grand prêtre postexilique appelé Josué en français biblique, plutôt que Jésus.
- source_word: τοῦ Ἰωσεδὲκ
  choice: fils de Josédec
  rationale: Le génitif indique ici la filiation. « Josédec » est une forme française biblique reconnaissable du nom transmis en grec.
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: et parmi ses frères
  rationale: Le singulier αὐτοῦ renvoie le plus naturellement à Josué. La répétition de « parmi » rend explicite en français que ἐκ régit aussi ce second groupe, sans modifier le sens.
- source_word: Μαεήλας
  choice: Maélas
  rationale: Le nom est translittéré d’après le texte grec de Swete plutôt qu’harmonisé avec la liste hébraïque parallèle.
- source_word: Ἐλεάζαρος
  choice: Éléazar
  rationale: Il s’agit de la forme française biblique usuelle de ce nom.
- source_word: Ἰώριβος
  choice: Joribos
  rationale: Cette translittération conserve la forme propre au témoin grec, sans la remplacer par le nom différent de la liste hébraïque parallèle.
- source_word: Ἰωάδανος
  choice: Joadanos
  rationale: La forme grecque est conservée par translittération, car le parallèle hébraïque est approximatif et ne doit pas gouverner le texte principal.
