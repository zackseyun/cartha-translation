revisions:
- from: 'Alors Attaratès[a] dit à Esdras, le grand prêtre et lecteur[b], ainsi qu’aux lévites qui enseignaient la foule — à tous :'
  to: 'Et Attaratès[a] dit à Esdras, le grand prêtre et lecteur[b], ainsi qu’aux lévites qui enseignaient la foule, à tous :'
  rationale: La révision remplace « Alors » par « Et » afin de refléter sans ajout le καί grec. Elle remplace le tiret par une virgule devant la finale ambiguë « à tous », tout en maintenant cette finale telle qu’elle se présente dans le grec et sans l’harmoniser avec le parallèle hébreu. Les notes sont conservées, avec une correction typographique mineure de l’espace avant le point-virgule.
