base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: fr
  text: 'Et Attaratès[a] dit à Esdras, le grand prêtre et lecteur[b], ainsi qu’aux lévites qui enseignaient la foule, à tous :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage hébreu parallèle, ce personnage est appelé « Néhémie, le Tirshatha », c’est-à-dire le gouverneur.
    reason: alternative_reading
  - marker: b
    text: Le grec porte « lecteur » ; le passage hébreu parallèle désigne Esdras comme « le prêtre et scribe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: Alors … dit
  rationale: Rend naturellement l’enchaînement narratif marqué par καί, sans lui attribuer une valeur chronologique trop précise.
- source_word: Ἀτταρατὴ
  choice: Attaratès
  rationale: Conserve sous forme translittérée le nom ou titre transmis par le texte grec, sans le remplacer par l’identification différente du parallèle hébreu.
- source_word: Ἔσρᾳ
  choice: Esdras
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec Ἔσρας.
- source_word: τῷ ἀρχιερεῖ
  choice: le grand prêtre
  rationale: Équivalent français courant et précis de ἀρχιερεύς dans ce contexte.
- source_word: καὶ ἀναγνώστῃ
  choice: et lecteur
  rationale: Traduit directement ἀναγνώστης et préserve la désignation grecque, qui diffère légèrement de celle du parallèle hébreu.
- source_word: τοῖς Λευείταις τοῖς διδάσκουσι τὸ πλῆθος
  choice: aux lévites qui enseignaient la foule
  rationale: Le participe présent décrit leur activité en cours; « la foule » rend naturellement πλῆθος comme désignation du grand rassemblement.
- source_word: ἐπὶ πάντας
  choice: à tous
  rationale: La tournure grecque est abrupte et quelque peu ambiguë. « À tous » conserve cette portée générale et convient à l’introduction du discours, sans préciser indûment s’il s’agit de tous les responsables nommés ou de tout le peuple.
theological_decisions:
- issue: Identification d’Ἀτταρατὴ par rapport au parallèle massorétique
  choice: Maintenir « Attaratès » dans le texte et signaler en note l’identification du parallèle hébreu.
  alternative: Remplacer dans le texte par « Néhémie, le gouverneur » ou par « le Tirshatha ».
  rationale: Le grec est le témoin principal de 1 Esdras et donne ici Ἀτταρατὴ, non Νεεμίας. La note permet de faire connaître le parallèle sans harmoniser silencieusement les traditions.
- issue: Désignation d’Esdras
  choice: Traduire le grec par « le grand prêtre et lecteur ».
  alternative: Suivre le parallèle hébreu avec « le prêtre et scribe ».
  rationale: Les deux traditions présentent une légère différence. Le texte principal doit refléter fidèlement le grec tout en conservant l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Grand prêtre » et « lévites » suivent l’usage biblique français courant. Le tiret détache l’expression finale abrupte ἐπὶ πάντας tout en laissant le deux-points ouvrir naturellement le discours qui suit.
