base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: fr
  text: 'Et parmi les fils de Baanéi : Jérémias[a], Momdéios, Maéros, Iouna, Mamdaï, Pédias, Anos, Carabasion, Énaséibos, Mamntanaïmos, Éliaséis, Bannous, Édialéis, Soméis, Sélémias et Nathanias. Parmi les fils d’Exora : Séséis, Ezréil, Azaélos, Samatos, Zambréi[b] et Phosépos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset sont translittérés au plus près du texte grec au lieu d’être harmonisés avec des formes hébraïques plus familières de la tradition parallèle, car le grec de 1 Esdras constitue ici la source principale.
    reason: lexical_alternative
  - marker: b
    text: Le parallèle du texte massorétique dans le contexte d’Esdras 10 est approximatif et ne conserve pas cette suite complète de noms sous les mêmes formes ; la présente liste suit donc le texte grec.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: Cette formulation française naturelle conserve la structure généalogique de la liste et indique que les personnes nommées appartiennent au groupe introduit.
- source_word: Βαανεί
  choice: Baanéi
  rationale: Translittération directe du témoin grec, avec accent graphique facilitant la prononciation française; la forme n’est pas harmonisée avec une forme hébraïque plus familière.
- source_word: Ἰερεμίας
  choice: Jérémias
  rationale: La forme grecque est conservée sous une graphie française traditionnelle plutôt que remplacée par Jérémie.
- source_word: Μομδείοσ
  choice: Momdéios
  rationale: Translittération proche de la graphie grecque difficile, sans normalisation conjecturale.
- source_word: Μάηρος
  choice: Maéros
  rationale: Translittération transparente de la forme grecque, adaptée à la lecture française.
- source_word: Ἰουνά
  choice: Jouna
  rationale: Le J rend naturellement en français la consonne initiale de cette forme de nom, tout en restant proche du grec.
- source_word: Πεδίας
  choice: Pédias
  rationale: La forme grecque est maintenue plutôt que d’être harmonisée avec un éventuel équivalent hébreu tel que Pedaya.
- source_word: Καραβασιὼν
  choice: Carabasion
  rationale: Translittération adaptée aux conventions graphiques françaises, avec c initial.
- source_word: Ἐνάσειβος
  choice: Énaséibos
  rationale: Ce nom obscur est conservé au plus près du grec plutôt que corrigé ou identifié sans preuve.
- source_word: Μαμντάναιμος
  choice: Mamntanaïmos
  rationale: La forme inhabituelle du témoin grec est préservée, avec tréma pour guider la lecture française.
- source_word: καὶ ἐκ τῶν υἱῶν Ἐξορά
  choice: Parmi les fils d’Exora
  rationale: La répétition grecque est rendue par une nouvelle phrase afin de clarifier la division entre les deux familles sans perdre la structure de la liste.
