base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: fr
  text: Allez donc manger des mets riches[a] et envoyez des portions à ceux qui n’ont rien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des choses grasses ». L’expression désigne des aliments riches ou de choix servis pour une célébration.'
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle hébreu de Néhémie 8.10 dit plus précisément : « à celui pour qui rien n’a été préparé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: Allez
  rationale: Le participe aoriste, littéralement « étant allés », introduit ici l’action exhortée et se rend naturellement par un impératif en français.
- source_word: οὖν
  choice: donc
  rationale: Ce connecteur marque la conséquence ou la poursuite de l’exhortation précédente; « donc » en conserve clairement la valeur.
- source_word: φάγετε
  choice: manger
  rationale: L’infinitif dépend de l’impératif idiomatique « Allez » et transmet l’impératif grec pluriel sans lourdeur.
- source_word: λιπάσματα
  choice: des mets riches
  rationale: Le terme désigne littéralement des choses grasses, c’est-à-dire des aliments riches ou de choix servis dans un contexte festif. « Mets riches » est naturel et digne en français moderne.
- source_word: ἀποστείλατε
  choice: envoyez
  rationale: Équivalent direct et courant de l’impératif grec.
- source_word: ἀποστολάς
  choice: des portions
  rationale: Dans ce contexte festif, il s’agit de parts envoyées à d’autres; le parallèle hébreu מָנוֹת confirme ce sens.
- source_word: τοῖς μὴ ἔχουσιν
  choice: à ceux qui n’ont rien
  rationale: Cette formulation suit la concision du grec, littéralement « à ceux qui n’ont pas », sans ajouter dans le texte principal le complément plus précis du parallèle hébreu.
theological_decisions:
- issue: Portée sociale de l’envoi des portions
  choice: Comprendre l’ordre comme le partage de nourriture festive avec ceux qui n’en ont pas.
  alternative: Comprendre plus généralement qu’il faut envoyer des biens non précisés à ceux qui manquent de quelque chose.
  rationale: Le grec parle de « portions » envoyées à « ceux qui n’ont pas »; le parallèle hébreu précise qu’il s’agit de personnes pour lesquelles rien n’a été préparé. La traduction garde la formulation plus concise du témoin grec tout en laissant la note signaler la précision hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Allez donc manger » rend naturellement la séquence grecque participe + impératif, tandis que les notes préservent la nuance littérale de λιπάσματα et la différence entre le grec concis et le parallèle hébreu plus explicite.
