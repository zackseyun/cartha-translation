base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: fr
  text: Tous s’en allèrent manger, boire et se réjouir, envoyer des portions à ceux qui n’avaient rien[a], et se réjouir beaucoup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui n’avaient aucune portion »; le grec ne précise pas ce qui leur manquait. Le parallèle hébreu mentionne l’envoi de portions de nourriture.
    reason: Alternative lexicale éclairée par le parallèle hébreu.
lexical_decisions:
- source_word: ᾤχοντο
  choice: s’en allèrent
  rationale: Le verbe οἴχομαι exprime ici le départ de l’assemblée; « s’en allèrent » est naturel et conserve cette nuance.
- source_word: φαγεῖν καὶ πιεῖν
  choice: manger, boire
  rationale: Cette formulation directe reproduit la paire d’infinitifs grecs dans un français idiomatique.
- source_word: εὐφραίνεσθαι
  choice: se réjouir
  rationale: Le verbe désigne la joie, notamment dans un cadre festif, sans qu’il soit nécessaire de préciser davantage.
- source_word: δοῦναι ἀποστολὰς
  choice: envoyer des portions
  rationale: Dans ce contexte de repas festif, et à la lumière du parallèle hébreu מָנוֹת, ἀποστολάς désigne des parts de nourriture envoyées à d’autres.
- source_word: τοῖς μὴ ἔχουσιν
  choice: à ceux qui n’avaient rien
  rationale: Le grec signifie littéralement « à ceux qui n’ont pas », sans exprimer l’objet; cette traduction préserve cette concision, tandis que la note indique la précision suggérée par le parallèle hébreu.
- source_word: εὐφρανθῆναι μεγάλως
  choice: se réjouir beaucoup
  rationale: Cette tournure rend l’intensification exprimée par μεγάλως tout en conservant la répétition rhétorique du verbe de joie.
theological_decisions:
- issue: Précision de l’objet sous-entendu dans τοῖς μὴ ἔχουσιν
  choice: ceux qui n’avaient rien
  alternative: ceux qui n’avaient aucune portion préparée
  rationale: Le grec laisse l’objet indéterminé, tandis que le parallèle hébreu indique qu’il s’agit de portions destinées au repas. Le texte principal conserve l’ouverture du grec et la note fournit la lecture contextuelle.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « se réjouir » est maintenue afin de refléter la plénitude rhétorique du grec.
