base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: fr
  text: 'Parmi les fils de Mani[a] : Olamos, Mamouchos, Iédaios, Iasoubos, Asaël[b] et Iérémoth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Mani » ; dans la liste hébraïque parallèle d’Esdras, ce nom est généralement rapproché de « Bani ».
    reason: alternative_reading
  - marker: b
    text: Plusieurs noms de cette série correspondent probablement à des formes hébraïques connues par la liste parallèle, mais la traduction suit ici les formes grecques de 1 Esdras, qui constitue le texte source principal.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: Dans la continuité d’une liste, le καί grec est naturellement absorbé en français. « Parmi les fils de » exprime clairement l’appartenance au groupe familial sans lourdeur.
- source_word: Μανί
  choice: Mani
  rationale: Translittération directe de la leçon grecque de Swete, sans harmonisation avec le nom Bani du parallèle hébreu.
- source_word: Ὤλαμος
  choice: Olamos
  rationale: Translittération française de la forme grecque, avec suppression de l’esprit initial et maintien de la terminaison nominale.
- source_word: Μάμουχος
  choice: Mamouchos
  rationale: Translittération de la forme grecque selon les conventions françaises, où χ est rendu par « ch ».
- source_word: Ἰεδαῖος
  choice: Iédaios
  rationale: Translittération lisible de la forme grecque, non remplacée par une identification conjecturale issue de la liste hébraïque.
- source_word: Ἰάσουβος
  choice: Iasoubos
  rationale: Translittération de la forme grecque; « ou » rend naturellement ου en français.
- source_word: Ἀσάηλος
  choice: Asaël
  rationale: Forme française claire qui conserve les voyelles distinctes du nom grec tout en retranchant la terminaison nominative grecque.
- source_word: Ἰερεμώθ
  choice: Iérémoth
  rationale: Translittération française directe de la forme grecque.
