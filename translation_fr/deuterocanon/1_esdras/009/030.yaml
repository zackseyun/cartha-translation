  register: Français moderne, digne et accessible. Les noms propres sont translittérés à partir du grec plutôt qu’harmonisés avec le texte massorétique. La coordination initiale καί est rendue implicitement afin d’éviter un « Et parmi » peu naturel dans ce fragment de liste.
