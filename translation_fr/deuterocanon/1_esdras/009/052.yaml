base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: fr
  text: Car ce jour est saint pour le Seigneur[a]. Ne vous attristez pas, car le Seigneur vous glorifiera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu de Néhémie 8.10 présente ici une formulation différente, que l’on peut traduire approximativement : « car la joie du SEIGNEUR est votre force ». Le grec de 1 Esdras dit plutôt : « car le Seigneur vous glorifiera ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγία
  choice: saint
  rationale: L’adjectif exprime la consécration et la mise à part. « Saint » est le terme biblique courant et correspond aussi au parallèle hébreu קָדֹשׁ.
- source_word: ἡ ἡμέρα
  choice: ce jour
  rationale: Dans cette exhortation portant sur le jour présent, le démonstratif est plus naturel en français que « le jour », tout en rendant fidèlement le groupe nominal grec défini.
- source_word: τῷ κυρίῳ
  choice: pour le Seigneur
  rationale: 'Le datif indique ici la relation ou la consécration : ce jour est saint, consacré au Seigneur. « Pour le Seigneur » exprime naturellement cette relation en français.'
- source_word: μὴ λυπεῖσθε
  choice: Ne soyez pas dans la tristesse
  rationale: Le verbe désigne le fait d’éprouver de la peine, du chagrin ou de la détresse. Cette formulation conserve le poids émotionnel sans suggérer que les destinataires causent eux-mêmes leur affliction.
- source_word: δοξάσει
  choice: glorifiera
  rationale: Le verbe appartient explicitement au champ de la gloire et de l’honneur. Il convient de préserver la formulation grecque plutôt que de l’harmoniser avec le parallèle hébreu différent.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom est à la deuxième personne du pluriel ; le français « vous » en rend directement le nombre et la fonction d’objet.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte grec deutérocanonique
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est ici la désignation divine naturelle et traditionnelle ; rien dans le contexte ne favorise « Maître ».
- issue: Faut-il harmoniser la dernière proposition avec le parallèle massorétique de Néhémie ?
  choice: 'Traduire le grec tel qu’il est attesté : « le Seigneur vous glorifiera »'
  alternative: « La joie du SEIGNEUR est votre force » ou une formulation équivalente fondée sur Néhémie 8.10
  rationale: Pour 1 Esdras, le grec est le texte source principal. Comme son dernier membre diffère réellement du parallèle hébreu, il faut conserver cette différence dans le texte et la signaler en note plutôt que l’effacer.
translation_notes:
  register: Français moderne, clair et digne. Le rythme en deux phrases évite une accumulation lourde de propositions tout en maintenant les deux liens causaux du grec. La différence textuelle avec le parallèle hébreu est conservée sans harmonisation.
