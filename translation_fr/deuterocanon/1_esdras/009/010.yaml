base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: fr
  text: 'Alors toute l’assemblée[a] s’écria d’une voix forte : « Ainsi, comme tu l’as dit[b], nous ferons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la multitude » ou « toute la foule ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte : « Ainsi, comme tu l’as dit, nous ferons. »'
    reason: formal_equivalence
lexical_decisions:
- source_word: ἐφώνησαν
  choice: s’écria
  rationale: Le verbe exprime une prise de parole collective à voix élevée. Le singulier s’accorde naturellement en français avec le sujet collectif « toute l’assemblée ».
- source_word: πᾶν τὸ πλῆθος
  choice: toute l’assemblée
  rationale: Le grec signifie littéralement « toute la multitude ». Dans cette scène publique et organisée, « assemblée » rend naturellement le groupe réuni sans suggérer une foule désordonnée.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: d’une voix forte
  rationale: Expression française naturelle qui conserve explicitement l’idée du volume élevé de la voix collective.
- source_word: Οὕτως
  choice: comme tu l’as dit
  rationale: 'Οὕτως est ici associé à ὡς εἴρηκας et indique la conformité de l’action promise aux paroles prononcées : « de cette manière, comme tu l’as dit ».'
- source_word: ὡς εἴρηκας
  choice: comme tu l’as dit
  rationale: Le passé composé rend naturellement en français le parfait grec et laisse entendre que la parole prononcée demeure la norme de l’action à venir.
- source_word: ποιήσομεν
  choice: nous ferons
  rationale: Le futur exprime directement l’engagement collectif à agir.
theological_decisions:
- issue: Caractère public et collectif de la réponse
  choice: toute l’assemblée
  alternative: toute la multitude / toute la foule
  rationale: « Assemblée » convient au cadre communautaire formel sans ajouter de précision institutionnelle ou confessionnelle absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour être idiomatique, tout en conservant l’acclamation collective, la voix forte et l’engagement formulé au futur.
