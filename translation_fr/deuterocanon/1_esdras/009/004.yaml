base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: fr
  text: Et quiconque ne se présentera pas dans un délai de deux ou trois jours, conformément à la décision des anciens qui président, son bétail sera voué[a], et il sera lui-même exclu de la communauté des exilés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « confisqué ». Le verbe grec signifie littéralement « voué » ou « consacré », mais peut impliquer ici une confiscation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la multitude de la captivité » ; autre traduction possible : « de l’assemblée des déportés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: se présentera
  rationale: Dans le contexte d’une convocation, le verbe désigne le fait de venir en réponse à l’appel; « se présenter » rend naturellement cette portée officielle.
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: dans un délai de deux ou trois jours
  rationale: Cette formulation française exprime clairement la période accordée pour répondre à la convocation.
- source_word: κατὰ τὸ κρῖμα
  choice: conformément à la décision
  rationale: κρῖμα désigne ici une décision faisant autorité; « décision » convient au contexte administratif et judiciaire sans surcharger le terme.
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: des anciens qui président
  rationale: Cette expression conserve l’idée participiale de προκαθημένων et indique que ces anciens exercent la présidence.
- source_word: ἀνιερωθήσονται
  choice: verra … voué
  rationale: « Voué » préserve l’idée de mise à part ou de consécration portée par le grec, tout en laissant ouverte sa conséquence confiscatoire dans ce contexte.
- source_word: τὰ κτήνη αὐτῶν
  choice: son bétail
  rationale: κτήνη désigne normalement les animaux domestiques ou le bétail. Le passage du pluriel grec distributif au singulier français s’accorde naturellement avec « quiconque ».
- source_word: ἀλλοτριωθήσεται
  choice: sera exclu
  rationale: Appliqué au rapport entre une personne et la collectivité, le passif exprime sa mise à l’écart ou son retranchement.
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: de la communauté des exilés
  rationale: Cette traduction idiomatique rend πλῆθος comme le corps collectif et αἰχμαλωσία comme la population issue de l’exil, sans employer le calque obscur « assemblée de la captivité ».
theological_decisions:
- issue: Nature de la peine frappant les biens du contrevenant
  choice: Le bétail est dit « voué », avec une note signalant la portée probable de confiscation.
  alternative: Traduire directement « son bétail sera confisqué » ou, d’après le parallèle hébreu, « tous ses biens seront confisqués ».
  rationale: Le grec nomme précisément le bétail et emploie un verbe de consécration ou de dévolution. Le contexte juridique suggère une confiscation, mais traduire uniquement ainsi effacerait la nuance religieuse possible du terme grec.
- issue: Désignation du groupe dont le contrevenant est exclu
  choice: « la communauté des exilés »
  alternative: « l’assemblée de la captivité » ou « la multitude des déportés »
  rationale: Le syntagme grec désigne collectivement ceux qui appartiennent à la population de l’exil. La formulation retenue est naturelle en français et ne précise pas au-delà du texte s’il s’agit exclusivement des exilés revenus.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le ton officiel de la proclamation tout en évitant les calques opaques. Les deux marqueurs de note figurent dans le texte principal.
