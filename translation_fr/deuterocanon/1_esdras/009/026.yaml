base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: fr
  text: 'Parmi les Israélites[a], parmi les fils de Phoros : Ierma, Iézéias, Melchéias, Miélos, Éléazar, Asébéias et Bannaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset correspondent probablement à des formes hébraïques connues dans la liste parallèle d’Esdras 10, notamment Parosh pour Phoros et Benaya pour Bannaias. Comme la traduction de 1 Esdras suit ici le texte grec, les formes grecques sont conservées dans le texte principal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: Parmi les Israélites
  rationale: Dans cette formule de liste, ἐκ indique que les personnes nommées sont tirées d’un groupe plus vaste. Cette formulation est naturelle en français et évite de faire d’Israël un simple lieu d’origine.
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: parmi les fils de Phoros
  rationale: Le second ἐκ reprend la structure d’extraction, tandis que υἱοί conserve ici la formule généalogique traditionnelle « fils de », qui peut désigner les descendants ou le groupe familial.
- source_word: Φορός
  choice: Phoros
  rationale: La forme grecque Φορός est conservée plutôt que d’être remplacée par la forme hébraïque correspondante, Parosh, puisque le grec est le texte source principal.
- source_word: Ἰερμὰ
  choice: Ierma
  rationale: Translittération sobre de la forme grecque, sans normalisation conjecturale d’après la liste parallèle.
- source_word: Ἰεζείας
  choice: Iézéias
  rationale: Translittération adaptée aux conventions phonographiques françaises, avec accents facilitant la lecture.
- source_word: Μελχείας
  choice: Melchéias
  rationale: La forme grecque est conservée dans une graphie française lisible, plutôt que normalisée en un équivalent hébraïque.
- source_word: Μίηλος
  choice: Miélos
  rationale: Translittération conservatrice du nom grec rare.
- source_word: Ἐλεάζαρος
  choice: Éléazar
  rationale: La forme française traditionnelle et bien établie rend fidèlement le nom grec.
- source_word: Ἀσεβείας
  choice: Asébéias
  rationale: Translittération de la forme grecque sans substitution d’une identification sémitique incertaine.
- source_word: Βανναίας
  choice: Bannaias
  rationale: La forme du témoin grec est maintenue; « Benaya » refléterait davantage une normalisation d’après l’hébreu parallèle.
