base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: fr
  text: Quand on ouvrit la Loi[a], tous se tinrent debout, bien droits. Azarias[b] bénit le Dieu Très-Haut, Dieu des armées[c], le Tout-Puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « délia la Loi », expression qui désigne ici son ouverture ou son déploiement en vue de la lecture publique. On peut aussi comprendre : « quand on lut la Loi ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « Azarias »; le parallèle hébreu a « Azaria » (Azariah).
    reason: alternative_reading
  - marker: c
    text: Le grec transcrit ici le titre sémitique « Sabaoth », qui signifie « des armées ».
    reason: source_clarification
lexical_decisions:
- source_word: ἐν τῷ λῦσαι τὸν νόμον
  choice: Quand on ouvrit la Loi
  rationale: La construction à l’infinitif exprime le moment. λύω signifie littéralement « délier » et peut, dans le contexte d’un écrit destiné à la lecture publique, évoquer son ouverture ou son déploiement. Cette traduction conserve cette image sans faire de « lire » le sens lexical direct du verbe.
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: tous se tinrent debout, bien droits
  rationale: ἔστησαν indique qu’ils se tenaient debout, tandis que ὀρθοί précise leur posture droite. La formulation française préserve les deux éléments sans suggérer nécessairement qu’ils venaient de se lever.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Le verbe peut signifier bénir ou louer. « Bénit » reste proche du grec et convient à une bénédiction adressée à Dieu, malgré une tournure légèrement biblique en français.
- source_word: Ἀζαρίας
  choice: Azarias
  rationale: La forme française suit directement le nom grec Ἀζαρίας, qui constitue ici le témoin principal. La forme du parallèle hébreu est signalée en note.
- source_word: τῷ ὑψίστῳ θεῷ
  choice: le Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve le titre divin et la valeur superlative de ὑψίστῳ.
- source_word: σαβαὼθ
  choice: Dieu des armées
  rationale: Le terme grec transcrit un titre sémitique signifiant « des armées ». La traduction sémantique est plus intelligible que « Sabaoth » pour le lectorat moderne; la répétition de « Dieu » permet d’intégrer naturellement le titre en français sans introduire « Seigneur », absent du grec.
- source_word: Παντοκράτορι
  choice: le Tout-Puissant
  rationale: « Le Tout-Puissant » est le rendu français courant et précis de ce titre divin, qui présente Dieu comme souverain sur tout.
theological_decisions:
- issue: Enchaînement des titres divins τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι
  choice: le Dieu Très-Haut, Dieu des armées, le Tout-Puissant
  alternative: le Dieu Très-Haut, Sabaoth, le Tout-Puissant
  rationale: Le grec juxtapose plusieurs titres sans expliciter leur relation syntaxique. Le français conserve cette accumulation. « Dieu des armées » rend le sens de σαβαώθ sans ajouter « Seigneur », qui ne figure pas dans le texte grec, tandis que la note garde visible la forme grecque translittérée.
- issue: Sens de λῦσαι appliqué à la Loi
  choice: ouvrit la Loi
  alternative: lut la Loi
  rationale: Le contexte concerne manifestement la présentation publique de la Loi, mais le verbe grec signifie d’abord « délier, ouvrir ». Le texte principal conserve cette donnée concrète, et la note indique que l’ouverture est celle qui précède la lecture publique, sans réduire silencieusement l’expression à « lire ».
translation_notes:
  register: Français international moderne, clair et digne. La légère solennité de « bénit le Dieu Très-Haut » et de l’accumulation des titres reflète le registre liturgique du grec. « La Loi » est mise en majuscule pour indiquer qu’il s’agit ici de la Torah, sans ajouter « livre », absent de la formulation grecque.
