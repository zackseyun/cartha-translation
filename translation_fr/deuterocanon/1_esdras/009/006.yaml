base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: fr
  text: Toute l’assemblée prit place sur l’esplanade du Temple[a], tremblant à cause du mauvais temps qui sévissait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le vaste espace du Temple » ou « dans l’espace dégagé du sanctuaire ». Le grec désigne un lieu large ou ouvert, sans en préciser exactement la nature.
    reason: lexical_alternative
  - marker: b
    text: Ou « en tremblant à cause de la tempête qui sévissait » ou « en tremblant à cause de l’hiver alors présent ». Le mot grec peut désigner l’hiver, une tempête ou le mauvais temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: s’assit ensemble
  rationale: Le verbe composé exprime concrètement le fait que les membres de l’assemblée prirent place ensemble; le singulier s’accorde naturellement avec le collectif « assemblée ».
- source_word: πᾶν τὸ πλῆθος
  choice: toute l’assemblée
  rationale: Le groupe désigne l’ensemble du peuple réuni. « Assemblée » convient au cadre communautaire et reste naturel en français moderne.
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: sur l’esplanade
  rationale: La tournure substantivée désigne un espace large ou dégagé. « Esplanade » restitue prudemment cet espace ouvert sans imposer avec certitude une identification architecturale précise.
- source_word: τοῦ ἱεροῦ
  choice: du Temple
  rationale: ἱερόν peut désigner l’ensemble du complexe sacré plutôt que le sanctuaire intérieur; « Temple » est clair et, avec « esplanade », conserve cette portée large.
- source_word: τρέμοντες
  choice: en tremblant
  rationale: Le participe garde l’image concrète du tremblement, qui peut ici relever des mauvaises conditions météorologiques sans exclure toute nuance d’effroi.
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: à cause des intempéries qui sévissaient
  rationale: χειμών peut signifier l’hiver, la tempête ou le mauvais temps, tandis que ἐνεστῶτα indique ce qui est alors présent ou pressant. La formulation française rend naturellement des conditions météorologiques en cours tout en signalant l’ambiguïté en note.
