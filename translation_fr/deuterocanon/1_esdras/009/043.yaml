base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: fr
  text: Et Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ézékias et Baalsamos se tenaient à sa droite,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le parallèle approximatif de Néhémie 8.4, la liste hébraïque des hommes placés à la droite d’Esdras n’est pas identique et les noms diffèrent. Ici, les formes des noms suivent le texte grec de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: se tenaient
  rationale: La forme grecque est au singulier et formellement transitive (« plaça »), mais elle est suivie d’une série de noms au nominatif et d’une indication de position. Le sens contextuel est donc que ces hommes se tenaient là; le pluriel français est requis par le sujet composé.
- source_word: αὐτῷ
  choice: sa
  rationale: Avec l’expression de position ἐκ δεξιῶν, le datif renvoie à la personne auprès de laquelle ils se tiennent; en français, « à sa droite » exprime naturellement ce rapport.
- source_word: ἐκ δεξιῶν
  choice: à sa droite
  rationale: Expression spatiale idiomatique qui conserve le sens concret du côté droit.
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: Mattathias, Sammou, Ananias, Azarias, Ourias, Ézékias et Baalsamos
  rationale: Les noms sont translittérés d’après le témoin grec de 1 Esdras, sans être harmonisés avec la liste différente du parallèle hébreu. Les accents sont adaptés à l’usage français lorsqu’une forme française courante existe.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « se tenaient à sa droite » restitue naturellement la scène. La virgule finale est conservée parce que le verset se poursuit syntaxiquement dans le contexte.
