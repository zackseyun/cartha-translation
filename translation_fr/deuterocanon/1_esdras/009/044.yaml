base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: fr
  text: 'Et à gauche : Phaladaios, Misaël, Melchéias, Lothasoubos, Nabaréias[a] et Zacharie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de cette liste suivent la forme grecque propre à 1 Esdras; ils peuvent correspondre à des formes hébraïques plus familières dans des traditions parallèles.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: à gauche
  rationale: L’expression désigne le côté gauche et situe ici les personnes dans un groupe disposé autour du lecteur. « À gauche » est naturel et fidèle en français.
- source_word: Φαλαδαῖος
  choice: Phaladaios
  rationale: Translittération directe de la forme grecque, sans harmonisation conjecturale avec un nom hébreu.
- source_word: Μεισαήλ
  choice: Misaël
  rationale: Forme française biblique lisible, proche de la forme grecque Μεισαήλ.
- source_word: Μελχείας
  choice: Melchéias
  rationale: Translittération française de la forme grecque, maintenue plutôt qu’une identification hébraïque incertaine.
- source_word: Λωθάσουβος
  choice: Lothasoubos
  rationale: Le nom grec difficile est conservé par translittération, puisque le parallèle massorétique fourni est approximatif.
- source_word: Ναβαρείας
  choice: Nabaréias
  rationale: Translittération de la forme grecque; une éventuelle correspondance avec un nom hébreu plus connu demeure incertaine.
- source_word: Ζαχαρίας
  choice: Zacharie
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom biblique.
