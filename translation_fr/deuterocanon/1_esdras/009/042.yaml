base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: fr
  text: Esdras, le prêtre et lecteur de la Loi, se tint sur l’estrade en bois qui avait été construite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu de Néhémie 8.4 porte « Esdras, le scribe » et précise que la structure en bois avait été faite « pour la circonstance » ou « pour cette occasion ». Le grec de 1 Esdras dit plutôt « le prêtre et lecteur de la Loi » et indique simplement que l’estrade avait été construite.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: se tint
  rationale: L’aoriste de ἵστημι décrit simplement la prise de position d’Esdras; « se tint » convient au récit et au contexte public.
- source_word: Ἔσρας
  choice: Esdras
  rationale: Forme française traditionnelle du nom grec Ἔσρας.
- source_word: ὁ ἱερεύς
  choice: le prêtre
  rationale: Le grec désigne explicitement Esdras comme prêtre; cette donnée est conservée sans harmonisation avec le parallèle hébreu.
- source_word: ἀναγνώστης τοῦ νόμου
  choice: lecteur de la Loi
  rationale: ἀναγνώστης signifie lecteur, notamment lecteur public. Cette traduction suit le grec plutôt que d’introduire « scribe » depuis le texte massorétique.
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: sur l’estrade en bois
  rationale: βῆμα désigne ici une structure surélevée destinée à la lecture publique; « estrade » est naturel et précis en français moderne.
- source_word: τοῦ κατασκευασθέντος
  choice: qui avait été construite
  rationale: Le participe aoriste passif indique que la construction de l’estrade était achevée auparavant.
