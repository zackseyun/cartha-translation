base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: fr
  text: Et il dit à Esdras, le prêtre et lecteur[a], d’apporter la loi de Moïse, transmise par le Dieu d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lecteur public ». Certains traduisent « scribe », mais le terme grec désigne plus directement quelqu’un qui lit à haute voix.
    reason: lexical_alternative
  - marker: b
    text: Ou « remise par le Dieu d’Israël ». Le participe grec peut souligner aussi bien la remise que la transmission.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: dit à … d’apporter
  rationale: Le verbe signifie couramment « dire » ; avec l’infinitif κομίσαι, cette tournure française exprime naturellement la demande sans la renforcer en ordre formel.
- source_word: Ἔσρᾳ
  choice: Esdras
  rationale: Forme française traditionnelle et courante du nom dans ce livre.
- source_word: τῷ ἱερεῖ
  choice: le prêtre
  rationale: L’article et la fonction attribuée à Esdras sont conservés.
- source_word: ἀναγνώστῃ
  choice: lecteur
  rationale: Le nom grec désigne directement celui qui lit, notamment à haute voix. Le rendu préserve le rôle explicitement ajouté par le texte grec sans l’harmoniser avec le parallèle hébreu.
- source_word: κομίσαι
  choice: d’apporter
  rationale: Dans le contexte, il s’agit de faire venir ou de présenter la loi ; « apporter » est naturel et précis.
- source_word: τὸν νόμον Μωυσέως
  choice: la loi de Moïse
  rationale: Rendu transparent du génitif grec, qui conserve le rapport explicite entre la loi et Moïse.
- source_word: τὸν παραδοθέντα
  choice: transmise
  rationale: Le participe de παραδίδωμι évoque une remise ou une transmission. « Transmise » conserve cette nuance mieux que le seul « donnée », sans imposer l’idée d’une tradition humaine.
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: par le Dieu d’Israël
  rationale: ὑπό avec le participe passif indique l’agent ; « par » en est le rendu direct.
theological_decisions:
- issue: Rapport de la loi à Moïse et à Dieu
  choice: la loi de Moïse, transmise par le Dieu d’Israël
  alternative: la loi donnée par le Dieu d’Israël par l’intermédiaire de Moïse
  rationale: Le grec rattache explicitement la loi à Moïse et présente Dieu comme l’agent de sa transmission. Le texte ne précise toutefois pas « par l’intermédiaire de Moïse » ; cette explicitation n’est donc pas ajoutée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle ; « lecteur » est maintenu malgré son caractère moins habituel afin de préserver la particularité du témoin grec.
