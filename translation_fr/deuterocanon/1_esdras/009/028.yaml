base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: fr
  text: 'Parmi les fils de Zamoth : Éliadas[a], Éléiaséimos, Othonias, Iarimoth, Sabados[b] et Zéralias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset se présentent en grec sous des formes différentes de celles de la tradition hébraïque parallèle. La traduction suit ici le texte grec de 1 Esdras, sans harmoniser la liste avec Esdras ou Néhémie.
    reason: alternative_reading
  - marker: b
    text: La transcription de la source étant signalée comme présentant une légère discordance, l’orthographe de certains noms propres demeure quelque peu incertaine. La forme retenue est une translittération prudente du témoin grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: Dans cette liste, ἐκ indique que les hommes nommés sont issus du groupe familial mentionné. « Parmi les fils de » exprime naturellement cette appartenance en français.
- source_word: Ζαμόθ
  choice: Zamoth
  rationale: Translittération prudente de la forme grecque, sans harmonisation avec une tradition hébraïque parallèle.
- source_word: Ἐλιάδας
  choice: Éliadas
  rationale: Translittération française directe de la forme grecque, avec un accent initial facilitant la lecture.
- source_word: Ἐλειάσειμος
  choice: Éléiasimos
  rationale: La graphie suit de près les lettres de la forme grecque rare Ἐλειάσειμος, sans la normaliser d’après un autre témoin.
- source_word: Ὀθονίας
  choice: Othonias
  rationale: Translittération directe du nom grec, avec conservation de sa terminaison hellénisée.
- source_word: Ἰαριμώθ
  choice: Iarimoth
  rationale: L’iota initial est rendu par I, choix plus transparent en français que J pour préserver la forme grecque.
- source_word: Σάβαδος
  choice: Sabados
  rationale: La forme grecque est conservée plutôt que d’être harmonisée avec un éventuel nom hébreu apparenté.
- source_word: Ζεραλίας
  choice: Zéralias
  rationale: Translittération directe du grec, avec accent graphique français pour guider la prononciation.
