  verdict: revise
  source_fidelity: Le texte grec dit qu’Esdras, s’étant levé, partit de la cour du temple et entra dans le παστοφόριον de Jona, fils de Naséib. La formulation française rend correctement la séquence et le déplacement. Le nom grec Ἰωνᾶ est à conserver sous la forme « Jona », plutôt que « Jonas », afin de ne pas l’assimiler sans nécessité à une autre forme française biblique. La divergence avec le parallèle d’Esdras 10.6 doit rester en note.
