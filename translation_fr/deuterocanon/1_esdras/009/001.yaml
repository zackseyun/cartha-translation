base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/001.yaml
  text: Then Ezra rose up from the court of the temple and went into the chamber of Jona son of Naseib[b][a],
translation:
  language: fr
  text: Alors Esdras se leva, quitta la cour du Temple et se rendit dans la pièce de Jona, fils de Naséib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Jona, fils de Naséib ». Le passage parallèle d’Esdras 10.6 porte « Yohanân, fils d’Éliashib ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’action suivante; « se leva » rend naturellement la succession narrative.
- source_word: ἀπὸ τῆς αὐλῆς τοῦ ἱεροῦ
  choice: quitta la cour du Temple
  rationale: La préposition ἀπό marque ici le point de départ. « Cour du Temple » désigne clairement une cour de l’ensemble du sanctuaire, et « quitta » évite une tournure française lourde.
- source_word: ἐπορεύθη εἰς
  choice: se rendit dans
  rationale: Cette formulation française courante exprime le déplacement vers une pièce intérieure sans surtraduire le verbe.
- source_word: παστοφόριον
  choice: chambre
  rationale: Le mot désigne une pièce ou chambre appartenant à un complexe cultuel; « chambre » conserve le registre architectural et digne.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  choice: Jonas, fils de Naséib
  rationale: La traduction suit les noms propres effectivement transmis par le texte grec principal, avec des formes francisées transparentes. La divergence du parallèle hébreu est signalée en note plutôt que corrigée silencieusement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite le départ de la cour sans modifier le contenu. « Temple » prend une majuscule pour désigner l’édifice de Jérusalem. Le point final remplace la virgule du fragment anglais puisque le verset grec fourni forme ici une unité complète.
