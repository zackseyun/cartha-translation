base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: fr
  text: Esdras prit le livre devant la foule[a], car il siégeait bien en vue devant tous[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assemblée » ou « la multitude ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il siégeait à une place d’honneur » ; l’adverbe grec indique une position publiquement distinguée.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit « le livre » ; dans ce contexte historique, il pouvait s’agir d’un rouleau.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναλαβών
  choice: prit
  rationale: Le participe exprime le fait de prendre l’objet en main. « Prit » est naturel et n’ajoute pas l’idée d’une élévation cérémonielle.
- source_word: τὸ βιβλίον
  choice: le livre
  rationale: Équivalent direct de βιβλίον ; dans ce contexte historique, il pouvait matériellement s’agir d’un rouleau.
- source_word: τοῦ πλήθους
  choice: la foule
  rationale: πλῆθος désigne ici le grand groupe rassemblé. « La foule » est actuel et naturel, tout en conservant le caractère collectif du terme.
- source_word: ἐνώπιον
  choice: devant
  rationale: Ce choix simple convient aux deux occurrences et préserve le caractère public et visible de la scène.
- source_word: προεκάθητο
  choice: il siégeait
  rationale: Le verbe décrit une position assise, vraisemblablement officielle ou distinguée. « Siégeait » rend cette nuance avec dignité sans préciser indûment qu’il était assis à l’avant.
- source_word: ἐπιδόξως
  choice: bien en vue
  rationale: L’adverbe indique une place publiquement visible et distinguée. « Bien en vue » exprime naturellement cette proéminence, tandis que la note conserve la nuance honorifique possible.
- source_word: πάντων
  choice: tous
  rationale: Dans « devant tous », le référent collectif demeure clair sans qu’il soit nécessaire d’ajouter un pronom explicatif.
