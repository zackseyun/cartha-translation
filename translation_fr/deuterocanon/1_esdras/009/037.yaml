base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: fr
  text: Les prêtres, les Lévites et ceux d’Israël habitaient à Jérusalem et dans la région, à la nouvelle lune du septième mois[a] ; les fils d’Israël étaient dans leurs habitations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « à la nouvelle lune du septième mois ». Le passage hébreu parallèle en Néhémie diffère sensiblement à cet endroit ; la traduction suit ici le texte grec de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  choice: s’établirent
  rationale: L’aoriste de κατοικέω exprime ici le fait de résider ou de prendre demeure. « S’établirent » convient au contexte géographique et garde l’aspect ponctuel possible de l’aoriste.
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: ceux d’Israël
  rationale: Cette formulation conserve la distinction du grec entre ce groupe et les « fils d’Israël » mentionnés ensuite, sans préciser davantage son étendue.
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: à Jérusalem et dans la région
  rationale: χώρα désigne ici le territoire extérieur à Jérusalem. « La région » est naturel en français et évite l’ambiguïté moderne de « pays ».
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: à la nouvelle lune du septième mois
  rationale: νουμηνία désigne explicitement la nouvelle lune, qui marque le commencement du mois. La traduction préserve cette précision du texte grec.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: La locution familiale traditionnelle est conservée, notamment pour maintenir la distinction formelle avec οἱ ἐκ τοῦ Ἰσραήλ dans la première proposition.
- source_word: κατοικίαις
  choice: lieux d’habitation
  rationale: κατοικία peut désigner les lieux où l’on demeure. Cette traduction collective reste plus ouverte que « villages » et moins domestique que « maisons ».
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle hébreu approximatif de Néhémie 8.1
  choice: Suivre la séquence grecque et conserver la mention de la nouvelle lune du septième mois.
  alternative: Harmoniser le verset avec le texte massorétique, où le peuple se rassemble comme un seul homme devant la porte des Eaux.
  rationale: Le grec de 1 Esdras constitue la source première pour ce passage. Le parallèle hébreu diffère substantiellement et ne doit donc pas remplacer ni réorganiser son contenu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’enchaînement du grec tout en employant un point-virgule pour rendre lisible la coordination finale. Le marqueur [a] figure dans le texte immédiatement après l’expression concernée.
