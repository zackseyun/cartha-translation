revisions:
- from: Les prêtres, les Lévites et ceux d’Israël s’établirent à Jérusalem et dans la région, à la nouvelle lune du septième mois[a] ; les fils d’Israël étaient dans leurs lieux d’habitation.
  to: Les prêtres, les Lévites et ceux d’Israël habitaient à Jérusalem et dans la région, à la nouvelle lune du septième mois[a] ; les fils d’Israël étaient dans leurs habitations.
  rationale: La révision remplace « s’établirent » par « habitaient » afin de rendre le sens résidentiel de κατοικέω sans suggérer une installation accomplie précisément à la nouvelle lune. Elle simplifie également « lieux d’habitation » en « habitations ». La construction grecque, dont le rattachement précis de l’indication temporelle est quelque peu heurté, est conservée sans harmonisation avec Néhémie.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:05:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le grec mentionne bien les prêtres, les Lévites, « ceux d’Israël », Jérusalem, la χώρα, la nouvelle lune du septième mois, puis les fils d’Israël dans leurs κατοικίαι. La distinction entre « ceux d’Israël » et « les fils d’Israël » est conservée. Toutefois, « s’établirent » accentue indûment l’idée d’une installation ponctuelle; κατοικέω désigne ici plus sobrement le fait d’habiter ou de résider.
  naturalness: La phrase actuelle est compréhensible, mais « s’établirent … à la nouvelle lune » suggère naturellement que l’installation eut lieu ce jour-là. « Habitaient » rend plus naturellement en français l’état de résidence évoqué et évite cette implication. « Habitations » est plus idiomatique que « lieux d’habitation » tout en restant fidèle à κατοικίαις.
  terminology: « Prêtres », « Lévites », « Jérusalem », « nouvelle lune », « fils d’Israël » et « région » conviennent au registre biblique moderne et à la terminologie du passage. La note signale correctement que le grec est suivi contre un parallèle hébreu substantiellement différent.
  issues:
  - severity: medium
    issue: « s’établirent » peut surtraduire κατοικέω.
    rationale: Le verbe français évoque volontiers l’acte de prendre établissement, tandis que le contexte énumère surtout où les groupes habitaient. Sa combinaison avec « à la nouvelle lune » crée en outre une lecture temporelle trop ponctuelle.
  - severity: low
    issue: « lieux d’habitation » est lourd.
    rationale: « Habitations » traduit directement κατοικίαις et est plus naturel en français moderne sans restreindre le sens à des maisons individuelles.
