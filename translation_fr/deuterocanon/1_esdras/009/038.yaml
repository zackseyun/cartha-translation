base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: fr
  text: Et toute la multitude se rassembla d’un commun accord sur la vaste place de la porte orientale du temple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le vaste espace de la porte du temple tournée vers l’est ». Le grec ἐπὶ τὸ εὐρύχωρον désigne littéralement un espace large et dégagé ; πυλών peut désigner une porte monumentale ou son passage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθη
  choice: se rassembla
  rationale: L’aoriste passif de συνάγω décrit ici le rassemblement de la foule; le pronominal français exprime naturellement ce mouvement collectif.
- source_word: πᾶν τὸ πλῆθος
  choice: toute la multitude
  rationale: Cette formulation conserve le quantificateur πᾶν et le caractère nombreux et collectif de πλῆθος, dans un registre digne.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: L’expression rend l’unité d’intention ou d’action, au-delà de la simple présence au même endroit.
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: sur la grande place
  rationale: Le substantif adjectival désigne un espace large et dégagé; « grande place » est naturel en français et conserve l’image spatiale.
- source_word: τοῦ πρὸς ἀνατολὰς
  choice: oriental
  rationale: La locution signifie littéralement « tourné vers l’est »; l’adjectif « oriental » fournit ici une identification directionnelle concise.
- source_word: ἱεροῦ πυλῶνος
  choice: portique … du temple
  rationale: πυλών peut désigner une grande porte, une entrée monumentale ou son portique; « portique » préserve ici la construction génitive et évite de réduire nécessairement le terme au seul battant d’une porte.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le caractère collectif et unanime du rassemblement, tout en signalant en note l’incertitude topographique et lexicale concernant l’espace et le πυλών.
