  source_fidelity: La désignation « portique oriental » ne rend pas précisément πυλών, qui désigne d’abord une porte monumentale / un portail (éventuellement son passage), et « devant » ajoute une relation spatiale qui n’est pas exprimée. Le grec situe le rassemblement sur ou dans le vaste espace associé à la porte orientale du temple.
