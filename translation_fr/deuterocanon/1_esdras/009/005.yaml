base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: fr
  text: Ceux de la tribu de Juda et de Benjamin[a] furent rassemblés à Jérusalem dans un délai de trois jours. C’était le neuvième mois, le vingtième jour du mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec met « tribu » au singulier avec « Juda et Benjamin »; l’expression désigne les personnes appartenant à Juda et à Benjamin.
    reason: textual_clarification
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: furent rassemblés
  rationale: Le passif grec est conservé sans préciser qui convoque ou rassemble les personnes.
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: ceux de la tribu de Juda et de Benjamin
  rationale: Cette formulation suit le singulier φυλῆς du texte grec, tout en évitant d’ajouter une précision de genre absente de l’expression.
- source_word: ἐν τρισὶν ἡμέραις
  choice: dans un délai de trois jours
  rationale: Dans ce contexte de rassemblement, l’expression indique naturellement que les personnes devaient arriver au cours d’une période de trois jours.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec le verbe de rassemblement, « à Jérusalem » exprime naturellement en français le lieu vers lequel les personnes convergent.
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: C’était le neuvième mois
  rationale: La tournure française introduit clairement l’indication temporelle sans ajouter le nom d’un mois absent du grec.
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: le vingtième jour du mois
  rationale: εἰκάς désigne le vingtième jour du mois; la formulation développée est claire pour le lectorat moderne.
