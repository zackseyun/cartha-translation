base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: fr
  text: Ce jour est saint pour le Seigneur[a], et tous pleuraient en entendant la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de Néhémie 8, le texte hébreu dit « notre Seigneur » et poursuit par une invitation à manger, à boire, à envoyer des portions et à ne pas s’attrister. Ici, 1 Esdras conserve une formulation grecque plus courte.
    reason: Renvoi au texte parallèle et explication de la différence entre les témoins.
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: Ce jour
  rationale: Rend directement le groupe démonstratif grec dans un français naturel et solennel.
- source_word: ἁγία
  choice: saint
  rationale: « Saint » conserve la portée religieuse de l’adjectif et s’accorde avec « jour ».
- source_word: τῷ κυρίῳ
  choice: pour le Seigneur
  rationale: Le datif exprime ici l’appartenance ou la consécration. « Pour le Seigneur » est idiomatique en français; le grec ne contient pas « notre ».
- source_word: πάντες
  choice: tous
  rationale: Conserve la formulation collective concise du grec sans ajouter « le peuple ».
- source_word: ἔκλαιον
  choice: pleuraient
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec.
- source_word: ἐν τῷ ἀκοῦσαι
  choice: en entendant
  rationale: Rend naturellement la construction temporelle grecque et laisse ouverte la nuance entre l’écoute en cours et sa circonstance immédiate.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Désigne ici la Torah lue publiquement. La majuscule signale ce référent précis sans paraphraser par « instruction ».
theological_decisions:
- issue: Faut-il intégrer les éléments du parallèle hébreu absents du grec, notamment « notre Seigneur » et l’exhortation qui suit?
  choice: Conserver uniquement le contenu du texte grec.
  alternative: Harmoniser avec Néhémie 8.10 en ajoutant « notre » ou l’exhortation à manger, boire, partager et ne pas s’attrister.
  rationale: Le grec de 1 Esdras est le témoin principal et présente ici une forme plus courte. Le parallèle hébreu éclaire le contexte, mais ses éléments supplémentaires ne doivent pas être importés dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise, et l’imparfait « pleuraient » préserve l’aspect du grec.
