base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: fr
  text: Il passa la nuit là[a], sans goûter de pain ni boire d’eau, pleurant les graves transgressions du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il séjourna là » ou « Il campa là ». Le participe grec désigne le fait de rester en ce lieu pour la nuit.
    reason: lexical_alternative
  - marker: b
    text: Le passage parallèle d’Esdras 10 dans le texte hébreu précise qu’il s’agit de prendre des femmes étrangères pour épouses ; ici, le grec parle plus généralement de « graves transgressions ».
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: Il passa la nuit là
  rationale: Le participe de αὐλίζομαι exprime le fait de séjourner ou de passer la nuit en un lieu. Cette tournure française est naturelle et conserve la nuance temporelle sans préciser indûment le type d’hébergement.
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: sans goûter de pain
  rationale: Le grec dit littéralement qu’il ne goûta pas de pain. « Goûter de » conserve l’image concrète et peut exprimer ici l’abstention de manger.
- source_word: οὐδὲ ὕδωρ ἔπιεν
  choice: ni boire d’eau
  rationale: Traduction directe de la seconde moitié de la formule de jeûne, coordonnée naturellement en français avec « sans goûter de pain ».
- source_word: πενθῶν
  choice: car il était dans le deuil
  rationale: πενθέω indique une profonde affliction prenant la forme d’un deuil. La proposition explicite le rapport circonstanciel sans réduire cette réaction à une simple tristesse.
- source_word: τῶν ἀνομιῶν τῶν μεγάλων
  choice: des graves violations de la Loi
  rationale: ἀνομία désigne des actes contraires à la loi ou à l’ordre de l’alliance. « Violations de la Loi » en préserve la portée, tandis que « graves » rend idiomatiquement l’intensification de μεγάλων.
- source_word: τοῦ πλήθους
  choice: commises par le peuple
  rationale: πλῆθος désigne ici la collectivité concernée. « Le peuple » est plus naturel que « la multitude » en français moderne et convient au contexte communautaire.
theological_decisions:
- issue: Portée morale et théologique de ἀνομία
  choice: violations de la Loi
  alternative: iniquités ; transgressions ; actes contraires à la Loi
  rationale: Ce choix garde l’idée d’une conduite enfreignant la loi divine, plutôt que de réduire le terme à une faute générique. Il ne précise toutefois pas dans le corps du texte la nature exacte des actes, puisque le grec les résume de façon générale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant des formulations archaïques. « Graves » est préféré au calque « grandes », peu idiomatique avec « violations », et « le peuple » rend naturellement la collectivité désignée par πλῆθος.
