base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: fr
  text: 'Et parmi les fils d’Annan[a] : Éliodas, Asaïas, Melchéias, Sabbaias et Simon Chosamaos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les traditions parallèles d’Esdras et de Néhémie, certains noms de cette liste ont des équivalents hébreux, par exemple Annan/Hanan et Sabbaias/Shabbétaï. Le texte suit ici les formes grecques de 1 Esdras; les parallèles hébreux ne servent que de point de comparaison.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui maintient l’enchaînement de l’énumération.
- source_word: ἐκ τῶν υἱῶν
  choice: parmi les fils de
  rationale: Dans cette liste familiale, ἐκ indique l’appartenance au groupe; « parmi » est naturel en français tout en conservant ce sens.
- source_word: Ἀννὰν
  choice: Annan
  rationale: Translittération directe du nom grec, témoin principal; la forme hébraïque parallèle n’est pas substituée au texte grec.
- source_word: Ἐλιωδὰς
  choice: Éliodas
  rationale: Translittération française proche des voyelles et des consonnes du grec.
- source_word: Ἀσαίας
  choice: Asaïas
  rationale: Forme française lisible et proche du grec, avec le tréma signalant la séparation vocalique.
- source_word: Μελχείας
  choice: Melchéias
  rationale: Translittération qui conserve la forme grecque plutôt que d’imposer un équivalent hébraïque reconstruit.
- source_word: Σαββαίας
  choice: Sabbaias
  rationale: La forme grecque est conservée; un équivalent tel que Shabbétaï dépendrait davantage de la tradition hébraïque parallèle.
- source_word: Σίμων
  choice: Simon
  rationale: Forme française courante du nom grec.
- source_word: Χοσάμαος
  choice: Chosamaos
  rationale: Pour ce nom difficile et peu attesté, une translittération proche du grec est la solution la plus transparente.
