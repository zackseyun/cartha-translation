base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/036.yaml
  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: fr
  text: Tous ceux-là avaient vécu avec des femmes étrangères[a], et ils les renvoyèrent avec les enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le passage hébreu parallèle : « avaient épousé des femmes étrangères » ou « avaient pris des femmes étrangères pour épouses ».'
    reason: Le grec parle littéralement de vivre avec ces femmes, tandis que le parallèle hébreu explicite le cadre matrimonial.
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Tous ceux-là
  rationale: Rend directement le démonstratif sans ajouter « hommes », qui n’est pas exprimé dans le grec.
- source_word: συνῴκησαν
  choice: avaient vécu avec
  rationale: Le verbe désigne littéralement le fait d’habiter ou de vivre ensemble. Dans le contexte, il implique une union conjugale, mais la formulation conserve la latitude du grec.
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: des femmes étrangères
  rationale: ἀλλογενής désigne une personne appartenant à un autre peuple. « Femmes étrangères » est naturel et n’explicite pas « épouses » au-delà du grec.
- source_word: ἀπέλυσαν αὐτὰς
  choice: ils les renvoyèrent
  rationale: ἀπολύω signifie ici congédier ou renvoyer. « Renvoyèrent » exprime clairement la séparation sans imposer un terme juridique précis pour le divorce.
- source_word: σὺν τέκνοις
  choice: avec les enfants
  rationale: Le grec dit simplement « avec des/les enfants », sans possessif. L’article défini français rend naturellement les enfants concernés par le contexte tout en évitant d’ajouter « leurs ».
theological_decisions:
- issue: Faut-il rendre explicitement la relation comme un mariage ?
  choice: « avaient vécu avec des femmes étrangères » dans le texte principal
  alternative: « avaient épousé des femmes étrangères » ou « avaient pris des femmes étrangères pour épouses »
  rationale: Le témoin grec principal emploie συνῴκησαν, « vivre avec, cohabiter », tandis que le parallèle hébreu exprime plus nettement la prise de femmes étrangères. Le texte principal suit donc le grec et la note signale la nuance conjugale attestée par le parallèle.
- issue: À qui les enfants appartiennent-ils ?
  choice: « avec les enfants »
  alternative: « avec leurs enfants »
  rationale: σὺν τέκνοις ne comporte aucun possessif. Le contexte rattache les enfants à ces unions, mais la traduction évite de préciser grammaticalement une appartenance que le grec laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le plus-que-parfait situe la cohabitation avant leur renvoi; le passé simple convient au récit écrit. La formulation préserve l’ambiguïté relative du grec tout en explicitant en note le témoignage du parallèle hébreu.
