  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: fr
  text: 'Parmi les gardiens des portes : Salloumos et Tobanès[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Parmi les gardiens des portes : Salloumos et Tobanès. » À cet endroit, la tradition hébraïque parallèle ne correspond pas étroitement au texte grec et ne conserve pas ces noms sous les mêmes formes.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν θυρωρῶν
  choice: Parmi les gardiens des portes
  rationale: Dans cette liste, ἐκ désigne le groupe auquel appartiennent les hommes nommés. « Parmi » est naturel en français et évite la tournure plus lourde « d’entre les ». θυρωρός désigne celui qui garde une porte, ici vraisemblablement dans un cadre cultuel ou communautaire.
- source_word: Σάλλουμος
  choice: Shalloumos
  rationale: Translittération française de la forme grecque, qui conserve sa terminaison plutôt que de l’harmoniser avec une forme hébraïque supposée.
- source_word: καὶ
  choice: et
  rationale: Conjonction simple reliant les deux noms.
- source_word: Τοβάνης
  choice: Tobanès
  rationale: Translittération française directe de la forme grecque, sans l’assimiler à un nom hébreu plus familier que le texte grec ne garantit pas.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation garde la brièveté d’une liste de noms et suit en priorité le grec, tout en signalant le désaccord du témoin hébreu parallèle.
