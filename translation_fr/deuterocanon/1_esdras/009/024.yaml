lexical_decisions:
- source_word: ἐκ τῶν
  choice: Parmi les
  rationale: La formule introduit des membres appartenant à une catégorie dans une liste ; « Parmi les » est naturel en français.
- source_word: ἱεροψαλτῶν
  choice: chantres du Temple
  rationale: Le terme désigne des chanteurs affectés au service sacré. « Chantres du Temple » conserve la fonction cultuelle dans un registre digne et intelligible.
- source_word: Ἐλιάσεβος
  choice: Éliasib
  rationale: Cette forme française translittère le nom grec tout en maintenant la distinction avec la forme hébraïque parallèle « Éliashib », signalée en note.
- source_word: Βάκχουρος
  choice: Bacchouros
  rationale: Translittération française lisible du nom grec, sans lui imposer une identification hébraïque conjecturale.
