base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: fr
  text: 'Et parmi les fils de Bébaï : Joannès, Ananias, Zabdos et Émathis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le parallèle approximatif du texte massorétique, certains noms peuvent correspondre à d’autres formes hébraïques. La traduction de 1 Esdras suit ici le témoin grec, qui donne Joannès, Ananias, Zabdos et Émathis.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: Et parmi les fils de Bébaï
  rationale: Dans cette liste, ἐκ indique l’appartenance au groupe nommé, tandis que υἱῶν conserve la formulation généalogique « fils de ». « Parmi » rend naturellement la valeur partitive en français.
- source_word: Ἰωάννης
  choice: Joannès
  rationale: Translittération française directe de la forme grecque, sans lui substituer la forme hébraïque correspondante.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Forme française traditionnelle et transparente du nom grec, retenue conformément au témoin grec principal.
- source_word: Ζάβδος
  choice: Zabdos
  rationale: Translittération conservatrice de la forme grecque attestée, plutôt qu’une harmonisation avec un éventuel nom hébreu parallèle.
- source_word: Ἐμαθίς
  choice: Émathis
  rationale: Translittération française de la forme grecque, avec accent initial pour guider naturellement la lecture.
