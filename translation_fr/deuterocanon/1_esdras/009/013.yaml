base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/013.yaml
  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: fr
  text: les anciens et les juges de chaque lieu[a], jusqu’à ce que la colère du Seigneur au sujet de cette affaire soit écartée de nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est un fragment de phrase qui dépend du verset précédent ; la traduction conserve cette construction.
    reason: cultural_note
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: de chaque lieu
  rationale: Le génitif détermine à la fois « les anciens » et « les juges ». « De chaque lieu » conserve la portée distributive sans préciser indûment s’il s’agit d’une ville, d’un district ou d’une localité.
- source_word: πρεσβυτέρους
  choice: les anciens
  rationale: Dans ce contexte administratif et judiciaire, le terme désigne les autorités locales reconnues, et non simplement des hommes âgés.
- source_word: κριτάς
  choice: les juges
  rationale: Le cadre juridique favorise le sens direct de « juges » plutôt que le terme plus interprétatif « magistrats ».
- source_word: ἕως τοῦ λῦσαι
  choice: jusqu’à ce que … se détourne
  rationale: La construction indique un terme attendu. Avec la colère comme objet logique, le français idiomatique exprime ici l’idée d’une colère écartée ou détournée.
- source_word: ὀργὴν Κυρίου
  choice: la colère du Seigneur
  rationale: « Colère » est naturel en français moderne et conserve la gravité du déplaisir divin; « Seigneur » rend κύριος selon l’usage contextuel.
- source_word: ἀφʼ ἡμῶν
  choice: de nous
  rationale: La préposition marque l’éloignement par rapport à la communauté et s’intègre naturellement à « se détourne de nous ».
- source_word: τοῦ πράγματος τούτου
  choice: provoquée par cette affaire
  rationale: Le génitif grec est condensé et peut indiquer la cause ou l’objet de la colère. Cette formulation française rend clairement le lien causal suggéré par le contexte, tout en signalant l’autre lecture en note.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte grec deutérocanonique
  choice: Seigneur
  alternative: Maître; le SEIGNEUR
  rationale: « Seigneur » est la désignation révérencielle naturelle en français et rien dans ce verset n’impose une autre solution.
- issue: Intensité de ὀργή appliquée au déplaisir divin
  choice: colère
  alternative: fureur; courroux
  rationale: « Colère » demeure actuelle, claire et suffisamment forte, sans archaïsme ni amplification.
- issue: Rapport de τοῦ πράγματος τούτου avec la colère du Seigneur
  choice: cause de la colère (« provoquée par cette affaire »)
  alternative: objet ou domaine de la colère (« au sujet de cette affaire »)
  rationale: Le génitif est syntaxiquement comprimé et permet plus d’une nuance. Le contexte favorise la cause, mais l’ambiguïté authentique est conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte grec est un fragment de phrase dépendant du verset précédent; la traduction conserve ce caractère fragmentaire au lieu d’ajouter une action absente du segment fourni.
