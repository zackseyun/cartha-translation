revisions:
- from: les anciens et les juges de chaque lieu[a], jusqu’à ce que la colère du Seigneur provoquée par cette affaire se détourne de nous.
  to: les anciens et les juges de chaque lieu[a], jusqu’à ce que la colère du Seigneur au sujet de cette affaire soit écartée de nous.
  rationale: La révision remplace l’interprétation causale explicite par une formulation qui respecte l’ambiguïté du génitif grec, rend λῦσαι par une tournure française naturelle où la colère est écartée, et ajoute une note correctement ancrée sur la dépendance syntaxique du fragment.
