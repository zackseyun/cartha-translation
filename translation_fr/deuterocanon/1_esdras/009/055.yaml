base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
translation:
  language: fr
  text: Car ils furent aussi imprégnés des paroles qui leur avaient été enseignées[a], et ils furent rassemblés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « furent imprégnés » est rare dans ce contexte. Il peut aussi évoquer le fait d’être « inspiré » ou « instruit ». Le parallèle hébreu met plutôt l’accent sur l’acquisition d’une meilleure compréhension des paroles de la Loi.
    reason: lexical_alternative
  - marker: b
    text: Le parallèle de Néhémie 8.13 dit plus directement qu’ils se rassemblèrent « pour comprendre les paroles de la Loi ». Le texte grec de 1 Esdras présente la scène sous une forme condensée.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit une explication liée au contexte précédent; « Car » conserve cette fonction discursive.
- source_word: καὶ
  choice: aussi
  rationale: Rend la valeur additive de la particule sans alourdir l’ouverture de la phrase.
- source_word: ἐνεφυσιώθησαν
  choice: furent pénétrés
  rationale: Le verbe grec, rare et difficile ici, évoque le fait d’être insufflé, imprégné ou inspiré. « Furent pénétrés » conserve cette image et son ambiguïté sans réduire le sens à une simple instruction.
- source_word: ἐν τοῖς ῥήμασιν
  choice: des paroles
  rationale: Dans cette construction française, « pénétrés des paroles » rend naturellement l’idée d’en être imprégnés; « paroles » convient au contexte d’un enseignement reçu.
- source_word: οἷς ἐδιδάχθησαν
  choice: qui leur avaient été enseignées
  rationale: Conserve le passif et distingue clairement l’enseignement antérieur de l’effet exprimé par le premier verbe.
- source_word: ἐπισυνήχθησαν
  choice: ils furent rassemblés
  rationale: Reproduit le passif du texte grec, même si le parallèle hébreu présente plus directement un rassemblement volontaire.
