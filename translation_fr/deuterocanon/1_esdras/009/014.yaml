base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: fr
  text: Jonathan, fils d’Azaël, et Ézéchias, fils de Thocanus, acceptèrent ces dispositions,[a][b] et Mosollamus, Lévi et Sabbataeus prirent part à la décision avec eux.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de 1 Esdras ne correspond pas étroitement ici au parallèle du texte massorétique; les noms et la formulation sont donc traduits principalement d’après le témoin grec.
    reason: textual_variant
  - marker: b
    text: L’expression peut aussi se traduire par « acceptèrent cela », « s’en chargèrent » ou « l’approuvèrent conformément à ces mesures ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe grec est rare. Il peut aussi signifier qu’ils agirent comme assesseurs ou qu’ils apportèrent leur concours au jugement. Les formes grecques Mosollamus et Sabbataeus correspondent approximativement à Meshoullam et Shabbetaï dans le parallèle hébreu d’Esdras 10.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  choice: acceptèrent ces dispositions
  rationale: Le moyen ἐπεδέξαντο exprime ici l’acceptation ou la prise en charge de ce qui vient d’être proposé; κατὰ ταῦτα marque la conformité à ces mesures. « Ces dispositions » rend naturellement l’ensemble dans un contexte administratif.
- source_word: συνεβράβευσαν αὐτοῖς
  choice: prirent part à la décision avec eux
  rationale: Le verbe rare συνεβράβευσαν semble désigner une participation à un jugement, à un arbitrage ou à une décision. Cette formulation conserve cette portée sans supposer une fonction technique précise.
- source_word: Ἰωνάθας Ἀζαήλου
  choice: Jonathan, fils d’Azaël
  rationale: Le génitif grec est compris comme patronymique et rendu explicitement par « fils de ».
- source_word: Ἐξειας Θοκάνου
  choice: Ézéchias, fils de Thocanus
  rationale: Ἐξειας correspond au nom biblique usuel Ézéchias; Thocanus est translittéré d’après le grec faute d’équivalent français assuré.
- source_word: Μοσόλλαμος
  choice: Mosollamus
  rationale: La forme du témoin grec primaire est conservée plutôt que remplacée par celle du parallèle hébreu approximatif.
- source_word: Λευεὶς
  choice: Lévi
  rationale: La forme est singulière et fonctionne ici comme un nom personnel, non comme la désignation collective des Lévites.
- source_word: Σαββαταῖος
  choice: Sabbataeus
  rationale: La translittération suit le grec primaire; la forme du parallèle hébreu est signalée en note.
