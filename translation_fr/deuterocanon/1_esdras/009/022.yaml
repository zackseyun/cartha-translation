base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: fr
  text: 'Parmi les fils de Phaisour[a] : Élionaïs, Asséias, Ismaélos, Nathanaélos, Okailédos[b][c] et Salthas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Phaisour » ; le parallèle hébreu approximatif correspond à Pashhour.
    reason: alternative_reading
  - marker: b
    text: Le nom « Okailédos » reproduit ici le témoin grec ; la tradition parallèle hébraïque approximative pourrait refléter un autre nom sous-jacent, parfois rapproché de Jozabad.
    reason: textual_variant
  - marker: c
    text: Plusieurs noms de ce verset ont en grec des formes qui ne correspondent pas exactement à celles du parallèle hébreu approximatif. La traduction conserve les formes grecques, car le texte de 1 Esdras est traduit ici d’après le témoin de la Septante.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: Dans cette formule de liste, ἐκ indique que les hommes nommés sont issus d’un groupe familial. « Parmi les fils de » est naturel en français tout en conservant cette relation.
- source_word: Φαισούρ
  choice: Phaisour
  rationale: Translittération française lisible de la forme grecque, maintenue puisque le grec est ici le témoin principal.
- source_word: Ἐλιωναίς
  choice: Élionaïs
  rationale: Translittération de la forme grecque avec accents et tréma adaptés à une lecture française.
- source_word: Ἀσσείας
  choice: Asséias
  rationale: La graphie conserve le double sigma du grec et rend le nom aisément prononçable en français.
- source_word: Ἰσμαήλος
  choice: Ismaélos
  rationale: La forme grecque est conservée plutôt que normalisée selon le nom hébreu plus familier Ismaël.
- source_word: Ναθανάηλος
  choice: Nathanaélos
  rationale: Translittération de la forme grecque, sans harmonisation avec un éventuel équivalent hébreu.
- source_word: Ὠκαιληδός
  choice: Okaélédos
  rationale: Le nom difficile est translittéré directement d’après le texte grec de Swete, sans lui substituer une identification issue d’un parallèle approximatif.
- source_word: Σάλθας
  choice: Salthas
  rationale: Translittération directe de la forme grecque, préférée à une harmonisation conjecturale avec un nom hébreu.
