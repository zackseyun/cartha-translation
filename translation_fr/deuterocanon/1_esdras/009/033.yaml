base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: fr
  text: 'Et parmi les fils d’Asom[a] : Maltannaios, Mattathias, Sabannaious, Éleiphalat, Manassé[b] et Shimeï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Asom »; le parallèle hébreu correspond probablement à « Hashum ».
    reason: alternative_reading
  - marker: b
    text: Plusieurs noms de cette liste ont, en grec, des formes qui ne correspondent pas exactement à celles de la tradition hébraïque parallèle; le texte principal suit le témoin grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: Et parmi les fils de
  rationale: Dans cette liste, ἐκ introduit les membres issus d’un groupe familial. « Parmi les fils de » est naturel en français tout en conservant la relation généalogique.
- source_word: Ἀσόμ
  choice: Asom
  rationale: Le texte grec porte Ἀσόμ. La forme grecque est donc conservée dans le texte principal plutôt que d’être harmonisée avec le parallèle hébreu probable, Hashum.
- source_word: Μαλτανναῖος
  choice: Maltannaios
  rationale: Translittération de la forme propre au témoin grec, sans assimilation conjecturale à un nom hébreu parallèle.
- source_word: Ματταθίας
  choice: Mattathias
  rationale: Forme française biblique usuelle correspondant étroitement au grec Ματταθίας.
- source_word: Σαβανναιούς
  choice: Sabannaious
  rationale: La forme grecque inhabituelle est translittérée, car son identification exacte avec un nom de la tradition hébraïque demeure incertaine.
- source_word: Ἐλειφαλὰτ
  choice: Éleiphalat
  rationale: Translittération française proche du grec, avec accent initial facilitant la lecture; elle évite une normalisation vers une forme hébraïque non attestée ici par le texte source principal.
- source_word: Μανασση
  choice: Manassé
  rationale: Forme française biblique consacrée de ce nom, clairement reconnaissable et compatible avec la forme grecque.
- source_word: Σεμεεί
  choice: Shimeï
  rationale: Forme française courante du nom sémitique correspondant, soutenue par la tradition parallèle; le tréma indique que les deux dernières voyelles se prononcent séparément.
