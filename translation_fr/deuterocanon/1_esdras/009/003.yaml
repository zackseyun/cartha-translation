base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: fr
  text: Et une proclamation fut faite dans toute la Judée et à Jérusalem, à l’intention de tous ceux qui étaient issus de la captivité[a], pour qu’ils se rassemblent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous ceux issus de la captivité ». On peut aussi comprendre : « tous les exilés » ou, selon le contexte, « tous les anciens exilés ».'
    reason: La formule grecque désigne littéralement des personnes « issues de la captivité »; elle n’énonce pas explicitement leur retour.
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: une proclamation fut faite
  rationale: Cette tournure française naturelle rend l’idiome grec (« une proclamation eut lieu ») sans faire de κήρυγμα un décret formel.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: dans toute la Judée et à Jérusalem
  rationale: La distinction entre la région et la ville appelle naturellement « dans » puis « à » en français.
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: à l’adresse de tous ceux qui étaient revenus de captivité
  rationale: ἐκ marque la provenance hors de la captivité. « Revenus » explicite sobrement cette relation dans un français compréhensible, sans réduire le groupe au seul terme « exilés ».
- source_word: συναχθῆναι
  choice: afin qu’ils se rassemblent
  rationale: L’infinitif aoriste passif exprime le contenu ou le but de la proclamation. Le pronominal français rend naturellement le rassemblement sans imposer un agent extérieur.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec « se rassembler », le français désigne normalement le lieu d’aboutissement par « à », tout en conservant la valeur directionnelle de εἰς.
