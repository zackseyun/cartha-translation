  source_fidelity: La traduction rend correctement κήρυγμα, l’étendue géographique, le destinataire et le lieu du rassemblement. Toutefois, « qui étaient revenus de captivité » explicite un retour qui est seulement suggéré par le contexte, non exprimé par πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας. Il convient de conserver la provenance de la captivité sans affirmer ce retour.
