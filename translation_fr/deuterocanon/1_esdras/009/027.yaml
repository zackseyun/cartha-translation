base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/027.yaml
  text: 'From the sons of Elah: Mattan and Zechariah[a], Jezrikilus and Obadiah and Jeremoth and Aedeias.'
translation:
  language: fr
  text: 'Parmi les fils d’Éla : Mattan, Zacharie[a], Jézrikilos, Oabdios, Jérémoth et Aédéias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset sont transcrits au plus près du grec, car 1 Esdras diffère souvent du texte hébreu parallèle par l’orthographe ou l’ordre des noms; pour certains, des formes fondées sur l’hébreu et plus familières sont possibles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: Dans cette liste, ἐκ introduit des membres issus d’un groupe familial; « Parmi les fils de » est naturel en français tout en conservant cette relation.
- source_word: Ἠλά
  choice: Éla
  rationale: Translittération française simple de la forme grecque du nom propre.
- source_word: Ματαν
  choice: Mattan
  rationale: Translittération proche du grec, avec la graphie française couramment intelligible du nom sémitique.
- source_word: Ζαχαρίας
  choice: Zacharie
  rationale: Forme biblique française usuelle correspondant au grec Ζαχαρίας.
- source_word: Ἰεζρίκιλος
  choice: Jézrikilos
  rationale: Translittération étroite d’un nom rare; elle évite une harmonisation conjecturale avec une autre tradition textuelle.
- source_word: Ὠαβδίος
  choice: Oabdios
  rationale: La translittération suit la forme grecque transmise plutôt que de l’identifier avec certitude à la forme hébraïque plus familière Abdias.
- source_word: Ἱερεμὼθ
  choice: Jérémoth
  rationale: Translittération française directe de la forme grecque.
- source_word: Ἀηδείας
  choice: Aédéias
  rationale: Translittération proche du témoin grec, dont la correspondance exacte avec un nom hébreu demeure incertaine.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et adapté à une liste généalogique. Les accents facilitent la lecture française des noms, tandis que les formes rares restent proches du grec. Tous les καί de la série sont rendus selon l’usage français de l’énumération, avec « et » devant le dernier élément.
