base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: fr
  text: Le prêtre Esdras choisit des hommes qui étaient chefs de leurs lignées familiales, tous nommément désignés. Ils se réunirent le jour de la nouvelle lune du dixième mois[a] pour examiner l’affaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le premier jour du dixième mois.
    reason: La « nouvelle lune » marque ici le commencement du mois.
lexical_decisions:
- source_word: ἐπελέξατο αὐτῷ
  choice: choisit
  rationale: Le moyen grec souligne l’implication personnelle d’Esdras dans le choix. En français, « choisit » l’exprime naturellement; traduire αὐτῷ par « pour lui-même » serait lourd et pourrait suggérer à tort un intérêt personnel.
- source_word: ἄνδρας ἡγουμένους
  choice: des hommes qui étaient chefs
  rationale: Cette formulation conserve le masculin explicite de ἄνδρας et rend la fonction dirigeante exprimée par ἡγουμένους.
- source_word: τῶν πατριῶν αὐτῶν
  choice: de leurs familles paternelles
  rationale: πατριά désigne ici les groupes familiaux fondés sur l’ascendance paternelle. « Familles paternelles » est plus transparent en français moderne que le calque « maisons de leurs pères ».
- source_word: πάντας κατ’ ὄνομα
  choice: tous désignés par leur nom
  rationale: La formule évoque une sélection ou une inscription nominative officielle.
- source_word: συνεκλείσθησαν
  choice: se réunirent
  rationale: Dans ce contexte administratif, le verbe indique qu’ils furent rassemblés ensemble. « Se réunirent » est naturel sans imposer le sens littéral possible d’enfermement.
- source_word: τῇ νουμηνίᾳ
  choice: le jour de la nouvelle lune
  rationale: Cette traduction conserve directement l’expression calendaire grecque; une note en explicite la valeur, soit le premier jour du mois.
- source_word: ἐτάσαι
  choice: examiner
  rationale: 'L’infinitif exprime le but de la réunion: procéder à l’examen formel de la question.'
- source_word: τὸ πρᾶγμα
  choice: l’affaire
  rationale: Le terme reste général et désigne la question soumise à l’examen; « affaire » convient au contexte administratif.
theological_decisions:
- issue: Langage masculin et organisation familiale
  choice: des hommes qui étaient chefs de leurs familles paternelles
  alternative: les chefs de leurs familles
  rationale: Le grec mentionne explicitement des hommes et décrit une structure familiale fondée sur l’ascendance paternelle; la traduction conserve ces deux éléments sans les neutraliser.
- issue: Valeur calendaire de νουμηνία
  choice: le jour de la nouvelle lune du dixième mois
  alternative: le premier jour du dixième mois
  rationale: Le choix principal préserve l’image et la formulation grecques. La note indique clairement qu’il s’agit du premier jour du mois, sans supposer ici une portée cultuelle particulière.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est divisée en deux phrases pour éviter une coordination trop lourde, tout en conservant l’enchaînement du grec. Le témoin massorétique fourni ne correspond pas à ce verset et n’a donc pas servi à modifier le texte grec principal.
