base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: fr
  text: 'Parmi les Lévites : Jozabad, Sénéïs, Kônos — c’est-à-dire Kalitaïs[a] —, Pathaïos[b], Judas et Jonas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « celui-ci, Kalitaïs »; elle semble présenter Kalitaïs comme un autre nom de Kônos.
    reason: alternative_reading
  - marker: b
    text: La transcription de la source présente une légère divergence; l’orthographe exacte de certains noms rares peut donc être incertaine. Le texte suit ici le témoin grec.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: Parmi les Lévites
  rationale: La préposition ἐκ a ici une valeur partitive et introduit un sous-groupe dans une liste. « Parmi les Lévites » est naturel en français et restitue clairement cette fonction.
- source_word: Ἰωζάβαδος
  choice: Jozabad
  rationale: Le nom propre est translittéré d’après la forme grecque, sans lui substituer une forme conjecturale issue d’une autre tradition.
- source_word: Σενεεὶς
  choice: Sénéïs
  rationale: Cette forme française reproduit au plus près le nom grec rare tout en employant des signes diacritiques qui en facilitent la lecture.
- source_word: Κῶνος
  choice: Kônos
  rationale: Translittération directe de la forme grecque, avec « k » pour κ et un accent circonflexe signalant l’oméga.
- source_word: οὗτος Καλιταίς
  choice: c’est-à-dire Kalitaïs
  rationale: Dans cette liste, οὗτος suivi du nom paraît être une précision appositive identifiant Kônos sous un autre nom. La note conserve la légère ambiguïté syntaxique du grec.
- source_word: Παθαῖος
  choice: Pathaïos
  rationale: Le texte principal suit la forme grecque plutôt que de lui substituer un éventuel équivalent sémitique provenant de la tradition parallèle.
- source_word: Ἰούδας
  choice: Judas
  rationale: « Judas » est la forme française habituelle du nom personnel grec Ἰούδας dans ce contexte.
- source_word: Ἰωνάς
  choice: Jonas
  rationale: « Jonas » rend directement la forme grecque Ἰωνάς; une forme hébraïsante n’est pas imposée au témoin grec.
