  yaml_path: translation/deuterocanon/1_esdras/009/015.yaml
  text: And those from the captivity did all these things[a].
translation:
  language: fr
  text: Et ceux qui étaient revenus de captivité firent tout cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux de la captivité »; il s’agit de la communauté revenue d’exil.'
    reason: La note signale la formulation condensée du grec et l’explicitation contextuelle introduite dans le texte.
lexical_decisions:
- source_word: ἐποίησαν
  choice: firent
  rationale: Avec κατὰ πάντα ταῦτα, ποιέω désigne l’accomplissement des actes qui viennent d’être racontés; « firent » rend naturellement l’aoriste et cette valeur idiomatique.
- source_word: κατὰ πάντα ταῦτα
  choice: tout cela
  rationale: Cette expression renvoie globalement aux mesures précédemment décrites. « Tout cela » restitue à la fois la totalité exprimée par πάντα et la reprise démonstrative de ταῦτα sans calque pesant.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: ceux qui étaient revenus de captivité
  rationale: L’expression grecque signifie littéralement « ceux de/issus de la captivité ». Dans le contexte, elle désigne la communauté revenue d’exil; cette formulation française explicite ce référent tout en conservant l’image de la captivité.
