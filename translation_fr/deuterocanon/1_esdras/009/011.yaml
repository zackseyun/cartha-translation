base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: fr
  text: Mais la foule est nombreuse et c’est la saison hivernale ; nous ne pourrons pas rester dehors[a], et nous n’avons pas trouvé[b]… Ce travail ne peut se faire en un seul jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rester en plein air ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte littéralement « et nous n’avons pas trouvé », mais cette proposition est difficile et son sens dans le contexte demeure incertain. Le texte parallèle d’Esdras 10.13 ne contient pas cette proposition.
    reason: textual_variant
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: la foule est nombreuse
  rationale: Le syntagme désigne le grand nombre de personnes rassemblées. « La foule est nombreuse » est naturel et conserve le sens collectif.
- source_word: ὥρα χειμερινή
  choice: c’est la saison hivernale
  rationale: Rend directement l’idée d’une période marquée par les conditions de l’hiver, sans réduire le grec à la seule pluie.
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: nous ne pourrons pas rester dehors
  rationale: ἰσχύω exprime ici la capacité pratique ou l’endurance, et αἴθριοι le fait d’être exposé en plein air.
- source_word: καὶ οὐχ εὕρομεν
  choice: De plus, nous n’avons pas trouvé…
  rationale: La traduction conserve les mots grecs transmis au lieu de les supprimer, mais les points de suspension signalent que la proposition paraît inachevée ou corrompue dans ce contexte.
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: ce travail ne peut se faire en un seul jour
  rationale: 'Cette formulation française naturelle exprime la portée de la construction grecque : le travail à accomplir dépasse une journée.'
theological_decisions:
- issue: Traitement de la proposition grecque difficile καὶ οὐχ εὕρομεν
  choice: La maintenir dans le texte sous une forme littérale, accompagnée d’une note signalant l’incertitude.
  alternative: L’omettre du texte principal et ne traduire que le sens contextuel assuré, comme dans le parallèle d’Esdras 10.13.
  rationale: Le grec de Swete demeure la source première. Conserver la proposition respecte le témoin transmis et préserve son ambiguïté, tandis que la note évite de lui imposer un sens conjectural.
- issue: Rapport avec le parallèle massorétique
  choice: Employer le parallèle seulement pour confirmer le cadre général, sans reconstruire le grec à partir de lui.
  alternative: Aligner le verset sur Esdras 10.13 et supprimer ou remplacer la proposition grecque obscure.
  rationale: Le témoin parallèle est approximatif et ne doit pas supplanter le texte grec de 1 Esdras.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation et les points de suspension rendent visible la rupture syntaxique du grec sans proposer de correction conjecturale.
