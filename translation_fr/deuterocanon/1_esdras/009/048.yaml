base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: fr
  text: Jeshoua, Anniouth et Shérébia[a], Jadinos, Jarsoubos, Abtaïos, Autaïas, Maïannas et Kélitas, Azarias, Katéthzabdos, Annas et Phalias, les Lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset sont incertains dans le texte grec; certains pourraient correspondre aux Lévites énumérés en Néhémie 8.7, notamment Shabbethaï, Hodia, Maaséïa et d’autres. Le texte principal conserve généralement une forme fondée sur le grec, sauf lorsque le rapprochement avec la forme sémitique est particulièrement solide.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jeshoua
  rationale: Dans le contexte d’Esdras-Néhémie, le grec représente le nom hébreu יֵשׁוּעַ; « Jeshoua » évite la forme néotestamentaire « Jésus » tout en restant naturelle en français biblique.
- source_word: Σαραβίας
  choice: Shérébia
  rationale: Le nom correspond très probablement à שֵׁרֵבְיָה dans le contexte parallèle; la forme sémitique usuelle est donc retenue.
- source_word: Ἀννιοὺθ, Ἰάδεινος, Ἰαρσούβοος, Ἀβταῖος, Αὐταίας, Μαιάννας, Καλείτας
  choice: Anniouth, Jadinos, Jarsoubos, Abtaïos, Autaïas, Maïannas, Kélitas
  rationale: Ces noms incertains sont transcrits de près d’après le témoin grec, sans les harmoniser de manière conjecturale avec une autre liste.
- source_word: Ἀζαρίας
  choice: Azarias
  rationale: Forme française biblique traditionnelle et transparente du nom grec.
- source_word: Κατέθζαβδος
  choice: Katéthzabdos
  rationale: Bien que la forme transmise soit difficile et puisse refléter un nom comme Jozabad, une transcription grecque prudente préserve ici l’incertitude textuelle.
- source_word: Ἄννας, Φαλίας
  choice: Annas, Phalias
  rationale: Transcription directe des formes grecques, faute d’identification hébraïque suffisamment certaine.
- source_word: οἱ Λευεῖται
  choice: les Lévites
  rationale: Rend naturellement l’apposition grecque qui identifie les personnes énumérées.
