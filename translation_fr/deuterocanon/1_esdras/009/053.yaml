base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: fr
  text: 'Et les Lévites donnaient des instructions à tout le peuple en disant : « Ce jour est saint ; ne vous affligez pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas tristes » ou « ne prenez pas le deuil ».'
    reason: 'Alternative lexicale : λυπεῖσθε peut exprimer l’affliction, la tristesse ou le deuil.'
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: les Lévites
  rationale: Désignation française courante et traditionnelle de ce groupe cultuel.
- source_word: ἐκέλευον
  choice: donnaient des instructions
  rationale: L’imparfait exprime une action en cours ou répétée. Le verbe peut signifier « ordonner », mais le contexte favorise ici une directive adressée au peuple sans imposer un ton excessivement dur.
- source_word: τῷ δήμῳ πάντα
  choice: à tout le peuple
  rationale: δήμῳ désigne le peuple ou l’assemblée, et πάντα donne ici naturellement une portée globale ou distributive.
- source_word: λέγοντες
  choice: en disant
  rationale: Rend simplement le participe qui introduit les paroles rapportées.
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: Ce jour est saint
  rationale: Conserve la valeur démonstrative de αὕτη et rend ἁγία par le terme biblique français naturel « saint ».
- source_word: μὴ λυπεῖσθε
  choice: ne vous affligez pas
  rationale: Rend l’état de tristesse ou de peine exprimé par λυπέω, dans un français actuel et digne, tout en laissant en note les nuances possibles.
