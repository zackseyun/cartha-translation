base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: fr
  text: et ils s’engagèrent à renvoyer leurs femmes[a] et à offrir, en expiation pour leur ignorance[b], des béliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils posèrent les mains pour renvoyer leurs femmes » ; cette expression signifie ici qu’ils prirent l’engagement de le faire.'
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi se traduire par « pour leur erreur » ou, dans ce contexte sacrificiel, « pour leur péché involontaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: ils s’engagèrent
  rationale: L’expression signifie littéralement « ils posèrent les mains », mais, suivie de l’infinitif, elle exprime ici un engagement à agir. Une traduction littérale serait obscure ou trompeuse en français.
- source_word: ἐκβαλεῖν
  choice: à renvoyer
  rationale: Dans ce contexte conjugal, « renvoyer » exprime la séparation d’avec les épouses sans accentuer indûment la violence que pourrait suggérer « chasser ».
- source_word: τὰς γυναῖκας αὐτῶν
  choice: leurs femmes
  rationale: γυναῖκες désigne ici les épouses. « Leurs femmes » est naturel en français moderne et conserve le sens conjugal confirmé par le contexte parallèle.
- source_word: εἰς ἐξιλασμόν
  choice: pour l’expiation
  rationale: ἐξιλασμός désigne l’expiation accomplie dans un cadre sacrificiel. Ce terme conserve précisément la finalité cultuelle du sacrifice.
- source_word: κριούς
  choice: des béliers
  rationale: Le grec nomme précisément des béliers, au pluriel, comme animaux sacrificiels.
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: à cause de leur faute commise par ignorance
  rationale: Dans ce contexte sacrificiel, ἀγνοία ne désigne pas une simple absence de connaissance, mais une faute liée à l’ignorance ou commise involontairement. La formulation française rend cette nuance sans réduire le terme au seul concept technique de péché involontaire.
theological_decisions:
- issue: Portée cultuelle de ἀγνοία
  choice: faute commise par ignorance
  alternative: ignorance ; erreur ; péché involontaire
  rationale: Le contexte d’expiation donne à ἀγνοία une portée morale et sacrificielle. « Faute commise par ignorance » rend cette portée tout en conservant l’idée d’ignorance et sans affirmer plus précisément que le grec la nature de l’acte.
- issue: Valeur idiomatique de ἐπέβαλον τὰς χεῖρας
  choice: engagement à renvoyer les femmes
  alternative: ils posèrent les mains ; ils entreprirent
  rationale: Le sens contextuel est celui d’un engagement ou d’une obligation assumée, et non d’un geste physique dirigé contre les femmes.
- issue: Ellipse dans la proposition sacrificielle
  choice: expliciter « offrir »
  alternative: et, pour l’expiation, des béliers
  rationale: Le grec présente une construction elliptique. L’ajout de « offrir » en français explicite l’action sacrificielle nécessaire à l’intelligibilité sans ajouter de contenu théologique étranger au contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Expiation » conserve le vocabulaire sacrificiel précis ; l’ellipse grecque est légèrement explicitée par « offrir » pour produire une phrase française intelligible.
