base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: fr
  text: 'Parmi les fils d’Addîn : Lathos, Moosséias[a], Lakkounos, Naïdos, Beskaspasmos, Sesthel, Balnous et Manassé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec présente ici une liste de noms propres. Plusieurs sont incertains ou diffèrent du parallèle hébreu approximatif; ils sont donc transcrits au plus près de leurs formes grecques plutôt qu’harmonisés avec la tradition massorétique.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: Parmi les fils d’Addîn
  rationale: Dans cette liste, ἐκ suivi du génitif indique que les personnes citées appartiennent au groupe familial d’Addîn. « Parmi » rend naturellement cette relation en français, tandis que « fils » conserve la formule généalogique grecque.
- source_word: Λάθος καὶ Μοοσσείας, Λακκοῦνος καὶ Νάιδος, καὶ Βεσκασπασμὸς καὶ Σεσθὴλ καὶ Βαλνοῦς καὶ Μανασσῆς
  choice: Lathos, Moosséias, Lakkounos, Naïdos, Beskaspasmos, Sesthel, Balnous et Manassé
  rationale: Les noms sont transcrits d’après le grec de Swete sans harmonisation avec une tradition hébraïque approximative. Les accents facilitent la lecture française; « Manassé » suit la forme française consacrée.
