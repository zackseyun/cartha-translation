  source_fidelity: Le rendu conserve exactement la formule de liste « ἐκ τῶν υἱῶν Ἀδδείν » et les huit noms du grec, dans le même ordre. L’allègement de la répétition de καί en ponctuation française ne modifie ni les relations ni le contenu. Les translittérations ne cherchent pas à harmoniser les noms difficiles avec le parallèle massorétique, qui est seulement approximatif.
