  terminology: « Fils » préserve la formulation généalogique grecque. Addîn et Manassé correspondent à des usages français établis; les autres formes restent volontairement proches du grec. La note signale convenablement l’incertitude de plusieurs noms et l’absence d’harmonisation au parallèle hébreu.
