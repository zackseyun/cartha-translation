base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: fr
  text: 'Alors Esdras se leva et leur dit : « Vous avez agi contre la loi et vous avez vécu avec des femmes étrangères[a], ajoutant ainsi un péché à Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez épousé des femmes étrangères » ou « vous avez pris des femmes étrangères pour épouses ». Le verbe grec signifie littéralement « vivre avec »; dans ce contexte, il désigne vraisemblablement des unions conjugales avec des femmes appartenant à d’autres peuples.
    reason: Préciser la portée contextuelle de συνῳκίσατε tout en conservant dans le texte la formulation plus proche du grec.
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste de ἀνίστημι introduit la prise de parole d’Esdras et marque naturellement le mouvement narratif.
- source_word: ἠνομήσατε
  choice: avez agi contre la loi
  rationale: Cette formulation conserve la force juridique de ἀνομέω sans réduire le terme au sens plus général de « pécher » ni supposer explicitement une disposition précise de la Loi.
- source_word: συνῳκίσατε
  choice: avez vécu avec
  rationale: Le verbe désigne littéralement le fait de vivre avec quelqu’un. Dans ce contexte, il évoque des unions conjugales, mais la traduction principale préserve le degré d’explicitation du grec.
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: des femmes étrangères
  rationale: ἀλλογενής désigne une personne appartenant à un autre peuple. « Femmes étrangères » est clair, actuel et conserve la portée ethnique et sociale de l’expression.
- source_word: προσθεῖναι
  choice: ajoutant ainsi
  rationale: Le participe présent français exprime naturellement l’effet ou le résultat des actes reprochés; « ainsi » rend explicite le lien logique sans ajouter une nouvelle idée.
- source_word: ἁμαρτίαν
  choice: un péché
  rationale: « Péché » est l’équivalent direct de ἁμαρτία et garde la dimension morale et religieuse de l’accusation.
- source_word: τῷ Ἰσραήλ
  choice: à Israël
  rationale: Le datif indique ici ce à quoi le péché est ajouté et maintient la portée collective de la faute.
theological_decisions:
- issue: Faut-il expliciter le sens conjugal de συνῳκίσατε ?
  choice: avez vécu avec
  alternative: avez épousé / avez pris pour femmes
  rationale: Le contexte et le parallèle hébreu orientent vers des mariages, mais le verbe grec met directement l’accent sur la vie commune. La formulation retenue préserve cette nuance, tandis qu’une note signale le sens contextuel probable.
- issue: Portée collective de la faute
  choice: ajoutant ainsi un péché à Israël
  alternative: augmentant le péché d’Israël / faisant peser une faute sur Israël
  rationale: La traduction conserve la construction grecque et l’idée que ces actes accroissent la faute collective d’Israël, sans la reformuler en culpabilité purement individuelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit de près la syntaxe grecque tout en restant naturelle; elle évite les formulations archaïques comme « femmes étrangères à la nation » et ne tranche pas silencieusement l’ambiguïté lexicale de συνῳκίσατε.
