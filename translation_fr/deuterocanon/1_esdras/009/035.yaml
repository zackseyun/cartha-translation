base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: fr
  text: 'Parmi les descendants d’Ooma : Zeitias[a], Zabadias, Édos, Ouel[b] et Banaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec énumère ici ces noms individuellement. Le parallèle approximatif du texte massorétique (Esdras 10) termine cette section par une formule récapitulative au lieu de conserver la même liste à cet endroit.
    reason: cross_reference
  - marker: b
    text: Le texte grec présente une liste de noms de personnes. L’expression « descendants d’Ooma » explicite le sens de groupe familial sous-entendu par la tournure grecque « parmi ceux d’Ooma ».
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν Ὀομά
  choice: Parmi les descendants d’Ooma
  rationale: La construction elliptique désigne les membres du groupe familial d’Ooma. « Descendants » restitue ce sens sans limiter nécessairement le groupe aux fils immédiats.
- source_word: Ζειτιάς
  choice: Zeitias
  rationale: Translittération directe de la forme grecque, conservant la graphie correspondant à la diphtongue ει.
- source_word: Ζαβαδαίας
  choice: Zabadias
  rationale: Translittération française lisible de la forme grecque, sans la normaliser d’après une forme hébraïque.
- source_word: Ἠδός
  choice: Édos
  rationale: Translittération de la forme grecque avec accent initial afin de guider naturellement la prononciation française.
- source_word: Οὐὴλ
  choice: Ouel
  rationale: Translittération conservatrice et naturelle en français de la séquence grecque initiale Οὐ-.
- source_word: Βαναίας
  choice: Banaias
  rationale: Translittération de la forme grecque plutôt qu’assimilation à une forme biblique issue de l’hébreu.
