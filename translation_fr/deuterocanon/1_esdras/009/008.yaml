base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
translation:
  language: fr
  text: Et maintenant, faites confession au Seigneur, Dieu de nos pères, et rendez-lui gloire[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaissance » ou « aveu ». Le grec ὁμολογία peut désigner une confession, un aveu ou une reconnaissance ; « confession » convient ici au contexte pénitentiel.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec de ce verset est plus court que le passage hébreu parallèle d’Esdras. La traduction suit ici le grec, le texte hébreu ne servant que de repère contextuel.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec l’exhortation précédente et la valeur temporelle, sans préciser davantage la nature de la transition.
- source_word: δότε ὁμολογίαν
  choice: faites confession
  rationale: Le verbe grec signifie littéralement « donnez », mais « donner confession » ne serait pas naturel en français. « Faire confession » conserve la forme nominale et la portée pénitentielle sans ajouter explicitement un objet tel que « vos fautes ».
- source_word: δόξαν
  choice: rendez gloire
  rationale: « Rendre gloire » est l’expression biblique française naturelle correspondant à l’idée de donner la gloire à Dieu. La répétition verbale rend la coordination grecque intelligible en français.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος désigne le Dieu d’Israël; « Seigneur » est l’équivalent consacré et approprié.
- source_word: θεῷ τῶν πατέρων ἡμῶν
  choice: le Dieu de nos pères
  rationale: Conserve la formule d’alliance traditionnelle ainsi que le masculin explicite de πατέρων. « Ancêtres » serait plus courant, mais moins formellement proche.
theological_decisions:
- issue: Sens de ὁμολογίαν dans le contexte pénitentiel
  choice: confession
  alternative: reconnaissance
  rationale: Le contexte appelle à reconnaître une infidélité; « confession » maintient cette portée pénitentielle. La note signale toutefois que le terme grec peut aussi exprimer plus largement une reconnaissance ou un aveu.
- issue: Portée de la formule θεῷ τῶν πατέρων ἡμῶν
  choice: le Dieu de nos pères
  alternative: le Dieu de nos ancêtres
  rationale: La formulation retenue préserve l’expression biblique masculine et relationnelle sans la neutraliser ni lui ajouter une interprétation confessionnelle particulière.
translation_notes:
  register: Français moderne, digne et biblique. « Faites confession » est légèrement soutenu, mais évite l’expression peu naturelle « donnez confession » tout en conservant le substantif grec et son ambiguïté. La virgule finale reflète le caractère manifestement inachevé de l’extrait grec fourni.
