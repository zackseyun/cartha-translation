base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: fr
  text: Le grand prêtre Esdras apporta la Loi à toute la foule[a] — des hommes aux femmes — ainsi qu’à tous les prêtres, afin qu’ils entendent la Loi, à la nouvelle lune du septième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu de Néhémie 8:2–3 diffère ici : il décrit l’auditoire comme les hommes, les femmes et tous ceux qui étaient capables de comprendre, au lieu de mentionner « tous les prêtres ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόμισεν
  choice: apporta
  rationale: Le verbe signifie couramment « apporter » ou « transporter ». « Apporta » reste proche du grec sans donner à l’action une nuance cérémonielle absente du texte.
- source_word: ὁ ἀρχιερεύς
  choice: le grand prêtre
  rationale: « Grand prêtre » est en français le titre naturel et établi correspondant à ἀρχιερεύς; « chef des prêtres » serait moins idiomatique et pourrait suggérer une simple fonction administrative.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Le grec dit simplement « la Loi », et non « le livre de la Loi ». La majuscule signale ici la Torah sans ajouter le mot « livre » provenant du parallèle hébreu.
- source_word: παντὶ τῷ πλήθει
  choice: à toute la foule
  rationale: πλῆθος désigne l’ensemble nombreux qui s’est rassemblé. « Toute la foule » est naturel en français et conserve l’image d’un grand groupe réuni.
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: des hommes jusqu’aux femmes
  rationale: Cette formulation conserve la structure inclusive et explicitement genrée du grec tout en employant le pluriel, plus naturel en français pour désigner les différentes personnes de la foule.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: ainsi qu’à tous les prêtres
  rationale: Le texte grec de Swete porte clairement « tous les prêtres ». « Ainsi qu’à » rend la coordination tout en reliant naturellement ce groupe au verbe « apporta ».
- source_word: ἀκοῦσαι τὸν νόμον
  choice: afin qu’ils entendent la Loi
  rationale: L’infinitif exprime le but. La proposition française explicite que les personnes rassemblées doivent entendre la Loi, sans ajouter la notion de « lecture », seulement implicite dans le contexte.
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: à la nouvelle lune du septième mois
  rationale: νουμηνία désigne la nouvelle lune ou le jour qui lui correspond. La traduction directe préserve le mode grec de datation au lieu de le remplacer par « le premier jour du mois ».
theological_decisions:
- issue: Description genrée de l’auditoire
  choice: des hommes jusqu’aux femmes
  alternative: hommes et femmes
  rationale: Le grec emploie une tournure distributive allant de l’homme à la femme. La traduction en maintient la forme et la portée inclusive sans neutraliser les termes genrés.
- issue: Composition de l’auditoire dans le grec et dans le parallèle hébreu
  choice: ainsi qu’à tous les prêtres
  alternative: ainsi qu’à tous ceux qui étaient capables de comprendre
  rationale: Le grec, témoin principal pour 1 Esdras, mentionne les prêtres. Le parallèle hébreu de Néhémie 8:2–3 présente une lecture sensiblement différente; celle-ci est donc signalée en note plutôt que substituée au texte grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement le grec, tandis que les tirets rendent lisible l’expression distributive sans effacer son caractère marqué. « Loi » et « grand prêtre » emploient le vocabulaire biblique courant sans ajouter d’éléments absents de la source.
