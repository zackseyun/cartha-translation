  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: fr
  text: Et il sera placé au second rang après Darius[a], à cause de sa sagesse, et il sera appelé parent de Darius[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il siégera au second rang après Darius ». Le verbe grec peut évoquer le fait de siéger ou celui d’être établi dans une position officielle.
    reason: lexical_alternative
  - marker: b
    text: « Parent » peut désigner un membre réel de la famille ou un titre honorifique de cour exprimant une faveur royale particulière.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: au second rang après Darius
  rationale: L’adjectif exprime ici l’ordre ou le rang. Cette formulation indique qu’il occupera la place immédiatement inférieure à celle de Darius, sans suggérer une succession temporelle.
- source_word: καθιεῖται
  choice: il siégera
  rationale: Le verbe évoque le fait d’être assis ou établi à une place. « Siégera » conserve l’image de la cour tout en laissant entendre une position officielle.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: à cause de sa sagesse
  rationale: διά suivi de l’accusatif exprime ici la cause; la formulation française en garde clairement la valeur causale.
- source_word: συγγενής
  choice: parent
  rationale: Le terme désigne normalement une personne apparentée, mais peut aussi fonctionner comme un titre honorifique à la cour. « Parent » conserve le langage familial sans trancher entre parenté réelle et statut honorifique.
- source_word: κληθήσεται
  choice: il sera appelé
  rationale: Traduction directe du futur passif de καλέω, qui peut désigner aussi bien une appellation qu’un titre reconnu.
