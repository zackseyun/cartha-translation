base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich;
translation:
  language: fr
  text: Elle donne un même état d’esprit au roi et à l’orphelin, à l’esclave[a] et à l’homme libre, au pauvre et au riche ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur de maison » ; le grec οἰκέτης peut avoir ce sens, mais son opposition à « l’homme libre » indique probablement ici une personne en condition d’esclavage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: donne
  rationale: Dans la tournure « donne un même état d’esprit », ce verbe exprime naturellement en français l’action de rendre identique, tout en conservant la force causative du grec.
- source_word: διάνοιαν μίαν
  choice: un même état d’esprit
  rationale: Cette formulation française naturelle associe l’intériorité exprimée par διάνοια à l’unité marquée par μίαν, sans préciser indûment s’il s’agit de l’intelligence, de l’opinion ou de la disposition.
- source_word: βασιλέως
  choice: roi
  rationale: Équivalent direct et courant du titre grec.
- source_word: ὀρφανοῦ
  choice: orphelin
  rationale: Terme moderne qui restitue clairement la condition sociale vulnérable opposée à celle du roi.
- source_word: οἰκέτου
  choice: esclave
  rationale: Même si οἰκέτης peut désigner un serviteur de maison, son opposition explicite à ἐλεύθερος met ici au premier plan l’absence de liberté juridique et sociale.
- source_word: ἐλευθέρου
  choice: homme libre
  rationale: Cette expression rend clairement le statut social opposé à celui de l’esclave ; le masculin correspond à la série de substantifs masculins grecs employés de façon représentative.
- source_word: πένητος
  choice: pauvre
  rationale: Terme socioéconomique courant qui forme l’opposition naturelle avec « riche ».
- source_word: πλουσίου
  choice: riche
  rationale: Équivalent direct et idiomatique dans le contraste avec le pauvre.
theological_decisions:
- issue: Sens de οἰκέτης dans l’opposition des statuts sociaux
  choice: esclave
  alternative: serviteur de maison
  rationale: L’opposition οἰκέτου…ἐλευθέρου porte directement sur la servitude et la liberté. « Esclave » préserve donc mieux la tension sociale du texte, tandis qu’une note signale l’autre valeur lexicale possible.
translation_notes:
  register: Français international moderne, sobre et digne. « Un même état d’esprit » évite le calque peu naturel « rend la pensée une » tout en conservant l’idée d’unification. La structure ternaire et le point-virgule final du passage source sont maintenus.
