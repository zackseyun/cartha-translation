  source_fidelity: 'Le sens général est fidèle : absence de favoritisme et de distinction, action juste séparée de l’injuste et du mal, approbation universelle de ses œuvres. Cependant, « loin de » est moins naturel comme complément de « elle fait » et atténue la relation de séparation exprimée par ἀπό. La note b actuelle donne en outre « séparée », qui rattache grammaticalement l’adjectif au sujet féminin plutôt que de présenter clairement l’autre compréhension possible des adjectifs grecs substantivés.'
