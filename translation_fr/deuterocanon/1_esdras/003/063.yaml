base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: fr
  text: Auprès d’elle, il n’y a ni favoritisme[a] ni distinction ; elle fait ce qui est juste, à l’écart de tout ce qui est injuste et mauvais[b], et tous approuvent ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « recevoir des visages », expression qui signifie faire preuve de favoritisme ou de partialité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à l’écart de tous les injustes et des méchants ». Le grec peut désigner soit tout ce qui est injuste et mauvais, soit des personnes injustes et mauvaises.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: auprès d’elle
  rationale: Cette expression indique ce qui a cours en relation avec la figure féminine personnifiée dans le contexte. « Auprès d’elle » conserve cette nuance relationnelle sans la réduire à une simple intériorité.
- source_word: λαμβάνειν πρόσωπα
  choice: favoritisme
  rationale: L’expression signifie littéralement « recevoir des visages » et constitue un idiome désignant le fait de favoriser certaines personnes. « Favoritisme » en rend clairement le sens éthique.
- source_word: διαφορά
  choice: distinction
  rationale: En parallèle avec l’absence de favoritisme, le mot évoque ici le fait d’établir une différence entre des personnes. « Distinction » préserve le parallélisme et reste suffisamment ouvert.
- source_word: τὰ δίκαια ποιεῖ
  choice: elle fait ce qui est juste
  rationale: Le neutre pluriel substantivé désigne les choses ou les actes justes. Cette formulation est naturelle en français et conserve la portée morale du grec.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: loin de tout ce qui est injuste et mauvais
  rationale: ἀπό exprime l’éloignement ou la séparation. Le texte principal retient une lecture impersonnelle cohérente avec « ce qui est juste », tandis qu’une note préserve la possibilité que les adjectifs substantivés désignent des personnes.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: approuvent ses œuvres
  rationale: εὐδοκέω peut exprimer le plaisir ou l’approbation. Ici, « approuvent » convient au jugement favorable porté par tous sur ses actes, et « œuvres » maintient le lien formel avec ἔργοις.
theological_decisions:
- issue: Personnification féminine du sujet
  choice: Maintenir le pronom féminin « elle » et le possessif « ses ».
  alternative: Répéter explicitement « la vérité » ou employer une formulation impersonnelle.
  rationale: Les formes grecques sont féminines et le contexte personnifie le sujet. Le maintien du féminin préserve la texture littéraire et théologique sans préciser à nouveau un antécédent absent de ce verset.
- issue: Référent de τῶν ἀδίκων καὶ πονηρῶν
  choice: 'Rendre dans le texte principal par des réalités impersonnelles : « tout ce qui est injuste et mauvais ».'
  alternative: 'Comprendre les adjectifs substantivés comme des personnes : « tous les hommes injustes et mauvais » ou « tous les injustes et les méchants ».'
  rationale: Le contraste immédiat avec « ce qui est juste » favorise une lecture impersonnelle, mais la morphologie grecque permet également un référent personnel ; cette ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement du grec tout en restant naturelle. Les deux notes rendent visibles l’idiome sémitisant et l’ambiguïté entre choses et personnes.
