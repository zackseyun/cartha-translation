  yaml_path: translation/deuterocanon/1_esdras/003/026.yaml
  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: fr
  text: Mais le roi est plus puissant qu’eux, il règne sur eux et il est leur maître ; quoi qu’il leur dise, ils lui obéiront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερισχύει
  choice: est plus puissant qu’eux
  rationale: Rend la supériorité de force exprimée par le verbe grec dans un français naturel, sans l’aplatir en simple victoire ponctuelle.
- source_word: κυριεύει αὐτῶν
  choice: règne sur eux
  rationale: Exprime l’exercice de l’autorité souveraine et conserve la répétition de « sur eux ».
- source_word: δεσπόζει αὐτῶν
  choice: les domine
  rationale: Distingue ce troisième verbe du précédent et traduit l’idée de maîtrise effective sans employer le peu naturel « il est leur maître » dans cette série verbale.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: quoi qu’il leur ordonne
  rationale: Dans le contexte de l’autorité royale et avec ἐνακούσουσιν, « ordonne » explicite naturellement la valeur directive de ce que le roi leur dit.
- source_word: ἐνακούσουσιν
  choice: ils lui obéissent
  rationale: Le contexte exige l’idée d’écouter avec soumission, donc d’obéir ; le présent français exprime ici une vérité générale malgré le futur grec.
