  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: fr
  text: Il rend tous les cœurs riches, ne se souvient ni du roi ni du satrape, et fait tout parler au moyen de talents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre, plus librement : « il fait parler tout le monde d’argent ». Le grec dit littéralement « il fait tout parler au moyen de talents »; les talents étaient des unités de poids servant aussi à exprimer des sommes d’argent.'
    reason: Préserve l’ambiguïté de πάντα et explique l’expression monétaire διὰ ταλάντων.
lexical_decisions:
- source_word: πάσας καρδίας
  choice: tous les cœurs
  rationale: Conserve l’image anthropologique du cœur comme personne intérieure et rend naturellement le pluriel grec.
- source_word: ποιεῖ πλουσίας
  choice: rend … riches
  rationale: Reproduit simplement la construction grecque et maintient l’imagerie économique du contexte.
- source_word: οὐ μέμνηται
  choice: ne se souvient ni
  rationale: Reste proche du sens premier de μιμνήσκομαι, sans expliciter excessivement l’idée contextuelle de ne tenir aucun compte de quelqu’un.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: ni du roi ni du satrape
  rationale: « Satrape » conserve le titre administratif perse et la couleur historique du texte.
- source_word: πάντα
  choice: tout
  rationale: Préserve le neutre pluriel grec et son ambiguïté, même si l’action de parler peut suggérer que les personnes sont visées.
- source_word: διὰ ταλάντων
  choice: au moyen de talents
  rationale: Conserve à la fois la valeur instrumentale possible de διά et le terme monétaire historique « talents »; une formulation plus idiomatique est signalée en note.
- source_word: λαλεῖν
  choice: parler
  rationale: Équivalent français direct et naturel du verbe grec.
