revisions:
- from: 'Ils tuent et sont tués, et ils ne désobéissent pas à l’ordre du roi[a]. S’ils remportent la victoire, ils apportent tout au roi : ce qu’ils ont pillé et tout le reste.'
  to: Ils tuent et sont tués, et ils ne désobéissent pas à l’ordre du roi[a]. S’ils sont victorieux, ils apportent tout au roi, y compris ce qu’ils pillent et tout le reste.
  rationale: La révision conserve le parallélisme du grec, le sens autoritatif de λόγος et la totalité de ce qui est apporté au roi. Elle supprime l’accompli non requis dans « ont pillé » et rend la coordination finale de manière française sans résoudre au-delà du nécessaire son ellipsie syntaxique.
