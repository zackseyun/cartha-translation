  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: fr
  text: Ils tuent et sont tués, et ils ne désobéissent pas à l’ordre du roi[a]. S’ils sont victorieux, ils apportent tout au roi, y compris ce qu’ils pillent et tout le reste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la parole du roi » ; il s’agit ici de son ordre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: Ils tuent et sont tués
  rationale: Cette formulation conserve le parallélisme actif-passif du grec sans introduire l’idée non exprimée qu’ils s’entretuent.
- source_word: τὸν λόγον τοῦ βασιλέως οὐ παραβαίνουσιν
  choice: ils ne désobéissent pas à l’ordre du roi
  rationale: Dans ce contexte militaire, λόγος désigne la parole faisant autorité, donc l’ordre du roi, tandis que παραβαίνω exprime le fait de passer outre ou de désobéir.
- source_word: ἐὰν δὲ νικήσωσιν
  choice: S’ils remportent la victoire
  rationale: Le rendu exprime clairement la victoire militaire et garde la construction conditionnelle du grec.
- source_word: τῷ βασιλεῖ κομίζουσιν πάντα
  choice: ils apportent tout au roi
  rationale: κομίζω indique ici qu’on apporte au roi l’ensemble des biens pris au cours de la campagne.
- source_word: ἐὰν προνομεύσωσιν
  choice: ce qu’ils ont pillé
  rationale: Le verbe rare προνομεύω se rapporte au butin pris à l’avance ou au cours d’une opération de pillage; « piller » est le terme français moderne le plus naturel.
- source_word: καὶ τὰ ἄλλα πάντα
  choice: et tout le reste
  rationale: Cette expression conserve la portée exhaustive de πάντα et distingue le butin explicitement mentionné des autres biens rapportés.
