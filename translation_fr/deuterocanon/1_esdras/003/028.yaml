review_pass:
  verdict: revise
  source_fidelity: La première proposition et l’obéissance à l’ordre royal rendent fidèlement le grec. En revanche, « ce qu’ils ont pillé » introduit un parfait français et présente le pillage comme un fait antérieur, alors que προνομεύσωσιν est une forme conditionnelle/aoristique dont le sens est ici celui des biens pillés. Une formulation nominale ou générique évite cette précision temporelle indue tout en reflétant la coordination elliptique du grec.
  naturalness: Le français est globalement clair et de registre moderne. « S’ils remportent la victoire » est naturel, mais « S’ils sont victorieux » est plus direct et plus proche de νικήσωσιν. La coordination finale est plus fluide sans les deux-points et avec « y compris ».
  terminology: « Ils tuent et sont tués » conserve correctement l’opposition active-passive sans imposer la réciprocité. « Ordre du roi » traduit naturellement λόγος dans ce contexte; la note conserve utilement le littéral « parole du roi ». « Pillent » et « tout le reste » maintiennent le champ lexical militaire et l’ampleur de πάντα.
  issues:
  - severity: medium
    issue: Temps et relation du pillage
    rationale: « Ce qu’ils ont pillé » transforme le grec ἐὰν προνομεύσωσιν en un accompli français et peut suggérer que le pillage précède nécessairement l’apport. Le grec désigne plutôt, dans une coordination elliptique, les biens qu’ils pillent / le butin parmi tout ce qu’ils apportent.
  - severity: low
    issue: Ponctuation explicative ajoutée
    rationale: Les deux-points font de la fin du verset une explication autonome. « y compris » rend plus explicitement et naturellement l’inclusion du butin et du reste dans « tout ».
  revised_text: Ils tuent et sont tués, et ils ne désobéissent pas à l’ordre du roi[a]. S’ils sont victorieux, ils apportent tout au roi, y compris ce qu’ils pillent et tout le reste.
