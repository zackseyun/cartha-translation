  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: fr
  text: Beaucoup périrent, furent égarés et péchèrent à cause des femmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des épouses ». Le grec peut désigner soit des femmes, soit des épouses, selon le contexte.'
    reason: Alternative lexicale authentique de γυναῖκας.
lexical_decisions:
- source_word: ἀπώλοντο
  choice: périrent
  rationale: L’aoriste de ἀπόλλυμι exprime ici le fait d’aller à la ruine ou de périr. « Périrent » reste concis et conserve la gravité du grec sans préciser indûment l’agent.
- source_word: ἐσφάλησαν
  choice: s’égarèrent
  rationale: Le passif de σφάλλω peut évoquer une chute, un faux pas ou le fait d’être induit en erreur. Dans cette série morale, « s’égarèrent » rend naturellement la déviation sans la réduire à une chute physique ni imposer un agent extérieur.
- source_word: ἡμάρτοσαν
  choice: péchèrent
  rationale: Dans ce contexte moral et religieux, « péchèrent » restitue directement la force habituelle de ἁμαρτάνω.
- source_word: διὰ τὰς γυναῖκας
  choice: à cause des femmes
  rationale: διά avec l’accusatif indique ici la cause. γυναῖκας peut désigner des femmes ou des épouses; « femmes » conserve dans le texte principal la portée lexicale la plus large.
theological_decisions:
- issue: Portée potentiellement péjorative et ambiguïté de γυναῖκας
  choice: femmes
  alternative: épouses
  rationale: Le grec peut signifier « femmes » ou « épouses » et la proposition, prise isolément, ne limite pas explicitement le référent aux conjointes. Le texte principal garde donc « femmes », tandis que la note signale l’autre lecture possible sans atténuer ni préciser abusivement la formulation source.
translation_notes:
  register: Français moderne, international et digne. La coordination brève reproduit la progression ternaire du grec. « S’égarèrent » est idiomatique tout en préservant la nuance morale de ἐσφάλησαν.
