base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: fr
  text: Hommes, les femmes ne sont-elles pas fortes ? Grande est la terre, élevé est le ciel, et rapide dans sa course est le soleil, car il tourne dans le cercle du ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il accomplit sa révolution dans le cercle du ciel ».'
    reason: στρέφεται peut évoquer ici un mouvement de révolution plutôt que le simple fait de tourner.
lexical_decisions:
- source_word: Ἄνδρες
  choice: Hommes
  rationale: Vocatif pluriel adressé directement à l’auditoire masculin ; « Hommes » conserve la force rhétorique de l’apostrophe grecque.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: les femmes ne sont-elles pas fortes ?
  rationale: Le contexte invite à comprendre la proposition comme une question rhétorique. « Fortes » rend simplement ἰσχυραί, tandis que l’article français convient à l’emploi générique.
- source_word: μεγάλη ἡ γῆ
  choice: Grande est la terre
  rationale: L’ordre prédicat-sujet conserve le parallélisme et l’élévation rhétorique du grec.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: élevé est le ciel
  rationale: « Ciel » est le terme français naturel dans ce tableau cosmologique ; « élevé » rend ὑψηλός tout en maintenant l’ordre emphatique.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: rapide dans sa course est le soleil
  rationale: δρόμος désigne ici le parcours du soleil. Cette formulation préserve l’image du mouvement et le parallélisme grec.
- source_word: ὅτι στρέφεται
  choice: car il tourne
  rationale: « Car » exprime la valeur explicative ou causale de ὅτι sans alourdir la phrase ; « tourne » reste proche du sens élémentaire de στρέφεται.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: dans le cercle du ciel
  rationale: « Cercle » rend directement κύκλος sans imposer une reconstruction cosmologique plus précise.
