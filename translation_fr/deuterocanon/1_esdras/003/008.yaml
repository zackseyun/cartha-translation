  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: fr
  text: Alors, après avoir chacun écrit sa propre déclaration, ils les scellèrent et les placèrent sous l’oreiller du roi Darius.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous l’appui-tête du roi Darius ». Le grec προσκεφάλαιον peut désigner un oreiller ou un appui-tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: alors
  rationale: Adverbe temporel qui marque l’étape suivante du récit; « alors » est naturel et concis en français.
- source_word: γράψαντες
  choice: après avoir… écrit
  rationale: Le participe aoriste exprime ici une action antérieure aux verbes principaux « scellèrent » et « placèrent ».
- source_word: ἕκαστος
  choice: chacun
  rationale: 'Conserve nettement la valeur distributive: chaque participant rédige sa propre proposition.'
- source_word: τὸν ἑαυτοῦ λόγον
  choice: sa propre déclaration
  rationale: Dans le cadre du concours, λόγος désigne la proposition écrite de chacun; « déclaration » est plus naturel que « parole » et moins interprétatif qu’« argument ».
- source_word: ἐσφραγίσαντο
  choice: ils les scellèrent
  rationale: Le complément, implicite en grec, est explicité par « les » et renvoie aux déclarations écrites.
- source_word: ἔθηκαν
  choice: les placèrent
  rationale: Rend simplement l’action narrative tout en gardant un registre digne.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: sous l’oreiller
  rationale: προσκεφάλαιον peut désigner un oreiller ou un appui-tête; « oreiller » est le terme français courant le plus clair.
- source_word: Δαρείου τοῦ βασιλέως
  choice: du roi Darius
  rationale: Formulation française idiomatique qui rend fidèlement le génitif grec.
