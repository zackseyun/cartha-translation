  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: fr
  text: Il oriente l’esprit de chacun[a] vers les festins et la joie, et l’on ne se souvient d’aucun chagrin ni d’aucune dette[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute pensée » au lieu de « l’esprit de chacun ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aucune obligation ». Le grec désigne littéralement une dette, mais peut s’étendre plus largement à ce qui est dû.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: l’esprit de chacun
  rationale: διάνοια désigne ici l’esprit, la pensée ou la disposition intérieure. « L’esprit de chacun » rend naturellement en français la portée distributive de πᾶσαν sans réduire le terme à une pensée isolée.
- source_word: μεταστρέφει
  choice: oriente
  rationale: Le verbe exprime l’action de tourner ou de faire changer de direction. « Oriente » conserve cette image tout en étant idiomatique avec « l’esprit ».
- source_word: εἰς εὐωχίαν
  choice: vers les festins
  rationale: εὐωχία évoque les repas de fête et les banquets. « Les festins » en garde le caractère concret et joyeux sans introduire la nuance péjorative de la débauche.
- source_word: καὶ εὐφροσύνην
  choice: et la joie
  rationale: εὐφροσύνη désigne la joie ou l’allégresse. « La joie » est clair, naturel et conserve la valeur positive du mot.
- source_word: οὐ μέμνηται
  choice: l’on ne se souvient plus
  rationale: La troisième personne du singulier a ici une portée générale. La tournure impersonnelle française évite d’ajouter un sujet masculin et « plus » exprime naturellement la cessation du souvenir sous l’effet décrit.
- source_word: πᾶσαν λύπην
  choice: d’aucun chagrin
  rationale: λύπη peut désigner le chagrin, la tristesse ou la peine. Après la négation, « aucun chagrin » rend idiomatiquement la totalité exprimée par πᾶσαν.
- source_word: πᾶν ὀφείλημα
  choice: d’aucune dette
  rationale: ὀφείλημα signifie littéralement une dette, c’est-à-dire ce qui est dû. « Dette » préserve ce sens concret, tandis qu’une note signale l’extension possible aux obligations.
