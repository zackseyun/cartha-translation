  yaml_path: translation/deuterocanon/1_esdras/003/036.yaml
  text: But the third[a], the one who spoke about women and about the truth—this was Zorobabel—began to speak,
translation:
  language: fr
  text: Mais le troisième, celui qui avait parlé des femmes et de la vérité — c’était Zorobabel —, se mit à parler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: Mais le troisième
  rationale: « Mais » rend la valeur de transition et de contraste de δέ, tandis que « le troisième » conserve l’ordinal sans ajouter un nom absent du grec.
- source_word: ὁ εἴπας
  choice: celui qui avait parlé
  rationale: Le participe aoriste substantivé désigne l’homme par sa prise de parole antérieure ; le plus-que-parfait exprime naturellement cette antériorité en français.
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: des femmes et de la vérité
  rationale: Après « parler », la construction française « parler de » rend naturellement περί avec le génitif. L’article est conservé devant « vérité ».
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: c’était Zorobabel
  rationale: L’identification parenthétique est formulée au passé pour s’intégrer au récit français, sans modifier sa portée.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: « Zorobabel » correspond directement à la forme grecque et constitue aussi la forme française traditionnelle et reconnaissable ; aucune note de variante n’est donc nécessaire.
- source_word: ἤρξατο λαλεῖν
  choice: se mit à parler
  rationale: Cette tournure française actuelle et digne restitue clairement la valeur inchoative de ἄρχομαι suivi de l’infinitif.
