  text: He said[a], ‘Cut it down,’ and they cut it down; he said, ‘Plant it,’ and they plant it.
translation:
  language: fr
  text: 'Il dit[a] : « Abattez », et ils abattent ; il dit : « Plantez », et ils plantent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise l’objet ni de l’action d’abattre ni de celle de planter.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: il dit
  rationale: L’aoriste de λέγω introduit dans les deux cas la directive royale. « Il dit » conserve la formulation sobre et répétitive du grec sans expliciter davantage la valeur d’ordre.
- source_word: ἐκκόψαι
  choice: Abattez
  rationale: L’infinitif aoriste de ἐκκόπτω exprime ici le contenu de la directive après εἶπεν. « Abattez » rend naturellement l’idée de couper jusqu’à faire tomber, probablement des arbres ou des végétaux, sans ajouter d’objet absent du grec.
- source_word: ἐκκόπτουσιν
  choice: ils abattent
  rationale: Le présent pluriel décrit l’exécution de la directive. La reprise de « abattent » préserve le parallélisme concis du texte source.
- source_word: φυτεῦσαι
  choice: Plantez
  rationale: L’infinitif aoriste de φυτεύω, parallèle à ἐκκόψαι, donne le contenu de la seconde directive. L’impératif français restitue idiomatiquement cette construction.
- source_word: φυτεύουσιν
  choice: ils plantent
  rationale: Le présent pluriel, parallèle à ἐκκόπτουσιν, exprime l’obéissance à la directive tout en maintenant la répétition du grec.
