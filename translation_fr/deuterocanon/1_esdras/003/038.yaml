  text: Women gave birth to the king and to all the people who rule over sea and land;
translation:
  language: fr
  text: Les femmes ont donné naissance au roi et à tout le peuple qui domine la mer et la terre ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ γυναῖκες
  choice: Les femmes
  rationale: Traduction directe du sujet pluriel défini.
- source_word: ἐγέννησαν
  choice: ont donné naissance
  rationale: Rend naturellement l’aoriste de γεννάω dans ce contexte, où les femmes mettent au monde le roi et tous les humains.
- source_word: τὸν βασιλέα
  choice: au roi
  rationale: Complément de « donner naissance à », avec conservation de l’article défini et du titre royal.
- source_word: πάντα τὸν λαὸν
  choice: à tout le peuple
  rationale: Restitue la totalité exprimée par πάντα et le collectif λαός.
- source_word: κυριεύει
  choice: exerce sa domination
  rationale: Conserve la force de κυριεύω, plus marquée que le simple fait de gouverner.
- source_word: τῆς θαλάσσης καὶ τῆς γῆς
  choice: sur la mer et sur la terre
  rationale: Rend les génitifs régis par κυριεύει et conserve la paire cosmographique définie du grec.
theological_decisions:
- issue: Portée du singulier ὃς κυριεύει après le collectif λαόν
  choice: qui exerce sa domination
  alternative: qui exercent leur domination
  rationale: Le singulier grec s’accorde avec le nom collectif singulier « peuple »; le français permet de préserver cette construction sans décider que chaque individu domine séparément.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère collectif du « peuple » et la vigueur du verbe grec. Le point-virgule final signale la continuité avec le verset suivant.
