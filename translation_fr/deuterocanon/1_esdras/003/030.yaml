  yaml_path: translation/deuterocanon/1_esdras/003/030.yaml
  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
translation:
  language: fr
  text: Et lui, s’il est seul[a], s’il dit de tuer, ils tuent ; s’il dit de relâcher[b], ils relâchent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le contexte : « même s’il est seul ». Le grec dit littéralement « s’il est seul » et souligne qu’un seul individu exerce cette autorité.'
    reason: syntactic_alternative
  - marker: b
    text: Ou « laisser aller » ou « pardonner ». Le verbe grec peut prendre ces sens selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς εἰ μόνος ἐστίν
  choice: Et lui, bien qu’il soit seul
  rationale: 'Le pronom αὐτός est emphatique, et εἰ peut ici avoir une valeur concessive dans le contraste : malgré le fait qu’il soit seul, tous exécutent sa volonté. Cette formulation conserve la notion de solitude ou d’unicité sans ajouter explicitement « un homme ».'
- source_word: ἐὰν εἴπῃ
  choice: s’il ordonne
  rationale: Le grec dit littéralement « s’il dit », mais, dans ce contexte d’autorité royale suivie d’une exécution immédiate, « ordonne » exprime naturellement la portée pragmatique de la parole.
- source_word: ἀποκτεῖναι / ἀποκτέννουσιν
  choice: de tuer / ils tuent
  rationale: Cette traduction directe conserve la formulation brève et absolue du grec sans lui donner nécessairement une nuance judiciaire.
- source_word: ἀφεῖναι / ἀφίουσιν
  choice: de relâcher / ils relâchent
  rationale: Le verbe peut signifier laisser aller, libérer, relâcher ou pardonner. « Relâcher » convient à l’opposition avec « tuer » tout en évitant de limiter le sens au pardon juridique.
theological_decisions:
- issue: Valeur de εἰ dans εἰ μόνος ἐστίν
  choice: bien qu’il soit seul
  alternative: s’il est seul
  rationale: Dans l’argument sur la puissance du roi, la proposition souligne paradoxalement qu’un seul individu commande à tous. La lecture concessive rend ce rapport logique tout en étant signalée en note comme une interprétation contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme concis du grec est conservé, avec la répétition de « s’il ordonne » et des verbes correspondants.
