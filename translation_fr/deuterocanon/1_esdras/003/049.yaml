  yaml_path: translation/deuterocanon/1_esdras/003/049.yaml
  text: And many lost their senses because of women[a], and became servants because of them;
translation:
  language: fr
  text: Et beaucoup perdirent la raison à cause des femmes[a] et devinrent esclaves à cause d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « beaucoup s’égarèrent dans leurs propres pensées à cause des femmes ». L’expression grecque est idiomatique et associe un verbe évoquant la perte de la raison à « leurs propres pensées » ou « leur propre esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: perdirent la raison
  rationale: L’expression grecque associe le fait de perdre son bon sens à « leurs propres pensées/esprits ». « Perdirent la raison » en restitue naturellement la force idiomatique, sans surinterpréter le mécanisme précis.
- source_word: διὰ τὰς γυναῖκας
  choice: à cause des femmes
  rationale: διά suivi de l’accusatif exprime ici la cause; cette traduction est claire et conserve la portée générale de γυναῖκας.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne une condition d’assujettissement forte; « esclaves » en préserve mieux la portée que « serviteurs ».
- source_word: ἐγένοντο
  choice: devinrent
  rationale: Le verbe marque simplement un changement d’état.
- source_word: διʼ αὐτάς
  choice: à cause d’elles
  rationale: Le pronom renvoie aux femmes et διά avec l’accusatif garde la même valeur causale; la répétition du grec est ainsi préservée.
theological_decisions:
- issue: Portée de δοῦλοι
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte souligne l’assujettissement. « Esclaves » conserve la force sociale du grec sans atténuation confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise, conserve la répétition causale du grec et signale en note l’ambiguïté de l’expression mentale.
