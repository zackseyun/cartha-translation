lexical_decisions:
- source_word: ἤρξατο λαλεῖν
  choice: se mit à parler
  rationale: Cette tournure française rend naturellement l’aspect inchoatif de ἤρξατο avec l’infinitif λαλεῖν dans un récit.
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: L’article et l’ordinal désignent le deuxième participant; le contexte permet de ne pas ajouter « homme ».
- source_word: ὁ εἴπας
  choice: celui qui avait parlé
  rationale: Le participe aoriste substantivé renvoie à une prise de parole antérieure; le plus-que-parfait explicite naturellement cette antériorité en français.
- source_word: περὶ τῆς ἰσχύος
  choice: de la puissance
  rationale: περί avec le génitif indique le sujet du discours. « Puissance » exprime ici la capacité dominante du roi et convient mieux au contexte que « force », qui pourrait suggérer surtout la vigueur physique.
- source_word: τοῦ βασιλέως
  choice: du roi
  rationale: βασιλεύς désigne directement le roi dans ce cadre de cour.
