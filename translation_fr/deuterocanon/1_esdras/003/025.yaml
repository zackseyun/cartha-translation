  yaml_path: translation/deuterocanon/1_esdras/003/025.yaml
  text: O men[a], do not men prevail, since they rule over the earth and the sea and everything in them?
translation:
  language: fr
  text: Ô hommes, les êtres humains ne l’emportent-ils pas, eux qui dominent la terre, la mer et tout ce qu’elles contiennent ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: Ô hommes
  rationale: Le vocatif masculin pluriel est conservé dans cette adresse solennelle, avec une tournure française compréhensible et digne.
- source_word: οὐχ ὑπερισχύουσιν
  choice: ne l’emportent-ils pas
  rationale: La négation interrogative appelle une réponse affirmative. « L’emporter » rend la supériorité exprimée par ὑπερισχύω sans la réduire à la seule force physique.
- source_word: οἱ ἄνθρωποι
  choice: les êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité en général; cette formulation évite de le confondre avec le vocatif ἄνδρες tout en gardant la portée universelle.
- source_word: κατακρατοῦντες
  choice: eux qui dominent
  rationale: Le participe décrit la maîtrise exercée et fonde l’affirmation précédente. La relative garde ce rapport explicatif sans imposer une causalité plus forte que le grec.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: la terre, la mer
  rationale: Le couple forme une totalité englobante. En français, la coordination sans répéter « et » avant le complément final rend clairement la série régie par « dominent ».
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tout ce qu’elles contiennent
  rationale: Cette expression naturelle restitue la totalité de ce qui se trouve dans la terre et la mer; le pronom féminin pluriel renvoie aux deux noms français.
