  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
translation:
  language: fr
  text: 'Et ils leur dirent : « Faites-nous connaître ce qui a été écrit[a]. » Et le premier, celui qui avait parlé de la force du vin[b], commença et dit ainsi :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faites-nous connaître les écrits ». L’expression grecque peut désigner collectivement les textes soumis au jugement.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la puissance du vin ». Le nom grec peut exprimer la force, la puissance ou le pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατε
  choice: Expliquez-nous
  rationale: Dans le cadre où les écrits doivent être exposés devant l’assemblée, ἀπαγγέλλω exprime l’idée de faire connaître ou de présenter leur contenu. « Expliquez-nous » est naturel en français tout en gardant la portée formelle de l’injonction.
- source_word: περὶ τῶν γεγραμμένων
  choice: ce qui a été écrit
  rationale: Cette formulation conserve la valeur passive et résultative du participe parfait γεγραμμένων sans préciser à tort qui en est l’auteur.
- source_word: ἤρξατο
  choice: commença
  rationale: Équivalent français direct et naturel de ἤρξατο.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: L’ordinal substantivé désigne le premier concurrent ou intervenant.
- source_word: ὁ εἴπας
  choice: celui qui avait parlé
  rationale: Le plus-que-parfait situe correctement cette prise de parole avant le discours qui commence maintenant, tandis que la relative rend naturellement l’apposition grecque.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: de la force du vin
  rationale: ἰσχύς peut désigner la force, la puissance ou le pouvoir. « Force » préserve l’image lexicale et convient au sujet de l’argumentation.
- source_word: ἔφη οὕτως
  choice: commença ainsi
  rationale: La tournure française intègre naturellement ἤρξατο et la formule introductive ἔφη οὕτως, sans le pléonasme peu idiomatique « commença et dit ainsi ».
