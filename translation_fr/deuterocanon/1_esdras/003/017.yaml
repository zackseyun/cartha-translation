translation_notes:
  register: Français international moderne, digne et accessible. La coordination grecque finale est légèrement resserrée en « commença ainsi » pour produire une formule introductive idiomatique, sans perte de sens. Les ambiguïtés de περὶ τῶν γεγραμμένων et de ἰσχύς sont conservées en notes.
