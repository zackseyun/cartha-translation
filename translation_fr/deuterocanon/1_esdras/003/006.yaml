  yaml_path: translation/deuterocanon/1_esdras/003/006.yaml
  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and to have a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: fr
  text: et de se revêtir de pourpre, de boire dans des récipients en or, de dormir sur de l’or[a], et d’avoir un char au harnachement d’or[b], un turban de fin lin et un collier autour du cou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement «dormir sur de l’or»; il s’agit probablement d’un lit ou d’une couche ornée d’or, mais le grec ne nomme aucun meuble.
    reason: lexical_alternative
  - marker: b
    text: Ou «un char au mors d’or»; l’adjectif grec peut viser plus précisément le mors ou la bride du char.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: se revêtir de pourpre
  rationale: Le moyen περιβαλέσθαι exprime le fait de s’envelopper ou de se vêtir; «de pourpre» désigne naturellement une étoffe ou un vêtement pourpre sans ajouter «royale», absent du grec.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: boire dans des récipients en or
  rationale: χρυσώματα désigne ici des objets en or servant à boire, sans préciser s’il s’agit de coupes ou d’un autre type de récipient.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: dormir sur de l’or
  rationale: Cette traduction conserve la formulation grecque condensée et évite d’ajouter explicitement un lit ou une couche.
- source_word: ἅρμα χρυσοχάλινον
  choice: un char au harnachement d’or
  rationale: Le composé χρυσοχάλινος associe l’or au mors ou, plus largement, au harnachement du char; cette formulation française rend l’image sans supposer plusieurs brides.
- source_word: κίδαριν βυσσίνην
  choice: un turban de fin lin
  rationale: κίδαρις désigne une coiffure de type turban, et βύσσινος une étoffe de lin fin.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: un collier autour du cou
  rationale: μανιάκης désigne un ornement cervical, collier, chaîne ou torque; «collier» est naturel et suffisamment large en français moderne.
