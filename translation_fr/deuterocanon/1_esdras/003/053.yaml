  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
translation:
  language: fr
  text: elle retirait le diadème de la tête du roi et se le posait sur la tête, et elle frappait le roi de la main gauche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: elle enlevait ... de
  rationale: Le participe présent poursuit la description d’actions habituelles ou répétées; l’imparfait français en rend naturellement l’aspect descriptif.
- source_word: τὸ διάδημα
  choice: le diadème
  rationale: διάδημα désigne précisément l’insigne royal porté autour ou sur la tête; « diadème » est intelligible en français moderne et plus précis que « couronne ».
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: se le posait sur la tête
  rationale: Le datif αὐτῇ renvoie à la femme elle-même. La mention de la tête, implicite dans le grec après le retrait du diadème de la tête du roi, est explicitée pour obtenir un français naturel et sans ambiguïté.
- source_word: ἐράπιζεν
  choice: elle giflait
  rationale: ῥαπίζω désigne typiquement un coup donné de la main, notamment une gifle; le contexte précise en outre la main gauche.
- source_word: τῇ ἀριστερᾷ
  choice: de la main gauche
  rationale: L’adjectif féminin substantivé sous-entend « main » et exprime ici l’instrument du coup.
- source_word: καὶ ... καὶ
  choice: et ... puis
  rationale: Le premier καί relie cette proposition au contexte précédent; le second coordonne l’action suivante. « puis » rend clairement l’enchaînement sans lui imposer une forte relation logique.
