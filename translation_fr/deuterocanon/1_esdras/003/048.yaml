  text: And a man loves his own wife more than his father and mother.
translation:
  language: fr
  text: Et un homme aime sa propre femme plus que son père et sa mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον ... μᾶλλον ἢ
  choice: plus que
  rationale: La tournure comparative, quelque peu redondante en grec, exprime une différence de degré. Le français naturel la rend simplement par « plus que ».
- source_word: ἀγαπᾷ
  choice: aime
  rationale: « Aime » restitue directement le sens courant de ἀγαπάω sans ajouter la nuance plus particulière de « chérit ».
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Bien que ἄνθρωπος puisse désigner un être humain en général, le contexte parle ici d’un homme par rapport à sa femme; « un homme » conserve cette référence sexuée.
- source_word: τὴν ἰδίαν γυναῖκα
  choice: sa propre femme
  rationale: Dans ce contexte familial, γυνή signifie « femme » au sens d’épouse, tandis que ἰδίαν marque l’appartenance et l’emphase; « sa propre femme » conserve cette nuance.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: son père et sa mère
  rationale: Le possessif, implicite dans le contexte grec, est nécessaire en français idiomatique. Les deux termes sont maintenus plutôt que condensés en « ses parents ».
