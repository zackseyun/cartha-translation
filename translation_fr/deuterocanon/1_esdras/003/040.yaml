  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: fr
  text: Ce sont elles qui confectionnent les vêtements des hommes, ce sont elles qui font la gloire des hommes, et les hommes ne peuvent être sans les femmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exister sans les femmes ». Le verbe grec signifie littéralement « être ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὗται
  choice: ce sont elles
  rationale: Le démonstratif féminin renvoie aux femmes mentionnées dans le contexte précédent. La tournure emphatique française conserve sa répétition et sa force rhétorique.
- source_word: ποιοῦσιν τὰς στολάς
  choice: confectionnent les vêtements
  rationale: Confectionner exprime naturellement la fabrication de vêtements, tandis que « vêtements » rend le pluriel στολάς sans le limiter à des robes d’apparat.
- source_word: ποιοῦσιν δόξαν τοῖς ἀνθρώποις
  choice: font leur gloire
  rationale: Cette expression française naturelle conserve le verbe répété du grec et présente les femmes comme la source de la gloire ou de l’honneur des hommes.
- source_word: οἱ ἄνθρωποι
  choice: les hommes
  rationale: Dans le contraste explicite avec τῶν γυναικῶν, le mot désigne ici les hommes plutôt que l’ensemble de l’humanité.
- source_word: εἶναι χωρὶς τῶν γυναικῶν
  choice: être sans les femmes
  rationale: Cette formulation suit étroitement le grec et demeure compréhensible en français, sans trancher entre l’existence, la vie et la dépendance relationnelle.
theological_decisions:
- issue: Portée de οἱ ἄνθρωποι face à τῶν γυναικῶν
  choice: les hommes
  alternative: les êtres humains
  rationale: Le contexte oppose directement les hommes aux femmes; une formulation générique effacerait cette structure argumentative.
- issue: Portée de εἶναι dans l’affirmation finale
  choice: être sans les femmes
  alternative: exister sans les femmes
  rationale: Le grec emploie le verbe général « être ». La traduction principale en conserve l’ouverture au lieu de réduire la phrase à la seule procréation ou à la seule survie.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « ce sont elles » reproduit l’insistance du grec; « font leur gloire » maintient son parallélisme tout en restant idiomatique.
