revisions:
- from: Ce sont elles qui confectionnent les vêtements des hommes, ce sont elles qui font leur gloire, et les hommes ne peuvent être sans les femmes.[a]
  to: Ce sont elles qui confectionnent les vêtements des hommes, ce sont elles qui font la gloire des hommes, et les hommes ne peuvent être sans les femmes.[a]
  rationale: La révision explicite que la gloire est celle conférée aux hommes, conformément au datif τοῖς ἀνθρώποις, tout en préservant le parallélisme et l’emphase du grec. Elle conserve « être sans les femmes », qui laisse ouverte la portée de εἶναι, et limite la note à une alternative lexicalement fondée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:04:15Z'
review_pass:
  verdict: revise
  source_fidelity: La reprise emphatique « Ce sont elles » rend bien αὗται et le contraste « les hommes / les femmes » correspond au contexte de οἱ ἄνθρωποι et γυναικῶν. « ne peuvent être sans les femmes » conserve heureusement l’indétermination de εἶναι χωρὶς. En revanche, « font leur gloire » laisse grammaticalement entendre que les femmes font leur propre gloire, alors que δόξαν τοῖς ἀνθρώποις attribue la gloire aux hommes (datif).
  naturalness: Le français est globalement moderne et soutenu. « font la gloire des hommes » est plus clair et idiomatique dans ce contexte rhétorique que « font leur gloire », dont le possessif est référentiellement ambigu.
  terminology: « vêtements », « hommes » et « femmes » sont appropriés. La note doit présenter l’alternative directement fondée sur le grec (« exister »), sans ajouter « vivre », qui interprète davantage εἶναι et n’est pas nécessaire pour éclairer la formulation principale.
  issues:
  - severity: medium
    issue: Possessif ambigu dans « font leur gloire »
    rationale: Le grec δόξαν τοῖς ἀνθρώποις signifie littéralement qu’elles font/procurent de la gloire « aux hommes ». En français, « leur gloire » se rattache normalement au sujet féminin immédiatement antécédent (« elles »), ce qui inverse ou obscurcit la relation.
  - severity: low
    issue: La note propose « vivre » pour εἶναι
    rationale: Le verbe εἶναι est littéralement « être »; « exister » est une explicitation possible. « Vivre » resserre le sens et dépasse l’alternative lexicale utile ici.
  revised_text: Ce sont elles qui confectionnent les vêtements des hommes, ce sont elles qui font la gloire des hommes, et les hommes ne peuvent être sans les femmes.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou : « exister sans les femmes ». Le verbe grec signifie littéralement « être ».'
    reason: lexical_alternative
  revision_rationale: La révision explicite que la gloire est celle conférée aux hommes, conformément au datif τοῖς ἀνθρώποις, tout en préservant le parallélisme et l’emphase du grec. Elle conserve « être sans les femmes », qui laisse ouverte la portée de εἶναι, et limite la note à une alternative lexicalement fondée.
