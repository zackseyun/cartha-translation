  source_fidelity: Le texte rend fidèlement la construction répétitive εἶπε + infinitif, suivie d’un présent d’exécution. « Il dit de… et ils… » conserve sans l’expliciter la force directive de la parole royale. « Frapper », « dévaster » et « bâtir » correspondent adéquatement à πατάξαι/τύπτουσιν, ἐρημῶσαι/ἐρημοῦσιν et οἰκοδομῆσαι/οἰκοδομοῦσιν. Le présent français reproduit bien le présent grec, au rythme vif et itératif.
  naturalness: La formulation est naturelle en français moderne soutenu. La répétition de « Il dit » et les points-virgules restituent efficacement le parallélisme concis du grec. « Il dit de frapper » est acceptable et évite d’introduire un impératif en discours direct absent de la formulation source.
