  text: He said to strike, and they strike; he said to lay waste, and they lay waste; he said to build, and they build.
translation:
  language: fr
  text: Il dit de frapper, et ils frappent ; il dit de dévaster, et ils dévastent ; il dit de bâtir, et ils bâtissent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: il dit
  rationale: L’aoriste de λέγω introduit chaque directive. « Il dit » conserve la simplicité et la répétition paratactique du grec, sans expliciter davantage l’idée de commandement.
- source_word: πατάξαι / τύπτουσιν
  choice: frapper / ils frappent
  rationale: Ces deux verbes désignent ici l’action violente ordonnée puis exécutée. La répétition de « frapper » rend clairement le parallélisme, même si le grec emploie deux lexèmes apparentés par le sens plutôt qu’un seul.
- source_word: ἐρημῶσαι / ἐρημοῦσιν
  choice: dévaster / ils dévastent
  rationale: Le verbe signifie rendre désert ou désolé. « Dévaster » est naturel en français moderne, convient au contexte politique ou militaire et permet de reproduire exactement le couple directive-exécution.
- source_word: οἰκοδομῆσαι / οἰκοδομοῦσιν
  choice: bâtir / ils bâtissent
  rationale: Le sens de base est « bâtir ». Le grec n’impose pas ici « rebâtir » ; la formulation retenue évite donc d’ajouter cette précision et maintient la cadence du texte.
theological_decisions:
- issue: Degré d’autorité royale exprimé par εἶπε suivi de l’infinitif
  choice: « Il dit de… et ils… »
  alternative: « Il ordonne de… et ils obéissent » ou « sur sa parole, ils… »
  rationale: La construction montre l’efficacité immédiate de la parole du roi, mais le texte dit littéralement qu’il « dit ». La traduction conserve cette sobriété et laisse la répétition manifester son autorité sans ajouter explicitement l’obéissance.
translation_notes:
  register: Français moderne, sobre et soutenu. La structure répétitive et le présent des verbes d’exécution préservent le rythme vif du grec. Les points-virgules distinguent les trois membres parallèles.
