  yaml_path: translation/deuterocanon/1_esdras/003/033.yaml
  text: and all his people and his forces obey him[a]. Besides this, he himself reclines and eats and drinks and sleeps[b];
translation:
  language: fr
  text: Tout son peuple et toutes ses forces lui obéissent[a]. En outre, lui-même s’allonge, mange, boit et dort[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses armées » au lieu de « toutes ses forces » ; dans ce contexte royal, le grec peut désigner les forces militaires.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « s’allonge » peut aussi signifier « se repose » ou « est couché » ; la mention qu’il mange et boit peut évoquer la posture habituelle à table.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: tous ses sujets
  rationale: Dans ce contexte royal, λαός désigne la population soumise au roi. « Sujets » rend naturellement cette relation sans employer le possessif potentiellement ambigu de « tout son peuple ».
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: toutes ses forces
  rationale: Au pluriel et dans un contexte royal, δυνάμεις désigne vraisemblablement les forces militaires. « Forces » conserve toutefois la largeur du grec; « armées » reste possible.
- source_word: ἐνακούουσιν
  choice: lui obéissent
  rationale: Le verbe signifie ici écouter au sens de prêter attention et se soumettre à l’autorité; « obéir » convient au contexte royal.
- source_word: πρὸς δὲ τούτοις
  choice: En outre
  rationale: Cette formule introduit un élément supplémentaire dans l’argumentation. « En outre » est actuel, concis et fidèle à sa valeur additive.
- source_word: ἀνάκειται
  choice: s’allonge
  rationale: Le verbe peut exprimer le fait d’être couché ou étendu, notamment la posture adoptée à table. « S’allonge » préserve cette image sans imposer exclusivement le cadre d’un repas.
- source_word: ἐσθίει καὶ πίνει καὶ καθεύδει
  choice: mange, boit et dort
  rationale: Cette coordination simple reproduit clairement la succession des verbes grecs au présent; en français, les virgules évitent une accumulation artificielle de « et ».
