  yaml_path: translation/deuterocanon/1_esdras/003/052.yaml
  text: I saw him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: fr
  text: Je le regardais, lui et Apamé, fille de l’illustre[b] Bartacos et concubine du roi, assise à la droite du roi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « admirable » ou « remarquable ». Le grec présente ce qualificatif comme une épithète de Bartacos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεώρουν
  choice: Je le regardais
  rationale: L’imparfait exprime une observation en cours. La forme grecque pouvant être comprise comme une première personne du singulier ou une troisième personne du pluriel, le contexte du discours favorise ici « je ».
- source_word: Ἀπάμην
  choice: Apamé
  rationale: Forme française naturelle du nom propre grec Ἀπάμη, ici à l’accusatif.
- source_word: θυγατέρα
  choice: fille
  rationale: Équivalent direct du terme grec de parenté.
- source_word: Βαρτάκου
  choice: Bartacos
  rationale: Translittération française du nom propre grec.
- source_word: τοῦ θαυμαστοῦ
  choice: l’illustre
  rationale: Dans cette épithète, θαυμαστός qualifie Bartacos comme un homme remarquable ou renommé. « Illustre » est naturel en français et évite de lui attribuer nécessairement une qualité morale.
- source_word: παλλακὴν
  choice: concubine
  rationale: Le mot désigne précisément une concubine, et non simplement une compagne ou une servante.
- source_word: καθημένην
  choice: assise
  rationale: Le participe féminin accusatif se rapporte à Apamé et décrit sa posture.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: à la droite du roi
  rationale: Expression française consacrée qui rend fidèlement la position privilégiée indiquée par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait conserve l’aspect du grec, tandis que « à la droite du roi » maintient l’expression idiomatique de position et de rang.
