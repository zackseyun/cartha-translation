base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: fr
  text: « Messieurs, le roi n’est-il pas grand, les hommes ne sont-ils pas nombreux, et le vin n’est-il pas puissant ? Qui donc les domine, ou qui exerce le pouvoir sur eux ? Ne sont-ce pas les femmes ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: Messieurs
  rationale: Vocatif pluriel de ἀνήρ adressé aux hommes présents. « Messieurs » rend naturellement l’interpellation en français moderne, sans ajouter « d’Israël », absent du grec.
- source_word: μέγας
  choice: grand
  rationale: Équivalent direct qui conserve la simplicité de la question rhétorique et peut évoquer ici la grandeur ainsi que la puissance royale.
- source_word: πολλοὶ οἱ ἄνθρωποι
  choice: les hommes ne sont-ils pas nombreux
  rationale: Bien que ἄνθρωποι puisse désigner les êtres humains en général, « les hommes » maintient le contraste argumentatif immédiat avec les femmes.
- source_word: οἶνος ἰσχύει
  choice: le vin n’est-il pas puissant
  rationale: ἰσχύει signifie être fort ou puissant. « Puissant » est idiomatique à propos de l’effet du vin et préserve l’idée de force sans transformer le verbe en tournure nominale.
- source_word: δεσπόζων
  choice: domine
  rationale: Le participe exprime l’exercice d’une maîtrise sur autrui. « Domine » rend cette force de manière concise et naturelle.
- source_word: κυριεύων
  choice: exerce le pouvoir sur
  rationale: Cette formulation distingue légèrement κυριεύων de δεσπόζων tout en conservant leur parallélisme et leur proximité sémantique.
- source_word: γυναῖκες
  choice: les femmes
  rationale: Sens ordinaire du pluriel ; rien dans le verset ne justifie de le restreindre aux épouses.
theological_decisions:
- issue: Contraste entre les hommes et les femmes
  choice: Conserver « les hommes » puis « les femmes ».
  alternative: Traduire ἄνθρωποι par « les gens » ou « les humains ».
  rationale: Le discours établit ici un contraste rhétorique entre catégories masculines et féminines. Une formulation neutre atténuerait ce mouvement, sans que cela implique une affirmation doctrinale supplémentaire.
- issue: Rapport entre δεσπόζων et κυριεύων
  choice: Les différencier par « domine » et « exerce le pouvoir sur ».
  alternative: Rendre les deux verbes par « règne sur » ou « domine ».
  rationale: Les deux participes sont proches et se renforcent mutuellement. Une légère variation française préserve ce parallélisme sans leur attribuer une distinction théologique rigide.
translation_notes:
  register: Français international moderne, digne et oral, adapté à une série de questions rhétoriques. L’interpellation « Messieurs » est naturelle dans ce contexte discursif ; la syntaxe reste proche du grec sans calque pesant.
