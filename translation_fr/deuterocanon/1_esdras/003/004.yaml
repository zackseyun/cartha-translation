lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la progression temporelle du récit.
- source_word: οἱ τρεῖς νεανίσκοι
  choice: les trois jeunes hommes
  rationale: Rend clairement νεανίσκοι en français moderne, sans suggérer qu’il s’agit d’enfants.
- source_word: οἱ σωματοφύλακες
  choice: les gardes du corps
  rationale: Équivalent français direct du nom composé désignant ceux qui assurent la protection physique d’un souverain.
- source_word: οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως
  choice: chargés de protéger la personne du roi
  rationale: Exprime la fonction continue indiquée par le participe présent et rend idiomatiquement σῶμα dans ce contexte de protection royale.
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: se dirent l’un à l’autre
  rationale: Conserve le verbe « dire » et la formulation distributive du grec, particulièrement pertinente puisqu’ils sont trois.
