base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: fr
  text: Toute la terre invoque la vérité[a], et le ciel la bénit ; toutes les œuvres sont ébranlées et tremblent, et avec elle il n’y a rien d’injuste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut signifier « invoque la vérité » ou « appelle/acclame la vérité » ; le verbe peut décrire l’invocation ou l’acclamation de la vérité personnifiée.
    reason: lexical_alternative
  - marker: b
    text: Dans la dernière proposition, le texte grec porte « avec lui » ou « avec cela » (μετ’ αὐτοῦ), bien que les références précédentes à la vérité soient féminines. La traduction suit le référent indiqué par le contexte.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: Toute la terre
  rationale: Le parallélisme avec « le ciel » donne à γῆ une portée cosmique ; « toute la terre » est naturel et proche du grec.
- source_word: τὴν ἀλήθειαν
  choice: la Vérité
  rationale: Le nom est personnifié dans le passage. La majuscule rend cette personnification perceptible en français sans transformer la Vérité en personnage explicitement défini.
- source_word: καλεῖ
  choice: invoque
  rationale: Avec un complément direct, καλέω peut exprimer l’appel adressé à quelqu’un ou quelque chose. « Invoque » conserve cette orientation vers la Vérité personnifiée, tout en laissant en note l’autre nuance possible, celle de l’acclamation.
- source_word: ὁ οὐρανὸς
  choice: le ciel
  rationale: « Le ciel » correspond naturellement au singulier grec et forme avec « la terre » le couple cosmique du verset.
- source_word: αὐτὴν
  choice: la
  rationale: Le pronom féminin reprend naturellement « la Vérité » et maintient la personnification grecque.
- source_word: εὐλογεῖ
  choice: bénit
  rationale: « Bénir » est l’équivalent biblique usuel d’εὐλογέω et convient au registre élevé du passage.
- source_word: πάντα τὰ ἔργα
  choice: toutes les œuvres
  rationale: Cette traduction reste formellement proche du grec. « Œuvres » peut désigner ici largement les réalités produites ou accomplies, sans préciser qu’il s’agit uniquement des créatures.
- source_word: σείεται καὶ τρέμει
  choice: sont ébranlées et tremblent
  rationale: Le premier verbe est au moyen-passif et le second à l’actif ; cette formulation française préserve la nuance ainsi que le redoublement intensif.
- source_word: μετʼ αὐτοῦ
  choice: auprès d’elle
  rationale: Le sens contextuel renvoie à la Vérité personnifiée. « Auprès d’elle » exprime idiomatiquement μετά avec le génitif, tandis qu’une note signale que le pronom grec transmis est masculin ou neutre, et non féminin.
- source_word: ἄδικον οὐδέν
  choice: rien d’injuste
  rationale: Expression concise et directe qui conserve la valeur morale et juridique d’ἄδικος.
theological_decisions:
- issue: Personnification de la vérité
  choice: Maintenir une référence féminine explicite à « la Vérité »
  alternative: Employer une formulation impersonnelle ou abstraite
  rationale: Le grec reprend ἀλήθεια par le pronom féminin αὐτήν et présente la Vérité comme recevant l’invocation et la bénédiction du cosmos. Le français permet de préserver naturellement cette personnification.
- issue: Discordance du pronom dans la proposition finale
  choice: Traduire selon le référent contextuel féminin, tout en signalant la forme grecque en note
  alternative: Traduire littéralement « auprès de lui » ou corriger silencieusement le grec
  rationale: Le texte transmis porte αὐτοῦ, masculin ou neutre, alors que le référent contextuel apparent, ἀλήθεια, est féminin. La traduction garde la cohérence du passage sans dissimuler l’irrégularité grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation conserve le mouvement ternaire du grec. La personnification est marquée par la majuscule à « Vérité » et par les reprises féminines ; les notes préservent l’ambiguïté lexicale de καλεῖ et l’irrégularité de μετ’ αὐτοῦ.
