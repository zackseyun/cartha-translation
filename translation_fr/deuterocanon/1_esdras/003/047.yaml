  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: fr
  text: il regarde le lion[a] et marche dans l’obscurité ; et chaque fois qu’il vole, arrache ou s’introduit furtivement pour dérober[b], il apporte ce qu’il a pris à la femme qu’il aime[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « observe le lion ». Le verbe grec peut désigner le fait de regarder attentivement ou d’observer.
    reason: lexical_alternative
  - marker: b
    text: Le dernier verbe grec relatif au vol désigne un larcin commis furtivement, notamment en s’introduisant dans une maison.
    reason: lexical_alternative
  - marker: c
    text: Ou « à sa bien-aimée » ou « à son amante ». Le grec désigne une femme aimée dans un sens romantique.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: guette
  rationale: Le verbe désigne un regard attentif ou une observation soutenue. Dans ce contexte de conduite risquée et furtive, « guette » exprime naturellement une observation intentionnelle, tout en signalant en note le sens plus neutre possible.
- source_word: τὸν λέοντα
  choice: le lion
  rationale: L’article grec est conservé, ainsi que le caractère vif de l’image.
- source_word: ἐν σκότει βαδίζει
  choice: marche dans l’obscurité
  rationale: Traduction directe et naturelle qui préserve l’image grecque.
- source_word: κλέψῃ
  choice: vole
  rationale: Le présent français convient à la construction temporelle générale introduite par « chaque fois que ».
- source_word: ἁρπάσῃ
  choice: arrache quelque chose
  rationale: Le verbe exprime une saisie brusque ou violente. « Arrache » en garde la force sans imposer l’idée d’un pillage de grande ampleur.
- source_word: κλωποδυτήσῃ
  choice: s’introduit furtivement pour dérober
  rationale: Ce verbe rare désigne un vol commis en secret, notamment par intrusion. La formulation choisie rend cette précision sans supposer nécessairement une effraction matérielle.
- source_word: ἀποφέρει
  choice: apporte son butin à
  rationale: Le verbe indique qu’il transporte vers la destinataire ce qu’il vient de voler. « Son butin » explicite naturellement en français le complément implicite fourni par le contexte.
- source_word: τῇ ἐρωμένῃ
  choice: la femme qu’il aime
  rationale: Le participe substantivé féminin désigne une femme aimée dans un sens romantique. Cette formulation est claire, actuelle et digne, sans accentuer indûment une nuance sexuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination répétée du grec est conservée, tandis que les trois verbes de vol restent distincts. Le complément implicite de ἀποφέρει est rendu par « son butin » pour éviter en français un pronom sans antécédent explicite.
