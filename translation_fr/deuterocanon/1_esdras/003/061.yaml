base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: fr
  text: Le vin est injuste, le roi est injuste, les femmes sont injustes, tous les fils des hommes[a] sont injustes, et toutes leurs œuvres sont injustes — toutes les choses de cette sorte. Il n’y a en eux[b] aucune vérité, et ils périront dans leur injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « les fils des hommes » : expression grecque idiomatique désignant l’humanité.'
    reason: note culturelle et idiomatique
  - marker: b
    text: « En eux » peut renvoyer aux êtres et aux choses qui viennent d’être énumérés; le grec ne précise pas davantage l’antécédent.
    reason: ambiguïté référentielle
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: injuste(s)
  rationale: La répétition de « injuste » conserve l’anaphore grecque et le lien lexical avec ἀδικίᾳ (« injustice ») à la fin du verset.
- source_word: οἶνος
  choice: le vin
  rationale: Équivalent direct du nom grec, ici personnifié dans le raisonnement.
- source_word: βασιλεύς
  choice: le roi
  rationale: L’article défini grec est conservé; le singulier représente ici la figure du roi.
- source_word: γυναῖκες
  choice: les femmes
  rationale: Le contexte ne limite pas le terme grec aux femmes mariées.
- source_word: υἱοὶ τῶν ἀνθρώπων
  choice: les êtres humains
  rationale: L’expression grecque, littéralement « les fils des hommes », est un idiome collectif désignant l’humanité; « les êtres humains » en communique clairement la portée en français moderne.
- source_word: ἔργα
  choice: œuvres
  rationale: Terme ample qui couvre les actes et les réalisations, tout en restant naturel dans un registre biblique moderne.
- source_word: πάντα τὰ τοιαῦτα
  choice: tout ce qui est de cette sorte
  rationale: Cette formulation rend la valeur qualitative de τοιαῦτα et son rôle récapitulatif sans le réduire à un simple démonstratif.
- source_word: ἀλήθεια
  choice: vérité
  rationale: Équivalent direct, adapté à l’opposition entre vérité et injustice dans ce discours.
- source_word: ἀδικίᾳ
  choice: injustice
  rationale: Ce choix préserve la continuité lexicale avec les occurrences répétées de ἄδικος.
- source_word: ἀπολοῦνται
  choice: ils périront
  rationale: Le futur moyen/passif permet ce rendu intransitif, qui n’ajoute aucun agent de destruction absent du grec.
theological_decisions:
- issue: Portée de l’expression anthropologique υἱοὶ τῶν ἀνθρώπων
  choice: les êtres humains
  alternative: les fils des hommes
  rationale: L’expression est idiomatique et collective. Le rendu choisi transmet sa portée universelle en français actuel, tandis que le littéralisme « les fils des hommes » risquerait d’être compris comme excluant les femmes, déjà mentionnées dans la proposition précédente.
- issue: Référent du pronom αὐτοῖς
  choice: en eux, avec maintien de l’ambiguïté
  alternative: dans toutes ces choses / chez les êtres humains
  rationale: Le pluriel grec peut renvoyer aux éléments ou aux êtres précédemment énumérés sans que le texte précise nettement l’antécédent. Le pronom français conserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. La répétition insistante de « injuste » est volontairement conservée. La structure paratactique du grec est maintenue, avec un tiret pour rendre lisible l’expression récapitulative.
