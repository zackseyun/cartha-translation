review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement l’anaphore de ἄδικος, le lien avec ἀδικίᾳ, le futur non agentif d’ἀπολοῦνται et l’ambiguïté de αὐτοῖς. Toutefois, « les êtres humains » neutralise l’image explicitement masculine de υἱοὶ τῶν ἀνθρώπων (« les fils des hommes »), que le français biblique moderne peut conserver tout en l’expliquant.
  naturalness: La syntaxe est claire et le registre convient au français international moderne. « Toutes les choses de cette sorte » est un peu plus direct et garde mieux le pluriel totalisant de πάντα τὰ τοιαῦτα que « tout ce qui est de cette sorte ».
  terminology: « Injuste », « injustice », « vérité », « œuvres », « le vin » et « le roi » sont des choix cohérents et naturels. « Fils des hommes » conserve l’expression-source sans imposer une interprétation doctrinale.
