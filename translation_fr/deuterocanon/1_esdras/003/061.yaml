    rationale: « Tous les êtres humains » transmet la portée collective, mais ne conserve pas l’expression grecque explicitement formulée « les fils des hommes ». Un rendu idiomatique français avec note permet de préserver à la fois la forme et le sens.
  - severity: low
    issue: Portée plurielle de πάντα τὰ τοιαῦτα
    rationale: « Tout ce qui est de cette sorte » est intelligible, mais « toutes les choses de cette sorte » reproduit plus nettement le pluriel et le caractère récapitulatif de l’original.
  - severity: low
