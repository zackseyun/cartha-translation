  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: fr
  text: En outre, le roi, bouche bée, la contemplait. Si elle rit de lui, il rit lui aussi[a] ; mais si elle se met en colère contre lui, il la flatte pour qu’elle se réconcilie avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si elle rit avec lui, il rit lui aussi. » Le datif grec après « rit » peut exprimer plusieurs types de relation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: En outre
  rationale: Connecteur cumulatif naturel en français moderne, qui ajoute un élément à l’argument.
- source_word: χάσκων τὸ στόμα
  choice: bouche bée
  rationale: Expression française vive et idiomatique qui conserve l’image physique de la bouche ouverte.
- source_word: ἐθεώρει αὐτήν
  choice: la contemplait
  rationale: L’imparfait et « contemplait » rendent l’observation soutenue et captivée suggérée par le contexte.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: Si elle rit à ses dépens, il rit lui aussi
  rationale: « Rire aux dépens de quelqu’un » exprime une lecture possible du datif αὐτῷ, tandis que la répétition de « rit » préserve le parallélisme grec. L’autre sens relationnel possible est signalé en note.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: elle se met en colère contre lui
  rationale: Rend clairement le changement d’attitude hostile exprimé par πικρανθῇ et la direction marquée par ἐπ’ αὐτόν.
- source_word: κολακεύει αὐτήν
  choice: il la flatte
  rationale: Équivalent direct et transparent du comportement destiné à regagner sa faveur.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: pour qu’elle se réconcilie avec lui
  rationale: Conserve le sens relationnel de restauration de l’entente sans préciser indûment comment elle se produit.
