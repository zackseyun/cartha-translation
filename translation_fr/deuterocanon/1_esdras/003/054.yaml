  source_fidelity: 'Le sens général est fidèlement rendu : le roi regarde la femme bouche ouverte, reproduit son rire et cherche à regagner sa faveur lorsqu’elle s’irrite contre lui. Toutefois, « rire à ses dépens » explicite un rire moqueur et dépréciatif plus fortement que ne le fait le datif grec αὐτῷ, dont la relation reste ambiguë (« de lui/à son sujet » ou « avec lui »).'
  naturalness: La phrase est naturelle en français moderne. Le déplacement de « bouche bée » auprès du roi rend plus directement la construction grecque et améliore légèrement le rythme.
  terminology: « Contemplait », « se met en colère », « flatte » et « se réconcilie avec lui » conviennent au registre et aux verbes grecs. « Rire de lui » est une formulation plus sobre que « rire à ses dépens », tout en laissant la note signaler l’autre compréhension possible.
