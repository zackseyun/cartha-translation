  yaml_path: translation/deuterocanon/1_esdras/003/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act this way? And he became silent after saying this.
translation:
  language: fr
  text: « Messieurs[a], le vin ne l’emporte-t-il pas, puisqu’il contraint à agir ainsi ? » Après avoir dit cela, il se tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ô hommes » ou « Hommes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Messieurs
  rationale: Vocatif adressé à un groupe d’hommes. « Messieurs » est une interpellation naturelle et digne en français moderne, sans l’archaïsme de « Ô hommes ».
- source_word: οὐχ ὑπερισχύει
  choice: ne l’emporte-t-il pas
  rationale: Le verbe exprime la supériorité de force ou le fait de prévaloir. Cette tournure française convient à la question rhétorique sans préciser indûment sur quoi le vin l’emporte.
- source_word: ὁ οἶνος
  choice: le vin
  rationale: Équivalent lexical direct.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: puisqu’il contraint à agir ainsi
  rationale: « Contraint » conserve la force de ἀναγκάζει, tandis que l’infinitif impersonnel « agir » rend naturellement le sujet non exprimé de ποιεῖν. « Ainsi » renvoie aux comportements précédemment décrits.
- source_word: καὶ ἐσίγησεν
  choice: il se tut
  rationale: Le passé simple rend clairement l’aoriste narratif et marque naturellement la cessation de la parole.
- source_word: οὕτως εἴπας
  choice: Après avoir dit cela
  rationale: La proposition infinitive exprime l’antériorité du participe aoriste par rapport au verbe principal; « cela » reprend le discours qui vient de s’achever.
