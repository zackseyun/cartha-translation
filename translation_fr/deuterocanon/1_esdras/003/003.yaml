base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/003.yaml
  text: And they ate and drank[a], and when they were filled, they departed. But Darius the king went into his bedchamber and slept[b], and then awoke.
translation:
  language: fr
  text: Ils mangèrent et burent et, une fois rassasiés[a], ils partirent[b]. Mais le roi Darius se retira dans sa chambre à coucher, s’endormit, puis se réveilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant été remplis », c’est-à-dire ayant mangé et bu à satiété.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils se retirèrent ». Le même verbe grec est repris juste après pour le roi Darius, qui se retire dans sa chambre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: ils mangèrent et burent
  rationale: Les deux aoristes expriment simplement les actions successives de manger et de boire, sans nuance festive ajoutée.
- source_word: ἐμπλησθέντες
  choice: une fois rassasiés
  rationale: Le participe désigne concrètement le fait d’avoir mangé et bu à satiété; cette tournure française en conserve aussi la valeur temporelle.
- source_word: ἀνέλυσαν
  choice: ils partirent
  rationale: Dans le contexte d’un repas achevé, le verbe indique que les convives quittèrent les lieux. « Partirent » est clair et naturel.
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: se retira dans sa chambre à coucher
  rationale: Le même verbe prend ici, avec la destination indiquée, le sens de se retirer dans une pièce privée. κοιτών désigne la chambre où l’on dort.
- source_word: ἐκοιμήθη
  choice: s’endormit
  rationale: Dans cette séquence, le verbe peut signifier dormir ou s’endormir; « s’endormit » s’enchaîne naturellement avec le réveil qui suit.
- source_word: ἔξυπνος ἐγένετο
  choice: puis se réveilla
  rationale: L’expression signifie littéralement « devint éveillé ». « Se réveilla » en donne le sens idiomatique, tandis que « puis » marque la progression narrative.
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεύς
  choice: Mais le roi Darius
  rationale: δέ marque ici le passage du groupe des convives à Darius en particulier; « mais » rend ce léger contraste.
