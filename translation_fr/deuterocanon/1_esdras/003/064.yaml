  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: fr
  text: Et dans son jugement il n’y a rien d’injuste. Et elle est la force, le règne, l’autorité et la majesté de tous les âges[a]. Béni soit le Dieu de vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « de tous les âges »; on peut aussi comprendre : « pour toujours et à jamais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: jugement
  rationale: « Jugement » conserve le sens judiciaire du terme sans le réduire à l’idée plus abstraite de justice.
- source_word: αὐτῆς
  choice: son
  rationale: En français, le possessif s’accorde avec « jugement » et ne marque donc pas le genre du référent; le contexte continue néanmoins de présenter la Vérité comme agissante.
- source_word: ἄδικον
  choice: injuste
  rationale: Ce terme rend directement la valeur judiciaire de ἄδικον et s’accorde naturellement avec « jugement ».
- source_word: ἰσχύς
  choice: force
  rationale: « Force » est le correspondant courant et précis de ἰσχύς dans cette série doxologique.
- source_word: βασίλειον
  choice: règne
  rationale: Dans cette énumération d’attributs, « règne » exprime mieux la domination royale que le territoire évoqué par « royaume ».
- source_word: ἐξουσία
  choice: autorité
  rationale: « Autorité » préserve la nuance de pouvoir légitime ou de droit d’exercer le pouvoir.
- source_word: μεγαλειότης
  choice: majesté
  rationale: « Majesté » convient au registre élevé de la doxologie et traduit la grandeur souveraine.
- source_word: τῶν πάντων αἰώνων
  choice: de tous les siècles
  rationale: Cette formulation conserve l’image grecque des âges tout en restant idiomatique dans un registre biblique français moderne.
- source_word: εὐλογητός
  choice: Béni soit
  rationale: « Béni soit » est une formule doxologique française naturelle qui restitue le prédicat εὐλογητός.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: le Dieu de vérité
  rationale: Le génitif est maintenu sans transformer l’expression en « le vrai Dieu », qui infléchirait la syntaxe et le sens.
theological_decisions:
- issue: Personnification de la vérité et référent de αὐτῆς
  choice: Employer « son jugement » et « À elle appartiennent »
  alternative: Employer des formulations impersonnelles telles que « son jugement » puis « c’est là la force… »
  rationale: Le possessif français ne peut signaler le féminin du référent, mais « À elle » rend explicite la personnification féminine portée par les formes grecques et le contexte, sans ajouter de contenu doctrinal.
- issue: Portée de αὕτη devant la série doxologique
  choice: 'Comprendre le féminin comme renvoyant à la Vérité: « À elle appartiennent… »'
  alternative: 'Traduire démonstrativement: « Et voici la force, le règne… » ou « Et telle est la force… »'
  rationale: Le féminin αὕτη reprend naturellement la Vérité personnifiée dans le contexte. La tournure française choisie exprime cette attribution sans résoudre davantage la relation syntaxique que ne le permet le passage.
- issue: Valeur de αἰώνων dans la doxologie
  choice: « de tous les siècles »
  alternative: « pour toujours et à jamais »
  rationale: Le rendu littéral conserve la pluralité des âges exprimée en grec et évite de remplacer l’image par une formule liturgique plus interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence doxologique est préservée par l’énumération « la force, le règne, l’autorité et la majesté ». La personnification de la Vérité est rendue explicitement par « À elle ».
