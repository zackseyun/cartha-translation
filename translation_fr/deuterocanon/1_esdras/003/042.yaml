  yaml_path: translation/deuterocanon/1_esdras/003/042.yaml
  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: fr
  text: Délaissant toutes ces choses, ils restent bouche bée devant elle ; la bouche grande ouverte, ils la contemplent, et tous la choisissent[a] plutôt que l’or, l’argent et toute belle chose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la préfèrent à l’or, à l’argent et à toute belle chose ». Dans cette construction comparative, le verbe grec traduit par « choisissent » peut exprimer une préférence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Délaissant
  rationale: Le participe aoriste d’ἀφίημι exprime ici le fait de laisser de côté ou d’abandonner ce qui précède. « Délaissant » garde la valeur participiale et la force du geste sans alourdir la phrase.
- source_word: ταῦτα πάντα
  choice: toutes ces choses
  rationale: Le neutre pluriel renvoie globalement aux réalités mentionnées auparavant. Cette formulation en conserve l’étendue sans préciser abusivement le référent.
- source_word: εἰς αὐτὴν κέχηναν
  choice: ils restent bouche bée devant elle
  rationale: Le verbe décrit des hommes qui ouvrent grand la bouche sous l’effet de la fascination. « Devant elle » rend naturellement l’orientation exprimée par εἰς αὐτήν.
- source_word: χάσκοντες τὸ στόμα
  choice: la bouche grande ouverte
  rationale: Cette expression conserve l’image corporelle et la répétition insistante du grec après « bouche bée ».
- source_word: θεωροῦσιν αὐτήν
  choice: ils la contemplent
  rationale: θεωρέω désigne un regard soutenu et attentif. « Contemplent » convient à la fascination décrite, dans un registre actuel et digne.
- source_word: αἱρετίζουσιν μᾶλλον ἢ
  choice: la choisissent plutôt que
  rationale: Le verbe signifie choisir et, dans cette construction comparative, implique la préférence. La formulation française préserve à la fois le choix lexical et la comparaison explicite.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: toute belle chose
  rationale: La traduction reste aussi générale que πρᾶγμα et rend directement la qualité exprimée par ὡραῖον, sans réduire le sens à des possessions.
