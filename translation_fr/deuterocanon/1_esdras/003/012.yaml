  yaml_path: translation/deuterocanon/1_esdras/003/012.yaml
  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: fr
  text: 'Le troisième écrivit[a] : « Les femmes sont plus fortes, mais par-dessus tout, la vérité triomphe. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les femmes l’emportent, mais la vérité triomphe de tout. »'
    reason: Alternative lexicale et syntaxique pour Ὑπερισχύουσιν et ὑπὲρ δὲ πάντα νικᾷ.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Le troisième
  rationale: L’article suivi de l’ordinal est substantivé et désigne le troisième participant au concours.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω indique simplement qu’il mit sa réponse par écrit; le passé simple convient au registre narratif biblique moderne.
- source_word: Ὑπερισχύουσιν
  choice: sont plus fortes
  rationale: Le verbe exprime une force supérieure ou le fait de l’emporter. Cette traduction garde une distinction avec νικᾷ dans la proposition suivante.
- source_word: αἱ γυναῖκες
  choice: Les femmes
  rationale: Dans cette maxime générale, γυναῖκες désigne les femmes et non spécifiquement les épouses.
- source_word: ὑπὲρ δὲ πάντα
  choice: mais par-dessus tout
  rationale: La formule introduit un contraste culminant et affirme la suprématie de la vérité sur toute autre puissance.
- source_word: νικᾷ
  choice: triomphe
  rationale: νικάω signifie vaincre ou remporter la victoire. « Triomphe » convient naturellement à la vérité comme sujet et conserve la nuance victorieuse.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: En français, le nom abstrait s’emploie naturellement avec l’article défini, qui correspond aussi à l’article grec.
theological_decisions:
- issue: Portée de l’expression ὑπὲρ δὲ πάντα et relation avec νικᾷ
  choice: mais par-dessus tout, la vérité triomphe
  alternative: mais la vérité triomphe de tout
  rationale: Le grec permet d’entendre soit que la vérité est suprême par-dessus tout, soit qu’elle vainc tout. Le texte principal préserve la place emphatique de ὑπὲρ πάντα, tandis que la note signale l’autre construction possible sans trancher indûment.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un ton narratif soutenu sans archaïsme; la maxime reste concise et mémorable.
