lexical_decisions:
- source_word: ὁ ἕτερος
  choice: L’autre
  rationale: Avec l’article, ἕτερος désigne ici l’autre concurrent dans la séquence. « L’autre » conserve le contraste sans préciser davantage que le grec.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste de γράφω exprime simplement l’action d’écrire; le passé simple convient au registre narratif français.
- source_word: Ὑπερισχύει
  choice: est plus fort
  rationale: ὑπερισχύω exprime une supériorité de force ou de puissance. « Est plus fort » garde la valeur comparative de l’affirmation sans la transformer explicitement en superlatif.
- source_word: ὁ βασιλεύς
  choice: le roi
  rationale: βασιλεύς désigne normalement un roi; cette traduction est précise et naturelle.
