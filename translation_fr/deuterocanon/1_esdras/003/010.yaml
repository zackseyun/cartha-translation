- source_word: ὁ εἷς
  choice: L’un
  rationale: Dans ce contexte, l’expression désigne l’un des concurrents. « L’un » est naturel en français et n’ajoute aucun nom absent du grec.
- source_word: ἔγραψεν
  choice: écrivit
  rationale: L’aoriste rapporte une action ponctuelle dans le récit ; le passé simple convient au registre narratif écrit et dignifié.
- source_word: Ὑπερισχύει
  choice: l’emporte
  rationale: Le verbe exprime la supériorité ou le fait de prévaloir. « L’emporte » rend naturellement cette affirmation sans imposer un superlatif que la forme grecque n’énonce pas explicitement.
- source_word: ὁ οἶνος
  choice: Le vin
  rationale: L’article grec a ici une valeur générique ; le français emploie naturellement l’article défini pour parler du vin comme catégorie.
