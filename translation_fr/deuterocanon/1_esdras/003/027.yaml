base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: fr
  text: Si elle leur dit de se faire la guerre les uns aux autres, ils le font ; mais si elle les envoie contre les ennemis, ils partent et abattent[a] les montagnes, les murailles et les tours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruisent » ou « renversent ». Le verbe grec κατεργάζονται désigne ici une action énergique exercée contre le relief et les fortifications.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Si elle leur dit
  rationale: Le conditionnel au subjonctif présente un cas général. « Dit » reste proche du grec sans renforcer indûment le verbe en « ordonne ».
- source_word: ποιῆσαι πόλεμον
  choice: de se faire la guerre
  rationale: Cette tournure française naturelle rend l’expression grecque « faire la guerre » et, avec le pronom réciproque qui suit, indique qu’ils combattent entre eux.
- source_word: ἕτερος πρὸς τὸν ἕτερον
  choice: les uns aux autres
  rationale: Le pluriel idiomatique français exprime clairement la réciprocité du grec.
- source_word: ποιοῦσιν
  choice: ils le font
  rationale: Le verbe reprend simplement l’instruction précédente, comme en grec.
- source_word: ἐξαποστείλῃ
  choice: elle les envoie
  rationale: « Envoie » rend naturellement l’idée d’envoyer au loin ou en mission, sans la surcharger.
- source_word: πρὸς τοὺς πολεμίους
  choice: contre les ennemis
  rationale: Dans ce contexte militaire, « contre » exprime naturellement l’orientation hostile de πρὸς.
- source_word: βαδίζουσιν
  choice: ils partent
  rationale: Le verbe signifie aller ou marcher. « Partent » convient après « elle les envoie » et n’ajoute pas la précision militaire de « marchent ».
- source_word: κατεργάζονται
  choice: abattent
  rationale: Dans cette énumération de reliefs et de fortifications, « abattent » exprime une action énergique et destructrice tout en conservant l’image étonnante des montagnes.
- source_word: τὰ ὄρη
  choice: les montagnes
  rationale: C’est le sens lexical direct de ὄρη; il est conservé malgré son caractère frappant dans le contexte.
- source_word: τὰ τείχη
  choice: les murailles
  rationale: « Murailles » évoque clairement des ouvrages défensifs et convient à la série militaire.
- source_word: τοὺς πύργους
  choice: les tours
  rationale: « Tours » est le sens ordinaire du terme grec, notamment pour des ouvrages défensifs.
theological_decisions:
- issue: Référent du sujet féminin sous-entendu
  choice: Employer « elle », en référence à la femme mentionnée dans le raisonnement environnant.
  alternative: Répéter « la femme » comme sujet.
  rationale: Les verbes grecs ont un sujet singulier sous-entendu; le contexte immédiat identifie la femme comme référent. Le pronom préserve la cohésion sans introduire d’interprétation supplémentaire.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la répétition sobre et la progression rhétorique du grec, ainsi que l’image difficile des montagnes abattues.
