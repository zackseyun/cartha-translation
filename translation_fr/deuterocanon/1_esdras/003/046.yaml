  text: Un homme prend son épée et part en expédition, pour piller et voler, et pour naviguer sur la mer et sur les fleuves,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαμβάνει
  choice: prend
  rationale: Rend directement l’action de se munir de son arme dans ce contexte.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Conserve le singulier représentatif et la forme masculine du grec.
- source_word: ῥομφαίαν
  choice: épée
  rationale: Terme français courant et naturel; le grec peut désigner une grande épée, mais le contexte n’exige pas cette précision.
- source_word: ἐκπορεύεται ἐξοδεύειν
  choice: part en expédition
  rationale: Cette formulation naturelle réunit l’idée de départ exprimée par ἐκπορεύεται et celle d’expédition ou de campagne portée par ἐξοδεύειν, sans imposer explicitement le sens plus fort de « faire la guerre ».
- source_word: λῃστεύειν
  choice: piller
  rationale: Dans cette série d’actions armées, le verbe évoque le brigandage et la prise violente de biens.
- source_word: κλέπτειν
  choice: voler
  rationale: Rend le sens ordinaire du verbe et maintient sa distinction avec le pillage.
- source_word: εἰς τὴν θάλασσαν πλεῖν καὶ ποταμούς
  choice: naviguer sur la mer et sur les fleuves
  rationale: Expression idiomatique en français qui rend πλεῖν et comprend ποταμούς comme second complément coordonné.
