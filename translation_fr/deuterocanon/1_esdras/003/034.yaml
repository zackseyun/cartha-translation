  yaml_path: translation/deuterocanon/1_esdras/003/034.yaml
  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: fr
  text: Mais eux montent la garde autour de lui ; aucun ne peut s’en aller faire son propre travail, et ils ne lui désobéissent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν
  choice: montent la garde
  rationale: Dans ce contexte, le verbe exprime une surveillance attentive autour du roi ; cette tournure française naturelle conserve l’idée de garde.
- source_word: κύκλῳ περὶ αὐτόν
  choice: autour de lui
  rationale: Les deux expressions grecques renforcent l’idée d’encerclement ; « autour de lui » la rend clairement sans lourdeur redondante.
- source_word: ἕκαστος
  choice: aucun
  rationale: Sous la négation οὐ δύνανται, le sens distributif est que pas un seul d’entre eux ne peut partir.
- source_word: τὰ ἔργα αὐτοῦ
  choice: son propre travail
  rationale: Le possessif renvoie à l’activité propre de chacun ; « propre » explicite naturellement cette valeur distributive en français.
- source_word: παρακούουσιν
  choice: désobéissent
  rationale: Le verbe signifie ici refuser d’écouter ou ne pas obéir ; « désobéir » convient au rapport d’autorité décrit.
