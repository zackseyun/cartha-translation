  text: Quand le roi se réveilla, ils prirent le document, le lui donnèrent, et il le lut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγέρθη
  choice: se réveilla
  rationale: L’aoriste passif est ici employé avec un sens intransitif et désigne le réveil après le sommeil. « Se réveilla » est naturel en français moderne et convient au contexte narratif.
- source_word: λαβόντες
  choice: ils prirent
  rationale: Le participe aoriste est rendu par un verbe conjugué afin de produire une narration française fluide tout en conservant l’antériorité immédiate de l’action.
- source_word: τὸ γράμμα
  choice: le document
  rationale: Dans le contexte, γράμμα désigne l’écrit qui vient d’être rédigé. « Document » évite de suggérer nécessairement une lettre adressée à quelqu’un et préserve la portée assez générale du grec.
- source_word: ἔδωκαν αὐτῷ
  choice: le lui donnèrent
  rationale: Cette formulation rend directement le verbe aoriste et son destinataire, dans un ordre idiomatique en français.
- source_word: ἀνέγνω
  choice: il le lut
  rationale: Le pronom objet, implicite en grec, est explicité en français et renvoie sans ambiguïté au document.
