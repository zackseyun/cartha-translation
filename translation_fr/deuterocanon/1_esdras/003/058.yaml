translation:
  language: fr
  text: Et, de nouveau, il retourne en courant à sa propre place en un seul jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il regagne sa propre place en un seul jour ». Le verbe grec souligne la rapidité du mouvement ; le texte principal conserve donc l’image de la course.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe exprime ici la répétition ou le retour; « de nouveau » s’intègre naturellement au mouvement décrit.
- source_word: ἀποτρέχει
  choice: retourne en courant
  rationale: Le verbe composé évoque un déplacement rapide de retour. Cette formulation conserve l’image vive de la course, contrairement au simple « retourne ».
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: à sa place
  rationale: Le réfléchi ἑαυτοῦ marque l’appartenance du lieu au sujet; en français, « sa place » rend cette nuance sans lourdeur.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: en un seul jour
  rationale: La tournure indique que le trajet s’accomplit dans la durée d’une journée; « un seul » souligne naturellement l’unité temporelle.
