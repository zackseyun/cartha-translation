  text: and to all the satraps and generals and governors under him[a], from India to Ethiopia, in the one hundred twenty-seven satrapies.
translation:
  language: fr
  text: ainsi qu’à tous les satrapes, chefs militaires et gouverneurs locaux qui étaient sous son autorité, depuis l’Inde jusqu’à l’Éthiopie, dans les cent vingt-sept satrapies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les cent vingt-sept provinces ». Le grec emploie un terme administratif perse, rendu ici par « satrapies » en accord avec « satrapes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: satrapes
  rationale: Ce titre administratif perse précis est bien établi en français et conserve la couleur impériale du texte.
- source_word: στρατηγοῖς
  choice: chefs militaires
  rationale: Le terme désigne ici des responsables militaires; « chefs militaires » est naturel et évite de préciser indûment leur grade.
- source_word: τοπάρχαις
  choice: gouverneurs locaux
  rationale: Le mot désigne les dirigeants de districts ou de territoires locaux; cette formulation claire distingue leur fonction de celle des satrapes.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: qui étaient sous son autorité
  rationale: La formulation exprime explicitement leur subordination au roi tout en restant naturelle en français.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: depuis l’Inde jusqu’à l’Éthiopie
  rationale: Cette tournure française restitue fidèlement la formule géographique qui marque l’étendue de l’empire.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: dans les cent vingt-sept satrapies
  rationale: « Satrapies » correspond au terme administratif grec d’origine perse et assure la cohérence avec « satrapes ».
