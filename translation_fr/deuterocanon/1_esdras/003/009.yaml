base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: fr
  text: 'Et ils dirent : « Quand le roi se lèvera, ils lui remettront l’écrit[a]. Celui dont le roi et les trois hauts dignitaires de Perse jugeront la parole plus sage[b] recevra la victoire, comme il est écrit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le document » ou « la lettre ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le propos est plus sage » ou « l’argument est plus sage ». Le grec dit littéralement : « sa parole est plus sage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: se lèvera
  rationale: Le verbe indique ici que le roi se lève, probablement après son sommeil, sans qu’il soit nécessaire de préciser davantage.
- source_word: τὸ γράμμα
  choice: le document
  rationale: Dans ce contexte, γράμμα désigne le texte écrit préparé pour le concours. « Document » est naturel en français et n’implique pas une correspondance privée.
- source_word: κρίνῃ
  choice: jugeront
  rationale: Le verbe exprime une décision fondée sur une évaluation; « juger » conserve cette nuance.
- source_word: μεγιστᾶνες
  choice: hauts dignitaires
  rationale: Le terme désigne de grands personnages de la cour perse; « hauts dignitaires » exprime clairement leur rang en français moderne.
- source_word: Περσίδος
  choice: de Perse
  rationale: Le génitif renvoie ici au royaume ou au milieu politique perse.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: dont la parole est la plus sage
  rationale: « Parole » préserve l’étendue sémantique de λόγος, qui peut désigner la déclaration, le propos ou l’argument du concurrent. Le superlatif français rend naturellement le comparatif grec dans une comparaison entre plusieurs concurrents.
- source_word: τὸ νῖκος
  choice: la victoire
  rationale: Cette traduction correspond directement au sens de νῖκος, tout en laissant le contexte préciser ce que la victoire entraîne.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: La formule rend le parfait passif grec et renvoie à ce qui a été consigné par écrit.
