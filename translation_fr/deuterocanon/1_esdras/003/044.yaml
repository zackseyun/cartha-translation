  source_fidelity: Le grec coordonne « avec la femme » à « il abandonne sa vie » (καὶ μετὰ τῆς γυναικὸς ἀφίησι τὴν ψυχήν) et enchaîne ensuite la triple négation. Le sens principal du projet est fidèle. Toutefois, en français, « abandonner sa vie avec la femme » peut suggérer qu'il quitte sa vie aux côtés d'elle ou une vie commune, plutôt que l'abandon de soi/de sa vie sous l'emprise de cette relation. Une légère réorganisation rend mieux le lien syntaxique grec sans imposer un sens causal.
  naturalness: La majuscule initiale est requise. « Il abandonne sa vie avec la femme » demeure compréhensible, mais « Avec une femme, il abandonne sa vie » est plus direct et évite l'ambiguïté d'attachement de « avec ». La répétition des virgules après chaque membre de « ni… ni… ni… » est inutile en français courant.
  terminology: « Femme » conserve l'ambiguïté légitime de γυνή entre femme et épouse; la note est appropriée. « Vie » est un bon rendu contextuel de ψυχή, avec une note qui préserve les autres acceptions. « Pays natal » convient pour χώρα dans ce contexte.
