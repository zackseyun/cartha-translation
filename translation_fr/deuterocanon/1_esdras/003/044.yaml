  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
translation:
  language: fr
  text: Avec une femme[b], il abandonne sa vie[a] et ne se souvient ni de son père ni de sa mère ni de son pays natal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » ou « sa propre personne ». Le grec emploie ψυχή, terme qui peut désigner la vie, l’âme ou la personne elle-même selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « l’épouse » : le mot grec γυνή peut signifier aussi bien « femme » qu’« épouse », selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: avec la femme
  rationale: Μετά suivi du génitif exprime normalement l’accompagnement ou l’association. « Avec la femme » reste proche du grec sans transformer ce rapport en cause (« à cause de ») ou en bénéficiaire (« pour »).
- source_word: γυνή
  choice: femme
  rationale: Γυνή peut désigner une femme ou une épouse. Le contexte porte plus largement sur le pouvoir exercé par les femmes et n’impose pas le sens juridique d’« épouse » ; une note conserve néanmoins cette possibilité.
- source_word: ἀφίησι
  choice: abandonne
  rationale: Ἀφίημι peut signifier laisser, relâcher ou abandonner. Avec ψυχή, « abandonne sa vie » exprime le renoncement extrême tout en demeurant plus proche de la formulation grecque qu’une paraphrase comme « risque sa vie ».
- source_word: τὴν ψυχήν
  choice: sa vie
  rationale: Ψυχή peut désigner la vie, l’âme ou la personne elle-même. Ici, « vie » est naturel en français et évite d’imposer une distinction métaphysique entre l’âme et le corps. Le possessif est exigé par l’usage français.
- source_word: μέμνηται
  choice: se souvient
  rationale: Le verbe signifie se souvenir ou garder présent à l’esprit. « Se souvient » est l’équivalent français courant et respecte la triple construction négative.
- source_word: χώραν
  choice: pays natal
  rationale: Χώρα peut désigner un territoire, un pays ou une contrée. Dans l’énumération avec le père et la mère, « pays natal » rend clairement le lien personnel à la terre d’origine, sans la connotation politique parfois attachée à « patrie ».
