  text: Alors le roi et les hauts dignitaires se regardaient l’un l’autre, et il commença à parler de la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: hauts dignitaires
  rationale: Le terme désigne les grands personnages ou hauts responsables de la cour. « Hauts dignitaires » convient au contexte royal et reste naturel en français moderne sans suggérer nécessairement une noblesse héréditaire.
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: se regardèrent les uns les autres
  rationale: Avec un sujet pluriel, l’expression a ici un sens réciproque. Cette formulation française rend naturellement l’échange de regards, tandis que l’aoriste narratif français est adapté au récit.
- source_word: ἤρξατο λαλεῖν
  choice: commença à parler
  rationale: Cette tournure rend directement la construction indiquant le début de la prise de parole.
- source_word: τῆς ἀληθείας
  choice: de la vérité
  rationale: L’article grec désigne ici la vérité comme thème précis du discours dans le cadre du concours; l’article défini français préserve cette valeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le pronom « il » est conservé comme dans le grec, où son référent découle du contexte immédiat, sans explicitation interprétative.
