  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: fr
  text: Et quand ils se lèvent après le vin[a], ils ne se souviennent pas de ce qu’ils ont fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « quand ils se lèvent du vin ». L’expression évoque le moment où ils se lèvent après le vin et sous ses effets, sans nécessairement affirmer qu’ils ont complètement dégrisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit ici une circonstance temporelle générale. « Quand » est naturel en français et conserve le sens sans alourdir la phrase avec « chaque fois que ».
- source_word: ἀπὸ τοῦ οἴνου
  choice: après avoir bu du vin
  rationale: Le grec dit littéralement « du vin » dans la construction « se relever du vin ». Cette formulation étant peu naturelle et potentiellement obscure en français, « après avoir bu du vin » explicite sobrement la situation sans affirmer qu’ils sont déjà redevenus sobres.
- source_word: ἐγερθῶσιν
  choice: ils se relèvent
  rationale: Rend le sens concret de ἐγείρω, « se lever, se relever ». Cette traduction évite l’interprétation plus forte « ils dégrisent ».
- source_word: οὐ μέμνηται
  choice: ils ne se souviennent pas
  rationale: Malgré la forme verbale singulière du texte grec transmis, le sujet du contexte est pluriel; le français emploie donc naturellement le pluriel collectif.
- source_word: ἃ ἔπραξαν
  choice: de ce qu’ils ont fait
  rationale: Rend directement la proposition relative et exprime naturellement en français l’action accomplie antérieure à l’absence de souvenir.
