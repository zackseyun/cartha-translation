  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
translation:
  language: fr
  text: Et ils ne se souviennent pas[a], quand ils boivent, de témoigner de l’affection à leurs amis et à leurs frères[b] ; peu après, ils tirent leurs épées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne se souvient pas ». Le verbe grec est au singulier, tandis que la proposition temporelle est au pluriel ; la phrase a probablement une portée générale.'
    reason: grammatical_ambiguity
  - marker: b
    text: Le verbe rendu par « témoigner de l’affection » peut aussi signifier plus concrètement « avoir des gestes affectueux envers » ou, moins probablement ici, « embrasser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: il ne se souvient pas
  rationale: Le verbe grec est au singulier. La traduction conserve ce nombre plutôt que de l’harmoniser silencieusement avec le pluriel de la proposition temporelle.
- source_word: ὅταν πίνωσιν
  choice: quand ils boivent
  rationale: ὅταν suivi du subjonctif exprime ici une circonstance temporelle générale ; « quand ils boivent » est naturel et respecte le pluriel grec.
- source_word: φιλάζειν
  choice: témoigner de l’affection
  rationale: Le verbe évoque une conduite affectueuse sans imposer le sens plus concret et moins certain d’« embrasser ».
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: à ses amis et à ses frères
  rationale: Les datifs désignent les bénéficiaires de l’affection. Les possessifs rendent en français le lien implicite avec le sujet générique, tandis que « frères » conserve le masculin du grec.
- source_word: μετʼ οὐ πολὺ
  choice: peu après
  rationale: Cette locution signifie qu’un bref laps de temps s’écoule ; « peu après » est concis et idiomatique.
- source_word: σπῶνται μαχαίρας
  choice: ils tirent leurs épées
  rationale: L’expression désigne l’action de dégainer des armes ; « tirer leurs épées » est clair en français moderne.
