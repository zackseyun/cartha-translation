  yaml_path: translation/deuterocanon/1_esdras/003/001.yaml
  text: And King Dareios made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia[b],
translation:
  language: fr
  text: Le roi Darius donna un grand banquet[a] à tous ceux qui étaient sous son autorité[b], à tous les membres de sa maison et à tous les grands de Médie et de Perse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grande fête ». Le terme grec désigne un repas officiel donné pour recevoir des invités.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à tous ceux qui étaient sous lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχήν
  choice: banquet
  rationale: Le terme désigne ici un repas donné pour recevoir des invités. « Banquet » convient au cadre royal et reste plus précis que « fête » ou « réception ».
- source_word: τοῖς ὑπʼ αὐτόν
  choice: à tous ceux qui étaient sous son autorité
  rationale: Cette formulation naturelle conserve le rapport hiérarchique exprimé littéralement par « ceux qui étaient sous lui », sans limiter nécessairement le groupe à des sujets politiques.
- source_word: οἰκογενέσιν
  choice: à tous les membres de sa maison
  rationale: Le mot englobe les personnes appartenant à la maison royale, et pas seulement la famille au sens étroit.
- source_word: μεγιστᾶσιν
  choice: à tous les grands
  rationale: « Les grands » rend les personnages de premier rang sans les définir trop précisément comme nobles héréditaires ou comme fonctionnaires.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: de Médie et de Perse
  rationale: Le grec nomme les deux régions, plutôt que les peuples mède et perse.
- source_word: βασιλεὺς Δαρεῖος
  choice: le roi Darius
  rationale: « Darius » est la forme française moderne établie du nom grec Δαρεῖος et demeure immédiatement reconnaissable.
- source_word: ἐποίησεν δοχὴν
  choice: donna un grand banquet
  rationale: En français, « donner un banquet » exprime naturellement l’action d’organiser et d’offrir ce repas officiel.
