  source_fidelity: 'Le texte français rend fidèlement la structure et les trois groupes du grec : tous ceux qui étaient sous l’autorité du roi, tous les membres de sa maison, et tous les grands de Médie et de Perse. « donna un grand banquet » rend naturellement ἐποίησεν δοχὴν μεγάλην sans perte du caractère officiel du repas.'
  naturalness: Français moderne, fluide et d’un registre approprié au contexte royal. « Ceux qui étaient sous son autorité », « membres de sa maison » et « les grands » sont idiomatiques et évitent une précision institutionnelle indue.
  terminology: '« Darius » est la forme française usuelle et acceptable pour Δαρεῖος. « Banquet », « maison » et « grands » correspondent bien respectivement à δοχή, οἰκογενεῖς et μεγιστᾶνες. Les toponymes « Médie » et « Perse » respectent le fait que le grec désigne des régions. Les ancres françaises sont correctement placées : [a] sur « banquet » et [b] sur le groupe rendu par « sous son autorité ». À noter pour la traçabilité בלבד : l’ancre [b] de l’anglais fourni paraît matériellement placée après « Persia », alors que sa note explique τοῖς ὑπʼ αὐτόν ; ce défaut de l’audit anglais ne se retrouve pas dans le français.'
