  to: Et vous devez reconnaître par là que les femmes dominent sur vous. Ne peinez-vous pas et ne travaillez-vous pas durement, et ne donnez-vous pas et n’apportez-vous pas tout aux femmes ?
  rationale: Révision limitée à un rendu plus direct de κυριεύουσιν et à une formulation française plus fluide de la double question, tout en préservant la généralité de « femmes », la nécessité de δεῖ, les deux paires verbales et la force rhétorique du grec.
