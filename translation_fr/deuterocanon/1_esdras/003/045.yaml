  yaml_path: translation/deuterocanon/1_esdras/003/045.yaml
  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: fr
  text: Et vous devez reconnaître par là que les femmes dominent sur vous. Ne peinez-vous pas et ne travaillez-vous pas durement, et ne donnez-vous pas et n’apportez-vous pas tout aux femmes ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: par là
  rationale: Dans le contexte, l’expression introduit une conclusion tirée des exemples précédents. « Par là » conserve cette valeur démonstrative et inférentielle.
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: vous devez reconnaître
  rationale: « Devez » exprime la nécessité portée par δεῖ, tandis que « reconnaître » rend naturellement l’idée d’arriver à constater la conclusion exposée.
- source_word: γυναῖκες
  choice: les femmes
  rationale: Le pluriel grec a ici une portée générale. « Femmes » préserve cette généralité sans limiter le propos aux épouses.
- source_word: κυριεύουσιν ὑμῶν
  choice: exercent leur pouvoir sur vous
  rationale: Cette formulation rend l’exercice de domination ou d’autorité exprimé par κυριεύω, dans un français actuel et digne.
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: peinez-vous, ne travaillez-vous pas durement
  rationale: 'Les deux expressions conservent le redoublement rhétorique grec : la première évoque la peine, la seconde le travail pénible.'
- source_word: πάντα
  choice: tout
  rationale: « Tout » restitue simplement et naturellement la portée globale du neutre pluriel grec.
- source_word: δίδοτε καὶ φέρετε
  choice: donnez-vous pas et n’apportez-vous pas
  rationale: Les deux verbes sont maintenus afin de préserver l’accumulation grecque et la distinction entre donner et apporter.
