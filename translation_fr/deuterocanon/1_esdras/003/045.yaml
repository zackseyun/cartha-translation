translation_notes:
  register: Français moderne international, soutenu sans archaïsme. La question rhétorique et le parallélisme verbal du grec sont conservés. Aucune note n’est nécessaire, puisque « femmes » rend directement le sens général de γυναῖκες dans ce verset.
