  source_fidelity: 'Le sens principal est fidèlement rendu : ἐντεῦθεν introduit une conclusion fondée sur ce qui précède, δεῖ exprime la nécessité, γυναῖκες est générique (« les femmes »), et la double expression πονεῖτε καὶ μοχθεῖτε ainsi que δίδοτε καὶ φέρετε est conservée. Toutefois, « exercer leur pouvoir sur vous » atténue légèrement κυριεύουσιν, qui exprime plus directement une domination ou une souveraineté sur les destinataires.'
  naturalness: Le français est globalement naturel et le rythme interrogatif est bien conservé. « Ne peinez-vous pas, ne travaillez-vous pas durement » est toutefois un peu lourd et répétitif en français moderne, notamment par la répétition de la négation. Une coordination unique rend mieux le parallélisme sans perdre le redoublement rhétorique.
  terminology: « Les femmes » est le choix approprié et ne doit pas être restreint à « épouses ». « Dominer » rend plus directement κυριεύω que « exercer leur pouvoir ». Aucun terme théologique spécialisé n’est en jeu.
