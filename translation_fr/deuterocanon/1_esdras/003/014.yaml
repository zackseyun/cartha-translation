  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
translation:
  language: fr
  text: Puis il envoya convoquer tous les grands de Perse et de Médie, ainsi que les satrapes, les chefs militaires, les dirigeants de districts et les hauts fonctionnaires.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les derniers titres désignent différentes catégories de responsables de l’administration impériale. On pourrait rendre plus littéralement « dirigeants locaux » par « toparques »; le dernier terme grec peut aussi signifier « dignitaires suprêmes » ou, dans un contexte romain, « consuls ».
    reason: cultural_note
lexical_decisions:
- source_word: ἐξαποστείλας ἐκάλεσεν
  choice: il envoya convoquer
  rationale: Le participe aoriste suivi du verbe principal indique qu’il fit partir un message ou des messagers afin de convoquer les dignitaires. Cette tournure française conserve la séquence et sa finalité sans préciser un complément absent du grec.
- source_word: μεγιστᾶνας
  choice: les grands
  rationale: Le terme désigne les personnages les plus importants du royaume. « Les grands » est une expression française historique, concise et digne, qui marque leur rang élevé.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: de Perse et de Médie
  rationale: Formes géographiques françaises usuelles des deux régions nommées dans le grec.
- source_word: σατράπας
  choice: les satrapes
  rationale: Le mot désigne un titre administratif perse précis; le terme historique français « satrapes » en préserve la spécificité.
- source_word: στρατηγοὺς
  choice: les chefs militaires
  rationale: Dans cette liste de dignitaires, le terme désigne des responsables de commandement militaire. « Chefs militaires » évite de lui imposer le grade moderne plus précis de général.
- source_word: τοπάρχας
  choice: les dirigeants de districts
  rationale: Le terme désigne les responsables d’un territoire local. Cette traduction fonctionnelle est plus intelligible que le rare « toparques ».
- source_word: ὑπάτους
  choice: les hauts fonctionnaires
  rationale: Le mot peut désigner des personnages de rang suprême ou, dans d’autres cadres, des consuls. Ici, la traduction générale respecte le contexte perse et évite d’introduire une institution spécifiquement romaine.
