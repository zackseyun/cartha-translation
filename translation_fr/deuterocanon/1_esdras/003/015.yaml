  text: And he sat in the council chamber[a], and the letter was read before them.
translation:
  language: fr
  text: Il prit place dans la salle du conseil[a], et la lettre fut lue devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tribunal », « salle d’audience » ou « cour de justice »; le terme grec désigne une salle officielle où l’on délibère ou traite des affaires judiciaires ou administratives.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: prit place
  rationale: L’aoriste exprime une action narrative simple. « Il prit place » est naturel en français dans un cadre officiel et conserve l’idée qu’il s’assit sans ajouter de précision institutionnelle.
- source_word: χρηματιστηρίῳ
  choice: salle du conseil
  rationale: Le terme désigne un lieu officiel où se traitent des affaires ou se rendent des décisions. « Salle du conseil » reste clair et digne sans imposer un sens exclusivement judiciaire; les autres possibilités sont signalées en note.
- source_word: ἀνεγνώσθη
  choice: fut lue
  rationale: Le passif aoriste signifie simplement que la lettre fut lue. Une lecture à haute voix est vraisemblable dans ce contexte, mais le grec ne l’explicite pas.
- source_word: γράμμα
  choice: lettre
  rationale: Dans ce contexte narratif, le mot désigne naturellement une communication écrite. « Lettre » est plus idiomatique que « écrit » ou « document ».
- source_word: ἐνώπιον αὐτῶν
  choice: devant eux
  rationale: Cette formulation concise correspond directement à l’expression grecque et conserve son registre narratif formel.
