  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: fr
  text: Et maintenant, vous ne me croyez pas. Le roi n’est-il pas grand par le pouvoir qu’il exerce ? Tous les pays ne craignent-ils pas de le toucher[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « de porter la main sur lui ». Le grec dit littéralement : « de le toucher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: croyez
  rationale: Le verbe signifie « croire » ou « faire confiance ». Dans cette argumentation, « vous ne me croyez pas » exprime naturellement le fait que les auditeurs ne sont pas convaincus par les paroles du locuteur.
- source_word: μέγας
  choice: grand
  rationale: μέγας qualifie ici l’importance et la puissance du roi. « Grand » conserve la force rhétorique du grec sans préciser excessivement la nature de cette grandeur.
- source_word: ἐξουσίᾳ
  choice: autorité
  rationale: ἐξουσία désigne l’autorité, le droit ou le pouvoir d’agir. « Autorité » rend ici le pouvoir souverain reconnu du roi.
- source_word: χῶραι
  choice: pays
  rationale: χῶραι désigne des territoires ou des contrées. « Pays » est courant en français et garde la portée géopolitique du terme sans exiger l’idée d’États-nations modernes.
- source_word: εὐλαβοῦνται
  choice: craignent
  rationale: Le verbe peut exprimer la crainte, la prudence ou une retenue mêlée de respect. Ici, « craignent » rend clairement l’intimidation qui empêche d’agir contre le roi.
- source_word: ἅψασθαι
  choice: de le toucher
  rationale: ἅπτομαι signifie directement « toucher » ou « saisir ». La traduction principale conserve ce sens littéral, tandis qu’une note donne l’expression idiomatique probablement visée dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les deux questions rhétoriques sont conservées, de même que la métaphore littérale « toucher », éclairée par une note idiomatique.
