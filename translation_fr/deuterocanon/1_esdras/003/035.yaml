  yaml_path: translation/deuterocanon/1_esdras/003/035.yaml
  text: O men[a], how does the king not prevail, since he is so obeyed? And he was silent.
translation:
  language: fr
  text: « Ô hommes, comment le roi ne l’emporte-t-il pas, puisqu’il est si obéi[a] ? » Et il se tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écouté » ou « entendu ». L’adjectif grec peut désigner quelqu’un que l’on écoute aussi bien que quelqu’un auquel on obéit ; « obéi » est retenu ici parce qu’il s’agit du roi et que le contexte porte sur l’autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ô hommes
  rationale: Le vocatif grec s’adresse explicitement à des hommes au pluriel. « Ô » conserve la solennité et la force rhétorique de l’interpellation.
- source_word: πῶς οὐχ
  choice: comment… ne… pas
  rationale: Dans cette question rhétorique, la tournure française au conditionnel (« comment… ne l’emporterait-il pas ») exprime naturellement l’étonnement et la conclusion attendue, sans transformer la question en simple affirmation.
- source_word: ὑπερισχύει
  choice: l’emporterait
  rationale: Le verbe signifie être plus fort, avoir le dessus ou prévaloir. « L’emporter » convient au contexte de comparaison et n’impose pas l’idée d’une victoire militaire.
- source_word: ὁ βασιλεύς
  choice: le roi
  rationale: Équivalent direct du nom grec.
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction introduit ici la raison qui fonde la question rhétorique.
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: il est à ce point obéi
  rationale: L’adjectif peut qualifier celui qui est écouté ou auquel on obéit. Appliqué au roi dans un développement sur son autorité, « obéi » rend au mieux la nuance contextuelle; « à ce point » restitue l’intensité de οὕτως.
- source_word: καὶ ἐσίγησεν
  choice: Puis il se tut
  rationale: L’aoriste marque la fin de la prise de parole. « Il se tut » est idiomatique en français; « puis » traduit ici la progression narrative portée par καί.
