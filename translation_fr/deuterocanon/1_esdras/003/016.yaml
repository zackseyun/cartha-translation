  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
translation:
  language: fr
  text: 'Et il dit : « Appelez les jeunes hommes, et ils présenteront leurs propos[a]. » On les appela, et ils entrèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « feront connaître leurs déclarations » ou « exposeront leurs arguments ». Le grec λόγους est large et peut désigner des paroles, des déclarations ou des arguments.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: Appelez
  rationale: Impératif aoriste pluriel de καλέω. « Appelez » est direct et naturel, tout en permettant de reprendre le même verbe dans la proposition passive qui suit.
- source_word: τοὺς νεανίσκους
  choice: les jeunes hommes
  rationale: νεανίσκος désigne couramment un jeune homme. Le contexte présente des participants masculins à la cour; cette formulation est précise et naturelle en français moderne.
- source_word: δηλώσουσιν
  choice: ils présenteront
  rationale: Le futur de δηλόω signifie faire connaître ou exposer clairement. Avec λόγους, « présenteront » exprime naturellement l'idée d'exposer publiquement ses propos, sans imposer qu'il s'agisse déjà d'arguments formels.
- source_word: τοὺς λόγους αὐτῶν
  choice: leurs propos
  rationale: λόγοι peut désigner des paroles, des déclarations ou des arguments. « Leurs propos » conserve cette amplitude mieux que « leurs arguments », qui préciserait excessivement le sens.
- source_word: ἐκλήθησαν
  choice: on les appela
  rationale: L'aoriste passif de καλέω est rendu par une tournure française idiomatique qui conserve la répétition du verbe « appeler » employé dans l'ordre précédent.
- source_word: εἰσήλθοσαν
  choice: ils entrèrent
  rationale: L'aoriste de εἰσέρχομαι est rendu de manière concise dans un registre narratif digne.
