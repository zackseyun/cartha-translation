- from: Mais s’ils amassent de l’or, de l’argent et toutes sortes de belles choses, et qu’ils voient une seule femme belle par son apparence et sa beauté[a],
  to: Mais s’ils rassemblent de l’or, de l’argent et toutes les belles choses, et qu’ils voient une seule femme, belle d’apparence et de beauté[a],
  rationale: La révision supprime l’ajout sémantique de « toutes sortes de », emploie un équivalent plus neutre de συναγάγωσιν et reformule la double qualification finale de façon plus fidèle et idiomatique. La note est ajustée pour décrire précisément l’emphase lexicale grecque.
