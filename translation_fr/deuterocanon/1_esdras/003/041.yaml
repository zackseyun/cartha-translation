review_pass:
  verdict: revise
  source_fidelity: Le sens conditionnel et la nuance adversative de ἐὰν δέ sont bien rendus. Toutefois, « toutes sortes de » introduit l’idée de catégories diverses, absente de πᾶν, et « par son apparence » est moins fidèle et moins idiomatique que « d’apparence ». « Rassemblent » rend συναγάγωσιν sans la nuance additionnelle d’accumulation patrimoniale que peut suggérer « amassent ».
  naturalness: La phrase révisée demeure naturelle en français international moderne tout en conservant son caractère volontairement inachevé, puisque le verset se poursuit. « Belle d’apparence et de beauté » préserve le redoublement grec de manière plus fluide que « belle par son apparence et sa beauté ».
  terminology: « Or », « argent », « une seule femme » et « belle » sont appropriés. « Toutes les belles choses » conserve l’ampleur de πᾶν πρᾶγμα ὡραῖον sans ajouter « sortes ».
  issues:
  - severity: medium
    issue: « toutes sortes de belles choses »
    rationale: « Toutes sortes de » ajoute une notion de diversité typologique qui n’est pas exprimée par πᾶν (« toute / chaque »).
  - severity: low
    issue: « belle par son apparence et sa beauté »
    rationale: La préposition « par » suggère plus nettement un moyen ou une cause et alourdit la formule. Le grec juxtapose l’adjectif καλήν et les deux qualifications τῷ εἴδει καὶ τῷ κάλλει.
  - severity: low
    issue: Note explicative imprécise
    rationale: 'Le grec ne « répète » pas exactement la même description : il associe « belle » à deux termes apparentés, « apparence » et « beauté », pour renforcer la description.'
