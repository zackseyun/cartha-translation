  text: But if they gather gold and silver and every beautiful thing[a], and see one woman beautiful in appearance and beauty,
translation:
  language: fr
  text: Mais s’ils rassemblent de l’or, de l’argent et toutes les belles choses, et qu’ils voient une seule femme, belle d’apparence et de beauté[a],
  philosophy: optimal-equivalence
