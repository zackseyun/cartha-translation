lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mais s’ils
  rationale: Rend à la fois la condition introduite par ἐάν et la nuance contrastive de δέ dans un français naturel.
- source_word: συναγάγωσιν
  choice: amassent
  rationale: Le verbe signifie rassembler ou réunir; « amassent » convient particulièrement à l’or, à l’argent et aux biens précieux du contexte.
- source_word: χρυσίον καὶ ἀργύριον
  choice: de l’or, de l’argent
  rationale: Équivalents français usuels et précis des deux matières mentionnées.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: toutes sortes de belles choses
  rationale: Cette formulation idiomatique conserve la portée générale de πᾶν πρᾶγμα et l’idée d’objets beaux ou désirables, sans les réduire explicitement à des possessions.
- source_word: ἴδωσιν
  choice: voient
  rationale: Rendu simple et direct de l’aoriste subjonctif dans la proposition conditionnelle.
- source_word: γυναῖκα μίαν
  choice: une seule femme
  rationale: Conserve la présence explicite de μίαν et souligne le contraste entre l’accumulation de nombreux biens et une femme unique.
- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: belle par son apparence et sa beauté
  rationale: Préserve la formulation redoublée et emphatique du grec concernant l’attrait physique, au lieu de la simplifier.
