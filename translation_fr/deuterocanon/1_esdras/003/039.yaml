  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
translation:
  language: fr
  text: et c’est d’elles qu’ils sont issus[a] ; et ce sont ces femmes[b] qui ont nourri les hommes mêmes qui ont planté les vignes dont provient le vin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie plus littéralement un verbe général : « ils sont venus à l’existence d’elles ». Dans ce contexte, on peut aussi traduire : « ils sont nés d’elles ».'
    reason: lexical_alternative
  - marker: b
    text: Le démonstratif grec est féminin et désigne précisément ces femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: d’elles
  rationale: ἐξ avec le génitif indique ici l’origine. Le pronom renvoie aux femmes mentionnées dans l’argument précédent.
- source_word: ἐγένοντο
  choice: sont nés
  rationale: Dans ce contexte où il est question de l’origine des hommes à partir des femmes, « sont nés » exprime naturellement le sens de γίνομαι, tout en signalant en note la formulation grecque plus large.
- source_word: αὗται
  choice: ces femmes
  rationale: Le démonstratif grec est féminin et renvoie aux femmes. L’explicitation en français préserve la clarté et la force rhétorique du passage.
- source_word: ἐξέθρεψαν
  choice: ont nourri
  rationale: Le verbe désigne l’action de nourrir et peut aussi évoquer le fait d’élever. « Ont nourri » reste proche du grec et convient au contexte.
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: les hommes mêmes qui ont planté
  rationale: La construction avec le pronom suivi du participe est emphatique. « Les hommes mêmes » en restitue l’insistance sans ajouter une idée étrangère.
- source_word: τοὺς ἀμπελῶνας
  choice: les vignes
  rationale: En français courant, « planter des vignes » est plus naturel que « planter des vignobles », tout en désignant les plantations produisant le raisin.
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: dont provient le vin
  rationale: Cette formulation exprime l’origine du vin à partir des vignes et conserve la valeur assez large de γίνεται.
theological_decisions:
- issue: Référent et force rhétorique du démonstratif féminin αὗται
  choice: Expliciter « ces femmes » dans le texte.
  alternative: Traduire seulement par « celles-ci » ou « elles ».
  rationale: Le féminin grec renvoie clairement aux femmes, dont le discours souligne ici le rôle et la priorité. L’explicitation évite une ambiguïté française sans importer une interprétation confessionnelle.
translation_notes:
  register: Français moderne, courant et digne. La ponctuation conserve le caractère continu de la phrase. « Vignes » est préféré à « vignobles » après le verbe « planter ». Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
