  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
translation:
  language: fr
  text: La vérité demeure et est forte pour toujours, et elle vit et triomphe pour toujours et à jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’âge de l’âge », formule intensive exprimant une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: L’article grec et le contexte désignent la vérité comme sujet personnifié; « la vérité » est la formulation française naturelle.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » exprime la permanence tout en conservant le ton élevé et la personnification du grec.
- source_word: ἰσχύει
  choice: reste forte
  rationale: Cette formulation rend l’idée de force durable et distingue ce verbe de κρατεῖ, traduit plus loin par « triomphe ».
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Équivalent français idiomatique de l’expression temporelle grecque.
- source_word: ζῇ
  choice: elle vit
  rationale: Le pronom explicite, naturel en français, maintient la personnification et le parallélisme verbal.
- source_word: κρατεῖ
  choice: triomphe
  rationale: « Triomphe » exprime ici la puissance qui l’emporte, sans le confondre avec ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: pour toujours et à jamais
  rationale: Cette expression française rend l’intensification de la formule grecque, littéralement « pour l’âge de l’âge ».
theological_decisions:
- issue: Personnification de la vérité
  choice: 'Conserver les prédicats personnels : elle demeure, reste forte, vit et triomphe.'
  alternative: 'Transformer la phrase en énoncé abstrait, par exemple : « la vérité est éternelle et puissante ».'
  rationale: L’accumulation des verbes grecs personnifie la vérité. La traduction garde cette force rhétorique sans préciser davantage son statut théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme coordonné et la personnification du texte grec sont conservés; « demeure », « reste forte » et « triomphe » maintiennent la distinction entre les trois verbes de permanence, de force et de victoire.
