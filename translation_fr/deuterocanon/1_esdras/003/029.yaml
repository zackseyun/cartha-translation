base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: fr
  text: Et ceux qui ne servent pas dans l’armée et ne font pas la guerre, mais cultivent la terre, lorsqu’ils sèment, après avoir moissonné, apportent à leur tour au roi un tribut[a] ; et, en contraignant les uns les autres[b], ils apportent au roi les impôts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « apportent au roi » ; l’objet du versement n’est pas exprimé en grec, mais le contexte indique qu’il s’agit d’un paiement dû au souverain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « contraignant l’un l’autre ». La formulation grecque évoque une contrainte réciproque sans en préciser le mécanisme.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  choice: servent dans l’armée
  rationale: Le verbe désigne le service militaire ou la participation à une campagne ; cette formulation française le distingue naturellement de πολεμοῦσιν.
- source_word: πολεμοῦσιν
  choice: font la guerre
  rationale: Cette expression rend directement l’activité guerrière et préserve le parallélisme avec le service dans l’armée.
- source_word: γεωργοῦσιν τὴν γῆν
  choice: cultivent la terre
  rationale: Formulation française courante et digne qui exprime précisément le travail agricole.
- source_word: πάλιν
  choice: à leur tour
  rationale: Dans le fil de l’argumentation, l’adverbe marque que les cultivateurs, eux aussi, sont soumis au roi ; « à leur tour » est plus naturel ici que « de nouveau ».
- source_word: ὅταν σπείρωσιν, θερίσαντες
  choice: lorsqu’ils ont semé et fait la moisson
  rationale: La construction situe la remise au roi après le cycle des semailles et de la moisson, sans alourdir la phrase française.
- source_word: ἀναφέρουσιν
  choice: apportent
  rationale: Le verbe conserve l’image concrète d’une remise à un supérieur ; le contexte fiscal et les compléments en précisent la portée.
- source_word: ἀναγκάζοντες ἕτερος τὸν ἕτερον
  choice: en se contraignant les uns les autres
  rationale: Rend à la fois la valeur circonstancielle du participe, sa force coercitive et l’expression réciproque, sans préciser un mécanisme absent du grec.
- source_word: τοὺς φόρους
  choice: les impôts
  rationale: φόροι désigne ici les prélèvements dus au souverain ; « impôts » est clair en français moderne.
theological_decisions:
- issue: Nature du premier versement royal, dont l’objet n’est pas exprimé en grec
  choice: un tribut
  alternative: leur dû ; un impôt
  rationale: Le contexte exige un objet fiscal en français, mais le grec ne le nomme qu’ensuite avec φόρους. « Un tribut » signale la remise au roi tout en maintenant une distinction avec les « impôts » explicitement mentionnés dans la seconde proposition.
- issue: Portée de la contrainte réciproque
  choice: conserver littéralement l’idée qu’ils se contraignent les uns les autres
  alternative: expliciter qu’ils exercent une pression mutuelle afin d’assurer le paiement
  rationale: Le grec affirme la contrainte réciproque sans en expliquer le fonctionnement ; la traduction préserve cette tension plutôt que d’imposer une interprétation administrative précise.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression du grec tout en évitant un calque maladroit. Les deux notes signalent les seuls endroits où la traduction doit soit suppléer un objet implicite, soit préserver une formulation dont le mécanisme reste ambigu.
