  yaml_path: translation/deuterocanon/1_esdras/003/043.yaml
  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: fr
  text: Un homme quitte son propre père[a], qui l’a élevé, ainsi que son propre pays, et il s’attache à sa propre femme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «abandonne» ou «délaisse». Le verbe grec peut avoir un sens plus fort, mais il décrit probablement ici le départ du père et du pays pour s’attacher à sa femme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Un homme
  rationale: Dans cette maxime sur le mariage, le singulier désigne un homme représentatif; la mention de sa femme confirme ici la référence masculine.
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: son propre père
  rationale: Le réfléchi ἑαυτοῦ souligne l’appartenance personnelle; «son propre père» conserve cette insistance.
- source_word: ἐγκαταλείπει
  choice: quitte
  rationale: Le verbe peut aussi signifier «abandonner» ou «délaisser», mais «quitte» exprime naturellement ici le départ du père et du pays en vue de l’attachement conjugal, sans imposer un blâme moral.
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: qui l’a élevé
  rationale: ἐκτρέφω désigne ici le fait de nourrir et d’élever un enfant; «élevé» est idiomatique et précis en français moderne.
- source_word: τὴν ἰδίαν χώραν
  choice: son propre pays
  rationale: χώρα peut désigner un pays, une terre ou une région; «pays» rend clairement le lieu d’origine, tandis que ἰδίαν justifie «propre».
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: à sa propre femme
  rationale: Dans ce contexte conjugal, γυνή signifie «femme» au sens d’épouse; «propre» conserve l’insistance de ἰδίαν.
- source_word: κολλᾶται
  choice: il s’attache
  rationale: Le verbe exprime une union ou un attachement étroit. «S’attache» est naturel, digne et conserve la force relationnelle sans préciser davantage la nature de l’union.
theological_decisions:
- issue: Référence masculine générique dans une maxime sur le mariage
  choice: Un homme
  alternative: Une personne
  rationale: Bien que ἄνθρωπος puisse avoir un sens humain générique, le scénario formulé est explicitement masculin en raison de «sa femme». La traduction conserve donc cette donnée plutôt que de la neutraliser.
translation_notes:
  register: Français international moderne, naturel et digne. La structure coordonnée et la virgule finale sont conservées, car le verset se poursuit dans le contexte. La répétition de «propre» reflète les formes emphatiques grecques ἑαυτοῦ et ἰδίαν.
