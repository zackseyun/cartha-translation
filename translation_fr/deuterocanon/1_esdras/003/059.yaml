base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: fr
  text: Celui qui fait ces choses n’est-il pas grand ? Et la vérité est grande et plus forte que tout[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui accomplit ces choses ». Le grec laisse son identité implicite ; le contexte plus large peut suggérer Dieu, mais cette proposition ne le nomme pas.
    reason: alternative_reading
  - marker: b
    text: Ou « plus forte que toutes choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: n’est-il pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, dans un registre soutenu mais naturel.
- source_word: μέγας
  choice: grand
  rationale: Rend directement l’idée de grandeur ou d’importance et maintient la répétition avec « la vérité est grande ».
- source_word: ὃς
  choice: celui qui
  rationale: Le pronom relatif est employé substantivement. « Celui qui » conserve la référence personnelle au singulier sans préciser une identité absente du grec.
- source_word: ταῦτα
  choice: ces choses
  rationale: Préserve le pluriel démonstratif renvoyant aux actes précédemment évoqués.
- source_word: ποιεῖ
  choice: fait
  rationale: Équivalent français naturel du verbe général « faire » dans ce contexte.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: Désigne ici la vérité comme réalité ou principe, plutôt que la fidélité personnelle; l’article grec est naturellement conservé en français.
- source_word: ἰσχυροτέρα
  choice: plus forte
  rationale: Préserve clairement la valeur comparative de l’adjectif.
- source_word: παρὰ πάντα
  choice: que tout
  rationale: Expression française naturelle qui conserve la portée universelle de la comparaison; « que toutes choses » reste possible.
theological_decisions:
- issue: Référent de « celui qui fait ces choses »
  choice: Le référent demeure implicite dans le texte principal.
  alternative: Traduire ou comprendre explicitement « Dieu, qui fait ces choses ».
  rationale: Le grec ne nomme pas Dieu dans cette proposition. Même si le contexte plus large peut le suggérer, la traduction ne résout pas cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure interrogative conserve la force rhétorique du grec; la répétition de « grand/grande » est maintenue intentionnellement.
