base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: fr
  text: « Que chacun de nous prononce une parole qui l’emportera[a] ; et celui dont la déclaration se révélera plus sage que celle de l’autre recevra du roi Darius de grands cadeaux et de grandes récompenses de victoire[b], »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une déclaration » pour « une parole » (λόγον) ; le grec peut désigner une parole, une déclaration ou un argument.
    reason: lexical_alternative
  - marker: b
    text: Les « récompenses de victoire » traduisent ἐπινίκια, terme désignant des prix ou des honneurs accordés pour une victoire ; elles sont distinguées ici des « cadeaux » mentionnés juste avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Que chacun de nous prononce
  rationale: Le subjonctif d’exhortation à la première personne du pluriel, associé à l’expression distributive « chacun de nous », est rendu naturellement en français par « Que chacun de nous… ».
- source_word: ἕνα λόγον
  choice: une parole
  rationale: λόγος peut désigner une parole, une déclaration ou un argument. « Une parole » reste proche de la formulation grecque et conserve la brièveté solennelle du défi.
- source_word: ὃς ὑπερισχύσει
  choice: qui l’emportera
  rationale: ὑπερισχύω exprime l’idée de prévaloir ou de se montrer plus fort. « L’emportera » convient au contexte de compétition sans préciser indûment la nature de la victoire.
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ
  choice: celui dont la déclaration paraîtra
  rationale: La construction relative indéfinie désigne celui, quel qu’il soit, dont les propos seront jugés supérieurs. « Paraîtra » rend φανῇ sans transformer explicitement l’évaluation en verdict formel.
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: plus sage que celle de l’autre
  rationale: Le comparatif σοφώτερον est rendu directement par « plus sage » ; le pronom féminin « celle » reprend naturellement « déclaration » et préserve la comparaison avec l’autre concurrent.
- source_word: δώσει αὐτῷ Δαρεῖος ὁ βασιλεὺς
  choice: recevra du roi Darius
  rationale: 'La syntaxe est réorganisée pour un français fluide : la promesse active « le roi Darius lui donnera » est exprimée au passif lexical « recevra du roi Darius », sans changement de sens.'
- source_word: δωρεὰς μεγάλας
  choice: de grands cadeaux
  rationale: δωρεά désigne des dons ou présents. « Grands cadeaux » est clair, courant et proche du grec.
- source_word: ἐπινίκια μεγάλα
  choice: de grandes récompenses de victoire
  rationale: ἐπινίκια désigne des prix, honneurs ou récompenses liés à une victoire. « Récompenses de victoire » maintient la distinction avec les cadeaux précédents.
