base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: fr
  text: et que, sur les recettes fiscales de la Cœlé-Syrie et de la Phénicie[a], une allocation soit soigneusement accordée à ces hommes pour le sacrifice au Seigneur, à Zorobabel, le gouverneur[b], pour des taureaux, des béliers et des agneaux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Cœlé-Syrie » est le nom grec traditionnel de cette région; l’expression signifie littéralement « Syrie creuse ».
    reason: cultural_note
  - marker: b
    text: La construction grecque est condensée. « À Zorobabel, le gouverneur » peut désigner celui qui reçoit ou administre l’allocation, ou constituer une identification en apposition dans le décret.
    reason: alternative_reading
lexical_decisions:
- source_word: φορολογίας
  choice: recettes fiscales
  rationale: Dans la construction ἀπὸ τῆς φορολογίας, le terme désigne ici la source publique dont l’allocation doit être prélevée. « Recettes fiscales » exprime clairement ce sens financier et administratif.
- source_word: κοίλης Συρίας
  choice: Cœlé-Syrie
  rationale: Il s’agit du nom géographique grec conventionnel de la région, et non d’une description à traduire littéralement par « Syrie creuse ».
- source_word: ἐπιμελῶς
  choice: soigneusement
  rationale: L’adverbe souligne le soin et la diligence exigés dans l’octroi de l’allocation.
- source_word: σύνταξιν δίδοσθαι
  choice: une allocation soit accordée
  rationale: σύνταξις désigne une somme ou provision officiellement attribuée. Cette formulation conserve le caractère administratif et la valeur passive de δίδοσθαι.
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: à ces hommes
  rationale: Le masculin pluriel grec renvoie dans le contexte à des responsables ou membres du personnel du temple; le français garde cette précision de genre.
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: pour les sacrifices offerts au Seigneur
  rationale: εἰς marque la destination de l’allocation. Le pluriel français convient naturellement aux différents animaux énumérés, tandis que « au Seigneur » rend le datif τῷ κυρίῳ sans surinterpréter le titre divin.
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: à Zorobabel, le gouverneur
  rationale: Le datif est conservé afin de ne pas trancher abusivement la relation syntaxique comprimée; ἐπάρχῳ identifie le titre de Zorobabel.
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: taureaux, de béliers et d’agneaux
  rationale: Les trois catégories d’animaux sacrificiels sont rendues distinctement. « pour l’achat de » explicite sobrement la destination matérielle de l’allocation impliquée par le contexte.
theological_decisions:
- issue: Traduction de κύριος dans le contexte sacrificiel judéen
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κυρίῳ. « Seigneur » traduit directement le titre grec sans reconstruire dans le corps du texte un éventuel tétragramme hébreu sous-jacent.
- issue: Genre de ἀνθρώποις
  choice: ces hommes
  alternative: ces personnes
  rationale: La forme grecque est masculine plurielle et désigne vraisemblablement ici des responsables masculins; « ces hommes » conserve cette donnée.
- issue: Relation syntaxique de Ζοροβάβελ ἐπάρχῳ
  choice: maintien de « à Zorobabel, le gouverneur » dans le texte
  alternative: faire de Zorobabel explicitement l’administrateur ou le seul bénéficiaire de l’allocation
  rationale: La syntaxe grecque est comprimée et permet plusieurs analyses. La traduction conserve le datif et ajoute une note plutôt que de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et administratif, adapté au style d’un décret. « Allocation » évite l’ambiguïté de « soutien » et correspond au financement officiel. La ponctuation maintient l’ambiguïté réelle autour de Zorobabel; tous les appels de note figurent dans le texte.
