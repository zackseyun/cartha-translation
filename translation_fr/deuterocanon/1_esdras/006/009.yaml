base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/009.yaml
  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: fr
  text: avec des pierres de taille coûteuses, du bois placé dans les bâtiments, ces travaux étant exécutés avec diligence[a], et l’ouvrage progressant sous leurs mains, le tout étant achevé avec beaucoup de splendeur[b] et de soin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec empressement » ou « en toute hâte » ; l’expression grecque peut souligner aussi bien l’urgence que le zèle attentif.
    reason: lexical_alternative
  - marker: b
    text: Ici, « splendeur » traduit un mot qui signifie souvent « gloire » ; dans ce contexte, il évoque probablement la magnificence de l’ouvrage.
    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: des pierres de taille coûteuses
  rationale: ξυστός désigne ici des pierres travaillées ou taillées, et πολυτελής leur caractère coûteux ou précieux. « Pierres de taille coûteuses » convient naturellement au contexte architectural.
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: du bois placé dans les bâtiments
  rationale: ξύλον désigne le bois de construction; τιθεμένων exprime sa mise en place; οἴκοις renvoie ici aux bâtiments ou structures plutôt qu’à des maisons particulières.
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: ces travaux étant exécutés avec diligence
  rationale: σπουδή peut exprimer la diligence, l’empressement ou la hâte. « Avec diligence » conserve l’idée d’une exécution énergique et sérieuse sans imposer celle de précipitation.
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: l’ouvrage progressant entre leurs mains
  rationale: εὐοδόω indique que l’ouvrage réussit, prospère ou avance favorablement. « Progressant entre leurs mains » préserve l’image grecque tout en restant idiomatique en français.
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: le tout étant achevé avec beaucoup de splendeur et de soin
  rationale: Dans ce contexte architectural, δόξα évoque vraisemblablement la splendeur ou la magnificence; ἐπιμέλεια désigne le soin attentif, et συντελέω l’achèvement.
