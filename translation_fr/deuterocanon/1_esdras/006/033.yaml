base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/033.yaml
  text: I, King Darius, have decreed that this be done carefully according to these instructions.
translation:
  language: fr
  text: Moi, le roi Darius, j’ai décrété que cela soit exécuté avec soin conformément à ces dispositions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ces choses » ; l’expression renvoie aux dispositions précédentes du décret de Darius.'
    reason: Préciser le sens littéral et le référent contextuel de κατὰ ταῦτα.
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi
  rationale: Le pronom explicite est conservé pour rendre l’insistance de l’auto-identification royale.
- source_word: βασιλεὺς Δαρεῖος
  choice: le roi Darius
  rationale: Cette apposition est naturelle en français et conserve à la fois le titre royal et le nom propre.
- source_word: δεδογμάτικα
  choice: j’ai décrété
  rationale: Le parfait exprime une décision royale officiellement arrêtée et toujours en vigueur.
- source_word: ἐπιμελῶς
  choice: avec soin
  rationale: L’expression rend clairement l’idée d’une exécution attentive et rigoureuse, sans suggérer surtout le zèle.
- source_word: κατὰ ταῦτα
  choice: conformément à ces dispositions
  rationale: Dans le contexte du décret, le démonstratif renvoie aux mesures énoncées précédemment. « Dispositions » convient au registre administratif tout en évitant une formulation française obscure.
- source_word: γίνεσθαι
  choice: que tout soit exécuté
  rationale: L’infinitif vise ici la mise en œuvre des mesures ordonnées. Cette formulation française exprime naturellement la portée impersonnelle du grec.
