base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: fr
  text: Nous les avons donc interrogés afin de pouvoir t’informer et t’écrire quels étaient les hommes qui dirigeaient[a] ; et nous leur avons demandé la liste des noms de ceux qui étaient à leur tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui faisaient le récit ». Le participe grec peut désigner ceux qui conduisent ou ceux qui présentent un exposé ; dans ce contexte, il s’agit probablement des responsables des travaux.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit vraisemblablement d’un registre officiel recensant les responsables qui supervisaient les travaux.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: nous les avons interrogés
  rationale: Le verbe exprime ici une demande formelle dans le cadre d’une enquête administrative ; « interrogés » rend mieux cette nuance que le simple « demandé ».
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι καὶ γράψαι σοι
  choice: afin de pouvoir t’informer et t’écrire
  rationale: 'Cette formulation française naturelle conserve la valeur de but de la construction grecque et les deux actions distinctes : faire savoir et écrire.'
- source_word: τοὺς ἀνθρώπους τοὺς ἀφηγουμένους
  choice: quels étaient les hommes qui dirigeaient
  rationale: Le grec appelle à identifier les hommes concernés. Le participe ἀφηγουμένους peut évoquer le fait de conduire ou de présenter un récit ; le contexte administratif favorise ici l’idée de direction, tandis qu’une note conserve l’autre possibilité.
- source_word: ὀνοματογραφίαν
  choice: la liste des noms
  rationale: Ce terme rare désigne une consignation écrite des noms. « Liste des noms » est clair et idiomatique en français moderne.
- source_word: τῶν προκαθηγουμένων
  choice: de ceux qui étaient à leur tête
  rationale: Cette expression conserve l’image relationnelle du grec, qui désigne ceux qui président ou sont placés à la tête des autres.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier rend le σοι grec adressé au destinataire de la lettre. Le point-virgule distingue les deux démarches administratives sans alourdir la phrase.
