revisions:
- from: Et moi, j’ai aussi ordonné de la reconstruire entièrement et de veiller[a] à ce qu’ils travaillent avec ceux qui reviennent de la captivité de Judée[b], jusqu’à ce que la maison du Seigneur soit achevée.
  to: Et moi, j’ai aussi ordonné que la reconstruction soit entièrement achevée et veillé[a] à ce qu’ils collaborent avec les exilés de Judée[b], jusqu’à l’achèvement de la maison du Seigneur.
  rationale: La révision retire l’idée non exprimée de retour de captivité et remplace le pronom anticipatif par « la reconstruction », plus naturel en français. Elle maintient l’ambiguïté du sujet de « ils » comme le grec le fait, ainsi que la portée de l’ordre jusqu’à l’achèvement de la maison.
