base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: fr
  text: Et moi, j’ai aussi ordonné que la reconstruction soit entièrement achevée et veillé[a] à ce qu’ils collaborent avec les exilés de Judée[b], jusqu’à l’achèvement de la maison du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie littéralement « regarder attentivement »; il a ici le sens administratif de « veiller à » ou « s’assurer que ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui sont issus de la captivité de Judée ».'
    reason: lexical_clarification
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: Et moi, j’ai aussi
  rationale: Cette formulation conserve à la fois la continuité marquée par δέ, l’insistance sur le locuteur et la valeur additive de κἀγώ, dans un français naturel.
- source_word: ἐπέταξα
  choice: j’ai ordonné
  rationale: Le verbe exprime un commandement donné avec autorité; « ordonné » convient au contexte royal sans transformer explicitement l’ordre en décret formel.
- source_word: ὁλοσχερῶς οἰκοδομῆσαι
  choice: de la reconstruire entièrement
  rationale: ὁλοσχερῶς souligne l’achèvement intégral des travaux. « Reconstruire » explicite naturellement le contexte de restauration de la maison, tandis que le pronom reprend celle-ci par anticipation.
- source_word: ἀτενίσαι
  choice: de veiller
  rationale: Le sens premier est « regarder fixement, attentivement »; dans cet ordre administratif, « veiller » rend l’idée de surveillance attentive et d’action pour que la consigne soit exécutée.
- source_word: ἵνα συνποιῶσιν
  choice: à ce qu’ils travaillent avec
  rationale: Le composé exprime une action menée conjointement. « Travaillent avec » conserve le caractère concret de la collaboration sans préciser indûment qu’il s’agit seulement d’une aide secondaire.
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: avec ceux qui reviennent de la captivité de Judée
  rationale: La préposition ἐκ indique qu’ils sont issus de la captivité. « Qui reviennent » rend ce mouvement implicite en français courant, tout en maintenant l’image historique de la captivité.
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: jusqu’à ce que … soit achevée
  rationale: La construction indique que l’action doit se poursuivre jusqu’au plein achèvement du bâtiment.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: la maison du Seigneur
  rationale: « Maison » préserve l’image du grec plutôt que de la remplacer par « temple »; « Seigneur » traduit directement κύριος dans ce texte grec.
theological_decisions:
- issue: Traduction de κύριος dans l’expression désignant le temple
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte source grec porte κυρίου et non le tétragramme hébreu. « Seigneur » traduit donc le témoin principal sans lui substituer une forme propre à certaines traditions françaises.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le ton d’un ordre royal. « Maison du Seigneur » maintient l’expression biblique du grec, et les notes signalent les deux tournures dont la traduction idiomatique pourrait masquer la formulation littérale.
