    rationale: Le grec τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας désigne ceux qui sont issus/de la captivité de Judée; il ne contient aucun verbe indiquant explicitement leur retour. Le contexte peut le suggérer, mais la traduction principale ne doit pas l’ajouter.
  - severity: low
    issue: Antécédent tardif de « la » dans « de la reconstruire »
    rationale: La maison n’est nommée qu’à la fin de la phrase. Une formulation nominale explicite est plus claire en français tout en gardant le sens contextuel de l’ordre de reconstruction.
