review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’ordre officiel, l’infraction à ce qui est écrit, l’annulation, la prise d’une pièce de bois, la pendaison/suspension et la confiscation. Toutefois, « l’une des dispositions écrites » transforme τι τῶν γεγραμμένων (« quoi que ce soit parmi les choses écrites ») en une seule disposition identifiable et atténue la possibilité d’une transgression touchant n’importe quel élément écrit. « Ce qui est écrit » suit plus exactement le grec sans surinterprétation.
  naturalness: La phrase est naturelle dans un registre administratif soutenu. « Soit prise de ses propres biens » est grammatical mais peut suggérer que la poutre est prélevée parmi des biens meubles; « de ce qui lui appartient » est plus idiomatique et conserve l’ampleur de ἐκ τῶν ἰδίων αὐτοῦ.
  terminology: « Annule », « poutre », « pendu » et « propriété royale » conviennent. La note préserve utilement l’incertitude de κρεμασθῆναι; son affirmation « le grec dit littéralement “pendu” ou “suspendu” » doit être nuancée, car κρεμασθῆναι a le sens de suspendre/pendre, tandis qu’« empalé » relève de l’interprétation historique, non d’une équivalence littérale.
