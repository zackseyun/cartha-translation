base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: fr
  text: Et ordonner que, si quelqu’un enfreint quoi que ce soit de ce qui est écrit et l’annule, une poutre soit prise de ce qui lui appartient et qu’il y soit pendu[a], et que ses possessions deviennent propriété royale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il y soit suspendu ». Dans le contexte historique, le supplice peut aussi avoir impliqué l’empalement ou l’exposition publique sur une poutre.'
    reason: κρεμασθῆναι signifie directement « être pendu/suspendu »; l’empalement est une possibilité d’interprétation historique plutôt qu’un sens littéral certain.
lexical_decisions:
- source_word: προστάξαι
  choice: ordonner
  rationale: L’infinitif poursuit la formulation administrative du décret et exprime un ordre officiel.
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: enfreint l’une des dispositions écrites
  rationale: Cette formulation française naturelle conserve la portée juridique de παραβαίνω et rend τι avec le génitif comme une partie quelconque des prescriptions consignées par écrit.
- source_word: ἀκυρώσωσιν
  choice: l’annule
  rationale: Le verbe signifie rendre sans effet ou invalide; « annule » restitue clairement sa force juridique.
- source_word: λημφθῆναι ξύλον
  choice: une poutre soit prise
  rationale: ξύλον peut désigner du bois, une pièce de bois ou une poutre; le contexte punitif favorise ici une pièce de charpente.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: de ses propres biens
  rationale: Le grec désigne littéralement ce qui lui appartient, sans préciser explicitement sa maison; la traduction préserve cette largeur sémantique.
- source_word: κρεμασθῆναι
  choice: qu’il y soit pendu
  rationale: Le sens direct est être pendu ou suspendu. La méthode historique exacte demeure incertaine et fait l’objet d’une note.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ses possessions
  rationale: L’expression englobe les biens matériels appartenant au contrevenant.
- source_word: εἶναι βασιλικά
  choice: deviennent propriété royale
  rationale: L’adjectif indique que les biens passent au domaine du roi; cette formulation exprime naturellement la confiscation légale.
theological_decisions:
- issue: Nature du supplice exprimé par κρεμασθῆναι dans le contexte perse
  choice: qu’il y soit pendu
  alternative: qu’il y soit empalé; qu’il y soit suspendu
  rationale: Le grec exprime directement l’action de pendre ou de suspendre, tandis que le contexte historique peut évoquer l’empalement ou l’exposition publique. Le texte principal garde le sens lexical non spécifié et la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère officiel du décret sans lourdeur archaïque. « De ses propres biens » suit le grec, plus large que « de sa propre maison ».
