  - severity: low
    issue: Formulation de la note sur κρεμασθῆναι
    rationale: La note doit distinguer le sens lexical direct (« pendu/suspendu ») de l’hypothèse historique d’un empalement, afin de ne pas présenter cette dernière comme une traduction littérale.
