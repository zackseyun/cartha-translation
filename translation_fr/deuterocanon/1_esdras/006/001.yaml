base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: fr
  text: En la deuxième année du règne de Darius, Aggée et Zacharie, fils d’Iddo, les prophètes[c], prophétisèrent aux Juifs qui se trouvaient en Judée[a] et à Jérusalem, au nom du Seigneur, Dieu d’Israël, à leur adresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu porte « en Juda et à Jérusalem » ; le grec porte « en Judée et à Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: L’expression finale, littéralement « sur eux », est concise et ambiguë. Elle peut aussi se comprendre comme « à leur sujet » ou « à leur adresse ».
    reason: alternative_reading
  - marker: c
    text: Le texte grec répète l’article devant « prophètes » (« les les prophètes »), probablement à cause d’une irrégularité de copie ou de transmission.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: La deuxième année du règne de Darius
  rationale: Le δέ assure ici une légère continuité narrative qu’il n’est pas nécessaire d’expliciter en français. βασιλεία désigne le règne de Darius.
- source_word: ἐπροφήτευσεν
  choice: prophétisèrent
  rationale: Le singulier grec avec un sujet composé reflète un accord possible en grec; le français exige ici le pluriel. Le verbe désigne directement l’activité prophétique.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: Aggée et Zacharie, fils d’Iddo
  rationale: Le patronyme au singulier se rapporte naturellement à Zacharie. « Aggée », « Zacharie » et « Iddo » sont les formes françaises bibliques usuelles.
- source_word: οἱ οἱ προφῆται
  choice: les prophètes
  rationale: La répétition de l’article dans le texte grec est vraisemblablement une irrégularité de transmission; l’apposition plurielle est rendue selon son sens manifeste.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: aux Juifs
  rationale: Avec le verbe « prophétiser », ἐπί indique ici les destinataires de la parole plutôt qu’une hostilité dirigée contre eux.
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: qui se trouvaient en Judée et à Jérusalem
  rationale: « Judée » traduit directement la forme régionale grecque Ἰουδαία; la formulation française distingue naturellement « en Judée » et « à Jérusalem ».
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  choice: au nom du Seigneur, Dieu d’Israël
  rationale: La locution exprime l’autorité au nom de laquelle les prophètes parlent. L’apposition sans article reste naturelle en français.
- source_word: ἐπ’ αὐτούς
  choice: à leur adresse
  rationale: Cette expression française conserve l’idée d’une parole dirigée vers les Juifs tout en évitant le très obscur « sur eux » dans le corps du texte. Une note maintient les autres lectures possibles de la formule comprimée.
theological_decisions:
- issue: Traduction de κύριος dans ce texte scripturaire grec
  choice: Seigneur
  alternative: L’ÉTERNEL
  rationale: La source principale est grecque et porte Κυρίου. « Seigneur » traduit donc directement κύριος sans réintroduire dans le texte français une forme reconstruite du nom divin hébreu.
- issue: Relation prophétique exprimée par les deux emplois de ἐπί
  choice: prophétisèrent aux Juifs … à leur adresse
  alternative: prophétisèrent contre les Juifs / à leur sujet / sur eux
  rationale: Le contexte présente les Juifs comme les destinataires de la prophétie. La répétition finale est maintenue plutôt que supprimée, tandis qu’une note préserve l’ambiguïté de la préposition grecque et de son parallèle sémitique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la répétition finale inhabituelle de la source sans produire le calque difficilement intelligible « sur eux ». Les noms propres suivent l’usage biblique français courant.
