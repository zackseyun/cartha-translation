base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: fr
  text: Et les anciens des Juifs reçurent la faveur du Seigneur, ayant assumé la charge de veiller sur les exilés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est condensé : littéralement, « étant devenus [chargés] d’une supervision à l’égard de la captivité ». « Captivité » peut aussi désigner ici la communauté des exilés.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: reçurent la faveur
  rationale: L’expression indique ici une faveur accordée ou obtenue. « Reçurent la faveur » est naturel en français et présente clairement le Seigneur comme sa source.
- source_word: ἐπισκοπῆς
  choice: veiller sur
  rationale: Le nom peut désigner la surveillance, la responsabilité ou la charge de supervision. La tournure verbale « veiller sur » rend cette fonction dans un français courant et digne.
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: après avoir été chargés de veiller sur les exilés
  rationale: La construction grecque est condensée et peut évoquer l’entrée dans une fonction à l’égard de la captivité ou de la communauté exilée. Cette formulation évite de suggérer un simple déplacement physique, tout en signalant la responsabilité assumée.
- source_word: παρὰ τοῦ κυρίου
  choice: du Seigneur
  rationale: 'παρά avec le génitif marque la source : la faveur vient du Seigneur.'
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: les anciens des Juifs
  rationale: Traduction transparente qui conserve le rapport entre les anciens et le peuple juif sans réduire le terme à une désignation purement territoriale.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κύριος. « Seigneur » le traduit directement sans substituer au témoin grec une reconstruction fondée sur un autre texte.
- issue: Interprétation de αἰχμαλωσία
  choice: les exilés
  alternative: la captivité / l’exil
  rationale: Le nom désigne littéralement la captivité ou l’exil, mais peut ici viser collectivement les personnes concernées. Le français « veiller sur la captivité » serait obscur; « les exilés » exprime le sens contextuel probable, tandis que la note conserve l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe difficile du grec est rendue de façon intelligible sans attribuer aux anciens un déplacement physique certain; la note préserve la formulation plus littérale et son ambiguïté.
