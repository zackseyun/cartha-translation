    reason: alternative_reading
  revision_rationale: La révision retire l’idée non attestée d’une nomination préalable et conserve la relation participiale du grec. Le texte principal reste naturel en français en parlant des exilés, tandis que la note préserve l’ambiguïté de αἰχμαλωσία et la formulation condensée de l’original.
