base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: fr
  text: afin que des libations[a] soient offertes au Dieu Très-Haut pour le roi et ses fils[b], et qu’ils prient pour eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrandes de vin »; le terme grec désigne des offrandes liquides.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses enfants ». Le mot grec peut désigner des enfants ou des fils; dans ce contexte royal, « fils » est probablement employé au sens dynastique.
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque est elliptique; littéralement, elle peut se comprendre comme « qu’ils prient à leur sujet » ou « en leur faveur ».
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit une proposition de but et commande naturellement le subjonctif en français.
- source_word: προσφέρωνται
  choice: soient offertes
  rationale: Le passif au subjonctif convient au contexte sacrificiel et à la construction introduite par ὅπως.
- source_word: σπονδαὶ
  choice: libations
  rationale: Terme français précis et usuel pour une offrande liquide dans un contexte cultuel.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: au Dieu Très-Haut
  rationale: Conserve explicitement θεῷ et le titre ὑψίστῳ dans une formulation française naturelle et digne.
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: pour le roi et ses fils
  rationale: ὑπέρ exprime ici l’intérêt ou le bénéfice. Dans ce cadre royal, « fils » rend probablement la valeur dynastique de παῖδες, tout en signalant l’alternative « enfants » en note.
- source_word: προσεύχωνται
  choice: qu’ils prient
  rationale: Rend directement le subjonctif coordonné à la première proposition de but; le sujet implicite désigne les personnes chargées du culte.
- source_word: περὶ τῆς αὐτῶν
  choice: pour eux
  rationale: La formule grecque transmise ici est elliptique. « Pour eux » exprime sobrement la portée bénéficiaire probable sans ajouter « bien-être » ou « vie » au texte fourni.
theological_decisions:
- issue: Rendu du titre divin ὁ ὕψιστος
  choice: le Dieu Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: Le choix conserve le titre appliqué à Dieu sans lui ajouter de précision doctrinale.
- issue: Interprétation de la formule elliptique περὶ τῆς αὐτῶν
  choice: pour eux
  alternative: à leur sujet
  rationale: « Pour eux » convient au contexte de prière d’intercession, tout en évitant de compléter silencieusement l’ellipse par « bien-être » ou « vie ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe cultuelle reste formelle sans être archaïque. Les notes préservent l’ambiguïté de παῖδες et surtout l’ellipse finale du grec fourni.
