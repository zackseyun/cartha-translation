base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: fr
  text: 'Mais ils nous répondirent[a] : « Nous sommes les serviteurs du Seigneur qui a créé le ciel et la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants du Seigneur qui a créé le ciel et la terre ». Le mot grec peut désigner des enfants ou des serviteurs; ici, le contexte favorise l’idée de service plutôt que celle de filiation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν
  choice: ils nous répondirent
  rationale: Le verbe narratif à l’aoriste et le datif du destinataire sont rendus directement et naturellement en français.
- source_word: παῖδες
  choice: serviteurs
  rationale: Le terme peut désigner des enfants ou des serviteurs. Dans cet échange administratif, il exprime vraisemblablement l’appartenance au service de Dieu, sans imposer la nuance plus forte d’« esclaves ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος désigne Dieu comme souverain; « Seigneur » conserve l’usage biblique et la dignité du titre.
- source_word: τοῦ κτίσαντος
  choice: qui a créé
  rationale: Le participe aoriste identifie le Seigneur par son acte créateur; cette proposition relative est idiomatique et fidèle.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: le ciel et la terre
  rationale: Cette formulation française traditionnelle et naturelle conserve le mérisme biblique désignant l’ensemble de la création.
theological_decisions:
- issue: Sens de παῖδες dans la relation à Dieu
  choice: serviteurs
  alternative: enfants
  rationale: Le contexte présente les locuteurs comme attachés au service de Dieu dans la défense de leur œuvre. Cependant, l’ambiguïté lexicale réelle est conservée en note.
- issue: Rendu de κύριος appliqué à Dieu
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage scripturaire établi et préserve à la fois la souveraineté divine et la résonance théologique du terme.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit écrit. La formule « le ciel et la terre » garde la résonance biblique sans archaïsme excessif.
