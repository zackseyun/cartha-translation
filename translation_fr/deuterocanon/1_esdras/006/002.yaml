base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: fr
  text: Alors Zorobabel, fils de Salathiel, se leva[a] ; lui et Josué, fils de Josédek[b], commencèrent à construire la maison du Seigneur à Jérusalem, tandis que les prophètes du Seigneur[c] étaient avec eux et les aidaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un participe au singulier : littéralement, « Zorobabel s’étant levé ». L’expression peut aussi évoquer le fait de prendre l’initiative ou de passer à l’action.'
    reason: Précision grammaticale et alternative lexicale.
  - marker: b
    text: Le nom grec est Ἰησοῦς, forme qui peut aussi être rendue par « Jésus ». Ici, il désigne le grand prêtre de l’époque postexilique, couramment appelé Josué, et non Jésus de Nazareth.
    reason: Identification historique et alternative de traduction du nom propre.
  - marker: c
    text: Le contexte parallèle hébreu et araméen nomme Aggée et Zacharie parmi les prophètes qui soutenaient la reconstruction ; le présent verset grec dit simplement « les prophètes du Seigneur ».
    reason: Éclairage fourni par le témoin parallèle sans ajout au texte principal.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Connecteur narratif naturel qui marque la suite des événements.
- source_word: στάς
  choice: se leva
  rationale: Le participe aoriste singulier de ἵστημι se rapporte grammaticalement à Zorobabel et exprime ici le fait de se lever pour agir. La formulation française distingue ce geste de l’action commune exprimée ensuite au pluriel.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: Zorobabel, fils de Salathiel
  rationale: Ces formes suivent l’usage biblique français et restent proches des noms grecs du témoin principal.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: Josué, fils de Josédek
  rationale: Dans ce contexte postexilique, Ἰησοῦς désigne le grand prêtre connu en français sous le nom de Josué. « Josédek » reflète la forme grecque sans l’harmoniser avec une autre tradition textuelle.
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: ils commencèrent à construire
  rationale: Rend directement le verbe inchoatif suivi de l’infinitif et conserve le pluriel grec, qui associe Zorobabel et Josué.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: la maison du Seigneur
  rationale: Conserve l’image et l’expression cultuelle grecques sans les remplacer d’emblée par le terme interprétatif « temple ».
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Expression française concise et naturelle du complément attributif de lieu.
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου
  choice: tandis que les prophètes du Seigneur étaient avec eux
  rationale: Le génitif absolu indique une circonstance concomitante. « Étaient avec eux » préserve à la fois la présence et le soutien des prophètes.
- source_word: βοηθούντων αὐτοῖς
  choice: et les aidaient
  rationale: L’imparfait français rend naturellement l’aide continue exprimée par le participe présent grec.
theological_decisions:
- issue: Traduction de κύριος dans l’expression cultuelle
  choice: Seigneur
  alternative: Éternel ; Maître
  rationale: Le texte grec porte κυρίου. « Seigneur » en est l’équivalent français direct et n’impose pas dans le texte principal une rétroversion du nom divin hébreu.
- issue: Rapport entre le témoin grec et le parallèle massorétique
  choice: Maintenir l’expression générale « les prophètes du Seigneur »
  alternative: Ajouter les noms d’Aggée et de Zacharie dans le corps du verset
  rationale: Le grec est le témoin principal et ne nomme pas ici les prophètes. Le parallèle sémitique éclaire leur identité et le contexte de leur soutien, mais ne justifie pas l’ajout de leurs noms dans le texte.
- issue: Identité de Ἰησοῦς
  choice: Josué
  alternative: Jésus ; Jeshua
  rationale: Il s’agit du grand prêtre de l’époque postexilique, non de Jésus de Nazareth. « Josué » est intelligible en français moderne tout en laissant une note signaler la forme grecque.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation et la reprise par « ils » permettent de respecter le singulier de στάς pour Zorobabel puis le pluriel de ἤρξαντο pour l’action commune de Zorobabel et Josué. Le vocabulaire cultuel « maison du Seigneur » est volontairement conservé.
