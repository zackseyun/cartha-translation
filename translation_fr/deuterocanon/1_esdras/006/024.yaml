    issue: Rendu de διὰ πυρὸς ἐνδελεχοῦς
    rationale: « Sur un feu continuel » suggère un support ou un emplacement et ne rend pas nettement la valeur instrumentale de διὰ. « Au moyen d’un feu continuel » est plus fidèle tout en ne surinterprétant pas l’expression.
  - severity: low
    issue: Vocabulaire des éléments de construction
    rationale: Dans ce contexte, δόμοι désigne plus naturellement des « assises » que des « rangées ». Cette correction améliore à la fois la précision architecturale et le français.
