base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: fr
  text: On y offrira des sacrifices au moyen d’un feu continuel. L’édifice aura soixante coudées de haut et soixante coudées de large[a]. Il comportera trois assises de pierres taillées et une assise de bois neuf local. La dépense sera fournie aux frais de la maison du roi Cyrus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec transmis relie difficilement la mention des sacrifices aux dimensions. Celles-ci se rapportent manifestement à l’édifice évoqué dans le contexte.
    reason: Préserver la difficulté syntaxique réelle sans produire en français un antécédent absurde ou trompeur.
  - marker: b
    text: 'Ou : « sur les fonds de la maison royale de Cyrus ».'
    reason: οἶκος peut signifier la maison ou l’administration royale, et, par extension, ses ressources.
lexical_decisions:
- source_word: θύουσιν διὰ πυρὸς ἐνδελεχοῦς
  choice: On y offrira des sacrifices sur un feu continuel
  rationale: θύω désigne ici l’offrande de sacrifices; ἐνδελεχής exprime la continuité. La tournure impersonnelle française convient au contexte d’un décret.
- source_word: δόμων λιθίνων ξυστῶν τριῶν
  choice: trois rangées de pierres de taille
  rationale: δόμος désigne ici une assise ou rangée de construction; ξυστός qualifie des pierres travaillées ou taillées, plutôt que simplement polies.
- source_word: δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  choice: une rangée de bois neuf provenant de la région
  rationale: 'La formulation rend les quatre éléments du grec: une seule rangée, en bois, neuf et d’origine locale.'
- source_word: τὸ δαπάνημα δοθῆναι
  choice: La dépense sera prise en charge
  rationale: Cette expression naturelle rend l’ordre de fournir les fonds nécessaires.
- source_word: ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: par la maison du roi Cyrus
  rationale: οἶκος peut désigner la maison royale, avec ses ressources ou son trésor; le texte grec nomme explicitement Cyrus.
theological_decisions:
- issue: Rapport grammatical entre les sacrifices et les dimensions
  choice: Séparer les propositions et expliciter « L’édifice »
  alternative: « dont la hauteur sera de soixante coudées », avec un antécédent grammatical incertain
  rationale: Le grec transmis enchaîne de manière difficile θύουσιν et une proposition de dimensions; le contexte architectural permet d’identifier l’édifice sans faire des sacrifices ou du feu l’antécédent des mesures. Une note signale cette difficulté textuelle.
- issue: Nature du « feu continuel »
  choice: Conserver littéralement l’expression sans l’identifier davantage
  alternative: « l’holocauste perpétuel » ou une autre catégorie cultuelle précise
  rationale: Le grec parle du feu continuel, mais ne nomme pas ici une catégorie sacrificielle particulière; il ne faut pas ajouter une précision confessionnelle ou rituelle absente.
translation_notes:
  register: Français international actuel, digne et lisible. Le futur rend la valeur prescriptive du décret. « Coudée » conserve l’unité antique; « pierres de taille » et « rangées » donnent un vocabulaire architectural courant sans technicité excessive.
