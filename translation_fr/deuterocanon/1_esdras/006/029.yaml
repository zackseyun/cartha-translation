translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe administrative fluide. « Seront fournis » explicite la relation implicite entre la liste des denrées et leur utilisation quotidienne, tandis que « pour être utilisés » maintient la valeur du passif grec.
