  rationale: La révision supprime le verbe de fourniture ajouté et fait de l’emploi quotidien des denrées l’action principale, conformément à ἀναλίσκεσθαι. Elle conserve les choix lexicaux du projet ainsi que l’ambiguïté documentée de l’adverbe final.
