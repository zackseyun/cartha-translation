base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: fr
  text: De même, du blé, du sel, du vin et de l’huile devront être employés continuellement, année après année, selon ce que prescriront les prêtres de Jérusalem, chaque jour, sans contestation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans faute » ou « sans discussion ». L’adverbe grec peut souligner soit l’absence de contestation, soit la certitude que la prescription sera exécutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸν
  choice: blé
  rationale: La forme πυρόν désigne ici le blé, et non le feu (πῦρ) ; elle s’insère naturellement dans la liste des provisions cultuelles.
- source_word: ἅλα
  choice: sel
  rationale: Équivalent français direct et naturel dans cette liste de fournitures.
- source_word: οἶνον
  choice: vin
  rationale: Rendu courant et précis du terme grec.
- source_word: ἔλαιον
  choice: huile
  rationale: Dans ce contexte, il s’agit vraisemblablement d’huile d’olive, mais « huile » suffit naturellement en français biblique courant.
- source_word: ἐνδελεχῶς κατʼ ἐνιαυτόν
  choice: continuellement, année après année
  rationale: Cette formulation conserve à la fois l’idée de régularité ininterrompue et la valeur distributive annuelle.
- source_word: ὑπαγορεύσωσιν
  choice: selon les indications
  rationale: Le verbe exprime ici le fait de dicter, préciser ou prescrire les besoins ; la tournure française convient au registre administratif.
- source_word: ἀναλίσκεσθαι καθʼ ἡμέραν
  choice: pour être utilisés chaque jour
  rationale: Le passif concerne l’emploi quotidien des provisions ; « utilisés » évite de limiter le sens à une consommation alimentaire.
- source_word: ἀναμφισβητήτως
  choice: sans aucune contestation
  rationale: Ce rendu préserve le sens premier d’une exécution qui ne doit susciter ni objection ni litige, tout en laissant en note la nuance possible de régularité sans défaillance.
