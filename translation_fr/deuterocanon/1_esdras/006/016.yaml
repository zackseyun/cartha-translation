  verdict: revise
  source_fidelity: La mention de « reconstruite » va au-delà de οἰκοδομῆσαι, qui signifie « bâtir / construire » et ne porte pas en lui-même le préfixe « re- ». Le contexte peut évoquer un rétablissement du temple, mais cette inférence ne doit pas être intégrée au texte. « Ordonna par écrit » rend de façon idiomatique la valeur directive de ἔγραψεν suivi de l’infinitif, tout en conservant le caractère écrit de l’acte royal.
  naturalness: La phrase révisée est naturelle en français international moderne. « Pays de Babylonie » exprime plus précisément la portée territoriale de χώρας Βαβυλωνίας que « Babylone », qui peut désigner la ville.
  terminology: « Cette maison » conserve le terme cultuel οἶκος sans substituer « temple » dans le corps du texte. La note identifie sobrement le référent contextuel. « Bâtir » respecte l’ambiguïté lexicale du grec entre construire et, selon le contexte, rebâtir.
  issues:
  - severity: medium
    issue: « soit reconstruite »
    rationale: Le grec οἰκοδομῆσαι exprime « bâtir/construire »; il ne spécifie pas « reconstruire ». Le contexte historique ne justifie pas de lever cette ambiguïté dans le texte principal.
  - severity: low
    issue: « territoire de Babylone »
    rationale: La formulation est compréhensible, mais « pays de Babylonie » rend plus nettement χώρα comme entité territoriale et évite l’ambiguïté avec la ville de Babylone.
