base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: fr
  text: La première année du règne de Cyrus sur le pays de Babylonie, le roi Cyrus ordonna par écrit de bâtir cette maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le roi Cyrus écrivit de bâtir cette maison ». « Cette maison » désigne le temple de Jérusalem.'
    reason: Précision littérale et référent contextuel.
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει βασιλεύοντος Κύρου
  choice: La première année du règne de Cyrus
  rationale: Le génitif absolu fixe le cadre temporel. Cette formulation française est naturelle et conserve l’idée du règne sans reproduire lourdement le participe grec.
- source_word: χώρας Βαβυλωνίας
  choice: sur le territoire de Babylone
  rationale: χώρα désigne ici un pays ou territoire plutôt que la seule ville; « sur » dépend de l’idée de régner.
- source_word: ἔγραψεν βασιλεὺς Κῦρος
  choice: le roi Cyrus ordonna par écrit
  rationale: Le grec dit littéralement que Cyrus « écrivit », mais l’infinitif qui suit donne à cet écrit la valeur contextuelle d’un ordre royal. « ordonna par écrit » conserve à la fois l’acte d’écrire et sa fonction administrative.
- source_word: οἰκοδομῆσαι
  choice: que … soit reconstruite
  rationale: Dans ce contexte, il s’agit de relever un sanctuaire antérieurement détruit. Le passif français exprime naturellement le contenu de l’ordre sans identifier les bâtisseurs.
- source_word: τὸν οἶκον τοῦτον
  choice: cette maison
  rationale: οἶκος signifie littéralement « maison ». La formulation conserve l’image cultuelle du texte, tandis qu’une note précise qu’il s’agit du temple.
theological_decisions:
- issue: Référent de « cette maison »
  choice: Conserver « cette maison » dans le texte
  alternative: « ce temple »
  rationale: Le contexte désigne le temple de Jérusalem, mais le grec emploie οἶκος. Garder « maison » préserve l’expression biblique sans explicitation interprétative dans le corps du verset.
- issue: Portée de l’écrit royal
  choice: « ordonna par écrit »
  alternative: « écrivit » ou « décréta »
  rationale: « Écrivit » serait formellement plus proche mais peu clair en français sans complément exprimant le destinataire; « décréta » serait plus technique que le verbe grec. La solution retenue rend l’acte écrit et sa force directive.
- issue: Construction ou reconstruction
  choice: « soit reconstruite »
  alternative: « soit bâtie »
  rationale: Le verbe grec peut signifier construire ou rebâtir. Le contexte historique favorise « reconstruire », mais l’autre possibilité est signalée en note afin de ne pas masquer l’étendue lexicale du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase évite un calque participial lourd. « Territoire de Babylone » distingue la région de la seule ville; « Babylone » reste toutefois plus courant en français biblique que « Babylonie ».
