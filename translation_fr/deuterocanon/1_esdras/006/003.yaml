base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: fr
  text: 'À cette époque, Sisinnès, gouverneur de Syrie et de Phénicie, se trouvait auprès d’eux, avec Sathrabouzane et leurs collaborateurs ; et il leur dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: À cette époque
  rationale: Expression temporelle naturelle en français moderne, qui maintient le lien narratif sans surtraduire αὐτῷ par « précisément ».
- source_word: παρῆν πρὸς αὐτούς
  choice: se trouvait auprès d’eux
  rationale: παρῆν exprime d’abord la présence plutôt que l’arrivée; « auprès d’eux » rend naturellement πρὸς αὐτούς dans cette construction.
- source_word: Σισίννης
  choice: Sisinnès
  rationale: Translittération française du nom grec, avec une graphie conforme aux usages francophones.
- source_word: ὁ ἔπαρχος
  choice: gouverneur
  rationale: Équivalent clair et courant pour un haut responsable territorial; « préfet » serait plus technique et pourrait suggérer à tort une institution romaine précise.
- source_word: Συρίας καὶ Φοινίκης
  choice: de Syrie et de Phénicie
  rationale: Les génitifs désignent les territoires relevant de sa charge.
- source_word: Σαθραβουζάνης
  choice: Sathrabouzane
  rationale: Translittération française proche de la forme grecque.
- source_word: οἱ συνέταιροι
  choice: leurs collaborateurs
  rationale: Dans ce contexte administratif, « collaborateurs » rend mieux l’idée d’associés ou de collègues que « compagnons ». Le possessif pluriel rattache naturellement le groupe aux deux personnages nommés, sans trancher davantage que le grec.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: 'et il leur dit :'
  rationale: Le verbe grec est au singulier et désigne donc un seul locuteur, très probablement Sisinnès, présenté comme le principal responsable. Les deux-points annoncent la parole qui suit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en évitant une tournure lourde. Aucun terme théologique spécialisé n’intervient dans ce verset.
