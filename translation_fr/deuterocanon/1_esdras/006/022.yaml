base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/022.yaml
  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: fr
  text: 'Alors le roi Darius ordonna que l’on fasse des recherches dans les archives conservées à Babylone, et l’on trouva à Ecbatane, dans la forteresse située en Médie[a], un endroit[b] où était consigné ce qui suit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la citadelle située en Médie ». Le grec emploie un terme désignant un centre administratif fortifié.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « un endroit ». Dans ce contexte archivistique, il peut s’agir de l’emplacement, d’un passage ou du document contenant le mémorandum.
    reason: source_ambiguity
lexical_decisions:
- source_word: προσέταξεν
  choice: ordonna
  rationale: Exprime clairement l’ordre donné avec autorité par le roi, dans un français actuel et digne.
- source_word: ἐπισκέψασθαι
  choice: que l’on fasse des recherches
  rationale: Dans le contexte d’archives royales, le verbe désigne un examen officiel visant à retrouver un dossier.
- source_word: βιβλιοφυλακίοις
  choice: archives
  rationale: Il s’agit d’un dépôt de documents officiels plutôt que d’une bibliothèque destinée à la lecture.
- source_word: τοῖς κειμένοις
  choice: conservées
  rationale: Rend naturellement l’idée d’archives déposées ou entreposées à Babylone.
- source_word: Ἐκβατάνοις
  choice: Ecbatane
  rationale: Forme française traditionnelle et courante du nom de la ville.
- source_word: τῇ βάρει
  choice: dans la forteresse
  rationale: Le terme désigne un centre fortifié; « forteresse » reste clair, tandis que « citadelle » constitue une autre traduction possible.
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: située en Médie
  rationale: Formulation française naturelle qui conserve la localisation géographique sans imposer la notion plus précise de province administrative.
- source_word: τόπος
  choice: un document
  rationale: Littéralement « un endroit » ou « un passage »; dans ce contexte archivistique, le mot semble désigner le support ou l’emplacement textuel où figurait le mémorandum. La note préserve la formulation inhabituelle du grec.
- source_word: ὑπομνημάτιστο
  choice: était consigné
  rationale: Rend le caractère officiel et documentaire de l’inscription ou du mémorandum.
- source_word: τάδε
  choice: ce qui suit
  rationale: Introduit naturellement en français le contenu du document donné au verset suivant.
