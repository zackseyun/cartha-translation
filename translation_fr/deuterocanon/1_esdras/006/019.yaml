base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: fr
  text: Alors Sanabassar vint poser les fondations de la maison du Seigneur à Jérusalem[a] ; depuis ce temps jusqu’à maintenant, elle est en construction, mais n’a pas été achevée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanabassar est généralement identifié à Sheshbatsar dans la tradition du livre d’Esdras.
    reason: Signaler l’autre forme traditionnelle du nom et l’identification généralement admise, tout en maintenant dans le texte la forme du grec.
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: Sanabassar
  rationale: Le nom personnel est translittéré d’après la forme grecque, qui constitue ici le témoin principal.
- source_word: παραγενόμενος
  choice: vint
  rationale: Le participe indique l’arrivée de Sanabassar avant l’action principale ; « vint » est naturel et concis en français.
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: poser les fondations
  rationale: Dans ce contexte architectural, cette tournure rend idiomatiquement l’action d’établir les fondations sans imposer l’idée plus précise de pierres de fondation.
- source_word: τοῦ οἴκου Κυρίου
  choice: de la maison du Seigneur
  rationale: Cette formulation conserve l’image biblique de la « maison » et traduit Κυρίου directement, sans substituer le terme interprétatif « temple ».
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: La localisation de la maison est exprimée de façon naturelle en français moderne.
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: depuis ce temps jusqu’à maintenant
  rationale: La formulation préserve l’étendue temporelle continue soulignée par le grec.
- source_word: οἰκοδομουμένου
  choice: elle est en construction
  rationale: Le participe passif exprime un chantier qui se poursuit au moment de référence ; cette formulation restitue clairement sa valeur durative.
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: n’a pas été achevée
  rationale: Le grec signifie littéralement que la maison « n’a pas reçu d’achèvement » ; la voix passive française transmet naturellement l’absence de résultat final.
theological_decisions:
- issue: Traduction de Κυρίου dans le contexte de la maison divine
  choice: du Seigneur
  alternative: de l’Éternel
  rationale: Le texte grec porte Κυρίου. « Seigneur » traduit directement ce témoin principal, sans rétrovertir le nom divin depuis une tradition sémitique parallèle.
translation_notes:
  register: Français international moderne, clair et digne. L’idiome biblique « maison du Seigneur » est conservé. Le contraste final est rendu par « mais » afin de faire ressortir naturellement que le chantier se poursuit sans avoir atteint son achèvement.
