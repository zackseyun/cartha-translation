base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
translation:
  language: fr
  text: 'Alors nous avons interrogé ces anciens en leur disant : « Qui vous a donné l’ordre de construire cette maison et— »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec conservé dans l’édition de Swete s’interrompt ici après « et »; la phrase se poursuit au verset suivant. Cette traduction en garde la forme inachevée.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: nous avons interrogé
  rationale: Le verbe désigne une demande d’information; « interroger » convient au cadre d’une enquête officielle. L’imparfait grec est rendu naturellement par le passé composé dans le récit français moderne.
- source_word: τῶν πρεσβυτέρων τούτων
  choice: ces anciens
  rationale: Le terme désigne ici les responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: Qui vous a donné l’ordre
  rationale: Cette formulation française naturelle exprime l’autorité à l’origine des travaux, portée par le génitif absolu grec.
- source_word: οἰκοδομεῖτε
  choice: de construire
  rationale: Après « donner l’ordre », l’infinitif est idiomatique en français. Le grec dit « construire », sans préciser explicitement « reconstruire ».
- source_word: τὸν οἶκον τοῦτον
  choice: cette maison
  rationale: « Maison » conserve le sens direct de οἶκος et l’expression biblique, bien qu’il s’agisse contextuellement du temple de Jérusalem.
