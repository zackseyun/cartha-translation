revisions:
- from: Et la Maison[a] avait été construite bien des années auparavant par un grand et puissant roi d’Israël, puis elle avait été achevée.[b]
  to: Et la Maison[a] était en construction pendant de nombreuses années, avant l’époque d’un grand et puissant roi d’Israël[b], et elle fut achevée.
  rationale: La révision rend l’imparfait passif par « était en construction », conserve la durée exprimée par ἐτῶν πλειόνων et suit, sans la surinterpréter, la lecture temporelle adoptée dans la piste d’audit anglaise. L’alternative instrumentale, syntaxiquement possible, est préservée en note. « Fut achevée » rend sobrement le passif aoristique ἐπετέλεσθη.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:04:40Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction principale doit conserver l’aspect imperfectif de οἰκοδομεῖτο (« était en construction ») et traiter avec prudence la construction grecque difficile. Le texte proposé privilégie à tort la lecture instrumentale (« par un roi »), alors que la piste d’audit anglaise retient, à juste titre et avec note, une compréhension temporelle comme la plus cohérente dans le contexte. Les deux plus-que-parfaits (« avait été construite… avait été achevée ») effacent en outre le contraste entre procès en cours et achèvement.
  naturalness: « La Maison » est possible dans un registre biblique, mais la phrase proposée est lourde et sa succession de plus-que-parfaits donne l’impression que la construction et son achèvement appartiennent au même passé révolu sans rapport clair avec l’énoncé. La formulation révisée est lisible en français international tout en signalant la difficulté par une note.
  terminology: « Maison » rend littéralement ὁ οἶκος et la note identifie correctement le Temple. « Grand et puissant roi d’Israël » est fidèle et naturel. La note alternative doit présenter la lecture instrumentale comme alternative, non l’inverse.
  issues:
  - severity: high
    issue: Lecture instrumentale imposée dans le texte principal
    rationale: διά avec génitif peut certes être instrumental, mais, dans cette phrase grecque condensée et difficile, la lecture temporelle est celle retenue par l’audit anglais contextuel. La version française ne doit pas présenter l’option instrumentale comme certaine tout en reléguant la lecture temporelle en note.
  - severity: high
    issue: Aspect et temps de οἰκοδομεῖτο et ἐπετέλεσθη mal rendus
    rationale: « avait été construite » ne rend pas naturellement l’imparfait passif, qui présente la construction comme en cours. Le plus-que-parfait final pour ἐπετέλεσθη neutralise aussi le passif aoristique d’achèvement.
  - severity: medium
    issue: Ancrage de la note sur l’ambiguïté
    rationale: La note concernant la proposition avec le roi doit être ancrée auprès de « roi d’Israël », où se situe l’ambiguïté, plutôt qu’après toute la phrase.
  revised_text: Et la Maison[a] était en construction pendant de nombreuses années, avant l’époque d’un grand et puissant roi d’Israël[b], et elle fut achevée.
  revised_footnotes:
