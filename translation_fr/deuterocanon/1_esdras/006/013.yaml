    text: 'Le grec est condensé et difficile. Autre compréhension possible : « par un grand et puissant roi d’Israël » ; dans ce cas, la construction est située bien des années auparavant.'
    reason: alternative_reading
  revision_rationale: La révision rend l’imparfait passif par « était en construction », conserve la durée exprimée par ἐτῶν πλειόνων et suit, sans la surinterpréter, la lecture temporelle adoptée dans la piste d’audit anglaise. L’alternative instrumentale, syntaxiquement possible, est préservée en note. « Fut achevée » rend sobrement le passif aoristique ἐπετέλεσθη.
