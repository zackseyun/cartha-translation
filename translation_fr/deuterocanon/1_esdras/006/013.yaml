base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: fr
  text: Et la Maison[a] était en construction pendant de nombreuses années, avant l’époque d’un grand et puissant roi d’Israël[b], et elle fut achevée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Maison » désigne ici le Temple.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est condensé et difficile. Autre compréhension possible : « par un grand et puissant roi d’Israël » ; dans ce cas, la construction est située bien des années auparavant.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: avait été construite
  rationale: L’imparfait passif présente la construction dans son déroulement passé. En français, le plus-que-parfait situe naturellement cette construction antérieure par rapport au récit, sans la réduire à un événement ponctuel.
- source_word: ὁ οἶκος
  choice: la Maison
  rationale: Le grec dit littéralement « la maison »; dans le contexte, il s’agit du Temple. La majuscule signale cet emploi particulier tout en conservant l’image biblique.
- source_word: ἔμπροσθεν ἐτῶν πλειόνων
  choice: bien des années auparavant
  rationale: 'Cette tournure rend le sens temporel le plus naturel de l’expression grecque transmise: la construction remontait à un passé ancien. La formulation reste fluide en français moderne.'
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: par un grand et puissant roi d’Israël
  rationale: διά avec le génitif exprime normalement l’intermédiaire ou l’agent. Cette lecture est syntaxiquement directe et renvoie vraisemblablement au roi qui avait fait bâtir le premier Temple, sans le nommer.
- source_word: ἐπετέλεσθη
  choice: elle avait été achevée
  rationale: Le verbe passif exprime l’achèvement. Le plus-que-parfait maintient l’antériorité de l’ensemble dans le récit français.
theological_decisions:
- issue: Référent de « la Maison »
  choice: Conserver « la Maison » dans le texte et préciser en note qu’il s’agit du Temple.
  alternative: Traduire directement « le Temple ».
  rationale: Le référent contextuel est clair, mais conserver le terme grec évite d’effacer l’image traditionnelle de la demeure consacrée à Dieu.
- issue: Valeur de la proposition concernant le roi d’Israël
  choice: 'Lire διά de manière instrumentale: « par un grand et puissant roi d’Israël ».'
  alternative: 'Comprendre la proposition dans un sens temporel: « avant l’époque d’un grand et puissant roi d’Israël ».'
  rationale: La lecture instrumentale suit l’usage ordinaire de διά avec le génitif et donne à ἔμπροσθεν ἐτῶν πλειόνων sa portée temporelle propre, « bien des années auparavant ». La formulation grecque demeure toutefois condensée, et une autre segmentation temporelle est possible.
translation_notes:
  register: Français international moderne, digne et lisible. « Maison » conserve l’expression biblique, tandis que les plus-que-parfaits marquent clairement l’antériorité. « Puis » explicite légèrement la progression entre construction et achèvement sans ajouter de contenu substantiel.
