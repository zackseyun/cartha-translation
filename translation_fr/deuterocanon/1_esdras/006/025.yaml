base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: fr
  text: Les objets sacrés de la maison du Seigneur[a], les objets en or comme ceux en argent, que Nabuchodonosor avait emportés de la maison située à Jérusalem et transportés à Babylone, devront être rendus à la maison située à Jérusalem, là où ils se trouvaient[b], afin d’y être déposés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « objets saints ». Il s’agit d’objets consacrés au service du temple.
    reason: lexical_alternative
  - marker: b
    text: La « maison » située à Jérusalem désigne ici le temple.
    reason: referent_clarification
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: objets sacrés
  rationale: « Objets » couvre naturellement les récipients, ustensiles et autres articles consacrés au culte sans en préciser indûment la forme; « sacrés » exprime leur affectation sainte.
- source_word: οἴκου Κυρίου
  choice: maison du Seigneur
  rationale: Cette formulation conserve l’image grecque de la « maison » tout en laissant la note expliciter qu’il s’agit du temple.
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: ceux en or comme ceux en argent
  rationale: Les adjectifs substantivés renvoient aux objets; cette formulation française préserve cette reprise sans répétition pesante.
- source_word: ἐξήνεγκεν … ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: avait emportés … et transportés à Babylone
  rationale: « Emporter » marque la sortie de la maison, tandis que « transporter à Babylone » exprime clairement la destination.
- source_word: ἀποκατασταθῆναι
  choice: devront être remis
  rationale: Dans le cadre du décret, le futur d’obligation rend la valeur de l’infinitif et « remis » indique le retour des objets à leur lieu approprié.
- source_word: οὗ ἦν κείμενα
  choice: là où ils se trouvaient
  rationale: Le grec peut évoquer des objets posés ou se trouvant en un lieu; cette traduction idiomatique préserve cette relative indétermination.
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: afin d’y être déposés
  rationale: La finalité de leur placement est conservée; le pluriel français suit le référent collectif, malgré la forme grecque singulière.
- source_word: Ναβουχοδονοσόρ
  choice: Nabuchodonosor
  rationale: Forme française biblique courante correspondant au nom grec et à son référent sémitique.
theological_decisions:
- issue: Traduction de κύριος dans l’expression cultuelle οἴκου Κυρίου
  choice: Seigneur
  alternative: Éternel; Maître
  rationale: Le texte grec porte Κυρίου. « Seigneur » respecte la source grecque et le registre biblique sans réintroduire explicitement le tétragramme absent de cette forme du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe administrative du décret est conservée sans calque excessif; « maison du Seigneur » maintient l’imagerie du grec, tandis que les notes éclairent le sens cultuel.
