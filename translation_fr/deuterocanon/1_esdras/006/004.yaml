base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: fr
  text: « Sur l’ordre de qui[a] construisez-vous cette maison[b], achevez-vous ce toit et tout le reste ? Et qui sont les bâtisseurs qui exécutent ces travaux ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avec l’autorisation de qui construisez-vous cette maison… ? » Le participe grec peut désigner l’ordre donné ou l’autorisation qui fonde les travaux.'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » est le temple ; la traduction conserve toutefois le terme grec ordinaire plutôt que de le remplacer par cette précision.
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: Sur l’ordre de qui
  rationale: La construction au génitif désigne la personne à l’origine de la directive. « Sur l’ordre de qui » rend naturellement en français la force administrative du participe συντάξαντος, sans supposer nécessairement un décret formel.
- source_word: οἰκοδομεῖτε
  choice: construisez-vous
  rationale: Le présent décrit les travaux en cours. « Construire » reste fidèle au grec, qui n’explicite pas l’idée de reconstruction.
- source_word: οἶκον
  choice: maison
  rationale: Le grec emploie le terme ordinaire « maison ». Le contexte désigne le temple, mais conserver « maison » évite de remplacer le mot source par une explicitation interprétative.
- source_word: στέγην
  choice: toit
  rationale: Le nom désigne la toiture ou couverture du bâtiment ; « toit » est l’équivalent français le plus direct et naturel.
- source_word: τἄλλα πάντα
  choice: tout le reste
  rationale: Cette expression englobe les autres éléments ou travaux du chantier sans les préciser.
- source_word: ἐπιτελεῖτε
  choice: achevez-vous
  rationale: Le verbe exprime l’action de mener à son terme. La coordination verbale française conserve la progression de la phrase grecque.
- source_word: οἰκοδόμοι
  choice: bâtisseurs
  rationale: Terme général désignant les personnes qui construisent, sans préciser indûment leur métier.
- source_word: τελοῦντες
  choice: qui exécutent ces travaux
  rationale: Le participe désigne ceux qui réalisent concrètement les opérations mentionnées. « Ces travaux » reprend naturellement ταῦτα dans le contexte du chantier.
