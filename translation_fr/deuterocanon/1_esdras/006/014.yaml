base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: fr
  text: Et puisque nos pères, après l’avoir irrité, ont péché contre le Seigneur d’Israël, le Céleste[a], il les a livrés entre les mains de Nabuchodonosor, roi de Babylone, roi des Chaldéens ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu du ciel ». Le grec dit littéralement « le Céleste », tandis que la tradition apparentée d’Esdras emploie souvent le titre plus développé « Dieu du ciel ».
    reason: Signaler une autre formulation textuelle et traditionnelle sans remplacer la leçon grecque principale.
lexical_decisions:
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit ici la cause du jugement et s’enchaîne naturellement avec καί (« Et puisque »).
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Conserve l’expression familiale et mémorielle du grec, tout en restant claire dans ce contexte historique.
- source_word: παραπικράναντες
  choice: après l’avoir irrité
  rationale: Rend le participe antérieur et l’idée d’avoir provoqué Dieu par la rébellion, sans développer le texte en « provoquer sa colère ».
- source_word: ἥμαρτον εἰς
  choice: ont péché contre
  rationale: Expression française naturelle qui rend la faute dirigée contre le Seigneur.
- source_word: τὸν κύριον τοῦ Ἰσραὴλ
  choice: le Seigneur d’Israël
  rationale: Suit exactement le titre grec sans y ajouter « Dieu » à partir d’une tradition parallèle.
- source_word: τὸν οὐράνιον
  choice: le Céleste
  rationale: L’adjectif substantivé est en apposition au « Seigneur d’Israël » ; cette formulation préserve la concision et l’ambiguïté du grec.
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: il les a livrés entre les mains de
  rationale: Rend l’idée de remise au pouvoir d’un ennemi tout en conservant l’image biblique des « mains ».
- source_word: Ναβουχοδονοσὸρ
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et couramment reconnue du nom du roi babylonien.
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: roi de Babylone, roi des Chaldéens
  rationale: Maintient la répétition appositionnelle des deux titres royaux présente dans le grec.
theological_decisions:
- issue: Titre divin τὸν οὐράνιον en apposition au « Seigneur d’Israël »
  choice: le Céleste
  alternative: le Dieu du ciel
  rationale: Le témoin grec porte un adjectif substantivé, non l’expression développée « Dieu du ciel ». Le texte principal conserve donc la forme grecque, tandis que la note signale l’autre formulation attestée dans la tradition apparentée d’Esdras.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est ici le titre divin français normal et ne force aucune interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le lien causal, l’image « entre les mains » et la répétition des titres royaux. Le point-virgule final reflète le fait que le verset appartient à une phrase qui se poursuit.
