base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: fr
  text: 'Copie de la lettre que Sisinnès[a], gouverneur de Syrie et de Phénicie, Sathrabouzanès et leurs associés, dirigeants en Syrie et en Phénicie, écrivirent et envoyèrent au roi Darius : « Salutations ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec passe légèrement du singulier (« écrivait ») au pluriel (« envoyèrent »). La traduction présente naturellement la rédaction et l’envoi comme l’action collective des responsables nommés.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: Copie de la lettre
  rationale: La formule désigne la reproduction d’un document épistolaire. « Copie de la lettre » est à la fois fidèle et naturel en français moderne.
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: que ... écrivirent et envoyèrent
  rationale: Le grec passe du singulier ἔγραφεν au pluriel ἀπέστειλαν. La traduction française coordonne les deux actions au pluriel, en accord avec l’ensemble des expéditeurs, tout en signalant ce glissement dans une note.
- source_word: Σισίννης
  choice: Sisinnès
  rationale: Translittération française proche de la forme grecque, avec une graphie qui indique naturellement la prononciation finale.
- source_word: ὁ ἔπαρχος
  choice: gouverneur
  rationale: Dans ce contexte administratif, ἔπαρχος désigne le haut fonctionnaire chargé d’un territoire ; « gouverneur » est clair et courant.
- source_word: Συρίας καὶ Φοινίκης
  choice: de Syrie et de Phénicie
  rationale: Les génitifs indiquent ici le ressort territorial du gouverneur.
- source_word: Σαθραβουζάνης
  choice: Sathrabouzane
  rationale: Translittération française directe de la forme grecque, adaptée aux conventions graphiques françaises.
- source_word: οἱ συνέταιροι
  choice: leurs associés
  rationale: Le mot désigne ici des personnes liées aux responsables nommés dans l’exercice de leurs fonctions, plutôt que des compagnons personnels.
- source_word: ἡγεμόνες
  choice: dirigeants
  rationale: Le terme désigne des responsables investis d’autorité. « Dirigeants » évite de répéter « gouverneur » sans effacer leur fonction officielle.
- source_word: Βασιλεῖ Δαρείῳ
  choice: au roi Darius
  rationale: Le datif indique le destinataire de la lettre ; cette formulation est idiomatique en français.
- source_word: χαίρειν
  choice: Salutations !
  rationale: Il s’agit de la formule épistolaire grecque usuelle. « Salutations ! » en restitue la fonction plutôt que le sens littéral « se réjouir ».
