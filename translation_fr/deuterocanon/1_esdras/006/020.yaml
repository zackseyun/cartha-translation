base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: fr
  text: Maintenant donc, ô roi, qu’une décision soit prise ; que l’on fasse des recherches dans les archives royales de mon seigneur le roi, à Babylone,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois la valeur temporelle de νῦν et la valeur conclusive ou transitive de οὖν, dans une tournure française soutenue mais claire.
- source_word: κρίνεται
  choice: qu’une décision soit prise
  rationale: Le passif à valeur impersonnelle appelle ici une décision officielle. Cette formulation convient mieux au contexte administratif que « qu’un jugement soit rendu », plus nettement judiciaire.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif direct est maintenu, ainsi que le ton formel de la requête.
- source_word: ἐπισκεπτήτω
  choice: que l’on fasse des recherches
  rationale: Dans le contexte d’archives, le verbe demande une vérification officielle des documents. Le pluriel idiomatique « des recherches » exprime clairement cette opération.
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: les archives royales
  rationale: Le terme désigne des dépôts de livres ou de documents ; « archives royales » rend naturellement leur fonction administrative sans suggérer une bibliothèque littéraire.
- source_word: τοῦ κυρίου βασιλέως
  choice: de mon seigneur le roi
  rationale: La formule est un titre de déférence adressé au souverain. « Mon seigneur le roi » restitue l’usage de cour sans donner à κύριος une portée divine.
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: La phrase précise simplement l’emplacement des archives ; « à Babylone » est la formulation française la plus naturelle.
theological_decisions:
- issue: Sens de κύριος dans la formule de cour τοῦ κυρίου βασιλέως
  choice: mon seigneur le roi
  alternative: le seigneur roi
  rationale: κύριος qualifie ici un souverain humain dans une formule honorifique et ne constitue pas un titre divin. La minuscule et la tournure possessive évitent une fausse connotation théologique.
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe conserve le ton administratif et déférent de la pétition. Aucun appel de note n’est nécessaire, puisque les variantes lexicales ne modifient pas substantiellement le sens.
