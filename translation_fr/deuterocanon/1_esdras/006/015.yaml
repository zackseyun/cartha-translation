base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: fr
  text: Ils démolirent aussi la Maison[a] et y mirent le feu, puis ils emmenèrent le peuple en captivité à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la maison de Dieu, le Temple.
    reason: Clarification du référent de οἶκον, littéralement « la maison ».
lexical_decisions:
- source_word: οἶκον
  choice: la Maison
  rationale: Le grec dit littéralement « maison ». La majuscule signale ici la maison de Dieu, c’est-à-dire le Temple, tout en conservant l’expression biblique et sans remplacer silencieusement le mot source par « Temple ».
- source_word: καθελόντες
  choice: démolirent
  rationale: Le participe exprime l’action d’abattre ou de détruire une construction. « Démolirent » est naturel, précis et garde la force du grec.
- source_word: ἐνεπύρισαν
  choice: y mirent le feu
  rationale: Le verbe signifie mettre le feu ou incendier. Le pronom « y » reprend clairement la Maison et produit une tournure française naturelle.
- source_word: λαὸν
  choice: le peuple
  rationale: Rendu collectif direct et idiomatique pour la population concernée.
- source_word: ᾐχμαλώτευσαν
  choice: emmenèrent … en captivité
  rationale: Cette formulation conserve l’image explicite de la capture et du déplacement, contrairement à « exilèrent », qui mettrait surtout l’accent sur l’expulsion.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: Rendu directionnel idiomatique en français dans le contexte d’une déportation.
theological_decisions:
- issue: Référent de « la Maison »
  choice: Conserver « la Maison » dans le texte principal, avec une note précisant qu’il s’agit de la maison de Dieu, le Temple.
  alternative: Traduire directement par « le Temple ».
  rationale: Le grec emploie οἶκος, « maison », plutôt qu’un terme explicitement équivalent à « temple ». Le rendu retenu préserve le lexique et l’écho biblique tout en éclairant le référent.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et la succession des actions restent proches du grec, tandis que « y mirent le feu » et « emmenèrent le peuple en captivité » assurent une expression naturelle.
