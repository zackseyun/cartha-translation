base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: fr
  text: La première année du règne de Cyrus, le roi Cyrus ordonna que soit construite la maison du Seigneur à Jérusalem, là où l’on offre des sacrifices par un feu continuel[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « là où l’on offre continuellement des sacrifices par le feu ». L’expression grecque est concise et peut évoquer soit un feu qui brûle continuellement, soit des offrandes par le feu présentées de façon continue.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: La première année du règne de Cyrus
  rationale: Cette formulation rend naturellement en français la datation selon l’année de règne, tout en conservant sa valeur temporelle.
- source_word: βασιλεὺς Κῦρος
  choice: le roi Cyrus
  rationale: L’ordre titre-nom est idiomatique en français et maintient le titre royal explicitement présent dans le grec.
- source_word: προσέταξεν
  choice: ordonna
  rationale: Le verbe exprime un commandement émanant d’une autorité. « Ordonna » est précis sans supposer la forme technique d’un décret.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: la maison du Seigneur
  rationale: « Maison » conserve l’image littérale de οἶκος, qui désigne ici le temple, et « Seigneur » traduit directement κύριος dans ce texte grec.
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: La tournure situe simplement la maison; la préposition « à » est la formulation française naturelle pour une ville.
- source_word: οἰκοδομῆσαι
  choice: que soit construite
  rationale: Après « ordonna », cette proposition au subjonctif exprime clairement le contenu de l’ordre et conserve le fait que la maison est l’objet de la construction.
- source_word: ὅπου
  choice: là où
  rationale: Cette locution rend nettement la valeur locative du relatif et rattache l’activité cultuelle au lieu mentionné.
- source_word: ἐπιθύουσιν
  choice: l’on offre des sacrifices
  rationale: Le verbe a ici un sens cultuel. La formulation explicite ce sens en français sans préciser indûment une catégorie particulière de sacrifice.
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: par un feu continuel
  rationale: 'La traduction suit de près la construction compacte du grec: διά exprime le moyen, tandis que ἐνδελεχής qualifie grammaticalement le feu. Une note signale l’autre compréhension possible de l’ensemble.'
theological_decisions:
- issue: Traduction de κύριος dans le contexte du temple
  choice: Seigneur
  alternative: Éternel / SEIGNEUR
  rationale: Le texte source grec porte κυρίου. « Seigneur » traduit directement ce terme sans rétrovertir ni introduire dans le corps du texte une graphie réservée au tétragramme hébreu.
- issue: Rapport entre le feu continuel et les sacrifices
  choice: par un feu continuel
  alternative: on offre continuellement des sacrifices par le feu
  rationale: L’adjectif grec ἐνδελεχοῦς s’accorde directement avec πυρός, « feu ». Le texte principal maintient ce lien grammatical, tandis que la note préserve la possibilité que l’expression décrive plus largement la continuité des offrandes consumées par le feu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « Cyrus, le roi Cyrus » est conservée parce qu’elle appartient au texte grec. « Maison du Seigneur » garde la métaphore cultuelle de la source tout en restant intelligible. La virgule finale est maintenue, puisque le verset se poursuit syntaxiquement dans le contexte.
