base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: fr
  text: Il ordonna aussi à Sisinnès, gouverneur de Syrie et de Phénicie, à Sathrabouzanès, à leurs collaborateurs et aux dirigeants désignés en Syrie et en Phénicie de se tenir à l’écart de ce lieu et de laisser Zorobabel, serviteur du Seigneur et gouverneur de la Judée, ainsi que les anciens des Juifs, en paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur permettre d’agir ». Le grec dit littéralement « laisser » ou « permettre »; dans ce contexte, il s’agit d’une consigne de non-intervention officielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: Il ordonna aussi à ... de
  rationale: Cette formulation française naturelle restitue la directive officielle exprimée par l’ensemble de la construction grecque sans en reproduire lourdement les deux verbes.
- source_word: ἐπάρχῳ
  choice: gouverneur
  rationale: Le terme désigne ici un administrateur provincial; « gouverneur » est clair et adapté au cadre officiel.
- source_word: συνεταίροις
  choice: collègues
  rationale: Dans ce contexte administratif, il s’agit de personnes associées à ces responsables plutôt que de compagnons personnels.
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: dirigeants établis
  rationale: « Établis » conserve l’idée d’une désignation ou affectation officielle, tandis que « dirigeants » évite de confondre nécessairement leur fonction avec celle de l’ἐπαρχος.
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: se tenir à l’écart de ce lieu
  rationale: La traduction garde l’image spatiale du grec tout en exprimant naturellement l’ordre de non-intervention.
- source_word: ἐᾶσαι
  choice: laisser
  rationale: Le verbe signifie permettre ou laisser faire. Le complément implicite demeure ouvert, comme dans le grec, et la note explicite la portée administrative.
- source_word: παῖδα Κυρίου
  choice: serviteur du Seigneur
  rationale: παῖς peut signifier enfant ou serviteur; appliqué ici honorifiquement à Zorobabel, « serviteur » convient au contexte biblique et officiel.
- source_word: ὕπαρχον
  choice: gouverneur
  rationale: Le mot désigne une personne investie d’autorité sur la Judée; « gouverneur » est l’équivalent français le plus intelligible.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Dans le cadre communautaire juif, le terme désigne vraisemblablement des responsables reconnus et non seulement des hommes âgés.
theological_decisions:
- issue: Traduction de κύριος dans παῖδα Κυρίου
  choice: Seigneur
  alternative: maître
  rationale: Dans ce contexte scripturaire juif, « Seigneur » garde la portée révérencielle du titre sans l’aplatir en simple rapport social.
- issue: Sens de παῖς appliqué à Zorobabel
  choice: serviteur
  alternative: enfant
  rationale: La formule est honorifique et décrit la relation de Zorobabel au Seigneur, non une filiation biologique; elle ne requiert toutefois aucune lecture messianique supplémentaire.
- issue: Portée de ἐᾶσαι
  choice: laisser Zorobabel et les anciens
  alternative: permettre à Zorobabel et aux anciens de poursuivre les travaux
  rationale: Le grec ne précise pas directement l’action permise. Le texte principal conserve cette indétermination, tandis que la note indique le sens contextuel de non-intervention.
translation_notes:
  register: Français international actuel, digne et accessible. Les titres administratifs sont rendus sans archaïsme inutile; la syntaxe conserve la longue énumération officielle tout en restant lisible.
