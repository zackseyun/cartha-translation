    text: 'Ou : « leur permettre d’agir ». Le grec dit littéralement « laisser » ou « permettre »; dans ce contexte, il s’agit d’une consigne de non-intervention officielle.'
    reason: lexical_alternative
  revision_rationale: La révision corrige l’ellipse française tout en gardant l’ambiguïté du grec quant à l’activité concrète que les autorités doivent permettre. Elle évite donc l’ajout interprétatif « poursuivre leur travail », tout en exprimant naturellement la non-ingérence exigée par le contexte.
