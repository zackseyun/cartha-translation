revisions:
- from: Il ordonna aussi à Sisinnès, gouverneur de Syrie et de Phénicie, à Sathrabouzanès, à leurs collègues et aux dirigeants établis en Syrie et en Phénicie de se tenir à l’écart de ce lieu, et de laisser[a] Zorobabel, serviteur du Seigneur et gouverneur de la Judée, ainsi que les anciens des Juifs.
  to: Il ordonna aussi à Sisinnès, gouverneur de Syrie et de Phénicie, à Sathrabouzanès, à leurs collaborateurs et aux dirigeants désignés en Syrie et en Phénicie de se tenir à l’écart de ce lieu et de laisser Zorobabel, serviteur du Seigneur et gouverneur de la Judée, ainsi que les anciens des Juifs, en paix[a].
  rationale: La révision corrige l’ellipse française tout en gardant l’ambiguïté du grec quant à l’activité concrète que les autorités doivent permettre. Elle évite donc l’ajout interprétatif « poursuivre leur travail », tout en exprimant naturellement la non-ingérence exigée par le contexte.
