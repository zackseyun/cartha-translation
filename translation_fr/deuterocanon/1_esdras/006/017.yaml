base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: fr
  text: Quant aux objets sacrés, ceux qui étaient en or et ceux qui étaient en argent, que Nabuchodonosor avait emportés de la maison située à Jérusalem et déposés dans son propre temple, le roi Cyrus les retira de nouveau du temple situé à Babylone, et ils furent remis à Zorobabel et au gouverneur Sabanassar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Sabanassar ; ce nom correspond probablement à celui qui est généralement rendu par « Sheshbatsar » dans le livre d’Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: objets sacrés
  rationale: « Objets » rend largement σκεύη sans suggérer uniquement des récipients, tandis que « sacrés » conserve la consécration exprimée par ἱερά.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: ceux qui étaient en or et ceux qui étaient en argent
  rationale: Cette formulation reprend explicitement « objets » et préserve la répartition grecque en deux catégories.
- source_word: ἐξήνεγκεν
  choice: avait emportés / retira
  rationale: Le plus-que-parfait situe l'action de Nabuchodonosor avant celle de Cyrus; pour la seconde occurrence, « retira » exprime naturellement la sortie du temple et le renversement de la première action.
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: la maison située à Jérusalem
  rationale: « Maison » conserve le terme οἶκος et sa distinction d'avec ναός, tout en restant compréhensible dans le contexte du sanctuaire de Jérusalem.
- source_word: ἀπηρείσατο
  choice: déposés
  rationale: Le verbe décrit la mise en place délibérée des objets; « déposés » convient au contexte cultuel et administratif.
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: dans son propre temple
  rationale: « Temple » rend ναός et « propre » fait ressortir le possessif emphatique αὐτοῦ.
- source_word: πάλιν
  choice: à son tour
  rationale: Dans ce contexte, l'expression marque l'action inverse accomplie ensuite par Cyrus sans laisser entendre qu'il avait déjà effectué cette sortie auparavant.
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: du temple situé à Babylone
  rationale: « Temple » rend ναός; « Babylone » est la désignation française naturelle du lieu dans ce récit, bien que Βαβυλωνία puisse aussi désigner la Babylonie.
- source_word: παρεδόθη
  choice: les remit
  rationale: La tournure active avec Cyrus comme sujet est naturelle en français et conserve l'idée d'un transfert officiel de garde exprimée par le passif grec.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forme française biblique usuelle, correspondant au nom grec et à la tradition sémitique parallèle.
- source_word: Σαβανασσάρῳ
  choice: Sabanassar
  rationale: Translittération française proche de la forme grecque, maintenue dans le texte principal puisque le grec de 1 Esdras est le témoin de base.
- source_word: τῷ ἐπάρχῳ
  choice: au gouverneur
  rationale: « Gouverneur » est l'équivalent moderne le plus clair pour la fonction administrative désignée par ἔπαρχος.
theological_decisions:
- issue: Distinction entre οἶκος pour le sanctuaire de Jérusalem et ναός pour le temple babylonien
  choice: Rendre οἶκος par « maison » et ναός par « temple »
  alternative: Rendre les deux termes par « temple »
  rationale: Le maintien de la distinction lexicale reflète le grec sans imposer une assimilation absente de la formulation source.
- issue: Forme du nom Σαβανασσάρ
  choice: Sabanassar dans le texte, avec une note signalant Sheshbatsar
  alternative: Employer Sheshbatsar directement dans le texte
  rationale: Le texte principal suit la forme grecque de 1 Esdras; la note permet l'identification avec la forme mieux connue dans Esdras sans harmoniser silencieusement les témoins.
- issue: Valeur de πάλιν
  choice: à son tour
  alternative: de nouveau
  rationale: « À son tour » exprime ici le mouvement inverse et ultérieur de Cyrus, alors que « de nouveau » pourrait suggérer à tort que Cyrus avait déjà retiré ces objets auparavant.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase ample suit la structure narrative du grec, avec une ponctuation qui clarifie les actions successives. La distinction « maison »/« temple » est volontairement conservée.
