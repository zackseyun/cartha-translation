base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: fr
  text: C’est pourquoi, que le Seigneur[a], dont le nom a été invoqué en ce lieu, anéantisse tout roi et toute nation qui étendra la main pour empêcher ou pour nuire à cette maison du Seigneur qui est à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dont le nom est appelé en ce lieu ». Le grec peut être rendu ainsi ; « a été invoqué » en exprime le sens cultuel dans ce contexte.'
    reason: Alternative lexicale préservant l’ambiguïté de la formule grecque.
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence et l’imprécation du décret.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Désigne ici le Dieu d’Israël; « Seigneur » est la traduction française consacrée de κύριος dans ce contexte.
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: dont le nom est invoqué en ce lieu
  rationale: Préserve le passif grec et le lien cultuel entre le nom de Dieu et le temple, sans transformer la formule en théologie de la demeure.
- source_word: ἀφανίσαι
  choice: anéantisse
  rationale: Rend la forte idée de disparition ou de destruction et, au subjonctif après « que », exprime la valeur imprécatoire de l’infinitif.
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: tout roi et toute nation
  rationale: Reproduit la portée distributive de πάντα en français naturel.
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: qui étendra la main
  rationale: Conserve l’image biblique d’une action hostile tout en évitant un pronom possessif français ambigu après deux antécédents.
- source_word: κωλῦσαι ἢ κακοποιῆσαι
  choice: pour empêcher ou pour maltraiter
  rationale: « Empêcher » exprime l’obstruction; « maltraiter » garde la portée active et hostile de κακοποιέω sans la limiter aux seuls dégâts matériels.
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: cette maison du Seigneur qui est à Jérusalem
  rationale: Conserve le démonstratif et l’expression biblique « maison du Seigneur », tout en rendant clairement la localisation.
theological_decisions:
- issue: Formule du nom divin associée au temple
  choice: dont le nom est invoqué en ce lieu
  alternative: dont le nom est appelé en ce lieu
  rationale: « Invoqué » exprime bien le sens cultuel possible de ἐπικέκληται; la note conserve la formulation plus littérale et l’ambiguïté réelle du grec.
- issue: Valeur de l’infinitif ἀφανίσαι dans le décret
  choice: que le Seigneur… anéantisse
  alternative: le Seigneur anéantira
  rationale: Le subjonctif optatif français rend l’imprécation ou le souhait; un futur en ferait indûment une simple prédiction.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le ton solennel d’un décret sans archaïsmes. « En ce lieu » évite la lourdeur de « là » dans la relative, et « qui étendra la main » maintient l’image source sans problème d’accord pronominal.
