review_pass:
  verdict: revise
  source_fidelity: 'La structure et la valeur imprécatoire sont bien rendues : διὰ ταῦτα introduit la conséquence, et le subjonctif après « que » exprime convenablement la force de souhait-décret de ἀφανίσαι. « Tout roi et toute nation » conserve la portée distributive, et « étendra la main » maintient l’image grecque. La forme verbale « a été invoqué » rend plus exactement le parfait passif ἐπικέκληται que le présent « est invoqué ».'
  naturalness: Le texte est globalement fluide et d’un registre solennel approprié. Toutefois, « maltraiter cette maison » s’emploie plus naturellement pour des personnes ou des êtres vivants et sonne peu idiomatique pour un édifice. « Nuire à cette maison » rend naturellement le sens large de κακοποιῆσαι sans le réduire au dommage matériel.
  terminology: « Seigneur », « maison du Seigneur » et « en ce lieu » sont justes et cohérents avec le contexte cultuel. La note conserve utilement l’alternative plus littérale sans imposer une interprétation théologique plus développée.
  issues:
  - severity: low
    issue: Temps de la formule relative
    rationale: Le grec ἐπικέκληται est un parfait passif. « Dont le nom a été invoqué en ce lieu » le reflète plus précisément que « dont le nom est invoqué en ce lieu ».
  - severity: medium
    issue: « Maltraiter » appliqué à la maison
    rationale: Pour τὸν οἶκον, « maltraiter » est peu naturel en français. « Nuire à » préserve la portée générale de κακοποιῆσαι (« faire du mal à », « porter préjudice à ») et convient à un bâtiment ou au sanctuaire.
