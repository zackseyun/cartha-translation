revisions:
- from: C’est pourquoi, que le Seigneur[a], dont le nom est invoqué en ce lieu, anéantisse tout roi et toute nation qui étendra la main pour empêcher ou pour maltraiter cette maison du Seigneur qui est à Jérusalem.
  to: C’est pourquoi, que le Seigneur[a], dont le nom a été invoqué en ce lieu, anéantisse tout roi et toute nation qui étendra la main pour empêcher ou pour nuire à cette maison du Seigneur qui est à Jérusalem.
  rationale: La révision ajuste le parfait passif grec et remplace une collocation française peu naturelle par une expression qui respecte le sens non spécifié de l’action hostile envers le sanctuaire. Le reste du texte est conservé, notamment le ton imprécatoire, l’imagerie de la main tendue et l’expression « maison du Seigneur ».
