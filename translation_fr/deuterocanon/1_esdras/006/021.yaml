revisions:
- from: Et si l’on constate que la construction de la maison du Seigneur à Jérusalem a été entreprise avec l’autorisation du roi Cyrus[a], et si notre seigneur le roi le juge bon, qu’il nous fasse connaître sa décision à ce sujet.
  to: Et si l’on constate que la construction de la maison du Seigneur à Jérusalem a été réalisée avec l’autorisation du roi Cyrus[a], et si notre seigneur le roi le juge bon, qu’il nous réponde au sujet de ces questions.
  rationale: La révision remplace une formulation susceptible de limiter la construction à son lancement par « a été réalisée », qui rend plus exactement l’accomplissement exprimé par γενομένην. Elle remplace également l’ajout interprétatif « sa décision » par « qu’il nous réponde », fidèle à la demande de communication officielle sans en préciser indûment le contenu.
