base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: fr
  text: Et si l’on constate que la construction de la maison du Seigneur à Jérusalem a été réalisée avec l’autorisation du roi Cyrus[a], et si notre seigneur le roi le juge bon, qu’il nous réponde au sujet de ces questions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « la construction du Seigneur à Jérusalem » ; dans le contexte, il s’agit de la construction de la maison, ou du temple, du Seigneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: si l’on constate
  rationale: Rend naturellement le passif dans le cadre d’une enquête administrative, sans préciser indûment si le constat vient d’archives ou d’une autre recherche.
- source_word: μετὰ τῆς γνώμης Κύρου τοῦ βασιλέως
  choice: avec l’autorisation du roi Cyrus
  rationale: Dans ce contexte royal et administratif, γνώμη désigne vraisemblablement l’assentiment ou l’autorisation de Cyrus plutôt qu’une simple opinion.
- source_word: γενομένην τὴν οἰκοδομήν
  choice: la construction … a été entreprise
  rationale: Le participe γενόμενην indique que le projet de construction a eu lieu. « A été entreprise » convient au projet visé sans lui attribuer explicitement un achèvement que la formule n’exige pas.
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: de la maison du Seigneur à Jérusalem
  rationale: Le grec dit littéralement « du Seigneur qui est à Jérusalem », mais le contexte de construction appelle un sanctuaire implicite. « Maison du Seigneur » conserve l’expression biblique et évite de laisser entendre que le Seigneur lui-même serait localisé à Jérusalem.
- source_word: κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: si notre seigneur le roi le juge bon
  rationale: Cette formulation garde le caractère déférent de la correspondance de cour et rend κρίνηται comme une décision jugée appropriée.
- source_word: προσφωνησάτω ἡμῖν περὶ τούτων
  choice: qu’il nous fasse connaître sa décision à ce sujet
  rationale: Dans cette correspondance officielle, προσφωνέω signifie communiquer ou répondre. La mention de « sa décision » explicite sobrement ce que le roi doit faire connaître au sujet de l’affaire examinée.
theological_decisions:
- issue: Le mot κύριος désigne à la fois Dieu et le roi dans le même verset
  choice: « Seigneur » pour Dieu et « seigneur » pour le roi
  alternative: Employer « maître » ou « souverain » pour le roi
  rationale: La majuscule distingue clairement le titre divin de la formule honorifique royale tout en conservant le même terme français, comme le fait le grec.
- issue: Objet implicite de la construction
  choice: Ajouter « maison » dans le texte et signaler l’ellipse grecque en note
  alternative: Traduire « temple du Seigneur » ou conserver littéralement « construction du Seigneur »
  rationale: Le contexte concerne le sanctuaire de Jérusalem. « Maison du Seigneur » rend le sens sans imposer « temple » au texte grec elliptique, tandis que la note préserve la forme exacte de la source.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour administratif et déférent est conservé sans archaïsmes. La distinction typographique entre « Seigneur » et « seigneur » marque les deux référents de κύριος.
