base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
translation:
  language: fr
  text: Et ils ne furent pas empêchés de construire jusqu’à ce qu’un rapport à leur sujet soit adressé à Darius et qu’une réponse soit donnée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et que l’on s’adresse à quelqu’un ». Le verbe grec peut désigner le fait de s’adresser à quelqu’un ou, dans ce contexte administratif, qu’une réponse officielle soit donnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  choice: ils ne furent pas empêchés
  rationale: Le passif de κωλύω exprime l’idée d’être empêché ou entravé. Cette formulation française conserve clairement le passif.
- source_word: τῆς οἰκοδομῆς
  choice: de poursuivre la construction
  rationale: Le génitif après κωλύω indique l’activité qu’on ne les empêcha pas d’accomplir. « Poursuivre la construction » rend naturellement le travail déjà en cours dans le contexte.
- source_word: μέχρις οὗ
  choice: jusqu’à ce que
  rationale: Équivalent temporel direct et idiomatique en français.
- source_word: ὑποσημανθῆναι
  choice: qu’un rapport … soit adressé
  rationale: Le verbe peut désigner le fait de signaler ou de communiquer officiellement. Dans ce contexte administratif, « rapport » rend bien la communication envoyée au roi.
- source_word: Δαρείῳ
  choice: à Darius
  rationale: Forme française usuelle du nom propre, avec le datif rendu par « à ».
- source_word: περὶ αὐτῶν
  choice: à leur sujet
  rationale: Expression française naturelle qui conserve la référence quelque peu ouverte du pronom grec aux personnes ou à leur affaire.
- source_word: προσφωνηθῆναι
  choice: qu’une réponse soit donnée
  rationale: Dans la succession administrative du passage, le verbe évoque vraisemblablement une réponse officielle, tout en pouvant plus littéralement signifier que quelqu’un est interpellé ou qu’on s’adresse à lui; cette ambiguïté est signalée en note.
