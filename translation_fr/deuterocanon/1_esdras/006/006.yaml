review_pass:
  verdict: revise
  source_fidelity: 'Le sens administratif du grec est globalement bien rendu : les bâtisseurs ne sont pas entravés, jusqu’à la transmission d’une information à Darius et à une réponse. Toutefois, « poursuivre la construction » explicite une continuité qui n’est pas formulée par τῆς οἰκοδομῆς, lequel signifie plus sobrement « construire » / « les travaux de construction ».'
  naturalness: La phrase est naturelle en français moderne. « Un rapport ... soit adressé à Darius » et « une réponse soit donnée » conviennent au registre administratif. La note actuelle emploie toutefois « interpellé », terme qui suggère facilement une interpellation policière ou accusatrice et ne rend pas naturellement l’alternative lexicale.
  terminology: « Darius » est la forme française usuelle. « Rapport », « réponse » et « construction » sont appropriés. L’alternative de note doit conserver l’indétermination du grec προσφωνηθῆναι sans introduire le sens moderne spécialisé d’« interpeller ».
  issues:
  - severity: low
    issue: « poursuivre la construction » ajoute l’idée de continuation.
    rationale: Le grec exprime qu’ils ne furent pas empêchés « de construire »; le contexte peut impliquer des travaux déjà commencés, mais le verset ne l’explicite pas.
  - severity: medium
    issue: La note « que quelqu’un soit interpellé » est maladroite et potentiellement trompeuse.
    rationale: προσφωνηθῆναι peut renvoyer au fait d’être abordé ou de recevoir une adresse, mais « interpeller » évoque couramment en français une sommation ou une action policière. Une formulation neutre doit préserver l’ambiguïté.
