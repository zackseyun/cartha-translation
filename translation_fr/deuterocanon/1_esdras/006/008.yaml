base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: fr
  text: 'Que tout soit porté à la connaissance de notre seigneur le roi : lorsque nous sommes arrivés dans le pays de Judée et à Jérusalem, la ville, nous avons trouvé, à Jérusalem, la ville, les anciens des Juifs de la captivité[a], qui construisaient une grande maison neuve pour le Seigneur[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les anciens des Juifs de la captivité ». La formulation grecque est condensée; elle désigne les responsables juifs en lien avec la captivité, sans préciser davantage la relation.'
    reason: lexical_alternative
  - marker: b
    text: La « maison pour le Seigneur » désigne le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: Que tout soit porté à la connaissance
  rationale: Cette formulation française naturelle conserve la valeur injonctive de ἔστω et le caractère officiel de la formule employée dans un rapport adressé au roi.
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: de notre seigneur le roi
  rationale: Ici, κύριος est un titre de cour appliqué au roi. La minuscule distingue cet emploi de la désignation divine plus loin dans le verset, tout en conservant le même terme de base.
- source_word: παραγενόμενοι
  choice: lorsque nous sommes arrivés
  rationale: Le participe a ici une valeur temporelle et situe la découverte rapportée ensuite.
- source_word: εἰς τὴν χώραν τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ τὴν πόλιν
  choice: dans le pays de Judée et dans la ville de Jérusalem
  rationale: « Pays » laisse à χώρα sa portée géographique sans lui imposer un sens administratif précis. La formulation française intègre naturellement l’apposition « la ville ».
- source_word: κατελάβομεν
  choice: nous y avons trouvé
  rationale: Dans ce contexte, le verbe signifie rencontrer ou trouver des personnes occupées à bâtir, non les saisir ou s’emparer d’elles.
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: les anciens des Juifs revenus de captivité
  rationale: La suite grecque est condensée et rattache les anciens à la communauté juive marquée par la captivité. « Revenus » explicite avec mesure la situation narrative de ces hommes désormais présents à Jérusalem; une note conserve la tournure plus littérale.
- source_word: οἰκοδομοῦντας οἶκον
  choice: ils construisaient une ... maison
  rationale: La proposition distincte évite une longue chaîne participiale en français. « Maison » rend οἶκος sans substituer directement « temple » au mot grec.
- source_word: τῷ κυρίῳ
  choice: pour le Seigneur
  rationale: Ici, κύριος désigne le Dieu d’Israël. La majuscule et le contexte le distinguent du titre royal au début du verset.
- source_word: μέγαν καινόν
  choice: une grande maison neuve
  rationale: Cette expression conserve les deux qualificatifs du grec sans donner à μέγαν le sens plus interprétatif de « magnifique ».
theological_decisions:
- issue: Le double emploi de κύριος pour le roi perse et pour le Dieu d’Israël
  choice: Employer « seigneur » avec une minuscule pour le titre royal, puis « Seigneur » avec une majuscule pour Dieu.
  alternative: Employer « maître » ou « souverain » pour le roi et réserver « Seigneur » à Dieu.
  rationale: Le choix retenu maintient la transparence lexicale du grec, qui emploie le même mot, tandis que la casse et le contexte distinguent clairement les deux référents.
- issue: L’identification de la « maison » construite pour le Seigneur
  choice: Conserver « maison » dans le texte et préciser en note qu’il s’agit du temple.
  alternative: Traduire directement οἶκος par « temple ».
  rationale: Le texte grec dit littéralement « maison ». La note rend explicite le référent cultuel sans effacer l’image ni surinterpréter le lexème.
translation_notes:
  register: Français international moderne, digne et accessible. Le début conserve le ton officiel d’un rapport adressé au roi. La longue phrase grecque est légèrement articulée en deux propositions pour rester claire, sans supprimer la répétition de Jérusalem ni la distinction entre le titre royal et le titre divin.
