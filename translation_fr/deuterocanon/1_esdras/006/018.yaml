base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: fr
  text: Il reçut l’ordre et rapporta tous ces objets[a] pour les déposer dans le temple de Jérusalem, et le temple du Seigneur devait être bâti sur son emplacement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un aoriste indicatif : littéralement, « il rapporta tous ces objets ». Dans le contexte de l’ordre, cette formulation peut résumer l’exécution de la restitution; « ramena » est aussi possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: Il lui fut ordonné
  rationale: Le passif et le datif sont conservés sans préciser l’auteur de l’ordre; la tournure relève d’un registre officiel et reste naturelle en français.
- source_word: ἀπήνεγκεν
  choice: de rapporter
  rationale: Dans ce contexte, le verbe exprime le transport des objets vers Jérusalem avec l’idée de restitution; « rapporter » rend ce mouvement sans développer davantage le grec.
- source_word: πάντα τὰ σκεύη ταῦτα
  choice: tous ces objets
  rationale: σκεύη désigne ici les objets ou ustensiles du temple. « Objets » est clair en français moderne et évite le sens courant trompeur de « vases ».
- source_word: ἀποθεῖναι
  choice: de les déposer
  rationale: Le verbe indique que les objets doivent être placés dans le temple. Le pronom explicite le complément sous-entendu en grec.
- source_word: ναός
  choice: temple
  rationale: « Temple » est le terme français courant et digne dans ce contexte, même si ναός peut parfois désigner plus précisément le sanctuaire.
- source_word: κυρίου
  choice: du Seigneur
  rationale: La traduction traditionnelle et intelligible de κύριος est retenue pour désigner le Dieu d’Israël.
- source_word: οἰκοδομηθῆναι
  choice: de bâtir
  rationale: Le grec dit littéralement que le temple doit « être bâti ». L’infinitif actif français s’intègre naturellement après « il lui fut ordonné » sans imposer « rebâtir », qui est contextuel mais non explicite.
- source_word: ἐπὶ τοῦ τόπου
  choice: sur son emplacement
  rationale: La formule indique le lieu propre ou antérieur du temple. Le possessif, fourni par le contexte, donne une expression française naturelle.
theological_decisions:
- issue: Traduction de κύριος dans le contexte du temple de Jérusalem
  choice: le Seigneur
  alternative: Seigneur
  rationale: Avec « temple », l’expression française consacrée « le temple du Seigneur » identifie naturellement le Dieu d’Israël sans ajouter de précision doctrinale.
- issue: Construction ou reconstruction du temple
  choice: bâtir
  alternative: rebâtir
  rationale: Le contexte historique suggère une reconstruction, mais οἰκοδομηθῆναι signifie formellement « être bâti ». Le texte principal préserve cette formulation, tandis que la note signale l’autre lecture contextuelle.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure initiale conserve le caractère officiel du décret; les termes potentiellement archaïques comme « vases » au sens d’objets cultuels sont évités.
