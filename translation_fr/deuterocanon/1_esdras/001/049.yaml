base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: fr
  text: Mais eux se moquèrent de ses messagers[a] et, chaque fois que le Seigneur parlait, ils tournaient ses prophètes en dérision, jusqu’au moment où, irrité contre sa nation à cause de leurs actes impies, il donna l’ordre aux rois des Chaldéens[b] de monter contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses anges » ; ici, le contexte désigne plus probablement les messagers humains de Dieu, notamment à cause du parallèle avec « ses prophètes ».
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « les rois des Chaldéens » au pluriel. Le parallèle hébraïque de 2 Chroniques 36 met plutôt en avant le roi de Babylone, Nabuchodonosor. Le texte principal suit ici le témoin grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: se moquèrent de
  rationale: Le verbe exprime une dérision méprisante. Cette formulation est naturelle en français moderne tout en conservant la force du grec.
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: de ses messagers
  rationale: Dans ce contexte historique et prophétique, ἄγγελοι désigne vraisemblablement des envoyés humains de Dieu, comme le suggère le parallèle immédiat avec « ses prophètes ». L’autre sens possible est signalé en note.
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: chaque fois que le Seigneur parlait
  rationale: L’expression temporelle est rendue selon sa valeur contextuelle répétitive et s’accorde avec l’imparfait périphrastique qui suit, dans un français naturel.
- source_word: ἐκπαίζοντες
  choice: ils tournaient ... en dérision
  rationale: Cette expression rend l’idée de traiter les prophètes comme objets de moquerie et évite de répéter exactement le premier verbe.
- source_word: θυμῶντα αὐτὸν
  choice: irrité
  rationale: Le participe grec est conservé comme état du Seigneur conduisant à l’ordre de jugement, sans développer davantage le rapport syntaxique.
- source_word: ἐπὶ τῷ ἔθνει αὐτοῦ
  choice: contre sa nation
  rationale: « Nation » correspond directement à ἔθνος et maintient la désignation collective du peuple concerné.
- source_word: διὰ τὰ δυσσεβήματα
  choice: à cause de leurs actes impies
  rationale: Cette traduction garde à la fois le caractère concret des actes et leur dimension d’irrévérence envers Dieu.
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: il ordonne ... de monter contre eux
  rationale: La formulation préserve l’ordre divin et l’image grecque d’une montée militaire contre le peuple.
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: les rois des Chaldéens
  rationale: Le pluriel du témoin grec est maintenu sans harmonisation avec la tradition hébraïque parallèle au singulier.
theological_decisions:
- issue: Référent de ἀγγέλοις dans le contexte du rejet de la parole divine
  choice: des messagers humains envoyés par Dieu
  alternative: des anges célestes
  rationale: Le parallélisme immédiat avec les prophètes favorise le sens d’envoyés humains. La possibilité lexicale « anges » reste explicitement ouverte dans la note.
- issue: Pluriel grec « rois des Chaldéens » face au parallèle hébraïque
  choice: maintenir le pluriel du grec
  alternative: le roi des Chaldéens, ou Nabuchodonosor, roi de Babylone
  rationale: Pour 1 Esdras, le grec est le témoin source principal. Le parallèle hébraïque sert de contrôle mais ne doit pas remplacer sa formulation.
- issue: Agent de la colère et de l’ordre de jugement
  choice: le Seigneur est le sujet implicite de « irrité » et de « ordonne »
  alternative: expliciter de nouveau « le Seigneur »
  rationale: La continuité grammaticale du grec rattache le participe et l’infinitif au Seigneur déjà nommé. Le français peut garder cette continuité sans ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase longue et sa progression vers le jugement sont conservées, avec une syntaxe française fluide. « Seigneur » traduit Κύριος ; « Chaldéens » conserve la désignation historique traditionnelle.
