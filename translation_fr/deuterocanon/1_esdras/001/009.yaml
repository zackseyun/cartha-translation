base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: fr
  text: Jéchonias, Samaias, Nathanaël, son frère, Sabias, Ochielos et Joram, chefs de milliers, donnèrent aux lévites, pour la Pâque, mille moutons et sept cents veaux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle hébreu de 2 Chroniques 35.9 donne d’autres noms de responsables et d’autres nombres : 2 600 animaux pour la Pâque et 300 bovins. La présente traduction suivant le texte grec de 1 Esdras, les noms et les nombres grecs sont conservés dans le texte.'
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: chefs de milliers
  rationale: Le titre désigne littéralement des responsables placés à la tête d’un millier. « Chefs de milliers » en conserve la forme sans lui imposer une coloration romaine ou strictement militaire.
- source_word: εἰς πάσχα
  choice: pour la Pâque
  rationale: La tournure exprime la destination des animaux en rapport avec la célébration et le sacrifice pascals, sans préciser davantage la nuance cultuelle.
- source_word: πρόβατα
  choice: moutons
  rationale: Le terme grec désigne couramment les bêtes du petit bétail, en particulier les moutons. Ce choix est direct et lisible, tout en évitant de préciser « agneaux » au-delà du grec.
- source_word: μόσχους
  choice: veaux
  rationale: μόσχος désigne généralement un veau ou un jeune bovin. « Veaux » est la traduction française la plus directe sans préciser le sexe.
- source_word: ὁ ἀδελφὸς
  choice: son frère
  rationale: Bien que le grec porte littéralement « le frère », le français exige normalement un lien possessif dans cette apposition. L’antécédent le plus naturel est Samaias, immédiatement précédent, mais le grec ne l’explicite pas entièrement.
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: donnèrent aux lévites
  rationale: Cette formulation reproduit simplement le verbe de transfert et son complément indirect, sans surinterprétation administrative.
