  naturalness: La phrase est claire, de registre digne et naturel dans l’ensemble. « En bon ordre », « préparez les sacrifices », « vos frères », « célébrez la Pâque » et « le Seigneur » conviennent au français international moderne. La première expression sacrificielle demande une clarification idiomatique.
