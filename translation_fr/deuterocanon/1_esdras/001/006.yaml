base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: fr
  text: En bon ordre[a], sacrifiez la victime pascale, préparez les sacrifices pour vos frères[b] et célébrez la Pâque conformément au commandement du Seigneur donné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon l’ordre établi » ou « selon vos rangs ». L’expression évoque une disposition organisée; le parallèle hébreu insiste sur les divisions ou les groupes.
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne les autres membres du peuple, et pas nécessairement des frères biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: En bon ordre
  rationale: La locution grecque, elliptique et adverbiale, évoque une disposition ordonnée. « En bon ordre » reste concise et naturelle; le parallèle hébreu, qui mentionne des divisions ou des groupes, confirme cette idée d’organisation.
- source_word: θύσατε τὸ πάσχα
  choice: sacrifiez la Pâque
  rationale: Dans ce contexte cultuel, θύω désigne l’acte sacrificiel. « Sacrifiez la Pâque » conserve l’expression grecque et son ampleur, sans réduire explicitement πάσχα à l’agneau pascal.
- source_word: τὰς θυσίας ἑτοιμάσατε
  choice: préparez les sacrifices
  rationale: Traduction directe et idiomatique qui maintient le vocabulaire sacrificiel du passage.
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: pour vos frères
  rationale: Le terme masculin familial est conservé, tout en signalant en note qu’il désigne ici les autres membres du peuple et non uniquement des frères biologiques.
- source_word: ποιήσατε τὸ πάσχα
  choice: célébrez la Pâque
  rationale: Avec πάσχα, ποιέω exprime l’observance de la fête. « Célébrez » est le tour français courant et digne, distinct du premier emploi sacrificiel.
- source_word: κατὰ τὸ πρόσταγμα
  choice: conformément au commandement
  rationale: πρόσταγμα désigne un ordre revêtu d’autorité. « Conformément à » rend naturellement la norme imposée.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le texte grec porte κύριος; « Seigneur » traduit directement ce titre sans rétroversion conjecturale en petites capitales.
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: donné à Moïse
  rationale: Le participe se rapporte naturellement au commandement. La formulation concise respecte la construction grecque.
theological_decisions:
- issue: Portée communautaire de ἀδελφοῖς
  choice: frères
  alternative: compatriotes; frères et sœurs; membres de votre peuple
  rationale: « Frères » préserve l’image familiale et le genre grammatical du grec. La note précise sa portée collective afin d’éviter de le limiter aux seuls frères biologiques.
- issue: Rendu de κύριος dans le texte grec de 1 Esdras
  choice: Seigneur
  alternative: ÉTERNEL
  rationale: La source première porte κύριος. La traduction ne rétablit pas un tétragramme absent du témoin grec.
- issue: Double emploi de πάσχα
  choice: « sacrifiez la Pâque » puis « célébrez la Pâque »
  alternative: « sacrifiez l’agneau pascal » puis « observez la Pâque »
  rationale: Le premier contexte met l’accent sur le sacrifice, tandis que ποιεῖν τὸ πάσχα désigne l’observance. Le maintien de « Pâque » aux deux endroits conserve néanmoins l’ambiguïté lexicale du grec entre victime et célébration.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel et le vocabulaire cultuel sont maintenus. « Célébrez la Pâque » rend idiomatiquement ποιήσατε τὸ πάσχα, tandis que « sacrifiez la Pâque » conserve la tension entre la fête et sa victime sacrificielle.
