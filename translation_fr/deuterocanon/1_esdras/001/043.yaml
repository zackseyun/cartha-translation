base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: fr
  text: Un an plus tard, Nabuchodonosor le fit emmener[a] à Babylone avec les objets sacrés du Seigneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le fit déporter ». Le verbe grec peut désigner un transfert ou une déportation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: Un an plus tard
  rationale: La tournure exprime l’écoulement d’une année. « Un an plus tard » est naturel en français narratif et reste fidèle au sens temporel du grec.
- source_word: ἀποστείλας
  choice: envoya ses gens
  rationale: Le participe signifie littéralement « ayant envoyé », sans complément exprimé. Le français exige ici plus facilement un objet ; « ses gens » explicite sobrement les agents implicites sans préciser leur identité.
- source_word: μετήγαγεν αὐτόν
  choice: le fit emmener
  rationale: Le verbe désigne le transfert ou la conduite d’une personne d’un lieu à un autre. La construction factitive rend naturellement l’action exercée par l’intermédiaire des agents envoyés.
- source_word: ἅμα τοῖς ἱεροῖς σκεύεσιν
  choice: avec les objets sacrés
  rationale: ἅμα marque ici l’accompagnement. σκεύη est plus large que « vases » et peut désigner divers objets ou ustensiles ; « objets sacrés » évite donc une restriction indue.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le grec porte κυρίου. « Seigneur » suit directement le témoin grec principal sans réintroduire typographiquement le nom divin à partir d’un éventuel arrière-plan hébreu.
theological_decisions:
- issue: Traduction de κύριος dans ce récit deutérocanonique
  choice: Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le témoin principal est grec et lit κυρίου. « Seigneur » conserve cette forme sans imposer la restitution du tétragramme.
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve la virgule finale, car le verset se poursuit syntaxiquement. « Ses gens » explicite avec retenue les agents laissés implicites en grec.
