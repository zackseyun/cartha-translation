  yaml_path: translation/deuterocanon/1_esdras/001/024.yaml
  text: Josiah met him[a]. And the king of Egypt sent word to him, saying, “What is there between me and you[b], O king of Judea?”
translation:
  language: fr
  text: 'Josias alla à sa rencontre. Le roi d’Égypte lui envoya ce message : « Qu’y a-t-il entre moi et toi[a], roi de Judée[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus idiomatique : « Qu’ai-je à faire avec toi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « roi de Judée » ; dans le récit parallèle des Chroniques, le titre correspond à « roi de Juda ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: Josias alla à sa rencontre
  rationale: Le grec transmis est ici extrêmement condensé et se présente comme un fragment lié au contexte précédent. La tournure française restitue naturellement l’idée de rencontre exprimée par ἀπάντησις sans ajouter les détails d’un affrontement.
- source_word: διεπέμψατο
  choice: envoya alors ce message
  rationale: Le verbe désigne un envoi, souvent effectué par des intermédiaires. « Envoya ce message » exprime l’acte de communication sans introduire explicitement des messagers absents du texte.
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Qu’y a-t-il entre moi et toi
  rationale: Cette formulation conserve la structure et l’ambiguïté de l’expression grecque, qui marque une prise de distance ou une contestation, sans en accentuer artificiellement l’hostilité.
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: roi de Judée
  rationale: Ἰουδαία désigne ici la Judée. Ce choix suit directement le témoin grec, tandis que « Juda », conforme au parallèle historique des Chroniques, est signalé en note.
theological_decisions:
- issue: Portée de la formule Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Qu’y a-t-il entre moi et toi
  alternative: Qu’ai-je à faire avec toi ?
  rationale: La traduction principale reste proche de la forme grecque et laisse ouverte la nuance exacte, de la simple prise de distance à la confrontation.
- issue: Désignation territoriale Ἰουδαίας
  choice: Judée
  alternative: Juda
  rationale: « Judée » traduit le terme du témoin grec sans l’harmoniser silencieusement avec le récit parallèle des Chroniques.
translation_notes:
  register: Français international moderne, clair et digne. Le vocatif est rendu sans « ô », aujourd’hui marqué comme littéraire, tout en restant explicite grâce à l’adresse directe « roi de Judée ». Le connecteur « alors » assure un enchaînement naturel sans modifier la logique du récit.
