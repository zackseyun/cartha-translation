base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: fr
  text: 'Le roi dit à ses serviteurs[a] : « Éloignez-moi du combat, car je suis devenu très faible. » Aussitôt, ses serviteurs l’éloignèrent de la ligne de bataille,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assistants ». Le grec παῖδες peut désigner des serviteurs, des assistants ou de jeunes hommes ; le texte hébreu parallèle porte « ses serviteurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: serviteurs
  rationale: Dans ce contexte royal et militaire, le terme désigne les serviteurs ou assistants personnels du roi, non des enfants. Le parallèle hébreu עֲבָדָיו appuie « ses serviteurs ».
- source_word: Ἀποστήσατέ με
  choice: Éloignez-moi
  rationale: L’impératif demande qu’on retire physiquement le roi de la zone de combat. « Éloignez-moi » est naturel en français et conserve le sens causatif.
- source_word: ἀπὸ τῆς μάχης
  choice: du combat
  rationale: μάχη désigne le combat lui-même. « Du combat » exprime clairement le retrait de l’affrontement en cours.
- source_word: ἠσθένησα
  choice: je suis très faible
  rationale: Le verbe indique un état de faiblesse sans préciser à lui seul qu’il s’agit d’une blessure. Le présent français rend naturellement l’état immédiat du roi.
- source_word: λίαν
  choice: très
  rationale: Cet adverbe intensifie la faiblesse; « très » est idiomatique et fidèle.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Le mot marque l’exécution immédiate de l’ordre. « Aussitôt » convient au registre narratif biblique moderne.
- source_word: παράταξις
  choice: ligne de bataille
  rationale: Le terme désigne la formation militaire déployée; « ligne de bataille » est plus précis qu’une simple répétition de « combat ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La distinction grecque entre μάχη (« combat ») et παράταξις (« ligne de bataille ») est maintenue. La virgule finale est conservée puisque le verset se poursuit dans le contexte éditorial fourni.
