base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: fr
  text: Vous n’aurez pas à la porter sur vos épaules[a]. Maintenant, servez le Seigneur votre Dieu, mettez-vous au service de son peuple, Israël, et préparez-vous selon vos groupes familiaux et vos tribus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « la » désigne l’arche, connue par le contexte.
    reason: cross_reference
  - marker: b
    text: 'Grec : « tribus ». Le passage parallèle en 2 Chroniques 35:4 porte « divisions », c’est-à-dire les groupes organisés pour le service.'
    reason: textual_parallel
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι
  choice: Vous n’aurez pas à la porter
  rationale: La construction future de εἰμί avec le datif exprime ici l’absence de nécessité ou d’obligation. Cette formulation française est naturelle tout en conservant la valeur de l’instruction.
- source_word: ἐπʼ ὤμων
  choice: sur vos épaules
  rationale: Rend directement l’image concrète du transport sur les épaules.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom féminin renvoie à l’arche, mentionnée dans le contexte mais non nommée dans ce verset. Le pronom français en conserve le genre.
- source_word: λατρεύετε
  choice: servez
  rationale: Le verbe désigne le service cultuel rendu à Dieu; « servez » en garde à la fois la portée religieuse et pratique.
- source_word: θεραπεύετε
  choice: mettez-vous au service de
  rationale: Cette expression distingue le service apporté au peuple du service cultuel rendu à Dieu, sans donner au verbe un sens médical moderne.
- source_word: τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: son peuple, Israël
  rationale: Dans ce cadre d’alliance, « peuple » exprime naturellement la collectivité qui appartient à Dieu; l’apposition conserve le nom Israël.
- source_word: ἑτοιμάσατε
  choice: préparez-vous
  rationale: L’impératif absolu appelle les destinataires à se tenir prêts ou à s’organiser; le réfléchi est idiomatique en français.
- source_word: κατὰ τὰς πατριὰς
  choice: selon vos groupes familiaux
  rationale: πατριά désigne les unités de parenté ou maisons ancestrales. « Groupes familiaux » est clair en français moderne sans suggérer seulement des foyers individuels.
- source_word: καὶ τὰς φυλὰς ὑμῶν
  choice: et vos tribus
  rationale: « Tribus » est le sens lexical direct de φυλάς. Le parallèle hébreu présente toutefois une lecture organisationnelle différente, signalée en note.
theological_decisions:
- issue: Distinction entre le service rendu à Dieu et celui rendu à Israël
  choice: Employer « servez » pour λατρεύετε et « mettez-vous au service de » pour θεραπεύετε
  alternative: Employer « servez » dans les deux cas
  rationale: Les deux verbes grecs sont différents. La traduction conserve la tension entre le service cultuel dû à Dieu et le service exercé en faveur de son peuple, sans établir une distinction doctrinale plus précise que le texte.
- issue: Sens de φυλάς dans l’organisation des lévites
  choice: Retenir dans le texte « tribus », selon le grec
  alternative: Traduire « divisions », d’après le parallèle massorétique de 2 Chroniques 35:4
  rationale: Le grec est la source principale et porte clairement φυλάς, « tribus ». Comme le parallèle hébreu suggère plutôt des divisions de service, cette variante contextuellement importante est conservée en note plutôt que substituée au texte grec.
translation_notes:
  register: Français international moderne, clair et digne. « Groupes familiaux » rend la structure ancestrale sans archaïsme; les deux verbes de service restent distincts. La ponctuation finale conserve la continuité syntaxique avec le verset suivant.
