base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: fr
  text: Les chefs du peuple et des prêtres commirent eux aussi de nombreuses impiétés et des actes contraires à la loi, au-delà de toutes les souillures de toutes les nations[a] ; ils profanèrent le sanctuaire du Seigneur[b], consacré à Jérusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus que toutes les souillures de toutes les nations ». L’expression grecque marque un dépassement. Le mot rendu par « souillures » peut désigner des impuretés ou des défilements, dans un sens cultuel et moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le temple du Seigneur ». Le mot grec peut désigner le sanctuaire ou, plus largement, l’ensemble de l’enceinte du temple.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le sanctuaire du Seigneur, celui qui est sanctifié à Jérusalem ». Le participe grec peut caractériser le sanctuaire comme consacré; il peut aussi être compris comme « qui avait été consacré ».'
    reason: ambiguity
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: les chefs
  rationale: Le terme désigne ceux qui dirigent. « Chefs » est naturel, actuel et n’impose pas un titre officiel précis.
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: du peuple et ceux des prêtres
  rationale: La répétition implicite de « chefs » permet de comprendre deux groupes de dirigeants, ceux du peuple et ceux issus des prêtres, tout en suivant les deux génitifs grecs.
- source_word: πολλὰ ἠσέβησαν
  choice: multiplièrent eux aussi les actes d’impiété
  rationale: Cette formulation restitue la pluralité ou l’intensité de πολλά et conserve la dimension religieuse de ἀσεβέω.
- source_word: καὶ ἠνόμησαν
  choice: et de mépris de la Loi
  rationale: ἀνομέω exprime une conduite contraire à la loi. « Mépris de la Loi » garde ici l’accusation religieuse et morale sans la réduire à une simple infraction civile.
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: surpassant toutes les pratiques impures de toutes les nations
  rationale: ὑπέρ marque le dépassement; « pratiques impures » rend le pluriel cultuel et moral de ἀκαθαρσίαι dans un français idiomatique.
- source_word: ἐμίαναν
  choice: ils profanèrent
  rationale: Dans le contexte du sanctuaire, « profaner » exprime avec précision la souillure d’un lieu sacré impliquée par μιαίνω.
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: le sanctuaire du Seigneur
  rationale: ἱερόν peut désigner le temple ou son enceinte sacrée. « Sanctuaire » maintient cette portée sans préciser indûment l’étendue architecturale.
- source_word: τὸ ἁγιαζόμενον
  choice: celui qui est consacré
  rationale: Le participe présent passif caractérise le sanctuaire comme consacré. Le présent français préserve mieux l’aspect grec que le plus interprétatif « avait été consacré ».
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: En français, « consacré à Jérusalem » exprime naturellement la localisation, sans suggérer que Jérusalem serait le bénéficiaire de la consécration grâce au contexte et à la note.
theological_decisions:
- issue: Valeur de κύριος dans le contexte du sanctuaire d’Israël
  choice: Seigneur
  alternative: Éternel
  rationale: Le grec porte κύριος. « Seigneur » traduit directement le témoin primaire sans réintroduire dans le texte principal un nom divin hébreu absent de cette forme grecque.
- issue: Portée cultuelle et morale de ἀκαθαρσίαι
  choice: pratiques impures
  alternative: souillures
  rationale: Le contexte associe les fautes des dirigeants à la profanation du sanctuaire. « Pratiques impures » conserve les dimensions morale et cultuelle sans réduire le mot à une impureté uniquement rituelle.
- issue: Aspect de τὸ ἁγιαζόμενον
  choice: celui qui est consacré
  alternative: celui qui avait été consacré
  rationale: Le participe grec est présent passif et peut caractériser durablement le sanctuaire. Le rendre au présent évite de transformer sans nécessité cette caractérisation en événement antérieur ponctuel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation solennelle des accusations grecques, tout en évitant les calques peu naturels comme « toutes les impuretés ». « Loi » reçoit une majuscule pour signaler la loi religieuse en vue dans ἀνομέω, sans préciser davantage son référent.
