base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: fr
  text: Ils achevèrent de ruiner tout ce qui faisait sa splendeur, et il emmena les survivants[a] avec l’épée[b] à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui restaient »; littéralement : « les restants ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec l’épée ». L’expression peut aussi être liée plus étroitement à la dévastation qui précède, avec l’idée que les autres furent frappés par l’épée; le parallèle hébreu met l’accent sur ceux qui furent tués par l’épée.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν … ἀχρειῶσαι
  choice: ils achevèrent de réduire à néant
  rationale: La tournure rend l’idée d’une dévastation menée à son terme et de choses rendues inutiles ou sans valeur, dans un français naturel.
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: tout ce qui faisait sa splendeur
  rationale: Cette formulation conserve le sens collectif des réalités glorieuses ou splendides associées à la ville, tout en gardant le pronom féminin du grec.
- source_word: τοὺς ἐπιλοίπους
  choice: les survivants
  rationale: Le groupe désigne ceux qui restaient après la destruction. « Survivants » exprime clairement le sens historique sans introduire les connotations théologiques possibles de « reste ».
- source_word: ἀπήγαγεν
  choice: il emmena
  rationale: Le singulier grec est conservé et renvoie naturellement au roi babylonien dans le contexte; « emmena » exprime le déplacement forcé sans technicisme.
- source_word: μετὰ ῥομφαίας
  choice: sous la menace de l’épée
  rationale: Le grec dit littéralement « avec l’épée ». Cette formulation française rattache naturellement l’épée à la déportation violente, tout en signalant en note l’autre rattachement possible.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: Rendu directionnel courant et naturel en français.
theological_decisions:
- issue: Référent du verbe singulier ἀπήγαγεν après le pluriel συνετέλεσαν
  choice: Conserver le passage de « ils » à « il », le singulier renvoyant naturellement au roi babylonien.
  alternative: Comprendre le singulier comme une désignation globale de l’armée d’invasion.
  rationale: Le changement de nombre appartient au texte grec et doit rester visible; le contexte narratif permet de comprendre le sujet sans l’expliciter dans la traduction.
- issue: Traduction de τοὺς ἐπιλοίπους
  choice: les survivants
  alternative: le reste / ceux qui restaient
  rationale: « Survivants » souligne ceux qui demeurent en vie après la dévastation, sans imposer ici une doctrine particulière du « reste ».
- issue: Rapport syntaxique de μετὰ ῥομφαίας
  choice: Le rattacher à l’action d’emmener, comprise comme une déportation sous violence armée.
  alternative: Le rattacher plus étroitement à la dévastation précédente, avec l’idée que les autres furent frappés par l’épée.
  rationale: La syntaxe grecque est condensée et permet une certaine hésitation. La traduction principale demeure proche de l’ordre grec, tandis que la note préserve l’autre lecture et tient compte du parallèle hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le passage marqué du pluriel au singulier et évite le terme potentiellement chargé « reste ». Les appels de notes suivent l’ordre alphabétique dans le texte.
