revisions:
- from: Ils achevèrent de réduire à néant tout ce qui faisait sa splendeur, et il emmena les survivants[a] sous la menace de l’épée[b] à Babylone.
  to: Ils achevèrent de ruiner tout ce qui faisait sa splendeur, et il emmena les survivants[a] avec l’épée[b] à Babylone.
  rationale: La révision conserve tous les éléments narratifs et les appels de note du projet, mais remplace une interprétation restrictive de « avec l’épée » par une traduction littérale qui laisse ouverte la relation syntaxique présente dans le grec. Elle ajuste aussi le verbe de destruction vers une expression française naturelle et sémantiquement proportionnée.
