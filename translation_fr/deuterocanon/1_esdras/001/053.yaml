  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris le changement délibéré du pluriel « Ils » au singulier « il » et l’identification non explicitée de ce dernier par le contexte. Toutefois, « sous la menace de l’épée » interprète μετὰ ῥομφαίας plus précisément que ne le fait le grec, dont la relation syntaxique demeure condensée et discutée.
  naturalness: Le français est globalement clair et moderne. « Ils achevèrent de ruiner tout ce qui faisait sa splendeur » est plus idiomatique que « achevèrent de réduire à néant » tout en gardant l’idée d’une destruction menée à son terme.
  terminology: « Les survivants » rend justement τοὺς ἐπιλοίπους sans charger le texte du vocabulaire théologique du « reste ». « Avec l’épée » conserve la formulation grecque et son ambiguïté; la note explique les rattachements possibles sans les trancher.
  issues:
  - severity: medium
    issue: « sous la menace de l’épée » explicite indûment le rapport de μετὰ ῥομφαίας à l’action d’emmener.
    rationale: Le grec porte littéralement « avec l’épée » et peut évoquer la violence armée de manière plus large; il ne spécifie pas nécessairement une menace pendant la déportation. Une formulation littérale préserve mieux l’ambiguïté.
  - severity: low
    issue: « réduire à néant » est plus absolu et légèrement moins proche de la nuance de ἀχρειῶσαι.
    rationale: Le verbe signifie rendre inutile, sans valeur, ou ruiner. « Ruiner » est naturel dans ce contexte et évite de présenter comme nécessairement anéanti ce que le grec décrit comme rendu inutilisable ou dévasté.
  revised_text: Ils achevèrent de ruiner tout ce qui faisait sa splendeur, et il emmena les survivants[a] avec l’épée[b] à Babylone.
