base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: fr
  text: Ce qui a été rapporté à son sujet[a], ainsi que son impureté et son impiété, est consigné dans le livre des annales des rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui a été consigné à son sujet ». Le participe grec peut désigner ce qui a été raconté ou mis par écrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱστορηθέντα
  choice: ce qui a été rapporté
  rationale: Le participe substantivé désigne les faits racontés ou consignés au sujet du roi. « Ce qui a été rapporté » reste naturel en français tout en conservant la possibilité d’un récit mis par écrit.
- source_word: ἀκαθαρσίας
  choice: impureté
  rationale: Le terme garde sa portée morale et religieuse sans la limiter explicitement à l’impureté rituelle.
- source_word: δυσσεβείας
  choice: impiété
  rationale: « Impiété » exprime précisément le manque de respect ou de dévotion envers Dieu et demeure distinct de l’impureté.
- source_word: ἀναγέγραπται
  choice: est consigné
  rationale: Le parfait passif indique que ces éléments ont été inscrits et demeurent dans les archives; le singulier s’accorde naturellement avec l’ensemble introduit par « ce qui ».
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: le livre des annales des rois
  rationale: « Annales » rend idiomatiquement le sens archivistique de χρόνων dans cette formule royale.
theological_decisions:
- issue: Caractérisation morale et religieuse exprimée par ἀκαθαρσίας καὶ δυσσεβείας
  choice: impureté et impiété
  alternative: souillure et irréligion
  rationale: La traduction maintient les deux accusations distinctes du grec sans les fondre dans une condamnation générale ni préciser indûment la nature de l’impureté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la tonalité documentaire et le double jugement moral-religieux du grec.
