review_pass:
  verdict: revise
  source_fidelity: La forme grecque Ἰωακείμ est indéclinable, mais, dans la syntaxe transmise, elle se lit le plus naturellement comme le sujet de ἔδησεν, suivi de l’objet τοὺς μεγιστᾶνας. La version proposée fait au contraire de Joakim un objet coordonné et introduit ainsi une analyse moins directement soutenue par le grec. Le participe συλλαβών et le verbe ἀνήγαγεν gardent le même sujet, Joakim, et αὐτοῦ désigne naturellement Zarios comme son frère.
  naturalness: « Il enchaîna Joakim ainsi que les dignitaires » est compréhensible, mais sa coordination est artificielle et sa lecture demeure syntaxiquement incertaine. « Joakim enchaîna les dignitaires » est à la fois plus naturel et plus proche de l’enchaînement grec. « L’amena d’Égypte » rend idiomatiquement le déplacement sans imposer une interprétation excessive de la directionnelité de ἀνάγω.
  terminology: « Dignitaires » convient à μεγιστᾶνας. « Enchaîna » préserve utilement la force concrète de ἔδησεν. Les formes Joakim et Zarios peuvent être conservées comme translittérations cohérentes du grec, sans devoir les harmoniser avec les noms du parallèle massorétique approximatif.
  issues:
  - severity: high
    issue: Inversion du rapport syntaxique entre Joakim et les dignitaires
    rationale: Le texte traduit Joakim comme complément de « enchaîna » et le coordonne aux dignitaires. Or Ἰωακείμ, nom indéclinable, se place naturellement comme sujet devant l’accusatif τοὺς μεγιστᾶνας. L’audit anglais privilégie une reconstruction contextuelle (« les nobles de Joakim ») qui n’est pas exprimée par le grec et ne doit pas primer sur celui-ci.
  - severity: medium
    issue: Attribution contextuelle du sujet au roi d’Égypte
    rationale: La note a affirme que le contexte identifie le sujet au roi d’Égypte, tandis que la syntaxe grecque transmise donne plus naturellement Joakim comme sujet. Cette difficulté peut être signalée, mais la note ne doit pas présenter la reconstruction contextuelle comme certaine.
  - severity: low
    issue: Rendu peu idiomatique de ἀνήγαγεν
    rationale: « Le fit monter d’Égypte » reproduit la direction du grec mais reste raide en français moderne. « L’amena d’Égypte » est naturel et conserve l’idée d’un déplacement depuis l’Égypte.
  revised_text: Joakim[a] enchaîna les dignitaires[b] ; puis, après s’être emparé de Zarios, son frère, il l’amena d’Égypte[c].
  revised_footnotes:
  - marker: a
    text: Le nom grec « Joakim » est indéclinable. Dans cette phrase, il se comprend le plus naturellement comme le sujet de « enchaîna ». Le contexte historique a toutefois conduit certaines traductions à reconstruire un sujet différent.
    reason: ambiguite_syntaxique_et_contextuelle
  - marker: b
    text: Le terme grec peut aussi se rendre par « grands » ou « hauts personnages ».
    reason: alternative_lexicale
  - marker: c
    text: Le verbe grec signifie littéralement « conduire ou faire monter ».
    reason: nuance_lexicale
  revision_rationale: 'La révision suit d’abord la syntaxe du grec : Joakim est rendu comme sujet, les dignitaires comme objet, et Zarios comme le frère de ce même sujet. Elle ne transforme pas en texte principal la reconstruction contextuelle retenue par l’audit anglais, tout en la signalant prudemment en note. Le déplacement depuis l’Égypte est exprimé dans un français moderne naturel.'
