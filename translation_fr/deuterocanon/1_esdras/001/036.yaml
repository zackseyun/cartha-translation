base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: fr
  text: Il[a] enchaîna Joakim ainsi que les dignitaires[b] ; puis, après s’être emparé de Zarios, son frère[c], il le fit monter d’Égypte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet n’est pas exprimé ici en grec ; d’après le contexte, il s’agit du roi d’Égypte.
    reason: clarification_contextuelle
  - marker: b
    text: 'Le grec juxtapose de manière abrupte « Joakim » et « les dignitaires ». On peut aussi comprendre : « les dignitaires de Joakim ». Le terme traduit par « dignitaires » peut également se rendre par « grands » ou « hauts personnages ».'
    reason: ambiguite_syntaxique_et_alternative_lexicale
  - marker: c
    text: 'Littéralement : « son frère ». Le contexte favorise « le frère de Joakim », mais le pronom grec ne précise pas explicitement son référent.'
    reason: ambiguite_pronominale
  - marker: d
    text: 'Ou : « il le conduisit hors d’Égypte » ; le verbe grec signifie littéralement « faire monter, conduire vers le haut ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἔδησεν
  choice: enchaîna
  rationale: Le verbe δέω signifie concrètement « lier, attacher, mettre aux fers ». « Enchaîna » conserve cette force sans réduire l’action à une simple détention administrative.
- source_word: Ἰωακεὶμ τοὺς μεγιστᾶνας
  choice: Joakim ainsi que les dignitaires
  rationale: Dans cette construction comprimée, le nom indéclinable Ἰωακείμ et le groupe à l’accusatif τοὺς μεγιστᾶνας peuvent être compris comme deux compléments de ἔδησεν. Cette lecture suit directement l’ordre grec et évite de transformer sans marque explicite « Joakim » en possessif (« les dignitaires de Joakim »).
- source_word: τοὺς μεγιστᾶνας
  choice: les dignitaires
  rationale: μεγιστᾶνες désigne les personnages de haut rang, les grands du royaume. « Dignitaires » est naturel en français moderne et convient au cadre politique.
- source_word: Ζάριον
  choice: Zarios
  rationale: Ζάριον est l’accusatif grec d’un nom propre vraisemblablement restitué sous la forme Ζάριος. « Zarios » en est une translittération française transparente.
- source_word: συλλαβών
  choice: après s’être emparé de
  rationale: Le participe exprime la prise ou l’arrestation préalable de Zarios. Cette formulation rend la succession des actions sans imposer un cadre juridique précis.
- source_word: ἀνήγαγεν
  choice: le fit monter
  rationale: ἀνάγω comporte ici l’idée de conduire ou faire monter. La traduction conserve cette nuance directionnelle, traditionnelle dans les récits de déplacement depuis l’Égypte.
- source_word: ἐξ Αἰγύπτου
  choice: d’Égypte
  rationale: 'La préposition ἐκ marque le point de départ : l’Égypte.'
theological_decisions:
- issue: Identification du sujet dans une notice historique très comprimée
  choice: Conserver le pronom « Il » et signaler que le contexte désigne le roi d’Égypte.
  alternative: Insérer directement « Le roi d’Égypte » dans le texte, ou comprendre Joakim comme sujet.
  rationale: Le sujet n’est pas exprimé dans cette proposition grecque. Le contexte narratif indique le roi d’Égypte, mais l’introduire dans le corps du verset ajouterait des mots absents de la phrase transmise.
- issue: Rapport syntaxique entre Joakim et les dignitaires
  choice: Comprendre Joakim et les dignitaires comme les deux objets du verbe « enchaîna ».
  alternative: Traduire « les dignitaires de Joakim ».
  rationale: Le grec ne porte aucune marque possessive explicite. L’asyndète rend la phrase abrupte, mais la lecture coordonnée respecte mieux les formes présentes et demeure attestée par la tradition de traduction.
- issue: Référent de αὐτοῦ dans « son frère »
  choice: Préserver dans le texte le possessif ambigu « son frère » et préciser en note que le contexte favorise Joakim.
  alternative: Expliciter « le frère de Joakim ».
  rationale: La proximité de Joakim et la logique du récit favorisent ce référent, mais la forme grecque αὐτοῦ ne le nomme pas expressément. La note conserve donc la tension du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste concise pour refléter la notice grecque, tandis que les notes rendent visibles ses ambiguïtés de sujet, de coordination et de référent pronominal.
