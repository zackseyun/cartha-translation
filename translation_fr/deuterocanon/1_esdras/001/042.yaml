base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: fr
  text: Il régna trois mois et dix jours à Jérusalem, et il fit ce qui est mal devant le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux yeux du Seigneur ».'
    reason: Variante lexicale de ἔναντι, qui peut exprimer la présence ou le regard évaluateur.
lexical_decisions:
- source_word: βασιλεύει
  choice: Il régna
  rationale: Le présent historique grec est rendu naturellement par le passé simple dans ce récit, et le verbe désigne l’exercice de la royauté.
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: trois mois et dix jours
  rationale: Expression directe de la durée du règne; le français n’exige pas de préposition après « régna ».
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Pour une ville envisagée comme lieu ou siège du règne, le français idiomatique emploie « à ».
- source_word: ἐποίησεν τὸ πονηρόν
  choice: il fit ce qui est mal
  rationale: Cette formulation conserve l’idiome biblique de l’adjectif neutre substantivé tout en restant claire en français moderne.
- source_word: ἔναντι Κυρίου
  choice: devant le Seigneur
  rationale: « Devant » préserve l’idée d’une conduite soumise au regard et au jugement divins, ainsi que le titre grec Κυρίου.
theological_decisions:
- issue: Traduction de Κυρίου
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte Κυρίου. « Le Seigneur » traduit directement ce titre sans importer dans le texte principal une rétroversion du nom divin à partir d’un éventuel arrière-plan hébreu.
- issue: Portée de ἔναντι dans l’évaluation morale
  choice: devant le Seigneur
  alternative: aux yeux du Seigneur
  rationale: La traduction principale garde la formulation spatiale et relationnelle du grec; la note signale l’expression française qui explicite davantage l’idée d’évaluation divine.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique; la syntaxe demeure accessible et proche du grec sans être artificielle.
