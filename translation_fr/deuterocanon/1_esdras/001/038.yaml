base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
translation:
  language: fr
  text: Après lui, Nabuchodonosor, roi de Babylone, monta[a], le lia avec des chaînes de bronze et l’emmena à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alla vers le haut ». Le verbe grec signifie littéralement « monter » et peut, dans ce contexte royal, évoquer une avancée contre un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ αὐτὸν
  choice: Après lui
  rationale: Rend directement la succession temporelle tout en conservant la référence personnelle du grec.
- source_word: ἀνέβη
  choice: monta
  rationale: Conserve l’image directionnelle du verbe grec sans expliciter indûment une campagne militaire.
- source_word: Ναβουχοδονόσορ
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: roi de Babylone
  rationale: Traduction directe et naturelle du titre.
- source_word: ἔδησεν αὐτὸν ἐν χαλκεῖς δεσμοῖς
  choice: Il le fit attacher avec des chaînes de bronze
  rationale: Exprime naturellement la mise aux fers ordonnée par le roi, tout en conservant la matière indiquée par χαλκεῖς.
- source_word: ἀπήγαγεν
  choice: l’emmena
  rationale: Rend le déplacement forcé du captif sans ajouter explicitement une notion d’exil absente du verbe lui-même.
- source_word: εἰς Βαβυλῶνα
  choice: à Babylone
  rationale: Exprime simplement et idiomatiquement la destination.
theological_decisions:
- issue: Rapport entre le texte grec de 1 Esdras et le parallèle massorétique approximatif
  choice: Traduire la séquence grecque où Nabuchodonosor monte, fait attacher le roi et l’emmène à Babylone.
  alternative: Harmoniser le récit avec la séquence et les détails du témoin hébreu parallèle.
  rationale: Le grec de 1 Esdras est ici le témoin source principal et son sens est clair; le parallèle massorétique ne doit pas remplacer ni réorganiser sa formulation.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche du grec, tandis que « fit attacher » évite de présenter nécessairement le roi babylonien comme l’agent matériel direct.
