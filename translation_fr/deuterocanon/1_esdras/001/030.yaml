base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: fr
  text: Dans toute la Judée, on porta le deuil de Josias. Le prophète Jérémie prononça une complainte sur Josias, et les dirigeants, avec les femmes, se lamentaient sur lui jusqu’à ce jour[a]. Il fut établi que cela se ferait toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle de 2 Chroniques 35.24-25 mentionne le deuil de tout Juda et de Jérusalem, ainsi que la complainte de Jérémie sur Josias. Ici, 1 Esdras ajoute les dirigeants et les femmes, qui se lamentent sur lui « jusqu’à ce jour ».
    reason: cross_reference
  - marker: b
    text: 'Autres traductions possibles : « Il fut décrété que cela se ferait continuellement » ou « Cette pratique fut instituée comme coutume permanente. » Le grec indique l’établissement formel et durable d’une pratique, sans en préciser exactement la portée administrative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: dans toute la Judée
  rationale: Cette tournure française naturelle conserve à la fois l’idée de lieu et l’étendue complète exprimée par ὅλῃ.
- source_word: ἐπένθησαν τὸν Ἰωσίαν
  choice: on porta le deuil de Josias
  rationale: πενθέω désigne ici le deuil suscité par un décès. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non exprimé sans identifier un groupe que le grec ne précise pas.
- source_word: ἐθρήνησεν ... ὑπὲρ Ἰωσείου
  choice: prononça une complainte sur Josias
  rationale: θρηνέω évoque plus précisément l’expression d’une lamentation funèbre que le simple fait de porter le deuil. « Prononça une complainte » maintient cette distinction, tandis que « sur Josias » rend la valeur de ὑπέρ dans ce contexte.
- source_word: οἱ προκαθήμενοι
  choice: les dirigeants
  rationale: Le terme désigne ceux qui occupent une position d’autorité ou de prééminence, sans préciser une fonction institutionnelle particulière.
- source_word: σὺν γυναιξὶν
  choice: avec les femmes
  rationale: La traduction conserve simplement l’accompagnement exprimé par σύν, sans ajouter un statut spécialisé de pleureuses que le grec n’explicite pas.
- source_word: ἐθρηνοῦσαν αὐτὸν
  choice: continuèrent à se lamenter sur lui
  rationale: L’imparfait présente une action prolongée ou répétée. « Continuèrent à » en restitue la durée, et « sur lui » convient au contexte funèbre.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Il s’agit de l’expression française usuelle pour une pratique qui s’est maintenue jusqu’au présent du narrateur.
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: il fut décrété que cela se ferait à perpétuité
  rationale: ἐξεδόθη suggère qu’une décision formelle fut émise ou établie, sans en nommer l’auteur. ἀεί indique la continuité ou la permanence; la note conserve les autres nuances possibles.
theological_decisions:
- issue: Degré d’autorité et durée de la commémoration finale
  choice: il fut décrété que cela se ferait à perpétuité
  alternative: il fut établi que cela se ferait continuellement; cette pratique fut instituée comme coutume permanente
  rationale: Le grec présente une pratique formellement établie et durable, mais ne précise ni l’autorité qui l’a instituée, ni sa forme juridique ou cultuelle. La traduction garde cette imprécision sans transformer la mesure en commandement divin ou liturgique explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Complainte » distingue la lamentation formulée par Jérémie du deuil général, tandis que « se lamenter » convient à l’action prolongée des dirigeants et des femmes. La ponctuation en trois phrases allège la longue coordination grecque sans modifier sa progression.
