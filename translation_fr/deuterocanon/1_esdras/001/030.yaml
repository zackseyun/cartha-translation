revisions:
- from: Dans toute la Judée, on porta le deuil de Josias. Le prophète Jérémie prononça une complainte sur Josias, et les dirigeants, avec les femmes, continuèrent à se lamenter sur lui jusqu’à ce jour[a]. Il fut décrété que cela se ferait à perpétuité[b].
  to: Dans toute la Judée, on porta le deuil de Josias. Le prophète Jérémie prononça une complainte sur Josias, et les dirigeants, avec les femmes, se lamentaient sur lui jusqu’à ce jour[a]. Il fut établi que cela se ferait toujours[b].
  rationale: La révision est limitée à deux formulations. « Se lamentaient » rend l’imparfait grec sans ajouter une présupposition de continuation antérieure. « Il fut établi que cela se ferait toujours » maintient la formalité et la durée de ἐξεδόθη τοῦτο γενέσθαι ἀεί, tout en évitant de surdéterminer la nature juridique de l’établissement. Les notes sont conservées avec une légère harmonisation à ce rendu.
