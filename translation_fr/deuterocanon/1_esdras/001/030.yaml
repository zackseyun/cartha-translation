    issue: Valeur de l’imparfait grec
    rationale: « Continuèrent à se lamenter » est possible, mais introduit légèrement l’idée d’une action déjà commencée dont le texte ne marque pas le commencement. « Se lamentaient » restitue simplement l’action prolongée ou habituelle de ἐθρηνοῦσαν.
  - severity: medium
    issue: Rendu de ἐξεδόθη et ἀεί
    rationale: « Il fut décrété » et « à perpétuité » resserrent le sens vers un décret juridiquement défini et une permanence juridique. Le grec indique une disposition ou établissement formel durable, sans préciser son mécanisme administratif. « Il fut établi que cela se ferait toujours » préserve mieux cette indétermination.
