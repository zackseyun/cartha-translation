base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/018.yaml
  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: fr
  text: Et aucune Pâque semblable n’avait été célébrée en Israël depuis l’époque du prophète Samuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: ne fut célébrée
  rationale: Le passif de ἄγω désigne ici l’accomplissement d’une célébration cultuelle. « Fut célébrée » est naturel en français et convient précisément à la Pâque, sans retenir le littéralisme inadéquat « fut amenée ».
- source_word: τὸ πάσχα
  choice: Pâque
  rationale: « La Pâque » est le terme français courant pour la fête biblique; après « aucune », l’article grec est naturellement rendu par la construction française « aucune Pâque ».
- source_word: τοιοῦτο
  choice: semblable
  rationale: Le terme établit une comparaison avec la célébration qui vient d’être décrite. « Aucune Pâque semblable » rend avec naturel l’idée d’une observance sans équivalent.
- source_word: ἐν τῷ Ἰσραήλ
  choice: en Israël
  rationale: Cette expression indique le cadre collectif et historique dans lequel aucune célébration comparable n’avait eu lieu.
- source_word: ἀπὸ τῶν χρόνων
  choice: depuis l’époque de
  rationale: Cette formulation française rend la valeur temporelle de ἀπό et le pluriel idiomatique τῶν χρόνων sans lourdeur.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: du prophète Samuel
  rationale: Le grec qualifie explicitement Samuel de prophète. L’ordre retenu est idiomatique en français et ne modifie pas le sens.
theological_decisions:
- issue: Formule de comparaison historique par rapport au parallèle hébreu
  choice: depuis l’époque du prophète Samuel
  alternative: depuis le temps de Samuel le prophète
  rationale: Le texte grec nomme explicitement Samuel et fait remonter à son époque la période durant laquelle aucune Pâque comparable n’avait été célébrée. Le parallèle massorétique fourni étant approximatif et correspondant à un autre élément du récit, il ne doit pas remplacer la lecture grecque.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le passif du grec et sa portée historique, tout en employant l’expression cultuelle naturelle « célébrer la Pâque ».
