  text: having stationed the priests in their divisions[c][b][a], arrayed in the temple of the Lord.
translation:
  language: fr
  text: ayant placé les prêtres selon leurs groupes de service[a], parés[b], dans le temple[c] du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs classes » ou « selon leurs tours de service » ; il s’agit des divisions organisées du service sacerdotal.
    reason: lexical_alternative
  - marker: b
    text: Ou « revêtus » ou « ornés » ; le grec les décrit comme parés, probablement par leur tenue sacerdotale.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit « dans le temple du Seigneur » ; le parallèle hébreu dit « pour le service de la maison de YHWH ».
    reason: alternative_reading
lexical_decisions:
- source_word: στήσας
  choice: ayant placé
  rationale: Le participe aoriste de ἵστημι exprime ici le fait d’assigner aux prêtres leur place ou leur fonction; « ayant placé » conserve le lien participial avec le récit environnant.
- source_word: τοὺς ἱερεῖς
  choice: les prêtres
  rationale: Équivalent direct et naturel du groupe nominal grec.
- source_word: κατʼ ἐφημερίας
  choice: selon leurs groupes de service
  rationale: ἐφημερία désigne ici les divisions sacerdotales qui assurent le service à tour de rôle. Cette formulation moderne rend l’organisation institutionnelle sans employer un terme archaïque.
- source_word: ἐστολισμένους
  choice: revêtus de leurs ornements
  rationale: Le participe de στολίζω évoque des personnes parées ou revêtues d’une tenue digne. Dans ce contexte sacerdotal, « ornements » suggère les vêtements de fonction sans affirmer plus précisément que le grec.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne naturellement ici le temple ou son enceinte sacrée; « temple » est clair et direct en français moderne.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: La traduction suit le grec κύριος, source principale, tandis que le parallèle hébreu portant le nom divin reste signalé en note.
theological_decisions:
- issue: Traduction de κύριος alors que le parallèle hébreu porte YHWH
  choice: du Seigneur
  alternative: de l’Éternel / du SEIGNEUR
  rationale: La source principale grecque lit κυρίου. « Seigneur » respecte cette donnée sans substituer directement la forme du témoin hébreu parallèle.
- issue: Degré de précision concernant la tenue des prêtres
  choice: revêtus de leurs ornements
  alternative: parés / revêtus de leurs vêtements sacerdotaux
  rationale: Le grec indique qu’ils sont parés ou revêtus, mais ne nomme pas explicitement des vêtements sacerdotaux. Le choix retenu garde la dignité du contexte tout en évitant une précision excessive.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe participiale est conservée parce que ce fragment dépend du contexte narratif précédent. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
