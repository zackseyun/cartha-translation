    issue: Aspect verbal de ἀνέφερον
    rationale: Le verbe est à l’imparfait. Le passé simple français « offrirent » présente l’action comme ponctuelle ou globalement achevée, alors que le grec la présente comme en déroulement jusqu’au soir. « Offraient » rend cet aspect sans alourdir le texte.
  - severity: low
    issue: Valeur de la coordination
    rationale: Le grec emploie simplement καί (« et »). « Tandis que » est possible dans le contexte, mais ajoute une articulation temporelle ou contrastive plus marquée. « Et » préserve plus directement la relation laissée par la source.
