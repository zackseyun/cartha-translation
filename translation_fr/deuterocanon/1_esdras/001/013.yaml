base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: fr
  text: En effet, les prêtres offraient les graisses jusqu’au soir[a], et les lévites firent les préparatifs pour eux-mêmes et pour les prêtres, leurs frères, les fils d’Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les parties grasses ». Il s’agit des graisses sacrificielles offertes sur l’autel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  choice: offrirent
  rationale: Dans ce contexte sacrificiel, ἀναφέρω désigne l’action d’offrir sur l’autel. Le passé simple convient au registre narratif français; la durée de l’action est déjà indiquée par « jusqu’au soir ».
- source_word: τὰ στέατα
  choice: les graisses
  rationale: Le pluriel grec désigne les parties grasses des victimes réservées au sacrifice. « Les graisses » reste concis et conserve le pluriel, tandis que la note précise le sens cultuel.
- source_word: ἕως ὀψίας
  choice: jusqu’au soir
  rationale: Traduction directe de la limite temporelle exprimée par le grec, sans ajouter l’idée de nuit tombée.
- source_word: ἡτοίμασαν
  choice: firent les préparatifs
  rationale: Le complément d’objet demeure implicite en grec. Cette formulation française naturelle préserve cette indétermination plutôt que d’ajouter « le repas » ou « des portions ».
- source_word: ἑαυτοῖς
  choice: pour eux-mêmes
  rationale: Rend directement le datif réfléchi et indique que les lévites assurèrent aussi leurs propres préparatifs.
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: pour les prêtres, leurs frères
  rationale: Conserve l’apposition grecque et le terme masculin de parenté, qui exprime ici la fraternité au sein du peuple et du service cultuel.
- source_word: υἱοῖς Ἀαρών
  choice: les fils d’Aaron
  rationale: Préserve la désignation traditionnelle et précise des prêtres dans la structure appositionnelle du grec.
theological_decisions:
- issue: Sens du terme de parenté ἀδελφοῖς dans un contexte lévitique et sacerdotal
  choice: leurs frères
  alternative: leurs parents / leurs compatriotes
  rationale: Le grec dit explicitement « frères ». La traduction conserve cette désignation relationnelle sans la réduire à une simple appartenance ethnique ni lui imposer un sens biologique strict.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique sans archaïsme marqué. « Firent les préparatifs » laisse volontairement implicite ce qui fut préparé, comme dans le grec.
