base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: fr
  text: Mais il se mit en ordre de bataille contre lui[a] dans la plaine de Meguiddo, et les chefs descendirent vers le roi Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle hébreu de 2 Chroniques 35.22 porte : « il se déguisa pour le combattre », plutôt que la formulation grecque : « il se mit en ordre de bataille contre lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: il se mit en ordre de bataille contre lui
  rationale: Cette formulation conserve la nuance réfléchie de la voix moyenne et l’idée d’une disposition en vue du combat, sans introduire la notion de déguisement propre au parallèle hébreu.
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: dans la plaine de Meguiddo
  rationale: πεδίον désigne une plaine ou un terrain découvert. Le parallèle hébreu permet d’identifier le toponyme grec sous sa forme française usuelle, « Meguiddo ».
- source_word: κατέβησαν
  choice: descendirent
  rationale: Le verbe exprime littéralement un mouvement vers le bas; le français conserve ici cette indication directionnelle.
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: ἄρχοντες désigne des dirigeants ou chefs. « Chefs » convient au contexte militaire tout en évitant de préciser plus que le grec qu’il s’agit formellement de commandants.
- source_word: πρὸς βασιλέα Ἰωσίαν
  choice: vers le roi Josias
  rationale: Avec un verbe de mouvement, πρός peut simplement indiquer la direction. « Vers » préserve cette valeur sans imposer une hostilité que la préposition seule ne tranche pas, même si le contexte est guerrier.
theological_decisions:
- issue: Divergence entre le grec et le parallèle hébreu au sujet de l’action de Josias
  choice: 'Suivre le grec dans le texte principal : « il se mit en ordre de bataille contre lui »'
  alternative: « il se déguisa pour le combattre »
  rationale: Le grec de Swete est le témoin source désigné pour ce passage. Le parallèle hébreu de 2 Chroniques 35.22 éclaire la tradition textuelle et le nom de lieu, mais ne doit pas remplacer silencieusement la lecture grecque lorsqu’elle en diffère nettement.
- issue: Valeur de πρός dans la venue des chefs auprès de Josias
  choice: « vers le roi Josias »
  alternative: « contre le roi Josias »
  rationale: Le contexte permet une lecture hostile, mais κατέβησαν πρός exprime naturellement un mouvement en direction de quelqu’un. La traduction retenue préserve cette ambiguïté au lieu de la résoudre dogmatiquement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Josias » et « Meguiddo » suivent les formes françaises établies.
