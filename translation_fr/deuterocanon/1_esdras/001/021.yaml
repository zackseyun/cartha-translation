base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/021.yaml
  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: fr
  text: Et les actes de Josias, accomplis avec un cœur plein de piété, furent reconnus droits devant son Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠρθώθη
  choice: furent reconnus comme droits
  rationale: Le passif de ὀρθόω peut exprimer le fait d’être établi ou manifesté comme droit. Cette formulation conserve le passif et l’évaluation morale sans suggérer artificiellement que des actes mauvais auraient été corrigés.
- source_word: τὰ ἔργα
  choice: les actes
  rationale: Dans ce contexte, ἔργα désigne les actions ou la conduite de Josias. « Actes » est naturel en français et évite les connotations particulières que peut prendre « œuvres ».
- source_word: Ἰωσείου
  choice: Josias
  rationale: « Josias » est la forme française biblique usuelle du nom correspondant à l’hébreu יֹאשִׁיָּהוּ.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » conserve de façon concise l’idée d’une conduite placée sous le regard et le jugement du Seigneur.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: son Seigneur
  rationale: Le grec dit littéralement « son Seigneur » et ne comporte ni θεός ni le nom divin. La traduction suit donc le témoin grec principal sans expansion tirée d’un parallèle hébreu approximatif.
- source_word: ἐν καρδίᾳ πλήρει εὐσεβείας
  choice: venant d’un cœur rempli de piété
  rationale: La tournure française relie naturellement la disposition intérieure aux actes. « Piété » rend ici εὐσέβεια comme dévouement respectueux envers Dieu.
theological_decisions:
- issue: Faut-il développer κύριος en « le SEIGNEUR » ou « le Seigneur son Dieu » ?
  choice: son Seigneur
  alternative: le SEIGNEUR ; le Seigneur son Dieu
  rationale: Le texte grec, qui constitue la source principale pour 1 Esdras, porte τοῦ κυρίου αὐτοῦ sans θεός. Le parallèle massorétique fourni est approximatif et ne justifie pas une expansion.
- issue: La droiture des actes est-elle simplement affirmée ou présentée comme établie/reconnue ?
  choice: furent reconnus comme droits
  alternative: étaient droits ; furent rendus droits
  rationale: La traduction garde la forme passive de ὠρθώθη et son sens d’évaluation morale, tout en évitant de résoudre la nuance comme une simple qualité statique ou comme la correction d’actes auparavant fautifs.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque, avec un léger ajustement idiomatique pour exprimer le lien entre le cœur pieux de Josias et ses actes.
