base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: fr
  text: Les gardiens se tenaient à chaque porte. Aucun ne pouvait quitter son service assigné, car leurs frères, les Lévites, avaient fait les préparatifs pour eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « avaient fait les préparatifs pour eux-mêmes »; dans le contexte, il s’agit probablement des préparatifs faits pour les gardiens afin qu’ils restent à leur service.'
    reason: Signaler la valeur littérale du pronom réfléchi et préserver une ambiguïté réelle du texte grec.
lexical_decisions:
- source_word: θυρωροὶ
  choice: gardiens
  rationale: Dans le contexte du Temple et avec πυλών (« porte, portail »), le terme désigne ceux qui gardent les portes. « Gardiens » est naturel en français, tandis que leur emplacement explicite immédiatement leur fonction.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: à chaque porte
  rationale: Rend naturellement la localisation et la valeur distributive de ἑκάστου.
- source_word: οὐκ ἔστιν παραβῆναι
  choice: ne pouvait quitter
  rationale: παραβαίνω signifie ici s'écarter de son poste ou abandonner le service confié; cette formulation exprime la portée pratique de la phrase sans imposer explicitement l'idée d'une interdiction.
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: Aucun ne pouvait quitter son service assigné
  rationale: ἐφημερία désigne une période ou une charge de service fixée. « Service assigné » garde le caractère officiel et cultuel du terme dans un français actuel.
- source_word: οἱ γὰρ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: car leurs frères, les Lévites
  rationale: La construction appositionnelle identifie leurs frères comme étant les Lévites; les virgules préservent clairement ce rapport.
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: avaient fait les préparatifs pour eux
  rationale: Le contexte suggère que les Lévites avaient assuré les préparatifs nécessaires pour permettre aux gardiens de rester à leur service. Le grec emploie toutefois un pronom réfléchi, ambiguïté signalée en note.
theological_decisions:
- issue: Référent et valeur du pronom réfléchi dans ἡτοίμασαν ἑαυτοῖς
  choice: les Lévites avaient fait les préparatifs pour les gardiens
  alternative: les Lévites avaient fait les préparatifs pour eux-mêmes
  rationale: La première lecture explique directement pourquoi les gardiens ne quittaient pas leur service. Comme la forme grecque signifie littéralement « pour eux-mêmes », la traduction contextuelle ne doit pas effacer cette tension textuelle; l'autre lecture est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux propositions grecques sont réparties en deux phrases pour une lecture fluide. « Gardiens » évite le terme moins courant « portiers », tandis que « à chaque porte » précise leur fonction.
