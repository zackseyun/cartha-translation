base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: fr
  text: Son fils Joakim régna à sa place. En effet, lorsqu’il fut désigné[a], il avait huit ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit qu’il avait huit ans lorsqu’il fut désigné. D’autres traditions bibliques diffèrent quant à l’identité du roi ou à son âge lors de son accession; la présente traduction conserve le texte grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: régna
  rationale: Dans ce récit historique, l’aoriste de βασιλεύω indique naturellement l’exercice de la royauté; « régna » est précis et digne.
- source_word: ἀντ᾽ αὐτοῦ
  choice: à sa place
  rationale: L’expression marque la succession et le remplacement sur le trône; cette tournure française en conserve clairement le sens.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: « Joakim » est la forme française biblique courante correspondant au nom royal transmis ici par le grec.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: son fils
  rationale: Traduction directe de la désignation filiale, placée avant le nom pour obtenir une phrase française naturelle.
- source_word: ἀνεδείχθη
  choice: fut désigné
  rationale: Le passif de ἀναδείκνυμι évoque ici la désignation officielle à une fonction. « Fut désigné » préserve le passif sans ajouter explicitement « roi », absent du grec.
- source_word: ἐτῶν ὀκτώ
  choice: il avait huit ans
  rationale: Formulation française idiomatique de l’indication d’âge.
theological_decisions:
- issue: L’âge indiqué paraît difficile à concilier avec des traditions bibliques parallèles concernant l’identité du roi ou son âge lors de son accession.
  choice: 'Conserver dans le texte principal l’affirmation claire du grec : « il avait huit ans ».'
  alternative: Harmoniser l’identité du roi ou son âge avec une autre tradition biblique.
  rationale: Le grec de 1 Esdras est ici la source principale et son énoncé est sans ambiguïté. Il convient donc de préserver sa lecture et de signaler l’écart en note plutôt que de le résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque est rendue par deux phrases pour plus de fluidité, sans modifier le rapport explicatif introduit par γάρ.
