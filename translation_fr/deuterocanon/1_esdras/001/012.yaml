  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: fr
  text: Après cela, ils préparèrent pour eux-mêmes et pour les prêtres, leurs frères, les fils d’Aaron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu de 2 Chroniques 35.11 diffère sensiblement ici ; 1 Esdras conserve une formulation grecque centrée sur la préparation pour eux-mêmes et pour les prêtres.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle et fidèle à la succession exprimée par le grec.
- source_word: ἡτοίμασαν
  choice: ils préparèrent
  rationale: Le verbe signifie « préparer, rendre prêt » et conserve ici son emploi transitif dans le contexte des portions du repas sacrificiel.
- source_word: ἑαυτοῖς τε καὶ τοῖς ἱερεῦσιν
  choice: ce qui leur était destiné, ainsi que ce qui était destiné aux prêtres
  rationale: Les datifs désignent les bénéficiaires de ce qui est préparé. L’explicitation de l’objet sous-entendu donne une phrase française claire sans préciser indûment la nature exacte des portions.
- source_word: ἀδελφοῖς αὐτῶν
  choice: leurs frères
  rationale: Le grec emploie explicitement le terme familial masculin; il est conservé sans le généraliser en « proches » ou « compatriotes ».
- source_word: υἱοῖς Ἀαρών
  choice: les fils d’Aaron
  rationale: La formulation appositionnelle traditionnelle reste transparente et n’explicite pas en « descendants » ce que le grec dit littéralement par « fils ».
theological_decisions:
- issue: Rapport entre « leurs frères » et « les fils d’Aaron »
  choice: 'Conserver l’apposition : « les prêtres, leurs frères, les fils d’Aaron »'
  alternative: « leurs frères, les prêtres descendants d’Aaron »
  rationale: Le grec juxtapose les trois désignations sans proposition relative. L’apposition préserve cette structure et ne résout pas davantage le rapport de parenté.
- issue: Objet sous-entendu du verbe « préparer »
  choice: Employer « ce qui leur était destiné »
  alternative: 'Ne rien expliciter : « ils préparèrent pour eux-mêmes et pour les prêtres »'
  rationale: Le grec omet l’objet, récupérable dans le contexte des portions sacrificielles. Le français exige ici une formulation plus naturelle, mais « ce qui » évite d’imposer « portions » dans le corps du texte.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La répétition de « ce qui était destiné » explicite sobrement l’objet sous-entendu et évite le tour moins naturel « préparer pour eux-mêmes ».
