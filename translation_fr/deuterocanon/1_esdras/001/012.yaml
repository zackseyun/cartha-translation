  - severity: medium
    issue: Note attribuant l’action aux Lévites et parlant de ce qui est « destiné »
    rationale: Le texte grec du verset ne nomme pas les Lévites et ne spécifie pas des portions destinées. La note doit se limiter à la divergence du parallèle hébreu et à la formulation de 1 Esdras.
