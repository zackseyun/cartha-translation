  source_fidelity: 'La traduction ajoute « ce qui leur était destiné », alors que le grec ne précise ni l’objet préparé ni sa destination au sens d’une attribution. Le datif indique les bénéficiaires : « pour eux-mêmes et pour les prêtres ». La phrase doit maintenir cet objet implicite. La note actuelle ajoute également « les Lévites », information absente de ce verset grec.'
  naturalness: « Après cela, ils préparèrent pour eux-mêmes et pour les prêtres » est une construction française naturelle dans ce contexte narratif, même avec l’objet récupérable dans le contexte. Le passé simple convient au registre biblique moderne.
  terminology: « Prêtres », « leurs frères » et « fils d’Aaron » rendent exactement les termes grecs et préservent leur apposition, sans expliciter indûment la relation. « Aaron » est la forme française usuelle.
