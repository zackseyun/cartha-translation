base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: fr
  text: « N’est-ce pas contre toi que j’ai été envoyé par le Seigneur Dieu ? Car ma guerre se déroule sur l’Euphrate[a]. Maintenant, le Seigneur est avec moi, et le Seigneur est avec moi, me poussant à avancer[b]. Écarte-toi et ne t’oppose pas au Seigneur. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de l’Euphrate » ou « sur les bords de l’Euphrate ». L’expression grecque situe la campagne de Néco ; le texte hébreu parallèle nomme Karkemish, sur l’Euphrate.
    reason: lexical_alternative
  - marker: b
    text: Ou « me hâtant » ou « me pressant d’avancer ». Le participe grec indique que le Seigneur pousse rapidement la campagne en avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  choice: N’est-ce pas contre toi que j’ai été envoyé
  rationale: 'La question rhétorique attend une réponse affirmative. Dans ce contexte militaire, πρὸς σὲ a une valeur hostile : la mission ne vise pas Josias.'
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: par le Seigneur Dieu
  rationale: Rend naturellement la désignation grecque sans introduire « mon Dieu », absent du texte.
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου ὁ πόλεμός μού ἐστιν
  choice: Car ma guerre se déroule sur l’Euphrate
  rationale: Conserve l’accent possessif de « ma guerre » tout en exprimant clairement le lieu de la campagne. La préposition grecque permet aussi « près de » ou « sur les bords de ».
- source_word: μετʼ ἐμοῦ
  choice: avec moi
  rationale: Préserve sans l’interpréter davantage la formule répétée de soutien divin.
- source_word: ἐπισπεύδων
  choice: pour me presser d’avancer
  rationale: Le participe exprime une action qui hâte ou pousse la campagne en avant ; cette formulation est naturelle en français et conserve l’idée d’accélération.
- source_word: ἀπόστηθι
  choice: Écarte-toi
  rationale: Impératif demandant à Josias de renoncer à intervenir, rendu de façon directe et idiomatique.
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: ne t’oppose pas au Seigneur
  rationale: Restitue clairement la valeur adversative et la portée théologique de l’avertissement.
theological_decisions:
- issue: Référence de κύριος dans le discours de Néco
  choice: Traduire les occurrences par « le Seigneur » et présenter ainsi la revendication d’une mission et d’un soutien divins.
  alternative: Employer une désignation plus générique ou identifier explicitement la divinité comme le dieu personnel de Néco.
  rationale: Le grec porte Κυρίου τοῦ θεοῦ puis Κύριος. La traduction doit préserver la revendication de Néco et la tension théologique du récit sans décider au-delà du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « le Seigneur est avec moi » est maintenue conformément au grec, malgré sa lourdeur stylistique, parce qu’elle renforce la revendication de soutien divin.
