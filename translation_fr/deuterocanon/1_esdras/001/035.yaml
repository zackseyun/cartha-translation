base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/035.yaml
  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: fr
  text: Et le roi d’Égypte établit Joakim, son frère, comme roi de Judée et de Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec est ici « Joakim »; dans la tradition hébraïque parallèle, ce personnage est généralement appelé « Joïakim ».
    reason: Signaler la variante du nom propre sans remplacer la forme attestée dans la source grecque.
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: établit ... comme roi
  rationale: Dans ce contexte royal, le verbe exprime la désignation ou l’installation dans une fonction. Cette formulation française conserve sa valeur causative et s’accorde naturellement avec le double emploi de βασιλέα.
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: le roi d’Égypte
  rationale: Rendu direct et idiomatique du titre formé avec le génitif.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Cette forme française reflète directement le nom grec, qui constitue ici la source principale, sans l’harmoniser silencieusement avec la forme hébraïque traditionnelle.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Traduction naturelle du terme de parenté et du possessif, en conservant explicitement le lien familial.
- source_word: βασιλέα
  choice: roi
  rationale: Le nom grec désigne expressément la royauté; « dirigeant » affaiblirait la fonction indiquée.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: de Judée et de Jérusalem
  rationale: Après « comme roi », le complément introduit par « de » restitue naturellement les génitifs territoriaux grecs sans ajouter une nuance étrangère au texte.
