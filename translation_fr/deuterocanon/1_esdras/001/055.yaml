base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: fr
  text: jusqu’à ce que le pays ait joui de ses sabbats. Pendant tout le temps où il fut dévasté, il observa le sabbat[a], jusqu’à l’accomplissement de soixante-dix ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se reposa comme un jour de sabbat ». Le verbe grec est formé sur le mot « sabbat » et présente le pays comme observant lui-même le sabbat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: jusqu’à ce que … ait joui
  rationale: La construction marque la durée jusqu’à un terme. « Jouir de » rend naturellement εὐδοκέω dans cette personnification du pays, tout en conservant l’idée qu’il bénéficie enfin de ses repos sabbatiques.
- source_word: τὴν γῆν
  choice: le pays
  rationale: Dans le contexte de l’exil, γῆ désigne le territoire de Juda plutôt que la terre entière; « le pays » convient à ce sens territorial.
- source_word: τὰ σάββατα αὐτῆς
  choice: ses sabbats
  rationale: Le pluriel et le terme sabbatique sont conservés afin de maintenir le lien avec les repos dus au pays.
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: pendant tout le temps où il fut dévasté
  rationale: Cette formulation française exprime clairement toute la durée de l’état de désolation du pays, sans alourdir la phrase.
- source_word: σαββατιεῖ
  choice: il observa le sabbat
  rationale: Le verbe appartient à la famille lexicale de « sabbat ». « Observer le sabbat » préserve ce lien plus explicitement que le simple verbe « se reposer ».
- source_word: εἰς συμπλήρωσιν
  choice: jusqu’à l’accomplissement
  rationale: 'La formule conserve la nuance de résultat ou d’aboutissement: la période se prolonge jusqu’à ce que les soixante-dix ans soient accomplis.'
- source_word: ἐτῶν ἑβδομήκοντα
  choice: de soixante-dix ans
  rationale: Traduction directe du nombre, important dans la tradition de l’exil.
theological_decisions:
- issue: Le langage du sabbat appliqué au pays pendant l’exil
  choice: Conserver « ses sabbats » et « observa le sabbat ».
  alternative: Employer « ses temps de repos » et « se reposa ».
  rationale: La répétition du vocabulaire sabbatique est intentionnelle et évoque les repos sabbatiques dont le pays avait été privé. La conserver maintient la portée intertextuelle et théologique sans l’expliciter davantage que le grec.
- issue: La personnification du pays
  choice: 'Maintenir la personnification: le pays jouit de ses sabbats et observe le sabbat.'
  alternative: 'Dépersonnaliser: laisser le pays en repos.'
  rationale: Le grec présente le pays comme sujet de εὐδοκῆσαι et, implicitement, de σαββατιεῖ. La traduction préserve cette image et sa tension poétique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la personnification du pays et la répétition du vocabulaire sabbatique. Le passé simple convient au registre narratif biblique sans être archaïque.
