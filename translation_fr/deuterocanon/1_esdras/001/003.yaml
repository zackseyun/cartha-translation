base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: fr
  text: 'Et il dit aux Lévites, les serviteurs sacrés d’Israël : « Consacrez-les[a] au Seigneur, à l’emplacement de l’arche sainte du Seigneur, dans la maison qu’a bâtie le roi Salomon, fils de David. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « Consacrez-les au Seigneur », sans préciser clairement qui « les » désigne. Le parallèle hébreu porte plutôt : « Placez l’arche sainte dans la maison qu’a bâtie Salomon, fils de David, roi d’Israël. »'
    reason: Signaler l’ambiguïté réelle du pronom grec et la leçon sensiblement différente du parallèle hébreu.
lexical_decisions:
- source_word: Λευείταις
  choice: Lévites
  rationale: Désignation française courante du groupe lévitique; elle correspond aussi au parallèle hébreu.
- source_word: ἱεροδούλοις
  choice: serviteurs sacrés
  rationale: Le composé désigne des personnes vouées au service sacré. Cette expression conserve l’idée de service cultuel sans identifier abusivement les Lévites à une catégorie technique de personnel du Temple.
- source_word: ἁγιάσατε
  choice: Consacrez
  rationale: Le verbe exprime ici la mise à part pour Dieu dans un contexte cultuel; « consacrez » est naturel en français moderne et garde ce registre.
- source_word: αὐτούς
  choice: les
  rationale: Le grec transmis porte un pronom masculin pluriel dont le référent est obscur. La traduction le conserve plutôt que de le transformer en pronom réfléchi.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Avec « consacrer », le datif désigne celui à qui l’on voue quelque chose. « Seigneur » traduit κύριος en restant ancré dans le texte grec.
- source_word: ἐν τῇ θέσει τῆς ἁγίας κιβωτοῦ
  choice: à l’endroit où se trouve l’arche sainte
  rationale: Cette formulation française rend le rapport locatif du grec de manière intelligible, sans substituer au texte la leçon différente du parallèle hébreu.
- source_word: ἐν τῷ οἴκῳ
  choice: dans la maison
  rationale: « Maison » traduit littéralement οἶκος; le contexte permet de comprendre qu’il s’agit du Temple sans rendre cette interprétation explicite dans le texte.
- source_word: Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: le roi Salomon, fils de David
  rationale: Ordre idiomatique en français, qui conserve le titre royal et la filiation indiqués par le grec.
theological_decisions:
- issue: Traduction de κύριος dans un texte grec présentant un parallèle hébreu avec le nom divin
  choice: Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source principal porte κύριος. La traduction française suit donc le grec sans importer dans le corps du texte une convention propre au tétragramme hébreu.
- issue: Faut-il harmoniser le grec avec le parallèle hébreu qui ordonne de placer l’arche dans le Temple?
  choice: Conserver la formulation et l’ambiguïté du grec
  alternative: « Placez l’arche sainte dans la maison qu’a bâtie Salomon… »
  rationale: Le grec est le témoin principal et diffère sensiblement du parallèle hébreu. La note signale l’autre lecture sans la substituer au texte.
- issue: Référent du pronom αὐτούς
  choice: Conserver le pronom objet pluriel « les »
  alternative: « consacrez-vous »
  rationale: Le référent du masculin pluriel est incertain. Une lecture réfléchie visant les Lévites est possible, mais elle corrige implicitement la forme grecque et résout une difficulté que le texte laisse ouverte.
translation_notes:
  register: Français international actuel, digne et accessible. Le vocabulaire cultuel reste perceptible sans archaïsmes. La syntaxe française est fluidifiée, tandis que l’ambiguïté textuelle principale est maintenue et explicitée en note.
