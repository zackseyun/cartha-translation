base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: fr
  text: Joakim avait vingt-cinq ans lorsqu’il devint roi de la Judée et de Jérusalem[a], et il fit ce qui est mal devant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Juda et de Jérusalem ». Le texte grec porte « de la Judée et de Jérusalem », tandis que la tradition hébraïque parallèle parle couramment de « Juda et Jérusalem ».
    reason: Variante de traduction fondée sur la différence entre le texte grec principal et la tradition hébraïque parallèle.
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: avait vingt-cinq ans
  rationale: Formule française moderne et naturelle pour exprimer l’âge, fidèle à la tournure grecque.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Forme française biblique usuelle correspondant au grec Ἰωακείμ et au personnage identifié comme Jehoïakim dans la tradition hébraïque.
- source_word: ὅτε ἐβασίλευσεν
  choice: lorsqu’il devint roi
  rationale: Dans cette formule indiquant l’âge à l’avènement, l’aoriste désigne naturellement l’accession au trône.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: de la Judée et de Jérusalem
  rationale: La traduction suit directement le grec Ἰουδαίας, « Judée », et conserve le complément lié à la royauté; « Juda » est signalé en note comme autre rendu possible selon la tradition hébraïque parallèle.
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: il fit ce qui est mal
  rationale: Rend l’idiome biblique de manière claire et digne sans affaiblir son jugement moral.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: Rendu direct et naturel de la locution grecque; « Seigneur » traduit κύριος dans la source grecque.
theological_decisions:
- issue: Traduction de Κυρίου
  choice: le Seigneur
  alternative: YHWH / l’Éternel
  rationale: La source première est le grec κύριος. « Le Seigneur » en conserve la forme sans réintroduire dans le texte français une forme du nom divin absente du témoin grec.
- issue: Désignation géographique et politique Ἰουδαίας
  choice: la Judée
  alternative: Juda
  rationale: Le texte grec porte explicitement Ἰουδαίας; la traduction principale suit donc ce témoin, tout en préservant en note la possibilité « Juda » issue de la tradition hébraïque parallèle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la formule biblique de l’âge à l’avènement et le jugement moral final, sans archaïsme inutile.
