base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: fr
  text: Josias ne retourna pas vers son char[a], mais il entreprit de le combattre, sans prêter attention aux paroles du prophète Jérémie, qui venaient de la bouche du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se retira pas vers son char ». La formulation grecque est condensée et peut évoquer un refus de battre en retraite vers son char.
    reason: Alternative lexicale liée au sens réfléchi de ἀποστρέφω et à la valeur directionnelle de ἐπί.
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: ne retourna pas
  rationale: La construction réfléchie exprime le fait de se retourner ou de se retirer. « Ne retourna pas » reste proche du grec sans préciser davantage la nature du mouvement.
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: vers son char
  rationale: Avec l’accusatif, ἐπί peut indiquer un mouvement vers. La formulation grecque étant condensée, « vers son char » préserve mieux son ambiguïté que « dans son char » ou « à son char ».
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: il entreprit de le combattre
  rationale: ἐπιχειρέω suivi de l’infinitif signifie entreprendre ou tenter une action. « Entreprit de le combattre » est naturel et conserve le pronom objet du grec.
- source_word: οὐ προσέχων
  choice: sans prêter attention
  rationale: Le participe négatif indique que Josias ne prêtait pas attention aux paroles; cette tournure française restitue clairement le rapport circonstanciel avec l’action principale.
- source_word: ῥήμασιν
  choice: aux paroles
  rationale: « Paroles » rend directement les propos prononcés sans les réduire à un simple message résumé.
- source_word: Ἰερεμίου προφήτου
  choice: du prophète Jérémie
  rationale: Cet ordre est idiomatique en français tout en conservant explicitement le titre prophétique.
- source_word: ἐκ στόματος Κυρίου
  choice: venant de la bouche du Seigneur
  rationale: Cette formulation conserve la métaphore explicite de la bouche et souligne l’origine divine attribuée aux paroles.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est le rendu français naturel de κύριος dans ce contexte divin.
theological_decisions:
- issue: Autorité prophétique dans l’expression ἐκ στόματος Κυρίου
  choice: Conserver l’image « venant de la bouche du Seigneur » et son rattachement grammatical aux paroles du prophète Jérémie.
  alternative: Simplifier en « venant du Seigneur » ou réattribuer les paroles à un autre locuteur d’après le parallèle massorétique.
  rationale: Le grec présente explicitement les paroles de Jérémie comme venant de la bouche du Seigneur. La traduction maintient cette affirmation et la divergence avec le parallèle hébreu sans les harmoniser.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche du grec tout en évitant un calque lourd; l’ambiguïté du mouvement vers le char et le pronom « le » sont conservés.
