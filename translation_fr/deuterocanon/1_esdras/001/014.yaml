  - severity: low
    issue: La coordination « étaient à leur poste ..., ainsi qu’Asaph, Zacharie et Eddinous » est syntaxiquement et référentiellement maladroite.
    rationale: Elle fait paraître les noms comme une simple adjonction au complément, alors que le grec les coordonne au groupe des chantres sous le verbe principal. Une coordination des sujets restitue mieux la structure.
