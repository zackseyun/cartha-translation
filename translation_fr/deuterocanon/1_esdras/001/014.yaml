- from: Les chantres du Temple, fils d’Asaph, étaient à leur poste conformément aux dispositions prises par David, ainsi qu’Asaph, Zacharie et Eddinous, qui étaient au service du roi.[a][b]
  to: Les chantres du Temple, fils d’Asaph, ainsi qu’Asaph, Zacharie et Eddinous, qui relevaient du roi, étaient à leur poste conformément aux dispositions prises par David.[a][b]
