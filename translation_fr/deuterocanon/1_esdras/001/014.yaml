base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: fr
  text: Les chantres du Temple, fils d’Asaph, ainsi qu’Asaph, Zacharie et Eddinous, qui relevaient du roi, étaient à leur poste conformément aux dispositions prises par David.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avaient été désignés par le roi ». L’expression grecque est elliptique et peut indiquer une nomination royale ou, plus largement, un lien avec le roi.'
    reason: alternative_reading
  - marker: b
    text: Le parallèle approximatif de 2 Chroniques 35.12 porte ici sur la répartition des holocaustes. Premier Esdras conserve plutôt une notice développée sur les chantres et les responsables nommés.
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: chantres du Temple
  rationale: Le composé désigne des chanteurs attachés au culte du sanctuaire. « Chantres du Temple » est naturel, digne et plus précis ici que « chanteurs sacrés ».
- source_word: υἱοὶ Ἀσὰφ
  choice: fils d’Asaph
  rationale: Cette expression généalogique et corporative traditionnelle identifie le groupe lévitique des chantres.
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: à leur poste
  rationale: Dans ce contexte cultuel, τάξις renvoie à la place ou à la fonction assignée; le singulier collectif français rend l’idée clairement.
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: conformément aux dispositions prises par David
  rationale: Cette formulation restitue l’idée de règles ou d’arrangements établis par David sans alourdir la phrase.
- source_word: Ἀσὰφ καὶ Ζαχαρίας καὶ Ἐδδεινοὺς
  choice: Asaph, Zacharie et Eddinous
  rationale: Asaph et Zacharie suivent leurs formes françaises usuelles; Eddinous conserve de près la forme grecque transmise, dont l’identification reste incertaine.
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: qui étaient au service du roi
  rationale: La construction elliptique avec παρά et le génitif marque un rapport avec le roi. « Au service du roi » demeure assez large pour exprimer une affiliation officielle sans préciser indûment le type de nomination.
theological_decisions:
- issue: Nature du lien d’Asaph, de Zacharie et d’Eddinous avec le roi
  choice: qui étaient au service du roi
  alternative: qui avaient été désignés par le roi
  rationale: Le grec est comprimé et peut indiquer la provenance, l’affiliation ou un mandat royal. Le texte principal conserve un lien institutionnel général, tandis que la note signale l’interprétation plus précise.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Chantres » conserve la dignité et la fonction cultuelle; « du Temple » en explicite immédiatement le cadre. La coordination grecque, légèrement abrupte, est maintenue afin de ne pas reconstruire silencieusement les rapports entre les personnes nommées.
