  source_fidelity: Le rendu de ἱεροψάλται, υἱοὶ Ἀσάφ, ἐπὶ τῆς τάξεως αὐτῶν et des dispositions attribuées à David est fidèle. En revanche, « au service du roi » interprète assez précisément οἱ παρὰ τοῦ βασιλέως comme un service royal. La formule grecque elliptique exprime plus prudemment une provenance ou une dépendance à l’égard du roi. La coordination est également mieux rendue en faisant des trois personnes nommées des participants explicites à l’énoncé principal.
  naturalness: « Chantres du Temple », « à leur poste » et « conformément aux dispositions prises par David » sont naturels dans un français moderne soutenu. La reprise « ainsi qu’Asaph » après « fils d’Asaph » est néanmoins heurtée et obscurcit la coordination grecque. Une construction à sujet coordonné est plus lisible tout en gardant l’étrangeté historique des noms.
  terminology: « Chantres du Temple » convient au cadre cultuel. Asaph et Zacharie suivent les usages français; « Eddinous » peut être conservé comme translittération prudente du grec. « Relevaient du roi » rend un lien institutionnel général sans trancher entre nomination, affiliation ou mission royale.
