base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: fr
  text: Les fils d’Israël qui se trouvaient en ce temps-là célébrèrent la Pâque et la fête des Pains sans levain pendant sept jours.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». Le grec dit plus littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui furent trouvés »; c’est-à-dire ceux qui étaient présents en ce temps-là.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: célébrèrent
  rationale: Bien que le verbe signifie ordinairement « mener » ou « amener », ses compléments désignent ici la Pâque et la fête des Pains sans levain. « Célébrèrent » exprime naturellement en français l’accomplissement de ces fêtes.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale explicite du grec. « Les Israélites » serait une formulation française plus idiomatique, signalée en note.
- source_word: οἱ εὑρεθέντες
  choice: qui se trouvaient là
  rationale: Le participe signifie littéralement « qui furent trouvés ». Dans ce contexte, il désigne ceux qui étaient présents; « se trouvaient là » en rend le sens sans suggérer une recherche effective.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: en ce temps-là
  rationale: καιρός désigne ici le moment ou l’occasion en question. Cette tournure française est claire et conserve le démonstratif.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Désignation française traditionnelle et précise de la fête juive.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: la fête des Pains sans levain
  rationale: Rend explicitement le nom de la fête tout en employant une formulation française actuelle et largement comprise.
- source_word: ἡμέρας ἑπτά
  choice: pendant sept jours
  rationale: L’accusatif indique une durée; « pendant sept jours » en exprime clairement la valeur.
