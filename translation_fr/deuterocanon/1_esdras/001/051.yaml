base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: fr
  text: Mais il livra tout entre leurs mains. Ils prirent tous les objets sacrés du Seigneur, les grands comme les petits, ainsi que les coffres du Seigneur et les réserves royales, et les emportèrent à Babylone.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: il livra tout entre leurs mains
  rationale: Conserve l’image grecque et le sens de remise au pouvoir d’autrui, dans un français biblique naturel.
- source_word: ἱερὰ σκεύη
  choice: objets sacrés
  rationale: « Objets » couvre largement les ustensiles et récipients cultuels désignés par σκεύη, sans restriction indue.
- source_word: κιβωτούς
  choice: coffres
  rationale: Le pluriel désigne ici vraisemblablement des coffres; « arches » risquerait d’évoquer à tort l’arche de l’alliance.
- source_word: βασιλικὰς ἀποθήκας
  choice: réserves royales
  rationale: ἀποθήκη peut désigner un lieu de stockage ou son contenu; « réserves » préserve cette latitude dans le contexte du butin.
- source_word: Βαβυλῶνα
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Référent implicite du sujet de παρέδωκεν
  choice: Maintenir « il » sans expliciter son identité
  alternative: Nommer Dieu ou un personnage du contexte
  rationale: Le grec de ce verset ne nomme pas le sujet; l’expliciter résoudrait une donnée qui dépend du contexte précédent.
- issue: Sens de κιβωτούς
  choice: coffres du Seigneur
  alternative: arches ou trésors du Seigneur
  rationale: « Coffres » traduit le nom concret sans identifier ces objets à l’arche de l’alliance ni les confondre avec leur contenu.
translation_notes:
  register: 'Français international moderne, digne et lisible. La coordination grecque est légèrement fluidifiée sans supprimer les deux étapes: livraison générale, puis saisie et transport des biens à Babylone.'
