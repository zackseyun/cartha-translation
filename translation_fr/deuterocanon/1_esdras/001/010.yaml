base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: fr
  text: Après cela, les prêtres et les lévites se tinrent en bon ordre devant le peuple, avec les pains sans levain, selon les tribus et selon les groupements des pères[a], afin de les offrir au Seigneur conformément à ce qui est écrit dans le livre de Moïse[b]. Ils firent ainsi le matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les divisions ancestrales » ou « selon les divisions des maisons paternelles ». Le grec désigne des groupements rattachés aux pères, c’est-à-dire à des lignées ou foyers ancestraux.
    reason: lexical_alternative
  - marker: b
    text: Le grec diffère ici sensiblement du parallèle hébreu approximatif de 2 Chroniques 35.10, qui mentionne des chefs lévites fournissant des animaux pour la Pâque. La présente traduction suit le texte grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ταῦτα τὰ γενόμενα
  choice: Après cela
  rationale: Cette formule de transition résume naturellement en français moderne l’idée « ces choses ayant eu lieu », sans alourdir la phrase.
- source_word: εὐπρεπῶς ἔστησαν
  choice: se tinrent en bon ordre
  rationale: Le grec évoque une disposition convenable, digne et ordonnée dans un cadre cultuel. « En bon ordre » rend cet aspect cérémoniel sans privilégier le sens esthétique de « gracieusement ».
- source_word: τὰ ἄζυμα
  choice: les pains sans levain
  rationale: Le pluriel substantivé désigne naturellement les pains sans levain de la célébration pascale. L’explicitation de « pains » est idiomatique et conforme au contexte.
- source_word: κατὰ τὰς φυλάς
  choice: selon les tribus
  rationale: « Tribus » est l’équivalent courant de φυλαί dans l’organisation d’Israël.
- source_word: κατὰ τὰς μεριδαρχίας τῶν πατέρων
  choice: selon les divisions des maisons paternelles
  rationale: μεριδαρχίαι désigne des subdivisions organisées, tandis que τῶν πατέρων renvoie vraisemblablement aux groupements familiaux ancestraux. Cette formulation explicite sobrement le sens institutionnel probable.
- source_word: προσενεγκεῖν τῷ κυρίῳ
  choice: afin de les offrir au Seigneur
  rationale: Dans ce contexte cultuel, προσφέρειν signifie présenter comme offrande. Le pronom « les » reprend clairement les pains sans levain, et κύριος est rendu par « Seigneur ».
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: conformément à ce qui est écrit dans le livre de Moïse
  rationale: La formulation conserve clairement l’appel à l’autorité écrite du livre de Moïse.
- source_word: καὶ οὕτω τὸ πρωϊνόν
  choice: C’est ainsi qu’ils firent le matin
  rationale: Le grec est elliptique. Cette traduction maintient la valeur temporelle de τὸ πρωϊνόν sans y voir explicitement un terme technique désignant l’offrande du matin.
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle hébreu approximatif de 2 Chroniques 35.10
  choice: Conserver la scène grecque où les prêtres et les lévites se tiennent en ordre avec les pains sans levain.
  alternative: Harmoniser le verset avec le texte massorétique, qui parle de responsables lévites fournissant des animaux pour la Pâque.
  rationale: Pour 1 Esdras, le grec est le texte source principal. Le parallèle hébreu diffère sensiblement et ne doit donc pas remplacer ou corriger silencieusement la scène attestée en grec.
- issue: Expression des structures familiales ancestrales
  choice: les divisions des maisons paternelles
  alternative: les divisions des pères
  rationale: Le français littéral « divisions des pères » serait opaque. « Maisons paternelles » conserve la structure patriarcale et ancestrale du texte tout en indiquant qu’il s’agit de groupes familiaux organisés.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel reste accessible. La syntaxe a été légèrement réorganisée pour une lecture naturelle, tout en conservant l’ordre cérémoniel, la référence aux structures tribales et familiales, ainsi que l’ellipse finale du grec sans la surinterpréter.
