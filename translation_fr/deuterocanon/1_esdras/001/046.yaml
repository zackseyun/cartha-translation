base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: fr
  text: Le roi Nabuchodonosor lui avait fait prêter serment au nom du Seigneur[a], mais il viola son serment et se révolta[b]. Il raidit sa nuque et endurcit son cœur, et transgressa les prescriptions[c] du Seigneur, Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la construction grecque peut se rendre « ayant été mis sous serment par le roi Nabuchodonosor, au nom du Seigneur ». Elle indique vraisemblablement que le roi lui avait imposé ce serment.
    reason: lexical_alternative
  - marker: b
    text: La révolte vise vraisemblablement Nabuchodonosor, mais le grec n’en précise pas explicitement l’objet.
    reason: alternative_reading
  - marker: c
    text: Ou « les lois », « les statuts » ou « les ordonnances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: Le roi Nabuchodonosor lui avait fait prêter serment
  rationale: Le participe aoriste passif indique une action antérieure, et ἀπό désigne ici vraisemblablement l’agent. Cette formulation française rend clairement le fait que le roi lui avait imposé un serment, sans faire du grec une construction artificielle.
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: au nom du Seigneur
  rationale: Le datif indique le nom invoqué pour garantir le serment. « Au nom du Seigneur » est une formule française naturelle et solennelle.
- source_word: ἐφιορκήσας
  choice: viola son serment
  rationale: Le verbe désigne la violation d’un serment déjà prêté. Cette formulation conserve la portée morale et juridique sans suggérer nécessairement un faux témoignage devant un tribunal.
- source_word: ἀπέστη
  choice: se révolta
  rationale: Dans ce contexte royal et politique, le verbe exprime la défection ou la révolte. Son complément demeure implicite comme en grec.
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: Il raidit sa nuque et endurcit son cœur
  rationale: La traduction conserve les deux images bibliques de l’obstination, tout en adaptant le verbe à chaque nom pour produire un français idiomatique.
- source_word: παρέβη
  choice: transgressa
  rationale: Ce choix maintient le registre solennel et juridico-religieux du verbe grec.
- source_word: τὰ νόμιμα
  choice: les prescriptions
  rationale: νόμιμα désigne les règles ou dispositions établies. « Prescriptions » est plus précis que « lois » et reste compréhensible en français moderne.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: du Seigneur, Dieu d’Israël
  rationale: Cette ponctuation fait de « Dieu d’Israël » une désignation explicative du Seigneur et restitue naturellement le titre grec.
theological_decisions:
- issue: Traduction de κύριος dans la formule de serment et le titre divin
  choice: Seigneur
  alternative: ÉTERNEL
  rationale: Le texte source grec porte κύριος. « Seigneur » traduit directement ce titre sans réintroduire dans le texte principal une forme typographique propre au tétragramme hébreu.
- issue: Identification de l’auteur de la révolte
  choice: se révolta, sans complément explicite
  alternative: se révolta contre Nabuchodonosor
  rationale: Le contexte politique rend Nabuchodonosor vraisemblable comme objet de la révolte, mais le grec ne répète aucun complément. Le texte principal préserve cette implicitation.
- issue: Agent du serment
  choice: Le roi Nabuchodonosor lui avait fait prêter serment
  alternative: ayant prêté serment au roi Nabuchodonosor
  rationale: La construction passive avec ἀπό favorise l’idée que Nabuchodonosor a fait prêter serment au personnage. Une note conserve l’ambiguïté syntaxique réelle de la formulation grecque.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est clarifié par deux phrases. Les métaphores bibliques de la nuque et du cœur sont conservées, tandis que la variation « raidit… endurcit » évite une expression peu naturelle en français.
