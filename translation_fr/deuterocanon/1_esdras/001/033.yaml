base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: fr
  text: Il régna sur Israël et Jérusalem pendant trois mois[a]. Puis le roi d’Égypte le destitua, l’empêchant ainsi de régner à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « en Israël et à Jérusalem ». Avec le verbe « régner », le français dit plus naturellement « sur Israël et Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec traduit par « destitua » peut aussi signifier ailleurs « rétablir » ou « réinstaller ». Dans ce contexte, il indique cependant que le roi d’Égypte mit fin à son règne.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: Il régna
  rationale: L’aoriste désigne ici l’exercice de la royauté; « régna » est naturel, précis et digne en français.
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  choice: sur Israël et Jérusalem
  rationale: Avec le verbe « régner », le français emploie normalement « sur » pour désigner le territoire gouverné. La formulation inhabituelle « Israël et Jérusalem » est conservée conformément au grec.
- source_word: μῆνας τρεῖς
  choice: pendant trois mois
  rationale: « Pendant » exprime naturellement en français la durée indiquée par l’accusatif grec.
- source_word: ἀπεκατέστησεν
  choice: le destitua
  rationale: 'Bien que ce verbe puisse ailleurs signifier « rétablir », le contexte historique impose ici le sens privatif: le roi d’Égypte met fin à son règne.'
- source_word: βασιλεὺς Αἰγύπτου
  choice: le roi d’Égypte
  rationale: Traduction française directe et usuelle du titre.
- source_word: βασιλεύειν ἐν Ἰερουσαλήμ
  choice: l’empêchant ainsi de régner à Jérusalem
  rationale: Cette formulation rend explicitement le rapport entre la destitution et la cessation du règne, tout en gardant « régner » pour le même lexème grec.
theological_decisions:
- issue: Sens narratif de ἀπεκατέστησεν suivi de βασιλεύειν
  choice: Le roi d’Égypte le destitue et met fin à son règne à Jérusalem.
  alternative: Le roi d’Égypte le rétablit ou l’établit pour régner à Jérusalem.
  rationale: Le sens lexical de « rétablir » est réel, mais il contredit ici la suite narrative connue, où le roi est écarté après trois mois. Le texte traduit donc le sens contextuel tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, clair et digne. « Destitua » restitue avec concision le sens contextuel; la proposition participiale explicite sans lourdeur la conséquence exprimée par l’infinitif grec. Les notes préservent la littéralité de ἐν et l’ambiguïté lexicale de ἀπεκατέστησεν.
