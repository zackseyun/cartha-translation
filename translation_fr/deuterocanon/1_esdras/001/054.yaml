- from: Ils furent ses serviteurs, puis ceux de ses fils, jusqu’à ce que les Perses règnent, afin que s’accomplisse la parole du Seigneur transmise par Jérémie.
  to: Ils furent ses serviteurs, ainsi que ceux de ses fils, jusqu’à l’avènement du règne des Perses, afin que s’accomplisse la parole du Seigneur par la bouche de Jérémie.
