base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: fr
  text: Ils furent ses serviteurs, ainsi que ceux de ses fils, jusqu’à l’avènement du règne des Perses, afin que s’accomplisse la parole du Seigneur par la bouche de Jérémie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: serviteurs
  rationale: Dans ce contexte de domination politique, le terme désigne des personnes assujetties au service du roi et de ses fils. « Serviteurs » conserve cette idée sans préciser davantage leur statut juridique comme le ferait « esclaves ».
- source_word: αὐτῷ καὶ τοῖς υἱοῖς αὐτοῦ
  choice: ses serviteurs, puis ceux de ses fils
  rationale: Cette formulation française naturelle rend la succession du service auprès du souverain puis de ses fils, sans reproduire lourdement le datif grec.
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: jusqu’à ce que les Perses règnent
  rationale: L’infinitif grec après μέχρι οὗ marque ici l’avènement ou l’établissement de la domination perse. La tournure choisie reste concise et laisse le contexte indiquer le commencement de leur règne.
- source_word: εἰς ἀναπλήρωσιν
  choice: afin que s’accomplisse
  rationale: La locution peut exprimer le but ou le résultat. Cette traduction française idiomatique conserve cette tension sans développer artificiellement le lien causal.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: la parole du Seigneur
  rationale: ῥῆμα désigne ici l’énoncé prophétique divin. « Parole du Seigneur » est une expression biblique claire et fidèle au grec κύριος.
- source_word: ἐν στόματι Ἰερεμίου
  choice: transmise par Jérémie
  rationale: Littéralement « dans/par la bouche de Jérémie ». « Transmise par Jérémie » communique naturellement en français la médiation prophétique sans donner l’impression d’une localisation physique.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: L’Éternel / SEIGNEUR
  rationale: Le texte source porte le grec κύριος. « Seigneur » traduit directement ce témoin sans rétrovertir automatiquement le terme en fonction d’un éventuel substrat hébreu.
- issue: Rapport avec le parallèle massorétique fourni
  choice: Suivre le texte grec, qui parle de servitude jusqu’au règne perse et de l’accomplissement de la prophétie
  alternative: Aligner le verset sur le parallèle hébreu relatif aux objets et aux trésors emportés à Babylone
  rationale: Le parallèle hébreu fourni ne correspond pas étroitement au contenu de ce verset et est signalé comme approximatif. Il ne doit donc pas remplacer le témoin grec principal.
- issue: Valeur de εἰς ἀναπλήρωσιν
  choice: afin que s’accomplisse
  alternative: ce qui accomplit / pour l’accomplissement de
  rationale: La préposition εἰς peut présenter ici le but ou le résultat. La tournure choisie conserve la relation d’accomplissement prophétique sans imposer une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée pour éviter une formulation servilement littérale, tout en conservant la succession dynastique, le passage au règne perse et l’accomplissement de la parole prophétique.
