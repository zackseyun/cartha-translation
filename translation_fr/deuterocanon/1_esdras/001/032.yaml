base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: fr
  text: Les membres du peuple prirent Jékonias[a], fils de Josias, et l’établirent roi à la place de son père Josias. Il avait vingt-trois ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte « Jékonias » ; dans le récit parallèle de 2 Chroniques 36.1, il s’agit de Joachaz.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: prirent
  rationale: Le participe introduit l’action par laquelle les gens choisissent Jékonias puis l’élèvent à la royauté. « Prirent » conserve l’image concrète du grec sans préciser indûment la procédure.
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: les gens de la nation
  rationale: Cette formulation suit d’assez près le grec tout en restant naturelle en français. Elle évite d’importer l’expression plus précise « le peuple du pays », absente du texte grec.
- source_word: ἀνέδειξαν βασιλέα
  choice: l’établirent roi
  rationale: Le verbe exprime ici la désignation ou l’installation dans une fonction. « L’établirent roi » est digne, clair et ne suppose pas une cérémonie particulière.
- source_word: ἀντὶ Ἰωσείου τοῦ πατρὸς αὐτοῦ
  choice: à la place de son père Josias
  rationale: « À la place de » rend directement l’idée de remplacement ou de succession portée par ἀντί, avec un ordre des mots naturel en français.
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: Il avait vingt-trois ans
  rationale: Une phrase indépendante rend naturellement en français la tournure participiale grecque et évite l’ambiguïté possible d’une proposition en « quand », tout en conservant l’indication d’âge.
- source_word: Ἰεχονίαν
  choice: Jékonias
  rationale: Le texte grec porte explicitement ce nom. La forme française traditionnelle « Jékonias » est retenue, tandis que la divergence avec le récit parallèle est signalée en note.
theological_decisions:
- issue: Divergence du nom propre par rapport au récit historique parallèle
  choice: Conserver « Jékonias » dans le texte principal
  alternative: Joachaz
  rationale: Le grec de 1 Esdras est la source principale et nomme clairement Jékonias. Harmoniser le texte avec 2 Chroniques 36.1 effacerait une divergence textuelle réelle; l’autre identification est donc indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement déliée en deux phrases pour rendre naturellement la construction participiale grecque, sans harmoniser la divergence du nom propre.
