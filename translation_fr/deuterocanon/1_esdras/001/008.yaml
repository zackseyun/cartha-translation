base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: fr
  text: Ces biens furent donnés à partir des biens royaux, conformément à la promesse[a], au peuple, aux prêtres et aux lévites. Helkias, Zacharie et Esyélos[b], les responsables du sanctuaire, donnèrent aux prêtres, pour la Pâque, deux mille six cents moutons[c] et trois cents veaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme cela avait été promis ». Le grec dit littéralement : « conformément à la promesse ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le texte grec de 1 Esdras, les noms sont Helkias et Esyélos; dans le passage hébreu parallèle de 2 Chroniques 35.8, les noms correspondants sont habituellement rendus par Hilqiya et Yehiel.
    reason: alternative_reading
  - marker: c
    text: Le passage hébreu parallèle mentionne plus précisément des moutons, des agneaux et des chevreaux; le grec emploie ici le terme général traduit par « moutons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἐκ τῶν βασιλικῶν ἐδόθη
  choice: Ces dons furent prélevés sur les biens royaux et accordés
  rationale: Le démonstratif renvoie aux ressources ou animaux précédemment mentionnés. « Ces dons » explicite naturellement ce référent sans préciser davantage leur nature. « Prélevés sur les biens royaux » rend la provenance exprimée par ἐκ, tandis qu’« accordés » restitue le passif ἐδόθη.
- source_word: κατʼ ἐπαγγελίαν
  choice: conformément à la promesse
  rationale: Cette formulation garde la forme nominale du grec et ne précise ni l’auteur ni le contenu de la promesse.
- source_word: τῷ λαῷ καὶ τοῖς ἱερεῦσιν καὶ Λευίταις
  choice: au peuple, aux prêtres et aux lévites
  rationale: Rendu direct et naturel des destinataires au datif.
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: les responsables du sanctuaire
  rationale: « Responsables » exprime une fonction de direction ou de supervision sans imposer un titre administratif précis; « sanctuaire » conserve la nuance sacrée de ἱερόν.
- source_word: εἰς πάσχα
  choice: pour la Pâque
  rationale: Expression idiomatique du but auquel ces animaux étaient destinés.
- source_word: πρόβατα
  choice: moutons
  rationale: Le grec emploie le terme courant pour les ovins; le parallèle hébreu présente une désignation plus détaillée, signalée en note.
- source_word: μόσχους
  choice: veaux
  rationale: Équivalent direct de μόσχος, qui désigne un jeune bovin.
