  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: fr
  text: Il imposa à la nation une amende de cent talents d’argent et d’un talent d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « infligea au peuple une pénalité financière ». Le verbe grec peut signifier causer une perte ou exiger une amende; dans ce contexte, il s’agit d’un paiement punitif en argent et en or.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: imposa … une amende
  rationale: Le verbe exprime le fait d’infliger une perte ou une peine. Avec les sommes qui suivent, il désigne ici une sanction financière; cette tournure française conserve clairement la valeur punitive.
- source_word: τὸ ἔθνος
  choice: la nation
  rationale: ἔθνος désigne collectivement le peuple soumis, envisagé comme corps politique. « La nation » reproduit cette portée collective sans confondre le terme avec le pays ou le territoire.
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: de cent talents d’argent
  rationale: Cette formulation rend directement l’unité de poids et de valeur ainsi que le métal concerné.
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: et d’un talent d’or
  rationale: La construction poursuit l’énoncé du montant de l’amende et maintient le contraste numérique avec les cent talents d’argent.
