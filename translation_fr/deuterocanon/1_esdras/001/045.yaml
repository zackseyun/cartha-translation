base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: fr
  text: Il fit ce qui est mal devant le Seigneur et ne ressentit aucune honte[a] face aux paroles prononcées par le prophète Jérémie, de la bouche du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne fut pas saisi de honte ». Le parallèle hébreu de 2 Chroniques 36.12 dit qu’il « ne s’humilia pas », tandis que le grec de 1 Esdras parle de honte ou de confusion.'
    reason: Le sens de ἐνετράπη comporte une nuance de honte ou de confusion, et le parallèle hébreu présente une formulation distincte qu’il ne faut pas substituer silencieusement au grec.
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: Il fit ce qui est mal
  rationale: Cette formulation rend naturellement l’idiome biblique « faire le mal » tout en conservant la valeur substantivée de τὸ πονηρόν.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: « Devant » préserve le sens de conduite accomplie sous le regard et au jugement du Seigneur.
- source_word: οὐκ ἐνετράπη
  choice: ne ressentit aucune honte
  rationale: Le moyen-passif de ἐντρέπω peut exprimer la honte ou la confusion ressentie. Cette traduction actuelle indique clairement l’absence de réaction intérieure aux paroles prophétiques, sans introduire l’idée distincte d’humilité présente dans le parallèle hébreu.
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: à l’écoute des paroles prononcées
  rationale: Après ἐνετράπη, ἀπό indique ici ce qui aurait dû susciter la honte. « À l’écoute de » exprime ce rapport de circonstance ou de cause dans un français naturel, tandis que « paroles prononcées » conserve les deux éléments grecs.
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: par le prophète Jérémie
  rationale: Le complément d’agent et le titre prophétique sont conservés dans l’ordre français usuel.
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: de la bouche du Seigneur
  rationale: La formule concrète du grec est maintenue plutôt que réduite à « de la part du Seigneur »; elle présente Jérémie comme transmettant une parole issue de Dieu.
theological_decisions:
- issue: Traduction de κύριος dans le texte grec deutérocanonique
  choice: le Seigneur
  alternative: l’Éternel; le Maître
  rationale: Le témoin principal porte κύριος. « Le Seigneur » est la traduction française conventionnelle et directe, sans rétroversion imposée vers le nom divin hébreu.
- issue: Rapport entre οὐκ ἐνετράπη et le parallèle de 2 Chroniques 36.12
  choice: ne ressentit aucune honte
  alternative: ne s’humilia pas; ne fut pas confondu
  rationale: Le grec de 1 Esdras exprime la honte ou la confusion, tandis que le parallèle hébreu emploie le langage de l’humiliation. Le texte principal reste donc ancré dans le grec et la différence est signalée en note.
- issue: Origine divine des paroles transmises par Jérémie
  choice: prononcées par le prophète Jérémie, de la bouche du Seigneur
  alternative: adressées par le Seigneur par l’intermédiaire du prophète Jérémie
  rationale: 'La formulation retenue conserve la tension et l’image du grec : Jérémie prononce les paroles, mais celles-ci viennent de la bouche du Seigneur.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans calquer ses tournures les moins naturelles. La répétition de « Seigneur » et l’image « de la bouche du Seigneur » sont volontairement conservées.
