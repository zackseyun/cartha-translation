- from: Il fit ce qui est mal devant le Seigneur et ne ressentit aucune honte[a] à l’écoute des paroles prononcées par le prophète Jérémie, de la bouche du Seigneur.
  to: Il fit ce qui est mal devant le Seigneur et ne ressentit aucune honte[a] face aux paroles prononcées par le prophète Jérémie, de la bouche du Seigneur.
  rationale: La révision remplace uniquement « à l’écoute des » par « face aux ». Elle évite l’ajout implicite d’une action d’écoute et rend plus directement la relation entre l’absence de honte et les paroles prophétiques. La note conserve à juste titre la distinction entre le grec de 1 Esdras et le parallèle hébreu.
