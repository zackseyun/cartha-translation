base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: fr
  text: Et aucun des rois d’Israël n’avait célébré une Pâque comme celle que célébrèrent Josias[a], les prêtres, les lévites, les Judéens[b] et tout Israël qui se trouvaient établis à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie la forme « Iôséias » (Ἰωσείας), qui correspond au roi appelé Josias dans le parallèle hébreu.
    reason: cross_reference
  - marker: b
    text: On peut aussi traduire « les Juifs » ; ici, le terme paraît surtout désigner les gens de Juda ou de Judée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον πάσχα
  choice: avait célébré une Pâque
  rationale: Avec πάσχα, ἄγω est employé idiomatiquement pour l’observance de la Pâque. « Célébrer la Pâque » est naturel en français et évite le littéralisme obscur « conduire/apporter une Pâque ».
- source_word: τοιοῦτον οἷον
  choice: une Pâque comme celle que
  rationale: Cette tournure française conserve la comparaison corrélative du grec tout en évitant une formulation lourde telle que « une Pâque telle que celle que ».
- source_word: Ἰωσείας
  choice: Josias
  rationale: « Josias » correspond à la forme grecque transmise et à l’usage français traditionnel pour ce nom; le parallèle hébreu désigne le même roi.
- source_word: Ἰουδαῖοι
  choice: les Judéens
  rationale: Dans ce contexte historique, le mot possède vraisemblablement une valeur ethnique et géographique liée à Juda ou à la Judée; « Judéens » préserve cette nuance.
- source_word: πᾶς Ἰσραὴλ
  choice: tout Israël
  rationale: Traduction directe de l’expression collective, qui élargit probablement l’assemblée au-delà des Judéens déjà nommés.
- source_word: οἱ εὑρεθέντες
  choice: ceux qui se trouvaient
  rationale: Le participe signifie littéralement « ceux qui furent trouvés », mais cette tournure indique ici les personnes présentes ou établies sur place. « Ceux qui se trouvaient » en rend le sens sans suggérer une découverte.
- source_word: ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: résider à Jérusalem
  rationale: La formulation grecque est maladroite si elle est reproduite littéralement. Cette traduction conserve son sens résidentiel et locatif dans un français clair.
theological_decisions:
- issue: Portée de « tous les rois d’Israël »
  choice: Conserver la vaste affirmation historique sans la restreindre aux rois de Juda.
  alternative: « tous les rois ayant régné sur Israël/Juda » ou « tous les rois précédents »
  rationale: Le grec dit explicitement « tous les rois d’Israël ». La traduction ne l’harmonise pas avec une formulation historique plus étroite.
- issue: Coordination des participants avec Josias
  choice: 'Comprendre le second ἤγαγεν comme gouvernant aussi la série coordonnée: Josias, les prêtres, les lévites, les Judéens et tout Israël célébrèrent cette Pâque.'
  alternative: Faire de Josias seul le sujet de « célébra », puis rattacher les groupes suivants par une coordination syntaxiquement suspendue.
  rationale: La série introduite par καί s’entend naturellement comme un sujet composé du verbe singulier précédant la liste. Le français exige ici une coordination explicite et un verbe au pluriel.
translation_notes:
  register: Français moderne, international et digne. « Une Pâque comme celle que » rend la comparaison avec naturel. La syntaxe a été légèrement réorganisée pour rendre explicite en français que Josias et tous les groupes coordonnés participent à la célébration, sans ajouter l’idée d’« avec » absente du grec.
