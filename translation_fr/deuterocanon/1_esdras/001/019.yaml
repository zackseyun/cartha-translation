  terminology: '« Pâque », « Josias », « les lévites », « les Judéens » et « tout Israël » sont appropriés. La note sur Josias doit être reformulée : en français, les formes grecque et hébraïque sont toutes deux habituellement rendues « Josias »; elle ne doit donc pas suggérer une distinction française inexistante.'
