base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: fr
  text: Ils firent rôtir au feu la Pâque, comme il convenait, et firent bouillir les sacrifices dans des récipients de bronze et des chaudrons, avec un parfum agréable[a]. Puis ils les apportèrent à tous ceux du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque désigne littéralement une bonne odeur ou un parfum ; dans un contexte sacrificiel, elle peut évoquer l’odeur agréable d’une offrande.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à tous ceux du peuple » ; il peut s’agir plus précisément des membres du peuple distincts des prêtres et des lévites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: firent rôtir
  rationale: Le verbe désigne précisément la cuisson rôtie; cette valeur est renforcée par ἐν πυρί («au feu»).
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: L’expression grecque peut désigner la victime ou le repas pascal. «La Pâque» conserve cette amplitude sans explicitation indue.
- source_word: ἐν πυρί
  choice: au feu
  rationale: Formulation française naturelle indiquant le moyen de cuisson tout en restant proche du grec.
- source_word: ὡς καθήκει
  choice: comme il convenait
  rationale: Cette formulation garde la valeur normative de l’expression sans préciser s’il s’agit d’une obligation légale, rituelle ou coutumière.
- source_word: τὰς θυσίας
  choice: les sacrifices
  rationale: Rendu direct qui conserve la portée générale du terme sacrificiel.
- source_word: ἥψησαν
  choice: firent bouillir
  rationale: Le verbe évoque la cuisson dans un liquide; la mention immédiate des récipients soutient ce sens et le distingue de la cuisson rôtie de la Pâque.
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: dans des récipients de bronze et des chaudrons
  rationale: Le rendu maintient la distinction entre les deux catégories d’ustensiles sans imposer une forme trop précise au premier terme.
- source_word: μετʼ εὐωδίας
  choice: avec un parfum agréable
  rationale: L’expression renvoie littéralement à une bonne odeur ou à un parfum; ce choix conserve sa dimension sensorielle et sa possible résonance sacrificielle.
- source_word: ἀπήνεγκαν
  choice: apportèrent
  rationale: Le verbe signifie porter ou apporter. Le contexte peut impliquer la distribution, mais celle-ci n’est pas explicitée dans le verbe.
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: à tous les membres du peuple
  rationale: Rendu français fluide de l’expression littérale «à tous ceux du peuple», tout en laissant ouverte la possibilité qu’elle distingue le peuple des prêtres et des lévites.
theological_decisions:
- issue: Distinction rituelle entre les modes de cuisson
  choice: 'Conserver deux verbes distincts: la Pâque est «rôtie», tandis que les autres sacrifices sont «bouillis».'
  alternative: Rendre les deux verbes par le terme général «cuire».
  rationale: Le grec distingue nettement les deux préparations, probablement en raison de prescriptions rituelles différentes; uniformiser les verbes effacerait ce détail.
- issue: Portée de l’expression désignant le peuple
  choice: «à tous les membres du peuple» dans le texte, avec une note signalant la possible distinction d’avec les officiants.
  alternative: «à tous les laïcs» ou «à tous ceux du peuple».
  rationale: «Laïcs» préciserait excessivement une distinction seulement implicite, tandis que le calque «ceux du peuple» serait peu naturel. Le choix retenu garde la fluidité et la tension du grec.
- issue: Nuance sacrificielle de εὐωδία
  choice: Conserver l’image concrète du «parfum agréable».
  alternative: Employer une expression adverbiale plus vague telle que «soigneusement».
  rationale: Le sens lexical fondamental concerne l’odeur agréable et peut évoquer le langage sacrificiel; il ne faut pas supprimer cette possible résonance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure accessible, les deux modes de cuisson sont distingués, et les notes préservent les nuances lexicales sans introduire de terminologie confessionnelle.
