base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: fr
  text: 'Ce qui le concerne a aussi été consigné dans les temps anciens : il est question de ceux qui ont péché et agi avec impiété contre le Seigneur plus que toute nation et tout royaume, et qui l’ont profondément attristé[a] ; et les paroles du Seigneur se sont dressées contre Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon grecque transmise après « l’ont attristé » est difficile dans ce contexte. La traduction la comprend comme une marque d’intensité ; il est aussi possible que le texte ait subi une légère altération.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: ce qui le concerne
  rationale: Cette expression générale résume les faits ou les éléments relatifs au personnage sans les limiter à ses seuls actes.
- source_word: ἀναγέγραπται
  choice: a été consigné
  rationale: Le parfait passif évoque une mise par écrit accomplie dont le témoignage demeure disponible.
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: dans les temps anciens
  rationale: Cette formulation naturelle conserve la référence temporelle du grec sans ajouter explicitement l’idée de livres ou d’annales.
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: il est question de ceux qui ont péché et agi avec impiété
  rationale: 'Les deux participes sont distingués : le premier exprime le péché, le second une conduite impie envers Dieu.'
- source_word: εἰς τὸν κύριον
  choice: contre le Seigneur
  rationale: Dans ce contexte de faute et d’impiété, εἰς a une valeur hostile que « contre » rend idiomatiquement.
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: plus que toute nation et tout royaume
  rationale: 'παρά avec l’accusatif marque ici la comparaison ou le dépassement : leur faute surpasse celle des autres nations et royaumes.'
- source_word: ἐλύπησαν αὐτόν
  choice: l’ont profondément attristé
  rationale: Le verbe attribue explicitement au Seigneur la tristesse causée par leur conduite; « profondément » rend prudemment la valeur intensive supposée dans la leçon difficile qui suit.
- source_word: ἔστω
  choice: profondément
  rationale: La forme transmise est grammaticalement difficile dans ce contexte et peut témoigner d’une perturbation textuelle; la traduction suit l’hypothèse d’une valeur intensive tout en la signalant en note.
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: les paroles du Seigneur se sont dressées contre Israël
  rationale: Cette traduction conserve la personnification saisissante des paroles divines qui s’élèvent en jugement contre Israël.
theological_decisions:
- issue: Traduction de κύριος dans ce récit historique grec
  choice: Seigneur
  alternative: SEIGNEUR; Maître
  rationale: « Seigneur » est le rendu français courant de κύριος et convient au contexte d’alliance et de jugement sans imposer une précision absente du texte grec.
- issue: Langage anthropopathique de ἐλύπησαν αὐτόν
  choice: l’ont profondément attristé
  alternative: l’ont provoqué; lui ont causé du chagrin
  rationale: Le grec attribue directement la tristesse à Dieu; la traduction préserve cette tension théologique au lieu de l’atténuer.
- issue: Force judiciaire de la parole divine
  choice: les paroles du Seigneur se sont dressées contre Israël
  alternative: les paroles du Seigneur sont venues sur Israël
  rationale: Le choix garde l’image active et adversative du grec sans expliquer davantage la manière dont ces paroles agissent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement explicitée par « il est question de » afin d’éviter un enchaînement ambigu, tandis que l’image forte des paroles qui se dressent contre Israël est conservée.
