base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: fr
  text: Le Roi de leurs pères, le Dieu de leurs pères[b], envoya, par son ange[a], visiter leur peuple et les rappeler, car il avait compassion d’eux et de sa demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son messager » : le mot grec peut désigner un ange ou un messager.'
    reason: lexical_alternative
  - marker: b
    text: 'Le début du texte grec est inhabituel : il dit littéralement « Le Roi de leurs pères, le Dieu de leurs pères ». Les deux titres ont été conservés.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: Le Roi de leurs pères, le Dieu de leurs pères
  rationale: Conserve les deux désignations divines apposées dans le grec transmis, malgré leur enchaînement inhabituel, sans corriger silencieusement le texte.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent narratif direct et naturel de l’aoriste de ἀποστέλλω.
- source_word: ἐπισκέψασθαι τὸν λαὸν αὐτῶν
  choice: prendre soin de leur peuple
  rationale: ἐπισκέπτομαι peut désigner une visite attentive qui se traduit par une intervention bienveillante. « Prendre soin de » rend ici ce sens plus naturellement que le calque « visiter », tout en conservant le possessif inhabituel « leur ».
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: son ange
  rationale: Dans ce contexte d’action divine, « ange » constitue le sens par défaut le plus naturel; la possibilité « messager » est signalée en note.
- source_word: μετακαλέσαι αὐτούς
  choice: les rappeler à lui
  rationale: Le composé exprime l’idée d’appeler auprès de soi ou de rappeler. « À lui » explicite la direction impliquée sans imposer une formulation confessionnelle particulière.
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: car il avait compassion d’eux
  rationale: Dans ce contexte, φείδομαι exprime la pitié bienveillante ou le fait d’épargner; « avoir compassion » rend clairement le motif de l’action divine.
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: sa demeure
  rationale: σκῆνωμα signifie habitation ou demeure et désigne ici le lieu où Dieu réside, sans exiger le terme plus précis « tabernacle » ou « sanctuaire ».
theological_decisions:
- issue: La double désignation inhabituelle de Dieu au début du verset
  choice: Conserver « Le Roi de leurs pères, le Dieu de leurs pères » comme deux titres apposés.
  alternative: Omettre « le Roi de leurs pères » comme corruption textuelle, ou réorganiser la phrase en « le roi et le Dieu de leurs pères ».
  rationale: Le grec de Swete contient explicitement les deux expressions. Les conserver respecte la primauté de la source et laisse visible la difficulté textuelle plutôt que de la résoudre par conjecture.
- issue: Le sens de ἄγγελος
  choice: ange
  alternative: messager
  rationale: « Ange » convient naturellement à l’agent envoyé par Dieu, mais le mot grec peut également désigner un messager; cette ambiguïté est préservée en note.
- issue: La portée de μετακαλέσαι
  choice: les rappeler à lui
  alternative: les convoquer; les rappeler
  rationale: La formulation retenue exprime le mouvement de retour suggéré par le verbe composé, sans préciser davantage la nature de ce retour.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les possessifs et la double titulature inhabituels du grec, tout en employant une syntaxe française naturelle.
