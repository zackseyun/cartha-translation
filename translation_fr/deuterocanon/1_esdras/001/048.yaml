revisions:
- from: Le Roi de leurs pères, le Dieu de leurs pères, envoya son ange[a] prendre soin de leur peuple et les rappeler à lui, car il avait compassion d’eux et de sa demeure.[b]
  to: Le Roi de leurs pères, le Dieu de leurs pères[b], envoya, par son ange[a], visiter leur peuple et les rappeler, car il avait compassion d’eux et de sa demeure.
