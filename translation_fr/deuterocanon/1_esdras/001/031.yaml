base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: fr
  text: pour toute la famille d’Israël. Tout cela est consigné dans le livre des récits concernant les rois de Judée[a]. Chacun des actes de Josias, sa gloire, sa compréhension de la loi du Seigneur, tout ce qu’il a accompli ainsi que les événements qui viennent d’être racontés[b], tout cela est relaté dans le livre des Rois d’Israël et de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des archives concernant les rois de Judée ». L’expression grecque désigne un ouvrage où des faits historiques sont rapportés.'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation grecque de la fin du verset est difficile : littéralement, elle rapproche « les choses accomplies par lui » et « celles qui sont maintenant racontées ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: γένος
  choice: famille
  rationale: Dans l’expression πᾶν τὸ γένος Ἰσραήλ, le mot désigne l’ensemble du groupe issu d’Israël. « Famille » conserve la nuance de parenté, tandis que le contexte lui donne une portée collective.
- source_word: ἀναγέγραπται
  choice: est consigné
  rationale: Le parfait passif exprime une mise par écrit dont le résultat demeure. « Est consigné » convient naturellement à un document historique.
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: livre des récits
  rationale: L’expression désigne un recueil où des faits historiques sont rapportés. « Livre des récits » reste proche du grec sans imposer l’idée plus précise d’archives officielles.
- source_word: τὸ καθʼ ἓν πραχθὲν
  choice: chacun des actes
  rationale: L’expression καθʼ ἓν porte l’idée d’un examen élément par élément, ici appliqué aux actes de Josias.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » rend directement δόξα et peut désigner ici l’honneur ou le renom de Josias.
- source_word: συνέσεως
  choice: intelligence
  rationale: Le terme évoque la compréhension ou le discernement, explicitement rapporté à la loi du Seigneur.
- source_word: νόμῳ Κυρίου
  choice: loi du Seigneur
  rationale: Cette formulation biblique courante rend directement le grec, qui porte κύριος et non le nom divin hébreu dans le texte de base.
- source_word: τά τε πραχθέντα ὑπʼ αὐτοῦ
  choice: tout ce qu’il a accompli
  rationale: Cette tournure française naturelle garde le sens du participe passif grec sans alourdir la phrase.
- source_word: τὰ νῦν ἱστόρηται
  choice: les événements qui viennent d’être racontés
  rationale: Le grec transmis est syntaxiquement difficile. Cette traduction conserve la référence aux faits narrés dans le passage présent sans préciser davantage leur rapport exact aux actes précédemment mentionnés.
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: livre des Rois d’Israël et de Juda
  rationale: La majuscule à « Rois » signale qu’il s’agit du titre d’un ouvrage-source, tout en conservant les noms donnés par le grec.
theological_decisions:
- issue: Traduction de κύριος dans νόμῳ Κυρίου
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte source grec emploie Κυρίου. « Seigneur » le rend directement, sans rétroversion ni substitution du nom divin hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La reprise « tout cela » clarifie la longue énumération grecque sans supprimer sa structure cumulative. Les deux marqueurs de note figurent dans le texte principal.
