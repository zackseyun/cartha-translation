  to: pour toute la famille d’Israël. Tout cela est consigné dans le livre des récits concernant les rois de Judée[a]. Chacun des actes de Josias, sa gloire, sa compréhension de la loi du Seigneur, tout ce qu’il a accompli ainsi que les événements qui viennent d’être racontés[b], tout cela est relaté dans le livre des Rois d’Israël et de Juda.
