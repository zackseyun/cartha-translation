base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: fr
  text: 'Ce jour-là, tout ce qui concernait le sacrifice du Seigneur fut accompli : la Pâque fut apportée[a], et les sacrifices furent apportés sur l’autel du Seigneur, conformément à l’ordre du roi Josias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la victime pascale fut apportée ». Littéralement, le grec dit « la Pâque »; dans ce contexte sacrificiel, le terme peut désigner la victime pascale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  choice: fut accompli
  rationale: L’aoriste passif exprime l’achèvement de l’ensemble des préparatifs et actes sacrificiels; « fut accompli » garde cette portée sans alourdir la phrase.
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: tout ce qui concernait le sacrifice du Seigneur
  rationale: Cette tournure française naturelle conserve l’expression grecque large, qui vise l’ensemble de ce qui relève du sacrifice, sans la réduire aux seuls rites.
- source_word: ἀχθῆναι τὸ πάσχα
  choice: on apporta l’agneau pascal
  rationale: ἄγω signifie littéralement « apporter »; dans ce contexte, πάσχα désigne la victime pascale. « L’agneau pascal » explicite naturellement le référent sacrificiel sans rendre le verbe par « offrir ».
- source_word: προσαχθῆναι τὰς θυσίας ἐπὶ τὸ ... θυσιαστήριον
  choice: les autres sacrifices furent présentés sur l’autel
  rationale: « Présentés sur » rend le mouvement vers l’autel et la valeur cultuelle de προσάγω. « autres » clarifie que ces sacrifices sont mentionnés en plus de la victime pascale, conformément à la coordination grecque.
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: conformément à l’ordre
  rationale: ἐπιταγή désigne ici une directive royale faisant autorité; « ordre » est clair et idiomatique en français moderne.
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: du roi Josias
  rationale: « Josias » est la forme française traditionnelle correspondant au grec Ἰωσίας et convient à une traduction fondée sur le texte grec.
theological_decisions:
- issue: Traduction de κύριος dans un contexte cultuel vétérotestamentaire
  choice: Seigneur
  alternative: L’ÉTERNEL
  rationale: Le texte source porte κύριος. « Seigneur » traduit directement le grec sans substituer le tétragramme attesté dans une autre tradition textuelle.
- issue: Interprétation de πάσχα comme objet sacrificiel
  choice: l’agneau pascal
  alternative: la Pâque
  rationale: Avec le passif de « apporter » et le parallèle immédiat des sacrifices conduits à l’autel, πάσχα renvoie vraisemblablement à la victime pascale. Une note conserve toutefois la formulation plus littérale et son ambiguïté métonymique.
- issue: Forme du nom Ἰωσείου
  choice: Josias
  alternative: Josiah
  rationale: « Josias » reflète la forme grecque et son usage français traditionnel; « Josiah » est une forme employée dans certaines langues modernes, mais n’est pas la forme française normale.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure récapitulative du grec tout en évitant le calque « les choses du sacrifice ». Le texte principal privilégie la précision contextuelle, tandis que la note préserve la formulation littérale et l’ambiguïté de πάσχα.
