base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: fr
  text: Ils incendièrent la maison du Seigneur[a], abattirent les murailles de Jérusalem et livrèrent ses tours aux flammes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison du Seigneur » désigne ici le temple de Jérusalem.
    reason: clarification
  - marker: b
    text: Le grec emploie le même verbe pour la maison du Seigneur et pour les tours ; pour ces dernières, il ajoute littéralement « avec du feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: incendièrent / livrèrent aux flammes
  rationale: Le verbe signifie « mettre le feu à, incendier ». Les deux formulations françaises rendent ses deux occurrences sans laisser entendre nécessairement une destruction totale.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: la maison du Seigneur
  rationale: Cette traduction préserve le sens littéral de οἶκος tout en restant naturelle dans le registre biblique français; dans ce contexte, l’expression désigne le temple.
- source_word: κατέλυσαν
  choice: abattirent
  rationale: Le verbe exprime ici l’action de faire tomber ou de démolir une construction; « abattirent » convient précisément aux murailles.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: les murailles de Jérusalem
  rationale: « Murailles » désigne clairement les murs défensifs d’une ville et rend naturellement τείχη.
- source_word: τοὺς πύργους αὐτῆς
  choice: ses tours
  rationale: πύργοι désigne des tours; le possessif renvoie sans ambiguïté à Jérusalem.
- source_word: ἐν πυρί
  choice: aux flammes
  rationale: Cette expression française idiomatique conserve l’image du feu et renforce naturellement le second verbe d’incendie.
theological_decisions:
- issue: Traduction de κύριος dans l’expression désignant le temple
  choice: Seigneur
  alternative: Éternel
  rationale: Le témoin grec porte κυρίου; « Seigneur » le traduit directement sans substituer au texte grec une rétroversion du nom divin fondée sur une tradition hébraïque parallèle.
translation_notes:
  register: Français moderne, digne et narratif. « Incendièrent » et « livrèrent aux flammes » évitent une répétition pesante, tandis que la note signale la répétition du grec. La virgule finale est conservée puisque le verset se poursuit syntaxiquement.
