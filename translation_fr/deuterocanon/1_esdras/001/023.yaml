  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: fr
  text: Après tout ce que Josias avait accompli, il arriva que Pharaon, roi d’Égypte, vint déclencher une guerre à Karkemish, sur l’Euphrate ; et il sortit pour…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de l’édition de Swete s’interrompt après les mots « et il sortit pour… ». La suite de la proposition n’est pas conservée dans le texte fourni ; le contexte narratif indique vraisemblablement une réaction de Josias à Pharaon, sans permettre d’en traduire la formulation avec certitude.
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ πᾶσαν τὴν πρᾶξιν ταύτην Ἰωσείου
  choice: Après toute cette œuvre de Josias
  rationale: « Œuvre » rend le singulier πρᾶξις comme l’ensemble de l’action accomplie par Josias, avec un français naturel et digne, sans réduire l’expression à une simple liste d’événements.
- source_word: συνέβη
  choice: il arriva que
  rationale: Formule narrative française courante qui conserve la valeur événementielle du grec sans archaïsme excessif.
- source_word: Φαραὼ βασιλέα Αἰγύπτου
  choice: Pharaon, roi d’Égypte
  rationale: Le titre-nom Φαραώ est conservé sous sa forme française usuelle, tandis que l’apposition βασιλέα Αἰγύπτου est traduite directement.
- source_word: ἐλθόντα πόλεμον ἐγείραι
  choice: vint déclencher une guerre
  rationale: Cette formulation absorbe naturellement le participe ἐλθόντα dans le récit et garde l’idée dynamique de faire surgir ou commencer une guerre portée par ἐγείρω.
- source_word: ἐν Χαρκαμυς ἐπὶ τοῦ Εὐφράτου
  choice: à Karkemish, sur l’Euphrate
  rationale: « À » convient à un lieu d’affrontement, et « sur l’Euphrate » exprime naturellement la situation géographique de la ville.
- source_word: καὶ ἐξῆλθεν εἰς
  choice: et Josias marcha contre lui
  rationale: Le texte grec fourni s’interrompt après εἰς. Le sujet Josias et le complément « contre lui » sont explicités au minimum d’après le contexte immédiat, et cette restitution est signalée en note.
theological_decisions:
- issue: Forme du nom royal Ἰωσείου
  choice: Josias
  alternative: Josiah
  rationale: « Josias » correspond à la forme grecque et constitue également la forme française traditionnelle, sans harmonisation vers la forme anglaise ou hébraïque.
- issue: Achèvement de la proposition grecque interrompue
  choice: marcha contre lui
  alternative: sortit pour…
  rationale: La traduction principale donne le sens narratif minimal vraisemblable, mais la note préserve explicitement l’état incomplet du témoin fourni au lieu de présenter la restitution comme certaine.
translation_notes:
  register: Français international actuel, narratif et digne. La ponctuation allège la longue phrase grecque sans en modifier l’enchaînement. « Josias » et « Karkemish » suivent des formes françaises reconnaissables, tandis que la note rend visible l’incertitude textuelle en fin de verset.
