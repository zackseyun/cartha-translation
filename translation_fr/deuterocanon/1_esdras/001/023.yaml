    rationale: Le témoin fourni se termine à καὶ ἐξῆλθεν εἰς. « marcha contre lui » explicite à la fois le sujet, le mouvement et le complément que le texte conservé ne donne pas. La note avertit le lecteur, mais ne suffit pas à maintenir l’incertitude dans le texte traduit.
  - severity: low
    issue: « œuvre » est une traduction peu naturelle de πρᾶξις dans ce contexte.
    rationale: Le mot français peut avoir une nuance d’œuvre produite ou d’œuvre religieuse. Une formulation englobante telle que « tout ce que Josias avait accompli » rend plus naturellement le bilan d’actions visé par l’expression grecque.
