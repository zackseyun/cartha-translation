  rationale: La révision retire la complétion contextuelle « marcha contre lui » afin de refléter dans le texte principal l’interruption réelle du grec fourni. Elle remplace également « toute cette œuvre » par une formulation française plus idiomatique, sans réduire ni élargir le sens de πρᾶξις.
