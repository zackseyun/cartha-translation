  yaml_path: translation/deuterocanon/1_esdras/001/020.yaml
  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: fr
  text: Dans la dix-huitième année du règne de Josias, cette Pâque fut célébrée.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « cette Pâque fut menée » ou « conduite » ; cette expression signifie ici que l’observance de la Pâque fut accomplie.'
    reason: lexical_alternative
  - marker: b
    text: Le passage parallèle en 2 Chroniques 35 décrit les Israélites célébrant alors la Pâque ; le grec en donne ici un résumé condensé.
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: La dix-huitième année
  rationale: Le datif situe l’action dans le temps. Cette tournure est naturelle en français pour dater un événement selon les années d’un règne.
- source_word: βασιλεύοντος Ἰωσείου
  choice: du règne de Josias
  rationale: Le génitif absolu signifie littéralement « alors que Josias régnait ». La formulation retenue exprime ce repère chronologique avec concision. « Josias » est la forme française traditionnelle correspondant au nom grec Ἰωσίας.
- source_word: ἤχθη
  choice: fut célébrée
  rationale: Le verbe signifie littéralement « fut menée/conduite »; avec πάσχα, il désigne ici l’accomplissement de l’observance pascale. « Fut célébrée » est idiomatique en français sans ajouter l’idée de réjouissances.
- source_word: τὸ πάσχα
  choice: cette Pâque
  rationale: « Pâque » est le terme français usuel pour la fête juive; le démonstratif τοῦτο renvoie précisément à l’observance décrite dans le contexte.
- source_word: τοῦτο
  choice: cette
  rationale: Le démonstratif maintient explicitement le lien avec la Pâque qui vient d’être décrite.
