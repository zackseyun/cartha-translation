base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: fr
  text: Nabuchodonosor prit une partie des objets sacrés du Seigneur, les emporta et les déposa dans son temple à Babylone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « prit des objets sacrés du Seigneur ». La tournure grecque peut avoir un sens partitif : il prit parmi ces objets, sans nécessairement les prendre tous.'
    reason: La construction ἀπό suivie du génitif permet une traduction littérale moins explicite et une compréhension partitive.
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: une partie des objets sacrés
  rationale: 'Après un verbe de prise, ἀπό avec le génitif peut avoir un sens partitif : Nabuchodonosor prit parmi les objets sacrés, sans que le grec affirme qu’il les prit tous. « Objets sacrés » rend naturellement σκεύη dans ce contexte cultuel.'
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le grec porte κύριος ; « Seigneur » le traduit directement sans importer la convention typographique employée pour le tétragramme hébreu.
- source_word: λαβὼν
  choice: prit
  rationale: Le participe aoriste est rendu par un verbe conjugué afin de produire un récit français naturel tout en conservant l’ordre des actions.
- source_word: ἀπενέγκας
  choice: les emporta
  rationale: Le verbe exprime l’enlèvement et le transport des objets hors de leur lieu d’origine.
- source_word: ἀπηνείσατο
  choice: les déposa
  rationale: Le moyen aoriste désigne ici leur placement dans le temple ; « déposa » conserve le caractère délibéré et formel de l’action.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: dans son temple
  rationale: ναός désigne ici le sanctuaire de Nabuchodonosor à Babylone ; le possessif grec est conservé sans préciser la divinité concernée.
- source_word: ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: Formulation idiomatique française avec un nom de ville.
theological_decisions:
- issue: Traduction de κύριος dans un récit historique grec deutérocanonique
  choice: Seigneur
  alternative: Éternel / SEIGNEUR
  rationale: Le témoin directeur est grec et lit κύριος. « Seigneur » préserve cette donnée sans rétroversion certaine vers le nom divin hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Objets sacrés » est plus immédiatement compréhensible que « vases sacrés », qui pourrait suggérer seulement des récipients. Le nom traditionnel français « Nabuchodonosor » est retenu.
