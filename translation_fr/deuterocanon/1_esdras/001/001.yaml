base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: fr
  text: Josias célébra à Jérusalem la Pâque en l’honneur de son Seigneur[a], et ils immolèrent la victime pascale le quatorzième jour du premier mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, en grec : « pour son Seigneur »; le passage hébreu parallèle en 2 Chroniques 35.1 dit : « pour le SEIGNEUR » (YHWH).'
    reason: La note conserve la formulation exacte du grec et signale la différence avec le témoin hébreu parallèle.
lexical_decisions:
- source_word: ἤγαγεν
  choice: célébra
  rationale: Bien que le verbe signifie couramment « conduire » ou « amener », son emploi avec « la Pâque », éclairé par le parallèle hébreu וַיַּעַשׂ, désigne ici l’observance de la fête. « Célébra » exprime naturellement ce sens cultuel en français.
- source_word: τὸ πάσχα (première occurrence)
  choice: la Pâque
  rationale: La première occurrence désigne la célébration dans son ensemble; « la Pâque » est la formulation française directe et traditionnelle.
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: en l’honneur de son Seigneur
  rationale: Le datif indique ici la destination religieuse de la célébration. Cette formulation française naturelle conserve explicitement le possessif αὐτοῦ sans ajouter « Dieu », absent du grec.
- source_word: ἔθυσαν
  choice: immolèrent
  rationale: Le verbe désigne la mise à mort sacrificielle. « Immoler » garde à la fois l’action concrète et son cadre cultuel.
- source_word: τὸ πάσχα (deuxième occurrence)
  choice: la victime pascale
  rationale: Avec « immolèrent », πάσχα désigne par métonymie l’animal sacrifié plutôt que la fête elle-même. « La victime pascale » rend ce changement de référent sans préciser qu’il s’agit d’un agneau, détail non exprimé dans le grec.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου
  choice: le quatorzième jour du premier mois
  rationale: Rendu temporel direct, exact et idiomatique en français.
theological_decisions:
- issue: Rendu de κύριος dans un texte grec deutérocanonique dont le parallèle hébreu porte le nom divin YHWH
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le texte grec primaire porte κυρίῳ et non le tétragramme. « Seigneur » traduit donc directement le grec, tandis que le parallèle hébreu est signalé en note sans remplacer la leçon grecque.
- issue: Présence du possessif αὐτοῦ après κυρίῳ
  choice: son Seigneur
  alternative: le Seigneur
  rationale: Le possessif appartient explicitement au texte grec et doit rester visible, même si le parallèle hébreu de 2 Chroniques 35.1 dit simplement « pour YHWH ».
translation_notes:
  register: Français international moderne, digne et accessible. « Célébra » et « en l’honneur de » rendent naturellement l’acte cultuel; « victime pascale » explicite seulement la métonymie requise par le verbe « immoler ». Le possessif grec est maintenu et aucun titre divin absent de la source primaire n’est ajouté.
