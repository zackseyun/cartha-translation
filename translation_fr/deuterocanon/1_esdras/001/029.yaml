base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: fr
  text: Il monta sur son second char et, après avoir été ramené à Jérusalem, il quitta cette vie[a] et fut enseveli dans le tombeau de ses ancêtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « il changea (ou échangea) sa vie » ; cette expression grecque est une manière de dire qu’il mourut.
    reason: lexical_alternative
  - marker: b
    text: Le texte parallèle de 2 Chroniques 35.24 parle des « tombeaux de ses ancêtres » et ajoute que tout Juda et Jérusalem pleurèrent Josias. Ici, 1 Esdras est plus bref et emploie « tombeau » au singulier.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη ἐπὶ τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: Il monta sur son second char
  rationale: « Monter sur » rend naturellement le mouvement exprimé par ἀνέβη avec ἐπί. « Son second char » conserve la valeur attributive de δεύτερον et la formulation du grec.
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: après avoir été ramené à Jérusalem
  rationale: Le participe passif indique qu’il a été reconduit ou ramené; cette formulation respecte la voix passive et convient au contexte du transport de Josias blessé.
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: il quitta cette vie
  rationale: L’expression grecque est un idiome désignant la mort. « Quitta cette vie » en garde la tournure indirecte sans employer « mit fin à ses jours », qui pourrait évoquer à tort un suicide.
- source_word: ἐτάφη
  choice: fut enseveli
  rationale: Rendu passif, digne et courant du verbe signifiant « enterrer » ou « ensevelir ».
- source_word: ἐν τῷ πατρικῷ τάφῳ
  choice: dans le tombeau de ses ancêtres
  rationale: πατρικός renvoie aux pères ou aux ancêtres, tandis que τάφος est singulier. La formulation française conserve l’idée d’un tombeau ancestral collectif.
