    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  choice: donna
  rationale: Le verbe moyen exprime ici le fait de fournir généreusement un don. « Donna » est naturel, clair et suffisamment digne.
- source_word: τῷ λαῷ τοῖς εὑρεθέντι
  choice: aux gens présents
  rationale: La formulation grecque, irrégulière dans son accord, signifie littéralement quelque chose comme « au peuple, ceux qui se trouvaient là ». « Aux gens présents » en restitue naturellement le sens contextuel sans masquer l'explication littérale donnée en note.
- source_word: ἀρνῶν καὶ ἐρίφων
  choice: agneaux et chevreaux
  rationale: ἀρνῶν désigne des agneaux et ἐρίφων de jeunes chèvres. « Chevreaux » est précis et courant en français.
- source_word: τριακοντα χιλιάδας
  choice: trente mille
  rationale: Traduction directe du nombre grec.
- source_word: μόσχους
  choice: veaux
  rationale: μόσχος désigne un jeune bovin; « veaux » évite de préciser indûment le sexe.
- source_word: τρισχιλίους
  choice: trois mille
  rationale: Traduction directe du nombre grec.
theological_decisions:
- issue: Rapport avec le parallèle massorétique fourni, qui ne correspond pas étroitement au verset grec
  choice: Suivre le grec de 1 Esdras et traduire le don d'animaux fait par Josias
  alternative: Harmoniser le texte avec la séquence d'actions du parallèle hébreu
  rationale: Le grec est ici le témoin primaire indiqué. Le parallèle hébreu fourni appartient à un contexte différent et ne doit donc pas remplacer ni remodeler le contenu grec.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste concise, avec « ainsi que » pour rendre clairement la seconde catégorie chiffrée. Le décalage avec le parallèle hébreu n'est pas signalé dans une note de lecture, car il relève surtout de l'établissement des sources et non d'une variante interne utile au lecteur de ce verset.
