base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/050.yaml
  text: These men killed their young men with the sword around the holy temple[a], and they showed no mercy to young man or virgin, old man or youth[b],
translation:
  language: fr
  text: Ces hommes tuèrent leurs jeunes hommes par l’épée autour du saint Temple et n’épargnèrent ni jeune homme, ni jeune fille vierge, ni vieillard, ni personne plus jeune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu fourni à cet endroit n’est qu’approximatif et présente une formulation différente ; le grec décrit précisément ici un massacre autour du Temple.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  choice: Ceux-ci
  rationale: Le démonstratif renvoie directement aux envahisseurs mentionnés dans le contexte, sans ajouter un nom absent du grec.
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: Verbe narratif direct, naturel et fidèle au sens de mise à mort.
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: leurs jeunes hommes
  rationale: Conserve le possessif αὐτῶν et le sens masculin de νεανίσκους.
- source_word: ἐν ῥομφαίᾳ
  choice: par l’épée
  rationale: Expression biblique française naturelle indiquant l’instrument du massacre.
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  choice: autour du Temple saint
  rationale: περικύκλῳ situe l’action autour de l’enceinte; ἱερόν désigne le Temple ou son complexe, et ἁγίου est rendu explicitement.
- source_word: οὐκ ἐφείσαντο
  choice: n’épargnèrent
  rationale: Rend directement le verbe grec sans expliciter davantage l’idée de compassion.
- source_word: νεανίσκου καὶ παρθένου
  choice: ni jeune homme, ni jeune fille vierge
  rationale: La construction négative est naturellement rendue par « ni… ni »; « jeune fille vierge » conserve la spécificité de παρθένος dans un français courant.
- source_word: πρεσβύτου καὶ νεωτέρου
  choice: ni vieillard, ni personne plus jeune
  rationale: πρεσβύτης désigne ici un homme âgé plutôt qu’une fonction; νεώτερος est comparatif et substantivé, donc « personne plus jeune » préserve sa portée sans le réduire arbitrairement à un jeune homme.
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle massorétique fourni
  choice: Traduire directement la description grecque du massacre autour du Temple.
  alternative: Aligner le verset sur le parallèle hébreu concernant les chefs, le peuple et la profanation de la maison du Seigneur.
  rationale: Le témoin hébreu fourni est signalé comme approximatif et présente un contenu différent; le grec est ici la source primaire et ne doit pas être harmonisé avec lui.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination répétée et la finale comparative du grec sont conservées autant que le permet un français naturel. La majuscule à « Temple » identifie le Temple de Jérusalem sans ajouter de précision absente du texte.
