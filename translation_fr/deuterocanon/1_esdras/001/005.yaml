base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: fr
  text: conformément à l’écrit de David, roi d’Israël, et à la grandeur de Salomon, son fils[a]. Et tenez-vous dans le sanctuaire[b], selon la répartition héritée de vos pères[c], vous, les lévites, devant vos frères, les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la majesté » ou « la magnificence de Salomon, son fils ». Le grec peut évoquer la grandeur ou le caractère imposant de ce qu’il avait établi, mais ne mentionne pas explicitement des dispositions écrites.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans le [lieu] saint ».'
    reason: lexical_alternative
  - marker: c
    text: 'La formulation grecque est condensée. Le parallèle hébreu exprime plus complètement l’idée : « selon vos maisons paternelles, selon vos divisions ».'
    reason: alternative_reading
lexical_decisions:
- source_word: γραφήν
  choice: écrit
  rationale: Le terme désigne ici un document ou une directive écrite attribuée à David, plutôt que « l’Écriture » au sens technique. Le parallèle hébreu בכתב confirme cette valeur concrète.
- source_word: μεγαλειότητα
  choice: grandeur
  rationale: Cette traduction garde le sens premier de grandeur ou de magnificence sans préciser abusivement qu’il s’agit d’un écrit ou d’une organisation, élément absent de la formulation grecque.
- source_word: στᾶντες
  choice: tenez-vous
  rationale: Le participe grec a ici une valeur injonctive dans son contexte. L’impératif rend cette force naturellement en français, au lieu de produire une construction participiale maladroite.
- source_word: ἐν τῷ ἁγίῳ
  choice: dans le sanctuaire
  rationale: L’expression signifie littéralement « dans le [lieu] saint ». « Sanctuaire » est clair et naturel, sans déterminer une zone architecturale plus précise que le grec.
- source_word: μεριδαρχίαν τὴν πατρικήν
  choice: répartition héritée de vos pères
  rationale: Le mot rare μεριδαρχία renvoie à une organisation en divisions ou parts, et πατρικήν à son fondement ancestral. Cette formulation conserve l’idée d’un ordre transmis selon les lignées, éclairée sans être remplacée par le parallèle hébreu.
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: devant vos frères
  rationale: La traduction garde le sens spatial ou représentatif de ἔμπροσθεν et la relation fraternelle explicite du grec.
- source_word: υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Cette expression familiale et tribale traduit directement le grec, au lieu de l’aplanir en « Israélites » ou « peuple d’Israël ».
theological_decisions:
- issue: Expression familiale masculine υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation source est une désignation familiale et tribale précise. La conserver respecte son imagerie d’alliance sans ajouter d’interprétation confessionnelle.
- issue: Clarification du grec condensé par le parallèle hébreu
  choice: selon la répartition héritée de vos pères
  alternative: selon vos maisons paternelles et vos divisions
  rationale: Le texte principal reste ancré dans le grec, qui condense l’idée en μεριδαρχίαν τὴν πατρικήν. Le parallèle hébreu éclaire l’arrière-plan familial, mais sa formulation plus développée n’est pas introduite telle quelle dans le texte.
- issue: Rapport entre Salomon et μεγαλειότητα
  choice: la grandeur de Salomon
  alternative: les dispositions grandioses de Salomon
  rationale: Le grec ne mentionne explicitement ni écrit, ni dispositions après κατὰ τὴν μεγαλειότητα. La traduction principale préserve donc son étrangeté et son ambiguïté au lieu de les résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. L’impératif « tenez-vous » exprime naturellement la valeur injonctive du participe grec. Les termes « grandeur » et « répartition héritée de vos pères » préservent respectivement l’ambiguïté du grec et son organisation ancestrale sans importer le développement complet du parallèle hébreu.
