base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: fr
  text: Et il établit Sédécias roi de la Judée et de Jérusalem. Sédécias avait vingt et un ans et régna onze ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: établit
  rationale: Dans ce contexte royal, le verbe exprime l’idée d’élever officiellement quelqu’un à une fonction ou de l’y installer. « Établit » reste naturel et digne.
- source_word: Σεδεκίαν
  choice: Sédécias
  rationale: Forme française biblique traditionnelle et couramment reconnue du nom royal grec Σεδεκίας.
- source_word: βασιλέα
  choice: comme roi
  rationale: Après « établir », cette tournure française exprime naturellement la nomination à la royauté.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: de la Judée et de Jérusalem
  rationale: Rendu direct du génitif grec, sans harmoniser « Judée » avec la forme « Juda » d’une tradition hébraïque parallèle.
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: avait vingt et un ans
  rationale: Formulation idiomatique française de l’indication d’âge.
- source_word: βασιλεύει
  choice: régna
  rationale: Verbe français usuel pour la durée du règne d’un roi; le présent historique grec est naturellement rendu par le passé simple dans ce récit.
- source_word: ἔτη ἕνδεκα
  choice: onze ans
  rationale: Rendu direct de la durée indiquée en grec.
