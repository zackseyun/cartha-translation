base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: fr
  text: 'Parmi les fils de Phoros[a] : Tarosotomos ; parmi les fils d’Iétamar : Gamélos ; parmi les fils de David[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les noms grecs de ce passage diffèrent sensiblement du parallèle approximatif d’Esdras 8.2 dans le texte hébreu, qui porte : « parmi les fils de Phinéas, Guershom ; parmi les fils d’Itamar, Daniel ; parmi les fils de David, Hattoush ». Puisque 1 Esdras est traduit d’après le témoin grec, le texte principal en conserve les formes au lieu de les harmoniser avec ce parallèle hébreu.'
    reason: alternative_reading
  - marker: b
    text: La formule « parmi les fils de David » reste inachevée ici, car la liste grecque se poursuit au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: parmi les fils de
  rationale: Cette formule rend naturellement en français l’idée d’une personne issue d’un groupe familial, tout en conservant la structure généalogique répétée du grec.
- source_word: Φορός
  choice: Phoros
  rationale: Le témoin grec étant la source principale de 1 Esdras, le nom est translittéré d’après sa forme grecque plutôt qu’harmonisé avec le texte hébreu parallèle.
- source_word: Ταροσότομος
  choice: Tarosotomos
  rationale: La forme grecque, nettement différente de la tradition hébraïque parallèle, est conservée par translittération afin de ne pas corriger silencieusement le texte source.
- source_word: Ἰεταμάρου
  choice: Iétamar
  rationale: Cette forme française reste proche du grec Ἰεταμάρ tout en employant un accent qui en facilite la lecture et la prononciation en français.
- source_word: Γάμηλος
  choice: Gamélos
  rationale: Le nom est translittéré à partir du grec, avec un accent français indiquant la syllabe correspondante, plutôt que remplacé par « Daniel » d’après le parallèle hébreu.
- source_word: τῶν υἱῶν Δαυείδ
  choice: parmi les fils de David,
  rationale: La préposition « parmi » est reprise selon la structure de la liste, bien que ἐκ ne soit pas répété dans ce segment. La virgule finale maintient le caractère inachevé de l’énoncé, qui se poursuit au verset suivant.
