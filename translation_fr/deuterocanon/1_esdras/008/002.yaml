base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: fr
  text: fils de Saddoulouk[a], fils d’Akheitob, fils d’Amarthéios, fils d’Ozéias, fils de Bokka, fils d’Abéisaï, fils de Phinéès[b], fils d’Éléazar, fils d’Aaron, le premier prêtre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec donne ici une généalogie plus développée que le bref parallèle hébreu, qui porte : « fils de Shalloum, fils de Tsadok, fils d’Ahitoub ».'
    reason: alternative_reading
  - marker: b
    text: 'Plusieurs noms suivent ici leur forme grecque. Les formes apparentées issues de l’hébreu sont notamment : Akheitob = Ahitoub, Ozéias = Ouzzi, Bokka = Boukki, Abéisaï = Abishoua et Phinéès = Phinéas.'
    reason: lexical_alternative
  - marker: c
    text: Ou « le prêtre principal ». Le grec peut évoquer celui qui est le premier ou le principal, mais il dit simplement « prêtre », et non « grand prêtre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, les génitifs successifs expriment elliptiquement la filiation. « Fils de » rend cette relation clairement en français; le parallèle hébreu emploie explicitement ben, « fils de ».
- source_word: Σαδδουλούκου
  choice: Saddoulouk
  rationale: Le nom est translittéré d’après le témoin grec principal plutôt qu’harmonisé avec le nom Shalloum du parallèle hébreu.
- source_word: Ἀχειτὼβ
  choice: Akheitob
  rationale: Translittération française de la forme grecque, avec kh pour χ; la forme hébraïque plus familière Ahitoub est signalée en note.
- source_word: Ἀμαρθείου
  choice: Amarthéios
  rationale: La forme grecque et cet ancêtre supplémentaire sont conservés sans harmonisation avec la généalogie hébraïque plus courte.
- source_word: Ὀζείου
  choice: Ozéias
  rationale: Translittération naturelle en français de la forme grecque; Ouzzi représente la forme apparentée issue de l’hébreu.
- source_word: Βοκκὰ
  choice: Bokka
  rationale: La forme grecque est conservée; la forme hébraïque apparentée Boukki figure en note.
- source_word: Ἀβεισαὶ
  choice: Abéisaï
  rationale: Translittération adaptée à la lecture française de la forme grecque, sans substitution de la forme hébraïque Abishoua.
- source_word: Φεινεὲς
  choice: Phinéès
  rationale: La forme grecque est conservée en translittération française; Phinéas, forme biblique issue de l’hébreu, est indiquée en note.
- source_word: Ἐλεαζὰρ
  choice: Éléazar
  rationale: Emploi de la forme française courante, qui correspond étroitement au grec.
- source_word: Ἀαρὼν
  choice: Aaron
  rationale: Emploi de la forme française courante du nom biblique.
- source_word: τοῦ πρώτου ἱερέως
  choice: le premier prêtre
  rationale: πρῶτος signifie fondamentalement « premier », tandis que ἱερεύς signifie « prêtre ». La traduction conserve ces termes sans introduire « grand prêtre », titre qui traduirait normalement ἀρχιερεύς; le sens possible de « prêtre principal » est signalé en note.
theological_decisions:
- issue: Faut-il harmoniser la généalogie grecque développée avec le parallèle hébreu plus court?
  choice: Conserver toute la généalogie du grec dans le texte principal.
  alternative: Remplacer ou réorganiser les noms selon la suite hébraïque « Shalloum, Tsadok, Ahitoub ».
  rationale: Pour 1 Esdras, le grec est le témoin source principal. Sa suite généalogique explicite ne doit pas être réduite silencieusement à celle du parallèle hébreu; la différence est documentée en note.
- issue: Comment comprendre πρῶτος dans τοῦ πρώτου ἱερέως?
  choice: « le premier prêtre »
  alternative: « le prêtre principal » ou, par interprétation historique, « le premier grand prêtre »
  rationale: Le rendu principal préserve le sens ordinaire de πρῶτος et le mot grec précis ἱερεύς, « prêtre ». Une note maintient l’ambiguïté possible entre priorité chronologique et prééminence, sans importer le titre ἀρχιερεύς, « grand prêtre ».
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « fils de » est maintenue pour rendre explicitement la structure généalogique du grec. Les noms propres suivent les formes grecques avec une graphie lisible en français, tandis que les équivalents hébraïques familiers sont réservés aux notes.
