base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: fr
  text: Nous voici devant toi avec nos transgressions[a] ; car il ne nous est plus possible de nous tenir devant toi à cause de tout cela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos iniquités » ou « nos actes contraires à la loi ». Le grec peut désigner aussi bien les violations commises que l’état de culpabilité qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle hébreu fourni, en Esdras 9.14, exprime la crise autrement : il souligne la colère de Dieu et le risque qu’aucun reste ni rescapé ne subsiste. Ici, 1 Esdras insiste sur l’impossibilité de se tenir devant Dieu à cause de ces transgressions.'
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Nous voici
  rationale: Cette tournure française actuelle conserve la force présentative de ἰδοὺ et s’enchaîne naturellement avec « devant toi ».
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: nous voici devant toi
  rationale: La formulation exprime directement la présence devant Dieu sans traduire ἐσμέν par « nous nous tenons », puisque l’idée de se tenir debout apparaît explicitement ensuite avec στῆναι.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: avec nos transgressions
  rationale: « Transgressions » garde la dimension morale et juridique d’ἀνομία. La préposition « avec » exprime ici la condition dans laquelle les personnes comparaissent devant Dieu sans ajouter une image absente du grec.
- source_word: οὐ γάρ ἐστιν στῆναι
  choice: car il ne nous est […] possible de nous tenir
  rationale: Cette construction idiomatique rend l’impossibilité exprimée par οὐκ ἔστιν suivi de l’infinitif, tout en conservant l’image de στῆναι.
- source_word: ἔτι
  choice: plus
  rationale: Dans la négation « ne… plus », ce choix traduit naturellement l’idée de ne plus pouvoir continuer à se tenir devant Dieu.
- source_word: ἔμπροσθέν σου
  choice: devant toi
  rationale: La répétition de « devant toi » reproduit l’insistance du grec et maintient la portée relationnelle et judiciaire de la scène.
- source_word: ἐπὶ τούτοις
  choice: à cause de tout cela
  rationale: 'Le contexte favorise une valeur causale : ce sont les transgressions confessées qui rendent impossible de se tenir devant Dieu. « Tout cela » renvoie naturellement à l’ensemble des faits évoqués.'
theological_decisions:
- issue: Sens d’ἀνομίαι dans une confession de faute
  choice: transgressions
  alternative: iniquités ; actes contraires à la loi ; fautes
  rationale: « Transgressions » demeure compréhensible en français moderne et conserve l’idée d’une violation des exigences divines, sans réduire le terme aux seuls actes ni lui imposer une définition doctrinale technique.
- issue: Rapport entre le texte grec et le parallèle hébreu fourni
  choice: traduire directement l’incapacité, formulée en grec, de se tenir devant Dieu
  alternative: reformuler le verset selon le parallèle hébreu fourni, centré sur la colère divine et la disparition du reste
  rationale: Le grec est ici le témoin principal et formule explicitement la crise comme une impossibilité de se tenir devant Dieu. Le parallèle hébreu fourni présente une formulation différente et ne doit donc pas remplacer le texte grec.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Nous voici » évite l’archaïsme de « voici que » tout en gardant l’élan solennel de la confession. La répétition de « devant toi » est volontaire, car elle correspond à celle du grec.
