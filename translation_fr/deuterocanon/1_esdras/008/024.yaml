base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: fr
  text: Tous ceux qui transgressent à la fois la loi de ton Dieu et celle du roi seront punis avec rigueur[a], soit de mort, soit d’une peine, soit d’une amende en argent, soit du bannissement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni diffère sensiblement du parallèle massorétique indiqué, qui correspond à un autre contexte ; la traduction suit donc ici le grec comme témoin principal.
    reason: textual_variant
  - marker: b
    text: Ou « confiscation ». Le mot grec peut désigner le fait d’emmener ou d’enlever ; dans cette liste de sanctions, il peut donc s’agir soit d’un bannissement, soit de la saisie de biens.
    reason: alternative_reading
lexical_decisions:
- source_word: παραβαίνωσι
  choice: transgressent
  rationale: Le verbe exprime la violation d’une loi; « transgresser » conserve ici la force juridique du grec.
- source_word: νόμον τοῦ θεοῦ σου καὶ τοῦ βασιλικοῦ
  choice: la loi de ton Dieu et celle du roi
  rationale: L’adjectif substantivé τοῦ βασιλικοῦ reprend implicitement νόμον. « Celle du roi » rend cette ellipse sans alourdir la phrase.
- source_word: ἐπιμελῶς κολασθήσονται
  choice: seront punis avec rigueur
  rationale: ἐπιμελῶς souligne l’application attentive et effective de la sanction. Dans ce contexte administratif, « avec rigueur » est plus idiomatique que « soigneusement » sans imposer l’idée de cruauté.
- source_word: τιμωρίᾳ
  choice: d’une autre peine
  rationale: Le terme désigne une peine ou un châtiment. « Autre » explicite sa place dans l’énumération après la mort, sans en préciser indûment la nature.
- source_word: ἀργυρίῳ ζημίᾳ
  choice: d’une amende en argent
  rationale: L’expression désigne une sanction pécuniaire; cette formulation française conserve l’image concrète de l’argent tout en restant naturelle.
- source_word: ἀπαγωγῇ
  choice: du bannissement
  rationale: ἀπαγωγή peut exprimer le fait d’emmener ou d’éloigner. Dans cette liste de sanctions, « bannissement » rend mieux une mesure distincte de l’amende qu’une seconde peine patrimoniale.
theological_decisions:
- issue: Rapport entre la loi divine et la loi royale
  choice: à la fois la loi de ton Dieu et celle du roi
  alternative: la loi de ton Dieu ou celle du roi
  rationale: La construction grecque καὶ… καὶ présente les deux lois ensemble. La traduction maintient cette double obligation sans établir entre elles une hiérarchie absente de la phrase.
- issue: Témoin massorétique parallèle non correspondant
  choice: suivre le texte grec fourni comme témoin principal
  alternative: conformer le verset au parallèle araméen du texte massorétique
  rationale: Le parallèle fourni appartient manifestement à un autre contexte et ne correspond pas au contenu du verset grec. Il ne doit donc pas remplacer ni harmoniser le témoin principal.
- issue: Nature de la dernière sanction
  choice: bannissement
  alternative: confiscation
  rationale: Le grec permet l’idée d’un enlèvement ou d’un éloignement. Puisque l’amende pécuniaire vient d’être mentionnée séparément, « bannissement » préserve plus vraisemblablement la distinction entre les sanctions, tout en signalant l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et juridique sans archaïsme. « Avec rigueur » transmet l’idée d’une exécution diligente des sanctions; l’énumération reste concise et lisible. Les ambiguïtés textuelles et lexicales importantes sont conservées en note.
