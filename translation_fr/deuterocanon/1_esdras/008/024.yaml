revisions:
- from: Tous ceux qui transgressent à la fois la loi de ton Dieu et celle du roi seront punis avec rigueur[a], soit de mort, soit d’une autre peine, d’une amende en argent ou du bannissement[b].
  to: Tous ceux qui transgressent à la fois la loi de ton Dieu et celle du roi seront punis avec rigueur[a], soit de mort, soit d’une peine, soit d’une amende en argent, soit du bannissement[b].
  rationale: La révision retire l’ajout interprétatif « autre », régularise l’énumération des sanctions et resserre la note sur l’ambiguïté lexicale réelle de ἀπαγωγῇ. Elle conserve « bannissement » dans le texte tout en signalant loyalement « confiscation » comme autre lecture possible, sans harmoniser le grec avec le parallèle massorétique non correspondant.
