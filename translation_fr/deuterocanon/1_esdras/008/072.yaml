base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: fr
  text: Car nos péchés se sont multipliés au-dessus de nos têtes, et nos fautes commises par ignorance[a] se sont élevées jusqu’au ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos erreurs », « nos actes commis par ignorance ». Le grec emploie ici un terme différent de celui traduit par « péchés » dans la première proposition.
    reason: Signaler l’étendue du sens de ἄγνοιαι et préserver la distinction lexicale du texte grec.
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: « Péchés » est l’équivalent français direct et courant du terme grec désignant ici les manquements moraux.
- source_word: ἐπλεόνασαν
  choice: se sont multipliés
  rationale: Ce rendu conserve l’idée d’un accroissement considérable et l’image d’une masse qui s’élève au-dessus des têtes.
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: au-dessus de nos têtes
  rationale: La formulation reste proche de l’image grecque d’une culpabilité devenue écrasante, tout en étant claire en français moderne.
- source_word: ἄγνοιαι
  choice: fautes commises par ignorance
  rationale: Le terme peut désigner l’ignorance elle-même ou des actes fautifs commis sans savoir. Ce choix naturel en français maintient la distinction avec « péchés ».
- source_word: ὑπερήνεγκαν
  choice: se sont élevées
  rationale: Le verbe exprime ici un mouvement ou une extension vers le haut; ce choix préserve l’image verticale.
- source_word: ἕως τοῦ οὐρανοῦ
  choice: jusqu’au ciel
  rationale: « Jusqu’au ciel » rend précisément la limite exprimée par ἕως et convient au registre biblique sans archaïsme.
theological_decisions:
- issue: Faut-il confondre ἁμαρτίαι et ἄγνοιαι sous une seule catégorie de péché ?
  choice: Maintenir la distinction par « péchés » et « fautes commises par ignorance ».
  alternative: Traduire les deux termes par « péchés », « fautes » ou « offenses » sans distinction.
  rationale: Le grec emploie deux noms différents. Le second peut suggérer des actes commis dans l’ignorance, sans exclure leur caractère fautif. Le rendu choisi préserve cette nuance sans trancher davantage la question de la responsabilité morale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et les deux images d’élévation du grec sont conservées; la note explicite la nuance du second terme sans imposer une interprétation doctrinale.
