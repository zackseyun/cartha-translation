base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/014.yaml
  text: together with what was freely given by the nation for the temple of their Lord in Jerusalem[a], and the gold and silver to be gathered for bulls and rams and lambs and what goes with them[b],
translation:
  language: fr
  text: avec ce qui a été offert par la nation pour le temple de leur Seigneur à Jérusalem[a], et l’or et l’argent qui doivent être rassemblés pour des taureaux, des béliers, des agneaux et ce qui les accompagne[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle en Esdras 7.16 diffère sensiblement : il parle de l’argent et de l’or offerts volontairement par le roi et ses conseillers au Dieu d’Israël, dont la demeure est à Jérusalem. Le texte grec de 1 Esdras n’a pas la même formulation ; il est traduit ici tel quel.'
    reason: textual_variant
  - marker: b
    text: Ou « les choses qui les accompagnent », probablement les autres éléments nécessaires aux sacrifices.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους
  choice: avec ce qui a été offert par la nation
  rationale: Le participe parfait exprime ce qui a été donné en offrande. « La nation » traduit directement ἔθνος sans harmoniser avec le parallèle massorétique.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν Ἰερουσαλήμ
  choice: pour le temple de leur Seigneur à Jérusalem
  rationale: « Pour » convient au contexte d’une offrande destinée au temple. Le possessif « leur » est conservé, sans ajouter « Dieu », absent du grec.
- source_word: συναχθῆναι, τό τε χρυσίον καὶ ἀργύριον
  choice: ainsi que l’or et l’argent qui doivent être rassemblés
  rationale: La construction rattache naturellement l’infinitif passif à l’or et à l’argent. « Rassemblés » reste proche du grec tout en étant idiomatique.
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: pour acheter des taureaux, des béliers et des agneaux
  rationale: La préposition εἰς indique ici la destination des fonds. L’ajout explicatif « acheter » rend en français naturel l’emploi de l’or et de l’argent, sans modifier la liste précise des animaux sacrificiels.
- source_word: τὰ τούτοις ἀκόλουθα
  choice: ce qui les accompagne
  rationale: Cette formulation préserve le caractère général du grec, qui désigne vraisemblablement les éléments associés aux sacrifices sans les préciser.
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle d’Esdras 7.16 dans le texte massorétique
  choice: 'Traduire tel quel le grec : « par la nation… de leur Seigneur à Jérusalem »'
  alternative: Harmoniser avec le parallèle massorétique, qui parle de l’argent et de l’or offerts par le roi et ses conseillers au Dieu d’Israël dont la demeure est à Jérusalem
  rationale: Le grec de 1 Esdras est le témoin principal et diffère sensiblement du parallèle massorétique. La traduction conserve donc sa formulation propre et signale la variante en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure un fragment syntaxique lié au contexte précédent et se termine donc par une virgule. « Seigneur » conserve la portée de κύριος; la formulation n’importe aucun complément du parallèle hébreu.
