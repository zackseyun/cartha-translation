base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: fr
  text: Et tout ce qui nous arrive vient de nos mauvaises actions et de nos grands péchés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tout ce qui nous échoit se produit à cause de nos mauvaises actions et de nos grands péchés. »'
    reason: Variante lexicale reflétant plus formellement τὰ συμβαίνοντα et γίνεται.
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα ἡμῖν
  choice: tout ce qui nous arrive
  rationale: La tournure rend naturellement en français le participe de συμβαίνω, le datif des personnes touchées et la portée globale de πάντα.
- source_word: γίνεται
  choice: vient
  rationale: « Vient » évite de répéter « arrive » et conserve l’idée que les événements ont pour cause les actes ensuite mentionnés.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά marque explicitement la cause.
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: nos mauvaises actions
  rationale: Cette formulation actuelle et claire exprime la portée morale négative de πονηρά sans archaïsme.
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: nos grands péchés
  rationale: « Grands » traduit directement μεγάλας et souligne la gravité ou l’ampleur des péchés sans le transformer en « nombreux ».
theological_decisions:
- issue: Lien causal entre les malheurs collectifs et les péchés
  choice: Le verset affirme que tout ce qui arrive au groupe vient de ses mauvaises actions et de ses grands péchés.
  alternative: Atténuer le rapport causal en disant seulement que ces événements sont associés aux péchés.
  rationale: Le grec διὰ suivi de l’accusatif exprime clairement la cause. La traduction conserve cette confession de culpabilité sans l’étendre en doctrine générale sur toute souffrance.
translation_notes:
  register: Français international moderne, simple et digne. « Mauvaises actions » est plus naturel que « œuvres mauvaises », tandis que « grands péchés » maintient la formulation forte du grec.
