base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: fr
  text: 'Et je leur ai dit : « Vous aussi, vous êtes saints pour le Seigneur, et les objets sont saints ; l’argent et l’or sont une offrande votive au Seigneur[a], le Seigneur de nos pères[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec εὐχή peut désigner un « vœu » ou, dans ce contexte, une offrande votive. Le parallèle hébreu porte « une offrande volontaire ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « le Seigneur de nos pères » ; le parallèle hébreu porte « le Seigneur, le Dieu de vos pères ».
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί / ἅγια
  choice: saints
  rationale: Le grec répète l’adjectif ἅγιος pour les personnes et les objets. « Saints » conserve cette répétition et la force cultuelle du terme, sans développer en « consacrés ».
- source_word: τῷ κυρίῳ
  choice: pour le Seigneur
  rationale: Avec ἅγιοί ἐστε, le datif exprime ici l’appartenance ou la consécration. « Pour le Seigneur » est naturel en français et concorde avec le parallèle hébreu לַיהוָה.
- source_word: τὰ σκεύη
  choice: les objets sacrés
  rationale: Dans ce contexte cultuel, σκεύη désigne les objets ou ustensiles du sanctuaire. « Objets sacrés » est plus immédiatement intelligible que « vases » et le contexte précise leur statut.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: l’argent et l’or
  rationale: L’association des deux termes et le contexte d’offrande favorisent les matières précieuses plutôt que le sens monétaire d’ἀργύριον.
- source_word: εὐχή
  choice: offrande vouée
  rationale: Le grec εὐχή désigne littéralement un vœu et peut, dans ce contexte, désigner ce qui est offert en accomplissement d’un vœu. « Offrande vouée » garde le lien grec avec le vœu, tandis que la note signale l’offrande volontaire du parallèle hébreu.
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: le Seigneur de nos pères
  rationale: Cette traduction suit directement le texte grec transmis, y compris « nos ». La formulation plus habituelle « le Dieu de vos pères » appartient au parallèle hébreu et est signalée en note.
theological_decisions:
- issue: Sens cultuel de εὐχή face au parallèle hébreu נְדָבָה
  choice: offrande vouée
  alternative: offrande volontaire
  rationale: Le grec étant le texte principal, la traduction conserve son lien lexical avec le vœu. Le parallèle hébreu indique toutefois une offrande volontaire ; cette divergence est préservée en note plutôt que résolue silencieusement.
- issue: Divergence du titre divin final entre le grec et le parallèle hébreu
  choice: le Seigneur de nos pères
  alternative: le Seigneur, le Dieu de vos pères
  rationale: Le texte principal rend formellement κυρίῳ τῶν πατέρων ἡμῶν. Il n’importe pas « Dieu » ni « vos » depuis l’hébreu, mais la note donne la lecture parallèle afin de rendre visible la différence textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les répétitions du grec lorsqu’elles structurent l’affirmation. Les deux marqueurs [a] et [b] figurent dans le texte principal.
