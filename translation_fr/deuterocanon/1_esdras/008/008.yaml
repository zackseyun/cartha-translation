base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: fr
  text: Voici la copie du document que le roi Artaxerxès a adressé à Esdras, prêtre et lecteur de la Loi du Seigneur[a] :[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « lecteur de la Loi du Seigneur ». Le texte hébreu parallèle d’Esdras 7.11 porte « scribe » au lieu de « lecteur ».
    reason: alternative_reading
  - marker: b
    text: La formulation grecque de cet en-tête est assez difficile. Le sens paraît être qu’une copie du document du roi Artaxerxès destiné à Esdras est reproduite à la suite.
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: document adressé
  rationale: La tournure grecque transmise est difficile et paraît relever du style d’un en-tête documentaire. Avec ἀντίγραφον et τὸ ὑποκείμενον, elle introduit vraisemblablement un document royal destiné à Esdras, sans permettre de préciser davantage le mode de remise.
- source_word: παρὰ Ἀρταξέρξου βασιλέως πρὸς Ἔσραν
  choice: adressé par le roi Artaxerxès à Esdras
  rationale: παρά avec le génitif indique la provenance, tandis que πρός marque ici le destinataire. « Adressé par… à… » restitue naturellement le cadre documentaire.
- source_word: τὸν ἱερέα
  choice: prêtre
  rationale: Titre direct d’Esdras, rendu simplement et sans ajout interprétatif.
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: lecteur de la Loi du Seigneur
  rationale: ἀναγνώστης signifie littéralement « lecteur » ou « celui qui fait la lecture ». Ce choix conserve le témoignage grec au lieu de l’harmoniser avec l’hébreu parallèle, qui porte « scribe ».
- source_word: ἀντίγραφον
  choice: copie
  rationale: Terme documentaire courant, clair en français moderne.
- source_word: τὸ ὑποκείμενον
  choice: elle est reproduite ci-dessous
  rationale: Littéralement, il s’agit de ce qui est placé ou présenté plus bas. Dans un en-tête documentaire français, « reproduite ci-dessous » en exprime naturellement la fonction.
theological_decisions:
- issue: Rapport entre le titre grec d’Esdras et le texte hébreu parallèle d’Esdras 7.11
  choice: Conserver « lecteur de la Loi du Seigneur » dans le texte principal.
  alternative: « scribe » ou « scribe de la Loi du Seigneur »
  rationale: Le grec de 1 Esdras constitue ici la source principale et porte ἀναγνώστην, « lecteur ». Le parallèle hébreu est signalé en note plutôt que substitué au texte grec, afin de préserver la différence entre les témoins.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour rendre intelligible l’en-tête documentaire difficile, tout en conservant le titre grec distinctif « lecteur » et les deux notes requises.
