base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: fr
  text: afin qu’ils examinent la situation en Judée et à Jérusalem[a], conformément à la loi du Seigneur qu’il possède[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mènent une inspection en Judée et à Jérusalem » ou « enquêtent sur la Judée et Jérusalem »; le verbe grec peut désigner une visite officielle, une inspection ou une enquête.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie littéralement « qu’il possède »; le possesseur n’y est pas explicitement identifié. Le passage parallèle d’Esdras 7 parle de la loi de Dieu « qui est dans ta main », c’est-à-dire confiée à Esdras ou en sa possession.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but et appelle naturellement le subjonctif en français.
- source_word: ἐπισκέψωνται
  choice: qu’ils examinent la situation
  rationale: Le verbe désigne ici une inspection ou une enquête officielle, plutôt qu’une simple visite. L’ajout de « la situation » rend cet emploi transitif naturel en français sans préciser indûment l’objet de l’enquête.
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: en Judée et à Jérusalem
  rationale: Dans ce cadre administratif, κατά avec l’accusatif indique le domaine géographique concerné. Les prépositions françaises distinguent naturellement la région de la ville.
- source_word: ἀκολούθως
  choice: conformément à
  rationale: Exprime l’idée de conformité à une norme et convient à la mention de la loi.
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: à la loi du Seigneur qu’il possède
  rationale: Le grec transmis est comprimé et porte ἔχει, « il possède », à la troisième personne. La traduction conserve cette personne au lieu d’introduire dans le texte principal le « dans ta main » du parallèle d’Esdras 7.
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Dans ce contexte scripturaire juif, κύριος désigne le Dieu d’Israël; « Seigneur » suit l’usage français établi sans ajouter une convention typographique absente du grec.
theological_decisions:
- issue: Identification de κύριος dans un contexte scripturaire juif
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’article français est requis dans la construction « loi du Seigneur »; le rendu demeure conforme au grec sans imposer une graphie confessionnelle particulière.
- issue: Possesseur de la loi
  choice: qu’il possède
  alternative: qui t’a été confiée / qui est en ta possession
  rationale: Le texte grec fourni a la troisième personne ἔχει et ne contient pas l’expression « dans ta main ». Le parallèle d’Esdras 7 éclaire probablement le sens, mais ne doit pas remplacer silencieusement la forme du témoin grec principal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve l’ambiguïté du grec sur le possesseur de la loi et signale en note l’éclairage du parallèle sémitique, sans l’introduire silencieusement dans le texte.
