base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: fr
  text: 'Ceux qui étaient revenus de captivité offrirent des sacrifices au Dieu d’Israël : quatre-vingt-seize béliers, soixante-seize agneaux et douze boucs en offrande de salut[a] ; tous furent offerts en sacrifice au Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en offrande de bien-être », « de délivrance » ou « de communion ». Le grec signifie littéralement « pour le salut » ou « pour la délivrance », dans un contexte sacrificiel.
    reason: Préserver l’étendue de sens de σωτήριον sans imposer une identification cultuelle trop précise.
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: Ceux qui étaient revenus de captivité
  rationale: παραγενόμενοι désigne ceux qui sont arrivés ou revenus, tandis que αἰχμαλωσία évoque directement la captivité. Cette formulation est naturelle en français et conserve l’accent du grec.
- source_word: προσήνεγκαν θυσίας
  choice: offrirent des sacrifices
  rationale: Dans un contexte cultuel, προσφέρω se rend naturellement par « offrir ».
- source_word: τῷ θεῷ τοῦ Ἰσραήλ
  choice: au Dieu d’Israël
  rationale: Rendu direct et idiomatique du destinataire des sacrifices.
- source_word: Κυρίῳ / τῷ κυρίῳ
  choice: au Seigneur
  rationale: κύριος est rendu selon l’usage biblique français courant par « Seigneur ».
- source_word: ἐνενήκοντα ἕξ
  choice: quatre-vingt-seize béliers
  rationale: Le nombre est rendu directement. « Béliers » suit l’inventaire compris par la tradition textuelle consultée, bien que le substantif correspondant ne soit pas clairement représenté dans la chaîne grecque fournie.
- source_word: ἄρνας ἑβδομήκοντα ἕξ
  choice: soixante-seize agneaux
  rationale: ἄρνας désigne ici de jeunes ovins offerts en sacrifice ; « agneaux » est le terme français naturel.
- source_word: τράγους … δέκα δύο
  choice: douze boucs
  rationale: τράγος désigne précisément un bouc, c’est-à-dire un caprin mâle.
- source_word: ὑπὲρ σωτηρίου
  choice: en offrande de salut
  rationale: Le contexte est sacrificiel, mais σωτήριον garde les notions de salut, délivrance et bien-être. « Offrande de salut » conserve mieux cette amplitude que le terme technique plus interprétatif « sacrifice de communion ».
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: tous furent offerts en sacrifice au Seigneur
  rationale: Cette formulation française explicite naturellement que tous les animaux énumérés constituaient un sacrifice destiné au Seigneur.
theological_decisions:
- issue: Sens cultuel de ὑπὲρ σωτηρίου
  choice: en offrande de salut
  alternative: en sacrifice de communion ; pour le bien-être ; pour la délivrance
  rationale: Le contexte impose une lecture sacrificielle, mais le grec ne correspond pas sans ambiguïté à un unique terme technique français. Le texte retient donc une expression proche du grec et signale les autres possibilités en note.
- issue: Identification du destinataire divin
  choice: au Dieu d’Israël … au Seigneur
  alternative: au Seigneur, le Dieu d’Israël
  rationale: La chaîne grecque fournie est difficile à ponctuer autour de Κυρίῳ et du nombre qui suit. La formulation retenue suit la structure globale de l’inventaire et évite de faire de Κυρίῳ un élément impossible de la liste, tout en conservant la désignation finale explicite du Seigneur.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. « Boucs » est plus naturel et précis que « chèvres mâles ». La formulation évite un jargon cultuel inutile tout en maintenant la portée sacrificielle du verset.
