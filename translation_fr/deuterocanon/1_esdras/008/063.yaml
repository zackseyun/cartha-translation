review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le grec nomme explicitement le destinataire initial comme « le Seigneur, Dieu d’Israël » (Κυρίῳ apposé à « Dieu d’Israël »), puis répète « au Seigneur » à la fin. Le projet inverse cette présentation et n’explicite pas la première occurrence de « Seigneur ». La séquence numérique présente par ailleurs une difficulté textuelle : le grec fourni place « quatre-vingt-seize » sans nom animal exprès avant ἄρνας (« agneaux / jeunes béliers »). Le français ne doit pas présenter « béliers » comme si ce terme était attesté sans réserve.'
  naturalness: « Ceux qui étaient revenus de captivité » et le passé simple sont naturels dans un récit biblique français moderne. « En offrande de salut » demeure cependant peu idiomatique et risque de faire de « salut » un type d’offrande défini. « pour le salut » rend directement la préposition et le nom grecs tout en restant intelligible dans le contexte.
  terminology: '« Seigneur » convient pour κύριος, et « Dieu d’Israël » est exact. « Boucs » rend précisément τράγους. « Agneaux » est une possibilité naturelle pour ἄρνας, mais l’absence apparente d’un substantif gouvernant le premier nombre doit être signalée. La note ne devrait pas proposer « offrande/sacrifice de communion » : cette identification technique n’est pas exprimée par σωτήριον et réduit indûment l’ambiguïté.'
  issues:
  - severity: medium
    issue: Ordre et répétition des titres divins
    rationale: Le grec porte τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ, soit naturellement « au Seigneur, Dieu d’Israël », et se termine par τῷ κυρίῳ. Le texte français doit refléter les deux occurrences de « Seigneur ».
  - severity: high
    issue: Premier nombre associé à « béliers » sans appui explicite dans le grec fourni
    rationale: Après Κυρίῳ, le texte grec transmis donne directement ἐνενήκοντα ἕξ, puis ἄρνας ἑβδομήκοντα ἕξ. Il y a vraisemblablement une difficulté ou ellipse textuelle. Insérer « béliers » dans le corps du texte est possible comme restitution éditoriale, mais doit être clairement signalé par une note plutôt que présenté comme une donnée non disputée.
  - severity: medium
    issue: Rendu et note de ὑπὲρ σωτηρίου
    rationale: « en offrande de salut » est moins naturel que « pour le salut » et peut suggérer un terme cultuel fixe. « Communion » n’est pas une alternative lexicale directe de σωτήριον; la note doit conserver « salut », « délivrance » et, selon le contexte, « bien-être ».
  revised_text: 'Ceux qui étaient revenus de captivité offrirent des sacrifices au Seigneur, Dieu d’Israël : quatre-vingt-seize[ a ], soixante-seize agneaux et douze boucs pour le salut[b] ; le tout en sacrifice au Seigneur.'
  revised_footnotes:
  - marker: a
    text: Le grec donne littéralement « quatre-vingt-seize » sans nom d’animal explicite à cet endroit. Plusieurs témoins ou traditions comprennent « béliers » ; la suite mentionne « soixante-seize agneaux ».
    reason: Signaler une difficulté textuelle et éviter de présenter comme certaine une restitution absente de la chaîne grecque fournie.
  - marker: b
    text: Ou « pour la délivrance » ou « pour le bien-être ». Le grec dit littéralement « pour le salut », dans un contexte sacrificiel.
    reason: Préserver l’étendue sémantique de σωτήριον sans imposer une catégorie cultuelle technique.
  revision_rationale: La révision restitue la construction « au Seigneur, Dieu d’Israël » et la répétition finale de « au Seigneur ». Elle rend ὑπὲρ σωτηρίου de façon directe et naturelle, avec une note limitée aux alternatives réellement soutenues par le grec. Elle supprime l’animal non exprimé après « quatre-vingt-seize » du corps du texte et explique en note la difficulté textuelle, préservant ainsi l’ambiguïté du témoin grec principal.
