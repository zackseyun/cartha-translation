base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: fr
  text: mais il nous a fait trouver grâce auprès des rois de Perse, afin de nous donner de quoi vivre, de donner de la splendeur à notre sanctuaire, de relever Sion dévastée et de nous donner un appui solide[a] en Judée et à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assise ferme », « la sécurité » ou « une place forte ».
    reason: 'στερέωμα possède ici plusieurs nuances possibles : stabilité, soutien ferme ou lieu assurant la sécurité.'
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον τῶν βασιλέων Περσῶν
  choice: il nous a accordé la faveur des rois de Perse
  rationale: La tournure grecque signifie que Dieu a placé les siens dans une situation favorable auprès des rois perses. Cette formulation française est naturelle et conserve la relation exprimée par ἐνώπιον.
- source_word: δοῦναι ἡμῖν τροφήν
  choice: afin de nous donner de quoi vivre
  rationale: τροφή désigne la nourriture ou les moyens de subsistance. « De quoi vivre » exprime clairement l'entretien matériel sans limiter le sens à un aliment précis.
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: de rendre sa gloire à notre sanctuaire
  rationale: δοξάζω peut ici exprimer l'action d'honorer ou de rendre splendide, et ἱερόν désigne le sanctuaire. La formulation évite l'expression française potentiellement ambiguë « glorifier notre sanctuaire ».
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: de relever Sion dévastée
  rationale: ἐγείρω garde l'image de relever, tandis que ἔρημος décrit Sion comme dévastée ou désolée. La traduction préserve l'image sans préciser indûment qu'il ne s'agit que de reconstruction matérielle.
- source_word: στερέωμα
  choice: un appui solide
  rationale: Le nom peut désigner ce qui affermit, une base ferme, une stabilité ou une protection. « Un appui solide » conserve à la fois l'image concrète et la notion de sécurité, sans imposer le sens militaire de « forteresse ».
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: en Judée et à Jérusalem
  rationale: La préposition française varie naturellement selon la région et la ville. « Judée » correspond à la forme géographique grecque Ἰουδαία.
theological_decisions:
- issue: Portée de στερέωμα dans le contexte de la restauration
  choice: un appui solide
  alternative: une assise ferme ; la sécurité ; une place forte
  rationale: Le grec laisse ouverte la nuance exacte entre stabilité, soutien et protection. Le texte principal retient une expression large et la note conserve les principales possibilités.
- issue: Rendu de Σειών
  choice: Sion
  alternative: Zion
  rationale: « Sion » est la forme française biblique usuelle du nom propre et n'ajoute aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination répétée du grec est légèrement harmonisée, tout en conservant la série des bienfaits. Le sujet divin demeure exprimé par « il », comme dans le contexte immédiat.
