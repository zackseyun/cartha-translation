  footnotes:
  - marker: a
    text: Le grec conservé pour ce verset ne contient que cette courte expression, littéralement « à vos fils pour toujours ». Le parallèle hébreu fourni appartient à un contexte différent et plus long ; il n’est donc pas utilisé pour reconstituer les mots manquants ici.
