lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: à vos fils
  rationale: Le datif se rend naturellement ici par « à vos fils ». « Fils » conserve le sens masculin pluriel explicite de υἱοῖς sans élargir le fragment à « enfants » en l’absence de contexte qui le justifierait.
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Cette locution exprime une durée indéfinie ou permanente. « Pour toujours » est idiomatique en français moderne et conserve cette portée sans le calque peu naturel « jusqu’à l’âge ».
theological_decisions:
- issue: Fragment grec conservé et divergence majeure avec le parallèle hébreu
  choice: 'Traduire directement le fragment grec conservé : « à vos fils pour toujours »'
  alternative: Reconstituer une phrase plus longue à partir du parallèle massorétique fourni
  rationale: Le grec, témoin principal indiqué, ne conserve ici que τοῖς υἱοῖς ὑμῶν ἕως αἰῶνος. Le parallèle hébreu relève d’un contexte différent et plus long ; il ne permet donc pas de compléter sûrement le grec. La traduction garde honnêtement la forme fragmentaire du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure volontairement fragmentaire afin de refléter exactement l’état du témoin grec.
