base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: fr
  text: 'Des fils d’Astad : Ioanès, fils d’Akatan[a], et avec lui cent dix hommes[b] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Ioanès Akatan ». Le grec juxtapose les deux noms sans exprimer « fils de », mais le contexte de cette liste généalogique favorise une relation patronymique.'
    reason: alternative_reading
  - marker: b
    text: Le texte hébreu parallèle d’Esdras 8.10 présente ici une autre suite de famille et de noms, et indique cent soixante hommes. Comme 1 Esdras est traduit d’après le témoin grec, les noms grecs et le total de cent dix sont conservés dans le texte principal.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ Ἀστάδ
  choice: Des fils d’Astad
  rationale: Dans cette liste, l’expression désigne ceux qui appartiennent à la famille ou au clan d’Astad. « Des fils de » rend naturellement cette valeur partitive en français.
- source_word: Ἰωάνης
  choice: Ioanès
  rationale: Le nom est translittéré d’après la forme grecque, témoin principal, plutôt que remplacé par une forme reconstruite à partir d’un parallèle sémitique différent.
- source_word: Ἀκατάν
  choice: Akatan
  rationale: La forme grecque est conservée comme nom propre. Le contexte généalogique favorise l’ajout explicatif « fils d’ », absent du grec mais probablement sous-entendu.
- source_word: μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Le pronom grec est singulier et renvoie naturellement au responsable qui vient d’être nommé.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec emploie le terme courant pour des hommes, et non un terme imposant la traduction plus biologique « mâles ».
- source_word: ἑκατὸν δέκα
  choice: cent dix
  rationale: Traduction directe du nombre donné par le texte grec.
