base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: fr
  text: Car c’est toi, Seigneur, qui as allégé le poids de nos péchés et qui nous as donné une telle racine. Pourtant, nous sommes de nouveau revenus à violer ta loi en nous mêlant à l’impureté des nations du pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κουφίσας τὰς ἁμαρτίας ἡμῶν
  choice: as allégé le poids de nos péchés
  rationale: κουφίζω signifie rendre plus léger ou soulager. L’ajout idiomatique de « le poids » rend ce sens naturel en français sans préciser indûment comment les péchés ont été allégés.
- source_word: τοιαύτην ῥίζαν
  choice: une telle racine
  rationale: Conserve l’image explicite de ῥίζα plutôt que de l’interpréter comme « reste » ou « descendance ».
- source_word: πάλιν ἀνεκάμψαμεν
  choice: nous sommes revenus
  rationale: ἀνακάμπτω exprime ici un retour à une conduite antérieure; « revenus » préserve cette reprise, tandis que « pourtant » porte le contraste contextuel.
- source_word: παραβῆναι τὸν νόμον σου
  choice: à la transgression de ta loi
  rationale: La tournure nominale permet de conserver l’idée que le retour a pour aboutissement la violation de la loi.
- source_word: ἐπιμιγῆναι τῇ ἀκαθαρσίᾳ
  choice: en nous mêlant à l’impureté
  rationale: Rend directement l’infinitif passif de mélange et son datif, sans réduire l’expression aux seuls mariages mixtes.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: des nations du pays
  rationale: γῆ peut désigner la terre ou le pays; « du pays » convient au contexte des populations locales tout en restant sobre.
theological_decisions:
- issue: Sens métaphorique de « racine »
  choice: Conserver « une telle racine »
  alternative: « un tel reste » ou « une telle descendance »
  rationale: Le grec porte explicitement ῥίζαν. Le traduire littéralement maintient l’image et son ambiguïté théologique au lieu d’en imposer une interprétation.
- issue: Nature de l’allègement des péchés
  choice: « allégé le poids de nos péchés »
  alternative: « pardonné nos péchés » ou « diminué nos fautes »
  rationale: Le texte parle d’allègement, non explicitement de pardon; la traduction évite de résoudre cette nuance.
- issue: Portée de l’impureté des nations
  choice: Formulation générale « en nous mêlant à l’impureté »
  alternative: Expliciter « en contractant des mariages avec les nations »
  rationale: Même si le contexte peut viser les unions, le verset grec formule plus largement le mélange avec l’impureté; cette tension est conservée.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation en deux phrases clarifie le retournement logique. « Seigneur » suit Κύριε; le tutoiement convient à l’adresse directe biblique. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
