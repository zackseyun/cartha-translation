base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: fr
  text: Seigneur d’Israël, tu es vrai, car nous avons été laissés comme une racine jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: Seigneur d’Israël
  rationale: Reproduit directement le vocatif grec et conserve le titre divin sans explicitation supplémentaire.
- source_word: ἀληθινὸς
  choice: fidèle
  rationale: Dans cette adresse à Dieu, l’adjectif peut exprimer la vérité et la fiabilité. « Fidèle » est naturel en français tout en préservant la portée relationnelle du grec.
- source_word: ῥίζα
  choice: racine
  rationale: Conserve l’image grecque précise plutôt que de la remplacer par l’interprétation « reste ».
- source_word: ἐν τῇ σήμερον
  choice: jusqu’à ce jour
  rationale: Rend l’expression temporelle grecque idiomatiquement en français moderne.
theological_decisions:
- issue: Sens de ἀληθινός appliqué à Dieu
  choice: fidèle
  alternative: vrai
  rationale: « Vrai » est plus formellement direct, mais « tu es fidèle » exprime ici de façon naturelle que Dieu se montre véritable et digne de confiance. L’ambiguïté est signalée en note.
- issue: Métaphore de la survivance
  choice: comme une racine
  alternative: comme un reste
  rationale: Le grec porte explicitement ῥίζα, « racine ». La traduction maintient cette métaphore inhabituelle sans la résoudre en catégorie théologique de « reste ».
translation_notes:
  register: Français international actuel, sobre et digne. Le tutoiement suit l’adresse biblique directe à Dieu. La métaphore « racine » est volontairement conservée malgré son caractère inhabituel.
