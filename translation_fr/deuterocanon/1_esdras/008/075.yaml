base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: fr
  text: Et maintenant, pour un bref moment[a], le Seigneur, le Seigneur, nous a accordé sa miséricorde, afin de nous laisser une racine et un nom dans ce lieu saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est inhabituelle et peut aussi se comprendre comme « dans une certaine mesure » ou « pour un peu de temps ».
    reason: Signaler l’ambiguïté réelle de κατὰ πόσον τι sans surcharger le texte principal.
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: pour quelque temps
  rationale: Cette expression difficile indique ici une durée limitée, conformément au contexte, sans la préciser davantage.
- source_word: ἔλεος
  choice: a fait miséricorde
  rationale: La tournure verbale est naturelle en français et conserve la notion de miséricorde reçue du Seigneur.
- source_word: ῥίζαν
  choice: une racine
  rationale: Rendu littéral de l’image grecque, sans la remplacer par « reste » et sans en réduire la portée métaphorique.
- source_word: ὄνομα
  choice: un nom
  rationale: Conserve le terme grec et son association avec « racine », qui évoque la continuité et l’existence reconnue du peuple.
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: dans ce lieu saint
  rationale: Formulation française naturelle qui rend le caractère consacré du lieu exprimé par le génitif ἁγιάσματος.
theological_decisions:
- issue: Répétition de κυρίου Κυρίου
  choice: le Seigneur, le Seigneur
  alternative: le Seigneur Dieu
  rationale: Le grec répète explicitement le même titre; la traduction maintient cette répétition inhabituelle au lieu de l’harmoniser.
- issue: Image de la racine
  choice: une racine
  alternative: un reste
  rationale: Le grec porte ῥίζαν, « racine ». Le conserver évite d’imposer une interprétation théologique particulière de l’image.
translation_notes:
  register: Français moderne, digne et accessible. La répétition solennelle « le Seigneur, le Seigneur » et les images « racine et nom » sont volontairement conservées.
