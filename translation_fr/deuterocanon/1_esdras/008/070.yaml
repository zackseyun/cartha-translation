  terminology: « Tenue sacrée » rend correctement τὴν ἱερὰν ἐσθῆτα sans imposer « sacerdotale ». « Seigneur » convient pour κύριον dans ce contexte de prière. « Au terme du jeûne » rend naturellement ἐκ τῆς νηστείας sans suggérer un repas ou ajouter une qualification institutionnelle.
