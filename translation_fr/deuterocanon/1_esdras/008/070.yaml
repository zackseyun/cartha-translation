  source_fidelity: La première personne est bien motivée par la forme ambiguë ἔλεγον et par le contexte immédiat de la prière d’Esdras. Toutefois, le grec est à l’imparfait (« je disais » dans cette lecture), et non au passé simple. La formulation révisée conserve aussi plus clairement l’état des vêtements déchirés.
