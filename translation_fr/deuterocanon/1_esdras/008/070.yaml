base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: fr
  text: 'Au terme du jeûne, je me relevai, avec mes vêtements et ma tenue sacrée[a] déchirés ; je pliai les genoux, tendis mes mains vers le Seigneur et disais[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vêtement sacré ». Le grec ne dit pas explicitement « la tenue sacerdotale ».
    reason: lexical_alternative
  - marker: b
    text: La forme grecque peut aussi se lire « ils disaient ». Dans le contexte, elle est vraisemblablement comprise comme « je disais ».
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: Après m’être relevé du jeûne
  rationale: Le participe aoriste marque le passage du jeûne à la prière. Cette formulation française conserve la succession des actions sans suggérer qu’Esdras se serait simplement levé de table.
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: les vêtements … déchirés
  rationale: La tournure rend l’état résultant exprimé par le participe parfait et garde à ἱμάτια son sens général de vêtements.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: la tenue sacrée
  rationale: ἱερά qualifie explicitement le vêtement de sacré, tandis que ἐσθής désigne une tenue ou un vêtement. « Tenue sacrée » est naturel et n’ajoute pas la précision interprétative « sacerdotale ».
- source_word: κάμψας τὰ γόνατα
  choice: je pliai les genoux
  rationale: Traduction proche de l’image grecque et idiomatique dans ce contexte de prière.
- source_word: ἐκτείνας τὰς χεῖρας
  choice: tendis les mains
  rationale: Rend directement le geste traditionnel de prière décrit par le grec.
- source_word: πρὸς τὸν κύριον
  choice: vers le Seigneur
  rationale: « Vers » conserve l’orientation physique du geste exprimée par πρός; « Seigneur » est le titre divin naturel dans ce contexte.
- source_word: ἔλεγον
  choice: je dis
  rationale: La forme peut être la première personne du singulier ou la troisième personne du pluriel. Les participes masculins singuliers et la prière autobiographique qui suit favorisent ici la première personne; le présent historique français serait moins adapté, et le passé simple introduit naturellement la citation.
theological_decisions:
- issue: Faut-il qualifier la tenue de sacerdotale ?
  choice: la tenue sacrée
  alternative: la tenue sacerdotale
  rationale: Le grec dit qu’elle est sacrée, sans préciser expressément sa fonction sacerdotale. La traduction évite donc d’ajouter une détermination institutionnelle.
- issue: Traduction du titre κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans cette prière adressée à Dieu, « le Seigneur » rend le titre divin sans le réduire au sens social de maître.
translation_notes:
  register: Français international actuel, digne et lisible. Le passage est rendu à la première personne, conformément à la valeur contextuellement la plus probable de ἔλεγον. Les marqueurs [a] et [b] sont placés précisément sur les deux éléments qu’ils expliquent.
