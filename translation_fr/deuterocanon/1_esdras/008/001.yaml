base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: fr
  text: Après ces événements, sous le règne d’Artaxerxès, roi des Perses[a], Esdras, fils d’Azarias, fils de Zacharie, fils de Chelkias[b], fils de Saloum, monta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « roi des Perses » ; le passage parallèle d’Esdras 7.1 en hébreu porte « roi de Perse ». Le texte suit ici le grec de 1 Esdras.
    reason: alternative_reading
  - marker: b
    text: La forme grecque « Chelkias » correspond au nom rendu plus couramment « Hilkias » d’après l’hébreu parallèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: Après ces événements
  rationale: La tournure grecque est condensée et introduit une transition chronologique. Cette formulation française naturelle en restitue la fonction narrative, avec l’appui du parallèle hébreu « après ces événements ».
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: sous le règne d’Artaxerxès
  rationale: Le génitif absolu fixe le cadre temporel. « Sous le règne de » est une expression française idiomatique et fidèle.
- source_word: τοῦ βασιλέως Περσῶν
  choice: roi des Perses
  rationale: Le grec emploie explicitement le pluriel « des Perses ». La traduction suit ce témoin principal plutôt que d’harmoniser avec l’hébreu parallèle, qui porte « roi de Perse ».
- source_word: προσέβη
  choice: monta
  rationale: Le verbe exprime une montée, probablement vers Jérusalem dans ce contexte, mais la destination n’est pas formulée dans ce verset. « Monta » conserve cette orientation sans l’expliciter.
- source_word: Ἔσρας
  choice: Esdras
  rationale: Forme française biblique usuelle du nom.
- source_word: Ἀζαραίου
  choice: Azarias
  rationale: Forme française biblique courante correspondant au nom grec et à l’hébreu parallèle.
- source_word: Ζεχρίου
  choice: Zacharie
  rationale: Forme française usuelle de ce nom biblique.
- source_word: Χελκείου
  choice: Chelkias
  rationale: Transcription française proche de la forme grecque, retenue puisque le grec est le texte source principal. Le parallèle hébreu donne la forme habituellement rendue « Hilkias ».
- source_word: Σαλήμου
  choice: Saloum
  rationale: Forme française biblique correspondant vraisemblablement au nom hébreu Shallum dans la tradition généalogique parallèle.
