base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: fr
  text: des descendants de Pahath-Moab, Élialonias, fils de Zaraïou[a], et avec lui deux cents hommes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Élialonias, fils de Zaraïou » ; le parallèle hébreu d’Esdras 8.4 porte « Elihoénaï, fils de Zerahia ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: des descendants de Pahath-Moab
  rationale: Le grec désigne le groupe familial Μααθμωάβ. Le parallèle hébreu, « fils de Pahath-Moab », confirme qu’il s’agit d’un clan. « Descendants » exprime naturellement cette filiation collective en français moderne.
- source_word: Ἐλιαλωνίας
  choice: Éliaonias
  rationale: Translittération française fondée sur le témoin grec principal, sans la remplacer par la forme du parallèle hébreu.
- source_word: Ζαραιου
  choice: Zaréou
  rationale: Translittération française de la forme grecque, qui demeure prioritaire par rapport au nom correspondant dans le texte massorétique.
- source_word: καὶ μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Rendu direct qui conserve la structure coordonnée de la liste.
- source_word: ἄνδρες διακόσιοι
  choice: deux cents hommes
  rationale: ἄνδρες signifie naturellement « hommes » dans ce contexte de recensement; le nombre suit l’usage français.
