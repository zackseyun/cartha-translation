base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: fr
  text: ne prenez pas leurs filles en mariage pour vos fils et ne cherchez jamais à vivre en paix avec eux[a], afin que, devenus forts, vous mangiez les bonnes choses du pays et que vous en héritiez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension, à la lumière du parallèle hébreu : « ne recherchez jamais leur paix ni leur prospérité ».'
    reason: L’expression grecque est condensée ; le parallèle hébreu d’Esdras 9.12 permet aussi de comprendre la paix au sens plus large de bien-être ou de prospérité.
lexical_decisions:
- source_word: λάβητε
  choice: prenez … en mariage
  rationale: Le verbe signifie littéralement « prendre » ; dans ce contexte, l’ajout « en mariage » explicite naturellement en français la relation matrimoniale déjà impliquée par « leurs filles » et « vos fils ».
- source_word: ζητήσετε εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: cherchez … à vivre en paix avec eux
  rationale: Cette formulation conserve le verbe « chercher » et rend en français courant l’expression grecque condensée concernant les rapports pacifiques avec eux.
- source_word: τὸν ἅπαντα χρόνον
  choice: jamais
  rationale: Littéralement « pendant tout le temps » ; sous la portée de la négation, « jamais » exprime naturellement une interdiction valable en tout temps.
- source_word: ἵνα ἰσχύσαντες
  choice: afin que, devenus forts
  rationale: « Afin que » garde la valeur finale de ἵνα, tandis que « devenus forts » respecte la forme participiale et la progression de l’énoncé.
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: vous mangiez les bonnes choses du pays
  rationale: Traduction proche du grec qui conserve l’image concrète de manger les biens produits par le pays, sans la réduire à la seule prospérité.
- source_word: κατακληρονομήσητε
  choice: vous en héritiez
  rationale: Le verbe appartient au vocabulaire de l’héritage. Le pronom « en » reprend naturellement « le pays », objet implicite en grec.
theological_decisions:
- issue: Sens de l’expression grecque condensée sur la paix et rapport avec le parallèle hébreu d’Esdras 9.12
  choice: Traduire directement le grec par « vivre en paix avec eux » et signaler en note la compréhension « rechercher leur paix ou leur prospérité ».
  alternative: Intégrer dans le texte principal « ne recherchez jamais leur paix ni leur prospérité ».
  rationale: Le grec est le témoin principal de 1 Esdras et parle directement de vivre en paix avec eux. Le parallèle hébreu connu éclaire toutefois l’expression comme pouvant viser leur bien-être ou leur prospérité ; la note préserve cette nuance sans l’imposer au texte grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque, tout en explicitant le contexte matrimonial et en rendant idiomatiquement l’interdiction temporelle par « jamais ».
