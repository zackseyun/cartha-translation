base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: fr
  text: Avec eux se trouvaient dix hommes parmi leurs frères. Je disposai devant eux[a] l’argent, l’or et les objets sacrés de la maison de notre Seigneur, dont le roi, ses conseillers, les hauts dignitaires et tout Israël avaient fait don.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « Je plaçai/disposai devant eux ». Le parallèle hébreu approximatif lit : « Je leur pesai », ce qui convient au contexte de biens précieux confiés.'
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: Et avec eux, dix hommes choisis parmi leurs frères
  rationale: La phrase grecque est abrupte et dépend du contexte précédent. « Choisis » explicite sobrement la valeur partitive de ἐκ (« parmi ») et produit une phrase française compréhensible, tout en conservant « dix hommes ».
- source_word: ἔστησα αὐτοῖς
  choice: Je pesai pour eux
  rationale: Le grec transmis signifie littéralement « je plaçai/présentai devant eux », mais le parallèle hébreu porte « je pesai entre leurs mains » et le contexte concerne des métaux précieux et des objets confiés. Le texte principal retient donc l’action de peser, avec une note signalant l’écart.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: l’argent, l’or
  rationale: Il s’agit ici des matières précieuses, non de monnaie au sens général.
- source_word: τὰ ἱερὰ σκεύη
  choice: les objets sacrés
  rationale: σκεύη désigne les objets ou ustensiles du sanctuaire. « Objets sacrés » est naturel en français moderne et garde la portée cultuelle de ἱερά.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: de la maison de notre Seigneur
  rationale: Rend directement le grec, qui porte « notre Seigneur ». « Maison » conserve le langage traditionnel désignant le temple.
- source_word: οὕτως ἐδωρήσατο
  choice: avaient offerts
  rationale: Le verbe exprime un don. Le plus-que-parfait marque que ces biens avaient été donnés avant leur remise aux responsables; le pluriel s’accorde naturellement avec les donateurs énumérés.
- source_word: οἱ σύμβουλοι αὐτοῦ καὶ οἱ μεγιστᾶνες
  choice: ses conseillers, les hauts dignitaires
  rationale: σύμβουλοι désigne les conseillers royaux; μεγιστᾶνες, des personnages de très haut rang. « Hauts dignitaires » est actuel et précis.
theological_decisions:
- issue: Traduction de κύριος dans l’expression concernant le temple
  choice: notre Seigneur
  alternative: le Seigneur / notre Maître
  rationale: Le grec lit κυρίου ἡμῶν, sans occurrence directe du tétragramme hébreu dans ce verset. « Notre Seigneur » conserve donc la forme et la relation exprimées par le texte grec.
- issue: Écart entre ἔστησα dans le grec et le verbe « peser » du parallèle hébreu
  choice: Je pesai pour eux
  alternative: Je plaçai devant eux / Je leur confiai
  rationale: Le témoin grec demeure l’ancrage principal, mais sa formulation est difficile dans ce contexte. Le parallèle hébreu et la nature des biens rendent très probable une pesée officielle avant leur remise. La variante littérale grecque est conservée en note plutôt que dissimulée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe abrupte du début est légèrement explicitée sans identifier davantage les « frères ». Le vocabulaire du temple reste concret et non confessionnel.
