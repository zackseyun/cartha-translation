    issue: « choisis parmi leurs frères »
    rationale: Le grec dit seulement « parmi/d’entre leurs frères » (ἐκ τῶν ἀδελφῶν αὐτῶν) ; « choisis » introduit une sélection absente du texte.
  - severity: medium
    issue: « Je pesai pour eux » dans le texte principal
    rationale: Le grec transmis porte ἔστησα, « je plaçai/disposai », tandis que la pesée provient du parallèle hébreu approximatif. De plus, « pesai pour eux » est moins idiomatique en français et peut signifier « en leur faveur ».
