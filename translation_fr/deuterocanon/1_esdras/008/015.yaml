base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/015.yaml
  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: fr
  text: afin d’offrir des sacrifices sur l’autel de leur Seigneur[a], celui qui se trouve à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le passage parallèle araméen, le contexte parle de « la maison de leur Dieu qui est à Jérusalem », ce qui confirme que le référent est le Dieu d’Israël. Ici, le grec dit précisément : « l’autel de leur Seigneur, celui qui se trouve à Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: afin de
  rationale: Introduit ici le but visé; « afin de » est naturel en français et n’impose pas une lecture purement consécutive.
- source_word: προσενεγκεῖν
  choice: offrir
  rationale: Dans ce contexte cultuel, le verbe désigne la présentation de sacrifices; « offrir » exprime clairement l’acte sacrificiel en français.
- source_word: θυσίας
  choice: des sacrifices
  rationale: Terme cultuel direct et usuel devant la mention de l’autel.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sur l’autel
  rationale: Rend naturellement le mouvement ou l’application sur l’autel impliqué par ἐπί avec l’accusatif.
- source_word: τοῦ κυρίου αὐτῶν
  choice: de leur Seigneur
  rationale: Conserve exactement le titre κύριος et le possessif du grec, sans ajouter « Dieu » à partir du parallèle massorétique.
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: celui qui se trouve à Jérusalem
  rationale: Le groupe articulé précise de quel autel il s’agit; cette formulation française rend clairement la valeur restrictive.
theological_decisions:
- issue: Traduction de κύριος dans un contexte cultuel de la LXX
  choice: Seigneur
  alternative: maître
  rationale: Le contexte de l’autel à Jérusalem indique un titre révérenciel désignant le Dieu d’Israël, non un supérieur humain.
- issue: Écart entre le grec et le parallèle massorétique
  choice: Conserver dans le texte « leur Seigneur », selon le grec
  alternative: leur Dieu
  rationale: Le grec est la source primaire et porte explicitement « leur Seigneur ». Le parallèle araméen éclaire le référent, mais ne justifie pas de remplacer la formulation grecque; l’écart est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. « Offrir des sacrifices sur l’autel » est plus idiomatique que le calque « apporter des sacrifices sur l’autel », tout en conservant le sens cultuel du grec.
