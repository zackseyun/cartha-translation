base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: fr
  text: 'Les chefs, les prêtres et les lévites ne se sont pas séparés des peuples étrangers du pays et de leurs impuretés[a] : les Cananéens, les Hittites, les Phérézites, les Jébusites, les Moabites, les Égyptiens et les Édomites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne se sont pas tenus séparés des peuples étrangers du pays dans leurs impuretés ». La formulation grecque est condensée et le rapport exact entre les peuples et leurs impuretés demeure syntaxiquement ambigu.'
    reason: Préserver l’ambiguïté syntaxique du grec et signaler une formulation plus proche de sa compression.
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: ne se sont pas séparés
  rationale: Le verbe exprime ici le fait de ne pas s’être tenu à l’écart; la tournure pronominale française rend naturellement le sens réfléchi requis par le contexte.
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: Le terme désigne les personnes qui exercent l’autorité. « Chefs » est courant, digne et suffisamment large dans ce contexte.
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: les prêtres et les lévites
  rationale: Ce sont les équivalents français établis de ces deux groupes cultuels.
- source_word: ἀλλογενῆ ἔθνη τῆς γῆς
  choice: les peuples étrangers du pays
  rationale: « Peuples étrangers » exprime l’altérité ethnique sans introduire les connotations modernes de « race »; γῆ désigne ici le pays.
- source_word: ἀκαθαρσίας αὐτῶν
  choice: leurs pratiques impures
  rationale: La syntaxe grecque est comprimée. Cette formulation rend intelligible le rapport entre les peuples et leur impureté tout en conservant la portée cultuelle et morale du terme.
- source_word: Χαναναίων καὶ Χετταίων καὶ Φερεζαίων καὶ Ἰεβουσαίων καὶ Μωαβειτῶν καὶ Αἰγυπτίων καὶ Ἰδουμαίων
  choice: les Cananéens, les Hittites, les Phérézites, les Jébusites, les Moabites, les Égyptiens et les Édomites
  rationale: La liste est apposée aux peuples étrangers. Les formes retenues sont les ethnonymes bibliques français usuels; Ἰδουμαῖοι correspond ici aux Édomites.
theological_decisions:
- issue: Nature de l’impureté
  choice: pratiques impures
  alternative: impureté / souillures
  rationale: Cette expression maintient le registre cultuel et moral de ἀκαθαρσία sans renforcer le texte jusqu’à « abominations » ni suggérer que l’origine ethnique serait elle-même l’impureté.
- issue: Rapport syntaxique entre séparation, peuples et impureté
  choice: ne se sont pas séparés des peuples… ni de leurs pratiques impures
  alternative: ne se sont pas tenus séparés des peuples étrangers du pays dans leurs impuretés
  rationale: Le grec transmis est elliptique et ambigu. Le texte principal propose une lecture française naturelle, tandis que la note conserve une formulation plus proche de sa compression.
translation_notes:
  register: Français international moderne, clair et digne. La répétition grecque de καί dans l’énumération est rendue selon l’usage français, avec des virgules et un dernier « et ». Le deux-points marque l’apposition de la liste des peuples.
