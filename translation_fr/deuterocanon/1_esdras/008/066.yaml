    issue: « leurs pratiques impures » ajoute « pratiques ».
    rationale: ἀκαθαρσίας désigne des impuretés/souillures. Le contexte peut suggérer des conduites ou réalités souillantes, mais le substantif grec ne spécifie pas « pratiques »; cette explicitation réduit l'ambiguïté du témoin grec.
  - severity: low
    issue: La note présente une alternative qui conserve « impuretés », tandis que le texte principal les transforme en « pratiques impures ».
    rationale: Employer « impuretés » dans le texte harmonise le rendu avec l'alternative signalée et avec le lexique source, tout en restant naturel.
