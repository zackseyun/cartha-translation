base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: fr
  text: Car j’ai eu honte de demander des cavaliers et des fantassins comme escorte, pour assurer notre sécurité face à ceux qui nous étaient hostiles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la cavalerie et de l’infanterie comme escorte pour assurer notre sécurité face à nos adversaires ».'
    reason: Signale les équivalents militaires collectifs et plus techniques de « cavaliers et fantassins » ; « nos adversaires » est une autre formulation naturelle de « ceux qui nous étaient hostiles ».
lexical_decisions:
- source_word: ἐνετράπην
  choice: j’avais honte
  rationale: Le verbe exprime ici la honte ou la gêne qui retenait le locuteur de présenter cette demande; cette formulation est naturelle et digne en français.
- source_word: αἰτῆσαι
  choice: de demander
  rationale: L’infinitif désigne l’action de solliciter des troupes; le complément direct est naturel en français.
- source_word: ἵππεις
  choice: des cavaliers
  rationale: Le terme désigne des combattants montés; « cavaliers » conserve le contraste militaire avec les soldats à pied sans technicité excessive.
- source_word: πεζοὺς
  choice: des soldats à pied
  rationale: Le mot désigne des combattants non montés. Cette expression est claire pour un lectorat moderne et reste proche du grec.
- source_word: προπομπὴν
  choice: pour nous escorter
  rationale: Le nom évoque une escorte accompagnant ou précédant les voyageurs; la tournure verbale rend naturellement sa fonction en français.
- source_word: ἕνεκεν ἀσφαλείας
  choice: et nous protéger
  rationale: La locution exprime le but sécuritaire de l’escorte. La coordination française évite la lourdeur de « une escorte en vue de la sécurité ».
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: contre ceux qui nous étaient hostiles
  rationale: Cette traduction respecte la formulation adjectivale du grec sans transformer nécessairement ces opposants en ennemis officiellement constitués.
theological_decisions:
- issue: Rapport avec le parallèle massorétique fourni, dont le contenu ne correspond pas à cette phrase grecque
  choice: Traduire directement la déclaration grecque concernant l’escorte militaire.
  alternative: Harmoniser avec le texte hébreu fourni en introduisant le jeûne et la prière ou en supprimant la mention de l’escorte.
  rationale: Pour 1 Esdras, le grec de la LXX est le témoin principal indiqué. Le parallèle hébreu fourni correspond à un autre contenu et ne doit donc pas remplacer ni corriger cette phrase.
translation_notes:
  register: Français international moderne, accessible et digne. « Soldats à pied » est préféré dans le texte à « infanterie », plus technique; la note conserve cette possibilité. L’imparfait plus-que-parfait « j’avais honte » situe naturellement le sentiment au moment de la demande envisagée.
