review_pass:
  verdict: revise
  source_fidelity: 'Le grec dit littéralement : « Car j’eus honte de demander des cavaliers et des fantassins comme escorte, pour la sécurité [face] à ceux qui nous étaient opposés/hostiles. » Le projet traduit correctement les éléments militaires et l’hostilité, mais « j’avais honte » (imparfait) atténue l’aoriste ἐνετράπην, qui présente la réaction comme ponctuelle dans le récit. « J’ai eu honte » rend ce point sans recourir au passé simple.'
  naturalness: « Cavaliers et fantassins » est une association militaire idiomatique, claire et internationalement lisible. « Comme escorte, pour assurer notre sécurité » conserve plus directement la structure et le but exprimés par προπομπὴν ἕνεκεν ἀσφαλείας que la reformulation verbale « pour nous escorter et nous protéger ».
  terminology: « Cavaliers », « fantassins », « escorte », « sécurité » et « ceux qui nous étaient hostiles » sont fidèles au grec et d’un registre narratif sobre. La note garde légitimement les termes collectifs plus techniques « cavalerie » et « infanterie » comme possibilités lexicales.
