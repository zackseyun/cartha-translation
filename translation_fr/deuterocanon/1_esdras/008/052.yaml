  - severity: low
    issue: Reformulation de la fonction de l’escorte
    rationale: « Pour nous escorter et nous protéger » est intelligible, mais transforme le nom grec « comme escorte, pour la sécurité » en deux actions. Une formulation nominale conserve mieux la relation syntaxique sans alourdir le français.
