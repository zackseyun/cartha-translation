  text: And concerning your holy vessels that are being given for the use of the house of your God in Jerusalem,[a]
translation:
  language: fr
  text: Et quant à tes objets sacrés, qui sont remis pour l’usage du temple de ton Dieu à Jérusalem…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ κατὰ
  choice: Et quant à
  rationale: Dans ce contexte administratif, κατὰ avec l’accusatif introduit le sujet dont il est question. « Quant à » restitue naturellement la construction elliptique, tandis que « Et » maintient le lien avec le contexte précédent.
- source_word: τὰ ἱερὰ σκεύη σου
  choice: tes objets sacrés
  rationale: σκεύη peut désigner divers objets, ustensiles ou récipients. « Objets » évite de limiter indûment la forme de ces biens, et « sacrés » rend leur caractère consacré.
- source_word: τὰ διδόμενα
  choice: qui sont remis
  rationale: Le participe présent passif indique que ces objets sont donnés ou transmis. « Sont remis » convient au registre administratif sans ajouter l’idée d’un don volontaire.
- source_word: εἰς τὴν χρείαν
  choice: pour l’usage
  rationale: χρεία exprime ici l’emploi ou la fonction pratique de ces objets dans le culte.
- source_word: τοῦ ἱεροῦ
  choice: du temple
  rationale: Le grec ἱερόν désigne directement le temple ou son enceinte sacrée. « Temple » suit donc le témoin grec principal sans substituer l’idiome sémitique « maison ».
- source_word: τοῦ θεοῦ σου τοῦ ἐν Ἰερουσαλήμ
  choice: de ton Dieu à Jérusalem
  rationale: Cette formulation française rattache naturellement la localisation au temple, référent concret implicite de l’expression grecque, tout en conservant l’adresse personnelle « ton Dieu ».
