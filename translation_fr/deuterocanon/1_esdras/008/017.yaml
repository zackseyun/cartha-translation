translation_notes:
  register: Français moderne, digne et accessible. Le verset présente une syntaxe elliptique qui dépend de la phrase précédente; les points de suspension signalent cette continuité sans inventer de proposition principale. « Objets sacrés » est plus large et plus naturel que « vases sacrés » en français courant.
