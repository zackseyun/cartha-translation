base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: fr
  text: 'Et parmi les serviteurs du temple que David et les dirigeants avaient affectés au service des lévites : deux cent vingt serviteurs du temple[a]. Tous furent inscrits nominativement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Néthinim », terme technique d’origine hébraïque désignant les serviteurs du temple. Le grec emploie ἱερόδουλοι, « serviteurs du sanctuaire », tandis que le texte hébreu parallèle porte נְתִינִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: serviteurs du temple
  rationale: Le grec désigne des personnes attachées au service d’un lieu sacré. « Serviteurs du temple » exprime clairement leur fonction sans imposer l’idée d’esclavage que pourrait suggérer une traduction trop littérale, et correspond au terme technique hébreu נְתִינִים du texte parallèle.
- source_word: ἔδωκεν
  choice: avaient affectés
  rationale: Le sens premier est « donner », mais, dans ce contexte administratif, il s’agit de personnes affectées au service des lévites. Le plus-que-parfait rend naturelle la relation antérieure entre cette affectation et leur présence dans le groupe.
- source_word: οἱ ἡγούμενοι
  choice: les dirigeants
  rationale: Le terme désigne les responsables qui exercent une autorité aux côtés de David. « Dirigeants » reste général et naturel, sans préciser indûment leur titre.
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: au service des lévites
  rationale: ἐργασία peut désigner le travail ou le service. Ici, « service » convient au cadre cultuel et administratif tout en indiquant que ces personnes assistaient les lévites.
- source_word: διακόσιοι εἴκοσι
  choice: deux cent vingt
  rationale: Traduction directe du nombre grec, selon l’usage français contemporain.
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: Tous furent inscrits nominativement
  rationale: La tournure grecque évoque l’établissement d’un relevé écrit par noms. Cette formulation française restitue le caractère officiel de l’enregistrement sans calquer lourdement la syntaxe grecque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « serviteurs du temple » est conservée parce qu’elle structure également le grec, mais la ponctuation française place le nombre directement après la proposition d’affectation. « Inscrits nominativement » rend avec concision le registre administratif de la phrase finale.
