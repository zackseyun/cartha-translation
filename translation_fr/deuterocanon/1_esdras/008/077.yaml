base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/077.yaml
  text: from our Lord,[a]
translation:
  language: fr
  text: de la part de notre Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni pour ce verset se limite au fragment « ὑπὸ τοῦ κυρίου ἡμῶν » (« de la part de notre Seigneur »). Le texte hébreu parallèle fourni ne correspond pas directement à cette expression; aucune phrase plus complète n’est donc reconstituée ici.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπό
  choice: de la part de
  rationale: Avec le génitif, ὑπό peut exprimer l’agent ou la provenance. Dans ce fragment isolé, « de la part de » rend naturellement cette relation sans imposer une construction passive absente du texte fourni.
- source_word: τοῦ κυρίου
  choice: notre Seigneur
  rationale: κύριος est rendu par « Seigneur », terme courant et digne dans ce contexte probablement religieux; le possessif ἡμῶν est intégré à l’expression.
- source_word: ἡμῶν
  choice: notre
  rationale: Le pronom de première personne du pluriel est conservé explicitement sous la forme du déterminant possessif français.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » est la traduction française habituelle de κύριος dans un contexte religieux. Le fragment ne fournit aucun motif décisif pour préférer « maître ».
- issue: Traitement du décalage textuel et du témoin grec fragmentaire
  choice: Traduire uniquement le fragment grec fourni
  alternative: Reconstituer une phrase complète à partir du parallèle hébreu
  rationale: Le grec, qui constitue ici la source principale, ne contient que ὑπὸ τοῦ κυρίου ἡμῶν. Le parallèle hébreu ne correspond pas directement à cette expression; compléter le verset introduirait donc un contenu non attesté par le texte grec fourni.
translation_notes:
  register: Français international moderne, sobre et digne. « De la part de » convient à un fragment autonome et préserve l’indétermination entre provenance et agentivité.
