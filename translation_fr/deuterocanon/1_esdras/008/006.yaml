revisions:
- from: La septième année du règne d’Artaxerxès, au cinquième mois, ils arrivèrent à Jérusalem.[a] En effet, ils étaient partis de Babylone à la nouvelle lune du premier mois[b] et parvinrent à Jérusalem grâce au bon déroulement du voyage que le Seigneur leur avait accordé, sa faveur reposant sur lui.[c]
  to: La septième année du règne d’Artaxerxès, au cinquième mois, après le départ de Babylone à la nouvelle lune du premier mois[b], ils arrivèrent à Jérusalem selon l’heureux voyage que le Seigneur leur avait accordé, sur lui.[c]
  rationale: 'La révision suit d’abord le grec : elle ne conserve qu’une arrivée, traduit la chronologie du départ sans imposer un sujet pluriel au participe singulier, et laisse l’expression finale elliptique dans le texte principal. La note a est conservée comme signalement nécessaire de la clause grecque omise. Les notes b et c rendent compte, respectivement, de la discordance singulier/pluriel et de l’ambiguïté de ἐπʼ αὐτῷ.'
  reviewer_model: gpt-5.6-terra
