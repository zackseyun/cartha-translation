base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: fr
  text: La septième année du règne d’Artaxerxès, au cinquième mois, après le départ de Babylone à la nouvelle lune du premier mois[b], ils arrivèrent à Jérusalem selon l’heureux voyage que le Seigneur leur avait accordé, sur lui.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Le grec emploie pour « après le départ » un participe au singulier, alors que le verbe « ils arrivèrent » est au pluriel. Le passage hébreu parallèle parle d’Esdras au singulier et date son départ du « premier jour du premier mois » (Esdras 7.9). Le grec dit « à la nouvelle lune ».
    reason: alternative_reading
  - marker: c
    text: Le grec dit littéralement « sur lui ». L’expression est elliptique et son antécédent masculin singulier demeure difficile après les pluriels précédents. Elle paraît évoquer l’action favorable du Seigneur envers Esdras ; le parallèle hébreu précise que « la main du SEIGNEUR, son Dieu, était sur lui » (Esdras 7.6, 9).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου
  choice: La septième année du règne d’Artaxerxès
  rationale: La tournure temporelle grecque est rendue par la formule française naturelle de datation royale, sans modifier le nom propre transmis.
- source_word: ἐν τῷ πέμπτῳ μηνί
  choice: au cinquième mois
  rationale: Rendu direct et idiomatique de l’indication temporelle.
- source_word: ἐξελθόντος γὰρ ἐκ Βαβυλῶνος
  choice: En effet, ils étaient partis de Babylone
  rationale: Le participe marque une action antérieure à l’arrivée et γάρ introduit l’explication. Le pluriel est retenu d’après les formes grecques voisines, malgré le singulier du parallèle hébreu.
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: à la nouvelle lune du premier mois
  rationale: νουμηνία désigne proprement la nouvelle lune; cette précision grecque est conservée plutôt que remplacée par «le premier jour» du parallèle hébreu.
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: ils arrivèrent à Jérusalem / parvinrent à Jérusalem
  rationale: Le verbe grec est au pluriel et exprime l’arrivée effective. La variation française évite une répétition pesante lorsque l’arrivée est explicitée dès la proposition de datation.
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  choice: grâce au bon déroulement du voyage que le Seigneur leur avait accordé
  rationale: εὐοδία évoque ici la réussite ou l’heureuse marche d’un voyage. Cette formulation française en garde le sens concret sans suggérer une prospérité matérielle.
- source_word: παρὰ τοῦ κυρίου
  choice: que le Seigneur leur avait accordé
  rationale: παρά avec le génitif indique la source; dans cette construction, «accordé par le Seigneur» est naturel en français.
- source_word: ἐπʼ αὐτῷ
  choice: sa faveur reposant sur lui
  rationale: La formule grecque signifie littéralement «sur lui» mais reste elliptique. Le rendu indique prudemment la faveur divine suggérée par le contexte, tandis que la note conserve la forme littérale et signale l’ambiguïté.
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: non représenté dans le corps du texte; conservé en note
  rationale: La proposition transmise, «cette année était la deuxième pour le roi», s’accorde mal avec la septième année qui vient d’être mentionnée et manque dans le parallèle hébreu. Elle est signalée plutôt que corrigée conjecturalement.
theological_decisions:
- issue: Traduction de κύριος dans un récit grec ayant un parallèle hébreu où figure YHWH
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte source grec porte κύριος. «Le Seigneur» traduit ce témoin directement, sans substituer dans le corps du texte la forme propre au parallèle hébreu.
- issue: Sens de ἐπʼ αὐτῷ et action favorable de Dieu
  choice: sa faveur reposant sur lui
  alternative: littéralement «sur lui»; ou «sa main était sur lui» d’après le parallèle hébreu
  rationale: Le grec est elliptique et son antécédent masculin singulier demeure difficile après des pronoms pluriels. Le texte principal exprime le sens contextuel probable sans introduire explicitement «la main», mot absent du grec; la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du récit rendent clairement l’antériorité du départ. «Bon déroulement du voyage» reste accessible et concret. La ponctuation sépare la datation de l’explication causale, tandis que les notes rendent visibles la difficulté textuelle, l’alternance singulier/pluriel et l’ellipse théologique.
