    issue: Double mention de l’arrivée à Jérusalem
    rationale: Le brouillon dit d’abord « ils arrivèrent à Jérusalem », puis « parvinrent à Jérusalem ». Dans le grec transmis, παρεγένοντο est l’unique verbe d’arrivée ; l’autre élément problématique entre les deux est une clause textuellement difficile, non un premier récit d’arrivée.
  - severity: medium
    issue: Le texte principal résout l’ellipse « sur lui » par « sa faveur reposant sur lui »
    rationale: ἐπʼ αὐτῷ signifie littéralement « sur lui », sans nommer la faveur. Celle-ci est une explication contextuelle plausible, mais doit demeurer en note afin de préserver l’ellipse et son antécédent difficile.
