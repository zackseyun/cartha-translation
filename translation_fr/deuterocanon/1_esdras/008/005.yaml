base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
translation:
  language: fr
  text: Et des fils d’Israël[a], des prêtres, des lévites, des chantres du Temple, des gardiens des portes et des serviteurs du Temple[b] montèrent ensemble à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». Le grec dit plus littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des esclaves du Temple ». Le terme grec peut désigner des personnes liées au service sacré par un statut servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανέβησαν
  choice: montèrent ensemble
  rationale: Le verbe composé exprime à la fois la montée vers Jérusalem et un déplacement effectué ensemble; cette formulation française conserve ces deux éléments sans lourdeur.
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Le partitif « des » rend l’idée de personnes issues de ce groupe, tandis que « fils d’Israël » conserve l’expression familiale du grec.
- source_word: ἱερέων
  choice: prêtres
  rationale: Équivalent français courant du nom de la classe sacerdotale.
- source_word: Λευειτῶν
  choice: lévites
  rationale: Désignation française traditionnelle et transparente de ce groupe.
- source_word: ἱεροψαλτῶν
  choice: chantres du Temple
  rationale: Le composé désigne des chanteurs affectés au service sacré; « chantres du Temple » exprime leur fonction cultuelle dans un registre digne et naturel.
- source_word: θυρωρῶν
  choice: gardiens des portes
  rationale: Cette expression actuelle désigne clairement les personnes chargées des accès du Temple.
- source_word: ἱεροδούλων
  choice: serviteurs du Temple
  rationale: Le terme désigne une catégorie de personnes attachées au service du sanctuaire. « Serviteurs du Temple » communique leur fonction institutionnelle sans déterminer excessivement leur statut juridique; la nuance plus forte est signalée en note.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Formulation française idiomatique pour indiquer la destination d’un déplacement.
theological_decisions:
- issue: Traduction de υἱῶν Ἰσραήλ dans la liste des personnes revenues
  choice: fils d’Israël
  alternative: Israélites
  rationale: La formulation familiale du grec est conservée dans le texte, sans exclure la valeur collective plus naturelle « Israélites », donnée en note.
- issue: Statut impliqué par ἱερόδουλοι
  choice: serviteurs du Temple
  alternative: esclaves du Temple
  rationale: Dans cette liste de fonctions liées au sanctuaire, la traduction principale privilégie le rôle institutionnel. La possibilité d’un statut servile réel demeure visible en note afin de ne pas effacer l’ambiguïté du terme.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « du Temple » distingue nettement les fonctions cultuelles, et « montèrent ensemble » conserve l’image biblique de la montée à Jérusalem ainsi que la valeur du préfixe συν-.
