base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: fr
  text: Et tout ce qui pourra encore être nécessaire pour le temple de ton Dieu[a], tu le fourniras en le prélevant sur le trésor royal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut aussi se rendre par « sanctuaire ». Le témoin araméen parallèle, dont la formulation diffère sensiblement, dit « la maison de ton Dieu ».
    reason: Signaler l’alternative lexicale grecque et la formulation différente du témoin parallèle sans effacer la priorité du texte grec.
lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: tout ce qui pourra encore
  rationale: Cette formulation française exprime naturellement les besoins supplémentaires au-delà de ce qui a déjà été énuméré.
- source_word: ὅσα ἂν ὑποπίπτῃ σοι εἰς τὴν χρείαν
  choice: être nécessaire
  rationale: L’expression grecque désigne de manière conditionnelle ce qui pourrait se présenter comme un besoin; le futur « pourra » conserve cette éventualité.
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: pour le temple de ton Dieu
  rationale: ἱερόν désigne ici directement le temple ou sanctuaire. « Temple » suit donc le témoin grec principal, tandis que la variante du témoin parallèle est signalée en note.
- source_word: δώσεις
  choice: tu le donneras
  rationale: Le futur de l’indicatif a une valeur directive dans ce décret royal; le futur français en garde à la fois la forme et la force.
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: en le prenant dans le trésor royal
  rationale: Cette tournure indique clairement que le trésor royal est la source de ce qui doit être donné, conformément à ἐκ.
theological_decisions:
- issue: Désignation du lieu sacré en τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: le temple de ton Dieu
  alternative: la maison de ton Dieu; le sanctuaire de ton Dieu
  rationale: Le grec, témoin principal, emploie ἱερόν, qui appelle « temple » dans ce contexte. Le témoin sémitique parallèle présente « maison de ton Dieu » dans une formulation sensiblement différente; la note conserve cette donnée sans lui faire remplacer le texte grec.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse grecque. La phrase conserve le ton directif d’un décret royal tout en évitant une syntaxe artificiellement calquée sur le grec.
