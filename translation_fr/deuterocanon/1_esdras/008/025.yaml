base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/025.yaml
  text: Blessed be the Lord alone[a], who put these things into the heart of the king,
translation:
  language: fr
  text: Béni soit le Seigneur, lui seul, qui a mis ces choses dans le cœur du roi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une formulation difficile, qui se lit littéralement à peu près : « dans mon cœur, du roi ». Le sens probable est que Dieu a mis cette résolution dans le cœur du roi.'
    reason: textual_variant
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Béni soit
  rationale: L’adjectif prédicatif introduit ici une bénédiction; « Béni soit » est la formule française naturelle et solennelle.
- source_word: μόνος
  choice: lui seul
  rationale: Cette tournure rattache clairement l’exclusivité au Seigneur tout en conservant l’emphase du grec.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rendu usuel du titre divin κύριος dans une formule de bénédiction.
- source_word: ὁ δοὺς
  choice: qui a mis
  rationale: Avec εἰς τὴν καρδίαν, δίδωμι exprime idiomatiquement le fait de placer une pensée ou une résolution dans le cœur.
- source_word: ταῦτα
  choice: ces choses
  rationale: Conserve le pluriel et le caractère général du démonstratif grec.
- source_word: εἰς τὴν καρδίαν
  choice: dans le cœur
  rationale: Le français dit naturellement « mettre dans le cœur » pour exprimer une impulsion intérieure; le mouvement suggéré par εἰς demeure perceptible.
- source_word: μου τοῦ βασιλέως
  choice: du roi
  rationale: La suite grecque transmise est syntaxiquement difficile et signifie littéralement quelque chose comme « de moi, du roi ». Le contexte parallèle indique vraisemblablement que la résolution a été mise dans le cœur du roi; l’incertitude textuelle est signalée en note.
theological_decisions:
- issue: Portée de μόνος dans la bénédiction
  choice: le Seigneur, lui seul
  alternative: seul le Seigneur
  rationale: « Lui seul » préserve l’accent exclusif sans décider si celui-ci porte principalement sur le Seigneur comme unique destinataire de la bénédiction ou comme unique auteur de l’action.
- issue: Identification du cœur dans la séquence difficile μου τοῦ βασιλέως
  choice: le cœur du roi
  alternative: mon cœur, celui du roi
  rationale: La syntaxe transmise est obscure, mais le contexte exige vraisemblablement une référence à l’inspiration intérieure du roi. La traduction retient ce sens probable sans dissimuler la difficulté, exposée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Béni soit » maintient le registre biblique sans archaïsme excessif; « lui seul » rend l’emphase grecque avec naturel. La virgule finale est conservée parce que le verset fourni se poursuit syntaxiquement.
