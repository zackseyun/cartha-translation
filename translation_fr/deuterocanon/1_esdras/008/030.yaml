base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: fr
  text: 'Des descendants de Pharès : Zacharie[a], et avec lui, d’après le registre[b], cent cinquante hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu porte « Parosh » plutôt que « Pharès ». Le texte principal suit ici le grec de 1 Esdras.
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « d’après le document écrit » ou « selon la liste ». L’expression évoque vraisemblablement une inscription dans un registre généalogique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  choice: Pharès
  rationale: Translittération française directe de la forme grecque, qui demeure le témoin principal pour 1 Esdras; le parallèle hébreu porte une autre forme, signalée en note.
- source_word: Ζαχαρίας
  choice: Zacharie
  rationale: Forme française biblique courante du nom grec, correspondant aussi au nom du parallèle hébreu.
- source_word: μετʼ αὐτοῦ
  choice: avec lui
  rationale: Rend simplement et naturellement l’accompagnement exprimé par la locution grecque.
- source_word: ἀπὸ γραφῆς
  choice: d’après le registre
  rationale: La locution signifie littéralement « à partir d’un écrit ». Dans ce contexte de dénombrement, « registre » rend le document d’inscription sans préciser indûment qu’il s’agit exclusivement d’une généalogie.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec désigne explicitement des personnes de sexe masculin, ce que confirme le parallèle hébreu.
- source_word: ἑκατὸν πεντήκοντα
  choice: cent cinquante
  rationale: Rendu cardinal direct et idiomatique en français moderne.
