base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: fr
  text: J’envoyai chercher Éléazar[a], Idouel, Maasman, Énaatan, Shemaïa, Jorib, Nathan, Ennatan, Zacharie et Mesolabon, qui étaient chefs et hommes de discernement,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de ce verset nous sont parvenus sous des formes grecques qu’il est difficile de faire correspondre exactement à celles du passage parallèle du livre d’Esdras. Ils sont donc rendus ici d’après le texte grec, sans harmonisation complète.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  choice: J’envoyai chercher
  rationale: Avec πρὸς suivi de noms de personnes, le verbe exprime ici l’envoi de quelqu’un auprès d’elles afin de les faire venir. Cette tournure est naturelle en français et garde le sens contextuel du grec.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: Éléazar, Idouel, Maasman, Énaathan, Shemaïa, Jorib, Nathan, Ennathan, Zacharie et Mesolabon
  rationale: Les noms sont translittérés ou rendus sous leurs formes françaises bibliques courantes lorsqu’elles sont bien établies, tout en restant fondés sur le témoin grec et sans harmonisation forcée avec Esdras hébreu.
- source_word: τοὺς ἡγουμένους
  choice: qui étaient chefs
  rationale: Le participe substantivé désigne ceux qui occupent une position de direction. L’ajout explicatif de « qui étaient » relie naturellement les deux qualifications à la liste des hommes.
- source_word: ἐπιστήμονας
  choice: hommes de discernement
  rationale: Le terme désigne des personnes instruites, compétentes ou avisées. « Hommes de discernement » préserve sa portée personnelle et qualitative, ainsi que le genre masculin des personnes nommées.
