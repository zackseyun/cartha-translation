base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: fr
  text: 'Parmi les fils de Joab : Abadias, fils de Jézélos[a], et avec lui deux cent douze hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu parallèle d’Esdras 8.12 présente ici une autre leçon : il nomme un descendant d’Élam et compte soixante-dix mâles. La présente traduction suit le texte grec de 1 Esdras sans l’harmoniser avec ce parallèle hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: Parmi les fils de Joab
  rationale: Dans cette liste généalogique, υἱοί peut désigner les fils, les descendants ou les membres d’une lignée. « Les fils de Joab » conserve la forme du grec, tandis que « parmi » rend naturellement ἐκ.
- source_word: Ἀβαδίας
  choice: Abadias
  rationale: Le nom est translittéré d’après la forme grecque plutôt qu’harmonisé avec un équivalent hébreu.
- source_word: Ἰεζήλου
  choice: Jézélos
  rationale: Le génitif grec est compris comme indiquant la filiation et le nom est francisé directement d’après la forme grecque, sans l’harmoniser avec le parallèle hébreu divergent.
- source_word: καὶ μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Traduction directe et naturelle de la formule employée dans cette liste de recensement.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec désigne normalement des hommes, et non simplement des personnes ou, au sens strictement biologique, des mâles.
- source_word: διακόσιοι δέκα δύο
  choice: deux cent douze
  rationale: Rend exactement la valeur numérique du grec dans la forme française moderne.
