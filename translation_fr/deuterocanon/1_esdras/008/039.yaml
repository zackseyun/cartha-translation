base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: fr
  text: 'Parmi les fils d’Adoniakim, les derniers[a] — et voici leurs noms : Éliphala, fils de Guéouel, et Samaïas[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « les derniers ». Elle peut désigner le dernier sous-groupe ou des descendants plus tardifs de cette famille; la nuance exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte massorétique de la liste parallèle d’Esdras diffère ici : il donne une autre famille et un nombre d’hommes. Comme 1 Esdras réorganise ou remanie parfois ses parallèles hébreux, la traduction suit ici le grec, qui est le texte source principal.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: ἐκ marque ici l’appartenance au groupe. « Parmi les fils de » est naturel en français dans une liste généalogique.
- source_word: Ἀδωνιακαὶμ
  choice: Adoniakim
  rationale: Translittération fondée directement sur la forme grecque, témoin principal.
- source_word: οἱ ἔσχατοι
  choice: les derniers
  rationale: Rend littéralement l’idée de position finale sans déterminer s’il s’agit du dernier sous-groupe ou de descendants plus tardifs.
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: et voici leurs noms
  rationale: Formule française naturelle d’introduction d’une liste, équivalente à la construction nominale grecque.
- source_word: Ἐλειφάλα
  choice: Éliphala
  rationale: Translittération française lisible de la forme grecque, sans substitution d’une forme issue d’un autre témoin.
- source_word: τοῦ Γεουὴλ
  choice: fils de Guéouel
  rationale: Dans ce contexte généalogique, le génitif du nom propre exprime vraisemblablement la filiation; celle-ci est explicitée en français.
- source_word: Σαμαίας
  choice: Samaïas
  rationale: Translittération française directe de la forme grecque, conformément à la priorité donnée au texte source.
