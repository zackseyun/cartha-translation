base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: fr
  text: Et toi, Esdras, conformément à la sagesse de ton Dieu, établis des juges et des magistrats, afin qu’ils jugent, dans toute la Syrie et la Phénicie[a], tous ceux qui connaissent la loi de ton Dieu ; et tu instruiras ceux qui ne la connaissent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte « la Syrie et la Phénicie » ; cette désignation géographique propre à 1 Esdras diffère de la terminologie provinciale employée dans le passage parallèle du livre d’Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τὴν σοφίαν τοῦ θεοῦ
  choice: conformément à la sagesse de ton Dieu
  rationale: La préposition κατά exprime ici la conformité à une norme. Le possessif « ton » rend le σου du grec, qui porte sur « Dieu ».
- source_word: ἀνάδειξον
  choice: établis
  rationale: L’impératif demande à Esdras d’investir officiellement des responsables. « Établis » conserve cette valeur institutionnelle dans un français naturel et digne.
- source_word: κριτὰς καὶ δικαστάς
  choice: des juges et des magistrats
  rationale: Les deux termes grecs désignent des fonctions judiciaires apparentées mais distinctes. Cette formulation préserve le binôme sans les fondre en une seule catégorie.
- source_word: ὅπως δικάζωσιν
  choice: afin qu’ils jugent
  rationale: ὅπως introduit le but. « Jugent » maintient le lien lexical avec « juges » et évite d’élargir indûment l’action à toute l’administration de la justice.
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: dans toute la Syrie et la Phénicie
  rationale: La traduction conserve les deux désignations territoriales explicites du texte grec et rend la portée générale de ὅλῃ.
- source_word: πάντας τοὺς ἐπισταμένους
  choice: tous ceux qui connaissent
  rationale: ἐπίσταμαι indique ici la connaissance ou la maîtrise de la loi. « Connaissent » est clair et permet de préserver le contraste avec ceux qui ne la connaissent pas.
- source_word: διδάξεις
  choice: tu instruiras
  rationale: Le futur de l’indicatif a ici la force directive d’un décret. « Tu instruiras » garde ce ton tout en reprenant naturellement les personnes qui ignorent la loi.
theological_decisions:
- issue: Désignation territoriale grecque ou harmonisation avec le texte d’Esdras transmis en hébreu-araméen
  choice: Conserver « la Syrie et la Phénicie » dans le texte principal
  alternative: Employer une désignation provinciale harmonisée avec le livre canonique d’Esdras
  rationale: Pour 1 Esdras, le grec est le texte source principal. Puisqu’il nomme expressément la Syrie et la Phénicie, ces noms doivent être conservés plutôt que remplacés par la géographie administrative d’un passage parallèle.
- issue: Objet implicite de διδάξεις
  choice: Rendre « tu instruiras ceux qui ne la connaissent pas »
  alternative: Rendre explicitement « tu leur enseigneras la loi »
  rationale: Le grec laisse l’objet de « instruire/enseigner » implicite. La formulation choisie rend clairement le sens en français sans ajouter une proposition plus explicite que la source.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsme. La syntaxe conserve le ton officiel du décret ainsi que la tension du texte : les responsables jugeront ceux qui connaissent la loi, tandis qu’Esdras instruira ceux qui ne la connaissent pas.'
