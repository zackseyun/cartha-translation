base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/026.yaml
  text: and he honored me before the kings and all his friends and nobles[a][b].
translation:
  language: fr
  text: et il m’a honoré devant ceux qui régnaient, ainsi que devant tous ses amis[a] et ses hauts dignitaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans un contexte royal, le mot « amis » peut désigner des proches ou des membres de l’entourage de la cour, et pas seulement des amis personnels.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίμησεν
  choice: m’a honoré
  rationale: Le verbe τιμάω signifie honorer ou témoigner de l’estime. « M’a honoré » est naturel et conserve l’action personnelle exprimée par l’aoriste.
- source_word: ἔναντι
  choice: devant
  rationale: Dans ce contexte, ἔναντι indique que l’honneur a été accordé en présence de personnages de haut rang; « devant » rend cette dimension publique sans l’alourdir.
- source_word: τῶν βασιλευόντων
  choice: ceux qui régnaient
  rationale: Le grec emploie un participe substantivé, littéralement « ceux qui régnaient », plutôt que le simple nom « rois ». Cette traduction conserve la forme et l’ambiguïté du texte.
- source_word: φίλων
  choice: amis
  rationale: « Amis » rend le sens premier de φίλοι. Dans un cadre royal, le terme peut aussi désigner des proches ou associés de la cour, nuance signalée en note.
- source_word: μεγιστάνων
  choice: hauts dignitaires
  rationale: μεγιστᾶνες désigne des personnages éminents ou puissants. « Hauts dignitaires » est clair en français moderne et convient au contexte de cour.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le participe grec « ceux qui régnaient » plutôt que de le réduire à « les rois ». La coordination « ainsi que devant » clarifie que l’honneur est manifesté en présence de tous les groupes mentionnés.
