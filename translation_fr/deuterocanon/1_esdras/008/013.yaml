base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/013.yaml
  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that may be found in the land of Babylonia for the Lord in Jerusalem[b],
translation:
  language: fr
  text: et d’apporter à Jérusalem des dons pour le Seigneur[a], que mes amis et moi avons voués, ainsi que tout l’or et l’argent qui pourraient être trouvés dans le pays de Babylone pour le Seigneur à Jérusalem[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des offrandes pour le Seigneur » ; dans ce contexte, le mot grec traduit par « dons » peut avoir un sens cultuel.
    reason: lexical_alternative
  - marker: b
    text: La formule grecque finale est très condensée, littéralement « pour le Seigneur vers/à Jérusalem ». Elle désigne des biens affectés au Seigneur à Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: d’apporter
  rationale: L’infinitif exprime le transport vers une destination; « apporter » rend naturellement le mouvement vers Jérusalem.
- source_word: δῶρα
  choice: les dons
  rationale: « Dons » conserve le sens général du terme sans le réduire d’emblée à une catégorie sacrificielle précise; le contexte lui donne néanmoins une portée cultuelle.
- source_word: τῷ κυρίῳ
  choice: destinés au Seigneur
  rationale: Le datif indique ici le bénéficiaire ou la destination cultuelle des dons. « Destinés au Seigneur » clarifie cette relation en français naturel.
- source_word: ἃ ηὔξαμην
  choice: que ... avons voués
  rationale: Avec des dons pour objet, εὔχομαι a le sens de faire vœu ou de vouer. L’accord au pluriel rend le sujet coordonné « mes amis et moi ».
- source_word: οἱ φίλοι
  choice: mes amis
  rationale: C’est le sens direct de φίλοι; rien dans le grec n’impose un terme plus technique comme « associés » ou « courtisans ».
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: tout l’or et l’argent
  rationale: Cette formulation idiomatique traite les métaux précieux comme des noms collectifs et préserve la portée globale de πᾶν.
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: qui pourra être trouvé
  rationale: Le relatif avec ἐάν et le subjonctif exprime une éventualité indéfinie; le futur potentiel français en garde le caractère ouvert.
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: dans le territoire de la Babylonie
  rationale: χώρα désigne une région ou un territoire. « Babylonie » convient au nom géographique sans imposer la précision administrative de « province ».
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un verbe de transport, « à Jérusalem » exprime idiomatiquement en français la destination marquée par εἰς.
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: pour le Seigneur à Jérusalem
  rationale: La formulation grecque finale est comprimée. Une traduction proche conserve l’ambiguïté entre destination géographique et affectation cultuelle, expliquée en note.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte scripturaire juif, κύριος désigne le Dieu d’Israël; « Seigneur » est la traduction française consacrée et n’introduit pas un supérieur humain.
- issue: Nuance cultuelle de δῶρα et ηὔξαμην
  choice: dons ... voués
  alternative: offrandes ... promis
  rationale: La formulation retenue exprime la consécration religieuse des biens tout en évitant de préciser un rite sacrificiel que le grec ne nomme pas explicitement.
- issue: Rapport syntaxique de la formule finale
  choice: pour le Seigneur à Jérusalem
  alternative: pour le Seigneur, vers Jérusalem
  rationale: Le grec τῷ κυρίῳ εἰς Ἰερουσαλήμ est compact et permet de comprendre les biens comme destinés au Seigneur dans le cadre du culte à Jérusalem. La traduction ne résout pas artificiellement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste coordonnée et se termine par une virgule afin de respecter son caractère de fragment au sein de la phrase plus longue du contexte. Les deux marqueurs de note [a] et [b] figurent dans le texte.
