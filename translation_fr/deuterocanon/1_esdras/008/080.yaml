base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: fr
  text: 'en disant : « Le pays dans lequel vous entrez pour en hériter est un pays souillé par la souillure des étrangers du pays[a], qui l’ont rempli de leur impureté[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’expression sémitique parallèle : « des peuples du pays ». Le grec dit plus précisément : « des étrangers du pays ».'
    reason: alternative_reading
  - marker: b
    text: Le mot « impureté » peut avoir ici une portée aussi bien rituelle que morale; la formulation ne contraint pas à choisir un seul de ces sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  choice: le pays
  rationale: Dans ce contexte d’entrée et d’héritage, γῆ désigne le territoire concerné plutôt que la terre entière.
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: dans lequel vous entrez
  rationale: Cette formulation conserve la valeur directionnelle de εἰς et le présent du grec.
- source_word: κληρονομῆσαι
  choice: pour en hériter
  rationale: « Hériter » maintient le langage d’héritage porté par κληρονομέω; le pronom « en » rend la construction naturelle en français.
- source_word: μεμολυσμένη μολυσμῷ
  choice: souillé par la souillure
  rationale: La répétition des mots apparentés reproduit l’insistance du grec, tandis que « souillé » garde les dimensions morale et rituelle possibles.
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: des étrangers du pays
  rationale: ἀλλογενής désigne des personnes d’un autre peuple ou d’une autre origine. Le grec est plus explicite sur leur caractère étranger que l’idiome sémitique parallèle.
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: de leur impureté
  rationale: « Impureté » peut porter ici une valeur à la fois rituelle et morale sans réduire le sens à une seule de ces dimensions.
- source_word: ἐνέπλησαν αὐτήν
  choice: qui l’ont rempli
  rationale: Le verbe signifie « remplir »; le passé composé exprime naturellement en français l’acte accompli dont le résultat demeure.
theological_decisions:
- issue: Faut-il limiter la souillure à l’impureté rituelle ou à la corruption morale?
  choice: Employer « souillé », « souillure » et « impureté » sans préciser davantage.
  alternative: Expliciter soit des pratiques rituellement impures, soit une corruption exclusivement morale.
  rationale: μολυσμός et ἀκαθαρσία peuvent associer des dimensions cultuelles et éthiques; la traduction préserve cette tension.
- issue: Comment rendre ἀλλογενῶν par rapport à l’idiome sémitique parallèle?
  choice: des étrangers du pays
  alternative: des peuples du pays
  rationale: Le témoin grec est la source première et ἀλλογενῶν marque explicitement l’altérité d’origine; l’autre formulation est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « souillé par la souillure » est volontaire afin de conserver l’emphase du grec. Les notes [a] et [b] figurent toutes deux dans le texte principal.
