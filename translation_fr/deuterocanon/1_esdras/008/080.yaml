  terminology: '« Souillé », « souillure » et « impureté » préservent sans la réduire la portée rituelle et morale possible du vocabulaire grec. « Hériter » maintient le terme important de l’héritage. Les deux notes sont pertinentes, prudentes et correctement ancrées : [a] après « étrangers du pays » et [b] après « impureté ».'
