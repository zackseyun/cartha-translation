  source_fidelity: 'Le texte rend fidèlement le grec : « pays » convient à γῆ dans ce contexte territorial; « dans lequel vous entrez pour en hériter » conserve l’entrée et le langage d’héritage; et la répétition « souillé par la souillure » reproduit avec justesse l’emphase de μεμολυσμένη μολυσμῷ. « Étrangers du pays » rend directement ἀλλογενῶν τῆς γῆς sans substituer l’idiome du témoin parallèle. La dernière proposition exprime bien qu’ils ont rempli le pays de leur impureté.'
