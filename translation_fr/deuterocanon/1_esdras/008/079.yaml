base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: fr
  text: Et maintenant, que dirons-nous, Seigneur, alors que nous avons tout cela[a] ? Ils ont transgressé tes commandements, que tu as donnés par l’intermédiaire de tes serviteurs, les prophètes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est condensée : « tout cela » renvoie à ce qui vient d’être évoqué, sans que le référent soit précisé ici.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de tes serviteurs, les prophètes », expression biblique indiquant que les commandements ont été transmis par leur intermédiaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien exprimé par καί et la transition du discours, dans un français naturel.
- source_word: τί ἐροῦμεν
  choice: que dirons-nous
  rationale: Le futur grec forme une question rhétorique et délibérative; le futur français en préserve directement la solennité.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend le vocatif κύριε par l’appellation française consacrée, sans ajouter d’interjection absente du grec.
- source_word: ἔχοντες αὐτά
  choice: alors que nous avons tout cela
  rationale: Le participe s’accorde avec le « nous » implicite de la question. « Tout cela » garde le référent volontairement indéterminé de αὐτά tout en restant idiomatique.
- source_word: παρέβησαν
  choice: Ils ont transgressé
  rationale: Respecte la troisième personne du pluriel et la portée morale et juridique du verbe, sans transformer la formulation en confession explicite à la première personne.
- source_word: τὰ προστάγματά σου
  choice: tes commandements
  rationale: « Commandements » exprime clairement les prescriptions divines désignées par προστάγματα.
- source_word: ἃ ἔδωκας
  choice: que tu as donnés
  rationale: Rend simplement le relatif et l’aoriste de δίδωμι; l’accord français renvoie à « commandements ».
- source_word: ἐν χειρὶ
  choice: par l’intermédiaire de
  rationale: Transmet en français moderne le sens instrumental de l’expression biblique « par la main de », sans rendre la phrase obscure ou artificielle.
- source_word: τῶν παίδων σου
  choice: tes serviteurs
  rationale: Dans ce contexte de mission prophétique, παῖδες désigne les serviteurs de Dieu plutôt que ses enfants.
- source_word: τῶν προφητῶν
  choice: les prophètes
  rationale: Traduction usuelle de προφῆται; la virgule marque l’apposition qui identifie les serviteurs.
theological_decisions:
- issue: Sujet implicite de παρέβησαν
  choice: Ils ont transgressé
  alternative: Nous avons transgressé
  rationale: La forme grecque est à la troisième personne du pluriel. Même si l’orant peut s’identifier à la communauté dans l’ensemble de la prière, ce verset ne doit pas être grammaticalement transformé en première personne.
- issue: Formule de médiation ἐν χειρὶ
  choice: par l’intermédiaire de tes serviteurs, les prophètes
  alternative: par la main de tes serviteurs, les prophètes
  rationale: Le choix principal communique clairement l’action médiatrice en français actuel; la note conserve la forme concrète de l’idiome grec.
- issue: Référent de αὐτά
  choice: tout cela
  alternative: ces choses
  rationale: Le texte grec laisse le référent comprimé et dépendant du contexte. La traduction conserve cette indétermination au lieu de préciser qu’il s’agit de faveurs, de circonstances ou de biens particuliers.
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve son tour solennel; l’expression médiatrice est rendue idiomatiquement dans le texte, tandis que sa forme biblique littérale est signalée en note. L’ambiguïté du référent de αὐτά et la troisième personne de παρέβησαν sont maintenues.
