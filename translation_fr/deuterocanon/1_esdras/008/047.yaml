    text: Le parallèle hébreu porte « Mahli » plutôt que « Mooli ».
    reason: alternative_reading
  - marker: b
    text: Le parallèle hébreu donne le nom « Shérébia ». Le grec porte ici « Asebébias ».
    reason: alternative_reading
  - marker: c
    text: Le parallèle hébreu porte « dix-huit » plutôt que « dix ».
    reason: textual_variant
lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: un homme intelligent
  rationale: Le grec désigne explicitement un homme et le qualifie de compétent, instruit ou doué de discernement. « Intelligent » rend naturellement cette qualité en français moderne sans lui donner un sens trop technique.
- source_word: τῶν υἱῶν Μοολὶ
  choice: parmi les fils de Mooli
  rationale: La formule généalogique est conservée. Le nom principal suit la forme du texte grec, tandis que la forme du parallèle hébreu est signalée en note.
- source_word: τοῦ Λευὶ τοῦ Ἰσραήλ
  choice: fils de Lévi, fils d’Israël
  rationale: L’ajout de « fils de » explicite en français la chaîne généalogique portée par les génitifs grecs et confirmée par le parallèle hébreu.
- source_word: Ἀσεβηβίαν
  choice: Asebébias
  rationale: Le nom est translittéré d’après le témoin grec principal, avec une graphie et une accentuation adaptées au français. La forme différente du parallèle hébreu est conservée en note.
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφούς
  choice: avec ses fils et ses frères
  rationale: Dans cette construction appositionnelle, les fils et les frères sont naturellement rattachés à Asebébias. « Avec » rend clairement l’idée du groupe présenté sans alourdir la phrase.
- source_word: δέκα
  choice: au nombre de dix
  rationale: Le texte grec porte « dix ». La tournure française clarifie que ce nombre concerne le groupe associé à Asebébias; la variante « dix-huit » du parallèle hébreu est indiquée en note.
