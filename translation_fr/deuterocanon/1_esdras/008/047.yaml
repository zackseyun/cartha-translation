base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/047.yaml
  text: a man of understanding[a], from the sons of Mooli, son of Levi, son of Israel—Asebebias, and his sons and brothers, ten[c][b];
translation:
  language: fr
  text: 'un homme avisé, parmi les fils de Mooli[a], fils de Lévi, fils d’Israël : Asebébias[b], ses fils et ses frères, dix[c] ;'
  philosophy: optimal-equivalence
  footnotes:
