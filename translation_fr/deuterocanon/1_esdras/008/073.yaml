base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: fr
  text: Depuis le temps de nos pères[a] jusqu’à ce jour, nous sommes dans un grand péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nos ancêtres ». Le grec dit littéralement « de nos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « nous sommes dans un grand péché ». Le présent grec exprime ici un état qui dure depuis le temps des pères jusqu’au jour présent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  choice: Depuis le temps
  rationale: La préposition ἀπό marque ici le point de départ temporel, et χρόνοι désigne une époque ou une période. Au singulier collectif, « depuis le temps » est naturel en français et maintient l’idée de continuité.
- source_word: τῶν πατέρων ἡμῶν
  choice: de nos pères
  rationale: Le grec emploie le pluriel masculin πατέρων. « Nos pères » conserve l’idiome ancestral du texte tout en restant intelligible en français.
- source_word: ἐσμεν
  choice: nous sommes
  rationale: Le présent grec est conservé. Avec « depuis… jusqu’à ce jour », le français exprime naturellement un état commencé dans le passé et toujours actuel.
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: dans un grand péché
  rationale: Cette formulation rend directement la préposition ἐν, l’adjectif μεγάλῃ et le nom ἁμαρτίᾳ, sans remplacer la notion de péché par celle, plus juridique, de culpabilité.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Expression temporelle française courante et digne, proche du grec, qui marque la persistance de la situation jusqu’au présent du locuteur.
theological_decisions:
- issue: Langage ancestral masculin
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » reflète explicitement πατέρων et préserve l’idiome masculin du texte; une note signale l’équivalent collectif possible.
- issue: Péché ou culpabilité
  choice: dans un grand péché
  alternative: dans une grande culpabilité
  rationale: ἁμαρτία désigne d’abord le péché. Bien que la culpabilité soit impliquée, la traduction ne substitue pas une catégorie juridique au terme moral et religieux du grec.
- issue: Présent continu depuis le passé
  choice: nous sommes
  alternative: nous avons été
  rationale: Le grec porte le présent ἐσμεν. La construction temporelle française avec « depuis » suffit à indiquer que cet état dure depuis le passé, sans effacer la forme présente.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle; « jusqu’à ce jour » conserve une légère solennité biblique sans archaïsme marqué.
