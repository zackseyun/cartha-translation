  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: fr
  text: Et je leur dis d’aller trouver Laddaïos[a], le responsable qui était au dépôt du trésor[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne nomme ici que Laddaïos, tandis que le passage parallèle d’Esdras 8.16 dans le texte hébreu énumère plusieurs hommes qui furent envoyés. À cet endroit, 1 Esdras semble condenser ou remanier le récit parallèle.
    reason: alternative_reading
  - marker: b
    text: 'Autres traductions possibles : « au lieu du trésor », « au lieu du dépôt » ou « dans la chambre du trésor ». La formulation grecque est concise et laisse incertaine la nuance exacte de ce lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα αὐτοῖς ἐλθεῖν
  choice: je leur dis d’aller
  rationale: Le verbe λέγω suivi d’un infinitif exprime ici une consigne. « Je leur dis d’aller » est naturel en français et conserve la formulation relativement sobre du grec.
- source_word: ἐλθεῖν πρὸς
  choice: aller trouver
  rationale: Dans cette consigne rapportée, le mouvement est celui des destinataires vers une autre personne. « Aller trouver » rend idiomatiquement ἐλθεῖν πρὸς sans imposer le point de vue déictique de « venir ».
- source_word: Λαδδαῖον
  choice: Laddaïos
  rationale: Le nom propre grec, à l’accusatif Λαδδαῖον et au nominatif Λαδδαῖος, est translittéré sous la forme française « Laddaïos ».
- source_word: τὸν ἡγούμενον
  choice: le responsable
  rationale: ἡγούμενος désigne une personne qui dirige ou qui est chargée de quelque chose. « Responsable » reste neutre et n’attribue pas à Laddaïos une fonction politique précise.
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: qui se trouvait au lieu du trésor
  rationale: Cette traduction conserve la structure locative et la formulation compacte du grec. γαζοφυλάκιον peut désigner un trésor, un dépôt ou la pièce où il est gardé, sans que la construction précise soit entièrement explicite ici.
