  source_fidelity: Le texte grec dit qu’il leur ordonna d’aller auprès de Laddaïos, « le responsable / chef », identifié comme étant ἐν τῷ τόπῳ γαζοφυλακίου. « Aller trouver », « responsable » et la translittération « Laddaïos » sont fidèles. Toutefois, « au lieu du trésor » est peu naturel et ambigu en français contemporain, où « lieu de » peut suggérer « à la place de ». « Au dépôt du trésor » rend naturellement γαζοφυλάκιον comme lieu de conservation, sans préciser indûment le statut de Laddaïos.
  naturalness: La phrase révisée est fluide en français international moderne. « Qui se trouvait » est remplacé par « qui était », plus direct dans une identification narrative.
  terminology: « Responsable » maintient la neutralité de ἡγούμενος et n’impose pas le sens administratif de « gouverneur ». « Dépôt du trésor » conserve l’idée d’un lieu ou d’une chambre de dépôt associée au trésor; la note signale les autres nuances admissibles.
