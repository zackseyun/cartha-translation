translation_notes:
  register: Français international moderne, digne et accessible. La tournure « aller trouver » est idiomatique; « responsable » évite de préciser indûment la nature de la charge. L’expression inhabituelle « lieu du trésor » est maintenue afin de préserver l’ambiguïté du grec, explicitée en note.
