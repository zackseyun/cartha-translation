base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: fr
  text: En effet, Apsaras[a] possédait un vaste savoir, afin de ne rien omettre de ce qui provenait tant de la Loi du Seigneur que des commandements, enseignant à tout Israël les prescriptions et les jugements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Apsaras ». Le contexte parallèle hébreu correspond à Esdras, mais le témoin grec principal conserve ici cette forme du nom.
    reason: alternative_reading
  - marker: b
    text: 'La fin du grec est très condensée et peut se rendre littéralement ainsi : « ne rien omettre de ce qui provient de la Loi du Seigneur et des commandements, tout Israël, prescriptions et jugements ». Le mot « enseignant » n’est pas exprimé, mais explicite le sens probable de la phrase.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: Apsaras
  rationale: Le nom est translittéré d’après le témoin grec principal, sans l’harmoniser avec Esdras dans la tradition hébraïque parallèle.
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: possédait un vaste savoir
  rationale: ἐπιστήμη désigne ici le savoir ou la connaissance acquise, et περιεῖχεν exprime la possession. Cette formulation est naturelle en français tout en conservant l’idée d’une compétence étendue.
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: si bien qu’il ne laissait rien de côté
  rationale: La construction peut exprimer le but ou le résultat. « Si bien que » convient au lien contextuel avec le vaste savoir, tandis que « ne laissait rien de côté » garde la portée exhaustive de μηδὲν et le sens de παραλείπειν.
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: de ce qui venait de la Loi du Seigneur et des commandements
  rationale: 'Le tour explicite la valeur de ἐκ et le génitif substantivé implicite : il s’agit de matières tirées de la Loi du Seigneur et des commandements. La répétition grecque de ἐκ reste perceptible dans la coordination française.'
- source_word: πάντα τὸν Ἰσραήλ
  choice: tout Israël
  rationale: Rendu direct de l’accusatif grec, avec l’expression collective biblique usuelle.
- source_word: δικαιώματα καὶ κρίματα
  choice: les prescriptions et les jugements
  rationale: Ces termes appartiennent au registre juridique biblique. « Prescriptions » exprime les exigences établies, tandis que « jugements » conserve la valeur judiciaire de κρίματα sans effacer la distinction entre les deux mots.
theological_decisions:
- issue: Syntaxe comprimée à la fin du verset
  choice: Comprendre « tout Israël, prescriptions et jugements » comme indiquant qu’Apsaras enseignait à tout Israël ces matières juridiques.
  alternative: Conserver une formulation strictement juxtaposée, sans ajouter « enseignant », au prix d’une phrase française obscure.
  rationale: Le grec transmis ne contient pas de verbe explicite correspondant à « enseignant » et sa fin est syntaxiquement abrupte. Le participe français rend explicite le sens pédagogique probablement sous-entendu, sans présenter cette reconstruction comme certaine; la note signale donc l’ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique biblique est maintenu sans archaïsme excessif. La majuscule à « Loi » identifie ici la Loi du Seigneur comme corpus reconnu; l’ambiguïté syntaxique du grec est signalée plutôt que dissimulée.
