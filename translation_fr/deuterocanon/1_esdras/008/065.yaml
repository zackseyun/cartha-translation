  text: And when these things had been completed, the leaders came to me, saying,
translation:
  language: fr
  text: 'Quand tout cela fut achevé, les chefs vinrent me trouver et dirent :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: Quand tout cela fut achevé
  rationale: Le génitif absolu marque une action antérieure menée à son terme. « Quand tout cela fut achevé » est naturel et conserve la valeur accomplie de τελέω.
- source_word: προσηλθόσαν μοι
  choice: vinrent me trouver
  rationale: προσέρχομαι avec le datif exprime ici le fait de venir auprès de quelqu’un. « Vinrent me trouver » rend idiomatiquement le mouvement vers le narrateur.
- source_word: οἱ ἡγούμενοι
  choice: les chefs
  rationale: Le participe substantivé désigne ceux qui exercent une fonction de direction, sans préciser un titre officiel. « Les chefs » convient au registre narratif et demeure sobre.
- source_word: λέγοντες
  choice: et dirent
  rationale: Le participe présent introduit les paroles qui suivent. En français, la coordination avec un verbe conjugué est plus naturelle, tandis que les deux-points signalent la continuation du discours au verset suivant.
