revisions:
- from: Pendant qu’Esdras priait et confessait ses fautes[a], en pleurant, prosterné à terre devant le Temple, une foule immense d’hommes, de femmes et de jeunes hommes se rassembla autour de lui, venue de Jérusalem, car la foule pleurait abondamment.
  to: 'Pendant qu’Esdras priait et faisait confession[a], pleurant et prosterné à terre devant le Temple, une foule très nombreuse se rassembla auprès de lui, venant de Jérusalem : des hommes, des femmes et de jeunes hommes ; car de grands pleurs s’élevaient dans la foule.'
  rationale: La révision évite de spécifier les fautes comme objet de la confession, explicite naturellement que les personnes rassemblées venaient de Jérusalem, et restitue la répétition grecque entre le participe « pleurant » et le nom « pleurs ».
