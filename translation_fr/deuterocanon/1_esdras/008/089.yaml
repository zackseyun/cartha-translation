base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: fr
  text: 'Pendant qu’Esdras priait et faisait confession[a], pleurant et prosterné à terre devant le Temple, une foule très nombreuse se rassembla auprès de lui, venant de Jérusalem : des hommes, des femmes et de jeunes hommes ; car de grands pleurs s’élevaient dans la foule.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendait grâce » ; le verbe grec peut avoir les deux sens, mais le contexte pénitentiel favorise ici celui de la confession.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενος
  choice: priait
  rationale: Le participe présent exprime une action en cours, simultanée à la confession et aux pleurs.
- source_word: ἀνθωμολογεῖτο
  choice: confessait ses fautes
  rationale: Le verbe peut aussi évoquer l’action de rendre grâce ou de louer, mais le contexte pénitentiel — prière, pleurs et prostration — favorise ici l’aveu des fautes.
- source_word: κλαίων
  choice: en pleurant
  rationale: Cette formulation naturelle conserve la gravité de la scène et la simultanéité de l’action.
- source_word: χαμαιπετής
  choice: prosterné à terre
  rationale: L’adjectif décrit quelqu’un étendu ou abattu au sol; la traduction exprime clairement cette posture d’humiliation.
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: devant le Temple
  rationale: ἱερόν désigne ici le Temple ou son enceinte, non nécessairement le sanctuaire intérieur.
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: se rassembla autour de lui
  rationale: La tournure rend naturellement le rassemblement orienté vers Esdras.
- source_word: ὄχλος πολὺς σφόδρα
  choice: une foule immense
  rationale: Cette expression française actuelle restitue à la fois l’importance de la foule et l’intensif σφόδρα.
- source_word: νεανίαι
  choice: jeunes hommes
  rationale: Le terme grec est masculin et désigne spécifiquement de jeunes hommes.
- source_word: κλαυθμὸς ... μέγας
  choice: pleurait abondamment
  rationale: La formulation idiomatique exprime l’intensité des pleurs collectifs sans lourdeur.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: venue de Jérusalem
  rationale: Le complément est rattaché à la foule de manière naturelle tout en conservant son origine géographique.
theological_decisions:
- issue: Sens de ἀνθωμολογεῖτο dans ce contexte pénitentiel
  choice: confessait ses fautes
  alternative: rendait grâce / louait
  rationale: La polysémie réelle du verbe est signalée en note; dans cette scène de prière, de pleurs et de prostration, la confession des fautes est néanmoins le sens contextuel le plus probable.
- issue: Portée de νεανίαι
  choice: jeunes hommes
  alternative: jeunes gens / jeunes
  rationale: Le masculin explicite du grec est conservé plutôt que neutralisé.
- issue: Désignation du lieu par ἱερόν
  choice: Temple
  alternative: sanctuaire
  rationale: « Temple » préserve la référence générale au complexe cultuel sans la restreindre au sanctuaire intérieur.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est légèrement réorganisée pour éviter une accumulation de participes, tout en conservant les actions simultanées, l’origine hiérosolymitaine de la foule et l’identité masculine des νεανίαι.
