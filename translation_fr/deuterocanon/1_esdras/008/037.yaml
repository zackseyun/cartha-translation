base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: fr
  text: 'Parmi les descendants de Baer : Zacharie, fils de Bémaï[a], et avec lui vingt-huit hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les noms et le nombre donnés ici par le grec diffèrent nettement du parallèle hébreu approximatif (Esdras 8.9), qui porte : « Parmi les descendants de Joab : Abdias, fils de Jehiel, et avec lui deux cent dix-huit hommes. » Comme le présent texte de 1 Esdras est traduit d’après le grec, ses noms et son nombre sont retenus dans le texte principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: Parmi les descendants de Baer
  rationale: La tournure grecque, littéralement « d'entre les Baer », désigne ici un groupe familial. « Descendants » exprime clairement cette valeur collective sans imposer le sens plus étroit de « fils ».
- source_word: Ζαχαρίαι
  choice: Zacharie
  rationale: Forme française biblique courante correspondant au grec Ζαχαρίαι.
- source_word: Βημαί
  choice: fils de Bémaïa
  rationale: Le nom isolé semble jouer le rôle d'un patronyme dans cette liste généalogique. L'ajout de « fils de » rend la relation probable intelligible, tandis que la note signale l'écart important avec le parallèle hébreu.
- source_word: καὶ μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Traduction directe et naturelle de la formule d'accompagnement.
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: vingt-huit hommes
  rationale: Dans ce relevé, ἄνδρες désigne des personnes de sexe masculin; « hommes » conserve cette précision avec naturel.
