  verdict: revise
  source_fidelity: 'Révision légère nécessaire pour rendre plus directement la coordination des deux infinitifs grecs dépendant de ἐντειλάμενος : l’ordre porte sur le fait de s’entretenir avec les personnes nommées et de nous envoyer les personnes requises. « De ce lieu » rend plus précisément ἐν τῷ τόπῳ, qui qualifie les trésoriers.'
  naturalness: La formulation révisée est fluide en français moderne et évite l’ambiguïté référentielle de « afin qu’ils nous envoient », dont le sujet pouvait être compris comme Lodaios, ses frères et les trésoriers plutôt que comme « leur » (les personnes auxquelles l’ordre a été donné).
  terminology: « Lodaios », « frères », « trésoriers », « fonctions de prêtres », « maison » et « notre Seigneur » respectent le grec. « Fonctions de prêtres » rend naturellement et explicitement la valeur sacerdotale de ἱερατεύσαντας, sans l’élargir au sens plus général du parallèle hébreu.
  issues:
  - severity: medium
    issue: Ambiguïté syntaxique de « afin qu’ils nous envoient »
    rationale: Dans le grec, διαλεχθῆναι et ἀποστεῖλαι sont deux infinitifs coordonnés après « ayant ordonné à eux ». La tournure française avec « afin qu’ils » peut faire des interlocuteurs nommés le sujet de l’envoi. Une coordination par « et de nous envoyer » conserve la construction source et clarifie le référent.
  - severity: low
    issue: « qui se trouvaient en ce lieu » affaiblit légèrement la fonction de ἐν τῷ τόπῳ
    rationale: L’expression grecque désigne les trésoriers attachés ou présents dans le lieu indiqué. « Les trésoriers de ce lieu » est plus concis et moins susceptible de suggérer une présence seulement occasionnelle.
