base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
translation:
  language: fr
  text: après leur avoir ordonné de s’entretenir avec Lodaios[a], ses frères et les trésoriers de ce lieu, et de nous envoyer[b] ceux qui exerceraient les fonctions de prêtres[c] dans la maison de notre Seigneur[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Lodaios » ; le passage parallèle d’Esdras 8.17 en hébreu porte « Iddo ».
    reason: alternative_reading
  - marker: b
    text: Le grec porte « de nous envoyer » ; le passage parallèle en hébreu dit « de nous amener ».
    reason: alternative_reading
  - marker: c
    text: Le grec désigne précisément ceux qui exerceraient les fonctions de prêtres ; le passage parallèle en hébreu parle plus largement de serviteurs ou d’officiants.
    reason: lexical_alternative
  - marker: d
    text: Le grec porte « notre Seigneur » ; le passage parallèle en hébreu porte « notre Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: après leur avoir ordonné
  rationale: Cette tournure conserve la valeur participiale et l’antériorité de l’ordre, tout en s’intégrant naturellement à la narration française.
- source_word: διαλεχθῆναι
  choice: de parler à
  rationale: Le verbe désigne ici le fait de s’adresser à des personnes ou de s’entretenir avec elles. « Parler à » est clair, actuel et respecte la construction au datif.
- source_word: Λοδαίῳ
  choice: Lodaios
  rationale: Le nom est translittéré d’après le témoin grec principal, sans harmonisation avec l’Iddo du parallèle hébreu.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: à ses frères
  rationale: « Frères » rend le sens ordinaire de ἀδελφοί sans élargir implicitement le terme à la parenté.
- source_word: γαζοφύλαξιν
  choice: aux trésoriers
  rationale: Le terme désigne les responsables ou gardiens d’un trésor. « Trésoriers » est précis et idiomatique.
- source_word: ἀποστεῖλαι ἡμῖν
  choice: afin qu’ils nous envoient
  rationale: « Envoyer » suit directement le grec. La proposition finale explicite en français que Lodaios, ses frères et les trésoriers sont vraisemblablement ceux dont l’envoi est attendu, sans ajouter un verbe comme « demander ».
- source_word: τοὺς ἱερατεύσαντας
  choice: ceux qui exerceraient le sacerdoce
  rationale: Le participe de ἱερατεύω exprime spécifiquement l’exercice d’une fonction sacerdotale, plus étroite que le simple service.
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: dans la maison de notre Seigneur
  rationale: « Maison » conserve l’expression cultuelle du texte, tandis que « notre Seigneur » traduit le grec κυρίου ἡμῶν sans l’harmoniser avec le parallèle hébreu.
theological_decisions:
- issue: κύριος dans la désignation de celui à qui appartient la maison
  choice: notre Seigneur
  alternative: notre Dieu
  rationale: Le témoin grec principal porte κυρίου ἡμῶν. Le parallèle hébreu d’Esdras 8.17 porte « notre Dieu » ; cette divergence est signalée plutôt que résolue par harmonisation.
- issue: Portée de τοὺς ἱερατεύσαντας
  choice: ceux qui exerceraient le sacerdoce
  alternative: des serviteurs
  rationale: Le grec spécifie un service sacerdotal, alors que le parallèle hébreu emploie un terme plus général pour des serviteurs ou officiants. La traduction suit la précision du grec.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde la forme dépendante du participe grec, puisque l’extrait se rattache syntaxiquement au contexte précédent. Le vocabulaire cultuel reste concret et non confessionnel.
