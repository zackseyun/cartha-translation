revisions:
- from: après leur avoir ordonné de parler à Lodaios[a], à ses frères et aux trésoriers qui se trouvaient en ce lieu, afin qu’ils nous envoient[b] ceux qui exerceraient le sacerdoce[c] dans la maison de notre Seigneur[d],
  to: après leur avoir ordonné de s’entretenir avec Lodaios[a], ses frères et les trésoriers de ce lieu, et de nous envoyer[b] ceux qui exerceraient les fonctions de prêtres[c] dans la maison de notre Seigneur[d],
  rationale: La correction clarifie la dépendance des deux actions à l’ordre donné, tout en conservant la valeur participiale de « après leur avoir ordonné ». Elle rend la localisation des trésoriers de façon plus idiomatique et maintient toutes les divergences pertinentes entre le grec et le parallèle hébreu dans les notes.
