base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: fr
  text: Voici les chefs, selon leurs maisons ancestrales et leurs divisions[a], qui montèrent avec moi de Babylone sous le règne du roi Artaxerxès.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « leurs divisions »; le parallèle hébreu emploie une expression généalogique qui peut se traduire par « leur inscription généalogique » ou « leur lignée ». La traduction suit ici le grec, témoin principal de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ προηγούμενοι
  choice: les chefs
  rationale: Dans ce contexte de liste généalogique, le terme désigne ceux qui sont à la tête des groupes; le parallèle hébreu confirme l’idée de chefs de maisons ancestrales.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: selon leurs maisons ancestrales
  rationale: πατριά désigne ici les groupes de parenté issus d’un ancêtre. « Maisons ancestrales » est naturel en français moderne tout en conservant la précision généalogique.
- source_word: καὶ τὰς μεριδαρχίας
  choice: et leurs divisions
  rationale: La traduction suit le grec, où le mot évoque des subdivisions ou des groupements organisés, sans l’assimiler silencieusement à l’expression généalogique du parallèle hébreu.
- source_word: οἱ ἀναβάντες
  choice: qui montèrent
  rationale: Rend l’idiome biblique et géographique de la montée depuis Babylone vers Jérusalem.
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: sous le règne du roi Artaxerxès
  rationale: Dans ce cadre temporel, βασιλεία signifie naturellement le règne; la formulation française évite la répétition lourde « Artaxerxès le roi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. « Voici » restitue naturellement l’introduction nominale grecque; « maisons ancestrales » évite l’expression moins idiomatique « maisons de leurs pères ».
