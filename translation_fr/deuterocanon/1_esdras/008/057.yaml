base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: fr
  text: Et il leur remit[a], après les avoir pesés, six cent cinquante talents d’argent, des objets en argent d’un poids de cent talents, cent talents d’or, vingt coupes d’or[b] et dix objets en bronze fin et brillant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec diffère ici sensiblement du passage parallèle d’Esdras 8.27 dans le texte hébreu, qui mentionne deux objets en bronze fin et indique la valeur des coupes en or. Comme 1 Esdras est ici traduit d’après le témoin grec, le texte principal suit son inventaire.
    reason: textual_variant
  - marker: b
    text: 'Ou peut-être : « vingt objets en or ». Le terme grec est rare, mais le passage parallèle en hébreu permet de penser qu’il s’agit d’une sorte de coupe ou de bassin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: remit
  rationale: Exprime naturellement la remise effective des biens dans le cadre d’un inventaire solennel.
- source_word: στήσας
  choice: après les avoir pesés
  rationale: Dans ce contexte de métaux précieux inventoriés, le participe renvoie vraisemblablement à leur pesée avant la remise. Le pronom reprend collectivement les biens remis.
- source_word: τάλαντα ἀργυρίου ἑξακόσια πεντήκοντα
  choice: six cent cinquante talents d’argent
  rationale: Conserve l’unité ancienne et la précision numérique du grec.
- source_word: σκεύη ἀργυρᾶ ταλάντων ἑκατόν
  choice: des objets en argent d’une valeur de cent talents
  rationale: σκεύη est générique; « objets » évite de préciser indûment leur forme. La tournure rend le génitif de mesure ou de valeur associé aux cent talents.
- source_word: χρυσίου ταλάντων ἑκατόν
  choice: cent talents d’or
  rationale: Traduction directe qui garde la structure d’inventaire.
- source_word: χρυσώματα
  choice: coupes en or
  rationale: Le terme grec est rare et incertain; le parallèle hébreu favorise un récipient tel qu’une coupe ou un bassin. L’incertitude est signalée en note.
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα σκεύη δέκα
  choice: dix objets en bronze fin et brillant
  rationale: Rend l’idée de dix objets faits d’un bronze de qualité et éclatant, tout en évitant la répétition lourde de σκεύη et χαλκός en français.
