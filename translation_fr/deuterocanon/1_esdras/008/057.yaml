translation_notes:
  register: Français international moderne, digne et lisible. Le style conserve la cadence d’un inventaire ancien sans convertir le talent en mesure moderne. « Objets » rend prudemment le terme générique σκεύη; la précision « coupes » est maintenue avec une note signalant l’incertitude lexicale.
