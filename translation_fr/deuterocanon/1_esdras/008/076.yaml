base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: fr
  text: et de faire apparaître pour nous une lampe dans la maison de notre Seigneur[a], de nous donner de la nourriture au temps de notre esclavage ; et, pendant que nous étions en esclavage[b], nous n’avons pas été abandonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de notre Seigneur » désigne ici le temple.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « pendant que nous étions dans la servitude ». Le grec emploie des mots de la même famille dans les deux propositions.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακαλύψαι
  choice: faire apparaître
  rationale: Le verbe signifie littéralement « découvrir, dévoiler ». « Faire apparaître » conserve l’idée d’une lumière rendue visible tout en étant naturel en français.
- source_word: φωστῆρα
  choice: une lampe
  rationale: Le nom peut désigner un luminaire ou une source de lumière. « Lampe » préserve ici l’image concrète dans la maison du Seigneur.
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: dans la maison de notre Seigneur
  rationale: Cette traduction conserve l’image grecque de la « maison », dont le référent contextuel est le temple.
- source_word: τροφὴν
  choice: de la nourriture
  rationale: Le terme désigne la nourriture ou ce qui entretient la vie. Le choix français reste concret et direct.
- source_word: ἐν τῷ καιρῷ τῆς δουλείας ἡμῶν
  choice: au temps de notre esclavage
  rationale: « Esclavage » exprime clairement la condition de sujétion indiquée par δουλεία.
- source_word: ἐν τῷ δουλεύειν ἡμᾶς
  choice: pendant que nous étions réduits en esclavage
  rationale: La tournure circonstancielle est rendue naturellement et maintient le lien lexical avec δουλεία dans la proposition précédente.
- source_word: οὐκ ἐγκατελείφθημεν
  choice: nous n’avons pas été abandonnés
  rationale: « Abandonnés » rend directement le passif grec et son idée de non-délaissement, dans un français actuel.
theological_decisions:
- issue: Rendu du groupe δουλεία / δουλεύειν
  choice: esclavage / réduits en esclavage
  alternative: servitude / pendant que nous servions
  rationale: Le contexte évoque une sujétion imposée sous domination étrangère. Le choix retenu en préserve la gravité sans atténuer le lien entre les deux termes grecs.
- issue: Interprétation de οἶκος τοῦ κυρίου
  choice: maison de notre Seigneur
  alternative: temple de notre Seigneur
  rationale: Bien que la « maison » désigne ici le temple, conserver l’expression grecque évite de remplacer dans le texte principal l’image source par son explication.
- issue: Image de la lampe rendue visible
  choice: faire apparaître pour nous une lampe
  alternative: dévoiler pour nous une lumière
  rationale: Le texte associe un verbe de dévoilement à un luminaire. Le rendu choisi conserve l’image concrète sans préciser théologiquement si elle signifie restauration, espérance ou reprise du culte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la coordination du passage grec, l’image concrète de la lampe et la répétition du vocabulaire de l’esclavage, avec une ponctuation adaptée à la lisibilité française.
