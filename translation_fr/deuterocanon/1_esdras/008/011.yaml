base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
translation:
  language: fr
  text: Ainsi donc, que tous ceux qui en ont l’intention partent ensemble, conformément à la décision prise par moi et par mes sept amis conseillers[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le langage des cours royales, le titre d’« amis » pouvait désigner des dignitaires officiels, et non simplement des proches du roi.
    reason: cultural_note
lexical_decisions:
- source_word: ὅσοι οὖν
  choice: Ainsi donc, que tous ceux qui
  rationale: ὅσοι désigne l’ensemble des personnes concernées, tandis que οὖν marque la conséquence ou la continuation. Cette formulation conserve les deux éléments dans un français naturel.
- source_word: ἐνθυμοῦνται
  choice: en ont l’intention
  rationale: Le verbe exprime ici une disposition réfléchie, un projet ou une intention, plutôt qu’une simple bonne volonté.
- source_word: συνεξορμάσθωσαν
  choice: partent ensemble
  rationale: L’impératif exprime le départ, et le préverbe συν- indique que celui-ci se fait en compagnie d’autres personnes.
- source_word: καθάπερ δέδοκται
  choice: conformément à la décision prise
  rationale: Dans ce contexte administratif, le parfait impersonnel δέδοκται indique une décision arrêtée; « conformément à » rend la relation établie par καθάπερ sans lourdeur.
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: par moi et par mes sept amis conseillers
  rationale: Le datif désigne les auteurs de la décision. « Amis » peut relever du vocabulaire officiel de cour, et « conseillers » précise leur fonction sans effacer ce terme.
