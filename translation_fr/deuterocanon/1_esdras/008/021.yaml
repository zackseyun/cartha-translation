base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: fr
  text: Que cela soit accompli conformément à la loi de Dieu, pour le Dieu Très-Haut[a], afin que la colère ne s’abatte pas sur le royaume du roi et sur ses fils.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que cela soit exécuté conformément à la loi de Dieu, pour le Dieu Très-Haut. » Le verbe grec peut souligner l’exécution ou l’accomplissement de ce qui est prescrit.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu parallèle d’Esdras 7.23 est plus développé dans sa formulation; il parle de ce qui est ordonné par le Dieu du ciel et avertit aussi contre la colère sur le royaume du roi et ses fils. La présente traduction suit le texte grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: conformément à la loi de Dieu
  rationale: Cette formulation naturelle exprime fidèlement l’idée de conformité à la norme divine, sans réduire νόμος à un simple enseignement.
- source_word: ἐπιτελεσθήτω
  choice: que tout soit accompli
  rationale: L’impératif passif demande l’exécution effective de ce qui est prescrit. « Accompli » conserve la nuance d’exécution menée à son terme, sans ajouter l’idée excessive d’exactitude.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: pour le Dieu Très-Haut
  rationale: Le datif désigne ici naturellement celui au service duquel l’action est accomplie. « Le Dieu Très-Haut » rend clairement le titre grec.
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: afin que … ne s’abatte pas
  rationale: La construction indique le but préventif. Avec « colère », « s’abattre sur » est idiomatique et garde la gravité de la menace.
- source_word: ὀργὴν
  choice: la colère
  rationale: Le contexte suggère la colère divine, mais le texte grec ne répète pas explicitement « de Dieu »; la traduction préserve cette implicitation.
- source_word: εἰς τὴν βασιλείαν τοῦ βασιλέως
  choice: sur le royaume du roi
  rationale: « Royaume » rend directement βασιλεία et maintient la formulation quelque peu redondante du grec.
- source_word: καὶ τῶν υἱῶν
  choice: et sur ses fils
  rationale: Le grec désigne précisément les fils du roi; « ses » rend la relation de manière naturelle en français.
theological_decisions:
- issue: Nature de la colère annoncée
  choice: Conserver « la colère » sans ajouter explicitement « de Dieu »
  alternative: « la colère de Dieu »
  rationale: Le contexte rend très probable une colère divine, mais le complément n’est pas exprimé dans le grec. La traduction laisse intacte cette implicitation théologique.
- issue: Rapport de l’action au Dieu Très-Haut
  choice: « pour le Dieu Très-Haut »
  alternative: « au Dieu Très-Haut »
  rationale: Dans ce contexte administratif et cultuel, « pour » exprime naturellement que l’exécution est faite au service de Dieu, tandis que « à » serait moins idiomatique et pourrait suggérer un autre rapport.
- issue: Portée de ἐπιτελεσθήτω
  choice: « que tout soit accompli »
  alternative: « que cela soit exécuté »
  rationale: « Tout » explicite sobrement le contenu collectif sous-entendu par l’ordre, tandis qu’« accompli » préserve l’idée d’une mise en œuvre complète sans introduire « exactement ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure injonctive conserve le ton du décret royal. « Dieu Très-Haut » est rendu par le titre français naturel « le Dieu Très-Haut »; la menace demeure grave sans explicitation théologique absente du grec.
