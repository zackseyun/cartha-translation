base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: fr
  text: Et moi, le roi Artaxerxès, j’ai ordonné aux trésoriers de Syrie et de Phénicie de remettre avec soin à Esdras, le prêtre et lecteur[b] de la loi du Dieu Très-Haut, tout ce qu’il leur demandera[a], jusqu’à concurrence de cent talents d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « enverra ». Dans ce contexte d’approvisionnement, le verbe désigne probablement l’envoi d’une demande.'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « lecteur ». Dans les traditions parallèles concernant Esdras, celui-ci est souvent appelé « scribe », mais le présent texte grec emploie explicitement « lecteur ».
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξα
  choice: j’ai ordonné
  rationale: L’aoriste exprime un ordre royal donné avec autorité; le passé composé est naturel en français moderne.
- source_word: γαζοφύλαξι
  choice: aux trésoriers
  rationale: Le terme désigne les fonctionnaires chargés des fonds du trésor.
- source_word: ἀποστείλῃ
  choice: demandera
  rationale: Le verbe signifie littéralement « envoyer », mais, dans ce contexte d’approvisionnement, il s’agit vraisemblablement d’envoyer une demande aux trésoriers.
- source_word: ἀναγνώστης
  choice: lecteur
  rationale: Le grec désigne explicitement un lecteur; il ne faut pas lui substituer « scribe » d’après les traditions parallèles.
- source_word: ἐπιμελῶς
  choice: avec soin
  rationale: Cette expression conserve l’idée d’une exécution attentive sans ajouter la notion de rapidité.
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: de la loi du Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve le titre divin et la relation syntaxique du grec.
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: jusqu’à concurrence de cent talents d’argent
  rationale: ἕως fixe ici un plafond; la formulation choisie l’exprime clairement dans le contexte d’une autorisation financière.
- source_word: ἰδοὺ
  choice: non traduit explicitement
  rationale: La particule présentative renforce l’intervention personnelle du roi, déjà rendue par « Et moi »; « voici » serait peu naturel dans cette phrase française.
theological_decisions:
- issue: Titre divin τοῦ θεοῦ τοῦ ὑψίστου
  choice: le Dieu Très-Haut
  alternative: le Dieu, le Très-Haut
  rationale: « Le Dieu Très-Haut » est une désignation claire et digne qui conserve la portée du titre grec sans imposer une interprétation confessionnelle.
- issue: Fonction d’Esdras exprimée par ἀναγνώστης
  choice: lecteur de la loi
  alternative: scribe de la loi
  rationale: Même si des traditions parallèles présentent Esdras comme scribe, le témoin grec emploie ici « lecteur »; cette particularité textuelle doit être préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’autorité de l’ordre royal, la désignation grecque particulière d’Esdras comme lecteur et le plafond financier exprimé par ἕως.
