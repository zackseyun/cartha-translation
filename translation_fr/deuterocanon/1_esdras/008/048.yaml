  text: from the sons of Hanunai and their sons[a], twenty men;
translation:
  language: fr
  text: d’entre les fils de Hanounaï et leurs fils[a], vingt hommes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec conservé porte : « d’entre les fils de Hanounaï et leurs fils, vingt hommes ». Le parallèle hébreu approximatif en Esdras 8.19 nomme plutôt Hashabia et Jeshaïa, parmi les fils de Merari, avec ses frères et leurs fils, soit vingt hommes.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: ceux des fils de Hanounaï
  rationale: La tournure οἱ ἐκ suivie du génitif désigne des personnes issues d’un groupe familial. « Ceux des fils de Hanounaï » conserve explicitement cette valeur et translittère le nom propre d’après le grec.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: leurs fils
  rationale: Le pronom αὐτῶν est au pluriel ; « leurs fils » rend directement le grec conservé sans l’harmoniser avec le parallèle hébreu approximatif.
- source_word: εἴκοσι ἄνδρες
  choice: vingt hommes
  rationale: Dans cette liste de personnes, ἄνδρες désigne des hommes de sexe masculin ; « vingt hommes » est naturel et précis.
theological_decisions:
- issue: Divergence entre le grec et le texte massorétique dans la liste des personnes
  choice: 'Le texte principal suit la désignation familiale grecque : « ceux des fils de Hanounaï et leurs fils, vingt hommes ».'
  alternative: Le parallèle hébreu approximatif nomme Hashabia et Ésaïe parmi les fils de Merari, puis mentionne ses frères et leurs fils, au nombre de vingt.
  rationale: Le grec est la source principale de 1 Esdras et présente ici une identification sensiblement différente. La traduction préserve donc sa formulation, tandis que la divergence substantielle avec l’hébreu est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation légèrement elliptique respecte le caractère de liste du passage ; le point-virgule final maintient sa continuité syntaxique.
