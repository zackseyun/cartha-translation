base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: fr
  text: Et moi, fort de l’appui du Seigneur mon Dieu[a], j’ai pris courage et j’ai rassemblé d’entre les Israélites des hommes pour monter avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu parallèle d’Esdras 7.28 porte « chefs » ou « responsables » au lieu d’« hommes ». Le texte grec de 1 Esdras porte « hommes ».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: j’ai pris courage
  rationale: Cette expression décrit le fait de devenir confiant ou courageux. « J’ai pris courage » est naturel en français moderne et rejoint la nuance de force présente dans le parallèle hébreu.
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: grâce au soutien
  rationale: ἀντίλημψις désigne ici l’aide ou l’appui. Avec κατὰ, la tournure exprime le fondement du courage reçu; « grâce au soutien » rend ce rapport plus naturellement que le calque « selon le soutien ».
- source_word: Κυρίου θεοῦ μου
  choice: du Seigneur mon Dieu
  rationale: Le grec porte Κυρίου. « Le Seigneur mon Dieu » suit directement le témoin grec principal sans remplacer le titre par le nom divin du parallèle hébreu.
- source_word: συνήγαγον
  choice: j’ai rassemblé
  rationale: Traduction directe de l’aoriste, dans un registre courant et digne.
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: parmi les Israélites
  rationale: Le grec indique le groupe au sein duquel ces hommes ont été rassemblés. Cette formulation française évite l’ambiguïté géographique possible de « d’Israël ».
- source_word: ἄνδρας
  choice: des hommes
  rationale: Le grec dit explicitement « hommes ». Le parallèle hébreu porte « chefs » ou « responsables », mais cette variante ne doit pas être introduite dans le texte principal grec.
- source_word: ὥστε συναναβῆναί μοι
  choice: pour qu’ils montent avec moi
  rationale: La construction infinitive exprime ici le but. « Monter » conserve l’idiome du déplacement vers Jérusalem, et la proposition explicite est naturelle en français.
theological_decisions:
- issue: Identité ou statut des personnes rassemblées dans le grec et le parallèle hébreu
  choice: des hommes
  alternative: des chefs / des responsables
  rationale: Le texte principal suit ἄνδρας dans le grec de 1 Esdras. Le parallèle hébreu d’Esdras 7.28 lit רָאשִׁים, « chefs » ou « responsables »; cette différence textuelle est signalée sans harmoniser les témoins.
translation_notes:
  register: Français international moderne, clair et digne. « Grâce au soutien » privilégie une équivalence naturelle tout en conservant l’idée grecque d’aide divine; « parmi les Israélites » explicite une appartenance au peuple plutôt qu’une provenance territoriale.
