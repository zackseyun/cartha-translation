- from: Et moi, j’ai pris courage grâce au soutien du Seigneur mon Dieu[a], et j’ai rassemblé parmi les Israélites des hommes pour qu’ils montent avec moi.
  to: Et moi, fort de l’appui du Seigneur mon Dieu[a], j’ai pris courage et j’ai rassemblé d’entre les Israélites des hommes pour monter avec moi.
  rationale: 'La révision conserve le témoignage grec comme source principale: le narrateur prend courage en raison de l’aide du Seigneur, rassemble des hommes tirés d’Israël, et ceux-ci montent avec lui. Elle améliore seulement la précision de provenance, la correspondance de la construction infinitive et la formulation de la note textuelle.'
