base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: fr
  text: Seigneur, j’ai honte et je suis humilié devant toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος; « Seigneur » conserve l’adresse directe à Dieu dans un registre digne et naturel.
- source_word: ᾔσχυμμαι
  choice: j’ai honte
  rationale: Le parfait exprime un état présent résultant; l’expression française courante « j’ai honte » rend clairement cet état.
- source_word: ἐντέτραμμαι
  choice: je suis confus
  rationale: Le parfait moyen-passif intensifie la honte par l’idée d’abaissement et de confusion. « Je suis confus » maintient la distinction avec le premier verbe sans imposer la notion surtout publique de déshonneur.
- source_word: κατὰ πρόσωπόν σου
  choice: devant toi
  rationale: Littéralement « devant ta face »; en français moderne, « devant toi » exprime naturellement la présence directe de Dieu tout en conservant la portée relationnelle de la formule.
theological_decisions:
- issue: Traduction de l’adresse divine Κύριε
  choice: Seigneur
  alternative: Ô Seigneur
  rationale: Le grec contient un vocatif direct, sans particule correspondant nécessairement à « ô ». « Seigneur » suffit à préserver la solennité de la prière.
- issue: Degré de littéralité de κατὰ πρόσωπόν σου
  choice: devant toi
  alternative: devant ta face
  rationale: « Devant ta face » calque l’image sémitique, mais sonne peu naturel en français international actuel. « Devant toi » conserve sans ambiguïté l’idée de se tenir directement en présence de Dieu.
- issue: Relation entre les deux verbes de honte
  choice: j’ai honte et je suis confus
  alternative: je suis honteux et déshonoré
  rationale: La coordination est conservée afin de ne pas réduire l’intensification du grec à un seul sentiment; les deux expressions françaises restent proches sans être strictement synonymes.
translation_notes:
  register: Français moderne international, sobre et priant. La brièveté et le parallélisme du grec sont conservés; aucun archaïsme ni développement interprétatif n’est ajouté.
