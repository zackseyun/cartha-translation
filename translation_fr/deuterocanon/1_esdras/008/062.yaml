base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: fr
  text: Quand le troisième jour arriva là, l’argent et l’or furent pesés, puis remis dans la maison du Seigneur à Marmothi, fils d’Ourias, le prêtre. Éléazar, fils de Phinéès, était avec lui. Avec eux se trouvaient aussi les lévites Josabès, fils de Jésus, et Moeth, fils de Sabannus[a]. Tout fut compté et pesé, et tout le poids fut consigné à l’instant même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms grecs diffèrent ici de ceux de la tradition massorétique parallèle, qui présente notamment Merémoth fils d’Urie, Éléazar fils de Phinéès, ainsi que des lévites correspondant à Jonathan fils de Josué et à Noadia fils de Binnouï. Le texte principal suit le témoin grec de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: Quand le troisième jour arriva en ce lieu
  rationale: Le génitif absolu exprime la circonstance temporelle, tandis que αὐτόθι renvoie au lieu où ils se trouvaient. Cette formulation conserve le mouvement narratif du grec sans confondre « le troisième jour » avec « après trois jours ».
- source_word: σταθὲν τὸ ἀργύριον καὶ τὸ χρυσίον παρεδόθη
  choice: l’argent et l’or furent pesés, puis remis
  rationale: Le participe passif indique que les biens furent pesés avant leur transfert officiel. « Puis » rend naturellement la succession implicite sans ajouter l’idée plus précise de distribution que pourrait suggérer « pesés séparément ».
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: dans la maison du Seigneur
  rationale: Cette expression conserve l’image biblique du sanctuaire comme maison de Dieu et rend κύριος par « Seigneur ».
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: à Marmothi, fils d’Ourias, le prêtre
  rationale: La séquence au datif désigne vraisemblablement le destinataire, suivi de son patronyme et de sa fonction. Les formes des noms suivent le témoin grec.
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: Tout fut vérifié en nombre et en poids
  rationale: La formule décrit un contrôle comptable complet. « Vérifié » explicite sobrement la fonction administrative de l’énumération et de la pesée, tout en conservant les deux critères du grec.
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: le poids total fut consigné à l’instant même
  rationale: ἐγράφη signale une mise par écrit; « consigné » convient au contexte comptable. αὐτῇ τῇ ὥρᾳ souligne que l’enregistrement eut lieu immédiatement.
theological_decisions:
- issue: Rendu de κύριος dans la désignation du sanctuaire
  choice: Seigneur
  alternative: Éternel
  rationale: Le grec porte κύριος sans reproduire ici directement le tétragramme hébreu. « Seigneur » suit donc le témoin source et évite d’introduire une précision textuelle absente.
- issue: Formes des noms propres divergentes de la tradition massorétique parallèle
  choice: Conserver dans le texte les formes issues du grec
  alternative: Normaliser selon les formes hébraïques plus familières, comme Merémoth fils d’Urie, Jonathan fils de Josué et Noadia fils de Binnouï
  rationale: Le texte de 1 Esdras est ici établi à partir du grec. La note signale la divergence sans remplacer le témoignage principal par celui d’une tradition parallèle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe très longue du grec est répartie en trois phrases pour faciliter la lecture, tout en maintenant l’ordre des opérations et l’identité des responsables. Les noms sont francisés avec des accents lorsque l’usage de lecture française le justifie, sans les harmoniser avec le texte massorétique.
