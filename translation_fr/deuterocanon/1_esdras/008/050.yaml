base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/050.yaml
  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: fr
  text: Là, je proclamai un jeûne devant notre Seigneur pour les jeunes gens.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « Là, je priai — ou : je fis le vœu — d’un jeûne pour les jeunes gens devant notre Seigneur. » Le parallèle hébreu porte : « Là, je proclamai un jeûne […] devant notre Dieu », ce qui éclaire probablement le sens retenu ici.'
    reason: alternative_reading
  - marker: b
    text: 'Dans le parallèle d’Esdras 8.21, l’hébreu ajoute des précisions absentes de cette ligne grecque : le jeûne est proclamé près du fleuve Ahava afin de s’humilier devant Dieu et de lui demander un chemin sûr pour eux, leurs enfants et tous leurs biens.'
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  choice: je proclamai
  rationale: Le verbe grec signifie normalement « prier » ou « faire un vœu », mais la construction avec « un jeûne » est difficile. Le parallèle hébreu porte « je proclamai un jeûne » et éclaire vraisemblablement ici le sens contextuel; l’écart est signalé en note.
- source_word: ἐκεῖ
  choice: Là
  rationale: Adverbe de lieu simple, conservé pour assurer la continuité narrative.
- source_word: νηστείαν
  choice: un jeûne
  rationale: Avec « proclamer », cette formulation française est naturelle et correspond au nom grec ainsi qu’au parallèle hébreu.
- source_word: τοῖς νεανίσκοις
  choice: pour les jeunes gens
  rationale: Le datif grec est conservé sans tenter de résoudre sa relation exacte avec le jeûne. « Jeunes gens » est actuel, digne et moins marqué que « jeunes hommes ».
- source_word: ἔναντι κυρίου ἡμῶν
  choice: devant notre Seigneur
  rationale: Rend directement l’expression grecque et maintient le titre divin propre au témoin principal.
theological_decisions:
- issue: Divergence gréco-hébraïque concernant le verbe principal
  choice: Rendre εὐξάμην contextuellement par « je proclamai »
  alternative: « je priai » ou « je fis le vœu »
  rationale: Le grec pris isolément favorise « prier » ou « faire un vœu », mais son association avec « un jeûne » est abrupte. Le parallèle hébreu fournit la formule cohérente « proclamer un jeûne ». La note conserve explicitement la difficulté du grec.
- issue: Titre divin
  choice: « notre Seigneur »
  alternative: « notre Dieu »
  rationale: Le grec, témoin principal de 1 Esdras, lit κυρίου ἡμῶν. Le parallèle hébreu diffère et sa leçon est mentionnée en note sans remplacer celle du grec.
- issue: Place et portée de τοῖς νεανίσκοις
  choice: Conserver « pour les jeunes gens » après « devant notre Seigneur »
  alternative: « parmi les jeunes gens »
  rationale: Le datif permet plusieurs nuances. La traduction maintient la lecture « pour » retenue par la couche de consultation tout en évitant d’ajouter une explication absente du grec.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique digne sans archaïsme lexical. La ponctuation finale remplace la virgule de l’extrait anglais, le verset étant présenté isolément.
