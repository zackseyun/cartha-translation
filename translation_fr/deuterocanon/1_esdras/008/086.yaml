base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: fr
  text: 'Ne t’es-tu pas irrité contre nous, au point de nous détruire sans rien laisser de nous : ni racine, ni descendance[a], ni nom ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « semence » ; le mot désigne ici la postérité ou la descendance.'
    reason: Précise l’image grecque sous-jacente tout en maintenant une formulation claire dans le texte principal.
lexical_decisions:
- source_word: οὐχὶ
  choice: Ne… pas… ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; cette tournure en restitue naturellement la force en français.
- source_word: ὠργίσθης ἡμῖν
  choice: t’es-tu irrité contre nous
  rationale: Rend l’aoriste de ὀργίζω et le datif de la personne visée, sans renforcer indûment l’intensité par « mis en fureur ».
- source_word: ἀπολέσαι ἡμᾶς
  choice: au point de nous détruire
  rationale: Exprime ici le résultat ou l’aboutissement de la colère ; « au point de » produit une phrase française naturelle sans trancher excessivement entre but et conséquence.
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: sans laisser subsister
  rationale: 'Restitue l’aboutissement extrême de la destruction : rien de ce qui assurerait la continuité du peuple ne demeure.'
- source_word: ῥίζαν
  choice: racine
  rationale: Conserve l’image concrète grecque d’une souche ou d’un reste capable de survivre.
- source_word: σπέρμα
  choice: descendance
  rationale: Dans ce contexte de continuité familiale et collective, « descendance » communique clairement le sens de σπέρμα en français moderne ; le sens littéral est signalé en note.
- source_word: ὄνομα ἡμῶν
  choice: nom de nous / de nous… nom
  rationale: 'Le texte principal place « de nous » avant l’énumération afin de faire porter naturellement le génitif ἡμῶν sur les trois noms : racine, descendance et nom.'
theological_decisions:
- issue: Portée de la destruction évoquée dans la prière pénitentielle
  choice: Conserver les trois images concrètes — racine, descendance et nom — comme expression d’une disparition totale envisagée.
  alternative: Rendre explicitement l’idée par « aucun reste, aucun descendant ni aucun souvenir ».
  rationale: Le grec ne formule pas abstraitement une doctrine du reste, mais emploie une triade concrète. La traduction préserve donc l’image et la tension du jugement sans expliciter davantage son implication théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et l’image de la « racine » sont conservées ; « descendance » évite l’ambiguïté peu naturelle de « semence » dans l’usage courant.
