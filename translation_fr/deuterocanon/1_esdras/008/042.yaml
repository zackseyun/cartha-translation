base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
translation:
  language: fr
  text: Après les avoir rassemblés au fleuve appelé le Fleuve[a], nous y avons campé pendant trois jours, puis je les ai examinés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au fleuve appelé le Fleuve ». Cette formulation semble conserver une désignation de lieu plutôt qu’une simple description.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec passe de « nous avons campé » à « je les ai examinés » : l’action collective est suivie d’un examen personnel par le narrateur.'
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγών
  choice: Après les avoir rassemblés
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux; cette tournure rend clairement la succession des actions.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: près de ce qu’on appelle le Fleuve
  rationale: λεγόμενον signifie « appelé »; Ποταμόν, littéralement « Fleuve », paraît fonctionner comme une désignation géographique. « Près de » convient naturellement au rassemblement et au campement au bord d’un cours d’eau, tout en conservant la formulation inhabituelle du grec.
- source_word: παρενεβάλομεν
  choice: nous y avons campé
  rationale: Le verbe signifie établir un camp; cette formulation est naturelle en français moderne.
- source_word: αὐτόθι
  choice: y
  rationale: L’adverbe renvoie simplement au lieu qui vient d’être nommé.
- source_word: ἡμέρας τρεῖς
  choice: pendant trois jours
  rationale: L’accusatif indique ici une durée.
- source_word: κατέμαθον αὐτούς
  choice: je les ai examinés
  rationale: Dans ce contexte, le verbe indique qu’Esdras a passé en revue les personnes rassemblées; « examinés » reste naturel sans préciser indûment la méthode ou le but.
theological_decisions:
- issue: Changement de personne narrative dans le verset
  choice: Conserver le passage de « nous avons campé » à « je les ai examinés »
  alternative: Uniformiser en « nous les avons examinés »
  rationale: Le grec passe explicitement de la première personne du pluriel à la première personne du singulier. La traduction préserve cette distinction entre l’action du groupe et l’examen personnel du narrateur.
translation_notes:
  register: Français international moderne, clair et digne. La désignation inhabituelle « le Fleuve » et le changement de personne du récit sont conservés plutôt que lissés.
