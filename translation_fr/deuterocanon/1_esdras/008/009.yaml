base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/009.yaml
  text: King Artaxerxes to Ezra the priest and reader of the law of the Lord[a], greetings.
translation:
  language: fr
  text: 'Le roi Artaxerxès à Esdras, prêtre et lecteur de la loi du Seigneur[a] : salutations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « lecteur de la loi du Seigneur » ; le texte hébreu parallèle d’Esdras 7.12 dit « scribe de la loi du Dieu des cieux ».
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς Ἀρταξέρξης
  choice: Le roi Artaxerxès
  rationale: Cette formulation française naturelle conserve le titre royal et la translittération française usuelle du nom perse dans l’adresse épistolaire.
- source_word: Ἔσρᾳ
  choice: Esdras
  rationale: « Esdras » est la forme française traditionnelle et reconnaissable du nom dans le contexte biblique.
- source_word: τῷ ἱερεῖ
  choice: prêtre
  rationale: Le datif apposé précise la fonction d’Esdras; le français n’exige pas ici d’article après le nom propre.
- source_word: ἀναγνώστῃ
  choice: lecteur
  rationale: Le grec désigne directement un lecteur ou récitant; ce choix évite d’harmoniser le texte avec le parallèle hébreu qui porte « scribe ».
- source_word: τοῦ νόμου Κυρίου
  choice: de la loi du Seigneur
  rationale: Le génitif dépend de « lecteur ». « Seigneur » rend Κυρίου selon l’usage biblique français, avec les articles requis par la syntaxe française.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans une ouverture de lettre, l’infinitif χαίρειν est une formule de salutation. « Salut ! » en restitue brièvement la fonction dans un registre digne et actuel.
theological_decisions:
- issue: ἀναγνώστῃ dans le grec contre « scribe » dans le parallèle hébreu d’Esdras 7.12
  choice: lecteur
  alternative: scribe
  rationale: Le texte grec de 1 Esdras est ici le témoin principal et porte explicitement ἀναγνώστῃ. Le parallèle hébreu éclaire l’histoire textuelle, mais ne doit pas remplacer la lecture grecque; la divergence est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reproduit la forme concise d’une adresse royale, tandis que les deux-points rendent explicite le passage à la salutation.
