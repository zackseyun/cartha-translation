base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: fr
  text: 'Parmi les fils de Sophotius : Zaraïas, fils de Michaël[a], et avec lui soixante-dix hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les noms et le nombre donnés ici en grec diffèrent de ceux du parallèle approximatif d’Esdras 8.6 dans le texte hébreu, qui porte : « parmi les fils d’Adîn : Ébed, fils de Jonathan, et avec lui cinquante hommes ». Comme 1 Esdras est ici traduit d’après le témoin grec, le texte principal en conserve les noms et le nombre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les fils de
  rationale: La préposition ἐκ suivie du génitif indique ici qu’une personne est tirée d’un groupe. « Parmi les fils de » restitue naturellement cette formule de liste généalogique.
- source_word: Σοφοτίου
  choice: Sophotius
  rationale: Le nom propre est translittéré d’après la forme grecque, témoin principal, sans harmonisation avec le parallèle hébreu approximatif.
- source_word: Ζαραίας
  choice: Zaraias
  rationale: La translittération suit directement la forme grecque au nominatif et évite d’importer un nom différent depuis le texte hébreu parallèle.
- source_word: Μειχαήλου
  choice: fils de Michaël
  rationale: Dans cette liste généalogique, le génitif isolé indique naturellement la filiation. L’ajout de « fils de » rend ce rapport explicite en français.
- source_word: μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Cette tournure courante d’accompagnement relie le chef nommé au groupe recensé avec lui.
- source_word: ἄνδρες
  choice: hommes
  rationale: ἄνδρες désigne ici des hommes, comptés comme membres du groupe accompagnant Zaraias.
- source_word: ἑβδομήκοντα
  choice: soixante-dix
  rationale: Traduction directe du nombre cardinal grec.
