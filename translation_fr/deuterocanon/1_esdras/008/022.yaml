base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: fr
  text: Et il vous est aussi déclaré qu’aucun impôt ni aucune autre charge ne doit être imposé à aucun des prêtres, des lévites, des chantres du Temple, des gardiens des portes, des serviteurs du Temple ou des personnes chargées des affaires de ce Temple[a], et que personne n’a le pouvoir de leur imposer quoi que ce soit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Personnes chargées des affaires de ce Temple » traduit un terme qui peut désigner ceux qui s’occupent de ses affaires ou de son administration ; « responsables de ce Temple » est également possible, mais pourrait paraître trop restrictif.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: il vous est aussi déclaré
  rationale: Dans le contexte d’un décret officiel, le passif de λέγω exprime une déclaration administrative plutôt qu’une simple parole.
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: à aucun des prêtres
  rationale: Avec la négation, cette tournure française exprime naturellement la portée exhaustive de πᾶσι.
- source_word: Λευείταις
  choice: lévites
  rationale: Désignation française usuelle de ce groupe attaché au service cultuel.
- source_word: ἱεροψάλταις
  choice: chantres du Temple
  rationale: Le composé désigne des chanteurs ayant une fonction cultuelle; « chantres du Temple » est clair et digne en français actuel.
- source_word: θυρωροῖς
  choice: gardiens des portes
  rationale: Cette expression rend naturellement le rôle du personnel chargé des entrées du Temple.
- source_word: ἱεροδούλοις
  choice: serviteurs du Temple
  rationale: Le terme désigne des personnes vouées au service du sanctuaire; « serviteurs » évite de préciser indûment leur statut juridique.
- source_word: πραγματικοῖς τοῦ ἱεροῦ τούτου
  choice: personnes chargées des affaires de ce Temple
  rationale: πραγματικός peut désigner celui qui s’occupe d’affaires ou de tâches administratives; cette formulation préserve cette largeur sans limiter le groupe à des « fonctionnaires ».
- source_word: μηδεμία φορολογία
  choice: aucun impôt
  rationale: φορολογία désigne une obligation fiscale ou un tribut; « impôt » est le terme français courant approprié.
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: ni aucune autre charge
  rationale: Bien que ἐπιβουλή puisse ailleurs évoquer un dessein hostile, son association avec φορολογία dans cette disposition administrative favorise le sens d’une charge ou imposition supplémentaire, sans la réduire nécessairement à un prélèvement fiscal.
- source_word: γίγνηται
  choice: ne doit être imposé
  rationale: Le contexte juridique indique l’établissement d’une obligation sur ces personnes plutôt que sa simple survenue.
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: personne n’a le pouvoir de leur en imposer
  rationale: La formulation conserve l’idée d’autorité légale exprimée par ἐξουσία et renvoie aux charges précédemment interdites.
