base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/043.yaml
  text: And from the priests and from the Levites I found no one there[a].
translation:
  language: fr
  text: Parmi les prêtres et parmi les lévites, je ne trouvai personne là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le parallèle hébreu massorétique fourni pour cet endroit ne correspond pas étroitement au grec ; la traduction suit donc ici le texte grec, qui est le témoin principal.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: parmi les prêtres
  rationale: Dans ce contexte de recherche au sein d’un groupe, « parmi » exprime naturellement la valeur de ἐκ sans donner à tort l’idée d’un mouvement depuis un lieu.
- source_word: ἐκ τῶν Λευειτῶν
  choice: parmi les lévites
  rationale: La reprise implicite de « parmi » rend le parallélisme grec avec naturel; « lévites » est la désignation française usuelle.
- source_word: οὐχ εὗρον
  choice: je ne trouvai personne
  rationale: La première personne du singulier de εὗρον est conservée. « Personne » explicite en français l’objet humain sous-entendu par le grec.
- source_word: ἐκεῖ
  choice: là-bas
  rationale: Ce choix rend l’adverbe locatif et renvoie naturellement au lieu où le groupe était rassemblé.
theological_decisions:
- issue: Désaccord majeur entre le témoin grec et le parallèle massorétique approximatif fourni
  choice: Traduire la proposition grecque comme texte principal.
  alternative: Reconstruire le verset à partir de la notice massorétique concernant les descendants de Bigvaï.
  rationale: Le grec est ici le témoin source principal. Le parallèle hébreu fourni correspond à une autre entrée de liste et n’est pas assez proche pour modifier la traduction, mais l’écart doit être signalé.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans rendre la phrase archaïque; la coordination grecque est allégée en français pour éviter une répétition pesante.
