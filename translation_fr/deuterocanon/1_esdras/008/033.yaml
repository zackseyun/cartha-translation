lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les descendants de
  rationale: Dans cette liste généalogique, l’expression désigne les membres d’un groupe familial. « Parmi les descendants de » est naturel en français moderne et évite de suggérer qu’il s’agit nécessairement de fils directs.
- source_word: Λάμ
  choice: Lam
  rationale: Nom propre translittéré d’après le grec, sans harmonisation avec le parallèle massorétique divergent.
- source_word: Ἐσίας
  choice: Esias
  rationale: Nom propre translittéré directement de la forme grecque.
- source_word: Γοθολίου
  choice: fils de Gotholias
  rationale: Le génitif du nom propre est compris comme une filiation, conformément à la formule elliptique habituelle des listes généalogiques; l’explicitation donne un français clair.
- source_word: καὶ μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Rendu direct de l’accompagnement, approprié au contexte d’un dénombrement.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: soixante-dix hommes
  rationale: ἄνδρες désigne ici des hommes dans une liste de personnes; le nombre suit fidèlement le témoin grec.
