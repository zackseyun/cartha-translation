  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
translation:
  language: fr
  text: 'Des fils de Lam : Esias, fils de Gotholias[a], et avec lui soixante-dix hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle approximatif d’Esdras 8.3 dans le texte massorétique présente d’autres noms et un autre nombre : « des fils de Shecania, fils de Yahaziel, et avec lui trois cents hommes de sexe masculin ». Comme 1 Esdras est traduit ici d’après le témoin grec, le texte principal conserve les noms grecs et le nombre de soixante-dix.'
