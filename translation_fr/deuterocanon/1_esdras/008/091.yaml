revisions:
- from: À ce sujet, prêtons serment au Seigneur de renvoyer[a] toutes nos épouses issues de peuples étrangers, avec leurs enfants, conformément à ta décision et à celle de tous ceux qui obéiront à la loi du Seigneur.[b]
  to: À ce sujet, prenons l’engagement par serment envers le Seigneur de renvoyer[a] toutes nos épouses issues de peuples étrangers, avec leurs enfants, comme tu l’as décidé, ainsi que tous ceux qui obéiront à la loi du Seigneur.[b]
  rationale: La révision évite d’ajouter explicitement une « décision » attribuée aux personnes qui obéissent à la loi. Elle maintient une formulation française lisible tout en signalant dans la note l’ellipse et l’ambiguïté du grec. Le choix « engagement par serment » restitue clairement le substantif ὁρκωμοσία.
