  verdict: revise
  source_fidelity: Le texte français rend correctement l’exhortation au serment, le renvoi des épouses d’origine étrangère avec leurs enfants, et le registre juridique. Toutefois, « conformément à ta décision et à celle de tous ceux qui obéiront » impose une structure (« celle de ») qui n’est pas exprimée par le grec elliptique. Il est plus sûr de conserver l’ambiguïté par une coordination moins interprétative.
  naturalness: La formulation est naturelle en français international moderne. « Prêtons serment » convient, mais « prenons l’engagement par serment » rend plus explicitement ὁρκωμοσία sans lourdeur excessive.
  terminology: « Seigneur », « épouses », « peuples étrangers » et « loi du Seigneur » sont appropriés. « Renvoyer » est recevable pour ἐκβαλεῖν, à condition que la note maintienne les sens plus vigoureux possibles.
  issues:
