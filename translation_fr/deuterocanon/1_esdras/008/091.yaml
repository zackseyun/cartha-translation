    issue: Le raccord « et à celle de tous ceux qui obéiront » explicite une seconde « décision » absente du grec.
    rationale: Après ὡς ἐκρίθη σοι, le segment καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου est grammaticalement condensé. La traduction ne devrait pas présenter comme certaine l’ellipse de « décision ».
  - severity: low
    issue: La note b dit « jugé pour toi », alors que σοι peut aussi être compris, dans le contexte, comme « par toi ».
    rationale: La note doit préserver l’ambiguïté du datif plutôt que privilégier une seule lecture littérale.
