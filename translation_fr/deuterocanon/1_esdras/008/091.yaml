base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: fr
  text: À ce sujet, prenons l’engagement par serment envers le Seigneur de renvoyer[a] toutes nos épouses issues de peuples étrangers, avec leurs enfants, comme tu l’as décidé, ainsi que tous ceux qui obéiront à la loi du Seigneur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de chasser » ou « d’expulser ».
    reason: Le verbe grec ἐκβάλλω peut exprimer une action plus forte que « renvoyer ».
  - marker: b
    text: 'Le grec est condensé : littéralement, « comme cela a été jugé pour toi, et tous ceux qui obéiront à la loi du Seigneur ». Le datif traduit par « tu » et le lien exact de la dernière proposition restent incertains.'
    reason: La syntaxe du témoin grec est elliptique; la traduction conserve autant que possible cette incertitude sans produire une phrase française incohérente.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: À ce sujet
  rationale: Cette expression introduit l’affaire précise dont il est question; « À ce sujet » est naturel en français tout en conservant ce lien contextuel.
- source_word: γενέσθω ἡμῖν ὁρκωμοσία
  choice: prêtons serment
  rationale: Le grec dit littéralement qu’un serment « advienne pour nous ». La tournure française exprime clairement et sans ajout l’engagement collectif demandé.
- source_word: πρὸς τὸν κύριον
  choice: au Seigneur
  rationale: Dans le contexte d’un serment, la préposition marque celui envers qui l’engagement est pris; « au Seigneur » est idiomatique et proche du grec.
- source_word: ἐκβαλεῖν
  choice: renvoyer
  rationale: Le verbe peut signifier chasser ou expulser. « Renvoyer » conserve ici l’idée de faire partir les épouses sans accentuer indûment la violence du terme; une note signale les possibilités plus fortes.
- source_word: πάσας τὰς γυναῖκας ἡμῶν
  choice: toutes nos épouses
  rationale: Dans ce contexte matrimonial, γυναῖκες désigne les épouses plutôt que les femmes en général.
- source_word: τὰς ἐκ τῶν ἀλλογενῶν
  choice: issues de peuples étrangers
  rationale: L’expression indique l’origine dans d’autres peuples. Cette formulation évite d’importer la catégorie théologique plus tardive de « païennes » ou de « non-Juives ».
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: avec leurs enfants
  rationale: La traduction rend directement l’accompagnement exprimé par σύν, dans un français fluide.
- source_word: ὡς ἐκρίθη σοι
  choice: conformément à ta décision
  rationale: Le passif grec avec le datif est difficile à reproduire naturellement. Le contexte donne à la formule un sens judiciaire ou décisionnel lié au destinataire.
- source_word: καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου
  choice: et à celle de tous ceux qui obéiront à la loi du Seigneur
  rationale: La proposition grecque est syntaxiquement comprimée après καί. La traduction fournit le parallèle implicite avec « décision » et conserve le futur de πειθαρχήσουσιν.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte grec deutérocanonique
  choice: Seigneur
  alternative: Maître
  rationale: Le terme désigne ici le Dieu d’Israël dans un cadre d’alliance et de loi; « Seigneur » maintient le registre biblique sans introduire une interprétation confessionnelle particulière.
- issue: Portée de l’appellation ἀλλογενῶν
  choice: peuples étrangers
  alternative: étrangers; non-Juifs; païens
  rationale: Le mot décrit l’origine dans un autre peuple. « Peuples étrangers » préserve cette dimension ethnique et sociale sans lui imposer une distinction théologique ultérieure.
- issue: Lien syntaxique de καὶ ὅσοι πειθαρχήσουσιν
  choice: la décision est aussi attribuée à tous ceux qui obéiront à la loi
  alternative: la proposition pourrait coordonner plus librement les personnes obéissantes sans répéter explicitement l’idée de décision
  rationale: Le grec transmis est elliptique et permet difficilement une reproduction française mot à mot. Le texte principal adopte le raccord le plus cohérent, tandis que la note conserve l’ambiguïté de la formulation.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset prend la forme d’une exhortation collective. « Épouses » clarifie le cadre matrimonial, et la note finale préserve la tension syntaxique du grec au lieu de la dissimuler.
