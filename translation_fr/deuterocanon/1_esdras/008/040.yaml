lexical_decisions:
- source_word: μετʼ αὐτῶν
  choice: avec eux
  rationale: La préposition μετά avec le génitif exprime ici l’accompagnement. « Avec eux » rend simplement et naturellement la coordination grecque.
- source_word: ἄνδρες
  choice: hommes
  rationale: Ἄνδρες désigne ici des hommes de sexe masculin, et non des personnes en général; « hommes » conserve cette précision.
- source_word: ἑβδομήκοντα
  choice: soixante-dix
  rationale: Le texte grec porte clairement le nombre soixante-dix. Cette leçon est traduite directement, malgré la différence avec le parallèle hébreu.
