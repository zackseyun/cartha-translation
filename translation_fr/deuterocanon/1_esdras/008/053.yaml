base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: fr
  text: En effet, nous avions dit au roi que la force de notre Seigneur serait avec ceux qui le recherchent pour tout rétablissement[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour tout redressement ». L’expression grecque est inhabituelle; elle peut aussi être comprise plus largement au sens de « pour toute réussite » ou « pour une issue favorable ».
    reason: lexical_alternative
  - marker: b
    text: 'Le parallèle hébreu diffère sensiblement ici : il parle de jeûner et de rechercher Dieu, au lieu de reprendre ce qui avait été dit au roi. La présente traduction suit le texte grec de 1 Esdras comme témoin principal.'
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: nous avions dit
  rationale: Le plus-que-parfait rend naturellement en français une déclaration faite antérieurement dans le déroulement du récit; «dire au roi» respecte aussi la construction avec le destinataire.
- source_word: Ἰσχὺς
  choice: la force
  rationale: Ἰσχύς désigne la force ou la puissance. «La force» conserve le sens concret de capacité agissante sans l'élargir inutilement.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Dans ce contexte juif grec, κύριος désigne Dieu avec révérence. «Notre Seigneur» est naturel et maintient la continuité de l'usage de la Septante.
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: avec ceux qui le recherchent
  rationale: ἐπιζητέω peut exprimer une recherche soutenue. «Rechercher» rend cette nuance tout en restant clair en français moderne.
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: pour tout rétablissement
  rationale: ἐπανόρθωσις évoque le rétablissement, la remise en ordre ou le redressement. Cette formulation conserve le caractère inhabituel et l'ambiguïté de l'expression grecque sans la réduire à la seule idée de réussite.
theological_decisions:
- issue: Traduction de κύριος lorsqu'il désigne Dieu
  choice: Seigneur
  alternative: Maître
  rationale: Le référent est le Dieu d'Israël; «Seigneur» préserve la révérence et l'usage traditionnel de κύριος sans introduire une lecture confessionnelle particulière.
- issue: Portée de εἰς πᾶσαν ἐπανόρθωσιν
  choice: pour tout rétablissement
  alternative: pour toute réussite
  rationale: Le grec contient explicitement l'idée de remise en état. La traduction principale la conserve malgré la tournure difficile, tandis que la note signale les interprétations plus larges sans harmoniser le texte avec le parallèle hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation légèrement inhabituelle « pour tout rétablissement » est maintenue afin de préserver l'ambiguïté réelle du grec; les lectures plus idiomatiques figurent en note.
