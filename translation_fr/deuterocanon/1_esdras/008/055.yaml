base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/055.yaml
  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
translation:
  language: fr
  text: Je mis à part, parmi les chefs des prêtres, douze hommes, ainsi qu’Ésérébias[a] et Asoamias[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ésérébias correspond probablement au nom hébreu Shérébia dans le texte parallèle.
    reason: alternative_reading
  - marker: b
    text: Asoamias correspond probablement au nom hébreu Hashabia dans le texte parallèle.
    reason: alternative_reading
  - marker: c
    text: Le texte grec est ici plus court que le passage parallèle d’Esdras 8.24, qui donne d’autres noms avant de poursuivre avec la pesée de l’argent, de l’or et des objets.
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: Je mis à part
  rationale: Cette expression conserve à la fois l’idée de séparation d’avec un groupe et celle de désignation pour une tâche particulière.
- source_word: φυλάρχων
  choice: chefs
  rationale: Le terme désigne littéralement des chefs de tribu ou de clan. Dans ce contexte sacerdotal, « chefs » est naturel et n’impose pas une structure familiale plus précise que le grec.
- source_word: τῶν ἱερέων
  choice: des prêtres
  rationale: 'Le génitif qualifie le plus naturellement les chefs : il s’agit de chefs appartenant au groupe des prêtres.'
- source_word: ἄνδρας δέκα δύο
  choice: douze hommes
  rationale: ἄνδρας désigne ici explicitement des hommes, représentants du groupe sacerdotal.
- source_word: Ἐσερεβίαν
  choice: Ésérébias
  rationale: Le nom est translittéré d’après le grec, témoin principal de 1 Esdras, tout en signalant en note son équivalent probable dans le texte hébreu parallèle.
- source_word: Ἀσοαμίαν
  choice: Asoamias
  rationale: Le nom suit la forme grecque du témoin principal; son équivalent probable dans le texte hébreu parallèle est indiqué en note.
theological_decisions:
- issue: Rapport entre les douze hommes et les deux hommes nommés
  choice: ainsi qu’Ésérébias et Asoamias
  alternative: dont Ésérébias et Asoamias
  rationale: La coordination grecque par καί ne précise pas explicitement si les deux hommes nommés font partie des douze ou s’y ajoutent. « Ainsi que » préserve cette tension plutôt que d’identifier sans réserve les noms comme inclus dans les douze.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec sans être artificielle; les noms propres suivent le témoin grec principal, tandis que les formes hébraïques parallèles sont conservées en notes.
