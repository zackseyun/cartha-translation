base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: fr
  text: Ils remirent les décrets du roi aux administrateurs royaux et aux gouverneurs de Syrie et de Phénicie, et honorèrent la nation et le sanctuaire du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ils glorifièrent la nation et le sanctuaire du Seigneur ».'
    reason: Alternative lexicale pour ἐδόξασαν.
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: remirent
  rationale: Le verbe désigne ici la transmission officielle des décrets aux autorités; « remirent » est naturel et garde la valeur administrative.
- source_word: τὰ προστάγματα
  choice: les décrets
  rationale: Le nom renvoie à des ordres officiels du roi; « décrets » exprime clairement leur force gouvernementale.
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: aux administrateurs royaux
  rationale: Dans ce contexte impérial, οἰκονόμοι désigne des responsables de gestion; « administrateurs royaux » est plus immédiatement compréhensible que « intendants » tout en évitant le sens trop étroit de « trésoriers ».
- source_word: τοῖς ἐπάρχοις
  choice: aux gouverneurs
  rationale: Le terme désigne des autorités provinciales; « gouverneurs » est l'équivalent français courant et accessible.
- source_word: ἐδόξασαν
  choice: honorèrent
  rationale: Avec pour objets la nation et le sanctuaire, le verbe évoque ici l'honneur ou la distinction accordés, plutôt qu'une glorification cultuelle.
- source_word: τὸ ἔθνος
  choice: la nation
  rationale: Le terme présente le peuple juif comme une collectivité nationale; « nation » conserve cette dimension collective et politique.
- source_word: τὸ ἱερὸν
  choice: le sanctuaire
  rationale: ἱερόν peut désigner le lieu ou l'ensemble sacré; « sanctuaire » préserve cette portée sans imposer le sens architectural plus large de « temple ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le témoin grec principal emploie κύριος; « Seigneur » le traduit directement sans substituer la forme réservée au tétragramme hébreu.
theological_decisions:
- issue: Traduction de κύριος dans un texte grec deutérocanonique
  choice: du Seigneur
  alternative: de l’Éternel / du SEIGNEUR
  rationale: Le texte source grec porte κύριος et non le tétragramme hébreu; « Seigneur » respecte donc le témoin principal sans reconstruire une forme divine absente.
- issue: Sens de ἐδόξασαν avec des objets non divins
  choice: honorèrent la nation et le sanctuaire
  alternative: glorifièrent la nation et le sanctuaire
  rationale: « Honorèrent » évite de suggérer un acte d'adoration tout en conservant l'idée d'estime et de distinction. La possibilité plus littérale est signalée en note.
- issue: Référent du sujet implicite de ἐδόξασαν
  choice: ceux-ci, c’est-à-dire les administrateurs et les gouverneurs
  alternative: ils, c’est-à-dire les porteurs des décrets
  rationale: Le grec laisse le sujet du second verbe implicite et peut grammaticalement prêter à discussion. Le contexte administratif favorise les autorités comme agents de l'honneur accordé; l'explicitation française évite une lecture où les messagers honoreraient eux-mêmes la nation et le sanctuaire, tout en signalant l'ambiguïté en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Administrateurs royaux » privilégie la compréhension actuelle; « ceux-ci » clarifie le référent contextuellement probable, tandis que la note conserve l'ambiguïté grecque.
