base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: fr
  text: 'Jéchonias, fils de Jéélos, l’un des fils d’Israël, éleva la voix et dit à Esdras : « Nous avons péché contre le Seigneur, et des femmes étrangères, venues des peuples du pays, se sont établies[a]. Et maintenant, il reste de l’espoir pour tout Israël[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit que ces femmes « se sont établies » ; le passage parallèle d’Esdras 10.2 dit plus explicitement : « nous avons épousé des femmes étrangères parmi les peuples du pays ».'
    reason: alternative_reading
  - marker: b
    text: 'La dernière proposition grecque est difficile : elle ne contient pas de mot explicite pour « espoir » et sa formulation avec « au-dessus » est obscure dans ce contexte. La traduction retient le sens probable éclairé par le passage parallèle d’Esdras 10.2 : « maintenant encore, il y a de l’espoir pour Israël à ce sujet ».'
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσας
  choice: éleva la voix
  rationale: Cette expression naturelle en français garde la force publique et pressante du participe grec sans suggérer nécessairement un cri inarticulé.
- source_word: Ἰεχονίας Ἰεήλου
  choice: Jéchonias, fils de Jéélos
  rationale: Les noms suivent de près les formes grecques, avec une graphie adaptée au français. Le génitif Ἰεήλου est compris comme indiquant la filiation, ce que confirme le parallèle d’Esdras 10.2.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: l’un des fils d’Israël
  rationale: La formulation conserve l’expression identitaire et généalogique du grec tout en étant idiomatique en français.
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: Nous avons péché contre le Seigneur
  rationale: Le passé composé convient à l’aveu actuel d’une faute commise, et « contre » rend l’idiome grec εἰς avec ἁμαρτάνω.
- source_word: γυναῖκες ἀλλογενεῖς
  choice: des femmes étrangères
  rationale: ἀλλογενεῖς désigne ici des femmes appartenant à d’autres peuples. « Étrangères » est clair, actuel et n’introduit pas de terminologie confessionnelle ultérieure.
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: venues des peuples du pays
  rationale: « Peuples » rend bien ἔθνη dans ce cadre et évite les connotations chrétiennes plus tardives de « païens » ou « nations païennes ».
- source_word: κατῴκησαν
  choice: se sont établies parmi nous
  rationale: Le verbe signifie habiter ou s’établir. « Parmi nous » explicite l’intégration sociale impliquée par le contexte, tout en laissant une note signaler que le parallèle hébreu parle plus précisément de mariages.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: Mais maintenant, il y a encore de l’espoir pour tout Israël
  rationale: La leçon grecque transmise est obscure et ne contient pas de terme explicite pour « espoir ». Le sens retenu s’appuie prudemment sur le parallèle d’Esdras 10.2 et est signalé en note plutôt que présenté comme une équivalence littérale certaine.
theological_decisions:
- issue: Traduction du titre divin κύριον
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: La source immédiate est grecque et porte κύριον. « Seigneur » traduit directement ce titre sans reconstruire dans le texte français le tétragramme hébreu.
- issue: Interprétation de la présence des femmes étrangères
  choice: se sont établies parmi nous
  alternative: nous avons épousé des femmes étrangères
  rationale: La traduction suit le verbe du témoin grec, tout en indiquant en note la formulation matrimoniale explicite du parallèle hébreu. Elle évite ainsi de remplacer silencieusement la source principale par le parallèle.
- issue: Interprétation de la dernière proposition difficile
  choice: il y a encore de l’espoir pour tout Israël
  alternative: maintenant, tout Israël est au-dessus / il subsiste quelque chose pour tout Israël
  rationale: Le grec transmis est grammaticalement traduisible mot à mot mais sémantiquement obscur dans ce contexte. Le parallèle d’Esdras 10.2 permet de restituer un sens cohérent, tandis que la note préserve l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité d’un aveu public sans archaïsmes. Les formes des noms propres sont francisées à partir du grec, et les deux divergences importantes avec le parallèle hébreu sont rendues visibles par des notes.
