    issue: Ajout de « parmi nous »
    rationale: κατῴκησαν signifie « elles se sont établies / ont habité » ; le complément « parmi nous » est contextuellement possible mais n’est pas présent dans le grec. La note peut signaler la divergence matrimoniale avec Esdras 10.2 sans ajouter ce complément au texte.
  - severity: low
    issue: « Mais maintenant » pour καὶ νῦν
    rationale: Le grec coordonne par καί sans marquer de contraste. « Et maintenant » préserve plus exactement la liaison.
  - severity: low
    issue: Formulation de la note sur la clause finale
    rationale: La paraphrase « tout Israël est au-dessus » ne rend pas clairement compte de la difficulté syntaxique et sémantique de ἐπάνω πᾶς Ἰσραήλ. Une note plus prudente doit présenter « il reste de l’espoir » comme un sens probable soutenu par le parallèle, non comme le sens littéral assuré du grec.
