base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: fr
  text: Cet Esdras monta de Babylone, lui qui était un scribe compétent[a] dans la loi de Moïse, donnée par le Dieu d’Israël,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « doué » ou « habile » ; l’adjectif grec peut désigner l’aptitude, l’intelligence ou une compétence éprouvée.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀνέβη
  choice: monta
  rationale: Conserve l’idiome directionnel conventionnel pour le voyage depuis Babylone vers Jérusalem ou le pays d’Israël, sans l’alourdir par « fit l’ascension ».
- source_word: γραμματεὺς
  choice: scribe
  rationale: Terme établi pour un spécialiste des Écritures et de la loi dans ce contexte juif ; « secrétaire » serait trop administratif.
- source_word: εὐφυὴς
  choice: compétent
  rationale: Exprime clairement l’aptitude et la maîtrise associées ici à la fonction de scribe, tout en évitant de préciser indûment si cette capacité était innée ou acquise.
- source_word: ἐν τῷ Μωυσέως νόμῳ
  choice: dans la loi de Moïse
  rationale: Rend directement le domaine dans lequel Esdras exerce sa compétence, sans transformer explicitement « loi » en « Torah » ou en « enseignement ».
- source_word: ἐκδεδομένῳ
  choice: donnée
  rationale: Rend naturellement le participe passif et présente la loi comme transmise par Dieu, sans les connotations modernes de « publiée ».
- source_word: τοῦ θεοῦ τοῦ Ἰσραήλ
  choice: du Dieu d’Israël
  rationale: Formulation française usuelle qui conserve l’identification explicite de Dieu à Israël.
theological_decisions:
- issue: Lien entre la qualité d’Esdras et la loi de Moïse
  choice: un scribe compétent dans la loi de Moïse
  alternative: un scribe bien instruit dans la loi de Moïse
  rationale: Le grec associe la fonction de γραμματεύς, la qualité εὐφυής et le domaine introduit par ἐν. La formulation choisie maintient ces éléments sans affirmer un type précis de formation.
- issue: Origine divine de la loi
  choice: la loi de Moïse, donnée par le Dieu d’Israël
  alternative: la loi de Moïse, transmise par le Dieu d’Israël
  rationale: La traduction conserve simultanément l’association de la loi avec Moïse et l’affirmation que Dieu en est la source, sans développer davantage leur articulation.
translation_notes:
  register: Français moderne, courant et digne. « Lui qui était » restitue avec naturel la construction participiale grecque et maintient la continuité de la phrase. La virgule finale est conservée parce que le verset se poursuit syntaxiquement dans le contexte.
