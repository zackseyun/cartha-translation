base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: fr
  text: Dès que j’eus entendu cela, je déchirai mes vêtements ainsi que l’habit sacré[a], je m’arrachai des cheveux et des poils de la barbe, puis je m’assis, frappé de stupeur[b] et profondément affligé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vêtement sacré »; il s’agit peut-être d’un habit sacerdotal officiel, mais le grec ne le précise pas explicitement.
    reason: lexical_alternative
  - marker: b
    text: Ou « consterné » ou « effaré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με
  choice: Dès que j’eus entendu
  rationale: La construction exprime une réaction immédiate. Cette formulation naturelle conserve nettement cette succession temporelle.
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: je déchirai mes vêtements
  rationale: Le verbe désigne le geste de déchirer ses vêtements en signe de deuil ou de détresse. Le possessif, implicite en grec, est nécessairement compris en français.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: l’habit sacré
  rationale: ἱεράν qualifie explicitement l’habit de sacré, sans préciser qu’il s’agit nécessairement d’un vêtement sacerdotal.
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: je m’arrachai des cheveux et des poils de la barbe
  rationale: Le contexte indique l’arrachement volontaire de cheveux et de poils de barbe comme manifestation de détresse. La formulation est idiomatique et précise en français moderne.
- source_word: σύννους
  choice: frappé de stupeur
  rationale: Le terme exprime un état de choc intérieur, d’effarement ou de consternation. « Frappé de stupeur » évite le sens parfois simplement admiratif de « étonné ».
- source_word: περίλυπος
  choice: profondément affligé
  rationale: Le mot exprime une tristesse intense; cette traduction en conserve la force et la gravité.
theological_decisions:
- issue: Nature de τὴν ἱερὰν ἐσθῆτα
  choice: l’habit sacré
  alternative: le vêtement sacerdotal
  rationale: Le grec affirme le caractère sacré de l’habit, mais n’en précise pas explicitement la fonction sacerdotale. La traduction évite donc d’ajouter une identification institutionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
