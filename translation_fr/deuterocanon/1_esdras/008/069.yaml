base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: fr
  text: Tous ceux qui étaient touchés par la parole du Seigneur, le Dieu d’Israël[a], se rassemblèrent auprès de moi pendant que je pleurais sur cette transgression. Je demeurai assis, profondément affligé, jusqu’au sacrifice du soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec porte : « par la parole du Seigneur d’Israël ». La formulation peut aussi être comprise comme désignant « le Seigneur, le Dieu d’Israël ».'
    reason: Signaler la formulation grecque comprimée et préserver son ambiguïté.
lexical_decisions:
- source_word: ἐπισυνήχθησαν πρὸς μέ
  choice: se rassemblèrent auprès de moi
  rationale: Exprime naturellement le mouvement collectif vers le narrateur, tout en conservant la valeur du verbe grec.
- source_word: ὅσοι ποτὲ ἐπεκινοῦντο
  choice: tous ceux qui avaient été touchés
  rationale: Le verbe décrit une réaction intérieure à la parole divine. « Touchés » est courant et compréhensible, sans préciser abusivement la nature exacte de cette impulsion.
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: par la parole du Seigneur, le Dieu d’Israël
  rationale: La formulation grecque transmise est comprimée (« du Seigneur d’Israël »). Le titre biblique usuel et le contexte parallèle soutiennent l’explicitation « le Dieu d’Israël », tandis qu’une note conserve la lecture littérale.
- source_word: πενθοῦντος
  choice: pendant que je pleurais
  rationale: Rend clairement la simultanéité indiquée par le génitif absolu et la force du deuil exprimé.
- source_word: ἀνομίᾳ
  choice: désobéissance à la Loi
  rationale: Dans ce contexte, ἀνομία désigne une conduite contraire à la loi divine. Cette formulation française est plus transparente que « iniquité » et plus contextuelle que « illégalité ».
- source_word: ἐκαθήμην περίλυπος
  choice: je restai assis, profondément affligé
  rationale: Conserve à la fois la posture assise, la durée implicite et l’intensité de la douleur.
- source_word: δειλινῆς θυσίας
  choice: sacrifice du soir
  rationale: Expression française claire pour le sacrifice cultuel offert le soir.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Éternel
  rationale: « Seigneur » traduit directement κύριος dans le texte grec sans réintroduire dans le corps du texte un nom divin hébreu qui n’y figure pas.
- issue: Interprétation de Κυρίου τοῦ Ἰσραήλ
  choice: du Seigneur, le Dieu d’Israël
  alternative: du Seigneur d’Israël
  rationale: Le grec peut se lire littéralement « du Seigneur d’Israël », mais la formulation paraît comprimée. Le titre biblique courant et le contexte parallèle favorisent « le Seigneur, le Dieu d’Israël ». La note préserve l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le ton de deuil et la référence cultuelle, tout en explicitant avec prudence le rapport de ἀνομία à la Loi.
