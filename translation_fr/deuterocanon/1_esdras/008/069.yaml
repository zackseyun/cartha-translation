  naturalness: Le français est moderne et fluide. « Je restai assis » est possible, mais « je demeurai assis » exprime plus naturellement la durée de l’imparfait ἐκαθήμην dans ce registre.
  terminology: « Seigneur » convient pour κύριος, et « sacrifice du soir » pour δειλινῆς θυσίας. L’explicitation « le Dieu d’Israël » est plausible au regard du contexte parallèle, mais la note doit maintenir clairement la formulation grecque plus compacte.
