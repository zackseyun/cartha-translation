base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: fr
  text: Restez vigilants et gardez-les jusqu’à ce que vous les remettiez aux chefs des prêtres et des lévites, ainsi qu’aux chefs des maisons ancestrales d’Israël, à Jérusalem, dans les salles de la maison de notre Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « salles » sont des pièces situées dans l’ensemble du Temple; le parallèle hébreu porte également « salles » ou « chambres ».
    reason: cross_reference
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: Restez vigilants
  rationale: Le verbe évoque littéralement le fait de rester éveillé et, par extension, une vigilance soutenue. Cette formulation est naturelle en français actuel et convient à la garde de biens confiés.
- source_word: φυλάσσετε
  choice: gardez-les
  rationale: Dans ce contexte de biens sacrés confiés, le verbe indique leur conservation et leur protection jusqu’au transfert de responsabilité.
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: jusqu’à ce que vous les remettiez
  rationale: La construction fixe le terme de la garde. « Remettre » exprime naturellement le transfert officiel de biens à leurs destinataires.
- source_word: φυλάρχοις
  choice: chefs
  rationale: Le terme désigne ici des responsables de premier rang. « Chefs » reste proche du grec sans introduire une fonction plus précise que le texte.
- source_word: ἡγουμένοις τῶν πατριῶν
  choice: chefs des maisons ancestrales
  rationale: La formule désigne les responsables des groupes familiaux issus d’un même ancêtre. « Maisons ancestrales » préserve cette structure sociale tout en étant plus intelligible en français moderne que « maisons des pères ».
- source_word: παστοφορίοις
  choice: salles
  rationale: Le terme renvoie à des pièces du complexe du Temple. « Salles » demeure assez large pour ne pas préciser indûment leur fonction; le parallèle hébreu emploie également un terme général pour des chambres ou salles.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: de la maison de notre Seigneur
  rationale: « Maison » conserve l’image grecque traditionnelle du sanctuaire, tandis que « notre Seigneur » rend explicitement le possessif et le titre du texte grec.
theological_decisions:
- issue: Désignation du sanctuaire dans τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: la maison de notre Seigneur
  alternative: le temple de notre Seigneur; la maison du Seigneur notre Dieu
  rationale: Le grec, témoin principal, dit explicitement « notre Seigneur ». « Maison » maintient son idiome cultuel sans remplacer le texte par la formulation différente du parallèle hébreu.
- issue: Structure familiale exprimée par τῶν πατριῶν
  choice: maisons ancestrales
  alternative: maisons paternelles; familles
  rationale: La traduction conserve la notion d’unités de parenté organisées selon l’ascendance, sans la réduire à de simples familles ni employer une expression française obscure.
- issue: Rapport syntaxique de ἐν Ἰερουσαλήμ ἐν τοῖς παστοφορίοις
  choice: à Jérusalem, dans les salles
  alternative: aux chefs… qui sont à Jérusalem, dans les salles
  rationale: Les groupes prépositionnels peuvent se rattacher à l’acte de remise ou préciser où se trouvent les destinataires. La formulation française conserve une portée légèrement ouverte tout en indiquant clairement le lieu de la remise.
translation_notes:
  register: Français international moderne, digne et accessible. Le double impératif grec est rendu par « Restez vigilants et gardez-les », qui conserve l’insistance sur la surveillance et la protection. Ponctuation choisie pour clarifier la série des destinataires sans effacer l’ambiguïté légère du rattachement des indications de lieu.
