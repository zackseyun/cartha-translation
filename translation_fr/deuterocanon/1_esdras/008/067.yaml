base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: fr
  text: Ils ont pris certaines de leurs filles pour femmes, pour eux-mêmes et pour leurs fils. La descendance sainte[a] s’est mêlée aux peuples étrangers du pays. Dès le début de cette affaire, les dirigeants et les notables ont pris part à cette violation de la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence sainte »; on pourrait aussi traduire : « la lignée sainte ».'
    reason: La note préserve la métaphore de σπέρμα et signale une autre traduction possible sans l’imposer dans le texte.
  - marker: b
    text: 'Ou : « à ce mépris de la loi »; le grec désigne une conduite contraire à la loi.'
    reason: La note rend visible la portée lexicale de ἀνομία et une autre formulation française possible.
lexical_decisions:
- source_word: συνῴκισαν
  choice: ont pris … pour femmes
  rationale: Le verbe évoque la vie commune et, dans ce contexte, le mariage. Cette formulation française rend clairement le sens matrimonial sans ajouter de détail absent du grec.
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: certaines de leurs filles
  rationale: 'Cette formulation naturelle conserve la valeur partitive de τινας : il s’agit d’une partie de leurs filles, non de toutes.'
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: pour eux-mêmes et pour leurs fils
  rationale: La tournure explicite en français que les hommes et leurs fils sont les deux groupes concernés par ces mariages.
- source_word: ἐπεμίγη
  choice: s’est mêlée
  rationale: Le verbe pronominal français conserve l’image du mélange tout en s’accordant naturellement avec « la descendance ».
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: la descendance sainte
  rationale: « Descendance » transmet ici le sens collectif et généalogique de σπέρμα dans un français actuel. Une note conserve l’image littérale de la « semence » sans imposer une interprétation doctrinale.
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: aux peuples étrangers du pays
  rationale: Avec « se mêler », la préposition « à » est idiomatique. « Peuples étrangers » rend l’origine autre exprimée par ἀλλογενῆ, tandis que « du pays » conserve τῆς γῆς.
- source_word: μετεῖχον
  choice: ont pris part à
  rationale: Cette expression française rend directement l’idée de participation.
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: les dirigeants et les notables
  rationale: Le premier terme désigne ceux qui sont à la tête, le second les personnages de haut rang; cette paire est claire et digne en français moderne.
- source_word: τῆς ἀνομίας ταύτης
  choice: cette violation de la loi
  rationale: Cette expression garde la force juridique et morale de ἀνομία, tout en étant plus naturelle en français que le calque « absence de loi ».
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: dès le début de cette affaire
  rationale: « Dès le début » exprime la participation depuis l’origine, et « cette affaire » rend le terme général πρᾶγμα dans le contexte.
theological_decisions:
- issue: Sens de « la descendance sainte » dans le contexte des mariages avec des personnes étrangères
  choice: Conserver l’expression collective et théologique « la descendance sainte », avec une note signalant la métaphore littérale.
  alternative: « la semence sainte », « la lignée sainte » ou une paraphrase explicitant l’identité ethnique ou religieuse du groupe
  rationale: Le grec emploie une métaphore d’appartenance consacrée sans en développer ici toutes les implications. La traduction préserve cette tension sans la transformer en explication doctrinale.
- issue: Caractérisation morale de l’acte
  choice: « cette violation de la loi »
  alternative: « cette faute », « cette iniquité » ou « ce mépris de la loi »
  rationale: Le choix maintient la dimension légale et religieuse de ἀνομία, sans réduire l’expression à une faute vague ni préciser au-delà du texte quelle loi est visée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque très coordonnée est répartie en trois phrases pour faciliter la lecture, sans changer la progression des idées. Les termes « descendance sainte », « dirigeants », « notables » et « violation de la loi » gardent le ton solennel et la tension théologique du passage.
