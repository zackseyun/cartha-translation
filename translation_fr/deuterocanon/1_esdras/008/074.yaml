base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: fr
  text: Et à cause de nos péchés et de ceux de nos pères, nous avons été livrés, avec nos frères, nos rois et nos prêtres, aux rois de la terre[a], à l’épée, à la captivité et au pillage, dans la honte, jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux rois du pays ». Le mot grec peut signifier « terre » ou « pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: à cause de nos péchés et de ceux de nos pères
  rationale: διά avec l’accusatif exprime ici la cause. La reprise par « ceux » évite une répétition lourde tout en maintenant explicitement la culpabilité de la génération présente et de ses ancêtres.
- source_word: παρεδόθημεν
  choice: nous avons été livrés
  rationale: Le passif de παραδίδωμι indique que le peuple a été remis au pouvoir d’autrui. « Livrés » est naturel en français et conserve la force judiciaire du terme.
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν, σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: avec nos frères, nos rois et nos prêtres
  rationale: Cette formulation conserve les trois groupes associés au sort du peuple sans répéter « avec », répétition peu naturelle en français.
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: aux rois de la terre
  rationale: γῆ peut désigner la terre au sens large ou un pays. Dans le contexte de domination par des souverains étrangers, « rois de la terre » rend bien l’expression biblique tout en laissant l’autre possibilité en note.
- source_word: εἰς ῥομφαίαν καὶ αἰχμαλωσίαν καὶ προνομὴν
  choice: à l’épée, à la captivité et au pillage
  rationale: La série nominale grecque est conservée. « L’épée » évoque la mort par la guerre, « captivité » le fait d’être emmené prisonnier, et « pillage » l’action de dépouiller.
- source_word: μετὰ αἰσχύνης
  choice: dans la honte
  rationale: αἰσχύνη exprime la honte et le déshonneur public. « Dans la honte » rattache naturellement cette humiliation à l’ensemble des malheurs énumérés sans en préciser excessivement la portée syntaxique.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: jusqu’à ce jour
  rationale: Expression française courante et digne qui marque la continuité de cette situation jusqu’au présent du locuteur.
theological_decisions:
- issue: Culpabilité collective à travers les générations
  choice: Conserver « nos péchés et ceux de nos pères »
  alternative: Atténuer en disant « nos péchés et ceux des générations passées »
  rationale: Le grec attribue explicitement la situation aux péchés de la communauté présente et à ceux de ses pères. La traduction maintient cette solidarité collective sans l’expliquer ni la résoudre.
- issue: Agent implicite du fait d’être livré
  choice: Maintenir le passif « nous avons été livrés » sans nommer l’agent
  alternative: Expliciter « Dieu nous a livrés »
  rationale: Le texte grec emploie un passif sans agent exprimé. Même si le contexte peut suggérer l’action divine, l’ajouter supprimerait une retenue réelle du texte source.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination reste proche de la structure grecque, tandis que « ceux de nos pères » et l’absence de répétition de « avec » assurent une formulation naturelle. Le vocabulaire biblique traditionnel (« livrés », « épée », « captivité ») demeure immédiatement compréhensible.
