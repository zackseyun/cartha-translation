review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend bien l’exhortation ἀναστὰς ἐπίτελει, et « elle relève de toi » restitue naturellement la responsabilité exprimée par πρὸς σὲ … τὸ πρᾶγμα. En revanche, « agis avec courage » transforme la dernière proposition en un impératif adressé à l’interlocuteur. Le grec porte ἡμεῖς (« nous ») avec l’infinitif ἰσχὺν ποιεῖν : il convient de conserver la solidarité active du groupe, sans harmoniser directement avec l’impératif du parallèle hébreu.'
  naturalness: « Mène cette affaire à bien » et « elle relève de toi » sont clairs et idiomatiques dans un français international moderne. « Nous sommes avec toi pour agir avec force » demeure naturel tout en reproduisant la construction concise et quelque peu elliptique du grec.
  terminology: Aucun nom propre ni terme théologique technique n’est en jeu. « Avec force » est plus proche de ἰσχύν que « avec courage », qui introduit une nuance psychologique non explicitement exprimée. La note indique sobrement l’éclairage, non normatif, du parallèle hébreu.
  issues:
  - severity: medium
    issue: Le sujet et le mode de la dernière clause sont modifiés.
    rationale: Le texte grec associe « nous » à « agir/faire preuve de force » (ἡμεῖς μετὰ σοῦ ἰσχὺν ποιεῖν). Le texte proposé en fait l’impératif autonome « agis », suivant davantage le parallèle hébreu que le grec primaire.
  - severity: low
    issue: « Courage » restreint la portée de ἰσχύς.
    rationale: Ἰσχύς renvoie d’abord à la force, la puissance ou la vigueur. « Avec force » conserve cette largeur sémantique et évite d’interpréter la force exclusivement comme courage.
