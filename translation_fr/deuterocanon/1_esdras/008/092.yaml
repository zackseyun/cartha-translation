base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: fr
  text: Lève-toi et mène cette affaire à bien, car elle relève de toi. Nous sommes avec toi pour agir avec force.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque « agir avec force » est concise et peut aussi être comprise comme l’expression d’un soutien vigoureux. Le passage hébreu parallèle (Esdras 10.4) porte plutôt : « sois fort et agis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Lève-toi
  rationale: Le participe aoriste est employé comme une exhortation. « Lève-toi » rend naturellement l’appel énergique à passer à l’action.
- source_word: ἐπίτελει
  choice: mène cette affaire à bien
  rationale: L’impératif de ἐπιτελέω exprime l’idée d’accomplir pleinement ou de conduire jusqu’à son terme. Le complément « cette affaire » est repris du membre de phrase suivant afin d’obtenir un français naturel sans ajouter de nouvel objet au contexte.
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: car elle relève de toi
  rationale: 'Littéralement, « car l’affaire est vers toi » : la tournure indique ici que la responsabilité ou la charge de l’affaire incombe à l’interlocuteur.'
- source_word: ἡμεῖς μετὰ σοῦ
  choice: Nous sommes avec toi
  rationale: Cette formulation directe conserve l’expression de solidarité sans préciser davantage la nature du soutien.
- source_word: ἰσχὺν ποιεῖν
  choice: agis avec courage
  rationale: La locution grecque, littéralement proche de « faire force », est concise et inhabituelle. « Agis avec courage » en restitue la portée exhortative en français, tout en signalant en note les autres analyses possibles.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif demeure énergique, tandis que la formulation inhabituelle de la dernière expression grecque est rendue naturellement dans le texte et son ambiguïté est conservée en note.
