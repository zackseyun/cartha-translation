base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/020.yaml
  text: Likewise[b][a], up to one hundred cors of wheat and one hundred measures of wine.
translation:
  language: fr
  text: De même, jusqu’à cent kors de blé et cent mesures de vin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le kor était une grande unité ancienne de mesure sèche. Le grec emploie ici «mesures» pour le vin sans préciser davantage l’unité.
    reason: cultural_note
  - marker: b
    text: Voir Esdras 7.22, où le texte parallèle présente ces quantités comme des plafonds administratifs et précise, pour le vin, l’unité appelée «bath».
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: Rend naturellement la valeur additive de l’adverbe grec dans la suite d’une liste administrative.
- source_word: ἕως
  choice: jusqu’à
  rationale: Dans ce contexte de quantités autorisées, le terme indique une limite maximale.
- source_word: πυροῦ
  choice: de blé
  rationale: Le grec désigne précisément le blé, plutôt que les céréales en général.
- source_word: κόρων ἑκατόν
  choice: cent kors
  rationale: κόρος est une unité ancienne précise de mesure sèche; sa translittération évite de la réduire à une mesure indéterminée.
- source_word: οἴνου
  choice: de vin
  rationale: Équivalent français direct et usuel de οἶνος.
- source_word: μετρητῶν ἑκατόν
  choice: cent mesures
  rationale: Le grec parle de mesures de liquide sans nommer ici l’unité plus précise «bath» attestée dans le parallèle; «mesures» préserve cette distinction textuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. «Kor» est conservé comme unité technique ancienne, tandis que μετρητής reste rendu par le terme générique «mesure» afin de ne pas importer dans le texte principal la précision du parallèle araméen.
