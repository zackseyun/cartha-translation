base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: fr
  text: Après avoir estimé que c’était une mesure bienveillante, j’ai ordonné que ceux du peuple juif qui le souhaitent et se décident de leur plein gré[a], ainsi que les prêtres, les lévites et ces autres personnes qui se trouvent dans notre royaume[b], t’accompagnent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec employé ici est rare. Il semble insister sur le caractère volontaire du choix; on pourrait aussi comprendre : « ceux du peuple juif qui souhaitent se porter volontaires ».'
    reason: lexical_alternative
  - marker: b
    text: Le parallèle hébreu fourni présente ici un texte très différent, où Esdras se consacre à étudier, pratiquer et enseigner la Loi du Seigneur. La traduction suit le texte grec de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: une mesure bienveillante
  rationale: Le neutre pluriel substantivé désigne ici une ligne de conduite humaine ou bienveillante. Cette formulation française s’intègre naturellement à la décision royale sans réduire le terme à une simple convenance.
- source_word: κρίνας
  choice: Après avoir estimé
  rationale: Le participe aoriste exprime une appréciation réfléchie précédant l’ordre. « Estimé » est plus naturel en français administratif moderne que le calque « jugé » dans cette construction.
- source_word: προσέταξα
  choice: j’ai ordonné
  rationale: Le verbe marque un ordre donné avec autorité et convient au registre d’un décret royal.
- source_word: τοὺς βουλομένους
  choice: ceux … qui le souhaitent
  rationale: Le participe exprime la volonté des personnes concernées et souligne que leur départ n’est pas forcé.
- source_word: αἱρετίζοντας
  choice: se décident de leur plein gré
  rationale: Cette forme grecque rare semble renforcer l’idée de choix volontaire déjà exprimée par βουλομένους. La traduction conserve cette insistance sans fusionner entièrement les deux expressions.
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: du peuple juif
  rationale: Dans ce contexte, ἔθνος désigne le peuple comme groupe. « Peuple juif » est naturel, précis et moins susceptible d’évoquer l’État moderne que « nation des Juifs ».
- source_word: τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: les prêtres, les lévites
  rationale: Traductions françaises usuelles des deux groupes cultuels.
- source_word: τῶνδε
  choice: ces autres personnes
  rationale: Le démonstratif est abrupt et elliptique dans le grec. « Ces autres personnes » en conserve la portée démonstrative tout en rendant la phrase compréhensible.
- source_word: συμπορεύεσθαί σοι
  choice: t’accompagnent
  rationale: Le verbe signifie aller ou voyager avec quelqu’un. « T’accompagnent » rend directement cette idée en français naturel.
theological_decisions:
- issue: Écart majeur entre le texte grec de 1 Esdras et le parallèle massorétique fourni
  choice: Traduire le décret royal attesté par le grec comme texte principal
  alternative: Substituer le contenu hébreu concernant Esdras qui dispose son cœur à étudier, pratiquer et enseigner la Loi
  rationale: Le grec est le témoin primaire indiqué pour 1 Esdras et présente sans ambiguïté générale une autorisation royale de partir pour Jérusalem. Le parallèle hébreu correspond à une formulation et à un contexte immédiat sensiblement différents; l’introduire dans le corps du verset effacerait cette divergence textuelle.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère solennité adaptée à un décret royal. La syntaxe a été assouplie pour rester lisible, tout en conservant l’insistance grecque sur la participation volontaire et l’ellipse liée à τῶνδε.
