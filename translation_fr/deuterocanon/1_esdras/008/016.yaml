base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: fr
  text: Et tout ce que tu voudras faire avec tes frères, avec l’or et l’argent[a], accomplis-le selon la volonté de ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte parallèle d’Esdras 7.18 précise plutôt : « ce qu’il vous paraîtra bon de faire avec le reste de l’argent et de l’or ». Ici, 1 Esdras emploie en grec une formulation plus générale.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: tout ce que tu voudras
  rationale: La relative indéfinie avec ἄν et le subjonctif exprime un champ ouvert. Cette formulation française conserve la valeur volitive et s’accorde naturellement avec le singulier grec.
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: avec tes frères
  rationale: La traduction directe préserve l’accompagnement exprimé par μετά et le masculin pluriel du grec, sans préciser indûment s’il s’agit de frères biologiques, de proches ou de membres du même peuple.
- source_word: ποιῆσαι χρυσίῳ καὶ ἀργυρίῳ
  choice: faire … de l’or et de l’argent
  rationale: Dans ce contexte financier, « faire de » rend naturellement l’usage ou la disposition de ces biens, tout en maintenant la généralité de ποιέω et la relation exprimée par les datifs.
- source_word: ἐπιτέλει
  choice: accomplis-le
  rationale: L’impératif de ἐπιτελέω demande de mener à exécution ce qui aura été décidé. « Accomplis-le » est digne, clair et distinct du premier verbe « faire ».
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: selon la volonté de ton Dieu
  rationale: Cette traduction proche du grec conserve explicitement la volonté divine comme norme gouvernant l’action.
theological_decisions:
- issue: Rapport entre le texte grec et le parallèle araméen d’Esdras 7.18, qui parle plus précisément de ce qu’il paraît bon de faire avec le reste de l’argent et de l’or.
  choice: 'Traduire directement l’autorisation générale du grec, tout en gardant sa qualification finale : « selon la volonté de ton Dieu ».'
  alternative: 'Harmoniser avec le parallèle : « ce qu’il te paraîtra bon, à toi et à tes frères, de faire avec le reste de l’argent et de l’or ».'
  rationale: Le grec est ici le texte source principal. Il ne comporte ni l’idée explicite de « reste » ni la tournure « ce qui paraît bon »; les ajouter effacerait une différence textuelle réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes grecques adressées directement à Esdras. La répétition conceptuelle entre « faire » et « accomplis-le » reflète la distinction entre ποιέω et ἐπιτελέω sans lourdeur excessive.
