base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: fr
  text: 'Parmi les descendants de Zathoès[a] : Éïéchonias, fils de Jéthel, et avec lui deux cents hommes ; parmi les descendants d’Adin : Ouben[b], fils de Jonathan, et avec lui deux cent cinquante hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom familial « Zathoès » suit le texte grec principal de 1 Esdras ; le parallèle approximatif du texte massorétique présente un autre nom.
    reason: alternative_reading
  - marker: b
    text: La forme du nom grec Οὐβὴν est incertaine ; on pourrait aussi la translittérer « Oben » ou « Uben ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Parmi les descendants de
  rationale: Dans cette liste, l’expression désigne des hommes issus d’un groupe familial. « Parmi les descendants de » exprime naturellement en français moderne l’appartenance au clan sans laisser entendre qu’il s’agit seulement de fils directs.
- source_word: Ζαθόης
  choice: Zathoès
  rationale: Le nom est translittéré d’après le témoin grec principal, sans être harmonisé avec la forme différente du parallèle massorétique approximatif.
- source_word: Εἰεχονίας
  choice: Éïéchonias
  rationale: Cette forme française reste proche de la graphie grecque transmise et distingue les voyelles initiales.
- source_word: Ἰεθήλου
  choice: fils de Jéthel
  rationale: Le génitif indique ici vraisemblablement un patronyme. L’ajout de « fils de » explicite en français la relation que la structure grecque laisse implicite.
- source_word: μετʼ αὐτοῦ
  choice: avec lui
  rationale: Traduction directe qui conserve la formule répétitive de la liste.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le grec désigne explicitement des hommes, et non des personnes de manière générique.
- source_word: διακόσιοι
  choice: deux cents
  rationale: Rendu direct du nombre cardinal, avec l’accord orthographique français requis lorsque « cents » n’est suivi d’aucun autre nombre.
- source_word: Ἀδείν
  choice: Adin
  rationale: Translittération simple et lisible du nom grec.
- source_word: Οὐβὴν
  choice: Ouben
  rationale: Translittération prudente de la forme grecque incertaine Οὐβὴν ; elle reproduit plus directement ses éléments vocaliques et consonantiques que la forme anglaise « Obeth ».
- source_word: Ἰωνάθου
  choice: fils de Jonathan
  rationale: Comme dans le premier couple de noms, le génitif est rendu comme un patronyme explicite.
- source_word: διακόσιοι πεντήκοντα
  choice: deux cent cinquante
  rationale: Rendu direct et idiomatique du nombre ; « cent » reste invariable puisqu’il est suivi de « cinquante ».
