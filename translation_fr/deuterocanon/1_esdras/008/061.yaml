base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: fr
  text: Après être partis de la localité de Théra, le douzième jour du premier mois[a], ils arrivèrent à Jérusalem grâce à la main puissante de notre Seigneur qui était sur nous. Il nous délivra de toute attaque ennemie[b], et ils arrivèrent à Jérusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec appelle le lieu de départ « Théra ». Le passage parallèle d’Esdras 8.31 dans le texte hébreu parle du « fleuve Ahava ». Le nom grec est maintenu ici parce que le présent livre est traduit d’après le texte grec.
    reason: alternative_reading
  - marker: b
    text: Le grec dit littéralement quelque chose comme « de l’entrée ou de l’approche — de tout ennemi », expression difficile à interpréter. Le passage parallèle hébreu parle de « la main de l’ennemi et de l’embuscade sur le chemin », ce qui soutient le sens de dangers ou d’attaques durant le voyage.
    reason: textual_variant
  - marker: c
    text: Le grec répète ici l’arrivée à Jérusalem et emploie « ils », alors que la phrase parle aussi de « nous ». Cette irrégularité du texte est conservée dans la traduction.
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: après avoir quitté
  rationale: Le participe évoque le départ d’un camp ou la mise en route. « Après avoir quitté » est naturel en français et garde sa valeur temporelle.
- source_word: τοῦ τόπου Θερὰ
  choice: le lieu appelé Théra
  rationale: Le grec désigne le point de départ par le nom Θερὰ. La formulation explicite qu’il s’agit d’un toponyme, tandis que la divergence avec le parallèle hébreu est signalée en note.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: le douzième jour du premier mois
  rationale: Cette formulation française claire restitue directement l’indication calendaire grecque.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: grâce à la main puissante de notre Seigneur qui était sur nous
  rationale: « Grâce à » exprime l’action favorable indiquée par κατά dans ce contexte, tout en conservant l’image biblique de la main divine et la formule « sur nous ».
- source_word: ἐρύσατο
  choice: il nous délivra
  rationale: Le verbe exprime le fait d’arracher à un danger. « Délivra » convient au registre biblique sans imposer ici un sens théologique plus large.
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: de l’approche de tout ennemi
  rationale: La formulation grecque transmise est difficile. « Approche » conserve un sens possible de εἴσοδος sans remplacer silencieusement le grec par la lecture plus explicite du parallèle hébreu.
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: et ils arrivèrent à Jérusalem
  rationale: La traduction garde la troisième personne du pluriel et la répétition présentes dans le grec, malgré leur caractère irrégulier dans un récit qui parle aussi de « nous ».
theological_decisions:
- issue: Traduction de κύριος dans la désignation narrative de Dieu
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte, κύριος désigne le Dieu d’Israël qui protège les voyageurs. « Seigneur » est la correspondance française traditionnelle et contextuellement appropriée.
- issue: Rapport entre la protection divine et l’arrivée à Jérusalem
  choice: grâce à la main puissante de notre Seigneur
  alternative: selon la main puissante de notre Seigneur
  rationale: « Grâce à » rend naturellement l’action providentielle exprimée par l’idiome, sans préciser davantage le mode de l’intervention divine.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction reste proche du grec tout en employant une syntaxe naturelle. Les irrégularités significatives — changement entre « ils » et « nous », répétition de l’arrivée et expression difficile concernant l’ennemi — ne sont pas harmonisées silencieusement.
