  naturalness: La révision allège « le lieu appelé Théra » en « la localité de Théra » et remplace une construction française opaque par une expression claire et digne. Le registre demeure moderne, international et biblique sans archaïsme inutile.
  terminology: « Seigneur », « main puissante » et « délivra » sont appropriés au contexte narratif et respectent l’imagerie théologique grecque sans surinterprétation confessionnelle. « Théra » est maintenu conformément au texte grec primaire; Ahava n’apparaît que dans la note comparative.
