  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
translation:
  language: fr
  text: Le roi lui accorda de l’honneur[a], car il avait trouvé grâce devant lui pour toutes ses requêtes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la gloire ». Le terme grec peut désigner la gloire, l’honneur ou le prestige ; ici, il s’agit d’une distinction accordée par le roi.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour toutes ses demandes ». Le terme grec peut aussi désigner des « dignités », des « charges » ou des « titres ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ὁ βασιλεὺς δόξαν
  choice: Le roi lui accorda des honneurs
  rationale: La tournure française exprime naturellement une distinction conférée par le roi. Dans ce contexte de cour, δόξα désigne l’honneur ou le prestige plutôt que la gloire divine.
- source_word: εὑρόντος χάριν ἐναντίον αὐτοῦ
  choice: car il avait trouvé grâce devant lui
  rationale: Le génitif absolu est compris comme indiquant la raison. « Trouver grâce devant quelqu’un » conserve l’idiome biblique et le rapport personnel exprimé par χάρις et ἐναντίον.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: pour toutes ses requêtes
  rationale: Dans ce contexte royal, ἀξίωμα peut désigner une demande ou une requête présentée avec autorité. Cette lecture donne un sens naturel à la faveur obtenue auprès du roi, tout en signalant en note l’autre possibilité lexicale liée aux charges et dignités.
