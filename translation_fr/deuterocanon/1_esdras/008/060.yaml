base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: fr
  text: Les prêtres et les lévites qui avaient reçu l’argent, l’or et les objets les apportèrent dans le temple du Seigneur à Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le parallèle hébreu dit : « pour les apporter à Jérusalem, à la maison de notre Dieu ». Le grec de 1 Esdras dit plutôt qu’ils les apportèrent « dans le temple du Seigneur » à Jérusalem.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβόντες
  choice: qui avaient reçu
  rationale: 'Le participe aoriste indique une action antérieure à celle du verbe principal : les prêtres et les lévites ont d’abord reçu les biens confiés, puis les ont apportés.'
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: les prêtres et les lévites
  rationale: Cette formulation naturelle conserve les deux groupes reconnus du personnel cultuel.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: l’argent, l’or
  rationale: Le grec désigne directement les deux métaux; « argent » n’est donc pas interprété ici au sens de monnaie.
- source_word: τὰ σκεύη
  choice: les objets sacrés
  rationale: Dans ce contexte cultuel, σκεύη désigne des objets ou ustensiles destinés au temple. « Objets sacrés » est clair en français moderne tout en conservant leur fonction religieuse.
- source_word: ἤνεγκαν
  choice: les apportèrent
  rationale: Le verbe exprime le transport vers un lieu de destination. Le pronom « les » reprend naturellement les trois catégories de biens.
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Pris selon sa syntaxe grecque la plus directe, le groupe prépositionnel localise le temple du Seigneur à Jérusalem, sans devoir transformer ἐν en expression de destination.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: dans le temple du Seigneur
  rationale: εἰς marque l’entrée ou le mouvement vers l’intérieur, et ἱερόν désigne ici le temple ou son enceinte sacrée. κύριος est rendu par « Seigneur ».
theological_decisions:
- issue: Titre divin κυρίου
  choice: du Seigneur
  alternative: de notre Dieu
  rationale: Le texte grec principal porte « le temple du Seigneur ». Le parallèle hébreu diffère avec « la maison de notre Dieu »; cette variante est signalée en note plutôt qu’harmonisée dans le texte.
- issue: Rapport entre Jérusalem et le temple
  choice: dans le temple du Seigneur à Jérusalem
  alternative: à Jérusalem, dans le temple du Seigneur
  rationale: La construction grecque place ἐν Ἰερουσαλήμ auprès des biens avant le verbe, mais son sens local se comprend naturellement comme situant le temple à Jérusalem. Cette lecture évite de rendre ἐν par « vers », tout en préservant la différence du parallèle hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Objets sacrés » explicite sobrement le contexte cultuel de σκεύη.
