base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: fr
  text: 'Parmi les fils de Bani : Salimoth, fils de Josaphias[a], et avec lui cent soixante hommes ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage hébreu parallèle d’Esdras 8.8 diffère sensiblement : il donne une autre lignée familiale, un autre chef et un autre nombre. Comme 1 Esdras est ici traduit d’après le témoin grec, le texte principal suit celui-ci : « Bani… Salimoth, fils de Josaphias… cent soixante hommes ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: Parmi les fils de Bani
  rationale: Dans cette liste généalogique, υἱοί peut désigner les fils, les descendants ou les membres d’une lignée. « Parmi les fils de Bani » conserve l’expression généalogique du grec tout en introduisant naturellement le représentant nommé.
- source_word: Σαλειμὼθ
  choice: Salimoth
  rationale: Le nom propre est translittéré d’après la forme grecque du témoin principal, sans l’harmoniser avec le parallèle hébreu approximatif.
- source_word: Ἰωσαφίου
  choice: fils de Josaphias
  rationale: Le génitif du nom propre exprime ici naturellement la filiation dans une liste généalogique. La formulation française explicite cette relation implicite.
- source_word: καὶ μετʼ αὐτοῦ
  choice: et avec lui
  rationale: Cette traduction directe respecte le style bref et elliptique de la liste grecque.
- source_word: ἄνδρες
  choice: hommes
  rationale: ἄνδρες désigne ici des hommes de sexe masculin, et non des personnes sans distinction de sexe.
- source_word: ἑκατὸν ἑξήκοντα
  choice: cent soixante
  rationale: Rendu cardinal simple, naturel et exact en français moderne.
