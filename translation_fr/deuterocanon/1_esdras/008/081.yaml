base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: fr
  text: Et maintenant, ne donnez pas vos filles en mariage à leurs fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’unissez pas vos filles à leurs fils par le mariage ».'
    reason: Le verbe grec peut désigner le fait d’unir des personnes comme époux ; cette formulation conserve la nuance sans ajouter d’explication sur leur vie commune.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois la coordination et la transition temporelle du grec, sans donner au lien une valeur déductive plus forte que ne l’exige le texte.
- source_word: τὰς θυγατέρας ὑμῶν
  choice: vos filles
  rationale: Rend directement et naturellement le groupe nominal possessif grec.
- source_word: μὴ συνοικίσητε
  choice: ne donnez pas … en mariage
  rationale: Dans cette construction, συνοικίζω évoque le fait d’unir des personnes pour la vie conjugale. Cette formulation française exprime naturellement l’action envisagée du point de vue familial, tout en évitant le littéral mais ambigu « faire habiter ensemble ».
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: à leurs fils
  rationale: Le datif grec désigne ici les hommes auxquels les filles seraient unies; « à » convient à l’expression française « donner en mariage à ».
theological_decisions:
- issue: Formulation de l’interdiction matrimoniale
  choice: ne donnez pas vos filles en mariage à leurs fils
  alternative: n’unissez pas vos filles à leurs fils par le mariage
  rationale: Le choix conserve la portée sociale et juridique de l’interdiction sans préciser davantage l’identité du groupe désigné par « leurs », laquelle dépend du contexte.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel et les pronoms genrés du grec sont conservés. La note signale la nuance concrète du verbe sans alourdir le texte principal.
