base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
translation:
  language: fr
  text: pour lui demander de nous accorder un heureux voyage, pour nous, pour nos enfants et pour notre bétail[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bon voyage », « la réussite en chemin » ou « un voyage sans danger ». Le grec désigne le bon déroulement d’un déplacement ; le contexte parallèle hébreu évoque aussi l’aide contre les ennemis en chemin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητῆσαι
  choice: demander
  rationale: Dans la construction avec παρά suivi du génitif, l’infinitif exprime ici une demande adressée à Dieu. « Demander » est naturel en français et rend clairement la pétition sans en préciser davantage la forme.
- source_word: παρʼ αὐτοῦ
  choice: lui demander de nous accorder
  rationale: Le grec indique que la faveur recherchée vient de lui. Cette formulation française explicite naturellement la relation de source contenue dans παρά avec le génitif, sans ajouter le contenu d’une faveur particulière.
- source_word: εὐοδίαν
  choice: un voyage favorable
  rationale: Le nom désigne le bon déroulement ou la réussite d’un déplacement. « Voyage favorable » conserve cette largeur de sens sans réduire l’idée à la seule sécurité physique.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: à nous, à nos enfants et à notre bétail
  rationale: τέκνα désigne les enfants sans restriction de sexe, et κτήνη les animaux domestiques constituant le bétail du groupe en voyage.
theological_decisions:
- issue: Nature de la faveur divine demandée pour le voyage
  choice: un voyage favorable
  alternative: un voyage sans danger ; la réussite en chemin
  rationale: Le grec souligne le bon déroulement du voyage sans nommer explicitement la protection. Le parallèle hébreu évoque l’aide contre les ennemis en chemin, mais la traduction suit prioritairement le texte grec et laisse cette dimension implicite.
translation_notes:
  register: Français moderne, clair et digne. La tournure « lui demander de nous accorder » évite le calque peu naturel « chercher auprès de lui » tout en conservant l’idée que Dieu est la source de la faveur demandée.
