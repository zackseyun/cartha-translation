base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: fr
  text: 'Les fils d’Azèr d’Ézékias[a], les fils de Kéilan et d’Azétas : soixante-sept ; les fils d’Azaros : quatre cent trente-deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce verset, les noms et les nombres grecs diffèrent nettement du parallèle massorétique approximatif, qui porte à l’endroit correspondant : « les fils d’Adîn : quatre cent cinquante-quatre ». Comme 1 Esdras réorganise ou remanie parfois ces listes de personnes revenues d’exil, le texte grec est suivi ici sans être harmonisé avec le parallèle hébreu.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule peut désigner les fils ou, plus largement, les descendants et membres d’un clan. « Les fils de » conserve la forme généalogique du grec.
- source_word: Ἀζὴρ Ἐζεκίου
  choice: Azer d’Ézékias
  rationale: Le grec présente deux noms juxtaposés, dont le second est au génitif. Cette traduction conserve explicitement ce rapport sans normaliser les noms d’après le parallèle massorétique, qui diffère fortement.
- source_word: Κειλὰν
  choice: Kéilan
  rationale: Translittération française directe du nom grec, avec accents facilitant une prononciation naturelle.
- source_word: Ἀζητάς
  choice: Azétas
  rationale: Translittération du témoin grec, sans harmonisation avec une autre tradition textuelle.
- source_word: ἐξήκοντα ἑπτά
  choice: soixante-sept
  rationale: Traduction exacte du nombre cardinal grec en toutes lettres.
- source_word: Ἀζάρου
  choice: Azaros
  rationale: Le génitif grec est rendu dans la formule française « les fils d’Azaros » ; le nom est translittéré plutôt que remplacé par celui du parallèle hébreu.
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: quatre cent trente-deux
  rationale: Traduction exacte et idiomatique du nombre cardinal grec.
