base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
translation:
  language: fr
  text: Les fils de Hagia[a], les fils de Phacareth-Sabéié, les fils de Sarothéï, les fils de Méisaïas, les fils de Gas, les fils d’Addous, les fils de Soubas, les fils d’Apherra, les fils de Barothéïs, les fils de Saphag, les fils d’Allôn ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle hébreu en Néhémie 7.51 est ici beaucoup plus court : « les fils d’Ouzza, les fils de Paséah, les fils de Bésaï ». Puisque 1 Esdras conserve une liste grecque plus développée, la traduction suit les noms grecs au lieu de les harmoniser avec l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste généalogique, la formule peut désigner les fils, les descendants ou les membres d’un clan. « Les fils de » conserve la répétition et l’ambiguïté de la formule grecque.
- source_word: Ἁγιά
  choice: Hagia
  rationale: Translittération du nom grec, avec h pour l’esprit rude initial.
- source_word: Φακαρὲθ Σαβειή
  choice: Phacareth-Sabéié
  rationale: Les deux éléments, non séparés par une nouvelle formule υἱοὶ, sont maintenus comme une expression onomastique étroitement liée; le trait d’union rend ce lien sans identifier arbitrairement le nom à une forme hébraïque.
- source_word: Σαρωθεί
  choice: Sarothéï
  rationale: Translittération conservatrice de la forme grecque, sans harmonisation avec la liste hébraïque approximativement parallèle.
- source_word: Μεισαίας
  choice: Méisaïas
  rationale: Translittération française de la forme grecque, avec tréma pour rendre lisible la succession vocalique.
- source_word: Γάς
  choice: Gas
  rationale: Reproduction directe de la forme grecque brève, sans normalisation conjecturale.
- source_word: Ἀδδούς
  choice: Addous
  rationale: Translittération française conservant la consonne double et rendant ου par « ou ».
- source_word: Σουβάς
  choice: Soubas
  rationale: Translittération directe; « ou » correspond à ου.
- source_word: Ἀφερρά
  choice: Apherra
  rationale: Translittération conservatrice du nom grec, avec « ph » pour φ et maintien du r double.
- source_word: Βαρωθείς
  choice: Barothéïs
  rationale: Translittération proche du grec; le tréma signale que les voyelles finales se prononcent séparément.
- source_word: Σαφάγ
  choice: Saphag
  rationale: Translittération directe de la forme consonantique grecque.
- source_word: Ἀλλών
  choice: Allôn
  rationale: Translittération du nom grec; l’accent circonflexe indique ici la voyelle longue oméga sans recourir à un macron peu usuel en français courant.
