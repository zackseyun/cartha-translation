translation_notes:
  register: Style de liste généalogique sobre et formel. La répétition de « les fils de » reproduit la structure grecque tout en restant naturelle en français biblique moderne. Les noms rares sont translittérés à partir du grec primaire selon des conventions françaises lisibles; la ponctuation finale conserve le caractère continu de la liste.
