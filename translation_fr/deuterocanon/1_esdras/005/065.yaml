base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: fr
  text: 'Ils s’approchèrent de Zorobabel, de Josué et des chefs des familles ancestrales, et leur dirent : « Nous bâtirons avec vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Ils s’approchèrent
  rationale: Le participe aoriste marque une action préalable à la prise de parole. Une proposition coordonnée est naturelle en français et conserve le mouvement vers les responsables.
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: de Zorobabel, de Josué
  rationale: Les formes françaises traditionnelles correspondant aux noms postexiliques sont retenues. « Josué » identifie naturellement le personnage historique sans suggérer ici Jésus du Nouveau Testament.
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: des chefs des familles ancestrales
  rationale: ἡγούμενοι désigne les responsables, tandis que πατριαί renvoie aux groupes familiaux issus d’un ancêtre. Cette formulation est claire en français moderne sans reproduire littéralement l’idiome peu naturel « maisons des pères ».
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: Nous bâtirons avec vous
  rationale: Le verbe composé exprime l’action de bâtir conjointement avec les destinataires. « Bâtir avec vous » en conserve la force sans lourdeur.
theological_decisions:
- issue: Identification du nom grec Ἰησοῦ dans le contexte postexilique
  choice: Josué
  alternative: Jésus
  rationale: La forme grecque peut correspondre à « Jésus » ou à « Josué », mais le contexte historique désigne Josué, le responsable sacerdotal de la restauration. Le choix français évite une association christologique étrangère au passage.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative est fluide, les noms suivent l’usage biblique français, et « familles ancestrales » rend explicitement la structure lignagère sans archaïsme.
