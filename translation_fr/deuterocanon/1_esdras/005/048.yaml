base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: fr
  text: pour y offrir des holocaustes[a], conformément à ce qui est prescrit dans le livre de Moïse, l’homme de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu parallèle d’Esdras 3.2 porte : « comme il est écrit dans la loi de Moïse, l’homme de Dieu ». Ici, 1 Esdras parle du « livre de Moïse » et de « ce qui est prescrit »; les deux formulations expriment la même idée générale en des termes différents.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: offrir
  rationale: Dans le contexte sacrificiel, le verbe désigne l’action d’offrir des sacrifices, et non simplement de les apporter.
- source_word: ἐπ’ αὐτοῦ
  choice: y
  rationale: Le pronom renvoie à l’autel mentionné dans le contexte précédent; « y offrir » est naturel en français et conserve le sens local.
- source_word: ὁλοκαυτώματα
  choice: des holocaustes
  rationale: « Holocauste » est le terme biblique français courant pour un sacrifice entièrement consumé par le feu; le parallèle hébreu עֹלוֹת confirme ce sens.
- source_word: ἀκολούθως
  choice: conformément à
  rationale: L’adverbe exprime la conformité à une norme prescrite; cette tournure est précise et naturelle dans ce contexte légal et cultuel.
- source_word: τοῖς ... διηγορευμένοις
  choice: ce qui est prescrit
  rationale: Le participe désigne ce qui a été énoncé avec autorité; « prescrit » convient au cadre légal et sacrificiel.
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: dans le livre de Moïse
  rationale: Le grec dit explicitement « livre de Moïse », plutôt que « loi de Moïse »; la traduction conserve cette formulation propre à 1 Esdras.
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: l’homme de Dieu
  rationale: Titre biblique traditionnel appliqué ici à Moïse, également attesté par le parallèle hébreu.
theological_decisions:
- issue: Rapport entre la formulation grecque et le parallèle hébreu d’Esdras 3.2
  choice: Conserver « le livre de Moïse » et « ce qui est prescrit », conformément au grec.
  alternative: 'Harmoniser avec le parallèle hébreu: « comme il est écrit dans la loi de Moïse, l’homme de Dieu ».'
  rationale: Le texte grec est la source principale de 1 Esdras. Le parallèle hébreu confirme le sens légal et sacrificiel, mais ne doit pas remplacer la formulation distincte du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche du grec tout en évitant une syntaxe artificielle; « holocaustes » conserve le vocabulaire sacrificiel biblique usuel.
