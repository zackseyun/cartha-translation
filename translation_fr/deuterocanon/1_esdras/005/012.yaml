translation:
  language: fr
  text: 'Fils de Iolamos : deux ; fils de Zatou[a] : neuf cent soixante-dix ; fils de Chorbé[b] : sept cent cinq ; fils de Baneï[c] : six cent quarante-huit.'
  philosophy: optimal-equivalence
  footnotes:
