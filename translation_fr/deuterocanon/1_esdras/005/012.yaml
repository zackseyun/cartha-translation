    text: Le grec a Ζατοῦ (« Zatou ») ; la tradition massorétique parallèle a « Zattou ».
    reason: alternative_reading
  - marker: b
    text: La correspondance entre le grec Χορβέ (« Chorbé ») et les traditions hébraïques parallèles est incertaine ; certaines listes parallèles donnent ici un autre nom de famille.
    reason: textual_variant
  - marker: c
    text: 'Le grec a Βανεί (« Baneï ») ; le parallèle massorétique a « Bani » et donne un total différent : 642 au lieu de 648.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: fils de
  rationale: Dans cette liste de recensement, le terme désigne les membres ou descendants d’une famille. La formule française concise « fils de » conserve cette valeur généalogique et convient au style répétitif de la liste.
- source_word: Ἰωλάμου
  choice: Iolamos
  rationale: Le nom est rendu d’après le grec, en rétablissant la forme nominative attendue derrière le génitif Ἰωλάμου.
- source_word: δύο
  choice: deux
  rationale: Rendu direct du nombre cardinal grec.
- source_word: Ζατοῦ
  choice: Zatou
  rationale: La forme du témoin grec, source principale, est conservée plutôt que d’être harmonisée avec celle de la tradition hébraïque parallèle.
- source_word: ἐννακόσιοι ἑβδομήκοντα
  choice: neuf cent soixante-dix
  rationale: Le nombre exact est rendu selon l’usage courant du français moderne.
- source_word: Χορβέ
  choice: Chorbé
  rationale: Translittération française de la forme grecque, avec un accent indiquant naturellement la voyelle finale ; son rapport incertain avec les listes hébraïques est signalé en note.
- source_word: ἑπτακόσιοι πέντε
  choice: sept cent cinq
  rationale: Le nombre exact est rendu selon l’usage courant du français moderne.
- source_word: Βανεί
  choice: Baneï
  rationale: La graphie distingue les deux voyelles et suit le grec Βανεί ; la forme Bani du parallèle massorétique est donnée en note.
- source_word: ἑξακόσιοι τεσσεράκοντα ὀκτώ
  choice: six cent quarante-huit
  rationale: Le total grec de 648 est conservé sans harmonisation avec le total différent du parallèle hébreu.
