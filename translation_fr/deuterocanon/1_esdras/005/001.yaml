base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
translation:
  language: fr
  text: Après ces événements, les chefs des maisons ancestrales, selon leurs tribus, furent choisis pour monter avec leurs femmes, leurs fils et leurs filles, leurs serviteurs et leurs servantes[a], ainsi que leur bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs esclaves, hommes et femmes ». Les termes grecs peuvent désigner des esclaves domestiques ou des serviteurs ; le verset seul ne permet pas de préciser leur statut juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français, qui reprend l’ensemble des événements précédents sans lourdeur.
- source_word: ἐξελέγησαν ἀναβῆναι
  choice: furent choisis pour monter
  rationale: Respecte le passif de ἐκλέγω et l’infinitif de but; « monter » conserve l’idiome géographique et biblique sans ajouter une destination absente du verset.
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: les chefs des maisons ancestrales
  rationale: « Chefs » exprime la fonction de direction, tandis que « maisons ancestrales » rend la structure familiale et clanique évoquée par οἴκου πατριῶν.
- source_word: κατὰ φυλὰς αὐτῶν
  choice: répartis selon leurs tribus
  rationale: Rend la valeur distributive de κατά et précise naturellement en français le mode d’organisation des chefs.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: leurs femmes
  rationale: Dans cette énumération familiale, γυναῖκες désigne naturellement les épouses; « leurs femmes » est courant et digne en français moderne.
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: leurs fils et leurs filles
  rationale: Préserve les deux catégories explicitement nommées dans le grec.
- source_word: οἱ παῖδες αὐτῶν, καὶ αἱ παιδίσκαι
  choice: leurs serviteurs et leurs servantes
  rationale: Puisque fils et filles viennent d’être mentionnés, les deux termes désignent vraisemblablement ici le personnel domestique masculin et féminin. Cette formulation conserve la paire sans trancher abusivement leur statut juridique.
- source_word: τὰ κτήνη αὐτῶν
  choice: leur bétail
  rationale: κτήνη désigne ici les animaux domestiques emmenés avec le groupe; « bétail » est concis et idiomatique.
