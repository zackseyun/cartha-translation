  source_fidelity: La phrase française actuelle fait entendre que Josué et Zorobabel « se levèrent » ensemble (« Josué … se leva avec … Zorobabel »), tandis que le participe singulier καταστάς se rapporte à Josué seul. Tous, en revanche, sont sujets de « préparèrent ». La révision rétablit cette portée sans ajouter d’information.
  naturalness: La formulation révisée reste fluide en français international moderne. Elle conserve la coordination ample de la phrase grecque tout en rendant explicitement naturel que l’action de se lever concerne Josué seul.
  terminology: « Josué », « Yotsadaq », « Zorobabel », « Shéaltiel », « prêtres » et « autel du Dieu d’Israël » sont des choix recevables et cohérents. La note est resserrée afin de ne pas présenter comme titre explicitement textuel une fonction de « chef sacerdotal » que ce verset ne formule pas.
