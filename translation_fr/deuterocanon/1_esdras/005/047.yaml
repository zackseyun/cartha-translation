base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: fr
  text: Après s’être levé, Josué[a], fils de Yotsadaq, avec ses frères, les prêtres, ainsi que Zorobabel, fils de Shéaltiel, et ses frères, préparèrent l’autel du Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte le nom Ἰησοῦς, qui désigne ici Josué (Yéshoua), personnage sacerdotal de l’époque postexilique, et non Jésus de Nazareth.
    reason: cross_reference
lexical_decisions:
- source_word: καταστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’entrée en action de Josué. « Se leva » reste proche de l’image grecque et convient naturellement au récit; « prit position » serait trop marqué.
- source_word: Ἰησοῦς
  choice: Josué
  rationale: Dans ce contexte postexilique, le nom désigne le grand prêtre connu dans la tradition hébraïque sous la forme Yéshoua/Josué, et non Jésus de Nazareth. « Josué » est la forme française biblique claire et usuelle.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: fils de Yotsadaq
  rationale: L’article suivi du génitif exprime ici la filiation. « Yotsadaq » reflète la forme sémitique du nom derrière le grec Ἰωσεδέκ.
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: ses frères, les prêtres
  rationale: La formulation conserve l’apposition grecque et le sens direct d’ἀδελφοί, sans l’élargir arbitrairement à « proches » ou « collègues ».
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forme traditionnelle et largement reconnue en français pour ce dirigeant postexilique.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: fils de Shéaltiel
  rationale: Le génitif patronymique est rendu naturellement par « fils de ». « Shéaltiel » suit la forme sémitique courante en français.
- source_word: ἡτοίμασαν
  choice: préparèrent
  rationale: Le verbe signifie « préparer, rendre prêt ». Cette traduction n’ajoute pas l’idée plus précise d’une construction ou d’une installation matérielle.
- source_word: τὸ θυσιαστήριον
  choice: l’autel
  rationale: « Autel » est l’équivalent cultuel français normal de θυσιαστήριον; le contexte rend inutile l’ajout de « sacrificiel ».
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: du Dieu d’Israël
  rationale: Le génitif marque naturellement l’appartenance ou la consécration de l’autel au Dieu d’Israël.
theological_decisions:
- issue: Identification du personnage nommé Ἰησοῦς
  choice: Josué, le personnage sacerdotal postexilique
  alternative: Jésus
  rationale: Le patronyme et le cadre historique identifient le personnage à Yéshoua/Josué, fils de Yotsadaq. Employer « Jésus » en français créerait une association anachronique avec Jésus de Nazareth.
translation_notes:
  register: Français international moderne, narratif et digne. La longue coordination grecque est divisée en deux phrases pour plus de clarté, sans modifier les relations entre les personnages ni l’enchaînement de l’action. Le marqueur [a] figure immédiatement après le nom concerné.
