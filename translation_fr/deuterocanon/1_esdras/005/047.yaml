  rationale: La révision rend le participe aoriste singulier par « Après s’être levé », qui concerne sans ambiguïté Josué, puis maintient Josué, les prêtres, Zorobabel et ses frères comme sujet pluriel de « préparèrent ». Elle préserve le sens, les noms établis dans le brouillon et l’ancre de note.
