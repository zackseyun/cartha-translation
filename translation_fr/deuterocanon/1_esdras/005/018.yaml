  text: those from Netebas[a], fifty-five; those from Enatos, one hundred fifty-eight[b]; those from Baitasmon Zamoth.
translation:
  language: fr
  text: ceux de Nétébas[a], cinquante-cinq ; ceux d’Énatos, cent cinquante-huit ; ceux de Baïtasmon Zammoth[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les noms grecs de ce verset diffèrent sensiblement du parallèle hébreu approximatif de Néhémie 7.25, où la tradition massorétique porte : « les fils de Gibbar, quatre-vingt-quinze ». Comme 1 Esdras présente ici une liste et des noms différents, la traduction suit étroitement le témoin grec au lieu de l’harmoniser avec l’hébreu.'
    reason: textual_variant
  - marker: b
    text: Le dernier nom de lieu est difficile dans le texte grec et pourrait être un toponyme composé ou altéré ; il est donc conservé ici par translittération.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ
  choice: ceux de
  rationale: Dans cette liste de recensement, l’expression désigne des groupes selon leur lieu d’origine. « Ceux de » rend naturellement la valeur locative sans importer la formule « fils de » du parallèle hébreu approximatif.
- source_word: Νετέβας
  choice: Nétébas
  rationale: Translittération française proche du témoin grec, sans harmonisation conjecturale avec le parallèle hébreu.
- source_word: πεντήκοντα πέντε
  choice: cinquante-cinq
  rationale: Rendu direct du nombre cardinal grec.
- source_word: Ἐνάτου
  choice: Énatos
  rationale: Le génitif grec est rendu sous une forme française nominative lisible, tout en restant proche du nom transmis.
- source_word: ἑκατὸν πεντήκοντα ὀκτώ
  choice: cent cinquante-huit
  rationale: Rendu direct et idiomatique du nombre cardinal grec.
- source_word: Βαιτασμῶν Ζαμμώθ
  choice: Baïtasmon Zammoth
  rationale: La séquence grecque étant difficile et pouvant représenter un toponyme composé ou altéré, elle est conservée par translittération plutôt que normalisée de manière conjecturale.
