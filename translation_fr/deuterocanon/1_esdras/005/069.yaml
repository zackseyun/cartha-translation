base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: fr
  text: Mais les peuples du pays, s’attachant à ceux qui se trouvaient en Judée[a] et les assiégeant, les empêchaient de bâtir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « s’attachant à » est difficile ; il peut aussi évoquer le fait de s’établir parmi les habitants de Judée ou de faire pression sur eux. La suite montre qu’il s’agit d’une action hostile.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit simplement « bâtir », sans préciser ici ce qui était bâti. Le contexte concerne la reconstruction du Temple.
    reason: cross_reference
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: les peuples du pays
  rationale: ἔθνη désigne ici les groupes de population environnants. « Peuples » restitue naturellement le pluriel sans introduire la connotation néotestamentaire possible de « païens ».
- source_word: ἐπικοιμώμενα
  choice: s’attachant à
  rationale: Le participe est rare et difficile. Cette traduction conserve son idée relationnelle sans masquer les autres nuances possibles, signalées en note.
- source_word: τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: ceux qui étaient en Judée
  rationale: Rendu substantival fidèle et naturel, sans préciser davantage l’identité du groupe.
- source_word: πολιορκοῦντες
  choice: les assiégeant
  rationale: πολιορκέω signifie proprement « assiéger » et exprime ici la forte hostilité exercée contre les habitants de Judée.
- source_word: εἶργον
  choice: les empêchaient
  rationale: L’imparfait décrit une obstruction prolongée. « Empêchaient » est idiomatique en français avec « de bâtir » et n’exige pas que l’arrêt ait été définitif.
- source_word: τοῦ οἰκοδομεῖν
  choice: de bâtir
  rationale: Le grec ne nomme aucun objet dans cette proposition. Le laisser implicite respecte le texte source, tandis que le contexte indique qu’il s’agit de la reconstruction du Temple.
theological_decisions:
- issue: Objet implicite du verbe « bâtir »
  choice: de bâtir
  alternative: de bâtir la Maison / d’édifier le Temple
  rationale: Le contexte concerne bien le Temple, mais le grec dit seulement « bâtir ». Ne pas ajouter d’objet préserve la formulation du témoin grec sans obscurcir le sens dans son contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale du grec est conservée dans une forme lisible; « bâtir » maintient volontairement l’objet implicite du texte source.
