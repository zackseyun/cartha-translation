base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple servants: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: fr
  text: 'les fils de Tobéis, en tout cent trente-neuf ; les esclaves du Temple[a] : les fils d’Ésaü, les fils de Taséipha, les fils de Tabaoth, les fils de Kéras, les fils de Soua, les fils de Phalaiou, les fils de Labana[b][c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ἱερόδουλοι désigne des personnes attachées au service d’un sanctuaire dans une condition servile ; on pourrait rendre plus doucement : « serviteurs du Temple ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec présente ici un fragment de liste qui se termine par une virgule ; la suite du registre se trouve au verset suivant.
    reason: cross_reference
  - marker: c
    text: 'Le parallèle hébreu proposé pour ce passage n’est pas verbalement équivalent : à cet endroit, 1 Esdras suit une organisation différente de la liste des rapatriés.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule peut désigner des fils ou, plus largement, les membres d’une famille. « Les fils de » conserve la forme généalogique répétée du grec sans en préciser davantage la portée.
- source_word: Τωβείς
  choice: Tobéis
  rationale: Translittération française proche de la forme grecque, avec un tréma pour signaler que les deux voyelles se prononcent séparément.
- source_word: πάντες
  choice: en tout
  rationale: Cette tournure française naturelle exprime la valeur récapitulative du terme dans une liste de recensement.
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: cent trente-neuf
  rationale: Rend exactement le total indiqué par le grec.
- source_word: οἱ ἱερόδουλοι
  choice: les esclaves du Temple
  rationale: Le mot composé désigne des personnes attachées au service d’un sanctuaire dans une condition servile. « Esclaves du Temple » préserve cette dimension sociale, que « serviteurs du Temple » risquerait d’atténuer.
- source_word: Ἠσαύ
  choice: Ésaü
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom grec.
- source_word: Τασειφά
  choice: Taséipha
  rationale: Translittération proche du grec pour ce nom rare, dont l’identification demeure incertaine.
- source_word: Ταβαώθ
  choice: Tabaoth
  rationale: Translittération directe du nom grec, sans reconstruction à partir d’un parallèle sémitique.
- source_word: Κηράς
  choice: Kéras
  rationale: Le K rend de manière transparente le kappa grec et évite de masquer la forme du nom rare.
- source_word: Σουά
  choice: Soua
  rationale: Translittération de la graphie grecque, sans lui substituer une forme sémitique reconstruite.
- source_word: Φαλαίου
  choice: Phalaiou
  rationale: La translittération étroite conserve la forme grecque de ce nom rare et incertain.
- source_word: Λαβανά
  choice: Labana
  rationale: Cette forme respecte la terminaison grecque en -ά plutôt que de ramener le nom au plus familier « Laban ».
theological_decisions:
- issue: Statut social exprimé par ἱερόδουλοι
  choice: les esclaves du Temple
  alternative: les serviteurs du Temple
  rationale: Le contexte cultuel ne supprime pas la nuance servile du terme. La traduction retenue évite d’adoucir cette réalité tout en précisant le lieu auquel ces personnes étaient attachées.
- issue: Écart entre la liste grecque et le parallèle massorétique fourni
  choice: traduire la liste grecque telle qu’elle se présente
  alternative: remplacer son contenu par la mention des lévites, de Josué et de Kadmiel dans le parallèle hébreu
  rationale: Le témoin hébreu fourni n’est qu’un parallèle approximatif et son contenu diffère matériellement. Pour 1 Esdras, le grec demeure ici le texte source principal.
translation_notes:
  register: Français international moderne, sobre et adapté à une liste administrative ancienne. La répétition de « les fils de » reproduit volontairement la cadence généalogique du grec. « Temple » prend une majuscule pour désigner le sanctuaire de Jérusalem. La virgule finale est conservée afin de signaler que la liste grecque se poursuit.
