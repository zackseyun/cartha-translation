base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: fr
  text: Ils posèrent les fondations du temple de Dieu à la nouvelle lune du deuxième mois[a], la deuxième année après leur arrivée en Judée et à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le premier jour du deuxième mois »; la nouvelle lune marquait le début du mois.
    reason: La formulation principale conserve νουμηνία, tandis que la note explicite sa valeur calendérique possible.
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: posèrent les fondations
  rationale: Le verbe signifie « poser les fondations » ou « fonder ». Le pluriel « les fondations » est l’expression française naturelle dans ce contexte architectural.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: du temple de Dieu
  rationale: ναός désigne directement le temple ou sanctuaire. « Temple de Dieu » est précis et naturel, sans substituer à ce terme l’expression plus indirecte « maison de Dieu ».
- source_word: τῇ νουμηνίᾳ τοῦ δευτέρου μηνός
  choice: à la nouvelle lune du deuxième mois
  rationale: νουμηνία désigne la nouvelle lune, qui marque le commencement du mois. La traduction conserve l’expression calendérique du grec plutôt que de la réduire au seul « premier jour ».
- source_word: τοῦ δευτέρου ἔτους
  choice: la deuxième année
  rationale: Cette formulation française marque naturellement l’année où eut lieu l’action.
- source_word: ἐν τῷ ἐλθεῖν
  choice: après leur arrivée
  rationale: La construction infinitive a une valeur temporelle. Le contexte demande que la fondation soit située dans la deuxième année suivant leur venue.
- source_word: εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: en Judée et à Jérusalem
  rationale: Les prépositions françaises idiomatiques diffèrent devant une région et une ville; elles rendent ici le mouvement suivi de l’arrivée.
theological_decisions:
- issue: Traduction de ναός dans le contexte de la reconstruction
  choice: temple de Dieu
  alternative: maison de Dieu
  rationale: Le grec emploie le terme ordinaire pour le temple ou sanctuaire. Le choix direct « temple » préserve le référent cultuel sans introduire de précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, simple et digne. La phrase suit étroitement la chronologie grecque tout en employant des tournures françaises naturelles.
