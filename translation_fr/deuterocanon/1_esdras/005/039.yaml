base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: fr
  text: et il fut appelé par son nom[a]. Parmi eux, ceux dont on rechercha le document généalogique dans le registre, sans le trouver, furent écartés de l’exercice des fonctions sacerdotales[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut nommé d’après son nom ». La formulation grecque est très condensée, et le référent du pronom n’est pas entièrement explicite dans ce verset pris isolément.'
    reason: lexical_alternative
  - marker: b
    text: Le document officiel permettant d’établir leur ascendance ne fut pas trouvé dans le registre ; ils ne furent donc pas admis à exercer les fonctions de prêtres.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: il fut appelé de son nom
  rationale: Le passif de καλέω, associé à ὄνομα, indique ici une désignation par un nom. La formulation conserve la concision du grec et n’explicite pas un référent que ce verset seul laisse incertain.
- source_word: τούτων
  choice: parmi eux
  rationale: Dans ce contexte, le génitif partitif introduit les personnes du groupe soumises à la vérification; « parmi eux » est idiomatique en français.
- source_word: ἐζητήθησαν
  choice: ceux dont on rechercha
  rationale: Le grec emploie un passif pluriel. La tournure française à sujet indéfini restitue le caractère administratif de la recherche tout en reliant naturellement les personnes au document généalogique recherché.
- source_word: τῆς γενικῆς γραφῆς
  choice: le document généalogique
  rationale: γραφή désigne ici une pièce écrite servant à établir l’ascendance. « Document généalogique » conserve le sens documentaire sans confondre cette pièce avec le registre mentionné ensuite.
- source_word: ἐν τῷ καταλοχισμῷ
  choice: dans le registre
  rationale: καταλοχισμός renvoie à une inscription ou à un relevé organisé en liste. « Registre » convient au cadre administratif et se lit naturellement en français moderne.
- source_word: μὴ εὑρεθείσης
  choice: sans le trouver
  rationale: Le participe féminin singulier au génitif renvoie naturellement à γραφή, le document généalogique. La tournure évite de faire des personnes, plutôt que du document, l’objet grammatical de la non-découverte.
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: furent écartés du service sacerdotal
  rationale: Le verbe exprime une mise à l’écart, et l’infinitif ἱερατεύειν l’exercice des fonctions de prêtre. Cette formulation rend le résultat administratif sans affirmer davantage que le texte.
theological_decisions:
- issue: Portée de l’exclusion du sacerdoce
  choice: furent écartés du service sacerdotal
  alternative: furent exclus définitivement du sacerdoce
  rationale: Le passage décrit une disqualification fondée sur l’absence de preuve généalogique. Il ne précise ni qu’elle est définitive ni qu’elle constitue une déclaration doctrinale générale sur le sacerdoce.
- issue: Objet qui ne fut pas trouvé
  choice: le document généalogique
  alternative: les personnes elles-mêmes
  rationale: L’accord féminin singulier de μὴ εὑρεθείσης correspond à γραφῆς. La traduction suit cet indice grammatical et préserve la logique de la vérification documentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement réorganisée pour rendre intelligible la construction grecque difficile, tout en conservant l’incertitude du premier membre et la nature administrative, plutôt que doctrinale, de la mise à l’écart.
