base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/021.yaml
  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
translation:
  language: fr
  text: ceux de Makalon[a], cent vingt-deux ; ceux de Bétolio, cinquante-deux ; Néiphéis, cent cinquante-six.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage parallèle hébreu de Néhémie 7.25 porte : « les fils de Rama et de Guéba, six cent vingt et un ». Ici, 1 Esdras présente des noms et des nombres sensiblement différents.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: ceux de
  rationale: La tournure grecque désigne des personnes selon leur lieu d’origine. « Ceux de » reste naturelle en français et n’importe pas la formulation « les fils de » du parallèle hébreu.
- source_word: Μακαλών
  choice: Makalon
  rationale: Translittération sobre du nom grec, dont l’identification demeure incertaine ; aucune harmonisation conjecturale avec le parallèle hébreu n’est retenue.
- source_word: Βετολιώ
  choice: Bétolio
  rationale: Translittération française du nom propre grec, avec accent facilitant la prononciation, sans identification spéculative.
- source_word: Νειφείς
  choice: les Néiphéis
  rationale: Le nom grec est conservé sous une forme translittérée adaptée au français. L’absence de ἐκ peut permettre d’y voir un nom de groupe plutôt qu’une provenance explicitement formulée.
- source_word: ἑκατὸν εἴκοσι δύο
  choice: cent vingt-deux
  rationale: Rendu cardinal standard en français moderne.
- source_word: πεντήκοντα δύο
  choice: cinquante-deux
  rationale: Rendu cardinal standard en français moderne.
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: cent cinquante-six
  rationale: Rendu cardinal standard en français moderne.
theological_decisions:
- issue: Divergence entre la liste grecque et le parallèle hébreu quant aux noms et aux nombres
  choice: Traduire fidèlement la liste grecque et signaler la divergence dans une note.
  alternative: 'Harmoniser avec le parallèle hébreu : « les fils de Rama et de Guéba, six cent vingt et un ».'
  rationale: Pour 1 Esdras, le grec est le texte source principal. La différence est trop importante pour être corrigée silencieusement d’après le texte massorétique ; la note préserve la transparence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe elliptique d’une liste de recensement est conservée ; les noms propres suivent de près les formes grecques.
