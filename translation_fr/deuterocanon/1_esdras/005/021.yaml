  source_fidelity: Le grec énumère « ceux de Makalōn », puis « ceux de Betoliō », suivis de leurs effectifs, et enfin « Neipheis » avec son effectif. La traduction conserve correctement les deux provenances et les nombres. Toutefois, l’article défini ajouté à « les Néiphéis » n’est pas exprimé dans le grec, dont le dernier nom est simplement juxtaposé dans la liste.
