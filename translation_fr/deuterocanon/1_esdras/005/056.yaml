base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: fr
  text: Ils chargèrent les lévites âgés de vingt ans et plus de superviser les travaux du Seigneur. Alors Josué se présenta avec ses fils et ses frères, ainsi que Kadmiel[a], son frère, les fils de Josué, fils de Hénadad[b], et les fils de Juda, fils d’Éliadoun, avec leurs fils et leurs frères. Tous les lévites, d’un commun accord, dirigeaient les travaux[c] et s’occupaient des ouvrages[d] dans la maison du Seigneur. Et les bâtisseurs bâtirent le temple du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Damadièl » ; la tradition parallèle d’Esdras identifie ce lévite à Kadmiel.
    reason: alternative_reading
  - marker: b
    text: La forme grecque « Hémadaboun » semble correspondre au nom Hénadad dans la tradition hébraïque parallèle.
    reason: alternative_reading
  - marker: c
    text: Le terme grec est rare et peut désigner ceux qui dirigent, surveillent ou font avancer le travail.
    reason: lexical_alternative
  - marker: d
    text: Le grec emploie ici le pluriel « ouvrages » ou « travaux », comme au début du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν ... ἐπὶ τῶν ἔργων
  choice: chargèrent ... de superviser les travaux
  rationale: Dans ce contexte, le verbe et la construction avec ἐπί indiquent l’affectation des lévites à la responsabilité et à la surveillance des travaux, plutôt qu’une simple position physique.
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: âgés de vingt ans et plus
  rationale: La formule exprime naturellement en français un seuil minimal d’âge pour le service.
- source_word: ἔστη Ἰησοῦς
  choice: Josué prit position
  rationale: Cette formulation conserve l’image du verbe grec tout en indiquant que Josué se présente pour assumer la tâche.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: L’expression rend l’unité d’intention et l’action coordonnée des lévites dans un registre courant et digne.
- source_word: ἐργοδιῶκται
  choice: dirigeaient les travaux
  rationale: Ce terme composé rare désigne vraisemblablement ceux qui conduisent, surveillent ou font avancer le travail; la traduction évite la connotation dure de «contremaîtres».
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: s’occupaient des ouvrages
  rationale: La tournure grecque est difficile; cette formulation exprime leur participation active tout en conservant le pluriel ἔργα.
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: les bâtisseurs bâtirent
  rationale: La répétition étymologique du grec est reproduite, puisqu’elle demeure claire et acceptable en français.
- source_word: ναὸν τοῦ κυρίου
  choice: le temple du Seigneur
  rationale: «Temple» rend ναός et maintient sa distinction avec οἶκος, rendu auparavant par «maison».
- source_word: Δαμαδιήλ
  choice: Kadmiel
  rationale: Le grec de Swete porte Damadièl, mais la tradition parallèle d’Esdras permet d’identifier avec une forte probabilité le nom connu Kadmiel; l’écart est signalé en note.
- source_word: Ἡμαδαβούν
  choice: Hénadad
  rationale: La forme grecque semble refléter le nom sémitique Hénadad attesté dans la tradition parallèle; la difficulté textuelle est signalée en note.
theological_decisions:
- issue: Traduction de κύριος dans ce contexte grec de construction du temple
  choice: Seigneur
  alternative: l’Éternel
  rationale: La source directe est le grec κύριος. «Seigneur» traduit celui-ci sans rétrovertir de façon certaine le nom divin hébreu.
- issue: Normalisation de noms propres transmis sous des formes grecques difficiles
  choice: Employer Kadmiel et Hénadad dans le texte, avec notes sur les formes grecques
  alternative: Conserver Damadièl et Hémadaboun dans le texte
  rationale: Les correspondances sont suffisamment étayées par la tradition parallèle pour rendre les référents reconnaissables, mais les notes préservent les données propres au témoin grec.
- issue: Fonction exacte des lévites désignés par ἐργοδιῶκται
  choice: Ils dirigeaient les travaux
  alternative: Ils étaient contremaîtres / surveillants des travaux
  rationale: Le terme rare implique la conduite ou la surveillance du chantier, sans permettre d’en fixer avec certitude le degré d’autorité; une note maintient cette latitude.
translation_notes:
  register: Français international moderne, clair et digne. Les termes du chantier sont concrets; les répétitions significatives et le pluriel grec sont conservés. Les noms bien identifiables sont normalisés selon l’usage biblique français, avec transparence textuelle en notes.
