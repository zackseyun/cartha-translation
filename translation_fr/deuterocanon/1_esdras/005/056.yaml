  naturalness: « Josué prit position » est possible, mais paraît un peu martial et moins naturel ici que « Josué se présenta ». La construction révisée demeure claire en français international moderne tout en conservant la formulation dense de la liste.
  terminology: « Seigneur », « lévites », « maison » et « temple » sont appropriés. « Superviser les travaux » / « dirigeaient les travaux » rend adéquatement le champ de l’affectation et du rare ἐργοδιῶκται, sans imposer le terme plus dur de « contremaîtres ».
