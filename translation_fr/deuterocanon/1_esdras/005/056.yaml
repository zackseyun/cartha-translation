revisions:
- from: Ils chargèrent les lévites âgés de vingt ans et plus de superviser les travaux du Seigneur. Alors Josué prit position avec ses fils et ses frères, ainsi que Kadmiel[a], son frère, les fils de Josué, fils de Hénadad[b], et les fils de Juda, fils d’Éliadoun, avec leurs fils et leurs frères. Tous les lévites, d’un commun accord, dirigeaient les travaux[c] et s’occupaient des ouvrages dans la maison du Seigneur[d]. Et les bâtisseurs bâtirent le temple du Seigneur.
  to: Ils chargèrent les lévites âgés de vingt ans et plus de superviser les travaux du Seigneur. Alors Josué se présenta avec ses fils et ses frères, ainsi que Kadmiel[a], son frère, les fils de Josué, fils de Hénadad[b], et les fils de Juda, fils d’Éliadoun, avec leurs fils et leurs frères. Tous les lévites, d’un commun accord, dirigeaient les travaux[c] et s’occupaient des ouvrages[d] dans la maison du Seigneur. Et les bâtisseurs bâtirent le temple du Seigneur.
  rationale: La révision remplace une expression légèrement surinterprétative par « se présenta », qui rend naturellement le simple verbe grec « se tint », et déplace l’ancre de la note d sur « ouvrages », le pluriel qu’elle commente. Le reste du texte, y compris les noms normalisés signalés en notes et la distinction entre maison et temple, est conservé.
