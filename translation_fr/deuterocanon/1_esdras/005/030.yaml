base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: fr
  text: les fils d’Akoud[a], les fils d’Outa, les fils de Kétab, les fils d’Akkaba, les fils de Sybaéi, les fils d’Anan, les fils de Koua, les fils de Keddour,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu parallèle de Néhémie 7.45 donne une autre liste de familles de portiers, comprenant notamment Shalloum, Ater, Talmôn, Akkoub, Hatita et Shobaï. Comme 1 Esdras conserve ici une liste grecque différente, la traduction suit le grec au lieu de l’harmoniser avec l’hébreu.
    reason: Lecture différente dans le texte parallèle
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste généalogique, la formule désigne les membres d’une famille ou d’un clan. « Les fils de » conserve de manière transparente la répétition du grec sans imposer l’interprétation plus explicite « descendants de ».
- source_word: Ἀκούδ
  choice: Akoud
  rationale: Translittération directe de la forme grecque, avec « ou » pour ου selon l’usage français.
- source_word: Οὐτά
  choice: Outa
  rationale: Translittération de la forme grecque qui rend la séquence initiale ου par « ou ».
- source_word: Κητάβ
  choice: Kétab
  rationale: Translittération française de la forme grecque transmise ici; l’accent facilite la lecture naturelle de η sans harmoniser le nom avec le parallèle hébreu.
- source_word: Ἀκκαβά
  choice: Akkaba
  rationale: Translittération directe qui conserve le double kappa.
- source_word: Συβαεί
  choice: Sybaéi
  rationale: Translittération proche du grec; le tréma indique que les voyelles « a » et « é » se prononcent séparément.
- source_word: Ἀνάν
  choice: Anan
  rationale: Translittération simple et directe du nom grec.
- source_word: Κουά
  choice: Koua
  rationale: Translittération directe qui rend ου par « ou » selon l’usage français.
- source_word: Κεδδούρ
  choice: Keddour
  rationale: Translittération de la forme grecque qui conserve le double delta et rend ου par « ou ».
theological_decisions:
- issue: Rapport entre la liste grecque et le parallèle hébreu approximatif de Néhémie 7.45
  choice: Traduire les noms de la liste grecque tels qu’ils sont transmis, sans les harmoniser avec le texte hébreu.
  alternative: Remplacer ou normaliser certains noms d’après la liste hébraïque des familles de portiers, notamment Shalloum, Ater, Talmôn, Akkoub, Hatita et Shobaï.
  rationale: Pour 1 Esdras, le grec constitue ici le texte source principal. Le parallèle hébreu diffère par ses noms et sa structure; il peut servir de point de comparaison, mais non de base pour corriger ou reconstruire cette liste grecque.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « les fils de » reproduit la structure formulaire de la liste grecque. Les noms propres sont translittérés selon des conventions lisibles en français, sans être remplacés par les formes du parallèle hébreu.
