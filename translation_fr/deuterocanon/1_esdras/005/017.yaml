translation:
  language: fr
  text: les fils de Baitérous[a], trois mille cinq ; les fils de Raguethlomon, cent vingt-trois ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les noms grecs et les nombres de ce verset diffèrent du parallèle approximatif de la tradition hébraïque massorétique, qui porte ici : « les fils de Hashoum, deux cent vingt-trois ». Le texte principal suit le grec de 1 Esdras sans l’harmoniser avec ce parallèle.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste de recensement, la formule désigne les membres d’une famille ou d’un clan. « Les fils de » conserve la structure généalogique du grec sans explicitation excessive.
- source_word: Βαιτηρούς
  choice: Baitérous
  rationale: Translittération française de la forme grecque, avec accent graphique pour guider naturellement la prononciation.
- source_word: τρισχίλιοι πέντε
  choice: trois mille cinq
  rationale: Rendu direct du nombre cardinal grec, écrit en toutes lettres conformément au style de la liste.
- source_word: ἐκ Ῥαγεθλωμῶν
  choice: de Raguethlomon
  rationale: Dans cette formule de recensement, le grec ἐκ marque l’origine ou l’appartenance au groupe. Le français naturel emploie ici « de » plutôt que le littéral et maladroit « issus de ».
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: cent vingt-trois
  rationale: Rendu direct et idiomatique du nombre grec, écrit en toutes lettres.
theological_decisions:
- issue: Les noms et les nombres grecs divergent du parallèle approximatif du texte massorétique.
  choice: Conserver dans le texte principal Baitérous, Raguethlomon et les nombres transmis par le grec.
  alternative: 'Harmoniser avec le parallèle massorétique : « les fils de Hashoum, deux cent vingt-trois ».'
  rationale: Le texte grec de 1 Esdras est ici la source principale. Le parallèle hébreu est utile comme témoin comparatif, mais il ne doit pas remplacer ni lisser une divergence réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève et le point-virgule conservent le rythme d’une liste de recensement. Les noms suivent la forme grecque plutôt qu’une harmonisation avec l’hébreu.
