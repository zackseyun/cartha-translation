base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: fr
  text: 'Les fils de Phthalémoab[a], d’entre les fils de Jésus et de Roboab[b] : deux mille huit cent deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Phthalémoab » ; la tradition hébraïque parallèle donne généralement « Pahath-Moab ».
    reason: alternative_reading
  - marker: b
    text: Le grec porte « Jésus et Roboab ». Dans les listes parallèles d’Esdras et de Néhémie, ce groupe est généralement rapproché de « Jéshoua et Joab ». La leçon grecque est maintenue ici.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ Φθαλεμωάβ
  choice: Les fils de Phthalémoab
  rationale: Dans cette liste de recensement, υἱοὶ désigne les membres d’une lignée ou d’un clan. « Les fils de » conserve la forme généalogique du grec. Le nom Phthalémoab suit le témoin grec principal.
- source_word: εἰς τοὺς υἱοὺς
  choice: du groupe des fils de
  rationale: Ici, εἰς ne marque vraisemblablement pas un mouvement, mais l’appartenance à une subdivision généalogique. Cette tournure rend clairement ce rapport en français naturel.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: La forme française « Jésus » correspond directement au grec Ἰησοῦ. Une harmonisation avec la forme hébraïque ou avec une autre liste parallèle n’est pas imposée au texte principal.
- source_word: Ῥοβοάβ
  choice: Roboab
  rationale: Le grec porte explicitement Ῥοβοάβ. Le texte principal conserve donc cette leçon, même si les listes parallèles sont souvent rapprochées du nom Joab.
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: deux mille huit cent deux
  rationale: Traduction directe du nombre cardinal grec, écrit en toutes lettres dans un registre biblique courant.
