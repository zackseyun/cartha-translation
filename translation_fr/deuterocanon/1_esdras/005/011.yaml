translation_notes:
  register: Français international moderne, sobre et adapté au style d’une liste de recensement. La ponctuation par deux-points introduit naturellement l’effectif. Les formes grecques des noms propres sont conservées dans le texte principal, tandis que les correspondances de la tradition parallèle sont signalées en notes.
