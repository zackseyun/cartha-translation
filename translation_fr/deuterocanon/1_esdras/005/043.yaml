base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: fr
  text: Parmi les chefs des familles, certains, lorsqu’ils arrivèrent au temple de Dieu à Jérusalem, s’engagèrent[a] à relever la maison sur son emplacement, selon leurs moyens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firent le vœu de rebâtir la maison à sa place ». Le verbe grec peut exprimer un vœu; ici, « la maison » désigne le temple.
    reason: Alternative lexicale préservant l’ambiguïté de εὔξαντο et explicitant le sens contextuel de οἶκον.
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: chefs des familles
  rationale: L’expression désigne les responsables de groupes fondés sur la filiation. « Chefs des familles » est naturel en français moderne et conserve la structure sociale du texte.
- source_word: παραγίνεσθαι
  choice: arrivèrent
  rationale: Dans ce contexte, le verbe décrit leur venue au temple de Jérusalem; « arrivèrent » exprime clairement l’aboutissement du déplacement.
- source_word: ἱερὸν τοῦ θεοῦ
  choice: temple de Dieu
  rationale: Ἱερόν désigne ici le sanctuaire ou l’ensemble du temple; « temple de Dieu » est la formulation française la plus claire.
- source_word: εὔξαντο
  choice: s’engagèrent
  rationale: Le verbe peut évoquer un vœu, mais, suivi de l’infinitif, il exprime ici une résolution solennelle. « S’engagèrent » préserve cette force sans imposer l’idée d’un vœu cultuel formel.
- source_word: ἐγεῖραι
  choice: à relever
  rationale: Le sens littéral est « faire lever, dresser ». « Relever » conserve l’image grecque tout en suggérant naturellement la reconstruction d’un édifice détruit.
- source_word: οἶκον
  choice: la maison
  rationale: Le terme renvoie à la maison de Dieu, c’est-à-dire au temple. Le maintien de « maison » préserve l’expression et l’imagerie du grec, le référent étant éclairé par la mention précédente du temple.
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: sur son emplacement
  rationale: La formule indique que l’édifice doit être rétabli à l’endroit qui est le sien; cette traduction est précise et idiomatique.
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: selon leurs moyens
  rationale: La formule exprime une action proportionnée aux ressources ou à la capacité de chacun. « Selon leurs moyens » convient particulièrement au contexte de contribution à la reconstruction sans exclure entièrement la capacité pratique.
theological_decisions:
- issue: εὔξαντο désigne-t-il un vœu religieux formel ou un engagement plus général?
  choice: s’engagèrent
  alternative: firent le vœu
  rationale: Le contexte de la restauration du temple donne à l’acte une portée solennelle, mais la construction avec l’infinitif peut exprimer une entreprise résolue sans exiger le sens technique d’un vœu cultuel. La note conserve l’autre possibilité.
- issue: οἶκον doit-il être explicité comme « temple »?
  choice: la maison
  alternative: le temple
  rationale: Le grec passe de ἱερόν à οἶκος. Conserver cette variation respecte l’image biblique de la maison de Dieu, tandis que le contexte immédiat rend le référent suffisamment clair.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe partitive du grec est rendue par « Parmi… certains ». « Relever la maison » garde l’image du texte source, tandis que la note fournit l’expression plus explicite « rebâtir ».
