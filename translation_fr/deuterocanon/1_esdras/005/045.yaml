base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: fr
  text: Les prêtres, les lévites et des membres du peuple[a] s’établirent à Jérusalem et dans la région, ainsi que les chantres du Temple et les gardiens des portes; tout Israël s’établit dans ses villages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux de son peuple ». Le référent du possessif « son » n’est pas clairement indiqué dans le grec; l’expression semble désigner des membres non sacerdotaux de la communauté.'
    reason: La note conserve une formulation grecque ambiguë que le français courant ne peut reproduire ici sans suggérer un antécédent inexistant.
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: s’établirent
  rationale: L’aoriste passif de κατοικίζω exprime ici l’installation durable d’une population. « S’établirent » est naturel en français et convient au contexte du retour et de la réinstallation.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Équivalent français usuel et précis dans le contexte cultuel d’Israël.
- source_word: οἱ Λευεῖται
  choice: les lévites
  rationale: Désignation traditionnelle et exacte du groupe lévitique.
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: des membres du peuple[a]
  rationale: Cette formulation désigne naturellement une partie de la population non sacerdotale sans attribuer au possessif grec αὐτοῦ un antécédent incertain. La note conserve la formulation littérale et son ambiguïté.
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: à Jérusalem et dans la région
  rationale: χώρα désigne ici le territoire par opposition à la ville de Jérusalem. « La région » reste proche du grec sans ajouter explicitement l’idée de proximité contenue dans « région environnante ».
- source_word: οἵ τε ἱεροψάλται
  choice: ainsi que les chantres du Temple
  rationale: ἱεροψάλται désigne des chanteurs affectés au culte. « Chantres du Temple » exprime clairement leur fonction dans un registre digne et actuel.
- source_word: οἱ θυρωροὶ
  choice: les gardiens des portes
  rationale: Cette expression rend la fonction institutionnelle des θυρωροί plus précisément que le simple terme « portiers ».
- source_word: πᾶς Ἰσραήλ
  choice: tout Israël
  rationale: Rendu conventionnel qui conserve la désignation collective du peuple sans la réduire à une affirmation explicitement distributive sur chaque individu.
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: dans ses villages
  rationale: κώμη désigne normalement un village ou une petite localité. En français, le collectif singulier « tout Israël » appelle naturellement le possessif singulier « ses ».
theological_decisions:
- issue: Portée de πᾶς Ἰσραήλ
  choice: tout Israël, comme désignation collective du peuple restauré
  alternative: chaque Israélite sans exception
  rationale: La formule grecque est conservée sans explicitation. Dans cette liste de groupes et de lieux d’habitation, elle peut désigner collectivement la communauté d’Israël; la traduction ne transforme toutefois pas cette lecture contextuelle en paraphrase.
- issue: Référent du possessif αὐτοῦ dans οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: ne pas identifier le référent dans le corps du texte et signaler la tournure littérale en note
  alternative: « ceux de son peuple », avec maintien direct du possessif énigmatique
  rationale: Le grec porte bien un possessif singulier, mais aucun antécédent personnel évident n’apparaît dans la phrase. Une traduction française fluide évite de créer un référent artificiel, tandis que la note préserve l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Chantres du Temple » maintient la coloration cultuelle, tandis que « s’établirent » et « gardiens des portes » restent accessibles. Le point-virgule clarifie la répartition géographique implicite sans modifier les groupes énumérés.
