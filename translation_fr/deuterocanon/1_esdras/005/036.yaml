base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/036.yaml
  text: These were the ones who came up from Thermeleth and Thelersas, with Charaathalan and Allar leading them.
translation:
  language: fr
  text: Voici ceux qui montèrent de Therméleth et de Thélersas, sous la conduite de Charaathalan et d’Allar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβάντες
  choice: montèrent
  rationale: Le participe aoriste d’ἀναβαίνω exprime ici la montée vers Jérusalem; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: ἀπὸ Θερμέλεθ καὶ Θελερσάς
  choice: de Therméleth et de Thélersas
  rationale: Translittération française des toponymes grecs, la préposition «de» rendant naturellement ἀπό.
- source_word: ἡγούμενος αὐτῶν
  choice: sous la conduite de
  rationale: Cette tournure rend le sens de direction ou de conduite du participe ἡγούμενος et évite d’imposer un titre institutionnel précis.
- source_word: Χαρααθαλὰν καὶ Ἀλλάρ
  choice: Charaathalan et Allar
  rationale: Translittération directe des formes grecques, qui demeurent l’ancrage principal malgré l’écart du parallèle massorétique.
