  register: Français moderne, digne et narratif. Les noms propres suivent les formes grecques de Swete. La construction grecque met littéralement «leur dirigeant» au singulier devant deux noms; la traduction conserve la fonction collective sans résoudre artificiellement cette tension syntaxique par un titre ou une hiérarchie précise.
