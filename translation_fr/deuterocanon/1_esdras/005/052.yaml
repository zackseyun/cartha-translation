base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: fr
  text: Et tous ceux qui avaient fait un vœu à Dieu commencèrent, dès la nouvelle lune du premier mois, à offrir des sacrifices à Dieu, et le temple de Dieu n’était pas encore bâti.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est introduite en grec par « et ». Dans le contexte, elle peut aussi avoir une nuance concessive : les sacrifices commencèrent alors même que le temple n’était pas encore bâti.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu parallèle d’Esdras diffère ici : il parle de la fête des Tentes et des holocaustes quotidiens prescrits. Le texte principal suit la formulation grecque propre à 1 Esdras.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Cette formulation naturelle conserve la portée inclusive du relatif indéfini grec.
- source_word: εὔξαντο εὐχήν
  choice: avaient fait un vœu
  rationale: La construction avec verbe et nom de même racine désigne ici l’accomplissement d’un vœu. Le français idiomatique « faire un vœu » en rend le sens sans reproduire lourdement la répétition grecque.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif désigne le destinataire du vœu puis celui à qui les sacrifices sont offerts; la même expression est donc conservée aux deux endroits.
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: dès la nouvelle lune du premier mois
  rationale: νουμηνία désigne la nouvelle lune qui marque le commencement du mois. « Dès » exprime naturellement le point de départ temporel indiqué par ἀπό.
- source_word: ἤρξαντο προσφέρειν
  choice: commencèrent … à offrir
  rationale: La construction marque le début de l’activité sacrificielle; cette tournure française en conserve clairement la valeur ingressive.
- source_word: θυσίας
  choice: des sacrifices
  rationale: Le terme grec désigne précisément des offrandes sacrificielles; « sacrifices » est plus exact que le terme général « offrandes ».
- source_word: ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο
  choice: le temple de Dieu n’ait pas encore été bâti
  rationale: Le plus-que-parfait passif grec indique que la construction n’était pas encore achevée. « Bâti » respecte le verbe grec sans introduire explicitement l’idée de reconstruction.
theological_decisions:
- issue: Valeur de καί devant la dernière proposition
  choice: Rendre la relation de manière concessive par « bien que »
  alternative: 'Conserver la simple coordination : « et le temple de Dieu n’avait pas encore été bâti »'
  rationale: La forme grecque emploie une coordination, mais le contexte met en relief la reprise des sacrifices malgré l’absence d’un temple bâti. La note signale la formulation plus littérale afin de préserver l’ambiguïté syntaxique.
- issue: Rapport avec le texte hébreu parallèle d’Esdras
  choice: Suivre le texte grec distinct de 1 Esdras, qui parle des personnes ayant fait un vœu et du temple non encore bâti
  alternative: Harmoniser avec le texte hébreu, qui mentionne la fête des Tentes et les holocaustes quotidiens prescrits
  rationale: Le grec fourni est le témoin principal pour 1 Esdras. La divergence substantielle du parallèle hébreu doit être signalée, non effacée par harmonisation.
translation_notes:
  register: Français international actuel, clair et digne. « Nouvelle lune » conserve la précision cultuelle et calendaire du grec; « temple » et « sacrifices » maintiennent le vocabulaire religieux sans coloration confessionnelle particulière.
