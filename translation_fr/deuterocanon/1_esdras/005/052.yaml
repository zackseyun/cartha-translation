    rationale: Le grec porte καί (« et »). Le rapport concessif est contextuellement possible, mais demeure une explicitation interprétative. La coordination française préserve mieux la syntaxe et l’ambiguïté du témoin grec.
  - severity: low
    issue: Le temps « n’ait pas encore été bâti » ne reproduit pas au mieux l’état passé exprimé par le plus-que-parfait grec.
    rationale: « Le temple de Dieu n’était pas encore bâti » exprime naturellement l’état non accompli au moment où les sacrifices commencèrent.
