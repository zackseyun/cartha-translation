    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: les Chadiasai et les Ammidioi
  rationale: Dans cette liste de recensement, l’article substantivé désigne des groupes. Le français « les Chadiasai et les Ammidioi » conserve cette valeur sans ajouter « fils de », absent du grec.
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: quatre cent vingt-deux
  rationale: Rendu direct du nombre cardinal selon l’usage orthographique français courant.
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: ceux de Keiramas Kabbes
  rationale: La préposition ἐκ exprime ici l’origine ou l’appartenance. « Ceux de » préserve cette indétermination et n’introduit ni conjonction ni relation généalogique absentes du grec. La séquence des noms demeure toutefois difficile.
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: six cent vingt et un
  rationale: Rendu direct du nombre cardinal en français naturel.
