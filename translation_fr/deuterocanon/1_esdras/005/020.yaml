translation:
  language: fr
  text: les Chadiasai et les Ammidioi, quatre cent vingt-deux ; ceux de Keiramas Kabbes[a], six cent vingt et un[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ceux de Keiramas Kabbes ». La relation entre les deux noms n’est pas précisée, et le texte parallèle hébreu diffère nettement à cet endroit.
    reason: alternative_reading
  - marker: b
