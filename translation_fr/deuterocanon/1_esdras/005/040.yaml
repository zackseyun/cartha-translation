base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: fr
  text: Néhémie et Atharias leur dirent de ne pas prendre part aux choses saintes jusqu’à ce que se lève un prêtre revêtu de la manifestation et de la vérité[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement, « la manifestation et la vérité » renvoient aux éléments sacerdotaux appelés, dans le parallèle hébreu, les Ourim et les Toummim.
    reason: alternative_reading
  - marker: b
    text: Dans ce contexte, les « choses saintes » désignent probablement les portions sacrées réservées aux prêtres ; le prêtre devait pouvoir rendre une décision.
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: leur dirent
  rationale: Cette tournure naturelle en français introduit l’ordre exprimé par l’infinitif. Le pluriel s’accorde avec le sujet composé « Néhémie et Atharias », malgré le singulier formel du verbe grec.
- source_word: Ναιμίας
  choice: Néhémie
  rationale: Forme française traditionnelle et aisément reconnaissable du nom correspondant au grec Ναιμίας.
- source_word: Ἀθαρίας
  choice: Atharias
  rationale: Translittération française directe de la forme grecque, sans l’harmoniser avec un éventuel équivalent sémitique.
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: de ne pas prendre part aux choses saintes
  rationale: « Prendre part » rend μετέχειν sans préciser indûment s’il s’agit de manger des aliments consacrés ou, plus largement, de bénéficier de droits sacrés. Le pluriel substantivé τῶν ἁγίων est conservé.
- source_word: ἕως ἀναστῇ ἱερεὺς
  choice: jusqu’à ce que se lève un prêtre
  rationale: Le subjonctif français correspond à la construction prospective grecque; « se lève » conserve l’image de ἀναστῇ et l’attente d’une autorité sacerdotale apte à trancher.
- source_word: ἐνδεδυμένος
  choice: revêtu de
  rationale: Rend le participe parfait dans un registre cultuel digne et naturel.
- source_word: τὴν δήλωσιν
  choice: la Manifestation
  rationale: δήλωσις désigne ce qui rend manifeste ou fait connaître. La majuscule signale ici l’un des deux objets ou moyens sacerdotaux formant une paire, sans remplacer le terme grec par « Ourim » dans le texte principal.
- source_word: τὴν ἀλήθειαν
  choice: la Vérité
  rationale: Traduction directe de ἀλήθεια. La majuscule marque son emploi dans la paire cultuelle traditionnellement rapprochée des Ourim et des Toummim.
theological_decisions:
- issue: Faut-il traduire la paire sacerdotale selon les mots grecs ou l’harmoniser avec les termes hébreux traditionnels ?
  choice: Conserver dans le texte « la Manifestation et la Vérité » et indiquer en note leur identification traditionnelle avec les Ourim et les Toummim.
  alternative: les Ourim et les Toummim
  rationale: Le grec de 1 Esdras constitue la source principale et emploie des équivalents sémantiques plutôt qu’une translittération. Le texte principal suit donc sa formulation propre, tandis que la note fournit l’identification traditionnelle utile sans effacer la particularité du témoin grec.
- issue: Portée de l’interdiction concernant τῶν ἁγίων
  choice: Employer l’expression générale « les choses saintes » dans le texte et expliquer en note l’application probable aux portions sacerdotales consacrées.
  alternative: les aliments très saints réservés aux prêtres
  rationale: Le contexte sacerdotal rend probable une interdiction de manger les portions sacrées, mais le grec reste plus large. La traduction préserve cette latitude au lieu de transformer l’interprétation contextuelle en précision explicite du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère cultuel du passage ainsi que l’ambiguïté du grec sur la nature exacte des « choses saintes ». Les majuscules à « Manifestation » et « Vérité » indiquent une paire technique sans imposer dans le texte principal la terminologie hébraïque traditionnelle.
