  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: fr
  text: si bien que le peuple ne pouvait entendre les trompettes à cause des pleurs du peuple[a] ; car la foule les faisait retentir avec force[b], si bien que cela s’entendait de loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle hébreu d’Esdras 3.11 décrit le peuple poussant un grand cri de louange au Seigneur ; ici, 1 Esdras met davantage en avant le son des trompettes et les pleurs.
    reason: cross_reference
  - marker: b
    text: 'Ou : « en faisait puissamment entendre le son ». Le grec emploie le verbe apparenté au mot « trompette » et peut mettre l’accent sur les sonneries elles-mêmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit dans les deux occurrences une conséquence et garde clairement la progression logique du grec.
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Équivalent courant de λαός dans ce contexte narratif ; la répétition du grec est conservée.
- source_word: μὴ ἀκούειν
  choice: ne pouvait pas entendre
  rationale: Exprime naturellement en français l’impossibilité résultant du volume des pleurs.
- source_word: τῶν σαλπίγγων
  choice: les trompettes
  rationale: Reste proche du grec, où les instruments désignent par métonymie le son qu’ils produisent.
- source_word: διὰ τὸν κλαυθμόν
  choice: à cause des pleurs
  rationale: κλαυθμός désigne des pleurs audibles ; « pleurs » convient au registre narratif et à la dimension sonore de la scène.
- source_word: ὁ γὰρ ὄχλος
  choice: car la foule
  rationale: « Foule » rend naturellement ὄχλος et « car » conserve la valeur explicative de γάρ.
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: les faisait retentir avec force
  rationale: La tournure rend idiomatiquement la construction périphrastique et rattache le pronom aux trompettes déjà mentionnées, sans effacer l’intensité de μεγάλως.
- source_word: μακρόθεν
  choice: de loin
  rationale: Formulation française actuelle, concise et fidèle à l’adverbe grec.
- source_word: ἀκούεσθαι
  choice: on les entendait
  rationale: Le passif grec est rendu par le pronom indéfini français ; le pluriel explicite les trompettes comme référent sonore probable.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « peuple » reproduit celle du grec, tandis que « les faisait retentir » explicite sobrement le lien avec les trompettes. La ponctuation conserve les deux propositions consécutives encadrant l’explication introduite par « car ».
