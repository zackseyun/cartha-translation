base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: fr
  text: Par des intrigues, en soulevant la population et en formant des factions, ils empêchèrent l’achèvement de la construction pendant toute la vie du roi Cyrus[a] ; et ils furent empêchés de construire pendant deux ans, jusqu’au règne de Darius[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pendant tout le temps de la vie du roi Cyrus » ; dans ce contexte, l’expression peut viser toute la durée de son règne.'
    reason: Précision littérale et possibilité contextuelle.
  - marker: b
    text: 'Le grec a un verbe passif au pluriel : « ils furent empêchés de construire ». On peut aussi comprendre le sens de manière plus impersonnelle : « la construction fut interrompue pendant deux ans, jusqu’au règne de Darius ».'
    reason: Ambiguïté du sujet et autre formulation possible de la proposition finale.
lexical_decisions:
- source_word: βουλάς
  choice: des intrigues
  rationale: Dans ce contexte d’opposition, le pluriel désigne des desseins concertés et hostiles plutôt que de simples projets. « Intrigues » exprime naturellement cette intention en français.
- source_word: δημαγωγοῦντες
  choice: en soulevant la population
  rationale: Le participe évoque l’action d’influencer ou d’agiter le peuple. Cette formulation garde la nuance d’incitation publique sans recourir au terme peu naturel « démagoguer ».
- source_word: συστάσεις ποιούμενοι
  choice: en formant des factions
  rationale: L’expression désigne la constitution de groupes organisés ou de coalitions d’opposition. « Former des factions » conserve ce caractère concerté.
- source_word: ἀπεκώλυσαν τοῦ ἀποτελεσθῆναι τὴν οἰκοδομήν
  choice: ils empêchèrent l’achèvement de la construction
  rationale: La tournure rend l’obstruction active et le sens résultatif de l’infinitif passif, tout en comprenant οἰκοδομή comme l’entreprise de construction.
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: pendant toute la vie du roi Cyrus
  rationale: Cette traduction reste proche de l’expression grecque et évite de remplacer explicitement « vie » par « règne », même si le contexte politique peut orienter ainsi la compréhension.
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: ils furent empêchés de construire
  rationale: Le verbe grec est un passif pluriel et le génitif porte sur l’activité de bâtir. La traduction conserve donc un sujet personnel implicite plutôt que de transformer sans indication la clause en passif impersonnel portant sur les travaux.
- source_word: ἔτη δύο
  choice: pendant deux ans
  rationale: Cette formulation temporelle est idiomatique en français avec le passif « furent empêchés ».
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: jusqu’au règne de Darius
  rationale: « Règne » est l’équivalent français naturel de βασιλεία dans ce repère chronologique royal.
theological_decisions:
- issue: Sujet et portée de la dernière proposition passive
  choice: 'Conserver le pluriel personnel : « ils furent empêchés de construire »'
  alternative: « La construction fut interrompue pendant deux ans »
  rationale: εἰρχθησαν est morphologiquement un passif pluriel et renvoie le plus naturellement aux personnes engagées dans les travaux, bien que le sujet ne soit pas nommé dans cette proposition et que le français puisse aussi exprimer l’effet subi par la construction. La note maintient cette ambiguïté narrative sans en faire une question doctrinale.
- issue: Durée associée à Cyrus
  choice: « pendant toute la vie du roi Cyrus »
  alternative: « pendant tout le règne du roi Cyrus »
  rationale: Le grec dit explicitement « toute la durée de la vie ». La traduction ne substitue donc pas « règne », même si celui-ci peut être visé dans le cadre du récit.
translation_notes:
  register: Français moderne, international et digne. Le rythme coordonné du grec est légèrement réorganisé pour une lecture naturelle. « Population » évite une connotation exclusivement urbaine de « foule », tandis que « intrigues » et « factions » rendent clairement l’opposition organisée sans surinterprétation confessionnelle.
