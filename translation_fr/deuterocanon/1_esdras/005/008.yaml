review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au grec : le retour à Jérusalem et dans le reste de la Judée, la destination distributive « chacun dans sa propre ville », puis le groupe venu avec Zorobabel et Yéchoua sont correctement rendus. La liste doit toutefois conserver plus exactement Βορολείου, pour lequel « Boroélios » reflète mieux la forme grecque que « Borolios ».'
  naturalness: Le français est globalement clair et d’un registre narratif moderne et soutenu. La finale « ..., Baana, leurs chefs » est une apposition un peu suspendue en français ; « qui étaient leurs chefs » rend explicitement et naturellement la fonction appositionnelle de τῶν προηγουμένων αὐτῶν.
  terminology: « Judée », « Zorobabel », « Yéchoua », « Mardochée » et « chefs » conviennent. « Yéchoua » est une identification contextuelle raisonnable sans normaliser le nom en « Josué ». Les formes moins connues de la liste sont à maintenir d’après le grec, avec une note signalant l’écart possible avec les parallèles hébreux.
  issues:
  - severity: medium
    issue: Forme du nom Βορολείου
    rationale: « Borolios » ne rend pas suffisamment la séquence grecque -ολει- ; « Boroélios » en conserve mieux la forme sans l’harmoniser avec un parallèle hébreu.
  - severity: low
    issue: Rattachement de « leurs chefs »
    rationale: Le grec permet une apposition aux noms énumérés. En français, l’ajout de « qui étaient » évite qu’un groupe nominal détaché paraisse grammaticalement flottant, sans modifier le sens.
