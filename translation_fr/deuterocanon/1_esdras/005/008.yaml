base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: fr
  text: 'Et chacun retourna à Jérusalem et dans le reste de la Judée, chacun dans sa propre ville : ceux qui étaient venus avec Zorobabel et Yéchoua, Néhémie, Zaraïa, Résaïa, Énénios, Mardochée, Béelsaros, Aspharasos, Boroélios, Roïmos et Baana[a], qui étaient leurs chefs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de cette liste diffèrent par leur forme de ceux des parallèles hébreux approximatifs dans Esdras et Néhémie. La traduction suit ici le texte grec de 1 Esdras au lieu de les harmoniser avec les formes hébraïques.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: retourna
  rationale: Le verbe exprime ici le retour vers un lieu antérieur. Le passé simple convient au registre narratif biblique sans être archaïque.
- source_word: τὴν λοιπὴν Ἰουδαίαν
  choice: le reste de la Judée
  rationale: Cette formulation naturelle conserve l’opposition entre Jérusalem et les autres parties de la Judée.
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: chacun dans sa propre ville
  rationale: La tournure garde la valeur distributive de ἕκαστος et rend πόλις par « ville ».
- source_word: οἱ ἐλθόντες
  choice: ceux qui étaient venus
  rationale: Le plus-que-parfait situe leur venue avant le retour raconté dans la proposition principale et restitue naturellement le participe substantivé.
- source_word: μετά
  choice: avec
  rationale: La préposition marque simplement l’accompagnement.
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: Zorobabel et Yéchoua
  rationale: « Zorobabel » est la forme française traditionnelle. « Yéchoua » identifie clairement le dirigeant postexilique et évite de le confondre, en français courant, avec Jésus de Nazareth.
- source_word: τῶν προηγουμένων αὐτῶν
  choice: leurs chefs
  rationale: Le participe désigne ceux qui marchaient à leur tête, donc leurs dirigeants. « Chefs » est concis et conserve la fonction sociale du terme.
- source_word: proper-name list
  choice: Néhémie, Zaraïa, Résaïa, Énénios, Mardochée, Béelsaros, Aspharasos, Borolios, Roïmos et Baana
  rationale: Les formes françaises suivent ou translittèrent les noms grecs de 1 Esdras sans les remplacer systématiquement par ceux des parallèles hébreux approximatifs.
theological_decisions:
- issue: Identification d’Ἰησοῦ dans la liste des chefs du retour
  choice: Yéchoua
  alternative: Jésus ou Josué
  rationale: « Yéchoua » préserve l’identité historique du personnage postexilique sans suggérer qu’il s’agit de Jésus de Nazareth; « Josué » constituerait une normalisation plus poussée d’après la tradition hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe conserve la reprise distributive « chacun… chacun », présente dans le grec, ainsi que l’apposition finale « leurs chefs », malgré sa légère densité.
