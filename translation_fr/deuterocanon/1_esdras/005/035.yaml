base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/035.yaml
  text: 'All the temple servants and the sons of Solomon’s servants: three hundred seventy-two[a].'
translation:
  language: fr
  text: Tous les serviteurs du Temple et les fils des serviteurs de Salomon étaient au nombre de trois cent soixante-douze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « esclaves du Temple » et « fils des esclaves de Salomon » ; les termes grecs désignent un service dépendant et peuvent avoir une nuance servile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Tous
  rationale: L’adjectif récapitule les deux groupes; « Tous » en conserve la portée totalisante dans une formulation française naturelle.
- source_word: ἱερόδουλοι
  choice: serviteurs du Temple
  rationale: Le composé désigne des personnes attachées au service du sanctuaire. « Serviteurs du Temple » exprime clairement leur fonction sans trancher excessivement la question de leur statut servile.
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: les descendants des serviteurs de Salomon
  rationale: Dans une liste généalogique, υἱοί désigne naturellement les descendants. παῖδες peut signifier « serviteurs » ou « esclaves »; le premier terme convient au texte principal, tandis que la nuance plus servile est signalée en note.
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: trois cent soixante-douze
  rationale: Rendu direct du nombre cardinal, avec l’orthographe française traditionnelle et l’invariabilité de « cent » puisqu’il est suivi d’un autre nombre.
theological_decisions:
- issue: Rendu des termes désignant un service socialement dépendant
  choice: « serviteurs du Temple » et « serviteurs de Salomon » dans le texte principal
  alternative: « esclaves du Temple » et « esclaves de Salomon »
  rationale: Le grec peut comporter une nuance servile, mais le verset présente avant tout le total administratif de catégories reconnues. Le texte principal évite de préciser au-delà de ce qu’impose le contexte, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La phrase verbale « étaient au nombre de » rend naturellement en français la tournure nominale elliptique de cette entrée de recensement. « Temple » porte une majuscule en tant que désignation du sanctuaire de Jérusalem.
