base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: fr
  text: 'Tous ceux-là étaient Israélites, âgés de douze ans ou plus, sans compter les serviteurs et les servantes[a] : 42 360. Leurs serviteurs et leurs servantes étaient au nombre de 7 337 ; les chanteurs et les chanteuses[b], de 245.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les esclaves, hommes et femmes ». Les termes grecs peuvent désigner des personnes au service d’une maisonnée et placées dans une condition dépendante ; ici, le contexte porte sur leur dénombrement plutôt que sur leur statut juridique précis.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie deux termes distincts, ψάλται et ψαλτῳδοί, compris ici comme désignant des chanteurs et des chanteuses.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ δὲ πάντες
  choice: Tous ceux-là
  rationale: La formule récapitule naturellement l’ensemble des personnes énumérées auparavant, sans surtraduire δέ.
- source_word: ἦσαν Ἰσραήλ
  choice: étaient Israélites
  rationale: Le grec dit littéralement « étaient Israël », mais désigne ici l’identité du groupe recensé. « Étaient Israélites » est idiomatique en français et conserve ce sens.
- source_word: ἀπὸ δωδεκαετοῦς
  choice: âgés de douze ans ou plus
  rationale: Dans ce contexte de recensement, la tournure indique le seuil d’âge à partir duquel les personnes sont comptées.
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: sans compter les serviteurs et les servantes
  rationale: παῖδες et παιδίσκαι peuvent désigner des enfants ou des personnes de condition dépendante. Leur total séparé dans cette liste favorise ici le sens de serviteurs et servantes.
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: 42 360
  rationale: Restitution directe du total, avec la typographie numérique française.
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: Leurs serviteurs et leurs servantes
  rationale: τούτων marque l’appartenance à ceux qui viennent d’être recensés ; la distinction masculine et féminine du grec est maintenue.
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: 7 337
  rationale: Restitution directe du nombre.
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: les chanteurs et les chanteuses
  rationale: Cette formulation française naturelle conserve la distinction entre les deux groupes exprimée par les termes grecs.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: '245'
  rationale: Restitution directe du nombre.
theological_decisions:
- issue: Expression identitaire ἦσαν Ἰσραήλ
  choice: étaient Israélites
  alternative: étaient Israël
  rationale: Le littéralisme « étaient Israël » pourrait accentuer une identité collective, mais il est peu naturel ici. Le pluriel « Israélites » transmet clairement l’appartenance identitaire et communautaire sans ajouter d’interprétation doctrinale.
- issue: Statut social exprimé par παῖδες / παιδίσκαι
  choice: serviteurs et servantes
  alternative: esclaves et femmes esclaves ; garçons et filles
  rationale: Le vocabulaire grec reste sémantiquement ouvert, mais le décompte séparé de ces personnes favorise le sens de dépendants domestiques. « Serviteurs et servantes » évite de trancher plus précisément leur statut juridique ; l’alternative « esclaves » est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Les chiffres sont présentés selon l’usage typographique français. La formulation garde le caractère administratif du recensement tout en restant fluide à la lecture.
