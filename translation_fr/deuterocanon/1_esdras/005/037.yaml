base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: fr
  text: 'Ils ne purent indiquer leurs familles ni leur ascendance, comme étant issus d’Israël : les fils d’Asan, fils du fils de Baénan[a], les fils de Nékodan[b], six cent cinquante-deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Après l’en-tête « les fils de », le grec porte littéralement « Asan, du fils de Baénan ». La relation généalogique ainsi formulée est inhabituelle; la traduction l’explicite sans la régulariser.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec donne ici les noms « Asan », « Baénan » et « Nékodan ». Le passage parallèle approximatif du texte massorétique, en Néhémie 7, présente à cet endroit des noms différents; les formes grecques sont donc maintenues dans le texte.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: ils ne purent indiquer
  rationale: Cette formulation exprime clairement l’incapacité de fournir ou d’établir des renseignements généalogiques, dans un registre adapté à une liste officielle.
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: leurs familles ni leur ascendance
  rationale: « Familles » rend les groupes familiaux paternels, tandis qu’« ascendance » distingue le second terme en désignant la filiation généalogique. « Ni » est naturel après la négation française.
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: comme étant issus d’Israël
  rationale: Cette traduction conserve la valeur déclarative de ὡς sans transformer explicitement la proposition en question indirecte (« s’ils étaient »). Elle laisse entendre qu’ils ne pouvaient établir leur origine israélite.
- source_word: υἱοὶ
  choice: les fils de
  rationale: Dans cette liste généalogique, « fils de » reste la traduction transparente, même si le terme peut englober des descendants.
- source_word: Ἀσὰν τοῦ υἱοῦ τοῦ Βαενάν
  choice: Asan, fils du fils de Baénan
  rationale: La formulation conserve la double relation filiale transmise par le grec au lieu de la simplifier sans appui textuel.
- source_word: Νεκωδάν
  choice: Nékodan
  rationale: Le nom est translittéré d’après le témoin grec principal, avec une accentuation facilitant la lecture française.
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: six cent cinquante-deux
  rationale: Forme française courante et exacte du total grec.
theological_decisions:
- issue: Nature de l’origine israélite non démontrée
  choice: comme étant issus d’Israël
  alternative: pour prouver qu’ils étaient issus d’Israël / s’ils étaient issus d’Israël
  rationale: Le texte affirme l’impossibilité de déclarer l’origine généalogique; la traduction retenue évite d’ajouter explicitement une notion de preuve ou une interrogation que le grec n’énonce pas formellement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe de la liste demeure légèrement formelle, tandis que la tournure généalogique irrégulière du grec est signalée plutôt que silencieusement corrigée.
