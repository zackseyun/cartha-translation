base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: fr
  text: Et tout le peuple fit retentir les trompettes et poussa de grands cris, en louant le Seigneur à l’occasion du relèvement[a] de la maison du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconstruction ». Le grec emploie un terme évoquant le fait de relever ou d’ériger la maison du Seigneur; dans ce contexte, il peut aussi désigner sa restauration.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Expression collective naturelle en français, qui conserve la totalité exprimée par πᾶς.
- source_word: ἐσάλπισαν
  choice: sonna de la trompette
  rationale: Le verbe grec signifie faire retentir une trompette. Le singulier collectif s’accorde naturellement avec « tout le peuple » sans préciser un nombre d’instruments absent du texte.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: poussa de grands cris
  rationale: Formulation idiomatique qui rend à la fois l’action de crier et l’intensité de φωνῇ μεγάλῃ.
- source_word: ὑμνοῦντες
  choice: en louant
  rationale: Rend le participe de manière fluide sans imposer que la louange ait nécessairement été chantée.
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: Dans ce contexte cultuel, κύριος désigne le Dieu d’Israël; « le Seigneur » traduit directement le texte grec.
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: pour le relèvement
  rationale: « Relèvement » conserve l’image de l’action de relever ou d’ériger tout en pouvant évoquer, dans ce contexte, la reconstruction du temple.
- source_word: τοῦ οἴκου Κυρίου
  choice: de la maison du Seigneur
  rationale: Préserve l’expression biblique « maison du Seigneur » et son écho intertextuel, plutôt que de l’expliciter par « temple ».
theological_decisions:
- issue: Traduction de κύριος lorsqu’il désigne le Dieu d’Israël
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: La source immédiate est grecque et porte κύριος; la traduction ne substitue donc pas directement la graphie conventionnelle du nom divin hébreu.
- issue: Portée de ἐγέρσει appliqué à la maison du Seigneur
  choice: relèvement
  alternative: reconstruction
  rationale: Le choix principal préserve l’image et l’amplitude du grec, qui peut désigner l’érection ou la restauration de l’édifice, tandis que la note donne le sens contextuel plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque tout en employant les tournures idiomatiques « pousser de grands cris » et « sonner de la trompette ».
