review_pass:
  verdict: revise
  source_fidelity: Le verset grec exprime bien l’action collective de sonner des trompettes, de pousser un grand cri et de louer le Seigneur à l’occasion de l’ἐγέρσις de sa maison. « Relèvement » conserve utilement l’amplitude du terme, sans réduire d’emblée celui-ci à la reconstruction.
  naturalness: « Sonner de la trompette » au singulier avec « tout le peuple » est moins naturel ici et peut laisser entendre une seule trompette. « Faire retentir les trompettes » rend idiomatiquement le verbe grec. « À l’occasion du relèvement » est plus naturel et plus précis que « pour le relèvement » pour exprimer ἐπί avec le datif.
  terminology: « Le Seigneur » et « la maison du Seigneur » sont appropriés. La note doit éviter de présenter « relèvement » comme la seule traduction littérale exacte et expliquer qu’il s’agit d’un terme grec de l’idée de relever/ériger, applicable aussi à une restauration.
  issues:
  - severity: low
    issue: Instrument au singulier dans « sonna de la trompette »
    rationale: Le grec ἐσάλπισαν désigne l’action de sonner des trompettes sans en préciser le nombre; dans ce cadre collectif, « fit retentir les trompettes » est plus idiomatique en français et restitue mieux l’action.
  - severity: low
    issue: Lien circonstanciel « pour le relèvement »
    rationale: La préposition ἐπί suivie du datif situe la louange à l’occasion de l’érection/restauration; « à l’occasion du » maintient cette relation sans imposer une causalité ou un but plus étroit.
